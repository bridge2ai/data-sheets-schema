# that table excludes as invalid (#3548). `relocated` is the label: true where the final
# full record restates the value's content (reworded, moved or split), whatever
# its role or standing there; false where it does not. Labelled by the implementer
# while the prototype's scores were visible, so not blind. Drawn at random
