# source rating file and JSON path, no classes),
# notes/q19_recommendations_3831_rubric.md (the module docstring's ordered
# test with every example sentence, per-class count and pin removed), and
# the 84 rating files the packet's 124 sources name, copied under
# q19_sources/ at the same relative paths, byte-identical to this checkout's
# (each compared with cmp on 2026-09-30). Those files carry the ratings'
# weaknesses, issues and quality notes, which step 3b asks about, and no
# first-reader class. The reader reports reading only the rubric, the packet
# and those files; that it did not see the pins, the module docstring,
