bundles:
  - project: AI_READI
    software_version: >-
      No processing software is stated with a version. The one software version is FAIRSCAPE 1.2.1,
      recorded in the RO-Crate as the metadata packager. Every other version cue is a dataset release,
      a standard (CDS v0.1.1) or a license version. Software named without a version: the OMOP Data
      Quality Dashboard, REDCap and the MoCA Duo app.
    parent_dataset: >-
      None. Versions 1.0.0 and 2.0.0 are earlier releases of the same dataset, and the subcrates are
      its parts.
  - project: CHORUS
    software_version: >-
      None. The bundle's only version-like tokens are a row count ("1.6 Billion") and a license
      (Apache-2.0). Software named without a version: the OHNLP toolkit, the OHDSI tool stack and the
      chorus-ai GitHub repositories.
    parent_dataset: >-
      None. The bundle names clinical source systems (EHR, PACS, bedside monitors, EEG databases),
      which is lineage in text form (#1349).
  - project: CM4AI
    software_version: >-
      Every stated software version belongs to the companion U2OS analyses (the Nature paper and the
      preprint's exploratory structure modelling), not to the releases' processing; recording one as
      the releases' software would move a fact across scope. Software named for the releases without a
      version: FAIRSCAPE and the MuSIC/Cell Mapping Toolkit pipeline. The Dataverse pages' footers give
      the hosting platform's version (v. 6.6, v. 6.9), the host's software, not the releases'.
    parent_dataset: >-
      None. The releases are "derived from commercially available de-identified human cell lines", a
      biological source; the lineage graphs are files the bundle names but does not contain.
  - project: VOICE
    software_version: >-
      One: b2aiprep v3.0.0 generated the v3.0.0 and v3.1.0 releases. Tools named without a version:
      openSMILE, Praat, parselmouth, torchaudio, sparc, ppgs, Whisper Large and SenseLab. "TorchAudio
      2.1" is a paper title, BIDS v1.9.0 a standard, and Python 3.12.0 a badge on the documentation
      repository.
    parent_dataset: >-
      None. The pediatric dataset is related but distinct (source manifest scope), and the features
      are derived from raw audio inside the dataset.
