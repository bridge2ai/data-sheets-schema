# Hand adjudication of the recall-target bundles (#3289).
#
# Read by scripts/recall_target_baseline.py and rendered into
# notes/recall_target_baseline.md; edit this file, never the note, and
# regenerate. It answers one question the baseline's zeros leave open:
# do the bundles state software versions, used software and parent
# datasets that the records leave out (omission), or do they not state them
# (a bundle fact)? It is a reading, not a measurement; what the script
# measures against it is stated beside each table in the note.
#
# `chunks`: every lexical candidate (#2930) with a version or lineage cue,
# keyed on the sha256 of the chunk text (the chunk manifests' `sha256`), so
# a verdict applies to those bytes only. A candidate whose text has no entry
# is listed in the note as not adjudicated; an entry no candidate matches is
# listed as unmatched. Verdicts:
#   software_version: none      -- the version cue is not a software version
#                                  (a dataset release, a standard, DOI digits)
#                     referent  -- a software version stated as used for the
#                                  dataset the record describes
#                     companion -- a software version stated for an analysis
#                                  the bundle documents but does not say was
#                                  applied to the referent's released data
#                     cited     -- a versioned software citation with no
#                                  stated use for the referent's release
#   parent_dataset:   none | stated -- a dataset the referent is part of or
#                                  derived from (`parent_datasets`,
#                                  schema:isPartOf). Earlier releases are the
#                                  same dataset (source manifest `scope`), and
#                                  a biological or clinical source is lineage
#                                  in text form, not a parent dataset (#1349).
#
# `facts`: each versioned software statement found in the four bundles,
# searched in full, not only in the candidates: every line carrying a
# version-shaped token ("v1.2", "v. 1.2", "(Version 1.2)", "version 1.2",
# "Name 1.2") was read, and a citation of versioned software is a fact like
# a use of it (review of #3534 found two the first reading missed). Not facts:
# dataset releases, standards and schemas, licenses, database releases
# (CORUM, HPA, BioPlex, NDEx), paper titles ("TorchAudio 2.1", "SciPy 1.0"),
# a documentation repository's badge (Python 3.12.0) and the hosting
# platform's own version in the CM4AI Dataverse pages' footers ("Powered by
# v. 6.6 build ...", "v. 6.9"), which is the host's software, not the
# releases'. `snippet` is verbatim from
# the bundle (whitespace collapsed); the script checks it is in the bytes
# each record hashed and looks for `names` with `version` in the record.
# `scope` takes the software_version values above other than none.
#
# `bundles`: the answer per project, rendered as written.

