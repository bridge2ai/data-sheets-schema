reasons:
  q19r-001:
    basis: comment
    reason: ethical_reviews holds the USF IRB and Canadian REB reviews, and the rating's note on it says
      "no conflicts-of-interest statement"
  q19r-006:
    basis: comment
    reason: '"consider embedding the RO-Crate lineage as a provenance graph" asks for a change to a release
      artifact the record points at, not to a value the record holds; it gives the slots'' content as
      doi:10.60775/fairhub.2 and the lineage a graph of its own. Round 4 (#3836): "the RO-Crate lineage"
      is to become a graph of its own, not what the parent_datasets/was_derived_from it asks for are to
      hold'
  q19r-011:
    basis: comment
    reason: preprocessing_strategies names b2aiprep, openSMILE, sparc, ppgs and Whisper, which the rating
      says carry no version ("No tool carries a version number"), and external_resources, which it faults
      for not listing the feasibility publication and white paper
  q19r-013:
    basis: comment
    reason: preprocessing_strategies and machine_annotation_tools name sparc, openSMILE, Praat, Parselmouth,
      ppgs and Whisper, which "have neither version nor URL"
  q19r-050:
    basis: comment
    reason: source_caveats discloses the 419,614-byte residual, which the rating calls "stated but unexplained"
  q19r-065:
    basis: comment
    reason: was_derived_from holds the study's name in prose, as its rating's own evidence quotes; "keeping
      the study-name prose in notes" says where content is to go (the value was_derived_from holds, moving
      to notes), not where a slot's content is now
  q19r-092:
    basis: comment
    reason: file_collections lists ten archives and conforms_to claims an RO-Crate provenance graph, and
      the rating says no listed archive is stated to carry it
  q19r-093:
    basis: comment
    reason: variables holds four columns ("enumerates only four columns")
  q19r-115:
    basis: reconstructed
    reason: 'no comment names this pin; its rating (issues_detected[12]) says "publisher is absent", so
      the sentence names no value the record holds and step 3a fails: a request'
  q19r-118:
    basis: comment
    reason: the text formats are listed with no encoding, which the rating records as a warning
  q19r-121:
    basis: comment
    reason: file_collections lists ten collections, and the rating says "no collection carries a was_generated_by"
