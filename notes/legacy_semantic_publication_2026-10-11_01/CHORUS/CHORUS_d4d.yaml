sensitive_elements:
- sensitivity_details: CHoRUS operates within a secure enclave environment aligned
    with NIST 800-53 controls.
- sensitivity_details: De-identification consistent with HIPAA Safe Harbor
- sensitivity_details: Removal or tokenization of direct identifiers
- sensitivity_details: Date shifting or limited date fields when required
- sensitivity_details: Role-based access control (RBAC)
- sensitivity_details: Multi-factor authentication
- sensitivity_details: Full audit logging of data access and queries
- sensitivity_details: Prohibition of re-identification attempts
- sensitivity_details: Data export restrictions and output review procedures to reduce
    risk of re-identification
- sensitivity_details: Re-identification risk is periodically assessed and mitigation
    strategies updated as needed.
