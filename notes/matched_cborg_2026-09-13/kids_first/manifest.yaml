    - Kids First Data Resource
scope:
  KIDS_FIRST:
    referent: the Kids First Data Resource as a collection of pediatric genomic and
      clinical studies
    referent_id: https://kidsfirstdrc.org/
    referent_note: Resource-level documentation. The captured DRC catalogue enumerates
      36 distinct dbGaP studies. Keep study-specific populations, eligibility, releases,
      consent/access and data issues distinct. NIH award-abstract pages also describe
      funded projects; funding alone does not establish release. The nominated AJHG
      article is represented by its metadata and abstract; full text was unavailable.
