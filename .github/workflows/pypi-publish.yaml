---
name: Publish Python Package

on:
  release:
    types: [created]

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry self add "poetry-dynamic-versioning[plugin]"
        # uses: snok/install-poetry@v1.1.6
        # with:
        #   virtualenvs-create: true
        #   virtualenvs-in-project: true

      # - name: Install dependencies
      #   run: poetry install --no-interaction

      - name: Install the project
        run: poetry install --no-interaction

      # The release canary (#1301): builds the wheel, installs it into a fresh
      # virtual environment, and runs the offline generation path from a
      # directory that is neither a checkout nor holds a pyproject.toml.
      - name: Install the wheel elsewhere and generate from there
        run: D4D_INSTALL_TESTS=1 poetry run pytest tests/test_installed_wheel.py -q

      - name: Build source and wheel archives
        run: poetry build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@v1.2.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}
