# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
# https://github.com/snok/install-poetry#workflows-and-tips
#
# Two lanes (#1203). A pull request runs the suite once, on one interpreter,
# without the tests that walk the committed corpus: those check the data, not
# the change, and a pull request that touches neither gains nothing from
# running them three times. Merging to `main` — and a manual dispatch — runs
# everything on every supported interpreter, the corpus tests and the schema
# and example builds included. Wall time for a pull request is one job, not
# the slowest of three.
---
name: Build and test data_sheets_schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # Every pull request: the fast lane.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # `fairscape_models` is a git submodule imported by
      # `src/fairscape_integration`, not a pip dependency (#926).
      - name: Initialise the FAIRSCAPE models submodule
        run: git submodule update --init fairscape_models

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.3
        with:
          virtualenvs-in-project: true

      # The environment is a function of the lock file; rebuilding it on every
      # run is a minute nobody needed to spend.
      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      # -v: the log names each test as it starts, so a runner that dies
      # mid-suite still says which test was running. `--durations` keeps the
      # slowest tests visible so the next regression is seen, not felt.
      # `make test` builds the merged schema before pytest, because
      # `test-schema` depends on it; the runner's schema-sync gate then
      # compares a freshly built file against a freshly built file. Running
      # pytest directly skipped that and nine runner tests failed on
      # "the merged schema is not built from the current source" — the
      # committed merged schema does not reproduce byte-for-byte under the
      # runner's own linkml, and `make` was quietly rebuilding it. Kept
      # explicit here rather than inherited, so the dependency is visible;
      # whether the committed file should reproduce is #1208.
      - name: Build the merged schema, as make test does
        run: make full-schema

      # `-n auto` across the runner's cores. Measured on a 4-core machine with
      # the #1203 caches: 15 min serial, 5 min 52 s on four workers, same
      # 3,094 passing. `-v` names each test as it starts, so a runner that
      # dies mid-suite still says which test was running; `--durations` keeps
      # the slowest visible, so the next regression is seen rather than felt.
      - name: Run the suite without the corpus walks
        run: poetry run pytest tests -v -p no:cacheprovider --durations=25 -n auto -m "not corpus"

  # Merge to main, or on demand: everything, everywhere.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The full suite took ~25 min on a laptop and longer here (#926). Without a
    # limit of our own the job ran until the runner was shut down, which
    # reads as an infrastructure failure rather than a slow suite.
    timeout-minutes: 150
    strategy:
      # One interpreter failing must not cancel the others: the cancelled
      # jobs are exactly the evidence of whether the failure is version-bound.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialise the FAIRSCAPE models submodule
        run: git submodule update --init fairscape_models

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1.3
        with:
          virtualenvs-in-project: true

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run the whole of make test
        run: make test PYTEST_ARGS="-v -n auto"
