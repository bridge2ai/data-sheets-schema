# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
# https://github.com/snok/install-poetry#workflows-and-tips
---
name: Build and test data_sheets_schema

on: [pull_request]

jobs:
  test:

    runs-on: ubuntu-latest
    # The suite takes ~25 min on a laptop and longer here (#926). Without a
    # limit of our own the job ran until the runner was shut down, which
    # reads as an infrastructure failure rather than a slow suite.
    timeout-minutes: 150
    strategy:
      # One interpreter failing must not cancel the others: the cancelled
      # jobs are exactly the evidence of whether the failure is version-bound.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:

      - name: Check out repository
        uses: actions/checkout@v5

      # `fairscape_models` is a git submodule imported by
      # `src/fairscape_integration`, not a pip dependency. An un-initialised
      # submodule is an empty directory, and every RO-Crate test then fails on
      # `No module named 'fairscape_models.rocrate'` (#926). `aurelian` is not
      # imported by the suite and stays uninitialised.
      - name: Initialise the FAIRSCAPE models submodule
        run: git submodule update --init fairscape_models

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1.3

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      # #1208: the schema-sync gate fails on the runner and passes locally,
      # and a Linux container reproduces the committed merged schema
      # byte-for-byte, so the generator is not the difference. Print what the
      # gate actually sees, once, rather than guessing again.
      - name: What the schema-sync gate sees
        run: |
          poetry run python - <<'PY'
          import difflib, hashlib, pathlib, subprocess, sys
          sys.path.insert(0, "src")
          from data_sheets_schema import schema_sync
          for row in schema_sync.check():
              print(f"=== {row['class']}: {row['status']} — {row.get('reason', '')}")
              print(f"    digest live={row.get('digest')} rebuilt={row.get('digest_rebuilt')}")
              kept = row.get("rebuilt_at")
              if not kept:
                  continue
              merged = pathlib.Path(row["merged"])
              a = merged.read_bytes(); b = pathlib.Path(kept).read_bytes()
              print(f"    committed {len(a)} bytes sha {hashlib.sha256(a).hexdigest()[:16]}")
              print(f"    rebuilt   {len(b)} bytes sha {hashlib.sha256(b).hexdigest()[:16]}")
              d = list(difflib.unified_diff(a.decode().splitlines(), b.decode().splitlines(),
                                            "committed", "rebuilt", n=1, lineterm=""))
              print(f"    diff lines: {len(d)}")
              print("\n".join("    " + x for x in d[:40]))
          PY
        continue-on-error: true

      - name: Run test suite
        # -v: the log names each test as it starts, so a runner that dies
        # mid-suite (memory, a hang) still says which test was running.
        run: make test PYTEST_ARGS=-v
