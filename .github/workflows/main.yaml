# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
# https://github.com/snok/install-poetry#workflows-and-tips
---
name: Build and test data_sheets_schema

on: [pull_request]

jobs:
  test:

    runs-on: ubuntu-latest
    # The suite takes ~25 min on a laptop and longer here (#926). Without a
    # limit of our own the job ran until the runner was shut down, which
    # reads as an infrastructure failure rather than a slow suite.
    timeout-minutes: 150
    strategy:
      # One interpreter failing must not cancel the others: the cancelled
      # jobs are exactly the evidence of whether the failure is version-bound.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:

      - name: Check out repository
        uses: actions/checkout@v5

      # `fairscape_models` is a git submodule imported by
      # `src/fairscape_integration`, not a pip dependency. An un-initialised
      # submodule is an empty directory, and every RO-Crate test then fails on
      # `No module named 'fairscape_models.rocrate'` (#926). `aurelian` is not
      # imported by the suite and stays uninitialised.
      - name: Initialise the FAIRSCAPE models submodule
        run: git submodule update --init fairscape_models

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1.3

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run test suite
        # -v: the log names each test as it starts, so a runner that dies
        # mid-suite (memory, a hang) still says which test was running.
        run: make test PYTEST_ARGS=-v
