name: "Run script to update the D4D Synapse table"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/html/output/*'
      - 'utils/d4d_to_synapse_table.py'
      - '.github/workflows/d4d_to_synapse_table.yml'

permissions:
  contents: read

# Replacements must not interleave against the same Synapse table.
concurrency:
  group: d4d-synapse-publish
  cancel-in-progress: false

jobs:
  update_d4d_table:
    name: Run script to update synapse tables with data changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1.3.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Publish complete v8 selection and verify Synapse content
        run: poetry run python utils/d4d_to_synapse_table.py
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
