name: Manual Deploy Documentation
on:
  workflow_dispatch:

# Both documentation workflows publish the same branch. Acquire the group
# before checkout so each publisher sees the previous deployment's commit.
concurrency:
  group: documentation-gh-pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up the cached project environment
        uses: ./.github/actions/setup-project
        with:
          python-version: "3.12"

      - name: Build documentation.
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          make gendoc
          ([ ! -f docs/about.md ] && cp src/docs/about.md docs/) || true
          
      - name: List docs directory structure
        run: |
          echo "=== docs/ directory structure ==="
          ls -laR docs/html_output/ docs/yaml_output/ || true
          
      - name: Deploy to GitHub Pages
        run: make mkd-gh-deploy
