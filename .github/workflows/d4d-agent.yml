name: D4D AI Assistant GitHub Mentions

permissions:
  contents: read

# Queue repeats for one item without cancelling an attempt that may have spent.
concurrency:
  group: d4d-assistant-${{ github.event.issue.number || github.event.pull_request.number || inputs.item-number || github.run_id }}
  cancel-in-progress: false

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      item-type:
        description: 'Type of item (issue or pull_request)'
        required: true
        type: choice
        options:
          - issue
          - pull_request
      item-number:
        description: 'Issue or PR number'
        required: true
        type: number

jobs:
  check-mention:
    # Most issue/PR edits are bookkeeping. Avoid allocating a runner when
    # the relevant body has no mention. This is only a cheap first gate: a
    # handle quoted in prose or code passes it too. The steps below authorize
    # the author, and "Read the request" decides whether the text holds a
    # request (#4108). Manual dispatch still searches comments.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@d4dassistant')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@d4dassistant')) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(github.event.comment.body, '@d4dassistant'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # 'true' only when "Read the request" ran (an allowed author) and found one
      qualified-mention: ${{ steps.request.outputs.request }}
      dataset: ${{ steps.request.outputs.dataset }}
      user: ${{ steps.detect.outputs.user }}
      item-type: ${{ steps.detect.outputs.item-type }}
      item-number: ${{ steps.detect.outputs.item-number }}
      controllers: ${{ steps.detect.outputs.controllers }}
      trusted-sha: ${{ steps.detect.outputs.gate-base-sha }}
      target-branch: ${{ steps.detect.outputs.gate-base-branch }}
      source-sha: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect AI mention
        id: detect
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // The checkout supplies dataset directories, never gate authority (#4392).
            // Resolve once, then read both gate files from that immutable commit.
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            let gateSha;
            let gateBranch;
            if (context.eventName === 'pull_request' || context.eventName === 'pull_request_review_comment') {
              gateSha = context.payload.pull_request?.base?.sha;
              gateBranch = context.payload.pull_request?.base?.ref;
            } else {
              const repository = await github.rest.repos.get(context.repo);
              gateBranch = repository.data.default_branch;
              const branch = await github.rest.repos.getBranch({
                ...context.repo, branch: repository.data.default_branch
              });
              gateSha = branch.data.commit.sha;
            }
            if (typeof gateSha !== 'string' || !/^[0-9a-f]{40}$/.test(gateSha)) {
              throw new Error('No immutable trusted base commit for the request gate');
            }
            if (typeof gateBranch !== 'string' || !gateBranch || /[\r\n]/.test(gateBranch)) {
              throw new Error('No trusted base branch for publication');
            }
            async function gateFile(filePath) {
              const response = await github.rest.repos.getContent({
                ...context.repo, path: filePath, ref: gateSha
              });
              const file = response.data;
              if (!file || file.type !== 'file' || file.path !== filePath || file.encoding !== 'base64' ||
                  typeof file.content !== 'string' || !Number.isSafeInteger(file.size) || file.size < 0) {
                throw new Error('Trusted gate file has an unsupported response: ' + filePath);
              }
              const encoded = file.content.replace(/\s/g, '');
              const bytes = Buffer.from(encoded, 'base64');
              const blob = crypto.createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
              if (bytes.toString('base64') !== encoded || bytes.length !== file.size || blob !== file.sha) {
                throw new Error('Trusted gate file bytes do not match its blob: ' + filePath);
              }
              return bytes;
            }
            const [controllers, parser] = await Promise.all([
              gateFile('.github/ai-controllers.json'), gateFile('src/github/assistant_request.py')
            ]);
            const allowedUsers = JSON.parse(controllers.toString('utf8'));
            if (!Array.isArray(allowedUsers) || !allowedUsers.every(user => typeof user === 'string')) {
              throw new Error('Trusted controller list must be an array of usernames');
            }
            const gateDirectory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'd4d-assistant-gate-'));
            const gateParser = path.join(gateDirectory, 'assistant_request.py');
            fs.writeFileSync(gateParser, parser, {flag: 'wx', mode: 0o600});
            core.setOutput('gate-parser', gateParser);
            core.setOutput('gate-base-sha', gateSha);
            core.setOutput('gate-base-branch', gateBranch);
            console.log('Request gate base commit: ' + gateSha);
            // Missing base files intentionally fail closed, including while a
            // PR is introducing this parser. Never fall back to candidate code.

            // Get content and user from event payload
            let content = '';
            let userLogin = '';
            let itemType = '';
            let itemNumber = 0;
            let selection = {kind: 'single'};

            if (context.eventName === 'workflow_dispatch') {
              // Manual trigger - fetch the issue/PR from GitHub API
              itemType = context.payload.inputs['item-type'];
              itemNumber = parseInt(context.payload.inputs['item-number']);
              userLogin = context.actor; // Use the person who triggered the workflow

              if (itemType === 'issue') {
                const issue = await github.rest.issues.get({
                  ...context.repo, issue_number: itemNumber
                });
                content = issue.data.body || '';
              } else if (itemType === 'pull_request') {
                const pr = await github.rest.pulls.get({
                  ...context.repo, pull_number: itemNumber
                });
                content = pr.data.body || '';
              }
              selection = {kind: 'manual', comments: []};
              if (allowedUsers.includes(userLogin)) {
                // Preserve body-first policy using the same trusted parser.
                // A substring (including quoted or differently cased text)
                // cannot decide whether comment discovery is needed (#4394).
                const probe = path.join(gateDirectory, 'body-probe.md');
                fs.writeFileSync(probe, content, {flag: 'wx'});
                const {execFileSync} = require('child_process');
                const parsed = JSON.parse(execFileSync('python3', [
                  '-I', '-S', gateParser, '--inputs', 'data/sheets_d4dassistant/inputs',
                  '--body', probe, '--decision-json'
                ], {encoding: 'utf8'}));
                if (!parsed || Object.keys(parsed).sort().join(',') !== 'dataset,line,request' ||
                    typeof parsed.request !== 'boolean' ||
                    (parsed.request ? typeof parsed.dataset !== 'string' ||
                      !Number.isSafeInteger(parsed.line) || parsed.line < 1 :
                      parsed.dataset !== null || parsed.line !== null)) {
                  throw new Error('Trusted body parser returned an invalid decision');
                }
                if (!parsed.request) {
                  // The API lists conversation comments in creation order.
                  // Retain every page; the parser selects newest valid first.
                  const seen = new Set();
                  for (let page = 1; ; page++) {
                    const response = await github.rest.issues.listComments({
                      ...context.repo, issue_number: itemNumber, per_page: 100, page
                    });
                    const comments = response.data;
                    if (!Array.isArray(comments) || comments.length > 100) {
                      throw new Error('Comment page has an invalid shape');
                    }
                    for (const comment of comments) {
                      if (!comment || !Number.isSafeInteger(comment.id) || comment.id < 1 ||
                          seen.has(comment.id) ||
                          (comment.body !== null && typeof comment.body !== 'string')) {
                        throw new Error('Comment identity or body is invalid');
                      }
                      seen.add(comment.id);
                      selection.comments.push({id: comment.id, body: comment.body || ''});
                    }
                    if (comments.length < 100) break;
                  }
                }
              }
            } else if (context.eventName === 'issues') {
              content = context.payload.issue.body || '';
              userLogin = context.payload.issue.user.login;
              itemType = 'issue';
              itemNumber = context.payload.issue.number;
            } else if (context.eventName === 'pull_request') {
              content = context.payload.pull_request.body || '';
              userLogin = context.payload.pull_request.user.login;
              itemType = 'pull_request';
              itemNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'issue_comment') {
              content = context.payload.comment.body || '';
              userLogin = context.payload.comment.user.login;
              itemType = 'issue';
              itemNumber = context.payload.issue.number;
            } else if (context.eventName === 'pull_request_review_comment') {
              content = context.payload.comment.body || '';
              userLogin = context.payload.comment.user.login;
              itemType = 'pull_request';
              itemNumber = context.payload.pull_request.number;
            }

            // Only a changed parsed request can qualify an edited body (#4391).
            // Missing body changes mean bookkeeping; malformed history refuses.
            if (context.eventName !== 'workflow_dispatch' && context.payload.action === 'edited') {
              const changes = context.payload.changes;
              if (changes !== undefined && changes !== null &&
                  (typeof changes !== 'object' || Array.isArray(changes))) {
                throw new Error('Edited event changes have an invalid shape');
              }
              if (!changes || !Object.prototype.hasOwnProperty.call(changes, 'body')) {
                selection = {kind: 'unchanged'};
              } else {
                const previous = changes.body;
                if (!previous || typeof previous !== 'object' || Array.isArray(previous) ||
                    typeof previous.from !== 'string') {
                  throw new Error('Edited body has no valid previous text');
                }
                selection = {kind: 'edited', before: previous.from};
              }
            }

            // Check if user is allowed. Whether the text holds a request is
            // decided by the next step, which reads it from this file (#4108).
            const isAllowed = allowedUsers.includes(userLogin);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/assistant-request-text.md`, content);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/assistant-request-selection.json`,
              JSON.stringify(selection), {flag: 'wx'});

            console.log(`User: ${userLogin}, Allowed: ${isAllowed}, Content: "${content}"`);

            // Set outputs
            core.setOutput('allowed', isAllowed);
            core.setOutput('user', userLogin);
            core.setOutput('item-type', itemType);
            core.setOutput('item-number', itemNumber);
            core.setOutput('controllers', allowedUsers.map(u => '@' + u).join(', '));

            return {
              allowed: isAllowed,
              itemType,
              itemNumber,
              user: userLogin,
              controllers: allowedUsers.map(u => '@' + u).join(', ')
            };

      # The authoritative decision (#4108). A request is one line with a blank
      # line, or the start or end of the text, on each side: the assistant's
      # handle at the very start of the line, then the name of one directory
      # under data/sheets_d4dassistant/inputs/ and nothing else, outside code
      # spans, fenced code, quotes and HTML blocks, and after no raw HTML that
      # is left open. Anything else (a handle quoted in prose or code, an
      # unknown dataset, extra words) logs "no request" and runs nothing. The
      # rules are in the script's docstring.
      - name: Read the request
        id: request
        if: steps.detect.outputs.allowed == 'true'
        env:
          TRUSTED_REQUEST_PARSER: ${{ steps.detect.outputs.gate-parser }}
        run: >-
          python3 -I -S "$TRUSTED_REQUEST_PARSER"
          --inputs data/sheets_d4dassistant/inputs
          --body "$RUNNER_TEMP/assistant-request-text.md"
          --selection "$RUNNER_TEMP/assistant-request-selection.json"
          --github-output "$GITHUB_OUTPUT"

  respond-to-mention:
    needs: check-mention
    if: needs.check-mention.outputs.qualified-mention == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: trusted
    outputs:
      label: ${{ steps.resolve.outputs.label }}
      preparation: ${{ steps.resolve.outcome }}
      generation: ${{ steps.generate.outcome }}
      validation: ${{ steps.validate.outcome }}
      archive: ${{ steps.archive.outcome }}
      attempt-id: ${{ steps.identity.outputs.attempt-id }}
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Freeze generation attempt identity
        id: identity
        working-directory: ${{ runner.temp }}
        env:
          ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '%s\n' "attempt-id=$ATTEMPT_ID" "artifact-name=d4d-assistant-$ATTEMPT_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted generation implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-mention.outputs.trusted-sha }}
          path: trusted
          persist-credentials: false

      # This checkout contributes documents only. Never install its package or
      # execute its scripts, even when a PR adds the requested input directory.
      - name: Checkout source documents
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-mention.outputs.source-sha }}
          path: source
          sparse-checkout: data/sheets_d4dassistant/inputs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check explicit provider configuration
        id: provider
        env:
          CBORG_API_KEY: ${{ secrets.CBORG_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CBORG_API_KEY" || { echo '::error::Configure CBORG_API_KEY for the registered CBORG route'; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        id: install
        run: |
          pipx install poetry==2.4.3
          poetry install --no-interaction

      - name: Resolve dataset from the request
        id: resolve
        env:
          DATASET: ${{ needs.check-mention.outputs.dataset }}
          PROVIDER: cborg
          SOURCE_SHA: ${{ needs.check-mention.outputs.source-sha }}
          TRUSTED_SHA: ${{ needs.check-mention.outputs.trusted-sha }}
          ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          poetry run python src/github/assistant_generation.py \
            --inputs-root "$GITHUB_WORKSPACE/source/data/sheets_d4dassistant/inputs" \
            --source-checkout "$GITHUB_WORKSPACE/source" \
            --dataset "$DATASET" --source-commit "$SOURCE_SHA" \
            --trusted-commit "$TRUSTED_SHA" --attempt-id "$ATTEMPT_ID" \
            --attempt-dir "$RUNNER_TEMP/assistant-attempt-$ATTEMPT_ID" \
            --provider "$PROVIDER" --limits .github/assistant-generation-limits.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate datasheet
        id: generate
        env:
          # Only the user-selected CBORG route may be used. The legacy direct
          # Anthropic credential cannot win the shared client's precedence.
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_BASE_URL: ''
          CBORG_API_KEY: ${{ secrets.CBORG_API_KEY }}
          DATASET: ${{ needs.check-mention.outputs.dataset }}
          LABEL: ${{ steps.resolve.outputs.label }}
          OUTPUT_DIR: ${{ steps.resolve.outputs.output-dir }}
          REGISTRATION: ${{ steps.resolve.outputs.registration }}
        run: |
          set -euo pipefail
          poetry run d4d api run \
            --project "$DATASET" --label "$LABEL" --out-dir "$OUTPUT_DIR" \
            --condition generic_v10 --shared-generation-version 1 \
            --shared-generation-registration "$REGISTRATION" \
            --yes

      - name: Validate against the schema
        id: validate
        env:
          DATASET: ${{ needs.check-mention.outputs.dataset }}
          OUTPUT_DIR: ${{ steps.resolve.outputs.output-dir }}
          ATTEMPT_DIR: ${{ steps.resolve.outputs.attempt-dir }}
        run: |
          set -euo pipefail
          poetry run linkml-validate \
            -s src/data_sheets_schema/schema/data_sheets_schema_all.yaml \
            -C Dataset "$OUTPUT_DIR/${DATASET}_d4d.yaml"
          poetry run linkml-validate \
            -s src/data_sheets_schema/schema/data_sheets_schema_core_all.yaml \
            -C CoreDataset "$OUTPUT_DIR/${DATASET}_d4d_core.yaml"
          printf '%s\n' 'Full and core passed the pinned trusted schema validation.' > "$ATTEMPT_DIR/validation.txt"

      - name: Record attempt outcome
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DATASET: ${{ needs.check-mention.outputs.dataset }}
          TRUSTED_SHA: ${{ needs.check-mention.outputs.trusted-sha }}
          SOURCE_SHA: ${{ needs.check-mention.outputs.source-sha }}
          PROVIDER_RESULT: ${{ steps.provider.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          PREPARATION_RESULT: ${{ steps.resolve.outcome }}
          GENERATION_RESULT: ${{ steps.generate.outcome }}
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          ATTEMPT_DIR="$RUNNER_TEMP/assistant-attempt-$ATTEMPT_ID"
          mkdir -p "$ATTEMPT_DIR"
          printf '%s\n' "attempt=$ATTEMPT_ID" "dataset=$DATASET" \
            "trusted_commit=$TRUSTED_SHA" "source_commit=$SOURCE_SHA" \
            "provider=cborg" "provider_configuration=$PROVIDER_RESULT" \
            "install=$INSTALL_RESULT" "preparation=$PREPARATION_RESULT" \
            "generation=$GENERATION_RESULT" "validation=$VALIDATION_RESULT" \
            > "$ATTEMPT_DIR/workflow_outcome.txt"

      - name: Preserve complete attempt evidence
        id: archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: ${{ runner.temp }}/assistant-attempt-${{ steps.identity.outputs.attempt-id }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [check-mention, respond-to-mention]
    if: needs.respond-to-mention.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pr.outputs.url }}
    steps:
      # Publication gets a separate runner and credential. It never installs or
      # runs the input checkout, generated YAML, or any downloaded artifact.
      - name: Checkout trusted publication base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-mention.outputs.trusted-sha }}
          token: ${{ secrets.PAT_FOR_PR }}

      - name: Download checked attempt
        uses: actions/download-artifact@v4
        with:
          # Rerun-failed-jobs increments run_attempt without rerunning a
          # successful generation job. Consume that producer's frozen identity.
          name: ${{ needs.respond-to-mention.outputs.artifact-name }}
          path: ${{ runner.temp }}/assistant-evidence

      - name: Open a pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_PR }}
          DATASET: ${{ needs.check-mention.outputs.dataset }}
          LABEL: ${{ needs.respond-to-mention.outputs.label }}
          ITEM_NUMBER: ${{ needs.check-mention.outputs.item-number }}
          ATTEMPT_ID: ${{ needs.respond-to-mention.outputs.attempt-id }}
          TARGET_BRANCH: ${{ needs.check-mention.outputs.target-branch }}
          TRUSTED_SHA: ${{ needs.check-mention.outputs.trusted-sha }}
          SOURCE_SHA: ${{ needs.check-mention.outputs.source-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Only parsed safe names and the adapter's run-unique label may form paths.
          if ! [[ "$DATASET" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || \
             ! [[ "$LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo '::error::Unsafe dataset or attempt label'
            exit 1
          fi
          EVIDENCE="$RUNNER_TEMP/assistant-evidence"
          test -f "$EVIDENCE/validation.txt"
          test -f "$EVIDENCE/authority/registration.json"
          test -f "$EVIDENCE/outputs/${DATASET}_d4d.yaml"
          test -f "$EVIDENCE/outputs/${DATASET}_d4d_core.yaml"
          # Evidence is data. Refuse links or special files before copying it
          # into a checkout that holds the publication credential.
          if find "$EVIDENCE" ! -type d ! -type f -print -quit | grep -q .; then
            echo '::error::Attempt artifact contains a nonregular member'
            exit 1
          fi
          DEST="data/sheets_d4dassistant/attempts/${DATASET}/${LABEL}"
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R "$EVIDENCE" "$DEST"
          BRANCH="d4dassistant/${DATASET}-${ATTEMPT_ID}"
          git config user.name  "d4dassistant"
          git config user.email "d4dassistant@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Runtime logs/progress can match repository-wide ignore patterns.
          # Force only this already checked attempt, never the wider checkout.
          git add --force -- "$DEST"
          git commit -m "Add ${DATASET} assistant attempt ${ATTEMPT_ID}"
          EXPECTED_TREE=$(git rev-parse 'HEAD^{tree}')
          # A publication-only retry must not regenerate or overwrite evidence.
          # Reuse a prior push only when both its base and complete tree match.
          REMOTE=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          if [ -n "$REMOTE" ]; then
            git fetch --no-tags origin "refs/heads/$BRANCH"
            PUBLISHED_SHA=$(git rev-parse FETCH_HEAD)
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$EXPECTED_TREE" || { echo '::error::Existing attempt branch has different evidence'; exit 1; }
            test "$(git show -s --format=%P FETCH_HEAD)" = "$TRUSTED_SHA" || { echo '::error::Existing attempt branch has a different base'; exit 1; }
          else
            git push -u origin "$BRANCH"
            PUBLISHED_SHA=$(git rev-parse HEAD)
          fi
          BODY="$RUNNER_TEMP/assistant-pr-body.md"
          cat > "$BODY" <<EOF
          Generated ${DATASET} from repository documentation in response to #${ITEM_NUMBER}.

          This attempt explicitly selects shared_generation_v1 (generic_v10, renderer 25, API playbook 2 and receipt completion 2), using the canonical API renderer. Trusted implementation/schema commit: ${TRUSTED_SHA}; source-document commit: ${SOURCE_SHA}.

          Full and core YAML passed Dataset and CoreDataset validation. The complete attempt is retained at ${DEST}, including pinned input/schema/selection authority, ingestion and chunk manifests, receipts, audit records, usage and provenance. Original absolute registration paths are preserved as evidence; an archived registration is not a new run authorization.

          Schema and protocol checks do not establish scientific correctness. Review source support before merging. [Run and artifact](${RUN_URL}).
          EOF
          URL=$(gh pr list --state all --head "$BRANCH" --base "$TARGET_BRANCH" \
            --json url,headRefOid --jq "[.[] | select(.headRefOid == \"$PUBLISHED_SHA\")][0].url // empty")
          if [ -z "$URL" ]; then
            URL=$(gh pr create \
              --title "Add ${DATASET} datasheet (assistant ${ATTEMPT_ID})" \
              --body-file "$BODY" --base "$TARGET_BRANCH" --head "$BRANCH")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  report:
    needs: [check-mention, respond-to-mention, publish]
    if: always() && needs.check-mention.outputs.qualified-mention == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report back on the issue
        uses: actions/github-script@v7
        env:
          DATASET: ${{ needs.check-mention.outputs.dataset }}
          ITEM_NUMBER: ${{ needs.check-mention.outputs.item-number }}
          PREPARATION: ${{ needs.respond-to-mention.outputs.preparation }}
          GENERATION: ${{ needs.respond-to-mention.outputs.generation }}
          VALIDATION: ${{ needs.respond-to-mention.outputs.validation }}
          ARCHIVE_RESULT: ${{ needs.respond-to-mention.outputs.archive }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const e = process.env;
            let body;
            if (e.PUBLISH_RESULT === 'success' && e.PR_URL) {
              body = `Generated the **${e.DATASET}** datasheet: ${e.PR_URL}`;
            } else if (e.PREPARATION !== 'success') {
              body = 'Assistant setup or complete-input registration failed before generation. Check the explicit provider/credential, supported input documents and registered limits.';
            } else if (e.GENERATION !== 'success') {
              body = 'Registered generation failed. Inspect the failing phase before requesting another billed attempt.';
            } else if (e.VALIDATION !== 'success') {
              body = 'Generated outputs failed full/core schema validation; no generated PR was published.';
            } else {
              body = 'Generation and validation passed, but evidence upload or PR publication failed. Preserve the existing attempt before retrying publication.';
            }
            body += e.ARCHIVE_RESULT === 'success'
              ? '\n\nAttempt evidence is attached to the run as an artifact.'
              : '\n\nAttempt evidence upload did not complete; inspect the run log before another attempt.';
            body += `\n\n[Run log](${e.RUN_URL}).`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: Number(e.ITEM_NUMBER), body
            });
