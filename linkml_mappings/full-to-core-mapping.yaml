id: https://w3id.org/bridge2ai/data-sheets-schema/full-to-core-mapping
title: D4D Full Dataset to CoreDataset Declarative Transformation Specification
source_schema: src/data_sheets_schema/schema/data_sheets_schema_all.yaml
target_schema: src/data_sheets_schema/schema/data_sheets_schema_core_all.yaml
comments:
  - >-
    Declarative LinkML-Map TransformationSpecification for projecting a D4D
    Dataset record into a CoreDataset record (#694, Slide 8 transformation
    receipts). Shared identity slots are copied 1:1; `resources` is projected
    recursively by id; `distributions` is constructed by projecting each
    `FileCollection` (with `total_bytes` mapped to `bytes` when `bytes` is
    absent) followed by each nested `File` under `file_collections[*].resources`;
    `dialect` is derived when all `File.dialect` entries agree on a single
    value; `conforms_to_class` and `conforms_to_schema` are set to the core
    target constants.
class_derivations:
  CoreDataset:
    populated_from: Dataset
    slot_derivations:
      acquisition_methods:
        populated_from: acquisition_methods
      addressing_gaps:
        populated_from: addressing_gaps
      annotation_analyses:
        populated_from: annotation_analyses
      anomalies:
        populated_from: anomalies
      at_risk_populations:
        populated_from: at_risk_populations
      cleaning_strategies:
        populated_from: cleaning_strategies
      collection_mechanisms:
        populated_from: collection_mechanisms
      collection_timeframes:
        populated_from: collection_timeframes
      compression:
        populated_from: compression
      confidential_elements:
        populated_from: confidential_elements
      conforms_to:
        populated_from: conforms_to
      conforms_to_class:
        expr: "'CoreDataset'"
      conforms_to_schema:
        expr: "'src/data_sheets_schema/schema/data_sheets_schema_core_all.yaml'"
      conforms_to_standard:
        populated_from: conforms_to_standard
      content_warnings:
        populated_from: content_warnings
      created_by:
        populated_from: created_by
      created_on:
        populated_from: created_on
      creators:
        populated_from: creators
      data_collectors:
        populated_from: data_collectors
      data_governance:
        populated_from: data_governance
      data_protection_impacts:
