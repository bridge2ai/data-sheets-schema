# Self-disclaimed typed-container entries (#2913): the container registry,
# the role/presence negation lexicon and the role predicates read by
# `data_sheets_schema.self_disclaimed`.
#
# Generic by construction: no dataset, consortium, programme or person name
# appears here. Every regular expression is matched case-insensitively
# against whitespace-folded text. `{role}` and `{presence}` in a cue expand
# to the alternation of the container's own `role_terms` or
# `presence_terms`, so a cue never matches another container's role.
#
# Any change to these bytes is a new instrument: bump `version`, rename the
# file, and add its sha256 to the pins in tests/test_self_disclaimed.py.
instrument: self_disclaimed
version: 1
issue: 2913

# The member's own leaves the cues read. Nested objects (an affiliation, a
# principal investigator) are other entities and are not read.
narrative:
  fields: [description, notes, source_caveats]
  suffixes: [_details]

# A finding names a member's placement when one of its paths is the member
# itself or runs through one of these leaves of it (`fields`, plus the
# container's own `placement_fields`). A finding that names only other
# leaves (prose, a count, an affiliation) is about those values, not about
# whether the entry belongs in the container.
placement:
  fields: [id, name]

containers:
  creators:
    kind: person_role
    placement_fields: [principal_investigator, credit_roles]
    role_terms: ['creators?', 'authors?', 'co-?authors?', 'authorship']
    role_verbs: ['created', 'creates', 'authored', 'produced', 'developed']
    # Check (b): a receipt snippet addressed to the member must name one.
    role_predicates: ['authors?', 'authored', 'authorship', 'co-?authors?',
                      'creat(?:or|ors|ed|es)', '(?:co-?)?principal investigators?',
                      'co-?investigators?', 'contributors?', 'developed by',
                      'produced by', 'prepared by', 'generated by']
  maintainers:
    kind: person_role
    placement_fields: [role]
    role_terms: ['maintainers?', 'hosts?', 'stewards?', 'curators?', 'custodians?']
    role_verbs: ['maintain(?:s|ed|ing)?', 'host(?:s|ed|ing)?', 'curat(?:e|es|ed|ing)',
                 'steward(?:s|ed|ing)?']
    role_predicates: ['maintain(?:s|ed|er|ers|ing|ance)?', 'host(?:s|ed|ing)?',
                      'curat(?:e|es|ed|ing|ion|or|ors)', 'steward(?:s|ship)?',
                      'custodians?']
  data_collectors:
    kind: person_role
    placement_fields: [role]
    role_terms: ['(?:data )?collectors?']
    role_verbs: ['collect(?:s|ed|ing)?', 'acquir(?:e|es|ed|ing)', 'gather(?:s|ed|ing)?']
    role_predicates: ['collect(?:s|ed|ing|ion|or|ors)?', 'acquisition', 'acquir(?:e|es|ed|ing)',
                      'recruit(?:s|ed|ing|ment)?', 'enrol(?:l)?(?:s|ed|ing|ment)?',
                      'contribut(?:e|es|ed|ing|or|ors)', 'gather(?:s|ed|ing)?']
  variables:
    kind: presence
    placement_fields: [variable_name]
    # VariableMetadata carries its prose in these free-text slots as well.
    narrative_fields: [derivation, quality_notes]
    presence_terms: ['variables?', 'data elements?', 'fields?', 'columns?', 'measures?']
  instances:
    kind: presence
    placement_fields: [instance_type]
    presence_terms: ['data types?', 'modalit(?:y|ies)', 'instances?', 'data elements?',
                     'record types?']
  splits:
    kind: presence
    presence_terms: ['splits?', 'partitions?', 'holdout(?: data)?(?: sets?)?', 'test sets?',
                     'validation sets?', 'training sets?']

# Nouns that name a role assignment rather than a particular role.
assignment_nouns: ['roles?', 'titles?', 'categor(?:y|ies)', 'designations?', 'positions?']

# The sentence's subject is the member itself: a deictic phrase or pronoun,
# a sentence opening on a participle with the subject elided, or the
# member's own `name`/`variable_name` (added by the code).
self_reference:
  - '\b(?:this|the present|the same) (?:member|person|individual|entry|contact|organi[sz]ation|institution|group|team|body|consortium|creator|author|maintainer|collector|variable|element|data element|data type|type|instance|modality|split|partition|set)\b'
  - '^(?:it|he|she)\b'
  - '\b(?:it|this) (?:is|was|has|appears)\b'
  - '^(?:named|listed|recorded|credited|identified|described|mentioned|included|given|shown|cited|stated|reported|treated|kept)\b'

# The clause is about other people or things, so its role or presence
# wording does not disclaim the member.
other_subject:
  - '\b(?:these|those|other|such|the other|the remaining|the listed|the named|individual|member) (?:[\w-]+ ){0,2}?(?:individuals|people|persons|members|investigators|personnel|staff|collaborators|institutions|organi[sz]ations|centers|centres|sites|authors|creators|maintainers|entities|partners)\b'
  - '\bthe (?:[\w-]+ ){0,2}(?:individuals|people|persons|investigators|personnel|staff|collaborators|institutions|organi[sz]ations)\b'
  - '^(?:they|none of these|none of those)\b'
  - '\bthey (?:are|were)\b'

# A hit whose guard matches is a caveat about a date, amount or attribute
# of the member, or about a study's design, not about its role or presence.
# Guarded hits are reported in their own list, never as flags. `reads:
# clause` reads the whole clause holding the cue, `reads: before_cue` the
# clause up to the cue, and `reads: cue` the matched cue alone.
guards:
  date_amount:
    reads: clause
    regex: '\b(?:dates?|dated|periods?|years?|months?|weeks?|days?|timeframes?|time ?frames?|durations?|start|end|deadlines?|timelines?|schedules?|when|amounts?|counts?|numbers?|sizes?|totals?|figures?|budgets?|costs?|currenc(?:y|ies)|percent(?:ages?)?|funding)\b|\b(?:19|20)\d\d\b|\$\s?\d'
  attribute:
    reads: clause
    regex: '\b(?:orcids?|identifiers?|ids?|affiliations?|e-?mails?|addresses|urls?|homepages?|websites?|dois?|credit(?:_roles)?|taxonomy|contributor roles?)\b'
  # The role the cue says is unstated is a narrower one than the container's
  # ("does not state a principal investigator role" of a creator).
  subrole:
    reads: cue
    regex: '\b(?:(?:co-?)?principal investigators?|pis?|corresponding|contact)\b'
  # A passive cue ("... is not recorded") comes after the role it negates.
  subrole_in_clause:
    reads: clause
    regex: '\b(?:(?:co-?)?principal investigators?|pis?|corresponding|contact)\b'
  design:
    reads: before_cue
    regex: '\b(?:study|studies|cohorts?|design|trials?|recruitment|enrol(?:l)?ment|collection|project|protocol)\s+(?:\w+\s+){0,2}$'

# Scope: `role` needs one of the container's role terms or role verbs, or an
# assignment noun, in the clause holding the cue; `presence` needs a
# self-reference before the cue or a presence term in the clause; `self`
# needs a self-reference before the cue; `none` is a cue about the member's
# status by itself. Every scope rejects an other-subject anywhere in the
# clause holding the cue.
patterns:
  - id: role.assignment_negated
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:(?:does|do|did) not|without) (?:assign(?:ing)?|giv(?:e|ing)|nam(?:e|ing)|designat(?:e|ing)|identify(?:ing)?|credit(?:ing)?|attribut(?:e|ing))\b'
    scope: role
    guards: [date_amount, attribute, subrole]
  - id: role.no_role_stated
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:(?:does|do|did) not|without) (?:state|stating|specify|specifying|record|recording|give|giving) (?:an? |any |the |this |that |its |their |his |her )?(?:[\w''’-]+ ){0,2}(?:roles?|titles?|categor(?:y|ies)|designations?|positions?)\b'
    scope: role
    guards: [date_amount, attribute, subrole]
  - id: role.states_no_role
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:states?|gives?|assigns?|names?|records?|reports?|specif(?:y|ies)) no (?:[\w''’-]+ ){0,2}(?:roles?|titles?|categor(?:y|ies)|designations?|positions?)\b'
    scope: role
    guards: [date_amount, attribute, subrole]
  - id: role.passive_not_stated
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:is|are|was|were) not (?:stated|given|reported|recorded|specified|established|assigned|named)\b'
    scope: role
    guards: [date_amount, attribute, subrole_in_clause]
  - id: role.not_stated_who
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:does|do|did) not (?:state|say|specify|indicate|establish|confirm) (?:who|whether|that)\b'
    scope: role
    guards: [date_amount, attribute, subrole]
  - id: role.none_assigns
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:none|neither|nothing(?: in the bundle)?|no (?:source|document|passage|page|material)s?(?: in the bundle)?)\b[^.;:]{0,40}?\b(?:assigns?|names?|designates?|credits?|identif(?:y|ies)|establish(?:es)?|states?|says|specif(?:y|ies)|indicates?)\b'
    scope: role
    guards: [date_amount, attribute, subrole]
  - id: role.contrast
    class: role_disclaimer
    kinds: [person_role]
    cue: '\brather than as (?:an? |the |its )?(?:(?:individual|separate|separately declared|declared|dataset|data) )?(?:{role})\b'
    scope: self
    guards: []
  - id: role.not_the_role
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:(?:is|was) not|not (?:named|listed|identified|described|credited|designated|recorded|given) as) (?:an? |the |its )?(?:(?:dataset|data) )?(?:{role})\b'
    scope: self
    guards: []
  - id: role.not_necessarily
    class: role_disclaimer
    kinds: [person_role]
    cue: '\bnot necessarily (?:an? |the |its )?(?:{role})\b'
    scope: none
    guards: []
  - id: presence.recorded_as_planned
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:stated|recorded|described|listed|reported|included|named|given|presented|mentioned) as (?:an? |the )?(?:planned|prospective|intended|anticipated|future|proposed|projected)\b'
    scope: presence
    guards: []
  - id: presence.planned_element
    class: presence_disclaimer
    kinds: [presence]
    cue: '\bplanned (?:data elements?|elements?|work|provisions?|data types?|modalit(?:y|ies)|measures?|collection|(?:{presence}))\b'
    scope: presence
    guards: []
  - id: presence.contrast_released
    class: presence_disclaimer
    kinds: [presence]
    cue: '\brather than as (?:an? |the )?(?:[\w-]+ ){0,3}?(?:released|present|available|existing|delivered|collected|included|distributed|actual)\b'
    scope: presence
    guards: []
  - id: presence.not_member_of
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:is|are|was|were) not (?:one|part|among|any) of the\b'
    scope: presence
    guards: [date_amount]
  - id: presence.none_reports_available
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:none|no (?:source|document|passage|page)s?(?: in the bundle)?)\b[^.;:]{0,20}?\b(?:reports?|states?|lists?|describes?|shows?|presents?)\b[^.;:]{0,80}? as (?:available|released|present|collected|complete|delivered|distributed)\b'
    scope: presence
    guards: [date_amount]
  - id: presence.not_yet_released
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:is|are|was|were|has|have) not (?:yet )?(?:been )?(?:released|available|collected|included|present|distributed|delivered|produced|generated|acquired)\b'
    scope: self
    guards: [date_amount, attribute]
  - id: presence.prospective_predicate
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:is|are|was|were|remains?) (?:all |both |only |still |entirely |explicitly )?prospective\b'
    scope: none
    guards: [design]
