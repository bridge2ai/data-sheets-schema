id: "https://w3id.org/bridge2ai/data-sheets-schema/composition"
name: "data-sheets-schema-composition"
title: "Datasheets for Datasets – Composition Module"
description: >
  Subschema for Composition-related information in Datasheets for Datasets.
  The questions in this section are intended to provide dataset consumers
  with the information they need to make informed decisions about using the
  dataset for their chosen tasks.
annotations:
  "d4d:section_question": "What do the instances that comprise the dataset represent?"
license: MIT
see_also:
  - "https://bridge2ai.github.io/data-sheets-schema"


imports:
  # Import the base schema for shared classes like DatasetProperty, Person, Organization, etc.
  - D4D_Base_import


# Subsets are defined in the main schema


prefixes:
  d4d: "https://w3id.org/bridge2ai/data-sheets-schema/"
  linkml: "https://w3id.org/linkml/"
  d4dcomposition: "https://w3id.org/bridge2ai/data-sheets-schema/composition#"
  schema: "http://schema.org/"
  dcterms: "http://purl.org/dc/terms/"
  dcat: "http://www.w3.org/ns/dcat#"


default_prefix: "d4dcomposition"


# ------------------------------------------------------------------------------
# Classes
# ------------------------------------------------------------------------------


classes:


  Instance:
    description: >
      What do the instances that comprise the dataset represent (e.g.,
      documents, photos, people, countries)?
    is_a: DatasetProperty
    attributes:
      data_topic:
        description: >
          General topic of each instance (e.g., from Bridge2AI standards).
        range: uriorcurie
        values_from:
          - B2AI_TOPIC
        slot_uri: dcat:theme
      instance_type:
        description: >
          The type or types of instances in the dataset (e.g., "movie", "user",
          "rating", "clinical record"). Use when the dataset contains multiple
          instance types with different structures.
        range: string
        slot_uri: d4d:instanceType
        broad_mappings:
          - dcterms:type
        annotations:
          "d4d:docExample": "medical imaging studies"
      data_substrate:
        description: >
          Type of data (e.g., raw text, images) from Bridge2AI standards.
        range: uriorcurie
        values_from:
          - B2AI_SUBSTRATE
        slot_uri: dcterms:type
      counts:
        description: >
          How many instances are there in total (of each type, if appropriate)?
        range: integer
        slot_uri: schema:numberOfItems
        annotations:
          "d4d:docExample": "42000 (42,000 patient records)"
      label:
        description: >
          Is there a label or target associated with each instance?
        slot_uri: d4d:hasLabel
        range: boolean
      label_description:
        description: >
          If labeled, what pattern or format do labels follow?
        range: string
        slot_uri: d4d:labelPattern
        broad_mappings:
          - schema:description
      sampling_strategies:
        description: >
          References to one or more SamplingStrategy objects.
        slot_uri: d4d:samplingStrategies
        range: SamplingStrategy
        multivalued: true
      missing_information:
        description: >
          References to one or more MissingInfo objects describing missing data.
        slot_uri: d4d:missingInformation
        range: MissingInfo
        multivalued: true


  SamplingStrategy:
    description: >
      Does the dataset contain all possible instances, or is it a sample
      (not necessarily random) of instances from a larger set? If so, how
      representative is it?
    is_a: DatasetProperty
    attributes:
      is_sample:
        description: "Indicates whether it is a sample of a larger set."
        slot_uri: d4d:isSample
        range: boolean
        annotations:
          "d4d:docExample": "true"
      is_random:
        description: "Indicates whether the sample is random."
        slot_uri: d4d:isRandom
        range: boolean
        annotations:
          "d4d:docExample": "false"
      source_data:
        description: >
          One or more descriptions of the larger sets from which the sample was drawn, if applicable.
        slot_uri: d4d:sourceData
        range: string
        multivalued: true
      is_representative:
        description: >
          Indicates whether the sample is representative of the larger set.
        slot_uri: d4d:isRepresentative
        range: boolean
        annotations:
          "d4d:docExample": "true"
      representative_verification:
        description: >
          One or more explanations of how representativeness was validated or verified (e.g., statistical tests, domain expert review).
        slot_uri: d4d:verificationDescription
        range: string
        multivalued: true
        broad_mappings:
          - schema:description
      why_not_representative:
        description: >
          One or more explanations of why the sample is not representative of the larger set, if applicable.
        slot_uri: d4d:whyNotRepresentative
        range: string
        multivalued: true
      strategies:
        description: >
          One or more sampling strategies used (e.g., deterministic, simple random,
          stratified, cluster, systematic).
        slot_uri: d4d:strategies
        range: string
        multivalued: true
        annotations:
          "d4d:docExample": "Triple-balanced by race/ethnicity, sex, and T2DM severity"


  MissingInfo:
    description: >
      Is any information missing from individual instances? (e.g.,
      unavailable data).
    is_a: DatasetProperty
    attributes:
      missing:
        description: >
          Description of the missing data fields or elements.
        range: string
        multivalued: true
        slot_uri: d4d:missingDataDescription
        broad_mappings:
          - dcterms:description
        annotations:
          "d4d:docExample": "CGM readings absent for 15% of participants"
      why_missing:
        description: >
          Explanation of why each piece of data is missing.
        range: string
        multivalued: true
        slot_uri: d4d:missingDataCause
        broad_mappings:
          - dcterms:description
        annotations:
          "d4d:docExample": "Device malfunction or non-compliance during 14-day wear period"


  Relationships:
    description: >
      Are relationships between individual instances made explicit
      (e.g., users' movie ratings, social network links)?
    is_a: DatasetProperty
    attributes:
      relationship_details:
        description: >
          Free-text description of how relationships between instances are represented
          (e.g., graph edges, ratings matrices, foreign keys), including relationship types
          and any associated metadata.
        range: string
        multivalued: true
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "Participants linked to multiple visits via participant_id foreign key"


  Splits:
    description: >
      Are there recommended data splits (e.g., training, validation, testing)?
      If so, how are they defined and why?
    is_a: DatasetProperty
    attributes:
      split_details:
        description: >
          Free-text description of the recommended data splits (e.g., 80/10/10 train/
          validation/test), how they are defined, and the rationale for the split strategy.
        range: string
        multivalued: true
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "70/15/15 train/validation/test split stratified by site and T2DM severity"


  DataAnomaly:
    description: >
      Are there any errors, sources of noise, or redundancies in the dataset?
    is_a: DatasetProperty
    attributes:
      anomaly_details:
        description: >
          Free-text description of errors, noise sources, or redundancies in the dataset,
          including their known causes and estimated prevalence.
        range: string
        multivalued: true
        slot_uri: d4d:anomalyDetails
        broad_mappings:
          - dcterms:description
        annotations:
          "d4d:docExample": "15% of CGM readings missing due to device malfunction"


  DatasetBias:
    description: >
      Documents known biases present in the dataset. Biases are systematic errors
      or prejudices that may affect the representativeness or fairness of the data.
      Distinct from anomalies (data quality issues) and limitations (scope constraints).
    is_a: DatasetProperty
    exact_mappings:
      - rai:dataBiases
    attributes:
      bias_type:
        description: >
          The type of bias identified, using standardized categories from
          the Artificial Intelligence Ontology (AIO).
        slot_uri: d4d:biasType
        range: BiasTypeEnum
      bias_description:
        description: >
          Detailed description of how this bias manifests in the dataset,
          including affected populations, features, or outcomes.
        range: string
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "Sampling favored urban academic medical centers"
      mitigation_strategy:
        description: >
          Steps taken or recommended to mitigate this bias.
        slot_uri: d4d:mitigation_strategy
        range: string
        annotations:
          "d4d:docExample": "Oversampling of underrepresented groups during model training"
      affected_subsets:
        description: >
          One or more specific subsets or features of the dataset affected by this bias
          (e.g., "female participants", "non-English text", "images taken at night").
        slot_uri: d4d:affectedSubsets
        range: string
        multivalued: true
        annotations:
          "d4d:docExample": "Training split underrepresents Asian participants"


  DatasetLimitation:
    description: >
      Documents known limitations of the dataset that may affect its use
      or interpretation. Distinct from biases (systematic errors) and
      anomalies (data quality issues).
    is_a: DatasetProperty
    exact_mappings:
      - rai:dataLimitations
    attributes:
      limitation_type:
        description: >
          Category of limitation (e.g., scope, coverage, temporal, methodological).
        slot_uri: d4d:limitationType
        range: LimitationTypeEnum
      limitation_description:
        description: >
          Detailed description of the limitation and its implications.
        range: string
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "Cross-sectional design limits causal inference"
      scope_impact:
        description: >
          How this limitation affects the scope or applicability of the dataset.
        slot_uri: d4d:scopeImpact
        range: string
        annotations:
          "d4d:docExample": "Findings may not generalize to non-diabetic populations"
      recommended_mitigation:
        description: >
          Recommended approaches for users to address this limitation.
        slot_uri: d4d:recommendedMitigation
        range: string
        annotations:
          "d4d:docExample": "Use longitudinal follow-up cohorts for causal inference studies"


  ExternalResource:
    description: >
      Is the dataset self-contained or does it rely on external resources (e.g.,
      websites, other datasets)? If external, are there guarantees that those
      resources will remain available and unchanged?
    is_a: DatasetProperty
    slots:
      - external_resources
    slot_usage:
      external_resources:
        description: "List of links or identifiers for external resources."
        range: string
    attributes:
      future_guarantees:
        description: >
          Explanation of any commitments that external resources will remain
          available and stable over time.
        range: string
        multivalued: true
        slot_uri: d4d:availabilityGuarantee
        broad_mappings:
          - dcterms:description
      archival:
        description: >
          Indicates whether official archival versions of external resources
          are included in the dataset.
        slot_uri: d4d:hasArchivalVersion
        range: boolean
      restrictions:
        description: >
          One or more descriptions of restrictions or fees associated with accessing
          these external resources (e.g., paywalls, registration requirements, API limits).
        range: string
        multivalued: true
        slot_uri: d4d:externalResourceRestrictions
        broad_mappings:
          - dcterms:accessRights


  Confidentiality:
    description: >
      Does the dataset contain data that might be confidential (e.g., protected
      by legal privilege, patient data, non-public communications)?
    is_a: DatasetProperty
    attributes:
      confidential_elements_present:
        range: boolean
        description: "Indicates whether any confidential data elements are present."
        slot_uri: d4d:confidential_elements_present
      confidentiality_details:
        description: >
          Free-text description of which data elements are confidential, the basis for
          confidentiality (e.g., legal privilege, patient data), and how they are handled
          or restricted.
        range: string
        multivalued: true
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "ZIP codes suppressed; race/ethnicity available only in aggregate"


  ContentWarning:
    description: >
      Does the dataset contain any data that might be offensive, insulting,
      threatening, or otherwise anxiety-provoking if viewed directly?
    is_a: DatasetProperty
    attributes:
      content_warnings_present:
        range: boolean
        description: "Indicates whether any content warnings are needed."
        slot_uri: d4d:content_warnings_present
      warnings:
        description: >-
          One or more specific content warnings describing potentially offensive, insulting,
          threatening, or anxiety-provoking content present in the dataset
          (e.g., violence, profanity, explicit imagery, hate speech).
        range: string
        multivalued: true
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "Contains clinical images of diabetic retinopathy"


  Subpopulation:
    description: >
      Does the dataset identify any subpopulations (e.g., by age, gender)?
      If so, how are they identified and what are their distributions?
    is_a: DatasetProperty
    attributes:
      subpopulation_elements_present:
        slot_uri: d4d:subpopulationElementsPresent
        range: boolean
        description: "Indicates whether any subpopulations are explicitly identified."
      identification:
        description: >-
          How subpopulations are identified and defined (e.g., by age groups, gender,
          geographic region, disease status, or other demographic/clinical characteristics).
        range: string
        multivalued: true
        slot_uri: d4d:subpopulationIdentification
        broad_mappings:
          - dcterms:description
      distribution:
        description: >-
          The distribution of instances across identified subpopulations, including counts,
          percentages, or proportions for each subgroup.
        range: string
        multivalued: true
        slot_uri: d4d:subpopulationDistribution
        broad_mappings:
          - dcterms:description
        annotations:
          "d4d:docExample": "Hispanic participants: 1,023 (25.6% of total)"


  Deidentification:
    description: >
      Is it possible to identify individuals in the dataset, either directly
      or indirectly (in combination with other data)?
    is_a: DatasetProperty
    attributes:
      identifiable_elements_present:
        slot_uri: d4d:identifiableElementsPresent
        range: boolean
        description: "Indicates whether data subjects can be identified."
      method:
        range: string
        description: "Method used for de-identification (e.g., HIPAA Safe Harbor)."
      identifiers_removed:
        range: string
        multivalued: true
        description: >-
          List of identifier types removed during de-identification
          (e.g., 'name', 'date of birth', 'SSN', 'email address', 'geographic subdivision').
        slot_uri: d4d:removedIdentifierTypes
      deidentification_details:
        description: >
          Details on de-identification procedures and residual risks.
        range: string
        multivalued: true
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "HIPAA Safe Harbor method applied; expert re-identification risk assessment confirms low risk"


  SensitiveElement:
    description: >
      Does the dataset contain data that might be considered sensitive
      (e.g., race, sexual orientation, religion, biometrics)?
    is_a: DatasetProperty
    exact_mappings:
      - rai:personalSensitiveInformation
    attributes:
      sensitive_elements_present:
        range: boolean
        description: "Indicates whether sensitive data elements are present."
        slot_uri: d4d:sensitive_elements_present
      sensitivity_details:
        description: >
          Details on sensitive data elements present and handling procedures.
        range: string
        multivalued: true
        slot_uri: dcterms:description
        annotations:
          "d4d:docExample": "Genetic sequencing data requires additional DUA"


  DatasetRelationship:
    description: >
      Typed relationship to another dataset, enabling precise specification
      of how datasets relate to each other (e.g., supplements, derives from,
      is version of). Supports RO-Crate-style dataset interlinking.
    is_a: DatasetProperty
    attributes:
      target_dataset:
        description: >-
          The identifier or URL of the dataset this relationship points to.
        comments:
          - >-
            A reference, not an inline dataset. The description used to promise
            "identifier, URL, or Dataset object" while the range permitted only
            the first, and LinkML cannot express the union: its JSON Schema
            generator always emits a top-level type or $ref from the slot's
            range, which ANDs with `any_of`, so whichever branch the range names
            the other one fails. Verified both ways on VOICE (#297).
          - >-
            A related dataset with its own DOI, protocol and approval is its own
            datasheet and is referenced from here by identifier. That is the
            resolution of #292 for VOICE, whose pediatric companion has all
            three.
        slot_uri: dcterms:relation
        range: string
        required: true
      relationship_type:
        description: >-
          The type of relationship (e.g., derives_from, supplements, is_version_of).
          Uses DatasetRelationshipTypeEnum for standardized relationship types.
        slot_uri: schema:additionalType
        range: DatasetRelationshipTypeEnum
        required: true
      description:
        description: >-
          Free-text description providing additional context about the relationship.
        range: string


enums:

  DatasetRelationshipTypeEnum:
    description: >-
      Relationships between datasets, aligned one-to-one with the DataCite
      Metadata Schema RelationType controlled vocabulary and mapped to Dublin
      Core terms where an equivalent exists.

      Permissible value names are snake_case, following this schema's naming
      throughout. The corresponding DataCite term is carried in `aliases` on
      each value, so the alignment is machine-readable rather than asserted in
      prose. DataCite publishes no per-term IRIs, which is why the link is an
      alias and not a `meaning`.

      All 36 DataCite RelationType values are represented. Generators reading
      DataCite metadata should map the CamelCase term to the snake_case name
      via `aliases`; emitting the DataCite spelling directly will not validate.

      See https://datacite-metadata-schema.readthedocs.io/ and
      http://purl.org/dc/terms/
    permissible_values:
      derives_from:
        description: >-
          This dataset is derived from the target dataset through processing,
          analysis, or transformation.
        aliases:
          - IsDerivedFrom
        broad_mappings:
          - dcterms:source
      is_source_of:
        description: >-
          This dataset is a source from which the target dataset was derived.
          The inverse of derives_from.
        aliases:
          - IsSourceOf
        broad_mappings:
          - dcterms:relation
      supplements:
        description: >-
          This dataset supplements or adds to the target dataset.
        aliases:
          - IsSupplementTo
        broad_mappings:
          - dcterms:relation
      is_supplemented_by:
        description: >-
          This dataset is supplemented by the target dataset.
        aliases:
          - IsSupplementedBy
        broad_mappings:
          - dcterms:relation
      is_version_of:
        description: >-
          This dataset is a version of the target dataset (e.g., updated,
          corrected, or revised version).
        aliases:
          - IsVersionOf
        exact_mappings:
          - dcterms:isVersionOf
      has_version:
        description: >-
          This dataset has the target dataset as a version of it. The inverse
          of is_version_of.
        aliases:
          - HasVersion
        exact_mappings:
          - dcterms:hasVersion
      is_new_version_of:
        description: >-
          This dataset is a new version that replaces or updates the target
          dataset.
        aliases:
          - IsNewVersionOf
        exact_mappings:
          - dcterms:isVersionOf
        broad_mappings:
          - dcterms:replaces
      is_previous_version_of:
        description: >-
          This dataset is an earlier version of the target dataset. The inverse
          of is_new_version_of.
        aliases:
          - IsPreviousVersionOf
        broad_mappings:
          - dcterms:isReplacedBy
      replaces:
        description: >-
          This dataset replaces or supersedes the target dataset.
        aliases:
          - Obsoletes
        exact_mappings:
          - dcterms:replaces
      is_replaced_by:
        description: >-
          This dataset is replaced or superseded by the target dataset.
        aliases:
          - IsObsoletedBy
        exact_mappings:
          - dcterms:isReplacedBy
      is_required_by:
        description: >-
          This dataset is required by the target dataset.
        aliases:
          - IsRequiredBy
        exact_mappings:
          - dcterms:isRequiredBy
      requires:
        description: >-
          This dataset requires the target dataset.
        aliases:
          - Requires
        exact_mappings:
          - dcterms:requires
      is_part_of:
        description: >-
          This dataset is part of the target dataset (e.g., subset, component).
        aliases:
          - IsPartOf
        exact_mappings:
          - dcterms:isPartOf
      has_part:
        description: >-
          This dataset has the target dataset as a part.
        aliases:
          - HasPart
        exact_mappings:
          - dcterms:hasPart
      is_published_in:
        description: >-
          This dataset is published in the target resource, typically a
          publication or a data journal.
        aliases:
          - IsPublishedIn
        broad_mappings:
          - dcterms:isPartOf
      is_referenced_by:
        description: >-
          This dataset is referenced by the target dataset.
        aliases:
          - IsReferencedBy
        exact_mappings:
          - dcterms:isReferencedBy
      references:
        description: >-
          This dataset references the target dataset.
        aliases:
          - References
        exact_mappings:
          - dcterms:references
      is_cited_by:
        description: >-
          This dataset is cited by the target dataset. Narrower than
          is_referenced_by: a citation is a formal bibliographic reference.
        aliases:
          - IsCitedBy
        broad_mappings:
          - dcterms:isReferencedBy
      cites:
        description: >-
          This dataset cites the target dataset.
        aliases:
          - Cites
        broad_mappings:
          - dcterms:references
      is_continued_by:
        description: >-
          This dataset is continued by the target dataset, which extends it as
          a later instalment in the same series.
        aliases:
          - IsContinuedBy
        broad_mappings:
          - dcterms:relation
      continues:
        description: >-
          This dataset continues the target dataset as a later instalment in
          the same series.
        aliases:
          - Continues
        broad_mappings:
          - dcterms:relation
      is_described_by:
        description: >-
          This dataset is described by the target resource.
        aliases:
          - IsDescribedBy
        broad_mappings:
          - dcterms:relation
      describes:
        description: >-
          This dataset describes the target resource.
        aliases:
          - Describes
        broad_mappings:
          - dcterms:relation
      has_metadata:
        description: >-
          This dataset has additional metadata held in the target resource.
        aliases:
          - HasMetadata
        broad_mappings:
          - dcterms:relation
      is_metadata_for:
        description: >-
          This dataset is metadata for the target dataset.
        aliases:
          - IsMetadataFor
        broad_mappings:
          - dcterms:relation
      is_documented_by:
        description: >-
          This dataset is documented by the target resource, such as a manual
          or a data dictionary.
        aliases:
          - IsDocumentedBy
        broad_mappings:
          - dcterms:relation
      documents:
        description: >-
          This dataset documents the target dataset.
        aliases:
          - Documents
        broad_mappings:
          - dcterms:relation
      is_compiled_by:
        description: >-
          This dataset is compiled or created by the target resource, typically
          software or an instrument.
        aliases:
          - IsCompiledBy
        broad_mappings:
          - dcterms:relation
      compiles:
        description: >-
          This dataset compiles or creates the target dataset.
        aliases:
          - Compiles
        broad_mappings:
          - dcterms:relation
      is_variant_form_of:
        description: >-
          This dataset is a variant or different form of the target dataset,
          such as a different encoding or format. This dataset is the variant;
          the target is the original.
        aliases:
          - IsVariantFormOf
        exact_mappings:
          - dcterms:isFormatOf
      is_original_form_of:
        description: >-
          This dataset is the original form of the target dataset. This dataset
          is the original; the target is the variant.
        aliases:
          - IsOriginalFormOf
        exact_mappings:
          - dcterms:hasFormat
      is_reviewed_by:
        description: >-
          This dataset is reviewed by the target resource.
        aliases:
          - IsReviewedBy
        broad_mappings:
          - dcterms:relation
      reviews:
        description: >-
          This dataset reviews the target dataset.
        aliases:
          - Reviews
        broad_mappings:
          - dcterms:relation
      is_collected_by:
        description: >-
          This dataset is collected by the target resource, such as a study or
          a collection effort.
        aliases:
          - IsCollectedBy
        broad_mappings:
          - dcterms:relation
      collects:
        description: >-
          This dataset collects the target dataset.
        aliases:
          - Collects
        broad_mappings:
          - dcterms:relation
      is_identical_to:
        description: >-
          This dataset is identical to the target dataset (e.g., mirror, copy).
        aliases:
          - IsIdenticalTo
        broad_mappings:
          - dcterms:relation
