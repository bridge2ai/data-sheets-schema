id: "https://w3id.org/bridge2ai/data-sheets-schema/human"
name: "data-sheets-schema-human"
title: "Datasheets for Datasets – Human Subjects Module"
description: >
  Subschema for human subjects research information in Datasheets for Datasets.
  This module covers classes, attributes, and properties specific to datasets
  involving human participants, focusing on ethical considerations, consent,
  privacy protections, and regulatory compliance unique to human subjects research.
annotations:
  "d4d:section_question": "Does the dataset relate to people?"
license: MIT
see_also:
  - "https://bridge2ai.github.io/data-sheets-schema"


imports:
  - D4D_Base_import


# Subsets are defined in the main schema


prefixes:
  d4d: "https://w3id.org/bridge2ai/data-sheets-schema/"
  linkml: "https://w3id.org/linkml/"
  d4dhuman: "https://w3id.org/bridge2ai/data-sheets-schema/human#"


default_prefix: "d4dhuman"


# ------------------------------------------------------------------------------
# Classes for Human Subjects Research
# ------------------------------------------------------------------------------


classes:


  HumanSubjectResearch:
    description: >
      Information about whether the dataset involves human subjects research
      and what regulatory or ethical review processes were followed.
    is_a: DatasetProperty
    attributes:
      involves_human_subjects:
        description: "Does this dataset involve human subjects research?"
        slot_uri: d4d:involvesHumanSubjects
        range: boolean
      irb_approval:
        description: >
          Was Institutional Review Board (IRB) approval obtained?
          Include approval number and institution if applicable.
        slot_uri: d4d:irbApproval
        range: string
        multivalued: true
        annotations:
          "d4d:docExample": "All participants provided written informed consent; study registered at ClinicalTrials.gov NCT05395169"
      ethics_review_board:
        description: >
          What ethics review board(s) reviewed this research?
          Include institution names and approval details.
        slot_uri: d4d:ethicsReviewBoard
        range: string
      special_populations:
        description: >
          Does the research involve any special populations that require
          additional protections (e.g., minors, pregnant women, prisoners)?
        slot_uri: d4d:specialPopulations
        range: string
        multivalued: true
      regulatory_compliance:
        description: >
          What regulatory frameworks govern this human subjects research
          (e.g., 45 CFR 46, HIPAA)?
        slot_uri: d4d:regulatoryCompliance
        range: string
        multivalued: true
        annotations:
          "d4d:docExample": "45 CFR Part 46, HIPAA Privacy Rule (45 CFR Parts 160 and 164)"


  InformedConsent:
    description: >
      Details about informed consent procedures used in human subjects research.
    is_a: DatasetProperty
    attributes:
      consent_obtained:
        description: "Was informed consent obtained from all participants?"
        slot_uri: d4d:consentObtained
        range: boolean
      consent_type:
        description: >
          What type of consent was obtained (e.g., written, verbal, electronic,
          implied through participation)?
        slot_uri: d4d:consentType
        range: string
        annotations:
          "d4d:docExample": "Written informed consent with optional consent for future use of biospecimens"
      consent_documentation:
        description: >
          How is consent documented? Include references to consent forms
          or procedures used.
        slot_uri: d4d:consentDocumentation
        range: string
        annotations:
          "d4d:docExample": "Separate consent forms for main study, biorepository, and genetic analysis"
      withdrawal_mechanism:
        description: >
          How can participants withdraw their consent? What procedures
          are in place for data deletion upon withdrawal?
        slot_uri: d4d:withdrawalMechanism
        range: string
      consent_scope:
        description: >
          What specific uses did participants consent to? Are there
          limitations on data use based on consent?
        slot_uri: d4d:consentScope
        range: string


  ParticipantPrivacy:
    description: >
      Information about privacy protections and anonymization procedures
      for human research participants.
    is_a: DatasetProperty
    attributes:
      anonymization_method:
        description: >
          What methods were used to anonymize or de-identify participant data?
          Include technical details of privacy-preserving techniques.
        slot_uri: d4d:anonymizationMethod
        range: string
        annotations:
          "d4d:docExample": "De-identified per HIPAA Safe Harbor; 5-digit ZIP replaced with region codes"
      reidentification_risk:
        description: >
          What is the assessed risk of re-identification? What measures
          were taken to minimize this risk?
        slot_uri: d4d:reidentificationRisk
        range: string
        annotations:
          "d4d:docExample": "Low risk; expert determination per 45 CFR 164.514(b)(1)"
      privacy_techniques:
        description: >
          What privacy-preserving techniques were applied (e.g., differential
          privacy, k-anonymity, data masking)?
        slot_uri: d4d:privacyTechniques
        range: string
      data_linkage:
        description: >
          Can this dataset be linked to other datasets in ways that might
          compromise participant privacy?
        slot_uri: d4d:dataLinkage
        range: string


  HumanSubjectCompensation:
    description: >
      What participants received, and — where the sources describe one — how
      that was structured to keep them enrolled.

      Two different claims live here and must not be conflated (#504).
      **Compensation** is payment for time and burden: what was provided, of
      what type, of what value. **Retention incentives** are structure designed
      to prevent attrition — escalating amounts, completion bonuses, payments
      tied to later visits. The ethical reading of the two differs, which is
      why an Ethics and Privacy review asked for the distinction: "$40 then
      $80" reported as compensation says something different from the same
      figures reported as a retention design.

      Record the incentive slots only where a source describes the structure or
      its purpose. Most sources describe payments and say nothing about
      retention intent, and an escalating schedule is not by itself evidence
      that retention was the goal. Inferring one from the other is the failure
      the evidence boundary exists to prevent.
    is_a: DatasetProperty
    attributes:
      compensation_provided:
        description: "Were participants compensated for their participation?"
        slot_uri: d4d:compensationProvided
        range: boolean
      compensation_type:
        description: >
          What type of compensation was provided (e.g., monetary payment,
          gift cards, course credit, other incentives)?
        slot_uri: d4d:compensationType
        range: string
        annotations:
          "d4d:docExample": "Monetary payment via gift card"
      compensation_amount:
        description: >
          What was the amount or value of compensation provided?
          Include currency or equivalent value.
        slot_uri: d4d:compensationAmount
        range: string
        annotations:
          "d4d:docExample": "$75 for initial visit; $25 for annual follow-up"
      compensation_rationale:
        description: >
          What was the rationale for the compensation structure?
          How was the amount determined to be appropriate?
        slot_uri: d4d:compensationRationale
        range: string

      retention_incentives:
        description: >
          Where the sources describe it, how the incentive structure was
          designed to keep participants enrolled across the study — escalating
          amounts, completion bonuses, payments tied to later visits or to
          returning after a gap.

          Distinct from `compensation_type` and `compensation_amount`, which
          record what was provided. State this only where a source describes
          the structure. An escalating payment schedule is not by itself
          evidence that retention was its purpose; report the schedule under
          the compensation slots and leave this absent.

          ⚠️ **"Retention" here means keeping participants enrolled, never
          keeping data.** How long the data is kept belongs in
          `retention_limit`, which is a different slot about a different
          subject. The word is treacherous in this corpus: across all five
          project bundles nearly every occurrence of "retention" is about data
          or specimen retention — "limits on the retention of the data",
          "bioSpecRetention", "records retention requirements" — and none so
          far describes an incentive structure. An empty slot is the correct
          outcome for those sources.
        slot_uri: d4d:retentionIncentiveStructure
        range: string
        annotations:
          "d4d:docExample": "Payment rises across the four annual visits, with a completion bonus at year four, described in the protocol as designed to reduce loss to follow-up."

      retention_incentive_rationale:
        description: >
          The stated reason for structuring incentives to support retention,
          where a source gives one — an attrition rate the design responds to,
          an IRB condition, or a documented equity concern about who can afford
          to stay enrolled.

          Separate from `retention_incentives` (the structure) for the same
          reason `compensation_rationale` is separate from
          `compensation_amount`: what was done and why it was done are
          different claims, and sources frequently give one without the other.
        slot_uri: d4d:retentionIncentiveRationale
        range: string


  AtRiskPopulations:
    description: >
      Information about protections for at-risk populations in human subjects research.
    is_a: DatasetProperty
    attributes:
      at_risk_groups_included:
        description: >
          Are any at-risk populations included (e.g., children, pregnant women,
          prisoners, cognitively impaired individuals)?
        slot_uri: d4d:atRiskGroupsIncluded
        range: boolean
      special_protections:
        description: >
          What additional protections were implemented for at-risk populations?
          Include safeguards, modified procedures, or additional oversight.
        slot_uri: d4d:specialProtections
        range: string
        multivalued: true
        annotations:
          "d4d:docExample": "No participants under 18; pregnant women excluded from CGM protocol"
      assent_procedures:
        description: >
          For research involving minors, what assent procedures were used?
          How was developmentally appropriate assent obtained?
        slot_uri: d4d:assentProcedures
        range: string
      guardian_consent:
        description: >
          For participants unable to provide their own consent, how was
          guardian or surrogate consent obtained?
        slot_uri: d4d:guardianConsent
        range: string
        multivalued: true