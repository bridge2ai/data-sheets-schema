id: https://w3id.org/bridge2ai/d4d-generation-record
name: d4d-generation-record
title: D4D Generation Record
description: >-
  The record a generation run writes about itself: what it consumed, what it
  produced, what was checked afterwards, and what it could not establish.

  This repository schematises metadata about datasets. Until now its own
  generation metadata was a hand-built Python dictionary written as YAML —
  25 top-level keys, `record_version: 1`, and nothing that could be validated.
  The one artifact that did have a LinkML schema, `d4d_run_telemetry.yaml`, is
  the *derived* report rather than the authoritative record.

  **This schema is deliberately not imported by `data_sheets_schema.yaml`.** It
  describes the pipeline, not a dataset, and importing it would move the
  `Dataset` digest that a generation arm is frozen against.

  **It describes today's record rather than a tidier one.** Across 195 records
  the shape genuinely varies: a `live` record carries `model`, `system` and
  `api_usage`; a `derived` record carries `derivation` and `sources` and none of
  those; older records predate blocks added later. Requiring a field that some
  honest record cannot have would make the schema a fiction. Only what every
  record has is required; the rest is optional and documented.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  d4dgen: https://w3id.org/bridge2ai/d4d-generation-record/
default_prefix: d4dgen
default_range: string
imports:
  - linkml:types

classes:

  GenerationRecord:
    description: >-
      One run, one project. Written by `d4d api run` or by
      `d4d provenance record` from an agentic run, and read by every gate in
      `d4d runs check`.
    tree_root: true
    attributes:

      record_type:
        description: >-
          Names the kind of file. Not always `d4d_generation_provenance`, as
          this said before it was checked: a derived record writes
          `d4d_derived_provenance`, and calling both by one name would hide the
          distinction the mode exists to draw.
        range: RecordType
        required: true
      record_version:
        description: >-
          Bumped when the record's shape changes incompatibly. Still 1: every
          block added since has been additive, which is why records written
          months apart still validate together.
        range: integer
        required: true
      record_mode:
        description: >-
          How much of this record is observed. `live` is written by the run
          itself; `reconstructed` is assembled afterwards and names what it
          cannot recover; `derived` describes a record computed from other
          records rather than generated.
        range: RecordMode
        required: true
      record_generated_at:
        description: When the record was written, not when the run started.
        range: datetime
        required: true

      run:
        description: Which project, method, label and arm this run is.
        range: RunIdentity
        required: true
        inlined: true

      schema:
        description: >-
          The schema the run generated against, by hash and by digest. The
          digest is what the model was actually sent.
        required: true
        inlined: true
        range: SchemaFacts

      repo:
        description: The commit the run was made at.
        required: true
        inlined: true
        range: AnyBlock

      software:
        description: Versions of the packages that produced the record.
        required: true
        inlined: true
        range: AnyBlock

      outputs:
        description: >-
          The records this run wrote, by path and size — **not** by hash for a
          generation record. `_artifact` drops the hash deliberately: the agent
          path records provenance as a separate step from writing the
          artifacts, so 77 live records had hashed a state their files merely
          passed through. Integrity lives in `validation.artifacts`, computed
          after the run is final. A *derived* record does hash its outputs,
          because it writes and hashes them in one step.
        required: true
        inlined: true
        range: AnyBlock

      inputs:
        description: >-
          The bundle the run consumed, its hash, and the manifest that selected
          it. Absent on a `derived` record, which consumes records rather than
          a bundle.
        inlined: true
        range: AnyBlock

      model:
        description: >-
          Model, provider, route, per-phase ceilings, and what can honestly be
          said about temperature, reasoning effort and context.
        inlined: true
        range: AnyBlock

      system:
        description: The machine the run was made on.
        inlined: true
        range: AnyBlock

      prompts:
        description: >-
          Every prompt file the run consumed, hashed, plus the assembly digest
          covering the phase instructions and their order.
        inlined: true
        range: AnyBlock

      playbooks:
        description: >-
          The instruction files an agentic run opens for itself, hashed. Carries
          `consumed`, which says whether this runtime reads them at all.
        inlined: true
        range: AnyBlock

      companions:
        description: >-
          Everything else a reader may need, by reference rather than by copy:
          the reasoning log beside this record, the registries the run was
          checked against, and the telemetry report derived from records like
          it. A registry is shared and appended to over time, so copying it into
          every record would multiply it and still not say which version was in
          force; a hash does say.
        inlined: true
        range: CompanionFiles

      api_usage:
        description: >-
          One entry per API call: phase, attempt, timing, tokens and stop
          reason. Absent for a runtime with no access to its own accounting.
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

      phase_log:
        description: >-
          What an agentic run says about the phases it performed. The
          counterpart to `api_usage` for a runtime that knows which phase it ran
          but not what the call cost.
        inlined: true
        range: AnyBlock

      phases_skipped:
        description: Phases a resumed run did not repeat.
        multivalued: true

      core_derivation:
        description: >-
          Present when the core record was derived from the audited full
          record rather than generated (#694): the rule, the full record's
          path and md5 it was projected from, the identity-slot count and
          projection list, and the slots deliberately not derived. A run
          carrying this block made no `core`, `reconcile_core` or
          `repair_core` model call; its api_usage has no such phases and
          that is not a gap.
        inlined: true
        range: AnyBlock

      repair:
        description: Validator-driven repair rounds, in order.
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

      report_regenerated_after_repair:
        description: >-
          Present when repair rewrote a record after the reconciliation report
          was written, naming which records changed and why the report was
          regenerated (#604). Absent on the ordinary path, where the report
          already describes the final bytes.

          Missing from the first version of this schema, and found by the
          conformance gate on its first run rather than by inspection: no
          record on disk carries it, so validating the corpus could not have
          reached it. That is the difference the gate makes — it checks the
          writers, not the archive.

          Exactly one other attribute is in the same position: `companions`,
          which `build_record` writes unconditionally and which will appear on
          the next record written. Named here because presenting this field as
          the single thing the gate surfaced would overstate a real result by
          leaving out its twin (#618).
        inlined: true
        range: AnyBlock

      intermediates:
        description: Phase snapshots written as the run progressed.
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

      validation:
        description: >-
          Whether the records validate, pinned to the bytes and the schema the
          verdict was reached on, so a stale verdict is detectable.
        inlined: true
        range: AnyBlock

      pair_consistency:
        description: >-
          Whether the full and core records agree. A property of two files
          together, which no single-file gate can see.
        inlined: true
        range: AnyBlock

      report_claims:
        description: >-
          Whether the reconciliation report's claims survive checking against
          the record and the schema.
        inlined: true
        range: AnyBlock

      form:
        description: >-
          Counts that are properties of the records alone — undeclared CURIE
          prefixes, British spellings in generated prose, and fragments on
          organisational identifiers. Separate from `grounding` because they
          need no bundle: burying them there would make three preregistered
          predictions unmeasurable for every record whose bundle has drifted.
        inlined: true
        range: AnyBlock

      grounding:
        description: >-
          Whether external identifiers appear in the bundle they were read
          from, and whether identifier slots hold resolver URLs.
        inlined: true
        range: AnyBlock

      receipts:
        description: >-
          The coverage receipt checked against the chunk manifest, the bundle
          and the full record (#708): chunks reviewed N/N, snippets verified
          M/M, slots with a receipt S/T, findings, and the non-checks named.
          `expected` says whether the run's procedure wrote one; an expected
          receipt that could not be checked is unmeasurable, not clean.
        inlined: true
        range: AnyBlock

      canary:
        description: >-
          A canary verdict recorded on the run: status (ok / regressed /
          unmeasurable), the metric rows against the baseline, and a basis
          naming who computed it and when. Written by the batch gate's
          offline re-verdict route (#877, #891) — a run whose gate verdict
          was interpreted after the fact carries the interpretation here
          rather than only in a terminal transcript.
        inlined: true
        range: AnyBlock

      review:
        description: >-
          A reviewer's answers to the record's review pack (#787), checked:
          items answered N/N, adverse verdicts, cannot_tell, findings, and the
          reviewer's identity. The judgement half of the receipt design — what
          the deterministic validator cannot decide — as a recorded artifact.
        inlined: true
        range: AnyBlock

      unverified:
        description: >-
          Values recorded but not observed. Named rather than silently trusted.
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

      unrecoverable:
        description: >-
          Fields a reconstructed record cannot establish, with the reason. The
          difference between a gap that is named and one that is hidden.
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

      notes:
        description: Free-text observations about this run.
        multivalued: true

      derivation:
        description: >-
          For a `derived` record: how it was computed from other records.
        inlined: true
        range: AnyBlock

      sources:
        description: "For a `derived` record: the records it consumed, hashed."
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

      not_applicable:
        description: >-
          Fields that do not apply to this kind of record, with the reason —
          distinct from a field that is missing.
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

      canonical:
        description: "For a canonicalised record: what it was canonicalised from."
        inlined: true
        range: AnyBlock

      canonical_superseded_by:
        description: The record that replaced this one, if any.
        inlined: true
        range: AnyBlock

      canonical_history:
        description: >-
          Every `canonical` block this record once carried, newest first, each
          with the pointer that displaced it (#677). Demoted rather than
          deleted, so the displaced selection's evidence — criterion,
          candidates, margin — stays in the live corpus.
        multivalued: true
        inlined_as_list: true
        range: AnyBlock

    rules:
      # Conditional by mode, because the modes genuinely differ and blanket
      # optionality made the schema assert almost nothing: a `live` record
      # validated while omitting its bundle, its model, its validation verdict
      # and all three post-generation checks (#605).
      #
      # Each list below is what `build_record` — the single writer both runtimes
      # go through — **emits at write time**, not what the archive happens to
      # hold.
      #
      # The first version got that wrong in a way worth recording. It required
      # `validation` on the strength of "all 158 live records carry it". They
      # do, because `d4d runs validate` sweeps the corpus afterwards; the writer
      # never emits it. So the rule rejected every freshly written agentic
      # record, and the justification — "describes the writers as they are" —
      # described the archive after a later step had touched it (#612).
      #
      # `tests/test_generation_record_schema.py` now derives these lists from
      # `build_record` itself, so the two cannot drift apart again.
      #
      # These fail nothing **within the scope every checker uses** — the 195
      # records under `*_core/`. Three `curated/` records sit outside the glob
      # that `d4d provenance validate-records` uses and do not conform: three
      # of their four violations predate this schema and the reconstructed rule
      # adds `system` (#616). Saying "fails nothing" without naming the scope
      # would be the same overreach as measuring the archive and calling it the
      # writers — and the count was itself wrong at first, five rather than
      # four, which is the same failure one level down (#620).
      - title: a live run observed its own inputs, model and machine
        preconditions:
          slot_conditions:
            record_mode:
              equals_string: live
        postconditions:
          slot_conditions:
            inputs:
              required: true
            model:
              required: true
            system:
              required: true
      - title: a reconstructed record names what it could not recover
        preconditions:
          slot_conditions:
            record_mode:
              equals_string: reconstructed
        postconditions:
          slot_conditions:
            inputs:
              required: true
            model:
              required: true
            system:
              required: true
            unrecoverable:
              required: true
      - title: a derived mode implies a derived type
        description: >-
          `record_mode` and `record_type` are set by the same writer and must
          not disagree; a `derived` record typed as a generation record would
          pass every mode rule below while telling a reader the opposite.
        preconditions:
          slot_conditions:
            record_mode:
              equals_string: derived
        postconditions:
          slot_conditions:
            record_type:
              equals_string: d4d_derived_provenance
      - title: a derived type implies a derived mode
        description: >-
          The converse, which the first version left open (#620): a record
          typed `d4d_derived_provenance` while calling itself `live` validated.
          The description claimed a mismatch "would tell a reader the opposite"
          — true in both directions, checked in one. Two rules rather than one
          because a precondition tests a single value, so neither direction
          implies the other.
        preconditions:
          slot_conditions:
            record_type:
              equals_string: d4d_derived_provenance
        postconditions:
          slot_conditions:
            record_mode:
              equals_string: derived
      - title: a derived record declares what it was derived from
        preconditions:
          slot_conditions:
            record_mode:
              equals_string: derived
        postconditions:
          slot_conditions:
            derivation:
              required: true
            sources:
              required: true
            not_applicable:
              required: true

  RunIdentity:
    description: Which run this is.
    attributes:
      project:
        required: true
      method:
        required: true
      label:
        description: "The run label; `_rep{N}` names the replicate."
        required: true
      arm:
        description: Which arm of the study, where one applies.
        required: true
      replicate:
        description: >-
          Which replicate of the series, or absent for a record that is not one
          of a series — five records carry it as null rather than omitting it.
        range: integer

  SchemaFacts:
    description: The schema a run generated against.
    attributes:
      declared_version:
        description: The schema version the run declared.
        required: true
      declared_in:
        description: Where that version was read from.
        required: true
      merged_schema_carries_version:
        description: >-
          Whether the merged schema states the version itself, rather than it
          being taken from the source schema alone.
        range: boolean
        required: true
      full_path:
        required: true
      core_path:
        required: true
      digest_md5:
        description: >-
          Fingerprint of the rendered schema digest, which a straddle check
          compares and the digest inventory keys on.

          **When it was computed differs by runtime**, and the two are not the
          same claim. The API path fingerprints the digest as it renders it to
          send, so the value is of the bytes the model received. The agentic
          recorder runs after generation and fingerprints the schema as it
          stands then — the same value whenever the schema did not move mid-run,
          and an unfalsifiable assumption when it did. Absent on records written
          before the digest was recorded.
      full_md5:
      core_md5:
      full_sha256:
        description: >-
          Recorded alongside the md5 rather than instead of it: `_artifact`
          hashes run outputs with md5 and the prompt registry uses sha256, so
          both appear and neither is a mistake.
      core_sha256:
      note:

  CompanionFiles:
    description: >-
      Related files, by reference. Each says whether it was present, because an
      absent reasoning log is a fact about the runtime rather than a gap.
    attributes:
      reasoning_log:
        inlined: true
        range: FileReference
      telemetry_report:
        inlined: true
        range: FileReference
      prompt_registry:
        inlined: true
        range: FileReference
      digest_inventory:
        inlined: true
        range: FileReference

  FileReference:
    description: A file this record points at rather than copies.
    attributes:
      path:
        required: true
      present:
        range: boolean
        required: true
      md5:
        description: Absent when the file is absent, or when it is not hashed.
      note:
        description: Why this file matters to a reader of the record.

  AnyBlock:
    description: >-
      A block whose interior varies legitimately across record modes and
      versions, described here as a reference rather than enumerated.

      Enumerating every field of `model`, `validation` or `grounding` would
      freeze blocks that are still being added to — `grounding` gained a
      finding kind this week — and a schema that has to be edited before an
      additive change can be recorded would be a brake rather than a contract.
      What is asserted here is that the block exists and what it is for; the
      code that writes each block is its own definition, and the checks that
      read them fail loudly on a shape they do not expect.
    class_uri: linkml:Any

enums:
  RecordType:
    description: >-
      What kind of record this is. Two values across 195 records; enumerated
      rather than left open so a typo in the discriminator is a validation
      failure and not a silently unmatched record.
    permissible_values:
      d4d_generation_provenance:
        description: A run's account of generating a full/core pair.
      d4d_derived_provenance:
        description: >-
          An account of a record computed from other records. Pairs with
          `record_mode: derived`.

  RecordMode:
    description: How much of a record is observed rather than reconstructed.
    permissible_values:
      live:
        description: Written by the run itself; every field observed at run time.
      reconstructed:
        description: >-
          Assembled after the fact for a run that predates live recording. Names
          what it cannot recover instead of filling it in.
      derived:
        description: >-
          Computed from other records rather than generated. Consumes replicates
          instead of a bundle, so it declares `bundle_md5` not-applicable.
