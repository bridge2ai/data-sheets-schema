    note: >-
      D98 (#5471, Option A) declares d4d:termSourceIdentifierForms on
      Instance.data_substrate and Instance.data_topic (plus d4d:termSources on
      Instance.data_topic) and GO, MESH/MeSH, EFO, and NCIT prefixes in
      D4D_Base_import.yaml. D99 restores multivalued: true on
      LicenseAndUseTerms.data_use_permission (one primary DUO permission plus
      applicable modifiers) and aligns D4D_Core.yaml version: 3.2.0.
      A 3.0.0 or 3.1.0 record with scalar data_use_permission is invalid under
      3.2.0; migrate that scalar to a one-element list. The API write-time
      normaliser wraps scalar multivalued slots, including enum ranges.
      BC1 sizing does not migrate historical inputs: scalar cardinality is
      refused during owner traversal, so migrate the sizing record first.
      Historical schema hashes stay unchanged.
