# Schema release history (#1874).
#
# One entry per release identity of the full/core definitions, oldest first,
# with the sha256 of the two source entry points and the two merged files at
# the last state that carried the label. A record's `schema` block and every
# checked report block attest the merged-file hashes of the schema the check
# ran under; a schema release moves those hashes, and the historical blocks
# are never rewritten to today's (#1362, #1363). The corpus reproduction test
# therefore accepts a block that attests any registered pair here and
# requires a fresh recompute to attest the newest one. A new entry is added
# with the release that moves the hashes, in the same change.
