  - version: 3.2.0
    declared: 2026-11-08
    full_source_sha256: b37f37552375b05c1685ffe52649df5e1f17ed0da46d6dd82ca4f1b49b4d549a
    full_merged_sha256: cf4e0992a807cbf98efbf936b02d05ef48c438c437c3d380775aea9ab69302f7
