id: "https://w3id.org/bridge2ai/data-sheets-schema/data-governance"
name: "data-sheets-schema-data-governance"
title: "Datasheets for Datasets – Data Governance Module"
description: >
  Subschema for data governance–related information in Datasheets for Datasets.
  Encompasses dataset distribution, licensing, IP and regulatory restrictions,
  as well as maintenance and versioning plans. 


license: MIT
see_also:
  - "https://bridge2ai.github.io/data-sheets-schema"


imports:
  - D4D_Base_import


# Subsets are defined in the main schema


prefixes:
  d4d: "https://w3id.org/bridge2ai/data-sheets-schema/"
  linkml: "https://w3id.org/linkml/"
  d4ddatagovernance: "https://w3id.org/bridge2ai/data-sheets-schema/data-governance#"
  schema: "http://schema.org/"
  dcterms: "http://purl.org/dc/terms/"
  DUO: "http://purl.obolibrary.org/obo/DUO_"


default_prefix: "d4ddatagovernance"


# ------------------------------------------------------------------------------
# Classes
# ------------------------------------------------------------------------------


classes:


  LicenseAndUseTerms:
    description: >
      Will the dataset be distributed under a copyright or other IP license,
      and/or under applicable terms of use? Provide a link or copy of relevant
      licensing terms and any fees.
    is_a: DatasetProperty
    attributes:
      license_terms:
        description: >-
          Description of the dataset's license and terms of use, including links, costs,
          or usage constraints (e.g., 'CC BY 4.0', 'Apache 2.0', 'MIT', 'CC BY-NC-SA 4.0',
          'proprietary - contact data@example.org for access').
        range: string
        slot_uri: d4d:licenseDescription
        broad_mappings:
          - dcterms:license
          - dcterms:rights
        annotations:
          "d4d:docExample": "CC BY-NC 4.0 - Attribution-NonCommercial required"
      data_use_permission:
        description: >-
          Structured data use permissions using the Data Use Ontology (DUO).
          Specifies permitted uses (e.g., general research, health/medical research,
          disease-specific research) and restrictions (e.g., non-commercial use,
          ethics approval required, collaboration required). See https://github.com/EBISPOT/DUO.
        range: DataUsePermissionEnum
        slot_uri: DUO:0000001
        exact_mappings:
          - DUO:0000001
        annotations:
          "d4d:docExample": "health_medical_biomedical_research"
      contact_person:
        description: >-
          Contact person for licensing questions. Provides structured contact
          information including name, email, affiliation, and optional ORCID.
          This person can answer questions about licensing terms, usage restrictions,
          fees, and permissions.
        range: Person
        slot_uri: d4d:licenseContactPoint
        broad_mappings:
          - schema:contactPoint


  IPRestrictions:
    description: >
      Have any third parties imposed IP-based or other restrictions on the data
      associated with the instances? If so, describe them and note any relevant
      fees or licensing terms. Maps to DUO terms related to commercial/non-profit
      use restrictions (NCU, NPU, NPUNCU).
    is_a: DatasetProperty
    attributes:
      restrictions:
        description: "One or more explanations of third-party IP restrictions or associated fees."
        range: string
        multivalued: true
        slot_uri: dcterms:rights
        broad_mappings:
          - DUO:0000046  # NCU - no commercial use
          - DUO:0000045  # NPU - non-profit use only
        annotations:
          "d4d:docExample": "Retinal imaging algorithms are subject to pending patent"


  ExportControlRegulatoryRestrictions:
    description: >
      Do any export controls or other regulatory restrictions apply to the dataset
      or to individual instances? Includes compliance tracking for regulations like
      HIPAA and other US regulations. If so, please describe these restrictions and
      provide a link or copy of any supporting documentation. Maps to DUO terms
      related to ethics approval, geographic restrictions, and institutional requirements.
    is_a: DatasetProperty
    attributes:
      regulatory_restrictions:
        description: "One or more export controls or regulatory restrictions applicable to the dataset (e.g., HIPAA, ITAR, GDPR)."
        range: string
        multivalued: true
        slot_uri: dcterms:accessRights
        broad_mappings:
          - DUO:0000021  # IRB - ethics approval required
          - DUO:0000022  # GS - geographic restriction
          - DUO:0000028  # IS - institution specific
        annotations:
          "d4d:docExample": "HIPAA compliant; subject to 45 CFR Part 46"
      hipaa_compliant:
        description: >-
          Indicates compliance with the Health Insurance Portability and Accountability Act (HIPAA).
          HIPAA applies to protected health information in the United States.
        slot_uri: d4d:hipaaCompliant
        range: ComplianceStatusEnum
        annotations:
          "d4d:docExample": "compliant"
      other_compliance:
        description: >-
          Other regulatory compliance frameworks applicable to this dataset
          (e.g., CCPA, PIPEDA, industry-specific regulations).
        slot_uri: d4d:otherCompliance
        range: string
      confidentiality_level:
        description: >-
          Confidentiality classification of the dataset indicating level of
          access restrictions and sensitivity.
        slot_uri: d4d:confidentialityLevel
        range: ConfidentialityLevelEnum
      governance_committee_contact:
        description: >-
          DEPRECATED — use `DataGovernance.committee_contact` (#503). Kept so
          the records that already populate it stay valid; a governance contact
          is not an export-control fact and should not have to be nested inside
          one to be stated.
        range: Person
        slot_uri: d4d:governanceContactPoint
        broad_mappings:
          - schema:contactPoint


  # ---------------------------------------------------------------------------
  # Governance and stewardship (#503)
  #
  # This module was named for data governance and declared only
  # LicenseAndUseTerms, IPRestrictions and ExportControlRegulatoryRestrictions
  # — licensing, IP and export control. `Dataset` had no governance or
  # stewardship slot at all, and the single relevant field sat on the
  # export-control class, so naming a data access committee chair required
  # nesting that person inside a statement about export regulations. Two
  # records in the 2026-08-11 arm do exactly that.
  #
  # Raised in Camille Nebeker's review as "thin on Governance and Stewardship
  # details including DAC members and contacts". The content was thin because
  # there was almost nowhere to put it: a run cannot be thorough about a
  # committee's membership or review process when no field accepts either.
  # ---------------------------------------------------------------------------
  DataGovernance:
    description: >
      Who decides who may use this dataset, and how? Covers the body
      responsible for access decisions — commonly a Data Access Committee —
      its membership and contacts, the process it follows, and who remains
      accountable for the data over time.

      Distinct from `LicenseAndUseTerms`, which states the terms, and from
      `ExportControlRegulatoryRestrictions`, which states the regulations. This
      class is about the people and the process that apply them.
    is_a: DatasetProperty
    class_uri: d4d:DataGovernance
    attributes:
      committee_name:
        description: >-
          Name of the body responsible for access decisions, as the source
          states it (e.g. "AI-READI Data Access Committee", "DACO").
        range: string
        slot_uri: d4d:governanceCommitteeName
        annotations:
          "d4d:docExample": "Bridge2AI-Voice Data Access Committee (DACO)"
      committee_members:
        description: >-
          Members of the governance or data access committee. One entry per
          person; do not collapse several members into one. Record only members
          the sources name — committee membership is frequently undisclosed,
          and an absent list is a correct answer.
        range: Person
        multivalued: true
        inlined_as_list: true
        slot_uri: d4d:governanceCommitteeMember
      committee_contact:
        description: >-
          Contact point for the governance committee — the person or address
          that answers questions about access policy, procedure and oversight.
          Replaces `ExportControlRegulatoryRestrictions.governance_committee_contact`.
        range: Person
        slot_uri: d4d:governanceContactPoint
        broad_mappings:
          - schema:contactPoint
      access_review_process:
        description: >-
          How an access request is reviewed and decided: who submits, what is
          required of them, who reviews, and on what criteria.
        range: string
        slot_uri: d4d:accessReviewProcess
        annotations:
          "d4d:docExample": >-
            Requests are submitted through the portal with a research plan and
            institutional signature, and reviewed at the committee's monthly meeting.
      access_decision_timeframe:
        description: >-
          Stated turnaround for an access decision, as the source gives it.
          Free text rather than a duration, because sources state this as
          prose ("within 30 days", "at the next quarterly meeting").
        range: string
        slot_uri: d4d:accessDecisionTimeframe
      appeal_process:
        description: >-
          What recourse an applicant has if access is refused or revoked.
        range: string
        slot_uri: d4d:appealProcess
      stewardship_roles:
        description: >-
          Named stewardship or custodianship roles for the data, distinct from
          its creators — who holds continuing responsibility for it, and for
          what.
        range: string
        multivalued: true
        slot_uri: d4d:stewardshipRole
      accountable_organization:
        description: >-
          The organization accountable for the dataset over time, including
          after the funding period ends. Frequently different from the
          organization that created it.
        range: Organization
        inlined: true
        slot_uri: d4d:accountableOrganization


enums:

  ComplianceStatusEnum:
    description: >-
      Compliance status for regulatory frameworks. Indicates the extent to which
      a dataset complies with specific regulations (e.g., HIPAA, 45 CFR 46).
      These are workflow status values that may evolve as regulations are assessed
      or as the dataset is modified.
    permissible_values:
      compliant:
        description: >-
          Dataset is compliant with the regulation. All requirements are met and
          documented.
        broad_mappings:
          - dcterms:conformsTo
      partially_compliant:
        description: >-
          Dataset is partially compliant, with known limitations or gaps in
          compliance. Some but not all requirements are met.
        broad_mappings:
          - dcterms:conformsTo
      not_compliant:
        description: >-
          Dataset does not comply with the regulation. Significant requirements
          are not met.
      not_applicable:
        description: >-
          Regulation does not apply to this dataset based on scope, jurisdiction,
          or subject matter.
      under_review:
        description: >-
          Compliance status is currently under review or assessment. Final
          determination has not been made.

  ConfidentialityLevelEnum:
    description: >-
      Confidentiality classification levels for datasets indicating the degree
      of access restrictions and data sensitivity.

      NOTE: This enum classifies data sensitivity and access control (WHO can access),
      which is orthogonal to DataUsePermissionEnum that specifies use restrictions
      (WHAT authorized users can do with data). ConfidentialityLevelEnum determines
      access requirements, while DataUsePermissionEnum uses DUO terms to specify
      permitted uses once access is granted.
    permissible_values:
      unrestricted:
        description: >-
          No confidentiality restrictions. Data is publicly available with
          no access controls required. Equivalent to public or open access data.
      restricted:
        description: >-
          Restricted access requiring approval or registration. Data contains
          sensitive information requiring controlled access. May require account
          creation, data use agreement, or institutional approval.
      confidential:
        description: >-
          Highly confidential with strict access controls. Data contains
          highly sensitive information with significant privacy or security
          implications. Typically requires IRB approval, formal data use agreements,
          institutional authorization, or other formal vetting processes.

  DataUsePermissionEnum:
    description: >-
      Data use permissions and restrictions based on the Data Use Ontology (DUO).
      DUO is a standardized ontology for representing data use conditions developed
      by GA4GH. See https://github.com/EBISPOT/DUO
    permissible_values:
      # Permissions
      no_restriction:
        description: No restriction on data use.
        meaning: DUO:0000004
      general_research_use:
        description: Data available for any research purpose (GRU).
        meaning: DUO:0000042
      health_medical_biomedical_research:
        description: Data limited to health, medical, or biomedical research (HMB).
        meaning: DUO:0000006
      disease_specific_research:
        description: Data limited to research on specified disease(s) (DS).
        meaning: DUO:0000007
      population_origins_ancestry_research:
        description: Data limited to population origins or ancestry research (POA).
        meaning: DUO:0000011
      clinical_care_use:
        description: Data available for clinical care and applications (CC).
        meaning: DUO:0000043
      # Modifiers/Restrictions
      no_commercial_use:
        description: Data use limited to non-commercial purposes (NCU).
        meaning: DUO:0000046
      non_profit_use_only:
        description: Data use limited to not-for-profit organizations (NPU).
        meaning: DUO:0000045
      non_profit_use_and_non_commercial_use:
        description: Data limited to not-for-profit organizations and non-commercial use (NPUNCU).
        meaning: DUO:0000018
      no_methods_development:
        description: Data cannot be used for methods or software development (NMDS).
        meaning: DUO:0000015
      genetic_studies_only:
        description: Data limited to genetic studies only (GSO).
        meaning: DUO:0000016
      ethics_approval_required:
        description: Ethics approval (e.g., IRB/ERB) required for data use (IRB).
        meaning: DUO:0000021
      collaboration_required:
        description: Collaboration with primary investigator required (COL).
        meaning: DUO:0000020
      publication_required:
        description: Results must be published/shared with research community (PUB).
        meaning: DUO:0000019
      geographic_restriction:
        description: Data use limited to specific geographic region (GS).
        meaning: DUO:0000022
      institution_specific:
        description: Data use limited to approved institutions (IS).
        meaning: DUO:0000028
      project_specific:
        description: Data use limited to approved project(s) (PS).
        meaning: DUO:0000027
      user_specific:
        description: Data use limited to approved users (US).
        meaning: DUO:0000026
      time_limit:
        description: Data use approved for limited time period (TS).
        meaning: DUO:0000025
      return_to_database:
        description: Derived data must be returned to database/resource (RTN).
        meaning: DUO:0000029
      publication_moratorium:
        description: Publication restricted until specified date (MOR).
        meaning: DUO:0000024
      no_population_ancestry_research:
        description: Population/ancestry research prohibited (NPOA).
        meaning: DUO:0000044