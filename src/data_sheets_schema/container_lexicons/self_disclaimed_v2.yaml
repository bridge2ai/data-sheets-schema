# Self-disclaimed typed-container entries (#2913): the container registry,
# the role/presence negation lexicon and the role predicates read by
# `data_sheets_schema.self_disclaimed`.
#
# Generic by construction: no dataset, consortium, programme or person name
# appears here. Every regular expression is matched case-insensitively
# against whitespace-folded text. `{role}` and `{presence}` in a cue expand
# to the alternation of the container's own `role_terms` or
# `presence_terms`, so a cue never matches another container's role.
#
# Once merged, any change to these bytes is a new instrument: bump
# `version`, rename the file, and add its sha256 to the pins in
# tests/test_self_disclaimed.py. Version 1 stays beside this file, byte for
# byte, and still loads: every rule below that v1 lacks is declared here,
# so v1 read by the same code reproduces v1's output.
#
# Version 2 adds, over version 1:
# - a `subject` scope for `presence.prospective_predicate` (#3131), with
#   `statement_subject`;
# - `item_qualifiers`, which tell a presence member's own item from another
#   item of its kind named with no other-marker (#3244);
# - `self_reference_in` on `presence.none_reports_available`, a
#   self-reference inside the item it reports (#3261);
# - `shared_final_entry`, how the diff resolves two original members
#   followed to one final entry (#3273).
instrument: self_disclaimed
version: 2
issue: 2913
revisions: [3131, 3244, 3261, 3273]

# The member's own leaves the cues read. Nested objects (an affiliation, a
# principal investigator) are other entities and are not read.
narrative:
  fields: [description, notes, source_caveats]
  suffixes: [_details]

# A finding names a member's placement when one of its paths is the member
# itself or runs through one of these leaves of it (`fields`, plus the
# container's own `placement_fields`). A finding that names only other
# leaves (prose, a count, an affiliation) is about those values, not about
# whether the entry belongs in the container.
placement:
  fields: [id, name]

containers:
  creators:
    kind: person_role
    placement_fields: [principal_investigator, credit_roles]
    role_terms: ['creators?', 'authors?', 'co-?authors?', 'authorship']
    role_verbs: ['created', 'creates', 'authored', 'produced', 'developed']
    # Check (b): a receipt snippet addressed to the member must name one.
    role_predicates: ['authors?', 'authored', 'authorship', 'co-?authors?',
                      'creat(?:or|ors|ed|es)', '(?:co-?)?principal investigators?',
                      'co-?investigators?', 'contributors?', 'developed by',
                      'produced by', 'prepared by', 'generated by']
  maintainers:
    kind: person_role
    placement_fields: [role]
    role_terms: ['maintainers?', 'hosts?', 'stewards?', 'curators?', 'custodians?']
    role_verbs: ['maintain(?:s|ed|ing)?', 'host(?:s|ed|ing)?', 'curat(?:e|es|ed|ing)',
                 'steward(?:s|ed|ing)?']
    role_predicates: ['maintain(?:s|ed|er|ers|ing)?', 'maintenance', 'host(?:s|ed|ing)?',
                      'curat(?:e|es|ed|ing|ion|or|ors)', 'steward(?:s|ship)?',
                      'custodians?']
  data_collectors:
    kind: person_role
    placement_fields: [role]
    role_terms: ['(?:data )?collectors?']
    role_verbs: ['collect(?:s|ed|ing)?', 'acquir(?:e|es|ed|ing)', 'gather(?:s|ed|ing)?']
    role_predicates: ['collect(?:s|ed|ing|ion|or|ors)?', 'acquisition', 'acquir(?:e|es|ed|ing)',
                      'recruit(?:s|ed|ing|ment)?', 'enrol(?:l)?(?:s|ed|ing|ment)?',
                      'contribut(?:e|es|ed|ing|or|ors)', 'gather(?:s|ed|ing)?']
  variables:
    kind: presence
    placement_fields: [variable_name]
    # VariableMetadata carries its prose in these free-text slots as well.
    narrative_fields: [derivation, quality_notes]
    presence_terms: ['variables?', 'data elements?', 'fields?', 'columns?', 'measures?']
  instances:
    kind: presence
    placement_fields: [instance_type]
    presence_terms: ['data types?', 'modalit(?:y|ies)', 'instances?', 'data elements?',
                     'record types?']
  splits:
    kind: presence
    presence_terms: ['splits?', 'partitions?', 'holdout(?: data)?(?: sets?)?', 'test sets?',
                     'validation sets?', 'training sets?']

# Nouns that name a role assignment rather than a particular role.
assignment_nouns: ['roles?', 'titles?', 'categor(?:y|ies)', 'designations?', 'positions?']

# An assignment noun is the member's own unless another thing owns it: "the
# title of the award", "the position of the server" and "a category for the
# device" are about the award, the server and the device (#3209). The owner
# is the phrase after `of` or `for`, up to the phrase's end and at most
# `words` words. It is the member's when it holds one of the member's own
# self-references, one of the container's role terms or role verbs, or one
# of `member_words`, and after `for` also when it holds one of
# `held_in_words`, the thing a role is held in ("credit roles for the
# dataset itself" are the member's roles); any other owner is another
# thing's. Such a noun never puts a clause in `role` scope, and a cue whose
# own assignment noun is another thing's is out of scope whatever else its
# clause names.
assignment_owner:
  after: '\s+(of|for)\s+'
  words: 3
  member_words: ['her', 'hers', 'him', 'his', 'them', 'their', 'herself', 'himself', 'themselves',
                 'persons?', 'people', 'individuals?', 'members?', 'contributors?', 'investigators?',
                 'researchers?', 'scientists?', 'staff', 'personnel', 'entry', 'contacts?']
  held_in_words: ['datasets?', 'data', 'resources?', 'releases?', 'collections?', 'corpus', 'corpora']

# The sentence's subject is the member itself: a deictic phrase or pronoun,
# a sentence opening on a participle with the subject elided, or the
# member's own `name`/`variable_name` (added by the code). One a comma
# separates from the cue counts only when the stretch after the last comma
# has no subject of its own, so "Given the consent terms, the raw
# recordings are not released" is about the recordings.
self_reference:
  - '\b(?:this|the present|the same) (?:member|person|individual|entry|contact|organi[sz]ation|institution|group|team|body|consortium|creator|author|maintainer|collector|variable|element|data element|data type|type|instance|modality|split|partition|set)\b'
  - '^(?:it|he|she)\b'
  - '\b(?:it|this) (?:is|was|has|appears)\b'
  - '^(?:named|listed|recorded|credited|identified|described|mentioned|included|given|shown|cited|stated|reported|treated|kept)\b'
  # A subject pronoun right before the cue, which a cue opening on its
  # auxiliary leaves without one: "This is not yet released", "After review,
  # it is not yet released", "This is not a creator" (the cue starts at "is").
  # Not the object of `of`/`for`: "A version of it is not released" is about
  # the version.
  - '(?<!\bof )(?<!\bfor )\b(?:it|this|he|she)(?=\s*$)'

# The clause is about other people or things, so its role or presence
# wording does not disclaim the member. Read with the member's own
# self-references blanked: "this member among the creators" is the member.
other_subject:
  - '\b(?:these|those|other|such|the other|the remaining|the listed|the named|individual|member) (?:[\w-]+ ){0,2}?(?:individuals|people|persons|members|investigators|personnel|staff|collaborators|institutions|organi[sz]ations|centers|centres|sites|authors|creators|maintainers|entities|partners)\b'
  - '\bthe (?:[\w-]+ ){0,2}(?:individuals|people|persons|investigators|personnel|staff|collaborators|institutions|organi[sz]ations)\b'
  - '^(?:they|none of these|none of those)\b'
  - '\bthey (?:are|were)\b'

# The item a presence container's cue says is unstated names other items of
# the container's own kind: "Two other variables are not part of the public
# release", "The remaining partitions are not one of the released files",
# "No source reports the other splits as available" (#3231, #3250). Read
# only in that item, self-references blanked: the cue's `item` group where
# the pattern declares it as its object (`object: [item]`), else the cue's
# subject
# (the stretch before the cue after its last comma). Never in the whole
# clause: "Unlike the other splits, this split is not released" and "it is
# not one of the listed data types" are about the member. Never for a
# person-role container, whose active cues' subject is the source they cite
# ("These data sets do not name her as a creator", #3249). An item named
# with no such determiner ("The external test set is described as
# planned") is read as another's only where its qualifier disagrees with
# the member's identity (`item_qualifiers`); otherwise it may be the
# member.
other_item_subject:
  - '\b(?:another|these|those|other|such|the other|the remaining|the rest of the) (?!than\b)(?:[\w-]+ ){0,2}?(?:variables?|data elements?|elements|fields?|columns?|measures?|instances?|data types?|modalit(?:y|ies)|record types?|splits?|partitions?|(?:holdout |test |validation |training )?(?:data )?sets?)\b'

# An item named with no other-marker is another item when its qualifier
# disagrees with the member's own identity (#3244). Each axis lists
# alternatives that exclude one another: "the external test set" in the
# prose of a member named "Internal validation set" is another item, on
# both axes. A presence noun phrase is the container's presence term with
# at most `words` words before it; its qualifiers are the alternatives it
# names, the presence term's own words included ("test set" names `test`).
# The member's are those its `identity_fields` name, and the fragment (after
# the last `#`, `/` or `:`) of its `identity_id_fields`. A phrase disagrees
# only on an axis where both name an alternative and none is shared, so a
# member whose identity names no qualifier (a name such as "Entry", or no
# name at all) is never told apart and keeps v1's reading. A member named
# "Holdout set" does name one (`test` on the second axis, which lists
# `hold-?out`), so "the validation set" is another item in its prose. A disagreeing phrase is
# read like an other-marker in the item a cue reports (the reason is
# `other_qualified_item`), and it does not license a `presence` or
# `subject` cue.
item_qualifiers:
  identity_fields: [name, variable_name]
  identity_id_fields: [id]
  words: 2
  axes:
    - ['external', 'internal']
    - ['train(?:ing)?', 'validation|dev(?:elopment)?', 'test(?:ing)?|hold-?out|held-?out']

# The `subject` scope (#3131): what a cue with no object of its own says of
# its subject. It counts where a self-reference that owns nothing (not
# "this split's schedule", not "the consent process for this split") and
# heads the subject (not "the labels in this split", #3592) makes the cue
# about the member as a `self` cue would; else where the cue's
# subject names a source statement ("Both statements are prospective on
# that page") or the container's presence term, not another item's
# (`item_qualifiers`). A statement noun counts only as the subject's head:
# the subject's text before it must match `head`, at most three words with
# no preposition or participle among them (an optional "both of" and the
# like before them), so "The consent process described in both statements"
# is about the consent process, not the statements. A presence term counts
# the same way, only as the subject's head and with nothing possessive after
# it: "The holdout set is prospective" counts, "The consent process for the
# splits", "Enrollment of the pediatric arm of the split" and "The split's
# schedule" do not (#3592). A head also ends its noun phrase: what follows
# it in the subject must match `tail` (the subject's end, punctuation other
# than a hyphen, or a word that opens a postmodifier, a coordination or the
# predicate), so a statement noun, presence term or self-reference used as
# a modifier ("The split labels", "The holdout set consent process", "This
# split assignment", "The statement authors") heads nothing (#3606). A statement noun followed by `topic`
# ("statements about the consent process", "references to the consent
# process") counts only when the topic is headed by such a self-reference
# (read on the topic alone, so "descriptions of this split" names the split
# and "statements about the consent process for this split" or "about this
# split's consent process" does not, #3593) or by such a presence term;
# otherwise the reason is `statement_about_other`. Any other subject ("The
# consent process is prospective", "Enrollment of the pediatric arm remains
# prospective") is out of scope with reason `no_member_subject`. The subject is a passive
# cue's (`_subject`: the clause before the cue, an appositive and anything
# before its last comma left out).
statement_subject:
  nouns: ['statements?', 'descriptions?', 'mentions?', 'references?']
  head: '\s*(?:(?:both|all|each|either|neither|none|some|any|one|two|three) of\s+)?(?!(?:[\w''-]+\s+){0,2}?(?:in|on|of|to|by|for|from|at|with|within|across|about|under|described|mentioned|cited|listed|given|named|made|quoted)\s)(?:[\w''-]+\s+){0,3}'
  topic: '\s+(?:about|of|on the subject of|regarding|concerning|describing|to)\s+(?P<topic>.+)'
  tail: '\s*(?:$|[,;:()\u2013\u2014]|(?:in|on|of|to|by|for|from|at|with|within|across|about|under|over|regarding|concerning|describing|as|that|which|who|whose|where|described|mentioned|cited|listed|given|named|made|quoted|reported|and|or|nor|itself|themselves|alone|all|both|also|too|still|now|remains?|is|are|was|were)\b)'

# How the diff resolves two original members that `receipts.remap_path`
# follows to the same final entry. `identity_keys`: the one member whose
# identity keys agree with the entry keeps it (v1's only rule).
# `scalar_overlap` (#3273): where no member's keys agree (keyless splits
# joined by overlap), the member whose scalar leaves overlap the entry's
# strictly more than every other member's keeps it, with basis
# `shared_final_entry_by_overlap`. Every other member, and all of them on
# a tie, is `identity_unresolved` (`shared_final_entry`).
shared_final_entry:
  resolve_by: [identity_keys, scalar_overlap]

# A hit whose guard matches is a caveat about a date, amount or attribute
# of the member, or about a study's design, not about its role or presence.
# Guarded hits are reported in their own list, never as flags. A guard
# reads one of: `clause`, the whole clause holding the cue; `before_cue`,
# the clause up to the cue; `cue`, the matched cue alone; `after_phrase`,
# the text after the cue up to punctuation, a coordinating conjunction,
# "rather" or a subordinator; `object`, the texts the pattern's own
# `object` names as what the cue says is unstated. It reads them with the
# member's own self-references blanked: "this contact" is the member, not a
# narrower sub-role.
#
# A pattern's `object` lists where that thing lies: `after_phrase` for an
# active cue ("does not name <her as an author>"), `subject` and
# `as_phrase` for a passive one ("<the start date of her role> is not
# stated", "are not recorded <as creator affiliations>"), `cue` for a cue
# that ends on the role noun ("does not state <a credit role>"), `item`
# for a cue whose named `item` group holds the item it reports ("No source
# reports <the holdout set> as available"; the cited source is not read,
# #3265). A passive
# cue's `subject` is the clause before it with an appositive closing on the
# cue's own comma left out, and with anything before its last remaining
# comma left out: in "This split, planned for 2025, is not yet released"
# the subject is "This split", not the year that modifies it (#3210), and
# in "Per the 2024 slide, this split is not yet released" it is "this
# split". A date that heads the subject ("This split's 2025 release date is
# not yet available") is still what is unstated. The
# source a sentence cites is an active cue's subject, so "The website does
# not name her as a creator" and "The 2024 slide ..." are not read as an
# attribute or a date, and neither is the cue's own verb ("do not credit
# her as an author"). A role cue is read this narrowly only where its
# object names the role itself. Where the role that licenses it lies
# elsewhere in the clause ("the author affiliations ... do not name the
# Hastings Center"), what it says is unstated is not located and `object`
# reads the whole clause, the cue's verb included.
#
# A sub-role counts only in one of two shapes: as a complement ("as the
# corresponding author", "is the PI") or as the modifier of a role noun or
# of a principal investigator ("a principal investigator role", "the
# contact PI"). "The contact" as a noun phrase of its own is the member
# ("do not identify the contact as the maintainer", "the contact's role is
# not stated"), not a narrower role.
guards:
  date_amount:
    reads: object
    regex: '\b(?:dates?|dated|periods?|years?|months?|weeks?|days?|timeframes?|time ?frames?|durations?|start|end|deadlines?|timelines?|schedules?|when|amounts?|counts?|numbers?|sizes?|totals?|figures?|budgets?|costs?|currenc(?:y|ies)|percent(?:ages?)?|funding)\b|\b(?:19|20)\d\d\b|\$\s?\d'
  attribute:
    reads: object
    regex: '\b(?:orcids?|identifiers?|ids?|affiliations?|e-?mails?|address(?:es)?|departments?|urls?|homepages?|websites?|dois?|credit(?:_roles)?|taxonomy|contributor roles?)\b'
  # The role the cue says is unstated is a narrower one than the container's
  # ("does not state a principal investigator role" of a creator).
  subrole:
    reads: cue
    regex: &subrole '\b(?:as|is|was|are|were|be|being|been) (?:an? |the |its |their |her |his )?(?:[\w-]+ )?(?:(?:co-?)?principal investigators?|pis?|corresponding|contact)\b|\b(?:(?:co-?)?principal investigators?|pis?|corresponding|contact)(?= (?:roles?|titles?|authors?|authorship|designations?|positions?|status|capacit(?:y|ies)|categor(?:y|ies)|(?:co-?)?principal investigators?|pis?)\b)'
  # A cue that stops at its verb ("does not assign", "does not state
  # whether") has its object after it: "... her a principal investigator
  # role", "... whether she is the corresponding author". It reads the
  # phrase after the cue, so a second role in a coordinated phrase ("a
  # creator or only the contact") or a contrast ("the maintainer rather
  # than as a contact") is not taken for the object.
  subrole_object:
    reads: after_phrase
    regex: *subrole
  # A passive cue ("... is not recorded") comes after the role it negates.
  subrole_in_clause:
    reads: clause
    regex: *subrole
  design:
    reads: before_cue
    regex: '\b(?:study|studies|cohorts?|design|trials?|recruitment|enrol(?:l)?ment|collection|project|protocol)\s+(?:\w+\s+){0,2}$'

# Scope: `role` needs one of the container's role terms or role verbs, or an
# assignment noun no other thing owns (`assignment_owner`), in the clause
# holding the cue outside the member's own self-references, or a role term
# or verb inside a self-reference that is the cue's own object ("does not
# name this maintainer") and does not own it ("this author's institution",
# "the email of this author" name no role, #3251); `self` needs a
# self-reference before the cue, in the cue's own clause or, when that
# clause has no subject of its own ("It is derived, but is not yet
# released"), earlier in the sentence; `presence` needs what `self` needs
# or a presence term in the clause; `subject` needs a self-reference that
# owns nothing and heads the subject, or a subject headed by a source
# statement or a presence term (`statement_subject`); `none` needs nothing
# more. A `none` cue is read as
# about the member's status by itself: `role.not_necessarily` names the
# container's own role. `presence.prospective_predicate` was `none` in v1,
# which counted whatever the clause's subject was ("the consent process is
# prospective"); it is `subject` here (#3131), and its date/amount guard
# reads that subject ("Both 2025 statements are prospective"; "The split
# sizes are prospective" is about the sizes, which the split term only
# modifies, #3606). A presence term
# that names another item (`item_qualifiers`) licenses no cue. A pattern's
# `self_reference_in: [item]` also accepts a self-reference that owns
# nothing and heads the cue's `item` group, as `statement_subject.head` and
# `tail` read a head ("No source reports this split as available", #3261;
# not "the labels in this split" or "this split data", #3607); a
# self-reference that a comma separates from the cue
# ("For this split, the data are recorded as planned") still does not
# count. A presence term licenses a `presence` cue only outside
# the words the cue itself spells, and not inside one of the member's own
# self-references: `presence.planned_element` ends on the planned noun, so
# "Unlike the planned splits for the next release, this split is complete"
# names no presence term of its own (#3230). A pattern that declares its
# object inside the cue (`object: [cue]` or `[item]`) is read with the cue,
# whose free span names the item it reports ("No source reports the
# holdout set as available"). Every cue is rejected by an other-subject anywhere in the
# clause holding it, and a presence container's cue also by an other item
# in the item it reports (`other_item_subject`), each read with the
# member's own self-references blanked.
patterns:
  - id: role.assignment_negated
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:(?:does|do|did) not|without) (?:assign(?:ing)?|giv(?:e|ing)|nam(?:e|ing)|designat(?:e|ing)|identify(?:ing)?|credit(?:ing)?|attribut(?:e|ing))\b'
    scope: role
    guards: [date_amount, attribute, subrole_object]
    object: [after_phrase]
  - id: role.no_role_stated
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:(?:does|do|did) not|without) (?:state|stating|specify|specifying|record|recording|give|giving) (?:an? |any |the |this |that |its |their |his |her )?(?:[\w''’-]+ ){0,2}(?:roles?|titles?|categor(?:y|ies)|designations?|positions?)\b'
    scope: role
    guards: [date_amount, attribute, subrole]
    object: [cue]
  - id: role.states_no_role
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:states?|gives?|assigns?|names?|records?|reports?|specif(?:y|ies)) no (?:[\w''’-]+ ){0,2}(?:roles?|titles?|categor(?:y|ies)|designations?|positions?)\b'
    scope: role
    guards: [date_amount, attribute, subrole]
    object: [cue]
  - id: role.passive_not_stated
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:is|are|was|were) not (?:stated|given|reported|recorded|specified|established|assigned|named)\b'
    scope: role
    guards: [date_amount, attribute, subrole_in_clause]
    object: [subject, as_phrase]
  - id: role.not_stated_who
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:does|do|did) not (?:state|say|specify|indicate|establish|confirm) (?:who|whether|that)\b'
    scope: role
    guards: [date_amount, attribute, subrole_object]
    object: [after_phrase]
  - id: role.none_assigns
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:none|neither|nothing(?: in the bundle)?|no (?:source|document|passage|page|material)s?(?: in the bundle)?)\b[^.;:]{0,40}?\b(?:assigns?|names?|designates?|credits?|identif(?:y|ies)|establish(?:es)?|states?|says|specif(?:y|ies)|indicates?)\b'
    scope: role
    guards: [date_amount, attribute, subrole, subrole_object]
    object: [after_phrase]
  - id: role.contrast
    class: role_disclaimer
    kinds: [person_role]
    cue: '\brather than as (?:an? |the |its )?(?:(?:individual|separate|separately declared|declared|dataset|data) )?(?:{role})\b'
    scope: self
    guards: []
  - id: role.not_the_role
    class: role_disclaimer
    kinds: [person_role]
    cue: '\b(?:(?:is|was) not|not (?:named|listed|identified|described|credited|designated|recorded|given) as) (?:an? |the |its )?(?:(?:dataset|data) )?(?:{role})\b'
    scope: self
    guards: []
  - id: role.not_necessarily
    class: role_disclaimer
    kinds: [person_role]
    cue: '\bnot necessarily (?:an? |the |its )?(?:{role})\b'
    scope: none
    guards: []
  - id: presence.recorded_as_planned
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:stated|recorded|described|listed|reported|included|named|given|presented|mentioned) as (?:an? |the )?(?:planned|prospective|intended|anticipated|future|proposed|projected)\b'
    scope: presence
    guards: []
  - id: presence.planned_element
    class: presence_disclaimer
    kinds: [presence]
    cue: '\bplanned (?:data elements?|elements?|work|provisions?|data types?|modalit(?:y|ies)|measures?|collection|(?:{presence}))\b'
    scope: presence
    guards: []
  - id: presence.contrast_released
    class: presence_disclaimer
    kinds: [presence]
    cue: '\brather than as (?:an? |the )?(?:[\w-]+ ){0,3}?(?:released|present|available|existing|delivered|collected|included|distributed|actual)\b'
    scope: presence
    guards: []
  - id: presence.not_member_of
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:is|are|was|were) not (?:one|part|among|any) of the\b'
    scope: presence
    guards: [date_amount]
    object: [subject]
  - id: presence.none_reports_available
    class: presence_disclaimer
    kinds: [presence]
    # `item` is the item the cue reports: the span the other-item check and
    # the date/amount guard read, so the source it cites ("No source from
    # 2024 reports ...") is not what is unstated (#3265).
    cue: '\b(?:none|no (?:source|document|passage|page)s?(?: in the bundle)?)\b[^.;:]{0,20}?\b(?:reports?|states?|lists?|describes?|shows?|presents?)\b(?P<item>[^.;:]{0,80}?) as (?:available|released|present|collected|complete|delivered|distributed)\b'
    scope: presence
    guards: [date_amount]
    object: [item]
    self_reference_in: [item]
  - id: presence.not_yet_released
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:is|are|was|were|has|have) not (?:yet )?(?:been )?(?:released|available|collected|included|present|distributed|delivered|produced|generated|acquired)\b'
    scope: self
    guards: [date_amount, attribute]
    object: [subject]
  - id: presence.prospective_predicate
    class: presence_disclaimer
    kinds: [presence]
    cue: '\b(?:is|are|was|were|remains?) (?:all |both |only |still |entirely |explicitly )?prospective\b'
    scope: subject
    guards: [design, date_amount]
    object: [subject]
