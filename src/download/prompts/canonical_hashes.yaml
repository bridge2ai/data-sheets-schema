        \ tests/test_download/test_generic_v5_prompt.py asserts that. Predictions are registered\
        \ in notes/generic_v5_analysis_plan.md, not in the prompt."
      retired_on: '2026-08-14'
      sha256: e4d0570921f84f2024a8166bbd6284557d1c7f65471d8356a18edd957bf42e52
    - pinned_on: '2026-08-14'
      reason: 'rotation before any v5 run: corrects an attribution in the rationale (#531
        established 1,094 VOICE values, not the corpus-wide ~12,000). The prompt body is byte-identical
        to the previous pin; only rationale prose, which prompt_body does not send, changed.
        Free to rotate because no record names generic_v5 yet.'
      retired_on: '2026-08-15'
      sha256: 606e7382cd4ee5214d7a910fc5b89f8e9faa053cb193dbaeff02ac65b672904d
    - pinned_on: '2026-08-15'
      reason: "reconcile the CURIE rule with the playbook before any v5 run (#573). The first\
        \ version said an identifier is \"never as a URL\" with no scope, contradicting the\
        \ playbook \u2014 which says a URL is correct where no prefix is declared, that URL-ranged\
        \ slots take URLs, and that prose is exempt. `download_url` and `access_urls` are\
        \ declared `uri`, so the unscoped rule told the API arm to put a CURIE where the schema\
        \ requires a URL. Both texts now state one rule: CURIE where a prefix is declared,\
        \ URL-ranged slots and prose untouched, never an invented prefix, fragment on an attested\
        \ identifier where none fits. Free to rotate because no record names generic_v5."
      retired_on: '2026-08-17'
      sha256: bc239c3ab991b18e67cac19c25c4a374b5fec867d707c781e78c902606d5815a
    - pinned_on: '2026-08-17'
      reason: "restore the rule force #573 softened (#591). The v5 canary put 45 resolver\
        \ URLs in uriorcurie id slots for doi/ROR \u2014 prefixes the schema declares \u2014\
        \ against 12 in the v4 baseline. #573 correctly removed an unscoped \"never as a URL\"\
        \ because download_url and access_urls are uri-ranged, but replaced it with \"rather\
        \ than\", alongside two exemptions, and the ban lost its force. The ban is now scoped\
        \ rather than softened: in an identifier slot, never a resolver URL where a prefix\
        \ is declared; URL-ranged slots and prose exempt entirely. Only the canary record\
        \ names generic_v5, and it is being superseded."
      retired_on: '2026-08-17'
      sha256: 45c6f86f4d409dd548d070b35e854db4a78d69e536103cb819de86329c10cbb6
    - pinned_on: '2026-08-17'
      reason: 'add source priority as the fifth v5 rule (Harry, 2026-08-17), on top of the
        restored CURIE force from #591. The uniform rules said to represent a disagreement
        rather than select a side, and a v4 CHORUS record named the gap: "no instance count
        is asserted because the two sources give different figures and the bundle offers no
        basis for preferring one". source_priority in the manifest is that basis, declared
        there rather than in a prompt per #422. The rule went into the v5 block rather than
        editing the inherited disagreement rule, which is v2s and carried by every version.'
      retired_on: '2026-08-18'
      sha256: 3446689e35fcabd4e873d30f4bd08e80a2c3fd6cd63b3e73343cfd8cceaee893
    - pinned_on: '2026-08-18'
      reason: "resolve the identifier contradiction and correct the rule count (#603). The\
        \ provenance rule said \"take it from the evidence or omit it\" and the minting rule\
        \ said to hang a new identifier off an attested one \u2014 a minted fragment is not\
        \ in the evidence, so the first forbade what the second required, on the case a model\
        \ meets for every identifier it writes. The line is now external referent versus internal\
        \ label: an identifier naming something outside this dataset is a claim about the\
        \ world and comes from the evidence; one naming a part of this record is a label no\
        \ evidence can supply, and the test is whether the thing named has a referent outside\
        \ the record. Also corrects the rationale from four rules to five."
      retired_on: '2026-08-19'
      sha256: 389f7bfe6a202f3e7207e28296b87dad44de19f956c503532e2d6530768613ec
    - pinned_on: '2026-08-19'
      reason: "Rationale said \"Four rules\"; the block holds five (#638). Rationale only\
        \ \u2014 above `## Prompt body`, never sent to the model, so the body hash is unchanged\
        \ and the condition is not re-baselined."
      retired_on: '2026-08-19'
      sha256: 97ccf288e22b52c7baca4fb163c60218f821b365c846e9eaa9a81b292c4b0513
    - pinned_on: '2026-08-19'
      reason: "Rule 1 exemption said \"declared range is a URL\", which uriorcurie satisfies\
        \ on a plain reading \u2014 the model expanded every id to a resolver URL (29/29)\
        \ where v4 with no rule wrote 62/68 CURIEs (#644). The governed range is now named\
        \ literally, matching the playbook wording that never had the hole."
      retired_on: '2026-08-19'
      sha256: 4d83f0dd032270d1f8f4a6c481a8edbb58dca3dcfe1e70febc28df0e5a0fa0a9
    - pinned_on: '2026-08-19'
      reason: 'The #644 fix examples leaked AI-READI DOI prefix 10.60775 into the generic
        prompt; examples now show CURIE form without any project quantity.'
      retired_on: '2026-08-19'
      sha256: c7fcc2283d1d8d84c11a156b26205c93e507134ec90cccc3adb2199d29b3ada5
    - pinned_on: '2026-08-19'
      reason: 'Round-2 review of #645: examples are form-only (a real UC Berkeley ROR id had
