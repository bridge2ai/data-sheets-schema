<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="332"><rect width="100%" height="100%" fill="white"/><text x="30" y="47" font-family="Arial,sans-serif" font-size="27" fill="#172033" font-weight="700">Repeated field topics account for some, but not all, review volume</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="16" fill="#526277" font-weight="400">Counts per dataset across 12 primary reviews. Grouping is within record; it cannot certify unique errors.</text><text x="290" y="119" font-family="Arial,sans-serif" font-size="14" fill="#172033" font-weight="700">Raw comments</text><text x="435" y="119" font-family="Arial,sans-serif" font-size="14" fill="#172033" font-weight="700">Strict groups</text><text x="580" y="119" font-family="Arial,sans-serif" font-size="14" fill="#172033" font-weight="700">Broad groups</text><text x="30" y="158" font-family="Arial,sans-serif" font-size="15" fill="#172033" font-weight="400">AI_READI</text><rect x="285" y="137" width="142" height="35" fill="#5c9fb2"/><text x="300" y="159" font-family="Arial,sans-serif" font-size="16" fill="#172033" font-weight="400">124</text><rect x="430" y="137" width="142" height="35" fill="#61a2b4"/><text x="445" y="159" font-family="Arial,sans-serif" font-size="16" fill="#172033" font-weight="400">120</text><rect x="575" y="137" width="142" height="35" fill="#62a3b4"/><text x="590" y="159" font-family="Arial,sans-serif" font-size="16" fill="#172033" font-weight="400">119</text><text x="30" y="196" font-family="Arial,sans-serif" font-size="15" fill="#172033" font-weight="400">CHORUS</text><rect x="285" y="175" width="142" height="35" fill="#248099"/><text x="300" y="197" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="400">169</text><rect x="430" y="175" width="142" height="35" fill="#358aa1"/><text x="445" y="197" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="400">155</text><rect x="575" y="175" width="142" height="35" fill="#3