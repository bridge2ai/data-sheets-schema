# Evaluation applicability context for AI-READI
# Bridge2AI Data Generation Project: prospective multimodal cohort investigating type 2 diabetes
# Format: d4d-evaluation-context-1
# Bundle chunks: data/preprocessed/chunks/AI_READI_chunks.yaml (rule.version: 2, 25 chunks)

human_subjects:
  value: true
  # chunks: [c002, c019]
  evidence: "[chunks: c002] \"AI- READI was approved by the Institutional Review Board\" [chunks: c019] \"This dataset contains data from 2280 participants that was collected between July 19, 2023 and May 01, 2025.\""

regulated_access:
  value: true
  # chunks: [c015]
  evidence: "[chunks: c015] \"Accessing the dataset requires several steps, including: Login in through a verified ID system, Agreeing to use the data only for type 2 diabetes related research, Agreeing to the license terms which set certain restrictions and obligations for data usage\""

shared_dataset:
  value: true
  # chunks: [c004]
  evidence: "[chunks: c004] \"All  data  are  stored  and  shared\\nusing  FAIRhub\""

data_collection:
  value: true
  # chunks: [c004, c019]
  evidence: "[chunks: c019] \"This dataset contains data from 2280 participants that was collected between July 19, 2023 and May 01, 2025.\" [chunks: c004] \"REDCap is used for collecting patient- reported data from\\nquestionnaires  and  the  following  clinical  data  from  the\\nvisit: medications assessment, vitals, visual acuity, contrast\\nsensitivity, monofilament test results and CBC test results.\""

data_processing:
  value: true
  # chunks: [c015]
  evidence: "[chunks: c015] \"Each CSV file in this directory is a one-to-one mapping to the OMOP CDM tables.\""

processing_software:
  value: true
  # chunks: [c007, c018]
  evidence: "[needs_owner: true] [search_notes] \"D52 value retained. Review of the declared bundle: REDCap at 1005-1008 describes collection, not processing; FAIRhub at 1930-1931 is still developing. The healthsheet at 4409 says N/A - no labeling was performed; this is limited to labeling and does not negate other processing. Neither excerpt establishes actual use of processing software. Owner disposition required; quotations provide context only.\" [chunks: c007] \"problem, we are developing a cloud-based data management, curation\\nand sharing platform called FAIRhub\" [chunks: c018] \"N/A - no labeling was performed\""

ml_training_dataset:
  value: true
  # chunks: [c019]
  evidence: "[chunks: c019] \"The current version of the dataset comes with recommended data splits. Because sex, race, and ethnicity data are not being released with the public version of the dataset, the project team has prepared data splits into proportions (70%/15%/15%) that can be used for subsequent training/validation/testing where the validation and test sets are balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle controlled, oral medication controlled, and insulin controlled).\""
