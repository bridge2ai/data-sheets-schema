# Evaluation applicability context for AI-READI
# Bridge2AI Data Generation Project: prospective multimodal cohort investigating type 2 diabetes
# Format: d4d-evaluation-context-1
# Bundle chunks: data/preprocessed/chunks/AI_READI_chunks.yaml (rule.version: 2, 25 chunks)

human_subjects:
  value: true
  # chunks: [c002, c019]
  evidence: "[chunks: c002] \"AI- READI was approved by the Institutional Review Board\" [chunks: c019] \"This dataset contains data from 2280 participants that was collected between July 19, 2023 and May 01, 2025.\""

regulated_access:
  value: true
  # chunks: [c015]
  evidence: "[chunks: c015] \"Accessing the dataset requires several steps, including: Login in through a verified ID system, Agreeing to use the data only for type 2 diabetes related research, Agreeing to the license terms which set certain restrictions and obligations for data usage\""

shared_dataset:
  value: true
  # chunks: [c004]
  evidence: "[chunks: c004] \"All  data  are  stored  and  shared\\nusing  FAIRhub\""

data_collection:
  value: true
  # chunks: [c004, c019]
  evidence: "[chunks: c019] \"This dataset contains data from 2280 participants that was collected between July 19, 2023 and May 01, 2025.\" [chunks: c004] \"REDCap is used for collecting patient- reported data from\\nquestionnaires  and  the  following  clinical  data  from  the\\nvisit: medications assessment, vitals, visual acuity, contrast\\nsensitivity, monofilament test results and CBC test results.\""

data_processing:
  value: true
  # chunks: [c015, c019]
  evidence: "[context_note: D120] \"D120: c019 supplies contextual file-format standards and automated + custom processing evidence; it does not identify processing software.\" [chunks: c015] \"Each CSV file in this directory is a one-to-one mapping to the OMOP CDM tables.\" [chunks: c019] \"| environment               | This directory contains data collected through an environmental sensor device custom built for the AI-READI project.                                                                             | [Earth Science Data Systems (ESDS) format](https://www.earthdata.nasa.gov/esdis/esco/standards-and-practices/ascii-file-format-guidelines-for-earth-science-data) |\" [chunks: c019] \"| wearable_activity_monitor | This directory contains data collected through a wearable fitness tracker.                                                                                                                       | [Open mHealth](https://www.openmhealth.org/documentation/#/schema-docs/schema-library)                                                                            |\" [chunks: c019] \"| Processing   | custom / ad hoc | automated + custom |automated + custom | automated + custom |\""

processing_software:
  value: true
  # chunks: [c018, c019]
  evidence: "[context_note: D120] \"D120: c019 supplies contextual file-format standards and automated + custom processing evidence; it does not identify processing software. D104 direct software evidence remains in c018.\" [chunks: c018] \"clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in reports viewed by clinical research coordinators (CRCs) and Data Managers\" [chunks: c019] \"| environment               | This directory contains data collected through an environmental sensor device custom built for the AI-READI project.                                                                             | [Earth Science Data Systems (ESDS) format](https://www.earthdata.nasa.gov/esdis/esco/standards-and-practices/ascii-file-format-guidelines-for-earth-science-data) |\" [chunks: c019] \"| wearable_activity_monitor | This directory contains data collected through a wearable fitness tracker.                                                                                                                       | [Open mHealth](https://www.openmhealth.org/documentation/#/schema-docs/schema-library)                                                                            |\" [chunks: c019] \"| Processing   | custom / ad hoc | automated + custom |automated + custom | automated + custom |\""

ml_training_dataset:
  value: true
  # chunks: [c019]
  evidence: "[chunks: c019] \"The current version of the dataset comes with recommended data splits. Because sex, race, and ethnicity data are not being released with the public version of the dataset, the project team has prepared data splits into proportions (70%/15%/15%) that can be used for subsequent training/validation/testing where the validation and test sets are balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle controlled, oral medication controlled, and insulin controlled).\""
