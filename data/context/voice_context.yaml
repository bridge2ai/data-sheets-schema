  value: true
  evidence: "Voice shares standardized acoustic recordings and clinical acoustic metadata with approved research investigators."

data_collection:
  value: true
  evidence: "Voice captures structured speech protocols, voice tasks, acoustic telemetry, and comprehensive clinical metadata across participating medical centers."

data_processing:
  value: true
  evidence: "Voice audio and clinical data are processed for acoustic feature extraction, audio quality verification, HIPAA de-identification, and metadata structuring."

processing_software:
  value: true
  evidence: "Voice employs standardized audio capture applications, acoustic signal processing libraries, and automated quality-control software."

ml_training_dataset:
