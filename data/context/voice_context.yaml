# Evaluation applicability context for Voice (Voice as a Biomarker of Health)
# Bridge2AI Data Generation Project: multi-institutional acoustic voice recordings and clinical metadata
# Format: d4d-evaluation-context-1
# Bundle chunks: data/preprocessed/chunks/VOICE_chunks.yaml (rule.version: 2, 22 chunks)

human_subjects:
  value: true
  # chunks: [c018]
  evidence: "[chunks: c018] \"Patients presenting at specialty clinics and institutions were considered for enrollment.\" [chunks: c018] \"If eligible for enrollment, patient consent was sought for the data collection initiative and to share the acquired research data.\""

regulated_access:
  value: true
  # chunks: [c019]
  evidence: "[chunks: c019] \"Only credentialed users who sign the DUA can access the files.\""

shared_dataset:
  value: true
  # chunks: [c018]
  evidence: "[chunks: c018] \"Bridge2AI-Voice v3.1 contains data for 833 participants across five sites in North America.\" [chunks: c018] \"Detailed demographic, clinical, and validated questionnaire data are also made available.\""

data_collection:
  value: true
  # chunks: [c018]
  evidence: "[chunks: c018] \"Data collection was conducted using a custom application on a tablet with a headset used for data collection when possible.\""

data_processing:
  value: true
  # chunks: [c018]
  evidence: "[chunks: c018] \"Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing filter applied.\""

processing_software:
  value: true
  # chunks: [c019]
  evidence: "[chunks: c019] \"The code used to process the raw audio into the above features and to merge the source data into the phenotype files has been made open source in the\\nb2aiprep library\\n[8]. This release was generated with b2aiprep v3.0.0.\""

ml_training_dataset:
  value: true
  # chunks: [c011]
  evidence: "[chunks: c011] \"Our group aims to develop voice as a biomarker of health used in clinical care. To do so we will generate a large multi-institutional, ethically sourced, and diverse voice database linked to multimodal health biomarkers to fuel voice AI research. We will then build predictive models to assist in screening, diagnosis, and treatment of a broad range of diseases, including several diseases with unmet clinical needs.\""
