# Evaluation applicability context for VOICE_PEDIATRIC (Bridge2AI Pediatric Voice)
# Bridge2AI Data Generation Project: pediatric acoustic voice recordings and clinical metadata
# Format: d4d-evaluation-context-1
# Bundle chunks: data/preprocessed/chunks/VOICE_PEDIATRIC_chunks.yaml (rule.version: 2, 13 chunks)

human_subjects:
  value: true
  # chunks: [c002]
  evidence: "[chunks: c002] \"Patients/healthy volunteers at the Hospital for Sick Children were considered for enrollment in the study.\" [chunks: c002] \"Following confirmation of eligibility, parental or participant consent was obtained prior to data collection and data sharing.\""

regulated_access:
  value: true
  # chunks: [c003]
  evidence: "[chunks: c003] \"Only credentialed users who sign the DUA can access the files.\""

shared_dataset:
  value: true
  # chunks: [c002]
  evidence: "[chunks: c002] \"Bridge2AI-Voice Pediatric Dataset v1.1.0 contains derived audio features for 23,533 recordings collected from 300 participants aged 2-18.\" [chunks: c002] \"Detailed demographic, clinical, and validated questionnaire data are also made available.\""

data_collection:
  value: true
  # chunks: [c002]
  evidence: "[chunks: c002] \"All data was collected through customized software –\\nreproschema-ui –\\non tablets.\""

data_processing:
  value: true
  # chunks: [c002]
  evidence: "[chunks: c002] \"torchaudio_mfcc.parquet (n=23533) contains Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the mel spectrograms.\""

processing_software:
  value: true
  # chunks: [c002]
  evidence: "[chunks: c002] \"The code used to preprocess the raw audio waveforms into the parquet file and to merge the source data into the phenotype files has been made open source in the\\nb2aiprep library\""

ml_training_dataset:
  value: true
  # chunks: [c002, c004]
  evidence: "[chunks: c002] \"Resources such as this project are intended to enable study of developmental norms, create AI-driven tools for early screening, and support clinical insight.\" [chunks: c004] \"Our group aims to develop voice as a biomarker of health used in clinical care. To do so we will generate a large multi-institutional, ethically sourced, and diverse voice database linked to multimodal health biomarkers to fuel voice AI research. We will then build predictive models to assist in screening, diagnosis, and treatment of a broad range of diseases, including several diseases with unmet clinical needs.\""
