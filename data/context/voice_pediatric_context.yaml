# Evaluation applicability context for VOICE_PEDIATRIC (Bridge2AI Pediatric Voice)
# Bridge2AI Data Generation Project: pediatric acoustic voice recordings and clinical metadata
# Format: d4d-evaluation-context-1
# Bundle chunks: data/preprocessed/chunks/VOICE_PEDIATRIC_chunks.yaml (rule.version: 2, 13 chunks)

human_subjects:
  value: true
  # chunks: [c002, c004, c006, c010]
  evidence: "[chunks: c002, c004, c006, c010] Bridge2AI-Voice Pediatric Dataset collects voice recordings, demographics, and pediatric clinical/questionnaire data from human pediatric participants with parental consent and child assent under University of South Florida IRB approval (v1.1.0 on PhysioNet, c002; pediatric protocol and ReproSchema forms in c004, c006; NIH project 3OT2OD032720-01S1 in c010)."

regulated_access:
  value: true
  # chunks: [c002, c003, c007]
  evidence: "[chunks: c002, c003, c007] Bridge2AI-Voice Pediatric Dataset v1.1.0 on PhysioNet (doi:10.13026/mf9s-5r03, c002, c003) is distributed under PhysioNet Credentialed Access governed by the Bridge2AI Voice Registered Access License and Data Use Agreement (c002, c003, c007)."

shared_dataset:
  value: true
  # chunks: [c002, c003]
  evidence: "[chunks: c002, c003] Bridge2AI-Voice Pediatric Dataset v1.1.0 is publicly shared with credentialed researchers on PhysioNet (https://physionet.org/content/b2ai-voice-pediatric/1.1.0/, doi:10.13026/mf9s-5r03, c002, c003) as Parquet feature bundles, static acoustic feature TSVs, and pediatric phenotype TSV/JSON files."

data_collection:
  value: true
  # chunks: [c002, c004, c005, c006, c008]
  evidence: "[chunks: c002, c004, c005, c006, c008] Pediatric participants presenting at specialty clinics are screened, consented, and recorded using a standardized tablet/headset protocol across pediatric voice and speech tasks alongside REDCap / ReproSchema pediatric demographic, confounder, diagnosis, and validated clinical questionnaires (e.g., pVHI, pediatric anxiety/depression/ADHD scales; c002, c004, c005, c006, c008)."

data_processing:
  value: true
  # chunks: [c002, c003, c008]
  evidence: "[chunks: c002, c003, c008] Raw pediatric audio recordings are converted to monaural, resampled to 16 kHz with a Butterworth filter, and transformed into spectrograms, Mel spectrograms, 60 MFCCs, pitch, OpenSMILE and Praat/Parselmouth acoustic features, and Whisper transcriptions, while stripping HIPAA Safe Harbor identifiers and sensitive free-speech spectrograms (c002, c003, c008)."

processing_software:
  value: true
  # chunks: [c002, c003, c008]
  evidence: "[chunks: c002, c003, c008] Feature extraction and phenotype table packaging are performed with the open-source b2aiprep library (github.com/sensein/b2aiprep), Bridge2AI Voice REDCap export library (zenodo.org/records/14989503), TorchAudio, openSMILE, Praat, Parselmouth, and OpenAI Whisper Large (c002, c003, c008)."

ml_training_dataset:
  value: true
  # chunks: [c002, c006, c007, c010]
  evidence: "[chunks: c002, c006, c007, c010] Produced under the NIH Bridge2AI Voice as a Biomarker of Health project (3OT2OD032720-01S1, c002, c010), the pediatric dataset is specifically curated to enable AI/ML model training and evaluation for detecting pediatric voice, speech, developmental, and respiratory conditions (c002, c006, c007, c010)."
