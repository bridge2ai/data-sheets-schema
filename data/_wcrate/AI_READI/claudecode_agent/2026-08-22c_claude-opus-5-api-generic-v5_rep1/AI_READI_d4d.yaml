conforms_to: >-
  Clinical Dataset Structure (CDS) v0.1.1, which governs the root-level organization of the dataset
  (one directory per datatype, then modality, then device, then participant) and the set of root
  metadata files. Within each datatype directory the data files follow a modality-appropriate
  standard: WaveForm DataBase (WFDB) for the 12-lead electrocardiogram; the Observational Medical
  Outcomes Partnership (OMOP) Common Data Model for clinical and survey data; Digital Imaging and
  Communications in Medicine (DICOM) for retinal photography, OCT, OCTA and FLIO; Open mHealth for
  wearable activity and continuous glucose monitoring data; and the NASA ASCII File Format Guidelines
  for Earth Science Data for the environmental sensor data. An RO-Crate packaging of the release,
  conforming to the RO-Crate 1.2-DRAFT profile and the FAIRscape profile 0.1, is also published.
