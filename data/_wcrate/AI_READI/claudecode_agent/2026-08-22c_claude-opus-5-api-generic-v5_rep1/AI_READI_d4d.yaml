id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, cross-sectional dataset of 2,280 adults with and without type 2 diabetes mellitus
  (T2DM), collected by the AI-READI project (Artificial Intelligence Ready and Equitable Atlas for
  Diabetes Insights), one of four Data Generation Projects of the NIH Common Fund Bridge2AI program.
  Data were collected between 19 July 2023 and 1 May 2025 at three United States sites — the
  University of Alabama at Birmingham, the University of California San Diego, and the University of
  Washington — and harmonized across sites. Each instance is an individual participant. Recruitment
  was designed to be triple-balanced across self-reported race/ethnicity (Asian, Black, Hispanic,
  White), biological sex, and T2DM severity (no diabetes; pre-diabetes or lifestyle-controlled
  diabetes; diabetes controlled with oral or non-insulin injectable medication; insulin-controlled
  diabetes), so that downstream artificial intelligence and machine learning models can be trained on
  a cohort that is not dominated by any one group. Modalities include REDCap survey and clinical data
  mapped to the OMOP Common Data Model; blood and urine laboratory results; physical measurements and
  vital signs; monofilament testing for peripheral neuropathy; Montreal Cognitive Assessment scores;
  visual acuity, contrast sensitivity and autorefraction; a 12-lead electrocardiogram; retinal
  photography, optical coherence tomography (OCT), OCT angiography (OCTA) and fluorescence lifetime
  imaging ophthalmoscopy (FLIO) from seven imaging devices; ten days of continuous glucose monitoring;
  ten days of wearable activity, heart rate, respiratory rate, oxygen saturation, sleep and stress
  monitoring; and ten days of in-home environmental sensing. The release contains 356,343 files
  totalling approximately 3.82 TB, organized according to the Clinical Dataset Structure (CDS)
  specification v0.1.1. This public release contains no protected health information; information on
  participant sex, race/ethnicity and medications used has been removed and is available only through
  a separate controlled-access release. The stated scientific goal is to support study of
  salutogenesis in T2DM — the pathway from disease back to health — including downstream pseudotime
  manifold analysis of disease trajectories.
