purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset that
      enables artificial intelligence and machine learning research into type 2 diabetes mellitus,
      including salutogenic pathways back to health.
  - response: >-
      To support reconstruction of a temporal atlas of T2DM development and reversal by collecting
      data specifically designed to permit downstream pseudotime manifold analysis, an approach used
      to predict disease trajectories from complex multimodal data across a range of disease
      severities from normal to insulin-dependent T2DM.
  - response: >-
      To build a foundational dataset in type 2 diabetes that is agnostic to existing classification
      criteria and hypothesis-agnostic, assembled from assessments across more than ten health
      domains likely to be affected by T2DM rather than from a pre-specified hypothesis.
  - response: >-
      To establish and demonstrate standards, best practices and guidelines for the collection,
      preparation and sharing of data for AI/ML purposes, including adherence to the Findable,
      Accessible, Interoperable, Reusable (FAIR) principles and to ethical, legal and social
      considerations, so that the approach can serve as a model for future biomedical data generation
      projects.

addressing_gaps:
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as T2DM
      has been limited by a lack of well-designed, high-quality, large and inclusive multimodal
      datasets. A major barrier to AI in this area has been the absence of diverse datasets that are
      AI-ready for training models; the AI-READI dataset is intended to fill that gap.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published between 2000 and 2020 found
      that samples lacked racial and ethnic diversity. AI-READI deliberately recruits equal
      proportions of Asian, Black, Hispanic and White participants rather than mirroring the
      demographic distribution of the United States population, in order to address that
      under-representation and reduce bias in models trained on the data.
  - response: >-
      Current understanding of T2DM in the context of salutogenesis — the pathway from disease back to
      health, as distinct from pathogenesis — is limited, and no existing resource supports it at
      scale across many health domains simultaneously.
  - response: >-
      Existing data sources such as insurance claims and electronic health records do not support the
      downstream AI/ML analyses the project targets; a purpose-designed acquisition protocol across
      survey, physical measurement, clinical, imaging and wearable-device domains was required.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis: dimensionality reduction across complex multimodal
      measurements from participants at differing disease severity, used to reconstruct disease
      trajectories and pathways of return to health.
  - response: >-
      Development of multimodal artificial intelligence and machine learning models of type 2
      diabetes, including models spanning tabular clinical data, retinal imaging, physiological
      waveforms and wearable time series.
  - response: >-
      Study of salutogenesis in T2DM — characterizing the transition from diabetes toward health
      resilience — across the four study groups (no diabetes; pre-diabetes or lifestyle-controlled;
      oral or non-insulin injectable medication controlled; insulin controlled).

instances:
  - instance_type: Individual study participant
    counts: 2280
    data_topic: B2AI_TOPIC:43
    data_substrate: B2AI_SUBSTRATE:11
    label: false
    label_description: >-
      No explicit label or target is associated with any data instance. The dataset is deliberately
      hypothesis-agnostic and was assembled to support multiple downstream AI/ML applications rather
      than one predefined prediction task. No labeling was performed and no gold-standard or proxy
      labels are provided.
    notes: >-
      Each instance comprises all data available for one participating individual across all
      modalities collected for that person. There is currently one study visit per participant. Both
      eyes are imaged for each participant. Version 1.0.0 contained 204 instances, version 2.0.0
      contained 1,067, and this version contains 2,280. The recorded topic (Diabetes) and substrate
      (DICOM) are the single terms best matching the dataset's subject and its largest data holding by
      volume; the slots are single-valued on Instance and cannot express the full modality range, for
      which the per-directory entries under file_collections are authoritative.

