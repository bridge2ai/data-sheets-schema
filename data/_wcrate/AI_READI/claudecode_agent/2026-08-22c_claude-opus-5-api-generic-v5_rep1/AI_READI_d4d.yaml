variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    derivation: >-
      Study identifier number assigned at enrollment; used as the participant directory name within
      every datatype, modality and device folder, and as the key in participants.tsv.
  - variable_name: Age
    data_type: integer
    unit: years
    minimum_value: 40.0
    is_sensitive: false
    notes: >-
      Mean 60.8 years, standard deviation 11.3, across the 2,280 participants. Eligibility requires 40
      years or older; adults older than 85 years are an exclusion criterion, so no participant should
      exceed 85, but no observed maximum age is reported in any source and none is asserted here.
    source_caveats: >-
      The FAIRhub eligibility module gives a maximum age of 85 years and lists "Adults older than 85
      years of age" as an exclusion criterion. The BMJ Open protocol describes the target enrollment
      only as "4000 people aged 40 and older" and states no upper limit. The 85-year figure is an
      eligibility ceiling rather than an observed value bound and is therefore recorded in notes rather
      than in maximum_value.
  - variable_name: Biological sex
    data_type: categorical
    categories:
      - male
      - female
    is_sensitive: true
    notes: >-
      Withheld from the public release and available only under controlled access. Self-reported at
      screening. Totals across the release: 951 male, 1,329 female.
  - variable_name: Race and ethnicity
    data_type: categorical
    categories:
      - Asian
      - Black
      - Hispanic
      - White
    is_sensitive: true
    notes: >-
      Self-reported at screening. Withheld from the public release and available only under controlled
      access, in order to prevent stigmatization of findings. Totals across the release: 380 Hispanic,
      545 Asian, 519 Black, 836 White.
  - variable_name: Diabetes study group
    data_type: categorical
    categories:
      - No DM (no type 1 or type 2 diabetes)
      - >-
        Lifestyle (pre-type 2 diabetes, or type 2 diabetes controlled by lifestyle adjustments)
      - >-
        Oral (type 2 diabetes controlled by oral or non-insulin injectable medications)
      - Insulin (type 2 diabetes controlled by insulin)
    is_sensitive: false
    derivation: >-
      Assigned from the screening questionnaire covering diabetes health status and diabetes treatments,
      informed by electronic health record ICD-10 screening (R73.09 for prediabetes, E11.X for type 2
      diabetes).
    notes: >-
      Totals across the release: 776 No DM, 560 Lifestyle, 686 Oral, 258 Insulin.
  - variable_name: Recommended split assignment
    data_type: categorical
    categories:
      - train
      - val
      - test
    derivation: >-
      Assigned by the project team so that the validation and test sets are balanced as far as possible
      for sex, race/ethnicity and diabetes status; distributed in participants.tsv.
  - variable_name: HbA1c
    data_type: float
    unit: "%"
    measurement_technique: Whole blood assay performed by the UW Nutrition and Obesity Research Center.
    notes: "Reference range 4.0-6.0. Rationale for inclusion: marker for diabetes."
  - variable_name: Glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: "Reference range 62-125. Rationale for inclusion: marker for diabetes."
  - variable_name: Insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: "Reference range 0.0-24.9. Rationale for inclusion: marker for diabetes."
  - variable_name: C peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: "Reference range 1.1-4.4. Rationale for inclusion: indicator of insulin production."
  - variable_name: N-terminal pro-B-type natriuretic peptide
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Reference range varies by age. Rationale for inclusion: severity and outcome predictor of heart
      failure.
  - variable_name: Troponin-T
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Reference range female <11, male <16. Rationale for inclusion: marker of myocardial injury.
  - variable_name: C reactive protein, high sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Reference range 0.0-10.0. Rationale for inclusion: inflammation marker and risk factor for type 2
      diabetes.
  - variable_name: Total cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: "Reference range <200. Rationale for inclusion: cardiovascular disease risk factor."
  - variable_name: Low-density lipoprotein cholesterol (calculated)
    data_type: float
    unit: mg/dL
    derivation: Calculated rather than assayed directly.
    notes: "Reference range <130. Rationale for inclusion: cardiovascular disease risk factor."
  - variable_name: Creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      Reference range female 0.38-1.02, male 0.51-1.18. Rationale for inclusion: marker for kidney
      function.
  - variable_name: Urine albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine assay performed by the UW Nutrition and Obesity Research Center.
    notes: >-
      No reference range supplied by the testing laboratory. Rationale for inclusion: urinary biomarker
      for early diabetic nephropathy.
  - variable_name: Systolic blood pressure
    data_type: float
    unit: mm Hg
    measurement_technique: >-
      Measured twice, separated by two minutes, with an automatic oscillometric medically approved
      device (OMRON HEM 907XL, Medline MDS4001, or Welch Allyn 6000 series depending on site).
    quality_notes: >-
      Readings over 180 mm Hg, or under 100 mm Hg with symptoms of haemodynamic instability, triggered a
      recommendation for emergency care.
  - variable_name: Heart rate
    data_type: integer
    unit: beats per minute
    measurement_technique: >-
      Measured twice with the automatic blood pressure device, separated by two minutes; also derivable
      from the electrocardiogram and recorded continuously by the Garmin Vivosmart 5.
    quality_notes: >-
      Readings over 100 bpm or under 60 bpm, if not known to be usual for the participant and with
      symptoms of haemodynamic instability, triggered a recommendation for emergency care.
  - variable_name: MoCA total score
    data_type: integer
    minimum_value: 0.0
    maximum_value: 30.0
    measurement_technique: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application. Section subscores, the Memory Index Score and task completion times are also
      recorded.
    notes: >-
      Higher numbers represent better performance. A score of 26 and above is considered normal; below
      24 is a sign of cognitive impairment. Domains evaluated are memory, executive functioning,
      attention, language, visuospatial ability, orientation, visuoconstructional skills, conceptual
      thinking and calculations.
  - variable_name: Best-corrected visual acuity (logMAR)
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes tested
      separately, under photopic conditions and under mesopic conditions viewed through a 2.0 neutral
      density filter, with best correction.
    notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate better
      resolution. Snellen equivalents were present in version 2.0.0 but were dropped in this version.
  - variable_name: Letter contrast sensitivity (log CS)
    data_type: float
    measurement_technique: >-
      Mars Letter Contrast Sensitivity chart read monocularly at approximately 50 cm under photopic and
      mesopic conditions, undilated, with near correction. Testing stops after two consecutive errors or
      at the end of the chart.
    derivation: >-
      The log CS value is obtained by multiplying the number of errors prior to the final correct letter
      by 0.04 and subtracting the result from the log CS value at the final correct letter.
    notes: Higher numbers indicate better sensitivity.
  - variable_name: Continuous glucose measurement
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Dexcom G6 integrated continuous glucose monitoring system, one reading every five minutes over a
      ten-day wear period. Participants were masked to the readings during the monitoring period.
  - variable_name: Ambient temperature
    data_type: float
    measurement_technique: >-
      LeeLab Anura in-home environmental sensor, placed in a frequently used area of the participant's
      home for ten days.
  - variable_name: Particulate matter
    data_type: float
    measurement_technique: >-
      LeeLab Anura in-home environmental sensor, using a Sensirion SEN5x environmental node. Recorded in
      four size fractions: PM1.0, PM2.5, PM4 and PM10.
  - variable_name: Multi-spectral light intensity
    data_type: float
    measurement_technique: >-
      LeeLab Anura in-home environmental sensor, eleven spectral channels, using an ams-OSRAM AS7431
      spectral sensor.

source_caveats: >-
  Points where the declared bundle is internally inconsistent or leaves a question open, and how each
  was handled. (1) Participant count and coverage: the version 3 documentation "About" page (tier 2)
  states that the documentation "is associated with v3.0 of the dataset, which contains data from the
  participants of the pilot study phase". The FAIRhub API record, README and RO-Crate (all tier 1) state
  that version 3.0.0 contains 2,280 participants collected between 19 July 2023 and 1 May 2025. The
  pilot-phase wording appears to be carried over unchanged from the version 1 documentation — the
  version 2 "About" page carries the identical sentence — and the tier-1 figures are used throughout
  this record. (2) Within tier 1, the healthsheet says version 3 "consists of data collected up through
  the end of the second year of the study", while the README changelog labels version 3.0.0 the "main
  study" and tabulates year-2 data (863 participants) plus year-3 data (1,213) added to the version 1.0.0
  pilot (204), summing to 2,280. Both statements come from the same source; the 2,280 total and the
  19 July 2023 to 1 May 2025 window are consistent across the description, README, RO-Crate and DataCite
  record and are treated as settled. (3) IRB identity: the RO-Crate (tier 1) names "Washington University
  IRB" while giving University of Washington Human Subjects Division contact details; the IRB protocol
  form (tier 2) and BMJ Open protocol (tier 3) both name the University of Washington IRB under the same
  protocol number STUDY00016228. The tier-1 name is recorded with the disagreement noted. (4) Sponsor and
  PI affiliation: the FAIRhub study description (tier 1) names Washington University in St. Louis
  (ROR 01yc7t268) as lead sponsor and as the affiliation of Aaron Lee, Cecilia Lee and the central
  contact; the Nature Metabolism comment, BMJ Open protocol and NIH RePORTER record (tiers 3 and 4) place
  Aaron Lee and Cecilia Lee at the University of Washington. The tier-1 values are used; the license
  document independently names Washington University in St. Louis as Licensor. (5) Project name: the
  BMJ Open protocol and the RO-Crate expand AI-READI as "Artificial Intelligence Ready and Equitable
  Atlas for Diabetes Insights", while the NIH RePORTER abstract, the FAIRhub study description official
  title, the healthsheet and the README use "Artificial Intelligence Ready and Exploratory Atlas for
  Diabetes Insights". Both expansions are attested; neither is corrected here. (6) Collection start date:
  the BMJ Open protocol gives 18 July 2023 for the start of enrolment, the FAIRhub records give
  19 July 2023 for the start of collection; the tier-1 date is used. (7) Age ceiling: the FAIRhub
  eligibility module sets a maximum age of 85 years and excludes adults older than 85, whereas the BMJ
  Open protocol describes eligibility only as aged 40 and older; the tier-1 ceiling is recorded as an
  eligibility criterion rather than as an observed value bound, since no source reports an observed
  maximum age. (8) Target enrolment: the BMJ Open protocol, Nature Metabolism comment and FAIRhub study
  description give a target of 4,000 participants; the IRB protocol form gives 4,600 and describes four
  groups of approximately 1,000 each plus a longitudinal follow-up arm. The 4,000 figure is the one
  carried by the higher-ranked sources. (9) Sensitivity characterization: the FAIRhub healthsheet and the
  RO-Crate, both tier 1, give different accounts of whether the release contains sensitive data; both are
  recorded in sensitive_elements rather than one being selected. (10) License name: three tier-1
  renderings exist — DataCite "AI-READI custom license v2.0", the FAIRhub pages "Health Data License",
  and the license document's own title "AI-READI DATA LICENSE AGREEMENT (Version 2.0)". The DataCite
  rightsName is used in the license slot and the disagreement is recorded under license_and_use_terms.
  (11) Identifiers not supplied by the bundle: no registry identifier exists anywhere in the sources for
  the AI-READI Consortium as an organization, nor for FAIRhub as publisher. Both slots are therefore
  omitted rather than filled with a project or portal homepage. The `publisher` slot is a uriorcurie and
  the bundle gives only the string "FAIRhub" (DataCite publisherName); the FAIRhub landing page appears
  instead in `page`. Similarly the RO-Crate gives the IRB contact as an organizational ContactPoint of
  type "IRB Reliance Team" rather than a named person, so `ethical_reviews[0].contact_person` is omitted
  and the mailbox recorded in review_details. (12) Consent and de-identification gaps: three healthsheet
  questions are left with empty responses in the source — whether any pre-processing was performed for
  de-identification, what measures were taken to avoid re-identification, and whether an erratum exists.
  Those slots are therefore left unpopulated here rather than inferred. (13) The distinction between the
  public release described by this record and the separate controlled-access release is drawn from the
  FAIRhub healthsheet, the version 2 and 3 documentation and the BMJ Open protocol; the
  controlled-access release has no DOI, size or file count in the bundle and is described only as a set
  of additional variables. (14) Instance.data_topic and Instance.data_substrate are single-valued and
  cannot represent the release's full modality range; the terms recorded are the closest single matches
  for the subject (Diabetes) and the largest holding by volume (DICOM), and the per-directory
  file_collections entries carry the complete picture.

notes: >-
  Both the FAIRhub dataset pages and the AI-READI documentation site carry the notice: "This repository
  is under review for potential modification in compliance with Administration directives." The FAIRhub
  version 2 page additionally carries the notice "Platform is currently in beta".