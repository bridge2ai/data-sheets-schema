splits:
  - split_details: >-
      The release comes with recommended training, validation and testing splits in approximate
      70%/15%/15% proportions (1,576 / 352 / 352 participants). The split assignment is distributed in
      the participants.tsv metadata file. The rationale is that sex, race and ethnicity are withheld
      from the public release, so users cannot themselves construct demographically balanced
      partitions; the project team therefore prepared splits in which the validation and test sets are
      balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes,
      pre-diabetes or lifestyle controlled, oral medication controlled, insulin controlled). The
      healthsheet states the purpose is to reduce disparities in error rates between demographic
      subgroups for models developed on the dataset. Recommended splits were introduced in this
      version; the earlier versions did not carry them.

subpopulations:
  - identification: >-
      Diabetes status, recorded as one of four study groups: no type 1 or type 2 diabetes; pre-type 2
      diabetes or type 2 diabetes whose blood sugar is controlled by lifestyle adjustments; type 2
      diabetes controlled by oral or non-insulin injectable medications; type 2 diabetes controlled by
      insulin.
    distribution: >-
      Across the 2,280 participants in this release: 776 no diabetes, 560 lifestyle controlled, 686
      oral medication controlled, 258 insulin controlled. The insulin-controlled group is the smallest
      and is under-represented relative to the project's target of equal proportions.
    subpopulation_elements_present: true
  - identification: >-
      Self-reported race and ethnicity, in four categories used by the study: Asian, Black, Hispanic
      and White.
    distribution: >-
      Across the 2,280 participants: 380 Hispanic, 545 Asian, 519 Black, 836 White. The White group is
      over-represented and the Hispanic group under-represented relative to the project's target of
      equal proportions, because enrollment is ongoing and interim releases have not yet achieved the
      intended balance.
    subpopulation_elements_present: false
    notes: >-
      The race and ethnicity variables themselves are not released in the public dataset; they are
      held under controlled access. Only the aggregate counts reported for the recommended splits are
      publicly available.
  - identification: Biological sex, recorded as male or female.
    distribution: >-
      Across the 2,280 participants: 951 male, 1,329 female. Females are over-represented relative to
      the project's target of equal proportions.
    subpopulation_elements_present: false
    notes: >-
      The sex variable is not released in the public dataset; it is held under controlled access. Only
      the aggregate counts reported for the recommended splits are publicly available.
  - identification: >-
      Age. Eligibility is restricted to adults aged 40 years and older, with an upper limit of 85
      years.
    distribution: >-
      Mean age across the 2,280 participants is 60.8 years with a standard deviation of 11.3 years.
    subpopulation_elements_present: true

relationships:
  - relationship_details: >-
      All instances belong to the same prospective data generation project (AI-READI) and the same
      cross-sectional study protocol, and are therefore mutually related as members of one cohort.
      There is currently one study visit per participant, so there is no within-participant
      longitudinal relationship in this release. Within a participant, records are related across
      modalities by a shared participant identifier used as the directory name in every datatype
      folder; the participants.tsv metadata file links participant identifiers to their recommended
      split assignment. Retinal data are related in pairs, since both eyes are imaged for each
      participant, and the same anatomical target is imaged by several different devices. The
      ten-day continuous glucose, wearable activity and in-home environmental recordings for a given
      participant are contemporaneous with one another.

anomalies:
  - anomaly_details: >-
      Survey data contain skipped questions and incomplete responses; these are expected and were not
      backfilled.
  - anomaly_details: >-
      Wearable device data are affected by improper use and by technical failure, including battery
      failure and system malfunction. The Garmin Vivosmart 5 had to be recharged every two to three
      days, which produces gaps in the activity recording.
  - anomaly_details: >-
      Imaging data are affected by participant non-cooperation, by noise that may obscure the images,
      by system malfunction, and by data transfer failures.
  - anomaly_details: >-
      Optomed Aurora handheld undilated fundus photographs vary in quality both between participants
      and within the same participant, because the pupil is not dilated and the camera is handheld.
  - anomaly_details: >-
      FLIO acquisition is highly motion-sensitive: the device cannot tolerate more than approximately
      one centimetre of movement during acquisition. Because FLIO takes longer than a standard
      Spectralis OCT and exposes participants to uncomfortable light levels, it is performed last in
      the visit, when participant compliance may be lower than at earlier points.
  - anomaly_details: >-
      In a small number of cases a data collision occurred at some point in the process and data were
      lost.
  - anomaly_details: >-
      The MoCA cognitive screening score may be affected by a participant's level of education, by
      socioeconomic factors, and by depression or other mental health conditions, which can produce
      scores similar to those of mild dementia.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers who responded to a mailed or emailed invitation, which produces
      volunteer bias. This selection bias may limit the generalizability of results to individuals not
      represented in the study population.
    mitigation_strategy: >-
      Recruitment proceeds in waves, with the composition of each wave adjusted by under- and
      oversampling groups as enrollment characteristics are monitored, in order to move the cohort
      toward the intended balance.
    source_caveats: >-
      The characterization of volunteer bias as an explicit limitation on generalizability is stated in
      the BMJ Open protocol.
  - bias_type: representation_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based and may not capture the full range of
      cultural and socioeconomic backgrounds. The cohort covers only four race/ethnicity categories
      and does not include other groups such as Pacific Islanders or Native Americans. The requirement
      that participants speak, read and understand English may have created particular difficulty in
      recruiting Hispanic and Asian participants.
    affected_subsets:
      - Populations outside the four recruited race/ethnicity categories, such as Pacific Islanders
      - Native Americans
      - Non-English speakers
      - Rural populations
      - Populations outside academic health systems
    mitigation_strategy: >-
      Three geographically separated study sites were selected to broaden representation, and
      individuals from all demographic backgrounds were recruited at all three sites. The project also
      engaged with the Native Biodata Consortium as a co-learning opportunity on challenges specific
      to American Indian and Alaska Native communities, and the NIH project abstract describes a
      planned tribal consultation, but no such cohort is present in this release.
  - bias_type: sampling_bias
    bias_description: >-
      Enrollment is ongoing and the interim releases have not achieved the intended balanced
      distribution across race/ethnicity, biological sex and diabetes severity. In this release White
      participants (836) outnumber Hispanic participants (380) by more than two to one, female
      participants (1,329) outnumber male participants (951), and the insulin-controlled group (258)
      is roughly a third the size of the no-diabetes group (776).
    affected_subsets:
      - Hispanic participants
      - Male participants
      - Insulin-controlled participants
    mitigation_strategy: >-
      Recommended training, validation and testing splits are supplied in which the validation and
      test sets are balanced as far as possible across sex, race/ethnicity and diabetes status.
  - bias_type: measurement_bias
    bias_description: >-
      Several imaging modalities are operator-dependent and are not fully automated, so image quality
      and the likelihood that a modality is skipped altogether vary with operator and with participant
      cooperation. Devices differ in the degree of automation: the Topcon Triton and Maestro2 position
      themselves automatically with minimal operator involvement, while the Heidelberg Spectralis and
      FLIO are operated manually.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all participants irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites; all coordinators
      completed a certification process and had to administer all protocol elements successfully to at
      least three volunteer practice subjects before enrolling participants; device make, model and
      scan modality were documented to support repeatability.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is drawn from three urban academic health systems and does not comprehensively
      represent the United States population. Race and ethnicity categories are limited to Asian,
      Black, Hispanic and White.
    scope_impact: >-
      Models derived from the dataset may generalize poorly to rural populations, to populations
      outside academic health systems, and to racial and ethnic groups not represented.
  - limitation_type: temporal_limitation
    limitation_description: >-
      This release covers data collected between 19 July 2023 and 1 May 2025 only. Enrollment is
      ongoing toward a target of 4,000 participants and later versions will contain more instances.
    scope_impact: >-
      Analyses fixed to this version will not reflect the final cohort composition or size.
  - limitation_type: scope_limitation
    limitation_description: >-
      The study protocol is a single visit per participant, so this release is cross-sectional. A
      longitudinal arm inviting approximately 10% of the cohort back for a follow-up visit in year 4
      of the project is planned but its data are not present here.
    scope_impact: >-
      Within-participant change over time cannot be studied from this release, other than across the
      ten-day at-home monitoring windows.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Sex, race, ethnicity, medications used, 5-digit zip code, genetic sequencing data, past health
      records and traffic and accident reports are withheld from the public release and held under
      controlled access.
    scope_impact: >-
      Fairness auditing, demographic subgroup analysis and pharmacoepidemiological analysis are not
      possible from the public release alone.
    recommended_mitigation: >-
      Enter into a data use agreement to obtain the controlled-access version, or use the recommended
      splits, which were constructed to be demographically balanced without exposing the underlying
      variables.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Multiple different devices are used for the same measure (for example four OCT devices, four
      color fundus photography devices, three blood pressure monitors and three lensometers), and
      device behaviour and automation differ.
    scope_impact: >-
      Measurements are not necessarily interchangeable across devices; device identity must be
      accounted for in analysis. The project states this multiplicity was a deliberate choice to
      enhance generalizability and to represent the range of equipment used in clinical settings.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Snellen visual acuity variables were dropped in this version of the dataset; only logMAR visual
      acuity measurements are now available.
    scope_impact: >-
      Analyses written against version 2.0.0 that rely on Snellen visual acuity will not run
      unmodified on this version.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets or annotations are supplied, and no guidelines are provided for researchers
      who wish to create new labels or define new tasks.
    scope_impact: >-
      Supervised learning applications require the user to define and derive their own outcome
      variables, and results will not be comparable across users who define them differently.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Raw, pre-standardization data are retained by the project but are not shared. Only data mapped
      to standardized terminologies and formats are released.
    scope_impact: >-
      Users cannot inspect or re-derive the standardization steps from source, and free-text fields
      that might have contained additional clinical detail are absent.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet states that the dataset does not contain data that, if viewed directly, might be
      offensive, insulting, threatening, or otherwise pose a safety risk such as psychological safety
      or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential, and that no personally identifiable information is included. The RO-Crate metadata
      assigns the release an HL7 confidentiality code of 2N (normal).

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The healthsheet states that the public dataset does not contain data considered sensitive. Data
      revealing racial or ethnic origins, biological sex, location at the level of 5-digit zip code,
      genetic sequencing data, past health records, medications and motor vehicle accident reports are
      excluded from the public release and are available only in the controlled-access dataset.
    source_caveats: >-
      Two tier-1 sources characterize sensitivity differently and the source ranking does not separate
      them, so both are recorded. The FAIRhub healthsheet states the public dataset contains no
      sensitive data; the RO-Crate metadata lists categories of personal and sensitive information
      present in the release. The two statements are best read as applying to different notions of
      sensitivity — identifiability under HIPAA versus category of health data — but they are not
      reconciled in the sources.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The RO-Crate metadata records the following as personal or sensitive information categories in
      the release: electronic health record data, wearable monitoring data, electrocardiogram data,
      environmental sensor data, continuous glucose monitor data, and wearable accelerometer data.
      These are health and behavioural data about identified-by-code individuals, collected in the
      home as well as the clinic.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification was necessary because no direct identifiers were collected into the
    research dataset. The project verified that no data identifiable under the United States HIPAA
    Privacy Rule were present. The DataCite record classifies the de-identification type as
    "NoDeIdentification" while recording that direct identifiers are absent (deIdentDirect true) and
    that HIPAA identifiers are absent (deIdentHIPAA true); dates are not shifted (deIdentDates false),
    no non-arrangement de-identification was applied (deIdentNonarr false), and no k-anonymity
    treatment was applied (deIdentKAnon false).
  identifiers_removed: >-
    Protected Health Information as defined by the HIPAA Privacy Rule was removed by the Safe Harbor
    method. Beyond HIPAA identifiers, information on participant sex and race/ethnicity was also
    removed from the public release, in order to prevent stigmatization of findings, along with
    medications used, 5-digit zip code, genetic sequencing data, past health records, and traffic and
    accident reports.
  deidentification_details: >-
    Participants are represented in the released directory structure only by study identifier numbers.
    The RO-Crate metadata records the dataset as deidentified. The project acknowledges a residual
    theoretical risk of future re-identification and notes that AI algorithms can infer individual
    patient characteristics and could facilitate individual-level identification; to counter
    re-identification attempts the project implements a controlled dissemination system, a strict
    license agreement and static data watermarking for both the public and controlled sets. The
    healthsheet's dedicated questions on de-identification pre-processing and on measures taken to
    avoid re-identification were left unanswered.
  source_caveats: >-
    The rationale for removing sex and race/ethnicity — prevention of stigmatization of findings — is
    stated in the Nature Metabolism comment; the fact of their removal is stated in the FAIRhub
    description, README and documentation.

