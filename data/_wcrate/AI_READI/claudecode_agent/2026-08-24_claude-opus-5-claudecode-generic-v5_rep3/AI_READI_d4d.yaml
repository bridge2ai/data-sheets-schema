      dataset is hypothesis-agnostic and aimed at facilitating multiple potential downstream
      AI and machine learning applications.
    data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D003924
    description: >-
      Each instance represents an individual patient and consists of all of the data available
      for that individual. Multiple modalities are collected for each participant, including
      survey data, clinical data, retinal imaging data, environmental sensor data, continuous
      glucose monitor data and wearable activity monitor data, encompassing tabular data,
      imaging data and physiological signal or waveform data. There is no unstructured text
      data in the dataset. All instances are part of the same prospective data generation
      project and there is currently only one visit per participant. The first release
      contained 204 instances and the second contained 1,067; this release contains 2,280.
    missing_information:
      - missing:
          - Individual data modalities for some participants
          - Device-derived data where the collection device failed or was returned late
        why_missing:
          - Some participants elected not to participate in some study elements
          - >-
            In a few cases the data collection device did not have any stored results or was
            returned too late to retrieve the results, for example because the battery died
            or data was lost
          - >-
            In a few cases there may have been a data collision at some point in the process
            and data has been lost

anomalies:
  - name: Expected errors and noise by modality
    anomaly_details: >-
      In cases of survey data, skipped questions or incomplete responses are expected. In
      cases of using wearables, improper use and technical failure such as battery failure or
      system malfunction are expected. In cases of imaging data, patient uncooperation, noise
      that may obscure the images, technical failure such as system malfunction, and data
      transfer failures are expected.
  - name: Handheld undilated fundus photography quality variation
    anomaly_details: >-
      Images from the Optomed Aurora are taken undilated with a handheld camera, so obtaining
      a good view is challenging and image quality varies from patient to patient and within
      the same patient. FLIO imaging is performed last in the visit because it takes longer
      than a standard Spectralis OCT and exposes patients to uncomfortable levels of light,
      so participants may not be at their best possible compliance for that modality.
      Spectralis imaging is operator-driven rather than fully automated, so quality issues may
      arise that lead to skipping the modality and missing data.

known_biases:
  - name: Volunteer bias
    bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so there is a selection bias known as volunteer bias which
      may limit the generalizability of results among those who are not represented in the
      study population.
  - name: English-language eligibility requirement
    bias_type: selection_bias
    bias_description: >-
      Participants are required to speak, read and understand English. The protocol notes
      that this may have created challenges in recruiting Hispanic and Asian persons. The IRB
      protocol records that non-English-speaking participants would not initially be enrolled
      because translating all study materials, not only the consent form, was not yet
      possible.
    mitigation_strategy: >-
      A National Institutes of Health supplement was submitted to obtain funding for
      translation of all study materials to enable recruitment and participation of
      Spanish-speaking participants, and native Spanish-speaking research staff at the
      University of California, San Diego site were available to provide interpretation and
      instructions.
  - name: Cohort composition and recruitment setting
    bias_type: representation_bias
    bias_description: >-
      Factors influencing the generalization of derived models include the predominantly urban
      and hospital-based recruitment, which may not fully capture diverse cultural and
      socioeconomic backgrounds. The study cohort may not provide a comprehensive
      representation of the population, as it does not include other races and ethnicities
      such as Pacific Islanders and Native Americans. The protocol also notes documented
      difficulty recruiting Black men, Hispanic persons and Asian persons into health
      research.
    mitigation_strategy: >-
      Three recording sites were strategically selected to achieve diverse recruitment: the
      University of Alabama at Birmingham, the University of California San Diego and the
      University of Washington, chosen for geographic diversity across the United States and
      to ensure diverse representation across racial and ethnic groups. Individuals from all
      demographic backgrounds were recruited at all three sites, and the composition of
      participants is monitored during recruitment and adjusted by under- and oversampling
      groups as needed. The project team also prepared recommended data splits intended to
      reduce disparities in models developed using the dataset.
    affected_subsets:
      - Pacific Islander participants
      - Native American and Alaska Native participants
  - name: Imbalance across the pilot phase
    bias_type: sampling_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across race and
      ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters, and as enrollment is ongoing the pilot data release
      and periodic updates to data releases may not have achieved balanced distribution
      across groups.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects, irrespective of
      race and ethnicity, biological sex or diabetes severity, across all study sites, and the
      selection of study sites was intended to ensure equitable representation and minimize
      the potential for sampling bias.

known_limitations:
  - name: Cohort does not represent the general population
    limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races and ethnicities such as Pacific Islanders and Native
      Americans, and recruitment was predominantly urban and hospital-based.
    scope_impact: >-
      Models derived from the dataset may generalize poorly to populations and care settings
      not represented in the cohort.
  - name: Not all modalities are available for all participants
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements, and in a few cases device data were unavailable or
      lost.
  - name: Cross-sectional design with a single visit per participant
    limitation_type: temporal_limitation
    limitation_description: >-
      The study is cross-sectional and there is currently only one visit per participant. The
      project intends to invite approximately 10 percent of the study population for a
      follow-up visit in year 4, forming the longitudinal arm, and the healthsheet states that
      approximately 4 percent of participants are expected to undergo that follow-up
      examination. Those data are not part of this release, which covers collection from
      2023-07-19 to 2025-05-01.
  - name: Finite biorepository samples
    limitation_type: scope_limitation
    limitation_description: >-
      A limitation of the biorepository is that there is a finite number of samples to share
      with scientists interested in using them in research.
    recommended_mitigation: >-
      Procedures for reviewing and prioritizing written requests will be developed before the
      biorepository is complete.
  - name: Visual acuity variables dropped relative to the previous release
    limitation_type: integration_limitation
    limitation_description: >-
      The data fields and types are largely the same as in the prior version of the dataset,
      but the Snellen visual acuity variables were dropped in this version, so only logMAR
      visual acuity measurements are available. Analyses that span releases must account for
      this.
  - name: Raw data are not distributed
    limitation_type: methodological_limitation
    limitation_description: >-
      The raw data are saved and expected to be preserved by the project at least for the
      duration of the project but are not anticipated to be shared outside the project team,
      because they have not been mapped to standardized terminologies and may accidentally
      include personal health information or personally identifiable information in free text
      fields.

confidential_elements:
  - name: Confidential content assessment
    confidential_elements_present: false
    confidentiality_details: >-
      The dataset does not contain data that might be considered confidential. No personally
      identifiable information is included in the dataset.

content_warnings:
  - name: Offensive or distressing content assessment
    content_warnings_present: false
    description: >-
      The healthsheet records that the dataset contains no data that, if viewed directly,
      might be offensive, insulting, threatening or otherwise pose a safety risk.

subpopulations:
  - name: Demographic subpopulation identification
    subpopulation_elements_present: false
    identification: >-
      The dataset does not identify demographic sub-populations. Information related to the
      sex and race or ethnicity of the participants, and medications used, has been removed
      from the released data; sex, race and ethnicity are held under controlled access. No
      regulation prevented demographic data collection in the study.
    distribution: >-
      Cohort composition is reported at the level of the recommended data splits rather than
      per instance. Across the 2,280 participants the counts are 380 Hispanic, 545 Asian, 519
      Black and 836 white; 951 male and 1,329 female; and 776 with no diabetes, 560
      lifestyle-controlled, 686 oral-medication-controlled and 258 insulin-controlled. Mean
      age is 60.8 years with a standard deviation of 11.3 years.

sensitive_elements:
  - name: Sensitive content assessment
    sensitive_elements_present: false
    sensitivity_details: >-
      The public dataset does not contain data that is considered sensitive. The controlled
      access dataset contains data regarding racial and ethnic origins, location as a
      five-digit ZIP code, and motor vehicle accident reports, and also holds sex, genetic
      sequencing data, past health records and medications.

relationships:
  - name: Relationship between instances
    relationship_details: >-
      All instances are part of the same prospective data generation project, AI-READI. There
      is currently only one visit per participant, so instances are not linked to one another
      by repeated measures within this release.

splits:
  - name: Recommended training, validation and test splits
    split_details: >-
      The release comes with recommended data splits. Because sex, race and ethnicity data are
      not released with the public version of the dataset, the project team prepared data
      splits in 70/15/15 proportions for training, validation and testing, where the
      validation and test sets are balanced as well as possible for sex, race and ethnicity,
      and diabetes status across the four groups of no diabetes, prediabetes or
      lifestyle-controlled, oral-medication-controlled and insulin-controlled. The split
      assignment is distributed in the participants.tsv file included in the dataset. The
      splits contain 1,576, 352 and 352 participants respectively, and are also balanced for
      age. This release introduces no new tasks or labeling, only the new recommended split.

acquisition_methods:
  - name: Mixed direct observation and participant report
    was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      The acquisition of data varied based on the domain. Some data were directly observable,
      such as laboratory results, vitals and retinal imaging, whereas other data were reported
      by subjects, such as survey responses. Verification of data entry was performed when
      possible, for example by cross-referencing entered medications with medications that
      were physically brought in or photographed by each study participant.

collection_mechanisms:
  - name: REDCap electronic data capture
    mechanism_details: >-
      REDCap is used for collecting patient-reported data from questionnaires and the
      following clinical data from the visit: medications assessment, vitals, visual acuity,
      contrast sensitivity, monofilament test results and complete blood count test results.
      Clinical data outside expected minimum and maximum ranges were flagged in REDCap for
      review by clinical research coordinators and data managers.
  - name: Instrument and device export to local storage
    mechanism_details: >-
      Data from the following devices are exported in their raw format to local storage:
      electrocardiogram as .xml, the MoCA Duo application as .csv, retinal imaging in
      device-native formats, and at-home monitoring devices comprising environmental sensors,
      continuous glucose monitors and fitness trackers. Blood and urine testing by the
      University of Washington Nutrition and Obesity Research Center laboratory is provided in
      .csv format. All participant images are exported from imaging devices in their raw
      format and some required conversion to DICOM before upload.
  - name: Upload to the FAIRhub data management platform
    mechanism_details: >-
      All data are uploaded at regular intervals to the AI-READI-specific data management
      platform called FAIRhub, a Microsoft Azure cloud-based platform developed for this
      project. For some devices the data are transformed from a proprietary state into a
      standard model format prior to upload. The data manager at each data site is
      responsible for quality control of all data before uploading.
  - name: Electronic health record screening for recruitment
    mechanism_details: >-
      Recruitment pools were identified by screening electronic health records for diabetes
      and prediabetes ICD-10 codes for all patients who had had an encounter with the sites'
      health systems. The study protocol states that patients with type 2 diabetes and
      pre-diabetes are identified by screening for ICD-10 diagnosis codes R73.09 and E11.X
      respectively, and that patients without diabetes will not have encounters with these
      ICD codes. Individuals in each
      pool were mailed a printed invitation letter and sent an invitation email, both
      personalized to direct them into an online REDCap recruitment interface using links,
      access codes and QR codes.

sampling_strategies:
  - name: Stratified non-probability recruitment from health system encounters
    is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      All patients aged 40 years or older who had a medical encounter within each health
      system site, the University of Alabama at Birmingham, the University of California San
      Diego and the University of Washington, within the past two years.
    strategies: >-
      Non-Probability Sample. Participants are recruited in waves; for each wave a contact
      pool is identified by screening electronic health records at each site, and the
      University of Alabama at Birmingham selects a stratified sample of potential
      participants based on the sampling scheme. The composition and size of each wave are
      influenced by the observed participation characteristics of race and ethnicity, gender,
      severity of type 2 diabetes and site. As recruitment progresses the composition of
      participants is monitored and adjusted by under- and oversampling groups as needed until
      recruitment goals are met. The cohort is triple-balanced by self-reported race and
      ethnicity across four groups, four categories of type 2 diabetes severity, and
      biological sex.
    why_not_representative: >-
      Rather than targeting the demographic distribution of the United States population, the
      study deliberately recruits equal numbers of four racial and ethnic groups, because
      building balanced datasets is critical for the development of unbiased machine learning
      models. Recruitment is also predominantly urban and hospital-based, and the cohort does
      not include Pacific Islanders or Native Americans.
    description: >-
      The released dataset itself contains all possible instances, that is, data from all
      participants enrolled in the collection window, rather than a further sample of them.
      The healthsheet records no sampling strategy applied at the time of preprocessing.

data_collectors:
  - name: Principal Investigators and Co-Investigators
    role: Principal Investigator, Co-Principal Investigator, Co-Investigator
    collector_details: >-
      Make executive decisions pertaining to the scope of the project including data
      collection, curation and processing.
  - name: Program and project managers
    role: Program/project manager
    collector_details: >-
      Oversee data collection and management of research coordinators and project managers,
      make project-related decisions in collaboration with the investigators, and oversee
      integration and collaboration between all study members and modules.
  - name: Database manager
    role: Database manager
    collector_details: Ingest data into the REDCap database and extract it for processing.
  - name: Research and data scientists
    role: Research/Data scientist/Postdoctoral Fellow
    collector_details: Process data for release in the database and develop standards.
  - name: Clinical research coordinators
    role: Clinical research coordinator/study coordinator
    collector_details: >-
      Responsible for contacting and consenting research participants, ushering participants
      through the research visit, conducting study visits including collection of
      ophthalmologic images, providing training on study procedures such as continuous glucose
      monitoring or the fitness tracker, and ensuring the return of all study materials. All
      research personnel at the three data sites who recruited, enrolled and collected data
      underwent training by the data manager at the University of Alabama at Birmingham and
      used a detailed Manual of Procedures; a certification process is required for all
      coordinators, including mandatory institutional compliance training for human subject
      research and successful administration of all protocol elements to at least three
      volunteer practice subjects.
  - name: Research assistants
    role: Research assistant
    collector_details: >-
      Conduct study visits including collection of ophthalmologic images, provide training on
      study procedures such as continuous glucose monitoring or the fitness tracker, and
      ensure the return of all study materials under the direction of the study coordinator or
      project manager; responsible for data upload and management from each clinic visit.
  - name: Software engineers
    role: Software engineer
    collector_details: >-
      Responsible for designing, implementing and testing the different data curation
      pipelines.
  - name: Cloud engineers
    role: Cloud engineer
    collector_details: >-
      Responsible for cloud infrastructure customization, configuration and deployment,
      including integrating, configuring, deploying and managing centrally provided common
      cloud services.
  - name: Phlebotomists
    role: Phlebotomist
    collector_details: Responsible for blood collection from research participants.
  - name: Laboratory assistants
    role: Lab Assistant
    collector_details: Responsible for processing and shipping samples.
  - name: Domain experts
    role: Domain expert
    collector_details: >-
      Provide guidance on issues arising from collecting data from each domain of medicine
      such as endocrinology and cardiology.
  - name: Clinical and central testing laboratories
    role: Testing laboratory
    collector_details: >-
      Laboratories certified under the Clinical Laboratory Improvement Amendments and local to
      each data collection site perform complete blood count testing on fresh whole blood
      samples. All other laboratory tests are performed by the University of Washington
      Nutrition and Obesity Research Center testing facility using stored, frozen samples.
  - name: Study participants
    role: Study participant
    collector_details: >-
      Participants completed self-reported surveys before the visit and carried out ten days
      of at-home data collection with a continuous glucose monitor, a fitness tracker and a
      home environmental sensor, returning the devices with a data sheet indicating which
      wrist the fitness tracker was worn on, their dominant hand, and where the environmental
      sensor was placed in the home. Their effort was compensated as described under
      participant compensation.

collection_timeframes:
  - name: Collection window for release 3.0.0
    start_date: "2023-07-19"
    end_date: "2025-05-01"
    timeframe_details: >-
      For this version of the dataset the timeframe for data collection was July 19, 2023 to
      May 1, 2025, covering data collected up through the end of the second year of the study.
  - name: Overall project timeline
    timeframe_details: >-
      The timeline for the overall project spans four years, encompassing one year dedicated
      to protocol development and training and years 2 to 4 allocated for subject recruitment
      and data collection. The study start date is recorded as 2023-07-19 and the anticipated
      completion date as 2027-01-01, with overall status "Enrolling by invitation". The study
      protocol states that enrollment will continue until 30 November 2026 and that
      preliminary pilot enrollment occurred between 18 July 2023 and 30 November 2023, with
      formal data collection beginning on 1 December 2023. Approximately 4 percent of
      participants are expected to undergo a follow-up examination in year 4.

direct_collection:
  - name: Direct collection from participants
    is_direct: true
    collection_details: >-
      The data was collected directly from participants across the three recruiting sites.
      Recruitment pools were identified by screening electronic health records for diabetes
      and prediabetes ICD-10 codes for all patients who have had an encounter with the sites'
      health systems within the past 2 years.

collection_notifications:
  - name: Participant awareness of collection
    notification_details: >-
      Each individual was aware of the data collection, as this was not passive data
      collection or secondary use of existing data but rather active data collection directly
      from participants. Potential participants received a mailed invitation letter and an
      invitation email directing them to an online REDCap interface where they could read an
      overview of the research program, expectations for participation and answers to
      frequently asked questions.

collection_consents:
  - name: Informed consent before participation
    consent_details: >-
      Informed consent to participate was required before participation in any part of the
      protocol, including questionnaires. Potential participants were given the option to read
      all consent documentation electronically before their visit and give consent with an
      electronic signature without verbal communication with a clinical research coordinator.
      Participants may access electronic consent documentation in REDCap and decide at that
      point that they do not want to participate or would like additional information. The
      approved consent form for the principal project site, the University of Washington, is
      published in the dataset documentation. The other clinical sites had IRB reliance and
      used the same consent form, with minor institution-specific language incorporated
      depending on individual institutional requirements. Consent obtained in person is
      obtained in a private room by a study team member, with the opportunity to ask questions
      before signing and to schedule additional time if required.

consent_revocations:
  - name: Withdrawal of consent
    revocation_details: >-
      Participants were permitted to withdraw consent at any time and cease study
      participation. However, any data that had been shared or used up to that point would
      stay in the dataset. This is clearly communicated in the consent document.

missing_data_documentation:
  - name: Missing modalities and survey items
    missing_data_patterns: >-
      Not all modalities are available for all participants. In survey data, skipped questions
      or incomplete responses occur.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In a few cases the
      data collection device did not have any stored results or was returned too late to
      retrieve the results, for example because the battery died or data was lost. In a few
      cases there may have been a data collision at some point in the process and data has
      been lost. Operator-driven imaging modalities may be skipped when quality issues arise.
    handling_strategy: >-
      During collection, missing data that could be directly filled from other portions of an
      individual's record were corrected under the guidance and approval of the site principal
      investigator. Where there was no logical or appropriate way to correct the data, the
      site principal investigator reviewed the values and decided whether they should be
      removed. No data were excluded from the dataset at the time of preprocessing.

raw_data_sources:
  - name: Study participants
    source_description: >-
      Self-reported survey data collected from participants before, during and after the study
      visit, covering initial screening, demographics, depression screening, problem areas in
      diabetes, diabetes self-care, diet, smoking, alcohol, vaping and marijuana use, general
      health, social determinants of health, visual impairment and eye care access, and
      current medications.
    source_type: participant self-report
    raw_data_format: REDCap survey responses; paper questionnaires transcribed into REDCap
  - name: On-site clinical instruments
    source_description: >-
      Measurements taken during the in-person visit, including height, weight, waist and hip
      circumference, blood pressure and heart rate, a 12-lead electrocardiogram, the
      monofilament test for peripheral neuropathy, the Montreal Cognitive Assessment,
      autorefraction, lensometry, best-corrected visual acuity, and letter contrast
      sensitivity under photopic and mesopic conditions.
    source_type: clinical instrument
    raw_data_format: XML for the electrocardiogram; CSV for the MoCA Duo application
  - name: Retinal imaging devices
    source_description: >-
      Retinal images acquired on the Optomed Aurora IQ, iCare EIDON, Heidelberg Spectralis
      HRA, Topcon Maestro2 3D OCT-1, Topcon Triton DRI OCT, Zeiss Cirrus 5000 Angioplex, and
      Heidelberg FLIO devices. Both eyes are imaged for each participant and all retinal images
      are collected under dilated conditions except for the Optomed.
    source_type: imaging device
    raw_data_format: >-
      DICOM natively for some devices; .fda for Topcon devices and .sdt for the Heidelberg
      FLIO, both converted to DICOM for the dataset
  - name: At-home monitoring devices
    source_description: >-
      Ten days of at-home data collection using a Dexcom G6 continuous glucose monitor, a
      Garmin Vivosmart 5 physical activity monitor, and a custom-designed home environmental
      sensor built at the Karalis Johnson Retina Center, University of Washington. The
      environmental sensor and fitness tracker were chosen with participant privacy as a
      primary concern; they capture no video or audio, have no GPS location monitoring, and
      are not synced with participant-owned devices. Participants are masked to the Dexcom
      results during the monitoring period.
    source_type: wearable and environmental sensor
    raw_data_format: >-
      CSV for the continuous glucose monitor and environmental sensor; .FIT for the fitness
      tracker, converted to the Open mHealth standard for the dataset
  - name: Clinical laboratory testing of blood and urine
    source_description: >-
      Non-fasting blood, approximately 50 to 60 mL, and a urine specimen collected during the
      study encounter. Complete blood counts are run at laboratories local to each site
      certified under the Clinical Laboratory Improvement Amendments; all other assays are run
      at the University of Washington Nutrition and Obesity Research Center on stored, frozen
      samples batch-shipped on dry ice approximately once per quarter.
    source_type: clinical laboratory
    raw_data_format: CSV
  - name: Electronic health records
    source_description: >-
      Medical records extracted to obtain data on general health, eye health, medical and
      surgical history, diabetes, medications, laboratory records and previous medical imaging
      such as eye imaging. Electronic health records were also screened for eligibility and
      recruitment using ICD-10 diagnosis codes, age and demographic data.
    source_type: electronic health record
  - name: State driving and accident records
    source_description: >-
      Information about car accidents participants may have experienced and traffic tickets
      received in the last three years, obtained from the Department of Licensing. These are
      held under controlled access.
    source_type: administrative record
  - name: Biospecimen repository
    source_description: >-
      Blood derivatives sent to the biorepository at the University of Alabama at Birmingham
      Center for Clinical and Translational Science, comprising isolated plasma, serum, buffy
      coats, genomic DNA, PAXgene-stabilized RNA and peripheral blood mononuclear cells,
      stored at -80 degrees Celsius or at cryogenic temperatures. These will be available to
      researchers for future ancillary studies according to procedures and policies that are
      in development.
    source_type: biospecimen
    access_details: >-
      Biobanked samples will eventually be available to scientists according to procedures and
      policies that are in development. Procedures for reviewing and prioritizing written
      requests will be developed before the biorepository is complete.

raw_sources:
  - name: Raw data availability
    raw_data_details: >-
      The raw data is saved and expected to be preserved by the AI-READI project at least for
      the duration of the project but is not anticipated to be shared outside the project team
      at present, because it has not been mapped to standardized terminologies and because the
      raw data may accidentally include personal health information or personally identifiable
      information, for example in free text fields. There is a possibility that raw data may
      be included in future releases of the controlled access dataset.

preprocessing_strategies:
  - name: Mapping to standardized terminologies and formats
    preprocessing_details: >-
      Once data were sent from each of the study sites to the central project team, additional
      processing steps were conducted in preparation for dissemination. All data were mapped
      to standardized terminologies when possible, such as the Observational Medical Outcomes
      Partnership Common Data Model for observational health data and Digital Imaging and
      Communications in Medicine for medical imaging data. For some devices the data are
      transformed from a proprietary state into a standard model format prior to upload to
      FAIRhub; Topcon .fda files and Heidelberg FLIO .sdt files are converted to DICOM, and
      Garmin .FIT files are converted to the Open mHealth standard.
  - name: Removal of protected and stigmatizing attributes from the released data
    preprocessing_details: >-
      The released data contain no protected health information. Information related to the
      sex and race or ethnicity of the participants, as well as medications used, has been
      removed. The Nature Metabolism comment describes this removal of sex and race or
      ethnicity as intended to prevent stigmatization of findings.

cleaning_strategies:
  - name: Range checks and record review at the point of entry
    cleaning_details: >-
      Several quality control measures were used at the time of data entry and acquisition.
      Clinical data outside expected minimum and maximum ranges were flagged in REDCap, which
      was visible in reports viewed by clinical research coordinators and data managers. Using
      these reports as guides, data managers and coordinators examined participant records and
      determined if an error was likely. Data were checked for credibility based on range
      checks, incorrect flow through prescribed skip patterns, missing data that can be
      directly filled from other portions of an individual's record, and the omission or
      duplication of records, and were edited if errors were detected. Editing was only done
      under the guidance and approval of the site principal investigator. If corrected data
      was available from elsewhere in the respondent's answers the error was corrected; if
      there was no logical or appropriate way to correct the data, the site principal
      investigator reviewed the values and decided whether they should be removed.
  - name: Internal review for identifiable information
    cleaning_details: >-
      The dataset has not undergone any formal external audits. It has been reviewed
      internally by AI-READI team members for quality checks and to ensure that no personally
      identifiable information was accidentally included.

labeling_strategies:
  - name: No labeling performed
    labeling_details: >-
      No labels are provided and no specific labeling was performed in the dataset, as the
      dataset is hypothesis-agnostic and aimed at facilitating multiple potential downstream
      AI and machine learning applications. There are consequently no gold-standard or proxy
      labels, no human labelers, no inter-rater agreement figures, and no labeling software to
      release. The project team does not have formal guidelines in place for future
      researchers creating new labels or defining new tasks.

existing_uses:
  - name: Prior task usage
    description: >-
      The healthsheet records that the dataset has not been used for any tasks. The FAIRhub
      record for release 3.0.0 reports 24,636 views and a citation count of zero.

use_repository:
  - name: Repository of dataset uses
    repository_details: >-
      There is no repository, other than general scholarly search, that links to papers or
      systems that use the dataset.

other_tasks:
  - name: Guidance for new tasks and labels
    task_details: >-
      The project team does not have formal guidelines in place for future researchers who
      wish to create new labels or define new tasks, and is not aware of any widespread
      subversions of the dataset addressing a particular task or application.

future_use_impacts:
  - name: Anticipated harms from composition or processing
    impact_details: >-
      To the extent of the project team's knowledge, no uses of the dataset are currently
      anticipated that could result in unfair treatment or harm. There is, however, a
      theoretical risk of future re-identification. Because enrollment is ongoing, the pilot
      data release and periodic updates to data releases may not have achieved balanced
      distribution across groups, so users should not assume that the released cohort is
      balanced across race and ethnicity, sex and diabetes severity even though the completed
      study design targets that balance.

intended_uses:
  - name: AI and machine learning research on type 2 diabetes
    use_category: research
    usage_notes: >-
      The public version of the dataset can only be used for type 2 diabetes related research;
      a private version will allow for more generic use. Accessing the dataset requires
      agreeing to use the data only for type 2 diabetes related research.
    examples:
      - Studying salutogenesis, the pathway from type 2 diabetes to health
      - Studying the pathogenesis of type 2 diabetes
      - Multimodal model development on balanced clinical, imaging and wearable data
  - name: Pseudotime manifold analysis
    use_category: research
    examples:
      - >-
        Reconstructing a temporal atlas of type 2 diabetes development and reversal towards
        health from cross-sectional multimodal data spanning disease severity
  - name: Model training with the recommended splits
    use_category: research
    usage_notes: >-
      The suggested split for training, validating and testing models is included in the
      participants.tsv file, in 70/15/15 proportions, with the validation and test sets
      balanced as well as possible for sex, race and ethnicity, and diabetes status.
    examples:
      - Training, validating and testing AI and machine learning models on the dataset
  - name: Creation of derivative models, algorithms and programs
    use_category: commercial and non-commercial
    usage_notes: >-
      The license grants a non-exclusive and non-transferable license to download, reproduce
      and use the Data, and to create derivative works of the Data, for research, commercial
      and non-commercial purposes. Licensees may make, reproduce and distribute models,
      algorithms and programs developed, trained or adapted using the Data but which do not
      themselves contain the Data or any modified version of it, provided that before
      dissemination the licensee undertakes all reasonable efforts to minimize the likelihood
      that Data can be memorized, derived, reconstructed or reconstituted through the use or
      construction of such models.
    examples:
      - Distributing models trained on the data that do not themselves contain the data
  - name: Blueprint and methods reuse by other data generation projects
    use_category: research
    examples:
      - >-
        Following the project's published guidelines and standards, such as the Clinical
        Dataset Structure, when building other AI-ready clinical research datasets

prohibited_uses:
  - name: Clinical treatment decisions
    prohibition_reason: >-
      Licensees shall not make clinical treatment decisions based on the Data, as it is
      intended solely as a research resource.
  - name: Re-identification or contact of data subjects
    prohibition_reason: >-
      Licensees shall not use or attempt to use the Data, alone or in concert with other
      information, to compromise or otherwise infringe the confidentiality of information
      about an individual person who is the source of any Data, to invade or compromise the
      privacy of any Data Subject, to attempt to identify or contact any Data Subject or group
      of Data Subjects, to extract or extrapolate any identifying information about a Data
      Subject, to establish a Data Subject's membership in a particular group of persons, or
      otherwise to cause harm or injury to any Data Subject.
  - name: Sharing data with third-party model vendors for training
    prohibition_reason: >-
      Licensees shall not share or distribute Data with any third party model vendor or
      developer for training or development purposes, even if that vendor is party to a
      business associate agreement with the licensee's institution, where training includes
      model weight modification and other adjustments to a model's logic or operation. A third
      party model may be used to analyze the Data if the vendor is party to such an agreement
      and the model's interaction with the Data is limited to short-term interaction such as
      prompting or querying.
  - name: Transfer to parties outside the license
    prohibition_reason: >-
      Licensees shall not transfer, license, sublicense, sell, assign, display, share or
      otherwise convey any portion of the Data or any derivative work to any third party other
      than another licensee bound by an identical agreement with the licensor, and then only
      for the purpose of collaborating on one or more projects involving the Data.
  - name: Bulk reproduction of data in publications
    prohibition_reason: >-
      Data may not be reproduced in papers, articles, presentations, analyses, reports or
      publications except that small representative samples of Data may be reproduced in up to
      five images or figures per paper for illustrative purposes only. Notwithstanding journal
      or conference requirements, larger amounts of data shall not be published, posted or
      otherwise made available via supplemental files, zip archives, code packages or other
      means.
  - name: Storage outside approved environments
    prohibition_reason: >-
      Licensees may use and store the data only on servers and devices maintained by and
      located within the licensee's institution or employer, or on cloud or remote storage and
      backup services that have a HIPAA-approved business associate agreement in place with
      that institution or employer.
  - name: Removal of watermarking
    prohibition_reason: >-
      The Data may be statically watermarked to identify the licensee for security purposes,
      and the licensee agrees to take no action to remove, obscure, alter or mask such
      watermarking.

distribution_formats:
  - name: DICOM imaging files
    format: DICOM
    media_type: application/dicom
    description: >-
      Retinal photography, optical coherence tomography, optical coherence tomography
      angiography and fluorescence lifetime imaging ophthalmoscopy files are distributed in
      the DICOM standard.
    access_urls:
      - https://fairhub.io/datasets/3/access
  - name: Tabular CSV files
    format: CSV
    media_type: text/csv
    description: >-
      Clinical data mapped to the OMOP Common Data Model, environmental sensor data, and
      wearable and continuous glucose monitoring data are distributed as delimited text.
      Directory-level manifest.tsv metadata files based on the Clinical Dataset Structure
      accompany each data type.
    access_urls:
      - https://fairhub.io/datasets/3/access
  - name: JSON metadata files
    format: JSON
    media_type: application/json
    description: >-
      Structured metadata files are distributed as JSON, including dataset_description.json,
      study_description.json, dataset_structure_description.json and the OMOP data quality
      dashboard file dqd_omop.json.
    access_urls:
      - https://fairhub.io/datasets/3/access
  - name: Markdown documentation files
    format: Markdown
    media_type: text/markdown
    description: >-
      Documentation distributed with the dataset, including the readme and the CHANGELOG, is
      provided as Markdown.
    access_urls:
      - https://fairhub.io/datasets/3/access

distribution_dates:
  - name: Release 1.0.0
    release_dates:
      - "2024-05-03"
    description: >-
      The first version of the dataset, comprising data from the pilot data collection phase
      with 204 participants, was distributed in May 2024.
  - name: Release 2.0.0
    release_dates:
      - "2024-11-08"
    description: >-
      The second version of the dataset, comprising data collected up to the end of the first
      full year of the study for a total of 1,067 participants, was distributed in November
      2024.
  - name: Release 3.0.0
    release_dates:
      - "2025-11-17"
    description: >-
      The third version of the dataset, comprising data collected between July 19, 2023 and
      May 1, 2025 for a total of 2,280 participants, was distributed on November 17, 2025.
  - name: Planned future releases
    release_dates:
      - approximately once a year
    description: >-
      There are plans to release new versions of the dataset approximately once a year with
      additional data from participants who have been enrolled since the last dataset version
      release. Enrollment is ongoing and future versions will include larger numbers of
      participants.

third_party_sharing:
  - name: Distribution outside the creating entity
    is_shared: true
    description: >-
      The dataset is distributed and available for public use through the FAIRhub platform.
      Deidentified data are released approximately yearly in two sets: a controlled access set
      and a publicly accessible set with fewer requirements for access. The controlled access
      set contains all data available in the publicly accessible set plus more sensitive data
      that are only available for use by scientists whose institutions have completed legal
      and privacy use agreements with the AI-READI research program.

license_and_use_terms:
  name: AI-READI custom license v2.0
  data_use_permission: disease_specific_research
  license_terms: >-
    The dataset is licensed under a custom license tailored to enable reuse of the AI-READI
    dataset, and other clinical datasets, for commercial or research purposes while placing
    strong requirements around data usage, security and secondary sharing to protect study
    participants, especially when data is reused for artificial intelligence and machine
    learning applications. The license document is the AI-READI Data License Agreement
    (Version 2.0), published at 10.5281/zenodo.17555036, with Washington University in St.
    Louis as Licensor. Licensees assent through the data request workflow, and the information
    provided in that workflow forms an integral part of the agreement. A licensee may enter
    the agreement individually or on behalf of an authorized group within their institution or
    employer, in which case authorized users are individuals who are legal members of that
    group by contract, employment or student status; a user's rights terminate automatically
    on severance of that relationship. The license grants a non-exclusive, non-transferable
    right to download, reproduce and use the Data and to create derivative works for research,
    commercial and non-commercial purposes. Derivative data, including synthetic data created
    using the Data, are themselves considered Data and subject to all restrictions.
    Acknowledgement of the licensor, the source and any funder is required in any papers
    reporting use of the Data. Licensees must comply with the data security and privacy
    standards established by the US National Institutes of Health under its Genomic Data
    Sharing Policy. The agreement terminates automatically on any breach, whereupon the
    licensee must delete all copies of the Data and cease all use. The Data is provided on an
    "as is" basis without warranty of any kind, the licensor's aggregate liability is capped
    at one US dollar except where applicable law prohibits such limitation, and the licensee
    indemnifies the licensor against claims arising from the licensee's use of the Data or any
    model. A version 1.0 of the license was previously published at 10.5281/zenodo.10642459.

ip_restrictions:
  name: Intellectual property restrictions
  restrictions:
    - >-
      Title to the Data, and all industrial and intellectual property rights therein, remain
      solely and exclusively with the Licensor and its suppliers, and the licensee shall not
      take any action inconsistent with such ownership.
    - Any rights not expressly granted in the license agreement are reserved to the Licensor and its suppliers.
    - >-
      Data may not be reproduced in papers, articles, presentations, analyses, reports or
      publications except that small representative samples may be reproduced in up to five
      images or figures per paper for illustrative purposes only; licensees may refer
      publishers and conference organizers to the Licensor if they wish to obtain a separate
      license for such purposes.
    - >-
      There are no plans for the researchers involved in collecting the dataset to develop
      commercial products or file for patents, although the dataset is publicly available with
      a commercial-friendly license and products or patents may be developed from it in the
      future.

regulatory_restrictions:
  name: Regulatory and security restrictions
  hipaa_compliant: compliant
  confidentiality_level: restricted
  description: >-
    Access to the dataset requires login through a verified identity system and assent to the
    license terms, so the data are restricted rather than openly downloadable. The RO-Crate
    records a confidentiality level of "HL7:2N (normal)".
  regulatory_restrictions:
    - >-
      Licensees must comply with all data security and privacy standards established by the US
      National Institutes of Health under its Genomic Data Sharing Policy, the current version
      of which is the NIH Security Best Practices for Controlled-Access Data Subject to the
      NIH GDS Policy.
    - >-
      The Data may be statically watermarked to identify the licensee for security purposes,
      and licensees must not remove, obscure, alter or mask such watermarking.
    - >-
      Data may be stored only on servers and devices maintained by and located within the
      licensee's institution or employer, or on cloud or remote storage and backup services
      that have a HIPAA-approved business associate agreement in place with that institution
      or employer.
    - >-
      Licensees agree to comply with all applicable laws, regulations and restrictions
      relating to the distribution and use of the Data and of models built from it.
    - >-
      The public release is stripped of protected health information as defined by the HIPAA
      Privacy Rule; the healthsheet and the API metadata both record that no identifiable data
      under US HIPAA are present in the released data.

data_governance:
  name: AI-READI data governance
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: >-
    Accessing the dataset requires several steps: logging in through a verified identity
    system, agreeing to use the data only for type 2 diabetes related research, and agreeing
    to the license terms, which set restrictions and obligations for data usage. The FAIRhub
    access type for this release is recorded as public download with self-attestation
    required. The controlled access set is only available to scientists whose institutions
    have completed legal and privacy use agreements with the AI-READI research program; the
    study protocol publication records that the requirements for controlled access datasets
    were being developed by a Data Access Committee at the time of writing.
  description: >-
    The RO-Crate names the AI-READI Consortium as the data governance committee. The FAIRhub
    metadata names Washington University in St. Louis as the managing organization and lead
    sponsor, and the license agreement names it as Licensor, so it is recorded here as the
    accountable organization. A Community Advisory Board of 11 persons drawn from the three
    sites, including diversity in race and ethnicity as represented in the AI-READI sample,
    contributes to the development of the protocol and evaluates consent forms and research
    protocols.

maintainers:
  - name: AI-READI team
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub
      through Microsoft Azure. Contact information is published in the readme file included
      with the dataset, which directs questions, suggestions and feedback to
      https://aireadi.org/contact; the dataset documentation contact page is at
      https://docs.aireadi.org/docs/3/contact, and the study's central contact is Aaron Lee at
      contact@aireadi.org.

updates:
  name: Release plan
  frequency: approximately once a year
  update_details: >-
    The dataset will not be updated in place. Rather, new versions of the dataset will be
    released with additional instances as more study participants complete the study visit.
    New versions are planned approximately once a year with additional data from participants
    enrolled since the last release. Changes between versions are documented in detail in the
    CHANGELOG file included in the dataset and visible in the documentation site.

retention_limit:
  name: Data retention
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. The raw
    data is expected to be preserved by the AI-READI project at least for the duration of the
    project.

version_access:
  name: Version availability
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
    - "Version 1.0.0, DOI 10.60775/fairhub.1, released 2024-05-03, 204 participants"
    - "Version 2.0.0, DOI 10.60775/fairhub.2, released 2024-11-08, 1,067 participants"
    - "Version 3.0.0, DOI 10.60775/fairhub.3, released 2025-11-17, 2,280 participants"
  version_details: >-
    The dataset is released as static versions rather than dynamically updated, and each
    version is accessible through FAIRhub. Because the dataset will not be updated in place,
    the healthsheet records the question of continued support for older versions as not
    applicable. The FAIRhub page for version 2.0.0 states that that version of the dataset is
    no longer accessible and directs users to the latest version. There is one version of the
    documentation associated with each version of the dataset, navigable from a version
    selector in the documentation site. Datasheets exist for the first and second versions of
    the dataset as well as this one.

extension_mechanism:
  name: External contribution
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset
    outside of those who are involved in the project.

ethical_reviews:
  - name: Institutional Review Board approval
    reviewing_organization: Institutional Review Board of the University of Washington
    review_details: >-
      The study was approved by the Institutional Review Board of the University of Washington
      under approval number STUDY00016228, including reliance agreements with the Institutional
      Review Boards of the University of Alabama at Birmingham and the University of
      California, San Diego. The initial approval was received on December 20, 2022, and the
      initial approval letter is published in the dataset documentation. An annual renewal
      application to the IRB about the status and progress of the study is required and is due
      within 90 days of expiration. The human subject review status is recorded as submitted
      and approved. The RO-Crate records the IRB contact as the IRB Reliance Team at the Human
      Subjects Division, University of Washington, 4333 Brooklyn Ave NE Box 359470, Seattle,
      WA 98195-9470, United States.
  - name: Project ethical review
    review_details: >-
      Ethical review for the dataset is recorded in the RO-Crate as having been carried out by
      Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans. The project states
      that ethical, legal and social implications are considered at every stage of the project
      cycle, and that it aims to establish standards, best practices and guidelines for the
      collection, preparation and sharing of data for AI and machine learning purposes,
      including guidance from bioethicists. Through engagement with the Native Biodata
      Consortium, the project provides a co-learning opportunity for understanding challenges
      specific to American Indian and Alaska Native communities and for evaluating tools such
      as data usage agreements, contract negotiations, transparent access agreements, and
      forms of assured return of benefit and sustainable input, control and monitoring of
      tribal data.

data_protection_impacts:
  - name: Data protection impact analysis
    impact_details: >-
      A data protection impact analysis has not been conducted.

human_subject_research:
  name: Human subjects research status
  involves_human_subjects: true
  ethics_review_board: Institutional Review Board of the University of Washington
  irb_approval:
    - >-
      STUDY00016228, University of Washington, initial approval received December 20, 2022,
      with annual renewal required within 90 days of expiration
    - >-
      Reliance agreements with the Institutional Review Boards of the University of Alabama at
      Birmingham and the University of California, San Diego
  special_populations:
    - >-
      Participants are adults aged 40 years and older, so no minors are enrolled; pregnancy,
      gestational diabetes and type 1 diabetes are exclusion criteria, and the eligibility
      metadata records a maximum age of 85 years
    - >-
      The cohort does not include Pacific Islanders or Native Americans; the project engaged
      the Native Biodata Consortium and planned a tribal consultation toward collecting
      similar data within a Native American cohort in an ethical and respectful manner
  regulatory_compliance:
    - >-
      The public release is stripped of protected health information as defined by the HIPAA
      Privacy Rule
    - >-
      Licensees must comply with the data security and privacy standards established by the US
      National Institutes of Health under its Genomic Data Sharing Policy
    - >-
      The study is recorded as not regulated by the US Food and Drug Administration for either
      drugs or devices, and as having no data monitoring committee
  description: >-
    The study is an observational cohort study with a cross-sectional time perspective,
    registered on ClinicalTrials.gov as NCT06002048 and recorded under NIH grant OT2OD032644.
    Its overall status at the time of the release metadata is "Enrolling by invitation", with
    an anticipated completion date of 2027-01-01. Three locations are recorded: the University
    of Alabama at Birmingham in Birmingham, Alabama; the University of California, San Diego
    in San Diego, California; and the University of Washington in Seattle, Washington, all in
    the United States and all enrolling by invitation. Eligibility is open to all sexes, is not
    gender-based, and the healthy-volunteers field is recorded as "No"; the sampling
    method is recorded as a non-probability sample. Written informed consent is provided by all
    participants. Recorded study risks are all classified as low and comprise confidentiality
    breach, dilating eye drops, eye imaging discomfort, COVID-19 exposure, emotional stress,
    fatigue, blood draw and continuous glucose monitor site reactions; there is no known harm
    from wearing the fitness tracker or from having the environmental sensor in the home.

informed_consent:
  - name: Participant informed consent
    consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically through REDCap with an
      electronic signature or in person at the start of the visit
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington,
      is published in the dataset documentation as
      "AI-READI Consent_Form_Standard_Mod17May2023_useforpilot.pdf". The other clinical sites
      had IRB reliance and used the same consent form, with minor institution-specific
      language incorporated depending on individual institutional requirements; the State of
      California requires inclusion of the Bill of Rights in the consent form used at the
      University of California, San Diego. Signed electronic consent forms are automatically
      emailed to subjects, who may request an additional copy from a study coordinator at any
      time during the study. Consent materials include a table at the beginning of the form
      clarifying which information will be publicly available and which requires an
      application and approval process.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study
      participation, although any data that had been shared or used up to that point would stay
      in the dataset. This is clearly communicated in the consent document.
    consent_scope: >-
      The consent type recorded in the dataset metadata is
      "ConsentSpecifiedNotElsewhereCategorised", with no non-commercial, geographic,
      research-type, genetic-only or methods restrictions flagged. The recorded consent details state that the public version
      of the dataset can only be used for type 2 diabetes related research and that a private
      version will allow for more generic use. Consent covers secondary use, banking and
      future sharing of data and specimens, including manuscript and grant preparation, future
      research studies, future AI and machine learning algorithms, repository and data-sharing
      platform creation, and future research using stored specimens.

participant_privacy:
  - name: Privacy protections for participants
    anonymization_method: >-
      No identifiers were collected during data collection for the released dataset, and the
      data were checked to confirm that no identifiable data under the US HIPAA definition
      were present. The Nature Metabolism comment describes the public set as stripped of
      protected health information as defined by the HIPAA Privacy Rule via the Safe Harbor
      method.
    reidentification_risk: >-
      There is a theoretical risk of future re-identification. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level identification.
    privacy_techniques: >-
      To prevent re-identification attempts the project implements a robust data dissemination
      system, a strict license agreement, and data watermarking for both the public and
      controlled sets. Information related to sex and race or ethnicity is removed from the
      released data to prevent stigmatization of findings, and medications used are also
      removed. All study procedures are conducted in private rooms, and all study data and
      identifiable information are kept on encrypted servers or in locked cabinets or rooms
      with restricted access at all sites, accessible only to authorized research personnel;
      the IRB data classification is recorded as Level 3. The at-home devices were chosen with
      participant privacy as a primary concern: they capture no video or audio, have no GPS
      location monitoring, and are not synced with participant-owned devices.
    data_linkage: >-
      There are two databases for data distribution. The first is deidentified and publicly
      available. The second holds identifiable or sensitive information, specifically genomic
      data and race and ethnicity, and requires a data use agreement between researchers and an
      approval process developed by the project committee. The controlled access set contains
      all data available in the public set plus five-digit ZIP code, sex, race, ethnicity,
      genetic sequencing data, past health records, medications, and traffic and accident
      reports.

participant_compensation:
  - name: Participant compensation
    compensation_provided: true
    compensation_type: Monetary stipend, with reimbursement of travel costs
    compensation_amount: 200 US dollars per study visit
    compensation_rationale: >-
      Study subjects received a compensation of 200 US dollars for the study visit, paid
      through the grant funding. The stipend is provided when the study team receives the final
      data from the participant and the study devices are returned, typically at least two
      weeks after the study visit to allow for ten days of home-based data collection and time
      for devices to be mailed back. The payment is not prorated. The study also covers
      reasonable costs for parking, public transit or rideshare fees related to the study
      visit, and transportation assistance through rideshare services was offered to
      participants who reported barriers to transporting themselves to study visits. The same
      type and amount of compensation is given to participants who are asked to return in year
      4 of the study. Staff effort was supported by National Institutes of Health award
      OT2OD032644 based on percentage of effort contributed, with salaries aligned to the
      funding guidelines at each site.

is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    No active de-identification was necessary because no identifiers were collected; the
    project checked that no identifiable data under the US HIPAA definition were present in
    the data. The metadata records direct-identifier and HIPAA de-identification as applied,
    and date shifting, non-arbitrary generalization and k-anonymity as not applied.
  identifiers_removed: >-
    Information related to the sex and race or ethnicity of the participants, and medications
    used, has been removed from the released data. Five-digit ZIP code, genetic sequencing
    data, past health records and traffic and accident reports are withheld from the public
    release and held under controlled access.
  deidentification_details: >-
    The dataset metadata records the de-identification type as "NoDeIdentification" with the
    explanation that no identifiers were collected so no active de-identification was
    necessary, but that the project checked that no identifiable data per US HIPAA were
    present in the data. The RO-Crate records the dataset as deidentified. The Nature
    Metabolism comment describes the public set as stripped of protected health information as
    defined by the HIPAA Privacy Rule via the "Safe Harbor" method, as well as information
    related to sex and race or ethnicity; that statement is from a tier 3 publication and is
    recorded here rather than used in place of the tier 1 metadata.

related_datasets:
  - target_dataset: 10.60775/fairhub.2
    relationship_type: is_new_version_of
    description: >-
      Version 2.0.0 of the same dataset, released 2024-11-08 with 1,067 participants. Its
      FAIRhub page states that it is no longer accessible and directs users to the latest
      version.
  - target_dataset: 10.60775/fairhub.1
    relationship_type: is_new_version_of
    description: >-
      Version 1.0.0 of the same dataset, released 2024-05-03 with 204 participants from the
      pilot data collection phase.
  - target_dataset: 10.1038/s42255-024-01165-x
    relationship_type: is_described_by
    description: >-
      "AI-READI: rethinking AI data collection, preparation and sharing in diabetes research
      and beyond", AI-READI Consortium, Nature Metabolism volume 6, December 2024, pages
      2210-2212, published online 8 November 2024. Listed in the RO-Crate as an associated
      publication.
  - target_dataset: 10.1136/bmjopen-2024-097449
    relationship_type: is_described_by
    description: >-
      "Cross-sectional design and protocol for Artificial Intelligence Ready and Equitable
      Atlas for Diabetes Insights (AI-READI)", Owsley C, Matthies DS, McGwin G, et al., BMJ
      Open 2025;15:e097449, received 02 December 2024 and accepted 22 January 2025. The study
      protocol for the data collection this dataset comes from.
  - target_dataset: ark:59853/rocrate-b2ai-aireadi-release-3-0-0
    relationship_type: has_metadata
    description: >-
      The FAIRSCAPE RO-Crate packaging of release 3.0.0, conforming to RO-Crate 1.2-DRAFT and
      the FAIRSCAPE profile 0.1, which declares nine modality subcrates for the environmental
      sensor, FLIO, ECG, OMOP clinical, retinal OCT, retinal OCTA, retinal photography,
      wearable blood glucose and wearable activity monitor data types.
