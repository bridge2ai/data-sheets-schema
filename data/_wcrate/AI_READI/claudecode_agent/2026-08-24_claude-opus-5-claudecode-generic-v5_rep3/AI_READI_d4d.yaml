id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset is the flagship dataset of the Artificial Intelligence Ready and
  Exploratory Atlas for Diabetes Insights (AI-READI) project, one of four data generation
  projects funded by the National Institutes of Health Common Fund Bridge2AI program.
  Release 3.0.0 contains multimodal data from 2,280 participants with and without type 2
  diabetes mellitus, collected between July 19, 2023 and May 1, 2025 and harmonized across
  three data collection sites. It comprises 356,343 files totaling approximately 3.82 TB
  across nine data types: electrocardiography, clinical data mapped to the OMOP Common Data
  Model, home environmental sensing, fluorescence lifetime imaging ophthalmoscopy, optical
  coherence tomography, optical coherence tomography angiography, retinal photography,
  wearable activity monitoring, and continuous glucose monitoring. The dataset was designed
  for artificial intelligence and machine learning research into salutogenesis, the pathway
  from type 2 diabetes back to health, with recruitment sampling aimed at an approximately
  equal distribution of participants across diabetes severity. The released data contain no
  protected health information and omit participant sex, race and ethnicity, and medications
  used; those variables, together with five-digit ZIP code, genetic sequencing data, past
  health records, and traffic and accident reports, are held under controlled access.
