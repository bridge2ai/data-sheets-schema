purposes:
  - name: Enable AI and machine learning research into type 2 diabetes salutogenesis
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence and machine learning research to provide critical insights into type 2
      diabetes mellitus, including salutogenic pathways to return to health. Type 2 diabetes
      is a growing public health threat, yet the current understanding of it, especially in
      the context of salutogenesis, is limited. Given the complexity of the disease,
      AI-based approaches may help improve that understanding, but a key issue is the lack
      of data ready for training AI models; the AI-READI dataset is intended to fill this gap.
  - name: Build a foundational, hypothesis-agnostic atlas of type 2 diabetes
    response: >-
      The long-term objective for the project is to develop a foundational dataset in type 2
      diabetes mellitus, agnostic to existing classification criteria or biases, which can be
      used to reconstruct a temporal atlas of disease development and reversal towards health.
  - name: Establish a blueprint for collecting and sharing AI-ready datasets
    response: >-
      An additional aim of the project is to share a blueprint for collecting and sharing
      AI-ready datasets so that future data generation projects can follow it, including
      guidelines for project management as well as for data collection, management and
      sharing, and new standards such as the Clinical Dataset Structure. The project also
      places emphasis on establishing standards, best practices and guidelines for the
      collection, preparation and sharing of data for AI and machine learning purposes,
      including guidance from bioethicists.

tasks:
  - name: Pseudotime manifold analysis of disease trajectories
    response: >-
      Data collection was specifically designed to permit downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories by collecting and learning
      from complex, multimodal data from participants with differing disease severity, from
      normal to insulin-dependent type 2 diabetes. The approach relies on dimensionality
      reduction and can be used to reconstruct a temporal atlas of pathogenesis and healing.
  - name: General artificial intelligence applications on multimodal diabetes data
    response: >-
      The multi-modal dataset is gathered to facilitate downstream pseudotime manifolds and
      various applications in artificial intelligence.
  - name: Defining disease trajectories and genetic links across racial and ethnic cohorts
    response: >-
      The purpose of the project is data generation to allow future creation of artificial
      intelligence and machine learning algorithms aimed at defining disease trajectories and
      underlying genetic links in different racial and ethnic cohorts.

addressing_gaps:
  - name: Absence of large, well-designed, inclusive multimodal datasets
    response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such
      as type 2 diabetes mellitus has been limited by a lack of well-designed, high quality,
      large and inclusive multimodal datasets. Recent advances in artificial intelligence have
      been limited by the lack of large, well-characterized comprehensive datasets that
      capture molecular, physiological, pathological and clinical measures at various stages
      of illness.
  - name: Lack of racial and ethnic diversity in prior type 2 diabetes research
    response: >-
      A meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020
      indicated that samples lacked racial and ethnic diversity. The AI-READI cohort is
      designed to be approximately balanced across Asian, Black, Hispanic and white
      participants, which the protocol describes as an important step forward in addressing
      these demographic inequities in research.
  - name: Data that are not ready for AI use without reformatting
    response: >-
      A major barrier to AI research has been the lack of diverse datasets that are AI ready
      for training AI models. All data are stored and shared using FAIRhub as AI-ready, which
      is intended to enable immediate AI and machine learning research without reformatting
      and preprocessing.

