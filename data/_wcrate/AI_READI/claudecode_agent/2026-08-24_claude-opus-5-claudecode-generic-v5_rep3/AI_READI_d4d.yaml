source_caveats: >-
  Eleven disagreements between sources in the declared bundle were identified during the
  source audit. Where the input manifest ranks one source above the other, the higher-ranked
  value was used and the alternative is recorded here.

  (1) Release figures. The FAIRhub record for v2.0.0 states 2.01 TB across 165,051 files;
  the FAIRhub record and API metadata for v3.0.0 state 3.82 TB across 356,343 files. Both
  sources are tier 1, but the manifest declares the v2.0.0 record superseded_by the v3.0.0
  record, so the v3.0.0 figures were used. This record describes release 3.0.0 throughout.

  (2) Project name. The FAIRhub API, the RO-Crate and the NIH RePORTER page all expand
  AI-READI as "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights";
  the BMJ Open protocol expands it as "Artificial Intelligence Ready and Equitable Atlas for
  Diabetes Insights". The tier 1 and tier 4 sources agree against the tier 3 publication, so
  "Exploratory" was used.

  (3) Publisher. The FAIRhub API names the publisher as "FAIRhub"; the RO-Crate names it as
  "AI-READI Consortium". Both are tier 1, so the ranking cannot decide and the scalar
  publisher slot was left unpopulated rather than selecting one.

  (4) License name. The FAIRhub API gives the rights name as "AI-READI custom license v2.0";
  the FAIRhub HTML page labels it "Health Data License". The license document itself is
  titled "AI-READI DATA LICENSE AGREEMENT (Version 2.0)", corroborating the API form, which
  was used.

  (5) Principal investigator affiliation. The FAIRhub API records Aaron Lee's affiliation and
  the study's lead sponsor as Washington University in St. Louis (ROR 01yc7t268); the
  RO-Crate records "Aaron Lee, Department of Ophthalmology, University of Washington"; NIH
  RePORTER gives the awardee organization as University of Washington. The API value was used
  for the affiliation because it is stated three times in the same tier 1 source, as lead
  sponsor, managing organization and responsible-party affiliation, and because the license
  agreement names Washington University in St. Louis as Licensor.

  (6) Institutional Review Board. The RO-Crate names the reviewing body "Washington
  University IRB" while giving its address as the Human Subjects Division, University of
  Washington, Seattle. The healthsheet and the BMJ Open protocol both name the University of
  Washington. The University of Washington reading was used.

  (7) Enrollment start. The FAIRhub API records an actual study start date of 2023-07-19 and
  a data collection window beginning 2023-07-19; the BMJ Open protocol states enrollment
  began on 18 July 2023. The tier 1 date was used.

  (8) Target enrollment. The FAIRhub API, the BMJ Open protocol and the Nature Metabolism
  comment all state a target of 4,000 participants; the IRB protocol states 4,600 in two
  places while also tabulating four groups of 1,000. The tier 1 figure of 4,000 was used.

  (9) Coverage statement. The healthsheet answer on completeness states that the dataset
  contains data from all participants enrolled "during the first year of data collection",
  while the same healthsheet, the readme and the dataset description all state that this
  release covers 2023-07-19 to 2025-05-01 and 2,280 participants. The longer window is
  stated more often and by more sources and was used.

  (10) De-identification. The FAIRhub API states that no identifiers were collected, so no
  active de-identification was necessary, and that the data were checked against the US
  HIPAA definition of identifiable data; the Nature Metabolism comment states that the public
  set is stripped of protected health information via the HIPAA "Safe Harbor" method. The
  tier 1 API statement was used and the tier 3 statement is recorded in the deidentification
  details.

  (11) Documentation currency. The v2.0.0 and v3.0.0 documentation pages carry the same
  "Last updated on Jun 4, 2026" stamp and the same sentence describing the release as
  containing "data from the participants of the pilot study phase", although the v2.0.0 page
  also states that version is no longer accessible and the healthsheet describes v3.0.0 as
  the third static release covering two years of collection. The documentation pages were
  therefore not relied on for release scope.

  (12) Recruitment window. The healthsheet states that recruitment pools were identified by
  screening electronic health records for all patients who had had an encounter with the
  sites' health systems "within the past 2 years"; the BMJ Open protocol defines the study
  base as all patients aged 40 or older who had a medical encounter within each health system
  site between 2020 and 2025. The tier 1 healthsheet phrasing was used for the sampled
  population and the tier 3 window is recorded here.

  (13) File and byte totals. The per-directory counts in the dataset structure metadata sum
  to 356,334 files and 3,815,969,360,064 bytes, against stated release totals of 356,343
  files and 3,815,969,779,678 bytes, a difference of nine files and roughly 420 KB. Both
  figures are carried as their sources state them; the residual is consistent with
  root-level metadata files that the per-directory inventory does not enumerate.

  Two further observations are recorded here rather than resolved. The study protocol states
  that patients with type 2 diabetes and pre-diabetes are identified by ICD-10 codes R73.09
  and E11.X respectively; that assignment is reproduced as the source states it. Blood volume
  is given as approximately 50 to 60 mL in the IRB protocol and as 53 mL in the BMJ Open
  protocol; the tier 2 range was used and contains the tier 3 point value.

