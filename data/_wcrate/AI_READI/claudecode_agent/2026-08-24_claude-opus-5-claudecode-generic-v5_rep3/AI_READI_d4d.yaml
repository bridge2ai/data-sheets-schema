conforms_to: >-
  Data are organized following the Clinical Dataset Structure (CDS) v0.1.1. Within that
  layout, electrocardiography files follow the WaveForm DataBase (WFDB) standard, clinical
  data follow the Observational Medical Outcomes Partnership (OMOP) Common Data Model,
  retinal imaging files follow Digital Imaging and Communications in Medicine (DICOM),
  wearable activity and continuous glucose monitoring files follow Open mHealth schemas, and
  environmental sensor files follow the NASA ASCII File Format Guidelines for Earth Science
  Data.
