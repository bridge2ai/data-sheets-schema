acquisition_methods:
  - acquisition_details: >-
      Directly observable data acquired at the in-person study visit: vitals, physical
      measurements (height, weight, waist and hip circumference), 12-lead ECG, monofilament
      testing, cognitive screening, vision testing, retinal imaging, and blood and urine
      collection for laboratory testing.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
  - acquisition_details: >-
      Participant-reported data acquired via self-administered questionnaires in REDCap covering
      screening/eligibility, demographics, depressive symptoms (CES-D-10), Problem Areas in
      Diabetes (PAID-5), diabetes self-care, diet, ophthalmic history, smoking, alcohol, vaping
      and marijuana use, general health history, social determinants of health (PhenX Toolkit),
      and current medications.
    was_directly_observed: false
    was_reported_by_subjects: true
    was_validated_verified: true
    notes: >-
      Verification of data entry was performed where possible, for example cross-referencing
      entered medications with medications physically brought in or photographed by each study
      participant.
  - acquisition_details: >-
      At-home device data acquired continuously over 10 days from three devices sent home with
      participants: a Dexcom G6 continuous glucose monitor, a Garmin Vivosmart 5 fitness tracker,
      and a custom LeeLab Anura home environmental sensor. Participants returned the devices by
      overnight mail or in person along with a data sheet recording which wrist the tracker was
      worn on, their dominant hand, and where the environmental sensor was placed in the home.
    was_directly_observed: true
    was_reported_by_subjects: false

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for collecting participant-reported questionnaire data and the following
      clinical data from the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results and complete blood count test results. REDCap was
      also used for the online recruitment interface, screening survey, and electronic consent.
  - mechanism_details: >-
      Retinal imaging devices: Optomed Aurora IQ handheld fundus camera (undilated, 4 images per
      participant); iCare Eidon widefield truecolor confocal fundus system (12 images);
      Heidelberg Spectralis HRA OCT and OCTA (6 images); Topcon Maestro2 3D OCT-1 (6 images);
      Topcon Triton DRI OCT (6 images); Zeiss Cirrus 5000 (8 images); Heidelberg Fluorescence
      Lifetime Imaging Ophthalmoscopy, macula-centred (2 images). Both eyes imaged on each
      participant; all retinal images collected under dilated conditions except the Optomed.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Amsterdam, The Netherlands) for the 12-lead ECG,
      exported as .xml.
  - mechanism_details: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada), exporting total score, section subscores,
      Memory Index Score and task completion times as .csv.
  - mechanism_details: >-
      Vision assessment instruments: M&S Technologies Electronic Visual Acuity tester (Niles,
      Illinois) with 2.0 neutral density filter for mesopic conditions; Mars chart (Mars
      Perceptrix, Chappaqua, New York) for letter contrast sensitivity; Topcon KR 800
      autorefractor (Topcon Healthcare, Oakland, New Jersey); lensometers including NIDEK LM-600P,
      Topcon CL-200 and Topcon CL-300.
  - mechanism_details: >-
      Blood pressure devices used across sites: OMRON HEM 907XL Blood Pressure Monitor, Medline
      MDS4001 Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series Vital Signs
      Monitor with Welch Allyn FlexiPort reusable cuff.
  - mechanism_details: >-
      Dexcom G6 Continuous Glucose Monitor (Dexcom, Inc., San Diego, California), recording blood
      glucose every 5 minutes, exported as .csv. Participants were masked to the results during
      the monitoring period.
  - mechanism_details: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland),
      sampling every 5 seconds, exported in .FIT file format and converted to the Open mHealth
      standard for the dataset. Worn on the non-dominant wrist by preference, with participants
      free to choose; battery required charging every 2-3 days, producing gaps in collection.
  - mechanism_details: >-
      Custom-designed LeeLab Anura environmental sensor built at the Karalis Johnson Retina
      Center, University of Washington (Seattle, Washington), exported as .csv. Built around the
      AS7431 spectral sensor, DS3231 precision real-time clock, and Sensirion SEN5x environmental
      node.
  - mechanism_details: >-
      Standard 10 g monofilament for peripheral neuropathy testing, with results recorded on an
      iPad, laptop, or paper questionnaire and entered into REDCap by clinical research staff.
  - mechanism_details: >-
      Clinical Laboratory Improvement Amendments-certified laboratories local to each data
      collection site performed complete blood count testing on fresh whole blood; all other
      laboratory tests were performed by the University of Washington Nutrition and Obesity
      Research Center testing facility using stored, frozen samples, provided in .csv format.
  - mechanism_details: >-
      FAIRhub, a Microsoft Azure cloud-based data management, curation and sharing platform
      developed for this project, into which all data are uploaded at regular intervals from each
      site.
  - mechanism_details: >-
      Electronic health records at each site were screened for ICD-10 diagnosis codes E11.X (type
      2 diabetes) and R73.09 (pre-diabetes) together with demographic data, in order to identify
      recruitment pools. This mechanism served recruitment rather than instance data acquisition;
      no released instance data derive from it.

data_collectors:
  - collector_details: >-
      Clinical research coordinators at each of the three data collection sites recruited,
      enrolled and collected data. All underwent training by the data manager at UAB with a
      detailed Manual of Procedures for reference, completed a certification process including
      mandatory institutional compliance training for human subject research, and were required
      to successfully administer all protocol elements to at least three volunteer practice
      subjects before enrolling and testing participants. Data managers at each site oversee the
      process.
    role: researcher
  - collector_details: >-
      Retinal imaging technicians, trained to detect certain potentially life- or
      vision-threatening conditions (retinal detachment, tumor and optic disc edema) during
      image acquisition.
    role: researcher
  - collector_details: >-
      Site data managers, responsible for quality control of all data before uploading to
      FAIRhub, and for reviewing REDCap range-check flags with clinical research coordinators.
    role: researcher
  - collector_details: >-
      Phlebotomists and laboratory assistants responsible for blood collection from research
      participants and for processing and shipping samples.
    role: researcher
  - collector_details: >-
      The central AI-READI project team — including software engineers, cloud engineers, research
      and data scientists — responsible for post-collection curation pipelines, mapping to
      standardized terminologies, and preparation for dissemination.
    role: researcher
  - collector_details: >-
      Effort was supported by NIH award OT2OD032644 based on the percentage of effort contributed,
      with salaries aligned to the funding guidelines at each site.
    role: academic_institution

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Collection period for version 3.0.0 of the dataset. The overall project timeline spans four
      years, with one year dedicated to protocol development and training and years 2-4 allocated
      to subject recruitment and data collection. Approximately 4-10% of participants are
      expected to undergo a follow-up examination in Year 4. Preliminary pilot enrollment occurred
      between 18 July 2023 and 30 November 2023; the formal data collection process began on 1
      December 2023.
    source_caveats: >-
      The tier-1 FAIRhub dataset_description gives the collected date range as
      2023-07-19/2025-05-01, while the tier-3 BMJ Open protocol publication states enrollment
      began on 18 July 2023 — a one-day discrepancy. The tier-1 FAIRhub value is used.

sampling_strategies:
  - is_sample: false
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. Participants are recruited in waves to facilitate efficient
      sampling of the study base, with the composition and size of each wave influenced by the
      observed participation characteristics of race/ethnicity, gender, severity of T2DM and site,
      according to health records. As recruitment progresses, the composition of participants is
      monitored and adjusted by under- and oversampling groups as needed. Rather than targeting
      the demographic distribution of the US population, the study is triple-balanced by
      recruiting four race/ethnic groups, four categories of T2DM severity, and biological males
      and females in approximately equal proportions.
    why_not_representative: >-
      Building balanced datasets is critical for the development of unbiased machine learning
      models, so the cohort is deliberately balanced rather than demographically representative of
      the US population. Recruitment is predominantly urban and hospital-based and may not fully
      capture all possible cultural and socioeconomic backgrounds. The cohort does not include
      other races/ethnicities such as Pacific Islanders and Native Americans.
    source_data: >-
      The study base is all patients aged 40 years or older who had a medical encounter within
      each health system site (UAB, UCSD, UW). Patients with T2DM and pre-diabetes are identified
      by screening electronic health records for ICD-10 diagnosis codes E11.X and R73.09
      respectively; patients without diabetes will not have encounters with these ICD codes.
    notes: >-
      The healthsheet states that the dataset contains all possible instances — all participants
      enrolled during the collection period — rather than a sample from a larger enrolled set, and
      answers "N/A" to the question about sampling strategy at the preprocessing stage.

raw_sources:
  - raw_data_details: >-
      Raw data are exported from devices in their proprietary or native formats to local storage:
      ECG as .xml; MoCA Duo application output as .csv; retinal imaging in each device's raw
      format (Topcon Maestro2 and Triton as .fda; Heidelberg FLIO as .sdt; others natively DICOM);
      Garmin Vivosmart 5 as .FIT; Dexcom CGM and environmental sensor as .csv; blood and urine
      testing results from the NORC laboratory as .csv. All participant images are exported from
      imaging devices in their raw format and some required conversion to DICOM prior to upload.
    notes: >-
      Raw data are saved and expected to be preserved by the AI-READI project at least for the
      duration of the project, but are not currently shared outside the project team because they
      have not been mapped to standardized terminologies and may accidentally include personal
      health information or personally identifiable information, for example in free text fields.
      There is a possibility that raw data may be included in future releases of the controlled
      access dataset.

raw_data_sources:
  - source_description: >-
      Electronic health records at the University of Alabama at Birmingham, University of
      California San Diego, and University of Washington health systems, screened for ICD-10
      diagnosis codes E11.X (type 2 diabetes) and R73.09 (pre-diabetes) and demographic data to
      identify recruitment pools.
    source_type: Electronic health record
    access_details: >-
      Not distributed with the dataset. Past health records are held under controlled access.
  - source_description: >-
      Prospective in-person study visit data captured in REDCap and from clinical instruments at
      each of the three study sites.
    source_type: Prospective clinical data collection
    raw_data_format: REDCap export, .xml, .csv
  - source_description: >-
      At-home device data from the Dexcom G6 continuous glucose monitor, Garmin Vivosmart 5
      fitness tracker, and LeeLab Anura environmental sensor, collected over 10 continuous days
      per participant.
    source_type: Wearable and environmental sensor devices
    raw_data_format: .csv, .FIT
  - source_description: >-
      Ophthalmic imaging device exports from Optomed Aurora, iCare Eidon, Heidelberg Spectralis,
      Heidelberg FLIO, Topcon Maestro2, Topcon Triton and Zeiss Cirrus.
    source_type: Ophthalmic imaging devices
    raw_data_format: DICOM, .fda, .sdt
  - source_description: >-
      Clinical laboratory results from CLIA-certified local laboratories (complete blood count)
      and from the University of Washington Nutrition and Obesity Research Center (all other
      blood, serum, plasma and urine assays).
    source_type: Clinical laboratory
    raw_data_format: .csv

preprocessing_strategies:
  - preprocessing_details: >-
      All data are mapped to applicable data standard formats where possible: the Observational
      Medical Outcomes Partnership Common Data Model for clinical data, DICOM for retinal imaging,
      WFDB for cardiac ECG, Open mHealth for wearable activity and continuous glucose monitoring
      data, and the NASA ASCII File Format Guidelines for Earth Science Data for environmental
      sensor data.
  - preprocessing_details: >-
      For some devices, data are transformed from their proprietary state into a standard model
      format prior to upload to FAIRhub. Topcon Maestro2 and Triton images exported in .fda file
      format are converted to DICOM; Heidelberg FLIO images exported in .sdt file format are
      converted to DICOM; Garmin Vivosmart 5 data exported in .FIT file format are converted to
      the Open mHealth standard.
  - preprocessing_details: >-
      The whole dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1: at the
      root level, one directory per datatype; within each datatype folder, one folder per
      modality; within each modality folder, one folder per device; within each device folder, one
      folder per participant, named after the participant's study ID number.
  - preprocessing_details: >-
      Protected Health Information as defined by the HIPAA Privacy Rule is stripped from the
      public set via the Safe Harbor method, along with information related to the sex and
      race/ethnicity of participants and medications used.
  - preprocessing_details: >-
      Processing for v3.0.0 is described in the changelog as automated plus custom, compared with
      custom/ad hoc processing for the v1.0.0 pilot release.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the time of data entry and acquisition: clinical data outside expected
      min/max ranges were flagged in REDCap and visible in reports viewed by clinical research
      coordinators and data managers. Using these reports as guides, data managers and
      coordinators examined participant records and determined if an error was likely.
  - cleaning_details: >-
      Data were checked for and edited where errors were detected on four criteria: credibility,
      based on range checks to determine if all responses fall within a prespecified reasonable
      range; incorrect flow through prescribed skip patterns; missing data that can be directly
      filled from other portions of an individual's record; and the omission and/or duplication of
      records.
  - cleaning_details: >-
      Editing was only done under the guidance and approval of the site principal investigator. If
      corrected data was available from elsewhere in the respondent's answers, the error was
      corrected. If there was no logical or appropriate way to correct the data, the site
      principal investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      The site data manager is responsible for the quality control of all data before uploading to
      FAIRhub. The dataset has been reviewed internally by AI-READI team members for quality
      checks and to ensure that no personally identifiable information was accidentally included.
      No formal external audit has been conducted.
  - cleaning_details: >-
      Data quality of the OMOP CDM instance is assessed using the OMOP CDM Data Quality Dashboard,
      which runs more than 3500 data quality checks; results are supplied in the dqd_omop.json
      metadata file in the clinical_data directory.
    used_software:
      - id: https://ohdsi.github.io/DataQualityDashboard/
        name: OMOP CDM Data Quality Dashboard
        description: >-
          Tool that runs a set of more than 3500 data quality checks against an OMOP CDM instance.
  - cleaning_details: >-
      No instances were excluded from the dataset at the time of preprocessing.

labeling_strategies:
  - labeling_details: >-
      No labeling was performed. No explicit label or target is associated with each data
      instance, as the dataset is hypothesis-agnostic and aimed at facilitating multiple potential
      downstream AI/ML applications. No formal guidelines are in place for future researchers
      creating new labels or defining new tasks.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants. In survey data, skipped questions or
      incomplete responses are expected.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In a few cases the data
      collection device had no stored results or was returned too late to retrieve the results,
      for example because the battery died or data was lost. In a few cases a data collision may
      have occurred at some point in the process and data has been lost. Improper use of
      wearables, technical failure such as battery failure or system malfunction, patient
      uncooperation during imaging, image noise, and data transfer failures are all expected
      causes. Garmin battery charging every 2-3 days produces gaps in activity monitoring.
    handling_strategy: >-
      Missing data that can be directly filled from other portions of an individual's record was
      identified and corrected during cleaning under site principal investigator approval; no
      imputation was applied and no instances were excluded.

anomalies:
  - anomaly_details: >-
      In survey data, skipped questions or incomplete responses are expected.
  - anomaly_details: >-
      In wearable data, improper use, technical failure such as battery failure or system
      malfunction are expected sources of noise and loss.
  - anomaly_details: >-
      In imaging data, patient uncooperation, noise that may obscure the images, technical failure
      such as system malfunction, and data transfer failures are expected.
  - anomaly_details: >-
      Optomed Aurora images are taken undilated with a handheld camera, so image quality varies
      from patient to patient and within the same patient.
  - anomaly_details: >-
      FLIO imaging is performed last in the visit and exposes participants to uncomfortable levels
      of light, so participants may not be at their best possible compliance. The FLIO device is
      very sensitive and cannot tolerate more than 1 centimeter of movement during acquisition;
      unwanted signals such as background light or lens fluorescence cannot simply be subtracted
      because they share the same Poisson distribution as the useful data.
  - anomaly_details: >-
      Heidelberg Spectralis imaging is operator-driven rather than fully automated, so quality
      issues may arise, which may lead to skipping this modality and missing data.
  - anomaly_details: >-
      The Snellen visual acuity variables were dropped in this version of the dataset, so only
      logMAR visual acuity measurements are available.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      While AI-READI ultimately aims to achieve balance across race/ethnicity, biological sex, and
      diabetes presence and severity, this release is not balanced across these parameters, as
      enrollment is ongoing.
    scope_impact: >-
      Periodic updates to data releases may not have achieved balanced distribution across groups.
    recommended_mitigation: >-
      Use the recommended train/validation/test split, in which the validation and test sets are
      balanced as well as possible for sex, race/ethnicity and diabetes status.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The study cohort does not include other races/ethnicities such as Pacific Islanders and
      Native Americans, so it may not provide a comprehensive representation of the population.
    scope_impact: >-
      Models derived from the dataset may not generalize to populations not represented.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Recruitment was predominantly urban and hospital-based, which may not fully capture all
      possible cultural and socioeconomic backgrounds.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility required participants to be able to speak and read English, which may have
      created challenges in recruiting Hispanic and/or Asian persons.
  - limitation_type: scope_limitation
    limitation_description: >-
      Pregnancy, gestational diabetes and type 1 diabetes are exclusionary; participants must be
      40 years or older, so the dataset says nothing about younger populations or those groups.
  - limitation_type: temporal_limitation
    limitation_description: >-
      This release is cross-sectional with only one visit per participant, so it does not support
      within-participant longitudinal analysis. A longitudinal arm inviting approximately 10% of
      the cohort back in year 4 is planned but not included here.
  - limitation_type: coverage_limitation
    limitation_description: >-
      A limitation of the biorepository is that there are a finite number of samples to share with
      scientists interested in using them in research.
    recommended_mitigation: >-
      Procedures for reviewing and prioritizing written requests will be developed before the
      biorepository is complete.
  - limitation_type: integration_limitation
    limitation_description: >-
      Sex, race, ethnicity, medications, 5-digit zip code, genetic sequencing data, past health
      records and traffic and accident reports are withheld from the public release and require a
      data use agreement, limiting fairness and subgroup analyses on the public set alone.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers; therefore there is selection bias known as volunteer bias which
      may limit the generalizability of the results among those who are not represented in the
      study population.
  - bias_type: sampling_bias
    bias_description: >-
      Recruitment was predominantly urban and hospital-based, drawn from patients with a medical
      encounter within the three health systems, which may not capture the wider population.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic variability across the
      United States and to ensure representation across various racial and ethnic groups.
      Individuals from all demographic backgrounds were recruited at all three sites. Uniform data
      collection protocols were implemented for all subjects irrespective of race/ethnicity,
      biological sex, or diabetes severity, across all study sites.
  - bias_type: representation_bias
    bias_description: >-
      Recruiting Black men into health research is more difficult than recruiting other
      populations, yet this population represents a disproportionate percentage of burden in
      T2DM; factors such as medical mistrust and fear of safety stem from historical events such
      as the Tuskegee syphilis study.
    affected_subsets:
      - Black participants
    mitigation_strategy: >-
      If sample balancing on race/ethnicity emerges as a challenge, new recruitment strategies
      will be implemented to overcome the imbalance, drawing on identified approaches such as
      tailoring printed materials and using a personalized, participatory approach to recruitment.
  - bias_type: representation_bias
    bias_description: >-
      Trends for under-recruitment in health research and for disproportionate T2DM disease burden
      have also been reported for Hispanic persons.
    affected_subsets:
      - Hispanic participants
    mitigation_strategy: >-
      New recruitment strategies will be implemented if sample balancing on race/ethnicity emerges
      as a challenge. The requirement that eligible participants speak, read and understand
      English may itself have created challenges in recruiting Hispanic persons.
  - bias_type: representation_bias
    bias_description: >-
      Trends for under-recruitment in health research and for disproportionate T2DM disease burden
      have also been reported for Asian persons.
    affected_subsets:
      - Asian participants
    mitigation_strategy: >-
      New recruitment strategies will be implemented if sample balancing on race/ethnicity emerges
      as a challenge. The requirement that eligible participants speak, read and understand
      English may itself have created challenges in recruiting Asian persons.
  - bias_type: measurement_bias
    bias_description: >-
      Multiple imaging device makes and models were used for the same measure, and some modalities
      are operator-driven while others are fully automated, introducing device- and
      operator-dependent variation in image quality.
    mitigation_strategy: >-
      Information on device make and model, including specific modalities such as macula scans or
      wide scans during OCT, was documented to ensure repeatability. The study deliberately
      included multiple devices for one measure to enhance generalizability and represent the
      broad range of equipment utilized in clinical settings.

content_warnings:
  - content_warnings_present: false
    warnings:
      - >-
        The dataset does not contain data that, if viewed directly, might be offensive, insulting,
        threatening, or otherwise pose a safety risk such as psychological safety or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The dataset does not contain data that might be considered confidential in the sense of
      legal privilege, doctor-patient confidentiality, or non-public communications. No personally
      identifiable information is included in the released dataset.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      In the publicly accessible tier of the dataset, no data considered sensitive are present:
      information related to sex and race/ethnicity, and medications used, has been removed, along
      with all Protected Health Information as defined by the HIPAA Privacy Rule.
  - sensitive_elements_present: true
    sensitivity_details: >-
      In the controlled access tier of the dataset, sensitive data are present: racial and ethnic
      origins, sex, location (5-digit zip code), genetic sequencing data, past health records,
      medications, and motor vehicle traffic and accident reports.

is_deidentified:
  identifiable_elements_present: true
  method: >-
    HIPAA Safe Harbor for the public tier. The public set is stripped of Protected Health
    Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, as well as
    information related to the sex and race/ethnicity of the participants and medications used, to
    prevent stigmatization of findings.
  identifiers_removed: >-
    From the public tier: all Protected Health Information per the HIPAA Safe Harbor method, plus
    sex, race/ethnicity and medication information. The controlled access tier retains 5-digit zip
    code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and
    traffic and accident reports.
  deidentification_details: >-
    The FAIRhub dataset_description records the de-identification type as "NoDeIdentification"
    with the explanation that no identifiers were collected so no active de-identification was
    necessary, but the team checked that no identifiable data per US HIPAA were present in the
    data. deIdentDirect and deIdentHIPAA are recorded as true; deIdentDates, deIdentNonarr and
    deIdentKAnon as false. The RO-Crate records the dataset as deidentified. To prevent
    re-identification attempts, the project implements a robust data dissemination system, a
    strict license agreement, and static data watermarking of both public and controlled sets.
    Participants are identified in the dataset only by a study participant ID number used as the
    folder name in each device directory. Access requires login through a verified ID system and
    self-attestation; licensees must comply with NIH Genomic Data Sharing Policy security best
    practices and must store data only on institution-maintained servers or BAA-covered cloud
    services. The environmental sensor and Garmin fitness tracker were specifically chosen with
    participant privacy as a primary concern: they do not capture video or audio, are not equipped
    with GPS location monitoring, and are not synced with participant-owned devices. There is a
    theoretical risk of future re-identification, since AI algorithms can infer individual patient
    characteristics; licensees are prohibited from using the Data, alone or in concert with other
    information, to attempt to identify or contact any Data Subject, to extract or extrapolate
    identifying information, or to establish a Data Subject's membership in a particular group.
    The identifiable_elements_present flag above is set true because the dataset as a whole
    includes the controlled access tier, which retains 5-digit zip code, genetic sequencing data,
    race/ethnicity and motor vehicle records; for the public tier alone the corresponding value
    would be false.
  source_caveats: >-
    The healthsheet leaves the de-identification measures question blank; the substance above is
    drawn from the tier-1 FAIRhub dataset_description, the tier-1 RO-Crate, and the tier-3 Nature
    Metabolism comment describing the Safe Harbor method.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      University of Washington IRB approval number STUDY00016228, initially approved 20 December
      2022.
    - >-
      Reliance agreements with the IRBs of the University of Alabama at Birmingham and the
      University of California, San Diego.
    - >-
      Annual renewal application about the status and progress of the study is required and due
      within 90 days of expiration.
  ethics_review_board: >-
    Washington University IRB (per RO-Crate); Institutional Review Board of the University of
    Washington (per BMJ Open protocol and IRB protocol document), IRB Reliance Team contactable at
    hsdrely@uw.edu, Human Subjects Division, University of Washington, 4333 Brooklyn Ave NE Box
    359470, Seattle, WA 98195-9470, US.
  regulatory_compliance:
    - "Not FDA-regulated: isFDARegulatedDrug No; isFDARegulatedDevice No."
    - "Human subject review status: submitted, approved."
    - "Oversight has Data Monitoring Committee: No."
    - >-
      Licensees must comply with all data security and privacy standards established by the NIH
      under its Genomic Data Sharing Policy.
    - "ClinicalTrials.gov registration identifier NCT06002048."
  special_populations:
    - Pregnancy and gestational diabetes are exclusionary.
    - Type 1 diabetes is exclusionary.
    - >-
      Participants must be 40 years or older, so no minors are enrolled; the FAIRhub study
      description records a maximum age of 85 years.
    - The IRB protocol records that prisoners are not a target population.
  source_caveats: >-
    The RO-Crate names the reviewing body "Washington University IRB" while giving a University of
    Washington Human Subjects Division address and contact; the tier-2 IRB protocol document and
    tier-3 BMJ Open publication both name the University of Washington IRB. Both forms are
    recorded.

ethical_reviews:
  - reviewing_organization: Washington University IRB / University of Washington Institutional Review Board
    review_details: >-
      IRB protocol STUDY00016228. Initial approval received 20 December 2022, with reliance
      agreements covering the University of Alabama at Birmingham and the University of
      California, San Diego, which used the same consent form with minor institution-specific
      language. An annual renewal application is required within 90 days of expiration. The
      initial approval letter is published in the v3.0.0 documentation.
    contact_person: IRB Reliance Team, Human Subjects Division, University of Washington
    notes: >-
      Contact point for IRB reliance matters: hsdrely@uw.edu. Address: Human Subjects Division,
      University of Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, US.
  - reviewing_organization: AI-READI ethics and ELSI reviewers
    review_details: >-
      Ethical review named in the RO-Crate metadata as conducted by Camille Nebeker, Debra
      Mathews, Kadija Ferryman and Nicholas Evans. Ethical, legal and social implications are
      considered at every stage of the project cycle, with guidance from bioethicists.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      A Community Advisory Board of 11 persons from the three sites, including diversity in race
      and ethnicity as represented in the AI-READI sample, contributes to the development of the
      protocol and evaluated the consent forms and research protocols, with feedback considered in
      protocol modifications.
  - reviewing_organization: Native Biodata Consortium
    review_details: >-
      Engagement with the Native Biodata Consortium provides a co-learning opportunity for
      understanding challenges specific to American Indian and Alaska Native communities and
      evaluating tools for addressing them, such as data usage agreements, contract negotiations,
      transparent access agreements, and forms of assured return of benefit and sustainable input,
      control and monitoring of Tribal data. The project also planned a tribal consultation to
      address barriers and facilitators of participation.

informed_consent:
  - consent_obtained: true
    consent_type: Written informed consent, obtained electronically (e-consent) or in person
    consent_scope: >-
      Informed consent to participate was required before participation in any part of the
      protocol, including questionnaires. The public version of the dataset can only be used for
      type 2 diabetes related research; a private version will allow for more generic use.
    consent_documentation: >-
      The approved consent form for the principal project site, University of Washington, is
      published in the v3.0.0 documentation. The other clinical sites had IRB reliance and used
      the same consent form, with minor institution-specific language incorporated depending on
      individual institutional requirements. Electronic consent was administered through REDCap;
      signed e-consent forms were automatically emailed to subjects, with additional copies
      available from the study coordinator for the duration of the study.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset.
      This is clearly communicated in the consent document.
    notes: >-
      The FAIRhub dataset_description records consentType as
      "ConsentSpecifiedNotElsewhereCategorised" with consentNoncommercial, consentGeogRestrict,
      consentResearchType, consentGeneticOnly and consentNoMethods all false. Potential
      participants could read all consent documentation electronically before their visit and give
      consent with an electronic signature without verbal communication with a clinical research
      coordinator, or request a call back or video conference; if they did not consent
      electronically, consent was performed in person at the start of the visit. Those without
      internet access could call research staff for alternative methods of enrolment. Each
      individual was aware of the data collection, as this was active collection directly from
      participants rather than passive collection or secondary use of existing data; individuals
      in each recruitment pool were mailed a personalized hardcopy invitation letter and sent an
      invitation email directing them into the online REDCap recruitment interface, where they
      could read an overview of the research program, expectations for participation and answers
      to Frequently Asked Questions. Participants received a $200 stipend for the study visit,
      provided through the NIH grant funding and paid after receipt of final data and return of
      the study devices, typically at least two weeks after the visit and not prorated; reasonable
      parking, public transit or rideshare costs related to the visit were also covered, and
      rideshare transportation assistance was offered to participants reporting barriers to
      attending. This notes field carries participant-notification, consent-process and
      compensation facts for which the core schema declares no separate slot.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      Pregnancy and gestational diabetes are exclusionary criteria, so pregnant women are not
      enrolled.
    - >-
      All participants are adults aged 40 or older, so no minors are enrolled and no parental
      permission or child assent procedures apply.
    - The IRB protocol records that prisoners are not a target population.
    - Participants must be able to provide consent.
  notes: >-
    American Indians and Alaska Natives are described in the Nature Metabolism comment as unique
    and highly identifiable groups that could benefit from precision health AI studies, and the
    project engages with the Native Biodata Consortium as a co-learning opportunity for
    understanding challenges specific to these communities. Native American participants are not
    among the four race/ethnicity groups recruited in this release, so this engagement concerns a
    group not enrolled and does not bear on the at_risk_groups_included flag above.

data_governance:
  committee_name: Data Access Committee
  accountable_organization:
    id: https://ror.org/01yc7t268
    name: Washington University in St. Louis
    description: >-
      Managing organization of the dataset per the FAIRhub dataset_description, lead sponsor of
      the study, and Licensor under the AI-READI Data License Agreement.
  access_review_process: >-
    Accessing the dataset requires several steps: logging in through a verified ID system;
    agreeing to use the data only for type 2 diabetes related research; and agreeing to the
    license terms, which set restrictions and obligations for data usage. Access type is recorded
    as PublicDownloadSelfAttestationRequired. The controlled access dataset requires the
    requester's institution to have completed legal and privacy use agreements — a data use
    agreement — with the AI-READI research program. Requirements for controlled access data sets
    are being developed by the Data Access Committee. Access conditions are published at
    https://fairhub.io/datasets/3/access.
  committee_contact: Aaron Y. Lee
  stewardship_roles:
    - The AI-READI team supports and maintains the dataset.
    - The RO-Crate names the AI-READI Consortium as the data governance committee.
    - >-
      The data manager at each site is responsible for quality control of all data before
      uploading to FAIRhub.
    - The dataset is hosted on FAIRhub through Microsoft Azure.
  notes: >-
    For American Indian and Alaska Native data, the project's engagement with the Native Biodata
    Consortium evaluates tools including data usage agreements, contract negotiations, transparent
    access agreements, and forms of assured return of benefit and sustainable input, control and
    monitoring of Tribal data. Committee contact Aaron Y. Lee, ORCID
    https://orcid.org/0000-0002-7452-1648: central contact for the study, MD, reachable at
    contact@aireadi.org. General project contact is also available at https://aireadi.org/contact
    and https://docs.aireadi.org/docs/3/contact.

license_and_use_terms:
  license_terms: >-
    AI-READI Data License Agreement (Version 2.0), a custom license from Washington University in
    St. Louis, available at https://doi.org/10.5281/zenodo.17555036. It grants a non-exclusive,
    non-transferable license to download, reproduce and use the Data and create derivative works
    for research, commercial and non-commercial purposes, subject to restrictions on data sharing,
    storage, interaction with third-party models, publication, and use. The license was
    specifically tailored to enable reuse of the AI-READI dataset for commercial or research
    purposes while putting strong requirements around data usage, security, and secondary sharing
    to protect study participants, especially when data is reused for AI and ML applications.
  data_use_permission: disease_specific_research
  contact_person: Aaron Y. Lee
  notes: >-
    Key obligations: use only for type 2 diabetes related research for the public set;
    acknowledgement and citation per docs.aireadi.org; compliance with NIH Genomic Data Sharing
    Policy security best practices; no removal of watermarking; derivative and synthetic data
    derived from the Data are themselves treated as Data subject to all restrictions; data may be
    reproduced in papers only as small representative samples in up to five images or figures per
    paper. The license terminates automatically upon any breach, after which the licensee must
    delete all copies and cease all use. An earlier license version is recorded at
    https://doi.org/10.5281/zenodo.10642459. Contact person Aaron Y. Lee, ORCID
    https://orcid.org/0000-0002-7452-1648: central study contact, reachable at contact@aireadi.org.
    General project contact is also available at https://aireadi.org/contact.

ip_restrictions:
  restrictions:
    - >-
      Title to the Data, and all industrial and intellectual property rights therein, remain
      solely and exclusively with the Licensor (Washington University in St. Louis) and its
      suppliers; the licensee must not take any action inconsistent with such ownership.
    - Any rights not expressly granted in the license are reserved to the Licensor and its suppliers.
    - >-
      No third parties have imposed additional IP-based or other restrictions on the data
      associated with the instances beyond the license itself.
    - >-
      Licensees may make, reproduce and distribute Licensee Models developed, trained or adapted
      using the Data provided those models do not themselves contain the Data or a modified
      version of it.

regulatory_restrictions:
  regulatory_restrictions:
    - >-
      Export controls and other regulatory restrictions are governed by the license at
      https://doi.org/10.5281/zenodo.17555036, which requires licensees to comply with all
      applicable laws, regulations and restrictions relating to the distribution and use of the
      Data and Models.
    - >-
      Licensees must comply with all data security and privacy standards established by the U.S.
      National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH
      Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
    - >-
      Data may only be stored on servers and devices maintained by and located within the
      licensee's institution, or on cloud or remote storage and backup services that have a
      HIPAA-approved Business Associate Agreement in place with that institution.
  hipaa_compliant: not_applicable
  confidentiality_level: restricted
  other_compliance: >-
    The dataset is not FDA-regulated. The RO-Crate records the confidentiality level as HL7:2N
    (normal).
  governance_committee_contact: Aaron Y. Lee
  notes: >-
    Governance committee contact Aaron Y. Lee, ORCID https://orcid.org/0000-0002-7452-1648:
    central study contact, reachable at contact@aireadi.org.
  source_caveats: >-
    No source in the bundle asserts HIPAA compliance as a status for the dataset. The FAIRhub
    dataset_description states only that the team "checked that no identifiable data per US HIPAA
    were present in the data" and the Nature Metabolism comment states that the public set is
    stripped of PHI via the Safe Harbor method; the released public data are therefore not PHI and
    HIPAA does not attach to them, so hipaa_compliant is recorded as not_applicable rather than
    compliant. For confidentiality_level, the tier-1 FAIRhub accessType is
    PublicDownloadSelfAttestationRequired and the tier-1 RO-Crate confidentialityLevel is HL7:2N
    (normal), neither of which maps directly onto the permitted enum; "restricted" is chosen
    because access requires verified login, a disease-specific use restriction and license assent,
    and because a separate controlled-access tier exists, but this is an interpretation rather
    than a stated value.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for retinal FLIO, OCT, OCTA and photography directories. Listed in the FAIRhub
      dataset_description format array.
  - format: CSV
    media_type: text/csv
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for clinical data mapped one-to-one to OMOP CDM tables, and for environmental sensor
      data. Listed in the FAIRhub dataset_description format array.
  - format: JSON
    media_type: application/json
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for Open mHealth wearable activity and continuous glucose monitoring data, and for
      root-level metadata files such as dataset_description.json,
      dataset_structure_description.json, participants.json and study_description.json. Listed in
      the FAIRhub dataset_description format array.
  - format: Markdown
    media_type: text/markdown
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for root-level documentation files: CHANGELOG.md, healthsheet.md and README.md. Listed
      in the FAIRhub dataset_description format array.
  - format: TSV
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the per-directory manifest.tsv metadata files and the root participants.tsv file
      containing the recommended splits. Evidenced in the dataset structure description rather
      than the FAIRhub format array.
  - format: WFDB
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      WaveForm DataBase format files for the cardiac ECG directory. Evidenced in the dataset
      structure description rather than the FAIRhub format array.

