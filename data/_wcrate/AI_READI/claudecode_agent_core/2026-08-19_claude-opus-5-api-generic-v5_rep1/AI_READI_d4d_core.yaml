notes: >-
  Recommended citation: AI-READI Consortium. (2025). Flagship Dataset of Type 2 Diabetes from the
  AI-READI Project (3.0.0) [Data set]. FAIRhub. https://doi.org/10.60775/fairhub.3. The FAIRhub
  dataset_description metadata records datasetDeIdentLevel.deIdentType as "NoDeIdentification"
  with deIdentDirect and deIdentHIPAA both true, explained as: no identifiers were collected so no
  active de-identification was necessary, but the team checked that no identifiable data per US
  HIPAA were present. The dataset is statically watermarked to identify the licensee for security
  purposes. The FAIRhub API records a viewCount of 24636 for version 3.0.0 and 0 recorded
  citations. The dataset defines three access tiers: a publicly accessible set; a controlled
  access set containing all public data plus 5-digit zip code, sex, race, ethnicity, genetic
  sequencing data, past health records, medications and traffic and accident reports; and a
  smaller "mini" subset available for pipeline development, recorded in the FAIRhub API as a child
  record with identifier 4. A recommended train/validation/test split of 70%/15%/15%
  (1576/352/352) is supplied in participants.tsv, with validation and test sets balanced as far as
  possible for sex, race/ethnicity and diabetes status. Per-stratum split counts — validation:
  Hispanic 88, Asian 88, Black 88, White 88; male 176, female 176; no diabetes 88, lifestyle 88,
  oral 109, insulin 67; mean age 60.3 ± 10.8 years. Test: Hispanic 88, Asian 88, Black 88, White
  88; male 176, female 176; no diabetes 88, lifestyle 88, oral 90, insulin 86; mean age 60.5 ±
  11.4 years. Training: Hispanic 204, Asian 369, Black 343, White 660; male 599, female 977; no
  diabetes 600, lifestyle 384, oral 487, insulin 105; mean age 61.1 ± 11.3 years. All instances
  are part of the same prospective data generation project, with one visit per participant. The
  dataset is distributed and available for public use through the FAIRhub platform subject to
  verified login, a type 2 diabetes research use restriction and license assent; onward sharing by
  licensees is confined to other licensees bound by an identical agreement with the Licensor and
  only for collaboration on projects involving the Data.
source_caveats: >-
  Participant enrollment targets differ across sources of different rank. The tier-1 FAIRhub API
  study_description gives an anticipated enrollment of 4000 with a maximum age of 85 years; the
  tier-3 BMJ Open protocol publication also states 4000. The tier-2 IRB protocol is internally
  inconsistent, stating a target of 4600 participants in its participants section (question 2.1)
  while its objectives section (question 1.5) describes collecting "a cross-sectional dataset of
  4,000 people". The tier-1 figure of 4000 is preferred here. The tier-1 FAIRhub
  study_description gives an actual study start date of 2023-07-19 and anticipated completion of
  2027-01-01, while the tier-3 BMJ publication states enrollment began 18 July 2023 and continues
  until 30 November 2026; tier-1 values are preferred. The project acronym is expanded as
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights" in the tier-3
  publications and as "AI Ready and Exploratory Atlas for Diabetes Insights" in the tier-1
  FAIRhub study_description and tier-4 NIH RePORTER page; the tier-1 form is used for the study
  title. The healthsheet states the collection period covers "up through the end of the second
  year of the study," while the README changelog table describes v3.0.0 as containing year 2 and
  year 3 data; both agree on the date range July 19, 2023 to May 1, 2025. The tier-1 FAIRhub
  study_description and RO-Crate name Washington University in St. Louis as lead sponsor,
  managing organization and licensor, while the tier-2 IRB protocol and tier-3 BMJ publication
  identify the University of Washington IRB (STUDY00016228) as the reviewing board and the
  principal investigator's affiliation as the University of Washington; the RO-Crate itself gives
  the principal investigator as "Aaron Lee, Department of Ophthalmology, University of
  Washington." Both are recorded where relevant. The tier-2 IRB protocol states participant
  compensation as $200; no tier-1 source contradicts this. No creation date distinct from the
  publication date of 2025-11-17 is stated for this version in any source, so created_on is
  omitted.

