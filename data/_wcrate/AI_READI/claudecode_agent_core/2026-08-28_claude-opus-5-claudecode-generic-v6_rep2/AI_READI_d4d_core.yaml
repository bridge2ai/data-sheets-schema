title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: 'AI-READI is a dataset of data collected from individuals with and without type
  2 diabetes mellitus (T2DM), harmonized across three data collection sites. Version 3.0.0
  contains data from 2280 participants collected between July 19, 2023 and May 1, 2025 and
  holds no protected health information; information related to the sex and race/ethnicity
  of the participants, and to medications used, has been removed from this release. The composition
  of the dataset was designed with future studies using AI and machine learning in mind: recruitment
  sampling procedures aimed at an approximately equal distribution of participants across
  diabetes severity, and a data acquisition protocol spanning multiple domains (survey data,
  physical measurements, clinical data, imaging data and wearable device data) intended to
  enable downstream AI/ML analyses that would not be feasible with existing sources such as
  claims or electronic health record data. The stated goal is a better understanding of salutogenesis,
  the pathway from disease to health, in T2DM. The release comprises 356,343 files totaling
  approximately 3.82 TB, organized under the Clinical Dataset Structure (CDS) v0.1.1 into
  nine datatype directories.'
source_caveats: 'Sources in the bundle disagree on how the AI-READI acronym expands. The tier-1
  sources (the FAIRhub v3 API record, including its embedded healthsheet, README and study
  description, and the RO-Crate metadata) read "Artificial Intelligence Ready and Exploratory
  Atlas for Diabetes Insights"; the tier-3 publications (BMJ Open protocol, Nature Metabolism
  comment) read "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights".
  The manifest ranks the tier-1 sources higher, so this record uses "Exploratory" where it
  names the expansion. Sources also disagree on the lead investigator''s affiliation. The
  FAIRhub study description (tier 1) gives Aaron Lee''s affiliation, the lead sponsor and
  the managing organization as Washington University in St. Louis (ROR 01yc7t268); the RO-Crate
  (also tier 1) gives "Aaron Lee, Department of Ophthalmology, University of Washington",
  and NIH RePORTER (tier 4) records the awardee organization as UNIVERSITY OF WASHINGTON.
  The two tier-1 sources share a rank, so the ranking cannot decide; both affiliations are
  recorded on that creator rather than one being selected. The same disagreement runs through
  the ethics reviewer name: the RO-Crate names the board "Washington University IRB" while
  giving the University of Washington Human Subjects Division address and a uw.edu contact.
  Target enrollment is given as 4000 by the FAIRhub study description (tier 1) and by the
  BMJ Open protocol (tier 3), and as 4600 by the IRB protocol (tier 2); the tier-1 figure
  of 4000 is stated here. The realized count in this release, 2280, is consistent across every
  source that gives it. Blood volume drawn per visit is given as 53 mL by the BMJ Open protocol
  (tier 3) and as 50-60 mL by the IRB protocol (tier 2); the tier-2 range is stated here.
  Collection start is given as 18 July 2023 by the BMJ Open protocol (tier 3) and as 2023-07-19
  by the FAIRhub study description (tier 1); the tier-1 date is used. The bundle''s two tier-1
  sources also name different publishers - the FAIRhub API gives "FAIRhub", the RO-Crate gives
  "AI-READI Consortium". Because the ranking cannot separate them and the slot admits one
  value, `publisher` is left unset rather than one being chosen. The RO-Crate decomposes this
  release into nine sub-crates with ARK identifiers (ark:59853/rocrate-b2ai-ai-readi-ecg and
  its siblings) that correspond one-to-one with the nine datatype directories the FAIRhub
  structure description lists. They are the same nine parts described by two sources, so they
  are recorded once, as `file_collections`, using the FAIRhub view because it carries file
  counts and byte sizes; the crate''s ARK identifiers are recorded under `external_resources`.
  The IRB protocol source is an unfilled University of Washington Human Subjects Division
  application form for its first two thirds; the study''s own answers begin only part way
  through the document. Nothing was taken from the form''s instructions, worked examples (which
  mention acupuncture and MRI gadolinium agents) or question text. The RO-Crate states a confidentiality
  level of "HL7:2N (normal)". The schema''s ConfidentialityLevelEnum offers unrestricted,
  restricted and confidential, none of which the source''s HL7 value maps onto without interpretation,
  so `regulatory_restrictions.confidentiality_level` is left unset.'
