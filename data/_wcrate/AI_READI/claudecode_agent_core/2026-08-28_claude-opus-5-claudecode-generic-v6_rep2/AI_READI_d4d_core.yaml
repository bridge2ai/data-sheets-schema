purposes:
- name: AI/ML research into type 2 diabetes salutogenesis
  response: To enable future generations of artificial intelligence and machine learning (AI/ML)
    research to provide critical insights into type 2 diabetes mellitus (T2DM), including
    salutogenic pathways to return to health. T2DM is a growing public health threat, yet
    the current understanding of it, especially in the context of salutogenesis, is limited.
    Given the complexity of T2DM, AI-based approaches may improve understanding, but a key
    issue is the lack of data ready for training AI models; the AI-READI dataset is intended
    to fill that gap.
- name: Establish standards and best practices for AI-ready data
  response: To establish standards, best practices and guidelines for the collection, preparation
    and sharing of data for the purposes of AI/ML, including guidance from bioethicists, and
    to follow the Findable, Accessible, Interoperable, Reusable (FAIR) principles so that
    the effort can serve as a model for future medical and health datasets targeted at AI/ML.
- name: Share a blueprint for future data-generating projects
  response: To share a blueprint for collecting and sharing AI-ready datasets so that future
    Data Generation Projects can follow it, including guidelines for project management as
    well as for data collection, management and sharing.
tasks:
- name: Pseudotime manifold analysis of disease trajectories
  response: Data collection was specifically designed to permit downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories by collecting and learning
    from complex, multimodal data from participants with differing disease severity, from
    normal to insulin-dependent T2DM.
- name: Defining disease trajectories and genetic links across racial and ethnic cohorts
  response: To allow future creation of AI/ML algorithms aimed at defining disease trajectories
    and underlying genetic links in different racial and ethnic cohorts.
addressing_gaps:
- name: Lack of AI-ready multimodal datasets in T2DM
  response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large and inclusive
    multimodal datasets. A major barrier has been the absence of diverse datasets that are
    AI ready for training AI models.
- name: Under-representation of racial and ethnic groups in prior T2DM research
  response: A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated
    that samples lacked racial and ethnic diversity. The cohort is designed to be approximately
    balanced with respect to Asian, black, Hispanic and white participants, a demographic
    improvement over many previous epidemiological studies and clinical trials on T2DM.
- name: Limited understanding of salutogenesis
  response: Salutogenesis here refers to the pathway from T2DM to health, the opposite of
    studying how healthy people proceed through pathogenesis resulting in T2DM. The long-term
    objective is a foundational dataset in T2DM, agnostic to existing classification criteria
    or biases, that can be used to reconstruct a temporal atlas of T2DM development and reversal
    towards health.
- name: Home environment overlooked in environmental health research
  response: Research indicates that environmental factors play a significant role in health
    outcomes, yet most such studies have focused on outdoor conditions at a broad city or
    regional scale and overlook the individual's home environment.
