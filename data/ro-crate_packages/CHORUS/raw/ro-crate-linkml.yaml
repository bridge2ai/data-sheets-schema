known_biases:
- description: "\u2022\tReferral bias from tertiary/quaternary academic centers\n\u2022\
    \tSocioeconomic and demographic distribution reflective of participating institutions\n\
    \u2022\tDocumentation bias in clinical notes\n\u2022\tMissingness not at random\
    \ (MNAR) in laboratory, waveform, and imaging acquisition\n\u2022\tDifferential\
    \ care pathways affecting label assignment (e.g., ICU vs non-ICU populations)\n\
    \u2022\tTemporal trends related to evolving clinical practice\nBias assessment\
    \ is ongoing and documented in dataset release notes\n"
known_limitations:
- description: "\u2022\tObservational data; and not randomized; collected as real-world\
    \ clinical data, not through prospective research interactions with patient.\n\
    \u2022\tDocumentation quality dependent on routine clinical workflows and data\
    \ elements being collected in clinical practice.\n\u2022\tVariable sampling rates\
    \ across real-world data from hospital waveform systems and middleware\n\u2022\
    \tInstitutional heterogeneity in coding and clinical data collection practices\n\
    \u2022\tLimited generalizability beyond participating hospitals\n\u2022\tNot appropriate\
    \ for re-identification, contact tracing, or patient-level intervention\n\u2022\
    \tHold-out splits are available for testing; training and validation in development\
    \ splits require internal mechanisms to avoid overfitting\n"
