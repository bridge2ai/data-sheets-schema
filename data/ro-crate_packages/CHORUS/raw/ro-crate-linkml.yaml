citation: 'The CHoRUS for Clinical Care AI Network. The Bridge2AI CHoRUS for Clinical
  Care AI Dataset: A Multi-Center, Multi-Modal, High-Resolution Critical Care Dataset,
  version 1.0 Beta. Harvard Dataverse, Apr. 2026.'
collection_mechanisms:
- description: "Data are derived from routine clinical care at participating hospitals\
    \ under IRB oversight. Collection includes:\n\u2022\tElectronic health record\
    \ extraction and transformation to OMOP common data model\n\u2022\tImaging metadata\
    \ de-identification using RSNA Clinical Trial Processor and pixel-level de-identification\
    \ using IbisWorks EICON. \n\u2022\tHigh-resolution physiologic waveform capture\
    \ extraction and transformation to the WFDB standard, \n\u2022\tStandardized harmonization\
    \ to common data model\nEthical safeguards include:\n\u2022\tIRB approval or waiver\
    \ as appropriate\n\u2022\tCompliance with CHoRUS governance\n\u2022\tLayered privacy\
    \ protection including de-identification, data use agreement, controlled access\
    \ data repository with adherence to NIST 800-53 principles, audit-level protection,\
    \ registration, role-based access controls, protection against data exfiltration.\n\
    Data are not collected solely for research but repurposed from clinical workflows\
    \ under ethical oversight.\n"
