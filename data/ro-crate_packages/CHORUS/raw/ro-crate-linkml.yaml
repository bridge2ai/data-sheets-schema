sensitive_elements:
- description: CHoRUS operates within a secure enclave environment aligned with NIST
    800-53 controls.
- description: De-identification consistent with HIPAA Safe Harbor
- description: Removal or tokenization of direct identifiers
- description: Date shifting or limited date fields when required
- description: Role-based access control (RBAC)
- description: Multi-factor authentication
- description: Full audit logging of data access and queries
- description: Prohibition of re-identification attempts
- description: Data export restrictions and output review procedures to reduce risk
    of re-identification
- description: Re-identification risk is periodically assessed and mitigation strategies
    updated as needed.
