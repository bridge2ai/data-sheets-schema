discouraged_uses:
- description: These laboratory data are not to be used in clinical decision-making
    or in any context involving patient care without appropriate regulatory oversight
    and approval.
prohibited_uses:
- description: These laboratory data are not to be used in clinical decision-making
    or in any context involving patient care without appropriate regulatory oversight
    and approval.
known_biases:
- description: Data in this release was derived from commercially available de-identified
    human cell lines, and does not represent all biological variants which may be
    seen in the population at large.
known_limitations:
- description: This is an interim release. It does not contain predicted cell maps,
    which will be added in future releases. The current release is most suitable for
    bioinformatics analysis of the individual datasets. Requires domain expertise
    for meaningful analysis.
updates:
  description: Dataset will be regularly updated and augmented on a quarterly basis
    through the end of the project (November, 2026). Long term preservation in the
    https://dataverse.lib.virginia.edu/, supported by committed institutional funds.
regulatory_restrictions:
  description: Attribution is required to the copyright holders and the authors. Any
    publications referencing this data or derived data products should cite the Related
    Publications below, as well as directly citing this data collection.
acquisition_methods:
- description: 'Data collection processes are generally described in Clark T et al.
    (2024) "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture
    from Disease-Relevant Cell Lines" bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311.
    Additional data collection details will be subsequently published once finalized. '
collection_mechanisms:
- description: 'Data collection processes are generally described in Clark T et al.
