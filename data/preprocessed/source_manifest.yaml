        express_as: related_datasets

# Which source wins when two of them state different things (Harry, 2026-08-17).
#
# Before this the uniform rule said only to represent a disagreement, and a
# record following it wrote: "No instance count is asserted because the two
# sources give different figures (over 45,000 and 50,000) for the same released
# dataset and **the bundle offers no basis for preferring one**." That last
# clause is the gap this closes — the rule was right and the basis was missing.
#
# Declared here rather than in a prompt, for the reason #422 records: a
# constraint in the launch text is per-run adaptation that no future dataset
# inherits and no test can see. This is checkable and inherited.
#
# Tier 1 is strongest. A tier is a claim about how directly a source speaks for
# the released dataset, not about how much anyone trusts its authors:
#
#   1  the release describing itself — machine-readable metadata deposited with
#      the data, and the repository record of the release
#   2  the project describing its own release in prose, and the instruments
#      that govern it
#   3  the literature: peer-reviewed and preprint, authoritative on method and
#      often behind the current release on counts
#   4  presentations and funder records: about the project or a moment in it,
#      not about the release
#   5  explicitly historical material, retained for provenance
#
# A source may override its tier with `priority:`. An override is a deliberate
# line someone has to write, and should say why in a `curation_note`.
source_priority:
  1: [RO-Crate, structured metadata, data resource]
  2: [documentation, license, DUA, IRB]
  3: [publication, preprint, white paper]
  4: [NIH project page, tutorial]
  5: [historical data release, historical documentation]

default_minimum_characters: 500

naming:
  # Canonical GC project labels (#668), decided 2026-08-22 from the B2AI
  # Standards Explorer export committed at
  # data/standards/b2ai_gc_organization_metadata_2026-08-21.csv.
  #
  # `canonical_label` is what a record's *generated prose* calls the project:
  # the Explorer's project alias, not the Grand Challenge name and not a
  # B2AI_ORG id — the ids are deliberately kept out of records (Marcin,
  # 2026-08-22; they remain here as provenance of where the mapping came
  # from). Scope mirrors the American-English rule exactly: quoted source
  # text, URLs, identifiers, and formal proper nouns from a release's own
  # citation keep their form. `variants` mix forms observed in generated
  # records (Bridge2AI-Voice, "Bridge2AI Voice", VOICE, CHORUS, Chorus,
  # AI_READI, "AI READI") with forms anticipated from the Explorer's aliases
  # and hostnames (AIREADI, CHoRUS4AI, B2AI-VOICE, the long project names)
  # that no record has yet written — the #669 review counted. A variant list
  # is what the counter should count, not an allowlist.
  #
  # Like the scope block above: a declaration here is checkable and inherited;
  # the same statement in a launch prompt is a per-GC adaptation nothing
  # inherits (#422).
  AI_READI:
    canonical_label: AI-READI
    gc_name: Salutogenesis Grand Challenge
    b2ai_org_id: B2AI_ORG:114
    variants: ["AI_READI", "AIREADI", "AI READI"]
  CHORUS:
    canonical_label: CHoRUS
    gc_name: AI/ML for Clinical Care Grand Challenge
    b2ai_org_id: B2AI_ORG:115
    variants: ["CHORUS", "Chorus", "CHoRUS4AI"]
  CM4AI:
    canonical_label: CM4AI
    gc_name: Functional Genomics Grand Challenge
    b2ai_org_id: B2AI_ORG:116
    variants: ["CM4AI Consortium project", "Cell Maps for AI project"]
  VOICE:
    canonical_label: Voice
    gc_name: Precision Public Health Grand Challenge
    b2ai_org_id: B2AI_ORG:117
    variants: ["VOICE", "B2AI-VOICE", "B2AI-Voice", "Bridge2AI-Voice",
               "Bridge2AI Voice", "Voice as a Biomarker of Health project"]

