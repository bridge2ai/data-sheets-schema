selection_policy: >-
  First occurrence of each unique URL in each GC column, plus explicitly
  curated historical supplements whose unique content remains relevant.
  The former third category — current upstream releases the sheet had not yet
  been updated to select — is now empty: those corrections were applied
  upstream on 2026-07-27/28 and the sheet selects the current releases
  directly. See notes/UPSTREAM_SOURCE_DISCREPANCIES.md.

  Consequence: the sheet no longer carries the superseded selections, so this
  manifest is the only record of them. Entries that were sheet-selected before
  the corrections carry `superseded_by` and `retained_because`. They were kept,
  not dropped — see the note on each — and the bundles are unchanged, which is
  what keeps every run to date mutually comparable.

  Eight of these sources cannot be obtained from the sheet at all. Rebuild them
  with `d4d download supplements`, which fetches from the URLs recorded here;
  `d4d download audit-manifest` reports manifest against disk. Sources marked
  `fetch: manual` cannot be regenerated by any command.
bundle_hash_history:
  # #421 stripped `curation_note` out of the bundles on 2026-08-10. The notes
  # are manifest metadata addressed to a curator; writing them into the bundle
  # put conflict-resolution guidance and, in one case, a dataset fact in front
  # of the model. They remain below on each entry, which is where they belong.
  #
  # 55 provenance records carry a pre-strip `inputs.bundle_md5`. Nothing
  # re-verifies that field against disk, so no gate broke — but a hash with no
  # name is indistinguishable from a corrupted one, so the mapping is recorded
  # here. A run whose bundle_md5 appears in `before` consumed the bundle that
  # still carried the notes.
  stripped_on: '2026-08-10'
  issue: 421
  projects:
    AI_READI:
      before: 8aadffca28403aaa675e59b93721ea96
      after: a0713cf7e6ea63d1d9bcc8f9b8873363
