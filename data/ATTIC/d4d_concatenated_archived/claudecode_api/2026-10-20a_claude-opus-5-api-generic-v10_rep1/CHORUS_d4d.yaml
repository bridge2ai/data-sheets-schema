notes: >-
  The CHoRUS project website carries the notice "This repoitory is under review for
  potential modification in compliance with Administration directives." (spelling as
  published). The project site organizes CHoRUS into the components Data, Ethics and
  People: under Data it states that the team creates tools to support the cloud enclave;
  under Ethics it states that the consortium evaluates community perspectives on clinical
  care AI to find ways to increase trustworthiness of provenance and privacy in AI, and
  that new approaches are being created as the existing legal and regulatory landscape is
  analyzed; under People it states that the project is dedicated to training engineers,
  data scientists, and clinicians. The project site's contact section names Ciera McCrary,
  MGH, Program Manager, cmccrary@mgh.havard.edu (email spelling as published); the site
  identifies that person only as a program manager and point of contact and assigns no
  creator, maintainer, reviewer or access-committee responsibility for the dataset. The NIH
  RePORTER project abstract describes the same structure as three pillars: 1) Data
  (Standards, Tool Development and Optimization, and Data Acquistion) 2) Ethics (Ethical
  and Trustworthy AI) and 3) People (Team Science and Skill and Workforce Development). The
  same abstract states, as project plans, that the project will perform community-facing
  ethics focus groups to determine what data is appropriate for public sharing; that it
  will ensure that data elements feature appropriate contextual factors such as geographic
  distance to the nearest hospital; and that, to accomplish this, the project will involve
  extensive collaboration between centers as well as through the NIH Bridge2AI program, the
  NIH Bridge2AI Bridge Center, external biomedical and clinical organizations, industry,
  and regulatory agencies. The CHoRUS GitHub organization overview (captured 2025-11-14)
  states that the collaboration spans 20 academic centers, of which 14 will contribute as
  Data Acquisition centers, and states, as a future commitment, that patient-focused efforts
  will determine the ethical and legal approaches to manage privacy and bias, while
  accounting for Social Determinants of Health.
source_caveats: >-
  Table structure: the CHoRUS dataset table in the September 2025 informational webinar was
  extracted from slide text with its columns (Data type, Data standard, Access control,
  Metadata, Published metadata schema) separated from their rows, so this record names the
  data types, standards, access markings and published metadata schemas the table contains
  without asserting which cell belongs to which row, except where a row label itself names
  the standard, as in "Clinical notes (extracted and tokenized using OHNLP toolkit)".
  Counts: the project site (documentation, the highest-ranked source in this bundle)
  separates an "Anticipated Final Dataset" snapshot (100,000 patient admissions, 9 different
  data modalities, 14 data contributing hospitals, 60+ consortium members across 20
  different institutions) from a "Current Released Dataset" snapshot (50,000 patient
  admissions, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, 23 Tb
  waveform data); only the current-released figures are recorded here as present data, and
  the anticipated figures are carried as anticipated. The NIH RePORTER abstract's planned
  target of more than 100,000 critically ill patients counts patients rather than
  admissions, so it is carried beside the site's anticipated admission figure rather than
  merged with it. The webinar's "over 45K unique admissions" is dated to August 2025 and is a
  lower bound, so it is compatible with the site's 50,000 figure rather than in conflict
  with it, and both are retained. License: the only license statement in the bundle is the
  CHoRUS GitHub organization README's "This project is licensed under the MIT License",
  which concerns that GitHub project and its repositories; no license is stated for the
  dataset itself, so the license slot is left empty. Identifier: no dataset DOI appears in
  any source document, so the project site URL is used as this record's identifier. The
  GitHub organization overview is historical documentation captured 2025-11-14; its
  repository listings name tools and reports without stating software versions or
  establishing that any of them was run on this release.