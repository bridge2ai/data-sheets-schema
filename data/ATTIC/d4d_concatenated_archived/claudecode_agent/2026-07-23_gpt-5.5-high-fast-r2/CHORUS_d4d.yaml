known_limitations:
  - id: chorus:limitation:1
    name: Ongoing data generation and modality completion
    description: >
      The dataset is still a data generation project. The project end date listed by
      NIH RePORTER is 2026-11-30T00:00:00. Webinar materials state that imaging
      de-identification for the larger cohort and EEG extraction are in process.
    limitation_type: temporal_limitation
    limitation_description: >
      Some modalities or larger-cohort releases are not complete in the current
      source documents.
    scope_impact: >
      Users should distinguish the current released data from the anticipated final
      dataset and should account for incomplete imaging and EEG availability.
    recommended_mitigation: >
      Consult current CHoRUS access documentation and metadata before analysis.
  - id: chorus:limitation:2
    name: Controlled-access restrictions
    description: >
      Dataset access requires registration, institutional email, approval, compute
      provisioning, and a signed licensing agreement.
    limitation_type: scope_limitation
    limitation_description: >
      Not all users can directly download or inspect the full dataset outside the
      controlled-access process.
    scope_impact: >
      Reuse is constrained by access review, secure-enclave availability, and data
      use obligations.
    recommended_mitigation: >
      Use the registration process and access contacts identified in the CHoRUS
      GitHub overview and training webinar.
  - id: chorus:limitation:3
    name: Current source bundle lacks detailed demographic distributions
    description: >
      The source documents state goals for diversity, balanced cohorts, Social
      Determinants of Health, and broad cohort participants but do not provide full
      demographic breakdowns in the concatenated bundle.
    limitation_type: coverage_limitation
    limitation_description: >
      Detailed race, ethnicity, sex, geography, condition, and treatment-strategy
      distributions cannot be fully extracted from the current source bundle.
    scope_impact: >
      Fairness and representativeness analyses need more detailed metadata than
      provided in the present source bundle.
    recommended_mitigation: >
      Use CHoRUS metadata, secure-enclave documentation, and characterization reports
      when available.
  - id: chorus:limitation:4
    name: Clinical notes stored locally except tokens
    description: >
      Webinar materials state that clinical notes are stored locally except tokens.
    limitation_type: methodological_limitation
    limitation_description: >
      Full text notes may not be distributed centrally in the same way as tokenized
      outputs.
    scope_impact: >
      Natural language processing work may be limited to tokenized representations
      or site-local workflows.
    recommended_mitigation: >
      Follow OHNLP schema documentation and CHoRUS access procedures.

known_biases:
  - id: chorus:bias:1
    name: Potential hospital and sampling bias
    description: >
      Although CHoRUS is multi-center and uses federated access to support balanced
      and diverse sampling, the current source bundle does not establish that the
      released data are statistically representative of all acute and critical care
      populations.
    bias_type: sampling_bias
    bias_description: >
      Data are drawn from participating hospitals and retrospective clinical systems.
    mitigation_strategy: >
      Use federated access, sampling methods, multi-hospital data, community-facing
      ethics work, and Social Determinants of Health context as described by CHoRUS.
    affected_subsets:
      - Current released dataset.
      - Retrospective controlled-access hospital data.
  - id: chorus:bias:2
    name: Potential measurement and modality coverage bias
    description: >
      Different data modalities have different readiness statuses: OMOP and telemetry
      are in enclave, notes and imaging have planned or in-process handling, and EEG
      extraction is in process.
    bias_type: measurement_bias
    bias_description: >
      Modality coverage and readiness may differ across hospitals, admissions, and
      clinical contexts.
    mitigation_strategy: >
      Use published metadata schemas, site characterization reports, and modality-
      specific quality checks.
    affected_subsets:
      - Imaging data.
      - Clinical notes.
      - EEG waveform data.
      - Waveform telemetry data.

