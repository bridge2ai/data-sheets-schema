        Participant consent documentation is not included in the current concatenated
        source bundle.
    consent_scope:
      - >
        The source bundle documents user licensing for access, not participant consent
        scope.

participant_privacy:
  - id: chorus:participant-privacy:1
    name: CHoRUS privacy protections
    description: >
      The project promotes privacy, accountability, and clinical benefit and transforms
      data using approaches that limit re-identification.
    anonymization_method:
      - >
        Structured data are standardized to OMOP; clinical notes are tokenized using
        OHNLP and stored locally except tokens; imaging de-identification is in
        process for the larger cohort.
    reidentification_risk:
      - >
        Re-identification risk is managed through controlled access, licensing, local
        note storage, tokenization, de-identification, and transformations intended
        to limit re-identification.
    privacy_techniques:
      - Controlled access.
      - Licensing agreement before access.
      - OHNLP tokenization.
      - Local storage of clinical notes except tokens.
      - DICOM de-identification in process.
      - Transformations that limit re-identification.
      - Privacy and bias management through patient-focused ethical and legal approaches.
    data_linkage:
      - >
        The source bundle describes multi-modal EHR, waveform, imaging, text, Social
        Determinants of Health, and geographic distance elements, but does not provide
        detailed linkage keys.

at_risk_populations:
  id: chorus:at-risk:1
  name: Acutely and critically ill patients
  description: >
