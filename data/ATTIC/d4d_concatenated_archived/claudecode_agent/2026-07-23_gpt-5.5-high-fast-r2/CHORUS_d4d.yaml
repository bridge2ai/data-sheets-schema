id: https://chorus4ai.org/
name: CHoRUS
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
description: >
  The Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI is a NIH Common Fund Bridge2AI data generation project for
  clinical care AI. CHoRUS is developing a publicly available, AI-ready critical
  care dataset, tools, standards, legal and ethical approaches, and training
  programs to support machine learning and artificial intelligence applications
  in acute and critical care. The project addresses the urgent need for
  infrastructure to build high-resolution, multi-center datasets for critical
  care AI/ML. Its goal is to generate data for applications that characterize
  acute and critical care illness, predict complications, and measure treatment
  response among patients with acute or critical illness. CHoRUS uses three
  pillars: Data, Ethics, and People. The source materials describe retrospective,
  controlled-access data collection across 14 hospitals, 20 academic centers, and
  a target final dataset of 100,000 patient admissions across 9 modalities. The
  current released dataset is described as 50,000 ICU, PICU, and NICU patient
  admissions, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology
  data, and 23 Tb of waveform data. As of August 2025, webinar materials also
  describe more than 45,000 unique admissions across 14 hospitals. Data modalities
  include demographics, medication administration, procedures, nursing flowsheets,
  diagnoses, clinical notes, imaging, waveform telemetry, and waveform EEG. The
  data are standardized with OMOP, OHNLP, DICOM, WFDB, EDF+, and Persyst schemas
  or formats. Patient-focused work is intended to determine ethical and legal
  approaches to privacy, bias, public sharing, provenance, and Social Determinants
  of Health. The project also builds workforce capacity through AIM-AHEAD
  Bridge2AI training, Jupyter notebooks, OHDSI/OMOP training, ethics and policy
  content, mentorship, workshops, office hours, and collaborative cloud use.
page: https://chorus4ai.org/
