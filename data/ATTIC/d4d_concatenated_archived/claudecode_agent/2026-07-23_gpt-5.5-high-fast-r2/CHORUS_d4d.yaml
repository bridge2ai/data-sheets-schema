    - Sites provide regular status updates through GitHub interface or Google Form.
    - GoogleScript updates GitHub status and issue information from Google Form submissions.
    - Per-repository projects are being phased out and migrated to a central project space according to the GitHub overview.

retention_limit:
  id: chorus:retention:1
  name: Controlled-access retention under project and institutional governance
  description: >
    The source bundle does not provide a specific retention period. It does state
    that the project has a NIH project period ending 2026-11-30T00:00:00 and that
    data are controlled access with licensing and privacy governance.
  retention_details:
    - No explicit retention period is provided in the source bundle.
    - Project period runs from 2022-09-01T00:00:00 to 2026-11-30T00:00:00.
    - Controlled access, licensing, privacy, and institutional requirements apply.

version_access:
  id: chorus:version-access:1
  name: Current and anticipated dataset access states
  description: >
    Source documents identify a current released dataset and an anticipated final
