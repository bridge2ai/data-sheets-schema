purposes:
  - id: chorus:purpose:1
    name: Improve recovery from acute illness
    description: >
      Create a patient-focused collaborative hospital repository uniting standards
      for clinical care AI to expand artificial intelligence and machine learning
      in ways that improve recovery from acute illness.
    response: >
      The source documents state that the CHoRUS Network goal is to develop the
      most diverse, high-resolution, ethically sourced, AI-ready dataset to answer
      the grand challenge of improving recovery from acute illness.
  - id: chorus:purpose:2
    name: Build AI/ML infrastructure for critical care
    description: >
      Address the urgent need for infrastructure to support AI/ML in critical care
      by creating high-resolution, multi-center data, standards, tools, and legal
      and ethical approaches.
    response: >
      NIH RePORTER states that developing high-resolution multi-center datasets is
      a critical first step toward actionable and trustworthy AI in critical care.
  - id: chorus:purpose:3
    name: Generate a publicly available AI-ready critical care dataset
    description: >
      Develop a publicly available, AI-ready critical care dataset from more than
      100,000 critically ill patients while promoting privacy, accountability, and
      clinical benefit.
    response: >
      The project is intended to acquire and standardize a dataset of unprecedented
      diversity and high resolution and to provision a holdout test set for external
      validation of AI-developed models.
  - id: chorus:purpose:4
    name: Unify clinical data standards
    description: >
      Harmonize multi-modal EHR, waveform, imaging, and text data through standards
      including OMOP, OHNLP, DICOM, WFDB, EDF+, and Persyst.
    response: >
      The GitHub overview states that unified standards will harmonize multi-modal
      EHR, waveform, imaging, and text data and that repositories provide semantic
      mappings to international standards.
  - id: chorus:purpose:5
    name: Support ethical and trustworthy AI
    description: >
      Determine ethical and legal approaches to manage privacy and bias, account
      for Social Determinants of Health, and evaluate community perspectives on
      clinical care AI to increase trustworthiness of provenance and privacy.
    response: >
      The project's Ethics pillar evaluates community perspectives, analyzes legal
      and regulatory landscapes, and creates new approaches to privacy and bias.
  - id: chorus:purpose:6
    name: Develop skills and workforce capacity
    description: >
      Cultivate expertise in the lay and scientific community and build a next
      generation of diverse academic and community AI scientists through multimodal
      education, hands-on training, mentorship, and AIM-AHEAD collaboration.
    response: >
      The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
      CHoRUS data through engagement, AI training, and mentorship.

tasks:
  - id: chorus:task:1
    name: Characterize acute and critical care illness
    description: >
      Support ML/AI applications aimed at characterizing acute and critical care
      illness patterns, trajectories, and outcomes across multiple hospitals.
    response: >
      NIH RePORTER explicitly names characterizing acute and critical care illness
      as a target application for the CHoRUS data generation project.
  - id: chorus:task:2
    name: Predict complications
    description: >
      Enable models that predict complications among patients with acute or critical
      illness using structured EHR, telemetry, imaging, notes, EEG, and contextual
      data.
    response: >
      NIH RePORTER identifies predicting complications among acute or critically ill
      patients as a key intended AI/ML use.
  - id: chorus:task:3
    name: Measure treatment response
    description: >
      Support analyses and models that measure treatment response in acute and
      critical care using time-stamped medication administration, procedures,
      diagnoses, flowsheets, waveform data, and other clinical signals.
    response: >
      NIH RePORTER names measuring treatment response among patients with acute or
      critical illness as an intended application.
  - id: chorus:task:4
    name: External validation for AI-developed models
    description: >
      Provision holdout data for external model validation to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
    response: >
      NIH RePORTER states that the dataset will provision a holdout test set
      accessible for model external validation.
  - id: chorus:task:5
    name: Label prediction targets
    description: >
      Use visualization and annotation environments to label data with targets that
      are important for prediction in critical care.
    response: >
      The NIH project abstract and GitHub overview describe a visualization and
      annotation environment for labeling targets important for prediction.
  - id: chorus:task:6
    name: Train clinical care AI learners
    description: >
      Support trainees in developing and presenting use cases suitable for Bridge2AI
      data topics, applying program insights on the Bridge2AI Clinical Care Cloud,
      and preparing posters, abstracts, or manuscripts.
    response: >
      The AIM-AHEAD webinar lists trainee objectives for AI/ML clinical care
      expertise, use-case development, collaborative research, and dissemination.

addressing_gaps:
  - id: chorus:gap:1
    name: Critical care lacks large AI-ready multi-center infrastructure
    description: >
      CHoRUS addresses the stated urgent need for infrastructure to support AI/ML
      in critical care by developing high-resolution data from multiple centers,
      tools, standards, and coordinated data acquisition processes.
    response: >
      NIH RePORTER states that high-resolution multi-center datasets are a critical
      first step toward actionable and trustworthy AI.
  - id: chorus:gap:2
    name: Existing clinical data are fragmented across modalities and formats
    description: >
      CHoRUS addresses fragmented EHR, waveform, imaging, and clinical text data by
      using unified standards and repositories for semantic mappings, SOPs, tooling,
      and site data extracts.
    response: >
      The GitHub overview says repositories provide tools, validated semantic
      mappings, standard operating protocols, and project management for
      interoperable data delivery.
  - id: chorus:gap:3
    name: Privacy, bias, and legal frameworks are unresolved for broad clinical AI sharing
    description: >
      The project fills a gap in ethically sourced clinical care AI datasets by
      evaluating community perspectives, conducting ethics focus groups, analyzing
      legal and regulatory issues, and managing privacy and bias.
    response: >
      Source materials describe patient-focused efforts to determine ethical and
      legal approaches to privacy and bias while accounting for Social Determinants
      of Health.
  - id: chorus:gap:4
    name: Limited hands-on workforce pathways for clinical care AI
    description: >
      The AIM-AHEAD partnership addresses gaps in clinical care AI workforce
      development by equipping trainees with practical skills, real-world data
      access, mentorship, Jupyter notebooks, OHDSI/OMOP tools, and collaborative
      cloud experience.
    response: >
      The webinar states that the partnership builds a skilled workforce prepared
      to advance AI/ML applications in health research.
  - id: chorus:gap:5
    name: Balanced and diverse cohorts need coordinated sampling and access
    description: >
      CHoRUS uses federated access and multi-center participation to enable sampling
      methods intended to ensure a balanced and diverse cohort.
    response: >
      The GitHub overview states that federated access will enable sampling methods
      to ensure a balanced and diverse cohort.

