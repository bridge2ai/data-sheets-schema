  versions_available:
    - Current released dataset described on chorus4ai.org.
    - August 2025 webinar dataset status.
    - Anticipated final dataset.
  version_details:
    - "Current released dataset: 50,000 ICU/PICU/NICU patient admissions, 1.6 billion OMOP rows, 7,642 radiology admissions, 23 Tb waveform data."
    - "Anticipated final dataset: 100,000 patient admissions, 9 data modalities, 14 data contributing hospitals."
    - No dataset DOI or semantic version is listed in the source bundle.

extension_mechanism:
  id: chorus:extension:1
  name: Site contributions, SOPs, mappings, and community discussions
  description: >
    CHoRUS supports extension through data site workflows, SOPs, semantic mapping
    contributions, status updates, GitHub discussions, and software repositories.
  contribution_url: https://github.com/chorus-ai
  extension_details:
    - Data managers use Chorus_SOP for extraction and contribution workflows.
    - Clinical collaborators contribute to semantic mappings and validation through chorus-mapping.
    - Standards and Data Acquisition discussions support issue reporting.
    - Sites submit regular status updates through GitHub or Google Form.
    - Software contributors use chorus-developer documentation and package status pages.

ethical_reviews:
  - id: chorus:ethical-review:1
    name: Community-facing ethics and legal review
    description: >
      CHoRUS performs community-facing ethics focus groups to determine what data is
      appropriate for public sharing and establishes legal frameworks for collecting
      data at scale.
    reviewing_organization: CHoRUS Ethics pillar and participating institutions.
    review_details:
      - Ethics pillar evaluates community perspectives on clinical care AI.
      - Patient-focused efforts manage privacy and bias.
      - Existing legal and regulatory landscape is analyzed.
      - New approaches are being created to increase trustworthiness of provenance and privacy in AI.
  - id: chorus:ethical-review:2
    name: Training curriculum ethics and compliance content
    description: >
      AIM-AHEAD Bridge2AI training covers ethics of clinical AI, safety, risk, legal
      considerations, IRB protocol drafting, HIPAA/GDPR compliance for OMOP/FHIR
      data, and quality assurance audit frameworks.
    reviewing_organization: AIM-AHEAD and Bridge2AI training program.
    review_details:
      - Ethics of AI in Clinical Practice lecture.
      - Navigating IRB, Data Compliance, and Quality Assurance in AI/ML Healthcare Research.
      - Hands-on IRB drafting and compliance checklist toolkit.

data_protection_impacts:
  - id: chorus:data-protection:1
    name: Privacy, de-identification, and controlled access safeguards
    description: >
      CHoRUS source documents identify privacy, accountability, clinical benefit,
      de-identification, controlled access, tokenized notes, local note storage, and
      transformation approaches that limit re-identification.
    impact_details:
      - Controlled access dataset.
      - Registration, approval, compute provisioning, and licensing agreement.
      - Clinical notes stored locally except tokens.
      - Imaging de-identification in process for larger cohort.
      - Transformations that limit re-identification.
      - Community-facing ethics focus groups for public-sharing decisions.

human_subject_research:
  id: chorus:human-subjects:1
  name: Retrospective acute and critical care patient data
  description: >
    CHoRUS uses retrospective clinical data from acute and critically ill patients
    across hospital data acquisition centers. The project includes legal and ethical
    research, privacy and bias management, and community-facing ethics focus groups.
  involves_human_subjects: true
  irb_approval:
    - >
      The source bundle states that legal and ethical approaches and community-facing
      ethics focus groups are part of the project, but it does not provide a specific
      IRB approval number.
  ethics_review_board:
    - Participating institutional review and ethics processes are implied by legal and ethical research, but no named IRB is listed in the source bundle.
  special_populations:
    - ICU patients.
    - PICU patients.
    - NICU patients.
    - Critically ill patients.
  regulatory_compliance:
    - HIPAA/GDPR compliance is included in training curriculum topics for OMOP/FHIR data.
    - Legal and regulatory landscape analysis is part of the project Ethics pillar.
    - Controlled access and licensing agreements apply.

informed_consent:
  - id: chorus:informed-consent:1
    name: Consent details not specified in source bundle
    description: >
      The source bundle does not provide participant consent forms or consent protocol
      details for the retrospective clinical dataset. It does document licensing
      agreements for dataset users and community-facing ethics focus groups about
      public sharing.
    consent_obtained: false
    consent_type:
      - Not specified in current source bundle.
    consent_documentation:
