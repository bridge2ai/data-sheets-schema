      ethical, controlled-access, and licensing framework.
    discouragement_details:
      - The project transforms data using approaches that limit re-identification.
      - Access requires signed licensing agreement.
      - Privacy and accountability are project goals.
  - id: chorus:discouraged-use:2
    name: Unsupported clinical deployment
    description: >
      Models developed from CHoRUS data should not be used for clinical care without
      appropriate validation, governance, and implementation review.
    discouragement_details:
      - The source emphasizes external validation and trustworthy AI.
      - Training materials include safety, risk, legal considerations, IRB, HIPAA/GDPR, compliance, and QA topics.
  - id: chorus:discouraged-use:3
    name: Treating the current release as the final complete dataset
    description: >
      The anticipated final dataset and current released dataset differ, and some
      modalities are in process or planned.
    discouragement_details:
      - Anticipated final dataset has 100,000 patient admissions and 9 modalities.
      - Current released dataset has 50,000 ICU/PICU/NICU admissions.
      - Imaging de-identification for larger cohort and EEG extraction are in process.

