intended_uses:
  - id: chorus:intended-use:1
    name: Critical care AI/ML model development
    description: >
      Develop AI/ML applications for acute and critical care illness characterization,
      complication prediction, and treatment response measurement.
    examples:
      - Characterize acute and critical care illness.
      - Predict complications among acute or critically ill patients.
      - Measure treatment response.
    usage_notes: Use controlled access procedures and modality metadata.
    use_category:
      - health_medical_biomedical_research
  - id: chorus:intended-use:2
    name: External validation of AI-developed models
    description: >
      Use the holdout test set for model external validation and to aid marketplace
      adoption of AI-developed models for acute and critical care.
    examples:
      - External validation of models for implementation in acute and critical care.
    usage_notes: Holdout access should follow CHoRUS data governance and licensing requirements.
    use_category:
      - health_medical_biomedical_research
  - id: chorus:intended-use:3
    name: Clinical care AI training
    description: >
      Support hands-on training in the Bridge2AI CHoRUS ecosystem through Jupyter
      notebooks, workshops, live courses, office hours, OHDSI/OMOP tools, ethics
      content, and collaborative cloud work.
    examples:
      - Foundational AI/ML training.
      - Python and version control.
      - Structured EHR datasets.
      - ML for clinical applications.
      - Clinical deep learning.
      - Ethics of clinical AI.
      - OHDSI/OMOP common data model workshops.
    usage_notes: Trainees use the Bridge2AI AI/ML for Clinical Care Network and Collaborative Cloud.
    use_category:
      - general_research_use
  - id: chorus:intended-use:4
    name: Health equity, privacy, and trustworthiness research
    description: >
      Study responsible clinical AI, Social Determinants of Health, privacy, bias,
      patient-focused approaches, provenance, and trustworthiness.
    examples:
      - Evaluate community perspectives on clinical care AI.
      - Account for geographic distance to nearest hospital.
      - Analyze privacy and bias in AI-ready clinical datasets.
    usage_notes: Interpret findings in light of the controlled-access and multi-center context.
    use_category:
      - health_medical_biomedical_research

