    name: Multi-center federated cohort sampling
    description: >
      CHoRUS spans 20 academic centers, of which 14 contribute as data acquisition
      centers. Federated access is intended to enable sampling methods that ensure a
      balanced and diverse cohort.
    is_sample: true
    is_random: false
    is_representative: true
    source_data:
      - Acute and critically ill patients from 14 data contributing hospitals.
      - ICU, PICU, and NICU patient admissions.
    representative_verification:
      - >
        Source materials state that federated access will enable sampling methods to
        ensure a balanced and diverse cohort, but do not provide a statistical
        verification report.
    strategies:
      - Federated sampling across multiple hospitals.
      - Sampling to ensure comprehensive sets of patient conditions and clinical treatment strategies.
      - Inclusion of contextual factors including geographic distance to the nearest hospital.
  - id: chorus:sampling:2
    name: Retrospective controlled-access data collection
    description: >
      Webinar materials identify the CHoRUS dataset as retrospective data collection
      under controlled access. The project collects acute and critical care data at
      multiple hospitals through coordinated extraction and contribution workflows.
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - Retrospective clinical data from participating hospital systems.
    why_not_representative:
      - >
        The sources describe balancing and diversity goals but do not state that the
        current released dataset is statistically representative of all acute and
        critical care patients.
    strategies:
      - Retrospective extraction from clinical systems.
      - Site status tracking for data extract creation and curation.

