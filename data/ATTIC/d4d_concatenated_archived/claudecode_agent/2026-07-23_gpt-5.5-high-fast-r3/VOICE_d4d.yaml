        Development, benchmarking, validation, pretraining, and fine-tuning of
        clinically applicable machine-learning models using voice-derived data.
    usage_notes: >-
      Users must satisfy the applicable registered or controlled access
      requirements and follow the Bridge2AI-Voice access agreements.
