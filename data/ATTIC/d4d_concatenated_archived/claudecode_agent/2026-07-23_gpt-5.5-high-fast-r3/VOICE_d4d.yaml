is_deidentified:
  id: https://doi.org/10.13026/k81f-qr68#deidentified
  name: De-identified registered-access feature release
  identifiable_elements_present: false
  method: HIPAA Safe Harbor removal plus additional sensitivity-based exclusions
  identifiers_removed:
    - Names
    - Geographic locators below country level
    - Dates at resolution finer than years
    - Phone and fax numbers
    - Email addresses
    - IP addresses
    - Social Security Numbers
    - Medical record numbers
    - Health plan beneficiary numbers
    - Device identifiers
    - License numbers
    - Account numbers
    - Vehicle identifiers
    - Website URLs
    - Full face photos
    - Biometric identifiers
    - Narrative text fields
    - Raw voice recordings from registered-access feature release
  deidentification_details:
    - >-
      State and province were removed, country of data collection was retained,
      and spectrogram-like features were excluded when audio contained free
      speech or otherwise posed a sensitivity risk.
