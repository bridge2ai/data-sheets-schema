id: https://doi.org/10.13026/k81f-qr68
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is an NIH Bridge2AI flagship dataset and consortium effort
  for voice as a biomarker of health. The adult PhysioNet v3.0.0 release
  contains derived audio features and phenotypic information for 833 adult
  participants collected across five sites in North America. Participants were
  selected from disease groups where voice waveform changes are clinically
  relevant, including voice disorders, neurological disorders, mood disorders,
  and respiratory disorders. The public registered-access release contains
  lower-risk derivations such as spectrograms and other acoustic features rather
  than original voice recordings, and includes demographic, clinical, validated
  questionnaire, diagnosis, enrollment, and task metadata.
