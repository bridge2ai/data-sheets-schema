preprocessing_strategies:
  - id: https://doi.org/10.13026/k81f-qr68#preprocessing-audio
    name: Audio standardization and feature extraction
    preprocessing_details:
      - >-
        Raw audio was converted to monaural audio and resampled to 16 kHz with
        a Butterworth anti-aliasing filter.
      - >-
        Derived features include spectrograms, MFCCs, Mel spectrograms,
        articulatory features from Speech Articulatory Coding, acoustic
        features from openSMILE, phonetic and prosodic features from
        Parselmouth and Praat, phonetic posteriorgrams, and transcriptions
        generated with OpenAI Whisper Large.
    used_software:
      - id: https://github.com/sensein/b2aiprep
        name: b2aiprep
        version: 3.0.0
        url: https://github.com/sensein/b2aiprep
      - id: https://github.com/audeering/opensmile
        name: openSMILE
      - id: https://www.fon.hum.uva.nl/praat/
        name: Praat
      - id: https://github.com/YannickJadoul/Parselmouth
        name: Parselmouth
      - id: https://pytorch.org/audio/
        name: torchaudio
