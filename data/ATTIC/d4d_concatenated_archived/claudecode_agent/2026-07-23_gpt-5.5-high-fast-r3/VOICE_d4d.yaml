    name: Enable voice AI research
    response: >-
      The dataset was created to fuel research and discovery in voice
      biomarkers by providing a large, ethically sourced, multi-institutional
      voice dataset linked to health information.
  - id: https://doi.org/10.13026/k81f-qr68#purpose-clinical-models
    name: Support clinically applicable AI and ML models
    response: >-
      The dataset is intended to support development, benchmarking,
      pretraining, fine-tuning, and validation of machine-learning models for
      screening, diagnosis, and monitoring of health conditions through voice
      biomarkers.
tasks:
  - id: https://doi.org/10.13026/k81f-qr68#task-disease-classification
    name: Disease detection and classification from voice-derived data
    response: >-
      Source documentation describes predefined tasks and labels for training
      machine-learning models for disease detection and classification using
      diagnostic categories such as vocal pathologies, neurological disorders,
      psychiatric conditions, and respiratory disorders.
  - id: https://doi.org/10.13026/k81f-qr68#task-biomarker-discovery
    name: Voice biomarker discovery and validation
    response: >-
      The dataset supports research into acoustic markers associated with
      disease status and health biomarkers, including voice, speech, cough, and
      breathing sounds linked to clinical information.
