id: https://chorus4ai.org/
name: CHoRUS for Equitable AI
title: Patient-Focused Collaborative Hospital
  Repository Uniting Standards (CHoRUS) for Equitable
  AI
description: CHoRUS is a Bridge2AI clinical care
  data generation project focused on creating
  a patient-focused, ethically sourced, AI-ready,
  multi-center critical-care dataset and associated
  tools, standards, and training. The sources
  describe retrospective, controlled-access, multi-modal
  clinical data from 14 hospitals, with current
  released content including ICU, PICU, and NICU
  admissions, OMOP electronic health record data,
  radiology data, and waveform data, and an anticipated
  final dataset of 100,000 patient admissions
  across 9 data modalities.
page: https://chorus4ai.org/
license: MIT License for CHoRUS GitHub project
  resources; controlled dataset access requires
  a separate licensing agreement.
