known_limitations:
- name: Controlled-access availability
  limitation_type: coverage_limitation
  limitation_description: Access is controlled
    and requires registration, compute provisioning,
    and a licensing agreement; some modalities
    are planned or in process.
  scope_impact: Researchers may not be able to
    use all modalities immediately or outside
    the controlled cloud/enclave environment.
  recommended_mitigation: Follow the registration
    and licensing workflow and confirm modality
    availability before analysis.
- name: Modality readiness differs
  limitation_type: integration_limitation
  limitation_description: The webinar lists clinical
    notes as local except tokens, imaging de-identification
    in process for a larger cohort, and EEG extraction
    in process.
  scope_impact: Models requiring full notes, larger
    imaging cohorts, or EEG may be limited by
    availability and release status.
  recommended_mitigation: Use released OMOP, telemetry,
    metadata, and available imaging data while
    tracking planned modality releases.
