file_collections:
- id: https://chorus4ai.org/dataset/omop-ehr
  name: OMOP electronic health record data
  description: Demographics, medication administration,
    procedures, nursing flowsheets, and diagnoses
    are represented as controlled-access OMOP
    data; the project website reports 1.6 billion
    rows of EHR OMOP data in the current released
    dataset.
  collection_type:
  - processed_data
  conforms_to: OMOP Common Data Model
- id: https://chorus4ai.org/dataset/clinical-notes
  name: Tokenized clinical notes
  description: Clinical notes are extracted and
    tokenized using the OHNLP toolkit; the webinar
    lists notes as stored locally except for tokens
    and describes an OHNLP open source schema.
  collection_type:
  - processed_data
  conforms_to: OHNLP open source schema
- id: https://chorus4ai.org/dataset/imaging
  name: Radiology imaging
  description: Imaging is sourced from PACS and
    represented using DICOM. The project website
    reports 7,642 admissions with radiology data,
    while the webinar reports 1,000 images available
    with de-identification in process for a larger
    cohort.
  collection_type:
  - processed_data
  conforms_to: DICOM schema
- id: https://chorus4ai.org/dataset/waveform-telemetry
  name: Waveform telemetry
  description: Waveform telemetry comes from bedside
    monitors through gateway or middleware systems,
    is represented in WFDB, and is controlled
    access. The project website reports 23 Tb
    of waveform data.
  collection_type:
  - processed_data
  conforms_to: PhysioNet schema extended
- id: https://chorus4ai.org/dataset/waveform-eeg
  name: Waveform EEG
  description: Waveform EEG is sourced from hospital
    databases, represented as EDF+ and Persyst,
    and the webinar describes extraction as in
    process.
  collection_type:
  - processed_data
  conforms_to: open source EDF+ and Persyst schema
- id: https://chorus4ai.org/dataset/metadata
  name: Published metadata schema
  description: The webinar describes a published
    metadata schema and controlled metadata access
    for the CHoRUS dataset.
  collection_type:
  - metadata
  - documentation
purposes:
- name: Develop AI-ready critical-care data
  response: Create a publicly available or controlled-access
    AI-ready critical care dataset to support
    ML/AI applications for acute and critical
    illness.
- name: Improve recovery from acute illness
  response: Support AI-derived models that improve
    care and outcomes for patients requiring critical
    care and improve recovery from acute illness.
- name: External validation holdout
  response: Provision a holdout test set for external
    model validation and marketplace adoption
    of AI-developed models in acute and critical
    care.
- name: Training and workforce development
  response: Expand access to CHoRUS data through
    engagement, AI training, mentorship, and hands-on
    use of real-world multi-modal clinical datasets.
tasks:
- name: Characterize acute and critical care illness
  response: Use high-resolution multi-center clinical
    data to characterize acute and critical care
    illness.
- name: Predict complications
  response: Support ML/AI applications aimed at
    predicting complications among patients with
    acute or critical illness.
- name: Measure treatment response
  response: Support modeling that measures treatment
    response among patients with acute or critical
    illness.
- name: Clinical AI training use cases
  response: Enable trainees to develop and present
    use cases suitable for Bridge2AI Data Topics
    and clinical-care AI research.
- name: Semantic mapping and validation
  response: Support clinical collaborators in
    semantic mapping, pooled tabular mappings,
    and clinical validation SOPs for CHoRUS data.
addressing_gaps:
- name: Critical-care AI infrastructure gap
  response: The source identifies an urgent need
    for infrastructure to support AI/ML in critical
    care and states that high-resolution multi-center
    datasets are a first step toward actionable
    and trustworthy AI.
- name: Diverse multi-center cohort gap
  response: CHoRUS aims to acquire an AI-ready
    data set from more than 100,000 critically
    ill patients and the GitHub overview describes
    federated access and sampling methods to ensure
    a balanced and diverse cohort.
- name: Ethical and legal data-sharing gap
  response: CHoRUS performs legal and ethical
    research, community-facing ethics focus groups,
    and privacy and bias work to determine appropriate
    approaches for public or controlled data sharing.
- name: Standards and interoperability gap
  response: The project develops standards, validated
    semantic mappings, SOPs, and tools for harmonizing
    multi-modal EHR, waveform, imaging, and text
    data.
