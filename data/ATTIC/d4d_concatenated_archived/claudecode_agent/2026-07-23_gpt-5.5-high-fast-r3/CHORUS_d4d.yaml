- name: Community AI literacy and workforce development
  impact_details:
  - The project cultivates expertise in lay and
    scientific communities through multimodal
    educational approaches and training.
discouraged_uses:
- name: Unsupported or non-reviewed clinical deployment
  discouragement_details:
  - The source emphasizes trustworthy AI, privacy,
    accountability, external validation, ethics,
    and clinical benefit; use outside these controls
    is not supported by the source bundle.
- name: Attempts to re-identify participants
  discouragement_details:
  - The project uses approaches that limit re-identification
    and controlled access; re-identification attempts
    would contradict the stated privacy protections.
intended_uses:
- name: Acute and critical-care AI research
  description: Develop, train, and externally
    validate models for acute and critical care
    applications using multi-modal high-resolution
    clinical data.
- name: Bridge2AI and AIM-AHEAD training
  description: Support hands-on AI/ML training,
    practical use-case development, and collaborative
    research on the Bridge2AI Clinical Care Cloud
    platform.
prohibited_uses:
- name: Use without access approval or license
    agreement
  description: Training program sources state
    participants must register and sign a licensing
    agreement before accessing the dataset.
- name: Patient re-identification
  description: The project emphasizes privacy,
    transformations limiting re-identification,
    tokenization, de-identification, and controlled
    access.
distribution_formats:
- name: OMOP
  description: Demographics, medication administration,
    procedures, nursing flowsheets, and diagnoses
    are distributed in OMOP-controlled formats.
- name: OHNLP tokens
  description: Clinical notes are extracted and
    tokenized using the OHNLP toolkit.
- name: DICOM
  description: Imaging from PACS uses DICOM schema.
- name: WFDB
  description: Waveform telemetry uses WFDB and
    a PhysioNet schema extension.
- name: EDF+ and Persyst
  description: Waveform EEG uses EDF+ and Persyst
    schemas.
- name: Published metadata schema
  description: The webinar describes a published
    metadata schema.
distribution_dates:
- name: Project period
  release_dates:
  - 2022-09-01 project start
  - 2026-11-30 project end
- name: August 2025 dataset snapshot
  release_dates:
  - 'As of August 2025: over 45K unique admissions
    across 14 hospitals reported in the Cohort
    2 webinar.'
- name: Current website snapshot
  release_dates:
  - 'Current Released Dataset: 50,000 patient
    admissions, 1.6 Billion OMOP rows, 7,642 admissions
    with radiology data, and 23 Tb waveform data.'
third_party_sharing:
- name: Controlled access sharing
  is_shared: true
  description: The data are controlled access;
    access requires registration, licensing, and
    compute provisioning.
license_and_use_terms:
  name: Controlled dataset use terms
  license_terms:
  - Participants must fill out a registration
    form with name, email, and institution.
  - All participants must sign a licensing agreement
    included in the registration form before gaining
    access to the dataset.
  - Access is granted after compute is provisioned
    and an email is sent.
  - A .edu email address is needed for dataset
    access in the training workflow, but the source
    states program administrators will assist
    if needed.
  - CHoRUS GitHub project resources are licensed
    under the MIT License.
  data_use_permission:
  - health_medical_biomedical_research
  - clinical_care_use
  - user_specific
ip_restrictions:
  name: Software and repository licenses
  restrictions:
  - The GitHub organization overview states the
    project is licensed under the MIT License.
    Some listed repositories display MIT or Apache-2.0
    license markers. Dataset access is governed
    separately by a licensing agreement.
regulatory_restrictions:
  name: Clinical data governance
  regulatory_restrictions:
  - Controlled access clinical data with privacy,
    legal, and regulatory analysis.
  - Training curriculum includes IRB protocol
    drafting and HIPAA/GDPR compliance for OMOP/FHIR
    data.
  confidentiality_level: restricted
maintainers:
- name: Ciera McCrary
  role: researcher
  maintainer_details:
  - 'CHoRUS website contact: Ciera McCrary, MGH,
    Program Manager, cmccrary@mgh.havard.edu.'
- name: CHoRUS GitHub access contacts
  role: researcher
  maintainer_details:
  - 'GitHub overview request access contacts:
    dbold@emory.edu and jared.houghtaling@tuftsmedicine.org.'
- name: CHoRUS consortium
  role: academic_institution
  maintainer_details:
  - The project website describes 60+ CHoRUS consortium
    members across 20 institutions.
errata:
- name: Website spelling notice
  erratum_details:
  - The source text spells repository as repoitory
    in the website review notice and navigation
    text; content was not corrected in extracted
    factual fields.
updates:
  name: Ongoing Bridge2AI project updates
  frequency: Not specified in the source bundle
  update_details:
  - Project management overviews track data delivery
    statuses and dependencies; contributing sites
    provide regular status updates.
retention_limit:
  name: Retention not specified
  retention_details:
  - The source bundle does not specify data retention
    periods.
version_access:
  name: Controlled version access
  versions_available:
  - Current released dataset snapshot described
    on chorus4ai.org
  - As-of-August-2025 dataset snapshot described
    in webinar
  version_details:
  - The source bundle does not provide a version
    DOI or formal dataset version identifier.
extension_mechanism:
  name: Site contribution and repository workflow
  contribution_url: https://github.com/chorus-ai#table-of-contents
  extension_details:
  - Data site managers use Chorus_SOP workflows
    to extract and contribute data. Sites submit
    status updates through GitHub or Google Forms.
    Clinical collaborators contribute semantic
    mapping and validation.
variables:
- variable_name: demographics
  name: Demographics
  data_type: object
  is_sensitive: true
  measurement_technique: OMOP
  quality_notes:
  - Listed as an OMOP controlled-access data type.
- variable_name: medication_administration
  name: Medication administration
  data_type: object
  is_sensitive: true
  measurement_technique: OMOP
  quality_notes:
  - Dosing time-stamped upon each infusion change
    or dose administration.
- variable_name: procedures
  name: Procedures
  data_type: object
  is_sensitive: true
  measurement_technique: OMOP
  quality_notes:
  - Documented by providers.
- variable_name: nursing_flowsheets
  name: Nursing flowsheets
  data_type: object
  is_sensitive: true
  measurement_technique: OMOP
  quality_notes:
  - High-frequency documentation.
- variable_name: diagnoses
  name: Diagnoses
  data_type: object
  is_sensitive: true
  measurement_technique: OMOP
  quality_notes:
  - Documented by providers.
- variable_name: clinical_notes_tokens
  name: Tokenized clinical notes
  data_type: array
  is_sensitive: true
  measurement_technique: OHNLP toolkit
  quality_notes:
  - Notes are extracted and tokenized using OHNLP;
    notes are stored locally except tokens.
- variable_name: imaging_dicom
  name: Imaging
  data_type: object
  is_sensitive: true
  measurement_technique: DICOM
  quality_notes:
  - Imaging is from PACS and de-identification
    is in process for a larger cohort.
- variable_name: waveform_telemetry_wfdb
  name: Waveform telemetry
  data_type: array
  is_sensitive: true
  measurement_technique: WFDB
  quality_notes:
  - Telemetry comes from bedside monitors, gateway,
    or middleware.
- variable_name: waveform_eeg_edf_persyst
  name: Waveform EEG
  data_type: array
  is_sensitive: true
  measurement_technique: EDF+ and Persyst
  quality_notes:
  - EEG extraction is in process.
- variable_name: social_determinants_of_health
  name: Social determinants and geographic context
  data_type: object
  is_sensitive: true
  quality_notes:
  - NIH RePORTER states data elements include
    contextual factors such as geographic distance
    to nearest hospital and social determinants
    of health.
is_deidentified:
  name: De-identification and tokenization
  identifiable_elements_present: true
  method: Controlled access, tokenization, de-identification,
    and transformations to limit re-identification.
  identifiers_removed:
  - Clinical notes stored locally except tokens.
  - Imaging de-identification in process for larger
    cohort.
  deidentification_details:
  - The source describes approaches that limit
    re-identification and controlled access rather
    than claiming all modalities are fully de-identified.
is_tabular: false
citation: NIH RePORTER project 1OT2OD032701-01
