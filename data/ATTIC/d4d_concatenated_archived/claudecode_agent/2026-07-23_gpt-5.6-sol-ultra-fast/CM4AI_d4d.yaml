purposes:
  - name: AI-ready cell architecture
    response: >-
      Deliver machine-readable hierarchical maps of cell architecture and
      AI-ready multimodal input datasets with rich metadata, provenance, and
      validation.
  - name: Interpretable genotype-phenotype learning
    response: >-
      Enable visible machine-learning systems informed by multiscale cell and
      tissue architecture rather than opaque genotype-to-phenotype prediction.
  - name: Ethical biomedical AI
    response: >-
      Support ethical, explainable, FAIR biomedical AI research using
      nonclinical human-cell-line data.

tasks:
  - name: Protein-protein interaction mapping
    response: >-
      Measure protein interactions using affinity-purification mass
      spectrometry and size-exclusion chromatography mass spectrometry.
  - name: Spatial protein localization
    response: >-
      Measure subcellular protein localization using immunofluorescence
      staining and confocal microscopy.
  - name: Genetic perturbation mapping
    response: >-
      Measure transcriptional and fitness phenotypes with CRISPR/Cas9
      single-cell perturb-seq.
  - name: Multimodal cell-map construction
    response: >-
      Integrate interaction and image embeddings, detect protein communities
      across resolutions, and represent their containment as a hierarchical
      directed acyclic graph.

addressing_gaps:
  - name: Black-box genotype-phenotype models
    response: >-
      The project addresses the lack of mechanistic interpretability in models
      that predict phenotype from genotype.
  - name: Incomplete maps of cell architecture
    response: >-
      The project addresses incompletely charted cellular structure and
      function across disease-relevant cell types and perturbations.
  - name: AI-readiness and provenance
    response: >-
      The project addresses the need for FAIR datasets whose schemas,
      validation, software, provenance, and ethical limitations are resolvable
      for reliable AI use.

