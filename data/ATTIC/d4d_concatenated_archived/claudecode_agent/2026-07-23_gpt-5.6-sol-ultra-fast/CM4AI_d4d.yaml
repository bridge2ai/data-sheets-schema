    analysis_method: >-
      Compare assemblies to GO, CORUM, and HPA; use literature and LLM
      suggestions for previously undocumented assemblies; retain human final
      naming decisions.
    annotation_quality_details:
      - >-
        The peer-reviewed study reports median GPT-4 name confidence 0.92 for
        two known-assembly categories, 0.85 for previously undocumented
        assemblies, and 0.0 for random protein sets.

machine_annotation_tools:
  - name: GPT-4 assembly interpretation
    tools:
