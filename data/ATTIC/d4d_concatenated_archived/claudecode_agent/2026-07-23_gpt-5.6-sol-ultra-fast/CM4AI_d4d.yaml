id: https://cm4ai.org/data-releases/
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: >-
  CM4AI is the Functional Genomics Data Generation Project in the NIH
  Bridge2AI program. It produces ethical, AI-ready, machine-readable data about
  human cell architecture from protein-interaction mass spectrometry,
  immunofluorescence imaging, and CRISPR/Cas9 perturbation measurements, and
  integrates these modalities into hierarchical cell maps. The latest release
  identified by the current project page and curated manifest is the June 2026
  Data Release (Beta), DOI 10.18130/V3/HIGT4C. Exact file-level metadata in the
  selected source bundle is available for the distinct October 2025 release,
  DOI 10.18130/V3/K7TGEM, and is not attributed to the June 2026 release.
doi: 10.18130/V3/HIGT4C
download_url: https://doi.org/10.18130/V3/HIGT4C
page: https://cm4ai.org/data-releases/
