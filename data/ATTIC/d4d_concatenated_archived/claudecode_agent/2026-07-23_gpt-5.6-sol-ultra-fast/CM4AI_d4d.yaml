missing_data_documentation:
  - name: Release completeness
    missing_data_patterns:
      - Computed cell maps are absent from the selected October 2025 release.
      - Protein sets interrogated by SEC-MS, IF, and perturb-seq overlap incompletely.
      - Some related perturb-seq resources are under temporary pre-publication embargo.
    missing_data_causes:
      - The release is an interim beta release.
      - Modalities were generated over different protein sets and release schedules.
    handling_strategy: >-
      Analyze individual datasets with domain expertise, observe embargo scope,
      and use later quarterly releases for additions and updated maps.

