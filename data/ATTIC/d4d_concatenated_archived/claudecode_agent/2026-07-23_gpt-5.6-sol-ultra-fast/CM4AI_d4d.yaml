    - "FDA Regulated: No"
  description: >-
    The selected release explicitly reports no human subjects; the data derive
    from ethically sourced, de-identified human cell lines.

participant_privacy:
  - name: Cell-line de-identification
    anonymization_method:
      - Use of commercially available de-identified human cell lines.
    reidentification_risk:
      - >-
        The project preprint states that the nonclinical tissue-culture data
        cannot, with current knowledge, be matched to a human subject.
    privacy_techniques:
      - Distribution of de-identified cell-line measurements rather than clinical records.

preprocessing_strategies:
  - name: MuSIC multimodal integration
    preprocessing_details:
      - Download protein-interaction networks and immunofluorescence images.
      - Generate node2vec protein-interaction embeddings.
      - Generate image embeddings with a Human Protein Atlas deep-learning model.
      - Learn contrastive co-embeddings that preserve both modalities.
      - Detect protein communities and construct a hierarchical cell map.
    used_software:
      - id: https://github.com/idekerlab/cellmaps_pipeline
        name: Cell Mapping Toolkit
        url: https://github.com/idekerlab/cellmaps_pipeline
        license: BSD-3
      - id: https://github.com/eliorc/node2vec
        name: node2vec
        url: https://github.com/eliorc/node2vec
  - name: FAIRSCAPE AI-readiness packaging
    preprocessing_details:
      - Validate inputs and metadata for coherent pipeline computations.
      - Package data, software, metadata, identifiers, and provenance as RO-Crate.
      - Register persistent identifiers and compute evidence-graph provenance entailments.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        url: https://fairscape.github.io
        license: MIT
  - name: U2OS SEC-MS processing
    description: Processing for the distinct peer-reviewed U2OS resource.
    preprocessing_details:
      - >-
        Search DIA-PASEF data with DIA-NN 1.8.1.0 against the UniProt human
        proteome and contaminant sequences with a 1% precursor FDR.
      - Derive protein elution profiles and pairwise profile correlations across three replicates.

cleaning_strategies:
  - name: AP-MS quality control
    cleaning_details:
      - Sequence-validate clones.
      - Require detection and relative enrichment of each bait protein.
      - Exclude under-loaded runs using minimum peptide-spectrum-match and protein counts.
      - Apply CompPASS and CompPASS-Plus filtering with stated false-discovery-rate controls.
  - name: Cell and image quality control
    cleaning_details:
      - Test U2OS cultures for Mycoplasma contamination.
      - Authenticate U2OS cells by morphology, karyotyping, and PCR-based approaches.
      - Select the highest-scoring Human Protein Atlas antibody per protein.
  - name: June 2025 release revision
    cleaning_details:
      - Add RGB immunofluorescence images.
      - Correct RO-Crate metadata.
      - Change naming conventions.

labeling_strategies:
  - name: Cell-map assembly annotation
    data_annotation_platform:
      - Gene Ontology
      - CORUM
      - Human Protein Atlas
      - GPT-4
    data_annotation_protocol:
      - >-
        Human annotators worked in pairs during annotation jamborees and used
        known component overlap, literature curation, and LLM suggestions.
      - Human curators made the final naming determination.
    labeling_details:
      - >-
        In the distinct U2OS study, GPT-4 proposed confident names for 104 of
        144 previously undocumented assemblies before human review.

