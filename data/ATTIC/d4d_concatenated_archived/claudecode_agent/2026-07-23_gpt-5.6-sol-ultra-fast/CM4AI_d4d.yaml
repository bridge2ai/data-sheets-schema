    tool_descriptions:
      - >-
        Generated proposed assembly names, referenced rationale essays, and
        self-assessed confidence for the distinct U2OS cell-map study.
    tool_accuracy:
      - Human curators reviewed and made final naming determinations.

existing_uses:
  - name: Structural and functional genomics
    examples:
      - Structural modeling of protein complexes.
      - Assignment and experimental follow-up of unexpected protein functions.
      - Analysis of cell-type specificity and protein multi-localization.
      - Interpretation of paediatric cancer mutations at protein-assembly level.
    description: >-
      Demonstrated in the distinct peer-reviewed U2OS cell-map study rather
      than asserted for every CM4AI release file.
  - name: Interactive exploration
    examples:
