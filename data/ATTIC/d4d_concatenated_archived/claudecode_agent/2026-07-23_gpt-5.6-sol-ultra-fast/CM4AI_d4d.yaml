future_use_impacts:
  - name: Interpretable biomedical AI
    impact_details:
      - Enable visible neural networks informed by cell architecture.
      - Improve mechanistic interpretation of genotype-to-phenotype predictions.
      - Support research into cellular processes and disease-associated changes.
      - Provide reusable FAIR and provenance-rich data and software practices.

discouraged_uses:
  - name: Unqualified cross-modal interpretation
    discouragement_details:
      - Do not assume complete protein overlap among SEC-MS, IF, and perturb-seq.
      - Do not treat interim beta releases as completed final cell maps.
      - Use domain expertise for meaningful analysis.
  - name: Scope mixing
    discouragement_details:
      - Do not transfer October 2025 file counts or checksums to HIGT4C.
      - Do not merge U2OS study counts with MDA-MB-468/KOLF2.1J release counts.
      - Do not treat project-wide 21.4 TB as a release-level byte total.

intended_uses:
  - name: Functional genomics research
    examples:
      - AI-ready dataset analysis in functional genomics.
      - Cellular-process analysis.
    use_category:
      - research
  - name: AI model development
    examples:
      - AI-model training.
      - Interpretable genotype-phenotype learning.
    usage_notes: >-
      Observe release incompleteness, modality coverage, license terms, and
      nonclinical scope.
    use_category:
