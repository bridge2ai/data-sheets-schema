anomalies:
  - name: June 2026 release-page date mismatch
    anomaly_details:
      - >-
        The release page labels HIGT4C as the June 2026 release but displays
        17 June 2025.
      - >-
        The current manifest's curated official Dataverse metadata resolves
        publication to 17 June 2026 and records version-2 release time
        2026-07-15T20:28:19Z.

known_biases:
  - name: Cell-line representation bias
    bias_type: representation_bias
    bias_description: >-
      The release derives from commercially available de-identified human cell
      lines and does not represent all biological variants in the population at
      large.
    affected_subsets:
      - MDA-MB-468 data
      - KOLF2.1J data

known_limitations:
  - name: Interim release
    limitation_type: temporal_limitation
    limitation_description: The release is interim and not in completed final form.
    scope_impact: Data and metadata are expected to change or be augmented in later releases.
  - name: Computed maps absent from selected release
    limitation_type: scope_limitation
    limitation_description: Computed cell maps are not included in the selected October 2025 release.
    scope_impact: The release is most suitable for bioinformatics analysis of individual datasets.
  - name: Incomplete modality overlap
    limitation_type: integration_limitation
    limitation_description: >-
      SEC-MS, immunofluorescence imaging, and CRISPRi perturb-seq interrogate
      protein sets that overlap incompletely.
    scope_impact: Cross-modal integration cannot assume complete protein coverage.
  - name: Domain expertise required
    limitation_type: methodological_limitation
    limitation_description: Meaningful analysis requires domain expertise.
  - name: Temporary embargoes
    limitation_type: coverage_limitation
    limitation_description: Some related datasets are under temporary pre-publication embargo.
    scope_impact: Public archive coverage is narrower than the release-level description.

subpopulations:
  - name: Cell-line donor-origin metadata
    subpopulation_elements_present: true
    identification:
      - >-
        MDA-MB-468 was established from a metastatic pleural effusion of a
        51-year-old Black female with metastatic mammary adenocarcinoma.
      - >-
        KOLF2.1J was derived from a healthy male Northern European donor.
    distribution:
      - >-
        These are source cell-line characteristics, not a population sampling
        distribution and not evidence of population representativeness.

relationships:
  - name: Multimodal data relationship
    relationship_details:
      - >-
        AP-MS and SEC-MS measure protein-interaction structure,
        immunofluorescence measures spatial localization, and perturb-seq
        measures transcriptional and fitness consequences of genetic
        perturbation.
      - >-
        MuSIC integrates interaction and imaging embeddings and applies
        multiresolution community detection to produce hierarchical protein
        assemblies.
  - name: Release-scope relationship
    relationship_details:
      - >-
        HIGT4C is the latest June 2026 release; K7TGEM is the selected October
        2025 exact-inventory resource; F3TD5R, B35XWX, and DXWOS5 are
        explicitly historical releases.

acquisition_methods:
  - name: AP-MS acquisition
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    acquisition_details:
      - Affinity-purification mass spectrometry measures protein-protein interactions.
  - name: SEC-MS acquisition
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    acquisition_details:
      - >-
        Size-exclusion chromatography coupled to mass spectrometry provides
        proteome-wide complex and interaction profiles.
  - name: Immunofluorescence acquisition
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    acquisition_details:
      - >-
        Immunofluorescence staining and confocal microscopy measure protein
        localization with DAPI, calreticulin, tubulin, and protein-of-interest
        channels.
  - name: Perturb-seq acquisition
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    acquisition_details:
      - >-
        CRISPR/Cas9 single-cell perturbation screens measure transcriptional
        and fitness phenotypes.
  - name: Cell-map derivation
    was_directly_observed: false
    was_reported_by_subjects: false
    was_inferred_derived: true
    acquisition_details:
      - >-
        Protein interaction and image features are embedded, co-embedded, and
        clustered across resolutions to derive a hierarchy of protein
        assemblies.

collection_mechanisms:
  - name: Protein-interaction mass spectrometry
    mechanism_details:
      - AP-MS on endogenously tagged proteins under treated and untreated conditions.
      - SEC-MS for proteome-wide complex and interaction mapping.
  - name: Spatial proteomics imaging
    mechanism_details:
      - >-
        Automated fixation, permeabilization, antibody staining, and
        high-resolution confocal microscopy in MDA-MB-468 and KOLF2.1J cell
        systems.
  - name: Single-cell CRISPR screens
    mechanism_details:
      - >-
        CRISPR libraries and inducible dCas9 cell lines followed by
        single-cell sequencing.

sampling_strategies:
  - name: Targeted disease-relevant cell-map sampling
    is_sample: true
    is_random: false
    source_data:
      - MDA-MB-468 cells untreated or treated with paclitaxel or vorinostat
      - KOLF2.1J iPSCs in parental and differentiated states
    is_representative: false
    why_not_representative:
      - >-
        Commercially available de-identified cell lines do not represent all
        biological variants in the population at large.
    strategies:
      - >-
        Target chromatin modifiers, metabolic enzymes, and other proteins
        relevant to cancer, neuropsychiatric, and cardiac disorders.
      - Use matched modalities where available across cell types and conditions.

