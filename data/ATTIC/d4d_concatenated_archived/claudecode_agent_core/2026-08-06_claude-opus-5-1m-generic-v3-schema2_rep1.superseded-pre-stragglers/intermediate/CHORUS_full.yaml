id: https://chorus4ai.org/dataset
name: CHoRUS Dataset
title: >-
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution, controlled-access critical care
  dataset generated by the Patient-Focused Collaborative Hospital Repository Uniting
  Standards (CHoRUS) for Equitable AI project, one of four data generation projects in the
  NIH Common Fund Bridge2AI consortium. Data are collected retrospectively from 14
  data-acquisition hospitals within a network of 20 academic centers and harmonized to the
  OMOP Common Data Model, alongside clinical notes extracted and tokenized with the OHNLP
  toolkit, DICOM imaging from PACS, WFDB waveform telemetry from bedside monitors, and
  EDF+/Persyst EEG waveforms. The current released dataset comprises 50,000 patient
  admissions from ICU, PICU, and NICU settings, including 1.6 billion rows of EHR OMOP
  data, 7,642 admissions with radiology data, and 23 Tb of waveform data; the anticipated
  final dataset covers 100,000 patient admissions across 9 data modalities. A holdout test
  set is sequestered for external validation of AI models.
page: https://chorus4ai.org/
publisher: https://chorus4ai.org/
status: >-
  Under active development. A current released dataset is available under controlled access
  within the Bridge2AI AI/ML for Clinical Care Collaborative Cloud, with an anticipated
  final dataset of 100,000 patient admissions; imaging de-identification for a larger cohort
  and EEG extraction were in process as of September 2025.
conforms_to: OMOP Common Data Model (OHDSI)
was_derived_from: >-
  Electronic health record systems, PACS imaging archives, bedside monitor telemetry
  gateways/middleware, and hospital EEG databases at 14 data-contributing hospitals.
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - artificial intelligence
  - machine learning
  - AI-ready dataset
  - Bridge2AI
  - OMOP Common Data Model
  - electronic health record
  - clinical notes
  - medical imaging
  - waveform telemetry
  - electroencephalography
  - social determinants of health
  - multimodal data
  - equitable AI
notes: >-
  CHoRUS is one of four data generation projects in the NIH Common Fund Bridge2AI
  consortium. The CHoRUS Network spans 20 academic centers, of which 14 contribute as data
  acquisition centers, with 60+ consortium members. The project is funded by NIH award
  OT2OD032701 (application ID 10472824, project number 1OT2OD032701-01), $5,880,300 in
  fiscal year 2022, with a project period of 2022-09-01 to 2026-11-30 and Eric S. Rosenthal
  (Massachusetts General Hospital) as principal investigator. Sources differ on the current
  dataset size: the CHoRUS project website reports a current released dataset of 50,000
  patient admissions, while the September 2025 AIM-AHEAD informational webinar reports over
  45,000 unique admissions across 14 hospitals as of August 2025. The project website
  carries the notice "This repoitory is under review for potential modification in
  compliance with Administration directives" [sic] and states that its content is solely the
  responsibility of the authors and does not necessarily represent the official views of the
  NIH. Program contact listed on the website: Ciera McCrary, MGH Program Manager
  (cmccrary@mgh.havard.edu, as printed).

