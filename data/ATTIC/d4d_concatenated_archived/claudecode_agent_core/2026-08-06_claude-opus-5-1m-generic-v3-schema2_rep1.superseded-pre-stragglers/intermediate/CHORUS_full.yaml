distribution_formats:
  - notes: >-
      OMOP Common Data Model tables for demographics, medication administration, procedures,
      nursing flowsheets, and diagnoses (OMOP schema, with extensions for nursing flowsheets).
  - notes: >-
      Tokenized clinical note output conforming to the OHNLP open-source schema.
  - notes: DICOM imaging conforming to the DICOM schema.
  - notes: WFDB waveform telemetry conforming to an extended PhysioNet schema.
  - notes: EEG waveforms in EDF+ and Persyst formats.

distribution_dates:
  - notes: >-
      A current released dataset (50,000 patient admissions from ICU, PICU, and NICU) was
      available at the time of documentation; the September 2025 informational webinar reported
      the dataset covering 14 hospitals with over 45,000 unique admissions as of August 2025.
      An anticipated final dataset of 100,000 patient admissions across 9 modalities is planned.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is shared beyond the creating consortium under controlled access. Users
      register (name, email, institution) and must sign a licensing agreement included in the
      registration form before gaining access; access and compute are then provisioned in the
      Bridge2AI AI/ML for Clinical Care Collaborative Cloud and confirmed by email. Training
      program participants need a ".edu" email address to gain access, though program
      administrators will assist with access if needed. Access requests can also be directed to
      dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.

license_and_use_terms:
  license_terms: >-
    Controlled access for all data modalities. All users must complete a registration form and
    sign a licensing agreement before gaining access to the dataset; access is granted together
    with provisioned compute in the Bridge2AI AI/ML for Clinical Care Collaborative Cloud
    enclave.
  contact_person: >-
    CHoRUS access requests: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org
  notes: >-
    A ".edu" email address is required to gain access to the dataset in the context of the
    AIM-AHEAD Bridge2AI for Clinical Care Training Program; this is stated not to be a barrier
    to acceptance into the program.

ip_restrictions:
  restrictions: >-
    Software published by the CHoRUS GitHub organization is licensed under the MIT License
    (the Chorus_SOP documentation site is listed under Apache-2.0, and the chorus-extract-upload,
    chorus_waveform, and UF-Geocoding repositories under MIT). The clinical dataset itself is
    controlled access and governed by a separate licensing agreement signed at registration.
  notes: >-
    The CHoRUS project website states that content on the website is solely the responsibility
    of the authors and does not necessarily represent the official views of the NIH.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions: >-
    The project establishes a legal framework for collecting clinical data at scale and analyzes
    the existing legal and regulatory landscape as part of its Ethics pillar. The project website
    carries a notice that the repository is under review for potential modification in compliance
    with Administration directives.
  notes: >-
    All data modalities are released under controlled access. Compliance topics addressed in the
    dataset user curriculum include IRB protocol drafting, HIPAA/GDPR compliance for OMOP/FHIR
    data, and QA audit frameworks.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset is derived from the clinical records of critically ill patients and comprises
      demographics, diagnoses, medication administration, procedures, nursing flowsheets,
      tokenized clinical notes, radiology imaging, telemetry waveforms, and EEG waveforms, along
      with social determinants of health and geographic contextual factors such as distance to
      the nearest hospital. Admissions include pediatric (PICU) and neonatal (NICU) patients.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      All data types are released under controlled access. Full-text clinical notes are not
      released and are stored locally at contributing sites, with only tokens available in the
      enclave. Imaging is released only after de-identification, which was in process for the
      larger cohort as of September 2025. Community-facing ethics focus groups are used to
      determine what data is appropriate for public sharing.

is_deidentified:
  method: >-
    Tokenization of unstructured EHR text using the OHNLP toolkit; transformation of data using
    approaches that limit re-identification; DICOM de-identification (CTP-deid tooling) prior to
    imaging release; automated privacy scanning of medical records (privacy_scan_tool).
  deidentification_details: >-
    De-identification is applied before data enter the controlled-access enclave. As of September
    2025, 1,000 images were available with de-identification in process for a larger imaging
    cohort. Clinical notes remain stored locally at contributing sites and are represented in the
    enclave only by tokens.

participant_privacy:
  - anonymization_method: >-
      Tokenization of unstructured clinical text and transformation approaches that limit
      re-identification, applied before data are made available in the shared enclave.
    privacy_techniques: >-
      Local retention of full-text clinical notes at contributing sites; DICOM de-identification
      pipeline (CTP-deid); automated privacy scanning of medical records (privacy_scan_tool);
      controlled-access cloud enclave with registration and signed licensing agreement.
    notes: >-
      Patient-focused efforts determine the ethical and legal approaches used to manage privacy
      and bias, accounting for social determinants of health.

data_protection_impacts:
  - impact_details: >-
      Community-facing ethics focus groups are performed to determine what data is appropriate
      for public sharing, and patient-focused legal and ethical research determines the
      approaches used to manage privacy and bias while accounting for social determinants of
      health.
    notes: >-
      The CHoRUS consortium evaluates community perspectives on clinical care AI to find ways to
      increase trustworthiness of provenance and privacy in AI, and analyzes the existing legal
      and regulatory landscape.

ethical_reviews:
  - reviewing_organization: >-
      CHoRUS Ethics pillar (Ethical and Trustworthy AI), CHoRUS consortium
    review_details: >-
      Ethics is one of the three pillars of the CHoRUS data generation project, alongside Data
      and People. The pillar performs community-facing ethics focus groups to determine what data
      is appropriate for public sharing, conducts legal and ethical research to manage privacy and
      bias, and analyzes the existing legal and regulatory landscape to create new approaches for
      trustworthy clinical care AI.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      The dataset is assembled from admissions at 14 participating data acquisition hospitals
      within a 20-institution academic network, and the project explicitly identifies the
      management of bias as a patient-focused objective of its ethical and legal work.
    mitigation_strategy: >-
      Federated access enables sampling methods intended to ensure a balanced and diverse cohort;
      sampling targets comprehensive sets of patient conditions and clinical treatment strategies;
      data elements account for social determinants of health and contextual factors such as
      geographic distance to the nearest hospital.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Several modalities were incomplete at the time of documentation: imaging was limited to
      approximately 1,000 available images with de-identification in process for a larger cohort,
      EEG extraction was still in process, and full-text clinical notes are available only as
      tokens because the notes themselves are stored locally at contributing sites.
    scope_impact: >-
      Analyses requiring full-text notes, large-scale imaging cohorts, or EEG data are constrained
      relative to the anticipated final dataset.
    recommended_mitigation: >-
      Consult the modality tables and metadata schemas, some of which were marked as planned, and
      track ongoing releases toward the anticipated final dataset.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers admissions to intensive care settings (ICU, PICU, NICU) at 14
      contributing hospitals within a network of 20 U.S. academic centers, and is oriented to
      acute and critical illness.
    scope_impact: >-
      Findings may not extend to non-critical-care settings or to hospitals outside the
      contributing network.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data collection is retrospective; the dataset comprises previously recorded clinical
      records rather than prospectively or real-time collected data.

intended_uses:
  - use_category: Model development for acute and critical care
    examples:
      - Characterizing acute and critical care illness
      - Predicting complications and deterioration
      - Measuring treatment response
    usage_notes: >-
      The dataset was generated specifically to enable ML/AI applications for patients with acute
      or critical illness.
  - use_category: External validation of AI models
    examples:
      - Evaluating externally developed models against the sequestered holdout test set
    usage_notes: >-
      The holdout test set is accessible for model external validation to aid marketplace adoption
      of AI-developed models for implementation in acute and critical care.
  - use_category: Training and education
    examples:
      - AIM-AHEAD Bridge2AI for Clinical Care Training Program hands-on training
      - Canonical AI/ML for Clinical Care Jupyter Notebooks
      - Workshops on the OHDSI/OMOP common data model and OHDSI tool stack
    usage_notes: >-
      Trainees use the dataset within the Bridge2AI AI/ML for Clinical Care Collaborative Cloud to
      develop practical use cases and conduct collaborative research.
  - use_category: Best-practice and standards development for health AI
    usage_notes: >-
      The dataset and its accompanying tools and SOPs are intended to help establish best practices
      for ethically sourced data and AI in health across the Bridge2AI consortium.

existing_uses:
  - examples:
      - Training activities within the AIM-AHEAD Bridge2AI for Clinical Care Training Program
      - Publications
    notes: >-
      As reported in the September 2025 AIM-AHEAD informational webinar, CHoRUS datasets are being
      used for training activities and publications. Cohort 2 of the training program (up to 30
      trainees, program period November 17, 2025 to July 31, 2026) uses the dataset for use-case
      development, poster presentations, conference abstracts, and manuscripts.

other_tasks:
  - task_details: >-
      Downstream analytics on the mapped and assembled dataset by clinical collaborators, who are
      invited to reach out to the CHoRUS contacts to get involved.
  - task_details: >-
      Development and presentation of trainee-defined practical use cases in Bridge2AI data topics,
      including generative AI use cases, on the Bridge2AI Clinical Care Cloud platform.

future_use_impacts:
  - impact_details: >-
      The sequestered holdout test set is expected to aid marketplace adoption of AI-developed
      models for implementation in acute and critical care by enabling independent external
      validation.
  - impact_details: >-
      The project anticipates that the dataset, together with its tools, standards, and education
      efforts, will catalyze biomedical research and expertise needed to promote patient-focused
      deployment of AI in acute and critical care and improve recovery from acute illness.
  - impact_details: >-
      Because the data derive from patient clinical records, the project pairs future use with
      methods intended to promote privacy, accountability, and clinical benefit, and with community
      consultation about what data is appropriate for sharing.

