purposes:
  - response: >-
      Develop a publicly available, AI-ready critical care dataset to support machine
      learning and artificial intelligence applications for patients with acute or critical
      illness.
  - response: >-
      Develop the network, tools, standards, data, and education needed to build ML/AI-derived
      models that improve the care and outcomes of patients requiring critical care.
  - response: >-
      Ensure that the methods used to generate the dataset promote privacy, accountability,
      and clinical benefit.
  - response: >-
      Provision a sequestered holdout test set accessible for external validation of models,
      to aid marketplace adoption of AI-developed models for implementation in acute and
      critical care.
  - response: >-
      As one of four Bridge2AI data generation projects, create ethically sourced datasets and
      tools around artificial intelligence and establish best practices for AI in health.
  - response: >-
      Cultivate expertise and AI literacy in the lay and scientific community and develop a
      next generation of diverse academic and community AI scientists and clinicians.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: >-
      Predicting complications and clinical deterioration among patients with acute or
      critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of AI/ML models against the sequestered holdout test set.
  - response: >-
      Labeling clinical data with targets important for prediction within a visualization and
      annotation environment.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and
      machine learning in critical care; developing high-resolution multi-center data sets is
      a critical first step towards actionable and trustworthy AI.
  - response: >-
      Multi-modal clinical data (EHR, waveform, imaging, and text) lack harmonization; unified
      standards are needed to make such data interoperable and AI-ready.
  - response: >-
      A legal framework for collecting clinical data at scale is lacking; the project
      establishes such a framework and analyzes the existing legal and regulatory landscape to
      manage privacy and bias while accounting for social determinants of health.
  - response: >-
      Independent validation data for clinical AI models are scarce; a sequestered holdout
      test set is provisioned to enable external validation and marketplace adoption.
  - response: >-
      The workforce gap in clinical AI is addressed through multimodal educational approaches
      to train engineers, data scientists, and clinicians.

instances:
  - instance_type: Patient hospital admission
    counts: 50000
    data_topic: Acute and critical illness
    data_substrate: >-
      Multimodal clinical record combining structured EHR data, tokenized clinical notes,
      imaging, and physiologic waveforms
    missing_information: >-
      Full-text clinical notes are stored locally at contributing sites and are not present in
      the enclave except as tokens; imaging and EEG modalities were not yet complete at the
      time of documentation.
    notes: >-
      Current released dataset per the CHoRUS project website: 50,000 patient admissions from
      ICU, PICU, and NICU. The September 2025 AIM-AHEAD webinar reports over 45,000 unique
      admissions across 14 hospitals as of August 2025. The anticipated final dataset is
      100,000 patient admissions; the NIH project abstract describes acquiring an AI-ready
      data set from more than 100,000 critically ill patients.
  - instance_type: Structured EHR record row in the OMOP Common Data Model
    counts: 1600000000
    data_substrate: Tabular OMOP CDM records
    notes: >-
      The current released dataset contains 1.6 billion rows of EHR OMOP data covering
      demographics, medication administration, procedures, nursing flowsheets, and diagnoses.
  - instance_type: Admission with radiology imaging data
    counts: 7642
    data_substrate: DICOM images exported from hospital PACS
    notes: >-
      The current released dataset reports 7,642 admissions with radiology data. As of the
      September 2025 webinar, 1,000 images were available with de-identification in process
      for a larger cohort.
  - instance_type: Waveform recording
    data_substrate: >-
      WFDB waveform telemetry from bedside monitors and gateway/middleware; EDF+ and Persyst
      EEG waveforms from hospital databases
    notes: >-
      The current released dataset reports 23 Tb of waveform data. EEG extraction was in
      process as of September 2025.

subsets:
  - id: https://chorus4ai.org/dataset#holdout-test-set
    name: CHoRUS holdout test set
    description: >-
      A sequestered holdout test set provisioned by the CHoRUS data generation project and
      made accessible for external validation of models, intended to aid marketplace adoption
      of AI-developed models for implementation in acute and critical care.
    is_data_split: true

splits:
  - split_details: >-
      The dataset provisions a holdout test set that is sequestered from the distributed data
      and made accessible for external model validation.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Care-setting subpopulations are identifiable: the current released dataset comprises
      patient admissions from adult ICU, pediatric ICU (PICU), and neonatal ICU (NICU)
      settings.
    notes: >-
      Pediatric and neonatal intensive care admissions are included among the released
      admissions.
  - subpopulation_elements_present: true
    identification: >-
      Demographic subpopulations are identifiable through the OMOP demographics tables, and
      the project ensures that data elements feature contextual factors such as social
      determinants of health and geographic distance to the nearest hospital.
    notes: >-
      The project aims to acquire a data set of unprecedented diversity and applies federated
      sampling to ensure a balanced and diverse cohort.

acquisition_methods:
  - was_directly_observed: true
    was_validated_verified: true
    acquisition_details: >-
      Retrospective extraction of clinical data already recorded during care at 14 data
      acquisition hospitals, from electronic health record systems, PACS imaging archives,
      bedside monitor telemetry gateways/middleware, and hospital EEG databases, followed by
      standardization to the OMOP Common Data Model and transformation using approaches that
      limit re-identification.
    notes: >-
      Semantic mappings used in the transformation undergo clinical validation via the
      chorus-mapping repository and its associated clinical validation SOP; SOP documents
      undergo internal validation and review within the Chorus_SOP repository.

collection_mechanisms:
  - mechanism_details: >-
      Extraction of structured electronic health record data (demographics, medication
      administration with dosing time-stamped at each infusion change or dose administration,
      procedures, nursing flowsheets, and diagnoses) from hospital EHR systems and
      standardization to the OMOP Common Data Model.
  - mechanism_details: >-
      Export of imaging studies from hospital PACS in DICOM format.
  - mechanism_details: >-
      Capture of waveform telemetry from bedside monitors via gateway/middleware, delivered in
      WFDB format.
  - mechanism_details: >-
      Extraction of EEG waveforms from hospital EEG databases in EDF+ and Persyst formats.
  - mechanism_details: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit,
      producing output in the OHNLP open-source schema.
  - mechanism_details: >-
      Site-side software tooling for building and submitting data extracts, including the
      chorus-extract-upload repository (tools to create and upload a CHoRUS Data Extract) and
      dockerized container applications (chorus-container-apps) deployed to support CHoRUS
      services on Azure.

data_collectors:
  - collector_details: >-
      Fourteen data acquisition centers within the CHoRUS Network of 20 academic centers
      contribute clinical data extracts; site data managers follow the step-by-step workflow
      and validated standard operating procedures published in the Chorus_SOP repository.
    role: academic_institution
    notes: >-
      Data contributing sites provide regular status updates on their extract progress via the
      GitHub interface or a Google Form, which populate the Standards Project and Data
      Acquisition Project boards.
  - collector_details: >-
      CHoRUS sub-teams for Standards, Data Acquisition, and Tooling within the CHoRUS data
      generation project support extraction, mapping, and delivery and maintain
      context-specific discussion boards for site issues.
    role: academic_institution

direct_collection:
  - is_direct: false
    collection_details: >-
      Data were not collected directly from individuals for this dataset; they were obtained
      retrospectively from existing hospital clinical information systems (EHR, PACS, bedside
      monitoring, EEG databases) at 14 contributing hospitals.

collection_timeframes:
  - timeframe_details: >-
      Retrospective data collection from existing hospital records. As of August 2025 the
      dataset covered 14 different hospitals with over 45,000 unique admissions; the NIH award
      period supporting collection runs from 2022-09-01 to 2026-11-30.

sampling_strategies:
  - is_sample: true
    source_data: >-
      Electronic health records, imaging archives, and physiologic monitoring data of patients
      admitted to intensive care units at 14 contributing hospitals.
    strategies: >-
      Federated access enables sampling methods intended to ensure a balanced and diverse
      cohort; sampling is designed to capture comprehensive sets of patient conditions and
      clinical treatment strategies.

raw_data_sources:
  - source_description: >-
      Hospital electronic health record systems at 14 data-contributing hospitals, supplying
      demographics, medication administration, procedures, nursing flowsheets, and diagnoses.
    source_type: Hospital electronic health record system
    raw_data_format: OMOP Common Data Model tables
    access_details: Controlled access; delivered into the CHoRUS cloud enclave.
  - source_description: >-
      Hospital PACS imaging archives at contributing hospitals.
    source_type: Picture archiving and communication system (PACS)
    raw_data_format: DICOM
    access_details: >-
      Controlled access; 1,000 images available as of September 2025 with de-identification in
      process for a larger cohort.
  - source_description: >-
      Bedside physiologic monitors with gateway/middleware at contributing hospitals.
    source_type: Bedside monitoring and telemetry middleware
    raw_data_format: WFDB (PhysioNet schema extended)
    access_details: Controlled access; held in the CHoRUS enclave.
  - source_description: Hospital EEG databases at contributing hospitals.
    source_type: Clinical EEG database
    raw_data_format: EDF+ and Persyst
    access_details: Controlled access; extraction in process as of September 2025.
  - source_description: >-
      Unstructured clinical note repositories within contributing hospital EHR systems.
    source_type: Clinical documentation repository
    raw_data_format: OHNLP open-source schema (extracted and tokenized text)
    access_details: >-
      Clinical notes are stored locally at contributing sites; only tokens are made available
      in the enclave.

raw_sources:
  - raw_data_details: >-
      Source clinical records remain in hospital source systems at the contributing sites.
      Full-text clinical notes are retained locally at the sites rather than transferred to the
      shared enclave; only tokenized representations are transferred.

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of structured EHR data to the OMOP Common Data Model, using ongoing and
      new standardization practices and validated semantic mappings to international standards.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured electronic health record text using the OHNLP
      toolkit.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification prior to release
      into the controlled-access enclave.
  - preprocessing_details: >-
      Conversion of physiologic waveforms into shareable formats using the waveform conversion
      scripts and documentation in the chorus_waveform repository and supporting resources in
      chorus_waveform_resources.
  - preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss using the open-source UF-Geocoding
      tooling, supporting contextual and social-determinants-of-health data elements.

cleaning_strategies:
  - cleaning_details: >-
      Characterization reports are produced from submitted site data and returned to the
      contributing sites (CHoRUSReports repository) so that submission issues can be identified
      and resolved.
  - cleaning_details: >-
      Semantic mappings are pooled and clinically validated through the chorus-mapping
      repository and its associated clinical validation SOP; SOP documents undergo internal
      validation and review within the Chorus_SOP repository before publication.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is being developed to label data with targets
      important for prediction; the project develops capabilities across the multi-center
      network to acquire, standardize, tokenize, store, visualize, and label data.
    data_annotation_platform: CHoRUS visualization and annotation environment

machine_annotation_tools:
  - tools:
      - OHNLP toolkit
    tool_descriptions: >-
      The OHNLP toolkit is used to extract and tokenize unstructured clinical notes, producing
      output conforming to the OHNLP open-source schema.

missing_data_documentation:
  - missing_data_patterns: >-
      Full-text clinical notes are absent from the enclave and represented only by tokens;
      imaging was limited to approximately 1,000 released images as of September 2025; EEG
      waveform data extraction was still in process; published metadata schemas were marked as
      planned for some modalities while others already had published schemas.
    missing_data_causes: >-
      Modality-specific de-identification and extraction work still in progress, and local
      retention of full-text clinical notes at contributing sites for privacy reasons.
    handling_strategy: >-
      Progressive release: de-identification of a larger imaging cohort and EEG extraction were
      under way, and metadata schema publication is planned for the remaining modalities.

variables:
  - variable_name: Geographic distance to the nearest hospital
    notes: >-
      The project ensures that data elements feature appropriate contextual factors such as
      geographic distance to the nearest hospital.
  - variable_name: Social determinants of health
    notes: >-
      Social determinants of health are among the data types acquired and standardized across
      the multi-center network, and are accounted for in the project's approaches to managing
      privacy and bias.

