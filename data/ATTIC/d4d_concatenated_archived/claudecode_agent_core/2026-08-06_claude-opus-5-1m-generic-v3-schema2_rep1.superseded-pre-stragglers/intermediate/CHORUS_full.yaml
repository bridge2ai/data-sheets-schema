      CHoRUS data access and inquiry contacts listed in the chorus-ai GitHub organization README:
      dbold@emory.edu and jared.houghtaling@tuftsmedicine.org.
    role: academic_institution
  - maintainer_details: >-
      Maintainers and versions of CHoRUS software packages are tracked on the CHoRUS package status
