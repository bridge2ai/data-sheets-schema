    role: academic_institution

updates:
  update_details: >-
    The dataset is growing from the current released 50,000 patient admissions toward an anticipated
    final dataset of 100,000 patient admissions covering 9 data modalities from 14 contributing
    hospitals. De-identification of a larger imaging cohort and extraction of EEG waveforms were in
    process as of September 2025, and published metadata schemas are planned for the modalities where
    they are not yet available.
  notes: >-
    Data contributing sites provide regular status updates on their progress in creating and curating
    CHoRUS data extracts, submitted through the GitHub interface or a Google Form that triggers a
    GoogleScript to update GitHub issue and status information in the Standards Project and Data
    Acquisition Project boards.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Clinical collaborators can contribute to semantic mapping and validation through the
    chorus-mapping repository, which holds documentation and pooled tabular mappings along with an
    associated clinical validation SOP. Data site managers contribute extracts by following the
    interactive workflow diagram and SOP documents on the Chorus_SOP page, and can post issues to the
    Standards Discussions or Data Acquisition Discussions boards. Software contributors and users are
    directed to the web guide compiled in the chorus-developer repository.

external_resources:
  - external_resources:
      - https://chorus4ai.org/
      - https://github.com/chorus-ai
      - https://www.bridge2ai.org/chorus
      - https://reporter.nih.gov/project-details/10472824
    notes: >-
      The CHoRUS project website (chorus4ai.org) provides project overview, tools, data acquisition,
      standards, community engagement, ethics, dataset, and learning-resource pages. The chorus-ai
      GitHub organization (37 followers, 28 repositories, 3 projects) houses software and tooling for
      interacting with clinical data, validated semantic mappings, standard operating protocols for
      contributing sites, and project management overviews; notable repositories include
      chorus-container-apps, Chorus_SOP, chorus_waveform, chorus_waveform_resources,
      chorus-extract-upload, chorus-apps-internal, CHoRUSReports, CTP-deid, UF-Geocoding,
      privacy_scan_tool, CADA, data_acq_SOP, and cloud_public. Top languages are JavaScript, Python,
      Jupyter Notebook, CSS, and MDX. The NIH RePORTER record documents the funding award.