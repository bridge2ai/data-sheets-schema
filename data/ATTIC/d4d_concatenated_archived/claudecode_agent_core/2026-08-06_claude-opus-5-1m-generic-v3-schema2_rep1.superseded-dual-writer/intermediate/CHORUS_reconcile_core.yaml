id: https://chorus4ai.org/dataset
name: CHoRUS Dataset
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  The CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards) dataset is a
  multi-center, multimodal, high-resolution, controlled-access critical care dataset assembled by the
  CHoRUS Network as one of four data generation projects within the NIH Bridge2AI consortium. The
  consortium comprises more than 60 members across 20 academic institutions, of which 14 contribute as
  data acquisition centers. Data are collected retrospectively from hospital source systems and are
  standardized to the OMOP Common Data Model together with modality-specific standards (OHNLP for
  extracted and tokenized clinical notes, DICOM for imaging, WFDB for bedside telemetry waveforms, and
  EDF+/Persyst for EEG).

  Reported size figures differ between sources in the input bundle and are not reconciled here. The
  project website reports a current released dataset of 50,000 patient admissions from ICU, PICU and NICU
  settings, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data and 23 Tb of waveform
  data, against an anticipated final dataset of 100,000 patient admissions across 9 data modalities from
  14 contributing hospitals. A September 2025 informational webinar states that, as of August 2025, the
  dataset covered 14 different hospitals with over 45,000 unique admissions, with 1,000 images available
  and de-identification of a larger imaging cohort still in process, and EEG extraction still in process.

  OMOP and telemetry data reside in a cloud enclave; clinical notes are stored locally at contributing
  sites and only tokens are shared. The dataset is intended to support AI/ML research characterizing acute
  and critical care illness, predicting complications, and measuring treatment response, and provisions a
  sequestered holdout test set for external model validation.

  The Bridge2AI CHoRUS leadership team, as listed in the September 2025 informational webinar, comprises
  Eric Rosenthal (Massachusetts General Hospital), Azra Bihorac (University of Florida), Xiaoqian Jiang
  (UTHealth Houston), Yulia Strekalova (University of Florida), Parisa Rashidi (University of Florida) and
  Manlik Kwong (Tufts University). The project is funded under NIH award OT2OD032701 to Massachusetts
  General Hospital, with an award amount of $5,880,300 recorded for fiscal year 2022.
