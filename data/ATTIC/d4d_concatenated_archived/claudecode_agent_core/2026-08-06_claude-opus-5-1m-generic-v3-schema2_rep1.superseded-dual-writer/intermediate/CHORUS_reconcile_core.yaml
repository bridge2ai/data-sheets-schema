updates:
  update_details: >-
    The released dataset is growing toward an anticipated final dataset of 100,000 patient admissions
    across 9 data modalities from 14 contributing hospitals. De-identification of a larger imaging cohort
    and EEG extraction were in process as of August 2025, and metadata for several modalities was planned
    rather than published. Data contributing sites submit regular status updates through the GitHub
    interface or a Google Form, which are propagated automatically to the Standards Project and Data
    Acquisition Project boards.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Contributions are coordinated through the chorus-ai GitHub organization. Data site managers follow the
    interactive workflow diagram and validated standard operating procedures in the Chorus_SOP repository
    and raise issues in the Standards Discussions or Data Acquisition Discussions spaces. Clinical
    collaborators contribute semantic mappings through the chorus-mapping repository under a clinical
    validation SOP. Software developers use the chorus-developer web guide for contributing to and using
    CHoRUS packages. Community users are directed to the public project webpage.