acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Instances are retrospectively extracted from clinical care records and device data already
      recorded during hospital care: provider-documented procedures and diagnoses, nursing
      flowsheet documentation, time-stamped medication administration, PACS imaging, bedside
      monitor telemetry and hospital EEG recordings.
  - was_inferred_derived: true
    acquisition_details: >-
      Clinical note content is derived by extraction and tokenization with the OHNLP toolkit rather
      than released as source text; structured data are derived by transforming site source formats
      into the OMOP Common Data Model, and geographic context is derived by geocoding OMOP Location
      entities.

collection_mechanisms:
  - mechanism_details: >-
      Hospital electronic health record systems, from which structured data are extracted and
      standardized to the OMOP Common Data Model.
  - mechanism_details: Picture archiving and communication systems (PACS) for imaging.
  - mechanism_details: >-
      Bedside physiologic monitors with gateway/middleware capture for waveform telemetry.
  - mechanism_details: Hospital EEG databases for EEG waveform extraction.
  - mechanism_details: >-
      OHNLP toolkit used to extract and tokenize unstructured clinical notes.
  - mechanism_details: >-
      CHoRUS site tooling distributed through the chorus-ai GitHub organization, including
      chorus-extract-upload for creating and uploading a CHoRUS data extract, waveform conversion
      scripts (chorus_waveform), and dockerized container applications deployed on Azure
      (chorus-container-apps).

data_collectors:
  - role: academic_institution
    collector_details: >-
      Fourteen data-acquisition centers, drawn from a collaboration spanning 20 academic centers,
      contribute clinical data extracts to CHoRUS.
  - role: academic_institution
    collector_details: >-
      Site data managers at contributing hospitals follow the centralized CHoRUS standard operating
      procedures (Chorus_SOP) and the Data Acquisition module SOP to extract, curate and submit
      data, and report progress through GitHub issues or a Google Form linked to the GitHub API.
  - role: researcher
    collector_details: >-
      Clinical collaborators contribute clinical expertise to semantic mapping and validation via
      the chorus-mapping repository and its associated clinical validation SOP.

collection_timeframes:
  - timeframe_details: >-
      Retrospective data collection. As of August 2025 the assembled dataset covered 14 different
      hospitals with over 45,000 unique admissions; EEG extraction and de-identification of the
      larger imaging cohort were still in process at that time.
    notes: >-
      The supporting NIH award runs from 2022-09-01 to 2026-11-30; the source material does not
      state the calendar range of the clinical encounters themselves.

sampling_strategies:
  - is_sample: true
    strategies:
      - >-
        Sampling to ensure comprehensive sets of patient conditions and clinical treatment
        strategies across the contributing network.
      - >-
        Federated access enabling sampling methods to ensure a balanced and diverse cohort.
    notes: >-
      Sampling is performed over admissions from 14 data-acquisition hospitals within a 20-center
      academic network; ICU, PICU and NICU admissions are represented.

raw_data_sources:
  - source_description: >-
      Structured electronic health record data from contributing hospital systems (demographics,
      medication administration, procedures, nursing flowsheets, diagnoses).
    source_type: Hospital electronic health record system
    raw_data_format: Site-specific source formats, transformed to the OMOP Common Data Model
    access_details: Not released in source form; distributed only as standardized, controlled-access data.
  - source_description: Unstructured clinical notes from hospital electronic health records.
    source_type: Hospital electronic health record system
    raw_data_format: Free text
    access_details: >-
      Notes remain stored locally at the contributing sites; only tokens produced with the OHNLP
      toolkit are made available centrally.
  - source_description: Clinical imaging studies.
    source_type: Hospital picture archiving and communication system (PACS)
    raw_data_format: DICOM
    access_details: Controlled access following de-identification.
  - source_description: Continuous physiologic waveform telemetry from bedside monitors.
    source_type: Bedside monitors with gateway/middleware capture
    raw_data_format: WFDB
    access_details: Controlled access within the cloud enclave.
  - source_description: EEG recordings.
    source_type: Hospital EEG database
    raw_data_format: EDF+ and Persyst
    access_details: Controlled access; extraction in process as of August 2025.

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of acquired data to the OMOP Common Data Model, using ongoing and new
      standardization practices and validated semantic mappings maintained in the chorus-mapping
      repository.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit, so that
      tokens rather than source text are held centrally.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, including
      de-identification of imaging (CTP-deid) and privacy scanning of medical records
      (privacy_scan_tool).
  - preprocessing_details: >-
      Conversion of waveform data into standard formats using the CHoRUS waveform conversion scripts
      (chorus_waveform).
  - preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss (UF-Geocoding) to support contextual factors
      such as geographic distance to the nearest hospital and social determinants of health.

cleaning_strategies:
  - cleaning_details: >-
      Characterization reports are produced and returned to contributing sites following their data
      submissions (CHoRUSReports repository), supporting identification and resolution of data
      quality issues.
  - cleaning_details: >-
      Semantic mappings undergo clinical validation by clinical collaborators following a clinical
      validation SOP before being pooled into the shared tabular mappings.
  - cleaning_details: >-
      Standard operating procedures for data curation and delivery undergo internal validation and
      review within the Chorus_SOP repository; site status tracking is used to identify and resolve
      blocking issues.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is being developed to label data with targets
      important for prediction; the multi-center network is developing capabilities to acquire,
      standardize, tokenize, store, visualize and label data.
    data_annotation_platform: >-
      CHoRUS visualization and annotation environment within the cloud enclave.

machine_annotation_tools:
  - tools:
      - OHNLP toolkit
      - CTP-deid
      - privacy_scan_tool
      - DeGauss (UF-Geocoding)
    tool_descriptions:
      - Extraction and tokenization of unstructured clinical notes.
      - De-identification tooling maintained in the chorus-ai GitHub organization.
      - Privacy scan tool for medical records.
      - Open source code to geocode OMOP Location entities.
    notes: >-
      Tool accuracy figures are not reported in the source material.

missing_data_documentation:
  - missing_data_patterns: >-
      Imaging coverage was limited to approximately 1,000 images as of August 2025 while
      de-identification of a larger cohort was in process; EEG extraction was in process; published
      metadata was marked as planned rather than available for several modalities.
    missing_data_causes: >-
      Staged acquisition across a multi-center network, with de-identification and extraction
      pipelines completed at different times for different modalities.
    handling_strategy: >-
      Modalities are released as their extraction, de-identification and metadata publication steps
      complete; the released dataset is expected to grow toward the anticipated final dataset of
      100,000 admissions across 9 modalities.
  - missing_data_patterns: >-
      Full clinical note text is not present in the central enclave; only tokens extracted with the
      OHNLP toolkit are available, with source notes retained locally at contributing sites.
    handling_strategy: >-
      Tokenized representations are provided centrally to support text-based analyses while source
      notes remain at the originating site.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers acute and critical care admissions (ICU, PICU, NICU) at participating
      hospitals and is designed for questions about recovery from acute illness.
    scope_impact: >-
      Findings may not transfer to non-critical care settings or to care delivered outside the
      contributing hospitals.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities were fully available at the time of the reported release: imaging was
      limited to approximately 1,000 de-identified images and EEG extraction was still in process
      as of August 2025.
    recommended_mitigation: >-
      Confirm current modality availability at the time of access, since the release is being
      expanded toward the anticipated final dataset.
  - limitation_type: integration_limitation
    limitation_description: >-
      Clinical notes are stored locally at contributing sites and only tokens are available in the
      enclave, limiting analyses that require full note text alongside other modalities.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Data originate from 14 data-acquisition hospitals within a 20-center academic network in the
      United States.
    recommended_mitigation: >-
      The project applies federated sampling methods intended to ensure a balanced and diverse
      cohort and captures social determinants of health and contextual factors.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      The cohort is assembled from admissions at 14 data-acquisition hospitals drawn from 20
      academic centers, so cohort composition reflects the patient populations of those centers.
    mitigation_strategy: >-
      Federated access enabling sampling methods to ensure a balanced and diverse cohort; sampling
      to ensure comprehensive sets of patient conditions and clinical treatment strategies; and
      patient-focused ethical and legal work to determine approaches to manage privacy and bias
      while accounting for social determinants of health.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset consists of patient clinical data, including demographics, diagnoses, procedures,
      medication administration, nursing documentation, clinical notes, imaging, physiologic
      telemetry, EEG, and social determinants of health with geographic contextual factors such as
      distance to the nearest hospital.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      All nine data types are under controlled access. Clinical notes are not released as source
      text: they are stored locally at contributing sites and only OHNLP-derived tokens are held
      centrally. Community-facing ethics focus groups are used to determine what data is
      appropriate for public sharing.

is_deidentified:
  identifiable_elements_present: true
  method: >-
    Tokenization of unstructured clinical text with the OHNLP toolkit; transformation of data using
    approaches that limit re-identification; DICOM de-identification tooling (CTP-deid); automated
    privacy scanning of medical records (privacy_scan_tool).
  deidentification_details: >-
    De-identification is applied before central release under controlled access. As of August 2025,
    approximately 1,000 images were available with de-identification in process for a larger imaging
    cohort. Source clinical notes are retained locally at contributing sites, with only tokens
    released centrally.

human_subject_research:
  involves_human_subjects: true
  notes: >-
    The dataset comprises retrospectively collected clinical data from critically ill patients,
    including neonatal and pediatric intensive care admissions. The project establishes a legal
    framework for collecting data at scale and analyses the existing legal and regulatory landscape.

ethical_reviews:
  - reviewing_organization: >-
      CHoRUS consortium Ethics pillar (Ethical and Trustworthy AI)
    review_details: >-
      One of the project's three pillars is Ethics (Ethical and Trustworthy AI). The consortium
      performs community-facing ethics focus groups to determine what data is appropriate for public
      sharing, evaluates community perspectives on clinical care AI to increase trustworthiness of
      provenance and privacy, and analyses the existing legal and regulatory landscape to develop
      new approaches.

data_protection_impacts:
  - impact_details: >-
      The project establishes a legal framework for collecting data at scale and transforms data
      using approaches that limit re-identification; drawing on law, ethics, health services and
      biomedical science expertise, it assesses privacy and bias risks as part of the Ethical and
      Trustworthy AI pillar.

license_and_use_terms:
  license_terms: >-
    Access is controlled. Users register with name, email and institution, and all participants must
    sign a licensing agreement included in the registration form before gaining access to the
    dataset; access is then granted and compute provisioned. Access via the AIM-AHEAD Bridge2AI for
    Clinical Care training route additionally requires a ".edu" email address, though program
    administrators will assist with this access if needed.
  contact_person: >-
    Data access requests: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org

ip_restrictions:
  restrictions: >-
    The chorus-ai software project is licensed under the MIT License (individual repositories also
    carry MIT or Apache-2.0 licenses). The dataset itself is not openly licensed: it is
    controlled-access and requires a signed licensing agreement.

regulatory_restrictions:
  confidentiality_level: restricted
  governance_committee_contact: >-
    dbold@emory.edu; jared.houghtaling@tuftsmedicine.org
  notes: >-
    All data types are listed with controlled access control. The project website states the
    repository is under review for potential modification in compliance with Administration
    directives.

distribution_formats:
  - notes: >-
      Structured electronic health record data (demographics, medication administration, procedures,
      nursing flowsheets, diagnoses) are distributed in the OMOP Common Data Model within the cloud
      enclave.
  - notes: >-
      Clinical notes are distributed as OHNLP-derived tokens; the source notes remain stored locally
      at the contributing sites.
  - notes: Imaging is distributed in DICOM format.
  - notes: >-
      Waveform telemetry is distributed in WFDB format within the enclave, following an extended
      PhysioNet schema.
  - notes: EEG waveforms are distributed in EDF+ and Persyst formats.

distribution_dates:
  - notes: >-
      A released, controlled-access dataset existed as of August 2025, covering 14 hospitals and
      over 45,000 unique admissions; the project website describes a current released dataset of
      50,000 admissions alongside an anticipated final dataset of 100,000 admissions. Specific
      release dates are not stated in the source material.

intended_uses:
  - usage_notes: >-
      Development of machine learning and AI models that characterize acute and critical care
      illness, predict complications, and measure treatment response among patients with acute or
      critical illness.
  - usage_notes: >-
      External validation of AI models against the sequestered holdout test set, to support
      marketplace adoption and implementation of models in acute and critical care.
  - usage_notes: >-
      Hands-on AI/ML training and education, including use in canonical Jupyter Notebooks, OHDSI/OMOP
      common data model workshops, and trainee use cases on the Bridge2AI AI/ML for Clinical Care
      Collaborative Cloud.
  - usage_notes: >-
      Research on equity and context in clinical AI, using social determinants of health and
      contextual data elements such as geographic distance to the nearest hospital.

existing_uses:
  - examples:
      - >-
        AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2), which expands access to
        CHoRUS data through engagement, AI training and mentorship, with up to 30 trainees selected
        and a program period from November 2025 to July 2026.
      - >-
        Trainee research outputs, including works-in-progress posters at the Bridge2AI Annual Meeting
        (May 2026) and the AIM-AHEAD Annual Meeting (July 2026), conference abstracts, and manuscripts.
    notes: >-
      The Cohort 2 webinar states that the datasets are being used for training activities and
      publications.

other_tasks:
  - task_details: >-
      Downstream analytics on the mapped and assembled dataset by clinical collaborators, who are
      invited to reach out to the CHoRUS contacts to get involved.
  - task_details: >-
      Development and evaluation of standards, semantic mappings and tooling for interoperable
      multi-modal clinical data, supported by the CHoRUS SOPs, mappings and open-source packages.

future_use_impacts:
  - impact_details: >-
      The dataset is intended to catalyze patient-focused deployment of AI in acute and critical
      care and to aid marketplace adoption of AI-developed models via the externally accessible
      holdout test set.
  - impact_details: >-
      Because the data are derived from critically ill patients, the project pairs data generation
      with legal and ethical research on privacy, bias, accountability and trustworthiness, and with
      community engagement to determine what data is appropriate for public sharing.

updates:
  update_details: >-
    The released dataset is being expanded toward an anticipated final dataset of 100,000 patient
    admissions across 9 data modalities from 14 contributing hospitals, with EEG extraction and
    de-identification of a larger imaging cohort in process and published metadata planned for
    additional modalities. Contributing sites provide regular status updates on their data extracts,
    tracked through the Standards Project and Data Acquisition Project boards.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    The chorus-ai GitHub organization hosts 28 repositories providing software and tooling,
    validated semantic mappings, standard operating procedures instructing contributing sites on
    curating and delivering interoperable datasets, and project management overviews. Data site
    managers begin from the Chorus_SOP interactive workflow diagram and submit extracts using
    chorus-extract-upload; issues can be raised in the Standards and Data Acquisition discussion
    areas. Clinical collaborators contribute mappings through the chorus-mapping repository and its
    clinical validation SOP. Sites submit status updates through the GitHub interface or a Google
    Form that triggers a GoogleScript calling the GitHub API. Software contributors are supported by
    a web guide in the chorus-developer repository and a package status page.

