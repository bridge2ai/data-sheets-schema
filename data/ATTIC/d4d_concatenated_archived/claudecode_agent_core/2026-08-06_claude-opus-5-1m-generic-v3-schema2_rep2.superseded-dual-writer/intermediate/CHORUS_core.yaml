purposes:
  - response: >-
      Meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by generating a high-resolution, multi-center, AI-ready data set.
  - response: >-
      Develop a publicly available, AI-ready critical care dataset while ensuring the methods
      promote privacy, accountability and clinical benefit.
  - response: >-
      Provision a holdout test set accessible for external model validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      Create ethically sourced datasets and tools around artificial intelligence and establish best
      practices for AI in health, as one of four Bridge2AI data generation projects.
  - response: >-
      Cultivate expertise in the lay and scientific community and train a new generation of AI
      clinicians, engineers and data scientists through multimodal educational approaches.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of machine-learning models using the sequestered holdout test set.
  - response: >-
      Labeling data with targets important for prediction using a visualization and annotation
      environment.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support AI/ML in critical care; developing
      high-resolution multi-center data sets is a critical first step towards actionable and
      trustworthy AI.
  - response: >-
      Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready critical care
      dataset that harmonizes multi-modal EHR, waveform, imaging and text data under unified
      standards.
  - response: >-
      The legal and regulatory landscape for collecting and sharing critical care data at scale is
      underdeveloped; CHoRUS establishes a legal framework and analyses existing legal and
      regulatory constraints.
  - response: >-
      Contextual factors and social determinants of health, such as geographic distance to the
      nearest hospital, are often absent from clinical AI datasets.

