id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multi-center, multimodal, high-resolution, controlled-access clinical dataset
  generated by the CHoRUS Network, one of four data generation projects in the NIH Common Fund
  Bridge2AI consortium. It assembles retrospectively collected acute and critical care data from
  14 data-acquisition hospitals within a network of 20 academic centers, covering ICU, PICU and
  NICU admissions. Nine data modalities are included: demographics, medication administration,
  procedures, nursing flowsheets, diagnoses, clinical notes (tokenized with the OHNLP toolkit),
  imaging from PACS, waveform telemetry from bedside monitors and gateway/middleware, and EEG
  waveforms from hospital databases. Structured electronic health record data are standardized to
  the OMOP Common Data Model; imaging uses DICOM, waveform telemetry uses WFDB, and EEG uses EDF+
  and Persyst. Data are hosted in a cloud enclave with controlled access, with clinical notes
  stored locally at contributing sites except for extracted tokens. The dataset is intended to
  support machine learning and artificial intelligence work that characterizes acute and critical
  care illness, predicts complications, and measures treatment response, and it includes a
  sequestered holdout test set for external model validation.
page: https://chorus4ai.org/
status: >-
  Under active development with a released, controlled-access dataset available; additional
  modalities (EEG extraction, de-identified imaging at scale) are still in process, and the
  anticipated final dataset is larger than the current release.
is_tabular: false
conforms_to: OMOP Common Data Model
conforms_to_schema: >-
  OMOP Common Data Model for structured electronic health record data (with extensions for
  high-frequency documentation), OHNLP open source schema for tokenized clinical notes, DICOM for
  imaging, WFDB with an extended PhysioNet schema for waveform telemetry, and EDF+ and Persyst for
  EEG waveforms.
created_by: >-
  CHoRUS for Equitable AI consortium; lead organization Massachusetts General Hospital
was_derived_from: >-
  Retrospective clinical data extracts contributed by 14 data-acquisition hospitals, drawn from
  electronic health record systems, PACS imaging archives, bedside monitor telemetry via
  gateway/middleware, and hospital EEG databases.
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - multimodal data
  - AI-ready dataset
  - Bridge2AI
  - social determinants of health
  - equitable AI
notes: >-
  The CHoRUS project website carries the banner notice "This repoitory is under review for
  potential modification in compliance with Administration directives." The consortium comprises
  60+ members across 20 different institutions. The published metadata schema column of the
  CHoRUS dataset table records "Yes (OMOP schema)" for the OMOP-standardized data types, with one
  OMOP data type published using the OMOP schema with extensions; the source table layout does not
  unambiguously identify which OMOP data type carries the extensions. Program manager contact:
  Ciera McCrary, MGH, cmccrary@mgh.havard.edu (address as printed in the source). The project
  sequesters a holdout test set for external model validation in addition to the data provisioned
  for model development.

