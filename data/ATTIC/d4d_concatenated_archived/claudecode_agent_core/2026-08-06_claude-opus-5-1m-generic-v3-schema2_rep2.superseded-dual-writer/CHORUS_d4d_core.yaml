extension_mechanism:
  extension_details: >-
    Contributions are coordinated through the chorus-ai GitHub organization, which hosts 28
    repositories. Data site managers follow the interactive Chorus_SOP workflow diagram to extract
    and contribute data, and raise problems in the Standards Discussions or Data Acquisition
    Discussions. Sites submit status updates either through the GitHub interface or via a Google Form
    whose submissions trigger a GoogleScript that calls the GitHub API to update status and issue
    information on the Standards Project or Data Acquisition Project boards. Clinical collaborators
    contribute semantic mappings through the chorus-mapping repository and its clinical validation
    SOP, and software developers contribute open-source tooling documented in a web guide compiled in
    the chorus-developer repository. Tasks across repositories are aggregated into a central task
    management project.
  contribution_url: https://github.com/chorus-ai

updates:
  update_details: >-
    The dataset is expanding from the current release of 50,000 patient admissions toward an
    anticipated final dataset of 100,000 patient admissions covering 9 data modalities from 14 data
    contributing hospitals. Imaging de-identification for a larger cohort and EEG extraction were in
    process as of August 2025, and published metadata schemas for clinical notes, imaging and EEG are
    planned. Data contributing sites provide regular status updates on their progress in creating and
    curating CHoRUS data extracts, and characterization reports are returned to sites after each
    submission.

external_resources:
  - external_resources:
      - >-
        https://chorus4ai.org/ - CHoRUS project website, with pages covering the team, project
        overview, tools, data acquisition, standards, community engagement, ethics, the dataset, and
        learning resources and opportunities.
      - >-
        https://github.com/chorus-ai - CHoRUS for Equitable AI GitHub organization (28 repositories),
        providing software and tooling for interacting with clinical data, validated semantic
        mappings, standard operating protocols for contributing sites, and project management
        overviews. Repositories include chorus-container-apps, Chorus_SOP, data_acq_SOP,
        chorus-mapping, chorus_waveform, chorus_waveform_resources, chorus-extract-upload,
        privacy_scan_tool, CTP-deid, UF-Geocoding, CHoRUSReports, CADA, cloud_public and
        chorus-apps-internal.
