at_risk_populations:
  id: https://fairhub.io/datasets/2#at-risk-populations
  name: At-risk and specially considered populations
  description: 'AI-READI includes adults with and without T2DM and intentionally recruits
    groups historically under-represented in diabetes research. Pregnant people, people with
    gestational diabetes, type 1 diabetes, adults older than 85, and minors are excluded in
    the IRB source. The NIH RePORTER and Nature Metabolism sources describe tribal consultation
    and engagement with the Native Biodata Consortium related to possible Native American
    cohort data generation.

    '
  at_risk_groups_included: true
  special_protections:
  - IRB approval and reliance agreements.
  - Community Advisory Board input.
  - Ethical and equitable data collection and management practices.
  - Tribal consultation and co-learning about AI/AN data governance challenges.
  - Non-English-speaking participants are not initially enrolled until adequate translated
    materials and procedures are available.
license_and_use_terms:
  id: https://fairhub.io/datasets/2#license-terms
  name: AI-READI Health Data License and Data License Agreement
  description: 'FAIRhub lists the dataset under a Health Data License. The AI-READI License
    Agreement v1.0 from the source bundle names the University of Washington as licensor and
    grants a non-exclusive, non-transferable license to download, reproduce, use, and create
    derivative works from the data for research and commercial purposes, subject to license
    compliance and additional use restrictions.

    '
  license_terms:
  - Licensee must accept the agreement before downloading, installing, or using the data.
  - Licensee may download, reproduce, use, and create derivative works from the data.
  - Copies of the data remain subject to the agreement.
  - Data and derivatives may not be conveyed to third parties except another licensee bound
    by identical terms.
  - Models, algorithms, and programs may be disseminated if they do not contain the data or
    modified data.
  - Licensee must make reasonable efforts to minimize memorization, derivation, reconstruction,
    or reconstitution of the data from models.
  - Licensee must not make clinical treatment decisions based on the data.
  - Licensee must not attempt to identify, contact, or harm data subjects or groups.
  - Licensee must acknowledge the source and funder in publications reporting use of the data.
  - Licensee must comply with NIH Genomic Data Sharing security and privacy standards for
    controlled-access data.
  - The agreement terminates automatically upon breach and requires deletion of data copies
    and cessation of use.
  - Data are provided as-is without warranty.
  - Licensee must comply with applicable laws, regulations, and restrictions.
ip_restrictions:
  id: https://fairhub.io/datasets/2#ip-restrictions
  name: Proprietary rights and model distribution restrictions
  description: 'The license agreement states that title to the data and all industrial and
    intellectual property rights remain solely and exclusively with the licensor and suppliers,
    and any rights not expressly granted are reserved.

    '
  restrictions:
  - Licensee must not take actions inconsistent with licensor and supplier ownership.
  - Models may be distributed only if they do not themselves contain the data or modified
    data.
  - Licensee must minimize the likelihood that data can be memorized, derived, reconstructed,
    or reconstituted from models.
regulatory_restrictions:
  id: https://fairhub.io/datasets/2#regulatory-restrictions
  name: Regulatory, privacy, and compliance restrictions
  description: 'The IRB and license sources describe HIPAA, NIH Genomic Data Sharing, institutional
    approval, privacy, confidentiality, and data-use agreement requirements.

    '
  regulatory_restrictions:
  - UW IRB approval and reliance agreements apply to the human-subjects research.
  - Controlled-access data require legal and privacy use agreements.
  - Licensees must comply with NIH Genomic Data Sharing security best practices for controlled-access
    data.
  - UCSD health data sharing may require Health Data Oversight Committee approval for sharing
    with academic institutions.
  - Data sharing and release must comply with UW and UW Medicine policies requiring formal
    agreements.
  other_compliance:
  - HIPAA Safe Harbor deidentification is used for the public set.
  - CLIA-certified local laboratories perform CBC testing.
  - Human-subjects research compliance training is required for coordinators.
is_deidentified:
  id: https://fairhub.io/datasets/2#deidentification
  name: Public dataset deidentification
  description: 'Public-access AI-READI data are deidentified; the public set is stripped of
    PHI through the HIPAA Safe Harbor method and omits sex and race/ethnicity.

    '
  identifiable_elements_present: true
  method: HIPAA Safe Harbor for public dataset release
  identifiers_removed:
  - Protected Health Information from public data
  - Sex from public data
  - Race and ethnicity from public data
  deidentification_details:
  - Controlled-access data retain sensitive elements under data-use agreements.
  - Public data are available with fewer access requirements.
  - Controlled data include 5-digit ZIP code, sex, race, ethnicity, genetic sequencing data,
    health records, medications, and traffic and accident reports.
is_tabular: false
