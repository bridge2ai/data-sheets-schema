    '
  sensitive_elements_present: true
acquisition_methods:
- id: https://fairhub.io/datasets/2#acquisition-direct-subject
  name: Direct participant-reported data
  description: 'Participants directly report demographic information, medical history, diabetes
    status and treatment, health behaviors, general health, social determinants of health,
    medications, and vision-related information through questionnaires.

    '
  was_directly_observed: false
  was_reported_by_subjects: true
  was_inferred_derived: false
  was_validated_verified: false
  acquisition_details:
  - Questionnaires may be completed electronically or on paper before, during, or after the
    visit.
  - Paper questionnaires may be brought to the visit or mailed back with devices.
- id: https://fairhub.io/datasets/2#acquisition-clinical-observation
  name: Direct clinical measurements
  description: 'Study staff directly observe or measure vitals, physical measurements, vision
    testing, monofilament testing, ECG, cognitive testing, retinal imaging, and biospecimen
    collection during study visits.

    '
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details:
  - Blood pressure is measured twice separated by 2 minutes.
  - Height, weight, waist, and hip circumference support calculated waist-hip ratio and BMI.
  - Retinal imaging technicians are trained to detect selected life- or vision-threatening
    incidental findings.
- id: https://fairhub.io/datasets/2#acquisition-device
  name: Device-generated data
  description: 'Devices generate retinal imaging files, ECG XML, MoCA CSV, CGM CSV, Garmin
    FIT files converted to mHealth, and environmental sensor CSV data.

    '
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details:
  - Some retinal imaging files are converted from proprietary FDA or SDT formats to DICOM.
  - CGM data may be collected through study Dexcom sensors or Dexcom Clarity sharing for existing
    users.
- id: https://fairhub.io/datasets/2#acquisition-record-derived
  name: Record-derived data
  description: 'Electronic health records are used for recruitment, eligibility pre-screening,
    and data extraction, while driving and accident records are obtained from the Department
    of Licensing.

    '
  was_directly_observed: false
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: false
  acquisition_details:
  - ICD-10 codes R73.09 and E11.X identify pre-diabetes and T2DM candidates.
  - Names, addresses, age, sex, race/ethnicity, phone number, email, and diabetes status are
    used for recruitment workflows.
collection_mechanisms:
- id: https://fairhub.io/datasets/2#mechanism-redcap
  name: REDCap recruitment and data collection
  description: 'REDCap is used for online recruitment, consent, questionnaires, and collecting
    patient-reported data plus selected clinical data from the visit, including medications
    assessment, vitals, visual acuity, contrast sensitivity, monofilament test results, and
    CBC test results.

    '
  mechanism_details:
  - Personalized REDCap links, access codes, and QR codes are used in mailed and emailed invitations.
  - Participants can read program information, complete screening, download consent, request
    contact, and sign e-consent.
  - No study-specific questionnaires except screening are available until consent has been
    given.
- id: https://fairhub.io/datasets/2#mechanism-in-person-visit
  name: In-person study visit
  description: 'Participants complete a single in-person study encounter lasting about 2.5
    to 4 hours in the BMJ source and about 3 to 4 hours in the IRB source. Visits include
    vitals, blood and urine collection, ECG, cognitive testing, monofilament testing, visual
    function testing, retinal imaging, device training, and return-of-results activities.

    '
  mechanism_details:
  - Visits may be split over a couple of days if requested by subjects.
  - Participants do not need to be fasting.
  - Small snacks and drinks are available during or after the visit.
- id: https://fairhub.io/datasets/2#mechanism-questionnaires
  name: Questionnaires
  description: 'Questionnaires collect eligibility, demographics, depression symptoms, diabetes
    distress, self-care, diet, ophthalmic history, substance use, general health, social determinants
    of health, access to healthcare, and current medications with RxNorm codes.

    '
  mechanism_details:
  - CES-D-10 is used to screen for depressive symptoms.
  - PAID-5 collects problem areas in diabetes.
  - PhenX-selected surveys collect social determinants of health.
  - Marijuana use is not assessed for Alabama participants because it is illegal in Alabama.
- id: https://fairhub.io/datasets/2#mechanism-ecg
  name: Electrocardiogram collection
  description: 'A 12-lead ECG is performed using a Philips Pagewriter TC30 Cardiograph while
    the participant sits in a reclining chair or lies supine.

    '
  mechanism_details:
  - Participant position is recorded at 0, 30, 60, or 90 degrees relative to supine.
  - ECG data are exported in XML format.
- id: https://fairhub.io/datasets/2#mechanism-cognitive
  name: Cognitive testing
  description: 'Montreal Cognitive Assessment is administered electronically on an iPad using
    the MoCA Duo application. Total possible score is 30, with higher values representing
    better performance.

    '
  mechanism_details:
  - Exported values include total score, section subscores, Memory Index Score, and task completion
    times.
- id: https://fairhub.io/datasets/2#mechanism-neuropathy
  name: Monofilament peripheral neuropathy testing
  description: 'Peripheral neuropathy is assessed using a 10 g filament at three locations
    on each foot, 10 times per location, with the participant''s eyes closed while answering
    whether they feel the filament.

    '
- id: https://fairhub.io/datasets/2#mechanism-vision
  name: Visual function testing
  description: 'Photopic and mesopic visual acuity and contrast sensitivity are measured for
    right and left eyes separately, with autorefraction data collected using Topcon KR 800.

    '
  mechanism_details:
  - Electronic Visual Acuity tester is used for photopic visual acuity.
  - Mesopic acuity is measured through a 2.0 neutral density filter.
  - Mars chart is used for photopic letter contrast sensitivity.
- id: https://fairhub.io/datasets/2#mechanism-retinal-imaging
  name: Retinal imaging
  description: 'Multimodal retinal imaging captures both eyes using multiple devices and modalities,
    including fundus photography, OCT, OCTA, and FLIO.

    '
  mechanism_details:
  - Aurora IQ collects undilated macula- and disc-centered color fundus photos.
  - EIDON widefield truecolor confocal fundus system collects central, nasal, temporal, infrared,
    autofluorescence, and mosaic images.
  - Spectralis HRA collects OCT and OCTA scans.
  - Topcon Maestro2 and Triton DRI OCT collect OCT and OCTA scans.
  - Cirrus 5000 collects optic disc and macula OCT and OCTA.
  - FLIO collects macula-centered fluorescence lifetime images.
- id: https://fairhub.io/datasets/2#mechanism-cgm
  name: Continuous glucose monitoring
  description: 'Dexcom G6 continuous glucose monitors collect blood glucose measurements in
    mg/dL every 5 minutes during a 10-day at-home monitoring period.

    '
  mechanism_details:
  - Existing Dexcom G6 users may place an additional study sensor or share Dexcom Clarity
    data.
  - Participants may optionally share up to 90 days of prior glucose values, producing up
    to 100 days total.
  - Participants are masked to Dexcom CGM results during the monitoring period in the BMJ
    source.
- id: https://fairhub.io/datasets/2#mechanism-fitness
  name: Physical activity monitoring
  description: 'Garmin VivoSmart 5 fitness trackers collect steps, heart rate, sleep duration,
    oxygen saturation, and related activity measures during the 10-day at-home monitoring
    period.

    '
  mechanism_details:
  - The Nature Metabolism source also lists respiration rate, activity type, stress level,
    and sleep phases.
  - Garmin data are exported in FIT format and converted to mHealth standard.
- id: https://fairhub.io/datasets/2#mechanism-environmental
  name: Home environmental sensing
  description: 'A custom environmental sensor from the Karalis Johnson Retina Center at the
    University of Washington collects home environmental parameters for 10 days.

    '
  mechanism_details:
  - Variables include ambient temperature, relative humidity, NO and NO2, volatile organic
    compounds, PM1.0, PM2.5, PM4, PM10, and 11 multispectral light measurements.
  - The device does not capture video, audio, or GPS location and is not synced with participant-owned
    devices.
- id: https://fairhub.io/datasets/2#mechanism-biospecimen
  name: Blood and urine specimen collection
  description: 'Non-fasting blood and urine are collected during the study visit for laboratory
    testing, biobanking, and future studies. The BMJ source states 53 mL of blood; the IRB
    source describes approximately 50-60 mL.

    '
  mechanism_details:
  - CBC is performed on fresh whole blood at local CLIA-certified laboratories.
  - UW NORC tests stored frozen plasma, serum, whole blood, and urine samples.
  - UAB CCTS stores plasma, serum, buffy coats, PBMCs, PAXgene RNA samples, and related materials.
- id: https://fairhub.io/datasets/2#mechanism-records
  name: Medical, driving, and accident records
  description: 'Medical records are used for pre-screening and study data on general health,
    eye health, medical and surgical history, diabetes, medications, laboratory records, and
    previous relevant imaging. The IRB source also describes collecting car accident and traffic
    ticket information from the prior three years and Department of Licensing records.

    '
