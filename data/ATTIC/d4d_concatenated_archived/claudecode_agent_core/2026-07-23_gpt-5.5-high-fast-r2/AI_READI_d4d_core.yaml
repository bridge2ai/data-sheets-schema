sampling_strategies:
- id: https://fairhub.io/datasets/2#sampling-triple-balanced
  name: Triple-balanced recruitment
  description: 'Recruitment is designed to achieve approximately equal distribution by self-reported
    race/ethnicity, T2DM presence and severity, and biological sex. The IRB source describes
    dual balancing in an earlier framing, while the BMJ protocol describes triple balancing
    across race/ethnicity, T2DM severity, and biological sex.

    '
  is_sample: true
  is_random: false
  source_data:
  - Electronic health records at UAB, UCSD, and UW
  - Self-reported race and ethnicity at screening and enrollment
  - ICD-10 diagnosis codes R73.09 and E11.X
  is_representative: false
  why_not_representative:
  - 'The design intentionally recruits equal numbers in selected groups rather than mirroring
    the US population distribution.

    '
  - 'Participants are volunteers, producing volunteer selection bias that may limit generalizability
    to people not represented in the study population.

    '
  - 'English-language eligibility may create challenges for recruiting some Hispanic or Asian
    participants.

    '
  strategies:
  - Recruit adults aged 40 and older from three health systems.
  - Use waves of invitations to manage staffing and sample balance.
  - Monitor diversity and inclusion during recruitment.
  - Under-sample and over-sample groups as needed to maintain balance.
  - Send personalized hardcopy letters and email invitations with REDCap links, access codes,
    and QR codes.
  - Use follow-up phone calls for people who do not respond or who initiate contact.
  - Consider clinics, community centers, clinician referrals, registries, databases, or self-reports
    if recruitment is difficult.
- id: https://fairhub.io/datasets/2#sampling-race-ethnicity
  name: Race and ethnicity balancing
  description: 'The target cohort includes approximately equal recruitment of Asian, Black,
    Hispanic, and White participants, with the IRB source describing a goal of about 1,000
    subjects from each group.

    '
  is_sample: true
  is_random: false
  is_representative: false
  strategies:
  - UW concentrates on Asian, Hispanic, and Black recruitment.
  - UCSD prioritizes Hispanic, Asian, and Black recruitment.
  - UAB prioritizes Black, Hispanic, and Asian recruitment.
  - All sites recruit White participants.
- id: https://fairhub.io/datasets/2#sampling-diabetes-severity
  name: Diabetes severity balancing
  description: 'The study recruits approximately 1,000 participants in each of four diabetes
    severity groups: no type 2 diabetes, pre-diabetes or lifestyle-controlled diabetes, oral
    or non-insulin-injectable medication controlled T2DM, and insulin-dependent T2DM.

    '
  is_sample: true
  is_random: false
  is_representative: false
  strategies:
  - Use ICD-10 code R73.09 for pre-diabetes identification.
  - Use ICD-10 code E11.X for T2DM identification.
  - Use self-report and clinical data to support group assignment.
raw_sources:
- id: https://fairhub.io/datasets/2#raw-data-proprietary-retinal
  name: Proprietary retinal image exports
  description: 'Some retinal imaging devices export proprietary FDA or SDT files that are
    converted to DICOM before upload or release.

    '
  raw_data_details:
  - Maestro2 and Triton DRI OCT export FDA files converted to DICOM.
  - FLIO exports SDT files converted to DICOM.
- id: https://fairhub.io/datasets/2#raw-data-fit
  name: Garmin FIT exports
  description: 'Garmin VivoSmart 5 data are exported in FIT format and converted to the mHealth
    standard for the dataset.

    '
  raw_data_details:
  - Variables include steps, heart rate, sleep duration, oxygen saturation, and related activity
    measures.
- id: https://fairhub.io/datasets/2#raw-data-csv
  name: CSV exports
  description: 'CSV exports include CGM data, environmental sensor data, MoCA Duo data, clinical
    laboratory data, and other tabular or time-series data.

    '
  raw_data_details:
  - CGM records blood glucose every 5 minutes.
  - Environmental sensor records air quality, light, temperature, and humidity variables.
  - NORC laboratory testing is provided in CSV format.
preprocessing_strategies:
- id: https://fairhub.io/datasets/2#preprocessing-harmonization
  name: Multi-site harmonization
  description: 'AI-READI harmonizes data across UAB, UCSD, and UW through standardized operating
    procedures, common protocols, central data management, and FAIRhub upload workflows.

    '
  preprocessing_details:
  - Research personnel are trained by the UAB data manager.
  - A detailed Manual of Procedures is used for reference.
  - Successful coordinator certification is required.
  - Coordinators administer all protocol elements to at least three volunteer practice subjects
    before participant enrollment.
- id: https://fairhub.io/datasets/2#preprocessing-standards
  name: Mapping to standards
  description: 'Data are mapped to applicable standards to support AI-readiness and interoperability.

    '
  preprocessing_details:
  - Clinical data are mapped to the Observational Medical Outcomes Partnership Common Data
    Model.
  - Retinal imaging data are mapped to DICOM.
  - Garmin FIT files are converted to the mHealth standard.
  - Current medications use RxNorm codes.
  - Diabetes identification uses ICD-10 codes R73.09 and E11.X.
  - The Clinical Dataset Structure is being developed as a simple way to organize clinical
    research datasets and structured metadata.
- id: https://fairhub.io/datasets/2#preprocessing-image-conversion
  name: Retinal image conversion
  description: 'Retinal images are exported from imaging devices in raw formats and some images
    are converted to DICOM before upload to external AI-READI data storage or release.

    '
  preprocessing_details:
  - FDA files are converted to DICOM.
  - SDT files are converted to DICOM.
  - DICOM is used for image standardization.
- id: https://fairhub.io/datasets/2#preprocessing-biospecimen
  name: Biospecimen processing
  description: 'Blood and urine samples undergo local and central processing for clinical
    testing, biobanking, and future research uses.

    '
  preprocessing_details:
  - Plasma, serum, and buffy coats are processed locally using standardized operating procedures.
  - Whole blood, plasma, serum, and urine for central assays are batch-shipped to UW NORC.
  - Plasma, serum, and buffy coats from UW and UCSD are batch-shipped to UAB CCTS.
  - Genomic DNA extractions from stored buffy coats are performed at UAB CCTS.
  - CPT tubes for PBMC isolation are centrally processed at UAB CCTS.
  - PAXgene RNA vacutainers from UW and UCSD are shipped overnight to UAB CCTS.
- id: https://fairhub.io/datasets/2#preprocessing-public-deidentification
  name: Public dataset deidentification
  description: 'The public set is stripped of PHI using the HIPAA Safe Harbor method and also
    omits sex and race/ethnicity to reduce stigmatization risk.

    '
  preprocessing_details:
  - Public-access data are separated from controlled-access variables.
  - Sensitive data remain under controlled access and data-use agreements.
  - Data watermarking is used for public and controlled sets according to the Nature Metabolism
    source.
cleaning_strategies:
- id: https://fairhub.io/datasets/2#cleaning-site-qc
  name: Site quality control before FAIRhub upload
  description: 'The data manager at each data site is responsible for quality control of all
    data before upload to FAIRhub.

    '
  cleaning_details:
  - Practice subject procedures occur before enrollment.
  - Data validation checks occur in REDCap.
  - Duplicate measurements support quality assurance for measurements such as blood pressure.
  - Common protocols and equipment reduce cross-site variation.
- id: https://fairhub.io/datasets/2#cleaning-pilot
  name: Pilot enrollment process refinement
  description: 'Preliminary pilot enrollment occurred from 2023-07-18 to 2023-11-30 to ensure
    coordinator familiarity before formal data collection.

    '
  cleaning_details:
  - Pilot data were included in the first released dataset made available in May 2024.
  - The protocol notes ongoing monitoring and adjustment of recruitment composition.
labeling_strategies:
- id: https://fairhub.io/datasets/2#labeling-diabetes-severity
  name: Diabetes severity group assignment
  description: 'Participants are labeled by diabetes severity group using medical record screening,
    diagnosis codes, and self-reported status and treatment.

    '
  labeling_details:
  - No diabetes group lacks R73.09 or E11.X encounters in source population screening.
  - Pre-diabetes uses ICD-10 code R73.09.
  - T2DM uses ICD-10 code E11.X.
  - Treatment groups include lifestyle control, oral or non-insulin-injectable medication
    control, and insulin dependence.
- id: https://fairhub.io/datasets/2#labeling-demographics
  name: Self-reported demographic groups
