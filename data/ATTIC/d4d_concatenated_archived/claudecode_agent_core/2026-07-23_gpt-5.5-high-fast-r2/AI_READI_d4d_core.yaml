use_repository:
- id: https://fairhub.io/datasets/2#use-repository-fairhub
  name: FAIRhub
  description: 'FAIRhub is a Microsoft Azure cloud-based data management, curation, and sharing
    platform developed for AI-READI and intended to simplify and automate implementation of
    AI-ready data guidelines.

    '
  repository_url: https://fairhub.io/
  repository_details:
  - AI-READI data are uploaded at regular intervals.
  - Each annual release has public and controlled-access datasets.
  - FAIRhub provides dataset landing pages and documentation links.
future_use_impacts:
- id: https://fairhub.io/datasets/2#future-impact-ai-readiness
  name: Blueprint for AI-ready health data generation
  description: AI-READI is intended to serve as a reusable blueprint for ethically sourced,
    FAIR, AI-ready biomedical datasets, including standards for data collection, preparation,
    sharing, documentation, licensing, and workforce development.
  impact_details:
  - Future reuse can support T2DM pathogenesis and salutogenesis modeling, disease-trajectory
    analysis, biomarker discovery, and standards development.
  - Future AI uses also carry risks of re-identification, inference of individual characteristics,
    and stigmatization, which the project addresses through deidentification, public/controlled
    access separation, licensing restrictions, and data-use agreements.
discouraged_uses:
- id: https://fairhub.io/datasets/2#discouraged-clinical-treatment
  name: Clinical treatment decisions
  description: 'The license agreement prohibits making clinical treatment decisions based
    on the data because the data are intended solely as a research resource.

    '
  discouragement_details:
  - Do not use the dataset as a substitute for clinical evaluation or care.
- id: https://fairhub.io/datasets/2#discouraged-reidentification
  name: Re-identification or privacy compromise
  description: 'The license prohibits using or attempting to use the data alone or with other
    information to compromise confidentiality, identify or contact data subjects, infer identifying
    information, establish group membership, or cause harm or injury.

    '
  discouragement_details:
  - Re-identification attempts violate the data license and participant privacy protections.
- id: https://fairhub.io/datasets/2#discouraged-unauthorized-sharing
  name: Unauthorized data sharing
  description: 'The license prohibits transferring, licensing, sublicensing, selling, assigning,
    displaying, sharing, or otherwise conveying data or derivatives to third parties except
    another licensee bound by identical terms.

    '
  discouragement_details:
  - Models may be distributed only if they do not contain the data or modified data and reasonable
    efforts are made to minimize memorization or reconstruction.
- id: https://fairhub.io/datasets/2#discouraged-unqualified-early-release
  name: Unqualified inference from interim releases
  description: 'Pilot and periodic releases during ongoing enrollment may not be balanced
    across groups, so analyses that ignore release-specific composition are discouraged.

    '
  discouragement_details:
  - Interpret each release in the context of version-specific documentation and recruitment
    status.
