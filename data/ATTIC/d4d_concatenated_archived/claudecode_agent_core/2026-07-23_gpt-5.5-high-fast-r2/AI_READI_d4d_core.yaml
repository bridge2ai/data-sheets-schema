  irb_approval:
  - STUDY00016228
  ethics_review_board:
  - University of Washington Institutional Review Board
  - University of Alabama at Birmingham IRB reliance agreement
  - University of California San Diego IRB reliance agreement
  special_populations:
  - Adults aged 40 and older
  - Pregnant people excluded
  - Adults older than 85 excluded in the IRB source
  - Native American cohort tribal consultation is described in NIH RePORTER and Nature Metabolism
    sources
  regulatory_compliance:
  - HIPAA
  - NIH Genomic Data Sharing Policy
  - UW IRB human subjects requirements
