known_biases:
- id: https://fairhub.io/datasets/2#bias-volunteer
  name: Volunteer selection bias
  description: 'The BMJ protocol states that participants are volunteers, creating selection
    bias that may limit generalizability among people not represented in the study population.

    '
  bias_description: Volunteer participation may not represent non-volunteer populations.
  mitigation_strategy: 'Recruit across three geographically distinct sites and monitor group
    balance during recruitment.

    '
- id: https://fairhub.io/datasets/2#bias-language
  name: English-language participation constraint
  description: 'Participants are required to speak, read, and understand English in the BMJ
    protocol. The IRB source notes that non-English-speaking participants will not initially
    be enrolled, with Spanish translation considered if Hispanic recruitment goals are not
    met.

    '
  bias_description: English proficiency may affect Hispanic and Asian recruitment.
  mitigation_strategy: 'The IRB source describes possible Spanish translation and native Spanish-speaking
    research staff at UCSD if recruitment goals require it.

    '
- id: https://fairhub.io/datasets/2#bias-site-demographics
  name: Regional recruitment variation
  description: 'Each site is expected to recruit all groups but local demographics affect
    proportions; UW concentrates on Asian, Hispanic, and Black participants, UCSD on Hispanic,
    Asian, and Black participants, and UAB on Black, Hispanic, and Asian participants.

    '
  bias_description: Geographic site composition may shape subgroup representation.
  mitigation_strategy: 'The protocol uses wave-based recruitment and under- or over-sampling
    to adjust for observed participation characteristics.

    '
known_limitations:
- id: https://fairhub.io/datasets/2#limitation-ongoing-enrollment
  name: Ongoing enrollment and preliminary releases
  description: 'Enrollment continues until 2026, and early or periodic releases may not have
    achieved balanced distribution across groups.

    '
  limitation_description: Pilot and interim versions may not be fully balanced.
  scope_impact: 'Analyses of early versions should consider incomplete recruitment and release-specific
    participant composition.

    '
  recommended_mitigation: 'Use version-specific documentation and consider controlled-access
    metadata and study dashboard information when assessing representativeness.

    '
- id: https://fairhub.io/datasets/2#limitation-biorepository-finite
  name: Finite biospecimen availability
  description: 'The BMJ protocol states that the biorepository has a finite number of samples
    to share, and procedures for reviewing and prioritizing written requests will be developed
    before the biorepository is complete.

    '
  limitation_description: Biospecimens cannot be distributed without limit.
  scope_impact: 'Ancillary studies depending on biospecimens may require prioritization and
    may not all be feasible.

    '
  recommended_mitigation: 'Follow project biorepository request and prioritization procedures
    when available.

    '
- id: https://fairhub.io/datasets/2#limitation-pbmc-processing-time
  name: PBMC processing time variation
  description: 'Centralized PBMC processing at UAB CCTS introduces an additional time variable
    for isolation and cryopreservation for participants recruited at UW and UCSD.

    '
  limitation_description: PBMC processing timing differs by site.
  scope_impact: 'Analyses using PBMC-derived data may need to consider processing and shipment
    timing.

    '
  recommended_mitigation: 'Account for collection site and specimen handling timelines in
    downstream analyses.

    '
- id: https://fairhub.io/datasets/2#limitation-lab-lag
  name: Laboratory result return lag
  description: 'The IRB source states laboratory results may not be available within a clinically
    actionable timeline because data are uploaded yearly.

    '
  limitation_description: Laboratory data return may lag participant visits.
  scope_impact: 'Participant-facing return of lab results is delayed and not curated by the
    study team.

    '
  recommended_mitigation: 'Participants are directed to discuss results with primary care
    providers or specialists and reference ranges are provided.

    '
- id: https://fairhub.io/datasets/2#limitation-not-clinical-care
  name: Not for clinical treatment decisions
  description: 'The license agreement states that licensees must not make clinical treatment
    decisions based on the data because it is intended solely as a research resource.

    '
  limitation_description: Data are not validated as a clinical treatment tool.
  scope_impact: 'AI/ML models or analyses produced from the data require independent clinical
    validation before clinical use.

    '
  recommended_mitigation: 'Restrict use to research unless separately validated and approved
    for clinical contexts.

    '
confidential_elements:
- id: https://fairhub.io/datasets/2#confidential-controlled-access
