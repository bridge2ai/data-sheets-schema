id: https://doi.org/10.60775/fairhub.3
name: AI-READI
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: The Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI) is
  a multimodal dataset of data collected from people with and without type 2 diabetes mellitus and harmonized
  across three data collection sites. The study is designed primarily as a cross-sectional cohort with
  a planned longitudinal follow-up for 10% of the cohort. Its target enrollment is 4,000 people aged 40
  or older, with intended balancing across diabetes severity, self-reported race and ethnicity, and biological
  sex. The dataset supports AI and machine-learning research into type 2 diabetes pathogenesis and salutogenesis.
  Version 3.0.0 is the latest release identified in the current source bundle; no current-release participant,
  file, or byte total is stated there.
