purposes:
- name: T2DM pathogenesis and salutogenesis research
  response: Create and share a multimodal, AI-ready dataset for studying type 2 diabetes pathogenesis
    and salutogenesis, the pathway from disease toward health.
- name: AI-ready and equitable biomedical data generation
  response: Establish standards, best practices, and guidelines for ethical, equitable, FAIR-aligned collection,
    preparation, management, and sharing of biomedical data for AI and machine-learning research.
tasks:
- name: Multimodal AI and machine-learning analysis
  response: Support AI and machine-learning analyses across surveys, physical and clinical measurements,
    retinal imaging, ECG, laboratory tests, continuous glucose monitoring, wearable activity data, and
    home environmental data.
- name: T2DM trajectory modeling
  response: Support analyses of disease severity and salutogenic pathways, including the planned use of
    pseudotime manifold analysis to reconstruct temporal trajectories from multimodal observations.
addressing_gaps:
- name: Lack of diverse AI-ready T2DM datasets
  response: Address the shortage of large, well-characterized, multimodal datasets designed for AI research
    and the under-representation of groups that bear a higher burden of type 2 diabetes.
- name: Lack of reusable data-generation guidance
  response: Develop and disseminate a blueprint for future projects that covers data collection, management,
    sharing, FAIR practices, and ethical, legal, and social considerations.
