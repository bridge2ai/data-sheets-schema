instances:
- name: Human participant records
  instance_type: Participant-level multimodal observations
  description: Data are collected from people aged 40 or older with a range of type 2 diabetes states,
    including people without diabetes. The study target is 4,000 participants; the source bundle does
    not report the actual number represented in version 3.0.0.
- name: Clinical and behavioral measurements
  instance_type: Measurements, survey responses, images, signals, and laboratory results
  description: Instances include questionnaires, vitals and anthropometry, medication and health-history
    data, cognitive and monofilament testing, ECG, visual function and retinal imaging, blood and urine
    laboratory results, continuous glucose monitoring, physical activity and sleep, and home environmental
    measurements.
- name: Biospecimen and biorepository records
  instance_type: Biospecimen-derived measurements and repository metadata
  description: Blood and urine are collected for clinical laboratory testing and biobanking. The sources
    describe plasma, serum, buffy coats, genomic DNA, PAXgene tubes, and peripheral blood mononuclear
    cells; several downstream assays are described only as future uses.
known_biases:
- name: Volunteer selection bias
  bias_type: selection_bias
  bias_description: Participants are volunteers, so volunteer bias may limit generalizability to people
    not represented in the study population.
  mitigation_strategy: Recruitment is monitored in waves and under- or oversampling is planned when needed
    to move the cohort toward its balancing targets.
- name: Representation during ongoing enrollment
  bias_type: representation_bias
  bias_description: Pilot and periodic releases made while enrollment is ongoing may not have achieved
    the intended balance across diabetes severity, race and ethnicity, and biological sex.
  mitigation_strategy: The study monitors participation characteristics by site and group and adjusts
    recruitment strategies when imbalance emerges.
  affected_subsets:
  - Pilot and periodic releases during ongoing enrollment
known_limitations:
- name: English-language eligibility
  limitation_type: representativeness_limitation
  limitation_description: Participants are required to speak, read, and understand English, which may
    hinder recruitment of some Hispanic and Asian people.
  scope_impact: The cohort may not represent otherwise eligible people who cannot complete the study in
    English.
- name: Release-stage balance
  limitation_type: temporal_limitation
  limitation_description: Data releases made before enrollment is complete may not reflect the intended
    final balancing targets.
  scope_impact: Users must examine release-specific composition instead of assuming that the final design
    targets have already been reached.
- name: Finite biorepository
  limitation_type: scope_limitation
  limitation_description: The biorepository contains a finite number of specimens, and procedures for
    reviewing and prioritizing requests were still being developed in the protocol publication.
  scope_impact: Biospecimen availability may constrain ancillary studies.
confidential_elements:
- name: Restricted participant information
  confidential_elements_present: true
  confidentiality_details:
  - The controlled-access data include information not present in the public set, including five-digit
    ZIP code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic
    and accident records.
  - Access to the full dataset requires a data use agreement and an approval process.
subpopulations:
- name: Intended balancing groups
  subpopulation_elements_present: true
  identification:
  - Asian, Black, Hispanic, and White self-reported race and ethnicity groups
  - Biological male and female groups
  - No diabetes, prediabetes or lifestyle-controlled diabetes, oral-medication or non-insulin-injection
    controlled diabetes, and insulin-controlled diabetes groups
  - Participants aged 40 or older
  distribution:
  - The design seeks approximately equal representation across the three balancing dimensions, but interim
    releases may not yet be balanced.
sensitive_elements:
- name: Sensitive and identifying data
  sensitive_elements_present: true
  sensitivity_details:
  - Five-digit ZIP code
  - Sex, race, and ethnicity
  - Genetic sequencing data
  - Past health records and medications
  - Traffic and accident records
  - Other protected health information collected during screening and study procedures
acquisition_methods:
- name: Mixed direct, reported, and derived acquisition
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Direct observations include clinical measurements, images, biospecimen testing, ECG, and readings
    from monitoring devices.
  - Participants report questionnaire responses, medication use, and health history.
  - Recruitment screening and some clinical information are obtained from electronic health records; driving
    and accident records are obtained from licensing records.
  - Data managers at each site perform quality control before FAIRhub upload.
collection_mechanisms:
- name: Pre-visit surveys
  mechanism_details:
  - REDCap is used for screening, consent, and questionnaires covering demographics, depression, diabetes-related
    concerns and self-care, diet, eye health, substance use, general health, social determinants of health,
    and current medications.
- name: In-person clinical visit
  mechanism_details:
  - A visit lasting approximately 2.5 to 4 hours includes anthropometry, blood pressure and heart rate,
    12-lead ECG, monofilament testing, cognitive screening, visual-function testing, retinal imaging,
    and blood and urine collection.
- name: Ten-day home monitoring
  mechanism_details:
  - Participants use a Dexcom G6 continuous glucose monitor, a Garmin VivoSmart 5 activity monitor, and
    a home environmental sensor for 10 days.
- name: Retinal imaging
  mechanism_details:
  - Both eyes are imaged using fundus photography, optical coherence tomography, optical coherence tomography
    angiography, and fluorescence lifetime imaging ophthalmoscopy devices.
sampling_strategies:
- name: Targeted cohort recruitment
  is_sample: true
  is_representative: false
  source_data:
  - Health-system electronic records for people aged 40 or older who had an encounter at the UAB, UCSD,
    or UW sites from 2020 through 2025
  - ICD-10 screening codes R73.09 and E11.X
  why_not_representative:
  - The target is deliberate balance rather than the demographic distribution of the United States, and
    volunteer and English-language eligibility effects may limit generalizability.
  strategies:
  - Recruit in waves using mailed and emailed invitations and REDCap screening.
  - Monitor diabetes severity, race and ethnicity, biological sex, and site, then under- or oversample
    groups as needed.
data_collectors:
- name: AI-READI trained research personnel
  role: Participant recruitment, enrollment, consent, and protocol data collection
  collector_details:
  - Research personnel at the University of Alabama at Birmingham, University of California San Diego,
    and University of Washington complete protocol and human-subjects training and a certification process
    before collecting data.
  - Site data managers oversee collection and quality control.
