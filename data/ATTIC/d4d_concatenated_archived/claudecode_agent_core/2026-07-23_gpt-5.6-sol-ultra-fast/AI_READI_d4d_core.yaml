informed_consent:
- name: Participant informed consent
  consent_obtained: true
  consent_type:
  - Electronic consent through REDCap
  - In-person written consent
  consent_documentation:
  - Signed electronic consent is emailed to the participant.
  - Participants may request another copy from the study coordinator.
  - Participants may review the materials, ask questions, and choose the in-person option instead of electronic
    consent.
  withdrawal_mechanism:
  - Participants are reminded that they may change their mind about participation.
  consent_scope:
  - Study procedures and data collection
  - Public and controlled data-sharing scopes described in the consent materials
preprocessing_strategies:
- name: Standardization for AI-ready release
  preprocessing_details:
  - Raw ECG data are exported as XML.
  - MoCA and central blood and urine laboratory data are exported as CSV.
  - Retinal device exports that require conversion are converted from proprietary .fda or .sdt files to
    DICOM.
  - Garmin FIT exports are converted to an mHealth standard for the released dataset.
  - Clinical data are mapped to the OMOP Common Data Model.
  - Current medications use RxNorm codes.
cleaning_strategies:
- name: Site quality control and harmonization
  cleaning_details:
  - Data managers at each collection site are responsible for quality control before upload to FAIRhub.
  - Standardized operating procedures and staff certification are used to harmonize collection and biospecimen
    handling across sites.
  - Data are transformed from proprietary device representations to applicable standard formats before
    release when necessary.
other_tasks:
- name: Pseudotime manifold analysis
  task_details:
  - The NIH award describes downstream pseudotime manifold analysis for learning disease trajectories
    across participants with differing diabetes severity.
future_use_impacts:
- name: Research benefits and privacy risks
  impact_details:
  - Expected benefits include new insights into type 2 diabetes pathogenesis and salutogenesis and a reusable
    blueprint for AI-ready biomedical datasets.
  - Potential downstream risks include reidentification, inference of participant characteristics, stigmatization,
    discrimination, and reconstruction of data from trained models.
discouraged_uses:
- name: Unsupported generalization from interim releases
  discouragement_details:
  - Do not assume that pilot or periodic releases made during ongoing enrollment have already achieved
    the study's intended balancing targets.
  - Volunteer bias and English-language eligibility must be considered before generalizing findings to
    populations not represented in the cohort.
intended_uses:
- name: AI and machine-learning research
  examples:
  - Multimodal research on type 2 diabetes pathogenesis and salutogenesis
  - Modeling relationships among clinical, imaging, behavioral, and environmental data
  - Development and evaluation of responsible AI and machine-learning methods
  usage_notes: Use is subject to the Health Data License and the access requirements for the public or
    controlled data layer.
  use_category:
  - Research
  - Commercial research permitted under the license terms
prohibited_uses:
- name: Clinical treatment decisions
  prohibition_reason:
  - The Data License Agreement states that the data are solely a research resource and must not be used
    to make clinical treatment decisions.
- name: Reidentification, contact, or harm
  prohibition_reason:
  - The license prohibits attempts to identify or contact data subjects, compromise confidentiality or
    privacy, infer identifying group membership, or otherwise cause harm or injury.
- name: Unauthorized redistribution
  prohibition_reason:
  - Data and derivative data may not be transferred to a third party except another licensee bound by
    identical terms. Models may be distributed only when they do not contain the data and reasonable efforts
    minimize memorization or reconstruction.
distribution_formats:
