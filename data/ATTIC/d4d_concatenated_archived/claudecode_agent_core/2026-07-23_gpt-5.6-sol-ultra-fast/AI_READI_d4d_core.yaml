- name: XML
  description: Used for raw ECG exports.
- name: DICOM
  description: Retinal images are represented as DICOM in the dataset; proprietary .fda and .sdt device
    exports are converted to DICOM where required.
- name: mHealth standard representation
  description: Garmin FIT device exports are converted to an mHealth standard.
