sensitive_elements:
- sensitivity_details: Clinical notes receive distinct handling. The cohort 2 informational
    webinar states that OMOP and telemetry data are in the enclave, except that clinical notes
    are stored locally except tokens.
acquisition_methods:
- acquisition_details: Retrospective data collection, as stated on the CHoRUS Dataset slide
    of the cohort 2 informational webinar.
collection_mechanisms:
- mechanism_details: Imaging obtained from PACS, per the dataset table in the cohort 2 informational
    webinar.
- mechanism_details: Waveform telemetry obtained from bedside monitors and gateway/middleware,
    per the dataset table in the cohort 2 informational webinar.
- mechanism_details: Waveform EEG obtained from a hospital database, per the dataset table
    in the cohort 2 informational webinar.
- mechanism_details: Medication administration recorded with dosing time-stamped upon each
    infusion change or dose administration, per the dataset table in the cohort 2 informational
    webinar.
- mechanism_details: Procedures captured as documentation by providers, per the dataset table
    in the cohort 2 informational webinar.
- mechanism_details: Diagnoses captured as documentation by providers, per the dataset table
    in the cohort 2 informational webinar.
- mechanism_details: Nursing flowsheets captured as high-frequency documentation, per the
    dataset table in the cohort 2 informational webinar.
sampling_strategies:
- strategies: Planned. The NIH RePORTER abstract states that the project will establish a
    legal framework for collecting data at scale, sampling to ensure comprehensive sets of
    patient conditions and clinical treatment strategies.
- strategies: Planned. The GitHub organization overview (captured 2025-11-14) states that
    federated access will enable sampling methods to ensure a balanced and diverse cohort.
preprocessing_strategies:
- preprocessing_details: Standardization of structured electronic health record data to the
    OMOP common data model. The project website reports 1.6 Billion rows of EHR OMOP data
    in the current released dataset; the NIH RePORTER abstract describes standardizing data
    to the OMOP Common Data Model as a planned project activity.
- preprocessing_details: Clinical notes are extracted and tokenized using the OHNLP toolkit,
    per the dataset table in the cohort 2 informational webinar.
- preprocessing_details: Planned. The NIH RePORTER abstract states that the project will transform
    data using approaches that limit re-identification.
labeling_strategies:
- labeling_details: Planned. The NIH RePORTER abstract states that the project will develop
    capabilities across a multi-center network to acquire, standardize, tokenize, store, visualize,
    and label data; the GitHub organization overview (captured 2025-11-14) states that a visualization
    and annotation environment will label data with targets important for prediction.
