intended_uses:
- examples:
  - Building machine-learning (ML) and artificial intelligence (AI)-derived models to improve
    the care and outcomes of patients requiring critical care.
  usage_notes: Stated in the NIH RePORTER project narrative as the purpose for which the CHoRUS
    project will develop the network, tools, standards, data, and education.
- examples:
  - External validation of AI models against a holdout test set, to aid marketplace adoption
    of AI-developed models for implementation in acute and critical care.
  usage_notes: The NIH RePORTER abstract states this as a planned provision of the dataset.
updates:
  update_details: The project website distinguishes its Current Released Dataset snapshot
    from an Anticipated Final Dataset of 100,000 patient admissions, 9 different data modalities
    and 14 data contributing hospitals. The cohort 2 informational webinar (September 9, 2025)
    states that imaging de-identification is in process for a larger cohort and that EEG extraction
    is in process at this point.
extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: The GitHub organization overview (captured 2025-11-14) states that the
    Chorus_SOP page is the starting reference for data managers at data contributing sites
    and carries an interactive workflow diagram describing the step-by-step process for extracting
    and contributing clinical data to CHoRUS, with dynamic links to SOP documents; issues
    in the creation or submission of a data extract can be posted in the Standards Discussions
    or Data Acquisition Discussions. It also states that clinical collaborators can contribute
    to mapping efforts through the chorus-mapping repository and its associated clinical validation
    SOP.
license_and_use_terms:
  license_terms: Within the AIM-AHEAD Bridge2AI for Clinical Care Training Program (cohort
    2), all participants must sign a licensing agreement included in the registration form
    before gaining access to the dataset; the webinar notes that this requirement is not a
    barrier to acceptance into the program.
regulatory_restrictions:
  confidentiality_level: restricted
  notes: The cohort 2 informational webinar's CHoRUS Dataset slide states controlled access,
    and access is conditioned on a registration form and a signed licensing agreement.
data_governance:
  access_review_process: The cohort 2 informational webinar describes a registration process
    for the AIM-AHEAD Bridge2AI for Clinical Care Training Program in which participants fill
    out a registration form with name, email, and institution, and an email is sent once access
    is granted and compute is provisioned; it also states that, in order to gain access to
    the dataset, a “.edu” email address is needed, and that program administrators will assist
    with this access if needed. The GitHub organization overview (captured 2025-11-14) directs
    access requests to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
is_deidentified:
  deidentification_details: The cohort 2 informational webinar states that 1000 images are
    currently available with de-identification in process for a larger cohort. The NIH RePORTER
    abstract states as a planned activity that the project will transform data using approaches
    that limit re-identification.
