- id: https://fairscape.net/api/ark:59853/rocrate-sec-ms-characterization-of-kolf2-neuronal-and-cardiomyocyte-differentiation-cm4ai-yjftt2oec6c
  name: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
  description: 'This dataset contains mass spectrometry-based proteomics data investigating
    the protein-protein interaction networks during the differentiation of KOLF2.1J human
    induced pluripotent stem cells (iPSCs). We employed Size Exclusion Chromatography coupled
    with Mass Spectrometry (SEC-MS) to map multiscale biological organization across three
    distinct stages:  Parental: Undifferentiated iPSCs.  NPC: Neural Progenitor Cells.  Neurons:
    Terminally differentiated neurons.  Cardio: Terminally differentiated Cardiomyocyte.  The
    study aims to identify how protein complexes and networks are reorganized during neuronal
    lineage commitment and cardiomycyte differentiation. Data was acquired on a Bruker timsTOF
    platform, and quantitative analysis was performed using Spectronaut.  Experimental Design:  Sample
    Groups: Parental (Reps 1-4), NPC (Reps 1-2), Neuron (Reps 1-3), and Cardio (Reps 1-2).  Modality:
    SEC-MS for protein correlation profiling.  Data Processing: Raw data was processed using
    Spectronaut; downstream analysis was conducted in R using MSstats-compatible formats.'
