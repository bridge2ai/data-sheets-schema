intended_uses:
- id: d4d:cm4ai-june2026-intended-uses
  name: Declared use cases
  usage_notes: 'AI-ready datasets to support research in functional genomics, AI/machine learning
    model training, cellular process analysis, cell architectural changes, and interactions
    in presence of specific disease processes, treatment conditions, or genetic perturbations.
    A major goal is to enable biologically-driven, interpretable ML applications, for example
    as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).'
  use_category:
  - functional genomics research
  - AI/machine learning model training
  - cellular process analysis
  - analysis of cell architectural changes
  - analysis of interactions in the presence of specific disease processes, treatment conditions
    or genetic perturbations
  examples:
  - 'Biologically-driven, interpretable ML applications as proposed in Ma et al. 2018 (PMID:
    29505029).'
  - 'Biologically-driven, interpretable ML applications as proposed in Kuenzi et al. 2020
    (PMID: 33096023).'
