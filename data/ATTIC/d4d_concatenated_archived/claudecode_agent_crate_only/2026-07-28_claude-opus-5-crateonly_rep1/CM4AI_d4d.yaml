    as ISO dates on a US month/day/year reading; the crate does not declare a date format.
missing_data_documentation:
- id: d4d:cm4ai-june2026-missing-data
  name: Declared missing and embargoed data
  missing_data_patterns:
  - Some datasets are under temporary pre-publication embargo.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq
    data interrogate sets of proteins which incompletely overlap.
  - Computed cell maps not included in this release.
  missing_data_causes:
  - Temporary pre-publication embargo.
  - The release is an interim release; predicted cell maps will be added in future releases.
  description: Some datasets are under temporary pre-publication embargo. Protein-protein
    interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data interrogate
    sets of proteins which incompletely overlap. Computed cell maps not included in this release.
