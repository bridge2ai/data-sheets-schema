known_biases:
- id: d4d:cm4ai-june2026-bias-cell-line-representation
  name: Cell-line derivation limits population representativeness
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines, and does not represent all biological variants which may be seen in
    the population at large.
known_limitations:
- id: d4d:cm4ai-june2026-limitation-interim-release
  name: Interim release without predicted cell maps
  limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps,
    which will be added in future releases. The current release is most suitable for bioinformatics
    analysis of the individual datasets. Requires domain expertise for meaningful analysis.
- id: d4d:cm4ai-june2026-limitation-completeness
  name: Incomplete final form, embargo and partial protein overlap
  limitation_type: coverage_limitation
  limitation_description: These data are not yet in completed final form, and some datasets
    are under temporary pre-publication embargo. Protein-protein interaction (SEC-MS), protein
    localization (IF imaging), and CRISPRi perturbSeq data interrogate sets of proteins which
    incompletely overlap. Computed cell maps not included in this release.
- id: d4d:cm4ai-june2026-limitation-checksum-coverage
  name: Sparse checksum coverage
  limitation_description: The crate's AI-readiness self-assessment reports that 0% of files
    have checksums (8 of 55859 entities carry a checksum), which limits independent verification
    of file integrity.
