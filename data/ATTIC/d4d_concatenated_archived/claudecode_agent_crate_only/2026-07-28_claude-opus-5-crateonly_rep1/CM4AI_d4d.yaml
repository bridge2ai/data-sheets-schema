distribution_formats:
- id: d4d:cm4ai-june2026-format-rocrate
  name: RO-Crate (JSON-LD) packaging
  description: CM4AI output data are packaged with provenance graphs and rich metadata as
    AI-ready datasets in RO-Crate format using the FAIRSCAPE framework (fairscapeVersion 1.1.3).
    The metadata descriptor conforms to RO-Crate 1.2. The crate uses the schema.org vocabulary
    and conforms to the Croissant RAI specification.
  access_urls:
