acquisition_methods:
- id: d4d:cm4ai-june2026-acquisition-assay-modalities
  name: Assay modalities used to acquire the data
  acquisition_details:
  - 'Declared data collection types: Perturb-seq; IF imaging; SEC-MS; AP-MS.'
  - 'Data collection processes are generally described in Clark T et al. (2024) "Cell Maps
    for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant
    Cell Lines" bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311.
    Additional data collection details will be subsequently published once finalized.'
collection_mechanisms:
- id: d4d:cm4ai-june2026-mechanism-if-imaging
  name: Immunofluorescence imaging
  mechanism_details:
  - Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab
    at Stanford University.
  - Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and antibody
    against protein of interest (green channel).
- id: d4d:cm4ai-june2026-mechanism-apms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - AP-MS raw data generated from endogenously tagged MDA-MB-468 cells under paclitaxel or
    vorinostat perturbation.
  - All AP-MS experiments were performed in four biological replicates. Each AP-MS batch includes
    an untagged parental control, 10 chromatin modifier tagged cell lines, and a positive
    control tagged line. DMSO-treated samples serve as vehicle control across all AP-MS experiments
    (Unpublished data).
- id: d4d:cm4ai-june2026-mechanism-secms
  name: Size exclusion chromatography coupled with mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS for protein correlation profiling across undifferentiated KOLF2.1J iPSCs and iPSC-derived
    NPCs, neurons and cardiomyocytes; sample groups Parental (Reps 1-4), NPC (Reps 1-2), Neuron
    (Reps 1-3), Cardio (Reps 1-2).
  - Data was acquired on a Bruker timsTOF platform, and quantitative analysis was performed
    using Spectronaut.
  - SEC-MS was also applied to MDA-MB468 human breast cancer cells following treatment with
    vorinostat or paclitaxel in the Nevan Krogan laboratory at the University of California
    San Francisco.
- id: d4d:cm4ai-june2026-mechanism-perturbseq
  name: CRISPRi perturb-seq
  mechanism_details:
  - Expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced pluripotent
    stem cells (hiPSCs) mapping transcriptional and fitness phenotypes associated with 11,739
    targeted genes.
  - Findings were validated via phenotypic, protein-interaction, and metabolic tracing assays.
