relationships:
- id: d4d:cm4ai-june2026-relationship-component-crates
  name: Release is composed of nine component RO-Crates
  relationship_details:
  - 'The June 2026 Data Release RO-Crate declares 60 hasPart entries and contains nine component
    RO-Crates: two EndoTag AP-MS crates (paclitaxel, vorinostat), three IF image crates (paclitaxel,
    untreated, vorinostat), two SEC-MS crates (KOLF2 differentiation, treated MDA-MB468 cancer
    cells), and two Perturbation Cell Atlas crates (raw sequence data, perturb-seq).'
  - The release RO-Crate is itself declared isPartOf a University of California San Diego
    organization record and a Cell Maps for Artificial Intelligence project record.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq
    data interrogate sets of proteins which incompletely overlap.
