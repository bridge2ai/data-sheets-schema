conforms_to: >-
  The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1 specification: one
  directory per datatype at the root, then one directory per modality, then one per device, then one
  per participant, named by the participant identifier used in the study. Within datatypes the data
  files follow the WaveForm DataBase (WFDB) standard for cardiac_ecg; the Observational Medical
  Outcomes Partnership (OMOP) Common Data Model for clinical_data; the NASA ASCII File Format
  Guidelines for Earth Science Data for environment; Digital Imaging and Communications in Medicine
  (DICOM) for retinal_flio, retinal_oct, retinal_octa and retinal_photography; and Open mHealth for
  wearable_activity_monitor and wearable_blood_glucose. Root-level metadata files (CHANGELOG.md,
  dataset_description.json, dataset_structure_description.json, healthsheet.md, LICENSE.txt,
  participants.json, participants.tsv, README.md, study_description.json) and per-datatype
  manifest.tsv files also follow CDS v0.1.1.
