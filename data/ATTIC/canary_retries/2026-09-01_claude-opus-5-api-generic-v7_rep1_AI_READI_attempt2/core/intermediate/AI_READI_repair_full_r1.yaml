notes: >-
  The FAIRhub landing pages for this dataset and the AI-READI documentation site both carry the
  banner "This repository is under review for potential modification in compliance with
  Administration directives." FAIRhub also indicates that a smaller mini version of the dataset is
  available for pipeline development, recorded in the FAIRhub API as a child record of this release;
  the bundle gives that mini version no DOI or other identifier. The FAIRhub API records the dataset
  as having no parent record. FAIRhub reports 24,636 views and 0 citations for this release. The
  dataset is published by FAIRhub, which the FAIRhub DataCite record names as publisher; the bundle
  supplies no registry identifier for that organization. The Microsoft AI for Good Lab supported the
  cloud services needed for the project, an in-kind contribution acknowledged in the Nature
  Metabolism comment rather than a funding award. There is currently no mechanism for others outside
  the project to extend or augment the AI-READI dataset.
source_caveats: >-
  Several sources in the bundle disagree, and the higher-ranked source was preferred in each case.
  (1) License name: the FAIRhub landing page (tier 1) labels the license "Health Data License", the
  FAIRhub API rights entry (tier 1) names it "AI-READI custom license v2.0", and the license document
  itself (tier 2) is titled "AI-READI DATA LICENSE AGREEMENT (Version 2.0)"; a tier 1 value is stated
  in the license slot and the full agreement is described in license_and_use_terms. (2) Publisher:
  the FAIRhub API dataset description gives publisherName "FAIRhub" while the RO-Crate gives
  publisher "AI-READI Consortium"; both are tier 1 and neither carries a registry identifier, so the
  publisher slot is left unset and both statements are recorded in notes and in the distribution
  slots. (3) IRB: the RO-Crate names the reviewing body "Washington University IRB" but gives a
  University of Washington Human Subjects Division address and the hsdrely@uw.edu contact, while the
  BMJ Open protocol states approval by the Institutional Review Board of the University of
  Washington; protocol number STUDY00016228 is consistent across sources. (4) Principal investigator
  affiliation: the FAIRhub study description gives Washington University in St. Louis (ROR 01yc7t268)
  for Aaron Lee and Cecilia Lee, the RO-Crate gives "Aaron Lee, Department of Ophthalmology,
  University of Washington", and the two publications and NIH RePORTER give University of Washington;
  the FAIRhub values are recorded in the creator entries. (5) Enrollment start: FAIRhub records
  2023-07-19 while the BMJ Open protocol states enrolment began on 18 July 2023; the FAIRhub value is
  used. (6) Target enrollment: FAIRhub, Nature Metabolism and BMJ Open state 4,000 participants, NIH
  RePORTER states 4,000+, and the IRB application states 4,600. (7) De-identification: FAIRhub states
  that no identifiers were collected so no active de-identification was necessary, whereas the Nature
  Metabolism comment states the public set is stripped of Protected Health Information via the HIPAA
  Safe Harbor method. (8) Sampling: the healthsheet answers that the dataset contains all possible
  instances and that sampling strategy is not applicable, while the FAIRhub study description records
  samplingMethod "Non-Probability Sample"; these appear in the same tier 1 source and both are
  represented. (9) Release scope: the healthsheet describes v3.0.0 as data collected up through the
  end of the second year of the study, while the README changelog labels v3.0.0 the "main study"
  release comprising pilot, year 2 and year 3 data. Three healthsheet questions carry empty responses
  in the source and so support no value here: the erratum question, the question about measures taken
  to avoid re-identification after de-identification, and the question about pre-processing for
  de-identification. The variables slot below records the clinical laboratory panel and the principal
  device-derived measures documented in the bundle; the complete variable list is held in the dataset
  documentation at https://docs.aireadi.org and was not part of the bundle. An RO-Crate metadata
  document (FAIRscape profile 0.1, RO-Crate 1.2-DRAFT) describing this release was among the sources
  but is not listed among the release's own CDS metadata files, so RO-Crate is not recorded as a
  standard the distributed content follows. The creators list below records the single organizational
  creator named in the DataCite metadata followed by the sixteen individuals FAIRhub lists as Study
  Principal Investigators. Neither the confidentiality level nor the HIPAA compliance status is
  stated in the schema's own terms by any source, so those enum slots are left unset and the source
  statements are recorded in prose; likewise no source settles whether at-risk groups are included,
  so that boolean is left unset.

