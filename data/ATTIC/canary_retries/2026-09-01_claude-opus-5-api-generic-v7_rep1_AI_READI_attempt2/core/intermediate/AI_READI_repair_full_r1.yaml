- variable_name: Diastolic blood pressure
  unit: mm Hg
  data_type: float
  measurement_technique: >-
    Automatic oscillometric medically approved device, measured twice separated by 2 minutes; devices
    used across sites were the OMRON HEM 907XL, Medline MDS4001 and Welch Allyn 6000 series.
