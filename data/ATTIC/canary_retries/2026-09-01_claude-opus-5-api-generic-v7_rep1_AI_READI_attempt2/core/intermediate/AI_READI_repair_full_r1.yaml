id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI Project (alternative
  title "AI-READI dataset") is a multimodal, cross-sectional dataset of 2,280 adults with and
  without type 2 diabetes mellitus (T2DM), harmonized across three United States data collection
  sites: the University of Alabama at Birmingham, the University of California San Diego, and the
  University of Washington. Data were collected between July 19, 2023 and May 1, 2025; the release
  contains 356,343 files totaling approximately 3.82 TB. Each instance represents an individual
  study participant. Modalities include clinical data collected through REDCap and mapped
  one-to-one onto OMOP Common Data Model tables (blood and urine laboratory results, physical
  measurements, vision assessments, monofilament testing for peripheral neuropathy, the Montreal
  Cognitive Assessment, and survey questionnaires including social determinants of health);
  12-lead electrocardiography stored in WaveForm DataBase format; retinal photography, optical
  coherence tomography, optical coherence tomography angiography and fluorescence lifetime imaging
  ophthalmoscopy stored in DICOM; ten days of continuous glucose monitoring (Dexcom G6) and ten
  days of wearable activity monitoring (Garmin Vivosmart 5) stored in Open mHealth format; and ten
  days of indoor environmental sensor measurements from a custom-built LeeLab Anura unit stored in
  the NASA ASCII file format for Earth science data. Recruitment sampling aimed at an approximately
  equal distribution of participants across self-reported race/ethnicity, biological sex and
  diabetes severity (no diabetes; pre-diabetes or lifestyle-controlled; controlled by oral or
  non-insulin injectable medication; insulin-dependent), so that the data would support development
  of unbiased AI/ML models and downstream pseudotime manifold analysis of the pathway from disease
  to health (salutogenesis). This release contains no protected health information; information on
  participants' sex and race/ethnicity and on medications used has been removed and is held in a
  controlled-access counterpart. The dataset was produced by the AI-READI project, one of the data
  generation projects of the NIH Common Fund Bridge2AI program, and is published on the FAIRhub
  platform.
