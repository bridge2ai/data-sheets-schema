  unit: bpm
  data_type: float
  measurement_technique: Read from the electrocardiogram or blood pressure measurement device; also recorded continuously by the Garmin Vivosmart 5.
- variable_name: Body mass index
  data_type: float
  derivation: Calculated from measured height and weight.
- variable_name: Waist-hip ratio
  data_type: float
  derivation: Calculated from measured waist and hip circumference.
- variable_name: Montreal Cognitive Assessment total score
  data_type: integer
  minimum_value: 0.0
  maximum_value: 30.0
  measurement_technique: MoCA Duo application administered electronically on an iPad; total score plus six domain-specific index scores, a Memory Index Score and task completion times.
  notes: Higher numbers represent better performance; the total possible score is 30.
- variable_name: Best-corrected visual acuity (logMAR)
  data_type: float
  measurement_technique: >-
    M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes tested
    separately under photopic conditions and under mesopic conditions through a 2.0 neutral density
    filter.
  notes: Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate better resolution. Snellen visual acuity variables were dropped in this version.
- variable_name: Letter contrast sensitivity (log CS)
  data_type: float
  measurement_technique: >-
    Mars Letter Contrast Sensitivity chart (Mars Perceptrix), monocular, under photopic conditions and
    under mesopic conditions using a neutral density occluder.
  notes: Expressed as log sensitivity; higher numbers mean better sensitivity.
- variable_name: Monofilament touch perception
  data_type: categorical
  measurement_technique: >-
    Standard 10 g monofilament applied to three locations on each foot, ten times per location, with
    the participant's eyes closed and responding yes or no.
