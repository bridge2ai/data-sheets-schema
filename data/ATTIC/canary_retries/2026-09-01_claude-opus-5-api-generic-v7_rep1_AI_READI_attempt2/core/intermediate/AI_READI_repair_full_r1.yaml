acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: >-
    The acquisition of data varied based on the domain. Some data were directly observable, such as
    laboratory results, vitals and retinal imaging, whereas other data were reported by subjects, for
    example survey responses. Verification of data entry was performed when possible, for example by
    cross-referencing entered medications with medications that were physically brought in or
    photographed by each study participant. The RO-Crate records the data collection type as manual
    human curation.

collection_mechanisms:
- mechanism_details: >-
    REDCap was used for collecting patient-reported data from questionnaires and for the following
    clinical data from the visit: medications assessment, vitals, visual acuity, contrast
    sensitivity, monofilament test results and complete blood count test results. Participants
    accessed questionnaires and the consent workflow through a REDCap interface reached by
    personalized links, access codes and QR codes.
- mechanism_details: >-
    A 12-lead electrocardiogram was performed with a Philips PageWriter TC30 Cardiograph while the
    participant sat in a reclining chair or lay supine, with the position recorded (0, 30, 60 or 90
    degrees relative to supine). Data were exported in .xml format to local storage.
- mechanism_details: >-
    Retinal imaging used multiple devices, with both eyes imaged on each participant and all images
    collected under dilated conditions except the Optomed. Devices were the Optomed Aurora IQ
    handheld non-mydriatic fundus camera (4 images per participant), the iCare EIDON widefield
    truecolor confocal fundus system (12 images), the Heidelberg Spectralis HRA OCT and OCTA (6
    images), the Topcon Maestro2 3D OCT-1 (6 images), the Topcon Triton DRI OCT (6 images), the Carl
    Zeiss Meditec Cirrus 5000 (8 images), and Heidelberg fluorescence lifetime imaging
    ophthalmoscopy (2 images).
- mechanism_details: >-
    At the end of the in-person visit, participants were sent home with three monitoring devices to
    use continuously for 10 days: a custom home environmental sensor (LeeLab Anura, designed at the
    Karalis Johnson Retina Center, University of Washington), a Garmin Vivosmart 5 fitness tracker
    worn on the participant's chosen wrist, and a Dexcom G6 continuous glucose monitor applied to the
    abdomen. Participants were masked to the Dexcom results during the monitoring period and returned
    the devices by overnight mail or in person, with a data sheet indicating which wrist the tracker
    was worn on, their dominant hand and where the environmental sensor was placed in the home.
- mechanism_details: >-
    Blood (approximately 53 mL) and urine were collected during the study visit. One EDTA vacutainer
    was dedicated to a local CLIA-certified clinical testing laboratory for complete blood count
    analysis; whole blood, plasma, serum and urine for central assays were batch-shipped on dry ice
    to the University of Washington Nutrition and Obesity Research Center laboratory approximately
    once per quarter. Results were provided in .csv format.
- mechanism_details: >-
    Cognitive screening used the Montreal Cognitive Assessment administered electronically on an iPad
    using the MoCA Duo application, which captures participant responses interactively; total score,
    section subscores, Memory Index Score and task completion times were exported as .csv. Peripheral
    neuropathy was assessed with the 10 g monofilament test. Vision testing used the M&S Technologies
    Electronic Visual Acuity tester, the Mars Letter Contrast Sensitivity chart, a Topcon KR 800
    autorefractor and, for spectacle prescriptions, NIDEK LM-600P or Topcon CL-200/CL-300
    lensometers.
- mechanism_details: >-
    Imaging and monitoring devices were supplied by manufacturers for the study: Topcon Corporation,
    Optomed, iCare World and Carl Zeiss loaned their devices for research purposes at no cost, and
    Heidelberg Engineering, Dexcom and Garmin provided research discounts on study devices.
- mechanism_details: >-
    All data are uploaded at regular intervals by each data collection site to FAIRhub, an AI-READI
    specific Microsoft Azure cloud-based data management, curation and sharing platform developed for
    this project. The Microsoft AI for Good Lab supported the cloud services needed for the project.

collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: >-
    For this version of the dataset the timeframe for data collection was July 19, 2023 to May 1,
    2025. Preliminary pilot enrollment occurred between 18 July 2023 and 30 November 2023 to secure
    sufficient familiarity for all coordinators, and the formal data collection process began on 1
    December 2023. The overall project timeline spans four years, with one year dedicated to protocol
    development and training and years 2-4 allocated to subject recruitment and data collection;
    enrolment will continue until 30 November 2026 and the anticipated study completion date is
    2027-01-01. Approximately 4% of participants are expected to undergo a follow-up examination in
    year 4.

data_collectors:
- role: Clinical research coordinator
  collector_details: >-
    Clinical research coordinators contacted and consented research participants, ushered participants
    through the research visit, conducted study visits including collection of ophthalmologic images,
    provided training on study procedures such as continuous glucose monitoring and the fitness
    tracker, and ensured the return of all study materials. All research personnel who recruited,
    enrolled and collected data underwent training by the data manager at the University of Alabama
    at Birmingham and used a detailed Manual of Procedures; a certification process was required, and
    before enrolling participants each coordinator had to administer all protocol elements
    successfully to at least three volunteer practice subjects.
- role: Research assistant
  collector_details: >-
    Research assistants conducted study visits including collection of ophthalmologic images, provided
    training on study procedures, ensured the return of study materials under the direction of the
    study coordinator or project manager, and were responsible for data upload and management from
    each clinic visit.
- role: Data manager
  collector_details: >-
    A data manager at each data site oversaw the process and was responsible for the quality control
    of all data before uploading to FAIRhub; database managers ingested data into the REDCap database
    and extracted it for processing.
- role: Phlebotomist and laboratory assistant
  collector_details: >-
    Phlebotomists were responsible for blood collection from research participants and laboratory
    assistants for processing and shipping samples.
- role: Central project team
  collector_details: >-
    Once data were sent from each of the study sites to the central project team, software engineers,
    cloud engineers and research/data scientists conducted additional processing in preparation for
    dissemination.
  notes: >-
    Team members' effort was supported by National Institutes of Health award OT2OD032644 based on
    the percentage of effort contributed, with salaries aligned to the funding guidelines at each
    site.

direct_collection:
- is_direct: true
  collection_details: >-
    The data was collected directly from participants across the three recruiting sites. Recruitment
    pools were identified by screening electronic health records for diabetes and prediabetes ICD-10
    codes (R73.09 for pre-diabetes and E11.X for T2DM) for all patients who had an encounter with the
    sites' health systems; the study base is all patients aged 40 years and older who had a medical
    encounter within each health system site between 2020 and 2025. Individuals in each contact pool
    were mailed a hardcopy invitation letter and sent an invitation email, both personalized, that
    directed them into the online REDCap recruitment interface.

sampling_strategies:
- is_random: false
  is_representative: false
  strategies: >-
    Rather than targeting the demographic distribution of the US population, the study is
    triple-balanced, recruiting in equal proportions four race/ethnic groups (Asian, Black, White,
    Hispanic), four categories of T2DM (no diabetes; pre-diabetes or lifestyle-controlled diabetes;
    diabetes treated with oral or non-insulin injectable medications; insulin-controlled diabetes)
    and biological males and females, because building balanced datasets is critical for the
    development of unbiased machine learning models. Participants are recruited in waves whose
    composition and size are influenced by observed participation characteristics of race/ethnicity,
    gender, T2DM severity and site, with under- and oversampling of groups as needed. All study
    groups are recruited from each site, but the proportion of each group varies with the demographic
    prevalence of that group in the site's geographical area. The FAIRhub study description records
    the sampling method as "Non-Probability Sample".
  source_data: >-
    Electronic health records at the University of Alabama at Birmingham, the University of California
    San Diego and the University of Washington, screened by ICD-10 diagnosis code, age and
    demographics.
  why_not_representative: >-
    Recruitment is predominantly urban and hospital-based and the cohort does not include other races
    and ethnicities such as Pacific Islanders and Native Americans, so it may not provide a
    comprehensive representation of the population. Participants are volunteers, introducing
    volunteer bias.
  source_caveats: >-
    The healthsheet states that the dataset contains all possible instances, meaning all participants
    enrolled during the covered period, and answers "N/A" to the question about sampling strategy;
    the FAIRhub study description records samplingMethod "Non-Probability Sample". Both statements
    appear in the same tier 1 source, so is_sample is left unset and both are described here.

raw_data_sources:
- source_description: >-
    Participant-reported questionnaire responses and clinical data entered at the visit, captured in
    REDCap.
  source_type: Electronic data capture system
  raw_data_format: REDCap records exported for mapping to OMOP CDM
  access_details: >-
    The exact forms used for data collection in REDCap are published at
    https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
- source_description: Electrocardiogram recordings from the Philips PageWriter TC30 Cardiograph.
  source_type: Medical device export
  raw_data_format: .xml
- source_description: Montreal Cognitive Assessment results from the MoCA Duo application.
  source_type: Application export
  raw_data_format: .csv
- source_description: >-
    Retinal images from the Optomed Aurora, iCare EIDON, Heidelberg Spectralis, Topcon Maestro2,
    Topcon Triton, Carl Zeiss Cirrus 5000 and Heidelberg FLIO devices.
  source_type: Imaging device export
  raw_data_format: >-
    Native DICOM from the Optomed Aurora, iCare EIDON, Heidelberg Spectralis and Zeiss Cirrus; .fda
    from the Topcon Maestro2 and Triton, converted to DICOM; .sdt from FLIO, converted to DICOM.
- source_description: Continuous glucose monitoring records from the Dexcom G6.
  source_type: Wearable device export
  raw_data_format: .csv
- source_description: Physical activity and physiological records from the Garmin Vivosmart 5.
  source_type: Wearable device export
  raw_data_format: .FIT, converted to the Open mHealth standard for the dataset
- source_description: Indoor environmental measurements from the custom LeeLab Anura sensor.
  source_type: Custom sensor export
  raw_data_format: .csv
- source_description: >-
    Blood and urine laboratory testing performed by the University of Washington Nutrition and Obesity
    Research Center and by CLIA-certified laboratories local to each site.
  source_type: Clinical laboratory
  raw_data_format: .csv
- source_description: >-
    Electronic health records at the three sites, used to identify recruitment pools by ICD-10 code
    and demographics and, per the IRB application, to extract general health, eye health, medical and
    surgical history, diabetes, medication, laboratory and prior imaging records.
  source_type: Electronic health record

raw_sources:
- raw_data_details: >-
    The raw data is saved and expected to be preserved by the AI-READI project at least for the
    duration of the project but is not anticipated to be shared outside the project team at present,
    because it has not been mapped to standardized terminologies and because the raw data may
    accidentally include personal health information or personally identifiable information, for
    example in free text fields. There is a possibility that raw data may be included in future
    releases of the controlled access dataset.

cleaning_strategies:
- cleaning_details: >-
    Several quality control measures were used at the time of data entry and acquisition. Clinical
    data outside expected minimum and maximum ranges were flagged in REDCap and were visible in
    reports viewed by clinical research coordinators and data managers, who examined participant
    records and determined whether an error was likely. Data were checked for credibility using range
    checks to determine whether all responses fall within a prespecified reasonable range, for
    incorrect flow through prescribed skip patterns, for missing data that could be directly filled
    from other portions of an individual's record, and for the omission or duplication of records.
- cleaning_details: >-
    Editing was only done under the guidance and approval of the site principal investigator. If
    corrected data was available from elsewhere in the respondent's answers, the error was corrected;
    if there was no logical or appropriate way to correct the data, the site principal investigator
    reviewed the values and decided whether they should be removed from the data.
- cleaning_details: >-
    The dataset has been reviewed internally by AI-READI team members for quality checks and to ensure
    that no personally identifiable information was accidentally included. No formal external audit
    has been conducted.
- cleaning_details: >-
    The clinical_data directory ships a dqd_omop.json file supporting analysis with the OMOP CDM Data
    Quality Dashboard, which runs a set of more than 3,500 data quality checks against an OMOP CDM
    instance.

preprocessing_strategies:
- preprocessing_details: >-
    All data were mapped to standardized terminologies where possible. Clinical data were mapped to
    the Observational Medical Outcomes Partnership Common Data Model, with each CSV file in
    clinical_data forming a one-to-one mapping to an OMOP CDM table, and current medications were
    coded with RxNorm codes.
- preprocessing_details: >-
    Imaging data were converted to the Digital Imaging and Communications in Medicine standard.
    Participant images were exported from imaging devices in their raw format, and images from the
    Topcon Maestro2 and Triton (.fda) and from the Heidelberg FLIO (.sdt) required conversion to
    DICOM prior to upload.
- preprocessing_details: >-
    Electrocardiogram data were transformed into the WaveForm DataBase (WFDB) format; Garmin activity
    data exported in the .FIT file format were converted to the Open mHealth standard, as was the
    continuous glucose monitoring data; environmental sensor data follow the NASA ASCII file format
    guidelines for Earth science data.
- preprocessing_details: >-
    The release is organized following the Clinical Dataset Structure (CDS) v0.1.1 specification, a
    standard the project developed for consistently structuring and describing clinical research
    datasets, with root-level and per-datatype metadata files generated to match.
- preprocessing_details: >-
    For the public release, protected health information was excluded and information related to the
    sex and race/ethnicity of the participants as well as medications used was removed. Processing was
    described as custom or ad hoc for version 1.0.0 and as automated plus custom for the year 2 and
    year 3 data comprising this version.

ethical_reviews:
- reviewing_organization: Washington University IRB
  review_details: >-
    Human subject review status is recorded as "Submitted, approved" under protocol identifier
    STUDY00016228. The RO-Crate gives the reviewing body as "Washington University IRB" with the
    contact being the IRB Reliance Team, hsdrely@uw.edu, at the Human Subjects Division, University of
    Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, United States. The initial
    IRB approval was received on December 20, 2022, and the initial approval letter is published at
    https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf. An annual renewal application
    to the IRB about the status and progress of the study is required and is due within 90 days of
    expiration. The study is recorded as not FDA-regulated for either drug or device and as having no
    Data Monitoring Committee.
  source_caveats: >-
    The BMJ Open protocol states that AI-READI was approved by the Institutional Review Board of the
    University of Washington (approval number STUDY00016228), including reliance agreements with the
    IRBs of the University of Alabama at Birmingham and the University of California, San Diego. The
    RO-Crate names "Washington University IRB" while giving a University of Washington address; the
    higher-ranked RO-Crate value is used for the organization name and the BMJ statement is recorded
    here.
- review_details: >-
    The RO-Crate records the ethical review for the release and each of its sub-crates as having been
    carried out by Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans. The project
    states that it aims to establish standards, best practices and guidelines for collection,
    preparation and sharing of the data for the purposes of AI/ML, including guidance from
    bioethicists, and that ethical, legal and social implications are considered at every stage of the
    project cycle.

collection_consents:
- consent_details: >-
    Informed consent to participate was required before participation in any part of the protocol,
    including questionnaires. Potential participants were given the option to read all consent
    documentation electronically before their visit and to give consent with an electronic signature
    without verbal communication with a clinical research coordinator; participants could access
    e-consent documentation in REDCap and decide at that point not to participate or to request
    additional information. If participants did not select the option to consent electronically,
    consent was performed in person at the start of the visit. The approved consent form for the
    principal project site, the University of Washington, is published at
    https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf; the
    other clinical sites had IRB reliance and used the same consent form with minor
    institution-specific language depending on individual institutional requirements.

collection_notifications:
- notification_details: >-
    Each individual was aware of the data collection, as this was not passive data collection or
    secondary use of existing data but rather active data collection directly from participants.
    Potential participants were notified through personalized hardcopy invitation letters and
    invitation emails directing them to a REDCap interface where they could read an overview of the
    research programme, expectations for participation and answers to frequently asked questions,
    download the informed consent document, request a call back from study staff, complete a
    screening survey and enroll. Those without internet access could call research staff for
    alternative methods of enrolment.

consent_revocations:
- revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease study participation.
    However, any data that had been shared or used up to that point would stay in the dataset. This is
    clearly communicated in the consent document.

informed_consent:
- consent_obtained: true
  consent_type: >-
    Written informed consent, obtained either as electronic consent with an electronic signature
    through REDCap before the visit or in person on paper at the start of the visit.
  consent_documentation: >-
    Signed consent forms; upon signing, the electronic consent form was automatically emailed to the
    participant, who could request an additional copy from the study coordinator for the duration of
    the study. The approved University of Washington consent form is published with the dataset
    documentation.
  consent_scope: >-
    The FAIRhub consent metadata records consentType "ConsentSpecifiedNotElsewhereCategorised", with
    no non-commercial restriction, no geographic restriction, no research-type restriction, no
    genetic-only restriction and no methods restriction; the consent detail states that the public
    version of the dataset can only be used for type 2 diabetes related research while a private
    version will allow for more generic use. The consent covered placement of data in an open-source
    repository and the sending of samples to the study sample repository for future research.
  withdrawal_mechanism: >-
    Participants could withdraw consent at any time and cease participation; data already shared or
    used up to that point remain in the dataset, as stated in the consent document.

participant_privacy:
- anonymization_method: >-
    No direct identifiers were collected for the released dataset, and the data were checked to
    confirm that no data identifiable under US HIPAA were present. Sex, race/ethnicity and medication
    information were removed from the public release.
  privacy_techniques: >-
    A robust data dissemination system, a strict licence agreement and data watermarking are used for
    both public and controlled sets. The licence records that the data may be statically watermarked
    to identify the licensee for security purposes and that the licensee will take no action to
    remove, obscure, alter or mask such watermarking. Licensees must comply with NIH Genomic Data
    Sharing Policy security and privacy standards and may store the data only on servers maintained
    within their institution or on cloud services covered by a HIPAA Business Associate Agreement.
    The home environmental sensor and the Garmin fitness tracker were specifically chosen with
    participant privacy as a primary concern: these devices do not capture video or audio, are not
    equipped with GPS location monitoring and are not synced with participant-owned devices.
  data_linkage: >-
    Each participant folder is named after the participant's identifier number used in the study; the
    identifiers linking those numbers to individuals are not released. More sensitive variables are
    held in a controlled-access dataset available only to scientists whose institutions have
    completed legal and privacy use agreements with the AI-READI research programme.
  reidentification_risk: >-
    The project states that it does not currently anticipate uses of the dataset that could result in
    unfair treatment or harm, but that there is a theoretical risk of future re-identification. The
    Nature Metabolism comment notes that AI algorithms can infer individual patient characteristics
    and could facilitate individual-level identification, which motivated the dissemination system,
    licence and watermarking.

participant_compensation:
- compensation_provided: true
  compensation_amount: USD 200
  compensation_type: Stipend for the study visit
  compensation_rationale: >-
    Study subjects received a compensation of $200 for the study visit through the grant funding. The
    IRB application records that the stipend is provided when the final data are received and the
    study devices returned, typically at least two weeks after the study visit to allow for the
    ten-day home-based data collection and device return by mail, and that the payment is not
    prorated. The same type and amount of compensation applies to participants asked to return in
    year 4.
- compensation_provided: true
  compensation_type: Reimbursement of travel costs
  compensation_rationale: >-
    The study covers reasonable costs for parking, public transit or rideshare fees related to the
    study visit; transportation assistance through rideshare services was offered to participants who
    endorsed barriers to transporting themselves to study visits. Participants may incur costs for
    transport that will not be reimbursed if transportation fees exceed $25.

at_risk_populations:
  special_protections:
  - >-
    Eligibility restricted participation to adults aged 40 years or older who are able to provide
    consent, so minors are excluded. Pregnancy, gestational diabetes and type 1 diabetes are
    exclusionary; the FAIRhub eligibility module additionally records a maximum age of 85 years and
    healthyVolunteers "No". Study procedures were conducted in private rooms.
  - >-
    A Community Advisory Board of 11 persons from the three sites, including diversity in race and
    ethnicity as represented in the AI-READI sample, contributes to the development of the protocol.
  - >-
    The project engaged with the Native Biodata Consortium as a co-learning opportunity for
    understanding challenges specific to American Indian and Alaska Native communities and for
    evaluating tools such as data usage agreements, contract negotiations, transparent access
    agreements and forms of assured return of benefit and sustainable input, control and monitoring
    of Tribal data. The NIH RePORTER abstract states that the project will also engage in a tribal
    consultation to address barriers and facilitators of participation with the goal of collecting
    similar data within a Native American cohort in an ethical and respectful manner.
  source_caveats: >-
    The IRB application questions on prisoners and on other protected populations are unanswered in
    the material available in the bundle, and no source states whether at-risk groups are included in
    the released cohort, so at_risk_groups_included is left unset; the eligibility criteria and the
    community engagement measures the bundle does state are recorded above.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    Protocol STUDY00016228, initial approval received December 20, 2022; human subject review status
    recorded as "Submitted, approved"; annual renewal required within 90 days of expiration. Reliance
    agreements were in place with the IRBs of the University of Alabama at Birmingham and the
    University of California, San Diego.
  ethics_review_board: >-
    Washington University IRB per the RO-Crate, contacted through the IRB Reliance Team,
    hsdrely@uw.edu, at the University of Washington Human Subjects Division; the BMJ Open protocol
    describes this as the Institutional Review Board of the University of Washington.
  regulatory_compliance:
  - >-
    The study is registered on ClinicalTrials.gov as NCT06002048 and is recorded as not FDA-regulated
    for drug or device, with no Data Monitoring Committee. Data protection follows the HIPAA Privacy
    Rule, with the release checked for HIPAA-identifiable content; results returned to participants
    were sent by HIPAA-compliant encrypted email. Licensees must comply with the NIH Genomic Data
    Sharing Policy security best practices for controlled-access data. The IRB application records
    that data and specimen security protections were applied at Risk Level 3.
  special_populations:
  - >-
    Adults aged 40 years and older with and without type 2 diabetes, recruited into four study arms by
    diabetes severity. Pregnant women, people with gestational diabetes and people with type 1
    diabetes are excluded; participants must be able to read and speak English.
  notes: >-
    Data were collected in the United States only. English was used for all communication with study
    participants; accessibility measurements were not specifically assessed, though transportation
    assistance was offered to participants who reported barriers to attending study visits.

intended_uses:
- use_category: Type 2 diabetes research
  usage_notes: >-
    Accessing the dataset requires agreeing to use the data only for type 2 diabetes related research;
    the consent detail records that the public version of the dataset can only be used for type 2
    diabetes related research, while a private version will allow for more generic use.
- use_category: Artificial intelligence and machine learning research
  examples:
  - >-
    Training and development of AI/ML models on multimodal clinical, imaging, waveform and wearable
    data; the licence grants rights to create derivative works for research, commercial and
    non-commercial purposes and permits distribution of models, algorithms and programs developed,
    trained or adapted using the Data provided they do not themselves contain the Data.
  usage_notes: >-
    Data are stored and shared as "AI-ready", which the project states enables immediate AI/ML
    research without reformatting and preprocessing.
- use_category: Salutogenesis and disease-trajectory research
  examples:
  - >-
    Downstream pseudotime manifold analysis to predict disease trajectories and to reconstruct a
    temporal atlas of T2DM development and reversal toward health.
- use_category: Methods and standards development
  examples:
  - >-
    Use of the release as a worked example of the project's blueprint for collecting and sharing
    AI-ready datasets, including the Clinical Dataset Structure specification and the FAIR guidelines
    developed for each data type.

prohibited_uses:
- prohibition_reason: >-
    Licensees shall not make clinical treatment decisions based on the Data, as it is intended solely
    as a research resource.
- prohibition_reason: >-
    Licensees shall not use or attempt to use the Data, alone or in concert with other information, to
    compromise or otherwise infringe the confidentiality of information about a Data Subject, to
    invade or compromise the privacy of any Data Subject, to attempt to identify or contact any Data
    Subject or group of Data Subjects, to extract or extrapolate identifying information, to establish
    a Data Subject's membership in a particular group of persons, or otherwise to cause harm or injury
    to any Data Subject.
- prohibition_reason: >-
    Licensees shall not share or distribute the Data with any third party model vendor or developer for
    training or development purposes, even if that vendor is party to a Business Associate Agreement
    with the licensee's institution, where training includes model weight modification and other
    adjustments to a model's logic or operation. Short-term interaction such as prompting or querying
    a third party model under a Business Associate Agreement is permitted for analysis.
- prohibition_reason: >-
    Licensees shall not transfer, license, sublicense, sell, assign, display, share or otherwise convey
    any portion of the Data or any derivative work to any third party other than another licensee
    bound by an identical agreement with the Licensor.
- prohibition_reason: >-
    Data may not be reproduced in papers, articles, presentations, analyses, reports or publications,
    except that small representative samples may be reproduced in up to five images or figures per
    paper for illustrative purposes only; larger amounts shall not be published, posted or otherwise
    made available via supplemental files, zip archives, code packages or other means, notwithstanding
    journal or conference requirements.
- prohibition_reason: >-
    Licensees shall take no action to remove, obscure, alter or mask the static watermarking applied to
    the data for security purposes.
- prohibition_reason: >-
    The Data may be stored only on servers and devices maintained by and located within the licensee's
    institution or employer, or on cloud or remote storage and backup services that have a
    HIPAA-approved Business Associate Agreement in place with the licensee's institution or employer.

discouraged_uses:
- discouragement_details: >-
    Asked whether there are any types of usage or applications discouraged from using this dataset,
    the healthsheet answers that the AI-READI dataset licence imposes certain restrictions on the
    usage of the data and refers to the licence files at https://doi.org/10.5281/zenodo.17555036;
    asked separately whether there are tasks for which the dataset should not be used, it refers back
    to that same answer. The specific restrictions are recorded as prohibited uses rather than as
    discouragements, because the licence states them as binding terms.

future_use_impacts:
- impact_details: >-
    The project states that, to the extent of its knowledge, it does not currently anticipate uses of
    the dataset that could result in unfair treatment or harm, but that there is a theoretical risk of
    future re-identification.
- impact_details: >-
    Because enrollment is ongoing, the pilot data release and periodic updates to data releases may not
    have achieved balanced distribution across groups, so models developed from a given version may
    inherit residual imbalance across race/ethnicity, biological sex and diabetes severity.
- impact_details: >-
    Factors influencing the generalization of derived models include the predominantly urban and
    hospital-based recruitment and the absence of races and ethnicities such as Pacific Islanders and
    Native Americans from the cohort; the deliberate inclusion of multiple device makes and models for
    one measure is intended to enhance generalizability across the range of equipment used in clinical
    settings.

distribution_formats:
- media_type: application/dicom
  format: >-
    Digital Imaging and Communications in Medicine files for the retinal_flio, retinal_oct,
    retinal_octa and retinal_photography datatypes.
  access_urls:
  - https://fairhub.io/datasets/3
  - https://fairhub.io/datasets/3/access
- media_type: text/csv
  format: >-
    Comma-separated value files, including the clinical_data tables mapped one-to-one onto OMOP CDM
    tables.
- media_type: application/json
  format: >-
    JSON files, including the Open mHealth formatted wearable activity and continuous glucose
    monitoring records and the CDS metadata files dataset_description.json,
    dataset_structure_description.json, participants.json and study_description.json.
- media_type: text/markdown
  format: Markdown documentation files distributed with the release, including README.md, CHANGELOG.md and healthsheet.md.
  notes: >-
    The project states that all data files are in formats accessible with free software commonly used
    for such data types, so no specific software is required. The dataset is distributed through the
    FAIRhub platform, which the FAIRhub DataCite record names as publisher and which hosts the data on
    Microsoft Azure. A smaller mini version of the dataset is offered for pipeline development, and
    version 3 documentation additionally covers Azure Storage access.

distribution_dates:
- release_dates:
  - >-
    Version 1.0.0 (DOI 10.60775/fairhub.1) was distributed on May 3, 2024; version 2.0.0 (DOI
    10.60775/fairhub.2) on November 8, 2024; version 3.0.0 (DOI 10.60775/fairhub.3) on November 17,
    2025. The FAIRhub DataCite date entry records 2025-11-17 as the date this dataset was made
    available on FAIRhub.

third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed and available for public use through the FAIRhub platform. Onward
    sharing by recipients is restricted: a licensee shall not transfer, license, sublicense, sell,
    assign, display, share or otherwise convey any portion of the Data or any derivative work to any
    third party other than another licensee bound by an agreement with the Licensor on identical
    terms, in which case access may be given for the purpose of collaborating on one or more projects
    involving the Data. Derivative data, including synthetic data created from the Data, is treated as
    Data and subject to the same restrictions.

maintainers:
- role: academic_institution
  maintainer_details: >-
    The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub through
    Microsoft Azure. The healthsheet refers users to the README file included with the dataset for
    contact information; the README directs questions, suggestions and feedback to
    https://aireadi.org/contact and refers to the study_description.json and dataset_description.json
    metadata files for additional information about the contact person or entity, authors and
    contributors. The RO-Crate gives the contact point as https://docs.aireadi.org/docs/3/contact, and
    the FAIRhub central contact is Aaron Lee, MD, contact@aireadi.org.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project. New instances are added only through the project's own
    versioned releases as more study participants complete the study visit.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and will not be updated in place. Rather, new versions
    of the dataset will be released with additional instances as more study participants complete the
    study visit, approximately once a year, with additional data from participants enrolled since the
    last version release. Changes between versions are provided in detail in the CHANGELOG file
    included in the dataset and visible at docs.aireadi.org.

version_access:
  versions_available:
  - >-
    Version 1.0.0, DOI 10.60775/fairhub.1, released May 3, 2024, 204 participants, pilot data
    collection phase. Version 2.0.0, DOI 10.60775/fairhub.2, released November 8, 2024, 1,067
    participants, 165,051 files and 2.01 TB. Version 3.0.0, DOI 10.60775/fairhub.3, released November
    17, 2025, 2,280 participants, 356,343 files and 3.82 TB.
  latest_version_doi: doi:10.60775/fairhub.3
  version_details: >-
    Older versions will not continue to be supported: the FAIRhub pages for versions 1.0.0 and 2.0.0
    state that those versions of the dataset are no longer accessible and refer users to the latest
    version. One version of the documentation is associated with each version of the dataset and can
    be reached from a dropdown at https://docs.aireadi.org; earlier datasheets remain published at
    https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet. The changelog summarizes version 1.0.0 as the
    pilot with 204 participants and 15+ data types processed custom or ad hoc; year 2 data added 863
    participants and one imaging device; year 3 data added 1,213 participants and three imaging
    devices; version 3.0.0 is the main study release with 2,280 participants.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. The raw data is
    saved and expected to be preserved by the AI-READI project at least for the duration of the
    project.

data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  committee_contact: Aaron Lee
  notes: >-
    The committee contact Aaron Lee is identified by ORCID:0000-0002-7452-1648.
  access_review_process: >-
    Accessing the dataset requires several steps: logging in through a verified ID system, agreeing to
    use the data only for type 2 diabetes related research, and agreeing to the licence terms, which
    set certain restrictions and obligations for data usage. The FAIRhub access type is recorded as
    "PublicDownloadSelfAttestationRequired" and the access route is https://fairhub.io/datasets/3/access.
    De-identified data are released approximately yearly in two datasets: a controlled access set and a
    publicly accessible set with fewer requirements for access; the controlled access set contains all
    data in the public set plus more sensitive data available only to scientists whose institutions have
    completed legal and privacy use agreements with the AI-READI research programme. The BMJ Open
    protocol states that the requirements for controlled access datasets were being developed by the
    Data Access Committee, and that information regarding data set availability and access may be found
    at https://aireadi.org/goals/data-sharing.
  stewardship_roles:
  - >-
    The RO-Crate names the AI-READI Consortium as the data governance committee. Washington University
    in St. Louis is the Licensor named in the data licence agreement, the lead sponsor of the study and
    the managing organization recorded in the FAIRhub dataset description. The data manager at each data
    site is responsible for the quality control of all data before uploading to FAIRhub. Aaron Lee is
    recorded as the responsible party (Principal Investigator, Associate Professor) and as the central
    contact, contact@aireadi.org. Collaborating organizations recorded on the study are the National
    Institutes of Health, the California Medical Innovations Institute, Johns Hopkins University, Oregon
    Health & Science University, Stanford University, the University of Alabama at Birmingham and the
    University of California, San Diego. Biobanked samples held at the University of Alabama at
    Birmingham Center for Clinical and Translational Science will eventually be available to scientists
    according to procedures and policies that are in development.
  source_caveats: >-
    The RO-Crate names the data governance committee as "AI-READI Consortium" while the BMJ Open protocol
    refers to a Data Access Committee developing the controlled-access requirements; the higher-ranked
    RO-Crate value is used for committee_name and the protocol statement is recorded in the review
    process. No access decision timeframe or appeal process is stated in the bundle.

license_and_use_terms:
  license_terms: >-
    The AI-READI Data License Agreement (Version 2.0), published at
    https://doi.org/10.5281/zenodo.17555036, with Washington University in St. Louis as Licensor. The
    FAIRhub landing page labels it "Health Data License" and the FAIRhub rights entry "AI-READI custom
    license v2.0". It is a custom licence specifically tailored to enable reuse of the AI-READI dataset
    and other clinical datasets for commercial or research purposes while putting strong requirements
    around data usage, security and secondary sharing to protect study participants, especially when
    data is reused for AI and ML applications. The Licensor grants a non-exclusive, non-transferable
    license to download, reproduce and use the Data and to create derivative works for research,
    commercial and non-commercial purposes. Licensees may be individuals or may sublicense to Authorized
    Users who are legal members of an officially recognized Authorized Group within the licensee's
    institution/employer; an individual's rights terminate automatically on severance of that
    relationship. Licensees must acknowledge the Licensor, the source and any funder of the Data in any
    papers reporting use, following the citation instructions at docs.aireadi.org, and must comply with
    NIH Genomic Data Sharing Policy security standards. The Data is provided "AS IS" without warranty;
    the Licensor's aggregate liability is limited to one U.S. dollar except where applicable law
    prohibits such limitation; the licensee indemnifies the Licensor. The agreement terminates
    automatically upon any breach, whereupon the licensee must delete all copies and cease all use. The
    agreement is governed in English and may be amended only in writing signed by both parties, subject
    to the Licensor's right to update its security policies.
  data_use_permission: disease_specific_research
  source_caveats: >-
    Access requires agreeing to use the data only for type 2 diabetes related research, which is
    recorded here as disease_specific_research; the licence itself separately permits commercial and
    non-commercial use and does not impose a non-commercial restriction, and the FAIRhub consent record
    sets consentNoncommercial, consentGeogRestrict, consentResearchType, consentGeneticOnly and
    consentNoMethods all to false. The three sources naming the licence disagree on its title: the
    tier 1 FAIRhub landing page gives "Health Data License", the tier 1 FAIRhub API rights entry gives
    "AI-READI custom license v2.0" and the tier 2 licence document is titled "AI-READI DATA LICENSE
    AGREEMENT (Version 2.0)"; the top-level license slot carries a tier 1 value and all three are
    recorded here.

ip_restrictions:
  restrictions:
  - >-
    Title to the Data, and all industrial and intellectual property rights therein, shall at all times
    remain solely and exclusively with the Licensor, Washington University in St. Louis, and its
    suppliers; the licensee shall not take any action inconsistent with such ownership, and any rights
    not expressly granted in the licence are reserved to the Licensor and its suppliers. The RO-Crate
    records the copyright notice as "Copyright (c) 2026 AI-READI". Asked whether third parties have
    imposed IP-based or other restrictions, the healthsheet refers to the licence. Licensees may make,
    reproduce and distribute models, algorithms and programs developed, trained or adapted using the
    Data but which do not themselves contain the Data or any modified version of it, provided that
    before dissemination they undertake all reasonable efforts to minimize the likelihood that Data can
    be memorized, derived, reconstructed or reconstituted through the use or construction of such
    models. Publishers and conference organizers wishing to reproduce larger amounts of Data may be
    referred to the Licensor for a separate licence. The IRB application notes that there are no plans
    for the researchers collecting the dataset to develop commercial products or file patents, but that
    the dataset is publicly available with a commercial-friendly open-source licence and products or
    patents may be developed from it in future.

regulatory_restrictions:
  regulatory_restrictions:
  - >-
    Asked whether export controls or other regulatory restrictions apply to the dataset or to individual
    instances, the healthsheet refers to the licence at https://doi.org/10.5281/zenodo.17555036. The
    licence requires the licensee to comply with all applicable laws, regulations and restrictions
    relating to the distribution and use of the Data and Models, restricts storage to servers maintained
    within the licensee's institution or to cloud or remote storage services covered by a HIPAA-approved
    Business Associate Agreement, and restricts publication of the Data to at most five illustrative
    images or figures per paper.
  other_compliance: >-
    Licensees must comply with all data security and privacy standards established by the U.S. National
    Institutes of Health under its Genomic Data Sharing (GDS) Policy, currently the NIH Security Best
    Practices for Controlled-Access Data Subject to the NIH GDS Policy. The study is recorded as not FDA
    regulated for either drug or device (RO-Crate fdaRegulated: false), and the RO-Crate records no
    human subject exemption. The RO-Crate records the confidentiality level of the release as "HL7:2N
    (normal)". On HIPAA, the FAIRhub metadata states that no identifiers were collected so no active
    de-identification was necessary but that the data were checked to confirm no identifiable data per
    US HIPAA were present, and records deIdentHIPAA true.
  source_caveats: >-
    No source in the bundle states the confidentiality level or the HIPAA compliance status in the
    schema's own terms, so confidentiality_level and hipaa_compliant are left unset and the source
    statements (RO-Crate "HL7:2N (normal)"; FAIRhub deIdentHIPAA true with a HIPAA identifiability
    check) are recorded in other_compliance instead.

