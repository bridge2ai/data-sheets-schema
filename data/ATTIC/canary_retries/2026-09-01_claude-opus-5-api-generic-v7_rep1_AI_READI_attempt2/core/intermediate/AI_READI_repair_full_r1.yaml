purposes:
- response: >-
    To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset on type 2
    diabetes mellitus so that future generations of artificial intelligence and machine learning
    research can provide critical insights into T2DM, including salutogenic pathways to return to
    health.
- response: >-
    To design data collection specifically to permit downstream pseudotime manifold analysis, an
    approach used to predict disease trajectories by learning from complex multimodal data collected
    from participants with differing disease severity, from normal to insulin-dependent T2DM, and so
    to reconstruct a temporal atlas of T2DM development and reversal toward health.
- response: >-
    To create a model and blueprint for developing large, scalable, AI-ready datasets, including
    guidelines for project management and for data collection, management and sharing that follow
    the Findable, Accessible, Interoperable, Reusable principles, and to establish standards, best
    practices and guidelines for the collection, preparation and sharing of data for AI/ML purposes
    with guidance from bioethicists.

addressing_gaps:
- response: >-
    The ability to understand and affect the course of complex, multi-organ diseases such as T2DM has
    been limited by a lack of well-designed, high quality, large and inclusive multimodal datasets.
- response: >-
    A major barrier to AI in health research has been the lack of diverse datasets that are AI ready
    for training AI models; the AI-READI dataset is intended to fill that gap by being stored and
    shared as "AI-ready", enabling AI/ML research without reformatting and preprocessing.
- response: >-
    Existing data sources such as claims or electronic health record data do not support the
    downstream AI/ML analyses the project targets, so a purpose-designed multi-domain acquisition
    protocol was created instead.
- response: >-
    Past research has under-represented groups that bear a higher burden of disease. A
    meta-epidemiological review of T2DM studies published from 2000 to 2020 found that samples lacked
    racial and ethnic diversity; the cohort is designed to be approximately balanced across Asian,
    Black, Hispanic and White participants, which the project describes as a demographic improvement
    over many previous epidemiological studies and clinical trials on T2DM.
- response: >-
    Current understanding of T2DM in the context of salutogenesis, the pathway from disease back to
    health, is limited; the dataset is assembled to enable study of that pathway rather than only of
    pathogenesis.

tasks:
- response: >-
    Downstream pseudotime manifold analysis to predict disease trajectories and reconstruct a
    temporal atlas of T2DM development and reversal toward health.
- response: >-
    Development of unbiased artificial intelligence and machine learning models, supported by
    recruitment sampling balanced across diabetes severity, self-reported race/ethnicity and
    biological sex.
- response: >-
    Multimodal model development for a complex multifactorial disease, drawing on tabular, imaging
    and physiological signal/waveform data from the same participants.
  source_caveats: >-
    The healthsheet states that the dataset is hypothesis-agnostic and comes with no predefined tasks
    or labels; the tasks recorded here are the analytical goals the project states for the data, not
    task definitions distributed with the dataset.

other_tasks:
- task_details: >-
    The dataset is hypothesis-agnostic, assembled from assessments across many health domains likely
    to be affected by T2DM rather than around a defined task, and the project states it is aimed at
    facilitating multiple potential downstream AI/ML applications beyond those originally planned.
    The healthsheet notes that no formal guidelines are in place for future researchers creating new
    labels or defining new tasks.

instances:
- instance_type: An individual study participant
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: >-
    No explicit label or target is associated with each data instance and no labeling was performed,
    because the dataset is hypothesis-agnostic and aimed at facilitating multiple potential
    downstream AI/ML applications.
  notes: >-
    Each instance consists of all of the data available for one individual participating in the
    study, spanning survey data, clinical data, retinal imaging data, environmental sensor data,
    continuous glucose monitor data and wearable activity monitor data; these encompass tabular
    data, imaging data and physiological signal/waveform data, and no unstructured text data is
    included.
  source_caveats: >-
    A single Instance object cannot carry a list of substrates, and the bundle documents several
    distinct substrates within one instance (DICOM images, comma-separated values, waveform data,
    time-series physiological data, questionnaire response data), so data_substrate is left unset;
    the substrate of each datatype directory is recorded instead in the file_collections entries and
    in conforms_to.

relationships:
- relationship_details: >-
    All instances are part of the same prospective data generation project, AI-READI. There is
    currently only one visit per participant. Participants are grouped into four study arms
    (no diabetes; pre-diabetes or lifestyle-controlled; oral or non-insulin injectable medication
    controlled; insulin dependent), all of which follow the same AI-READI protocol. Approximately
    4% of participants (about 10% of the study cohort in the original design) are expected to
    undergo a follow-up examination in year 4 of the project.

splits:
- split_details: >-
    The release comes with a recommended 70%/15%/15% split into training, validation and test sets,
    provided in the participants.tsv file. Because sex, race and ethnicity data are not released with
    the public version, the project team prepared the split so that the validation and test sets are
    balanced as well as possible for sex, race/ethnicity and diabetes status. Training set n=1,576
    (Hispanic 204, Asian 369, Black 343, White 660; male 599, female 977; no diabetes 600,
    lifestyle 384, oral 487, insulin 105; mean age 61.1 +/- 11.3 years). Validation set n=352
    (88 in each race/ethnicity group; male 176, female 176; no diabetes 88, lifestyle 88, oral 109,
    insulin 67; mean age 60.3 +/- 10.8 years). Test set n=352 (88 in each race/ethnicity group;
    male 176, female 176; no diabetes 88, lifestyle 88, oral 90, insulin 86; mean age 60.5 +/- 11.4
    years). The healthsheet states this recommended split is new in version 3 and is intended to
    reduce disparities in models developed using the dataset.

subpopulations:
- identification: >-
    Diabetes status group assigned at recruitment into one of four arms: no diabetes; pre-diabetes or
    Type 2 diabetes controlled by lifestyle adjustments; Type 2 diabetes controlled by oral or
    injectable medications other than insulin; Type 2 diabetes controlled by insulin.
  distribution: >-
    Across all 2,280 participants: no diabetes 776, lifestyle 560, oral 686, insulin 258.
- subpopulation_elements_present: false
  identification: >-
    Self-reported race and ethnicity (Asian, Black, Hispanic, White). These variables are removed from
    the public release and held under controlled access, so the released files do not identify this
    subpopulation, but aggregate counts are documented in the release README.
  distribution: >-
    Across all 2,280 participants: Hispanic 380, Asian 545, Black 519, White 836.
  source_caveats: >-
    Within the FAIRhub record the healthsheet answers "No" to whether the dataset identifies
    demographic sub-populations, while the README split table in the same record reports
    race/ethnicity and sex counts. The apparent conflict is internal to that one source and is
    resolved by the distinction between what the released files carry and what the documentation
    reports in aggregate; both statements are represented here.
- subpopulation_elements_present: false
  identification: >-
    Biological sex (male, female), self-reported at screening. Removed from the public release and
    held under controlled access.
  distribution: >-
    Across all 2,280 participants: male 951, female 1,329.

anomalies:
- anomaly_details: >-
    In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: >-
    In wearable data, improper use and technical failure such as battery failure or system malfunction
    are expected. The Garmin Vivosmart 5 battery had to be charged every two to three days, leaving
    gaps in the activity monitoring record.
- anomaly_details: >-
    In imaging data, patient uncooperation, noise that may obscure the images, technical failure such
    as system malfunction, and data transfer failures are expected.
- anomaly_details: >-
    In a few cases there may have been a data collision at some point in the process and data has been
    lost; in a few cases the data collection device did not have any stored results or was returned
    too late to retrieve the results, for example because the battery died.
- anomaly_details: >-
    Optomed Aurora fundus images are acquired undilated with a handheld camera, which makes a good
    view difficult to obtain, so image quality varies from patient to patient and within the same
    patient.
- anomaly_details: >-
    Fluorescence lifetime imaging ophthalmoscopy is performed as the last modality of the visit
    because it takes longer than a standard OCT and exposes patients to uncomfortable levels of
    light, so participants may not be at their best possible compliance; the device cannot tolerate
    more than one centimetre of movement during acquisition, and unwanted signals such as background
    light or lens fluorescence cannot simply be subtracted because they share the same Poisson
    distribution as the useful data.
- anomaly_details: >-
    Modalities that depend on an operator, such as the Heidelberg Spectralis, may raise quality issues
    that lead to skipping the modality and to missing data.

missing_data_documentation:
- missing_data_patterns: >-
    Not all modalities are available for all participants; information is missing from individual
    instances rather than uniformly across the dataset.
  missing_data_causes: >-
    Some participants elected not to participate in some study elements. In a few cases the data
    collection device did not have any stored results or was returned too late to retrieve the
    results, for example because the battery died or data was lost. In a few cases a data collision
    occurred at some point in the process and data has been lost. Survey respondents may skip
    questions or leave responses incomplete.
  handling_strategy: >-
    No data were excluded from the dataset at the time of preprocessing. During data entry, missing
    data that could be directly filled from other portions of an individual's record were identified
    by REDCap reports and corrected under the guidance and approval of the site principal
    investigator; where there was no logical or appropriate way to correct the data, the site
    principal investigator decided whether the values should be removed. No imputation is described.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so there is selection bias known as volunteer bias, which may limit
    the generalizability of results to those not represented in the study population. Eligibility
    also required participants to speak, read and understand English, which the protocol notes may
    have created challenges in recruiting Hispanic and/or Asian persons.
  mitigation_strategy: >-
    Recruitment proceeds in waves whose composition and size are influenced by observed participation
    characteristics of race/ethnicity, gender, T2DM severity and site, with under- and oversampling
    of groups as needed; if sample balancing on race/ethnicity emerges as a challenge, new
    recruitment strategies will be implemented.
- bias_type: sampling_bias
  bias_description: >-
    Recruitment is predominantly urban and hospital-based, drawn from patients who had an encounter
    with each site's health system, which may not fully capture all possible cultural and
    socioeconomic backgrounds.
  mitigation_strategy: >-
    Three recording sites were strategically selected for geographic variability across the United
    States and to ensure representation across various racial and ethnic groups, and individuals from
    all demographic backgrounds were recruited at all three sites. Uniform data collection protocols
    were implemented for all subjects irrespective of race/ethnicity, biological sex or diabetes
    severity across all study sites.
- bias_type: representation_bias
  bias_description: >-
    The study cohort may not provide a comprehensive representation of the population, as it does not
    include other races and ethnicities such as Pacific Islanders and Native Americans. It is also
    documented that recruiting Black men into health research is more difficult than recruiting other
    populations, while that population bears a disproportionate share of T2DM burden, and similar
    under-recruitment trends have been reported for Hispanic and Asian persons.
  affected_subsets:
  - >-
    Racial and ethnic groups outside the four recruited categories (Asian, Black, Hispanic, White).
- bias_type: measurement_bias
  bias_description: >-
    The same measure is captured on multiple device makes and models (for example OCT on Heidelberg
    Spectralis, Topcon Maestro2, Topcon Triton and Zeiss Cirrus), and specific scan modalities such
    as macula or wide scans differ between devices, which can introduce device-dependent variation.
  mitigation_strategy: >-
    Information on device make and model, including the specific modality used, was documented to
    ensure repeatability, and multiple devices were deliberately included for one measure to enhance
    generalizability and represent the broad range of equipment used in clinical settings.

known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: >-
    While the AI-READI cross-sectional database ultimately aims to achieve balance across
    race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
    balanced across these parameters, and because enrollment is ongoing, the pilot release and
    periodic updates to data releases may not have achieved balanced distribution across groups.
  recommended_mitigation: >-
    Use the recommended training/validation/test split supplied in participants.tsv, whose validation
    and test sets are balanced as well as possible for sex, race/ethnicity and diabetes status.
- limitation_type: scope_limitation
  limitation_description: >-
    The public release contains no protected health information, and information related to
    participants' sex and race/ethnicity as well as medications used has been removed. Data held
    under controlled access include 5-digit zip code, sex, race, ethnicity, genetic sequencing data,
    past health records, medications, and traffic and accident reports.
  scope_impact: >-
    Analyses that require demographic stratification, medication exposure or geography cannot be
    performed on the public release alone.
- limitation_type: temporal_limitation
  limitation_description: >-
    The study is cross-sectional with currently one visit per participant; at-home monitoring
    (continuous glucose, activity and environmental sensing) covers a ten-day window only.
- limitation_type: coverage_limitation
  limitation_description: >-
    Not all modalities are available for all participants, because some participants elected not to
    participate in some study elements and because of device and data-transfer failures.
- limitation_type: methodological_limitation
  limitation_description: >-
    A limitation of the associated biorepository is that there are a finite number of samples to share
    with scientists interested in using them in research; procedures for reviewing and prioritising
    written requests were to be developed before the biorepository is complete.
- limitation_type: integration_limitation
  limitation_description: >-
    Data fields are largely the same as the previous version, but the Snellen visual acuity variables
    were dropped in this version, so only logMAR visual acuity measurements are available; analyses
    that span versions must account for this.

content_warnings:
- content_warnings_present: false
  notes: >-
    The healthsheet answers "No" to whether the dataset contains data that, if viewed directly, might
    be offensive, insulting, threatening, or might otherwise pose any safety risk such as
    psychological safety and anxiety.

confidential_elements:
- confidential_elements_present: false
  confidentiality_details: >-
    The healthsheet states that the dataset does not contain data that might be considered
    confidential and that no personally identifiable information is included. The RO-Crate records
    the confidentiality level as "HL7:2N (normal)".

sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: >-
    The public dataset does not contain data considered sensitive. Sensitive elements are held in the
    controlled-access counterpart instead: racial and ethnic origins, location as 5-digit zip code,
    genetic sequencing data, past health records, medications, and motor vehicle traffic and accident
    reports. The RO-Crate nevertheless lists the categories of personal or sensitive information
    handled by the project as EHR, wearable monitoring, ECG, environmental sensor, continuous glucose
    monitor and wearable accelerometer data.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No de-identification transformation was applied because no identifiers were collected; the data
    were instead checked to confirm that no data identifiable under US HIPAA were present. The
    DataCite de-identification level is recorded as deIdentType "NoDeIdentification" with
    deIdentDirect true and deIdentHIPAA true, and dates, non-arrangement and k-anonymity flags false.
  identifiers_removed: >-
    Protected health information; information related to the sex and race/ethnicity of participants;
    medications used.
  deidentification_details: >-
    The RO-Crate records deidentified: true for the release and each of its sub-crates. The dataset
    has not undergone any formal external audit, but has been reviewed internally by AI-READI team
    members for quality checks and to ensure that no personally identifiable information was
    accidentally included. The healthsheet notes a theoretical risk of future re-identification.
  source_caveats: >-
    The Nature Metabolism comment (tier 3) states that the public set is stripped of Protected Health
    Information as defined by the HIPAA Privacy Rule via the "Safe Harbor" method, as well as
    information related to sex and race/ethnicity to prevent stigmatization of findings; the tier 1
    FAIRhub metadata instead states that no identifiers were collected so no active de-identification
    was necessary. The FAIRhub statement is preferred here. The healthsheet questions on measures
    taken to avoid re-identification and on pre-processing for de-identification carry empty responses
    in the source.

