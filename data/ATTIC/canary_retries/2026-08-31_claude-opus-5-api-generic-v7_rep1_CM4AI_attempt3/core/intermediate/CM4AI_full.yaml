ip_restrictions:
  restrictions:
  - >-
    Copyright to these datasets is held by the Regents of the University of California,
    except where otherwise indicated. Raw image data for spatial proteomics is copyright by
    The Board of Trustees of the Leland Stanford Junior University. Commercial use requires a
