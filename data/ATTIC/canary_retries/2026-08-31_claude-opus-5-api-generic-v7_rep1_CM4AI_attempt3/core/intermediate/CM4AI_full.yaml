prohibited_uses:
- prohibition_reason: >-
    These laboratory data are not to be used in clinical decision-making or in any context
    involving patient care without appropriate regulatory oversight and approval.
- prohibition_reason: >-
    Commercial use is not permitted under the CC BY-NC-SA 4.0 license without a separate
    license negotiation with the copyright holder.

known_limitations:
- limitation_type: scope_limitation
  limitation_description: >-
    This is an interim release and does not contain predicted cell maps, which will be
    added in future releases. The current release is most suitable for bioinformatics
    analysis of the individual datasets.
- limitation_type: coverage_limitation
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
    perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: methodological_limitation
  limitation_description: >-
    Meaningful analysis requires domain expertise.
- limitation_type: coverage_limitation
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo, so the release is not yet
    in completed final form. Perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 breast
    cancer cells are listed as embargoed in the external data links.

known_biases:
- bias_type: representation_bias
  bias_description: >-
    Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the
    population at large.

