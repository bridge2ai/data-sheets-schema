    FAIRSCAPE AI-readiness framework, described with a tutorial and installation
    instructions at https://fairscape.github.io, available under the MIT License.
- external_resources: >-
    Integrative Modeling Platform (IMP) open source package at
    http://integrativemodeling.org.
- external_resources: >-
    Network Data Exchange (NDEx) at https://ndexbio.org, used for sharing cell maps, which
    can be visualized in a web browser or accessed via Cytoscape, HiView, and the Python
    ndex2 library.

raw_data_sources:
- source_description: >-
    Immunofluorescence confocal microscopy images of MDA-MB-468 cells generated in the
    Lundberg Lab at Stanford University using immunofluorescence-based staining (ICC-IF),
    following automated fixation and permeabilization protocols established for a pipetting
    robot, and using the Human Protein Atlas resource of antibodies.
  source_type: laboratory imaging
- source_description: >-
    Size exclusion chromatography coupled to mass spectrometry (SEC-MS) data for
    proteome-wide complex and interaction mapping, generated in the Nevan Krogan laboratory
    at the University of California San Francisco.
  source_type: mass spectrometry
- source_description: >-
    Affinity purification mass spectrometry (AP-MS) data on endogenously tagged cell lines,
    generated in the Nevan Krogan laboratory at the University of California San Francisco.
  source_type: mass spectrometry
- source_description: >-
    Single-cell CRISPR (CRISPRi) perturbation screens using a CRISPR lentiviral library
    targeting chromatin factors with 6 guide RNAs per gene, in MDA-MB-468 and KOLF2 CRISPR
    lines expressing inducible dCas9, performed using the 10x Genomics 3'HT kit.
  source_type: single-cell sequencing

acquisition_methods:
- acquisition_details: >-
    Protein-protein interactions were mapped using affinity purification mass spectrometry
    (AP-MS) on endogenously tagged cell lines and size-exclusion chromatography coupled to
    mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping, as two
    orthogonal mass spectrometry-based approaches.
  was_directly_observed: true
  was_reported_by_subjects: false
- acquisition_details: >-
    Spatial subcellular organization was mapped using immunofluorescence subcellular
    microscopy (ICC-IF) with confocal imaging, using the Human Protein Atlas resource of
    antibodies. Each image contains four color channels: protein of interest (green),
    nucleus (DAPI, blue), endoplasmic reticulum (calreticulin antibody, yellow), and
    microtubules (tubulin antibody, red).
  was_directly_observed: true
  was_reported_by_subjects: false
- acquisition_details: >-
    Genetic perturbation data were acquired via single-cell CRISPR screens perturbing
    chromatin regulators under multiple treatment conditions, using the 10x Genomics 3'HT
    kit.
  was_directly_observed: true
  was_reported_by_subjects: false

collection_mechanisms:
- mechanism_details: >-
    Confocal microscopy with automated fixation and permeabilization protocols implemented
    on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines; antibody quality scored
    according to standard Human Protein Atlas procedures.
- mechanism_details: >-
    CRISPR lentiviral library targeting chromatin factors with 6 guide RNAs per gene,
    delivered to MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9; single-cell
    readout using the 10x Genomics 3'HT kit.
- mechanism_details: >-
    Size-exclusion chromatography followed by tandem mass spectrometry, and affinity
    purification of endogenously tagged bait proteins followed by tandem mass spectrometry.

data_collectors:
- collector_details: >-
    The Lundberg Lab at Stanford University generated the immunofluorescence subcellular
    imaging (spatial proteomics) data.
  role: academic_institution
- collector_details: >-
    The Nevan Krogan laboratory at the University of California San Francisco generated the
    AP-MS and SEC-MS protein-protein interaction data.
  role: academic_institution
- collector_details: >-
    The University of California San Diego generated genetic perturbation (single-cell
    CRISPR / perturb-seq) data and led data integration and cell map production.
  role: academic_institution
- collector_details: >-
    The University of Virginia performed AI-readiness packaging of data, software, metadata,
    and provenance graphs using the FAIRSCAPE framework, and hosts the archival data
    repository.
  role: academic_institution

direct_collection:
- is_direct: false
  collection_details: >-
    Data were not collected from human subjects. All data were generated in vitro from
    commercially available, de-identified human cell lines: MDA-MB-468 (RRID:CVCL_0419),
    available from ATCC, and KOLF2.1J (RRID:CVCL_B5P3), available from the Human Induced
    Pluripotent Stem Cells Initiative (HipSci) resource.

sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  why_not_representative: >-
    Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the population
    at large.
  strategies: >-
    Cell lines were selected for disease relevance and ethical sourcing: the triple-negative
    breast cancer line MDA-MB-468 (with and without paclitaxel or vorinostat treatment) and
    the iPSC line KOLF2.1J (with and without neuronal and cardiomyocytic differentiation).
    Target proteins were selected as chromatin modifiers and metabolic enzymes involved in
    cancer, neuropsychiatric, and cardiac disorders.

preprocessing_strategies:
- preprocessing_details: >-
    Downloaded PPI networks are processed using the node2vec deep learning model to reduce
    dimensionality, producing a PPI embedding that contains information about the protein's
    interactions.
- preprocessing_details: >-
    IF images are processed using a Human Protein Atlas deep learning model to reduce
    dimensionality, producing an image embedding that contains information about protein
    localization.
- preprocessing_details: >-
    The PPI and image embeddings are integrated to obtain a co-embedding for each protein
    using contrastive deep learning. This integration model learns co-embeddings such that
    the original embeddings can be reconstructed with minimal information loss and proteins
    with similar PPI and image embeddings have similar co-embeddings.
- preprocessing_details: >-
    Community detection is performed based on the all-by-all similarities of pairs of
    proteins in the co-embedding space; the resulting hierarchy of protein communities is
    output as the final cell map.

labeling_strategies:
- labeling_details: >-
    Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to known
    protein function and pathway resources, including the Gene Ontology (GO) and Reactome,
    to determine protein assemblies in the cell map with high overlap with known cell
    biology. Second, assemblies in the cell maps are annotated using a large language model
    approach developed to name sets of proteins and assign a name confidence score.
  data_annotation_protocol: >-
    Alignment to GO and Reactome, followed by LLM-generated assembly names with confidence
    scores.

machine_annotation_tools:
- tools: >-
    Large language model naming pipeline for protein assemblies, which generates a
    descriptive name and a name confidence score for each set of proteins.
  tool_descriptions: >-
    Used in the hierarchy evaluation stage of the MuSIC pipeline to annotate assemblies in
    the cell maps.

data_governance:
  committee_name: Data Access Committee
  committee_contact:
    name: Jillian Parker
    email: jillianparker@health.ucsd.edu
  access_review_process: >-
    A Data Access Committee supervises ethical matters related to dataset distribution and
    potential dual licensing for commercial use. Commercial use requires a separate license
    negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending upon the
    specific data package in question).
  stewardship_roles:
  - >-
    Ethical review is provided by Vardit Ravitsky (ravitskyv@thehastingscenter.org) and
    Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca).
  notes: >-
    The Ethics module employs a methodology inspired by Value-Sensitive Design and is
    developing the CM4AI Life Cycle, a framework designed to elucidate governance milestones
    throughout the data generation and AI system development processes.

