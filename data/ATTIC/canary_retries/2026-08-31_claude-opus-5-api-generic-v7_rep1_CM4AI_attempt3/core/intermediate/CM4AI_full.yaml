regulatory_restrictions:
  regulatory_restrictions:
  - >-
    The release records that the dataset does not involve human subjects, that samples are
    de-identified, and that the data are not FDA regulated.
  other_compliance: >-
    Participants in the Bridge2AI Open House must attest and commit to a Code of Conduct
    prior to accessing Bridge2AI data, including CM4AI datasets.

human_subject_research:
  involves_human_subjects: false
  ethics_review_board: >-
    Ethical review for the project is provided by Vardit Ravitsky
    (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon
    (jean-christophe_belisle-pipon@sfu.ca).
  notes: >-
    CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue
    cultures) and are considered to be de-identified as they cannot be matched, with current
    knowledge, to a human subject. The KOLF2.1J iPSC line was derived from a healthy male
    Northern European donor and is available for access by not-for-profit organizations via
    a simple MTA. The MDA-MB-468 line was established from a metastatic site pleural effusion
    of a 51-year-old black female with a metastatic mammary adenocarcinoma.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The release records human subjects as "No" and de-identified samples as "Yes". CM4AI data
    are considered to be de-identified as they cannot be matched, with current knowledge, to
    a human subject.

sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: >-
    The dataset consists of laboratory measurements from commercially available de-identified
    human cell lines; the release records that no human subjects are involved and that samples
    are de-identified.

confidential_elements:
- confidential_elements_present: true
  confidentiality_details: >-
    Some datasets are under temporary pre-publication embargo. In the June 2026 release,
    perturb-seq data in KOLF2.1J iPSCs (undifferentiated) and perturb-seq data in MDA-MB-468
    breast cancer cells (with and without treatment) are listed as embargoed.

ethical_reviews:
- review_details: >-
    Ethical review for the CM4AI project is conducted by the Ethics module, which works with
    the Data Acquisition, Tools, and Standards modules to develop a plan for ethical
    preparation, licensing, dissemination, and Data Access supervision of CM4AI datasets.
    The plan balances openness of the data with protection of intellectual property, and
    supervision and monitoring of potential efforts at commercialization.
  contact_person:
    name: Vardit Ravitsky
    email: ravitskyv@thehastingscenter.org
- review_details: >-
    Ethical review contact for the data release.
  contact_person:
    name: Jean-Christophe Belisle-Pipon
    email: jean-christophe_belisle-pipon@sfu.ca
    affiliations:
    - name: Simon Fraser University

third_party_sharing:
- is_shared: true
  notes: >-
    Datasets are openly disseminated via the CM4AI web portal, archived in the University of
    Virginia's LibraData Dataverse (an NIH-approved generalist repository), and deposited to
