use_repository:
- repository_details: >-
    The CM4AI web portal publishes data releases, tools, product documentation, and
    publications, and reports aggregate data insights for the project: 1,374 protein
    interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739
    genes targeted, and 21.4 TB of data volume.
  repository_url: https://cm4ai.org/data-releases/

existing_uses:
- examples: >-
    The CM4AI initial datasets, tools, and standards were made available at a CodeFest in
    March 2024, accompanied by detailed tutorials explaining how the data were derived and
    integrated, and providing production-ready software for producing the datasets.
- examples: >-
    The genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs, mapping transcriptional
    and fitness phenotypes for 11,739 targeted genes, has been reported in a preprint
    (Nourreddine et al., bioRxiv 2024.11.03.621734), with findings validated via phenotypic,
    protein-interaction, and metabolic tracing assays.

other_tasks:
- task_details: >-
    Integrative structure modeling of MuSIC communities, using the Integrative Modeling
    Platform, to increase understanding of the communities and help with planning future
    experiments. Communities are annotated by available structural information from the
    Protein Data Bank, AlphaFold Protein Structure Database, crosslinking mass spectrometry,
    and prediction of disordered sequence segments, then ranked by amount of available
    structural information.

discouraged_uses:
- discouragement_details: >-
    The current release is most suitable for bioinformatics analysis of the individual
    datasets; it does not contain predicted cell maps, so uses that depend on the integrated
    cell maps should await future releases.

content_warnings:
- content_warnings_present: false

extension_mechanism:
  extension_details: >-
    The Cell Mapping Toolkit implements the end-to-end pipeline as a series of pip-installable
    Python packages with full user documentation, providing a flexible and generalizable
    framework for cell map construction that enables researchers to integrate and construct
    cell maps via multiple input modalities and to incorporate new datasets.
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline

source_caveats: >-
  The record describes the June 2026 Data Release (DOI 10.18130/V3/HIGT4C), the highest-ranked
  and most recent source in the declared bundle; the October 2025 release is explicitly marked
  superseded by it. Descriptive material about CM4AI methods, cell lines, module structure, and
  the AI-readiness framework is drawn from the CM4AI bioRxiv preprint (tier 3) where the release
  pages do not restate it. The declared bundle also contains a Nature paper (Schaffer et al.
  2025, "Multimodal cell maps as a foundation for structural and functional genomics") reporting
  a U2OS osteosarcoma cell map built from AP-MS and immunofluorescence data; that dataset is a
  separate resource from the CM4AI data releases described here, uses a different cell line and
  different repositories (NDEx, MassIVE MSV000097168, ProteomeXchange PXD052362, Human Protein
  Atlas v23), and its content has not been merged into this record. The Nature work is authored
  by overlapping CM4AI investigators and acknowledges Bridge2AI OT2 OD032742, and its methods
  are the closest published description of the MuSIC-style pipeline CM4AI applies. Two
  quantitative details conflict between sources at different ranks: the CM4AI portal (tier 2)
  reports 53,788 immunofluorescent images and 7,023 proteins investigated project-wide, whereas
  the March 2025 release (tier 5) reports 563 proteins imaged and the June 2025 and October 2025
  releases report 464; the portal figures are recorded as project-level aggregates in
  use_repository rather than as properties of this release, and the per-release protein counts
  are not asserted for June 2026, whose file descriptions the bundle does not restate. The
  June 2026 release page carries a description block dated 2025-06-30 while the release itself
  is dated 2026-06-17.

notes: >-
  CM4AI is organized into three pillars (Data, People, Ethics) and six modules: Data Acquisition,
  Tools, and Standards; Skills and Workforce Development, and Teaming; and Ethics. It is a
  collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser
  University, and the Hastings Center. The Dataverse collection carries the notice "This
  collection is under review for potential modification in compliance with Administration
  directives," and the CM4AI portal carries the same notice for its repository.