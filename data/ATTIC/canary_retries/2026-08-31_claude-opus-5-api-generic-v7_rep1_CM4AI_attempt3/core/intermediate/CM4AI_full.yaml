purposes:
- response: >-
    To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning, addressing the
    problem that machine learning models in genomics and precision medicine are often
    "black boxes" that predict phenotypes from genotypes without revealing the
    mechanisms by which such translation occurs.
- response: >-
    To deliver machine-readable hierarchical maps of cell architecture as AI-ready data
    produced from multimodal interrogation of chromatin modifiers and metabolic enzymes
    involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell
    lines under perturbed and unperturbed conditions.
- response: >-
    To broadly stimulate research and development in "visible" machine learning systems
    informed by multi-scale cell and tissue architecture, which are not black boxes but
    are built directly on knowledge maps of cell and tissue architecture.
- response: >-
    To ethically leverage state-of-the-art computational and experimental tools in
    biomedical science to enable a new generation of transformative artificial
    intelligence research to benefit humanity.

addressing_gaps:
- response: >-
    Machine learning models analyzing the human genome to make predictions are typically
    difficult-to-interpret "black boxes"; this project generates a resource of matched
    data and tools to enable the creation of "visible" ML systems built directly on
    knowledge maps of cell and tissue architecture.
- response: >-
    Much of cell structure still remains uncharted. Although cell mapping technologies
    have typically been applied separately, integration of multiple complementary data
    modalities provides the opportunity to incorporate biological structure robustly
    across physical scales.

tasks:
- response: >-
    Construction of hierarchical cell maps: directed acyclic graphs where each node
    represents an assembly of proteins in proximity at a given scale, spanning from large
    assemblies representing cell compartments (for example nucleus, mitochondria) to small
    assemblies of proteins in close proximity (for example protein complexes or subunits).
- response: >-
    Training and interrogation of visible machine learning models, also called visible
    neural networks (VNNs), to examine how protein assemblies in the cell affect cell-level
    phenotype predictions.
- response: >-
    Interpretation of genetic variants and mutations in human genomics using cell maps as
    a structural foundation.
- response: >-
    Self-supervised multimodal embedding and multi-resolution community detection to fuse
    protein localization and protein interaction data into a hierarchy of protein assemblies.

