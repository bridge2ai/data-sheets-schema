- id: c010
  status: extracted
  extracted:
  - slot: purposes[1].response
    snippet: "deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers\nand 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders"
  - slot: purposes[3].response
    snippet: "aims to ethically leverage\nthe most state-of-the art computational and experimental tools in biomedical science to\nenable a new generation of  transformative artificial intelligence research to benefit\nhumanity"
  - slot: tasks[0].response
    snippet: "Cell maps are hierarchical directed acyclic graphs (DAG), where each node represents\nan assembly of proteins in proximity at a given scale"
  - slot: tasks[1].response
    snippet: "they have been used in AI tools for \u201cvisible machine\nlearning\u201d or \u201cvisible neural networks\u201d (VNNs) to interrogate how protein assemblies in\nthe cell affect cell-level phenotype predictions"
  - slot: tasks[2].response
    snippet: "Cell maps provide a foundation for\ndownstream applications in human genomics, including interpretation of genetic variants\nand mutations"
  - slot: tasks[3].response
    snippet: "integrating these localization and interaction data using self-\nsupervised embedding approaches from deep learning, followed by algorithmic\ncommunity detection at multiple resolutions"
  - slot: human_subject_research.notes
    snippet: "CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue"
  - slot: external_resources[9].external_resources
    snippet: "Cell maps are shared via the Network Data Exchange (NDEx)"
  - slot: version_access.versions_available
    snippet: "can be visualized in a web browser or accessed via tools such as Cytoscape"
- id: c011
  status: extracted
  extracted:
  - slot: human_subject_research.notes
    snippet: "cultures) and are considered to be de-identified as they cannot be matched, with current\nknowledge, to a human subject"
  - slot: sampling_strategies[0].strategies
    snippet: "CM4AI has elected to use the cancer cell line MDA-MB-46828 (+/- treatment with\npaclitaxel and vorinostat) and the iPSC line KOLF2.1J29 (+/- neuronal and\ncardiomyocytic differentiation), both of which have been ethically sourced"
  - slot: direct_collection[0].collection_details
    snippet: "MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established\nfrom a metastatic site pleural effusion"
  - slot: human_subject_research.notes
    snippet: "The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male\nNorthern European donor"
  - slot: human_subject_research.notes
    snippet: "It is available for access by non-for-profit organizations via\na simple MTA"
  - slot: acquisition_methods[0].acquisition_details
    snippet: "we employed AP-MS on endogenously tagged cell lines\nand size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for\nproteome-wide complex/interaction mapping as two orthogonal mass spectrometry-\nbased approaches"
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "We established automated fixation and\npermeabilization protocols for the pipetting robot for MDA-MB-468 and KOLF2 cell lines"
  - slot: collection_mechanisms[1].mechanism_details
    snippet: "We have designed a CRISPR\nlentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene"
  - slot: collection_mechanisms[1].mechanism_details
    snippet: "in\nundifferentiated KOLF2.1J iPSCs were done using the 10x\nGenomics 3\u2019HT kit"
  - slot: raw_data_sources[0].source_description
    snippet: "map the spatial subcellular organization of key chromatin\nmodifiers, their interactors and key signaling molecules involved in cancer using the\nHuman Protein Atlas resource of antibodies"
- id: c012
  status: extracted
  extracted:
  - slot: preprocessing_strategies[0].preprocessing_details
    snippet: "Downloaded PPI networks are processed using the node2vec deep learning model31\nto reduce dimensionality, producing a PPI embedding that contains information about\nthe protein\u2019s interactions"
  - slot: preprocessing_strategies[1].preprocessing_details
    snippet: "IF images are processed using a Human Protein Atlas deep learning model32 to\nreduce dimensionality, producing an image embedding that contains information about\nprotein localization"
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "The PPI and image embeddings are integrated to obtain a co-embedding for each\nprotein using contrastive deep learning"
  - slot: preprocessing_strategies[3].preprocessing_details
    snippet: "Community detection is performed based on the all-by-all similarities of pairs of\nproteins in the co-embedding space"
  - slot: labeling_strategies[0].labeling_details
    snippet: "cell maps are aligned to\nknown protein function and pathway resources, including the Gene Ontology (GO)34 and\nReactome35"
  - slot: machine_annotation_tools[0].tools
    snippet: "annotated using a large\nlanguage model (LLM) approach that we developed to name sets of proteins and assign\na name confidence score"
  - slot: other_tasks[0].task_details
    snippet: "bioinformatics pipeline for annotating MuSIC communities by\nthe available structural information about the community members and their\ninteractions"
  - slot: other_tasks[0].task_details
    snippet: "We then ranked the\nMuSIC communities by the amount of available structural information, serving as a\nproxy for the feasibility of integrative structure modeling"
  - slot: distribution_formats[1].notes
    snippet: "The PID system currently in\nuse is the ARK scheme42"
  - slot: distribution_formats[1].notes
    snippet: "Alternate views serialized in\nJSON-LD and in RDF-XML are also provided on the landing page"
