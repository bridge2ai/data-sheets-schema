description: >-
  CM4AI is the Functional Genomics Data Generation Project of the NIH Common Fund
  Bridge to Artificial Intelligence (Bridge2AI) program. This record describes the
  CM4AI data resource as published in its current quarterly release, the June 2026
  Data Release (Beta), in the University of Virginia Dataverse. CM4AI generates
  multi-modal data - protein-protein interaction, spatial protein localization and
  genetic perturbation data - in MDA-MB-468 triple-negative breast cancer cells
  (untreated or treated with paclitaxel or vorinostat) and in KOLF2.1J induced
  pluripotent stem cells (undifferentiated or differentiated to neural progenitor
  cells, neurons and cardiomyocytes), toward machine-readable hierarchical maps of
  human cell architecture delivered as AI-ready data.


  The June 2026 release contains Perturb-seq data for MDA-MB-468 cells with and
  without treatment and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data
  for MDA-MB-468 cells with and without treatment, undifferentiated KOLF2.1J iPSCs
  and iPSC-derived neural progenitor cells, neurons and cardiomyocytes; AP-MS data
  for treated MDA-MB-468 cells; and immunofluorescence images of MDA-MB-468 cells
  with and without treatment. Ten ZIP archives are distributed, including a release
  metadata archive. CM4AI output data are packaged with provenance graphs and rich
  metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework,
  and raw mass spectrometry and sequencing data are deposited in external
  repositories (MassIVE, NCBI Sequence Read Archive, Figshare).


  Input data streams are generated by immunofluorescence subcellular confocal
  microscopy for spatial proteomics, by affinity purification mass spectrometry
  (AP-MS) and size exclusion mass spectrometry (SEC-MS) for protein-protein
  interactions, and by single-cell CRISPR-Cas perturbation screens. These streams
  are integrated by the multi-scale integrated cell (MuSIC) pipeline using deep
  learning embeddings and community detection to yield hierarchical cell maps:
  directed acyclic graphs whose nodes are assemblies of proteins in proximity at a
  given scale, spanning cell compartments down to small protein complexes.


  CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA
  Birmingham, Simon Fraser University and the Hastings Center. Across the project as
  a whole the CM4AI portal reports 1,374 protein interactions, 53,788
  immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted
  and 21.4 TB of data. The principal investigator is Trey Ideker, University of
  California San Diego.

notes: >-
  Both the University of Virginia Dataverse collection hosting this dataset and the
  CM4AI project website display the notice: "This repository is under review for
  potential modification in compliance with Administration directives."

source_caveats: >-
  Referent: this record describes the CM4AI data resource as embodied in its current
  Dataverse release, the June 2026 Data Release (Beta), doi 10.18130/V3/HIGT4C;
  earlier quarterly releases are recorded under related_datasets. Release-date
  conflict: the CM4AI portal (documentation) states the June 2026 release was
  "Released on: June 17, 2025", while the Dataverse record (higher-ranked data
  resource) gives Publication Date 2026-06-17; the Dataverse date is used. Protein
  count for the immunofluorescence archives conflicts across sources: 464 proteins
  (October 2025 Dataverse release, highest-ranked source stating a figure), 523
  proteins (CM4AI portal), 563 proteins (March 2025 Dataverse release); 464 is used.
  Project-period conflict: the NIH RePORTER record gives a project period of
  2022-09-01 to 2026-08-31, while the Dataverse maintenance plan states updates
  "through the end of the project in November 2026". Version labelling is
  inconsistent both within and across Dataverse pages: the June 2026 page header
  shows "Version 2.0" while the citation string on that same page shows "V2" - these
  are the same version rendered two ways, not two versions; the October 2025 page
  shows "Version 2.1" with citation "V2" and the March 2025 page "Version 1.4" with
  citation "V1". The October 2025 release is superseded by the June 2026 release
  under the declared source ranking. The June 2026 file entries carry no per-file
  descriptions; per-modality content statements are taken from the release-level
  description, supplemented where noted by the October 2025 descriptions of
  identically named archives, whose checksums and in several cases file sizes differ
  from those in this release. Project-level counts (1,374 protein interactions;
  53,788 immunofluorescent images; 7,023 proteins investigated; 11,739 genes
  targeted; 21.4 TB) are reported by the CM4AI portal for the project as a whole
  rather than for this single release, and are therefore stated in description
  rather than in the release-scoped count slots; total_size_bytes is omitted for the
  same reason, while per-collection totals are computed by summing the per-file
  sizes stated on the release page. Publisher is not asserted: the string
  https://ror.org/0153tk833 appears in the June 2026 record only as an author
  affiliation, never as a statement of the publishing organization, and the bundle
  names the University of Virginia Dataverse as the hosting repository without
  naming a publisher for the slot. Nine of the 47 listed release authors have no
  ORCID in the source; they are represented as creator entries carrying affiliation
  and a note rather than an identifier. Data-collection start and end dates are not
  stated in the bundle; the NIH RePORTER project period and the stated maintenance
  horizon are recorded as timeframe prose rather than as collection dates. The
  Nature 2025 publication in the bundle reports a U2OS osteosarcoma cell map built
  with the same cell-mapping methodology and acknowledges Bridge2AI support, but its
  data are not part of the CM4AI Dataverse releases; it is treated here as related
  methodological literature.

