purposes:
- response: >-
    To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data, produced from multimodal interrogation of chromatin modifiers, metabolic
    enzymes and other proteins involved in cancer, neuropsychiatric and cardiac
    disorders in disease-relevant cell lines under treated and untreated conditions.
- response: >-
    To produce ethical, AI-ready datasets of cell architecture, inferred from
    multimodal data collected for human cell lines, in order to enable transformative
    biomedical AI research.
- response: >-
    To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: >-
    To broadly stimulate research and development in "visible" machine learning
    systems informed by multi-scale cell and tissue architecture, and to implement a
    standards-based data management approach founded on FAIR access and software
    principles with deep provenance and replication packages.

addressing_gaps:
- response: >-
    In genomics and precision medicine, machine learning models are often "black
    boxes" that predict phenotypes from genotypes without exposing the mechanisms by
    which such translation occurs. This dataset supplies the maps of cell and tissue
    architecture on which visible, interpretable models can be built directly.
- response: >-
    Much of human subcellular architecture remains uncharted, and complementary cell
    mapping technologies have typically been applied separately; matched multimodal
    measurements over a common protein set in the same cellular context are needed to
    resolve subcellular components robustly across physical scales.

tasks:
- response: >-
    Interpretable genotype-phenotype learning: using maps of cell architecture so
    that predictions from genotype to phenotype can be traced to mechanism rather
    than produced by a black-box model.
- response: >-
    Construction of visible machine learning systems and visible neural networks
    (VNNs), in which cell maps are used to interrogate how protein assemblies in the
    cell affect cell-level phenotype predictions.
- response: >-
    Systematic mapping of protein assemblies and subcellular organization across cell
    types, drug treatment conditions and genetic perturbations.
- response: >-
    Downstream applications in human genomics, including interpretation of genetic
    variants and mutations at the level of protein assemblies.

intended_uses:
- use_category: Research in functional genomics
  usage_notes: The release is intended to provide AI-ready datasets that support
    research in functional genomics.
- use_category: AI model training
- use_category: Cellular process analysis
- use_category: Analysis of cell architectural changes and interactions
  usage_notes: >-
    Intended for study of cell architectural changes and interactions in the presence
    of specific disease processes, treatment conditions or genetic perturbations.

existing_uses:
- examples:
  - >-
    The expressed genome-scale CRISPRi Perturbation Cell Atlas released here
    underlies Nourreddine et al., "A Perturbation Cell Atlas of Human Induced
    Pluripotent Stem Cells", bioRxiv 2024.11.03.621734, cited as a related
    publication on the release record.
- examples:
  - >-
    CM4AI datasets, tools and standards were distributed to participants of the
    project CodeFest in March 2024, accompanied by detailed tutorials explaining how
    the data were derived and integrated and providing production-ready software for
    producing the datasets.

discouraged_uses:
- discouragement_details: >-
    Integrated cross-modality analyses that assume complete overlap between
    modalities are not advisable for this release: the SEC-MS protein-protein
    interaction, immunofluorescence protein localization and CRISPRi Perturb-seq data
    interrogate sets of proteins that only incompletely overlap, and the release is
    stated to be most suitable for bioinformatics analysis of the individual
    datasets.
- discouragement_details: >-
    Use without relevant domain expertise is discouraged; the release states that
    meaningful analysis of these data requires domain expertise.

prohibited_uses:
- prohibition_reason: >-
    These laboratory data are not to be used in clinical decision-making or in any
    context involving patient care without appropriate regulatory oversight and
    approval.
- prohibition_reason: >-
    Commercial use is not permitted under the Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International license under which the
    data are released; commercial use requires a separate license negotiation with
    the copyright holder (UCSD, Stanford and/or UCSF depending upon the specific data
    package in question).

future_use_impacts:
- impact_details: >-
    The project anticipates potential applications of the data and of derived AI/ML
    systems and integrates them into data governance frameworks in order to optimize
    benefits and mitigate potential risks, promoting their use for the collective
    good.
- impact_details: >-
    The stated intention is that CM4AI becomes a platform for ethical, explainable
    and interpretable biomedical AI, deepening understanding of processes of human
    disease and health, helping to train a new generation of researchers, enabling
    development of novel cures, and assisting researchers and clinicians in equitably
    improving human lives.

acquisition_methods:
- acquisition_details: >-
    Protein-protein interactions were measured directly by affinity purification mass
    spectrometry (AP-MS) on endogenously tagged cell lines.
  was_directly_observed: true
  was_inferred_derived: false
  was_reported_by_subjects: false
- acquisition_details: >-
    Proteome-wide complex and interaction profiles were measured directly by size
    exclusion chromatography coupled to mass spectrometry (SEC-MS), used as an
    orthogonal mass spectrometry based approach to AP-MS.
  was_directly_observed: true
  was_inferred_derived: false
  was_reported_by_subjects: false
- acquisition_details: >-
    Subcellular protein localization was observed directly by immunofluorescence
    staining and high-resolution confocal microscopy of fixed and permeabilized
    cells.
  was_directly_observed: true
  was_inferred_derived: false
  was_reported_by_subjects: false
- acquisition_details: >-
    Transcriptional and fitness phenotypes were measured directly by single-cell
    CRISPR-Cas perturbation screens in cell lines engineered to express inducible
    dCas9.
  was_directly_observed: true
  was_inferred_derived: false
  was_reported_by_subjects: false
- acquisition_details: >-
    Hierarchical cell maps are not observed but derived: localization and interaction
    data are integrated with self-supervised deep learning embeddings followed by
    community detection at multiple resolutions. Computed cell maps are not included
    in this release.
  was_directly_observed: false
  was_inferred_derived: true

collection_mechanisms:
- mechanism_details: >-
    Affinity purification mass spectrometry (AP-MS) on endogenously tagged MDA-MB-468
    cells. At the time of the project preprint 17 genes had been endogenously tagged
    in MDA-MB-468 and AP-MS data acquired under three conditions (untreated,
    paclitaxel treated and vorinostat treated), with 34 additional genes in the
    process of being tagged.
- mechanism_details: >-
    Size exclusion chromatography coupled to mass spectrometry (SEC-MS) for
    proteome-wide complex and interaction mapping, applied to MDA-MB-468 cells under
    three conditions and to KOLF2.1J iPSCs and their differentiated derivatives.
- mechanism_details: >-
    Immunofluorescence-based staining (ICC-IF) with Human Protein Atlas antibodies
    followed by confocal microscopy, using automated fixation and permeabilization
    protocols implemented on a pipetting robot for the MDA-MB-468 and KOLF2 cell
    lines. Nuclei are stained with DAPI (blue channel), endoplasmic reticulum with a
    calreticulin antibody (yellow channel), microtubules with a tubulin antibody (red
    channel) and the protein of interest with its specific antibody (green channel).
- mechanism_details: >-
    Single-cell CRISPRi screens using a lentiviral guide RNA library with 6 guide RNAs
    per targeted gene in MDA-MB-468 and KOLF2 lines engineered and characterized to
    express inducible dCas9, read out with the 10x Genomics 3'HT single-cell kit.

data_collectors:
- collector_details: >-
    Protein-protein interaction data (AP-MS and SEC-MS) were generated in the Nevan
    Krogan laboratory at the University of California San Francisco.
- collector_details: >-
    Spatial proteomics immunofluorescence imaging was generated in the Lundberg Lab at
    Stanford University, using Human Protein Atlas antibodies and protocols.
- collector_details: >-
    Single-cell CRISPRi genetic perturbation screens were generated at the University
    of California San Diego.
- collector_details: >-
    Data integration and cell map production (the MuSIC pipeline) were carried out at
    the University of California San Diego; AI-readiness packaging, metadata and
    provenance (the FAIRSCAPE framework) at the University of Virginia. The release
    record gives the production locations as University of California San Diego,
    University of California San Francisco, Stanford University and University of
    Virginia.

collection_timeframes:
- timeframe_details: >-
    The bundle does not state when data collection began or ended. The NIH RePORTER
    record gives a project period of 2022-09-01 to 2026-08-31, while the Dataverse
    release states that the dataset will be updated and augmented through the end of
    the project in November 2026. The project preprint reports first-year acquisition
    of AP-MS data for 17 endogenously tagged genes in MDA-MB-468 cells under three
    conditions, SEC-MS in MDA-MB-468 cells and in KOLF2 iPSCs and derivatives, spatial
    proteomics mapping of 100 chromatin regulators in MDA-MB-468 cells, and single-cell
    CRISPR screens in MDA-MB-468 cells and undifferentiated KOLF2.1J iPSCs. The
    Dataverse record gives a data creation date of 2025-02-27 and a deposit date of
    2025-02-27 for this release.
  source_caveats: >-
    start_date and end_date are omitted because the dates available in the bundle are
    funding-period and deposit boundaries rather than statements about the period over
    which data were collected.

direct_collection:
- is_direct: false
  collection_details: >-
    Data were generated in the laboratory from established human cell lines rather
    than collected directly from individuals: MDA-MB-468 (RRID:CVCL_0419), a triple
    negative breast cancer line established from a metastatic pleural effusion and
    available from ATCC, and KOLF2.1J (RRID:CVCL_B5P3), an iPSC line available from
    the Human Induced Pluripotent Stem Cells Initiative resource and accessible to
    not-for-profit organizations under a simple material transfer agreement.

sampling_strategies:
- is_sample: true
  is_random: false
  strategies: >-
    Targeted selection of the proteins and genes interrogated: approximately 100
    chromatin modifiers and 100 metabolic enzymes implicated in cancer,
    neuropsychiatric and cardiac disorders, together with their interactors and key
    signaling molecules; a CRISPR lentiviral library targeting 100 chromatin factors
    with 6 guide RNAs per gene; and, for the iPSC perturbation atlas, an expressed
    genome-scale CRISPRi library covering 11,739 targeted genes.
- is_sample: true
  is_representative: false
  strategies: >-
    Selection of the biological material: two established, commercially available and
    de-identified human cell lines, MDA-MB-468 for the cancer context and KOLF2.1J for
    the iPSC context, with treatment and differentiation conditions applied to each.
  why_not_representative: >-
    Data in this release were derived from commercially available de-identified human
    cell lines and do not represent all biological variants which may be seen in the
    population at large.

