    pleural effusion of a 51-year-old black female with a metastatic mammary
    adenocarcinoma, and KOLF2.1J, derived from a healthy male Northern European donor.

relationships:
- relationship_details: >-
    Protein-protein interaction records relate pairs of proteins by measured
    biophysical association (AP-MS) or by co-elution across size exclusion fractions
    (SEC-MS). In the derived cell maps, which are hierarchical directed acyclic
    graphs, each node is an assembly of proteins in proximity at a given scale and a
    directed edge indicates that one community contains another, spanning large
    assemblies representing cell compartments down to small protein complexes or
    subunits.

