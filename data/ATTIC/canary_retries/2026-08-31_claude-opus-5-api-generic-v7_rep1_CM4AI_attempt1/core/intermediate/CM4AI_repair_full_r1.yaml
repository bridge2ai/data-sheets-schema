preprocessing_strategies:
- preprocessing_details: >-
    Protein-protein interaction networks for the cell line and conditions are
    downloaded from the generating laboratory's deposition archive, and
    immunofluorescence images for the cell line and conditions are downloaded from the
    imaging laboratory's deposition archive, then made available for further
    processing.
- preprocessing_details: >-
    Downloaded protein-protein interaction networks are processed with the node2vec
    deep learning model to reduce dimensionality, producing a PPI embedding that
    encodes information about each protein's interactions; immunofluorescence images
    are processed with a Human Protein Atlas deep learning model to produce an image
    embedding that encodes protein localization.
- preprocessing_details: >-
    The PPI and image embeddings are integrated into a per-protein co-embedding using
    contrastive deep learning, so that the original embeddings can be reconstructed
    with minimal information loss and proteins with similar PPI and image embeddings
    receive similar co-embeddings.
- preprocessing_details: >-
    Community detection is performed on the all-by-all similarities of protein pairs
    in the co-embedding space, and the resulting hierarchy of protein communities is
    output as the final cell map.
- preprocessing_details: >-
    Each pipeline segment calls the FAIRSCAPE client to validate inputs and emit an
    RO-Crate package containing datasets, metadata and software or resolvable
    references to them; the FAIRSCAPE server registers each crate, assigns persistent,
    resolvable, globally unique identifiers in the ARK scheme, and computes end-to-end
    provenance entailments expressed in the EVI Evidence Graph Ontology, serialized as
    JSON-LD and RDF/XML on human- and machine-readable landing pages.

labeling_strategies:
- data_annotation_protocol: >-
    Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to
    known protein function and pathway resources, including the Gene Ontology and
    Reactome, to determine protein assemblies in the cell map with high overlap with
    known cell biology. Second, assemblies in the cell maps are annotated using a large
    language model approach developed by the project to name sets of proteins and
    assign a name confidence score.
  labeling_details: >-
    The large language model annotation step returns, for each assembly, a descriptive
    name together with a self-assessed name confidence score, allowing low-confidence
    names to be distinguished from high-confidence ones.

known_limitations:
- limitation_type: scope_limitation
  limitation_description: >-
    This is an interim Beta release; the data are stated not to be in completed final
    form.
  recommended_mitigation: Consult subsequent quarterly releases, which continue through
    the end of the project in November 2026.
- limitation_type: coverage_limitation
  limitation_description: >-
    Computed cell maps are not included in this release; predicted cell maps will be
    added in future releases.
  scope_impact: The release supports analysis of the individual input data streams
    rather than of the integrated hierarchical cell maps.
- limitation_type: integration_limitation
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi
    Perturb-seq data interrogate sets of proteins which incompletely overlap; the
    current release is most suitable for bioinformatics analysis of the individual
    datasets.
- limitation_type: coverage_limitation
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo; in the June 2026 release
    the external Perturb-seq data links for KOLF2.1J iPSCs and for MDA-MB-468 cells are
    listed as embargoed.
- limitation_type: methodological_limitation
  limitation_description: Meaningful analysis of the release requires domain expertise.

known_biases:
- bias_type: representation_bias
  bias_description: >-
    Data in this release were derived from commercially available de-identified human
    cell lines and do not represent all biological variants which may be seen in the
    population at large. The two lines used derive from single donors: MDA-MB-468 from
    a 51-year-old black female with metastatic mammary adenocarcinoma, and KOLF2.1J
    from a healthy male Northern European donor.
  mitigation_strategy: >-
    The release documents its cell-line provenance explicitly so that users can judge
    generalizability; findings should not be extrapolated to population-level
    biological variation.
- bias_type: selection_bias
  bias_description: >-
    The proteins and genes interrogated were not sampled at random from the proteome
    but selected as targets: approximately 100 chromatin modifiers and 100 metabolic
    enzymes implicated in cancer, neuropsychiatric and cardiac disorders, together with
    their interactors and key signaling molecules. Coverage is further uneven across
    modalities, since the SEC-MS, immunofluorescence and CRISPRi Perturb-seq data
    interrogate sets of proteins that only incompletely overlap.
  affected_subsets:
  - >-
    All three data modalities in the release, and any analysis comparing across them.
  mitigation_strategy: >-
    The target selection criteria and the incomplete overlap between modalities are
    documented in the release, and the release advises that it is most suitable for
    bioinformatics analysis of the individual datasets.

missing_data_documentation:
- missing_data_patterns: >-
    Coverage across modalities is incomplete: the SEC-MS protein-protein interaction,
    immunofluorescence protein localization and CRISPRi Perturb-seq data interrogate
    sets of proteins that only partially overlap. Computed cell maps are absent from
    the release.
  missing_data_causes: >-
    The release is an interim Beta; some component datasets remain under temporary
    pre-publication embargo and predicted cell maps have not yet been generated for
    inclusion.
  handling_strategy: >-
    Missing components are scheduled for addition in subsequent quarterly releases
    through the end of the project in November 2026.

