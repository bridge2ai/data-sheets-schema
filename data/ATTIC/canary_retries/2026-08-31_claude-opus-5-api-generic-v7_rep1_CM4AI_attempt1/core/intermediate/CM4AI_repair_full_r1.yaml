- reviewing_organization: CM4AI Ethics Module
  review_details: >-
    The CM4AI Ethics team worked with the Data Acquisition, Tools and Standards modules
    to develop a plan for ethical preparation, licensing, dissemination and Data Access
    supervision of CM4AI datasets, balancing openness of the data with protection of
    intellectual property and supervision of potential commercialization. The team uses
    a methodology inspired by Value-Sensitive Design to create normative standards and
    expectations, an axiological repository of values, and a CM4AI Life Cycle framework
    elucidating governance milestones throughout data generation and AI system
    development, supported by mixed qualitative and quantitative empirical research.

