  - slot: raw_data_sources[0].source_description
    snippet: "MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established\nfrom a metastatic site pleural effusion of a 51-year-old black female"
  - slot: raw_data_sources[1].source_description
    snippet: "The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male\nNorthern European donor"
  - slot: acquisition_methods[0].acquisition_details
    snippet: "we employed AP-MS on endogenously tagged cell lines"
  - slot: acquisition_methods[1].acquisition_details
    snippet: "size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for\nproteome-wide complex/interaction mapping as two orthogonal mass spectrometry-\nbased approaches"
  - slot: acquisition_methods[2].acquisition_details
    snippet: "We established automated fixation and\npermeabilization protocols for the pipetting robot"
  - slot: acquisition_methods[3].acquisition_details
    snippet: "We have designed a CRISPR\nlentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene"
  - slot: collection_mechanisms[2].mechanism_details
    snippet: "were done using the 10x\nGenomics 3'HT kit"
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "The PPI and image embeddings are integrated to obtain a co-embedding for each\nprotein using contrastive deep learning"
  - slot: preprocessing_strategies[3].preprocessing_details
    snippet: "Community detection is performed based on the all-by-all similarities of pairs of\nproteins in the co-embedding space"
  - slot: labeling_strategies[0].labeling_details
    snippet: "cell maps are aligned to\nknown protein function and pathway resources, including the Gene Ontology (GO)"
  - slot: labeling_strategies[1].labeling_details
    snippet: "annotated using a large\nlanguage model (LLM) approach that we developed to name sets of proteins and assign\na name confidence score"
