known_biases:
- bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines and does not represent all biological variants which may be seen in the
    population at large.
known_limitations:
- limitation_type: scope_limitation
  limitation_description: This is an interim release and does not contain predicted cell maps,
    which will be added in future releases. The current release is most suitable for bioinformatics
    analysis of the individual datasets.
- limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: integration_limitation
  limitation_description: These data are not yet in completed final form, and some datasets
    are under temporary pre-publication embargo.
- limitation_type: methodological_limitation
  limitation_description: Meaningful analysis requires domain expertise.
confidential_elements:
- confidential_elements_present: true
  confidentiality_details: Some datasets are under temporary pre-publication embargo. Perturb-seq
    data in KOLF2.1J iPSCs (undifferentiated) and perturb-seq data in MDA-MB-468 breast cancer
    cells (with and without treatment) are listed as embargoed in the external data links.
subpopulations:
- subpopulation_elements_present: true
  identification: 'Data are organized by cell line and treatment or differentiation condition:
    MDA-MB-468 breast cancer cells untreated, treated with paclitaxel, or treated with vorinostat;
    and KOLF2.1J induced pluripotent stem cells undifferentiated or differentiated into neural
    progenitor cells, neurons, or cardiomyocytes.'
  distribution: Immunofluorescence imaging in this release covers MDA-MB-468 under three conditions
    (untreated, paclitaxel, vorinostat). SEC-MS covers MDA-MB-468 with and without treatment
    plus undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons and cardiomyocytes.
    AP-MS covers MDA-MB-468 with treatment (paclitaxel and vorinostat). Perturb-seq covers
    MDA-MB-468 with and without treatment and undifferentiated KOLF2.1J iPSCs.
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: The data are non-clinical, derived from tissue cultures, and are considered
    to be de-identified as they cannot be matched, with current knowledge, to a human subject.
acquisition_methods:
- acquisition_details: Protein-protein interactions were mapped by affinity purification-mass
    spectrometry (AP-MS) on endogenously tagged cell lines.
  was_directly_observed: true
- acquisition_details: Proteome-wide complex and interaction mapping by size-exclusion chromatography
    coupled to mass spectrometry (SEC-MS), as an orthogonal mass spectrometry-based approach
    to AP-MS.
  was_directly_observed: true
- acquisition_details: Spatial subcellular organization mapped by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy using the Human Protein Atlas resource of antibodies,
    with automated fixation and permeabilization protocols on a pipetting robot.
  was_directly_observed: true
- acquisition_details: Single-cell CRISPR screens perturbing chromatin regulators, using a
    CRISPR lentiviral library with 6 guide RNAs per gene in cell lines expressing inducible
    dCas9, read out with the 10x Genomics 3'HT kit.
  was_directly_observed: true
collection_mechanisms:
- mechanism_details: Confocal microscopy for immunofluorescence imaging, performed in the
    Lundberg Lab at Stanford University.
- mechanism_details: Mass spectrometry for AP-MS and SEC-MS protein interaction profiling,
    performed in the Nevan Krogan laboratory at the University of California San Francisco.
- mechanism_details: 10x Genomics 3'HT kit for single-cell CRISPR perturbation sequencing.
- mechanism_details: CRISPR lentiviral library targeting chromatin factors with 6 guide RNAs
    per gene, delivered into cell lines expressing inducible dCas9.
