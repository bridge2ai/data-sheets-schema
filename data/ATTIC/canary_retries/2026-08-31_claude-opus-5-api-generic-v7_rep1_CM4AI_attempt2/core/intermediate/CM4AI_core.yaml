purposes:
- response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data, produced from multimodal interrogation of chromatin modifiers, metabolic enzymes,
    and other proteins involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
    cell lines under treated and untreated conditions.
- response: To broadly stimulate research and development in "visible" machine learning systems
    informed by multi-scale cell and tissue architecture, which are built directly on knowledge
    maps of cell and tissue architecture rather than being difficult-to-interpret black boxes.
- response: To ethically leverage state-of-the-art computational and experimental tools in
    biomedical science to enable a new generation of transformative artificial intelligence
    research to benefit humanity.
tasks:
- response: Construction of hierarchical maps of protein assemblies, represented as directed
    acyclic graphs in which each node is an assembly of proteins in proximity at a given scale,
    spanning from large assemblies representing cell compartments to small assemblies such
    as protein complexes or subunits.
- response: Self-supervised multimodal embedding and integration of protein-protein interaction
    and immunofluorescence image data into a joint low-dimensional representation.
- response: Multi-resolution community detection over protein-protein similarities to resolve
    a hierarchy of protein assemblies.
- response: Development of visible neural networks (VNNs) for interpretable genotype-phenotype
    learning, in which protein assemblies in the cell inform cell-level phenotype predictions.
addressing_gaps:
- response: In genomics and precision medicine, machine learning models are often "black boxes,"
    predicting phenotypes from genotypes without understanding the mechanisms by which such
    translation occurs. This project addresses that deficiency by producing cell maps that
    enable visible machine learning systems.
- response: Although the basic sequence of the human genome has been known for over two decades,
    knowledge of how its proteins are organized within cells is still very much evolving,
    and much of cell structure remains uncharted.
- response: Cell mapping technologies have typically been applied separately; integration
    of multiple complementary data modalities provides the opportunity to incorporate biological
    structure robustly across physical scales.
