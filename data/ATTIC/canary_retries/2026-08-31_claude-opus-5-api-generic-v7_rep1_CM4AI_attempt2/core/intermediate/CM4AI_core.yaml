raw_data_sources:
- source_description: MDA-MB-468 (RRID:CVCL_0419), a triple negative breast cancer cell line
    established from a metastatic site pleural effusion of a 51-year-old black female with
    a metastatic mammary adenocarcinoma, available from ATCC.
  source_type: cell line
- source_description: KOLF2.1J (RRID:CVCL_B5P3) induced pluripotent stem cell line, derived
    from a healthy male Northern European donor, available from the Human Induced Pluripotent
    Stem Cells Initiative (HipSci) resource, accessible to not-for-profit organizations via
    a simple material transfer agreement.
  source_type: cell line
preprocessing_strategies:
- preprocessing_details: Protein-protein interaction networks are processed with the node2vec
    deep learning model to reduce dimensionality, producing a PPI embedding that contains
    information about the protein's interactions.
- preprocessing_details: Immunofluorescence images are processed using a Human Protein Atlas
    deep learning model to reduce dimensionality, producing an image embedding that contains
    information about protein localization.
- preprocessing_details: PPI and image embeddings are integrated to obtain a co-embedding
    for each protein using contrastive deep learning, learning co-embeddings such that the
    original embeddings can be reconstructed with minimal information loss and proteins with
    similar PPI and image embeddings have similar co-embeddings.
- preprocessing_details: Community detection is performed based on the all-by-all similarities
    of pairs of proteins in the co-embedding space, with the resulting hierarchy of protein
    communities output as the final cell map.
labeling_strategies:
- labeling_details: Cell maps are aligned to known protein function and pathway resources,
    including the Gene Ontology (GO) and Reactome, to determine protein assemblies in the
    cell map with high overlap with known cell biology.
- labeling_details: Assemblies in the cell maps are annotated using a large language model
    approach developed to name sets of proteins and assign a name confidence score.
  data_annotation_platform: GPT-4
