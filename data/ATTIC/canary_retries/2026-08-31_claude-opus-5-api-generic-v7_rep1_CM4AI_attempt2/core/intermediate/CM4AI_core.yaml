name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: The June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI),
  the Functional Genomics Grand Challenge in the NIH Bridge2AI program. CM4AI generates multi-modal
  data including protein-protein interaction (PPI), spatial localization, and genetic perturbation
  data in MDA-MB-468 breast cancer cells (with and without paclitaxel or vorinostat treatment)
  and induced pluripotent stem cells (with and without differentiation). This Beta release
  includes Perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment
  and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer
  cells with and without treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron
  progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer
  cells with treatment; and immunofluorescence images in MDA-MB-468 breast cancer cells with
  and without treatment. Output data are packaged with provenance graphs and rich metadata
  as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework.
notes: 'Cell maps are hierarchical directed acyclic graphs in which each node represents an
  assembly of proteins in proximity at a given scale, spanning from large assemblies representing
  cell compartments such as the nucleus and mitochondria to small assemblies of proteins in
  close proximity such as protein complexes or subunits. CM4AI is organized into three pillars
  (Data, People, and Ethics) across six modules: Data Acquisition, Tools, and Standards; Skills
  and Workforce Development, and Teaming; and Ethics. CM4AI defines AI-Ready biomedical data
  as fully characterized FAIR data of known provenance which can be ethically and reliably
  processed by AI applications, whose models and software are available and well-described
  for validation and re-use, and whose predictions may be fully explained and interpreted
  to the user as needed; the project''s criteria are FAIR, Provenanced, Characterized, Explainable,
  and Ethical. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA
  Birmingham, Simon Fraser University, and the Hastings Center, as part of the NIH Bridge2AI
  program. The University of Virginia Dataverse collection carries the notice that it is under
  review for potential modification in compliance with Administration directives.'
source_caveats: The declared bundle describes both the CM4AI project as a whole and a series
  of quarterly data releases. This record takes as its referent the CM4AI data release published
  in the University of Virginia Dataverse, currently the June 2026 Data Release (Beta), which
  the highest-ranked source in the bundle describes; project-level material from the preprint,
  publication and project documentation is used to populate purposes, tasks, methods and governance
  for that release. Earlier releases are recorded under related_datasets rather than merged
  into the subject. The bundle also contains a Nature publication describing a U2OS osteosarcoma
  cell map produced by an overlapping team and funded in part by Bridge2AI; that dataset has
  its own separate identifiers and repositories and is not the subject of this record, so
  its U2OS-specific counts, cell line and deposits are not recorded here. Aggregate counts
  shown on the CM4AI project website (1,374 protein interactions, 53,788 immunofluorescent
  images, 7,023 total proteins investigated, 11,739 genes targeted, 21.4 TB data volume) describe
  the project's cumulative output rather than this release specifically, and are therefore
  not recorded as slot values for this dataset. The preprint reports counts of proteins imaged
  and genes tagged that differ from later release records, reflecting the project's state
  in 2024; the higher-ranked release records are preferred where they overlap.
