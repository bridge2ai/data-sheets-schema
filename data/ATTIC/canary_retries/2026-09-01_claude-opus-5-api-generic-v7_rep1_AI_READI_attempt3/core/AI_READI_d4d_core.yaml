purposes:
- response: To enable future generations of artificial intelligence/machine learning (AI/ML)
    research to provide critical insights into type 2 diabetes mellitus (T2DM), including
    salutogenic pathways to return to health.
- response: To collect and publicly share a multimodal, AI-ready dataset uniformly balanced
    for T2DM severity from a diverse group of participants, so that a complex multifactorial
    disease can be better understood using AI.
- response: To create a model and blueprint for developing large scalable, ethically sourced
    datasets, and to establish standards, best practices and guidelines for the collection,
    preparation and sharing of data for AI/ML that future data generation projects can follow.
- response: To increase access to and the quality of AI/ML research by recruiting and training
    personnel at the intersection of biomedicine and artificial intelligence.
tasks:
- response: 'Downstream pseudotime manifold analysis: an approach used to predict disease
    trajectories by collecting and learning from complex, multimodal data from participants
    with differing disease severity, ranging from normal to insulin-dependent T2DM.'
- response: Reconstruction of a temporal atlas of T2DM development and reversal towards health
    (salutogenesis), from a foundational dataset that is agnostic to existing classification
    criteria or biases.
- response: Multimodal AI model development across survey, clinical, imaging, waveform, wearable
    and environmental modalities collected on the same participants.
addressing_gaps:
- response: T2DM is a growing public health threat, yet the current understanding of T2DM,
    especially in the context of salutogenesis, is limited. Given the complexity of T2DM,
    AI-based approaches may help improve understanding, but a key issue is the lack of data
    ready for training AI models. The AI-READI dataset is intended to fill this gap.
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large, and inclusive
    multimodal datasets.
- response: Past research studies under-represented groups that bear a higher burden of the
    disease. A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated
    that samples lacked racial and ethnic diversity, so the cohort is designed to be balanced
    by self-reported race/ethnicity rather than to mirror the demographic distribution of
    the US population.
- response: The multi-domain acquisition protocol enables downstream AI/ML analyses that may
    not be feasible with existing data sources such as claims or electronic health records
    data.
