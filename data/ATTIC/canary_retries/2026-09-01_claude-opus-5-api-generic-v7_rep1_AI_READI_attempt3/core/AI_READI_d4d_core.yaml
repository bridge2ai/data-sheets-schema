conforms_to: 'The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1:
  data are organized at the root level into one directory per datatype, then one directory
  per modality, then one per device, then one per participant. Within each datatype directory
  the data files follow a specific file format standard: WaveForm DataBase (WFDB) for cardiac_ecg;
  the Observational Medical Outcomes Partnership (OMOP) Common Data Model for clinical_data,
  where each CSV file is a one-to-one mapping to an OMOP CDM table; the NASA ASCII File Format
  Guidelines for Earth Science Data (ESDS) for environment; Digital Imaging and Communications
  in Medicine (DICOM) for retinal_flio, retinal_oct, retinal_octa and retinal_photography;
  and Open mHealth for wearable_activity_monitor and wearable_blood_glucose. An RO-Crate metadata
  description of the release conforms to RO-Crate 1.2-DRAFT and the FAIRscape profile 0.1.'
