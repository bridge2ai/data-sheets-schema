instances:
- instance_type: Individual participant (patient) enrolled in the AI-READI study
  counts: 2280
  data_topic: B2AI_TOPIC:43
  data_substrate: B2AI_SUBSTRATE:11
  label: false
  label_description: No labels are provided. No specific labeling was performed in the dataset,
    as it is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream
    AI/ML applications. No formal guidelines are in place for future researchers creating
    new labels or defining new tasks.
  missing_information:
  - description: Not all modalities are available for all participants. Some participants
      elected not to participate in some study elements. In a few cases the data collection
      device did not have any stored results or was returned too late to retrieve the results
      (for example the battery died or data were lost). In a few cases there may have been
      a data collision at some point in the process and data have been lost. In survey data,
      skipped questions or incomplete responses are expected.
  notes: Each instance consists of all of the data available for an individual participating
    in the study, spanning survey data, clinical data, retinal imaging data, environmental
    sensor data, continuous glucose monitor data and wearable activity monitor data.
  source_caveats: Several B2AI_SUBSTRATE and B2AI_TOPIC terms are equally attested for these
    instances and the slots are single-valued, so one term had to be chosen for each. DICOM
    (B2AI_SUBSTRATE:11) is named because it is the substrate of the four retinal imaging datatypes,
    which together account for the great majority of files and bytes in the release; the bundle
    equally attests comma-separated values, JSON, tab-separated values, waveform data and
    time-series data. Diabetes (B2AI_TOPIC:43) is named as the subject of the study; the bundle
    equally attests ophthalmic imaging, waveform, mHealth, glucose monitoring, activity monitoring,
    clinical observations and survey.
anomalies:
- anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: In wearable data, improper use and technical failures such as battery failure
    or system malfunction are expected. The Garmin Vivosmart 5 had to be charged every 2-3
    days, which produces gaps in data collection.
- anomaly_details: In imaging data, patient uncooperation, noise that may obscure the images,
    technical failures such as system malfunction, and data transfer failures are expected.
    Optomed Aurora images are taken undilated and handheld, so image quality varies from patient
    to patient and within the same patient. FLIO is performed last in the visit and exposes
    patients to uncomfortable levels of light, so patient compliance may be lower for that
    modality.
- anomaly_details: In a few cases there may have been a data collision at some point in the
    process and data has been lost; in a few cases the data collection device did not have
    any stored results or was returned too late to retrieve the results.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias, which may limit the generalizability of results among those who are not represented
    in the study population. Recruitment through health system electronic health records also
    means the study base is limited to patients who had a medical encounter at one of the
    three sites.
  mitigation_strategy: Participants are recruited in waves whose composition is monitored
    and adjusted by under- and oversampling groups as needed; where sample balancing on race/ethnicity
    emerges as a challenge, new recruitment strategies are to be implemented.
- bias_type: representation_bias
  bias_description: Recruitment is predominantly urban and hospital-based and may not fully
    capture all possible cultural and socioeconomic backgrounds. The cohort does not include
    other races/ethnicities such as Pacific Islanders and Native Americans. Requiring that
    eligible participants speak, read and understand English may have created challenges in
    recruiting Hispanic and/or Asian persons. Recruiting Black men into health research is
    more difficult than recruiting other populations, yet this population represents a disproportionate
    percentage of the T2DM burden; similar trends for under-recruitment have been reported
    for Hispanic and Asian persons.
  affected_subsets:
  - Race/ethnicity subpopulations; non-English speakers.
  mitigation_strategy: Three recording sites were strategically selected for geographic variability
    across the United States and to ensure representation across various racial and ethnic
    groups, and individuals from all demographic backgrounds were recruited at all three sites;
    the cohort is designed to be balanced across four race/ethnic groups.
- bias_type: measurement_bias
  bias_description: 'Multiple imaging devices and modalities are used for overlapping measures,
    and image quality varies with operator involvement and patient cooperation: Optomed Aurora
    images are undilated and handheld so quality varies from patient to patient; Heidelberg
    Spectralis imaging is not fully automated so quality issues may lead to skipping the modality
    and missing data; FLIO is performed last and exposes patients to uncomfortable levels
    of light so compliance may be lower.'
  mitigation_strategy: Information on device make and model, including specific modalities
    such as macula scans or wide scans during OCT, was documented to ensure repeatability,
    and multiple devices were included for one measure to enhance generalizability and represent
    the broad range of equipment used in clinical settings.
- bias_type: sampling_bias
  bias_description: Potential for confounding between recruitment site and participant characteristics,
    since the proportion of each demographic group recruited varies with the demographic prevalence
    of that group in each site's geographical area.
  mitigation_strategy: Uniform data collection protocols were implemented for all subjects,
    irrespective of their race/ethnicity, biological sex, or diabetes severity, across all
    study sites. The selection of study sites was intended to ensure varied representation
    and minimize the potential for sampling bias, and individuals from all demographic backgrounds
    were recruited at all three sites.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: While the AI-READI cross-sectional database ultimately aims to achieve
    balance across race/ethnicity, biological sex, and diabetes presence and severity, interim
    releases including the pilot phase are not balanced across these parameters, because enrollment
    is ongoing.
  scope_impact: Models trained on this release may inherit imbalance across demographic and
    severity strata.
  recommended_mitigation: Use the recommended training/validation/testing split provided in
    participants.tsv, whose validation and test sets are balanced as well as possible for
    sex, race/ethnicity and diabetes status.
- limitation_type: coverage_limitation
  limitation_description: The cohort does not include races/ethnicities such as Pacific Islanders
    and Native Americans, and participation required the ability to speak and read English.
    Participants must be 40 years or older, so the dataset says nothing about younger onset
    T2DM.
- limitation_type: scope_limitation
  limitation_description: The study is cross-sectional with currently only one visit per participant,
    so within-person change over time cannot be observed in this release; longitudinal data
    are planned from approximately 10% of the study cohort in year 4 of the project.
- limitation_type: temporal_limitation
  limitation_description: The release covers data collected between July 19, 2023 and May
    1, 2025 only. Enrollment is ongoing and future versions will include larger numbers of
    participants, so distributions may shift between versions.
- limitation_type: methodological_limitation
  limitation_description: A limitation of the associated biorepository is that there are a
    finite number of samples to share with scientists interested in using them in research;
    procedures for reviewing and prioritizing written requests were still to be developed
    at the time of the protocol publication. Biospecimens are not part of the released digital
    dataset.
