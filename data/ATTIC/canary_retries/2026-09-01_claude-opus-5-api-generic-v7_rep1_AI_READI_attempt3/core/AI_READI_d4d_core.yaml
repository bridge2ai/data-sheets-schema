title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: AI-READI dataset
description: 'The AI-READI project seeks to create and share a flagship ethically-sourced
  dataset of type 2 diabetes. Version 3.0.0 contains data from 2280 participants collected
  between July 19, 2023 and May 01, 2025 from individuals with and without type 2 diabetes
  mellitus (T2DM) and harmonized across three data collection sites. Data from multiple modalities
  are included: survey data, clinical data (blood and urine lab results, cognitive and monofilament
  testing, physical and vision assessments), retinal imaging (color fundus photography, fundus
  autofluorescence, near-infrared reflectance, optical coherence tomography, optical coherence
  tomography angiography and fluorescence lifetime imaging ophthalmoscopy), 12-lead electrocardiography,
  continuous glucose monitoring, wearable activity monitoring and home environmental sensor
  data. These encompass tabular data, imaging data, and physiological signal/waveform data;
  there is no unstructured text data in this dataset. The data contain no protected health
  information (PHI); information related to the sex and race/ethnicity of the participants
  as well as medication used has also been removed and is held under controlled access. The
  composition of the dataset was designed with future studies using AI/machine learning in
  mind, including recruitment sampling procedures aimed at achieving approximately equal distribution
  of participants across diabetes severity, and a data acquisition protocol across multiple
  domains intended to enable downstream AI/ML analyses that may not be feasible with existing
  data sources such as claims or electronic health records data. The goal is to better understand
  salutogenesis (the pathway from disease to health) in T2DM. A smaller mini-subset version
  of the dataset is available for pipeline development.'
notes: 'Device manufacturers provided in-kind support to the study: Topcon Corporation (Tokyo,
  Japan), Optomed (Oulu, Finland), iCare World (Raleigh, North Carolina) and Carl Zeiss (Oberkochen,
  Germany) loaned their devices for research purposes at no cost, and Heidelberg Engineering
  (Heidelberg, Germany), Dexcom (San Diego, California) and Garmin (Olathe, Kansas) provided
  research discounts on study devices; several investigators declare consulting, equity or
  equipment relationships with device manufacturers in the associated publications, which
  list those relationships individually. The Microsoft AI for Good Lab is acknowledged in
  the Nature Metabolism comment for supporting the cloud services needed for the project,
  and the dataset is hosted on FAIRhub through Microsoft Azure; this is in-kind infrastructure
  support rather than a funding award. The FAIRhub dataset pages and the AI-READI documentation
  site carry the notice "This repository is under review for potential modification in compliance
  with Administration directives."'
source_caveats: 'The AI-READI acronym is expanded as "Artificial Intelligence Ready and Equitable
  Atlas for Diabetes Insights" in the BMJ Open protocol publication (tier 3) and as "Artificial
  Intelligence Ready and Exploratory Atlas for Diabetes Insights" in the FAIRhub healthsheet
  and README (tier 1) and on the NIH RePORTER project page (tier 4); the tier-1 expansion
  is used in this record. The FAIRhub study metadata records Washington University in St.
  Louis as lead sponsor, managing organization and the affiliation of the principal investigator,
  while the NIH RePORTER project page lists the University of Washington as the awardee organization
  and the RO-Crate names the principal investigator as being in the Department of Ophthalmology,
  University of Washington; the tier-1 FAIRhub value is used where an organization had to
  be named. The anticipated study enrollment is 4000 participants in the tier-1 FAIRhub study
  metadata and in both publications, but the tier-2 IRB protocol form describes a cross-sectional
  dataset of 4600 people; the tier-1 figure is used. The healthsheet answer describing this
  release states that it "consists of data collected up through the end of the second year
  of the study", while the same answer and the README give the collection window as July 19,
  2023 to May 1, 2025 and the version-history table labels the release "v3.0.0 main study"
  incorporating year 2 and year 3 data. The is_tabular slot is omitted: the bundle states
  that the release encompasses tabular data, imaging data and physiological signal/waveform
  data together, which a single boolean cannot represent. The nine file_collections covering
  the datatype directories carry minted fragment identifiers on the dataset DOI because FileCollection.id
  is required by the schema, although no other value in this record points at them. The sum
  of the nine datatype directory file counts is 356,334 against a declared total_file_count
  of 356,343, and the sum of their sizes is 3,815,969,359,064 bytes against a declared total_size_bytes
  of 3,815,969,779,678; both shortfalls are present in the tier-1 source itself and are accounted
  for by the nine root-level metadata files, recorded here as a tenth file collection.'
