    in the dataset README.
  distribution: 'Across the 2280 participants: Hispanic 380, Asian 545, Black 519, White 836.
    In the training set the counts are Hispanic 204, Asian 369, Black 343, White 660; the
    validation and test sets each contain 88 participants in each of the four groups.'
  subpopulation_elements_present: false
  source_caveats: The healthsheet answers "Does the dataset identify any demographic sub-populations
    (e.g., by age, gender, sex, ethnicity)?" with "No". That answer concerns the released
    public dataset, in which race/ethnicity is withheld; the aggregate counts recorded here
    are published in the dataset README and describe the cohort rather than a released variable,
    which is why subpopulation_elements_present is false.
- identification: Biological sex, collected in the screening questionnaire. Sex is held under
    controlled access and removed from the public version of the dataset; only aggregate counts
    are published in the dataset README.
  distribution: 'Across the 2280 participants: 951 male and 1329 female. Training set 599
    male / 977 female; validation and test sets 176 male / 176 female each.'
  subpopulation_elements_present: false
  source_caveats: As for race/ethnicity, the healthsheet's blanket "No" to the demographic
    subpopulation question reflects the withholding of sex from the public dataset; the counts
    recorded here come from the README summary table.
- identification: 'Diabetes status group, one of four study arms: no diabetes; pre-diabetes/lifestyle
    controlled; controlled by oral or non-insulin injectable medications; insulin controlled.'
  distribution: 'Across the 2280 participants: no diabetes 776, lifestyle 560, oral 686, insulin
    258. Training set 600/384/487/105; validation set 88/88/109/67; test set 88/88/90/86.'
  subpopulation_elements_present: true
