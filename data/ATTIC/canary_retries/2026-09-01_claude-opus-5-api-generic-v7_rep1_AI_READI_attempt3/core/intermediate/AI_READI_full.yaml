variables:
- variable_name: continuous_glucose_monitoring
  data_type: float
  unit: mg/dL
  measurement_technique: >-
    Dexcom G6 real-time integrated continuous glucose monitoring system; blood glucose measurement
    every 5 minutes over a 10-day continuous wear period. Participants were masked to the results
    during the monitoring period.
- variable_name: heart_rate
  data_type: float
  measurement_technique: >-
    Garmin Vivosmart 5 physical activity monitor worn continuously for 10 days at a sampling
    frequency of 5 seconds; heart rate is also measured twice at the study visit with an automatic
    oscillometric medically approved device.
- variable_name: oxygen_saturation
  data_type: float
  measurement_technique: Garmin Vivosmart 5 physical activity monitor.
- variable_name: respiratory_rate
  data_type: float
  measurement_technique: Garmin Vivosmart 5 physical activity monitor.
- variable_name: physical_activity
