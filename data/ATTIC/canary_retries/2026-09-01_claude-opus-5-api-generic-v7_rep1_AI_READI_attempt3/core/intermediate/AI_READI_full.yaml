purposes:
- response: >-
    To enable future generations of artificial intelligence/machine learning (AI/ML) research to
    provide critical insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways
    to return to health.
- response: >-
    To collect and publicly share a multimodal, AI-ready dataset uniformly balanced for T2DM
    severity from a diverse group of participants, so that a complex multifactorial disease can be
    better understood using AI.
- response: >-
    To create a model and blueprint for developing large scalable, ethically sourced datasets, and
    to establish standards, best practices and guidelines for the collection, preparation and
    sharing of data for AI/ML that future data generation projects can follow.
- response: >-
    To increase access to and the quality of AI/ML research by recruiting and training personnel at
    the intersection of biomedicine and artificial intelligence.

addressing_gaps:
- response: >-
    T2DM is a growing public health threat, yet the current understanding of T2DM, especially in the
    context of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may help
    improve understanding, but a key issue is the lack of data ready for training AI models. The
    AI-READI dataset is intended to fill this gap.
- response: >-
    The ability to understand and affect the course of complex, multi-organ diseases such as T2DM
    has been limited by a lack of well-designed, high quality, large, and inclusive multimodal
    datasets.
- response: >-
    Past research studies under-represented groups that bear a higher burden of the disease. A
    meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that samples
    lacked racial and ethnic diversity, so the cohort is designed to be balanced by self-reported
    race/ethnicity rather than to mirror the demographic distribution of the US population.
- response: >-
    The multi-domain acquisition protocol enables downstream AI/ML analyses that may not be feasible
    with existing data sources such as claims or electronic health records data.

tasks:
- response: >-
    Downstream pseudotime manifold analysis: an approach used to predict disease trajectories by
    collecting and learning from complex, multimodal data from participants with differing disease
    severity, ranging from normal to insulin-dependent T2DM.
- response: >-
    Reconstruction of a temporal atlas of T2DM development and reversal towards health
    (salutogenesis), from a foundational dataset that is agnostic to existing classification
    criteria or biases.
- response: >-
    Multimodal AI model development across survey, clinical, imaging, waveform, wearable and
    environmental modalities collected on the same participants.

instances:
- instance_type: Individual participant (patient) enrolled in the AI-READI study
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: >-
    No labels are provided. No specific labeling was performed in the dataset, as it is a
    hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
    applications. No formal guidelines are in place for future researchers creating new labels or
    defining new tasks.
  notes: >-
    Each instance consists of all of the data available for an individual participating in the
    study, spanning survey data, clinical data, retinal imaging data, environmental sensor data,
    continuous glucose monitor data and wearable activity monitor data.

relationships:
- relationship_details: >-
    All instances are part of the same prospective data generation project (AI-READI). There is
    currently only one visit per participant; approximately 10% of the study cohort is planned to be
    invited for a follow-up examination in year 4 of the project.

anomalies:
- anomaly_details: >-
    In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: >-
    In wearable data, improper use and technical failures such as battery failure or system
    malfunction are expected. The Garmin Vivosmart 5 had to be charged every 2-3 days, which
    produces gaps in data collection.
- anomaly_details: >-
    In imaging data, patient uncooperation, noise that may obscure the images, technical failures
    such as system malfunction, and data transfer failures are expected. Optomed Aurora images are
    taken undilated and handheld, so image quality varies from patient to patient and within the
    same patient. FLIO is performed last in the visit and exposes patients to uncomfortable levels
    of light, so patient compliance may be lower for that modality.
- anomaly_details: >-
    In a few cases there may have been a data collision at some point in the process and data has
    been lost; in a few cases the data collection device did not have any stored results or was
    returned too late to retrieve the results.

splits:
- split_details: >-
    The dataset comes with a recommended split into training, validation and testing sets in
    70%/15%/15% proportions, provided in the participants.tsv file: 1576 participants in the
    training set, 352 in the validation set and 352 in the test set. Because sex, race and ethnicity
    are not released with the public version of the dataset, the project team balanced the
    validation and test sets as well as possible for sex, race/ethnicity and diabetes status (no
    diabetes; pre-diabetes/lifestyle controlled; oral or non-insulin injectable medication
    controlled; insulin controlled). Mean age is 61.1 +/- 11.3 years in the training set, 60.3 +/-
    10.8 in the validation set, 60.5 +/- 11.4 in the test set and 60.8 +/- 11.3 overall. The
    recommended split is new in version 3.0.0 and is aimed at reducing disparities in models
    developed using this dataset.

