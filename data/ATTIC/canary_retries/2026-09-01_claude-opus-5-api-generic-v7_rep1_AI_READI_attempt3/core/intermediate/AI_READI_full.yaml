  distribution: >-
    Across the 2280 participants: Hispanic 380, Asian 545, Black 519, White 836. In the training set
    the counts are Hispanic 204, Asian 369, Black 343, White 660; the validation and test sets each
    contain 88 participants in each of the four groups.
