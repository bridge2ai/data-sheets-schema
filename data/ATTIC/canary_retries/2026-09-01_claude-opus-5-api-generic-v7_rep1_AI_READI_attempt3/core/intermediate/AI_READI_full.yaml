distribution_dates:
- release_dates: >-
    Version 1.0.0 was distributed on May 3, 2024; version 2.0.0 on November 8, 2024; and version
    3.0.0 on November 17, 2025, the date recorded in the dataset metadata as the date the dataset
    was made available on FAIRhub.

third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed and available for public use through the FAIRhub platform at
    https://fairhub.io/, outside the entity on whose behalf it was created. Distribution is
    conditional on logging in through a verified ID system, agreeing to use the data only for type 2
    diabetes related research, and agreeing to the license terms. Licensees may in turn give access
    to the Data only to another licensee bound by an identical agreement with the Licensor, for the
    purpose of collaborating on one or more projects involving the Data.

maintainers:
- role: researcher
  maintainer_details: >-
    The AI-READI team (AI-READI Consortium) supports and maintains the dataset; it is hosted on
    FAIRhub through Microsoft Azure. Contact information for the owner, curator and manager is
    provided in the README file included with the dataset, at https://aireadi.org/contact and at
    https://docs.aireadi.org/docs/3/contact, and in the study_description.json and
    dataset_description.json metadata files included with the dataset.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place; rather, new versions are
    released with additional instances as more study participants complete the study visit. There
    are plans to release new versions approximately once a year with additional data from
    participants enrolled since the previous release. Enrollment is ongoing and future versions are
    expected to include larger numbers of participants. Changes between versions are documented in
    the CHANGELOG file included with the dataset and visible at docs.aireadi.org.

version_access:
  versions_available:
  - >-
    Version 1.0.0 (DOI 10.60775/fairhub.1, released May 3, 2024, 204 participants from the pilot
    data collection phase, 15+ data types, custom/ad hoc processing); version 2.0.0 (DOI
    10.60775/fairhub.2, released November 8, 2024, 1067 participants, one additional imaging device,
    automated plus custom processing); version 3.0.0 (DOI 10.60775/fairhub.3, released November 17,
    2025, 2280 participants, three additional imaging devices, automated plus custom processing).
  latest_version_doi: doi:10.60775/fairhub.3
  version_details: >-
    Version 2.0.0 is no longer accessible on FAIRhub, which reports 2.01 TB and 165,051 files for
    that version. One version of the documentation is associated with each version of the dataset at
    docs.aireadi.org, navigable from a dropdown. Datasheets in the healthsheet format were created
    for versions 1 and 2 and are published at docs.aireadi.org. The data fields and types in version
    3.0.0 are largely the same as the previous version, except that the Snellen visual acuity
    variables were dropped so that only logMAR visual acuity measurements are available, and a new
    recommended training/validation/testing split was added.

retention_limit:
  retention_details: >-
    No limits apply to the retention of the data associated with the instances; participants were
    not told that their data would be retained for a fixed period of time and then deleted. Older
    versions of the dataset are not updated; instead, new versions are released with additional
    instances.

external_resources:
- external_resources: >-
    Dataset documentation at https://docs.aireadi.org (select "Dataset v3.0.0" for this version);
    the AI-READI project website at https://aireadi.org; the Zenodo community of the AI-READI
    project at https://zenodo.org/communities/aireadi; the GitHub organization of the AI-READI
    project at https://github.com/AI-READI; and the Clinical Dataset Structure specification at
    https://cds-specification.readthedocs.io.
  restrictions:
  - >-
    The dataset is self-contained but relies on the dataset documentation for users requiring
    additional information about its provenance. The documentation is shared under the CC-BY 4.0
    license, so there are no restrictions associated with its use.

