  measurement_technique: Garmin Vivosmart 5 physical activity monitor; caloric burn.
- variable_name: sleep
  data_type: categorical
  measurement_technique: >-
    Garmin Vivosmart 5 physical activity monitor; sleep duration and sleep phases (circadian and
