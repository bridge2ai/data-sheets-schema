is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor. The public set is stripped of Protected Health Information as defined by the
    HIPAA Privacy Rule via the Safe Harbor method, as well as information related to the sex and
    race/ethnicity of the participants to prevent stigmatization of findings.
  identifiers_removed: >-
    Protected Health Information (PHI); information related to the sex and race/ethnicity of the
    participants; medications used.
  deidentification_details: >-
    The FAIRhub dataset description records a de-identification level of NoDeIdentification with
    direct identifiers and HIPAA identifiers flagged, dates not shifted, non-arrayed data not
    generalized and no k-anonymization, with the explanation that no identifiers were collected so
    no active de-identification was necessary, but that the team checked that no identifiable data
    per US HIPAA were present in the data. The dataset was reviewed internally by AI-READI team
    members for quality checks and to ensure that no personally identifiable information was
    accidentally included; it has not undergone any formal external audit.
  source_caveats: >-
    The FAIRhub dataset description records deIdentType "NoDeIdentification" while the RO-Crate
    metadata for the same release records "deidentified": true. Both are tier-1 sources; the
    apparent conflict is a difference of framing, since the FAIRhub explanation states that no
    identifiers were collected in the first place.

