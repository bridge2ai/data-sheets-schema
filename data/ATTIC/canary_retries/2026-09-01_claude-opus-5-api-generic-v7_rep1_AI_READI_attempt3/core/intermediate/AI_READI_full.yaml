notes: >-
  Device manufacturers provided in-kind support to the study: Topcon Corporation (Tokyo, Japan),
  Optomed (Oulu, Finland), iCare World (Raleigh, North Carolina) and Carl Zeiss (Oberkochen,
  Germany) loaned their devices for research purposes at no cost, and Heidelberg Engineering
  (Heidelberg, Germany), Dexcom (San Diego, California) and Garmin (Olathe, Kansas) provided
  research discounts on study devices; several investigators declare consulting, equity or equipment
  relationships with device manufacturers in the associated publications. The FAIRhub dataset pages
  and the AI-READI documentation site carry the notice "This repository is under review for
  potential modification in compliance with Administration directives."

source_caveats: >-
  The AI-READI acronym is expanded as "Artificial Intelligence Ready and Equitable Atlas for
  Diabetes Insights" in the BMJ Open protocol publication (tier 3) and as "Artificial Intelligence
  Ready and Exploratory Atlas for Diabetes Insights" in the FAIRhub healthsheet and README (tier 1)
  and on the NIH RePORTER project page (tier 4); the tier-1 expansion is used in this record. The
  FAIRhub study metadata records Washington University in St. Louis as lead sponsor, managing
  organization and the affiliation of the principal investigator, while the NIH RePORTER project
  page lists the University of Washington as the awardee organization and the RO-Crate names the
  principal investigator as being in the Department of Ophthalmology, University of Washington; the
  tier-1 FAIRhub value is used where an organization had to be named. The anticipated study
  enrollment is 4000 participants in the tier-1 FAIRhub study metadata and in both publications, but
  the tier-2 IRB protocol form describes a cross-sectional dataset of 4600 people; the tier-1 figure
  is used. The healthsheet answer describing this release states that it "consists of data collected
  up through the end of the second year of the study", while the same answer and the README give the
  collection window as July 19, 2023 to May 1, 2025 and the version-history table labels the release
  "v3.0.0 main study" incorporating year 2 and year 3 data.