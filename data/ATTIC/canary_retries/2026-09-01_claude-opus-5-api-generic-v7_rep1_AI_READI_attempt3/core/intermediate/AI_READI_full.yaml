id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI project seeks to create and share a flagship ethically-sourced dataset of type 2
  diabetes. Version 3.0.0 contains data from 2280 participants collected between July 19, 2023 and
  May 01, 2025 from individuals with and without type 2 diabetes mellitus (T2DM) and harmonized
  across three data collection sites. Data from multiple modalities are included: survey data,
  clinical data (blood and urine lab results, cognitive and monofilament testing, physical and
  vision assessments), retinal imaging (color fundus photography, fundus autofluorescence,
  near-infrared reflectance, optical coherence tomography, optical coherence tomography angiography
  and fluorescence lifetime imaging ophthalmoscopy), 12-lead electrocardiography, continuous glucose
  monitoring, wearable activity monitoring and home environmental sensor data. These encompass
  tabular data, imaging data, and physiological signal/waveform data; there is no unstructured text
  data in this dataset. The data contain no protected health information (PHI); information related
  to the sex and race/ethnicity of the participants as well as medication used has also been removed
  and is held under controlled access. The composition of the dataset was designed with future
  studies using AI/machine learning in mind, including recruitment sampling procedures aimed at
  achieving approximately equal distribution of participants across diabetes severity, and a data
  acquisition protocol across multiple domains intended to enable downstream AI/ML analyses that may
  not be feasible with existing data sources such as claims or electronic health records data. The
  goal is to better understand salutogenesis (the pathway from disease to health) in T2DM. A smaller
  mini-subset version of the dataset is available for pipeline development.
