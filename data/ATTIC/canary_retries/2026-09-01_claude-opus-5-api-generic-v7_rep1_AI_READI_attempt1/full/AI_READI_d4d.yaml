third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed and available for public use through the FAIRhub platform.
    Redistribution by licensees is restricted: a licensee may give access to the Data only to
    another licensee bound by an identical agreement with Licensor, and only for the purpose of
    collaborating on one or more projects involving the Data. Data may be used and stored only on
    servers and devices maintained by and located within the licensee's institution or employer,
    or on cloud or remote storage and backup services that have a HIPAA-approved Business
    Associate Agreement in place with that institution or employer.

