license_and_use_terms:
  license_terms: >-
    The dataset is released under the AI-READI Data License Agreement version 2.0, a custom
    license specifically tailored to enable reuse of the AI-READI dataset for commercial or
    research purposes while placing strong requirements around data usage, security and secondary
    sharing to protect study participants, especially when data is reused for AI and ML
    applications. The Licensor is Washington University in St. Louis. Licensor grants a
    non-exclusive and non-transferable license to download, reproduce and use the Data, and to
    create derivative works of the Data, for research, commercial and non-commercial purposes.
    Derivative Data, including Synthetic Data created using the Data, is considered to be Data
    subject to all restrictions in the license. The license text is available at
    https://doi.org/10.5281/zenodo.17555036. Accessing the dataset requires logging in through a
    verified ID system, agreeing to use the data only for type 2 diabetes related research, and
    agreeing to the license terms. Licensees must comply with NIH Genomic Data Sharing Policy
    security best practices, and must acknowledge the Licensor, the source and any funder of the
    Data in any papers reporting use of the Data. The agreement terminates automatically upon any
    breach, after which the licensee must delete all copies of the Data.
  data_use_permission: disease_specific_research
  contact_person: Aaron Lee (ORCID:0000-0002-7452-1648)
  notes: >-
    A license may be taken out by an individual, or on behalf of an Authorized Group that is an
    officially recognized subunit within the licensee's institution or employer; in the latter
    case Authorized Users are individuals who are legal members of that group via contract,
    employment or student status, and their rights terminate automatically upon severance of that
    relationship. The dataset consent metadata records consentType
    "ConsentSpecifiedNotElsewhereCategorised" with the note that the public version can only be
    used for type 2 diabetes related research while a private version will allow more generic use.
  source_caveats: >-
    The single enum value `disease_specific_research` records the access condition the bundle
    attaches to the public release: "Agreeing to use the data only for type 2 diabetes related
    research". The license grant itself is broader, permitting use "for research, commercial and
    non-commercial purposes", and the dataset consent metadata records consentNoncommercial as
    false. The two scopes differ and no single permitted enum value expresses both.

ip_restrictions:
  restrictions:
  - >-
    Title to the Data, and all industrial and intellectual property rights therein, shall at all
    times remain solely and exclusively with Licensor and its suppliers, and Licensee shall not
    take any action inconsistent with such ownership. Any rights not expressly granted are
    reserved to Licensor and its suppliers.
  - 'Copyright notice on the release: Copyright (c) 2026 AI-READI.'
  - >-
    Licensee is permitted to make, reproduce and distribute models, algorithms and programs
    developed, trained or adapted using the Data but which do not themselves contain the Data or
    any modified version of it (Licensee Models), provided that Licensee undertakes all reasonable
    efforts to minimise the likelihood that Data can be memorized, derived, reconstructed or
    reconstituted through the use or construction of such Licensee Models.
  - >-
    Licensee may refer publishers and conference organizers to Licensor if they wish to obtain a
    separate license to the Data for publication purposes.
  notes: >-
    The healthsheet records no third-party IP-based restrictions beyond the license itself. The
    dataset creators state there are no plans for those collecting the data set to develop
    commercial products or file patents, but the dataset is made available with a
    commercial-friendly license and products or patents may be developed from it in future.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    Licensee agrees to comply with all data security and privacy standards established by the U.S.
    National Institutes of Health under its Genomic Data Sharing (GDS) Policy, currently the NIH
    Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
  - >-
    The Data may be statically watermarked to identify Licensee for security purposes, and
    Licensee agrees to take no action to remove, obscure, alter or mask such watermarking.
  - >-
    Access is conditional on login through a verified ID system and on agreeing to use the data
    only for type 2 diabetes related research.
  other_compliance: >-
    Licensee agrees to comply with all applicable laws, regulations and restrictions relating to
    the distribution and use of the Data and Models. The study is recorded as not FDA-regulated
    for either drug or device. The RO-Crate records a confidentiality level of "HL7:2N (normal)".
  notes: >-
    The healthsheet answers the export-control question by referring to the license rather than
    naming any specific export control regime.

data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  committee_contact: Aaron Lee (ORCID:0000-0002-7452-1648)
  access_review_process: >-
    Accessing the dataset requires several steps: logging in through a verified ID system;
    agreeing to use the data only for type 2 diabetes related research; and agreeing to the
    license terms, which set certain restrictions and obligations for data usage. The access type
    is recorded as PublicDownloadSelfAttestationRequired, and access conditions are published at
    https://fairhub.io/datasets/3/access. The v3.0.0 documentation additionally describes Azure
    Storage access and a smaller mini-subset version of the dataset for pipeline development. The
    controlled access dataset, which additionally contains 5-digit zip code, sex, race, ethnicity,
    genetic sequencing data, past health records, medications, and traffic and accident reports,
    is available only to scientists whose institutions have completed legal and privacy use
    agreements with the AI-READI research programme, through a data use agreement.
  stewardship_roles:
  - The AI-READI team supports and maintains the dataset.
  - The dataset is hosted on FAIRhub through Microsoft Azure.
  - >-
    Washington University in St. Louis is recorded as the managing organization and lead sponsor
    and is the Licensor of the data license.
  - >-
    The Data Manager at each data site is responsible for quality control of all data before
    uploading to FAIRhub.
  source_caveats: >-
    The RO-Crate (tier 1) names the AI-READI Consortium as the dataGovernanceCommittee. The BMJ
    Open protocol (tier 3) states that the requirements for controlled access data sets were being
    developed by a "Data Access Committee"; the two are not reconciled in the bundle, and the
    tier 1 source was preferred for the committee name.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    IRB protocol STUDY00016228. The initial IRB approval was received on December 20, 2022, and
    the initial approval letter is published at
    https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf. An annual renewal
    application to the IRB about the status and progress of the study is required and due within
    90 days of expiration. The other clinical sites operated under IRB reliance agreements.
  ethics_review_board: >-
    Washington University IRB, contactable through the IRB Reliance Team at hsdrely@uw.edu, Human
    Subjects Division, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, US.
  regulatory_compliance:
  - >-
    Human subject review status recorded as "Submitted, approved". The study is not an FDA
    regulated drug study and not an FDA regulated device study, and has no Data Monitoring
    Committee. Written informed consent is provided by all participants. The dataset is recorded
    as de-identified.
  special_populations:
  - >-
    Enrollment is limited to adults aged 40 to 85 years; pregnancy, gestational diabetes and type
    1 diabetes are exclusionary, so pregnant women and minors are not enrolled.
  source_caveats: >-
    The RO-Crate (tier 1) names the review board "Washington University IRB" but gives a
    University of Washington Human Subjects Division address and a uw.edu contact address. The BMJ
    Open protocol (tier 3) states that AI-READI was approved by the Institutional Review Board of
    the University of Washington under the same approval number STUDY00016228, with reliance
    agreements with the IRBs of the University of Alabama at Birmingham and the University of
    California, San Diego.

at_risk_populations:
  at_risk_groups_included: false
  notes: >-
    Inclusion is limited to adults able to provide consent who are 40 years or older, with a
    maximum age of 85; minors are therefore not enrolled and no assent or guardian permission
    procedures apply. Pregnancy and gestational diabetes are exclusion criteria, so pregnant women
    are not enrolled. Participants must be able to speak and read English. Transportation
    assistance in the form of rideshare services was offered to study participants who reported
    barriers to transporting themselves to study visits, and the study covered reasonable costs
    for parking, public transit or rideshare fees related to the study visit.

ethical_reviews:
- reviewing_organization: Washington University IRB
  review_details: >-
    IRB protocol STUDY00016228; initial approval received December 20, 2022, with annual renewal
    required. The three clinical sites operated under IRB reliance, using the same consent form
    with minor institution-specific language depending on individual institutional requirements.
    The study is registered on ClinicalTrials.gov as NCT06002048. The IRB Reliance Team is
    reachable at hsdrely@uw.edu.
- review_details: >-
    Ethical review for the release is attributed in the RO-Crate to Camille Nebeker, Debra
    Mathews, Kadija Ferryman and Nicholas Evans. Ethical, legal and social implications are
    considered at every stage of the project cycle, and the design process enacted ethical and
    equitable data collection and management practices as well as data sharing with adherence to
    the FAIR principles, including guidance from bioethicists.
  source_caveats: >-
    The RO-Crate ethicalReview field names four individuals and no reviewing organization, so
    reviewing_organization is left unpopulated for this entry.
- reviewing_organization: AI-READI Community Advisory Board
  review_details: >-
    A Community Advisory Board of 11 persons from the three sites, including diversity in race and
    ethnicity as represented in the AI-READI sample, contributes to the development of the
    protocol and evaluates the consent forms and research protocols; their feedback is considered
    in modifications.
  source_caveats: >-
    The Community Advisory Board is described in the BMJ Open protocol (tier 3) and the IRB
    protocol document (tier 2).

informed_consent:
- consent_obtained: true
  consent_type: >-
    Written informed consent, obtained either as electronic consent (e-consent) with an electronic
    signature in REDCap before the visit, or in person on paper at the start of the visit.
  consent_documentation: >-
    The approved consent form for the principal project site, the University of Washington, is
    published at
    https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
    Upon signing, the electronic consent form is automatically emailed to the subject, who can
    request additional copies from the study coordinator for the duration of the study.
  consent_scope: >-
    Informed consent to participate was required before participation in any part of the protocol,
    including questionnaires. The consent covers the study protocol, placement of de-identified
    data in an open-source repository and the sending of samples to the study sample repository
    for future research. The consent form includes a table clarifying which information is
    publicly available and which requires an application and approval process.
  withdrawal_mechanism: >-
    Participants were permitted to withdraw consent at any time and cease study participation.
    However, any data that had been shared or used up to that point would stay in the dataset.
    This is clearly communicated in the consent document.
  notes: >-
    Potential participants could read all consent documentation electronically before their visit
    and give consent with an electronic signature without verbal communication with a clinical
    research coordinator, or decide at that point not to participate or to request additional
    information. Those without internet access could call research staff for alternative methods
    of enrolment.

collection_consents:
- consent_details: >-
    Informed consent to participate was required before participation in any part of the protocol,
    including questionnaires. Potential participants were given the option to read all consent
    documentation electronically (e-consent) before their visit and to give consent with an
    electronic signature. Participants access the e-consent documentation in REDCap through a
    personalised link, access code or QR code sent by mail and email.
- consent_details: >-
    The dataset consent metadata records consentType
    "ConsentSpecifiedNotElsewhereCategorised", with no non-commercial restriction, no geographic
    restriction, no research-type restriction, no genetic-only restriction and no
    methods-development restriction recorded, and the note that the public version of the dataset
    can only be used for type 2 diabetes related research while a private version will allow for
    more generic use.

collection_notifications:
- notification_details: >-
    Each individual was aware of the data collection, as this was not passive data collection or
    secondary use of existing data, but rather active data collection directly from participants.
    Individuals in each recruitment pool were mailed a hardcopy invitation letter and sent an
    invitation email, both personalised, directing them into an online REDCap recruitment
    interface where they could read an overview of the research programme, expectations for
    participation and answers to frequently asked questions, download the informed consent
    document, request a call back from study staff, complete a screening survey and enroll.

consent_revocations:
- revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease study participation.
    However, any data that had been shared or used up to that point would stay in the dataset.
    This is clearly communicated in the consent document.

participant_compensation:
- compensation_provided: true
  compensation_amount: USD 200
  compensation_type: Stipend for the study visit
  compensation_rationale: >-
    Study subjects received a compensation of $200 for the study visit, funded through the NIH
    grant. The stipend is provided when the final data are received from the participant and the
    study devices are returned, typically at least two weeks after the study visit to allow for
    the 10-day home monitoring period and return shipping. The payment is not prorated.
  notes: >-
    The study additionally covers reasonable costs for parking, public transit or rideshare fees
    related to the study visit, and transportation assistance in the form of rideshare services
    was offered to participants reporting barriers to attending. The IRB protocol notes that
    subjects may incur transport costs that will not be reimbursed if transportation fees exceed
    $25. The same type and amount of compensation is given to participants asked to return for the
    year 4 follow-up visit.

participant_privacy:
- anonymization_method: >-
    The public set is stripped of Protected Health Information as defined by the HIPAA Privacy
    Rule via the Safe Harbor method, as well as information related to the sex and race/ethnicity
    of the participants to prevent stigmatization of findings, and information about medications
    used.
  privacy_techniques: >-
    A robust data dissemination system; a strict license agreement; static data watermarking of
    both public and controlled sets to identify the licensee; login through a verified ID system
    before download; selection of home monitoring devices with participant privacy as a primary
    concern: the environmental sensor and Garmin fitness tracker do not capture video or audio,
    are not equipped with GPS location monitoring, and are not synced with participant-owned
    devices; identifiable information kept on encrypted servers or in locked cabinets or rooms
    with restricted access at all sites, with access limited to authorized research personnel.
  reidentification_risk: >-
    There is a theoretical risk of future re-identification. AI algorithms can infer individual
    patient characteristics and could facilitate individual-level identification, which is the
    stated motivation for the dissemination system, license agreement and watermarking.
  data_linkage: >-
    Within the release, files are linked across datatypes, modalities and devices by the study
    participant ID number that names each participant folder; the participants.tsv file links the
    participant ID to the recommended data split. No linkage to external identifiers is released.

is_deidentified:
  identifiable_elements_present: false
  method: HIPAA Safe Harbor
  deidentification_details: >-
    No identifiers were collected so no active de-identification was necessary, but the team
    checked that no identifiable data per US HIPAA were present in the data. The public set is
    stripped of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe
    Harbor method.
  identifiers_removed: >-
    Protected Health Information as defined by the HIPAA Privacy Rule; sex; race and ethnicity;
    medications used.
  source_caveats: >-
    The FAIRhub dataset_description records datasetDeIdentLevel deIdentType as
    "NoDeIdentification" while simultaneously setting deIdentDirect and deIdentHIPAA to true, and
    setting deIdentDates, deIdentNonarr and deIdentKAnon to false; the accompanying deIdentDetails
    text explains the apparent contradiction. Two healthsheet questions about de-identification
    measures were left with empty responses.

confidential_elements:
- confidential_elements_present: false
  confidentiality_details: >-
    The dataset does not contain data that might be considered confidential. No personally
    identifiable information is included in the dataset.

sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: >-
    The public dataset does not contain data that is considered sensitive. Information related to
    the sex and race/ethnicity of the participants, and medication used, has been removed from
    this release.
- sensitive_elements_present: true
  sensitivity_details: >-
    The separate controlled access dataset, which is not part of this public release, contains
    5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records,
    medications, and traffic and motor vehicle accident reports.
  notes: >-
    The RO-Crate lists the categories of personal or sensitive information handled by the project
    as EHR, wearable monitoring, ECG, environmental sensor, continuous glucose monitor and
    wearable accelerometer data.

content_warnings:
- content_warnings_present: false
  warnings:
  - >-
    The dataset does not contain data that, if viewed directly, might be offensive, insulting,
    threatening, or might otherwise pose any safety risk.

maintainers:
- role: academic_institution
  maintainer_details: >-
    The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub through
    Microsoft Azure. Contact information for the owner, curator and manager is provided in the
    README file included with the dataset; general contact is directed to
    https://aireadi.org/contact and https://docs.aireadi.org/docs/3/contact, and the central
    study contact is Aaron Lee (contact@aireadi.org). The study_description.json and
    dataset_description.json metadata files included with the dataset carry additional information
    about the contact person or entity, authors and contributors.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset gets released as static versions and will not be updated in place. Rather, new
    versions of the dataset will be released with additional instances as more study participants
    complete the study visit. Enrollment is ongoing, so future versions will include larger
    numbers of participants. Changes between versions are documented in detail in the CHANGELOG
    file included in the dataset and visible at docs.aireadi.org. Between v2.0.0 and v3.0.0 the
    data fields and types were largely unchanged, except that the Snellen visual acuity variables
    were dropped so that only logMAR visual acuity measurements remain, and three additional
    imaging devices were added with the year 3 data.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - '1.0.0 (DOI 10.60775/fairhub.1), released May 3, 2024: 204 participants from the pilot data
    collection phase'
  - '2.0.0 (DOI 10.60775/fairhub.2), released November 8, 2024: 1,067 participants, 165,051 files,
    2.01 TB; no longer accessible'
  - '3.0.0 (DOI 10.60775/fairhub.3), released November 17, 2025: 2,280 participants, 356,343
    files, 3.82 TB'
  version_details: >-
    Each dataset version has a corresponding documentation version, selectable from a dropdown in
    the documentation site. Version 2.0.0 of the dataset is recorded as no longer accessible, and
    its documentation directs readers to the latest version. Healthsheets exist for the first
    version (https://docs.aireadi.org/docs/1/dataset/healthsheet) and the second
    (https://docs.aireadi.org/docs/2/dataset/healthsheet). The maintenance answers state that
    older versions will not continue to be supported because the dataset is not updated in place;
    new versions are released instead.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. Participants
    were not told that their data would be retained for a fixed period and then deleted.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside
    of those who are involved in the project.
  contribution_url: https://github.com/AI-READI