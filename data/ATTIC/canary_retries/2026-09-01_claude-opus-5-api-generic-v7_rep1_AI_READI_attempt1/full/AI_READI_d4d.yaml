    Data Subject's membership in a particular group of persons, or otherwise to cause harm or
    injury to any Data Subject.
- prohibition_reason: >-
    Licensee shall not transfer, license, sublicense, sell, assign, display, share or otherwise
    convey any portion of the Data or any derivative work to any third party other than another
    licensee bound by an identical agreement with Licensor.
- prohibition_reason: >-
    Licensee shall not share or distribute Data with any third party model vendor or developer
    for training or development purposes, where training includes model weight modification and
    other adjustments to a model's logic or operation, even if that vendor is party to a
    Business Associate Agreement.
- prohibition_reason: >-
    Data may not be reproduced in papers, articles, presentations, analyses, reports or
    publications except that small representative samples may be reproduced in up to five images
    or figures per Paper for illustrative purposes only; larger amounts shall not be published
    or made available via supplemental files, zip archives, code packages or other means.
- prohibition_reason: >-
    Licensee agrees to take no action to remove, obscure, alter or mask the static watermarking
    that may be applied to the Data to identify Licensee for security purposes.

future_use_impacts:
- impact_details: >-
    To the extent of the creators' knowledge, no uses of the dataset are currently anticipated
    that could result in unfair treatment or harm; however, there is a theoretical risk of
    future re-identification. AI algorithms can infer individual patient characteristics and
    could facilitate individual-level identification, so a robust data dissemination system, a
    strict license agreement and data watermarking are implemented for both the public and
    controlled sets.
- impact_details: >-
    Because the public release omits sex and race/ethnicity, users cannot directly audit models
    for disparities across those attributes; the project instead supplies a recommended
    train/validation/test split whose validation and test sets are balanced as far as possible
    for sex, race/ethnicity and diabetes status, in order to reduce disparities in models
    developed using this dataset.

acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details: >-
    The acquisition of data varied based on the domain; some data were directly observable (such
    as labs, vitals, and retinal imaging), whereas other data were reported by subjects (for
    example survey responses). Verification of data entry was performed when possible, for
    example by cross-referencing entered medications with medications that were physically
    brought in or photographed by each study participant.

direct_collection:
- is_direct: true
  collection_details: >-
    The data was collected directly from participants across the three recruiting sites.
    Recruitment pools were identified by screening Electronic Health Records for diabetes and
    prediabetes ICD-10 codes for all patients who had an encounter with the sites' health
    systems within the past 2 years. This was active data collection directly from participants
    rather than passive collection or secondary use of existing data.

collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: >-
    For this version of the dataset the timeframe for data collection was July 19, 2023 to
    May 01, 2025, spanning the pilot phase and the first two years of the main study. The
    timeline for the overall project spans four years, encompassing one year dedicated to
    protocol development and training, and years 2-4 allocated for subject recruitment and data
    collection. Each participant completes a single visit; approximately 4-10% of participants
    are expected to undergo a follow-up examination in Year 4.
  source_caveats: >-
    The BMJ Open protocol (tier 3) states that enrolment began on 18 July 2023 and will continue
    until 30 November 2026, and that preliminary pilot enrolment occurred between 18 July 2023
    and 30 November 2023 with formal data collection beginning 1 December 2023. The FAIRhub
    structured metadata (tier 1) was preferred for the collection window recorded here.

data_collectors:
- role: Clinical research coordinator
  collector_details: >-
    Clinical research coordinators at the three data collection sites recruited and consented
    participants, ushered them through the research visit, conducted study visits including
    collection of ophthalmic images, provided training on study procedures such as continuous
    glucose monitoring and the fitness tracker, and ensured the return of all study materials.
    All research personnel who recruited, enrolled and collected data underwent training by the
    data manager at the University of Alabama at Birmingham and used a detailed Manual of
    Procedures; a certification process was required, including mandatory institutional
    compliance training for human subject research and successful administration of all protocol
    elements to at least three volunteer practice subjects.
- role: Site data manager
  collector_details: >-
    Data Managers at each site oversee the data collection process and are responsible for the
    quality control of all data before uploading to FAIRhub.
- role: Phlebotomist and laboratory assistant
  collector_details: >-
    Phlebotomists were responsible for blood collection from research participants and lab
    assistants for processing and shipping samples.
- role: Research and data scientists, software and cloud engineers
  collector_details: >-
    Research and data scientists processed data for release and developed standards; software
    engineers designed, implemented and tested the data curation pipelines; cloud engineers
    handled cloud infrastructure configuration and deployment.
- role: Compensation of data collectors
  collector_details: >-
    Effort of AI-READI team members involved in data collection was supported by National
    Institutes of Health award OT2OD032644 based on the percentage of effort contributed, with
    salaries aligned to the funding guidelines at each site.

collection_mechanisms:
- mechanism_details: >-
    REDCap was used for recruitment, electronic consent, participant-reported questionnaires and
    the following clinical data from the visit: medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament test results and complete blood count results. Clinical
    data outside of expected minimum/maximum ranges were flagged in REDCap.
- mechanism_details: >-
    Philips PageWriter TC30 Cardiograph, used for a 12-lead electrocardiogram performed while
    the participant sits in a reclining chair or lies supine, with the position recorded (0, 30,
    60 or 90 degrees relative to supine). Data are exported in .xml format.
- mechanism_details: >-
    Dexcom G6 continuous glucose monitor, a real-time integrated continuous glucose monitoring
    system that captures blood glucose readings every five minutes without finger sticks. It was
    worn for 10 continuous days; participants were masked to the results during the monitoring
    period. Data are exported as .csv.
- mechanism_details: >-
    Garmin Vivosmart 5 physical activity monitor, worn on the wrist for 10 consecutive days at a
    sampling frequency of 5 seconds, recording steps, heart rate, respiratory rate, oxygen
    saturation, stress and sleep. Participants returned a form specifying which wrist the
    tracker was worn on and their dominant hand. There are gaps in data collection because the
    battery had to be charged every 2-3 days. Data are exported in .FIT format and converted to
    the Open mHealth standard.
- mechanism_details: >-
    LeeLab Anura, a custom-designed environmental sensor unit built for the AI-READI project at
    the Karalis Johnson Retina Center, University of Washington, placed in the participant's
    home for 10 days. It records particulate matter counts (PM1.0, PM2.5, PM4, PM10),
    temperature, relative humidity, volatile organic compounds, nitrogen oxides (NO and NO2) and
    11 multi-spectral light intensity measurements. Data are recorded as .csv. The device
    captures no video or audio, has no GPS location monitoring and is not synced with
    participant-owned devices.
- mechanism_details: >-
    Optomed Aurora IQ handheld fundus camera (Optomed, Oulu, Finland), used for undilated colour
    fundus photography with a 50-degree field of view and 5 Mpix sensor; four images per
    participant, macula and disc centred, output in DICOM.
- mechanism_details: >-
    iCare EIDON widefield TrueColor confocal fundus system (iCare USA, Raleigh, North Carolina),
    capturing ultra-wide field central, nasal and temporal colour fundus photographs,
    ultra-wide field central infrared and fundus autofluorescence images and a mosaic;
    12 images per participant, output in DICOM.
- mechanism_details: >-
    Heidelberg Spectralis HRA optical coherence tomography and OCT angiography (Heidelberg
    Engineering GmbH, Heidelberg, Germany), acquiring Optic Nerve Head Radial Circle High
    Resolution OCT, Posterior Pole Macula HR 61 lines OCT and Macula 20x20 HS 512 lines OCTA;
    6 images per participant, output in DICOM.
- mechanism_details: >-
    Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan), acquiring 3D Wide
    (H) 12x9 512x128 OCT, 3D Macula 6x6 512x128 OCT and Macula 6x6 360x360 OCTA; 6 images per
    participant, exported in .fda file format and converted to DICOM for the dataset.
- mechanism_details: >-
    Topcon Triton DRI OCT (Topcon Healthcare, Itabashi-ku, Tokyo, Japan), a swept-source device
    acquiring 3D(H)+Rad 12x9 512x256 OCT, Macula 6x6 320x320 OCTA and Macula 12x12 512x512 OCTA;
    6 images per participant, exported in .fda file format and converted to DICOM.
- mechanism_details: >-
    Carl Zeiss Meditec Cirrus 5000 Angioplex (Jena, Germany), acquiring Disc Cube 200x200 OCT,
    Macula Cube 512x128 OCT, Macula 6x6 OCTA and Disc 6x6 OCTA; 8 images per participant, output
    in DICOM.
- mechanism_details: >-
    Heidelberg Engineering Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO), macula-centred;
    2 images per participant, exported in .sdt file format and converted to DICOM. The scan
    records images at a short (498-560 nm) and a long (560-720 nm) wavelength, provided in two
    separate DICOM files per eye.
- mechanism_details: >-
    M&S Technologies Electronic Visual Acuity tester, used at 4 metres on a touch-screen monitor
    for best-corrected photopic letter visual acuity and, through a 2.0 neutral density filter,
    mesopic acuity; results expressed as logMAR.
- mechanism_details: >-
    Mars Letter Contrast Sensitivity chart (Mars Perceptrix, Chappaqua, New York), administered
    monocularly under photopic conditions and, using a neutral density occluder, mesopic
    conditions; results expressed as log contrast sensitivity.
- mechanism_details: >-
    Topcon KR 800 auto keratometer/refractor (Topcon Healthcare), used to obtain autorefraction
    data for each eye as spherical and cylindrical components in dioptres with cylindrical axis.
- mechanism_details: >-
    Lensometers used across sites: NIDEK LM-600P Auto Lensometer, Topcon CL-200 and Topcon
    CL-300 computerized lensometers.
- mechanism_details: >-
    Blood pressure devices used across sites: OMRON HEM 907XL Blood Pressure Monitor, Medline
    MDS4001 Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series Vital signs
    monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff. Systolic and diastolic
    blood pressure and heart rate were measured twice, separated by 2 minutes, with an automatic
    oscillometric medically approved device.
- mechanism_details: >-
    Montreal Cognitive Assessment (MoCA) administered electronically on an iPad using the MoCA
    Duo application (MoCA Cognition, Quebec, Canada); the total score, section subscores, Memory
    Index Score and task completion times are exported as .csv.
- mechanism_details: >-
    Monofilament testing for peripheral neuropathy using a standard 10 g monofilament applied to
    three locations on the plantar surface of each foot, 10 times per location, with the
    participant's eyes closed; insensate areas were retested for confirmation and results were
    recorded directly into REDCap.
- mechanism_details: >-
    Clinical laboratory assays. Clinical Laboratory Improvement Amendments-certified laboratories
    local to each data collection site performed complete blood count testing on fresh whole
    blood; all other lab tests were performed by the University of Washington Nutrition and
    Obesity Research Center testing facility using stored, frozen samples. Blood and urine
    testing results from the NORC lab were provided in .csv format.

sampling_strategies:
- is_sample: false
  is_random: false
  is_representative: false
  strategies: >-
    Non-Probability Sample. Recruitment pools were identified by screening electronic health
    records at each site for ICD-10 diagnosis codes for prediabetes (R73.09) and type 2 diabetes
    (E11.X) among patients aged 40 and over who had a medical encounter within each health
    system. Participants are recruited in waves; the composition and size of each wave are
    influenced by the observed participation characteristics of race/ethnicity, gender, severity
    of T2DM and site, with under- and oversampling of groups adjusted as recruitment progresses.
    The study cohort is triple-balanced by recruiting in equal proportions four race/ethnic
    groups (Asian, Black, White, Hispanic), four categories of T2DM severity (no diabetes,
    pre-diabetes/lifestyle-controlled, controlled by oral or non-insulin injectable medications,
    and insulin-controlled) and biological males and females.
  source_data: >-
    The study base is all patients aged 40 years and older who had a medical encounter within
    each health system site (University of Alabama at Birmingham, University of California San
    Diego, University of Washington).
  why_not_representative: >-
    Rather than targeting the demographic distribution of the US population, the study
    intentionally recruits equal numbers of four racial/ethnic groups and four diabetes severity
    groups, because building balanced datasets is critical for the development of unbiased
    machine learning models. Recruitment is predominantly urban and hospital-based.
  notes: >-
    The dataset contains all instances available for the release window: data from all
    participants enrolled up to May 1, 2025. Eligibility required the ability to provide
    consent, age 40 years or older (maximum 85 years), and the ability to speak and read
    English; pregnancy, gestational diabetes and type 1 diabetes were exclusionary.

instances:
- instance_type: Individual study participant
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: >-
    No explicit label or target is associated with each data instance. No specific labeling was
    performed, as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple
    potential downstream AI/ML applications.
  notes: >-
    Each instance consists of all of the data available for an individual participating in the
    study, spanning survey data, clinical data, retinal imaging data, environmental sensor data,
    continuous glucose monitor data and wearable activity monitor data. These encompass tabular
    data, imaging data, and physiological signal/waveform data. There is no unstructured text
    data included in this dataset.
  source_caveats: >-
    The bundle states that an instance encompasses tabular, imaging and physiological
    signal/waveform data simultaneously; because `data_substrate` admits a single term and no
    one term in the B2AI substrate list covers that combination, the slot is omitted rather than
    approximated. `data_topic` is likewise a single term for a multimodal instance:
    B2AI_TOPIC:43 (Diabetes) names the condition the cohort is defined by.

relationships:
- relationship_details: >-
    All instances are part of the same prospective data generation project (AI-READI). There is
    currently only one visit per participant. Within a participant, files from every datatype,
    modality and device are linked by the participant ID number, which names the participant
    folder inside each device folder.

splits:
- split_details: >-
    The current version of the dataset comes with recommended data splits. Because sex, race and
    ethnicity data are not released with the public version of the dataset, the project team
    prepared splits into proportions of 70%/15%/15% for training, validation and testing, where
    the validation and test sets are balanced as well as possible for sex, race/ethnicity and
    diabetes status (no diabetes, prediabetes/lifestyle controlled, oral medication controlled,
    and insulin controlled). The split is included in the participants.tsv file. Counts are
    1,576 train, 352 validation and 352 test, totalling 2,280 participants. Race/ethnicity
    counts in the training set are 204 Hispanic, 369 Asian, 343 Black and 660 White; each of the
    validation and test sets contains 88 participants of each of those four groups. Sex counts
    are 599 male and 977 female in training and 176 male and 176 female in each of validation
    and test. Diabetes status counts are 600 no diabetes, 384 lifestyle, 487 oral and 105
    insulin in training; 88, 88, 109 and 67 in validation; and 88, 88, 90 and 86 in test. Mean
    age is 61.1 +/- 11.3 years in training, 60.3 +/- 10.8 in validation, 60.5 +/- 11.4 in test
    and 60.8 +/- 11.3 overall.

