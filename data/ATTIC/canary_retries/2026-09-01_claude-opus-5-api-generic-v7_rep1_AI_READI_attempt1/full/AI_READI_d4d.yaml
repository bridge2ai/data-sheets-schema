subpopulations:
- subpopulation_elements_present: false
  identification: >-
    The dataset as released does not identify demographic sub-populations at the instance level:
    sex, race and ethnicity are held under controlled access and are not present in the public
    release. Diabetes status groups (no diabetes; pre-diabetes/lifestyle controlled; oral or
    non-insulin injectable medication controlled; insulin dependent) define the four study arms.
  distribution: >-
    Aggregate counts for the 2,280 participants are reported in the release README: by
    race/ethnicity, 380 Hispanic, 545 Asian, 519 Black and 836 White; by sex, 951 male and 1,329
    female; by diabetes status, 776 no diabetes, 560 lifestyle, 686 oral and 258 insulin. Overall
    mean age is 60.8 +/- 11.3 years.
  notes: >-
    The overall enrollment goal is a balanced distribution between racial groups, biological
    sexes and diabetes severity groups. As enrollment is ongoing, the pilot data release and
    periodic updates to data releases may not have achieved balanced distribution across groups.

anomalies:
- anomaly_details: >-
    Not all modalities are available for all participants. Some participants elected not to
    participate in some study elements.
- anomaly_details: >-
    In a few cases the data collection device did not have any stored results or was returned too
    late to retrieve the results, for example because the battery died or data was lost.
- anomaly_details: >-
    In a few cases there may have been a data collision at some point in the process and data
    has been lost.
- anomaly_details: >-
    In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: >-
    In wearable data, improper use and technical failure such as battery failure or system
    malfunction are expected. The Garmin Vivosmart 5 battery had to be charged every 2-3 days,
    producing gaps in the activity record.
- anomaly_details: >-
    In imaging data, patient uncooperation, noise that may obscure the images, technical failure
    such as system malfunction, and data transfer failures are expected. Undilated Optomed images
    vary in quality from patient to patient and within the same patient because of the handheld
    nature of the modality and the absence of dilation. FLIO is performed last in the visit and
    exposes patients to uncomfortable levels of light, so patients may not be at their best
    possible compliance; the FLIO device cannot handle more than 1 centimetre of movement during
    image acquisition. Heidelberg Spectralis imaging is not fully automated, so quality issues may
    lead to skipping the modality and missing data.

missing_data_documentation:
- missing_data_causes: >-
    Participants elected not to participate in some study elements; data collection device had no
    stored results, or was returned too late to retrieve results (for example, battery died or
    data was lost); data collision at some point in the processing pipeline; skipped questions or
    incomplete responses in survey data; improper use or technical failure of wearable devices;
    patient uncooperation, image noise, device malfunction or data transfer failure in imaging.
  missing_data_patterns: >-
    Missingness is at the modality level: a participant may be present in some datatype
    directories and absent from others. File counts per datatype directory differ substantially
    from the 2,280-participant total for this reason.
  handling_strategy: >-
    No imputation was applied. During data entry, missing data that could be directly filled from
    other portions of an individual's record were completed under the guidance and approval of
    the site principal investigator. Where there was no logical or appropriate way to correct the
    data, the site principal investigator reviewed the values and decided whether they should be
    removed.

known_biases:
- bias_type: representation_bias
  bias_description: >-
    While the AI-READI cross-sectional database ultimately aims to achieve balance across
    race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
    balanced across these parameters, and periodic data releases made while enrollment is ongoing
    may not have achieved balanced distribution across groups.
  mitigation_strategy: >-
    Recruitment proceeds in waves with under- and oversampling of groups as needed to reach the
    triple-balanced target; a recommended train/validation/test split is supplied whose validation
    and test sets are balanced as far as possible for sex, race/ethnicity and diabetes status.
  affected_subsets:
  - doi:10.60775/fairhub.3#train
  - doi:10.60775/fairhub.3#validation
  - doi:10.60775/fairhub.3#test
  source_caveats: >-
    The imbalance the bundle describes is a property of the enrolled cohort as a whole, so all
    three recommended splits are listed as affected. The bundle states that the validation and
    test sets are balanced as far as possible for sex, race/ethnicity and diabetes status, which
    is the mitigation applied to those splits rather than evidence that they are unaffected.
- bias_type: sampling_bias
  bias_description: >-
    Factors influencing the generalization of derived models include the predominantly urban and
    hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
    backgrounds.
  mitigation_strategy: >-
    Three recording sites were strategically selected for geographic diversity across the United
    States and to ensure diverse representation across racial and ethnic groups; individuals from
    all demographic backgrounds were recruited at all three sites, and uniform data collection
    protocols were implemented for all subjects across all study sites.
- bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so there is selection bias known as volunteer bias which may
    limit the generalisability of the results among those who are not represented in the study
    population. Requiring that eligible participants speak, read and understand English may have
    created challenges in recruiting Hispanic and/or Asian persons. It is well documented that
    recruiting Black men into health research is more difficult than recruiting other
    populations, yet this population represents a disproportionate percentage of burden in T2DM.
  mitigation_strategy: >-
    If sample balancing on race/ethnicity emerges as a challenge, new recruitment strategies will
    be implemented to overcome the imbalance, including tailoring printed materials and using a
    personalised, participatory approach to recruitment.
  source_caveats: >-
    Volunteer bias and the English-language recruitment concern are stated in the BMJ Open
    protocol (tier 3); no tier 1 source contradicts them.
- bias_type: measurement_bias
  bias_description: >-
    Multiple different devices were used for the same measure (for example four different OCT
    devices, four lensometers and three blood pressure monitors), so device make and model is a
    source of systematic between-participant variation in the corresponding measurements.
  mitigation_strategy: >-
    Information on device make and model, including specific modalities such as macula scans or
    wide scans during OCT, was documented to ensure repeatability, and the dataset directory
    structure records the device for every file. Multiple devices for one measure were included
    deliberately to enhance generalizability and represent the diverse range of equipment used in
    clinical settings.

known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: >-
    The study cohort may not provide a comprehensive representation of the population, as
    recruitment was predominantly urban and hospital-based and may not fully capture diverse
    cultural and socioeconomic backgrounds.
  scope_impact: >-
    Models derived from the dataset may generalize poorly to rural, non-hospital-attending or
    otherwise unrepresented populations.
- limitation_type: coverage_limitation
  limitation_description: >-
    The cohort does not include other races/ethnicities such as Pacific Islanders and Native
    Americans.
  recommended_mitigation: >-
    Through engagement with the Native Biodata Consortium, the project pursues a co-learning
    opportunity for understanding challenges specific to American Indian and Alaska Native
    communities, including data usage agreements, contract negotiations, transparent access
    agreements and assured return of benefit; a tribal consultation is planned with the goal of
    collecting similar data within a Native American cohort.
- limitation_type: temporal_limitation
  limitation_description: >-
    The dataset is cross-sectional with only one visit per participant in this release; a
    longitudinal arm inviting approximately 10% of the cohort back in year 4 of the project is
    planned but not included here.
  scope_impact: >-
    Within-individual change over time cannot be studied from this release; disease trajectory
    analyses must rely on cross-sectional pseudo-time approaches.
- limitation_type: scope_limitation
  limitation_description: >-
    The public release omits protected health information, sex, race/ethnicity and medication
    information. Data held under controlled access include 5-digit zip code, sex, race,
    ethnicity, genetic sequencing data, past health records, medications, and traffic and
    accident reports.
  recommended_mitigation: >-
    The full dataset is accessible by entering into a data use agreement.
- limitation_type: methodological_limitation
  limitation_description: >-
    No labels or targets are provided, no gold-standard annotation exists, and no formal
    guidelines are in place for future researchers creating new labels or defining new tasks.
- limitation_type: integration_limitation
  limitation_description: >-
    The Snellen visual acuity variables were dropped in this version of the dataset, such that
    only logMAR visual acuity measurements are available, which limits comparability with the
    previous release.
- limitation_type: scope_limitation
  limitation_description: >-
    A limitation of the associated biorepository is that there are a finite number of samples to
    share with scientists interested in using them in research; procedures for reviewing and
    prioritising written requests were still being developed. Biospecimens are not part of this
    data release.
  source_caveats: >-
    Stated in the BMJ Open protocol (tier 3) as a limitation of the study's biorepository rather
    than of the data files distributed on FAIRhub.

cleaning_strategies:
- cleaning_details: >-
    Several quality control measures were used at the time of data entry and acquisition.
    Clinical data outside of expected minimum/maximum ranges were flagged in REDCap, which was
    visible in reports viewed by clinical research coordinators and Data Managers. Using these
    REDCap reports as guides, Data Managers and coordinators examined participant records and
    determined if an error was likely. Data were checked for, and edited on detection of:
    credibility, based on range checks to determine if all responses fall within a prespecified
    reasonable range; incorrect flow through prescribed skip patterns; missing data that can be
    directly filled from other portions of an individual's record; and the omission and/or
    duplication of records.
- cleaning_details: >-
    Editing was only done under the guidance and approval of the site principal investigator. If
    corrected data was available from elsewhere in the respondent's answers, the error was
    corrected. If there was no logical or appropriate way to correct the data, the site principal
    investigator reviewed the values and made decisions about whether those values should be
    removed from the data.
- cleaning_details: >-
    The dataset was reviewed internally by AI-READI team members for quality checks and to ensure
    that no personally identifiable information was accidentally included. The dataset has not
    undergone any formal external audits.
- cleaning_details: >-
    The Data Manager at each data site is responsible for the quality control of all data before
    uploading to FAIRhub. A dqd_omop.json file supports OMOP CDM data quality analysis using the
    OMOP CDM Data Quality Dashboard, which runs a set of more than 3,500 data quality checks
    against an OMOP CDM instance.

preprocessing_strategies:
- preprocessing_details: >-
    Once data were sent from each of the study sites to the central project team, additional
    processing steps were conducted in preparation for dissemination. All data were mapped to
    standardized terminologies when possible, such as the Observational Medical Outcomes
    Partnership (OMOP) Common Data Model for observational health data and Digital Imaging and
    Communications in Medicine (DICOM) for medical imaging data.
- preprocessing_details: >-
    Participant images were exported from imaging devices in their raw format; Topcon Maestro2
    and Triton images were exported as .fda and Heidelberg FLIO images as .sdt, and both were
    converted to DICOM for the dataset prior to upload.
- preprocessing_details: >-
    Garmin Vivosmart 5 activity data were exported in .FIT format and converted to the Open
    mHealth standard for the dataset; continuous glucose monitor data were also organized to the
    Open mHealth standard.
- preprocessing_details: >-
    Electrocardiogram data were converted to the WaveForm DataBase (WFDB) format; environmental
    sensor data follow the NASA ASCII File Format Guidelines for Earth Science Data.
- preprocessing_details: >-
    The dataset is organized at the root level into one directory per datatype following the
    Clinical Dataset Structure (CDS) v0.1.1; within each datatype folder there is one folder per
    modality, within each modality folder one folder per device, and within each device folder
    one folder per participant named after the participant's study ID number. A manifest.tsv
    metadata file accompanies each datatype directory.
- preprocessing_details: >-
    Processing pipelines moved from custom and ad hoc handling in v1.0.0 to a combination of
    automated and custom processing from the year 2 data onward.
- preprocessing_details: >-
    No instances were excluded from the dataset at the time of preprocessing.

labeling_strategies:
- labeling_details: >-
    No labeling was performed. The dataset is hypothesis-agnostic and is aimed at facilitating
    multiple potential downstream AI/ML applications, so no explicit label or target is
    associated with each data instance, no gold-standard or proxy labels were computed, and no
    human labellers were engaged. No labeling software is therefore released, and the project
    does not provide formal guidelines for future researchers creating new labels or defining
    new tasks.

raw_sources:
- raw_data_details: >-
    Raw data are saved and expected to be preserved by the AI-READI project at least for the
    duration of the project, but are not anticipated to be shared outside the project team,
    because they have not been mapped to standardized terminologies and because the raw data may
    accidentally include personal health information or personally identifiable information, for
    example in free text fields. There is a possibility that raw data may be included in future
    releases of the controlled access dataset.

raw_data_sources:
- source_description: >-
    Electronic health records at the three recruiting health systems, screened for ICD-10
    diabetes and prediabetes diagnosis codes (R73.09 and E11.X) and demographic data to identify
    recruitment pools.
  source_type: Electronic health record screening
  access_details: >-
    Screening was performed within each site's health system; the resulting identifiers are not
    part of the released dataset.
- source_description: >-
    Device-native exports collected at the data sites before conversion, comprising ECG .xml from
    the Philips PageWriter TC30, MoCA Duo application .csv, Topcon Maestro2 and Triton .fda
    images, Heidelberg FLIO .sdt images, Garmin .FIT activity files, Dexcom G6 .csv glucose
    files and environmental sensor .csv files.
  raw_data_format: .xml, .csv, .fda, .sdt, .FIT
  source_type: Instrument and device native exports
  access_details: >-
    Data from the devices were exported in their raw format to local storage at each site,
    transformed from their proprietary state into a standard model format where required, and
    uploaded at regular intervals to FAIRhub.
- source_description: >-
    Participant-reported questionnaire responses captured in REDCap, covering screening
    eligibility, demographics, CES-D-10 depressive symptoms, Problem Areas in Diabetes (PAID-5),
    diabetes self-care score, dietary assessment, ophthalmic survey, smoking, alcohol, vaping and
    marijuana use, general health history, PhenX social determinants of health surveys, and
    current medications with RxNorm codes.
  source_type: Participant self-report
  raw_data_format: REDCap records
  notes: >-
    Marijuana use was not assessed for participants living in Alabama because it is an illegal
    substance there.
- source_description: >-
    Clinical laboratory results from whole blood, plasma, serum and urine specimens, analysed by
    CLIA-certified local laboratories (complete blood count) and by the University of Washington
    Nutrition and Obesity Research Center testing facility (all other assays).
  source_type: Clinical laboratory assay
  raw_data_format: .csv

variables:
- variable_name: HbA1c
  data_type: float
  unit: '%'
  minimum_value: 4.0
  maximum_value: 6.0
  measurement_technique: Whole blood assay at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: marker for diabetes.
- variable_name: Glucose
  data_type: float
  unit: mg/dL
  minimum_value: 62.0
  maximum_value: 125.0
  measurement_technique: Serum assay at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: marker for diabetes.
- variable_name: C peptide
  data_type: float
  unit: ng/mL
  minimum_value: 1.1
  maximum_value: 4.4
  measurement_technique: EDTA plasma assay at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: indicator of insulin
    production.
- variable_name: Insulin
  data_type: float
  unit: ng/mL
  minimum_value: 0.0
  maximum_value: 24.9
  measurement_technique: EDTA plasma assay at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: marker for diabetes.
- variable_name: N-terminal pro-B-type natriuretic peptide
  data_type: float
  unit: pg/mL
  measurement_technique: EDTA plasma assay at the University of Washington NORC laboratory
  notes: >-
    Reference range varies by age, so no fixed bounds are recorded. Rationale for inclusion:
    severity and outcome predictor of heart failure.
- variable_name: Troponin-T
  data_type: float
  unit: ng/L
  measurement_technique: EDTA plasma assay at the University of Washington NORC laboratory
  notes: >-
    Reference range differs by sex (female <11; male <16), so no single upper bound is recorded.
    Rationale for inclusion: marker of myocardial injury.
- variable_name: C reactive protein, high sensitivity
  data_type: float
  unit: mg/L
  minimum_value: 0.0
  maximum_value: 10.0
  measurement_technique: Serum assay at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: inflammation marker and
    risk factor for T2DM.
- variable_name: Total cholesterol
  data_type: float
  unit: mg/dL
  maximum_value: 200.0
  measurement_technique: Serum lipid panel at the University of Washington NORC laboratory
  notes: >-
    The reference range is given as <200 mg/dL; the maximum value records that upper reference
    bound, not an observed data extreme. Rationale for inclusion: cardiovascular disease risk
    factor.
- variable_name: High-density lipoprotein cholesterol
  data_type: float
  unit: mg/dL
  minimum_value: 39.0
  measurement_technique: Serum lipid panel at the University of Washington NORC laboratory
  notes: >-
    The reference range is given as >39 mg/dL; the minimum value records that lower reference
    bound, not an observed data extreme. Rationale for inclusion: cardiovascular disease risk
    factor.
- variable_name: Low-density lipoprotein cholesterol
  data_type: float
  unit: mg/dL
  maximum_value: 130.0
  derivation: Calculated
  measurement_technique: Serum lipid panel at the University of Washington NORC laboratory
  notes: >-
    The reference range is given as <130 mg/dL; the maximum value records that upper reference
    bound, not an observed data extreme. Rationale for inclusion: cardiovascular disease risk
    factor.
- variable_name: Triglycerides
  data_type: float
  unit: mg/dL
  maximum_value: 150.0
  measurement_technique: Serum lipid panel at the University of Washington NORC laboratory
  notes: >-
    The reference range is given as <150 mg/dL; the maximum value records that upper reference
    bound, not an observed data extreme. Rationale for inclusion: cardiovascular disease risk
    factor.
- variable_name: Blood urea nitrogen
  data_type: float
  unit: mg/dL
  minimum_value: 8.0
  maximum_value: 21.0
  measurement_technique: Serum assay at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: marker for kidney and
    liver function.
- variable_name: Creatinine
  data_type: float
  unit: mg/dL
  measurement_technique: Serum assay at the University of Washington NORC laboratory
  notes: >-
    Reference range differs by sex (female 0.38-1.02; male 0.51-1.18 mg/dL), so no single pair of
    bounds is recorded. Rationale for inclusion: marker for kidney function.
- variable_name: Sodium
  data_type: float
  unit: mEq/L
  minimum_value: 135.0
  maximum_value: 145.0
  measurement_technique: Serum electrolyte panel at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: marker of metabolic
    health.
- variable_name: Potassium
  data_type: float
  unit: mEq/L
  minimum_value: 3.6
  maximum_value: 5.2
  measurement_technique: Serum electrolyte panel at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: marker of metabolic
    health.
- variable_name: Albumin
  data_type: float
  unit: g/dL
  minimum_value: 3.5
  maximum_value: 5.2
  measurement_technique: Serum assay at the University of Washington NORC laboratory
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: useful tool for overall
    health status.
- variable_name: Haemoglobin
  data_type: float
  unit: g/dL
  minimum_value: 11.1
  maximum_value: 17.7
  measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory
    local to the data collection site
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: useful tool for overall
    health status.
- variable_name: Platelets
  data_type: float
  unit: x10E3/uL
  minimum_value: 150.0
  maximum_value: 450.0
  measurement_technique: Complete blood count on fresh whole blood at a CLIA-certified laboratory
    local to the data collection site
  notes: >-
    The minimum and maximum values record the reference range provided by the testing
    laboratories, not observed data extremes. Rationale for inclusion: useful tool for overall
    health status.
- variable_name: Urine albumin
  data_type: float
  unit: mg/dL
  measurement_technique: Urine assay at the University of Washington NORC laboratory
  notes: >-
    No reference range is given by the source. Rationale for inclusion: urinary biomarker for
    early diabetic nephropathy.
- variable_name: Urine creatinine
  data_type: float
  unit: mg/dL
  measurement_technique: Urine assay at the University of Washington NORC laboratory
  notes: >-
    No reference range is given by the source. Rationale for inclusion: urinary biomarker for
    early diabetic nephropathy.
- variable_name: Montreal Cognitive Assessment total score
  data_type: integer
  minimum_value: 0.0
  maximum_value: 30.0
  measurement_technique: MoCA Duo application administered on an iPad by research staff
  notes: >-
    The total possible score is 30, with higher numbers representing better performance. A final
    total score of 26 and above is considered normal; anything below 24 is a sign of cognitive
    impairment. Section subscores, a Memory Index Score and task completion times are also
    recorded.
- variable_name: Continuous glucose monitor blood glucose
  data_type: float
  unit: mg/dL
  measurement_technique: Dexcom G6 continuous glucose monitor, readings every 5 minutes over a
    10-day wear period
- variable_name: Best-corrected visual acuity (logMAR)
  data_type: float
  measurement_technique: >-
    M&S Technologies Electronic Visual Acuity tester at 4 metres, measured separately for the
    right and left eye under photopic conditions and, through a 2.0 neutral density filter, under
    mesopic conditions
  notes: >-
    Expressed as the logarithm of the minimum angle of resolution; lower numbers are better
    resolution. Snellen visual acuity variables were dropped in this version of the dataset, so
    only logMAR measurements are available.
- variable_name: Letter contrast sensitivity (log CS)
  data_type: float
  measurement_technique: >-
    Mars Letter Contrast Sensitivity chart read monocularly at approximately 50 cm under photopic
    conditions and, through a neutral density occluder, under mesopic conditions
  notes: >-
    Expressed as log sensitivity, with higher numbers meaning better sensitivity. Scoring
    multiplies the number of errors prior to the final correct letter by 0.04 and subtracts the
    result from the log CS value at the final correct letter.

