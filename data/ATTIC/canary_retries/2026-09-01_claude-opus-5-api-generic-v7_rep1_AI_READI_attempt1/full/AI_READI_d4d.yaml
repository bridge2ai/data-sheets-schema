notes: >-
  The dataset carries the alternative title "AI-READI dataset". A smaller "mini" version of the
  release is made available for pipeline development. The parent study is registered on
  ClinicalTrials.gov as NCT06002048 under the official title "AI Ready and Exploratory Atlas
  for Diabetes Insights". The publisher slot is left unpopulated because the sources that name
  a publisher disagree and neither supplies a registry identifier: the FAIRhub structured
  metadata gives publisherName "FAIRhub", while the RO-Crate gives publisher "AI-READI
  Consortium".
source_caveats: >-
  Sources in the bundle disagree on several points. (1) Publisher: the FAIRhub structured
  metadata (tier 1) gives publisherName "FAIRhub", while the RO-Crate metadata (tier 1) gives
  publisher "AI-READI Consortium"; the two sources share a tier, so the disagreement is not
  settled by ranking and the publisher slot is left unpopulated rather than resolved silently.
  (2) Institutional attribution: the FAIRhub metadata and RO-Crate name "Washington University
  in St. Louis" as managing organization/lead sponsor and "Washington University IRB" as the
  review board, yet the RO-Crate gives that IRB a University of Washington Human Subjects
  Division postal address and a uw.edu contact, and the BMJ Open protocol (tier 3) states
  approval by "the Institutional Review Board (IRB) of the University of Washington".
  (3) Enrollment start: the FAIRhub metadata gives 2023-07-19 while the BMJ Open protocol states
  "Enrolment began on 18 July 2023". (4) Target enrollment: the FAIRhub study description and
  BMJ Open protocol give 4,000 participants, while the IRB protocol document states 4,600.
  (5) De-identification: the FAIRhub metadata sets deIdentType to "NoDeIdentification" while
  simultaneously setting deIdentHIPAA to true and explaining that no identifiers were collected,
  so no active de-identification was necessary. (6) The variables slot below transcribes a
  selection of the analytes and instrument measures the BMJ Open protocol tabulates; that source
  lists roughly forty laboratory analytes in total, so the variable list in this record is
  partial rather than exhaustive.

