id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset is a multimodal, AI-ready dataset collected from individuals with and
  without type 2 diabetes mellitus (T2DM) and harmonized across three data collection sites in
  the United States. Version 3.0.0 contains data from 2,280 participants collected between
  July 19, 2023 and May 1, 2025. Data from multiple modalities are included: survey and clinical
  data mapped to the OMOP Common Data Model, 12-lead electrocardiography, retinal photography,
  optical coherence tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging
  ophthalmoscopy (FLIO), continuous glucose monitoring, wearable physical activity monitoring,
  and home environmental sensor measurements. The composition of the dataset was designed with
  future studies using AI/machine learning in mind, including recruitment sampling procedures
  aimed at achieving approximately equal distribution of participants across diabetes severity.
  The data in this public release contain no protected health information; information related
  to the sex and race/ethnicity of the participants as well as medication used has been removed.
