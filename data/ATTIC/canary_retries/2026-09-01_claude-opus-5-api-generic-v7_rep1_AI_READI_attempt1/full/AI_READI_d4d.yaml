purposes:
- response: >-
    To create and share a flagship, ethically sourced dataset that enables future generations of
    artificial intelligence/machine learning research to provide critical insights into type 2
    diabetes mellitus, including salutogenic pathways to return to health.
- response: >-
    To provide a multimodal dataset gathered specifically to facilitate downstream pseudo-time
    manifold analysis, an approach used to predict disease trajectories by learning from complex
    multimodal data from participants with differing disease severity.
- response: >-
    To develop a foundational dataset in type 2 diabetes, agnostic to existing classification
    criteria or biases, which can be used to reconstruct a temporal atlas of T2DM development
    and reversal towards health.
- response: >-
    To establish standards, best practices and guidelines for the collection, preparation and
    sharing of data for the purposes of AI/ML, including guidance from bioethicists, so that the
    approach can serve as a model for other data generation projects.

addressing_gaps:
- response: >-
    A major barrier to AI in healthcare research has been the lack of diverse datasets that are
    AI ready for training AI models; the AI-READI dataset is intended to fill this gap.
- response: >-
    The ability to understand and affect the course of complex, multi-organ diseases such as
    T2DM has been limited by a lack of well-designed, high quality, large, and inclusive
    multimodal datasets.
- response: >-
    A meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020
    indicated that samples lacked racial and ethnic diversity; the cohort is designed to be
    balanced across race/ethnicity, diabetes severity and biological sex rather than mirroring
    the demographic distribution of the US population.
- response: >-
    The protocol enables analyses across many health domains that may not be feasible with
    existing data sources such as claims or electronic health records data.

tasks:
- response: >-
    Pseudo-time manifold analysis to predict disease trajectories from normal to
    insulin-dependent type 2 diabetes mellitus.
- response: >-
    Study of salutogenesis, the pathway from type 2 diabetes back to health, as the complement
    to studying pathogenesis.
- response: >-
    Development of multimodal AI/ML models that integrate survey, clinical, imaging, waveform,
    wearable and environmental data for a single cohort.

intended_uses:
- use_category: Artificial intelligence and machine learning research on type 2 diabetes
  usage_notes: >-
    Access to the public release is conditional on agreeing to use the data only for type 2
    diabetes related research.
  examples:
  - Training and evaluating multimodal AI/ML models of T2DM severity and salutogenesis
  - Pseudo-time manifold analysis of disease trajectories
- use_category: Methodological and commercial reuse under the custom license
