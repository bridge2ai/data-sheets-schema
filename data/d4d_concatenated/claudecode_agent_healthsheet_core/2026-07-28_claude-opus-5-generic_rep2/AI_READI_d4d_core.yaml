instances:
- name: Individual participant
  instance_type: individual patient
  counts: 2280
  label: false
  description: >-
    Each instance represents an individual patient. Each instance consists of all of the data
    available for an individual participating in the study. Multiple modalities of data are
    collected for each participant, including survey data, clinical data, retinal imaging
    data, environmental sensor data, continuous glucose monitor data, and wearable activity
    monitor data. These encompass tabular data, imaging data, and physiological signal/waveform
    data. There is no unstructured text data included in this dataset. There are 2280 instances
    in this current version of the dataset (version 3, released fall 2025). The first version
    of the dataset had 204 instances and the second version had 1067 instances. The exact
    forms used for data collection in REDCap are available at https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf,
    and all modalities, file formats, and devices are detailed in the dataset documentation
    at https://docs.aireadi.org/.
  label_description: >-
    No labels are provided. No explicit label or target is associated with each data instance,
    in either the preliminary dataset or the current version.
  missing_information:
  - name: Modality coverage gaps for individual participants
    missing:
    - Data for one or more modalities for some participants
    why_missing:
    - Some participants elected not to participate in some study elements.
    - >-
      In a few cases, the data collection device did not have any stored results or was returned
      too late to retrieve the results (e.g. battery died, data was lost).
    - >-
      In a few cases, there may have been a data collision at some point in the process and
      data has been lost.
anomalies:
- name: Survey data anomalies
  anomaly_details:
  - In cases of survey data, skipped questions or incomplete responses are expected.
- name: Wearable and sensor device anomalies
  anomaly_details:
  - >-
    In cases of using wearables, improper use, technical failure such as battery failure or
    system malfunction are expected.
- name: Imaging data anomalies
  anomaly_details:
  - >-
    In cases of imaging data, patient uncooperation, noise that may obscure the images and
    technical failure such as system malfunction, and data transfer failures are expected.
  - >-
    For undilated handheld fundus photography (Optomed Aurora), it becomes challenging to
    get a good view because patients are not dilated and the imaging modality is handheld,
    so the quality of the images varies from patient to patient and within the same patient.
  - >-
    For the Spectralis HRA, the machine is operated by the imaging team and is not fully automated,
    so quality issues may arise, which may lead to skipping this modality and missing data.
  - >-
    FLIO takes longer than a usual Spectralis OCT and exposes patients to uncomfortable levels
    of light, so it is performed as the last modality of a visit; because of this, patients
    may not be at their best possible compliance.
known_biases:
- name: Incomplete demographic balance during ongoing enrollment
  bias_type: representation_bias
  bias_description: >-
    The overall enrollment goal is to have balanced distribution between different racial
    groups. As enrollment is ongoing, the periodic updates to data releases may not have achieved
    balanced distribution across groups. While the AI-READI cross-sectional database ultimately
    aims to achieve balance across race/ethnicity, biological sex, and diabetes presence and
    severity, the pilot study is not balanced across these parameters.
  mitigation_strategy: >-
    Recruitment sampling procedures aimed at achieving approximately equal distribution of
    participants across sex, race, and diabetes severity, and the project team has prepared
    recommended data splits balanced as well as possible for sex, race/ethnicity and diabetes
    status.
- name: Recruitment setting and site selection
  bias_type: selection_bias
  bias_description: >-
    Recruitment was predominantly urban and hospital-based, which may not fully capture diverse
    cultural and socioeconomic backgrounds. Recruitment pools were identified by screening
    Electronic Health Records for diabetes and prediabetes ICD-10 codes for all patients who
    had an encounter with the sites' health systems within the past 2 years.
  mitigation_strategy: >-
    Three recording sites were strategically selected to achieve diverse recruitment: the
    University of Alabama at Birmingham (UAB), the University of California San Diego (UCSD),
    and the University of Washington (UW). The sites were chosen for geographic diversity
    across the United States and to ensure diverse representation across various racial and
    ethnic groups. Individuals from all demographic backgrounds were recruited at all 3 sites.
    Uniform data collection protocols were implemented for all subjects, irrespective of their
    race/ethnicity, biological sex, or diabetes severity, across all study sites.
- name: Population groups not represented in the cohort
  bias_type: representation_bias
  bias_description: >-
    The study cohort may not provide a comprehensive representation of the population, as
    it does not include other races/ethnicities such as Pacific Islanders and Native Americans.
known_limitations:
- name: Eligibility criteria restrict the represented population
  limitation_type: coverage_limitation
  limitation_description: >-
    Participants had to be able to provide consent, be 40 years of age or older, and be able
    to speak and read English. Persons who were pregnant, had gestational diabetes, or had
    Type 1 diabetes were excluded. English language was used for communication with study
    participants.
  scope_impact: >-
    Findings and models derived from the dataset apply to an adult, English-speaking population
    with or without type 2 diabetes, and not to Type 1 or gestational diabetes.
- name: Recruitment setting limits generalization
  limitation_type: representativeness_limitation
  limitation_description: >-
    Factors influencing the generalization of derived models include the predominantly urban
    and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
    backgrounds.
  recommended_mitigation: >-
    Information on device make and model, including specific modalities like macula scans
    or wide scans during OCT, was documented to ensure repeatability, and the study included
    multiple devices for one measure to enhance generalizability and represent the diverse
    range of equipment utilized in clinical settings.
- name: Single visit per participant
  limitation_type: scope_limitation
  limitation_description: >-
    There is currently only one visit per participant. Approximately 4% of participants are
    expected to undergo a follow-up examination in Year 4 of the project.
- name: Fixed collection window for this version
  limitation_type: temporal_limitation
  limitation_description: >-
    For this version of the dataset, the timeframe for data collection was July 19, 2023 to
    May 01, 2025. The dataset is released as static versions and this version will not be
    updated in place.
- name: Variable image quality from operator- and patient-dependent modalities
  limitation_type: methodological_limitation
  limitation_description: >-
    Image quality varies for handheld undilated fundus photography, for the operator-driven
    Spectralis HRA, and for FLIO, which is performed last in the visit and can reduce patient
    compliance. These factors can lead to noise, skipped modalities, and missing data.
- name: Snellen visual acuity variables removed in this version
  limitation_type: integration_limitation
  limitation_description: >-
    The data fields/types are largely the same as the prior version of the dataset. However,
    the Snellen visual acuity variables were dropped in this version of the dataset, such
    that now only logMAR visual acuity measurements are available.
  scope_impact: >-
    Analyses that depend on Snellen visual acuity values cannot be carried across versions
    of the dataset.
- name: No formal external audit
  limitation_type: methodological_limitation
  limitation_description: >-
    The dataset has not undergone any formal external audits. However, the dataset has been
    reviewed internally by AI-READI team members for quality checks and to ensure that no
    personally identifiable information was accidentally included.
