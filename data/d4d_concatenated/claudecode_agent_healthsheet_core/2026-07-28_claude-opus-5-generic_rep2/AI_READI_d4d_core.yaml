  Released as static versions. This is the third version of the dataset, distributed in November
  2025, containing data collected between July 19, 2023 and May 1, 2025. New versions are
  planned approximately once a year as enrollment continues.
conforms_to: >-
  Data were mapped to standardized terminologies where possible, including the Observational
  Medical Outcomes Partnership (OMOP) Common Data Model for observational health data and
  Digital Imaging and Communications in Medicine (DICOM) for medical imaging data.
