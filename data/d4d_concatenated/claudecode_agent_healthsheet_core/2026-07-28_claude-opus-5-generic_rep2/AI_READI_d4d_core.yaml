purposes:
- name: Enable AI/ML research into type 2 diabetes and salutogenesis
  response: >-
    The purpose for creating the dataset was to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM),
    including salutogenic pathways to return to health. T2DM is a growing public health threat.
    Yet, the current understanding of T2DM, especially in the context of salutogenesis, is
    limited. Given the complexity of T2DM, AI-based approaches may help with improving our
    understanding but a key issue is the lack of data ready for training AI models.
- name: Understand the pathway from disease to health in T2DM
  response: >-
    The goal is to better understand salutogenesis (the pathway from disease to health) in
    type 2 diabetes mellitus. The composition of the dataset was designed with future studies
    using AI/machine learning in mind, including a data acquisition protocol across multiple
    domains to enable downstream AI/ML analyses that may not be feasible with existing data
    sources such as claims or electronic health records data.
tasks:
- name: Downstream pseudotime manifold analysis and AI applications
  response: >-
    The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence. The data collection process
    is specifically tailored to enable downstream pseudotime manifold analysis - an approach
    used to predict disease trajectories - by gathering and learning from complex, multimodal
    data from participants exhibiting varying disease severity, ranging from normal to insulin-dependent
    T2DM.
- name: Hypothesis-agnostic dataset without predefined tasks or labels
  response: >-
    No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
    dataset aimed at facilitating multiple potential downstream AI/ML applications. This version
    of the dataset does not introduce new tasks or labeling, but it does include a new recommended
    data split.
addressing_gaps:
- name: Lack of AI-ready data for type 2 diabetes
  response: >-
    Given the complexity of T2DM, AI-based approaches may help with improving our understanding,
    but a key issue is the lack of data ready for training AI models. The AI-READI dataset
    is intended to fill this gap.
