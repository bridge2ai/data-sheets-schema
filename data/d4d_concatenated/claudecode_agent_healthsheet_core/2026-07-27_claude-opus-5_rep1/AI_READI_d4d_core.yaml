informed_consent:
- id: https://doi.org/10.60775/fairhub.3#informed-consent
  name: Informed consent procedures
  consent_obtained: true
  description: Consent procedures documented for the study.
  consent_type:
  - Informed consent to participate, required before participation in any part of the protocol (including
    questionnaires).
  - Electronic consent (e-consent) with an electronic signature, available to potential participants before
    their visit without verbal communication with a clinical research coordinator.
  consent_documentation:
  - The approved consent form for the principal project site University of Washington is available at
    https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
  - Participants may access e-consent documentation in REDCap.
  - The other clinical sites had IRB reliance and used the same consent form, with minor institution-specific
    language incorporated depending on individual institutional requirements.
  withdrawal_mechanism:
  - Participants were permitted to withdraw consent at any time and cease study participation.
  - Any data that had been shared or used up to that point would stay in the dataset; this is clearly
    communicated in the consent document.
  consent_scope:
  - Consent covered collection and use of participant data for the AI-READI study.
  - Participants may access e-consent documentation in REDCap and decide at that point they do not want
    to participate or would like additional information.
