  name: Version history and access
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  description: The dataset gets released as static versions. This is the third version of the dataset.
  versions_available:
  - Version 1 - data collected during the pilot data collection phase; 204 participants; distributed in
    May 2024; datasheet at https://docs.aireadi.org/docs/1/dataset/healthsheet.
  - Version 2 - data collected up to the end of the first full year of the study; 1067 participants in
    total; distributed in November 2024; datasheet at https://docs.aireadi.org/docs/2/dataset/healthsheet.
  - Version 3 - data collected up through the end of the second year of the study, between July 19, 2023
    and May 1st, 2025; 2280 participants in total; distributed in November 2025; the version described
    by this record.
  version_details:
  - This datasheet is created for the third version of the dataset.
  - The current version of the dataset includes data from the second year of the study, rather than only
    the data collected from the pilot data collection phase (which comprised the first version of the
    dataset) and the first year of the study (which comprised the second version of the dataset).
  - This version has more subjects/patients represented in the data - the first version of the dataset
    contains data from 204 participants, the second version contains additional data from 863 participants
    for a total of 1067 participants, and this version contains a total of 2280 participants.
  - The data fields/types are largely the same as the prior version of the dataset. However, the Snellen
    visual acuity variables were dropped in this version of the dataset, such that now only logMAR visual
    acuity measurements are available.
  - This datasheet does not include new tasks or labeling. It does include a new recommended data split
    for the 2280 participants balancing training, validation, and testing sets for age, sex, races/ethnicities,
    and study group.
  - The Healthsheet answers "No" to awareness of any widespread version or subversion of the dataset addressing
    a particular task or application.
  - Regarding continued support of older versions, the Healthsheet answers "N/A - the dataset will not
    be updated. Rather, new versions of the dataset will be released with additional instances as more
    study participants are enrolled."
extension_mechanism:
  id: https://doi.org/10.60775/fairhub.3#extension-mechanism
  name: Mechanism for external contributions
  description: Whether others can extend, augment, build on, or contribute to the dataset.
  extension_details:
  - No, currently there is no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.
