purposes:
- id: https://doi.org/10.60775/fairhub.3#purpose-ai-ready-t2dm
  name: Enable AI/ML research into type 2 diabetes and salutogenesis
  description: Primary stated purpose for creating the dataset.
  response: The purpose for creating the dataset was to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including
    salutogenic pathways to return to health. T2DM is a growing public health threat. Yet, the current
    understanding of T2DM, especially in the context of salutogenesis, is limited. Given the complexity
    of T2DM, AI-based approaches may help with improving our understanding but a key issue is the lack
    of data ready for training AI models. The AI-READI dataset is intended to fill this gap.
- id: https://doi.org/10.60775/fairhub.3#purpose-balanced-multimodal-design
  name: Provide a balanced, multimodal, AI-ready data resource
  description: 'Design intent stated in the dataset summary: the composition of the dataset was designed
    with future studies using AI/Machine Learning in mind.'
  response: The composition of the dataset was designed with future studies using AI/Machine Learning
    in mind. This included recruitment sampling procedures aimed at achieving approximately equal distribution
    of participants across sex, race, and diabetes severity, as well as the design of a data acquisition
    protocol across multiple domains (survey data, physical measurements, clinical data, imaging data,
    wearable device data, etc.) to enable downstream AI/ML analyses that may not be feasible with existing
    data sources such as claims or electronic health records data. The goal is to better understand salutogenesis
    (the pathway from disease to health) in T2DM.
tasks:
- id: https://doi.org/10.60775/fairhub.3#task-pseudotime-manifold
  name: Pseudotime manifold analysis and artificial intelligence applications
  description: Stated downstream analytical target for which the multimodal data were gathered.
  response: The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence. The data collection process is specifically
    tailored to enable downstream pseudotime manifold analysis - an approach used to predict disease trajectories.
    This involves gathering and learning from complex, multimodal data from participants exhibiting varying
    disease severity, ranging from normal to insulin-dependent Type 2 Diabetes Mellitus (T2DM).
- id: https://doi.org/10.60775/fairhub.3#task-no-predefined-task
  name: No predefined labeled task
  description: The Healthsheet states that no labels are provided and no specific labeling was performed,
    because the dataset is hypothesis-agnostic.
  response: No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
    dataset aimed at facilitating multiple potential downstream AI/ML applications. This datasheet does
    not include new tasks or labeling. It does include a new recommended data split for the 2280 participants
    balancing training, validation, and testing sets for age, sex, races/ethnicities, and study group.
