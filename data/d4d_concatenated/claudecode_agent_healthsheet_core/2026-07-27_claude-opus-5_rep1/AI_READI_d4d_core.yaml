anomalies:
- id: https://doi.org/10.60775/fairhub.3#anomaly-expected-noise-sources
  name: Expected sources of noise and error by modality
  description: Errors, sources of noise, or redundancies anticipated across the collected modalities.
  anomaly_details:
  - In cases of survey data, skipped questions or incomplete responses are expected.
  - In cases of using wearables, improper use, technical failure such as battery failure or system malfunction
    are expected.
  - In cases of imaging data, patient uncooperation, noise that may obscure the images and technical failure
    such as system malfunction, and data transfer failures are expected.
- id: https://doi.org/10.60775/fairhub.3#anomaly-device-dependent-image-quality
  name: Device- and operator-dependent image quality variation
  description: Image quality variability documented in the Healthsheet's device descriptions.
  anomaly_details:
  - Undilated handheld fundus photography (Optomed Aurora IQ) is challenging because patients are not
    dilated and the camera is handheld, so the quality of the images varies from patient to patient and
    within the same patient.
  - The Heidelberg Spectralis HRA+OCT is operated by the imaging team and is not fully automated, so quality
    issues may arise, which may lead to skipping this modality and missing data.
  - FLIO takes longer than a usual Spectralis OCT and exposes patients to uncomfortable levels of light,
    so it is performed as the last modality of a visit; because of this patients may not be at their best
    possible compliance.
known_biases:
- id: https://doi.org/10.60775/fairhub.3#bias-racial-ethnic-representation
  name: Incomplete racial and ethnic representation
  bias_type: representation_bias
  bias_description: The study cohort may not provide a comprehensive representation of the population,
    as it does not include other races/ethnicities such as Pacific Islanders and Native Americans. While
    the AI-READI cross-sectional database ultimately aims to achieve balance across race/ethnicity, biological
    sex, and diabetes presence and severity, the pilot study is not balanced across these parameters.
    As enrollment is ongoing, the periodic updates to data releases may not have achieved balanced distribution
    across groups.
  mitigation_strategy: 'Three recording sites were strategically selected to achieve diverse recruitment:
    the University of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and
    the University of Washington (UW). The sites were chosen for geographic diversity across the United
    States and to ensure diverse representation across various racial and ethnic groups. Individuals from
    all demographic backgrounds were recruited at all 3 sites. Uniform data collection protocols were
    implemented for all subjects, irrespective of their race/ethnicity, biological sex, or diabetes severity,
    across all study sites.'
- id: https://doi.org/10.60775/fairhub.3#bias-urban-hospital-recruitment
  name: Urban, hospital-based recruitment
  bias_type: selection_bias
  bias_description: Factors influencing the generalization of derived models include the predominantly
    urban and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
    backgrounds. Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes
    and prediabetes ICD-10 codes for all patients who have had an encounter with the sites' health systems
    within the past 2 years.
  mitigation_strategy: The selection of study sites was intended to ensure equitable representation and
    minimize the potential for sampling bias.
- id: https://doi.org/10.60775/fairhub.3#bias-device-heterogeneity
  name: Device and acquisition heterogeneity across sites
  bias_type: measurement_bias
  bias_description: Multiple makes and models of device were used for several measures across the three
    data acquisition sites (for example three different blood pressure monitors and three different lensometers),
    and several imaging modalities are operator-dependent, which may introduce device- and operator-related
    variation in derived models.
  mitigation_strategy: Information on device make and model, including specific modalities like macula
    scans or wide scans during OCT, were documented to ensure repeatability. Moreover, the study included
    multiple devices for one measure to enhance generalizability and represent the diverse range of equipment
    utilized in clinical settings.
known_limitations:
- id: https://doi.org/10.60775/fairhub.3#limitation-eligibility-scope
  name: Restricted eligibility population
  limitation_type: scope_limitation
  limitation_description: Participation required the ability to provide consent, an age of 40 years or
    older, and the ability to speak and read English; persons who were pregnant, who had gestational diabetes,
    or who had Type 1 diabetes were excluded. The dataset therefore describes adults aged 40 and over
    with or without type 2 diabetes.
  scope_impact: Findings and models derived from the dataset are scoped to English-speaking adults aged
    40 and over recruited at three United States sites.
- id: https://doi.org/10.60775/fairhub.3#limitation-modality-coverage
  name: Incomplete modality coverage per participant
  limitation_type: coverage_limitation
  limitation_description: Not all modalities are available for all participants. Some participants elected
    not to participate in some study elements. In a few cases, the data collection device did not have
    any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost).
    In a few cases, there may have been a data collision at some point in the process and data has been
    lost.
  scope_impact: Analyses requiring complete multimodal coverage will be restricted to the subset of participants
    for whom the required modalities are present.
- id: https://doi.org/10.60775/fairhub.3#limitation-cross-sectional
  name: Single visit per participant
  limitation_type: temporal_limitation
  limitation_description: There is currently only one visit per participant, and the database is described
    as cross-sectional. Approximately 4% of participants are expected to undergo a follow-up examination
    in Year 4 of the project.
  scope_impact: Longitudinal within-participant analyses are not supported by this version of the dataset.
- id: https://doi.org/10.60775/fairhub.3#limitation-representativeness
  name: Limited representativeness of the study cohort
  limitation_type: representativeness_limitation
  limitation_description: The study cohort may not provide a comprehensive representation of the population,
    as it does not include other races/ethnicities such as Pacific Islanders and Native Americans, and
    recruitment was predominantly urban and hospital-based, which may not fully capture diverse cultural
    and socioeconomic backgrounds.
  recommended_mitigation: The project team recommends the published 70%/15%/15% data split, whose validation
    and test sets are balanced as far as possible for sex, race/ethnicity and diabetes status, as a means
    of reducing disparities in models developed using this dataset.
- id: https://doi.org/10.60775/fairhub.3#limitation-dropped-variables
  name: Snellen visual acuity variables dropped in this version
  limitation_type: integration_limitation
  limitation_description: The data fields/types are largely the same as the prior version of the dataset.
    However, the Snellen visual acuity variables were dropped in this version of the dataset, such that
    now only logMAR visual acuity measurements are available.
  scope_impact: Analyses that depend on Snellen visual acuity values cannot be reproduced against this
    version using the same fields as earlier versions.
