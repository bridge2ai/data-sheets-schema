instances:
- id: https://doi.org/10.60775/fairhub.3#instance-participant
  name: Individual study participant
  instance_type: Individual patient (study participant)
  counts: 2280
  label: false
  label_description: N/A - no labels are provided. No specific labeling was performed in the dataset,
    as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream
    AI/ML applications.
  description: Each instance represents an individual patient, and consists of all of the data available
    for an individual participating in the study. There are 2280 instances in this current version of
    the dataset (version 3, released fall 2025). Multiple modalities of data are collected for each participant,
    including survey data, clinical data, retinal imaging data, environmental sensor data, continuous
    glucose monitor data, and wearable activity monitor data. These encompass tabular data, imaging data,
    and physiological signal/waveform data. There is no unstructured text data included in this dataset.
