intended_uses:
- id: https://doi.org/10.60775/fairhub.3#intended-use-ai-ml
  name: AI/ML research on type 2 diabetes and salutogenesis
  description: Applications the dataset is meant to address.
  examples:
  - Future generations of artificial intelligence/machine learning (AI/ML) research providing critical
    insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways to return to health.
  - Downstream pseudotime manifold analysis - an approach used to predict disease trajectories - across
    participants exhibiting varying disease severity, from normal to insulin-dependent T2DM.
  - Downstream AI/ML analyses that may not be feasible with existing data sources such as claims or electronic
    health records data.
  use_category:
  - Research
  - Artificial intelligence and machine learning
  usage_notes: Use of the dataset requires citation to the resources specified in https://docs.aireadi.org.
    Some data that are not considered to be sensitive personal health data are available to the public
    for download upon agreement with a license that defines how the data can be used; the full dataset
    is accessible by entering into a data use agreement. The recommended 70%/15%/15% training/validation/testing
    split is provided to reduce disparities in models developed using this dataset.
