future_use_impacts:
- id: https://doi.org/10.60775/fairhub.3#future-use-impacts
  name: Anticipated impacts on future uses
  description: Aspects of composition, collection, and processing that might impact future uses.
  impact_details:
  - To the extent of the creators' knowledge, they do not currently anticipate any uses of the dataset
    that could result in unfair treatment or harm. However, there is a theoretical risk of future re-identification.
  - As enrollment is ongoing, the periodic updates to data releases may not have achieved balanced distribution
    across groups.
  - Because sex, race, and ethnicity data are not being released with the public version of the dataset,
    the project team has prepared recommended data splits whose validation and test sets are balanced
    as well as possible for sex, race/ethnicity and diabetes status, aimed at reducing disparities in
    models developed using this dataset.
