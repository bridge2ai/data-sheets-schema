- id: https://doi.org/10.60775/fairhub.3#mechanism-cgm-dexcom-g6
  name: Continuous glucose monitor (Dexcom G6)
  description: Continuous glucose monitoring.
  mechanism_details:
  - The Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM) that directly
    monitors blood glucose levels without requiring finger sticks. It must be worn continuously in order
    to collect data.
- id: https://doi.org/10.60775/fairhub.3#mechanism-accelerometer-garmin
  name: Wearable accelerometer / physical activity monitor (Garmin Vivosmart 5)
  description: Physical activity measurement.
  mechanism_details:
  - The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure data related to physical activity.
- id: https://doi.org/10.60775/fairhub.3#mechanism-blood-pressure
  name: Blood pressure monitors
  description: Blood pressure measurement across the data acquisition sites.
  mechanism_details:
  - 'Blood pressure devices used for the study across the various data acquisition sites are: OMRON HEM
    907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor, and Welch
    Allyn 6000 series Vital signs monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff.'
  - Heart rate can be read from EKG or blood pressure measurement devices.
- id: https://doi.org/10.60775/fairhub.3#mechanism-ekg
  name: EKG (Philips PageWriter TC30 Cardiograph)
  description: Electrocardiography.
  mechanism_details:
  - Philips (manufacturer of Pagewriter TC30 Cardiograph).
  - Heart rate can be read from EKG or blood pressure measurement devices.
- id: https://doi.org/10.60775/fairhub.3#mechanism-visual-acuity
  name: Visual acuity (M&S Technologies EVA)
  description: Photopic and mesopic visual acuity testing.
  mechanism_details:
  - M&S Technologies EVA device to test visual acuity. The test is administered at a distance of 4 meters
    from a touch-screen monitor that is 12x20 inches. Participants will read letters from the screen.
  - 'Photopic Conditions: No neutral density filters are used. A general occluder will be used for photopic
    testing. The participant wears their own prescription spectacles or trial frames.'
  - For Mesopic conditions, a neutral density (ND) filter will be used. The ND filter will either be a
    lens added to trial frames to reduce incoming light on the tested eye, OR a handheld occluder with
    a neutral density filter (which we will designate as "ND-occluder") over the glasses will be used.
    The ND-occluder is different from a standard occluder and is used only for vision testing under mesopic
    conditions.
- id: https://doi.org/10.60775/fairhub.3#mechanism-contrast-sensitivity
  name: Contrast sensitivity (MARS Letter Contrast Sensitivity test, Perceptrix)
  description: Monocular contrast sensitivity testing under photopic and mesopic conditions.
  mechanism_details:
  - The MARS Letter Contrast Sensitivity test (Perceptrix) was conducted monocularly under both Photopic
    conditions (with a general occluder) and Mesopic conditions (using a Neutral Density occluder with
    a low luminance filter lens).
  - 'The standardized order of MARS cards was as follows: Photopic OD, Photopic OS, Mesopic OD, and Mesopic
    OS.'
  - The background luminance of the charts fell within the range of 60 to 120 cd/m2, with an optimal level
    of 85 cd/m2. Illuminance was recommended to be between 189 to 377 lux, with an optimal level of 267
    lux. While the designed viewing distance was 50 cm, it could vary between 40 to 59 cm.
  - 'Patients were required to wear their appropriate near correction: reading glasses or trial frames
    with +2.00D lenses. All testing was carried out under undilated conditions.'
  - Patients were instructed to read the letter left to right across each line on the chart. Patients
    were encouraged to guess, even if they perceived the letters as too faint. Testing was terminated
    either when the patient made two consecutive errors or reached the end of the chart.
  - The log contrast sensitivity (log CS) values were recorded by multiplying the number of errors prior
    to the final correct letter by 0.04 and subtracting the result from the log CS value at the final
    correct letter. If a patient reached the end of the chart without making two consecutive errors, the
    final correct letter was simply the last one correctly identified.
- id: https://doi.org/10.60775/fairhub.3#mechanism-autorefraction
  name: Autorefraction (KR 800 Auto Keratometer/Refractor)
  description: Autorefraction and keratometry.
  mechanism_details:
  - KR 800 Auto Keratometer/Refractor.
- id: https://doi.org/10.60775/fairhub.3#mechanism-lensometer
  name: Lensometry
  description: Measurement of participants' existing spectacle prescriptions.
  mechanism_details:
  - 'Lensometer devices used at data acquisition sites across the study include: NIDEK LM-600P Auto Lensometer,
    Topcon-CL-200 computerized Lensometer, and Topcon-CL-300 computerized Lensometer.'
- id: https://doi.org/10.60775/fairhub.3#mechanism-fundus-optomed
  name: Undilated fundus photography (Optomed Aurora IQ)
  description: Non-mydriatic handheld fundus photography.
  mechanism_details:
  - The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the ocular
    fundus. It has a 50 degree field of view, 5 Mpix sensor, and high-contrast optical design. The camera
    is non-mydriatic, meaning it doesn't require the pupil to be dilated, so it can be used for detailed
    viewing of the retina.
  - Images taken during the AI-READI visit are undilated images taken in a dark room while a patient is
    sitting on a comfortable chair, laying back.
  - As it becomes challenging to get a good view because of the patients not being dilated and the handheld
    nature of this imaging modality, the quality of the images vary from patient to patient and within
    the same patient.
- id: https://doi.org/10.60775/fairhub.3#mechanism-fundus-eidon
  name: Dilated fundus photography (iCare EIDON)
  description: Widefield TrueColor confocal fundus imaging.
  mechanism_details:
  - The iCare EIDON is a widefield TrueColor confocal fundus imaging system that can capture images up
    to 200 degrees. It comes with multiple imaging modalities, including TrueColor, blue, red, Red-Free,
    and infrared confocal images.
  - The system offers widefield, ultra-high-resolution imaging and the capability to image through cataract
    and media opacities. It operates without dilation (minimum pupil 2.5 mm) and provides the flexibility
    of both fully automated and fully manual modes. Additionally, the iCare EIDON features an all-in-one
    compact design, eliminating the need for an additional PC.
  - 'AI-READI images using EIDON include two main modalities: 1. Single Field Central IR/FAF 2. Smart
    Horizontal Mosaic.'
  - Imaging is done in fully automated mode in a dark room with the machine moving and positioning according
    to the patient's head aiming at optimizing the view and minimizing operator's involvement/operator
    induced noise.
- id: https://doi.org/10.60775/fairhub.3#mechanism-spectralis
  name: Spectralis HRA+OCT (Heidelberg Engineering)
  description: Combined OCT and retinal angiography with confocal scanning laser ophthalmoscopy.
  mechanism_details:
  - The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that combines optical coherence
    tomography (OCT) with retinal angiography. It is a modular, upgradable platform that allows clinicians
    to configure it for their specific diagnostic workflow.
  - It has the confocal scanning laser ophthalmoscope (cSLO) technology that not only offers documentation
    of clinical findings but also often highlights critical diagnostic details that are not visible on
    traditional clinical ophthalmoscopy. Since cSLO imaging minimizes the effects of light scatter, it
    can be used effectively even in patients with cataracts.
  - 'For AI-READI subjects, imaging is done in a dark room using the following modalities: ONH-RC, PPole-H,
    and OCTA of the macula.'
  - As the machine is operated by the imaging team and is not fully automated, quality issues may arise,
    which may lead to skipping this modality and missing data.
- id: https://doi.org/10.60775/fairhub.3#mechanism-triton
  name: Triton DRI OCT (Topcon Healthcare)
  description: Swept-source OCT with multimodal fundus imaging.
  mechanism_details:
  - The DRI OCT Triton is a device from Topcon Healthcare that combines swept-source OCT technology with
    multimodal fundus imaging. The DRI OCT Triton uses swept-source technology to visualize the deepest
    layers of the eye, including through cataracts. It also enhances visualization of outer retinal structures
    and deep pathologies. The DRI OCT Triton has a 1,050 nm wavelength light source and a non-mydriatic
    color fundus camera.
  - AI-READI imaging is done in a dark room with minimal intervention from the imager as the machine positioning
    is done automatically. This leads to higher quality images with minimal operator induced error.
  - Imaging is done in 12.0X12.0 mm and 6.0X6.0 mm OCTA, and 12.0 mm X9.0 mmX6.0 mm 3D Horizontal and
    Radial scan modes.
- id: https://doi.org/10.60775/fairhub.3#mechanism-maestro2
  name: Maestro2 3D OCT (Topcon Healthcare)
  description: Robotic OCT and color fundus camera system.
  mechanism_details:
  - The Maestro2 is a robotic OCT and color fundus camera system from Topcon Healthcare. It can capture
    a 12 mm x 9 mm wide-field OCT scan that includes the macula and optic disc. The Maestro2 can also
    capture high-resolution non-mydriatic, true color fundus photography, OCT, and OCTA with a single
    button press.
  - Imaging is done in a dark room and automatically with minimal involvement of the operator.
  - 'Protocols include 12.0 mm X9.0 mm widefield, 6.0 mm X 6.0 mm 3D macula scan and 6.0 mm X 6.0 mm OCTA
    (scan rate: 50 kHz).'
- id: https://doi.org/10.60775/fairhub.3#mechanism-flio
  name: FLIO - Fluorescence Lifetime Imaging Ophthalmoscopy (Heidelberg Engineering)
  description: Metabolic retinal imaging by fluorescence lifetime.
  mechanism_details:
  - Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) is an advanced imaging technique used in ophthalmology.
    It is a non-invasive method that provides valuable information about the metabolic and functional
    status of the retina.
  - FLIO is based on the measurement of fluorescence lifetimes, which is the duration a fluorophore remains
    in its excited state before emitting a photon and returning to the ground state. FLIO utilizes this
    fluorescence lifetime information to capture and analyze the metabolic processes occurring in the
    retina. Different retinal structures and molecules exhibit distinct fluorescence lifetimes, allowing
    for the visualization of metabolic changes, cellular activity, and the identification of specific
    biomolecules.
  - The imaging is done by an operator in a dark room analogous to a straightforward Heidelberg Spectralis
    OCT. However, as it takes longer than a usual Spectralis OCT and exposes patients to uncomfortable
    levels of light, it is kept to be performed as the last modality of an AI-READI visit. Because of
    this patients may not be at their best possible compliance.
- id: https://doi.org/10.60775/fairhub.3#mechanism-cirrus
  name: Cirrus 5000 Angioplex (Carl Zeiss Meditec)
  description: High-definition OCT and OCT angiography.
  mechanism_details:
  - The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence tomography (OCT) system that
    offers non-invasive imaging of retinal microvasculature.
  - The imaging is done in a dark room by an operator and it is pretty straightforward and analogous to
    what is done in the ophthalmology clinics on a day to day basis.
  - Imaging protocols include 512 X 512 and 200 X 200 macula and ONH scans and also OCTA of the macula.
    Zeiss Cirrus 5000 also provides a 60-degree OCTA widefield view. 8x8mm single scans and 14x14mm automated
    OCTA montage allow for rapid peripheral assessment of the retina as well.
- id: https://doi.org/10.60775/fairhub.3#mechanism-monofilament
  name: Monofilament testing for peripheral neuropathy
  description: Standard clinical test for peripheral neuropathy.
  mechanism_details:
  - Monofilament test is a standard clinical test to monitor peripheral neuropathy in diabetic patients.
    It is done using a standard 10g monofilament applying pressure to different points on the plantar
    surface of the feet.
  - If patients sense the monofilament, they confirm by saying "yes"; if patients do not sense the monofilament
    after it bends, they are considered to be insensate. When the sequence is completed, the insensate
    area is retested for confirmation. This sequence is further repeated randomly at each of the testing
    sites on each foot until results are obtained.
  - The results are recorded on an iPad, Laptop, or a paper questionnaire and are directly added to the
    project's REDCap by the clinical research staff.
- id: https://doi.org/10.60775/fairhub.3#mechanism-moca
  name: Montreal Cognitive Assessment (MoCA)
  description: Cognitive screening instrument administered on an iPad.
  mechanism_details:
  - The Montreal Cognitive Assessment (MoCA) is a simple, in-office screening tool that helps detect mild
    cognitive impairment and early onset of dementia.
  - 'The MoCA evaluates cognitive domains such as: Memory, Executive functioning, Attention, Language,
    Visuospatial, Orientation, Visuoconstructional skills, Conceptual thinking, Calculations. The MoCA
    generates a total score and six domain-specific index scores. The maximum score is 30, and anything
    below 24 is a sign of cognitive impairment. A final total score of 26 and above is considered normal.'
  - 'Some disadvantages of the MoCA include: Professionals require training to score the test, A person''s
    level of education may affect the test, Socioeconomic factors may affect the test, People living with
    depression or other mental health issues may score similarly to those with mild dementia.'
  - AI-READI research staff perform this test on an iPad using a pre-installed software (MoCA Duo app
    downloaded from the app store) that captures all the patients responses in an interactive manner.
sampling_strategies:
- id: https://doi.org/10.60775/fairhub.3#sampling-all-enrolled
  name: All enrolled participants included
  is_sample: false
  description: Whether the dataset is a sample of a larger set. The Healthsheet answers that the dataset
    contains all possible instances.
  source_data:
  - Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes and prediabetes
    ICD-10 codes for all patients who have had an encounter with the sites' health systems within the
    past 2 years.
  strategies:
  - The dataset contains all possible instances. More specifically, the dataset contains data from all
    participants who have been enrolled during the first year of data collection for AI-READI.
  - 'Scope note on the preceding statement: the Healthsheet answer quoted above refers to "the first year
    of data collection", but elsewhere the same source states that this third version consists of data
    collected between July 19, 2023 and May 1st, 2025, i.e. through the end of the second year of the
    study. The narrower wording appears to be carried over from an earlier version of the Healthsheet
    and is not resolved within this source.'
  - Recruitment sampling procedures aimed at achieving approximately equal distribution of participants
    across sex, race, and diabetes severity.
  - 'Three recording sites were strategically selected to achieve diverse recruitment: the University
    of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and the University
    of Washington (UW). The sites were chosen for geographic diversity across the United States and to
    ensure diverse representation across various racial and ethnic groups. Individuals from all demographic
    backgrounds were recruited at all 3 sites.'
  - 'Inclusion criteria: able to provide consent; 40 years of age or older; persons with or without type
    2 diabetes; must speak and read English.'
  - 'Exclusion criteria: must not be pregnant; must not have gestational diabetes; must not have Type
    1 diabetes.'
  - The Healthsheet answers "N/A" to the question about sampling strategy for a sample from a larger set.
  why_not_representative:
  - The study cohort may not provide a comprehensive representation of the population, as it does not
    include other races/ethnicities such as Pacific Islanders and Native Americans.
  - Recruitment was predominantly urban and hospital-based, which may not fully capture diverse cultural
    and socioeconomic backgrounds.
data_collectors:
- id: https://doi.org/10.60775/fairhub.3#collector-ai-readi-team
  name: AI-READI project team
  description: Details about the AI-READI team members involved in the data collection process are available
    at https://aireadi.org/team.
  collector_details:
  - Their effort was supported by the National Institutes of Health award OT2OD032644 based on the percentage
    of effort contributed, and salaries which aligned with the funding guidelines at each site.
  - Roles named in the Healthsheet include clinical research coordinators (CRCs), Data Managers, site
    principal investigators, clinical research staff, the imaging team, staff, and interns.
  - Data were collected at three recruiting sites - the University of Alabama at Birmingham (UAB), the
    University of California San Diego (UCSD), and the University of Washington (UW).
  - The Healthsheet names no individual data collectors.
collection_timeframes:
- id: https://doi.org/10.60775/fairhub.3#timeframe-version-3
  name: Data collection window for version 3
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  description: For this version of the dataset, the timeframe for data collection was July 19, 2023 to
    May 01, 2025.
  timeframe_details:
  - This is the third version of the dataset and consists of data collected up through the end of the
    second year of the study, i.e. between July 19, 2023 and May 1st, 2025.
  - The timeline for the overall project spans four years, encompassing one year dedicated to protocol
    development and training, and years 2-4 allocated for subject recruitment and data collection.
  - Approximately 4% of participants are expected to undergo a follow-up examination in Year 4.
  - The timeframe also allows for the collection of the highest number of subjects possible to ensure
    a balanced representation of racial and ethnic groups and mitigate biases in computer vision algorithms.
missing_data_documentation:
- id: https://doi.org/10.60775/fairhub.3#missing-data
  name: Missing modalities and missing survey responses
  description: Information missing from individual instances and the reasons documented for it.
  missing_data_patterns:
  - Not all modalities are available for all participants.
  - In cases of survey data, skipped questions or incomplete responses are expected.
  missing_data_causes:
  - Some participants elected not to participate in some study elements.
  - In a few cases, the data collection device did not have any stored results or was returned too late
    to retrieve the results (e.g. battery died, data was lost).
  - In a few cases, there may have been a data collision at some point in the process and data has been
    lost.
  - Quality issues with operator-dependent imaging modalities may lead to skipping a modality and missing
    data.
raw_sources:
- id: https://doi.org/10.60775/fairhub.3#raw-data-retention
  name: Retained raw data
  description: Status of the raw data that underlies the released, processed dataset.
  raw_data_details:
  - The raw data is saved and expected to be preserved by the AI-READI project at least for the duration
    of the project.
  - It is not anticipated to be shared outside the project team right now, because it has not been mapped
    to standardized terminologies and because the raw data may accidentally include personal health information
    or personally identifiable information (e.g. in free text fields).
  - There is a possibility that raw data may be included in future releases of the controlled access dataset.
preprocessing_strategies:
- id: https://doi.org/10.60775/fairhub.3#preprocessing-standardization
  name: Mapping to standardized terminologies
  description: Processing applied centrally after data were sent from the study sites, in preparation
    for dissemination.
  preprocessing_details:
  - Once data were sent from each of the study sites to the central project team, additional processing
    steps were conducted in preparation for dissemination.
  - All data were mapped to standardized terminologies when possible, such as the Observational Medical
    Outcomes Partnership (OMOP) Common Data Model, a common data model for observational health data,
    and the Digital Imaging and Communications in Medicine (DICOM), a commonly used standard for medical
    imaging data.
  - Details about the data processing approaches for each data domain/modality are described in the dataset
    documentation at https://docs.aireadi.org.
  - 'Upstream gap: the Healthsheet question "Was there any pre-processing for the de-identification of
    the patients?" is recorded with no response provided.'
- id: https://doi.org/10.60775/fairhub.3#preprocessing-no-exclusions
  name: No instances excluded at preprocessing
  description: Whether instances were excluded from the dataset at the time of preprocessing.
  preprocessing_details:
  - No data were excluded from the dataset at the time of preprocessing.
  - Eligibility criteria governed the ability to participate in the study rather than exclusion at preprocessing.
cleaning_strategies:
- id: https://doi.org/10.60775/fairhub.3#cleaning-site-qc
  name: Quality control at data entry and acquisition
  description: Quality control measures used at the time of data entry/acquisition and the editing rules
    applied.
  cleaning_details:
  - There were several quality control measures used at the time of data entry/acquisition.
  - Clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in reports
    viewed by clinical research coordinators (CRCs) and Data Managers.
  - Using these REDCap reports as guides, Data Managers and CRCs examined participant records and determined
    if an error was likely.
  - 'Data were checked for the following and edited if errors were detected: 1. Credibility, based on
    range checks to determine if all responses fall within a prespecified reasonable range; 2. Incorrect
    flow through prescribed skip patterns; 3. Missing data that can be directly filed from other portions
    of an individual''s record; 4. The omission and/or duplication of records.'
  - Editing was only done under the guidance and approval of the site PI. If corrected data was available
    from elsewhere in the respondent's answers, the error was corrected. If there was no logical or appropriate
    way to correct the data, the Data site PI reviewed the values and made decisions about whether those
    values should be removed from the data.
- id: https://doi.org/10.60775/fairhub.3#cleaning-internal-review
  name: Internal review in place of external audit
  description: Audit status of the dataset as reported in the Healthsheet.
  cleaning_details:
  - The dataset has not undergone any formal external audits.
  - However, the dataset has been reviewed internally by AI-READI team members for quality checks and
    to ensure that no personally identifiable information was accidentally included.
labeling_strategies:
- id: https://doi.org/10.60775/fairhub.3#labeling-none
  name: No labeling performed
  description: The dataset carries no explicit label or target associated with each data instance.
  labeling_details:
  - N/A - no labels are provided.
  - No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic dataset
    aimed at facilitating multiple potential downstream AI/ML applications.
  - The Healthsheet answers "N/A - no labeling was performed" to the question of whether the software
    used to preprocess/clean/label instances is available.
  - The Healthsheet answers "N/A" to the question about human level performances in the applications the
    dataset is supposed to address.
