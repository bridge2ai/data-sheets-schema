instances:
- name: Participant
  instance_type: participant
  counts: 833
  description: Bridge2AI-Voice v3.0 contains data for 833 participants across five sites in North
    America, selected based on known conditions which manifest within the voice waveform including
    voice disorders, neurological disorders, mood disorders and respiratory disorders, together
    with healthy controls. Participants are keyed by participant_id across every released feature
    and phenotype table.
  label: true
  label_description: Each participant carries clinical labels (diagnostic categories recorded
    by clinical investigators and care teams from clinical assessments and electronic health records)
    and questionnaire-derived measures scored according to each validated instrument's published
    scoring guidelines.
- name: Session
  instance_type: data collection session
  description: Most participants completed a single in-clinic session and a subset completed repeated
    sessions; sessions are keyed by session_id and carry attributes such as assigned tasks, duration,
    status, control-participant flag and who completed the session.
- name: Recording-derived feature record
  instance_type: per-recording derived acoustic feature record
  description: Rows in the released Parquet feature tables, keyed by participant_id, session_id
    and task_name, each holding a dense derived representation of one recorded acoustic task together
    with a frame count.
  label: true
  label_description: Machine-generated transcripts of certain structured voice tasks and numerous
    automatically extracted acoustic and articulatory features provide further labels and descriptors
    at the recording level.
  missing_information:
  - name: Content withheld from the feature-only release
    missing:
    - Raw voice, speech and respiratory audio waveforms
    - Transcripts of free-speech audio
    - Narrative text fields
    - Fine-grained geographic identifiers and direct identifiers
    - Some socio-economic and cultural detail, including some household income and traumatic life
      experience content
    why_missing:
    - Raw voice recordings are themselves biometric identifiers and are made available only under
      a separate controlled-access process.
    - Direct identifiers and high-risk quasi-identifiers are removed, dates are coarsened or rebased
      and geographic information is generalized to the country level to reduce re-identification
      risk.
    - Some derived features were dropped where processing failed or quality checks failed, and
      features relating to free speech or sensitive records were removed.
anomalies:
- name: Derived features missing for some recordings
  description: Data-level irregularities the crate reports for the released feature tables.
  anomaly_details:
  - Some derived audio features could not be computed for all recordings due to quality or length
    constraints.
  - Additional filtering removes features for sensitive records and audio checks, and some derived
    features are dropped when processing fails or quality checks fail.
  - Phenotype tables include a row for a participant only when at least one variable is non-missing,
    so participants are not uniformly represented across tables.
known_biases:
- name: Sampling bias
  bias_type: sampling_bias
  bias_description: Participants are recruited from specialty clinics and associated institutions
    using a non-probability sampling strategy, with inclusion focused on specific disease cohorts
    and fluent English speakers; this produces clinically enriched case mixes that may not represent
    general population distributions.
- name: Geographic and cultural bias
  bias_type: representation_bias
  bias_description: Data are collected at a limited number of North American sites, and although
    the project seeks diversity, it may under-represent speakers from other regions, cultures,
    languages and healthcare systems; early releases focus on English, with Spanish protocols
    planned but not yet fully represented.
- name: Clinical spectrum bias
  bias_type: selection_bias
  bias_description: Because participants are selected into disease cohorts where voice changes
    are expected, the prevalence and severity of conditions in the dataset differ from those in
    routine primary care or community settings, which may inflate model performance when evaluated
    within this dataset.
- name: Device and environment bias
  bias_type: measurement_bias
  bias_description: Recordings are made using standardized but not identical hardware and primarily
    in clinical environments; future at-home collection or deployment on other devices may encounter
    different background noise, channel characteristics and user behavior.
- name: Algorithmic bias in machine annotations
  bias_type: algorithmic_bias
  bias_description: Transcripts and some derived features rely on off-the-shelf models such as
    OpenAI Whisper and other audio toolkits whose performance may vary across demographic groups;
    the dataset team has not independently audited these tools for fairness, so downstream users
    should consider their biases when interpreting results.
  mitigation_strategy: The crate discloses the machine annotation tool inventory so downstream
    users can reason about tool-specific bias; no independent fairness audit of these tools is
    reported.
known_limitations:
- name: Feature-only release without raw audio
  limitation_type: scope_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may constrain the
    ability to reproduce end-to-end audio pipelines.
- name: Adult, largely English-language cohort
  limitation_type: representativeness_limitation
  limitation_description: This version only includes an adult cohort; models trained solely on
    this dataset may not generalize to younger age groups or to languages beyond those represented.
- name: De-identification reduces variable granularity
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic
    variables, fine-grained location data and narrative context have been removed, which reduces
    the risk of re-identification but also limits detailed fairness assessments and certain confounder
    adjustments.
- name: No predefined splits, benchmarks or label-uncertainty measures
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train-validation-test splits
    or benchmarking tasks and does not include explicit per-instance label-uncertainty measures,
    so researchers must design their own evaluation protocols and handle label noise and missingness.
  recommended_mitigation: Researchers must design their own evaluation protocols and handle label
    noise and missingness.
- name: Access governance constrains reuse and reproducibility
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is
    appropriate for privacy but may limit participation by some institutions or researchers and
    can complicate the reproducibility of pipelines that require both features and raw audio.
confidential_elements:
- name: Limited dataset released under a Data Use Agreement
  confidential_elements_present: true
  confidentiality_details:
  - 'Confidentiality level recorded by the crate: limited dataset available with Data Use Agreement.'
  - Use of the data is restricted to authorized researchers under a registered-access license
    and associated data use agreement.
  - Raw voice recordings, which are themselves biometric identifiers, are made available only
    under controlled access, separately from this feature-only release.
content_warnings:
- name: Sensitive narrative content removed before release
  content_warnings_present: false
  warnings:
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely
    from this feature-only dataset.
  - Released content does retain diagnostic categories for psychiatric, mood, neurological and
    respiratory conditions and symptom scores from validated instruments.
