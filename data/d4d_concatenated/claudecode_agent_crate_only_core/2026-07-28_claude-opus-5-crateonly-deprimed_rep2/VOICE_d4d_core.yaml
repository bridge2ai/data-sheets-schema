purposes:
- name: Enable AI research on voice as a biomarker of health
  description: Primary purpose declared by the crate for creating the dataset.
  response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset
    to enable future research in artificial intelligence and to support critical insights into
    the use of voice as a biomarker of health, given that the human voice contains complex acoustic
    markers linked to health conditions including dementia, mood disorders and cancer.
- name: Support accessible, low-cost health screening research
  description: Societal purpose stated in the crate's responsible-AI social impact statement.
  response: The project aims to create an ethically sourced, diverse voice dataset to support
    research on using voice as an accessible, low-cost biomarker for screening, diagnosis and
    monitoring of a broad range of health conditions, potentially improving early detection and
    care for underserved populations.
tasks:
- name: Voice-derived diagnostic and severity modelling
  description: Machine-learning tasks the crate names as intended for the dataset.
  response: Development, training and fine-tuning of machine-learning models that associate voice-derived
    features with diagnostic categories or symptom severity for conditions such as vocal fold
    pathology, neurological and neurodegenerative diseases, mood and anxiety disorders and respiratory
    illnesses.
- name: Benchmarking and validation of voice-biomarker algorithms
  description: Evaluation task named by the crate.
  response: Benchmarking and validation of existing voice-biomarker algorithms by testing their
    performance on a clinically diverse, multi-site cohort with standardized tasks and rich phenotype
    data.
addressing_gaps:
- name: Absence of an ethically sourced, diverse clinical voice dataset
  description: Gap the dataset was created to fill, as stated in the crate description.
  response: 'Recent advances in artificial intelligence provide techniques to extract previously
    unknown prognostically useful information from dense data elements, but an ethically sourced
    flagship voice dataset linked to clinical information was needed to enable that research.
    The crate positions Bridge2AI-Voice as that resource: a comprehensive collection of data derived
    from voice recordings with corresponding clinical information, collected under IRB oversight
    with a governance framework and de-identification tiering.'
- name: Lack of clinically enriched voice data spanning multiple disorder families
  description: Coverage gap addressed by the participant selection strategy.
  response: Participants were selected based on known conditions which manifest within the voice
    waveform, including voice disorders, neurological disorders, mood disorders and respiratory
    disorders, producing a multi-site cohort that spans disorder families rather than a single
    condition.
