sensitive_elements:
- name: Sensitive personal health and demographic content
  sensitive_elements_present: true
  sensitivity_details:
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory
    diseases, as well as symptom scores from questionnaires, which constitute sensitive personal
    health data.
  - Demographic variables such as age, sex and country of data collection are included in coarsened
    form, while finer-grained geographic identifiers, direct identifiers and many socio-economic
    and cultural details have been removed during de-identification to reduce re-identification
    risk.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely
    from this feature-only dataset; raw voice recordings, which are themselves biometric identifiers,
    are made available only under controlled access.
  - Use of the data is restricted to authorized researchers under a registered-access license
    and associated data use agreement that explicitly forbids attempts at re-identification, stigmatizing
    or discriminatory uses and applications such as surveillance or high-stakes individual decision
    making.
acquisition_methods:
- name: Mixed direct measurement, self-report and derivation
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Data collection types declared by the crate: direct measurement; surveys; self-reporting;
    secondary data analysis; document analysis.'
  - Voice, speech and respiratory audio were recorded directly from participants during standardized
    in-clinic tasks.
  - Demographic questions, health history, disease-specific questionnaires and other patient-reported
    outcomes were self-reported by participants.
  - Released acoustic representations are inferred or derived from the raw audio by automated
    feature-extraction pipelines.
  - Clinical diagnoses and other metadata were extracted from electronic health records and clinical
    assessments, and the release team audited the combined phenotype and feature tables for internal
    consistency, missingness patterns and data entry issues.
collection_mechanisms:
- name: In-clinic mobile application capture with REDCap storage
  mechanism_details:
  - Data were captured on a mobile or tablet application and stored in REDCap.
  - 'Collection and annotation platforms declared by the crate: a custom Bridge2AI-Voice mobile
    and tablet application used for in-clinic collection of acoustic tasks and questionnaires;
    a REDCap-based data capture system used to manage clinical and phenotype data; electronic
    health record systems used as a source of some gold-standard diagnostic information; and open-source
    preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.'
  - Audio was recorded on tablet or smartphone devices with headset microphones when available.
collection_timeframes:
- name: Adult flagship cohort collection window
  timeframe_details:
  - Data collection for the adult flagship cohort began after project launch in 2023 and is ongoing
    across five North American sites toward an anticipated enrollment of approximately 3,000 participants
    by November 2026; the participants and recordings included in dataset version 3.0.0 were collected
    roughly between 2023 and 2025.
- name: Release snapshot schedule
  timeframe_details:
  - 'Dataset releases are static snapshots: v1.0 (initial public release in 2024), v1.1 (2025-01-17),
    v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), each corresponding to a
    frozen state of the underlying data collection.'
data_collectors:
- name: Clinicians and research staff at participating North American institutions
  role: clinical investigator and research staff
  collector_details:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created
    by clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines.
  - Detailed demographic breakdowns of the collecting and annotating staff are not provided in
    the crate.
  - Per-annotator identity is not exposed; the crate does not record which specific clinician
    or staff member entered a label.
- name: Study participants
  role: self-reporting participant
  collector_details:
  - Questionnaire-based labels reflect self-reported information from participants themselves,
    whose demographics are captured in coarsened form in the phenotype tables, for example age
    bands, sex and country of data collection.
missing_data_documentation:
- name: Missingness in phenotype tables and derived features
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing,
    and participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  - Some derived audio features could not be computed for all recordings.
  missing_data_causes:
  - Variation in questionnaire completion by participant and cohort.
  - Audio quality or length constraints preventing feature computation.
  - Deliberate removal of features relating to free speech or sensitive records.
  handling_strategy: No additional imputation is applied in the released files; missing values
    are left explicit or the corresponding rows are omitted.
raw_data_sources:
- name: Underlying raw voice, questionnaire and clinical record sources
  source_description: The original raw data consist of high-quality voice, speech and respiratory
    audio waveforms recorded on tablet or smartphone devices with headset microphones when available,
    plus responses to structured demographic and medical history questionnaires, disease-specific
    validated questionnaires and other patient-reported outcomes, together with clinical diagnoses
    and other metadata extracted from electronic health records.
  source_type:
  - Voice, speech and respiratory audio recordings
  - Structured demographic and medical history questionnaires
  - Disease-specific validated questionnaires and patient-reported outcomes
  - Electronic health records
  raw_data_format:
  - Audio waveforms
  - REDCap questionnaire responses
  access_details: The public feature-only PhysioNet release contains de-identified derived representations
    of the audio; access to the underlying raw audio is available only through a separate controlled-access
    process.
sampling_strategies:
- name: Non-probability clinical cohort sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Adults presenting to voice, neurology, psychiatry and respiratory clinics at multiple specialty
    clinics and academic hospitals across North America, plus healthy controls.
  strategies:
  - Eligible adults were screened against predefined inclusion and exclusion criteria before consent.
  - Inclusion focused on specific disease cohorts and fluent English speakers.
  - Participants were selected based on known conditions which manifest within the voice waveform,
    including voice disorders, neurological disorders, mood disorders and respiratory disorders.
  why_not_representative:
  - Participants are recruited from specialty clinics and associated institutions using a non-probability
    sampling strategy, producing clinically enriched case mixes that may not represent general
    population distributions.
  - Because participants are selected into disease cohorts where voice changes are expected, the
    prevalence and severity of conditions in the dataset differ from those in routine primary
    care or community settings.
  - Data are collected at a limited number of North American sites and may under-represent speakers
    from other regions, cultures, languages and healthcare systems.
raw_sources:
- name: Availability of the raw audio tier
  raw_data_details:
  - Raw voice waveforms are withheld from this feature-only release.
  - Access to the underlying raw audio is available only through a separate controlled-access
    process; the crate does not give a URL or application procedure for that process.
preprocessing_strategies:
- name: Audio standardization and segmentation
  preprocessing_details:
  - Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing filtering;
    they are then segmented by task and passed through quality checks.
- name: Derived acoustic feature extraction
  preprocessing_details:
  - From the standardized audio, multiple derived feature sets are computed including spectrograms,
    mel spectrograms, MFCCs, articulatory features using the Speech Articulatory Coding package,
    pitch and loudness estimates, acoustic features from openSMILE, phonetic and prosodic features
    from Praat and parselmouth, and phonetic posteriorgrams using a dedicated model; all are stored
    as dense tensors in Parquet files with participant, session and task identifiers.
- name: Phenotype export, merge and reorganization
  preprocessing_details:
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using a dedicated
    open-source b2aiprep library, reorganizing the former single phenotype table into thematically
    organized TSV files with accompanying JSON data dictionaries; static per-recording feature
    summaries are provided in static_features.tsv, and de-identification and filtering steps are
    applied before packaging.
- name: VOICE Features Processing
  description: Computation activity recorded in the crate provenance graph that generated the
    nine released Parquet feature tables.
  preprocessing_details:
  - 'Crate description: processing step for taking raw data and converting it into spectrograms
    and features using the b2ai-prep.'
  - 'Recorded as run by: Alastair; dateCreated 2026-01-29.'
  - 'Generated entities: ppgs.parquet, sparc_ema.parquet, sparc_loudness.parquet, the sparc periodicity
    table, sparc_pitch.parquet, torchaudio_mfcc.parquet, the torchaudio pitch table, torchaudio_spectrogram.parquet
    and torchaudio_mel_spectrogram.parquet.'
  used_software:
  - id: ark:59853/b2ai-voice-software-b2aiprep
    name: B2AIPrep Library
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project.
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
- name: VOICE Phenotype Ingest
  description: Computation activity recorded in the crate provenance graph that generated the
    released phenotype tables.
  preprocessing_details:
  - 'Crate description: dumping and reformatting phenotype information from Redcap database into
    b2ai-voice phenotype extracts.'
  - 'Recorded as run by: Alastair; dateCreated 2025-12-16.'
  - 'Generated entities: confounders.tsv, demographics.tsv, the VOICE diagnosis tables, the VOICE
    enrollment tables, the VOICE questionnaire tables and the VOICE task tables.'
  used_software:
  - id: ark:59853/b2ai-voice-software-b2aiprep
    name: B2AIPrep Library
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project.
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
cleaning_strategies:
- name: De-identification and regulatory alignment transforms
  cleaning_details:
  - Prior to release, data are transformed to reduce re-identification risk and align with regulatory
    and ethical requirements.
  - Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or rebased;
    geographic information is generalized to the country level; narrative text fields and transcripts
    of free speech are removed; and raw voice waveforms are withheld from this feature-only release.
- name: Quality filtering of derived features
  cleaning_details:
  - Additional filtering removes features for sensitive records and audio checks, and some derived
    features are dropped when processing fails or quality checks fail.
  - Segmented audio is passed through quality checks before feature extraction.
labeling_strategies:
- name: Clinical, questionnaire and machine-generated labelling
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic
    tasks and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge
    and organize annotations with derived features.
  data_annotation_protocol:
  - Annotations for this dataset consist primarily of clinical labels and questionnaire-derived
    measures associated with each participant and recording.
  - Participants complete validated instruments such as VHI-10, PHQ-9, GAD-7, PANAS, respiratory
    and cough questionnaires and voice instruments, which generate numerical scores and categorical
    indicators according to each instrument's published scoring guidelines.
  - Clinical investigators and care teams record diagnostic categories for voice, neurological,
    mood and respiratory conditions and other phenotype variables, drawing on clinical assessments
    and electronic health records; these labels are represented in disease-specific TSV files
    with accompanying JSON dictionaries.
  - Machine-generated transcripts of certain voice tasks and numerous automatically extracted
    acoustic and articulatory features provide further labels and descriptors at the recording
    level.
  annotations_per_item: 1
  inter_annotator_agreement: Diagnostic labels are derived from clinical assessments and electronic
    health records rather than crowd workers, so there is no explicit inter-rater majority-vote
    scheme; there is no crowd-sourced labeling and the crate does not report multiple independent
    human ratings per individual recording or per-annotator disagreement statistics.
  annotator_demographics:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created
    by clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines; detailed demographic breakdowns
    of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves,
    whose demographics are captured in coarsened form in the phenotype tables, for example age
    bands, sex and country of data collection; however, per-annotator demographic information,
    such as which specific clinician or staff member entered a label, is not exposed.
  labeling_details:
  - Each recording is associated with one set of clinical labels and questionnaire responses derived
    from a single participant, although participants may contribute multiple sessions over time.
  - Diagnoses are treated as reference labels and may include multiple comorbid conditions per
    participant.
imputation_protocols:
- name: No global imputation applied
  imputation_method:
  - The public datasets do not apply global statistical imputation to missing fields.
  - Missing questionnaire responses, phenotype variables and derived features are left as explicit
    missing values or omitted rows.
  imputation_rationale: The data release team audited missingness so that users can implement
    study-specific imputation or complete-case strategies appropriate to their analyses.
annotation_analyses:
- name: Label generation, reference status and quality audit
  analysis_method: Questionnaire-based labels are generated using the standard scoring rules for
    each validated instrument, yielding total and subscale scores that can be mapped to symptom-severity
    bands; the scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  disagreement_patterns:
  - Diagnostic labels are derived from clinical assessments and electronic health records rather
    than crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses
    are treated as reference labels and may include multiple comorbid conditions per participant.
  annotation_quality_details:
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues, but per-annotator disagreement statistics or detailed
    label-uncertainty measures are not presently included in the released dataset.
machine_annotation_tools:
- name: Automated feature extraction and transcription toolchain
  tools:
  - OpenSMILE
  - Praat and parselmouth
  - TorchAudio
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram models
  - OpenAI Whisper Large
  - b2aiprep
  tool_descriptions:
  - OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral
    characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including
    measures of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related
    features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units
    for each recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and merging
    of phenotype data into the released files.
  tool_accuracy:
  - The crate reports no accuracy figures for these tools.
  - Transcripts and some derived features rely on off-the-shelf models whose performance may vary
    across demographic groups; the dataset team has not independently audited these tools for
    fairness.
  used_software:
  - id: ark:59853/b2ai-voice-software-b2aiprep
    name: B2AIPrep Library
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project.
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
other_tasks:
- name: Additional research tasks supported by the release
  task_details:
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
    using de-identified derived features, including work on representation learning, domain adaptation
    and multimodal integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions.
future_use_impacts:
- name: Risks that may affect future uses
  impact_details:
  - The consortium explicitly recognizes the risks associated with voice data, including privacy
    loss, misuse of voice biometrics and algorithmic harms such as discrimination in hiring, insurance
    or surveillance contexts.
  - Clinically enriched case mixes may inflate model performance when models are evaluated within
    this dataset relative to routine primary care or community settings.
  - Future at-home collection or deployment on other devices may encounter different background
    noise, channel characteristics and user behavior than the clinical recording conditions represented
    here.
  - Models trained solely on this dataset may not generalize to younger age groups or to languages
    beyond those represented.
discouraged_uses:
- name: Uses the crate states the dataset is not intended for
  discouragement_details:
  - The dataset is explicitly not intended for operational decision making about specific individuals
    such as hiring, insurance pricing, law enforcement or surveillance.
  - It is not intended for attempts at re-identification or for uses likely to stigmatize individuals
    or groups.
  - Reproducing end-to-end audio pipelines and certain error analyses are constrained because
    raw audio waveforms and free-speech transcripts are not part of this release.
intended_uses:
- name: Intended research uses declared by the crate
  use_category:
  - Clinical machine-learning model development
  - Algorithm benchmarking and validation
  - Exploratory acoustic and phenotypic research
  - Fairness, robustness and AI safety methodology research
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived
    features with diagnostic categories or symptom severity for conditions such as vocal fold
    pathology, neurological and neurodegenerative diseases, mood and anxiety disorders and respiratory
    illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance
    on a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
    using de-identified derived features, including work on representation learning, domain adaptation
    and multimodal integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical
    constraints in the data use agreement.
  usage_notes: All uses are subject to the ethical constraints in the registered-access license
    and data use agreement. Because the dataset provides no predefined splits, benchmarking tasks
    or per-instance label-uncertainty measures, users must design their own evaluation protocols
    and handle label noise and missingness.
prohibited_uses:
- name: Uses forbidden by the registered-access licence and data use agreement
