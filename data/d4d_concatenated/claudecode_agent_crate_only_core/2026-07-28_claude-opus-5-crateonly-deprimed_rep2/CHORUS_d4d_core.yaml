- id: distribution_format_ro_crate_package
  name: RO-Crate package deposited with a persistent identifier
  description: The dataset is packaged as a self-contained RO-Crate conforming to RO-Crate 1.2, using
    the schema.org vocabulary and the Croissant RAI specification, and is cited to Harvard Dataverse under
    DOI 10.18130/V3/XNBOPG. The package comprises an EHR sub-crate and a Waveforms sub-crate.
  access_urls:
  - https://doi.org/10.18130/V3/XNBOPG
distribution_dates:
- id: distribution_date_v1_0_beta
  name: Version 1.0 Beta release
  description: The package and both sub-crates record a publication date of 2026-04-03; the crate additionally
    records the same release date in DD/MM/YYYY form as 03/04/2026.
  release_dates:
  - '2026-04-03'
license_and_use_terms:
  id: license_and_use_terms_chorus
  name: CHoRUS Data Use Agreement and access conditions
  license_terms:
  - Data Use Agreement available at 'https://chorus4ai.org/dataset/'
  - Data Use Agreement document - https://chorus4ai.org/wp-content/uploads/2025/10/Data-Agreement-9.30.2025.docx
  - Access to CHoRUS data is governed through a controlled-access framework and requires - providing institutional
    affiliation and credentials; an approved research proposal reviewed by the CHoRUS governance committee;
    a Data Use Agreement (DUA) executed between requestor institution and CHoRUS; IRB approval or exemption
    documentation, as applicable; compliance with NIH Bridge2AI OT terms and applicable federal regulations;
    access restricted to secure enclave environment with no raw data export permitted unless explicitly
    approved.
  - Data use may not be used for commercial purposes unless specifically authorized through a separate
    agreement consistent with governing award and consortium terms.
  - Copyright notice - (c) 2026 THE GENERAL HOSPITAL CORPORATION D/B/A MASSACHUSETTS GENERAL HOSPITAL.
    Copyrights are owned by each subaward site for curation performed locally. Copyrights are jointly
    held for software jointly developed. All rights reserved.
  data_use_permission:
  - health_medical_biomedical_research
  - no_commercial_use
  - ethics_approval_required
  - project_specific
  - institution_specific
  contact_person: person_ciera_mccrary
ip_restrictions:
  id: ip_restrictions_chorus
  name: Copyright and intellectual property allocation
  restrictions:
  - (c) 2026 THE GENERAL HOSPITAL CORPORATION D/B/A MASSACHUSETTS GENERAL HOSPITAL. All rights reserved.
  - Copyrights are owned by each subaward site for curation performed locally.
  - Copyrights are jointly held for software jointly developed.
regulatory_restrictions:
  id: regulatory_restrictions_chorus
  name: Regulatory and confidentiality restrictions
  regulatory_restrictions:
  - HIPAA
  - Human subject exemption recorded as HIPAA exemption 4 ((45 CFR 46.104(d)(4))
  - NIH Bridge2AI OT terms and applicable federal regulations
  - Recorded as FDA regulated
  - Access restricted to a secure enclave environment; no raw data export permitted unless explicitly
    approved
  hipaa_compliant: compliant
  other_compliance:
  - NIST 800-53 security controls (secure enclave architecture)
  - NIH data-sharing policies
  - CHoRUS consortium governance policies
  confidentiality_level: confidential
  description: The crate records the confidentiality level verbatim as 'HL7:2V (very restricted)', mapped
    here to the schema's highest confidentiality class.
  governance_committee_contact: person_eric_s_rosenthal
maintainers:
- id: maintainer_chorus_data_pillar
  name: CHoRUS Data Pillar
  maintainer_details:
  - Primary maintainers - CHoRUS Data Pillar in collaboration with institutional data stewards.
  - Governance committee contact - Eric Rosenthal, EROSENTHAL@mgh.harvard.edu.
  - General contact - Ciera McCrary, cmccrary@mgh.harvard.edu.
  - Publisher - B2AI CHoRUS.
  - Governance committee oversight applies to structural modifications of the dataset.
updates:
  id: update_plan_chorus
  name: Versioned release and deprecation plan
  update_details:
  - Versioned dataset releases (e.g., CHoRUS vX.Y).
  - Release notes documenting schema changes, harmonization updates, and known issues.
  - Governance committee oversight for structural modifications.
  - Data upload.
  - Deprecation policy includes advance notice of schema changes, a backward compatibility window where
    feasible, and archive of prior versions within the enclave where possible or incremental change records.
  - Primary maintainers - CHoRUS Data Pillar in collaboration with institutional data stewards.
version_access:
  id: version_access_chorus
  name: Version availability and support
  latest_version_doi: https://doi.org/10.18130/V3/XNBOPG
  versions_available:
  - 1.0 Beta (published 2026-04-03)
  version_details:
  - Versioned dataset releases (e.g., CHoRUS vX.Y).
  - Archive of prior versions within the enclave where possible, or incremental change records.
  - Advance notice of schema changes.
  - Backward compatibility window where feasible.
is_deidentified:
  id: deidentification_chorus
  name: De-identification status and method
  identifiable_elements_present: false
  method: De-identification consistent with HIPAA Safe Harbor
  identifiers_removed:
  - Direct identifiers (removed or tokenized)
  - Dates (date shifting or limited date fields when required)
  - Imaging metadata identifiers
  deidentification_details:
  - The crate records the dataset as de-identified.
  - Imaging metadata de-identification using RSNA Clinical Trial Processor and pixel-level de-identification
    using IbisWorks EICON.
  - Tokenization of note and report text via the OHNLP toolkit, with raw text retained locally across
    participating institutions.
  - Residual risk - re-identification risk is periodically assessed and mitigation strategies updated
    as needed; re-identification attempts are prohibited and output review procedures are applied.
