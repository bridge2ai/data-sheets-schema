anomalies:
- id: data_anomaly_acquisition_and_integrity
  name: Known sources of noise and integrity gaps
  anomaly_details:
  - Variable sampling rates across real-world data from hospital waveform systems and middleware.
  - Institutional heterogeneity in coding and clinical data collection practices.
  - Documentation quality is dependent on routine clinical workflows and on which data elements are collected
    in clinical practice.
  - 'Checksum coverage is incomplete: 1,469 of 1,477 files (99%) have checksums, leaving 8 files without
    a recorded checksum.'
