future_use_impacts:
- id: future_use_impact_composition_and_governance
  name: Composition and governance constraints on future use
  impact_details:
  - Because the data are observational, institution-specific, and subject to referral, documentation,
    and missingness biases, models derived from this dataset may not transfer beyond participating institutions
    and require validation before any clinical use.
  - Direct translation of trained algorithms to real-time clinical deployment without validation or regulatory
    clearance is not recommended, and the dataset should not be used as sole evidence for clinical decision-making.
  - 'Future use remains bound to the controlled-access governance framework: usage must align with approved
    research scope and governance policies.'
