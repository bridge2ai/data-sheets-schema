preprocessing_strategies:
- id: preprocessing_strategy_harmonization_and_deidentification
  name: Harmonization to common data models and de-identification
  preprocessing_details:
  - Electronic health record extraction and transformation to the OMOP common data model.
  - Imaging metadata de-identification using RSNA Clinical Trial Processor and pixel-level de-identification
    using IbisWorks EICON.
  - High-resolution physiologic waveform capture extraction and transformation to the WFDB standard.
  - Standardized harmonization to a common data model.
  - Tokenization of note and report text via the OHNLP toolkit, with raw text retained locally across
    participating institutions.
  used_software:
  - id: software_rsna_clinical_trial_processor
    name: RSNA Clinical Trial Processor
    description: Used for imaging metadata de-identification.
  - id: software_ibisworks_eicon
    name: IbisWorks EICON
    description: Used for pixel-level de-identification of imaging data.
  - id: software_ohnlp_toolkit_preprocessing
    name: OHNLP toolkit
    description: Used to tokenize note and report text, with raw text retained locally.
