other_tasks:
- name: Further tasks supported by the data
  task_details:
  - AI and machine learning model training.
  - Cellular process analysis.
  - Analysis of cell architectural changes and interactions in the presence of specific disease
    processes, treatment conditions or genetic perturbations.
  - Bioinformatics analysis of the individual modality datasets.
future_use_impacts:
- name: Impacts of the release trajectory on future use
  impact_details:
  - The release is interim; predicted cell maps are absent and will be added in future releases,
    so analyses built on the current content may need revision as the release series progresses.
  - Content is augmented quarterly through November 2026 and some datasets are under temporary
    pre-publication embargo, so the composition of the release changes over time and users
    should record the release version and DOI they analysed.
  - Because the data derive from commercially available cell lines and do not represent population-level
    biological variation, models trained on them may not generalise to broader biological
    populations.
discouraged_uses:
- name: Uses discouraged by the declared limitations
  discouragement_details:
  - Analysis without relevant domain expertise; the crate states that the data require domain
    expertise for meaningful analysis.
  - Treating the data as representative of population-level biological variation; the data
    derive from commercially available de-identified human cell lines and do not represent
    all biological variants which may be seen in the population at large.
  - Cross-modality integration that assumes complete protein overlap between SEC-MS, IF imaging
    and CRISPRi perturb-seq data.
intended_uses:
- name: Intended research uses
  examples:
  - Research in functional genomics.
  - AI and machine learning model training.
  - Cellular process analysis.
  - Analysis of cell architectural changes and interactions in the presence of specific disease
    processes, treatment conditions or genetic perturbations.
  - 'Biologically-driven, interpretable machine learning applications, for example as proposed
    in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).'
  use_category:
  - research
  - AI/ML model training
  usage_notes: These laboratory data are not to be used in clinical decision-making or in
    any context involving patient care without appropriate regulatory oversight and approval.
    Attribution is required to the copyright holders and the authors, and publications referencing
    this data or derived data products should cite the related publications as well as directly
    citing this data collection.
prohibited_uses:
