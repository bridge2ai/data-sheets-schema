distributions:
- id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-paclitaxel
  name: EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468 Cells
    Upon Paclitaxel Perturbation
  description: Affinity purification mass spectrometry (AP-MS) raw data generated from endogenously
    tagged MDA-MB-468 cells under Paclitaxel perturbation. The dataset focuses on drug-induced
    interactome rewiring of chromatin modifiers relevant to the triple-negative breast cancer
    context. All AP-MS experiments were performed in four biological replicates. Each AP-MS
    batch includes an untagged parental control, 10 chromatin modifier tagged cell lines,
    and a positive control tagged line. DMSO-treated samples serve as vehicle control across
    all AP-MS experiments (Unpublished data). The crate declares a content size of 441.2 GB
    and inventories 560 entities, of which 555 are dataset (file) entities recorded as computation
    outputs, alongside 2 schemas, 1 sample, 1 instrument and 1 experiment; 117 sample entities
    are recorded as inputs.
  path: AP-MS/apms-paclitaxel-rocrate
- id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-vorinostat
  name: EndoTag-AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468 Cells
    Upon Vorinostat Perturbation
  description: Affinity purification mass spectrometry (AP-MS) raw data generated from endogenously
    tagged MDA-MB-468 cells under Vorinostat perturbation. The dataset focuses on drug-induced
    interactome rewiring of chromatin modifiers relevant to the triple-negative breast cancer
    context. All AP-MS experiments were performed in four biological replicates. Each AP-MS
    batch includes an untagged parental control, 10 chromatin modifier tagged cell lines,
    and a positive control tagged line. DMSO-treated samples serve as vehicle controls across
    all AP-MS experiments (Unpublished data). The crate declares a content size of 532.5 GB
    and inventories 723 entities, of which 718 are dataset (file) entities recorded as computation
    outputs, alongside 2 schemas, 1 sample, 1 instrument and 1 experiment; 138 sample entities
    are recorded as inputs.
  path: AP-MS/apms-vorinostat-rocrate
- id: https://fairscape.net/api/ark:59853/rocrate-untreated-if-data-release
  name: Untreated IF Images
  description: Spatial localization of 464 proteins of interest in untreated cells of the
    breast cancer cell line MDA-MB-468 as imaged by immunofluorescence-based staining (ICC-IF)
    and confocal microscopy in the Lundberg Lab at Stanford University. Nuclei were stained
    with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow channel);
