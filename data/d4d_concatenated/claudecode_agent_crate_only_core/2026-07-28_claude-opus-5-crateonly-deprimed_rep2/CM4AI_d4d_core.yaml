missing_data_documentation:
- name: Documented missing and withheld data
  missing_data_patterns:
  - Some datasets are under temporary pre-publication embargo.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq
    data interrogate sets of proteins which incompletely overlap.
  - Computed cell maps not included in this release.
  missing_data_causes:
  - Temporary pre-publication embargo on parts of the release.
  - The release is interim and not in completed final form; predicted cell maps are planned
    for future releases.
  handling_strategy: The dataset will be regularly updated and augmented on a quarterly basis
    through the end of the project in November 2026, at which point embargoed and computed
    content is expected to be added.
