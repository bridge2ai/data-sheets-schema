  source_type:
  - laboratory imaging acquisition
  access_details: Distributed within the release crate under Images/untreated, Images/paclitaxel
    and Images/vorinostat.
  raw_data_format:
  - image/jpeg
sampling_strategies:
- name: Cell-line and perturbation sampling design
  is_sample: true
  is_representative: false
  source_data:
  - KOLF2.1J human induced pluripotent stem cell line (Cellosaurus CVCL_B5P3)
  - MDA-MB-468 human breast cancer cell line (Cellosaurus CVCL_0419)
  strategies:
  - Expressed genome-scale CRISPRi perturbation covering 11,739 targeted genes in KOLF2.1J
    iPSCs.
  - Immunofluorescence imaging of 464 proteins of interest per treatment condition in MDA-MB-468
    cells.
  - SEC-MS across four KOLF2.1J differentiation states with sample groups Parental (reps 1-4),
    NPC (reps 1-2), Neuron (reps 1-3) and Cardio (reps 1-2).
  - SEC-MS in MDA-MB-468 cells across three control, three paclitaxel and three vorinostat
    experiments.
  - AP-MS in four biological replicates, each batch comprising an untagged parental control,
    10 chromatin modifier tagged cell lines and a positive control tagged line, with DMSO
    vehicle controls.
  why_not_representative:
  - Data in this release was derived from commercially available de-identified human cell
    lines, and does not represent all biological variants which may be seen in the population
    at large.
  representative_verification:
  - The crate does not record any verification of representativeness.
raw_sources:
- name: MassIVE FTP endpoint for the treated MDA-MB-468 SEC-MS raw data
  access_url: ftp://massive-ftp.ucsd.edu/v10/MSV000098237/
  raw_data_details:
  - The crate records this FTP location as the content URL for the SEC-MS collection on vorinostat-
    and paclitaxel-treated MDA-MB468 cells.
- name: Retention of raw data alongside derived products
  raw_data_details:
  - Raw acquisitions are retained and packaged with their derived products; component crates
    record both the raw instrument outputs and the computations that produced derived reports,
    linked through the crate provenance graphs.
preprocessing_strategies:
- name: SEC-MS raw data processing
  preprocessing_details:
  - Raw SEC-MS data were processed using Spectronaut; downstream analysis was conducted in
    R using MSstats-compatible formats.
  used_software:
  - id: d4d:software-spectronaut
    name: Spectronaut
    description: Used for quantitative analysis of SEC-MS raw data acquired on the Bruker
      timsTOF platform.
  - id: d4d:software-r
    name: R
    description: Used for downstream analysis of processed SEC-MS data in MSstats-compatible
      formats.
- name: Perturb-seq aggregation
  preprocessing_details:
  - The Perturbation Cell Atlas collection records a data-processing computation that aggregates
    90 input dataset entities into pan-genome aggregated data outputs, including a reduced-size
    variant.
- name: Provenance-tracked packaging
  preprocessing_details:
  - CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using the FAIRSCAPE framework (fairscapeVersion 1.1.3), conforming
    to RO-Crate 1.2 and using Croissant RAI properties.
  used_software:
  - id: d4d:software-fairscape
    name: FAIRSCAPE
    version: 1.1.3
    description: Framework used to package CM4AI output data as RO-Crates with provenance
      graphs and rich metadata.
