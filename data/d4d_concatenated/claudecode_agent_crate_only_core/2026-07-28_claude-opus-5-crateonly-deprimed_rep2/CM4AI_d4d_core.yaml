id: https://fairscape.net/api/ark:59853/project-cell-maps-for-artificial-intelligence-qTdsTBd3FtA
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence (CM4AI) data-release programme (ongoing quarterly
  release series)
description: Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) is the Functional Genomics
  Grand Challenge in the NIH Bridge2AI program. The programme publishes AI-ready datasets
  of human cell architecture, packaged with provenance graphs and rich metadata in RO-Crate
  format using the FAIRSCAPE framework, and releases them as a cumulative quarterly release
  series through the end of the project in November 2026. Each release aggregates modality-level
  data collections spanning CRISPRi perturb-seq in undifferentiated KOLF2.1J iPSCs; SEC-MS
  in undifferentiated KOLF2.1J iPSCs and iPSC-derived neural progenitor cells, neurons and
  cardiomyocytes; AP-MS in MDA-MB-468 breast cancer cells under chemotherapy (vorinostat and
  paclitaxel); and immunofluorescence images of MDA-MB-468 cells in the presence and absence
  of chemotherapy. The current release described here is the June 2026 Data Release (Beta),
  published 2026-06-30. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham,
  Simon Fraser University, and the Hastings Center.
purposes:
- name: Functional Genomics Grand Challenge of the NIH Bridge2AI program
  response: CM4AI is the Functional Genomics Grand Challenge in the NIH Bridge2AI program.
    It produces AI-ready datasets of human cell architecture, packaged with provenance graphs
    and rich metadata in RO-Crate format using the FAIRSCAPE framework, and augments them
    regularly through the end of the project.
- name: Declared data use cases
  response: 'AI-ready datasets to support research in functional genomics, AI/machine learning
    model training, cellular process analysis, cell architectural changes, and interactions
    in presence of specific disease processes, treatment conditions, or genetic perturbations.
    A major goal is to enable biologically-driven, interpretable ML applications, for example
    as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).'
tasks:
- name: Map transcriptional and fitness phenotypes under genome-scale CRISPRi perturbation
  response: Build an expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human
    induced pluripotent stem cells mapping transcriptional and fitness phenotypes associated
    with 11,739 targeted genes.
- name: Map protein-protein interaction networks by SEC-MS
  response: Use size exclusion chromatography coupled with mass spectrometry to map multiscale
    biological organization and protein complex reorganization across KOLF2.1J iPSC differentiation
    states (parental, neural progenitor cells, neurons, cardiomyocytes) and in MDA-MB-468
    breast cancer cells following vorinostat or paclitaxel treatment.
- name: Map subcellular protein localization by immunofluorescence imaging
  response: Image the spatial localization of 464 proteins of interest in MDA-MB-468 breast
    cancer cells, untreated and treated with paclitaxel or vorinostat, using immunofluorescence-based
    staining (ICC-IF) and confocal microscopy.
- name: Profile drug-induced interactome rewiring by AP-MS
  response: Profile chromatin modifier interactome rewiring in endogenously tagged MDA-MB-468
    cells under paclitaxel and vorinostat perturbation using affinity purification mass spectrometry.
addressing_gaps:
- name: Interpretable, biologically-driven machine learning on cell architecture
  response: 'The data are assembled to close the gap between molecular measurements and interpretable
    machine learning over cell architecture: a major stated goal is to enable biologically-driven,
    interpretable ML applications, for example as proposed in Ma et al. 2018 (PMID: 29505029)
    and Kuenzi et al. 2020 (PMID: 33096023). Predicted cell maps, the integrative product
    these measurements are intended to support, are not yet included and are planned for future
    releases.'
