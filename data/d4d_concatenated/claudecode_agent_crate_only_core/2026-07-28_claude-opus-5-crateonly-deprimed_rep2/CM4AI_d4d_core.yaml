instances:
- name: CRISPRi Perturb-seq single-cell transcriptomes in KOLF2.1J iPSCs
  instance_type: single-cell RNA-sequencing profiles of CRISPRi-perturbed induced pluripotent
    stem cells
  data_topic: http://edamontology.org/topic_3170
  description: Expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced
    pluripotent stem cells mapping transcriptional and fitness phenotypes associated with
    11,739 targeted genes. Raw sequence data are recorded across 192 sample entities and 103
    output dataset entities; aggregated pan-genome data are derived from 90 input dataset
    entities.
  missing_information:
  - missing:
    - Raw sequence data for the Perturbation Cell Atlas
    why_missing:
    - The crate records the access URL for the raw sequence data collection as "Embargoed".
- name: Immunofluorescence confocal images of MDA-MB-468 cells
  instance_type: four-channel confocal immunofluorescence images
  data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D005453
  description: Images of the spatial localization of 464 proteins of interest per condition,
    in untreated, paclitaxel-treated and vorinostat-treated MDA-MB-468 cells. Channels are
    DAPI (blue, nuclei), calreticulin antibody (yellow, endoplasmic reticulum), tubulin antibody
    (red, microtubules) and antibody against the protein of interest (green).
- name: SEC-MS protein correlation profiling runs
  instance_type: size-exclusion-chromatography mass-spectrometry fractions and quantitative
    reports
  data_topic: http://edamontology.org/topic_0121
  description: KOLF2.1J differentiation series with sample groups Parental (reps 1-4), NPC
    (reps 1-2), Neuron (reps 1-3) and Cardio (reps 1-2), acquired on a Bruker timsTOF platform;
    and MDA-MB-468 treatment series with three control, three paclitaxel and three vorinostat
    experiments each yielding a report.
- name: AP-MS affinity purification runs in endogenously tagged MDA-MB-468 cells
  instance_type: affinity purification mass spectrometry acquisitions
  data_topic: http://edamontology.org/topic_0121
  description: Four biological replicates per experiment. Each AP-MS batch includes an untagged
    parental control, 10 chromatin modifier tagged cell lines and a positive control tagged
    line, with DMSO-treated vehicle controls, under paclitaxel and vorinostat perturbation.
anomalies:
- name: Inconsistent aggregate size statements in the crate metadata
  anomaly_details:
  - The release crate declares contentSize "19.9 TB" while the same entity declares evi:totalContentSizeBytes
    21051331945400 bytes (approximately 21.05 TB decimal or 19.15 TiB). The two aggregate
    size statements are not mutually derivable, so the declared human-readable size and the
    machine-readable byte count disagree.
- name: Stale and conflicting release citations on component collections
  anomaly_details:
  - Component data collections carry citation strings naming the "Cell Maps for Artificial
    Intelligence - March 2025 Data Release (Beta)" rather than the release they are declared
    to be part of, and those citation strings give two different DOIs for that same named
    release (https://doi.org/10.18130/V3/B35XWX and https://doi.org/10.18130/V3/K7TGEM).
- name: Author list and recommended citation do not agree
  anomaly_details:
  - The release crate's structured author list contains 47 entries and includes Marquez C,
    while the recommended citation string for the same release omits Marquez C and adds Park
    S and Zhao X.
- name: Internal disagreement on the number of SEC-MS differentiation stages
  anomaly_details:
  - The SEC-MS KOLF2 collection description announces "three distinct stages" and then enumerates
    four sample groups - Parental, NPC, Neurons and Cardio - with replicate counts given for
    all four.
- name: Typographic errors in crate metadata strings
  anomaly_details:
  - The ethicalReview field spells the ethics contact "Vardit Ravistky" while the crate's
    own person entity for the same ORCID gives "Ravitsky, V".
  - The author string of the perturb-seq raw sequence collection ends with "Idkeker T" where
    the equivalent string on the aggregated atlas collection gives "Ideker T".
  - The surname of ORCID 0000-0002-4180-422X appears as "Ballllosero Navarro, F" in the person
    entity and the release citation but as "Ballllosera Navarro F" in the IF image collection
    author lists.
  - The treated-cancer-cell SEC-MS collection gives its identifier as "https://doi.org/doi:10.25345/C5348GV4S",
    which doubles the DOI scheme; this record normalises it to https://doi.org/10.25345/C5348GV4S.
- name: Parent-release identifiers contain a trailing-comma artifact
  anomaly_details:
  - Several component collections declare parent releases using identifiers that end in a
    literal comma, for example "https://fairscape.net/api/ark:59853/rocrate-cell-maps-for-artificial-intelligence-June-2026-data-release,",
    alongside the same identifier without the comma. The trailing comma is a data-entry artifact
    in the crate.
known_biases:
- name: Cell-line-derived data do not represent population-level biological variation
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines, and does not represent all biological variants which may be seen in
    the population at large.
  affected_subsets:
  - All CM4AI modalities (perturb-seq, SEC-MS, AP-MS, IF imaging)
known_limitations:
- name: Interim release without predicted cell maps
  limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps,
    which will be added in future releases. The current release is most suitable for bioinformatics
    analysis of the individual datasets. Requires domain expertise for meaningful analysis.
  scope_impact: The integrative product of the programme is not yet available; users are limited
    to per-modality analysis of the individual datasets.
- name: Incomplete overlap of interrogated protein sets across modalities
  limitation_type: integration_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap.
  scope_impact: Cross-modality integration is only possible over the intersecting subset of
    proteins.
- name: Sparse file-level checksum coverage
  limitation_type: coverage_limitation
  limitation_description: The AI-readiness assessment records checksums for 8 of 55,859 entities
    (reported as 0% of files), and 0 entities carry summary statistics.
  scope_impact: Independent file-level integrity verification is not possible for nearly all
    distributed files.
- name: Pre-publication embargo on part of the release
  limitation_type: temporal_limitation
  limitation_description: These data are not yet in completed final form, and some datasets
    are under temporary pre-publication embargo. The raw sequence data collection for the
    Perturbation Cell Atlas records its access URL as "Embargoed".
  scope_impact: Some declared collections cannot be retrieved at the time of the release.
confidential_elements:
- name: Confidentiality level of the release
  confidential_elements_present: false
  confidentiality_details:
  - The release and every component collection declare confidentialityLevel "Unrestricted".
subpopulations:
- name: Human subpopulations
  subpopulation_elements_present: false
  identification:
  - No human subjects are involved; the data derive from commercially sourced de-identified
    cell lines (KOLF2.1J iPSC and MDA-MB-468) only, so no human subpopulations are identified
    in the data.
sensitive_elements:
- name: Sensitive or identifiable human data
  sensitive_elements_present: false
  sensitivity_details:
  - 'Human subject research: None - data collected from commercially available cell lines.'
  - Exempt - research with commercially available de-identified human cell lines does not
    constitute human subjects research.
acquisition_methods:
- name: Instrument-based observation with derived and validated products
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Data are directly observed by laboratory instrumentation - confocal microscopy for immunofluorescence
    imaging, Bruker timsTOF mass spectrometry for SEC-MS, mass spectrometry for AP-MS, and
    single-cell sequencing for CRISPRi perturb-seq.
  - Derived products are computed from the raw acquisitions; the crate records 1,976 computation
    or experiment steps and 6 software instances, including Spectronaut processing of SEC-MS
    raw data and downstream analysis in R using MSstats-compatible formats.
  - The Perturbation Cell Atlas findings were validated via phenotypic, protein-interaction
    and metabolic tracing assays.
  - No data are reported by human subjects; the data derive from cell lines.
collection_mechanisms:
- name: Declared data collection types
  mechanism_details:
  - Perturb-seq; IF imaging; SEC-MS; AP-MS.
  - Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab
    at Stanford University, with DAPI, calreticulin antibody, tubulin antibody and antibody
    against the protein of interest.
  - Size exclusion chromatography coupled with mass spectrometry acquired on a Bruker timsTOF
    platform, with quantitative analysis in Spectronaut.
  - Affinity purification mass spectrometry on endogenously tagged MDA-MB-468 cells in four
    biological replicates per batch.
  - 'Data collection processes are generally described in Clark T et al. (2024) "Cell Maps
    for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant
    Cell Lines" bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311.
    Additional data collection details will be subsequently published once finalized.'
collection_timeframes:
- name: Declared data collection timeframe for the current release
  start_date: '2022-09-01'
  end_date: '2026-06-01'
  timeframe_details:
  - The release crate declares a data collection timeframe of 9/1/2022 to 6/1/2026.
  - Component collections declare earlier end dates consistent with their own release lineage,
    namely 1/31/2026 for the AP-MS, treated-cancer-cell SEC-MS and perturb-seq atlas collections
    and 10/13/25 for the IF image collections and the perturb-seq raw sequence collection.
    All component collections declare the same 9/1/2022 start date.
