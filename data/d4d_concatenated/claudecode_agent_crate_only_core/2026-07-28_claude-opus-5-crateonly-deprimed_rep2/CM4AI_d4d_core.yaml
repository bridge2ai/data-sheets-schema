  access_details: MassIVE accessions MSV000101915 (AP-MS paclitaxel), MSV000101917 (AP-MS
    vorinostat), MSV000100676 (SEC-MS KOLF2.1J differentiation) and MSV000098237 (SEC-MS treated
    MDA-MB-468, retrievable at ftp://massive-ftp.ucsd.edu/v10/MSV000098237/).
  raw_data_format:
