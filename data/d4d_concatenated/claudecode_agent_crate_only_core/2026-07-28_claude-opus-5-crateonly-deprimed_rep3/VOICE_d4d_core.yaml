instances:
- id: b2ai-voice:instance-participant
  name: Participant
  instance_type: Human research participant
  counts: 833
  label: true
  label_description: Each participant carries clinical diagnostic labels for voice, neurological, mood
    and respiratory conditions recorded by clinical investigators and care teams, together with numerical
    and categorical scores derived from validated questionnaire instruments.
  description: Bridge2AI-Voice v3.0 contains data for 833 participants across five sites in North America.
    Participants were selected based on known conditions which manifest within the voice waveform including
    voice disorders, neurological disorders, mood disorders, and respiratory disorders.
- id: b2ai-voice:instance-recording-feature-record
  name: Recording-level derived feature record
  instance_type: Derived acoustic feature record for one recording
  description: Rows in the derived feature tables represent one recording of one task within one session,
    keyed by participant_id, session_id and task_name. Participants may contribute multiple sessions over
    time. The crate does not report a recording-level or session-level count.
anomalies:
- id: b2ai-voice:anomaly-incomplete-feature-extraction
  name: Derived features missing for some recordings
  anomaly_details:
  - Some derived audio features could not be computed for all recordings due to quality or length constraints,
    and features relating to free speech or sensitive records have been removed.
  - Additional filtering removes features for sensitive records and audio checks, and some derived features
    are dropped when processing fails or quality checks fail.
- id: b2ai-voice:anomaly-participant-id-type-inconsistency
  name: Inconsistent declared type for the participant_id key column
  anomaly_details:
  - The tabular schemas packaged in the crate declare participant_id as type "string" in the PPGs and
    SPARC feature schemas but as type "integer" in the Torchaudio spectrogram schema and in the phenotype
    schemas, so the primary linkage key does not have a single declared type across the release.
- id: b2ai-voice:anomaly-crate-entity-naming-mismatches
  name: Entity name and identifier mismatches in the crate metadata
  anomaly_details:
  - The entity ark:59853/b2ai-voice-dataset-feature-sparc-periodicity is named "sparc_loudness.parquet"
    although its contentUrl is file:///features/sparc_periodicity.parquet.
  - The entity ark:59853/b2ai-voice-dataset-feature-torchaudio-pitch is named "torchaudio_spectrogram.parquet"
    although its contentUrl is file:///features/torchaudio_pitch.parquet.
  - The entity ark:59853/b2ai-voice-dataset-phenotype-task is named "VOICE Questionnaire Tables", the
    same name used by ark:59853/b2ai-voice-dataset-phenotype-questionnaire.
  - Two distinct schema entities share the identifier ark:59853/b2ai-voice-schema-phenotype-confounders,
    one named "Phenotype Confounders Schema" and one named "Phenotype Demographics Schema".
  - The entity ark:59853/b2ai-voice-dataset-feature-sparc-pitch carries datePublished 08/18/2025 while
    every other released file entity carries 12/16/2025, the version 3.0.0 publication date.
- id: b2ai-voice:anomaly-placeholder-file-descriptions
  name: Placeholder descriptions on file-level entities
  anomaly_details:
  - Every feature-file entity carries the literal description "a datafile description" and every phenotype-file
    entity carries "A Dataset description", so the crate provides no substantive per-file documentation.
known_biases:
- id: b2ai-voice:bias-sampling
  name: Sampling bias
  bias_type: sampling_bias
  bias_description: Participants are recruited from specialty clinics and associated institutions using
    a non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
    English speakers; this produces clinically enriched case mixes that may not represent general population
    distributions.
- id: b2ai-voice:bias-geographic-cultural
  name: Geographic and cultural bias
  bias_type: representation_bias
  bias_description: Data are collected at a limited number of North American sites, and although the project
    seeks diversity, it may under-represent speakers from other regions, cultures, languages and healthcare
    systems; early releases focus on English, with Spanish protocols planned but not yet fully represented.
- id: b2ai-voice:bias-clinical-spectrum
  name: Clinical spectrum bias
  bias_type: selection_bias
  bias_description: Because participants are selected into disease cohorts where voice changes are expected,
    the prevalence and severity of conditions in the dataset differ from those in routine primary care
    or community settings, which may inflate model performance when evaluated within this dataset.
- id: b2ai-voice:bias-device-environment
  name: Device and environment bias
  bias_type: measurement_bias
  bias_description: Recordings are made using standardized but not identical hardware and primarily in
    clinical environments; future at-home collection or deployment on other devices may encounter different
    background noise, channel characteristics and user behavior.
- id: b2ai-voice:bias-machine-annotation
  name: Algorithmic bias in machine annotations
  bias_type: algorithmic_bias
  bias_description: Transcripts and some derived features rely on off-the-shelf models such as OpenAI
    Whisper and other audio toolkits whose performance may vary across demographic groups; the dataset
    team has not independently audited these tools for fairness, so downstream users should consider their
    biases when interpreting results.
  mitigation_strategy: The crate discloses the machine annotation tools used and states that they have
    not been independently audited for fairness.
known_limitations:
- id: b2ai-voice:limitation-feature-only-release
  name: Feature-only release without raw audio or free-speech transcripts
  limitation_type: scope_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may constrain the ability
    to reproduce end-to-end audio pipelines.
- id: b2ai-voice:limitation-adult-cohort-language
  name: Adult-only cohort and limited language coverage
  limitation_type: coverage_limitation
  limitation_description: This version only includes an adult cohort; models trained solely on this dataset
    may not generalize to younger age groups or to languages beyond those represented.
- id: b2ai-voice:limitation-deidentification-granularity
  name: Reduced variable granularity from de-identification
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed, which reduces the risk of re-identification
    but also limits detailed fairness assessments and certain confounder adjustments.
- id: b2ai-voice:limitation-no-splits-or-label-uncertainty
  name: No predefined splits, benchmarks or label-uncertainty measures
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train-validation-test splits or benchmarking
    tasks and does not include explicit per-instance label-uncertainty measures, so researchers must design
    their own evaluation protocols and handle label noise and missingness.
  recommended_mitigation: Researchers must design their own evaluation protocols and handle label noise
    and missingness.
- id: b2ai-voice:limitation-access-governance
  name: Access governance constrains participation and reproducibility
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers and can complicate the
    reproducibility of pipelines that require both features and raw audio.
confidential_elements:
- id: b2ai-voice:confidentiality
  name: Confidentiality of the released data
  confidential_elements_present: true
  confidentiality_details:
  - The crate records the confidentiality level as "Limited dataset available with Data Use Agreement".
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset.
  - Raw voice recordings, which are themselves biometric identifiers, are made available only under controlled
    access.
subpopulations:
- id: b2ai-voice:subpopulations
  name: Clinical cohorts and coarsened demographic groups
  subpopulation_elements_present: true
  identification:
  - Participants are enrolled into clinical cohorts; the crate packages disease-specific phenotype schemas
    for ADHD (adult), airway stenosis, amyotrophic lateral sclerosis, anxiety, benign lesions, bipolar
    disorder, cognitive impairment, control, COPD and asthma, depression, glottic insufficiency, laryngeal
    cancer, laryngeal dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous
    lesions, psychiatric history, PTSD (adult), unexplained chronic cough, and unilateral vocal fold paralysis.
  - Participants were selected based on known conditions which manifest within the voice waveform including
    voice disorders, neurological disorders, mood disorders, and respiratory disorders.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    while finer-grained geographic identifiers and many socio-economic and cultural details have been
    removed during de-identification.
sensitive_elements:
- id: b2ai-voice:sensitive-elements
  name: Personal and sensitive information in the dataset
  sensitive_elements_present: true
  sensitivity_details:
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory diseases,
    as well as symptom scores from questionnaires, which constitute sensitive personal health data.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    while finer-grained geographic identifiers, direct identifiers and many socio-economic and cultural
    details have been removed during de-identification to reduce re-identification risk.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset; raw voice recordings, which are themselves biometric identifiers, are made
    available only under controlled access.
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
acquisition_methods:
- id: b2ai-voice:acquisition-methods
  name: How data associated with each instance was acquired
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The crate records the data collection types as direct measurement, surveys, self-reporting, secondary
    data analysis and document analysis.
  - Voice, speech and respiratory audio was directly measured during standardized in-clinic tasks such
    as sustained vowels, coughs and reading passages.
  - Demographic questions, health history, disease-specific questionnaires and other patient-reported
    outcomes were self-reported by participants.
  - Clinical diagnoses and other metadata were extracted from electronic health records, and all released
    acoustic features are derived representations computed from the raw audio rather than the audio itself.
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues.
collection_mechanisms:
- id: b2ai-voice:collection-mechanisms
  name: Collection and capture mechanisms
  mechanism_details:
  - Data were captured on a mobile or tablet application and stored in REDCap, with most participants
    completing a single in-clinic session and a subset completing repeated sessions.
  - A custom Bridge2AI-Voice mobile and tablet application was used for in-clinic collection of acoustic
    tasks and questionnaires.
  - A REDCap-based data capture system was used to manage clinical and phenotype data.
  - Electronic health record systems were used as a source of some gold-standard diagnostic information.
  - Audio was recorded on tablet or smartphone devices with headset microphones when available.
collection_timeframes:
- id: b2ai-voice:collection-timeframe
  name: Data collection and release timeframe
  timeframe_details:
  - Data collection for the adult flagship cohort began after project launch in 2023 and is ongoing across
    five North American sites toward an anticipated enrollment of approximately 3,000 participants by
    November 2026; the participants and recordings included in dataset version 3.0.0 were collected roughly
    between 2023 and 2025.
  - 'Dataset releases are static snapshots: v1.0 (initial public release in 2024), v1.1 (2025-01-17),
    v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), each corresponding to a frozen state
    of the underlying data collection.'
data_collectors:
- id: b2ai-voice:data-collectors
  name: Clinical investigators, care teams and research staff
  role: Clinical investigators, care teams and research staff at participating institutions
  collector_details:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines.
  - Detailed demographic breakdowns of the staff who collected or entered data are not provided in the
    crate metadata.
missing_data_documentation:
- id: b2ai-voice:missing-data
  name: Missing data in the released tables
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  - Some derived audio features could not be computed for all recordings.
  missing_data_causes:
  - Variation in questionnaire completion by participant and cohort.
  - Audio quality or length constraints preventing computation of derived features.
  - Deliberate removal of features relating to free speech or sensitive records prior to release.
  handling_strategy: No additional imputation is applied in the released files; missing values are left
    explicit or the corresponding rows are omitted.
raw_data_sources:
- id: b2ai-voice:raw-data-source
  name: Raw study data underlying the release
  source_description: The original raw data consist of high-quality voice, speech and respiratory audio
    waveforms recorded on tablet or smartphone devices with headset microphones when available, plus responses
    to structured demographic and medical history questionnaires, disease-specific validated questionnaires
    and other patient-reported outcomes, together with clinical diagnoses and other metadata extracted
    from electronic health records.
  source_type:
  - Voice, speech and respiratory audio waveforms
  - Structured demographic and medical history questionnaires
  - Disease-specific validated questionnaires and patient-reported outcomes
  - Clinical diagnoses and metadata extracted from electronic health records
  access_details: The public feature-only PhysioNet release contains de-identified derived representations
    of the audio; access to the underlying raw audio is available only through a separate controlled-access
    process.
  raw_data_format:
  - Audio waveforms captured on tablet or smartphone devices with headset microphones
  - REDCap questionnaire and clinical records
sampling_strategies:
- id: b2ai-voice:sampling-strategy
  name: Participant sampling strategy
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Eligible adults presenting to voice, neurology, psychiatry and respiratory clinics at multiple specialty
    clinics and academic hospitals across North America, plus healthy controls.
  strategies:
  - Non-probability sampling with inclusion focused on specific disease cohorts and fluent English speakers.
  - Eligible adults were screened against predefined inclusion and exclusion criteria before enrollment.
  why_not_representative:
  - The non-probability sampling strategy produces clinically enriched case mixes that may not represent
    general population distributions.
  - Data are collected at a limited number of North American sites and may under-represent speakers from
    other regions, cultures, languages and healthcare systems.
  - Because participants are selected into disease cohorts where voice changes are expected, the prevalence
    and severity of conditions in the dataset differ from those in routine primary care or community settings.
raw_sources:
- id: b2ai-voice:raw-sources
  name: Availability of the raw data
  raw_data_details:
  - The public feature-only PhysioNet release contains de-identified derived representations of the audio,
    such as spectrograms, mel spectrograms, MFCCs, articulatory and prosodic features and phonetic posteriorgrams,
    along with tabular phenotype files and data dictionaries.
  - Access to the underlying raw audio is available only through a separate controlled-access process
    and is not part of this release.
preprocessing_strategies:
- id: b2ai-voice:preprocessing-audio-and-features
  name: Audio standardization and derived feature extraction
  preprocessing_details:
  - Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing filtering; they
    are then segmented by task and passed through quality checks.
  - From the standardized audio, multiple derived feature sets are computed including spectrograms, mel
    spectrograms, MFCCs, articulatory features using the Speech Articulatory Coding package, pitch and
    loudness estimates, acoustic features from openSMILE, phonetic and prosodic features from Praat and
    parselmouth, and phonetic posteriorgrams using a dedicated model; all are stored as dense tensors
    in Parquet files with participant, session and task identifiers.
  used_software:
  - id: ark:59853/b2ai-voice-software-b2aiprep
    name: B2AIPrep Library
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project.
- id: b2ai-voice:preprocessing-phenotype-etl
  name: Phenotype and questionnaire table preparation
  preprocessing_details:
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using a dedicated open-source
    b2aiprep library, reorganizing the former single phenotype table into thematically organized TSV files
    with accompanying JSON data dictionaries; static per-recording feature summaries are provided in static_features.tsv,
    and de-identification and filtering steps are applied before packaging.
  - The crate records this step as the computation "VOICE Phenotype Ingest", described as dumping and
    reformatting phenotype information from the REDCap database into b2ai-voice phenotype extracts.
  used_software:
  - id: ark:59853/b2ai-voice-software-b2aiprep
    name: B2AIPrep Library
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project.
cleaning_strategies:
- id: b2ai-voice:cleaning-strategy
  name: De-identification and filtering applied before release
  cleaning_details:
  - Prior to release, data are transformed to reduce re-identification risk and align with regulatory
    and ethical requirements.
  - Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or rebased; geographic
    information is generalized to the country level; narrative text fields and transcripts of free speech
    are removed; and raw voice waveforms are withheld from this feature-only release.
  - Additional filtering removes features for sensitive records and audio checks, and some derived features
    are dropped when processing fails or quality checks fail.
  - Audio segments are passed through quality checks after task segmentation.
labeling_strategies:
- id: b2ai-voice:labeling-strategy
  name: Clinical and questionnaire labeling
  data_annotation_protocol:
  - Annotations for this dataset consist primarily of clinical labels and questionnaire-derived measures
    associated with each participant and recording.
  - Participants complete validated instruments such as VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough
    questionnaires and voice instruments, which generate numerical scores and categorical indicators according
    to each instrument's published scoring guidelines.
  - Clinical investigators and care teams record diagnostic categories for voice, neurological, mood and
    respiratory conditions and other phenotype variables, drawing on clinical assessments and electronic
    health records; these labels are represented in disease-specific TSV files with accompanying JSON
    dictionaries.
  - In addition, machine-generated transcripts of certain voice tasks and numerous automatically extracted
    acoustic and articulatory features provide further labels and descriptors at the recording level.
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.
  annotations_per_item: 1
  inter_annotator_agreement: Diagnostic labels are derived from clinical assessments and electronic health
    records rather than crowd workers, so there is no explicit inter-rater majority-vote scheme, and per-annotator
    disagreement statistics are not included in the released dataset.
  annotator_demographics:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines; detailed demographic breakdowns
    of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves, whose demographics
    are captured in coarsened form in the phenotype tables, for example age bands, sex and country of
    data collection; however, per-annotator demographic information, such as which specific clinician
    or staff member entered a label, is not exposed.
  labeling_details:
  - Each recording is associated with one set of clinical labels and questionnaire responses derived from
    a single participant, although participants may contribute multiple sessions over time; there is no
    crowd-sourced labeling and the documentation does not report multiple independent human ratings per
    individual recording.
  - Instrument-level schemas packaged in the crate cover the custom affect scale, DSM-5 (adult), dyspnea
    index, GAD-7, the Leicester cough questionnaire, PANAS, PHQ-9, productive vocabulary, VHI-10, voice
    perception and voice problem severity.
imputation_protocols:
- id: b2ai-voice:imputation-protocol
  name: Imputation protocol
  imputation_method:
  - The public datasets do not apply global statistical imputation to missing fields; instead, missing
    questionnaire responses, phenotype variables and derived features are left as explicit missing values
    or omitted rows.
  imputation_rationale: The data release team audited missingness and users can implement study-specific
    imputation or complete-case strategies appropriate to their analyses.
  imputation_validation:
  - The data release team audited missingness across the released tables.
annotation_analyses:
- id: b2ai-voice:annotation-analysis
  name: Analysis of annotation quality
  analysis_method: Questionnaire-based labels are generated using the standard scoring rules for each
    validated instrument, yielding total and subscale scores that can be mapped to symptom-severity bands;
    the scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  disagreement_patterns:
  - Diagnostic labels are derived from clinical assessments and electronic health records rather than
    crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses are treated
    as reference labels and may include multiple comorbid conditions per participant.
  annotation_quality_details:
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues, but per-annotator disagreement statistics or detailed
    label-uncertainty measures are not presently included in the released dataset.
machine_annotation_tools:
- id: b2ai-voice:machine-annotation-tools
  name: Machine annotation and feature extraction tools
  tools:
  - openSMILE
  - Praat
  - parselmouth
  - TorchAudio
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram models
  - OpenAI Whisper Large
  - b2aiprep
  tool_descriptions:
  - OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including measures
    of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units for each
    recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and merging of
    phenotype data into the released files.
  tool_accuracy:
  - Transcripts and some derived features rely on off-the-shelf models such as OpenAI Whisper and other
    audio toolkits whose performance may vary across demographic groups; the dataset team has not independently
    audited these tools for fairness.
  used_software:
  - id: ark:59853/b2ai-voice-software-b2aiprep
    name: B2AIPrep Library
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project.
other_tasks:
- id: b2ai-voice:other-tasks
  name: Other tasks the dataset could be used for
  task_details:
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance on
    a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
    de-identified derived features, including work on representation learning, domain adaptation and multimodal
    integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
future_use_impacts:
- id: b2ai-voice:future-use-impacts
  name: Impacts on future uses
  impact_details:
  - The consortium explicitly recognizes the risks associated with voice data, including privacy loss,
    misuse of voice biometrics and algorithmic harms such as discrimination in hiring, insurance or surveillance
    contexts.
  - Dataset documentation and ongoing ethics workstreams are intended to help downstream users reason
    about these risks and design responsible analyses and models.
  - Because this version includes only an adult cohort, models trained solely on this dataset may not
    generalize to younger age groups or to languages beyond those represented.
  - Because participants are selected into disease cohorts where voice changes are expected, model performance
    measured within this dataset may be inflated relative to routine primary care or community settings.
discouraged_uses:
- id: b2ai-voice:discouraged-uses
  name: Uses the dataset should not be used for
  discouragement_details:
  - The dataset is explicitly not intended for operational decision making about specific individuals
    such as hiring, insurance pricing, law enforcement or surveillance, nor for attempts at re-identification
    or for uses likely to stigmatize individuals or groups.
intended_uses:
- id: b2ai-voice:intended-uses
  name: Intended research uses
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived features
    with diagnostic categories or symptom severity for conditions such as vocal fold pathology, neurological
    and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance on
    a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
    de-identified derived features, including work on representation learning, domain adaptation and multimodal
    integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
  use_category:
  - Clinical machine-learning model development
  - Algorithm benchmarking and validation
  - Exploratory acoustic and phenotypic research
  - Fairness, robustness and AI-safety methodology research
  usage_notes: All uses are subject to the ethical constraints in the registered-access license and data
    use agreement.
prohibited_uses:
- id: b2ai-voice:prohibited-uses
  name: Uses forbidden by the data use agreement
  prohibition_reason:
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
