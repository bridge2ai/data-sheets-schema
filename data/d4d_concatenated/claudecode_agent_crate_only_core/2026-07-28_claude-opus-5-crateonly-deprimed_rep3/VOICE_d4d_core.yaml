- id: b2ai-voice:purpose-accessible-low-cost-screening
  name: Support accessible, low-cost voice-based screening, diagnosis and monitoring
  description: Societal motivation recorded in the crate's responsible-AI social impact statement.
  response: The project aims to create an ethically sourced, diverse voice dataset to support research
    on using voice as an accessible, low-cost biomarker for screening, diagnosis and monitoring of a broad
    range of health conditions, potentially improving early detection and care for underserved populations.
tasks:
- id: b2ai-voice:task-voice-feature-diagnosis-modeling
  name: Associate voice-derived features with diagnostic categories and symptom severity
  response: Development, training and fine-tuning of machine-learning models that associate voice-derived
    features with diagnostic categories or symptom severity for conditions such as vocal fold pathology,
    neurological and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
addressing_gaps:
- id: b2ai-voice:gap-ethically-sourced-clinically-linked-voice-data
  name: Absence of an ethically sourced, diverse voice dataset linked to health information
  response: The human voice contains complex acoustic markers which have been linked to important health
    conditions including dementia, mood disorders, and cancer, and recent advances in artificial intelligence
    have provided techniques to extract previously unknown prognostically useful information from dense
    data elements. The project addresses the absence of an ethically sourced flagship voice dataset linked
    to corresponding clinical information by assembling voice recordings with detailed demographic, clinical
    and validated questionnaire data under an explicit ethics and governance framework.
