acquisition_methods:
- name: Instrument measurement with derived processing
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Primary data are directly measured by laboratory instruments: perturb-seq single-cell RNA sequencing,
    immunofluorescence confocal microscopy, SEC-MS, and AP-MS.'
  - Derived entities are produced by documented computations; the release records 1,976 computation or
    experiment steps and 6 software instances.
  - The perturbation cell atlas findings were validated via phenotypic, protein-interaction, and metabolic
    tracing assays.
collection_mechanisms:
- name: Modalities collected
  mechanism_details:
  - 'Data collection types recorded for the current release: Perturb-seq; IF imaging; SEC-MS; AP-MS. The
    SEC-MS KOLF2 differentiation crate records the same four-modality list; all seven other component
    crates, including both AP-MS crates, record a three-modality list that omits AP-MS.'
  - Immunofluorescence images were acquired by immunofluorescence-based staining (ICC-IF) and confocal
    microscopy, with DAPI for nuclei, a calreticulin antibody for endoplasmic reticulum, a tubulin antibody
    for microtubules, and an antibody against the protein of interest.
  - SEC-MS data for the iPSC differentiation series were acquired on a Bruker timsTOF platform with quantitative
    analysis in Spectronaut.
  - AP-MS data were generated from endogenously tagged MDA-MB-468 cells in four biological replicates
    per batch, each batch containing an untagged parental control, 10 chromatin modifier tagged cell lines,
    and a positive control tagged line, with DMSO vehicle controls.
sampling_strategies:
- name: Cell-line based sampling
  is_sample: true
  is_representative: false
  source_data:
  - Commercially available de-identified human cell lines, principally KOLF2.1J induced pluripotent stem
    cells (Cellosaurus CVCL_B5P3) and MDA-MB-468 breast cancer cells (Cellosaurus CVCL_0419).
  why_not_representative:
  - Data in this release was derived from commercially available de-identified human cell lines, and does
    not represent all biological variants which may be seen in the population at large.
  strategies:
  - Perturb-seq targets 11,739 genes at expressed genome scale in KOLF2.1J iPSCs.
  - IF imaging covers 464 proteins of interest per treatment condition in MDA-MB-468 cells.
  - SEC-MS covers four differentiation stages of KOLF2.1J with two to four replicates each, and control,
    paclitaxel, and vorinostat conditions in MDA-MB-468 with three replicates each.
