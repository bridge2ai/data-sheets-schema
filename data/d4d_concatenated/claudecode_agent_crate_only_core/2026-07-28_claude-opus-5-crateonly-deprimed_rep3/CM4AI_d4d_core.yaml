    and vorinostat conditions in three replicates each.
- name: AP-MS pulldown of an endogenously tagged chromatin modifier
  instance_type: Affinity purification mass spectrometry experiment
  data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D013058
  data_substrate: https://www.cellosaurus.org/CVCL_0419
  description: All AP-MS experiments were performed in four biological replicates. Each AP-MS batch includes
    an untagged parental control, 10 chromatin modifier tagged cell lines, and a positive control tagged
    line, with DMSO-treated samples as vehicle control. Batches were run under paclitaxel and under vorinostat
    perturbation. The source does not state a total instance count for this modality.
anomalies:
- name: Incomplete overlap of interrogated protein sets across modalities
  anomaly_details:
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data
    interrogate sets of proteins which incompletely overlap.
- name: Sparse checksum coverage
  anomaly_details:
  - The release records checksums for 8 of 55,859 entities, reported in the accompanying AI-readiness
    assessment as 0% of files having checksums.
- name: Embargoed and withheld content within the release
  anomaly_details:
  - Some datasets are under temporary pre-publication embargo; the raw sequence component records its
    access URL as "Embargoed" and carries an empty part manifest.
  - Computed cell maps are not included in this release.
known_biases:
- name: Cell-line derivation limits population representativeness
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified human cell
    lines, and does not represent all biological variants which may be seen in the population at large.
  affected_subsets:
  - All components; the release is built on the KOLF2.1J iPSC line and the MDA-MB-468 breast cancer line.
known_limitations:
