purposes:
- name: Functional Genomics Grand Challenge of the NIH Bridge2AI program
  response: CM4AI is the Functional Genomics Grand Challenge in the NIH Bridge2AI program. Its data releases
    exist to produce AI-ready maps of human cell architecture from disease-relevant cell lines, packaged
    with provenance graphs and rich metadata in RO-Crate format using the FAIRSCAPE framework.
- name: Enabling biologically-driven, interpretable machine learning
  response: 'A major goal is to enable biologically-driven, interpretable ML applications, for example
    as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).'
tasks:
- name: AI and machine learning model training
  response: The releases are described as AI-ready datasets to support AI/machine learning model training.
- name: Functional genomics research
  response: Support for research in functional genomics, cellular process analysis, cell architectural
    changes, and interactions in the presence of specific disease processes, treatment conditions, or
    genetic perturbations.
- name: Protein-protein interaction network mapping
  response: SEC-MS and AP-MS components support mapping of protein complexes and interaction networks,
    including their reorganization during iPSC differentiation and their rewiring in MDA-MB-468 cells
    under paclitaxel and vorinostat perturbation.
- name: Subcellular protein localization analysis
  response: IF imaging components support analysis of the spatial localization of 464 proteins of interest
    in MDA-MB-468 cells with and without chemotherapy.
- name: Genome-scale CRISPRi perturbation phenotyping
  response: Perturb-seq components map transcriptional and fitness phenotypes associated with 11,739 targeted
    genes in KOLF2.1J human induced pluripotent stem cells.
addressing_gaps:
- name: AI-ready, provenance-complete multimodal cell architecture data
  response: 'The releases package output data with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using the FAIRSCAPE framework, addressing the absence of machine-actionable, provenance-linked
    multimodal cell architecture data. A major stated goal is to enable biologically-driven, interpretable
    ML applications, for example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020
    (PMID: 33096023).'
- name: Gap remaining in the current release
  response: Predicted or computed cell maps are not included in the current release and are stated to
    be added in future releases; the current release is described as most suitable for bioinformatics
    analysis of the individual datasets.
