id: https://fairscape.net/api/ark:59853/project-cell-maps-for-artificial-intelligence-qTdsTBd3FtA
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence (CM4AI) Data Release Programme
description: Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) is the Functional Genomics Grand
  Challenge in the NIH Bridge2AI program, and is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UA
  Birmingham, Simon Fraser University, and the Hastings Center. This datasheet describes the CM4AI data-release
  programme as an ongoing quarterly release series rather than any single release. CM4AI output data are
  packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the
  FAIRSCAPE framework, and are published through the University of Virginia Dataverse with component raw
  data deposited to MassIVE, FigShare, and (embargoed) SRA. Releases are cumulative and are augmented
  on a quarterly basis through the end of the project in November 2026. The current release documented
  by this source is the June 2026 Data Release (Beta), which includes perturb-seq data in undifferentiated
  KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and cardiomyocytes;
  AP-MS data in MDA-MB-468 breast cancer cells in the presence of chemotherapy (vorinostat and paclitaxel);
  and IF images in MDA-MB-468 breast cancer cells in the presence and absence of chemotherapy (vorinostat
  and paclitaxel).
status: Beta (interim release; data not yet in completed final form)
