future_use_impacts:
- name: Composition and completeness affect future use
  impact_details:
  - The release is interim, does not contain predicted cell maps, and is described as most suitable for
    bioinformatics analysis of the individual datasets.
  - Some datasets are under temporary pre-publication embargo, so the retrievable content is narrower
    than the documented content.
  - Because modalities interrogate incompletely overlapping protein sets, cross-modality integration is
    constrained.
  - Because the data derive from two commercially available cell lines, conclusions may not transfer to
    the biological variation seen in the population at large.
intended_uses:
- name: AI-ready research uses
  examples:
  - AI/machine learning model training
  - Research in functional genomics
  - Cellular process analysis
  - Analysis of cell architectural changes
  - Analysis of interactions in the presence of specific disease processes, treatment conditions, or genetic
    perturbations
  use_category:
  - Research
  - Machine learning
  usage_notes: 'A major goal is to enable biologically-driven, interpretable ML applications, for example
    as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023). The current
    release requires domain expertise for meaningful analysis and is most suitable for bioinformatics
    analysis of the individual datasets.'
