- id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-paclitaxel
  name: EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468 Cells Upon Paclitaxel
    Perturbation
  description: Component crate of the June 2026 Data Release. Comprises affinity purification mass spectrometry
    (AP-MS) raw data generated from endogenously tagged MDA-MB-468 cells under Paclitaxel perturbation,
    focused on drug-induced interactome rewiring of chromatin modifiers relevant to the triple-negative
    breast cancer context. All AP-MS experiments were performed in four biological replicates. Each AP-MS
    batch includes an untagged parental control, 10 chromatin modifier tagged cell lines, and a positive
    control tagged line. DMSO-treated samples serve as vehicle control across all AP-MS experiments (unpublished
    data). Reported content size 441.2 GB. The crate manifest lists 560 parts, of which 555 are data entities
    and 5 are non-file entities (2 schemas, 1 sample, 1 instrument, 1 experiment); 117 sample inputs and
    555 dataset outputs are recorded in the provenance graph.
  path: AP-MS/apms-paclitaxel-rocrate/
