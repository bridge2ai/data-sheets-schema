instances:
- name: CRISPRi gene perturbation in KOLF2.1J iPSCs
  instance_type: Targeted gene perturbation profiled by single-cell RNA sequencing
  counts: 11739
  data_topic: http://edamontology.org/topic_3170
  data_substrate: https://www.cellosaurus.org/CVCL_B5P3
