- id: https://fairscape.net/api/ark:59853/rocrate-sec-ms-characterization-of-kolf2-neuronal-and-cardiomyocyte-differentiation-cm4ai-yjftt2oec6c
  name: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
  description: Component crate of the June 2026 Data Release. Mass spectrometry-based proteomics data
    investigating protein-protein interaction networks during differentiation of KOLF2.1J human induced
    pluripotent stem cells. Size Exclusion Chromatography coupled with Mass Spectrometry (SEC-MS) was
    used to map multiscale biological organization across parental undifferentiated iPSCs, neural progenitor
    cells, terminally differentiated neurons, and terminally differentiated cardiomyocytes, to identify
    how protein complexes and networks are reorganized during neuronal lineage commitment and cardiomyocyte
    differentiation. Sample groups are Parental (replicates 1-4), NPC (replicates 1-2), Neuron (replicates
    1-3), and Cardio (replicates 1-2). Data were acquired on a Bruker timsTOF platform; quantitative analysis
    was performed using Spectronaut and downstream analysis in R using MSstats-compatible formats. Reported
    content size 1.11 TB. The crate manifest lists 867 parts, of which 862 are data entities and 5 are
    non-file entities (2 schemas, 1 sample, 1 instrument, 1 experiment).
  path: mass-spec/iPSCs/
