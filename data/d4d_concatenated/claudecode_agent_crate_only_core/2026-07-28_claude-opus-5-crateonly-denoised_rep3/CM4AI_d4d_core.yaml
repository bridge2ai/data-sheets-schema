  instance_type: confocal immunofluorescence (ICC-IF) image sets
  data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D005453
  description: IF images in MDA-MB-468 breast cancer cells in the presence and absence of chemotherapy
    (vorinostat and paclitaxel). Each component IF crate states that it displays the spatial localization
    of 464 proteins of interest; nuclei were stained with DAPI (blue channel), endoplasmic reticulum with
    a calreticulin antibody (yellow channel), microtubules with tubulin antibody (red channel), and antibody
    against protein of interest (green channel). The crate reports 464 proteins of interest per IF component
    crate; it does not report a count of image instances, so no instance count is recorded here.
intended_uses:
- name: AI-ready datasets for functional genomics and machine learning
