    training, cellular process analysis, cell architectural changes, and interactions in presence of specific
    disease processes, treatment conditions, or genetic perturbations. A major goal is to enable biologically-driven,
    interpretable ML applications, for example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi
    et al. 2020 (PMID: 33096023).'
