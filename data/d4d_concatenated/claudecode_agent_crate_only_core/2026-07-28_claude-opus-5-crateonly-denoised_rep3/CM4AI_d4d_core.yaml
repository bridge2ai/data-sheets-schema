id: https://fairscape.net/api/ark:59853/rocrate-cell-maps-for-artificial-intelligence-June-2026-data-release
name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: This dataset is the June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI;
  CM4AI.org), the Functional Genomics Grand Challenge in the NIH Bridge2AI program. This Beta release
  includes perturb-seq data in undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J
  iPSCs and iPSC-derived NPCs, neurons, and cardiomyocytes; AP-MS data in MDA-MB-468 breast cancer cells
  in the presence of chemotherapy (vorinostat and paclitaxel); and IF images in MDA-MB-468 breast cancer
  cells in the presence and absence of chemotherapy (vorinostat and paclitaxel). CM4AI output data are
  packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the
  FAIRSCAPE framework. Data presented here will be augmented regularly through the end of the project.
  CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham, Simon Fraser University,
  and the Hastings Center.
acquisition_methods:
- name: Laboratory data generation described in an associated preprint
  acquisition_details:
  - 'Data collection processes are generally described in Clark T et al. (2024) "Cell Maps for Artificial
    Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell Lines" bioRxiv 2024.05.21.589311;
    doi: https://doi.org/10.1101/2024.05.21.589311. Additional data collection details will be subsequently
    published once finalized.'
  description: The crate points to an external preprint for its collection methodology rather than describing
    acquisition procedures inline.
at_risk_populations:
  name: At-risk population involvement
  at_risk_groups_included: false
  description: None — no human subjects involved; commercially sourced de-identified cell lines only.
collection_mechanisms:
- name: Data collection types recorded by the crate
  mechanism_details:
  - Perturb-seq
  - IF imaging
  - SEC-MS
  - AP-MS
  description: Recorded in the crate's rai:dataCollectionType field for the release as the single delimited
    string "Perturb-seq; IF imaging; SEC-MS; AP-MS". Several component crates record the same field without
    AP-MS.
- name: Confocal immunofluorescence imaging
  mechanism_details:
  - Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
    University.
  - Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow
    channel); microtubules with tubulin antibody (red channel); and antibody against protein of interest
    (green channel).
- name: SEC-MS acquisition and quantitation platform
  mechanism_details:
  - Data was acquired on a Bruker timsTOF platform, and quantitative analysis was performed using Spectronaut.
  description: Recorded in the component crate "SEC-MS characterization of KOLF2 neuronal and cardiomyocyte
    differentiation".
collection_timeframes:
- name: Release-level data collection timeframe
  start_date: '2022-09-01'
  end_date: '2026-06-01'
  timeframe_details:
  - 'Recorded by the crate for the June 2026 release as rai:dataCollectionTimeframe: 9/1/2022 to 6/1/2026.'
  - 'Component crates carry earlier end dates reflecting their own historical scope: the AP-MS and SEC-MS
    cancer-cell crates record 9/1/2022 to 1/31/2026, and the IF image and perturb-seq raw sequence crates
    record 9/1/2022 to 10/13/25.'
confidential_elements:
- name: Confidentiality level of the release
  confidential_elements_present: false
  confidentiality_details:
  - 'Confidentiality level recorded by the crate for the release and for every component RO-Crate: Unrestricted.'
