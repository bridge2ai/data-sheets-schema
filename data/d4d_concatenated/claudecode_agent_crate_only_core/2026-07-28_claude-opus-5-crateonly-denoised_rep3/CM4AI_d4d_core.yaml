known_biases:
- name: Cell-line derivation does not represent population-level biological variation
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified human cell
    lines, and does not represent all biological variants which may be seen in the population at large.
known_limitations:
- name: Interim release without predicted cell maps
  limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps, which will
    be added in future releases.
  scope_impact: Computed cell maps are not included in this release.
- name: Incomplete overlap across modalities
  limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap.
- name: Requires domain expertise; suited to per-dataset analysis
  limitation_type: methodological_limitation
  limitation_description: The current release is most suitable for bioinformatics analysis of the individual
    datasets. Requires domain expertise for meaningful analysis.
- name: Pre-publication embargo on some component datasets
  limitation_type: temporal_limitation
  limitation_description: These data are not yet in completed final form, and some datasets are under
    temporary pre-publication embargo.
  scope_impact: The component crate "Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells -
    Raw Sequence Data" records its access url as "Embargoed".
- name: Checksums recorded for only a small fraction of entities
  limitation_type: methodological_limitation
  limitation_description: The crate's AI-readiness self-assessment reports that checksums are present
    for 8 of 55859 entities.
