  instance_type: affinity purification mass spectrometry raw data from endogenously tagged cell lines
  data_topic: http://edamontology.org/topic_0121
  description: AP-MS data in MDA-MB-468 breast cancer cells in the presence of chemotherapy (vorinostat
    and paclitaxel). Component crates state that all AP-MS experiments were performed in four biological
    replicates, and that each AP-MS batch includes an untagged parental control, 10 chromatin modifier
    tagged cell lines, and a positive control tagged line, with DMSO-treated samples as vehicle controls.
