    owned by each subaward site for curation performed locally. Copyrights are jointly held for
    software jointly developed. All rights reserved."

regulatory_restrictions:
  description: >-
    Use must comply with HIPAA and NIH data-sharing policies, with NIH Bridge2AI OT terms, and with
    applicable federal regulations. The crate records the dataset as FDA-regulated and assigns
    confidentiality level HL7:2V (very restricted). Access is restricted to the secure enclave; no
    raw data export is permitted unless explicitly approved.

