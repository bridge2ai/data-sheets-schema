purposes:
  - description: >-
      To develop, under the NIH Bridge2AI program, a flagship multi-hospital, multimodal,
      high-resolution clinical dataset that harmonizes EHR data, imaging, high-resolution
      physiologic signals, and tokenized note and report text using standardized data models and
      governance frameworks.
  - description: >-
      To enable secure, auditable, and reproducible artificial intelligence research aimed at
      improving recovery from acute illness.
  - description: >-
      To support AI model development, validation, benchmarking, and translational research while
      maintaining compliance with HIPAA and NIH data-sharing policies.

tasks:
  - description: AI model development and training within the secure enclave.
  - description: Model validation and benchmarking of clinical AI algorithms.
  - description: Translational research on recovery from acute illness.

intended_uses:
  - description: AI model training within the enclave.
  - description: Model validation and benchmarking.
  - description: Algorithm development and feature engineering.
  - description: Retrospective hypothesis testing.
  - description: Fine-tuning of multimodal models.
  - description: Comparative effectiveness research.
  - description: Reinforcement learning and development of expert AI.
  - description: Methodological research in trustworthy AI.
  - description: Trial emulation or powering.
  - description: >-
      All usage must align with the approved research scope and CHoRUS governance policies.

discouraged_uses:
  - description: >-
      Direct translation of trained algorithms to real-time clinical deployment without validation
      or regulatory clearance (listed as not recommended).
  - description: Use as sole evidence for clinical decision-making (listed as not recommended).
  - description: >-
      Population inference beyond participating institutions (listed as not recommended; the
      dataset has limited generalizability beyond participating hospitals).

prohibited_uses:
  - description: >-
      Re-identification attempts are prohibited; the dataset is stated to be inappropriate for
      re-identification, contact tracing, or patient-level intervention.
  - description: >-
      Export of raw data outside the secure enclave environment is not permitted unless explicitly
      approved.
  - description: >-
      Data may not be used for commercial purposes unless specifically authorized through a
      separate agreement consistent with the governing award and consortium terms.

acquisition_methods:
  - description: >-
      Data are derived from routine clinical care at participating hospitals under IRB oversight.
      Data are not collected solely for research but repurposed from clinical workflows under
      ethical oversight; the resulting data are observational and not randomized. Data were not
      obtained through prospective research interactions with patients.

data_collectors:
  - description: >-
      Data are derived from routine clinical care at participating hospitals under IRB oversight.
      Copyrights are owned by each subaward site for curation performed locally, and institutional
      data stewards at contributing centers work with the CHoRUS Data Pillar, which the crate names
      as primary maintainer.

collection_mechanisms:
  - description: >-
      Electronic health record extraction and transformation to the OMOP common data model.
  - description: >-
      Imaging metadata de-identification using the RSNA Clinical Trial Processor and pixel-level
      de-identification using IbisWorks EICON.
  - description: >-
      High-resolution physiologic waveform capture, extraction, and transformation to the WFDB
      standard, including telemetry data and EEG where available.
  - description: >-
      Tokenization of note and report text via the OHNLP toolkit, with raw text retained locally at
      participating institutions.
  - description: Standardized harmonization to a common data model across participating sites.

raw_data_sources:
  - source_description: >-
      Electronic health records generated during routine clinical care at participating hospitals,
      extracted and transformed to the OMOP common data model.
  - source_description: >-
      Hospital waveform systems and middleware supplying high-resolution physiologic signals
      (including telemetry and EEG where available), transformed to the WFDB standard.
  - source_description: >-
      Clinical imaging, with metadata and pixel-level de-identification applied; no DICOM images are
      included in this interim release.
  - source_description: >-
      Clinical notes and reports, tokenized via the OHNLP toolkit, with raw text retained locally
      across participating institutions rather than distributed.

preprocessing_strategies:
  - description: >-
      Transformation of extracted EHR data to the OMOP common data model and standardized
      harmonization across contributing institutions.
  - description: >-
      Transformation of high-resolution physiologic waveform capture to the WFDB standard.
  - description: >-
      De-identification of imaging metadata with the RSNA Clinical Trial Processor and pixel-level
      de-identification with IbisWorks EICON.
  - description: >-
      Tokenization of note and report text using the OHNLP toolkit, with raw text retained locally.

instances:
  - description: >-
      Instances derive from patients and their clinical encounters at participating hospitals,
      represented across modalities: EHR records in the OMOP common data model, high-resolution
      physiologic signals in WFDB format, imaging (metadata de-identified), and tokenized note and
      report text. This interim release does not include all patients in the CHoRUS full cohort.
      Hold-out splits are available for testing; training and validation occur in development
      splits, which require internal mechanisms to avoid overfitting.

anomalies:
  - description: >-
      Variable sampling rates across real-world data drawn from hospital waveform systems and
      middleware.
  - description: >-
      Institutional heterogeneity in coding and clinical data collection practices across
      contributing centers.
  - description: >-
      Documentation quality is dependent on routine clinical workflows and on which data elements
      are captured in clinical practice.

missing_data_documentation:
  - description: >-
      Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
  - description: >-
      Variable sampling rates across real-world data from hospital waveform systems and middleware
      are documented as the dataset's missing-data/quality condition.
  - description: >-
      Completeness: interim release with partial data; not all patients in the CHoRUS full cohort
      are included and no DICOM images are included.

known_biases:
  - description: Referral bias from tertiary/quaternary academic centers.
  - description: >-
      Socioeconomic and demographic distribution reflective of participating institutions.
  - description: Documentation bias in clinical notes.
  - description: Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
  - description: >-
      Differential care pathways affecting label assignment (e.g., ICU vs non-ICU populations).
  - description: Temporal trends related to evolving clinical practice.
  - description: >-
      Bias assessment is ongoing and is documented in the dataset release notes.

known_limitations:
  - description: >-
      Observational data, not randomized; collected as real-world clinical data rather than through
      prospective research interactions with patients.
  - description: >-
      Documentation quality is dependent on routine clinical workflows and on the data elements
      collected in clinical practice.
  - description: >-
      Variable sampling rates across real-world data from hospital waveform systems and middleware.
  - description: Institutional heterogeneity in coding and clinical data collection practices.
  - description: Limited generalizability beyond participating hospitals.
  - description: >-
      Not appropriate for re-identification, contact tracing, or patient-level intervention.
  - description: >-
      Hold-out splits are available for testing; training and validation in development splits
      require internal mechanisms to avoid overfitting.

sensitive_elements:
  - description: >-
      The dataset derives from clinical care records and is assigned confidentiality level
      HL7:2V (very restricted). Direct identifiers are removed or tokenized, dates are shifted or
      date fields limited when required, and de-identification is consistent with HIPAA Safe Harbor.
  - description: >-
      Raw clinical note and report text is retained locally at participating institutions; only
      tokenized text is carried in the harmonized dataset.

confidential_elements:
  - description: >-
      Confidentiality level HL7:2V (very restricted). Access is restricted to a secure enclave
      environment with role-based access control, multi-factor authentication, and full audit
      logging; no raw data export is permitted unless explicitly approved, and output review
      procedures are applied to reduce re-identification risk.

is_deidentified:
  description: >-
    The crate records the dataset as de-identified. De-identification is consistent with HIPAA Safe
    Harbor and includes removal or tokenization of direct identifiers, date shifting or limited date
    fields when required, imaging metadata de-identification via the RSNA Clinical Trial Processor,
    and pixel-level de-identification via IbisWorks EICON. Re-identification attempts are
    prohibited, and re-identification risk is periodically assessed with mitigation strategies
    updated as needed.

human_subject_research:
  description: >-
    Human subject research: Yes. IRB of record is the Mass General Brigham Institutional Review
    Board (MGB IRB), protocol #2022P000707, with local context review by IRBs, HIPAA Privacy
    Officers, and institutional counsels at contributing medical centers. Human subject exemption
    recorded as "HIPAA exemption 4 ((45 CFR 46.104(d)(4))". The crate flags the dataset as
    FDA-regulated. IRB contact: IRB Reliance and Compliance, irbreliance@mgb.org, +1-857-282-1900,
    399 Revolution Drive, Suite 710, Somerville, MA 02145, US.

ethical_reviews:
  - description: >-
      Ethical review conducted by Eric S. Rosenthal, Michael J. Young, Ishan Williams, Ashley
      Cordes, and Barbara J. Evans in collaboration with the Mass General Brigham IRB, with local
      context review by IRBs, HIPAA Privacy Officers, and institutional counsels at contributing
      medical centers (IRB protocol #2022P000707).
  - description: >-
      Ethical safeguards for collection include IRB approval or waiver as appropriate, compliance
      with CHoRUS governance, and layered privacy protection (de-identification, data use
      agreement, controlled-access data repository adhering to NIST 800-53 principles, audit-level
      protection, registration, role-based access controls, and protection against data
      exfiltration).
  - description: >-
      Data governance committee contact: Eric Rosenthal, EROSENTHAL@mgh.harvard.edu.

data_protection_impacts:
  - description: >-
      CHoRUS operates within a secure enclave environment aligned with NIST 800-53 controls, with
      role-based access control, multi-factor authentication, full audit logging of data access and
      queries, prohibition of re-identification attempts, and data export restrictions with output
      review procedures. Re-identification risk is periodically assessed and mitigation strategies
      are updated as needed.

license_and_use_terms:
  description: >-
    Governed by a Data Use Agreement available at https://chorus4ai.org/dataset/; the executable
    agreement is posted at
    https://chorus4ai.org/wp-content/uploads/2025/10/Data-Agreement-9.30.2025.docx. Access to
    CHoRUS data is governed through a controlled-access framework requiring institutional
    affiliation and credentials, an approved research proposal reviewed by the CHoRUS governance
    committee, an executed DUA between the requestor institution and CHoRUS, IRB approval or
    exemption documentation as applicable, and compliance with NIH Bridge2AI OT terms and
    applicable federal regulations. Access is restricted to the secure enclave environment and
    no raw data export is permitted unless explicitly approved. Data may not be used for commercial
    purposes unless specifically authorized through a separate agreement.

