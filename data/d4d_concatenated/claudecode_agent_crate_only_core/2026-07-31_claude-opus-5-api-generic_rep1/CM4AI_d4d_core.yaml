sampling_strategies:
  - description: >-
      Immunofluorescence imaging covers the spatial localization of 464 selected proteins of
      interest in MDA-MB-468 cells, imaged under three conditions (untreated, paclitaxel,
      vorinostat).
  - description: >-
      The CRISPRi Perturbation Cell Atlas is an expressed genome-scale screen mapping
      transcriptional and fitness phenotypes for 11,739 targeted genes in KOLF2.1J hiPSCs.
  - description: >-
      AP-MS experiments were performed in four biological replicates; each batch comprised
      an untagged parental control, 10 chromatin-modifier tagged cell lines and a positive
      control tagged line, with DMSO vehicle controls.
  - description: >-
      SEC-MS of KOLF2 differentiation sampled four stages with unequal replication: Parental
      (replicates 1-4), NPC (replicates 1-2), Neuron (replicates 1-3), Cardio (replicates
      1-2).
  - description: >-
      The crate notes that the SEC-MS, IF imaging and CRISPRi perturb-seq modalities
      interrogate sets of proteins which only incompletely overlap.

instances:
  - description: >-
      The release aggregates 55,859 recorded entities, of which 53,877 are dataset entities,
      1,976 are computation or experiment steps, 6 are software instances and 20 are
      schemas.
  - description: >-
      Immunofluorescence instances are individual channel images per field of view, named by
      condition, plate well, replicate, z-plane and channel (for example
      B2AI_5_Paclitaxel_H12_R8_z01_blue / _red / _yellow / _green). Each imaging crate
      records 468 experiment entities and a further 465 entities sharing a "b2ai"
      identifier family, whose entity type is not stated in the crate evidence.
  - description: >-
      Mass spectrometry instances are per-run raw acquisition files and derived reports
      (e.g. 555 output dataset entities for the paclitaxel AP-MS submission and 718 for the
      vorinostat AP-MS submission; nine per-condition report datasets for the MDA-MB-468
      SEC-MS submission).
  - description: >-
      Perturb-seq instances are per-chip, per-channel sequencing datasets (103 raw sequence
      output datasets derived from 192 sample entities) and an aggregated pan-genome
      dataset with a full and a small variant.
  - description: >-
      Imaging entities are linked to cell line, treatment and stain entities (for example
      cell-line-MDA-MB-468, treatment-paclitaxel, treatment-vorinostat, treatment-control,
      stain-dapi, stain-calreticulin-antibody).

anomalies:
  - description: >-
      Incomplete modality overlap: protein-protein interaction (SEC-MS), protein
      localization (IF imaging) and CRISPRi perturb-seq data interrogate sets of proteins
      which incompletely overlap.
  - description: >-
      Embargo-driven incompleteness: some component datasets are under temporary
      pre-publication embargo, and the raw sequence data crate for the Perturbation Cell
      Atlas records its access URL simply as "Embargoed".
  - description: >-
      Sparse checksum coverage: the AI-readiness assessment reports that only 8 of 55,859
      entities (0%) carry checksums, limiting file-level verifiability.
  - description: >-
      Format heterogeneity: the recorded format list includes an "unknown" category
      alongside .d, .d directory group, .tsv, .xml, TSV, csv, executable, fastq.gz, h5,
      h5ad, image/jpeg and pdf.
  - description: >-
      The AI-readiness assessment reports 0 entities with summary statistics
      (evi:entitiesWithSummaryStats = 0).

subpopulations:
  - description: >-
      MDA-MB-468 (Cellosaurus CVCL_0419), a triple-negative human breast cancer cell line,
      is the substrate for the IF imaging, AP-MS and treated SEC-MS components, under
      untreated, paclitaxel and vorinostat conditions.
  - description: >-
      KOLF2.1J (Cellosaurus CVCL_B5P3), a human induced pluripotent stem cell line, is the
      substrate for the CRISPRi perturb-seq atlas and for undifferentiated SEC-MS profiling.
  - description: >-
      iPSC-derived differentiated states profiled by SEC-MS: neural progenitor cells (NPC),
      terminally differentiated neurons, and terminally differentiated cardiomyocytes.

known_biases:
  - description: >-
      Data in this release was derived from commercially available de-identified human cell
      lines, and does not represent all biological variants which may be seen in the
      population at large.

known_limitations:
  - description: >-
      This is an interim release. It does not contain predicted cell maps, which will be
      added in future releases.
  - description: >-
      The current release is most suitable for bioinformatics analysis of the individual
      datasets, and requires domain expertise for meaningful analysis.
  - description: >-
      These data are not yet in completed final form, and some datasets are under temporary
      pre-publication embargo.

missing_data_documentation:
  - description: >-
      Recorded missing data: some datasets are under temporary pre-publication embargo;
      protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
      perturb-seq data interrogate sets of proteins which incompletely overlap; computed
      cell maps are not included in this release.

sensitive_elements:
  - description: >-
      No sensitive personal data elements are declared. The crate records human subject
      research as "None - data collected from commercially available cell lines" and
      characterizes the cell lines as de-identified.

confidential_elements:
  - description: >-
      Confidentiality level of the release and of every component RO-Crate is declared as
      "Unrestricted". The only access constraint recorded is the temporary pre-publication
      embargo affecting some component datasets, notably the Perturbation Cell Atlas raw
      sequence data whose access URL is listed as "Embargoed".

