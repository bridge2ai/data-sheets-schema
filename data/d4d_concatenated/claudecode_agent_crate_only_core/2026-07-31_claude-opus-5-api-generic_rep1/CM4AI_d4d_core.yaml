purposes:
  - description: >-
      To deliver the June 2026 Data Release of Cell Maps for Artificial Intelligence
      (CM4AI), the Functional Genomics Grand Challenge of the NIH Bridge2AI program,
      producing AI-ready maps of human cell architecture from disease-relevant cell lines.
  - description: >-
      To package multimodal functional-genomics output data (perturb-seq, SEC-MS, AP-MS,
      immunofluorescence imaging) with provenance graphs and rich metadata as AI-ready
      datasets in RO-Crate format using the FAIRSCAPE framework.
  - description: >-
      To characterize how protein complexes, protein localization, and interaction networks
      are reorganized under specific disease processes, chemotherapeutic treatment
      conditions (vorinostat, paclitaxel), and genetic (CRISPRi) perturbations.

tasks:
  - description: >-
      Research in functional genomics using the released perturb-seq, SEC-MS, AP-MS and
      immunofluorescence imaging data.
  - description: AI/machine learning model training on AI-ready multimodal cell data.
  - description: >-
      Cellular process analysis, and analysis of cell architectural changes and interactions
      in the presence of specific disease processes, treatment conditions, or genetic
      perturbations.
  - description: >-
      Biologically-driven, interpretable ("visible") machine learning, for example as
      proposed in Ma et al. 2018 (PMID 29505029) and Kuenzi et al. 2020 (PMID 33096023).
  - description: >-
      Bioinformatics analysis of the individual component datasets, which the crate states
      is the use the current interim release is most suitable for.

addressing_gaps:
  - description: >-
      Provides AI-ready datasets: CM4AI output data are packaged with provenance graphs and
      rich metadata in RO-Crate format via FAIRSCAPE, so that data, software and
      computations are explicitly linked within a machine-readable provenance graph.
  - description: >-
      Supplies the multimodal measurements (protein-protein interaction, protein
      localization, and CRISPRi transcriptional phenotypes on shared disease-relevant cell
      lines) needed to enable biologically-driven, interpretable machine learning
      applications.

acquisition_methods:
  - description: >-
      Directly observed laboratory measurement on commercially available human cell lines.
      The crate records four collection types for this release: Perturb-seq; IF imaging;
      SEC-MS; AP-MS.
  - description: >-
      CRISPRi perturb-seq: expressed genome-scale CRISPR interference screen in KOLF2.1J
      human iPSCs with single-cell RNA sequencing readout, targeting 11,739 genes.
  - description: >-
      Immunofluorescence imaging (ICC-IF): antibody-based staining and confocal microscopy
      of MDA-MB-468 cells, untreated and treated with paclitaxel or vorinostat.
  - description: >-
      Size exclusion chromatography coupled to mass spectrometry (SEC-MS) for protein
      correlation profiling, applied to KOLF2.1J iPSCs and iPSC-derived NPCs, neurons and
      cardiomyocytes, and to treated MDA-MB-468 cells.
  - description: >-
      Affinity purification mass spectrometry (AP-MS) on endogenously tagged ("EndoTag")
      MDA-MB-468 cells under paclitaxel or vorinostat perturbation.
  - description: >-
      No human participants were involved: the crate states data were collected from
      commercially available de-identified human cell lines (KOLF2.1J iPSC, Cellosaurus
      CVCL_B5P3, and MDA-MB-468, Cellosaurus CVCL_0419) obtained from third party commercial
      suppliers rather than generated through primary human subjects research.

collection_mechanisms:
  - description: >-
      Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab
      at Stanford University. Four channels were acquired per field: nuclei stained with
      DAPI (blue), endoplasmic reticulum with a calreticulin antibody (yellow), microtubules
      with a tubulin antibody (red), and an antibody against the protein of interest
      (green).
  - description: >-
      SEC-MS acquisition on a Bruker timsTOF platform with quantitative analysis performed
      using Spectronaut (KOLF2 differentiation dataset).
  - description: >-
      AP-MS acquisition from endogenously tagged cell lines; each AP-MS batch includes an
      untagged parental control, 10 chromatin-modifier tagged cell lines, and a positive
      control tagged line, with DMSO-treated samples as vehicle controls.
  - description: >-
      Single-cell RNA sequencing of CRISPRi-perturbed KOLF2.1J iPSCs, organized in the crate
      by library chip and channel (e.g. alpha/beta/gamma chips, CRISPR and GEX libraries).
  - description: >-
      Instrument, sample and experiment entities are recorded explicitly in the component
      RO-Crates (e.g. instrument-msv000101915-1, sample-msv000100676-kolf2-1j) and linked
      through the FAIRSCAPE evidence graph, in which sample entities are inputs to
      experiment and computation entities that produce dataset outputs.

collection_timeframes:
  - description: >-
      Overall data collection timeframe recorded for this release: 9/1/2022 to 6/1/2026.
  - description: >-
      Component crates record their own timeframes: 9/1/2022 to 1/31/2026 for the two
      EndoTag AP-MS crates, the MDA-MB-468 SEC-MS crate and the aggregated perturb-seq atlas
      crate; 9/1/2022 to 10/13/25 for the three immunofluorescence imaging crates and the
      perturb-seq raw sequence crate; and 9/1/2022 to 6/1/2026 for the SEC-MS
      characterization of KOLF2 neuronal and cardiomyocyte differentiation.

