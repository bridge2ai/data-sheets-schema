      Confocal immunofluorescence image acquisitions produced in the Lundberg Lab at
      Stanford University for untreated (3.2 GB), paclitaxel-treated (2.6 GB) and
      vorinostat-treated (2.8 GB) MDA-MB-468 cells.

preprocessing_strategies:
  - description: >-
      SEC-MS raw data were processed using Spectronaut; downstream analysis was conducted in
      R using MSstats-compatible formats.
  - description: >-
      Perturb-seq per-chip, per-channel molecule datasets (90 input datasets) were combined
      by a recorded computation (computation-perturbation-cell-atlas-data-processing) into
      an aggregated pan-genome dataset, released in a full and a small variant.
  - description: >-
      Across the release, 1,976 computation or experiment steps and 6 software instances are
      documented in the FAIRSCAPE provenance graph, and 20 schemas describe processed
      tabular outputs.

intended_uses:
  - description: >-
      AI-ready datasets to support research in functional genomics, AI/machine learning
      model training, cellular process analysis, cell architectural changes, and
      interactions in presence of specific disease processes, treatment conditions, or
      genetic perturbations.
  - description: >-
      A major stated goal is to enable biologically-driven, interpretable ML applications,
      for example as proposed in Ma et al. 2018 (PMID 29505029) and Kuenzi et al. 2020
      (PMID 33096023).

prohibited_uses:
  - description: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval. This
      restriction is repeated as usageInfo and as a prohibitedUses statement on the release
      and on every component RO-Crate.

