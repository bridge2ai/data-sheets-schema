    lines does not constitute human subjects research. Component imaging crates additionally
    record the property "Human Subject: No".

informed_consent:
  - description: >-
      Not applicable - data collected from commercially available de-identified human cell
      lines (KOLF2.1J iPSC and MDA-MB-468). No primary human subjects research was conducted
      under this release.

at_risk_populations:
  description: >-
    None - no human subjects involved; commercially sourced de-identified cell lines only.

is_deidentified:
