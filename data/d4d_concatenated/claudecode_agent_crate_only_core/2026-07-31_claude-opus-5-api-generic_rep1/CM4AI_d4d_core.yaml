    name: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
    description: >-
      Mass spectrometry-based proteomics investigating protein-protein interaction networks
      during differentiation of KOLF2.1J human iPSCs, using size exclusion chromatography
      coupled with mass spectrometry (SEC-MS) for protein correlation profiling across four
      stages: undifferentiated parental iPSC (replicates 1-4), neural progenitor cells
      (replicates 1-2), terminally differentiated neurons (replicates 1-3), and terminally
      differentiated cardiomyocytes (replicates 1-2). Data acquired on a Bruker timsTOF
      platform; quantitative analysis performed using Spectronaut, with downstream analysis
      in R using MSstats-compatible formats. 1.11 TB; 867 recorded parts. Publisher recorded
      as MassIVE (accession MSV000100676).
