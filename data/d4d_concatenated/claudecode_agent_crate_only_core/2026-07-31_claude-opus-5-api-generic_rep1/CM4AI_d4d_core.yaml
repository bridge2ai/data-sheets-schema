  - source_description: >-
      MassIVE accession MSV000101917 - EndoTag AP-MS raw data from MDA-MB-468 cells under
      vorinostat perturbation (532.5 GB), at
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917
  - source_description: >-
      MassIVE accession MSV000100676 - SEC-MS characterization of KOLF2 neuronal and
      cardiomyocyte differentiation (1.11 TB), at
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676
  - source_description: >-
