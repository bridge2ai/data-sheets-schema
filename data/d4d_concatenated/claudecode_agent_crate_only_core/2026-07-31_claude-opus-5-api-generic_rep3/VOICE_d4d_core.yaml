publisher: PhysioNet

conforms_to: https://w3id.org/ro/crate/1.2

language: English

was_derived_from: |-
  Raw Bridge2AI-Voice voice, speech and respiratory audio waveforms, REDCap-captured demographic,
  medical-history and validated-questionnaire responses, and clinical diagnoses and metadata
  extracted from electronic health records. The released feature-only tier consists of de-identified
  derived representations computed from those raw recordings.

