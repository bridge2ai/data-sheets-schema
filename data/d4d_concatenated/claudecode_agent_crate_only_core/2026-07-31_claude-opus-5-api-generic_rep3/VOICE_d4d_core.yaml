  - description: >-
      torchaudio_mel_spectrogram.parquet, TorchAudio mel spectrograms. SHA-256
      178ece43a766cb2a85a0e87e78793d6a7bb2f0a6bd67135ec69f4f83d6467e22.
  - description: >-
      confounders.tsv, a tab-separated phenotype table of 547 columns covering medical history,
      medications, substance use, symptoms and voice-use variables, generated by the VOICE Phenotype
      Ingest computation. SHA-256
      dbc1ec63418802bc9306ee38d4e9bf71b67ff685594f4ffd59e70a39bb1fd75f.
  - description: >-
      demographics.tsv, a tab-separated phenotype table generated by the VOICE Phenotype Ingest
      computation. SHA-256 883e358cd6e1b63694e1a9483860e922f2b7b78c87516da59e538c600c0fe73d.
  - description: >-
      Grouped tab-separated phenotype tables generated by the VOICE Phenotype Ingest computation:
      VOICE Diagnosis Tables, VOICE Enrollment Tables, VOICE Questionnaire Tables and the acoustic
      task tables, covering conditions such as airway stenosis, amyotrophic lateral sclerosis,
      anxiety, benign and precancerous vocal fold lesions, bipolar disorder, cognitive impairment,
      controls, COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal
      dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, psychiatric history,
      PTSD, unexplained chronic cough and unilateral vocal fold paralysis, together with instruments
      including VHI-10, PHQ-9, GAD-7, PANAS, the Leicester Cough Questionnaire, the Dyspnea Index,
      the DSM-5 cross-cutting measure, a custom affect scale, Stroop, Winograd, productive
      vocabulary, voice perception and voice problem severity. The crate records no per-file byte
      counts for these grouped entries.
  - description: >-
      static_features.tsv, a per-recording summary table of 135 columns keyed by participant_id,
      session_id and task_name, containing a transcription column and openSMILE eGeMAPS-style
      descriptors together with Praat-derived measures and the speech quality metrics stoi, pesq and
      si_sdr. The crate describes this table through a schema entry only.

distribution_formats:
  - description: >-
      Derived acoustic features are distributed as dense tensors in Parquet files; tabular phenotype
      and questionnaire data are distributed as tab-separated-value files with accompanying JSON
      data dictionaries. The crate records a total content size of 12.9 GB.
  - description: >-
      The package is distributed as an RO-Crate whose metadata descriptor conforms to
      https://w3id.org/ro/crate/1.2, with per-table JSON Schema (draft 2020-12) descriptions for the
      feature and phenotype tables and SHA-256 checksums for the individual data files.

