license_and_use_terms:
  description: >-
    Released under the PhysioNet license at
    https://physionet.org/content/b2ai-voice/view-license/3.0.0/, with conditions of access defined
    by the data use agreement at https://physionet.org/content/b2ai-voice/view-dua/3.0.0/. Use of the
    data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or
    discriminatory uses and applications such as surveillance or high-stakes individual decision
    making. Per-table schema records in the crate carry a CC BY 4.0 license
    (https://creativecommons.org/licenses/by/4.0/).

ip_restrictions:
  description: "Copyright (c) 2026 University of South Florida, all rights reserved."

regulatory_restrictions:
  description: >-
    The crate records the dataset as not FDA regulated and as involving human subjects research that
    is not exempt. It is released with a confidentiality level of "Limited dataset available with
    Data Use Agreement", so access and permitted use are governed by that agreement rather than by
    open distribution.

maintainers:
  - name: Bridge2AI-Voice project team
    description: >-
      Coordinates dataset releases together with the MIT Laboratory for Computational Physiology.
      General contact is provided at https://b2ai-voice.org/contact-us/.
  - name: MIT Laboratory for Computational Physiology
    description: Co-coordinates release of the static versioned snapshots through PhysioNet.
  - name: Satrajit Ghosh
    description: Recorded in the crate as the data governance committee for the dataset.

updates:
  description: >-
    Dataset releases follow a static versioning scheme managed through PhysioNet and related
    platforms, with version numbers such as 1.0, 1.1, 2.0.0, 2.0.1 and 3.0.0 and associated DOIs for
    each snapshot and for the latest version. Releases are coordinated by the Bridge2AI-Voice project
    team and the MIT Laboratory for Computational Physiology; release notes document added
    participants, new feature sets, reorganized phenotype tables and corrections. Future updates are
    planned as additional participants are enrolled and Spanish-language protocols are incorporated.

version_access:
  description: >-
    Each release is a static snapshot with its own DOI, and a DOI is also maintained for the latest
    version. Older versions remain accessible for reproducibility while users are encouraged to
    adopt the latest version.

errata:
  - description: >-
      Release notes across versions document corrections to the data, including spectrogram
      reprocessing and authorship updates, alongside added participants, new feature sets and
      reorganized phenotype tables.

