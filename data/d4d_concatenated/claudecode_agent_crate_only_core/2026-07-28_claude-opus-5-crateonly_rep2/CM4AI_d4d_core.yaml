  mechanism_details:
  - 'Data collection processes are generally described in Clark T et al. (2024) "Cell Maps for Artificial
    Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell Lines" bioRxiv 2024.05.21.589311;
    doi: https://doi.org/10.1101/2024.05.21.589311. Additional data collection details will be subsequently
    published once finalized.'
  - The release-level collection types are Perturb-seq; IF imaging; SEC-MS; AP-MS.
  - Immunofluorescence images were acquired by immunofluorescence-based staining (ICC-IF) and confocal
    microscopy in the Lundberg Lab at Stanford University; nuclei were stained with DAPI (blue channel),
    endoplasmic reticulum with a calreticulin antibody (yellow channel), microtubules with tubulin antibody
    (red channel), and an antibody against the protein of interest (green channel).
  - SEC-MS data for KOLF2 differentiation were acquired on a Bruker timsTOF platform.
  - AP-MS experiments were performed in four biological replicates; each AP-MS batch includes an untagged
    parental control, 10 chromatin modifier tagged cell lines, and a positive control tagged line, with
    DMSO-treated samples as vehicle control.
