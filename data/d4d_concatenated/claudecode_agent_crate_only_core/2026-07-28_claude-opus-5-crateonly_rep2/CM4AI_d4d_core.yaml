purposes:
- name: Functional Genomics Grand Challenge output data
  description: The release is the output data of Cell Maps for Artificial Intelligence (CM4AI), the Functional
    Genomics Grand Challenge in the NIH Bridge2AI program.
  response: CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using the FAIRSCAPE framework.
- name: AI-ready data for functional genomics research
  description: Purpose stated by the RO-Crate under the Croissant RAI property rai:dataUseCases.
  response: AI-ready datasets to support research in functional genomics, AI/machine learning model training,
    cellular process analysis, cell architectural changes, and interactions in presence of specific disease
    processes, treatment conditions, or genetic perturbations.
tasks:
- name: AI and machine learning model training
  description: Task stated by the RO-Crate under rai:dataUseCases.
  response: AI-ready datasets to support research in functional genomics, AI/machine learning model training,
    cellular process analysis, cell architectural changes, and interactions in presence of specific disease
    processes, treatment conditions, or genetic perturbations.
