confidential_elements:
- id: chorus_confidentiality
  name: Confidentiality classification and controls
  confidential_elements_present: true
  confidentiality_details:
  - Confidentiality level HL7:2V (very restricted)
  - Data are curated within a NIST 800-53-aligned secure enclave architecture with role-based access controls,
    audit logging, and controlled-access governance review
  - Access restricted to secure enclave environment; no raw data export permitted unless explicitly approved
  - Raw note and report text is retained locally across participating institutions
sensitive_elements:
- id: chorus_sensitive_elements
  name: Personal and sensitive information handling
  sensitive_elements_present: true
  description: The data originate in routine clinical care and are therefore health data about identifiable
    individuals prior to de-identification. The crate lists the following controls under personal/sensitive
    information.
  sensitivity_details:
  - CHoRUS operates within a secure enclave environment aligned with NIST 800-53 controls.
  - De-identification consistent with HIPAA Safe Harbor
  - Removal or tokenization of direct identifiers
  - Date shifting or limited date fields when required
  - Role-based access control (RBAC)
  - Multi-factor authentication
  - Full audit logging of data access and queries
  - Prohibition of re-identification attempts
  - Data export restrictions and output review procedures to reduce risk of re-identification
  - Re-identification risk is periodically assessed and mitigation strategies updated as needed.
acquisition_methods:
- id: chorus_acquisition
  name: Acquisition from routine clinical care
  was_directly_observed: true
  acquisition_details:
  - Data are derived from routine clinical care at participating hospitals under IRB oversight.
  - Data are not collected solely for research but repurposed from clinical workflows under ethical oversight.
collection_mechanisms:
- id: chorus_collection_mechanisms
  name: Extraction, de-identification, and harmonization pipeline
  mechanism_details:
  - Electronic health record extraction and transformation to OMOP common data model
  - Imaging metadata de-identification using RSNA Clinical Trial Processor and pixel-level de-identification
    using IbisWorks EICON.
  - High-resolution physiologic waveform capture extraction and transformation to the WFDB standard
  - Standardized harmonization to common data model
  - Tokenized note and report text via OHNLP toolkit with raw text retained locally across participating
    institutions
  used_software:
  - id: chorus_software_ohnlp
    name: OHNLP toolkit
    description: Used to tokenize note and report text.
  - id: chorus_software_rsna_ctp
    name: RSNA Clinical Trial Processor
    description: Used for imaging metadata de-identification.
  - id: chorus_software_ibisworks_eicon
    name: IbisWorks EICON
    description: Used for pixel-level de-identification of images.
sampling_strategies:
- id: chorus_sampling
  name: Interim partial release of the CHoRUS cohort
  is_sample: true
  source_data:
  - Routine clinical care records from participating CHoRUS hospitals
  is_representative: false
  why_not_representative:
  - Referral bias from tertiary/quaternary academic centers
  - Socioeconomic and demographic distribution reflective of participating institutions
  - Limited generalizability beyond participating hospitals
  strategies:
  - Interim release with partial data. Not all patients in the CHoRUS full cohort are included. No DICOM
    images are included.
