preprocessing_strategies:
- id: data_sheets_schema:CHORUS_preprocessing_01
  name: Standardization and de-identification
  preprocessing_details:
  - Electronic health record extraction and transformation to OMOP common data model
  - High-resolution physiologic waveform capture extraction and transformation to the WFDB standard
  - Imaging metadata de-identification using RSNA Clinical Trial Processor and pixel-level de-identification
    using IbisWorks EICON
  - Tokenization of note and report text via the OHNLP toolkit
  - Standardized harmonization to common data model
machine_annotation_tools:
- id: data_sheets_schema:CHORUS_annotation_tools_01
  name: Automated processing and de-identification tools
  tools:
  - OHNLP toolkit
  - RSNA Clinical Trial Processor
  - IbisWorks EICON
  tool_descriptions:
  - OHNLP toolkit is used to tokenize note and report text
  - RSNA Clinical Trial Processor is used for imaging metadata de-identification
  - IbisWorks EICON is used for pixel-level image de-identification
intended_uses:
- id: data_sheets_schema:CHORUS_intended_use_01
  name: Approved research uses within the CHoRUS secure enclave
  examples:
  - AI model training within enclave
  - Model validation and benchmarking
  - Algorithm development and feature engineering
  - Retrospective hypothesis testing
  - Fine-tuning of multimodal models
  - Comparative effectiveness research
  - Reinforcement learning and development of expert AI
  - Methodological research in trustworthy AI
  - Trial emulation or powering
  usage_notes: Usage must align with approved research scope and governance policies.
discouraged_uses:
- id: data_sheets_schema:CHORUS_discouraged_use_01
  name: Uses that are not recommended
  discouragement_details:
  - Direct translation of trained algorithms to real-time clinical deployment without validation or regulatory
    clearance
  - Use as sole evidence for clinical decision-making
