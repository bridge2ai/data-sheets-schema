purposes:
- name: Functional Genomics Grand Challenge data release
  response: To release the June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org),
    the Functional Genomics Grand Challenge in the NIH Bridge2AI program, packaging CM4AI output data
    with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE
    framework.
- name: Support for AI-ready functional genomics research
  response: AI-ready datasets to support research in functional genomics, AI/machine learning model training,
    cellular process analysis, cell architectural changes, and interactions in presence of specific disease
    processes, treatment conditions, or genetic perturbations.
tasks:
- name: Biologically-driven interpretable machine learning
  response: 'A major goal is to enable biologically-driven, interpretable ML applications, for example
    as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).'
- name: Bioinformatics analysis of individual modality datasets
  response: The current release is most suitable for bioinformatics analysis of the individual datasets.
