acquisition_methods:
- name: Assay modalities used to acquire instance data
  acquisition_details:
  - 'Crate field rai:dataCollectionType, root entity: "Perturb-seq; IF imaging; SEC-MS; AP-MS".'
  - Component crates for the IF imaging, treated SEC-MS and SRA perturb-seq releases record the shorter
    value "Perturb-seq; IF imaging; SEC-MS".
collection_mechanisms:
- name: Data collection procedure of record
  mechanism_details:
  - 'Crate field rai:dataCollection: "Data collection processes are generally described in Clark T et
    al. (2024) ''Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from
    Disease-Relevant Cell Lines'' bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311.
    Additional data collection details will be subsequently published once finalized."'
  - The crate therefore delegates the collection protocol to an external preprint and does not describe
    the procedure inline.
- name: Immunofluorescence imaging
  mechanism_details:
  - Imaged by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at
    Stanford University.
  - Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow
    channel); microtubules with tubulin antibody (red channel); and antibody against protein of interest
    (green channel).
  - Spatial localization of 464 proteins of interest per imaging condition.
- name: Affinity purification mass spectrometry
  mechanism_details:
  - AP-MS raw data generated from endogenously tagged MDA-MB-468 cells under drug perturbation.
  - All AP-MS experiments were performed in four biological replicates. Each AP-MS batch includes an untagged
    parental control, 10 chromatin modifier tagged cell lines, and a positive control tagged line. DMSO-treated
    samples serve as vehicle control across all AP-MS experiments.
- name: Size exclusion chromatography mass spectrometry
  mechanism_details:
  - Size Exclusion Chromatography coupled with Mass Spectrometry (SEC-MS) used for protein correlation
    profiling across differentiation stages of KOLF2.1J iPSCs (Parental, NPC, Neuron, Cardio).
  - 'Sample groups: Parental (Reps 1-4), NPC (Reps 1-2), Neuron (Reps 1-3), and Cardio (Reps 1-2).'
  - Data was acquired on a Bruker timsTOF platform.
  - Treated SEC-MS data generated in the Nevan Krogan laboratory at the University of California San Francisco
    following treatment of vorinostat or paclitaxel on MDA-MB468 human breast cancer cells.
- name: CRISPRi perturbation sequencing
  mechanism_details:
  - Expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced pluripotent stem
    cells (hiPSCs) mapping transcriptional and fitness phenotypes associated with 11,739 targeted genes.
  - Findings were validated via phenotypic, protein-interaction, and metabolic tracing assays.
