known_biases:
- name: Cell-line derivation limits population representativeness
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified human cell
    lines, and does not represent all biological variants which may be seen in the population at large.
  description: Crate field rai:dataBiases, repeated identically on the root entity and on every component
    crate that carries the field. ai_ready_score.json reports the same text under characterization.potential_sources_of_bias.
    The crate states no mitigation strategy and identifies no affected subsets.
known_limitations:
- name: Interim release without predicted cell maps
  limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps, which will
    be added in future releases.
  scope_impact: The current release is most suitable for bioinformatics analysis of the individual datasets.
  description: Crate field rai:dataLimitations.
- name: Domain expertise required for analysis
  limitation_type: methodological_limitation
  limitation_description: Requires domain expertise for meaningful analysis.
  description: Crate field rai:dataLimitations.
- name: Incomplete protein coverage overlap across modalities
  limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap.
  description: Crate fields completeness and rai:dataCollectionMissingData, repeated identically on the
    root entity and on the component crates.
- name: Temporary pre-publication embargo on some component datasets
  limitation_type: temporal_limitation
  limitation_description: These data are not yet in completed final form, and some datasets are under
    temporary pre-publication embargo.
  description: Crate field completeness. The SRA perturb-seq component crate records its url as "Embargoed";
    the crate does not state which other datasets are embargoed or when the embargo lifts.
