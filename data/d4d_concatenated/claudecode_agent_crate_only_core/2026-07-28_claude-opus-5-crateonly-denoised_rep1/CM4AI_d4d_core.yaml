preprocessing_strategies:
- name: SEC-MS processing pipeline
  preprocessing_details:
  - Data was acquired on a Bruker timsTOF platform, and quantitative analysis was performed using Spectronaut.
  - Raw data was processed using Spectronaut; downstream analysis was conducted in R using MSstats-compatible
    formats.
- name: Perturbation Cell Atlas processing
  preprocessing_details:
  - The Perturbation Cell Atlas component crate records a computation entity (computation-perturbation-cell-atlas-data-processing)
    taking 90 per-channel molecule datasets as inputs and producing the aggregated KOLF pan-genome dataset
    and a reduced-size variant as outputs.
- name: Release-level processing footprint
  preprocessing_details:
  - The crate records evi:computationCount 1976 computation or experiment steps and evi:softwareCount
    6 software entities across the release, and marks each component crate with evi:processed true. The
    individual computation and software records are not present in the crate evidence available to this
    datasheet, so no per-step parameters could be extracted.
