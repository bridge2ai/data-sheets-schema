purposes:
  - description: >-
      To produce AI-ready datasets supporting research in functional genomics, AI/machine
      learning model training, cellular process analysis, cell architectural changes, and
      interactions in the presence of specific disease processes, treatment conditions, or
      genetic perturbations.
  - description: >-
      To enable biologically-driven, interpretable machine learning applications, for
      example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020
      (PMID: 33096023).
  - description: >-
      To deliver the Functional Genomics Grand Challenge data output of the NIH Bridge2AI
      program, packaged with provenance graphs and rich metadata in RO-Crate format using
      the FAIRSCAPE framework.

addressing_gaps:
  - description: >-
      Provides AI-ready, provenance-documented maps of human cell architecture from
      disease-relevant cell lines, spanning multiple orthogonal modalities (protein
      localization, protein-protein interaction, and genome-scale CRISPRi perturbation)
      for the same cellular systems.
  - description: >-
      Supplies multimodal measurements of cellular reorganization under chemotherapy
      (vorinostat and paclitaxel) in triple-negative breast cancer cells and across
      iPSC differentiation into neural progenitor cells, neurons, and cardiomyocytes.

tasks:
  - description: 'AI/machine learning model training on AI-ready multimodal cell data.'
  - description: 'Bioinformatics analysis of the individual component datasets (the use for which this interim release is stated to be most suitable).'
  - description: 'Analysis of cellular processes and cell architectural changes under disease processes, treatment conditions, or genetic perturbations.'
  - description: 'Mapping transcriptional and fitness phenotypes associated with 11,739 CRISPRi-targeted genes in KOLF2.1J hiPSCs.'
  - description: 'Protein correlation profiling and identification of protein complex reorganization during neuronal and cardiomyocyte differentiation.'
  - description: 'Profiling of drug-induced interactome rewiring of chromatin modifiers in the triple-negative breast cancer context.'

intended_uses:
  - description: >-
      AI-ready datasets to support research in functional genomics, AI/machine learning
      model training, cellular process analysis, cell architectural changes, and
      interactions in presence of specific disease processes, treatment conditions, or
      genetic perturbations.
  - description: >-
      Enabling biologically-driven, interpretable ("visible") machine learning
      applications of the kind proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi
      et al. 2020 (PMID: 33096023).

prohibited_uses:
  - description: >-
      These laboratory data are not to be used in clinical decision-making or in any
      context involving patient care without appropriate regulatory oversight and
      approval. (Recorded as both prohibitedUses and usageInfo at the top level and on
      every component crate.)

known_limitations:
  - description: >-
      This is an interim release. It does not contain predicted cell maps, which will be
      added in future releases. The current release is most suitable for bioinformatics
      analysis of the individual datasets. Requires domain expertise for meaningful
      analysis.
  - description: >-
      Completeness statement: these data are not yet in completed final form, and some
      datasets are under temporary pre-publication embargo. Protein-protein interaction
      (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data interrogate
      sets of proteins which incompletely overlap. Computed cell maps are not included in
      this release.

known_biases:
  - description: >-
      Data in this release was derived from commercially available de-identified human
      cell lines, and does not represent all biological variants which may be seen in the
      population at large.

missing_data_documentation:
  - description: >-
      Recorded missing data (rai:dataCollectionMissingData): some datasets are under
      temporary pre-publication embargo; protein-protein interaction (SEC-MS), protein
      localization (IF imaging), and CRISPRi perturbSeq data interrogate sets of proteins
      which incompletely overlap; computed cell maps are not included in this release.
  - description: >-
      Access to the Perturbation Cell Atlas raw sequence data component is recorded in the
      crate with url "Embargoed".

anomalies:
  - description: >-
      The declared bundle records two disagreeing figures for the total size of the
      release: schema:contentSize "19.9 TB" (repeated by the AI-readiness assessment as
      "Total size: 19.9 TB") and evi:totalContentSizeBytes 21051331945400 bytes
      (approximately 21.05 TB).
  - description: >-
      Checksum coverage across the packaged entities is sparse as recorded in the crate:
      evi:entitiesWithChecksums 8 of evi:totalEntities 55,859, reported in the AI-readiness
      assessment as "0% of files have checksums (8/55859)". The crate also records
      evi:entitiesWithSummaryStats as 0.

instances:
  - description: >-
      Instances are experimental measurement artifacts rather than records about people.
      They include immunofluorescence confocal image channels of MDA-MB-468 cells (blue
      DAPI/nuclei, yellow calreticulin/endoplasmic reticulum, red tubulin/microtubules,
      green protein of interest) covering 464 proteins of interest per imaging condition;
      mass spectrometry raw and processed files from SEC-MS and AP-MS experiments; and
      single-cell CRISPRi perturb-seq sequence and aggregated matrix data covering 11,739
      targeted genes.
  - description: >-
      Counts recorded in the crate refer to entities in the RO-Crate/EVI provenance graph
      rather than to data records: evi:totalEntities 55,859, comprising evi:datasetCount
      53,877, evi:computationCount 1,976, evi:softwareCount 6, and evi:schemaCount 20. The
      dataset entities include both data files and their groupings; computation, software
      and schema entities are provenance and documentation objects, not data instances.
  - description: >-
      Provenance relationships among instances are captured explicitly in the RO-Crate
      evidence graph (EVI) as inputs/outputs links between samples, experiments,
      computations and datasets; each component crate carries a local evidence graph
      (ro-crate-prov-graph.html).

subpopulations:
  - description: >-
      Biological groups represented rather than human demographic subpopulations:
      undifferentiated KOLF2.1J iPSCs; iPSC-derived neural progenitor cells; iPSC-derived
      neurons; iPSC-derived cardiomyocytes; and MDA-MB-468 triple-negative breast cancer
      cells under untreated, vorinostat, paclitaxel, and DMSO vehicle-control conditions.

acquisition_methods:
  - description: >-
      Data were generated in the laboratory from commercially available de-identified human
      cell lines annotated in the crate as KOLF2.1J iPSC (Cellosaurus CVCL_B5P3) and
      MDA-MB-468 (Cellosaurus CVCL_0419). The crate records human subject research as
      "None - data collected from commercially available cell lines".
  - description: >-
      Component data are deposited in and available from external repositories identified
      in the crate: MassIVE (MSV000101915, MSV000101917, MSV000100676, MSV000098237),
      FigShare, and, for the perturb-seq raw sequence component, SRA-derived sample
      records (access currently recorded as "Embargoed").

collection_mechanisms:
  - description: >-
      Recorded data collection types (rai:dataCollectionType): Perturb-seq; IF imaging;
      SEC-MS; AP-MS.
  - description: >-
      Immunofluorescence: antibody-based staining (ICC-IF) and confocal microscopy in the
      Lundberg Lab at Stanford University, with DAPI, anti-calreticulin, anti-tubulin, and
      antibody against the protein of interest.
  - description: >-
      SEC-MS: size exclusion chromatography coupled to mass spectrometry for protein
      correlation profiling; iPSC differentiation data acquired on a Bruker timsTOF
      platform with quantification in Spectronaut.
  - description: >-
      AP-MS: affinity purification mass spectrometry from endogenously tagged
      ("EndoTag") MDA-MB-468 cells, in four biological replicates per experiment, each
      batch containing an untagged parental control, 10 chromatin-modifier tagged cell
      lines, and a positive-control tagged line, with DMSO-treated vehicle controls.
  - description: >-
      Perturb-seq: expressed genome-scale CRISPRi single-cell RNA sequencing in KOLF2.1J
      hiPSCs across 11,739 targeted genes.

data_collectors:
  - description: >-
      Lundberg Lab, Stanford University — immunofluorescence imaging of MDA-MB-468 cells
      (untreated, paclitaxel, vorinostat); authors Hansen JN, Axelsson U, Johannesson A,
      Fall J, Ballllosera Navarro F, Lundberg E.
  - description: >-
      Nevan Krogan laboratory, University of California San Francisco — SEC-MS of
      MDA-MB-468 cells following vorinostat or paclitaxel treatment (Forget A, Obernier K,
      Krogan N).
  - description: >-
      Antoine Forget — SEC-MS characterization of KOLF2 neuronal and cardiomyocyte
      differentiation.
  - description: >-
      Richa Tiwari — EndoTag AP-MS profiling of chromatin modifier interactome rewiring in
      MDA-MB-468 cells under paclitaxel and vorinostat perturbation.
  - description: >-
      Perturbation Cell Atlas team (Doctor Y; Dailamy A; Forget A; Lee YH; Chinn B;
      Khaliq H; Polacco B; Muralidharan M; Pan E; Zhang Y; Sigaeva A; Hansen JN; Gao J;
      Parker JA; Obernier K; Clark T; Chen JY; Metallo C; Lundberg E; Ideker T; Krogan N;
      Mali P).

collection_timeframes:
  - description: >-
      Top-level recorded collection timeframe (rai:dataCollectionTimeframe): 9/1/2022 to
      6/1/2026.
  - description: >-
      Component crates record narrower windows: 9/1/2022 to 1/31/2026 for the AP-MS,
      SEC-MS of treated MDA-MB-468, and Perturb-Seq atlas crates; 9/1/2022 to 10/13/25 for
      the immunofluorescence imaging crates and the perturb-seq raw sequence crate.

sampling_strategies:
  - description: >-
      Experimental design scope recorded in the crate, in place of any population sampling
      procedure: the CRISPRi atlas targets 11,739 expressed genes genome-scale; the imaging
      datasets cover 464 proteins of interest per treatment condition; AP-MS batches
      comprise 10 chromatin modifier tagged cell lines plus an untagged parental control
      and a positive control, in four biological replicates; SEC-MS of differentiation
      covers Parental (reps 1-4), NPC (reps 1-2), Neuron (reps 1-3) and Cardio (reps 1-2)
      sample groups.

raw_sources:
  - description: >-
      Raw mass spectrometry data are held in MassIVE: MSV000101915 (AP-MS paclitaxel),
      MSV000101917 (AP-MS vorinostat), MSV000100676 (SEC-MS iPSC differentiation), and
      MSV000098237 (SEC-MS of treated MDA-MB-468 cells, FTP
      ftp://massive-ftp.ucsd.edu/v10/MSV000098237/).
  - description: >-
      Raw single-cell sequence data for the Perturbation Cell Atlas are carried in the
      component crate named "rocrate-sra-data-for-perturbation-cell-atlas", whose 192
      inputs are recorded as sra-sample entities; no repository accession is given and the
      access url is recorded as "Embargoed".

raw_data_sources:
  - source_description: >-
      MassIVE MSV000101915 — EndoTag AP-MS raw data, MDA-MB-468 under paclitaxel
      perturbation (https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915).
  - source_description: >-
      MassIVE MSV000101917 — EndoTag AP-MS raw data, MDA-MB-468 under vorinostat
      perturbation (https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917).
  - source_description: >-
      MassIVE MSV000100676 — SEC-MS raw data for KOLF2.1J neuronal and cardiomyocyte
      differentiation (https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676).
  - source_description: >-
      MassIVE MSV000098237 — SEC-MS of MDA-MB-468 following vorinostat or paclitaxel
      treatment (https://massive.ucsd.edu/ProteoSAFe/dataset.jsp?task=ad8b8084f5b14af5bafac70fdd42a577;
