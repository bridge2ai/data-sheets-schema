resources:
  - id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-paclitaxel
    name: EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468
      Cells Upon Paclitaxel Perturbation
    description: >-
      Affinity purification mass spectrometry (AP-MS) raw data generated from endogenously
      tagged MDA-MB-468 cells under paclitaxel perturbation, focused on drug-induced
      interactome rewiring of chromatin modifiers in the triple-negative breast cancer
      context. Four biological replicates; each batch includes an untagged parental
      control, 10 chromatin modifier tagged cell lines, and a positive control tagged
      line, with DMSO vehicle controls. Unpublished data. Content size 441.2 GB; 555 output
      dataset entities from 117 sample inputs. Available via MassIVE MSV000101915. Contact
      recorded for this crate: tideker@health.ucsd.edu.
    version: '1.0'
    issued: '2026-05-22T13:23:35Z'
    license: https://creativecommons.org/publicdomain/zero/1.0/
    created_by: Richa Tiwari
    keywords: [proteomics, mass spectrometry, MassIVE, Endotagging, AP-MS, Triple Negative
        Breast Cancer, MDA-MB-468, Paclitaxel, CM4AI, Bridge2AI]
