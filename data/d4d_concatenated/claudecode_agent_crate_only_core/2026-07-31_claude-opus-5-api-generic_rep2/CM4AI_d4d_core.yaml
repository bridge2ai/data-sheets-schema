  - id: https://fairscape.net/api/ark:59853/rocrate-sec-ms-characterization-of-kolf2-neuronal-and-cardiomyocyte-differentiation-cm4ai-yjftt2oec6c
    name: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
    description: >-
      Mass spectrometry-based proteomics investigating protein-protein interaction networks
      during differentiation of KOLF2.1J human iPSCs. Size Exclusion Chromatography coupled
      with Mass Spectrometry (SEC-MS) maps multiscale biological organization across
      parental (undifferentiated iPSC), NPC, neuron, and cardiomyocyte stages. Sample
      groups: Parental (reps 1-4), NPC (reps 1-2), Neuron (reps 1-3), Cardio (reps 1-2).
      Data acquired on a Bruker timsTOF platform; quantitative analysis in Spectronaut;
      downstream analysis in R using MSstats-compatible formats. Content size 1.11 TB.
      Available via MassIVE MSV000100676. Contact recorded: tideker@health.ucsd.edu.
    version: '1.0'
    issued: '2026-05-27T20:36:55Z'
