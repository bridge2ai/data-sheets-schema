distribution_dates:
  - description: >-
      Top-level release date published: 2026-06-30. Component crates record their own
      publication dates: 2026-05-22 (AP-MS paclitaxel and vorinostat), 2026-05-27 (SEC-MS
      of KOLF2 differentiation), and 02/28/2025 (immunofluorescence imaging crates).

updates:
  description: >-
    Dataset will be regularly updated and augmented on a quarterly basis through the end of
    the project (November, 2026). Future releases are stated to add predicted/computed cell
    maps, which are absent from this interim release. This record documents version 1.0,
    published 2026-06-30.

retention_limit:
  description: >-
    Long term preservation in https://dataverse.lib.virginia.edu/, supported by committed
    institutional funds.

version_access:
  description: >-
    The release is versioned (this release is V1 / version 1.0) and identified by DOI
    10.18130/V3/HIGT4C in the University of Virginia Dataverse. Component crates carry
    their own version strings (1.0, 1.5, 0.6, 0.1.0), and earlier CM4AI releases are
    referenced by their own DOIs in component citations (for example 10.18130/V3/K7TGEM
    and 10.18130/V3/B35XWX for the March 2025 release). Component crates also record
    membership in the October 2025 and January 2026 CM4AI releases.

extension_mechanism:
  description: >-
    The release is extended by the CM4AI project itself: the crate states that the dataset
    will be regularly updated and augmented on a quarterly basis through the end of the
    project (November, 2026). The recorded point of contact for the release is
    tideker@health.ucsd.edu.

