  - source_description: >-
      FigShare deposit for the Perturbation Cell Atlas aggregated perturb-seq data
      (https://figshare.com/s/ee85bb1880921326249b).

preprocessing_strategies:
  - description: >-
      SEC-MS differentiation data: raw data processed using Spectronaut; downstream
      analysis conducted in R using MSstats-compatible formats.
  - description: >-
      The evidence graph records 1,976 computation/experiment steps and 6 software
      instances used in producing derived data from raw inputs; per-crate provenance
      graphs document input/output linkage for each processing step.

labeling_strategies:
  - description: >-
      Experimental conditions and reagents are recorded in the crate as distinct annotation
      entities linked to experiments and samples — for example cell-line-MDA-MB-468,
      treatment-paclitaxel, treatment-vorinostat, treatment-control, stain-dapi and
      stain-calreticulin-antibody — together with per-condition manifest datasets
      (dataset-paclitaxel-manifest, dataset-vorinostat-manifest,
      dataset-untreated-manifest).

