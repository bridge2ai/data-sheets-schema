purposes:
- id: d4d:purpose-ai-ready-functional-genomics
  name: AI-ready functional genomics data for the CM4AI Grand Challenge
  response: To release AI-ready datasets for the Cell Maps for Artificial Intelligence (CM4AI) Functional
    Genomics Grand Challenge, a component of the NIH Bridge2AI program, packaging CM4AI output data with
    provenance graphs and rich metadata in RO-Crate format using the FAIRSCAPE framework.
- id: d4d:purpose-support-ml-research
  name: Support research and machine learning on human cell architecture
  response: To support research in functional genomics, AI/machine learning model training, cellular process
    analysis, cell architectural changes, and interactions in the presence of specific disease processes,
    treatment conditions, or genetic perturbations.
tasks:
- id: d4d:task-ml-model-training
  name: AI/machine learning model training
  response: AI/machine learning model training on AI-ready functional genomics data, as stated in the
    crate's responsible-AI data use cases.
- id: d4d:task-cellular-process-analysis
  name: Cellular process and cell architecture analysis
  response: Analysis of cellular processes, cell architectural changes, and molecular interactions in
    the presence of specific disease processes, treatment conditions, or genetic perturbations.
- id: d4d:task-bioinformatics-analysis
  name: Bioinformatics analysis of the individual constituent datasets
  response: The crate states that the current release is most suitable for bioinformatics analysis of
    the individual datasets.
addressing_gaps:
- id: d4d:gap-interpretable-ml
  name: Enabling biologically-driven, interpretable machine learning
  response: 'A major stated goal is to enable biologically-driven, interpretable ML applications, for
    example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).'
- id: d4d:gap-ai-ready-packaging
  name: AI-ready packaging of multimodal cell-mapping data
  response: CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using the FAIRSCAPE framework, so that multimodal cell-mapping data are released
    with machine-readable provenance rather than as unstructured file drops.
