collection_mechanisms:
- id: d4d:collection-mechanisms
  name: Data collection mechanisms and instrumentation
  mechanism_details:
  - 'Crate-declared collection types: Perturb-seq; IF imaging; SEC-MS; AP-MS.'
  - 'IF imaging: immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab
    at Stanford University, with four stain channels (DAPI, calreticulin antibody, tubulin antibody, antibody
    against protein of interest).'
  - 'SEC-MS of KOLF2 differentiation: size exclusion chromatography coupled with mass spectrometry for
    protein correlation profiling, acquired on a Bruker timsTOF platform.'
  - 'AP-MS: affinity purification mass spectrometry on endogenously tagged (EndoTag) MDA-MB-468 cells,
    in four biological replicates per experiment, with untagged parental controls, 10 chromatin modifier
    tagged cell lines, a positive control tagged line, and DMSO vehicle controls.'
  - 'Perturb-seq: expressed genome-scale CRISPRi perturbation screening in KOLF2.1J hiPSCs across 11,739
    targeted genes.'
  - 'The crate states that data collection processes are generally described in Clark T et al. (2024)
    "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant
    Cell Lines" bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311, and that additional
    data collection details will be subsequently published once finalized.'
