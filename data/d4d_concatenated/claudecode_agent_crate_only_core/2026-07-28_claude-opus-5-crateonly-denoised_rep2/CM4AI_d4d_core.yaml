instances:
- id: d4d:instance-perturb-seq
  name: CRISPRi perturb-seq data in KOLF2.1J iPSCs
  instance_type: single-cell RNA sequencing readouts from CRISPRi genetic perturbations
  description: Expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced pluripotent
    stem cells (hiPSCs) mapping transcriptional and fitness phenotypes associated with 11,739 targeted
    genes. Released both as raw sequence data and as an aggregated perturb-seq atlas. Cell line annotated
    in the crate with Cellosaurus CVCL_B5P3 (KOLF2.1J); subject-matter annotations include MeSH D057026
    (Induced Pluripotent Stem Cells) and D064113 (CRISPR-Cas Systems), and EDAM topic_3170 (RNA-Seq).
- id: d4d:instance-sec-ms
  name: SEC-MS protein-protein interaction data
  instance_type: size exclusion chromatography coupled mass spectrometry protein correlation profiles
  description: 'SEC-MS data in undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons and cardiomyocytes,
    and SEC-MS of MDA-MB-468 human breast cancer cells following treatment with vorinostat or paclitaxel.
    The iPSC differentiation series covers four sample groups: Parental (Reps 1-4), NPC (Reps 1-2), Neuron
    (Reps 1-3) and Cardio (Reps 1-2). Subject-matter annotations include MeSH D013058 (Mass Spectrometry)
    and EDAM topic_0121 (Proteomics).'
- id: d4d:instance-ap-ms
  name: EndoTag AP-MS interactome data in MDA-MB-468 cells
  instance_type: affinity purification mass spectrometry interactome profiles
  description: AP-MS raw data generated from endogenously tagged MDA-MB-468 cells under paclitaxel and
    under vorinostat perturbation, focused on drug-induced interactome rewiring of chromatin modifiers
    relevant to the triple-negative breast cancer context. All AP-MS experiments were performed in four
    biological replicates; each AP-MS batch includes an untagged parental control, 10 chromatin modifier
    tagged cell lines and a positive control tagged line, with DMSO-treated samples as vehicle control.
    Cell line annotated in the crate with Cellosaurus CVCL_0419 (MDA-MB-468); subject-matter annotations
    include MeSH D001943 (Breast Neoplasms), D017239 (Paclitaxel) and D000077337 (Vorinostat).
- id: d4d:instance-if-images
  name: Immunofluorescence images of MDA-MB-468 cells
  instance_type: four-channel confocal immunofluorescence microscopy images
  counts: 464
  description: Spatial localization of 464 proteins of interest in MDA-MB-468 breast cancer cells, untreated
    and treated with paclitaxel or vorinostat, imaged by immunofluorescence-based staining (ICC-IF) and
    confocal microscopy. Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and antibody against
    protein of interest (green channel). The count given is the number of proteins of interest imaged
    per condition, as stated in the crate. Subject-matter annotation includes MeSH D005453 (Fluorescent
    Antibody Technique).
- id: d4d:instance-provenance-graph-entities
  name: FAIRSCAPE provenance graph entities
  instance_type: RO-Crate / EVI provenance graph entity
  counts: 55859
  description: The release-level crate reports 55,859 total entities, comprising 53,877 dataset entities,
    1,976 computation entities, 6 software entities and 20 schema entities. 8 entities carry checksums
    and 0 entities carry summary statistics. These are counts of entities documented in the provenance
    graph, not a file count.
anomalies:
- id: d4d:anomaly-embargoed-and-partial
  name: Interim release with embargoed and incompletely overlapping components
  anomaly_details:
  - These data are not yet in completed final form, and some datasets are under temporary pre-publication
    embargo.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data
    interrogate sets of proteins which incompletely overlap.
  - Computed cell maps are not included in this release.
- id: d4d:anomaly-sparse-checksums
  name: Checksum coverage is near zero
  anomaly_details:
  - The crate's AI-readiness self-assessment reports that 0% of files have checksums (8 of 55,859 entities),
    so per-file integrity verification is not generally possible from the crate.
  - The crate also reports 0 entities carrying summary statistics (evi:entitiesWithSummaryStats), so no
    distributional summaries of the data are available from the crate.
- id: d4d:anomaly-metadata-quality
  name: Metadata quality issues observed within the release crate
  anomaly_details:
  - 'Release size is reported twice and the two figures do not reconcile exactly: contentSize "19.9 TB"
    against evi:totalContentSizeBytes 21,051,331,945,400 (21.05 TB decimal, 19.15 TiB). The "19.9 TB"
    figure is close to the sum of the nine constituent crate content sizes as stated in the crate; the
    byte count is the value recorded as total_size_bytes here.'
  - Several constituent crates declare isPartOf identifiers that carry a trailing comma (for example "https://fairscape.net/api/ark:59853/rocrate-cell-maps-for-artificial-intelligence-June-2026-data-release,"),
    so those membership links do not resolve as written.
  - Every constituent crate carries a citation string for the "Cell Maps for Artificial Intelligence -
    March 2025 Data Release (Beta)" (DOIs 10.18130/V3/B35XWX and 10.18130/V3/K7TGEM) even where the crate
    itself was published in 2026, so constituent-level citations are stale with respect to this release
    and were not carried into this datasheet.
  - The SEC-MS treated-cancer-cell crate records its identifier as "https://doi.org/doi:10.25345/C5348GV4S",
    which doubles the DOI scheme prefix; it is recorded verbatim here.
  - The University of California San Diego appears under three name spellings and two FAIRSCAPE organization
    ARKs (organization-university-of-california-san-diego and organization-university-of-california-san-diego-T4a649a1RtE),
    and the University of Alabama at Birmingham under two spellings.
  - The ethical review contact is spelled "Vardit Ravistky" in the ethicalReview field while the corresponding
    Person record is "Ravitsky, V", and that person's recorded affiliation (University of Montreal) does
    not match the email domain given (thehastingscenter.org).
