known_biases:
- description: "•\tReferral bias from tertiary/quaternary academic centers\n•\tSocioeconomic\
    \ and demographic distribution reflective of participating institutions\n•\tDocumentation\
    \ bias in clinical notes\n•\tMissingness not at random (MNAR) in laboratory, waveform,\
    \ and imaging acquisition\n•\tDifferential care pathways affecting label assignment\
    \ (e.g., ICU vs non-ICU populations)\n•\tTemporal trends related to evolving clinical\
    \ practice\nBias assessment is ongoing and documented in dataset release notes\n"
known_limitations:
- description: "•\tObservational data; and not randomized; collected as real-world\
    \ clinical data, not through prospective research interactions with patient.\n\
    •\tDocumentation quality dependent on routine clinical workflows and data elements\
    \ being collected in clinical practice.\n•\tVariable sampling rates across real-world\
    \ data from hospital waveform systems and middleware\n•\tInstitutional heterogeneity\
    \ in coding and clinical data collection practices\n•\tLimited generalizability\
    \ beyond participating hospitals\n•\tNot appropriate for re-identification, contact\
    \ tracing, or patient-level intervention\n•\tHold-out splits are available for\
    \ testing; training and validation in development splits require internal mechanisms\
    \ to avoid overfitting\n"
updates:
  description: "\n•\tVersioned dataset releases e.g., CHoRUS vX.Y)\n•\tRelease notes\
    \ documenting schema changes, harmonization updates, and known issues\n•\tGovernance\
