acquisition_methods:
- description: "Data are derived from routine clinical care at participating hospitals\
    \ under IRB oversight. Collection includes:\n•\tElectronic health record extraction\
    \ and transformation to OMOP common data model\n•\tImaging metadata de-identification\
    \ using RSNA Clinical Trial Processor and pixel-level de-identification using\
    \ IbisWorks EICON. \n•\tHigh-resolution physiologic waveform capture extraction\
    \ and transformation to the WFDB standard, \n•\tStandardized harmonization to\
    \ common data model\nEthical safeguards include:\n•\tIRB approval or waiver as\
    \ appropriate\n•\tCompliance with CHoRUS governance\n•\tLayered privacy protection\
    \ including de-identification, data use agreement, controlled access data repository\
    \ with adherence to NIST 800-53 principles, audit-level protection, registration,\
    \ role-based access controls, protection against data exfiltration.\nData are\
    \ not collected solely for research but repurposed from clinical workflows under\
    \ ethical oversight.\n"
