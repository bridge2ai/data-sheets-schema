title: CHoRUS RO-Crate Package
description: 'The Collaborative Hospital Repository Uniting Standards (CHoRUS) for
  Clinical Care AI is a clinical data network developing a flagship multi-hospital,
  multimodal, high-resolution dataset under the NIH Bridge2AI program. CHoRUS harmonizes
  electronic health record (EHR) data, imaging, high-resolution physiologic signals
  (including telemetry data and EEG where available), and tokenized note and report
  text (via OHNLP toolkit) with raw text retained locally across participating institutions
  using standardized data models and governance frameworks.

  The repository is designed to enable secure, auditable, and reproducible artificial
  intelligence (AI) research to improve recovery from acute illness. Data are curated
  within a NIST 800-53–aligned secure enclave architecture with role-based access
  controls, audit logging, and controlled-access governance review. CHoRUS supports
  AI model development, validation, benchmarking, and translational research while
  maintaining compliance with HIPAA and NIH data-sharing policies.

  '
