future_use_impacts:
- description: The project aims to create an ethically sourced, diverse voice dataset
    to support research on using voice as an accessible, low-cost biomarker for screening,
    diagnosis and monitoring of a broad range of health conditions, potentially improving
    early detection and care for underserved populations. At the same time, the consortium
    explicitly recognizes the risks associated with voice data, including privacy
    loss, misuse of voice biometrics and algorithmic harms such as discrimination
    in hiring, insurance or surveillance contexts; these risks motivate a governance
    framework with IRB oversight, rigorous de-identification, separation of feature-only
    and raw-audio tiers and usage restrictions encoded in the registered-access license
    and data use agreement. Dataset documentation and ongoing ethics workstreams are
    intended to help downstream users reason about these risks and design responsible
    analyses and models.
known_biases:
- description: 'Sampling bias: participants are recruited from specialty clinics and
    associated institutions using a non-probability sampling strategy, with inclusion
    focused on specific disease cohorts and fluent English speakers; this produces
    clinically enriched case mixes that may not represent general population distributions.

    Geographic and cultural bias: data are collected at a limited number of North
    American sites, and although the project seeks diversity, it may under-represent
    speakers from other regions, cultures, languages and healthcare systems; early
    releases focus on English, with Spanish protocols planned but not yet fully represented.

    Clinical spectrum bias: because participants are selected into disease cohorts
    where voice changes are expected, the prevalence and severity of conditions in
    the dataset differ from those in routine primary care or community settings, which
    may inflate model performance when evaluated within this dataset.

    Device and environment bias: recordings are made using standardized but not identical
    hardware and primarily in clinical environments; future at-home collection or
    deployment on other devices may encounter different background noise, channel
    characteristics and user behavior.

    Algorithmic bias in machine annotations: transcripts and some derived features
    rely on off-the-shelf models such as OpenAI Whisper and other audio toolkits whose
    performance may vary across demographic groups; the dataset team has not independently
    audited these tools for fairness, so downstream users should consider their biases
    when interpreting results.'
known_limitations:
- description: 'The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may
    constrain the ability to reproduce end-to-end audio pipelines.

    This version only includes an adult cohort; models trained solely on this dataset
    may not generalize to younger age groups or to languages beyond those represented.

    Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed, which reduces
    the risk of re-identification but also limits detailed fairness assessments and
    certain confounder adjustments.

    The dataset does not provide predefined train–validation–test splits or benchmarking
    tasks and does not include explicit per-instance label-uncertainty measures, so
    researchers must design their own evaluation protocols and handle label noise
    and missingness.

    The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers and
    can complicate the reproducibility of pipelines that require both features and
    raw audio.'
updates:
  description: 'Dataset releases follow a static versioning scheme managed through
    PhysioNet and related platforms, with version numbers such as 1.0, 1.1, 2.0.0,
    2.0.1 and 3.0.0 and associated DOIs for each snapshot and for the latest version.

    Releases are coordinated by the Bridge2AI-Voice project team and the MIT Laboratory
    for Computational Physiology; release notes document added participants, new feature
    sets, reorganized phenotype tables and corrections such as spectrogram reprocessing
    and authorship updates.

    Future updates are planned as additional participants are enrolled and Spanish-language
    protocols are incorporated; older versions remain accessible for reproducibility
    while users are encouraged to adopt the latest version.'
sensitive_elements:
- description: The dataset encodes health-related information including diagnostic
    categories for voice disorders, neurological and neurodegenerative conditions,
    mood and psychiatric disorders and respiratory diseases, as well as symptom scores
    from questionnaires, which constitute sensitive personal health data.
- description: Demographic variables such as age, sex and country of data collection
    are included in coarsened form, while finer-grained geographic identifiers, direct
    identifiers and many socio-economic and cultural details have been removed during
    de-identification to reduce re-identification risk.
- description: Highly sensitive content including detailed narrative responses, some
    information about household income, traumatic life experiences and granular cultural
    identifiers has been removed entirely from this feature-only dataset; raw voice
    recordings, which are themselves biometric identifiers, are made available only
    under controlled access.
- description: Use of the data is restricted to authorized researchers under a registered-access
    license and associated data use agreement that explicitly forbids attempts at
    re-identification, stigmatizing or discriminatory uses and applications such as
    surveillance or high-stakes individual decision making.
