regulatory_restrictions:
  name: https://physionet.org/content/b2ai-voice/view-dua/3.0.0/
acquisition_methods:
- description: Prospective observational study conducted at multiple specialty clinics
    and academic hospitals across North America. Eligible adults presenting to voice,
    neurology, psychiatry and respiratory clinics, plus healthy controls, were screened
    against predefined inclusion and exclusion criteria. After informed consent, a
    standardized protocol was administered that combined structured voice and respiratory
    tasks such as sustained vowels, coughs and reading passages with demographic questions,
    health history, disease-specific questionnaires and other patient-reported outcomes.
    Data were captured on a mobile or tablet application and stored in REDCap, with
    most participants completing a single in-clinic session and a subset completing
    repeated sessions.
collection_mechanisms:
- description: Prospective observational study conducted at multiple specialty clinics
    and academic hospitals across North America. Eligible adults presenting to voice,
    neurology, psychiatry and respiratory clinics, plus healthy controls, were screened
    against predefined inclusion and exclusion criteria. After informed consent, a
    standardized protocol was administered that combined structured voice and respiratory
    tasks such as sustained vowels, coughs and reading passages with demographic questions,
    health history, disease-specific questionnaires and other patient-reported outcomes.
    Data were captured on a mobile or tablet application and stored in REDCap, with
    most participants completing a single in-clinic session and a subset completing
    repeated sessions.
collection_timeframes:
- description: Data collection for the adult flagship cohort began after project launch
    in 2023 and is ongoing across five North American sites toward an anticipated
    enrollment of approximately 3,000 participants by November 2026; the participants
    and recordings included in dataset version 3.0.0 were collected roughly between
    2023 and 2025.
- description: 'Dataset releases are static snapshots: v1.0 (initial public release
    in 2024), v1.1 (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0
    (2025-12-16), each corresponding to a frozen state of the underlying data collection.'
raw_data_sources:
- source_description: The original raw data consist of high-quality voice, speech
    and respiratory audio waveforms recorded on tablet or smartphone devices with
    headset microphones when available, plus responses to structured demographic and
    medical history questionnaires, disease-specific validated questionnaires and
    other patient-reported outcomes, together with clinical diagnoses and other metadata
    extracted from electronic health records. The public feature-only PhysioNet release
    contains de-identified derived representations of the audio, such as spectrograms,
    mel spectrograms, MFCCs, articulatory and prosodic features and phonetic posteriorgrams,
    along with tabular phenotype files and data dictionaries; access to the underlying
    raw audio is available only through a separate controlled-access process.
missing_data_documentation:
- description: Phenotype tables include a row for a participant only when at least
    one variable is non-missing, and participants may have repeated visits with differing
    responses. Questionnaire completion varies by participant and cohort, so some
    forms and items are systematically or sporadically missing. Some derived audio
    features could not be computed for all recordings due to quality or length constraints,
    and features relating to free speech or sensitive records have been removed. No
    additional imputation is applied in the released files.
cleaning_strategies:
- description: Prior to release, data are transformed to reduce re-identification
    risk and align with regulatory and ethical requirements. Direct identifiers and
    high-risk quasi-identifiers are removed; dates are coarsened or rebased; geographic
    information is generalized to the country level; narrative text fields and transcripts
    of free speech are removed; and raw voice waveforms are withheld from this feature-only
    release. Additional filtering removes features for sensitive records and audio
    checks, and some derived features are dropped when processing fails or quality
    checks fail.
preprocessing_strategies:
- description: Raw audio waveforms are converted to mono and resampled to 16 kHz using
    anti-aliasing filtering; they are then segmented by task and passed through quality
    checks.; From the standardized audio, multiple derived feature sets are computed
    including spectrograms, mel spectrograms, MFCCs, articulatory features using the
    Speech Articulatory Coding package, pitch and loudness estimates, acoustic features
    from openSMILE, phonetic and prosodic features from Praat and parselmouth, and
    phonetic posteriorgrams using a dedicated model; all are stored as dense tensors
    in Parquet files with participant, session and task identifiers.; Tabular phenotype
    and questionnaire files are exported from REDCap and merged using a dedicated
    open-source b2aiprep library, reorganizing the former single phenotype table into
    thematically organized TSV files with accompanying JSON data dictionaries; static
    per-recording feature summaries are provided in static_features.tsv, and de-identification
    and filtering steps are applied before packaging.
raw_sources:
- description: The original raw data consist of high-quality voice, speech and respiratory
    audio waveforms recorded on tablet or smartphone devices with headset microphones
    when available, plus responses to structured demographic and medical history questionnaires,
    disease-specific validated questionnaires and other patient-reported outcomes,
    together with clinical diagnoses and other metadata extracted from electronic
    health records. The public feature-only PhysioNet release contains de-identified
    derived representations of the audio, such as spectrograms, mel spectrograms,
    MFCCs, articulatory and prosodic features and phonetic posteriorgrams, along with
    tabular phenotype files and data dictionaries; access to the underlying raw audio
    is available only through a separate controlled-access process.
labeling_strategies:
- description: Annotations for this dataset consist primarily of clinical labels and
    questionnaire-derived measures associated with each participant and recording.
    Participants complete validated instruments such as VHI-10, PHQ-9, GAD-7, PANAS,
    respiratory and cough questionnaires and voice instruments, which generate numerical
    scores and categorical indicators according to each instrument's published scoring
    guidelines. Clinical investigators and care teams record diagnostic categories
    for voice, neurological, mood and respiratory conditions and other phenotype variables,
    drawing on clinical assessments and electronic health records; these labels are
    represented in disease-specific TSV files with accompanying JSON dictionaries.
    In addition, machine-generated transcripts of certain voice tasks and numerous
    automatically extracted acoustic and articulatory features provide further labels
    and descriptors at the recording level.
annotation_analyses:
- description: Questionnaire-based labels are generated using the standard scoring
    rules for each validated instrument, yielding total and subscale scores that can
    be mapped to symptom-severity bands; the scoring logic is encoded in the REDCap
    instruments and documented in the data dictionaries.; Diagnostic labels are derived
    from clinical assessments and electronic health records rather than crowd workers,
    so there is no explicit inter-rater majority-vote scheme; however, diagnoses are
    treated as reference labels and may include multiple comorbid conditions per participant.;
    The data release team audited the combined phenotype and feature tables for internal
    consistency, missingness patterns and data entry issues, but per-annotator disagreement
    statistics or detailed label-uncertainty measures are not presently included in
    the released dataset.
