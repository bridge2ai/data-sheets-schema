- id: rule-20
  kind: rule
  block: v8
  text: 'A `Person` the schema asks for as an object carries an `id`: the ORCID the evidence states, as a CURIE with the prefix ORCID, where it states one; otherwise a fragment minted on this record''s own id (the record''s id, a hash sign, then person and the name), which is the one case the fragment rule reaches for a person — the object exists only as this record''s way of naming its contact. Never a mailto address or any other scheme as the id: the address belongs in `email`, beside the id, where the evidence states it. Look for the ORCID before minting — a person the documents list with an ORCID has one, and a fragment for that person is a second identity for one referent.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-21
  kind: rule
  block: v9
  text: 'A value in one of the referent''s own slots is supported by a passage whose subject is the referent. You are given a declared scope naming the referent and, where the project has any, the datasets declared related but distinct — with, for each and where the declaration states them, the slot its facts belong in and the bundle source carrying its documentation. Where it names a slot, a passage about that dataset supports an entry there; where it does not, the facts still belong with that dataset and not in a slot describing this one, however well the sentence would read there. A declaration listing no related dataset says only that none was declared: it is not an assurance that every passage in the bundle is about the referent, and the first sentence still governs. This binds every phase, and the reconcile phase in particular: reconciling the two records against each other does not test what a value is about, so check each value you keep against the subject of the passage behind it, not only against the rest of the record.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-22
  kind: rule
  block: v9
  text: 'A list entry names exactly one entity. Where the bundle states several, emit one entry each or none; never one entry whose value merges them. Two signs that you have merged: the value names a class of things where the schema asks for a thing — a plural or a collective noun standing where one organization, one person or one instrument belongs — or it joins what the sources state as separate names with "and", a slash or a comma. The test is the sources, not the punctuation: an entity whose own registered name contains "and", a comma or a slash is one entity, and splitting it is the same error in the other direction. Read back each entry you write in a multivalued slot and ask whether exactly one thing the sources name answers to it.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-23
  kind: rule
  block: v9
  text: 'The rule that a fragment is minted only where a value points at the part does not reach an id the schema forces. Where a class declares `id` as its identifier or requires it — a file, a file collection, a data subset, a component dataset under `resources`, a software tool under `used_software`, a person given as an object — the id exists because the object does, and leaving it out is a validation failure, not a fragment saved. Take the identifier the evidence states for that part first — a DOI, an ARK, a URL that names the file or the component dataset, in a form that is itself an identifier: a declared CURIE, an absolute URL, an ARK or a URN, and where the evidence states a resolver URL for a prefix the schema declares, that identifier written as the CURIE the rule above on declared prefixes requires, not as the URL — and mint a label only where it states none: on this record''s own id where that id is itself such a form (the base rule below), stable across runs, never in place of an identifier the evidence supplies; and do not read that rule as a reason to omit the object. A person''s id follows the rule for a person given as an object — the ORCID the evidence states first, a fragment only where it states none, on the base this rule sends the record to and never on a bare token. The ids of `file_collections` and of the files under them are copied into the core record''s distributions, and top-level `resources` are matched to the core by id, so those ids are used whether or not the text points at them. For every other fragment the test stays the referent: an organization, a grant, an award, a program has a referent outside this record, so a fragment for it on this dataset''s identifier is a claim about that identifier, not a label; and an entry under `creators` or `maintainers` is a role this record asserts about a person or an organization, whose id is that person''s or organization''s own identifier where the evidence states one. Take the identifier the evidence states; where it states none and the schema does not require an id, leave `id` empty and carry the name in `name`. A label this record mints sits on an identifier the evidence supplies for this dataset — which refines the rule that mints a label on an identifier the evidence supplies, without replacing it — and this record''s own id is the base to prefer where it is itself an identifier form: a declared CURIE, an absolute URL, an ARK or a URN. A record whose own id is a bare token, or a CURIE on a prefix the schema does not declare, labels its parts on the dataset''s DOI or landing page instead, never on the token, and where it carries neither, on a resolvable URL the evidence supplies for this dataset — the fragment rule''s own license, a label minted on an identifier the evidence does supply — which, like every other base here, must itself be an identifier form: an absolute URL with its scheme. A label on the dataset''s DOI or landing page is licensed too, but only on a form that is itself an identifier — the DOI as a declared CURIE (the doi prefix, a colon, the DOI), which is the form to write even where the evidence states the resolver URL, the page as an absolute URL with its scheme; a bare DOI string or a schemeless host with a label appended is a token, not an identifier. A label for a part of this dataset is exempt from a receipt only when its base matches an identifier carried in this record''s top-level `id`, `doi` or `page`: DOI spellings and a trailing slash are normalized, but a missing or different URL scheme is not. A label on a scheme-added page or fallback URL needs a receipt when its resulting base is absent from those carried identifiers. This exemption covers labels for parts of this dataset, not claims about an external entity. The own id is the one identity slot every record carries, whatever form the record gave it, where `page` and `doi` are optional; where it is an identifier form and not itself a shared root it names this dataset alone, while a landing page is often a site or project root shared with sibling releases, so a part labeled there cannot be told apart from a sibling''s by its id alone. Where this record''s own id is itself such a root, it is still the base to prefer: it is the identifier this record carries, and the label must stay stable; where the base this rule sends the record to already carries a fragment, the part''s label is that fragment, a hyphen and the part''s own label, on the same base — for a person under the person rule, that fragment, a hyphen, then person and the name — so the record''s own discriminator is kept, and one identifier carries one fragment marker, never two. A fragment appended to another entity''s identifier — an organization''s, another dataset''s — labels a part of that entity, not of this one.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-24
  kind: rule
  block: v9
  text: 'A slot whose declared range is an enumeration is populated only from a passage that states the category, in the source''s own words or a plain restatement of them — never from what a value''s name, unit or position suggests. A variable''s `data_type` and a collection''s `collection_type` are claims about how a thing is classified, and a passage that names the thing without classifying it supports the name and not the class. Where no passage states the category the slot stays empty — an empty enumeration slot is a gap the reader can see, a guessed one an error the reader cannot — except where the schema requires the slot, in which case the entry itself is what the evidence must support: a related dataset is recorded only where a passage states what the relation is. A file''s `format`, `file_type`, `media_type` and `encoding`, and a file''s or collection''s `compression`, are read from the file the bundle names — its name and extension are the passage for them — and this rule does not reach those.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-25
  kind: rule
  block: v9
  text: '`raw_data_format` names the form the data took before any processing this dataset applied, and only where a passage states that form. The standard the release conforms to, the extension the distributed files carry and the format a pipeline wrote are facts about the released data and belong in the slots that describe the release; where a passage states that the raw form and the released form are the same, record it in both; where the documents describe the release and say nothing of what preceded it, the slot stays empty.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-26
  kind: rule
  block: v9
  text: '`principal_investigator` names a person the documents designate with that title, or its usual abbreviation, for this dataset or the study that produced it. A lead, a director, a corresponding author, a contact, a first author, the head of the group that hosts the data — each is a role the documents state, recorded as the role they state, in prose or in a slot for that role where the schema has one, and never promoted to principal investigator because the record has a slot for one. Where the documents designate more than one, record each; where they designate none, the slot stays empty.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-27
  kind: rule
  block: v9
  text: 'A value states what a passage states, at the passage''s own reach. A consequence — what a limitation means for a use, what a gap does to a conclusion — goes in `scope_impact` or anywhere else only where a passage draws it; a limitation the documents state without its consequence is recorded as the limitation alone. A term taken from a keyword line, a tag list, a table header or a navigation menu attests that the term appears, not what it is about: `keywords` is the one slot whose subject is that the term appears, and a keyword line fills it and nothing else; any other value needs a sentence behind it.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-28
  kind: rule
  block: v9
  text: 'Every entry in a list is a member of that list: a variable under `variables`, a funder under `funders`, a file under the `resources` of a file collection. A remark about the list — that what is shown is a sample, that the list continues elsewhere, that one column flags something — is not a member and does not become an entry; it goes in `description`, or in `source_caveats`, or is omitted.'
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-29
  kind: rule
  block: v9
  text: An absence is not an entry, and a route is not a format. That no correction has been published is not an erratum and does not fill `errata`; that access is by request through a portal is a route and fills neither `future_guarantees` nor the `format` of a distribution; the reason a use is prohibited is its `prohibition_reason`, and the prohibition itself is the entry that reason explains, not the reason. Where the documents state that a thing is absent, the slot for the thing stays empty and the statement, where it is worth keeping, goes in `source_caveats`.
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
- id: rule-30
  kind: rule
  block: v4
  text: Where a slot's declared range is a scalar, populate it with the identifier of the thing it refers to, not with the thing itself. An object placed in a string-ranged slot fails validation and loses the reference it was meant to record, even where that thing is richly described elsewhere in the record.
  question: Did the record follow this rule? Cite the slot(s) that show it, or the violation.
