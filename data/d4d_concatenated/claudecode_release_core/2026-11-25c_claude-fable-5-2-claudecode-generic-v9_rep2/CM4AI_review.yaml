  evidence: "Class-ranged objects carry their declared fields: creators[*] id/name/affiliations; funders[0].grants[*] grant_number/name; Person objects (creators[46].principal_investigator, data_governance.committee_contact, ethical_reviews[*].contact_person) id/name/orcid/email; used_software id/name/license/url. pack.reference_attributes is empty. The five ROR-only affiliations hold the identifier the June 2026 page gives; the name from the October 2025 page is in source_caveats rather than affiliations[0].name - a defensible choice, not prose replacing an empty structure."
- id: rule-09
  verdict: followed
  evidence: "uriorcurie slots use declared prefixes: creators[*].id 'ORCID:...', affiliations[*].id 'ROR:0153tk833', file_collections[0].id and version_access.latest_version_doi 'doi:10.18130/V3/HIGT4C', maintainers[0].id 'ORCID:...'. URLs remain only where exempt or no prefix applies: page and access_urls (uri), external_resources[*].external_resources (string), prose/citation, used_software[0].id https://fairscape.github.io and publisher (no declared prefix). doi is the bare DOI (string slot)."
