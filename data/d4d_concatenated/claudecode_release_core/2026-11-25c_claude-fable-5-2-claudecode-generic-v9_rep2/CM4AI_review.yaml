  d4d-review-record definition file as instructions; not the typed agent.
  Instrument observations (not verdicts): (1) slot-034's receipt cites c027
  for creators[20] (Metallo C) but the snippet starts on the affiliation line
  after the name, which is the last line of c026 (l.7401), and ends with the
  next author's name 'Muralidharan M'; the validator accepts it as verbatim,
  yet the snippet on its own would equally fit a reading that attaches the
  ORCID to the following author. An entry receipt for a roster row that
  straddles a chunk boundary cannot contain the name; the instrument might
  allow a two-chunk citation or flag snippets that end in another entry's
  name. (2) slot-019's entry receipt 'Archive (10)' is verbatim and passes,
  but carries none of the entry's distinguishing tokens (ZIP, the name, the
  URL); the report's 'one snippet bearing on no token of its value'
  diagnostic may be this one. Borderline, not charged: publisher
  https://dataverse.lib.virginia.edu/ is the bare host root of stated
  Dataverse URLs, which the bundle never states alone; the bundle names the
  publisher 'University of Virginia Dataverse' (l.7037). The record discloses
