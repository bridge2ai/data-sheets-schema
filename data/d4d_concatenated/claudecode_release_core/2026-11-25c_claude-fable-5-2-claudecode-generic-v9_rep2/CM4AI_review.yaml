- id: rule-01
  verdict: followed
  evidence: "Values trace to the bundle (all 38 distinct ORCIDs and all 10 file MD5s in the record occur in the bundle; checked by grep). The record omits what is not stated: no creation date (top-level source_caveats explains the 2025-02-27 values repeated across releases), no conforms_to for the June 2026 release, no file byte counts, no instance counts from the site totals. Inferential joins (committee_contact ORCID, PI ORCID) are disclosed in source_caveats."
- id: rule-02
