  evidence: "Disagreements are represented, not silently resolved: top-level source_caveats (2026-06-17 on Dataverse vs 'Released on: June 17, 2025' l.4446), creators[44].source_caveats (Sali UCSD vs UCSF), instances[2].source_caveats (AP-MS included vs 'coming soon' l.4436-4437), instances[0].source_caveats (perturb-seq described as included vs KOLF2-only files and 'Embargoed' links). DXWOS5 and 'May 2024 Data Release' are kept as two versions_available entries rather than merged (version_access.source_caveats)."
- id: rule-03
