  evidence: "The manifest scope declares referent 'CM4AI (Cell Maps for Artificial Intelligence) dataset' with referent_id https://cm4ai.org/ and a note that the four Dataverse releases are releases of it (source_manifest.yaml l.232-238). The report's Referent section states the choice; id https://cm4ai.org/ in both records (core l.647); release facts confined to doi/version/file_collections and version_access. file_collections[0].id doi:10.18130/V3/HIGT4C is the current release's DOI, a part of the referent consistent with that scope."
- id: rule-04
