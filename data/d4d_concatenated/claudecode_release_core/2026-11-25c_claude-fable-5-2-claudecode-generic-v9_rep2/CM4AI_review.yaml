  evidence: "Multivalued slots carry one object per entity: 47 creators (one per author row l.7334-7498), four intended_uses (l.7097-7100), six known_limitations, two known_biases, two data_collectors, three grants, seven external_resources. ethical_reviews has two entries because l.7085 names two people and EthicalReview.contact_person is single-valued."
- id: rule-06
  verdict: followed
  evidence: "No slot is filled with a pointer or a pending/absent statement: external_resources[2..6] name the linked resource and its host (the field's subject is external resources), with the missing URL noted in source_caveats; errata and future_guarantees are not populated; maintainers[0] states the Point of Contact role (l.7499-7501), not merely where to look."
