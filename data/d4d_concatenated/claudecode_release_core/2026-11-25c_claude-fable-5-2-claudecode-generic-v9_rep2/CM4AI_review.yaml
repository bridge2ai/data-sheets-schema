  verdict: followed
  evidence: "Values sit in the fields they answer: release cadence in updates (frequency 'Quarterly', l.7093), the preservation commitment in retention_limit (Dataset.retention_limit asks how long the dataset will be available), the access route in distribution_formats[0].access_urls and its download constraint in that entry's description, the Point of Contact in maintainers rather than principal_investigator. File digests go in File.hash as 'md5:<hex>' (a string slot whose description asks for the algorithm with the value), not in the deprecated File.md5."
