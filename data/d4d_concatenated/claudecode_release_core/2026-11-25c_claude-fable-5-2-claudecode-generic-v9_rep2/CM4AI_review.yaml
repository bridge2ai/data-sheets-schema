  evidence: "External identifiers come from the bundle: every ORCID (e.g. l.7337, l.7498), ROR:0153tk833 (l.7335), the DOIs (l.7036, l.3802, l.7119, l.7645), https://fairscape.github.io (l.3853). No registry id is added for organizations named only by name. publisher https://dataverse.lib.virginia.edu/ is the host root of URLs the bundle states (l.7011, l.7807) - it appears only as a prefix, never alone - a truncation of evidence rather than an identifier from outside knowledge (see notes)."
