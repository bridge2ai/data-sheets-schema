- id: slot-003
  verdict: supported
  evidence: "line 4914 'Spectrograms - Time-frequency representations were computed using the short-time Fast Fourier Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT. Spectrograms were further downsampled by a factor of two in the time domain after derivation.' matches preprocessing_strategies[1].preprocessing_details; the entry's used_software torchaudio rests on line 4957 ('torchaudio [6, 7]') and the file name torchaudio_spectrogram.parquet (4938, 4947), separately receipted from c019."
- id: slot-004
  verdict: supported
  evidence: "line 4571 'Philip Payne' in the 3.1.0 release author list (also 'Payne, Philip' in the BibTeX at 4821); creators[6].name = Philip Payne."
- id: slot-005
  verdict: supported
  evidence: "line 4923 'HIPAA Safe Harbor identifiers were removed.' (3.1.0 de-identification steps) and line 3422 'x If checked, the Data is covered under a Certificate of Confidentiality' (the box is marked x, unlike the Privacy Act box at 3419) support the two regulatory_compliance strings; the slot asks which frameworks govern, and HIPAA (Safe Harbor) and a Certificate of Confidentiality are named. The first entry is phrased as a de-identification step and the DTUA (3414-3416) calls the controlled-access data PII 'not covered under HIPAA'; the record scopes the CoC entry to the controlled-access data, so no misreading."
- id: slot-006
  verdict: supported
  evidence: "line 4607 'Steven Bedrick' in the 3.1.0 author list; creators[24].name = Steven Bedrick."
- id: slot-007
  verdict: supported
  evidence: "line 2026 'the dataset should not be used for non-research applications, such as hiring decisions, insurance premium adjustments, or any form of surveillance ... These limitations are intended to prevent unethical or biased outcomes that could negatively impact individuals based on their health conditions or voice characteristics.' supports discouraged_uses[1] (insurance premium adjustments) and its reason. Line 2189 says 'non-clinical applications' for the same list; the record follows 2026."
- id: slot-008
  verdict: supported
  evidence: "line 4659 'Amer Ghavanini' in the 3.1.0 author list; creators[50].name = Amer Ghavanini."
- id: slot-009
  verdict: supported
  evidence: "lines 1256-1257 (NIH RePORTER) 'Principal investigator: BENSOUSSAN, YAEL EMILIE' / 'Organization: UNIVERSITY OF SOUTH FLORIDA'; consistent with the protocol's PI block (2602-2606, yaelbensoussan@usf.edu) and the documentation's 'from USF Health Morsani College of Medicine' (2028). creators[0].principal_investigator.affiliation[0].name = University of South Florida."
- id: slot-010
  verdict: supported
  evidence: "line 2125 'Diagnostic labels are the result of a clinical assessment of the participant. At each site, a local clinician provided the diagnosis based on a clinical interview and appropriate work-up. For the psychiatric disorders cohort, this assessment was determined by using the participants EHR record or using an active prescription, which was done outside of data collection by an appropriately licensed clinician.' is reproduced in labeling_strategies[0].labeling_details."
- id: slot-011
  verdict: supported
  evidence: "line 4986 '│   ├── depression.json' under phenotype/diagnosis in the 3.1.0 tree (4969); line 5055 says the json files are the data dictionaries, so file_type metadata_file, format JSON and media_type application/json follow from the named file. file_collections[2].resources[20] path phenotype/diagnosis/depression.json."
- id: slot-012
  verdict: supported
  evidence: "lines 3449-3453 'Recipient will not use the Data, either alone or in concert with any other information, to make any effort to contact individuals who are the subjects of the Data without appropriate Institutional Review Board (IRB) approval, specific written approval from Provider, and informed consent from the individual, if required.' matches prohibited_uses[2].description."
- id: slot-013
  verdict: supported
  evidence: "line 4912 'Patients presenting at specialty clinics and institutions were considered for enrollment ... Patients presenting at the given clinic were screened for inclusion and exclusion criteria prior to their visit by the project investigators'; line 1982 'Non-Probability Sample'; line 1403 'high volume expert clinics'; line 4886 'selected based on known conditions which manifest within the voice waveform'. sampling_strategies[0].strategies states each, attributed."
- id: slot-014
  verdict: supported
  evidence: "lines 4816-4819 (APA citation of the 3.1.0 page) 'Bensoussan, Y., Sigaras, A., ... Ghosh, S. (2026). Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information (version 3.1.0). PhysioNet . RRID:SCR_007345. https://doi.org/10.13026/8xbn-nq66' is the citation value verbatim apart from line joins."
- id: slot-015
  verdict: supported
  evidence: "line 5056 'as participants may have repeated visits in order to collect data, there may be more than one row per participant in the data files. Furthermore, there is no requirement the participant provide the same response for each visit. As a result, participant information for the same data element may vary across the data file.' = anomalies[1].anomaly_details (a redundancy/irregularity, as the slot asks)."
- id: slot-016
  verdict: supported
  evidence: "line 2026 'the dataset is not to be used ... b) for any purpose that could foreseeably cause harm or stigmatization to research participants, their families, communities, or specific populations' and 'These restrictions reflect the B2AI-Voice Consortium's commitment to advancing ethical and trustworthy research practices ...' support prohibited_uses[1] description and prohibition_reason."
- id: slot-017
