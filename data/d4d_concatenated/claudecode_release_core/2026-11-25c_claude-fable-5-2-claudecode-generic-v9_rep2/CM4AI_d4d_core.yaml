instances:
- instance_type: Perturb-seq data
  data_substrate: B2AI_SUBSTRATE:64
  description: Perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment
    and for undifferentiated (parental) KOLF2.1J iPSCs. The project's data-releases page describes
    Perturb-seq of >11,000 genes (whole-genome) for the iPSC datasets and Perturb-seq of 200
    genes for the TNBC cell datasets.
  source_caveats: The release description lists perturb-seq data for MDA-MB-468 cells as included,
    while the release's file list names perturb-seq archives for KOLF2 only and its external
    data links mark perturb-seq data in both KOLF2.1J iPSCs and MDA-MB-468 cells as "Embargoed".
- instance_type: SEC-MS data
  data_substrate: B2AI_SUBSTRATE:59
  description: Size exclusion chromatography-mass spectrometry (SEC-MS) data for MDA-MB-468
    breast cancer cells with and without treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived
    neuron progenitor cells (NPCs), neurons, and cardiomyocytes. The project's data-releases
    page describes SEC-MS capturing ~7,000 proteins for both the iPSC and the TNBC cell datasets.
- instance_type: AP-MS data
  data_substrate: B2AI_SUBSTRATE:58
  description: Affinity purification mass spectrometry (AP-MS) data for MDA-MB-468 breast
    cancer cells with treatment; the release's external data links name data for cells treated
    with paclitaxel and for cells treated with vorinostat.
  source_caveats: The project's data-releases page lists "AP-MS interactomes (coming soon!)"
    for the TNBC cell datasets, while the June 2026 release page lists AP-MS data as included;
    the release page is the higher-ranked source.
- instance_type: Immunofluorescence (IF) images
  data_substrate: B2AI_SUBSTRATE:56
  description: IF images in MDA-MB-468 breast cancer cells with and without treatment. The
    project's data-releases page describes IF images for 523 proteins for the TNBC cell datasets
    and lists IF images for the iPSC datasets as "coming soon".
  source_caveats: The June 2026 release page gives no per-file description of the image archives.
    The file descriptions of the image archives on the October 2025 release page each spoke
    of 464 proteins of interest and those on the March 2025 release page each of 563; neither
    figure is stated for the June 2026 files.
known_biases:
- bias_description: Data in this release was derived from commercially available de-identified
    human cell lines.
- bias_description: The data do not represent all biological variants which may be seen in
    the population at large.
known_limitations:
- limitation_description: This is an interim release.
- limitation_description: The release does not contain predicted cell maps, which will be
    added in future releases; computed cell maps are not included in this release.
- limitation_description: The current release is most suitable for bioinformatics analysis
    of the individual datasets.
- limitation_description: Requires domain expertise for meaningful analysis.
- limitation_description: 'The data are not yet in completed final form: some datasets are
    under temporary pre-publication embargo. The release''s external data links list perturb-seq
    data in KOLF2.1J iPSCs (undifferentiated) and perturb-seq data in MDA-MB-468 breast cancer
    cells (with and without treatment) as "Embargoed".'
- limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap.
collection_mechanisms:
- name: Immunofluorescence (IF) subcellular microscopy
  mechanism_details: 'Spatial proteomics data are generated using immunofluorescence (IF)
    subcellular microscopy: IF staining and high-resolution microscopy reveal protein localization
    and distribution within human cells. File descriptions on the October 2025 release page
    describe imaging by immunofluorescence-based staining (ICC-IF) and confocal microscopy,
    with nuclei stained with DAPI (blue channel), endoplasmic reticulum with a calreticulin
    antibody (yellow channel), microtubules with tubulin antibody (red channel), and an antibody
    against the protein of interest (green channel).'
- name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details: Protein-protein interaction data are generated using affinity purification
    mass spectroscopy (AP-MS); the May 2024 preprint describes AP-MS on endogenously tagged
    cell lines.
- name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details: Protein-protein interaction data are also generated using size-exclusion
    chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex and interaction
    mapping, which the May 2024 preprint presents with AP-MS as two orthogonal mass spectrometry-based
    approaches.
- name: Single-cell CRISPR perturbation screens (perturb-seq)
  mechanism_details: Genetic perturbation data are generated by single-cell CRISPR-Cas perturbation
    screens by cell type. File descriptions on the October 2025 release page describe an expressed
    genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced pluripotent stem
    cells mapping transcriptional and fitness phenotypes associated with 11,739 targeted genes.
data_collectors:
- name: Lundberg Lab
  collector_details: File descriptions on the October 2025 release page state that the immunofluorescence
    images were acquired in the Lundberg Lab at Stanford University as part of the CM4AI project;
    the May 2024 preprint states that IF images are downloaded from the Lundberg Laboratory's
    deposition archive.
- name: Nevan Krogan laboratory
  collector_details: File descriptions on the October 2025 release page state that the SEC-MS
    datasets were generated in the Nevan Krogan laboratory at the University of California
    San Francisco; the May 2024 preprint states that PPI networks are downloaded from the
    Krogan Laboratory's deposition archive.
sampling_strategies:
- description: CM4AI has elected to use the cancer cell line MDA-MB-468 (with or without treatment
    with paclitaxel and vorinostat) and the iPSC line KOLF2.1J (with or without neuronal and
    cardiomyocytic differentiation), both of which the May 2024 preprint describes as ethically
    sourced.
  source_data: MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established
    from a metastatic site pleural effusion of a 51-year-old black female with a metastatic
    mammary adenocarcinoma, available from ATCC. The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was
    derived from a healthy male Northern European donor and is available from the Human Induced
    Pluripotent Stem Cells Initiative (HipSci) resource.
preprocessing_strategies:
- name: AI-readiness packaging with FAIRSCAPE
  preprocessing_details: 'The May 2024 preprint describes the project''s packaging step: the
    FAIRSCAPE client (FAIRSCAPE-CLI) creates an RO-Crate package with the datasets, metadata,
    and software, or resolvable references to these components; the RO-Crates are then sent
    to the FAIRSCAPE server, where they are registered and assigned persistent, resolvable,
    globally unique persistent identifiers (PIDs) under the ARK scheme. The preprint states
    that these FAIR AI-Readiness metadata and validation toolkits have been used to package
    and release the project''s cell-line perturbation and measurement data.'
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    license: MIT
    url: https://fairscape.github.io
    description: AI-readiness framework with a client-side package (FAIRSCAPE-CLI) and a server
      application.
  source_caveats: The passages describe the project's practice as of May 2024; the June 2026
    release page does not itself describe how its files were packaged.
intended_uses:
- description: AI-ready datasets to support research in functional genomics.
- description: AI model training.
- description: Cellular process analysis.
- description: Cell architectural changes and interactions in presence of specific disease
    processes, treatment conditions, or genetic perturbations.
prohibited_uses:
- description: These laboratory data are not to be used in clinical decision-making or in
    any context involving patient care without appropriate regulatory oversight and approval.
