  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
  - May 2024 Data Release
  - Cell Maps for Artificial Intelligence - Data Release, https://doi.org/10.18130/V3/DXWOS5,
    University of Virginia Dataverse, V1
  - March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX, Dataverse version 1.4, publication
    date 2025-03-03
  - June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R, Dataverse version 2.1, publication
    date 2025-07-01
  - October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM, Dataverse version 2.1, publication
    date 2025-10-31
  - June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, Dataverse version 2.0, publication
    date 2026-06-17
  version_details: The project's data-releases page presents the June 2026 Data Release (Beta)
    as the latest release and lists the May 2024, March 2025, June 2025 and October 2025 Data
    Releases as its archive. The March 2025 release was described as including perturb-seq
    data in undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs
    and iPSC-derived NPCs, neurons, and cardiomyocytes; and IF images in MDA-MB-468 breast
    cancer cells in the presence and absence of chemotherapy (vorinostat and paclitaxel),
    packaged in RO-Crate format using the FAIRSCAPE framework. The June 2025 release, in its
    revised version, was described as adding RGB immunofluorescent images, corrections to
    ro-crate metadata, and changes to naming conventions, and as including SEC-MS data in
    treated and untreated MDA-MB468 breast cancer cells as well. The October 2025 release
    was described as including perturb-seq data for MDA-MB-468 breast cancer cells with and
    without treatment and undifferentiated (parental) KOLF2.1J iPSCs, SEC-MS data, and IF
    images in MDA-MB-468 breast cancer cells with and without treatment.
  source_caveats: The May 2024 preprint cites the Dataverse record 10.18130/V3/DXWOS5 as the
    location of the most recent CM4AI data at that time; the website archive names a "May
    2024 Data Release" without a DOI. The bundle does not state that the two are the same
    release, so both are listed.
