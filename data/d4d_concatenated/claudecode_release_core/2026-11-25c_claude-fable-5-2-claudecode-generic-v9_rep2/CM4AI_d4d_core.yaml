  update_details: The release's maintenance plan states that the dataset will be regularly
    updated and augmented through the end of the project in November 2026, with updates on
    a quarterly basis. The project's data-releases page states that CM4AI releases data quarterly,
    ensuring continuous updates to the cell maps and input data streams, and carries the notice
