id: https://cm4ai.org/
name: CM4AI
description: CM4AI (Cell Maps for Artificial Intelligence) is the Functional Genomics Grand
  Challenge in the NIH Bridge2AI program. The project is generating multi-modal data including
  protein-protein interaction (PPI), spatial localization, and genetic perturbation data in
  MDA-MB-468 breast cancer cells (with or without paclitaxel or vorinostat) and iPSCs (with
  or without differentiation). Its current release, the June 2026 Data Release (Beta) on the
  University of Virginia Dataverse, includes perturb-seq data for MDA-MB-468 breast cancer
  cells with and without treatment and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS
  data for MDA-MB-468 breast cancer cells with and without treatment, undifferentiated KOLF2.1J
  iPSCs, and iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS
  data for treated MDA-MB-468 breast cancer cells; and IF images in MDA-MB-468 breast cancer
  cells with and without treatment. Computed cell maps are not included in this release. The
  project's data-releases page states that CM4AI will deliver machine-readable hierarchical
  maps of cell architecture as AI-ready data, together with quarterly data releases of map-input
  data streams, and that CM4AI cell maps are produced from multimodal interrogation of chromatin
  modifiers, metabolic enzymes, and other proteins involved in cancer, neuropsychiatric, and
  cardiac disorders. According to the May 2024 preprint, the input data streams are integrated
  via the multi-scale integrated cell (MuSIC) software pipeline. The data-releases page describes
  CM4AI as a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon
  Fraser University, and the Hastings Center, and reports project figures of 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739
  genes targeted, and a data volume of 21.4 TB. The release metadata lists University of California
  San Diego, University of California San Francisco, Stanford University, and University of
  Virginia as production locations.
source_caveats: 'The record''s id is the project site the source manifest declares for this
  dataset; the DOI, version, status, issue date, citation and file list are those of the June
  2026 Data Release (Beta), which the project''s data-releases page presents as the latest
  release. Each release has its own DOI. The University of Virginia Dataverse page gives the
  publication date of the June 2026 release as 2026-06-17, while the project''s data-releases
  page shows "Released on: June 17, 2025" beside the same release; the sources disagree, and
  the Dataverse record, which the manifest ranks higher (data resource over documentation),
  is preferred. The June 2026 release page also carries "Data Creation Date 2025-02-27" and
  "Deposit Date 2025-02-27", the same values the March 2025, June 2025 and October 2025 release
  pages carry, so no creation date is recorded for the dataset. The release page states "FDA
  Regulated: No"; no regulatory restriction is recorded. The figures quoted from the project
  website (protein interactions, immunofluorescent images, proteins, genes, data volume) are
  not broken down by release. The bundle also contains a Nature article on a U2OS cell map;
  no passage about this dataset cites it, and no value here is taken from its description
  of that map.'
