- target_dataset: AI-READI controlled access dataset
  relationship_type: is_part_of
  description: The BMJ Open protocol paper states that the controlled access dataset contains
    all data available in the publicly accessible set plus more sensitive data, available
    to scientists whose institutions have completed legal and privacy use agreements. The
    documentation says the data held under controlled access include 5-digit zip code, sex,
    race, ethnicity, genetic sequencing data, past health records, medications, and traffic
    and accident reports. The BMJ Open paper adds that the requirements for controlled access
    datasets were being developed by the Data Access Committee.
  source_caveats: No identifier for the controlled access dataset appears in the bundle, so
    the target is given by name. The healthsheet describes its contents in the future tense
    ("will contain").
