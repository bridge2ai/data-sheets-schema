raw_data_sources:
- source_description: ECG device data exported in raw format to local storage.
  raw_data_format: .xml
- source_description: MoCA Duo application export (total score, section subscores, Memory
    Index Score and task completion times).
  raw_data_format: .csv
sampling_strategies:
- is_sample: false
  is_random: false
  is_representative: false
  why_not_representative: Rather than targeting the demographic distribution of the US population,
    the study is triple-balanced by recruiting race/ethnic groups, categories of T2DM and
    biological males and females in equal proportions, because building balanced datasets
    is critical for the development of unbiased machine learning models.
  source_data: The study base is all patients aged 40 years or older who had a medical encounter
    within each health system site. Recruitment pools were identified by screening electronic
    health records for diabetes and prediabetes ICD-10 codes.
  strategies: 'Non-probability sample. Recruitment sampling procedures aimed at approximately
    equal distribution of participants across diabetes severity; participants are recruited
    in waves, and the IRB protocol describes a stratified sample of potential participants
    selected from the combined site lists according to the sampling scheme. Inclusion criteria:
    able to provide consent, 40 years old or older, persons with or without type 2 diabetes,
    must speak and read English. Exclusion criteria: pregnancy, gestational diabetes, Type
    1 diabetes and, in the study description, adults older than 85 years of age.'
  source_caveats: The healthsheet states that the dataset contains all possible instances
    (all enrolled participants), which is what is_sample records; the study description gives
    the sampling method as Non-Probability Sample, which is what is_random records.
raw_sources:
- raw_data_details: The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but is not anticipated to be shared outside
    the project team at present, because it has not been mapped to standardized terminologies
    and may accidentally include personal health information or personally identifiable information.
    The healthsheet notes a possibility that raw data may be included in future releases of
    the controlled access dataset.
preprocessing_strategies:
- preprocessing_details: All data were mapped to standardized terminologies when possible,
    such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model for clinical
    data and the Digital Imaging and Communications in Medicine (DICOM) format for retinal
    imaging.
- preprocessing_details: Images are exported from imaging devices in their raw format, and
    some images required conversion to a DICOM standard format before upload; the BMJ Open
    protocol paper's device table lists exports in .fda and .sdt file formats converted to
    DICOM for the dataset.
- preprocessing_details: The BMJ Open protocol paper's monitoring device table lists an export
    in .FIT file format converted to the mHealth standard for the dataset; in the dataset
    structure description, all data files of the wearable activity monitor and wearable blood
    glucose directories follow the Open mHealth standard.
  source_caveats: The device table is flattened in the extracted text, so which monitoring
    device the .FIT cell belongs to cannot be read from it; no device is attributed here.
cleaning_strategies:
- cleaning_details: The Data Manager at each data site is responsible for the quality control
    of all data before uploading to FAIRhub.
- cleaning_details: 'Quality control at the time of data entry/acquisition: clinical data
    outside of expected min/max ranges were flagged in REDCap; Data Managers and clinical
    research coordinators examined participant records for credibility, incorrect flow through
    skip patterns, missing data that could be filled from other portions of the record, and
    omitted or duplicated records. Editing was done only under the guidance and approval of
    the site PI.'
- cleaning_details: The dataset has not undergone any formal external audits, but has been
    reviewed internally by AI-READI team members for quality checks and to ensure that no
    personally identifiable information was accidentally included.
future_use_impacts:
- impact_details: The creators do not currently anticipate any uses of the dataset that could
    result in unfair treatment or harm; however, there is a theoretical risk of future re-identification.
intended_uses:
- use_category: research
  description: 'Type 2 diabetes related research: accessing the public version of the dataset
    requires agreeing to use the data only for type 2 diabetes related research.'
- description: Future creation of artificial intelligence/machine learning (AI/ML) algorithms
    aimed at defining disease trajectories, which the study description gives as the purpose
    of the data generation.
prohibited_uses:
- description: Making clinical treatment decisions based on the Data.
  prohibition_reason: The Data is intended solely as a research resource.
- description: Using the Data, alone or in concert with other information, to compromise or
    otherwise infringe the confidentiality of information about an individual person who is
    the source of any Data.
- description: Using the Data to invade or compromise the privacy of any Data Subject.
- description: Attempting to identify or contact any Data Subject or group of Data Subjects.
- description: Extracting or extrapolating any identifying information about a Data Subject.
- description: Establishing a Data Subject's membership in a particular group of persons.
- description: Otherwise causing harm or injury to any Data Subject.
- description: Transferring, licensing, sublicensing, selling, assigning, displaying, sharing
    or otherwise conveying any portion of the Data or any derivative work to any third party
    other than another licensee bound by identical terms.
- description: Sharing or distributing Data with any third party model vendor or developer
    for training or development purposes.
- description: Reproducing Data in papers, articles, presentations, analyses, reports or publications,
    except for small representative samples in up to five images or figures per paper for
    illustrative purposes.
- description: Removing, obscuring, altering or masking the watermarking of the Data.
