instances:
- instance_type: individual patient (study participant)
  data_topic: B2AI_TOPIC:43
  counts: 2280
  label: false
  description: Each instance represents an individual patient and consists of all of the data
    available for that individual participating in the study. Multiple modalities of data
    are collected for each participant, including survey data, clinical data, retinal imaging
    data, environmental sensor data, continuous glucose monitor data and wearable activity
    monitor data.
  missing_information:
  - missing:
    - Not all modalities are available for all participants.
    why_missing:
    - Some participants elected not to participate in some study elements.
    - In a few cases, the data collection device did not have any stored results or was returned
      too late to retrieve the results (for example, the battery died or data was lost).
    - In a few cases, there may have been a data collision at some point in the process and
      data has been lost.
anomalies:
- anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: With wearables, improper use and technical failure such as battery failure
    or system malfunction are expected.
- anomaly_details: In imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are expected.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias, which may limit the generalizability of the results among those who are not represented
    in the study population.
- bias_description: Recruitment was predominantly urban and hospital-based, which may not
    fully capture diverse cultural and socioeconomic backgrounds.
known_limitations:
- limitation_description: The overall enrollment goal is a balanced distribution between groups,
    but enrollment is ongoing and the periodic updates to data releases may not have achieved
    balanced distribution across groups.
- limitation_type: representativeness_limitation
  limitation_description: The study cohort may not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific Islanders
    and Native Americans.
- limitation_description: Participants must speak and read English; the BMJ Open protocol
    paper notes that this requirement may have created challenges in recruiting Hispanic and/or
    Asian persons.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The healthsheet states that the dataset does not contain data that
    might be considered confidential and that no personally identifiable information is included
    in the dataset.
