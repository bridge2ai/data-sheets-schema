purposes:
- response: The dataset was created to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM),
    including salutogenic pathways to return to health. The goal is to better understand salutogenesis
    (the pathway from disease to health) in T2DM.
- response: An additional aim of the AI-READI project is to share its blueprint for collecting
    and sharing AI-ready datasets so that future data generation projects can follow it.
tasks:
- response: The multimodal dataset is being gathered to facilitate downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories, and various applications in
    artificial intelligence.
addressing_gaps:
- response: AI-based approaches may help improve the understanding of T2DM, but a key issue
    is the lack of data ready for training AI models; the AI-READI dataset is intended to
    fill this gap.
- response: To address inherent limitations of many existing large datasets for AI/ML training,
    the cohort is designed to be balanced in race/ethnicity, T2DM severity and biological
    sex.
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality and large multimodal
    datasets.
