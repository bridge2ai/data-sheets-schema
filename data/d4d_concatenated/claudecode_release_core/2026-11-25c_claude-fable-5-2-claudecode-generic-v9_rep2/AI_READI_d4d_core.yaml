- name: AI-READI team
  maintainer_details: The healthsheet states that the AI-READI team will be supporting and
    maintaining the dataset, which is hosted on FAIRhub through Microsoft Azure. The README
    directs questions, suggestions and feedback to https://aireadi.org/contact.
updates:
  frequency: Approximately once a year
  update_details: The dataset is released as static versions and will not be updated. New
    versions of the dataset will be released with additional instances as more study participants
    complete the study visit; this is the third version and consists of data collected up
    through the end of the second year of the study.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 3.0.0
  version_details: The Nature Metabolism comment of 2024 says each version is accessible through
    FAIRhub; the documentation of version 2.0.0, however, states that that version is no longer
    accessible and refers to version 3.0.0 as the latest. In this version the Snellen visual
    acuity variables were dropped, so that only logMAR visual acuity measurements are available.
ethical_reviews:
- reviewing_organization: Institutional Review Board of the University of Washington
  review_details: Approval number STUDY00016228, including reliance agreements with the IRBs
    of the University of Alabama at Birmingham and the University of California, San Diego.
    The initial approval was received on December 20, 2022; an annual renewal application
    to the IRB about the status and progress of the study is required.
human_subject_research:
  involves_human_subjects: true
  ethics_review_board: Institutional Review Board of the University of Washington
  irb_approval:
  - Approved by the Institutional Review Board of the University of Washington (approval number
    STUDY00016228); the initial IRB approval was received on December 20, 2022.
informed_consent:
- consent_obtained: true
  consent_type: Written informed consent, given electronically (e-consent) or in person.
  consent_documentation: Potential participants could read all consent documentation electronically
    in REDCap before their visit and give their consent with an electronic signature; for
    most participants informed consent is performed remotely by computer, tablet or smart
    phone, and otherwise in person at the start of the visit.
  consent_scope: The IRB protocol states that consent is obtained from subjects for secondary
    use, banking and future sharing, with language included in the consent form.
  withdrawal_mechanism: Participants were permitted to withdraw consent at any time and cease
    study participation.
at_risk_populations:
  at_risk_groups_included: false
  description: The eligibility criteria used required participants to be 40 years old or older
    and able to provide consent, and excluded pregnancy. The IRB protocol also answers that
    the research does not include minors, does not recruit or obtain data from individuals
    known to be prisoners, and does not include cognitively impaired adults or other adults
    unable to consent.
license_and_use_terms:
  data_use_permission:
  - disease_specific_research
  license_terms: The dataset is licensed under a custom license (AI-READI Data License Agreement,
    Version 2.0, available at https://doi.org/10.5281/zenodo.17555036) tailored to enable
    reuse of the AI-READI dataset for commercial or research purposes while putting strong
    requirements around data usage, security and secondary sharing to protect study participants.
    The Licensor grants a non-exclusive and non-transferable license to download, reproduce
    and use the Data, and to create derivative works of the Data. The public version of the
    dataset can only be used for type 2 diabetes related research.
  description: The Licensor named in the license agreement is Washington University in St.
    Louis.
ip_restrictions:
  restrictions:
  - Title to the Data, and all industrial and intellectual property rights therein, remain
    solely and exclusively with the Licensor and its suppliers.
regulatory_restrictions:
  regulatory_restrictions:
  - Licensees agree to comply with all data security and privacy standards established by
    the U.S. National Institutes of Health under its Genomic Data Sharing (GDS) Policy.
  - Licensees may use and store the data only on servers and devices maintained by and located
    within the licensee's institution or employer, or on cloud or remote storage and backup
    services that have a HIPAA-approved Business Associate Agreement in place with it.
data_governance:
  access_review_process: Access type PublicDownloadSelfAttestationRequired. Accessing the
    dataset requires several steps, including logging in through a verified ID system, agreeing
    to use the data only for type 2 diabetes related research, and agreeing to the license
    terms.
is_deidentified:
  identifiable_elements_present: false
  deidentification_details: No identifiers were collected, so no active de-identification
    was necessary, and it was checked that no identifiable data per US HIPAA were present
    in the data. Information related to the sex and race/ethnicity of the participants as
    well as medication used has also been removed.
  source_caveats: The dataset description (de-identification type NoDeIdentification) is the
    source of the values stated. The Nature Metabolism comment instead says the public set
    is stripped of PHI as defined by the HIPAA Privacy Rule via the Safe Harbor method; the
    dataset description is ranked higher, so no method is recorded.
