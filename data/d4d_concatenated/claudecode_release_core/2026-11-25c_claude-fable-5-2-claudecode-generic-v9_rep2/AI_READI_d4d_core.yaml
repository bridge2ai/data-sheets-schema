acquisition_methods:
- was_directly_observed: true
  acquisition_details: Some data were directly observable, such as labs, vitals and retinal
    imaging.
- was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: Other data were reported by subjects, for example survey responses.
    Verification of data entry was performed when possible, for example by cross-referencing
    entered medications with medications that were physically brought in or photographed by
    each study participant.
collection_mechanisms:
- name: Questionnaires in REDCap
  mechanism_details: REDCap is used for collecting patient-reported data from questionnaires,
    which participants complete online once enrolled; the IRB protocol allows them to be filled
    out electronically or on paper before or after the in-person visit.
- name: 12-lead electrocardiogram
  mechanism_details: A 12-lead ECG is performed with a Philips PageWriter TC30 Cardiograph.
- name: Monofilament test for peripheral neuropathy
  mechanism_details: A standard 10 g monofilament applies pressure to different points on
    the plantar surface of the feet, assessing touch perception on both feet.
- name: Montreal Cognitive Assessment (MoCA)
  mechanism_details: Research staff administer the MoCA electronically on an iPad using the
    MoCA Duo application, which captures the participant's responses.
- name: Visual acuity testing
  mechanism_details: Letter visual acuity is measured with the M&S Technologies Electronic
    Visual Acuity (EVA) tester under photopic conditions and, through a neutral density filter,
    mesopic conditions.
- name: Contrast sensitivity testing
  mechanism_details: The MARS Letter Contrast Sensitivity test (Perceptrix) was conducted
    monocularly under both photopic and mesopic conditions.
- name: Autorefraction
  mechanism_details: Autorefraction data for each eye are obtained with a Topcon KR 800 Auto
    Keratometer/Refractor.
- name: Blood and urine collection
  mechanism_details: Blood (non-fasting; 53 mL per the BMJ Open protocol paper) and urine
    samples are collected from participants who consent during the visit and are used for
    clinical laboratory testing.
- name: Undilated fundus photography (Optomed Aurora)
  mechanism_details: The Optomed Aurora IQ is a handheld fundus camera that takes non-mydriatic
    images of the ocular fundus; it is the one retinal imaging device used under undilated
    conditions.
- name: Home environmental sensor
  mechanism_details: A custom-designed environmental sensor unit called the LeeLab Anura,
    custom built for the AI-READI project, is placed in the participant's home for 10 days.
- name: Wearable activity monitor (Garmin Vivosmart 5)
  mechanism_details: The Garmin Vivosmart 5 fitness activity tracker is worn for 10 days to
    measure data related to physical activity.
- name: Continuous glucose monitor (Dexcom G6)
  mechanism_details: The Dexcom G6, a real-time integrated continuous glucose monitoring system,
    collects blood glucose measurements (mg/dL) every 5 minutes over a 10-day period.
- name: Blood pressure measurement
  mechanism_details: Blood pressure devices used across the data acquisition sites are the
    OMRON HEM 907XL Blood Pressure Monitor, the Medline MDS4001 Automatic Digital Blood Pressure
    Monitor and the Welch Allyn 6000 series Vital signs monitor.
- name: Lensometry
  mechanism_details: Lensometer devices used at data acquisition sites include the NIDEK LM-600P
    Auto Lensometer, the Topcon CL-200 computerized Lensometer and the Topcon CL-300 computerized
    Lensometer.
- name: Dilated fundus photography (iCare EIDON)
  mechanism_details: The iCare EIDON is a widefield TrueColor confocal fundus imaging system
    that can capture images up to 200 degrees.
- name: Heidelberg Spectralis HRA
  mechanism_details: Imaging with the Heidelberg Spectralis HRA+OCT is done in a dark room
    using the ONH-RC and PPole-H modalities and OCTA of the macula.
- name: Topcon Triton DRI OCT
  mechanism_details: The DRI OCT Triton from Topcon Healthcare combines swept-source OCT technology
    with multimodal fundus imaging.
- name: Topcon Maestro2 3D OCT
  mechanism_details: The Maestro2 is a robotic OCT and color fundus camera system from Topcon
    Healthcare.
- name: Fluorescence lifetime imaging ophthalmoscopy (Heidelberg FLIO)
  mechanism_details: FLIO imaging is done by an operator in a dark room and is performed as
    the last modality of an AI-READI visit.
- name: Zeiss Cirrus 5000 Angioplex
  mechanism_details: The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence
    tomography (OCT) system.
collection_timeframes:
- name: Data collection period of version 3.0.0
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: For this version of the dataset, the timeframe for data collection was
    July 19, 2023 to May 1, 2025.
- name: Overall study timeline
  start_date: '2023-07-19'
  timeframe_details: 'The timeline for the overall project spans four years: one year dedicated
    to protocol development and training, and years 2-4 allocated for subject recruitment
    and data collection. The study description gives an actual start date of 2023-07-19, an
    overall status of Enrolling by invitation and an anticipated completion date of 2027-01-01.
    Preliminary pilot enrollment occurred between 18 July 2023 and 30 November 2023, the formal
    data collection process began on 1 December 2023, and the BMJ Open protocol paper states
    that enrollment will continue until 30 November 2026.'
  source_caveats: start_date is the study description's actual start date; the BMJ Open protocol
    paper says enrollment began on 18 July 2023. The study description is ranked higher.
