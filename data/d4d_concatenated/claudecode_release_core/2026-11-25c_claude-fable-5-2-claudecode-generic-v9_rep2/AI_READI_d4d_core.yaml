version: 3.0.0
id: doi:10.60775/fairhub.3
name: AI-READI dataset
description: 'Version 3.0.0 of the AI-READI dataset, a dataset of data collected from individuals
  with and without type 2 diabetes mellitus (T2DM) and harmonized across 3 data collection
  sites. This version contains data from 2280 participants collected between July 19, 2023
  and May 1, 2025. Data from multiple modalities are included: survey data, clinical data,
  retinal imaging data, environmental sensor data, continuous glucose monitor data and wearable
  activity monitor data, encompassing tabular data, imaging data and physiological signal/waveform
  data, with no unstructured text data. The data contain no protected health information (PHI);
  information related to the sex and race/ethnicity of the participants and to medication
  used has been removed. The dataset contains 356,343 files and is around 3.82 TB in size.'
source_caveats: 'Referent: the public release 3.0.0 of the AI-READI dataset (DOI 10.60775/fairhub.3).
  The bundle also holds the documentation page and FAIRhub page of release 2.0.0, two publications
  about the study, the NIH award page and the IRB protocol application; statements taken from
  those are marked as such in the entries that use them. Disagreements and gaps: (1) the dataset
  description gives 2023-07-19 as the start of data collection and the study start date, while
  the BMJ Open protocol paper says enrollment began on 18 July 2023; the dataset description
  is ranked higher and is the value stated. (2) The dataset description records the de-identification
  type as NoDeIdentification with the detail that no identifiers were collected, while the
  Nature Metabolism comment says the public set is stripped of PHI via the HIPAA Safe Harbor
  method; the dataset description is ranked higher and is what is_deidentified states. (3)
  Enrollment targets differ by document and are plans, not dataset figures: 4000 (BMJ Open
  paper, study description), 4,000+ (NIH RePORTER) and 4600 (IRB protocol application). (4)
  The license is named three ways: "AI-READI custom license v2.0" (dataset description), "Health
  Data License" (FAIRhub page) and "AI-READI Data License Agreement (Version 2.0)" (license
  document). (5) The healthsheet''s composition answer says the dataset holds all participants
  enrolled "during the first year of data collection", while its versioning answers and the
  README say this version covers data up through the end of the second year; the version 3.0.0
  documentation page says v3.0 "contains data from the participants of the pilot study phase",
  wording it shares with the version 2.0.0 page. (6) The record''s own computation: the nine
  data type directories sum to 3,815,969,360,064 bytes and 356,334 files (inputs: the size
  and numberOfFiles of each directory), against stated totals of 3,815,969,779,678 bytes and
  356,343 files; the differences are 419,614 bytes and 9 files, and nine dataset-level metadata
  files are listed. (7) Stated absences, for which no slot is filled: no data protection impact
  analysis has been conducted; the dataset has not been used for any tasks already; no repository
  links papers that use it; there are no limits on the retention of the data; there is no
  mechanism for others to extend the dataset; no labels are provided and there are no formal
  guidelines for creating new labels; the erratum answer is empty. (8) The citation is given
  only as an instruction to follow docs.aireadi.org, so the citation slot is empty.'
