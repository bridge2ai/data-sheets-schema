distributions:
- description: 'Derived audio data features: dense binary files in Parquet format and plain-text
    files, each associated with a data dictionary file which has the same file stem and a
    JSON suffix. Spectrograms, Mel spectrograms, MFC coefficients, PPGs, and EMAs for sensitive
    records and audio checks have been removed from v3.1.'
  id: doi:10.13026/37yb-1t42#collection-features
  name: features
  path: features
- description: Phonetic posteriorgram probabilities across 40 phoneme categories, of dimension
    40xT with a frame rate of 100Hz (n=29289).
  id: doi:10.13026/37yb-1t42#file-features-ppgs.parquet
  name: ppgs.parquet
  path: features/ppgs.parquet
- description: Estimated electromagnetic articulography (EMA) using a deep learning model,
    with dimensions Tx12 corresponding to X/Y positions of six articulators (n=28640).
  id: doi:10.13026/37yb-1t42#file-features-sparc_ema.parquet
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
- description: Estimated loudness based on the average absolute amplitude of the audio waveform,
    using 20ms windows (n=31855).
  id: doi:10.13026/37yb-1t42#file-features-sparc_loudness.parquet
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
- description: Estimated periodicity (confidence of pitch presence) derived from the audio
    using 20ms windows (n=31872).
  id: doi:10.13026/37yb-1t42#file-features-sparc_periodicity.parquet
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
- description: Estimated fundamental frequency (F0) of the audio signal, with a range of 50-550Hz
    (n=31872).
  id: doi:10.13026/37yb-1t42#file-features-sparc_pitch.parquet
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform (n=29278).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio_spectrogram.parquet
  name: torchaudio_spectrogram.parquet
  path: features/torchaudio_spectrogram.parquet
  source_caveats: The file list names torchaudio_spectrogram.parquet; the description carrying
    the dimension and count names torchaudio_spectrograms.parquet.
- description: Mel-frequency cepstrum coefficients of dimension 60xT (n=29278).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio_mfcc.parquet
  name: torchaudio_mfcc.parquet
  path: features/torchaudio_mfcc.parquet
- description: Detected pitch (fundamental frequency) over time, with a min and max pitch
    of 80 and 500 respectively (n=32522).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio_pitch.parquet
  name: torchaudio_pitch.parquet
  path: features/torchaudio_pitch.parquet
- description: Mel spectrograms of dimension 60xT generated with 60 Mel bins (n=29278).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio_mel_spectrogram.parquet
  name: torchaudio_mel_spectrogram.parquet
  path: features/torchaudio_mel_spectrogram.parquet
  source_caveats: The file list names torchaudio_mel_spectrogram.parquet; the description
    carrying the dimension and count names torchaudio_mel_spectrograms.parquet.
- description: One feature per audio recording derived from the raw audio related to quality
    control metrics.
  format: TSV
  id: doi:10.13026/37yb-1t42#file-features-audio_quality_metrics.tsv
  media_type: text/tab-separated-values
  name: audio_quality_metrics.tsv
  path: features/audio_quality_metrics.tsv
- description: Features derived from the raw audio, with one feature per audio recording and
    one row per unique recording.
  format: TSV
  id: doi:10.13026/37yb-1t42#file-features-static_features.tsv
  media_type: text/tab-separated-values
  name: static_features.tsv
  path: features/static_features.tsv
- description: A binary file made available as Parquet and its corresponding data dictionary,
    with specific information about the recording, including task instructions and prompts,
    as well as information about the microphone used and its gain.
  id: doi:10.13026/37yb-1t42#collection-metadata
  name: metadata
  path: metadata
- description: Organized information collected from the participant or other individual during
    their encounter, in subfolders for confounders, demographics, diagnosis, enrollment, questionnaire
    and task. Every TSV data file has a data dictionary with the same file stem and a json
    suffix.
