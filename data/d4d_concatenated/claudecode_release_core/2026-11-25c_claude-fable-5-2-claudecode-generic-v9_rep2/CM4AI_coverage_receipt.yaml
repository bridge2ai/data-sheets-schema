- id: c010
  status: extracted
  extracted:
  - slot: "title"
    snippet: "This article describes the Cell Maps for Artificial Intelligence (CM4AI) project"
  - slot: "description"
    snippet: "Input data streams are integrated via the multi-scale integrated cell (MuSIC) software pipeline"
  - slot: "purposes[0].response"
    snippet: "produce ethical, AI-ready datasets of cell architecture, inferred from multimodal data collected for human cell lines, to enable transformative biomedical AI research"
  - slot: "purposes[1].response"
    snippet: "CM4AI’s objective is to deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed conditions"
  - slot: "funders[0].description"
    snippet: "CM4AI is the Functional Genomics Data Generation Project in the U.S. National Institute of Health’s (NIH) Bridge2AI program"
  - slot: "collection_mechanisms[0].name"
    snippet: "CM4AI input data streams are generated using immunofluorescence (IF) subcellular microscopy for spatial proteomics data"
  - slot: "collection_mechanisms[0].mechanism_details"
    snippet: "CM4AI input data streams are generated using immunofluorescence (IF) subcellular microscopy for spatial proteomics data"
  - slot: "collection_mechanisms[0].mechanism_details"
    snippet: "immunofluorescence (IF) staining and high-resolution microscopy reveal protein localization and distribution within human cells"
  - slot: "collection_mechanisms[1].name"
    snippet: "affinity purification mass spectroscopy (AP-MS)"
  - slot: "collection_mechanisms[1].mechanism_details"
    snippet: "affinity purification mass spectroscopy (AP-MS)"
  - slot: "collection_mechanisms[1].mechanism_details"
    snippet: "we employed AP-MS on endogenously tagged cell lines"
  - slot: "collection_mechanisms[2].name"
    snippet: "size-exclusion chromatography coupled to mass spectrometry (SEC-MS)"
  - slot: "collection_mechanisms[2].mechanism_details"
    snippet: "size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex/interaction mapping as two orthogonal mass spectrometry"
  - slot: "collection_mechanisms[3].name"
    snippet: "single-cell CRISPR-Cas perturbation screens by cell type"
  - slot: "collection_mechanisms[3].mechanism_details"
    snippet: "single-cell CRISPR-Cas perturbation screens by cell type"
  - slot: "sampling_strategies[0].description"
    snippet: "CM4AI has elected to use the cancer cell line MDA-MB-46828 (+/- treatment with paclitaxel and vorinostat) and the iPSC line KOLF2.1J29 (+/- neuronal and cardiomyocytic differentiation), both of which have been ethically sourced"
  - slot: "sampling_strategies[0].source_data"
    snippet: "MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from a metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma, available from ATCC"
  - slot: "sampling_strategies[0].source_data"
    snippet: "The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male Northern European donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource"
  - slot: "is_deidentified.deidentification_details"
    snippet: "CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue"
  - slot: "is_deidentified.deidentification_details"
    snippet: "cultures) and are considered to be de-identified as they cannot be matched, with current knowledge, to a human subject"
  - slot: "creators[46].principal_investigator.email"
    snippet: "corresponding author – tideker@health.ucsd.edu"
