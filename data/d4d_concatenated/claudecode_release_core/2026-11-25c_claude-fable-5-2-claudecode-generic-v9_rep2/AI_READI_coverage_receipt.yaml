  - slot: description
    snippet: "is a dataset consisting of data collected from individuals with and without “Type 2 Diabetes Mellitus (T2DM)” and harmonized across 3 data collection sites"
  - slot: description
    snippet: "Multiple modalities of data are collected for each participant, including survey data, clinical data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable activity monitor data."
  - slot: description
    snippet: "These encompass tabular data, imaging data, and physiological signal/waveform data. There is no unstructured text data included in this dataset."
  - slot: updates.update_details
    snippet: "The dataset gets released as static versions. This is the third version of the dataset and consists of data collected up through the end of the second year of the study"
  - slot: updates.frequency
    snippet: "There are plans to release new versions of the dataset approximately once a year"
  - slot: related_datasets[1].description
    snippet: "the first version of the dataset contains data from 204 participants"
  - slot: related_datasets[1].description
    snippet: "the first version of the dataset, which consisted of data collected during the pilot data collection phase"
  - slot: related_datasets[0].description
    snippet: "the second version contains additional data from 863 participants for a total of 1067 participants"
  - slot: related_datasets[0].description
    snippet: "The second version of the dataset, composed of data from the first year of the study, had 1067 instances."
  - slot: version_access.version_details
    snippet: "the Snellen visual acuity variables were dropped in this version of the dataset, such that now only logMAR visual acuity measurements are available"
  - slot: splits[0].split_details
    snippet: "a new recommended data split for the 2280 participants balancing training, validation, and testing sets for age, sex, races/ethnicities, and study group"
  - slot: purposes[0].response
    snippet: "The purpose for creating the dataset was to enable future generations of artificial intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways to return to health."
  - slot: purposes[0].response
    snippet: "The goal is to better understand salutogenesis (the pathway from disease to health) in T2DM."
  - slot: addressing_gaps[0].response
    snippet: "a key issue is the lack of data ready for training AI models. The AI-READI dataset is intended to fill this gap."
  - slot: tasks[0].response
    snippet: "The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime manifolds and various applications in artificial intelligence."
