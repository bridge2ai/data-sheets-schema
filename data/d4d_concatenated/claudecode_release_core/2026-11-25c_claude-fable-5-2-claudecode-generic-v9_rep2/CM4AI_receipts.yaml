        streams
    - chunk: c016
      snippet: CM4AI cell maps are produced from multimodal interrogation of chromatin
        modifiers, metabolic enzymes, and other proteins involved in cancer, neuropsychiatric,
        and cardiac disorders
    - chunk: c016
      snippet: CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin,
        UA Birmingham, Simon Fraser University, and the Hastings Center
    - chunk: c016
      snippet: Protein Interactions 1,374 Immunofluorescent Images 53,788 Total Proteins
        Investigated 7,023 genes targeted 11,739 Data volume 21.4 TB
    - chunk: c026
      snippet: This dataset is the June 2026 Data Release of Cell Maps for Artificial
        Intelligence (CM4AI; CM4AI.org), the Functional Genomics Grand Challenge in
        the NIH Bridge2AI program.
    - chunk: c026
      snippet: CM4AI is generating multi-modal data including protein-protein interaction
        (PPI), spatial localization, and genetic perturbation data in MDA-MB-468 breast
        cancer cells (+/- paclitaxel or vorinostat) and iPSCs (+/- differentiation).
    - chunk: c026
      snippet: Perturb-seq data for MDA-MB-468 breast cancer cells +/- treatment and
        undifferentiated (parental) KOLF2.1J iPSCs SEC-MS data for MDA-MB-468 breast
        cancer cells +/- treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived
        neuron progenitor cells (NPCs), neurons, and cardiomyocytes AP-MS data for
        MDA-MB-468 breast cancer cells + treatment IF images in MDA-MB-468 breast
        cancer cells +/- treatment
    - chunk: c026
      snippet: Computed cell maps not included in this release
