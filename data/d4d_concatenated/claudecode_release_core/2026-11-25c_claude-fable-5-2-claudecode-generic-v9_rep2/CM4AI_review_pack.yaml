  note: 'Class/required/forced flags use the current implementation''s merged full schema; they do not establish what the historical run''s schema required. required includes the compiler''s normalization of identifier slots. forced: the current schema declares this class''s id as an identifier or required, so current validation requires the id given the object — it settles the id''s presence, not the object''s. origin/base_in_bundle use the separately disclosed identity_rules resolver basis. origin (#901): minted is a urn or a fragment on the record''s own id (under those aliases and the released own-ID exemptions); constructed is a fragment on an identifier the record did not mint (base named; base_in_bundle says whether that base appears in the bytes the record read, as itself and not as the prefix of a longer URL, in its written or alias form; null when those bytes are not on disk — see bundle_state); stated is a reference used as written. Judge historical fragment instructions against the recorded instruction and its schema, for both minted and constructed entries. A current forced flag alone does not establish historical compliance. Establish from the evidence whether a constructed base belongs to this dataset or another entity; alias equality and literal base presence are not support judgments. stated entries are the evidence rules'' business only. minted (boolean) is kept for packs that read it: it is origin == minted. resources[*].id is also consumed by `d4d derive core`''s projection.'
