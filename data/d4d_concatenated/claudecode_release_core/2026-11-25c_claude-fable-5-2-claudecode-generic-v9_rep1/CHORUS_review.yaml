- id: slot-018
  verdict: weak
  evidence: "the value says Manlik Kwong is 'Listed on the \"Bridge2AI CHoRUS Leadership Team\" slide of the September 09, 2025 webinar'. The cited snippet is the webinar's date line (line 74), which supports only the date. The claim that carries the meaning, his listing on the leadership slide, is at lines 171 and 189-190 and is not in this snippet. Contrast slot-025, where the same string is receipted by the slide title. The value is true; this receipt is real and on topic but does not attest its main claim"
- id: slot-019
  verdict: supported
  evidence: "line 45: 'will meet the need of generating data for ML/AI applications aimed at characterizing acute and critical care illness, predicting complications, and measuring treatment response among patients with acute or critical illness'; purposes[0].response restates this as the dataset's purpose"
- id: slot-020
  verdict: supported
  evidence: "line 1075-1076 'Current Released Dataset 50,000 Patient admissions from ICU, PICU, and NICU', lines 242-244 'As of August 2025, covers 14 different hospitals with over 45K unique admissions', lines 1065-1067 'Anticipated Final Dataset 100,000 Patient admissions', line 45 'acquiring an AI-ready data set from more than 100,000 critically ill patients'; instances[0].description states each figure with its source and its current or anticipated status"
- id: slot-021
