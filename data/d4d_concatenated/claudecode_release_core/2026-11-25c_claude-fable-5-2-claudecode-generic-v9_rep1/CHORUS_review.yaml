- id: slot-016
  verdict: supported
  evidence: "lines 1074-1078: 'Current Released Dataset ... 1.6 Billion / Rows of EHR OMOP data'; instances[1].counts 1600000000 transcribes the stated figure as an integer, and source_caveats says the website shows it as a round figure and the integer does not assert an exact total"
- id: slot-017
