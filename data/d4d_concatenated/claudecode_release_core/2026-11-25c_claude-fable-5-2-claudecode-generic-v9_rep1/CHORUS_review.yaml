- id: chunk-c001
  verdict: confirmed
  evidence: "lines 1-18 are the concatenation header (input directory, file count, extensions, selection manifest) and the table of contents naming the four source files; no statement about the dataset, so nothing a datasheet slot could carry"
- id: slot-002
  verdict: supported
  evidence: "line 45 (NIH abstract) reads 'There is an urgent need for infrastructure to support artificial intelligence and machine learning (AI/ML) in critical care. Developing high-resolution multi-center data sets is a critical first step towards actionable and trustworthy AI.'; addressing_gaps[0].response joins the two sentences verbatim and states the gap the dataset addresses, as AddressingGap.response asks"
- id: slot-003
  verdict: supported
  evidence: "lines 293-296 in the webinar's CHoRUS Dataset table list 'Medication administration (dosing time-stamped upon each infusion change or dose administration)' under 'Data type' (line 260); instances[4] records instance_type 'Medication administration' with that parenthetical as description, attributed to the table"
- id: slot-004
  verdict: supported
  evidence: "lines 308-310 list 'Clinical notes (extracted and tokenized using OHNLP toolkit)' as a data type and line 247 on the same slide says 'Clinical notes – stored locally except tokens'; instances[8] carries both, attributed to the slide, at the passage's reach"
- id: slot-005
  verdict: supported
  evidence: "UpdatePlan asks whether the dataset will be updated, e.g. to add new instances; lines 1065-1075 (website) separate an 'Anticipated Final Dataset' (100,000 admissions, 9 modalities) from the 'Current Released Dataset', and lines 251-254 (webinar, 2025-09-09) say imaging de-id is 'in process for larger cohort' and 'EEG – extraction in process at this point'; updates.update_details states those planned additions as the sources do, without inventing a cadence or channel"
- id: slot-006
  verdict: supported
  evidence: "line 45 (abstract, future tense): 'establish a legal framework for collecting data at scale, sampling to ensure comprehensive sets of patient conditions and clinical treatment strategies'; line 1220 (GitHub overview): 'Federated access will enable sampling methods to ensure a balanced and diverse cohort'; sampling_strategies[0].description quotes both and marks them 'Planned', matching the sources' tense"
- id: slot-007
  verdict: weak
  evidence: "lines 251-252 'Imaging – currently 1000 images available with de-id in process for larger cohort' are real and the value transcribes them faithfully, but deidentification_details asks for de-identification procedures and residual risks (Deidentification: can individuals be identified); the passage gives an in-progress status for one modality, not a procedure or risk, so it is on topic without answering the slot's question"
- id: slot-008
  verdict: supported
  evidence: "line 45: 'generating data for ML/AI applications aimed at characterizing acute and critical care illness, predicting complications, ...'; tasks[0].response 'Characterizing acute and critical care illness.' is the first task of that list, stated as the source states it"
- id: slot-009
  verdict: supported
  evidence: "line 1254 'The starting reference for data managers at data contributing sites is the Chorus_SOP page', and line 1071 (website) '14 Data contributing hospitals'; data_collectors[0].role 'data contributing site' names the role the sources give the sites that collect and contribute data. DataCollector.role is a free string whose schema examples are categories (researcher, crowdworker), so a category role is the slot's own form"
- id: slot-010
  verdict: supported
  evidence: "lines 171 and 186-187: under the heading 'Bridge2AI CHoRUS Leadership Team', 'Parisa Rashidi' / 'University of Florida'; creators[4] carries that name, that affiliation as an Organization object, and a description saying exactly where she is listed (the webinar dated 2025-09-09 at line 74). The value treats leadership-team membership as the creator role, and the description says so openly"
- id: slot-011
  verdict: supported
  evidence: "line 1094 'This project is funded by the NIH under award number OT2OD032701' and line 1062 'National Institute of Health (NIH) funded Bridge2AI consortium'; funders[0].grantor 'National Institutes of Health (NIH)' names the agency the passages name. The website spells it 'Institute', and the record uses the agency's own plural form, which also appears in the NIH page's 'United States National Institutes of Health' at line 50. The meaning is the same"
- id: slot-012
  verdict: supported
  evidence: "line 240 '• Controlled access' on the webinar's CHoRUS Dataset slide; the ConfidentialityLevelEnum value 'restricted' is defined as 'Restricted access requiring approval or registration ... requiring controlled access', a plain restatement of the passage's category; the registration and licensing steps at lines 444-455 corroborate it"
- id: slot-013
  verdict: supported
  evidence: "lines 1196-1200 (GitHub overview, present tense): 'The goal of the CHoRUS Network is to develop the most diverse, high-resolution, ethically sourced, AI-ready data set to answer the grand challenge of improving recovery from acute illness.'; purposes[2].response restates it verbatim"
- id: slot-014
  verdict: supported
