    License (for files): Bridge2AI Voice Registered Access License. Data Use Agreement: Bridge2AI
    Voice Registered Access Agreement. No training is required. The project documentation
    states that the adult and pediatric datasets are available through separate PhysioNet
    links under registered access, that credentialed users must be approved and sign the DUA,
    and that the Bridge2AI-Voice Registered Access Agreement outlines the terms and conditions
    for data use.'
regulatory_restrictions:
