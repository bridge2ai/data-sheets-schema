data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: 'Raw audio is under controlled access. The dataset''s PhysioNet page
    directs requests for raw audio to the access committee (DACO@b2ai-voice.org) and states
    that institutional sign-off is required. The project documentation gives the controlled-access
    steps: complete the Data Access Request Form (DARF), complete the Data Use Agreement (DUA),
    submit the application to the Data Access Compliance Office for review and, upon approval,
    ensure a Data Use and Transfer Agreement (DTUA) is signed by an authorized official at
    the applicant''s institution.'
  source_caveats: The controlled-access steps come from the project documentation's general
    section on accessing the feature-only and raw audio datasets. The Data Transfer and Use
    Agreement template in the bundle names the Data Access Compliance Office ("DACO") as the
    body whose approval makes the agreement effective; its data description is the Bridge2AI-Voice
    dataset in general, and its terms are not recorded here as terms of this release.
