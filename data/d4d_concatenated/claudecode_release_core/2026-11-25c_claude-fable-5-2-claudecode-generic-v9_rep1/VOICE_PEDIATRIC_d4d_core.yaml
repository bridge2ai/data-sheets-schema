distributions:
- description: Derived audio data features. Time-varying features are in Parquet files and
    static features in a plain-text file; each file is associated with a JSON data dictionary
    with the same file stem.
  id: doi:10.13026/mf9s-5r03#collection-features
  name: features
  path: features
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-spectrograms-parquet
  name: torchaudio_spectrograms.parquet
- description: Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms
    hop length, a 400-point FFT and 60 Mel bins (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-mel-spectrograms-parquet
  name: torchaudio_mel_spectrograms.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters
    as the mel spectrograms (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-mfcc-parquet
  name: torchaudio_mfcc.parquet
- description: The detected pitch (fundamental frequency) over time, of dimension T, with
    a min and max pitch of 80 and 500 respectively (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-pitch-parquet
  name: torchaudio_pitch.parquet
- description: 'The estimated electromagnetic articulography (EMA) using a deep learning model,
    with dimensions Tx12 where the 12 correspond to X/Y positions of six articulators: tongue
    dorsum (TD), tongue body (TB), tongue tip (TT), lower incisor (LI), upper lip (UL) and
    lower lip (LL) (n=23532).'
  id: doi:10.13026/mf9s-5r03#file-sparc-ema-parquet
  name: sparc_ema.parquet
- description: The estimated loudness based on the average absolute amplitude of the audio
    waveform, of size T, using 20ms windows (n=23532).
  id: doi:10.13026/mf9s-5r03#file-sparc-loudness-parquet
  name: sparc_loudness.parquet
- description: The estimated periodicity (confidence of pitch presence) derived from the audio
    using 20ms windows, of dimension T (n=23532).
  id: doi:10.13026/mf9s-5r03#file-sparc-periodicity-parquet
  name: sparc_periodicity.parquet
- description: The estimated fundamental frequency (F0) of the audio signal, described as
    "using a different algorithm than before", with a range of 50-550Hz and dimension T (n=23532).
  id: doi:10.13026/mf9s-5r03#file-sparc-pitch-parquet
  name: sparc_pitch.parquet
- description: The phonetic posteriorgram probabilities across 40 phoneme categories, giving
    a dimension of 40xT with a frame rate of 100Hz (n=23533).
  id: doi:10.13026/mf9s-5r03#file-ppgs-parquet
  name: ppgs.parquet
- description: Features derived from openSMILE, Praat, parselmouth and torchaudio; each feature
    is present in this file.
  format: TSV
  id: doi:10.13026/mf9s-5r03#file-static-features-tsv
  media_type: text/tab-separated-values
  name: static_features.tsv
- description: Phenotypic information acquired during data collection. A phenotype file can
    be loaded with any statistical analysis tool.
  id: doi:10.13026/mf9s-5r03#collection-phenotype
  name: phenotype
  path: phenotype
- description: A phenotype file, read in the usage notes as a tab-separated file with a header
    row.
  format: TSV
  id: doi:10.13026/mf9s-5r03#file-demographics-tsv
  media_type: text/tab-separated-values
  name: demographics.tsv
- description: Metadata information for the recordings.
  id: doi:10.13026/mf9s-5r03#collection-metadata
  name: metadata
  path: metadata
purposes:
- response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset
    to enable future research in artificial intelligence and support critical insights into
    the use of voice as a biomarker of health.
- response: Establishing a robust multi-institutional dataset that integrates pediatric voice
    data with demographic information would advance the understanding of voice and disease
    as well as early detection and intervention.
addressing_gaps:
- response: The availability of large-scale pediatric databases is limited. Data collection
    in pediatric populations poses unique challenges such as privacy issues, consent processes
    and the need for developmentally appropriate tasks, and these factors have contributed
    to the lack of publicly available pediatric data sets that enable machine learning for
    pediatric voice analysis.
- response: Pediatric and adult voice and speech production are fundamentally different because
    the respiratory system and larynx undergo rapid functional maturation throughout childhood,
    so normative data from adults cannot be generalized to pediatric populations.
- response: The literature is sparser in terms of pediatric voice and speech analysis, partly
    due to ethical concerns and challenges in data acquisition for this cohort; because voice
    and speech vary with a child's development, a voice database of a normal cohort of different
    age groups is described as key to helping machine learning models diagnose age-specific
    speech delays and disorders.
  source_caveats: From the background section of the project's IRB protocol (Bridge2AI Voice
    Data Acquisition) on its pediatric disease category, written as a statement of intent
    before data collection.
