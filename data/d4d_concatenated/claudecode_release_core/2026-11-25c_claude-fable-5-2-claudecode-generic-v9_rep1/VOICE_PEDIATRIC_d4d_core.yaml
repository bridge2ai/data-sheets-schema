version: 1.1.0
id: doi:10.13026/mf9s-5r03
name: Bridge2AI-Voice Pediatric Dataset
description: Bridge2AI-Voice Pediatric Dataset v1.1.0 contains derived audio features for
  23,533 recordings collected from 300 participants aged 2-18. The release contains data considered
  low risk, including derivations such as spectrograms but not the original voice recordings.
  Detailed demographic, clinical, and validated questionnaire data are also made available.
  The dataset holds derived audio data features, phenotypic information acquired during data
  collection, and metadata information for the recordings, and is distributed on PhysioNet
  to credentialed users who sign the data use agreement.
source_caveats: 'The PhysioNet page states two DOIs: 10.13026/h995-bt35 for version 1.1.0
  and 10.13026/mf9s-5r03 for the latest version. This record''s id is the latest-version DOI
  and its doi slot is the version 1.1.0 DOI, the one the recommended citation uses. Five of
  the bundle''s six sources (the IRB protocol, the project documentation, the NIH RePORTER
  page, the Data Transfer and Use Agreement and the documentation repository README) chiefly
  describe the Bridge2AI-Voice project and its adult dataset; values were taken from them
  only where a passage is about the pediatric data, about the project as a whole, or about
  a named person. The study metadata, healthsheet answers and de-identification statements
  in the project documentation describe the adult dataset and were not used, except the healthsheet''s
  statement of who leads the project (its co-principal investigators and its lead investigators
  with their institutions); the text of the Bridge2AI Voice Registered Access Agreement is
  not in the bundle. Creator affiliations come from the IRB protocol''s investigator listings,
  the project documentation''s list of lead investigators and the NIH RePORTER page; the dataset
  page lists its authors without affiliations. The data description names the file audio_quality_metrics.tsv
  without stating which folder holds it, so it is described under the distribution formats
  and not listed as a file of any collection. The project documentation lists "Jennifer Sui,
  MD (Hospital for Sick Children)" and "Don Bolser, PhD (University of Florida)" among the
  project''s lead investigators; the dataset''s author list spells these names "Jennifer Siu"
  and "Donald Bolser", so those affiliations were not attached. The usage notes name the files
  "torchaudio_spectrogram.parquet" and "torchaudio_mel_spectrogram.parquet" and the data dictionary
  example "torch_spectrogram.json", while the data description names "torchaudio_spectrograms.parquet"
  and "torchaudio_mel_spectrograms.parquet"; the data description''s names are used. The documentation''s
  table of validated questionnaires is flattened in the bundle so that the column an entry
  belongs to cannot be established; no questionnaire is attributed to the pediatric cohort
  from it. The "Maintained by the MIT Laboratory for Computational Physiology" line and the
