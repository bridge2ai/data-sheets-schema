instances:
- instance_type: Derived audio features of one voice recording
  counts: 23533
  data_topic: B2AI_TOPIC:36
  data_substrate: B2AI_SUBSTRATE:30
  description: Each element of the Parquet-formatted feature files contains a unique identifier
    for the participant, a unique identifier for the recording session, the task performed,
    the number of time frames associated with the feature, and the tensor data for the feature.
  source_caveats: The abstract and five of the feature files state 23,533 recordings; the
    four sparc_* feature files are stated with n=23532.
- instance_type: Participant
  counts: 300
  description: Participants aged 2-18; patients and healthy volunteers at the Hospital for
    Sick Children were considered for enrollment in the study.
subpopulations:
- identification: Pediatric participants are grouped by age; the pediatric protocols are named
    Peds 2-4, Peds 4-6, Peds 6-10 and Peds 10+.
  source_caveats: From the project documentation's collection methods section. It states the
    grouping of participants and the names of the protocols; no source in the bundle states
    how the release's files identify these groups or how many participants fall in each, so
    no presence flag or distribution is recorded.
acquisition_methods:
- acquisition_details: A standardized age-appropriate protocol collected demographic information,
    voice and speech related questionnaires, and questionnaires inquiring about medical history.
    For participants without adequate comprehension and familiarity with their past medical
    history, parents or decision-makers completed the survey during the recording on a separate
    tablet.
- acquisition_details: 'Acoustic tasks listed for the pediatric (Peds) part of the Bridge2AI-Voice
    protocol: ABC''s (recalling alphabet), Ready For School (recalling a typical day preparing
    for school), Favorite Show (recalling favorite shows), Favorite Food (describing their
    favorite food), Outside of School (after school activities description), Months (listing
    the months), Counting, Naming Animals (listing animals), Naming Food (listing foods),
    Identifying Pictures (picture identification), Picture Description (Pediatrics), Long
    Sounds (sustained /ee/ and /ah/ sounds), Noisy Sounds, Caterpillar Passage (Pediatrics)
    (validated passage), Repeat Words (word repetition), Role naming (recalling days, months,
    and counting from 60 to 70), Repeat Sentences (sentence recall) and Silly Sounds (/PUH/
    /TUH/ /KUH/ /PUH TUH KUH/).'
  source_caveats: From the project documentation's table of acoustic tasks in the protocol;
    the table states what the protocol contains, not which tasks have recordings in release
    1.1.0.
collection_mechanisms:
- mechanism_details: All data was collected through customized software, reproschema-ui, on
    tablets, with the Bridge2AI-Voice pediatric protocol. All participants completed the recording
    and demographic data collection in one session.
  used_software:
  - id: doi:10.13026/mf9s-5r03#software-reproschema-ui
    name: reproschema-ui
- mechanism_details: A headset was used to record for most participants.
- mechanism_details: The remaining recordings utilized the built-in tablet microphone, due
    to low tolerance of wearing headphones or existing complex medical conditions.
missing_data_documentation:
- missing_data_patterns: Some files could not generate certain features and so are not included
    in the bundled data.
  missing_data_causes: Recording length or other issues.
sampling_strategies:
- source_data: Patients and healthy volunteers at the Hospital for Sick Children; non-patients
    were recruited through research postings. Pediatric participants are recruited strictly
    from the Hospital for Sick Children (SickKids).
  strategies: 'Eligibility-based enrollment: inclusion criteria were 2 to 18 years of age
    and English proficiency; exclusion criteria were being over 18 years of age and being
    non-verbal. Non-patients were evaluated for eligibility against the same inclusion and
    exclusion criteria.'
raw_sources:
- raw_data_details: The PhysioNet project does not contain raw audio. A news item on the PhysioNet
    page dated March 9, 2026 states that raw audio data for the pediatric cohort will be made
    available via Synapse, that accessing raw audio is a more involved process requiring institutional
    sign-off, and that requests go to the access committee. The project documentation states
    that raw audio data is disseminated through controlled access only, to protect participants'
    privacy, and that access to audio data from any Bridge2AI-Voice dataset is requested by
    email.
  access_url: https://www.synapse.org/Synapse:syn73617068
preprocessing_strategies:
- preprocessing_details: Raw audio waveforms were preprocessed into the Parquet feature files,
    and the source data merged into the phenotype files, with code made open source in the
    b2aiprep library.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    description: Bridge2AI Data Processing Library
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
    source_caveats: The version is the one given in the dataset page's reference to the library;
      the license is the one the project documentation's supporting materials list for the
      library.
- preprocessing_details: Data were exported and converted to tab delimited values using an
    open source library developed by the team.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
- preprocessing_details: Static features were derived from the recordings with openSMILE,
    Praat, parselmouth and torchaudio and are provided in the static_features.tsv file.
  used_software:
  - id: doi:10.13026/mf9s-5r03#software-opensmile
    name: openSMILE
  - id: doi:10.13026/mf9s-5r03#software-praat
    name: Praat
  - id: doi:10.13026/mf9s-5r03#software-parselmouth
    name: parselmouth
  - id: doi:10.13026/mf9s-5r03#software-torchaudio
    name: torchaudio
- preprocessing_details: Pediatric data collected through ReproSchema-UI is extracted and
    transformed into REDCap format, and subsequently converted to the Brain Imaging Data Structure
    (BIDS).
  source_caveats: From the project documentation's data pre-processing section, which describes
    the conversion pipeline and not the layout of the PhysioNet release.
cleaning_strategies:
- cleaning_details: Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive
    records and audio checks have been removed from v1.1.
- cleaning_details: For v1.1, audio features were released for all free speech tasks that
    were manually checked for presence of unconsented speakers and PII.
intended_uses:
- description: Study of developmental norms.
- description: Creation of AI-driven tools for early screening.
- description: Support of clinical insight.
distribution_formats:
- format: Parquet
  description: Binary feature files are made available as Parquet, an open-source column-oriented
    data file format.
- format: TSV
  description: Plain-text tab-separated files hold the static features (static_features.tsv),
    the metrics related to audio quality derived from the recordings (audio_quality_metrics.tsv)
    and the phenotype data.
- format: JSON
  description: Each data file is associated with a data dictionary file with the same file
    stem and a JSON suffix; keys are the column names of the associated data file and values
    give further detail, including a one-sentence description of the column.
