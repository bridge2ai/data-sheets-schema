    snippet: "(version 3.1.0). PhysioNet . RRID:SCR_007345"
  - slot: "citation"
    snippet: "Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M., Dorr, D., Payne, P., Ravitsky, V., Bélisle-Pipon, J., Bahr, R., Watts, S., Bolser, D., Siu, J., Lerner-Ellis, J., Rudzicz, F., Boyer, M., Abdel-Aty, Y., Ahmed Syed, T., Anibal, J., ... Ghosh, S. (2026). Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information (version 3.1.0). PhysioNet . RRID:SCR_007345. https://doi.org/10.13026/8xbn-nq66"
  - slot: "description"
    snippet: "a comprehensive collection of data derived from voice recordings with corresponding clinical information"
  - slot: "description"
    snippet: "The published Bridge2AI-Voice Adult Dataset contains derived features from the audio waveforms"
  - slot: "description"
    snippet: "Bridge2AI-Voice v3.1 contains data for 833 participants across five sites in North America. Participants were selected based on known conditions which manifest within the voice waveform including voice disorders, neurological disorders, mood disorders, and respiratory disorders"
  - slot: "description"
    snippet: "The release contains data considered low risk, including derivations such as spectrograms but not the original voice recordings. Detailed demographic, clinical, and validated questionnaire data are also made available"
  - slot: "purposes[0].response"
    snippet: "The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset to enable future research in artificial intelligence and support critical insights into the use of voice as a biomarker of health"
  - slot: "instances[0].name"
    snippet: "contains data for 833 participants across five sites in North America"
  - slot: "instances[0].counts"
    snippet: "Bridge2AI-Voice v3.1 contains data for 833 participants across five sites in North America"
  - slot: "sampling_strategies[0].strategies"
    snippet: "Patients presenting at specialty clinics and institutions were considered for enrollment. Patients were selected based on membership to five predetermined groups"
  - slot: "sampling_strategies[0].strategies"
    snippet: "Patients presenting at the given clinic were screened for inclusion and exclusion criteria prior to their visit by the project investigators"
  - slot: "collection_consents[0].consent_details"
    snippet: "patient consent was sought for the data collection initiative and to share the acquired research data"
  - slot: "collection_mechanisms[0].mechanism_details"
    snippet: "This protocol involved the collection of demographic information, health questionnaires, targeted questionnaires inquiring about known confounders for voice, disease specific information, and voice recording tasks such as sustained phonation of a vowel sound"
  - slot: "collection_mechanisms[1].name"
    snippet: "using a custom application on a tablet with a headset used for data collection when possible"
  - slot: "collection_mechanisms[1].mechanism_details"
    snippet: "Data collection was conducted using a custom application on a tablet with a headset used for data collection when possible"
  - slot: "relationships[0].relationship_details"
    snippet: "there may be more than one session per participant in the current dataset"
  - slot: "preprocessing_strategies[0].name"
    snippet: "Data were exported and converted from RedCap using an open source library developed by our team"
