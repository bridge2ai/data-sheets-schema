- id: c003
  status: nothing_relevant
  reason: "Results and discussion of the Nature article: annotation, SEC-MS validation, structure modelling, protein function, cell-type specificity and tumour-mutation analyses of the U2OS cell map. The subject is that study's U2OS map and its findings, not the composition, access or governance of the CM4AI dataset releases, so no value in the record's own slots is taken from it."
- id: c004
  status: nothing_relevant
  reason: "Methods of the Nature article: AP-MS, immunofluorescence and SEC-MS data collection in U2OS cells, the multimodal embedding model, community detection and assembly annotation. These describe how that study's U2OS data and map were produced; no passage here states a fact about the CM4AI dataset releases, so nothing is written from it."
- id: c005
  status: nothing_relevant
  reason: "Remaining methods, data availability, code availability and change history of the Nature article, then the start of its reference list. The data-availability statement locates that study's U2OS data (NDEx, MassIVE, ProteomeXchange, Human Protein Atlas, ModelArchive), which are deposits of the U2OS study and not the CM4AI dataset releases; no value in the record is taken from it."
- id: c006
  status: nothing_relevant
  reason: "Reference list of the Nature article (entries on interactome, spatial proteomics, structure prediction and related literature); bibliographic citations of other works only, no fact about the CM4AI dataset."
- id: c007
  status: nothing_relevant
  reason: "End of the Nature article's reference list, its acknowledgements and its author affiliations. The acknowledgements state who funded that article's study (including the Bridge2AI Program award OT2 OD032742 among several others) and the affiliations are those of the article's authors; neither passage is about the CM4AI dataset releases, whose own funding and authorship are stated by the release records, so no value is taken from it."
- id: c008
  status: nothing_relevant
  reason: "Author list, contributions, competing interests, extended-data figure legends, license and citation details of the Nature article on the U2OS cell map. No passage states how that study's data relate to the CM4AI data releases, so the article is not recorded as a resource of this dataset and no value is taken from it."
