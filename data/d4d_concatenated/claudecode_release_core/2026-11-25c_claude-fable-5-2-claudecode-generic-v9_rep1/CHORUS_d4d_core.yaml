title: CHoRUS Dataset
id: https://chorus4ai.org/
name: CHoRUS
description: 'The CHoRUS dataset is a multicenter, multimodal and high-resolution clinical
  care dataset produced by the CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting
  Standards) project, one data generation project of four in the NIH-funded Bridge2AI consortium.
  The project website describes the CHoRUS project as the collection of multi-modal data across
  14 different hospitals. Its "Current Released Dataset" snapshot lists 50,000 patient admissions
  from ICU, PICU, and NICU, 1.6 Billion rows of EHR OMOP data, 7,642 admissions with radiology
  data, and 23 Tb of waveform data. Its "Anticipated Final Dataset" snapshot lists 100,000
  patient admissions, 9 different data modalities, 14 data contributing hospitals, and 60+
  CHoRUS consortium members across 20 different institutions. The NIH project abstract states
  the project''s overarching goal of developing a publicly available, AI-ready critical care
  dataset, and describes three project pillars: Data, Ethics, and People. As planned content,
  the abstract names data such as structured electronic health record data, tokenized unstructured
  electronic health record data, telemetry and EEG waveforms, imaging, and social determinants
  of health. On ethics, the abstract plans community-facing ethics focus groups to determine
  what data is appropriate for public sharing, and the project website states that the CHoRUS
  consortium evaluates community perspectives on clinical care AI to find ways to increase
  trustworthiness of provenance and privacy in AI.'
source_caveats: 'The project website carries the notice "This repoitory is under review for
  potential modification in compliance with Administration directives." The chorus-ai GitHub
  overview states "This project is licensed under the MIT License"; that passage concerns
  the GitHub project, so it is not recorded as the dataset''s license. The webinar''s CHoRUS
  Dataset table (data type, data standard, access control, metadata, published metadata schema)
  is extracted as text that does not preserve its row and column alignment: the table names
  the data standards OMOP, OHNLP, DICOM, WFDB, and EDF+ and Persyst, and the record lists
  the data types and the standards without assigning a standard, access control, or metadata
  status to each data type. Admission counts differ by source and date and are compatible:
  the webinar reports over 45K unique admissions as of August 2025 and the project website''s
  current-release snapshot reports 50,000 patient admissions. The website displays its snapshot
  figures 50,000 and 1.6 Billion as round figures; the integers under instances transcribe
  them and do not assert exact totals. The NIH project abstract''s "publicly available" dataset
  is a stated goal; the webinar describes current access as controlled. The NIH project abstract
  and the chorus-ai GitHub overview (ranked as historical documentation, captured 11/14/25)
  are written in the future tense; values taken from them are recorded as plans. The email
  address for the project contact is transcribed as the website spells it.'
