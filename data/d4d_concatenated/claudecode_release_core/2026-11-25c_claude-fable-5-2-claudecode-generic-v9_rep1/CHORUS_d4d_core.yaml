collection_mechanisms:
- mechanism_details: Retrospective data collection of multi-modal data across 14 different
    hospitals.
- mechanism_details: The chorus-ai GitHub overview points data managers at data contributing
    sites to the Chorus_SOP page, which describes the step-by-step process for extracting
    and contributing clinical data to CHoRUS and links to standard operating protocol (SOP)
    documents; it states that data contributing sites have been asked to provide regular status
    updates on their progress in creating and curating a CHoRUS-specific clinical data extract.
    The organization lists a repository described as tools to create and upload a CHoRUS Data
    Extract, and a repository described as dedicated to producing characterization reports
    to return to sites following their data submissions.
data_collectors:
- role: data contributing site
  collector_details: The project website lists 14 data contributing hospitals. The chorus-ai
    GitHub overview states that the collaboration spans 20 academic centers, of which 14 will
    contribute as Data Acquisition centers.
sampling_strategies:
- description: 'Planned: the NIH project abstract describes sampling to ensure comprehensive
    sets of patient conditions and clinical treatment strategies, and the chorus-ai GitHub
    overview states that federated access will enable sampling methods to ensure a balanced
    and diverse cohort.'
preprocessing_strategies:
- preprocessing_details: The project website states that the data utilizes ongoing and new
    standardization practices. As plans, the NIH project abstract states the project will
    standardize data to the OMOP Common Data Model, and the chorus-ai GitHub overview states
    that unified standards will harmonize multi-modal EHR, waveform, imaging, and text data.
- preprocessing_details: 'Semantic mapping: the chorus-ai GitHub organization provides validated
    semantic mappings for connecting clinical data in various source formats to international
    standards, with a chorus-mapping repository holding documentation and pooled tabular mappings
    along with an associated clinical validation SOP.'
- preprocessing_details: Clinical notes are extracted and tokenized using the OHNLP toolkit;
    the webinar states that clinical notes are stored locally except tokens.
  used_software:
  - id: https://chorus4ai.org/#software-ohnlp-toolkit
    name: OHNLP toolkit
labeling_strategies:
- description: 'Planned: the NIH project abstract describes developing capabilities to label
    data, and the chorus-ai GitHub overview states that a visualization and annotation environment
    will label data with targets important for prediction.'
existing_uses:
- name: AIM-AHEAD Bridge2AI for Clinical Care Training Program
  description: 'Training activities: the program expands access to Bridge2AI CHoRUS data through
    engagement, AI training, and mentorship; trainees receive hands-on training on the Bridge2AI
    AI/ML for Clinical Care Network and leverage the data and tools to create practical use
    cases.'
- name: Publications
  description: The September 09, 2025 webinar states that the datasets are being used for
    publications.
intended_uses:
- description: 'Planned: a holdout test set accessible for model external validation, to aid
    marketplace adoption of AI-developed models for implementation in acute and critical care.'
- description: Hands-on training using the CHoRUS dataset "to support the development of transnational
    AI in clinical care" (the project website's wording).
- description: Building machine-learning (ML) and artificial intelligence (AI)-derived models
    to improve the care and outcomes of patients requiring critical care.
distribution_formats:
- name: Cloud enclave
  description: 'The September 09, 2025 webinar states that OMOP and telemetry data are in
    the enclave, with these exceptions: clinical notes are stored locally except tokens; for
    imaging, 1000 images are currently available with de-id in process for a larger cohort;
    for EEG, extraction is in process at that point. The project website states that the team
    creates tools to support the cloud enclave.'
