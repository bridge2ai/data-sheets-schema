  evidence: "collection_notifications[1].notification_details holds the return of results to participants ('Results from heart rate, blood pressure and visual acuity assessments are provided on an exam card ... Dexcom report ... laboratory test results are sent at the time of the yearly data release', receipted at c004 and c025), but CollectionNotification asks how individuals were notified about the data collection; the healthsheet's answer to that question (line 4461) is already collection_notifications[0], so a neighboring fact was placed in a field it does not answer. A second, milder instance: sampling_strategies[2].strategies holds eligibility criteria where the slot asks for the sampling strategy used (see slot-007)"
- id: rule-08
  verdict: followed
  evidence: "class-ranged objects carry their declared fields: creators[*].principal_investigator has id, name, orcid and affiliation objects with id and name; data_governance.accountable_organization has id ROR:01yc7t268 and name; data_collectors[*] have id and name; funders[0].grants[*] have grant_number; the funder's ROR appears only in funders[0].description because FundingMechanism has no grantor-identifier field (grantor is a single string, populated with the name)"
