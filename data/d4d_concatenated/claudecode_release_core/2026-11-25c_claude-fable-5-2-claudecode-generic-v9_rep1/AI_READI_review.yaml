  evidence: "creators has one entry per creator (20 entries: the Consortium entry carrying responsible-party PI Aaron Lee, 15 further FAIRhub Study PIs, and 4 PIs from the Nature Metabolism list); funders splits NIH and Research to Prevent Blindness with three grants; data_collectors one per site; collection_mechanisms one per device/procedure; purposes, anomalies, known_limitations one per statement"
- id: rule-06
