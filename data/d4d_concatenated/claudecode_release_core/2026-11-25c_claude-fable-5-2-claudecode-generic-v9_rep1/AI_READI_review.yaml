  evidence: "uriorcurie slots use CURIEs where a prefix is declared: id doi:10.60775/fairhub.3, version_access.latest_version_doi doi:10.60775/fairhub.3, every person id ORCID:..., every organization id ROR:...; publisher https://fairhub.io/ has no declared prefix; doi holds the bare DOI; external_resources (string) keeps URLs; no resolver URL found in a uriorcurie slot"
