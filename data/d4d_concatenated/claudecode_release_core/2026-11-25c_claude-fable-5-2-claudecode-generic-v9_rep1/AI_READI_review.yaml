  evidence: "no slot holds only a pointer or a pending/absent statement: citation is omitted because the sources only point to a documentation page; discouraged_uses omitted because the healthsheet answers with a pointer to the license; maintainers[0].maintainer_details states who maintains and where it is hosted before giving the contact URL"
- id: rule-07
