  evidence: "each of the 16 ORCIDs and 10 RORs occurs in the bundle paired with the same name the record gives it (FAIRhub overallOfficial entries lines 4907-5200, managingOrganization 2974-2979, locationIdentifierValue for University of Washington ROR 00cvxb145 at line 5278); the four Nature Metabolism-only PIs, whose ORCIDs the bundle does not state, get no ORCID; Edberg's UAB and Ferryman's JHU affiliations follow superscripts 7 and 2, keyed at lines 2143-2145"
- id: rule-11
