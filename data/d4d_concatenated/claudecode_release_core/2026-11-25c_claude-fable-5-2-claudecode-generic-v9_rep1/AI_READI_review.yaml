- id: rule-01
  verdict: followed
  evidence: "24 of the 25 sampled receiptless values were found in the bundle and the 25th (slot-031) is a coined grouping label and the 25 sampled receipted values are on their passages; identifiers all occur in the bundle; the report lists slots left empty for lack of evidence (citation, download_url, is_tabular, status, variables, created_on, enum slots with no stated category), and the record does this (e.g. no role on maintainers[0], no collection_type on the nine data directories)"
