  path: $.file_collections <-> $.distributions
  checker_message: Phase 4 must semantically review related distribution content; deterministic matches=38 (4 at collection level, 34 at nested resource level), unmatched core distributions=[]
  question: The deterministic checker matched this related full/core content but cannot judge the relation semantically. Open both records at the path; do the matched values say the same thing? Answer with the paths compared and what differs, if anything.
