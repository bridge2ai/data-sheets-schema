distributions:
- description: Derived audio data features. Dense binary files are made available as Parquet;
    each element of a parquet file contains a unique identifier for the participant, a unique
    identifier for the recording session, the task performed, the number of time frames associated
    with the feature and the tensor data for the feature. All files are associated with a
    data dictionary file which has the same file stem and a JSON suffix.
  id: doi:10.13026/37yb-1t42#collection-features
  name: features
  path: features
- description: Phonetic posteriorgram probabilities across 40 phoneme categories, dimension
    40xT with a frame rate of 100Hz (n=29289).
  id: doi:10.13026/37yb-1t42#file-features-ppgs-parquet
  path: features/ppgs.parquet
- description: Estimated electromagnetic articulography (EMA) from a deep learning model,
    dimensions Tx12 for the X/Y positions of six articulators (n=28640).
  id: doi:10.13026/37yb-1t42#file-features-sparc-ema-parquet
  path: features/sparc_ema.parquet
- description: Estimated loudness based on the average absolute amplitude of the audio waveform,
    size T, using 20ms windows (n=31855).
  id: doi:10.13026/37yb-1t42#file-features-sparc-loudness-parquet
  path: features/sparc_loudness.parquet
- description: Estimated periodicity (confidence of pitch presence) derived from the audio
    using 20ms windows, dimension T (n=31872).
  id: doi:10.13026/37yb-1t42#file-features-sparc-periodicity-parquet
  path: features/sparc_periodicity.parquet
- description: Estimated fundamental frequency (F0) of the audio signal, range 50-550Hz, dimension
    T (n=31872).
  id: doi:10.13026/37yb-1t42#file-features-sparc-pitch-parquet
  path: features/sparc_pitch.parquet
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform with a 25ms window size, 10ms hop length and a 400-point FFT (n=29278).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio-spectrogram-parquet
  path: features/torchaudio_spectrogram.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60xT, using the same parameters
    as the Mel spectrograms (n=29278).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio-mfcc-parquet
  path: features/torchaudio_mfcc.parquet
- description: Detected pitch (fundamental frequency) over time, dimension T, with a minimum
    and maximum pitch of 80 and 500 (n=32522).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio-pitch-parquet
  path: features/torchaudio_pitch.parquet
- description: Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms
    hop length, a 400-point FFT and 60 Mel bins (n=29278).
  id: doi:10.13026/37yb-1t42#file-features-torchaudio-mel-spectrogram-parquet
  path: features/torchaudio_mel_spectrogram.parquet
- description: One feature per audio recording derived from the raw audio, related to quality
    control metrics.
  format: TSV
  id: doi:10.13026/37yb-1t42#file-features-audio-quality-metrics-tsv
  media_type: text/tab-separated-values
  path: features/audio_quality_metrics.tsv
- description: Features derived from the raw audio, with one feature per audio recording and
    one row per unique recording.
  format: TSV
  id: doi:10.13026/37yb-1t42#file-features-static-features-tsv
  media_type: text/tab-separated-values
  path: features/static_features.tsv
- description: A binary file made available as Parquet and its corresponding data dictionary,
    with specific information about each recording, including task instructions and prompts,
    as well as information about the microphone used and its gain.
  id: doi:10.13026/37yb-1t42#collection-metadata
  name: metadata
  path: metadata
- description: Organized information collected from the participant or other individual during
    their encounter, in confounders, demographics, diagnosis, enrollment, questionnaire and
    task subfolders. Every TSV data file has a data dictionary with the same file stem and
    a json suffix, whose keys are the column names of the data file and whose values give
    a description, the question (if any) asked of the participant, and the data type of the
    response.
