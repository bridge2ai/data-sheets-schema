instances:
- name: Participants
  instance_type: person
  description: Each instance represents a person. Each participant's data consist of questionnaire
    responses together with features extracted from audio recordings.
  counts: 833
  label: true
  label_description: Diagnostic labels resulting from a clinical assessment of the participant,
    in diagnostic categories such as vocal pathologies, neurological disorders, psychiatric
    conditions and respiratory disorders.
  missing_information:
  - missing:
    - Responses to optional questions
    why_missing:
    - Some questions are optional.
    - Data collection irregularities may have caused some information to be missing from individual
      instances.
    - Each individual answered a common set of questions and then additional questions relevant
      to their primary diagnostic category.
anomalies:
- anomaly_details: Different sites have different collection configurations.
- anomaly_details: The collection protocol changed over the course of the study.
- anomaly_details: Certain aspects of the data (for example, transcription) were generated
    using off-the-shelf models that have not been audited for correctness.
known_biases:
- bias_description: The public data releases do not contain an equal distribution of the disease
    categories; the dataset has skews based on disorder category, site and other demographic
    factors.
- bias_description: Groups that have less trust in the medical system or in AI, or that are
    less proximal to the collection sites, would have been less likely to be recruited.
- bias_description: Participants were screened for different disorders based on site, so their
    data were also collected with different devices.
known_limitations:
- limitation_description: Distinct iPad devices were used at each site.
- limitation_description: The data were recorded with a head-mounted headset with a microphone
    that could be at slightly different distances.
- limitation_description: The clinical diagnosis, depending on the disorder, was performed
    by one clinician or based on an EHR record or prescription.
- limitation_description: Noise artifacts are a possible confounding factor.
- limitation_description: Variations in diagnostic practices are a possible confounding factor.
- limitation_description: Inaccurate questionnaire responses are a possible confounding factor.
- limitation_description: Underreporting is a possible confounding factor.
- limitation_description: Changes in diagnostic criteria or practices could be a source of
    distribution shift over time.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The project documentation's datasheet answers "No" to whether the
    dataset contains data that might be considered confidential.
subpopulations:
- subpopulation_elements_present: true
  identification: Age, gender, sex, ethnicity and socioeconomic status.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The project documentation's datasheet states that the dataset includes
    race information, sexual orientation information, and socioeconomic and health information.
  source_caveats: The same documentation's de-identification section for version 3.0.0 states
    that all sensitive fields were removed from the dataset and that elements revealing highly
    sensitive information, such as household income, mental health status and traumatic life
    experiences, were removed. Both statements come from the project documentation and are
    recorded as stated.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: The data were directly observable and reported by subjects. Clinical
    diagnoses were verified by clinicians reviewing audio and/or imaging data, looking at
    electronic health records, or medication prescriptions. Clinical validation is performed
    by a qualified physician or practitioner based on established gold standards for diagnosis.
collection_mechanisms:
- name: Bridge2AI-Voice App
  mechanism_details: Voice samples are collected prospectively using a custom software application
    (the Bridge2AI-Voice App) with the project's protocols. A standardized protocol involved
    the collection of demographic information, health questionnaires, targeted questionnaires
    inquiring about known confounders for voice, disease specific information, and voice recording
    tasks such as sustained phonation of a vowel sound. A total of 22 acoustic tasks are recorded
    through the app.
- name: Tablet and headset
  mechanism_details: Data collection was conducted using a custom application on a tablet
    with a headset used for data collection when possible. Data are collected on iPads (9th
    or 10th generation) and iPad Air (5th generation) using an Avid AE-36 microphone and an
    Apple dongle to connect it to the iPad.
data_collectors:
- role: Research assistant
  collector_details: Data are collected in the clinic with the assistance of a trained research
    assistant.
- role: Research team
  collector_details: Research teams, which may include medical, graduate, or undergraduate
    students, coordinated with clinicians/doctors to identify appropriate participants; these
    clinicians and doctors were listed under the IRB as co-investigators. Hospital staff were
    not involved in scheduling but assisted in the logistics of coordinating data collection.
missing_data_documentation:
- missing_data_patterns: Phenotype data files only contain rows for a participant if at least
    one column is not missing. Some files, whether due to length or other issues, could not
    generate certain features and so are not included in the bundled data. Spectrograms, Mel
    spectrograms, MFC coefficients, PPGs and EMAs for sensitive records and audio checks have
    been removed.
  handling_strategy: The dataset has been audited internally for missingness and consistency
    by the data release team, and the documentation states that a missingness table is included
    with the dataset.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  source_data: A larger, ongoing collection.
  why_not_representative: The data are not representative because they were collected at a
    limited number of geographic locations.
  strategies: Non-probability sample. Patients presenting at specialty clinics and institutions
    were considered for enrollment and were selected based on membership to predetermined
    groups; patients presenting at the given clinic were screened for inclusion and exclusion
    criteria prior to their visit by the project investigators. Participants are recruited
    across different academic institutions from "high volume expert clinics" based on diagnosis
    and inclusion/exclusion criteria. The documentation's study metadata give a minimum age
    of 18 years and exclude people who do not read or speak English, noting that Spanish protocols
    and data collection are to be included in future releases.
raw_sources:
- access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details: The raw data are saved and are not accessible publicly. The PhysioNet
    project does not contain raw audio. Accessing raw audio requires institutional sign-off
    through the access committee, and the release page states that the data will be made available
    via Synapse.
preprocessing_strategies:
- name: Export and conversion from REDCap
  preprocessing_details: Data were exported and converted from REDCap using an open source
    library developed by the team.
  used_software:
  - id: https://zenodo.org/records/14989503
    name: Bridge2AI Voice REDCap
    version: v3.23.0
    url: https://zenodo.org/records/14989503
- name: Audio standardization
  preprocessing_details: Raw audio was preprocessed by converting to monaural and resampling
    to 16 kHz with a Butterworth anti-aliasing filter applied.
- name: Feature extraction
  preprocessing_details: From the standardized audio, derived data were extracted. Spectrograms
    were computed using the short-time Fast Fourier Transform (FFT) with a 25ms window size,
    10ms hop length and a 400-point FFT, and were further downsampled by a factor of two in
    the time domain after derivation. 60 Mel-frequency cepstral coefficients (MFCCs) were
    extracted using the spectrograms. Mel spectrograms were computed with the same parameters
    and 60 Mels. Articulatory features (kinematic traces of vocal tract articulators and source
    features, and measures of loudness, periodicity and pitch) were generated with the Speech
    Articulatory Coding (sparc) package at 50Hz. Acoustic features were extracted using OpenSMILE.
    Phonetic and prosodic features were computed using Parselmouth and Praat. Phonetic posteriorgrams
    at 100Hz were generated via the ppgs package. The code used to process the raw audio into
    these features and to merge the source data into the phenotype files is the open source
    b2aiprep library; this release was generated with b2aiprep v3.0.0. The project documentation
    states that all processing is performed using the b2aiprep and SenseLab toolkits.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    description: Organizing and preprocessing the dataset.
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Processing audio files for research tasks.
  - id: doi:10.13026/37yb-1t42#software-opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction; used to extract
      acoustic features.
  - id: doi:10.13026/37yb-1t42#software-praat
    name: Praat
    description: Used with Parselmouth to compute phonetic and prosodic features.
  - id: doi:10.13026/37yb-1t42#software-parselmouth
    name: Parselmouth
    description: Used with Praat to compute phonetic and prosodic features.
  - id: doi:10.13026/37yb-1t42#software-torchaudio
    name: torchaudio
    description: Features derived with torchaudio are provided.
  - id: doi:10.13026/37yb-1t42#software-sparc
    name: Speech Articulatory Coding (sparc)
    description: Package used to generate articulatory features.
  - id: doi:10.13026/37yb-1t42#software-ppgs
    name: ppgs
    description: Package used to generate phonetic posteriorgrams.
- name: Conversion to the Brain Imaging Data Structure
  preprocessing_details: The project documentation states that the raw audio files and the
    questionnaire data exported from REDCap were converted to be compliant with the Brain
    Imaging Data Structure v1.9.0.
labeling_strategies:
- data_annotation_protocol: The project's protocols and ICD-10 codes.
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to it
    for a prior diagnostic assessment.
  labeling_details: Diagnostic labels are the result of a clinical assessment of the participant.
    At each site, a local clinician provided the diagnosis based on a clinical interview and
    appropriate work-up. For the psychiatric disorders cohort, the assessment was determined
    by using the participant's EHR record or an active prescription, which was done outside
    of data collection by an appropriately licensed clinician. A gold standard label (diagnosed
    by a clinician) is available in the data.
machine_annotation_tools:
- tools:
  - OpenAI Whisper Large
  tool_descriptions: Transcriptions were generated using OpenAI's Whisper Large model.
existing_uses:
- examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI
    Summer School and hackathon.
future_use_impacts:
- impact_details: The dataset has skews based on disorder category, site and other demographic
    factors. Users should consider the multivariate distribution when assessing utility for
    different questions.
discouraged_uses:
- name: Hiring decisions
  discouragement_details: The dataset should not be used for non-research applications such
    as hiring decisions; the limitation is intended to prevent unethical or biased outcomes
    that could negatively impact individuals based on their health conditions or voice characteristics.
- name: Insurance premium adjustments
  discouragement_details: The dataset should not be used for non-research applications such
    as insurance premium adjustments.
- name: Surveillance
  discouragement_details: The dataset should not be used for any form of surveillance that
    could lead to discrimination or harm.
intended_uses:
- description: Research applications, specifically the development of AI and machine-learning
    models for healthcare.
  examples:
  - AI model pretraining
  - Fine-tuning
  - Benchmarking
  - Validation
- description: Supporting clinical research in disease screening, diagnosis and monitoring
    through voice biomarkers.
prohibited_uses:
- name: Re-identification of research participants
  description: The dataset is not to be used to attempt to re-identify research participants,
    nor for any actions that could reasonably lead to re-identification.
  prohibition_reason: The restrictions reflect the consortium's commitment to advancing ethical
    and trustworthy research practices that respect and protect the rights and interests of
    research participants.
- name: Harm or stigmatization
  description: The dataset is not to be used for any purpose that could foreseeably cause
    harm or stigmatization to research participants, their families, communities, or specific
    populations.
  prohibition_reason: The restrictions reflect the consortium's commitment to advancing ethical
    and trustworthy research practices that respect and protect the rights and interests of
    research participants.
- name: Sale of the data
  description: Sale of all or part of the data on any media is not permitted.
distribution_formats:
- name: Parquet
  format: Parquet
  description: Binary feature files and the recording metadata file are made available as
    Parquet, an open-source column-oriented data file format.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
- name: TSV
  format: TSV
  media_type: text/tab-separated-values
  description: Plain-text feature files and the phenotype data files.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
- name: JSON
  format: JSON
  media_type: application/json
  description: Data dictionary files, which share the file stem of the data file they describe.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
distribution_dates:
- release_dates:
  - '2026-05-01'
  description: Publication date of version 3.1.0 on PhysioNet.
updates:
  frequency: Semi-annual (twice a year), as a plan stated in the project documentation
  update_details: The dataset is released as static versions. Version 3.1.0 is a minor update
    with no new participants but some additional data released for certain participants; it
    fixed broken parquet files from the previous release, added files related to audio quality
    metrics, released per-audio metadata, updated validated diagnosis information across conditions
    with back-filled information, rearranged some phenotypic files and renamed certain gold
    standard variables. The project documentation's datasheet states that further versions
    of the dataset will be released on a semi-annual basis.
retention_limit:
  retention_details: Once data are contributed, they will be retained as long as they are
    useful for research purposes, possibly indefinitely. The study protocol states that identifiable
    data and datasheets linking participant numbers to participant information will be kept
    in each institution on local cloud storage for a maximum of 10 years after study completion.
version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
  - '1.1'
  - 2.0.0
  - 2.0.1
  - 3.0.0
  - 3.1.0
  version_details: PhysioNet lists versions 1.1 (January 17, 2025), 2.0.0 (April 16, 2025),
    2.0.1 (August 18, 2025), 3.0.0 (December 16, 2025) and 3.1.0 (May 1, 2026). Version 1.0
    was the first release of the dataset, published on Health Data Nexus; version 1.1 added
    Mel-frequency cepstral coefficients; version 2.0 provided data for an additional 136 new
    participants; version 2.0.1 corrected the authorship list; version 3.0.0 was a major update
    with new data for an additional 391 participants. The files for version 1.1 are no longer
    available on PhysioNet. The project documentation's datasheet states that, by default,
    older versions of the dataset will continue to be supported, hosted and made available
    to researchers and that each version has a unique DOI.
extension_mechanism:
  extension_details: For augmentations to the code used to produce the data, the open-source
    repositories have discussion forums and issue pages which allow for public discussion
    of data preprocessing, and a pull request mechanism for contributing improvements to the
    data preprocessing code.
ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: Data collection and sharing was approved by the University of South Florida
    Institutional Review Board. The project documentation states that the study was submitted
    to and approved by the USF Single IRB and subsite IRBs through the Single IRB process.
    The study protocol states that the Canadian institutions do not follow the single IRB
    process and will apply for a separate research ethics board review.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - Approved by the University of South Florida Institutional Review Board.
informed_consent:
- consent_obtained: true
  consent_type: Prospective informed consent
  consent_documentation: The study protocol states that participants may consent by signing
    a physical paper copy, by indicating electronic consent within the app or through REDCap
    surveys, or through video recording within the app.
  consent_scope: Research data that do not contain direct identifiers will be shared with
    external researchers for future research through a secure database. Data that pose a low
    risk of causing individual re-identification will be shared in registered access with
    the general public. Data that would pose a heightened risk of re-identification if shared
    in full open access will be shared through a controlled access mechanism with authorized
    researchers.
license_and_use_terms:
  license_terms: Only credentialed users who sign the data use agreement can access the files.
    The license for the files is the Bridge2AI Voice Registered Access License and the data
    use agreement is the Bridge2AI Voice Registered Access Agreement; no training is required.
    The dataset is intended solely for commercial and non-commercial research purposes by
    authorized researchers. Raw audio is disseminated through controlled access only, under
    a Data Transfer and Use Agreement in which the recipient agrees not to disclose, release,
    sell, rent, lease, loan or otherwise grant access to the data to any third party except
    authorized persons, and to certify destruction of the data within thirty days after termination
    or expiration.
  data_use_permission:
  - general_research_use
ip_restrictions:
  restrictions:
  - Users agree not to make intellectual property claims on the data.
  - Intellectual property protections, database rights or related rights may not be used in
    a manner that restricts or limits access to any part of the dataset or to any conclusions
    derived from it.
  - Users agree to respect the Fort Lauderdale Agreement.
regulatory_restrictions:
  regulatory_restrictions:
  - The data provided under the Data Transfer and Use Agreement are covered under a Certificate
    of Confidentiality.
  confidentiality_level: restricted
data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: 'Registered access to the feature-only data: register on PhysioNet
    and confirm identity, and sign the Registered Access Agreement. Controlled access to the
    raw audio data: complete the Data Access Request Form (DARF) and the Data Use Agreement
    (DUA), and submit the application to the Data Access Compliance Office for review; upon
    approval, a Data Use and Transfer Agreement (DTUA) is signed by an authorized official
    at the requester''s institution. The access committee is reached at DACO@b2ai-voice.org.'
  accountable_organization:
    name: University of South Florida Board of Trustees
    description: Provider institution under the Data Transfer and Use Agreement.
is_deidentified:
  identifiable_elements_present: false
  method: HIPAA Safe Harbor
  identifiers_removed: HIPAA Safe Harbor identifiers, which include names, geographic locators,
    date information (at resolution finer than years), phone/fax numbers, email addresses,
    IP addresses, Social Security Numbers, medical record numbers, health plan beneficiary
    numbers, device identifiers, license numbers, account numbers, vehicle identifiers, website
    URLs, full face photos, biometric identifiers and any unique identifiers; state and province.
  deidentification_details: State and province were removed and the country of data collection
    was retained. Spectrograms and similar features were excluded if the audio contained free
    speech, while static and other features which do not encode the sensitive information
    were retained. All raw voice data were removed from the release. The project documentation
    states that identifiable information (under HIPAA and the Common Rule), as well as data
    considered sensitive, have been removed, that dates are rebased or replaced by integers,
    that narrative text fields are removed and that K-anonymization (k>=2) is not achieved.
    For version 3.0.0 the documentation states that raw audio transcripts were reviewed and
    any audio recordings that contained potentially identifying information and external voices
    were removed from the release.
is_tabular: true
