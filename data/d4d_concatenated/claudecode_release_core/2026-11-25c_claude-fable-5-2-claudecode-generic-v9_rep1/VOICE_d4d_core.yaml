title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
version: 3.1.0
id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
description: A collection of data derived from voice recordings with corresponding clinical
  information, published on PhysioNet as the adult dataset of the Voice project. Version 3.1.0
  contains data for 833 participants collected across five sites in North America; the project
  documentation gives the countries of collection as the USA and Canada. Participants were
  selected based on known conditions which manifest within the voice waveform, including voice
  disorders, neurological disorders, mood disorders and respiratory disorders. The dataset
  contains derived audio data features, phenotypic information acquired during data collection
  (demographic, clinical and validated questionnaire data), and metadata related to the specific
  audio task and recording. The release contains data considered low risk, including derivations
  such as spectrograms, but not the original voice recordings.
source_caveats: The record describes the adult dataset at its current PhysioNet release, 3.1.0;
  the PhysioNet pages for versions 1.1 and 3.0.0 in the bundle were read as statements about
  those versions. The project documentation site carries a datasheet whose distribution and
  maintenance answers describe an earlier release hosted on Health Data Nexus (published at
  the end of November 2024) and whose population statement names version 2.0.0; those answers
  were not written as the current state of the dataset. The documentation site states about
  61,937 voice-derived recordings for version 3.0; the version 3.1.0 page states no total
  recording count, only an element count for each feature file. The version 3.1.0 page lists
  the spectrogram files as torchaudio_spectrogram.parquet and torchaudio_mel_spectrogram.parquet
  and describes them as torchaudio_spectrograms.parquet and torchaudio_mel_spectrograms.parquet;
  the listed names, which the usage note also uses, are the ones recorded. The documentation
  datasheet says the dataset comes with no predefined recommended data splits, that there
  is no erratum (a changelog is published for each version), that no pre-processing for cleaning
  was applied, that no export controls apply and that no analysis of the potential impact
  of the dataset on data subjects has been conducted; the slots for those things are left
  empty. The same datasheet says the dataset includes transcriptions of free speech tasks,
  while the documentation's de-identification section for version 3.0.0 says transcriptions
  from open-response prompts are removed from the feature-only dataset; no content warning
  is recorded.
