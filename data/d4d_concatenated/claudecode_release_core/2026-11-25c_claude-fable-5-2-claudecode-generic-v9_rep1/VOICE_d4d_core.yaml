purposes:
- response: To provide an ethically sourced flagship dataset that enables future research
    in artificial intelligence and supports critical insights into the use of voice as a biomarker
    of health, with which clinically applicable AI/ML models can be developed, benchmarked
    or validated.
- response: To facilitate the use of voice as a non-invasive, cost-effective biomarker for
    the screening, diagnosis and monitoring of a wide range of health conditions.
tasks:
- response: Training machine-learning models for disease detection and classification using
    voice data.
addressing_gaps:
- response: Previous studies of machine learning-based voice diagnosis produced promising
    results, but their sample sizes were too small or they lacked the key metadata needed
    to train robust, clinically useful models.
- response: Comparing studies and pooling data is challenging because standards for how voice
    and other acoustic data are measured and collected are lacking.
- response: Industry datasets are often private, which limits the ability to audit machine-learning
    models and the accuracy of training data labels.
