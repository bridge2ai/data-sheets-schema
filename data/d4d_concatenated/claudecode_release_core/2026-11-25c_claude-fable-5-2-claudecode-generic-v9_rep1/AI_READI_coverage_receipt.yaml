- id: c002
  status: extracted
  extracted:
  - slot: purposes[0].response
    snippet: "is a data collection project on type 2 diabetes mellitus (T2DM) to facilitate the widespread use of artificial intelligence and machine learning (AI/ML) approaches to study salutogenesis"
  - slot: addressing_gaps[1].response
    snippet: "address inherent limitations of many existing large data sets for AI/ML training, the cohort is designed to be balanced in race/ethnicity, T2DM severity and biological sex"
  - slot: sampling_strategies[0].strategies
    snippet: "triple- balanced by recruiting the following populations in equal proportions: four race/ethnic groups (Asian, black, white, Hispanic)"
  - slot: sampling_strategies[0].source_data
    snippet: "The study base is all patients aged ≥40 years of age who had a medical encounter within each health system site (UAB, UCSD, UW) between 2020 and 2025"
  - slot: sampling_strategies[0].why_not_representative
    snippet: "rather than targeting the demo- graphic distribution of the US population"
  - slot: sampling_strategies[1].strategies
    snippet: "Participants are recruited in waves to facilitate the efficient sampling of the study base"
  - slot: ethical_reviews[0].review_details
    snippet: "approved by the Institutional Review Board (IRB) of the University of Washington (approval number STUDY00016228)"
  - slot: ethical_reviews[0].reviewing_organization
    snippet: "Institutional Review Board (IRB) of the University of Washington"
  - slot: human_subject_research.irb_approval
    snippet: "including reliance agreements with the IRBs of University of Alabama at Birmingham and University of California, San Diego"
  - slot: human_subject_research.ethics_review_board
    snippet: "AI- READI was approved by the Institutional Review Board (IRB) of the University of Washington"
  - slot: informed_consent[0].consent_obtained
    snippet: "Written informed consent is provided by all participants"
  - slot: informed_consent[0].consent_documentation
    snippet: "informed consent is performed remotely by computer, tablet or smart phone through a link in the hardcopy invi- tation letter or the invitation email"
  - slot: informed_consent[0].consent_type
    snippet: "it is performed in- person at the start of the visit"
  - slot: collection_timeframes[0].source_caveats
    snippet: "Enrolment began on 18 July 2023 and will continue until 30 November 2026"
  - slot: collection_timeframes[0].timeframe_details
    snippet: "The formal data collection process began on 1 December 2023"
  - slot: known_biases[0].bias_description
    snippet: "there is selection bias known as volunteer bias which may limit the generalis- ability of the results among those who are not repre- sented in the study population"
  - slot: data_collectors[0].collector_details
    snippet: "All research personnel at the three data sites who recruited, enrolled and collected data underwent training by the data manager at UAB"
  - slot: acquisition_methods[0].acquisition_details
    snippet: "The protocol is performed as a single visit lasting between 2.5 and 4 hours"
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "Once enrolled, participants are presented with questionnaires for online completion"
  - slot: collection_mechanisms[18].mechanism_details
    snippet: "Systolic blood pressure, diastolic blood pressure and heart rate were measured twice separated by 2 min with"
  - slot: at_risk_populations.description
    snippet: "Pregnancy and type 1 diabetes are exclusionary for participation"
  - slot: external_resources[6].external_resources
    snippet: "Owsley C, et al. BMJ Open 2025;15:e097449. doi:10.1136/bmjopen-2024-097449"
  - slot: external_resources[6].external_resources
    snippet: "Cross- sectional design and protocol for Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights (AI- READI)"
  - slot: creators[18].principal_investigator.affiliation[0].name
    snippet: "3Medicine, University of Alabama at Birmingham, Birmingham, Alabama, USA"
