  - slot: description
    snippet: "is a dataset consisting of data collected from individuals with and without “Type 2 Diabetes Mellitus (T2DM)” and harmonized across 3 data collection sites"
  - slot: description
    snippet: "These encompass tabular data, imaging data, and physiological signal/waveform data. There is no unstructured text data included in this dataset"
  - slot: known_limitations[1].limitation_description
    snippet: "Of note, the overall enrollment goal is to have balanced distribution between different racial groups. As enrollment is ongoing, the periodic updates to data releases may not have achieved balanced distribution across groups"
  - slot: cleaning_strategies[2].cleaning_details
    snippet: "The dataset has not undergone any formal external audits"
  - slot: cleaning_strategies[2].cleaning_details
    snippet: "the dataset has been reviewed internally by AI-READI team members for quality checks and to ensure that no personally identifiable information was accidentally included"
  - slot: is_deidentified.deidentification_details
    snippet: "reviewed internally by AI-READI team members for quality checks and to ensure that no personally identifiable information was accidentally included"
  - slot: updates.update_details
    snippet: "The dataset gets released as static versions. This is the third version of the dataset and consists of data collected up through the end of the second year of the study"
  - slot: updates.frequency
    snippet: "There are plans to release new versions of the dataset approximately once a year with additional data from participants who have been enrolled since the last dataset version release"
  - slot: version_access.version_details
    snippet: "the first version of the dataset contains data from 204 participants, the second version contains additional data from 863 participants for a total of 1067 participants, and this version contains a total of 2280 participants"
  - slot: version_access.version_details
    snippet: "the Snellen visual acuity variables were dropped in this version of the dataset, such that now only logMAR visual acuity measurements are available"
  - slot: splits[0].split_details
    snippet: "It does include a new recommended data split for the 2280 participants balancing training, validation, and testing sets for age, sex, races/ethnicities, and study group"
  - slot: purposes[0].response
    snippet: "The purpose for creating the dataset was to enable future generations of artificial intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways to return to health"
  - slot: addressing_gaps[0].response
    snippet: "a key issue is the lack of data ready for training AI models. The AI-READI dataset is intended to fill this gap"
  - slot: tasks[0].response
    snippet: "The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime manifolds and various applications in artificial intelligence"
  - slot: creators[0].description
    snippet: "This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI Consortium"
  - slot: funders[0].description
    snippet: "The creation of the dataset was funded by the National Institutes of Health (NIH) through their Bridge2AI Program"
  - slot: funders[0].description
    snippet: "Note that the funding institution is not creating or managing the dataset"
  - slot: funders[0].source_caveats
    snippet: "The grant number is OT2ODO32644"
  - slot: instances[0].instance_type
    snippet: "Each instance represents an individual patient"
  - slot: instances[0].counts
    snippet: "There are 2280 instances in this current version of the dataset (version 3, released fall 2025)"
  - slot: sampling_strategies[0].description
    snippet: "The dataset contains all possible instances. More specifically, the dataset contains data from all participants who have been enrolled during the first year of data collection for AI-READI"
  - slot: sampling_strategies[0].description
    snippet: "No data were excluded from the dataset at the time of preprocessing"
  - slot: instances[0].description
    snippet: "Multiple modalities of data are collected for each participant, including survey data, clinical data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable activity monitor data"
  - slot: instances[0].description
    snippet: "Each instance consists of all of the data available for an individual participating in the study"
  - slot: instances[0].missing_information[0].missing
    snippet: "not all modalities are available for all participants"
  - slot: instances[0].missing_information[0].why_missing
    snippet: "Some participants elected not to participate in some study elements"
  - slot: instances[0].missing_information[0].why_missing
    snippet: "the data collection device did not have any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost)"
  - slot: instances[0].missing_information[0].why_missing
    snippet: "there may have been a data collision at some point in the process and data has been lost"
  - slot: relationships[0].relationship_details
    snippet: "all instances are part of the same prospective data generation project (AI-READI). There is currently only one visit per participant"
  - slot: anomalies[0].anomaly_details
    snippet: "In cases of survey data, skipped questions or incomplete responses are expected"
  - slot: anomalies[1].anomaly_details
    snippet: "In cases of using wearables, improper use, technical failure such as battery failure or system malfunction are expected"
  - slot: anomalies[2].anomaly_details
    snippet: "In cases of imaging data, patient uncooperation, noise that may obscure the images and technical failure such as system malfunction, and data transfer failures are expected"
  - slot: external_resources[0].description
    snippet: "The dataset is self-contained but does rely on the dataset documentation for users requiring additional information about the provenance of the dataset"
  - slot: external_resources[0].restrictions
    snippet: "The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated with its use"
  - slot: confidential_elements[0].confidential_elements_present
    snippet: "No, the dataset does not contain data that might be considered confidential. No personally identifiable information is included in the dataset"
  - slot: content_warnings[0].content_warnings_present
    snippet: "might otherwise pose any safety risk (such as psychological safety and anxiety)? If so, please describe why.\", \"response\": \"No.\""
  - slot: sensitive_elements[0].sensitivity_details
    snippet: "No, the public dataset will not contain data that is considered sensitive. However, the controlled access dataset will contain data regarding racial and ethnic origins, location (5-digit zip code), as well as motor vehicle accident reports"
  - slot: collection_mechanisms[1].mechanism_details
    snippet: "Philips (manufacturer of Pagewriter TC30 Cardiograph)"
  - slot: collection_mechanisms[2].mechanism_details
    snippet: "It is done using a standard 10g monofilament applying pressure to different points on the plantar surface of the feet"
  - slot: collection_mechanisms[3].mechanism_details
    snippet: "AI READI research staff perform this test on an iPad using a pre-installed software (MoCA Duo app downloaded from the app store)"
  - slot: collection_mechanisms[4].mechanism_details
    snippet: "M&S Technologies EVA device to test visual acuity"
  - slot: collection_mechanisms[5].mechanism_details
    snippet: "The MARS Letter Contrast Sensitivity test (Perceptrix) was conducted monocularly under both Photopic conditions"
  - slot: collection_mechanisms[6].mechanism_details
    snippet: "KR 800 Auto Keratometer/Refractor"
  - slot: collection_mechanisms[8]
    snippet: "The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the ocular fundus"
  - slot: collection_mechanisms[8].mechanism_details
    snippet: "the quality of the images vary from patient to patient and within the same patient"
  - slot: collection_mechanisms[9]
    snippet: "The iCare EIDON is a widefield TrueColor confocal fundus imaging system"
  - slot: collection_mechanisms[9].mechanism_details
    snippet: "Imaging is done in fully automated mode in a dark room"
  - slot: collection_mechanisms[10]
    snippet: "The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that combines optical coherence tomography (OCT) with retinal angiography"
  - slot: collection_mechanisms[10].mechanism_details
    snippet: "As the machine is operated by the imaging team and is not fully automated, quality issues may arise, which may lead to skipping this modality and missing data"
  - slot: collection_mechanisms[11]
    snippet: "The DRI OCT Triton is a device from Topcon Healthcare that combines swept-source OCT technology with multimodal fundus imaging"
  - slot: collection_mechanisms[12]
    snippet: "The Maestro2 is a robotic OCT and color fundus camera system from Topcon Healthcare"
  - slot: collection_mechanisms[13]
    snippet: "Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) is an advanced imaging technique used in ophthalmology"
  - slot: collection_mechanisms[13].mechanism_details
    snippet: "it is kept to be performed as the last modality of an AI READI visit. Because of this patients may not be at their best possible compliance"
  - slot: collection_mechanisms[14]
    snippet: "The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence tomography (OCT) system that offers non-invasive imaging of retinal microvasculature"
  - slot: collection_mechanisms[15]
    snippet: "The Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM)"
  - slot: collection_mechanisms[16]
    snippet: "The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure data related to physical activity"
  - slot: collection_mechanisms[17]
    snippet: "a custom-designed sensor unit called the LeeLab Anura"
  - slot: collection_mechanisms[18].mechanism_details
    snippet: "OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series Vital signs monitor"
  - slot: collection_mechanisms[19].mechanism_details
    snippet: "NIDEK LM-600P Auto Lensometer, Topcon-CL-200 computerized Lensometer, and Topcon-CL-300 computerized Lensometer"
  - slot: known_limitations[2].limitation_description
    snippet: "the predominantly urban and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds"
  - slot: known_limitations[3].limitation_description
    snippet: "The study cohort may not provide a comprehensive representation of the population, as it does not include other races/ethnicities such as Pacific Islanders and Native Americans"
