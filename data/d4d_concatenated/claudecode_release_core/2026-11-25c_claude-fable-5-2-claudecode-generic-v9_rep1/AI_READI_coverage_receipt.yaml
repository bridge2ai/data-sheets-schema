  extracted:
  - slot: purposes[0].response
    snippet: "The primary goal of AI-READI is to collect and publicly share a multimodal, AI-ready dataset for studying the pathogenesis and salutogenesis"
  - slot: addressing_gaps[0].response
    snippet: "a major barrier has been the lack of diverse datasets that are AI ready1 for training AI models, which the AI-READI project is designed to address"
  - slot: funders[0].grants[1].grant_number
    snippet: "through grants OT2OD032644 and P30 DK035816"
  - slot: funders[0].description
    snippet: "funded by Bridge2AI (https://commonfund.nih.gov/bridge2ai), a new NIH Common Fund Program"
  - slot: updates.frequency
    snippet: "Data are released annually, and each version is accessible through FAIRhub"
  - slot: is_deidentified.source_caveats
    snippet: "The public set is stripped of Protected Health Information (PHI), as defined by the HIPAA (Health Insurance Portability and Accountability Act) Privacy Rule via the “Safe Harbor” method"
  - slot: is_deidentified.identifiers_removed
    snippet: "as well as information related to the sex and race/ethnicity of the participants to prevent stigmatization of findings"
  - slot: participant_privacy[1].source_caveats
    snippet: "we are implementing a robust data dissemination system, a strict licence agreement and data watermarking for both public and controlled sets"
  - slot: collection_mechanisms[15].mechanism_details
    snippet: "using a Dexcom G6 for continuous glucose monitoring"
  - slot: collection_mechanisms[16].mechanism_details
    snippet: "Garmin Vivosmart 5 for physical activity monitoring"
  - slot: collection_mechanisms[17].mechanism_details
    snippet: "a custom-built environmental sensor for indoor environmental parameter measurements"
  - slot: sampling_strategies[1].strategies
    snippet: "based on the available clinical diagnosis using ICD-10 codes and demo- graphic data from the electronic health records of study sites"
