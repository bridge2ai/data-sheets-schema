  - slot: purposes[0].response
    snippet: "seeks to create an ethically sourced flagship dataset to enable future research in artificial intelligence and support critical insights into the use of voice as a biomarker of health"
  - slot: purposes[1].response
    snippet: "Establishing a robust multi-institutional dataset that integrates pediatric voice data with demographic information would advance the understanding of voice and disease as well as early detection and intervention"
  - slot: intended_uses[0].description
    snippet: "Resources such as this project are intended to enable study of developmental norms"
  - slot: intended_uses[1].description
    snippet: "create AI-driven tools for early screening"
  - slot: intended_uses[2].description
    snippet: "and support clinical insight"
  - slot: addressing_gaps[0].response
    snippet: "These factors have contributed to the lack of publicly/open access/ available pediatric data sets that enable machine learning for pediatric voice analysis"
  - slot: addressing_gaps[0].response
    snippet: "the availability of large-scale pediatric databases/datasets remains/is limited"
  - slot: addressing_gaps[0].response
    snippet: "unique challenges such as privacy issues, consent processes, the need for developmentally appropriate tasks"
