  addressing_gaps[0].response:
    receipts:
    - chunk: c002
      snippet: These factors have contributed to the lack of publicly/open access/
        available pediatric data sets that enable machine learning for pediatric voice
        analysis
    - chunk: c002
      snippet: the availability of large-scale pediatric databases/datasets remains/is
        limited
    - chunk: c002
      snippet: unique challenges such as privacy issues, consent processes, the need
        for developmentally appropriate tasks
    core_path: addressing_gaps[0].response
  addressing_gaps[1].response:
    receipts:
    - chunk: c002
      snippet: evidence/normative data that we have in adults cannot be generalized
        to pediatric populations
    - chunk: c002
      snippet: the respiratory system and larynx undergo rapid functional maturation/development
        throughout childhood
    core_path: addressing_gaps[1].response
  addressing_gaps[2].response:
    receipts:
    - chunk: c004
      snippet: The literature is sparser in terms of pediatric voice and speech analysis
        partly due to ethical concerns and challenges in data acquisition for this
        cohort
    - chunk: c004
      snippet: creating a voice database of “normal cohort” of different age groups
        will be key to help machine learning models diagnose age specific speech delays
        and disorders
    core_path: addressing_gaps[2].response
