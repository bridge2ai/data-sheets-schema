  addressing_gaps[0].response:
    receipts:
    - chunk: c002
      snippet: Current literature on this topic has only been studied on small- to
        medium-sized data sets with limited data outside of acoustic measures not
        linked to multi-modal health data
    - chunk: c008
      snippet: Previous studies on machine learning-based voice diagnosis produced
        promising results, but their sample sizes were too small, or they lacked the
        key metadata needed for training robust, clinically useful models
    core_path: addressing_gaps[0].response
  addressing_gaps[1].response:
    receipts:
    - chunk: c002
      snippet: comparing studies and pooling data is challenging due to a lack of
        existing standards in how voice and other acoustics are measured and collected
    - chunk: c005
      snippet: challenging tasks due to the lack of standards in how we collect voice
        and speech data
    core_path: addressing_gaps[1].response
