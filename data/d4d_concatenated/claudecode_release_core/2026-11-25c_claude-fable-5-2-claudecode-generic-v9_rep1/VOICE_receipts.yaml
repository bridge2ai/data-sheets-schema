  preprocessing_strategies[2].preprocessing_details:
    receipts:
    - chunk: c009
      snippet: 'All processing is performed using these toolkits: b2aiprep : organizing
        and preprocessing the dataset SenseLab : processing audio files for research
        tasks'
    - chunk: c010
      snippet: The code used to preprocess the raw audio waveforms into the parquet
        file and to merge the source data into the phenotype files
    - chunk: c018
      snippet: Spectrograms - Time-frequency representations were computed using the
        short-time Fast Fourier Transform (FFT) with a 25ms window size, 10ms hop
        length, and a 400-point FFT. Spectrograms were further downsampled by a factor
        of two in the time domain after derivation
    - chunk: c019
      snippet: Mel-frequency cepstral coefficients (MFCC) - 60 MFCCs were extracted
        using the above spectrograms
    - chunk: c019
      snippet: Mel Spectrogram - a combination of the above two computed with the
        same parameters (25ms window size, 10ms hop length, a 400-point FFT, and 60
        Mels)
    - chunk: c019
      snippet: Articulatory features - using the Speech Articulatory Coding (sparc)
        package, we generate the kinematic traces of vocal tract articulators and
        source features as well as measures of loudness, periodicity, and pitch. All
        features were gathered at 50Hz
    - chunk: c019
      snippet: Acoustic features were extracted using OpenSMILE, capturing temporal
        dynamics and acoustic characteristics
    - chunk: c019
      snippet: Phonetic and prosodic features were computed using Parselmouth and
        Praat, providing measures of fundamental frequency, formants, and voice quality
    - chunk: c019
      snippet: Phonetic Posteriorgrams (ppgs) - time-varying categorical distribution
        over acoustic units of speech (e.g., phonemes) at 100Hz were generated via
        the ppgs package
    - chunk: c019
      snippet: The code used to process the raw audio into the above features and
        to merge the source data into the phenotype files has been made open source
        in the b2aiprep library
    - chunk: c019
      snippet: This release was generated with b2aiprep v3.0.0
    core_path: preprocessing_strategies[2].preprocessing_details
