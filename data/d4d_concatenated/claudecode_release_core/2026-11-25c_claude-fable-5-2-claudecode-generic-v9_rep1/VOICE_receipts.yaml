    - chunk: c018
      snippet: The published Bridge2AI-Voice Adult Dataset contains derived features
        from the audio waveforms
    - chunk: c018
      snippet: Bridge2AI-Voice v3.1 contains data for 833 participants across five
        sites in North America. Participants were selected based on known conditions
        which manifest within the voice waveform including voice disorders, neurological
        disorders, mood disorders, and respiratory disorders
    - chunk: c018
      snippet: The release contains data considered low risk, including derivations
        such as spectrograms but not the original voice recordings. Detailed demographic,
        clinical, and validated questionnaire data are also made available
    - chunk: c019
