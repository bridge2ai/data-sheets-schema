  its path matched the receipted passage, so no index shift arose. The pack lists
  slot items slot-005 through slot-029 only (25 sampled of 452 receipted); every item
  it lists is answered. Observations that are not verdicts: (1) the record's id and
  doi are the PhysioNet "DOI (latest version)" 10.13026/37yb-1t42 (line 5136), as the
  manifest's scope declares, while the 3.1.0 version DOI is 10.13026/8xbn-nq66 (line
  5134), which appears only in the citation; a reader citing version 3.1.0 by the
  record's doi gets a pointer that moves with later releases. (2) publisher
  https://physionet.org/ is not stated as itself in the bundle; the bundle does state
  RRID:SCR_007345 for PhysioNet (line 4818), under a prefix the schema does not
  declare. (3) regulatory_restrictions (class ExportControlRegulatoryRestrictions)
  carries the DTUA's Certificate of Confidentiality (line 3422) while the datasheet
  says no export controls apply (line 2206, caveated); a regulatory protection rather
  than an export control, recorded under the slot's regulatory half. (4) The inline
  checks in this review (per-entry receipt coverage, core/full distribution
  comparison, schema ranges) were run as one-off commands and not saved, because the
  brief limits this review to writing this one file.
