title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: AI-READI dataset
description: 'Version 3.0.0 of the AI-READI dataset, the public release distributed through
  the FAIRhub platform. It contains data from 2280 participants collected between July 19,
  2023 and May 1, 2025 from individuals with and without type 2 diabetes mellitus (T2DM),
  harmonized across 3 data collection sites. Multiple modalities are included for each participant:
  survey data, clinical data, retinal imaging data, environmental sensor data, continuous
  glucose monitor data, and wearable activity monitor data, encompassing tabular data, imaging
  data, and physiological signal/waveform data, with no unstructured text data. The data contain
  no protected health information; information related to the sex and race/ethnicity of the
  participants, as well as medication used, has been removed. The dataset contains 356,343
  files and is around 3.82 TB in size. Data are organized at the root level into one directory
  per datatype; within each datatype folder there is one folder per modality, within each
  modality folder one folder per device, and within each device folder one folder per participant.'
source_caveats: 'The record describes version 3.0.0 (DOI 10.60775/fairhub.3), the public dataset;
  the controlled-access set the documents mention is a separate set and its contents are reported
  only where a passage contrasts it with the public dataset. Sources disagree in several places.
  (1) The version 3.0.0 documentation page says that version "contains data from the participants
  of the pilot study phase", while the FAIRhub structured metadata (ranked higher by the source
  manifest) says version 3 consists of data collected up through the end of the second year
  of the study; the FAIRhub statement is the one used. (2) The FAIRhub dataset page labels
  the license "Health Data License", the FAIRhub structured metadata names it "AI-READI custom
  license v2.0", and the license text is headed "AI-READI DATA LICENSE AGREEMENT (Version
  2.0)"; these are treated as names of one license and the structured-metadata name is used.
  (3) The enrollment target is stated as 4000 in the protocol publication and the FAIRhub
  study description, as "4,000+" in the NIH RePORTER abstract, and as 4600 in the IRB protocol
  application; all are plans, none is the size of this release. (4) The FAIRhub healthsheet
  answers that no data protection impact analysis has been conducted, that there is currently
  no mechanism for others to extend or augment the dataset, that the dataset has not been
  used for any tasks already, and that no repository links papers or systems that use it;
  its erratum answer is empty. Those slots are left empty for that reason. (5) The FAIRhub
  dataset page notes that a smaller version is available for pipeline development; the bundle
  gives no identifier for it, so it is not recorded as a related dataset. (6) The FAIRhub
  structured metadata give the dataset size and each directory''s size as bare integers with
  no unit; they are recorded as bytes because the dataset-level integer 3815969779678 corresponds
  to the "3.82 TB" the same metadata state. The record''s own computation over the nine directory
  entries gives 356334 files (4515 + 7 + 2232 + 7969 + 56478 + 173721 + 93921 + 15245 + 2246)
  and 3815969360064 bytes (302931703 + 176182781 + 55625676514 + 1069466876718 + 1317625293027
  + 1155908809724 + 174381046406 + 38313536220 + 4169006971), against stated totals of 356343
  files and 3815969779678 bytes: differences of 9 files and 419614 bytes. Nine root-level
  metadata files are listed without sizes, which matches the file difference; the bundle does
  not say what accounts for the byte difference.'
