instances:
- instance_type: individual patient (study participant)
  counts: 2280
  label: false
  description: 'Each instance consists of all of the data available for an individual participating
    in the study: survey data, clinical data, retinal imaging data, environmental sensor data,
    continuous glucose monitor data, and wearable activity monitor data. No labels are provided;
    the healthsheet describes the dataset as hypothesis-agnostic.'
  missing_information:
  - missing:
    - Not all modalities are available for all participants.
    why_missing:
    - Some participants elected not to participate in some study elements.
    - In a few cases the data collection device did not have any stored results or was returned
      too late to retrieve the results (for example, the battery died or data was lost).
    - In a few cases there may have been a data collision at some point in the process and
      data has been lost.
anomalies:
- anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: In data from wearables, improper use and technical failure such as battery
    failure or system malfunction are expected.
- anomaly_details: In imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are expected.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers; the protocol publication states there is
    therefore selection bias known as volunteer bias, which may limit the generalizability
    of the results among those who are not represented in the study population.
known_limitations:
- limitation_description: Eligible participants were required to speak, read and understand
    English; the protocol publication states this may have created challenges in recruiting
    Hispanic and/or Asian persons.
- limitation_description: The overall enrollment goal is a balanced distribution between groups,
    but as enrollment is ongoing the periodic data releases may not have achieved balanced
    distribution across groups.
- limitation_description: Recruitment was predominantly urban and hospital-based, which may
    not fully capture diverse cultural and socioeconomic backgrounds; the healthsheet names
    this among the factors influencing the generalization of derived models.
- limitation_type: representativeness_limitation
  limitation_description: The study cohort may not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific Islanders
    and Native Americans.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The dataset does not contain data that might be considered confidential,
    and no personally identifiable information is included in the dataset. The documentation
    states that the data held under controlled access, outside this public dataset, include
    5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records,
    medications, and traffic and accident reports.
content_warnings:
- content_warnings_present: false
subpopulations:
- name: Demographic subpopulations
  subpopulation_elements_present: false
  identification: The healthsheet answers "No" to whether the dataset identifies any demographic
    sub-populations (for example by age, gender, sex, ethnicity); sex and race/ethnicity are
    not released with the public version.
  source_caveats: Although sex and race/ethnicity are not released, the README's suggested-split
    summary reports totals for the 2280 participants by race/ethnicity (Hispanic 380, Asian
    545, Black 519, White 836) and by sex (Male 951, Female 1329).
- name: Diabetes status study groups
  identification: 'Four study groups: Healthy (participants who do not have Type 1 or Type
    2 Diabetes); Pre-diabetes/Lifestyle Controlled (participants with pre-Type 2 Diabetes
    and those with Type 2 Diabetes whose blood sugar is controlled by lifestyle adjustments);
    Oral Medication and/or Non-insulin-injectable Medication Controlled (participants with
    Type 2 Diabetes whose blood sugar is controlled by oral or injectable medications other
    than insulin); and Insulin Dependent (participants with Type 2 Diabetes whose blood sugar
    is controlled by insulin).'
  distribution: 'The README''s suggested-split summary reports, for the 2280 participants:
    No DM 776, Lifestyle 560, Oral 686, Insulin 258.'
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: The healthsheet states that the public dataset will not contain data
    that is considered sensitive, whereas the controlled access dataset will contain data
    regarding racial and ethnic origins, location (5-digit zip code), and motor vehicle accident
    reports.
acquisition_methods:
- acquisition_details: The acquisition of data varied by domain; some data were directly observable
    (such as labs, vitals, and retinal imaging), whereas other data were reported by subjects
    (for example survey responses). Verification of data entry was performed when possible,
    for example by cross-referencing entered medications with medications that were physically
    brought in or photographed by each study participant. The protocol is performed as a single
    visit lasting between 2.5 and 4 hours, preceded by questionnaires and followed by 10 days
    of at-home monitoring.
  was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  description: The FAIRhub study description classifies the study as observational, with a
    cohort observational model and a cross-sectional time perspective.
collection_mechanisms:
- name: Questionnaires in REDCap
  mechanism_details: REDCap is used for collecting patient-reported data from questionnaires
    and clinical data from the visit (medications assessment, vitals, visual acuity, contrast
    sensitivity, monofilament test results and CBC test results). Once enrolled, participants
    are presented with questionnaires for online completion, covering among other domains
    depressive symptoms, diabetes distress and self-care, diet, vision and eye care, substance
    use, general health, and social determinants of health and access to healthcare. The IRB
    protocol application says questionnaires may be filled out electronically or on paper
    before or after the in-person visit.
- name: 12-lead electrocardiogram
  mechanism_details: A 12-lead ECG is performed with a Philips Pagewriter TC30 Cardiograph
    while the participant sits in a reclining chair or lies supine.
- name: Monofilament test
  mechanism_details: Peripheral neuropathy is assessed with the monofilament test, using a
    standard 10 g monofilament applying pressure to different points on the plantar surface
    of the feet, with shoes and socks removed.
- name: Montreal Cognitive Assessment (MoCA)
  mechanism_details: A general cognitive screener administered electronically by research
    staff on an iPad using the MoCA Duo application.
- name: Visual acuity testing
  mechanism_details: Photopic letter visual acuity is measured with the Electronic Visual
    Acuity tester (M&S Technology); mesopic acuity is measured through a neutral density filter.
    The right and left eyes are tested separately.
- name: Contrast sensitivity testing
  mechanism_details: Photopic letter contrast sensitivity is measured with the Mars chart
    (Mars Perceptrix); mesopic contrast sensitivity is assessed through a neutral density
    filter.
- name: Autorefraction
  mechanism_details: Autorefraction data for each eye are obtained using the autorefractor's
    standard protocol (Topcon KR 800).
- name: Blood and urine collection for laboratory testing
  mechanism_details: Non-fasting blood (53 mL according to the protocol publication) and a
    urine specimen are collected during the visit. Laboratories local to each data collection
    site perform complete blood count testing on fresh whole blood; all other laboratory tests
    are performed by the University of Washington Nutrition and Obesity Research Center testing
    facility, which provides results in .csv format. The remaining blood is processed into
    derivatives for a biospecimen repository at the University of Alabama at Birmingham.
- name: Optomed Aurora IQ
  mechanism_details: A handheld fundus camera used to take non-mydriatic (undilated) images
    of the ocular fundus. The healthsheet notes that image quality varies from patient to
    patient and within the same patient.
- name: iCare EIDON
  mechanism_details: A widefield TrueColor confocal fundus imaging system; imaging is done
    in fully automated mode in a dark room.
- name: Heidelberg Spectralis HRA
  mechanism_details: An ophthalmic imaging system combining optical coherence tomography (OCT)
    with retinal angiography; used for OCT and OCT angiography (OCTA) of the macula. The healthsheet
    notes that, as the machine is operated by the imaging team and is not fully automated,
    quality issues may arise that lead to skipping this modality and missing data.
- name: Topcon DRI OCT Triton
  mechanism_details: A device from Topcon Healthcare combining swept-source OCT technology
    with multimodal fundus imaging.
- name: Topcon Maestro2
  mechanism_details: A robotic OCT and color fundus camera system from Topcon Healthcare,
    used for OCT, OCTA and color fundus photography.
- name: Heidelberg FLIO
  mechanism_details: Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) from Heidelberg Engineering.
    It is performed as the last modality of an AI-READI visit, and the healthsheet notes that
    patients may therefore not be at their best possible compliance.
- name: Zeiss Cirrus 5000 Angioplex
  mechanism_details: A high-definition optical coherence tomography system from Carl Zeiss
    Meditec offering non-invasive imaging of retinal microvasculature.
- name: Dexcom G6 continuous glucose monitor
  mechanism_details: A continuous glucose monitoring system worn for 10 days after the visit,
    recording blood glucose measurements (mg/dL) every 5 minutes. Participants are masked
    to the results during the monitoring period.
- name: Garmin Vivosmart 5
  mechanism_details: A wrist-worn fitness activity tracker used for 10 days after the visit
    to measure data related to physical activity.
- name: LeeLab Anura environmental sensor
  mechanism_details: A custom-designed environmental sensor unit, custom built for the AI-READI
    project, placed in the participant's home for 10 continuous days.
- name: Blood pressure measurement
  mechanism_details: Systolic and diastolic blood pressure and heart rate are measured with
    an automatic oscillometric device; the devices used across the data acquisition sites
    are the OMRON HEM 907XL Blood Pressure Monitor, the Medline MDS4001 Automatic Digital
    Blood Pressure Monitor, and the Welch Allyn 6000 series Vital signs monitor.
- name: Lensometry
  mechanism_details: Lensometer devices used across the data acquisition sites include the
    NIDEK LM-600P Auto Lensometer, the Topcon-CL-200 computerized Lensometer, and the Topcon-CL-300
    computerized Lensometer.
collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: For this version of the dataset, the timeframe for data collection was
    July 19, 2023 to May 1, 2025. The protocol publication states that the formal data collection
    process began on 1 December 2023, after a preliminary pilot enrollment period.
  source_caveats: The FAIRhub metadata (ranked higher by the source manifest) give the collection
    period as 2023-07-19 to 2025-05-01 and the study start date as 2023-07-19; the protocol
    publication states that enrollment began on 18 July 2023. The two statements may describe
    different events (enrollment and data collection), so the FAIRhub dates are used and the
    publication's date is kept here.
data_collectors:
- id: ROR:008s83205
  name: University of Alabama at Birmingham
  collector_details: Data collection site in Birmingham, Alabama. The protocol publication
    states that research personnel at the three data sites were trained by the data manager
    at this site.
- id: ROR:0168r3w48
  name: University of California, San Diego
  collector_details: Data collection site in San Diego, California.
- id: ROR:00cvxb145
  name: University of Washington
  collector_details: Data collection site in Seattle, Washington.
missing_data_documentation:
- missing_data_patterns: Marijuana use was not assessed for participants living in Alabama.
  missing_data_causes: The protocol publication states it was not assessed there because marijuana
    is an illegal substance in Alabama.
raw_data_sources:
- source_description: Electrocardiogram recordings exported from the ECG device to local storage
    in their raw format.
  raw_data_format: .xml
- source_description: MoCA Duo application exports (total score, section subscores, Memory
    Index Score and task completion times) to local storage in their raw format.
  raw_data_format: .csv
sampling_strategies:
- name: Balanced recruitment design
  strategies: Rather than targeting the demographic distribution of the US population, the
    study is designed to be triple-balanced by recruiting in equal proportions four race/ethnic
    groups (Asian, Black, white, Hispanic), four categories of T2DM (no diabetes, pre-diabetes/lifestyle-
    controlled diabetes, diabetes treated with oral or non-insulin- injectable medications,
    and insulin-controlled diabetes) and biological males and females. The FAIRhub study description
    gives an anticipated enrollment of 4000 and states the aim of recruiting approximately
    1000 patients into each of the four groups.
  is_random: false
  is_representative: false
  why_not_representative: Building balanced datasets is described as critical for the development
    of unbiased machine learning models, so the study recruits the groups in equal proportions
    rather than targeting the demographic distribution of the US population.
  source_data: The study base is all patients aged 40 years or older who had a medical encounter
    within each health system site (UAB, UCSD, UW) between 2020 and 2025.
  description: The FAIRhub study description gives the sampling method as "Non-Probability
    Sample". The healthsheet states that the dataset contains all possible instances, that
    is, data from all participants enrolled, and that no data were excluded from the dataset
    at the time of preprocessing.
  source_caveats: The healthsheet for version 3 says the dataset contains data from all participants
    "enrolled during the first year of data collection", while the same healthsheet says this
    version consists of data collected up through the end of the second year of the study.
- name: Recruitment in waves from screened health records
  strategies: Recruitment pools were identified by screening electronic health records for
    diabetes and prediabetes ICD-10 codes, and participants are recruited in waves whose composition
    and size are adjusted, by under- and oversampling groups as needed, according to the observed
    participation by race/ethnicity, gender, severity of T2DM and site.
  description: 'The IRB protocol application describes the plan: the three sites pool lists
    of potentially eligible patients, the University of Alabama at Birmingham selects a stratified
    sample of potential participants based on the sampling scheme, and the sites prioritize
    different racial/ethnic groups according to local demographics.'
  source_caveats: The healthsheet says the health-record screen covered patients with an encounter
    within the past 2 years; the protocol publication gives the study base as encounters between
    2020 and 2025.
- name: Eligibility criteria
  strategies: 'Inclusion: able to provide consent; 40 years old or older; persons with or
    without type 2 diabetes; must speak and read English. Exclusion: pregnancy; gestational
    diabetes; Type 1 diabetes. The FAIRhub study description and the IRB protocol application
    additionally exclude adults older than 85 years of age.'
raw_sources:
- raw_data_details: The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but is not anticipated to be shared outside
    the project team at the time of the healthsheet, because it has not been mapped to standardized
    terminologies and may accidentally include personal health information or personally identifiable
    information. The healthsheet notes a possibility that raw data may be included in future
    releases of the controlled access dataset.
preprocessing_strategies:
- preprocessing_details: All participant images are exported from imaging devices in their
    raw format, and some images required conversion to a DICOM standard format prior to upload.
- preprocessing_details: Once data were sent from each of the study sites to the central project
    team, all data were mapped to standardized terminologies when possible, such as the Observational
    Medical Outcomes Partnership (OMOP) Common Data Model for clinical data and the Digital
    Imaging and Communications in Medicine (DICOM) standard for imaging data.
cleaning_strategies:
- cleaning_details: The Data Manager at each data site is responsible for the quality control
    of all data before uploading to FAIRhub.
- cleaning_details: 'Quality control at the time of data entry and acquisition: clinical data
    outside of expected min/max ranges were flagged in REDCap; data managers and clinical
    research coordinators examined participant records for credibility (range checks), incorrect
    flow through prescribed skip patterns, missing data that can be directly filled from other
    portions of an individual''s record, and the omission or duplication of records. Editing
    was only done under the guidance and approval of the site PI.'
- cleaning_details: The dataset has not undergone any formal external audits; it has been
    reviewed internally by AI-READI team members for quality checks and to ensure that no
    personally identifiable information was accidentally included.
future_use_impacts:
- impact_details: The healthsheet states that the creators do not currently anticipate any
    uses of the dataset that could result in unfair treatment or harm, but that there is a
    theoretical risk of future re-identification.
intended_uses:
- use_category: Type 2 diabetes related research
  usage_notes: Access requires agreeing to use the data only for type 2 diabetes related research.
    Use of the dataset requires citation of the resources specified in the dataset documentation,
    and those who download and use the data are encouraged to publish their results in the
    scientific literature.
- use_category: Development of AI/ML models
  usage_notes: The license permits the licensee to make, reproduce and distribute models,
    algorithms and programs that are developed, trained or adapted using the data but do not
    themselves contain the data, provided the licensee undertakes all reasonable efforts to
    minimize the likelihood that data can be memorized, derived, reconstructed or reconstituted
    through such models.
prohibited_uses:
- name: Clinical treatment decisions
  description: The licensee shall not make clinical treatment decisions based on the data.
  prohibition_reason: The data is intended solely as a research resource.
- name: Identification of or harm to data subjects
  description: The licensee shall not use or attempt to use the data to compromise the confidentiality
    of information about a data subject, to invade or compromise the privacy of any data subject,
    to attempt to identify or contact any data subject or group of data subjects, to extract
    or extrapolate any identifying information, to establish a data subject's membership in
    a particular group of persons, or otherwise to cause harm or injury to any data subject.
- name: Sharing data with third-party model vendors for training
  description: The licensee shall not share or distribute data with any third party model
    vendor or developer for training or development purposes; a third party model may be used
    to analyze the data only for short-term interaction such as prompting or querying, where
    the vendor is a party to a Business Associate Agreement with the licensee's institution
    or employer.
- name: Reproducing data in publications
  description: Data may not be reproduced in papers, articles, presentations, analyses, reports
    or publications, except that small representative samples may be reproduced in up to five
    images or figures per paper for illustrative purposes only.
distribution_formats:
- media_type: application/dicom
- media_type: text/markdown
- media_type: text/csv
- media_type: application/json
distribution_dates:
- release_dates:
  - '2025-11-17'
  description: Date the dataset (version 3.0.0) was made available on FAIRhub.
maintainers:
- name: AI-READI team
  maintainer_details: The AI-READI team will be supporting and maintaining the dataset. The
    dataset is hosted on FAIRhub through Microsoft Azure. The README directs questions, suggestions,
    or feedback related to the dataset to https://aireadi.org/contact.
updates:
  frequency: There are plans to release new versions of the dataset approximately once a year.
  update_details: The dataset is released as static versions and will not be updated; rather,
    new versions will be released with additional instances as more study participants complete
    the study visit. This is the third version and consists of data collected up through the
    end of the second year of the study.
retention_limit:
  retention_details: There are no limits on the retention of the data associated with the
    instances.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 3.0.0 (10.60775/fairhub.3, Nov 17, 2025)
  - 2.0.0 (10.60775/fairhub.2, Nov 8, 2024)
  - 1.0.0 (10.60775/fairhub.1, May 3, 2024)
  version_details: The first version contains data from 204 participants from the pilot data
    collection phase; the second version contains additional data from 863 participants, for
    a total of 1067 participants; this third version contains a total of 2280 participants.
    The FAIRhub page and the documentation for version 2.0.0 state that that version is no
    longer accessible and refer to the latest version. The data fields and types are largely
    the same as in the prior version; the Snellen visual acuity variables were dropped in
    this version, so that only logMAR visual acuity measurements are available.
ethical_reviews:
- reviewing_organization: Institutional Review Board of the University of Washington
  review_details: AI-READI was approved by the Institutional Review Board of the University
    of Washington (approval number STUDY00016228), including reliance agreements with the
    IRBs of the University of Alabama at Birmingham and the University of California, San
    Diego. The initial IRB approval was received on December 20, 2022; an annual renewal application
    about the status and progress of the study is required.
human_subject_research:
  involves_human_subjects: true
  ethics_review_board: Institutional Review Board of the University of Washington
  irb_approval:
  - University of Washington IRB approval number STUDY00016228; initial approval received
    on December 20, 2022.
  - Reliance agreements with the IRBs of the University of Alabama at Birmingham and the University
    of California, San Diego.
  description: The FAIRhub study description gives the human subject review status as "Submitted,
    approved" and lists a ClinicalTrials.gov identifier, NCT06002048, for the study.
informed_consent:
- consent_obtained: true
  consent_type: Written informed consent, given electronically (e-consent with an electronic
    signature) or in person at the start of the visit.
  consent_documentation: For most participants, informed consent is performed remotely by
    computer, tablet or smartphone through the REDCap study interface. The approved consent
    form of the principal project site, the University of Washington, was used by the other
    clinical sites under IRB reliance, with minor institution-specific language.
  withdrawal_mechanism: Participants may withdraw consent at any time and cease study participation;
    data shared or used up to that point stay in the dataset.
at_risk_populations:
  at_risk_groups_included: false
  description: Participants are adults aged 40 years or older who are able to provide consent;
    pregnancy is an exclusion criterion. The IRB protocol application answers that the research
    does not include minors, prisoners, or cognitively impaired adults and other adults unable
    to consent.
license_and_use_terms:
  description: The FAIRhub metadata give the access type as "PublicDownloadSelfAttestationRequired".
    Accessing the dataset requires logging in through a verified ID system, agreeing to use
    the data only for type 2 diabetes related research, and agreeing to the license terms.
  license_terms: AI-READI Data License Agreement (Version 2.0), with Washington University
    in St. Louis as licensor. It grants a non-exclusive and non-transferable license to download,
    reproduce and use the data, and to create derivative works of the data, for research,
    commercial and non-commercial purposes. The data may be used and stored only on servers
    and devices maintained by and located within the licensee's institution or employer, or
    on cloud or remote storage and backup services that have a HIPAA-approved Business Associate
    Agreement in place with it. Derivative data, including synthetic data created using the
    data, are subject to the same restrictions. The licensee agrees to acknowledge the licensor
    and the source and any funder of the data in papers reporting use of the data. The agreement
    terminates automatically upon any breach, upon which the licensee must delete all copies
    of the data. The healthsheet describes the terms as tailored to enable reuse for commercial
    or research purposes while putting strong requirements around data usage, security, and
    secondary sharing to protect study participants.
  data_use_permission:
  - disease_specific_research
ip_restrictions:
  restrictions:
  - Title to the data, and all industrial and intellectual property rights therein, remain
    solely and exclusively with the licensor and its suppliers; any rights not expressly granted
    are reserved to the licensor and its suppliers.
regulatory_restrictions:
  regulatory_restrictions:
  - The licensee agrees to comply with all data security and privacy standards established
    by the U.S. National Institutes of Health under its Genomic Data Sharing (GDS) Policy.
data_governance:
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
    source_caveats: Named as the managing organization of the dataset in the FAIRhub metadata,
      as the lead sponsor in the FAIRhub study description, and as the licensor in the license
      text.
  access_review_process: 'Access to this public dataset is by self-attestation: logging in
    through a verified ID system, agreeing to use the data only for type 2 diabetes related
    research, and agreeing to the license terms.'
is_deidentified:
  identifiable_elements_present: false
  deidentification_details: The FAIRhub metadata state that no identifiers were collected
    so no active de-identification was necessary, and that it was checked that no identifiable
    data per US HIPAA were present in the data. The data contain no protected health information
    (PHI). The healthsheet adds that the dataset has been reviewed internally by AI-READI
    team members to ensure that no personally identifiable information was accidentally included.
  identifiers_removed: Information related to the sex and race/ethnicity of the participants,
    as well as medication used, has been removed.
  source_caveats: The FAIRhub metadata give the de-identification type as "NoDeIdentification"
    with the HIPAA flag set. The Nature Metabolism comment, describing the releases in general,
    says the public set is stripped of Protected Health Information as defined by the HIPAA
    Privacy Rule via the "Safe Harbor" method; both statements are kept, and the FAIRhub wording,
    from the higher-ranked source and about this version, is the one stated in the details.
