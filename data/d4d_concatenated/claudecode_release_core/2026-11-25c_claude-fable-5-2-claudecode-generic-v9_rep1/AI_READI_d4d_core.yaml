purposes:
- response: The dataset was created to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM),
    including salutogenic pathways to return to health.
- response: The AI-READI project also aims to establish standards, best practices and guidelines
    for the collection, preparation and sharing of data for AI/ML, as a model for future efforts
    to develop other health datasets.
tasks:
- response: The multi-modal dataset is being gathered to facilitate downstream pseudotime
    manifolds, an approach used to predict disease trajectories from participants with differing
    disease severity, and various applications in artificial intelligence.
addressing_gaps:
- response: The current understanding of T2DM, especially in the context of salutogenesis,
    is limited; AI-based approaches may help, but a key issue is the lack of data ready for
    training AI models. The AI-READI dataset is intended to fill this gap.
- response: To address inherent limitations of many existing large datasets for AI/ML training,
    the cohort is designed to be balanced in race/ethnicity, T2DM severity and biological
    sex.
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, and large multimodal
    datasets.
