  description:
    receipts:
    - chunk: c011
      snippet: The AI-READI is a dataset consisting of data collected from individuals
        with and without Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data
        collection sites
    - chunk: c014
      snippet: 3.82 TB
    - chunk: c018
      snippet: is a dataset consisting of data collected from individuals with and
        without “Type 2 Diabetes Mellitus (T2DM)” and harmonized across 3 data collection
        sites
    - chunk: c018
      snippet: These encompass tabular data, imaging data, and physiological signal/waveform
        data. There is no unstructured text data included in this dataset
    - chunk: c019
      snippet: This dataset contains data from 2280 participants that was collected
        between July 19, 2023 and May 01, 2025. Data from multiple modalities are
        included
    - chunk: c019
      snippet: The dataset contains 356,343 files and is around 3.82 TB in size
    - chunk: c019
      snippet: data is organized at the root level into one directory per datatype
    - chunk: c019
      snippet: Within each datatype folder, there is one folder per modality
    core_path: description
