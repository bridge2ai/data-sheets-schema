  addressing_gaps[0].response:
    receipts:
    - chunk: c007
      snippet: a major barrier has been the lack of diverse datasets that are AI ready1
        for training AI models, which the AI-READI project is designed to address
    - chunk: c018
      snippet: a key issue is the lack of data ready for training AI models. The AI-READI
        dataset is intended to fill this gap
    core_path: addressing_gaps[0].response
  addressing_gaps[1].response:
    receipts:
    - chunk: c002
      snippet: address inherent limitations of many existing large data sets for AI/ML
