- id: rule-01
  verdict: followed
  evidence: "Sampled values all trace to bundle lines (25/25 receipted samples supported); slots without evidence are left empty (raw_data_format, total byte sizes, limitation_type/bias_type/collection_type, external link URLs not captured, stated in source_caveats). Phase 3 removed instances[3].counts (website figure not counting that instance) rather than keep an unsupported pairing."
- id: rule-02
  verdict: followed
  evidence: "Disagreements are represented, not silently chosen: top-level source_caveats records the releases page 'Released on: June 17, 2025' (c016 4445-4446) against Dataverse 'Publication Date 2026-06-17' (7329-7330), and project end November 2026 (7092) against RePORTER 2026-08-31 (4206); IF protein counts 563 (March 2025) vs 464 (June/October 2025) are kept per release entry."
- id: rule-03
  verdict: followed
  evidence: "Reconciliation report 'Referent' section states the choice (CM4AI dataset as the series of data releases, id https://cm4ai.org/, June 2026 release as current), matching the declared scope I ran ('CM4AI (Cell Maps for Artificial Intelligence) dataset <https://cm4ai.org/>'); full and core both carry id https://cm4ai.org/, the same five resources ids and identical top-level source_caveats."
- id: rule-04
  verdict: followed
  evidence: "No sign of density-driven filling: the record omits slots the bundle cannot answer (raw_data_format, enumeration categories, byte sizes) and drops the U2OS Nature study entirely (source_caveats 'Unused source'), keeping only what the release documents support."
- id: rule-05
  verdict: followed
  evidence: "creators has 47 entries, one per author on the June 2026 list (7334-7498); intended_uses has 4 entries matching the 4 source lines (7097-7100); known_biases has 2 entries for the 2 bias lines (7111-7112); known_limitations has 6 entries for 7 source lines (7088-7090, 7103-7106) because [1] joins 'Does not contain predicted cell maps' (7104) and 'Computed cell maps not included' (7090), which state one limitation; funders split NIH and the Frederick Thomas Fund; grants are separate Grant objects."
- id: rule-06
  verdict: followed
  evidence: "No slot is filled only with a pointer or a pending/absent statement: external_resources[2]-[6] name the specific external data sets the June 2026 release lists (7065-7074) and where they are held, which is what that slot records (the bundle lacks their URLs, said in source_caveats); the 'will be uploaded to Pride' note sits inside a file description with substantive content."
- id: rule-07
  verdict: followed
  evidence: "Content sits in the slots that ask for it: quarterly cadence in updates.frequency/update_details (7092-7093), long-term preservation in maintainers[0] (7094), embargo in known_limitations[4], access URL in distribution_formats[0].access_urls (a uri slot); DistributionFormat's description admits access methods, and no route is placed in a format field."
- id: rule-08
  verdict: followed
  evidence: "Class-ranged objects carry their declared fields where evidence answers them: creators id/name/affiliations; principal_investigator id/name/orcid/email/affiliation; Grant grant_number; resources title/doi/version/issued/page/license/citation; File name/path/format/media_type/hash. pack.reference_attributes is empty, so no reference string is expected."
- id: rule-09
  verdict: followed
  evidence: "uriorcurie slots use declared prefixes: creators ids 'ORCID:0000-...', affiliation ids 'ROR:0153tk833' (source gives https://ror.org/0153tk833, 7335), resources ids 'doi:10.18130/V3/...', version_access.latest_version_doi 'doi:10.18130/V3/HIGT4C'. URLs remain only in uri slots (page, access_urls), string slots (external_resources list, citations) or prose; doi slots carry the bare DOI."
- id: rule-10
  verdict: followed
  evidence: "Every external identifier is in the bundle: all ORCIDs from the Dataverse author lists (e.g. 7337, 7498) and Nature line 227 for Ideker; ROR 0153tk833 at 7335; FAIRSCAPE URL at 3853; RRIDs CVCL_0419/CVCL_B5P3 at 3184/3213; release DOIs at 4951, 5723, 6465, 7328. The report's grounding check also lists 0 absent."
- id: rule-11
  verdict: followed
  evidence: "Minted labels sit on the record's own id https://cm4ai.org/ (an absolute URL the bundle supplies, 4248): subsets '#subset-...', file_collections '#files-...', files '#file-...'. No fragment is appended to an organization, person or other dataset identifier; no undeclared prefix is invented."
- id: rule-12
  verdict: followed
  evidence: "A search of the full record for British forms (-isation, colour, tumour, modelling, licence, programme, centre, behaviour, analyse, labell, paediatric, organis-) found none; prose uses 'summarizing', 'organization' and other American forms."
- id: rule-13
  verdict: followed
  evidence: "The manifest ranking (download priority, which I ran read-only) puts june_2026_dataverse_release at tier 1 and data_release_documentation at tier 2; the record states the tier-1 Dataverse date 2026-06-17 (resources[4].issued, distribution_dates) and the caveat records both values and which was preferred. Project-end values (tier 1 vs tier 4) are not the same claim and both are kept with that reason. Two pairs the report does not list as conflicts: the copyright year (2025 in the tier-5 March 2025 description, 4792; 2024 in the tier-3 preprint, 3843-3845) are notices on different releases, and ip_restrictions' source_caveats records both years; the collaboration list with UT Austin (tier 2, 4405) versus without it (tier 5, 4792) describes the collaboration at different times, and the record states only the higher-ranked list, attributed to the page, with no caveat in the record itself (the report notes it)."
- id: rule-14
  verdict: not_applicable
  evidence: "Every minted id is forced by the schema (pack id_slots: subsets[0..1] DataSubset, file_collections[0..3] FileCollection, all 34 File entries, each forced: true); no unforced mint or constructed id exists, so the point-at test does not reach any id. The subset and file objects themselves are stated by the bundle (c016 4421-4438; file tables)."
- id: rule-15
  verdict: followed
  evidence: "CM4AI_coverage_receipt.yaml has 28 entries c001-c028 in order, each with a closed status (15 extracted, 13 nothing_relevant with reasons); every list entry (creators, funders and grants, file collections and files, resources, uses, limitations) has its own receipt by my per-entry check; the report records receipts check 28/28 chunks, 304/304 snippets, 618/618 slots."
- id: rule-16
  verdict: followed
  evidence: "Class-ranged attributes are objects with the digest's keys (Person under principal_investigator, contact_person, committee_contact with id/name/orcid/email; Grant with grant_number; Organization under affiliations); reference_attributes is empty and no object was reduced to a string. Both records validate."
- id: rule-17
  verdict: followed
  evidence: "Earlier-release facts are attributed to their version: collection_mechanisms[0..1] caveat 'Taken from the file descriptions of the October 2025 Data Release', ip_restrictions and license_terms caveats name the March 2025 description, each earlier release is its own resources/file_collections entry. Plans keep their tense: 'will be added in future releases' (known_limitations[1]), DAC 'as a statement of intent' (data_governance.description, source c012 3773). The Nature U2OS study is kept out of the referent's slots."
- id: rule-18
  verdict: not_applicable
  evidence: "The record states no derived figure: file_count values 6/21/8/10 are the pages' own counts ('1 to 6 of 6 Files' 4827, '1 to 10 of 21' 5501, '1 to 8 of 8' 6305, '1 to 10 of 10' 7144), sizes are quoted as 'Size shown', and total_file_count/total_size_bytes are absent."
- id: rule-19
  verdict: followed
  evidence: "My check of the receipt against the full record found every entry of creators (47), funders and each grant, resources (5), file_collections (4) and each of the 34 files, intended_uses, known_limitations, known_biases, external_resources and other lists with a receipt at or below its own path; e.g. slot-032 (creators[12]) and slot-036 (creators[21]) cite their own author-list lines."
- id: rule-20
  verdict: followed
  evidence: "Person objects use the ORCID the evidence states as an ORCID: CURIE: principal_investigator.id ORCID:0000-0002-1708-8454 (7498), ethical_reviews[0/1].contact_person ids ORCID:0000-0002-7080-8801 / ORCID:0000-0002-8965-8153 (7486, 7447), committee_contact ORCID:0000-0003-4535-3486 (7341); emails sit in email; no mailto id and no fragment for a person with an ORCID."
- id: rule-21
  verdict: followed
  evidence: "No related-but-distinct dataset is declared (scope output). The one non-CM4AI-subject source, the Nature U2OS article, contributes only Ideker's ORCID (a person fact also at 7498). Preprint-derived values (funders[0].grants[2], funders[1], ip_restrictions.restrictions[2]) come from a document whose subject is the CM4AI project (2944-2949), and their caveats say they fund/state 'the work that preprint reports'."
- id: rule-22
  verdict: followed
  evidence: "Entries name one thing each: one author per creator, one funder per funders entry, one lab per data_collectors entry, one version per versions_available item; known_limitations[1] joins two lines about one fact (predicted/computed cell maps not included, 7104/7090). ethical_reviews[0]/[1] each hold one of the two persons the single 'Ethical Review' line names (7085), since contact_person is single-valued; subsets[1] keeps the page's own heading 'Curated datasets for TNBC cells' (4429), which the source does not break into named datasets."
- id: rule-23
  verdict: followed
  evidence: "Forced ids take stated identifiers first: resources ids are the stated DOIs as doi: CURIEs; used_software[0].id is the stated https://fairscape.github.io (3853); person ids are stated ORCIDs. Labels for subsets, collections and files (no stated identifier) are minted on the own id https://cm4ai.org/, which equals the record's page, so they are receipt-exempt. Creators with no stated ORCID (e.g. creators[3] Axelsson U) have no id."
- id: rule-24
  verdict: followed
  evidence: "Populated enumerations rest on stated categories: conforms_to_standard RO_CRATE on 'in RO-Crate format' (4792); data_use_permission no_commercial_use on the license deed 'NonCommercial — You may not use the material for commercial purposes' (c017 4613-4615); file_type/compression/media_type are read from file names, which the rule exempts. limitation_type, bias_type, collection_type and maintainer role are left empty. (updates.frequency and resources[*].status are string-ranged, not enumerations.)"
- id: rule-25
  verdict: followed
  evidence: "raw_data_format is absent from both records; the bundle never states the pre-processing form of the data (file names such as cm4ai_perturb-seq_KOLF2_raw_sra.zip, 7282, describe released files), so leaving the slot empty is what the rule requires."
- id: rule-26
  verdict: followed
  evidence: "principal_investigator is set only for Ideker T (creators[46]), whom NIH RePORTER designates 'Principal investigator: IDEKER, TREY' (c014 4201); his Dataverse Point of Contact role is recorded as such in creators[46].description (the preprint's corresponding-author line, 2940, supplies only principal_investigator.email, not the designation), and no other contact (Thaker, Parker) is promoted to PI."
- id: rule-27
  verdict: followed
  evidence: "keywords comes from the Dataverse keyword line (7117) and fills nothing else; limitations are recorded without added consequences (known_limitations[2] 'most suitable for bioinformatics analysis of the individual datasets' as stated, 7105); the Data Insights tile figures are stated only as what the website panel reports, with a caveat that they are undated and not tied to a release."
- id: rule-28
  verdict: followed
  evidence: "List remarks are not entries: the June 2025 page's '1 to 10 of 21 Files' (5501) is recorded as file_count 21 with a source_caveats note that 11 files are not captured, not as an entry; versions_available lists only versions; external_resources entries are only the External Data Links items (7061-7074)."
- id: rule-29
  verdict: followed
  evidence: "errata and future_guarantees are absent; no distribution format field holds an access route (distribution_formats[0] format facts are media_type application/zip from 'Archive (10)', 7132); the prohibited_uses entry is the prohibition itself (7108) with no misplaced prohibition_reason; the captured-without-URL external links are noted in source_caveats rather than entered."
- id: rule-30
  verdict: followed
  evidence: "Scalar slots hold scalars: license 'CC BY-NC-SA 4.0', conforms_to 'RO-Crate', doi slots bare DOIs, version strings; no object is placed in a string-ranged slot, and both records report linkml-validate 'No issues found'."
- id: pair-01
  verdict: consistent
