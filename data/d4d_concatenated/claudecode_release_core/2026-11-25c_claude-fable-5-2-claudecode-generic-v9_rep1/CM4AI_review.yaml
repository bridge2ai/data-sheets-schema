- id: chunk-c001
  verdict: confirmed
  evidence: "Lines 1-24 are the concatenation preamble (input directory, 'Total Files: 10', selection manifest path) and a table of contents naming the ten source files; no dataset fact the full record leaves empty or states otherwise."
- id: chunk-c003
  verdict: confirmed
  evidence: "Lines 425-824 are the Nature article's results and discussion on the U2OS cell map (annotation jamborees, SEC-MS validation of 89 assemblies, AlphaFold-Multimer, Rag-Ragulator, DPP9, HEK293 comparison, paediatric tumour mutations, musicmaps.ai portal). U2OS is not a cell line of any CM4AI release (releases name MDA-MB-468 and KOLF2.1J, lines 7054-7058) and no passage ties this study's data to the CM4AI releases; nothing belongs in the record's own slots."
- id: chunk-c004
  verdict: confirmed
  evidence: "Lines 825-1224 are the Nature article's Methods: U2OS AP-MS with 2,174 baits (line 837), U2OS IF imaging in HPA (859-873), U2OS SEC-MS (875-909), embedding model and HiDeF community detection. All describe how that U2OS study's data were produced, not the CM4AI release data; nothing missed."
- id: chunk-c005
  verdict: confirmed
  evidence: "Lines 1225-1624: remaining Nature methods, Data availability (lines 1468-1507: U2OS map on NDEx uuid f693137a..., AP-MS at MassIVE MSV000097168, SEC-MS at ProteomeXchange PXD052362, HPA v23, ModelArchive), code availability, change history and start of references. These deposits belong to the U2OS study; the record correctly does not carry them for the CM4AI releases."
- id: chunk-c006
  verdict: confirmed
  evidence: "Lines 1625-2024 are the Nature article's reference list (BioPlex, LOPIT, MuSIC, CORUM, GO, AlphaFold, Cytoscape, etc.) with 'Article/CAS/PubMed/Google Scholar' link labels; bibliographic only, no dataset fact."
