  evidence: "Line 629 (the article's consortium roster) states affiliations for creators the full record lists with no affiliation, and two of them appear nowhere else in the bundle: 'Boston Children's Hospital, Boston, MA, USA: Kathy Jenkins' (creators[57] carries only name; a bundle search finds her affiliation only on line 629) and 'University of Central Florida, Orlando, FL, USA: Shaheen Awan' (creators[23] carries only name; likewise only line 629). The same line also states affiliations that disagree with the record: 'Dalhousie University, Toronto, ON, Canada: Frank Rudzicz' against creators[14].affiliations[0].name 'University of Toronto' (docs line 2028, protocol line 2633), and 'University of Montreal, Montreal, Quebec, Canada: Vardit Ravitsky' against creators[7].affiliations[0].name 'The Hastings Center' (docs line 2028, white paper lines 1176-1177); the record's caveats on those two entries address only name spelling. The chunk is also not empty for the record: funders[0].source_caveats cites the article's grant 1OT2OD032720-01, which is line 524 of this chunk. The report (Creators note) says the roster was set aside as lower-ranked (tier 3) and disagreeing; the chunk still holds affiliation content the record leaves empty or states otherwise."
