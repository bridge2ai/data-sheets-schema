- id: rule-28
  verdict: followed
  evidence: "List entries are members: 4 variables from line 4946, files named in lines 4933-4944 and 4963-5054; the remark that the features data dictionaries are not listed by name is kept in file_collections[0].source_caveats, not entered as a file."
- id: rule-29
  verdict: followed
  evidence: "errata is empty and 'There is no erratum' (line 2219) is in source_caveats; no future_guarantees entry; distribution formats are file formats (Parquet, TSV, JSON), not access routes; each prohibited_uses entry is the prohibition with its reason in prohibition_reason."
- id: rule-30
  verdict: followed
  evidence: "No object sits in a scalar-ranged slot (the report records schema validation with no issues); string slots such as related_datasets[0].target_dataset and funders[0].grantor carry strings."
- id: pair-01
  verdict: consistent
  evidence: "Compared full file_collections[0-2] and their 97 resources with core distributions by id: 100 ids on each side, no unmatched id, and every shared key (name, path, description, format, source_caveats) has identical values in both records; core distribution_formats equals the full record's."
notes: "Pack gaps: none ([]). receipt_join basis is index (no phase-1 snapshot under intermediate/), so slot paths were judged as written. The pack's instruction hash matched the recorded spec. Evidence boundary: only this run's pack, instruction, full and core records, coverage receipt and reconciliation report, the bundle, the schema files, and the read-only 'download scope' and 'download priority' outputs for VOICE were read. Overlapping adverse verdicts: rule-01 and rule-17 share one defect (language: English carried from the v2.0.0 Healthsheet); rule-02 and rule-13 share one defect (unrecorded affiliation disagreement for Rudzicz and Ravitsky, which also underlies part of chunk-c003); rule-21 (maintainers from the PhysioNet footer) is cited again as rule-01's second instance. Distinct defects: 3, plus chunk-c003's unused affiliations for creators such as Kathy Jenkins and Shaheen Awan. Instrument observation: c003 is marked nothing_relevant while funders[0].source_caveats cites that chunk's grant number (line 524); the receipt validator excludes source_caveats from its slot denominator, so a value drawn from a chunk declared nothing_relevant passes unnoticed. Other observations not charged: conforms_to 'Brain Imaging Data Structure v1.9.0' rests on a documentation passage (line 2229) about converting the raw audio files and questionnaire data, followed by a raw-audio folder tree; the 3.1.0 page does not name BIDS, which the record caveats. Identity: the reviewer is claude-opus-5-5 running as a Claude Code subagent given the definition file, not the typed agent."
