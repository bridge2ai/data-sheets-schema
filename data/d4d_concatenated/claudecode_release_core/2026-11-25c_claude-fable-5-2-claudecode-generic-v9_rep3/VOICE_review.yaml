- id: rule-01
  verdict: violated
  evidence: "language: 'English'. The record's own top-level source_caveats concede that 'no source states the languages present in version 3.1.0'; line 2175 ties English-only to v2.0.0 ('The only language option for v2.0.0 is English'), and line 2650 records protocol V11 (February 10, 2025) 'Updated to include data collection from Spanish language speakers', before the 3.0.0 release that added 391 participants (line 5079). The value is a plausible carry-over, which the rule says to omit; the report (finding 4) kept it knowingly. Second instance: maintainers[0] 'MIT Laboratory for Computational Physiology' is inferred from the PhysioNet footer (line 5170), see rule-21."
- id: rule-02
  verdict: violated
  evidence: "creators[14].affiliations[0].name 'University of Toronto' (docs line 2028, protocol line 2633) and creators[7].affiliations[0].name 'The Hastings Center' (docs line 2028, white paper lines 1176-1177) are stated without noting that the feasibility article (line 629) gives 'Dalhousie University' for Frank Rudzicz and 'University of Montreal' for Vardit Ravitsky. The report says that roster 'disagrees with the documentation for some people, so it was not used'; in the record the choice is silent. Other disagreements are represented: author spellings (creators[11], [12], [14] source_caveats) and award numbers (funders[0].source_caveats). Same defect as rule-13."
- id: rule-03
  verdict: followed
  evidence: "The report's Referent section names the adult Bridge2AI-Voice dataset at release 3.1.0, matching the declared scope (about https://doi.org/10.13026/37yb-1t42; pediatric dataset declared distinct). Full and core both carry id doi:10.13026/37yb-1t42, doi 10.13026/8xbn-nq66 and page https://physionet.org/content/b2ai-voice/3.1.0/; earlier releases appear only in version_access.versions_available, and pediatric facts only in related_datasets[0]."
- id: rule-04
  verdict: followed
  evidence: "No padding is evident: slots with no stated category are left empty (raw_data_format, bias_type, limitation_type, errata, the phenotype collection's collection_type, file counts and sizes), and stated absences go to source_caveats rather than entries."
- id: rule-05
  verdict: followed
  evidence: "creators has one entry per author (122, matching lines 4559-4801); sensitive_elements splits race, sexual orientation and socioeconomic/health information into three entries; prohibited_uses has five separate prohibitions; Parselmouth and Praat are separate used_software entries in preprocessing_strategies[6]."
- id: rule-06
  verdict: followed
  evidence: "Stated absences (no splits, no erratum, no export controls, no impact analysis) are in source_caveats, not slot values. Slots carry content, not pointers: e.g. license_and_use_terms reproduces the IP terms of lines 2201-2202; prohibition_reason entries name the restriction type (agreement term), which the slot's own description lists as a reason ('license restriction')."
- id: rule-07
  verdict: followed
  evidence: "Access route is in data_governance.access_review_process (lines 1901-1910), not in distribution_formats; release cadence is in updates, consequences for users in future_use_impacts (line 2187), discouraged applications in discouraged_uses (line 2189). The maintainers placement is charged under rule-21, not here."
- id: rule-08
  verdict: followed
  evidence: "Class-ranged entries carry their declared fields: the two Person objects have id, name and affiliation objects (Bensoussan's email from line 2605, also split across lines 1074-1075); funders[0].grants[0] has grant_number and name; used_software entries have id and name, b2aiprep adds version, license (line 2557) and url; files have id, name, path, format, file_type. Many creators carry only name: the evidence for their affiliations is the tier-3 roster (line 629) and the protocol (lines 2602-2640), which the record chose not to use; no affiliation is restated in prose instead, so the prose-instead-of-structure pattern the rule targets does not occur (see chunk-c003)."
- id: rule-09
  verdict: followed
  evidence: "Every populated uriorcurie leaf uses a CURIE where a prefix is declared: id doi:10.13026/37yb-1t42, version_access.latest_version_doi doi:10.13026/37yb-1t42, person and software ids on that base. The two URL ids (https://github.com/sensein/b2aiprep, .../senselab) have no declared prefix. related_datasets[0].target_dataset is string-ranged, doi is the bare DOI, access_urls and raw_sources.access_url are uri-ranged URLs."
- id: rule-10
  verdict: followed
  evidence: "Every external identifier is in the bundle: 10.13026/8xbn-nq66 (line 5134), 10.13026/37yb-1t42 (line 5136), 10.13026/mf9s-5r03 (line 5655), Synapse URL (line 4809), GitHub URLs (lines 2141-2143, 1443, 5106, 5723), Zenodo URLs (lines 1447, 5099), award 3OT2OD032720-01S1 (line 5093). No ORCID or ROR was supplied; the bundle contains none."
- id: rule-11
  verdict: not_applicable
  evidence: "id_slots: all 108 minted ids (2 Person, 6 Software, 3 FileCollection, 97 File) are forced and sit on the record's own id doi:10.13026/37yb-1t42, a declared CURIE; there are no constructed ids and no invented prefixes. With every mint forced the fragment rule's choice does not arise; the two stated Software ids are evidence-rule matters (rule-10)."
- id: rule-12
  verdict: followed
  evidence: "A search of the full record for British spellings (-ise/-isation, -our, centre, licence, programme, analyse, paediatric, haem-) finds none in the record's prose; 'bioaccoustic' in funders[0].grants[0].name is the grant title as written at line 5093."
- id: rule-13
  verdict: violated
  evidence: "The manifest ranks project_documentation and irb_protocol tier 2 and feasibility_publication tier 3. Line 629 (tier 3) gives Frank Rudzicz 'Dalhousie University' and Vardit Ravitsky 'University of Montreal'; line 2028 (tier 2) gives 'University of Toronto' and 'The Hastings Center'. The record states the higher-ranked values in creators[14] and creators[7] but records no caveat that the sources disagreed; the report concedes the disagreement. The rule is followed elsewhere (name spellings, creators[11], [12], [14]). Same defect as rule-02."
- id: rule-14
  verdict: not_applicable
  evidence: "Every minted id in id_slots is forced (Person, Software, FileCollection, File); no unforced mint exists whose pointing-at could be judged. The recorded objects themselves are stated parts (files from lines 4933-5054, tools from lines 4914-4920, PIs from line 2028), not noise-as-structure."
- id: rule-15
  verdict: followed
  evidence: "VOICE_coverage_receipt.yaml carries bundle_md5 9193c3cbe60b62a2fc0f704a2c4d23a3 (the bundle's md5) and 22 chunk entries c001-c022 in manifest order, each with one status from the closed set (3 nothing_relevant with reasons, 19 extracted with slot/snippet pairs). Whether c003 was truly nothing_relevant is judged under chunk-c003."
- id: rule-16
  verdict: followed
  evidence: "principal_investigator under creators[0] and creators[3] is a Person object with id, name and an affiliation object list; grants carry grant_number; affiliations are Organization objects with name. reference_attributes is empty for this schema, and no object is reduced to a string."
- id: rule-17
  verdict: violated
  evidence: "language: 'English' is a fact the Healthsheet states for v2.0.0 (line 2175 'The only language option for v2.0.0 is English'; Spanish 'under development'), placed in the current release's own slot; the record admits in source_caveats that no source states 3.1.0's languages. Elsewhere the rule is followed: earlier releases only in version_access.versions_available, the Healthsheet's planned semi-annual updates kept in the future tense, enrollment targets (lines 1955, 2688) excluded as plans. Same defect as rule-01's first instance."
- id: rule-18
  verdict: not_applicable
