- id: rule-19
  verdict: followed
  evidence: "The receipt carries an entry-level receipt for each of the 122 creators, the 11 features files, all 86 phenotype files, the 4 variables, the 3 file collections, the 5 prohibited_uses, the 3 sensitive_elements and each used_software entry; sampled roster receipts (slot-007, -010, -011, -014, -017, -022, -025, -028) each cite the line naming that person."
- id: rule-20
  verdict: followed
  evidence: "The bundle states no ORCID (search finds none); creators[0].principal_investigator.id is doi:10.13026/37yb-1t42#person-yael-bensoussan and creators[3].principal_investigator.id doi:10.13026/37yb-1t42#person-olivier-elemento, the form the rule gives; Bensoussan's address is in email, not in id."
- id: rule-21
  verdict: violated
  evidence: "maintainers[0].name 'MIT Laboratory for Computational Physiology' is receipted by line 5170 'Maintained by the MIT Laboratory for Computational Physiology', the PhysioNet site footer, which appears identically on every PhysioNet page in the bundle, including the 1.1 page (line 3832), the 3.0.0 page (line 4498) and the pediatric dataset's page (line 5684); its subject is the PhysioNet platform, which the record's own maintainer_details concedes ('PhysioNet is maintained by the MIT Laboratory for Computational Physiology'). Counter-reading considered: the Maintainer description includes 'hosting arrangements', and the Healthsheet's own answer to 'Who is supporting/hosting/maintaining the dataset?' (lines 2208-2212) names the hosting platform and who maintains it (Health Data Nexus, T-CAIREM), so a host's maintainer is within the slot's scope. That makes the hosting arrangement a legitimate thing to describe in maintainer_details, but it does not change the verdict: the rule's test is what the passage is about, and the passage names the maintainer of a site that hosts the pediatric dataset equally, not a party responsible for this dataset. The record turns 'hosted on PhysioNet' plus 'PhysioNet is maintained by MIT LCP' into 'MIT LCP maintains this dataset'. Borderline, judged violated. Pediatric facts are correctly confined to related_datasets[0]."
- id: rule-22
  verdict: followed
  evidence: "Multivalued entries name one entity each: creators one person per entry, funders[0] one grantor, used_software one tool per entry, regulatory_compliance HIPAA and Common Rule separately. collection_mechanisms[1] 'Recording hardware' is one recording setup as line 2089 states it in one sentence (iPad with an Avid AE-36 microphone and an Apple dongle), in a slot whose entries are mechanisms rather than single instruments. external_resources[2] groups the project website, docs site and docs repository under one heading, but ExternalResource.external_resources is itself a list of links."
- id: rule-23
  verdict: followed
  evidence: "All forced ids are present; where the evidence states an identifier it is used (b2aiprep and SenseLab GitHub URLs, lines 2141-2143); every other forced id is a single-fragment label on the record's own id doi:10.13026/37yb-1t42, a declared CURIE, the base the rule prefers. Creators and the maintainer with no stated identifier have no id. No fragment sits on another entity's identifier."
- id: rule-24
  verdict: followed
  evidence: "Enumerated leaves: conforms_to_standard BIDS (line 2230 names Brain Imaging Data Structure v1.9.0); confidentiality_level restricted (line 5165); variables[0-1].data_type identifier ('a unique identifier', line 4946); file_collections[0].collection_type processed_data ('derived audio data features', line 4928, matching the enum's 'transformed data files'); file_collections[1].collection_type metadata (line 4928 'metadata related to the specific audio task and recording'); the phenotype collection's type is left empty. relationship_type is required; 'references' restates line 4811 ('Note that the Bridge2AI-Voice Pediatric Dataset is also available on PhysioNet: <url>'), and the declared scope directs the pediatric dataset to related_datasets; the record's caveat discloses that no typed relation is stated. Borderline, judged followed."
- id: rule-25
