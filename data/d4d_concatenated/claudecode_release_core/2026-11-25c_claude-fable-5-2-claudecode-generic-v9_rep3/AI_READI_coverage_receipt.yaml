  - slot: "purposes[0].response"
    snippet: "The purpose for creating the dataset was to enable future generations of artificial intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways to return to health."
  - slot: "addressing_gaps[0].response"
    snippet: "Given the complexity of T2DM, AI-based approaches may help with improving our understanding but a key issue is the lack of data ready for training AI models. The AI-READI dataset is intended to fill this gap."
  - slot: "tasks[0].response"
    snippet: "The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime manifolds and various applications in artificial intelligence."
  - slot: "creators[0].description"
    snippet: "This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI Consortium."
  - slot: "funders[0].description"
    snippet: "The creation of the dataset was funded by the National Institutes of Health (NIH) through their Bridge2AI Program (https://commonfund.nih.gov/bridge2ai)."
  - slot: "instances[0].instance_type"
    snippet: "Each instance represents an individual patient."
  - slot: "instances[0].counts"
    snippet: "There are 2280 instances in this current version of the dataset (version 3, released fall 2025)."
  - slot: "instances[0].description"
    snippet: "Multiple modalities of data are collected for each participant, including survey data, clinical data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable activity monitor data. These encompass tabular data, imaging data, and physiological signal/waveform data. There is no unstructured text data included in this dataset."
  - slot: "instances[0].description"
    snippet: "Each instance consists of all of the data available for an individual participating in the study."
  - slot: "description"
    snippet: "Multiple modalities of data are collected for each participant, including survey data, clinical data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable activity monitor data."
  - slot: "instances[0].label"
    snippet: "N/A - no labels are provided"
  - slot: "missing_data_documentation[0].missing_data_patterns"
    snippet: "Yes, not all modalities are available for all participants."
  - slot: "missing_data_documentation[0].missing_data_causes"
    snippet: "Some participants elected not to participate in some study elements. In a few cases, the data collection device did not have any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost). In a few cases, there may have been a data collision at some point in the process and data has been lost."
  - slot: "sampling_strategies[0].description"
    snippet: "The dataset contains all possible instances."
  - slot: "sampling_strategies[0].description"
    snippet: "No data were excluded from the dataset at the time of preprocessing."
  - slot: "sampling_strategies[0].description"
    snippet: "Inclusion Criteria: - Able to provide consent - ≥ 40 years old - Persons with or without type 2 diabetes - Must speak and read English"
  - slot: "relationships[0].relationship_details"
    snippet: "all instances are part of the same prospective data generation project (AI-READI). There is currently only one visit per participant."
  - slot: "anomalies[0]"
    snippet: "In cases of survey data, skipped questions or incomplete responses are expected."
  - slot: "anomalies[1]"
    snippet: "In cases of using wearables, improper use, technical failure such as battery failure or system malfunction are expected."
  - slot: "anomalies[2]"
    snippet: "In cases of imaging data, patient uncooperation, noise that may obscure the images and technical failure such as system malfunction, and data transfer failures are expected."
  - slot: "external_resources[0].description"
    snippet: "The dataset is self-contained but does rely on the dataset documentation for users requiring additional information about the provenance of the dataset."
  - slot: "external_resources[0].description"
    snippet: "The documentation is shared under the CC-BY 4.0 license"
  - slot: "confidential_elements[0]"
    snippet: "No, the dataset does not contain data that might be considered confidential. No personally identifiable information is included in the dataset."
  - slot: "content_warnings[0].content_warnings_present"
    snippet: "might otherwise pose any safety risk (such as psychological safety and anxiety)? If so, please describe why.\",\n          \"response\": \"No.\""
  - slot: "sensitive_elements[0]"
    snippet: "No, the public dataset will not contain data that is considered sensitive. However, the controlled access dataset will contain data regarding racial and ethnic origins, location (5-digit zip code), as well as motor vehicle accident reports."
  - slot: "is_deidentified.identifiable_elements_present"
    snippet: "No personally identifiable information is included in the dataset."
  - slot: "is_deidentified.deidentification_details"
    snippet: "the dataset has been reviewed internally by AI-READI team members for quality checks and to ensure that no personally identifiable information was accidentally included"
  - slot: "known_limitations[1]"
    snippet: "Factors influencing the generalization of derived models include the predominantly urban and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds."
  - slot: "known_limitations[2]"
    snippet: "The study cohort may not provide a comprehensive representation of the population, as it does not include other races/ethnicities such as Pacific Islanders and Native Americans."
  - slot: "known_limitations[3]"
    snippet: "As enrollment is ongoing, the periodic updates to data releases may not have achieved balanced distribution across groups."
  - slot: "known_limitations[3].name"
    snippet: "the overall enrollment goal is to have balanced distribution between different racial groups"
  - slot: "splits[0].split_details"
    snippet: "It does include a new recommended data split for the 2280 participants balancing training, validation, and testing sets for age, sex, races/ethnicities, and study group."
  - slot: "cleaning_strategies[0]"
    snippet: "There were several quality control measures used at the time of data entry/acquisition. For example, clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in reports viewed by clinical research coordinators (CRCs) and Data Managers."
  - slot: "cleaning_strategies[0].cleaning_details"
    snippet: "Editing was only done under the guidance and approval of the site PI."
  - slot: "preprocessing_strategies[0]"
    snippet: "Once data were sent from each of the study sites to the central project team, additional processing steps were conducted in preparation for dissemination. For example, all data were mapped to standardized terminologies when possible, such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model"
  - slot: "raw_sources[0].raw_data_details"
    snippet: "The raw data is saved and expected to be preserved by the AI-READI project at least for the duration of the project but is not anticipated to be shared outside the project team right now"
  - slot: "raw_sources[0].raw_data_details"
    snippet: "There is a possibility that raw data may be included in future releases of the controlled access dataset."
  - slot: "updates.frequency"
    snippet: "There are plans to release new versions of the dataset approximately once a year"
  - slot: "updates.update_details"
    snippet: "There are plans to release new versions of the dataset approximately once a year with additional data from participants who have been enrolled since the last dataset version release."
  - slot: "version_access.version_details"
    snippet: "The dataset gets released as static versions."
  - slot: "version_access.version_details"
    snippet: "the first version of the dataset contains data from 204 participants, the second version contains additional data from 863 participants for a total of 1067 participants, and this version contains a total of 2280 participants"
  - slot: "version_access.version_details"
    snippet: "the Snellen visual acuity variables were dropped in this version of the dataset"
  - slot: "collection_mechanisms[3]"
    snippet: "Monofilament testing for peripheral neuropathy ... It is done using a standard 10g monofilament applying pressure to different points on the plantar surface of the feet."
  - slot: "collection_mechanisms[8]"
    snippet: "Undilated fundus photography - Optomed Aurora ... The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the ocular fundus."
  - slot: "collection_mechanisms[8].mechanism_details"
    snippet: "Images taken during the AI-READI visit, are undilated images taken in a dark room"
  - slot: "collection_mechanisms[9]"
    snippet: "Dilated fundus photography - Eidon ... The iCare EIDON is a widefield TrueColor confocal fundus imaging system that can capture images up to 200°."
  - slot: "collection_mechanisms[9].mechanism_details"
    snippet: "AI READI images using EIDON include two main modalities: 1. Single Field Central IR/FAF 2. Smart Horizontal Mosaic."
  - slot: "collection_mechanisms[10]"
    snippet: "The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that combines optical coherence tomography (OCT) with retinal angiography."
  - slot: "collection_mechanisms[10].mechanism_details"
    snippet: "imaging is done in a dark room using the following modalities: ONH-RC, PPole-H, and OCTA of the macula"
  - slot: "collection_mechanisms[11]"
    snippet: "The DRI OCT Triton is a device from Topcon Healthcare that combines swept-source OCT technology with multimodal fundus imaging."
  - slot: "collection_mechanisms[11].mechanism_details"
    snippet: "Imaging is done in 12.0X12.0 mm and 6.0X6.0 mm OCTA, and 12.0 mm X9.0 mmX6.0 mm 3D Horizontal and Radial scan modes."
  - slot: "collection_mechanisms[12]"
    snippet: "Maestro2 3D OCT (Topcon Healthcare) ... The Maestro2 is a robotic OCT and color fundus camera system from Topcon Healthcare."
  - slot: "collection_mechanisms[12].mechanism_details"
    snippet: "Protocols include 12.0 mm X9.0 mm widefield, 6.0 mm X 6.0 mm 3D macula scan and 6.0 mm X 6.0 mm OCTA"
  - slot: "collection_mechanisms[13]"
    snippet: "FLIO (Heidelberg Engineering) ... Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) is an advanced imaging technique used in ophthalmology."
  - slot: "collection_mechanisms[13].mechanism_details"
    snippet: "The imaging is done by an operator in a dark room analogous to a straightforward heidelberg spectralis OCT. ... it is kept to be performed as the last modality of an AI READI visit"
  - slot: "collection_mechanisms[14]"
    snippet: "The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence tomography (OCT) system that offers non-invasive imaging of retinal microvasculature."
  - slot: "collection_mechanisms[14].mechanism_details"
    snippet: "Imaging protocols include 512 X 512 and 200 X 200 macula and ONH scans and also OCTA of the macula."
  - slot: "collection_mechanisms[15]"
    snippet: "The Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM) that directly monitors blood glucose levels without requiring finger sticks."
  - slot: "collection_mechanisms[16]"
    snippet: "The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure data related to physical activity."
  - slot: "collection_mechanisms[17]"
    snippet: "Participants will be sent home with an environmental sensor (a custom-designed sensor unit called the LeeLab Anura), which they will use for 10 continuous days before returning the devices to the clinical research coordinators for data download."
