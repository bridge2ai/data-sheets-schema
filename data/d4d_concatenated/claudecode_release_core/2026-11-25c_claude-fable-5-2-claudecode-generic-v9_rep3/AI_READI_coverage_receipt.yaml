- id: c001
  status: nothing_relevant
  reason: "Concatenation preamble and table of contents listing the ten source file names; no dataset facts."
- id: c002
  status: extracted
  extracted:
  - slot: "purposes[0].response"
    snippet: "data collection project on type 2 diabetes mellitus (T2DM) to facilitate the widespread use of artificial intelligence and machine learning (AI/ML) approaches to study salutogenesis"
  - slot: "sampling_strategies[0].name"
    snippet: "For  each  recruitment  wave,  a  contact  pool  is  identified"
  - slot: "sampling_strategies[0].is_representative"
    snippet: "rather  than  targeting  the  demo- graphic  distribution  of  the  US  population,  the  study  is triple- balanced"
  - slot: "sampling_strategies[0].why_not_representative"
    snippet: "Building  balanced  data sets is critical for the development of unbiased machine learning  models"
  - slot: "sampling_strategies[0].why_not_representative"
    snippet: "four race/ethnic groups (Asian, black, white, Hispanic), four categories of T2DM (no diabetes,"
  - slot: "sampling_strategies[0].source_data"
    snippet: "The study base is all patients aged ≥40 years of age who had a medical encounter within each health system site (UAB, UCSD, UW) between 2020 and 2025"
  - slot: "sampling_strategies[0].strategies"
    snippet: "Participants  are  recruited  in  waves"
  - slot: "sampling_strategies[0].strategies"
    snippet: "will  be  adjusted  by  under-  and  oversampling groups as needed"
  - slot: "ethical_reviews[0].reviewing_organization"
    snippet: "approved by the Institutional Review Board (IRB) of the University of Washington (approval number STUDY00016228)"
  - slot: "ethical_reviews[0].review_details"
    snippet: "reliance  agreements  with the  IRBs  of  University  of  Alabama  at  Birmingham  and University  of  California,  San  Diego"
  - slot: "human_subject_research.irb_approval"
    snippet: "AI- READI was approved by the Institutional Review Board (IRB) of the University of Washington (approval number STUDY00016228)"
  - slot: "informed_consent[0].consent_obtained"
    snippet: "Written  informed consent is provided by all participants"
  - slot: "informed_consent[0].consent_type"
    snippet: "If participants did not select the option to consent elec- tronically,  it  is  performed  in- person  at  the  start  of  the visit"
  - slot: "known_biases[0].bias_type"
    snippet: "there  is  selection  bias known  as  volunteer  bias"
  - slot: "known_biases[0].bias_description"
    snippet: "Partic- ipants  are  volunteers;  therefore,  there  is  selection  bias known  as  volunteer  bias  which  may  limit  the  generalis- ability  of  the  results  among  those  who  are  not  repre- sented  in  the  study  population"
  - slot: "collection_timeframes[0].timeframe_details"
    snippet: "Preliminary  pilot  enrolment occurred between 18 July 2023 and 30 November 2023"
  - slot: "collection_timeframes[0].timeframe_details"
    snippet: "The formal data collection process began on 1 December 2023"
  - slot: "data_collectors[0].collector_details"
    snippet: "All research personnel at the three data sites who recruited, enrolled  and  collected  data  underwent  training  by  the data  manager  at  UAB  and  a  detailed  Manual  of  Proce- dures  (MOP)"
  - slot: "data_collectors[0].collector_details"
    snippet: "Successful  completion  of a  certification  process  is  required  for  all  coordinators"
- id: c003
  status: extracted
  extracted:
  - slot: "collection_mechanisms[1]"
    snippet: "A  12- lead  ECG  is  performed  (Philips  Pagewriter  TC30 Cardiograph,  Amsterdam,  The  Netherlands)  while  the participant sits in a reclining chair or lies supine"
  - slot: "collection_mechanisms[2]"
    snippet: "tive screener is carried out using the Montreal Cognitive Assessment12 (MoCA), administered electronically on an iPad using the MoCA Duo Application"
  - slot: "collection_mechanisms[4]"
    snippet: "Photopic letter visual acuity is measured with the Electronic Visual Acuity tester13 (M&S Technology, Niles, Illinois)"
  - slot: "collection_mechanisms[4].mechanism_details"
    snippet: "Mesopic acuity is measured by the participant viewing the display through a 2.0 neutral density (ND) filter"
  - slot: "collection_mechanisms[5]"
    snippet: "Photopic  letter  contrast  sensitivity  is measured  with  the  Mars  chart  (Mars  Perceptrix"
  - slot: "collection_mechanisms[5].mechanism_details"
    snippet: "Mesopic contrast sensitivity is assessed by viewing through the 2.0"
  - slot: "collection_mechanisms[6]"
    snippet: "Autore- fraction  data  for  each  eye  are  obtained"
  - slot: "collection_mechanisms[6].mechanism_details"
    snippet: "using  the  autorefractor’s  standard  protocol (Topcon  KR  800"
  - slot: "collection_mechanisms[7]"
    snippet: "Blood  (non- fasting)  and  urine  samples  are  collected from  participants  during  the  visit"
  - slot: "collection_mechanisms[7].mechanism_details"
    snippet: "Amendments- certified  laboratories  local  to  each  data collection  site  perform  complete  blood  count  (CBC) testing on fresh whole blood samples; all other lab tests are performed by the University of Washington Nutrition and  Obesity  Research  Center  (NORC)  testing  facility using  stored,  frozen  samples"
- id: c004
  status: extracted
  extracted:
  - slot: "collection_mechanisms[0]"
    snippet: "REDCap is used for collecting patient- reported data from questionnaires  and  the  following  clinical  data  from  the visit: medications assessment, vitals, visual acuity, contrast sensitivity, monofilament test results and CBC test results"
  - slot: "collection_mechanisms[15]"
    snippet: "participants  are sent  home  with  three  data  monitoring  devices  as  listed in  table  4:  (1)  home  environmental  sensor,  (2)  Garmin fitness  tracker  and  (3)  Dexcom  Continuous  Glucose Monitor  (CGM)"
  - slot: "collection_mechanisms[16].mechanism_details"
    snippet: "Coordinators  provide  instructions  on how to use these monitoring devices continuously for 10 days"
  - slot: "collection_mechanisms[17].mechanism_details"
    snippet: "(1)  home  environmental  sensor,  (2)  Garmin fitness  tracker"
  - slot: "raw_data_sources[0]"
    snippet: "Data from the following devices are exported in their raw ... format to local storage: ECG (.xml)"
  - slot: "raw_data_sources[1]"
    snippet: "MoCA Duo applica- tion (total score, section subscores, Memory Index Score and task completion times; .csv)"
  - slot: "raw_data_sources[1].source_description"
    snippet: "Data from the following devices are exported in their raw"
  - slot: "preprocessing_strategies[0].preprocessing_details"
    snippet: "All data are mapped to applicable data standard formats, such as the Observational  Medical  Outcomes  Partnership  Common Data Model for clinical data and the DICOM format for retinal  imaging"
  - slot: "preprocessing_strategies[1]"
    snippet: "All participant images are exported from imaging devices in  their  raw  format  and  some  images  required  conver- sion to a DICOM standard format prior to upload"
  - slot: "cleaning_strategies[1]"
    snippet: "The Data Manager at each data site is responsible for the quality control of all data before uploading  to  FAIRhub"
  - slot: "updates.frequency"
    snippet: "data  are  released  approximately  yearly  in  two  data  sets"
  - slot: "participant_privacy[0].privacy_techniques"
    snippet: "ronmental  sensor  and  the  Garmin  fitness  tracker  were specifically  chosen  with  participant  privacy  as  a  primary concern. These devices do not capture video or audio, are not equipped with GPS location monitoring and are not synced  with  participant- owned  devices"
  - slot: "publisher"
    snippet: "called FAIRhub (https://fairhub.io/), a Microsoft Azure cloud- based platform developed for this project"
