  - slot: "collection_mechanisms[1].mechanism_details"
    snippet: "We will obtain a 12-lead ECG and perform the monofilament test"
  - slot: "collection_mechanisms[2].mechanism_details"
    snippet: "Memory and cognitive function will be assess with the MoCA cognitive test (Montreal Cognitive Assessment)."
  - slot: "collection_mechanisms[15].mechanism_details"
    snippet: "We will use Dexcom CGM devices that collect glucose data over a 10-day period."
  - slot: "collection_mechanisms[16].mechanism_details"
    snippet: "The participants will wear the CGM and fitness tracker for 10 days."
  - slot: "collection_mechanisms[17].mechanism_details"
    snippet: "Study participants will receive a small sensor (for environmental data monitoring) and place it at home for data collection for 10 days"
