slots:
  acquisition_methods[0].acquisition_details:
    receipts:
    - chunk: c019
      snippet: The acquisition of data varied based on the domain; some data were
        directly observable (such as labs, vitals, and retinal imaging), whereas other
        data were reported by subjects (e.g. survey responses). Verification of data
        entry was performed when possible (e.g. cross-referencing entered medications
        with medications that were physically brought in or photographed by each study
        participant).
    core_path: acquisition_methods[0].acquisition_details
  acquisition_methods[0].was_directly_observed:
    receipts:
    - chunk: c019
      snippet: some data were directly observable (such as labs, vitals, and retinal
        imaging)
    core_path: acquisition_methods[0].was_directly_observed
  acquisition_methods[0].was_reported_by_subjects:
    receipts:
    - chunk: c019
      snippet: other data were reported by subjects (e.g. survey responses)
    core_path: acquisition_methods[0].was_reported_by_subjects
  acquisition_methods[0].was_validated_verified:
    receipts:
    - chunk: c019
      snippet: Verification of data entry was performed when possible
    core_path: acquisition_methods[0].was_validated_verified
  addressing_gaps[0].response:
    receipts:
    - chunk: c007
      snippet: a major barrier has been the lack of diverse datasets that are AI ready1
        for training AI models, which the AI-READI project is designed to address
    - chunk: c018
      snippet: Given the complexity of T2DM, AI-based approaches may help with improving
        our understanding but a key issue is the lack of data ready for training AI
        models. The AI-READI dataset is intended to fill this gap.
    core_path: addressing_gaps[0].response
  anomalies[0]:
    receipts:
    - chunk: c018
      snippet: In cases of survey data, skipped questions or incomplete responses
        are expected.
    core_path: anomalies[0]
  anomalies[1]:
    receipts:
    - chunk: c018
      snippet: In cases of using wearables, improper use, technical failure such as
        battery failure or system malfunction are expected.
    core_path: anomalies[1]
  anomalies[2]:
    receipts:
    - chunk: c018
      snippet: In cases of imaging data, patient uncooperation, noise that may obscure
        the images and technical failure such as system malfunction, and data transfer
        failures are expected.
    core_path: anomalies[2]
  cleaning_strategies[0]:
    receipts:
    - chunk: c018
      snippet: There were several quality control measures used at the time of data
        entry/acquisition. For example, clinical data outside of expected min/max
        ranges were flagged in REDCap, which was visible in reports viewed by clinical
        research coordinators (CRCs) and Data Managers.
    core_path: cleaning_strategies[0]
  cleaning_strategies[0].cleaning_details:
    receipts:
    - chunk: c018
      snippet: Editing was only done under the guidance and approval of the site PI.
    core_path: cleaning_strategies[0].cleaning_details
  cleaning_strategies[1]:
    receipts:
    - chunk: c004
      snippet: The Data Manager at each data site is responsible for the quality control
        of all data before uploading  to  FAIRhub
    core_path: cleaning_strategies[1]
  collection_consents[0].consent_details:
    receipts:
    - chunk: c019
      snippet: Informed consent to participate was required before participation in
        any part of the protocol (including questionnaires). Potential participants
        were given the option to read all consent documentation electronically (e-consent)
        before their visit and give their consent with an electronic signature without
        verbal communication with a clinical research coordinator.
    core_path: collection_consents[0].consent_details
  collection_mechanisms[0]:
    receipts:
    - chunk: c004
      snippet: 'REDCap is used for collecting patient- reported data from questionnaires  and  the  following  clinical  data  from  the
        visit: medications assessment, vitals, visual acuity, contrast sensitivity,
        monofilament test results and CBC test results'
    core_path: collection_mechanisms[0]
  collection_mechanisms[10]:
    receipts:
    - chunk: c018
      snippet: The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that
        combines optical coherence tomography (OCT) with retinal angiography.
    core_path: collection_mechanisms[10]
  collection_mechanisms[10].mechanism_details:
    receipts:
    - chunk: c018
      snippet: 'imaging is done in a dark room using the following modalities: ONH-RC,
        PPole-H, and OCTA of the macula'
    core_path: collection_mechanisms[10].mechanism_details
  collection_mechanisms[11]:
    receipts:
    - chunk: c018
      snippet: The DRI OCT Triton is a device from Topcon Healthcare that combines
        swept-source OCT technology with multimodal fundus imaging.
    core_path: collection_mechanisms[11]
  collection_mechanisms[11].mechanism_details:
    receipts:
    - chunk: c018
      snippet: Imaging is done in 12.0X12.0 mm and 6.0X6.0 mm OCTA, and 12.0 mm X9.0
        mmX6.0 mm 3D Horizontal and Radial scan modes.
    core_path: collection_mechanisms[11].mechanism_details
  collection_mechanisms[12]:
    receipts:
    - chunk: c018
      snippet: Maestro2 3D OCT (Topcon Healthcare) ... The Maestro2 is a robotic OCT
        and color fundus camera system from Topcon Healthcare.
    core_path: collection_mechanisms[12]
  collection_mechanisms[12].mechanism_details:
    receipts:
    - chunk: c018
      snippet: Protocols include 12.0 mm X9.0 mm widefield, 6.0 mm X 6.0 mm 3D macula
        scan and 6.0 mm X 6.0 mm OCTA
    core_path: collection_mechanisms[12].mechanism_details
  collection_mechanisms[13]:
    receipts:
    - chunk: c018
      snippet: FLIO (Heidelberg Engineering) ... Fluorescence Lifetime Imaging Ophthalmoscopy
        (FLIO) is an advanced imaging technique used in ophthalmology.
    core_path: collection_mechanisms[13]
  collection_mechanisms[13].mechanism_details:
    receipts:
    - chunk: c018
      snippet: The imaging is done by an operator in a dark room analogous to a straightforward
        heidelberg spectralis OCT. ... it is kept to be performed as the last modality
        of an AI READI visit
    core_path: collection_mechanisms[13].mechanism_details
  collection_mechanisms[14]:
    receipts:
    - chunk: c018
      snippet: The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence
        tomography (OCT) system that offers non-invasive imaging of retinal microvasculature.
    core_path: collection_mechanisms[14]
  collection_mechanisms[14].mechanism_details:
    receipts:
    - chunk: c018
      snippet: Imaging protocols include 512 X 512 and 200 X 200 macula and ONH scans
        and also OCTA of the macula.
    core_path: collection_mechanisms[14].mechanism_details
  collection_mechanisms[15]:
    receipts:
    - chunk: c004
      snippet: 'participants  are sent  home  with  three  data  monitoring  devices  as  listed
        in  table  4:  (1)  home  environmental  sensor,  (2)  Garmin fitness  tracker  and  (3)  Dexcom  Continuous  Glucose
        Monitor  (CGM)'
    - chunk: c018
      snippet: The Dexcom G6 is a real-time, integrated continuous glucose monitoring
        system (iCGM) that directly monitors blood glucose levels without requiring
        finger sticks.
    core_path: collection_mechanisms[15]
  collection_mechanisms[15].mechanism_details:
    receipts:
    - chunk: c007
      snippet: post-visit data collection for 10 days using a Dexcom G6 for continuous
        glucose monitoring
    - chunk: c023
      snippet: We will use Dexcom CGM devices that collect glucose data over a 10-day
        period.
    core_path: collection_mechanisms[15].mechanism_details
  collection_mechanisms[16]:
    receipts:
    - chunk: c018
      snippet: The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure
        data related to physical activity.
    core_path: collection_mechanisms[16]
  collection_mechanisms[16].mechanism_details:
    receipts:
    - chunk: c004
      snippet: Coordinators  provide  instructions  on how to use these monitoring
        devices continuously for 10 days
    - chunk: c007
      snippet: Garmin Vivosmart 5 for physical activity monitoring
    - chunk: c023
      snippet: The participants will wear the CGM and fitness tracker for 10 days.
    core_path: collection_mechanisms[16].mechanism_details
  collection_mechanisms[17]:
    receipts:
    - chunk: c018
      snippet: Participants will be sent home with an environmental sensor (a custom-designed
        sensor unit called the LeeLab Anura), which they will use for 10 continuous
        days before returning the devices to the clinical research coordinators for
        data download.
    core_path: collection_mechanisms[17]
  collection_mechanisms[17].mechanism_details:
    receipts:
    - chunk: c004
      snippet: (1)  home  environmental  sensor,  (2)  Garmin fitness  tracker
    - chunk: c007
      snippet: a custom-built environmental sensor for indoor environmental parameter
