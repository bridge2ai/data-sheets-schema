name: AI-READI dataset
description: 'The AI-READI dataset consists of data collected from individuals with and without
  Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data collection sites. This version
  contains data from 2280 participants that was collected between July 19, 2023 and May 01,
  2025. Data from multiple modalities are included: survey data, clinical data, retinal imaging
  data, environmental sensor data, continuous glucose monitor data, and wearable activity
  monitor data. The data in this dataset contain no protected health information (PHI); information
  related to the sex and race/ethnicity of the participants as well as medication used has
  also been removed. The dataset contains 356,343 files and is around 3.82 TB in size.'
source_caveats: '(1) Enrollment target: the FAIRhub study description gives an anticipated
  enrollment of 4000 and the BMJ Open protocol and Nature Metabolism comment also state 4,000;
  the IRB protocol states 4600 (and "4,600") in its objectives and background while its own
  subject-group table lists four groups of 1000. These are targets, not counts of this release,
  and no target is recorded as an instance count. (2) Grant number: the healthsheet writes
  "OT2ODO32644" where the FAIRhub dataset description, the study description, the README,
  NIH RePORTER and both publications write OT2OD032644; the latter form is recorded. (3) De-identification:
  the FAIRhub dataset description (ranked highest by the manifest) states that no identifiers
  were collected so no active de-identification was necessary, while the Nature Metabolism
  comment (ranked lower) states that the public set is stripped of PHI via the HIPAA Safe
  Harbor method; the higher-ranked statement is recorded and no de-identification method is
  asserted. (4) License label: the FAIRhub landing page labels the license "Health Data License"
  and the FAIRhub API metadata names it "AI-READI custom license v2.0"; both sources share
  the top rank, the API name is recorded in `license` and the page label is reported here.
  (5) The NIH RePORTER page (fiscal year 2022) lists the principal investigator''s organization
  as University of Washington, while the FAIRhub study description lists Aaron Lee''s affiliation
  as Washington University in St. Louis; the higher-ranked study description is recorded.
  (6) The BMJ Open protocol states that enrollment began on 18 July 2023; the FAIRhub metadata
  gives the data collection period as 2023-07-19 to 2025-05-01. These describe different events
  and the collection period is recorded from the FAIRhub metadata. (7) This record''s own
  computation: the nine data directories listed in the dataset structure description sum to
  356,334 files (4515 + 7 + 2232 + 7969 + 56478 + 173721 + 93921 + 15245 + 2246) and 3,815,969,360,064
  bytes (302931703 + 176182781 + 55625676514 + 1069466876718 + 1317625293027 + 1155908809724
  + 174381046406 + 38313536220 + 4169006971), against stated totals of 356,343 files and 3,815,969,779,678
  bytes; the differences are 9 files and 419,614 bytes. Nine root-level metadata files are
  listed without sizes. Neither figure was adjusted. (8) The healthsheet says the dataset
  contains data from all participants enrolled "during the first year of data collection",
  while the same healthsheet says this third version consists of data collected up through
  the end of the second year of the study. (9) The version 3 documentation page says v3.0
  "contains data from the participants of the pilot study phase", while the higher-ranked
  FAIRhub healthsheet says the third version includes data from the second year of the study;
  the healthsheet statement is followed. (10) Statements of absence in the healthsheet, not
  recorded as entries: no erratum is given; there are no limits on the retention of the data;
  there is currently no mechanism for others to extend or augment the dataset; a data protection
  impact analysis has not been conducted; the dataset has not yet been used for any tasks
  and no repository links papers or systems that use it; no labels are provided and no labeling
  was performed; the dataset has not undergone any formal external audits. (11) Principal
  investigators are taken from the FAIRhub study description, which lists each "Study Principal
  Investigator" with an ORCID and affiliation; the Nature Metabolism author list also has
  a "Principal Investigators" group, but its extracted text is interleaved and its membership
  was not used. (12) The two publications acknowledge NIH grants P30DK035816 and UL1TR003096
  and Research to Prevent Blindness as support for the research they report; the FAIRhub metadata
  names only OT2OD032644 as funding the creation of the dataset. (13) Figures for version
  2.0.0 (2.01 TB, 165,051 files) and the participant counts of versions 1 and 2 are facts
  about those versions and appear only under `version_access`. (14) `issued` carries the date
  the sources state for the dataset being made available on FAIRhub (2025-11-17); the time
  of day and UTC offset are required by the schema''s datetime format and are not stated by
  the sources.'
