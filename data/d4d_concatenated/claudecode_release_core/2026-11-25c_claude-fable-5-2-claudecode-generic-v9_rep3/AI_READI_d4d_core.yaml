purposes:
- response: The purpose for creating the dataset was to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights into type
    2 diabetes mellitus (T2DM), including salutogenic pathways to return to health.
tasks:
- response: The multi-modal dataset is being gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence.
addressing_gaps:
- response: Given the complexity of T2DM, AI-based approaches may help with improving understanding,
    but a key issue is the lack of data ready for training AI models. The AI-READI dataset
    is intended to fill this gap.
