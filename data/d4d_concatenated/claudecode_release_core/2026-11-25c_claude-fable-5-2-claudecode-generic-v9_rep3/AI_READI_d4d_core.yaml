    or privacy of any Data Subject, to attempt to identify or contact any Data Subject or
    group of Data Subjects, to extract or extrapolate any identifying information about a
    Data Subject, or to establish a Data Subject's membership in a particular group of persons.
- name: Conveying the data to non-licensees
  description: Licensees shall not transfer, license, sublicense, sell, assign, display, share
    or otherwise convey any portion of the Data or any derivative work to any third party
    other than another licensee bound by an agreement with the Licensor on identical terms.
- name: Sharing data with third-party model vendors for training
  description: Licensees shall not share or distribute Data with any third party model vendor
    or developer for training or development purposes.
- name: Reproducing data in publications
  description: Data may not be reproduced in papers, articles, presentations, analyses, reports
    or publications, except that small representative samples of Data may be reproduced in
    up to five images or figures per Paper for illustrative purposes only.
