    name: 'Bridge2AI: Salutogenesis Data Generation Project'
  - grant_number: P30DK035816
  - grant_number: UL1TR003096
- grantor: Research to Prevent Blindness
  source_caveats: Named only in the funding statement of the BMJ Open protocol paper, as support
    for the research that paper reports.
instances:
- instance_type: individual patient
  counts: 2280
  label: false
  description: Each instance consists of all of the data available for an individual participating
    in the study. Multiple modalities of data are collected for each participant, including
    survey data, clinical data, retinal imaging data, environmental sensor data, continuous
    glucose monitor data, and wearable activity monitor data. These encompass tabular data,
    imaging data, and physiological signal/waveform data. There is no unstructured text data
    included in this dataset.
anomalies:
- name: Survey data
  anomaly_details: In cases of survey data, skipped questions or incomplete responses are
    expected.
- name: Wearable data
  anomaly_details: In cases of using wearables, improper use and technical failure such as
    battery failure or system malfunction are expected.
- name: Imaging data
  anomaly_details: In cases of imaging data, patient uncooperation, noise that may obscure
    the images, technical failure such as system malfunction, and data transfer failures are
    expected.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers; therefore, there is selection bias known
    as volunteer bias which may limit the generalizability of the results among those who
    are not represented in the study population.
known_limitations:
- name: English-language requirement
  limitation_description: Requiring that eligible participants speak, read and understand
    English may have created challenges in recruiting Hispanic and/or Asian persons.
- name: Urban and hospital-based recruitment
  limitation_description: Factors influencing the generalization of derived models include
    the predominantly urban and hospital-based recruitment, which may not fully capture diverse
    cultural and socioeconomic backgrounds.
- name: Races/ethnicities not included
  limitation_type: representativeness_limitation
  limitation_description: The study cohort may not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific Islanders
    and Native Americans.
- name: Balanced distribution across groups may not have been achieved
  limitation_description: As enrollment is ongoing, the periodic updates to data releases
    may not have achieved balanced distribution across groups.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The dataset does not contain data that might be considered confidential.
    No personally identifiable information is included in the dataset.
content_warnings:
- content_warnings_present: false
subpopulations:
- name: Race/ethnicity, sex and diabetes status groups in the suggested split
  identification: 'Diabetes status groups are defined as: No DM, participants who do not have
    Type 1 or Type 2 Diabetes; Lifestyle, participants with pre-Type 2 Diabetes and those
    with Type 2 Diabetes whose blood sugar is controlled by lifestyle adjustments; Oral, participants
    with Type 2 Diabetes whose blood sugar is controlled by oral or injectable medications
    other than insulin; Insulin, participants with Type 2 Diabetes whose blood sugar is controlled
    by insulin.'
  distribution: 'Totals in the README suggested-split summary (2280 participants): race/ethnicity
    Hispanic 380, Asian 545, Black 519, White 836; sex Male 951, Female 1329; diabetes status
    No DM 776, Lifestyle 560, Oral 686, Insulin 258; mean age 60.8 ± 11.3 years.'
  source_caveats: The healthsheet answers "No" to whether the dataset identifies any demographic
    sub-populations, and states that sex, race, and ethnicity data are not being released
    with the public version of the dataset; the counts above are the summary table the README
    publishes for the suggested split.
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: The public dataset will not contain data that is considered sensitive.
    However, the controlled access dataset will contain data regarding racial and ethnic origins,
    location (5-digit zip code), as well as motor vehicle accident reports.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: The acquisition of data varied based on the domain; some data were
    directly observable (such as labs, vitals, and retinal imaging), whereas other data were
    reported by subjects (e.g. survey responses). Verification of data entry was performed
    when possible (e.g. cross-referencing entered medications with medications that were physically
    brought in or photographed by each study participant).
collection_mechanisms:
- name: REDCap questionnaires and clinical data entry
  mechanism_details: 'REDCap is used for collecting patient-reported data from questionnaires
    and the following clinical data from the visit: medications assessment, vitals, visual
    acuity, contrast sensitivity, monofilament test results and CBC test results.'
- name: 12-lead electrocardiogram
  mechanism_details: A 12-lead ECG is performed (Philips Pagewriter TC30 Cardiograph) while
    the participant sits in a reclining chair or lies supine.
- name: Montreal Cognitive Assessment (MoCA)
  mechanism_details: A general cognitive screener is carried out using the Montreal Cognitive
    Assessment (MoCA), administered electronically on an iPad using the MoCA Duo Application.
- name: Monofilament testing for peripheral neuropathy
  mechanism_details: The monofilament test is done using a standard 10g monofilament applying
    pressure to different points on the plantar surface of the feet.
- name: Visual acuity testing
  mechanism_details: Photopic letter visual acuity is measured with the Electronic Visual
    Acuity tester (M&S Technology); mesopic acuity is measured by the participant viewing
    the display through a 2.0 neutral density (ND) filter.
- name: Contrast sensitivity testing
  mechanism_details: Photopic letter contrast sensitivity is measured with the Mars chart
    (Mars Perceptrix); mesopic contrast sensitivity is assessed by viewing through the 2.0
    ND filter.
- name: Autorefraction
  mechanism_details: Autorefraction data for each eye are obtained using the autorefractor's
    standard protocol (Topcon KR 800).
- name: Blood and urine collection for laboratory testing
  mechanism_details: Blood (non-fasting) and urine samples are collected from participants
    during the visit. Clinical Laboratory Improvement Amendments-certified laboratories local
    to each data collection site perform complete blood count (CBC) testing on fresh whole
    blood samples; all other lab tests are performed by the University of Washington Nutrition
    and Obesity Research Center (NORC) testing facility using stored, frozen samples.
- name: Optomed Aurora undilated fundus photography
  mechanism_details: The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic
    images of the ocular fundus. Images taken during the AI-READI visit are undilated images
    taken in a dark room.
- name: iCare EIDON dilated fundus photography
  mechanism_details: 'The iCare EIDON is a widefield TrueColor confocal fundus imaging system.
    AI-READI images using EIDON include two main modalities: Single Field Central IR/FAF and
    Smart Horizontal Mosaic.'
- name: Heidelberg Spectralis HRA
  mechanism_details: 'The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that
    combines optical coherence tomography (OCT) with retinal angiography; imaging is done
    in a dark room using the following modalities: ONH-RC, PPole-H, and OCTA of the macula.'
- name: Topcon DRI OCT Triton
  mechanism_details: The DRI OCT Triton is a device from Topcon Healthcare that combines swept-source
    OCT technology with multimodal fundus imaging. Imaging is done in 12.0X12.0 mm and 6.0X6.0
    mm OCTA, and 3D Horizontal and Radial scan modes.
- name: Topcon Maestro2 3D OCT
  mechanism_details: The Maestro2 is a robotic OCT and color fundus camera system from Topcon
    Healthcare. Protocols include 12.0 mm X9.0 mm widefield, 6.0 mm X 6.0 mm 3D macula scan
    and 6.0 mm X 6.0 mm OCTA.
- name: Heidelberg FLIO
  mechanism_details: Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) imaging is done by
    an operator in a dark room and is performed as the last modality of an AI-READI visit.
- name: Zeiss Cirrus 5000 Angioplex
  mechanism_details: The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence
    tomography (OCT) system. Imaging protocols include 512 X 512 and 200 X 200 macula and
    ONH scans and also OCTA of the macula.
- name: Dexcom G6 continuous glucose monitor
  mechanism_details: The Dexcom G6 is a real-time, integrated continuous glucose monitoring
    system (iCGM) that directly monitors blood glucose levels without requiring finger sticks;
    it is used for post-visit data collection for 10 days.
- name: Garmin Vivosmart 5 fitness tracker
  mechanism_details: The Garmin Vivosmart 5 Fitness Activity tracker is used to measure data
    related to physical activity during the 10 days of post-visit data collection.
- name: LeeLab Anura environmental sensor
  mechanism_details: Participants are sent home with an environmental sensor (a custom-designed
    sensor unit called the LeeLab Anura), which they use for 10 continuous days before returning
    the devices to the clinical research coordinators for data download.
collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: For this version of the dataset, the timeframe for data collection was
    July 19, 2023 to May 01, 2025. The BMJ Open protocol states that preliminary pilot enrollment
    occurred between 18 July 2023 and 30 November 2023 and that the formal data collection
    process began on 1 December 2023.
data_collectors:
- role: Clinical research coordinator
  collector_details: All research personnel at the three data sites who recruited, enrolled
    and collected data underwent training by the data manager at UAB and a detailed Manual
    of Procedures (MOP). Successful completion of a certification process is required for
    all coordinators. Their effort was supported by the National Institutes of Health award
    OT2OD032644.
  description: Data collection sites are the University of Alabama at Birmingham (Birmingham,
    Alabama), the University of California, San Diego (San Diego, California) and the University
    of Washington (Seattle, Washington).
missing_data_documentation:
- missing_data_patterns: Not all modalities are available for all participants.
  missing_data_causes: Some participants elected not to participate in some study elements.
    In a few cases, the data collection device did not have any stored results or was returned
    too late to retrieve the results (e.g. battery died, data was lost). In a few cases, there
    may have been a data collision at some point in the process and data has been lost.
raw_data_sources:
- name: Electrocardiograph export
  source_description: Data from the ECG device are exported in their raw format to local storage.
  raw_data_format: .xml
- name: MoCA Duo application export
  source_description: Data from the MoCA Duo application (total score, section subscores,
    Memory Index Score and task completion times) are exported in their raw format to local
    storage.
  raw_data_format: .csv
sampling_strategies:
- name: Participant recruitment
  is_random: false
  is_representative: false
  why_not_representative: Building balanced data sets is critical for the development of unbiased
    machine learning models, so rather than targeting the demographic distribution of the
    US population, the study is triple-balanced by recruiting in equal proportions four race/ethnic
    groups (Asian, Black, White, Hispanic), four categories of T2DM (no diabetes, pre-diabetes
    or lifestyle-controlled diabetes, diabetes treated with oral or non-insulin injectable
    medications, and insulin-controlled diabetes) and biological males and females.
  source_data: The study base is all patients aged 40 years or older who had a medical encounter
    within each health system site (UAB, UCSD, UW) between 2020 and 2025; recruitment pools
    were identified by screening electronic health records for diabetes and prediabetes ICD-10
    codes.
  strategies: Non-probability sample. Participants are recruited in waves; the composition
    of participants is monitored and will be adjusted by under- and oversampling groups as
    needed. Recruitment sampling procedures were aimed at achieving approximately equal distribution
    of participants across diabetes severity.
  description: 'Eligibility criteria: able to provide consent, 40 years old or older, persons
    with or without type 2 diabetes, must speak and read English; excluded are adults older
    than 85 years of age, pregnancy, gestational diabetes and Type 1 diabetes. The healthsheet
    states that the dataset contains all possible instances and that no data were excluded
    from the dataset at the time of preprocessing.'
raw_sources:
- raw_data_details: The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project but is not anticipated to be shared outside the
    project team right now, because it has not been mapped to standardized terminologies and
    because the raw data may accidentally include personal health information or personally
    identifiable information. There is a possibility that raw data may be included in future
    releases of the controlled access dataset.
preprocessing_strategies:
- name: Mapping to standardized terminologies
  preprocessing_details: Once data were sent from each of the study sites to the central project
    team, all data were mapped to standardized terminologies when possible, such as the Observational
    Medical Outcomes Partnership (OMOP) Common Data Model and the Digital Imaging and Communications
    in Medicine (DICOM) standard.
- name: Conversion of retinal images to DICOM
  preprocessing_details: All participant images are exported from imaging devices in their
    raw format and some images required conversion to a DICOM standard format prior to upload.
cleaning_strategies:
- name: Quality control at data entry and acquisition
  cleaning_details: Clinical data outside of expected min/max ranges were flagged in REDCap,
    which was visible in reports viewed by clinical research coordinators (CRCs) and Data
    Managers. Data were checked for credibility based on range checks, incorrect flow through
    prescribed skip patterns, missing data that can be directly filled from other portions
    of an individual's record, and the omission and/or duplication of records, and edited
    if errors were detected. Editing was only done under the guidance and approval of the
    site PI.
- name: Site data manager quality control before upload
  cleaning_details: The Data Manager at each data site is responsible for the quality control
    of all data before uploading to FAIRhub.
future_use_impacts:
