title: Cell Maps for Artificial Intelligence (CM4AI)
id: https://cm4ai.org/
name: CM4AI
description: 'CM4AI is the dataset produced by the Cell Maps for Artificial Intelligence (CM4AI)
  data generation project, the Functional Genomics Grand Challenge in the NIH Bridge2AI program.
  The project states that it will deliver machine-readable hierarchical maps of cell architecture
  as AI-ready data, together with quarterly data releases of map-input data streams. The data
  are multimodal: protein-protein interaction (PPI), spatial localization, and genetic perturbation
  data in MDA-MB-468 breast cancer cells (with and without paclitaxel or vorinostat) and in
  induced pluripotent stem cells (iPSCs, with and without differentiation). The current release,
  the June 2026 Data Release (Beta), includes perturb-seq data for MDA-MB-468 breast cancer
  cells with and without treatment and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS
  data for MDA-MB-468 breast cancer cells with and without treatment, undifferentiated KOLF2.1J
  iPSCs, and iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS
  data for treated MDA-MB-468 breast cancer cells; and immunofluorescence (IF) images of MDA-MB-468
  breast cancer cells with and without treatment. Computed cell maps are not included in the
  current release. The releases are deposited in the University of Virginia Dataverse and
  are recorded under resources. The project website reports, as project-wide figures, 7,023
  total proteins investigated and a data volume of 21.4 TB. CM4AI is a collaboration of UCSD,
  UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University, and the Hastings
  Center. The Dataverse record of the current release names Ideker Trey (University of California
  San Diego) as its Point of Contact and directs contact through the repository''s email button.'
source_caveats: The referent of this record is the CM4AI dataset as a series of data releases;
  facts about the current state of the dataset are taken from the June 2026 release record,
  and each release is described under resources. The author roster in creators is the one
  the June 2026 release record lists; the citation lines of the March 2025, June 2025 and
  October 2025 releases carry the same 47 names. For five authors the June 2026 release record
  gives the affiliation only as the identifier ROR:0153tk833, where the three earlier release
  records give University of Virginia for the same authors; the identifier is recorded as
  stated and no name is attached to it. All four release pages state Data Creation Date 2025-02-27
  and Deposit Date 2025-02-27; the creation date is recorded only for the March 2025 release,
  the earliest of the four, because the later pages repeat the same date for releases published
  months afterward. The collaborating institutions in the description are the list on the
  project website's data release page; the March 2025 release record gives the same list without
  UT Austin, and the two lists are not treated as a conflict. The Nature article in the bundle
  reports a U2OS cell map and its own data deposits; no value in this record's own slots is
  taken from its results, methods or data availability statements.
