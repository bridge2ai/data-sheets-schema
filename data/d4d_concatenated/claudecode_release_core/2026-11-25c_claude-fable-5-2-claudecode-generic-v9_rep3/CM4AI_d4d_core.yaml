known_biases:
- bias_description: Data in the current release was derived from commercially available de-identified
    human cell lines.
- bias_description: Does not represent all biological variants which may be seen in the population
    at large.
known_limitations:
- limitation_description: The current release is an interim release; the data are not yet
    in completed final form.
- limitation_description: The current release does not contain predicted cell maps; the release
    states that these will be added in future releases.
- limitation_description: The current release is most suitable for bioinformatics analysis
    of the individual datasets.
- limitation_description: Requires domain expertise for meaningful analysis.
- limitation_description: The protein-protein interaction (SEC-MS), protein localization (IF
    imaging), and CRISPRi perturb-seq data interrogate sets of proteins which incompletely
    overlap.
- limitation_description: Some datasets are under temporary pre-publication embargo.
collection_mechanisms:
- name: Size exclusion chromatography-mass spectroscopy (SEC-MS)
  mechanism_details: The October 2025 release describes its SEC-MS files as generated by size
    exclusion chromatography-mass spectroscopy on undifferentiated KOLF2.1J human induced
    pluripotent stem cells, and following the treatment of vorinostat or paclitaxel on MDA-MB468
    human breast cancer cells, in the Nevan Krogan laboratory at the University of California
    San Francisco.
- name: Immunofluorescence-based staining (ICC-IF) and confocal microscopy
  mechanism_details: The October 2025 release describes its image files as showing the spatial
    localization of proteins of interest in MDA-MB-468 cells as imaged by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford University.
    Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and antibody
    against protein of interest (green channel).
- name: CRISPRi perturb-seq
  mechanism_details: The October 2025 release describes its perturb-seq files as an expressed
    genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced pluripotent stem
    cells mapping transcriptional and fitness phenotypes associated with 11,739 targeted genes,
    with raw sequence data in a separate file.
- name: Affinity purification-mass spectrometry (AP-MS)
  mechanism_details: The June 2026 release lists AP-MS data for MDA-MB-468 breast cancer cells
    with treatment. The May 2024 preprint states that the project employed AP-MS on endogenously
    tagged cell lines to map protein-protein interactions.
data_collectors:
- name: Nevan Krogan laboratory at the University of California San Francisco
  collector_details: Generated the SEC-MS data, according to the October 2025 release file
    descriptions.
- name: Lundberg Lab at Stanford University
  collector_details: Performed the immunofluorescence staining and confocal microscopy imaging,
    according to the October 2025 release file descriptions.
intended_uses:
- description: AI-ready datasets to support research in functional genomics
- description: AI model training
- description: Cellular process analysis
- description: Cell architectural changes and interactions in presence of specific disease
