  description:
    receipts:
    - chunk: c015
      snippet: Total Proteins Investigated 7,023
    - chunk: c015
      snippet: Data volume 21.4 TB
    - chunk: c016
      snippet: will deliver machine-readable hierarchical maps of cell architecture
        as AI-ready data, together with quarterly data releases of map-input data
        streams
    - chunk: c016
      snippet: CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin,
        UA Birmingham, Simon Fraser University, and the Hastings Center, as part of
        the NIH Bridge2AI program
    - chunk: c026
      snippet: This dataset is the June 2026 Data Release of Cell Maps for Artificial
        Intelligence (CM4AI; CM4AI.org), the Functional Genomics Grand Challenge in
        the NIH Bridge2AI program. CM4AI is generating multi-modal data including
        protein-protein interaction (PPI), spatial localization, and genetic perturbation
        data in MDA-MB-468 breast cancer cells (+/- paclitaxel or vorinostat) and
        iPSCs (+/- differentiation).
    - chunk: c026
      snippet: Perturb-seq data for MDA-MB-468 breast cancer cells +/- treatment and
        undifferentiated (parental) KOLF2.1J iPSCs SEC-MS data for MDA-MB-468 breast
        cancer cells +/- treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived
        neuron progenitor cells (NPCs), neurons, and cardiomyocytes AP-MS data for
        MDA-MB-468 breast cancer cells + treatment IF images in MDA-MB-468 breast
        cancer cells +/- treatment
    - chunk: c026
      snippet: Computed cell maps not included in this release
    - chunk: c026
      snippet: University of Virginia Dataverse, V2
    - chunk: c027
      snippet: Point of Contact Use email button above to contact. Ideker Trey (University
        of California San Diego)
    core_path: description
