  collection_mechanisms[0]:
    receipts:
    - chunk: c023
      snippet: This dataset was generated by size exclusion chromatography-mass spectroscopy
        (SEC-MS) on undifferentiated KOLF2.1J human induced pluripotent stem cells
        (hiPSCs), in the Nevan Krogan laboratory at the University of California San
        Francisco.
    core_path: collection_mechanisms[0]
  collection_mechanisms[0].mechanism_details:
    receipts:
    - chunk: c023
      snippet: This dataset was generated by size exclusion chromatography-mass spectroscopy
        (SEC-MS) following the treatment of vorinostat or paclitaxel on MDA-MB468
        human breast cancer cells, in the Nevan Krogan laboratory at the University
        of California San Francisco.
    core_path: collection_mechanisms[0].mechanism_details
  collection_mechanisms[1]:
    receipts:
    - chunk: c023
      snippet: as imaged by immunofluorescence-based staining (ICC-IF) and confocal
        microscopy in the Lundberg Lab at Stanford University, as part of the Cell
        Maps for Artificial Intelligence (CM4AI; CM4AI.org) project. Nuclei were stained
        with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody
        (yellow channel); microtubules with tubulin antibody (red channel); and antibody
        against protein of interest (green channel).
    core_path: collection_mechanisms[1]
  collection_mechanisms[2]:
    receipts:
    - chunk: c023
      snippet: This dataset represents an expressed genome-scale CRISPRi Perturbation
        Cell Atlas in KOLF2.1J human induced pluripotent stem cells (hiPSCs) mapping
        transcriptional and fitness phenotypes associated with 11,739 targeted genes.
    core_path: collection_mechanisms[2]
  collection_mechanisms[2].mechanism_details:
    receipts:
    - chunk: c023
