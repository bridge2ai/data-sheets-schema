page: https://chorus4ai.org/
title: CHoRUS Dataset
id: https://chorus4ai.org/
name: CHoRUS
description: CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards for
  Equitable AI) is a multi-modal clinical care dataset generated by the CHoRUS project, one
  of four data generation projects in the NIH-funded Bridge2AI consortium. The project website
  describes the CHoRUS project as the collection of multi-modal data across 14 different hospitals,
  using ongoing and new standardization practices, with tools created to support a cloud enclave.
  The website's dataset snapshot reports, for the current released dataset, 50,000 patient
  admissions from ICU, PICU, and NICU, 1.6 billion rows of EHR OMOP data, 7,642 admissions
  with radiology data, and 23 Tb of waveform data; for the anticipated final dataset it reports
  100,000 patient admissions, 9 different data modalities, 14 data contributing hospitals,
  and 60+ CHoRUS consortium members across 20 different institutions. A September 2025 training-program
  webinar describes the dataset as multicenter, multimodal and high-resolution, collected
  retrospectively and under controlled access, with OMOP and telemetry data held in an enclave,
  clinical notes stored locally except tokens, 1000 images available at that time, and EEG
  extraction in process at that time. The chorus-ai GitHub organization overview, captured
  on November 14, 2025, states that the collaboration spans 20 academic centers, of which
  14 will contribute as Data Acquisition centers.
notes: 'Contacts stated in the sources: the project website lists "Ciera McCrary, MGH, Program
  Manager" under Contact Us, with the address cmccrary@mgh.havard.edu. The chorus-ai GitHub
  README lists "Request access: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org" under
  Contact, and invites those interested in getting involved in downstream analytics on the
  mapped and assembled dataset to reach out using those contact details.'
source_caveats: 'The record draws on four sources: the project website (ranked highest by
  the source manifest), the NIH RePORTER page for project OT2OD032701 (fiscal year 2022, whose
  abstract is written in the future tense), a September 2025 AIM-AHEAD training-program webinar,
  and a November 14, 2025 capture of the chorus-ai GitHub organization overview (ranked lowest,
  as historical documentation). When captured, the project website carried the banner "This
  repoitory is under review for potential modification in compliance with Administration directives."
  The GitHub README states "This project is licensed under the MIT License"; that statement
  concerns the GitHub project, and the bundle states no license for the dataset, so no license
  is recorded. The webinar''s data-type table survives only as flattened text: its "Access
  control", "Metadata" and "Published metadata schema" cells, and four of the five OMOP data-standard
  cells, cannot be attributed to individual data types, so those mappings are not recorded;
  data standards are stated per data type only where the text places them together. The website''s
  contact address is transcribed as the site spells it. Keywords are a selection from the
  "Preferred terms" line of the NIH RePORTER page, which describes the funded project.'
