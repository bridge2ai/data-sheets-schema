purposes:
- response: To generate data for ML/AI applications aimed at characterizing acute and critical
    care illness, predicting complications, and measuring treatment response among patients
    with acute or critical illness.
- response: To develop a publicly available, AI-ready critical care dataset while ensuring
    the methods promote privacy, accountability, and clinical benefit; this is stated as the
    project's overarching goal.
- response: To develop the most diverse, high-resolution, ethically sourced, AI-ready data
    set to answer the grand challenge of improving recovery from acute illness; this is stated
    as the goal of the CHoRUS Network.
tasks:
- response: Characterizing acute and critical care illness.
- response: Predicting complications among patients with acute or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
addressing_gaps:
- response: The NIH project abstract states an urgent need for infrastructure to support artificial
    intelligence and machine learning (AI/ML) in critical care, and describes developing high-resolution
    multi-center data sets as a critical first step toward actionable and trustworthy AI.
