instances:
- instance_type: Patient admission
  counts: 50000
  description: The project website's dataset snapshot reports 50,000 patient admissions from
    ICU, PICU, and NICU in the current released dataset, and 100,000 patient admissions for
    the anticipated final dataset. A September 2025 webinar states that, as of August 2025,
    the dataset covers 14 different hospitals with over 45K unique admissions.
  source_caveats: The website snapshot is undated, and the webinar figure is a lower bound
    as of August 2025; the two are compatible observations and both are retained. The count
    recorded here is the website's figure for the current released dataset. The fiscal year
    2022 NIH project abstract separately states an aim of an AI-ready data set from more than
    100,000 critically ill patients, which counts patients, not admissions.
- instance_type: Demographics
  data_topic: B2AI_TOPIC:6
  description: Listed in the webinar's data-type table with OMOP as its data standard.
- instance_type: Medication administration
  description: Dosing time-stamped upon each infusion change or dose administration.
- instance_type: Procedures
  description: Documentation by providers.
- instance_type: Nursing flowsheets
  description: High-frequency documentation.
- instance_type: Diagnoses
  description: Documentation by providers.
- instance_type: Clinical notes
  description: Extracted and tokenized using the OHNLP toolkit. The September 2025 webinar
    states that clinical notes are stored locally, except tokens.
- instance_type: Imaging
  data_topic: B2AI_TOPIC:15
  data_substrate: B2AI_SUBSTRATE:11
  description: Imaging from PACS, listed with DICOM as its data standard. The September 2025
    webinar states that 1000 images were available at that time, with de-identification in
    process for a larger cohort. The project website reports 7,642 admissions with radiology
    data in the current released dataset.
  source_caveats: The webinar counts images and the website counts admissions with radiology
    data, at times that may differ; no count is recorded for this entry.
- instance_type: Waveform telemetry
  data_topic: B2AI_TOPIC:37
  data_substrate: B2AI_SUBSTRATE:49
  description: Waveform telemetry from bedside monitors and gateway/middleware, listed with
    WFDB as its data standard.
- instance_type: Waveform EEG
  data_topic: B2AI_TOPIC:37
  data_substrate: B2AI_SUBSTRATE:49
  description: Waveform EEG from a hospital database, listed with EDF+ and Persyst as its
    data standards. The September 2025 webinar states that EEG extraction was in process at
    that point.
acquisition_methods:
- acquisition_details: Retrospective data collection. Data contributing sites create and curate
    a CHoRUS-specific clinical data extract, and standard operating protocols (SOPs) instruct
    those sites about best practices for curating and delivering interoperable datasets.
sampling_strategies:
- description: 'Planned: the fiscal year 2022 NIH project abstract states that the project
    will establish a legal framework for collecting data at scale, sampling to ensure comprehensive
    sets of patient conditions and clinical treatment strategies. The chorus-ai GitHub overview
    states that federated access will enable sampling methods to ensure a balanced and diverse
    cohort.'
  source_caveats: Both statements are written in the future tense; the bundle does not state
    what sampling was applied to the current released dataset.
preprocessing_strategies:
- preprocessing_details: Clinical notes are extracted and tokenized using the OHNLP toolkit.
  used_software:
  - id: https://chorus4ai.org/#software-ohnlp-toolkit
    name: OHNLP toolkit
- preprocessing_details: 'Semantic mapping: the chorus-ai GitHub organization provides validated
    semantic mappings for connecting clinical data in various source formats to international
    standards, and its chorus-mapping repository holds documentation and pooled tabular mappings,
    with an associated clinical validation SOP for contributing to mapping efforts. The README
    refers to the result as the mapped and assembled dataset.'
labeling_strategies:
- description: 'Planned: the chorus-ai GitHub overview states that a visualization and annotation
    environment will label data with targets important for prediction.'
  source_caveats: Stated in the future tense; the bundle does not state that labels are present
    in the current released dataset.
existing_uses:
- name: Training activities
  description: The September 2025 webinar states that the datasets are being used for training
    activities.
  examples:
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI
    CHoRUS data through engagement, AI training, and mentorship.
  - The webinar announces that trainees will receive hands-on training on the Bridge2AI AI/ML
    for Clinical Care Network and leverage the data and tools to create practical use cases.
- name: Publications
  description: The September 2025 webinar states that the datasets are being used for publications.
intended_uses:
- description: Building machine-learning (ML) and artificial intelligence (AI)-derived models
    to improve the care and outcomes of patients requiring critical care.
- description: External validation of models against a holdout test set, to aid marketplace
    adoption of AI-developed models for implementation in acute and critical care; the holdout
    test set is stated as a plan.
- description: Hands-on training using the CHoRUS dataset; the project website describes this
    as supporting "the development of transnational AI in clinical care".
license_and_use_terms:
  license_terms: Participants in the AIM-AHEAD Bridge2AI for Clinical Care Training Program
    must sign a licensing agreement, included in the program's registration form, before gaining
    access to the dataset.
  source_caveats: This requirement is stated for one training program's participants; the
    bundle does not state the license or use terms that apply to other users.
data_governance:
  description: The dataset is under controlled access; OMOP and telemetry data are held in
    an enclave.
  access_review_process: 'For participants in the AIM-AHEAD Bridge2AI for Clinical Care Training
    Program: participants fill out a registration form with name, email, and institution;
    once access is granted and compute is provisioned, an email is sent. A ".edu" email address
    is needed to gain access to the dataset, and program administrators assist with this access
    if needed.'
  source_caveats: These steps are described in a webinar addressed to one training program's
    applicants; the bundle does not describe the access process for other requesters or name
    the body that decides on access.
is_deidentified:
  deidentification_details: The fiscal year 2022 NIH project abstract states a plan to transform
    data using approaches that limit re-identification. The September 2025 webinar states
    that de-identification of imaging was in process for a larger cohort.
  source_caveats: Both statements describe planned or in-progress work; the bundle does not
    state the de-identification status of the current released dataset, so no presence value
    and no method are recorded.
