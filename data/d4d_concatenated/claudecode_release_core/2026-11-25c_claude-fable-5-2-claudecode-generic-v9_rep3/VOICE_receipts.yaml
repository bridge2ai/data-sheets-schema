slots:
  acquisition_methods[0].acquisition_details:
    receipts:
    - chunk: c007
      snippet: Clinical validation is performed by a qualified physician or practitioner
        based on established gold standards for diagnosis
    - chunk: c009
      snippet: Clinical diagnoses were verified by clinicians reviewing audio and/or
        imaging data, looking at electronic health records, or medication prescriptions
    - chunk: c009
      snippet: 'In which countries was the data collected?

        USA and Canada'
    - chunk: c009
      snippet: There are five recording sites included in the dataset
    core_path: acquisition_methods[0].acquisition_details
  acquisition_methods[0].was_directly_observed:
    receipts:
    - chunk: c009
      snippet: The data was directly observable and reported by subjects
    core_path: acquisition_methods[0].was_directly_observed
  acquisition_methods[0].was_reported_by_subjects:
    receipts:
    - chunk: c009
      snippet: The data was directly observable and reported by subjects
    core_path: acquisition_methods[0].was_reported_by_subjects
  acquisition_methods[0].was_validated_verified:
    receipts:
    - chunk: c009
      snippet: Clinical diagnoses were verified by clinicians reviewing audio and/or
        imaging data, looking at electronic health records, or medication prescriptions
    core_path: acquisition_methods[0].was_validated_verified
  addressing_gaps[0].response:
    receipts:
    - chunk: c008
      snippet: created to address a gap in the availability of large-scale, diverse,
        and well-documented voice data for use in clinical machine-learning applications
    core_path: addressing_gaps[0].response
  anomalies[0].anomaly_details:
    receipts:
    - chunk: c008
      snippet: different sites have different collection configurations. The collection
        protocol changed over the course of the study
    core_path: anomalies[0].anomaly_details
  anomalies[1].anomaly_details:
    receipts:
    - chunk: c009
      snippet: Noise artifacts, variations in diagnostic practices, inaccurate questionnaire
        responses, underreporting
    core_path: anomalies[1].anomaly_details
  anomalies[2].anomaly_details:
    receipts:
    - chunk: c019
      snippet: there may be more than one row per participant in the data files
    - chunk: c019
      snippet: there is no requirement the participant provide the same response for
        each visit. As a result, participant information for the same data element
        may vary across the data file
    core_path: anomalies[2].anomaly_details
  citation:
    receipts:
    - chunk: c018
      snippet: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked
        to health information (version 3.1.0)'
    core_path: citation
  cleaning_strategies[0].cleaning_details:
    receipts:
    - chunk: c009
      snippet: 'Generate missingness tables

        Check distributions and outliers

        For categorical responses, check against schema'
    core_path: cleaning_strategies[0].cleaning_details
  cleaning_strategies[1].cleaning_details:
    receipts:
    - chunk: c009
      snippet: Raw audio transcripts were reviewed, and any audio recordings that
        contained potentially identifying information and external voices were removed
        from the release
    core_path: cleaning_strategies[1].cleaning_details
  collection_consents[0].consent_details:
    receipts:
    - chunk: c009
      snippet: all participants have been duly informed and agreed to the collection
        and the use of their data via prospective informed consent
    - chunk: c018
      snippet: patient consent was sought for the data collection initiative and to
        share the acquired research data
    core_path: collection_consents[0].consent_details
  collection_mechanisms[0]:
    receipts:
    - chunk: c018
      snippet: This protocol involved the collection of demographic information, health
        questionnaires, targeted questionnaires inquiring about known confounders
        for voice, disease specific information, and voice recording tasks such as
        sustained phonation of a vowel sound
    core_path: collection_mechanisms[0]
  collection_mechanisms[0].mechanism_details:
    receipts:
    - chunk: c002
      snippet: A novel smartphone application, the Bridge2AI-Voice app, was created
        to collect standardized recordings of acoustic tasks, validated patient questionnaires,
        and validated patient reported outcomes
    - chunk: c007
      snippet: Voice samples are collected prospectively using a custom software application
        (the Bridge2AI-Voice App) with the Bridge2AI-Voice protocols
    - chunk: c007
      snippet: A total of 22 acoustic tasks are recorded through the app
    - chunk: c011
      snippet: HVEC and remote data collection occur through two platforms, the Bridge2AI
        Voice Web app and the Bridge2AI Voice iOS app
    - chunk: c018
      snippet: Data collection was conducted using a custom application on a tablet
        with a headset used for data collection when possible
    core_path: collection_mechanisms[0].mechanism_details
  collection_mechanisms[1]:
    receipts:
    - chunk: c008
      snippet: Data is collected on iPads (9th or 10th generation), iPad Air (5th
        generation) using an Avid AE-36 microphone and an Apple dongle to connect
        it to the iPad
    core_path: collection_mechanisms[1]
  collection_mechanisms[1].mechanism_details:
    receipts:
    - chunk: c009
      snippet: The data were recorded with a head-mounted headset with a microphone
        that could be at slightly different distances
    core_path: collection_mechanisms[1].mechanism_details
  collection_notifications[0].notification_details:
    receipts:
    - chunk: c009
      snippet: Yes, participants went through an IRB-approved consent process
    core_path: collection_notifications[0].notification_details
  collection_timeframes[0].timeframe_details:
    receipts:
    - chunk: c009
      snippet: The data was collected over a period of 12 months
    core_path: collection_timeframes[0].timeframe_details
  conforms_to:
