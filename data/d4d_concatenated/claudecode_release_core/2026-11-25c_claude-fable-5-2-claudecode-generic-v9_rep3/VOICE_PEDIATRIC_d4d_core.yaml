distributions:
- description: Derived audio data features. Binary files are made available as Parquet; each
    element contains the participant identifier, the recording session identifier, the task
    performed, the number of time frames associated with the feature, and the tensor data
    for the feature. Each file is associated with a JSON data dictionary file with the same
    file stem, whose keys are the column names of the data file.
  id: doi:10.13026/h995-bt35#features
  name: features
  path: features
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT (n=23533).
  id: doi:10.13026/h995-bt35#features-torchaudio_spectrograms.parquet
  name: torchaudio_spectrograms.parquet
- description: Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms
    hop length, a 400-point FFT and 60 Mel bins (n=23533).
  id: doi:10.13026/h995-bt35#features-torchaudio_mel_spectrograms.parquet
  name: torchaudio_mel_spectrograms.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters
    as the Mel spectrograms (n=23533).
  id: doi:10.13026/h995-bt35#features-torchaudio_mfcc.parquet
  name: torchaudio_mfcc.parquet
- description: Detected pitch (fundamental frequency) over time, of dimension T, with a min
    and max pitch of 80 and 500 respectively (n=23533).
  id: doi:10.13026/h995-bt35#features-torchaudio_pitch.parquet
  name: torchaudio_pitch.parquet
- description: 'Estimated electromagnetic articulography (EMA) using a deep learning model,
    with dimensions Tx12 where the 12 correspond to X/Y positions of six articulators: tongue
    dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip (n=23532).'
  id: doi:10.13026/h995-bt35#features-sparc_ema.parquet
  name: sparc_ema.parquet
- description: Estimated loudness based on the average absolute amplitude of the audio waveform,
    of size T, using 20ms windows (n=23532).
  id: doi:10.13026/h995-bt35#features-sparc_loudness.parquet
  name: sparc_loudness.parquet
- description: Estimated periodicity (confidence of pitch presence) derived from the audio
    using 20ms windows, of dimension T (n=23532).
  id: doi:10.13026/h995-bt35#features-sparc_periodicity.parquet
  name: sparc_periodicity.parquet
- description: Estimated fundamental frequency (F0) of the audio signal, described as using
    a different algorithm than the pitch feature listed before it, with a range of 50-550Hz
    and dimension T (n=23532).
  id: doi:10.13026/h995-bt35#features-sparc_pitch.parquet
  name: sparc_pitch.parquet
- description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a
    dimension of 40xT with a frame rate of 100Hz (n=23533).
  id: doi:10.13026/h995-bt35#features-ppgs.parquet
  name: ppgs.parquet
- description: Plain-text file of features derived from openSMILE, Praat, parselmouth and
    torchaudio.
  format: TSV
  id: doi:10.13026/h995-bt35#features-static_features.tsv
  media_type: text/tab-separated-values
  name: static_features.tsv
- description: Metrics related to audio quality derived from the recordings.
  format: TSV
  id: doi:10.13026/h995-bt35#features-audio_quality_metrics.tsv
  media_type: text/tab-separated-values
  name: audio_quality_metrics.tsv
- description: Phenotypic information acquired during data collection.
  id: doi:10.13026/h995-bt35#phenotype
  name: phenotype
  path: phenotype
- description: Phenotype file named in the Usage Notes example, read as tab-separated values
    with a header row.
  format: TSV
  id: doi:10.13026/h995-bt35#phenotype-demographics.tsv
  media_type: text/tab-separated-values
  name: demographics.tsv
- description: Metadata information for the recordings.
  id: doi:10.13026/h995-bt35#metadata
  name: metadata
  path: metadata
purposes:
- response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset
    to enable future research in artificial intelligence and support critical insights into
    the use of voice as a biomarker of health.
- response: The primary objective stated in the Bridge2AI Voice Data Acquisition protocol
    is to build a large multi-institutional database of human voices, speech and respiratory
    sounds that is ethically sourced, diverse, and linked to multimodal health biomarkers
    to fuel voice AI research.
- response: Establishing a robust multi-institutional dataset that integrates pediatric voice
    data with demographic information would advance the understanding of voice and disease
    as well as early detection and intervention.
tasks:
- name: Diagnosis of age-specific speech delays and disorders
  response: The data acquisition protocol states that, because voice and speech vary with
    the development of a child, creating a voice database of a "normal cohort" of different
    age groups will be key to help machine learning models diagnose age-specific speech delays
    and disorders.
addressing_gaps:
- response: The availability of large-scale pediatric datasets is limited; privacy issues,
    consent processes and the need for developmentally appropriate tasks have contributed
    to the lack of available pediatric data sets that enable machine learning for pediatric
    voice analysis.
- response: Pediatric and adult voice and speech production are fundamentally different, so
    evidence and normative data available for adults cannot be generalized to pediatric populations.
- response: The data acquisition protocol notes that the literature is sparser in terms of
    pediatric voice and speech analysis, partly due to ethical concerns and challenges in
    data acquisition for this cohort.
