ethical_reviews:
- reviewing_organization: Research Ethics Board at the Hospital for Sick Children
  review_details: Data collection and sharing was approved by the Research Ethics Board at
    the Hospital for Sick Children. The Bridge2AI Voice Data Acquisition protocol states that
    the Canadian institutions (MSH, SickKids and UofT) do not abide to the single IRB process
    and will apply for a separate research ethics board application to comply with the Canadian
    regulations.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - Data collection and sharing was approved by the Research Ethics Board at the Hospital
    for Sick Children.
  ethics_review_board: Research Ethics Board at the Hospital for Sick Children
  special_populations:
  - Children; participants were 2 to 18 years of age.
informed_consent:
- consent_obtained: true
  consent_type: Parental or participant consent
  consent_scope: Data collection and data sharing.
at_risk_populations:
  at_risk_groups_included: true
  special_protections:
  - The Bridge2AI Voice Data Acquisition protocol states that pediatric patients will be enrolled
    only through the pediatric sites and not at USF, and that data collection for pediatric
    cohorts will only be performed at the pediatric participating institutions.
  - The protocol states that Checklist HRP-416 for children under 21 has been completed and
    is appended to the protocol.
  assent_procedures: The Bridge2AI Voice Data Acquisition protocol states that children will
    provide verbal assent where appropriate; where young children cannot reasonably be asked
    to assent, due to limitations in understanding due to age and development, they will not
    be asked to do so, which typically holds for children under seven years of age; and that
    assent will be documented.
  guardian_consent:
  - Parental or participant consent was obtained prior to data collection and data sharing.
  - The Bridge2AI Voice Data Acquisition protocol states that when children participate in
    the research, parents or guardians will provide consent, and that parental permission
    will be obtained from one or both parents because the research is minimal risk and does
    not require permission from both parents or legal guardians.
  source_caveats: The protocol passages are the stated intentions of the University of South
    Florida protocol of the Bridge2AI Voice Data Acquisition study, written in the future
    tense; the pediatric data were collected at the Hospital for Sick Children under its own
    research ethics board approval.
license_and_use_terms:
  license_terms: Files are licensed under the Bridge2AI Voice Registered Access License, and
    the data use agreement is the Bridge2AI Voice Registered Access Agreement. Only credentialed
    users who sign the DUA can access the files; no training is required.
data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: 'Registered access to the feature data: the PhysioNet files are a
    restricted-access resource, and a user must be a credentialed PhysioNet user and sign
    the data use agreement for the project. The Bridge2AI-Voice documentation describes the
    same route as registering on PhysioNet and confirming identity, then signing the Bridge2AI-Voice
    Registered Access Agreement. Controlled access to raw audio: the PhysioNet page states
    that it requires institutional sign off and directs requests to the access committee at
    DACO@b2ai-voice.org; the documentation lists the steps as completing the Data Access Request
    Form (DARF), completing the Data Use Agreement (DUA), submitting the application to the
    Data Access Compliance Office for review and, upon approval, having a Data Use and Transfer
    Agreement (DTUA) signed by an authorized official at the requesting institution.'
  source_caveats: The controlled-access steps come from the "Accessing the Dataset" section
    of the Bridge2AI-Voice documentation, which describes the feature-only and raw audio datasets
    of the consortium generally and does not name the pediatric dataset in that section; the
    same documentation states that audio data from any Bridge2AI-Voice dataset is requested
    by email.
