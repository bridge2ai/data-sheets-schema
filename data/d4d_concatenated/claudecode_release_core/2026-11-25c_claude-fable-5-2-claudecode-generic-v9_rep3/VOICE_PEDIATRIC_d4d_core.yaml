- name: Parquet
  format: Parquet
  description: Binary files are made available as Parquet, an open-source column-oriented
    data file format.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- name: Tab-separated values
  media_type: text/tab-separated-values
  description: Phenotype data and the static feature and audio quality metric files are plain-text
    tab-delimited files.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- name: JSON data dictionaries
  media_type: application/json
  description: Each data file is associated with a data dictionary file with the same file
    stem and a JSON suffix, a dictionary whose keys are the column names of the associated
    data file and whose values give further detail, including a one-sentence description of
    the column.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
distribution_dates:
- release_dates:
  - '2025-12-17'
  - '2026-05-01'
  description: Version 1.0.0 was released on Dec. 17, 2025 and version 1.1.0 on May 1, 2026.
version_access:
  latest_version_doi: doi:10.13026/mf9s-5r03
  versions_available:
  - '1.0.0 (Dec. 17, 2025): the first release of the Bridge2AI-Voice Pediatric dataset.'
  - '1.1.0 (May 1, 2026): minor update with no new participants; releases audio features for
    all free speech tasks that were manually checked for presence of unconsented speakers
    and PII, new metrics related to the audio quality of the recordings, and per-recording
