name: Bridge2AI-Voice Pediatric Dataset
description: Bridge2AI-Voice Pediatric Dataset v1.1.0 contains derived audio features for
  23,533 recordings collected from 300 participants aged 2-18. The release contains data considered
  low risk, including derivations such as spectrograms but not the original voice recordings.
  Detailed demographic, clinical, and validated questionnaire data are also made available.
  The dataset is organized into derived audio features, phenotypic information acquired during
  data collection, and metadata information for the recordings.
source_caveats: The record describes version 1.1.0 as published on PhysioNet; the PhysioNet
  page is the highest-ranked source in the input manifest and supplies the identity, composition,
  file and access facts. The Bridge2AI-Voice documentation site and its datasheet-style sections
  in the bundle describe mainly the adult dataset (versions 2.0.0 and 3.0); only passages
  that name the pediatric data or pediatric participants were used for this record, and the
  adult-specific statements (de-identification levels, device models, labeling, hosting on
  Health Data Nexus, compensation, update cadence) were not carried into it. The Data Description
  names torchaudio_spectrograms.parquet and torchaudio_mel_spectrograms.parquet, while the
  Usage Notes load "torchaudio_spectrogram.parquet" and "torchaudio_mel_spectrogram.parquet"
  and give "torch_spectrogram.json" as an example data dictionary name; the record uses the
  Data Description names. By this record's own count, four of the nine listed Parquet feature
  files are stated with n=23532 and five with n=23533, while the abstract gives 23,533 recordings;
  the page states that some files could not generate certain features, and the record keeps
  both figures without adjusting either. Creator affiliations are transcribed from the title
  page and Annex C of the data acquisition protocol (revisions through July 11, 2025) and
  from the documentation's list of lead investigators, not from the PhysioNet author list,
  which gives names only; the documentation writes "Don Bolser" for the author listed as Donald
  Bolser, and its "Jennifer Sui (Hospital for Sick Children)" was not mapped to the author
  listed as Jennifer Siu. The protocol rows that list Alexander Gelbard under a continuation
  line were not used to assign an affiliation.
