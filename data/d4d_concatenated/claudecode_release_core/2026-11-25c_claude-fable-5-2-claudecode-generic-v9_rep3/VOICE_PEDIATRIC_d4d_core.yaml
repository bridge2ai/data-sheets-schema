funders:
- grantor: NIH
  description: The project was funded under an NIH project number. The Bridge2AI-Voice documentation
    describes Bridge2AI-Voice as a Precision Public Health grand challenge project funded
    by the NIH Common Fund Bridge2AI Program and supported by NIH grant OT2OD032720.
  grants:
  - grant_number: 3OT2OD032720-01S1
    name: 'Bridge2AI: Voice as a Biomarker of Health - Building an ethically sourced, bioaccoustic
      database to understand disease like never before'
  source_caveats: The PhysioNet acknowledgement cites NIH project number 3OT2OD032720-01S1.
    The NIH RePORTER record in the bundle carries the same title under project number 3OT2OD032720-01S3,
    core project number OT2OD032720; it is a different supplement of the same core project
    and is not recorded as a grant of this dataset.
instances:
- name: Recording
  instance_type: recording
  counts: 23533
  description: Derived audio features are provided per recording; each element of the Parquet
    feature files carries the participant identifier, the recording session identifier, the
    task performed, the number of time frames and the tensor data for the feature.
- name: Participant
  instance_type: participant
  counts: 300
  description: Participants aged 2-18 from whom the recordings were collected.
subpopulations:
- name: Age groups
  subpopulation_elements_present: true
  identification: Participants are aged 2-18. The Bridge2AI-Voice documentation states that
    pediatric participants are grouped by age and lists pediatric protocols for Peds 2-4,
    Peds 4-6, Peds 6-10 and Peds 10+.
- name: Patients and non-patient volunteers
  identification: Patients and healthy volunteers at the Hospital for Sick Children were considered
    for enrollment, and non-patients were recruited through research postings.
acquisition_methods:
- name: Questionnaires
  was_reported_by_subjects: true
  acquisition_details: The protocol included the collection of demographic information, voice
    and speech related questionnaires, and questionnaires inquiring about medical history.
    For participants without adequate comprehension and familiarity with their past medical
    history, parents or decision-makers completed the survey during the recording on a separate
    tablet. All participants completed the recording and demographic data collection in one
    session.
- name: Voice recordings
  was_directly_observed: true
  acquisition_details: 'Voice, breathing, cough, and speech data are recorded with reproschema-ui
    for pediatrics. The acoustic task table of the Bridge2AI-Voice protocol lists these tasks
    under its pediatric ("Peds") part: ABC''s (recalling alphabet); Ready For School (recalling
    a typical day preparing for school); Favorite Show (recalling favorite shows); Favorite
    Food (describing their favorite food); Outside of School (after school activities description);
    Months (listing the months); Counting; Naming Animals (listing animals); Naming Food (listing
    foods); Identifying Pictures (picture identification); Picture Description (Pediatrics);
    Long Sounds (sustained /ee/ and /ah/ sounds); Noisy Sounds (/jj/ /ah/ /ee/ /oo/ /sh/ /ss/
    /muh/ /nuh/ /zz/ /hh/); Caterpillar Passage (Pediatrics) (validated passage); Repeat Words
    (word repetition); Role naming (recalling days, months, and counting from 60 to 70); Repeat
    Sentences (sentence recall); Silly Sounds (/PUH/ /TUH/ /KUH/ /PUH TUH KUH/).'
  source_caveats: The task list is the protocol's task table, not an inventory of the tasks
    present in release 1.1.0; the PhysioNet page does not enumerate the tasks released.
- name: Derived audio features
  was_inferred_derived: true
  acquisition_details: The released audio data are features derived from the audio waveforms,
    for example electromagnetic articulography estimated using a deep learning model; the
    release does not contain the original voice recordings.
collection_mechanisms:
- name: reproschema-ui on tablets
  mechanism_details: All data was collected through customized software, reproschema-ui, on
    tablets, using the Bridge2AI-Voice pediatric protocol.
  used_software:
  - id: doi:10.13026/h995-bt35#software-reproschema-ui
    name: reproschema-ui
- name: Headset
  mechanism_details: A headset was used to record for most participants.
- name: Built-in tablet microphone
  mechanism_details: The remaining recordings utilized the built-in tablet microphone due
    to low tolerance of wearing headphones or existing complex medical conditions.
missing_data_documentation:
- missing_data_patterns: Some files could not generate certain features and so are not included
    in the bundled data. By this record's own count over the nine Parquet feature files the
    page lists, four (sparc_ema, sparc_loudness, sparc_periodicity and sparc_pitch) are stated
    with n=23532 and five (torchaudio_spectrograms, torchaudio_mel_spectrograms, torchaudio_mfcc,
    torchaudio_pitch and ppgs) with n=23533.
  missing_data_causes: Length or other issues, as the PhysioNet page states.
sampling_strategies:
- strategies: Patients and healthy volunteers at the Hospital for Sick Children were considered
    for enrollment. Patients were eligible if they fulfilled the inclusion criteria of 2 to
    18 years of age and English proficiency; exclusion criteria included participants over
    18 years of age and individuals who were non-verbal. Non-patients, recruited through research
    postings, were evaluated for eligibility on the same inclusion and exclusion criteria.
    The Bridge2AI-Voice documentation states that pediatric participants are recruited strictly
    from the Hospital for Sick Children (SickKids).
raw_sources:
- name: Raw audio recordings
  access_url: https://www.synapse.org/Synapse:syn73617068
  raw_data_details: The PhysioNet project does not contain raw audio. A PhysioNet news item
    dated March 9, 2026 states that raw audio data access for the Bridge2AI Voice pediatric
    cohort is via Synapse and that data will be made available via Synapse; accessing raw
    audio is a more involved process, requires institutional sign off, and is requested from
    the access committee. The Bridge2AI-Voice documentation states that raw audio data is
    disseminated through controlled access only to protect participants' privacy.
  source_caveats: The bundle includes a Data Transfer and Use Agreement template that names
    the University of South Florida Board of Trustees as provider institution and is effective
    only upon review and approval by the Data Access Compliance Office. The template does
    not name the pediatric cohort, and no source states whether it is the agreement signed
    for pediatric raw audio, so its terms are not recorded as terms of this dataset.
preprocessing_strategies:
- name: Export and format conversion
  preprocessing_details: Data were exported and converted to tab delimited values using an
    open source library developed by the team. The Bridge2AI-Voice documentation states that
    pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap
    format, and subsequently converted to the Brain Imaging Data Structure (BIDS), and that
    the raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported
    from REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0.
- name: Audio feature derivation and phenotype merging
  preprocessing_details: The code used to preprocess the raw audio waveforms into the Parquet
    files and to merge the source data into the phenotype files has been made open source
    in the b2aiprep library. The Parquet feature files comprise spectrograms, Mel spectrograms,
    Mel-frequency cepstrum coefficients, pitch, estimated electromagnetic articulography,
    loudness, periodicity and phonetic posteriorgrams, each described with its file.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    description: Bridge2AI Data Processing Library, used for organizing and preprocessing
      the dataset.
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://github.com/sensein/senselab
    name: SenseLab
    description: Toolkit for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
  source_caveats: Version 3.0.0 is the version of b2aiprep cited in the PhysioNet reference
    list. SenseLab is named in the Bridge2AI-Voice documentation's statement that all processing
    is performed using b2aiprep and SenseLab; the PhysioNet page names only b2aiprep.
- name: Static feature extraction
  preprocessing_details: Features derived from the open-source Speech and Music Interpretation
    by Large-space Extraction (openSMILE), Praat, parselmouth, and torchaudio are provided
    in the static_features.tsv file, and metrics related to audio quality derived from the
    recordings are provided in the audio_quality_metrics.tsv file.
  used_software:
  - id: doi:10.13026/h995-bt35#software-opensmile
    name: openSMILE
  - id: doi:10.13026/h995-bt35#software-praat
    name: Praat
  - id: doi:10.13026/h995-bt35#software-parselmouth
    name: parselmouth
  - id: doi:10.13026/h995-bt35#software-torchaudio
    name: torchaudio
cleaning_strategies:
- name: Removal of features for sensitive records and audio checks
  cleaning_details: Spectrograms, Mel spectrograms, MFC coefficients, PPGs, and EMAs for sensitive
    records and audio checks have been removed from v1.1.
- name: Manual check of free speech tasks
  cleaning_details: Version 1.1 releases audio features for all free speech tasks that were
    manually checked for presence of unconsented speakers and PII.
- name: Discarding inadvertent caregiver recordings
  cleaning_details: 'The Bridge2AI Voice Data Acquisition protocol provides that, in the event
    where the caregiver''s voice is recorded inadvertently, these clips can be discarded by
    two means: re-recording manually during data collection, or during data audit and postprocessing.'
intended_uses:
- name: Study of developmental norms
  description: Enable study of developmental norms.
- name: AI-driven early screening tools
  description: Create AI-driven tools for early screening.
- name: Clinical insight
  description: Support clinical insight.
