- id: rule-20
  verdict: followed
  evidence: "the bundle states no ORCID (grep count 0), so both Person ids are fragments on the record's id in the prescribed form: 'doi:10.13026/h995-bt35#person-yael-bensoussan', '#person-olivier-elemento'; the address is in creators[0].principal_investigator.email, not the id"
- id: rule-21
  verdict: violated
  evidence: "preprocessing_strategies[1].used_software[1] (SenseLab, id https://github.com/sensein/senselab) is in the referent's own slot on passages whose subject is not the referent: its receipt, line 1874, answers the documentation's datasheet question for the adult v2.0.0 dataset, and its other support, lines 2200-2204 ('All processing is performed using these toolkits: b2aiprep ... SenseLab'), follows the 'Methods of De-identification for v3.0.0' heading (2184), the adult release; neither names the pediatric data, the record's own top-level source_caveats states that only passages naming the pediatric data or participants were used, and the PhysioNet pediatric page names only b2aiprep (415-417). The entry's caveat discloses this but does not change the subject of the passage. The standard applied to everything else: passages about the Bridge2AI-Voice study's participants or its pediatric cohort (protocol V2 'Modified to include pediatric cohort', line 588; sections 11 and 22.6, lines 857, 975-976; withdrawal 875; caregiver clips 714; voice re-identification 937-938) or explicitly about every Bridge2AI-Voice dataset (raw audio 'from any Bridge2AI-Voice dataset', 1097; access steps 1631-1641) pass, and are attributed in the value's own text; the adult datasheet's other answers (833 instances, devices, compensation, de-identification levels, Health Data Nexus hosting, update cadence) were kept out; the adult dataset otherwise appears only in related_datasets[0]. Residual, not charged: SickKids collected under a separate REB (line 663) whose terms are not in the bundle, disclosed in consent_revocations[0] and at_risk_populations source_caveats"
- id: rule-22
  verdict: followed
  evidence: "list entries each name one entity: one Person per creator, one Organization per affiliation (Lerner-Ellis's two affiliations are the two names two sources give, not a split of one name), one grant, one ethical review board, one software per used_software entry (openSMILE, Praat, parselmouth, torchaudio separate). subpopulations[0] 'Age groups' and [1] name identification dimensions, which the Subpopulation class asks for ('by age, gender'); [1] is charged under rule-07, not as a merge"
- id: rule-23
  verdict: followed
  evidence: "forced ids take the identifier the evidence states first: b2aiprep and SenseLab carry their GitHub URLs (lines 457, 1874); openSMILE, Praat, parselmouth, torchaudio and reproschema-ui have no software identifier in the bundle (line 458 is a proceedings ISBN, 461-462 arXiv ids of papers, 398-399 a bare name), so they, the 3 collections, 12 files and 2 persons are labeled on the record's own id, a declared CURIE, with one fragment marker each; file and collection ids reach the core's distributions (pair-01)"
- id: rule-24
  verdict: followed
  evidence: "enumeration slots rest on passages stating the category: variables[0-1].data_type 'identifier' on 'a unique identifier for the participant/recording session' (line 402), with no data_type on task_name/n_frames; file_collections[0].collection_type processed_data on 'derived audio data features' preprocessed from raw waveforms (402, 415), [2] metadata on 'metadata information for the recordings' (402), none on phenotype; related_datasets[0].relationship_type 'references' (required): the record and report concede that no source names a dataset-to-dataset relation (companion, part, supplement), and the record asserts none; what line 316 states is that this dataset's own page points the reader to the adult dataset with its URL ('Note that the Bridge2AI-Voice Adult Dataset is also available on PhysioNet: https://physionet.org/content/b2ai-voice/'), which is what the enum defines 'references' as ('This dataset references the target dataset'). The value encodes the pointer the passage makes and nothing stronger, and the entry itself is the scope declaration's required route for the adult dataset (express as related_datasets), so I read the relation as stated rather than guessed; file format/media_type from extensions are exempt"
- id: rule-25
  verdict: followed
  evidence: "raw_sources[0] carries no raw_data_format: no passage states the form of the pediatric raw audio before processing (the .wav paths at line 2142 are the adult audio dataset's folder layout), and Parquet/TSV are recorded only in the release's distribution and file slots"
- id: rule-26
  verdict: followed
  evidence: "principal_investigator is filled only for persons designated with that title: Bensoussan ('PRINCIPAL INVESTIGATOR', line 549-550; RePORTER line 2337) and Elemento ('co-principal investigators for the project', line 1759); leads and co-leads in Annex C (lines 1005-1021) and Alistair Johnson ('Lead - data integration') are not promoted; each PI's caveat says the designation is for the project, not the pediatric release specifically"
- id: rule-27
  verdict: followed
  evidence: "the Topics tag list (lines 490-495) fills keywords and nothing else; missing_data_causes keeps the page's reach ('Length or other issues', line 412); limitations are recorded without added consequences; the Peds protocol list (1180-1190) is reported as a list of pediatric protocols, and the Peds task table (1481-1551) is caveated as the protocol's table, not an inventory of released tasks"
- id: rule-28
  verdict: followed
  evidence: "list entries are members: variables are the four columns line 402 names; file resources are files the Data Description names (403-413) plus demographics.tsv (see slot-007 on how weakly that file is attested); remarks such as the n=23532/23533 shortfall and the file-name discrepancy go to missing_data_documentation and source_caveats, not to entries"
- id: rule-29
  verdict: followed
  evidence: "no errata slot from 'no erratum' (line 1950 is the adult datasheet and was not used); the registered-access route (478-484, 513-517) is in license_and_use_terms/data_governance, not in distribution_formats' format, whose values are Parquet, TSV and JSON; no future_guarantees from the access route; the absence of raw audio in the PhysioNet project (310) is stated inside the existing raw_sources entry's details, not as an entry of its own"
- id: rule-30
  verdict: followed
  evidence: "string-ranged slots hold strings: license 'Bridge2AI Voice Registered Access License' (line 480), ethical_reviews[0].reviewing_organization and human_subject_research.ethics_review_board as names, grantor 'NIH', related_datasets[0].target_dataset a URL; no object sits in a scalar slot (both records validated)"
- id: pair-01
  verdict: consistent
  evidence: "compared $.file_collections (with each collection's resources) against core $.distributions by id: all 15 core distributions (3 collections, 12 files) join to a full-record entry and every value they carry (name, description, path, format, media_type) equals the full value; the only differences are full-only keys dropped by the projection (collection_type, resources on collections; file_type on files); no core distribution lacks a source"
notes: >-
  Reviewer identity: a Claude Code subagent given the d4d-review-record
  definition file as its instructions via a brief, not launched as the typed
  agent; running as model claude-opus-5-5 (the definition's frontmatter names
  claude-opus-5). The pack (pack_version 7) was read as it is and not
  regenerated; it lists no gaps; receipt_join basis is index (no phase-1
  snapshot), and no item depended on an index shift. Bundle bytes match the
  pack's md5 per id_slots bundle_state current. No other record, label or
  review was opened. Adverse findings: rule-06 (HRP-416 checklist pointer in
  at_risk_populations.special_protections[1]), rule-07 (recruitment passage
  placed as subpopulations[1]), rule-21 (SenseLab entry supported only by
  passages about the adult v2.0.0/v3.0.0 releases), slot-007 weak
  (demographics.tsv attested only by an illustrative Usage Notes example). No
  value was found contradicted by the bundle. Two claims lack a passage for
  what they assert, though their text is in the bundle: subpopulations[1]
  (line 397 describes recruitment; no passage states that the release
  identifies patients versus non-patients) and the SenseLab entry (no
  passage about the pediatric release names it).
