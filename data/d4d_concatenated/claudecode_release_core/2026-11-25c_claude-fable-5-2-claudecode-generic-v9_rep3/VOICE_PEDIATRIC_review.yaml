  evidence: "every value checked traces to the bundle: identity/version/doi/latest DOI (lines 306-307, 486-489), license and access (478-484), counts (391), file list and per-file n (403-411), release notes (441-442), ethics (444), grant (447); slots without evidence are omitted (publisher, known_limitations, collection_timeframes, raw_data_format, total sizes; report 'Considered and left out'). Affiliations come only from passages that name the person with the institution; Jennifer Siu and Alexander Gelbard are left without one. Placement and subject issues are charged under rule-06, rule-07 and rule-21, and slot-007 is weak"
- id: rule-02
  verdict: followed
