  evidence: "multivalued slots carry one object per entity: 121 creators, one per author (lines 65-305), intended_uses split into three uses from line 395, collection_mechanisms split into tablet software, headset and built-in microphone (398-400), 12 File entries. preprocessing_strategies[1] covers both waveform-to-Parquet derivation and phenotype merging, but line 415 states them as the work of one b2aiprep code base, so it is not two entities collapsed"
- id: rule-06
  verdict: violated
  evidence: "at_risk_populations.special_protections[1] = 'The protocol states that Checklist HRP-416 for children under 21 has been completed and is appended to the protocol.' (line 857): it records that a checklist document exists and where it is, not what protection was implemented, which is what special_protections asks; the slot should carry the protection or omit the entry. Other values answer their fields (license_terms names the license and the DUA/credentialing constraints, lines 478-484)"
- id: rule-07
  verdict: violated
  evidence: "subpopulations[1] 'Patients and non-patient volunteers' has identification text from line 397 ('Patients/healthy volunteers at the Hospital for Sick Children were considered for enrollment ... Non-patients, recruited through research postings'), which describes who was eligible and how they were recruited: it answers sampling_strategies (where sampling_strategies[0] already carries the same passage), not the Subpopulation question of whether the dataset identifies such subpopulations and how. No passage states that the release identifies patients versus non-patients. Other placements reviewed are in the field they answer (access route in data_governance, not distribution_formats; release dates in distribution_dates; versions in version_access)"
- id: rule-08
  verdict: followed
  evidence: "class-ranged objects carry their declared fields where evidence states them: principal_investigator objects carry id, name, email (yaelbensoussan@usf.edu, line 553) and affiliation; funders[0].grants[0] has grant_number and name (line 447); affiliations are Organization objects with name; File entries carry name, file_type, and format/media_type for the .tsv files. The nine Parquet files carry no format because File.format's FormatEnum has no Parquet value, so that field could not be populated; reference_attributes is empty for this schema"
- id: rule-09
  verdict: followed
  evidence: "uriorcurie slots use declared prefixes: id 'doi:10.13026/h995-bt35', version_access.latest_version_doi 'doi:10.13026/mf9s-5r03' (line 489 gives the resolver URL), all minted ids on the doi: CURIE; the two GitHub software ids are URLs no declared prefix covers; doi slot holds the bare DOI '10.13026/h995-bt35'; access_urls/page/access_url (uri) keep URLs; the citation keeps its URL as text"
- id: rule-10
  verdict: followed
  evidence: "every external identifier is in the bundle: Synapse URL (line 314), adult dataset URL (317), latest DOI (489), b2aiprep and senselab URLs (457, 1874), project/docs websites (497, 1035), RRID in the citation (323); no ROR, ORCID or other registry id was added from outside knowledge (the bundle has no ORCID; grep count 0)"
- id: rule-11
  verdict: followed
  evidence: "id_slots: 22 entries are minted, all fragments on the record's own id doi:10.13026/h995-bt35, an identifier the evidence supplies (line 487) under the declared doi prefix; no constructed ids, no invented prefix, no fragment on an organization's identifier; the 2 stated ids are the tools' own GitHub URLs. Persons are fragments on the dataset id, not on an organization id"
- id: rule-12
  verdict: followed
  evidence: "the run's form block records british_spellings 0 (instrument v4); a scan of the full record for -isation/-our/-ise/-tre/-lled forms found only American 'fulfilled', 'enrolled', 'controlled'; 'bioaccoustic' in funders[0].grants[0].name is the source's own spelling of a title (line 447)"
- id: rule-13
  verdict: followed
  evidence: "manifest ranks PhysioNet tier 1, protocol/documentation/DUA tier 2, RePORTER tier 4: the grant number follows the tier-1 page (3OT2OD032720-01S1, line 447) with the tier-4 -01S3 recorded in funders[0].source_caveats; the Lerner-Ellis affiliation disagreement is between two tier-2 sources and both are represented with the reason stated in creators[14].source_caveats; PI designations are compatible and both recorded with sources"
- id: rule-14
  verdict: not_applicable
  evidence: "every minted id (22: 2 Person, 5 Software, 3 FileCollection, 12 File) is schema-forced per id_slots (forced: true), so the points-at test does not reach them (rule-23); no unforced fragment exists in the record"
- id: rule-15
  verdict: followed
  evidence: "the receipt has one entry per chunk in order (c001-c013: 10 extracted, 3 nothing_relevant) and the run's receipts block reports 13/13 chunks, 451/451 snippets verified, 0 unattesting; every creator index 0-120, every variable, collection and file entry has its own receipt. The keywords snippets are single tag-list entries ('pediatric' 492, 'biomarkers' 493, 'bridge2ai' 494) of 9-10 characters; a tag list holds nothing but single words, and I do not read these as the 'lone short word' the rule excludes (the validator counts them attesting). The receipt is at the slot path 'keywords', which meets 'every value ... appears in some chunk's receipt' at that path; the shorter entries 'health' (491) and 'voice' (495) are covered only by that list-level receipt, not by snippets of their own"
- id: rule-16
  verdict: followed
  evidence: "creators[0].principal_investigator and creators[3].principal_investigator are Person objects with id, name and affiliation (and email for Bensoussan); funders[0].grants[0] is a Grant object with grant_number; affiliations are Organization objects; no object was reduced to a string or a reference inflated (reference_attributes is empty)"
- id: rule-17
  verdict: followed
  evidence: "protocol intentions are stated as such and in the source's tense: consent_revocations ('the data they have provided will be kept', line 875), at_risk_populations.assent_procedures ('children will provide verbal assent', line 976) and special_protections[0] (line 857) each say 'The ... protocol states that', with a caveat that they are future-tense protocol statements; raw_data_details keeps 'data will be made available via Synapse' (312); release 1.0.0 appears only in version_access.versions_available and distribution_dates, each labeled; adult-dataset facts (v3.0, 833 participants, v2.0.0) only in related_datasets[0]. The one receipt whose passage is about another dataset (the SenseLab entry, line 1874) is charged once, under rule-21, not again here"
- id: rule-18
  verdict: followed
  evidence: "the one derived figure, the count of four Parquet files at n=23532 and five at n=23533 (lines 403-411), is stated in missing_data_documentation[0] and source_caveats as 'By this record's own count' with the files named, beside the stated 23,533 (line 391) without adjusting either"
- id: rule-19
  verdict: followed
