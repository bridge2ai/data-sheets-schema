distributions:
- description: 'Derived audio data features: dense binary files in Parquet format and plain-text
    files, each associated with a data dictionary file which has the same file stem and a
    JSON suffix.'
  id: doi:10.13026/37yb-1t42#features
  name: features
  path: features
  source_caveats: The release page lists the files as torchaudio_spectrogram.parquet and torchaudio_mel_spectrogram.parquet
    and describes them under the names torchaudio_spectrograms.parquet and torchaudio_mel_spectrograms.parquet;
    the listed names are used. The data dictionary files of this folder are not listed by
    name and are not entered as files.
- description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a
    dimension of 40xT with a frame rate of 100Hz (n=29289).
  id: doi:10.13026/37yb-1t42#features-ppgs.parquet
  name: ppgs.parquet
  path: features/ppgs.parquet
- description: Estimated electromagnetic articulography (EMA) using a deep learning model,
    with dimensions Tx12 (n=28640).
  id: doi:10.13026/37yb-1t42#features-sparc_ema.parquet
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
- description: Estimated loudness based on the average absolute amplitude of the audio waveform
    (n=31855).
  id: doi:10.13026/37yb-1t42#features-sparc_loudness.parquet
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
- description: Estimated periodicity (confidence of pitch presence) (n=31872).
  id: doi:10.13026/37yb-1t42#features-sparc_periodicity.parquet
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
- description: Estimated fundamental frequency (F0) of the audio signal (n=31872).
  id: doi:10.13026/37yb-1t42#features-sparc_pitch.parquet
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform (n=29278).
  id: doi:10.13026/37yb-1t42#features-torchaudio_spectrogram.parquet
  name: torchaudio_spectrogram.parquet
  path: features/torchaudio_spectrogram.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60xT (n=29278).
