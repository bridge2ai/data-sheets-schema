title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
version: 3.1.0
id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
description: 'A collection of data derived from voice recordings with corresponding clinical
  information. Version 3.1 contains data for 833 participants across five sites in North America,
  selected based on known conditions which manifest within the voice waveform, including voice
  disorders, neurological disorders, mood disorders, and respiratory disorders. The release
  contains data considered low risk: derived audio data features such as spectrograms, but
  not the original voice recordings, together with phenotypic information acquired during
  data collection (detailed demographic, clinical, and validated questionnaire data) and metadata
  related to the specific audio task and recording.'
source_caveats: 'The record id is the PhysioNet project-level DOI, which the release page
  labels "DOI (latest version)"; the doi slot carries the DOI of version 3.1.0, the release
  whose facts this record states. The project documentation site includes a Healthsheet that
  answers several questions for an earlier release (it names v2.0.0 and distribution through
  the Health Data Nexus platform); values taken from it are marked as such in the entries
  concerned. The statement of conformance to the Brain Imaging Data Structure comes from the
  project documentation, which says that the raw audio files and the questionnaire data were
  converted to be compliant with it; the PhysioNet release pages do not name the standard.
  The language value follows the Healthsheet, which states that English was used for communication
  with study participants and that English is the only language option for v2.0.0; the study
  protocol was later amended to include data collection from Spanish language speakers, and
  no source states the languages present in version 3.1.0. Absences the documentation states,
  for which no entry is recorded: there are no predefined recommended data splits; there is
  no erratum (a changelog for each dataset version is published with the dataset metadata);
  no IP-based restrictions have been imposed by third parties; no export controls apply; no
  analysis of the potential impact of the dataset on data subjects has been conducted; no
  repository links the papers or systems that use the dataset; the Healthsheet answers "No"
  to whether the dataset contains confidential data, describes the instances as unrelated
  to one another and describes the dataset as self-contained. The version 3.1.0 page states
  no total number of recordings. Enrollment targets in the planning documents (10,000 anticipated
  by 2027 in the documentation; 30,000 in the study protocol) are plans for the study, not
  contents of this release.'
