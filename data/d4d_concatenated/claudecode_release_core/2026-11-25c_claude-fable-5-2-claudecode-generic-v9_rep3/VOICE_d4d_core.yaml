purposes:
- response: The project seeks to create an ethically sourced flagship dataset to enable future
    research in artificial intelligence and support critical insights into the use of voice
    as a biomarker of health. The documentation states the goal as facilitating the use of
    voice as a non-invasive, cost-effective biomarker for the screening, diagnosis, and monitoring
    of a wide range of health conditions.
tasks:
- response: Development, benchmarking, or validation of clinically applicable machine-learning
    models for diagnosing a wide range of health conditions using voice data, including vocal
    pathologies and neurological, psychiatric, and respiratory disorders.
addressing_gaps:
- response: 'A gap in the availability of large-scale, diverse, and well-documented voice
    data for use in clinical machine-learning applications: previous studies on machine learning-based
    voice diagnosis produced promising results, but their sample sizes were too small, or
    they lacked the key metadata needed for training robust, clinically useful models.'
