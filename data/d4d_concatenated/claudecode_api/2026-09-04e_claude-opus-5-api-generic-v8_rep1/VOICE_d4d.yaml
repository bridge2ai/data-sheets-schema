description: >-
  Bridge2AI-Voice is a multi-institutional collection of data derived from voice, speech, breathing and
  cough recordings, linked to demographic, clinical and validated-questionnaire information. It is the
  flagship dataset of the Voice project, a Precision Public Health grand challenge funded by the NIH
  Common Fund Bridge2AI program, whose aim is to promote integration of voice as a biomarker of health in
  clinical care. The consortium identified five disease cohort categories around which data acquisition is
  focused: voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders,
  respiratory disorders, and pediatric voice and speech disorders. Version 3.1.0 contains data for 833
  adult participants recruited at five sites in North America and selected for conditions known to
  manifest within the voice waveform, covering the four adult categories together with control
  participants who do not have the conditions of interest. Recordings were made prospectively with a
  custom application running on a tablet, generally with a head-mounted headset and microphone, following
  standardized multi-disorder acoustic protocols covering respiration, cough, sustained phonation,
  diadochokinesis, validated passages and free and prompted speech. The published release contains data
  considered low risk: derived acoustic representations including spectrograms, Mel spectrograms,
  Mel-frequency cepstral coefficients, phonetic posteriorgrams, articulatory estimates, pitch, loudness
  and periodicity traces, together with static acoustic feature tables and audio quality metrics. It does
  not contain the original voice recordings, which are disseminated separately under controlled access.
  Phenotypic tables covering enrollment, demographics, confounders, per-condition diagnosis and validated
  questionnaires accompany the features, along with per-recording metadata and JSON data dictionaries for
  every data file. The dataset is distributed through PhysioNet under credentialed access conditional on a
  signed data use agreement.

source_caveats: >-
  The referent of this record is the Bridge2AI-Voice adult dataset as published on PhysioNet, described at
  its current release, version 3.1.0 of 1 May 2026; the Bridge2AI-Voice Pediatric Dataset is a separate
  release and is recorded under related_datasets rather than merged here. Where the PhysioNet releases and
  the project documentation disagree, the PhysioNet releases were preferred as the higher-ranked source:
  the documentation names the lead investigator at the Hospital for Sick Children "Jennifer Sui", spells
  "Frank Rudzizc" and "Don Bolser", and writes "Yael Bensoussan" with a diaeresis and "Anais Rameau" with
  a diaeresis, while the PhysioNet author lists give Jennifer Siu, Frank Rudzicz, Donald Bolser, Yael
  Bensoussan and Anais Rameau, whose forms are used here. The documentation attributes the multi-disorder
  protocol publication to Bensoussan et al. while the PhysioNet releases attribute the same DOI to Rameau
  et al.; the PhysioNet form is used. The documentation describes the dataset as hosted on the Health Data
  Nexus and reports figures for version 3.0 of approximately 61,937 voice-derived recordings from 833
  adult participants, along with eligibility text written for version 2.0.0; those version-specific
  figures are not carried into this record, which takes participant and feature counts from the version
  3.1.0 release. The version 3.0.0 PhysioNet page is superseded by version 3.1.0 and was not used to
  settle any value. The sources disagree on the project's target dataset size: the project documentation
  states that the project "seeks to create a flagship, standardized, and ethically sourced dataset of
  10,000 voices" and gives an anticipated enrollment count by 2027 of 10,000, while the audiomics white
  paper states a primary deliverable "to build a publicly available database of 30 000 human voices" and
  the IRB protocol gives a sample size of 30,000 participants; the two figures are recorded as separate
  purposes because the higher-ranked documentation and the lower-ranked white paper and IRB protocol
  cannot be reconciled from the bundle, and the IRB protocol itself also describes a phased plan
  cumulatively reaching 5,000 participants. Grant identifiers appear in several forms across the sources:
  OT2OD032720 as the core project number, 3OT2OD032720-01S1 in the PhysioNet acknowledgements,
  3OT2OD032720-01S3 in the NIH RePORTER record, 1OT2OD032720-01 in the feasibility publication, and two
  evidently garbled forms in the project documentation. Feature file names are written in the singular in
  the release's folder listing and in the plural in the accompanying per-file descriptions; the
  folder-listing forms are used here. In addition to the fifteen lead investigators recorded as creators,
  over 50 other investigators, clinicians, scholars and trainees contributed to the development of this
  dataset, and the version 3.1.0 PhysioNet release carries an author list of more than one hundred
  contributors from the Bridge2AI-Voice consortium; those contributors are not individually recorded here.
  BIDS conformance is asserted on the strength of the project documentation's data pre-processing section,
  whose folder listing describes the audio-containing distribution ("b2ai-voice-audio", with per-subject
  session folders holding WAV files) and its shared phenotype layout; neither the version 3.1.0 nor the
  version 3.0.0 PhysioNet release page mentions BIDS, so the conformance claim is scoped to the audio
  distribution and the phenotype folder structure rather than to the feature-only release as published.
  The project documentation records that the HIPAA de-identification rules were applied to the released
  dataset, while Attachment 2 of the data transfer and use agreement, an equally ranked source governing
  release of raw voice data, states that the transferred data is personally identifiable information as
  defined in OMB Memorandum M-07-16 and is not covered under HIPAA, FERPA or similar laws; the two
  statements concern different distributions of the data and the ranking cannot settle between them.

