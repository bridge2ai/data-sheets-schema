      High-resolution physiologic signals captured from hospital waveform systems and middleware,
      including telemetry data and EEG where available.
    source_type:
      - physiologic waveform
    raw_data_format:
      - WFDB
    access_details: >-
      Available only within the CHoRUS controlled-access secure enclave under an executed Data Use
      Agreement.
  - id: d4d:chorus-raw-source-notes
    name: Clinical note and report text
    source_description: >-
      Clinical note and report text from participating institutions, included in tokenized form with
      raw text retained locally at the contributing institution.
    source_type:
      - clinical free text
    access_details: >-
      Raw text is retained locally across participating institutions and is not distributed; only
      tokenized text is included.

raw_sources:
  - id: d4d:chorus-raw-text-retained-locally
    name: Locally retained raw clinical text
    description: >-
      Raw note and report text is not part of the distributed package; it is retained locally across
      participating institutions.
    raw_data_details:
      - Tokenized note and report text (via OHNLP toolkit) with raw text retained locally across participating institutions.

preprocessing_strategies:
  - id: d4d:chorus-preprocessing-omop
    name: Harmonization to the OMOP common data model
    description: >-
      Electronic health record extraction and transformation to the OMOP common data model, followed
      by standardized harmonization to the common data model.
    preprocessing_details:
      - Electronic health record extraction and transformation to OMOP common data model.
      - Standardized harmonization to common data model.
  - id: d4d:chorus-preprocessing-imaging-deid
    name: Imaging de-identification
    description: >-
      Imaging metadata de-identification using RSNA Clinical Trial Processor and pixel-level
      de-identification using IbisWorks EICON.
    preprocessing_details:
      - Imaging metadata de-identification using RSNA Clinical Trial Processor.
      - Pixel-level de-identification using IbisWorks EICON.
    used_software:
      - id: d4d:software-rsna-ctp
        name: RSNA Clinical Trial Processor
        description: Used for imaging metadata de-identification.
      - id: d4d:software-ibisworks-eicon
        name: IbisWorks EICON
        description: Used for pixel-level image de-identification.
  - id: d4d:chorus-preprocessing-waveform-wfdb
    name: Waveform transformation to the WFDB standard
    description: >-
      High-resolution physiologic waveform capture extraction and transformation to the WFDB standard.
    preprocessing_details:
      - High-resolution physiologic waveform capture extraction and transformation to the WFDB standard.
  - id: d4d:chorus-preprocessing-text-tokenization
    name: Clinical text tokenization
    description: >-
      Note and report text is tokenized using the OHNLP toolkit; raw text is retained locally across
      participating institutions.
    preprocessing_details:
      - Tokenized note and report text via OHNLP toolkit.
      - Raw text retained locally across participating institutions.
    used_software:
      - id: d4d:software-ohnlp-toolkit
        name: OHNLP toolkit
        description: Used to tokenize clinical note and report text.
  - id: d4d:chorus-preprocessing-identifier-handling
    name: Identifier removal and date handling
    description: >-
      De-identification consistent with HIPAA Safe Harbor, including identifier removal or
      tokenization and date handling.
    preprocessing_details:
      - Removal or tokenization of direct identifiers.
      - Date shifting or limited date fields when required.

splits:
  - id: d4d:chorus-splits
    name: Hold-out and development splits
    description: >-
      Hold-out splits are provided for testing; development splits are used for training and
      validation.
    split_details:
      - Hold-out splits are available for testing.
      - Training and validation in development splits require internal mechanisms to avoid overfitting.

