      - Model validation and benchmarking
      - Algorithm development and feature engineering
      - Retrospective hypothesis testing
      - Fine-tuning of multimodal models
      - Comparative effectiveness research
      - Reinforcement learning and development of expert AI
      - Methodological research in trustworthy AI
      - Trial emulation or powering
