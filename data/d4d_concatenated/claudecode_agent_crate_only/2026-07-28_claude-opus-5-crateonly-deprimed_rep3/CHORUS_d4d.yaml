sensitive_elements:
  - id: d4d:chorus-sensitive-elements
    name: Sensitive clinical information and applied protections
    sensitive_elements_present: true
    description: >-
      The dataset is derived from patient care at participating hospitals and is assigned a
      confidentiality level of HL7:2V (very restricted). The declared personal/sensitive-information
      statement for this package enumerates the controls applied to that sensitive content.
    sensitivity_details:
      - CHoRUS operates within a secure enclave environment aligned with NIST 800-53 controls.
      - De-identification consistent with HIPAA Safe Harbor
      - Removal or tokenization of direct identifiers
      - Date shifting or limited date fields when required
      - Role-based access control (RBAC)
      - Multi-factor authentication
      - Full audit logging of data access and queries
      - Prohibition of re-identification attempts
      - Data export restrictions and output review procedures to reduce risk of re-identification
      - Re-identification risk is periodically assessed and mitigation strategies updated as needed.

confidential_elements:
  - id: d4d:chorus-confidentiality
    name: Confidentiality classification and enclave restriction
    confidential_elements_present: true
    description: >-
      The package is classified at confidentiality level HL7:2V (very restricted) and is held in a
      controlled-access secure enclave.
    confidentiality_details:
      - 'Confidentiality level: HL7:2V (very restricted)'
      - Access restricted to secure enclave environment; no raw data export permitted unless explicitly approved.
      - Raw note and report text is retained locally across participating institutions rather than distributed.

is_deidentified:
  id: d4d:chorus-deidentification
  name: CHoRUS de-identification
  identifiable_elements_present: false
  method: De-identification consistent with HIPAA Safe Harbor
  description: >-
    The package is declared de-identified. Structured, imaging, and free-text content are
    de-identified or tokenized before inclusion, and raw text is retained locally at contributing
    institutions.
  identifiers_removed:
    - Removal or tokenization of direct identifiers
    - Date shifting or limited date fields when required
  deidentification_details:
    - Imaging metadata de-identification using RSNA Clinical Trial Processor.
    - Pixel-level de-identification using IbisWorks EICON.
    - Note and report text tokenized via the OHNLP toolkit, with raw text retained locally across participating institutions.
    - Re-identification risk is periodically assessed and mitigation strategies updated as needed.
  used_software:
    - id: d4d:software-rsna-ctp
      name: RSNA Clinical Trial Processor
      description: Used for imaging metadata de-identification.
    - id: d4d:software-ibisworks-eicon
      name: IbisWorks EICON
      description: Used for pixel-level image de-identification.
    - id: d4d:software-ohnlp-toolkit
      name: OHNLP toolkit
      description: Used to tokenize clinical note and report text.

