variables:
  - variable_name: participant_id
    description: >-
      Participant identifier joining feature tables and phenotype tables. Typed as string in some
      feature schemas and as integer in others (for example the torchaudio spectrogram schema and the
      phenotype schemas).
  - variable_name: session_id
    description: Session identifier; participants may contribute multiple sessions over time.
  - variable_name: task_name
    description: Name of the structured acoustic task associated with a recording-level feature row.
  - variable_name: n_frames
    description: Integer number of frames in the stored dense tensor for a feature row.
  - variable_name: spectrogram
    description: Dense spectrogram tensor computed with TorchAudio-based pipelines.
  - variable_name: mel_spectrogram
    description: Dense mel spectrogram tensor computed with TorchAudio-based pipelines.
  - variable_name: mfcc
    description: Dense Mel-frequency cepstral coefficient tensor computed with TorchAudio pipelines.
  - variable_name: pitch
    description: >-
      Pitch track; available both from TorchAudio pipelines and from the Speech Articulatory Coding
      package.
  - variable_name: loudness
    description: Loudness estimate from the Speech Articulatory Coding package.
  - variable_name: periodicity
    description: Periodicity estimate from the Speech Articulatory Coding package.
  - variable_name: ema
    description: >-
      Articulatory kinematic trajectories estimated with the Speech Articulatory Coding (sparc)
      package.
  - variable_name: ppgs
    description: Phonetic posteriorgrams, time-varying distributions over phonetic units per recording.
  - variable_name: transcription
    description: >-
      Machine-generated transcription of structured speech tasks produced with OpenAI Whisper Large;
      transcripts from free-speech audio were removed before release. Present in static_features.tsv.
  - variable_name: vhi_10_calc_score
    description: Calculated Voice Handicap Index-10 total score in the VHI-10 questionnaire table.
  - variable_name: winograd_score
    description: Score for the Winograd schema task, alongside 276 individual question response fields.
  - variable_name: is_control_participant
    description: Eligibility-table flag indicating whether a participant is a healthy control.
  - variable_name: recording_microphone
    description: >-
      Microphone used for a recording, recorded in the per-recording table alongside recording input
      gain, duration, size, profile name and profile version.

missing_data_documentation:
  - name: Missingness patterns and handling
    description: >-
      Phenotype tables include a row for a participant only when at least one variable is non-missing,
      and participants may have repeated visits with differing responses. Questionnaire completion
      varies by participant and cohort, so some forms and items are systematically or sporadically
      missing. Some derived audio features could not be computed for all recordings due to quality or
      length constraints, and features relating to free speech or sensitive records have been removed.
      No additional imputation is applied in the released files.

imputation_protocols:
  - name: No global imputation
    description: >-
      The public datasets do not apply global statistical imputation to missing fields; instead,
      missing questionnaire responses, phenotype variables and derived features are left as explicit
      missing values or omitted rows. The data release team audited missingness and users can
      implement study-specific imputation or complete-case strategies appropriate to their analyses.

raw_sources:
  - name: Original raw study data
    description: >-
      The original raw data consist of high-quality voice, speech and respiratory audio waveforms
      recorded on tablet or smartphone devices with headset microphones when available, plus responses
      to structured demographic and medical history questionnaires, disease-specific validated
      questionnaires and other patient-reported outcomes, together with clinical diagnoses and other
      metadata extracted from electronic health records. Access to the underlying raw audio is
      available only through a separate controlled-access process.

raw_data_sources:
  - source_description: >-
      Raw voice, speech and respiratory audio waveforms captured on the Bridge2AI-Voice mobile or
      tablet application, and structured demographic, medical history, disease-specific and
      patient-reported outcome data stored in REDCap, supplemented by clinical diagnoses extracted
      from electronic health record systems. The public PhysioNet release contains only de-identified
      derived representations of these sources; raw audio is obtainable only through a separate
      controlled-access process.

preprocessing_strategies:
  - name: Audio standardization
    description: >-
      Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing filtering;
      they are then segmented by task and passed through quality checks.
  - name: Derived feature extraction
    description: >-
      From the standardized audio, multiple derived feature sets are computed including spectrograms,
      mel spectrograms, MFCCs, articulatory features using the Speech Articulatory Coding package,
      pitch and loudness estimates, acoustic features from openSMILE, phonetic and prosodic features
      from Praat and parselmouth, and phonetic posteriorgrams using a dedicated model; all are stored
      as dense tensors in Parquet files with participant, session and task identifiers.
  - name: Phenotype export and reorganization
    description: >-
      Tabular phenotype and questionnaire files are exported from REDCap and merged using a dedicated
      open-source b2aiprep library, reorganizing the former single phenotype table into thematically
      organized TSV files with accompanying JSON data dictionaries; static per-recording feature
      summaries are provided in static_features.tsv, and de-identification and filtering steps are
      applied before packaging.
  - name: Re-identification risk reduction (data manipulation protocol)
    description: >-
      Prior to release, data are transformed to reduce re-identification risk and align with
      regulatory and ethical requirements. Direct identifiers and high-risk quasi-identifiers are
      removed; dates are coarsened or rebased; geographic information is generalized to the country
      level; narrative text fields and transcripts of free speech are removed; and raw voice waveforms
      are withheld from this feature-only release.
  - name: Provenance of processing steps
    description: >-
      Two computations are recorded in the crate: "VOICE Features Processing", which converts raw data
      into spectrograms and features using b2aiprep, and "VOICE Phenotype Ingest", which dumps and
      reformats phenotype information from the REDCap database into phenotype extracts. Both were run
      by "Alastair" using the B2AIPrep Library version 3.0.2.

cleaning_strategies:
  - name: Quality-check filtering
    description: >-
      Segmented audio is passed through quality checks, and some derived features are dropped when
      processing fails or quality checks fail. Additional filtering removes features for sensitive
      records and audio checks.
  - name: Consistency auditing
    description: >-
      The data release team audited the combined phenotype and feature tables for internal
      consistency, missingness patterns and data entry issues.

labeling_strategies:
  - name: Clinical and questionnaire-derived labels
    description: >-
      Annotations consist primarily of clinical labels and questionnaire-derived measures associated
      with each participant and recording. Participants complete validated instruments such as VHI-10,
      PHQ-9, GAD-7, PANAS, respiratory and cough questionnaires and voice instruments, which generate
      numerical scores and categorical indicators according to each instrument's published scoring
      guidelines. Clinical investigators and care teams record diagnostic categories for voice,
      neurological, mood and respiratory conditions and other phenotype variables, drawing on clinical
      assessments and electronic health records; these labels are represented in disease-specific TSV
      files with accompanying JSON dictionaries.
  - name: Machine-generated labels and descriptors
    description: >-
      Machine-generated transcripts of certain voice tasks and numerous automatically extracted
      acoustic and articulatory features provide further labels and descriptors at the recording
      level.
  - name: Annotation platforms
    description: >-
      Annotation and curation were carried out using the custom Bridge2AI-Voice mobile and tablet
      application, a REDCap-based data capture system, electronic health record systems as a source of
      gold-standard diagnostic information, and open-source preprocessing and curation tools including
      the b2aiprep library.

annotation_analyses:
  - name: Instrument scoring
    description: >-
      Questionnaire-based labels are generated using the standard scoring rules for each validated
      instrument, yielding total and subscale scores that can be mapped to symptom-severity bands; the
      scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  - name: Absence of inter-rater adjudication
    description: >-
      Diagnostic labels are derived from clinical assessments and electronic health records rather
      than crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses
      are treated as reference labels and may include multiple comorbid conditions per participant.
  - name: Annotations per item and uncertainty
    description: >-
      Each recording is associated with one set of clinical labels and questionnaire responses derived
      from a single participant, although participants may contribute multiple sessions over time.
      There is no crowd-sourced labeling and the documentation does not report multiple independent
      human ratings per individual recording. Per-annotator disagreement statistics and detailed
      label-uncertainty measures are not presently included in the released dataset.

machine_annotation_tools:
  - name: openSMILE
    description: >-
      Extraction of acoustic feature sets capturing temporal dynamics and spectral characteristics.
  - name: Praat and parselmouth
    description: >-
      Phonetic and prosodic feature extraction, including measures of fundamental frequency, formants
      and voice quality.
  - name: TorchAudio
    description: TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - name: Speech Articulatory Coding (sparc)
    description: Estimation of articulatory kinematics and related features, including pitch, loudness and periodicity.
  - name: Phonetic posteriorgram model
    description: >-
      A dedicated model producing time-varying distributions over phonetic units for each recording.
  - name: OpenAI Whisper Large
    description: >-
      Automatic speech transcription of structured speech tasks, with transcripts from free-speech
      audio removed before release.
  - name: b2aiprep
    description: >-
      Open-source Python library (version 3.0.2, https://github.com/sensein/b2aiprep) orchestrating
      preprocessing, feature extraction and merging of phenotype data into the released files.

sensitive_elements:
  - name: Health and diagnostic information
    description: >-
      The dataset encodes health-related information including diagnostic categories for voice
      disorders, neurological and neurodegenerative conditions, mood and psychiatric disorders and
      respiratory diseases, as well as symptom scores from questionnaires, which constitute sensitive
      personal health data.
  - name: Coarsened demographic identifiers
    description: >-
      Demographic variables such as age, sex and country of data collection are included in coarsened
      form, while finer-grained geographic identifiers, direct identifiers and many socio-economic and
      cultural details have been removed during de-identification to reduce re-identification risk.
  - name: Removed high-sensitivity content
    description: >-
      Highly sensitive content including detailed narrative responses, some information about
      household income, traumatic life experiences and granular cultural identifiers has been removed
      entirely from this feature-only dataset.
  - name: Voice as a biometric identifier
    description: >-
      Raw voice recordings are themselves biometric identifiers and are made available only under
      controlled access; the public release contains derived representations only.

confidential_elements:
  - name: Limited dataset under data use agreement
    description: >-
      The crate records the confidentiality level as "Limited dataset available with Data Use
      Agreement". Access conditions are published at
      https://physionet.org/content/b2ai-voice/view-dua/3.0.0/ and use is restricted to authorized
      researchers under a registered-access license.
  - name: Withheld raw audio and free-speech transcripts
    description: >-
      Raw voice waveforms and transcripts of free speech are withheld from this release; raw audio is
      obtainable only through a separate controlled-access process.

content_warnings:
  - name: Sensitive clinical and mental-health item content
    description: >-
      Released questionnaire tables include items on depression, anxiety, PTSD, substance use and
      psychiatric history, including items on thoughts of death and self-harm (for example the PHQ-9
      "thoughts_death" item and the DSM-5 "self_harm" item), and on serious and life-limiting
      diagnoses such as cancer and amyotrophic lateral sclerosis. Detailed narrative responses about
      traumatic life experiences were removed from the release.

anomalies:
  - name: File name and content URL mismatches
    description: >-
      The crate entry ark:59853/b2ai-voice-dataset-feature-sparc-periodicity is named
      "sparc_loudness.parquet" although its content URL and schema refer to sparc_periodicity.parquet.
      The entry ark:59853/b2ai-voice-dataset-feature-torchaudio-pitch is named
      "torchaudio_spectrogram.parquet" although its content URL and schema refer to
      torchaudio_pitch.parquet.
  - name: Duplicate table-group name
    description: >-
      Two distinct phenotype entries, ark:59853/b2ai-voice-dataset-phenotype-questionnaire and
      ark:59853/b2ai-voice-dataset-phenotype-task, both carry the name "VOICE Questionnaire Tables".
  - name: Duplicated schema identifier and mismatched demographics schema
    description: >-
      The identifier ark:59853/b2ai-voice-schema-phenotype-confounders is used twice, once for the
      "Phenotype Confounders Schema" and once for the "Phenotype Demographics Schema". The
      demographics schema describes demographics.tsv but lists the same 547 confounder column names as
      the confounders schema, so the demographics column inventory in the crate appears incorrect.
  - name: Placeholder and empty metadata fields
    description: >-
      Several file entries carry placeholder descriptions ("a datafile description", "A Dataset
      description"), the irbProtocolId and completeness fields are empty strings, format fields are
      empty for the feature Parquet files, and the demographics entry has an empty
      associatedPublication.
  - name: Inconsistent publication date on one feature file
    description: >-
      The sparc_pitch.parquet entry carries datePublished 08/18/2025 while the other v3.0.0 entries
      carry 12/16/2025.
  - name: Incomplete derived features
    description: >-
      Some derived audio features could not be computed for all recordings due to quality or length
      constraints, and features relating to free speech or sensitive records have been removed, so
      feature coverage is not uniform across recordings.
  - name: Inconsistent column typing across schemas
    description: >-
      participant_id is declared as a string in several feature schemas (for example PPGs, SPARC and
      TorchAudio MFCC schemas) but as an integer in the TorchAudio spectrogram schema and in the
      phenotype schemas.

known_limitations:
  - name: Feature-only release
    description: >-
      The feature-only release does not include raw audio waveforms or free-speech transcripts, which
      limits certain types of modeling and error analysis and may constrain the ability to reproduce
      end-to-end audio pipelines.
  - name: Adult, English-focused cohort
    description: >-
      This version only includes an adult cohort; models trained solely on this dataset may not
      generalize to younger age groups or to languages beyond those represented.
  - name: De-identification reduces analytic granularity
    description: >-
      Because of de-identification, some granular demographic and socio-economic variables,
      fine-grained location data and narrative context have been removed, which reduces the risk of
      re-identification but also limits detailed fairness assessments and certain confounder
      adjustments.
  - name: No splits, benchmarks or label-uncertainty measures
    description: >-
      The dataset does not provide predefined train-validation-test splits or benchmarking tasks and
      does not include explicit per-instance label-uncertainty measures, so researchers must design
      their own evaluation protocols and handle label noise and missingness.
  - name: Access governance friction
    description: >-
      The registered-access and controlled-access governance structure is appropriate for privacy but
      may limit participation by some institutions or researchers and can complicate the
      reproducibility of pipelines that require both features and raw audio.

known_biases:
  - name: Sampling bias
    description: >-
      Participants are recruited from specialty clinics and associated institutions using a
      non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
      English speakers; this produces clinically enriched case mixes that may not represent general
      population distributions.
  - name: Geographic and cultural bias
    description: >-
      Data are collected at a limited number of North American sites, and although the project seeks
      diversity, it may under-represent speakers from other regions, cultures, languages and
      healthcare systems; early releases focus on English, with Spanish protocols planned but not yet
      fully represented.
  - name: Clinical spectrum bias
    description: >-
      Because participants are selected into disease cohorts where voice changes are expected, the
      prevalence and severity of conditions in the dataset differ from those in routine primary care
      or community settings, which may inflate model performance when evaluated within this dataset.
  - name: Device and environment bias
    description: >-
      Recordings are made using standardized but not identical hardware and primarily in clinical
      environments; future at-home collection or deployment on other devices may encounter different
      background noise, channel characteristics and user behavior.
  - name: Algorithmic bias in machine annotations
    description: >-
      Transcripts and some derived features rely on off-the-shelf models such as OpenAI Whisper and
      other audio toolkits whose performance may vary across demographic groups; the dataset team has
      not independently audited these tools for fairness, so downstream users should consider their
      biases when interpreting results.

intended_uses:
  - name: Clinical voice-biomarker model development
    description: >-
      Development, training and fine-tuning of machine-learning models that associate voice-derived
      features with diagnostic categories or symptom severity for conditions such as vocal fold
      pathology, neurological and neurodegenerative diseases, mood and anxiety disorders and
      respiratory illnesses.
  - name: Algorithm benchmarking and validation
    description: >-
      Benchmarking and validation of existing voice-biomarker algorithms by testing their performance
      on a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - name: Exploratory correlate research
    description: >-
      Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
      using de-identified derived features.
  - name: Fairness and AI safety research
    description: >-
      Methodological research on fairness, robustness and AI safety in clinical voice models,
      including studies of bias related to demographic subgroups or recording conditions, subject to
      the ethical constraints in the data use agreement.

other_tasks:
  - name: Representation learning and domain adaptation
    description: >-
      The documented use cases include work on representation learning and domain adaptation using the
      de-identified derived features.
  - name: Multimodal integration
    description: >-
      The documented use cases include multimodal integration of the derived voice features with other
      health data.

prohibited_uses:
  - name: Re-identification attempts
    description: >-
      The registered-access license and associated data use agreement explicitly forbid attempts at
      re-identification of participants.
  - name: Stigmatizing or discriminatory applications
    description: >-
      Uses likely to stigmatize individuals or groups, and stigmatizing or discriminatory uses
      generally, are forbidden by the data use agreement.
  - name: Surveillance and high-stakes individual decision making
    description: >-
      The dataset is explicitly not intended for operational decision making about specific
      individuals such as hiring, insurance pricing, law enforcement or surveillance; such
      applications are forbidden under the data use agreement.

discouraged_uses:
  - name: Uninformed reliance on machine-generated annotations
    description: >-
      The crate states that transcripts and some derived features rely on off-the-shelf models that
      the dataset team has not independently audited for fairness, and that downstream users should
      consider these tools' biases when interpreting results.

future_use_impacts:
  - name: Anticipated benefits and risks
    description: >-
      The project aims to create an ethically sourced, diverse voice dataset to support research on
      using voice as an accessible, low-cost biomarker for screening, diagnosis and monitoring of a
      broad range of health conditions, potentially improving early detection and care for underserved
      populations. At the same time, the consortium explicitly recognizes the risks associated with
      voice data, including privacy loss, misuse of voice biometrics and algorithmic harms such as
      discrimination in hiring, insurance or surveillance contexts; these risks motivate a governance
      framework with IRB oversight, rigorous de-identification, separation of feature-only and
      raw-audio tiers and usage restrictions encoded in the registered-access license and data use
      agreement. Dataset documentation and ongoing ethics workstreams are intended to help downstream
      users reason about these risks and design responsible analyses and models.

distribution_formats:
  - name: Parquet feature tables
    description: >-
      Derived acoustic, articulatory and phonetic features are stored as dense tensors in Apache
      Parquet files with participant, session and task identifiers.
  - name: Tab-separated phenotype tables with JSON dictionaries
    description: >-
      Phenotype, questionnaire, diagnosis, enrollment and task tables are distributed as
      tab-separated-values files (media type text/tab-separated-values) with accompanying JSON data
      dictionaries; static per-recording feature summaries are provided in static_features.tsv.
  - name: RO-Crate JSON-LD metadata
    description: >-
      The package is distributed as an RO-Crate conforming to https://w3id.org/ro/crate/1.2 with
      machine-readable JSON-LD metadata using schema.org vocabulary, EVI provenance terms and
      Croissant RAI properties, produced with fairscape version 1.0.24. A Merkle root hash
      (f1663e1069a9894b21202ebf05f4839b9fb82b79ba5b337df54dd18f36d3be47) is recorded for the crate.

distribution_dates:
  - name: Version 3.0.0
    description: Published 2025-12-16 (recorded in the crate as 12/16/2025).
  - name: Earlier versions
    description: >-
      v1.0 was the initial public release in 2024; v1.1 was released on 2025-01-17, v2.0.0 on
      2025-04-16 and v2.0.1 on 2025-08-18.

third_party_sharing:
  - name: PhysioNet registered access
    description: >-
      The dataset is published by PhysioNet as a limited dataset available with a data use agreement.
      Conditions of access are published at https://physionet.org/content/b2ai-voice/view-dua/3.0.0/
      and use is restricted to authorized researchers under a registered-access license.
  - name: Controlled-access raw audio tier
    description: >-
      Access to the underlying raw voice audio is not part of this distribution and is available only
      through a separate controlled-access process.

license_and_use_terms:
  name: PhysioNet registered-access license and data use agreement
  description: >-
    The release is governed by the PhysioNet license at
    https://physionet.org/content/b2ai-voice/view-license/3.0.0/ and the data use agreement at
    https://physionet.org/content/b2ai-voice/view-dua/3.0.0/. The agreement restricts use to
    authorized researchers and explicitly forbids attempts at re-identification, stigmatizing or
    discriminatory uses and applications such as surveillance or high-stakes individual decision
    making. Schema descriptions embedded in the crate are individually labelled with
    https://creativecommons.org/licenses/by/4.0/.

ip_restrictions:
  name: Copyright and schema licensing
  description: >-
    The crate records the copyright notice "Copyright (c) 2026 University of South Florida all rights
    reserved". The EVI schema descriptions embedded in the crate carry a Creative Commons Attribution
    4.0 license. Redistribution of the data itself is governed by the PhysioNet license and data use
    agreement.

regulatory_restrictions:
  name: Regulatory status and access controls
  description: >-
    The crate records that the dataset is not FDA-regulated (fdaRegulated false), that it constitutes
    human subjects research that is not exempt (humanSubjectResearch "Yes", humanSubjectExemption
    "No"), and that it is de-identified and released as a limited dataset under a data use agreement
    with institutional review board oversight. No export-control designations such as ITAR or EAR are
    recorded in the crate.

maintainers:
  - name: Bridge2AI-Voice project team
    description: >-
      Releases are coordinated by the Bridge2AI-Voice project team. General contact is provided at
      https://b2ai-voice.org/contact-us/.
  - name: MIT Laboratory for Computational Physiology
    description: >-
      Co-coordinates releases with the Bridge2AI-Voice project team through PhysioNet.
  - name: Satrajit Ghosh
    description: Recorded in the crate as the data governance committee for the dataset.
  - name: Yael Bensoussan
    description: Principal investigator.

updates:
  name: Release and maintenance plan
  description: >-
    Dataset releases follow a static versioning scheme managed through PhysioNet and related
    platforms, with version numbers such as 1.0, 1.1, 2.0.0, 2.0.1 and 3.0.0 and associated DOIs for
    each snapshot and for the latest version. Releases are coordinated by the Bridge2AI-Voice project
    team and the MIT Laboratory for Computational Physiology; release notes document added
    participants, new feature sets, reorganized phenotype tables and corrections. Future updates are
    planned as additional participants are enrolled and Spanish-language protocols are incorporated;
    older versions remain accessible for reproducibility while users are encouraged to adopt the
    latest version.

version_access:
  name: Access to prior versions
  description: >-
    Each release snapshot is assigned its own DOI in addition to a DOI for the latest version, and
    older versions remain accessible for reproducibility while users are encouraged to adopt the
    latest version.

errata:
  - name: Corrections documented in release notes
    description: >-
      Release notes document added participants, new feature sets, reorganized phenotype tables and
      corrections such as spectrogram reprocessing and authorship updates. No per-record erratum list
      is provided in the crate.

retention_limit:
  name: Retention of prior snapshots
  description: >-
    Releases are static snapshots and older versions remain accessible for reproducibility. No
    deletion schedule or retention limit is documented in the crate.

extension_mechanism:
  name: Extension through project releases and open-source tooling
  description: >-
    The crate documents no formal mechanism for third parties to contribute records to the dataset.
    Extension occurs through project-managed releases as additional participants are enrolled and
    Spanish-language protocols are incorporated. The preprocessing and curation code is openly
    available as the b2aiprep library at https://github.com/sensein/b2aiprep, which others can extend.

