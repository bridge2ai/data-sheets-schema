data_collectors:
  - name: Clinical investigators and research staff at participating North American institutions
    description: >-
      Clinical annotations, including diagnostic labels and certain phenotype variables, are created
      by clinicians and research staff at participating North American institutions spanning
      otolaryngology, neurology, neuroscience, pulmonology and allied health disciplines. Detailed
      demographic breakdowns of these annotators are not provided in the crate documentation.
  - name: Study participants (self-report)
    description: >-
      Questionnaire-based labels reflect self-reported information provided by participants
      themselves through the study application and REDCap instruments.

acquisition_methods:
  - name: Directly observed acoustic tasks
    description: >-
      Structured voice and respiratory tasks, such as sustained vowels, coughs and reading passages,
      were directly recorded from participants during in-clinic sessions using a mobile or tablet
      application.
  - name: Self-reported questionnaire responses
    description: >-
      Demographic questions, health history, disease-specific validated questionnaires and other
      patient-reported outcomes were reported by participants and captured in REDCap.
  - name: Indirectly acquired clinical data
    description: >-
      Clinical diagnoses and other metadata were extracted from electronic health records and
      recorded by clinical investigators and care teams.
  - name: Derived feature computation
    description: >-
      All released acoustic representations are derived rather than directly observed: spectrograms,
      mel spectrograms, MFCCs, articulatory and prosodic features and phonetic posteriorgrams were
      computed from the standardized audio.

collection_mechanisms:
  - name: Bridge2AI-Voice mobile and tablet application
    description: >-
      Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic
      tasks and questionnaires; recordings used tablet or smartphone devices with headset microphones
      when available.
  - name: REDCap
    description: >-
      REDCap-based data capture system used to manage clinical and phenotype data; tabular phenotype
      and questionnaire files are exported from REDCap for release.
  - name: Electronic health record systems
    description: >-
      Electronic health record systems used as a source of some gold-standard diagnostic information.
  - name: Validated questionnaire instruments
    description: >-
      Participants completed validated instruments including VHI-10, PHQ-9, GAD-7, PANAS, the
      Leicester Cough Questionnaire, the Dyspnea Index, DSM-5 cross-cutting items, ADHD and PTSD
      screens, and additional cognitive and speech tasks such as Stroop, Winograd schemas, productive
      vocabulary, Harvard sentences and random item generation.

sampling_strategies:
  - name: Non-probability clinic-based cohort sampling
    description: >-
      Participants are recruited from specialty clinics and associated institutions using a
      non-probability sampling strategy. Eligible adults presenting to voice, neurology, psychiatry
      and respiratory clinics, plus healthy controls, were screened against predefined inclusion and
      exclusion criteria, with inclusion focused on specific disease cohorts and fluent English
      speakers. This produces clinically enriched case mixes that may not represent general
      population distributions.

collection_timeframes:
  - name: Adult flagship cohort collection window
    description: >-
      Data collection for the adult flagship cohort began after project launch in 2023 and is ongoing
      across five North American sites toward an anticipated enrollment of approximately 3,000
      participants by November 2026; the participants and recordings included in dataset version
      3.0.0 were collected roughly between 2023 and 2025.
  - name: Static release snapshots
    description: >-
      Dataset releases are static snapshots: v1.0 (initial public release in 2024), v1.1
      (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), each
      corresponding to a frozen state of the underlying data collection.

direct_collection:
  - name: Direct in-clinic collection with indirect EHR supplementation
    description: >-
      Voice, respiratory and questionnaire data were collected directly from the individuals
      concerned during prospective in-clinic sessions after informed consent. Most participants
      completed a single in-clinic session and a subset completed repeated sessions. Some
      gold-standard diagnostic information was obtained indirectly from electronic health record
      systems rather than from the participants themselves.

collection_consents:
  - name: Informed consent prior to protocol administration
    description: >-
      After informed consent, a standardized protocol combining structured voice and respiratory
      tasks with demographic questions, health history, disease-specific questionnaires and other
      patient-reported outcomes was administered.

informed_consent:
  - name: Study informed consent
    description: >-
      Eligible adults were screened against predefined inclusion and exclusion criteria and provided
      informed consent before any study procedures were administered. The crate does not describe the
      consent document contents or a withdrawal procedure.

ethical_reviews:
  - name: University of South Florida Institutional Review Board
    description: >-
      Institutional oversight is provided by the University of South Florida Institutional Review
      Board, 3702 Spectrum Blvd., Suite 165 USF, Tampa, FL 33620, US; contact RSCH-IRB@usf.edu,
      telephone (813) 974-5638. The crate records the IRB protocol identifier as empty and states
      that the work is human subjects research and is not exempt.
  - name: Bioethics review
    description: >-
      Ethical review by Vardit Ravitsky at the Hastings Center for Bioethics.

human_subject_research:
  name: Human subjects research with IRB oversight
  description: >-
    The dataset derives from a prospective observational human subjects study conducted at multiple
    specialty clinics and academic hospitals across North America. The crate records
    humanSubjectResearch "Yes", humanSubjects "Yes", humanSubjectExemption "No", fdaRegulated false
    and deidentified true, with oversight by the University of South Florida Institutional Review
    Board and additional bioethics review at the Hastings Center for Bioethics.

at_risk_populations:
  name: Adult-only cohort in this release
  description: >-
    Version 3.0.0 includes only an adult cohort; the crate notes that models trained solely on this
    dataset may not generalize to younger age groups. Eligibility fields anticipate paediatric age
    bands, but no minors are represented in this release. No additional safeguards or assent
    procedures for at-risk populations are documented in the crate.

participant_privacy:
  - name: De-identification and access control
    description: >-
      Direct identifiers and high-risk quasi-identifiers are removed, dates are coarsened or rebased,
      geographic information is generalized to the country level, narrative text fields and
      transcripts of free speech are removed, and raw voice waveforms are withheld from this
      feature-only release. Raw voice recordings, which are themselves biometric identifiers, are
      available only under a separate controlled-access process.
  - name: Use restrictions protecting participants
    description: >-
      Use of the data is restricted to authorized researchers under a registered-access license and
      associated data use agreement that explicitly forbids attempts at re-identification,
      stigmatizing or discriminatory uses and applications such as surveillance or high-stakes
      individual decision making.

is_deidentified:
  name: De-identified feature-only release
  description: >-
    The crate records deidentified as true. Prior to release, data are transformed to reduce
    re-identification risk and align with regulatory and ethical requirements: direct identifiers and
    high-risk quasi-identifiers are removed; dates are coarsened or rebased; geographic information
    is generalized to the country level; narrative text fields and transcripts of free speech are
    removed; raw voice waveforms are withheld; and additional filtering removes features for
    sensitive records and audio checks. Residual limitations are acknowledged: de-identification also
    removes granular demographic, socio-economic and narrative context, which constrains detailed
    fairness assessments and confounder adjustment.

instances:
  - name: Participant cohort
    description: >-
      Bridge2AI-Voice v3.0 contains data for 833 participants across five sites in North America.
      Participants may contribute multiple sessions over time; most completed a single in-clinic
      session and a subset completed repeated sessions.
  - name: Recording-level derived feature records
    description: >-
      Feature instances are stored as dense tensors in Parquet files keyed by participant_id,
      session_id and task_name, with an n_frames field; each row corresponds to one derived
      representation of one acoustic task recording.
  - name: Participant-level phenotype rows
    description: >-
      Phenotype instances are rows in thematically organized TSV files with accompanying JSON data
      dictionaries, covering demographics, confounders, diagnosis, enrollment, questionnaire and task
      tables. A row is included for a participant only when at least one variable is non-missing.

relationships:
  - name: Participant, session and task keys
    description: >-
      Derived feature tables and phenotype tables are linked through shared participant_id,
      session_id and task_name (or task-specific session and acoustic task identifiers), allowing
      recordings to be joined to clinical labels and questionnaire responses for the same participant
      and visit. Participants may have repeated visits with differing responses.

subpopulations:
  - name: Voice and upper airway disorder cohorts
    description: >-
      Disease-specific phenotype tables are provided for benign vocal fold lesions, precancerous
      lesions, laryngeal cancer, glottic insufficiency, unilateral vocal fold paralysis, laryngeal
      dystonia, laryngitis, muscle tension dysphonia and airway stenosis.
  - name: Neurological and neurodegenerative cohorts
    description: >-
      Disease-specific phenotype tables are provided for amyotrophic lateral sclerosis, Parkinson's
      disease, and Alzheimer's disease, dementia and mild cognitive impairment.
  - name: Mood and psychiatric cohorts
    description: >-
      Disease-specific phenotype tables are provided for depression, bipolar disorder, anxiety, PTSD,
      ADHD and general psychiatric history.
  - name: Respiratory cohorts
    description: >-
      Disease-specific phenotype tables are provided for COPD and asthma and for unexplained chronic
      cough.
  - name: Healthy controls
    description: >-
      Healthy controls were recruited alongside disease cohorts; a control phenotype table and a
      session-level control participant indicator are present.
  - name: Coarsened demographic strata
    description: >-
      Demographic variables such as age, sex and country of data collection are included in coarsened
      form, for example age bands. Finer-grained geographic identifiers and many socio-economic and
      cultural details have been removed during de-identification.

splits:
  - name: No predefined splits
    description: >-
      The dataset does not provide predefined train-validation-test splits or benchmarking tasks, so
      researchers must design their own evaluation protocols.

