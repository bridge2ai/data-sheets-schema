purposes:
  - name: Ethically sourced flagship voice dataset for AI research
    description: >-
      The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset to enable
      future research in artificial intelligence and support critical insights into the use of voice
      as a biomarker of health.
  - name: Link voice-derived data to clinical information
    description: >-
      To provide a comprehensive collection of data derived from voice recordings with corresponding
      clinical information for participants selected on the basis of conditions known to manifest
      within the voice waveform, including voice disorders, neurological disorders, mood disorders
      and respiratory disorders.
  - name: Low-risk feature-only public release
    description: >-
      To release data considered low risk, including derivations such as spectrograms but not the
      original voice recordings, alongside detailed demographic, clinical and validated questionnaire
      data, so that research can proceed without distributing raw biometric audio.

addressing_gaps:
  - name: Scarcity of ethically sourced, diverse voice datasets linked to health data
    description: >-
      The project addresses the absence of an ethically sourced, diverse voice dataset linked to
      health information that can support research on voice as an accessible, low-cost biomarker for
      screening, diagnosis and monitoring of a broad range of health conditions.
  - name: Access to voice data where raw biometrics cannot be shared
    description: >-
      Raw voice recordings are themselves biometric identifiers. The project addresses this barrier by
      separating a de-identified feature-only tier, released publicly under registered access, from a
      raw-audio tier available only through a separate controlled-access process.
  - name: Underserved populations in voice-based screening
    description: >-
      The consortium states that voice as an accessible, low-cost biomarker could potentially improve
      early detection and care for underserved populations.

tasks:
  - name: Voice-biomarker model development
    description: >-
      Development, training and fine-tuning of machine-learning models that associate voice-derived
      features with diagnostic categories or symptom severity for conditions such as vocal fold
      pathology, neurological and neurodegenerative diseases, mood and anxiety disorders and
      respiratory illnesses.
  - name: Benchmarking and external validation
    description: >-
      Benchmarking and validation of existing voice-biomarker algorithms by testing their performance
      on a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - name: Exploratory acoustic and articulatory research
    description: >-
      Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
      using de-identified derived features.
  - name: Fairness, robustness and AI safety methodology
    description: >-
      Methodological research on fairness, robustness and AI safety in clinical voice models,
      including studies of bias related to demographic subgroups or recording conditions, subject to
      the ethical constraints in the data use agreement.

