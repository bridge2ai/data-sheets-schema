was_derived_from: >-
  High-quality voice, speech and respiratory audio waveforms recorded on tablet or smartphone devices
  with headset microphones, together with structured demographic and medical history questionnaires,
  disease-specific validated questionnaires, other patient-reported outcomes, and clinical diagnoses
  and metadata extracted from electronic health records and managed in REDCap. The released files are
  de-identified derived representations produced with the open-source b2aiprep library.

