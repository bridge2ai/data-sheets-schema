at_risk_populations:
  name: Clinical populations with stigmatization exposure
  at_risk_groups_included: true
  description: The cohort is adult-only and includes participants with psychiatric, mood, neurological
    and neurodegenerative diagnoses, for whom the RO-Crate identifies stigmatization and discrimination
    as explicit risks.
  special_protections:
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset.
  - Raw voice recordings, which are themselves biometric identifiers, are made available only under controlled
    access.
  - The registered-access license and data use agreement explicitly forbid stigmatizing or discriminatory
    uses.
participant_privacy:
- name: De-identification and controlled-access privacy controls
  anonymization_method:
  - Direct identifiers and high-risk quasi-identifiers are removed.
  - Dates are coarsened or rebased.
  - Geographic information is generalized to the country level.
  - Narrative text fields and transcripts of free speech are removed.
  - Raw voice waveforms are withheld from this feature-only release.
  reidentification_risk:
  - Raw voice recordings are themselves biometric identifiers and are made available only under controlled
    access.
  - De-identification reduces the risk of re-identification but also limits detailed fairness assessments
    and certain confounder adjustments.
  - The data use agreement explicitly forbids attempts at re-identification.
  privacy_techniques:
  - Identifier removal and quasi-identifier suppression
  - Date coarsening and rebasing
  - Geographic generalization to country level
  - Removal of free-text and free-speech transcripts
  - Tiered release separating de-identified features from controlled-access raw audio
  data_linkage:
  - Within the release, records are linked by participant identifier, session identifier and task name
    across the feature and phenotype tables; no external linkage is described in the RO-Crate.
preprocessing_strategies:
- name: Audio standardization
  preprocessing_details:
  - Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing filtering; they
    are then segmented by task and passed through quality checks.
- name: Derived acoustic and articulatory feature extraction
  preprocessing_details:
  - From the standardized audio, multiple derived feature sets are computed including spectrograms, mel
    spectrograms, MFCCs, articulatory features using the Speech Articulatory Coding package, pitch and
    loudness estimates, acoustic features from openSMILE, phonetic and prosodic features from Praat and
    parselmouth, and phonetic posteriorgrams using a dedicated model; all are stored as dense tensors
    in Parquet files with participant, session and task identifiers.
  used_software:
  - &id001
    id: https://github.com/sensein/b2aiprep
    name: B2AIPrep Library
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project. The
      RO-Crate records it as the software used by both the VOICE Features Processing and VOICE Phenotype
      Ingest computations.
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
- name: Phenotype export and reorganization
  preprocessing_details:
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using a dedicated open-source
    b2aiprep library, reorganizing the former single phenotype table into thematically organized TSV files
    with accompanying JSON data dictionaries; static per-recording feature summaries are provided in static_features.tsv,
    and de-identification and filtering steps are applied before packaging.
  used_software:
  - *id001
cleaning_strategies:
- name: Pre-release transformation and filtering
  cleaning_details:
  - Prior to release, data are transformed to reduce re-identification risk and align with regulatory
    and ethical requirements.
  - Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or rebased; geographic
    information is generalized to the country level; narrative text fields and transcripts of free speech
    are removed; and raw voice waveforms are withheld from this feature-only release.
  - Additional filtering removes features for sensitive records and audio checks, and some derived features
    are dropped when processing fails or quality checks fail.
labeling_strategies:
- name: Clinical and questionnaire-derived labeling
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.
  data_annotation_protocol:
  - Annotations for this dataset consist primarily of clinical labels and questionnaire-derived measures
    associated with each participant and recording. Participants complete validated instruments such as
    VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough questionnaires and voice instruments, which generate
    numerical scores and categorical indicators according to each instrument's published scoring guidelines.
    Clinical investigators and care teams record diagnostic categories for voice, neurological, mood and
    respiratory conditions and other phenotype variables, drawing on clinical assessments and electronic
    health records; these labels are represented in disease-specific TSV files with accompanying JSON
    dictionaries. In addition, machine-generated transcripts of certain voice tasks and numerous automatically
    extracted acoustic and articulatory features provide further labels and descriptors at the recording
    level.
  annotations_per_item: 1
  inter_annotator_agreement: Diagnostic labels are derived from clinical assessments and electronic health
    records rather than crowd workers, so there is no explicit inter-rater majority-vote scheme and no
    per-annotator disagreement statistics are reported.
  annotator_demographics:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines; detailed demographic breakdowns
    of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves, whose demographics
    are captured in coarsened form in the phenotype tables, for example age bands, sex and country of
    data collection; however, per-annotator demographic information, such as which specific clinician
    or staff member entered a label, is not exposed.
  labeling_details:
  - Each recording is associated with one set of clinical labels and questionnaire responses derived from
    a single participant, although participants may contribute multiple sessions over time; there is no
    crowd-sourced labeling and the documentation does not report multiple independent human ratings per
    individual recording.
raw_sources:
- name: Controlled-access raw audio tier
  raw_data_details:
  - The original raw voice, speech and respiratory audio waveforms are retained by the project but withheld
    from the public feature-only release.
  - Access to the underlying raw audio is available only through a separate controlled-access process;
    the RO-Crate does not record a URL for that process.
imputation_protocols:
- name: No global imputation
  imputation_method:
  - No global statistical imputation is applied to missing fields.
  imputation_rationale: The public datasets do not apply global statistical imputation to missing fields;
    instead, missing questionnaire responses, phenotype variables and derived features are left as explicit
    missing values or omitted rows, so that users can implement study-specific imputation or complete-case
    strategies appropriate to their analyses.
  imputation_validation:
  - The data release team audited missingness across the released files.
annotation_analyses:
- name: Instrument scoring and release-team audit
  analysis_method: Questionnaire-based labels are generated using the standard scoring rules for each
    validated instrument, yielding total and subscale scores that can be mapped to symptom-severity bands;
    the scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  disagreement_patterns:
  - Diagnostic labels are derived from clinical assessments and electronic health records rather than
    crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses are treated
    as reference labels and may include multiple comorbid conditions per participant.
  annotation_quality_details:
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues, but per-annotator disagreement statistics or detailed
    label-uncertainty measures are not presently included in the released dataset.
machine_annotation_tools:
- name: Automated feature extraction and transcription toolchain
  tools:
  - OpenSMILE
  - Praat
  - parselmouth
  - TorchAudio
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram models
  - OpenAI Whisper Large
  - b2aiprep
  tool_descriptions:
  - OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including measures
    of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units for each
    recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and merging of
    phenotype data into the released files.
  tool_accuracy:
  - The dataset team has not independently audited these tools for fairness; performance of off-the-shelf
    models such as OpenAI Whisper may vary across demographic groups.
  - The RO-Crate reports no accuracy or error-rate measurements for any of these tools.
  used_software:
  - *id001
future_use_impacts:
- name: Risks and constraints affecting future use
  impact_details:
  - Risks associated with voice data include privacy loss, misuse of voice biometrics and algorithmic
    harms such as discrimination in hiring, insurance or surveillance contexts.
  - Because the release excludes raw audio and free-speech transcripts, future users cannot reproduce
    end-to-end audio pipelines from this release alone.
  - Clinically enriched case mixes may inflate model performance when evaluated within this dataset, so
    future users should validate externally before drawing generalizable conclusions.
  - Dataset documentation and ongoing ethics workstreams are intended to help downstream users reason
    about these risks and design responsible analyses and models.
discouraged_uses:
- name: Operational decision making about individuals
  discouragement_details:
  - The dataset is explicitly not intended for operational decision making about specific individuals
    such as hiring, insurance pricing, law enforcement or surveillance, nor for attempts at re-identification
    or for uses likely to stigmatize individuals or groups.
intended_uses:
- name: Voice-biomarker research uses
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived features
    with diagnostic categories or symptom severity for conditions such as vocal fold pathology, neurological
    and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance on
    a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
    de-identified derived features, including work on representation learning, domain adaptation and multimodal
    integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
  use_category:
  - Machine-learning model development
  - Algorithm benchmarking and validation
  - Exploratory acoustic and clinical research
  - Methodological research on fairness, robustness and AI safety
  usage_notes: All uses are subject to the ethical constraints in the registered-access data use agreement.
prohibited_uses:
- name: Re-identification, stigmatization, surveillance and high-stakes individual decisions
  prohibition_reason:
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
distribution_formats:
- name: PhysioNet release of the feature-only dataset
  description: The RO-Crate records a total contentSize of 12.9 GB for release 3.0.0, distributed through
    PhysioNet under DOI https://doi.org/10.13026/k81f-qr68 and identified by the crate ARK ark:59853/rocrate-b2ai-voice-3.0.0.
    The release is packaged as a self-contained RO-Crate conforming to RO-Crate 1.2, with Croissant RAI
    properties carrying the responsible-AI documentation; it documents 15 data entities, 55 declared column
    schemas, 2 computations and 1 software component. Checksums are recorded for 11 of the 17 files the
    crate counts, and the crate carries a package-level Merkle root hash of f1663e1069a9894b21202ebf05f4839b9fb82b79ba5b337df54dd18f36d3be47.
  access_urls:
  - https://doi.org/10.13026/k81f-qr68
- name: Parquet derived-feature tables
  description: Nine derived acoustic and articulatory feature tables stored as Apache Parquet files under
    features/, totalling 13,788,089,083 bytes. The RO-Crate leaves the format field empty for these files;
    the Parquet format is taken from their file names, and each has a declared column schema and SHA-256
    checksum.
- name: Tab-separated phenotype tables
  description: Phenotype, questionnaire, diagnosis, enrollment and acoustic-task tables released with
    media type text/tab-separated-values under phenotype/, with accompanying JSON data dictionaries. Byte
    counts and checksums are recorded only for confounders.tsv and demographics.tsv.
