variables:
- variable_name: participant_id
  description: Participant identifier present in every released feature and phenotype table. The RO-Crate
    schemas type it as string in the Parquet feature schemas and as integer in the tab-separated phenotype
    schemas.
  data_type: identifier
  is_identifier: true
- variable_name: session_id
  description: Session identifier present in the feature tables and, under table-specific names such as
    confounders_session_id and mph_session_id, in the phenotype tables. Participants may contribute multiple
    sessions.
  data_type: identifier
  is_identifier: true
- variable_name: task_name
  description: Name of the structured acoustic task a feature row was computed from; present in every
    feature table.
  data_type: categorical
- variable_name: n_frames
  description: Number of frames in the dense feature tensor stored on the same row; present in every Parquet
    feature table.
  data_type: integer
- variable_name: transcription
  description: Machine-generated transcript column in the static features table, produced with OpenAI
    Whisper Large. Transcripts of free-speech audio were removed before release.
  data_type: string
  is_sensitive: true
- variable_name: selected_language
  description: Language selected by the participant, recorded in the participant table.
  data_type: categorical
- variable_name: session_duration
  description: Duration of a session, recorded in the session table.
  data_type: float
- variable_name: acoustic_task_name
  description: Name of the acoustic task administered, recorded in the acoustic task table alongside task
    cohort, duration, identifiers and status.
  data_type: categorical
is_deidentified:
  name: De-identified feature-only release
  identifiable_elements_present: false
  method: Removal of direct identifiers and high-risk quasi-identifiers, coarsening or rebasing of dates,
    generalization of geographic information to the country level, removal of narrative text fields and
    free-speech transcripts, and withholding of raw voice waveforms from this feature-only release.
  identifiers_removed:
  - Direct identifiers
  - High-risk quasi-identifiers
  - Precise dates (coarsened or rebased)
  - Sub-country geographic identifiers
  - Narrative text fields and free-speech transcripts
  - Raw voice waveforms (biometric identifiers)
  - Detailed narrative responses, some household income information, traumatic life experiences and granular
    cultural identifiers
  deidentification_details:
  - The RO-Crate records the release as de-identified.
  - Prior to release, data are transformed to reduce re-identification risk and align with regulatory
    and ethical requirements.
  - Demographic variables such as age, sex and country of data collection are retained in coarsened form.
