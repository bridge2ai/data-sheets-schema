instances:
- name: Participant
  instance_type: Adult human research participant
  counts: 833
  description: Bridge2AI-Voice v3.0 contains data for 833 participants across five sites in North America.
    Participants were selected based on known conditions which manifest within the voice waveform including
    voice disorders, neurological disorders, mood disorders, and respiratory disorders.
  label: true
  label_description: Each participant carries clinical diagnostic labels for voice, neurological, mood
    and respiratory conditions, recorded in disease-specific tables, together with scored responses to
    validated questionnaire instruments.
- name: Recording-level derived feature record
  instance_type: Derived acoustic or articulatory feature tensor
  description: Each row of the released Parquet feature tables holds a dense feature tensor for one recording,
    keyed by participant identifier, session identifier and task name, with a frame count. Feature families
    include phonetic posteriorgrams, articulatory coding outputs, pitch, loudness, periodicity, MFCCs,
    spectrograms and mel spectrograms.
  label: false
- name: Phenotype table row
  instance_type: Tabular phenotype or questionnaire record
  description: Each row of the released tab-separated phenotype tables holds questionnaire, demographic,
    confounder, diagnosis, enrollment or acoustic-task information for one participant, and in several
    tables for one session. Phenotype tables include a row for a participant only when at least one variable
    is non-missing.
  label: true
  label_description: Questionnaire-derived scores and clinical diagnostic categories act as labels at
    the participant and session level.
anomalies:
- name: Dropped and failed derived features
  anomaly_details:
  - Some derived audio features could not be computed for all recordings due to quality or length constraints.
  - Additional filtering removes features for sensitive records and audio checks, and some derived features
    are dropped when processing fails or quality checks fail.
known_biases:
- name: Sampling bias
  bias_type: sampling_bias
  bias_description: Participants are recruited from specialty clinics and associated institutions using
    a non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
    English speakers; this produces clinically enriched case mixes that may not represent general population
    distributions.
- name: Geographic and cultural bias
  bias_type: representation_bias
  bias_description: Data are collected at a limited number of North American sites, and although the project
    seeks diversity, it may under-represent speakers from other regions, cultures, languages and healthcare
    systems; early releases focus on English, with Spanish protocols planned but not yet fully represented.
- name: Clinical spectrum bias
  bias_type: selection_bias
  bias_description: Because participants are selected into disease cohorts where voice changes are expected,
    the prevalence and severity of conditions in the dataset differ from those in routine primary care
    or community settings, which may inflate model performance when evaluated within this dataset.
- name: Device and environment bias
  bias_type: measurement_bias
  bias_description: Recordings are made using standardized but not identical hardware and primarily in
    clinical environments; future at-home collection or deployment on other devices may encounter different
    background noise, channel characteristics and user behavior.
- name: Algorithmic bias in machine annotations
  bias_type: algorithmic_bias
  bias_description: Transcripts and some derived features rely on off-the-shelf models such as OpenAI
    Whisper and other audio toolkits whose performance may vary across demographic groups; the dataset
    team has not independently audited these tools for fairness, so downstream users should consider their
    biases when interpreting results.
  mitigation_strategy: The RO-Crate discloses the annotation toolchain so that downstream users can account
    for tool-specific bias; no independent fairness audit of these tools is reported.
known_limitations:
- name: Feature-only release without raw audio
  limitation_type: scope_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may constrain the ability
    to reproduce end-to-end audio pipelines.
- name: Adult, largely English-language cohort
  limitation_type: coverage_limitation
  limitation_description: This version only includes an adult cohort; models trained solely on this dataset
    may not generalize to younger age groups or to languages beyond those represented.
- name: De-identification reduces variable granularity
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed, which reduces the risk of re-identification
    but also limits detailed fairness assessments and certain confounder adjustments.
- name: No predefined splits, benchmarks or label-uncertainty measures
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train-validation-test splits or benchmarking
    tasks and does not include explicit per-instance label-uncertainty measures, so researchers must design
    their own evaluation protocols and handle label noise and missingness.
  recommended_mitigation: Researchers should design and report their own evaluation protocols and explicitly
    handle label noise and missingness.
- name: Access governance constrains participation and reproducibility
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers and can complicate the
    reproducibility of pipelines that require both features and raw audio.
confidential_elements:
- name: Limited dataset released under a data use agreement
  confidential_elements_present: true
  confidentiality_details:
  - The RO-Crate records the confidentiality level as 'Limited dataset available with Data Use Agreement'.
  - Conditions of access are published at https://physionet.org/content/b2ai-voice/view-dua/3.0.0/.
subpopulations:
- name: Disease cohorts and coarsened demographic strata
  subpopulation_elements_present: true
  identification:
  - 'Disease cohorts are identifiable from the per-condition diagnosis tables declared in the RO-Crate:
    ADHD (adult), airway stenosis, amyotrophic lateral sclerosis, anxiety, benign lesions, bipolar disorder,
    cognitive impairment, control, COPD and asthma, depression, glottic insufficiency, laryngeal cancer,
    laryngeal dystonia, laryngitis, muscle tension dysphonia, Parkinson''s disease, precancerous lesions,
    psychiatric history, PTSD (adult), unexplained chronic cough and unilateral vocal fold paralysis.'
  - Demographic variables such as age, sex and country of data collection are included in coarsened form.
  - Participants are grouped into voice, neurological, mood and respiratory disorder cohorts plus healthy
    controls.
  distribution:
  - The RO-Crate does not report per-cohort or per-stratum participant counts for the 833 participants
    in release 3.0.0.
sensitive_elements:
- name: Sensitive health, demographic and biometric content
  sensitive_elements_present: true
  sensitivity_details:
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory diseases,
    as well as symptom scores from questionnaires, which constitute sensitive personal health data.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    while finer-grained geographic identifiers, direct identifiers and many socio-economic and cultural
    details have been removed during de-identification to reduce re-identification risk.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset; raw voice recordings, which are themselves biometric identifiers, are made
    available only under controlled access.
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
relationships:
- name: Keys linking feature and phenotype tables
  relationship_details:
  - Every released feature table is keyed by participant_id, session_id and task_name, so feature rows
    join to the acoustic-task and session tables and, through participant_id, to the demographic, confounder,
    diagnosis, enrollment and questionnaire tables.
  - Participants may contribute multiple sessions over time, and several phenotype tables carry their
    own session identifier column, so participant-level and session-level records form a one-to-many hierarchy.
splits:
- name: No predefined splits
  split_details:
  - The dataset does not provide predefined train-validation-test splits or benchmarking tasks, so researchers
    must design their own evaluation protocols.
acquisition_methods:
- name: Mixed direct measurement, self-report and derivation
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The RO-Crate records the data collection types as direct measurement, surveys, self-reporting, secondary
    data analysis and document analysis.
  - Voice, speech and respiratory audio were captured directly during structured tasks; demographic, health-history
    and questionnaire responses were self-reported by participants.
  - 'All released acoustic content is derived: spectrograms, mel spectrograms, MFCCs, articulatory and
    prosodic features and phonetic posteriorgrams are computed from the raw waveforms.'
  - Clinical diagnoses and other metadata were extracted from electronic health records, and the data
    release team audited the combined phenotype and feature tables for internal consistency, missingness
    patterns and data entry issues.
collection_mechanisms:
- name: In-clinic app capture with REDCap and EHR extraction
  mechanism_details:
  - Data were captured on a mobile or tablet application and stored in REDCap, with most participants
    completing a single in-clinic session and a subset completing repeated sessions.
  - A custom Bridge2AI-Voice mobile and tablet application was used for in-clinic collection of acoustic
    tasks and questionnaires.
  - A REDCap-based data capture system was used to manage clinical and phenotype data.
  - Electronic health record systems were used as a source of some gold-standard diagnostic information.
  - High-quality audio was recorded on tablet or smartphone devices with headset microphones when available.
sampling_strategies:
- name: Non-probability clinic-based cohort sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Eligible adults presenting to voice, neurology, psychiatry and respiratory clinics at multiple specialty
    clinics and academic hospitals across North America, plus healthy controls.
  strategies:
  - Non-probability sampling from specialty clinics and associated institutions.
  - Inclusion focused on specific disease cohorts and fluent English speakers.
  - Eligible adults were screened against predefined inclusion and exclusion criteria before consent.
  why_not_representative:
  - The non-probability strategy produces clinically enriched case mixes that may not represent general
    population distributions.
  - Collection at a limited number of North American sites may under-represent speakers from other regions,
    cultures, languages and healthcare systems.
  - Disease-cohort selection means prevalence and severity differ from routine primary care or community
    settings.
data_collectors:
- name: Clinicians and research staff at participating institutions
  role: Clinical data collection and annotation
  collector_details:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines.
  - Detailed demographic breakdowns of the collecting and annotating staff are not provided in the RO-Crate.
collection_timeframes:
- name: Ongoing collection with static release snapshots
  timeframe_details:
  - Data collection for the adult flagship cohort began after project launch in 2023 and is ongoing across
    five North American sites toward an anticipated enrollment of approximately 3,000 participants by
    November 2026; the participants and recordings included in dataset version 3.0.0 were collected roughly
    between 2023 and 2025.
  - 'Dataset releases are static snapshots: v1.0 (initial public release in 2024), v1.1 (2025-01-17),
    v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), each corresponding to a frozen state
    of the underlying data collection.'
direct_collection:
- name: Collected directly from participants
  is_direct: true
  collection_details:
  - Data were obtained directly from participants during in-clinic sessions in which a standardized protocol
    combined structured voice and respiratory tasks such as sustained vowels, coughs and reading passages
    with demographic questions, health history, disease-specific questionnaires and other patient-reported
    outcomes.
  - Clinical diagnoses and other metadata were additionally extracted from electronic health records rather
    than collected directly from participants.
collection_consents:
- name: Informed consent before protocol administration
  consent_details:
  - After informed consent, a standardized protocol was administered that combined structured voice and
    respiratory tasks with demographic questions, health history, disease-specific questionnaires and
    other patient-reported outcomes.
missing_data_documentation:
- name: Documented missingness without imputation
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  - Some derived audio features could not be computed for all recordings due to quality or length constraints.
  missing_data_causes:
  - Variable questionnaire completion across participants and cohorts.
  - Audio quality or length constraints preventing feature computation.
  - Deliberate removal of features relating to free speech or sensitive records during de-identification.
  handling_strategy: No additional imputation is applied in the released files; missing values are left
    explicit or the corresponding rows are omitted.
raw_data_sources:
- name: Raw audio, questionnaire responses and EHR extracts
  source_description: The original raw data consist of high-quality voice, speech and respiratory audio
    waveforms recorded on tablet or smartphone devices with headset microphones when available, plus responses
    to structured demographic and medical history questionnaires, disease-specific validated questionnaires
    and other patient-reported outcomes, together with clinical diagnoses and other metadata extracted
    from electronic health records.
  source_type:
  - Voice, speech and respiratory audio waveforms
  - Structured demographic and medical history questionnaires
  - Disease-specific validated questionnaires
  - Other patient-reported outcomes
  - Clinical diagnoses and metadata extracted from electronic health records
  access_details: The public feature-only PhysioNet release contains de-identified derived representations
    of the audio together with tabular phenotype files and data dictionaries; access to the underlying
    raw audio is available only through a separate controlled-access process.
