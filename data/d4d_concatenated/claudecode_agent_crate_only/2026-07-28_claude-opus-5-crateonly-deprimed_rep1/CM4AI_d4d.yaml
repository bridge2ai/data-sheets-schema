purposes:
- id: d4d:cm4ai-purpose-ai-ready-cell-maps
  name: Produce AI-ready maps of human cell architecture
  response: >-
    CM4AI produces AI-ready datasets of human cell architecture from disease-relevant
    cell lines, packaged with provenance graphs and rich metadata in RO-Crate format
    using the FAIRSCAPE framework, so that the measurements can be used directly for
    machine learning and functional genomics research.
- id: d4d:cm4ai-purpose-bridge2ai-grand-challenge
  name: Serve as the Functional Genomics Grand Challenge resource of the NIH Bridge2AI
    program
  response: >-
    CM4AI (CM4AI.org) is the Functional Genomics Grand Challenge in the NIH Bridge2AI
    program, and the release series is its data output, delivered as quarterly releases
    through the end of the project in November 2026.

tasks:
- id: d4d:cm4ai-task-functional-genomics
  name: Functional genomics research
  response: AI-ready datasets to support research in functional genomics.
- id: d4d:cm4ai-task-ml-training
  name: AI and machine learning model training
  response: AI-ready datasets to support AI/machine learning model training.
- id: d4d:cm4ai-task-cellular-process-analysis
  name: Cellular process and cell architecture analysis
  response: >-
    Analysis of cellular processes, cell architectural changes, and interactions in
    the presence of specific disease processes, treatment conditions, or genetic perturbations.
- id: d4d:cm4ai-task-interpretable-ml
  name: Biologically-driven, interpretable machine learning
  response: >-
    A major goal is to enable biologically-driven, interpretable ML applications,
    for example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020
    (PMID: 33096023).

addressing_gaps:
- id: d4d:cm4ai-gap-ai-ready-multimodal-cell-architecture
  name: Lack of AI-ready multimodal measurements of human cell architecture
  response: >-
    The release series addresses the absence of AI-ready, provenance-complete multimodal
    measurements of human cell architecture from disease-relevant cell lines by combining
    protein-protein interaction (SEC-MS and AP-MS), protein localization (IF imaging),
    and CRISPRi perturb-seq modalities in a single documented package with machine-readable
    provenance graphs.
- id: d4d:cm4ai-gap-interpretable-ml
  name: Lack of substrates for interpretable machine learning in cell biology
  response: >-
    A major goal is to enable biologically-driven, interpretable ML applications,
    for example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020
    (PMID: 33096023).

