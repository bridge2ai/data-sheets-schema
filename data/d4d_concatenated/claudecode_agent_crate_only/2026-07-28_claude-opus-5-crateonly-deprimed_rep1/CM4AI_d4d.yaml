version_access:
  id: d4d:cm4ai-version-access
  name: Access to releases of the series
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
  - Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta), version
    1.0, published 2026-06-30, DOI https://doi.org/10.18130/V3/HIGT4C (current release).
  - Cell Maps for Artificial Intelligence - January 2026 Data Release, referenced
    only as a schema:isPartOf target of constituent collections.
  - Cell Maps for Artificial Intelligence - October 2025 Data Release, referenced
    only as a schema:isPartOf target of constituent collections.
  - Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta), referenced
    only in the citation strings carried by constituent collections.
  version_details:
  - Releases are cumulative; constituent collections declare schema:isPartOf against
    several successive releases, and collections first published in earlier releases
    are carried forward into the current one.
  - The crate's citation strings associate two different DOIs with the title "Cell
    Maps for Artificial Intelligence - March 2025 Data Release (Beta)", namely https://doi.org/10.18130/V3/B35XWX
    and https://doi.org/10.18130/V3/K7TGEM. The crate evidence does not resolve which
    identifies that release, so no DOI is asserted for it here.
  - Constituent collections carry their own independent version numbers, ranging from
    0.1.0 for the IF image collections to 1.5 for the treated-cancer-cell SEC-MS collection.
