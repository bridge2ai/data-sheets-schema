use_repository:
- id: d4d:cm4ai-use-repository
  name: Related publications listing in the Virginia Dataverse record
  repository_url: https://dataverse.lib.virginia.edu/
  repository_details:
  - The conditions of access direct users to cite the Related Publications listed
    alongside the data collection in the Virginia Dataverse record, which serves as
    the listing of works associated with the release.

intended_uses:
- id: d4d:cm4ai-intended-uses
  name: Intended uses of the release series
  usage_notes: The current release is most suitable for bioinformatics analysis of
    the individual datasets and requires domain expertise for meaningful analysis.
  use_category:
  - functional genomics research
  - AI/machine learning model training
  - cellular process and cell architecture analysis
  examples:
  - AI-ready datasets to support research in functional genomics, AI/machine learning
    model training, cellular process analysis, cell architectural changes, and interactions
    in presence of specific disease processes, treatment conditions, or genetic perturbations.
  - 'A major goal is to enable biologically-driven, interpretable ML applications,
    for example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020
    (PMID: 33096023).'

discouraged_uses:
- id: d4d:cm4ai-discouraged-uses
  name: Uses discouraged for the current release
  discouragement_details:
  - The current release is most suitable for bioinformatics analysis of the individual
    datasets; integrated cross-modality analysis is constrained because SEC-MS, IF
    imaging, and CRISPRi perturbSeq interrogate incompletely overlapping protein sets.
  - Analyses requiring predicted or computed cell maps are not supported, because
    computed cell maps are not included in this release.
  - Use without relevant domain expertise is discouraged; the release states that
    meaningful analysis requires domain expertise.

prohibited_uses:
- id: d4d:cm4ai-prohibited-uses
  name: Prohibited uses
  description: These laboratory data are not to be used in clinical decision-making
    or in any context involving patient care without appropriate regulatory oversight
    and approval.
  prohibition_reason:
  - The data are laboratory research data generated from cell lines and have not been
    validated or approved for clinical or patient-care use.

future_use_impacts:
- id: d4d:cm4ai-future-use-impacts
  name: Impact of the release cadence on future use
  impact_details:
  - The release series is interim and cumulative; the dataset will be regularly updated
    and augmented on a quarterly basis through the end of the project in November
    2026, and predicted cell maps and currently embargoed datasets are stated to be
    added in future releases. The composition of the data therefore differs between
    releases.
  - Only 8 of 55859 catalogued entities carry checksums, which limits independent
    byte-level verification of content across releases.

