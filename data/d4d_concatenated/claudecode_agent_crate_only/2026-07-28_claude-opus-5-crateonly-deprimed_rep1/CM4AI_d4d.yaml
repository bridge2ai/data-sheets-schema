anomalies:
- id: d4d:cm4ai-anomaly-metadata-inconsistencies
  name: Internal inconsistencies in the packaged release metadata
  description: >-
    Anomalies observed in the release's own packaged metadata rather than in the measured
    data. They affect how reliably individual assertions about the release can be read.
  anomaly_details:
  - The release reports a human-readable content size of "19.9 TB" alongside a machine-readable
    total of 21051331945400 bytes; the two do not agree under either a decimal (21.05
    TB) or a binary (19.15 TiB) interpretation, so only the byte count is asserted
    in this record.
  - The citation strings carried by every constituent collection name an earlier release,
    "Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta)", although
    those collections are part of the current June 2026 release, and they associate
    two different DOIs with that same earlier title (https://doi.org/10.18130/V3/B35XWX
    and https://doi.org/10.18130/V3/K7TGEM).
  - Several collections carry other stale release-scoped values, declaring three collection
    types (Perturb-seq; IF imaging; SEC-MS) where the release declares four (adding
    AP-MS), and declaring earlier collection end dates corresponding to the release
    in which they first appeared.
  - The identifiers of the January 2026 and October 2025 releases appear only with
    a trailing comma inside their ark URIs; the June 2026 identifier appears both
    with and without the comma, indicating a serialisation artefact rather than two
    distinct identifiers.
  - The DOI of the SEC-MS collection for treated cancer cells is recorded in a malformed
    URI form, "https://doi.org/doi:10.25345/C5348GV4S".
  - The CM4AI project is referenced by two different ark identifiers, https://fairscape.net/api/ark:59853/project-cell-maps-for-artificial-intelligence-qTdsTBd3FtA
    at release level and https://fairscape.net/api/ark:59853/project-cm4ai within
    constituent collections.
  - The author list of the raw sequence collection spells the principal investigator
    "Idkeker T", where every other listing in the release spells "Ideker T".
  - The release reports both evi:datasetCount = 53877 and evi:totalEntities = 55859
    without stating which is the file count; the AI-readiness self-assessment uses
    the larger figure as the denominator for checksum coverage. No single total file
    count is therefore asserted in this record.

known_biases:
- id: d4d:cm4ai-bias-cell-line-representation
  name: Cell-line derivation limits population representation
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines, and does not represent all biological variants which may be
    seen in the population at large.

known_limitations:
- id: d4d:cm4ai-limitation-interim-release
  name: Interim release without predicted cell maps
  limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted
    cell maps, which will be added in future releases.
  scope_impact: Analyses depending on computed or predicted cell maps cannot be performed
    against the current release.
- id: d4d:cm4ai-limitation-domain-expertise
  name: Requires domain expertise
  limitation_type: methodological_limitation
  limitation_description: The current release is most suitable for bioinformatics
    analysis of the individual datasets. Requires domain expertise for meaningful
    analysis.
- id: d4d:cm4ai-limitation-incomplete-modality-overlap
  name: Incomplete overlap between modalities
  limitation_type: integration_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization
    (IF imaging), and CRISPRi perturbSeq data interrogate sets of proteins which incompletely
    overlap.
  scope_impact: Cross-modality integration is constrained to the intersection of the
    protein sets interrogated by each assay.
- id: d4d:cm4ai-limitation-embargo
  name: Temporary pre-publication embargo on some datasets
  limitation_type: temporal_limitation
  limitation_description: These data are not yet in completed final form, and some
    datasets are under temporary pre-publication embargo. The raw sequence data collection
    of the Perturbation Cell Atlas records its access URL as "Embargoed".
- id: d4d:cm4ai-limitation-checksum-coverage
  name: Limited checksum coverage
  limitation_type: coverage_limitation
  limitation_description: The AI-readiness self-assessment reports that 0% of files
    have checksums (8 of 55859 entities).
  scope_impact: Independent byte-level verification of most files in the release is
    not possible from the packaged metadata alone.

confidential_elements:
- id: d4d:cm4ai-confidentiality
  name: Confidentiality of release contents
  confidential_elements_present: false
  confidentiality_details:
  - 'Confidentiality level declared by every constituent crate: Unrestricted.'

subpopulations:
- id: d4d:cm4ai-subpopulations
  name: Human subpopulations
  subpopulation_elements_present: false
  identification:
  - No human subpopulations are represented. Data were collected from commercially
    available de-identified human cell lines (KOLF2.1J iPSC and MDA-MB-468).

sensitive_elements:
- id: d4d:cm4ai-sensitive-elements
  name: Sensitive or confidential data elements
  sensitive_elements_present: false
  sensitivity_details:
  - Exempt — research with commercially available de-identified human cell lines does
    not constitute human subjects research.

relationships:
- id: d4d:cm4ai-relationships
  name: Relationships between release components
  relationship_details:
  - All data, software, and computations are explicitly linked within the RO-Crate's
    provenance graph.
  - Each constituent modality collection declares schema:isPartOf against the releases
    it belongs to; several collections are part of more than one successive release,
    indicating that releases are cumulative.
  - Provenance is expressed through EVI inputs and outputs that connect samples, instruments,
    experiments, and computations to the derived dataset entities, and each collection
    carries its own local evidence graph.

is_deidentified:
  id: d4d:cm4ai-deidentification
  name: De-identification status
  identifiable_elements_present: false
  method: Data were collected from commercially available de-identified human cell
    lines; no identifiable human subject data are present.
  deidentification_details:
  - 'Human subject research: None - data collected from commercially available cell
    lines.'
  - Exempt — research with commercially available de-identified human cell lines does
    not constitute human subjects research.

acquisition_methods:
- id: d4d:cm4ai-acquisition
  name: Acquisition of instances
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Instances were directly measured in the laboratory by mass spectrometry (AP-MS
    and SEC-MS), immunofluorescence-based staining (ICC-IF) with confocal microscopy,
    and single-cell RNA sequencing of CRISPRi perturbations.
  - Derived instances were produced by computational processing recorded in the crate's
    provenance graph; SEC-MS raw data were processed with Spectronaut and analysed
    in R using MSstats-compatible formats, and the Perturbation Cell Atlas aggregated
    data were produced by a documented data-processing computation.
  - The Perturbation Cell Atlas findings were validated via phenotypic, protein-interaction,
    and metabolic tracing assays.
  - No data were self-reported by subjects; no human subjects are involved.

collection_mechanisms:
- id: d4d:cm4ai-collection-mechanisms
  name: Data collection mechanisms
  mechanism_details:
  - 'Declared collection types for the current release: Perturb-seq; IF imaging; SEC-MS;
    AP-MS.'
  - AP-MS was performed on endogenously tagged MDA-MB-468 cells under paclitaxel or
    vorinostat perturbation, in four biological replicates, with each batch including
    an untagged parental control, 10 chromatin modifier tagged cell lines, and a positive
    control tagged line; DMSO-treated samples served as vehicle controls.
  - SEC-MS coupled size exclusion chromatography with mass spectrometry; data were
    acquired on a Bruker timsTOF platform and quantified with Spectronaut.
  - IF imaging used immunofluorescence-based staining (ICC-IF) and confocal microscopy
    in the Lundberg Lab at Stanford University, staining nuclei with DAPI (blue channel),
    endoplasmic reticulum with a calreticulin antibody (yellow channel), microtubules
    with tubulin antibody (red channel), and the protein of interest (green channel).
  - Perturb-seq used expressed genome-scale CRISPRi perturbation in KOLF2.1J human
    iPSCs with single-cell RNA sequencing readout.

sampling_strategies:
- id: d4d:cm4ai-sampling
  name: Sampling and experimental design
  is_representative: false
  why_not_representative:
  - Data in this release was derived from commercially available de-identified human
    cell lines, and does not represent all biological variants which may be seen in
    the population at large.
  source_data:
  - KOLF2.1J human induced pluripotent stem cells (Cellosaurus CVCL_B5P3), including
    iPSC-derived neural progenitor cells, neurons, and cardiomyocytes.
  - MDA-MB-468 human triple-negative breast cancer cells (Cellosaurus CVCL_0419),
    untreated and treated with vorinostat or paclitaxel.
  strategies:
  - Expressed genome-scale CRISPRi perturbation covering 11,739 targeted genes in
    KOLF2.1J hiPSCs.
  - Immunofluorescence imaging of 464 proteins of interest per treatment condition
    (untreated, paclitaxel, vorinostat).
  - AP-MS in four biological replicates per batch, each batch containing an untagged
    parental control, 10 chromatin modifier tagged cell lines, and a positive control
    tagged line, with DMSO vehicle controls.
  - SEC-MS across four differentiation states with replicate counts of Parental 4,
    NPC 2, Neuron 3, and Cardiomyocyte 2.

