- id: https://fairscape.net/api/ark:59853/rocrate-sec-ms-characterization-of-kolf2-neuronal-and-cardiomyocyte-differentiation-cm4ai-yjftt2oec6c
  name: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
  description: >-
    This dataset contains mass spectrometry-based proteomics data investigating the
    protein-protein interaction networks during the differentiation of KOLF2.1J human
    induced pluripotent stem cells (iPSCs). Size Exclusion Chromatography coupled
    with Mass Spectrometry (SEC-MS) was employed to map multiscale biological organization
    across four states: Parental (undifferentiated iPSCs), NPC (neural progenitor
    cells), Neurons (terminally differentiated neurons), and Cardio (terminally differentiated
    cardiomyocytes). The study aims to identify how protein complexes and networks
    are reorganized during neuronal lineage commitment and cardiomyocyte differentiation.
    Data were acquired on a Bruker timsTOF platform, and quantitative analysis was
    performed using Spectronaut; downstream analysis was conducted in R using MSstats-compatible
    formats. Sample groups: Parental (reps 1-4), NPC (reps 1-2), Neuron (reps 1-3),
    Cardio (reps 1-2). The crate reports a content size of 1.11 TB and 867 parts,
    of which 862 are dataset entities. Published within the release on 2026-05-27
    via MassIVE.
