id: https://fairscape.net/api/ark:59853/project-cell-maps-for-artificial-intelligence-qTdsTBd3FtA
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence (CM4AI) - quarterly AI-ready data release
  series
description: >-
  Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) is the Functional Genomics
  Grand Challenge in the NIH Bridge2AI program. The programme produces AI-ready
  multimodal measurements of human cell architecture from disease-relevant cell lines
  and publishes them as a series of quarterly data releases. The current release,
  "Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)", includes
  perturb-seq data in undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated
  KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and cardiomyocytes; AP-MS data in
  MDA-MB-468 breast cancer cells in the presence of chemotherapy (vorinostat and
  paclitaxel); and IF images in MDA-MB-468 breast cancer cells in the presence and
  absence of chemotherapy (vorinostat and paclitaxel). CM4AI output data are packaged
  with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format
  using the FAIRSCAPE framework. Data presented are augmented regularly on a quarterly
  basis through the end of the project (November 2026). CM4AI is a collaboration of
  UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham, Simon Fraser University, and the
  Hastings Center.
page: CM4AI.org
publisher: https://dataverse.lib.virginia.edu/
license: https://creativecommons.org/licenses/by-nc-sa/4.0/
status: Ongoing release series; current release is a Beta interim release, and the
  data are not yet in completed final form.
conforms_to: RO-Crate 1.2 (https://w3id.org/ro/crate/1.2), packaged with the FAIRSCAPE
  framework (fairscapeVersion 1.1.3); the release also declares conformance to the
  MLCommons Croissant Responsible AI (RAI) property set.
