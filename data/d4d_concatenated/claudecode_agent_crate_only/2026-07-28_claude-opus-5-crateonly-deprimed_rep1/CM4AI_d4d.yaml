collection_timeframes:
- id: d4d:cm4ai-collection-timeframe
  name: Data collection timeframe of the current release
  start_date: '2022-09-01'
  end_date: '2026-06-01'
  timeframe_details:
  - The current release declares a collection timeframe of 9/1/2022 to 6/1/2026.
  - Constituent collections carried forward from earlier releases declare earlier
    end dates that correspond to the release in which they first appeared, namely
    10/13/25 for the IF image and raw sequence collections and 1/31/2026 for the AP-MS
    and treated-cancer-cell SEC-MS collections. These are historical release scopes,
    not conflicting statements about the current release.

direct_collection:
- id: d4d:cm4ai-direct-collection
  name: Direct collection by the CM4AI consortium
  is_direct: true
  collection_details:
  - Data were generated directly in CM4AI consortium laboratories rather than obtained
    from third parties, and are packaged with provenance graphs and rich metadata
    using the FAIRSCAPE framework.
  - 'Data collection processes are generally described in Clark T et al. (2024) "Cell
    Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from
    Disease-Relevant Cell Lines" bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311.
    Additional data collection details will be subsequently published once finalized.'

missing_data_documentation:
- id: d4d:cm4ai-missing-data
  name: Missing data in the current release
  missing_data_patterns:
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
    perturbSeq data interrogate sets of proteins which incompletely overlap.
  - Computed cell maps not included in this release.
  missing_data_causes:
  - Some datasets are under temporary pre-publication embargo.
  - The release is interim and not yet in completed final form.
  handling_strategy: Missing content is declared explicitly in the release-level completeness
    and RAI missing-data statements; predicted cell maps and embargoed datasets are
    stated to be added in future quarterly releases.

raw_data_sources:
- id: d4d:cm4ai-raw-source-massive
  name: MassIVE proteomics submissions
  source_description: Raw mass spectrometry data underlying the AP-MS and SEC-MS collections
    are deposited in the MassIVE repository.
  source_type:
  - mass spectrometry repository deposition
  access_details: 'MassIVE accessions MSV000101915 (EndoTag AP-MS, paclitaxel), MSV000101917
    (EndoTag AP-MS, vorinostat), MSV000100676 (SEC-MS of KOLF2 differentiation), and
    MSV000098237 (SEC-MS of treated MDA-MB468 cells, available at ftp://massive-ftp.ucsd.edu/v10/MSV000098237/).'
- id: d4d:cm4ai-raw-source-sequence
  name: Raw sequence data for the Perturbation Cell Atlas
  source_description: Raw sequence data from the expressed genome-scale CRISPRi Perturbation
    Cell Atlas in KOLF2.1J human iPSCs, comprising 16.7 TB linked to 192 sample entities
    and 103 derived dataset entities.
  source_type:
  - single-cell RNA sequencing raw reads
  access_details: The crate records the access URL for this collection as "Embargoed".
  raw_data_format:
  - fastq.gz

raw_sources:
- id: d4d:cm4ai-raw-data-retention
  name: Retention of raw data
  access_url: ftp://massive-ftp.ucsd.edu/v10/MSV000098237/
  raw_data_details:
  - Raw data are retained and distributed alongside processed data. The AP-MS and
    SEC-MS collections are described as raw data submissions hosted in MassIVE, and
    the Perturbation Cell Atlas raw sequence data are packaged as a separate collection,
    currently embargoed.

preprocessing_strategies:
- id: d4d:cm4ai-preprocessing-secms
  name: Mass spectrometry data processing
  preprocessing_details:
  - SEC-MS data were acquired on a Bruker timsTOF platform; raw data were processed
    using Spectronaut and downstream analysis was conducted in R using MSstats-compatible
    formats.
  used_software:
  - id: d4d:software-spectronaut
    name: Spectronaut
    description: Used for quantitative analysis of SEC-MS raw data.
  - id: d4d:software-r
    name: R
    description: Used for downstream analysis of processed SEC-MS data in MSstats-compatible
      formats.
- id: d4d:cm4ai-preprocessing-perturb-seq
  name: Perturbation Cell Atlas data processing
  preprocessing_details:
  - Aggregated Perturbation Cell Atlas outputs were produced from 90 input dataset
    entities by a documented data-processing computation recorded in the crate's provenance
    graph.
- id: d4d:cm4ai-preprocessing-packaging
  name: AI-ready packaging and provenance capture
  preprocessing_details:
  - CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready
    datasets in RO-Crate format using the FAIRSCAPE framework, and the release declares
    conformance to RO-Crate 1.2.
  used_software:
  - id: d4d:software-fairscape
    name: FAIRSCAPE
    version: 1.1.3
    description: Framework used to package CM4AI outputs as RO-Crates with provenance
      graphs and rich metadata.

