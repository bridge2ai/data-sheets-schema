existing_uses:
- id: d4d:cm4ai-existing-uses
  name: Publications associated with the release
  examples:
  - 'Clark T, Parker J, Al Manir S, et al. (2024) Cell Maps for Artificial Intelligence:
    AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell Lines. bioRxiv
    2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311'
  - 'Nourreddine S, et al. (2024) A Perturbation Cell Atlas of Human Induced Pluripotent
    Stem Cells. bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.11.03.621734'
