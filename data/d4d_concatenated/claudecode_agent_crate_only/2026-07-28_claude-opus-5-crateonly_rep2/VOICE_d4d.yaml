instances:
- id: d4d:voice-3.0.0-instance-participant
  name: Participant
  description: Bridge2AI-Voice v3.0 contains data for 833 participants across five sites in
    North America. Participants were selected based on known conditions which manifest within
    the voice waveform including voice disorders, neurological disorders, mood disorders,
    and respiratory disorders.
  instance_type: human research participant
  counts: 833
  label: true
  label_description: Clinical investigators and care teams record diagnostic categories for
    voice, neurological, mood and respiratory conditions and other phenotype variables, drawing
    on clinical assessments and electronic health records; these labels are represented in
    disease-specific TSV files with accompanying JSON dictionaries.
  missing_information:
  - id: d4d:voice-3.0.0-missing-participant-rows
    name: Sparse participant and questionnaire coverage
    missing:
    - Rows are present for a participant only when at least one variable is non-missing.
    - Questionnaire forms and individual items are missing for some participants and cohorts.
    - Derived audio features are absent for some recordings.
    why_missing:
    - Questionnaire completion varies by participant and cohort, so some forms and items are
      systematically or sporadically missing.
    - Some derived audio features could not be computed for all recordings due to quality
      or length constraints, and features relating to free speech or sensitive records have
      been removed.
- id: d4d:voice-3.0.0-instance-recording-features
  name: Task recording with derived acoustic features
  description: 'Derived feature files are keyed by participant, session and task: every feature
    schema in the crate declares participant_id, session_id and task_name as required columns,
    and the preprocessing protocol states that all derived features are stored as dense tensors
    in Parquet files with participant, session and task identifiers. The crate does not state
    how many recordings or feature rows the release contains.'
  instance_type: voice, speech or respiratory task recording represented by derived features
relationships:
- id: d4d:voice-3.0.0-relationships-participant-session-task
  name: Participant, session and task keys link the released tables
  relationship_details:
  - All derived features are stored as dense tensors in Parquet files with participant, session
    and task identifiers.
  - Every feature schema documented in the crate declares participant_id, session_id and task_name
    as required columns, so feature files and phenotype tables share the same participant,
    session and task keys.
  - Most participants completed a single in-clinic session and a subset completed repeated
    sessions, so a participant may relate to more than one session.
splits:
- id: d4d:voice-3.0.0-splits-none
  name: No predefined splits
  split_details:
  - The dataset does not provide predefined train-validation-test splits or benchmarking tasks,
    so researchers must design their own evaluation protocols.
