known_biases:
- id: d4d:voice-3.0.0-bias-sampling
  name: Sampling bias
  bias_type: sampling_bias
  bias_description: 'Sampling bias: participants are recruited from specialty clinics and
    associated institutions using a non-probability sampling strategy, with inclusion focused
    on specific disease cohorts and fluent English speakers; this produces clinically enriched
    case mixes that may not represent general population distributions.'
- id: d4d:voice-3.0.0-bias-geographic-cultural
  name: Geographic and cultural bias
  bias_type: representation_bias
  bias_description: 'Geographic and cultural bias: data are collected at a limited number
    of North American sites, and although the project seeks diversity, it may under-represent
    speakers from other regions, cultures, languages and healthcare systems; early releases
    focus on English, with Spanish protocols planned but not yet fully represented.'
- id: d4d:voice-3.0.0-bias-clinical-spectrum
  name: Clinical spectrum bias
  bias_type: selection_bias
  bias_description: 'Clinical spectrum bias: because participants are selected into disease
    cohorts where voice changes are expected, the prevalence and severity of conditions in
    the dataset differ from those in routine primary care or community settings, which may
    inflate model performance when evaluated within this dataset.'
- id: d4d:voice-3.0.0-bias-device-environment
  name: Device and environment bias
  bias_type: measurement_bias
  bias_description: 'Device and environment bias: recordings are made using standardized but
    not identical hardware and primarily in clinical environments; future at-home collection
    or deployment on other devices may encounter different background noise, channel characteristics
    and user behavior.'
- id: d4d:voice-3.0.0-bias-machine-annotation
  name: Algorithmic bias in machine annotations
  bias_type: algorithmic_bias
  bias_description: 'Algorithmic bias in machine annotations: transcripts and some derived
    features rely on off-the-shelf models such as OpenAI Whisper and other audio toolkits
    whose performance may vary across demographic groups; the dataset team has not independently
    audited these tools for fairness, so downstream users should consider their biases when
    interpreting results.'
  mitigation_strategy: The dataset team has not independently audited the off-the-shelf annotation
    tools for fairness, so downstream users should consider their biases when interpreting
    results.
known_limitations:
- id: d4d:voice-3.0.0-limitation-feature-only-release
  name: Feature-only release without raw audio
  limitation_type: scope_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or
    free-speech transcripts, which limits certain types of modeling and error analysis and
    may constrain the ability to reproduce end-to-end audio pipelines.
- id: d4d:voice-3.0.0-limitation-adult-cohort
  name: Adult, primarily English-speaking cohort only
  limitation_type: coverage_limitation
  limitation_description: This version only includes an adult cohort; models trained solely
    on this dataset may not generalize to younger age groups or to languages beyond those
    represented.
- id: d4d:voice-3.0.0-limitation-deidentification-granularity
  name: De-identification removes granular demographic and contextual detail
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic
    variables, fine-grained location data and narrative context have been removed, which reduces
    the risk of re-identification but also limits detailed fairness assessments and certain
    confounder adjustments.
- id: d4d:voice-3.0.0-limitation-no-splits-or-label-uncertainty
  name: No predefined splits, benchmarks or label-uncertainty measures
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train–validation–test splits
    or benchmarking tasks and does not include explicit per-instance label-uncertainty measures,
    so researchers must design their own evaluation protocols and handle label noise and missingness.
- id: d4d:voice-3.0.0-limitation-access-governance
  name: Registered and controlled access constrains participation and reproducibility
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure
    is appropriate for privacy but may limit participation by some institutions or researchers
    and can complicate the reproducibility of pipelines that require both features and raw
    audio.
acquisition_methods:
- id: d4d:voice-3.0.0-acquisition
  name: Direct measurement, survey and derivation
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  acquisition_details:
  - Direct measurement
  - Surveys
  - Self-reporting
  - Secondary Data analysis
  - Document analysis
  - Structured voice and respiratory tasks such as sustained vowels, coughs and reading passages
    were directly recorded.
  - Demographic questions, health history, disease-specific questionnaires and other patient-reported
    outcomes were self-reported by participants.
  - Clinical diagnoses and other metadata were extracted from electronic health records.
  - The released acoustic representations are derived from the raw audio rather than directly
    observed.
collection_mechanisms:
- id: d4d:voice-3.0.0-collection-mechanism
  name: In-clinic mobile application capture into REDCap
  mechanism_details:
  - Prospective observational study conducted at multiple specialty clinics and academic hospitals
    across North America. Eligible adults presenting to voice, neurology, psychiatry and respiratory
    clinics, plus healthy controls, were screened against predefined inclusion and exclusion
    criteria. After informed consent, a standardized protocol was administered that combined
    structured voice and respiratory tasks such as sustained vowels, coughs and reading passages
    with demographic questions, health history, disease-specific questionnaires and other
    patient-reported outcomes. Data were captured on a mobile or tablet application and stored
    in REDCap, with most participants completing a single in-clinic session and a subset completing
    repeated sessions.
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of
    acoustic tasks and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to
    merge and organize annotations with derived features.
sampling_strategies:
- id: d4d:voice-3.0.0-sampling
  name: Non-probability clinic-based cohort sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Eligible adults presenting to voice, neurology, psychiatry and respiratory clinics at
    multiple specialty clinics and academic hospitals across North America, plus healthy controls.
  strategies:
  - Participants are recruited from specialty clinics and associated institutions using a
    non-probability sampling strategy, with inclusion focused on specific disease cohorts
    and fluent English speakers.
  - Eligible adults were screened against predefined inclusion and exclusion criteria.
  why_not_representative:
  - This produces clinically enriched case mixes that may not represent general population
    distributions.
  - Data are collected at a limited number of North American sites, and although the project
    seeks diversity, it may under-represent speakers from other regions, cultures, languages
    and healthcare systems.
  - Because participants are selected into disease cohorts where voice changes are expected,
    the prevalence and severity of conditions in the dataset differ from those in routine
    primary care or community settings, which may inflate model performance when evaluated
    within this dataset.
