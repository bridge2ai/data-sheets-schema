participant_privacy:
- id: d4d:voice-3.0.0-participant-privacy
  name: De-identification and access tiering to protect participants
  anonymization_method:
  - Prior to release, data are transformed to reduce re-identification risk and align with
    regulatory and ethical requirements. Direct identifiers and high-risk quasi-identifiers
    are removed; dates are coarsened or rebased; geographic information is generalized to
    the country level; narrative text fields and transcripts of free speech are removed; and
    raw voice waveforms are withheld from this feature-only release.
  reidentification_risk:
  - Removing finer-grained geographic identifiers, direct identifiers and many socio-economic
    and cultural details reduces re-identification risk but also limits detailed fairness
    assessments and certain confounder adjustments.
  - Raw voice recordings are themselves biometric identifiers and are made available only
    under controlled access.
  privacy_techniques:
  - Direct identifiers and high-risk quasi-identifiers are removed.
  - Dates are coarsened or rebased.
  - Geographic information is generalized to the country level.
  - Narrative text fields and transcripts of free speech are removed.
  - Raw voice waveforms are withheld from this feature-only release.
  - Use is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification.
is_deidentified:
  id: d4d:voice-3.0.0-deidentification
  name: De-identified feature-only release
  identifiable_elements_present: false
  method: Prior to release, data are transformed to reduce re-identification risk and align
    with regulatory and ethical requirements. Direct identifiers and high-risk quasi-identifiers
    are removed; dates are coarsened or rebased; geographic information is generalized to
    the country level; narrative text fields and transcripts of free speech are removed; and
    raw voice waveforms are withheld from this feature-only release.
  identifiers_removed:
  - Direct identifiers
  - High-risk quasi-identifiers
  - Exact dates, which are coarsened or rebased
  - Geographic information finer than country level
  - Narrative text fields
  - Transcripts of free speech
  - Raw voice waveforms
  - Detailed narrative responses, some information about household income, traumatic life
    experiences and granular cultural identifiers
  deidentification_details:
  - 'The crate records deidentified: true for this release.'
  - Additional filtering removes features for sensitive records and audio checks, and some
    derived features are dropped when processing fails or quality checks fail.
preprocessing_strategies:
- id: d4d:voice-3.0.0-preprocessing
  name: Audio standardization, feature extraction and phenotype ETL
  description: 'VOICE Features Processing: Processing step for taking raw data and converting
    it into spectrograms and features using the b2ai-prep. VOICE Phenotype Ingest: Dumping
    and reformatting phenotype information from Redcap database into b2ai-voice phenotype
    extracts.'
  preprocessing_details:
  - Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing
    filtering; they are then segmented by task and passed through quality checks.
  - From the standardized audio, multiple derived feature sets are computed including spectrograms,
    mel spectrograms, MFCCs, articulatory features using the Speech Articulatory Coding package,
    pitch and loudness estimates, acoustic features from openSMILE, phonetic and prosodic
    features from Praat and parselmouth, and phonetic posteriorgrams using a dedicated model;
    all are stored as dense tensors in Parquet files with participant, session and task identifiers.
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using a
    dedicated open-source b2aiprep library, reorganizing the former single phenotype table
    into thematically organized TSV files with accompanying JSON data dictionaries; static
    per-recording feature summaries are provided in static_features.tsv, and de-identification
    and filtering steps are applied before packaging.
  used_software:
  - &id001
    id: ark:59853/b2ai-voice-software-b2aiprep
    name: B2AIPrep Library
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice
      project.
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
cleaning_strategies:
- id: d4d:voice-3.0.0-cleaning
  name: Quality filtering and removal of sensitive records
  cleaning_details:
  - Additional filtering removes features for sensitive records and audio checks, and some
    derived features are dropped when processing fails or quality checks fail.
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues.
  - De-identification and filtering steps are applied before packaging.
labeling_strategies:
- id: d4d:voice-3.0.0-labeling
  name: Clinical labels, validated instruments and machine annotation
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of
    acoustic tasks and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to
    merge and organize annotations with derived features.
  data_annotation_protocol:
  - Annotations for this dataset consist primarily of clinical labels and questionnaire-derived
    measures associated with each participant and recording. Participants complete validated
    instruments such as VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough questionnaires
    and voice instruments, which generate numerical scores and categorical indicators according
    to each instrument's published scoring guidelines. Clinical investigators and care teams
    record diagnostic categories for voice, neurological, mood and respiratory conditions
    and other phenotype variables, drawing on clinical assessments and electronic health records;
    these labels are represented in disease-specific TSV files with accompanying JSON dictionaries.
    In addition, machine-generated transcripts of certain voice tasks and numerous automatically
    extracted acoustic and articulatory features provide further labels and descriptors at
    the recording level.
  annotations_per_item: 1
  inter_annotator_agreement: Diagnostic labels are derived from clinical assessments and electronic
    health records rather than crowd workers, so there is no explicit inter-rater majority-vote
    scheme, and per-annotator disagreement statistics or detailed label-uncertainty measures
    are not presently included in the released dataset.
  annotator_demographics:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are
    created by clinicians and research staff at participating North American institutions
    spanning otolaryngology, neurology, neuroscience, pulmonology and allied health disciplines;
    detailed demographic breakdowns of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves,
    whose demographics are captured in coarsened form in the phenotype tables, for example
    age bands, sex and country of data collection; however, per-annotator demographic information,
    such as which specific clinician or staff member entered a label, is not exposed.
  labeling_details:
  - Each recording is associated with one set of clinical labels and questionnaire responses
    derived from a single participant, although participants may contribute multiple sessions
    over time; there is no crowd-sourced labeling and the documentation does not report multiple
    independent human ratings per individual recording.
raw_sources:
- id: d4d:voice-3.0.0-raw-sources
  name: Raw audio retained outside this release
  raw_data_details:
  - The public feature-only PhysioNet release contains de-identified derived representations
    of the audio, such as spectrograms, mel spectrograms, MFCCs, articulatory and prosodic
    features and phonetic posteriorgrams, along with tabular phenotype files and data dictionaries;
    access to the underlying raw audio is available only through a separate controlled-access
    process.
imputation_protocols:
- id: d4d:voice-3.0.0-imputation
  name: No global imputation applied
  imputation_method:
  - The public datasets do not apply global statistical imputation to missing fields; instead,
    missing questionnaire responses, phenotype variables and derived features are left as
    explicit missing values or omitted rows.
  imputation_rationale: Users can implement study-specific imputation or complete-case strategies
    appropriate to their analyses.
  imputation_validation:
  - The data release team audited missingness.
annotation_analyses:
- id: d4d:voice-3.0.0-annotation-analysis
  name: Scoring rules, reference labels and release-team auditing
  analysis_method: Questionnaire-based labels are generated using the standard scoring rules
    for each validated instrument, yielding total and subscale scores that can be mapped to
    symptom-severity bands; the scoring logic is encoded in the REDCap instruments and documented
    in the data dictionaries.
  disagreement_patterns:
  - Diagnostic labels are derived from clinical assessments and electronic health records
    rather than crowd workers, so there is no explicit inter-rater majority-vote scheme; however,
    diagnoses are treated as reference labels and may include multiple comorbid conditions
    per participant.
  annotation_quality_details:
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues, but per-annotator disagreement statistics
    or detailed label-uncertainty measures are not presently included in the released dataset.
machine_annotation_tools:
- id: d4d:voice-3.0.0-machine-annotation-tools
  name: Off-the-shelf acoustic and speech toolkits
  tools:
  - OpenSMILE
  - Praat and the parselmouth interface
  - TorchAudio-based pipelines
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units
  - OpenAI Whisper Large
  - The open-source b2aiprep library
  tool_descriptions:
  - OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral
    characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including
    measures of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch
    tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and
    related features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units
    for each recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with
    transcripts from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and
    merging of phenotype data into the released files.
  tool_accuracy:
  - Transcripts and some derived features rely on off-the-shelf models such as OpenAI Whisper
    and other audio toolkits whose performance may vary across demographic groups; the dataset
    team has not independently audited these tools for fairness.
  used_software:
  - *id001
intended_uses:
- id: d4d:voice-3.0.0-intended-uses
  name: Recommended research applications
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived
    features with diagnostic categories or symptom severity for conditions such as vocal fold
    pathology, neurological and neurodegenerative diseases, mood and anxiety disorders and
    respiratory illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance
    on a clinically diverse, multi-site cohort with standardized tasks and rich phenotype
    data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
    using de-identified derived features, including work on representation learning, domain
    adaptation and multimodal integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models,
    including studies of bias related to demographic subgroups or recording conditions, subject
    to the ethical constraints in the data use agreement.
  usage_notes: Methodological research on fairness, robustness and AI safety in clinical voice
    models is subject to the ethical constraints in the data use agreement.
  use_category:
  - Machine-learning model development and fine-tuning
  - Benchmarking and validation of voice-biomarker algorithms
  - Exploratory acoustic, phonetic, prosodic and articulatory research
  - Fairness, robustness and AI-safety methodology research
discouraged_uses:
- id: d4d:voice-3.0.0-discouraged-uses
  name: Uses the dataset is explicitly not intended for
  discouragement_details:
  - The dataset is explicitly not intended for operational decision making about specific
    individuals such as hiring, insurance pricing, law enforcement or surveillance, nor for
    attempts at re-identification or for uses likely to stigmatize individuals or groups.
prohibited_uses:
- id: d4d:voice-3.0.0-prohibited-uses
  name: Uses forbidden by the registered-access licence and DUA
  prohibition_reason:
  - Use of the data is restricted to authorized researchers under a registered-access license
    and associated data use agreement that explicitly forbids attempts at re-identification,
    stigmatizing or discriminatory uses and applications such as surveillance or high-stakes
    individual decision making.
future_use_impacts:
- id: d4d:voice-3.0.0-future-use-impact
  name: Benefits and risks anticipated by the consortium
  impact_details:
  - The project aims to create an ethically sourced, diverse voice dataset to support research
    on using voice as an accessible, low-cost biomarker for screening, diagnosis and monitoring
    of a broad range of health conditions, potentially improving early detection and care
    for underserved populations. At the same time, the consortium explicitly recognizes the
    risks associated with voice data, including privacy loss, misuse of voice biometrics and
    algorithmic harms such as discrimination in hiring, insurance or surveillance contexts;
    these risks motivate a governance framework with IRB oversight, rigorous de-identification,
    separation of feature-only and raw-audio tiers and usage restrictions encoded in the registered-access
    license and data use agreement. Dataset documentation and ongoing ethics workstreams are
    intended to help downstream users reason about these risks and design responsible analyses
    and models.
distribution_formats:
- id: d4d:voice-3.0.0-distribution-format
  name: Parquet feature files and tab-separated phenotype tables
  description: 'Derived features are stored as dense tensors in Parquet files with participant,
    session and task identifiers. Phenotype and questionnaire data are distributed as thematically
    organized TSV files with accompanying JSON data dictionaries, and static per-recording
    feature summaries are provided in static_features.tsv. The crate declares a total contentSize
    of 12.9 GB and documents 15 dataset entities and 55 column schemas; the AI-readiness
    self-assessment reports that 65% of files have checksums (11 of 17) and lists the recorded
    formats as .py and text/tab-separated-values.'
