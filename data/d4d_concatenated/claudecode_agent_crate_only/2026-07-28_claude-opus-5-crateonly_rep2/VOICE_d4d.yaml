    the use of voice as a biomarker of health.
- id: d4d:voice-3.0.0-purpose-accessible-biomarker
  name: Support voice as an accessible, low-cost health biomarker
  response: The project aims to create an ethically sourced, diverse voice dataset to support
    research on using voice as an accessible, low-cost biomarker for screening, diagnosis
    and monitoring of a broad range of health conditions, potentially improving early detection
    and care for underserved populations.
tasks:
- id: d4d:voice-3.0.0-task-model-development
  name: Model development for voice-linked conditions
  response: Development, training and fine-tuning of machine-learning models that associate
    voice-derived features with diagnostic categories or symptom severity for conditions such
    as vocal fold pathology, neurological and neurodegenerative diseases, mood and anxiety
    disorders and respiratory illnesses.
- id: d4d:voice-3.0.0-task-benchmarking
  name: Benchmarking of existing voice-biomarker algorithms
  response: Benchmarking and validation of existing voice-biomarker algorithms by testing
    their performance on a clinically diverse, multi-site cohort with standardized tasks and
    rich phenotype data.
- id: d4d:voice-3.0.0-task-exploratory-research
  name: Exploratory acoustic and phonetic research
  response: Exploratory research on acoustic, phonetic, prosodic and articulatory correlates
    of disease using de-identified derived features, including work on representation learning,
    domain adaptation and multimodal integration with other health data.
- id: d4d:voice-3.0.0-task-fairness-robustness
  name: Fairness, robustness and AI-safety methodology
  response: Methodological research on fairness, robustness and AI safety in clinical voice
    models, including studies of bias related to demographic subgroups or recording conditions,
    subject to the ethical constraints in the data use agreement.
