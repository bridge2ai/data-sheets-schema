purposes:
  - id: voice:purpose-voice-biomarker-flagship
    name: Ethically sourced flagship voice dataset for AI research
    description: >-
      The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset to
      enable future research in artificial intelligence and support critical insights into
      the use of voice as a biomarker of health.
    response: >-
      The project aims to create an ethically sourced, diverse voice dataset to support
      research on using voice as an accessible, low-cost biomarker for screening, diagnosis
      and monitoring of a broad range of health conditions, potentially improving early
      detection and care for underserved populations. The human voice contains complex acoustic markers which have been linked
      to important health conditions including dementia, mood disorders, and cancer; voice
      is a promising characteristic to measure because it is simple to collect,
      cost-effective, and has broad clinical utility.

tasks:
  - id: voice:task-voice-health-modeling
    name: Machine-learning modeling of voice-derived features against health status
    description: >-
      Development, training and fine-tuning of machine-learning models that associate
      voice-derived features with diagnostic categories or symptom severity for conditions
      such as vocal fold pathology, neurological and neurodegenerative diseases, mood and
      anxiety disorders and respiratory illnesses.
    response: >-
      The crate names modeling of voice-derived features against diagnostic categories and
      symptom severity, benchmarking and validation of existing voice-biomarker algorithms
      on a clinically diverse multi-site cohort, and methodological research on fairness and
      robustness in clinical voice models.

addressing_gaps:
  - id: voice:gap-ethically-sourced-diverse-voice-data
    name: Absence of an ethically sourced, diverse voice dataset linked to health information
    description: >-
      Recent advances in artificial intelligence have provided techniques to extract
      previously unknown prognostically useful information from dense data elements such as
      images, but comparable work on voice requires an ethically sourced flagship dataset.
    response: >-
      The project addresses the lack of an ethically sourced, diverse voice dataset linked
      to health information by assembling voice-derived data with corresponding clinical
      information under IRB oversight, rigorous de-identification, and a governance
      framework that separates feature-only and raw-audio access tiers.

