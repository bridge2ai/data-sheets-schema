is_deidentified:
  id: voice:deidentification
  name: De-identified feature-only release
  identifiable_elements_present: false
  method: >-
    Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or
    rebased; geographic information is generalized to the country level; narrative text
    fields and transcripts of free speech are removed; and raw voice waveforms are withheld
    from this feature-only release.
  identifiers_removed:
    - Direct identifiers
    - High-risk quasi-identifiers
    - Fine-grained geographic identifiers, generalized to the country level
    - Precise dates, which are coarsened or rebased
    - Narrative text fields and transcripts of free speech
    - Raw voice waveforms, which are themselves biometric identifiers
    - Detailed narrative responses, some household income information, traumatic life experiences and granular cultural identifiers
  deidentification_details:
    - The crate records the release as de-identified.
    - >-
      Prior to release, data are transformed to reduce re-identification risk and align with
      regulatory and ethical requirements.
    - >-
      Additional filtering removes features for sensitive records and audio checks.
    - >-
      Health-related diagnostic categories, symptom scores, and coarsened age, sex and
      country of data collection remain in the release as sensitive but not directly
      identifying content.

variables:
  - id: voice:variable-participant-id
    name: participant_id
    variable_name: participant_id
    data_type: identifier
    is_identifier: true
    description: >-
      Participant key present in every feature and phenotype schema in the release. Declared
      as an integer in the phenotype and most feature schemas and as a string in the PPGs
      schema.
  - id: voice:variable-session-id
    name: session_id
    variable_name: session_id
    data_type: string
    description: >-
      Session key linking recordings and phenotype records for a participant visit; required
      by every feature schema and by the session schema.
  - id: voice:variable-task-name
    name: task_name
    variable_name: task_name
    data_type: string
    description: >-
      Name of the structured acoustic task a feature row was computed from; required by every
      feature schema.
  - id: voice:variable-n-frames
    name: n_frames
    variable_name: n_frames
    data_type: integer
    description: Number of frames in the derived feature tensor; required by every feature schema.
  - id: voice:variable-selected-language
    name: selected_language
    variable_name: selected_language
    data_type: string
    description: >-
      Language selected by the participant; one of only two columns in the participant
      schema.
  - id: voice:variable-recording-id
    name: recording_id
    variable_name: recording_id
    data_type: identifier
    is_identifier: true
    description: >-
      Recording key in the recording schema, which also carries recording duration, input
      gain, microphone, name, profile name, profile version, session id, size and the parent
      acoustic task id.
  - id: voice:variable-acoustic-task-name
    name: acoustic_task_name
    variable_name: acoustic_task_name
    data_type: string
    description: >-
      Name of the acoustic task in the acoustic task schema, which also carries cohort,
      duration, task id, session id and status.

