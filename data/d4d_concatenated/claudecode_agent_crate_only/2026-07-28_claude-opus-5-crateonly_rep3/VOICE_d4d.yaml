updates:
  id: voice:update-plan
  name: Versioned static snapshot release plan
  update_details:
    - >-
      Dataset releases follow a static versioning scheme managed through PhysioNet and
      related platforms, with version numbers such as 1.0, 1.1, 2.0.0, 2.0.1 and 3.0.0 and
      associated DOIs for each snapshot and for the latest version.
    - >-
      Releases are coordinated by the Bridge2AI-Voice project team and the MIT Laboratory for
      Computational Physiology; release notes document added participants, new feature sets,
      reorganized phenotype tables and corrections such as spectrogram reprocessing and
      authorship updates.
    - >-
      Future updates are planned as additional participants are enrolled and Spanish-language
