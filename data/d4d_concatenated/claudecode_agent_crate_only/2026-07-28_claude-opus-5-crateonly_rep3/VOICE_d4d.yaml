informed_consent:
  - id: voice:informed-consent
    name: Informed consent obtained before data collection
    consent_obtained: true
    description: >-
      Eligible adults presenting to voice, neurology, psychiatry and respiratory clinics,
      plus healthy controls, were screened against predefined inclusion and exclusion
      criteria. After informed consent, a standardized protocol was administered.
    consent_scope:
      - >-
        The crate does not describe the consent instrument, the specific uses consented to,
        or any tiering between the feature-only and controlled-access raw-audio releases.
    withdrawal_mechanism:
      - >-
        The crate does not describe a mechanism for participants to revoke consent or
        withdraw their data from released snapshots.

participant_privacy:
  - id: voice:participant-privacy
    name: De-identification and re-identification controls
    anonymization_method:
      - >-
        Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened
        or rebased; geographic information is generalized to the country level; narrative
        text fields and transcripts of free speech are removed; and raw voice waveforms are
        withheld from this feature-only release.
    privacy_techniques:
      - Removal of direct identifiers and high-risk quasi-identifiers
      - Date coarsening and rebasing
      - Generalization of geographic information to the country level
      - Removal of narrative text fields and free-speech transcripts
      - Withholding of raw voice waveforms from the feature-only release
      - Additional filtering of features for sensitive records and audio checks
    reidentification_risk:
      - >-
        Raw voice recordings are themselves biometric identifiers and are made available only
        under controlled access.
      - >-
        De-identification reduces the risk of re-identification but also limits detailed
        fairness assessments and certain confounder adjustments.
      - >-
        The crate does not report a quantitative re-identification risk assessment.
    data_linkage:
      - >-
        The registered-access license and data use agreement explicitly forbid attempts at
        re-identification.

preprocessing_strategies:
  - id: voice:preprocessing-audio-standardization
    name: Audio standardization and segmentation
    preprocessing_details:
      - >-
        Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing
        filtering; they are then segmented by task and passed through quality checks.
    used_software:
      - id: ark:59853/b2ai-voice-software-b2aiprep
        name: B2AIPrep Library
        version: 3.0.2
        url: https://github.com/sensein/b2aiprep
        description: >-
          A simple Python package to prepare acoustic data for the Bridge2AI voice project.
  - id: voice:preprocessing-feature-extraction
    name: Derived feature extraction
    preprocessing_details:
      - >-
        From the standardized audio, multiple derived feature sets are computed including
        spectrograms, mel spectrograms, MFCCs, articulatory features using the Speech
        Articulatory Coding package, pitch and loudness estimates, acoustic features from
        openSMILE, phonetic and prosodic features from Praat and parselmouth, and phonetic
        posteriorgrams using a dedicated model; all are stored as dense tensors in Parquet
        files with participant, session and task identifiers.
      - >-
        The crate records this step as the computation "VOICE Features Processing"
        (ark:59853/computation-b2ai-voice-features-processing), described as taking raw data
        and converting it into spectrograms and features using b2ai-prep, run by Alastair and
        created 01/29/2026.
    used_software:
      - id: ark:59853/b2ai-voice-software-b2aiprep
        name: B2AIPrep Library
        version: 3.0.2
        url: https://github.com/sensein/b2aiprep
        description: >-
          A simple Python package to prepare acoustic data for the Bridge2AI voice project.
  - id: voice:preprocessing-phenotype-etl
    name: Phenotype export, merge and reorganization
    preprocessing_details:
      - >-
        Tabular phenotype and questionnaire files are exported from REDCap and merged using a
        dedicated open-source b2aiprep library, reorganizing the former single phenotype
        table into thematically organized TSV files with accompanying JSON data dictionaries;
        static per-recording feature summaries are provided in static_features.tsv, and
        de-identification and filtering steps are applied before packaging.
      - >-
        The crate records this step as the computation "VOICE Phenotype Ingest"
        (ark:59853/computation-b2ai-voice-phenotype-etl), described as dumping and
        reformatting phenotype information from the REDCap database into b2ai-voice phenotype
        extracts, run by Alastair and created 12/16/2025.
    used_software:
      - id: ark:59853/b2ai-voice-software-b2aiprep
        name: B2AIPrep Library
        version: 3.0.2
        url: https://github.com/sensein/b2aiprep
        description: >-
          A simple Python package to prepare acoustic data for the Bridge2AI voice project.

cleaning_strategies:
  - id: voice:cleaning-deidentification-and-filtering
    name: De-identification, filtering and quality-driven removal
    cleaning_details:
      - >-
        Prior to release, data are transformed to reduce re-identification risk and align
        with regulatory and ethical requirements. Direct identifiers and high-risk
        quasi-identifiers are removed; dates are coarsened or rebased; geographic information
        is generalized to the country level; narrative text fields and transcripts of free
        speech are removed; and raw voice waveforms are withheld from this feature-only
        release.
      - >-
        Additional filtering removes features for sensitive records and audio checks, and
        some derived features are dropped when processing fails or quality checks fail.
      - >-
        Audio segments are passed through quality checks after conversion to mono and
        resampling to 16 kHz.
      - >-
        The data release team audited the combined phenotype and feature tables for internal
        consistency, missingness patterns and data entry issues.

labeling_strategies:
  - id: voice:labeling-strategy
    name: Clinical labels, validated instruments and machine annotation
    annotations_per_item: 1
    data_annotation_protocol:
      - >-
        Annotations for this dataset consist primarily of clinical labels and
        questionnaire-derived measures associated with each participant and recording.
        Participants complete validated instruments such as VHI-10, PHQ-9, GAD-7, PANAS,
        respiratory and cough questionnaires and voice instruments, which generate numerical
        scores and categorical indicators according to each instrument's published scoring
        guidelines. Clinical investigators and care teams record diagnostic categories for
        voice, neurological, mood and respiratory conditions and other phenotype variables,
        drawing on clinical assessments and electronic health records; these labels are
        represented in disease-specific TSV files with accompanying JSON dictionaries. In
        addition, machine-generated transcripts of certain voice tasks and numerous
        automatically extracted acoustic and articulatory features provide further labels and
        descriptors at the recording level.
    data_annotation_platform:
      - >-
        Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of
        acoustic tasks and questionnaires.
      - REDCap-based data capture system used to manage clinical and phenotype data.
      - >-
        Electronic health record systems used as a source of some gold-standard diagnostic
        information.
      - >-
        Open-source preprocessing and curation tools, including the b2aiprep library, used to
        merge and organize annotations with derived features.
    annotator_demographics:
      - >-
        Clinical annotations, including diagnostic labels and certain phenotype variables,
        are created by clinicians and research staff at participating North American
        institutions spanning otolaryngology, neurology, neuroscience, pulmonology and allied
        health disciplines; detailed demographic breakdowns of annotators are not provided in
        the public documentation.
      - >-
        Questionnaire-based labels reflect self-reported information from participants
        themselves, whose demographics are captured in coarsened form in the phenotype
        tables, for example age bands, sex and country of data collection; however,
        per-annotator demographic information, such as which specific clinician or staff
        member entered a label, is not exposed.
    inter_annotator_agreement: >-
      Diagnostic labels are derived from clinical assessments and electronic health records
      rather than crowd workers, so there is no explicit inter-rater majority-vote scheme;
      per-annotator disagreement statistics and detailed label-uncertainty measures are not
      presently included in the released dataset.
    labeling_details:
      - >-
        Each recording is associated with one set of clinical labels and questionnaire
        responses derived from a single participant, although participants may contribute
        multiple sessions over time; there is no crowd-sourced labeling and the documentation
        does not report multiple independent human ratings per individual recording.

raw_sources:
  - id: voice:raw-source-controlled-access-audio
    name: Controlled-access raw audio tier
    raw_data_details:
      - >-
        The raw voice waveforms underlying this feature-only release are not distributed with
        it; access to the underlying raw audio is available only through a separate
        controlled-access process.
      - >-
        The crate does not give a URL, application form or contact point for the
        controlled-access raw-audio process.

imputation_protocols:
  - id: voice:imputation-protocol
    name: No global imputation applied
    imputation_method:
      - >-
        The public datasets do not apply global statistical imputation to missing fields;
        instead, missing questionnaire responses, phenotype variables and derived features are
        left as explicit missing values or omitted rows.
    imputation_rationale: >-
      Users can implement study-specific imputation or complete-case strategies appropriate
      to their analyses.
    imputation_validation:
      - The data release team audited missingness.

annotation_analyses:
  - id: voice:annotation-analysis
    name: Label derivation and quality auditing
    analysis_method: >-
      Questionnaire-based labels are generated using the standard scoring rules for each
      validated instrument, yielding total and subscale scores that can be mapped to
      symptom-severity bands; the scoring logic is encoded in the REDCap instruments and
      documented in the data dictionaries.
    disagreement_patterns:
      - >-
        Diagnostic labels are derived from clinical assessments and electronic health records
        rather than crowd workers, so there is no explicit inter-rater majority-vote scheme;
        however, diagnoses are treated as reference labels and may include multiple comorbid
        conditions per participant.
    annotation_quality_details:
      - >-
        The data release team audited the combined phenotype and feature tables for internal
        consistency, missingness patterns and data entry issues, but per-annotator
        disagreement statistics or detailed label-uncertainty measures are not presently
        included in the released dataset.
      - >-
        The crate reports no inter-annotator agreement score and names no agreement metric.

machine_annotation_tools:
  - id: voice:machine-annotation-tools
    name: Automated feature extraction and transcription tools
    tools:
      - openSMILE
      - Praat
      - parselmouth
      - TorchAudio
      - Speech Articulatory Coding (sparc)
      - Phonetic posteriorgram models
      - OpenAI Whisper Large
      - b2aiprep
    tool_descriptions:
      - >-
        OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and
        spectral characteristics.
      - >-
        Praat and the parselmouth interface for phonetic and prosodic feature extraction,
        including measures of fundamental frequency, formants and voice quality.
      - >-
        TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and
        pitch tracks.
      - >-
        Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and
        related features.
      - >-
        Phonetic posteriorgram models that produce time-varying distributions over phonetic
        units for each recording.
      - >-
        OpenAI Whisper Large for automatic speech transcription of structured speech tasks,
        with transcripts from free-speech audio removed before release.
      - >-
        The open-source b2aiprep library for orchestrating preprocessing, feature extraction
        and merging of phenotype data into the released files.
    tool_accuracy:
      - >-
        The crate reports no accuracy figures for any of these tools. It states that
        off-the-shelf models such as OpenAI Whisper and other audio toolkits may vary in
        performance across demographic groups and that the dataset team has not independently
        audited these tools for fairness.

intended_uses:
  - id: voice:intended-uses
    name: Intended research uses
    examples:
      - >-
        Development, training and fine-tuning of machine-learning models that associate
        voice-derived features with diagnostic categories or symptom severity for conditions
        such as vocal fold pathology, neurological and neurodegenerative diseases, mood and
        anxiety disorders and respiratory illnesses.
      - >-
        Benchmarking and validation of existing voice-biomarker algorithms by testing their
        performance on a clinically diverse, multi-site cohort with standardized tasks and
        rich phenotype data.
      - >-
        Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of
        disease using de-identified derived features, including work on representation
        learning, domain adaptation and multimodal integration with other health data.
      - >-
        Methodological research on fairness, robustness and AI safety in clinical voice
        models, including studies of bias related to demographic subgroups or recording
        conditions, subject to the ethical constraints in the data use agreement.
    usage_notes: >-
      All listed uses are subject to the registered-access license and the associated data
      use agreement.

discouraged_uses:
  - id: voice:discouraged-uses
    name: Uses the release is explicitly not intended for
    discouragement_details:
      - >-
        The dataset is explicitly not intended for operational decision making about specific
        individuals such as hiring, insurance pricing, law enforcement or surveillance, nor
        for attempts at re-identification or for uses likely to stigmatize individuals or
        groups.
      - >-
        Because participants are selected into disease cohorts where voice changes are
        expected, evaluating models only within this dataset may inflate apparent performance
        relative to routine primary care or community settings.

prohibited_uses:
  - id: voice:prohibited-uses
    name: Uses forbidden by the data use agreement
    prohibition_reason:
      - >-
        Use of the data is restricted to authorized researchers under a registered-access
        license and associated data use agreement that explicitly forbids attempts at
        re-identification, stigmatizing or discriminatory uses and applications such as
        surveillance or high-stakes individual decision making.

future_use_impacts:
  - id: voice:future-use-impacts
    name: Risks that may affect future uses
    impact_details:
      - >-
        At the same time, the consortium explicitly recognizes the risks associated with voice
        data, including privacy loss, misuse of voice biometrics and algorithmic harms such as discrimination
        in hiring, insurance or surveillance contexts; these risks motivate a governance
        framework with IRB oversight, rigorous de-identification, separation of feature-only
        and raw-audio tiers and usage restrictions encoded in the registered-access license
        and data use agreement.
      - >-
        Dataset documentation and ongoing ethics workstreams are intended to help downstream
        users reason about these risks and design responsible analyses and models.
      - >-
        The feature-only scope means end-to-end audio pipelines cannot be reproduced from
        this release alone, and the absence of raw waveforms and free-speech transcripts
        constrains future error analysis.

distribution_formats:
  - id: voice:distribution-format
    name: Parquet feature tables and tab-separated phenotype tables
    description: >-
      Derived audio features are stored as dense tensors in Parquet files with participant,
      session and task identifiers. Phenotype and questionnaire data are distributed as
      thematically organized TSV files (media type text/tab-separated-values) with
      accompanying JSON data dictionaries. The release is packaged as a FAIRSCAPE RO-Crate
      conforming to https://w3id.org/ro/crate/1.2, with a machine-readable JSON-LD manifest
      and per-file SHA-256 checksums for the files that declare them.
    access_urls:
      - https://doi.org/10.13026/k81f-qr68

