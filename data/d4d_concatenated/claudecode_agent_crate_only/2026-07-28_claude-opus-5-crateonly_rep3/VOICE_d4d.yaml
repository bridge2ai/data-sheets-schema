instances:
  - id: voice:instance-participant
    name: Participant
    instance_type: participant
    counts: 833
    label: true
    label_description: >-
      Clinical labels and questionnaire-derived measures are associated with each
      participant and recording. Participants complete validated instruments such as VHI-10,
      PHQ-9, GAD-7, PANAS, respiratory and cough questionnaires and voice instruments, which
      generate numerical scores and categorical indicators according to each instrument's
      published scoring guidelines. Clinical investigators and care teams record diagnostic
      categories for voice, neurological, mood and respiratory conditions and other
      phenotype variables, drawing on clinical assessments and electronic health records.
    description: >-
      Bridge2AI-Voice v3.0 contains data for 833 participants across five sites in North
      America. Participants were selected based on known conditions which manifest within
      the voice waveform including voice disorders, neurological disorders, mood disorders,
      and respiratory disorders. Participant-level rows are keyed by participant_id across
      the phenotype tables.
    missing_information:
      - id: voice:missing-participant-rows
        name: Sparse participant rows and questionnaire coverage
        missing:
          - Rows for participants with no non-missing variable in a given phenotype table
          - Questionnaire forms and items not completed by a participant or cohort
          - Derived audio features that could not be computed for some recordings
          - Features relating to free speech or sensitive records, removed before release
        why_missing:
          - >-
            Phenotype tables include a row for a participant only when at least one variable
            is non-missing, and participants may have repeated visits with differing
            responses.
          - >-
            Questionnaire completion varies by participant and cohort, so some forms and
            items are systematically or sporadically missing.
          - >-
            Some derived audio features could not be computed for all recordings due to
            quality or length constraints.
          - >-
            Features relating to free speech or sensitive records have been removed as part
            of de-identification.
  - id: voice:instance-recording-derived-features
    name: Recording-level derived feature rows
    instance_type: recording-level derived feature row
    label: false
    description: >-
      Derived representations of each voice recording are stored as dense tensors in Parquet
      files keyed by participant, session and task identifiers. The feature schemas declare
      participant_id, session_id and task_name together with the feature payload and a
      frame count. Feature sets include phonetic posteriorgrams, Speech Articulatory Coding
      electromagnetic articulography, loudness, periodicity and pitch, torchaudio
      spectrograms, mel spectrograms, MFCCs and pitch tracks. The crate does not state the
      number of recordings or feature rows.

anomalies:
  - id: voice:anomaly-derived-feature-gaps
    name: Missing and dropped derived features
    anomaly_details:
      - >-
        Some derived audio features could not be computed for all recordings due to quality
        or length constraints, and no additional imputation is applied in the released files.
      - >-
        Additional filtering removes features for sensitive records and audio checks, and
        some derived features are dropped when processing fails or quality checks fail.
      - >-
        Transcripts and some derived features rely on off-the-shelf models such as OpenAI
        Whisper and other audio toolkits whose performance may vary across demographic
        groups; the dataset team has not independently audited these tools for fairness.
  - id: voice:anomaly-crate-metadata-inconsistencies
    name: Internal inconsistencies in the release metadata
    anomaly_details:
      - >-
        Two feature entities carry a name that does not match their own content path: the
        entity at ark:59853/b2ai-voice-dataset-feature-sparc-periodicity is named
        sparc_loudness.parquet while pointing at features/sparc_periodicity.parquet, and the
        entity at ark:59853/b2ai-voice-dataset-feature-torchaudio-pitch is named
        torchaudio_spectrogram.parquet while pointing at features/torchaudio_pitch.parquet.
      - >-
        Two phenotype entities share the name "VOICE Questionnaire Tables"
        (ark:59853/b2ai-voice-dataset-phenotype-questionnaire and
        ark:59853/b2ai-voice-dataset-phenotype-task).
      - >-
        Two distinct schema records both carry the identifier
        ark:59853/b2ai-voice-schema-phenotype-confounders, one named "Phenotype Confounders
        Schema" and one named "Phenotype Demographics Schema".
      - >-
        Per-file descriptions are unfilled placeholders ("a datafile description" for feature
        files, "A Dataset description" for phenotype files), so no file-level prose
        documentation is carried by the release metadata.
      - >-
        A "Static Features Schema" for static_features.tsv is declared, but no corresponding
        file entity appears in the release inventory.
      - >-
        Release-level counts disagree: fifteen data entities are documented, while the
        AI-readiness self-assessment reports checksum coverage as 11 of 17 files.
      - >-
        The feature file features/sparc_pitch.parquet declares a publication date of
        08/18/2025 while every other inventoried file declares 12/16/2025, the release date.

known_biases:
  - id: voice:bias-sampling
    name: Sampling bias
    bias_type: sampling_bias
    bias_description: >-
      Participants are recruited from specialty clinics and associated institutions using a
      non-probability sampling strategy, with inclusion focused on specific disease cohorts
      and fluent English speakers; this produces clinically enriched case mixes that may not
      represent general population distributions.
  - id: voice:bias-geographic-cultural
    name: Geographic and cultural bias
    bias_type: representation_bias
    bias_description: >-
      Data are collected at a limited number of North American sites, and although the
      project seeks diversity, it may under-represent speakers from other regions, cultures,
      languages and healthcare systems; early releases focus on English, with Spanish
      protocols planned but not yet fully represented.
  - id: voice:bias-clinical-spectrum
    name: Clinical spectrum bias
    bias_type: selection_bias
    bias_description: >-
      Because participants are selected into disease cohorts where voice changes are
      expected, the prevalence and severity of conditions in the dataset differ from those in
      routine primary care or community settings, which may inflate model performance when
      evaluated within this dataset.
  - id: voice:bias-device-environment
    name: Device and environment bias
    bias_type: measurement_bias
    bias_description: >-
      Recordings are made using standardized but not identical hardware and primarily in
      clinical environments; future at-home collection or deployment on other devices may
      encounter different background noise, channel characteristics and user behavior.
  - id: voice:bias-machine-annotation
    name: Algorithmic bias in machine annotations
    bias_type: algorithmic_bias
    bias_description: >-
      Transcripts and some derived features rely on off-the-shelf models such as OpenAI
      Whisper and other audio toolkits whose performance may vary across demographic groups;
      the dataset team has not independently audited these tools for fairness, so downstream
      users should consider their biases when interpreting results.

known_limitations:
  - id: voice:limitation-feature-only-release
    name: Feature-only release without raw audio or free-speech transcripts
    limitation_type: scope_limitation
    limitation_description: >-
      The feature-only release does not include raw audio waveforms or free-speech
      transcripts, which limits certain types of modeling and error analysis and may
      constrain the ability to reproduce end-to-end audio pipelines.
  - id: voice:limitation-adult-english-cohort
    name: Adult cohort and limited language coverage
    limitation_type: coverage_limitation
    limitation_description: >-
      This version only includes an adult cohort; models trained solely on this dataset may
      not generalize to younger age groups or to languages beyond those represented.
  - id: voice:limitation-deidentification-granularity
    name: Granularity lost to de-identification
    limitation_type: resolution_limitation
    limitation_description: >-
      Because of de-identification, some granular demographic and socio-economic variables,
      fine-grained location data and narrative context have been removed, which reduces the
      risk of re-identification but also limits detailed fairness assessments and certain
      confounder adjustments.
  - id: voice:limitation-no-splits-or-label-uncertainty
    name: No predefined splits, benchmarks or label-uncertainty measures
    limitation_type: methodological_limitation
    limitation_description: >-
      The dataset does not provide predefined train–validation–test splits or benchmarking
      tasks and does not include explicit per-instance label-uncertainty measures, so
      researchers must design their own evaluation protocols and handle label noise and
      missingness.
  - id: voice:limitation-access-governance
    name: Access governance constrains participation and reproducibility
    limitation_type: integration_limitation
    limitation_description: >-
      The registered-access and controlled-access governance structure is appropriate for
      privacy but may limit participation by some institutions or researchers and can
      complicate the reproducibility of pipelines that require both features and raw audio.

confidential_elements:
  - id: voice:confidentiality-limited-dataset
    name: Limited dataset released under a data use agreement
    confidential_elements_present: true
    confidentiality_details:
      - 'Crate confidentiality level: "Limited dataset available with Data Use Agreement".'
      - >-
        Use of the data is restricted to authorized researchers under a registered-access
        license and associated data use agreement.
      - >-
        Raw voice recordings, which are themselves biometric identifiers, are made available
        only under controlled access, separately from this feature-only release.

subpopulations:
  - id: voice:subpopulations-disease-cohorts
    name: Disease cohorts and coarsened demographic strata
    subpopulation_elements_present: true
    identification:
      - >-
        Participants were selected based on known conditions which manifest within the voice
        waveform including voice disorders, neurological disorders, mood disorders, and
        respiratory disorders.
      - >-
        Disease-specific phenotype tables and schemas identify cohorts including ADHD in
        adults, airway stenosis, amyotrophic lateral sclerosis, anxiety, benign lesions,
        bipolar disorder, cognitive impairment, control, COPD and asthma, depression,
        glottic insufficiency, laryngeal cancer, laryngeal dystonia, laryngitis, muscle
        tension dysphonia, Parkinson's disease, precancerous lesions, psychiatric history,
        PTSD in adults, unexplained chronic cough, and unilateral vocal fold paralysis.
      - >-
        Demographic variables such as age, sex and country of data collection are included in
        coarsened form in the phenotype tables.
    distribution:
      - >-
        The crate does not report participant counts or percentage distributions for any
        cohort or demographic stratum.

sensitive_elements:
  - id: voice:sensitive-elements
    name: Sensitive personal health and demographic content
    sensitive_elements_present: true
    sensitivity_details:
      - >-
        The dataset encodes health-related information including diagnostic categories for
        voice disorders, neurological and neurodegenerative conditions, mood and psychiatric
        disorders and respiratory diseases, as well as symptom scores from questionnaires,
        which constitute sensitive personal health data.
      - >-
        Demographic variables such as age, sex and country of data collection are included in
        coarsened form, while finer-grained geographic identifiers, direct identifiers and
        many socio-economic and cultural details have been removed during de-identification
        to reduce re-identification risk.
      - >-
        Highly sensitive content including detailed narrative responses, some information
        about household income, traumatic life experiences and granular cultural identifiers
        has been removed entirely from this feature-only dataset; raw voice recordings, which
        are themselves biometric identifiers, are made available only under controlled access.
      - >-
        Use of the data is restricted to authorized researchers under a registered-access
        license and associated data use agreement that explicitly forbids attempts at
        re-identification, stigmatizing or discriminatory uses and applications such as
        surveillance or high-stakes individual decision making.

relationships:
  - id: voice:relationships-keys
    name: Participant, session, task and recording linkage
    relationship_details:
      - >-
        Feature tables are keyed by participant_id, session_id and task_name, and every
        feature schema requires those three identifiers alongside the feature payload and a
        frame count.
      - >-
        Phenotype tables are keyed by participant_id; session, acoustic-task and recording
        tables add session_id, acoustic_task_id and recording_id, allowing questionnaire and
        diagnostic records to be joined to recording-level features.
      - >-
        Phenotype tables include a row for a participant only when at least one variable is
        non-missing, and participants may have repeated visits with differing responses.

splits:
  - id: voice:splits-none
    name: No predefined splits
    split_details:
      - >-
        The dataset does not provide predefined train–validation–test splits or benchmarking
        tasks, so researchers must design their own evaluation protocols.

acquisition_methods:
  - id: voice:acquisition-methods
    name: Direct measurement, surveys and derived features
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: true
    acquisition_details:
      - 'Crate data collection types: Direct measurement; Surveys; Self-reporting; Secondary Data analysis; Document analysis.'
      - >-
        Voice, speech and respiratory audio was directly measured under a standardized
        protocol of structured tasks such as sustained vowels, coughs and reading passages.
      - >-
        Demographic questions, health history, disease-specific questionnaires and other
        patient-reported outcomes were self-reported by participants.
      - >-
        Clinical diagnoses and other metadata were extracted from electronic health records.
      - >-
        The released data are de-identified derived representations of the audio, such as
        spectrograms, mel spectrograms, MFCCs, articulatory and prosodic features and
        phonetic posteriorgrams, computed from the raw recordings.
      - >-
        The crate does not state whether acquired values were independently validated or
        verified.

collection_mechanisms:
  - id: voice:collection-mechanisms
    name: Mobile and tablet application, REDCap, and electronic health records
    mechanism_details:
      - >-
        Data were captured on a mobile or tablet application and stored in REDCap, with most
        participants completing a single in-clinic session and a subset completing repeated
        sessions.
      - >-
        A custom Bridge2AI-Voice mobile and tablet application was used for in-clinic
        collection of acoustic tasks and questionnaires.
      - >-
        A REDCap-based data capture system was used to manage clinical and phenotype data.
      - >-
        Electronic health record systems were used as a source of some gold-standard
        diagnostic information.
      - >-
        Audio was recorded on tablet or smartphone devices with headset microphones when
        available.

sampling_strategies:
  - id: voice:sampling-strategy
    name: Non-probability clinic-based cohort sampling
    is_sample: true
    is_random: false
    is_representative: false
    strategies:
      - >-
        Eligible adults presenting to voice, neurology, psychiatry and respiratory clinics,
        plus healthy controls, were screened against predefined inclusion and exclusion
        criteria.
      - >-
        Participants are recruited from specialty clinics and associated institutions using a
        non-probability sampling strategy, with inclusion focused on specific disease cohorts
        and fluent English speakers.
      - >-
        The release is a static snapshot of an ongoing collection: version 3.0.0 contains 833
        participants against an anticipated enrollment of approximately 3,000 participants by
        November 2026.
    why_not_representative:
      - >-
        Non-probability sampling from specialty clinics produces clinically enriched case
        mixes that may not represent general population distributions.
      - >-
        Data are collected at a limited number of North American sites and may
        under-represent speakers from other regions, cultures, languages and healthcare
        systems.
      - >-
        Because participants are selected into disease cohorts where voice changes are
        expected, the prevalence and severity of conditions in the dataset differ from those
        in routine primary care or community settings.

data_collectors:
  - id: voice:data-collectors
    name: Clinicians and research staff at participating North American institutions
    collector_details:
      - >-
        Clinical annotations, including diagnostic labels and certain phenotype variables,
        are created by clinicians and research staff at participating North American
        institutions spanning otolaryngology, neurology, neuroscience, pulmonology and allied
        health disciplines.
      - >-
        Detailed demographic breakdowns of the clinicians and staff who collected or entered
        data are not provided in the crate.
      - >-
        The crate does not state how collection personnel were compensated or whether they
        were employees, contractors or volunteers.

collection_timeframes:
  - id: voice:collection-timeframe
    name: Collection window and release snapshots
    timeframe_details:
      - >-
        Data collection for the adult flagship cohort began after project launch in 2023 and
        is ongoing across five North American sites toward an anticipated enrollment of
        approximately 3,000 participants by November 2026; the participants and recordings
        included in dataset version 3.0.0 were collected roughly between 2023 and 2025.
      - >-
        Dataset releases are static snapshots: v1.0 (initial public release in 2024), v1.1
        (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), each
        corresponding to a frozen state of the underlying data collection.

direct_collection:
  - id: voice:direct-collection
    name: Data obtained directly from participants
    is_direct: true
    collection_details:
      - >-
        Prospective observational study conducted at multiple specialty clinics and academic
        hospitals across North America. Eligible adults presenting to voice, neurology,
        psychiatry and respiratory clinics, plus healthy controls, were screened against
        predefined inclusion and exclusion criteria. After informed consent, a standardized
        protocol was administered directly to participants.
      - >-
        Clinical diagnoses and other metadata were additionally extracted from electronic
        health records rather than collected directly from the participant.

collection_consents:
  - id: voice:collection-consent
    name: Informed consent before protocol administration
    consent_details:
      - >-
        After informed consent, a standardized protocol was administered that combined
        structured voice and respiratory tasks such as sustained vowels, coughs and reading
        passages with demographic questions, health history, disease-specific questionnaires
        and other patient-reported outcomes.
      - >-
        The crate does not reproduce the consent language, consent form versions, or the
        scope of uses participants consented to.

missing_data_documentation:
  - id: voice:missing-data-documentation
    name: Missingness in phenotype tables and derived features
    missing_data_patterns:
      - >-
        Phenotype tables include a row for a participant only when at least one variable is
        non-missing, and participants may have repeated visits with differing responses.
      - >-
        Questionnaire completion varies by participant and cohort, so some forms and items
        are systematically or sporadically missing.
      - >-
        Some derived audio features could not be computed for all recordings due to quality or
        length constraints, and features relating to free speech or sensitive records have been
        removed.
    missing_data_causes:
      - Audio quality or length constraints preventing feature computation
      - Variable questionnaire completion by participant and cohort
      - Removal of features relating to free speech or sensitive records before release
    handling_strategy: >-
      No additional imputation is applied in the released files; missing questionnaire
      responses, phenotype variables and derived features are left as explicit missing values
      or omitted rows.

raw_data_sources:
  - id: voice:raw-data-source
    name: Raw voice, speech and respiratory audio with questionnaire and EHR records
    source_description: >-
      The original raw data consist of high-quality voice, speech and respiratory audio
      waveforms recorded on tablet or smartphone devices with headset microphones when
      available, plus responses to structured demographic and medical history questionnaires,
      disease-specific validated questionnaires and other patient-reported outcomes, together
      with clinical diagnoses and other metadata extracted from electronic health records.
    source_type:
      - Voice, speech and respiratory audio waveforms
      - Structured demographic and medical history questionnaires
      - Disease-specific validated questionnaires and patient-reported outcomes
      - Clinical diagnoses and metadata extracted from electronic health records
    access_details: >-
      The public feature-only PhysioNet release contains de-identified derived
      representations of the audio, such as spectrograms, mel spectrograms, MFCCs,
      articulatory and prosodic features and phonetic posteriorgrams, along with tabular
      phenotype files and data dictionaries; access to the underlying raw audio is available
      only through a separate controlled-access process.
    raw_data_format:
      - Audio waveforms recorded on tablet or smartphone devices with headset microphones
      - REDCap questionnaire and phenotype records
      - Electronic health record extracts

