      - processed_data
    file_count: 9
    total_bytes: 13788089083
    description: >-
      Nine Parquet files holding dense derived-feature tensors keyed by participant, session
      and task: phonetic posteriorgrams, Speech Articulatory Coding EMA, loudness,
      periodicity and pitch, torchaudio MFCC, pitch, spectrogram and mel spectrogram. All
      nine declare a size and a SHA-256 checksum and are generated by the "VOICE Features
      Processing" computation. The byte total is the sum of the nine declared sizes; the
      crate separately states a release content size of "12.9 GB". No media type is recorded
      for these files.
  - id: voice:fc-phenotype
    name: Phenotype and questionnaire tables
    path: phenotype/
    collection_type:
      - processed_data
    description: >-
      Six documented phenotype entities of media type text/tab-separated-values, generated by
      the "VOICE Phenotype Ingest" computation: confounders.tsv and demographics.tsv, each a
      single file with a declared size and SHA-256 checksum, plus four grouped entities
      (VOICE Diagnosis Tables, VOICE Enrollment Tables, and two entities both named VOICE
      Questionnaire Tables) that declare no content path, size or checksum. No file count or
      byte total can be derived for this collection from the crate. Fifty-five column-level
      schemas are declared for the phenotype and feature tables, covering disease cohorts,
      validated instruments, sessions, recordings and acoustic tasks.

