anomalies:
- name: Interim release with embargoed components
  anomaly_details:
  - These data are not yet in completed final form, and some datasets are under temporary
    pre-publication embargo. Protein-protein interaction (SEC-MS), protein localization (IF
    imaging), and CRISPRi perturbSeq data interrogate sets of proteins which incompletely
    overlap. Computed cell maps not included in this release.
  - The crate records the access URL for the Perturbation Cell Atlas raw sequence data component
    as 'Embargoed'.
- name: Sparse checksum coverage
  anomaly_details:
  - The AI-readiness self-assessment reports that 0% of files have checksums (8/55859 entities).
  - The crate reports 0 entities with summary statistics.
- name: Divergent statements of total content size
  anomaly_details:
  - The crate states a human-readable content size of '19.9 TB' while reporting evi:totalContentSizeBytes
    as 21051331945400 bytes; the two figures are not equal under either decimal or binary
    interpretation.
known_biases:
- name: Cell-line-derived data do not represent population variation
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines, and does not represent all biological variants which may be seen in
    the population at large.
known_limitations:
- name: Interim release without predicted cell maps
  limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps,
    which will be added in future releases.
  scope_impact: The current release is most suitable for bioinformatics analysis of the individual
    datasets.
- name: Incomplete overlap between modalities
  limitation_type: integration_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap.
  scope_impact: Cross-modality integration is limited to the intersecting protein sets. Computed
    cell maps are not included in this release.
- name: Domain expertise required
  limitation_type: methodological_limitation
  limitation_description: Requires domain expertise for meaningful analysis.
