resources:
- id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-paclitaxel
  name: EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468 Cells
    Upon Paclitaxel Perturbation
  description: This submission comprises affinity purification mass spectrometry (AP-MS) raw
    data generated from endogenously tagged MDA-MB-468 cells under Paclitaxel perturbation.
    The dataset focuses on drug-induced interactome rewiring of chromatin modifiers relevant
    to the triple-negative breast cancer context. All AP-MS experiments were performed in
    four biological replicates. Each AP-MS batch includes an untagged parental control, 10
    chromatin modifier tagged cell lines, and a positive control tagged line. DMSO-treated
    samples serve as vehicle control across all AP-MS experiments (Unpublished data).
  keywords:
  - proteomics
  - mass spectrometry
