  - AI/machine learning model training
  - Cellular process analysis
  - Analysis of cell architectural changes and interactions in the presence of specific disease
    processes, treatment conditions, or genetic perturbations
  usage_notes: These laboratory data are not to be used in clinical decision-making or in
    any context involving patient care without appropriate regulatory oversight and approval.
  use_category:
  - research use
  description: 'AI-ready datasets to support research in functional genomics, AI/machine learning
    model training, cellular process analysis, cell architectural changes, and interactions
    in presence of specific disease processes, treatment conditions, or genetic perturbations.
    A major goal is to enable biologically-driven, interpretable ML applications, for example
    as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).'
