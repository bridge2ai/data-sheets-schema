acquisition_methods:
- name: Laboratory measurement across four assay modalities
  was_directly_observed: true
  acquisition_details:
  - Perturb-seq
  - IF imaging
  - SEC-MS
  - AP-MS
  description: The crate records rai:dataCollectionType for the release as 'Perturb-seq; IF
    imaging; SEC-MS; AP-MS'. Eight of the nine component crates record 'Perturb-seq; IF imaging;
    SEC-MS' without AP-MS; only the SEC-MS KOLF2 differentiation package records the four-modality
    list, and it does so even though it contains no AP-MS data of its own.
collection_mechanisms:
- name: Assay modalities used to generate the release
  mechanism_details:
  - CRISPRi Perturb-seq (single-cell RNA sequencing of perturbed KOLF2.1J hiPSCs)
  - Immunofluorescence imaging (ICC-IF) with confocal microscopy of MDA-MB-468 cells; nuclei
    stained with DAPI (blue channel), endoplasmic reticulum with a calreticulin antibody (yellow
    channel), microtubules with tubulin antibody (red channel), and an antibody against the
    protein of interest (green channel)
  - Size exclusion chromatography coupled to mass spectrometry (SEC-MS) for protein correlation
    profiling, acquired on a Bruker timsTOF platform
  - Affinity purification mass spectrometry (AP-MS) of endogenously tagged MDA-MB-468 cells,
    in four biological replicates per experiment, with an untagged parental control, ten chromatin
    modifier tagged cell lines and a positive control tagged line per batch, and DMSO-treated
    vehicle controls
  description: 'Data collection processes are generally described in Clark T et al. (2024)
    "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from
    Disease-Relevant Cell Lines" bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311.
    Additional data collection details will be subsequently published once finalized.'
sampling_strategies:
- name: Cell-line sampling
  is_representative: false
  why_not_representative:
  - Data in this release was derived from commercially available de-identified human cell
    lines, and does not represent all biological variants which may be seen in the population
    at large.
  source_data:
  - KOLF2.1J human induced pluripotent stem cells (Cellosaurus CVCL_B5P3), undifferentiated
    and differentiated to neural progenitor cells, neurons and cardiomyocytes
  - MDA-MB-468 breast cancer cells (Cellosaurus CVCL_0419), in the presence and absence of
    vorinostat and paclitaxel
