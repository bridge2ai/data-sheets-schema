purposes:
- name: Functional Genomics Grand Challenge of NIH Bridge2AI
  response: This dataset is the June 2026 Data Release of Cell Maps for Artificial Intelligence
    (CM4AI; CM4AI.org), the Functional Genomics Grand Challenge in the NIH Bridge2AI program.
    CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using the FAIRSCAPE framework.
- name: AI-ready data for functional genomics and machine learning
  response: AI-ready datasets to support research in functional genomics, AI/machine learning
    model training, cellular process analysis, cell architectural changes, and interactions
    in presence of specific disease processes, treatment conditions, or genetic perturbations.
tasks:
- name: AI and machine learning model training
  response: The crate names AI/machine learning model training as a use case the release is
    intended to support.
- name: Analysis of cellular processes and cell architecture
  response: Cellular process analysis, cell architectural changes, and interactions in presence
    of specific disease processes, treatment conditions, or genetic perturbations.
- name: Bioinformatics analysis of the individual component datasets
  response: The crate states that the current release is most suitable for bioinformatics
    analysis of the individual datasets.
addressing_gaps:
- name: Interpretable, biologically-driven machine learning
  response: 'A major goal is to enable biologically-driven, interpretable ML applications,
    for example as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID:
    33096023).'
- name: AI-ready packaging of multimodal cell-architecture data
  response: CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready
    datasets in RO-Crate format using the FAIRSCAPE framework, so that multimodal cell-architecture
    measurements are distributed with machine-readable provenance.
