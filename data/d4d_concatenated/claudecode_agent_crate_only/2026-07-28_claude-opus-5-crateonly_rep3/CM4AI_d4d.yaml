future_use_impacts:
- name: Planned augmentation of the release
  impact_details:
  - Data presented here will be augmented regularly through the end of the project.
  - Predicted cell maps are absent from this release and will be added in future releases,
    so analyses built on this release alone will not reflect the completed resource.
intended_uses:
- name: Intended research uses
  examples:
