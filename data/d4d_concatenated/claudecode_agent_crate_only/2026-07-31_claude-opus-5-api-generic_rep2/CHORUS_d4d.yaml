was_derived_from: >-
  Routine clinical care data (electronic health records, imaging, high-resolution physiologic
  waveforms, and clinical note and report text) generated at participating CHoRUS hospitals and
  repurposed for research under IRB oversight.
conforms_to: >-
  RO-Crate 1.2 (https://w3id.org/ro/crate/1.2); the package additionally applies the Croissant
  Responsible AI (rai:) property set and schema.org vocabulary.
conforms_to_schema: >-
  OMOP Common Data Model for electronic health record data; WFDB standard for high-resolution
  physiologic waveform data. The AI-readiness assessment of the crate records 44 documented schemas.
