purposes:
  - description: >-
      To develop a flagship multi-hospital, multimodal, high-resolution clinical dataset under the NIH
      Bridge2AI program by harmonizing EHR, imaging, high-resolution physiologic signal, and tokenized
      clinical text data across participating institutions.
  - description: >-
      To enable secure, auditable, and reproducible artificial intelligence research aimed at improving
      recovery from acute illness.
  - description: >-
      To support AI model development, validation, benchmarking, and translational research while
      maintaining compliance with HIPAA and NIH data-sharing policies.

tasks:
  - description: AI model training conducted within the secure enclave.
  - description: Model validation and benchmarking.
  - description: Algorithm development and feature engineering.
  - description: Fine-tuning of multimodal models.
  - description: Reinforcement learning and development of expert AI.

intended_uses:
  - description: AI model training within the enclave.
  - description: Model validation and benchmarking.
  - description: Algorithm development and feature engineering.
  - description: Retrospective hypothesis testing.
  - description: Fine-tuning of multimodal models.
  - description: Comparative effectiveness research.
  - description: Reinforcement learning and development of expert AI.
  - description: Methodological research in trustworthy AI.
  - description: Trial emulation or powering.
  - description: >-
      All usage must align with the approved research scope and CHoRUS governance policies.

discouraged_uses:
  - description: >-
      Direct translation of trained algorithms to real-time clinical deployment without validation or
      regulatory clearance is not recommended.
  - description: Use of the dataset as sole evidence for clinical decision-making is not recommended.
  - description: >-
      Population inference beyond the participating institutions is not recommended; generalizability
      beyond participating hospitals is limited.
  - description: >-
      The dataset is not appropriate for contact tracing or for patient-level intervention.

prohibited_uses:
  - description: >-
      Re-identification attempts are prohibited; the dataset is not appropriate for re-identification
      and prohibition of re-identification attempts is an explicit control of the enclave environment.
  - description: >-
      Export of raw data outside the secure enclave environment is not permitted unless explicitly
      approved; data export restrictions and output review procedures are enforced.
  - description: >-
      Data may not be used for commercial purposes unless specifically authorized through a separate
      agreement consistent with the governing award and consortium terms.

known_limitations:
  - description: >-
      Observational data, not randomized; collected as real-world clinical data rather than through
      prospective research interactions with patients.
  - description: >-
      Documentation quality is dependent on routine clinical workflows and on which data elements are
      collected in clinical practice.
  - description: >-
      Variable sampling rates across real-world data from hospital waveform systems and middleware.
  - description: Institutional heterogeneity in coding and clinical data collection practices.
  - description: Limited generalizability beyond participating hospitals.
  - description: >-
      Not appropriate for re-identification, contact tracing, or patient-level intervention.
  - description: >-
      Hold-out splits are available for testing; training and validation in development splits require
      internal mechanisms to avoid overfitting.
  - description: >-
      This release is an interim release with partial data: not all patients in the CHoRUS full cohort
      are included, and no DICOM images are included.
  - description: >-
      Checksum coverage is incomplete: the AI-readiness assessment of the crate reports that 1469 of
      1477 files carry checksums (99%), leaving 8 files without a verifiable checksum.
  - description: >-
      No statistical characterization of the dataset is available; the AI-readiness assessment records
      the statistics dimension as having no content.

known_biases:
  - description: Referral bias from tertiary/quaternary academic centers.
  - description: >-
      Socioeconomic and demographic distribution reflective of the participating institutions.
  - description: Documentation bias in clinical notes.
  - description: >-
      Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
  - description: >-
      Differential care pathways affecting label assignment (e.g., ICU versus non-ICU populations).
  - description: Temporal trends related to evolving clinical practice.
  - description: >-
      Bias assessment is ongoing and is documented in the dataset release notes.

anomalies:
  - description: >-
      Variable sampling rates across real-world data from hospital waveform systems and middleware,
      recorded in the crate as the data-quality issue for this dataset.

missing_data_documentation:
  - description: >-
      Missing data arise from variable sampling rates across real-world data from hospital waveform
      systems and middleware, and from missingness not at random (MNAR) in laboratory, waveform, and
      imaging acquisition.
  - description: >-
      Completeness statement for this release: interim release with partial data; not all patients in
      the CHoRUS full cohort are included; no DICOM images are included.

instances:
  - description: >-
      Electronic health record data extracted from routine clinical care and transformed to the OMOP
      common data model.
  - description: >-
      High-resolution physiologic waveform data (including telemetry data and EEG where available)
      captured from hospital waveform systems and transformed to the WFDB standard.
  - description: >-
      Imaging data with metadata de-identified using the RSNA Clinical Trial Processor and pixel-level
      de-identification using IbisWorks EICON. No DICOM images are included in this interim release.
  - description: >-
      Tokenized note and report text produced with the OHNLP toolkit; raw note text is retained locally
      at the contributing institutions.

acquisition_methods:
  - description: >-
      Data are derived from routine clinical care at participating hospitals under IRB oversight and
      repurposed from clinical workflows; they were not collected solely for research.
  - description: >-
      Electronic health record extraction and transformation to the OMOP common data model.
  - description: >-
      High-resolution physiologic waveform capture, extraction, and transformation to the WFDB standard.

collection_mechanisms:
  - description: >-
      Hospital electronic health record systems, with extraction and ETL to the OMOP common data model.
  - description: >-
      Hospital waveform systems and middleware, with capture and transformation to the WFDB standard.
  - description: >-
      Imaging systems, with metadata de-identification using the RSNA Clinical Trial Processor and
      pixel-level de-identification using IbisWorks EICON.
  - description: >-
      Clinical note and report text processed with the OHNLP toolkit for tokenization, with raw text
      retained locally.

direct_collection:
  - description: >-
      Data were not obtained directly from individuals for research purposes; they were repurposed from
      routine clinical workflows at participating hospitals under ethical oversight.

data_collectors:
  - description: >-
      Participating CHoRUS medical centers and subaward sites, which perform local curation and
      harmonization; copyrights are owned by each subaward site for curation performed locally.
  - description: >-
      The CHoRUS Data Pillar, in collaboration with institutional data stewards.

splits:
  - description: >-
      Hold-out splits are available for testing. Training and validation performed in the development
      splits require internal mechanisms to avoid overfitting.

preprocessing_strategies:
  - description: >-
      Standardized harmonization of source data to common data models across participating institutions.
  - description: >-
      Transformation of electronic health record data to the OMOP common data model.
  - description: >-
      Transformation of high-resolution physiologic waveform data to the WFDB standard.
  - description: >-
      Tokenization of note and report text using the OHNLP toolkit, with raw text retained locally at
      contributing institutions.
  - description: >-
      De-identification of imaging metadata using the RSNA Clinical Trial Processor and pixel-level
      de-identification using IbisWorks EICON.

raw_data_sources:
  - source_description: >-
      Routine clinical care records at participating CHoRUS hospitals, including electronic health
      record data later transformed to the OMOP common data model.
  - source_description: >-
      Hospital waveform systems and middleware supplying high-resolution physiologic signals, including
      telemetry data and EEG where available.
  - source_description: >-
      Clinical imaging archives at participating institutions, supplying imaging data subject to
      metadata and pixel-level de-identification.
  - source_description: >-
      Clinical note and report text at participating institutions; raw text is retained locally and only
      tokenized text is harmonized into the repository.

raw_sources:
  - description: >-
      Raw source data are the clinical records, waveform streams, imaging studies, and note/report text
      generated during routine clinical care at contributing medical centers. Raw note text is retained
      locally at each institution rather than centralized.

machine_annotation_tools:
  - description: >-
      OHNLP toolkit, used to tokenize clinical note and report text.

sensitive_elements:
  - description: >-
      The dataset derives from patient clinical care records and is assigned confidentiality level
      HL7:2V (very restricted).
  - description: >-
      Direct identifiers are removed or tokenized; date fields are shifted or limited when required.
  - description: >-
      Personal and sensitive information is managed within a secure enclave environment aligned with
      NIST 800-53 controls, with role-based access control, multi-factor authentication, and full audit
      logging of data access and queries.

confidential_elements:
  - description: >-
      Raw note and report text is retained locally at the participating institutions; only tokenized
      note and report text is harmonized across the repository.
  - description: >-
      No raw data export from the secure enclave is permitted unless explicitly approved; output review
      procedures are applied to reduce re-identification risk.

is_deidentified:
  description: >-
    The dataset is de-identified. De-identification is consistent with HIPAA Safe Harbor and includes
    removal or tokenization of direct identifiers, date shifting or limited date fields where required,
    imaging metadata de-identification with the RSNA Clinical Trial Processor, and pixel-level
    de-identification with IbisWorks EICON. Re-identification risk is periodically assessed and
    mitigation strategies are updated as needed; re-identification attempts are prohibited.

human_subject_research:
  description: >-
    Human subject research: Yes. Reviewed under Mass General Brigham Institutional Review Board protocol
    #2022P000707, with human subject exemption 4 (45 CFR 46.104(d)(4)) recorded as a HIPAA exemption. The
    crate records the dataset as FDA-regulated and as de-identified.

ethical_reviews:
  - description: >-
      Ethical review conducted by Eric S. Rosenthal, Michael J. Young, Ishan Williams, Ashley Cordes, and
      Barbara J. Evans in collaboration with the Mass General Brigham IRB, with local context review by
      IRBs, HIPAA Privacy Officers, and institutional counsels at contributing medical centers.
  - description: >-
      Reviewing body: Mass General Brigham Institutional Review Board (MGB IRB), 399 Revolution Drive,
      Suite 710, Somerville, MA 02145, US. IRB Reliance and Compliance contact: irbreliance@mgb.org,
      +1-857-282-1900. IRB protocol identifier #2022P000707.

informed_consent:
  - description: >-
      Data are repurposed from routine clinical care rather than collected through prospective research
      interactions with patients. Ethical safeguards include IRB approval or waiver as appropriate, and
      the crate records human subject exemption 4 (45 CFR 46.104(d)(4)).

participant_privacy:
  - description: >-
      Layered privacy protection comprising de-identification, an executed data use agreement, a
      controlled-access data repository adhering to NIST 800-53 principles, audit-level protection,
      registration, role-based access controls, and protection against data exfiltration.
  - description: >-
      Additional controls: multi-factor authentication, full audit logging of data access and queries,
      prohibition of re-identification attempts, and data export restrictions with output review.

data_protection_impacts:
  - description: >-
      Re-identification risk is periodically assessed and mitigation strategies are updated as needed.

