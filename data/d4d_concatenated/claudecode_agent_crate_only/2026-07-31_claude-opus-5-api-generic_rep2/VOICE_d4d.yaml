variables:
  - variable_name: participant_id
    description: >-
      Pseudonymous participant identifier and primary join key across every feature and phenotype
      table. Typed as string in most feature schemas and as integer in the phenotype schemas and the
      torchaudio spectrogram schema.
  - variable_name: session_id
    description: >-
      Identifier of the data-collection session; participants may have repeated sessions, and
      session-scoped duplicates of this key appear in individual instruments (for example
      phq_9_session_id, gad_7_session_id, confounders_session_id).
  - variable_name: task_name
    description: >-
      Name of the structured acoustic task from which the recording and its derived features were
      produced.
  - variable_name: n_frames
    description: >-
      Integer frame count of the dense feature tensor stored in each feature Parquet row.
  - variable_name: transcription
    description: >-
      Machine-generated transcript field in static_features.tsv, produced by OpenAI Whisper Large
      for structured speech tasks; transcripts of free-speech audio were removed before release.
  - variable_name: recording_microphone
    description: >-
      Microphone used for a recording, captured in the Recording table alongside recording duration,
      input gain, profile name, profile version and size.
  - variable_name: acoustic_task_name
    description: >-
      Name of the acoustic task in the Acoustic task table, recorded together with task cohort,
      duration, id, session id and completion status.
  - variable_name: is_control_participant
    description: >-
      Eligibility-table flag marking healthy-control participants; mirrored at session level by
      session_is_control_participant.
  - variable_name: vhi_10_calc_score
    description: >-
      Computed Voice Handicap Index-10 total score derived from the ten VHI item responses by the
      instrument's published scoring rules.
  - variable_name: winograd_score
    description: >-
      Score for the Winograd schema task, alongside 276 individual item responses and the count of
      questions asked.
  - variable_name: mean_f0_hertz
    description: >-
      Mean fundamental frequency in hertz, one of the Praat/parselmouth-derived static per-recording
      acoustic summaries in static_features.tsv.
  - variable_name: ef_primary_language
    description: >-
      Primary language recorded on the enrollment form, together with ef_select_language and the
      ef_fluent_languages multi-select fields.

known_limitations:
  - description: >-
      The feature-only release does not include raw audio waveforms or free-speech transcripts,
      which limits certain types of modeling and error analysis and may constrain the ability to
      reproduce end-to-end audio pipelines.
  - description: >-
      This version only includes an adult cohort; models trained solely on this dataset may not
      generalize to younger age groups or to languages beyond those represented.
  - description: >-
      Because of de-identification, some granular demographic and socio-economic variables,
      fine-grained location data and narrative context have been removed, which reduces the risk of
      re-identification but also limits detailed fairness assessments and certain confounder
      adjustments.
  - description: >-
      The dataset does not provide predefined train–validation–test splits or benchmarking tasks and
      does not include explicit per-instance label-uncertainty measures, so researchers must design
      their own evaluation protocols and handle label noise and missingness.
  - description: >-
      The registered-access and controlled-access governance structure is appropriate for privacy
      but may limit participation by some institutions or researchers and can complicate the
      reproducibility of pipelines that require both features and raw audio.

known_biases:
  - description: >-
      Sampling bias: participants are recruited from specialty clinics and associated institutions
      using a non-probability sampling strategy, with inclusion focused on specific disease cohorts
      and fluent English speakers; this produces clinically enriched case mixes that may not
      represent general population distributions.
  - description: >-
      Geographic and cultural bias: data are collected at a limited number of North American sites,
      and although the project seeks diversity, it may under-represent speakers from other regions,
      cultures, languages and healthcare systems; early releases focus on English, with Spanish
      protocols planned but not yet fully represented.
  - description: >-
      Clinical spectrum bias: because participants are selected into disease cohorts where voice
      changes are expected, the prevalence and severity of conditions in the dataset differ from
      those in routine primary care or community settings, which may inflate model performance when
      evaluated within this dataset.
  - description: >-
      Device and environment bias: recordings are made using standardized but not identical hardware
      and primarily in clinical environments; future at-home collection or deployment on other
      devices may encounter different background noise, channel characteristics and user behavior.
  - description: >-
      Algorithmic bias in machine annotations: transcripts and some derived features rely on
      off-the-shelf models such as OpenAI Whisper and other audio toolkits whose performance may
      vary across demographic groups; the dataset team has not independently audited these tools for
      fairness, so downstream users should consider their biases when interpreting results.

anomalies:
  - description: >-
      Some derived audio features could not be computed for all recordings due to quality or length
      constraints, and some derived features are dropped when processing fails or quality checks
      fail; features relating to free speech or sensitive records have been removed.
  - description: >-
      Questionnaire completion varies by participant and cohort, so some forms and items are
      systematically or sporadically missing; no imputation is applied in the released files.
  - description: >-
      RO-Crate metadata inconsistency: the entity ark:59853/b2ai-voice-dataset-feature-sparc-periodicity
      carries the name "sparc_loudness.parquet" although its contentUrl is
      file:///features/sparc_periodicity.parquet, and the entity
      ark:59853/b2ai-voice-dataset-feature-torchaudio-pitch carries the name
      "torchaudio_spectrogram.parquet" although its contentUrl is
      file:///features/torchaudio_pitch.parquet.
  - description: >-
      RO-Crate metadata inconsistency: two distinct EVI:Schema records — "Phenotype Confounders
      Schema" and "Phenotype Demographics Schema" — share the identifier
      ark:59853/b2ai-voice-schema-phenotype-confounders and list identical 547-column property sets,
      so the demographics column list is not independently documented in the crate.
  - description: >-
      RO-Crate metadata inconsistency: the phenotype task-table entity
      (ark:59853/b2ai-voice-dataset-phenotype-task) is named "VOICE Questionnaire Tables",
      duplicating the name of ark:59853/b2ai-voice-dataset-phenotype-questionnaire.
  - description: >-
      Field-typing irregularity in the released schemas: many phenotype checkbox columns are typed
      inconsistently across their option suffixes (for example acid_reflux___current as number but
      acid_reflux___no_answer as string), and participant_id is typed string in most feature schemas
      but integer in the torchaudio spectrogram and phenotype schemas.
  - description: >-
      Several crate entities carry placeholder documentation: nine feature files share the
      description "a datafile description", the phenotype tables share "A Dataset description", and
      the crate-level "completeness" property is empty, as is irbProtocolId.

content_warnings:
  - description: >-
      The dataset encodes sensitive personal health information, including diagnostic categories for
      psychiatric and neurodegenerative conditions and symptom-severity scores.
  - description: >-
      Questionnaire item-level content includes self-harm and suicidal-ideation screening items
      (for example the PHQ-9 "thoughts_death" item and the DSM-5 adult "self_harm" item), as well as
      substance-use and trauma-related screening items (PTSD instrument items).
  - description: >-
      Highly sensitive content including detailed narrative responses, some information about
      household income, traumatic life experiences and granular cultural identifiers has been
      removed entirely from this feature-only dataset.

sensitive_elements:
  - description: >-
      The dataset encodes health-related information including diagnostic categories for voice
      disorders, neurological and neurodegenerative conditions, mood and psychiatric disorders and
      respiratory diseases, as well as symptom scores from questionnaires, which constitute
      sensitive personal health data.
  - description: >-
      Demographic variables such as age, sex and country of data collection are included in
      coarsened form, while finer-grained geographic identifiers, direct identifiers and many
      socio-economic and cultural details have been removed during de-identification to reduce
      re-identification risk.
  - description: >-
      Highly sensitive content including detailed narrative responses, some information about
      household income, traumatic life experiences and granular cultural identifiers has been
      removed entirely from this feature-only dataset; raw voice recordings, which are themselves
      biometric identifiers, are made available only under controlled access.
  - description: >-
      Use of the data is restricted to authorized researchers under a registered-access license and
      associated data use agreement that explicitly forbids attempts at re-identification,
      stigmatizing or discriminatory uses and applications such as surveillance or high-stakes
      individual decision making.

confidential_elements:
  - description: >-
      Confidentiality level recorded for the release: "Limited dataset available with Data Use
      Agreement". Access conditions are published at
      https://physionet.org/content/b2ai-voice/view-dua/3.0.0/.
  - description: >-
      Raw voice waveforms are withheld from this feature-only release; they are biometric
      identifiers and are obtainable only through a separate controlled-access process.
  - description: >-
      Narrative text fields and transcripts of free speech are removed prior to release, as are
      features for sensitive records and audio checks.

is_deidentified:
  description: >-
    The release is recorded as de-identified (deidentified: true). Prior to release, data are
    transformed to reduce re-identification risk and align with regulatory and ethical requirements:
    direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or rebased;
    geographic information is generalized to the country level; narrative text fields and
    transcripts of free speech are removed; and raw voice waveforms are withheld. Residual risk is
    managed by distributing the data as a limited dataset under a registered-access license and data
    use agreement that forbids re-identification attempts; raw audio, itself a biometric identifier,
    is released only under separate controlled access.

missing_data_documentation:
  - description: >-
      Phenotype tables include a row for a participant only when at least one variable is
      non-missing, and participants may have repeated visits with differing responses. Questionnaire
      completion varies by participant and cohort, so some forms and items are systematically or
      sporadically missing. Some derived audio features could not be computed for all recordings due
      to quality or length constraints, and features relating to free speech or sensitive records
      have been removed. No additional imputation is applied in the released files.

acquisition_methods:
  - description: >-
      Directly observed and measured: structured voice and respiratory tasks such as sustained
      vowels, coughs and reading passages, recorded during an in-clinic session under a standardized
      protocol.
  - description: >-
      Self-reported: demographic questions, health history, disease-specific questionnaires and
      other patient-reported outcomes completed by the participant.
  - description: >-
      Reported by clinicians: diagnostic categories and phenotype variables recorded by clinical
      investigators and care teams.
  - description: >-
      Derived from secondary sources: clinical diagnoses and other metadata extracted from
      electronic health record systems, treated as a source of gold-standard diagnostic information.
  - description: >-
      Computationally derived: all released acoustic representations (spectrograms, mel
      spectrograms, MFCCs, articulatory features, pitch, loudness, periodicity, phonetic
      posteriorgrams and static summaries) are derived from the raw audio rather than directly
      observed.
  - description: >-
      Declared collection types for the study: direct measurement, surveys, self-reporting,
      secondary data analysis and document analysis.

collection_mechanisms:
  - description: >-
      A custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of
      acoustic tasks and questionnaires.
  - description: >-
      Tablet or smartphone devices with headset microphones where available, used to capture
      high-quality voice, speech and respiratory audio waveforms.
  - description: >-
      A REDCap-based data capture system used to manage clinical and phenotype data; questionnaire
      scoring logic is encoded in the REDCap instruments.
  - description: >-
      Electronic health record systems used as a source of some gold-standard diagnostic
      information.

collection_timeframes:
  - description: >-
      Data collection for the adult flagship cohort began after project launch in 2023 and is
      ongoing across five North American sites toward an anticipated enrollment of approximately
      3,000 participants by November 2026; the participants and recordings included in dataset
      version 3.0.0 were collected roughly between 2023 and 2025.
  - description: >-
      Dataset releases are static snapshots: v1.0 (initial public release in 2024), v1.1
      (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), each
      corresponding to a frozen state of the underlying data collection.

sampling_strategies:
  - description: >-
      Non-probability sampling: eligible adults presenting to voice, neurology, psychiatry and
      respiratory clinics, plus healthy controls, were screened against predefined inclusion and
      exclusion criteria at multiple specialty clinics and academic hospitals across North America.
  - description: >-
      Inclusion is focused on specific disease cohorts in which voice changes are expected, and on
      fluent English speakers; Spanish-language protocols are planned but not yet fully represented.
  - description: >-
      Eligibility is recorded in the released eligibility table through self-reported condition
      flags across voice, neurological, psychiatric, sleep and respiratory conditions, a control
      flag, and study/age-band eligibility indicators.
  - description: >-
      Known sampling limitation: the resulting clinically enriched case mix may not represent
      general population distributions, and the prevalence and severity of conditions differ from
      routine primary care or community settings.

data_collectors:
  - description: >-
      Clinicians and research staff at participating North American institutions spanning
      otolaryngology, neurology, neuroscience, pulmonology and allied health disciplines collected
      the data and recorded clinical annotations; detailed demographic breakdowns of these staff are
      not provided in the public documentation.
  - description: >-
      Data collection took place at five North American sites within a prospective observational
      study run by the Bridge2AI-Voice project.

direct_collection:
  - description: >-
      Voice, speech and respiratory recordings, demographic questions, health history,
      disease-specific questionnaires and other patient-reported outcomes were collected directly
      from participants after informed consent, in a standardized in-clinic protocol.
  - description: >-
      Clinical diagnoses and other metadata were obtained indirectly, extracted from electronic
      health records and recorded by clinical investigators and care teams rather than reported by
      the participant.

collection_consents:
  - description: >-
      Eligible adults were screened against predefined inclusion and exclusion criteria and gave
      informed consent before the standardized voice, questionnaire and patient-reported-outcome
      protocol was administered.

informed_consent:
  - description: >-
      Informed consent was obtained from each participant prior to administration of the
      standardized protocol in the prospective observational study. The study is recorded as human
      subjects research with no exemption claimed, under the oversight of the University of South
      Florida Institutional Review Board.

participant_privacy:
  - description: >-
      Participant privacy is protected by rigorous de-identification before release: removal of
      direct identifiers and high-risk quasi-identifiers, coarsening or rebasing of dates,
      generalization of geographic information to country level, removal of narrative text and
      free-speech transcripts, and withholding of raw voice waveforms from the public feature-only
      tier.
  - description: >-
      Access controls supplement technical de-identification: the release is a limited dataset
      distributed under a registered-access license and data use agreement that forbids
      re-identification, and raw audio is available only through a separate controlled-access
      process.

at_risk_populations:
  description: >-
    Dataset version 3.0.0 includes only an adult cohort, so no minors are represented in this
    release; the eligibility instrument nevertheless carries age-band study-eligibility fields
    (ages 2–4, 4–6, 6–10 and 10+), indicating that pediatric eligibility is tracked by the wider
    protocol. Participants include clinical populations with neurodegenerative and cognitive
    conditions and with psychiatric conditions; the enrollment form records cognitive, hearing,
    vision and physical accessibility requirements and who completed the form (ef_completed_by),
    while the Session table separately records whether the session was completed by the participant
    alone or with someone else. No specific assent or additional-safeguard procedures for at-risk
    groups are described in the crate metadata.

human_subject_research:
  description: >-
    The dataset arises from human subjects research (humanSubjectResearch: Yes; humanSubjects: Yes).
    No human subject exemption was claimed (humanSubjectExemption: No) and the study is recorded as
    not FDA-regulated (fdaRegulated: false). The IRB of record is the University of South Florida
    Institutional Review Board, 3702 Spectrum Blvd., Suite 165 Usf, Tampa, FL 33620, US; contact
    RSCH-IRB@usf.edu, telephone (813) 974-5638. No IRB protocol identifier is recorded in the crate
    (irbProtocolId is empty). The released data are de-identified and distributed as a limited
    dataset under a data use agreement.

ethical_reviews:
  - description: >-
      Ethical review by Vardit Ravitsky at the Hastings Center for Bioethics.
  - description: >-
      Institutional oversight by the University of South Florida Institutional Review Board (contact
      RSCH-IRB@usf.edu, (813) 974-5638; 3702 Spectrum Blvd., Suite 165 Usf, Tampa, FL 33620, US).
      No IRB protocol identifier is populated in the crate metadata.
  - description: >-
      Governance framework: IRB oversight, rigorous de-identification, separation of feature-only
      and raw-audio tiers and usage restrictions encoded in the registered-access license and data
      use agreement, with a named data governance committee (Satrajit Ghosh) and ongoing ethics
      workstreams.

raw_sources:
  - description: >-
      The original raw data consist of high-quality voice, speech and respiratory audio waveforms
      recorded on tablet or smartphone devices with headset microphones when available, plus
      responses to structured demographic and medical history questionnaires, disease-specific
      validated questionnaires and other patient-reported outcomes, together with clinical diagnoses
      and other metadata extracted from electronic health records.
  - description: >-
      The public feature-only PhysioNet release contains de-identified derived representations of
      the audio, such as spectrograms, mel spectrograms, MFCCs, articulatory and prosodic features
      and phonetic posteriorgrams, along with tabular phenotype files and data dictionaries; access
      to the underlying raw audio is available only through a separate controlled-access process.

raw_data_sources:
  - source_description: >-
      Raw voice, speech and respiratory audio waveforms captured on tablet or smartphone devices
      with headset microphones through the custom Bridge2AI-Voice application. Not distributed in
      this release; obtainable only through a separate controlled-access process.
  - source_description: >-
      REDCap data capture system holding structured demographic and medical-history questionnaires,
      disease-specific validated questionnaires and other patient-reported outcomes. Exported and
      reorganized into the released TSV phenotype tables by the b2aiprep library.
  - source_description: >-
      Electronic health record systems at participating sites, used as the source of gold-standard
      clinical diagnoses and additional phenotype metadata. Not directly distributed; only derived
      diagnostic labels appear in the release.

preprocessing_strategies:
  - description: >-
      Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing
      filtering; they are then segmented by task and passed through quality checks.
  - description: >-
      From the standardized audio, multiple derived feature sets are computed including
      spectrograms, mel spectrograms, MFCCs, articulatory features using the Speech Articulatory
      Coding package, pitch and loudness estimates, acoustic features from openSMILE, phonetic and
      prosodic features from Praat and parselmouth, and phonetic posteriorgrams using a dedicated
      model; all are stored as dense tensors in Parquet files with participant, session and task
      identifiers.
  - description: >-
      Tabular phenotype and questionnaire files are exported from REDCap and merged using a
      dedicated open-source b2aiprep library, reorganizing the former single phenotype table into
      thematically organized TSV files with accompanying JSON data dictionaries; static
      per-recording feature summaries are provided in static_features.tsv, and de-identification and
      filtering steps are applied before packaging.
  - description: >-
      Provenance: the VOICE Features Processing computation (b2aiprep, run by "Alastair",
      dateCreated 01/29/2026) generated the nine feature Parquet outputs; the VOICE Phenotype Ingest
      computation (b2aiprep, run by "Alastair", dateCreated 12/16/2025) dumped and reformatted
      phenotype information from the REDCap database into the released phenotype extracts.

cleaning_strategies:
  - description: >-
      Prior to release, data are transformed to reduce re-identification risk and align with
      regulatory and ethical requirements: direct identifiers and high-risk quasi-identifiers are
      removed; dates are coarsened or rebased; geographic information is generalized to the country
      level; narrative text fields and transcripts of free speech are removed; and raw voice
      waveforms are withheld from this feature-only release.
  - description: >-
      Additional filtering removes features for sensitive records and audio checks, and some derived
      features are dropped when processing fails or quality checks fail.
  - description: >-
      Segmented audio is passed through quality checks before feature extraction, and audio-quality
      metrics (stoi, pesq, si_sdr) are retained per recording in static_features.tsv.
  - description: >-
      The data release team audited the combined phenotype and feature tables for internal
      consistency, missingness patterns and data entry issues.

imputation_protocols:
  - description: >-
      The public datasets do not apply global statistical imputation to missing fields; instead,
      missing questionnaire responses, phenotype variables and derived features are left as explicit
      missing values or omitted rows. The data release team audited missingness and users can
      implement study-specific imputation or complete-case strategies appropriate to their analyses.

labeling_strategies:
  - description: >-
      Annotations consist primarily of clinical labels and questionnaire-derived measures associated
      with each participant and recording. Participants complete validated instruments such as
      VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough questionnaires and voice instruments, which
      generate numerical scores and categorical indicators according to each instrument's published
      scoring guidelines.
  - description: >-
      Clinical investigators and care teams record diagnostic categories for voice, neurological,
      mood and respiratory conditions and other phenotype variables, drawing on clinical assessments
      and electronic health records; these labels are represented in disease-specific TSV files with
      accompanying JSON dictionaries.
  - description: >-
      Machine-generated transcripts of certain voice tasks and numerous automatically extracted
      acoustic and articulatory features provide further labels and descriptors at the recording
      level.
  - description: >-
      Annotation platforms: the custom Bridge2AI-Voice mobile and tablet application, the
      REDCap-based data capture system, electronic health record systems, and open-source
      preprocessing and curation tools including the b2aiprep library.

annotation_analyses:
  - description: >-
      Questionnaire-based labels are generated using the standard scoring rules for each validated
      instrument, yielding total and subscale scores that can be mapped to symptom-severity bands;
      the scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  - description: >-
      Diagnostic labels are derived from clinical assessments and electronic health records rather
      than crowd workers, so there is no explicit inter-rater majority-vote scheme; however,
      diagnoses are treated as reference labels and may include multiple comorbid conditions per
      participant.
  - description: >-
      The data release team audited the combined phenotype and feature tables for internal
      consistency, missingness patterns and data entry issues, but per-annotator disagreement
      statistics or detailed label-uncertainty measures are not presently included in the released
      dataset.
  - description: >-
      Annotations per item: each recording is associated with one set of clinical labels and
      questionnaire responses derived from a single participant, although participants may
      contribute multiple sessions over time; there is no crowd-sourced labeling and the
      documentation does not report multiple independent human ratings per individual recording.
  - description: >-
      Annotator demographics: clinical annotations are created by clinicians and research staff at
      participating North American institutions spanning otolaryngology, neurology, neuroscience,
      pulmonology and allied health disciplines, but detailed demographic breakdowns of annotators
      are not provided. Questionnaire-based labels reflect self-reported information from
      participants, whose demographics are captured in coarsened form (for example age bands, sex
      and country of data collection); per-annotator demographic information, such as which specific
      clinician or staff member entered a label, is not exposed.

machine_annotation_tools:
  - description: >-
      OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral
      characteristics.
  - description: >-
      Praat and the parselmouth interface for phonetic and prosodic feature extraction, including
      measures of fundamental frequency, formants and voice quality.
  - description: >-
      TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch
      tracks.
  - description: >-
      Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related
      features.
  - description: >-
      Phonetic posteriorgram models that produce time-varying distributions over phonetic units for
      each recording.
  - description: >-
      OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with
      transcripts from free-speech audio removed before release.
  - description: >-
      The open-source b2aiprep library (version 3.0.2, https://github.com/sensein/b2aiprep) for
      orchestrating preprocessing, feature extraction and merging of phenotype data into the
      released files.

distribution_formats:
  - description: >-
      Dense feature tensors are distributed as Parquet files under features/, each keyed by
      participant, session and task identifiers with an n_frames count.
  - description: >-
      Phenotype and questionnaire data are distributed as tab-separated TSV files
      (text/tab-separated-values) with accompanying JSON data dictionaries, organized thematically
      into confounders, demographics, diagnosis, enrollment, questionnaire and task tables.
  - description: >-
      Per-recording static acoustic summaries are distributed in static_features.tsv (135 columns,
      tab-separated, with header).
  - description: >-
      The dataset is packaged as an RO-Crate conforming to https://w3id.org/ro/crate/1.2, with
      JSON-LD metadata, 55 documented schemas and a Merkle root hash
      (f1663e1069a9894b21202ebf05f4839b9fb82b79ba5b337df54dd18f36d3be47). Total recorded content
      size is 12.9 GB.
  - description: >-
      Distribution is through PhysioNet at https://doi.org/10.13026/k81f-qr68, with access
      conditions at https://physionet.org/content/b2ai-voice/view-dua/3.0.0/.

distribution_dates:
  - description: "v1.0 — initial public release in 2024."
  - description: "v1.1 — released 2025-01-17."
  - description: "v2.0.0 — released 2025-04-16."
  - description: "v2.0.1 — released 2025-08-18."
  - description: >-
      v3.0.0 — released 2025-12-16 (datePublished 12/16/2025); this is the version described by this
      datasheet.

third_party_sharing:
  - description: >-
      The dataset is published on PhysioNet as a limited dataset available with a Data Use
      Agreement; use is restricted to authorized researchers under a registered-access license
      (https://physionet.org/content/b2ai-voice/view-license/3.0.0/ and
      https://physionet.org/content/b2ai-voice/view-dua/3.0.0/).
  - description: >-
      The underlying raw voice recordings are not shared through this channel; they are available
      only via a separate controlled-access process.
  - description: >-
      Releases are coordinated by the Bridge2AI-Voice project team together with the MIT Laboratory
      for Computational Physiology.

license_and_use_terms:
  description: >-
    Licensed under the PhysioNet-hosted terms at
    https://physionet.org/content/b2ai-voice/view-license/3.0.0/, with conditions of access at
    https://physionet.org/content/b2ai-voice/view-dua/3.0.0/. The confidentiality level is a limited
    dataset available with a Data Use Agreement: use is restricted to authorized researchers under a
    registered-access license that explicitly forbids attempts at re-identification, stigmatizing or
    discriminatory uses, and applications such as surveillance or high-stakes individual decision
    making. Copyright notice: Copyright © 2026 University of South Florida all rights reserved. The
    EVI:Schema definitions packaged with the crate individually carry
    https://creativecommons.org/licenses/by/4.0/.

ip_restrictions:
  description: >-
    Copyright © 2026 University of South Florida all rights reserved. Redistribution and use are
    governed by the PhysioNet license and data use agreement for version 3.0.0; the packaged schema
    definitions are separately licensed CC BY 4.0.

regulatory_restrictions:
  description: >-
    The study is recorded as not FDA-regulated (fdaRegulated: false) and as human subjects research
    with no exemption. The released data are de-identified and constitute a limited dataset, access
    to which requires acceptance of a Data Use Agreement; raw audio, as biometric data, is subject to
    a separate controlled-access process. No export-control regime is asserted in the crate metadata.

updates:
  description: >-
    Dataset releases follow a static versioning scheme managed through PhysioNet and related
    platforms, with version numbers such as 1.0, 1.1, 2.0.0, 2.0.1 and 3.0.0 and associated DOIs for
    each snapshot and for the latest version. Releases are coordinated by the Bridge2AI-Voice
    project team and the MIT Laboratory for Computational Physiology; release notes document added
    participants, new feature sets, reorganized phenotype tables and corrections such as spectrogram
    reprocessing and authorship updates. Future updates are planned as additional participants are
    enrolled — toward an anticipated enrollment of approximately 3,000 participants by November 2026
    — and as Spanish-language protocols are incorporated.

version_access:
  description: >-
    Each release is a static snapshot with its own DOI, and a further DOI resolves to the latest
    version. Older versions remain accessible for reproducibility while users are encouraged to
    adopt the latest version. Version 3.0.0 is identified by https://doi.org/10.13026/k81f-qr68.

errata:
  - description: >-
      Release notes for successive versions document corrections applied to the data, including
      spectrogram reprocessing and authorship updates, alongside added participants, new feature
      sets and reorganized phenotype tables.

external_resources:
  - description: >-
      Associated publication and dataset citation: Bensoussan, Y., et al. (2025). Bridge2AI-Voice:
      An ethically-sourced, diverse voice dataset linked to health information (version 3.0.0).
      PhysioNet. RRID:SCR_007345. https://doi.org/10.13026/k81f-qr68
  - description: >-
      Associated publication for the hosting platform: Goldberger, A., Amaral, L., Glass, L.,
      Hausdorff, J., Ivanov, P. C., Mark, R., ... & Stanley, H. E. (2000). PhysioBank, PhysioToolkit,
      and PhysioNet: Components of a new research resource for complex physiologic signals.
      Circulation [Online]. 101 (23), pp. e215–e220. RRID:SCR_007345.
  - description: >-
      b2aiprep — the open-source Python package used to prepare acoustic data for the Bridge2AI voice
