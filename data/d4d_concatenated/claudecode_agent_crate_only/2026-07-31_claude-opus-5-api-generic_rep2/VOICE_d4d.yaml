maintainers:
  - description: >-
      The Bridge2AI-Voice project team coordinates releases together with the MIT Laboratory for
      Computational Physiology; the dataset is published and distributed through PhysioNet. General
      contact for the project is https://b2ai-voice.org/contact-us/.
  - description: >-
      Data governance committee: Satrajit Ghosh.
  - description: >-
      University of South Florida Institutional Review Board, 3702 Spectrum Blvd., Suite 165 Usf,
      Tampa, FL 33620, US; telephone (813) 974-5638; email RSCH-IRB@usf.edu — the IRB of record for
      the human subjects research underlying the dataset.

purposes:
  - description: >-
      To create an ethically sourced flagship dataset that enables future research in artificial
      intelligence and supports critical insights into the use of voice as a biomarker of health.
  - description: >-
      To assemble a comprehensive collection of data derived from voice recordings with
      corresponding clinical information, covering conditions known to manifest within the voice
      waveform: voice disorders, neurological disorders, mood disorders and respiratory disorders.
  - description: >-
      To support research on voice as an accessible, low-cost biomarker for screening, diagnosis and
      monitoring of a broad range of health conditions, potentially improving early detection and
      care for underserved populations.

addressing_gaps:
  - description: >-
      Recent advances in artificial intelligence provide techniques to extract previously unknown,
      prognostically useful information from dense data elements; the project addresses the absence
      of an ethically sourced, diverse, clinically linked voice dataset that would let those
      techniques be applied to voice as a biomarker.
  - description: >-
      The release addresses the need for a low-risk, de-identified tier of voice data — derived
      representations such as spectrograms rather than original recordings — so that voice-biomarker
      research can proceed without distributing raw biometric audio.

tasks:
  - description: >-
      Development, training and fine-tuning of machine-learning models that associate voice-derived
      features with diagnostic categories or symptom severity for conditions such as vocal fold
      pathology, neurological and neurodegenerative diseases, mood and anxiety disorders and
      respiratory illnesses.
  - description: >-
      Benchmarking and validation of existing voice-biomarker algorithms by testing their
      performance on a clinically diverse, multi-site cohort with standardized tasks and rich
      phenotype data.
  - description: >-
      Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
      using de-identified derived features, including work on representation learning, domain
      adaptation and multimodal integration with other health data.
  - description: >-
      Methodological research on fairness, robustness and AI safety in clinical voice models,
      including studies of bias related to demographic subgroups or recording conditions, subject to
      the ethical constraints in the data use agreement.

intended_uses:
  - description: >-
      Training, fine-tuning and evaluation of machine-learning models linking voice-derived features
      to diagnostic categories or symptom severity across voice, neurological, mood and respiratory
      conditions.
  - description: >-
      Benchmarking and external validation of published voice-biomarker algorithms on a clinically
      diverse, multi-site cohort with standardized acoustic tasks and rich phenotype data.
  - description: >-
      Fairness, robustness and AI-safety methodology research on clinical voice models, subject to
      the ethical constraints stated in the data use agreement.

prohibited_uses:
  - description: >-
      The dataset is explicitly not intended for operational decision making about specific
      individuals, such as hiring, insurance pricing, law enforcement or surveillance.
  - description: >-
      Attempts at re-identification of participants are forbidden by the registered-access license
      and associated data use agreement.
  - description: >-
      Uses likely to stigmatize or discriminate against individuals or groups are forbidden.
  - description: >-
      High-stakes individual decision making is excluded by the terms of the registered-access
      license and data use agreement.

discouraged_uses:
  - description: >-
      Reproducing or evaluating end-to-end audio pipelines is not supported by this release, which
      omits raw audio waveforms and free-speech transcripts; such work requires the separate
      controlled-access raw-audio tier.
  - description: >-
      Generalizing models trained solely on this version to younger age groups, or to languages
      beyond those represented, is discouraged: this version includes only an adult cohort and early
      releases focus on English.
  - description: >-
      Detailed fairness assessments and certain confounder adjustments are constrained because
      de-identification removed granular demographic and socio-economic variables, fine-grained
      location data and narrative context.

future_use_impacts:
  - description: >-
      Anticipated benefit: research on voice as an accessible, low-cost biomarker for screening,
      diagnosis and monitoring of a broad range of health conditions, potentially improving early
      detection and care for underserved populations.
  - description: >-
      Anticipated risk, explicitly recognized by the consortium: privacy loss, misuse of voice
      biometrics, and algorithmic harms such as discrimination in hiring, insurance or surveillance
      contexts. These risks motivate the governance framework of IRB oversight, rigorous
      de-identification, separation of feature-only and raw-audio tiers, and usage restrictions
      encoded in the registered-access license and data use agreement.
  - description: >-
      Dataset documentation and ongoing ethics workstreams are intended to help downstream users
      reason about these risks and design responsible analyses and models.

instances:
  - description: >-
      Bridge2AI-Voice v3.0.0 contains data for 833 participants across five sites in North America.
      Participants were selected based on known conditions which manifest within the voice waveform.
  - description: >-
      Derived acoustic instances are per-recording rows keyed by participant_id, session_id and
      task_name, each carrying a dense tensor feature (spectrogram, mel spectrogram, MFCC,
      articulatory EMA, pitch, loudness, periodicity or phonetic posteriorgram) plus an n_frames
      count.
  - description: >-
      Phenotype instances are participant-level (and in some tables session-level) rows in TSV
      tables covering demographics, confounders, eligibility, enrollment, session, acoustic task,
      recording, diagnosis and validated questionnaire content. A phenotype table includes a row for
      a participant only when at least one variable is non-missing.
  - description: >-
      Most participants completed a single in-clinic session; a subset completed repeated sessions,
      so a participant may contribute multiple sessions and multiple recordings over time.
  - description: >-
      Per-recording static summaries are provided in static_features.tsv, with 135 columns spanning
      openSMILE eGeMAPS-style descriptors, Praat/parselmouth measures, jitter and shimmer families,
      and audio-quality metrics (stoi, pesq, si_sdr), plus a machine-generated transcription field.

subpopulations:
  - description: >-
      Disease cohorts recruited from specialty clinics: voice disorders (including benign lesions,
      precancerous lesions, laryngeal cancer, laryngitis, muscle tension dysphonia, laryngeal
      dystonia, glottic insufficiency, unilateral vocal fold paralysis, airway stenosis).
  - description: >-
      Neurological and neurodegenerative cohorts: Parkinson's disease, amyotrophic lateral
      sclerosis, and Alzheimer's disease / dementia / mild cognitive impairment.
  - description: >-
      Mood and psychiatric cohorts: depression / major depressive disorder, bipolar disorder,
      anxiety disorder, and related psychiatric history; instruments include PHQ-9, GAD-7, PANAS,
      DSM-5 adult self-rated measures, ADHD and PTSD adult screens.
  - description: >-
      Respiratory cohorts: COPD and asthma, and unexplained chronic cough.
  - description: >-
      Healthy controls, captured through a dedicated control phenotype table and the
      is_control_participant / session_is_control_participant flags.
  - description: >-
      Adults only in this version. Demographic variables such as age, sex and country of data
      collection are included in coarsened form (for example age bands), while finer-grained
      geographic identifiers and many socio-economic and cultural details have been removed.

splits:
  - description: >-
      The dataset does not provide predefined train–validation–test splits or benchmarking tasks, so
      researchers must design their own evaluation protocols.

relationships:
  - description: >-
      Feature Parquet rows and phenotype TSV rows are linked by shared keys: participant_id,
      session_id and task_name / acoustic_task_id / recording_id. This allows recordings to be
      joined to their acoustic task, session, questionnaire responses, confounders, demographics and
      diagnostic labels for the same participant.
  - description: >-
      Participants may contribute multiple sessions over time; sessions carry assigned tasks
      (session_assigned_tasks) and recordings reference the acoustic task that produced them
      (recording_acoustic_task_id), forming a participant–session–task–recording chain.
  - description: >-
      Diagnoses are treated as reference labels and may include multiple comorbid conditions per
      participant, so a participant can appear in more than one disease-specific table.

subsets:
  - id: ark:59853/b2ai-voice-dataset-phenotype-diagnosis
    description: >-
      VOICE Diagnosis Tables — disease-specific TSV tables with accompanying JSON dictionaries,
      covering airway stenosis, ALS, anxiety, benign lesions, bipolar disorder, cognitive
      impairment, control, COPD and asthma, depression, glottic insufficiency, laryngeal cancer,
      laryngeal dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous
      lesions, psychiatric history, PTSD, unexplained chronic cough and unilateral vocal fold
      paralysis.
  - id: ark:59853/b2ai-voice-dataset-phenotype-questionnaire
    description: >-
      VOICE Questionnaire Tables — validated and custom instruments including VHI-10, PHQ-9, GAD-7,
      PANAS, Leicester Cough Questionnaire, Dyspnea Index, DSM-5 adult self-rated measure, custom
      affect scale, productive vocabulary, voice perception and voice problem severity.
  - id: ark:59853/b2ai-voice-dataset-phenotype-enrollment
    description: >-
      VOICE Enrollment Tables — eligibility (self-reported condition flags and study/age-band
      eligibility), enrollment form (primary language, fluent languages, accessibility
      requirements) and participant tables.
  - id: ark:59853/b2ai-voice-dataset-phenotype-task
    description: >-
      VOICE task tables — acoustic task, session, recording, Harvard sentences, random item
      generation, Stroop and Winograd task metadata linking recordings to the protocol step that
      produced them.

