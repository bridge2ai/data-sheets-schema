confidential_elements:
  - id: chorus_confidentiality
    name: Controlled-access clinical data at HL7 confidentiality level 2V
    confidential_elements_present: true
    confidentiality_details:
      - 'Confidentiality level: HL7:2V (very restricted)'
      - >-
        CHoRUS operates within a secure enclave environment aligned with NIST
        800-53 controls.
      - >-
        Access restricted to secure enclave environment; no raw data export
        permitted unless explicitly approved
      - >-
        Data are curated within a NIST 800-53–aligned secure enclave architecture
        with role-based access controls, audit logging, and controlled-access
        governance review.

sensitive_elements:
  - id: chorus_sensitive_elements
    name: Personal and sensitive information handling
    sensitive_elements_present: true
    sensitivity_details:
      - >-
        CHoRUS operates within a secure enclave environment aligned with NIST
        800-53 controls.
      - De-identification consistent with HIPAA Safe Harbor
      - Removal or tokenization of direct identifiers
      - Date shifting or limited date fields when required
      - Role-based access control (RBAC)
      - Multi-factor authentication
      - Full audit logging of data access and queries
      - Prohibition of re-identification attempts
      - >-
        Data export restrictions and output review procedures to reduce risk of
        re-identification
      - >-
        Re-identification risk is periodically assessed and mitigation strategies
        updated as needed.

acquisition_methods:
  - id: chorus_acquisition_routine_care
    name: Observation of routine clinical care
    was_directly_observed: true
    acquisition_details:
