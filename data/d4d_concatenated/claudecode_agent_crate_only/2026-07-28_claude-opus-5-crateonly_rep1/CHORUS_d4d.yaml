    name: Structure of the CHoRUS RO-Crate Package
    relationship_details:
      - >-
        The CHoRUS RO-Crate Package (ark:59853/rocrate-chorus-ro-crate-package/)
        has two parts: the CHoRUS RO-Crate EHR SubRoCrate
        (08cf7419-b94d-4508-8f64-c99c557351d7) and the CHoRUS RO-Crate Waveforms
        SubRoCrate (b9b41c72-0895-4ec2-9e39-8de2a83abcd6). Each sub-crate
        declares isPartOf the package.
      - >-
        The package declares isPartOf the Bridge2AI organization entity
        ark:59852/organization-bridge2ai-s6VouUf8Gkm.
      - >-
        The crate metadata conforms to RO-Crate 1.2
        (https://w3id.org/ro/crate/1.2) and both the package and its sub-crates
        are typed as https://w3id.org/EVI#Dataset and https://w3id.org/EVI#ROCrate.
      - >-
        The AI-readiness assessment reports 1,468 documented datasets, 2
        documented computation/experiment steps, 1 documented software instance,
        44 documented schemas, and checksums on 1,469 of 1,477 files (99%).

