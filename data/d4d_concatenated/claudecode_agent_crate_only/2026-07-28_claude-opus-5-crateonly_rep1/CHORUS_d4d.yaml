      - Removal or tokenization of direct identifiers
      - Date shifting or limited date fields when required
      - >-
        Tokenized note and report text (via OHNLP toolkit) with raw text retained
        locally across participating institutions
      - >-
        Imaging metadata de-identification using RSNA Clinical Trial Processor
        and pixel-level de-identification using IbisWorks EICON.
    reidentification_risk:
      - Prohibition of re-identification attempts
      - >-
        Data export restrictions and output review procedures to reduce risk of
        re-identification
      - >-
        Re-identification risk is periodically assessed and mitigation strategies
        updated as needed.
    privacy_techniques:
      - >-
        CHoRUS operates within a secure enclave environment aligned with NIST
        800-53 controls.
      - Role-based access control (RBAC)
      - Multi-factor authentication
      - Full audit logging of data access and queries
      - >-
        Layered privacy protection including de-identification, data use
        agreement, controlled access data repository with adherence to NIST
        800-53 principles, audit-level protection, registration, role-based
        access controls, protection against data exfiltration.

