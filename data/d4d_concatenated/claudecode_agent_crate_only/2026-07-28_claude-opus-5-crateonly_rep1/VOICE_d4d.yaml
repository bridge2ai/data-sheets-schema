is_deidentified:
  name: De-identification of the public feature-only release
  identifiable_elements_present: false
  method: Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or rebased;
    geographic information is generalized to the country level; narrative text fields and transcripts
    of free speech are removed; and raw voice waveforms are withheld from this feature-only release.
  identifiers_removed:
  - Direct identifiers
  - High-risk quasi-identifiers
  - Fine-grained geographic identifiers below country level
  - Narrative text fields and detailed narrative responses
  - Transcripts of free speech
  - Raw voice waveforms
  - Household income information
  - Traumatic life experiences
  - Granular cultural identifiers
  deidentification_details:
  - The crate records deidentified as true.
  - Additional filtering removes features for sensitive records and audio checks.
