instances:
- name: Participant
  description: Bridge2AI-Voice v3.0 contains data for 833 participants across five sites in North America.
    Participants were selected based on known conditions which manifest within the voice waveform including
    voice disorders, neurological disorders, mood disorders, and respiratory disorders.
  instance_type: human participant
  counts: 833
  label: true
  label_description: Clinical investigators and care teams record diagnostic categories for voice, neurological,
    mood and respiratory conditions and other phenotype variables, drawing on clinical assessments and
    electronic health records; these labels are represented in disease-specific TSV files with accompanying
    JSON dictionaries.
  missing_information:
  - name: Content withheld from the feature-only release
    missing:
    - Raw voice, speech and respiratory audio waveforms
    - Transcripts of free speech
    - Narrative text fields and detailed narrative responses
    - Fine-grained location data and geographic identifiers below country level
    - Direct identifiers and high-risk quasi-identifiers
    - Some granular demographic and socio-economic variables
    - Household income information
    - Traumatic life experiences
    - Granular cultural identifiers
    why_missing:
    - Withheld from this feature-only release to reduce re-identification risk; raw voice recordings,
      which are themselves biometric identifiers, are made available only under controlled access.
    - Removed during de-identification to align with regulatory and ethical requirements, which reduces
      the risk of re-identification but also limits detailed fairness assessments and certain confounder
      adjustments.
- name: Recording-level derived feature row
  description: Each released feature table stores dense tensors keyed by participant, session and acoustic
    task identifiers. The crate does not report the number of recordings, sessions or feature rows.
  instance_type: derived feature row
anomalies:
- name: Features that could not be computed or were filtered out
  anomaly_details:
  - Some derived audio features could not be computed for all recordings due to quality or length constraints,
    and features relating to free speech or sensitive records have been removed.
  - Additional filtering removes features for sensitive records and audio checks, and some derived features
    are dropped when processing fails or quality checks fail.
known_biases:
- name: Sampling bias
  bias_type: sampling_bias
  bias_description: 'Sampling bias: participants are recruited from specialty clinics and associated institutions
    using a non-probability sampling strategy, with inclusion focused on specific disease cohorts and
    fluent English speakers; this produces clinically enriched case mixes that may not represent general
    population distributions.'
- name: Geographic and cultural bias
  bias_type: representation_bias
  bias_description: 'Geographic and cultural bias: data are collected at a limited number of North American
    sites, and although the project seeks diversity, it may under-represent speakers from other regions,
    cultures, languages and healthcare systems; early releases focus on English, with Spanish protocols
    planned but not yet fully represented.'
- name: Clinical spectrum bias
  bias_type: selection_bias
  bias_description: 'Clinical spectrum bias: because participants are selected into disease cohorts where
    voice changes are expected, the prevalence and severity of conditions in the dataset differ from those
    in routine primary care or community settings, which may inflate model performance when evaluated
    within this dataset.'
- name: Device and environment bias
  bias_type: measurement_bias
  bias_description: 'Device and environment bias: recordings are made using standardized but not identical
    hardware and primarily in clinical environments; future at-home collection or deployment on other
    devices may encounter different background noise, channel characteristics and user behavior.'
- name: Algorithmic bias in machine annotations
  bias_type: algorithmic_bias
  bias_description: 'Algorithmic bias in machine annotations: transcripts and some derived features rely
    on off-the-shelf models such as OpenAI Whisper and other audio toolkits whose performance may vary
    across demographic groups; the dataset team has not independently audited these tools for fairness,
    so downstream users should consider their biases when interpreting results.'
known_limitations:
- name: Feature-only release without raw audio
  limitation_type: coverage_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may constrain the ability
    to reproduce end-to-end audio pipelines.
- name: Adult-only cohort and limited language coverage
  limitation_type: representativeness_limitation
  limitation_description: This version only includes an adult cohort; models trained solely on this dataset
    may not generalize to younger age groups or to languages beyond those represented.
- name: De-identification reduces variable granularity
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed, which reduces the risk of re-identification
    but also limits detailed fairness assessments and certain confounder adjustments.
- name: No predefined splits, benchmarks or label-uncertainty measures
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train–validation–test splits or benchmarking
    tasks and does not include explicit per-instance label-uncertainty measures, so researchers must design
    their own evaluation protocols and handle label noise and missingness.
  recommended_mitigation: Researchers must design their own evaluation protocols and handle label noise
    and missingness.
- name: Registered- and controlled-access governance
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers and can complicate the
    reproducibility of pipelines that require both features and raw audio.
confidential_elements:
- name: Access-controlled limited dataset
  confidential_elements_present: true
  confidentiality_details:
  - Limited dataset available with Data Use Agreement
  - Raw voice recordings, which are themselves biometric identifiers, are made available only under controlled
    access.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset.
subpopulations:
- name: Disease cohorts and coarsened demographic strata
  subpopulation_elements_present: true
  identification:
  - Participants were selected based on known conditions which manifest within the voice waveform including
    voice disorders, neurological disorders, mood disorders, and respiratory disorders.
  - The crate documents disease-specific phenotype schemas for ADHD (adult), airway stenosis, amyotrophic
    lateral sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment, control, COPD
    and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal dystonia, laryngitis, muscle
    tension dysphonia, Parkinson's disease, precancerous lesions, psychiatric history, PTSD (adult), unexplained
    chronic cough and unilateral vocal fold paralysis.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    for example age bands, sex and country of data collection.
sensitive_elements:
- name: Sensitive personal health, demographic and biometric information
  sensitive_elements_present: true
  sensitivity_details:
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory diseases,
    as well as symptom scores from questionnaires, which constitute sensitive personal health data.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    while finer-grained geographic identifiers, direct identifiers and many socio-economic and cultural
    details have been removed during de-identification to reduce re-identification risk.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset; raw voice recordings, which are themselves biometric identifiers, are made
    available only under controlled access.
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
relationships:
- name: Participant, session, task and recording linkage
  relationship_details:
  - Every derived feature table is keyed by participant_id, session_id and task_name, linking each stored
    tensor to a participant, a session and an acoustic task.
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Most participants completed a single in-clinic session and a subset completed repeated sessions.
  - The crate documents separate phenotype schemas for Participant, Session, Acoustic task and Recording,
    which carry the identifier columns that join the phenotype and feature layers.
splits:
- name: No predefined splits
  split_details:
  - The dataset does not provide predefined train-validation-test splits or benchmarking tasks and does
    not include explicit per-instance label-uncertainty measures, so researchers must design their own
    evaluation protocols and handle label noise and missingness.
acquisition_methods:
- name: Direct measurement, self-report and record extraction
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  acquisition_details:
  - 'Data collection types recorded in the crate: Direct measurement; Surveys; Self-reporting; Secondary
    Data analysis; Document analysis.'
  - A standardized protocol combined structured voice and respiratory tasks such as sustained vowels,
    coughs and reading passages with demographic questions, health history, disease-specific questionnaires
    and other patient-reported outcomes.
  - Clinical diagnoses and other metadata were extracted from electronic health records.
  - The released files contain de-identified derived representations of the audio rather than the observed
    waveforms themselves.
collection_mechanisms:
- name: In-clinic mobile application with REDCap capture
  mechanism_details:
  - Data were captured on a mobile or tablet application and stored in REDCap, with most participants
    completing a single in-clinic session and a subset completing repeated sessions.
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Recordings are made using standardized but not identical hardware and primarily in clinical environments.
  - High-quality voice, speech and respiratory audio waveforms were recorded on tablet or smartphone devices
    with headset microphones when available.
sampling_strategies:
- name: Non-probability clinic-based cohort sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Eligible adults presenting to voice, neurology, psychiatry and respiratory clinics, plus healthy controls,
    at multiple specialty clinics and academic hospitals across North America.
  strategies:
  - Eligible adults were screened against predefined inclusion and exclusion criteria before informed
    consent and administration of the standardized protocol.
  - Inclusion focused on specific disease cohorts and fluent English speakers.
  why_not_representative:
  - Participants are recruited from specialty clinics and associated institutions using a non-probability
    sampling strategy, which produces clinically enriched case mixes that may not represent general population
    distributions.
  - Data are collected at a limited number of North American sites, and although the project seeks diversity,
    it may under-represent speakers from other regions, cultures, languages and healthcare systems.
  - Because participants are selected into disease cohorts where voice changes are expected, the prevalence
    and severity of conditions in the dataset differ from those in routine primary care or community settings,
    which may inflate model performance when evaluated within this dataset.
data_collectors:
- name: Clinicians and research staff at participating North American institutions
  role: Clinical assessment, phenotype capture and diagnostic labelling
  collector_details:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines; detailed demographic breakdowns
    of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves.
collection_timeframes:
- name: Adult flagship cohort collection window
  timeframe_details:
  - Data collection for the adult flagship cohort began after project launch in 2023 and is ongoing across
    five North American sites toward an anticipated enrollment of approximately 3,000 participants by
    November 2026; the participants and recordings included in dataset version 3.0.0 were collected roughly
    between 2023 and 2025.
direct_collection:
- name: Direct prospective collection from participants
  is_direct: true
  collection_details:
  - Prospective observational study conducted at multiple specialty clinics and academic hospitals across
    North America.
  - After informed consent, a standardized protocol was administered that combined structured voice and
    respiratory tasks such as sustained vowels, coughs and reading passages with demographic questions,
    health history, disease-specific questionnaires and other patient-reported outcomes.
collection_consents:
- name: Informed consent before protocol administration
  consent_details:
  - Eligible adults were screened against predefined inclusion and exclusion criteria. After informed
    consent, a standardized protocol was administered.
missing_data_documentation:
- name: Missingness in phenotype tables and derived features
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  missing_data_causes:
  - Some derived audio features could not be computed for all recordings due to quality or length constraints.
  - Features relating to free speech or sensitive records have been removed.
  handling_strategy: No additional imputation is applied in the released files.
raw_data_sources:
- name: Study audio, questionnaire and clinical record sources
  source_description: The original raw data consist of high-quality voice, speech and respiratory audio
    waveforms recorded on tablet or smartphone devices with headset microphones when available, plus responses
    to structured demographic and medical history questionnaires, disease-specific validated questionnaires
    and other patient-reported outcomes, together with clinical diagnoses and other metadata extracted
    from electronic health records.
  source_type:
  - Voice, speech and respiratory audio waveforms
  - Structured demographic and medical history questionnaires
  - Disease-specific validated questionnaires and other patient-reported outcomes
  - Clinical diagnoses and metadata extracted from electronic health records
  access_details: Access to the underlying raw audio is available only through a separate controlled-access
    process.
  raw_data_format:
  - Audio waveforms recorded on tablet or smartphone devices with headset microphones when available
  - REDCap questionnaire and phenotype records
ethical_reviews:
- name: Ethical review at the Hastings Center for Bioethics
  description: Ethical Review by Vardit Ravitsky at the Hastings Center for Bioethics
  contact_person: Vardit Ravitsky
  reviewing_organization: The Hastings Center for Bioethics
  review_details:
  - Ethical Review by Vardit Ravitsky at the Hastings Center for Bioethics
- name: University of South Florida Institutional Review Board
  reviewing_organization: University of South Florida Institutional Review Board
  review_details:
  - 'IRB recorded in the crate: University of South Florida Institutional Review Board.'
  - 'IRB contact e-mail recorded in the crate: RSCH-IRB@usf.edu; telephone (813) 974-5638.'
  - 'IRB address recorded in the crate: 3702 Spectrum Blvd., Suite 165 Usf, Tampa, FL 33620, US.'
  - The crate carries an irbProtocolId field but leaves it empty, so no protocol number is available.
data_protection_impacts:
- name: Recognised privacy and misuse risks
  impact_details:
  - The consortium explicitly recognizes the risks associated with voice data, including privacy loss,
    misuse of voice biometrics and algorithmic harms such as discrimination in hiring, insurance or surveillance
    contexts.
  - These risks motivate a governance framework with IRB oversight, rigorous de-identification, separation
    of feature-only and raw-audio tiers and usage restrictions encoded in the registered-access license
    and data use agreement.
  - Dataset documentation and ongoing ethics workstreams are intended to help downstream users reason
    about these risks and design responsible analyses and models.
human_subject_research:
  name: Human subject research status recorded in the crate
  involves_human_subjects: true
  irb_approval:
  - University of South Florida Institutional Review Board.
  - The crate records humanSubjectExemption as 'No' and leaves irbProtocolId empty.
  ethics_review_board:
  - University of South Florida Institutional Review Board.
  - Ethical Review by Vardit Ravitsky at the Hastings Center for Bioethics.
  special_populations:
  - This version only includes an adult cohort.
  regulatory_compliance:
  - The crate records fdaRegulated as false.
  - The crate records the dataset as de-identified.
  - The crate records the confidentiality level as 'Limited dataset available with Data Use Agreement'.
informed_consent:
- name: Informed consent for the in-clinic protocol
  consent_obtained: true
  consent_documentation:
  - After informed consent, a standardized protocol was administered that combined structured voice and
    respiratory tasks with demographic questions, health history, disease-specific questionnaires and
    other patient-reported outcomes.
  consent_scope:
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
participant_privacy:
- name: De-identification and re-identification risk control
  anonymization_method:
  - Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or rebased; geographic
    information is generalized to the country level; narrative text fields and transcripts of free speech
    are removed; and raw voice waveforms are withheld from this feature-only release.
  reidentification_risk:
  - Because of de-identification, some granular demographic and socio-economic variables, fine-grained
    location data and narrative context have been removed, which reduces the risk of re-identification
    but also limits detailed fairness assessments and certain confounder adjustments.
  - Raw voice recordings, which are themselves biometric identifiers, are made available only under controlled
    access.
  privacy_techniques:
  - Removal of direct identifiers and high-risk quasi-identifiers
  - Coarsening or rebasing of dates
  - Generalization of geographic information to country level
  - Removal of narrative text fields and free-speech transcripts
  - Withholding of raw voice waveforms from the feature-only release
  - Filtering of features for sensitive records and audio checks
  data_linkage:
  - The registered-access license and data use agreement explicitly forbid attempts at re-identification.
preprocessing_strategies:
- name: Audio standardization
  preprocessing_details:
  - Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing filtering; they
    are then segmented by task and passed through quality checks.
- name: Derived feature computation
  preprocessing_details:
  - From the standardized audio, multiple derived feature sets are computed including spectrograms, mel
    spectrograms, MFCCs, articulatory features using the Speech Articulatory Coding package, pitch and
    loudness estimates, acoustic features from openSMILE, phonetic and prosodic features from Praat and
    parselmouth, and phonetic posteriorgrams using a dedicated model; all are stored as dense tensors
    in Parquet files with participant, session and task identifiers.
  used_software:
  - *id001
- name: Phenotype export, merge and reorganization
  preprocessing_details:
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using a dedicated open-source
    b2aiprep library, reorganizing the former single phenotype table into thematically organized TSV files
    with accompanying JSON data dictionaries; static per-recording feature summaries are provided in static_features.tsv,
    and de-identification and filtering steps are applied before packaging.
  used_software:
  - *id001
- name: Recorded provenance computations
  description: The crate's provenance graph records exactly two computations, both attributed to a runner
    recorded only as 'Alastair'.
  preprocessing_details:
  - 'VOICE Features Processing: processing step for taking raw data and converting it into spectrograms
    and features using the b2ai-prep. Recorded as run by Alastair with dateCreated 01/29/2026; generated
    the nine Parquet feature files.'
  - 'VOICE Phenotype Ingest: dumping and reformatting phenotype information from Redcap database into
    b2ai-voice phenotype extracts. Recorded as run by Alastair with dateCreated 12/16/2025; generated
    the six phenotype table entities.'
  - Both computations are recorded as using the B2AIPrep Library version 3.0.2.
  used_software:
  - *id001
cleaning_strategies:
- name: De-identification and pre-release filtering
  cleaning_details:
  - Prior to release, data are transformed to reduce re-identification risk and align with regulatory
    and ethical requirements. Direct identifiers and high-risk quasi-identifiers are removed; dates are
    coarsened or rebased; geographic information is generalized to the country level; narrative text fields
    and transcripts of free speech are removed; and raw voice waveforms are withheld from this feature-only
    release. Additional filtering removes features for sensitive records and audio checks, and some derived
    features are dropped when processing fails or quality checks fail.
labeling_strategies:
- name: Clinical and questionnaire-derived labelling
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.
  data_annotation_protocol:
  - Annotations for this dataset consist primarily of clinical labels and questionnaire-derived measures
    associated with each participant and recording. Participants complete validated instruments such as
    VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough questionnaires and voice instruments, which generate
    numerical scores and categorical indicators according to each instrument's published scoring guidelines.
    Clinical investigators and care teams record diagnostic categories for voice, neurological, mood and
    respiratory conditions and other phenotype variables, drawing on clinical assessments and electronic
    health records; these labels are represented in disease-specific TSV files with accompanying JSON
    dictionaries. In addition, machine-generated transcripts of certain voice tasks and numerous automatically
    extracted acoustic and articulatory features provide further labels and descriptors at the recording
    level.
  annotations_per_item: 1
  inter_annotator_agreement: Diagnostic labels are derived from clinical assessments and electronic health
    records rather than crowd workers, so there is no explicit inter-rater majority-vote scheme; however,
    diagnoses are treated as reference labels and may include multiple comorbid conditions per participant.
  annotator_demographics:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines; detailed demographic breakdowns
    of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves, whose demographics
    are captured in coarsened form in the phenotype tables, for example age bands, sex and country of
    data collection; however, per-annotator demographic information, such as which specific clinician
    or staff member entered a label, is not exposed.
  labeling_details:
  - Each recording is associated with one set of clinical labels and questionnaire responses derived from
    a single participant, although participants may contribute multiple sessions over time; there is no
    crowd-sourced labeling and the documentation does not report multiple independent human ratings per
    individual recording.
  - Questionnaire-based labels are generated using the standard scoring rules for each validated instrument,
    yielding total and subscale scores that can be mapped to symptom-severity bands; the scoring logic
    is encoded in the REDCap instruments and documented in the data dictionaries.
  - Participants complete validated instruments such as VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough
    questionnaires and voice instruments.
raw_sources:
- name: Raw audio retained outside the public release
  raw_data_details:
  - The public feature-only PhysioNet release contains de-identified derived representations of the audio,
    such as spectrograms, mel spectrograms, MFCCs, articulatory and prosodic features and phonetic posteriorgrams,
    along with tabular phenotype files and data dictionaries; access to the underlying raw audio is available
    only through a separate controlled-access process.
imputation_protocols:
- name: No global imputation applied
  imputation_method:
  - The public datasets do not apply global statistical imputation to missing fields; instead, missing
    questionnaire responses, phenotype variables and derived features are left as explicit missing values
    or omitted rows.
  imputation_rationale: The data release team audited missingness and users can implement study-specific
    imputation or complete-case strategies appropriate to their analyses.
annotation_analyses:
- name: Label quality and consistency review
  analysis_method: The data release team audited the combined phenotype and feature tables for internal
    consistency, missingness patterns and data entry issues, but per-annotator disagreement statistics
    or detailed label-uncertainty measures are not presently included in the released dataset.
  annotation_quality_details:
  - Questionnaire-based labels are generated using the standard scoring rules for each validated instrument,
    yielding total and subscale scores that can be mapped to symptom-severity bands; the scoring logic
    is encoded in the REDCap instruments and documented in the data dictionaries.
  - Diagnostic labels are derived from clinical assessments and electronic health records rather than
    crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses are treated
    as reference labels and may include multiple comorbid conditions per participant.
machine_annotation_tools:
- name: Automated feature extraction and transcription tools
  tools:
  - OpenSMILE
  - Praat and the parselmouth interface
  - TorchAudio-based pipelines
  - Speech Articulatory Coding (sparc) package
  - Phonetic posteriorgram models
  - OpenAI Whisper Large
  - b2aiprep
  tool_descriptions:
  - OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including measures
    of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units for each
    recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and merging of
    phenotype data into the released files.
  tool_accuracy:
  - Transcripts and some derived features rely on off-the-shelf models such as OpenAI Whisper and other
    audio toolkits whose performance may vary across demographic groups; the dataset team has not independently
    audited these tools for fairness, so downstream users should consider their biases when interpreting
    results.
  used_software:
  - *id001
intended_uses:
- name: Authorized research use under registered access
  description: The crate scopes use to authorized researchers working under the registered-access licence
    and data use agreement.
  usage_notes: Use of the data is restricted to authorized researchers under a registered-access license
    and associated data use agreement that explicitly forbids attempts at re-identification, stigmatizing
    or discriminatory uses and applications such as surveillance or high-stakes individual decision making.
  use_category:
  - Machine-learning model development for voice-based health assessment
  - Benchmarking and validation of voice-biomarker algorithms
  - Exploratory acoustic, phonetic, prosodic and articulatory research
  - Fairness, robustness and AI-safety methodology research
prohibited_uses:
- name: Operational decisions about individuals, re-identification and stigmatizing uses
  description: The dataset is explicitly not intended for operational decision making about specific individuals
    such as hiring, insurance pricing, law enforcement or surveillance, nor for attempts at re-identification
    or for uses likely to stigmatize individuals or groups.
  prohibition_reason:
  - The registered-access license and associated data use agreement explicitly forbid attempts at re-identification,
    stigmatizing or discriminatory uses and applications such as surveillance or high-stakes individual
    decision making.
  - The consortium recognizes the risks associated with voice data, including privacy loss, misuse of
    voice biometrics and algorithmic harms such as discrimination in hiring, insurance or surveillance
    contexts.
future_use_impacts:
- name: Anticipated benefits and risks of downstream use
  impact_details:
  - The project aims to create an ethically sourced, diverse voice dataset to support research on using
    voice as an accessible, low-cost biomarker for screening, diagnosis and monitoring of a broad range
    of health conditions, potentially improving early detection and care for underserved populations.
    At the same time, the consortium explicitly recognizes the risks associated with voice data, including
    privacy loss, misuse of voice biometrics and algorithmic harms such as discrimination in hiring, insurance
    or surveillance contexts; these risks motivate a governance framework with IRB oversight, rigorous
    de-identification, separation of feature-only and raw-audio tiers and usage restrictions encoded in
    the registered-access license and data use agreement. Dataset documentation and ongoing ethics workstreams
    are intended to help downstream users reason about these risks and design responsible analyses and
    models.
distribution_formats:
- name: PhysioNet feature-only release
  description: The crate records a total contentSize of 12.9 GB. Its payload comprises nine Apache Parquet
    feature tables under features/ and six phenotype table entities under phenotype/ recorded with media
    type text/tab-separated-values. Summing the eleven byte counts the crate does state gives 13,789,023,450
    bytes, which is 12.84 GiB.
  access_urls:
  - https://doi.org/10.13026/k81f-qr68
- name: Formats recorded in the crate
  description: The crate's AI-readiness assessment lists the documented formats as .py and text/tab-separated-values.
    The phenotype file entities carry text/tab-separated-values; the nine Parquet feature entities leave
    their format field empty and are identifiable as Parquet only from their file names. Every tabular
    schema in the crate records header true, with a tab separator for the phenotype schemas and a comma
    separator for the feature schemas.
