purposes:
- name: Ethically sourced flagship voice dataset for AI research
  response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset to enable
    future research in artificial intelligence and support critical insights into the use of voice as
    a biomarker of health.
- name: Voice as an accessible, low-cost health biomarker
  response: The project aims to create an ethically sourced, diverse voice dataset to support research
    on using voice as an accessible, low-cost biomarker for screening, diagnosis and monitoring of a broad
    range of health conditions, potentially improving early detection and care for underserved populations.
tasks:
- name: Model development for voice-derived diagnosis and severity estimation
  response: Development, training and fine-tuning of machine-learning models that associate voice-derived
    features with diagnostic categories or symptom severity for conditions such as vocal fold pathology,
    neurological and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
- name: Benchmarking and validation of voice-biomarker algorithms
  response: Benchmarking and validation of existing voice-biomarker algorithms by testing their performance
    on a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
- name: Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
  response: Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
    using de-identified derived features, including work on representation learning, domain adaptation
    and multimodal integration with other health data.
- name: Fairness, robustness and AI-safety methodology research
  response: Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
addressing_gaps:
- name: Voice as an under-exploited health biomarker
  response: The human voice contains complex acoustic markers which have been linked to important health
    conditions including dementia, mood disorders, and cancer. When viewed as a biomarker, voice is a
    promising characteristic to measure as it is simple to collect, cost-effective, and has broad clinical
    utility. Recent advances in artificial intelligence have provided techniques to extract previously
    unknown prognostically useful information from dense data elements such as images.
