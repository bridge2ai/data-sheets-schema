funders:
  - description: NIH Common Fund, award OT2OD032701 (NIH Bridge2AI program).

purposes:
  - description: >-
      To develop a flagship multi-hospital, multimodal, high-resolution clinical dataset under the
      NIH Bridge2AI program, harmonizing EHR data, imaging, high-resolution physiologic signals, and
      tokenized note and report text using standardized data models and governance frameworks.
  - description: >-
      To enable secure, auditable, and reproducible artificial intelligence research aimed at
      improving recovery from acute illness, supporting AI model development, validation,
      benchmarking, and translational research while maintaining compliance with HIPAA and NIH
      data-sharing policies.

intended_uses:
  - description: AI model training within the secure enclave.
  - description: Model validation and benchmarking.
  - description: Algorithm development and feature engineering.
  - description: Retrospective hypothesis testing.
  - description: Fine-tuning of multimodal models.
  - description: Comparative effectiveness research.
  - description: Reinforcement learning and development of expert AI.
  - description: Methodological research in trustworthy AI.
  - description: Trial emulation or powering.
  - description: Usage must align with approved research scope and governance policies.

discouraged_uses:
  - description: Direct translation of trained algorithms to real-time clinical deployment without
      validation or regulatory clearance is not recommended.
  - description: Use as sole evidence for clinical decision-making is not recommended.
  - description: Population inference beyond participating institutions is not recommended.

prohibited_uses:
  - description: Re-identification attempts are prohibited under the dataset's personal and sensitive
      information controls.
  - description: Data may not be used for commercial purposes unless specifically authorized through
      a separate agreement consistent with the governing award and consortium terms.
  - description: No raw data export from the secure enclave is permitted unless explicitly approved.

known_limitations:
  - description: Observational data, not randomized; collected as real-world clinical data, not
      through prospective research interactions with patients.
  - description: Documentation quality is dependent on routine clinical workflows and on which data
      elements are collected in clinical practice.
  - description: Variable sampling rates across real-world data from hospital waveform systems and
      middleware.
  - description: Institutional heterogeneity in coding and clinical data collection practices.
  - description: Limited generalizability beyond participating hospitals.
  - description: Not appropriate for re-identification, contact tracing, or patient-level
      intervention.
  - description: Hold-out splits are available for testing; training and validation in development
      splits require internal mechanisms to avoid overfitting.

known_biases:
  - description: Referral bias from tertiary/quaternary academic centers.
  - description: Socioeconomic and demographic distribution reflective of participating institutions.
  - description: Documentation bias in clinical notes.
  - description: Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
  - description: Differential care pathways affecting label assignment (e.g., ICU vs non-ICU
      populations).
  - description: Temporal trends related to evolving clinical practice.
  - description: Bias assessment is ongoing and documented in dataset release notes.

instances:
  - description: >-
      Instances derive from routine clinical care at participating hospitals and comprise harmonized
      electronic health record data in the OMOP common data model, high-resolution physiologic
      waveforms in WFDB format (including telemetry and EEG where available), imaging, and tokenized
      note and report text produced with the OHNLP toolkit (raw text retained locally at
      contributing institutions).

splits:
  - description: Hold-out splits are available for testing; training and validation are performed in
      development splits, which require internal mechanisms to avoid overfitting.

missing_data_documentation:
  - description: Variable sampling rates across real-world data from hospital waveform systems and
      middleware.
  - description: Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
  - description: Interim release with partial data. Not all patients in the CHoRUS full cohort are
      included. No DICOM images are included in this release, although "medical images" is retained
      as a package-level keyword.

acquisition_methods:
  - description: Data are derived from routine clinical care at participating hospitals under IRB
      oversight; they are not collected solely for research but repurposed from clinical workflows
      under ethical oversight.
  - description: Electronic health record extraction and transformation to the OMOP common data
      model.
  - description: High-resolution physiologic waveform capture, extraction, and transformation to the
      WFDB standard.
  - description: Imaging acquisition with metadata de-identification using the RSNA Clinical Trial
      Processor and pixel-level de-identification using IbisWorks EICON.

direct_collection:
  - description: Data were not collected directly from individuals for research purposes; they were
      repurposed from routine clinical workflows at contributing medical centers under ethical
      oversight.

collection_mechanisms:
  - description: Electronic health record extraction pipelines with transformation to the OMOP common
      data model.
  - description: Hospital waveform systems and middleware for high-resolution physiologic signal
      capture, including telemetry and EEG where available.
  - description: OHNLP toolkit used to tokenize clinical note and report text, with raw text retained
      locally at each institution.
  - description: RSNA Clinical Trial Processor for imaging metadata de-identification and IbisWorks
      EICON for pixel-level de-identification.

data_collectors:
  - description: Participating medical centers and institutional data stewards across the CHoRUS
      consortium, coordinated by the CHoRUS Data Pillar.

raw_data_sources:
  - source_description: >-
      Routine clinical care records generated at participating CHoRUS hospitals, including
      electronic health records, imaging studies, high-resolution physiologic signals (telemetry and
      EEG where available), and clinical note and report text. Raw note text is retained locally at
      contributing institutions and is not distributed.

machine_annotation_tools:
  - description: OHNLP toolkit — used to tokenize clinical note and report text, with raw text
      retained locally at contributing institutions.
  - description: RSNA Clinical Trial Processor — used for de-identification of imaging metadata.
  - description: IbisWorks EICON — used for pixel-level de-identification of images.

preprocessing_strategies:
  - description: Standardized harmonization of electronic health record data to the OMOP common data
      model.
  - description: Transformation of high-resolution physiologic waveforms to the WFDB standard.
  - description: Tokenization of clinical note and report text using the OHNLP toolkit, with raw text
      retained locally.
  - description: De-identification of imaging metadata (RSNA Clinical Trial Processor) and
      pixel-level de-identification (IbisWorks EICON).
  - description: De-identification consistent with HIPAA Safe Harbor, including removal or
      tokenization of direct identifiers and date shifting or limited date fields where required.

is_deidentified:
  description: >-
    The dataset is de-identified. De-identification is consistent with HIPAA Safe Harbor and
    includes removal or tokenization of direct identifiers and date shifting or limited date fields
    when required; imaging metadata are de-identified with the RSNA Clinical Trial Processor and
    images undergo pixel-level de-identification with IbisWorks EICON. Re-identification risk is
    periodically assessed and mitigation strategies updated as needed; re-identification attempts
    are prohibited.

sensitive_elements:
  - description: Patient-level clinical data derived from electronic health records, imaging,
      physiologic waveforms, and clinical note and report text, handled under HIPAA compliance.
  - description: Direct identifiers are removed or tokenized; dates are shifted or limited when
      required.
  - description: Residual re-identification risk is periodically assessed, with data export
      restrictions and output review procedures applied to reduce that risk.

confidential_elements:
  - description: The dataset carries a confidentiality level of HL7:2V (very restricted).
  - description: Raw clinical note and report text is retained locally at contributing institutions
      and is not distributed; only tokenized text is harmonized across sites.

participant_privacy:
  - description: CHoRUS operates within a secure enclave environment aligned with NIST 800-53
      controls.
  - description: Role-based access control (RBAC) and multi-factor authentication govern access.
  - description: Full audit logging of data access and queries is maintained.
  - description: Data export restrictions and output review procedures are applied to reduce the risk
      of re-identification, together with protection against data exfiltration.

human_subject_research:
  description: >-
    Human subject research: Yes. Conducted under Mass General Brigham Institutional Review Board
    protocol #2022P000707. The crate records the human subject exemption verbatim as "HIPAA
    exemption 4 ((45 CFR 46.104(d)(4))". The dataset is recorded as FDA-regulated and de-identified.
    IRB approval or waiver is obtained as appropriate at contributing sites.

ethical_reviews:
  - description: >-
      Ethical review conducted by Eric S. Rosenthal, Michael J. Young, Ishan Williams, Ashley
      Cordes, and Barbara J. Evans in collaboration with the Mass General Brigham IRB, with local
      context review by IRBs, HIPAA Privacy Officers, and institutional counsels at contributing
      medical centers.
  - description: >-
      Reviewing body: Mass General Brigham Institutional Review Board (MGB IRB), IRB Reliance and
      Compliance, 399 Revolution Drive, Suite 710, Somerville, MA 02145, US;
      irbreliance@mgb.org; +1-857-282-1900. IRB protocol #2022P000707.
  - description: Ethical safeguards include IRB approval or waiver as appropriate, compliance with
      CHoRUS governance, and layered privacy protection (de-identification, data use agreement, and
      a controlled-access repository adhering to NIST 800-53 principles with audit-level protection,
      registration, role-based access controls, and protection against data exfiltration).

data_protection_impacts:
  - description: Re-identification risk is periodically assessed and mitigation strategies are
      updated as needed.

license_and_use_terms:
  description: >-
    Use is governed by the CHoRUS Data Use Agreement, available at https://chorus4ai.org/dataset/
    (agreement document: https://chorus4ai.org/wp-content/uploads/2025/10/Data-Agreement-9.30.2025.docx).
    Access is controlled and requires institutional affiliation and credentials, a research proposal
    approved by the CHoRUS governance committee, an executed DUA between the requesting institution
    and CHoRUS, IRB approval or exemption documentation as applicable, and compliance with NIH
    Bridge2AI OT terms and applicable federal regulations. Access is restricted to the secure
    enclave environment; no raw data export is permitted unless explicitly approved. Data may not be
    used for commercial purposes unless specifically authorized through a separate agreement.

