direct_collection:
  - description: >-
      Data were not collected from individuals. All data derive from commercially available,
      de-identified human cell lines (KOLF2.1J iPSC, Cellosaurus CVCL_B5P3; MDA-MB-468,
      Cellosaurus CVCL_0419) and their derivatives.

raw_data_sources:
  - source_description: >-
      Raw sequence data for the expressed genome-scale CRISPRi Perturbation Cell Atlas in
      KOLF2.1J hiPSCs (SRA-derived crate, 16.7 TB, 192 input samples). Access URL recorded as
      "Embargoed" in the crate.
  - source_description: >-
      SEC-MS raw data for MDA-MB-468 following vorinostat or paclitaxel treatment, deposited in
      MassIVE and downloadable from ftp://massive-ftp.ucsd.edu/v10/MSV000098237/ (910 GB).
  - source_description: >-
      EndoTag AP-MS raw mass spectrometry data deposited in MassIVE as MSV000101915 (paclitaxel
      perturbation, 441.2 GB) and MSV000101917 (vorinostat perturbation, 532.5 GB).
  - source_description: >-
      SEC-MS raw data for KOLF2.1J parental, NPC, neuron and cardiomyocyte samples deposited in
      MassIVE as MSV000100676 (1.11 TB).
  - source_description: >-
      Raw four-channel confocal immunofluorescence images of MDA-MB-468 cells (untreated,
      paclitaxel-treated, vorinostat-treated) generated in the Lundberg Lab, Stanford University.

preprocessing_strategies:
  - description: >-
      For the SEC-MS characterization of KOLF2.1J differentiation, raw data were processed using
      Spectronaut and downstream analysis was conducted in R using MSstats-compatible formats.
  - description: >-
      Outputs are packaged with provenance graphs and rich metadata as AI-ready RO-Crates using
      the FAIRSCAPE framework (version 1.1.3); the release records 1,976 computation/experiment
      steps and 6 software instances across the provenance graph.

instances:
  - description: >-
      The release aggregates 53,877 dataset entities within 55,859 total recorded entities,
      spanning single-cell sequencing outputs, mass spectrometry acquisitions and reports, and
      individual immunofluorescence image channels (e.g. per-field blue/red/yellow/green channel
      images for 464 proteins of interest per imaging condition).

relationships:
  - description: >-
      Protein-protein interaction relationships are the analytic target of the SEC-MS and AP-MS
      components (protein correlation profiling and drug-induced interactome rewiring of
      chromatin modifiers); the perturb-seq component relates 11,739 targeted genes to
      transcriptional and fitness phenotypes.

