resources:
  - id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-paclitaxel
    name: EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468 Cells Upon Paclitaxel Perturbation
    description: >-
      Affinity purification mass spectrometry (AP-MS) raw data generated from endogenously tagged
      MDA-MB-468 cells under paclitaxel perturbation, focused on drug-induced interactome rewiring
      of chromatin modifiers in a triple-negative breast cancer context. Four biological replicates;
      each batch includes an untagged parental control, 10 chromatin modifier tagged cell lines and
      a positive control tagged line, with DMSO vehicle controls. Unpublished data. Content size
