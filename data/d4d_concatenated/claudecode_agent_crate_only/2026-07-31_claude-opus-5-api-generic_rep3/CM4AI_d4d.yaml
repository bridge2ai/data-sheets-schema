purposes:
  - description: >-
      To produce AI-ready datasets for the Cell Maps for Artificial Intelligence (CM4AI)
      Functional Genomics Grand Challenge, a component of the NIH Bridge2AI program,
      packaging output data with provenance graphs and rich metadata in RO-Crate format
      using the FAIRSCAPE framework.
  - description: >-
      To map human cell architecture — protein-protein interactions, protein subcellular
      localization, and transcriptional/fitness phenotypes of genetic perturbation — in
      disease-relevant cell lines (KOLF2.1J iPSCs and derived NPCs, neurons and
      cardiomyocytes; MDA-MB-468 breast cancer cells with and without chemotherapy).

addressing_gaps:
  - description: >-
      The release supplies AI-ready, provenance-annotated multimodal cell-architecture data
      intended to enable biologically-driven, interpretable machine learning; the crate notes
      that predicted (computed) cell maps are not yet included and will be added in future
      releases.

tasks:
  - description: 'AI/machine learning model training on multimodal cell architecture data.'
  - description: 'Bioinformatics analysis of the individual modality datasets (perturb-seq, IF imaging, SEC-MS, AP-MS).'
  - description: 'Analysis of cellular processes, cell architectural changes, and molecular interactions under specific disease processes, treatment conditions, or genetic perturbations.'
  - description: 'Functional genomics research, including mapping of protein complexes and interaction network reorganization during iPSC differentiation.'

intended_uses:
  - description: >-
      AI-ready datasets to support research in functional genomics, AI/machine learning model
      training, cellular process analysis, cell architectural changes, and interactions in
      presence of specific disease processes, treatment conditions, or genetic perturbations.
      A major goal is to enable biologically-driven, interpretable ML applications, for example
      as proposed in Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023).

prohibited_uses:
  - description: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.

known_limitations:
  - description: >-
      This is an interim release. It does not contain predicted cell maps, which will be added
      in future releases. The current release is most suitable for bioinformatics analysis of
      the individual datasets. Requires domain expertise for meaningful analysis.
  - description: >-
      These data are not yet in completed final form, and some datasets are under temporary
      pre-publication embargo.
  - description: >-
      Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
      perturb-seq data interrogate sets of proteins which incompletely overlap; computed cell
      maps are not included in this release.
  - description: >-
      Checksum coverage is partial: the AI-readiness self-assessment reports that 8 of 55,859
      recorded entities carry checksums, and 0 entities carry summary statistics.

known_biases:
  - description: >-
      Data in this release was derived from commercially available de-identified human cell
      lines, and does not represent all biological variants which may be seen in the
      population at large.

anomalies:
  - description: >-
      The crate states the total size of the release in two mutually inconsistent ways: the
      top-level entity declares contentSize "19.9 TB" (repeated in the AI-readiness
      self-assessment as "Total size: 19.9 TB"), while evi:totalContentSizeBytes records
      21,051,331,945,400 bytes (approximately 21.05 TB decimal / 19.15 TiB). The byte figure is
      carried in total_size_bytes; both declared values are reported here without selecting
      between them.

missing_data_documentation:
  - description: >-
      Some datasets are under temporary pre-publication embargo. Protein-protein interaction
      (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data interrogate sets
      of proteins which incompletely overlap. Computed cell maps not included in this release.
      The raw sequence data component of the Perturbation Cell Atlas records its access URL as
      "Embargoed".

acquisition_methods:
  - description: 'Perturb-seq (expressed genome-scale CRISPRi perturbation with single-cell RNA sequencing) in KOLF2.1J human iPSCs.'
  - description: 'Immunofluorescence (ICC-IF) confocal imaging of protein subcellular localization in MDA-MB-468 cells.'
  - description: 'Size exclusion chromatography coupled to mass spectrometry (SEC-MS) for protein correlation profiling.'
  - description: 'Affinity purification mass spectrometry (AP-MS) of endogenously tagged MDA-MB-468 cell lines.'

collection_mechanisms:
  - description: >-
      Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at
      Stanford University; nuclei stained with DAPI (blue channel), endoplasmic reticulum with a
      calreticulin antibody (yellow channel), microtubules with tubulin antibody (red channel),
      and an antibody against the protein of interest (green channel).
  - description: >-
      Mass spectrometry acquisition on a Bruker timsTOF platform for the SEC-MS characterization
      of KOLF2.1J differentiation, with quantitative analysis performed using Spectronaut.
  - description: >-
      AP-MS batches comprising an untagged parental control, 10 chromatin-modifier tagged cell
      lines, and a positive-control tagged line, with DMSO-treated samples as vehicle controls;
      all AP-MS experiments performed in four biological replicates.

collection_timeframes:
  - description: 'Data collection timeframe recorded for the June 2026 release: 9/1/2022 to 6/1/2026.'
  - description: >-
      Component crates record narrower timeframes: 9/1/2022 to 1/31/2026 for the AP-MS,
      SEC-MS (MDA-MB-468) and Perturb-Seq atlas components, and 9/1/2022 to 10/13/25 for the
      IF imaging and raw perturb-seq sequence components.

