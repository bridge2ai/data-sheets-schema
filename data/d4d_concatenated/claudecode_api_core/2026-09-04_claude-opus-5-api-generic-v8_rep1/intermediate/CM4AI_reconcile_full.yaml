  identification: >-
    Cell type and treatment condition define the subgroups within the release: MDA-MB-468
    breast cancer cells untreated, treated with paclitaxel, and treated with vorinostat;
    undifferentiated (parental) KOLF2.1J iPSCs; and iPSC-derived neuron progenitor cells
