machine_annotation_tools:
- tools:
  - node2vec deep learning model
  - Human Protein Atlas deep learning model
  - contrastive deep learning co-embedding model
  - community detection for hierarchy creation
  - large language model annotation for assembly naming with confidence scores
  tool_descriptions: >-
    Tools of the CM4AI Multi-Scale Integrated Cell (MuSIC) pipeline, implemented as a
    series of Python packages in the Cell Mapping Toolkit including
    cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding,
    cellmaps_ppi_embedding, cellmaps_coembedding, cellmaps_generate_hierarchy, and
    cellmaps_hierarchyeval. node2vec produces a PPI embedding from downloaded interaction
    networks; the Human Protein Atlas model produces an image embedding from IF images;
    contrastive deep learning integrates the two into a per-protein co-embedding; community
    detection over co-embedding similarities yields the hierarchy; and cell maps are then
    aligned to Gene Ontology and Reactome and named by a large language model approach that
    assigns a name confidence score.
  notes: >-
    These tools produce the computed cell maps, which the June 2026 release states are not
    included in this release; they are recorded here as the CM4AI toolkit that operates on
    the release's input data streams, not as annotation applied to the files distributed
    here.

updates:
  frequency: quarterly
  update_details: >-
    The dataset will be regularly updated and augmented through the end of the project in
    November 2026, with updates on a quarterly basis. CM4AI releases data quarterly,
    ensuring continuous updates to the cell maps and input data streams.

retention_limit:
  retention_details: >-
    Long term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds.

version_access:
  version_details: >-
    Prior quarterly releases remain available in the University of Virginia Dataverse under
    their own DOIs and are listed in the CM4AI data releases archive: May 2024 Data
    Release, March 2025 Data Release, June 2025 Data Release, and October 2025 Data
    Release. Within a release, the Dataverse records earlier versions and their differences.
  latest_version_doi: doi:10.18130/V3/HIGT4C

extension_mechanism:
  extension_details: >-
    The Cell Mapping Toolkit implements the end-to-end pipeline as a series of
    pip-installable Python packages with full user documentation, providing a flexible and
    generalizable framework for cell map construction and enabling researchers to integrate
    and construct cell maps via multiple input modalities. Each package is linked to
    complete user documentation hosted at ReadTheDocs and a step-by-step guide is provided
    at the GitHub repository.
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline

confidential_elements:
- confidential_elements_present: true
  confidentiality_details: >-
    Some datasets are under temporary pre-publication embargo. Perturb-seq data in KOLF2.1J
    iPSCs (undifferentiated) and perturb-seq data in MDA-MB-468 breast cancer cells (with
    and without treatment) are listed as Embargoed among the external data links.

notes: >-
  The CM4AI project is organized into three pillars (Data, People, and Ethics) across six
  modules: Data Acquisition, Tools, and Standards; Skills and Workforce Development, and
  Teaming; and Ethics. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT
  Austin, UA Birmingham, Simon Fraser University, and the Hastings Center, as part of the
  NIH Bridge2AI program. Justin Niestroy (University of Virginia) is recorded by the
  repository as the Depositor of the Dataverse dataset. The CM4AI Ethics Module employs a
  methodology inspired by Value-Sensitive Design (VSD) to create normative standards and
  expectations for the responsible design of datasets and AI technologies, and is
  formulating the CM4AI Life Cycle, a framework intended to elucidate governance milestones
  throughout the data generation and AI system development processes. The Dataverse
  collection carries the notice "This collection is under review for potential modification
  in compliance with Administration directives," and the CM4AI website carries the same
  notice for its repository.