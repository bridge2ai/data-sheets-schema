total_file_count: 10
source_caveats: >-
  total_file_count is the record's own computation: it is the count of the ten file
  entries the June 2026 Dataverse release lists ("1 to 10 of 10 Files"), not a total any
  source reports. total_size_bytes is omitted, and per-collection total_bytes values are
  likewise omitted, because the repository reports file sizes only to one decimal place in
  KB, MB and GB and does not state whether those units are binary or decimal; each
  collection's stated size string is preserved verbatim in its notes rather than converted
  to a byte-exact figure the evidence does not support. The CM4AI project landing page and
  data releases page report aggregate project figures (1,374 protein interactions; 53,788
  immunofluorescent images; 7,023 total proteins investigated; 11,739 genes targeted; 21.4
  TB data volume) that describe the CM4AI project as a whole across releases rather than
  this June 2026 release specifically, and are therefore not carried in this record's own
  slots. The tier-1 June 2026 release and the tier-1 October 2025 release differ on the
  composition of the release: the October 2025 release does not list AP-MS data, while the
  June 2026 release adds "AP-MS data for MDA-MB-468 breast cancer cells + treatment" and
  two AP-MS MassIVE external links; the June 2026 release is preferred as it supersedes the
  October 2025 release. The two releases also differ on immunofluorescence file MD5
  checksums for identically named archives (for example cm4ai_ifimages_MDA-MB-468_untreated.zip
  is a98affcc05429650c6bb3906cd836d55 in the October 2025 release and
  6d066e6b9d762284c6aa5d0b44565568 in the June 2026 release); the June 2026 values are
  recorded. Protein and gene counts for the immunofluorescence images differ between the
  tier-5 March 2025 release (563 proteins) and the tier-5 June 2025 and tier-1 October 2025
  releases (464 proteins); no such count is stated in the June 2026 release, so no count is
  carried in this record. The Nature 2025 publication and its associated U2OS cell map
  describe a separate dataset from a related effort and are recorded under related_datasets
  rather than in this record's own slots. No source in the bundle states a language for the
  resource, asserts whether the release as a whole is tabular, or names a single source
  resource from which the release was derived; language, is_tabular and was_derived_from are
  therefore omitted.

