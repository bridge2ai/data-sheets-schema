purposes:
- response: >-
    To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: >-
    To deliver machine-readable hierarchical maps of cell architecture as AI-Ready data
    produced from multimodal interrogation of chromatin modifiers and metabolic enzymes
    involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell
    lines under perturbed and unperturbed conditions.
- response: >-
    To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
    data collected for human cell lines, to enable transformative biomedical AI research.
- response: >-
    To create a library of large-scale maps of cellular structure and function across
    demographic and disease contexts that will broadly stimulate research and development
    in "visible" machine learning systems informed by multi-scale cell and tissue
    architecture.

addressing_gaps:
- response: >-
    In genomics and precision medicine, machine learning models are often "black boxes,"
    predicting phenotypes from genotypes without understanding the mechanisms by which
    such translation occurs. This project addresses that deficiency by generating matched
    data and tools enabling the creation of "visible" machine learning systems built
    directly on knowledge maps of cell and tissue architecture.
- response: >-
    Although the basic sequence of the human genome has been known for over two decades,
    knowledge of how its proteins are organized within cells is still very much evolving;
    much of cell structure remains uncharted.
- response: >-
    Cell mapping technologies have typically been applied separately; integration of
    multiple complementary data modalities provides the opportunity to incorporate
    biological structure robustly across physical scales.

tasks:
- response: >-
    Construction of hierarchical cell maps as directed acyclic graphs in which each node
    represents an assembly of proteins in proximity at a given scale, spanning from large
    assemblies representing cell compartments to small assemblies of proteins in close
    proximity.
- response: >-
    Interpretable genotype-phenotype learning, including development of "visible machine
    learning" or "visible neural networks" that interrogate how protein assemblies in the
    cell affect cell-level phenotype predictions.
- response: >-
    Interpretation of genetic variants and mutations in human genomics using cell maps as
    a foundation for downstream applications.

intended_uses:
- use_category: AI-ready data for functional genomics research
  examples:
  - >-
    AI-ready datasets to support research in functional genomics.
- use_category: AI model training
  examples:
  - >-
    Training of AI models on multi-modal cellular data.
- use_category: Cellular process analysis
  examples:
  - >-
    Analysis of cellular processes from protein-protein interaction, spatial localization,
    and genetic perturbation data.
- use_category: Analysis of cell architecture under perturbation
  examples:
  - >-
    Cell architectural changes and interactions in presence of specific disease processes,
    treatment conditions, or genetic perturbations.
- use_category: Bioinformatics analysis of individual data modalities
  usage_notes: >-
    The current release is most suitable for bioinformatics analysis of the individual
    datasets, since computed cell maps are not included.

prohibited_uses:
- notes: >-
    These laboratory data are not to be used in clinical decision-making or in any
    context involving patient care without appropriate regulatory oversight and approval.

known_limitations:
- limitation_type: scope_limitation
  limitation_description: >-
    This is an interim release and does not contain predicted cell maps, which will be
    added in future releases.
  recommended_mitigation: >-
    Use the release for bioinformatics analysis of the individual modality datasets.
- limitation_type: coverage_limitation
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
    perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: integration_limitation
  limitation_description: >-
    Computed cell maps are not included in this release.
- limitation_type: methodological_limitation
  limitation_description: >-
    Meaningful analysis requires domain expertise.
- limitation_type: coverage_limitation
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo. Perturb-seq data in
    KOLF2.1J iPSCs (undifferentiated) and perturb-seq data in MDA-MB-468 breast cancer
    cells are listed as embargoed among the external data links.

known_biases:
- bias_type: representation_bias
  bias_description: >-
    Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the
    population at large.

sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: >-
    The release records Human Subjects: No; De-identified Samples: Yes; FDA Regulated: No.
    The CM4AI preprint states the data are non-clinical (from tissue cultures) and are
    considered to be de-identified as they cannot be matched, with current knowledge, to a
    human subject.

