acquisition_methods:
- acquisition_details: >-
    Protein-protein interactions were mapped by affinity purification mass spectrometry
    (AP-MS) on endogenously tagged cell lines.
  was_directly_observed: true
- acquisition_details: >-
    Protein-protein interactions were mapped by size-exclusion chromatography coupled to
    mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping, used as
    an orthogonal mass spectrometry-based approach to AP-MS.
  was_directly_observed: true
- acquisition_details: >-
    Spatial subcellular organization was mapped by immunofluorescence-based staining
    (ICC-IF) and confocal microscopy using the Human Protein Atlas resource of antibodies.
    Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and
    antibody against protein of interest (green channel).
  was_directly_observed: true
- acquisition_details: >-
    Genetic perturbation data were acquired by single-cell CRISPR screens using a CRISPR
    lentiviral library targeting chromatin factors with 6 guide RNAs per gene, in cell
    lines expressing inducible dCas9, using the 10x Genomics 3'HT kit.
  was_directly_observed: true

collection_mechanisms:
- mechanism_details: >-
    Automated fixation and permeabilization protocols were established for a pipetting
    robot for the MDA-MB-468 and KOLF2 cell lines for immunofluorescence sample
    preparation.
- mechanism_details: >-
    Confocal microscopy was used to image immunofluorescence-stained cells in the Lundberg
    Lab at Stanford University.
- mechanism_details: >-
    A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene
    was designed; MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were
    generated and characterized; single-cell CRISPR screens were performed using the 10x
    Genomics 3'HT kit.

data_collectors:
- collector_details: >-
    Immunofluorescence imaging of protein spatial localization was performed in the
    Lundberg Lab at Stanford University.
  role: Spatial proteomics / immunofluorescence imaging
- collector_details: >-
    SEC-MS and AP-MS protein-protein interaction data were generated in the Nevan Krogan
    laboratory at the University of California San Francisco.
  role: Protein-protein interaction mass spectrometry

direct_collection:
- is_direct: false
  collection_details: >-
    Data were generated from commercially available de-identified human cell lines rather
    than collected directly from individuals. MDA-MB-468 is available from ATCC and
    KOLF2.1J is available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
    resource for access by not-for-profit organizations via a simple MTA.

