  - slot: purposes[0].response
    snippet: "the CM4AI data generation\nproject seeks to map the spatiotemporal architecture of human cells and use these\nmaps toward the grand challenge of interpretable genotype-phenotype learning"
  - slot: addressing_gaps[0].response
    snippet: "In\ngenomics and precision medicine, machine learning models are often \"black boxes,\"\npredicting phenotypes from genotypes without understanding the mechanisms by\nwhich such translation occurs"
  - slot: purposes[3].response
    snippet: "creating a library of large-scale maps of cellular structure/function across\ndemographic and disease contexts. These data will broadly stimulate research and\ndevelopment in \"visible\" machine learning systems"
