- id: c010
  status: extracted
  extracted:
  - slot: purposes[2].response
    snippet: "produce ethical, AI-ready datasets of cell architecture, inferred from multimodal data collected for human cell lines, to enable transformative biomedical AI research"
  - slot: purposes[1].response
    snippet: "deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed conditions"
  - slot: notes
    snippet: "It consists of three pillars – Data, People, and Ethics – organized into six modules"
  - slot: tasks[0].response
    snippet: "Cell maps are hierarchical directed acyclic graphs (DAG), where each node represents an assembly of proteins in proximity at a given scale"
  - slot: tasks[2].response
    snippet: "Cell maps provide a foundation for downstream applications in human genomics, including interpretation of genetic variants and mutations"
  - slot: tasks[1].response
    snippet: "they have been used in AI tools for “visible machine learning” or “visible neural networks” (VNNs) to interrogate how protein assemblies in the cell affect cell-level phenotype predictions"
  - slot: external_resources[7]
    snippet: "Cell maps are shared via the Network Data Exchange (NDEx)13  and can be visualized in a web browser or accessed via tools such as Cytoscape14, HiView15,\nand the Python ndex2 library16"
  - slot: is_deidentified.deidentification_details
    snippet: "CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue"
  - slot: conforms_to
    snippet: "packaged with provenance graphs and rich metadata as AI-Ready\ndatasets in RO-Crate format"
- id: c011
  status: extracted
  extracted:
  - slot: sensitive_elements[0].sensitivity_details
    snippet: "cultures) and are considered to be de-identified as they cannot be matched, with current\nknowledge, to a human subject"
  - slot: direct_collection[0].collection_details
    snippet: "available from ATCC. This cell line has been extensively\nused to study triple-negative breast cancer"
  - slot: direct_collection[0].collection_details
    snippet: "It is available for access by non-for-profit organizations via\na simple MTA"
  - slot: acquisition_methods[0].acquisition_details
    snippet: "we employed AP-MS on endogenously tagged cell lines"
  - slot: acquisition_methods[1].acquisition_details
    snippet: "size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for\nproteome-wide complex/interaction mapping as two orthogonal mass spectrometry-\nbased approaches"
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "We established automated fixation and\npermeabilization protocols for the pipetting robot for MDA-MB-468 and KOLF2 cell lines"
  - slot: collection_mechanisms[2].mechanism_details
    snippet: "We have designed a CRISPR\nlentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene"
  - slot: acquisition_methods[3].acquisition_details
    snippet: "Single-cell CRISPR screens of 100 chromatin regulators (+/– drug) in\nMDA-MB-468 cells and in undifferentiated KOLF2.1J iPSCs were done using the 10x\nGenomics 3’HT kit"
- id: c012
  status: extracted
  extracted:
  - slot: raw_sources[0].raw_data_details
    snippet: "PPI networks for the cell line and conditions are downloaded from the Krogan\nLaboratory’s deposition archive and made available for further processing"
  - slot: raw_sources[1].raw_data_details
    snippet: "IF images for the cell line and conditions are downloaded from the Lundberg\nLaboratory’s deposition archive"
  - slot: preprocessing_strategies[0].preprocessing_details
    snippet: "Downloaded PPI networks are processed using the node2vec deep learning model31\nto reduce dimensionality, producing a PPI embedding"
  - slot: preprocessing_strategies[1].preprocessing_details
    snippet: "IF images are processed using a Human Protein Atlas deep learning model32 to\nreduce dimensionality, producing an image embedding"
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "The PPI and image embeddings are integrated to obtain a co-embedding for each\nprotein using contrastive deep learning"
  - slot: preprocessing_strategies[3].preprocessing_details
    snippet: "Community detection is performed based on the all-by-all similarities of pairs of\nproteins in the co-embedding space"
  - slot: labeling_strategies[0].labeling_details
    snippet: "cell maps are aligned to\nknown protein function and pathway resources, including the Gene Ontology (GO)34 and\nReactome35"
  - slot: machine_annotation_tools[0].tools
    snippet: "assemblies in the cell maps are annotated using a large\nlanguage model (LLM) approach that we developed to name sets of proteins and assign\na name confidence score"
  - slot: external_resources[6]
    snippet: "open-source Integrative Modeling Platform (IMP) package version 2.18\n(https://integrativemodeling.org)"
