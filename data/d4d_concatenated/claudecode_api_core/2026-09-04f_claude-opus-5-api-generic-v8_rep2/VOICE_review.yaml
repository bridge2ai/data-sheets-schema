notes: >-
  One finding the items cannot fully carry: the reconcile phase dropped the entire
  data_governance object (committee_name, accountable_organization, access_review_process,
  stewardship_roles, notes — all receipted at phase 1) with no audit finding against it and no
  row in the report's Dispositions table, unlike every other removal, which is documented.
  Most of its content survives elsewhere (license_and_use_terms, maintainers[1],
  third_party_sharing), but the USF Board of Trustees provider-institution fact, the
  stewardship roles and the governance memorandum were silently lost (slot-056, -058, -059).
  The report gate (#929) checks the rows a report has and cannot see an undocumented removal,
  so nothing flagged it; that is an instrument limitation worth an issue, not a verdict here.
  Of the six changed_meaning reshape verdicts, three (slot-053, -054, -060) are documented,
  rule-17-justified deletions where the record deliberately no longer says what the passage
  says; the other three are the silent data_governance losses. The receipt's misattributed
  'Minimum Age 18 years' snippet (slot-011) is already surfaced by the validator's
  no_value_overlap sample, so the instrument saw it.
