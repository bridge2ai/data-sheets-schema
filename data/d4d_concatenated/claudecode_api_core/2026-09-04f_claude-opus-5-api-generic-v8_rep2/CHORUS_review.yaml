notes: >-
  The reconciliation report contradicts the record on regulatory_restrictions (slot-055): its
  prose asserts the legal-analysis content "remains in regulatory_restrictions.regulatory_restrictions",
  but the slot is absent from both final records, and the Dispositions table carries no row for it,
  so the report gate — which reads the table — could not see the undeclared removal. That is a
  run-report defect distinct from the verdicts and worth an issue. Minor observations outside the
  sampled items: maintainers[1] (Ciera McCrary, a person) and maintainers[2] (the GitHub
  organization) both carry role academic_institution, an enum shoehorn; funders[0].grants[0].description
  adds "USD" to an NIH award amount the source states without a currency unit.
