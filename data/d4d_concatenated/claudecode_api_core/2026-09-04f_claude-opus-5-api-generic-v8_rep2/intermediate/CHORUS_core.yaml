purposes:
- response: To develop a publicly available, AI-ready critical care dataset while ensuring
    the methods promote privacy, accountability and clinical benefit, and while promoting
    a new generation of AI clinicians and scientists.
- response: To develop the most diverse, high-resolution, ethically sourced, AI-ready data
    set to answer the grand challenge of improving recovery from acute illness.
- response: To create ethically sourced datasets and tools around artificial intelligence
    and to create best practices for AI in health, in collaboration with the other Bridge2AI
    data generation projects.
- response: To develop capabilities across a multi-center network to acquire, standardize,
    tokenize, store, visualize and label structured EHR data, tokenized unstructured EHR data,
    telemetry and EEG waveforms, imaging, and social determinants of health.
tasks:
- response: Characterizing acute and critical care illness.
- response: Predicting complications among patients with acute or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
- response: External validation of AI/ML models against a sequestered holdout dataset, to
    aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
addressing_gaps:
- response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care; developing high-resolution multi-center data sets
    is a critical first step towards actionable and trustworthy AI.
- response: Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready
    dataset for the grand challenge of improving recovery from acute illness.
- response: Absence of sequestered holdout data for external validation of models developed
    on critical care data, which the project addresses by sequestering holdout datasets.
- response: Lack of unified standards across multi-modal EHR, waveform, imaging and text data,
    which the project addresses through harmonization and validated semantic mappings.
