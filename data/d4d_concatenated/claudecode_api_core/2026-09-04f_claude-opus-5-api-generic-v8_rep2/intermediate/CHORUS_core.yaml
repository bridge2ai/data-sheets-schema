known_biases:
- bias_type: selection_bias
  bias_description: The cohort is assembled from 14 data contributing hospitals within a collaboration
    of 20 academic centers, so patient case mix reflects the populations served by those centers.
  mitigation_strategy: Federated access is intended to enable sampling methods that ensure
    a balanced and diverse cohort; the project additionally samples to ensure comprehensive
    sets of patient conditions and clinical treatment strategies, and patient-focused efforts
    determine ethical and legal approaches to manage privacy and bias while accounting for
    social determinants of health.
  source_caveats: The bundle documents the project's bias-management intent and the composition
    of the contributing network; it does not report a measured bias assessment for the released
    data.
known_limitations:
- limitation_type: coverage_limitation
  limitation_description: 'Imaging coverage is partial: as of the September 2025 webinar only
    1000 images were available, with de-identification in process for a larger cohort.'
- limitation_type: coverage_limitation
  limitation_description: EEG waveform data were still being extracted at the time of the
    September 2025 webinar and were therefore not fully available to users.
- limitation_type: integration_limitation
  limitation_description: Clinical note text is stored locally at the contributing sites rather
    than in the enclave; only tokens are centrally available, which constrains analyses requiring
    full note text.
- limitation_type: scope_limitation
  limitation_description: The dataset covers acute and critical care admissions (ICU, PICU
    and NICU) contributed by 14 hospitals, so it does not represent care outside these settings
    or these institutions.
- limitation_type: coverage_limitation
  limitation_description: The released dataset of 50,000 admissions is smaller than the anticipated
    final dataset of 100,000 admissions across 9 data modalities.
confidential_elements:
- confidential_elements_present: true
  confidentiality_details: Every data type is listed with controlled access. OMOP and telemetry
    data sit in the enclave; clinical notes are not placed in the enclave but stored locally
    at contributing sites, with only tokens shared.
subpopulations:
- subpopulation_elements_present: true
  identification: Adult intensive care unit (ICU) admissions, identified by the care setting
    of the admission.
- subpopulation_elements_present: true
  identification: Pediatric intensive care unit (PICU) admissions, identified by the care
    setting of the admission.
- subpopulation_elements_present: true
  identification: Neonatal intensive care unit (NICU) admissions, identified by the care setting
    of the admission.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset consists of clinical data about critically ill patients,
    including diagnoses, procedures, medication administration, nursing flowsheets, clinical
    notes, imaging, telemetry and EEG waveforms, and social determinants of health with geographic
    context such as distance to the nearest hospital.
acquisition_methods:
- acquisition_details: 'Retrospective data collection: data documented during routine clinical
    care are extracted from the source systems of contributing hospitals (EHR, PACS, bedside
    monitors and gateway or middleware, and the hospital EEG database) and delivered as site
    data extracts.'
  was_directly_observed: true
- acquisition_details: 'Derived content: unstructured EHR text is extracted and tokenized
    using the OHNLP toolkit, and OMOP Location entities are geocoded with open source code
    using DeGauss so that data elements feature contextual factors such as geographic distance
    to the nearest hospital.'
  was_inferred_derived: true
collection_mechanisms:
- mechanism_details: Bedside monitors with gateway/middleware capture for waveform telemetry,
    converted with the CHoRUS waveform conversion scripts maintained in the chorus_waveform
    repository.
- mechanism_details: The OHNLP toolkit, used to extract and tokenize clinical notes at contributing
    sites.
- mechanism_details: Site data extracts created and uploaded using the chorus-extract-upload
    tooling, following standard operating procedures published on the centralized Chorus_SOP
    documentation site.
collection_timeframes:
- timeframe_details: Retrospective collection of previously recorded clinical data at contributing
    hospitals; as presented in September 2025, the assembled dataset reflected a state as
    of August 2025, with further acquisition continuing within the project period.
data_collectors:
- name: CHoRUS data contributing hospitals
  role: data acquisition center
  collector_details: 14 data contributing hospitals supply clinical data extracts; the collaboration
    spans 20 academic centers, of which 14 contribute as Data Acquisition centers.
- name: Site data managers at contributing sites
  role: data site manager
  collector_details: Data managers at contributing sites follow the interactive Chorus_SOP
    workflow to extract and contribute clinical data, and provide regular status updates on
    their extract progress through GitHub or a Google Form that updates the Standards and
    Data Acquisition project boards.
raw_data_sources:
- source_description: Structured electronic health record data from contributing hospitals.
  source_type: hospital electronic health record system
  raw_data_format: Source EHR formats, transformed to the OMOP Common Data Model (demographics,
    medication administration with dosing time-stamped upon each infusion change or dose administration,
    procedures documented by providers, diagnoses documented by providers, and high-frequency
    nursing flowsheet documentation).
  access_details: Controlled access.
- source_description: Unstructured clinical notes from the electronic health record.
  source_type: hospital electronic health record system
  raw_data_format: Free text, extracted and tokenized using the OHNLP toolkit.
  access_details: Controlled access; clinical notes are stored locally at the contributing
    sites, with only tokens held centrally.
- source_description: Radiology imaging drawn from hospital PACS archives.
  source_type: picture archiving and communication system
  raw_data_format: DICOM.
  access_details: Controlled access.
- source_description: Continuous physiologic waveform telemetry from bedside monitors.
  source_type: bedside monitor with gateway/middleware capture
  raw_data_format: WFDB, documented against an extended PhysioNet schema.
  access_details: Controlled access; held in the cloud enclave.
- source_description: Electroencephalography recordings from the hospital EEG database.
  source_type: hospital EEG database
  raw_data_format: EDF+ and Persyst.
  access_details: Controlled access; extraction was in process at the time of the September
    2025 webinar.
sampling_strategies:
- is_sample: true
  strategies: Sampling to ensure comprehensive sets of patient conditions and clinical treatment
    strategies; federated access is intended to enable sampling methods that ensure a balanced
    and diverse cohort across the contributing centers.
  source_caveats: The bundle states the sampling intent but does not describe the executed
    sampling frame, inclusion criteria, or any verification of representativeness.
preprocessing_strategies:
- preprocessing_details: Standardization of source clinical data to the OMOP Common Data Model,
    supported by validated semantic mappings for connecting clinical data in various source
    formats to international standards; pooled tabular mappings and an associated clinical
    validation SOP are maintained in the chorus-mapping repository.
- preprocessing_details: Extraction and tokenization of unstructured electronic health record
    text using the OHNLP toolkit, so that only tokens leave the contributing site.
- preprocessing_details: Transformation of data using approaches that limit re-identification,
    including de-identification tooling for imaging (CTP-deid) and a privacy scan tool for
    medical records.
- preprocessing_details: Waveform conversion using the documentation and conversion scripts
    maintained in the chorus_waveform repository, with additional resources supporting the
    preparation and release of waveforms.
- preprocessing_details: Geocoding of OMOP Location entities via DeGauss, supporting contextual
    factors such as geographic distance to the nearest hospital and social determinants of
    health.
cleaning_strategies:
- cleaning_details: Characterization reports are produced and returned to contributing sites
    following their data submissions, allowing sites to identify and resolve issues in their
    extracts.
- cleaning_details: Standard operating protocols instruct data contributing sites on best
    practices for curating and delivering interoperable datasets; SOP documents undergo an
    internal validation and review process before publication.
labeling_strategies:
- labeling_details: The project plans a visualization and annotation environment that will
    label data with targets important for prediction; the abstract likewise describes developing
    capabilities to visualize and label data across the multi-center network.
existing_uses:
- examples: The datasets are being used for training activities and publications.
- examples: The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, November
    2025 to July 2026) gives up to 30 selected trainees hands-on training on the Bridge2AI
    AI/ML for Clinical Care Network, using the CHoRUS data and tools to create practical use
    cases and to conduct collaborative research on the Bridge2AI Clinical Care Cloud platform.
other_tasks:
- task_details: 'Beyond model development, the data serve as a teaching corpus: canonical
    Jupyter notebooks, workshops on the OHDSI tool stack and the OHDSI/OMOP common data model,
    and didactics on generative AI and specific use cases are delivered on the Bridge2AI AI/ML
    for Clinical Care Collaborative Cloud.'
future_use_impacts:
- impact_details: The project anticipates that the dataset will catalyze biomedical research
    and expertise needed to promote patient-focused deployment of AI in acute and critical
    care, and that the holdout set will aid marketplace adoption of AI-developed models.
- impact_details: 'Because the data derive from critically ill patients, the project pairs
    future use with privacy safeguards: transformations that limit re-identification, community-facing
    ethics focus groups on what data is appropriate for public sharing, and analysis of the
    legal and regulatory landscape to manage privacy and bias while accounting for social
    determinants of health.'
intended_uses:
- use_category: Clinical AI/ML model development
  examples:
  - Building machine-learning and AI-derived models that characterize acute and critical care
    illness, predict complications, and measure treatment response, in order to improve the
    care and outcomes of patients requiring critical care.
- use_category: External model validation
  examples:
  - Validating externally developed models against a sequestered holdout dataset, an activity
    the project plans in order to aid marketplace adoption of AI-developed models.
- use_category: Education and workforce development
  examples:
  - Hands-on AI/ML training in the CHoRUS ecosystem, including structured EHR datasets, clinical
    deep learning, ethics of clinical AI, and the OHDSI/OMOP common data model.
