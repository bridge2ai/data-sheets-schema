title: 'Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI'
was_derived_from: Routine clinical documentation and device data from the electronic health
  record, PACS imaging archives, bedside monitor gateway/middleware, and hospital EEG databases
  of 14 contributing hospitals.
id: https://chorus4ai.org/
name: CHoRUS Dataset
description: 'CHoRUS is a multicenter, multimodal, high-resolution, controlled-access critical
  care dataset produced by the Patient-Focused Collaborative Hospital Repository Uniting Standards
  (CHoRUS) for Equitable AI project, one of four data generation projects in the NIH-funded
  Bridge2AI consortium. Data are collected retrospectively from the clinical systems of 14
  data contributing hospitals within a collaboration spanning 20 academic centers, and are
  harmonized to unified standards: structured electronic health record data are standardized
  to the OMOP Common Data Model, imaging from PACS is held as DICOM, bedside monitor telemetry
  as WFDB waveforms, hospital EEG as EDF+ and Persyst, and clinical notes are extracted and
  tokenized using the OHNLP toolkit. The current released dataset reported by the project
  website comprises 50,000 patient admissions from ICU, PICU and NICU settings, 1.6 billion
  rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data;
  the anticipated final dataset covers 100,000 patient admissions across 9 data modalities.
  All data types are under controlled access. As presented in September 2025, OMOP and telemetry
  data reside in a cloud enclave, clinical notes are stored locally at the contributing sites
  except for tokens, imaging de-identification was in process for a larger cohort, and EEG
  extraction was in process.'
notes: The CHoRUS project website carries a site-wide banner reading "This repoitory is under
  review for potential modification in compliance with Administration directives" (spelling
  as published).
source_caveats: 'The two mid-tier sources report different admission totals for the released
  data: the project website (project_documentation, higher ranked) states a Current Released
  Dataset of 50,000 patient admissions, while the September 2025 AIM-AHEAD informational webinar
  (cohort_2_webinar) states that "As of August 2025" the dataset "covers 14 different hospitals
  with over 45K unique admissions"; the higher-ranked website figure is used here and the
  webinar figure is recorded in this caveat. Imaging volume is likewise reported two ways
  and on different units: the website reports 7,642 admissions with radiology data, the webinar
  reports 1000 images currently available with de-identification in process for a larger cohort.
  Anticipated final figures (100,000 admissions, 9 modalities) are stated by the website as
  anticipated, not released. The webinar''s data-type table has a Metadata column containing
  both "Yes" and "Planned" values, but the table''s text is interleaved in the bundle in a
  way that does not permit reliable assignment of Yes/Planned to individual data types, so
  per-modality metadata status is not asserted here. The chorus-ai GitHub overview was captured
  2025-11-14 and is the lowest-ranked source in the bundle.'
