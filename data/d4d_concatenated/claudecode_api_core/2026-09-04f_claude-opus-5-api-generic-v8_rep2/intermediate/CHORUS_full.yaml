status: >-
  Released to approved users under controlled access; data acquisition, standardization and modality
  expansion ongoing within the NIH project period 2022-09-01 through 2026-11-30.
page: https://chorus4ai.org/
notes: >-
  The CHoRUS project website carries a site-wide banner reading "This repoitory is under review for
  potential modification in compliance with Administration directives" (spelling as published).
source_caveats: >-
  The two mid-tier sources report different admission totals for the released data: the project
  website (project_documentation, higher ranked) states a Current Released Dataset of 50,000 patient
  admissions, while the September 2025 AIM-AHEAD informational webinar (cohort_2_webinar) states
  that "As of August 2025" the dataset "covers 14 different hospitals with over 45K unique
  admissions"; the higher-ranked website figure is used here and the webinar figure is recorded in
  this caveat. Imaging volume is likewise reported two ways and on different units: the website
  reports 7,642 admissions with radiology data, the webinar reports 1000 images currently available
  with de-identification in process for a larger cohort. Anticipated final figures (100,000
  admissions, 9 modalities) are stated by the website as anticipated, not released. The webinar's
  data-type table has a Metadata column containing both "Yes" and "Planned" values, but the table's
  text is interleaved in the bundle in a way that does not permit reliable assignment of Yes/Planned
  to individual data types, so per-modality metadata status is not asserted here. The chorus-ai
  GitHub overview was captured 2025-11-14 and is the lowest-ranked source in the bundle.
conforms_to: >-
  OMOP Common Data Model for structured EHR data (demographics, medication administration,
  procedures, diagnoses, and nursing flowsheets under an extended OMOP schema); DICOM for imaging;
  WFDB with an extended PhysioNet schema for waveform telemetry; EDF+ and Persyst for waveform EEG;
  the OHNLP open source schema for extracted and tokenized clinical notes.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
