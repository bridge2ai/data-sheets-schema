known_biases:
- bias_type: representation_bias
  bias_description: Data in this release were derived from commercially available de-identified
    human cell lines and do not represent all biological variants which may be seen in the
    population at large.
  affected_subsets:
  - 'All modalities in the release, which derive from two cell lines: MDA-MB-468, a triple
    negative breast cancer line established from a metastatic pleural effusion of a 51-year-old
    black female with metastatic mammary adenocarcinoma, and KOLF2.1J, an iPSC line derived
    from a healthy male Northern European donor.'
known_limitations:
- limitation_type: scope_limitation
  limitation_description: This is an interim release; the data are not yet in completed final
    form.
- limitation_type: coverage_limitation
  limitation_description: The release does not contain predicted cell maps, which will be
    added in future releases.
- limitation_type: coverage_limitation
  limitation_description: Some component datasets are under temporary pre-publication embargo.
    The perturb-seq data for KOLF2.1J iPSCs and for MDA-MB-468 breast cancer cells are listed
    in the external data links as embargoed.
- limitation_type: integration_limitation
  limitation_description: The protein-protein interaction (SEC-MS), protein localization (IF
    imaging) and CRISPRi perturb-seq data interrogate sets of proteins which incompletely
    overlap.
- limitation_type: integration_limitation
  limitation_description: The current release is most suitable for bioinformatics analysis
    of the individual datasets rather than for integrated cross-modality analysis.
- limitation_type: methodological_limitation
  limitation_description: Meaningful analysis requires domain expertise.
confidential_elements:
- confidential_elements_present: true
  confidentiality_details: Some component datasets are under temporary pre-publication embargo.
    The external data links for perturb-seq data in KOLF2.1J iPSCs and for perturb-seq data
    in MDA-MB-468 breast cancer cells are both marked embargoed rather than pointing to an
    open repository.
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: The release record states that the dataset does not involve human subjects,
    that samples are de-identified, and that the data are not FDA regulated. The project preprint
    states that CM4AI data are non-clinical, deriving from tissue cultures.
acquisition_methods:
- acquisition_details: 'Primary experimental measurement on cultured human cell lines: affinity
    purification mass spectrometry and size-exclusion chromatography mass spectrometry for
    protein-protein interactions, immunofluorescence confocal microscopy for spatial protein
    localization, and single-cell CRISPR perturbation screens for transcriptional and fitness
    phenotypes.'
  was_directly_observed: true
  was_reported_by_subjects: false
- acquisition_details: 'Derived processing of primary measurement: the KOLF2.1J perturbation
    cell atlas archive is distributed alongside a separate archive of the underlying raw sequence
    data, indicating that the atlas is a processed product of that raw data.'
  was_inferred_derived: true
  source_caveats: Inferred from the paired archive names cm4ai_perturb-seq_KOLF2_cell_atlas.zip
    and cm4ai_perturb-seq_KOLF2_raw_sra.zip; the June 2026 release listing carries no per-file
    processing description.
collection_mechanisms:
- mechanism_details: Affinity purification mass spectrometry (AP-MS) performed on endogenously
    tagged cell lines, for protein-protein interaction mapping.
- mechanism_details: Size-exclusion chromatography coupled to mass spectrometry (SEC-MS),
    for proteome-wide protein complex and interaction mapping.
- mechanism_details: Immunofluorescence-based staining and confocal microscopy (ICC-IF) for
    spatial proteomics, using the Human Protein Atlas resource of antibodies, with automated
    fixation and permeabilization protocols established for the MDA-MB-468 and KOLF2 cell
    lines.
- mechanism_details: Single-cell CRISPR interference perturbation screens, performed using
    the 10x Genomics 3'HT kit, with a CRISPR lentiviral library and cell lines expressing
    inducible dCas9.
collection_timeframes:
- timeframe_details: The release record gives a data creation date of 2025-02-27 and a deposit
    date of 2025-02-27. The funding award supporting data generation runs from 2022-09-01
    to 2026-08-31 per NIH RePORTER, and the release record states that the dataset will continue
    to be updated through the end of the project in November 2026. No explicit start and end
    dates for data collection are stated.
