distribution_formats:
- format: ZIP
  media_type: application/zip
  notes: All ten files are distributed as ZIP archives through the University of Virginia
    Dataverse. The dataset as a whole is too large to download as a single ZIP; individual
    files below the 1.9 GB web download limit may be selected from the files table, and the
    Dataverse Data Access API provides programmatic access. MD5 checksums are published for
    each archive.
