version: '2.0'
id: doi:10.18130/V3/HIGT4C
name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: 'The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI),
  the Functional Genomics Grand Challenge of the NIH Bridge2AI program. CM4AI generates multi-modal
  data — protein-protein interaction, spatial protein localization, and genetic perturbation
  — in MDA-MB-468 breast cancer cells (with or without paclitaxel or vorinostat) and in KOLF2.1J
  induced pluripotent stem cells (with or without differentiation). This release distributes
  ten ZIP archives through the University of Virginia Dataverse (LibraData) and comprises:
  perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment and for undifferentiated
  (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells with and without
  treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron progenitor cells, neurons
  and cardiomyocytes; AP-MS data for treated MDA-MB-468 breast cancer cells; and immunofluorescence
  images of MDA-MB-468 breast cancer cells with and without treatment. Corresponding raw mass
  spectrometry and sequence data are deposited in external repositories. The release is explicitly
  interim: computed cell maps are not included, and some component datasets remain under temporary
  pre-publication embargo.'
notes: Deposited to the University of Virginia Dataverse by Justin Niestroy, with a deposit
  date of 2025-02-27. The CM4AI project portal reports data holdings of 1,374 protein interactions,
  53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted
  and 21.4 TB of data volume. The CM4AI Dataverse collection carries the notice "This collection
  is under review for potential modification in compliance with Administration directives."
source_caveats: 'The CM4AI project portal lists this release under the heading "June 2026
  Data Release (Beta)" but gives "Released on: June 17, 2025"; the University of Virginia
  Dataverse record for the same DOI gives a Publication Date of 2026-06-17 and file publication
  dates of Jun 17, 2026. The Dataverse record is the higher-ranked source and its date is
  used here; the portal''s 2025 date is recorded as a conflict. The Dataverse description
  block for this release ends with a trailing "(2025-06-30)" stamp identical to that on the
  June 2025 and October 2025 releases, indicating description text carried forward between
  releases. Three immunofluorescence image archives carry a file publication date of Jul 15,
  2026, later than the 2026-06-17 publication date of version 2.0. Unlike the March 2025,
  June 2025 and October 2025 release pages, the June 2026 file listing carries no per-file
  descriptions, so modality and content detail for individual archives is drawn from the project
  preprint and from earlier release pages and is flagged as such where used. The Data Insights
  figures reproduced in `notes` are presented on the CM4AI project portal and on its Data
  Releases page without a stated scope; this record reads them as cumulative project-wide
  holdings across all CM4AI data streams rather than as counts for this release alone, but
  that reading is an inference and the portal does not state it.'
