purposes:
- response: To deliver machine-readable hierarchical maps of cell architecture as AI-Ready
    data, produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric and cardiac disorders, in disease-relevant
    cell lines under perturbed and unperturbed conditions.
- response: To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
    data collected for human cell lines, in order to enable transformative biomedical artificial
    intelligence research.
- response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning, creating a library of
    large-scale maps of cellular structure and function across demographic and disease contexts.
tasks:
- response: Interpretable genotype-phenotype learning, in which predictions are traced to
    multi-scale cell and tissue architecture rather than produced by an opaque model.
- response: Development of "visible" machine learning systems, including visible neural networks
    built directly on knowledge maps of cell and tissue architecture.
addressing_gaps:
- response: In genomics and precision medicine, machine learning models are often "black boxes"
    that predict phenotypes from genotypes without revealing the mechanisms by which such
    translation occurs. This dataset is intended to supply the matched data and tools needed
    to build "visible" machine learning systems built directly on knowledge maps of cell and
    tissue architecture.
- response: 'Existing biomedical datasets frequently lack the properties needed for reliable
    AI use. This project addresses that gap by defining and supplying AI-Ready data: FAIR
    data of known provenance, fully characterized and validated, with machine-readable provenance
    graphs of computations, data, software and models, explainable within stated limitations,
    and ethically obtained, licensed and distributed.'
