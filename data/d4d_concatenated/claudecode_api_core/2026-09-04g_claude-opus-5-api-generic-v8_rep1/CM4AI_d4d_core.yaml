raw_data_sources:
- source_description: MDA-MB-468 (RRID:CVCL_0419), a triple negative breast cancer cell line
    established from a metastatic site pleural effusion of a 51-year-old black female with
    a metastatic mammary adenocarcinoma. The line has been extensively used to study triple-negative
    breast cancer and is well characterized, with transcriptomic, mutational profile and whole-genome
    sequencing data available.
  source_type: Human cell line
  access_details: Available from ATCC.
- source_description: KOLF2.1J (RRID:CVCL_B5P3), an induced pluripotent stem cell line derived
    from a healthy male Northern European donor.
  source_type: Human induced pluripotent stem cell line
  access_details: Available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
    resource, and available for access by not-for-profit organizations via a simple MTA.
sampling_strategies:
- is_sample: true
  is_random: false
  strategies: Targeted selection of 100 chromatin modifiers and 100 metabolic enzymes implicated
    in cancer, neuropsychiatric and cardiac disorders, interrogated in disease-relevant cell
    lines under perturbed and unperturbed conditions. Perturb-seq of 200 genes in the triple-negative
    breast cancer cell line and immunofluorescence imaging of 523 proteins, per the CM4AI
    project portal's description of the flagship breast cancer dataset.
  source_caveats: The 200-gene and 523-protein figures are given on the CM4AI project portal's
    flagship-dataset panel as a description of the project's curated TNBC dataset generally;
    they are not stated for this release, whose file listing carries no gene or protein counts.
    The portal's figure of 523 proteins also conflicts with the October 2025 release page,
    which describes same-named immunofluorescence archives as showing 464 proteins of interest;
    neither figure is asserted here as the content of the June 2026 archives.
- is_sample: false
  strategies: Expressed genome-scale CRISPRi perturbation in undifferentiated KOLF2.1J iPSCs,
    covering 11,739 targeted genes rather than a sampled subset.
  source_caveats: The October 2025 release page describes the KOLF2.1J perturbation cell atlas
    as mapping transcriptional and fitness phenotypes associated with 11,739 targeted genes,
    and the project portal describes the iPSC perturb-seq component as covering more than
    11,000 genes at whole-genome scale, reporting 11,739 genes targeted. The is_sample value
    of false is this record's reading of "expressed genome-scale" and "whole-genome" as indicating
    comprehensive rather than sampled coverage; no source states in terms that the gene set
    is not a sample.
raw_sources:
- raw_data_details: Raw size-exclusion chromatography mass spectrometry data for KOLF2.1J
    iPSCs (undifferentiated, NPC, neuron and cardiomyocyte), deposited in the MassIVE repository
    and linked from the release record.
- raw_data_details: Raw size-exclusion chromatography mass spectrometry data for MDA-MB-468
    breast cancer cells with and without treatment, deposited in the MassIVE repository and
    linked from the release record.
- raw_data_details: Raw affinity purification mass spectrometry data for MDA-MB-468 breast
    cancer cells treated with paclitaxel, deposited in the MassIVE repository and linked from
    the release record.
- raw_data_details: Raw affinity purification mass spectrometry data for MDA-MB-468 breast
    cancer cells treated with vorinostat, deposited in the MassIVE repository and linked from
    the release record.
- raw_data_details: Raw sequence data underlying the KOLF2.1J CRISPRi perturbation screen,
    distributed in the release as cm4ai_perturb-seq_KOLF2_raw_sra.zip.
preprocessing_strategies:
- preprocessing_details: Perturb-seq data are distributed both as a processed CRISPRi perturbation
    cell atlas and as the underlying raw sequence data, in separate archives.
  source_caveats: Inferred from archive naming in the June 2026 file listing; that listing
    carries no per-file processing description. Computed cell maps, which the project produces
    by self-supervised multimodal embedding and multi-resolution community detection, are
    explicitly not included in this release.
