- id: c001
  status: nothing_relevant
  reason: Concatenation manifest and table of contents for the bundle. Lists source
    filenames, file counts and extensions but states no facts about the dataset.
- id: c002
  status: nothing_relevant
  reason: Opening of the Nature article "Multimodal cell maps as a foundation for
    structural and functional genomics", which reports a multimodal cell map of U2OS
    osteosarcoma cells. That map is a different dataset from the CM4AI data release
    described by this record, built in a different cell line, and the bundle states
    no relationship between them.
- id: c003
  status: nothing_relevant
  reason: Continuation of the Nature U2OS cell map article (map annotation, SEC-MS
    validation, structural modelling, tumour mutation analysis). Facts about that
    separate dataset.
- id: c004
  status: nothing_relevant
  reason: Methods of the Nature U2OS cell map article (AP-MS, IF imaging, SEC-MS collection
    and embedding procedures for U2OS cells). Facts about that separate dataset.
- id: c005
  status: nothing_relevant
  reason: Continuation of the Nature U2OS article methods and data availability, describing
    deposits and identifiers for the U2OS cell map rather than for the CM4AI release.
- id: c006
  status: nothing_relevant
  reason: Bibliography of the Nature U2OS cell map article.
- id: c007
  status: nothing_relevant
  reason: Continuation of the Nature U2OS article bibliography, acknowledgements and
    author affiliations for that study.
- id: c008
  status: nothing_relevant
  reason: Nature U2OS article author listings, competing interests and extended data
    figure legends; concerns that separate study.
