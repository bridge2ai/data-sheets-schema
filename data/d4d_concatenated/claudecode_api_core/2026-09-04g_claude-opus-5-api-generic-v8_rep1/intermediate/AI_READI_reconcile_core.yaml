conforms_to: The release is organized following the Clinical Dataset Structure (CDS) v0.1.1,
  with one directory per data type, then one per modality, then one per device, then one per
  participant. Data files follow the WaveForm DataBase (WFDB) format for electrocardiography,
  the Observational Medical Outcomes Partnership (OMOP) Common Data Model for clinical data,
  Digital Imaging and Communications in Medicine (DICOM) for retinal FLIO, OCT, OCTA and photography,
  Open mHealth for wearable activity and continuous glucose monitoring data, and the NASA
  ASCII File Format Guidelines for Earth Science Data for environmental sensor data. The release
  is additionally packaged as an RO-Crate whose ro-crate-metadata.json conforms to RO-Crate
  1.2-DRAFT and the FAIRscape profile 0.1, with one subcrate per data type.
