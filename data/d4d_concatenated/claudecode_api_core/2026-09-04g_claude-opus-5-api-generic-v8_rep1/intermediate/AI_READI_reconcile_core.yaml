license_and_use_terms:
  license_terms: The dataset is released under a custom license, the AI-READI Data License
    Agreement version 2.0 (Washington University in St. Louis as Licensor; https://doi.org/10.5281/zenodo.17555036),
    tailored to enable reuse of the AI-READI dataset and other clinical datasets for commercial
    or research purposes while imposing strong requirements around data usage, security and
    secondary sharing to protect study participants, especially when data is reused for AI
    and ML applications. It grants a non-exclusive, non-transferable license to download,
    reproduce and use the data and to create derivative works for research, commercial and
    non-commercial purposes. Licensees may store the data only on servers and devices maintained
    by and located within their institution or employer, or on cloud or remote storage and
    backup services covered by a HIPAA-approved Business Associate Agreement with that institution.
    Derivative and synthetic data derived from the data are themselves treated as data subject
    to the same restrictions. The license requires acknowledgement of the Licensor, the source
    and any funder in papers reporting use of the data, and compliance with NIH Genomic Data
    Sharing Policy security standards. It terminates automatically upon any breach by the
    licensee or an authorized user, after which all copies must be deleted and all use must
    cease. The data are provided "as is", without warranty of any kind.
  data_use_permission: disease_specific_research
ip_restrictions:
  restrictions:
  - Title to the data, and all industrial and intellectual property rights therein, remain
    solely and exclusively with the Licensor and its suppliers, and any rights not expressly
    granted in the license are reserved. Licensees are permitted to make, reproduce and distribute
    models, algorithms and programs developed, trained or adapted using the data provided
    those models do not themselves contain the data or any modified version of it, and provided
    that before dissemination the licensee undertakes all reasonable efforts to minimize the
    likelihood that data can be memorized, derived, reconstructed or reconstituted through
    their use or construction. The release carries the copyright notice "Copyright © 2026
    AI-READI". The healthsheet states that questions about third-party IP-based restrictions
    are answered by reference to the license.
regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - Licensees must comply with all data security and privacy standards established by the
    U.S. National Institutes of Health under its Genomic Data Sharing (GDS) Policy, currently
    the NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy,
    and with all applicable laws, regulations and restrictions relating to the distribution
    and use of the data and of models. Licensees acknowledge that the data may be statically
    watermarked to identify them for security purposes and agree to take no action to remove,
    obscure, alter or mask that watermarking. The healthsheet answers questions about export
    controls and other regulatory restrictions by referring to the license.
  other_compliance: The study is recorded as not FDA-regulated for either drug or device.
    The RO-Crate records a confidentiality level of "HL7:2N (normal)"; access to the release
    is gated by verified-ID login and license assent, which is why the confidentiality level
