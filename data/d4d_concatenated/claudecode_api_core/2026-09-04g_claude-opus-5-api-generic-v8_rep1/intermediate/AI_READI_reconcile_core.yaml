- name: Self-reported race and ethnicity
  subpopulation_elements_present: false
  identification: Self-reported race/ethnicity was used to balance recruitment but is not
    released as a participant-level variable in the public version of the dataset; the healthsheet
    answers "No" to whether the dataset identifies demographic sub-populations.
  distribution: Although the variable is not released per participant, the release summary
    table reports aggregate counts across the 2280 participants of 380 Hispanic, 545 Asian,
    519 Black and 836 White participants.
- name: Biological sex
  subpopulation_elements_present: false
  identification: Biological sex was used to balance recruitment and the recommended splits
    but is not released as a participant-level variable in the public version of the dataset.
  distribution: Although the variable is not released per participant, the release summary
    table reports aggregate counts of 951 male and 1329 female participants across the 2280
    participants.
- name: Diabetes status group
  subpopulation_elements_present: true
  identification: 'Participants were recruited into four study groups: no type 1 or type 2
    diabetes; pre-type 2 diabetes or type 2 diabetes controlled by lifestyle adjustments;
    type 2 diabetes controlled by oral or non-insulin injectable medications; and insulin-controlled
    type 2 diabetes.'
  distribution: 776 participants with no diabetes, 560 lifestyle-controlled, 686 controlled
