title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: The AI-READI flagship dataset is a multimodal, AI-ready dataset of type 2 diabetes
  mellitus (T2DM) collected from individuals with and without T2DM and harmonized across three
  data collection sites (University of Alabama at Birmingham, University of California San
  Diego, and University of Washington). Version 3.0.0 contains data from 2280 participants
  collected between July 19, 2023 and May 1, 2025; it comprises 356,343 files and is around
  3.82 TB in size. Modalities include survey and clinical data mapped to the OMOP Common Data
  Model, blood and urine laboratory results, physical measurements and vision testing, cognitive
  (MoCA) and monofilament testing, 12-lead electrocardiography, retinal photography, optical
  coherence tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging ophthalmoscopy
  (FLIO), continuous glucose monitoring, wearable activity monitoring, and home environmental
  sensor data; these encompass tabular data, imaging data and physiological signal/waveform
  data, and no unstructured text. Recruitment sampling aimed at an approximately equal distribution
  of participants across diabetes severity, sex and race/ethnicity so that the collection
  would support downstream AI/ML analyses of salutogenesis, the pathway from disease to health,
  in T2DM. Study visits lasted a single session of roughly 2.5-4 hours followed by 10 days
  of at-home monitoring. The released data contain no protected health information; information
  related to the sex and race/ethnicity of participants and to medications used has been removed
  from this public release.
notes: Both FAIRhub dataset pages and the AI-READI documentation site carry the notice "This
  repository is under review for potential modification in compliance with Administration
  directives."
source_caveats: 'Institutional attribution differs across sources. The FAIRhub metadata and
  the license name Washington University in St. Louis (ROR 01yc7t268) as managing organization,
  lead sponsor and Licensor, while NIH RePORTER records award OT2OD032644 to the University
  of Washington, and the healthsheet, the BMJ Open protocol and the IRB protocol place the
  reviewing IRB at the University of Washington; the RO-Crate labels the IRB "Washington University
  IRB" yet gives the University of Washington Human Subjects Division address and the hsdrely@uw.edu
  contact. Both tier-1 statements are reported rather than reconciled. License naming also
  differs between two tier-1 sources: the FAIRhub API records "AI-READI custom license v2.0"
  (https://doi.org/10.5281/zenodo.17555036) while the FAIRhub dataset page labels the license
  "Health Data License"; the API value was used. total_file_count and total_size_bytes are
  the values FAIRhub states; this record''s own sum of the nine data-type directory file counts
  is 356,334 (4,515 + 7 + 2,232 + 7,969 + 56,478 + 173,721 + 93,921 + 15,245 + 2,246), nine
  fewer than the stated 356,343, and the structure description lists exactly nine root-level
  metadata files; the same sum over directory sizes is 3,815,969,360,064 bytes, 419,614 bytes
  less than the stated 3,815,969,779,678. Collection start is 2023-07-19 in the FAIRhub metadata
  and healthsheet, while the BMJ Open protocol states enrollment began on 18 July 2023. FAIRhub
  records a de-identification type of "NoDeIdentification" (no identifiers were collected)
  while the RO-Crate records the release as deidentified and the Nature Metabolism comment
  describes HIPAA Safe Harbor stripping of the public set; all three statements are carried
  in is_deidentified. Variable-level detail is drawn from the BMJ Open protocol publication
  and the healthsheet device descriptions rather than from the released data dictionary; the
