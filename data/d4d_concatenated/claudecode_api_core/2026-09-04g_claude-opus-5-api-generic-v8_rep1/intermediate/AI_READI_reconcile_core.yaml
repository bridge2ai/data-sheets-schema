acquisition_methods:
- acquisition_details: Directly observable measurements taken during the study visit and the
    at-home monitoring period, including laboratory tests, vitals, physical measurements,
    vision and cognitive testing, electrocardiography, retinal imaging, continuous glucose
    monitoring, wearable activity monitoring and home environmental sensing.
  was_directly_observed: true
- acquisition_details: Participant-reported data, principally the pre-visit and in-visit questionnaires
    completed in REDCap. Verification of data entry was performed when possible, for example
    by cross- referencing entered medications with medications that were physically brought
    in or photographed by each study participant.
  was_reported_by_subjects: true
  was_validated_verified: true
collection_mechanisms:
- mechanism_details: REDCap was used to collect patient-reported questionnaire data and clinical
    data from the visit, including the medications assessment, vitals, visual acuity, contrast
    sensitivity, monofilament test results and complete blood count results; the exact forms
    used for data collection in REDCap are published with the documentation.
- mechanism_details: Standardized questionnaires administered through REDCap, including a
    screening questionnaire, demographic information, the Center for Epidemiological Studies
    Depression Scale (CES-D-10), Problem Areas in Diabetes (PAID-5), a diabetes self-care
    score, a dietary assessment, an ophthalmic/visual impairment and eye care survey, smoking,
    alcohol, vaping and marijuana use history (marijuana not assessed in Alabama), a general
    health history, PhenX social determinants of health surveys, and a current medications
    log with RxNorm codes.
- mechanism_details: 12-lead electrocardiography with the Philips PageWriter TC30 Cardiograph,
    performed with the participant reclining or supine and the chair position recorded.
- mechanism_details: 'Blood pressure and heart rate measured twice with automatic oscillometric
    devices: OMRON HEM 907XL, Medline MDS4001 Automatic Digital Blood Pressure Monitor, or
    Welch Allyn 6000 series vital signs monitor with a FlexiPort reusable cuff.'
- mechanism_details: 10 g monofilament testing of touch perception at three locations on each
    foot for peripheral neuropathy, with results recorded on an iPad, laptop or paper questionnaire
    and entered into REDCap.
- mechanism_details: Montreal Cognitive Assessment (MoCA) administered electronically on an
    iPad using the MoCA Duo application, capturing the total score, section subscores, Memory
    Index Score and task completion times.
- mechanism_details: Visual acuity measured with the M&S Technologies Electronic Visual Acuity
    (EVA) tester at 4 meters under photopic conditions and under mesopic conditions using
    a 2.0 neutral density filter, each eye separately and best corrected.
- mechanism_details: Letter contrast sensitivity measured with the MARS Letter Contrast Sensitivity
    test (Perceptrix) monocularly under photopic and mesopic (neutral density occluder) conditions.
- mechanism_details: Autorefraction with the Topcon KR 800 auto keratometer/refractor, and
    lensometry with the NIDEK LM-600P, Topcon CL-200 or Topcon CL-300 lensometers.
- mechanism_details: Undilated handheld color fundus photography with the Optomed Aurora IQ,
    a non-mydriatic handheld camera with a 50 degree field of view and 5 Mpix sensor.
- mechanism_details: Dilated widefield TrueColor confocal fundus imaging with the iCare EIDON,
    in fully automated mode, capturing single-field central infrared and fundus autofluorescence
    images and a smart horizontal mosaic.
- mechanism_details: Optical coherence tomography and OCT angiography with the Heidelberg
    Spectralis HRA+OCT using the ONH-RC, PPole-H and macular OCTA protocols.
- mechanism_details: Fluorescence lifetime imaging ophthalmoscopy with the Heidelberg FLIO,
    macula-centered, acquired last in the visit.
- mechanism_details: Swept-source OCT and OCTA with the Topcon DRI OCT Triton, using 12.0
    x 12.0 mm and 6.0 x 6.0 mm OCTA and 12.0 x 9.0 x 6.0 mm 3D horizontal and radial scan
    modes.
- mechanism_details: OCT, OCTA and color fundus photography with the Topcon Maestro2 3D OCT-1
    robotic system, using 12.0 x 9.0 mm widefield, 6.0 x 6.0 mm 3D macula and 6.0 x 6.0 mm
    OCTA (50 kHz) protocols.
- mechanism_details: OCT and OCTA with the Zeiss Cirrus 5000 Angioplex, using 512 x 512 and
    200 x 200 macula and optic nerve head scans and macular OCTA.
- mechanism_details: Dexcom G6 real-time integrated continuous glucose monitoring system,
    worn continuously for 10 days after the visit, capturing readings every five minutes;
    participants were masked to the results during the monitoring period.
- mechanism_details: Garmin Vivosmart 5 fitness activity tracker, worn for 10 consecutive
    days on the participant's chosen wrist, with the wrist worn and the dominant hand recorded
    on a returned data sheet; sampling frequency 5 seconds.
- mechanism_details: LeeLab Anura, an environmental sensor unit custom designed for the AI-READI
    project at the Karalis Johnson Retina Center, University of Washington, placed in a frequently
    used area of the participant's home for 10 days; the placement location was recorded on
    return.
- mechanism_details: Non-fasting blood and urine collection during the visit, with complete
    blood counts run by Clinical Laboratory Improvement Amendments-certified laboratories
    local to each data collection site and all other assays performed by the University of
    Washington Nutrition and Obesity Research Center testing facility on stored frozen samples.
collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: Version 3.0.0 covers data collected from July 19, 2023 to May 1, 2025,
    that is through the end of the second full year of the study. The overall project timeline
    spans four years, one year for protocol development and training and years 2-4 for subject
    recruitment and data collection; the study start date is recorded as 2023-07-19 (actual)
    with an anticipated completion date of 2027-01-01, and the overall status is "Enrolling
    by invitation".
  source_caveats: Sources disagree on the enrollment start date. The tier-1 FAIRhub metadata
    and the tier-2 healthsheet both give July 19, 2023, while the tier-3 BMJ Open protocol
    publication states that enrollment began on 18 July 2023 and will continue until 30 November
    2026. The higher-ranked value, 2023-07-19, was used.
data_collectors:
- role: Clinical research coordinators and research staff
  collector_details: Research personnel at the three data sites who recruited, enrolled and
    collected data underwent training by the data manager at the University of Alabama at
    Birmingham and worked from a detailed Manual of Procedures; a certification process was
    required of all coordinators, including mandatory institutional compliance training for
    human subject research and successful administration of all protocol elements to at least
    three volunteer practice subjects.
- role: Site data managers
  collector_details: Data managers at each site oversaw the data collection process and were
    responsible for the quality control of all data before uploading to FAIRhub.
- role: Central project team
  collector_details: Once data were sent from each of the study sites to the central project
    team, additional processing steps were conducted in preparation for dissemination.
  notes: Effort of the team members involved in data collection was supported by NIH award
    OT2OD032644 based on the percentage of effort contributed, with salaries aligned to the
    funding guidelines at each site.
missing_data_documentation:
- missing_data_patterns: Not all modalities are available for all participants; within survey
    data, skipped questions and incomplete responses occur. Sex, race, ethnicity and medications
    used are absent for every participant in this release, having been removed before publication.
  missing_data_causes: Some participants elected not to participate in some study elements.
    In a few cases the data collection device did not have any stored results or was returned
    too late to retrieve the results, for example because the battery died and data was lost.
    In a few cases there may have been a data collision at some point in the process and data
    has been lost. Wearable data are additionally affected by improper use and by technical
    failure such as battery failure or system malfunction, and the Garmin Vivosmart 5 had
    to be recharged every 2-3 days, leaving gaps. Imaging data are affected by patient uncooperation,
    image noise, system malfunction and data transfer failures, and manually operated devices
    sometimes led to a modality being skipped.
  handling_strategy: Missing data that could be directly filled from other portions of an
    individual's record were filled during data cleaning under the guidance and approval of
    the site principal investigator; where there was no logical or appropriate way to correct
    a value, the site principal investigator decided whether the value should be removed.
    No imputation of missing modality data is described, and no instances were excluded at
    the time of preprocessing.
raw_data_sources:
- source_description: Electronic health records at the three recruiting sites, screened for
    ICD-10 diabetes and prediabetes diagnosis codes and demographic data to identify recruitment
    pools.
  source_type: Electronic health records
  access_details: Used for recruitment screening only; not released as part of the dataset.
- source_description: 'Device-native exports written to local storage before standardization:
    ECG in .xml, MoCA Duo application output in .csv, retinal imaging in DICOM or in vendor
    formats (.fda for Topcon Maestro2 and Triton, .sdt for FLIO) later converted to DICOM,
    Garmin fitness tracker data in .FIT later converted to the Open mHealth standard, and
    Dexcom CGM and environmental sensor data in .csv.'
  raw_data_format: .xml, .csv, .fda, .sdt, .FIT, DICOM
  access_details: The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but is not anticipated to be shared outside
    the project team at present because it has not been mapped to standardized terminologies
    and may accidentally include personal health information or personally identifiable information,
    for example in free text fields; there is a possibility that raw data may be included
    in future releases of the controlled access dataset.
sampling_strategies:
- is_sample: false
  is_random: false
  is_representative: false
  strategies: Non-probability sampling. A contact pool was identified for each recruitment
    wave by screening electronic health records at each site using ICD-10 codes (R73.09 for
    pre-diabetes and E11.X for T2DM) and demographic data; invitations were mailed and emailed
    with personalized links into an online REDCap recruitment interface. Recruitment proceeded
    in waves whose composition and size were influenced by the observed participation characteristics
    of race/ethnicity, gender, severity of T2DM and site, with under- and oversampling of
    groups as needed.
  source_data: All patients aged 40 years or older who had a medical encounter within each
    health system site (University of Alabama at Birmingham, University of California San
    Diego, University of Washington).
  why_not_representative: Rather than targeting the demographic distribution of the US population,
    the study is triple-balanced by recruiting four race/ethnic groups (Asian, black, white,
    Hispanic), four categories of T2DM severity and biological males and females in equal
    proportions, because building balanced datasets is critical for the development of unbiased
    machine learning models.
  notes: The healthsheet states that the dataset contains all possible instances, that is
    data from all participants enrolled by the data cut-off, and answers "N/A" to the question
    about sampling strategy for a sample of a larger set; the study itself is recorded as
    a non-probability sample of the health-system population described above.
preprocessing_strategies:
- preprocessing_details: After data were sent from the study sites to the central project
    team, all data were mapped to standardized terminologies where possible, including the
    Observational Medical Outcomes Partnership (OMOP) Common Data Model for clinical data
    and DICOM for medical imaging; proprietary device exports were transformed into standard
    model formats before upload to FAIRhub, with Topcon .fda and FLIO .sdt files converted
    to DICOM and Garmin .FIT files converted to the Open mHealth standard. Processing for
    this release combined automated and custom steps, in contrast with the custom/ad hoc processing
    of version 1.0.0.
- preprocessing_details: No instances were excluded at the time of preprocessing; exclusions
    arise only from the study eligibility criteria (age 40 or older, able to consent, able
    to read and speak English, not pregnant, no gestational diabetes, no type 1 diabetes).
cleaning_strategies:
- cleaning_details: 'Quality control measures were applied at the time of data entry and acquisition:
    clinical data outside expected minimum/maximum ranges were flagged in REDCap and surfaced
    in reports viewed by clinical research coordinators and data managers, who examined participant
    records to determine whether an error was likely. Data were checked, and edited where
    errors were detected, for credibility against prespecified reasonable ranges, incorrect
    flow through prescribed skip patterns, missing data that could be filled directly from
    other portions of an individual''s record, and the omission or duplication of records.
    Editing was done only under the guidance and approval of the site principal investigator;
    where there was no logical or appropriate way to correct a value, the site PI decided
    whether it should be removed.'
other_tasks:
- task_details: The dataset is hypothesis agnostic and carries no labels, so it is intended
    to facilitate multiple potential downstream AI/ML applications beyond those the creators
    planned; researchers may define their own tasks and labels, for which the project provides
    no formal guidelines.
future_use_impacts:
- impact_details: The creators do not currently anticipate uses of the dataset that could
    result in unfair treatment of individuals or groups or other harms, but note a theoretical
    risk of future re-identification. AI algorithms can infer individual patient characteristics
    and could facilitate individual-level identification, which the project addresses with
    a data dissemination system, a strict license agreement and data watermarking for both
    the public and the controlled sets.
intended_uses:
- use_category: Type 2 diabetes research
  usage_notes: Access requires agreeing to use the data only for type 2 diabetes related research;
    FAIRhub records the dataset consent as permitting the public version to be used only for
    type 2 diabetes related research, with a private version allowing more generic use.
- use_category: Research and commercial artificial intelligence and machine learning development
  usage_notes: The license grants a non-exclusive, non-transferable right to download, reproduce
    and use the data and to create derivative works for research, commercial and non-commercial
    purposes; it was specifically tailored to enable reuse for commercial or research purposes
    while imposing strong requirements around data usage, security and secondary sharing to
    protect participants.
  examples:
  - Licensees may make, reproduce and distribute models, algorithms and programs developed,
    trained or adapted using the data, provided those models do not themselves contain the
    data.
prohibited_uses:
- prohibition_reason: Making clinical treatment decisions based on the data is not permitted;
    the data are intended solely as a research resource.
- prohibition_reason: Using or attempting to use the data, alone or with other information,
    to compromise the confidentiality or privacy of a data subject, to identify or contact
    any data subject or group of data subjects, to extract or extrapolate identifying information,
    to establish a data subject's membership in a particular group, or otherwise to cause
    harm or injury to a data subject is not permitted, in order to protect study participants
    under the license agreement.
- prohibition_reason: Sharing or distributing the data with any third-party model vendor or
    developer for training or development purposes, including model weight modification or
    other adjustment of a model's logic or operation, is not permitted even where the vendor
    is party to a HIPAA Business Associate Agreement with the licensee's institution; this
    prevents memorization or reconstruction of participant data by third-party models. Only
    short-term interaction such as prompting or querying by a BAA-covered model vendor is
    allowed.
- prohibition_reason: Transferring, licensing, sublicensing, selling, assigning, displaying,
    sharing or otherwise conveying any portion of the data or any derivative work to a third
    party that is not itself a licensee bound by an identical agreement is not permitted;
    this is the secondary-sharing control required to protect study participants.
- prohibition_reason: Reproducing data in papers, articles, presentations, analyses, reports
    or publications beyond small representative samples in up to five images or figures per
    paper is not permitted, and larger amounts of data shall not be published, posted or otherwise
    made available via supplemental files, zip archives, code packages or other means.
- prohibition_reason: Removing, obscuring, altering or masking the static watermarking that
    may be applied to identify the licensee is not permitted; the watermarking is a security
    measure supporting traceability of released copies.
distribution_formats:
- format: DICOM
  media_type: application/dicom
  description: Retinal imaging data (FLIO, OCT, OCTA and retinal photography) are distributed
