instances:
- instance_type: Individual study participant
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: No labels or targets are provided. No specific labeling was performed,
    as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential
    downstream AI/ML applications; no annotation software or annotator information applies.
  notes: Each instance consists of all of the data available for an individual participating
    in the study, across survey, clinical, retinal imaging, environmental sensor, continuous
    glucose monitor and wearable activity monitor modalities.
  missing_information:
  - missing: Data for one or more modalities for some participants
    why_missing:
    - Some participants elected not to participate in some study elements; in a few cases
      the data collection device had no stored results or was returned too late to retrieve
      them (for example the battery died and data was lost); in a few cases a data collision
      occurred at some point in the process and data was lost.
  - missing: Participant sex, race, ethnicity and medications used
    why_missing:
    - Removed from this public release; the release documentation states that these variables,
      together with 5-digit zip code, genetic sequencing data, past health records and traffic
      and accident reports, are not included in the public dataset.
anomalies:
- anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: In wearable data, improper use and technical failure such as battery failure
    or system malfunction are expected. The Garmin Vivosmart 5 had to be charged every 2-3
    days, so there are gaps in activity data collection.
- anomaly_details: In imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are expected.
- anomaly_details: Undilated handheld fundus photography with the Optomed Aurora is challenging
    because the pupil is not dilated and the camera is handheld, so image quality varies from
    patient to patient and within the same patient.
- anomaly_details: FLIO acquisition takes longer than a standard Spectralis OCT and exposes
    participants to uncomfortable levels of light, so it is performed last in the visit and
    participants may not be at their best possible compliance; the device cannot tolerate
    more than one centimeter of movement during acquisition.
- anomaly_details: Devices operated manually rather than automatically (for example the Heidelberg
    Spectralis) can raise quality issues that led to skipping a modality and missing data.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias which may limit the generalizability of the results among those who are not represented
    in the study population.
- bias_type: representation_bias
  bias_description: While the cross-sectional database ultimately aims to achieve balance
    across race/ethnicity, biological sex, and diabetes presence and severity, the pilot phase
    is not balanced across these parameters, and enrollment is ongoing so periodic releases
    may not have achieved balanced distribution across groups. The cohort does not include
    other races/ethnicities such as Pacific Islanders and Native Americans.
  mitigation_strategy: Triple-balanced recruitment targets for race/ethnicity, diabetes severity
    and biological sex, with under- and oversampling of groups as recruitment progresses;
    three geographically distinct recording sites recruiting individuals from all demographic
    backgrounds; recommended training/validation/test splits balanced for sex, race/ethnicity
    and diabetes status.
- bias_type: sampling_bias
  bias_description: Recruitment is predominantly urban and hospital-based, drawn from patients
    with an encounter in each site's health system, which may not fully capture all possible
    cultural and socioeconomic backgrounds.
  mitigation_strategy: Uniform data collection protocols were implemented for all subjects
    irrespective of their race/ethnicity, biological sex, or diabetes severity, across all
    study sites, and the selection of study sites was intended to ensure varied representation
    and minimize the potential for sampling bias.
- bias_type: selection_bias
  bias_description: Requiring that eligible participants speak, read and understand English
    may have created challenges in recruiting Hispanic and/or Asian persons; non-English-speaking
    participants were not initially enrolled because translating all study materials was not
    feasible.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: 'The study cohort may not provide a comprehensive representation
    of the population: recruitment is predominantly urban and hospital-based and the cohort
    does not include races/ethnicities such as Pacific Islanders and Native Americans.'
  scope_impact: Models derived from the dataset may not generalize to populations, settings
    or cultural and socioeconomic backgrounds that the three recruiting health systems do
    not reach.
- limitation_type: coverage_limitation
  limitation_description: Not all modalities are available for all participants, because some
    participants declined some study elements and some device data were lost or unretrievable.
- limitation_type: scope_limitation
  limitation_description: 'This public release excludes sensitive personal health data: 5-digit
    zip code, sex, race, ethnicity, genetic sequencing data, past health records, medications,
    and traffic and accident reports are not included, and the raw, pre-standardization data
    are not shared.'
- limitation_type: temporal_limitation
  limitation_description: The design is cross-sectional with currently one visit per participant;
    only about 10% of the cohort is planned to return for a follow-up visit in year 4 of the
    project, so longitudinal trajectories cannot be observed within this release.
- limitation_type: methodological_limitation
  limitation_description: Multiple imaging devices were deliberately used for one measure
    to represent the broad range of equipment in clinical settings, so device make, model
    and scan protocol differ across participants and must be accounted for; device and modality
    information is documented to support repeatability.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The dataset does not contain data that might be considered confidential,
    and no personally identifiable information is included in the dataset.
