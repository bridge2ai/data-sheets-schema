purposes:
- response: To enable future generations of artificial intelligence/machine learning (AI/ML)
    research to provide critical insights into type 2 diabetes mellitus (T2DM), including
    salutogenic pathways to return to health.
- response: To collect and publicly share a multimodal, AI-ready dataset for studying the
    pathogenesis and salutogenesis of T2DM, uniformly balanced for T2DM severity across a
    diverse group of participants recruited at three geographically distinct sites.
- response: To develop a foundational dataset in T2DM, agnostic to existing classification
    criteria or biases, that can be used to reconstruct a temporal atlas of T2DM development
    and reversal towards health.
- response: To create a model for developing large scalable datasets, sharing a blueprint
    that future data generation projects can follow for collecting and sharing AI-ready datasets.
tasks:
- response: Downstream pseudo-time manifold analysis, an approach used to predict disease
    trajectories by collecting and learning from complex, multimodal data from participants
    with differing disease severity (normal to insulin-dependent T2DM).
- response: Development of AI/ML models of salutogenesis in type 2 diabetes, and of multimodal
    models over survey, clinical, imaging, waveform, wearable and environmental data.
addressing_gaps:
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large, and inclusive
    multimodal datasets.
- response: A major barrier has been the lack of diverse datasets that are AI ready for training
    AI models; the AI-READI dataset is intended to fill this gap.
- response: Existing large datasets for AI/ML training have inherent limitations of demographic
    imbalance; a meta-epidemiological review of T2DM studies published from 2000 to 2020 found
    that samples lacked racial and ethnic diversity, and this collection is an important step
    forward in addressing those demographic inequities in research.
