id: doi:10.13026/8xbn-nq66
name: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
version: "3.1.0"
description: >-
  The adult flagship release of the Voice project (the Bridge2AI Precision Public Health Grand
  Challenge): an ethically sourced, demographically diverse collection of data derived from voice
  recordings and linked to clinical and questionnaire information. Version 3.1.0 covers 833
  participants recruited at five sites in North America. Participants were selected on the basis of
  conditions known to manifest within the voice waveform, organized into disease cohort categories
  covering voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders, and respiratory disorders, together with control participants; a pediatric voice and
  speech cohort was collected under the same program and is published as a separate dataset.
  Each participant completed a standardized protocol of acoustic tasks (sustained phonation,
  glides, loudness, diadochokinesis, breathing and cough sounds, read passages, free speech and
  cognitive-linguistic tasks) recorded on a tablet application, alongside demographic questions,
  confounder questions, disease-specific items and validated patient-reported outcome instruments.
  Diagnoses were validated against established gold standards by a clinician at the site of
  collection or from the electronic health record.
  This release contains only material judged low risk. Original audio waveforms are not
  distributed here; instead the release provides derived representations in Parquet form
  (spectrograms, Mel spectrograms, MFCCs, pitch traces, articulatory estimates from Speech
  Articulatory Coding, loudness and periodicity, and phonetic posteriorgrams), static acoustic
  features from openSMILE, Praat/Parselmouth and torchaudio, audio quality metrics, per-recording
  metadata, and a phenotype directory of tab-delimited tables with JSON data dictionaries covering
  confounders, demographics, per-condition diagnosis forms, enrollment, validated questionnaires
  and task records. Access is by PhysioNet credentialing plus signature of the Bridge2AI Voice
  Registered Access Agreement; raw audio is obtainable only through a separate controlled-access
  route administered by the project's Data Access Compliance Office.
