purposes:
  - response: >-
      To address a gap in the availability of large-scale, diverse and well-documented voice data
      for use in clinical machine-learning applications, providing an ethically sourced dataset on
      which clinically applicable AI/ML models can be developed, benchmarked or validated.
  - response: >-
      To generate a large multi-institutional, ethically sourced and diverse voice dataset linked
      to multimodal health biomarkers, so that voice can be integrated as a biomarker of health in
      clinical care for screening, diagnosis and treatment of a broad range of diseases.
  - response: >-
      To create an ethically sourced flagship dataset enabling future research in artificial
      intelligence and supporting critical insights into the use of voice as a biomarker of health.

addressing_gaps:
  - response: >-
      Existing work on machine-learning voice diagnosis had been limited to small- to medium-sized
      datasets, or lacked the key clinical metadata needed to train robust, clinically useful
      models. Realizing voice as a biomarker requires large datasets capturing diverse populations
      and disease statuses alongside other established physiologic biomarkers.
  - response: >-
      Comparing studies and pooling voice data has been difficult because of the absence of
      standards for how voice and other acoustic data are measured and collected; the project
      pairs the dataset with new acquisition protocols and bioinformatics standards.
  - response: >-
      Industry holds large volumes of user voice data but lacks accurate clinical or demographic
      information, which prevents annotation for AI training, comparison against gold-standard
      medical assessment and external auditing for fair representation of diverse populations.
      A publicly documented, clinically validated dataset fills that gap.

tasks:
  - response: >-
      Training machine-learning models for disease detection and classification from voice, with
      labels drawn from diagnostic categories including vocal pathologies, neurological disorders,
      psychiatric conditions and respiratory disorders.
  - response: >-
      Supporting clinical research in disease screening, diagnosis and monitoring through voice
      biomarkers.

other_tasks:
  - task_details: >-
      Beyond disease classification, the release supports AI model pretraining, fine-tuning,
      benchmarking and external validation.
  - task_details: >-
      The phenotype tables, distributed with per-condition diagnosis files and validated
      questionnaire responses, can be used for cohort selection independently of the acoustic
      features.

intended_uses:
  - use_category: "research"
    examples:
      - "Development of AI and machine-learning models for healthcare using voice biomarkers"
      - "Benchmarking or external validation of clinically applicable voice models"
      - "Pretraining and fine-tuning of acoustic models on health-linked speech"
    usage_notes: >-
      The dataset is intended solely for commercial and non-commercial research purposes by
      Authorized Researchers under the Registered Access Agreement. Where a downstream researcher
      creates new labels, the process should be described alongside any release of a model or
      publication, including the exact variables used for the determination.

discouraged_uses:
  - discouragement_details: >-
      Non-research applications such as hiring decisions, insurance premium adjustments, or any
      form of surveillance that could lead to discrimination or harm are discouraged, in order to
      prevent unethical or biased outcomes that could negatively affect individuals on the basis of
      their health conditions or voice characteristics.
  - discouragement_details: >-
      Users should not treat the sample as representative. The dataset carries skews by disorder
      category, site and demographic factors, and the multivariate distribution should be assessed
      before judging utility for any given question.

prohibited_uses:
  - prohibition_reason: >-
      The Registered Access Agreement forbids attempting to re-identify research participants, or
      any action that could reasonably lead to re-identification.
  - prohibition_reason: >-
      The Registered Access Agreement forbids any purpose that could foreseeably cause harm or
      stigmatization to research participants, their families, communities, or specific
      populations.
  - prohibition_reason: >-
      Intellectual property protections, database rights or related rights may not be used in a
      manner that restricts or limits access to any part of the dataset or to conclusions derived
      from it, so that future use remains unrestricted in line with the consortium's Open Science
      commitments.

existing_uses:
  - examples:
      - >-
        A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer
        School and hackathon.

future_use_impacts:
  - impact_details: >-
      The dataset has skews based on disorder category, site and other demographic factors. Users
      should consider the multivariate distribution when assessing utility for different questions,
      since models trained without accounting for these skews risk unfair treatment of groups.
  - impact_details: >-
      Diagnostic practice and criteria may shift over time, and participants were screened for
      different disorders at different sites using different devices, so label and device
      confounding may propagate into downstream models.

