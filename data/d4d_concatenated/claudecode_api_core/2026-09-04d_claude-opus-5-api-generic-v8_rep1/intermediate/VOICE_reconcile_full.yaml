subpopulations:
  - subpopulation_elements_present: true
    identification: "Age, Gender, Sex, Ethnicity, Socioeconomic status"
    source_caveats: >-
      The bundle names the demographic attributes by which subpopulations can be identified but
      gives no distribution figures for them, so the distribution field is left unpopulated. The
      statement that the release does not contain an equal distribution refers to the disease
      cohort categories rather than to these demographic subpopulations.

relationships:
  - relationship_details: >-
      Relationships between individual participant instances are not made explicit; the healthsheet
      states that instances are unrelated.
  - relationship_details: >-
      For most participants a single session sufficed to collect all relevant data, but a subset
      required multiple sessions, so a participant may appear in more than one session and more
      than one row of a phenotype table, and responses for the same data element may vary across
      that participant's rows.

splits:
  - split_details: >-
      No predefined recommended data splits for training, validation or testing are provided.
      Researchers are encouraged to create their own splits based on their specific requirements.

subsets:
  - id: doi:10.13026/8xbn-nq66#subset-voice-disorders
    name: "Voice Disorders cohort"
    is_subpopulation: true
    description: >-
      Participants with laryngeal disorders, in which benign and malignant lesions can affect the
      shape, mass, density and tension of the vocal folds and so alter phonation. Conditions
      enumerated in the protocol include laryngeal cancer, laryngitis, pre-cancerous lesions,
      benign lesions of the vocal cord, muscle tension dysphonia, spasmodic dysphonia and laryngeal
      tremor, unilateral vocal fold paralysis, and glottic insufficiency or presbyphonia. Gold
      standard validation is by laryngoscopy images and stroboscopy videos, with CT and spirometry
      for selected conditions.
  - id: doi:10.13026/8xbn-nq66#subset-respiratory
    name: "Respiratory Disorders cohort"
    is_subpopulation: true
    description: >-
      Participants with respiratory conditions, covering airway stenosis at supraglottic, glottic,
      posterior glottic, subglottic, tracheal and multi-level sites together with bilateral vocal
      fold paralysis, and unexplained chronic cough of more than eight weeks. Gold standard
      validation is by spirometry and flow volume loops, with CT of the neck and chest for stenosis.
  - id: doi:10.13026/8xbn-nq66#subset-neurological
    name: "Neurological and Neurodegenerative Disorders cohort"
    is_subpopulation: true
    description: >-
      Participants aged 44 to 85 with a clinical diagnosis of mild cognitive impairment,
      Alzheimer's disease, other dementias, amyotrophic lateral sclerosis, or Parkinson's disease
      and related parkinsonian syndromes. Gold standard validation is by brain CT and MRI, with
      serum p-tau markers for Alzheimer's disease and whole genome sequencing across the cohort.
  - id: doi:10.13026/8xbn-nq66#subset-mood-psychiatric
    name: "Mood and Psychiatric Disorders cohort"
    is_subpopulation: true
    description: >-
      Participants with an existing clinical diagnosis of anxiety disorder, bipolar disorder, or
      depression or major depressive disorder, together with comorbid conditions including alcohol
      or substance use disorder, ADHD, autism spectrum disorder, borderline personality disorder,
      eating disorder, insomnia or sleep disorder, obsessive-compulsive disorder, panic disorder,
      post-traumatic stress disorder, schizophrenia and social anxiety disorder. Validation is by
      electronic health summary, clinical diagnosis from a psychiatrist, and medication history.
  - id: doi:10.13026/8xbn-nq66#subset-controls
    name: "Controls"
    is_subpopulation: true
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, mood or neurological disorder
      affecting voice, cough, breath or speech, recruited to serve as controls in the dataset. The
      released phenotype directory carries a dedicated control diagnosis table.
    source_caveats: >-
      The project identifies five disease cohort categories, the fifth being Pediatric Voice and
      Speech Disorders. That cohort was collected at the Hospital for Sick Children and is
      published as a separate dataset rather than as a subset of this release, so it is recorded
      under related_datasets and not here.

anomalies:
  - anomaly_details: >-
      Different sites used different collection configurations, and the collection protocol changed
      over the course of the study.
  - anomaly_details: >-
      Noise artifacts, variations in diagnostic practices, inaccurate questionnaire responses and
      underreporting are identified as confounding factors present in the data.
  - anomaly_details: >-
      Recordings were made with a head-mounted headset whose microphone could sit at slightly
      different distances from the speaker.
  - anomaly_details: >-
      Some files, whether because of length or other issues, could not generate certain features
      and are therefore absent from the corresponding bundled feature file, so per-feature record
      counts differ.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Groups with less trust in the medical system or in AI, or who are less proximal to the
      collection sites, would have been less likely to be recruited.
    mitigation_strategy: >-
      The project states an intention to shift to remote collection and to design recruitment so as
      to control for more variables.
  - bias_type: sampling_bias
    bias_description: >-
      The sample is drawn from a limited number of geographic locations, with five recording sites
      in the United States and Canada, and is therefore not representative of the larger population
      from which it is drawn.
  - bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders depending on the site, so participants
      with different conditions had their data collected on different devices; device and condition
      are therefore confounded.
  - bias_type: representation_bias
    bias_description: >-
      The public releases do not contain an equal distribution of the disease cohort categories,
      and the dataset carries skews by disorder category, site and demographic factors.
  - bias_type: annotation_bias
    bias_description: >-
      Diagnostic labels were assigned by a single labeler per instance, typically the clinician at
      the site of data collection or the clinician responsible for a prior diagnostic assessment,
      so no inter-annotator agreement can be computed and site-level clinical practice enters the
      labels directly.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample of a larger, ongoing collection and is not representative, because it
      was collected at a limited number of geographic locations.
    recommended_mitigation: >-
      Assess the multivariate distribution of disorder category, site and demographics before
      treating results as generalizable.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Participants had to read and speak English; Spanish protocols and data collection were under
      development and are not part of this release.
    scope_impact: >-
      Findings and models derived from the release may not transfer to speakers of other languages.
  - limitation_type: scope_limitation
    limitation_description: >-
      The public release contains derived features rather than the original voice recordings, and
      spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and articulatory estimates
      derived from free-speech and open-response prompts, and from audio checks, were withheld.
    recommended_mitigation: >-
      Investigators requiring waveforms must apply for controlled access to the raw audio.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Changes in diagnostic criteria or practices over the collection period could be a source of
      distribution shift within the dataset.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Certain derived elements, notably transcription, were generated using off-the-shelf models
      that have not been audited for correctness, and human-level performance on the applications
      the dataset addresses varies widely.
  - limitation_type: integration_limitation
    limitation_description: >-
      Multimodal data extracted from site systems, including imaging, laryngoscopy and genomic
      data, is not included in this release.

missing_data_documentation:
  - missing_data_patterns: >-
      Phenotype data files contain a row for a participant only where at least one column is
      non-missing, so absence of a row indicates that no element of that instrument was recorded
      for that participant. Because each participant answered a common core plus items specific to
      their primary diagnostic category, condition-specific tables are sparse by design.
    missing_data_causes: >-
      Some questions in the protocol are optional, and data collection irregularities caused some
      information to be missing from individual instances.
    handling_strategy: >-
      The data release team generated missingness tables as part of the internal audit and
      distributes a missingness table with the dataset; no imputation is applied.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes race and ethnicity information, sexual orientation information, and
      socioeconomic and health information. Non-identifying elements revealing highly sensitive
      information, such as household income, mental health status and traumatic life experiences,
      were removed before release, as were all data elements encoded as sensitive in the project's
      REDCap data dictionary.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet records that the dataset does not contain data protected by legal privilege
      or doctor-patient confidentiality, nor the content of individuals' non-public communications.

content_warnings:
  - content_warnings_present: true
    warnings:
    - >-
      Free-speech and open-response prompts could in principle contain distressing or identifying
      material, since participants are responsible for their own choice of language. To manage
      this, transcriptions, spectrograms, Mel spectrograms, MFCCs, articulatory estimates and
      phonetic posteriorgrams derived from open-response and free-speech prompts were removed from
      the feature-only release, and raw audio transcripts were reviewed so that recordings
      containing potentially identifying information or external voices were excluded.
    source_caveats: >-
      The project documentation's healthsheet answers "yes" to the question of potentially
      offensive content on the grounds that free-speech transcription is included; the tier-1
      release notes for versions 3.0.0 and 3.1.0 state that free-speech-derived transcriptions and
      dense features were removed. The warning is recorded as present because the residual concern
      is documented, with the mitigations applied in the current release stated alongside it.

variables:
  - variable_name: torchaudio_spectrogram
    data_type: array
    derivation: >-
      Time-frequency representation of dimension 201xT computed with the short-time Fast Fourier
      Transform using a 25 ms window, a 10 ms hop length and a 400-point FFT, then downsampled by a
      factor of two in the time domain.
    measurement_technique: torchaudio
    quality_notes: >-
      29,278 records. Excluded for sensitive records and audio checks, as for the Mel spectrogram,
      MFCC, phonetic posteriorgram and articulatory estimate families.
  - variable_name: torchaudio_mel_spectrogram
    data_type: array
    derivation: >-
      Mel spectrogram of dimension 60xT generated with a 25 ms window, a 10 ms hop length, a
      400-point FFT and 60 Mel bins.
    measurement_technique: torchaudio
    quality_notes: "29,278 records. Excluded for sensitive records and audio checks."
  - variable_name: torchaudio_mfcc
    data_type: array
    derivation: >-
      60 Mel-frequency cepstral coefficients of dimension 60xT computed with the same parameters as
      the Mel spectrograms.
    measurement_technique: torchaudio
    quality_notes: "29,278 records. Excluded for sensitive records and audio checks."
  - variable_name: torchaudio_pitch
    data_type: array
    unit: Hz
    minimum_value: 80.0
    maximum_value: 500.0
    derivation: "Detected pitch (fundamental frequency) over time, of dimension T."
    measurement_technique: torchaudio
    quality_notes: "32,522 records."
  - variable_name: sparc_ema
    data_type: array
    derivation: >-
      Estimated electromagnetic articulography from a deep learning model, of dimension Tx12,
      corresponding to X/Y positions of six articulators: tongue dorsum, tongue body, tongue tip,
      lower incisor, upper lip and lower lip.
    measurement_technique: "Speech Articulatory Coding (sparc)"
    quality_notes: >-
      28,640 records, gathered at 50 Hz. Excluded for sensitive records and audio checks.
  - variable_name: sparc_loudness
    data_type: array
    derivation: >-
      Estimated loudness based on the average absolute amplitude of the audio waveform, of size T,
      using 20 ms windows.
    measurement_technique: "Speech Articulatory Coding (sparc)"
    quality_notes: "31,855 records."
  - variable_name: sparc_periodicity
    data_type: array
    derivation: "Estimated periodicity, the confidence of pitch presence, using 20 ms windows, of dimension T."
    measurement_technique: "Speech Articulatory Coding (sparc)"
    quality_notes: "31,872 records."
  - variable_name: sparc_pitch
    data_type: array
    unit: Hz
    minimum_value: 50.0
    maximum_value: 550.0
    derivation: >-
      Estimated fundamental frequency of the audio signal computed by a different algorithm from
      torchaudio_pitch, of dimension T.
    measurement_technique: "Speech Articulatory Coding (sparc)"
    quality_notes: "31,872 records."
  - variable_name: ppgs
    data_type: array
    derivation: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories, of dimension 40xT at a
      frame rate of 100 Hz.
    measurement_technique: "ppgs package"
    quality_notes: >-
      29,289 records. Excluded for sensitive records and audio checks.

file_collections:
  - id: doi:10.13026/8xbn-nq66#collection-features
    name: "features"
    path: "features"
    collection_type: processed_data
    description: >-
      Derived audio features. Nine dense binary files in Parquet form (ppgs.parquet,
      sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet,
      torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet, torchaudio_pitch.parquet and
      torchaudio_mel_spectrogram.parquet), each keyed by participant identifier, session
      identifier, task name and frame count; together with two plain-text tab-delimited files,
      audio_quality_metrics.tsv giving one quality-control feature per audio recording and
      static_features.tsv giving features derived from the raw audio with one row per unique
      recording. Every file is accompanied by a JSON data dictionary sharing its file stem.
  - id: doi:10.13026/8xbn-nq66#collection-metadata
    name: "metadata"
    path: "metadata"
    collection_type: metadata
    description: >-
      A binary file in Parquet form with its corresponding data dictionary, carrying specific
      information about each recording including task instructions and prompts, the microphone used
      and its gain. New in version 3.1.0.
  - id: doi:10.13026/8xbn-nq66#collection-phenotype
    name: "phenotype"
    path: "phenotype"
    collection_type: processed_data
    description: >-
      Organized information collected from the participant or another individual during their
      encounter, arranged in six subfolders. confounders and demographics each hold a single
      instrument. diagnosis holds seventeen per-condition tables: airway_stenosis,
      amyotrophic_lateral_sclerosis, anxiety, benign_lesions, bipolar_disorder,
      cognitive_impairment, control, copd_and_asthma, depression, glottic_insufficiency,
      laryngeal_cancer, laryngeal_dystonia, laryngitis, muscle_tension_dysphonia,
      parkinsons_disease, precancerous_lesions, unexplained_chronic_cough and
      unilateral_vocal_fold_paralysis. enrollment holds eligibility, enrollment_form and
      participant. questionnaire holds thirteen validated instruments including adhd_adult,
      custom_affect_scale, dsm5_adult, dyspnea_index, gad7_anxiety, leicester_cough_questionnaire,
      panas, phq9, productive_vocabulary, psychiatric_history, ptsd_adult, vhi10 and
      voice_perception. task holds acoustic_task, harvard_sentences, random_item_generation,
      recording, session, stroop and winograd. Every table is a tab-delimited file with a JSON data
      dictionary sharing its file stem, whose keys match the column names and whose values give a
      description, the question asked of the participant where applicable, and the data type.
    notes: >-
      Version 3.1.0 rearranged some phenotype files relative to version 3.0.0: adhd_adult,
      psychiatric_history and ptsd_adult moved from the diagnosis subfolder to the questionnaire
      subfolder, and voice_perception and voice_problem_severity were removed from the task
      subfolder.

data_collectors:
  - role: "Site research team"
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students, coordinated
      with clinicians to identify appropriate participants and ran the collection sessions.
  - role: "Clinician / co-investigator"
    collector_details: >-
      Clinicians and doctors were listed under the IRB as co-investigators and added to the
      consortium so that their names appear on consortium-level publications arising from the
      research; they provided the gold-standard diagnostic assessment. Hospital staff were not
      involved in scheduling but assisted with the logistics of coordinating data collection.
  - role: "Research assistant"
    collector_details: >-
      In the clinic setting, trained research assistants conducted the consent process, introduced
      the application to participants and assisted during data collection.

collection_mechanisms:
  - mechanism_details: >-
      A custom smartphone/tablet application, the Bridge2AI-Voice App, hosts the data acquisition
      protocols and collects acoustic tasks, surveys, questionnaires and validated patient-reported
      outcomes. Collection was performed on iPads (9th or 10th generation) and iPad Air (5th
      generation) using an Avid AE-36 microphone connected through an Apple dongle, with a
      head-mounted headset used where possible. Distinct iPad devices were used at each site.
  - mechanism_details: >-
      Questionnaire and clinical data are captured through REDCap; the supporting REDCap data
      dictionary, metadata and instrument PDFs are published separately by the project.
  - mechanism_details: >-
      Remote collection is supported by two platforms, the Bridge2AI Voice Web app and the
      Bridge2AI Voice iOS app, which store data only during the collection phase and transmit over
      a secure HTTPS protocol to a HIPAA-compliant storage server.

collection_timeframes:
  - timeframe_details: >-
      The healthsheet records that the data was collected over a period of 12 months. No explicit
      start and end dates for the released cohort are given by any source in the bundle.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Voice samples were collected prospectively using the custom Bridge2AI-Voice application
      following the project's acquisition protocols, on a tablet with a headset where possible.
      Demographic, confounder and questionnaire data were reported by subjects. Clinical diagnoses
      were verified by clinicians reviewing audio and/or imaging data, examining electronic health
      records, or checking medication prescriptions.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from the individuals concerned rather than obtained through
      third parties. Retrospective imaging and electronic health record information used for
      diagnostic validation was drawn from participants' clinical records under the approved
      protocol.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. Participants were recruited at academic institutions from high
      volume expert clinics, defined as outpatient clinics with recognized expertise in a specific
      disease area seeing more than 50 patients per month from the same disease category. Charts
      were screened against the cohort inclusion and exclusion criteria prior to the visit by the
      project investigators, and eligible patients were invited to participate. Adults aged 18 and
      over who could read and speak English were eligible, including healthy volunteers serving as
      controls; individuals who had undergone a surgical intervention significantly altering the
      symptoms of the disease studied were excluded. Cohort-specific inclusion and exclusion
      criteria are tabulated per condition in the project documentation and are summarized on the
      individual subset entries of this record.
    why_not_representative: >-
      The data is not representative because it was collected at a limited number of geographic
      locations. The project states an intention to improve representativeness by moving to remote
      collection and designing recruitment so as to control for more variables.

raw_sources:
  - access_url: https://www.synapse.org/Synapse:syn72370534/
    raw_data_details: >-
      The original audio waveforms underlying the derived features are retained but not published
      with this release. Accessing raw audio is a more involved process requiring institutional
      sign-off, and requests are directed to the project's data access committee; the raw audio for
      the adult cohort is made available through Synapse.

raw_data_sources:
  - source_description: >-
      Raw audio recordings and questionnaire responses captured in the field by the Bridge2AI-Voice
      tablet application and stored in REDCap, from which the released phenotype tables and derived
      features were produced.
    source_type: "Prospectively collected primary research data"
    raw_data_format: "WAV audio waveforms and REDCap questionnaire exports"
    access_details: >-
      The raw data post de-identification is saved and is not accessible publicly; audio is
      released only through the controlled-access route via Synapse, following review by the
      project's Data Access Compliance Office.

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a
      Butterworth anti-aliasing filter applied. Spectrograms were downsampled by a factor of two in
      the time domain after derivation.
  - preprocessing_details: >-
      Features were extracted from the raw audio in order to limit re-identification, and only the
      extracted features are released; the raw waveforms are withheld from the public distribution.
  - preprocessing_details: >-
      The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from
      REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0, giving a
      layout of a phenotype directory of instrument-level tables alongside per-subject,
      per-session audio.

cleaning_strategies:
  - cleaning_details: >-
      A quality-control audit protocol is run over the data: generating missingness tables;
      checking distributions and outliers; checking categorical responses against the schema; and
      running quality control metrics for audio tasks, including the amount of silence and the
      duration of waveforms, and, for speech tasks, comparison of produced speech against the
      intended passage. The dataset has been audited internally for missingness and consistency by
      the data release team, and a missingness table is included with the dataset.
    source_caveats: >-
      The project healthsheet separately answers "no" to whether any preprocessing was performed
      for cleaning the data, so the audit protocol described here is quality assessment rather than
      correction of the released values.

labeling_strategies:
  - annotations_per_item: 1
    labeling_details: >-
      Gold-standard diagnostic labels are available in the data, established by clinical assessment
      rather than by annotation of the recordings. Clinical validation was performed by a qualified
      physician or practitioner against established gold standards for each condition, including
      laryngoscopy images and stroboscopy videos for voice disorders, spirometry and flow-volume
      loops and CT for airway conditions, brain CT and MRI and whole genome sequencing for
      neurodegenerative conditions, and electronic health summaries, psychiatrist diagnosis and
      medication history for psychiatric conditions.
    data_annotation_protocol: >-
      Labelers followed the Bridge2AI protocols and ICD-10 codes.
    annotator_demographics:
    - >-
      Typically the clinician at the site of data collection, or a clinician external to the study
      who had made a prior diagnostic assessment; a single labeler per instance.
    data_annotation_platform: "REDCap clinical validation instruments"

machine_annotation_tools:
  - tools:
      - "OpenAI Whisper Large"
      - "openSMILE"
      - "Praat"
      - "Parselmouth"
      - "torchaudio"
      - "Speech Articulatory Coding (sparc)"
      - "ppgs"
      - "b2aiprep"
      - "senselab"
    tool_descriptions: >-
      b2aiprep organizes and preprocesses the dataset and merges source data into the phenotype
      files; senselab processes audio files for research tasks. openSMILE, Praat/Parselmouth and
      torchaudio supply static and time-varying acoustic features; sparc supplies articulatory,
      loudness, periodicity and pitch estimates; ppgs supplies phonetic posteriorgrams; Whisper
      Large produced transcriptions. Version 3.1.0 was generated with b2aiprep v3.0.0. Source
      repositories are recorded under external_resources.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Removal of HIPAA Safe Harbor identifiers, combined with expert review by a team of ethicists
    and removal of the raw audio.
  identifiers_removed: >-
    Names, geographic locators, date information at a resolution finer than years, phone and fax
    numbers, email addresses, IP addresses, Social Security Numbers, medical record numbers, health
    plan beneficiary numbers, device identifiers, license numbers, account numbers, vehicle
    identifiers, website URLs, full face photographs, biometric identifiers and any unique
    identifiers. State and province were removed while the country of data collection was retained.
    Direct identifiers such as name, civic address and social security number were removed;
    indirect identifiers creating a significant re-identification risk in combination with public
    data, including select geographic or demographic identifiers and information about household
    composition or cultural identity, were also removed.
  deidentification_details: >-
    Non-identifying elements revealing highly sensitive information, such as household income,
    mental health status and traumatic life experiences, were removed. All raw voice data was
    removed because it has the potential to cause individual re-identification or to be used for
    illicit or unauthorized purposes. Spectrograms and similar dense features were excluded where
    the audio contained free speech, while static and other features that do not encode the
    sensitive information were retained. Narrative text fields were removed and dates rebased or
    replaced by integers. K-anonymization with k greater than or equal to two is not achieved.

participant_privacy:
  - anonymization_method: >-
      Removal of all audio data and of certain sensitive fields identified by a team of ethicists,
      in addition to HIPAA Safe Harbor de-identification.
    privacy_techniques: >-
      Raw audio transcripts were reviewed, and any audio recordings containing potentially
      identifying information or external voices were removed from the release. All fields encoded
      as sensitive in the project's REDCap data dictionary were removed. Identifiable data is held
      within each collecting institution in password-protected REDCap databases; the shared
      de-identified data carries participant and institution numbers rather than direct
      identifiers.
    reidentification_risk: >-
      Voice data is de-identified for privacy protection, but each person's voice is unique to them
      and to their health at that point in their life, so it remains possible, even if unlikely,
      that someone could recognize a participant's voice. This residual risk is the stated reason
      for withholding raw audio from open release and for the controlled-access mechanism.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    Submitted to and approved by the University of South Florida single IRB and by subsite IRBs
    through the single IRB process, under the protocol "Bridge2AI Voice Data Acquisition" with
    Yael Bensoussan as principal investigator. Canadian participating institutions do not follow
    the single IRB process and obtained separate research ethics board approvals; genomic data
    collection at Mount Sinai Hospital and the University of Toronto was covered by a separate
    protocol.
  ethics_review_board: "University of South Florida Institutional Review Board"
  regulatory_compliance:
  - >-
    HIPAA de-identification rules were applied to the released data; a partial HIPAA waiver was
    obtained for recruitment screening; and the data are covered by a Certificate of
    Confidentiality.
  special_populations:
  - >-
    The adult release is limited to participants aged 18 and over, with a stated maximum age of
    120 years, and includes healthy volunteers. Pediatric participants were enrolled only at
    pediatric sites under the same programme and are published as a separate dataset.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Eligibility for this release sets a minimum age of 18 years and a maximum of 120 years, so no
    minors are included. Participation was voluntary and explicitly did not affect the
    participant's medical care.
  source_caveats: >-
    The IRB protocol also sets out guardian consent and child assent procedures. Those apply to the
    pediatric cohort, which was enrolled only at pediatric sites and is published as a separate
    dataset, so they are not recorded as properties of this release.

ethical_reviews:
  - reviewing_organization: "University of South Florida Institutional Review Board"
    review_details: >-
      Data collection and sharing was approved by the University of South Florida Institutional
      Review Board. All US-based institutions abide by the single IRB process, submitting for
      review based on the single IRB at the University of South Florida once the protocol was
      approved there. The approved protocol is "Bridge2AI Voice Data Acquisition", whose principal
      investigator is Yael Bensoussan of the Department of Otolaryngology - Head and Neck Surgery,
      University of South Florida.
  - reviewing_organization: "Canadian participating institutions' research ethics boards"
    review_details: >-
      Mount Sinai Hospital, the Hospital for Sick Children and the University of Toronto do not
      follow the single IRB process and applied for separate research ethics board approvals to
      comply with Canadian regulations; copies of the approved applications were submitted to the
      University of South Florida IRB.

informed_consent:
  - consent_obtained: true
    consent_type: "Prospective informed consent"
    consent_documentation: >-
      Participants could consent by signing a physical paper copy, by indicating electronic consent
      within the application or through REDCap surveys, or by video recording within the
      application, in which case the participant read a statement aloud so that the recording could
      be used to verify that submitted acoustic data belonged to the consented individual. Paper
      consent documents were uploaded and stored electronically in REDCap; all consent records are
      retained for at least five years after study completion.
    consent_scope: >-
      Research data that does not contain direct identifiers is shared with external researchers for
      future research through a secure database. Data posing a low risk of individual
      re-identification is shared in registered access with the general public, and data that would
      pose a heightened risk if shared in full open access is shared through a controlled-access
      mechanism with authorized researchers. Consenting participants also permitted investigators
      to access medical information through EHR platforms for gold-standard validation of diagnoses
      and symptoms.
    withdrawal_mechanism: >-
      Participants are informed that they may withdraw from the study at any point. Withdrawal
      during or before completion of voice data collection means the data is not included in the
      database; once the voice data collection process is completed the research data, including
      voice recordings, cannot be removed from the database.

collection_consents:
  - consent_details: >-
      All participants were duly informed and agreed to the collection and use of their data via
      prospective informed consent obtained through an IRB-approved process. The consent does not
      restrict use to non-commercial purposes, to a specific geographic location, to a specific type
      of research, to genetic research, or to research that excludes methods and algorithm
      development.

collection_notifications:
  - notification_details: >-
      Individuals were notified about the data collection: participants went through an
      IRB-approved consent process in which the purpose of the app, the data being collected, the
      methods used to secure it and the intended use were explained, with opportunity to ask
      questions before signing.

consent_revocations:
  - revocation_details: >-
      Consenting participants are informed that they may withdraw at any point. If a participant
      withdraws during or before voice data collection, their data is not included in the database.
      Participants are informed that research data, including voice recordings, cannot be removed
      from the database once the voice data collection process is completed.

participant_compensation:
  - compensation_provided: true
    compensation_type: "Electronic gift cards"
    compensation_amount: >-
      40 US dollars for a data collection session of less than 90 minutes and 80 US dollars for a
      session of over 90 minutes, for no more than three sessions and a maximum compensation of
      120 US dollars.
    compensation_rationale: >-
      Compensation is for the participant's time; the IRB protocol records that compensation is
      provided to the adult population only.
    source_caveats: >-
      The IRB protocol's revision history shows that compensation was introduced in a later
      amendment and that the amount was changed twice thereafter, so participants enrolled earlier
      in the study may have received a different amount or none.

license_and_use_terms:
  license_terms: >-
    Bridge2AI Voice Registered Access License, with access conditional on signature of the
    Bridge2AI Voice Registered Access Agreement. The agreement restricts use to commercial and
    non-commercial research by Authorized Researchers, forbids attempts at re-identification and
    uses that could cause harm or stigmatization, and forbids the use of intellectual property
    protections in ways that would restrict access to the data or to conclusions drawn from it.
    Data may be duplicated as reasonably required to carry out the approved research project, but
    sale of all or part of the data on any media is not permitted. Recipients agree not to use the
    data, alone or in concert with any other information, to make any effort to contact the
    individuals who are the subjects of the data without appropriate IRB approval, specific written
    approval from the provider, and informed consent from the individual where required. No fees
    are associated with these restrictions. Raw audio is governed by a separate controlled-access
    agreement.
  data_use_permission: general_research_use

data_governance:
  committee_name: "Data Access Compliance Office (DACO)"
  access_review_process: >-
    Two tiers operate. For the features-only release, a user registers on PhysioNet, confirms their
    identity as a credentialed user, and signs the Bridge2AI Voice Registered Access Agreement; no
    additional training is required. For raw audio, the applicant completes a Data Access Request
    Form and a Data Use Agreement, submits the application to the Data Access Compliance Office for
    review, and on approval arranges for a Data Use and Transfer Agreement to be signed by an
    authorized official at their institution. Collaborators at other research organizations, and
    other research teams at the same organization, must apply independently and sign their own
    transfer and use agreement. The dataset provider also requires recipients to adhere to the
    specific requirements of PhysioNet.
  accountable_organization:
    name: "University of South Florida Board of Trustees"
  stewardship_roles:
  - >-
    The University of South Florida Board of Trustees acts as the provider institution under the
    Data Transfer and Use Agreement; the Data Access Compliance Office reviews controlled-access
    applications; the MIT Laboratory for Computational Physiology maintains the PhysioNet platform
    on which the release is published. Data transfer and data use agreements between collaborating
    universities were drafted alongside the patents and innovations office for the safe sharing of
    data, and each local principal investigator is responsible for the identifiable data held at
    their institution.
  notes: >-
    Access enquiries for the raw audio are directed to the Data Access Compliance Office at
    DACO@b2ai-voice.org; enquiries about the dataset itself are directed to the corresponding
    author named on the PhysioNet project page. The bundle names no individual as the committee
    contact.
  source_caveats: >-
    The bundle describes no appeal route for a refused access application. The Data Transfer and
    Use Agreement provides only that the provider may unilaterally amend the agreement if the
    federal sponsor requires revision, and that a recipient objecting to an amendment sees the
    agreement terminate immediately and must return or destroy all data; that is a termination
    clause rather than an appeal process, so the appeal field is left unpopulated.

ip_restrictions:
  restrictions:
  - >-
    The data may be protected by copyright and other rights, including other intellectual property
    rights. Nothing in the agreement transfers to the recipient any intellectual property rights in
    or relating to the data. Recipients agree not to make intellectual property claims on the data
    and not to use intellectual property protection, database rights or related rights in ways that
    would prevent or block access to, or use of, any element of the data or conclusions drawn
    directly from it. Recipients may obtain intellectual property rights on downstream discoveries
    but agree to implement licensing policies that will not obstruct further research, and to
    respect the Fort Lauderdale Agreement.
  notes: >-
    The provider gives no warranty that the data is free of third-party intellectual property
    rights, database rights or other related rights, and the data is supplied as is.

regulatory_restrictions:
  confidentiality_level: restricted
  other_compliance: >-
    HIPAA de-identification rules were applied to the released data. The data is covered by a
    Certificate of Confidentiality, which must be asserted against compulsory legal demands such as
    court orders and subpoenas for identifying information or characteristics of a research
    participant. Recipients must establish administrative, physical and technical safeguards
    adequate to protect personally identifiable information, must report any unauthorized use or
    disclosure within five business days of discovery, and must destroy or return the data at the
    end of the agreement term with written certification of destruction within thirty days. The
    data is Personally Identifiable Information as defined in OMB Memorandum M-07-16.
  source_caveats: >-
    The bundle states that HIPAA de-identification rules were applied and that HIPAA Safe Harbor
    identifiers were removed, but no source makes a compliance determination, so the
    hipaa_compliant field is left unpopulated. The bundle states that no export controls apply to
    the dataset; that negative is not recorded as a restriction.

distribution_formats:
  - format: "Parquet"
    notes: >-
      Dense derived features are distributed as Parquet, an open-source column-oriented data file
      format, one file per feature family, each row keyed by participant identifier, session
      identifier, task name and frame count. Per-recording metadata is distributed in the same
      format.
  - format: "TSV"
    media_type: text/tab-separated-values
    notes: >-
      Static features, audio quality metrics and all phenotype tables are distributed as
      tab-delimited plain-text files.
  - format: "JSON"
    media_type: application/json
    notes: >-
      Every data file is accompanied by a data dictionary sharing its file stem with a .json
      suffix, whose keys match the column names of the associated file and whose values give a
      description, the question asked of the participant where applicable, and the data type.

distribution_dates:
  - release_dates: >-
      Version 1.0 was published at the end of November 2024 on the Health Data Nexus; version 1.1
      on 17 January 2025; version 2.0.0 on 16 April 2025; version 2.0.1 on 18 August 2025; version
      3.0.0 on 16 December 2025; and version 3.1.0, the version described here, on 1 May 2026.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it, subject
      to registered or controlled access conditions appropriate to the sensitivity of the content.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The MIT Laboratory for Computational Physiology maintains PhysioNet, the platform hosting the
      current release, supported by NIBIB, NHLBI and the NIH Office of the Director under grant
      numbers U24EB037545 and R01EB030362.
  - role: academic_institution
    maintainer_details: >-
      The Bridge2AI-Voice Consortium curates the dataset and administers access; enquiries about
      the dataset are directed to the corresponding author and access requests to the project's
      Data Access Compliance Office at DACO@b2ai-voice.org. The dataset is supported by the NIH via
      the Bridge2AI project.

updates:
  frequency: "Semi-annual (twice a year)"
  update_details: >-
    The project states that further versions of the dataset will be released on a semi-annual
    basis, distributed as new versions on the hosting platform, adding participants, adding feature
    families, correcting errors and reorganizing files. Users will be notified through news items
    on the platform and through standard communication channels. A changelog for each dataset
    version is published online with the dataset metadata.

version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
  - >-
    Versions 1.1 (17 January 2025), 2.0.0 (16 April 2025), 2.0.1 (18 August 2025), 3.0.0
    (16 December 2025) and 3.1.0 (1 May 2026) are listed on PhysioNet, preceded by version 1.0 on
    the Health Data Nexus.
  version_details: >-
    By default, older versions continue to be supported, hosted and made available to researchers,
    and each version has a unique DOI; the publishers reserve the right to remove access to older
    versions. Version 1.1 was released under registered access, while versions 3.0.0 and 3.1.0
    require credentialed access. The files for version 1.1 are no longer available on PhysioNet.

retention_limit:
  retention_period: "Indefinite for the archived dataset."
  retention_details: >-
    Once data is contributed it is retained as long as it is useful for research purposes, possibly
    indefinitely. Two further retention regimes apply to copies rather than to the archive. Under
    the Data Transfer and Use Agreement a recipient's copy is held for two years from the start
    date, or until completion of the project, expiry of the applicable ethics approval, or
    termination, whichever occurs first; the recipient must then destroy the data in accordance
    with the provider's instructions and submit written certification of destruction within thirty
    days, retaining at most one copy where required by records-retention obligations or for
    research integrity and verification. Separately, identifiable data and the sheets linking
    participant numbers to participant information are kept at each collecting institution for a
    maximum of ten years after study completion and are then destroyed, this being the
    responsibility of each local principal investigator.

errata:
  - erratum_details: >-
      Version 3.1.0 fixed broken Parquet files carried over from the previous release, back-filled
      and updated validated diagnosis information across conditions, rearranged some phenotype
      files and renamed certain gold-standard variables.
  - erratum_details: >-
      Version 2.0.1 corrected the authorship list.
  - erratum_details: >-
      Version 2.0 reprocessed the spectrograms to fix minor issues identified in the previous
      release, and removed all spectrograms and Mel-frequency cepstral coefficients derived from
      free-speech files.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    Others may publish derivative datasets that reference the original source on the Health Data
    Nexus, made available under the same conditions as the source data. For augmentations to the
    code used to produce the data, the open-source repositories provide discussion forums and issue
    pages for public discussion of data preprocessing, and a pull request mechanism for
    contributing improvements to the preprocessing code.

related_datasets:
  - relationship_type: is_supplemented_by
    target_dataset: "doi:10.13026/h995-bt35"
    notes: >-
