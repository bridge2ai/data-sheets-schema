purposes:
- response: To address a gap in the availability of large-scale, diverse and well-documented
    voice data for use in clinical machine-learning applications, providing an ethically sourced
    dataset on which clinically applicable AI/ML models can be developed, benchmarked or validated.
- response: To generate a large multi-institutional, ethically sourced and diverse voice dataset
    linked to multimodal health biomarkers, so that voice can be integrated as a biomarker
    of health in clinical care for screening, diagnosis and treatment of a broad range of
    diseases.
- response: To create an ethically sourced flagship dataset enabling future research in artificial
    intelligence and supporting critical insights into the use of voice as a biomarker of
    health.
- response: To generate high-quality, ethically sourced datasets for biomedical research that
    advance the field of audiomics, produced by a team of 50 multidisciplinary experts drawn
    from 12 North American institutions.
tasks:
- response: Training machine-learning models for disease detection and classification from
    voice, with labels drawn from diagnostic categories including vocal pathologies, neurological
    disorders, psychiatric conditions and respiratory disorders.
- response: Supporting clinical research in disease screening, diagnosis and monitoring through
    voice biomarkers.
addressing_gaps:
- response: Existing work on machine-learning voice diagnosis had been limited to small- to
    medium-sized datasets, or lacked the key clinical metadata needed to train robust, clinically
    useful models. Realizing voice as a biomarker requires large datasets capturing diverse
    populations and disease statuses alongside other established physiologic biomarkers.
- response: Comparing studies and pooling voice data has been difficult because of the absence
    of standards for how voice and other acoustic data are measured and collected; the project
    pairs the dataset with new acquisition protocols and bioinformatics standards.
- response: Industry holds large volumes of user voice data but lacks accurate clinical or
    demographic information, which prevents annotation for AI training, comparison against
    gold-standard medical assessment and external auditing for fair representation of diverse
    populations. A publicly documented, clinically validated dataset fills that gap.
