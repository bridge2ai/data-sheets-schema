instances:
- instance_type: Participant (a person)
  counts: 833
  data_topic: B2AI_TOPIC:36
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant.
    At each site a local clinician provided the diagnosis based on a clinical interview and
    appropriate work-up; for the psychiatric disorders cohort the assessment was determined
    from the participant's electronic health record or an active prescription, established
    outside data collection by an appropriately licensed clinician.
  missing_information:
  - missing: Optional questionnaire items
    why_missing:
    - Some questions in the protocol are optional and may be left unanswered.
  - missing: Cohort-specific questionnaire and diagnosis fields
    why_missing:
    - Each individual answered a common set of questions and then responded to additional
      questions relevant to their primary diagnostic category, so condition-specific tables
      are populated only for the relevant participants.
  - missing: Fields lost to collection irregularities
    why_missing:
    - Data collection irregularities caused some information to be missing from individual
      instances.
- instance_type: Audio recording, represented by derived features rather than the waveform
  data_substrate: B2AI_SUBSTRATE:30
  notes: Each derived-feature row is keyed by participant identifier, session identifier and
    task name. Counts differ per feature family because some recordings could not yield some
    features, and because features derived from free-speech and open-response prompts were
    withheld.
anomalies:
- anomaly_details: Different sites used different collection configurations, and the collection
    protocol changed over the course of the study.
- anomaly_details: Noise artifacts, variations in diagnostic practices, inaccurate questionnaire
    responses and underreporting are identified as confounding factors present in the data.
- anomaly_details: Recordings were made with a head-mounted headset whose microphone could
    sit at slightly different distances from the speaker.
- anomaly_details: Some files, whether because of length or other issues, could not generate
    certain features and are therefore absent from the corresponding bundled feature file,
    so per-feature record counts differ.
known_biases:
- bias_type: selection_bias
  bias_description: Groups with less trust in the medical system or in AI, or who are less
    proximal to the collection sites, would have been less likely to be recruited.
  mitigation_strategy: The project states an intention to shift to remote collection and to
    design recruitment so as to control for more variables.
- bias_type: sampling_bias
  bias_description: The sample is drawn from a limited number of geographic locations, with
    five recording sites in the United States and Canada, and is therefore not representative
    of the larger population from which it is drawn.
- bias_type: measurement_bias
  bias_description: Participants were screened for different disorders depending on the site,
    so participants with different conditions had their data collected on different devices;
    device and condition are therefore confounded.
- bias_type: representation_bias
  bias_description: The public releases do not contain an equal distribution of the disease
    cohort categories, and the dataset carries skews by disorder category, site and demographic
    factors.
- bias_type: annotation_bias
  bias_description: Diagnostic labels were assigned by a single labeler per instance, typically
    the clinician at the site of data collection or the clinician responsible for a prior
    diagnostic assessment, so no inter-annotator agreement can be computed and site-level
    clinical practice enters the labels directly.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: The dataset is a sample of a larger, ongoing collection and is not
    representative, because it was collected at a limited number of geographic locations.
  recommended_mitigation: Assess the multivariate distribution of disorder category, site
    and demographics before treating results as generalizable.
- limitation_type: coverage_limitation
  limitation_description: Participants had to read and speak English; Spanish protocols and
    data collection were under development and are not part of this release.
  scope_impact: Findings and models derived from the release may not transfer to speakers
    of other languages.
- limitation_type: scope_limitation
  limitation_description: The public release contains derived features rather than the original
    voice recordings, and spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and
    articulatory estimates derived from free-speech and open-response prompts, and from audio
    checks, were withheld.
  recommended_mitigation: Investigators requiring waveforms must apply for controlled access
    to the raw audio.
- limitation_type: temporal_limitation
  limitation_description: Changes in diagnostic criteria or practices over the collection
    period could be a source of distribution shift within the dataset.
- limitation_type: methodological_limitation
  limitation_description: Certain derived elements, notably transcription, were generated
    using off-the-shelf models that have not been audited for correctness, and human-level
    performance on the applications the dataset addresses varies widely.
- limitation_type: integration_limitation
  limitation_description: Multimodal data extracted from site systems, including imaging,
    laryngoscopy and genomic data, is not included in this release.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The healthsheet records that the dataset does not contain data
    protected by legal privilege or doctor-patient confidentiality, nor the content of individuals'
    non-public communications. Access is nonetheless restricted, and the raw voice recordings
    are held under a separate controlled-access mechanism.
content_warnings:
- content_warnings_present: false
  warnings:
  - Free-speech and open-response prompts could in principle contain distressing or identifying
    material, since participants choose their own words. To manage this, transcriptions, spectrograms,
    Mel spectrograms, MFCCs, articulatory estimates and phonetic posteriorgrams derived from
    open-response prompts were removed from the feature-only release, and raw audio transcripts
    were reviewed so that recordings containing potentially identifying information or external
    voices were excluded.
  source_caveats: The project documentation's healthsheet answers "yes" to the question of
    potentially offensive content on the grounds that free-speech transcription is included;
    the tier-1 release notes for versions 3.0.0 and 3.1.0 state that free-speech-derived transcriptions
    and dense features were removed, so this record reports the current release state.
subpopulations:
- subpopulation_elements_present: true
  identification: Age, Gender, Sex, Ethnicity, Socioeconomic status
  distribution: The release does not contain an equal distribution of the disease cohort categories,
    and skews by disorder category, site and demographic factors are acknowledged by the data
    release team.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset includes race and ethnicity information, sexual orientation
    information, and socioeconomic and health information. Non-identifying elements revealing
    highly sensitive information, such as household income, mental health status and traumatic
    life experiences, were removed before release, as were all data elements encoded as sensitive
    in the project's REDCap data dictionary.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: Voice samples were collected prospectively using the custom Bridge2AI-Voice
    application following the project's acquisition protocols, on a tablet with a headset
    where possible. Demographic, confounder and questionnaire data were reported by subjects.
    Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data, examining
    electronic health records, or checking medication prescriptions.
- was_inferred_derived: true
  acquisition_details: 'The distributed feature representations are derived rather than observed:
    they are computed from the raw waveforms by the project''s open-source processing pipeline.'
collection_mechanisms:
- mechanism_details: A custom smartphone/tablet application, the Bridge2AI-Voice App, hosts
    the data acquisition protocols and collects acoustic tasks, surveys, questionnaires and
    validated patient-reported outcomes. Collection was performed on iPads (9th or 10th generation)
    and iPad Air (5th generation) using an Avid AE-36 microphone connected through an Apple
    dongle, with a head-mounted headset used where possible. Distinct iPad devices were used
    at each site.
- mechanism_details: Questionnaire and clinical data are captured through REDCap; the supporting
    REDCap data dictionary, metadata and instrument PDFs are published separately by the project.
- mechanism_details: Remote collection is supported by two platforms, the Bridge2AI Voice
    Web app and the Bridge2AI Voice iOS app, which store data only during the collection phase
    and transmit over a secure HTTPS protocol to a HIPAA-compliant storage server; the initial
    dataset release did not include remotely collected data.
collection_timeframes:
- timeframe_details: The healthsheet records that the data was collected over a period of
    12 months. The underlying award runs from 2022-09-01 to 2026-11-30, and the IRB protocol
    describes a phased four-year acquisition programme; no explicit start and end dates for
    the released cohort are given in the sources.
data_collectors:
- role: Site research team
  collector_details: Research teams, which may include medical, graduate or undergraduate
    students, coordinated with clinicians to identify appropriate participants and ran the
    collection sessions.
- role: Clinician / co-investigator
  collector_details: Clinicians and doctors were listed under the IRB as co-investigators
    and added to the consortium so that their names appear on consortium-level publications
    arising from the research; they provided the gold-standard diagnostic assessment. Hospital
    staff were not involved in scheduling but assisted with the logistics of coordinating
    data collection.
- role: Research assistant
  collector_details: In the clinic setting, trained research assistants conducted the consent
    process, introduced the application to participants and assisted during data collection.
missing_data_documentation:
- missing_data_patterns: Phenotype data files contain a row for a participant only where at
    least one column is non-missing, so absence of a row indicates that no element of that
    instrument was recorded for that participant. Because each participant answered a common
    core plus items specific to their primary diagnostic category, condition-specific tables
    are sparse by design.
  missing_data_causes: Some questions in the protocol are optional, and data collection irregularities
    caused some information to be missing from individual instances.
  handling_strategy: The data release team generated missingness tables as part of the internal
    audit and distributes a missingness table with the dataset; no imputation is applied.
raw_data_sources:
- source_description: Raw audio recordings and questionnaire responses captured in the field
    by the Bridge2AI-Voice tablet application and stored in REDCap, from which the released
    phenotype tables and derived features were produced.
  source_type: Prospectively collected primary research data
  raw_data_format: WAV audio waveforms and REDCap questionnaire exports
  access_details: The raw data post de-identification is saved and is not accessible publicly;
    audio is released only through the controlled-access route.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies: Non-probability sampling. Participants were recruited at academic institutions
    from high volume expert clinics, defined as outpatient clinics with recognized expertise
    in a specific disease area seeing more than 50 patients per month from the same disease
    category. Charts were screened against the cohort inclusion and exclusion criteria prior
    to the visit by the project investigators, and eligible patients were invited to participate.
    Adults aged 18 and over who could read and speak English were eligible, including healthy
    volunteers serving as controls; individuals who had undergone a surgical intervention
    significantly altering the symptoms of the disease studied were excluded.
  why_not_representative: The data is not representative because it was collected at a limited
    number of geographic locations.
  representative_verification:
  - No verification of representativeness was performed; the project states an intention to
    improve representativeness by moving to remote collection and adjusting recruitment design.
raw_sources:
- access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details: The original audio waveforms underlying the derived features are retained
    but not published with this release. Accessing raw audio is a more involved process requiring
    institutional sign-off, and requests are directed to the project's data access committee;
    the raw audio for the adult cohort is made available through Synapse.
preprocessing_strategies:
- preprocessing_details: Raw audio was preprocessed by converting to monaural and resampling
    to 16 kHz with a Butterworth anti-aliasing filter applied. Spectrograms were downsampled
    by a factor of two in the time domain after derivation.
- preprocessing_details: Features were extracted from the raw audio in order to limit re-identification,
    and only the extracted features are released; the raw waveforms are withheld from the
    public distribution.
- preprocessing_details: The raw audio files and the questionnaire data retrieved from ReproSchema-UI
    or exported from REDCap were converted to be compliant with the Brain Imaging Data Structure
    v1.9.0, giving a layout of a phenotype directory of instrument-level tables alongside
    per-subject, per-session audio.
cleaning_strategies:
- cleaning_details: No data cleaning preprocessing was applied; the healthsheet answers "no"
    to whether preprocessing for cleaning was performed.
- cleaning_details: 'A quality-control audit protocol is run over the data: generating missingness
    tables; checking distributions and outliers; checking categorical responses against the
    schema; and running quality control metrics for audio tasks, including the amount of silence
    and the duration of waveforms, and, for speech tasks, comparison of produced speech against
    the intended passage. The dataset has been audited internally for missingness and consistency
    by the data release team, and a missingness table is included with the dataset.'
labeling_strategies:
- annotations_per_item: 1
  labeling_details: Gold-standard diagnostic labels are available in the data, established
    by clinical assessment rather than by annotation of the recordings. Clinical validation
    was performed by a qualified physician or practitioner against established gold standards
    for each condition, including laryngoscopy images and stroboscopy videos for voice disorders,
    spirometry and flow-volume loops and CT for airway conditions, brain CT and MRI and whole
    genome sequencing for neurodegenerative conditions, and electronic health summaries, psychiatrist
    diagnosis and medication history for psychiatric conditions.
  data_annotation_protocol: Labelers followed the Bridge2AI protocols and ICD-10 codes. Any
    new labels created by downstream researchers should be described alongside the release
    of a model or publication, including the exact variables used for the determination.
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to the
    study who had made a prior diagnostic assessment; a single labeler per instance.
  inter_annotator_agreement: 'Not applicable: one labeler provided a label per instance, so
    no agreement statistic is computed.'
  data_annotation_platform: REDCap clinical validation instruments
machine_annotation_tools:
- tools:
  - OpenAI Whisper Large (transcription)
  - openSMILE
  - Praat
  - Parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - ppgs
  - b2aiprep (https://github.com/sensein/b2aiprep)
  - senselab (https://github.com/sensein/senselab)
  tool_descriptions: b2aiprep organizes and preprocesses the dataset and merges source data
    into the phenotype files; senselab processes audio files for research tasks. openSMILE,
    Praat/Parselmouth and torchaudio supply static and time-varying acoustic features; sparc
    supplies articulatory, loudness, periodicity and pitch estimates; ppgs supplies phonetic
    posteriorgrams; Whisper Large produced transcriptions. Version 3.1.0 was generated with
    b2aiprep v3.0.0.
  tool_accuracy:
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf
    models that have not been audited for correctness.
existing_uses:
- examples:
  - A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer
    School and hackathon.
other_tasks:
- task_details: Beyond disease classification, the release supports AI model pretraining,
    fine-tuning, benchmarking and external validation.
- task_details: The phenotype tables, distributed with per-condition diagnosis files and validated
    questionnaire responses, can be used for cohort selection independently of the acoustic
    features.
future_use_impacts:
- impact_details: The dataset has skews based on disorder category, site and other demographic
    factors. Users should consider the multivariate distribution when assessing utility for
    different questions, since models trained without accounting for these skews risk unfair
    treatment of groups.
- impact_details: Diagnostic practice and criteria may shift over time, and participants were
    screened for different disorders at different sites using different devices, so label
    and device confounding may propagate into downstream models.
discouraged_uses:
- discouragement_details: Non-research applications such as hiring decisions, insurance premium
    adjustments, or any form of surveillance that could lead to discrimination or harm are
    discouraged, in order to prevent unethical or biased outcomes that could negatively affect
    individuals on the basis of their health conditions or voice characteristics.
- discouragement_details: Users should not treat the sample as representative. The dataset
    carries skews by disorder category, site and demographic factors, and the multivariate
    distribution should be assessed before judging utility for any given question.
intended_uses:
- use_category: research
  examples:
  - Development of AI and machine-learning models for healthcare using voice biomarkers
  - Benchmarking or external validation of clinically applicable voice models
  - Pretraining and fine-tuning of acoustic models on health-linked speech
  usage_notes: The dataset is intended solely for commercial and non-commercial research purposes
    by Authorized Researchers under the Registered Access Agreement.
prohibited_uses:
- prohibition_reason: The Registered Access Agreement forbids attempting to re-identify research
    participants, or any action that could reasonably lead to re-identification.
- prohibition_reason: The Registered Access Agreement forbids any purpose that could foreseeably
    cause harm or stigmatization to research participants, their families, communities, or
    specific populations.
- prohibition_reason: Intellectual property protections, database rights or related rights
    may not be used in a manner that restricts or limits access to any part of the dataset
    or to conclusions derived from it, so that future use remains unrestricted in line with
    the consortium's Open Science commitments. Sale of all or part of the data on any media
    is not permitted.
distribution_formats:
- format: Apache Parquet
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  notes: Dense derived features are distributed as Parquet, an open-source column-oriented
    data file format, one file per feature family, each row keyed by participant identifier,
    session identifier, task name and frame count.
- format: Tab-separated values
  media_type: text/tab-separated-values
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  notes: Static features, audio quality metrics and all phenotype tables are distributed as
    tab-delimited plain-text files.
- format: JSON data dictionaries
  media_type: application/json
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  notes: Every data file is accompanied by a data dictionary sharing its file stem with a
    .json suffix, whose keys match the column names of the associated file and whose values
    give a description, the question asked of the participant where applicable, and the data
    type.
distribution_dates:
- release_dates: Version 1.0 was published at the end of November 2024 on the Health Data
    Nexus; version 1.1 on 17 January 2025; version 2.0.0 on 16 April 2025; version 2.0.1 on
    18 August 2025; version 3.0.0 on 16 December 2025; and version 3.1.0, the version described
    here, on 1 May 2026.
maintainers:
- name: MIT Laboratory for Computational Physiology
  role: academic_institution
  maintainer_details: Maintains PhysioNet, the platform hosting the current release, supported
    by NIBIB, NHLBI and the NIH Office of the Director under grant numbers U24EB037545 and
    R01EB030362.
- name: Bridge2AI-Voice Consortium
  role: academic_institution
  maintainer_details: Curates the dataset and administers access; enquiries about the dataset
    are directed to the corresponding author and access requests to the project's data access
    committee. The dataset is supported by the NIH via the Bridge2AI project.
- name: Temerty Centre for Artificial Intelligence Research and Education in Medicine (T-CAIREM),
    University of Toronto
  role: academic_institution
  maintainer_details: Maintains the Health Data Nexus, the data publishing platform that hosted
    the earlier feature-only release and provides cloud compute alongside that dataset.
errata:
- erratum_details: Version 3.1.0 fixed broken Parquet files carried over from the previous
    release, back-filled and updated validated diagnosis information across conditions, rearranged
    some phenotype files and renamed certain gold-standard variables.
- erratum_details: Version 2.0.1 corrected the authorship list.
- erratum_details: Version 2.0 reprocessed the spectrograms to fix minor issues identified
    in the previous release, and removed all spectrograms and Mel-frequency cepstral coefficients
    derived from free-speech files.
- erratum_details: No formal erratum document is published; a changelog for each dataset version
    is published online with the dataset metadata.
updates:
  frequency: Semi-annual (twice a year)
  update_details: Further versions are released on a semi-annual basis as new versions of
    the dataset, adding participants, adding feature families, correcting errors and reorganizing
    files. Users are notified through news items on the hosting platform and through standard
    communication channels. A changelog for each dataset version is published online with
    the dataset metadata.
retention_limit:
  retention_period: Indefinite for the archived dataset; two years from the start date for
    a recipient's copy under the Data Transfer and Use Agreement, or until completion of the
    project, expiry of the applicable ethics approval, or termination, whichever occurs first.
  retention_details: Once data is contributed it is retained as long as it is useful for research
    purposes, possibly indefinitely. Recipients must destroy the data in accordance with the
    provider's instructions at the end of the agreement and submit written certification of
    destruction within thirty days, retaining at most one copy where required by records-retention
    obligations or for research integrity and verification. Identifiable data and the sheets
    linking participant numbers to participant information are kept at each collecting institution
    for a maximum of ten years after study completion and are then destroyed, this being the
    responsibility of each local principal investigator.
version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
  - 1.1 (17 January 2025), 2.0.0 (16 April 2025), 2.0.1 (18 August 2025), 3.0.0 (16 December
    2025) and 3.1.0 (1 May 2026) on PhysioNet, preceded by version 1.0 on the Health Data
    Nexus.
  version_details: By default, older versions continue to be supported, hosted and made available
    to researchers, and each version has a unique DOI; the publishers reserve the right to
    remove access to older versions. Version 1.1 was released under registered access, while
    versions 3.0.0 and 3.1.0 require credentialed access. The files for version 1.1 are no
    longer available on PhysioNet.
extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: Others may publish derivative datasets that reference the original source
    on the hosting platform, made available under the same conditions as the source data.
    For augmentations to the code used to produce the data, the open-source repositories provide
    discussion forums and issue pages for public discussion of data preprocessing, and a pull
    request mechanism for contributing improvements to the preprocessing code.
ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: Data collection and sharing was approved by the University of South Florida
    Institutional Review Board. All US-based institutions abide by the single IRB process,
    submitting for review based on the single IRB at the University of South Florida once
    the protocol was approved there.
  contact_person:
    id: doi:10.13026/8xbn-nq66#person-yael-bensoussan
    name: Yael Bensoussan
    affiliation:
    - name: Department of Otolaryngology - Head and Neck Surgery, University of South Florida
- reviewing_organization: Canadian participating institutions' research ethics boards
  review_details: Mount Sinai Hospital, the Hospital for Sick Children and the University
    of Toronto do not follow the single IRB process and applied for separate research ethics
    board approvals to comply with Canadian regulations; copies of the approved applications
    were submitted to the University of South Florida IRB.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - Submitted to and approved by the University of South Florida single IRB and by subsite
    IRBs through the single IRB process, under the protocol "Bridge2AI Voice Data Acquisition"
    with Yael Bensoussan as principal investigator. Canadian participating institutions do
    not follow the single IRB process and obtained separate research ethics board approvals;
    genomic data collection at Mount Sinai Hospital and the University of Toronto was covered
    by a separate protocol.
  ethics_review_board: University of South Florida Institutional Review Board
  regulatory_compliance:
  - HIPAA de-identification rules applied; a partial HIPAA waiver was obtained for recruitment
    screening; the data are covered by a Certificate of Confidentiality; a data monitoring
    committee was not appointed, and the study is not for a drug product or a medical device.
  special_populations:
  - The adult release is limited to participants aged 18 and over. Pediatric participants
    were enrolled only at pediatric sites under the same programme and are published as a
    separate dataset.
informed_consent:
- consent_obtained: true
  consent_type: Prospective written informed consent
  consent_documentation: Participants could consent by signing a physical paper copy, by indicating
    electronic consent within the application or through REDCap surveys, or by video recording
    within the application, in which case the participant read a statement aloud so that the
    recording could be used to verify that submitted acoustic data belonged to the consented
    individual. Paper consent documents were uploaded and stored electronically in REDCap;
    all consent records are retained for at least five years after study completion.
  consent_scope: Research data that does not contain direct identifiers is shared with external
    researchers for future research through a secure database. Data posing a low risk of individual
    re-identification is shared in registered access with the general public, and data that
    would pose a heightened risk if shared in full open access is shared through a controlled-access
    mechanism with authorized researchers. Consenting participants also permitted investigators
    to access medical information through EHR platforms for gold-standard validation of diagnoses
    and symptoms.
  withdrawal_mechanism: Participants are informed that they may withdraw from the study at
    any point. Withdrawal during or before completion of voice data collection means the data
    is not included in the database; once the voice data collection process is completed the
    research data, including voice recordings, cannot be removed from the database.
at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - Eligibility for this release sets a minimum age of 18 years and a maximum of 120 years;
    the documentation notes that these criteria would change when the pediatric cohort was
    introduced. Participation was voluntary and explicitly did not affect the participant's
    medical care.
  guardian_consent:
  - Where children participated in the programme, parents or guardians provided consent; parental
    permission was obtained from one or both parents, the research being minimal risk.
  assent_procedures: Children provided verbal assent where appropriate and assent was documented;
    where young children could not reasonably be asked to assent because of limitations of
    age and development, typically under seven years of age, they were not asked to do so.
license_and_use_terms:
  license_terms: Bridge2AI Voice Registered Access License, with access conditional on signature
    of the Bridge2AI Voice Registered Access Agreement. The agreement restricts use to commercial
    and non-commercial research by Authorized Researchers, forbids attempts at re-identification
    and uses that could cause harm or stigmatization, and forbids the use of intellectual
    property protections in ways that would restrict access to the data or to conclusions
    drawn from it. Data may be duplicated as reasonably required to carry out the approved
    research project, but sale of all or part of the data on any media is not permitted. No
    fees are associated with these restrictions. Raw audio is governed by a separate controlled-access
    process requiring a Data Access Request Form, a Data Use Agreement, review by the Data
    Access Compliance Office and a Data Use and Transfer Agreement signed by an authorized
    institutional official.
  data_use_permission: general_research_use
ip_restrictions:
  restrictions:
  - The data may be protected by copyright and other rights, including other intellectual
    property rights. Nothing in the agreement transfers to the recipient any intellectual
    property rights in or relating to the data. Recipients agree not to make intellectual
    property claims on the data and not to use intellectual property protection, database
    rights or related rights in ways that would prevent or block access to, or use of, any
    element of the data or conclusions drawn directly from it. Recipients may obtain intellectual
    property rights on downstream discoveries but agree to implement licensing policies that
    will not obstruct further research, and to respect the Fort Lauderdale Agreement. No IP-based
    restrictions have been imposed by third parties, and the provider gives no guarantee that
    the data is free of third-party intellectual property rights.
regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - No export controls apply to the dataset.
  other_compliance: The data is covered by a Certificate of Confidentiality, which must be
    asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant. Recipients must establish administrative,
    physical and technical safeguards adequate to protect personally identifiable information,
    must report any unauthorized use or disclosure within five business days of discovery,
    and must destroy or return the data at the end of the agreement term with written certification
    of destruction within thirty days.
  source_caveats: No source states the word "compliant"; the value is recorded from the documentation's
    statement that HIPAA de-identification rules were applied and PhysioNet's statement that
    HIPAA Safe Harbor identifiers were removed.
data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: Two tiers operate. For the features-only release, a user registers
    on PhysioNet, confirms their identity as a credentialed user, and signs the Bridge2AI
    Voice Registered Access Agreement; no additional training is required. For raw audio,
    the applicant completes a Data Access Request Form and a Data Use Agreement, submits the
    application to the Data Access Compliance Office for review, and on approval arranges
    for a Data Use and Transfer Agreement to be signed by an authorized official at their
    institution. Collaborators at other research organizations, and other research teams at
    the same organization, must apply independently and sign their own transfer and use agreement.
    The dataset provider also requires recipients to adhere to the specific requirements of
    PhysioNet.
  accountable_organization:
    name: University of South Florida Board of Trustees
  stewardship_roles:
  - The University of South Florida Board of Trustees acts as the provider institution under
    the Data Transfer and Use Agreement; the Data Access Compliance Office reviews controlled-access
    applications; the MIT Laboratory for Computational Physiology maintains the PhysioNet
    platform on which the release is published. Data transfer and data use agreements between
    collaborating universities were drafted alongside the patents and innovations office for
    the safe sharing of data, and each local principal investigator is responsible for the
    identifiable data held at their institution.
  appeal_process: The provider may unilaterally amend the transfer and use agreement should
    the federal sponsor require revision; a recipient objecting to an amendment sees the agreement
    terminate immediately and must return or destroy all data.
is_deidentified:
  identifiable_elements_present: false
  method: Removal of HIPAA Safe Harbor identifiers, combined with expert review by a team
    of ethicists and removal of the raw audio.
  identifiers_removed: Names, geographic locators, date information at a resolution finer
    than years, phone and fax numbers, email addresses, IP addresses, Social Security Numbers,
    medical record numbers, health plan beneficiary numbers, device identifiers, license numbers,
    account numbers, vehicle identifiers, website URLs, full face photographs, biometric identifiers
    and any unique identifiers. State and province were removed while the country of data
    collection was retained. Direct identifiers such as name, civic address and social security
    number were removed; indirect identifiers creating a significant re-identification risk
    in combination with public data, including select geographic or demographic identifiers
    and information about household composition or cultural identity, were also removed.
  deidentification_details: Non-identifying elements revealing highly sensitive information,
    such as household income, mental health status and traumatic life experiences, were removed.
    All raw voice data was removed because it has the potential to cause individual re-identification
    or to be used for illicit or unauthorized purposes. Spectrograms and similar dense features
    were excluded where the audio contained free speech, while static and other features that
    do not encode the sensitive information were retained. Narrative text fields were removed
    and dates rebased or replaced by integers. K-anonymization with k greater than or equal
    to two is not achieved.
