id: doi:10.13026/8xbn-nq66
name: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'The adult flagship release of the Voice project (the Bridge2AI Precision Public
  Health Grand Challenge): an ethically sourced, demographically diverse collection of data
  derived from voice recordings and linked to clinical and questionnaire information. Version
  3.1.0 covers 833 participants recruited at five sites in North America. Participants were
  selected on the basis of conditions known to manifest within the voice waveform, organized
  into disease cohort categories covering voice disorders, neurological and neurodegenerative
  disorders, mood and psychiatric disorders, and respiratory disorders, together with control
  participants; a pediatric voice and speech cohort was collected under the same program and
  is published as a separate dataset. Each participant completed a standardized protocol of
  acoustic tasks (sustained phonation, glides, loudness, diadochokinesis, breathing and cough
  sounds, read passages, free speech and cognitive-linguistic tasks) recorded on a tablet
  application, alongside demographic questions, confounder questions, disease-specific items
  and validated patient-reported outcome instruments. Diagnoses were validated against established
  gold standards by a clinician at the site of collection or from the electronic health record.
  This release contains only material judged low risk. Original audio waveforms are not distributed
  here; instead the release provides derived representations in Parquet form (spectrograms,
  Mel spectrograms, MFCCs, pitch traces, articulatory estimates from Speech Articulatory Coding,
  loudness and periodicity, and phonetic posteriorgrams), static acoustic features from openSMILE,
  Praat/Parselmouth and torchaudio, audio quality metrics, per-recording metadata, and a phenotype
  directory of tab-delimited tables with JSON data dictionaries covering confounders, demographics,
  per-condition diagnosis forms, enrollment, validated questionnaires and task records. Access
  is by PhysioNet credentialing plus signature of the Bridge2AI Voice Registered Access Agreement;
  raw audio is obtainable only through a separate controlled-access route administered by
  the project''s Data Access Compliance Office.'
notes: The project publishes a self-assessment of the dataset against the Bridge2AI AI-readiness
  recommendations, scoring FAIRness at 100 percent (findable, accessible, interoperable, reusable
  all met), Provenance at 100 percent (transparent, traceable, interpretable, key actors identified),
  Characterization at 80 percent (semantics, statistics, standards and potential sources of
  bias met, data quality not met), Pre-model explainability at 100 percent (data documentation
  templates, fit for purpose, verifiable), Ethics at 100 percent (ethically acquired, managed,
  disseminated, secure), Sustainability at 50 percent (persistent and well-governed met, domain-appropriate
  and associated not met), and Computability at 75 percent (standardized, computationally
  accessible and portable met, contextualized not met).
source_caveats: 'Referent: this record describes version 3.1.0 of the adult Bridge2AI-Voice
  release on PhysioNet, the most recent tier-1 source not marked superseded. Earlier versions,
  the Health Data Nexus release and the pediatric dataset are recorded under related_datasets
  rather than merged into the referent''s own slots. Target size: same-tier sources disagree
  on the intended eventual size of the collection. The project documentation states a flagship
  dataset "of 10,000 voices" and an anticipated enrollment count of 10,000 by 2027; the IRB
  protocol gives a sample size of 30,000 participants, and the lower-ranked audiomics white
  paper states a primary deliverable of a publicly available database of 30,000 human voices.
  The ranking does not separate the two tier-2 sources, so both figures are reported here
  and neither is preferred. Neither figure describes the released dataset, which covers 833
  participants. Name spellings: the project documentation writes "Jennifer Sui" and "Frank
  Rudzizc" where the higher-ranked PhysioNet author list writes "Jennifer Siu" and "Frank
  Rudzicz"; the PhysioNet forms are used and the discrepancy is noted on the affected creator
  entries. Hosting: the project documentation''s distribution section names the Health Data
  Nexus as the publishing platform and gives its DOI, which matches the version 1.0 release;
  the tier-1 PhysioNet pages show that the current and recent versions are published on PhysioNet.
  Both are recorded, the former under related_datasets and maintainers. conforms_to: the statement
  that the data was converted to the Brain Imaging Data Structure v1.9.0 appears in the project
  documentation''s data pre-processing section and is illustrated with the b2ai-voice-audio
  folder tree, that is, the audio dataset rather than explicitly the PhysioNet feature-only
  release; the released phenotype directory nonetheless follows the same layout. Recording
  counts: the project documentation states that version 3.0 contains approximately 61,937
  voice-derived recordings from 833 adult participants; the tier-1 version 3.1.0 page gives
  no single total and instead reports per-feature record counts, which are the figures recorded
  here. No total was computed from them, because different feature families cover overlapping
  but unequal sets of recordings.'
