  - slot: was_derived_from
    snippet: Data were exported and converted from RedCap using an open source library developed by our team
  - slot: variables[0].derivation
    snippet: computed using the short-time Fast Fourier Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT
  - slot: variables[0].derivation
