acquisition_methods:
- acquisition_details: >-
    Protein-protein interaction data acquired by affinity purification mass
    spectrometry (AP-MS) on endogenously tagged cell lines.
  was_directly_observed: true
- acquisition_details: >-
    Protein-protein interaction data acquired by size-exclusion chromatography coupled
    to mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping, as
    an orthogonal mass spectrometry-based approach to AP-MS.
  was_directly_observed: true
- acquisition_details: >-
    Spatial proteomics data acquired by immunofluorescence-based staining (ICC-IF) and
    confocal microscopy, using the Human Protein Atlas resource of antibodies. Nuclei
    were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and
    antibody against protein of interest (green channel).
  was_directly_observed: true
- acquisition_details: >-
    Genetic perturbation data acquired by single-cell CRISPR screens, using a CRISPR
    lentiviral library and the 10x Genomics 3'HT kit, in cell lines expressing
    inducible dCas9.
  was_directly_observed: true

collection_mechanisms:
- mechanism_details: >-
    Automated fixation and permeabilization protocols were established for a pipetting
    robot for the MDA-MB-468 and KOLF2 cell lines, supporting spatial proteomics
    mapping.
- mechanism_details: >-
    A CRISPR lentiviral library targeting chromatin factors with 6 guide RNAs per gene
    was designed, and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were
    generated and characterized.
- mechanism_details: >-
    Immunofluorescence images acquired by confocal microscopy of cells co-stained with
    reference markers, using Human Protein Atlas antibodies.

data_collectors:
- collector_details: >-
    Protein-protein interaction data generated by size exclusion chromatography-mass
    spectroscopy (SEC-MS) and affinity purification mass spectrometry in the Nevan
    Krogan laboratory at the University of California San Francisco.
  role: academic_institution
- collector_details: >-
    Immunofluorescence imaging of protein spatial localization performed in the
    Lundberg Lab at Stanford University.
  role: academic_institution

direct_collection:
- is_direct: false
  collection_details: >-
    Data were generated in cell culture from commercially available, ethically sourced
    human cell lines rather than collected directly from individuals. MDA-MB-468 is
    available from ATCC; the KOLF2.1J iPSC line is available from the Human Induced
    Pluripotent Stem Cells Initiative (HipSci) resource and is available for access by
    not-for-profit organizations via a simple MTA.

sampling_strategies:
- is_sample: true
  is_representative: false
  why_not_representative: >-
    Data in this release was derived from commercially available de-identified human
    cell lines and does not represent all biological variants which may be seen in the
    population at large.
  strategies: >-
    Multimodal interrogation of chromatin modifiers, metabolic enzymes, and other
    proteins involved in cancer, neuropsychiatric, and cardiac disorders, in
    disease-relevant cell lines under treated and untreated conditions.

