prohibited_uses:
- prohibition_reason: >-
    These laboratory data are not to be used in clinical decision-making or in any
    context involving patient care without appropriate regulatory oversight and
    approval.
- prohibition_reason: >-
    The dataset is licensed under Creative Commons Attribution-NonCommercial-ShareAlike
    4.0 International, which does not permit use of the material for commercial
    purposes. Commercial use requires a separate license negotiation with the copyright
    holder.

known_limitations:
- limitation_type: scope_limitation
  limitation_description: >-
    This is an interim release and does not contain predicted cell maps, which will be
    added in future releases. The current release is most suitable for bioinformatics
    analysis of the individual datasets.
- limitation_type: integration_limitation
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: coverage_limitation
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo. Perturb-seq data in
    KOLF2.1J iPSCs and in MDA-MB-468 breast cancer cells are listed as embargoed at the
    external data links.
- limitation_type: methodological_limitation
  limitation_description: >-
    Meaningful analysis requires domain expertise.
  recommended_mitigation: >-
    Users should bring functional genomics and proteomics domain expertise to the
    analysis.

known_biases:
- bias_type: representation_bias
  bias_description: >-
    Data in this release was derived from commercially available de-identified human
    cell lines and does not represent all biological variants which may be seen in the
    population at large.
  scope_impact: >-
    Findings drawn from these cell lines may not generalize across human biological
    variation.

human_subject_research:
  involves_human_subjects: false
  notes: >-
    The June 2026 release states Human Subjects: No; De-identified Samples: Yes; FDA
    Regulated: No. The CM4AI preprint states that CM4AI data are non-clinical, from
    tissue cultures, and are considered to be de-identified as they cannot be matched,
    with current knowledge, to a human subject.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The release records de-identified samples. Data were derived from commercially
    available de-identified human cell lines. The CM4AI preprint states the data are
    considered de-identified as they cannot be matched, with current knowledge, to a
    human subject.

