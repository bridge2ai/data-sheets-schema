was_derived_from: >-
  MDA-MB-468 (RRID:CVCL_0419), a triple negative breast cancer cell line established
  from a metastatic site pleural effusion of a 51-year-old black female with a
  metastatic mammary adenocarcinoma, available from ATCC; and KOLF2.1J
  (RRID:CVCL_B5P3), an induced pluripotent stem cell line derived from a healthy male
  Northern European donor, available from the Human Induced Pluripotent Stem Cells
  Initiative (HipSci) resource.

notes: >-
  CM4AI defines AI-Ready biomedical data as fully characterized FAIR data of known
  provenance, which can be ethically and reliably processed by AI applications; whose
  models and software are available and well-described for validation and re-use; and
  whose predictions may be fully explained and interpreted to the user as needed. The
  project's AI-readiness criteria are FAIR, Provenanced, Characterized, Explainable,
  and Ethical. Packaging is performed by the FAIRSCAPE framework: a client-side Python3
  application, FAIRSCAPE-CLI, creates an RO-Crate package with datasets, metadata, and
  software, and unique stubs for identifier creation; the RO-Crates are then sent to the
  FAIRSCAPE server where they are registered and assigned persistent, resolvable,
  globally unique persistent identifiers using the ARK scheme, with DOIs a future
  feature as supplementary PIDs for final-state publishable work. The server computes
  end-to-end entailments on each RO-Crate's provenance as expressed in the EVI Evidence
  Graph Ontology. FAIRSCAPE is available under the MIT open-source license; software
  comprising the Tools data integration pipeline is available under BSD-3 open source
  license.