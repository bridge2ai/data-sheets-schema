  distribution: >-
    MDA-MB-468 triple negative breast cancer cells; undifferentiated (parental)
    KOLF2.1J iPSCs; and iPSC-derived neuron progenitor cells (NPCs), neurons, and
    cardiomyocytes.
- subpopulation_elements_present: true
  identification: Treatment condition
  distribution: >-
