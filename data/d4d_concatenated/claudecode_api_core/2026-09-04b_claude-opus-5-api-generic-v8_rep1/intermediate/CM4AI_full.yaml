sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: >-
    The release records that samples are de-identified, that the work does not involve
    human subjects, and that it is not FDA regulated. Data were derived from
    commercially available de-identified human cell lines.

confidential_elements:
- confidential_elements_present: true
  confidentiality_details: >-
    Some datasets are under temporary pre-publication embargo. Perturb-seq data in
    KOLF2.1J iPSCs (undifferentiated) and Perturb-seq data in MDA-MB-468 breast cancer
    cells (with and without treatment) are listed as embargoed at their external data
    links.

preprocessing_strategies:
- preprocessing_details: >-
    Downloaded PPI networks are processed using the node2vec deep learning model to
    reduce dimensionality, producing a PPI embedding that contains information about
    the protein's interactions.
- preprocessing_details: >-
    Immunofluorescence images are processed using a Human Protein Atlas deep learning
    model to reduce dimensionality, producing an image embedding that contains
    information about protein localization.
- preprocessing_details: >-
    The PPI and image embeddings are integrated to obtain a co-embedding for each
    protein using contrastive deep learning. This integration model learns
    co-embeddings such that the original embeddings can be reconstructed with minimal
    information loss and proteins with similar PPI and image embeddings have similar
    co-embeddings.
- preprocessing_details: >-
    Community detection is performed based on the all-by-all similarities of pairs of
    proteins in the co-embedding space. The resulting hierarchy of protein communities
    is output as the final cell map.

labeling_strategies:
- labeling_details: >-
    Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to
    known protein function and pathway resources, including the Gene Ontology (GO) and
    Reactome, to determine protein assemblies in the cell map with high overlap with
    known cell biology. Second, assemblies in the cell maps are annotated using a large
    language model approach that names sets of proteins and assigns a name confidence
    score.
  data_annotation_platform: Large language model annotation pipeline

