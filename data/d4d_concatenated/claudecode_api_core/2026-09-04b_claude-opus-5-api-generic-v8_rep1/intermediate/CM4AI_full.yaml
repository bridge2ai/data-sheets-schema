source_caveats: >-
  total_file_count and total_size_bytes are this record's own computations from the
  ten files listed in the june_2026_dataverse_release file table, not figures any
  source reports. The byte total sums the three immunofluorescence archives
  (3.8 GB + 4.6 GB + 4.2 GB) and the seven smaller archives (113.3 KB, 135.8 KB,
  171.8 KB, 93.9 KB, 30.2 KB, 73.3 KB, 1.1 MB) as the release page states them,
  interpreting GB as 10^9 and KB/MB as 10^3/10^6; the page gives no exact byte counts,
  so the figure is approximate to the precision of the displayed sizes. Sources
  disagree on the immunofluorescence protein count: march_2025_dataverse_release
  (tier 5) states 563 proteins of interest per condition, while
  june_2025_dataverse_release (tier 5) and october_2025_dataverse_release (tier 1)
  state 464; june_2026_dataverse_release (tier 1, and the source that supersedes
  october_2025) carries the image archives without restating a protein count. The 464
  figure is preferred as the value of the higher-ranked and later sources and is
  recorded on the image file collections. The cm4ai.org data release page (tier 2)
  states project-wide aggregates (1,374 protein interactions; 53,788 immunofluorescent
  images; 7,023 total proteins investigated; 11,739 genes targeted; 21.4 TB data
  volume) that are attributed to the CM4AI project as a whole rather than to this
  release, and so are not carried as this release's own counts.

