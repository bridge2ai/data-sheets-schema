id: https://doi.org/10.18130/V3/HIGT4C
name: CM4AI June 2026 Data Release (Beta)
description: The June 2026 Data Release (Beta) of CM4AI, the Functional Genomics Grand Challenge
  in the NIH Bridge2AI program. CM4AI generates multi-modal data including protein-protein
  interaction (PPI), spatial localization, and genetic perturbation data in MDA-MB-468 breast
  cancer cells (with and without paclitaxel or vorinostat) and induced pluripotent stem cells
  (with and without differentiation). This Beta release includes Perturb-seq data for MDA-MB-468
  breast cancer cells with and without treatment and for undifferentiated (parental) KOLF2.1J
  iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells with and without treatment, undifferentiated
  KOLF2.1J iPSCs, and iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes;
  AP-MS data for MDA-MB-468 breast cancer cells with treatment; and immunofluorescence images
  in MDA-MB-468 breast cancer cells with and without treatment. CM4AI output data are packaged
  with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the
  FAIRSCAPE framework. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham,
  Simon Fraser University, and the Hastings Center.
notes: 'The dataset as a whole is too large to download in one operation; individual files
  below the 1.9 GB download limit may be selected from the files table, and the Data Access
  API supports programmatic access. Package files may be retrieved using the Download URL
  with a Wget command or a download manager. CM4AI defines AI-Ready biomedical data as fully
  characterized FAIR data of known provenance, which can be ethically and reliably processed
  by AI applications; whose models and software are available and well-described for validation
  and re-use; and whose predictions may be fully explained and interpreted to the user as
  needed. The project''s AI-readiness criteria are FAIR, Provenanced, Characterized, Explainable,
  and Ethical. Packaging is performed by the FAIRSCAPE framework: a client-side Python3 application,
  FAIRSCAPE-CLI, creates an RO-Crate package with datasets, metadata, and software, and unique
  stubs for identifier creation; the RO-Crates are then sent to the FAIRSCAPE server where
  they are registered and assigned persistent, resolvable, globally unique persistent identifiers
  using the ARK scheme, with DOIs a future feature as supplementary PIDs for final-state publishable
  work. The server computes end-to-end entailments on each RO-Crate''s provenance as expressed
  in the EVI Evidence Graph Ontology. FAIRSCAPE is available under the MIT open-source license;
  software comprising the Tools data integration pipeline is available under BSD-3 open source
  license. The CM4AI Ethics module employs a methodology inspired by Value-Sensitive Design
  (VSD) to develop normative standards and expectations for responsible design of datasets
  and AI technologies, and is formulating the CM4AI Life Cycle, a framework designed to elucidate
  governance milestones throughout the data generation and AI system development processes;
  the preprint states this as ongoing programme work rather than as a review applied to any
  particular release.'
source_caveats: 'total_file_count and total_size_bytes are this record''s own computations
  from the ten files listed in the june_2026_dataverse_release file table, not figures any
  source reports. The byte total sums the three immunofluorescence archives (3.8 GB + 4.6
  GB + 4.2 GB) and the seven smaller archives (113.3 KB, 135.8 KB, 171.8 KB, 93.9 KB, 30.2
  KB, 73.3 KB, 1.1 MB) as the release page states them, interpreting GB as 10^9 and KB/MB
  as 10^3/10^6; the page gives only rounded display sizes and no exact byte counts, so the
  aggregate and every per-file bytes value in file_collections are conversions of rounded
  displays rather than exact counts. Sources disagree on the immunofluorescence protein count:
  march_2025_dataverse_release (tier 5) states 563 proteins of interest per condition, while
  june_2025_dataverse_release (tier 5) and october_2025_dataverse_release (tier 1) state 464;
  june_2026_dataverse_release (tier 1, and the source that supersedes october_2025) carries
  three immunofluorescence archives without restating a protein count, and their MD5 checksums
  differ from those of the October 2025 archives, so they are not the same files. No protein
  count is therefore asserted for this release''s image collection. The cm4ai.org data release
  page (tier 2) states project-wide aggregates (1,374 protein interactions; 53,788 immunofluorescent
  images; 7,023 total proteins investigated; 11,739 genes targeted; 21.4 TB data volume) that
  are attributed to the CM4AI project as a whole rather than to this release, and so are not
  carried as this release''s own counts. The copyright allocation recorded under ip_restrictions
  is stated by march_2025_dataverse_release and june_2025_dataverse_release (both tier 5)
  and by the preprint; the June 2026 release does not restate it.'
