purposes:
- response: To deliver machine-readable hierarchical maps of cell architecture as AI-Ready
    data, produced from multimodal interrogation of chromatin modifiers, metabolic enzymes,
    and other proteins involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
    cell lines under treated and untreated conditions.
- response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
    data collected for human cell lines, to enable transformative biomedical AI research.
- response: To broadly stimulate research and development in "visible" machine learning systems
    informed by multi-scale cell and tissue architecture, which are not black boxes but are
    built directly on knowledge maps of cell and tissue architecture.
tasks:
- response: Construction of hierarchical cell maps as directed acyclic graphs, in which each
    node represents an assembly of proteins in proximity at a given scale, from large assemblies
    representing cell compartments to small assemblies such as protein complexes or subunits.
- response: Interpretation of genetic variants and mutations in human genomics using cell
    maps as a foundation.
- response: Training of visible neural networks (VNNs) to interrogate how protein assemblies
    in the cell affect cell-level phenotype predictions.
- response: Protein community detection over multimodal co-embeddings of protein-protein interaction
    and immunofluorescence image data.
addressing_gaps:
- response: In genomics and precision medicine, machine learning models are often "black boxes,"
    predicting phenotypes from genotypes without understanding the mechanisms by which such
    translation occurs. This project addresses that deficiency by generating matched data
    and tools that enable creation of visible machine learning systems built on knowledge
    maps of cell and tissue architecture.
- response: Much of cell structure remains uncharted. The project addresses the absence of
    comprehensive, machine-readable maps of human subcellular architecture across demographic
    and disease contexts.
