sampling_strategies:
- is_sample: true
  is_representative: false
  why_not_representative: Data in this release was derived from commercially available de-identified
    human cell lines and does not represent all biological variants which may be seen in the
    population at large.
  strategies: Multimodal interrogation of chromatin modifiers, metabolic enzymes, and other
    proteins involved in cancer, neuropsychiatric, and cardiac disorders, in disease-relevant
    cell lines under treated and untreated conditions.
preprocessing_strategies:
- preprocessing_details: Downloaded PPI networks are processed using the node2vec deep learning
    model to reduce dimensionality, producing a PPI embedding that contains information about
    the protein's interactions.
- preprocessing_details: Immunofluorescence images are processed using a Human Protein Atlas
    deep learning model to reduce dimensionality, producing an image embedding that contains
    information about protein localization.
