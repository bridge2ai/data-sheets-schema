known_biases:
- bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines and does not represent all biological variants which may be seen in the
    population at large.
  scope_impact: Findings drawn from these cell lines may not generalize across human biological
    variation.
known_limitations:
- limitation_type: scope_limitation
  limitation_description: This is an interim release and does not contain predicted cell maps,
    which will be added in future releases. The current release is most suitable for bioinformatics
    analysis of the individual datasets.
- limitation_type: integration_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: coverage_limitation
  limitation_description: Some datasets are under temporary pre-publication embargo. Perturb-seq
    data in KOLF2.1J iPSCs and in MDA-MB-468 breast cancer cells are listed as embargoed at
    the external data links.
- limitation_type: methodological_limitation
  limitation_description: Meaningful analysis requires domain expertise.
  recommended_mitigation: Users should bring functional genomics and proteomics domain expertise
    to the analysis.
confidential_elements:
- confidential_elements_present: true
  confidentiality_details: Some datasets are under temporary pre-publication embargo. Perturb-seq
    data in KOLF2.1J iPSCs (undifferentiated) and Perturb-seq data in MDA-MB-468 breast cancer
    cells (with and without treatment) are listed as embargoed at their external data links.
subpopulations:
- subpopulation_elements_present: true
  identification: Cell line and differentiation state
  distribution: MDA-MB-468 triple negative breast cancer cells; undifferentiated (parental)
    KOLF2.1J iPSCs; and iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes.
- subpopulation_elements_present: true
  identification: Treatment condition
  distribution: MDA-MB-468 cells untreated (DMSO control), treated with paclitaxel, and treated
    with vorinostat.
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: The release records that samples are de-identified, that the work does
    not involve human subjects, and that it is not FDA regulated. Data were derived from commercially
    available de-identified human cell lines.
acquisition_methods:
- acquisition_details: Protein-protein interaction data acquired by affinity purification
    mass spectrometry (AP-MS) on endogenously tagged cell lines.
  was_directly_observed: true
- acquisition_details: Protein-protein interaction data acquired by size-exclusion chromatography
    coupled to mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping,
    as an orthogonal mass spectrometry-based approach to AP-MS.
  was_directly_observed: true
- acquisition_details: Spatial proteomics data acquired by immunofluorescence-based staining
    (ICC-IF) and confocal microscopy, using the Human Protein Atlas resource of antibodies.
    Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and antibody
    against protein of interest (green channel).
  was_directly_observed: true
- acquisition_details: Genetic perturbation data acquired by single-cell CRISPR screens, using
    a CRISPR lentiviral library and the 10x Genomics 3'HT kit, in cell lines expressing inducible
    dCas9.
  was_directly_observed: true
collection_mechanisms:
- mechanism_details: Automated fixation and permeabilization protocols were established for
    a pipetting robot for the MDA-MB-468 and KOLF2 cell lines, supporting spatial proteomics
    mapping.
- mechanism_details: A CRISPR lentiviral library targeting chromatin factors with 6 guide
    RNAs per gene was designed, and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible
    dCas9 were generated and characterized.
- mechanism_details: Immunofluorescence images acquired by confocal microscopy of cells co-stained
    with reference markers, using Human Protein Atlas antibodies.
data_collectors:
- collector_details: Protein-protein interaction data generated by size exclusion chromatography-mass
    spectroscopy (SEC-MS) and affinity purification mass spectrometry in the Nevan Krogan
    laboratory at the University of California San Francisco.
  role: academic_institution
- collector_details: Immunofluorescence imaging of protein spatial localization performed
    in the Lundberg Lab at Stanford University.
  role: academic_institution
