    snippet: produce ethical, AI-ready datasets of cell architecture
  - slot: tasks[0].response
    snippet: 'hierarchical directed acyclic graphs (DAG), where each node represents

      an assembly of proteins in proximity at a given scale'
  - slot: tasks[1].response
    snippet: 'downstream applications in human genomics, including interpretation of genetic variants

      and mutations'
  - slot: tasks[2].response
    snippet: '“visible machine

      learning” or “visible neural networks” (VNNs) to interrogate how protein assemblies in

      the cell affect cell-level phenotype predictions'
  - slot: addressing_gaps[1].response
    snippet: Human cells are organized across a spatial hierarchy
  - slot: human_subject_research.notes
    snippet: non-clinical (from tissue
  - slot: was_derived_from
