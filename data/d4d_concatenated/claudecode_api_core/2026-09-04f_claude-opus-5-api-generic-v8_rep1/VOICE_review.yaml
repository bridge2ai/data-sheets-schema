notes: >-
  Two attribution-precision observations, no support failures: the cohort-lead
  clauses of creators[5] and creators[12] are attested in the IRB protocol's
  Table 4 (lines 3063 and 3065, chunk c012) while their receipts cite only the
  c008 roster passage — support holds, the citation is to the wrong chunk for
  that clause. The record writes the institution name "Temerty Centre" (full
  line 1135, core line 572) where the bundle's only spelling is "Center" (line
  2212); it is the institution's real name and #1004's normaliser deliberately
  leaves Capitalised matches, but it does not keep the source's spelling and
  is restorable via d4d review disposition if the curator prefers the bundle
  form. The DTUA's contact-subjects prohibition is conditional ("without IRB
  approval, written approval from Provider, and informed consent", lines
  3449-3453); participant_privacy[0].reidentification_risk states it
  unconditionally — noted on slot-018, too small to charge as misread. The
  feasibility article's funding statement gives a further award-number variant
  (#1OT2OD032720-01, line 524) that the record's award-variant caveat does not
  list; it describes that publication's funding, not the dataset's.
