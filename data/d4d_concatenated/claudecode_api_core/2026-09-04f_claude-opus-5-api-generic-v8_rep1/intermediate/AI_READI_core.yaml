title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: The AI-READI dataset is a multimodal, AI-ready dataset collected from individuals
  with and without type 2 diabetes mellitus (T2DM) and harmonized across three data collection
  sites (University of Alabama at Birmingham, University of California San Diego, and University
  of Washington). Version 3.0.0 contains data from 2,280 participants collected between 19
  July 2023 and 1 May 2025. Modalities include survey and clinical data mapped to the OMOP
  Common Data Model, 12-lead electrocardiography, retinal photography, optical coherence tomography
  (OCT), OCT angiography (OCTA), fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous
  glucose monitoring, wearable activity monitoring, and home environmental sensing. Recruitment
  sampling procedures aimed at an approximately equal distribution of participants across
  sex, race and diabetes severity, and the acquisition protocol was designed across multiple
  domains to enable downstream AI/ML analyses that may not be feasible with existing data
  sources such as claims or electronic health records data. The stated goal is to better understand
  salutogenesis, the pathway from disease to health, in T2DM. This release contains no protected
  health information; information related to the sex and race/ethnicity of participants and
  to medications used has also been removed and is held under controlled access.
notes: AI-READI is one of four Data Generation Projects funded by Bridge2AI, an NIH Common
  Fund program aimed at setting the stage for the widespread adoption of AI in healthcare
  research. The study targets 4,000 participants aged 40 and older across three sites, triple-balanced
  by self-reported race/ethnicity (Asian, Black, Hispanic, White), type 2 diabetes presence
  and severity (no diabetes; pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin
  injectable medications; insulin-controlled) and biological sex, with recruitment in waves
  adjusted to meet balancing targets. Enrollment continues after this release; the FAIRhub
  study record gives an actual start date of 19 July 2023 and an anticipated completion date
  of 1 January 2027, and the BMJ Open protocol paper states that enrollment will continue
  until 30 November 2026. Approximately 10% of the cohort is planned to return for a follow-up
  visit in year 4 of the project; version 3.0.0 contains only one visit per participant. A
  biorepository of plasma, serum, buffy coats, genomic DNA, PAXgene RNA vacutainers and peripheral
  blood mononuclear cells is being assembled at the University of Alabama at Birmingham Center
  for Clinical and Translational Science for future ancillary studies; those biospecimens
  are not part of this dataset. The project also runs a year-long research internship program
  whose inaugural 2023-2024 cohort of ten interns was 70% women, 30% Black and 50% from backgrounds
  under-represented by NIH criteria.
source_caveats: 'Institutional attribution differs across tier-1 sources and lower tiers:
  the FAIRhub metadata and the AI-READI data license name Washington University in St. Louis
  (ROR 01yc7t268) as managing organization, lead sponsor and Licensor, while the RO-Crate
  places the principal investigator in the Department of Ophthalmology at the University of
  Washington and the BMJ Open protocol paper and IRB protocol identify the reviewing IRB,
  coordinating site and PI''s institution as the University of Washington. The tier-1 FAIRhub
  values are used for the dataset''s own organizational slots and the conflict is recorded
  here. Enrollment target differs by source: FAIRhub, the Nature Metabolism comment and the
  BMJ Open protocol paper give 4,000 participants, while the University of Washington IRB
  protocol document gives 4,600; the tier-1 figure of 4,000 is used. The healthsheet is internally
  inconsistent in places: its composition section states that the dataset contains data from
  all participants enrolled "during the first year of data collection" although the same document
  elsewhere states that version 3.0.0 covers 19 July 2023 to 1 May 2025 and 2,280 participants,
  and its versioning section describes version 3.0.0 as covering data "up through the end
  of the second year of the study" while the README change table labels the added tranches
  "year 2 data" and "year 3 data". A FAIRSCAPE RO-Crate metadata record (RO-Crate 1.2-DRAFT
  profile) describes this release together with nine per-datatype subcrates, but the CDS root
  metadata file list published by FAIRhub does not include ro-crate-metadata.json, so it is
  not established from the sources whether the RO-Crate packaging forms part of the FAIRhub
  distribution; RO_CRATE is therefore not recorded among the standards the dataset content
  conforms to.'
