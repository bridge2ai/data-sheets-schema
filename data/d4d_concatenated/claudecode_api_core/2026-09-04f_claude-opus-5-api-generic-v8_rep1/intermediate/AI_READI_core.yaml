  raw_data_format: CSV
- source_description: Retinal imaging device exports from Optomed Aurora, iCare EIDON, Heidelberg
    Spectralis, Topcon Maestro2, Topcon Triton, Zeiss Cirrus 5000 and Heidelberg FLIO.
  source_type: Imaging device export
  raw_data_format: Native DICOM, .fda and .sdt files
- source_description: Dexcom G6 continuous glucose monitor exports.
  source_type: Wearable device export
  raw_data_format: CSV
- source_description: Garmin Vivosmart 5 physical activity monitor exports.
  source_type: Wearable device export
  raw_data_format: FIT
- source_description: LeeLab Anura home environmental sensor exports.
  source_type: Custom sensor export
  raw_data_format: CSV
- source_description: Laboratory results from CLIA-certified local laboratories (complete
    blood counts) and from the University of Washington Nutrition and Obesity Research Center
    (all other blood and urine assays).
  source_type: Clinical laboratory
  raw_data_format: CSV
- source_description: Electronic health records of the three study health systems, screened
    with ICD-10 diagnosis codes E11.X and R73.09 and demographic data to identify recruitment
    pools.
  source_type: Electronic health record
  access_details: Used for recruitment and screening; past health records are held under controlled
    access and are not part of this public release.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies: Non-probability sampling. The study base was patients aged 40 years or older
    with a medical encounter at one of the three health systems; patients with type 2 diabetes
    and pre-diabetes were identified by screening electronic health records for ICD-10 codes
    E11.X and R73.09. Participants were recruited in waves, with the composition and size
    of each wave influenced by the observed participation characteristics of race/ethnicity,
    gender, T2DM severity and site, and adjusted by under- and oversampling groups as needed.
    The cohort was designed to be triple-balanced by self-reported race/ethnicity, T2DM presence
    and severity, and biological sex, rather than to match the demographic distribution of
    the US population.
  source_data: Electronic health records of the University of Alabama at Birmingham, University
    of California San Diego and University of Washington health systems.
  why_not_representative: Participants are volunteers, giving rise to volunteer bias. Recruitment
    was predominantly urban and hospital-based, which may not fully capture all cultural and
    socioeconomic backgrounds, and the cohort does not include other races and ethnicities
    such as Pacific Islanders and Native Americans. Eligibility required participants to speak
    and read English.
  notes: The FAIRhub study description records the sampling method as "Non-Probability Sample".
    The healthsheet's composition section states that the dataset contains all possible instances,
    that is, all participants enrolled in the period covered by the release, and its preprocessing
    section answers the sampling-strategy question "N/A".
raw_sources:
- raw_data_details: The raw data are saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but are not anticipated to be shared outside
    the project team at present, because they have not been mapped to standardized terminologies
    and because raw data may accidentally include personal health information or personally
    identifiable information, for example in free-text fields. There is a possibility that
    raw data may be included in future releases of the controlled access dataset.
preprocessing_strategies:
- preprocessing_details: Clinical data collected through REDCap were mapped to standardized
    terminologies and to the Observational Medical Outcomes Partnership (OMOP) Common Data
    Model, with each CSV file in the clinical_data directory being a one-to-one mapping to
    an OMOP CDM table.
- preprocessing_details: 'Retinal images were exported from the imaging devices in their raw
    formats and converted to DICOM where necessary: Topcon Maestro2 and Triton images were
    exported as .fda files and converted to DICOM, and Heidelberg FLIO images were exported
    as .sdt files and converted to DICOM.'
- preprocessing_details: Wearable data were converted from proprietary formats to the Open
    mHealth standard; Garmin Vivosmart 5 data were exported in .FIT format and converted,
    and Dexcom G6 CGM data are provided under the same standard.
- preprocessing_details: Electrocardiogram data exported from the Philips PageWriter TC30
    in XML were prepared to follow the WaveForm DataBase (WFDB) file standards.
- preprocessing_details: Environmental sensor data were prepared to follow the NASA ASCII
    File Format Guidelines for Earth Science Data.
- preprocessing_details: 'The whole dataset was organized following the Clinical Dataset Structure
    (CDS) v0.1.1: one directory per datatype at the root, one directory per modality within
    each datatype, one directory per device within each modality, and one directory per participant
    within each device, with manifest.tsv metadata files per datatype and CDS metadata files
    at the root.'
- preprocessing_details: Preparation for public dissemination removed protected health information
    and, additionally, information related to the sex and race/ethnicity of participants and
    to medications used.
- preprocessing_details: Data may be statically watermarked to identify the licensee for security
    purposes; licensees agree to take no action to remove, obscure, alter or mask such watermarking.
    Watermarking is described as one of the measures implemented to prevent re-identification
    attempts, together with a robust data dissemination system and a strict license agreement.
cleaning_strategies:
- cleaning_details: 'Quality control at the time of data entry and acquisition: clinical data
    outside expected minimum and maximum ranges were flagged in REDCap and appeared in reports
    viewed by clinical research coordinators and data managers, who examined participant records
    and determined whether an error was likely. Data were checked for credibility based on
    range checks; for incorrect flow through prescribed skip patterns; for missing data that
    could be directly filled from other portions of an individual''s record; and for the omission
    or duplication of records.'
- cleaning_details: 'Editing governance: editing was only done under the guidance and approval
    of the site principal investigator. If corrected data were available from elsewhere in
    the respondent''s answers the error was corrected; if there was no logical or appropriate
    way to correct the data, the site principal investigator reviewed the values and decided
    whether they should be removed.'
- cleaning_details: 'Internal review: the dataset has not undergone any formal external audit,
    but it was reviewed internally by AI-READI team members for quality checks and to ensure
    that no personally identifiable information was accidentally included. A Data Quality
    Dashboard file (dqd_omop.json) supporting more than 3,500 OMOP CDM data quality checks
    is included with the clinical data.'
future_use_impacts:
- impact_details: The project does not currently anticipate any uses of the dataset that could
    result in unfair treatment or harm, to the extent of its knowledge, but there is a theoretical
    risk of future re-identification.
- impact_details: Because enrollment is ongoing, the pilot data release and periodic updates
    to data releases may not have achieved balanced distribution across groups; users training
    models on the current release should account for this when assessing fairness across demographic
    subgroups.
- impact_details: Factors that may limit the generalization of models derived from the dataset
    include the predominantly urban and hospital-based recruitment, which may not fully capture
    all cultural and socioeconomic backgrounds, and the absence of other races and ethnicities
    such as Pacific Islanders and Native Americans. Multiple devices were included for one
    measure to enhance generalizability and represent the broad range of equipment used in
    clinical settings, and device make, model and scan modality were documented to ensure
    repeatability.
intended_uses:
- use_category: AI and machine learning research into type 2 diabetes mellitus
  examples:
  - Reconstructing a temporal atlas of T2DM development and reversal towards health; pseudo-time
    manifold analysis to predict disease trajectories from complex multimodal data spanning
    normal to insulin-dependent disease.
  usage_notes: Access requires agreeing to use the data only for type 2 diabetes related research;
    the AI-READI data license permits research, commercial and non-commercial purposes subject
    to its restrictions.
- use_category: Multimodal AI model development
  examples:
  - Training and adapting models, algorithms and programs using the data; the license expressly
    permits making, reproducing and distributing such Licensee Models provided they do not
    themselves contain the Data or any modified version of it.
  usage_notes: Before disseminating any such model, the licensee must undertake all reasonable
    efforts to minimize the likelihood that Data can be memorized, derived, reconstructed
    or reconstituted through the use or construction of the model. A third-party model may
    be used to analyze the Data where the vendor is party to a HIPAA Business Associate Agreement
    with the licensee's institution and the interaction is short-term, such as prompting or
    querying.
- use_category: Methodological demonstration of AI-ready clinical data preparation
  examples:
  - Reuse of the AI-READI blueprint, standards and guidelines for project management and for
    data collection, management and sharing, disseminated through the project's Zenodo community,
    GitHub organization and website.
prohibited_uses:
- prohibition_reason: Making clinical treatment decisions based on the Data is prohibited,
    as the Data are intended solely as a research resource.
- prohibition_reason: Using or attempting to use the Data, alone or with other information,
    to compromise or infringe the confidentiality of information about any Data Subject, to
    invade or compromise their privacy, to identify or contact any Data Subject or group of
    Data Subjects, to extract or extrapolate identifying information, to establish a Data
    Subject's membership in a particular group of persons, or otherwise to cause harm or injury
    to any Data Subject.
- prohibition_reason: Sharing or distributing the Data with any third-party model vendor or
    developer for training or development purposes, even where that vendor is party to a Business
    Associate Agreement with the licensee's institution; training here includes model weight
    modification and other adjustments to a model's logic or operation.
- prohibition_reason: Transferring, licensing, sublicensing, selling, assigning, displaying,
    sharing or otherwise conveying any portion of the Data or any derivative work to any third
    party other than another licensee bound by an identical agreement with the Licensor.
- prohibition_reason: Reproducing the Data in papers, articles, presentations, analyses, reports
    or publications beyond small representative samples in up to five images or figures per
    paper for illustrative purposes; larger amounts may not be published, posted or made available
    via supplemental files, zip archives, code packages or other means, notwithstanding journal
    or conference requirements.
- prohibition_reason: Removing, obscuring, altering or masking the static watermarking that
    may be applied to the Data to identify the licensee for security purposes.
- prohibition_reason: Storing the Data anywhere other than on servers and devices maintained
    by and located within the licensee's institution or employer, or on cloud or remote storage
    and backup services covered by a HIPAA-approved Business Associate Agreement with that
    institution or employer.
distribution_formats:
- format: CSV
  media_type: text/csv
  notes: Declared by FAIRhub among the dataset's formats; used for the OMOP CDM clinical data
    tables and environmental sensor data.
- format: JSON
  media_type: application/json
  notes: Declared by FAIRhub among the dataset's formats; used for CDS metadata files including
    dataset_description.json, dataset_structure_description.json, study_description.json,
    participants.json and dqd_omop.json, and for the Open mHealth wearable data.
- format: MD
  media_type: text/markdown
  notes: Declared by FAIRhub among the dataset's formats; used for README.md, CHANGELOG.md
    and healthsheet.md.
- format: TSV
  media_type: text/tab-separated-values
  notes: Used for the per-datatype manifest.tsv metadata files and the root participants.tsv
    file, which carries the recommended train/validation/test split.
  source_caveats: FAIRhub's declared format list names only application/dicom, text/markdown,
    text/csv and application/json; TSV is recorded here because the CDS metadata file listings
    name manifest.tsv and participants.tsv as files in the distribution.
- notes: DICOM (media type application/dicom) is declared by FAIRhub among the dataset's formats
    and is the file format of the retinal_flio, retinal_oct, retinal_octa and retinal_photography
    directories. The schema's format and media_type enumerations do not include a DICOM value.
distribution_dates:
- release_dates: Version 1.0.0 released 3 May 2024; version 2.0.0 released 8 November 2024;
    version 3.0.0 released 17 November 2025 and recorded by FAIRhub as the date the dataset
    was made available.
  notes: The healthsheet states that the first version of the dataset was distributed in May
    2024, the second in November 2024 and the third in November 2025.
maintainers:
- role: academic_institution
  maintainer_details: The AI-READI team supports and maintains the dataset; it is hosted on
    FAIRhub through Microsoft Azure. Contact information for the owner, curator or manager
    of the dataset is given in the README file included with the dataset, and general contact
    routes are https://aireadi.org/contact and https://docs.aireadi.org/docs/3/contact.
updates:
  frequency: Approximately once a year
  update_details: The dataset is released as static versions and existing versions are not
    updated to correct labeling errors, add instances or delete instances. Instead, new versions
    are released with additional instances as more study participants complete the study visit.
    Enrollment is ongoing and future versions are expected to include larger numbers of participants.
retention_limit:
  retention_period: No limit
  retention_details: The healthsheet states that there are no applicable limits on the retention
    of the data associated with the instances.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 1.0.0 (doi 10.60775/fairhub.1, 3 May 2024, 204 participants); 2.0.0 (doi 10.60775/fairhub.2,
    8 November 2024, 1,067 participants); 3.0.0 (doi 10.60775/fairhub.3, 17 November 2025,
    2,280 participants).
  version_details: Each version is accessible through FAIRhub and carries its own DOI, and
    one version of the documentation at docs.aireadi.org is associated with each version of
    the dataset, selectable from a dropdown. The FAIRhub page for version 2.0.0 states that
    that version is no longer accessible, and the version 2.0.0 documentation carries the
    same statement. Changes between versions are detailed in the CHANGELOG file included in
    the dataset. Earlier datasheets exist for version 1.0.0 (https://docs.aireadi.org/docs/1/dataset/healthsheet)
    and version 2.0.0 (https://docs.aireadi.org/docs/2/dataset/healthsheet).
ethical_reviews:
- reviewing_organization: Washington University IRB
  review_details: IRB protocol STUDY00016228, with initial approval received 20 December 2022
    and annual renewal required within 90 days of expiration. The reviewing body is contacted
    through the IRB Reliance Team at hsdrely@uw.edu, Human Subjects Division, 4333 Brooklyn
    Ave NE Box 359470, Seattle, WA 98195-9470, United States. Reliance agreements were in
    place with the IRBs of the University of Alabama at Birmingham and the University of California,
    San Diego, which used the same consent form with minor institution-specific language.
    FAIRhub records the human subject review status as "Submitted, approved", the study as
    not FDA-regulated for drug or device, and no Data Monitoring Committee.
  source_caveats: The tier-1 RO-Crate names the reviewing body "Washington University IRB"
    while giving a contact address at the Human Subjects Division of the University of Washington;
    the tier-3 BMJ Open protocol paper and the tier-2 IRB protocol document both identify
    the reviewing body as the Institutional Review Board of the University of Washington.
    The tier-1 name is used and the conflict recorded.
- reviewing_organization: AI-READI Consortium ethics team
  review_details: The RO-Crate records the ethical review as conducted by Camille Nebeker,
    Debra Mathews, Kadija Ferryman and Nicholas Evans. Ethical, legal and social implications
    are considered at every stage of the project cycle, with guidance from bioethicists, and
    the project reviewed existing documentation approaches such as datasheets and healthsheets
    to identify the most suitable one for biomedical data.
- reviewing_organization: AI-READI Community Advisory Board
  review_details: A Community Advisory Board of eleven persons from the three sites, including
    diversity in race and ethnicity as represented in the AI-READI sample, contributed to
    the development of the protocol. The IRB protocol records that the board evaluates the
    consent forms and research protocols and that its feedback is considered in modifications.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - IRB protocol STUDY00016228. The initial IRB approval at the University of Washington was
    received on 20 December 2022, with the approval letter published at https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf.
    An annual renewal application to the IRB about the status and progress of the study is
    required and due within 90 days of expiration. FAIRhub records the human subject review
    status as "Submitted, approved".
  ethics_review_board: Washington University IRB, contacted through the IRB Reliance Team
    at hsdrely@uw.edu, Human Subjects Division, University of Washington, 4333 Brooklyn Ave
    NE Box 359470, Seattle, WA 98195-9470. Reliance agreements were in place with the IRBs
    of the University of Alabama at Birmingham and the University of California, San Diego.
  regulatory_compliance:
  - The study is not FDA-regulated for drug or device purposes and has no Data Monitoring
    Committee. Data security protections were applied at Level 3 under the University of Washington
    data classification scheme. Licensees must comply with NIH Genomic Data Sharing Policy
    security best practices.
  special_populations:
  - None targeted. Pregnancy, gestational diabetes and type 1 diabetes were exclusion criteria,
    as was age over 85. The IRB protocol states that the research is not likely to have subjects
    who become prisoners, will not recruit or obtain data from known prisoners, and will not
    actively recruit Native American or non-US indigenous populations through a tribe, tribe-focused
    organization or similar community-based organization.
  notes: The NIH RePORTER project abstract states as a plan that the project will engage in
    a tribal consultation to address barriers and facilitators of participation, with the
    goal of collecting similar data within a Native American cohort in an ethical and respectful
    manner; the Nature Metabolism comment describes engagement with the Native Biodata Consortium
    as a co-learning opportunity. Neither describes data from such a cohort as being present
    in this release.
informed_consent:
- consent_obtained: true
  consent_type: Written informed consent, obtained either electronically as e-consent through
    REDCap with an electronic signature, or in person at the start of the visit for participants
    who did not select the electronic option. For most participants, informed consent was
    performed remotely by computer, tablet or smart phone through a link in the hardcopy invitation
    letter or the invitation email.
  consent_documentation: The approved consent form for the principal project site, the University
    of Washington, is published at https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
    The other clinical sites had IRB reliance and used the same consent form, with minor institution-specific
    language incorporated depending on individual institutional requirements. Signed electronic
    consent forms were automatically emailed to participants, who could request an additional
    copy from the study coordinator for the duration of the study.
  consent_scope: Consent covered participation in the study protocol and the placement of
    data in an open-source repository, together with the sending of biospecimens to the study
    sample repository for future research. FAIRhub records the dataset consent type as "ConsentSpecifiedNotElsewhereCategorised",
    with no non-commercial, geographic, research-type, genetic-only or methods-development
    restriction flags set, and notes that the public version can only be used for type 2 diabetes
    related research while a private version will allow more generic use.
  withdrawal_mechanism: Participants were permitted to withdraw consent at any time and cease
    study participation, though data already shared or used would remain in the dataset; this
    is clearly communicated in the consent document.
at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - Pregnant women, individuals with gestational diabetes and individuals with type 1 diabetes
    were excluded from participation, as were adults older than 85 years of age. Prisoners
    were not a target population and no data were to be recruited or obtained from known prisoners.
  notes: All participants were adults aged 40 years or older who were able to provide consent,
    so no child assent or parental permission procedures applied. Transportation assistance
    in the form of rideshare services was offered to participants who reported barriers to
    transporting themselves to study visits; accessibility measurements were not specifically
    assessed.
license_and_use_terms:
  license_terms: AI-READI Data License Agreement version 2.0, with Washington University in
    St. Louis as Licensor, published at https://doi.org/10.5281/zenodo.17555036 and included
    in the dataset as LICENSE.txt. It grants a non-exclusive, non-transferable license to
    download, reproduce and use the Data and to create derivative works, for research, commercial
    and non-commercial purposes. Storage is limited to servers and devices maintained by and
    located within the licensee's institution/employer, or to cloud or remote storage and
    backup services covered by a HIPAA-approved Business Associate Agreement with that institution.
    Licensees may make, reproduce and distribute models, algorithms and programs developed,
    trained or adapted using the Data provided the models do not themselves contain the Data
    or any modified version of it, and provided reasonable efforts are made to minimize the
    likelihood that Data can be memorized, derived, reconstructed or reconstituted. Derivative
    data, including synthetic data created using the Data, are themselves considered Data
    and subject to all restrictions. Licensees must acknowledge the Licensor, source and funder
    in any papers reporting use of the Data. The agreement terminates automatically upon any
    breach, whereupon all copies must be deleted. The Data are provided "as is" without warranty,
    with liability capped at one US dollar. The license was specifically tailored to enable
    reuse of the AI-READI dataset for commercial or research purposes while placing strong
    requirements around data usage, security and secondary sharing to protect study participants,
    especially when data are reused for AI and ML applications.
  data_use_permission: disease_specific_research
  source_caveats: 'Both tier-1 sources describe the same license but name it differently:
    the FAIRhub API records the rights name as "AI-READI custom license v2.0" while the FAIRhub
    dataset page labels it "Health Data License". They are of equal rank, so both names are
    recorded.'
  notes: Access to the dataset requires logging in through a verified ID system, agreeing
    to use the data only for type 2 diabetes related research, and agreeing to the license
    terms. FAIRhub records the access type as "PublicDownloadSelfAttestationRequired". The
    recorded consent basis is "ConsentSpecifiedNotElsewhereCategorised", with the note that
    the public version of the dataset can only be used for type 2 diabetes related research
    while a private version will allow more generic use.
ip_restrictions:
  restrictions:
  - Title to the Data, and all industrial and intellectual property rights therein, remain
    solely and exclusively with the Licensor and its suppliers; the licensee must not take
    any action inconsistent with such ownership, and any rights not expressly granted are
    reserved. Data may not be reproduced in papers, articles, presentations, analyses, reports
    or publications except that small representative samples may be reproduced in up to five
    images or figures per paper for illustrative purposes only; larger amounts must not be
    published or made available via supplemental files, zip archives, code packages or other
    means, and publishers or conference organizers wishing to obtain a separate license must
    be referred to the Licensor. The healthsheet states that questions about third-party IP-based
    restrictions and about export controls or other regulatory restrictions are answered by
    reference to the license.
regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - Licensees must comply with all data security and privacy standards established by the
    US National Institutes of Health under its Genomic Data Sharing (GDS) Policy, currently
    the NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
    The Data may be statically watermarked to identify the licensee for security purposes
    and the licensee must take no action to remove, obscure, alter or mask the watermarking.
    Licensees must comply with all applicable laws, regulations and restrictions relating
    to the distribution and use of the Data and of models built from it.
  other_compliance: FAIRhub records the study as not FDA-regulated for either drug or device
    purposes, and the RO-Crate records fdaRegulated as false. The study has no Data Monitoring
    Committee.
  source_caveats: The confidentiality level recorded here is this record's mapping onto the
    schema's three-value enumeration; the RO-Crate states the confidentiality level as "HL7:2N
    (normal)" and FAIRhub records access as public download requiring self-attestation, login
    through a verified ID system and assent to the license.
data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    notes: Washington University in St. Louis, recorded by FAIRhub as the managing organization
      for the dataset and lead sponsor of the study, and named as Licensor in the AI-READI
      data license.
  committee_contact:
    id: ORCID:0000-0002-7452-1648
    email: contact@aireadi.org
    affiliation:
    - id: ROR:01yc7t268
    notes: Aaron Lee, MD, recorded by FAIRhub as the central contact and overall study official.
  access_review_process: Accessing the dataset requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to the
    license terms, which set restrictions and obligations for data usage. Conditions of access
    are published at https://fairhub.io/datasets/3/access. A licensee entering the agreement
    on behalf of an internal group, lab or business unit may sublicense to Authorized Users
    who are legal members of that group; the group must be an officially recognized subunit
    of the institution or employer, as evidenced by a public web page or other official and
    publicly available information source, and an individual's status as an Authorized User
    terminates automatically when their relationship with the group or institution ends.
  stewardship_roles:
  - The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub through
    Microsoft Azure. The data manager at each data collection site was responsible for quality
    control of all data before uploading to FAIRhub, and the central project team performed
    further processing in preparation for dissemination.
  source_caveats: The RO-Crate names the data governance committee as the AI-READI Consortium.
    The tier-3 BMJ Open protocol paper states that the requirements for controlled access
    datasets were being developed by a Data Access Committee; that committee governs the controlled-access
    release rather than this public one.
is_deidentified:
  identifiable_elements_present: false
  method: No active de-identification was necessary because no identifiers were collected;
    the project checked that no data identifiable under US HIPAA were present. FAIRhub records
    the de-identification type as "NoDeIdentification" with direct-identifier and HIPAA flags
    set, and records that dates, non-arrayed values and k-anonymity treatments were not applied.
  identifiers_removed: No protected health information is present. Information related to
    the sex and race/ethnicity of the participants and to medications used has also been removed
    from this release.
  deidentification_details: The RO-Crate records the release as de-identified. The healthsheet's
    questions on de-identification pre-processing and on measures taken to avoid re-identification
    are left blank; the dataset was reviewed internally by AI-READI team members to ensure
    that no personally identifiable information was accidentally included.
  source_caveats: The tier-1 FAIRhub metadata states that no active de-identification was
    necessary, while the tier-3 Nature Metabolism comment states that the public set is stripped
    of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe Harbor
    method, as well as information related to sex and race/ethnicity to prevent stigmatization
    of findings. The tier-1 statement is used for the method and both are recorded.
is_tabular: false
external_resources:
- external_resources: AI-READI dataset documentation, https://docs.aireadi.org
  restrictions:
  - None; the documentation is shared under the CC-BY 4.0 license. It is versioned in parallel
