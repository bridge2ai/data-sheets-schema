instances:
- instance_type: An individual human research participant; each instance consists of all the
    data available for one individual participating in the study.
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: No explicit label or target is associated with each data instance. No
    specific labeling was performed, as the dataset is hypothesis-agnostic and aimed at facilitating
    multiple potential downstream AI/ML applications.
  missing_information:
  - missing: Modality coverage for individual participants
    why_missing:
    - Not all modalities are available for all participants. Some participants elected not
      to participate in some study elements; in a few cases the data collection device had
      no stored results or was returned too late to retrieve the results (for example the
      battery died or data were lost); and in a few cases a data collision at some point in
      the process caused data loss.
  - missing: Sex, race, ethnicity and medications used
    why_missing:
    - Removed from this public release; these variables are held under controlled access together
      with 5-digit zip code, genetic sequencing data, past health records, and traffic and
      accident reports.
  - missing: Snellen visual acuity variables
    why_missing:
    - Dropped in version 3.0.0 of the dataset, such that only logMAR visual acuity measurements
      are available.
  notes: The modalities collected for each participant encompass tabular data, imaging data,
    and physiological signal and waveform data. There is no unstructured text data in the
    dataset.
anomalies:
- anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: In wearable device data, improper use and technical failures such as battery
    failure or system malfunction are expected. For the Garmin Vivosmart 5 there are gaps
    in data collection because the battery had to be charged every two to three days.
- anomaly_details: In imaging data, patient uncooperation, noise that may obscure the images,
    technical failures such as system malfunction, and data transfer failures are expected.
- anomaly_details: In a few cases a data collision occurred at some point in the processing
    pipeline and data were lost.
- anomaly_details: Image quality varies for the handheld undilated Optomed Aurora fundus camera,
    both between participants and within the same participant, because obtaining a good view
    is challenging without dilation and the device is handheld. FLIO is performed last in
    the visit because it takes longer than a standard Spectralis OCT and exposes participants
    to uncomfortable levels of light, so participant compliance may not be at its best. The
    FLIO device cannot tolerate more than one centimeter of movement during image acquisition.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias, which may limit the generalizability of results to those who are not represented
    in the study population.
- bias_type: sampling_bias
  bias_description: Participants were drawn from the patient populations of three urban academic
    health systems by screening electronic health records, and recruitment proceeded in waves
    whose composition was adjusted to meet balancing targets.
  mitigation_strategy: Uniform data collection protocols were implemented for all subjects
    irrespective of race/ethnicity, biological sex or diabetes severity across all study sites,
    and three geographically distinct study sites were selected to ensure varied representation
    and minimize the potential for sampling bias.
- bias_type: representation_bias
  bias_description: Recruiting Black men into health research is well documented as more difficult
    than recruiting other populations, in part because of medical mistrust and fear of safety
    stemming from historical events such as the Tuskegee syphilis study, and similar under-recruitment
    trends have been reported for Hispanic and Asian persons, all of whom bear a disproportionate
    burden of type 2 diabetes.
  affected_subsets:
  - Black, Hispanic and Asian participants.
  mitigation_strategy: Recruitment materials were tailored and a personalized, participatory
    approach was used; if sample balancing on race and ethnicity emerges as a challenge, new
    recruitment strategies will be implemented to overcome the imbalance.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: While the cross-sectional database ultimately aims to achieve balance
    across race/ethnicity, biological sex, and diabetes presence and severity, the released
    data are not balanced across these parameters. Recruitment was predominantly urban and
    hospital-based and may not fully capture all cultural and socioeconomic backgrounds, and
    the cohort does not include other races and ethnicities such as Pacific Islanders and
    Native Americans.
  scope_impact: May limit the generalization of models derived from the dataset to populations
    and settings not represented in the cohort.
  recommended_mitigation: Use of the recommended train/validation/test split, in which validation
    and test sets are balanced as far as possible for sex, race/ethnicity and diabetes status.
- limitation_type: coverage_limitation
  limitation_description: Eligibility restricted the cohort to adults aged 40 to 85 who were
    able to provide consent and able to read and speak English. Pregnancy, gestational diabetes
    and type 1 diabetes were exclusion criteria. Requiring participants to speak, read and
    understand English may have created challenges in recruiting Hispanic and Asian persons.
- limitation_type: scope_limitation
  limitation_description: The public release omits sex, race, ethnicity and medications used,
    along with 5-digit zip code, genetic sequencing data, past health records, and traffic
    and accident reports, which are held under controlled access. Marijuana use was not assessed
    for participants living in Alabama because it is an illegal substance there.
- limitation_type: temporal_limitation
  limitation_description: The design is cross-sectional and there is currently only one visit
    per participant, so the release does not support within-participant longitudinal analysis.
- limitation_type: methodological_limitation
  limitation_description: No labels, targets or gold-standard annotations are provided, and
    there are no formal guidelines for researchers creating new labels or defining new tasks.
