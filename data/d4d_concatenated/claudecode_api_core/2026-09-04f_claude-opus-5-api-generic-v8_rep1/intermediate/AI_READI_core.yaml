purposes:
- response: To enable future generations of artificial intelligence and machine learning research
    to provide critical insights into type 2 diabetes mellitus, including salutogenic pathways
    to return to health.
- response: To develop a foundational dataset in type 2 diabetes mellitus, agnostic to existing
    classification criteria or biases, that can be used to reconstruct a temporal atlas of
    T2DM development and reversal towards health (salutogenesis).
- response: To establish standards, best practices and guidelines for the collection, preparation
    and sharing of data for AI/ML purposes, so that the approach can serve as a model for
    future efforts to develop other medical and health datasets targeted at AI/ML.
tasks:
- response: Downstream pseudo-time manifold analysis, an approach used to predict disease
    trajectories by collecting and learning from complex, multimodal data from participants
    with differing disease severity (normal to insulin-dependent T2DM).
- response: Multimodal AI/ML model development for studying the pathogenesis and salutogenesis
    of type 2 diabetes mellitus.
addressing_gaps:
- response: A major barrier to AI-based research in type 2 diabetes has been the lack of diverse
    datasets that are AI ready for training AI models; the AI-READI dataset is intended to
    fill that gap.
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large and inclusive
    multimodal datasets.
- response: A meta-epidemiological review of type 2 diabetes studies published from 2000 to
    2020 found that samples lacked racial and ethnic diversity; the balanced AI-READI cohort
    is intended to address these demographic inequities in research.
