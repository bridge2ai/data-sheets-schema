  notes: The healthsheet states that the dataset is self-contained but relies on this documentation
    for users requiring additional information about its provenance.
- external_resources: AI-READI project website, https://aireadi.org
  notes: Carries team information (https://aireadi.org/team), contact details (https://aireadi.org/contact)
    and information on data availability and access (https://aireadi.org/goals/data-sharing).
- external_resources: Zenodo community of the AI-READI project, https://zenodo.org/communities/aireadi
  notes: Hosts the AI-READI data license and other project outputs.
- external_resources: GitHub organization of the AI-READI project, https://github.com/AI-READI
- external_resources: 'AI-READI Consortium. AI-READI: rethinking AI data collection, preparation
    and sharing in diabetes research and beyond. Nature Metabolism 2024;6:2210-2212. https://doi.org/10.1038/s42255-024-01165-x'
  notes: Listed by the RO-Crate as an associated publication for the release.
- external_resources: Owsley C, Matthies DS, McGwin G, et al. Cross-sectional design and protocol
    for Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI).
    BMJ Open 2025;15:e097449. https://doi.org/10.1136/bmjopen-2024-097449
  notes: Open access under the Creative Commons Attribution Non Commercial (CC BY-NC 4.0)
    license; describes the study design and data collection protocol behind the dataset.
- external_resources: ClinicalTrials.gov record NCT06002048, https://classic.clinicaltrials.gov/ct2/show/NCT06002048
  notes: Recorded by FAIRhub as a secondary identifier for the study.
- external_resources: Clinical Dataset Structure (CDS) specification v0.1.1, https://cds-specification.readthedocs.io/en/v0.1.1/
  notes: A new standard developed as part of the project as a simple and intuitive way to
