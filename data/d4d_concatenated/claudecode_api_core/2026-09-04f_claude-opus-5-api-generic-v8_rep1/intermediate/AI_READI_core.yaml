acquisition_methods:
- was_directly_observed: true
  acquisition_details: Laboratory results, vital signs, physical measurements, cognitive and
    vision testing, 12-lead electrocardiography, retinal imaging, continuous glucose monitoring,
    wearable activity monitoring and home environmental sensing were directly observed or
    instrument-recorded during the single study visit and the subsequent ten-day at-home monitoring
    period.
- was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: Survey and questionnaire responses were reported by subjects. Verification
    of data entry was performed where possible; for example, entered medications were cross-referenced
    with medications that participants physically brought in or photographed.
collection_mechanisms:
- mechanism_details: 'REDCap was used to collect patient-reported questionnaire data and the
    following clinical data from the visit: medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament test results and complete blood count results. REDCap
    was also used for the online recruitment interface and for electronic consent.'
- mechanism_details: 12-lead electrocardiogram recorded with a Philips PageWriter TC30 Cardiograph
    while the participant sat in a reclining chair or lay supine, with the position recorded
    (0, 30, 60 or 90 degrees relative to supine); exported in XML.
- mechanism_details: Dexcom G6 real-time integrated continuous glucose monitoring system,
    worn continuously for ten days, recording blood glucose every five minutes; participants
    were masked to the results during the monitoring period. Exported in CSV.
- mechanism_details: Garmin Vivosmart 5 physical activity monitor, worn on the participant's
    chosen wrist for ten consecutive days at a sampling frequency of five seconds, recording
    steps, heart rate, respiratory rate, oxygen saturation, stress and sleep. Exported in
    FIT format and converted to the Open mHealth standard.
- mechanism_details: LeeLab Anura, a custom-designed home environmental sensor built for the
    AI-READI project and placed in a frequently used area of the participant's home for ten
    days, recording ambient temperature, relative humidity, nitrogen oxides, volatile organic
    compounds, particulate matter (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral light
    intensity measurements. Exported in CSV.
- mechanism_details: Retinal imaging under dilated conditions (except the Optomed device)
    using Optomed Aurora IQ handheld fundus camera, iCare EIDON widefield truecolor confocal
    fundus system, Heidelberg Spectralis HRA OCT/OCTA, Topcon Maestro2 3D OCT-1, Topcon Triton
    DRI OCT, Zeiss Cirrus 5000 Angioplex and Heidelberg fluorescence lifetime imaging ophthalmoscopy.
    Images were exported in the devices' raw formats and converted to DICOM where necessary.
  notes: Topcon Corporation, Optomed, iCare World and Carl Zeiss loaned devices for research
    purposes at no cost, and Heidelberg Engineering, Dexcom and Garmin provided research discounts
    on study devices.
- mechanism_details: Vision testing with the M&S Technologies Electronic Visual Acuity tester
    at four meters for photopic and mesopic best-corrected visual acuity, the Mars Letter
    Contrast Sensitivity chart (Perceptrix) read monocularly under photopic and mesopic conditions
    using a neutral density occluder, and the Topcon KR-800 auto keratometer/refractor for
    autorefraction. Lensometers used across sites were the NIDEK LM-600P, Topcon CL-200 and
    Topcon CL-300.
- mechanism_details: Blood pressure and heart rate measured twice, two minutes apart, with
    an automatic oscillometric medically approved device; devices used across sites were the
    OMRON HEM 907XL, the Medline MDS4001 Automatic Digital Blood Pressure Monitor and the
    Welch Allyn 6000 series vital signs monitor with FlexiPort reusable cuff.
- mechanism_details: Montreal Cognitive Assessment administered electronically on an iPad
    using the MoCA Duo application, capturing the total score, section subscores, Memory Index
    Score and task completion times; exported in CSV.
- mechanism_details: Peripheral neuropathy assessed with the 10 g monofilament test on both
    feet with shoes and socks removed, three locations per foot and ten applications per location,
    with the participant's eyes closed and responses recorded on an iPad, laptop or paper
    questionnaire and entered into REDCap.
- mechanism_details: Non-fasting blood (approximately 53 mL) and a urine specimen collected
    during the visit. Complete blood counts were run on fresh whole blood by CLIA-certified
    laboratories local to each site; all other assays were performed by the University of
    Washington Nutrition and Obesity Research Center on stored frozen samples batch-shipped
    on dry ice approximately quarterly. Results were provided in CSV.
collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: Period during which the data included in version 3.0.0 were collected,
    recorded by FAIRhub as the "Collected" date range and repeated in the dataset README and
    healthsheet.
  source_caveats: The BMJ Open protocol paper states that enrollment began on 18 July 2023
    and that a preliminary pilot enrollment ran from 18 July 2023 to 30 November 2023, with
    formal data collection beginning 1 December 2023. Where the start date conflicts, the
    tier-1 FAIRhub value of 19 July 2023 is used.
data_collectors:
- role: Clinical research coordinators and research assistants at the three data collection
    sites
  collector_details: All research personnel at the three data sites who recruited, enrolled
    and collected data underwent training by the data manager at the University of Alabama
    at Birmingham and worked from a detailed Manual of Procedures. A certification process
    was required of all coordinators, including mandatory institutional compliance training
    for human subject research, and before enrolling participants each coordinator had to
    successfully administer all protocol elements to at least three volunteer practice subjects.
    Data managers at each site oversaw the process and were responsible for quality control
    of all data before upload.
- role: AI-READI project team
  collector_details: Team members involved in the data collection process are listed at https://aireadi.org/team.
    Their effort was supported by National Institutes of Health award OT2OD032644 based on
    percentage of effort contributed, with salaries aligned to the funding guidelines at each
    site.
missing_data_documentation:
- missing_data_patterns: Not all modalities are available for all participants; coverage is
    incomplete at the level of whole modalities rather than of individual measurements within
    a modality.
  missing_data_causes: Some participants elected not to participate in some study elements.
    In a few cases the data collection device did not have any stored results or was returned
    too late to retrieve the results (for example the battery died or the data were lost).
    In a few cases a data collision occurred at some point in the process and data were lost.
    In survey data, skipped questions and incomplete responses are expected. Garmin activity
    monitoring has gaps because the device battery had to be charged every two to three days.
  handling_strategy: During REDCap-based quality control, missing data that could be directly
    filled from other portions of an individual's record were filled, under the guidance and
    approval of the site principal investigator; where there was no logical or appropriate
    way to correct the data, the site principal investigator reviewed the values and decided
    whether they should be removed. No instances were excluded from the dataset at the time
    of preprocessing.
