notes: >-
  Instrument findings, not verdicts: (1) the receipt's c019 block is a systematic
  one-chunk misattribution — c019 (5141-5361) is Dataverse UI boilerplate, and its
  ~25 pairs actually sit in c018/c020; the deterministic validator already reports
  this (30 adjacent + 3 elsewhere of 186 snippets) and does not gate it, so the
  receipt's status for c019 (extracted) is also wrong on its face, where
  nothing_relevant or redundant_with would have been true. (2) The c019 block also
  receipts 'Sali A' at creators[43] while the record's Sali is creators[44]
  (Ravitsky holds [43]); the identity join is what keeps that from misreporting.
  (3) errata[0] besides its rule-17 problem is internally garbled: 'The June 2025
  Data Release was published as a revision of the preceding June 2025 release'.
  (4) The pack's claims sidecar is null; receipts were judged from the coverage
  receipt directly. (5) slot-018 and slot-024 are the two adverse receipted items:
  one wrong-subject passage left citing a rewritten value, one wrong-referent value
  under a correct passage — the latter introduced at reconciliation, which replaced
  the constructed publisher base URL with the dataset page URL instead of the
  attested organization name.
