notes: >-
  Three receipt entries cite a chunk adjacent to the one that actually holds
  their passage: the Nature Metabolism acknowledgments (cited c008, text at
  line 2013 in c007, affects slot-005 and the device-loan notes), the FAIRhub
  oversightModule (cited c020, text at lines 4719-4721 in c019, affects
  slot-020), and the IRB stipend/transport passage (cited c026, text at lines
  6613-6614 in c025, affects slot-065 and compensation entries). Support holds
  in each case; these are attribution-precision findings for the receipt
  validator's elsewhere/adjacent class, not verdicts against the record. The
  pack lists no gaps and no claim-receipt sidecar (claims: null). The one
  adverse rule verdict (rule-03) is narrow: the referent choice is held
  consistently in both records but is nowhere stated in the reconciliation
  report.
