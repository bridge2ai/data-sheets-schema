  extracted:
  - slot: description
    snippet: 'produce ethical, AI-ready datasets of cell architecture, inferred from multimodal

      data collected for human cell lines'
  - slot: purposes[2].response
    snippet: 'produce ethical, AI-ready datasets of cell architecture, inferred from multimodal

      data collected for human cell lines, to enable transformative biomedical AI research'
  - slot: purposes[0].response
    snippet: 'objective is to deliver machine-readable hierarchical maps of cell architecture

      as AI-Ready data produced from multimodal interrogation'
  - slot: notes
    snippet: 'three pillars – Data, People, and Ethics – organized into six

      modules'
  - slot: notes
    snippet: 'Cell maps are hierarchical directed acyclic graphs (DAG), where each node represents

      an assembly of proteins in proximity at a given scale'
  - slot: addressing_gaps[0].response
    snippet: machine learning models are often "black boxes,"
  - slot: conforms_to
    snippet: 'packaged with provenance graphs and rich metadata as AI-Ready

      datasets in RO-Crate format'
  - slot: raw_data_sources[0].source_description
    snippet: 'MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established

      from a metastatic site pleural effusion of a 51-year-old black female'
  - slot: raw_data_sources[0].access_details
    snippet: available from ATCC
  - slot: raw_data_sources[1].source_description
    snippet: 'The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male

      Northern European donor'
  - slot: raw_data_sources[1].access_details
    snippet: 'available for access by non-for-profit organizations via

      a simple MTA'
  - slot: collection_mechanisms[0].mechanism_details
    snippet: 'established

      automated fixation and permeabilization protocols for the pipetting robot'
  - slot: collection_mechanisms[1].mechanism_details
    snippet: designed a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene
  - slot: collection_mechanisms[2].mechanism_details
    snippet: 'using the 10x

      Genomics 3''HT kit'
  - slot: acquisition_methods[0].acquisition_details
    snippet: we employed AP-MS on endogenously tagged cell lines
  - slot: acquisition_methods[1].acquisition_details
    snippet: 'size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for

      proteome-wide complex/interaction mapping'
  - slot: acquisition_methods[2].acquisition_details
    snippet: 'immunofluorescence (IF) subcellular

      microscopy for spatial proteomics data'
  - slot: acquisition_methods[3].acquisition_details
    snippet: single-cell CRISPR-Cas perturbation screens by cell type
  - slot: direct_collection[0].collection_details
    snippet: are non-clinical (from tissue
  - slot: human_subject_research.notes
    snippet: 'considered to be de-identified as they cannot be matched, with current

      knowledge, to a human subject'
- id: c011
  status: extracted
  extracted:
  - slot: preprocessing_strategies[0].preprocessing_details
    snippet: Downloaded PPI networks are processed using the node2vec deep learning model
  - slot: preprocessing_strategies[1].preprocessing_details
    snippet: IF images are processed using a Human Protein Atlas deep learning model
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: 'The PPI and image embeddings are integrated to obtain a co-embedding for each

      protein using contrastive deep learning'
  - slot: preprocessing_strategies[3].preprocessing_details
    snippet: 'Community detection is performed based on the all-by-all similarities of pairs of

      proteins in the co-embedding space'
  - slot: labeling_strategies[0].labeling_details
    snippet: 'cell maps are aligned to

      known protein function and pathway resources, including the Gene Ontology (GO)'
  - slot: machine_annotation_tools[0].tool_descriptions
    snippet: 'large

      language model (LLM) approach that we developed to name sets of proteins and assign

      a name confidence score'
