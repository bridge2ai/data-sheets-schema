distribution_formats:
- format: JSON
  media_type: application/json
  notes: >-
    Listed among the dataset's distribution formats; used for the CDS metadata files at the root of
    the release and for the OMOP data quality dashboard file.
- format: CSV
  media_type: text/csv
  notes: >-
    Listed among the dataset's distribution formats; used for the OMOP CDM clinical data tables and
    for delimited sensor exports.
- format: MD
  media_type: text/markdown
  notes: >-
    Listed among the dataset's distribution formats; used for README.md, CHANGELOG.md and
    healthsheet.md.
- notes: >-
    DICOM (application/dicom) is listed first among the dataset's distribution formats and is the
    file format standard for all four retinal imaging directories.
- notes: >-
    Access method rather than file format: the dataset is distributed through the FAIRhub platform,
    with an access type of PublicDownloadSelfAttestationRequired. Accessing the dataset requires
    logging in through a verified ID system, agreeing to use the data only for type 2 diabetes
    related research, and agreeing to the license terms, which set certain restrictions and
    obligations for data usage. The v3.0.0 documentation additionally describes a mini-subset
    version of the dataset and Azure Storage access. All data files are in formats accessible with
    free software commonly used for such data types, so no specific software is required.
  access_urls:
  - https://fairhub.io/datasets/3/access
  - https://fairhub.io/datasets/3

distribution_dates:
- release_dates:
  - 'Version 1.0.0: 3 May 2024'
  - 'Version 2.0.0: 8 November 2024'
  - 'Version 3.0.0: 17 November 2025'
  notes: >-
    The healthsheet records the three distributions as May 2024, November 2024 and November 2025;
    the FAIRhub version list gives the precise dates. The 2025-11-17 date is also recorded as the
    date the dataset was made available on FAIRhub and as the RO-Crate publication date.

third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed to third parties outside the creating entity and is available for
    public use through the FAIRhub platform. Onward sharing by licensees is tightly bounded: a
    licensee may not transfer, license, sublicense, sell, assign, display, share or otherwise convey
    any portion of the Data or any derivative work to any third party other than another licensee
    bound by an identical agreement, and then only for the purpose of collaborating on one or more
    projects involving the Data.

intended_uses:
- use_category: AI/ML research on type 2 diabetes mellitus
  usage_notes: >-
    The multimodal dataset is gathered to facilitate downstream pseudotime manifolds and various
    applications in artificial intelligence. Use of the public version is restricted by consent and
    license to type 2 diabetes related research.
  examples:
  - Studying salutogenesis, the pathway from disease to health, in T2DM
  - Multimodal model development across imaging, waveform, wearable and tabular clinical data
- use_category: Disease trajectory modeling
  usage_notes: >-
    Data collection was specifically designed to permit downstream pseudotime manifold analysis, an
    approach used to predict disease trajectories by learning from complex, multimodal data from
    participants with differing disease severity, ranging from normal to insulin-dependent T2DM,
    with the long-term objective of reconstructing a temporal atlas of T2DM development and reversal
    towards health.
- use_category: Model training, validation and testing using the recommended splits
  usage_notes: >-
    The recommended 70%/15%/15% split distributed in participants.tsv is intended for subsequent
    training, validation and testing, with validation and test sets balanced as well as possible for
    sex, race/ethnicity and diabetes status, and is described as aimed at reducing disparities in
    models developed using this dataset.

prohibited_uses:
- prohibition_reason: >-
    The license forbids making clinical treatment decisions based on the Data, as it is intended
    solely as a research resource.
- prohibition_reason: >-
    The license forbids using or attempting to use the Data, alone or in concert with other
    information, to compromise or otherwise infringe the confidentiality of information about a
    Data Subject, to invade or compromise their privacy, to attempt to identify or contact any Data
    Subject or group of Data Subjects, to extract or extrapolate identifying information, to
    establish a Data Subject's membership in a particular group of persons, or otherwise to cause
    harm or injury to any Data Subject.
- prohibition_reason: >-
    The license forbids sharing or distributing Data with any third party model vendor or developer
    for training or development purposes, even where that vendor is party to a Business Associate
    Agreement with the licensee's institution, where training includes model weight modification and
    other adjustments to a model's logic or operation. A third party model may be used to analyze
    the Data only if the vendor is party to such an agreement and the model's interaction with the
    Data is limited to short-term interaction such as prompting or querying.
- prohibition_reason: >-
    The license forbids transferring, licensing, sublicensing, selling, assigning, displaying,
    sharing or otherwise conveying any portion of the Data or any derivative work to any third party
    other than another licensee bound by an identical agreement.
- prohibition_reason: >-
    The license forbids reproducing Data in papers, articles, presentations, analyses, reports or
    publications except that small representative samples may be reproduced in up to five images or
    figures per paper for illustrative purposes only; larger amounts must not be published, posted
    or otherwise made available via supplemental files, zip archives, code packages or other means,
    notwithstanding journal or conference requirements.
- prohibition_reason: >-
    Access to the public dataset is conditioned on agreeing to use the data only for type 2 diabetes
    related research; the consent metadata records that the public version can only be used for that
    purpose, while a private version allows more generic use.
- prohibition_reason: >-
    The license forbids taking any action to remove, obscure, alter or mask the static watermarking
    that may be applied to identify the licensee for security purposes.
- prohibition_reason: >-
    The license restricts storage to servers and devices maintained by and located within the
    licensee's institution or employer, or to cloud or remote storage and backup services that have
    a HIPAA-approved Business Associate Agreement in place with that institution or employer.

future_use_impacts:
- impact_details: >-
    A theoretical risk of future re-identification exists. AI algorithms can infer individual
    patient characteristics and could facilitate individual-level identification, so the project
    implements a robust data dissemination system, a strict license agreement and data watermarking
    for both public and controlled sets, and the license requires licensees who disseminate models
    trained on the Data to undertake all reasonable efforts to minimize the likelihood that Data can
    be memorized, derived, reconstructed or reconstituted through the use or construction of those
    models. Beyond this, the healthsheet states that the creators do not currently anticipate uses
    of the dataset that could result in unfair treatment or harm.
- impact_details: >-
    Because enrollment is ongoing and periodic releases may not have achieved balanced distribution
    across race/ethnicity, sex and diabetes severity, models developed on this version may reflect
    residual imbalance; future users should note that the balance targets apply to the completed
    cohort rather than to this interim release.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms:
