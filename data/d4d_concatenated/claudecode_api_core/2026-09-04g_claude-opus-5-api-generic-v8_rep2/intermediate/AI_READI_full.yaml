    https://doi.org/10.5281/zenodo.17555036, is a custom license tailored to enable reuse of the
    AI-READI dataset for commercial or research purposes while placing strong requirements around
    data usage, security and secondary sharing to protect study participants, especially when data
    are reused for AI and ML applications.
  - >-
    The Licensor is Washington University in St. Louis; the license grants the Licensee a
    non-exclusive and non-transferable license to download, reproduce and use the Data and to
    create derivative works of the Data, for research, commercial and non-commercial purposes.
  - >-
    A Licensee may enter the agreement individually or on behalf of an Authorized Group within an
    Institution or Employer, in which case Authorized Users who are legal members of that group by
    contract, employment or student status may exercise the same rights; their rights terminate
    automatically on severance of the relationship, and the Licensee is fully liable for their acts
    and omissions.
  - >-
    Derivative data, including synthetic data created using the Data or derivative data, are
    considered Data and subject to all the same restrictions.
  - >-
    Licensees are permitted to make, reproduce and distribute Licensee Models developed, trained or
    adapted using the Data, provided those models do not themselves contain the Data or any modified
    version of it.
  - >-
    Licensees must acknowledge the Licensor and the source and any funder of the Data in any papers
    reporting use of the Data, following the citation instructions at docs.aireadi.org.
  - >-
    The Data are provided on an "as is" basis without warranty of any kind; liability is limited in
    the aggregate to one U.S. dollar except where applicable law prohibits such limitation, and the
    Licensee indemnifies the Licensor against claims arising from use of the Data or of any model.
  - >-
    The agreement terminates automatically on any breach, upon which the Licensee must delete all
    copies of the Data in its possession and control and cease all use.
  notes: >-
    The FAIRhub dataset pages label the license "Health Data License". The IRB protocol records that
    there are no plans for the researchers collecting the dataset to develop commercial products or
    file patents, but that the dataset will be publicly available with a commercial-friendly
    open-source license and that products or patents may be developed from it in the future.

ip_restrictions:
  restrictions:
  - >-
    Title to the Data, and all industrial and intellectual property rights therein, remains solely
    and exclusively with the Licensor and its suppliers at all times, and the Licensee must not take
    any action inconsistent with such ownership.
  - >-
    Any rights not expressly granted in the license are reserved to the Licensor and its suppliers.
  - >-
    Licensees may refer publishers and conference organizers to the Licensor if they wish to obtain
    a separate license to the Data for publication purposes.
  - 'The RO-Crate records the copyright notice "Copyright © 2026 AI-READI".'
  notes: >-
    The healthsheet answers the questions about third-party IP-based restrictions and about
    copyright or terms of use by referring to the license at https://doi.org/10.5281/zenodo.17555036.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    Licensees must comply with all data security and privacy standards established by the U.S.
    National Institutes of Health under its Genomic Data Sharing Policy from time to time, currently
    the NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
  - >-
    Licensees must comply with all applicable laws, regulations and restrictions relating to the
    distribution and use of the Data and Models.
  - >-
    The Data may be statically watermarked to identify the Licensee for security purposes, and the
    Licensee agrees to take no action to remove, obscure, alter or mask such watermarking.
  other_compliance: >-
    The study is recorded as not FDA-regulated for drugs and not FDA-regulated for devices, and the
    RO-Crate records fdaRegulated as false with no human subject exemption claimed.
  notes: >-
    The confidentiality level is recorded here as "restricted" because access requires verified-ID
    login, a self-attestation of purpose and acceptance of the license; the RO-Crate itself states a
    confidentiality level of "HL7:2N (normal)". The HIPAA status is recorded as compliant on the
    basis that the released data contain no protected health information, the de-identification
    metadata sets deIdentHIPAA true, and the public set was stripped of PHI via the HIPAA Privacy
    Rule Safe Harbor method.

data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    name: Washington University in St. Louis
    id: ROR:01yc7t268
    notes: >-
      Recorded as the managing organization of the dataset, as the lead sponsor of the study, and as
      the Licensor of the AI-READI Data License Agreement v2.0.
  access_review_process: >-
    Accessing the dataset requires several steps: logging in through a verified ID system, agreeing
    to use the data only for type 2 diabetes related research, and agreeing to the license terms,
    which set certain restrictions and obligations for data usage. The FAIRhub access type is
    recorded as PublicDownloadSelfAttestationRequired, and the conditions of access are published at
    https://fairhub.io/datasets/3/access. The full dataset, including the controlled variables, is
    accessible by entering into a data use agreement.
  stewardship_roles:
  - >-
    The data manager at each data site is responsible for the quality control of all data before
    uploading to FAIRhub.
  - >-
    Site principal investigators reviewed and approved any editing of flagged clinical data and
    decided whether uncorrectable values should be removed.
  - >-
    The central project team conducted the additional processing steps, including mapping to
    standardized terminologies, in preparation for dissemination.
  - >-
    The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub through
    Microsoft Azure.
  notes: >-
    The protocol publication records that the requirements for the controlled access data sets were
    at that time being developed by a Data Access Committee; that is stated there as work in
    progress and concerns the controlled-access tier rather than this public release.

maintainers:
- role: academic_institution
  maintainer_details: >-
    The AI-READI team supports and maintains the dataset. Contact information is provided in the
    README file included with the dataset and at https://aireadi.org/contact; the RO-Crate gives
    https://docs.aireadi.org/docs/3/contact as the contact point and the study metadata gives
    contact@aireadi.org as the central contact email. The study_description.json and
    dataset_description.json metadata files included with the dataset carry additional information
    about the contact person or entity, authors and contributors.
- role: other
  maintainer_details: >-
    The dataset is hosted on the FAIRhub platform, a Microsoft Azure cloud-based data management,
    curation and sharing platform developed for this project, which also publishes the dataset and
    mints its DOIs.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place. Instead, new versions
    are released with additional data from participants who have been enrolled since the last
    version release; enrollment is ongoing and future versions are expected to include larger
    numbers of participants. Changes between the current version and the previous one are provided
    in detail in the CHANGELOG file included in the dataset and visible at docs.aireadi.org.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - >-
    Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, containing data from 204
    participants collected during the pilot data collection phase.
  - >-
    Version 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024, containing an additional 863
    participants for a total of 1,067 participants.
  - >-
    Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, containing 2,280 participants.
  version_details: >-
    Each version has its own DOI and its own documentation set at docs.aireadi.org, navigable from a
    version dropdown. Versions 1.0.0 and 2.0.0 are no longer accessible through FAIRhub: the v2.0.0
    dataset page states that the version is no longer accessible and refers users to the latest
    version, and the v2.0.0 documentation carries the same notice. Compared with the previous
    version, the data fields and types are largely the same, except that the Snellen visual acuity
    variables were dropped so that only logMAR visual acuity measurements are available; the number
    of image devices increased across releases and a recommended data split was added.
  notes: >-
    Datasheets exist for the earlier versions at
    https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project. There are also no formal guidelines recommended to future
    researchers for creating new labels or defining new tasks.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants
    were not told that their data would be retained for a fixed period and then deleted. The IRB
    protocol confirms that identifiers, links between identifiers and data, and research data will
    not be destroyed until after the end of the applicable records retention requirements.

participant_compensation:
- compensation_provided: true
  compensation_amount: USD 200
  compensation_type: >-
    A stipend for the study visit, paid through the grant funding, and not pro-rated.
  compensation_rationale: >-
    Provided for participation in the single study visit and the subsequent 10-day at-home
    monitoring period; the IRB protocol records that payment is made once the final data are
    received and the study devices are returned, typically at least two weeks after the study visit.
  retention_incentives:
  - >-
    Reimbursement of reasonable costs for parking, public transit or rideshare fees related to the
    study visit.
  - >-
    Transportation assistance in the form of rideshare services offered to study participants who
    endorsed barriers to transporting themselves to study visits.
  notes: >-
    The IRB protocol notes that participants may incur transport costs that will not be reimbursed
    if the fees exceed USD 25, and that the same type and amount of compensation would be given to
    participants invited back for the year 4 follow-up visit.

participant_privacy:
- anonymization_method: >-
    No identifiers were collected for the shared dataset, and the released data were checked against
    the HIPAA Safe Harbor criteria; the public set is stripped of protected health information, and
    information related to the sex and race/ethnicity of participants and medications used has also
    been removed.
  privacy_techniques:
  - Participant folders are named after the participant's study ID number rather than any identifier
  - >-
    Static watermarking of the Data to identify the licensee, which licensees may not remove,
    obscure, alter or mask
  - >-
    A two-tier release, with a public set and a controlled-access set containing the sensitive
    variables, the latter requiring a data use agreement
  - >-
    License prohibitions on re-identification, contact with data subjects, and extraction of
    identifying information
  - >-
    Selection of at-home monitoring devices with participant privacy as a primary concern: the
    environmental sensor and Garmin fitness tracker capture no video or audio, are not equipped with
    GPS location monitoring, and are not synced with participant-owned devices
  - >-
    Storage restrictions requiring licensee institutional servers or cloud services under a
    HIPAA-approved Business Associate Agreement
  reidentification_risk: >-
    A theoretical risk of future re-identification is acknowledged; AI algorithms can infer
    individual patient characteristics and could facilitate individual-level identification.
  data_linkage: >-
    Within the study, identifiers and study data were stored separately with a maintained link
    between them, under a Risk Level 3 data security plan, with identifiable information kept on
    encrypted computers or servers or in locked cabinets or rooms with restricted access at all
    sites and available only to authorized research personnel. The released public dataset carries
    no such link.

related_datasets:
- relationship_type: is_new_version_of
  target_dataset: >-
    Flagship Dataset of Type 2 Diabetes from the AI-READI Project, version 2.0.0
    (doi:10.60775/fairhub.2, released 8 November 2024, 1,067 participants)
  notes: >-
    Version 3.0.0 adds the participants enrolled through 1 May 2025 and drops the Snellen visual
    acuity variables; version 2.0.0 is no longer accessible through FAIRhub.
- relationship_type: is_source_of
  target_dataset: >-
    AI-READI mini subset for pipeline development (FAIRhub child dataset 4 of dataset 3)
  notes: >-
    The FAIRhub dataset page for version 3.0.0 notes that a smaller version is available for
    pipeline development, the API records the release as having a child dataset with identifier 4
    and a "mini" flag of false for the full release, and the v3.0.0 documentation describes a
    mini-subset version of the dataset.

