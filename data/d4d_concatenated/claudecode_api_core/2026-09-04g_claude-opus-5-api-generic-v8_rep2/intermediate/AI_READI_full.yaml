  notes: >-
    Documentation of the dataset, with a separate documentation set for each version; the dataset is
    described in the FAIRhub metadata as IsDocumentedBy this resource. The healthsheet records that
    the dataset is self-contained but relies on this documentation for users requiring additional
    information about its provenance.
- external_resources:
  - https://aireadi.org/
  notes: >-
    AI-READI project website, also recorded in the FAIRhub metadata with relation IsDocumentedBy;
    hosts the project team listing and contact page.
- external_resources:
  - https://github.com/AI-READI
  notes: GitHub organization of the AI-READI project, listed among the resources related to the dataset.
- external_resources:
  - https://zenodo.org/communities/aireadi
  notes: >-
    Zenodo community of the AI-READI project, listed among the resources related to the dataset and
    used to publish the license terms.
- external_resources:
  - https://doi.org/10.1038/s42255-024-01165-x
  notes: >-
    AI-READI Consortium (2024), "AI-READI: rethinking AI data collection, preparation and sharing in
    diabetes research and beyond", Nature Metabolism 6:2210-2212; listed as an associated publication
    of the release.
- external_resources:
  - https://doi.org/10.1136/bmjopen-2024-097449
  notes: >-
    Owsley C, Matthies DS, McGwin G, et al., "Cross-sectional design and protocol for Artificial
    Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI)", BMJ Open
    2025;15:e097449; the study design and protocol publication, distributed under CC BY-NC 4.0.

notes: >-
  The dataset description records an alternative title, "AI-READI dataset". Several negative
  findings recorded in the healthsheet are not carried by any structured slot: the dataset has not
  undergone any formal external audit, although it has been reviewed internally by AI-READI team
  members for quality checks and to ensure that no personally identifiable information was
  accidentally included; no data protection impact analysis has been conducted; the dataset had not
  been used for any tasks at the time of the release; and there is no repository that links to
  papers or systems that use the dataset. Biospecimens collected in the study - plasma, serum, buffy
  coats, genomic DNA, PAXgene RNA tubes and peripheral blood mononuclear cells - are banked at the
  University of Alabama at Birmingham Center for Clinical and Translational Science for future
  proteomics, metabolomics, genomics, gene expression and immunological studies, and are not part of
  this dataset; the protocol publication notes that the biorepository holds a finite number of
  samples and that procedures for reviewing and prioritizing written requests were still to be
  developed.

source_caveats: >-
  Institutional attribution conflicts between tier-1 sources: the FAIRhub API records Washington
  University in St. Louis (ROR 01yc7t268) as managing organization, lead sponsor and affiliation of
  the principal investigator, and the license names it as Licensor, while the RO-Crate names the
  principal investigator as "Aaron Lee, Department of Ophthalmology, University of Washington" and
  labels the reviewing IRB "Washington University IRB" while giving the University of Washington
  Human Subjects Division address and hsdrely@uw.edu contact; NIH RePORTER (tier 4) and both
  publications (tier 3) place the award and the approving IRB at the University of Washington. Both
  attributions are represented rather than reconciled. Name expansion conflicts: the FAIRhub study
  description and NIH RePORTER expand AI-READI as "AI Ready and Exploratory Atlas for Diabetes
  Insights" and "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights", while
  the protocol publication and the Nature Metabolism comment expand it as "Artificial Intelligence
  Ready and Equitable Atlas for Diabetes Insights"; the healthsheet uses the "Exploratory" form.
  Collection start date: the FAIRhub metadata gives 2023-07-19 as both the study start and the start
  of the collected-data range, while the protocol publication states that enrollment began on 18 July
  2023; the tier-1 value is used. Target enrollment: the FAIRhub study description records an
  anticipated enrollment of 4,000 and the protocol publication and Nature comment give 4,000, while
  the IRB protocol (tier 2) states 4,600 across four groups of 1,000 and NIH RePORTER describes
  "4,000+ people"; the tier-1 figure of 4,000 is used. Version scope: the v3.0.0 documentation "About"
  page states that it is associated with a version "which contains data from the participants of the
  pilot study phase", identical wording to the v2.0.0 page, which conflicts with the tier-1 FAIRhub
  metadata recording 2,280 participants collected from 19 July 2023 to 1 May 2025; the tier-1
  statement is used. Both the healthsheet and the RO-Crate describe version 3.0.0 as covering data
  "up through the end of the second year of the study", while the changelog table in the README
  attributes 863 participants to year 2 and 1,213 to year 3; the date range 2023-07-19 to 2025-05-01
  is consistent across sources and is used. Size arithmetic: summing the nine datatype directory
  sizes reported in the dataset structure description gives 3,815,969,360,064 bytes, which is 419,614
  bytes less than the stated total of 3,815,969,779,678 bytes; this record states the total as
  published and notes the difference, which is plausibly attributable to the root-level metadata
  files but is not accounted for by any source. Summing the nine directory file counts gives 356,334
  files, exactly 9 fewer than the stated total of 356,343, matching the nine root-level metadata
  files enumerated in the same document. The protocol publication states that "T2DM and pre-diabetes
  are identified by screening electronic health records for ICD-10 diagnosis codes R73.09 and E11.X,
  respectively"; the code-to-condition mapping implied by "respectively" is reproduced here only as
  the pair of codes used, without asserting which code identifies which condition. Blood volume is
  reported as 53 mL in the protocol publication and as approximately 50-60 mL in the IRB protocol;
  neither figure is carried in this record because biospecimen collection is not part of the dataset.