    University of Washington IRB protocol STUDY00016228, with initial approval received on
    20 December 2022 and an annual renewal application required within 90 days of expiration.
    Reliance agreements were in place with the IRBs of the University of Alabama at Birmingham and
    the University of California, San Diego, which used the same consent form with minor
    institution-specific language.
  ethics_review_board: >-
    The RO-Crate names the reviewing body as "Washington University IRB" with the contact given as
    the IRB Reliance Team, hsdrely@uw.edu, at the Human Subjects Division, University of
    Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, US. The FAIRhub study
    description records the human subject review status as "Submitted, approved".
  regulatory_compliance:
  - >-
    The study is recorded as not FDA-regulated for drugs or for devices, and as having no data
    monitoring committee. Written informed consent was provided by all participants. Licensees
    must comply with NIH data security and privacy standards under the Genomic Data Sharing
    Policy.
  special_populations:
  - Adults aged 40 to 85 years, with and without type 2 diabetes
  - Pregnancy, gestational diabetes and type 1 diabetes were exclusion criteria
  - No children, prisoners or adults unable to consent were enrolled

ethical_reviews:
- reviewing_organization: University of Washington Institutional Review Board
  review_details: >-
    Protocol STUDY00016228, initial approval 20 December 2022, with reliance agreements covering
    the University of Alabama at Birmingham and the University of California, San Diego sites; an
    annual renewal application about the status and progress of the study is required within 90
    days of expiration. The initial approval letter is published with the dataset documentation.
  source_caveats: >-
    The RO-Crate labels the reviewing organization "Washington University IRB" while giving the
    University of Washington Human Subjects Division as its address and hsdrely@uw.edu as its
    contact; the protocol publication and the healthsheet both place the approving IRB at the
    University of Washington.
- reviewing_organization: AI-READI ethics and bioethics team
  review_details: >-
    The RO-Crate records ethical review by Camille Nebeker, Debra Mathews, Kadija Ferryman and
    Nicholas Evans. The project states that ethical, legal and social implications are considered
    at every stage of the project cycle and that guidance from bioethicists informs the standards,
    best practices and guidelines for collection, preparation and sharing of the data.
- reviewing_organization: AI-READI Community Advisory Board
  review_details: >-
    A Community Advisory Board of 11 persons from the three sites, including diversity in race and
    ethnicity as represented in the AI-READI sample, contributes to the development of the
    protocol; the IRB protocol records that the board evaluates the consent forms and research
    protocols and that its feedback is considered in modifications.

informed_consent:
- consent_obtained: true
  consent_type: >-
    Written informed consent, obtained either electronically before the visit (e-consent with an
    electronic signature through REDCap) or in person at the start of the visit for participants
    who did not select the electronic option.
  consent_documentation: >-
    The approved consent form for the principal project site, the University of Washington, is
    published with the dataset documentation; the other clinical sites had IRB reliance and used
    the same consent form with minor institution-specific language incorporated according to
    individual institutional requirements. Upon signing, the signed consent form was automatically
    emailed to the subject, and additional copies could be requested from the study coordinator
    for the duration of the study.
  consent_scope: >-
    The FAIRhub consent metadata records the consent type as
    "ConsentSpecifiedNotElsewhereCategorised" with no non-commercial, geographic, research-type,
    genetic-only or methods restrictions flagged, and notes that the public version of the dataset
    can only be used for type 2 diabetes related research while a private version allows more
    generic use. Consent was required before participation in any part of the protocol, including
    questionnaires.
  withdrawal_mechanism: >-
    Participants were permitted to withdraw consent at any time and cease study participation.

collection_consents:
- consent_details: >-
    Potential participants were given the option to read all consent documentation electronically
    before their visit and to give consent with an electronic signature without verbal
    communication with a clinical research coordinator. Participants could access the e-consent
    documentation in REDCap and decide at that point not to participate or to request additional
    information, a call back or a video conference with study staff. No study-specific
    questionnaires other than the screening questionnaire were available until consent had been
    given.

consent_revocations:
- revocation_details: >-
    Any data that had been shared or used up to the point of withdrawal would stay in the dataset;
    this is clearly communicated in the consent document. The IRB protocol records that subjects
    will not be able to withdraw their data or specimens from banking, secondary use or sharing.

collection_notifications:
- notification_details: >-
    Each individual was aware of the data collection, as this was active data collection directly
    from participants rather than passive collection or secondary use of existing data.
    Individuals identified from electronic health record screening were mailed a hardcopy
    invitation letter and sent an invitation email, both personalized to direct them into an
    online REDCap recruitment interface using links, access codes and QR codes, where they could
    read an overview of the research program, expectations for participation and answers to
    frequently asked questions.

collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: >-
    The DataCite "Collected" date recorded for this version is the range 2023-07-19/2025-05-01,
    described as the period when the data was collected; the healthsheet and README repeat this
    range for the 2,280 participants in version 3.0.0. The overall project timeline spans four
    years, with one year for protocol development and training and years two to four for subject
    recruitment and data collection; preliminary pilot enrollment ran from 18 July 2023 to
    30 November 2023 and formal data collection began on 1 December 2023. The study start date is
    recorded as 2023-07-19 (actual) with an anticipated completion date of 2027-01-01.
  source_caveats: >-
    The protocol publication states that enrollment began on 18 July 2023, one day earlier than the
    2023-07-19 study start and collection-period start recorded in the higher-ranked FAIRhub
    metadata; the FAIRhub value is used here.

acquisition_methods:
- was_directly_observed: true
  was_validated_verified: true
  acquisition_details: >-
    Some data were directly observable, such as laboratory results, vital signs and retinal
    imaging. Verification of data entry was performed when possible, for example by
    cross-referencing entered medications with medications that were physically brought in or
    photographed by each study participant.
- was_reported_by_subjects: true
  acquisition_details: >-
    Other data were reported by subjects, notably survey and questionnaire responses covering
    demographics, depressive symptoms, diabetes distress and self-care, diet, smoking, alcohol,
    vaping and marijuana use, general health, social determinants of health, and visual impairment
    and eye care access.

collection_mechanisms:
- mechanism_details: >-
    REDCap was used to collect patient-reported questionnaire data and clinical data recorded at
    the visit, including the medications assessment, vitals, visual acuity, contrast sensitivity,
    monofilament test results and complete blood count results. Clinical data outside expected
    minimum/maximum ranges were flagged in REDCap and appeared in reports viewed by clinical
    research coordinators and data managers. The exact forms used for data collection in REDCap
    are published with the dataset documentation.
- mechanism_details: >-
    Philips PageWriter TC30 Cardiograph (Amsterdam, The Netherlands): a 12-lead ECG performed while
    the participant sits in a reclining chair or lies supine, with the position recorded as 0, 30,
    60 or 90 degrees relative to supine. Data are exported in .xml format and distributed under the
    WFDB standard in cardiac_ecg/ecg_12lead/philips_tc30.
- mechanism_details: >-
    LeeLab Anura environmental sensor, custom designed at the Karalis Johnson Retina Center,
    University of Washington (Seattle, Washington). Participants were sent home with the device
    and asked to place it in a frequently used area of the home for 10 continuous days, then to
    note where it had been placed. It records ambient temperature, relative humidity, nitrogen
    oxides (NO and NO2), volatile organic compounds, particulate matter counts (PM1.0, PM2.5, PM4
    and PM10) and 11 multi-spectral light intensity measurements, exported as .csv.
  notes: >-
    The device was specifically chosen with participant privacy as a primary concern: it does not
    capture video or audio, is not equipped with GPS location monitoring and is not synced with
    participant-owned devices.
- mechanism_details: >-
    Dexcom G6 Continuous Glucose Monitor (Dexcom, Inc., San Diego, California): a real-time
    integrated continuous glucose monitoring system worn continuously for 10 days that captures
    blood glucose readings in mg/dL every five minutes without finger sticks. A single sensor is
    designed to last a maximum of ten days and the transmitter saves data for thirty days, so data
    must be downloaded within that window. Participants were masked to the results during the
    monitoring period.
  notes: >-
    Dexcom provided research discounts on study devices. The IRB protocol additionally permits
    participants already wearing a Dexcom G6 either to place an additional study sensor or to share
    their existing Dexcom Clarity data, and offers them the option of allowing download of
    previously collected glucose values for up to 90 days before the visit, for a total of up to
    100 days; the dataset documentation describes the collected CGM data as a 10-day monitoring
    period.
- mechanism_details: >-
    Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland). Advised to
    be worn on the non-dominant wrist for 10 consecutive days, with participants free to choose
    their preferred wrist, and returned with a form specifying the wrist worn and the dominant hand.
    The sampling frequency is 5 seconds and the device continuously records physical activity and
    sleep, including number of steps, heart rate, sleep duration, oxygen saturation, respiratory
    rate, stress and calories. Data are exported in .FIT format and converted to the Open mHealth
    standard.
  notes: >-
    There are gaps in data collection because the battery had to be charged every two to three
    days. Garmin provided research discounts on study devices. Like the environmental sensor, the
    tracker was chosen for privacy: it captures no video or audio, has no GPS location monitoring
    and is not synced with participant-owned devices.
- mechanism_details: >-
    Optomed Aurora IQ handheld fundus camera (Optomed, Oulu, Finland): a non-mydriatic camera with a
    50-degree field of view, 5 Mpix sensor and high-contrast optical design, used to take undilated
    macula- and disc-centered color fundus photographs in a dark room with the participant seated
    and reclined. Output is DICOM.
  notes: Optomed loaned devices for research purposes at no cost.
- mechanism_details: >-
    iCare EIDON widefield TrueColor confocal fundus imaging system (iCare USA, Inc., Raleigh, North
    Carolina): captures images up to 200 degrees with TrueColor, blue, red, red-free and infrared
    confocal modalities, operating without dilation at a minimum pupil of 2.5 mm. AI-READI images
    comprise single field central infrared/fundus autofluorescence and a smart horizontal mosaic,
    acquired in fully automated mode in a dark room to minimize operator-induced noise. Output is
    DICOM.
  notes: iCare World loaned devices for research purposes at no cost.
- mechanism_details: >-
    Heidelberg Spectralis HRA optical coherence tomography and OCT angiography system (Heidelberg
    Engineering GmbH, Heidelberg, Germany): combines OCT with retinal angiography using confocal
    scanning laser ophthalmoscope technology that minimizes the effects of light scatter. AI-READI
    scans are optic nerve head radial circle high resolution, posterior pole macula high resolution
    61 lines, and macula 20x20 high speed 512 lines OCTA, acquired in a dark room. Output is DICOM.
  notes: Heidelberg Engineering provided research discounts on study devices.
- mechanism_details: >-
    Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) (Heidelberg Engineering GmbH,
    Heidelberg, Germany): a macula-centered, non-invasive measurement of the fluorescence lifetimes
    of endogenous retinal fluorophores, recorded at short (498-560 nm) and long (560-720 nm)
    wavelengths and provided as two DICOM files per eye. Exported in .sdt file format and converted
    to DICOM for the dataset. Because the scan takes longer than a standard OCT and exposes
    participants to uncomfortable light levels, it is performed last in the visit.
- mechanism_details: >-
    Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan): a robotic OCT and
    color fundus camera capturing 12x9 mm wide-field OCT including macula and optic disc, 6x6 mm
    3D macula OCT and 6x6 mm OCTA at a 50 kHz scan rate, acquired automatically in a dark room with
    minimal operator involvement. Exported in .fda file format and converted to DICOM for the
    dataset.
  notes: Topcon Corporation loaned devices for research purposes at no cost.
- mechanism_details: >-
    Topcon Triton DRI OCT (Topcon Healthcare, Itabashi-ku, Tokyo, Japan): swept-source OCT with a
    1,050 nm wavelength light source and a non-mydriatic color fundus camera, visualizing the
    deepest layers of the eye including through cataracts. AI-READI protocols are 12x12 mm and 6x6
    mm OCTA and 12.0x9.0x6.0 mm 3D horizontal and radial scans. Exported in .fda file format and
    converted to DICOM for the dataset.
  notes: Topcon Corporation loaned devices for research purposes at no cost.
- mechanism_details: >-
    Zeiss Cirrus 5000 Angioplex (Carl Zeiss Meditec AG, Jena, Germany): high-definition OCT with
    non-invasive imaging of retinal microvasculature. Protocols include 512x512 and 200x200 macula
    and optic nerve head cubes and 6x6 mm macula and disc OCTA, with a 60-degree OCTA widefield
    view, 8x8 mm single scans and 14x14 mm automated OCTA montage available. Output is DICOM.
  notes: Carl Zeiss loaned devices for research purposes at no cost.
- mechanism_details: >-
    In-clinic measurement instruments whose readings were recorded into REDCap: the Montreal
    Cognitive Assessment administered on an iPad using the MoCA Duo application (MoCA Cognition,
    Quebec, Canada); the M&S Technologies Electronic Visual Acuity tester (Niles, Illinois) at
    4 meters, with a 2.0 neutral density filter or ND-occluder for mesopic testing; the Mars letter
    contrast sensitivity chart (Mars Perceptrix, Chappaqua, New York) read monocularly under
    photopic and mesopic conditions with background luminance of 60 to 120 cd/m2; the Topcon KR-800
    auto keratometer/refractor; a standard 10 g monofilament applied at three locations on each
    foot ten times per location with the participant's eyes closed; blood pressure by OMRON HEM
    907XL, Medline MDS4001 or Welch Allyn 6000 series monitors, measured twice two minutes apart;
    and NIDEK LM-600P, Topcon CL-200 or Topcon CL-300 lensometers.

data_collectors:
- role: Clinical research coordinators and research assistants at the three sites
  collector_details: >-
    Responsible for contacting and consenting research participants, ushering them through the
    research visit, conducting study visits including collection of ophthalmic images, training
    participants on study procedures such as continuous glucose monitoring and the fitness tracker,
    and ensuring the return of all study materials. All research personnel who recruited, enrolled
    and collected data underwent training by the data manager at the University of Alabama at
    Birmingham and worked from a detailed Manual of Procedures; a certification process was required
    of all coordinators, including mandatory institutional compliance training for human subject
    research and successful administration of all protocol elements to at least three volunteer
    practice subjects.
  notes: >-
    Effort was supported by NIH award OT2OD032644 based on the percentage of effort contributed,
    with salaries aligned to the funding guidelines at each site.
- role: Site data managers
  collector_details: >-
    Data managers at each site oversaw the data collection process, reviewed REDCap range-check
    reports with the coordinators, ingested data into the REDCap database and extracted it for
    processing, and were responsible for the quality control of all data before uploading to
    FAIRhub.
- role: Central laboratory
  collector_details: >-
    The University of Washington Nutrition and Obesity Research Center testing facility performed
    the laboratory assays on stored frozen serum, plasma, whole blood and urine, returning results
    in .csv format.
- role: Local clinical laboratories
  collector_details: >-
    Clinical Laboratory Improvement Amendments-certified laboratories local to each data collection
    site performed complete blood count testing on fresh whole blood samples.

direct_collection:
- is_direct: true
  collection_details: >-
    The data were collected directly from participants across the three recruiting sites.
    Recruitment pools were identified by screening electronic health records for diabetes and
    prediabetes ICD-10 codes for patients who had had an encounter with the sites' health systems.
    Some content of the dataset, such as past health records held under controlled access, derives
    from those electronic health records rather than from direct measurement.

sampling_strategies:
- is_sample: false
  is_random: false
  is_representative: false
  strategies:
  - >-
    Participants were recruited in waves to facilitate efficient sampling of the study base, with
    the composition and size of each wave influenced by the observed participation characteristics
    of race/ethnicity, gender, severity of T2DM and site; composition was monitored and adjusted by
    under- and oversampling groups as needed.
  - >-
    For each wave a contact pool was identified by screening electronic health records at each
    site for ICD-10 diagnosis codes R73.09 and E11.X, with patients without diabetes identified as
    those without encounters with these codes.
  - >-
    Recruitment aimed at approximately equal proportions of four race/ethnic groups, four
    categories of T2DM severity and biological males and females, rather than at matching the
    demographic distribution of the US population.
  - >-
    The study is registered with a sampling method of "Non-Probability Sample" and an observational
    cohort, cross-sectional design.
  source_data: >-
    All patients aged 40 years or older who had a medical encounter within each health system site
    (University of Alabama at Birmingham, University of California San Diego, University of
    Washington) between 2020 and 2025.
  why_not_representative: >-
    The cohort is deliberately balanced rather than demographically representative; recruitment is
    predominantly urban and hospital-based; participants are volunteers; and races and ethnicities
    such as Pacific Islanders and Native Americans are not included.
  notes: >-
    The healthsheet states that the dataset contains all possible instances, meaning data from all
    participants enrolled within the collection period, and answers "N/A" to the question of the
    sampling strategy used to draw the dataset from a larger set.

cleaning_strategies:
- cleaning_details: >-
    Quality control at the time of data entry and acquisition: clinical data outside expected
    minimum and maximum ranges were flagged in REDCap and visible in reports viewed by clinical
    research coordinators and data managers, who examined participant records and determined
    whether an error was likely. Data were checked, and edited where errors were detected, for
    credibility based on range checks, incorrect flow through prescribed skip patterns, missing
    data that could be directly filled from other portions of an individual's record, and the
    omission and/or duplication of records. Editing was done only under the guidance and approval
    of the site principal investigator; where there was no logical or appropriate way to correct
    the data, the site principal investigator reviewed the values and decided whether they should
    be removed.
- cleaning_details: >-
    The data manager at each data site was responsible for the quality control of all data before
    uploading to FAIRhub, and the dataset was reviewed internally by AI-READI team members for
    quality checks and to ensure that no personally identifiable information was accidentally
    included.

preprocessing_strategies:
- preprocessing_details: >-
    After data were sent from each study site to the central project team, all data were mapped to
    standardized terminologies where possible, notably the Observational Medical Outcomes
    Partnership Common Data Model for observational clinical data and DICOM for medical imaging
    data, so that the dataset is stored and shared as "AI-ready" and enables immediate AI/ML
    research without reformatting and preprocessing.
- preprocessing_details: >-
    Conversion of proprietary device exports into standard formats: Topcon Maestro2 and Triton data
    exported in .fda file format and converted to DICOM for the dataset; Heidelberg FLIO data
    exported in .sdt file format and converted to DICOM; Garmin activity data exported in .FIT file
    format and converted to the Open mHealth standard; ECG data converted to WFDB; environmental
    sensor and CGM exports handled as delimited text.
- preprocessing_details: >-
    Removal of protected health information from the public release using the HIPAA Safe Harbor
    method, together with removal of information related to the sex and race/ethnicity of the
    participants and of medications used.
- preprocessing_details: >-
    Organization of the release following the Clinical Dataset Structure v0.1.1, with a manifest.tsv
    metadata file in each datatype directory and root-level CDS metadata files including
    dataset_description.json, dataset_structure_description.json, study_description.json,
    participants.tsv, participants.json, README.md, CHANGELOG.md, healthsheet.md and LICENSE.txt.
    A dqd_omop.json file supports OMOP CDM data quality analysis with the OMOP CDM Data Quality
    Dashboard, which runs more than 3,500 data quality checks against an OMOP CDM instance.
- preprocessing_details: >-
    Processing moved from custom and ad hoc handling for the v1.0.0 pilot data to a combination of
    automated and custom processing for the later data included in v2.0.0 and v3.0.0.

missing_data_documentation:
- missing_data_patterns:
  - Not all modalities are available for all participants
  - Skipped questions and incomplete responses within survey data
  - Gaps within wearable activity monitor records
  missing_data_causes:
  - Some participants elected not to participate in some study elements
  - >-
    The data collection device did not have any stored results or was returned too late to
    retrieve the results, for example because the battery died or data were lost
  - A data collision at some point in the process, resulting in lost data
  - The Garmin activity monitor battery had to be charged every two to three days
  handling_strategy: >-
    Missing data that could be directly filled from other portions of an individual's record were
    filled during cleaning; otherwise values were left missing, or removed after review by the site
    principal investigator where no logical or appropriate correction was possible. No instances
    were excluded from the dataset at the time of preprocessing.

raw_data_sources:
- source_description: >-
    Study participants at the three data collection sites, who completed questionnaires, on-site
    measurements and imaging, and 10 days of at-home monitoring.
  source_type: Direct prospective collection from human research participants
  access_details: >-
    Not separately accessible; the processed participant data constitute this dataset.
- source_description: >-
    Electronic health records of the University of Alabama at Birmingham, University of California
    San Diego and University of Washington health systems, screened for eligibility and used to
    extract general health, eye health, medical and surgical history, diabetes, medications,
    laboratory records and prior imaging.
  source_type: Existing clinical records
  access_details: >-
    Past health records and medications derived from these sources are held under controlled
    access and are not part of the public release.

raw_sources:
- raw_data_details: >-
    Raw device and system exports before standardization: ECG in .xml, MoCA Duo application output
    (total score, section subscores, Memory Index Score and task completion times) in .csv, retinal
    images in device-native formats including Topcon .fda and Heidelberg .sdt, Garmin activity data
    in .FIT, Dexcom CGM and environmental sensor data in .csv, laboratory results from the central
    laboratory in .csv, and REDCap exports. The raw data are saved and expected to be preserved by
    the AI-READI project at least for the duration of the project, but are not anticipated to be
    shared outside the project team at present, because they have not been mapped to standardized
    terminologies and because they may accidentally include personal health information or
    personally identifiable information, for example in free text fields. There is a possibility
    that raw data may be included in future releases of the controlled access dataset.

variables:
- variable_name: participant_id
  data_type: identifier
  is_identifier: true
  derivation: Study identification number assigned to each enrolled participant.
  notes: >-
    Each participant folder in the dataset is named after the participant's ID number used in the
    study; the participants.tsv metadata file lists participants and their recommended split
    assignment.
- variable_name: HbA1c
  data_type: float
  unit: '%'
  measurement_technique: >-
    Whole blood test performed by the University of Washington Nutrition and Obesity Research
    Center laboratory.
  notes: >-
    Included as a marker for diabetes; the testing laboratories provided a reference range of
    4.0-6.0 %.
- variable_name: Glucose
  data_type: float
  unit: mg/dL
  measurement_technique: Serum test performed by the central laboratory on stored frozen samples.
  notes: >-
    Included as a marker for diabetes; the testing laboratories provided a reference range of
    62-125 mg/dL. Blood was collected non-fasting.
- variable_name: C peptide
  data_type: float
  unit: ng/mL
  measurement_technique: EDTA plasma test performed by the central laboratory.
  notes: >-
    Included as an indicator of insulin production; reference range provided by the testing
    laboratories was 1.1-4.4 ng/mL.
- variable_name: Insulin
  data_type: float
  unit: ng/mL
  measurement_technique: EDTA plasma test performed by the central laboratory.
  notes: >-
    Included as a marker for diabetes; reference range provided by the testing laboratories was
    0.0-24.9 ng/mL.
- variable_name: Troponin-T
  data_type: float
  unit: ng/L
  measurement_technique: EDTA plasma test performed by the central laboratory.
  notes: >-
    Included as a marker of myocardial injury; the reference range provided by the testing
    laboratories was female <11 and male <16 ng/L.
- variable_name: Urine albumin
  data_type: float
  unit: mg/dL
  measurement_technique: Urine test performed by the central laboratory.
  notes: >-
    Included as a urinary biomarker for early diabetic nephropathy; no reference range was
    provided by the testing laboratories.
- variable_name: Urine creatinine
  data_type: float
  unit: mg/dL
  measurement_technique: Urine test performed by the central laboratory.
  notes: >-
    Included as a urinary biomarker for early diabetic nephropathy; no reference range was
    provided by the testing laboratories.
- variable_name: MoCA total score
  data_type: integer
  maximum_value: 30.0
  measurement_technique: >-
    Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
    application, capturing all participant responses interactively.
  notes: >-
    The total possible score is 30, with higher numbers representing better performance; a score
    below 24 is described as a sign of cognitive impairment and a final total score of 26 and above
    as normal. Section subscores, a Memory Index Score and task completion times are also exported.
    Scoring requires professional training and may be affected by education level, socioeconomic
    factors and depression or other mental health conditions.
- variable_name: Best-corrected visual acuity (logMAR)
  data_type: float
  unit: logMAR
  measurement_technique: >-
    M&S Technologies Electronic Visual Acuity tester at 4 meters, right and left eyes separately,
    under photopic conditions and under mesopic conditions through a 2.0 neutral density filter.
  notes: >-
    Expressed as the logarithm of the minimum angle of resolution, where lower numbers indicate
    better resolution. The Snellen visual acuity variables present in earlier versions were dropped
    in this version of the dataset, so only logMAR measurements are available.
- variable_name: Letter contrast sensitivity (log CS)
  data_type: float
  unit: log contrast sensitivity
  measurement_technique: >-
    Mars letter contrast sensitivity chart read monocularly under photopic conditions with a
    general occluder and under mesopic conditions with a neutral density occluder, in the
    standardized order photopic OD, photopic OS, mesopic OD, mesopic OS.
  notes: >-
    Expressed as log sensitivity, with higher numbers meaning better sensitivity. Testing was
    terminated when the patient made two consecutive errors or reached the end of the chart, and
    the log CS value was computed by multiplying the number of errors prior to the final correct
    letter by 0.04 and subtracting the result from the log CS value at the final correct letter.
- variable_name: Continuous glucose measurement
  data_type: float
  unit: mg/dL
  measurement_technique: Dexcom G6 continuous glucose monitor, one reading every five minutes.
  notes: >-
    Collected over a 10-day at-home monitoring period; participants were masked to the results
    during the monitoring period.
- variable_name: Particulate matter concentration
  data_type: float
  measurement_technique: >-
    LeeLab Anura custom environmental sensor placed in the participant's home for 10 days.
  categories:
  - PM1.0
  - PM2.5
  - PM4
  - PM10
  notes: >-
    Recorded alongside ambient temperature, relative humidity, nitrogen oxides (NO and NO2),
    volatile organic compounds and 11 multi-spectral light intensity measurements.

