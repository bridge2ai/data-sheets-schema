conforms_to: >-
  Organized following the Clinical Dataset Structure (CDS) v0.1.1: one directory per datatype at
  the root, then one folder per modality, then one folder per device, then one folder per
  participant named after the participant's study ID number. Per-datatype file format standards
  are the WaveForm DataBase (WFDB) for cardiac_ecg; the Observational Medical Outcomes Partnership
  (OMOP) Common Data Model for clinical_data, where each CSV file is a one-to-one mapping to an
  OMOP CDM table; the NASA ASCII File Format Guidelines for Earth Science Data for environment;
  Digital Imaging and Communications in Medicine (DICOM) for retinal_flio, retinal_oct,
  retinal_octa and retinal_photography; and Open mHealth for wearable_activity_monitor and
  wearable_blood_glucose. A separate RO-Crate 1.2-DRAFT metadata package conforming to the
  FAIRSCAPE profile 0.1 describes the 3.0.0 release and its nine sub-crates.
