purposes:
- response: >-
    To enable future generations of artificial intelligence and machine learning research to
    provide critical insights into type 2 diabetes mellitus, including salutogenic pathways to
    return to health.
- response: >-
    To permit downstream pseudotime manifold analysis, an approach used to predict disease
    trajectories by collecting and learning from complex, multimodal data from participants with
    differing disease severity, and so to reconstruct a temporal atlas of T2DM development and
    reversal towards health.
- response: >-
    To establish standards, best practices and guidelines for the collection, preparation and
    sharing of data for AI/ML purposes, and to serve as a model and blueprint for future data
    generation projects, following the Findable, Accessible, Interoperable, Reusable principles.

addressing_gaps:
- response: >-
    The lack of well-designed, high quality, large and inclusive multimodal datasets that are AI
    ready for training AI models on complex, multi-organ diseases such as T2DM.
- response: >-
    The under-representation in past research of racial and ethnic groups that bear a higher
    burden of disease; a meta-epidemiological review of T2DM studies published from 2000 to 2020
    found that samples lacked racial and ethnic diversity.
- response: >-
    The infeasibility of downstream AI/ML analyses with existing data sources such as claims or
    electronic health records data, which the multi-domain acquisition protocol is designed to
    overcome.

tasks:
- response: >-
    Pseudotime manifold analysis to predict disease trajectories from complex, multimodal data
    across participants of differing disease severity, from normal to insulin-dependent T2DM.
- response: >-
    Development of AI/ML models on a hypothesis-agnostic, multimodal T2DM dataset, using the
    recommended 70/15/15 training, validation and testing split distributed with the release.

instances:
- instance_type: >-
    An individual patient. Each instance consists of all of the data available for one individual
    participating in the study, across survey, clinical, retinal imaging, environmental sensor,
    continuous glucose monitor and wearable activity monitor modalities.
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: >-
    No labels or targets are provided. The healthsheet records that no specific labeling was
    performed, as the dataset is hypothesis-agnostic and aimed at facilitating multiple potential
    downstream AI/ML applications, and that no software was used to label instances.
  missing_information:
  - missing: One or more data modalities for some participants
    why_missing:
    - >-
      Some participants elected not to participate in some study elements; in a few cases the
      data collection device had no stored results or was returned too late to retrieve the
      results, for example because the battery died or data were lost; in a few cases a data
      collision occurred at some point in the process and data were lost.
  notes: >-
    The modalities encompass tabular data, imaging data and physiological signal/waveform data;
    there is no unstructured text data in the dataset. The first version of the dataset contained
    204 instances and the second 1,067 instances.

relationships:
- relationship_details: >-
    All instances are part of the same prospective data generation project (AI-READI). There is
    currently only one visit per participant, so instances are not linked longitudinally in this
    version.

splits:
- split_details: >-
    The release includes a recommended split into training, validation and testing sets in
    70%/15%/15% proportions, distributed in the participants.tsv metadata file. Because sex, race
    and ethnicity are not released with the public version of the dataset, the project team
    prepared the split so that the validation and test sets are balanced as well as possible for
    sex, race/ethnicity and diabetes status (no diabetes; pre-diabetes or lifestyle controlled;
    oral medication controlled; insulin controlled). The split totals 1,576 training, 352
    validation and 352 test participants, with a mean age of 60.8 +/- 11.3 years overall. The
    split is new in version 3.0.0 and is described as aimed at reducing disparities in models
    developed using this dataset.

