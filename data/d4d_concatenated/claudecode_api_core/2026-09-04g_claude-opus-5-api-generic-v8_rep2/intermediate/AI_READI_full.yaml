id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI flagship dataset is a multimodal, AI-ready dataset collected from 2,280 adults
  aged 40 and older with and without type 2 diabetes mellitus (T2DM), harmonized across three
  United States data collection sites (University of Alabama at Birmingham, University of
  California San Diego, and University of Washington). Version 3.0.0 contains data collected
  between 19 July 2023 and 1 May 2025 spanning survey data, clinical data mapped to the OMOP
  Common Data Model, 12-lead electrocardiography in WFDB, retinal photography, optical coherence
  tomography, optical coherence tomography angiography and fluorescence lifetime imaging
  ophthalmoscopy in DICOM, home environmental sensing, continuous glucose monitoring and
  wearable activity monitoring. Recruitment sampling aimed at an approximately equal distribution
  of participants across race/ethnicity, sex and diabetes severity (no diabetes; pre-diabetes or
  lifestyle-controlled; oral or non-insulin-injectable medication controlled; insulin controlled)
  so that downstream AI/ML analyses are feasible in ways they are not with claims or electronic
  health record data. The stated goal is to better understand salutogenesis, the pathway from
  disease to health, in T2DM. This public version contains no protected health information;
  information related to the sex and race/ethnicity of participants and medications used has also
  been removed and is held in a controlled-access version obtainable under a data use agreement.
