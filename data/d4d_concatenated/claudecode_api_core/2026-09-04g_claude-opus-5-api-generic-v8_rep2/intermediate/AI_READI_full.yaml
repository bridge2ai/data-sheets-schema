sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: >-
    The public dataset does not contain data considered sensitive; the released data contain no
    protected health information, and information related to the sex and race/ethnicity of the
    participants as well as medications used has been removed.
- sensitive_elements_present: true
  sensitivity_details: >-
    The controlled-access dataset contains data regarding racial and ethnic origins, location
    (5-digit zip code), motor vehicle accident reports, genetic sequencing data, past health
    records and medications. This material is not part of the public release described here.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification was necessary because no identifiers were collected; the team
    checked that no identifiable data per US HIPAA were present. The public set is stripped of
    Protected Health Information as defined by the HIPAA Privacy Rule via the "Safe Harbor"
    method.
  identifiers_removed:
  - Protected Health Information as defined by the HIPAA Privacy Rule (Safe Harbor method)
  - Information related to the sex of participants
  - Information related to the race and ethnicity of participants
  - Medications used
  deidentification_details: >-
    The FAIRhub de-identification level is recorded as deIdentType "NoDeIdentification" with
    deIdentDirect true and deIdentHIPAA true, and dates, non-arrayed values and k-anonymity flags
    false. Sex and race/ethnicity were removed from the public set to prevent stigmatization of
    findings. The RO-Crate records the release as deidentified.
  notes: >-
    A theoretical risk of future re-identification is acknowledged: AI algorithms can infer
    individual patient characteristics and could facilitate individual-level identification. To
    prevent re-identification attempts the project implements a robust data dissemination system,
    a strict license agreement and data watermarking for both public and controlled sets; the
    license states that the Data may be statically watermarked to identify the Licensee.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Eligibility excluded pregnancy, gestational diabetes and type 1 diabetes, and set a minimum
    age of 40 years and a maximum of 85 years, so no minors were enrolled. The IRB protocol
    records that the research will not recruit or obtain data from individuals known to be
    prisoners, is not likely to have subjects who become prisoners while participating, does not
    purposefully include fetuses, neonates or pregnant women, and does not include cognitively
    impaired adults or other adults unable to consent. Native American or non-U.S. indigenous
    populations are not actively recruited through a tribe or tribe-focused organization.
  notes: >-
    Separately from this dataset, the funded project committed to engaging in a tribal
    consultation to address barriers and facilitators of participation, with the goal of
    collecting similar data within a Native American cohort in an ethical and respectful manner,
    and the Nature Metabolism comment describes engagement with the Native Biodata Consortium as a
    co-learning opportunity. These are stated as project activities, not as content of this
    release.

