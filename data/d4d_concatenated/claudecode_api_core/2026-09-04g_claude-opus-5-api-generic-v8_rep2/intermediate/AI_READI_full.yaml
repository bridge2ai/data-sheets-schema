anomalies:
- anomaly_details: >-
    In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: >-
    In wearable data, improper use and technical failure such as battery failure or system
    malfunction are expected. The Garmin activity monitor has gaps in data collection because the
    battery had to be charged every two to three days.
- anomaly_details: >-
    In imaging data, patient uncooperation, noise that may obscure the images, technical failure
    such as system malfunction, and data transfer failures are expected.
- anomaly_details: >-
    In a few cases there may have been a data collision at some point in the process, resulting
    in lost data.
- anomaly_details: >-
    Image quality for the undilated handheld Optomed Aurora fundus camera varies from patient to
    patient and within the same patient, because obtaining a good view is challenging without
    dilation and the device is handheld.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so the sample is subject to volunteer bias, which may limit the
    generalizability of results to those not represented in the study population.
- bias_type: representation_bias
  bias_description: >-
    Recruitment is predominantly urban and hospital-based, which may not fully capture all
    possible cultural and socioeconomic backgrounds, and the cohort does not include other
    races and ethnicities such as Pacific Islanders and Native Americans.
  mitigation_strategy: >-
    Three recording sites were strategically selected for geographic variability across the
    United States and to ensure representation across various racial and ethnic groups, and
    individuals from all demographic backgrounds were recruited at all three sites.
- bias_type: sampling_bias
  bias_description: >-
    Although the cross-sectional database ultimately aims to achieve balance across
    race/ethnicity, biological sex, and diabetes presence and severity, interim releases are not
    balanced across these parameters; as enrollment is ongoing, periodic updates to data releases
    may not have achieved balanced distribution across groups.
  affected_subsets:
  - >-
    The pilot data release and subsequent periodic version releases, including this one.
  mitigation_strategy: >-
    Uniform data collection protocols were implemented for all subjects irrespective of
    race/ethnicity, biological sex, or diabetes severity, across all study sites, and the study
    sites were selected to ensure varied representation and minimize the potential for sampling
    bias.
- bias_type: selection_bias
  bias_description: >-
    Eligibility required participants to speak and read English, which the protocol publication
    notes may have created challenges in recruiting Hispanic and/or Asian persons.

known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: >-
    The study cohort may not provide a comprehensive representation of the population: recruitment
    is predominantly urban and hospital-based and the cohort excludes races and ethnicities such
    as Pacific Islanders and Native Americans.
  scope_impact: >-
    Limits the generalization of models derived from the dataset to populations outside the three
    recruiting health systems and the four represented racial/ethnic groups.
- limitation_type: coverage_limitation
  limitation_description: >-
    Not all modalities are available for all participants, because of non-participation in some
    study elements, device failure, late device return or data loss.
- limitation_type: scope_limitation
  limitation_description: >-
    The public version withholds information related to the sex and race/ethnicity of participants
    and medications used, and holds 5-digit zip code, genetic sequencing data, past health
    records, medications, and traffic and accident reports under controlled access.
  recommended_mitigation: >-
    The full dataset is accessible by entering into a data use agreement.
- limitation_type: temporal_limitation
  limitation_description: >-
    The study is cross-sectional and there is currently only one visit per participant, so the
    dataset does not support within-participant longitudinal analysis in this version.
- limitation_type: scope_limitation
  limitation_description: >-
    Eligibility restricted enrollment to adults aged 40 to 85 who could read and speak English and
    provide consent, and excluded pregnancy, gestational diabetes and type 1 diabetes.

