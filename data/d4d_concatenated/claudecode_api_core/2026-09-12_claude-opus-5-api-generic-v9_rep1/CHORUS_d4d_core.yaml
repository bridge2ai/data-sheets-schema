purposes:
- response: To generate data for machine learning and artificial intelligence applications
    aimed at characterizing acute and critical care illness, predicting complications, and
    measuring treatment response among patients with acute or critical illness.
- response: To develop a publicly available, AI-ready critical care dataset whose methods
    promote privacy, accountability, and clinical benefit, and to provision a holdout test
    set accessible for external model validation to aid marketplace adoption of AI-developed
    models in acute and critical care.
- response: To create ethically sourced datasets and tools around artificial intelligence
    and to establish best practices for AI in health, as one of four data generation projects
    in the NIH-funded Bridge2AI consortium.
tasks:
- response: Characterizing acute and critical care illness.
- response: Predicting complications among patients with acute or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
addressing_gaps:
- response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care, and developing high-resolution multicenter datasets
    is a critical first step toward actionable and trustworthy AI.
- response: Clinical data arrive in heterogeneous source formats; unified standards are needed
    to harmonize multimodal electronic health record, waveform, imaging, and text data.
