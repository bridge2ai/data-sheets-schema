title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable
  AI
id: https://chorus4ai.org/
name: CHoRUS dataset
description: CHoRUS is a controlled-access, multicenter, multimodal, high-resolution critical
  care dataset assembled by the CHoRUS Network as one of four data generation projects in
  the NIH-funded Bridge2AI consortium. It is built from retrospective clinical data contributed
  by 14 hospitals within a collaboration spanning 20 academic centers and more than 60 consortium
  members, and is intended to support machine learning that characterizes acute and critical
  care illness, predicts complications, and measures treatment response. The current released
  dataset covers 50,000 patient admissions from intensive care, pediatric intensive care,
  and neonatal intensive care settings, together with 23 Tb of waveform data; the anticipated
  final dataset covers 100,000 patient admissions across nine data modalities from the contributing
  hospitals. Structured electronic health record data and waveform telemetry are held in a
  cloud enclave under controlled access, while clinical notes remain stored locally at contributing
  sites and only tokens derived from them are available centrally. The CHoRUS leadership team
  named in the cohort 2 training webinar comprises Eric Rosenthal (Massachusetts General Hospital),
  Azra Bihorac, Yulia Strekalova and Parisa Rashidi (University of Florida), Xiaoqian Jiang
  (UTHealth Houston), and Manlik Kwong (Tufts University).
notes: The CHoRUS project website carries a banner reading "This repoitory is under review
  for potential modification in compliance with Administration directives." [sic].
source_caveats: 'Admission counts differ between sources: the project website (project_documentation,
  tier 2) reports a current released dataset of 50,000 patient admissions, while the cohort
  2 webinar (tutorial, tier 4) states that as of August 2025 the dataset covered 14 different
  hospitals with over 45K unique admissions. The higher-ranked website figure is recorded
  in the instances slot and both are noted here. Imaging volumes are reported in different
  units and are not reconciled: the website reports 7,642 admissions with radiology data,
  while the webinar reports 1,000 images available with de-identification in process. NIH
  RePORTER lists Rosenthal, Eric S. as principal investigator of award 1OT2OD032701-01 at
  Massachusetts General Hospital; the cohort 2 webinar additionally names a CHoRUS leadership
  team without designating those members as principal investigators, and they are therefore
  recorded in the dataset description rather than as creators. As of the September 2025 cohort
  2 webinar, published metadata schemas for clinical notes and for imaging were planned rather
  than available, while the other data types already had published metadata. The NIH project
  abstract states in the future tense that the dataset will provision a holdout test set for
  external validation and that a visualization and annotation environment will label data
  with prediction targets; neither is recorded as a current split or labeling procedure. The
  program manager''s email is transcribed as printed on the project website, cmccrary@mgh.havard.edu,
  which appears to misspell harvard.edu. The MIT License statement in the chorus-ai GitHub
  organization is about that software project, not about the dataset, whose access is governed
  by a signed licensing agreement; no dataset-level license slot is therefore populated. The
  bundle describes distribution only as a controlled-access cloud enclave, which is an access
  route rather than a distribution format, so distribution_formats is left empty and the applicable
  data standards are recorded in conforms_to, conforms_to_standard, and the subset entries.
  The bundle states that collection is retrospective but gives neither the calendar range
  of the clinical encounters covered nor any statement of whether collection was direct or
  indirect, so collection_timeframes and direct_collection are left empty.'
