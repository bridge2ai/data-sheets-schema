    1600000000 is this record's own expansion of that rounded figure into digits; no source
    prints the count in full digits.
- instance_type: Patient admission accompanied by radiology imaging data
  counts: 7642
  data_substrate: B2AI_SUBSTRATE:11
  data_topic: B2AI_TOPIC:15
- instance_type: Waveform telemetry recording captured from bedside monitors
  data_substrate: B2AI_SUBSTRATE:49
  data_topic: B2AI_TOPIC:37
