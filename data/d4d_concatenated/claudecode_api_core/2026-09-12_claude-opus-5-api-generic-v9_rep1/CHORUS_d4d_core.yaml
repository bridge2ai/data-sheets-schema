known_limitations:
- limitation_description: As of August 2025, only 1,000 images were available, with de-identification
    in process for a larger imaging cohort.
- limitation_description: As of August 2025, extraction of EEG waveform data was still in
    process.
- limitation_description: Clinical notes are stored locally at contributing sites rather than
    in the cloud enclave; only tokens derived from them are available centrally.
confidential_elements:
- confidential_elements_present: true
  confidentiality_details: 'Clinical notes are not transferred to the cloud enclave: they
    are stored locally at contributing sites, and only tokens derived from them are available
    centrally.'
subpopulations:
- identification: Admissions from adult intensive care units (ICU).
  subpopulation_elements_present: true
- identification: Admissions from pediatric intensive care units (PICU).
  subpopulation_elements_present: true
- identification: Admissions from neonatal intensive care units (NICU).
  subpopulation_elements_present: true
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset consists of patient-level clinical data from critically
    ill patients, spanning demographics, diagnoses, medications, procedures, nursing flowsheets,
    clinical notes, imaging, telemetry and EEG waveforms, and social determinants of health.
    Every data type listed by the project is held under controlled access.
acquisition_methods:
- acquisition_details: Retrospective collection of existing clinical data from hospital systems
    of record at contributing sites - electronic health records, PACS, bedside monitor gateways,
    and a hospital EEG database - which are then acquired, standardized to the OMOP Common
    Data Model, tokenized, stored, and labeled.
collection_mechanisms:
- mechanism_details: Bedside monitors with gateway and middleware capture waveform telemetry.
- mechanism_details: Hospital picture archiving and communication systems (PACS) supply imaging.
- mechanism_details: A hospital EEG database supplies EEG waveforms in EDF+ and Persyst formats.
- mechanism_details: The OHNLP toolkit extracts and tokenizes clinical notes.
- mechanism_details: The chorus-extract-upload repository provides tools used by contributing
    sites to create and upload a CHoRUS Data Extract.
data_collectors:
- collector_details: The CHoRUS Network, a collaboration spanning 20 academic centers of which
    14 contribute as Data Acquisition centers, performs the extraction and delivery of multimodal
    clinical data across the 14 contributing hospitals.
raw_data_sources:
- source_description: Structured electronic health record data from hospital EHR systems at
    contributing sites.
  source_type: hospital electronic health record system
- source_description: Unstructured electronic health record text, including clinical notes,
    from hospital EHR systems.
  source_type: hospital electronic health record system
- source_description: Imaging studies drawn from hospital picture archiving and communication
    systems.
  source_type: hospital PACS
- source_description: Telemetry waveforms captured from bedside monitors through gateway and
    middleware.
  source_type: bedside physiological monitoring
- source_description: EEG waveforms drawn from a hospital EEG database.
  source_type: hospital EEG database
sampling_strategies:
- strategies: Federated access enables sampling methods intended to ensure a balanced and
    diverse cohort across contributing sites.
- strategies: The project establishes a legal framework for collecting data at scale, sampling
    to ensure comprehensive sets of patient conditions and clinical treatment strategies.
preprocessing_strategies:
- preprocessing_details: Source clinical data are standardized to the OMOP Common Data Model.
- preprocessing_details: Unstructured electronic health record text is tokenized; clinical
    notes are extracted and tokenized with the OHNLP toolkit, with the notes themselves retained
    locally and only tokens made available in the enclave.
- preprocessing_details: Data are transformed using approaches that limit re-identification.
- preprocessing_details: Validated semantic mappings connect clinical data in various source
    formats to international standards, supported by a clinical validation standard operating
    procedure for mapping contributions.
cleaning_strategies:
- cleaning_details: Standard operating protocols instruct data contributing sites about best
    practices for curating and delivering interoperable datasets, with an interactive workflow
    diagram describing the step-by-step extraction and contribution process.
- cleaning_details: Characterization reports are produced and returned to contributing sites
    following their data submissions.
machine_annotation_tools:
- tools:
  - OHNLP toolkit
  tool_descriptions: Used to extract and tokenize clinical notes; the resulting data follow
    the OHNLP open source schema.
existing_uses:
- examples:
  - The datasets are being used for training activities and publications.
- examples:
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program cohort 2, running from November
    17, 2025 to July 31, 2026 with up to 30 selected trainees, gives trainees hands-on training
    on the Bridge2AI AI/ML for Clinical Care Network and has them leverage the data and tools
    to create practical use cases.
future_use_impacts:
- impact_details: The project anticipates that the dataset will catalyze the biomedical research
    and expertise necessary to promote the patient-focused deployment of AI in acute and critical
    care, improving the care and outcomes of patients requiring critical care.
- impact_details: Patient-focused ethical and legal work determines approaches to manage privacy
    and bias and to account for social determinants of health in the resulting models.
intended_uses:
- use_category: applied AI and machine learning research in clinical care
  examples:
  - Equipping researchers to apply AI and machine learning methods to big data analysis and
    to conduct research at the intersection of healthcare challenges and AI/ML using multimodal
    datasets from a broad range of cohort participants.
- use_category: training and workforce development
  examples:
  - Hands-on training with Jupyter notebooks, the OHDSI tool stack, and the OHDSI/OMOP common
    data model on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
maintainers:
- maintainer_details: Ciera McCrary, Program Manager, Massachusetts General Hospital, cmccrary@mgh.havard.edu.
updates:
  update_details: The dataset is growing from the current released 50,000 patient admissions
    toward an anticipated final dataset of 100,000 patient admissions across nine data modalities
    from 14 data contributing hospitals. As of August 2025, de-identification of a larger
    imaging cohort and extraction of EEG waveforms were in process.
extension_mechanism:
  extension_details: Clinical collaborators can contribute to semantic mapping through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings, and an
    associated clinical validation standard operating procedure. Issues encountered in creating
    or submitting a data extract can be posted in the Standards and Data Acquisition discussion
    spaces of the chorus-ai GitHub organization.
  contribution_url: https://github.com/chorus-ai
ethical_reviews:
- reviewing_organization: CHoRUS consortium
  review_details: The CHoRUS consortium evaluates community perspectives on clinical care
    AI to find ways to increase trustworthiness of provenance and privacy in AI, and new approaches
    are being created as the existing legal and regulatory landscape is analyzed. The NIH
    project abstract states that the project will perform community-facing ethics focus groups
    to determine what data is appropriate for public sharing.
license_and_use_terms:
  license_terms: The dataset is controlled access. All participants must sign a licensing
    agreement, included in the registration form, before gaining access to the dataset.
data_governance:
  access_review_process: The chorus-ai GitHub organization directs access requests to dbold@emory.edu
    or jared.houghtaling@tuftsmedicine.org. For the AIM-AHEAD Bridge2AI for Clinical Care
    Training Program cohort 2, the route stated by the cohort 2 webinar is a registration
    form giving name, email, and institution, together with the licensing agreement included
    in that form, which all participants must sign before gaining access to the dataset; once
    access is granted and compute is provisioned, an email is sent. That program also requires
    a ".edu" email address to gain access to the dataset, with program administrators assisting
    where needed.
  source_caveats: The registration form, licensing agreement and ".edu" email requirement
    are stated by the cohort 2 webinar as the access route for the AIM-AHEAD Bridge2AI for
    Clinical Care Training Program cohort; the bundle does not state a general access review
    process for other users beyond the GitHub request-access contacts.
is_deidentified:
  method: Tokenization of unstructured electronic health record text, de-identification of
    imaging, and transformations that limit re-identification.
  deidentification_details: Data are transformed using approaches that limit re-identification.
    Clinical notes are tokenized, with the notes retained locally at contributing sites and
    only tokens available in the cloud enclave. For imaging, 1,000 images were available as
    of August 2025 with de-identification in process for a larger cohort.
external_resources:
- external_resources:
  - The chorus-ai GitHub organization at https://github.com/chorus-ai hosts software and tooling
    for interacting with clinical data, validated semantic mappings, standard operating protocols
    for contributing sites, and project management overviews.
- external_resources:
  - The CHoRUS project website at https://chorus4ai.org/ describes the project components,
    the dataset snapshot, and learning opportunities.
conforms_to: Structured electronic health record data are standardized to the OMOP Common
  Data Model; imaging follows DICOM, waveform telemetry follows WFDB with an extended PhysioNet
  schema, EEG follows EDF+ and Persyst, and tokenized clinical notes follow the OHNLP open
  source schema.
