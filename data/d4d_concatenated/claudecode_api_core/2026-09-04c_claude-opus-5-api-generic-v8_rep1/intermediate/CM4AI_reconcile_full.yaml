name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI), the
  Functional Genomics Grand Challenge of the NIH Bridge2AI program. CM4AI generates multi-modal
  data — protein-protein interaction (PPI), spatial protein localization, and genetic
  perturbation data — in MDA-MB-468 breast cancer cells with and without paclitaxel or vorinostat
  treatment, and in KOLF2.1J induced pluripotent stem cells with and without differentiation.
  This Beta release contains perturb-seq data for MDA-MB-468 breast cancer cells with and without
  treatment and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast
  cancer cells with and without treatment, for undifferentiated KOLF2.1J iPSCs, and for
  iPSC-derived neuron progenitor cells (NPCs), neurons and cardiomyocytes; AP-MS data for treated
  MDA-MB-468 breast cancer cells; and immunofluorescence images of MDA-MB-468 breast cancer cells
  with and without treatment. The release is distributed as ten ZIP archives through the
  University of Virginia Dataverse, with the larger underlying mass spectrometry and sequencing
  data held in external repositories linked from the release record.
