purposes:
- name: Mapping the spatiotemporal architecture of human cells for interpretable genotype-phenotype learning
  response: >-
    As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project seeks to
    map the spatiotemporal architecture of human cells and use these maps toward the grand
    challenge of interpretable genotype-phenotype learning, creating a library of large-scale maps
    of cellular structure and function across demographic and disease contexts.
- name: Delivery of machine-readable, AI-ready maps of cell architecture
  response: >-
    The project's stated objective is to deliver machine-readable hierarchical maps of cell
    architecture as AI-ready data produced from multimodal interrogation of chromatin modifiers and
    metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant
    cell lines under perturbed and unperturbed conditions, using mass spectrometry based proteomics,
    spatial proteomics and cell imaging, and genetic perturbation by CRISPR.

addressing_gaps:
- name: Opacity of genotype-phenotype machine learning models
  response: >-
    In genomics and precision medicine, machine learning models are often "black boxes," predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs.
    The data are generated to address this deficiency by supplying knowledge maps of cell and tissue
    architecture on which "visible" machine learning systems can be built directly.

tasks:
- name: Interpretable genotype-phenotype learning
  response: >-
    The data are intended to support machine learning that predicts phenotype from genotype in a way
    whose internal mechanism can be interpreted, rather than treating the model as a black box.
- name: Construction of visible machine learning systems and visible neural networks
  response: >-
    Cell maps of the kind this data supports have been used in AI tools for "visible machine
    learning" or "visible neural networks" (VNNs) to interrogate how protein assemblies in the cell
    affect cell-level phenotype predictions.

intended_uses:
- use_category: AI-ready datasets to support research in functional genomics
  usage_notes: >-
    The release states this as the first of its intended uses.
- use_category: AI model training
- use_category: Cellular process analysis
- use_category: Analysis of cell architectural changes and interactions
  usage_notes: >-
    The release names analysis of cell architectural changes and interactions in the presence of
    specific disease processes, treatment conditions, or genetic perturbations.

prohibited_uses:
- name: Clinical decision-making and patient care
  prohibition_reason: >-
    The release states that these laboratory data are not to be used in clinical decision-making or
    in any context involving patient care without appropriate regulatory oversight and approval.
- name: Commercial use under the release license
  prohibition_reason: >-
    The dataset is licensed CC BY-NC-SA 4.0, under which the material may not be used for commercial
    purposes, defined as use primarily intended for commercial advantage or monetary compensation.
    The project preprint states that commercial use requires a separate license negotiation with the
    copyright holder.

