acquisition_methods:
- name: Laboratory measurement of cultured human cell lines
  acquisition_details: >-
    All instances are experimental measurements made on cultured human cell lines in the laboratory:
    mass spectrometry of cell extracts, confocal imaging of stained cells, and single-cell
    sequencing of CRISPR-perturbed cells. No data are self-reported by subjects.
  was_directly_observed: true
  was_reported_by_subjects: false

collection_mechanisms:
- name: Size exclusion chromatography-mass spectrometry (SEC-MS)
  mechanism_details: >-
    Proteome-wide protein complex and interaction profiling by size exclusion chromatography coupled
    to mass spectrometry, applied to MDA-MB-468 breast cancer cells with and without treatment, to
    undifferentiated KOLF2.1J iPSCs, and to iPSC-derived neural progenitor cells, neurons and
    cardiomyocytes.
- name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details: >-
    Affinity purification mass spectrometry on endogenously tagged cell lines, used to map
    protein-protein interactions; the release includes AP-MS archives for MDA-MB-468 cells treated
    with paclitaxel and with vorinostat.
- name: Immunofluorescence subcellular confocal microscopy
  mechanism_details: >-
    Spatial proteomics by immunofluorescence-based staining and high-resolution confocal microscopy.
    Each image comprises four channels: nuclei stained with DAPI (blue channel), endoplasmic
    reticulum with a calreticulin antibody (yellow channel), microtubules with a tubulin antibody
    (red channel), and an antibody against the protein of interest (green channel).
  source_caveats: >-
    The channel description is taken from the per-file descriptions in the October 2025 release,
    which describe archives with the same file names; the June 2026 archives carry different MD5
    checksums and the June 2026 page carries no per-file descriptions.
- name: Single-cell CRISPR interference perturbation screens (perturb-seq)
  mechanism_details: >-
    Genetic perturbation by CRISPR/Cas9-based interference followed by single-cell RNA sequencing,
    producing transcriptional and fitness phenotypes for targeted genes in MDA-MB-468 cells with and
    without treatment and in undifferentiated KOLF2.1J iPSCs.

direct_collection:
- is_direct: false
  collection_details: >-
    Data were generated in the laboratory from commercially available, de-identified human cell lines
    rather than collected directly from individuals. The release records that the dataset does not
    involve human subjects.

sampling_strategies:
- is_sample: true
  is_representative: false
  why_not_representative: >-
    Data in this release were derived from commercially available de-identified human cell lines and
    do not represent all biological variants which may be seen in the population at large.
  notes: >-
    Proteins and genes were interrogated as targeted panels rather than exhaustively. The project
    preprint states an objective of multimodal interrogation of 100 chromatin modifiers and 100
    metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant
    cell lines under perturbed and unperturbed conditions.

