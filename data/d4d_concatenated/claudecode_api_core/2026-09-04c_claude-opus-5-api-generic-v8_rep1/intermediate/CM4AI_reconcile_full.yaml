    MDA-MB-468 is a triple negative breast cancer cell line established from a metastatic site
    pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma.
  source_caveats: >-
    This describes the donor of the cell line used to generate the data, as reported in the CM4AI
    project preprint, and not a subpopulation of data instances identified within the release.
- name: KOLF2.1J donor
  subpopulation_elements_present: true
  identification: >-
    The KOLF2.1J iPSC line was derived from a healthy male Northern European donor and is available
    from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource.
  source_caveats: >-
    This describes the donor of the cell line used to generate the data, as reported in the CM4AI
    project preprint, and not a subpopulation of data instances identified within the release.

known_limitations:
- limitation_type: scope_limitation
  limitation_description: >-
    This is an interim release; the release record states that the data are not yet in completed
    final form.
- limitation_type: coverage_limitation
  limitation_description: >-
    The release does not contain predicted cell maps; computed cell maps are not included and are
    stated to be added in future releases.
- limitation_type: coverage_limitation
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo.
- limitation_type: integration_limitation
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq
    data interrogate sets of proteins which incompletely overlap.
- limitation_type: integration_limitation
  limitation_description: >-
    The current release is most suitable for bioinformatics analysis of the individual datasets
    rather than of an integrated multimodal map.
- limitation_type: methodological_limitation
  limitation_description: >-
    Meaningful analysis requires domain expertise.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Data in this release were derived from commercially available de-identified human cell lines.
- bias_type: representation_bias
  bias_description: >-
    The data do not represent all biological variants which may be seen in the population at large.

