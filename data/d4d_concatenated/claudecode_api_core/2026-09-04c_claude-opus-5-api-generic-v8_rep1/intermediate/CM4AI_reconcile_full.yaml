updates:
  frequency: quarterly
  update_details: >-
    The release states that the dataset will be regularly updated and augmented through the end of
    the project in November 2026, with updates on a quarterly basis. Predicted cell maps are stated
    to be added in future releases. The CM4AI project portal states that CM4AI releases data
    quarterly, ensuring continuous updates to the cell maps and input data streams.

retention_limit:
  retention_details: >-
    Long term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  version_details: >-
    The release is published as Dataverse version 2.0 and cited as V2. Earlier CM4AI quarterly
    releases are deposited as separate records in the same Dataverse collection: October 2025
    (doi:10.18130/V3/K7TGEM, version 2.1), June 2025 (doi:10.18130/V3/F3TD5R, version 2.1), March
    2025 (doi:10.18130/V3/B35XWX, version 1.4), and the May 2024 data release
    (doi:10.18130/V3/DXWOS5). The CM4AI project portal lists the same set under a Data Releases
    archive.

related_datasets:
- relationship_type: is_new_version_of
  target_dataset: doi:10.18130/V3/K7TGEM
  notes: >-
    Cell Maps for Artificial Intelligence - October 2025 Data Release (Beta), the immediately
    preceding quarterly release.
- relationship_type: is_new_version_of
  target_dataset: doi:10.18130/V3/F3TD5R
  notes: >-
    Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta).
- relationship_type: is_new_version_of
  target_dataset: doi:10.18130/V3/B35XWX
  notes: >-
    Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta).
- relationship_type: is_new_version_of
  target_dataset: doi:10.18130/V3/DXWOS5
  notes: >-
    Cell Maps for Artificial Intelligence - Data Release, the May 2024 release cited in the CM4AI
    project preprint's data availability statement.
- relationship_type: is_described_by
  target_dataset: doi:10.1101/2024.05.21.589311
  notes: >-
    Clark T et al., "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture
    from Disease-Relevant Cell Lines", given as the release's related publication and as the required
    citation for reuse.
- relationship_type: references
  target_dataset: doi:10.1101/2024.11.03.621734
  notes: >-
    Nourreddine S et al., "A Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells", listed
    as a related publication on the release record.

external_resources:
- name: CM4AI project portal
  description: >-
    The CM4AI web portal at http://www.cm4ai.org, which disseminates CM4AI data, maps and tools, and
    lists the project's quarterly data releases, tools, publications and training materials.
- name: >-
    Multimodal cell maps as a foundation for structural and functional genomics (Nature, 2025)
  description: >-
    Schaffer LV, Hu M, Qian G et al., Nature volume 642, pages 222-231 (2025),
    https://doi.org/10.1038/s41586-025-08878-3. This publication reports a multimodal cell map of
    U2OS osteosarcoma cells and acknowledges funding from the Bridge2AI Program (NIH Common Fund;
    OT2 OD032742), the same award that funds CM4AI. It describes a distinct dataset and cell line
    and is not part of this release.

notes: >-
  The CM4AI project portal reports project-wide totals rather than per-release ones: 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes
  targeted, and a data volume of 21.4 TB. These figures describe the cumulative output of the CM4AI
  project and are not stated as the contents of this release. The portal also describes CM4AI's
  flagship curated datasets: for iPSC-derived cell types, perturb-seq of more than 11,000
  whole-genome genes and SEC-MS capturing about 7,000 proteins; and for triple-negative breast
  cancer cells under untreated (DMSO control), vorinostat and paclitaxel conditions, SEC-MS capturing
  about 7,000 proteins, immunofluorescence images for 523 proteins, and perturb-seq of 200 genes.

source_caveats: >-
  Referent: this record describes the CM4AI June 2026 Data Release (Beta), doi 10.18130/V3/HIGT4C,
  the current release named by the project portal and the highest-ranked non-superseded source in the
  bundle. Earlier quarterly releases are recorded in related_datasets rather than merged into this
  record.
  Release date: the CM4AI portal's data-releases page gives "Released on: June 17, 2025" for this DOI,
  while the Dataverse record gives a publication date of 2026-06-17 and file publication dates of
  17 June 2026 and 15 July 2026. The Dataverse record is the higher-ranked source and its date is
  recorded in `issued`.
  Immunofluorescence protein counts: the March 2025 release describes its image archives as covering
  563 proteins; the June 2025 and October 2025 releases describe archives of the same names as
  covering 464 proteins; the project portal states 523. The June 2026 release page carries no
  per-file descriptions and no protein count, so none is asserted for this release.
  Checksum change: the three immunofluorescence archives in this release carry the same file names as
  those in the June 2025 and October 2025 releases but different MD5 checksums, so per-file
  descriptions carried over from October 2025 (imaging laboratory, channel assignments) may not
  describe these archives exactly; they are recorded with that caveat attached.
  AP-MS availability: the project portal's data-releases page lists "AP-MS interactomes (coming
  soon!)" for the breast cancer flagship dataset, while this release includes two AP-MS archives. The
  release is the higher-ranked source and is followed.
  RO-Crate packaging: `conforms_to` and `conforms_to_standard` are taken from the project preprint,
  which states that CM4AI output data are packaged with provenance graphs and rich metadata as
  AI-ready datasets in RO-Crate format using the FAIRSCAPE framework, and from the June 2025 release,
  which publishes release-ro-crate-metadata.json and per-modality RO-Crate metadata files. The June
  2026 release lists a release metadata archive without naming its format.
  Size: `total_size_bytes` is not populated. File sizes are reported only in rounded units (113.3 KB
  through 4.6 GB) whose base is unstated, so no byte total can be given without false precision.
  File count: `total_file_count` records the ten files the release page enumerates; this equals the
  sum of the six file_collections' file_count values (2 + 2 + 3 + 1 + 1 + 1).
  Publisher: the release names "University of Virginia Dataverse" as the publishing repository;
  `publisher` records ROR:0153tk833, the University of Virginia identifier given in the release's own
  author affiliations, as the nearest attested identifier for that publisher.
  Governance and ethics contacts are identified by mailto URIs because the release gives their email
  addresses but no personal registry identifiers for them in that role.