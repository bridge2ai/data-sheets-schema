    snippet: "CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue"
  - slot: subpopulations[0].identification
    snippet: "established\nfrom a metastatic site pleural effusion of a 51-year-old black female with a metastatic\nmammary adenocarcinoma"
  - slot: subpopulations[1].identification
    snippet: "The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male\nNorthern European donor"
  - slot: tasks[1].response
    snippet: "they have been used in AI tools for “visible machine\nlearning” or “visible neural networks” (VNNs) to interrogate how protein assemblies in\nthe cell affect cell-level phenotype predictions"
  - slot: description
    snippet: "treated (with paclitaxel and vorinostat) versus untreated MDA-MB-468\nbreast cancer cell lines"
