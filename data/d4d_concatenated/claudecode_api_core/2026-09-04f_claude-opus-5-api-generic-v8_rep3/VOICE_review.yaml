  'ethics module' clause and publisher's maintenance snippet. The validator already
  reports the 9 adjacent/elsewhere snippets; the ones I hit (slot-023 in c011 not c007,
  slot-010's two c014 citations sitting in c013, and the c002-cited funding statement
  at line 524 inside c003) support their values, so attribution precision is the only
  loss. The rule-19 gaps (creators[2], creators[4], variables[1], variables[3],
  maintainers[1], maintainers[2]) are receipt-completeness defects for values the
  bundle does state, not unsupported content. chunk-c003's missed content is the same
