notes: >-
  The receipt accepted for creators[0].notes (slot-003) cites a passage with no
  bearing on the value while the value's facts sit verbatim in c002/c003 - a
  laundered attribution the deterministic validator cannot see. The
  chorus-container-apps snippet under c008 (slot-004) is verbatim in c007, an
  adjacent-chunk attribution of the kind #763 reports. Rule-15/19 findings rest
  on the phase-1 snapshot (intermediate/CHORUS_full.yaml): purposes[2] and all
  five raw_data_sources entries are present there and unreceipted, so the gaps
  are phase-1 coverage misses, not reconciliation rewrites. The rule-03 finding
  is confined to the report clause: the referent choice is never stated in the
  reconciliation report, though it is held consistently. slot-042 is an
  inference the record itself discloses in rule-18 form; adverse by the
  vocabulary, but disclosed. The pack lists no gaps.
