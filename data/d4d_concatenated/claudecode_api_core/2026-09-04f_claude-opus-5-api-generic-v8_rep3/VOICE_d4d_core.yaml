publisher: https://physionet.org/
status: published
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
version: 3.1.0
was_derived_from: Raw voice, speech, breath and cough audio recordings, together with questionnaire
  responses retrieved from ReproSchema-UI or exported from REDCap, collected prospectively
  from consented participants by the Bridge2AI-Voice consortium.
id: doi:10.13026/8xbn-nq66
name: Bridge2AI-Voice
description: 'Bridge2AI-Voice is a collection of derived acoustic features and linked health
  information generated from voice, speech, breath and cough recordings of 833 adult participants
  enrolled at five clinical sites in the United States and Canada. Participants were selected
  on the basis of conditions expected to manifest in the voice waveform, drawn from four adult
  disease cohorts - voice disorders, neurological and neurodegenerative disorders, mood and
  psychiatric disorders, and respiratory disorders - together with controls. Each participant
  completed a standardized protocol of acoustic tasks, demographic and confounder surveys,
  disease-specific validated questionnaires and clinician-confirmed diagnosis, delivered through
  a custom application running on a tablet with a headset microphone. Version 3.1.0, published
  on PhysioNet, releases only material assessed as low risk: spectrograms, Mel spectrograms,
  Mel-frequency cepstral coefficients, articulatory and phonetic posteriorgram features, static
  acoustic features, audio quality metrics, per-recording metadata, and phenotype tables covering
  demographics, confounders, diagnosis, enrollment, questionnaires and task responses. Raw
  audio waveforms are withheld from this release and disseminated separately under controlled
  access. The dataset is the flagship data-generation deliverable of the Precision Public
  Health grand challenge funded by the NIH Common Fund Bridge2AI program, whose stated aim
  is to make voice usable as a biomarker of health by supplying a large, diverse and ethically
  sourced resource for voice artificial-intelligence research.'
notes: The creators recorded here are the lead investigators the project documentation names
  in answer to the question of who created the dataset. The documentation adds that over 50
  other investigators, clinicians, scholars and trainees contributed, and the PhysioNet author
  list for version 3.1.0 names more than one hundred individuals. The consortium publishes
  an AI-readiness self-assessment against the Bridge2AI recommendations, scoring 100 per cent
  on FAIRness, provenance, pre-model explainability and ethics, 80 per cent on characterization
  (data quality criterion unmet), 75 per cent on computability (contextualization criterion
  unmet) and 50 per cent on sustainability (domain-appropriate and associated criteria unmet).
source_caveats: 'Referent: this record describes the adult Bridge2AI-Voice dataset at version
  3.1.0 as published on PhysioNet, the highest-ranked non-superseded source in the declared
  bundle. The pediatric cohort is a separate PhysioNet release and is recorded under related_datasets
  rather than as part of this dataset, as is the controlled-access raw audio distribution,
  which is the source this release derives from rather than part of it. Statements drawn from
  the project documentation and the IRB protocol that describe planned or future collection,
  other versions, or the pediatric cohort are marked as such where used. Brain Imaging Data
  Structure conformance is stated in the project documentation for the audio-plus-questionnaire
  distribution organized under a b2ai-voice-audio root, not for the PhysioNet featurized release
  described here, which is organized into features, metadata and phenotype folders; the BIDS
  fact is therefore recorded against the raw audio collection under related_datasets and no
  conforms_to value is asserted for this release. Remote data collection through the Bridge2AI
  Voice Web app and iOS app is approved in the IRB protocol but the project documentation
  states that remote data collection did not occur for the released data, and the PhysioNet
  methods describe tablet-based in-clinic collection only; it is therefore not recorded as
  a collection mechanism for this release. Target size: the project documentation states an
  anticipated enrollment of 10,000 by 2027 and describes a flagship dataset of 10,000 voices,
  while the IRB protocol, at the same source rank, states a sample size of 30,000 participants,
  and the audiomics white paper states a primary deliverable of a publicly available database
  of 30,000 human voices. The two tier-2 sources cannot be separated by rank, so neither figure
  is recorded as dataset content; both are goals rather than realized collection, against
  833 participants actually released. Recording counts: the project documentation states that
  version 3.0 contains approximately 61,937 voice-derived recordings, while the PhysioNet
  version 3.1.0 release reports per-feature record counts ranging from 28,640 to 32,522 and
  no single recording total. These figures are not directly comparable and no reconciliation
  is attempted here. Name spellings differ between sources: the project documentation writes
  "Jennifer Sui" and "Frank Rudzizc" where the PhysioNet author lists write "Jennifer Siu"
  and "Frank Rudzicz"; the PhysioNet forms are preferred as the higher-ranked source. Contact
  email addresses in the project documentation were redacted to "[email protected]" by the
  source capture; the DACO address recorded here is taken from the PhysioNet news items, which
  state it in full. Award identifiers differ across sources; see the caveat recorded on funders.
  The publisher value records PhysioNet, which the bundle names as the hosting platform and
  as the journal field of the release citation; the bundle makes no explicit publisher statement.
  No data protection impact assessment is recorded: the project documentation states that
  no analysis of the potential impact of the dataset and its use on data subjects has been
  conducted.'
