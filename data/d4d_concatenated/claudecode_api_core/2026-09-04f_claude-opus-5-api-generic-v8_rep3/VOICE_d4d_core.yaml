errata:
- erratum_details: 'Corrections made in successive releases: version 2.0 reprocessed spectrograms
    to fix minor issues identified in version 1.1 and removed all spectrograms and MFCCs derived
    from free-speech recordings; version 2.0.1 corrected the authorship list; version 3.1.0
    fixed broken parquet files carried over from version 3.0.0 and back-filled validated diagnosis
    information across conditions.'
  notes: The project documentation states that there is no erratum as such; a changelog for
    each dataset version is published online with the dataset metadata.
updates:
  frequency: Semi-annual
  update_details: Further versions of the dataset will be released twice a year, distributed
    as new versions on the hosting platform. Users will be notified through news items on
    the platform as well as through standard communication channels. Updates correct labeling
    errors, add new instances and reorganize files; the collection is released as static versions
    rather than being dynamically updated.
retention_limit:
  retention_period: Indefinite for the archived dataset; two years for recipients of raw audio
    under transfer agreement
  retention_details: Once data is contributed it will be retained as long as it is useful
    for research purposes, possibly indefinitely. Identifiable data and the tables linking
    participant numbers to participant information are kept within each collecting institution
    on local cloud storage for a maximum of ten years after study completion and are then
    destroyed, under the responsibility of each local principal investigator. Recipients of
    transferred data must destroy it two years after the agreement start date, on completion
    of the project, on termination, or on expiry of the applicable ethics approval, whichever
    occurs first, and must certify destruction in writing within thirty days; a single copy
    may be retained where records retention law, institutional policy, research integrity
    or verification requires it.
version_access:
  versions_available:
  - '1.1'
  - 2.0.0
  - 2.0.1
  - 3.0.0
  - 3.1.0
  latest_version_doi: doi:10.13026/37yb-1t42
  version_details: 'Each version of the dataset has a unique DOI: version 1.1 is 10.13026/249v-w155,
    version 3.0.0 is 10.13026/k81f-qr68 and version 3.1.0 is 10.13026/8xbn-nq66, with 10.13026/37yb-1t42
    resolving to the latest version. Version 1.1 added Mel-frequency cepstral coefficients;
    version 2.0 added 136 new participants and reprocessed spectrograms; version 2.0.1 corrected
    the authorship list; version 3.0.0 added 391 participants, separated the single phenotype
    file into individual tables and added articulatory and phonetic posteriorgram features;
    version 3.1.0 added no new participants but released additional data for some, fixed broken
    parquet files, added audio quality metrics and per-recording metadata, back-filled validated
    diagnosis information and renamed some gold standard variables. By default older versions
    continue to be supported, hosted and made available, though the publishers reserve the
    right to remove access to older versions. Version 1.0 was published on the Health Data
    Nexus platform, which provides cloud compute alongside the dataset rather than allowing
    downloads.'
extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: Others may publish a derivative dataset that references the original
    source; such derivative datasets may be made available under the same conditions as the
    source data. For improvements to the code used to produce the data, the open-source repositories
    provide discussion forums and issue pages for public discussion of data preprocessing,
    and pull requests for contributing changes.
ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: The clinical study was reviewed and approved by at least one human subjects
    protection review board; it was submitted and approved by the USF single IRB and by subsite
    IRBs through the single IRB process. Data collection and sharing was approved under that
    review.
- reviewing_organization: Canadian institutional research ethics boards
  review_details: Mount Sinai Hospital, the Hospital for Sick Children and the University
    of Toronto do not follow the United States single IRB process and applied for separate
    Research Ethics Board approvals to comply with Canadian regulations; copies of the approvals
    were submitted to the University of South Florida IRB.
- reviewing_organization: Bridge2AI-Voice ethics working group
  review_details: A memorandum setting out the ethical justification for restricting raw voice
    data samples to controlled access is published alongside the dataset documentation. Best
    ethical practices developed through ethical inquiry guided the voice collection protocol
    and dissemination practices.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - Data collection and sharing was approved by the University of South Florida Institutional
    Review Board. United States sites operate under the USF single IRB process, with subsite
    IRB approvals obtained through that process.
  ethics_review_board: University of South Florida Institutional Review Board
  regulatory_compliance:
  - HIPAA de-identification rules applied to the released data; identifiable data held within
    each institution in password-protected REDCap databases and HIPAA-compliant cloud storage
    through NIH STRIDES partners. The study is not for a drug product or a medical device,
    and no data monitoring committee was appointed.
  special_populations:
  - This dataset covers adults only, with a minimum enrollment age of 18 years and a maximum
    of 120 years. Pediatric participants were enrolled under a separate protocol at the Hospital
    for Sick Children and are released as a separate dataset. Canadian institutions did not
    fall under the single IRB process and obtained separate Research Ethics Board approvals;
    genomic data collection and analysis was covered by a separate Canadian protocol.
informed_consent:
- consent_obtained: true
  consent_type: Prospective informed consent obtained before data collection. Consent may
    be given by signing a paper copy, electronically within the collection application or
    through a REDCap survey form, or by video recording in which the participant reads a statement
    aloud; the recorded consent is used to verify that the acoustic data submitted belongs
    to the consented individual.
  consent_documentation: Paper consent documents are uploaded and saved electronically in
    REDCap. All paper and electronic versions of consent are stored for a minimum of five
    years after completion of the study.
  consent_scope: Consent covers collection and use of voice and linked health data, access
    to medical information through electronic health record platforms for gold standard validation
    of diagnoses and symptoms, and onward sharing of de-identified data with external researchers.
    Participants are told that data posing a low risk of re-identification will be shared
    in registered access with the general public and that data posing a heightened risk will
    be shared through a controlled access mechanism with authorized researchers. Consent is
    not restricted to non-commercial use, to a geographic location, to a specific type of
    research, to genetic research, or against methods and algorithm development.
  withdrawal_mechanism: Participants may withdraw at any point. Where a participant withdraws
    during or before voice data collection, their data is not included in the database; once
    voice data collection is complete the recordings cannot be removed. For longitudinal collection,
    data already completed is retained. Participants who withdraw may optionally complete
    a satisfaction survey, which collects no protected health information.
at_risk_populations:
  special_protections:
  - Enrollment in this dataset is restricted to participants aged 18 years or older. Pediatric
    participants are enrolled only through the pediatric sites, under a separate protocol,
    and are released as a separate dataset. The study does not specifically include or exclude
    students, employees or wards of the state.
  source_caveats: The IRB protocol identifies only children under the heading of vulnerable
    populations, and notes that answering questions in the mood and psychiatric instruments
    may cause discomfort or trigger negative emotions. The bundle makes no statement about
    whether the neurological cohort, which includes participants with mild cognitive impairment
    and dementia, or the mood and psychiatric cohort, are treated as at-risk groups, so no
    determination is recorded here.
license_and_use_terms:
  license_terms: Bridge2AI Voice Registered Access License. Users must be credentialed on
    PhysioNet and sign the Bridge2AI Voice Registered Access Agreement. Duplication as reasonably
    required to carry out the research project is permitted; sale of all or part of the data
    on any media is not permitted. Users agree to respect the Fort Lauderdale Agreement and
    to implement licensing policies that will not obstruct further research. No fees are associated
    with these restrictions.
  data_use_permission: general_research_use
  notes: The registered access agreement permits both commercial and non-commercial research
    by Authorized Researchers; the consent does not restrict use to non-commercial purposes,
    to a geographic location, to a specific type of research, to genetic research, or against
    methods and algorithm development.
ip_restrictions:
  restrictions:
  - The data may be protected by copyright and other rights, including other intellectual
    property rights, and nothing in the agreement transfers any intellectual property rights
    in or relating to the data to the user.
  - Users agree not to make intellectual property claims on the data.
  - Users agree not to use intellectual property protection in ways that would prevent or
    block access to, or use of, any element of the data, or conclusions drawn directly from
    the data.
  - Users may perform further research adding intellectual and resource capital and may obtain
    intellectual property rights on downstream discoveries, provided they implement licensing
    policies that will not obstruct further research.
  - Sale of all or part of the data on any media is not permitted.
  - The data provider gives no guarantee that the data is free of third-party intellectual
    property rights, database rights or other related rights.
  notes: No IP-based restrictions have been imposed by third parties on the data associated
    with the instances.
regulatory_restrictions:
  regulatory_restrictions:
  - No export controls apply to the dataset. Data transfer to recipient institutions is governed
    by a Data Transfer and Use Agreement with the University of South Florida Board of Trustees,
    which requires appropriate administrative, technical and physical safeguards, restricts
    access to named authorized persons, prohibits contacting data subjects without IRB approval
    and written provider approval, and requires notification of any unauthorized use or disclosure
    within five business days of discovery.
  hipaa_compliant: compliant
  confidentiality_level: restricted
  other_compliance: The data is covered under a Certificate of Confidentiality, which must
    be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant. The data is Personally Identifiable
    Information as defined in OMB Memorandum M-07-16. Recipients must adhere to the requirements
    of PhysioNet, managed by the MIT Laboratory for Computational Physiology.
data_governance:
  committee_name: Data Access Compliance Office (DACO)
  accountable_organization:
    name: University of South Florida Board of Trustees
    description: Provider institution under the Data Transfer and Use Agreement for the Bridge2AI
      Voice as a Biomarker of Health project, and the institution whose Institutional Review
      Board approved data collection and sharing.
  access_review_process: Registered access to the featurized data requires registration on
    PhysioNet, confirmation of identity and signature of the Bridge2AI-Voice Registered Access
    Agreement. Controlled access to raw audio requires completion of a Data Access Request
    Form and a Data Use Agreement, submission of the application to the Data Access Compliance
    Office for review, and, on approval, signature of a Data Use and Transfer Agreement by
    an authorized official at the applicant's institution. The Data Transfer and Use Agreement
    is effective only upon review and approval by the Data Access Compliance Office, which
    requires a distinct application. Requests are initiated by emailing DACO@b2ai-voice.org.
  notes: A published memorandum sets out the ethical justification for restricting raw voice
    data samples to controlled access. The agreement runs for two years from the start date,
    or until completion of the project, expiry of the applicable ethics approval, or termination
    by the provider, whichever occurs first, and either party may terminate on thirty days
    written notice.
is_deidentified:
  identifiable_elements_present: false
  method: HIPAA Safe Harbor, with additional removal of indirect and highly sensitive elements
  identifiers_removed: HIPAA Safe Harbor identifiers, including names, geographic locators,
    dates at resolution finer than years, phone and fax numbers, email addresses, IP addresses,
    Social Security numbers, medical record numbers, health plan beneficiary numbers, device
    identifiers, license numbers, account numbers, vehicle identifiers, website URLs, full
    face photographs, biometric identifiers and other unique identifiers; state and province
    of collection, with country retained; direct identifiers such as name, civic address and
    social security number; selected geographic and demographic indirect identifiers, and
    information about household composition or cultural identity; non-identifying but highly
    sensitive elements such as household income, mental health status and traumatic life experiences;
    narrative text fields and transcripts of free speech audio; all raw voice waveforms.
  deidentification_details: Dates were rebased or replaced by integers and geographic information
    was removed or generalized. Raw audio transcripts were reviewed and any recordings containing
    potentially identifying information or external voices were removed from the release.
    Spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and articulatory estimates
    derived from open-response prompts were withheld from the feature-only dataset. K-anonymization
    at k greater than or equal to two is not achieved.
  source_caveats: 'Voice cannot be fully de-identified: the consortium states that even with
    HIPAA identifiers removed, a person''s voice is unique to them, which is the stated reason
    for restricting raw audio to controlled access.'
