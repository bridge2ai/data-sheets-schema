distributions:
- description: Derived audio features for the retained recordings. Dense per-frame features
    are distributed as Apache Parquet, an open-source column-oriented data file format, each
    element carrying participant_id, session_id, task_name, n_frames and the feature tensor.
    Recording-level summaries are distributed as tab-delimited text. Every data file is accompanied
    by a JSON data dictionary sharing its file stem, describing the feature and the processing
    applied.
  id: doi:10.13026/8xbn-nq66#collection-features
  name: features
  path: features
- description: Spectrograms of dimension 201 by T for 29,278 recordings, generated with a
    25 ms window size, 10 ms hop length and a 400-point FFT.
  id: doi:10.13026/8xbn-nq66#file-torchaudio-spectrogram
  name: torchaudio_spectrogram.parquet
- description: Mel spectrograms of dimension 60 by T for 29,278 recordings, generated with
    a 25 ms window size, 10 ms hop length, a 400-point FFT and 60 Mel bins.
  id: doi:10.13026/8xbn-nq66#file-torchaudio-mel-spectrogram
  name: torchaudio_mel_spectrogram.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60 by T for 29,278 recordings,
    using the same parameters as the Mel spectrograms.
  id: doi:10.13026/8xbn-nq66#file-torchaudio-mfcc
  name: torchaudio_mfcc.parquet
- description: Detected pitch, the fundamental frequency, over time, of dimension T for 32,522
    recordings, with a minimum and maximum pitch of 80 and 500 Hz.
  id: doi:10.13026/8xbn-nq66#file-torchaudio-pitch
  name: torchaudio_pitch.parquet
- description: 'Estimated electromagnetic articulography for 28,640 recordings, of dimension
    T by 12, the twelve channels being X and Y positions of six articulators: tongue dorsum,
    tongue body, tongue tip, lower incisor, upper lip and lower lip.'
  id: doi:10.13026/8xbn-nq66#file-sparc-ema
  name: sparc_ema.parquet
- description: Estimated loudness for 31,855 recordings, based on the average absolute amplitude
    of the audio waveform in 20 ms windows, of dimension T.
  id: doi:10.13026/8xbn-nq66#file-sparc-loudness
  name: sparc_loudness.parquet
- description: Estimated periodicity, the confidence of pitch presence, for 31,872 recordings,
    derived using 20 ms windows, of dimension T.
  id: doi:10.13026/8xbn-nq66#file-sparc-periodicity
  name: sparc_periodicity.parquet
- description: Estimated fundamental frequency for 31,872 recordings, computed with a different
    algorithm from the torchaudio pitch, over a range of 50 to 550 Hz, of dimension T.
  id: doi:10.13026/8xbn-nq66#file-sparc-pitch
  name: sparc_pitch.parquet
- description: Phonetic posteriorgram probabilities across 40 phoneme categories for 29,289
    recordings, of dimension 40 by T at a frame rate of 100 Hz.
  id: doi:10.13026/8xbn-nq66#file-ppgs
  name: ppgs.parquet
- description: Recording-level features derived from the raw audio using openSMILE, Praat,
    Parselmouth and torchaudio, one row per unique recording and one column per feature.
  format: TSV
  id: doi:10.13026/8xbn-nq66#file-static-features
  media_type: text/tab-separated-values
  name: static_features.tsv
- description: Quality control metrics derived from the raw audio, one feature per audio recording.
    Introduced in version 3.1.0.
  format: TSV
  id: doi:10.13026/8xbn-nq66#file-audio-quality-metrics
  media_type: text/tab-separated-values
  name: audio_quality_metrics.tsv
- description: A binary Parquet file and its corresponding data dictionary carrying per-recording
    metadata, including task instructions and prompts and information about the microphone
    used and its gain. Introduced in version 3.1.0.
  id: doi:10.13026/8xbn-nq66#collection-metadata
  name: metadata
  path: metadata
- description: Tab-delimited tables of information collected from the participant or another
    informant during the encounter, organized into confounders, demographics, diagnosis, enrollment,
    questionnaire and task subfolders. The diagnosis subfolder holds one table per condition,
    covering airway stenosis, amyotrophic lateral sclerosis, anxiety, benign lesions, bipolar
    disorder, cognitive impairment, control, COPD and asthma, depression, glottic insufficiency,
    laryngeal cancer, laryngeal dystonia, laryngitis, muscle tension dysphonia, Parkinson's
    disease, precancerous lesions, unexplained chronic cough and unilateral vocal fold paralysis.
    The questionnaire subfolder holds the ADHD adult, custom affect scale, DSM-5 adult, dyspnea
    index, GAD-7, Leicester cough questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric
    history, PTSD adult, VHI-10 and voice perception instruments. The task subfolder holds
    acoustic task, Harvard sentences, random item generation, recording, session, Stroop and
    Winograd tables. Every table is paired with a JSON data dictionary whose keys match the
    table's column names and whose values give a one-sentence description, the question asked
    of the participant where applicable, and the data type of the response.
  id: doi:10.13026/8xbn-nq66#collection-phenotype
  name: phenotype
  path: phenotype
purposes:
- response: To create an ethically sourced flagship dataset of voice recordings linked to
    health information, so that voice can be developed as a biomarker of health and integrated
    into clinical care.
- response: To enable the development, benchmarking or validation of clinically applicable
    machine-learning models for diagnosing a wide range of health conditions from voice, including
    vocal pathologies and neurological, psychiatric, respiratory and pediatric voice disorders.
- response: To introduce and standardize the field of audiomics by developing new standards
    of acoustic and voice data collection and analysis, creating benchmarks of diversity metrics,
    and minimizing the risk of algorithmic bias.
- response: To supply an openly documented resource that supports ethical and trustworthy
    voice AI research, including guidance on consent, data sharing and privacy safeguards
    for voice data.
tasks:
- response: Detection and classification of disease from voice, speech, breath and cough,
    across vocal pathologies, neurological and neurodegenerative disorders, mood and psychiatric
    disorders, and respiratory disorders.
- response: Screening, diagnosis and longitudinal monitoring of health conditions using voice
    as a non-invasive, low-cost biomarker.
- response: Methodological work on acoustic feature extraction, voice bioinformatics standards
    and diversity benchmarking for voice AI.
addressing_gaps:
- response: Previous studies of machine-learning voice diagnosis produced promising results
    but used sample sizes that were too small, or lacked the key metadata needed for training
    robust, clinically useful models.
- response: Comparing studies and pooling data has been difficult because of the absence of
    standards for how voice and other acoustic data are measured and collected; the dataset
    supplies a standardized, protocol-driven collection.
- response: Industry holds large volumes of voice data but lacks accurate clinical and demographic
    annotation, and those datasets are private, which prevents external auditing of training
    data for fair representation of diverse populations.
