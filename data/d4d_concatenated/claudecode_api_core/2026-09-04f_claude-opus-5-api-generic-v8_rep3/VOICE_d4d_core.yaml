instances:
- instance_type: Human participant
  counts: 833
  label: true
  label_description: Each participant carries one or more diagnostic labels resulting from
    clinical assessment. At each site a local clinician provided the diagnosis based on a
    clinical interview and appropriate work-up; for the psychiatric disorders cohort the assessment
    was determined from the participant's electronic health record or an active prescription,
    outside of data collection, by an appropriately licensed clinician.
  data_topic: B2AI_TOPIC:36
  missing_information:
  - missing:
    - Optional questionnaire items
    why_missing:
    - Some questions in the protocol are optional and were left unanswered.
  - missing:
    - Cohort-specific questionnaire and diagnosis fields
    why_missing:
    - Each individual answered a common set of questions and then responded to additional
      questions relevant to their primary diagnostic category, so cohort-specific fields are
      absent for participants outside that cohort.
  - missing:
    - Fields lost to collection irregularities
    why_missing:
    - Data collection irregularities caused some information to be missing from individual
      instances.
- instance_type: Recording-level derived feature set
  data_substrate: B2AI_SUBSTRATE:69
  data_topic: B2AI_TOPIC:36
  notes: One record per retained audio recording, keyed by participant, session and acoustic
    task. Record counts differ between feature families because some recordings could not
    generate certain features and because features derived from free-speech audio were withheld.
anomalies:
- anomaly_details: Different sites used different collection configurations, and the collection
    protocol changed over the course of the study, so recordings are not uniform across sites
    or over time.
- anomaly_details: Some audio files, whether because of length or other issues, could not
    generate certain features and are therefore absent from the bundled feature files; this
    is why per-feature record counts differ, ranging from 28,640 for articulatory estimates
    to 32,522 for pitch.
- anomaly_details: Version 2.0 reprocessed spectrograms to fix minor issues identified in
    the previous release, and version 3.1.0 fixed broken parquet files carried over from version
    3.0.0.
- anomaly_details: Noise artifacts are present in the recordings; the head-mounted headset
    microphone could sit at slightly different distances between participants.
known_biases:
- bias_type: selection_bias
  bias_description: Participants were recruited from high volume expert clinics within academic
    institutions on the basis of an existing diagnosis, using a non-probability sampling method,
    rather than from a general population.
  mitigation_strategy: The consortium plans to shift toward remote collection and to design
    recruiting to control for more variables.
  affected_subsets:
  - doi:10.13026/8xbn-nq66#subset-voice-disorders
  - doi:10.13026/8xbn-nq66#subset-respiratory-disorders
  - doi:10.13026/8xbn-nq66#subset-neurological-disorders
  - doi:10.13026/8xbn-nq66#subset-mood-psychiatric-disorders
- bias_type: representation_bias
  bias_description: The dataset has skews based on disorder category, site and other demographic
    factors, and is not representative because it was collected at a limited number of geographic
    locations. Groups with less trust in the medical system or in AI, and groups less proximal
    to the collection sites, were less likely to be recruited.
  mitigation_strategy: Users are advised to consider the multivariate distribution when assessing
    utility for different questions.
- bias_type: measurement_bias
  bias_description: Distinct iPad devices were used at each site and participants were screened
    for different disorders depending on site, so diagnostic label and recording device are
    confounded. The recording headset could sit at slightly different distances from the mouth.
- bias_type: annotation_bias
  bias_description: A single labeler provided the diagnostic label for each instance, typically
    the clinician at the site of data collection or, for prior diagnostic assessments, a clinician
    external to the study. Diagnostic practice varies between clinicians and sites.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: The collection is a sample of a larger, ongoing effort, drawn from
    five recording sites in the United States and Canada, and is not representative of any
    wider population.
  scope_impact: Limits generalization of models trained on the dataset to other populations
    and settings.
  recommended_mitigation: Assess the multivariate distribution of site, disorder and demographics
    before use.
- limitation_type: coverage_limitation
  limitation_description: Data collection and participant communication were conducted in
    English; only fluent English speakers were eligible. Spanish protocols were under development
    at the time of the documented releases.
- limitation_type: scope_limitation
  limitation_description: Raw audio waveforms are not included in this release; only derived
    features are distributed. Spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams
    and articulatory estimates were additionally withheld for records containing free speech
    and for audio checks.
- limitation_type: methodological_limitation
  limitation_description: 'Diagnostic labels rest on a single clinician''s assessment per
    instance, and validation practices differ by disorder: some diagnoses were confirmed by
    review of imaging or endoscopy, others from an electronic health record entry or an active
    prescription.'
- limitation_type: temporal_limitation
  limitation_description: Changes in diagnostic criteria or practices over the collection
    period are a potential source of distribution shift, as is the change in collection protocol
    during the study.
- limitation_type: integration_limitation
  limitation_description: Multimodal data extracted at individual sites, including imaging,
    laryngoscopy, genomic data for the neurological cohort and other electronic health record
    content, is uploaded through the REDCap database but is not included in this release.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The project documentation records that the released dataset contains
    no data protected by legal privilege or doctor-patient confidentiality and no non-public
    communications.
  source_caveats: The underlying source data is nevertheless covered by a Certificate of Confidentiality,
    recorded under regulatory_restrictions.
content_warnings:
- content_warnings_present: true
  warnings:
  - Free speech transcription may contain material that is offensive, insulting or distressing,
    since participants are responsible for their choice of language.
  - Phenotype tables record mental health status, psychiatric history and trauma-related questionnaire
    responses.
  source_caveats: The warning about free-speech transcription is stated in the project documentation
    healthsheet. In the version 3.1.0 release, transcripts of free-speech audio were removed
    and dense features derived from free-speech recordings were excluded, so the residual
    exposure in this release is reduced.
subpopulations:
- subpopulation_elements_present: true
  identification: Demographic sub-populations are identified by age, gender, sex, ethnicity
    and socioeconomic status, collected through a detailed demographic questionnaire delivered
    in the collection application.
  distribution: The distribution across sub-populations is uneven. The collection is a non-probability
    sample drawn at five sites; groups with less trust in the medical system or in AI, and
    groups less proximal to the collection sites, were less likely to be recruited. Participants
    were screened for different disorders depending on site, so demographic composition, disorder
    category and recording device are entangled.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset includes race and ethnic origin information, sexual orientation
    information, and socioeconomic and health information. All fields encoded as sensitive
    in the REDCap data dictionary, and non-identifying elements revealing highly sensitive
    information such as household income, mental health status and traumatic life experiences,
    were removed before release.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details: Voice, speech, breath and cough were directly observed and recorded
    during the session; demographics, confounders and validated questionnaires were reported
    by subjects; the released features are derived from the recorded waveforms. Clinical diagnoses
    were verified by clinicians reviewing audio or imaging data, consulting electronic health
    records, or checking medication prescriptions, against established gold standards for
    each disorder.
collection_mechanisms:
- mechanism_details: A custom application, the Bridge2AI-Voice app, running on a tablet, hosted
    the data acquisition protocols and collected acoustic tasks, demographic and confounder
    surveys, and validated questionnaires. Data collection was conducted using this application
    with a headset used where possible.
- mechanism_details: Recording hardware comprised iPads of the 9th or 10th generation and
    iPad Air of the 5th generation, with an Avid AE-36 microphone connected through an Apple
    dongle. Distinct iPad devices were used at each site.
- mechanism_details: Clinical, diagnostic and multimodal data were captured in a REDCap database,
    from which the dataset was exported and converted using an open source library developed
    by the consortium.
collection_timeframes:
- timeframe_details: The project documentation states that the data was collected over a period
    of twelve months.
  source_caveats: No absolute collection start or end date is stated for the version 3.1.0
    release. The twelve-month statement accompanies an earlier version of the documentation
    and may not describe the full collection window for the 833 participants in this release.
data_collectors:
- role: researcher
  collector_details: Research teams, which may include medical, graduate or undergraduate
    students, coordinated with clinicians and doctors to identify appropriate participants
    and ran the collection sessions. A trained research assistant assisted in clinic.
- role: researcher
  collector_details: Clinicians and doctors listed under the IRB as co-investigators supplied
    and validated diagnoses; they were added to the consortium so that their names appear
    on consortium-level publications. Hospital staff assisted with the logistics of coordinating
    data collection but were not involved in scheduling.
missing_data_documentation:
- missing_data_patterns: Optional questionnaire items left unanswered; cohort-specific instruments
    absent for participants outside the relevant diagnostic category; phenotype tables containing
    a row for a participant only where at least one column is not missing; feature files omitting
    recordings for which a given feature could not be generated.
  missing_data_causes: Some questions in the protocol are optional; data collection irregularities
    during sessions; each individual answered a common set of questions plus additional questions
    relevant to their primary diagnostic category; deliberate withholding of features derived
    from free-speech recordings and audio checks for privacy reasons.
  handling_strategy: A missingness table is included with the dataset and missingness tables
    are generated as part of the audit protocol. No imputation was performed.
raw_data_sources:
- source_description: Prospectively recorded voice, speech, breath and cough audio collected
    from consented participants performing standardized acoustic tasks through the Bridge2AI-Voice
    application on a tablet with a headset microphone.
  source_type: Primary prospective collection
  raw_data_format: WAV audio waveforms
  access_details: Raw audio is not part of this release. It is disseminated only under controlled
    access; requests are made to the access committee at DACO@b2ai-voice.org, and approved
    users receive the data through Synapse at https://www.synapse.org/Synapse:syn72370534/.
    A Data Access Request Form, a Data Use Agreement and an institutionally signed Data Use
    and Transfer Agreement are required.
- source_description: Demographic, confounder, diagnostic and validated questionnaire responses
    captured in a REDCap database, together with clinician-entered clinical validation against
    gold standard diagnostic evidence.
  source_type: Electronic data capture system
  raw_data_format: REDCap export converted to tab-delimited tables with JSON data dictionaries
  access_details: The supporting REDCap data dictionary, metadata and instrument PDFs are
    published at https://github.com/eipm/bridge2ai-redcap and archived on Zenodo.
- source_description: Multimodal clinical data extracted from site systems, including laryngoscopy
    and stroboscopy imaging, chest and brain imaging, spirometry, and genomic data for the
    neurological cohort.
  source_type: Retrospective extraction from electronic health records and clinical systems
  access_details: Not released in this dataset. Genomic data was collected and analyzed only
    at the University of Toronto and Mount Sinai Hospital under a separate Canadian research
    ethics protocol.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  source_data: Patients presenting at specialty clinics and academic institutions, screened
    against inclusion and exclusion criteria before their visit by the project investigators,
    together with control participants.
  strategies: Non-probability sampling; purposive recruitment from high volume expert clinics
    defined as outpatient clinics with expertise in a specific disease area seeing more than
    fifty patients a month from the same disease category.
  why_not_representative: The data is not representative because it was collected at a limited
    number of geographic locations. The consortium states it hopes to make the collection
    more representative by shifting to remote collection and designing recruitment to control
    for more variables.
  notes: The IRB protocol additionally approves recruitment through flyers carrying QR codes
    that link to a secure REDCap screening survey, recruitment of individuals in waiting rooms,
    social media platforms and the FlowTrials online platform, and targeted medical record
    review where specific diagnoses or severities are under-represented. These are approved
    recruitment methods across the protocol's four study phases; the bundle does not attest
    which of them supplied the 833 participants in this release.
preprocessing_strategies:
- preprocessing_details: Raw audio was preprocessed by converting to monaural and resampling
    to 16 kHz with a Butterworth anti-aliasing filter applied.
- preprocessing_details: Spectrograms were computed from the standardized audio using the
    short-time Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point
    FFT, and were further downsampled by a factor of two in the time domain after derivation.
    Sixty Mel-frequency cepstral coefficients and a 60-bin Mel spectrogram were derived with
    the same parameters.
- preprocessing_details: Articulatory features were generated using the Speech Articulatory
    Coding package, producing kinematic traces of vocal tract articulators and source features
    together with loudness, periodicity and pitch measures, all gathered at 50 Hz. Phonetic
    posteriorgrams giving a time-varying categorical distribution over acoustic units of speech
    were generated at 100 Hz.
- preprocessing_details: Acoustic features were extracted using openSMILE, capturing temporal
    dynamics and acoustic characteristics, and phonetic and prosodic features were computed
    using Parselmouth and Praat, providing measures of fundamental frequency, formants and
    voice quality.
- preprocessing_details: Transcriptions were generated using the OpenAI Whisper Large model.
    Transcripts of free speech audio were removed before release.
cleaning_strategies:
- cleaning_details: 'No pre-processing was performed for the purpose of cleaning the data,
    and no instances were excluded at the time of preprocessing. Quality control instead takes
    the form of an audit protocol run over the release: generating missingness tables, checking
    distributions and outliers, checking categorical responses against the schema, and running
    quality control metrics on audio tasks, including the amount of silence, the duration,
    and for speech tasks a comparison of the produced speech against the intended passage.
    Processing is performed with the b2aiprep and SenseLab toolkits. Version 3.1.0 adds a
    file of per-recording audio quality metrics.'
labeling_strategies:
- labeling_details: Diagnostic labels are the result of a clinical assessment of the participant.
    At each site, a local clinician provided the diagnosis based on a clinical interview and
    appropriate work-up. For the psychiatric disorders cohort the assessment was determined
    from the participant's electronic health record or an active prescription, outside of
    data collection, by an appropriately licensed clinician. The strategy is described as
    a gold standard label available in the data.
  annotations_per_item: 1
  data_annotation_protocol: Bridge2AI protocols and ICD-10 codes, with disorder-specific gold
    standard validation methods set out in the cohort inclusion and exclusion criteria.
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to the
    study where the diagnostic assessment predated collection. No further annotator demographic
    information is recorded.
  notes: Human-level performance on the applications the dataset is intended to address is
    described as varying widely. The consortium recommends that the process for any new labels
    be described alongside any release of a model or publication, including the exact variables
    used for the determination.
machine_annotation_tools:
- tools:
  - OpenAI Whisper Large
  - openSMILE
  - Praat and Parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - ppgs
  - b2aiprep
  - SenseLab
  tool_descriptions: Whisper Large generated transcriptions; openSMILE extracted acoustic
    features capturing temporal dynamics; Praat through the Parselmouth interface produced
    phonetic and prosodic measures of fundamental frequency, formants and voice quality; torchaudio
    produced spectrograms, Mel spectrograms, MFCCs and pitch contours; sparc produced electromagnetic
    articulography estimates together with loudness, periodicity and pitch; ppgs produced
    high-fidelity neural phonetic posteriorgrams. b2aiprep organized and preprocessed the
    dataset and SenseLab processed the audio files; this release was generated with b2aiprep
    version 3.0.0.
  notes: Certain aspects of the data, for example transcription, were generated using off-the-shelf
    models that have not been audited for correctness, so no accuracy figures are available.
existing_uses:
- examples:
  - A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer
    School and hackathon.
  notes: The project documentation records no repository that links to papers or systems using
    the dataset beyond ordinary citation indices.
future_use_impacts:
- impact_details: The dataset has skews based on disorder category, site and other demographic
    factors. Users should consider the multivariate distribution when assessing utility for
    different questions, and should be aware that models trained on it may not generalize
    to populations, languages or recording conditions absent from the collection.
discouraged_uses:
- discouragement_details: Non-research applications such as hiring decisions, insurance premium
    adjustments, or any form of surveillance that could lead to discrimination or harm. These
    limitations are intended to prevent unethical or biased outcomes that could negatively
    affect individuals on the basis of their health conditions or voice characteristics.
intended_uses:
- use_category: Research
  usage_notes: The dataset is intended solely for commercial and non-commercial research purposes
    by Authorized Researchers, as set out in the registered access agreement.
  examples:
  - AI model pretraining, fine-tuning, benchmarking and validation
  - Clinical research into disease screening, diagnosis and monitoring through voice biomarkers
- use_category: Cohort selection and phenotyping
  usage_notes: The questionnaire features are collected and distributed in the phenotype folder
    and can be used for cohort selection.
prohibited_uses:
- description: Attempting to re-identify research participants, or taking any action that
    could reasonably lead to re-identification.
  prohibition_reason: The B2AI-Voice Consortium's commitment to advancing ethical and trustworthy
    research practices that respect and protect the rights and interests of research participants,
    whose privacy the two-tier access structure is designed to protect.
- description: Any purpose that could foreseeably cause harm or stigmatization to research
    participants, their families, communities, or specific populations.
  prohibition_reason: To prevent unethical or biased outcomes that could negatively affect
    individuals on the basis of their health conditions or voice characteristics.
- description: Using intellectual property protections, database rights or related rights
    in a manner that restricts or limits access to any part of the dataset or to any conclusions
    derived from it.
  prohibition_reason: To ensure that future use of the dataset remains unrestricted, in alignment
    with the Open Science principles upheld by the B2AI-Voice Consortium.
distribution_formats:
- name: Registered access featurized release on PhysioNet
  description: Derived features and phenotype tables distributed as Apache Parquet and tab-delimited
    text with JSON data dictionaries. Access requires a PhysioNet account, credentialing,
    and signature of the Bridge2AI Voice Registered Access Agreement; no additional training
    is required.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
distribution_dates:
