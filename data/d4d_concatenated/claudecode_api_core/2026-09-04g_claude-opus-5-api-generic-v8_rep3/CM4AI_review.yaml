notes: >-
  The pack lists no gaps and no claims sidecar (records.claims null). Six of the
  sampled receipts cite a chunk adjacent to the one actually holding the snippet
  (slot-010 c012 vs c011, slot-013 c013 vs c012, slot-019 c027 vs c026,
  slot-022/024 c019 vs c018, slot-032 c002 vs c008; likewise the receipt's c006
  funders entry sits at line 2338 in c007) — consistent with the validator's
  reported adjacent=43/elsewhere=4, so an existing instrument measurement, not a
  new defect; support held in every sampled case. chunk-c007's nothing_relevant
  reason describes only the reference list although the chunk also holds the
  Nature acknowledgements and author affiliations; nothing was missed. The
  rule-01 finding (creators[1].notes claims the preprint gives "Jillian Parker"
  where it gives "Jillian Mohan", line 2927) is a candidate for a curator
  disposition (amend). The rule-13 finding notes two silently resolved
  disagreements: the cm4ai.org "Released on: June 17, 2025" line and RePORTER's
  2026-08-31 project end.
