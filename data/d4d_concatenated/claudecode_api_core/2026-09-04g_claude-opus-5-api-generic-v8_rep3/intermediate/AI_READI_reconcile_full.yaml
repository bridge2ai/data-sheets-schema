splits:
- split_details: >-
    A 70%/15%/15% training/validation/testing assignment is supplied per participant in
    the participants.tsv file included with the dataset. Because sex, race and ethnicity
    are not released with the public version, the project team constructed the
    assignment so that the validation and test sets are balanced as well as possible for
    sex, race/ethnicity and diabetes status; the split was introduced with version 3.0.0
    and also balances for age and study group.
  notes: >-
    The split is a recommendation rather than a constraint; no tasks or labels accompany
    it, and the project team states it has no formal guidelines for researchers who
    define new tasks or create new labels.

