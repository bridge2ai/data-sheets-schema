notes: >-
  Both the FAIRhub dataset pages and the AI-READI documentation site carry the notice
  "This repository is under review for potential modification in compliance with
  Administration directives." At the point the FAIRhub API record was captured, version
  3.0.0 reported a view count of 24,636 and a citation count of 0.
source_caveats: >-
  This record describes the publicly downloadable FAIRhub release of version 3.0.0
  (DOI 10.60775/fairhub.3). Sources disagree on the expansion of the acronym: the
  FAIRhub study description and NIH RePORTER give "Artificial Intelligence Ready and
  Exploratory Atlas for Diabetes Insights", while the BMJ Open protocol and the Nature
  Metabolism comment give "Artificial Intelligence Ready and Equitable Atlas for
  Diabetes Insights"; the higher-ranked FAIRhub metadata is followed here. Sources also
  disagree on the lead institution: the FAIRhub structured metadata names Washington
  University in St. Louis as managing organization and lead sponsor and the license
  names it as Licensor, while the RO-Crate places the principal investigator in the
  Department of Ophthalmology at the University of Washington and NIH RePORTER records
  the awardee organization as the University of Washington; the two disagreeing tier-1
  sources share the same rank, so both are recorded. Publisher is likewise disputed
  between the two tier-1 sources: the FAIRhub structured metadata gives the
  publisherName "FAIRhub" and the RO-Crate gives "AI-READI Consortium"; the FAIRhub
  position is followed in `publisher`, where the platform URL is recorded in the
  uriorcurie-ranged slot in place of the bare name the source states, and the RO-Crate
  value is noted here. Enrollment target is given as 4,000 participants by the FAIRhub
  study description, the NIH RePORTER abstract and both publications, but as 4,600 by
  the University of Washington IRB protocol.

