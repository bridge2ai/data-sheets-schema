  measurement_technique: >-
    Garmin Vivosmart 5 wrist-worn activity monitor; heart rate was additionally read
    from the electrocardiogram and blood pressure devices during the on-site visit.
- variable_name: oxygen_saturation
  measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
- variable_name: respiratory_rate
  measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
- variable_name: sleep_duration
  measurement_technique: >-
    Garmin Vivosmart 5 wrist-worn activity monitor; recorded as circadian and diurnal
    rhythm, with sleep phases.
- variable_name: step_count
  data_type: integer
  measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
- variable_name: stress_level
  measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
- variable_name: moca_total_score
  data_type: integer
  maximum_value: 30.0
  measurement_technique: >-
    Montreal Cognitive Assessment administered by research staff on an iPad using the
    pre-installed MoCA Duo application; six domain-specific index scores, a Memory Index
    Score and task completion times are recorded alongside the total.
  quality_notes: >-
    A score of 26 and above is considered normal and anything below 24 is a sign of
    cognitive impairment; the source notes that a person's level of education,
    socioeconomic factors, and depression or other mental health conditions may affect
    the score.
- variable_name: visual_acuity_logmar
  unit: logMAR
  measurement_technique: >-
    Electronic Visual Acuity tester (M&S Technologies) at four meters under
    best-corrected conditions, each eye separately, under photopic conditions and under
    mesopic conditions using a 2.0 neutral density filter.
  quality_notes: Lower numbers indicate better resolution.
- variable_name: contrast_sensitivity_log_cs
  unit: log contrast sensitivity
  measurement_technique: >-
    Mars Letter Contrast Sensitivity chart (Mars Perceptrix) read monocularly under
    photopic conditions and under mesopic conditions using a neutral density occluder;
    testing terminated after two consecutive errors or at the end of the chart.
  quality_notes: Higher numbers indicate better sensitivity.
- variable_name: hba1c
  measurement_technique: >-
    Whole blood test performed by the University of Washington Nutrition and Obesity
    Research Center laboratory on samples batch-shipped from the collection sites.
  source_caveats: >-
    The BMJ Open protocol reports units and a reference range for this analyte in a
    multi-column table whose columns were separated in the bundled text; no unit or
    range is asserted here because the row alignment could not be read unambiguously.
- variable_name: ambient_temperature
  measurement_technique: LeeLab Anura home environmental sensor, over a ten-day placement.
- variable_name: relative_humidity
  measurement_technique: LeeLab Anura home environmental sensor, over a ten-day placement.
- variable_name: particulate_matter
  measurement_technique: >-
    LeeLab Anura home environmental sensor; counts reported for the PM1.0, PM2.5, PM4 and
    PM10 size fractions.
- variable_name: nitrogen_oxides
  measurement_technique: >-
    LeeLab Anura home environmental sensor; nitric oxide (NO) and nitrogen dioxide (NO2).
- variable_name: volatile_organic_compounds
  measurement_technique: LeeLab Anura home environmental sensor.
- variable_name: multispectral_light_intensity
  measurement_technique: >-
    LeeLab Anura home environmental sensor; eleven multi-spectral light intensity
    measurements.
- variable_name: monofilament_response
  measurement_technique: >-
    Standard 10 g monofilament applied to points on the plantar surface of both feet with
    shoes and socks removed and the participant's eyes closed; the participant answers
    yes or no at each site, insensate areas are retested for confirmation, and results
    are entered into REDCap by clinical research staff.

acquisition_methods:
- was_directly_observed: true
  acquisition_details: >-
    Directly observable data were measured during the visit or by the take-home devices:
    laboratory tests on blood and urine, vital signs and physical measurements, vision
    testing, retinal imaging, 12-lead electrocardiography, monofilament testing,
    continuous glucose monitoring, wearable activity monitoring and home environmental
    sensing.
- was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: >-
    Survey and questionnaire responses were reported by participants through REDCap.
    Verification of data entry was performed where possible - for example
    cross-referencing entered medications against medications physically brought in or
    photographed by the participant.

collection_mechanisms:
- mechanism_details: >-
    REDCap electronic data capture, used both for the online recruitment and e-consent
    interface and for collecting participant-reported questionnaire data and
    coordinator-entered clinical data (medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament results and complete blood count results).
- mechanism_details: >-
    Optomed Aurora IQ handheld non-mydriatic fundus camera (Optomed, Oulu, Finland), 50
    degree field of view, 5 Mpix sensor; used undilated in a dark room with the
    participant reclining. Image quality varies between and within participants because
    the eye is undilated and the camera is handheld.
- mechanism_details: >-
    iCare EIDON widefield TrueColor confocal fundus imaging system (iCare USA, Raleigh,
    North Carolina), capturing up to 200 degrees, operated in fully automated mode in a
    dark room; AI-READI acquires single-field central IR/FAF and a smart horizontal
    mosaic.
- mechanism_details: >-
    Heidelberg Spectralis HRA+OCT (Heidelberg Engineering, Heidelberg, Germany),
    combining confocal scanning laser ophthalmoscopy with OCT and angiography; AI-READI
    protocols are optic nerve head radial circle high resolution, posterior pole macula
    61-line high resolution, and 20x20 macular OCTA.
- mechanism_details: >-
    Topcon Maestro2 3D OCT-1 robotic OCT and color fundus camera (Topcon Healthcare,
    Itabashi-ku, Tokyo, Japan); protocols are 12.0x9.0 mm widefield, 6.0x6.0 mm 3D macula
    and 6.0x6.0 mm OCTA at a 50 kHz scan rate.
- mechanism_details: >-
    Topcon Triton DRI OCT swept-source system with a 1,050 nm light source and
    non-mydriatic color fundus camera (Topcon Healthcare); protocols are 12.0x12.0 mm and
    6.0x6.0 mm OCTA and 12.0x9.0x6.0 mm 3D horizontal and radial scans.
- mechanism_details: >-
    Zeiss Cirrus 5000 AngioPlex high-definition OCT system (Carl Zeiss Meditec, Jena,
    Germany); protocols include 512x512 and 200x200 macula and optic nerve head scans,
    macular OCTA, 8x8 mm single scans and a 14x14 mm automated OCTA montage.
- mechanism_details: >-
    Heidelberg FLIO fluorescence lifetime imaging ophthalmoscope (Heidelberg
    Engineering), macula-centered, exported in .sdt format and converted to DICOM. It is
    performed last in the visit because it takes longer than a standard Spectralis OCT
    and exposes participants to uncomfortable light levels.
- mechanism_details: >-
    Philips PageWriter TC30 cardiograph (Philips, Amsterdam, The Netherlands) for
    12-lead electrocardiography, performed with the participant reclining or supine and
    the chair position (0, 30, 60 or 90 degrees relative to supine) recorded; exported as
    XML.
- mechanism_details: >-
    Dexcom G6 real-time integrated continuous glucose monitoring system (Dexcom, San
    Diego, California), worn continuously for ten days after the visit; a filament
    inserted under the skin measures glucose in tissue fluid and the transmitter records
    readings every five minutes.
- mechanism_details: >-
    Garmin Vivosmart 5 fitness activity tracker (Garmin Ltd, Schaffhausen, Switzerland),
    worn for ten consecutive days on the participant's chosen wrist at a five-second
    sampling frequency; participants returned a form recording which wrist was used and
    their dominant hand.
- mechanism_details: >-
    LeeLab Anura, a home environmental sensor unit custom designed by the Karalis Johnson
    Retina Center, University of Washington, placed in a frequently used area of the
    participant's home for ten days; participants recorded where it was placed.
- mechanism_details: >-
    M&S Technologies Electronic Visual Acuity (EVA) tester, administered at four meters
    on a 12x20 inch touch-screen monitor with the participant's own correction or trial
    frames; a general occluder is used for photopic testing and a neutral density
    occluder for mesopic testing.
- mechanism_details: >-
    Mars Letter Contrast Sensitivity test (Mars Perceptrix, Chappaqua, New York), read
    monocularly at a designed 50 cm viewing distance with near correction, under
    background luminance of 60 to 120 cd/m2 and illuminance of 189 to 377 lux, in the
    standardized order photopic right eye, photopic left eye, mesopic right eye, mesopic
    left eye, all undilated.
- mechanism_details: >-
    Topcon KR 800 auto keratometer/refractor (Topcon Healthcare, Oakland, New Jersey) for
    autorefraction of each eye, giving spherical and cylindrical components in dioptres
    with cylindrical axis.
- mechanism_details: >-
    Lensometers, varying by data acquisition site: NIDEK LM-600P auto lensometer, Topcon
    CL-200 and Topcon CL-300 computerized lensometers.
- mechanism_details: >-
    Automatic oscillometric blood pressure devices, varying by data acquisition site:
    OMRON HEM 907XL, Medline MDS4001 automatic digital monitor, and Welch Allyn 6000
    series vital signs monitor with a Welch Allyn FlexiPort reusable cuff. Systolic,
    diastolic and heart rate were measured twice, separated by two minutes.
- mechanism_details: >-
    Montreal Cognitive Assessment administered electronically on an iPad using the MoCA
    Duo application (MoCA Cognition, Quebec, Canada), which captures participant
    responses interactively.
- mechanism_details: >-
    Standard 10 g monofilament for peripheral neuropathy testing on three locations of
    each foot, ten times per location, with the participant's eyes closed and shoes and
    socks removed; results are entered on an iPad, laptop or paper questionnaire and
    added to REDCap by clinical research staff.
- mechanism_details: >-
    Clinical laboratory testing: Clinical Laboratory Improvement Amendments-certified
    laboratories local to each collection site performed complete blood counts on fresh
    whole blood, and all other assays were performed by the University of Washington
    Nutrition and Obesity Research Center testing facility on stored frozen samples
    batch-shipped on dry ice approximately quarterly.

data_collectors:
- name: University of Washington AI-READI site team
  role: clinical research site
  collector_details: >-
    Recruited, consented and tested participants in Seattle, Washington. Site teams
    comprise clinical research coordinators, research assistants, phlebotomists,
    laboratory assistants, data managers and project managers; their effort was supported
    by NIH award OT2OD032644 in proportion to percentage effort, at salaries aligned with
    the funding guidelines at each site.
- name: University of Alabama at Birmingham AI-READI site team
  role: clinical research site
  collector_details: >-
    Recruited, consented and tested participants in Birmingham, Alabama. The UAB data
    manager also trained research personnel at all three sites, and UAB coordinated the
    stratified selection of recruitment waves across the combined site contact pool.
- name: University of California, San Diego AI-READI site team
  role: clinical research site
  collector_details: >-
    Recruited, consented and tested participants in La Jolla/San Diego, California.

direct_collection:
- is_direct: true
  collection_details: >-
    Data were collected directly from participants at the three recruiting sites, not
    obtained via third parties. Recruitment pools were first identified by screening each
    site's electronic health records for diabetes and pre-diabetes ICD-10 codes among
    patients with a recent encounter in that health system, after which individuals were
    invited by mailed letter and email to enroll through the study's REDCap interface.

collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: >-
    The period during which the data in version 3.0.0 were collected, spanning the pilot
    phase and the first two years of the main study. The overall project timeline spans
    four years, with one year for protocol development and training and years two to four
    for recruitment and data collection.
  source_caveats: >-
    The FAIRhub metadata and healthsheet both give 19 July 2023 as the start of
    collection for this version. The BMJ Open protocol publication instead states that
    enrollment began on 18 July 2023 and would continue until 30 November 2026; the
    higher-ranked FAIRhub value is recorded here.

sampling_strategies:
- is_sample: false
  is_random: false
  is_representative: false
  strategies: >-
    Non-probability sampling. Contact pools were identified at each site by screening
    electronic health records for ICD-10 diagnosis codes and demographic data, and
    invitations were issued in waves whose composition and size were adjusted by under-
    and oversampling groups as recruitment progressed, with the aim of an equal
    distribution across four self-reported race/ethnicity groups, biological sex and four
    diabetes severity categories. All participants who enrolled and completed the
    protocol within the collection window are included; no instances were excluded at
    preprocessing.
  why_not_representative: >-
    The cohort is deliberately balanced across race/ethnicity, sex and diabetes severity
    rather than matched to the demographic distribution of the United States population,
    because balanced training data are treated as critical for developing unbiased
    machine learning models.
  source_caveats: >-
    Two equally ranked tier-1 sources disagree, and the record carries the tension rather
    than resolving it: the FAIRhub healthsheet answers that the dataset contains all
    possible instances and records "N/A" for sampling strategy, while the FAIRhub study
    description records the sampling method as a non-probability sample; the BMJ Open
    protocol describes stratified, wave-based recruitment from an
    electronic-health-record-derived study base of patients aged 40 and over seen at the
    three health systems. is_sample is set to false with respect to enrolled participants,
    following the healthsheet, while the recruitment sampling described by the other two
    sources is recorded under strategies; the two statements are in tension and a reader
    should treat is_sample as scoped to enrollment completeness only.

cleaning_strategies:
- cleaning_details: >-
    Quality control was applied at the time of data entry and acquisition. Clinical data
    outside expected minimum/maximum ranges were flagged in REDCap and surfaced in reports
    reviewed by clinical research coordinators and data managers, who examined the
    participant record and determined whether an error was likely. Data were checked for
    credibility against prespecified ranges, incorrect flow through prescribed skip
    patterns, missing data that could be filled directly from other portions of an
    individual's record, and the omission or duplication of records. Editing was performed
    only under the guidance and approval of the site principal investigator; where no
    logical or appropriate correction existed, the site principal investigator reviewed the
    values and decided whether to remove them.
- cleaning_details: >-
    The data manager at each collection site was responsible for the quality control of
    all data before upload to FAIRhub. After transfer to the central project team, the
    dataset was additionally reviewed internally by AI-READI team members for quality and
    to confirm that no personally identifiable information had been included.

preprocessing_strategies:
- preprocessing_details: >-
    All data were mapped to applicable standardized terminologies and data standard
    formats where possible: the Observational Medical Outcomes Partnership Common Data
    Model for clinical data, the Digital Imaging and Communications in Medicine standard
    for retinal imaging, the WaveForm DataBase format for electrocardiography, and Open
    mHealth for wearable activity and continuous glucose monitoring data.
- preprocessing_details: >-
    Device-native formats were converted before upload: Topcon Maestro2 and Triton
    exports (.fda) and Heidelberg FLIO exports (.sdt) were converted to DICOM, and Garmin
    exports (.FIT) were converted to the mHealth standard. Electrocardiograms were
    exported as XML and MoCA results as CSV before conversion.
- preprocessing_details: >-
    Version 3.0.0 was produced by a combination of automated and custom processing.
  notes: >-
    The CHANGELOG summary table records that processing evolved across releases: version
    1.0.0 was produced by custom, ad hoc processing, while the year 2 and year 3 data and
    the v3.0.0 main study release were produced by automated plus custom processing.

raw_sources:
- raw_data_details: >-
    Raw data as exported from the collection devices and from REDCap are retained and
    expected to be preserved by the AI-READI project at least for the duration of the
    project, but are not currently shared outside the project team, because they have not
    been mapped to standardized terminologies and may accidentally include personal health
    information or personally identifiable information in free-text fields. The project
    notes the possibility that raw data may be included in future releases of the
    controlled-access dataset.

missing_data_documentation:
- missing_data_patterns: >-
    Not all modalities are available for all participants; coverage varies by modality
    rather than being missing at random across the whole record.
  missing_data_causes: >-
    Participants electing not to take part in some study elements; collection devices
    holding no stored results or being returned too late for retrieval (for example a
    battery that died); data collisions in the processing chain; skipped questions and
    incomplete responses in surveys; and imaging sessions abandoned because of quality
    problems.
  handling_strategy: >-
    No imputation was applied. During cleaning, missing values that could be filled
    directly from other portions of an individual's record were filled; values that could
    not be logically corrected were reviewed by the site principal investigator for
    possible removal.

anomalies:
- anomaly_details: >-
    Survey data: skipped questions and incomplete responses are expected.
- anomaly_details: >-
    Wearable device data: improper use and technical failure such as battery failure or
    system malfunction are expected. The Garmin Vivosmart 5 battery had to be charged
    every two to three days, so there are gaps in the activity monitoring record.
- anomaly_details: >-
    Imaging data: participant uncooperation, noise that may obscure the images, system
    malfunction and data transfer failures are expected. Optomed Aurora images are
    acquired undilated with a handheld camera, so quality varies between participants and
    within a participant. Heidelberg Spectralis acquisition is operator-dependent and
    quality issues could lead to a modality being skipped and data missing. FLIO is very
    sensitive and cannot tolerate more than one centimeter of movement during acquisition;
    because it is performed last and is uncomfortable, participants may not be at their
    best compliance.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so the cohort is subject to volunteer bias, which may
    limit the generalizability of results to people not represented in the study
    population. The protocol publication states this as a limitation and describes no
    measure taken against it.
- bias_type: representation_bias
  bias_description: >-
    Recruitment was predominantly urban and hospital-based, which may not capture all
    cultural and socioeconomic backgrounds, and the cohort does not include other
    races/ethnicities such as Pacific Islanders and Native Americans. Eligibility required
    the ability to read and speak English.
  mitigation_strategy: >-
    Three recording sites were selected for geographic variability across the United
    States and to broaden representation across racial and ethnic groups, and individuals
    from all demographic backgrounds were recruited at all three sites.
- bias_type: sampling_bias
  bias_description: >-
    While the cross-sectional design ultimately aims for balance across race/ethnicity,
    biological sex and diabetes presence and severity, the pilot release was not balanced
    across these parameters, and because enrollment is ongoing, periodic interim releases
    may not have achieved balanced distribution across groups.
  affected_subsets:
  - >-
    Version 3.0.0 as a whole; the recommended validation and test partitions are balanced
    at 88 participants per race/ethnicity group and 176 per sex, while the training
    partition is not.
  mitigation_strategy: >-
    Uniform data collection protocols were implemented for all subjects irrespective of
    race/ethnicity, biological sex or diabetes severity across all study sites, and the
    site selection was intended to minimize the potential for sampling bias.
- bias_type: measurement_bias
  bias_description: >-
    Several measurements are made on more than one device model across the three sites -
    blood pressure monitors and lensometers differ by site, and retinal imaging is
    acquired on multiple manufacturers' instruments - so device make and model may be
    confounded with site.
  mitigation_strategy: >-
    Information on device make and model, including the specific scan modality used, was
    documented to ensure repeatability; multiple devices were included deliberately for
    one measure to enhance generalizability and represent the range of equipment used in
    clinical settings.

known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: >-
    The study cohort may not provide a comprehensive representation of the population:
    recruitment was predominantly urban and hospital-based, and the cohort does not
    include Pacific Islanders or Native Americans.
  scope_impact: >-
    Limits generalization of models derived from the dataset to rural populations and to
    racial and ethnic groups outside the four recruited.
- limitation_type: coverage_limitation
  limitation_description: >-
    Eligibility required participants to be able to read and speak English. Non-English
    speaking participants were not initially enrolled, because translating the consent
    form alone would not have been sufficient - all study materials and device
    instructions would have had to be translated.
  recommended_mitigation: >-
    The project noted that requiring English may have created challenges in recruiting
    Hispanic and Asian participants and that it would translate materials into Spanish if
    recruitment goals were not met.
- limitation_type: temporal_limitation
  limitation_description: >-
    The design is cross-sectional with one study visit per participant, and the ten-day
    at-home monitoring window is the only longitudinal element in this release. Version
    3.0.0 covers only the collection window 19 July 2023 to 1 May 2025, part-way through
    an enrollment program targeting 4,000 participants.
- limitation_type: scope_limitation
  limitation_description: >-
    The public release omits sex, race, ethnicity and medication information, along with
    5-digit ZIP code, genetic sequencing data, past health records and traffic and
    accident reports, which are held under controlled access. Banked biospecimens
    (plasma, serum, buffy coats, PAXgene RNA tubes and peripheral blood mononuclear cells)
    are held at the University of Alabama at Birmingham and are not part of the released
    dataset.
  scope_impact: >-
    Users of the public release cannot stratify analyses by sex or race/ethnicity, and
    cannot audit models for disparities across those groups directly.
- limitation_type: methodological_limitation
  limitation_description: >-
    No labels or targets accompany the dataset and no labeling was performed; the dataset
    is deliberately hypothesis-agnostic. The project team states it has no formal
    guidelines for researchers creating new labels or defining new tasks.
- limitation_type: integration_limitation
  limitation_description: >-
    Snellen visual acuity variables were dropped in version 3.0.0, so only logMAR visual
    acuity measurements are available; analyses that depend on Snellen values cannot be
    carried across from earlier versions.

confidential_elements:
- confidential_elements_present: false
  confidentiality_details: >-
    The dataset does not contain data that might be considered confidential, and no
    personally identifiable information is included. The RO-Crate records a
    confidentiality level of HL7:2N (normal) for the release and each of its subcrates.

sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: >-
    The RO-Crate enumerates the categories of personal or sensitive information
    represented in the release as electronic health record data, wearable monitoring, ECG,
    environmental sensor data, continuous glucose monitor data and wearable accelerometer
    data.
  source_caveats: >-
    Two equally ranked tier-1 sources disagree. The RO-Crate enumerates the personal and
    sensitive information categories recorded above, while the FAIRhub healthsheet answers
    that the public dataset will not contain data that is considered sensitive and locates
    racial and ethnic origin, 5-digit ZIP code, genetic sequencing data, past health
    records, medications and motor vehicle traffic and accident reports in the
    controlled-access release rather than this one. Because the ranking cannot decide
    between them, both positions are recorded.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    The FAIRhub de-identification record classifies the release as NoDeIdentification with
    direct identifiers and HIPAA identifiers addressed: no identifiers were collected into
    the released data, so no active de-identification was necessary, but the release was
    checked to confirm that no data identifiable under US HIPAA were present. The Nature
    Metabolism comment describes the public set as stripped of Protected Health
    Information as defined by the HIPAA Privacy Rule via the Safe Harbor method.
  identifiers_removed: >-
    Beyond HIPAA identifiers, information related to the sex and race/ethnicity of
    participants and to medications used has been removed from the public release; 5-digit
    ZIP code, sex, race, ethnicity, genetic sequencing data, past health records,
    medications and traffic and accident reports are held under controlled access.
  deidentification_details: >-
    Date shifting, non-arrangement and k-anonymity were not applied. A theoretical risk of
    future re-identification is acknowledged; to deter re-identification attempts the
    project implements a data dissemination system, a strict license agreement and data
    watermarking for both the public and the controlled sets.
  source_caveats: >-
    Three sources characterize this differently: the FAIRhub structured metadata records
    the de-identification type as NoDeIdentification with the explanation that no
    identifiers were collected; the RO-Crate records deidentified as true; and the Nature
    Metabolism comment describes HIPAA Safe Harbor stripping of the public set. Separately,
    the University of Washington IRB protocol shows that the study itself collected direct
    identifiers (name, medical record number, date of birth, address, phone number, email
    and driver's license number) and linked them to study data by code - none of which are
    present in the released dataset.

participant_privacy:
- privacy_techniques: >-
    Data watermarking of both the public and controlled sets, a strict license agreement,
    and a data dissemination system built to deter re-identification. The take-home
    devices were chosen with participant privacy as a primary concern: the environmental
    sensor and the Garmin fitness tracker capture no video or audio, carry no GPS location
    monitoring, and are not synced with participant-owned devices. During the study all
    procedures were conducted in private rooms and identifiable information was held on
    encrypted servers or in locked cabinets with restricted access at every site.
  reidentification_risk: >-
    A theoretical risk of future re-identification is acknowledged. The license forbids
    any attempt to identify or contact a data subject, to extract identifying information,
    or to establish a data subject's membership in a particular group.
  data_linkage: >-
    Within the release, records are linked only by a study participant identifier; there is
    one visit per participant and all instances belong to the same project. In the study
    itself, identifiers and study data were stored separately with a code maintaining the
    link.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    University of Washington Institutional Review Board protocol STUDY00016228. Initial
    approval was received on 20 December 2022, with reliance agreements covering the
    Institutional Review Boards of the University of Alabama at Birmingham and the
    University of California, San Diego. An annual renewal application reporting the status
    and progress of the study is required and is due within 90 days of expiration.
  ethics_review_board: >-
    University of Washington Human Subjects Division; IRB Reliance Team, hsdrely@uw.edu,
    4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, United States.
  regulatory_compliance:
  - >-
    Human subject review status recorded as submitted and approved. The study is not FDA
    regulated for either drug or device, has no Data Monitoring Committee, and is not a
    patient registry. It is registered on ClinicalTrials.gov as NCT06002048.
  special_populations:
  - >-
    No protected population was targeted. Eligibility was restricted to adults with a
    minimum age of 40 years and a maximum age of 85 years; pregnancy, gestational diabetes
    and type 1 diabetes were exclusion criteria.
  source_caveats: >-
    The RO-Crate names the reviewing body "Washington University IRB" while giving a
    University of Washington Human Subjects Division postal address and a uw.edu contact,
    and both publications and the healthsheet attribute the approval to the University of
    Washington IRB. The healthsheet's eligibility list gives only a lower age bound of 40
    years, whereas the FAIRhub study description records a maximum age of 85 years and an
    exclusion for adults older than 85.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Minors were not enrolled: the minimum age for participation was 40 years. Prisoners
    were not a target population and the protocol states the research is not likely to
    have subjects who become prisoners while participating. Pregnancy and gestational
    diabetes were exclusion criteria. Cognitively impaired adults and other adults unable
    to consent were not included, so no surrogate consent process applied. Native American
    or non-US indigenous populations were not actively recruited through a tribe or
    tribal-focused organization.

informed_consent:
- consent_obtained: true
  consent_type: >-
    Written informed consent, obtained either electronically through REDCap e-consent
    before the visit or in person at the start of the visit if the participant did not
    choose electronic consent. The FAIRhub consent record classifies the consent as
    ConsentSpecifiedNotElsewhereCategorised, with no non-commercial, geographic,
    research-type, genetic-only or methods restrictions flagged.
  consent_documentation: >-
    The approved consent form for the principal project site, the University of
    Washington, is published with the dataset documentation at
    https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
    The other clinical sites operated under IRB reliance and used the same consent form
    with minor institution-specific language incorporated to meet individual institutional
    requirements. Signed electronic consents were emailed automatically to the participant,
    and an additional copy could be requested from the study coordinator at any time.
  consent_scope: >-
    Consent covered participation in the study protocol including questionnaires,
    collection and banking of blood and urine derivatives for future research, and
    placement of the resulting data in an open-source repository. Informed consent was
    required before participation in any part of the protocol.

collection_consents:
- consent_details: >-
    Potential participants were mailed a hardcopy invitation letter and sent an invitation
    email, each personalized with links, access codes and QR codes directing them into the
    study's online REDCap interface. There they could read an overview of the research
    program, expectations for participation and answers to frequently asked questions;
    download the informed consent document; request a call back from study staff; complete
    a screening survey for qualification; and enroll by signing the electronic consent.
    Participants could reach the e-consent documentation and decide at that point not to
    participate or to seek additional information. No study-specific questionnaires other
    than the screening questionnaire were available until consent had been given. Those
    without internet access could call research staff for alternative methods of enrollment.

collection_notifications:
- notification_details: >-
    Every individual was aware of the data collection: this was active data collection
    directly from participants, not passive collection or secondary use of existing data.
    Notification took the form of the personalized invitation letter and email that
    followed the electronic health record screening, and the consent materials made
    available through the REDCap interface before any study-specific data were collected.

consent_revocations:
- revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease study
    participation. Any data that had been shared or used up to that point would remain in
    the dataset; this is clearly communicated in the consent document. Participants were
    also reminded throughout the study that they had the right to change their mind about
    participation.

data_protection_impacts:
- impact_details: >-
    No data protection impact analysis has been conducted for this dataset; the project's
    own datasheet records this as an explicit negative answer rather than an omission.

ethical_reviews:
- reviewing_organization: University of Washington Institutional Review Board
  review_details: >-
    Protocol STUDY00016228, initially approved 20 December 2022, with the initial approval
    letter published alongside the dataset documentation. Reliance agreements cover the
    Institutional Review Boards of the University of Alabama at Birmingham and the
    University of California, San Diego. Contact for reliance matters is the IRB Reliance
    Team at hsdrely@uw.edu.
  source_caveats: >-
    The RO-Crate labels this body "Washington University IRB" while giving a University of
    Washington Human Subjects Division address and contact.
- review_details: >-
    The dataset RO-Crate names Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas
    Evans as responsible for ethical review of the release. The project states that
    ethical, legal and social implications are considered at every stage of the project
    cycle and that its standards work includes guidance from bioethicists.

participant_compensation:
- compensation_provided: true
  compensation_amount: "$200"
  compensation_type: >-
    Stipend for completing the study visit, paid from the NIH award OT2OD032644 that funds
    the project. The study additionally covered reasonable parking, public transit and
    rideshare costs related to the study visit, and offered rideshare transportation
    assistance to participants who reported barriers to traveling to the site.
  notes: >-
    Under the IRB protocol, payment was issued once the final data had been received and
    the study devices returned - typically at least two weeks after the visit - and was not
    prorated. Participants may incur transport costs that will not be reimbursed if
    transportation fees exceed $25.

data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  committee_contact:
    id: ORCID:0000-0002-7452-1648
    name: Aaron Lee
    orcid: 0000-0002-7452-1648
    email: contact@aireadi.org
  access_review_process: >-
    Access to the release requires logging in through a verified ID system, agreeing to use
    the data only for type 2 diabetes related research, and accepting the license terms,
    which set restrictions and obligations on data usage. The access route is published at
    https://fairhub.io/datasets/3/access. Access is granted by self-attestation rather than
    committee review: the FAIRhub access type for this release is
    PublicDownloadSelfAttestationRequired.
  stewardship_roles:
  - >-
    The data manager at each of the three collection sites is responsible for quality
    control of all data before upload to FAIRhub; the central project team performs
    standardization and dissemination processing; the AI-READI team supports and maintains
    the released dataset.
  notes: >-
    The BMJ Open protocol publication states that the requirements for the controlled
    access data sets were, at the time of writing, being developed by a Data Access
    Committee; no committee membership or contact for that body is given in the declared
    sources.
  source_caveats: >-
    Washington University in St. Louis is recorded as accountable organization on the
    strength of the FAIRhub managing-organization and lead-sponsor fields and the license,
    which names it as Licensor; the RO-Crate instead names the AI-READI Consortium as the
    data governance committee and places the principal investigator at the University of
    Washington.

license_and_use_terms:
  license_terms: >-
    The AI-READI Data License Agreement, Version 2.0, issued by Washington University in
    St. Louis as Licensor. It grants a non-exclusive, non-transferable license to download,
    reproduce and use the data and to create derivative works, for research, commercial and
    non-commercial purposes. A licensee may be an individual or an authorized group within
    an institution, in which case authorized users are legal members of that group and their
    rights terminate when their relationship with the group or institution ends. Derivative
    data - modified, excerpted, encrypted, condensed, encoded, translated or otherwise
    altered data, including synthetic data generated from it - is treated as data subject to
    all the same restrictions. Models, algorithms and programs trained or adapted using the
    data may be distributed provided they do not themselves contain the data and the
    licensee has taken all reasonable efforts to minimize the likelihood that data can be
    memorized, derived, reconstructed or reconstituted through them. Licensees must
    acknowledge the Licensor, the source and any funder in papers reporting use of the data.
    The agreement terminates automatically on any breach, at which point all copies must be
    deleted. The data are provided "as is" with no warranty; the Licensor's aggregate
    liability is capped at one US dollar except where applicable law prohibits such
    limitation.
  data_use_permission: disease_specific_research
  source_caveats: >-
    The FAIRhub dataset page labels the license "Health Data License" while the FAIRhub
    structured metadata names it "AI-READI custom license v2.0" and the license document
    itself is titled "AI-READI DATA LICENSE AGREEMENT (Version 2.0)"; the document's own
    title is used here. The controlled-vocabulary value disease_specific_research reflects
    the access condition that the public version can only be used for type 2 diabetes
    related research; the license grant itself covers research, commercial and
    non-commercial purposes, and the University of Washington IRB protocol describes the
    dataset as being made publicly available with a commercial-friendly open-source license.

ip_restrictions:
  restrictions:
  - >-
    Title to the data and all industrial and intellectual property rights in it remain
    solely and exclusively with the Licensor and its suppliers; the licensee must not take
    any action inconsistent with that ownership, and any rights not expressly granted in the
    license are reserved. The FAIRhub healthsheet records no additional IP-based restrictions
    imposed by third parties beyond those in the license. The RO-Crate carries the copyright
    notice "Copyright © 2026 AI-READI".

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    Licensees must comply with all data security and privacy standards established from
    time to time by the US National Institutes of Health under its Genomic Data Sharing
    (GDS) Policy, currently the NIH Security Best Practices for Controlled-Access Data
    Subject to the NIH GDS Policy. Licensees must also comply with all applicable laws,
    regulations and restrictions relating to the distribution and use of the data and of
    models built from it. The FAIRhub healthsheet answers the question of export controls
    or other regulatory restrictions by referring to the license.
  other_compliance: >-
    Storage of the data is limited to servers and devices maintained by and located within
    the licensee's institution, or to cloud or remote storage and backup services covered by
    a HIPAA-approved Business Associate Agreement with that institution. The data may be
    statically watermarked to identify the licensee for security purposes.
  notes: >-
    The only confidentiality level the sources state is the RO-Crate's "HL7:2N (normal)",
    repeated on the release and on each of its subcrates. The enum offers no HL7 mapping,
    so the value `restricted` is this record's substitution, chosen because access is gated
    behind identity verification, a use attestation and license acceptance; it does not
    reproduce, and on its face contradicts, the "normal" term the source uses.

distribution_formats:
- format: application/dicom
  notes: >-
    Retinal photography, structural OCT, OCTA and FLIO image files.
- format: text/csv
  media_type: text/csv
  notes: >-
    Clinical data tables mapped one-to-one to OMOP Common Data Model tables.
- format: application/json
  media_type: application/json
  notes: >-
    Open mHealth records for wearable activity monitoring and continuous glucose monitoring,
    and the Clinical Dataset Structure metadata files (dataset_description.json,
    dataset_structure_description.json, participants.json, study_description.json,
    dqd_omop.json).
- format: text/markdown
  media_type: text/markdown
  notes: >-
    README.md, CHANGELOG.md and healthsheet.md documentation files at the dataset root.
- format: text/tab-separated-values
  media_type: text/tab-separated-values
  notes: >-
    participants.tsv at the dataset root and the per-data-type manifest.tsv files.
  source_caveats: >-
    TSV is not listed among the four media types in the FAIRhub format field; it is recorded
    here from the file names given in the dataset structure description and README.

distribution_dates:
- release_dates:
  - "2025-11-17"
  notes: >-
    Date version 3.0.0 was made available on FAIRhub; the healthsheet records the
    distribution of the third version as November 2025.

third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed and available for public use through the FAIRhub platform.
    Onward sharing by a licensee is restricted: data or derivative works may be conveyed only
    to another licensee bound by an agreement on terms identical to the AI-READI license, and
    then only for the purpose of collaborating on projects involving the data.

updates:
  frequency: approximately annually
  update_details: >-
    The dataset is released as static versions and is not updated in place; instead new
    versions are released with additional data from participants enrolled since the previous
    release, as more study participants complete the study visit. Changes between versions
    are recorded in detail in the CHANGELOG file included in the dataset and mirrored at
    docs.aireadi.org. Further versions are expected because enrollment is ongoing.

version_access:
  versions_available:
  - >-
    1.0.0 (DOI 10.60775/fairhub.1, 3 May 2024), 2.0.0 (DOI 10.60775/fairhub.2, 8 November
    2024) and 3.0.0 (DOI 10.60775/fairhub.3, 17 November 2025).
  latest_version_doi: doi:10.60775/fairhub.3
  version_details: >-
    Each version carries its own DOI and its own documentation set at docs.aireadi.org,
    selectable from a version dropdown. Version 2.0.0 is marked on FAIRhub and in its
    documentation as no longer accessible.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances;
    participants were not told that their data would be retained only for a fixed period and
    then deleted.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for anyone outside the project to extend or augment the
    AI-READI dataset; contributions are limited to those involved in the project. The
    project's own datasheet records this as an explicit negative answer rather than an
    omission.

related_datasets:
- relationship_type: is_new_version_of
  target_dataset: "10.60775/fairhub.2"
  notes: >-
    Version 2.0.0, released 8 November 2024, containing data from 1,067 participants
    (204 from the pilot phase plus 863 from the first full year of the study). FAIRhub and
    its documentation record this version as no longer accessible.
- relationship_type: is_new_version_of
  target_dataset: "10.60775/fairhub.1"
  notes: >-
    Version 1.0.0, released 3 May 2024, containing data from 204 participants collected
    during the pilot data collection phase and processed by custom, ad hoc methods.
- relationship_type: is_source_of
  target_dataset: AI-READI mini-subset (FAIRhub child dataset 4)
  notes: >-
    A smaller version of the release made available for pipeline development; the FAIRhub
    API records it as the child of dataset 3, and the version 3.0.0 documentation covers the
    mini-subset version alongside Azure Storage access. No DOI or other identifier is given
    for it in the declared sources, so the target is named in prose.
- relationship_type: is_supplemented_by
  target_dataset: AI-READI controlled-access dataset
  notes: >-
    A companion controlled-access release holding the data withheld from the public set -
    5-digit ZIP code, sex, race, ethnicity, genetic sequencing data, past health records,
    medications and traffic and accident reports. The documentation states that the full
    dataset will be accessible by entering into a data use agreement; the protocol
    publication describes it as available only to scientists whose institutions have
    completed legal and privacy use agreements with the AI-READI research program, with
    the access requirements being developed by the Data Access Committee. No DOI or other
    identifier is given for it in the declared sources, so the target is named in prose.

external_resources:
- external_resources: >-
    AI-READI dataset documentation, https://docs.aireadi.org (see "Dataset v3.0.0" for this
    version). The dataset is otherwise self-contained but relies on this documentation for
    users needing further information about its provenance, data domains, variables, file
    formats, standards and example outputs.
  restrictions:
  - >-
    None; the documentation is shared under the CC-BY 4.0 license.
- external_resources: >-
    AI-READI project website, https://aireadi.org, including the team roster at
    https://aireadi.org/team and the contact page at https://aireadi.org/contact.
- external_resources: >-
    GitHub organization of the AI-READI project, https://github.com/AI-READI.
- external_resources: >-
    Zenodo community of the AI-READI project, https://zenodo.org/communities/aireadi.
- external_resources: >-
    AI-READI Consortium (2024). "AI-READI: rethinking AI data collection, preparation and
    sharing in diabetes research and beyond." Nature Metabolism 6:2210-2212,
    https://doi.org/10.1038/s42255-024-01165-x. Listed by the RO-Crate as an associated
    publication.
- external_resources: >-
    Owsley C, Matthies DS, McGwin G, et al. "Cross-sectional design and protocol for
    Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI)." BMJ
    Open 2025;15:e097449, https://doi.org/10.1136/bmjopen-2024-097449. The study design and
    protocol publication, published open access under CC BY-NC 4.0.
- external_resources: >-
    Clinical Dataset Structure (CDS) specification v0.1.1,
    https://cds-specification.readthedocs.io/en/v0.1.1/, the standard the dataset's
    directory organization and root metadata files follow.

maintainers:
- name: AI-READI Consortium
  role: academic_institution
  maintainer_details: >-
    The AI-READI team supports and maintains the dataset. It is hosted on the FAIRhub
    platform, which runs on Microsoft Azure and was developed for this project as a
    cloud-based data management, curation and sharing platform. Contact details for the
    owner, curator and manager are given in the README file included with the dataset and at
    https://aireadi.org/contact; the study central contact address is contact@aireadi.org.
    The study_description.json and dataset_description.json metadata files included in the
    dataset carry further information about the contact person or entity, authors and
    contributors.