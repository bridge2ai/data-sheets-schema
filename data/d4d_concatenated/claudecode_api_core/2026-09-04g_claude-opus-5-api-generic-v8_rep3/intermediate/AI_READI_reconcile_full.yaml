conforms_to: >-
  The dataset as a whole is organized following the Clinical Dataset Structure (CDS)
  v0.1.1 and is additionally packaged as an RO-Crate conforming to the RO-Crate 1.2
  draft profile. Within it, retinal photography, OCT, OCTA and FLIO files follow the
  Digital Imaging and Communications in Medicine (DICOM) standard; clinical data files
  follow the Observational Medical Outcomes Partnership (OMOP) Common Data Model;
  electrocardiogram files follow the WaveForm DataBase (WFDB) standard; wearable
  activity and continuous glucose monitoring files follow Open mHealth; and
  environmental sensor files follow the NASA ASCII File Format Guidelines for Earth
  Science Data.
