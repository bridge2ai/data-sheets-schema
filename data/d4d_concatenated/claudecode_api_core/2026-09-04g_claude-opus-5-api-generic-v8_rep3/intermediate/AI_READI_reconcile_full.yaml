purposes:
- response: >-
    To create and publicly share a flagship, ethically sourced, AI-ready multimodal
    dataset on type 2 diabetes mellitus so that future artificial
    intelligence/machine-learning research can produce insights into the disease,
    including salutogenic pathways back to health.
- response: >-
    To serve as a blueprint for future data-generation projects by establishing
    standards, best practices and guidelines for the collection, preparation and sharing
    of AI-ready clinical research datasets, including new standards such as the Clinical
    Dataset Structure.
- response: >-
    To assemble a cohort balanced across self-reported race/ethnicity, biological sex
    and diabetes disease stage, so that models trained on the data are not skewed by the
    demographic imbalances of earlier type 2 diabetes cohorts. The study's anticipated
    enrollment is 4,000 participants across the three sites.

addressing_gaps:
- response: >-
    The absence of well-designed, high-quality, large and inclusive multimodal datasets
    that are AI-ready for training models on complex, multi-organ diseases such as type
    2 diabetes mellitus; the project identifies this lack of AI-ready data as the key
    barrier to AI-based understanding of the disease.
- response: >-
    Under-representation of racialized groups in type 2 diabetes research: a
    meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020
    found that samples lacked racial and ethnic diversity, and the deleterious
    consequences of the disease are exacerbated in the populations that bear the higher
    burden.
- response: >-
    The limited utility of existing data sources such as insurance claims and electronic
    health records for downstream AI/ML analyses, which the project addresses by
    designing a purpose-built acquisition protocol spanning survey, physical, clinical,
    imaging and wearable-device domains.

tasks:
- response: >-
    Downstream pseudotime manifold analysis: an approach used to predict disease
    trajectories by learning from complex, multimodal data collected from participants
    spanning the range of disease severity, from normal to insulin-dependent type 2
    diabetes mellitus.
- response: >-
    Reconstruction of a temporal atlas of type 2 diabetes development and reversal
    towards health (salutogenesis), from a foundational dataset that is agnostic to
    existing classification criteria.

intended_uses:
- use_category: artificial intelligence and machine learning research
  examples:
  - >-
    Multimodal model development for type 2 diabetes mellitus; prediction of disease
    trajectories; study of salutogenesis.
  usage_notes: >-
    Data are stored and shared as "AI-ready" so that AI/ML research can begin without
    further reformatting or preprocessing.
- use_category: type 2 diabetes related research
  usage_notes: >-
    Access to the public release is conditioned on agreeing to use the data only for
    type 2 diabetes related research; the project documentation states that a private
    version will allow for more generic use.

prohibited_uses:
- notes: >-
    Making clinical treatment decisions based on the data.
  prohibition_reason: >-
    The data are intended solely as a research resource.
- notes: >-
    Using or attempting to use the data, alone or with other information, to compromise
    the confidentiality or privacy of a data subject, to identify or contact any data
    subject or group of data subjects, to extract or extrapolate identifying information,
    to establish a data subject's membership in a particular group, or otherwise to cause
    harm or injury to a data subject.
  prohibition_reason: >-
    Protection of study participants against re-identification and harm.
- notes: >-
    Sharing or distributing the data with any third-party model vendor or developer for
    training or development purposes, including model weight modification and other
    adjustments to a model's logic or operation, even where that vendor holds a
    HIPAA-approved Business Associate Agreement with the licensee's institution.
    Short-term interaction such as prompting or querying a third-party model covered by
    such an agreement is permitted for analysis.
  prohibition_reason: >-
    Prevention of memorization or reconstruction of the data by externally controlled
    models.
- notes: >-
    Transferring, licensing, sublicensing, selling, assigning, displaying or otherwise
    conveying any portion of the data or any derivative work to any third party other
    than another licensee bound by an identical agreement with the licensor.
  prohibition_reason: >-
    Secondary sharing controls in the license, to keep all recipients bound by the same
    obligations.
- notes: >-
    Reproducing data in papers, articles, presentations, analyses, reports or
    publications beyond small representative samples in up to five images or figures per
    paper; larger amounts may not be published, posted or made available through
    supplemental files, zip archives, code packages or other means, notwithstanding
    journal or conference requirements.
  prohibition_reason: >-
    Publication controls in the license; publishers and conference organizers may seek a
    separate license from the licensor.
- notes: >-
    Storing the data anywhere other than servers and devices maintained by and located
    within the licensee's institution or employer, or on cloud or remote storage and
    backup services covered by a HIPAA-approved Business Associate Agreement with that
    institution or employer.
  prohibition_reason: >-
    Data security requirements in the license.
- notes: >-
    Removing, obscuring, altering or masking the static watermarking that may be applied
    to the data to identify the licensee.
  prohibition_reason: >-
    Watermarking is a security control identifying the licensee.

future_use_impacts:
- impact_details: >-
    The dataset creators do not currently anticipate uses of the dataset that could
    result in unfair treatment of individuals or groups or other undesirable harms;
    however, they acknowledge a theoretical risk of future re-identification.
- impact_details: >-
    Because sex, race and ethnicity are withheld from the public release, users of that
    release cannot directly stratify or audit model performance across those groups. The
    project mitigates this by supplying a recommended training/validation/testing split
    whose validation and test sets are balanced as well as possible for sex,
    race/ethnicity and diabetes status, with the stated aim of reducing disparities in
    models developed from the dataset.

instances:
- instance_type: individual study participant
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: >-
    No labels or targets are provided. No specific labeling was performed, because the
    dataset is hypothesis-agnostic and aimed at facilitating multiple potential
    downstream AI/ML applications.
  missing_information:
  - missing: >-
      Not all modalities are available for all participants.
    why_missing:
    - >-
      Some participants elected not to take part in some study elements; in a few cases
      the data collection device had no stored results or was returned too late for the
      results to be retrieved (battery died, data lost); and in a few cases a data
      collision at some point in the process led to lost data.
  notes: >-
    Each instance consists of all of the data available for one individual participating
    in the study, spanning tabular, imaging and physiological signal/waveform data. No
    unstructured free-text data are included.

relationships:
- relationship_details: >-
    All instances belong to the same prospective data generation project (AI-READI).
    There is currently one study visit per participant, so instances are not linked
    across visits. Files belonging to one participant are grouped by a participant folder
    named after the participant's study ID number within each device directory.

subpopulations:
- identification: >-
    Self-reported race and ethnicity, recorded at screening in four groups (Hispanic,
    Asian, Black, White). Individual race and ethnicity values are withheld from the
    public release and held under controlled access; only the aggregate breakdown is
    published in the dataset README.
  distribution: >-
    Across the 2,280 participants: 380 Hispanic, 545 Asian, 519 Black, 836 White.
  subpopulation_elements_present: false
- identification: >-
    Biological sex, self-reported at screening. Individual values are withheld from the
    public release and held under controlled access; only the aggregate breakdown is
    published in the dataset README.
  distribution: >-
    Across the 2,280 participants: 951 male, 1,329 female.
  subpopulation_elements_present: false
- identification: >-
    Diabetes status group, one of the four study arms: no Type 1 or Type 2 diabetes;
    pre-Type 2 diabetes or Type 2 diabetes controlled by lifestyle adjustment; Type 2
    diabetes controlled by oral or non-insulin injectable medication; Type 2 diabetes
    controlled by insulin.
  distribution: >-
    Across the 2,280 participants: 776 with no diabetes, 560 pre-diabetes or
    lifestyle-controlled, 686 controlled by oral or non-insulin injectable medication,
    258 insulin-controlled.
- identification: >-
    Age at study visit; eligibility was restricted to adults aged 40 years and older,
    with the study description recording a maximum age of 85 years.
  distribution: >-
    Mean age across the 2,280 participants is 60.8 years (standard deviation 11.3).
  notes: >-
    The FAIRhub healthsheet answers "No" to the question of whether the dataset itself
    identifies demographic sub-populations; the distributions recorded here are the
    aggregate summary tables published in the dataset README, not per-instance labels in
    the public release.

