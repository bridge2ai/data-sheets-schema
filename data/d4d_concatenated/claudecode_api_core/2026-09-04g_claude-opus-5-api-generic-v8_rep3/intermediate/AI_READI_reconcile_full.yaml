id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI project: a
  multimodal, AI-ready dataset assembled from 2,280 adults with and without type 2
  diabetes mellitus (T2DM) and harmonized across three United States data collection
  sites (the University of Alabama at Birmingham, the University of California San
  Diego, and the University of Washington). Data were collected between 19 July 2023
  and 1 May 2025 through a single in-person study visit of roughly three to four hours
  followed by a ten-day at-home monitoring period in which participants wore a
  continuous glucose monitor and a fitness tracker and placed an environmental sensor
  in their home. The release covers survey and social-determinants-of-health responses,
  blood and urine laboratory results, physical and vision assessments, monofilament and
  cognitive testing, 12-lead electrocardiography, retinal photography, optical
  coherence tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging
  ophthalmoscopy (FLIO), continuous glucose monitoring, wearable activity monitoring,
  and indoor environmental sensing. It comprises 356,343 files totaling approximately
  3.82 TB, organized following the Clinical Dataset Structure (CDS) v0.1.1 as one
  directory per data type, then modality, then device, then participant. The dataset is
  hypothesis-agnostic and carries no labels or targets; a recommended
  train/validation/test assignment is supplied in participants.tsv. This record
  describes the publicly downloadable FAIRhub release identified by DOI
  10.60775/fairhub.3; banked biospecimens held at the University of Alabama at
  Birmingham and the companion controlled-access release are not part of it.
