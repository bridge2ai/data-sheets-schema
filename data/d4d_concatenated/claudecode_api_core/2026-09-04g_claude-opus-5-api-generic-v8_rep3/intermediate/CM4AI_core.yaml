id: doi:10.18130/V3/HIGT4C
name: CM4AI June 2026 Data Release (Beta)
description: The June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI),
  the Functional Genomics Grand Challenge in the NIH Bridge2AI program. CM4AI generates multi-modal
  data including protein-protein interaction (PPI), spatial localization, and genetic perturbation
  data in MDA-MB-468 breast cancer cells (with and without paclitaxel or vorinostat treatment)
  and induced pluripotent stem cells (with and without differentiation). This Beta release
  includes perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment
  and undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer
  cells with and without treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron
  progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer
  cells with treatment; and immunofluorescence images in MDA-MB-468 breast cancer cells with
  and without treatment. The overarching objective of CM4AI is to deliver machine-readable
  hierarchical maps of cell architecture as AI-ready data, produced from multimodal interrogation
  of chromatin modifiers, metabolic enzymes, and other proteins involved in cancer, neuropsychiatric,
  and cardiac disorders in disease-relevant cell lines under treated and untreated conditions.
notes: 'CM4AI consists of three pillars - Data, People, and Ethics - organized into six modules:
  Data Acquisition, Tools, and Standards (Data); Skills and Workforce Development, and Teaming
  (People); and Ethics. The Standards Module packages data, software, metadata and provenance
  graphs using the FAIRSCAPE framework, which creates RO-Crate packages and assigns persistent,
  resolvable, globally unique identifiers using the ARK scheme, with provenance entailments
  expressed in the EVI Evidence Graph Ontology. CM4AI defines AI-Ready biomedical data as
  fully characterized FAIR data of known provenance that can be ethically and reliably processed
  by AI applications, whose models and software are available and well-described for validation
  and re-use, and whose predictions may be fully explained and interpreted to the user as
  needed; the project''s stated criteria are FAIR, Provenanced, Characterized, Explainable,
  and Ethical.'
source_caveats: Values are taken from the June 2026 Dataverse release (doi:10.18130/V3/HIGT4C),
  which the declared source ranking places at tier 1 and marks as superseding the October
  2025 release. Where earlier Dataverse releases (March 2025, June 2025, October 2025) state
  different contents, those are facts about those earlier versions and are recorded under
  related_datasets rather than in this record's own slots. The CM4AI project web pages (tier
  2) report cumulative project-level counts (1,374 protein interactions; 53,788 immunofluorescent
  images; 7,023 total proteins investigated; 11,739 genes targeted; 21.4 TB data volume) that
  are attributed to the CM4AI project as a whole rather than to this single release, and are
  therefore not asserted as release-level totals here. The bundle contains a Nature publication
  (tier 3) describing a U2OS cell map produced by the same investigators and pipeline; that
  is a distinct dataset and is recorded under related_datasets. The June 2026 release page
  carries a Dataset Description block dated (2025-06-30) although the release itself was published
  2026-06-17; the release page also gives a Data Creation Date of 2025-02-27, which is reused
  verbatim from earlier releases in this Dataverse collection.
