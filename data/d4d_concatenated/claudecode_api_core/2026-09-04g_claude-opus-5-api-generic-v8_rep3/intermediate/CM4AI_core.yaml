sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  why_not_representative: Data in this release was derived from commercially available de-identified
    human cell lines and does not represent all biological variants which may be seen in the
    population at large.
  strategies: Targeted selection of cell lines and perturbation targets. CM4AI's objective
    is multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved
    in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines under
    perturbed and unperturbed conditions.
  source_data: MDA-MB-468 triple negative breast cancer cells (with and without paclitaxel
    or vorinostat) and KOLF2.1J induced pluripotent stem cells (with and without differentiation
    into neural progenitor cells, neurons, and cardiomyocytes).
preprocessing_strategies:
- preprocessing_details: Downloaded PPI networks are processed using the node2vec deep learning
    model to reduce dimensionality, producing a PPI embedding that contains information about
    the protein's interactions.
- preprocessing_details: IF images are processed using a Human Protein Atlas deep learning
    model to reduce dimensionality, producing an image embedding that contains information
    about protein localization.
- preprocessing_details: The PPI and image embeddings are integrated to obtain a co-embedding
    for each protein using contrastive deep learning. This integration model learns co-embeddings
    such that the original embeddings can be reconstructed with minimal information loss and
    proteins with similar PPI and image embeddings have similar co-embeddings.
- preprocessing_details: Community detection is performed based on the all-by-all similarities
    of pairs of proteins in the co-embedding space; the resulting hierarchy of protein communities
    is output as the final cell map.
labeling_strategies:
- labeling_details: Cell maps are annotated in a two-pronged approach. First, cell maps are
    aligned to known protein function and pathway resources, including the Gene Ontology (GO)
    and Reactome, to determine protein assemblies in the cell map with high overlap with known
    cell biology. Second, assemblies in the cell maps are annotated using a large language
    model approach developed by the project to name sets of proteins and assign a name confidence
    score.
machine_annotation_tools:
- tools:
  - node2vec
  - DenseNet / Human Protein Atlas image classification model
  - Large language model assembly-naming pipeline
  tool_descriptions: node2vec is used to represent each protein as a feature vector based
    on its protein-protein interaction neighborhood. A Human Protein Atlas deep learning model
    is used to reduce the dimensionality of immunofluorescence images into an image embedding.
    A large language model approach developed by the project names sets of proteins and assigns
    a name confidence score.
