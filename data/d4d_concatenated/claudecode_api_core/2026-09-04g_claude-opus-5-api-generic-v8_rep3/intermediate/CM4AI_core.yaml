purposes:
- response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data, produced from multimodal interrogation of chromatin modifiers, metabolic enzymes,
    and other proteins involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
    cell lines under treated and untreated conditions.
- response: To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
    data collected for human cell lines, in order to enable transformative biomedical AI research.
- response: To broadly stimulate research and development in "visible" machine learning systems
    informed by multi-scale cell and tissue architecture, which are not black boxes but are
    built directly on knowledge maps of cell and tissue architecture.
tasks:
- response: 'Construction of hierarchical cell maps: directed acyclic graphs in which each
    node represents an assembly of proteins in proximity at a given scale, spanning from large
    assemblies representing cell compartments to small assemblies of proteins in close proximity.'
- response: Self-supervised multimodal embedding of protein-protein interaction and immunofluorescence
    image features into a shared low-dimensional space.
- response: Multi-resolution community detection over protein-protein similarities to generate
    a hierarchy of protein assemblies.
- response: Development of visible machine learning models (visible neural networks) that
    interrogate how protein assemblies in the cell affect cell-level phenotype predictions.
- response: Interpretation of genetic variants and mutations in human genomics using cell
    maps as a structural prior.
addressing_gaps:
- response: In genomics and precision medicine, machine learning models are often "black boxes,"
    predicting phenotypes from genotypes without understanding the mechanisms by which such
    translation occurs. This project addresses that deficiency by creating a library of large-scale
    maps of cellular structure and function across demographic and disease contexts.
- response: Much of cell structure remains uncharted, and cell mapping technologies have typically
    been applied separately; integration of multiple complementary data modalities provides
    the opportunity to incorporate biological structure robustly across physical scales.
