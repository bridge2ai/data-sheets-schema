known_biases:
- bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines and does not represent all biological variants which may be seen in the
    population at large.
known_limitations:
- limitation_type: scope_limitation
  limitation_description: This is an interim release and does not contain predicted cell maps,
    which will be added in future releases. Computed cell maps are not included in this release.
  scope_impact: The current release is most suitable for bioinformatics analysis of the individual
    datasets rather than for use of the integrated cell maps.
- limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: methodological_limitation
  limitation_description: Analysis of the release requires domain expertise for meaningful
    interpretation.
- limitation_type: coverage_limitation
  limitation_description: Some datasets in the release are under temporary pre-publication
    embargo. The perturb-seq data in KOLF2.1J iPSCs (undifferentiated) and the perturb-seq
    data in MDA-MB-468 breast cancer cells (with and without treatment) are listed as Embargoed
    among the external data links.
subpopulations:
- subpopulation_elements_present: true
  identification: Cell type and treatment condition. The release spans MDA-MB-468 breast cancer
    cells under untreated, paclitaxel-treated, and vorinostat-treated conditions; undifferentiated
    (parental) KOLF2.1J iPSCs; and iPSC-derived neural progenitor cells (NPCs), neurons, and
    cardiomyocytes.
  distribution: 'Coverage differs by modality: perturb-seq covers MDA-MB-468 with and without
    treatment and undifferentiated KOLF2.1J iPSCs; SEC-MS covers MDA-MB-468 with and without
    treatment plus undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and cardiomyocytes;
    AP-MS covers MDA-MB-468 with treatment only; immunofluorescence imaging covers MDA-MB-468
    with and without treatment only.'
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: 'The release records Human Subjects: No, De-identified Samples: Yes,
    and FDA Regulated: No. CM4AI data are described as non-clinical, derived from tissue cultures,
    and unable to be matched with current knowledge to a human subject.'
acquisition_methods:
- acquisition_details: Protein-protein interaction data acquired by affinity purification-mass
    spectrometry (AP-MS) on endogenously tagged cell lines and by size-exclusion chromatography
    coupled to mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping,
    used as two orthogonal mass spectrometry-based approaches.
  was_directly_observed: true
- acquisition_details: Spatial proteomics acquired by immunofluorescence (IF) subcellular
    microscopy, using the Human Protein Atlas resource of antibodies, with automated fixation
    and permeabilization protocols on a pipetting robot for the MDA-MB-468 and KOLF2 cell
    lines.
  was_directly_observed: true
- acquisition_details: Genetic perturbation data acquired by single-cell CRISPR (CRISPRi)
    perturbation screens by cell type, using a CRISPR lentiviral library targeting chromatin
    factors with 6 guide RNAs per gene, in cell lines expressing inducible dCas9, read out
    with the 10x Genomics 3'HT kit.
  was_directly_observed: true
collection_mechanisms:
- mechanism_details: Affinity purification-mass spectrometry (AP-MS) on endogenously tagged
    cell lines.
- mechanism_details: Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for
    proteome-wide complex and interaction mapping.
- mechanism_details: 'Immunofluorescence-based staining (ICC-IF) and confocal microscopy,
    with four color channels: DAPI for nuclei (blue), calreticulin antibody for endoplasmic
    reticulum (yellow), tubulin antibody for microtubules (red), and antibody against the
    protein of interest (green).'
- mechanism_details: Single-cell CRISPR screens using a CRISPR lentiviral library with 6 guide
    RNAs per gene in cell lines expressing inducible dCas9, sequenced with the 10x Genomics
    3'HT kit.
