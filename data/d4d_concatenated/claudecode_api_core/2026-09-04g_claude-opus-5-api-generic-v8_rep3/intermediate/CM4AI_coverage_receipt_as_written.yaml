- id: c010
  status: extracted
  extracted:
  - slot: description
    snippet: "CM4AI is the Functional Genomics Data Generation Project in the U.S.\nNational Institute of Health's (NIH) Bridge2AI program."
  - slot: purposes[2].response
    snippet: "Its overarching mission is to\nproduce ethical, AI-ready datasets of cell architecture, inferred from multimodal data\ncollected for human cell lines, to enable transformative biomedical AI research."
  - slot: purposes[1].response
    snippet: "CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture\nas AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers\nand 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders"
  - slot: sampling_strategies[0].strategies
    snippet: "multimodal interrogation of 100 chromatin modifiers\nand 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders\nin disease-relevant cell lines under perturbed and unperturbed conditions"
  - slot: notes
    snippet: "It consists of three pillars - Data, People, and Ethics - organized into six\nmodules"
  - slot: tasks[0].response
    snippet: "Cell maps are hierarchical directed acyclic graphs (DAG), where each node represents\nan assembly of proteins in proximity at a given scale"
  - slot: tasks[3].response
    snippet: "they have been used in AI tools for \"visible machine\nlearning\" or \"visible neural networks\" (VNNs) to interrogate how protein assemblies in\nthe cell affect cell-level phenotype predictions"
  - slot: tasks[4].response
    snippet: "Cell maps provide a foundation for\ndownstream applications in human genomics, including interpretation of genetic variants\nand mutations."
  - slot: acquisition_methods[0].acquisition_details
    snippet: "affinity purification mass spectroscopy (AP-MS)\nand size exclusion mass spectroscopy (SEC-MS) methods for protein-protein\ninteraction (PPI) data"
  - slot: acquisition_methods[1].acquisition_details
    snippet: "CM4AI input data streams are generated using immunofluorescence (IF) subcellular\nmicroscopy for spatial proteomics data"
  - slot: acquisition_methods[2].acquisition_details
    snippet: "single-cell CRISPR-Cas perturbation screens by cell type"
  - slot: external_resources[3].external_resources
    snippet: "Cell maps are shared via the Network Data Exchange (NDEx)"
  - slot: human_subject_research.notes
    snippet: "CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue"
  - slot: notes
    snippet: "output cell maps are packaged with provenance graphs and rich metadata as AI-Ready\ndatasets in RO-Crate format"
- id: c011
  status: extracted
  extracted:
  - slot: direct_collection[0].collection_details
    snippet: "MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established\nfrom a metastatic site pleural effusion"
  - slot: direct_collection[0].collection_details
    snippet: "The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male\nNorthern European donor, available from the Human Induced Pluripotent Stem Cells\nInitiative (HipSci) resource"
  - slot: collection_mechanisms[3].mechanism_details
    snippet: "We have designed a CRISPR\nlentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene."
  - slot: acquisition_methods[2].acquisition_details
    snippet: "using the 10x\nGenomics 3'HT kit"
  - slot: acquisition_methods[1].acquisition_details
    snippet: "We established automated fixation and\npermeabilization protocols for the pipetting robot for MDA-MB-468 and KOLF2 cell lines"
  - slot: preprocessing_strategies[0].preprocessing_details
    snippet: "Downloaded PPI networks are processed using the node2vec deep learning model31\nto reduce dimensionality, producing a PPI embedding"
  - slot: preprocessing_strategies[1].preprocessing_details
    snippet: "IF images are processed using a Human Protein Atlas deep learning model32 to\nreduce dimensionality, producing an image embedding"
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "The PPI and image embeddings are integrated to obtain a co-embedding for each\nprotein using contrastive deep learning."
  - slot: preprocessing_strategies[3].preprocessing_details
    snippet: "Community detection is performed based on the all-by-all similarities of pairs of\nproteins in the co-embedding space."
  - slot: labeling_strategies[0].labeling_details
    snippet: "cell maps are aligned to\nknown protein function and pathway resources, including the Gene Ontology (GO)"
  - slot: machine_annotation_tools[0].tool_descriptions
    snippet: "assemblies in the cell maps are annotated using a large\nlanguage model (LLM) approach that we developed to name sets of proteins and assign\na name confidence score"
  - slot: external_resources[6].external_resources
    snippet: "open-source Integrative Modeling Platform (IMP) package version 2.18\n(https://integrativemodeling.org)"
- id: c012
  status: extracted
  extracted:
  - slot: notes
    snippet: "The RO-\nCrates are then sent to the FAIRSCAPE server where they are registered and\nassigned persistent, resolvable, globally unique persistent identifiers (PIDs)."
  - slot: notes
    snippet: "The PID system currently in\nuse is the ARK scheme42"
  - slot: notes
    snippet: "the server computes end-to-end entailments on each RO-Crate's provenance as\nexpressed in the EVI Evidence Graph Ontology"
  - slot: page
    snippet: "the CM4AI web portal (http://www.cm4ai.org)"
  - slot: data_governance.notes
    snippet: "The Ethics team worked closely with Data Acquisition, Tools, and Standards Modules to\ndevelop a plan for ethical preparation, licensing, dissemination, and Data Access\nsupervision of CM4AI datasets."
  - slot: ethical_reviews[1].review_details
    snippet: "The Ethics team employs a\nmethodology inspired by Value-Sensitive Design (VSD)"
  - slot: data_governance.notes
    snippet: "the Ethics team is instrumental in formulating the CM4AI Life\nCycle, a framework designed to elucidate governance milestones"
  - slot: notes
    snippet: "AI-Ready biomedical data are fully characterized FAIR data of known provenance, which\ncan be ethically and reliably processed by AI applications"
