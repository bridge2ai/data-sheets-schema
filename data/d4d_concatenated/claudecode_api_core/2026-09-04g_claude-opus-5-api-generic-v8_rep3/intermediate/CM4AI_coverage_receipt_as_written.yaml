- id: c002
  status: extracted
  extracted:
  - slot: related_datasets[6]
    snippet: "Multimodal cell maps as a foundation for structural and functional genomics"
  - slot: related_datasets[6].target_dataset
    snippet: "https://doi.org/10.1038/s41586-025-08878-3"
  - slot: addressing_gaps[1].response
    snippet: "Although these cell mapping technologies have typically been applied separately, integration of multiple complementary data modalities provides the opportunity to incorporate biological structure robustly across physical scales."
- id: c003
  status: nothing_relevant
