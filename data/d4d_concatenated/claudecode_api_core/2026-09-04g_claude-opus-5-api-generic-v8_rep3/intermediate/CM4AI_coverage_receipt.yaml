    snippet: 'Principal investigator: IDEKER, TREY'
  - slot: purposes[0].response
    snippet: 'the CM4AI data generation

      project seeks to map the spatiotemporal architecture of human cells and use these

      maps toward the grand challenge of interpretable genotype-phenotype learning'
  - slot: addressing_gaps[0].response
    snippet: 'In

      genomics and precision medicine, machine learning models are often "black boxes,"

      predicting phenotypes from genotypes without understanding the mechanisms by

      which such translation occurs.'
  - slot: purposes[3].response
    snippet: 'These data will broadly stimulate research and

      development in "visible" machine learning systems informed by multi-scale cell and

      tissue architecture.'
