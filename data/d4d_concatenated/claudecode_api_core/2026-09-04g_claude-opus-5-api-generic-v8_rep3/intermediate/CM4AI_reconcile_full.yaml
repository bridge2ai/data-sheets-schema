source_caveats: >-
  Values are taken from the June 2026 Dataverse release (doi:10.18130/V3/HIGT4C), which
  the declared source ranking places at tier 1 and marks as superseding the October 2025
  release. Where earlier Dataverse releases (March 2025, June 2025, October 2025) state
  different contents, those are facts about those earlier versions and are recorded under
  related_datasets rather than in this record's own slots. The CM4AI project web pages
  (tier 2) report cumulative project-level counts (1,374 protein interactions; 53,788
  immunofluorescent images; 7,023 total proteins investigated; 11,739 genes targeted;
  21.4 TB data volume) that are attributed to the CM4AI project as a whole rather than to
  this single release, and are therefore not asserted as release-level totals here. The
  bundle contains a Nature publication (tier 3) describing a U2OS cell map produced by the
  same investigators and pipeline; that is a distinct dataset and is recorded under
  related_datasets. The conforms_to value is carried from the tier-3 preprint and the
  tier-5 March 2025 and June 2025 releases rather than from the June 2026 release page
  itself. The June 2026 release page carries a Dataset Description block dated
  (2025-06-30) although the release itself was published 2026-06-17; the release page
  also gives a Data Creation Date of 2025-02-27, which is reused verbatim from earlier
  releases in this Dataverse collection. Creator names are rendered as the bundle states
  them, which for several authors is surname plus initial only.

