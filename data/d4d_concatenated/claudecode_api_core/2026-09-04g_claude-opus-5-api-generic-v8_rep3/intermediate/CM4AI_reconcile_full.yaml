notes: >-
  CM4AI consists of three pillars - Data, People, and Ethics - organized into six modules:
  Data Acquisition, Tools, and Standards (Data); Skills and Workforce Development, and
  Teaming (People); and Ethics. The project defines AI-Ready biomedical data as fully
  characterized FAIR data of known provenance that can be ethically and reliably processed
  by AI applications, whose models and software are available and well-described for
  validation and re-use, and whose predictions may be fully explained and interpreted to
  the user as needed; the project's stated criteria are FAIR, Provenanced, Characterized,
  Explainable, and Ethical. The Standards Module's FAIRSCAPE framework assigns persistent,
  resolvable, globally unique identifiers using the ARK scheme, with provenance entailments
  expressed in the EVI Evidence Graph Ontology. The CM4AI Tools Module maintains the
  Multi-Scale Integrated Cell (MuSIC) pipeline, which integrates protein-protein
  interaction and immunofluorescence image data by node2vec and Human Protein Atlas deep
  learning embeddings, contrastive co-embedding, and multi-resolution community detection,
  and which annotates resulting assemblies by alignment to Gene Ontology and Reactome and
  by a large language model naming approach; this pipeline produces the computed cell maps
  that the June 2026 release states are not included in this release.