acquisition_methods:
- acquisition_details: >-
    Protein-protein interaction data acquired by affinity purification-mass spectrometry
    (AP-MS) on endogenously tagged cell lines and by size-exclusion chromatography coupled
    to mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping, used
    as two orthogonal mass spectrometry-based approaches.
  was_directly_observed: true
- acquisition_details: >-
    Spatial proteomics acquired by immunofluorescence (IF) subcellular microscopy, using
    the Human Protein Atlas resource of antibodies, with automated fixation and
    permeabilization protocols on a pipetting robot for the MDA-MB-468 and KOLF2 cell
    lines.
  was_directly_observed: true
- acquisition_details: >-
    Genetic perturbation data acquired by single-cell CRISPR (CRISPRi) perturbation
    screens by cell type, using a CRISPR lentiviral library targeting chromatin factors
    with 6 guide RNAs per gene, in cell lines expressing inducible dCas9, read out with
    the 10x Genomics 3'HT kit.
  was_directly_observed: true

collection_mechanisms:
- mechanism_details: >-
    Affinity purification-mass spectrometry (AP-MS) on endogenously tagged cell lines.
- mechanism_details: >-
    Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
    complex and interaction mapping.
- mechanism_details: >-
    Immunofluorescence-based staining (ICC-IF) and confocal microscopy, with four color
    channels: DAPI for nuclei (blue), calreticulin antibody for endoplasmic reticulum
    (yellow), tubulin antibody for microtubules (red), and antibody against the protein of
    interest (green).
- mechanism_details: >-
    Single-cell CRISPR screens using a CRISPR lentiviral library with 6 guide RNAs per
    gene in cell lines expressing inducible dCas9, sequenced with the 10x Genomics 3'HT
    kit.

data_collectors:
- collector_details: >-
    Immunofluorescence imaging was performed in the Lundberg Lab at Stanford University.
  role: Spatial proteomics imaging
- collector_details: >-
    Size exclusion chromatography-mass spectrometry was performed in the Nevan Krogan
    laboratory at the University of California San Francisco.
  role: Protein-protein interaction mass spectrometry
- collector_details: >-
    Production Location recorded for the release: University of California San Diego;
    University of California San Francisco; Stanford University; University of Virginia.
  role: Producing institutions

direct_collection:
- is_direct: false
  collection_details: >-
    Data were generated from commercially available, ethically sourced human cell lines
    rather than collected directly from individuals. The MDA-MB-468 cell line is available
    from ATCC; the KOLF2.1J iPSC line was derived from a healthy male Northern European
    donor and is available from the Human Induced Pluripotent Stem Cells Initiative
    (HipSci) resource.

sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  why_not_representative: >-
    Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the
    population at large.
  strategies: >-
    Targeted selection of cell lines and perturbation targets rather than random sampling.
  source_data: >-
    MDA-MB-468 triple negative breast cancer cells (with and without paclitaxel or
    vorinostat) and KOLF2.1J induced pluripotent stem cells (with and without
    differentiation into neural progenitor cells, neurons, and cardiomyocytes).
  notes: >-
    The CM4AI preprint states the project objective as multimodal interrogation of 100
    chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and
    cardiac disorders in disease-relevant cell lines under perturbed and unperturbed
    conditions. That is a stated project objective from May 2024; the June 2026 release
    page does not state how many targets this release actually covers.

