subpopulations:
- subpopulation_elements_present: true
  identification: >-
    Cell type and treatment condition. The release spans MDA-MB-468 breast cancer cells
    under untreated, paclitaxel-treated, and vorinostat-treated conditions; undifferentiated
    (parental) KOLF2.1J iPSCs; and iPSC-derived neural progenitor cells (NPCs), neurons,
    and cardiomyocytes.
  distribution: >-
    Coverage differs by modality: perturb-seq covers MDA-MB-468 with and without treatment
    and undifferentiated KOLF2.1J iPSCs; SEC-MS covers MDA-MB-468 with and without
    treatment plus undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and
    cardiomyocytes; AP-MS covers MDA-MB-468 with treatment only; immunofluorescence imaging
    covers MDA-MB-468 with and without treatment only.

