      Cell architectural changes and interactions in presence of specific disease
      processes, treatment conditions, or genetic perturbations

prohibited_uses:
- prohibition_reason: >-
    Clinical decision-making and patient-care use are prohibited because the release
    states that appropriate regulatory oversight and approval have not been obtained for
    such use; these are laboratory data.
  notes: >-
    Stated on the release page under Prohibited Uses: "These laboratory data are not to be
    used in clinical decision-making or in any context involving patient care without
    appropriate regulatory oversight and approval."
- prohibition_reason: >-
    Commercial use is prohibited because the copyright holders have reserved commercial
    rights: the dataset license (CC BY-NC-SA 4.0) does not permit use of the material for
    commercial purposes, and the CM4AI preprint states that commercial use requires a
    separate license negotiation with the copyright holder.

known_limitations:
- limitation_type: scope_limitation
  limitation_description: >-
    This is an interim release and does not contain predicted cell maps, which will be
    added in future releases. Computed cell maps are not included in this release.
  scope_impact: >-
    The current release is most suitable for bioinformatics analysis of the individual
    datasets rather than for use of the integrated cell maps.
- limitation_type: coverage_limitation
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
    perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: methodological_limitation
  limitation_description: >-
    Analysis of the release requires domain expertise for meaningful interpretation.
- limitation_type: coverage_limitation
  limitation_description: >-
    Some datasets in the release are under temporary pre-publication embargo. The
    perturb-seq data in KOLF2.1J iPSCs (undifferentiated) and the perturb-seq data in
    MDA-MB-468 breast cancer cells (with and without treatment) are listed as Embargoed
    among the external data links.

known_biases:
- bias_type: representation_bias
  bias_description: >-
    Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the
    population at large.

