    is_data_split: true
    is_subpopulation: false

instances:
  - id: data_sheets_schema:AI_READI_instance_participant
    name: Participant record
    description: >-
      Each instance represents an individual patient. Each instance consists of all of the data
      available for an individual participating in the study. Multiple modalities of data are
      collected for each participant, including survey data, clinical data, retinal imaging data,
      environmental sensor data, continuous glucose monitor data, and wearable activity monitor data.
      These encompass tabular data, imaging data, and physiological signal/waveform data. There is no
      unstructured text data included in this dataset. The exact forms used for data collection in
      REDCap are available at https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf, and all
      modalities, file formats, and devices are detailed in the dataset documentation at
      https://docs.aireadi.org/.
    instance_type: individual patient
    counts: 2280
    label: false
    label_description: >-
      No labels are provided. No specific labeling was performed in the dataset, as the dataset is a
      hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
      applications.
    missing_information:
      - id: data_sheets_schema:AI_READI_missing_info_modalities
        name: Modality-level missingness across participants
        missing:
          - Data for one or more modalities is absent for some participants
        why_missing:
          - Some participants elected not to participate in some study elements
          - >-
            In a few cases, the data collection device did not have any stored results or was
            returned too late to retrieve the results (e.g. battery died, data was lost)
          - >-
            In a few cases, there may have been a data collision at some point in the process and
            data has been lost

anomalies:
  - id: data_sheets_schema:AI_READI_anomaly_1
    name: Expected sources of error and noise by modality
    anomaly_details:
      - >-
        In cases of survey data, skipped questions or incomplete responses are expected.
      - >-
        In cases of using wearables, improper use, technical failure such as battery failure or
        system malfunction are expected.
      - >-
        In cases of imaging data, patient uncooperation, noise that may obscure the images and
        technical failure such as system malfunction, and data transfer failures are expected.
      - >-
        Handheld undilated fundus photography (Optomed Aurora) image quality varies from patient to
        patient and within the same patient because the pupil is not dilated and the camera is
        handheld.
      - >-
        Spectralis HRA imaging is operator-dependent and not fully automated, so quality issues may
        arise, which may lead to skipping this modality and missing data.
      - >-
        FLIO is performed last in the visit, takes longer than a usual Spectralis OCT, and exposes
        patients to uncomfortable levels of light, so patients may not be at their best possible
        compliance.

known_biases:
  - id: data_sheets_schema:AI_READI_bias_representation
    name: Incomplete demographic balance and missing racial/ethnic groups
    bias_type: representation_bias
    bias_description: >-
      While the AI-READI cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters. As enrollment is ongoing, the periodic updates to data
      releases may not have achieved balanced distribution across groups. The study cohort may not
      provide a comprehensive representation of the population, as it does not include other
      races/ethnicities such as Pacific Islanders and Native Americans.
    mitigation_strategy: >-
      Three recording sites (University of Alabama at Birmingham, University of California San Diego,
      University of Washington) were strategically selected for geographic diversity across the
      United States and to ensure diverse representation across various racial and ethnic groups, and
      individuals from all demographic backgrounds were recruited at all 3 sites. The project team
      additionally provides recommended 70%/15%/15% splits whose validation and test sets are
      balanced as well as possible for sex, race/ethnicity and diabetes status.
    affected_subsets:
      - Pacific Islander populations
      - Native American populations
  - id: data_sheets_schema:AI_READI_bias_selection
    name: Urban, hospital-based recruitment
    bias_type: selection_bias
    bias_description: >-
      Factors influencing the generalization of derived models include the predominantly urban and
      hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
      backgrounds. Recruitment pools were identified by screening Electronic Health Records (EHR) for
      diabetes and prediabetes ICD-10 codes for all patients who have had an encounter with the
      sites' health systems within the past 2 years.
    mitigation_strategy: >-
      The selection of study sites was intended to ensure equitable representation and minimize the
      potential for sampling bias, and uniform data collection protocols were implemented for all
      subjects irrespective of their race/ethnicity, biological sex, or diabetes severity, across all
      study sites.

known_limitations:
  - id: data_sheets_schema:AI_READI_limitation_representativeness
    name: Limited representativeness of the study cohort
    limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it does
      not include other races/ethnicities such as Pacific Islanders and Native Americans, and
      recruitment was predominantly urban and hospital-based, which may not fully capture diverse
      cultural and socioeconomic backgrounds.
    scope_impact: >-
      May limit the generalization of models derived from the dataset to populations not represented
      in the cohort.
    recommended_mitigation: >-
      Use the recommended data splits whose validation and test sets are balanced as well as possible
      for sex, race/ethnicity and diabetes status.
  - id: data_sheets_schema:AI_READI_limitation_coverage
    name: Not all modalities available for all participants
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements; in a few cases the data collection device did not have any
      stored results or was returned too late to retrieve the results; and in a few cases a data
      collision may have caused data loss.
    scope_impact: >-
      Analyses requiring complete multimodal coverage will apply to a subset of the 2280 participants.
  - id: data_sheets_schema:AI_READI_limitation_scope
    name: Cross-sectional design with a single visit per participant
    limitation_type: scope_limitation
    limitation_description: >-
      All instances are part of the same prospective data generation project (AI-READI), and there is
      currently only one visit per participant. Approximately 4% of participants are expected to
      undergo a follow-up examination in Year 4.
    scope_impact: >-
      Longitudinal within-participant analyses are not supported by this version of the dataset.
  - id: data_sheets_schema:AI_READI_limitation_temporal
    name: Version-scoped collection window and dropped visual acuity variables
    limitation_type: temporal_limitation
    limitation_description: >-
      This version consists of data collected between July 19, 2023 and May 1, 2025. The data
      fields/types are largely the same as the prior version of the dataset; however, the Snellen
      visual acuity variables were dropped in this version, such that now only logMAR visual acuity
      measurements are available.
    scope_impact: >-
      Analyses depending on Snellen visual acuity variables cannot be reproduced against this version.

