purposes:
  - id: data_sheets_schema:AI_READI_purpose_1
    name: Enable AI/ML research into type 2 diabetes and salutogenesis
    description: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type 2
      diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM is a
      growing public health threat. Yet, the current understanding of T2DM, especially in the
      context of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may
      help with improving our understanding but a key issue is the lack of data ready for training
      AI models. The AI-READI dataset is intended to fill this gap.
    response: >-
      The dataset was created to enable AI/ML research into type 2 diabetes mellitus, including
      salutogenic pathways to return to health.
  - id: data_sheets_schema:AI_READI_purpose_2
    name: Support downstream artificial intelligence applications
    description: >-
      The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
      manifolds and various applications in artificial intelligence.
    response: >-
      Applications addressed are research applications, specifically downstream pseudotime manifold
      analysis and other artificial intelligence applications.

tasks:
  - id: data_sheets_schema:AI_READI_task_1
    name: Pseudotime manifold analysis of disease trajectories
    description: >-
      The data collection process is specifically tailored to enable downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories. This involves gathering and
      learning from complex, multimodal data from participants exhibiting varying disease severity,
      ranging from normal to insulin-dependent Type 2 Diabetes Mellitus (T2DM).
    response: >-
      Downstream pseudotime manifold analysis to predict disease trajectories across the range from
      normal to insulin-dependent T2DM.
  - id: data_sheets_schema:AI_READI_task_2
    name: Hypothesis-agnostic dataset without predefined labeled tasks
    description: >-
      No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
      dataset aimed at facilitating multiple potential downstream AI/ML applications. The version 3
      datasheet does not include new tasks or labeling; it does include a new recommended data split
      for the 2280 participants balancing training, validation, and testing sets for age, sex,
      races/ethnicities, and study group.
    response: >-
      The dataset does not come with predefined tasks or labels; it provides recommended data splits
      only.

addressing_gaps:
  - id: data_sheets_schema:AI_READI_gap_1
    name: Lack of AI-ready data for type 2 diabetes
    description: >-
      Given the complexity of T2DM, AI-based approaches may help with improving our understanding
      but a key issue is the lack of data ready for training AI models. The AI-READI dataset is
      intended to fill this gap. The acquisition protocol spans multiple domains (survey data,
      physical measurements, clinical data, imaging data, wearable device data) to enable downstream
      AI/ML analyses that may not be feasible with existing data sources such as claims or
      electronic health records data.
    response: >-
      The gap addressed is the absence of AI-ready, multimodal, prospectively collected T2DM data
      that supports analyses not feasible with claims or electronic health record data.

creators:
  - id: data_sheets_schema:AI_READI_creator_consortium
    name: AI-READI Consortium
    description: >-
      This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI
      Consortium. Details about each member and their institutions are available on the project
      website at https://aireadi.org. There is a wide range of experience within the project team,
      including senior, mid-career, and early career faculty members as well as clinical research
      coordinators, staff, and interns. They collectively cover many areas of expertise including
      clinical research, data collection, data management, data standards, bioinformatics, team
