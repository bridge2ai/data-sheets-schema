    description: >-
      Recommended training split comprising 70% of the 2280 participants. Because sex, race, and
      ethnicity data are not being released with the public version of the dataset, the project team
      prepared data splits into 70%/15%/15% proportions where the validation and test sets are
      balanced as well as possible for sex, race/ethnicity and diabetes status.
    is_data_split: true
    is_subpopulation: false
  - id: data_sheets_schema:AI_READI_split_validation
    name: Recommended validation split
    description: >-
      Recommended validation split comprising 15% of the 2280 participants, balanced as well as
      possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle
      controlled, oral medication controlled, and insulin controlled).
    is_data_split: true
    is_subpopulation: false
  - id: data_sheets_schema:AI_READI_split_testing
    name: Recommended testing split
    description: >-
      Recommended testing split comprising 15% of the 2280 participants, balanced as well as possible
