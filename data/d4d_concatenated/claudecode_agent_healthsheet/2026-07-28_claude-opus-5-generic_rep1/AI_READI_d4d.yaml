instances:
  - name: Participant record
    instance_type: individual patient
    counts: 2280
    label: false
    description: >-
      Each instance represents an individual patient, and consists of all of the data available for
      an individual participating in the study. There are 2280 instances in this current version of
      the dataset (version 3, released fall 2025). The first version of the dataset, composed of
      data from the pilot data collection phase, had 204 instances; the second version, composed of
      data from the first year of the study, had 1067 instances. Multiple modalities of data are
      collected for each participant, including survey data, clinical data, retinal imaging data,
      environmental sensor data, continuous glucose monitor data, and wearable activity monitor
      data. These encompass tabular data, imaging data, and physiological signal/waveform data.
      There is no unstructured text data included in this dataset.

sampling_strategies:
  - name: Full enrollment, no sampling
    is_sample: false
    description: >-
      The dataset contains all possible instances. More specifically, the dataset contains data from
      all participants who have been enrolled during the first year of data collection for AI-READI.
      The source states "N/A" when asked what sampling strategy was used, consistent with the
      dataset not being a sample of a larger set.
  - name: Recruitment sampling design
    strategies:
      - Recruitment sampling procedures aimed at achieving approximately equal distribution of participants across sex, race, and diabetes severity
    is_representative: false
    why_not_representative:
      - >-
        While the AI-READI cross-sectional database ultimately aims to achieve balance across
        race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
        balanced across these parameters. As enrollment is ongoing, periodic updates to data
        releases may not have achieved balanced distribution across groups.
      - >-
        The study cohort may not provide a comprehensive representation of the population, as it
        does not include other races/ethnicities such as Pacific Islanders and Native Americans.
      - >-
        Recruitment was predominantly urban and hospital-based, which may not fully capture diverse
        cultural and socioeconomic backgrounds.
    source_data:
      - >-
        Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes
        and prediabetes ICD-10 codes for all patients who have had an encounter with the sites'
        health systems within the past 2 years.
    description: >-
      Three recording sites were strategically selected to achieve diverse recruitment: the
      University of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and
      the University of Washington (UW). The sites were chosen for geographic diversity across the
      United States and to ensure diverse representation across various racial and ethnic groups.
      Individuals from all demographic backgrounds were recruited at all 3 sites.

