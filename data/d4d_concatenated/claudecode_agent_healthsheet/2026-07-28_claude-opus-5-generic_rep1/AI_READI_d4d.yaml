purposes:
  - name: Enable AI/ML research into type 2 diabetes and salutogenesis
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type 2
      diabetes mellitus (T2DM), including salutogenic pathways to return to health.
    description: >-
      T2DM is a growing public health threat, yet the current understanding of T2DM, especially in
      the context of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches
      may help with improving our understanding, but a key issue is the lack of data ready for
      training AI models.
  - name: Support downstream applications of a multi-modal dataset
    response: >-
      The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
      manifolds and various applications in artificial intelligence.
    description: >-
      Stated applications are research applications in artificial intelligence and machine learning.

tasks:
  - name: Pseudotime manifold analysis of disease trajectories
    response: >-
      The data collection process is specifically tailored to enable downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories.
    description: >-
      This involves gathering and learning from complex, multimodal data from participants
      exhibiting varying disease severity, ranging from normal to insulin-dependent Type 2 Diabetes
      Mellitus (T2DM).
  - name: No predefined task or labeling
    response: >-
      No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
      dataset aimed at facilitating multiple potential downstream AI/ML applications.
    description: >-
      This version of the dataset does not introduce new tasks or labeling. It does include a new
      recommended data split for the 2280 participants balancing training, validation, and testing
      sets for age, sex, races/ethnicities, and study group.

addressing_gaps:
  - name: Lack of AI-ready data for type 2 diabetes
    response: >-
      A key issue for AI-based approaches to T2DM is the lack of data ready for training AI models.
      The AI-READI dataset is intended to fill this gap.
    description: >-
      The acquisition protocol spans multiple domains (survey data, physical measurements, clinical
      data, imaging data, wearable device data) to enable downstream AI/ML analyses that may not be
      feasible with existing data sources such as claims or electronic health records data.

