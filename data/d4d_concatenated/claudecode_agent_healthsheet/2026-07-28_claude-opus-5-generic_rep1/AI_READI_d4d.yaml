  - name: Wearable and sensor device anomalies
    anomaly_details:
      - >-
        In cases of using wearables, improper use, technical failure such as battery failure or
        system malfunction are expected.
      - >-
        In a few cases, the data collection device did not have any stored results or was returned
        too late to retrieve the results (e.g. battery died, data was lost).
  - name: Imaging data anomalies
    anomaly_details:
      - >-
        In cases of imaging data, patient uncooperation, noise that may obscure the images and
        technical failure such as system malfunction, and data transfer failures are expected.
  - name: Data handling anomalies
    anomaly_details:
      - >-
        In a few cases, there may have been a data collision at some point in the process and data
        has been lost.

known_biases:
  - name: Demographic balance not achieved in released versions
    bias_type: representation_bias
    bias_description: >-
      While the AI-READI cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters. As enrollment is ongoing, the periodic updates to data
      releases may not have achieved balanced distribution across groups. The study cohort does not
      include other races/ethnicities such as Pacific Islanders and Native Americans.
    mitigation_strategy: >-
      Recruitment sampling procedures aimed at achieving approximately equal distribution of
      participants across sex, race, and diabetes severity. Three sites were chosen for geographic
      diversity and to ensure diverse representation across racial and ethnic groups, and
      individuals from all demographic backgrounds were recruited at all 3 sites. A recommended
      training/validation/testing split is provided in which the validation and test sets are
      balanced as well as possible for sex, race/ethnicity and diabetes status.
    affected_subsets:
      - race and ethnicity groups
      - biological sex groups
      - diabetes presence and severity groups
  - name: Recruitment channel and eligibility selection
    bias_type: selection_bias
    bias_description: >-
      Recruitment was predominantly urban and hospital-based, which may not fully capture diverse
      cultural and socioeconomic backgrounds. Recruitment pools were identified by screening
      Electronic Health Records for diabetes and prediabetes ICD-10 codes among patients with an
      encounter at the sites' health systems within the past 2 years. Eligibility further required
      participants to be at least 40 years old, able to provide consent, and able to speak and read
      English, and excluded persons who were pregnant, had gestational diabetes, or had Type 1
      diabetes.
    mitigation_strategy: >-
      The selection of study sites was intended to ensure equitable representation and minimize the
      potential for sampling bias, and uniform data collection protocols were implemented for all
      subjects irrespective of their race/ethnicity, biological sex, or diabetes severity, across
      all study sites.
  - name: Device- and operator-dependent measurement variability
    bias_type: measurement_bias
    bias_description: >-
      Image quality varies with device, operator involvement, and participant compliance. For
      undilated handheld fundus photography, the quality of the images varies from patient to
      patient and within the same patient because patients are not dilated and the camera is
      handheld. For operator-driven systems such as the Spectralis HRA+OCT, quality issues may arise
      that lead to skipping the modality and missing data. FLIO is performed last in the visit
      because it takes longer and exposes patients to uncomfortable levels of light, so patients may
      not be at their best possible compliance.
    mitigation_strategy: >-
      Information on device make and model, including specific modalities such as macula scans or
      wide scans during OCT, was documented to ensure repeatability. The study included multiple
      devices for one measure to enhance generalizability and represent the diverse range of
      equipment utilized in clinical settings. Several imaging protocols are executed in fully
      automated mode to minimize operator-induced noise.

known_limitations:
  - name: Cohort representativeness
    limitation_type: representativeness_limitation
    limitation_description: >-
      Factors influencing the generalization of derived models include the predominantly urban and
      hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
      backgrounds. The study cohort may not provide a comprehensive representation of the
      population, as it does not include other races/ethnicities such as Pacific Islanders and
      Native Americans.
    scope_impact: >-
      Models derived from this dataset may generalize poorly to populations not represented in the
      cohort.
  - name: Incomplete modality coverage per participant
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements. In a few cases, the data collection device did not have
      any stored results or was returned too late to retrieve the results, or a data collision
      resulted in lost data.
  - name: Demographic variables withheld from the public tier
    limitation_type: coverage_limitation
    limitation_description: >-
      Sex, race, and ethnicity data are not being released with the public version of the dataset;
      these variables are held under controlled access.
    recommended_mitigation: >-
      The project team has prepared recommended data splits in which validation and test sets are
      balanced as well as possible for sex, race/ethnicity and diabetes status, so that users of the
      public tier can train and evaluate models against balanced partitions without access to the
      underlying demographic variables.
  - name: Single visit per participant
    limitation_type: scope_limitation
    limitation_description: >-
      There is currently only one visit per participant, so the released data are cross-sectional
      rather than longitudinal at the participant level.
  - name: Fixed collection window and ongoing enrollment
    limitation_type: temporal_limitation
    limitation_description: >-
      This version covers data collected between July 19, 2023 and May 1, 2025. Enrollment is
      ongoing, and future versions of the dataset will be released that include larger numbers of
      subjects/patients as enrollment increases.
  - name: Visual acuity variable change between versions
    limitation_type: integration_limitation
    limitation_description: >-
      The data fields/types are largely the same as the prior version of the dataset. However, the
      Snellen visual acuity variables were dropped in this version, such that now only logMAR visual
      acuity measurements are available.
    scope_impact: >-
      Analyses that combine this version with earlier versions cannot rely on Snellen visual acuity
      being present in all versions.
  - name: No formal external audit
    limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has not undergone any formal external audits. It has been reviewed internally by
      AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included.

