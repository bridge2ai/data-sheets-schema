direct_collection:
  - id: d4d:aireadi-v3-direct-collection
    name: Direct collection from participants
    is_direct: true
    collection_details:
      - "The data was collected directly from participants across the three recruiting sites."
      - "Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes and prediabetes ICD-10 codes for all patients who have had an encounter with the sites' health systems within the past 2 years."
      - "The data were collected in the USA."
      - "English language was used for communication with study participants."
      - "Accessibility measurements were not specifically assessed. However, transportation assistance (rideshare services) was offered to study participants who endorsed barriers to transporting themselves to study visits."

collection_notifications:
  - id: d4d:aireadi-v3-collection-notification
    name: Participant notification of data collection
    notification_details:
      - "Each individual was aware of the data collection, as this was not passive data collection or secondary use of existing data, but rather active data collection directly from participants."

collection_consents:
  - id: d4d:aireadi-v3-collection-consent
    name: Informed consent for collection and use
    consent_details:
      - "Informed consent to participate was required before participation in any part of the protocol (including questionnaires)."
      - "Potential participants were given the option to read all consent documentation electronically (e-consent) before their visit and give their consent with an electronic signature without verbal communication with a clinical research coordinator."
      - "Participants may access e-consent documentation in REDCap and decide at that point they do not want to participate or would like additional information."
      - "The approved consent form for the principal project site University of Washington is available at https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf."
      - "The other clinical sites had IRB reliance and used the same consent form, with minor institution-specific language incorporated depending on individual institutional requirements."

consent_revocations:
  - id: d4d:aireadi-v3-consent-revocation
    name: Consent withdrawal mechanism
    revocation_details:
      - "Participants were permitted to withdraw consent at any time and cease study participation."
      - "However, any data that had been shared or used up to that point would stay in the dataset."
      - "This is clearly communicated in the consent document."

missing_data_documentation:
  - id: d4d:aireadi-v3-missing-data-documentation
    name: Missing data patterns and causes
    missing_data_patterns:
      - "Not all modalities are available for all participants."
      - "In survey data, skipped questions or incomplete responses are expected."
    missing_data_causes:
      - "Some participants elected not to participate in some study elements."
      - "In a few cases, the data collection device did not have any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost)."
      - "In a few cases, there may have been a data collision at some point in the process and data has been lost."
      - "Operator-dependent imaging modalities may be skipped when quality issues arise."

raw_data_sources:
  - id: d4d:aireadi-v3-raw-data-source
    name: Raw study data collected from participants
    source_description: >-
      Raw data acquired directly from study participants at three recruiting sites, comprising
      survey responses, clinical measurements and laboratory results, retinal imaging, and readings
      from environmental sensors, continuous glucose monitors, and wearable activity monitors.
    source_type:
      - survey data
      - clinical data
      - retinal imaging data
      - environmental sensor data
      - continuous glucose monitor data
      - wearable activity monitor data
    access_details: >-
      The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team right
      now, because it has not been mapped to standardized terminologies and because the raw data may
      accidentally include personal health information or personally identifiable information (e.g.
      in free text fields). There is a possibility that raw data may be included in future releases
      of the controlled access dataset.
    raw_data_format:
      - tabular data
      - imaging data
      - physiological signal/waveform data

