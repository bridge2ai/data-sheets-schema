preprocessing_strategies:
  - id: d4d:aireadi-v3-preprocessing
    name: Standardization and central processing
    preprocessing_details:
      - "Once data were sent from each of the study sites to the central project team, additional processing steps were conducted in preparation for dissemination."
      - "All data were mapped to standardized terminologies when possible, such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model, a common data model for observational health data, and the Digital Imaging and Communications in Medicine (DICOM), a commonly used standard for medical imaging data."
      - "Details about the data processing approaches for each data domain/modality are described in the dataset documentation at https://docs.aireadi.org."
      - "No data were excluded from the dataset at the time of preprocessing."

cleaning_strategies:
  - id: d4d:aireadi-v3-cleaning
    name: Quality control and data cleaning at entry and acquisition
    cleaning_details:
      - "There were several quality control measures used at the time of data entry/acquisition."
      - "Clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in reports viewed by clinical research coordinators (CRCs) and Data Managers."
      - "Using these REDCap reports as guides, Data Managers and CRCs examined participant records and determined if an error was likely."
      - "Data were checked for credibility, based on range checks to determine if all responses fall within a prespecified reasonable range."
      - "Data were checked for incorrect flow through prescribed skip patterns."
      - "Data were checked for missing data that can be directly filled from other portions of an individual's record."
      - "Data were checked for the omission and/or duplication of records."
      - "Editing was only done under the guidance and approval of the site PI. If corrected data was available from elsewhere in the respondent's answers, the error was corrected. If there was no logical or appropriate way to correct the data, the site PI reviewed the values and made decisions about whether those values should be removed from the data."
    used_software:
      - id: d4d:software-redcap
        name: REDCap
        description: >-
          Electronic data capture system used for study forms, e-consent documentation, and data
          entry quality control reports.

