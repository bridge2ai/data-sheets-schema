collection_mechanisms:
  - id: d4d:aireadi-v3-collection-mechanism-protocol
    name: Documented data collection and processing procedures
    mechanism_details:
      - "The procedures for data collection and processing are available at https://docs.aireadi.org."
      - "The exact forms used for data collection in REDCap are available at https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf."
      - "Information on device make and model, including specific modalities like macula scans or wide scans during OCT, were documented to ensure repeatability."
      - "The study included multiple devices for one measure to enhance generalizability and represent the diverse range of equipment utilized in clinical settings."
      - "Uniform data collection protocols were implemented for all subjects, irrespective of their race/ethnicity, biological sex, or diabetes severity, across all study sites."
    used_software:
      - id: d4d:software-redcap
        name: REDCap
        description: >-
          Electronic data capture system used for study forms, e-consent documentation, and data
          entry quality control reports.
  - id: d4d:aireadi-v3-collection-mechanism-devices
    name: Devices and instruments used for data collection
    description: >-
      The devices included in the study are listed below; more details can be found at
      https://docs.aireadi.org.
    mechanism_details:
      - "Environmental sensor device: participants are sent home with an environmental sensor (a custom-designed sensor unit called the LeeLab Anura), which they use for 10 continuous days before returning the devices to the clinical research coordinators for data download."
      - "Continuous glucose monitor: the Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM) that directly monitors blood glucose levels without requiring finger sticks. It must be worn continuously in order to collect data."
      - "Wearable accelerometer (physical activity monitor): the Garmin Vivosmart 5 Fitness Activity tracker is used to measure data related to physical activity."
      - "Heart rate: heart rate can be read from EKG or blood pressure measurement devices."
      - "Blood pressure: OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series Vital signs monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff are used across the various data acquisition sites."
      - "Visual acuity: M&S Technologies EVA device, administered at a distance of 4 meters from a touch-screen monitor that is 12x20 inches. Under photopic conditions no neutral density filters are used and a general occluder is used, with participants wearing their own prescription spectacles or trial frames; under mesopic conditions a neutral density (ND) filter is used, either as a lens added to trial frames or as a handheld ND-occluder over the glasses."
      - "Contrast sensitivity: the MARS Letter Contrast Sensitivity test (Perceptrix) was conducted monocularly under both photopic conditions (with a general occluder) and mesopic conditions (using a neutral density occluder with a low luminance filter lens). The standardized order of MARS cards was Photopic OD, Photopic OS, Mesopic OD, and Mesopic OS. Background luminance fell within 60 to 120 cd/m2 (optimal 85 cd/m2) and illuminance was recommended between 189 and 377 lux (optimal 267 lux). Designed viewing distance was 50 cm but could vary between 40 and 59 cm. Patients wore appropriate near correction (reading glasses or trial frames with +2.00D lenses) and all testing was carried out undilated. Testing terminated after two consecutive errors or at the end of the chart, and log contrast sensitivity was computed by multiplying the number of errors prior to the final correct letter by 0.04 and subtracting the result from the log CS value at the final correct letter."
      - "Autorefraction: KR 800 Auto Keratometer/Refractor."
      - "EKG: Philips (manufacturer of Pagewriter TC30 Cardiograph)."
      - "Lensometer: NIDEK LM-600P Auto Lensometer, Topcon-CL-200 computerized Lensometer, and Topcon-CL-300 computerized Lensometer are used at data acquisition sites across the study."
      - "Undilated fundus photography: the Optomed Aurora IQ is a handheld fundus camera that takes non-mydriatic images of the ocular fundus, with a 50-degree field of view, 5 Mpix sensor, and high-contrast optical design. Images are taken undilated in a dark room while the patient sits on a comfortable chair, laying back."
      - "Dilated fundus photography: the iCare EIDON is a widefield TrueColor confocal fundus imaging system that can capture images up to 200 degrees, with TrueColor, blue, red, Red-Free, and infrared confocal modalities, operating without dilation (minimum pupil 2.5 mm) in both fully automated and fully manual modes. AI-READI EIDON images include two main modalities: Single Field Central IR/FAF and Smart Horizontal Mosaic. Imaging is done in fully automated mode in a dark room."
      - "Spectralis HRA (Heidelberg Engineering): the Heidelberg Spectralis HRA+OCT combines optical coherence tomography with retinal angiography and uses confocal scanning laser ophthalmoscope (cSLO) technology, which minimizes the effects of light scatter and can be used effectively even in patients with cataracts. For AI-READI subjects, imaging is done in a dark room using the ONH-RC, PPole-H, and OCTA of the macula modalities."
      - "Triton DRI OCT (Topcon Healthcare): combines swept-source OCT technology with multimodal fundus imaging, with a 1,050 nm wavelength light source and a non-mydriatic color fundus camera. AI-READI imaging is done in a dark room with automatic machine positioning, in 12.0X12.0 mm and 6.0X6.0 mm OCTA, and 12.0 mm X 9.0 mm X 6.0 mm 3D Horizontal and Radial scan modes."
      - "Maestro2 3D OCT (Topcon Healthcare): a robotic OCT and color fundus camera system that can capture a 12 mm x 9 mm wide-field OCT scan including the macula and optic disc, plus high-resolution non-mydriatic true color fundus photography, OCT, and OCTA with a single button press. Protocols include 12.0 mm X 9.0 mm widefield, 6.0 mm X 6.0 mm 3D macula scan and 6.0 mm X 6.0 mm OCTA (scan rate: 50 kHz)."
      - "FLIO (Heidelberg Engineering): Fluorescence Lifetime Imaging Ophthalmoscopy is a non-invasive method that measures fluorescence lifetimes to provide information about the metabolic and functional status of the retina. Imaging is done by an operator in a dark room and is performed as the last modality of an AI-READI visit."
      - "Cirrus 5000 Angioplex (Carl Zeiss Meditec): a high-definition OCT system offering non-invasive imaging of retinal microvasculature. Imaging protocols include 512 X 512 and 200 X 200 macula and ONH scans and OCTA of the macula; the system also provides a 60-degree OCTA widefield view, with 8x8mm single scans and 14x14mm automated OCTA montage for rapid peripheral assessment of the retina."
      - "Monofilament testing for peripheral neuropathy: a standard clinical test performed using a standard 10g monofilament applying pressure to different points on the plantar surface of the feet. Patients confirm sensation by saying yes; if they do not sense the monofilament after it bends they are considered insensate. When the sequence is completed the insensate area is retested for confirmation and the sequence is repeated randomly at each testing site on each foot until results are obtained. Results are recorded on an iPad, laptop, or a paper questionnaire and are directly added to the project's REDCap by the clinical research staff."
      - "Montreal Cognitive Assessment (MoCA): an in-office screening tool that helps detect mild cognitive impairment and early onset of dementia, evaluating memory, executive functioning, attention, language, visuospatial, orientation, visuoconstructional skills, conceptual thinking, and calculations. The MoCA generates a total score and six domain-specific index scores; the maximum score is 30, anything below 24 is a sign of cognitive impairment, and a final total score of 26 and above is considered normal. AI-READI research staff perform this test on an iPad using the pre-installed MoCA Duo app, which captures all patient responses in an interactive manner."

