instances:
  - id: d4d:aireadi-v3-instance-participant
    name: Individual participant
    instance_type: individual patient
    counts: 2280
    label: false
    label_description: >-
      No labels are provided. No explicit label or target is associated with each data instance.
    description: >-
      Each instance represents an individual patient. Each instance consists of all of the data
      available for an individual participating in the study. There are 2280 instances in this
      current version of the dataset (version 3, released fall 2025). Multiple modalities of data
      are collected for each participant, including survey data, clinical data, retinal imaging
      data, environmental sensor data, continuous glucose monitor data, and wearable activity
      monitor data. These encompass tabular data, imaging data, and physiological signal/waveform
      data. There is no unstructured text data included in this dataset. The exact forms used for
      data collection in REDCap are available at
      https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf, and all modalities, file
      formats, and devices are detailed in the dataset documentation at https://docs.aireadi.org/.
    missing_information:
      - id: d4d:aireadi-v3-missing-info-modalities
        name: Modalities missing for some participants
        missing:
          - "Not all modalities are available for all participants."
        why_missing:
          - "Some participants elected not to participate in some study elements."
          - "In a few cases, the data collection device did not have any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost)."
          - "In a few cases, there may have been a data collision at some point in the process and data has been lost."

anomalies:
  - id: d4d:aireadi-v3-anomaly-modality-specific
    name: Expected sources of noise and error by modality
    anomaly_details:
      - "In cases of survey data, skipped questions or incomplete responses are expected."
      - "In cases of using wearables, improper use, technical failure such as battery failure or system malfunction are expected."
      - "In cases of imaging data, patient uncooperation, noise that may obscure the images and technical failure such as system malfunction, and data transfer failures are expected."
      - "Undilated handheld fundus photography quality varies from patient to patient and within the same patient because it becomes challenging to get a good view when patients are not dilated."
      - "Spectralis HRA imaging is operator-dependent and not fully automated, so quality issues may arise, which may lead to skipping this modality and missing data."
      - "FLIO is performed as the last modality of a visit because it takes longer than a usual Spectralis OCT and exposes patients to uncomfortable levels of light, so patients may not be at their best possible compliance."

known_biases:
  - id: d4d:aireadi-v3-bias-representation
    name: Racial and ethnic groups not represented in the cohort
    bias_type: representation_bias
    bias_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it does
      not include other races/ethnicities such as Pacific Islanders and Native Americans.
    mitigation_strategy: >-
      Three recording sites were strategically selected to achieve diverse recruitment: the
      University of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and
      the University of Washington (UW). The sites were chosen for geographic diversity across the
      United States and to ensure diverse representation across various racial and ethnic groups.
      Individuals from all demographic backgrounds were recruited at all 3 sites.
  - id: d4d:aireadi-v3-bias-selection
    name: Urban and hospital-based recruitment
    bias_type: selection_bias
    bias_description: >-
      Factors influencing the generalization of derived models include the predominantly urban and
      hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
      backgrounds. Recruitment pools were identified by screening Electronic Health Records (EHR)
      for diabetes and prediabetes ICD-10 codes for all patients who have had an encounter with the
      sites' health systems within the past 2 years.
    mitigation_strategy: >-
      The selection of study sites was intended to ensure equitable representation and minimize the
      potential for sampling bias.
  - id: d4d:aireadi-v3-bias-sampling-balance
    name: Enrollment-driven imbalance across demographic and severity strata
    bias_type: sampling_bias
    bias_description: >-
      While the AI-READI's cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters. As enrollment is ongoing, the periodic updates to data
      releases may not have achieved balanced distribution across groups.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects, irrespective of their
      race/ethnicity, biological sex, or diabetes severity, across all study sites. The project team
      also provides recommended data splits into 70%/15%/15% proportions in which the validation and
      test sets are balanced as well as possible for sex, race/ethnicity and diabetes status.

known_limitations:
  - id: d4d:aireadi-v3-limitation-representativeness
    name: Limited representativeness of the study cohort
    limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population. Recruitment
      was predominantly urban and hospital-based and may not fully capture diverse cultural and
      socioeconomic backgrounds, and races/ethnicities such as Pacific Islanders and Native
      Americans are not included.
    scope_impact: >-
      These factors might limit the generalization of models derived from the data.
  - id: d4d:aireadi-v3-limitation-modality-coverage
    name: Incomplete modality coverage across participants
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants, because some participants elected not
      to participate in some study elements, some devices returned no stored results or were
      returned too late, and in a few cases data were lost.
  - id: d4d:aireadi-v3-limitation-single-visit
    name: Single visit per participant
    limitation_type: scope_limitation
    limitation_description: >-
      There is currently only one visit per participant, and the database is cross-sectional.
      Approximately 4% of participants are expected to undergo a follow-up examination in Year 4 of
      the project.
  - id: d4d:aireadi-v3-limitation-english-only
    name: English-language eligibility requirement
    limitation_type: coverage_limitation
    limitation_description: >-
      Participants were required to speak and read English, and English language was used for
      communication with study participants.
  - id: d4d:aireadi-v3-limitation-no-external-audit
    name: No formal external audit
    limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has not undergone any formal external audits. However, the dataset has been
      reviewed internally by AI-READI team members for quality checks and to ensure that no
      personally identifiable information was accidentally included.

