id: https://doi.org/10.60775/fairhub.3
name: AI-READI
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights (AI-READI) is a
  dataset consisting of data collected from individuals with and without "Type 2 Diabetes Mellitus
  (T2DM)" and harmonized across 3 data collection sites. The composition of the dataset was designed
  with future studies using AI/Machine Learning in mind. This included recruitment sampling
  procedures aimed at achieving approximately equal distribution of participants across sex, race,
  and diabetes severity, as well as the design of a data acquisition protocol across multiple domains
  (survey data, physical measurements, clinical data, imaging data, wearable device data, etc.) to
  enable downstream AI/ML analyses that may not be feasible with existing data sources such as claims
  or electronic health records data. The goal is to better understand salutogenesis (the pathway from
  disease to health) in T2DM. Some data that are not considered to be sensitive personal health data
  will be available to the public for download upon agreement with a license that defines how the
  data can be used. The full dataset will be accessible by entering into a data use agreement. The
  public dataset will include survey data, blood and urine lab results, fitness activity levels,
  clinical measurements (e.g. monofilament and cognitive function testing), retinal images, ECG,
  blood sugar levels, and home air quality. The data held under controlled access include 5-digit zip
  code, sex, race, ethnicity, genetic sequencing data, past health records, and traffic and accident
  reports. Of note, the overall enrollment goal is to have balanced distribution between different
  racial groups. As enrollment is ongoing, the periodic updates to data releases may not have
  achieved balanced distribution across groups.
doi: 10.60775/fairhub.3
version: "3"
status: >-
  Version 3 was distributed in November 2025 and consists of data collected up through the end of the
  second year of the study. Enrollment is ongoing and further static versions are planned.
created_by: AI-READI Consortium
publisher: https://fairhub.io/
page: https://docs.aireadi.org
language: English
license: https://doi.org/10.5281/zenodo.17555036
citation: >-
  Use of the dataset requires citation to the resources specified in https://docs.aireadi.org.
conforms_to: >-
  Data were mapped to standardized terminologies when possible, including the Observational Medical
  Outcomes Partnership (OMOP) Common Data Model for observational health data and the Digital Imaging
  and Communications in Medicine (DICOM) standard for medical imaging data.
is_tabular: false

