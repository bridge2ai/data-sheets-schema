subsets:
  - id: d4d:AI_READI_v3_public_access_subset
    name: Public access subset
    description: >-
      Some data that are not considered to be sensitive personal health data will be available to the
      public for download upon agreement with a license that defines how the data can be used. The
      public dataset will include survey data, blood and urine lab results, fitness activity levels,
      clinical measurements (e.g. monofilament and cognitive function testing), retinal images, ECG,
      blood sugar levels, and home air quality. Sex, race, and ethnicity data are not released with
      the public version of the dataset.
    is_data_split: false
    is_subpopulation: false
  - id: d4d:AI_READI_v3_controlled_access_subset
    name: Controlled access subset
    description: >-
      The full dataset will be accessible by entering into a data use agreement. The data held under
      controlled access include 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past
      health records, and traffic and accident reports. There is a possibility that raw data may be
      included in future releases of the controlled access dataset.
    is_data_split: false
    is_subpopulation: false
  - id: d4d:AI_READI_v3_training_split
    name: Recommended training split
    description: >-
      Recommended training split comprising 70% of the 2280 participants in version 3 of the dataset.
    is_data_split: true
  - id: d4d:AI_READI_v3_validation_split
    name: Recommended validation split
    description: >-
      Recommended validation split comprising 15% of the 2280 participants in version 3 of the
      dataset, balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes,
      prediabetes/lifestyle controlled, oral medication controlled, and insulin controlled).
    is_data_split: true
  - id: d4d:AI_READI_v3_testing_split
    name: Recommended testing split
    description: >-
      Recommended testing split comprising 15% of the 2280 participants in version 3 of the dataset,
      balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes,
      prediabetes/lifestyle controlled, oral medication controlled, and insulin controlled).
    is_data_split: true

instances:
  - id: d4d:AI_READI_instance_participant
    name: Participant record
    instance_type: individual patient
    counts: 2280
    description: >-
      Each instance represents an individual patient, and consists of all of the data available for
      an individual participating in the study. Multiple modalities of data are collected for each
      participant, including survey data, clinical data, retinal imaging data, environmental sensor
      data, continuous glucose monitor data, and wearable activity monitor data. These encompass
      tabular data, imaging data, and physiological signal/waveform data. There is no unstructured
      text data included in this dataset. There are 2280 instances in this current version of the
      dataset (version 3, released fall 2025); the first version had 204 instances and the second
      version had 1067 instances.
    label: false
    label_description: N/A - no labels are provided.
    missing_information:
      - missing:
          - Not all modalities are available for all participants.
          - Snellen visual acuity variables were dropped in this version of the dataset, such that
            now only logMAR visual acuity measurements are available.
        why_missing:
          - Some participants elected not to participate in some study elements.
          - In a few cases, the data collection device did not have any stored results or was
            returned too late to retrieve the results (e.g. battery died, data was lost).
          - In a few cases, there may have been a data collision at some point in the process and
            data has been lost.
          - For operator-dependent imaging such as the Spectralis HRA, quality issues may arise which
            may lead to skipping this modality and missing data.

anomalies:
  - id: d4d:AI_READI_anomalies_noise_sources
    name: Expected errors, noise, and redundancies
    anomaly_details:
      - In cases of survey data, skipped questions or incomplete responses are expected.
      - In cases of using wearables, improper use, technical failure such as battery failure or
        system malfunction are expected.
      - In cases of imaging data, patient uncooperation, noise that may obscure the images and
        technical failure such as system malfunction, and data transfer failures are expected.
      - For undilated handheld fundus photography (Optomed Aurora), it becomes challenging to get a
        good view because patients are not dilated and because of the handheld nature of this imaging
        modality, so the quality of the images varies from patient to patient and within the same
        patient.
      - Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) takes longer than a usual Spectralis OCT
        and exposes patients to uncomfortable levels of light, so it is kept as the last modality of
        a visit; because of this patients may not be at their best possible compliance.

known_biases:
  - id: d4d:AI_READI_bias_representation
    name: Incomplete representation of racial and ethnic groups
    bias_type: representation_bias
    bias_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it does
      not include other races/ethnicities such as Pacific Islanders and Native Americans.
    mitigation_strategy: >-
      Three recording sites were strategically selected to achieve diverse recruitment: the
      University of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and
      the University of Washington (UW). The sites were chosen for geographic diversity across the
      United States and to ensure diverse representation across various racial and ethnic groups.
      Individuals from all demographic backgrounds were recruited at all 3 sites.
  - id: d4d:AI_READI_bias_selection_recruitment
    name: Urban, hospital-based recruitment
    bias_type: selection_bias
    bias_description: >-
      Factors influencing the generalization of derived models include the predominantly urban and
      hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
      backgrounds. Recruitment pools were identified by screening Electronic Health Records (EHR) for
      diabetes and prediabetes ICD-10 codes for all patients who have had an encounter with the
      sites' health systems within the past 2 years.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects, irrespective of their
      race/ethnicity, biological sex, or diabetes severity, across all study sites. The selection of
      study sites was intended to ensure equitable representation and minimize the potential for
      sampling bias.
  - id: d4d:AI_READI_bias_sampling_balance
    name: Balance across sex, race and diabetes severity not yet achieved
    bias_type: sampling_bias
    bias_description: >-
      While the AI-READI cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters. As enrollment is ongoing, the periodic updates to data
      releases may not have achieved balanced distribution across groups.
    mitigation_strategy: >-
      Recruitment sampling procedures aim at achieving approximately equal distribution of
      participants across sex, race, and diabetes severity. The project team also suggests a
      training/validation/testing split that is aimed at reducing disparities in models developed
      using this dataset.
    affected_subsets:
      - Racial and ethnic groups
      - Biological sex groups
      - Diabetes presence and severity groups

known_limitations:
  - id: d4d:AI_READI_limitation_modality_coverage
    name: Incomplete modality coverage per participant
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements, some data collection devices had no stored results or were
      returned too late, and in a few cases data was lost through a data collision.
    recommended_mitigation: >-
      Details for each data domain and its expected completeness are available in the dataset
      documentation at https://docs.aireadi.org.
  - id: d4d:AI_READI_limitation_representativeness
    name: Limited representativeness of the study cohort
    limitation_type: representativeness_limitation
    limitation_description: >-
      Recruitment was predominantly urban and hospital-based and may not fully capture diverse
      cultural and socioeconomic backgrounds, and the cohort does not include other races/ethnicities
      such as Pacific Islanders and Native Americans.
    scope_impact: >-
      These factors might limit the generalization of models derived from the dataset.
  - id: d4d:AI_READI_limitation_cross_sectional
    name: Single-visit, cross-sectional design
    limitation_type: temporal_limitation
    limitation_description: >-
      There is currently only one visit per participant, and the dataset is described as a
      cross-sectional database. Approximately 4% of participants are expected to undergo a follow-up
      examination in Year 4.
  - id: d4d:AI_READI_limitation_no_labels
    name: No labels or targets provided
    limitation_type: scope_limitation
    limitation_description: >-
      There is no explicit label or target associated with each data instance, and no labeling was
      performed, as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple
      potential downstream AI/ML applications. There are no formal guidelines in place for future
      researchers creating new labels or defining new tasks.

