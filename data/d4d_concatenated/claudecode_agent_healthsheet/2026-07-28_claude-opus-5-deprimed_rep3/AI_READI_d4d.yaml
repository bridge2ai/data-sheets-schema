  - id: d4d:AI_READI_sensitive_elements
    name: Sensitive data assessment
    sensitive_elements_present: true
    sensitivity_details:
      - The public dataset will not contain data that is considered sensitive.
      - The controlled access dataset will contain data regarding racial and ethnic origins, location
        (5-digit zip code), as well as motor vehicle accident reports.
      - Data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
        sequencing data, past health records, and traffic and accident reports.

relationships:
  - id: d4d:AI_READI_instance_relationships
    name: Relationships between instances
    relationship_details:
      - All instances are part of the same prospective data generation project (AI-READI).
      - There is currently only one visit per participant.

splits:
  - id: d4d:AI_READI_v3_recommended_splits
    name: Recommended data splits for version 3
    split_details:
      - The current version of the dataset comes with recommended data splits.
      - Because sex, race, and ethnicity data are not being released with the public version of the
        dataset, the project team has prepared data splits into proportions (70%/15%/15%) that can be
        used for subsequent training/validation/testing where the validation and test sets are
        balanced as well as possible for sex, race/ethnicity and diabetes status (no diabetes,
        prediabetes/lifestyle controlled, oral medication controlled, and insulin controlled).
      - This version includes a new recommended data split for the 2280 participants balancing
        training, validation, and testing sets for age, sex, races/ethnicities, and study group.

acquisition_methods:
  - id: d4d:AI_READI_acquisition
    name: Instance acquisition
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details:
      - The acquisition of data varied based on the domain; some data were directly observable (such
        as labs, vitals, and retinal imaging), whereas other data were reported by subjects (e.g.
        survey responses).
      - Verification of data entry was performed when possible (e.g. cross-referencing entered
        medications with medications that were physically brought in or photographed by each study
        participant).
      - Details for each data domain are available in https://docs.aireadi.org.
      - The dataset relates to people. The data were collected in the USA, directly from participants
        across the three recruiting sites.

collection_mechanisms:
  - id: d4d:AI_READI_mechanism_redcap
    name: REDCap surveys, forms, and data entry
    mechanism_details:
      - The exact forms used for data collection in REDCap are available at
        https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
      - Participants may access e-consent documentation in REDCap.
      - Clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in
        reports viewed by clinical research coordinators (CRCs) and Data Managers.
  - id: d4d:AI_READI_mechanism_device_documentation
    name: Device documentation and multi-device design
    mechanism_details:
      - Information on device make and model, including specific modalities like macula scans or wide
        scans during OCT, were documented to ensure repeatability.
      - The study included multiple devices for one measure to enhance generalizability and represent
        the diverse range of equipment utilized in clinical settings.
      - Uniform data collection protocols were implemented for all subjects, irrespective of their
        race/ethnicity, biological sex, or diabetes severity, across all study sites.
      - All modalities, file formats, and devices are detailed in the dataset documentation at
        https://docs.aireadi.org, as are the procedures for data collection and processing.
  - id: d4d:AI_READI_mechanism_environmental_sensor
    name: Environmental sensor device (LeeLab Anura)
    description: >-
      Participants will be sent home with an environmental sensor (a custom-designed sensor unit
      called the LeeLab Anura), which they will use for 10 continuous days before returning the
      devices to the clinical research coordinators for data download.
  - id: d4d:AI_READI_mechanism_cgm
    name: Continuous glucose monitor (Dexcom G6)
    description: >-
      The Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM) that
      directly monitors blood glucose levels without requiring finger sticks. It must be worn
      continuously in order to collect data.
  - id: d4d:AI_READI_mechanism_accelerometer
    name: Wearable accelerometer / physical activity monitor (Garmin Vivosmart 5)
    description: >-
      The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure data related to
      physical activity.
  - id: d4d:AI_READI_mechanism_heart_rate
    name: Heart rate measurement
    description: Heart rate can be read from EKG or blood pressure measurement devices.
  - id: d4d:AI_READI_mechanism_blood_pressure
    name: Blood pressure devices
    description: >-
      Blood pressure devices used for the study across the various data acquisition sites are: OMRON
      HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor, and
      Welch Allyn 6000 series Vital signs monitor with Welch Allyn FlexiPort Reusable Blood Pressure
      Cuff.
  - id: d4d:AI_READI_mechanism_visual_acuity
    name: Visual acuity (M&S Technologies EVA)
    description: >-
      M&S Technologies EVA device to test visual acuity. The test is administered at a distance of 4
      meters from a touch-screen monitor that is 12x20 inches. Participants will read letters from
      the screen. Photopic Conditions: No neutral density filters are used. A general occluder will
      be used for photopic testing. The participant wears their own prescription spectacles or trial
      frames. For Mesopic conditions, a neutral density (ND) filter will be used. The ND filter will
      either be a lens added to trial frames to reduce incoming light on the tested eye, OR a
      handheld occluder with a neutral density filter (which we will designate as "ND-occluder") over
      the glasses will be used. The ND-occluder is different from a standard occluder and is used
      only for vision testing under mesopic conditions.
  - id: d4d:AI_READI_mechanism_contrast_sensitivity
    name: Contrast sensitivity (MARS Letter Contrast Sensitivity test, Perceptrix)
    description: >-
      The MARS Letter Contrast Sensitivity test (Perceptrix) was conducted monocularly under both
      Photopic conditions (with a general occluder) and Mesopic conditions (using a Neutral Density
      occluder with a low luminance filter lens). The standardized order of MARS cards was as
      follows: Photopic OD, Photopic OS, Mesopic OD, and Mesopic OS. The background luminance of the
      charts fell within the range of 60 to 120 cd/m2, with an optimal level of 85 cd/m2. Illuminance
      was recommended to be between 189 to 377 lux, with an optimal level of 267 lux. While the
      designed viewing distance was 50 cm, it could vary between 40 to 59 cm. Patients were required
      to wear their appropriate near correction: reading glasses or trial frames with +2.00D lenses.
      All testing was carried out under undilated conditions. Patients were instructed to read the
      letter left to right across each line on the chart. Patients were encouraged to guess, even if
      they perceived the letters as too faint. Testing was terminated either when the patient made
      two consecutive errors or reached the end of the chart.
  - id: d4d:AI_READI_mechanism_autorefraction
    name: Autorefraction (KR 800 Auto Keratometer/Refractor)
    description: KR 800 Auto Keratometer/Refractor.
  - id: d4d:AI_READI_mechanism_ekg
    name: EKG (Philips Pagewriter TC30 Cardiograph)
    description: Philips (manufacturer of Pagewriter TC30 Cardiograph).
  - id: d4d:AI_READI_mechanism_lensometer
    name: Lensometer
    description: >-
      Lensometer devices used at data acquisition sites across the study include: NIDEK LM-600P Auto
      Lensometer, Topcon-CL-200 computerized Lensometer, and Topcon-CL-300 computerized Lensometer.
  - id: d4d:AI_READI_mechanism_optomed_aurora
    name: Undilated fundus photography (Optomed Aurora IQ)
    description: >-
      The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the
      ocular fundus. It has a 50 degree field of view, 5 Mpix sensor, and high-contrast optical
      design. The camera is non-mydriatic, meaning it doesn't require the pupil to be dilated, so it
      can be used for detailed viewing of the retina. Images taken during the AI-READI visit are
      undilated images taken in a dark room while a patient is sitting on a comfortable chair, laying
      back.
  - id: d4d:AI_READI_mechanism_eidon
    name: Dilated fundus photography (iCare EIDON)
    description: >-
      The iCare EIDON is a widefield TrueColor confocal fundus imaging system that can capture images
      up to 200 degrees. It comes with multiple imaging modalities, including TrueColor, blue, red,
      Red-Free, and infrared confocal images. The system offers widefield, ultra-high-resolution
      imaging and the capability to image through cataract and media opacities. It operates without
      dilation (minimum pupil 2.5 mm) and provides the flexibility of both fully automated and fully
      manual modes. Additionally, the iCare EIDON features an all-in-one compact design, eliminating
      the need for an additional PC. AI-READI images using EIDON include two main modalities: 1.
      Single Field Central IR/FAF 2. Smart Horizontal Mosaic. Imaging is done in fully automated mode
      in a dark room with the machine moving and positioning according to the patient's head aiming
      at optimizing the view and minimizing operator's involvement/operator induced noise.
  - id: d4d:AI_READI_mechanism_spectralis
    name: Spectralis HRA+OCT (Heidelberg Engineering)
    description: >-
      The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that combines optical
      coherence tomography (OCT) with retinal angiography. It is a modular, upgradable platform that
      allows clinicians to configure it for their specific diagnostic workflow. It has the confocal
      scanning laser ophthalmoscope (cSLO) technology that not only offers documentation of clinical
      findings but also often highlights critical diagnostic details that are not visible on
      traditional clinical ophthalmoscopy. Since cSLO imaging minimizes the effects of light scatter,
      it can be used effectively even in patients with cataracts. For AI-READI subjects, imaging is
      done in a dark room using the following modalities: ONH-RC, PPole-H, and OCTA of the macula.
  - id: d4d:AI_READI_mechanism_triton
    name: Triton DRI OCT (Topcon Healthcare)
    description: >-
      The DRI OCT Triton is a device from Topcon Healthcare that combines swept-source OCT technology
      with multimodal fundus imaging. The DRI OCT Triton uses swept-source technology to visualize
      the deepest layers of the eye, including through cataracts. It also enhances visualization of
      outer retinal structures and deep pathologies. The DRI OCT Triton has a 1,050 nm wavelength
      light source and a non-mydriatic color fundus camera. AI-READI imaging is done in a dark room
      with minimal intervention from the imager as the machine positioning is done automatically.
      Imaging is done in 12.0X12.0 mm and 6.0X6.0 mm OCTA, and 12.0 mm X9.0 mmX6.0 mm 3D Horizontal
      and Radial scan modes.
  - id: d4d:AI_READI_mechanism_maestro2
    name: Maestro2 3D OCT (Topcon Healthcare)
    description: >-
      The Maestro2 is a robotic OCT and color fundus camera system from Topcon Healthcare. It can
      capture a 12 mm x 9 mm wide-field OCT scan that includes the macula and optic disc. The
      Maestro2 can also capture high-resolution non-mydriatic, true color fundus photography, OCT,
      and OCTA with a single button press. Imaging is done in a dark room and automatically with
      minimal involvement of the operator. Protocols include 12.0 mm X9.0 mm widefield, 6.0 mm X 6.0
      mm 3D macula scan and 6.0 mm X 6.0 mm OCTA (scan rate: 50 kHz).
  - id: d4d:AI_READI_mechanism_flio
    name: Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO, Heidelberg Engineering)
    description: >-
      Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) is an advanced imaging technique used in
      ophthalmology. It is a non-invasive method that provides valuable information about the
      metabolic and functional status of the retina. FLIO is based on the measurement of fluorescence
      lifetimes, which is the duration a fluorophore remains in its excited state before emitting a
      photon and returning to the ground state. Different retinal structures and molecules exhibit
      distinct fluorescence lifetimes, allowing for the visualization of metabolic changes, cellular
      activity, and the identification of specific biomolecules. The imaging is done by an operator
      in a dark room analogous to a straightforward Heidelberg Spectralis OCT.
  - id: d4d:AI_READI_mechanism_cirrus
    name: Cirrus 5000 Angioplex (Carl Zeiss Meditec)
    description: >-
      The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence tomography (OCT) system
      that offers non-invasive imaging of retinal microvasculature. The imaging is done in a dark
      room by an operator. Imaging protocols include 512 X 512 and 200 X 200 macula and ONH scans and
      also OCTA of the macula. Zeiss Cirrus 5000 also provides a 60-degree OCTA widefield view. 8x8mm
      single scans and 14x14mm automated OCTA montage allow for rapid peripheral assessment of the
      retina as well.
  - id: d4d:AI_READI_mechanism_monofilament
    name: Monofilament testing for peripheral neuropathy
    description: >-
      Monofilament test is a standard clinical test to monitor peripheral neuropathy in diabetic
      patients. It is done using a standard 10g monofilament applying pressure to different points on
      the plantar surface of the feet. If patients sense the monofilament, they confirm by saying
      "yes"; if patients do not sense the monofilament after it bends, they are considered to be
      insensate. When the sequence is completed, the insensate area is retested for confirmation.
      This sequence is further repeated randomly at each of the testing sites on each foot until
      results are obtained. The results are recorded on an iPad, Laptop, or a paper questionnaire and
      are directly added to the project's REDCap by the clinical research staff.
  - id: d4d:AI_READI_mechanism_moca
    name: Montreal Cognitive Assessment (MoCA)
    description: >-
      The Montreal Cognitive Assessment (MoCA) is a simple, in-office screening tool that helps
      detect mild cognitive impairment and early onset of dementia. The MoCA evaluates cognitive
      domains such as: Memory, Executive functioning, Attention, Language, Visuospatial, Orientation,
      Visuoconstructional skills, Conceptual thinking, Calculations. AI-READI research staff perform
      this test on an iPad using a pre-installed software (MoCA Duo app downloaded from the app
      store) that captures all the patients responses in an interactive manner.
    mechanism_details:
      - Some disadvantages of the MoCA include that professionals require training to score the test,
        a person's level of education may affect the test, socioeconomic factors may affect the test,
        and people living with depression or other mental health issues may score similarly to those
        with mild dementia.

sampling_strategies:
  - id: d4d:AI_READI_sampling
    name: Cohort sampling and recruitment strategy
    is_sample: false
    is_representative: false
    source_data:
      - Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes
        and prediabetes ICD-10 codes for all patients who have had an encounter with the sites'
        health systems within the past 2 years.
    why_not_representative:
      - The study cohort may not provide a comprehensive representation of the population, as it does
        not include other races/ethnicities such as Pacific Islanders and Native Americans.
      - Recruitment was predominantly urban and hospital-based, which may not fully capture diverse
        cultural and socioeconomic backgrounds.
      - While the database ultimately aims to achieve balance across race/ethnicity, biological sex,
        and diabetes presence and severity, the pilot study is not balanced across these parameters.
    strategies:
      - Recruitment sampling procedures aimed at achieving approximately equal distribution of
        participants across sex, race, and diabetes severity.
      - >-
        Three recording sites were strategically selected to achieve diverse recruitment: the
        University of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and
        the University of Washington (UW). The sites were chosen for geographic diversity across the
        United States and to ensure diverse representation across various racial and ethnic groups.
      - Individuals from all demographic backgrounds were recruited at all 3 sites.
    description: >-
      The dataset contains all possible instances rather than a sample; it contains data from all
      participants enrolled during the data collection period covered by this version. No sampling
      strategy question response was provided for the preliminary or current dataset version
      ("N/A").

data_collectors:
  - id: d4d:AI_READI_collectors_project_team
    name: AI-READI project team
    role: Data collection and data management team
    collector_details:
      - Details about the AI-READI team members involved in the data collection process are available
        at https://aireadi.org/team.
      - Their effort was supported by the National Institutes of Health award OT2OD032644 based on
        the percentage of effort contributed, and salaries which aligned with the funding guidelines
        at each site.
      - Clinical research coordinators (CRCs) and Data Managers examined participant records flagged
        in REDCap and determined if an error was likely.
      - Monofilament results are recorded on an iPad, Laptop, or a paper questionnaire and are
        directly added to the project's REDCap by the clinical research staff.
  - id: d4d:AI_READI_site_uab
    name: University of Alabama at Birmingham (UAB)
    role: Data acquisition and recruiting site
  - id: d4d:AI_READI_site_ucsd
    name: University of California San Diego (UCSD)
    role: Data acquisition and recruiting site
  - id: d4d:AI_READI_site_uw
    name: University of Washington (UW)
    role: Data acquisition and recruiting site; principal project site

collection_timeframes:
  - id: d4d:AI_READI_v3_collection_timeframe
    name: Version 3 data collection timeframe
    start_date: "2023-07-19"
    end_date: "2025-05-01"
    timeframe_details:
      - For this version of the dataset, the timeframe for data collection was July 19, 2023 to May
        01, 2025.
      - This version of the dataset consists of data collected up through the end of the second year
        of the study.
      - The timeline for the overall project spans four years, encompassing one year dedicated to
        protocol development and training, and years 2-4 allocated for subject recruitment and data
        collection.
      - Approximately 4% of participants are expected to undergo a follow-up examination in Year 4.
      - The timeframe also allows for the collection of the highest number of subjects possible to
        ensure a balanced representation of racial and ethnic groups and mitigate biases in computer
        vision algorithms.

direct_collection:
  - id: d4d:AI_READI_direct_collection
    name: Direct collection from participants
    is_direct: true
    collection_details:
      - The data was collected directly from participants across the three recruiting sites.
      - Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes
        and prediabetes ICD-10 codes for all patients who have had an encounter with the sites'
        health systems within the past 2 years.
      - The data relate to people, and were collected in the USA.

collection_notifications:
  - id: d4d:AI_READI_collection_notification
    name: Participant notification of data collection
    notification_details:
      - Each individual was aware of the data collection, as this was not passive data collection or
        secondary use of existing data, but rather active data collection directly from participants.

collection_consents:
  - id: d4d:AI_READI_collection_consent
    name: Participant consent to collection and use
    consent_details:
      - Informed consent to participate was required before participation in any part of the protocol
        (including questionnaires).
      - Potential participants were given the option to read all consent documentation electronically
        (e-consent) before their visit and give their consent with an electronic signature without
        verbal communication with a clinical research coordinator.
      - Participants may access e-consent documentation in REDCap and decide at that point they do
        not want to participate or would like additional information.
      - The approved consent form for the principal project site University of Washington is
        available at
        https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
      - The other clinical sites had IRB reliance and used the same consent form, with minor
        institution-specific language incorporated depending on individual institutional
        requirements.

consent_revocations:
  - id: d4d:AI_READI_consent_revocation
    name: Consent withdrawal mechanism
    revocation_details:
      - Participants were permitted to withdraw consent at any time and cease study participation.
      - Any data that had been shared or used up to that point would stay in the dataset.
      - This is clearly communicated in the consent document.

missing_data_documentation:
  - id: d4d:AI_READI_missing_data
    name: Missing data patterns and causes
    missing_data_patterns:
      - Not all modalities are available for all participants.
      - In cases of survey data, skipped questions or incomplete responses are expected.
    missing_data_causes:
      - Some participants elected not to participate in some study elements.
      - In a few cases, the data collection device did not have any stored results or was returned
        too late to retrieve the results (e.g. battery died, data was lost).
      - In a few cases, there may have been a data collision at some point in the process and data
        has been lost.
      - Improper use of wearables and technical failure such as battery failure or system malfunction.
      - Operator-dependent imaging quality issues may lead to skipping a modality.
    handling_strategy: >-
      During data cleaning, records were checked for missing data that could be directly filled from
      other portions of an individual's record. Editing was only done under the guidance and approval
      of the site PI. If corrected data was available from elsewhere in the respondent's answers, the
      error was corrected. If there was no logical or appropriate way to correct the data, the site
      PI reviewed the values and made decisions about whether those values should be removed from the
      data.

raw_data_sources:
  - id: d4d:AI_READI_raw_data_source
    name: Raw participant data prior to standardization
    source_description: >-
      Raw data collected directly from study participants at the three clinical data acquisition
      sites, retained in addition to the preprocessed and cleaned data.
    source_type:
      - survey data
      - clinical data
      - retinal imaging data
      - environmental sensor data
      - continuous glucose monitor data
      - wearable activity monitor data
    access_details: >-
      The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team right now,
      because it has not been mapped to standardized terminologies and because the raw data may
      accidentally include personal health information or personally identifiable information (e.g.
      in free text fields). There is a possibility that raw data may be included in future releases
      of the controlled access dataset.
    raw_data_format:
      - tabular data
      - imaging data
      - physiological signal/waveform data

ethical_reviews:
  - id: d4d:AI_READI_irb_uw
    name: University of Washington IRB approval (STUDY00016228)
    review_details:
      - The initial IRB approval at the University of Washington was received on December 20, 2022.
      - The initial approval letter can be found at
        https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf.
      - An annual renewal application to the IRB about the status and progress of the study is
        required and due within 90 days of expiration.
      - The other clinical sites had IRB reliance and used the same consent form, with minor
        institution-specific language incorporated depending on individual institutional
        requirements.

data_protection_impacts:
  - id: d4d:AI_READI_dpia
    name: Data protection impact analysis
    impact_details:
      - A data protection impact analysis has not been conducted.

human_subject_research:
  id: d4d:AI_READI_human_subject_research
  name: Human subject research status
  involves_human_subjects: true
  irb_approval:
    - Initial IRB approval at the University of Washington (STUDY00016228) was received on December
      20, 2022.
    - An annual renewal application to the IRB about the status and progress of the study is required
      and due within 90 days of expiration.
    - The other clinical sites had IRB reliance.
  ethics_review_board:
    - University of Washington Institutional Review Board
  special_populations:
    - Eligibility was restricted to adults 40 years of age or older who were able to provide consent;
      persons who are pregnant, who have gestational diabetes, or who have Type 1 diabetes were
      excluded.

informed_consent:
  - id: d4d:AI_READI_informed_consent
    name: Informed consent process
    consent_obtained: true
    consent_type:
      - Informed consent required before participation in any part of the protocol, including
        questionnaires.
      - Electronic consent (e-consent) with electronic signature, accessible in REDCap before the
        study visit.
    consent_documentation:
      - The approved consent form for the principal project site University of Washington is
        available at
        https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
      - The other clinical sites had IRB reliance and used the same consent form, with minor
        institution-specific language incorporated depending on individual institutional
        requirements.
    withdrawal_mechanism:
      - Participants were permitted to withdraw consent at any time and cease study participation.
      - Any data that had been shared or used up to that point would stay in the dataset; this is
        clearly communicated in the consent document.
    consent_scope:
      - Consent covered collection and use of participant data for the AI-READI study protocol.

participant_privacy:
  - id: d4d:AI_READI_participant_privacy
    name: Participant privacy protections
    anonymization_method:
      - No personally identifiable information is included in the dataset.
      - The dataset has been reviewed internally by AI-READI team members for quality checks and to
        ensure that no personally identifiable information was accidentally included.
    reidentification_risk:
      - There is a theoretical risk of future re-identification.
    privacy_techniques:
      - Sensitive elements including 5-digit zip code, sex, race, ethnicity, genetic sequencing data,
        past health records, and traffic and accident reports are held under controlled access
        rather than released with the public dataset.
      - Access to the full dataset requires entering into a data use agreement.
      - Raw data is not shared outside the project team, in part because it may accidentally include
        personal health information or personally identifiable information in free text fields.

participant_compensation:
  - id: d4d:AI_READI_participant_compensation
    name: Participant compensation
    compensation_provided: true
    compensation_type:
      - Monetary compensation for the study visit
    compensation_amount:
      - $200 for the study visit
    compensation_rationale:
      - Study subjects received a compensation of $200 for the study visit through the grant funding
        (NIH award OT2OD032644).
    description: >-
      Accessibility measurements were not specifically assessed. However, transportation assistance
      (rideshare services) was offered to study participants who endorsed barriers to transporting
      themselves to study visits.

preprocessing_strategies:
  - id: d4d:AI_READI_preprocessing
    name: Central preprocessing and standardization
    preprocessing_details:
      - Once data were sent from each of the study sites to the central project team, additional
        processing steps were conducted in preparation for dissemination.
      - All data were mapped to standardized terminologies when possible, such as the Observational
        Medical Outcomes Partnership (OMOP) Common Data Model, a common data model for observational
        health data, and the Digital Imaging and Communications in Medicine (DICOM), a commonly used
        standard for medical imaging data.
      - Details about the data processing approaches for each data domain/modality are described in
        the dataset documentation at https://docs.aireadi.org.
      - No data were excluded from the dataset at the time of preprocessing.

cleaning_strategies:
  - id: d4d:AI_READI_cleaning
    name: Quality control and data cleaning at acquisition
    cleaning_details:
      - The dataset has not undergone any formal external audits. However, the dataset has been
        reviewed internally by AI-READI team members for quality checks and to ensure that no
        personally identifiable information was accidentally included.
      - There were several quality control measures used at the time of data entry/acquisition.
      - Clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in
        reports viewed by clinical research coordinators (CRCs) and Data Managers.
      - Using these REDCap reports as guides, Data Managers and CRCs examined participant records and
        determined if an error was likely.
      - Data were checked for credibility, based on range checks to determine if all responses fall
        within a prespecified reasonable range.
      - Data were checked for incorrect flow through prescribed skip patterns.
      - Data were checked for missing data that can be directly filled from other portions of an
        individual's record.
      - Data were checked for the omission and/or duplication of records.
      - Editing was only done under the guidance and approval of the site PI. If corrected data was
        available from elsewhere in the respondent's answers, the error was corrected. If there was
        no logical or appropriate way to correct the data, the site PI reviewed the values and made
        decisions about whether those values should be removed from the data.

labeling_strategies:
  - id: d4d:AI_READI_labeling
    name: Labeling strategy (none applied)
    labeling_details:
      - N/A - no labels are provided. There is no explicit label or target associated with each data
        instance, for either the preliminary dataset or the current version.
      - No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic
        dataset aimed at facilitating multiple potential downstream AI/ML applications.
      - No software used to preprocess, clean, or label the instances is provided, as no labeling was
        performed.
      - There are no formal guidelines in place that future researchers are recommended to follow
        when creating new labels or defining new tasks.

raw_sources:
  - id: d4d:AI_READI_raw_data_retention
    name: Retained raw data
    raw_data_details:
      - The raw data (post de-identification) is saved in addition to the preprocessed/cleaned data.
      - The raw data is expected to be preserved by the AI-READI project at least for the duration of
        the project.
      - It is not anticipated to be shared outside the project team right now, because it has not
        been mapped to standardized terminologies and because it may accidentally include personal
        health information or personally identifiable information (e.g. in free text fields).
      - There is a possibility that raw data may be included in future releases of the controlled
        access dataset.

existing_uses:
  - id: d4d:AI_READI_existing_uses
    name: Existing uses of the dataset
    description: The dataset has not been used for any tasks already.

use_repository:
  - id: d4d:AI_READI_use_repository
    name: Repository of works using the dataset
    description: >-
      There is no repository that links to any or all papers or systems that use the dataset, besides
      general literature search services.

other_tasks:
  - id: d4d:AI_READI_other_tasks
    name: Other tasks and widespread versions
    task_details:
      - No formal guidelines are in place that future researchers are recommended to follow when
        creating new labels or defining new tasks.
      - The dataset creators are not aware of any widespread versions or subversions of the dataset
        addressing a particular task or application.
      - Human level performances in the applications the dataset is supposed to address are not
        available (N/A).

future_use_impacts:
  - id: d4d:AI_READI_future_use_impacts
    name: Composition and collection factors affecting future uses
    impact_details:
      - To the extent of the dataset creators' knowledge, no uses of the dataset are currently
        anticipated that could result in unfair treatment or harm.
      - There is a theoretical risk of future re-identification.
      - Because sex, race, and ethnicity data are not being released with the public version of the
        dataset, the project team has prepared recommended data splits so that validation and test
        sets are balanced as well as possible for sex, race/ethnicity and diabetes status.
      - As enrollment is ongoing, periodic updates to data releases may not have achieved balanced
        distribution across racial groups.
      - Not all modalities are available for all participants, and Snellen visual acuity variables
        were dropped in this version such that only logMAR visual acuity measurements are available.

discouraged_uses:
  - id: d4d:AI_READI_discouraged_uses
    name: Discouraged uses under the dataset license
    discouragement_details:
      - The AI-READI dataset License imposes certain restrictions on the usage of the data. The
        restrictions are described in the License files available at
        https://doi.org/10.5281/zenodo.17555036.

intended_uses:
  - id: d4d:AI_READI_intended_uses
    name: Intended uses
    use_category:
      - research
    examples:
      - Artificial intelligence and machine learning research providing insights into type 2 diabetes
        mellitus, including salutogenic pathways to return to health.
      - Downstream pseudotime manifold analysis, an approach used to predict disease trajectories.
    usage_notes: >-
      Use of the dataset requires citation to the resources specified in https://docs.aireadi.org.

prohibited_uses:
  - id: d4d:AI_READI_prohibited_uses
    name: Uses excluded by the dataset license
    prohibition_reason:
      - Tasks for which the dataset should not be used are governed by the license terms. The license
        (https://doi.org/10.5281/zenodo.17555036) places strong requirements around data usage,
        security, and secondary sharing to protect study participants, especially when data is
        reused for artificial intelligence (AI) and machine learning (ML) related applications.

distribution_formats:
  - id: d4d:AI_READI_distribution_fairhub
    name: FAIRhub platform distribution
    description: >-
      The dataset will be available through the FAIRhub platform. The dataset's DOI is
      https://doi.org/10.60775/fairhub.3. The dataset will be distributed and be available for public
      use.
    access_urls:
      - http://fairhub.io/
      - https://doi.org/10.60775/fairhub.3
  - id: d4d:AI_READI_distribution_public_tier
    name: Public download tier
    description: >-
      Some data that are not considered to be sensitive personal health data will be available to the
      public for download upon agreement with a license that defines how the data can be used. The
      public dataset will include survey data, blood and urine lab results, fitness activity levels,
      clinical measurements (e.g. monofilament and cognitive function testing), retinal images, ECG,
      blood sugar levels, and home air quality.
  - id: d4d:AI_READI_distribution_controlled_tier
    name: Controlled access tier
    description: >-
      The full dataset will be accessible by entering into a data use agreement. The data held under
      controlled access include 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past
      health records, and traffic and accident reports.

distribution_dates:
  - id: d4d:AI_READI_distribution_dates
    name: Version release dates
    description: >-
      The first version of the dataset was distributed in May 2024, the second version of the dataset
      was distributed in November 2024, and the third version of the dataset was distributed in
      November 2025.
    release_dates:
      - May 2024 (version 1)
      - November 2024 (version 2)
      - November 2025 (version 3)

third_party_sharing:
  - id: d4d:AI_READI_third_party_sharing
    name: Distribution to third parties
    is_shared: true
    description: The dataset will be distributed and be available for public use.

license_and_use_terms:
  id: d4d:AI_READI_license_terms
  name: AI-READI dataset license and terms of use
  description: >-
    The license file containing the terms for reusing the AI-READI dataset is available at
    https://doi.org/10.5281/zenodo.17555036.
  license_terms:
    - These license terms were specifically tailored to enable reuse of the AI-READI dataset (and
      other clinical datasets) for commercial or research purpose while putting strong requirements
      around data usage, security, and secondary sharing to protect study participants, especially
      when data is reused for artificial intelligence (AI) and machine learning (ML) related
      applications.
    - Public data are available for download upon agreement with a license that defines how the data
      can be used.
    - The full dataset is accessible by entering into a data use agreement.
    - Use of the dataset requires citation to the resources specified in https://docs.aireadi.org.
    - The dataset documentation is shared under the CC-BY 4.0 license.

ip_restrictions:
  id: d4d:AI_READI_ip_restrictions
