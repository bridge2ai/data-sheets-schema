updates:
  id: d4d:AI_READI_update_plan
  name: Update and versioning plan
  frequency: Approximately once a year
  update_details:
    - The dataset will not be updated. Rather, new versions of the dataset will be released with
      additional instances as more study participants complete the study visit.
    - There are plans to release new versions of the dataset approximately once a year with
      additional data from participants who have been enrolled since the last dataset version
      release.
    - Enrollment is ongoing, and future versions of the dataset will be released that will include
      larger numbers of subjects/patients as enrollment increases.

retention_limit:
  id: d4d:AI_READI_retention_limits
  name: Data retention limits
  retention_period: No limits on retention
  retention_details:
    - There are no limits on the retention of the data associated with the instances.
    - The raw data is expected to be preserved by the AI-READI project at least for the duration of
      the project.

version_access:
  id: d4d:AI_READI_version_access
  name: Version availability
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
    - Version 1 - pilot data collection phase, 204 participants, distributed May 2024
    - Version 2 - through the end of the first full year of the study, 1067 participants total,
      distributed November 2024
    - Version 3 - through the end of the second year of the study, 2280 participants, distributed
      November 2025
  version_details:
    - The dataset gets released as static versions.
    - This datasheet is created for the third version of the dataset.
    - A previous datasheet was created for the first version of the dataset, available at
      https://docs.aireadi.org/docs/1/dataset/healthsheet.
    - A previous datasheet was created for the second version of the dataset, available at
      https://docs.aireadi.org/docs/2/dataset/healthsheet.
    - The current version includes data from the second year of the study, rather than only the data
      collected from the pilot data collection phase (version 1) and the first year of the study
      (version 2), and has more subjects/patients represented in the data.
    - The data fields/types are largely the same as the prior version of the dataset. However, the
      Snellen visual acuity variables were dropped in this version of the dataset, such that now only
      logMAR visual acuity measurements are available.

extension_mechanism:
  id: d4d:AI_READI_extension_mechanism
  name: Mechanism for external contributions
  extension_details:
    - There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
      those who are involved in the project.

variables:
  - id: d4d:AI_READI_variable_logmar_va
    variable_name: logMAR visual acuity
    name: logMAR visual acuity
    data_type: float
    measurement_technique: >-
      M&S Technologies EVA device, administered at a distance of 4 meters from a touch-screen monitor
      that is 12x20 inches, under photopic conditions (no neutral density filters, general occluder)
      and mesopic conditions (neutral density filter).
    quality_notes:
      - Snellen visual acuity variables were dropped in version 3 of the dataset, such that now only
        logMAR visual acuity measurements are available.
  - id: d4d:AI_READI_variable_log_cs
    variable_name: log contrast sensitivity (log CS)
    name: Log contrast sensitivity
    data_type: float
    measurement_technique: >-
      MARS Letter Contrast Sensitivity test (Perceptrix), conducted monocularly under photopic
      conditions (general occluder) and mesopic conditions (neutral density occluder with a low
      luminance filter lens), in the standardized card order Photopic OD, Photopic OS, Mesopic OD,
      Mesopic OS.
    derivation: >-
      The log contrast sensitivity (log CS) values were recorded by multiplying the number of errors
      prior to the final correct letter by 0.04 and subtracting the result from the log CS value at
      the final correct letter. If a patient reached the end of the chart without making two
      consecutive errors, the final correct letter was simply the last one correctly identified.
  - id: d4d:AI_READI_variable_moca_total
    variable_name: MoCA total score
    name: Montreal Cognitive Assessment total score
    data_type: integer
    maximum_value: 30.0
    description: >-
      The MoCA generates a total score and six domain-specific index scores. The maximum score is 30,
      and anything below 24 is a sign of cognitive impairment. A final total score of 26 and above is
      considered normal.
    measurement_technique: >-
      Montreal Cognitive Assessment administered by AI-READI research staff on an iPad using the MoCA
      Duo app.
    quality_notes:
      - Professionals require training to score the test.
      - A person's level of education may affect the test, and socioeconomic factors may affect the
        test.
      - People living with depression or other mental health issues may score similarly to those with
        mild dementia.

is_deidentified:
  id: d4d:AI_READI_deidentification
  name: De-identification status
  identifiable_elements_present: false
  deidentification_details:
    - No personally identifiable information is included in the dataset.
    - The dataset has been reviewed internally by AI-READI team members for quality checks and to
      ensure that no personally identifiable information was accidentally included.
    - The raw data is not shared outside the project team in part because it may accidentally include
      personal health information or personally identifiable information (e.g. in free text fields).
    - The source healthsheet did not provide a response describing pre-processing performed for
      de-identification, nor measures taken to avoid re-identification of individuals.

