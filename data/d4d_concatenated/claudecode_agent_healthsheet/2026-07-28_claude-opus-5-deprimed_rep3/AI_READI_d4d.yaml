purposes:
  - id: d4d:AI_READI_purpose_ai_ready_t2dm_data
    name: Enable AI/ML research into type 2 diabetes and salutogenesis
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type 2
      diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM is a growing
      public health threat. Yet, the current understanding of T2DM, especially in the context of
      salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may help with
      improving our understanding but a key issue is the lack of data ready for training AI models.
      The AI-READI dataset is intended to fill this gap.
  - id: d4d:AI_READI_purpose_applications
    name: Applications the dataset is meant to address
    response: >-
      The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
      manifolds and various applications in artificial intelligence.

tasks:
  - id: d4d:AI_READI_task_pseudotime_manifold
    name: Pseudotime manifold analysis
    response: >-
      The data collection process is specifically tailored to enable downstream pseudotime manifold
      analysis - an approach used to predict disease trajectories. This involves gathering and
      learning from complex, multimodal data from participants exhibiting varying disease severity,
      ranging from normal to insulin-dependent Type 2 Diabetes Mellitus (T2DM).
  - id: d4d:AI_READI_task_no_predefined_task
    name: No predefined prediction task or labels
    response: >-
      N/A - no labels are provided. No specific labeling was performed in the dataset, as the dataset
      is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
      applications. This datasheet does not include new tasks or labeling. It does include a new
      recommended data split for the 2280 participants balancing training, validation, and testing
      sets for age, sex, races/ethnicities, and study group.

addressing_gaps:
  - id: d4d:AI_READI_gap_ai_ready_data
    name: Lack of AI-ready data for type 2 diabetes
    response: >-
      T2DM is a growing public health threat. Yet, the current understanding of T2DM, especially in
      the context of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may
      help with improving our understanding but a key issue is the lack of data ready for training AI
      models. The AI-READI dataset is intended to fill this gap. The acquisition protocol spans
      multiple domains to enable downstream AI/ML analyses that may not be feasible with existing
      data sources such as claims or electronic health records data.

creators:
  - id: d4d:AI_READI_consortium
    name: AI-READI Consortium
    description: >-
      This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI
      Consortium. Details about each member and their institutions are available on the project
      website at https://aireadi.org. There is a wide range of experience within the project team,
