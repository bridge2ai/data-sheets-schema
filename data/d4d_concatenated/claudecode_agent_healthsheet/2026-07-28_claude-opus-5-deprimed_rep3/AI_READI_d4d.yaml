subpopulations:
  - id: d4d:AI_READI_subpopulations
    name: Demographic sub-population identification
    subpopulation_elements_present: false
    identification:
      - The dataset does not identify demographic sub-populations.
      - Sex, race, and ethnicity data are not being released with the public version of the dataset;
        race, ethnicity and 5-digit zip code are held under controlled access.
      - No regulation prevents demographic data collection in the study.
    distribution:
      - Recruitment sampling procedures aimed at achieving approximately equal distribution of
        participants across sex, race, and diabetes severity.
      - As enrollment is ongoing, the periodic updates to data releases may not have achieved
        balanced distribution across groups.
    description: >-
      Because demographic labels are unavailable in the public release, the project team suggests a
      split for training/validation/testing models that is aimed at reducing disparities in models
      developed using this dataset. The prepared splits use proportions of 70%/15%/15% for
      training/validation/testing, where the validation and test sets are balanced as well as
      possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle
      controlled, oral medication controlled, and insulin controlled).

