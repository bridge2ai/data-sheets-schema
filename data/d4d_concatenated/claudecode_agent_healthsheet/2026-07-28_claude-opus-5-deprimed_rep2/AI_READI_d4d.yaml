acquisition_methods:
- name: Mixed direct observation and subject report
  was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details:
  - >-
    The acquisition of data varied based on the domain; some data were directly observable (such as
    labs, vitals, and retinal imaging), whereas other data were reported by subjects (e.g. survey
    responses).
  - >-
    Verification of data entry was performed when possible, for example cross-referencing entered
    medications with medications that were physically brought in or photographed by each study
    participant.
  - Details for each data domain are available at https://docs.aireadi.org.

collection_mechanisms:
- name: Study instruments and data capture systems
  description: >-
    Devices, instruments, and software used to collect the data. The procedures for data collection
    and processing are available at https://docs.aireadi.org, and more device detail is provided
    there.
  mechanism_details:
  - >-
    Environmental sensor device: participants are sent home with an environmental sensor (a
    custom-designed sensor unit called the LeeLab Anura), which they use for 10 continuous days before
    returning the device to the clinical research coordinators for data download.
  - >-
    Continuous glucose monitor: the Dexcom G6, a real-time integrated continuous glucose monitoring
    system (iCGM) that directly monitors blood glucose levels without requiring finger sticks and must
    be worn continuously in order to collect data.
  - >-
    Wearable accelerometer / physical activity monitor: the Garmin Vivosmart 5 Fitness Activity
    tracker, used to measure data related to physical activity.
  - "Heart rate: read from EKG or blood pressure measurement devices."
  - >-
    Blood pressure: OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood
    Pressure Monitor, and Welch Allyn 6000 series Vital signs monitor with Welch Allyn FlexiPort
    Reusable Blood Pressure Cuff, used across the various data acquisition sites.
  - >-
    Visual acuity: M&S Technologies EVA device, administered at 4 meters from a 12x20 inch
    touch-screen monitor. Photopic conditions use no neutral density filters and a general occluder,
    with the participant wearing their own prescription spectacles or trial frames; mesopic conditions
    use a neutral density (ND) filter, either a lens added to trial frames or a handheld ND-occluder
    over the glasses.
  - >-
    Contrast sensitivity: the MARS Letter Contrast Sensitivity test (Perceptrix), conducted
    monocularly under photopic (general occluder) and mesopic (neutral density occluder with low
    luminance filter lens) conditions, in the standardized card order Photopic OD, Photopic OS,
    Mesopic OD, Mesopic OS. Background luminance fell within 60 to 120 cd/m2 (optimal 85 cd/m2),
    illuminance between 189 and 377 lux (optimal 267 lux), and viewing distance was designed at 50 cm
    with a permitted range of 40 to 59 cm. Patients wore appropriate near correction (reading glasses
    or trial frames with +2.00D lenses) and all testing was carried out undilated. Testing terminated
    after two consecutive errors or at the end of the chart, and log contrast sensitivity was recorded
    by multiplying the number of errors prior to the final correct letter by 0.04 and subtracting the
    result from the log CS value at the final correct letter.
  - "Autorefraction: KR 800 Auto Keratometer/Refractor."
  - "EKG: Philips (manufacturer of Pagewriter TC30 Cardiograph)."
  - >-
    Lensometer: NIDEK LM-600P Auto Lensometer, Topcon-CL-200 computerized Lensometer, and
    Topcon-CL-300 computerized Lensometer, across data acquisition sites.
  - >-
    Undilated fundus photography: Optomed Aurora IQ handheld non-mydriatic fundus camera with a 50
    degree field of view, 5 Mpix sensor, and high-contrast optical design. Images are taken undilated
    in a dark room while the patient sits reclined in a comfortable chair.
  - >-
    Dilated fundus photography: iCare EIDON widefield TrueColor confocal fundus imaging system
    capturing images up to 200 degrees, with TrueColor, blue, red, red-free, and infrared confocal
    modalities, operating without dilation (minimum pupil 2.5 mm) in fully automated or fully manual
    modes. AI-READI uses two main modalities, Single Field Central IR/FAF and Smart Horizontal Mosaic,
    acquired in fully automated mode in a dark room.
  - >-
    Spectralis HRA (Heidelberg Engineering): the Heidelberg Spectralis HRA+OCT combines optical
    coherence tomography with retinal angiography and confocal scanning laser ophthalmoscope (cSLO)
    technology, usable even in patients with cataracts. For AI-READI subjects imaging is done in a dark
    room using the ONH-RC, PPole-H, and macular OCTA modalities.
  - >-
    Triton DRI OCT (Topcon Healthcare): swept-source OCT with multimodal fundus imaging, a 1,050 nm
    wavelength light source and a non-mydriatic color fundus camera. Imaging is done in a dark room
    with automatic positioning, in 12.0x12.0 mm and 6.0x6.0 mm OCTA and 12.0 mm x 9.0 mm x 6.0 mm 3D
    horizontal and radial scan modes.
  - >-
    Maestro2 3D OCT (Topcon Healthcare): robotic OCT and color fundus camera system capturing a 12 mm
    x 9 mm wide-field OCT scan including the macula and optic disc, plus high-resolution non-mydriatic
    true color fundus photography, OCT, and OCTA with a single button press. Protocols include 12.0 mm
    x 9.0 mm widefield, 6.0 mm x 6.0 mm 3D macula scan, and 6.0 mm x 6.0 mm OCTA at a 50 kHz scan rate.
  - >-
    FLIO (Heidelberg Engineering): Fluorescence Lifetime Imaging Ophthalmoscopy, a non-invasive method
    measuring retinal fluorescence lifetimes to provide information about the metabolic and functional
    status of the retina. It is performed by an operator in a dark room as the last modality of an
    AI-READI visit.
  - >-
    Cirrus 5000 Angioplex (Carl Zeiss Meditec): high-definition OCT system offering non-invasive
    imaging of retinal microvasculature. Protocols include 512x512 and 200x200 macula and ONH scans
    and macular OCTA, with a 60-degree OCTA widefield view, 8x8 mm single scans, and 14x14 mm automated
    OCTA montage for rapid peripheral assessment.
  - >-
    Monofilament testing for peripheral neuropathy: a standard 10g monofilament is applied to
    different points on the plantar surface of the feet; patients confirm sensation verbally and
    insensate areas are retested for confirmation, with the sequence repeated randomly at each testing
    site on each foot until results are obtained. Results are recorded on an iPad, laptop, or paper
    questionnaire and are added directly to the project's REDCap by clinical research staff.
  - >-
    Montreal Cognitive Assessment (MoCA): an in-office screening tool for mild cognitive impairment
    and early onset dementia evaluating memory, executive functioning, attention, language,
    visuospatial ability, orientation, visuoconstructional skills, conceptual thinking, and
    calculations, producing a total score (maximum 30; below 24 indicates cognitive impairment, 26 and
    above is considered normal) and six domain-specific index scores. AI-READI research staff perform
    this test on an iPad using the pre-installed MoCA Duo app, which captures all patient responses
    interactively.
  - >-
    Survey and form capture: the exact forms used for data collection in REDCap are available at
    https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
  used_software:
  - id: REDCap
    name: REDCap
    description: >-
      Electronic data capture system used for study surveys and forms, electronic consent, direct
      entry of clinical test results by research staff, and automated range checks that flagged
      clinical data outside expected min/max values.
  - id: MoCA-Duo
    name: MoCA Duo app
    description: >-
      iPad application used by AI-READI research staff to administer the Montreal Cognitive Assessment
      and capture all patient responses in an interactive manner.

data_collectors:
- name: AI-READI study team
  role: Clinical research and data management staff across the three data acquisition sites
  collector_details:
  - >-
    Details about the AI-READI team members involved in the data collection process are available at
    https://aireadi.org/team.
  - >-
    Their effort was supported by the National Institutes of Health award OT2OD032644 based on the
    percentage of effort contributed, and salaries which aligned with the funding guidelines at each
