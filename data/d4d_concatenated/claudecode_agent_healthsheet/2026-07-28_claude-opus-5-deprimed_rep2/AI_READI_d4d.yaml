instances:
- name: Individual participant record
  description: >-
    Each instance represents an individual patient. Each instance consists of all of the data
    available for an individual participating in the study, spanning survey data, clinical data,
    retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable
    activity monitor data. These encompass tabular data, imaging data, and physiological
    signal/waveform data. There is no unstructured text data included in this dataset. All modalities,
    file formats, and devices are detailed in the dataset documentation at https://docs.aireadi.org,
    and the exact forms used for data collection in REDCap are available at
    https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
  instance_type: individual patient
  counts: 2280
  label: false
  label_description: >-
    No explicit label or target is associated with each data instance; no labels are provided in
    either the preliminary or the current version of the dataset.
  missing_information:
  - name: Modality coverage gaps
    missing:
    - Not all data modalities are available for all participants.
    why_missing:
    - Some participants elected not to participate in some study elements.
    - >-
      In a few cases the data collection device did not have any stored results or was returned too
      late to retrieve the results (e.g. battery died, data was lost).
    - >-
      In a few cases there may have been a data collision at some point in the process and data has
      been lost.

sampling_strategies:
- name: Full enrollment with balanced recruitment design
  description: >-
    Sampling and recruitment approach for the dataset, including study eligibility criteria.
  is_sample: false
  strategies:
  - >-
    The dataset contains all possible instances; it contains data from all participants who had been
    enrolled during the covered data collection period for AI-READI. No sampling from a larger set was
    performed (the healthsheet answers the sampling-strategy question as not applicable).
  - >-
    Recruitment sampling procedures aimed at achieving approximately equal distribution of
    participants across sex, race, and diabetes severity.
  - >-
    Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes and
    prediabetes ICD-10 codes for all patients who have had an encounter with the sites' health systems
    within the past 2 years.
  - >-
    Inclusion criteria: able to provide consent; 40 years of age or older; persons with or without
    type 2 diabetes; must speak and read English.
  - >-
    Exclusion criteria: must not be pregnant; must not have gestational diabetes; must not have Type 1
    diabetes.

anomalies:
- name: Known sources of error and noise
  description: >-
    Errors, sources of noise, and redundancies expected in the dataset.
  anomaly_details:
  - In cases of survey data, skipped questions or incomplete responses are expected.
  - >-
    In cases of using wearables, improper use and technical failure such as battery failure or system
    malfunction are expected.
  - >-
    In cases of imaging data, patient uncooperation, noise that may obscure the images, technical
    failure such as system malfunction, and data transfer failures are expected.
  - >-
    Undilated handheld fundus photography quality varies from patient to patient and within the same
    patient because images are acquired without dilation with a handheld camera.
  - >-
    Spectralis HRA imaging is operated by the imaging team and is not fully automated, so quality
    issues may arise, which may lead to skipping this modality and missing data.
  - >-
    FLIO is performed last in the visit, takes longer than a usual Spectralis OCT, and exposes
    patients to uncomfortable levels of light, so patient compliance may not be at its best.

known_biases:
- name: Representation bias in the study cohort
  bias_type: representation_bias
  bias_description: >-
    Recruitment was predominantly urban and hospital-based, which may not fully capture diverse
    cultural and socioeconomic backgrounds. The study cohort may not provide a comprehensive
    representation of the population, as it does not include other races/ethnicities such as Pacific
    Islanders and Native Americans.
  mitigation_strategy: >-
    Three recording sites were strategically selected to achieve diverse recruitment: the University
    of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and the University
    of Washington (UW). The sites were chosen for geographic diversity across the United States and to
    ensure diverse representation across various racial and ethnic groups. Individuals from all
    demographic backgrounds were recruited at all 3 sites.
- name: Sampling imbalance across target strata
  bias_type: sampling_bias
  bias_description: >-
    While AI-READI's cross-sectional database ultimately aims to achieve balance across
    race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
    balanced across these parameters. As enrollment is ongoing, periodic updates to data releases may
    not have achieved balanced distribution across racial groups.
  mitigation_strategy: >-
    Recruitment sampling procedures target approximately equal distribution across sex, race, and
    diabetes severity, and the project team provides recommended data splits in which validation and
    test sets are balanced as well as possible for sex, race/ethnicity and diabetes status.
- name: Selection bias from eligibility and recruitment channel
  bias_type: selection_bias
  bias_description: >-
    Participants were recruited from pools identified by screening Electronic Health Records for
    diabetes and prediabetes ICD-10 codes among patients with an encounter at the sites' health
    systems within the past 2 years, and eligibility was restricted to people aged 40 or older who
    can provide consent and who speak and read English, excluding people who are pregnant or who have
    gestational or Type 1 diabetes.
  mitigation_strategy: >-
    Uniform data collection protocols were implemented for all subjects, irrespective of their
    race/ethnicity, biological sex, or diabetes severity, across all study sites, and the selection of
    study sites was intended to ensure equitable representation and minimize the potential for
    sampling bias.
- name: Measurement variability across devices and operators
  bias_type: measurement_bias
  bias_description: >-
    Multiple device makes and models were used for the same measure across the three data acquisition
    sites (for example blood pressure monitors, lensometers, and several retinal imaging platforms),
    and some modalities depend on operator involvement and patient cooperation.
  mitigation_strategy: >-
    Information on device make and model, including specific modalities like macula scans or wide
    scans during OCT, were documented to ensure repeatability. The study deliberately included
    multiple devices for one measure to enhance generalizability and represent the diverse range of
    equipment utilized in clinical settings.

known_limitations:
- name: Limited population representativeness
  limitation_type: representativeness_limitation
  limitation_description: >-
    The cohort is drawn from three urban, hospital-based academic sites in the USA and does not
    include other races/ethnicities such as Pacific Islanders and Native Americans.
  scope_impact: >-
    Factors influencing the generalization of derived models include the predominantly urban and
    hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
    backgrounds.
- name: Cross-sectional coverage of a single visit
  limitation_type: temporal_limitation
  limitation_description: >-
    This version covers data collected between July 19, 2023 and May 1, 2025, and there is currently
    only one visit per participant. Approximately 4% of participants are expected to undergo a
    follow-up examination in Year 4 of the project.
  scope_impact: >-
    Longitudinal analyses within participants are limited by the current single-visit structure of the
    dataset.
- name: Incomplete modality coverage across participants
  limitation_type: coverage_limitation
  limitation_description: >-
    Not all modalities are available for all participants, due to participants electing not to take
    part in some study elements, device data loss or late return, and occasional data collisions.
  scope_impact: >-
    Analyses requiring complete multimodal records will be restricted to the subset of participants
    with the required modalities present.
- name: Restricted variables in the public release
  limitation_type: scope_limitation
  limitation_description: >-
    Sex, race, ethnicity, 5-digit zip code, genetic sequencing data, past health records, and traffic
    and accident reports are held under controlled access rather than distributed in the public
    dataset. In addition, the Snellen visual acuity variables were dropped in this version of the
    dataset, so only logMAR visual acuity measurements are available.
  scope_impact: >-
    Users of the public release cannot stratify analyses by sex, race, or ethnicity directly, which is
    the stated reason the project team provides pre-computed balanced data splits.
  recommended_mitigation: >-
    Use the recommended 70%/15%/15% data splits, whose validation and test sets are balanced as well
    as possible for sex, race/ethnicity and diabetes status, or request the full dataset under a data
    use agreement.
- name: No labels or gold-standard task definitions
  limitation_type: methodological_limitation
  limitation_description: >-
    No explicit label or target is associated with each data instance, and no labeling was performed,
    as the dataset is hypothesis-agnostic and aimed at facilitating multiple potential downstream
    AI/ML applications.
  scope_impact: >-
    Supervised learning applications must define and derive their own labels; human-level performance
    baselines for target applications are not provided.
  recommended_mitigation: >-
    No formal guidelines are in place for future researchers creating new labels or defining new
    tasks.

