  - Study subjects received a compensation of $200 for the study visit, also through the grant funding.

collection_timeframes:
- name: Version 3 data collection window
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details:
  - >-
    For this version of the dataset, the timeframe for data collection was July 19, 2023 to May 01,
    2025.
  - >-
    The timeline for the overall project spans four years, encompassing one year dedicated to protocol
    development and training, and years 2-4 allocated for subject recruitment and data collection.
    Approximately 4% of participants are expected to undergo a follow-up examination in Year 4.
  - >-
    The data collection process is specifically tailored to enable downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories, by gathering and learning from complex
    multimodal data from participants exhibiting varying disease severity, ranging from normal to
    insulin-dependent T2DM. The timeframe also allows for the collection of the highest number of
    subjects possible to ensure a balanced representation of racial and ethnic groups and mitigate
    biases in computer vision algorithms.

direct_collection:
- name: Direct prospective collection from participants
  is_direct: true
  collection_details:
  - >-
    The data was collected directly from participants across the three recruiting sites. This was not
    passive data collection or secondary use of existing data, but rather active data collection
    directly from participants.
  - >-
    Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes and
    prediabetes ICD-10 codes for all patients who have had an encounter with the sites' health systems
    within the past 2 years.
  - The data were collected in the USA.
  - English language was used for communication with study participants.
  - >-
    Accessibility measurements were not specifically assessed. However, transportation assistance
    (rideshare services) was offered to study participants who endorsed barriers to transporting
    themselves to study visits.

collection_notifications:
- name: Participant notification of data collection
  notification_details:
  - >-
    Each individual was aware of the data collection, as this was not passive data collection or
    secondary use of existing data, but rather active data collection directly from participants.

collection_consents:
- name: Informed consent for collection and use
  consent_details:
  - >-
    Informed consent to participate was required before participation in any part of the protocol,
    including questionnaires.
  - >-
    Potential participants were given the option to read all consent documentation electronically
    (e-consent) before their visit and give their consent with an electronic signature without verbal
    communication with a clinical research coordinator. Participants may access e-consent
    documentation in REDCap and decide at that point that they do not want to participate or would
    like additional information.
  - >-
    The approved consent form for the principal project site, the University of Washington, is
    available at
    https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
  - >-
    The other clinical sites had IRB reliance and used the same consent form, with minor
    institution-specific language incorporated depending on individual institutional requirements.

consent_revocations:
- name: Withdrawal of consent
  revocation_details:
  - >-
    Participants were permitted to withdraw consent at any time and cease study participation.
  - >-
    However, any data that had been shared or used up to that point would stay in the dataset. This is
    clearly communicated in the consent document.

missing_data_documentation:
- name: Missing data across modalities
  missing_data_patterns:
  - Not all modalities are available for all participants.
  - Skipped questions or incomplete responses occur in survey data.
  missing_data_causes:
  - Some participants elected not to participate in some study elements.
  - >-
    In a few cases the data collection device did not have any stored results or was returned too late
    to retrieve the results (e.g. battery died, data was lost).
  - In a few cases a data collision occurred at some point in the process and data has been lost.
  - >-
    Operator-dependent imaging modalities may be skipped when quality issues arise, producing missing
    data.
  handling_strategy: >-
    Missing data that could be directly filled from other portions of an individual's record were
    identified during quality control review of REDCap reports by Data Managers and clinical research
    coordinators, and corrections were made only under the guidance and approval of the site PI. No
    imputation procedure is described in the healthsheet.

ethical_reviews:
- name: Institutional Review Board approval
  reviewing_organization: University-of-Washington
  review_details:
  - >-
    The initial IRB approval at the University of Washington was received on December 20, 2022.
  - >-
    The initial approval letter is available at
    https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf.
  - >-
    An annual renewal application to the IRB about the status and progress of the study is required and
    due within 90 days of expiration.
  - The other clinical sites had IRB reliance on the principal site's approval.

data_protection_impacts:
- name: Data protection impact analysis
  impact_details:
  - >-
    No, a data protection impact analysis has not been conducted.

human_subject_research:
  name: Human subject research status
  involves_human_subjects: true
  irb_approval:
  - >-
    Initial IRB approval at the University of Washington was received on December 20, 2022; the
    initial approval letter is available at
    https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf.
  - >-
    An annual renewal application to the IRB about the status and progress of the study is required and
    due within 90 days of expiration.
  ethics_review_board:
  - University of Washington Institutional Review Board (principal project site)
  - The other clinical sites had IRB reliance and used the same consent form.

informed_consent:
- name: Informed consent process
  consent_obtained: true
  consent_type:
  - Written informed consent required before participation in any part of the protocol
  - Electronic consent (e-consent) with electronic signature, accessed through REDCap
  consent_documentation:
  - https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf
  withdrawal_mechanism:
  - >-
    Participants were permitted to withdraw consent at any time and cease study participation, though
    any data that had been shared or used up to that point would stay in the dataset; this is clearly
    communicated in the consent document.
  consent_scope:
  - >-
    Consent covered collection and use of participant data, including questionnaires, and was obtained
    prior to any part of the protocol.

at_risk_populations:
  name: Eligibility-based protections
  special_protections:
  - >-
    Eligibility was restricted to individuals able to provide consent, aged 40 years or older, with or
    without type 2 diabetes, who speak and read English.
  - >-
    Individuals who are pregnant, who have gestational diabetes, or who have Type 1 diabetes were
    excluded from the study.

participant_privacy:
- name: Privacy protections and residual risk
  anonymization_method:
  - No personally identifiable information is included in the dataset.
  - >-
    The dataset was reviewed internally by AI-READI team members for quality checks and to ensure that
    no personally identifiable information was accidentally included; the dataset has not undergone any
    formal external audits.
  reidentification_risk:
  - >-
    To the extent of the dataset creators' knowledge, no uses of the dataset are anticipated that could
    result in unfair treatment or harm; however, there is a theoretical risk of future
    re-identification.
  privacy_techniques:
  - >-
    Sensitive variables including 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past
    health records, and traffic and accident reports are held under controlled access and are released
    only under a data use agreement rather than in the public dataset.
  - >-
    Raw data are not shared outside the project team at present, in part because the raw data may
    accidentally include personal health information or personally identifiable information (e.g. in
    free text fields).
  data_linkage:
  - >-
    Recruitment pools were identified by screening Electronic Health Records for diabetes and
    prediabetes ICD-10 codes among patients seen at the sites' health systems within the past 2 years.

participant_compensation:
- name: Participant compensation
  compensation_provided: true
  compensation_type:
  - Monetary compensation for the study visit, paid through the grant funding
  compensation_amount:
  - Study subjects received a compensation of $200 for the study visit.

is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  deidentification_details:
  - No personally identifiable information is included in the dataset.
  - >-
    The healthsheet does not answer the questions about pre-processing performed for de-identification
    or about specific measures taken to avoid re-identification of individuals.
  - >-
    The dataset was reviewed internally by AI-READI team members to ensure that no personally
    identifiable information was accidentally included.
  - There remains a theoretical risk of future re-identification.

preprocessing_strategies:
- name: Standardization for dissemination
  preprocessing_details:
  - >-
    Once data were sent from each of the study sites to the central project team, additional processing
    steps were conducted in preparation for dissemination.
  - >-
    All data were mapped to standardized terminologies when possible, such as the Observational Medical
    Outcomes Partnership (OMOP) Common Data Model, a common data model for observational health data,
    and the Digital Imaging and Communications in Medicine (DICOM) standard for medical imaging data.
  - >-
    Details about the data processing approaches for each data domain/modality are described in the
    dataset documentation at https://docs.aireadi.org.
  - >-
    No data were excluded from the dataset at the time of preprocessing.

cleaning_strategies:
- name: Quality control at data entry and acquisition
  cleaning_details:
  - >-
    Several quality control measures were used at the time of data entry/acquisition. Clinical data
    outside of expected min/max ranges were flagged in REDCap, which was visible in reports viewed by
    clinical research coordinators (CRCs) and Data Managers.
  - >-
    Using these REDCap reports as guides, Data Managers and CRCs examined participant records and
    determined if an error was likely.
  - >-
    Data were checked for credibility, based on range checks to determine if all responses fall within
    a prespecified reasonable range.
  - Data were checked for incorrect flow through prescribed skip patterns.
  - >-
    Data were checked for missing data that can be directly filled from other portions of an
    individual's record.
  - Data were checked for the omission and/or duplication of records.
  - >-
    Editing was only done under the guidance and approval of the site PI. If corrected data was
    available from elsewhere in the respondent's answers, the error was corrected. If there was no
    logical or appropriate way to correct the data, the site PI reviewed the values and made decisions
    about whether those values should be removed from the data.
  - >-
    The dataset has not undergone any formal external audits, but it has been reviewed internally by
    AI-READI team members for quality checks and to ensure that no personally identifiable information
    was accidentally included.

labeling_strategies:
- name: No labeling performed
  labeling_details:
  - No explicit label or target is associated with each data instance; no labels are provided.
  - >-
    No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic dataset
    aimed at facilitating multiple potential downstream AI/ML applications.
  - >-
    Because no labeling was performed, no labeling software, labeler demographics, rater agreement, or
    annotation compensation information applies.

raw_sources:
- name: Retained raw data
  raw_data_details:
  - >-
    The raw data is saved and expected to be preserved by the AI-READI project at least for the
    duration of the project.
  - >-
    Raw data is not anticipated to be shared outside the project team right now, because it has not
    been mapped to standardized terminologies and because the raw data may accidentally include
    personal health information or personally identifiable information (e.g. in free text fields).
  - >-
    There is a possibility that raw data may be included in future releases of the controlled access
    dataset.

existing_uses:
- name: Prior uses of the dataset
  description: >-
    The healthsheet states that the dataset has not been used for any tasks already.

use_repository:
- name: Repository of works using the dataset
  repository_details:
  - >-
    There is no repository, besides Google Scholar, that links to any or all papers or systems that use
    the dataset.
  - >-
    Use of the dataset requires citation to the resources specified in https://docs.aireadi.org.

other_tasks:
- name: Guidance for new tasks and labels
  task_details:
  - >-
    No formal guidelines are in place for future researchers who wish to create new labels or define
    new tasks.
  - >-
    Human level performances in the applications the dataset is supposed to address are not reported.

future_use_impacts:
- name: Composition and processing factors affecting future use
  impact_details:
  - >-
    To the extent of the dataset creators' knowledge, no uses of the dataset are currently anticipated
    that could result in unfair treatment or harm.
  - There is a theoretical risk of future re-identification.
  - >-
    Because sex, race, and ethnicity are not released with the public version of the dataset, users
    cannot directly audit subgroup performance in the public release; the project team provides
    balanced recommended splits as a mitigation.
  - >-
    The cohort is not balanced across race/ethnicity, biological sex, and diabetes severity in the
    pilot phase, and periodic releases may not have achieved balanced distribution across racial groups
    while enrollment is ongoing.

discouraged_uses:
- name: License-based usage restrictions
  discouragement_details:
  - >-
    The AI-READI dataset license imposes certain restrictions on the usage of the data. The
    restrictions are described in the license files available at https://doi.org/10.5281/zenodo.17555036.

intended_uses:
- name: Intended research applications
  usage_notes: >-
    The dataset is hypothesis-agnostic and was designed to enable downstream AI/ML analyses that may
    not be feasible with existing data sources such as claims or electronic health records data.
  use_category:
  - research
  examples:
  - >-
    Artificial intelligence and machine learning research into type 2 diabetes mellitus, including
    salutogenic pathways to return to health.
  - >-
    Downstream pseudotime manifold analysis to predict disease trajectories across participants with
    varying disease severity.

prohibited_uses:
- name: Uses excluded by the license terms
  prohibition_reason:
  - >-
    Tasks for which the dataset should not be used are governed by the license terms; the license file
    at https://doi.org/10.5281/zenodo.17555036 defines the restrictions on data usage, security, and
    secondary sharing.

distribution_formats:
- name: Distribution through the FAIRhub platform
  description: >-
    The dataset will be available through the FAIRhub platform. The dataset's DOI is
    https://doi.org/10.60775/fairhub.3.
  access_urls:
  - http://fairhub.io/
  - https://doi.org/10.60775/fairhub.3

distribution_dates:
- name: Version release dates
  release_dates:
  - The first version of the dataset was distributed in May 2024.
  - The second version of the dataset was distributed in November 2024.
  - The third version of the dataset was distributed in November 2025.

third_party_sharing:
- name: Distribution to third parties
  is_shared: true
  description: >-
    The dataset will be distributed to third parties outside of the entity on behalf of which it was
    created and will be available for public use.

license_and_use_terms:
  name: AI-READI dataset license
  license_terms:
  - >-
    The license file containing the terms for reusing the AI-READI dataset is available at
    https://doi.org/10.5281/zenodo.17555036.
  - >-
    These license terms were specifically tailored to enable reuse of the AI-READI dataset (and other
    clinical datasets) for commercial or research purpose while putting strong requirements around data
    usage, security, and secondary sharing to protect study participants, especially when data is
    reused for artificial intelligence (AI) and machine learning (ML) related applications.
  - >-
    Some data that are not considered to be sensitive personal health data are available to the public
    for download upon agreement with a license that defines how the data can be used; the full dataset
    is accessible by entering into a data use agreement.
  - >-
    The dataset documentation at https://docs.aireadi.org is shared under the CC-BY 4.0 license.

ip_restrictions:
  name: Third-party intellectual property restrictions
  restrictions:
  - >-
    Any third-party IP-based or other restrictions on the data associated with the instances are
    covered by the dataset license at https://doi.org/10.5281/zenodo.17555036.

regulatory_restrictions:
  name: Export control and regulatory restrictions
  confidentiality_level: restricted
  regulatory_restrictions:
  - >-
    Export controls and other regulatory restrictions applicable to the dataset or to individual
    instances are covered by the dataset license at https://doi.org/10.5281/zenodo.17555036.
  - >-
    Access is tiered: non-sensitive data are downloadable by the public upon agreement with the
    license, while the full dataset requires entering into a data use agreement.

maintainers:
- name: AI-READI team
  role: academic_institution
  maintainer_details:
  - The AI-READI team will be supporting and maintaining the dataset.
  - The dataset is hosted on FAIRhub through Microsoft Azure.
  - >-
    The README file included with the dataset provides contact information for the owner, curator, and
    manager of the dataset.

updates:
  name: Version release plan
  frequency: Approximately once a year
  update_details:
  - >-
    The dataset will not be updated in place. Rather, new versions of the dataset will be released with
    additional instances as more study participants complete the study visit.
  - >-
    There are plans to release new versions of the dataset approximately once a year with additional
    data from participants who have been enrolled since the last dataset version release.
  - >-
    Enrollment is ongoing, and future versions of the dataset will be released that will include larger
    numbers of subjects/patients as enrollment increases.

retention_limit:
  name: Data retention
  retention_period: No limit
  retention_details:
  - >-
    There are no limits on the retention of the data associated with the instances.

version_access:
  name: Dataset versions and their availability
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
  - >-
    Version 1: data collected during the pilot data collection phase, containing 204 participants,
    distributed in May 2024.
  - >-
    Version 2: data collected up to the end of the first full year of the study, containing 1067
    participants in total, distributed in November 2024.
  - >-
    Version 3 (this datasheet): data collected between July 19, 2023 and May 1, 2025, containing 2280
    participants in total, distributed in November 2025.
  version_details:
  - >-
    The dataset gets released as static versions rather than being dynamically updated.
  - >-
    This datasheet is created for the third version of the dataset.
  - >-
    A previous datasheet was created for the first version of the dataset and is available at
    https://docs.aireadi.org/docs/1/dataset/healthsheet.
  - >-
    A previous datasheet was created for the second version of the dataset and is available at
    https://docs.aireadi.org/docs/2/dataset/healthsheet.
  - >-
    The current version includes data from the second year of the study, rather than only the data
    collected from the pilot data collection phase (version 1) and the first year of the study
    (version 2), and includes more subjects/patients than earlier versions.
  - >-
    The data fields/types are largely the same as the prior version of the dataset. However, the
    Snellen visual acuity variables were dropped in this version, such that now only logMAR visual
    acuity measurements are available.
  - >-
    This version does not introduce new tasks or labeling, but it does include a new recommended data
    split for the 2280 participants balancing training, validation, and testing sets for age, sex,
    races/ethnicities, and study group.
  - >-
    Older versions will not be updated; new versions are released with additional instances as more
    study participants are enrolled.
  - >-
    The dataset creators are not aware of any widespread versions or subversions of the dataset.

extension_mechanism:
  name: External contribution mechanism
  extension_details:
  - >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.

external_resources:
- name: AI-READI dataset documentation
  external_resources:
  - >-
    The dataset is self-contained but does rely on the dataset documentation for users requiring
    additional information about the provenance of the dataset. The documentation is available at
    https://docs.aireadi.org.
  - >-
    Project website with consortium membership and institutional details: https://aireadi.org, and team
    information at https://aireadi.org/team.
  - >-
    REDCap surveys and forms used for data collection:
    https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
  - >-
    Funding information: https://commonfund.nih.gov/bridge2ai and
    https://reporter.nih.gov/search/T-mv2dbzIEqp9V6UJjHpgw/project-details/10885481.
  restrictions:
  - >-
    The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated
    with its use.

related_datasets:
- target_dataset: >-
    AI-READI flagship dataset, version 1 (pilot data collection phase; datasheet at
    https://docs.aireadi.org/docs/1/dataset/healthsheet)
  relationship_type: is_new_version_of
  description: >-
    Version 1 contained data from 204 participants collected during the pilot data collection phase and
    was distributed in May 2024.
- target_dataset: >-
    AI-READI flagship dataset, version 2 (first full study year; datasheet at
    https://docs.aireadi.org/docs/2/dataset/healthsheet)
  relationship_type: is_new_version_of
  description: >-
    Version 2 contained data from 1067 participants in total, collected up to the end of the first full
    year of the study, and was distributed in November 2024.
