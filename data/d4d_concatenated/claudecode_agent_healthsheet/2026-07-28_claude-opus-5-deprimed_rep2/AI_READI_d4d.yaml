purposes:
- name: Enable AI/ML research into type 2 diabetes and salutogenesis
  description: >-
    Purpose for which the dataset was created, as stated in the Motivation section of the healthsheet.
  response: >-
    The purpose for creating the dataset was to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes
    mellitus (T2DM), including salutogenic pathways to return to health. T2DM is a growing public
    health threat. Yet, the current understanding of T2DM, especially in the context of
    salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches may help with
    improving our understanding but a key issue is the lack of data ready for training AI models. The
    AI-READI dataset is intended to fill this gap.

tasks:
- name: Downstream pseudotime manifold and AI applications
  description: >-
    Tasks the dataset is intended to support. No predefined labels or supervised task definitions are
    distributed with the dataset.
  response: >-
    The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence. No specific labeling was performed
    in the dataset, as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple
    potential downstream AI/ML applications. This version of the datasheet does not introduce new
    tasks or labeling, but it does introduce a new recommended data split.

addressing_gaps:
- name: Lack of AI-ready multimodal data on type 2 diabetes
  description: >-
    Gap in existing data resources that the dataset was created to fill.
  response: >-
    Current understanding of T2DM, especially in the context of salutogenesis, is limited, and a key
    issue is the lack of data ready for training AI models. Existing sources such as claims or
    electronic health records data do not support the downstream AI/ML analyses the AI-READI
    acquisition protocol was designed to enable. The AI-READI dataset is intended to fill this gap.

