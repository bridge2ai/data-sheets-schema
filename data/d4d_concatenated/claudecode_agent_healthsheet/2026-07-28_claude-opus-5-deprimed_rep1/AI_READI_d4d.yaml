id: https://doi.org/10.60775/fairhub.3
name: AI-READI
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights (AI-READI) dataset
  consists of data collected from individuals with and without Type 2 Diabetes Mellitus (T2DM),
  harmonized across three data collection sites. The composition of the dataset was designed with
  future studies using AI/Machine Learning in mind: recruitment sampling procedures aimed at
  achieving approximately equal distribution of participants across sex, race, and diabetes
  severity, and a data acquisition protocol spanning multiple domains (survey data, physical
  measurements, clinical data, imaging data, wearable device data, and others) was designed to
  enable downstream AI/ML analyses that may not be feasible with existing data sources such as
  claims or electronic health records data. The goal is to better understand salutogenesis (the
  pathway from disease to health) in T2DM. Each instance represents an individual patient, and
  this version contains data from 2280 participants collected between July 19, 2023 and
  May 1, 2025. Data are released in two access tiers: a public tier available for download upon
  agreement with a license that defines how the data can be used, and a controlled-access tier
  available by entering into a data use agreement. The public dataset includes survey data, blood
  and urine lab results, fitness activity levels, clinical measurements (for example monofilament
  and cognitive function testing), retinal images, ECG, blood sugar levels, and home air quality.
  The data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
  sequencing data, past health records, and traffic and accident reports. The overall enrollment
  goal is a balanced distribution between different racial groups; because enrollment is ongoing,
  periodic updates to data releases may not have achieved balanced distribution across groups.
doi: 10.60775/fairhub.3
version: '3'
status: published
page: http://fairhub.io/
publisher: http://fairhub.io/
language: English
license: >-
  AI-READI dataset license terms, published at https://doi.org/10.5281/zenodo.17555036. The terms
  were specifically tailored to enable reuse of the AI-READI dataset (and other clinical datasets)
  for commercial or research purposes while imposing strong requirements around data usage,
  security, and secondary sharing to protect study participants, especially when data is reused
  for artificial intelligence (AI) and machine learning (ML) related applications.
conforms_to: >-
  Data were mapped to standardized terminologies where possible, including the Observational
  Medical Outcomes Partnership (OMOP) Common Data Model for observational health data and the
  Digital Imaging and Communications in Medicine (DICOM) standard for medical imaging data.
