    name: AI-READI public access data
    title: AI-READI public dataset tier
    description: >-
      The portion of the dataset that is not considered to be sensitive personal health data and
      that is available to the public for download upon agreement with a license that defines how
      the data can be used. It includes survey data, blood and urine lab results, fitness activity
      levels, clinical measurements (for example monofilament and cognitive function testing),
      retinal images, ECG, blood sugar levels, and home air quality. Sex, race, and ethnicity data
      are not released with the public version of the dataset.
  - id: https://doi.org/10.60775/fairhub.3#controlled-access-tier
    name: AI-READI controlled access data
    title: AI-READI controlled access dataset tier
    description: >-
      The portion of the dataset accessible only by entering into a data use agreement. It contains
      5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records, and
      traffic and accident reports. There is a possibility that raw data may be included in future
      releases of the controlled access dataset.

purposes:
  - name: Enable AI/ML research into type 2 diabetes and salutogenesis
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type 2
      diabetes mellitus (T2DM), including salutogenic pathways to return to health.
    description: >-
      T2DM is a growing public health threat, yet the current understanding of T2DM, especially in
      the context of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches
      may help improve understanding, but a key issue is the lack of data ready for training AI
      models.
  - name: Support downstream pseudotime manifold analysis
    response: >-
      The multi-modal dataset is being gathered to facilitate downstream pseudotime manifolds and
      various applications in artificial intelligence.
    description: >-
      The data collection process is specifically tailored to enable downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories, by gathering and learning from
      complex, multimodal data from participants exhibiting varying disease severity, ranging from
      normal to insulin-dependent T2DM.

tasks:
  - name: Hypothesis-agnostic multimodal AI/ML applications
    response: >-
      The dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential
      downstream AI/ML applications rather than a single predefined task. No specific labeling was
      performed.
  - name: Pseudotime manifold analysis of disease trajectory
    response: >-
      Prediction of disease trajectories through pseudotime manifold analysis over complex,
      multimodal data from participants ranging from normal to insulin-dependent T2DM.

addressing_gaps:
  - name: Lack of AI-ready data for type 2 diabetes
    response: >-
      A key issue in applying AI-based approaches to T2DM is the lack of data ready for training AI
      models. The AI-READI dataset is intended to fill this gap.
  - name: Limited understanding of salutogenesis in T2DM
    response: >-
      The current understanding of T2DM, especially in the context of salutogenesis (the pathway
      from disease to health), is limited.

