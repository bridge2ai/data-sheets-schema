instances:
  - name: Individual study participant
    instance_type: individual patient
    counts: 2280
    label: false
    description: >-
      Each instance represents an individual patient. Each instance consists of all of the data
      available for an individual participating in the study. Multiple modalities of data are
      collected for each participant, including survey data, clinical data, retinal imaging data,
      environmental sensor data, continuous glucose monitor data, and wearable activity monitor
      data. These encompass tabular data, imaging data, and physiological signal/waveform data.
      There is no unstructured text data included in this dataset. There are 2280 instances in this
      current version of the dataset (version 3, released fall 2025).
    label_description: >-
      No explicit label or target is associated with each data instance. No labels are provided in
      either the preliminary dataset or the current version.
    missing_information:
      - name: Modality coverage gaps across participants
        missing:
          - >-
            Not all modalities are available for all participants; some modality-level data are
            absent for individual instances.
          - >-
            Snellen visual acuity variables are absent from this version; only logMAR visual acuity
            measurements are available.
        why_missing:
          - Some participants elected not to participate in some study elements.
          - >-
            In a few cases the data collection device did not have any stored results or was
            returned too late to retrieve the results (for example the battery died or data was
            lost).
          - >-
            In a few cases there may have been a data collision at some point in the process and
            data has been lost.
          - >-
            The Snellen visual acuity variables were dropped in this version of the dataset.

anomalies:
  - name: Survey response gaps
    anomaly_details:
      - >-
        In cases of survey data, skipped questions or incomplete responses are expected.
  - name: Wearable and sensor device failures
    anomaly_details:
      - >-
        In cases of using wearables, improper use and technical failure such as battery failure or
        system malfunction are expected.
  - name: Imaging noise and acquisition failures
    anomaly_details:
      - >-
        In cases of imaging data, patient uncooperation, noise that may obscure the images,
        technical failure such as system malfunction, and data transfer failures are expected.
      - >-
        For undilated handheld fundus photography (Optomed Aurora), obtaining a good view is
        challenging because patients are not dilated and the camera is handheld, so image quality
        varies from patient to patient and within the same patient.
      - >-
        The Heidelberg Spectralis HRA+OCT is operated by the imaging team and is not fully
        automated, so quality issues may arise, which may lead to skipping this modality and
        missing data.
      - >-
        Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) takes longer than a usual Spectralis OCT
        and exposes patients to uncomfortable levels of light, so it is performed as the last
        modality of a visit; because of this, patients may not be at their best possible compliance.

known_biases:
  - name: Incomplete demographic balance across enrollment
    bias_type: representation_bias
    bias_description: >-
      While the AI-READI cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters. Because enrollment is ongoing, periodic updates to data
      releases may not have achieved balanced distribution across groups.
    mitigation_strategy: >-
      Recruitment sampling procedures aimed at achieving approximately equal distribution of
      participants across sex, race, and diabetes severity. Three recording sites were strategically
      selected to achieve diverse recruitment and individuals from all demographic backgrounds were
      recruited at all three sites. Recommended data splits balance the validation and test sets as
      well as possible for sex, race/ethnicity, and diabetes status.
    affected_subsets:
      - Racial and ethnic groups
      - Biological sex groups
      - Diabetes presence and severity groups
  - name: Urban, hospital-based recruitment
    bias_type: selection_bias
    bias_description: >-
      Recruitment was predominantly urban and hospital-based, which may not fully capture diverse
      cultural and socioeconomic backgrounds. Recruitment pools were identified by screening
      Electronic Health Records for diabetes and prediabetes ICD-10 codes among patients who had an
      encounter with the sites' health systems within the past 2 years, so individuals without such
      an encounter were not sampled.
    mitigation_strategy: >-
      Three recording sites were chosen for geographic diversity across the United States and to
      ensure diverse representation across various racial and ethnic groups.
    affected_subsets:
      - Participants from non-urban settings
      - Participants without recent encounters in the sites' health systems
  - name: Racial and ethnic groups not represented
    bias_type: representation_bias
    bias_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it does
      not include other races/ethnicities such as Pacific Islanders and Native Americans.
    affected_subsets:
      - Pacific Islander populations
      - Native American populations

known_limitations:
  - name: Generalization limited by recruitment setting and cohort composition
    limitation_type: representativeness_limitation
    limitation_description: >-
      Factors influencing the generalization of derived models include the predominantly urban and
      hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
      backgrounds, and a study cohort that does not include other races/ethnicities such as Pacific
      Islanders and Native Americans.
    scope_impact: >-
      Models derived from the dataset may not generalize to populations and settings that are not
      represented in the cohort.
    recommended_mitigation: >-
      Use the recommended data splits, which balance validation and test sets as well as possible
      for sex, race/ethnicity, and diabetes status, and account for the documented cohort
      composition when interpreting results.
  - name: Eligibility restricted to English-speaking adults aged 40 and over
    limitation_type: coverage_limitation
    limitation_description: >-
      Study eligibility required participants to be able to provide consent, to be at least 40 years
      old, to be persons with or without type 2 diabetes, and to speak and read English. Participants
      who were pregnant, who had gestational diabetes, or who had Type 1 diabetes were excluded.
      English was the language used for communication with study participants.
    scope_impact: >-
      The dataset does not cover individuals under 40 years of age, non-English speakers, pregnant
      individuals, individuals with gestational diabetes, or individuals with Type 1 diabetes.
  - name: Cross-sectional design with a single visit per participant
    limitation_type: temporal_limitation
    limitation_description: >-
      There is currently only one visit per participant. Approximately 4% of participants are
      expected to undergo a follow-up examination in Year 4 of the project.
    scope_impact: >-
      Longitudinal analyses within a participant are generally not supported by the current version
      of the dataset.
  - name: Public tier excludes demographic and sensitive variables
    limitation_type: scope_limitation
    limitation_description: >-
      Sex, race, and ethnicity data are not released with the public version of the dataset; they,
      along with 5-digit zip code, genetic sequencing data, past health records, and traffic and
      accident reports, are held under controlled access.
    scope_impact: >-
      Analyses of demographic subgroup performance cannot be performed on the public tier alone.
    recommended_mitigation: >-
      The project team prepared recommended data splits whose validation and test sets are balanced
      as well as possible for sex, race/ethnicity, and diabetes status, so that users of the public
      tier can still evaluate models against balanced partitions. Access to the demographic
      variables themselves requires the controlled access tier.
  - name: Device and modality heterogeneity
    limitation_type: methodological_limitation
    limitation_description: >-
      Multiple device makes and models were used for the same measure across the three data
      acquisition sites, for example three different blood pressure monitors and three different
      lensometers, and several distinct OCT and fundus imaging platforms.
    scope_impact: >-
      Measurements for the same variable may not be strictly comparable across devices and sites.
    recommended_mitigation: >-
      Information on device make and model, including specific modalities such as macula scans or
      wide scans during OCT, was documented to ensure repeatability. Multiple devices for one
      measure were included deliberately to enhance generalizability and to represent the diverse
      range of equipment utilized in clinical settings.
  - name: No formal external audit
    limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has not undergone any formal external audits. It has been reviewed internally by
      AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included.

