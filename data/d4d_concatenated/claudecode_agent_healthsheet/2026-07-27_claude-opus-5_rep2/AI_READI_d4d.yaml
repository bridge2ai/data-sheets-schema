id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights (AI-READI)
  is a dataset consisting of data collected from individuals with and without "Type 2
  Diabetes Mellitus (T2DM)" and harmonized across 3 data collection sites. The composition
  of the dataset was designed with future studies using AI/Machine Learning in mind. This
  included recruitment sampling procedures aimed at achieving approximately equal
  distribution of participants across sex, race, and diabetes severity, as well as the
  design of a data acquisition protocol across multiple domains (survey data, physical
  measurements, clinical data, imaging data, wearable device data, etc.) to enable
  downstream AI/ML analyses that may not be feasible with existing data sources such as
  claims or electronic health records data. The goal is to better understand salutogenesis
  (the pathway from disease to health) in T2DM. Some data that are not considered to be
  sensitive personal health data will be available to the public for download upon
  agreement with a license that defines how the data can be used. The full dataset will be
  accessible by entering into a data use agreement. The public dataset will include survey
  data, blood and urine lab results, fitness activity levels, clinical measurements (e.g.
  monofilament and cognitive function testing), retinal images, ECG, blood sugar levels,
  and home air quality. The data held under controlled access include 5-digit zip code,
  sex, race, ethnicity, genetic sequencing data, past health records, and traffic and
  accident reports. Of note, the overall enrollment goal is to have balanced distribution
  between different racial groups. As enrollment is ongoing, the periodic updates to data
  releases may not have achieved balanced distribution across groups.
doi: 10.60775/fairhub.3
version: '3'
language: English
license: >-
  The AI-READI dataset is distributed under license terms published at
  https://doi.org/10.5281/zenodo.17555036. These license terms were specifically tailored
  to enable reuse of the AI-READI dataset (and other clinical datasets) for commercial or
  research purpose while putting strong requirements around data usage, security, and
  secondary sharing to protect study participants, especially when data is reused for
  artificial intelligence (AI) and machine learning (ML) related applications.
publisher: http://fairhub.io/
page: http://fairhub.io/
created_by: AI-READI Consortium
conforms_to: >-
  Where possible, data were mapped to standardized terminologies including the
  Observational Medical Outcomes Partnership (OMOP) Common Data Model, a common data model
  for observational health data, and Digital Imaging and Communications in Medicine
  (DICOM), a commonly used standard for medical imaging data.
