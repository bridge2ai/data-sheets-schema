purposes:
  - name: Enable AI/ML research into type 2 diabetes and salutogenesis
    response: >-
      The purpose for creating the dataset was to enable future generations of artificial
      intelligence/machine learning (AI/ML) research to provide critical insights into type
      2 diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM
      is a growing public health threat. Yet, the current understanding of T2DM, especially
      in the context of salutogenesis, is limited. Given the complexity of T2DM, AI-based
      approaches may help with improving our understanding but a key issue is the lack of
      data ready for training AI models. The AI-READI dataset is intended to fill this gap.
  - name: Support downstream pseudotime manifold and artificial intelligence applications
    response: >-
      The multi-modal dataset being collected is being gathered to facilitate downstream
      pseudotime manifolds and various applications in artificial intelligence.

tasks:
  - name: Hypothesis-agnostic support for downstream AI/ML tasks
    response: >-
      No specific labeling was performed in the dataset, as the dataset is a
      hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
      applications. The current version of the dataset does not introduce new tasks or
      labeling, but does include a new recommended data split for the 2280 participants
      balancing training, validation, and testing sets for age, sex, races/ethnicities, and
      study group.
  - name: Pseudotime manifold analysis of disease trajectories
    response: >-
      The data collection process is specifically tailored to enable downstream pseudotime
      manifold analysis - an approach used to predict disease trajectories. This involves
      gathering and learning from complex, multimodal data from participants exhibiting
      varying disease severity, ranging from normal to insulin-dependent Type 2 Diabetes
      Mellitus (T2DM).

addressing_gaps:
  - name: Lack of AI-ready data for type 2 diabetes research
    response: >-
      Given the complexity of T2DM, AI-based approaches may help with improving our
      understanding but a key issue is the lack of data ready for training AI models. The
      AI-READI dataset is intended to fill this gap. The data acquisition protocol spans
      multiple domains (survey data, physical measurements, clinical data, imaging data,
      wearable device data, etc.) to enable downstream AI/ML analyses that may not be
      feasible with existing data sources such as claims or electronic health records data.

