    target_dataset: >-
      AI-READI dataset version 1, composed of data from the pilot data collection phase (204
      participants), distributed May 2024
    relationship_type: is_new_version_of
    description: >-
      The current version supersedes version 1, which contained only data collected during
      the pilot data collection phase.
  - name: AI-READI dataset version 2
    target_dataset: >-
      AI-READI dataset version 2, composed of data collected up to the end of the first full
      year of the study (1067 participants), distributed November 2024
    relationship_type: is_new_version_of
    description: >-
      The current version supersedes version 2 and adds data collected through the end of the
