subsets:
  - id: d4d:dataset/ai-readi-v3-public
    name: AI-READI version 3 public access data
    description: >-
      Some data that are not considered to be sensitive personal health data will be
      available to the public for download upon agreement with a license that defines how
      the data can be used. The public dataset will include survey data, blood and urine
      lab results, fitness activity levels, clinical measurements (e.g. monofilament and
      cognitive function testing), retinal images, ECG, blood sugar levels, and home air
      quality. Sex, race, and ethnicity data are not released with the public version of
      the dataset.
    is_data_split: false
    is_subpopulation: false
  - id: d4d:dataset/ai-readi-v3-controlled-access
    name: AI-READI version 3 controlled access data
    description: >-
      The full dataset will be accessible by entering into a data use agreement. The data
      held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
      sequencing data, past health records, and traffic and accident reports. The
      controlled access dataset will contain data regarding racial and ethnic origins,
      location (5-digit zip code), as well as motor vehicle accident reports. There is a
      possibility that raw data may be included in future releases of the controlled access
      dataset.
    is_data_split: false
    is_subpopulation: false

instances:
  - name: Participant record
    description: >-
      Each instance represents an individual patient. Each instance consists of all of the
      data available for an individual participating in the study. Multiple modalities of
      data are collected for each participant, including survey data, clinical data,
      retinal imaging data, environmental sensor data, continuous glucose monitor data, and
      wearable activity monitor data. These encompass tabular data, imaging data, and
      physiological signal/waveform data. There is no unstructured text data included in
      this dataset. All modalities, file formats, and devices are detailed in the dataset
      documentation at https://docs.aireadi.org.
    instance_type: individual patient (study participant)
    counts: 2280
    label: false
    label_description: >-
      No labels are provided. No specific labeling was performed in the dataset, as the
      dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential
      downstream AI/ML applications.
    missing_information:
      - name: Modality-level missingness across participants
        missing:
          - Data for one or more collection modalities for some participants.
        why_missing:
          - >-
            Yes, not all modalities are available for all participants. Some participants
            elected not to participate in some study elements. In a few cases, the data
            collection device did not have any stored results or was returned too late to
            retrieve the results (e.g. battery died, data was lost). In a few cases, there
            may have been a data collision at some point in the process and data has been
            lost.

anomalies:
  - name: Expected errors, noise, and technical failures
    anomaly_details:
      - >-
        In cases of survey data, skipped questions or incomplete responses are expected.
      - >-
        In cases of using wearables, improper use, technical failure such as battery
        failure or system malfunction are expected.
      - >-
        In cases of imaging data, patient uncooperation, noise that may obscure the images
        and technical failure such as system malfunction, and data transfer failures are
        expected.
      - >-
        Undilated fundus photography with the handheld Optomed Aurora is challenging
        because patients are not dilated, so the quality of the images varies from patient
        to patient and within the same patient.
      - >-
        Spectralis HRA imaging is operated by the imaging team and is not fully automated,
        so quality issues may arise, which may lead to skipping this modality and missing
        data.
      - >-
        FLIO imaging takes longer than a usual Spectralis OCT and exposes patients to
        uncomfortable levels of light, so it is performed as the last modality of an
        AI-READI visit; because of this patients may not be at their best possible
        compliance.

known_biases:
  - name: Imbalance across race, sex, and diabetes severity in released versions
    bias_type: sampling_bias
    bias_description: >-
      While the AI-READI's cross-sectional database ultimately aims to achieve balance
      across race/ethnicity, biological sex, and diabetes presence and severity, the pilot
      study is not balanced across these parameters. As enrollment is ongoing, the periodic
      updates to data releases may not have achieved balanced distribution across groups.
    affected_subsets:
      - Racial and ethnic groups
      - Biological sex groups
      - Diabetes presence and severity groups
    mitigation_strategy: >-
      Recruitment sampling procedures aimed at achieving approximately equal distribution
      of participants across sex, race, and diabetes severity. Uniform data collection
      protocols were implemented for all subjects, irrespective of their race/ethnicity,
      biological sex, or diabetes severity, across all study sites. The project team also
      prepared recommended data splits that are balanced as well as possible for sex,
      race/ethnicity and diabetes status.
  - name: Urban, hospital-based recruitment
    bias_type: selection_bias
    bias_description: >-
      Factors influencing the generalization of derived models include the predominantly
      urban and hospital-based recruitment, which may not fully capture diverse cultural
      and socioeconomic backgrounds. Recruitment pools were identified by screening
      Electronic Health Records (EHR) for diabetes and prediabetes ICD-10 codes for all
      patients who have had an encounter with the sites' health systems within the past 2
      years.
    mitigation_strategy: >-
      Three recording sites were strategically selected to achieve diverse recruitment: the
      University of Alabama at Birmingham (UAB), the University of California San Diego
      (UCSD), and the University of Washington (UW). The sites were chosen for geographic
      diversity across the United States and to ensure diverse representation across
      various racial and ethnic groups. Individuals from all demographic backgrounds were
      recruited at all 3 sites. The selection of study sites was intended to ensure
      equitable representation and minimize the potential for sampling bias.
  - name: Racial and ethnic groups not represented in the cohort
    bias_type: representation_bias
    bias_description: >-
      The study cohort may not provide a comprehensive representation of the population, as
      it does not include other races/ethnicities such as Pacific Islanders and Native
      Americans.
    affected_subsets:
      - Pacific Islanders
      - Native Americans

known_limitations:
  - name: Cohort representativeness
    limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population.
      Recruitment was predominantly urban and hospital-based, which may not fully capture
      diverse cultural and socioeconomic backgrounds, and some races/ethnicities such as
      Pacific Islanders and Native Americans are not included.
    scope_impact: >-
      These factors might limit the generalization of models derived from the data.
  - name: Eligibility restrictions on the study population
    limitation_type: scope_limitation
    limitation_description: >-
      Eligibility for the study required the ability to provide consent, an age of 40 years
      or older, and the ability to speak and read English. Persons who were pregnant, had
      gestational diabetes, or had Type 1 diabetes were excluded.
    scope_impact: >-
      The dataset covers only adults aged 40 and older who speak and read English and who
      either have type 2 diabetes or do not have diabetes.
  - name: Incomplete modality coverage per participant
    limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not
      to participate in some study elements; in a few cases the data collection device did
      not have any stored results or was returned too late to retrieve the results (e.g.
      battery died, data was lost); and in a few cases a data collision may have occurred
      and data has been lost.
    scope_impact: >-
      Analyses that require complete multi-modal data for every participant will operate on
      a subset of instances.
  - name: Single visit per participant
    limitation_type: temporal_limitation
    limitation_description: >-
      There is currently only one visit per participant, and the database is described as
      cross-sectional. Approximately 4% of participants are expected to undergo a follow-up
      examination in Year 4.
    scope_impact: >-
      Longitudinal within-participant analyses are not supported by the current version of
      the dataset.
  - name: Visual acuity variables changed between versions
    limitation_type: integration_limitation
    limitation_description: >-
      The data fields/types are largely the same as the prior version of the dataset.
      However, the Snellen visual acuity variables were dropped in this version of the
      dataset, such that now only logMAR visual acuity measurements are available.
    scope_impact: >-
      Analyses combining this version with earlier versions cannot rely on Snellen visual
      acuity variables being present in this version.

