  - type 2 diabetes mellitus
  - T2DM
  - salutogenesis
  - multimodal data
  - retinal imaging
  - optical coherence tomography
  - continuous glucose monitoring
  - wearable devices
  - environmental sensing
  - artificial intelligence
  - machine learning
  - NIH Bridge2AI
  - AI-READI

creators:
  - description: >-
      This dataset was created by members of the AI-READI project, hereby referred to as the
      AI-READI Consortium. Details about each member and their institutions are available on
      the project website at https://aireadi.org.
  - description: >-
      The curation and generation team spans a wide range of experience, including senior,
      mid-career, and early career faculty members as well as clinical research coordinators,
      staff, and interns. Collectively they cover areas of expertise including clinical
      research, data collection, data management, data standards, bioinformatics, team science,
      and ethics, among others (https://aireadi.org/team).

funders:
  - description: >-
      Creation of the dataset was funded by the National Institutes of Health (NIH) through the
      Bridge2AI Program (https://commonfund.nih.gov/bridge2ai). The healthsheet reports the
      grant number as "OT2ODO32644" in the Motivation section and as award "OT2OD032644" in the
      Collection section; both spellings appear in the source and are preserved here rather than
      reconciled. Further information about the funding is available at
      https://reporter.nih.gov/search/T-mv2dbzIEqp9V6UJjHpgw/project-details/10885481. The
      funding institution does not create or manage the dataset; the dataset is created and
      managed by the awardees of the grant (the AI-READI Consortium).

purposes:
  - description: >-
      The dataset was created to enable future generations of artificial intelligence/machine
      learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus
      (T2DM), including salutogenic pathways to return to health.
  - description: >-
      The multi-modal dataset is being gathered to facilitate downstream pseudotime manifold
      analyses and various applications in artificial intelligence.

addressing_gaps:
  - description: >-
      T2DM is a growing public health threat, yet current understanding of T2DM, especially in
      the context of salutogenesis, is limited. Given the complexity of T2DM, AI-based
      approaches may help improve understanding, but a key issue is the lack of data ready for
      training AI models. The AI-READI dataset is intended to fill this gap.
  - description: >-
      The acquisition protocol spans multiple domains (survey, physical measurements, clinical,
      imaging, wearable device data) specifically to enable downstream AI/ML analyses that may
      not be feasible with existing data sources such as claims or electronic health record
      data.

tasks:
  - description: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease trajectories,
      by gathering and learning from complex, multimodal data from participants exhibiting
      varying disease severity, ranging from normal to insulin-dependent T2DM.
  - description: >-
      The dataset is hypothesis-agnostic and is aimed at facilitating multiple potential
      downstream AI/ML applications rather than a single predefined task. No specific labeling
      or predefined task was performed by the dataset creators.

intended_uses:
  - description: >-
      Enabling AI/ML research into type 2 diabetes mellitus, including salutogenic pathways from
      disease to health, using harmonized multimodal data across survey, clinical, imaging,
      continuous glucose monitoring, wearable activity, and environmental sensing domains.

instances:
  - description: >-
      Each instance represents an individual patient (study participant). There are 2280
      instances in the current version of the dataset (version 3, released fall 2025). The first
      version, from the pilot data collection phase, had 204 instances; the second version, from
      the first year of the study, had 1067 instances.
  - description: >-
      Each instance consists of all of the data available for an individual participating in the
      study. Multiple modalities are collected per participant, including survey data, clinical
      data, retinal imaging data, environmental sensor data, continuous glucose monitor data,
      and wearable activity monitor data. These encompass tabular data, imaging data, and
      physiological signal/waveform data. There is no unstructured text data in this dataset.
      The exact REDCap data collection forms are available at
      https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf, and all modalities, file
      formats, and devices are detailed at https://docs.aireadi.org/.

relationships:
  - description: >-
      All instances are part of the same prospective data generation project (AI-READI). There
      is currently only one study visit per participant. Approximately 4% of participants are
      expected to undergo a follow-up examination in Year 4 of the project.

splits:
  - description: >-
      The current version of the dataset comes with recommended data splits. Because sex, race,
      and ethnicity data are not released with the public version of the dataset, the project
      team prepared splits in proportions of 70% training / 15% validation / 15% testing, where
      the validation and test sets are balanced as well as possible for sex, race/ethnicity, and
      diabetes status (no diabetes, prediabetes/lifestyle controlled, oral medication
      controlled, and insulin controlled). This split is new in version 3 and covers all 2280
      participants, balancing age, sex, races/ethnicities, and study group. The split is
      intended to reduce disparities in models developed using this dataset.

subpopulations:
  - description: >-
      Participants are grouped by diabetes status into four study groups used for split
      balancing: no diabetes, prediabetes/lifestyle controlled, oral medication controlled, and
      insulin controlled.
  - description: >-
      The healthsheet answers "No" to whether the dataset identifies demographic
      sub-populations. This answer concerns demographic labels in the released public dataset:
      sex, race, and ethnicity are not released in the public version and are held under
      controlled access. No regulation prevented demographic data collection in the study.

content_warnings:
  - description: >-
      The healthsheet states that the dataset does not contain data that, if viewed directly,
      might be offensive, insulting, threatening, or otherwise pose a safety risk (such as
      psychological safety and anxiety).

anomalies:
  - description: >-
      In survey data, skipped questions or incomplete responses are expected.
  - description: >-
      In wearable device data, improper use and technical failures such as battery failure or
      system malfunction are expected. In a few cases the collection device had no stored
      results or was returned too late to retrieve results (e.g., battery died, data lost).
  - description: >-
      In imaging data, patient uncooperation, noise that may obscure the images, technical
      failures such as system malfunction, and data transfer failures are expected. For
      undilated handheld fundus photography (Optomed Aurora), image quality varies from patient
      to patient and within the same patient. For operator-dependent modalities such as
      Spectralis HRA, quality issues may arise and may lead to skipping the modality and missing
      data. FLIO is performed last in the visit and exposes patients to uncomfortable levels of
      light, so participant compliance may be reduced.
  - description: >-
      In a few cases there may have been a data collision at some point in the process, and data
      has been lost.

missing_data_documentation:
  - description: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements. In a few cases the data collection device did not have
      stored results or was returned too late to retrieve results, and in a few cases data was
      lost due to a data collision during processing.
  - description: >-
      The Snellen visual acuity variables that were present in the prior version were dropped in
      this version of the dataset, such that only logMAR visual acuity measurements are
      available.

confidential_elements:
  - description: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential, and that no personally identifiable information is included in the dataset.

sensitive_elements:
  - description: >-
      The public dataset does not contain data considered sensitive. The controlled access
      dataset contains data regarding racial and ethnic origins, location (5-digit zip code),
      and motor vehicle accident reports. Controlled access content also includes sex, genetic
      sequencing data, past health records, and traffic reports.

is_deidentified:
  description: >-
    No personally identifiable information is included in the released dataset, and the dataset
    has been reviewed internally by AI-READI team members for quality checks and to ensure that
    no personally identifiable information was accidentally included. The healthsheet questions
    asking what measures were taken to avoid re-identification, and whether any pre-processing
    for de-identification was performed, were left unanswered in the source. A theoretical risk
    of future re-identification is acknowledged.

participant_privacy:
  - description: >-
      Sensitive personal health data are withheld from the public release and made available
      only under controlled access via a data use agreement. Raw data are not shared outside the
      project team in part because the raw data may accidentally include personal health
      information or personally identifiable information (e.g., in free text fields).

known_biases:
  - description: >-
      While the AI-READI cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not
      balanced across these parameters. As enrollment is ongoing, periodic data releases may not
      have achieved balanced distribution across groups.
  - description: >-
      Recruitment was predominantly urban and hospital-based, which may not fully capture
      diverse cultural and socioeconomic backgrounds. Recruitment pools were identified by
      screening Electronic Health Records for diabetes and prediabetes ICD-10 codes among
      patients with an encounter at the sites' health systems in the past two years, which
      constrains the sampled population.
  - description: >-
      The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races/ethnicities such as Pacific Islanders and Native Americans.

known_limitations:
  - description: >-
      Factors that may limit generalization of derived models include the number and diversity
      of devices used, data recording specificities, and the number and diversity of recording
      sites (three: University of Alabama at Birmingham, University of California San Diego,
      University of Washington). Information on device make and model, including specific
      modalities such as macula scans or wide scans during OCT, was documented to ensure
      repeatability, and multiple devices were included for a single measure to enhance
      generalizability and represent the diverse range of equipment used in clinical settings.
  - description: >-
      Eligibility criteria restrict the population: participants had to be able to provide
      consent, be 40 years or older, and speak and read English; individuals who were pregnant,
      had gestational diabetes, or had Type 1 diabetes were excluded.
  - description: >-
      Data collection occurred only in the USA, and English was the only language used for
      communication with study participants.
  - description: >-
      There is currently only one visit per participant, so the released data are
      cross-sectional.

acquisition_methods:
  - description: >-
      Acquisition varied by domain. Some data were directly observable (such as labs, vitals,
      and retinal imaging), whereas other data were reported by subjects (e.g., survey
      responses). Verification of data entry was performed when possible, for example
      cross-referencing entered medications with medications that were physically brought in or
      photographed by each study participant. Details for each data domain are available at
      https://docs.aireadi.org.

collection_mechanisms:
  - description: >-
      Survey and clinical form data were captured in REDCap; the exact forms used are available
      at https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf. Procedures for data
      collection and processing are documented at https://docs.aireadi.org.
  - description: >-
      Environmental sensor: participants were sent home with a custom-designed environmental
      sensor unit (the LeeLab Anura), used for 10 continuous days before returning the device to
      clinical research coordinators for data download.
  - description: >-
      Continuous glucose monitoring: Dexcom G6, a real-time integrated continuous glucose
      monitoring system (iCGM) that directly monitors blood glucose levels without requiring
      finger sticks and must be worn continuously to collect data.
  - description: >-
      Wearable accelerometer / physical activity monitor: Garmin Vivosmart 5 fitness activity
      tracker.
  - description: >-
      Heart rate was read from EKG or blood pressure measurement devices. Blood pressure devices
      used across sites were the OMRON HEM 907XL Blood Pressure Monitor, the Medline MDS4001
      Automatic Digital Blood Pressure Monitor, and the Welch Allyn 6000 series vital signs
      monitor with Welch Allyn FlexiPort reusable blood pressure cuff. EKG was recorded with a
      Philips PageWriter TC30 Cardiograph.
  - description: >-
      Visual acuity: M&S Technologies EVA device, administered at 4 meters from a 12x20 inch
      touch-screen monitor. Photopic testing used no neutral density filters and a general
      occluder, with participants wearing their own prescription spectacles or trial frames;
      mesopic testing used a neutral density (ND) filter, either a lens added to trial frames or
      a handheld ND-occluder over the glasses.
  - description: >-
      Contrast sensitivity: MARS Letter Contrast Sensitivity test (Perceptrix), conducted
      monocularly under photopic (general occluder) and mesopic (neutral density occluder with
      low luminance filter lens) conditions, in the standardized card order Photopic OD,
      Photopic OS, Mesopic OD, Mesopic OS. Background luminance of the charts fell within 60 to
      120 cd/m2 (optimal 85 cd/m2), illuminance between 189 and 377 lux (optimal 267 lux), and
      viewing distance nominally 50 cm (range 40 to 59 cm). Patients wore appropriate near
      correction (reading glasses or trial frames with +2.00D lenses); all testing was undilated.
      Patients read letters left to right across each line and were encouraged to guess; testing
      terminated after two consecutive errors or at the end of the chart. Log contrast
      sensitivity was computed by multiplying the number of errors prior to the final correct
      letter by 0.04 and subtracting from the log CS value at the final correct letter.
  - description: >-
      Autorefraction: KR 800 Auto Keratometer/Refractor. Lensometry: NIDEK LM-600P Auto
      Lensometer, Topcon CL-200 computerized lensometer, and Topcon CL-300 computerized
      lensometer.
  - description: >-
      Undilated fundus photography: Optomed Aurora IQ handheld non-mydriatic fundus camera with
      50 degree field of view, 5 Mpix sensor, and high-contrast optical design. Images are taken
      undilated in a dark room with the patient seated and laying back.
  - description: >-
      Dilated fundus photography: iCare EIDON widefield TrueColor confocal fundus imaging system
      capturing images up to 200 degrees, with TrueColor, blue, red, red-free, and infrared
      confocal modalities, operating without dilation (minimum pupil 2.5 mm) in fully automated
      or manual modes. AI-READI EIDON imaging uses two main modalities: Single Field Central
      IR/FAF and Smart Horizontal Mosaic, acquired in fully automated mode in a dark room.
  - description: >-
      Spectralis HRA+OCT (Heidelberg Engineering): ophthalmic imaging system combining optical
      coherence tomography with retinal angiography and confocal scanning laser ophthalmoscope
      (cSLO) technology. AI-READI imaging is done in a dark room using the ONH-RC, PPole-H, and
      macular OCTA modalities; the machine is operator-driven and not fully automated.
  - description: >-
      DRI OCT Triton (Topcon Healthcare): swept-source OCT combined with multimodal fundus
      imaging, with a 1,050 nm wavelength light source and a non-mydriatic color fundus camera.
      Imaging is done in a dark room with automatic positioning and minimal imager intervention,
      using 12.0x12.0 mm and 6.0x6.0 mm OCTA and 12.0x9.0x6.0 mm 3D horizontal and radial scan
      modes.
  - description: >-
      Maestro2 3D OCT (Topcon Healthcare): robotic OCT and color fundus camera system capable of
      a 12 mm x 9 mm wide-field OCT scan including the macula and optic disc, plus
      high-resolution non-mydriatic true color fundus photography, OCT, and OCTA with a single
      button press. Protocols include 12.0x9.0 mm widefield, 6.0x6.0 mm 3D macula scan, and
      6.0x6.0 mm OCTA at a 50 kHz scan rate.
  - description: >-
      FLIO (Heidelberg Engineering): Fluorescence Lifetime Imaging Ophthalmoscopy, a
      non-invasive technique measuring fluorescence lifetimes to characterize metabolic and
      functional status of the retina. Performed by an operator in a dark room; it is scheduled
      as the last modality of an AI-READI visit because it takes longer than a usual Spectralis
      OCT and exposes patients to uncomfortable levels of light.
  - description: >-
      Cirrus 5000 Angioplex (Carl Zeiss Meditec): high-definition OCT system providing
      non-invasive imaging of retinal microvasculature. Protocols include 512x512 and 200x200
      macula and ONH scans, macular OCTA, a 60-degree OCTA widefield view, 8x8 mm single scans,
      and 14x14 mm automated OCTA montage.
  - description: >-
      Monofilament testing for peripheral neuropathy: standard 10 g monofilament applied to
      different points on the plantar surface of the feet. Patients confirm sensation by saying
      "yes"; if they do not sense the monofilament after it bends they are considered insensate.
      Insensate areas are retested for confirmation and the sequence is repeated randomly at
      each testing site on each foot until results are obtained. Results are recorded on an iPad,
      laptop, or paper questionnaire and entered directly into the project's REDCap by clinical
      research staff.
  - description: >-
      Montreal Cognitive Assessment (MoCA): in-office screening tool for mild cognitive
      impairment and early dementia, evaluating memory, executive functioning, attention,
      language, visuospatial ability, orientation, visuoconstructional skills, conceptual
      thinking, and calculations. It generates a total score (maximum 30; below 24 indicates
      cognitive impairment, 26 and above is considered normal) and six domain-specific index
      scores. Known disadvantages include the need for scorer training and the influence of
      education, socioeconomic factors, and depression or other mental health issues. AI-READI
      research staff administer the test on an iPad using the pre-installed MoCA Duo app, which
      captures patient responses interactively.

data_collectors:
  - description: >-
      Details about the AI-READI team members involved in the data collection process are
      available at https://aireadi.org/team. Their effort was supported by the National
      Institutes of Health award OT2OD032644 based on the percentage of effort contributed, with
      salaries aligned to the funding guidelines at each site. Roles named in the source include
      clinical research coordinators, data managers, the imaging team, site principal
      investigators, and AI-READI research staff at the three recruiting sites.

participant_compensation:
  - description: >-
      Study subjects received compensation of $200 for the study visit, provided through the
      grant funding. Transportation assistance (rideshare services) was offered to study
      participants who endorsed barriers to transporting themselves to study visits.

collection_timeframes:
  - description: >-
      For this version of the dataset, the timeframe for data collection was July 19, 2023 to
      May 1, 2025.
  - description: >-
      The overall project timeline spans four years, with one year dedicated to protocol
      development and training and years 2-4 allocated to subject recruitment and data
      collection. Approximately 4% of participants are expected to undergo a follow-up
      examination in Year 4. The timeframe also allows collection of the highest number of
      subjects possible to support balanced representation of racial and ethnic groups and to
      mitigate biases in computer vision algorithms.

sampling_strategies:
  - description: >-
      The dataset is described as containing all possible instances rather than a sample. The
      source's literal wording is that "the dataset contains data from all participants who have
      been enrolled during the first year of data collection for AI-READI"; this wording is
      internally inconsistent with the same source's statement that this version covers data
      collected from July 19, 2023 to May 1, 2025 (through the end of the second year of the
      study) for 2280 participants. Both statements are reported here as they appear rather than
      reconciled. The healthsheet answers "N/A" to the question of sampling strategy from a
      larger set.
  - description: >-
      Recruitment sampling procedures were aimed at achieving approximately equal distribution
      of participants across sex, race, and diabetes severity. Three recording sites were
      strategically selected to achieve diverse recruitment: the University of Alabama at
      Birmingham (UAB), the University of California San Diego (UCSD), and the University of
      Washington (UW), chosen for geographic diversity across the United States and to ensure
      diverse representation across racial and ethnic groups. Individuals from all demographic
      backgrounds were recruited at all three sites. Uniform data collection protocols were
      implemented for all subjects irrespective of race/ethnicity, biological sex, or diabetes
      severity, across all study sites, to minimize the potential for sampling bias.
  - description: >-
      Eligibility criteria for participation. Inclusion: able to provide consent; 40 years of
      age or older; persons with or without type 2 diabetes; must speak and read English.
      Exclusion: must not be pregnant; must not have gestational diabetes; must not have Type 1
      diabetes.

direct_collection:
  - description: >-
      Data were collected directly from participants across the three recruiting sites.
      Recruitment pools were identified by screening Electronic Health Records (EHR) for
      diabetes and prediabetes ICD-10 codes for all patients who had an encounter with the
      sites' health systems within the past two years. Data collection occurred in the USA.

collection_notifications:
  - description: >-
      Each individual was aware of the data collection, as this was not passive data collection
      or secondary use of existing data, but rather active data collection directly from
      participants.

collection_consents:
  - description: >-
      Informed consent to participate was required before participation in any part of the
      protocol, including questionnaires. Potential participants were given the option to read
      all consent documentation electronically (e-consent) before their visit and to give
      consent with an electronic signature without verbal communication with a clinical research
      coordinator. Participants could access e-consent documentation in REDCap and decide at
      that point that they did not want to participate or would like additional information. The
      approved consent form for the principal project site, the University of Washington, is
      available at
      https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
      The other clinical sites had IRB reliance and used the same consent form, with minor
      institution-specific language incorporated depending on individual institutional
      requirements.

informed_consent:
  - description: >-
      Consent was obtained via an IRB-approved informed consent form, offered as e-consent in
      REDCap with electronic signature, required before any protocol activity. Withdrawal was
      permitted at any time; the consent document clearly communicates that data already shared
      or used would remain in the dataset.

consent_revocations:
  - description: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset.
      This is clearly communicated in the consent document.

ethical_reviews:
  - description: >-
      The initial IRB approval at the University of Washington was received on December 20,
      2022. The initial approval letter is available at
      https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf. An annual renewal
      application to the IRB about the status and progress of the study is required and is due
      within 90 days of expiration.

human_subject_research:
  description: >-
    The dataset relates to people and derives from active human subjects research. IRB approval
    was obtained at the University of Washington, with an initial approval date of December 20,
    2022 and annual renewal required within 90 days of expiration. The source does not state a
    protocol number; the only identifier available appears within the filename of the linked
    approval letter (Approval_STUDY00016228_Lee_initial.pdf) and is not asserted as a study
    number by the source. The other clinical sites operated under IRB reliance using the same
    consent form with minor institution-specific language. Participants were recruited and
    consented at three US sites (UAB, UCSD, UW).

at_risk_populations:
  description: >-
    Eligibility criteria excluded pregnant individuals and persons with gestational diabetes,
    and required participants to be 40 years of age or older and able to provide consent.
    Accessibility measurements were not specifically assessed, but transportation assistance
    (rideshare services) was offered to participants who endorsed barriers to transporting
    themselves to study visits.

data_protection_impacts:
  - description: >-
      No data protection impact analysis has been conducted.

raw_sources:
  - description: >-
      Raw data are saved and expected to be preserved by the AI-READI project at least for the
      duration of the project, but are not anticipated to be shared outside the project team at
      present, because they have not been mapped to standardized terminologies and because raw
      data may accidentally include personal health information or personally identifiable
      information (e.g., in free text fields). There is a possibility that raw data may be
      included in future releases of the controlled access dataset.

cleaning_strategies:
  - description: >-
      Several quality control measures were used at the time of data entry/acquisition. Clinical
      data outside of expected min/max ranges were flagged in REDCap, visible in reports viewed
      by clinical research coordinators (CRCs) and Data Managers. Using these REDCap reports as
      guides, Data Managers and CRCs examined participant records and determined if an error was
      likely. Data were checked for and edited on: (1) credibility, based on range checks to
      determine if all responses fall within a prespecified reasonable range; (2) incorrect flow
      through prescribed skip patterns; (3) missing data that can be directly filled from other
      portions of an individual's record; and (4) the omission and/or duplication of records.
      Editing was only done under the guidance and approval of the site PI. If corrected data
      were available elsewhere in the respondent's answers, the error was corrected; if there was
      no logical or appropriate way to correct the data, the site PI reviewed the values and
      decided whether those values should be removed.
  - description: >-
      No data were excluded from the dataset at the time of preprocessing.

preprocessing_strategies:
  - description: >-
      Once data were sent from each of the study sites to the central project team, additional
      processing steps were conducted in preparation for dissemination. All data were mapped to
      standardized terminologies when possible, such as the Observational Medical Outcomes
      Partnership (OMOP) Common Data Model and the Digital Imaging and Communications in
      Medicine (DICOM) standard for medical imaging data. Details about the data processing
      approaches for each data domain/modality are described in the dataset documentation at
      https://docs.aireadi.org.
  - description: >-
      The healthsheet question about pre-processing for de-identification of patients was left
      unanswered in the source.

labeling_strategies:
  - description: >-
      No labels are provided. No specific labeling was performed in the dataset, as it is a
      hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML
      applications. Consequently there are no gold-standard or proxy labels, no human labelers,
      no rater agreement statistics, and no labeling software to share. There are no formal
      guidelines in place for future researchers creating new labels or defining new tasks.

existing_uses:
  - description: >-
      The healthsheet reports that the dataset has not been used for any tasks already.

use_repository:
  - description: >-
      There is no repository that links to papers or systems that use the dataset, beyond
      general indices such as Google Scholar. Use of the dataset requires citation of the
      resources specified at https://docs.aireadi.org.

future_use_impacts:
  - description: >-
      To the extent of the creators' knowledge, no uses of the dataset are currently anticipated
      that could result in unfair treatment or harm. However, there is a theoretical risk of
      future re-identification.
  - description: >-
      Because enrollment is ongoing, periodic updates to data releases may not have achieved the
      intended balanced distribution across racial groups; future users should account for
      residual imbalance across sex, race/ethnicity, and diabetes severity.

discouraged_uses:
  - description: >-
      The AI-READI dataset license imposes certain restrictions on the usage of the data. The
      restrictions are described in the license files available at
      https://doi.org/10.5281/zenodo.17555036. The healthsheet answers the question of tasks for
      which the dataset should not be used by referring back to these license terms.

third_party_sharing:
  - description: >-
      The dataset will be distributed and be available for public use outside the entity on
      behalf of which it was created. Non-sensitive data are available to the public for
      download upon agreement with a license that defines how the data can be used; the full
      dataset is accessible by entering into a data use agreement. The license places strong
      requirements around data usage, security, and secondary sharing.

distribution_formats:
  - description: >-
      The dataset is available through the FAIRhub platform (http://fairhub.io/). The dataset
      DOI is https://doi.org/10.60775/fairhub.3. Data are released as a public tier and a
      controlled access tier; file formats for each modality are detailed in the dataset
      documentation at https://docs.aireadi.org/.

distribution_dates:
  - description: >-
      The first version of the dataset was distributed in May 2024, the second version in
      November 2024, and the third version (documented here) in November 2025.

license_and_use_terms:
  description: >-
    The license file containing the terms for reusing the AI-READI dataset is available at
    https://doi.org/10.5281/zenodo.17555036. These license terms were specifically tailored to
    enable reuse of the AI-READI dataset (and other clinical datasets) for commercial or
    research purposes while placing strong requirements around data usage, security, and
    secondary sharing to protect study participants, especially when data are reused for
    artificial intelligence and machine learning applications. Use of the dataset requires
    citation of the resources specified at https://docs.aireadi.org.

ip_restrictions:
  description: >-
    Third-party IP-based or other restrictions are addressed by reference to the dataset license
    at https://doi.org/10.5281/zenodo.17555036. The accompanying documentation at
    https://docs.aireadi.org is shared under CC-BY 4.0, so there are no restrictions associated
    with its use.

regulatory_restrictions:
  description: >-
    Export control and other regulatory restrictions are addressed by reference to the dataset
    license at https://doi.org/10.5281/zenodo.17555036.

maintainers:
  - description: >-
      The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub
      through Microsoft Azure. Contact information for the owner/curator/manager is provided in
      the README file included with the dataset.

errata:
  - description: >-
      The healthsheet question asking whether there is an erratum was left unanswered in the
      source.

updates:
  description: >-
    The dataset will not be updated in place. Rather, new versions of the dataset will be
    released with additional instances as more study participants complete the study visit.
    Releases are planned approximately once a year with additional data from participants
    enrolled since the previous release. Enrollment is ongoing, so future versions will include
    larger numbers of subjects.

version_access:
  description: >-
    The dataset is released as static versions. This is the third version, consisting of data
    collected through the end of the second year of the study (July 19, 2023 to May 1, 2025).
    Prior datasheets are published for earlier versions: version 1 (pilot data collection phase,
    204 participants) at https://docs.aireadi.org/docs/1/dataset/healthsheet, and version 2
    (through the end of the first full year, 1067 participants total) at
    https://docs.aireadi.org/docs/2/dataset/healthsheet. Data fields are largely the same as the
    prior version, except that Snellen visual acuity variables were dropped. The healthsheet
    answers "N/A" to whether older versions will continue to be supported, noting that the
    dataset is not updated but reissued as new versions.

retention_limit:
  description: >-
    There are no limits on the retention of the data associated with the instances.

extension_mechanism:
  description: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside
    of those who are involved in the project.

external_resources:
  - description: >-
      The dataset is self-contained but relies on the dataset documentation for users requiring
      additional information about the provenance of the dataset. The documentation is available
      at https://docs.aireadi.org and is shared under the CC-BY 4.0 license, so there are no
      restrictions associated with its use.
  - description: >-
      The AI-READI dataset license files are archived at https://doi.org/10.5281/zenodo.17555036.
  - description: >-
      The AI-READI project website (https://aireadi.org) and team page
      (https://aireadi.org/team) describe consortium members and their institutions.
  - description: >-
      NIH Bridge2AI Program page (https://commonfund.nih.gov/bridge2ai) and NIH RePORTER project
      record
      (https://reporter.nih.gov/search/T-mv2dbzIEqp9V6UJjHpgw/project-details/10885481).