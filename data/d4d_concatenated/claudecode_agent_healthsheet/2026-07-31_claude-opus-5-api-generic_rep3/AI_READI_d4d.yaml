id: https://doi.org/10.60775/fairhub.3
name: AI-READI Flagship Dataset of Type 2 Diabetes
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights (AI-READI)
  dataset consists of data collected from individuals with and without Type 2 Diabetes
  Mellitus (T2DM) and harmonized across three data collection sites. The composition of the
  dataset was designed with future AI/Machine Learning studies in mind, including recruitment
  sampling procedures aimed at achieving approximately equal distribution of participants
  across sex, race, and diabetes severity, and a multi-domain data acquisition protocol
  (survey data, physical measurements, clinical data, imaging data, wearable device data)
  intended to enable downstream AI/ML analyses that may not be feasible with existing sources
  such as claims or electronic health record data. The stated goal is to better understand
  salutogenesis (the pathway from disease to health) in T2DM. Data not considered sensitive
  personal health data are available to the public for download upon agreement with a license
  that defines how the data can be used; the full dataset is accessible by entering into a data
  use agreement. The public dataset includes survey data, blood and urine lab results, fitness
  activity levels, clinical measurements (e.g., monofilament and cognitive function testing),
  retinal images, ECG, blood sugar levels, and home air quality. Data held under controlled
  access include 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health
  records, and traffic and accident reports. The overall enrollment goal is a balanced
  distribution between different racial groups; because enrollment is ongoing, periodic data
  releases may not have achieved balanced distribution across groups. This record documents
  version 3 of the dataset, which contains data from 2280 participants collected between
  July 19, 2023 and May 1, 2025.
doi: 10.60775/fairhub.3
version: "3"
language: English
license: >-
  AI-READI dataset license; the license file containing the terms for reusing the AI-READI
  dataset is available at https://doi.org/10.5281/zenodo.17555036. The accompanying dataset
  documentation at https://docs.aireadi.org is shared under CC-BY 4.0.
page: https://docs.aireadi.org
conforms_to: >-
  Where possible, data were mapped to standardized terminologies, including the Observational
  Medical Outcomes Partnership (OMOP) Common Data Model for observational health data and
  Digital Imaging and Communications in Medicine (DICOM) for medical imaging data. The source
  describes this mapping as performed "when possible" rather than as full conformance.
created_by: AI-READI Consortium
