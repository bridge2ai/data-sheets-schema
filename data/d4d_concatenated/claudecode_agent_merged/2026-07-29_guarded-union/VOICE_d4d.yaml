- id: https://b2ai-voice.org/preprocessing/bids-conversion
  name: Conversion to BIDS and phenotype assembly
  preprocessing_details:
  - The raw audio files and the questionnaire data retrieved from reproschema-ui or
    exported from REDCap were converted to be compliant with the Brain Imaging Data
    Structure v1.9.0.
  - Pediatric data collected through reproschema-ui is extracted and transformed into
    REDCap format, and subsequently converted to the Brain Imaging Data Structure.
  - The resulting layout places phenotype tables under confounders, demographics,
    diagnosis, enrollment, questionnaire and task subfolders, with per-participant
    audio under sub-<participant_id>/ses-<participant_id>/audio as paired .wav and
    .json files named sub<participant_id>_ses<participant_id>_task-<task_name>.
  - The questionnaire features are collected and distributed in the phenotype folder
    format and can be used for cohort selection.
- id: https://b2ai-voice.org/preprocessing/deidentification-pipeline
  name: De-identification preprocessing
  preprocessing_details:
  - 'The healthsheet records that pre-processing for de-identification was performed:
    the data were extracted from the raw audio to limit re-identification and only
    the extracted features are released with the dataset.'
  - No instances were excluded from the dataset at the time of preprocessing.
prohibited_uses:
- id: https://b2ai-voice.org/prohibited/reidentification
  name: Re-identification and harmful use
  description: The dataset is not to be used to attempt to re-identify research participants,
    nor for any actions that could reasonably lead to re-identification, and not for
    any purpose that could foreseeably cause harm or stigmatisation to research participants,
    their families, communities or specific populations.
  prohibition_reason:
  - Restriction stated in the Registered Data Access Agreement, reflecting the B2AI-Voice
    Consortium's commitment to advancing ethical and trustworthy research practices
    that respect and protect the rights and interests of research participants.
- id: https://b2ai-voice.org/prohibited/ip-blocking-and-sale
  name: Sale of data and restrictive intellectual property claims
  description: Sale of all or part of the data on any media is not permitted. Users
    agree not to make intellectual property claims on the data and not to use intellectual
    property protection, database rights or related rights in ways that would prevent
    or block access to, or use of, any element of the data or conclusions drawn directly
    from it, and to implement licensing policies that will not obstruct further research.
  prohibition_reason:
  - License restriction in the registered access agreement, intended to ensure that
    future use of the dataset remains unrestricted, in alignment with the Open Science
    principles upheld by the B2AI-Voice Consortium.
  - Users also agree to respect the Fort Lauderdale Agreement.
- id: https://b2ai-voice.org/prohibited/onward-disclosure
  name: Onward disclosure outside authorised persons
  description: Under the Data Transfer and Use Agreement, the recipient shall not
    disclose, release, sell, rent, lease, loan or otherwise grant access to the Data
    to any third party except Authorized Persons without the prior written consent
    of the Provider. Collaborators at other research organisations, and other research
    teams at the same organisation, must apply independently for access and sign their
    own Data Transfer and Use Agreement before accessing the data.
  prohibition_reason:
  - Contractual constraint in the Data Transfer and Use Agreement executed between
    the provider institution and the recipient institution.
publisher: https://physionet.org/
purposes:
- id: d4d:voice_purpose_database
  name: Build an ethically sourced voice database linked to health biomarkers
  description: Primary objective of the Bridge2AI-Voice data generation project.
  response: To build a large multi-institutional database of human voices, speech
    and respiratory sounds that is ethically sourced, diverse, and linked to multimodal
    health biomarkers to fuel voice AI research. The consortium aims to integrate
    the use of voice as a biomarker of health in clinical care by generating a substantial
    multi-institutional, ethically sourced and diverse voice database linked to multimodal
    health biomarkers, and to build predictive models to assist in screening, diagnosis,
    and treatment of a broad range of diseases.
- id: d4d:voice_purpose_gap
  name: Address the absence of large, well-documented clinical voice data
  description: Purpose statement given in the dataset healthsheet.
  response: The Bridge2AI Voice dataset was created to address a gap in the availability
    of large-scale, diverse, and well-documented voice data for use in clinical machine-learning
    applications. Previous studies on machine learning-based voice diagnosis produced
    promising results, but their sample sizes were too small, or they lacked the key
    metadata needed for training robust, clinically useful models. The goal is to
    facilitate the use of voice as a non-invasive, cost-effective biomarker for the
    screening, diagnosis, and monitoring of a wide range of health conditions.
- id: d4d:voice_purpose_standards
  name: Establish standards and infrastructure for audiomics
  description: Secondary objectives spanning standards, tooling, ethics, teaming and
    training.
  response: To introduce the field of acoustic biomarkers by developing new standards
    of acoustic and voice data collection and analysis for voice AI research; to develop
    software and cloud infrastructure for automated voice data collection through
    a smartphone application; to implement federated learning technology allowing
    analysis of multi-institutional data while minimizing data sharing; to develop
    guidelines for consenting to voice data collection, sharing and utilization; to
    build bridges between medical voice research, acoustic engineering and the AI/ML
    world; and to develop curricula and a community of voice AI researchers, especially
    from underserved communities.
raw_data_sources:
- id: https://b2ai-voice.org/raw-source/audio
  name: Raw audio recordings
  source_description: Raw audio waveforms captured by the Bridge2AI-Voice applications
    during acoustic tasks. The raw data, post de-identification, is saved in addition
    to the preprocessed data but is not accessible publicly.
  source_type:
  - participant recordings collected under study protocol
  access_details: Raw audio data is disseminated through controlled access only, to
    protect participants' privacy. Users interested in accessing the audio data from
    any Bridge2AI-Voice dataset can request access by emailing the Data Access Compliance
    Office at DACO@b2ai-voice.org. Institutional sign-off is required, and PhysioNet
    states that the data will be made available via Synapse at https://www.synapse.org/Synapse:syn72370534/
    for the adult cohort and https://www.synapse.org/Synapse:syn73617068 for the pediatric
    cohort.
  raw_data_format:
  - WAV audio organized under a BIDS-style layout as sub-<participant_id>/ses-<participant_id>/audio/sub<participant_id>_ses<participant_id>_task-<task_name>.wav
    with an accompanying .json sidecar.
- id: https://b2ai-voice.org/raw-source/redcap
  name: REDCap and ReproSchema source records
  source_description: Questionnaire, demographic, confounder, diagnosis and clinical
    validation records captured in REDCap for the adult cohort and in ReproSchema-UI
    for the pediatric cohort, together with clinical data reviewed from site electronic
    health records.
  source_type:
  - electronic data capture system
  - electronic health record extraction
  access_details: Identifiable PHI is kept on institutional REDCap databases with
    password-protected access, available only to investigators at the institution
    where the data was collected. The REDCap data dictionary, metadata and instrument
    PDFs are published at https://github.com/eipm/bridge2ai-redcap
  raw_data_format:
  - REDCap exports and ReproSchema-UI outputs, converted to tab-delimited values and
    to BIDS.
raw_sources:
- id: https://b2ai-voice.org/raw-data/retained-audio
  name: Retained raw audio
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - The raw data, post de-identification, is saved in addition to the preprocessed
    and cleaned data; it is saved and is not accessible publicly.
  - Raw audio transcripts were reviewed and any audio recordings that contained potentially
    identifying information or external voices were removed from the release.
  - For the pediatric v1.1 release, audio features for all free speech tasks were
    manually checked for the presence of unconsented speakers and personally identifiable
    information before release.
regulatory_restrictions:
  id: https://b2ai-voice.org/regulatory/restrictions
  name: Regulatory and export control restrictions
  regulatory_restrictions:
  - No export controls apply to the dataset.
  - 'The Health Insurance Portability and Accountability Act applies: the HIPAA de-identification
    rules are applied to the released dataset, the collection applications and storage
    servers are HIPAA compliant, and a partial HIPAA waiver was obtained for recruitment
    and screening.'
  - The data transferred under the Data Transfer and Use Agreement is covered under
    a Certificate of Confidentiality, which must be asserted against compulsory legal
    demands such as court orders and subpoenas for identifying information or characteristics
    of a research participant.
  hipaa_compliant: compliant
  other_compliance:
  - Certificate of Confidentiality (NIH)
  - The Data Transfer and Use Agreement records that the Data is not subject to the
    Federal Privacy Act of 1974 (that checkbox is not marked) and is not covered under
    HIPAA, FERPA or similar laws requiring additional special terms, being instead
    Personally Identifiable Information as defined in OMB Memorandum M-07-16.
  - Recipients must adhere to the specific requirements of PhysioNet.org, managed
    by the MIT Laboratory for Computational Physiology and supported by NIBIB under
    NIH grant R01EB030362, or to other data distribution mechanisms used by the provider.
  - Recipients warrant that they do not use coercion for labor or services as defined
    in section 787.06, Florida Statutes.
  - Canadian participating institutions comply with Canadian research ethics board
    requirements rather than the US single IRB process.
  confidentiality_level: restricted
