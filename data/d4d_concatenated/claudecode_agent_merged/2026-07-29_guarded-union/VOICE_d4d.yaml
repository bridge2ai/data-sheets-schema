ethical_reviews:
- id: https://b2ai-voice.org/ethical-review/usf-single-irb
  name: USF Single IRB review
  reviewing_organization: University of South Florida Institutional Review Board
  review_details:
  - 'Asked whether the clinical study has been reviewed and approved by at least one
    human subjects'' protection review board, the study metadata answers: submitted
    and approved by the USF Single IRB and subsite IRBs through the Single IRB process.'
  - All US-based institutions abide by the single IRB process; once the protocol is
    approved at USF, each participating institution submits review based on the single
    IRB at USF.
  - The IRB protocol is titled "Bridge2AI Voice Data Acquisition", with principal
    investigator Yael Bensoussan, MD MSc, FRCSC, version V1 dated January 17, 2023,
    and a revision history through V13 dated July 11, 2025.
- id: https://b2ai-voice.org/ethical-review/sickkids-reb
  name: Hospital for Sick Children Research Ethics Board review
  reviewing_organization: Research Ethics Board, Hospital for Sick Children
  review_details:
  - Data collection and sharing for the pediatric dataset was approved by the Research
    Ethics Board at the Hospital for Sick Children.
- id: https://b2ai-voice.org/ethical-review/canadian-rebs
  name: Canadian research ethics board reviews
  reviewing_organization: Mount Sinai Hospital, SickKids and University of Toronto
    research ethics boards
  review_details:
  - Canadian institutions do not abide by the single IRB process and apply for a separate
    research ethics board application to comply with Canadian regulations; a copy
    of the approved application is submitted with the USF application.
  - Genomic data is collected and analyzed only at the University of Toronto and Mount
    Sinai Hospital under a separate protocol and REB approval, a copy of which is
    submitted to the USF IRB.
