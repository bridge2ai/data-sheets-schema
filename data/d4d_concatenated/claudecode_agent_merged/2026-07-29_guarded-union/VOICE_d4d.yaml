file_collections:
- id: d4d:voice_files_features
  name: features
  path: features
  collection_type:
  - processed_data
  description: Dense binary Parquet feature files - ppgs.parquet, sparc_ema.parquet,
    sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet, torchaudio_spectrogram.parquet,
    torchaudio_mfcc.parquet, torchaudio_pitch.parquet and torchaudio_mel_spectrogram.parquet
    - together with plain-text audio_quality_metrics.tsv and static_features.tsv,
    each accompanied by a JSON data dictionary of the same file stem.
- id: d4d:voice_files_phenotype
  name: phenotype
  path: phenotype
  collection_type:
  - processed_data
  description: Organized information collected from the participant or another individual
    during their encounter, arranged into confounders, demographics, diagnosis, enrollment,
    questionnaire and task subfolders. Each TSV file is paired with a JSON data dictionary
    whose keys match the column names and whose values give the column description,
    the question asked and the data type of the response.
- id: d4d:voice_files_metadata
  name: metadata
  path: metadata
  collection_type:
  - metadata
  description: A Parquet binary file and its corresponding data dictionary containing
    specific information about the recording, including task instructions and prompts
    as well as information about the microphone used and its gain. Introduced in adult
    release v3.1.0.
