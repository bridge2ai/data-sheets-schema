- id: https://physionet.org/content/b2ai-voice-pediatric/
  name: Bridge2AI-Voice Pediatric Dataset
  title: Bridge2AI-Voice Pediatric Dataset
  description: The pediatric component of the Bridge2AI-Voice dataset, published on
    PhysioNet as a separate project from the adult b2ai-voice dataset rather than
    as a version of it; the two releases are distinct cohorts collected under a separate
    pediatric protocol. Version 1.1.0 contains derived audio features for 23,533 recordings
    collected from 300 participants aged 2-18. Pediatric participants were recruited
    at the Hospital for Sick Children (SickKids), either as patients and healthy volunteers
    presenting at the hospital or through research postings, with inclusion criteria
    of 2 to 18 years of age and English proficiency, and exclusion of participants
    over 18 or who were non-verbal. All data were collected through reproschema-ui
    on tablets in a single session per participant, with a headset used for most recordings
    and the built-in tablet microphone used where headphones were not tolerated or
    complex medical conditions precluded them.
