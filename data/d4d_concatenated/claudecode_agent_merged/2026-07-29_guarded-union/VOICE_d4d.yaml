creators:
- id: https://b2ai-voice.org/creator/consortium
  name: Bridge2AI-Voice Consortium
  description: A collaborative multi-institutional consortium that generates the voice,
    speech and cough database linked to health metadata. The 2024 audiomics viewpoint
    describes a team of 50 multidisciplinary experts from 12 North American institutions;
    the project documentation states that lead investigators come from 10 other universities
    in North America besides the two co-lead institutions and that over 50 other investigators,
    clinicians, scholars and trainees have contributed. The consortium's data acquisition
    is co-led by Yael Bensoussan (MD, MSc, FRCSC; USF Health Morsani College of Medicine;
    yaelbensoussan@usf.edu) and Olivier Elemento (PhD; Weill Cornell Medicine), who
    are co-principal investigators for the project. The curators and generators include
    clinicians and healthcare professionals, biomedical researchers, machine learning
    and AI specialists, data scientists and statisticians, social scientists and ethicists,
    and engineers and technologists.
