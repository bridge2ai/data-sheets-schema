acquisition_methods:
- id: https://b2ai-voice.org/acquisition/mixed
  name: Direct observation, self-report and derivation
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The data was directly observable and reported by subjects. Clinical diagnoses
    were verified by clinicians reviewing audio and/or imaging data, looking at electronic
    health records, or medication prescriptions.
  - Acoustic data - voice, breathing, cough and speech - are recorded directly with
    the application for adults and with reproschema-ui for pediatrics; a total of
    22 acoustic tasks are recorded through the app.
  - Demographic data, confounder surveys and validated questionnaires are self-reported
    by participants through the application.
  - The released features are computationally derived from the raw waveform using
    openSMILE, Praat, parselmouth, torchaudio, the Speech Articulatory Coding (sparc)
    package, the ppgs package and OpenAI's Whisper Large model.
  - Clinical validation is performed by a qualified physician or practitioner based
    on established gold standards for diagnosis.
addressing_gaps:
- id: https://b2ai-voice.org/gap/small-samples
  name: Small and under-documented prior voice datasets
  response: Current literature had only been studied on small- to medium-sized data
    sets with limited data outside of acoustic measures not linked to multi-modal
    health data. Published AI/ML models linking voice to the studied disease categories
    consisted of datasets ranging from 20-400 patients. In laryngeal cancer screening
    and diagnosis, most studies reported training datasets of fewer than 300 patients,
    and only two studies used more than one data modality to train their models, limiting
    generalization.
- id: https://b2ai-voice.org/gap/standards
  name: Absence of standards for voice and speech data collection
  response: Comparing studies and pooling data is challenging due to a lack of existing
    standards in how voice and other acoustics are measured and collected. The consortium
    identifies the need to define and create standards for audiomics, the interdisciplinary
    field of audio analysis applied to biomedicine, covering data acquisition, interoperability
    and AI readiness.
- id: https://b2ai-voice.org/gap/private-industry-data
  name: Private industry datasets that cannot be audited
  response: Within industry, datasets are often private, limiting the ability to audit
    ML models and the accuracy of training data labels. Although industry has access
    to vast amounts of voice data from users, it lacks access to accurate clinical
    data or demographic information, which prevents external auditing of training
    datasets to ensure fair representation of diverse populations.
- id: https://b2ai-voice.org/gap/pediatric-data
  name: Scarcity of pediatric voice datasets
  response: The availability of large-scale pediatric databases remains limited despite
    the clinical importance of detecting pediatric communication disorders such as
    autism spectrum disorder and speech delays. Data collection in pediatric populations
    poses unique challenges such as privacy issues, consent processes, and the need
    for developmentally appropriate tasks, which have contributed to the lack of openly
    available pediatric datasets that enable machine learning for pediatric voice
    analysis.
annotation_analyses:
- id: https://b2ai-voice.org/annotation-analysis/single-labeller
  name: Annotation quality assessment
  analysis_method: One labeller provides the label per instance and a single labeller
    is used per data item, so no inter-annotator agreement metric is computed or reported
    in the documentation bundle.
  annotation_quality_details:
  - Annotation quality is instead addressed through clinical gold-standard validation
    performed by a qualified physician or practitioner and through the internal audit
    for missingness and consistency conducted by the data release team.
  - Certain automatically generated aspects of the data, for example transcription,
    have not been audited for correctness.
anomalies:
- id: https://b2ai-voice.org/anomaly/site-configuration
  name: Site and protocol variation
  anomaly_details:
  - Different sites have different collection configurations, and the collection protocol
    changed over the course of the study.
  - Distinct iPad devices were used at each site, and the data were recorded with
    a head-mounted headset with a microphone that could be at slightly different distances.
  - The clinical diagnosis, depending on the disorder, was performed by one clinician
    or based on an EHR record or prescription.
- id: https://b2ai-voice.org/anomaly/confounding-noise
  name: Noise and response quality
  anomaly_details:
  - Confounding factors that might be present in the data include noise artifacts,
    variations in diagnostic practices, inaccurate questionnaire responses and underreporting.
- id: https://b2ai-voice.org/anomaly/unaudited-transcription
  name: Unaudited automated derivations
  anomaly_details:
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf
    models that have not been audited for correctness.
- id: https://b2ai-voice.org/anomaly/missing-feature-files
  name: Feature generation failures and repaired files
  anomaly_details:
  - Some files, whether due to length or other issues, could not generate certain
    features and so are not included in the bundled data.
  - Version 3.1.0 fixed broken parquet files from the previous release.
  - Version 2.0 reprocessed spectrograms to fix minor issues identified in the previous
    release.
- id: https://b2ai-voice.org/anomaly/repeated-visits
  name: Repeated participant rows
  anomaly_details:
  - As participants may have repeated visits in order to collect data, there may be
    more than one row per participant in the data files, and there is no requirement
    that the participant provide the same response at each visit; participant information
    for the same data element may therefore vary across a data file.
at_risk_populations:
  id: https://b2ai-voice.org/at-risk-populations
  name: At-risk population protections
  description: The study includes minors in the pediatric cohort and includes participants
    with mood and psychiatric conditions for whom some questionnaire items may cause
    discomfort.
  at_risk_groups_included: true
  special_protections:
  - Pediatric patients are enrolled only through the pediatric sites and not at USF;
    checklist HRP-416 for children under 21 was completed and appended to the protocol.
  - Compensation is provided to the adult population only.
  - Recruitment takes place during typical patient care appointments and participants
    are made explicitly aware that participation is optional and voluntary and that
    declining will not interfere with their standard of care, so that no undue influence
    or coercion is possible.
  assent_procedures:
  - When children participate, children provide verbal assent where appropriate; assent
    is documented. Where young children cannot reasonably be asked to assent due to
    limitations in understanding related to age and development, they are not asked
    to do so, which typically holds for children under seven years of age.
  guardian_consent:
  - Parents or guardians provide consent for children. Parental permission is obtained
    from one or both parents; the research is minimal risk and does not require permission
    from both parents or legal guardians.
  - For pediatric data collection, parental or participant consent was obtained prior
    to data collection and data sharing. For participants without adequate comprehension
    and familiarity with their past medical history, parents or decision-makers completed
    the survey during the recording on a separate tablet.
citation: 'Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M., Dorr,
