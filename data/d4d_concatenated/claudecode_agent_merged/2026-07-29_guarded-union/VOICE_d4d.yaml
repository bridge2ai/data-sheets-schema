resources:
- id: https://physionet.org/content/b2ai-voice/
  name: Bridge2AI-Voice Adult Dataset
  title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
    information'
  description: 'The adult component of the Bridge2AI-Voice dataset, published on PhysioNet.
    Version 3.1.0 contains data for 833 participants across five sites in North America,
    selected based on known conditions that manifest within the voice waveform including
    voice disorders, neurological disorders, mood disorders and respiratory disorders.
    The release contains data considered low risk, including derivations such as spectrograms
    but not the original voice recordings, together with detailed demographic, clinical
    and validated questionnaire data. Version 3.1.0 is a minor update over 3.0.0 with
    no new participants: it adds data for certain participants, fixes broken parquet
    files from the previous release, adds audio-quality metric and per-audio metadata
    files, back-fills validated diagnosis information across conditions, and rearranges
    some phenotype files and renames certain gold-standard variables.'
