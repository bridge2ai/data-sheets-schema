retention_limit:
  id: https://b2ai-voice.org/retention/limits
  name: Retention limits
  retention_period: Indefinite for contributed research data; a maximum of 10 years
    after study completion for identifiable data held at each institution; a minimum
    of 5 years after study completion for consent documents
  retention_details:
  - Once data is contributed, the data will be retained as long as it is useful for
    research purposes, possibly indefinitely.
  - Identifiable data and datasheets linking participant numbers to participant information
    will be kept in each institution on local cloud storage for a maximum of 10 years
    after study completion, after which identifiable data will be destroyed; this
    is the responsibility of each local principal investigator.
  - The USF IRB requires de-identified study data and original consent forms to be
    stored for a minimum of 5 years after the completion of the study; original paper
    consent documents cannot be destroyed until 5 years after study completion.
  - All entries to the REDCap recruitment screening system are deleted once patients
    are enrolled, or within 90 days of their submission, whichever comes first.
  - Identifiers collected under the partial HIPAA waiver will be destroyed at the
    earliest opportunity consistent with the conduct of the research.
  - Under the Data Transfer and Use Agreement, recipients must destroy the Data in
    accordance with provider instructions two years after the start date, upon completion
    of the project, upon termination, or upon expiration of the applicable ethics
    approval, whichever occurs first, and submit written certification of destruction
    within thirty days.
sampling_strategies:
- id: https://b2ai-voice.org/sampling/non-probability
  name: Non-probability purposive sampling from expert clinics
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - A larger, ongoing collection of voice, speech and respiratory data being gathered
    by the Bridge2AI-Voice consortium across participating institutions.
  why_not_representative:
  - The data is not representative because it was collected at a limited number of
    geographic locations.
  strategies:
  - Non-Probability Sample (the sampling method recorded in the study metadata).
  - 'Patients presenting at specialty clinics and institutions were considered for
    enrolment and were selected based on membership of five predetermined groups:
    respiratory disorders, voice disorders, neurological disorders, mood disorders
    and pediatric.'
  - 'Participants are recruited across different academic institutions from high volume
    expert clinics, based on diagnosis and inclusion/exclusion criteria. The sources
    define high volume expert clinics differently: the project documentation defines
    them as outpatient clinics within hospital systems or academic institutions that
    have developed expertise in a specific disease area and see more than 50 patients
    per month from the same disease category, while the IRB protocol defines them
    as clinics or programmes within academic institutions with multidisciplinary programmes
    targeted to the listed disease cohorts and a volume of over 1,000 patients per
    year. Community Outreach Clinics are defined as clinics within or outside academic
    institutions whose main mission is to provide health services to underserved and
    under-represented populations.'
  - Patients presenting at the given clinic were screened for inclusion and exclusion
    criteria prior to their visit by the project investigators, including chart screening
    through the site EHR under a partial HIPAA waiver.
  - Pediatric participants are recruited strictly from the Hospital for Sick Children
    and grouped by age; non-patients were recruited through research postings.
  - Recruitment also takes place through flyers in well-trafficked areas, QR codes
    linking to a secure REDCap screening survey, social media platforms (LinkedIn,
    X, Facebook, Instagram, YouTube, the Bridge2AI-Voice website and the Bridge2AI
    website) and the FlowTrials platform.
  - If specific diagnoses or severities are under-represented in the dataset, participants
    are identified by medical record review based on voice-disorder related diagnostic
    codes.
sensitive_elements:
- id: https://b2ai-voice.org/sensitive/participant-attributes
  name: Sensitive participant attributes
  sensitive_elements_present: true
  sensitivity_details:
  - 'The dataset contains data considered sensitive: racial or ethnic origins (the
    dataset includes race information), sexual orientation, and financial or health
    data (the dataset includes socioeconomic and health information).'
  - All sensitive fields were removed from the dataset at the v3.0.0 preparation stage;
    these correspond to data elements encoded as sensitive under the column name 'Identifier?'
    in the REDCap data dictionary.
  - Non-identifying elements of data that revealed highly sensitive information, such
    as household income, mental health status and traumatic life experiences, were
    also removed.
  - All raw voice data was removed from the public release, as this data has the potential
    to cause individual re-identification or to be used for illicit or unauthorised
    purposes.
splits:
- id: https://b2ai-voice.org/splits/none
  name: No recommended splits
  split_details:
  - There are no predefined recommended data splits for training, validation, or testing.
    Researchers are encouraged to create their own data splits based on their specific
    requirements.
  - The questionnaire features are collected and distributed in the phenotype folder
    format and can be used for cohort selection.
status: published
subpopulations:
- id: https://b2ai-voice.org/subpopulation/demographics
  name: Demographic subpopulations
  subpopulation_elements_present: true
  identification:
  - The dataset identifies demographic sub-populations by age, gender, sex, ethnicity
    and socioeconomic status.
  - Detailed demographic data collected through the smartphone application include
    age, sex at birth, gender identity, race and ethnicity, and languages spoken;
    the protocol also asks about weight, socio-economic status and literacy status,
    and about disabilities.
  - The dataset includes race information, sexual orientation information, and socioeconomic
    and health information.
  distribution:
  - The adult releases 3.0.0 and 3.1.0 contain 833 participants across five sites
    in North America; the pediatric release v1.1.0 contains 300 participants aged
    2-18.
  - The public data releases do not contain an equal distribution of the five categories
    of diseases.
  - Per-group counts for the released cohorts are not stated in the documentation
    bundle.
- id: https://b2ai-voice.org/subpopulation/disease-cohorts
  name: Disease cohort subpopulations
  subpopulation_elements_present: true
  identification:
  - Participants are grouped into five predetermined disease cohort categories - voice
    disorders, neurological and neurodegenerative disorders, mood and psychiatric
    disorders, respiratory disorders, and pediatric voice and speech disorders - plus
    controls, using the inclusion and exclusion criteria and gold standard validation
    methods defined in the collection protocol.
  - Pediatric participants are grouped by age, with separate protocols for ages 10+,
    6-10, 4-6 and 2-4.
  distribution:
  - Data are collected across five disease categories; the initial data release contained
    data collected from four of the five categories.
  - The adult release abstract states that participants were selected based on known
    conditions which manifest within the voice waveform including voice disorders,
    neurological disorders, mood disorders and respiratory disorders.
subsets:
- id: https://b2ai-voice.org/cohort/voice-disorders
  name: Voice Disorders cohort
  description: Participants with laryngeal cancer (active T1-T4, biopsy proven), laryngitis
    (acute, chronic, bacterial, fungal or autoimmune with evidence on laryngoscopy
    and dysphonia), pre-cancerous lesions (keratosis, leukoplakia with or without
    dysplasia), benign lesions of the vocal cord (nodules, polyps, cysts, Reinke's
    edema, ulcers, recurrent respiratory papilloma, fibrous mass, rheumatoid nodules),
    muscle tension dysphonia, spasmodic dysphonia and laryngeal tremor (adductor and
    abductor laryngeal dystonia, vocal tremor, mixed and singer's laryngeal dystonia),
    unilateral vocal fold paralysis, and glottic insufficiency or presbyphonia. Gold
    standard validation methods are laryngoscopy images and stroboscopy videos, with
    CT scan and spirometry additionally used for unilateral vocal fold paralysis.
    Exclusions include previously treated laryngeal cancer with no evidence of disease
    on scope, subjective laryngitis without evidence on scope, recent post-operative
    states, and glottic gap secondary to unilateral paresis or paralysis.
  is_subpopulation: true
  is_data_split: false
- id: https://b2ai-voice.org/cohort/respiratory-disorders
  name: Respiratory Disorders cohort
  description: Participants with airway stenosis (bilateral vocal fold paralysis,
    supraglottic, glottic, posterior glottic, subglottic, tracheal and multi-level
    upper airway stenosis; nasopharyngeal stenosis excluded) and unexplained chronic
    cough (bothersome cough longer than eight weeks, with an extensive exclusion list
    including cough under eight weeks, current smoking, lung or laryngeal cancer,
    COPD, asthma, GERD, bronchiectasis, TB infection, pneumonia, pulmonary granuloma,
    idiopathic pulmonary fibrosis, ACE inhibitor use, eosinophilic bronchitis, tracheomalacia,
    upper airway cough syndrome, laryngitis, and imaging indicative of airway foreign
    body). Gold standard validation is spirometry and flow-volume loops, with CT scan
    of neck and chest for stenosis.
  is_subpopulation: true
  is_data_split: false
- id: https://b2ai-voice.org/cohort/neurological-disorders
  name: Neurological and Neurodegenerative Disorders cohort
  description: Participants with mild cognitive impairment, Alzheimer's disease, other
    dementias (frontotemporal, Lewy body, vascular, mixed and alcohol-induced), amyotrophic
    lateral sclerosis (sporadic, familial, spinal or limb-onset, bulbar-onset) and
    Parkinson's disease (idiopathic PD, multiple system atrophy, progressive supranuclear
    palsy, corticobasal degeneration, dementia with Lewy bodies and atypical parkinsonism).
    Inclusion requires a clinical diagnosis, age over 44 and under 85, and ability
    to read and speak English; exclusions include absence of a clinical diagnosis,
    ages outside that range, inability to speak and read English, and surgical intervention
    significantly altering the symptoms of the disease studied. Gold standard validation
    methods are brain CT, brain MRI and whole genome sequencing, with serum p-tau
    protein biomarkers additionally used for Alzheimer's disease.
  is_subpopulation: true
  is_data_split: false
- id: https://b2ai-voice.org/cohort/mood-psychiatric-disorders
  name: Mood and Psychiatric Disorders cohort
  description: Participants with alcohol or substance use disorder, anxiety disorder,
    attention-deficit/hyperactivity disorder, autism spectrum disorder, bipolar disorder,
    borderline personality disorder, depression or major depressive disorder, eating
    disorder, insomnia or sleep disorder, obsessive-compulsive disorder, panic disorder,
    post-traumatic stress disorder, schizophrenia, social anxiety disorder and other
    psychiatric disorders. Gold standard validation is the electronic health summary,
    a clinical diagnosis from a psychiatrist, and medication history.
  is_subpopulation: true
  is_data_split: false
- id: https://b2ai-voice.org/cohort/pediatric-disorders
  name: Pediatric Voice and Speech Disorders cohort
  description: Pediatric participants recruited strictly from the Hospital for Sick
    Children (SickKids) and grouped by age, with age-banded protocols for 10+, 6-10,
    4-6 and 2-4 years. Data are collected using reproschema-ui with the Bridge2AI-Voice
    pediatric protocol. Inclusion criteria are 2 to 18 years of age and English proficiency;
    exclusion criteria are age over 18 and being non-verbal.
  is_subpopulation: true
  is_data_split: false
- id: https://b2ai-voice.org/cohort/controls
  name: Controls cohort
  description: Participants who do not have the conditions of interest and who serve
    as controls in the dataset. Inclusion requires not being diagnosed or treated
    for a voice, respiratory, pediatric, mood or neurological disorder affecting voice,
    cough, breath or speech, consenting to provide a voice or speech sample for an
    open-sourced database, being 18 years old or older except for pediatric collection,
    and speaking English or Spanish. Control participants complete voice and speech
    acoustic tasks, demographic data and validated questionnaire scores.
  is_subpopulation: true
  is_data_split: false
tasks:
- id: https://b2ai-voice.org/task/disease-detection
  name: Disease detection and classification from voice
  response: Training machine-learning models for disease detection and classification
    using voice data. Labels include diagnostic categories such as vocal pathologies,
    neurological disorders, psychiatric conditions and respiratory disorders.
- id: https://b2ai-voice.org/task/pretraining-benchmarking
  name: Model pretraining, fine-tuning, benchmarking and validation
  response: The dataset can be used for AI model pretraining, fine-tuning, benchmarking
    or validation of clinically applicable AI/ML models.
- id: https://b2ai-voice.org/task/screening-monitoring
  name: Screening, diagnosis and monitoring via voice biomarkers
  response: Supporting clinical research in disease screening, diagnosis and monitoring
    through voice biomarkers, including early disease detection, continuous disease
    monitoring and personalised treatment strategies.
third_party_sharing:
- id: https://b2ai-voice.org/third-party-sharing/broad
  name: Distribution beyond the creating entity
  description: The dataset will be distributed broadly to individuals outside of the
    entity who created the dataset, subject to registered or controlled access conditions.
    De-identified data are made open to other researchers through hosted platforms,
    and data transfer and data use agreements are put in place between participating
    institutions.
  is_shared: true
title: Bridge2AI-Voice Dataset
updates:
  id: https://b2ai-voice.org/updates/plan
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details:
  - Further versions of the dataset will be released on a semi-annual basis. These
    updates will be distributed as new versions of the dataset on the hosting platform.
  - Users will be notified through news items on the platform as well as through standard
    communication channels.
  - The dataset is released as static versions rather than being dynamically updated.
  - Further releases will contain additional data, including additional categories
    of disease that are not equally represented in the current public releases; the
    documentation states that the study population will expand to include a pediatric
    cohort and data collection in Spanish, with inclusion and exclusion criteria and
    study metadata updated at that time.
use_repository:
- id: d4d:voice_use_repository
  name: Repository of downstream uses
  repository_details:
  - The healthsheet records that there is no repository linking to papers or systems
    that use the dataset.
  - 'Use of the dataset requires citation of the protocol development publication:
    Bensoussan, Yael, et al. "Developing Multi-Disorder Voice Protocols: A team science
    approach involving clinical expertise, bioethics, standards, and DEI." Proc. Interspeech
    2024, available at https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html.'
variables:
- id: d4d:voice_variable_participant_id
  variable_name: participant_id
  data_type: identifier
  is_identifier: true
  description: Unique identifier for the participant, present in every feature file
    and in the phenotype tables.
- id: d4d:voice_variable_session_id
  variable_name: session_id
  data_type: identifier
  is_identifier: true
  description: Unique identifier for the recording session. Participants may have
    more than one session, so there may be more than one row per participant.
- id: d4d:voice_variable_task_name
  variable_name: task_name
  data_type: categorical
  description: The acoustic or speech task performed during the recording.
- id: d4d:voice_variable_n_frames
  variable_name: n_frames
  data_type: integer
  description: Number of time frames associated with the feature tensor for a given
    recording.
- id: d4d:voice_variable_spectrogram
  variable_name: spectrogram
  data_type: array
  description: Spectrogram tensor of dimension 201xT derived from the standardized
    waveform using a 25 ms window, 10 ms hop and 400-point FFT.
  derivation: torchaudio short-time Fast Fourier Transform, downsampled by a factor
    of two in the time domain.
version_access:
  id: d4d:voice_version_access
  name: Version access
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - Adult v1.0 - Health Data Nexus, DOI 10.57764/qb6h-em84
  - Adult v1.1 - PhysioNet, January 17, 2025, DOI 10.13026/249v-w155
  - Adult v2.0.0 - PhysioNet, April 16, 2025
  - Adult v2.0.1 - PhysioNet, August 18, 2025
  - Adult v3.0.0 - PhysioNet, December 16, 2025, DOI 10.13026/k81f-qr68
  - Adult v3.1.0 - PhysioNet, May 1, 2026, DOI 10.13026/8xbn-nq66
  - Pediatric v1.0.0 - PhysioNet, December 17, 2025
  - Pediatric v1.1.0 - PhysioNet, May 1, 2026, DOI 10.13026/h995-bt35
  version_details:
  - By default, older versions of the dataset will continue to be supported, hosted,
    and made available to researchers; each version of the dataset has a unique DOI,
    and the dataset publishers reserve the right to remove access to older versions.
  - The files for adult version 1.1 are no longer available; the latest adult version
    is 3.1.0.
  - The DOI for the latest adult version resolves to https://doi.org/10.13026/37yb-1t42;
    the DOI for the latest pediatric version resolves to https://doi.org/10.13026/mf9s-5r03.
  - Release v1.1 added Mel-frequency cepstral coefficients to the initial v1.0 release.
  - Release v2.0 provided data for an additional 136 new participants, reprocessed
    spectrograms to fix minor issues, and removed all spectrograms and MFCCs from
    free-speech-related files.
  - Release v3.0.0 was a major update with new data for an additional 391 participants,
    separated the single phenotype data file into individual files, added SPARC and
    phonetic posteriorgram features, and reorganized the files.
  - Release v3.1.0 is a minor update with no new participants, releasing some additional
    data for certain participants, fixing broken parquet files, adding audio quality
    metrics and per-recording metadata, back-filling validated diagnosis information
    across conditions, and rearranging some phenotype files and gold standard variable
    names.
was_derived_from: Raw audio waveforms, questionnaire responses and clinical data collected
  prospectively under the Bridge2AI Voice Data Acquisition protocol and exported from
  REDCap and reproschema-ui
