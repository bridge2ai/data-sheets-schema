future_use_impacts:
- id: https://b2ai-voice.org/future-impact/skews
  name: Distributional skews affecting future use
  impact_details:
  - The dataset has skews based on disorder category, site and other demographic factors;
    users should consider the multivariate distribution when assessing utility for
    different questions.
  - Factors that might limit the generalisation of derived models include the number
    and diversity of devices, recording specificities such as headset distance, the
    number and diversity of recording sites, and distribution shifts over time arising
    from changes in diagnostic criteria or practices.
- id: https://b2ai-voice.org/future-impact/reidentification
  name: Re-identification and misuse risks
  impact_details:
  - 'Voice can never be fully de-identified: each person''s voice is unique to them
    and their health at that time, so recognition by a listener remains possible even
    after removal of HIPAA-protected information.'
  - The ethical and legal challenges in audiomics include potential reidentification
    of patients by their voice, voice hacking and data ownership, which the consortium
    states call for a new governance framework covering diversity, data handling and
    privacy safeguards.
  - Registered access users must not take any action that could reasonably lead to
    re-identification, nor use the data for any purpose that could foreseeably cause
    harm or stigmatisation to research participants, their families, communities or
    specific populations.
human_subject_research:
  id: https://b2ai-voice.org/human-subjects/overview
  name: Human subjects research status
  involves_human_subjects: true
  irb_approval:
  - Submitted and approved by the USF Single IRB and subsite IRBs through the Single
    IRB process.
  - Data collection and sharing was approved by the University of South Florida Institutional
    Review Board.
  - Pediatric data collection and sharing was approved by the Research Ethics Board
    at the Hospital for Sick Children.
  - The feasibility study of the Bridge2AI-Voice application was approved under University
    of South Florida IRB number 004890.
  ethics_review_board:
  - University of South Florida Institutional Review Board (single IRB of record for
    US sites)
  - Subsite Institutional Review Boards participating through the Single IRB process
  - Research Ethics Board, The Hospital for Sick Children
  - Separate Canadian research ethics boards at Mount Sinai Hospital and the University
    of Toronto, including a separate protocol for genomic data collection
  special_populations:
  - Children aged 2-18 are enrolled in the pediatric cohort, only at the pediatric
    participating institutions; Checklist HRP-416 for children under 21 was completed
    and appended to the protocol.
  - The protocol states that students, employees and wards of the state are neither
    specifically included nor excluded, and that there is a specific plan to enrol
    participants from socially and economically disadvantaged and underserved populations
    through the Plan for Enhancing Diverse Perspectives.
  regulatory_compliance:
  - Health Insurance Portability and Accountability Act (HIPAA), including HIPAA-compliant
    applications and storage, HIPAA de-identification rules applied to the release,
    and a partial HIPAA waiver for recruitment and screening
  - Certificate of Confidentiality covering the data under the Data Transfer and Use
    Agreement
  - Single IRB process for US institutions and separate research ethics board approvals
    for Canadian institutions
  - NIH STRIDES partner agreements governing cloud storage of study data
id: https://b2ai-voice.org/
informed_consent:
- id: https://b2ai-voice.org/informed-consent/main
  name: Informed consent procedures
  consent_obtained: true
  consent_type:
  - Prospective written informed consent.
  - Electronic consent housed in REDCap, which is HIPAA compliant.
  - In-app electronic consent.
  - Video-recorded consent within the application.
  - Parental permission with child assent for pediatric participants.
  consent_documentation:
  - Participants may consent by signing a physical paper copy, by indicating electronic
    consent within the app or through REDCap surveys, or through video recording within
    the app. Paper consent documents are uploaded and saved electronically in REDCap.
  - All paper and electronic versions of consent are stored for a minimum of 5 years
    after the completion of the study, following required USF procedure. Original
    paper consent documents cannot be destroyed until 5 years after study completion.
  - In some cases remote consent does not require the signature of the researcher;
    in this instance the consent form omits the final section (Statement of Person
    Obtaining Informed Consent) but is otherwise identical.
  withdrawal_mechanism:
  - Participants may withdraw from the study at any point. Withdrawal during or before
    voice data collection means the data will not be included in the database; after
    completion of voice data collection the data cannot be removed.
  consent_scope:
  - Consent covers the collection of voice, speech and respiratory sound data, questionnaire
    and demographic data, and access by investigators to medical information through
    EHR platforms in order to perform gold standard validation of diagnoses and symptoms.
  - Participants consent to provide a voice/speech sample for an open-sourced database
    and to de-identified voice and clinical data being uploaded to that database.
  - Within the consent process, individuals are asked whether they agree to be contacted
    in the future for further voice data collection if long-term follow-up is required;
    contact information provided for this purpose is stored within the institutional
    database only and is not shared with other centers or uploaded to the cloud.
instances:
- id: https://b2ai-voice.org/instance/adult-participant
  name: Adult participant
  description: Each instance represents a person. The adult PhysioNet releases 3.0.0
    and 3.1.0 contain data for 833 participants across five sites in North America;
    the initial v1.0 release contained 12,523 recordings for 306 participants, v2.0
    added 136 new participants and v3.0.0 added a further 391.
  instance_type: participant (person)
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of
    the participant. At each site a local clinician provided the diagnosis based on
    a clinical interview and appropriate work-up. For the psychiatric disorders cohort
    the assessment was determined using the participant's EHR record or an active
    prescription, done outside of data collection by an appropriately licensed clinician.
    Labelling follows the Bridge2AI protocols and ICD-10 codes, with a single labeller
    per instance.
- id: https://b2ai-voice.org/instance/pediatric-participant
  name: Pediatric participant
  description: Pediatric release v1.1.0 contains data collected from 300 participants
    aged 2-18, recruited at the Hospital for Sick Children as patients, healthy volunteers,
    or through research postings.
  instance_type: participant (child aged 2-18)
  counts: 300
  label: true
  label_description: Pediatric participants provide demographic information, voice
    and speech related questionnaires, and questionnaires inquiring about medical
    history; for participants without adequate comprehension or familiarity with their
    past medical history, parents or decision-makers completed the survey.
- id: https://b2ai-voice.org/instance/adult-recording
  name: Adult derived audio recording
  description: A recording of a single acoustic task by a single participant within
    a session, represented in the release by derived features rather than the original
    waveform. Counts differ by feature and by release, and the sources in the bundle
    do not agree on a single recording total. The project documentation states that
    version 3.0 contains approximately 61,937 voice-derived recordings from 833 adult
    participants. The PhysioNet v3.1.0 feature files report torchaudio_spectrogram
    n=29,278, torchaudio_mel_spectrogram n=29,278, torchaudio_mfcc n=29,278, torchaudio_pitch
    n=32,522, sparc_ema n=28,640, sparc_loudness n=31,855, sparc_periodicity n=31,872,
    sparc_pitch n=31,872 and ppgs n=29,289; the corresponding v3.0.0 counts are 29,020,
    29,020, 29,020, 32,236, 31,616, 31,616, 31,633, 31,633 and 29,031. The v1.0 release
    reported 12,523 recordings for 306 participants. No single total is asserted here
    because the counts differ by feature and by release.
  instance_type: audio recording (acoustic task performance)
  label: false
- id: https://b2ai-voice.org/instance/pediatric-recording
  name: Pediatric derived audio recording
  description: Pediatric release v1.1.0 contains derived audio features for 23,533
    recordings collected from 300 participants aged 2-18.
  instance_type: audio recording (acoustic task performance)
  counts: 23533
  label: false
intended_uses:
