data_collectors:
- id: https://b2ai-voice.org/collector/research-teams
  name: Site research teams
  role: Data collection and participant coordination
  collector_details:
  - Research teams, which may include medical, graduate, or undergraduate students,
    coordinated with clinicians and doctors to identify appropriate participants.
  - Data is collected in the clinic with the assistance of a trained research assistant.
    A research member observed and timed participants during the feasibility study
    of the app.
  - Hospital staff were not involved in scheduling but assisted in the logistics of
    coordinating data collection.
- id: https://b2ai-voice.org/collector/clinicians
  name: Site clinicians and physicians
  role: Diagnosis, clinical validation and oversight
  collector_details:
  - Clinicians and doctors were listed under the IRB as co-investigators and were
    added to the consortium so that their names are included on consortium-level publications
    that emerge from the research.
  - At each site, a local clinician provided the diagnosis based on a clinical interview
    and appropriate work-up.
- id: https://b2ai-voice.org/collector/quality-team
  name: Acoustic engineering and data science team
  role: Quality control and machine learning readiness
  collector_details:
  - The team hired 2 acoustic engineers and 3 AI data scientists to analyze all samples
    from the Year 1 exploratory data collection phase to ensure acoustic quality and
    ML readiness in terms of data preparation.
  - In each subsequent year of the study, 10 percent of the data is selected at random
    every month for quality control and ML readiness.
data_protection_impacts:
- id: https://b2ai-voice.org/dpia/status
  name: Data protection impact analysis status
  impact_details:
  - The healthsheet answers 'No' to whether an analysis of the potential impact of
    the dataset and its use on data subjects has been conducted.
  - A memorandum titled 'Ethical Justification for Controlled Access to Raw Voice
    Data Samples' is published with the documentation and explains the reasoning behind
    the governance structure that restricts raw audio to controlled access.
  - The consortium states that it is addressing the ethical, legal and social challenges
    surrounding voice AI, including risks of voice re-identification, vulnerabilities
    such as voice AI hacking, concerns around voice data sharing and privacy, and
    the influence of gender and racial diversity on the development and application
    of these technologies.
description: 'The Bridge2AI-Voice (B2AI-Voice) dataset is a large, ethically sourced,
  and demographically diverse voice dataset linked to health information, released
  by the NIH''s Bridge2AI initiative. It is produced by the Bridge2AI-Voice consortium,
  a Precision Public Health grand challenge project funded by the NIH Common Fund
  Bridge2AI Program, whose stated goal is to create a flagship, standardized, ethically
  sourced dataset of voices linked to health information to fuel research and discovery
  in voice biomarkers. Data are collected prospectively at multiple sites across North
  America using a custom smartphone/tablet application (the Bridge2AI-Voice App) for
  adults and reproschema-ui for pediatric participants, and comprise acoustic tasks
  (voice, speech, breathing and cough recordings), detailed demographics, confounder
  surveys, validated patient questionnaires and patient-reported outcomes, and clinically
  validated diagnoses. Participants are recruited across five disease cohort categories
  - voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders, respiratory disorders, and pediatric voice and speech disorders - together
  with controls. The dataset is published as two distinct PhysioNet resources: an
  adult release (Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked
  to health information) and a separate pediatric release (Bridge2AI-Voice Pediatric
  Dataset). The public releases contain derived audio features (spectrograms, Mel
  spectrograms, MFCCs, pitch, articulatory and phonetic-posteriorgram features) and
  phenotypic tables rather than raw audio waveforms; raw audio is disseminated only
  under controlled access to protect participant privacy.'
direct_collection:
- id: d4d:voice_direct_collection
  name: Direct collection from individuals
  is_direct: true
  collection_details:
  - Data were collected from the individuals in question directly, rather than obtained
    via third parties or other sources.
  - Voice samples are collected prospectively using a custom software application
    with the Bridge2AI-Voice protocols; the rest of the multimodal data is extracted
    from different sites independently and uploaded through the REDCap database.
  - Data were collected in the USA and Canada.
discouraged_uses:
- id: https://b2ai-voice.org/discouraged/non-clinical-decisions
  name: Non-research and consequential decision-making uses
  discouragement_details:
  - The dataset should not be used for non-clinical or non-research applications such
    as hiring decisions, insurance premium adjustments, or any form of surveillance
    that could lead to discrimination or harm.
  - These discouraged uses are intended to prevent unethical or biased outcomes that
    could negatively impact individuals based on their health conditions or voice
    characteristics. The dataset is intended strictly for research that prioritises
    patient safety, privacy and ethical use.
