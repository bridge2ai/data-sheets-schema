is_deidentified:
  id: https://b2ai-voice.org/deidentification/status
  name: De-identification status
  identifiable_elements_present: false
  method: HIPAA Safe Harbor, supplemented by removal of indirect identifiers and of
    all raw voice audio
  identifiers_removed:
  - name
  - civic address
  - Social Security Number
  - geographic locators
  - state and province
  - date information at resolution finer than years
  - phone and fax numbers
  - email addresses
  - IP addresses
  - medical record numbers
  - health plan beneficiary numbers
  - device identifiers
  - license numbers
  - account numbers
  - vehicle identifiers
  - website URLs
  - full face photos
  - biometric identifiers
  - any unique identifiers
  - select geographic or demographic identifiers
  - information about household composition or cultural identity
  - household income, mental health status and traumatic life experiences
  - narrative text fields
  - raw voice audio
  - transcripts of free speech audio
  deidentification_details:
  - The level of de-identification recorded for the dataset is that identifiable information
    under HIPAA and the Common Rule, as well as data considered sensitive, have been
    removed.
  - The dataset removes direct identifiers, applies the HIPAA de-identification rules,
    rebases and/or replaces dates by integers, removes or generalises geographic information
    and removes narrative text fields; it does not achieve K-anonymisation with k
    greater than or equal to 2.
  - The dataset was de-identified through removal of all audio data and certain sensitive
    fields identified by a team of ethicists.
  - Country of data collection was retained.
  - 'Residual risk: a voice can never be fully de-identified, and it is always possible,
    even if unlikely, that someone could recognise a participant''s voice.'
