participant_privacy:
- id: https://b2ai-voice.org/privacy/protections
  name: Participant privacy protections
  anonymization_method:
  - HIPAA Safe Harbor identifiers were removed, including names, geographic locators,
    date information at resolution finer than years, phone and fax numbers, email
    addresses, IP addresses, Social Security Numbers, medical record numbers, health
    plan beneficiary numbers, device identifiers, license numbers, account numbers,
    vehicle identifiers, website URLs, full face photos, biometric identifiers and
    any unique identifiers.
  - State and province were removed while country of data collection was retained.
  - Indirect identifiers were removed where these created a significant risk of participant
    re-identification through combination with other public data, including select
    geographic or demographic identifiers and some information about household composition
    or cultural identity.
  - All raw voice data was removed from the public feature-only release, and raw audio
    transcripts were reviewed so that any audio recordings containing potentially
    identifying information or external voices were removed from the release.
  - Dates are rebased and/or replaced by integers, and narrative text fields are removed.
  reidentification_risk:
  - The dataset does not achieve K-anonymisation with k greater than or equal to 2.
  - The IRB protocol states that even when removing all HIPAA-protected information,
    each person's voice is unique to them and their health at that time in their life,
    so it is always possible, even if unlikely, that someone could recognise a participant's
    voice; a voice can never be fully de-identified.
  - Raw voice data is disseminated through controlled access only because it has the
    potential to cause individual re-identification or to be used for illicit or unauthorised
    purposes.
  privacy_techniques:
  - 'Two levels of privacy are built into the study: a combined master de-identified
    database hosted through a HIPAA privacy-preserving NIH STRIDES partner, and federated
    learning under which each institution hosts its own data and models are trained
    without the data leaving the institution.'
  - Identifiable protected health information is kept in REDCap databases with password-protected
    access, available only to investigators at the institution where the data was
    collected; participant and institution numbers are created to allow institutions
    to track and retain ownership of their institutional data.
  - All investigators and project-related personnel with data access must follow the
    appropriate certification through their local institution, including HIPAA and
    privacy training.
  data_linkage:
  - The healthsheet states that the dataset is self-contained. The registered access
    agreement prohibits any attempt to re-identify research participants or any action
    that could reasonably lead to re-identification.
  - The Data Transfer and Use Agreement requires that recipients not use the Data,
    alone or in concert with other information, to contact individuals who are the
    subjects of the Data without appropriate IRB approval, specific written approval
    from the Provider, and informed consent from the individual if required.
preprocessing_strategies:
- id: https://b2ai-voice.org/preprocessing/audio-standardisation
  name: Audio standardisation and feature extraction
  preprocessing_details:
  - Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
    with a Butterworth anti-aliasing filter applied.
  - Spectrograms are time-frequency representations computed using the short-time
    Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point
    FFT, further downsampled by a factor of two in the time domain after derivation
    (the v1.1 release used a 512-point FFT and no downsampling).
  - Sixty Mel-frequency cepstral coefficients were extracted from the spectrograms,
    and Mel spectrograms were computed with the same parameters and 60 Mel bins.
  - Articulatory features were generated with the Speech Articulatory Coding (sparc)
    package, producing kinematic traces of vocal tract articulators and source features
    as well as measures of loudness, periodicity and pitch, all gathered at 50 Hz.
  - Acoustic features were extracted using openSMILE, capturing temporal dynamics
    and acoustic characteristics; phonetic and prosodic features were computed using
    Parselmouth and Praat, providing measures of fundamental frequency, formants and
    voice quality.
  - Phonetic posteriorgrams - time-varying categorical distributions over acoustic
    units of speech at 100 Hz - were generated via the ppgs package.
  - Transcriptions were generated using OpenAI's Whisper Large model.
  - 'Speech intelligibility metrics are computed for speech tasks, and waveform-derived
    features are stored in two formats: a fixed feature format containing static features
    extracted from the entire waveform, and a temporal format that varies for each
    audio file depending on the length of the recording.'
  used_software:
  - id: https://github.com/sensein/b2aiprep
