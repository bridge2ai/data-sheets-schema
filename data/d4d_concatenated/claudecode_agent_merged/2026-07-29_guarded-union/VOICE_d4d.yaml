cleaning_strategies:
- id: https://b2ai-voice.org/cleaning/stated-position
  name: Stated cleaning position
  cleaning_details:
  - The healthsheet answers 'No' to whether there was any pre-processing for cleaning
    the data, for both the preliminary and the current version of the dataset.
- id: https://b2ai-voice.org/cleaning/audit-and-removal
  name: Audit protocol and record removal
  cleaning_details:
  - The stated audit protocol is to generate missingness tables; check distributions
    and outliers; check categorical responses against the schema; run quality control
    metrics for audio tasks; for waveforms check the amount of silence and the duration;
    and for speech check the produced speech relative to the intended passage.
  - Raw audio transcripts were reviewed and any audio recordings that contained potentially
    identifying information or external voices were removed from the release.
  - All sensitive fields, corresponding to data elements encoded as sensitive under
    the 'Identifier?' column in the REDCap data dictionary, were removed from the
    dataset at the v3.0.0 stage.
  - 'Quality control of the data is performed throughout the four years of the project:
    all samples from the Year 1 exploratory phase were analysed by two acoustic engineers
    and three AI data scientists to ensure acoustic quality and ML readiness, and
    in each subsequent year 10 percent of the data is selected at random every month
    for quality control and ML readiness.'
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    description: Used for organising and preprocessing the dataset.
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://github.com/sensein/senselab
    name: SenseLab
    description: Used for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
collection_consents:
- id: https://b2ai-voice.org/consent/collection
  name: Consent for collection and use
  consent_details:
  - All participants have been duly informed and agreed to the collection and the
    use of their data via prospective informed consent.
  - In most cases the consent or assent process takes place in the clinic setting
    of the recruiting high volume expert clinic and is conducted by research assistants;
    consent may also take place remotely through REDCap survey forms accessed electronically,
    with electronic consent containing the same text as paper consent.
  - 'Consent may also take place through video recording within the application: the
    standard consent document is displayed on the app and participants are instructed
    to start recording, read a statement out loud and send it. The audio recording
    from the consent is used to verify that the acoustic data submitted by the participant
    belongs to the consented individual and to distinguish participants from bots.'
  - Participants may consent by signing a physical paper copy, by indicating electronic
    consent within the app or through REDCap surveys, or through video recording within
    the app; paper consent documents are uploaded and saved electronically in REDCap.
  - The consent details recorded in the study metadata state that research data that
    does not contain direct identifiers will be shared with external researchers for
    future research through a secure database; data that poses a low risk of causing
    individual re-identification will be shared in registered access with the general
    public; and data that would pose a heightened risk of re-identification if shared
    in full open access will be shared through a controlled access mechanism with
    authorised researchers.
  - The consent type answers record that the dataset does not restrict use to non-commercial
    purposes, to a specific geographic location, to a specific type of research, to
    genetic research, or to research that does not involve the development of methods
    or algorithms.
  - For ongoing consent, an electronic consent through the app is administered before
    each subsequent data collection where participants provide longitudinal data.
  - Where delays occur between consent and data collection, participants are notified
    of any changes to the study and re-consented before data collection.
collection_mechanisms:
- id: https://b2ai-voice.org/collection-mechanism/apps
  name: Bridge2AI-Voice applications
  mechanism_details:
  - The data were collected using an iPad app. Voice samples are collected prospectively
    using a custom software application, the Bridge2AI-Voice App, with the Bridge2AI-Voice
    protocols.
  - Data collection occurs through two platforms, the Bridge2AI Voice Web app and
    the Bridge2AI Voice iOS app. The iOS app is restricted to iOS-compatible devices,
    while the Web app can run on a computer, tablet, or phone device. No software
    is downloaded or installed; both apps are HIPAA-compliant, store data only during
    the collection phase, require no login, and send data over a secure HTTPS protocol
    to a HIPAA-compliant storage server.
  - For pediatrics, all data is collected using reproschema-ui with the Bridge2AI-Voice
    pediatric protocol, on tablets.
  - A separate Bridge2AI Enrollment Web app is launched in a browser on the participant's
    device for remote enrollment.
- id: https://b2ai-voice.org/collection-mechanism/hardware
  name: Recording hardware
  mechanism_details:
  - Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation)
    using an Avid AE-36 microphone and an Apple dongle to connect it to the iPad.
  - Participants are instructed to wear a headset with microphone if the task includes
    voice recording, as per the Bridge2AI-Voice suggested standards.
  - The smartphone application for voice data collection includes models to ensure
    acoustic data quality, including volume standardization and noise cancellation.
- id: https://b2ai-voice.org/collection-mechanism/redcap
  name: REDCap clinical data capture
  mechanism_details:
  - Existing clinical data within the EHR is reviewed and entered into a REDCap database
    as part of the Case Report Form. At USF this screening is conducted through the
    EPIC platform, and through local site EHR systems for other participating institutions.
  - The supporting REDCap data dictionary, metadata, and instrument PDFs are available
    at https://github.com/eipm/bridge2ai-redcap. Full data acquisition protocols will
    be available in the REDCap instrument Shared Library.
- id: https://b2ai-voice.org/collection-mechanism/protocol-content
  name: Acoustic tasks and validated instruments
  mechanism_details:
  - A total of 22 acoustic tasks are recorded through the app. Tasks are grouped as
    non voice/non speech (respiration, cough, breath sounds, voluntary cough), voice/non
    speech (prolonged vowel, maximum phonation time, glides, loudness, diadochokinesis)
    and speech (Rainbow Passage, Caterpillar Passage, CAPE-V sentences, free speech,
    picture description, story recall, animal fluency, open response questions, word-color
    Stroop, productive vocabulary, random item generation, Cinderella story). Additional
    pediatric tasks include ABCs, ready for school, favorite show, favorite food,
    outside of school, months, counting, naming animals, naming food, identifying
    pictures, pediatric picture description, long sounds, noisy sounds, pediatric
    Caterpillar Passage, repeat words, role naming, repeat sentences, and silly sounds.
  - Validated questionnaires integrated into the app include the Voice Handicap Index-10
    (VHI-10), Patient Health Questionnaire (PHQ-9), General Anxiety Disorder (GAD-7),
    Positive and Negative Affect Schedule (PANAS), Custom Affect scale, PTSD Adult,
    ADHD-Adult, DSM-5 Adult, Dyspnea Index (DI), Leicester Cough Questionnaire (LCQ),
    Winograd questionnaire, Montreal Cognitive Assessment (MOCA), Children's Voice
    Handicap Index-10 (C-VHI-10), Pediatric Voice Outcomes Survey (PVOS), Pediatric
    Voice-Related Quality-of-Life (PVRQOL), and the Patient Health Questionnaire modified
    for Adolescents (PHQ-A).
  - Detailed demographic data and surveys about confounding factors such as smoking
    and drinking history are collected through the smartphone application.
  - 'Protocol development is described in Bensoussan, Yael, et al. "Developing Multi-Disorder
    Voice Protocols: A team science approach involving clinical expertise, bioethics,
    standards, and DEI." Proc. Interspeech 2024, https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html'
collection_notifications:
- id: d4d:voice_collection_notification
  name: Participant notification
  notification_details:
  - The individuals in question were notified about the data collection; participants
    went through an IRB-approved consent process.
  - Potential participants are informed that participation is voluntary and does not
    impact their medical care in any way, and are asked to explain what they have
    understood to the research assistant to confirm their understanding.
  - About 30 minutes is spent explaining the study and the consent in detail, with
    time for questions or comments.
collection_timeframes:
- id: https://b2ai-voice.org/timeframe/data-acquisition
  name: Bridge2AI-Voice data acquisition period
  timeframe_details:
  - The healthsheet states that the data was collected over a period of 12 months.
  - 'The IRB protocol describes a prospective cohort study over four years involving
    USF and 11 other participating academic sites, with a phased approach: Phase 1
    (Exploratory, up to 180 participants at main sites) completed November 2023; Phase
    2 (Pilot, cumulatively up to 600 participants) begun November 2023 and ongoing
    in November 2024; Phase 3 (Expansion, cumulatively up to 3,000 participants) and
    Phase 4 (Outreach, cumulatively up to 5,000 participants) to follow.'
  - NIH RePORTER records a project start of 2022-09-01 and a project end of 2026-11-30.
  - Individuals may enrol with the option to contribute single time point data or
    longitudinal data for certain disease cohorts; at-home longitudinal collection
    is requested at intervals of 1-6 months for a maximum of three to four years depending
    on the section of the protocol consulted.
- id: https://b2ai-voice.org/timeframe/feasibility-study
  name: Application feasibility study period
  start_date: '2023-06-05'
  end_date: '2023-07-28'
  timeframe_details:
  - 'Scope note: these dates are for the single-site feasibility study of the Bridge2AI-Voice
    application, conducted at the University of South Florida Health Voice Center
    in Tampa, Florida between 5 June 2023 and 28 July 2023 with 47 participants. Audio
    data was not collected at that stage of app development, so this timeframe does
    not describe collection of the released dataset.'
confidential_elements:
- id: https://b2ai-voice.org/confidentiality/released-dataset
  name: Confidentiality of the released dataset
  confidential_elements_present: false
  confidentiality_details:
  - Asked whether the dataset contains data that might be considered confidential,
    for example data protected by legal privilege or by doctor-patient confidentiality,
    or the content of individuals' non-public communications, the healthsheet answers
    "No".
- id: https://b2ai-voice.org/confidentiality/transferred-data
  name: Confidentiality obligations on transferred data
  confidential_elements_present: true
  confidentiality_details:
  - The Data Transfer and Use Agreement states that the Data is Personally Identifiable
    Information as defined in OMB Memorandum M-07-16 and is covered under a Certificate
    of Confidentiality, which must be asserted against compulsory legal demands such
    as court orders and subpoenas for identifying information or characteristics of
    a research participant.
  - Recipients must bind Authorized Persons to hold the Data according to standards
    of confidentiality and security equivalent to those in the Agreement, and must
    not disclose, release, sell, rent, lease, loan, or otherwise grant access to the
    Data to any third party without prior written consent of the Provider.
conforms_to: Brain Imaging Data Structure (BIDS) v1.9.0
conforms_to_class: Dataset
conforms_to_schema: Bridge2AI Voice REDCap data dictionary and metadata (https://github.com/eipm/bridge2ai-redcap)
consent_revocations:
- id: https://b2ai-voice.org/consent-revocation/withdrawal
  name: Withdrawal and revocation mechanism
  revocation_details:
  - Consenting participants are informed that they may withdraw from the study at
    any point. If a participant chooses to withdraw during or before the voice data
    collection, their data will not be included in the database. Participants are
    informed that research data, including voice recordings, cannot be removed from
    the database once the voice data collection process is completed.
  - If participants withdraw after completing voice data collection, the data they
    have provided will be kept until completion of the study. For longitudinal data
    collection, if participants withdraw at any time during the study process, the
    data they have completed will be used in the database, because the purpose of
    the data generation project is to provide a platform and open-source database
    for future research rather than to analyse the data studied. The minimal requirement
    for study completion is one data collection time point.
  - Participants that withdraw from the study have the option to complete a satisfaction
    survey to better understand their reasons for withdrawal; completion is entirely
    optional and no PHI is collected. The survey may also be provided to patients
    who decline participation or who express initial hesitation.
content_warnings:
- id: https://b2ai-voice.org/content-warning/free-speech-transcripts
  name: Free speech transcription content
  content_warnings_present: true
  warnings:
  - The healthsheet states that the dataset includes the transcription of free speech
    tasks, and that while the inclusion of offensive or otherwise unsafe material
    is unlikely it cannot be completely avoided, as research participants are responsible
    for their choice of language.
  - 'Scope note: the PhysioNet release notes state that transcripts of free speech
    audio were removed from the release, that spectrograms and similar features were
    excluded where the audio contained free speech, and that all transcriptions from
    open-response prompts are removed from the feature-only dataset. The healthsheet
    statement and the release notes describe different scopes and are recorded here
    without reconciliation.'
- id: https://b2ai-voice.org/content-warning/mental-health-items
  name: Distressing questionnaire content
  content_warnings_present: true
  warnings:
  - The IRB protocol records that questions asked of participants from certain disease
    cohorts such as mood disorders, depression and anxiety can lead to possible discomfort
    and could trigger negative emotions for participants. Instruments in the protocol
    include the PHQ-9, GAD-7, DSM-5 Adult, PTSD Adult and ADHD Adult questionnaires.
