missing_data_documentation:
- id: d4d:voice_missing_data
  name: Missing data documentation
  missing_data_patterns:
  - Some questions are optional, so information may be missing from individual instances.
  - Each individual answered a common set of questions and then responded to additional
    questions relevant to their primary diagnostic category.
  - Phenotype data files only contain rows for a participant if at least one column
    is not missing.
  - Some audio files, whether due to length or other issues, could not generate certain
    features and are therefore absent from the bundled feature data.
  missing_data_causes:
  - Optional questions.
  - Data collection irregularities.
  - Cohort-specific questionnaire routing.
  - Removal of sensitive records, audio checks and free-speech-derived features during
    de-identification.
  handling_strategy: The dataset has been audited internally for missingness and consistency
    by the data release team, and a missingness table is included with the dataset.
    The audit protocol generates missingness tables, checks distributions and outliers,
    checks categorical responses against schema, and runs quality control metrics
    for audio tasks.
