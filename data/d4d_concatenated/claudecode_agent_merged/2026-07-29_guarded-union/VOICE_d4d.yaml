    disorders.
  - AI model pretraining, fine-tuning, benchmarking, or validation.
  - Support for clinical research in disease screening, diagnosis and monitoring through
    voice biomarkers.
  usage_notes: The Bridge2AI Voice dataset is primarily intended for research applications,
    specifically in the development of AI and machine-learning models for healthcare.
    The dataset is intended solely for commercial and non-commercial research purposes
    by Authorized Researchers as defined in the Registered Data Access Agreement.
    This dataset contains voice recordings and key metadata and is structured to be
    Findable, Accessible, Interoperable, and Reusable (FAIR).
