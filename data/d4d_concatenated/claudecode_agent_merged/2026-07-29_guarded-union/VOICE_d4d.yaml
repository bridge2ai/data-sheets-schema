machine_annotation_tools:
- id: https://b2ai-voice.org/machine-annotation/feature-extraction
  name: Automated feature extraction and transcription tools
  tools:
  - Whisper Large unknown
  - openSMILE unknown
  - Praat unknown
  - parselmouth unknown
  - torchaudio unknown
  - sparc unknown
  - ppgs unknown
  - b2aiprep 3.0.0
  tool_descriptions:
  - OpenAI's Whisper Large model generated transcriptions of the audio recordings;
    transcriptions from open-response prompts were subsequently removed from the feature-only
    release.
  - openSMILE extracted acoustic features capturing temporal dynamics and acoustic
    characteristics, provided in static_features.tsv.
  - Praat provided phonetic and prosodic measures of fundamental frequency, formants
    and voice quality.
  - parselmouth provided the Python interface to Praat used for those measures.
  - torchaudio produced spectrograms, Mel spectrograms, MFCCs and pitch contours.
  - The Speech Articulatory Coding package produced electromagnetic articulography
    estimates for six articulators plus loudness, periodicity and pitch at 50 Hz.
  - The ppgs package produced phonetic posteriorgram probabilities across 40 phoneme
    categories at 100 Hz.
  - b2aiprep organised and preprocessed the dataset, converting raw waveforms into
    the parquet feature files and merging source data into the phenotype files.
