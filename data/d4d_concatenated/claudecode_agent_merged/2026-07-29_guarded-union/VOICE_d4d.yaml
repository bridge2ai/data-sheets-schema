known_biases:
- id: https://b2ai-voice.org/bias/selection
  name: Clinic-based recruitment selection bias
  bias_type: selection_bias
  bias_description: Participants are recruited across different academic institutions
    from high volume expert clinics based on diagnosis and inclusion/exclusion criteria.
    Groups that have less trust in the medical system or in AI, or who are less proximal
    to the collection sites, would have been less likely to be recruited.
  mitigation_strategy: The protocol describes partnerships with Community Outreach
    Clinics whose main mission is to provide health services to underserved and under-represented
    populations, and a Plan for Enhancing Diverse Perspectives to enroll participants
    from socially and economically disadvantaged and underserved populations.
  affected_subsets:
  - All disease cohorts recruited through high volume expert clinics
- id: https://b2ai-voice.org/bias/sampling
  name: Non-probability sampling and limited geography
  bias_type: sampling_bias
  bias_description: The sampling method is recorded as a non-probability sample. The
    data is described as a sample of a larger, ongoing collection which is not representative
    because it was collected at a limited number of geographic locations; five recording
    sites are included in the dataset.
  mitigation_strategy: The team states the intent to make the dataset more representative
    by shifting to remote collection and designing the recruiting approach in a way
    that controls for more variables.
  affected_subsets:
  - Adult cohort across five North American sites
- id: https://b2ai-voice.org/bias/representation
  name: Uneven representation across cohorts and sites
  bias_type: representation_bias
  bias_description: The public data releases do not contain an equal distribution
    of the five disease categories, and the dataset has skews based on disorder category,
    site, and other demographic factors.
  mitigation_strategy: Users should consider the multivariate distribution when assessing
    utility for different questions. Further releases will contain additional data.
  affected_subsets:
  - Disease cohort subsets
  - Site-level subsets
- id: https://b2ai-voice.org/bias/measurement
  name: Device and label acquisition variability
  bias_type: measurement_bias
  bias_description: Participants were screened for different disorders based on site,
    so they also had their data collected with different devices, creating an interaction
    between labels and recording conditions. Diagnostic labels were assigned by a
    single labeler, typically the clinician at the site of data collection or a clinician
    external to it for a prior diagnostic assessment.
  mitigation_strategy: Data are collected on standardized hardware, iPads (9th or
    10th generation) and iPad Air (5th generation) using an Avid AE-36 microphone
    with an Apple dongle, and the app includes models for volume standardization and
    noise cancellation. Version 3.1.0 adds audio quality metrics and per-recording
    metadata including microphone and gain information.
  affected_subsets:
  - Site-level subsets
  - Disease cohort subsets
known_limitations:
- id: https://b2ai-voice.org/limitation/language-coverage
  name: English-only coverage
  limitation_type: coverage_limitation
  limitation_description: Participants who do not read or speak English are excluded
    from the released cohorts, and the only language option for the collection protocol
    at the time of the v2.0.0 documentation was English.
  scope_impact: Models trained on the dataset cannot be assumed to generalise to speakers
    of other languages.
  recommended_mitigation: Await the Spanish-language protocol and data collection
    that the documentation states are under development.
- id: https://b2ai-voice.org/limitation/geographic-representativeness
  name: Limited geographic representativeness
  limitation_type: representativeness_limitation
  limitation_description: The data are a sample of a larger, ongoing collection and
    are stated not to be representative because collection took place at a limited
    number of geographic locations; five recording sites are included.
  scope_impact: Findings may not transfer to populations outside the participating
    North American sites.
  recommended_mitigation: Consider the multivariate distribution of site, disorder
    category and demographics when assessing utility for a given question.
- id: https://b2ai-voice.org/limitation/no-raw-audio
  name: Raw audio excluded from the public releases
  limitation_type: scope_limitation
  limitation_description: The public PhysioNet releases contain derived features rather
    than the original voice recordings. Transcripts of free speech audio were removed;
    spectrograms and similar features were excluded where the audio contained free
    speech; and spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for
    sensitive records and audio checks were removed. No external data such as imaging
    or genomic data was released in the v3.0.0 release.
  scope_impact: Analyses requiring the original waveform, free-speech content or linked
    multimodal data cannot be performed on the public release alone.
  recommended_mitigation: Request raw audio through the controlled access mechanism
    by contacting the Data Access Compliance Office at DACO@b2ai-voice.org; adult
    raw audio is made available via Synapse.
- id: https://b2ai-voice.org/limitation/no-splits
  name: No recommended data splits
  limitation_type: methodological_limitation
  limitation_description: There are no predefined recommended data splits for training,
    validation or testing; researchers are encouraged to create their own splits based
    on their specific requirements.
  scope_impact: Results reported on this dataset are not directly comparable across
    studies unless the splitting procedure is described.
  recommended_mitigation: Describe the exact splitting procedure alongside any release
    of a model or publication.
- id: https://b2ai-voice.org/limitation/protocol-drift
  name: Protocol change and diagnostic drift over time
  limitation_type: temporal_limitation
  limitation_description: The collection protocol changed over the course of the study,
    and changes in diagnostic criteria or practices could be a source of distribution
    shift.
  scope_impact: Features and labels are not guaranteed to be homogeneous across collection
    periods or releases.
  recommended_mitigation: Consult the per-version release notes and changelog published
    with the dataset metadata.
- id: https://b2ai-voice.org/limitation/k-anonymity
  name: K-anonymisation not achieved
  limitation_type: integration_limitation
  limitation_description: The de-identification metadata records that the dataset
    does not achieve K-anonymisation with k greater than or equal to 2, even though
    direct identifiers are removed and the HIPAA de-identification rules are applied.
  scope_impact: Residual re-identification risk remains when the data are combined
    with other sources.
  recommended_mitigation: Observe the terms of the registered access agreement, which
    prohibit attempts to re-identify research participants.
- id: https://b2ai-voice.org/limitation/geographic-and-date-resolution
  name: Reduced geographic and temporal resolution
  limitation_type: resolution_limitation
  limitation_description: Dates are rebased or replaced by integers, geographic information
    is removed or generalised, state and province were removed while country of data
    collection was retained, and narrative text fields are removed.
  scope_impact: Longitudinal analyses at fine temporal resolution and geographic analyses
    below country level are not possible.
- id: https://b2ai-voice.org/limitation/audio-task-completion
  name: Acoustic task completion difficulties observed in feasibility testing
  limitation_type: methodological_limitation
  limitation_description: In the single-site feasibility study of the Bridge2AI-Voice
    application, the overall task completion rate was 68 percent and acoustic tasks
    were successfully recorded in only 41 percent of cases, with participants requesting
    assistance in 41.2 percent of tasks and the Glides task requiring assistance 100
    percent of the time. The determination of whether a task was successfully completed
    or recorded was subjective, being made at the decision of the research assistant.
  scope_impact: This limitation is scoped to the 47-participant feasibility study
    of the application conducted at a single tertiary academic voice centre between
    5 June 2023 and 28 July 2023, in which audio data was not collected; it is not
    a measurement on the released dataset.
  recommended_mitigation: The feasibility findings prompted a focus on user experience
    and interface, including the addition of a UX/UI expert to the team for further
    iterations of the app.
labeling_strategies:
- id: https://b2ai-voice.org/labeling/clinical-gold-standard
  name: Clinical gold standard labeling
  data_annotation_platform:
  - REDCap, used to record diagnosis, clinical validation and questionnaire data.
  - ReproSchema-UI, used for pediatric questionnaire and recording data collection.
  data_annotation_protocol:
  - Labels are diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders.
  - The labeling strategy is a gold standard label available in the data, diagnosed
    by a clinician. At each site, a local clinician provided the diagnosis based on
    a clinical interview and appropriate work-up. For the psychiatric disorders cohort,
    the assessment was determined using the participant's EHR record or an active
    prescription, performed outside of data collection by an appropriately licensed
    clinician.
  - Labelers followed Bridge2AI protocols and ICD-10 codes.
  - Per-diagnosis gold standard validation methods are specified, including laryngoscopy
    images and stroboscopy videos for voice disorders, spirometry and flow volume
    loops and CT scans for respiratory disorders, CT brain, MRI brain and whole genome
    sequencing for neurological disorders, and electronic health summary, psychiatrist
    diagnosis or medication history for mood and psychiatric disorders.
  annotations_per_item: 1
  inter_annotator_agreement: A single labeler is used per data item, so no inter-annotator
    agreement statistic is reported.
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external
    to the study for a prior diagnostic assessment.
  labeling_details:
  - Human-level performance in the applications the dataset is supposed to address
    is reported to vary widely.
  - The process for any new labels should be described alongside any release of a
    model or publication, and should include the exact variables used for that determination.
