data_collectors:
- id: chorus_collector_data_acquisition_centers
  name: CHoRUS data acquisition centers
  role: Data contributing sites
  collector_details:
  - The collaboration spans 20 academic centers, of which 14 contribute as Data Acquisition
    centers.
  - The project website reports 14 data contributing hospitals and 60+ CHoRUS consortium
    members across 20 different institutions.
  - As of August 2025 the dataset covered 14 different hospitals.
- id: chorus_collector_data_site_managers
  name: Data site managers
  role: Site-level data extraction and submission
  collector_details:
  - Data managers at data contributing sites follow the Chorus_SOP workflow to extract
    and contribute clinical data to CHoRUS.
  - Sites provide regular status updates on their progress in creating and curating
    a CHoRUS-specific clinical data extract, either through the GitHub interface or
    by submitting a Google Form.
data_protection_impacts:
- id: chorus_data_protection_impact
  name: Data protection and public-sharing assessment
  impact_details:
  - Community-facing ethics focus groups are performed to determine what data is appropriate
    for public sharing.
  - The project analyses the existing legal and regulatory landscape and creates new
    approaches for provenance and privacy in clinical care AI.
  - Data are transformed using approaches that limit re-identification before release.
description: The CHoRUS dataset is a multi-center, multi-modal, high-resolution critical
  care dataset assembled by the Patient-Focused Collaborative Hospital Repository
  Uniting Standards (CHoRUS) for Equitable AI data generation project, one of four
  data generation projects in the NIH Common Fund's Bridge2AI consortium. The dataset
  is built to support artificial intelligence and machine learning applications aimed
  at characterizing acute and critical care illness, predicting complications, and
  measuring treatment response among patients with acute or critical illness. Data
  are collected retrospectively from contributing hospitals and are released under
  controlled access. Structured electronic health record data are standardized to
  the OMOP Common Data Model; other modalities use modality-specific standards (OHNLP
  for extracted and tokenized clinical notes, DICOM for imaging from PACS, WFDB for
  waveform telemetry from bedside monitors and gateway/middleware, and EDF+ and Persyst
  for EEG waveforms from hospital databases). The project website describes an anticipated
  final dataset of 100,000 patient admissions, 9 data modalities and 14 data contributing
  hospitals, and a current released dataset of 50,000 patient admissions from ICU,
  PICU and NICU containing 1.6 billion rows of EHR OMOP data, 7,642 admissions with
  radiology data and 23 Tb of waveform data. A September 2025 informational webinar
  states that, as of August 2025, the dataset covered 14 different hospitals with
  over 45,000 unique admissions. The project also plans a holdout test set accessible
  for external validation of models.
direct_collection:
- id: chorus_direct_collection
  name: Source of the collected data
  is_direct: false
  collection_details:
  - Data are collected retrospectively from clinical systems at contributing hospitals
    (structured EHR, clinical notes, PACS imaging, bedside monitor and gateway/middleware
    telemetry, and hospital EEG databases) rather than gathered directly from individuals
    for this dataset.
  - Contributing sites create a CHoRUS-specific clinical data extract and deliver
    it to the project.
distribution_dates:
- id: chorus_distribution_dates
  name: Reported release status
  release_dates:
  - As of August 2025 the dataset covered 14 different hospitals with over 45,000
    unique admissions (AIM-AHEAD/Bridge2AI Cohort 2 informational webinar, September
    9, 2025).
  - The project website describes a "Current Released Dataset" of 50,000 patient admissions
    alongside an "Anticipated Final Dataset" of 100,000 patient admissions; no calendar
    release date is given.
distribution_formats:
- name: OMOP Common Data Model tables
  description: Demographics, medication administration, procedures, nursing flowsheets,
    and diagnoses are represented using the OMOP data standard, with published metadata
    schemas listed as the OMOP schema and, for at least one data type, the OMOP schema
    with extensions.
- name: OHNLP tokenized clinical notes
  description: Clinical notes are extracted and tokenized using the OHNLP toolkit
    and conform to the OHNLP open source schema.
- name: DICOM imaging
  description: Imaging obtained from PACS is distributed using the DICOM standard
    and conforms to the DICOM schema.
- name: WFDB waveform telemetry
  description: Waveform telemetry from bedside monitors and gateway/middleware uses
    the WFDB standard, with a published metadata schema described as the PhysioNet
    schema extended.
- name: EDF+ and Persyst EEG waveforms
  description: EEG waveforms from the hospital database use EDF+ and Persyst formats,
    with published metadata described as the open source EDF+ and Persyst schema.
ethical_reviews:
- id: chorus_ethical_review_community_focus_groups
  name: Community-facing ethics focus groups
  review_details:
  - The project performs community-facing ethics focus groups to determine what data
    is appropriate for public sharing.
  - The CHoRUS consortium evaluates community perspectives on clinical care AI to
    find ways to increase trustworthiness of provenance and privacy in AI.
- id: chorus_ethical_review_legal_framework
  name: Legal and regulatory framework development
  review_details:
  - The project establishes a legal framework for collecting data at scale, sampling
    to ensure comprehensive sets of patient conditions and clinical treatment strategies.
  - New approaches are being created as the existing legal and regulatory landscape
    is analyzed.
  - Patient-focused efforts determine the ethical and legal approaches to manage privacy
    and bias, while accounting for social determinants of health.
- id: chorus_ethical_review_ethics_pillar
  name: Ethical and Trustworthy AI pillar
  review_details:
  - One of the three pillars of the CHoRUS data generation project is Ethics (Ethical
    and Trustworthy AI); the other two are Data (Standards, Tool Development and Optimization,
    and Data Acquisition) and People (Team Science and Skill and Workforce Development).
existing_uses:
- id: chorus_existing_uses
  name: Current uses of the CHoRUS dataset
  examples:
  - Datasets are being used for training activities and publications.
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI
    CHoRUS data through engagement, AI training, and mentorship, and equips trainees
    to apply AI/ML methods to big data analysis using multi-modal datasets from a
    broad range of cohort participants.
  - Cohort 2 of the training program ran with a program start date of November 17,
    2025 and a program end date of July 31, 2026, with up to 30 trainees selected.
extension_mechanism:
  id: chorus_extension_mechanism
  name: Contribution and extension mechanisms
  extension_details:
  - Data contributing sites extend the dataset by creating and submitting CHoRUS data
    extracts following the validated SOP workflow, with tooling provided to create
    and upload an extract.
  - Clinical collaborators can contribute to mapping efforts through the chorus-mapping
    repository, which holds documentation and pooled tabular mappings along with an
    associated clinical validation SOP.
  - Issues encountered in creating or submitting a data extract are posted to context-specific
    Standards Discussions or Data Acquisition Discussions.
  - Software contributors use the chorus-developer web guide, which compiles documentation
    for contributors and users of the CHoRUS software packages, and a package status
    page listing versions, maintainers, and other metadata.
  - Sites submit status updates via the GitHub interface or a Google Form; a GoogleScript
    triggered on each submission calls the GitHub API to update status and issue information,
    feeding the Standards Project or the Data Acquisition Project.
