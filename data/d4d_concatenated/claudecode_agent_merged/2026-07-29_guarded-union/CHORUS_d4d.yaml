acquisition_methods:
- id: chorus_acquisition_retrospective_clinical
  name: Retrospective acquisition from hospital clinical systems
  acquisition_details:
  - The CHoRUS dataset is described as retrospective data collection.
  - Data are acquired across a multi-center network with capabilities to acquire,
    standardize, tokenize, store, visualize, and label data such as structured electronic
    health record data, tokenized unstructured electronic health record data, telemetry
    and EEG waveforms, imaging, and social determinants of health.
  - Imaging is drawn from hospital PACS, waveform telemetry from bedside monitors
    and gateway/middleware, and EEG from the hospital database.
addressing_gaps:
- id: chorus_gap_ai_infrastructure_critical_care
  name: Lack of infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care. Developing high-resolution multi-center
    data sets is a critical first step towards actionable and trustworthy AI.
- id: chorus_gap_external_validation
  name: Absence of holdout data for external model validation
  response: The dataset provisions a holdout test set accessible for model external
    validation, addressing the need to validate AI-developed models before marketplace
    adoption and implementation in acute and critical care.
- id: chorus_gap_legal_and_ethical_framework
  name: Absence of a legal and ethical framework for large-scale clinical data sharing
  response: The project establishes a legal framework for collecting data at scale,
    performs community-facing ethics focus groups to determine what data is appropriate
    for public sharing, and analyses the existing legal and regulatory landscape.
- id: chorus_gap_multimodal_standardization
  name: Lack of harmonized standards across clinical data modalities
  response: Unified standards are needed to harmonize multi-modal EHR, waveform, imaging,
    and text data; CHoRUS develops validated semantic mappings and standard operating
    protocols so that contributing sites deliver interoperable datasets.
- id: chorus_gap_ai_workforce
  name: Shortage of AI-literate clinicians and scientists
  response: A comprehensive set of approaches develops the skills and workforce for
    a next generation of diverse academic and community AI scientists, and cultivates
    expertise in the lay and scientific community to improve AI literacy and utilization
    through multimodal educational approaches.
at_risk_populations:
  id: chorus_at_risk_populations
  name: At-risk populations in the CHoRUS dataset
  at_risk_groups_included: true
  special_protections:
  - Controlled access to all data types
  - Transformation of data using approaches that limit re-identification
  - Tokenization of unstructured EHR content and local retention of clinical notes
  - De-identification of imaging, reported as in process for a larger cohort
  description: The current released dataset comprises admissions from ICU, PICU, and
    NICU, so it includes critically ill adults, children, and neonates. Assent procedures
    and guardian consent arrangements are not described in the source bundle.
cleaning_strategies:
- id: chorus_cleaning_site_characterization
  name: Site characterization reports
  cleaning_details:
  - Characterization reports are produced and returned to sites following their data
    submissions.
  - Status tracking identifies and resolves blocking issues at data contributing sites.
- id: chorus_cleaning_mapping_validation
  name: Clinical validation of semantic mappings
  cleaning_details:
  - Semantic mappings undergo validation; a clinical validation SOP supports contributions
    to mapping efforts.
  - SOP documents undergo an internal validation and review process within the Chorus_SOP
    repository.
collection_mechanisms:
- id: chorus_collection_mechanism_site_extracts
  name: Site data extracts under standard operating protocols
  mechanism_details:
  - Data contributing sites create and submit a CHoRUS data extract following standard
    operating protocols (SOPs) that instruct sites about best practices for curating
    and delivering interoperable datasets.
  - The Chorus_SOP page provides an interactive workflow diagram describing the step-by-step
    process for extracting and contributing clinical data to CHoRUS, with links to
    SOP documents validated within the Chorus_SOP repository.
  - Tooling is provided to create and upload a CHoRUS data extract.
  - Issues in the creation or submission of a data extract are raised in context-specific
    discussion locations for Standards and Data Acquisition.
- id: chorus_collection_mechanism_enclave
  name: Cloud enclave ingestion and federated access
  mechanism_details:
  - OMOP and telemetry data are held in an enclave; clinical notes remain local except
    for tokens.
  - Dockerized container applications and associated configurations are deployed to
    support CHoRUS services on Azure.
  - Federated access enables sampling methods to ensure a balanced and diverse cohort.
- id: chorus_collection_mechanism_semantic_mapping
  name: Validated semantic mapping of source data
  mechanism_details:
  - The project provides validated semantic mappings for connecting clinical data
    in various source formats to international standards.
  - A chorus-mapping repository holds documentation and pooled tabular mappings, with
    an associated clinical validation SOP for contributing to mapping efforts.
  - Clinical expertise is described as invaluable to semantic mapping and validation
    within CHoRUS.
collection_timeframes:
- id: chorus_collection_timeframe_project_period
  name: Project period and reporting snapshots
  timeframe_details:
  - NIH RePORTER records a project start of 2022-09-01 and a project end of 2026-11-30
    for project number 1OT2OD032701-01 (fiscal year 2022).
  - Data collection is retrospective.
  - The AIM-AHEAD/Bridge2AI Cohort 2 informational webinar of September 9, 2025 reports
    dataset coverage as of August 2025.
  - The clinical time period covered by the retrospective patient records is not stated
    in the source bundle.
confidential_elements:
- name: Patient clinical data under controlled access
  description: All CHoRUS data types are listed with controlled access control in
    the cohort 2 informational webinar dataset table, and the data consist of hospital
    records of identifiable clinical care.
  confidential_elements_present: true
  confidentiality_details:
  - Structured electronic health record data from hospital admissions of critically
    ill patients
  - Clinical notes, which are stored locally at contributing sites except for tokens
  - Imaging drawn from hospital PACS, with de-identification in process for a larger
    cohort
  - Waveform telemetry from bedside monitors and waveform EEG from hospital databases
  - Access to all listed data types is controlled
conforms_to: OMOP Common Data Model (OHDSI), with modality-specific standards for
  tokenized clinical notes (OHNLP), imaging (DICOM), waveform telemetry (WFDB), and
  waveform EEG (EDF+ and Persyst)
