known_biases:
- name: Cohort balance, diversity, and social determinants
  bias_description: 'The project explicitly frames privacy and bias as issues to be
    managed: patient-focused efforts determine the ethical and legal approaches to
    manage privacy and bias while accounting for Social Determinants of Health. The
    source documents describe this as an active area of work and do not report measured
    bias in the released data.'
  mitigation_strategy: Sampling to ensure comprehensive sets of patient conditions
    and clinical treatment strategies; federated access enabling sampling methods
    to ensure a balanced and diverse cohort; inclusion of contextual factors such
    as geographic distance to the nearest hospital; acquisition across 14 data-contributing
    hospitals within a 20-centre collaboration.
known_limitations:
- id: chorus_limitation_modality_coverage
  name: Incomplete modality coverage in the released dataset
  limitation_type: coverage_limitation
  limitation_description: Not all declared modalities are fully available. As of the
    September 2025 informational webinar, 1,000 images were available with de-identification
    in process for a larger cohort, EEG extraction was in process, and clinical notes
    remained stored locally except for tokens.
  scope_impact: Analyses requiring imaging, EEG, or full clinical note text are limited
    relative to analyses using OMOP-standardized structured EHR data and waveform
    telemetry.
- id: chorus_limitation_released_vs_anticipated
  name: Released dataset smaller than the anticipated final dataset
  limitation_type: coverage_limitation
  limitation_description: The project website reports a current released dataset of
    50,000 patient admissions against an anticipated final dataset of 100,000 patient
    admissions, 9 data modalities, and 14 data contributing hospitals. Imaging is
    present for 7,642 of the released admissions.
  scope_impact: Statistics computed on the current release do not describe the final
    dataset the project anticipates delivering.
- id: chorus_limitation_clinical_scope
  name: Scope restricted to acute and critical care admissions
  limitation_type: scope_limitation
  limitation_description: The dataset covers admissions of patients with acute or
    critical illness from ICU, PICU, and NICU settings at data acquisition hospitals
    within a 20-institution United States consortium.
  scope_impact: Findings may not transfer to non-critical-care settings or to health
    systems outside the contributing network.
- id: chorus_limitation_metadata_publication
  name: Metadata publication incomplete for several modalities
  limitation_type: methodological_limitation
  limitation_description: Metadata availability is marked as Planned for clinical
    notes, imaging, and EEG waveforms, while demographics, medication administration,
    procedures, nursing flowsheets, diagnoses, and waveform telemetry are reported
    as having metadata available.
  scope_impact: Users of the modalities whose metadata is still planned have less
    documentation available to interpret those data.
- id: chorus_limitation_representativeness_unverified
  name: Representativeness stated as a goal rather than a verified property
  limitation_type: representativeness_limitation
  limitation_description: The project states aims of a balanced and diverse cohort
    and of comprehensive coverage of patient conditions and treatment strategies,
    but the source bundle reports no verification that the released dataset is representative
    of any defined target population.
  recommended_mitigation: Users should characterize the cohort themselves before generalizing
    results beyond the contributing hospitals.
labeling_strategies:
- name: Visualization and annotation environment for prediction targets
  description: Labeling activity described in the NIH RePORTER abstract and the CHoRUS
    GitHub organization overview. The source documents do not report an annotation
    platform, protocol, annotator demographics, or inter-annotator agreement.
  labeling_details:
  - A visualization and annotation environment will label data with targets important
    for prediction.
  - The project develops capabilities across a multi-center network to acquire, standardize,
    tokenize, store, visualize, and label data.
license_and_use_terms:
  id: chorus_license_and_use_terms
  name: CHoRUS access and use terms
  license_terms:
  - All participants must sign a licensing agreement included in the registration
    form before gaining access to the dataset.
  - Access to the dataset requires a ".edu" email address; this requirement is stated
    not to be a barrier to acceptance into the training program, and program administrators
    will assist with access if needed.
  - Registration requires a form with name, email, and institution; once access is
    granted and compute is provisioned, an email is sent.
  - Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  - The chorus-ai GitHub organization README states that the project is licensed under
    the MIT License; this statement is made about the CHoRUS software project on GitHub.
    Individual repositories carry their own licenses, including MIT (chorus_waveform,
    chorus-extract-upload, UF-Geocoding) and Apache-2.0 (Chorus_SOP). The source bundle
    does not state a license identifier for the dataset itself.
  contact_person: person_jared_houghtaling
  description: The dataset is under controlled access for every listed data type.
    The source bundle describes an access process (registration, licensing agreement,
    ".edu" email, provisioned compute) rather than an open data license.
machine_annotation_tools:
- id: chorus_machine_annotation_tools
  name: Automated extraction and processing tools
  tools:
  - OHNLP toolkit
  - privacy_scan_tool
  - UF-Geocoding (DeGauss)
  tool_descriptions:
  - OHNLP toolkit is used to extract and tokenize clinical notes; the published metadata
    schema for this modality is the OHNLP open source schema.
  - privacy_scan_tool is described in the CHoRUS GitHub organization as "A Privacy
    Scan tools for medical records" (Python).
  - UF-Geocoding is open source code to geocode OMOP Location entities via DeGauss
    (Python, MIT, forked from bihorac-LAB/Exposome).
maintainers:
- name: Massachusetts General Hospital
  role: academic_institution
  maintainer_details:
  - Massachusetts General Hospital is the awardee organization for NIH award OT2OD032701
    and hosts the project's principal investigator.
  - The project website lists Ciera McCrary, MGH, Program Manager, as the contact,
    with the email address cmccrary@mgh.havard.edu as published.
- name: CHoRUS consortium
  role: academic_institution
  maintainer_details:
  - 60+ CHoRUS consortium members across 20 different institutions maintain the project,
    with 14 institutions contributing as Data Acquisition centers.
  - Data access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  - The CHoRUS GitHub organization hosts 28 repositories providing software and tooling,
    validated semantic mappings, standard operating protocols, and project management
    overviews.
missing_data_documentation:
- id: chorus_missing_data
  name: Known gaps in the released dataset
  missing_data_patterns:
  - Imaging is available for 7,642 admissions within a current released dataset of
    50,000 patient admissions.
  - As of the September 2025 webinar, 1,000 images were available, with de-identification
    in process for a larger cohort.
  - EEG waveform extraction was in process as of the September 2025 webinar.
  - Clinical notes are stored locally at contributing sites; only tokens are centralized.
  - Metadata for clinical notes, imaging, and EEG waveforms is marked as Planned rather
    than available.
  missing_data_causes:
  - 'Staged assembly of the dataset: de-identification, extraction, and metadata publication
    for several modalities were still in progress at the time of the source documents.'
  handling_strategy: The project reports the current released dataset separately from
    the anticipated final dataset and states which modalities are still being processed.
name: CHoRUS
other_tasks:
- id: chorus_other_tasks_education
  name: Educational and workforce-development use
  task_details:
  - Trainees use the data and tools to create practical use cases on the Bridge2AI
    AI/ML for Clinical Care Collaborative Cloud, including work with the OHDSI/OMOP
    common data model and the OHDSI tool stack.
  - The project cultivates expertise in the lay and scientific community to improve
    AI literacy and utilization through multimodal educational approaches.
page: https://chorus4ai.org/
participant_privacy:
- id: chorus_participant_privacy
  name: Privacy protections for CHoRUS participants
  anonymization_method:
  - Tokenization of unstructured electronic health record data
  - Extraction and tokenization of clinical notes with the OHNLP toolkit, with notes
    stored locally except tokens
  - De-identification of imaging, reported as in process for a larger cohort
  reidentification_risk:
  - The project transforms data using approaches that limit re-identification; a quantified
    residual re-identification risk is not stated in the source bundle.
  privacy_techniques:
  - Controlled access to all listed data types
  - Cloud enclave holding OMOP and telemetry data
  - Privacy scan tooling for medical records maintained in the CHoRUS GitHub organization
  - Patient-focused efforts to determine the ethical and legal approaches to manage
    privacy and bias
preprocessing_strategies:
- name: Standardization to the OMOP Common Data Model
  preprocessing_details:
  - The project acquires data, standardizes data to the OMOP Common Data Model, and
    transforms data using approaches that limit re-identification.
  - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data,
    supported by validated semantic mappings that connect clinical data in various
    source formats to international standards.
- name: Clinical note extraction and tokenization
  preprocessing_details:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit, and conform
    to the OHNLP open source schema.
  - The project describes tokenized unstructured electronic health record data as
    one of the data capabilities developed across the multi-center network.
  used_software:
  - id: https://chorus4ai.org/#software-ohnlp-toolkit
    name: OHNLP toolkit
    description: Toolkit used to extract and tokenize clinical notes for the CHoRUS
      dataset.
- name: Waveform conversion
  preprocessing_details:
  - Waveform documentation and various waveform conversion scripts are maintained
    by the project, alongside resources that support the preparation and release of
    waveforms.
  used_software:
  - id: https://github.com/chorus-ai/chorus_waveform
    name: chorus_waveform
    description: CHoRUS waveform documentation and various waveform conversion scripts.
    license: MIT
  - id: https://github.com/chorus-ai/chorus_waveform_resources
    name: chorus_waveform_resources
    description: Resources which support the preparation and release of waveforms.
- name: Geocoding of location entities
  preprocessing_details:
  - Open source code geocodes OMOP Location entities via DeGauss, supporting contextual
    factors such as geographic distance to the nearest hospital and social determinants
    of health.
  used_software:
  - id: https://github.com/chorus-ai/UF-Geocoding
    name: UF-Geocoding
    description: Open source code to geocode OMOP Location entities via DeGauss; forked
      from bihorac-LAB/Exposome.
    license: MIT
purposes:
- id: chorus_purpose_ai_ready_critical_care_dataset
  name: Develop a publicly available, AI-ready critical care dataset
  response: The project's overarching goal is to develop a publicly available, AI-ready
    critical care dataset, while ensuring the methods promote privacy, accountability,
    and clinical benefit, and while promoting a new generation of AI clinicians and
    scientists.
- id: chorus_purpose_generate_data_for_ml_ai
  name: Generate data for ML/AI applications in acute and critical illness
  response: As part of the NIH Common Fund's Bridge2AI program, the CHoRUS data generation
    project meets the need of generating data for ML/AI applications aimed at characterizing
    acute and critical care illness, predicting complications, and measuring treatment
    response among patients with acute or critical illness.
- id: chorus_purpose_diverse_high_resolution_ethical_dataset
  name: Build a diverse, high-resolution, ethically sourced dataset
  response: The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness.
- id: chorus_purpose_holdout_test_set
  name: Provision a holdout test set for external validation
  response: The dataset will also provision a holdout test set, accessible for model
    external validation to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care.
- id: chorus_purpose_infrastructure_and_standards
  name: Develop network, tools, standards, data and education for clinical care AI
  response: CHoRUS will develop the necessary network, tools, standards, data, and
    education to build machine-learning and artificial-intelligence-derived models
    to improve the care and outcomes of patients requiring critical care, including
    unified standards that harmonize multi-modal EHR, waveform, imaging, and text
    data.
raw_data_sources:
- id: chorus_raw_source_ehr
  name: Hospital electronic health record systems
  source_description: Structured electronic health record data (demographics, medication
    administration, procedures, nursing flowsheets, diagnoses) and unstructured clinical
    notes from contributing hospitals.
  source_type:
  - Electronic health record
  raw_data_format:
  - OMOP Common Data Model (after standardization)
  - OHNLP open source schema (for extracted and tokenized clinical notes)
  access_details: Clinical notes are stored locally at the contributing site except
    for tokens.
- id: chorus_raw_source_pacs
  name: Hospital PACS
  source_description: Imaging studies drawn from hospital picture archiving and communication
    systems.
  source_type:
  - Imaging archive
  raw_data_format:
  - DICOM
- id: chorus_raw_source_monitors
  name: Bedside monitors and gateway/middleware
  source_description: Waveform telemetry acquired from bedside monitors via gateway/middleware
    systems.
  source_type:
  - Physiological monitoring
  raw_data_format:
  - WFDB
- id: chorus_raw_source_eeg
  name: Hospital EEG database
  source_description: Electroencephalography waveforms drawn from the hospital EEG
    database.
  source_type:
  - Neurophysiology archive
  raw_data_format:
  - EDF+
  - Persyst
raw_sources:
- name: Locally retained source data
  raw_data_details:
  - Clinical notes remain stored locally at contributing sites, with only tokens available
    in the enclave, so the underlying raw note text is not distributed with the dataset.
  - Raw imaging, telemetry, and EEG originate in hospital PACS, monitoring, and EEG
    systems and are transformed before inclusion.
regulatory_restrictions:
  name: Access and regulatory posture
  confidentiality_level: restricted
  regulatory_restrictions:
  - Every listed data modality is under controlled access, with access granted after
    registration, licensing agreement signature, and compute provisioning.
  - The project website displays the notice "This repoitory is under review for potential
    modification in compliance with Administration directives" (spelling as published).
  - The project establishes a legal framework for collecting data at scale and analyzes
    the existing legal and regulatory landscape as part of its ethics pillar.
  other_compliance:
  - Eligibility rules stated in the source documents (U.S. citizenship, permanent
    residency, or non-citizen national status, and a W-9 form) apply to the AIM-AHEAD
    Bridge2AI for Clinical Care training program, not to the dataset itself.
related_datasets:
- target_dataset: NIH Bridge2AI consortium data generation projects
  relationship_type: is_part_of
  description: The CHoRUS project is one data generation project of four in the NIH
    funded Bridge2AI consortium, collaborating with Bridge2AI, the NIH Bridge2AI Bridge
    Center, and the three other data generation projects.
relationships:
- id: chorus_relationships_admission_linkage
  name: Relationships between modalities and admissions
  relationship_details:
  - Data modalities are organized around patient admissions; the project website reports
    7,642 admissions with radiology data within a current released dataset of 50,000
    patient admissions, so imaging is available for a subset of admissions.
  - Structured EHR data, waveform telemetry, imaging, clinical note tokens, and EEG
    describe the same critically ill patients admitted at contributing hospitals.
  - Structured EHR content is harmonized under the OMOP Common Data Model, and unified
    standards are used to harmonize multi-modal EHR, waveform, imaging, and text data.
resources:
- id: https://chorus4ai.org/#modality-demographics
  name: Demographics
  conforms_to: OMOP
  description: Demographic data represented using the OMOP data standard, under controlled
    access, with a published metadata schema listed as the OMOP schema.
- id: https://chorus4ai.org/#modality-medication-administration
  name: Medication administration
  conforms_to: OMOP
  description: Medication administration data with dosing time-stamped upon each infusion
    change or dose administration, represented using the OMOP data standard, under
    controlled access.
- id: https://chorus4ai.org/#modality-procedures
  name: Procedures
  conforms_to: OMOP
  description: Procedure data documented by providers, represented using the OMOP
    data standard, under controlled access.
- id: https://chorus4ai.org/#modality-nursing-flowsheets
  name: Nursing flowsheets
  conforms_to: OMOP
  description: Nursing flowsheet data captured as high-frequency documentation, represented
    using the OMOP data standard, under controlled access.
- id: https://chorus4ai.org/#modality-diagnoses
  name: Diagnoses
  conforms_to: OMOP
  description: Diagnosis data documented by providers, represented using the OMOP
    data standard, under controlled access.
- id: https://chorus4ai.org/#modality-clinical-notes
  name: Clinical notes
  conforms_to: OHNLP
  description: Clinical notes extracted and tokenized using the OHNLP toolkit, under
    controlled access, conforming to the OHNLP open source schema. Notes are stored
    locally at contributing sites except for tokens.
- id: https://chorus4ai.org/#modality-imaging
  name: Imaging
  conforms_to: DICOM
  description: Imaging obtained from PACS, represented using DICOM and conforming
    to the DICOM schema, under controlled access. Approximately 1000 images were available
    as of August 2025 with de-identification in process for a larger cohort; the current
    released dataset snapshot reports 7,642 admissions with radiology data.
- id: https://chorus4ai.org/#modality-waveform-telemetry
  name: Waveform telemetry
  conforms_to: WFDB
  description: Waveform telemetry from bedside monitors and gateway/middleware, represented
    using WFDB with a published metadata schema described as the PhysioNet schema
    extended, under controlled access. The current released dataset snapshot reports
    23 Tb of waveform data.
- id: https://chorus4ai.org/#modality-waveform-eeg
  name: Waveform EEG
  conforms_to: EDF+ and Persyst
  description: EEG waveforms from the hospital database, represented using EDF+ and
    Persyst with an open source EDF+ and Persyst schema, under controlled access.
    Extraction was in process as of August 2025.
sampling_strategies:
- id: chorus_sampling_strategy
  name: Sampling for a balanced and diverse cohort
  is_sample: true
  strategies:
  - The project establishes a legal framework for collecting data at scale, sampling
    to ensure comprehensive sets of patient conditions and clinical treatment strategies.
  - Federated access enables sampling methods to ensure a balanced and diverse cohort.
  source_data:
  - Clinical records of patients with acute or critical illness at 14 data acquisition
    hospitals within a 20-institution consortium.
  description: The dataset samples critically ill patients across a multi-center network.
    The source bundle states the aim of a balanced and diverse cohort but does not
    report a verification of representativeness or a randomization procedure.
sensitive_elements:
- name: Sensitive clinical and contextual content
  sensitive_elements_present: true
  sensitivity_details:
  - Structured electronic health record data including demographics, diagnoses, procedures,
    medication administration, and nursing flowsheets.
  - Unstructured clinical notes, which are extracted and tokenized using the OHNLP
    toolkit.
  - Imaging drawn from hospital PACS systems.
  - Waveform telemetry from bedside monitors and gateway/middleware, and EEG waveforms
    from hospital databases.
  - Social determinants of health and contextual factors such as geographic distance
    to the nearest hospital.
splits:
- name: Holdout test set
  split_details:
  - The dataset provisions a holdout test set, accessible for model external validation
    to aid marketplace adoption of AI-developed models for implementation in acute
    and critical care.
  - Holdout datasets are sequestered for external validation as part of the data generation
    project's design.
status: 'Active NIH-funded data generation project with a project period of 2022-09-01
  to 2026-11-30. A current released dataset is available under controlled access,
  and the project describes a larger anticipated final dataset that is still being
  assembled (imaging de-identification and EEG extraction were reported as in process
  as of the September 2025 informational webinar). The project website carries the
  notice: "This repoitory is under review for potential modification in compliance
  with Administration directives."'
subpopulations:
