title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
updates:
  id: chorus_update_plan
  name: Ongoing dataset expansion
  update_details:
  - The dataset is being expanded from the current released dataset of 50,000 patient
    admissions toward an anticipated final dataset of 100,000 patient admissions across
    9 data modalities and 14 data contributing hospitals.
  - Imaging de-identification for a larger cohort and EEG waveform extraction were
    reported as in process as of the September 2025 informational webinar.
  - Data contributing sites provide regular status updates on their progress in creating
    and curating a CHoRUS-specific clinical data extract, submitted through the GitHub
    interface or a Google Form that triggers a GoogleScript calling the GitHub API
    to update status and issue information.
  description: The source bundle does not state a fixed update frequency or a versioned
    release schedule.
version_access:
  id: chorus_version_access
  name: Access to dataset versions
  versions_available:
  - Current Released Dataset - 50,000 patient admissions from ICU, PICU, and NICU;
    1.6 billion rows of EHR OMOP data; 7,642 admissions with radiology data; 23 Tb
    of waveform data.
  - Anticipated Final Dataset - 100,000 patient admissions; 9 different data modalities;
    14 data contributing hospitals.
  version_details:
  - The project website distinguishes a current released dataset from an anticipated
    final dataset; no version identifiers or DOIs for these are given in the source
    bundle.
  - The AIM-AHEAD/Bridge2AI Cohort 2 informational webinar reports coverage of 14
    hospitals and over 45,000 unique admissions as of August 2025, which differs from
    the 50,000 admissions reported on the project website; both figures are recorded
    as stated by their sources.
  - Access to any version requires registration, a signed licensing agreement, and
    a ".edu" email address.
