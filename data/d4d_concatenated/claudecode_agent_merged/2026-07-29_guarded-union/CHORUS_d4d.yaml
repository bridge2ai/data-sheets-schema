  subpopulation_elements_present: true
  identification:
  - The current released dataset is described as patient admissions from ICU, PICU,
    and NICU, which distinguishes adult, pediatric, and neonatal intensive care populations.
  distribution:
  - 50,000 patient admissions from ICU, PICU, and NICU are reported in the "Current
    Released Dataset" snapshot; per-unit counts are not reported in the source documents.
