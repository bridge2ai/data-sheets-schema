future_use_impacts:
- id: chorus_future_use_impacts
  name: Anticipated impact of future use
  impact_details:
  - The holdout test set is intended to aid marketplace adoption of AI-developed models
    for implementation in acute and critical care.
  - The data generation project is intended to catalyze the biomedical research and
    expertise necessary to promote the patient-focused deployment of AI in acute and
    critical care.
  - The project aims to develop the necessary network, tools, standards, data, and
    education to build ML- and AI-derived models that improve care and outcomes for
    patients requiring critical care.
human_subject_research:
  name: Human subjects and special populations
  description: The dataset comprises clinical records of patients with acute or critical
    illness. The source documents do not state an IRB approval or name an ethics review
    board for the dataset.
  involves_human_subjects: true
  special_populations:
  - Patients with acute or critical illness
  - Patients admitted to intensive care units (ICU)
  - Patients admitted to pediatric intensive care units (PICU)
  - Patients admitted to neonatal intensive care units (NICU)
id: https://chorus4ai.org/
instances:
- id: chorus_instance_patient_admission
  name: Patient admission
  instance_type: Hospital admission of a patient receiving acute or critical care
  counts: 50000
  description: The project website reports a current released dataset of 50,000 patient
    admissions from ICU, PICU, and NICU, and an anticipated final dataset of 100,000
    patient admissions. The NIH RePORTER abstract states that the project addresses
    the challenges of acquiring an AI-ready data set from more than 100,000 critically
    ill patients. The AIM-AHEAD/Bridge2AI Cohort 2 informational webinar of September
    9, 2025 states that, as of August 2025, the dataset covered 14 different hospitals
    with over 45,000 unique admissions. These admission counts come from different
    sources and reporting dates and are reported here as stated rather than reconciled
    into a single figure.
- id: chorus_instance_ehr_omop_row
  name: Structured EHR record row in OMOP format
  instance_type: Row of structured electronic health record data in the OMOP Common
    Data Model
  counts: 1600000000
  description: The project website reports 1.6 billion rows of EHR OMOP data in the
    current released dataset. Structured EHR content includes demographics, medication
    administration (dosing time-stamped upon each infusion change or dose administration),
    procedures (documentation by providers), nursing flowsheets (high-frequency documentation),
    and diagnoses (documentation by providers).
- id: chorus_instance_radiology_imaging
  name: Radiology imaging study
  instance_type: Imaging study extracted from hospital PACS and represented in DICOM
  description: The project website reports 7,642 admissions with radiology data in
    the current released dataset. The September 2025 informational webinar states
    that 1,000 images are currently available, with de-identification in process for
    a larger cohort.
- id: chorus_instance_waveform_telemetry
  name: Waveform telemetry recording
  instance_type: Physiological waveform recording from bedside monitors and gateway/middleware,
    represented in WFDB
  description: The project website reports 23 Tb of waveform data in the current released
    dataset. The informational webinar states that OMOP and telemetry are held in
    the enclave.
- id: chorus_instance_clinical_note
  name: Clinical note
  instance_type: Unstructured clinical note extracted and tokenized using the OHNLP
    toolkit
  description: Clinical notes are extracted and tokenized using the OHNLP toolkit.
    The informational webinar states that clinical notes are stored locally except
    for tokens, rather than being held in the central enclave.
- id: chorus_instance_eeg_waveform
  name: EEG waveform recording
  instance_type: Electroencephalography waveform recording from hospital EEG databases,
    represented in EDF+ and Persyst formats
  description: The informational webinar states that EEG extraction was in process
    as of the September 2025 presentation.
intended_uses:
- name: AI/ML development for acute and critical care
  examples:
  - Characterizing acute and critical care illness.
  - Predicting complications among patients with acute or critical illness.
  - Measuring treatment response among patients with acute or critical illness.
  - External validation of AI-developed models against the sequestered holdout test
    set.
  - Collaborative research on the Bridge2AI Clinical Care Cloud platform and development
    of practical clinical use cases by trainees.
  use_category:
  - machine learning and artificial intelligence model development
  - external model validation
  - education and workforce training
  usage_notes: Access is controlled. Training program participants complete a registration
    form with name, email, and institution, must sign a licensing agreement included
    in the registration form before gaining access, and need a ".edu" email address
    to gain access to the dataset; program administrators assist with this access
    if needed. Once access is granted and compute is provisioned, an email is sent.
is_deidentified:
  id: chorus_deidentification
  name: De-identification of the CHoRUS dataset
  method: Data are transformed using approaches that limit re-identification. Unstructured
    electronic health record data are tokenized, and clinical notes are extracted
    and tokenized using the OHNLP toolkit with only tokens leaving the contributing
    site. Imaging de-identification was reported as in process for a larger cohort
    as of the September 2025 informational webinar.
  deidentification_details:
  - 'NIH RePORTER abstract: transform data using approaches that limit re-identification.'
  - 'Informational webinar: imaging - currently 1000 images available with de-id in
    process for larger cohort.'
  - 'Informational webinar: clinical notes stored locally except tokens.'
  - The CHoRUS GitHub organization lists a privacy_scan_tool ("A Privacy Scan tools
    for medical records") and a CTP-deid repository.
