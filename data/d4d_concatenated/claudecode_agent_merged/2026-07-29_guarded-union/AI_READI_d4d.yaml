relationships:
- id: aireadi:relationship_single_project_single_visit
  name: Relationships between instances
  relationship_details:
  - All instances are part of the same prospective data generation project (AI-READI),
    and this relationship is made explicit.
  - There is currently only one visit per participant.
  - Within the dataset structure, files are organised into one directory per datatype,
    then per modality, then per device, then per participant, with each participant
    folder named after the participant's ID number used in the study, which links
    all of a participant's files across modalities.
retention_limit:
  id: aireadi:retention_limits
  name: Data retention limits
  retention_details:
  - There are no limits on the retention of the data associated with the instances.
  - The raw data is expected to be preserved by the AI-READI project at least for
    the duration of the project.
  - Identifiers and links between identifiers and data or specimens that are part
    of the research records will not be destroyed until after the end of the applicable
    records retention requirements.
sampling_strategies:
- name: Composition of the released dataset
  is_sample: false
  source_data:
  - All participants enrolled in AI-READI whose data fall within the collection window
    for this version.
  strategies:
  - The dataset is stated to contain all possible instances, specifically data from
    all participants who had been enrolled during the covered data collection period.
  description: The healthsheet preprocessing section answers "N/A" to the question
    of sampling strategy for a sample from a larger set, consistent with the statement
    that all enrolled participants are included.
- name: Study recruitment sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - All patients aged 40 years or older who had a medical encounter within each health
    system site (UAB, UCSD, UW) between 2020 and 2025. Patients with T2DM and pre-diabetes
    are identified by screening electronic health records for ICD-10 diagnosis codes
    E11.X and R73.09 respectively; patients without diabetes will not have encounters
    with these ICD codes.
  strategies:
  - Non-Probability Sample, as recorded in the study description.
  - Triple-balanced recruitment in equal proportions across four self-reported race/ethnic
    groups (Asian, Black, White, Hispanic), four categories of T2DM status (no diabetes;
    pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin injectable
    medications; insulin-controlled) and biological sex.
  - Participants are recruited in waves; for each wave a contact pool is identified
    by screening electronic health records at each site, and UAB selects a stratified
    sample of potential participants based on the sampling scheme. The composition
    and size of each wave are influenced by observed participation characteristics
    of race/ethnicity, gender, T2DM severity and site.
  - Over 3-plus years of recruitment, approximately 50,000 invitation letters from
    each site are sent by mail and email to potentially eligible participants identified
    through the electronic medical record search, directing them into an online REDCap
    recruitment interface via personalised links, access codes and QR codes.
  why_not_representative:
  - Rather than targeting the demographic distribution of the US population, the study
    intentionally recruits equal numbers of four racial/ethnic groups and four diabetes
    severity categories, because building balanced datasets is critical for developing
    unbiased machine learning models.
  - The cohort does not include other races/ethnicities such as Pacific Islanders
    and Native Americans, and recruitment is predominantly urban and hospital-based.
sensitive_elements:
- id: aireadi:sensitive_public_release
  name: Sensitive elements in the public release
  sensitive_elements_present: false
  sensitivity_details:
  - The public dataset does not contain data that is considered sensitive. The data
    in the released dataset contain no protected health information; information related
    to the sex and race/ethnicity of the participants, as well as medication used,
    has been removed.
- id: aireadi:sensitive_controlled_release
  name: Sensitive elements under controlled access
  sensitive_elements_present: true
  sensitivity_details:
  - The controlled access dataset contains data regarding racial and ethnic origins,
    location as 5-digit ZIP code, and motor vehicle accident reports.
  - Data held under controlled access is also described as including sex, genetic
    sequencing data, past health records and medications.
  - Access to the controlled set is restricted to scientists whose institutions have
    completed legal and privacy use agreements with the AI-READI research programme.
splits:
- id: aireadi:splits_recommended
  name: Recommended training, validation and testing splits
  split_details:
  - The current version of the dataset comes with recommended data splits. Because
    sex, race and ethnicity data are not released with the public version of the dataset,
    the project team prepared data splits into proportions of 70% / 15% / 15% for
    subsequent training, validation and testing, where the validation and test sets
    are balanced as well as possible for sex, race/ethnicity and diabetes status (no
    diabetes, prediabetes or lifestyle controlled, oral medication controlled, and
    insulin controlled).
  - The split totals for this release are 1576 training, 352 validation and 352 testing
    participants, out of 2280 in total.
  - The suggested split is included in the participants.tsv file distributed with
    the dataset.
  - This datasheet does not introduce new tasks or labelling; the new recommended
    data split for the 2280 participants balances training, validation and testing
    sets for age, sex, races/ethnicities and study group.
status: published
subpopulations:
- id: aireadi:subpopulation_race_ethnicity
  name: Self-reported race and ethnicity
  subpopulation_elements_present: true
  identification:
  - 'Self-reported race and ethnicity, collected at the time of screening and enrolment,
    in four groups: Asian, Black, Hispanic and White.'
  distribution:
  - 'Across the 2280 participants of this release: Hispanic 380, Asian 545, Black
    519, White 836.'
  - The study aims to recruit approximately 1000 participants from each of the four
    racial and ethnic groups in equal proportions rather than matching the demographic
    distribution of the US population.
  description: Race and ethnicity information is held under controlled access and
    is removed from the publicly accessible release; the counts above are published
    as part of the recommended split summary.
- id: aireadi:subpopulation_sex
  name: Biological sex
  subpopulation_elements_present: true
  identification:
  - Biological sex, recorded as male or female.
  distribution:
  - 'Across the 2280 participants of this release: male 951, female 1329.'
  description: Sex information is removed from the publicly accessible release to
    prevent stigmatization of findings; the counts above are published as part of
    the recommended split summary.
- id: aireadi:subpopulation_diabetes_status
  name: Type 2 diabetes status and severity
  subpopulation_elements_present: true
  identification:
  - 'Four groups: participants who do not have type 1 or type 2 diabetes; participants
    with pre-type 2 diabetes and those whose blood sugar is controlled by lifestyle
    adjustments; participants whose blood sugar is controlled by oral or injectable
    medications other than insulin; and participants whose blood sugar is controlled
    by insulin.'
  distribution:
  - 'Across the 2280 participants of this release: no diabetes 776, lifestyle controlled
    560, oral medication controlled 686, insulin controlled 258.'
  - The study aims to recruit approximately 1000 participants into each of the four
    groups.
- id: aireadi:subpopulation_age
  name: Age
  subpopulation_elements_present: true
  identification:
  - Participant age, with eligibility restricted to adults aged 40 years and older;
    the study metadata records a maximum age of 85 years and an exclusion criterion
    of adults older than 85 years of age.
  distribution:
  - Mean age across the 2280 participants of this release is 60.8 years (SD 11.3).
- id: aireadi:subpopulation_site
  name: Data collection site
  subpopulation_elements_present: true
  identification:
  - 'Three data collection sites: University of Alabama at Birmingham (Birmingham,
    Alabama), University of California San Diego (San Diego, California) and University
    of Washington (Seattle, Washington).'
  distribution:
  - All study groups are recruited from each site, but the proportion of each group
    varies with the demographic prevalence of that group in the site's geographical
    area. Based on local and regional demographics, the University of Washington concentrates
    on recruiting Asian > Hispanic > Black participants, the University of California
    San Diego site prioritises Hispanic > Asian > Black participants, and the University
    of Alabama at Birmingham site prioritises Black > Hispanic > Asian participants.
    All sites recruit White participants. No per-site participant counts are given
    in the source documents.
- id: aireadi:subpopulation_healthsheet_statement
  name: Healthsheet statement on demographic sub-populations
  subpopulation_elements_present: false
  description: The dataset healthsheet answers "No" to whether the dataset identifies
    any demographic sub-populations, and states that no regulation prevents demographic
    data collection. This is recorded as stated; it stands alongside the published
    split summary, which does report counts by race/ethnicity, sex and diabetes status,
    and alongside the statement that sex and race/ethnicity are held under controlled
    access rather than released publicly.
  identification:
  - Because sex, race and ethnicity data are not released with the public version,
    the project team instead prepared recommended splits aimed at reducing disparities
    in models developed using the dataset.
