tasks:
- name: Pseudotime manifold analysis of disease trajectories
  response: Data collection was specifically designed to permit downstream pseudotime
    manifold analysis, an approach used to predict disease trajectories by collecting
    and learning from complex, multimodal data from participants with differing disease
    severity (normal to insulin-dependent T2DM).
  description: The IRB protocol states that the approach has been used in developmental
    biology to identify differentiation pathways from complex single-cell gene expression
    datasets, relies on dimensionality reduction, is agnostic to existing classification
    criteria or biases, and can be used to reconstruct a temporal atlas of pathogenesis
    and healing.
- name: Development of AI/ML algorithms for disease trajectories and genetic links
  response: The purpose of the project is data generation to allow future creation
    of artificial intelligence/machine learning algorithms aimed at defining disease
    trajectories and underlying genetic links in different racial/ethnic cohorts.
- name: Hypothesis-agnostic multimodal analysis
  response: No specific predictive task is imposed on the data. The protocol was designed
    to be agnostic to hypotheses; the team assembled a data collection protocol composed
    of assessments from many health domains likely to be impacted by T2DM.
third_party_sharing:
- name: Distribution to third parties
  is_shared: true
  description: 'The dataset will be distributed and be available for public use, through
    the FAIRhub platform, subject to verified-ID login, a self-attestation of type
    2 diabetes related research use, and acceptance of the license terms. Two sets
    are released at each version: a controlled access set and a publicly accessible
    set with fewer requirements for access. The controlled access set contains all
    data available in the publicly accessible set plus more sensitive data, available
    only to scientists whose institutions have completed legal and privacy use agreements
    with the AI-READI research programme; its requirements were being developed by
    the Data Access Committee at the time of the protocol publication.'
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
total_file_count: 356343
total_size_bytes: 3815969779678
updates:
  frequency: Approximately once a year; new versions are released rather than existing
    versions updated.
  update_details:
  - The dataset gets released as static versions. The dataset will not be updated
    in place; rather, new versions of the dataset will be released with additional
    instances as more study participants complete the study visit.
  - There are plans to release new versions approximately once a year with additional
    data from participants enrolled since the last release. Enrollment is ongoing,
    and future versions will include larger numbers of participants.
  - 'Changes between versions are documented in detail in the CHANGELOG file included
    in the dataset and visible at docs.aireadi.org. A summary table records: v1.0.0
    pilot, 204 participants, 15+ data types, custom/ad hoc processing, released 5/3/2024;
    year 2 data, 863 participants, +1 image device, automated plus custom processing,
    included in v2.0.0; year 3 data, 1213 participants, +3 image devices, included
    in v3.0.0; v3.0.0 main study, 2280 participants, 15+ data types, released 11/17/2025.'
  - Between v2.0.0 and v3.0.0 the data fields and types are largely the same, except
    that the Snellen visual acuity variables were dropped so that only logMAR visual
    acuity measurements are available. Version 3.0.0 also introduces a new recommended
    data split.
use_repository:
- id: aireadi:use_repository_none
  name: Repository of known uses
  repository_details:
  - There is no repository that links to papers or systems that use the dataset, beyond
    general citation indices. The FAIRhub landing page provides "Dataset Uses", "Cited
    by" and usage statistics sections, and a dataset index and FAIR score are displayed
    as dataset impact measures.
