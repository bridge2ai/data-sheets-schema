    so that future data generation projects can follow it, through https://zenodo.org/communities/aireadi,
    https://github.com/AI-READI and https://aireadi.org, and states that it anticipates
    making the FAIRhub platform available for future data generation projects wishing
    to manage and share AI-ready clinical research datasets.
