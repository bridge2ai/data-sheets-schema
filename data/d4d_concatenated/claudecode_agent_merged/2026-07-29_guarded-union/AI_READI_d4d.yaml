acquisition_methods:
- id: aireadi:acquisition_mixed_direct_and_self_report
  name: Mixed direct observation and self-report
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details:
  - The acquisition of data varied based on the domain; some data were directly observable,
    such as labs, vitals and retinal imaging, whereas other data were reported by
    subjects, such as survey responses.
  - Verification of data entry was performed when possible, for example by cross-referencing
    entered medications with medications that were physically brought in or photographed
    by each study participant.
  - The protocol is performed as a single visit lasting between 2.5 and 4 hours depending
    on the participant, followed by a 10-day at-home monitoring period.
  - All participant images are exported from imaging devices in their raw format,
    and some images required conversion to the DICOM standard format prior to upload
    to the external AI-READI data storage site.
addressing_gaps:
- name: Lack of AI-ready multimodal T2DM datasets
  response: The ability to understand and affect the course of complex, multi-organ
    diseases such as T2DM has been limited by a lack of well-designed, high quality,
    large and inclusive multimodal datasets. A major barrier to AI in this area has
    been the lack of diverse datasets that are AI ready for training AI models.
- name: Under-representation of racial and ethnic groups in T2DM research
  response: The cohort is designed to be balanced in race/ethnicity to address the
    under-representation in past research studies of groups that bear a higher burden
    of the disease.
  description: A meta-epidemiological review of T2DM studies published from 2000 to
    2020 indicated that samples lacked racial and ethnic diversity; the project describes
    its balanced design as a demographic improvement over many previous epidemiological
    studies and clinical trials on T2DM.
- name: Absence of data suitable for studying salutogenesis
  response: Existing data sources such as claims or electronic health records do not
    support the downstream AI/ML analyses needed to study salutogenesis, the pathway
    from disease to health in T2DM. The AI-READI acquisition protocol spans multiple
    domains specifically to enable those analyses.
anomalies:
- id: d4d:aireadi-anomaly-survey
  name: Survey data anomalies
  anomaly_details:
  - In cases of survey data, skipped questions or incomplete responses are expected.
- id: d4d:aireadi-anomaly-wearables
  name: Wearable device anomalies
  anomaly_details:
  - In cases of using wearables, improper use and technical failure such as battery
    failure or system malfunction are expected.
- id: d4d:aireadi-anomaly-imaging
  name: Imaging data anomalies
  anomaly_details:
  - In cases of imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are expected.
  - Undilated handheld fundus photography (Optomed Aurora) image quality varies from
    patient to patient and within the same patient because obtaining a good view is
    challenging without dilation.
  - Spectralis HRA imaging is operator-dependent and not fully automated, so quality
    issues may arise which may lead to skipping this modality and missing data.
  - FLIO is performed last in the visit because it takes longer than a usual Spectralis
    OCT and exposes patients to uncomfortable levels of light, so patient compliance
    may not be at its best.
at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - Eligibility is restricted to adults aged 40 and older who are able to provide
    consent, so minors and individuals unable to consent are not enrolled. Pregnancy,
    gestational diabetes and type 1 diabetes are exclusion criteria.
  - Prisoners are not a target population and no prisoner-specific procedures are
    described.
  - Transportation assistance (rideshare services) was offered to study participants
    who endorsed barriers to transporting themselves to study visits, and the study
    covers reasonable costs for parking, public transit or rideshare fees related
    to the study visit.
  - A Community Advisory Board of 11 persons from the three sites, including diversity
    in race and ethnicity as represented in the AI-READI sample, contributes to protocol
    development and reviews consent forms.
  - For subjects who have difficulty viewing the study consent, a study team member
    reads the consent form to them; if a person is functionally illiterate, a study
    team member signs and notes the reason for the missing subject signature in the
    presence of an impartial witness.
  description: Accessibility measurements were not specifically assessed. Non-English-speaking
    participants are not initially enrolled because translating all study materials,
    not only the consent form, was not possible at the time; Spanish translation of
    the consent form is planned if recruitment goals for Hispanic participants are
    not met.
citation: The dataset record does not supply a formatted citation string. It states
  "When using this resource, please follow the citation instructions provided at https://docs.aireadi.org/docs/3/citation".
  The license agreement likewise directs users to docs.aireadi.org for the current
  citation, and requires acknowledgement of the source and any funder of the data
  in publications reporting its use.
cleaning_strategies:
- name: Quality control at data entry and central processing
  cleaning_details:
  - Several quality control measures were used at the time of data entry and acquisition.
    For example, clinical data outside expected minimum and maximum ranges were flagged
    in REDCap and were visible in reports viewed by clinical research coordinators
    and data managers.
  - Using the REDCap reports as guides, data managers and coordinators examined participant
    records and determined whether an error was likely. Data were checked for credibility
    (range checks), incorrect flow through prescribed skip patterns, missing data
    that could be directly filled from other portions of an individual's record, and
    the omission or duplication of records, and were edited where errors were detected.
  - Editing was only done under the guidance and approval of the site principal investigator.
    If corrected data were available elsewhere in the respondent's answers, the error
    was corrected; if there was no logical or appropriate way to correct the data,
    the site PI reviewed the values and decided whether they should be removed.
  - The data manager at each data site is responsible for the quality control of all
    data before uploading to FAIRhub.
  - No instances were excluded from the dataset at the time of preprocessing.
  used_software:
  - id: https://ohdsi.github.io/DataQualityDashboard/
    name: OMOP CDM Data Quality Dashboard (DQD)
    url: https://ohdsi.github.io/DataQualityDashboard/
    description: The clinical_data directory includes a dqd_omop.json file supporting
      OMOP CDM data quality analysis; the DQD tool runs a set of more than 3500 data
      quality checks against an OMOP CDM instance.
collection_consents:
- name: Informed consent for collection and use
  consent_details:
  - Written informed consent is provided by all participants. Informed consent to
    participate was required before participation in any part of the protocol, including
    questionnaires.
  - Potential participants were given the option to read all consent documentation
    electronically (e-consent) before their visit and give consent with an electronic
    signature without verbal communication with a clinical research coordinator. Participants
    may access e-consent documentation in REDCap and decide at that point that they
    do not want to participate or would like additional information. For most participants
    informed consent is performed remotely by computer, tablet or smart phone; if
    participants did not select the electronic option it is performed in person at
    the start of the visit.
  - The approved consent form for the principal project site, University of Washington,
    is stated to be available at https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
    The other clinical sites had IRB reliance and used the same consent form, with
    minor institution-specific language incorporated depending on individual institutional
    requirements.
  - The consent form includes a table at its beginning clarifying which information
    will be publicly available and which will require an application and approval
    process containing privacy protection. Subjects are asked to confirm their understanding
    of study activities and requirements. In-person consent is obtained in a private
    room with opportunity to ask questions; upon signing, the electronic consent form
    is automatically emailed to the subject, who may request additional copies for
    the duration of the study.
collection_mechanisms:
- name: Study protocol and visit structure
  mechanism_details:
  - The protocol is performed as a single visit lasting between 2.5 and 4 hours depending
    on the participant, preceded by approximately one hour of at-home self-reported
    surveys and followed by a 10-day at-home monitoring period.
  - Questionnaires cover screening/eligibility, demographic information, CES-D-10
    depression screening, Problem Areas in Diabetes (PAID-5), a diabetes self-care
    score, dietary assessment, an ophthalmic survey, smoking/alcohol/vaping/marijuana
    history, general health history, PhenX social determinants of health surveys,
    and current medications with RxNorm codes. Marijuana use is not assessed for participants
    living in Alabama because it is an illegal substance there.
  - Physical measurements include height, weight, waist and hip circumference, waist-hip
    ratio and body mass index. Systolic and diastolic blood pressure and heart rate
    are measured twice, separated by 2 minutes, with an automatic oscillometric medically
    approved device.
  - All research personnel who recruited, enrolled and collected data underwent training
    by the data manager at UAB with a detailed Manual of Procedures, and had to complete
    a certification process including mandatory institutional compliance training
    for human subject research and successful administration of all protocol elements
    to at least three volunteer practice subjects. Data managers at each site oversee
    the process.
  description: The project states that the procedures for data collection and processing
    are available at https://docs.aireadi.org.
- name: Clinical measurement devices
  mechanism_details:
  - 'Electrocardiography: 12-lead ECG using a Philips PageWriter TC30 Cardiograph
    (Amsterdam, The Netherlands), performed while the participant sits in a reclining
    chair or lies supine, with the position recorded (0, 30, 60 or 90 degrees relative
    to supine).'
  - 'Peripheral neuropathy: monofilament test assessing touch perception on both feet
    with shoes and socks removed, using a standard 10 g monofilament at three locations
    on each foot, ten times per location, with the participant''s eyes closed; insensate
    areas are retested for confirmation. Results are recorded on an iPad, laptop or
    paper questionnaire and entered into REDCap by clinical research staff.'
  - 'Cognition: Montreal Cognitive Assessment (MoCA) administered electronically on
    an iPad using the MoCA Duo application (MoCA Cognition, Quebec, Canada); total
    possible score 30, with six domain-specific index scores.'
  - 'Blood pressure devices across sites: OMRON HEM 907XL, Medline MDS4001 Automatic
    Digital Blood Pressure Monitor, and Welch Allyn 6000 series vital signs monitor
    with FlexiPort reusable cuff.'
  - 'Lensometers across sites: NIDEK LM-600P Auto Lensometer, Topcon CL-200 and Topcon
    CL-300 computerized lensometers.'
  - 'Autorefraction: Topcon KR 800 auto keratometer/refractor (Topcon Healthcare,
    Oakland, New Jersey), giving spherical and cylindrical components in diopters
    with cylindrical axis.'
- name: Visual function testing
  mechanism_details:
  - Visual acuity is measured with the M&S Technologies Electronic Visual Acuity tester
    (Niles, Illinois) at 4 metres from a 12x20 inch touch-screen monitor, under best-corrected
    conditions and expressed as logMAR. Photopic testing uses a general occluder;
    mesopic testing uses a 2.0 neutral density filter, either as a trial-frame lens
    or as a handheld "ND-occluder".
  - Letter contrast sensitivity is measured with the Mars chart (Mars Perceptrix,
    Chappaqua, New York) monocularly under photopic and mesopic conditions, in the
    standardized order Photopic OD, Photopic OS, Mesopic OD, Mesopic OS. Chart background
    luminance is 60 to 120 cd/m2 (optimal 85), illuminance 189 to 377 lux (optimal
    267), viewing distance 50 cm (range 40 to 59 cm), with appropriate near correction
    and undilated eyes. Log contrast sensitivity is computed by multiplying errors
    before the final correct letter by 0.04 and subtracting from the log CS value
    at the final correct letter.
- name: Retinal imaging devices
  mechanism_details:
  - 'Optomed Aurora IQ (Optomed, Oulu, Finland): handheld non-mydriatic fundus camera,
    50 degree field of view, 5 Mpix sensor; macula- and disc-centred colour fundus
    photographs taken undilated; DICOM; 4 images per participant.'
  - 'iCare EIDON widefield truecolor confocal fundus system (iCare USA, Raleigh, North
    Carolina): ultra-wide field central, nasal and temporal colour fundus photographs,
    ultra-wide field central infrared, ultra-wide field central fundus autofluorescence,
    and a mosaic of ultra-wide field images; DICOM; 12 images per participant.'
  - 'Heidelberg Spectralis HRA OCT/OCTA (Heidelberg Engineering GmbH, Heidelberg,
    Germany): Optic Nerve Head Radial Circle high resolution OCT, Posterior Pole Macula
    HR 61 lines OCT, and Macula 20x20 HS 512 lines OCTA; DICOM; 6 images per participant.'
  - 'Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan): 3D Wide
    (H) 12x9 512x128 OCT, 3D Macula 6x6 512x128 OCT, and Macula 6x6 360x360 OCTA;
    exported in .fda file format and converted to DICOM for the dataset; 6 images
    per participant.'
  - 'Topcon Triton DRI OCT (Topcon Healthcare): 3D(H)+Rad 12x9 512x256 OCT, Macula
    6x6 320x320 OCTA and Macula 12x12 512x512 OCTA; exported in .fda file format and
    converted to DICOM; 6 images per participant. Uses a 1,050 nm swept-source light
    source and a non-mydriatic colour fundus camera.'
  - 'Zeiss Cirrus 5000 (Carl Zeiss Meditec AG, Jena, Germany): Disc Cube 200x200 OCT,
    Macula Cube 512x128 OCT, Macula 6x6 OCTA and Disc 6x6 OCTA; DICOM; 8 images per
    participant. The Cirrus 5000 Angioplex also provides a 60-degree OCTA widefield
    view, 8x8 mm single scans and a 14x14 mm automated OCTA montage.'
  - 'Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO): macula-centred
    imaging; exported in .sdt file format and converted to DICOM; 2 images per participant.
    FLIO is performed last in the visit because it takes longer than a standard Spectralis
    OCT and exposes participants to uncomfortable light levels.'
  - All retinal images are collected under dilated conditions except for the Optomed.
    All participant images are exported from imaging devices in their raw format,
    and some required conversion to DICOM prior to upload.
- name: At-home monitoring devices
  mechanism_details:
  - 'Dexcom G6 Continuous Glucose Monitor (Dexcom, Inc., San Diego, California): blood
    glucose measurements in mg/dL every 5 minutes, output in .csv. Participants are
    masked to the results during the monitoring period. Participants already wearing
    a Dexcom G6 may either place an additional study sensor at least 3 inches from
    their own, or share data through Dexcom Clarity; those already wearing a sensor
    may also consent to download of up to 90 days of prior glucose values, for up
    to 100 days total.'
  - 'Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland):
    number of steps, heart rate, sleep duration (circadian and diurnal rhythm) and
    oxygen saturation; exported in .FIT file format and converted to the mHealth standard
    for the dataset. The dataset structure additionally contains respiratory rate,
    stress and physical activity calorie directories for this device.'
  - 'Custom environmental sensor, the LeeLab Anura, designed at the Karalis Johnson
    Retina Center, University of Washington (Seattle, Washington): ambient temperature,
    relative humidity, nitrogen oxides (NO and NO2), volatile organic compounds, particulate
    matter (PM1.0, PM2.5, PM4, PM10) and 11 multi-spectral light intensity measurements;
    output in .csv. Component datasheets referenced in the dataset structure include
    the ams-OSRAM AS7431, the DS3231 precision real-time clock and the Sensirion SEN5x
    environmental node.'
  - 'Participants are sent home with the three devices and instructed to use them
    continuously for 10 days, then return them to study staff by overnight mail or
    in person. The environmental sensor and fitness tracker were specifically chosen
    with participant privacy as a primary concern: they do not capture video or audio,
    are not equipped with GPS location monitoring, and are not synced with participant-owned
    devices. Participants return the devices with a data sheet indicating which wrist
    the tracker was worn on, their dominant hand, and where the environmental sensor
    was placed in the home.'
- name: Biospecimen collection and processing
  mechanism_details:
  - Blood (53 mL per the protocol publication; approximately 50 to 60 mL per the IRB
    protocol) and a urine specimen are collected during the study encounter. Participants
    need not be fasting; the time of last oral intake is recorded and a snack is available.
  - One EDTA vacutainer is delivered to a local CLIA-certified clinical laboratory
    for complete blood count analysis on fresh whole blood on the day of collection.
  - Whole blood, plasma, serum and urine for central assays are batch-shipped to the
    University of Washington Nutrition and Obesity Research Center (NORC); samples
    are first stored locally at UAB and UCSD at -70 C and shipped on dry ice approximately
    once per quarter.
  - Plasma, serum and buffy coats collected at UW and UCSD are batch-shipped to the
    UAB Center for Clinical and Translational Science for a central study-wide biobank.
    Genomic DNA extractions from stored buffy coats are performed at UAB CCTS. CPT
    mononuclear cell preparation tubes are processed centrally at UAB CCTS because
    of the complexity of isolating and cryopreserving peripheral blood mononuclear
    cells; PAXgene RNA vacutainers are stable for up to 72 hours, allowing overnight
    shipment from UW and UCSD to UAB.
  - Biorepository specimens comprise buffy coats, genomic DNA, plasma, serum, PAXgene
    vacutainers and peripheral blood mononuclear cells, stored at -80 C or at cryogenic
    temperatures (PBMC) in small aliquots. Biobanked samples will eventually be available
    to scientists according to procedures and policies that are in development.
collection_notifications:
- name: Notification of data collection
  notification_details:
  - Each individual was aware of the data collection, as this was not passive data
    collection or secondary use of existing data, but rather active data collection
    directly from participants.
  - Individuals in each recruitment pool are mailed a hardcopy invitation letter and
    sent an invitation email, both personalised, directing them into the online REDCap
    recruitment interface where they can read an overview of the research programme,
    expectations for participation and answers to frequently asked questions, download
    the informed consent document, request a call back from study staff, complete
    a screening survey and enroll.
  - Participants are also directed to the AI-READI website (https://aireadi.org) where
    they can learn more about the study, including the study FAQ. Follow-up phone
    calls are made by research coordinators to those who did not respond and those
    who initiated contact.
collection_timeframes:
- id: d4d:aireadi-timeframe-v3
  name: Data collection window for dataset version 3.0.0
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details:
  - For version 3.0.0 of the dataset, the timeframe for data collection was July 19,
    2023 to May 1, 2025. The FAIRhub dataset metadata records the collected date range
    as 2023-07-19/2025-05-01 and the study start date as 2023-07-19 (actual).
- id: d4d:aireadi-timeframe-study
  name: Overall study and enrollment timeframe
  timeframe_details:
  - The study protocol publication states that enrolment began on 18 July 2023 and
    will continue until 30 November 2026; the FAIRhub study metadata records an actual
    start date of 2023-07-19. The two sources differ by one day on the start of enrolment.
  - Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023
    in order to secure sufficient familiarity for all coordinators; the formal data
    collection process began on 1 December 2023.
  - The Nature Metabolism comment states that AI-READI is enrolling 4,000 participants
    at three study sites over four years (2022-2026). The timeline for the overall
    project spans four years, encompassing one year dedicated to protocol development
    and training and years 2-4 allocated for subject recruitment and data collection.
  - The FAIRhub study metadata records an anticipated completion date of 2027-01-01
    and an overall status of "Enrolling by invitation"; NIH RePORTER records project
    start 2022-09-01 and project end 2025-08-31 for application 10471118.
confidential_elements:
- name: Confidentiality of released data
  confidential_elements_present: false
  confidentiality_details:
  - The project states that the dataset does not contain data that might be considered
    confidential, and that no personally identifiable information is included in the
    dataset.
  - Separately, the IRB protocol records that identifiable study data held by the
    study team (not released here) are kept on encrypted servers or in locked cabinets
    or rooms with restricted access at all sites, with access limited to authorised
    research personnel, and that the study data security level is Level 3.
conforms_to: Clinical Dataset Structure (CDS) v0.1.1 (https://cds-specification.readthedocs.io/en/v0.1.1/)
conforms_to_schema: https://schema.aireadi.org/v0.1.0/dataset_description.json
consent_revocations:
- name: Withdrawal of consent
  revocation_details:
  - Participants were permitted to withdraw consent at any time and cease study participation.
    However, any data that had been shared or used up to that point would stay in
    the dataset. This is clearly communicated in the consent document.
  - Study subjects have the opportunity to ask questions throughout the study and
    are reminded that they have the right to change their mind about study participation.
content_warnings:
- id: aireadi:content_warning_none
  name: No content warnings
  content_warnings_present: false
  description: The dataset does not contain data that, if viewed directly, might be
    offensive, insulting, threatening, or otherwise pose a safety risk.
created_by: AI-READI Consortium
creators:
- id: aireadi:creator_consortium
  name: AI-READI Consortium
  description: The dataset was created by members of the AI-READI project, referred
    to collectively as the AI-READI Consortium, and is registered on FAIRhub with
    an organizational creator name of "AI-READI Consortium". The consortium is a multidisciplinary
    group of investigators including clinicians, data scientists, vision scientists,
    computer scientists, organisational scientists and ethicists, spanning senior,
    mid-career and early-career faculty as well as clinical research coordinators,
    staff and interns, and collectively covering clinical research, data collection,
    data management, data standards, bioinformatics, team science and ethics. Six
    cross-disciplinary project modules involving teams located across eight institutions
    worked together to develop the dataset. Named collaborators listed for the AI-READI
    Consortium include Amir Bahmani, Sally Baxter, Edward Boyko, Christopher Chute,
    Aaron Cohen, Jorge Contreras, Garrison Cottrell, Virginia de Sa, Jeffrey Edberg,
    Nicole Ehrhardt, Nicholas Evans, Irl Hirsch, Michelle Hribar, Samantha Hurst,
