version: 3.0.0
version_access:
  id: d4d:aireadi-version-access
  name: Version availability and access
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
  - Version 3.0.0, DOI 10.60775/fairhub.3, published 17 November 2025
  - Version 2.0.0, DOI 10.60775/fairhub.2, published 8 November 2024
  - Version 1.0.0, DOI 10.60775/fairhub.1, published 3 May 2024
  version_details:
  - This datasheet describes version 3.0.0 of the dataset, which contains 2280 participants,
    356,343 files and approximately 3.82 TB.
  - 'Scoped historical figures for earlier releases, recorded here rather than merged
    into the version 3.0.0 totals: the FAIRhub record for version 2.0.0 reports 2.01
    TB across 165,051 files and states "This version of the dataset is no longer accessible.
    Please refer to the latest version." Version 1.0.0 comprised the pilot data collection
    phase with 204 participants, and version 2.0.0 comprised data through the first
    full year of the study with 1067 participants in total.'
  - 'Datasheets exist for earlier versions: the version 1 healthsheet at https://docs.aireadi.org/docs/1/dataset/healthsheet
    and the version 2 healthsheet at https://docs.aireadi.org/docs/2/dataset/healthsheet.
    There is one version of the documentation associated with each version of the
    dataset, navigable from a dropdown on the documentation site.'
  - 'Older versions are not separately maintained: because the dataset is not updated
    in place, new versions are released rather than existing versions revised. The
    version 2.0.0 documentation and FAIRhub record both state that version 2.0.0 is
    no longer accessible.'
  - 'Participant counts by version: version 1.0.0 pilot, 204 participants; year 2
    data, 863 additional participants (1067 cumulative in version 2.0.0); version
    3.0.0 main study, 2280 participants. Data types grew from 15+ in version 1.0.0,
    with one additional imaging device in year 2 and three additional imaging devices
    in year 3.'
