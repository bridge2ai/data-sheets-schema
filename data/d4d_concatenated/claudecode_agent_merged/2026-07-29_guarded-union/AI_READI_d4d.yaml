known_biases:
- name: Volunteer selection bias
  bias_type: selection_bias
  bias_description: Participants are volunteers; the protocol publication identifies
    this as selection bias known as volunteer bias, which may limit the generalisability
    of results among those who are not represented in the study population.
  affected_subsets:
  - whole cohort
- name: Under-recruitment of specific demographic groups
  bias_type: sampling_bias
  bias_description: It is a well-documented observation in health research that recruiting
    black men into studies is more difficult than recruiting other populations, yet
    this population bears a disproportionate percentage of the T2DM burden. Similar
    trends for under-recruitment and disease burden have been reported for Hispanic
    and Asian persons. Requiring that eligible participants speak, read and understand
    English may have created challenges in recruiting Hispanic and/or Asian persons.
  mitigation_strategy: Recruitment proceeds in waves whose composition is monitored
    for diversity and inclusion and adjusted by under- and oversampling groups as
    needed; if sample balancing on race/ethnicity emerges as a challenge, the project
    states new recruitment strategies will be implemented. Site-level recruitment
    priorities were set by regional demographics (UW Asian>Hispanic>Black, UCSD Hispanic>Asian>Black,
    UAB Black>Hispanic>Asian). An NIH supplement was submitted to fund translation
    of study materials for Spanish speakers.
  affected_subsets:
  - Black participants
  - Hispanic participants
  - Asian participants
- name: Incomplete population representation
  bias_type: representation_bias
  bias_description: The study cohort may not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific
    Islanders and Native Americans. Recruitment is predominantly urban and hospital-based,
    which may not fully capture diverse cultural and socioeconomic backgrounds.
  mitigation_strategy: Three recording sites were strategically selected for geographic
    diversity across the United States and to ensure diverse representation across
    racial and ethnic groups, with individuals from all demographic backgrounds recruited
    at all three sites. Through engagement with the Native Biodata Consortium, the
    project states it will provide a co-learning opportunity for understanding challenges
    specific to American Indian and Alaska Native communities.
  affected_subsets:
  - Pacific Islander populations
  - Native American populations
  - rural populations
- name: Interim releases not yet balanced
  bias_type: sampling_bias
  bias_description: While the cross-sectional database ultimately aims to achieve
    balance across race/ethnicity, biological sex, and diabetes presence and severity,
    the pilot study is not balanced across these parameters. As enrollment is ongoing,
    the pilot data release and periodic updates to data releases may not have achieved
    balanced distribution across groups.
  mitigation_strategy: The project team prepared recommended data splits (70/15/15)
    in which the validation and test sets are balanced as well as possible for sex,
    race/ethnicity and diabetes status.
known_limitations:
- name: Representativeness of the cohort
  limitation_type: representativeness_limitation
  limitation_description: The cohort is deliberately not designed to match the demographic
    distribution of the US population; four racial/ethnic groups and four diabetes
    severity categories are recruited in equal proportions. It excludes some racial
    and ethnic groups entirely and is drawn from three urban academic health systems.
  scope_impact: Models trained on the dataset may not generalise to populations, care
    settings or geographies not represented in the cohort.
- name: English-language and age eligibility restrictions
  limitation_type: scope_limitation
  limitation_description: Participants are required to speak, read and understand
    English, and must be aged 40 or older (with the study description recording a
    maximum age of 85). Pregnancy, gestational diabetes and type 1 diabetes are exclusionary.
  scope_impact: The dataset does not describe non-English-speaking participants, younger
    adults, people with type 1 diabetes, or pregnant people.
  recommended_mitigation: The project states that consent materials would be translated
    into Spanish if recruitment goals for Hispanic participants are not met, and that
    native Spanish-speaking research staff at UCSD can provide interpretation and
    instructions.
- name: Cross-sectional design with a single visit
  limitation_type: temporal_limitation
  limitation_description: AI-READI is a cross-sectional study and there is currently
    only one visit per participant in the released data. A longitudinal arm is planned
    in which approximately 10% (elsewhere described as about 4%) of participants are
    invited for a follow-up visit in year 4.
  scope_impact: Within-person change over time cannot be studied from this release.
- name: Incomplete modality coverage per participant
  limitation_type: coverage_limitation
  limitation_description: Not all modalities are available for all participants. Some
    participants elected not to participate in some study elements, some devices returned
    no data, and some data were lost.
  scope_impact: Analyses requiring complete multimodal coverage will operate on a
    subset of participants.
- name: Finite biorepository samples
  limitation_type: coverage_limitation
  limitation_description: A limitation of the biorepository is that there are a finite
    number of samples to share with scientists interested in using them in research.
    Procedures for reviewing and prioritising written requests will be developed before
    the biorepository is complete.
  scope_impact: Biospecimens are not part of this data release and their future availability
    is limited and governed by policies still in development.
- name: Variables dropped between versions
  limitation_type: integration_limitation
  limitation_description: The data fields and types are largely the same as the prior
    version, but the Snellen visual acuity variables were dropped in version 3.0.0,
    so only logMAR visual acuity measurements are available.
  scope_impact: Analyses that pooled Snellen measurements across versions cannot be
    reproduced against this version.
labeling_strategies:
- id: aireadi:labeling_none
  name: No labelling performed
  labeling_details:
  - No labels or targets are provided with the dataset and no specific labelling was
    performed, as the dataset is a hypothesis-agnostic dataset aimed at facilitating
    multiple potential downstream AI/ML applications.
  - Because no labelling was performed, no labellers were engaged, no inter-rater
    agreement applies, and no labelling software is provided.
  - No formal guidelines are in place for future researchers creating new labels or
    defining new tasks.
  - Human-level performance figures for the applications the dataset is meant to address
    are recorded as not applicable.
language: en
license: AI-READI custom license v2.0 (https://doi.org/10.5281/zenodo.17555036), named
  as the rights statement of this dataset version by the FAIRhub record. The license
  document included in the source bundle is the earlier AI-READI Data License Agreement
  v1.0 (https://doi.org/10.5281/zenodo.10642459), issued by the University of Washington
  as Licensor; the bundle does not contain the text of v2.0.
license_and_use_terms:
  id: aireadi:license_and_use_terms
  name: AI-READI dataset licence and terms of use
  data_use_permission:
  - disease_specific_research
  license_terms:
  - The dataset metadata for version 3.0.0 records the rights as "AI-READI custom
    license v2.0", https://doi.org/10.5281/zenodo.17555036. The licence terms were
    specifically tailored to enable reuse of the AI-READI dataset and other clinical
    datasets for commercial or research purposes while putting strong requirements
    around data usage, security and secondary sharing to protect study participants,
    especially when data is reused for AI and ML related applications. The FAIRhub
    landing page labels the licence "Health Data License".
  - The licence document included in the source bundle is AI-READI-LICENSE-v1.0 (https://doi.org/10.5281/zenodo.10642459),
    a Data License Agreement with the University of Washington as Licensor. Under
    section 1, the Licensor grants the Licensee a non-exclusive and non-transferable
    license to download, reproduce and use the data and to create derivative works
    thereof, for research and commercial purposes; all full and partial copies are
    subject to the agreement.
  - Section 2 restricts onward sharing to other licensees bound by identical terms,
    while permitting distribution of models, algorithms and programs developed using
    the data that do not themselves contain the data, subject to reasonable efforts
    to minimise memorization or reconstruction of the data.
  - Section 3 prohibits making clinical treatment decisions based on the data and
    prohibits any attempt at re-identification, contact, or harm to data subjects,
    and requires acknowledgement of the source and any funder of the data in publications
    reporting use of the data.
  - Section 4 requires compliance with NIH data security and privacy standards under
    the Genomic Data Sharing Policy. Section 5 terminates the agreement automatically
    on breach and requires deletion of all copies. Section 6 retains title and all
    industrial and intellectual property rights with the Licensor and its suppliers.
    Section 7 disclaims all warranties and provides the data on an "as is" basis.
    Section 8 caps the Licensor's aggregate liability at one U.S. dollar except for
    death or personal injury caused by the Licensor's negligence where applicable
    law prohibits limitation. Section 9 requires indemnification of the Licensor.
    Section 10 requires compliance with all applicable laws and restrictions. Section
    11 makes the agreement the entire agreement, amendable only in writing signed
    by both parties, severable, and governed in the English language.
  - 'Accessing the dataset requires several steps: logging in through a verified ID
    system, agreeing to use the data only for type 2 diabetes related research, and
    agreeing to the licence terms. The access type recorded in the dataset metadata
    is "PublicDownloadSelfAttestationRequired". No fees for access are described in
    the source documents.'
  - Use of the dataset requires citation of the resources specified at https://docs.aireadi.org.
maintainers:
- name: AI-READI team
  role: researcher
  maintainer_details:
  - The AI-READI team will be supporting and maintaining the dataset. The dataset
    is hosted on FAIRhub through Microsoft Azure.
  - For contact information the project refers to the README file included with the
    dataset, which directs questions, suggestions or feedback to https://aireadi.org/contact
    and to the study_description.json and dataset_description.json metadata files
    included in the dataset. The FAIRhub study description gives contact@aireadi.org
    as the central contact email.
  - The Data Manager at each data site is responsible for the quality control of all
    data before uploading to FAIRhub.
missing_data_documentation:
- id: aireadi:missing_data_documentation
  name: Missing data patterns, causes and handling
  missing_data_patterns:
  - Not all modalities are available for all participants.
  - Skipped questions or incomplete responses are expected in survey data.
  missing_data_causes:
  - Some participants elected not to participate in some study elements.
  - The data collection device did not have any stored results or was returned too
    late to retrieve the results, for example because the battery died or the data
    was lost.
  - A data collision at some point in the process may have caused data loss.
  - Operator-dependent imaging modalities may be skipped when quality issues arise.
  handling_strategy: Missing data that can be directly filled from other portions
    of an individual's record was filled during data cleaning under the guidance and
    approval of the site principal investigator. Where there was no logical or appropriate
    way to correct the data, the site principal investigator reviewed the values and
    decided whether they should be removed. No imputation procedure is described in
    the source documents.
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
other_tasks:
- id: d4d:aireadi-other-tasks
  name: Other anticipated tasks
  task_details:
  - The multi-modal dataset is gathered to facilitate downstream pseudotime manifolds
    and various applications in artificial intelligence.
  - The project expects that the flagship dataset will lead to novel discoveries into
    T2DM pathogenesis and salutogenesis while benefiting a broader population, given
    the diversity of the study participants.
  - Banked biospecimens at UAB are intended to support future genomics, proteomics,
    metabolomics, gene expression and immunological studies, and the generation of
    induced pluripotent stem cells; these are not part of the distributed digital
    dataset and will be made available according to procedures and policies still
    in development.
page: https://fairhub.io/datasets/3
participant_compensation:
- name: Participant compensation
  compensation_provided: true
  compensation_type:
  - monetary stipend
  - reimbursement of travel costs
  compensation_amount:
  - 200 US dollars for the study visit, funded through the grant.
  - The study covers reasonable costs for parking, public transit or rideshare fees
    related to the study visit; participants may incur unreimbursed transport costs
    where fees exceed 25 US dollars.
  compensation_rationale:
  - The stipend is provided when the study receives the final data from participants
    and the study devices are returned, typically at least two weeks after the study
    visit to allow for the 10-day home monitoring period and device return by mail.
    The payment is not prorated. The amount may change in future years depending on
    study funding, with the IRB notified of any change.
  - The same type and amount of compensation is given to participants asked to return
    in year 4 of the study.
participant_privacy:
- id: d4d:aireadi-participant-privacy
  name: Participant privacy protections
  anonymization_method:
  - Removal of Protected Health Information as defined by the HIPAA Privacy Rule using
    the Safe Harbor method for the public set.
  - Removal of information related to sex and race/ethnicity of the participants and
    of medication information from the public set.
  reidentification_risk:
  - The project does not currently anticipate uses of the dataset that could result
    in unfair treatment or harm, but notes a theoretical risk of future re-identification.
  - AI algorithms can infer individual patient characteristics and could facilitate
    individual-level identification.
  privacy_techniques:
  - A robust data dissemination system, a strict licence agreement and data watermarking
    are being implemented for both public and controlled sets to prevent reidentification
    attempts.
  - Monitoring devices without audio, video or GPS capability were selected to protect
    participant privacy.
  data_linkage:
  - The controlled access dataset, which contains 5-digit zip code, sex, race, ethnicity,
    genetic sequencing data, past health records, medications, and traffic and accident
    reports, is only available for use by scientists whose institutions have completed
    legal and privacy use agreements with the AI-READI research programme.
  - Licensees are prohibited from using the data, alone or in concert with other information,
    to identify or contact any individual data subject or group of data subjects,
    to extract or extrapolate identifying information, or to establish a data subject's
    membership in a particular group.
preprocessing_strategies:
- id: d4d:aireadi-preprocessing-standardisation
  name: Mapping to data standards
  preprocessing_details:
  - All data are mapped to applicable data standard formats, such as the Observational
    Medical Outcomes Partnership Common Data Model for clinical data and the DICOM
    format for retinal imaging.
  - 'For some devices, the data are transformed from a proprietary state into a standard
    model format prior to upload to FAIRhub: Topcon retinal imaging exported as .fda
    and Heidelberg FLIO exported as .sdt are converted to DICOM, and Garmin .FIT exports
    are converted to the mHealth standard.'
  - Details about the data processing approaches for each data domain or modality
    are described in the dataset documentation at https://docs.aireadi.org.
- id: d4d:aireadi-preprocessing-structure
  name: Dataset organisation and structuring
  preprocessing_details:
  - The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1.
    Data are organized at the root level into one directory per datatype; within each
    datatype folder there is one folder per modality, within each modality folder
    one folder per device, and within each device folder one folder per participant,
    named after the participant's ID number used in the study.
  - Per-datatype manifest.tsv metadata files and a dataset_structure_description.json
    metadata file are included in the dataset.
  - The project is developing new standards including the Clinical Dataset Structure
    (CDS), using existing standards where available and working with their maintainers
    to extend them when necessary.
  - All data are stored and shared using FAIRhub as "AI-ready", which the project
    describes as enabling immediate AI/ML research without reformatting and preprocessing.
- id: d4d:aireadi-preprocessing-deidentification
  name: De-identification processing
  preprocessing_details:
  - The public set is stripped of Protected Health Information as defined by the HIPAA
    Privacy Rule via the Safe Harbor method, as well as information related to the
    sex and race/ethnicity of the participants to prevent stigmatization of findings,
    and medication information.
  - The FAIRhub dataset metadata records the de-identification level as "NoDeIdentification"
    with the note that no identifiers were collected so no active de-identification
    was necessary, but that the team checked that no identifiable data per US HIPAA
    were present in the data. The healthsheet questions on pre-processing for de-identification
    and on measures taken to avoid re-identification were left unanswered.
prohibited_uses:
- name: Clinical treatment decisions
  description: The license agreement states that the licensee shall not make clinical
    treatment decisions based on the data.
  prohibition_reason:
  - The data is intended solely as a research resource.
- name: Re-identification or targeting of data subjects
  description: The licensee shall not use or attempt to use the data, alone or in
    concert with other information, to compromise or otherwise infringe the confidentiality
    of information on an individual data subject and their right to privacy, to identify
    or contact any individual data subject or group of data subjects, to extract or
    extrapolate identifying information about a data subject, to establish a data
    subject's membership in a particular group of persons, or otherwise to cause harm
    or injury to any data subject.
  prohibition_reason:
  - License restriction
  - Privacy risk to study participants
- name: Onward transfer of the data to non-licensees
  description: The licensee shall not transfer, license, sublicense, sell, assign,
    display, share or otherwise convey any portion of the data or any derivative work
    to any third party other than another licensee bound by an identical agreement
    with the licensor. Models developed using the data may be distributed provided
    they do not themselves contain the data or a modified version of it, and provided
    the licensee first undertakes all reasonable efforts to minimise the likelihood
    that data can be memorized, derived, reconstructed or reconstituted through the
    use or construction of such models.
  prohibition_reason:
  - License restriction on secondary sharing
- name: Use of the public version outside type 2 diabetes research
  description: Accessing the dataset requires agreeing to use the data only for type
    2 diabetes related research. The project states that a private version will allow
    for more generic use.
  prohibition_reason:
  - Access condition recorded in the dataset access details and consent terms
publisher: https://fairhub.io/
purposes:
- name: Enable AI/ML research into type 2 diabetes salutogenesis
  response: The dataset was created to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus
    (T2DM), including salutogenic pathways to return to health.
  description: The project states that the current understanding of T2DM, especially
    in the context of salutogenesis, is limited; that AI-based approaches may improve
    that understanding given the complexity of the disease; and that a key issue is
    the lack of data ready for training AI models, which the AI-READI dataset is intended
    to fill. The long-term objective is a foundational T2DM dataset, agnostic to existing
    classification criteria or biases, that can be used to reconstruct a temporal
    atlas of T2DM development and reversal towards health.
- name: Establish standards and a blueprint for AI-ready dataset creation
  response: AI-READI places emphasis on establishing standards, best practices and
    guidelines for the collection, preparation and sharing of data for AI/ML purposes,
    and on sharing that blueprint so that future data generation projects can follow
    it.
  description: Stated aims include creating a model for developing large scalable
    datasets, adherence to the FAIR principles, guidance from bioethicists, and the
    development of new standards such as the Clinical Dataset Structure (CDS) and
    the FAIRhub platform.
- name: Support downstream applications in artificial intelligence
  response: The multi-modal dataset is gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence.
raw_data_sources:
- id: aireadi:raw_source_participants
  source_description: Data obtained directly from subjects during the study visit
    and the 10-day at-home monitoring period, including questionnaire responses, physical
    measurements and vitals, functional testing, and device-derived measurements.
  source_type:
  - participant self-report
  - clinical measurement
  - wearable and sensor device
  raw_data_format:
  - .xml
  - .csv
  - .fda
  - .sdt
  - .FIT
  - DICOM
  access_details: Raw device exports are held to local storage at each data collection
    site before conversion and upload to FAIRhub; they are not distributed.
- id: aireadi:raw_source_specimens
  source_description: Blood and urine specimens collected during the study encounter,
    analysed by CLIA-certified local clinical laboratories and by the University of
    Washington Nutrition and Obesity Research Center, and banked at the University
    of Alabama at Birmingham Center for Clinical and Translational Science.
  source_type:
  - biospecimen
  - clinical laboratory assay
  raw_data_format:
  - .csv
  access_details: Biobanked samples will eventually be available to scientists according
    to procedures and policies that are in development; procedures for reviewing and
    prioritising written requests will be developed before the biorepository is complete.
- id: aireadi:raw_source_health_records
  source_description: Electronic health records at the three health system sites,
    used for eligibility screening and for extraction of general health, eye health,
    medical and surgical history, diabetes, medications, laboratory records and previous
    medical imaging.
  source_type:
  - electronic health record
  access_details: Accessed by the study team under IRB approval; past health records
    are held under controlled access rather than released publicly.
- id: aireadi:raw_source_driving_records
  source_description: Driving and accident records covering car accidents experienced
    and traffic tickets received in the last three years, obtained from the Department
    of Licensing.
  source_type:
  - government records
  access_details: Obtained under IRB approval with no additional approvals required;
    traffic and accident reports are held under controlled access.
raw_sources:
- id: aireadi:raw_data_retention
  name: Raw data retention and availability
  raw_data_details:
  - The raw data is saved and expected to be preserved by the AI-READI project at
    least for the duration of the project, but is not anticipated to be shared outside
    the project team at present, because it has not been mapped to standardized terminologies
    and because it may accidentally include personal health information or personally
    identifiable information, for example in free-text fields.
  - There is a possibility that raw data may be included in future releases of the
    controlled access dataset.
  - 'Data from devices are exported in their raw format to local storage at each site
    before conversion and upload: ECG as .xml, MoCA Duo output as .csv, retinal imaging
    in device-native formats, and at-home monitoring device data from environmental
    sensors, continuous glucose monitors and fitness trackers.'
regulatory_restrictions:
  regulatory_restrictions:
  - The healthsheet answers the question about export controls and other regulatory
    restrictions by referring to the license (https://doi.org/10.5281/zenodo.17555036);
    no export control regime is named.
  - 'HIPAA: the public set is stripped of Protected Health Information as defined
    by the HIPAA Privacy Rule via the Safe Harbor method. Results returned to participants
    are sent by HIPAA-compliant encrypted email.'
  - 'NIH Genomic Data Sharing Policy: licensees must comply with the data security
    and privacy standards established by NIH under that policy.'
  hipaa_compliant: compliant
  other_compliance:
  - The FAIRhub de-identification record states that no identifiers were collected,
    so no active de-identification was necessary, but that the project checked that
    no identifiable data per US HIPAA were present in the data.
  - Study conduct is subject to US human subjects research oversight through the University
    of Washington IRB with reliance agreements at UAB and UCSD; the study is recorded
    as not FDA regulated for drug or device.
  confidentiality_level: restricted
  description: 'Access to the public release is gated: it requires login through a
    verified ID system, agreement to use the data only for type 2 diabetes related
    research, and acceptance of the license terms. The controlled access set requires
    completed legal and privacy use agreements between the user''s institution and
    the AI-READI research programme.'
