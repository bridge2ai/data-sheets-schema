data_collectors:
- id: d4d:aireadi-collector-site-teams
  name: AI-READI site research teams
  role: Clinical research coordinators, research assistants, data managers, phlebotomists
    and lab assistants at the three data collection sites
  collector_details:
  - All research personnel at the three data sites who recruited, enrolled and collected
    data underwent training by the data manager at UAB and used a detailed Manual
    of Procedures (MOP) for reference. Successful completion of a certification process
    is required for all coordinators, which involved mandatory institutional compliance
    training for human subject research.
  - Prior to enrolling and testing participants, all coordinators are required to
    successfully administer all protocol elements to at least three volunteer practice
    subjects, meeting the standards outlined in the MOP. Data managers at each site
    oversee the process.
  - Roles described for the project include principal investigators and co-investigators,
    a program/project manager, a database manager, research/data scientists and postdoctoral
    fellows, clinical research coordinators, research assistants, software engineers,
    cloud engineers, phlebotomists, lab assistants and domain experts.
  - Details about the AI-READI team members involved in the data collection process
    are available at https://aireadi.org/team. Their effort was supported by the National
    Institutes of Health award OT2OD032644 based on the percentage of effort contributed,
    with salaries aligned to the funding guidelines at each site.
- id: d4d:aireadi-collector-central
  name: Central project and data curation team
  role: Central data curation, standardisation and platform engineering team
  collector_details:
  - Once data were sent from each of the study sites to the central project team,
    additional processing steps were conducted in preparation for dissemination, including
    mapping to standardized terminologies.
  - Data from developing software for de-identifying, data uploading and data sharing
    are handled by investigators in the project responsible for those components.
data_protection_impacts:
- name: Data protection impact analysis
  impact_details:
  - No data protection impact analysis has been conducted.
  - 'Related safeguards are described elsewhere: to prevent reidentification attempts
    the project states it is implementing a robust data dissemination system, a strict
    licence agreement and data watermarking for both public and controlled sets.'
description: Version 3.0.0 of the flagship multimodal dataset produced by the Artificial
  Intelligence Ready and Equitable/Exploratory Atlas for Diabetes Insights (AI-READI)
  project, one of four Data Generation Projects of the NIH Common Fund Bridge2AI program.
  The dataset contains data from 2280 participants with and without type 2 diabetes
  mellitus (T2DM), collected between 19 July 2023 and 1 May 2025 at three US sites
  (University of Alabama at Birmingham, University of California San Diego, and University
  of Washington) and harmonized across sites. Modalities include REDCap survey and
  clinical data mapped to the OMOP Common Data Model, 12-lead electrocardiography,
  retinal photography, optical coherence tomography (OCT), OCT angiography (OCTA),
  fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous glucose monitoring,
  wearable activity monitoring, and custom indoor environmental sensing. The release
  comprises 356,343 files totalling approximately 3.82 TB, organized following the
  Clinical Dataset Structure (CDS) v0.1.1. The dataset contains no protected health
  information; information on participant sex, race/ethnicity and medications used
  has been removed from this release. The stated goal is to enable AI/ML research
  into salutogenesis (the pathway from disease back to health) in T2DM.
direct_collection:
- name: Direct collection from participants
  is_direct: true
  collection_details:
  - The data was collected directly from participants across the three recruiting
    sites.
  - Recruitment pools were identified by screening electronic health records for diabetes
    and prediabetes ICD-10 codes for all patients who had an encounter with the sites'
    health systems within the past two years.
  - 'Some study data are obtained from other sources: medical records at the study
    sites, and driving and accident records obtained from the Department of Licensing.'
discouraged_uses:
- id: d4d:aireadi-discouraged-uses
  name: Discouraged uses
  discouragement_details:
  - The AI-READI dataset license imposes restrictions on the usage of the data; the
    restrictions are described in the license files available at https://doi.org/10.5281/zenodo.17555036.
  - Licensees shall not make clinical treatment decisions based on the data, as it
    is intended solely as a research resource.
  - Access to the public dataset requires agreeing to use the data only for type 2
    diabetes related research.
distribution_dates:
- id: aireadi:distribution_dates
  name: Release dates
  release_dates:
  - '2024-05-03'
  - '2024-11-08'
  - '2025-11-17'
  description: Version 1.0.0 was released on 2024-05-03, version 2.0.0 on 2024-11-08
    and version 3.0.0 on 2025-11-17. The source documents describe these in prose
    as the first version distributed in May 2024, the second in November 2024 and
    the third in November 2025. The protocol publication additionally records that
    the publicly accessible dataset from pilot data collection was made available
    in May 2024 and that all data collected through 31 July 2024 were made available
    in November 2024. De-identified data are released approximately yearly in two
    datasets, a controlled access set and a publicly accessible set with fewer requirements
    for access.
distribution_formats:
- id: d4d:aireadi-distribution-fairhub
  name: FAIRhub platform distribution
  description: The dataset will be available through the FAIRhub platform (https://fairhub.io/).
    The dataset's DOI is https://doi.org/10.60775/fairhub.3. The dataset is hosted
    on FAIRhub through Microsoft Azure; the version 3.0.0 documentation also describes
    Azure Storage access.
  access_urls:
  - https://fairhub.io/datasets/3
  - https://fairhub.io/
- id: d4d:aireadi-distribution-file-formats
  name: Distributed file formats
  description: The FAIRhub dataset metadata records the distributed media types as
    application/dicom, text/markdown, text/csv and application/json. Per-datatype
    standards are WFDB for electrocardiography, OMOP CDM CSV tables for clinical data,
    ESDS ASCII guidelines for environmental sensor data, DICOM for retinal photography,
    OCT, OCTA and FLIO, and Open mHealth for wearable activity and blood glucose data.
    All data files are in formats accessible with free software commonly used for
    such data types, so no specific software is required.
- id: d4d:aireadi-distribution-access-tiers
  name: Public and controlled access data releases
  description: 'Deidentified data are released approximately yearly in two datasets:
    a controlled access set and a publicly accessible set with fewer requirements
    for access. The controlled access dataset contains all data available in the publicly
    accessible set, plus more sensitive data that are only available for use by scientists
    whose institutions have completed legal and privacy use agreements with the AI-READI
    research programme. Accessing the dataset requires logging in through a verified
    ID system, agreeing to use the data only for type 2 diabetes related research,
    and agreeing to the license terms. The access type recorded in the dataset metadata
    is "PublicDownloadSelfAttestationRequired". Information regarding dataset availability
    and access is published at https://aireadi.org/goals/data-sharing, and the requirements
    for controlled access datasets were being developed by the Data Access Committee
    at the time of the protocol publication.'
  access_urls:
  - https://aireadi.org/goals/data-sharing
