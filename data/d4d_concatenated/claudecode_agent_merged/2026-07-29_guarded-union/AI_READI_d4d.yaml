future_use_impacts:
- id: aireadi:future_use_impact
  name: Impacts of the dataset's composition and collection on future uses
  impact_details:
  - To the extent of the creators' knowledge, no uses of the dataset are currently
    anticipated that could result in unfair treatment or harm. However, there is a
    theoretical risk of future re-identification.
  - Data used in developing AI systems are often a major source of downstream ethical
    issues; to prevent such issues, ethical, legal and social implications are considered
    at every stage of the project cycle, and documenting practices regarding creation,
    use and maintenance of clinical research datasets is treated as critically important
    so that AI developers can understand the provenance and intended use of the data.
  - Because sex, race and ethnicity are withheld from the public release, users of
    the public set cannot directly audit model performance by those attributes; the
    project instead supplies recommended splits aimed at reducing disparities in models
    developed using the dataset.
  - Users should be aware that the release does not yet achieve the intended balance
    across race/ethnicity, sex and diabetes severity, that recruitment was predominantly
    urban and hospital-based, and that Pacific Islander and Native American populations
    are not represented.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - University of Washington IRB approval number STUDY00016228, initially approved
    20 December 2022, with reliance agreements from the IRBs of the University of
    Alabama at Birmingham and the University of California, San Diego. Annual renewal
    is required.
  ethics_review_board:
  - University of Washington Institutional Review Board (Human Subjects Division)
  - University of Alabama at Birmingham IRB (reliance agreement)
  - University of California, San Diego IRB (reliance agreement)
  special_populations:
  - No special populations are purposefully included. Pregnancy and gestational diabetes
    are exclusion criteria, type 1 diabetes is an exclusion criterion, and eligibility
    is limited to adults aged 40 and older, so minors are not enrolled.
  - The project states it will engage in a tribal consultation to address barriers
    and facilitators of participation with the goal of collecting similar data within
    a Native American cohort in an ethical and respectful manner, through engagement
    with the Native Biodata Consortium. This is described as a separate co-learning
    effort rather than part of the released cohort.
  regulatory_compliance:
  - 'HIPAA Privacy Rule: the public set is stripped of Protected Health Information
    as defined by the HIPAA Privacy Rule via the Safe Harbor method, as well as information
    related to participant sex and race/ethnicity to prevent stigmatization of findings.'
  - 'NIH Genomic Data Sharing (GDS) Policy: the data license agreement requires licensees
    to comply with all data security and privacy standards established by NIH under
    its GDS Policy, referencing the NIH Best Practices for Controlled-Access Data
    Subject to the NIH GDS Policy.'
  - Results returned to participants are sent by HIPAA-compliant encrypted email.
id: https://doi.org/10.60775/fairhub.3
informed_consent:
- id: aireadi:informed_consent_record
  name: Informed consent procedures
  consent_obtained: true
  consent_type:
  - Written informed consent
  - Electronic consent (e-consent) with electronic signature, the study's preferred
    method
  - In-person consent obtained in a private room by a study team member
  consent_documentation:
  - Consent is documented via signature on the IRB-approved consent form; electronic
    signatures are captured through the UW ITHS REDCap installation and the signed
    form is automatically emailed to the subject.
  - The approved University of Washington consent form is published in the dataset
    documentation; other clinical sites operated under IRB reliance and used the same
    form with minor institution-specific language.
  withdrawal_mechanism:
  - Participants were permitted to withdraw consent at any time and cease study participation;
    any data that had been shared or used up to that point would stay in the dataset.
    This is clearly communicated in the consent document.
  consent_scope:
  - Consent covers participation in the study protocol, secondary use, banking and
    future sharing of data and specimens, with the relevant language included in the
    consent form.
  - The dataset consent metadata records a consent type of "ConsentSpecifiedNotElsewhereCategorised"
    with no non-commercial, geographic, research-type, genetic-only or methods restrictions
    recorded at the consent level, and the note that the public version of the dataset
    can only be used for type 2 diabetes related research while a private version
    will allow for more generic use.
instances:
- name: Participant records
  instance_type: participant (individual person enrolled in the AI-READI study)
  description: Each instance represents an individual patient. Each instance consists
    of all of the data available for an individual participating in the study, across
    survey data, clinical data, retinal imaging data, environmental sensor data, continuous
    glucose monitor data and wearable activity monitor data. These encompass tabular
    data, imaging data, and physiological signal/waveform data. There is no unstructured
    text data included in this dataset. Version 3.0.0 contains 2280 instances; version
    1.0.0 contained 204 and version 2.0.0 contained 1067. Across the whole cohort
    of 2280, the release documentation reports 380 Hispanic, 545 Asian, 519 Black
    and 836 White participants; 951 male and 1329 female; and 776 with no diabetes,
    560 lifestyle-controlled, 686 oral-medication controlled and 258 insulin-controlled,
    with mean age 60.8 years (SD 11.3).
  counts: 2280
  label: false
  label_description: No labels are provided. The dataset is described as hypothesis-agnostic,
    aimed at facilitating multiple potential downstream AI/ML applications.
intended_uses:
- name: Intended uses of the AI-READI dataset
  examples:
  - Artificial intelligence and machine learning research into type 2 diabetes mellitus,
    including salutogenic pathways from disease back to health.
  - Downstream pseudotime manifold analysis to predict disease trajectories from multimodal
    data across a range of disease severity.
  - Development of multimodal models spanning survey, clinical, imaging, waveform,
    wearable and environmental data for a single cohort.
  - Use as a model or blueprint for future efforts to develop other medical and health
    datasets targeted for AI/ML.
  use_category:
  - research
  usage_notes: Access to the public version requires agreeing to use the data only
    for type 2 diabetes related research. The dataset is intended solely as a research
    resource and, per the license agreement, must not be used to make clinical treatment
    decisions. Recommended training/validation/test splits are supplied in participants.tsv.
ip_restrictions:
  id: d4d:aireadi-ip-restrictions
  name: Intellectual property restrictions
  restrictions:
  - Title to the data, and all industrial and intellectual property rights therein,
    remain solely and exclusively with the Licensor and its suppliers, and the licensee
    shall not take any action inconsistent with such ownership. Any rights not expressly
    granted are reserved to the Licensor and its suppliers.
  - Third party IP-based or other restrictions on the data are addressed by reference
    to the license at https://doi.org/10.5281/zenodo.17555036.
  - There are no plans for the researchers involved in collecting the dataset to develop
    commercial products or file for patents; however, the dataset is publicly available
    with a commercial-friendly license and products or patents may be developed from
    it in the future.
is_deidentified:
  id: aireadi:deidentification
  name: De-identification status
  identifiable_elements_present: false
  method: HIPAA Safe Harbor, per the project publications; the dataset de-identification
    metadata separately records the de-identification type as "NoDeIdentification"
    with the explanation that no identifiers were collected so no active de-identification
    was necessary, but that the team verified no identifiable data per US HIPAA were
    present. Both statements are recorded as found in the source documents.
  identifiers_removed:
  - Protected Health Information as defined by the HIPAA Privacy Rule
  - Sex
  - Race and ethnicity
  - Medication used
  deidentification_details:
  - The public set is stripped of Protected Health Information via the HIPAA Safe
    Harbor method, as well as information related to the sex and race/ethnicity of
    the participants to prevent stigmatization of findings.
  - The data in the released dataset contain no protected health information.
  - 'Residual risk: AI algorithms can infer individual patient characteristics and
    could facilitate individual-level identification, so a robust data dissemination
    system, a strict licence agreement and data watermarking are implemented for both
    public and controlled sets. There is a theoretical risk of future re-identification.'
  - Identifiers held under controlled access include 5-digit ZIP code, sex, race,
    ethnicity, genetic sequencing data, past health records, medications, and traffic
    and accident reports.
is_tabular: false
