ethical_reviews:
- id: d4d:CM4AI_ethical_review
  name: CM4AI ethical review
  contact_person: Vardit Ravitsky (ravitskyv@thehastingscenter.org)
  review_details:
  - 'Ethical Review contacts recorded on the CM4AI Dataverse releases: Vardit Ravitsky
    (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca).'
  - The Ethics team employs a methodology inspired by Value-Sensitive Design, creating
    an axiological repository - a repository of values - to guide the articulation
    of design standards and expectations for the responsible design of datasets and
    AI technologies.
  - The Ethics team formulated the CM4AI Life Cycle, a framework designed to elucidate
    governance milestones throughout the data generation and AI system development
    processes, embedding ethical considerations at every phase.
  - The Ethics pillar supported the Bridge2AI Ethics Working Group and the Bridge2AI
    Data Sharing and Dissemination Working Group in developing a Code of Conduct,
    which outlines basic requirements for participants in the Bridge2AI Open House
    to access B2AI data (including CM4AI datasets), to attest and commit to prior
    to accessing the data.
  - The Ethics team conducts mixed empirical research combining qualitative and quantitative
    methods to capture community insights, and is developing tools to enhance awareness
    of the ethical, legal and social ramifications associated with CM4AI data and
    consequent AI systems.
  reviewing_organization: CM4AI Ethics Module (The Hastings Center; Simon Fraser University)
