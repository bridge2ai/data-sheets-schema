    San Diego; University of California San Francisco; Stanford University; University
    of Virginia.'
data_protection_impacts:
- name: Ethical governance and dual-use supervision
  impact_details:
  - A Data Access Committee will supervise ethical matters related to dataset distribution
    and potential dual licensing for commercial use.
  - Comprehensive guidelines and best practices are being established for the ethical
    development of AI systems leveraging this data, including tools aimed at enhancing
    awareness and comprehension of the ethical, legal, and social ramifications associated
    with CM4AI data and the consequent AI systems.
  - The ethical criterion for AI-readiness requires anticipating potential applications
    of the data and derived AI/ML systems, integrating them into data governance frameworks
    to optimize benefits and mitigate potential risks, and promoting their use for
    the collective good.
description: The Cell Maps for Artificial Intelligence (CM4AI) data release programme
  is the ongoing, quarterly series of AI-ready data releases produced by CM4AI, the
  Functional Genomics Data Generation Project of the U.S. National Institutes of Health
  Bridge2AI program. CM4AI's stated objective is to deliver machine-readable hierarchical
  maps of cell architecture as AI-ready data, produced from multimodal interrogation
  of chromatin modifiers, metabolic enzymes, and other proteins involved in cancer,
  neuropsychiatric, and cardiac disorders in disease-relevant cell lines under treated
  and untreated conditions. The input data streams are generated by mass spectrometry
  based proteomics (affinity purification mass spectrometry, AP-MS, and size exclusion
  chromatography mass spectrometry, SEC-MS), spatial proteomics / immunofluorescence
  (IF) cell imaging, and genetic perturbation using CRISPR/Cas9 (perturb-seq). The
  two cell systems under investigation are the triple-negative breast cancer line
  MDA-MB-468 (untreated / DMSO control, paclitaxel-treated, vorinostat-treated) and
  the induced pluripotent stem cell line KOLF2.1J (undifferentiated parental cells
  and iPSC-derived neural progenitor cells, neurons, and cardiomyocytes). Outputs
  are packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate
  format using an extended client-server version of the FAIRSCAPE framework, and are
  deposited in LibraData, the University of Virginia's Dataverse instance and an NIH-approved
  generalist repository. Individual quarterly releases are recorded as `resources`
  of this record; the June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, is the
  current release named by the CM4AI data releases page. The CM4AI portal and data
  releases page report project-level "Data Insights" figures of 1,374 protein interactions,
  53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes
  targeted, and a data volume of 21.4 TB.
direct_collection:
- name: Direct generation by CM4AI laboratories
  is_direct: true
  collection_details:
  - All released measurement data are generated by CM4AI's own laboratories from cultured
    cell lines rather than obtained from third parties; the cell lines themselves
    are obtained from external sources (ATCC for MDA-MB-468; the HipSci resource for
    KOLF2.1J).
discouraged_uses:
- name: Clinical and commercial constraints
  discouragement_details:
  - '"These laboratory data are not to be used in clinical decision-making or in any
    context involving patient care without appropriate regulatory oversight and approval."'
  - The data are licensed under CC BY-NC-SA 4.0, under which "You may not use the
    material for commercial purposes"; commercial use requires a separate license
    negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending upon
    the specific data package in question).
  - The release is described as most suitable for bioinformatics analysis of the individual
    datasets and as requiring domain expertise for meaningful analysis.
