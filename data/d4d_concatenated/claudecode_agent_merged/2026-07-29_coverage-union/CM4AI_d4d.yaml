  frequency: quarterly
  update_details:
  - Dataset will be regularly updated and augmented through the end of the project
    in November 2026.
  - Updates on a quarterly basis.
  - '"CM4AI releases data quarterly, ensuring continuous updates to the cell maps
    and input data streams."'
  - The project preprint states that data presented in a release "will be augmented
    regularly through the end of the project", and that software packages will be
    versioned as the project progresses, with the version used to produce each dataset
    referenced in the dataset's metadata.
