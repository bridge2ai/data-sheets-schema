relationships:
- id: d4d:CM4AI_relationships_modalities
  name: Relationships between data modalities
  relationship_details:
  - 'Input data streams are integrated by the Multi-Scale Integrated Cell (MuSIC)
    software pipeline: protein-protein interaction and immunofluorescence image data
    are separately embedded, co-embedded by contrastive deep learning, and then subjected
    to multi-resolution community detection to produce a hierarchy of protein assemblies
    output as the final cell map.'
  - The release metadata states that "Protein-protein interaction (SEC-MS), protein
    localization (IF imaging), and CRISPRi perturbSeq data interrogate sets of proteins
    which incompletely overlap."
  - 'Data are organized by cell line and treatment or differentiation condition: MDA-MB-468
    untreated, paclitaxel-treated and vorinostat-treated; KOLF2.1J undifferentiated
    (parental) and iPSC-derived neural progenitor cells, neurons and cardiomyocytes.'
