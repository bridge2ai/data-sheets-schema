machine_annotation_tools:
- name: CM4AI pipeline software
  tools:
  - node2vec
  - Human Protein Atlas deep learning image model
  - Contrastive deep learning co-embedding model
  - Community detection over the co-embedding space
  - Large language model assembly naming with confidence score
  - FAIRSCAPE-CLI and FAIRSCAPE server
  - Integrative Modeling Platform (IMP) version 2.18 with the Python Modeling Interface
  tool_descriptions:
  - node2vec is used to reduce the dimensionality of downloaded PPI networks, producing
    a PPI embedding that contains information about the protein's interactions.
  - A Human Protein Atlas deep learning model is used to reduce the dimensionality
    of IF images, producing an image embedding that contains information about protein
    localization.
  - PPI and image embeddings are integrated into a per-protein co-embedding using
    contrastive deep learning.
  - Community detection over all-by-all protein similarities in the co-embedding space
    produces the hierarchy of protein communities output as the cell map.
  - An LLM-based approach names sets of proteins and assigns a name confidence score
    during hierarchy evaluation.
  - FAIRSCAPE-CLI is a client-side Python3 application that creates RO-Crate packages;
    the FAIRSCAPE server registers them, assigns ARK persistent identifiers, and computes
    provenance entailments in the EVI Evidence Graph Ontology. Both packages are pip-installable
    and freely available under the MIT open-source license.
  - Integrative structure modeling uses the Python Modeling Interface package with
    the open-source Integrative Modeling Platform (IMP) package version 2.18, available
    at https://integrativemodeling.org.
