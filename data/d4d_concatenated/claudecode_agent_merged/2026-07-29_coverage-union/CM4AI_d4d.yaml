data_collectors:
- id: d4d:CM4AI_collector_lundberg
  name: Lundberg Lab, Stanford University
  role: Immunofluorescence spatial proteomics imaging
  collector_details:
  - The immunofluorescence subcellular image datasets are attributed in the Dataverse
    file metadata to imaging "in the Lundberg Lab at Stanford University, as part
    of the Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) project".
  - Raw image data for spatial proteomics is stated to be copyright of The Board of
    Trustees of the Leland Stanford Junior University.
- id: d4d:CM4AI_collector_krogan
  name: Nevan Krogan laboratory, University of California San Francisco
  role: Mass-spectrometry protein-protein interaction data generation
  collector_details:
  - The SEC-MS datasets on undifferentiated KOLF2.1J hiPSCs and on MDA-MB-468 cells
    following vorinostat or paclitaxel treatment are attributed in the Dataverse file
    metadata to generation "in the Nevan Krogan laboratory at the University of California
    San Francisco".
  - In the MuSIC pipeline, PPI networks for the cell line and conditions are downloaded
    from the Krogan Laboratory's deposition archive, and IF images from the Lundberg
    Laboratory's deposition archive.
- id: d4d:CM4AI_collector_project
  name: CM4AI Data Acquisition module
  role: Multimodal data generation across participating institutions
  collector_details:
  - 'CM4AI is organized into three pillars - Data, People, and Ethics - across six
    modules: Data Acquisition, Tools, and Standards; Skills and Workforce Development,
    and Teaming; and Ethics. The Data Acquisition module is responsible for generating
    the protein-protein interaction, spatial proteomics and genetic perturbation data
    streams.'
