acquisition_methods:
- name: Experimental acquisition from cultured human cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Data are generated directly by measurement of cultured human cell lines using
    immunofluorescence subcellular microscopy, AP-MS and SEC-MS mass spectrometry,
    and single-cell CRISPR-Cas perturbation screens.
  - Derived products are produced by the Multi-Scale Integrated Cell (MuSIC) pipeline,
    which computes embeddings and co-embeddings from the input data streams and applies
    community detection to build hierarchies.
  - The March 2025 release states that the CRISPRi Perturbation Cell Atlas findings
    were validated via phenotypic, protein-interaction, and metabolic tracing assays.
  - 'No data are reported by human subjects; the release records state Human Subjects:
    No.'
addressing_gaps:
- id: d4d:CM4AI_gap_black_box
  name: Uninterpretable genotype-phenotype models
  response: Machine learning models show great promise in analyzing the human genome
    to make predictions, but the inner workings of these models are typically difficult-to-interpret
    "black boxes". CM4AI generates a resource of matched data and tools to enable
    the creation of "visible" ML systems built directly on knowledge maps of cell
    and tissue architecture.
- id: d4d:CM4AI_gap_uncharted_architecture
  name: Incomplete knowledge of subcellular architecture
  response: Knowledge of how the proteins of the human genome are organized within
    cells is still evolving. CM4AI addresses this by interrogating cells with matched
    multimodal datasets and integrating them into hierarchical maps spanning from
    large assemblies representing cell compartments to small assemblies of proteins
    in close proximity.
- id: d4d:CM4AI_gap_ai_readiness
  name: Absence of ethical, provenanced, AI-ready biomedical data
  response: AI-readiness has been defined in multiple ways in the literature, and
    in all cases places significant requirements on datasets used to train and to
    be analyzed by AI/ML models. CM4AI's software pipeline and AI-readiness framework
    provide reusable enabling capabilities that establish FAIRness with rich metadata
    and persistent globally unique identifiers, machine-readable provenance graphs
    resolvable for all results, and characterization and validation of all datasets
    and data elements mapped to public ontology vocabularies.
- id: d4d:CM4AI_gap_workforce
  name: Gaps in the biomedical AI/ML workforce
  response: The Skills and Workforce Development module works to enhance the biomedical
    AI/ML workforce by recruiting and training a diverse group of participants in
    the scientific approach, data standards, and tools of CM4AI, because new training
    is needed to allow researchers to leverage the datasets produced by Bridge2AI
    and other programs.
anomalies:
- name: Incomplete overlap across modalities
  anomaly_details:
  - '"Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap."'
- name: Release page date inconsistency for the current release
  anomaly_details:
  - 'The CM4AI data releases page labels doi.org/10.18130/V3/HIGT4C as the "June 2026
    Data Release (Beta)" but displays "Released on: June 17, 2025", while the Dataverse
    record for the same DOI gives Publication Date 2026-06-17 and version 2 released
    2026-07-15T20:28:19Z.'
at_risk_populations:
  name: At-risk population involvement
  description: 'The Dataverse release records state Human Subjects: No, and no at-risk
    or vulnerable population participation is described in the source documents. The
    donors of the two established cell lines are described only by the characteristics
    recorded for those lines.'
  at_risk_groups_included: false
