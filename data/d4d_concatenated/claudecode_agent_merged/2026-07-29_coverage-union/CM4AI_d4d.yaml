- name: Targeted panel selection
  bias_type: selection_bias
  bias_description: The measured proteins and genes were chosen as targeted panels
    rather than sampled at random. CM4AI's design centres on 100 chromatin modifiers
    and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders,
    with imaging extended to further proteins pending significant hits from genetic
    perturbation and PPI results.
