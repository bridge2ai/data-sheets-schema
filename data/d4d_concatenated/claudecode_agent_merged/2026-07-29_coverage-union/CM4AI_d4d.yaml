preprocessing_strategies:
- id: d4d:CM4AI_preprocessing_music
  name: MuSIC data integration pipeline
  preprocessing_details:
  - 'Step a - Download PPI and image data: PPI networks for the cell line and conditions
    are downloaded from the Krogan Laboratory''s deposition archive, and IF images
    for the cell line and conditions from the Lundberg Laboratory''s deposition archive.'
  - 'Step b - Generate embeddings: downloaded PPI networks are processed with the
    node2vec deep learning model to produce a PPI embedding encoding each protein''s
    interactions; IF images are processed with a Human Protein Atlas deep learning
    model to produce an image embedding encoding protein localization.'
  - 'Step c - Co-embedding: the PPI and image embeddings are integrated into a per-protein
    co-embedding using contrastive deep learning, learned so that the original embeddings
    can be reconstructed with minimal information loss and proteins with similar PPI
    and image embeddings have similar co-embeddings.'
  - 'Step d - Protein community detection and hierarchy creation: community detection
    is performed on the all-by-all similarities of protein pairs in the co-embedding
    space, and the resulting hierarchy of protein communities is output as the final
    cell map.'
  - 'Step f - Integrative structure modeling: a bioinformatics pipeline annotates
    MuSIC communities with available structural information from the Protein Data
    Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry,
    and disordered-segment prediction; communities are ranked by available structural
    information and top-ranked communities are modeled with the Python Modeling Interface
    on the Integrative Modeling Platform (IMP) v2.18.'
  used_software:
  - id: d4d:CM4AI_software_cellmaps_pipeline
    name: Cell Mapping Toolkit (cellmaps_pipeline)
    url: https://github.com/idekerlab/cellmaps_pipeline
    description: A series of Python PyPI packages implementing the end-to-end cell
      mapping pipeline, with steps for processing protein imaging and biophysical
      interaction datasets, embedding the input modalities, integrating the modalities,
      constructing the hierarchical cell map, and annotating it against known resources.
      Documentation is hosted at https://cellmaps-pipeline.readthedocs.io/. Software
      comprising the Tools data integration pipeline is stated to be available under
      a BSD-3 open source license on GitHub for alpha-level tools, or in the Zenodo
      long-term archive for production-ready tools.
    license: BSD-3
  - id: d4d:CM4AI_software_imp
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    url: https://integrativemodeling.org
    description: Open-source package used, through the Python Modeling Interface (PMI)
      library, for integrative structure modeling of MuSIC communities.
- id: d4d:CM4AI_preprocessing_fairscape
  name: FAIRSCAPE AI-readiness packaging
  preprocessing_details:
  - The Standards module packages data, software, metadata and provenance graphs using
    the FAIRSCAPE framework, which consists of a client-side Python3 application (FAIRSCAPE-CLI)
    and a Python3 server application.
  - FAIRSCAPE-CLI is called when any computation or coherent set of computations in
    the pipeline completes; it receives metadata defining JSON-Schema schemas for
    the datasets in the computational unit as well as the inputs, computations, software,
    models and outputs, and creates an RO-Crate package with the datasets, metadata
    and software - or resolvable references to these components - plus unique stubs
    for identifier creation.
  - RO-Crates are sent to the FAIRSCAPE server where they are registered and assigned
    persistent, resolvable, globally unique identifiers, then decomposed into their
    individual components - datasets, models, software - which are also registered
    and assigned identifiers. The identifier scheme in use is ARK, with DOIs planned
    as supplementary identifiers for final-state publishable work.
  - The server computes end-to-end entailments on each RO-Crate's provenance as expressed
    in the EVI Evidence Graph Ontology and links them together where possible. Identifiers
    resolve to machine- and human-readable landing pages containing metadata expressed
    in JSON-LD using vocabularies from Schema.org, EVI, and other public ontologies,
    with alternate JSON-LD and RDF-XML serializations.
  - 'Present AI-readiness features comprise: establishing FAIRness including rich
    metadata and persistent globally unique identifiers; computing a machine-readable
    provenance graph resolvable as metadata for all results, including inputs, computations,
    software and outputs; and characterizing and validating all datasets and data
    elements, mapping data elements to public ontology vocabularies where appropriate
    using JSON-Schema mini-data-dictionary descriptions resolvable from the provenance
    graph metadata.'
  used_software:
  - id: d4d:CM4AI_software_fairscape
    name: FAIRSCAPE
    url: https://fairscape.github.io
    license: MIT
    description: AI-readiness framework with client-side and server-side PIP-installable
      Python3 packages, freely available under the open source MIT License. Copyright
      is held by the Rector and Board of Visitors of the University of Virginia. Installation
      instructions and a tutorial are published at https://fairscape.github.io.
