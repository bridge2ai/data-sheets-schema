retention_limit:
  id: d4d:CM4AI_retention
  name: Retention and preservation
  retention_period: Long term; no end date is stated for preservation.
  retention_details:
  - '"Long term preservation in the University of Virginia Dataverse, supported by
    committed institutional funds."'
  - 'Dataverse retains previously published versions: the repository states that files
    "will not be removed from previously published versions of the dataset".'
sampling_strategies:
- name: Targeted protein and gene panels in selected cell lines
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - MDA-MB-468 triple negative breast cancer cell line, obtained from ATCC, under
    untreated (DMSO control), paclitaxel and vorinostat conditions.
  - KOLF2.1J induced pluripotent stem cell line from the HipSci resource, as undifferentiated
    parental cells and as iPSC-derived neural progenitor cells, neurons and cardiomyocytes.
  strategies:
  - Multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes
    involved in cancer, neuropsychiatric, and cardiac disorders.
  - Spatial proteomics mapping of 100 chromatin regulators in MDA-MB-468 cells with
    and without paclitaxel or vorinostat, with another 500 proteins pending significant
    hits from the genetic perturbations and PPI results.
  - Expressed genome-scale CRISPRi perturbation covering 11,739 targeted genes in
    undifferentiated KOLF2.1J hiPSCs.
  - Released IF image sets cover 563 proteins of interest per condition in the March
    2025 release and 464 proteins of interest per condition in the June 2025, October
    2025 and June 2026 releases.
  why_not_representative:
  - '"Data in this release was derived from commercially available de-identified human
    cell lines" and "Does not represent all biological variants which may be seen
    in the population at large."'
sensitive_elements:
- name: Sensitivity assessment
  sensitive_elements_present: false
  sensitivity_details:
  - 'The Dataverse release records state Human Subjects: No; De-identified Samples:
    Yes; FDA Regulated: No.'
  - The project article states that CM4AI data are distinctive within Bridge2AI in
    that they are non-clinical (from tissue cultures) and are considered to be de-identified
    as they cannot be matched, with current knowledge, to a human subject.
status: Beta. Releases are described by their publisher as interim and "not yet in
  completed final form". The hosting Dataverse collection and the CM4AI web site both
  display the notice "This repository is under review for potential modification in
  compliance with Administration directives."
subpopulations:
- name: Cell line donor characteristics
  subpopulation_elements_present: true
  identification:
  - MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established
    from a metastatic site pleural effusion of a 51-year-old black female with a metastatic
    mammary adenocarcinoma, available from ATCC.
  - The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was derived from a healthy male Northern
    European donor, available from the Human Induced Pluripotent Stem Cells Initiative
    (HipSci) resource.
  distribution:
  - All released data derive from these two donor-derived human cell lines and their
    differentiated derivatives; the release metadata states that the data "does not
    represent all biological variants which may be seen in the population at large."
subsets:
- id: urn:cm4ai:subset:if-imaging
  name: Spatial proteomics / immunofluorescence imaging
  description: Immunofluorescence confocal image sets of MDA-MB-468 breast cancer
    cells under untreated, paclitaxel and vorinostat conditions, generated in the
    Lundberg Lab at Stanford University.
  is_data_split: false
  is_subpopulation: false
- id: urn:cm4ai:subset:sec-ms
  name: SEC-MS protein-protein interaction data
  description: Size exclusion chromatography mass spectrometry data for MDA-MB-468
    breast cancer cells with and without treatment, undifferentiated KOLF2.1J iPSCs,
    and iPSC-derived neural progenitor cells, neurons and cardiomyocytes, generated
    in the Nevan Krogan laboratory at UCSF.
  is_data_split: false
  is_subpopulation: false
- id: urn:cm4ai:subset:ap-ms
  name: AP-MS protein-protein interaction data
  description: Affinity purification mass spectrometry data for MDA-MB-468 breast
    cancer cells with treatment, first present among the captured releases in the
    June 2026 Data Release.
  is_data_split: false
  is_subpopulation: false
- id: urn:cm4ai:subset:perturb-seq
  name: CRISPRi perturb-seq data
  description: Single-cell CRISPRi perturbation sequencing data, including the expressed
    genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J hiPSCs
    covering 11,739 targeted genes and its raw sequence data, and perturb-seq data
    for MDA-MB-468 cells with and without treatment.
  is_data_split: false
  is_subpopulation: false
tasks:
- id: d4d:CM4AI_task_ppi_mapping
  name: Protein-protein interaction mapping
  response: 'Map protein-protein interactions of chromatin regulators under different
    conditions (cancer cells: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated,
    neurons and cardiomyocytes) using AP-MS on endogenously tagged cell lines and
    size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
    complex and interaction mapping, as two orthogonal mass-spectrometry-based approaches.'
- id: d4d:CM4AI_task_spatial_proteomics
  name: Spatial proteomics mapping
  response: Map the spatial subcellular organization of chromatin modifiers, their
    interactors and key signaling molecules involved in cancer, using the Human Protein
    Atlas resource of antibodies and immunofluorescence confocal microscopy, with
    automated fixation and permeabilization protocols established for the MDA-MB-468
    and KOLF2 cell lines.
- id: d4d:CM4AI_task_genetic_perturbation
  name: Genetic perturbation mapping
  response: Perform single-cell CRISPR screens perturbing chromatin regulators in
    MDA-MB-468 cells under three conditions (no treatment, paclitaxel or vorinostat)
    and in KOLF2.1J iPSCs, using a CRISPR lentiviral library targeting 100 chromatin
    factors with 6 guide RNAs per gene and inducible dCas9 lines, read out with the
    10x Genomics 3'HT kit; and to build an expressed genome-scale CRISPRi Perturbation
    Cell Atlas mapping transcriptional and fitness phenotypes for 11,739 targeted
    genes.
- id: d4d:CM4AI_task_map_integration
  name: Multimodal cell map construction
  response: Integrate the multimodal input data streams into hierarchical cell maps
    - directed acyclic graphs in which each node represents an assembly of proteins
    in proximity at a given scale - through the Multi-Scale Integrated Cell (MuSIC)
    pipeline, using self-supervised embedding approaches from deep learning followed
    by algorithmic community detection at multiple resolutions.
- id: d4d:CM4AI_task_ai_readiness_packaging
  name: AI-readiness packaging and provenance
  response: 'Package data, software, metadata and provenance graphs for AI-readiness
    using the FAIRSCAPE framework: create RO-Crate packages via FAIRSCAPE-CLI, register
    them on the FAIRSCAPE server, assign persistent globally unique ARK identifiers
    to crates and their components, and compute end-to-end provenance entailments
    expressed in the EVI Evidence Graph Ontology.'
third_party_sharing:
- id: d4d:CM4AI_third_party_sharing
  name: Distribution to third parties
  is_shared: true
  description: Data are distributed publicly through LibraData / University of Virginia
    Dataverse under CC BY-NC-SA 4.0, and through external repositories linked from
    the release pages (MassIVE, NCBI BioProject / SRA, and Figshare for the CRISPRi
    Perturbation Atlas of iPSCs).
title: Cell Maps for Artificial Intelligence (CM4AI) Data Release Programme
