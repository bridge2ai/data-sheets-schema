labeling_strategies:
- id: d4d:CM4AI_labeling_hierarchy_eval
  name: Cell map hierarchy annotation
  labeling_details:
  - Cell maps are annotated in a two-pronged approach. First, cell maps are aligned
    to known protein function and pathway resources, including the Gene Ontology (GO)
    and Reactome, to determine protein assemblies in the cell map with high overlap
    with known cell biology.
  - Second, assemblies in the cell maps are annotated using a large language model
    approach developed by the project to name sets of proteins and assign a name confidence
    score.
  data_annotation_protocol:
  - Hierarchy evaluation is implemented as a step of the MuSIC pipeline (cellmaps_hierarchyeval).
