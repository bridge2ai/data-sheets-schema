purposes:
- name: Interpretable genotype-phenotype learning
  description: Stated purpose of the CM4AI data generation project on both the NIH
    RePORTER project record and the CM4AI portal.
  response: As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation
    project seeks to map the spatiotemporal architecture of human cells and use these
    maps toward the grand challenge of interpretable genotype-phenotype learning.
    In genomics and precision medicine, machine learning models are often "black boxes,"
    predicting phenotypes from genotypes without understanding the mechanisms by which
    such translation occurs.
- name: Production of ethical, AI-ready datasets of cell architecture
  description: Stated overarching mission of CM4AI in the project article.
  response: CM4AI's overarching mission is to produce ethical, AI-ready datasets of
    cell architecture, inferred from multimodal data collected for human cell lines,
    to enable transformative biomedical AI research. CM4AI's objective is to deliver
    machine-readable hierarchical maps of cell architecture as AI-Ready data produced
    from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes
    involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
    cell lines under perturbed and unperturbed conditions.
- name: Enabling visible machine learning
  description: Stated purpose on the NIH RePORTER project record.
  response: These data will broadly stimulate research and development in "visible"
    machine learning systems informed by multi-scale cell and tissue architecture.
    This Bridge2AI data generation project will generate a resource of matched data
    and tools to enable the creation of "visible" ML systems, which are not black
    boxes but are built directly on knowledge maps of cell and tissue architecture.
- name: Demonstrating FAIR, provenanced, ethical AI-readiness practice
  description: Stated purpose in the project article and the NIH RePORTER project
    record.
  response: In addition to data and tools, this project will implement a standards
    data management approach based on FAIR access and software principles, with deep
    provenance and replication packages for representation of cell maps and their
    underlying datasets; initiate a research program in ethical AI, especially as
    it relates to how maps will be used in genomic medicine and model interpretation;
    and stimulate a diverse portfolio of training opportunities in the emerging field
    of biomachine learning.
