  name: June 2025 release revision
  erratum_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
  erratum_details:
  - The June 2025 Data Release page describes its content as "a revision of the June
    2025 Data Release", stating that "This revision includes adding RGB immunofluorescent
    images, corrections to ro-crate metadata, and changes to naming conventions."
    The page is served at Dataset Version 2.1 with citation version V2.
