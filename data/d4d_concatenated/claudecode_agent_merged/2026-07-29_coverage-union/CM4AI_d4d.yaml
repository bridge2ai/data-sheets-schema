  task_details:
  - Cell maps provide a foundation for downstream applications in human genomics,
    including interpretation of genetic variants and mutations.
  - As an example, cell maps have been used in AI tools for "visible machine learning"
    or "visible neural networks" (VNNs) to interrogate how protein assemblies in the
    cell affect cell-level phenotype predictions.
