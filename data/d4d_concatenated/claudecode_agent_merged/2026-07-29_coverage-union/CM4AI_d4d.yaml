cleaning_strategies:
- name: Quality control of perturbation screen data
  cleaning_details:
  - The project article states that following the single-cell CRISPR screens of 100
    chromatin regulators in MDA-MB-468 cells and undifferentiated KOLF2.1J iPSCs,
    "The resulting data are currently being QCed."
- name: Validation and characterization under the AI-readiness framework
  cleaning_details:
  - CM4AI's AI-readiness features include characterizing and validating all datasets
    and data elements, and mapping data elements to public ontology vocabularies where
    appropriate, using JSON-Schema mini-data-dictionary descriptions resolvable from
    the provenance graph metadata.
  - The Standards Module established FAIR AI-Readiness metadata and validation toolkits,
    which have been used to package and release the cell-line perturbation and measurement
    data.
collection_consents:
- id: d4d:CM4AI_consent
  name: Consent and sourcing of biological materials
  consent_details:
  - 'Dataverse Data Governance and Ethics fields state "Human Subjects: No", "De-identified
    Samples: Yes" and "FDA Regulated: No" for every release in the bundle.'
  - '"CM4AI has elected to use the cancer cell line MDA-MB-468 ... and the iPSC line
    KOLF2.1J ..., both of which have been ethically sourced."'
  - KOLF2.1J "is available for access by non-for-profit organizations via a simple
    MTA."
  - '"CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from
    tissue cultures) and are considered to be de-identified as they cannot be matched,
    with current knowledge, to a human subject."'
collection_mechanisms:
- name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - AP-MS performed on endogenously tagged cell lines to map protein-protein interactions
    of chromatin regulators. CM4AI endogenously tagged 17 genes in MDA-MB-468 and
    acquired AP-MS data under three conditions (untreated, paclitaxel and vorinostat
    treated), with 34 additional genes then in the process of being tagged.
  - AP-MS data for MDA-MB-468 with treatment are released in the June 2026 Data Release
    as cm4ai_apms_MDA-MB-468_paclitaxel.zip and cm4ai_apms_MDA-MB-468_vorinostat.zip.
- name: Size exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS used for proteome-wide complex and interaction mapping as an orthogonal
    mass spectrometry approach to AP-MS, performed in the Nevan Krogan laboratory
    at the University of California San Francisco.
  - SEC-MS has been performed on MDA-MB-468 cells under three conditions (untreated,
    paclitaxel and vorinostat treated) and on KOLF2 iPSCs and derivatives.
- name: Immunofluorescence subcellular confocal microscopy
  mechanism_details:
  - Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg
    Lab at Stanford University, using the Human Protein Atlas resource of antibodies.
  - Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and
    antibody against protein of interest (green channel).
  - Automated fixation and permeabilization protocols were established for a pipetting
    robot for the MDA-MB-468 and KOLF2 cell lines.
- name: Single-cell CRISPR perturbation screening (perturb-seq)
  mechanism_details:
  - A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs
    per gene was designed; MDA-MB-468 and KOLF2 CRISPR lines expressing inducible
    dCas9 were generated and characterized.
  - Single-cell CRISPR screens of 100 chromatin regulators with and without drug in
    MDA-MB-468 cells and in undifferentiated KOLF2.1J iPSCs were done using the 10x
    Genomics 3'HT kit.
  - An expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J hiPSCs maps
    transcriptional and fitness phenotypes for 11,739 targeted genes.
collection_timeframes:
- id: d4d:CM4AI_timeframe_project
  name: NIH project period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details:
  - Project start and end dates as recorded on the NIH RePORTER entry for application
    ID 11211616 (project number 3OT2OD032742-01S2, core project number OT2OD032742).
  - The Dataverse release metadata separately states that the dataset "will be regularly
    updated and augmented through the end of the project in November 2026". The two
    end dates are recorded as stated by their respective sources rather than reconciled.
- id: d4d:CM4AI_timeframe_deposit
  name: Dataverse data creation and deposit
  start_date: '2025-02-27'
  end_date: '2026-07-15'
  timeframe_details:
  - Every captured Dataverse release records Data Creation Date 2025-02-27 and Deposit
    Date 2025-02-27.
  - Individual files carry their own publication dates, ranging from 2025-03-03 in
    the March 2025 release through 2026-07-15 for the immunofluorescence image archives
    of the June 2026 release.
confidential_elements:
- id: d4d:CM4AI_confidential_elements
  name: Confidentiality of released content
  confidential_elements_present: false
  confidentiality_details:
  - 'All files in the captured Dataverse releases are marked File Access: Public.'
  - The releases nonetheless state that "Some datasets are under temporary pre-publication
    embargo", and the October 2025 and June 2026 releases list the external perturb-seq
    data links for KOLF2.1J iPSCs and for MDA-MB-468 cells as "Embargoed".
conforms_to: RO-Crate (Research Object Crate; https://www.researchobject.org/ro-crate/),
  packaged and registered through the FAIRSCAPE AI-readiness framework with JSON-Schema
  data dictionaries, ARK persistent identifiers, and EVI Evidence Graph Ontology provenance.
conforms_to_schema: JSON-Schema mini-data-dictionary descriptions for datasets and
  data elements, resolvable from the provenance graph metadata; provenance expressed
  in the EVI Evidence Graph Ontology, with vocabularies from Schema.org and other
  public ontologies; alternate serializations provided in JSON-LD and RDF-XML.
