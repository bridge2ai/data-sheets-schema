    cell line or treatment condition (for example cm4ai_ifimages_MDA-MB-468_paclitaxel.zip,
    cm4ai_mass-spec_KOLF2.zip, cm4ai_perturb-seq_KOLF2_cell_atlas.zip, cm4ai_apms_MDA-MB-468_vorinostat.zip).
