future_use_impacts:
- name: Interim status and quarterly change
  impact_details:
  - The releases are interim; content will be regularly updated and augmented through
    the end of the project in November 2026, with quarterly updates, and predicted
    cell maps will be added in future releases. Analyses should record the specific
    release DOI and version used.
- name: Repository review notice
  impact_details:
  - Both the CM4AI website and the University of Virginia Dataverse collection display
    the notice "This repository is under review for potential modification in compliance
    with Administration directives," which bears on the future availability of the
    material.
- name: Software and identifier evolution
  impact_details:
  - '"Software packages will be versioned as the project progresses, and the version
    used to produce each dataset will be referenced in the dataset''s metadata."'
  - The persistent identifier system currently in use is the ARK scheme, with DOIs
    a future feature as supplementary PIDs for final-state publishable work.
human_subject_research:
  id: d4d:CM4AI_human_subjects
  name: Human subject research status
  involves_human_subjects: false
  regulatory_compliance:
  - 'Human Subjects: No (recorded in the Data Governance & Ethics section of each
    release)'
  - 'FDA Regulated: No'
  description: CM4AI data are stated to be distinctive within Bridge2AI in that they
    are non-clinical, derived from tissue cultures, and are considered to be de-identified
    as they cannot be matched, with current knowledge, to a human subject. The underlying
    cell lines are commercially or institutionally available human cell lines described
    by the project as ethically sourced.
id: d4d:CM4AI
informed_consent:
- name: Consent basis for cell line derived data
  consent_documentation:
  - 'The Dataverse release records state Human Subjects: No and De-identified Samples:
    Yes.'
  - 'CM4AI states that both cell lines used have been ethically sourced: MDA-MB-468
    is available from ATCC, and KOLF2.1J is available from the HipSci resource and
    is available for access by not-for-profit organizations via a simple MTA.'
  - The project article states that CM4AI data are non-clinical (from tissue cultures)
    and are considered to be de-identified as they cannot be matched, with current
    knowledge, to a human subject.
  consent_scope:
  - No participant-level consent process for CM4AI data collection is described in
    the source documents; the ethical basis stated is the ethical sourcing of the
    established cell lines and the non-clinical, de-identified nature of the resulting
    data.
instances:
- name: Immunofluorescence subcellular images
  instance_type: Confocal immunofluorescence image sets of cultured human cells
  description: Immunofluorescence (ICC-IF) confocal images of the breast cancer cell
    line MDA-MB-468, imaged in the Lundberg Lab at Stanford University. Nuclei were
    stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody
    (yellow channel); microtubules with tubulin antibody (red channel); and antibody
    against protein of interest (green channel). Image sets are released per treatment
    condition (untreated, paclitaxel, vorinostat). The March 2025 release describes
    spatial localization of 563 proteins of interest per condition; the June 2025,
    October 2025 and June 2026 releases describe 464 proteins of interest per condition.
    The CM4AI portal reports a project-level total of 53,788 immunofluorescent images.
    The data releases page states that IF images for the iPSC-derived cell types are
    "coming soon".
  label: false
- name: SEC-MS protein interaction profiles
  instance_type: Size-exclusion chromatography mass spectrometry elution profiles
  description: Protein-protein interaction data generated by size exclusion chromatography-mass
    spectroscopy (SEC-MS) in the Nevan Krogan laboratory at the University of California
    San Francisco, on undifferentiated KOLF2.1J human induced pluripotent stem cells
    and on MDA-MB-468 human breast cancer cells following treatment with vorinostat
    or paclitaxel. The data releases page states that the curated iPSC and TNBC datasets
    each capture approximately 7,000 proteins by SEC-MS. The project article reports
    that SEC-MS in MDA-MB-468 cells identified 72 of 100 chromatin modifiers, 52 of
    them integral components of protein complexes, and detected PPI profiles of over
    a thousand complexes; SEC-MS in KOLF2 iPSCs and derivatives uncovered more than
    700 protein complexes in both parental iPSCs and differentiated neurons.
  label: false
- name: AP-MS protein interaction data
  instance_type: Affinity purification mass spectrometry interaction data
  description: Affinity purification mass spectrometry data for MDA-MB-468 breast
    cancer cells with treatment, released per treatment condition (paclitaxel, vorinostat)
    in the June 2026 Data Release. The project article states that 17 genes had been
    endogenously tagged in MDA-MB-468 with AP-MS data acquired under three conditions
    (untreated, paclitaxel and vorinostat treated), with 34 additional genes then
    in the process of being tagged. Earlier captured releases list AP-MS interactomes
    as "coming soon".
  label: false
- name: CRISPRi perturb-seq single-cell transcriptional profiles
  instance_type: Single-cell CRISPR interference perturbation sequencing data
  description: An expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated
    KOLF2.1J human induced pluripotent stem cells (hiPSCs) mapping transcriptional
    and fitness phenotypes associated with 11,739 targeted genes, together with the
    corresponding raw sequence data. The March 2025 release notes that these findings
    were validated via phenotypic, protein-interaction, and metabolic tracing assays.
    The October 2025 and June 2026 releases additionally describe perturb-seq data
    for MDA-MB-468 breast cancer cells with and without treatment. The data releases
    page describes perturb-seq of more than 11,000 genes (whole-genome) for the iPSC
    lineage and perturb-seq of 200 genes for the TNBC conditions.
  counts: 11739
  label: false
- name: RO-Crate metadata and provenance packages
  instance_type: RO-Crate metadata documents and provenance graph renderings
  description: Each release includes RO-Crate metadata (JSON / JSON-LD), release metadata
    archives, and HTML provenance graph renderings produced by the FAIRSCAPE framework.
    The June 2025 release includes a release RO-Crate with pointers to sub RO-Crates
    and an HTML datasheet summarizing key release information; the October 2025 and
    June 2026 releases bundle release metadata in cm4ai_release_metadata.zip.
  label: false
intended_uses:
- id: d4d:CM4AI_intended_uses
  name: Intended uses stated by the publisher
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes,
    treatment conditions, or genetic perturbations
  usage_notes: The current release is stated to be most suitable for bioinformatics
    analysis of the individual datasets, and to require domain expertise for meaningful
    analysis.
