  update_details:
    - >-
      Dataset will be regularly updated and augmented through the end of the project in November
      2026, on a quarterly basis.
    - >-
      The CM4AI data releases page states that CM4AI releases data quarterly, ensuring continuous
      updates to the cell maps and input data streams, and that data presented will be augmented
      regularly through the end of the project.
    - >-
      The RO-Crate rai:dataReleaseMaintenancePlan field carries the same commitment on the release
      root entity and on every per-modality sub-crate.

retention_limit:
  name: Long-term preservation commitment
  retention_period: Indefinite, subject to institutional preservation commitment
  retention_details:
    - >-
      Long term preservation in the University of Virginia Dataverse
      (https://dataverse.lib.virginia.edu/), supported by committed institutional funds.
    - >-
      Dataverse notes that files are not removed from previously published versions of a dataset,
      so superseded release versions remain retrievable.
    - >-
      Both the CM4AI collection in Dataverse and the CM4AI website carry the notice "This
      collection is under review for potential modification in compliance with Administration
      directives", which qualifies the preservation commitment.

version_access:
  name: Version access
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - 10.18130/V3/HIGT4C - June 2026 Data Release (Beta), Dataverse version 2.0 (current)
    - 10.18130/V3/K7TGEM - October 2025 Data Release (Beta), Dataverse version 2.1
    - 10.18130/V3/F3TD5R - June 2025 Data Release (Beta), Dataverse version 2.1
    - 10.18130/V3/B35XWX - March 2025 Data Release (Beta), Dataverse version 1.4
    - 10.18130/V3/DXWOS5 - earlier CM4AI Data Release cited in the project description preprint
    - May 2024 Data Release, listed in the CM4AI website archive without a DOI on that page
  version_details:
    - >-
      Each release carries its own DOI and its own Dataverse version number; the DOI, not the
      Dataverse version, distinguishes releases.
    - >-
      All prior releases remain publicly accessible; the CM4AI data releases page lists May 2024,
      March 2025, June 2025 and October 2025 as archive entries alongside the current release.
    - >-
      The RO-Crate root entity of the June 2026 release declares its own version as "1.0", which
      does not correspond to the Dataverse version 2.0 of the same release.

extension_mechanism:
  name: Software and pipeline extension
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details:
    - >-
      The Cell Mapping Toolkit implements the end-to-end pipeline as a series of pip-installable
      Python packages with complete user documentation at https://cellmaps-pipeline.readthedocs.io/
      and a step-by-step guide in the GitHub repository, providing a flexible and generalizable
      framework for constructing new cell maps from multiple input modalities.
    - >-
      Software comprising the Tools data integration pipeline is available under the BSD-3
      open-source license in GitHub for alpha-level tools, and in the Zenodo long-term archive for
      production-ready tools; links to these tools are packaged in RO-Crates as part of CM4AI
      provenance representations.
    - >-
      The FAIRSCAPE AI-readiness framework is documented with a tutorial and installation
      instructions at https://fairscape.github.io and is available under the MIT licence.
    - >-
      No mechanism for third parties to contribute data to the CM4AI releases is described in the
      sources; extension is through reuse of the released data and open-source software.

ethical_reviews:
  - name: Ethical review contact - Vardit Ravitsky
    description: >-
      Vardit Ravitsky (ORCID 0000-0002-7080-8801, ravitskyv@thehastingscenter.org, The Hastings
      Center; listed with affiliation University of Montreal in the Dataverse author lists), named
      on the June 2025, October 2025 and June 2026 Dataverse releases and in the RO-Crate
      ethicalReview field (spelled "Vardit Ravistky" in the crate).
    contact_person: https://orcid.org/0000-0002-7080-8801
    review_details:
      - >-
        The Dataverse Data Governance and Ethics section records Ethical Review as Vardit Ravitsky
        (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon
        (jean-christophe_belisle-pipon@sfu.ca).
      - >-
        No institutional review board approval is recorded, consistent with the determination that
        the work does not constitute human subjects research.
  - name: Ethical review contact - Jean-Christophe Belisle-Pipon
    description: >-
      Jean-Christophe Belisle-Pipon (ORCID 0000-0002-8965-8153,
      jean-christophe_belisle-pipon@sfu.ca, Simon Fraser University), named on the June 2025,
      October 2025 and June 2026 Dataverse releases and in the RO-Crate ethicalReview field.
    contact_person: https://orcid.org/0000-0002-8965-8153
    reviewing_organization: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/organization/SFU
    review_details:
      - >-
        The CM4AI Ethics Module worked with the Data Acquisition, Tools and Standards Modules to
        develop a plan for ethical preparation, licensing, dissemination and Data Access
        supervision of CM4AI datasets, balancing openness with protection of intellectual property
        and supervision of potential commercialization efforts.
      - >-
        The Ethics team employs a methodology inspired by Value-Sensitive Design, is building an
        axiological repository of values, and is formulating the CM4AI Life Cycle framework of
        governance milestones.
      - >-
        The Ethics Pillar supported the Bridge2AI Ethics Working Group and the Data Sharing and
        Dissemination Working Group in developing a Code of Conduct that participants in the
        Bridge2AI Open House must attest and commit to prior to accessing B2AI data including
        CM4AI datasets.

data_protection_impacts:
  - name: Data protection assessment
    impact_details:
      - >-
        No formal data protection impact assessment is recorded in the sources. The releases state
        Human Subjects: No, De-identified Samples: Yes and FDA Regulated: No, and the RO-Crate
        records a human subjects exemption determination.
      - >-
        CM4AI data are considered de-identified as they cannot be matched, with current knowledge,
        to a human subject, so re-identification risk is treated as absent rather than mitigated.
      - >-
        Confidentiality level is declared Unrestricted and all deposited files are Public with no
        access request required.
      - >-
        A Data Access Committee supervises ethical matters related to dataset distribution and
        potential dual licensing for commercial use.

human_subject_research:
  name: Human subjects determination
  involves_human_subjects: false
  irb_approval:
    - >-
      Not applicable. No IRB approval is recorded on any release or in the RO-Crate, consistent
      with the exemption determination.
  ethics_review_board:
    - >-
      Ethical oversight is provided by the named CM4AI ethical review contacts, Vardit Ravitsky
      and Jean-Christophe Belisle-Pipon, rather than by an institutional review board.
  special_populations:
    - None. No human subjects are enrolled.
  regulatory_compliance:
    - Human Subjects, No, as recorded in the Dataverse Data Governance and Ethics section.
    - FDA Regulated, No, as recorded in the Dataverse Data Governance and Ethics section.
    - >-
      RO-Crate humanSubjectExemption, Exempt - research with commercially available de-identified
      human cell lines does not constitute human subjects research.
    - >-
      RO-Crate humanSubjectResearch, None - data collected from commercially available cell lines.

informed_consent:
  - name: Informed consent applicability
    consent_obtained: false
    consent_type:
      - >-
        Not applicable. The RO-Crate d4d:informedConsent field records "Not applicable - data
        collected from commercially available de-identified human cell lines (KOLF2.1J iPSC and
        MDA-MB-468). No primary human subjects research conducted under this release."
    consent_documentation:
      - >-
        No consent documentation is held by CM4AI. Access to the KOLF2.1J line is governed by a
        material transfer agreement with the HipSci resource for not-for-profit organizations; the
        MDA-MB-468 line is available from ATCC.
    withdrawal_mechanism:
      - Not applicable; no human subjects are enrolled and no consent was obtained by CM4AI.
    consent_scope:
      - >-
        Not applicable. CM4AI states that both cell lines have been ethically sourced, but no
        subject-level consent scope governs reuse of the released data.

at_risk_populations:
  name: At-risk population protections
  at_risk_groups_included: false
  special_protections:
    - >-
      The RO-Crate d4d:atRiskPopulations field records "None - no human subjects involved;
      commercially sourced de-identified cell lines only."
  assent_procedures:
    - Not applicable; no human subjects are enrolled.
  guardian_consent:
    - Not applicable; no human subjects are enrolled.

license_and_use_terms:
  name: Licence and use terms
  data_use_permission:
    - general_research_use
    - no_commercial_use
  license_terms:
    - >-
      Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0),
      https://creativecommons.org/licenses/by-nc-sa/4.0/, applies to all four Dataverse releases.
    - >-
      Users are free to share (copy and redistribute the material in any medium or format) and
      adapt (remix, transform and build upon the material), subject to Attribution, NonCommercial
      and ShareAlike terms and to the prohibition on additional legal or technological
      restrictions.
    - >-
      Attribution is required to the copyright holders and the authors; any publications
      referencing this data or derived data products should cite the Related Publications as well
      as directly citing this data collection.
    - >-
      Copyright (c) 2026 The Regents of the University of California except where otherwise noted;
      spatial proteomics raw image data is copyright (c) 2026 The Board of Trustees of the Leland
      Stanford Junior University. The March 2025 release records the same statement with year
      2025.
    - >-
      Commercial use requires a separate license negotiation with the copyright holder (UCSD,
      Stanford and/or UCSF depending upon the specific data package in question).
    - >-
      Dataverse community norms as well as good scientific practices expect that proper credit is
      given via citation using the data citation shown on the dataset page.
    - >-
      Licensing and reuse enquiries are directed to the point of contact recorded on every
      release, Trey Ideker (ORCID 0000-0002-1708-8454, tideker@health.ucsd.edu, University of
      California San Diego).
    - >-
      Licence terms are not uniform across the RO-Crate: the two EndoTag AP-MS sub-crates and the
      SEC-MS KOLF2 differentiation sub-crate declare CC0 1.0 Universal
      (https://creativecommons.org/publicdomain/zero/1.0/), while the IF image sub-crates, the
      treated cancer-cell SEC-MS sub-crate and both perturbation atlas sub-crates declare CC
      BY-NC-SA 4.0. This heterogeneity is visible only in the RO-Crate.
  contact_person: https://orcid.org/0000-0002-1708-8454

ip_restrictions:
  name: Intellectual property restrictions
  restrictions:
    - >-
      Commercial use requires a separate license negotiation with the copyright holder, which is
      UCSD, Stanford and/or UCSF depending upon the specific data package in question.
    - >-
      Derivatives must be distributed under the same licence as the original (ShareAlike), and
      licensees may not apply legal terms or technological measures that legally restrict others
      from doing anything the licence permits.
    - >-
      Copyright in the data is held by The Regents of the University of California except where
      otherwise noted; The Board of Trustees of the Leland Stanford Junior University holds
      copyright in the spatial proteomics raw image data.
    - >-
      A Data Access Committee supervises ethical matters related to dataset distribution and
      potential dual licensing for commercial use.
    - >-
      CM4AI integration and packaging software is separately licensed under non-restrictive
      open-source terms (BSD-3 for the Tools pipeline, MIT for FAIRSCAPE), so software licensing
      does not follow the data licence.

regulatory_restrictions:
  name: Regulatory and access restrictions
  confidentiality_level: unrestricted
  hipaa_compliant: not_applicable
  regulatory_restrictions:
    - FDA Regulated, No.
    - >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
    - >-
      No export control restrictions are stated in any source.
  other_compliance:
    - Human Subjects, No; De-identified Samples, Yes.
    - >-
      Exempt from human subjects research determination: research with commercially available
      de-identified human cell lines does not constitute human subjects research.
    - >-
      Access to the released files is public and requires no account, request or guestbook
      completion beyond the standard Dataverse download flow.
    - >-
      Data governance is exercised by the CM4AI Data Governance Committee contact Jillian Parker
      (jillianparker@health.ucsd.edu, University of California San Diego), recorded as "Jilian
      Parker" in the RO-Crate dataGovernanceCommittee field, and by a Data Access Committee that
      supervises dataset distribution and potential dual licensing for commercial use.
  governance_committee_contact: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/person/JillianParker

third_party_sharing:
  - name: Distribution through third-party repositories
    is_shared: true
    description: >-
      Raw acquisitions and some processed products are hosted outside the University of Virginia
      Dataverse, in MassIVE (AP-MS and SEC-MS raw data, accessions MSV000101915, MSV000101917,
      MSV000100676 and MSV000098237), FigShare (the processed perturbation cell atlas) and NCBI
      (raw perturbation sequences, embargoed at capture). The RO-Crate records these accessions
      and URLs; the Dataverse release pages provide unlabelled links only.

external_resources:
  - name: RO-Crate AI-readiness package for the June 2026 release
    archival: true
    external_resources:
      - >-
        Persistent identifier
        https://fairscape.net/api/ark:59853/rocrate-cell-maps-for-artificial-intelligence-June-2026-data-release
        for the release RO-Crate, conforming to https://w3id.org/ro/crate/1.2 and generated by
        FAIRSCAPE version 1.1.3.
      - >-
        Provenance and characterization counters declared on the crate root: 53,877 datasets;
        1,976 computations or experiments; 6 software instances; 20 schemas; 55,859 total
        entities; 8 entities with checksums; 0 entities with summary statistics; declared total
        content 21,051,331,945,400 bytes, reported as 19.9 TB.
      - >-
        Subject terms attached to the crate root: MeSH Breast Neoplasms (D001943), Induced
        Pluripotent Stem Cells (D057026), CRISPR-Cas Systems (D064113), Mass Spectrometry
        (D013058), Fluorescent Antibody Technique (D005453), Paclitaxel (D017239) and Vorinostat
        (D000077337); EDAM topics Proteomics (topic_0121), RNA-Seq (topic_3170), Functional
        genomics (topic_3320) and Machine learning (topic_3474); Cellosaurus MDA-MB-468
        (CVCL_0419) and KOLF2.1J (CVCL_B5P3).
      - >-
        The crate ships alongside ai_ready_score.json, an AI-readiness self-assessment scoring six
        dimensions (FAIRness, provenance, characterization, pre-model explainability, ethics,
        sustainability and computability) with every criterion marked as having content.
      - >-
        The crate is delivered inside cm4ai_release_metadata.zip on the June 2026 Dataverse
        release; the extracted tree is dominated by per-modality file listings.
    future_guarantees:
      - >-
        FAIRSCAPE-generated persistent identifiers resolve to complete human- and machine-readable
        metadata including licensing information and links to the underlying datasets.
    restrictions:
      - >-
        The AI-readiness self-assessment is generated by the producing project rather than by an
        independent assessor, and it records full compliance on every criterion including
        verifiability, despite only 8 of 55,859 entities carrying checksums.
  - name: Portals, registries and companion resources
    archival: false
    external_resources:
      - >-
        CM4AI web portal, https://cm4ai.org/, built on the U-BRITE platform, with a data releases
        page at https://cm4ai.org/data-releases/.
      - >-
        Network Data Exchange (NDEx), used to share computed cell maps, viewable in a web browser
        or through Cytoscape, HiView and the Python ndex2 library.
      - >-
        Multiscale Integrated Cell visualization portal at https://musicmaps.ai/u2os-cellmap/,
        associated with the published U2OS cell map.
      - >-
        NIH RePORTER project record https://reporter.nih.gov/project-details/11211616 for the
        CM4AI data generation project.
      - >-
        The Data Insights panel of the CM4AI website reports project-wide counters of 1,374
        protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated,
        11,739 genes targeted and a data volume of 21.4 TB. These are project-level figures, not
        per-release counts, and the 21.4 TB figure does not match either of the two totals
        declared in the June 2026 RO-Crate.
    future_guarantees:
      - >-
        Long-term preservation is committed for the Dataverse deposits only; portal and registry
        availability is not covered by that commitment.
    restrictions:
      - >-
        Both the CM4AI website and the Dataverse collection carry the notice "This repository is
        under review for potential modification in compliance with Administration directives".
  - name: Open-source software
    archival: true
    external_resources:
      - >-
        Cell Mapping Toolkit, https://github.com/idekerlab/cellmaps_pipeline, documented at
        https://cellmaps-pipeline.readthedocs.io/, BSD-3 for alpha tools with production tools
        archived in Zenodo.
      - >-
        FAIRSCAPE AI-readiness framework, https://fairscape.github.io, MIT licence, copyright the
        Rector and Board of Visitors of the University of Virginia.
      - >-
        Integrative Modeling Platform (IMP), http://integrativemodeling.org, used for integrative
        structure modelling of protein assemblies.
    future_guarantees:
      - >-
        Software packages are versioned as the project progresses, and the version used to produce
        each dataset is referenced in that dataset's metadata.

