instances:
  - name: AP-MS protein interaction acquisitions
    description: >-
      Affinity purification-mass spectrometry raw data and derived interaction data generated from
      endogenously tagged MDA-MB-468 cells under paclitaxel or vorinostat perturbation. All AP-MS
      experiments were performed in four biological replicates; each AP-MS batch includes an
      untagged parental control, ten chromatin-modifier tagged cell lines and a positive control
      tagged line, with DMSO-treated samples serving as vehicle control. AP-MS interactomes first
      appear as released data in the June 2026 release; earlier releases listed them as
      forthcoming.
    instance_type: mass spectrometry acquisition and derived protein-protein interaction data
    data_topic: http://edamontology.org/topic_0121
    data_substrate: https://www.cellosaurus.org/CVCL_0419
    label: false
  - name: SEC-MS protein elution profiles - cancer cells
    description: >-
      Size-exclusion chromatography-mass spectrometry data generated on MDA-MB-468 human breast
      cancer cells following treatment with vorinostat or paclitaxel, in the Nevan Krogan
      laboratory at the University of California San Francisco. CM4AI reports detection of PPI
      profiles for over a thousand complexes in MDA-MB-468 cells, identifying 72 of 100 chromatin
      modifiers, 52 of which are integral components of protein complexes.
    instance_type: size-exclusion chromatography-mass spectrometry elution profile data
    data_topic: http://edamontology.org/topic_0121
    data_substrate: https://www.cellosaurus.org/CVCL_0419
    label: false
  - name: SEC-MS protein elution profiles - iPSC and derivatives
    description: >-
      Size-exclusion chromatography-mass spectrometry data on undifferentiated KOLF2.1J human
      induced pluripotent stem cells and iPSC-derived neural progenitor cells, neurons and
      cardiomyocytes, generated in the Nevan Krogan laboratory at the University of California San
      Francisco. CM4AI reports uncovering more than 700 protein complexes in both parental iPSCs
      and differentiated neurons, with the flagship curated dataset capturing approximately 7,000
      proteins.
    instance_type: size-exclusion chromatography-mass spectrometry elution profile data
    data_topic: http://edamontology.org/topic_0121
    data_substrate: https://www.cellosaurus.org/CVCL_B5P3
    label: false
  - name: Immunofluorescence confocal images
    description: >-
      Immunofluorescence-based staining (ICC-IF) and confocal microscopy images acquired in the
      Lundberg Lab at Stanford University showing the spatial localization of proteins of interest
      in MDA-MB-468 cells with and without chemotherapy. Nuclei were stained with DAPI (blue
      channel), endoplasmic reticulum with a calreticulin antibody (yellow channel), microtubules
      with a tubulin antibody (red channel) and the protein of interest with a specific antibody
      (green channel). The number of imaged proteins differs by release: 563 proteins per
      treatment arm in the March 2025 release and 464 proteins per treatment arm in the June 2025
      and October 2025 releases; the CM4AI website reports IF images for 523 proteins in the
      curated triple-negative breast cancer dataset. The counts field records the 53,788
      immunofluorescent images reported project-wide on the CM4AI website, which is a
      project-level total rather than a per-release count.
    instance_type: four-channel immunofluorescence confocal microscopy image
    data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D005453
    data_substrate: https://www.cellosaurus.org/CVCL_0419
    counts: 53788
    label: true
    label_description: >-
      Each image is associated with the antibody target protein of interest; reference channels
      provide common subcellular landmarks.
  - name: CRISPRi perturb-seq single-cell transcriptional profiles
    description: >-
      Expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced pluripotent
      stem cells mapping transcriptional and fitness phenotypes. A CRISPR lentiviral library
      targeting chromatin factors with six guide RNAs per gene was used, and single-cell CRISPR
      screens were performed with the 10x Genomics 3'HT kit in MDA-MB-468 cells with and without
      drug and in undifferentiated KOLF2.1J iPSCs. The counts field records the 11,739 targeted
      genes rather than a number of cells, which is not stated in the sources.
    instance_type: single-cell CRISPRi perturbation transcriptome
    data_topic: http://edamontology.org/topic_3170
    data_substrate: https://www.cellosaurus.org/CVCL_B5P3
    counts: 11739
    label: true
    label_description: >-
      Each single-cell profile is associated with the CRISPRi guide RNA and targeted gene
      perturbation applied to that cell.

relationships:
  - name: Release-to-modality packaging
    description: >-
      Structure of the RO-Crate graph shipped with the June 2026 release.
    relationship_details:
      - >-
        The June 2026 release RO-Crate root entity
        (ark:59853/rocrate-cell-maps-for-artificial-intelligence-June-2026-data-release) declares
        60 hasPart members and links to nine per-modality sub-crates covering AP-MS (paclitaxel,
        vorinostat), IF images (paclitaxel, untreated, vorinostat), SEC-MS (iPSC differentiation,
        treated cancer cells) and perturb-seq (cell atlas, raw sequence data).
      - >-
        Sub-crates are linked to their underlying acquisitions by EVI provenance edges
        (EVI#inputs, EVI#outputs) that reference sample, instrument, experiment, computation,
        software and schema entities; each sub-crate carries a localEvidenceGraph pointer to a
        per-modality provenance graph rendering.
      - >-
        Two AP-MS sub-crates additionally declare membership in a
        "January 2026 data release" crate, indicating that the same modality packages are shared
        across successive quarterly releases.
  - name: Cross-modality matching
    description: >-
      How instances of different modalities relate to one another.
    relationship_details:
      - >-
        AP-MS and SEC-MS interaction data, IF localization images and CRISPRi perturb-seq profiles
        are matched by gene and protein identity so that they can be fused into a single
        multimodal embedding by the MuSIC pipeline.
      - >-
        The protein sets interrogated by SEC-MS, IF imaging and CRISPRi perturb-seq overlap
        incompletely, so cross-modality joins are partial.
      - >-
        Computed cell maps, which are the hierarchical directed acyclic graphs relating protein
        assemblies at multiple scales, are not included in the releases described here.

anomalies:
  - name: Release date inconsistency between the CM4AI website and Dataverse
    anomaly_details:
      - >-
        The CM4AI data releases page labels DOI 10.18130/V3/HIGT4C as the "June 2026 Data Release
        (Beta)" but displays "Released on: June 17, 2025", while the Dataverse record for the same
        DOI reports publication date 2026-06-17 and version 2 released 2026-07-15T20:28:19Z.
  - name: RO-Crate root version and date disagree with the Dataverse record
    anomaly_details:
      - >-
        The June 2026 RO-Crate root entity declares version "1.0" and datePublished "2026-06-30",
        whereas the Dataverse record for the same release is version 2.0 with publication date
        2026-06-17.
      - >-
        The citation string embedded in the RO-Crate gives the year as 2025 and version "V1" for
        the June 2026 release, while the Dataverse citation gives 2026 and V2.
      - >-
        The RO-Crate citation string names authors "Park, S" and "Zhao, X" who do not appear in
        the Dataverse author list for any of the four releases, and omits "Marquez C" who does.
  - name: Stale checksums and sizes on RO-Crate sub-crate entities
    anomaly_details:
      - >-
        The MD5 values recorded on the June 2026 RO-Crate IF sub-crates (9422486c80bc9e1d35b2fbbc72a5f043
        for paclitaxel, 0b4d129f5fbc3bb7f7ea564cd032cef7 for untreated, ac577109a41a9806978461157b777d52
        for vorinostat) are the checksums of the March 2025 release files
        cm4ai-v0.6-beta-if-images-*.zip, not of the June 2026 IF archives, whose Dataverse
        checksums are 6c1a86520eec2696ec19444eb8a8b428, 6d066e6b9d762284c6aa5d0b44565568 and
        df79632753989ef23b0a3df6604d4af1 respectively.
      - >-
        The contentSize values on those IF sub-crates (2.6 GB, 3.2 GB, 2.8 GB) likewise match the
        March 2025 archives rather than the June 2026 archives (3.8 GB, 4.6 GB, 4.2 GB), and their
        datePublished is recorded as 02/28/2025.
      - >-
        The MD5 values on the perturbation cell atlas sub-crates
        (cbdb263b1c099396d75e16f00a79a818, 1cafefa32a897998e3e2ba0a29a3ef5c) and on the treated
        cancer-cell SEC-MS sub-crate (cb67e7749b15ce87b9042a9feba9d032) are the checksums of March
        2025 release ro-crate-metadata.json files.
  - name: Reported total content size varies by source
    anomaly_details:
      - >-
        The June 2026 RO-Crate root declares contentSize "19.9 TB" and evi:totalContentSizeBytes
        21,051,331,945,400, which are not equal under either decimal (about 21.05 TB) or binary
        (about 19.15 TiB) interpretation.
      - >-
        The CM4AI website reports a project data volume of 21.4 TB.
      - >-
        These figures cover logical content including externally hosted repository data and are
        much larger than the ten archives actually deposited on the June 2026 Dataverse release,
        which total roughly 13 GB.
  - name: Sparse checksum coverage in the RO-Crate
    anomaly_details:
      - >-
        The RO-Crate declares 55,859 total entities but only 8 entities with checksums; the
        accompanying AI-readiness self-assessment records this as "0% of files have checksums
        (8/55859)".
      - >-
        The RO-Crate also declares evi:entitiesWithSummaryStats as 0, so no summary statistics are
        attached to any entity.
  - name: Name spelling and format inconsistencies in the RO-Crate
    anomaly_details:
      - >-
        The ethical review contact is spelled "Vardit Ravistky" in the RO-Crate and "Vardit
        Ravitsky" on the Dataverse release pages; the data governance contact is "Jilian Parker"
        in the RO-Crate and "Jillian Parker" on the Dataverse release pages.
      - >-
        Dates in the RO-Crate mix ISO 8601 timestamps (2026-05-22T13:23:35.699025+00:00) with
        ambiguous slash-separated values (02/28/2025, 9/1/2022, 10/13/25), so slash-formatted
        dates cannot be disambiguated from the crate alone.
      - >-
        Several isPartOf references in the RO-Crate carry a trailing comma inside the identifier
        (for example ".../June-2026-data-release,"), producing identifiers that do not match the
        crate root entity identifier.
  - name: Institutional collaboration list differs between sources
    anomaly_details:
      - >-
        The CM4AI data releases page lists the collaboration as "UCSD, UCSF, Stanford, UVA, Yale,
        UT Austin, UA Birmingham, Simon Fraser University, and the Hastings Center", while the
        March 2025 Dataverse release description and the June 2026 RO-Crate root description give
        the same list without UT Austin. The CM4AI project description preprint lists University
        of Texas at Austin among the author affiliations, so the shorter list appears to be an
        omission.
  - name: Affiliation disagreement between release metadata and publication
    anomaly_details:
      - >-
        Sali A is recorded with affiliation University of California San Diego in all four
        Dataverse release author lists, while the associated Nature publication records
        University of California San Francisco (Department of Bioengineering and Therapeutic
        Sciences, Quantitative Biosciences Institute, and Department of Pharmaceutical Chemistry).

known_biases:
  - name: Cell-line derived representation bias
    bias_type: representation_bias
    bias_description: >-
      Data in this release was derived from commercially available de-identified human cell lines,
      and does not represent all biological variants which may be seen in the population at large.
      Findings and models trained on these data may therefore not generalize across human genetic
      and demographic diversity.
    mitigation_strategy: >-
      The bias is stated explicitly in the Potential Sources of Bias section of the Dataverse
      releases and in the RO-Crate rai:dataBiases field, which carry identical wording; users are
      directed to treat the two cell lines as specific biological contexts rather than population
      samples.
    affected_subsets:
      - MDA-MB-468 breast cancer cell line data
      - KOLF2.1J induced pluripotent stem cell data
  - name: Targeted protein and gene selection
    bias_type: selection_bias
    bias_description: >-
      The multimodal interrogation targets a curated panel of approximately 100 chromatin
      modifiers and 100 metabolic enzymes selected for involvement in cancer, neuropsychiatric and
      cardiac disorders, plus further proteins added on the basis of significant hits, rather than
      an unbiased proteome-wide sample. Coverage of the proteome is therefore uneven and enriched
      for chromatin biology and the selected disease contexts.
    mitigation_strategy: >-
      Interpret coverage relative to the published target panel rather than as proteome-wide; the
      panel composition is described in the CM4AI project description preprint.
    affected_subsets:
      - AP-MS and SEC-MS protein-protein interaction data
      - Immunofluorescence image data
      - CRISPRi targeted perturbation screens
  - name: Uneven cross-modality protein coverage
    bias_type: measurement_bias
    bias_description: >-
      Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi
      perturbSeq data interrogate sets of proteins which incompletely overlap, so analyses that
      require all three modalities are restricted to an intersection smaller than any single
      modality.
    mitigation_strategy: >-
      Check per-modality protein manifests before constructing multimodal analyses; the overlap
      caveat is declared in the Completeness statement of the releases and in the RO-Crate
      rai:dataCollectionMissingData field.
    affected_subsets:
      - Cross-modality integrated analyses

known_limitations:
  - name: Interim release
    limitation_type: scope_limitation
    limitation_description: >-
      This is an interim release. It does not contain predicted cell maps, which will be added in
      future releases.
    scope_impact: >-
      The releases described here provide map-input data streams, not the integrated hierarchical
      cell maps that are the project's headline deliverable.
    recommended_mitigation: >-
      Use the versioned release DOI when citing, and check for later quarterly releases.
  - name: Suited to per-dataset bioinformatics analysis
    limitation_type: methodological_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the individual datasets,
      and requires domain expertise for meaningful analysis.
    scope_impact: >-
      Naive cross-modality integration by non-specialists is likely to be misleading.
  - name: Incomplete cross-modality overlap
    limitation_type: integration_limitation
    limitation_description: >-
      Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi
      perturbSeq data interrogate sets of proteins which incompletely overlap.
  - name: Pre-publication embargo on some component datasets
    limitation_type: coverage_limitation
    limitation_description: >-
      Some datasets are under temporary pre-publication embargo. On the October 2025 and June 2026
      releases the external links for perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 cells
      are marked "Embargoed", and the raw sequence sub-crate records its access URL as
      "Embargoed".
    recommended_mitigation: >-
      Contact the data governance committee or await the release that lifts the embargo.
  - name: Restricted biological scope
    limitation_type: representativeness_limitation
    limitation_description: >-
      All data derive from two human cell lines under a small number of treatment and
      differentiation conditions, so the resource does not cover primary tissue, in vivo context
      or population-level variation.

confidential_elements:
  - name: Confidentiality status of the release
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The RO-Crate declares confidentialityLevel "Unrestricted" on the release root entity and
        on every per-modality sub-crate.
      - >-
        The Dataverse releases record Human Subjects: No and De-identified Samples: Yes, and all
        deposited files are marked Public with no access request required.
      - >-
        The only access condition is the attribution and citation requirement of the CC BY-NC-SA
        4.0 licence, not confidentiality.

content_warnings:
  - name: Declared content warnings
    content_warnings_present: false
    warnings:
      - >-
        No content warnings are declared in the Dataverse release metadata, on the CM4AI website
        or in the RO-Crate. The only cautionary statement attached to the data is the prohibition
        on use in clinical decision-making or patient care without appropriate regulatory
        oversight and approval.

subpopulations:
  - name: Donor and cell-line characteristics
    subpopulation_elements_present: true
    identification:
      - >-
        MDA-MB-468 (RRID:CVCL_0419, Cellosaurus CVCL_0419) is a triple negative breast cancer cell
        line established from a metastatic site pleural effusion of a 51-year-old black female
        with a metastatic mammary adenocarcinoma, available from ATCC.
      - >-
        KOLF2.1J (RRID:CVCL_B5P3, Cellosaurus CVCL_B5P3) is an induced pluripotent stem cell line
        derived from a healthy male Northern European donor, available from the Human Induced
        Pluripotent Stem Cells Initiative (HipSci) resource, accessible to not-for-profit
        organizations via a simple material transfer agreement.
    distribution:
      - >-
        Two source cell lines only. The experimental strata within them are treatment conditions
        (untreated or DMSO control, paclitaxel, vorinostat) for MDA-MB-468, and differentiation
        states (undifferentiated, neural progenitor cell, neuron, cardiomyocyte) for KOLF2.1J.
      - >-
        No human-subject demographic strata are represented, because the data are not collected
        from human subjects.

sensitive_elements:
  - name: Sensitivity assessment
    sensitive_elements_present: false
    sensitivity_details:
      - >-
        CM4AI data are distinctive within Bridge2AI in that they are non-clinical, being derived
        from tissue cultures, and are considered to be de-identified as they cannot be matched,
        with current knowledge, to a human subject.
      - >-
        The RO-Crate declares confidentialityLevel "Unrestricted" and records humanSubjectResearch
        as "None - data collected from commercially available cell lines".

is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    Use of commercially available, already de-identified immortalised and donor-derived human cell
    lines rather than primary human subject material. No de-identification procedure was applied
    by CM4AI because no identifiable human subject data were collected.
  identifiers_removed:
    - >-
      Not applicable; no direct or indirect human subject identifiers were present in the source
      material.
  deidentification_details:
    - >-
      Dataverse release metadata for the June 2025, October 2025 and June 2026 releases record
      "Human Subjects: No" and "De-identified Samples: Yes".
    - >-
      The RO-Crate records humanSubjectExemption as "Exempt - research with commercially available
      de-identified human cell lines does not constitute human subjects research."

acquisition_methods:
  - name: Direct laboratory measurement with computational derivation
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        Protein-protein interactions are directly measured by AP-MS on endogenously tagged cell
        lines and by SEC-MS for proteome-wide complex and interaction mapping, as two orthogonal
        mass spectrometry-based approaches.
      - >-
        Protein subcellular localization is directly observed by immunofluorescence staining and
        high-resolution confocal microscopy.
      - >-
        Transcriptional and fitness phenotypes are directly measured by single-cell CRISPRi
        perturbation screens.
      - >-
        Derived data include embeddings, integrated co-embeddings and hierarchical protein
        assemblies computed by the MuSIC pipeline; the RO-Crate records 1,976 computation or
        experiment steps and 6 software instances in the provenance graph.
      - >-
        Validation includes AP-MS quality control (four biological replicates, untagged parental
        controls, positive control tagged lines, DMSO vehicle controls), Human Protein Atlas
        antibody validation for IF imaging, and phenotypic, protein-interaction and metabolic
        tracing assays used to validate the perturbation cell atlas.

collection_mechanisms:
  - name: AP-MS on endogenously tagged cell lines
    mechanism_details:
      - >-
        Genes were endogenously tagged in MDA-MB-468 cells and AP-MS data acquired under untreated
        (DMSO), paclitaxel and vorinostat conditions; 17 genes were tagged initially with 34
        additional genes in progress at the time of the project description preprint.
      - >-
        Each AP-MS batch includes an untagged parental control, ten chromatin-modifier tagged cell
        lines and a positive control tagged line, in four biological replicates, with DMSO-treated
        samples as vehicle control.
  - name: Size-exclusion chromatography-mass spectrometry (SEC-MS)
    mechanism_details:
      - >-
        SEC-MS was performed for proteome-wide complex and interaction mapping on MDA-MB-468 cells
        under three conditions (untreated, paclitaxel, vorinostat) and on KOLF2.1J iPSCs and their
        neural progenitor cell, neuron and cardiomyocyte derivatives, in the Nevan Krogan
        laboratory at the University of California San Francisco.
  - name: Immunofluorescence confocal imaging
    mechanism_details:
      - >-
        Automated fixation and permeabilization protocols were established on a pipetting robot
        for the MDA-MB-468 and KOLF2 cell lines, and spatial proteomics mapping of chromatin
        regulators was completed in MDA-MB-468 cells with and without paclitaxel or vorinostat
        using Human Protein Atlas antibodies.
      - >-
        Imaging is immunofluorescence-based staining (ICC-IF) with confocal microscopy in the
        Lundberg Lab at Stanford University, producing four-channel images (DAPI nuclei, anti-
        calreticulin endoplasmic reticulum, anti-tubulin microtubules, target protein).
  - name: Single-cell CRISPRi perturbation screening
    mechanism_details:
      - >-
        A CRISPR lentiviral library targeting 100 chromatin factors with six guide RNAs per gene
        was designed, and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were
        generated and characterized.
      - >-
        Single-cell CRISPR screens of chromatin regulators with and without drug in MDA-MB-468
        cells and in undifferentiated KOLF2.1J iPSCs were performed using the 10x Genomics 3'HT
        kit; the genome-scale atlas targets 11,739 expressed genes.
  - name: AI-readiness packaging by FAIRSCAPE
    mechanism_details:
      - >-
        FAIRSCAPE-CLI is called when a computation or coherent set of computations in the MuSIC
        pipeline completes; it is passed JSON-Schema definitions for the datasets in the
        computational unit as well as the inputs, computations, software, models and outputs, and
        creates an RO-Crate package with unique stubs for identifier creation.
      - >-
        RO-Crates are sent to the FAIRSCAPE server, registered and assigned persistent, resolvable
        globally unique identifiers using the ARK scheme (namespace ark:59853), then decomposed
        into their components which are also registered and assigned identifiers.
      - >-
        The server computes end-to-end entailments on each RO-Crate's provenance expressed in the
        EVI Evidence Graph Ontology and links them together where possible; identifiers resolve to
        machine- and human-readable landing pages serialized in JSON-LD and RDF-XML.

collection_timeframes:
  - name: CM4AI data collection period
    start_date: '2022-09-01'
    end_date: '2026-06-01'
    timeframe_details:
      - >-
        The June 2026 RO-Crate root entity records rai:dataCollectionTimeframe as 9/1/2022 to
        6/1/2026.
      - >-
        Per-modality sub-crates record narrower end dates: 1/31/2026 for the AP-MS sub-crates, the
        treated cancer-cell SEC-MS sub-crate and the perturb-seq cell atlas, and 10/13/25 for the
        IF image sub-crates and the perturb-seq raw sequence sub-crate. The SEC-MS iPSC
        differentiation sub-crate records 6/1/2026.
      - >-
        NIH RePORTER records the CM4AI project period as 2022-09-01 to 2026-08-31, and the release
        maintenance plan states that data will be augmented through the end of the project in
        November 2026.
      - >-
        The Dataverse releases all record Data Creation Date 2025-02-27 and Deposit Date
        2025-02-27, which are deposit-workflow dates rather than laboratory acquisition dates.

data_collectors:
  - name: Lundberg Lab, Stanford University
    role: Spatial proteomics image acquisition
    collector_details:
      - >-
        Immunofluorescence images of MDA-MB-468 cells were acquired in the Lundberg Lab at
        Stanford University, as stated in every IF file description across the four releases.
      - >-
        The paclitaxel and vorinostat IF sub-crates record emmalu@stanford.edu as contact and
        Copyright (c) 2025 by The Board of Trustees of the Leland Stanford Junior University.
  - name: Nevan Krogan laboratory, University of California San Francisco
    role: SEC-MS data generation
    collector_details:
      - >-
        SEC-MS datasets on undifferentiated KOLF2.1J iPSCs and on treated MDA-MB-468 breast cancer
        cells were generated in the Nevan Krogan laboratory at the University of California San
        Francisco.
      - >-
        The treated cancer-cell SEC-MS sub-crate records nevan.krogan@ucsf.edu as contact.
  - name: Mali laboratory, University of California San Diego
    role: CRISPRi perturbation screening
    collector_details:
      - >-
        Both perturbation cell atlas sub-crates record pmali@ucsd.edu as contact; Prashant Mali
        (UCSD) is the senior author of the associated perturbation cell atlas preprint.
  - name: Richa Tiwari
    role: AP-MS sub-crate author
    collector_details:
      - >-
        The two EndoTag AP-MS sub-crates in the June 2026 RO-Crate record "Richa Tiwari" as their
        author. This name does not appear in the Dataverse author list or in any of the documents.
  - name: Ideker laboratory, University of California San Diego
    role: Project leadership and data integration
    collector_details:
      - >-
        Trey Ideker is the principal investigator recorded on every RO-Crate entity and the point
        of contact on all four Dataverse releases; the MuSIC integration pipeline and the Cell
        Mapping Toolkit are developed in his group.

missing_data_documentation:
  - name: Missing and withheld content
    missing_data_patterns:
      - Computed cell maps are not included in these releases.
      - >-
        External links for perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 breast cancer
        cells are marked "Embargoed" on the October 2025 and June 2026 releases, and the
        perturb-seq raw sequence sub-crate records its access URL as "Embargoed".
      - >-
        Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi
        perturbSeq data interrogate sets of proteins which incompletely overlap.
      - >-
        The CM4AI website lists IF images for the iPSC-derived flagship dataset and AP-MS
        interactomes for the triple-negative breast cancer flagship dataset as "coming soon"; the
        AP-MS interactomes first appear in the June 2026 release.
      - >-
        Nine of the 47 authors have no ORCID recorded in either the Dataverse metadata or the
        RO-Crate.
    missing_data_causes:
      - Temporary pre-publication embargo on datasets whose primary publications are pending.
      - Interim quarterly release schedule; content is added progressively.
      - Modality-specific target selection, which produces partial overlap between protein sets.
    handling_strategy: >-
      The releases declare their own incompleteness in a Completeness statement and in the
      RO-Crate rai:dataCollectionMissingData field, and commit to quarterly augmentation through
      the end of the project in November 2026.

