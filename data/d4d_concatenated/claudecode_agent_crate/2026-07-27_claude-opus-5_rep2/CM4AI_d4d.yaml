  - id: https://doi.org/10.18130/V3/F3TD5R
    name: CM4AI_June_2025_Data_Release
    title: Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta)
    description: >-
      This dataset is a revision of the June 2025 Data Release of Cell Maps for Artificial
      Intelligence (CM4AI; CM4AI.org), the Functional Genomics Grand Challenge in the NIH
      Bridge2AI program. This revision includes adding RGB immunofluorescent images, corrections
      to ro-crate metadata, and changes to naming conventions. This Beta release includes
      perturb-seq data in undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated
      KOLF2.1J iPSCs, iPSC-derived NPCs, neurons, cardiomyocytes, and treated and untreated
      MDA-MB468 breast cancer cells; and IF images in MDA-MB-468 breast cancer cells in the
