purposes:
  - name: AI-ready maps of human cell architecture
    description: >-
      Deliver machine-readable hierarchical maps of cell architecture as AI-ready data, together
      with quarterly data releases of map-input data streams.
    response: >-
      CM4AI was created to deliver machine-readable hierarchical maps of cell architecture as
      AI-ready data, produced from multimodal interrogation of 100 chromatin modifiers and 100
      metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders in
      disease-relevant cell lines under perturbed and unperturbed conditions.
  - name: Interpretable genotype-phenotype learning
    description: >-
      Map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning.
    response: >-
      In genomics and precision medicine, machine learning models are often "black boxes",
      predicting phenotypes from genotypes without revealing the mechanisms by which such
      translation occurs. CM4AI addresses this deficiency by creating a library of large-scale
      maps of cellular structure and function across demographic and disease contexts, to
      stimulate research and development in "visible" machine learning systems informed by
      multi-scale cell and tissue architecture.
  - name: Ethical, FAIR, AI-ready data production
    description: >-
      Produce ethical, AI-ready datasets of cell architecture, inferred from multimodal data
      collected for human cell lines, to enable transformative biomedical AI research.
    response: >-
      CM4AI defines AI-Ready biomedical data as fully characterized FAIR data of known provenance
      that can be ethically and reliably processed by AI applications, whose models and software
      are available and well-described for validation and re-use, and whose predictions may be
      fully explained and interpreted. The project implements a standards data management approach
      based on FAIR access and software principles, with deep provenance and replication packages,
      and a research programme in ethical AI.

tasks:
  - name: Protein-protein interaction mapping
    description: >-
      Determination of protein-protein interaction networks by affinity purification-mass
      spectrometry (AP-MS) on endogenously tagged cell lines and by size-exclusion chromatography
      coupled to mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping.
  - name: Spatial proteomics mapping
    description: >-
      Determination of protein subcellular localization and distribution by immunofluorescence
      (ICC-IF) staining and high-resolution confocal microscopy using Human Protein Atlas
      antibodies.
  - name: Genetic perturbation mapping
    description: >-
      Single-cell CRISPRi perturbation screens mapping transcriptional and fitness phenotypes
      associated with targeted genes.
  - name: Multimodal integration into hierarchical cell maps
    description: >-
      Fusion of localization and interaction data using self-supervised embedding approaches from
      deep learning, followed by algorithmic community detection at multiple resolutions to
      generate a hierarchy of protein assemblies, implemented as the Multi-Scale Integrated Cell
      (MuSIC) pipeline.
  - name: Visible machine learning
    description: >-
      Use of cell maps in AI tools for "visible machine learning" or "visible neural networks"
      (VNNs) that interrogate how protein assemblies in the cell affect cell-level phenotype
      predictions.

addressing_gaps:
  - name: Uninterpretable genotype-phenotype models
    description: >-
      Machine learning models show great promise in analyzing the human genome to make
      predictions, but the inner workings of these models are typically difficult-to-interpret
      "black boxes". CM4AI generates matched data and tools to enable "visible" ML systems built
      directly on knowledge maps of cell and tissue architecture.
  - name: Uncharted subcellular architecture
    description: >-
      Human cells consist of a complex hierarchy of components, many of which remain unexplored;
      systematic, multimodal mapping is required to resolve assemblies across physical scales.
  - name: Scarcity of ethical, provenanced AI-ready biomedical data
    description: >-
      Datasets used to train and to be analysed by AI/ML models must be FAIR, provenanced,
      characterized, explainable and ethically obtained. CM4AI packages its outputs with
      machine-readable provenance graphs, JSON-Schema data dictionaries and persistent identifiers
      to meet these criteria.
  - name: Workforce and tooling gaps
    description: >-
      New training is needed to allow researchers to leverage the datasets produced by Bridge2AI
      and other programs; CM4AI distributes data, reusable software and hands-on training to close
      this gap.

