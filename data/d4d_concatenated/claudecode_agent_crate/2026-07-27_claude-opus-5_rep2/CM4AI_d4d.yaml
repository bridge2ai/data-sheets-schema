raw_sources:
  - name: External hosting of raw acquisitions
    raw_data_details:
      - >-
        Raw mass spectrometry acquisitions and raw perturbation sequencing data are not deposited
        in the University of Virginia Dataverse archives. The Dataverse releases carry processed
        and packaged data plus RO-Crate metadata, and point to MassIVE, Figshare and NCBI for raw
        data.
      - >-
        The March 2025 release stated that SEC-MS data "will be uploaded to Pride when available";
        subsequent releases record MassIVE rather than PRIDE as the mass spectrometry repository.
      - >-
        The RO-Crate declares the logical content size of the June 2026 release as 19.9 TB
        (evi:totalContentSizeBytes 21,051,331,945,400), dominated by externally hosted raw data:
        16.7 TB of perturb-seq raw sequence data, 1.11 TB of SEC-MS iPSC data, 910 GB of SEC-MS
        cancer-cell data, 532.5 GB and 441.2 GB of AP-MS vorinostat and paclitaxel data, and
        177.35 GB of processed perturbation atlas data.

sampling_strategies:
  - name: Targeted panel sampling of the proteome and genome
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - Human proteome, sampled through a curated target panel.
      - >-
        Expressed genome of KOLF2.1J iPSCs, sampled by a genome-scale CRISPRi library targeting
        11,739 genes.
    strategies:
      - >-
        Multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in
        cancer, neuropsychiatric and cardiac disorders, with a further approximately 500 proteins
        added pending significant hits from the genetic perturbation and PPI results.
      - >-
        A CRISPR lentiviral library targeting 100 chromatin factors with six guide RNAs per gene
        for the targeted screens, and a genome-scale expressed CRISPRi library of 11,739 genes for
        the perturbation cell atlas.
      - >-
        Immunofluorescence imaging of 563 proteins per treatment arm in the March 2025 release and
        464 proteins per treatment arm in the June 2025 and October 2025 releases.
      - >-
        Two cell lines chosen for disease relevance and ethical sourcing: MDA-MB-468 with and
        without paclitaxel or vorinostat, and KOLF2.1J with and without neuronal and
        cardiomyocytic differentiation.
    why_not_representative:
      - >-
        The panel is deliberately enriched for chromatin modifiers and metabolic enzymes rather
        than sampling the proteome uniformly.
      - >-
        Two cell lines cannot represent the biological variants seen in the population at large.

preprocessing_strategies:
  - name: Modality-specific embedding
    preprocessing_details:
      - >-
        Downloaded protein-protein interaction networks are processed using the node2vec deep
        learning model to reduce dimensionality, producing a PPI embedding that contains
        information about the protein's interactions.
      - >-
        Immunofluorescence images are processed using a Human Protein Atlas deep learning model to
        reduce dimensionality, producing an image embedding that contains information about
        protein localization.
  - name: Multimodal co-embedding and community detection
    preprocessing_details:
      - >-
        The PPI and image embeddings are integrated to obtain a co-embedding for each protein
        using contrastive deep learning; the integration model learns co-embeddings such that the
        original embeddings can be reconstructed with minimal information loss and proteins with
        similar PPI and image embeddings have similar co-embeddings.
      - >-
        Community detection is performed on the all-by-all similarities of pairs of proteins in
        the co-embedding space, and the resulting hierarchy of protein communities is output as
        the final cell map.
    used_software:
      - id: https://github.com/idekerlab/cellmaps_pipeline
        name: Cell Mapping Toolkit (cellmaps_pipeline)
        url: https://github.com/idekerlab/cellmaps_pipeline
        license: BSD-3-Clause for alpha-level tools, with production-ready tools archived in Zenodo
        description: >-
          A series of pip-installable Python packages implementing the end-to-end MuSIC pipeline,
          including cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding,
          cellmaps_ppi_embedding, cellmaps_coembedding, cellmaps_generate_hierarchy and
          cellmaps_hierarchyeval, with documentation at https://cellmaps-pipeline.readthedocs.io/
  - name: AI-readiness packaging and provenance entailment
    preprocessing_details:
      - >-
        Every pipeline segment calls the FAIRSCAPE client package to validate inputs and create
        the output RO-Crate package for that segment, which is then dispatched to the FAIRSCAPE
        server for persistent identifier creation and provenance graph entailment computation.
      - >-
        Data elements are characterized and validated and mapped to public ontology vocabularies
        where appropriate, using JSON-Schema mini-data-dictionary descriptions resolvable from the
        provenance graph metadata. The June 2026 RO-Crate declares 20 schemas.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        version: 1.1.3
        url: https://fairscape.github.io
        license: MIT
        description: >-
          Client-side (FAIRSCAPE-CLI) and server-side Python framework for FAIR and reproducible
          biomedical analytics that packages datasets, software, metadata and provenance graphs as
          RO-Crates with ARK persistent identifiers and EVI evidence graphs. The June 2026 CM4AI
          RO-Crate records fairscapeVersion 1.1.3.

cleaning_strategies:
  - name: Release-level corrections and quality control
    cleaning_details:
      - >-
        The June 2025 release was revised (Dataverse version 2.1) to add RGB immunofluorescent
        images and to apply corrections to RO-Crate metadata and changes to naming conventions.
      - >-
        Single-cell CRISPR screen data were subjected to quality control before release, as stated
        in the CM4AI project description preprint.
      - >-
        Immunofluorescence imaging uses Human Protein Atlas antibodies and the associated antibody
        and image quality control conventions.
      - >-
        AP-MS batches include untagged parental controls, positive control tagged lines and
        DMSO-treated vehicle controls in four biological replicates, providing the basis for
        filtering non-specific interactions.

labeling_strategies:
  - name: Cell map assembly annotation
    description: >-
      Annotation applies to the computed cell maps, which are not included in the releases
      described here but are produced from these input data streams.
    data_annotation_platform:
      - Gene Ontology
      - Reactome
      - Large language model naming pipeline developed by CM4AI
    data_annotation_protocol:
      - >-
        Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to known
        protein function and pathway resources, including the Gene Ontology and Reactome, to
        determine protein assemblies in the cell map with high overlap with known cell biology.
      - >-
        Second, assemblies in the cell maps are annotated using a large language model approach
        developed by the project to name sets of proteins and assign a name confidence score.
    labeling_details:
      - >-
        The input data streams released here (AP-MS, SEC-MS, IF images, perturb-seq) are not
        themselves manually annotated; labels attached to them are experimental design metadata
        such as antibody target, treatment condition, cell line and CRISPRi guide identity.

machine_annotation_tools:
  - name: Automated embedding, integration and annotation tools
    tools:
      - node2vec
      - Human Protein Atlas deep learning image model
      - Contrastive multimodal co-embedding model
      - Multi-resolution community detection
      - Large language model assembly naming with confidence scoring
      - FAIRSCAPE metadata and provenance packaging
    tool_descriptions:
      - >-
        node2vec reduces the dimensionality of protein-protein interaction networks to produce a
        PPI embedding per protein.
      - >-
        A Human Protein Atlas deep learning model reduces immunofluorescence images to a
        localization embedding per protein.
      - >-
        A contrastive deep learning model integrates the PPI and image embeddings into a per-
        protein co-embedding.
      - >-
        Community detection on co-embedding similarities produces the hierarchy of protein
        assemblies that constitutes the cell map.
      - >-
        A large language model pipeline proposes descriptive names for protein assemblies together
        with a confidence score.
      - >-
        FAIRSCAPE-CLI and the FAIRSCAPE server generate RO-Crate packages, ARK persistent
        identifiers and EVI provenance entailments; the June 2026 crate records 6 software
        instances, 1,976 computation or experiment steps and 20 schemas.

existing_uses:
  - name: Associated publications recorded on the releases and in the RO-Crate
    examples:
      - >-
        Clark T, Parker J, Al Manir S, et al. Cell Maps for Artificial Intelligence: AI-Ready Maps
        of Human Cell Architecture from Disease-Relevant Cell Lines. bioRxiv 2024.05.21.589311,
        doi 10.1101/2024.05.21.589311. Listed as the Related Publication on all four Dataverse
        releases.
      - >-
        Nourreddine S, Doctor Y, Dailamy A, et al. A Perturbation Cell Atlas of Human Induced
        Pluripotent Stem Cells. bioRxiv 2024.11.03.621734, PMCID PMC11580897, doi
        10.1101/2024.11.03.621734.
      - >-
        Schaffer LV, Hu M, Qian G, et al. Multimodal cell maps as a foundation for structural and
        functional genomics. Nature 642:222-231 (2025), doi 10.1038/s41586-025-08878-3. Recorded
        as an associated publication on the June 2026 RO-Crate root entity but not listed among
        the Related Publications on the Dataverse release pages.
      - >-
        Qin Y, Huttlin EL, Winsnes CF, et al. A multi-scale map of cell structure fusing protein
        images and interactions. Nature 600:536-542 (2021), doi 10.1038/s41586-021-04115-9.
        Recorded as an associated publication only on the June 2026 RO-Crate root entity.
  - name: Training and community use
    examples:
      - >-
        Initial datasets, tools and standards were made available at the CM4AI CodeFest in March
        2024, accompanied by tutorials explaining how the data were derived and integrated and
        providing production-ready software for producing the datasets. The inaugural virtual
        CodeFest trained 38 registrants.
      - >-
        Data packages, cell maps and tools are disseminated through the CM4AI web portal built on
        the U-BRITE platform, and cell maps are shared via the Network Data Exchange (NDEx).

use_repository:
  - name: University of Virginia Dataverse download metrics
    repository_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    repository_details:
      - >-
        Dataverse reports dataset-level download metrics for each release as captured: 302
        downloads for the March 2025 release, 256 for the June 2025 release, 405 for the October
        2025 release and 181 for the June 2026 release.
      - >-
        Dataverse also reports per-file download counts, and states that no citations were found
        for the March 2025 release via Crossref and DataCite using Make Data Count standards.

other_tasks:
  - name: Downstream applications beyond the original mapping goal
    task_details:
      - >-
        Interpretation of genetic variants and mutations in human genomics, using cell maps as a
        structural prior.
      - >-
        Construction of new cell maps across cell subtypes and disease states by reusing the
        released input data streams and the Cell Mapping Toolkit.
      - >-
        Benchmarking of multimodal data integration methods, since the release provides matched
        interaction, imaging and perturbation data for overlapping protein sets.
      - >-
        Research on FAIR and AI-readiness metadata practice, since each release ships a complete
        RO-Crate with provenance graphs, JSON-Schema data dictionaries and an AI-readiness
        self-assessment.

future_use_impacts:
  - name: Consequences of the interim release model
    impact_details:
      - >-
        Because the release is interim and augmented quarterly through November 2026, analyses
        built on one release may need revision when computed cell maps and currently embargoed
        datasets are added; users should cite the specific versioned DOI.
      - >-
        Content in successive releases is not simply additive: file naming conventions changed
        between the March 2025 and June 2025 releases, the number of imaged proteins per treatment
        arm changed from 563 to 464, and checksums of the immunofluorescence archives differ
        between releases.
  - name: Ethical anticipation of downstream AI use
    impact_details:
      - >-
        The CM4AI ethics programme anticipates potential applications of the data and derived
        AI/ML systems and integrates them into data governance frameworks to optimize benefits and
        mitigate potential risks, promoting their use for the collective good.
      - >-
        The Ethics team employs a methodology inspired by Value-Sensitive Design and is developing
        the CM4AI Life Cycle, a framework elucidating governance milestones throughout the data
        generation and AI system development processes.
      - >-
        A Data Access Committee supervises ethical matters related to dataset distribution and
        potential dual licensing for commercial use.

discouraged_uses:
  - name: Treating the release as a complete cell map resource
    discouragement_details:
      - >-
        The releases contain map-input data streams only; computed cell maps are not included, so
        the data should not be used as if they were the finished hierarchical cell maps.
  - name: Assuming complete cross-modality protein coverage
    discouragement_details:
      - >-
        SEC-MS, IF imaging and CRISPRi perturb-seq interrogate incompletely overlapping protein
        sets, so joint analyses that assume full overlap will silently drop or mis-handle proteins.
  - name: Generalizing to population-level biology
    discouragement_details:
      - >-
        The data derive from two commercially available de-identified human cell lines and do not
        represent all biological variants which may be seen in the population at large.
  - name: Non-expert analysis
    discouragement_details:
      - >-
        The release requires domain expertise for meaningful analysis and is most suitable for
        bioinformatics analysis of the individual datasets.

intended_uses:
  - name: Declared intended uses
    description: >-
      The Intended Use statement carried on the June 2025, October 2025 and June 2026 Dataverse
      releases, matched by the rai:dataUseCases field of the RO-Crate.
    examples:
      - AI-ready datasets to support research in functional genomics
      - AI model training
      - Cellular process analysis
      - >-
        Cell architectural changes and interactions in presence of specific disease processes,
        treatment conditions, or genetic perturbations
      - >-
        Biologically-driven, interpretable machine learning applications, for example as proposed
        in Ma et al. 2018 (PMID 29505029) and Kuenzi et al. 2020 (PMID 33096023). This
        elaboration, with its two specific PMIDs, appears only in the RO-Crate rai:dataUseCases
        field; the IF sub-crates give the shorter wording "enable visible machine learning
        applications".
    use_category:
      - non-clinical research use
      - AI and machine learning model training
      - non-commercial use
    usage_notes: >-
      Attribution is required to the copyright holders and the authors. Any publications
      referencing this data or derived data products should cite the Related Publications as well
      as directly citing this data collection. Commercial use requires a separate license
      negotiation with the copyright holder (UCSD, Stanford and/or UCSF depending upon the
      specific data package in question).

prohibited_uses:
  - name: Clinical decision-making and patient care
    prohibition_reason:
      - >-
        These laboratory data are not to be used in clinical decision-making or in any context
        involving patient care without appropriate regulatory oversight and approval. This
        statement appears as the Prohibited Uses section of the Dataverse releases and as both
        usageInfo and prohibitedUses on every entity of the RO-Crate.
  - name: Commercial use without separate licence
    prohibition_reason:
      - >-
        The CC BY-NC-SA 4.0 licence prohibits use of the material for commercial purposes, defined
        as use primarily intended for commercial advantage or monetary compensation. Commercial
        use requires a separate license negotiation with the copyright holder.
  - name: Redistribution under different terms or with added restrictions
    prohibition_reason:
      - >-
        Under ShareAlike, derivatives must be distributed under the same licence as the original;
        under the no-additional-restrictions term, licensees may not apply legal terms or
        technological measures that legally restrict others from doing anything the licence
        permits.

distribution_formats:
  - name: University of Virginia Dataverse deposits
    description: >-
      Each release is distributed as a set of ZIP archives plus JSON and HTML metadata artifacts.
      Dataverse states that the dataset is too large to download in one operation and that
      individual files below the 953.7 MB ZIP limit must be selected, or the Data Access API used
      for programmatic access.
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
  - name: RO-Crate AI-readiness packages
    description: >-
      Every release ships RO-Crate metadata in JSON-LD conforming to RO-Crate 1.2, together with
      HTML datasheet and provenance-graph renderings and an AI-readiness self-assessment. The June
      2026 crate is delivered inside cm4ai_release_metadata.zip. Dataverse also offers metadata
      export in OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD, DDI Codebook v2, Dublin Core, DDI
      HTML Codebook and JSON, with Croissant export added from the October 2025 release onward.
    access_urls:
      - https://dataverse.lib.virginia.edu/api/datasets/:persistentId/?persistentId=doi:10.18130/V3/HIGT4C
  - name: Underlying data file formats
    description: >-
      The June 2026 RO-Crate enumerates the formats present across the release graph in its
      evi:formats field as ".d", ".d directory group", ".tsv", ".xml", "TSV", "csv", "executable",
      "fastq.gz", "h5", "h5ad", "image/jpeg", "pdf" and "unknown". The list mixes file extensions,
      media types and an "unknown" placeholder, and is not available from the Dataverse release
      pages or the CM4AI website.
  - name: External repository distribution
    description: >-
      Raw mass spectrometry acquisitions are distributed by MassIVE, the processed perturbation
      cell atlas by FigShare, and raw perturbation sequences via NCBI (embargoed at capture).
    access_urls:
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676
      - https://massive.ucsd.edu/ProteoSAFe/dataset.jsp?task=ad8b8084f5b14af5bafac70fdd42a577
      - https://figshare.com/s/ee85bb1880921326249b

