name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI) - Bridge2AI Functional Genomics Data Releases
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Common Fund Bridge to Artificial
  Intelligence (Bridge2AI) program. CM4AI delivers machine-readable hierarchical maps of human
  cell architecture as AI-ready data, together with quarterly releases of the map-input data
  streams. Input data are produced by multimodal interrogation of chromatin modifiers, metabolic
  enzymes and other proteins implicated in cancer, neuropsychiatric and cardiac disorders, in
  disease-relevant human cell lines under treated and untreated conditions: affinity
  purification-mass spectrometry (AP-MS) and size-exclusion chromatography-mass spectrometry
  (SEC-MS) for protein-protein interactions, immunofluorescence (IF) confocal microscopy for
  spatial proteomics, and single-cell CRISPRi perturbation sequencing (perturb-seq) for genetic
  perturbation. The cell lines under investigation are the triple-negative breast cancer line
  MDA-MB-468 (untreated versus paclitaxel- or vorinostat-treated) and the induced pluripotent
  stem cell line KOLF2.1J (undifferentiated versus neural progenitor cell, neuron and
  cardiomyocyte derivatives). Data streams are integrated by the Multi-Scale Integrated Cell
  (MuSIC) pipeline using self-supervised deep-learning embedding and multi-resolution community
  detection, and outputs are packaged with provenance graphs and rich metadata as AI-ready
  RO-Crate datasets using the FAIRSCAPE framework. Releases are deposited in LibraData, the
  University of Virginia Dataverse. This datasheet covers the four Dataverse releases captured in
  the current source corpus - March 2025 (10.18130/V3/B35XWX), June 2025 (10.18130/V3/F3TD5R),
  October 2025 (10.18130/V3/K7TGEM) and June 2026 (10.18130/V3/HIGT4C, the current release) -
  together with the RO-Crate package shipped inside the June 2026 release. CM4AI is a
  collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser
  University and the Hastings Center.
