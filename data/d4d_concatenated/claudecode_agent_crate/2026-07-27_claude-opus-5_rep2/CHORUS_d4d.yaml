known_biases:
- name: Referral bias from academic referral centers
  bias_type: selection_bias
  bias_description: Referral bias from tertiary/quaternary academic centers.
  mitigation_strategy: Bias assessment is ongoing and documented in dataset release
    notes.
- name: Socioeconomic and demographic representation bias
  bias_type: representation_bias
  bias_description: Socioeconomic and demographic distribution reflective of
    participating institutions.
  mitigation_strategy: Bias assessment is ongoing and documented in dataset release
    notes. Federated access will enable sampling methods to ensure a balanced and
    diverse cohort, and patient-focused efforts determine ethical and legal approaches
    to manage privacy and bias while accounting for Social Determinants of Health.
- name: Documentation bias in clinical notes
  bias_type: measurement_bias
  bias_description: Documentation bias in clinical notes.
  mitigation_strategy: Bias assessment is ongoing and documented in dataset release
    notes.
- name: Missingness not at random in laboratory, waveform, and imaging acquisition
  bias_type: selection_bias
  bias_description: Missingness not at random (MNAR) in laboratory, waveform, and
    imaging acquisition.
  mitigation_strategy: Bias assessment is ongoing and documented in dataset release
    notes.
  affected_subsets:
  - laboratory data
  - waveform data
  - imaging data
- name: Differential care pathways affecting label assignment
  bias_type: annotation_bias
  bias_description: Differential care pathways affecting label assignment (e.g., ICU
    vs non-ICU populations).
  mitigation_strategy: Bias assessment is ongoing and documented in dataset release
    notes.
  affected_subsets:
  - ICU populations
  - non-ICU populations
- name: Temporal trends related to evolving clinical practice
  bias_type: historical_bias
  bias_description: Temporal trends related to evolving clinical practice.
  mitigation_strategy: Bias assessment is ongoing and documented in dataset release
    notes.

known_limitations:
- name: Observational, non-randomized real-world data
  limitation_type: methodological_limitation
  limitation_description: Observational data, and not randomized; collected as
    real-world clinical data, not through prospective research interactions with
    patients.
  scope_impact: Data are not collected solely for research but repurposed from
    clinical workflows under ethical oversight, which constrains causal inference.
- name: Documentation quality dependent on clinical workflows
  limitation_type: methodological_limitation
  limitation_description: Documentation quality dependent on routine clinical
    workflows and data elements being collected in clinical practice.
- name: Variable waveform sampling rates
  limitation_type: resolution_limitation
  limitation_description: Variable sampling rates across real-world data from hospital
    waveform systems and middleware.
- name: Institutional heterogeneity in coding practices
  limitation_type: integration_limitation
  limitation_description: Institutional heterogeneity in coding and clinical data
    collection practices.
  recommended_mitigation: Standardized harmonization to a common data model, validated
    semantic mappings to international standards, and standard operating protocols
    for data contributing sites.
- name: Limited generalizability beyond participating hospitals
  limitation_type: representativeness_limitation
  limitation_description: Limited generalizability beyond participating hospitals.
  scope_impact: Population inference beyond participating institutions is not
    recommended.
- name: Not appropriate for re-identification, contact tracing, or patient-level
    intervention
  limitation_type: scope_limitation
  limitation_description: The dataset is not appropriate for re-identification,
    contact tracing, or patient-level intervention.
- name: Overfitting risk in development splits
  limitation_type: methodological_limitation
  limitation_description: Hold-out splits are available for testing; training and
    validation in development splits require internal mechanisms to avoid overfitting.
  recommended_mitigation: Use the provisioned hold-out splits for testing and apply
    internal mechanisms to avoid overfitting when training and validating on
    development splits.
- name: Interim release with partial data
  limitation_type: coverage_limitation
  limitation_description: Interim release with partial data. Not all patients in the
    CHoRUS full cohort are included. No DICOM images are included.
  scope_impact: This limitation is scoped to the version 1.0 Beta release published
    2026-04-03.

confidential_elements:
- name: Confidential elements requiring controlled access
  confidential_elements_present: true
  confidentiality_details:
  - Confidentiality level HL7:2V (very restricted)
  - Clinical notes are stored locally at contributing sites except for tokens; raw
    note and report text is retained locally rather than distributed
  - Access is restricted to a secure enclave environment; no raw data export is
    permitted unless explicitly approved
  - Data export restrictions and output review procedures are applied to reduce risk
    of re-identification

subpopulations:
- name: Critical care subpopulations
  subpopulation_elements_present: true
  identification:
  - Patient admissions from intensive care units (ICU)
  - Patient admissions from pediatric intensive care units (PICU)
  - Patient admissions from neonatal intensive care units (NICU)
  - Admissions with associated radiology data
  distribution:
  - Socioeconomic and demographic distribution reflective of participating
    institutions
  - Referral bias from tertiary/quaternary academic centers
  - The project samples to ensure comprehensive sets of patient conditions and
    clinical treatment strategies
  - Federated access will enable sampling methods to ensure a balanced and diverse
    cohort

sensitive_elements:
- name: Protected health information in multimodal clinical data
  sensitive_elements_present: true
  sensitivity_details:
  - Data are derived from routine clinical care and contain protected health
    information across electronic health record, imaging, waveform, and clinical note
    modalities
  - 'CHoRUS operates within a secure enclave environment aligned with NIST 800-53
    controls.'
  - De-identification consistent with HIPAA Safe Harbor
  - Removal or tokenization of direct identifiers
  - Date shifting or limited date fields when required
  - Role-based access control (RBAC)
  - Multi-factor authentication
  - Full audit logging of data access and queries
  - Prohibition of re-identification attempts
  - Data export restrictions and output review procedures to reduce risk of
    re-identification
  - Re-identification risk is periodically assessed and mitigation strategies updated
    as needed.

relationships:
- name: Linkage of multimodal data to patient admissions
  relationship_details:
  - Multimodal data are harmonized to the OMOP Common Data Model, which links
    demographics, medication administration, procedures, nursing flowsheets, and
    diagnoses to a common patient and visit representation
  - 7,642 admissions in the current released dataset have associated radiology data
  - Tokenized clinical note text is linked to admissions while raw note text remains
    stored locally at the contributing site
  - The RO-Crate package is composed of an EHR sub-crate and a waveforms sub-crate
    that are both part of the same CHoRUS RO-Crate Package

splits:
- name: Holdout test split for external validation
  split_details:
  - The dataset provisions a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care
  - Hold-out splits are available for testing; training and validation in development
    splits require internal mechanisms to avoid overfitting

acquisition_methods:
- name: Retrospective acquisition from routine clinical care
  was_directly_observed: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Retrospective data collection from routine clinical care at participating
    hospitals under IRB oversight
  - Electronic health record extraction and transformation to the OMOP common data
    model
  - High-resolution physiologic waveform capture, extraction and transformation to
    the WFDB standard
  - Imaging acquired from PACS in DICOM format
  - EEG waveforms acquired from hospital databases in EDF+ and Persyst formats
  - Clinical notes extracted and tokenized using the OHNLP toolkit
  - Validated semantic mappings connect clinical data in various source formats to
    international standards, with an associated clinical validation SOP
  - Data are not collected solely for research but repurposed from clinical workflows
    under ethical oversight

collection_mechanisms:
- name: Electronic health record extraction
  mechanism_details:
  - Electronic health record extraction and transformation to the OMOP common data
    model
  - Demographics, medication administration (dosing time-stamped upon each infusion
    change or dose administration), procedures documented by providers, nursing
    flowsheets (high-frequency documentation), and diagnoses documented by providers
    are captured in the OMOP data standard under controlled access
  - Data extracts are created and uploaded by contributing sites using the
    chorus-extract-upload tooling
- name: Clinical note extraction and tokenization
  mechanism_details:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit
  - Raw clinical note text is stored locally at contributing sites; only tokens are
    made available
  - The published metadata schema is the OHNLP open-source schema
- name: Imaging acquisition from PACS
  mechanism_details:
  - Imaging is acquired from PACS in the DICOM standard under controlled access
  - Imaging metadata de-identification uses the RSNA Clinical Trial Processor and
    pixel-level de-identification uses IbisWorks EICON
- name: Waveform telemetry capture
  mechanism_details:
  - Waveform telemetry is captured from bedside monitors and gateway/middleware
  - Telemetry is transformed to the WFDB standard under controlled access
  - The published metadata schema is an extended PhysioNet schema
- name: EEG waveform acquisition
  mechanism_details:
  - EEG waveforms are acquired from the hospital database in EDF+ and Persyst formats
    under controlled access
  - As of August 2025, EEG extraction was in process
- name: Standard operating protocols and site tooling
  mechanism_details:
  - Standard operating protocols (SOPs) instruct data contributing sites about best
    practices for curating and delivering interoperable datasets, with an interactive
    workflow diagram on the Chorus_SOP page
  - Software and tooling in the CHoRUS GitHub organization support interacting with
    and extracting insight from clinical data in diverse formats

sampling_strategies:
- name: Retrospective multi-center sampling of critically ill patients
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Electronic health records at participating hospitals
  - PACS imaging archives
  - Bedside monitor telemetry and gateway/middleware
  - Hospital EEG databases
  - Clinical notes
  strategies:
  - Retrospective data collection across 14 data acquisition hospitals
  - Sampling to ensure comprehensive sets of patient conditions and clinical treatment
    strategies
  - Federated access will enable sampling methods to ensure a balanced and diverse
    cohort
  - The version 1.0 Beta release is an interim release with partial data; not all
    patients in the CHoRUS full cohort are included
  why_not_representative:
  - Referral bias from tertiary/quaternary academic centers
  - Socioeconomic and demographic distribution reflective of participating
    institutions
  - Limited generalizability beyond participating hospitals

data_collectors:
- name: CHoRUS Data Acquisition centers
  role: data contributing site
  collector_details:
  - The collaboration spans 20 academic centers, of which 14 will contribute as Data
    Acquisition centers
  - Data site managers at contributing sites follow the Chorus_SOP workflow for
    extracting and contributing clinical data to CHoRUS
  - Sites provide regular status updates on progress in creating and curating a
    CHoRUS-specific clinical data extract
- name: CHoRUS Data Pillar
  role: data standardization, tooling, and acquisition team
  collector_details:
  - The Data pillar covers Standards, Tool Development and Optimization, and Data
    Acquisition
  - Sub-teams within the CHoRUS data generation project are Standards, Data
    Acquisition, and Tooling
  - Primary maintainers of the released data are the CHoRUS Data Pillar in
    collaboration with institutional data stewards
- name: CHoRUS clinical collaborators
  role: semantic mapping and clinical validation
  collector_details:
  - Clinical expertise contributes to semantic mapping and validation within CHoRUS
  - The chorus-mapping repository holds documentation and pooled tabular mappings
    along with an associated clinical validation SOP

collection_timeframes:
- name: CHoRUS award period and retrospective collection scope
  timeframe_details:
  - Data collection is retrospective from routine clinical care rather than
    prospective research interaction with patients
  - The funded project period runs from 2022-09-01 to 2026-11-30
  - As of August 2025 the dataset covered 14 different hospitals with over 45,000
    unique admissions
  - The version 1.0 Beta RO-Crate package was published 2026-04-03
  - The sources do not state the calendar range of the clinical encounters included
    in the dataset

direct_collection:
- name: Repurposed clinical data rather than direct research collection
  is_direct: false
  collection_details:
  - Data are derived from routine clinical care at participating hospitals under IRB
    oversight
  - Data are not collected solely for research but repurposed from clinical workflows
    under ethical oversight
  - Collection is retrospective; data were not obtained through prospective research
    interactions with patients

missing_data_documentation:
- name: Missing data patterns and handling in the CHoRUS dataset
  missing_data_patterns:
  - Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition
  - Variable sampling rates across real-world data from hospital waveform systems and
    middleware
  - Interim release with partial data; not all patients in the CHoRUS full cohort are
    included
  - No DICOM images are included in the version 1.0 Beta release
  - As of August 2025, EEG extraction was in process and imaging de-identification
    was in process for a larger cohort
  - Raw clinical note text is stored locally at contributing sites; only tokens are
    available
  missing_data_causes:
  - Data are repurposed from routine clinical workflows rather than collected
    prospectively for research
  - Documentation quality dependent on routine clinical workflows and data elements
    being collected in clinical practice
  - Institutional heterogeneity in coding and clinical data collection practices
  - De-identification of imaging was still in process for the larger cohort
  handling_strategy: >-
    Bias and data-quality assessment is ongoing and documented in dataset release
    notes. Release notes document schema changes, harmonization updates, and known
    issues. Characterization reports are produced and returned to sites following
    their data submissions.

raw_data_sources:
- name: Routine clinical care systems at CHoRUS data acquisition hospitals
  source_description: >-
    Data are derived from routine clinical care at participating hospitals under IRB
    oversight, covering structured electronic health record data, tokenized
    unstructured electronic health record data, telemetry and EEG waveforms, imaging,
    and social determinants of health.
  source_type:
  - Electronic health record system
  - PACS imaging archive
  - Bedside monitor telemetry and gateway/middleware
  - Hospital EEG database
  - Clinical notes and reports
  access_details: >-
    Raw source data remain within the contributing institutions. Raw clinical note
    and report text is retained locally and is not distributed; only tokenized text
    is available. Access to derived data is restricted to a secure enclave
    environment, and no raw data export is permitted unless explicitly approved.
  raw_data_format:
  - OMOP Common Data Model
  - DICOM
  - WFDB
  - EDF+
  - Persyst
  - OHNLP

ethical_reviews:
- name: Mass General Brigham IRB review of the CHoRUS dataset
  description: >-
    Ethical review was conducted in collaboration with the Mass General Brigham
    Institutional Review Board under protocol #2022P000707, with local context review
    at contributing medical centers.
  reviewing_organization: urn:d4d:chorus:org:mass-general-brigham-irb
  contact_person: urn:d4d:chorus:person:eric-s-rosenthal
  review_details:
  - IRB protocol #2022P000707
  - 'Ethical review: Eric S. Rosenthal, Michael J. Young, Ishan Williams, Ashley
    Cordes, and Barbara J. Evans in collaboration with the Mass General Brigham IRB
    with local context review by IRBs, HIPAA Privacy Officers, and institutional
    counsels at contributing medical centers.'
  - 'Human subject exemption: HIPAA exemption 4 (45 CFR 46.104(d)(4))'
  - IRB approval or waiver as appropriate at contributing sites
  - Community-facing ethics focus groups were performed to determine what data is
    appropriate for public sharing
  - The CHoRUS consortium evaluates community perspectives on clinical care AI to
    find ways to increase trustworthiness of provenance and privacy in AI

data_protection_impacts:
- name: Layered privacy protection and re-identification risk management
  impact_details:
  - Re-identification risk is periodically assessed and mitigation strategies updated
    as needed
  - Data export restrictions and output review procedures reduce risk of
    re-identification
  - CHoRUS operates within a secure enclave environment aligned with NIST 800-53
    controls
  - Layered privacy protection includes de-identification, a data use agreement, and
    a controlled access data repository with adherence to NIST 800-53 principles,
    audit-level protection, registration, role-based access controls, and protection
    against data exfiltration
  - Data are transformed using approaches that limit re-identification
  - A privacy scanning tool for medical records (privacy_scan_tool) is maintained in
    the CHoRUS GitHub organization

human_subject_research:
  name: CHoRUS human subject research status
  involves_human_subjects: true
  description: >-
    The dataset comprises clinical data from human patients treated at participating
    hospitals. Human subject research status is recorded as "Yes" in the RO-Crate
    package, the dataset is recorded as de-identified, and the package records the
    dataset as FDA regulated.
  irb_approval:
  - Mass General Brigham IRB protocol #2022P000707
  - IRB approval or waiver as appropriate at contributing sites
  ethics_review_board:
  - Mass General Brigham Institutional Review Board (MGB IRB)
  - Local context review by IRBs, HIPAA Privacy Officers, and institutional counsels
    at contributing medical centers
  special_populations:
  - Critically ill patients admitted to intensive care units
  - Pediatric intensive care unit (PICU) patients
  - Neonatal intensive care unit (NICU) patients
  regulatory_compliance:
  - HIPAA
  - HIPAA exemption 4 (45 CFR 46.104(d)(4))
  - NIH data-sharing policies
  - NIST 800-53 aligned secure enclave controls
  - FDA regulated
  - NIH Bridge2AI OT terms and applicable federal regulations

informed_consent:
- name: IRB approval or waiver basis for use of clinical data
  description: >-
    The sources document an IRB approval-or-waiver basis and a HIPAA exemption rather
    than individual prospective informed consent for research participation.
  consent_type:
  - IRB approval or waiver as appropriate
  - HIPAA exemption 4 (45 CFR 46.104(d)(4))
  consent_documentation:
  - Mass General Brigham IRB protocol #2022P000707
  - Local context review by IRBs, HIPAA Privacy Officers, and institutional counsels
    at contributing medical centers
  consent_scope:
  - Data are not collected solely for research but repurposed from clinical workflows
    under ethical oversight
  - Community-facing ethics focus groups were performed to determine what data is
    appropriate for public sharing

at_risk_populations:
  name: Protections for critically ill and pediatric populations
  at_risk_groups_included: true
  description: >-
    The current released dataset includes patient admissions from ICU, PICU, and NICU,
    so critically ill adults, children, and neonates are represented.
  special_protections:
  - De-identification consistent with HIPAA Safe Harbor
  - Removal or tokenization of direct identifiers
  - Date shifting or limited date fields when required
  - Role-based access control (RBAC) and multi-factor authentication within a secure
    enclave aligned with NIST 800-53 controls
  - Full audit logging of data access and queries
  - Prohibition of re-identification attempts
  - Confidentiality level HL7:2V (very restricted)

preprocessing_strategies:
- name: Harmonization to common data models
  preprocessing_details:
  - Electronic health record extraction and transformation to the OMOP common data
    model
  - High-resolution physiologic waveform capture, extraction and transformation to the
    WFDB standard
  - Standardized harmonization to a common data model
  - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data
- name: Text tokenization and de-identification
  preprocessing_details:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit, with raw text
    retained locally
  - Data are transformed using approaches that limit re-identification
  - Removal or tokenization of direct identifiers, with date shifting or limited date
    fields when required
- name: Imaging de-identification
  preprocessing_details:
  - Imaging metadata de-identification using RSNA Clinical Trial Processor
  - Pixel-level de-identification using IbisWorks EICON
  - As of August 2025, de-identification was in process for a larger imaging cohort
- name: Geospatial and contextual enrichment
  preprocessing_details:
  - Data elements feature appropriate contextual factors such as geographic distance
    to the nearest hospital
  - OMOP Location entities are geocoded via DeGauss using the UF-Geocoding open source
    code

cleaning_strategies:
- name: Standards-based curation and site feedback
  cleaning_details:
  - Validated semantic mappings connect clinical data in various source formats to
    international standards
  - A clinical validation SOP governs contributions to mapping efforts, with pooled
    tabular mappings maintained in the chorus-mapping repository
  - Standard operating protocols instruct data contributing sites about best practices
    for curating and delivering interoperable datasets, and have undergone an internal
    validation and review process within the Chorus_SOP repository
  - Characterization reports are produced and returned to sites following their data
    submissions (CHoRUSReports)
  - A privacy scan tool for medical records is applied to clinical records

labeling_strategies:
- name: Prediction target labeling in a visualization and annotation environment
  data_annotation_platform:
  - A visualization and annotation environment developed within CHoRUS
  data_annotation_protocol:
  - Data are labeled with targets important for prediction
  labeling_details:
  - A visualization and annotation environment will label data with targets important
    for prediction
  - The project acquires, standardizes, transforms, and labels data as part of the
    Data pillar
  - Differential care pathways affect label assignment (e.g., ICU vs non-ICU
    populations)

raw_sources:
- name: Locally retained raw clinical data
  raw_data_details:
  - Raw clinical data remain within the contributing hospitals' source systems
  - Raw clinical note and report text is stored locally at contributing sites; only
    tokenized text is available
  - No raw data export from the secure enclave is permitted unless explicitly approved

machine_annotation_tools:
- name: Automated processing and de-identification tooling
  tools:
  - OHNLP toolkit
  - RSNA Clinical Trial Processor
  - IbisWorks EICON
  - DeGauss (via UF-Geocoding)
  - privacy_scan_tool
  tool_descriptions:
  - OHNLP toolkit - used to extract and tokenize clinical notes; the published
    metadata schema is the OHNLP open source schema
  - RSNA Clinical Trial Processor - used for imaging metadata de-identification
  - IbisWorks EICON - used for pixel-level de-identification of imaging
  - DeGauss - open source code to geocode OMOP Location entities, packaged in the
    UF-Geocoding repository
  - privacy_scan_tool - a privacy scan tool for medical records maintained in the
    CHoRUS GitHub organization

existing_uses:
- name: Training activities and publications
  examples:
  - Datasets are being used for training activities and publications
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
    Bridge2AI CHoRUS data through engagement, AI training, and mentorship, equipping
    trainees to apply AI/ML methods to big data analysis using multi-modal datasets
    from a broad range of cohort participants
  - Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care
    Network and leverage the data and tools to create practical use cases
  - Trainees prepare works-in-progress poster presentations for the AIM-AHEAD and
    Bridge2AI Annual Meetings, submit abstracts for health informatics conferences,
    and develop manuscripts for peer-reviewed journals
  - The RO-Crate package documents 1,468 datasets, 2 computation or experiment steps,
    and 1 software instance in its provenance graph

use_repository:
- name: CHoRUS GitHub organization
  repository_url: https://github.com/chorus-ai
  repository_details:
  - The CHoRUS GitHub organization houses 28 active repositories providing software
    and tooling to interact with and extract insight from clinical data in diverse
    formats, validated semantic mappings, standard operating protocols, and project
    management overviews
  - Repositories include chorus-container-apps (dockerized container applications
    deployed to support CHoRUS services on Azure), chorus_waveform (waveform
    documentation and conversion scripts), chorus-extract-upload (tools to create and
    upload a CHoRUS Data Extract), privacy_scan_tool, Chorus_SOP, data_acq_SOP,
    CHoRUSReports, UF-Geocoding, CTP-deid, cloud_public, chorus_waveform_resources,
    chorus-apps-internal, and CADA
  - Versions, maintainers, and other metadata about CHoRUS packages are available on
    the package status page, with documentation compiled in the chorus-developer
    repository
  - Task tracking across teams and status tracking of data contributing sites are
    managed through GitHub projects, with site updates submitted via the GitHub
    interface or a Google Form

future_use_impacts:
- name: Anticipated impacts of downstream use
  impact_details:
  - The dataset provisions a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care
  - Limited generalizability beyond participating hospitals may affect models trained
    on this dataset when deployed elsewhere
  - Temporal trends related to evolving clinical practice may reduce the future
    validity of models trained on current releases
  - Bias assessment is ongoing and documented in dataset release notes, so downstream
    users should re-check bias characterization for each release
  - The project cultivates expertise in the lay and scientific community to improve AI
    literacy and utilization through multimodal educational approaches

discouraged_uses:
- name: Uses not recommended by the dataset providers
  discouragement_details:
  - Direct translation of trained algorithms to real-time clinical deployment without
    validation or regulatory clearance
  - Use as sole evidence for clinical decision-making
  - Population inference beyond participating institutions

intended_uses:
- name: Intended use cases for the CHoRUS dataset
  examples:
  - AI model training within enclave
  - Model validation and benchmarking
  - Algorithm development and feature engineering
  - Retrospective hypothesis testing
  - Fine-tuning of multimodal models
  - Comparative effectiveness research
  - Reinforcement learning and development of expert AI
  - Methodological research in trustworthy AI
  - Trial emulation or powering
  usage_notes: >-
    Usage must align with approved research scope and governance policies. Data use
    may not be used for commercial purposes unless specifically authorized through a
    separate agreement consistent with governing award and consortium terms.
  use_category:
  - AI/ML model development and fine-tuning
  - Model validation and benchmarking
  - Retrospective clinical and comparative effectiveness research
  - Methodological research in trustworthy AI

prohibited_uses:
- name: Prohibited uses of the CHoRUS dataset
  prohibition_reason:
  - Prohibition of re-identification attempts
  - The dataset is not appropriate for re-identification, contact tracing, or
    patient-level intervention
  - No raw data export from the secure enclave is permitted unless explicitly approved
  - Data use may not be used for commercial purposes unless specifically authorized
    through a separate agreement consistent with governing award and consortium terms

distribution_formats:
- name: Controlled-access distribution through the CHoRUS secure enclave
  description: >-
    The dataset is distributed under controlled access. Structured EHR data are
    distributed in the OMOP Common Data Model, imaging in DICOM, waveform telemetry in
    WFDB, EEG in EDF+ and Persyst, and tokenized clinical notes under the OHNLP
    schema. File formats recorded for the RO-Crate package are .ipynb,
    text/tab-separated-values, and wfdb. Access is restricted to a secure enclave
    environment; no raw data export is permitted unless explicitly approved.
  access_urls:
  - https://chorus4ai.org/dataset/
  - https://doi.org/10.18130/V3/XNBOPG

distribution_dates:
- name: Version 1.0 Beta release
  description: >-
    The CHoRUS RO-Crate Package version 1.0 Beta records a publication date of
    2026-04-03 and a release date recorded as 03/04/2026 in the package metadata.
  release_dates:
  - '2026-04-03'

third_party_sharing:
- name: Controlled-access distribution to external institutions
  is_shared: true
  description: >-
    The dataset is shared with entities outside the creating institutions through a
    controlled-access framework. Access requires institutional affiliation and
    credentials, an approved research proposal reviewed by the CHoRUS governance
    committee, a Data Use Agreement executed between the requestor institution and
    CHoRUS, IRB approval or exemption documentation as applicable, and compliance with
    NIH Bridge2AI OT terms and applicable federal regulations. Access is restricted to
    the secure enclave environment.

license_and_use_terms:
  name: CHoRUS data use agreement and license terms
  description: >-
    Access is governed by a Data Use Agreement rather than an open content license.
    Software developed in the CHoRUS GitHub organization is separately licensed under
    permissive open source licenses. The licensing contact recorded in the RO-Crate
    package is Ciera McCrary, CHoRUS Program Manager at Massachusetts General
    Hospital, cmccrary@mgh.harvard.edu.
  license_terms:
  - Data Use Agreement available at 'https://chorus4ai.org/dataset/'
  - 'Conditions of access:
