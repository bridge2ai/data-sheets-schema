purposes:
- name: Develop a publicly available AI-ready critical care dataset
  description: >-
    The project's overarching goal is to develop a publicly available, AI-ready
    critical care dataset, while ensuring the methods promote privacy, accountability,
    and clinical benefit, and while promoting a new generation of AI clinicians and
    scientists.
  response: >-
    The CHoRUS data generation project was created to meet the need of generating
    data for ML/AI applications aimed at characterizing acute and critical care
    illness, predicting complications, and measuring treatment response among patients
    with acute or critical illness. Developing high-resolution multi-center data sets
    is a critical first step towards actionable and trustworthy AI.
- name: Enable secure, auditable, and reproducible AI research on recovery from acute
    illness
  description: >-
    The repository is designed to enable secure, auditable, and reproducible
    artificial intelligence research to improve recovery from acute illness.
  response: >-
    The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness. CHoRUS supports AI model development, validation,
    benchmarking, and translational research while maintaining compliance with HIPAA
    and NIH data-sharing policies.
- name: Provision a holdout test set for external model validation
  description: >-
    The dataset provisions a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care.
  response: >-
    Sequestering holdout datasets for external validation is one of the project's
    stated deliverables. Hold-out splits are available for testing; training and
    validation in development splits require internal mechanisms to avoid overfitting.
- name: Create ethically sourced datasets and best practices for AI in health
  description: >-
    The CHoRUS project is one data generation project of four in the National
    Institutes of Health (NIH) funded Bridge2AI consortium. The goal is to work with
    projects to create ethically sourced datasets and tools around Artificial
    Intelligence and to create best practices for AI in health.
  response: >-
    Through three pillars - Data (Standards, Tool Development and Optimization, and
    Data Acquisition), Ethics (Ethical and Trustworthy AI), and People (Team Science
    and Skill and Workforce Development) - the project addresses multiple challenges
    relevant for acquiring an AI-ready data set from more than 100,000 critically ill
    patients.

tasks:
- name: Characterizing acute and critical care illness
  description: >-
    Generating data for ML/AI applications aimed at characterizing acute and
    critical care illness among patients with acute or critical illness.
  response: >-
    The CHoRUS data generation project will meet the need of generating data for
    ML/AI applications aimed at characterizing acute and critical care illness.
- name: Predicting complications in critically ill patients
  description: >-
    Supporting machine learning models that predict complications and clinical
    deterioration among patients with acute or critical illness.
  response: >-
    A visualization and annotation environment labels data with targets important
    for prediction, supporting the development of predictive models for complications
    in acute and critical care.
- name: Measuring treatment response
  description: >-
    Supporting models and analyses that measure treatment response among patients
    with acute or critical illness.
  response: >-
    Medication administration is captured with dosing time-stamped upon each infusion
    change or dose administration, supporting measurement of treatment response.
- name: Multi-modal AI model development, validation, and benchmarking
  description: >-
    AI model training within the enclave, model validation and benchmarking,
    algorithm development and feature engineering, and fine-tuning of multimodal
    models.
  response: >-
    The dataset supports AI model training within the enclave, model validation and
    benchmarking, algorithm development and feature engineering, retrospective
    hypothesis testing, fine-tuning of multimodal models, comparative effectiveness
    research, reinforcement learning and development of expert AI, methodological
    research in trustworthy AI, and trial emulation or powering.

addressing_gaps:
- name: Lack of infrastructure for AI/ML in critical care
  description: >-
    There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care.
  response: >-
    Developing high-resolution multi-center data sets is a critical first step
    towards actionable and trustworthy AI. The CHoRUS project develops the necessary
    network, tools, standards, data, and education to build ML- and AI-derived models
    to improve the care and outcomes of patients requiring critical care.
- name: Absence of a diverse, high-resolution, ethically sourced AI-ready critical
    care dataset
  description: >-
    The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness.
  response: >-
    CHoRUS acquires a dataset of unprecedented diversity and high resolution across
    a multi-center network, harmonizing multi-modal EHR, waveform, imaging, and text
    data under unified standards.
- name: Lack of a legal and ethical framework for collecting clinical data at scale
  description: >-
    Existing legal and regulatory landscape does not adequately address privacy,
    bias, and provenance for clinical care AI.
  response: >-
    The project establishes a legal framework for collecting data at scale, performs
    community-facing ethics focus groups to determine what data is appropriate for
    public sharing, and evaluates community perspectives on clinical care AI to find
    ways to increase trustworthiness of provenance and privacy in AI. Patient-focused
    efforts determine the ethical and legal approaches to manage privacy and bias
    while accounting for Social Determinants of Health.
- name: Absence of externally validated holdout data for marketplace adoption of
    clinical AI models
  description: >-
    Marketplace adoption of AI-developed models for implementation in acute and
    critical care is limited by the absence of sequestered holdout data for external
    validation.
  response: >-
    The dataset provisions a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care.

