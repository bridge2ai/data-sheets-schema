  - All participants must sign a licensing agreement included in the registration form
    before gaining access to the dataset
  - Access to CHoRUS data is governed through a controlled-access framework requiring
    institutional affiliation and credentials, an approved research proposal reviewed
    by the CHoRUS governance committee, a Data Use Agreement executed between the
    requestor institution and CHoRUS, IRB approval or exemption documentation as
    applicable, and compliance with NIH Bridge2AI OT terms and applicable federal
    regulations
  - Access is restricted to a secure enclave environment; no raw data export is
    permitted unless explicitly approved
  - Data use may not be used for commercial purposes unless specifically authorized
    through a separate agreement consistent with governing award and consortium terms
  - The CHoRUS software project is licensed under the MIT License; the Chorus_SOP
    repository is licensed under Apache-2.0
  data_use_permission:
  - ethics_approval_required
  - no_commercial_use
  - project_specific
  - institution_specific
  contact_person: urn:d4d:chorus:person:ciera-mccrary

ip_restrictions:
  name: Copyright and intellectual property restrictions
  restrictions:
  - "\xA9 2026 THE GENERAL HOSPITAL CORPORATION D/B/A MASSACHUSETTS GENERAL HOSPITAL.\
    \ Copyrights are owned by each subaward site for curation performed locally.\
    \ Copyrights are jointly held for software jointly developed. All rights reserved"
  - The CHoRUS software project is licensed under the MIT License; the Chorus_SOP
    repository is licensed under Apache-2.0
  - Data use may not be used for commercial purposes unless specifically authorized
    through a separate agreement consistent with governing award and consortium terms

regulatory_restrictions:
  name: Regulatory restrictions and confidentiality classification
  regulatory_restrictions:
  - Access restricted to a secure enclave environment; no raw data export permitted
    unless explicitly approved
  - Compliance with NIH Bridge2AI OT terms and applicable federal regulations
  - IRB approval or exemption documentation is required, as applicable
  - The dataset is recorded as FDA regulated
  - A ".edu" email address is required to gain access to the dataset through the
    AIM-AHEAD Bridge2AI for Clinical Care Training Program
  hipaa_compliant: compliant
  other_compliance:
  - De-identification consistent with HIPAA Safe Harbor
  - HIPAA exemption 4 (45 CFR 46.104(d)(4))
  - NIH data-sharing policies
  - NIST 800-53 aligned secure enclave architecture with role-based access controls,
    audit logging, and controlled-access governance review
  confidentiality_level: confidential
  description: >-
    The RO-Crate package records the confidentiality level as HL7:2V (very
    restricted), which corresponds to the highest confidentiality tier in this schema
    because access requires IRB documentation, a formal data use agreement, and
    institutional authorization. The data governance committee contact is Eric
    Rosenthal, EROSENTHAL@mgh.harvard.edu.
  governance_committee_contact: urn:d4d:chorus:person:eric-s-rosenthal

maintainers:
- name: CHoRUS Data Pillar
