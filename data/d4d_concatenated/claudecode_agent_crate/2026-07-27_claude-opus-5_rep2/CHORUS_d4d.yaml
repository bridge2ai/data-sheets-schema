- name: Patient hospital admission
  instance_type: patient hospital admission
  counts: 50000
  description: >-
    Patient admissions from ICU, PICU, and NICU in the current released dataset. As
    of August 2025 the dataset covered 14 different hospitals with over 45,000 unique
    admissions. The anticipated final dataset covers 100,000 patient admissions; the
    NIH project abstract describes acquiring an AI-ready data set from more than
    100,000 critically ill patients.
- name: Row of EHR data in the OMOP Common Data Model
  instance_type: row of standardized electronic health record data
  counts: 1600000000
  description: >-
    1.6 billion rows of EHR OMOP data in the current released dataset, covering
    demographics, medication administration (dosing time-stamped upon each infusion
    change or dose administration), procedures documented by providers, nursing
    flowsheets (high-frequency documentation), and diagnoses documented by providers.
- name: Admission with associated radiology imaging data
  instance_type: patient hospital admission with radiology data
  counts: 7642
