id: https://doi.org/10.18130/V3/XNBOPG
name: CHoRUS for Clinical Care AI Dataset
title: 'The Bridge2AI CHoRUS for Clinical Care AI Dataset: A Multi-Center, Multi-Modal,
  High-Resolution Critical Care Dataset'
description: >-
  The Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care
  AI is a clinical data network developing a flagship multi-hospital, multimodal,
  high-resolution dataset under the NIH Bridge2AI program. CHoRUS harmonizes electronic
  health record (EHR) data, imaging, high-resolution physiologic signals (including
  telemetry data and EEG where available), and tokenized note and report text (via
  OHNLP toolkit) with raw text retained locally across participating institutions
  using standardized data models and governance frameworks. The repository is designed
  to enable secure, auditable, and reproducible artificial intelligence (AI) research
  to improve recovery from acute illness. Data are curated within a NIST 800-53-aligned
  secure enclave architecture with role-based access controls, audit logging, and
  controlled-access governance review. CHoRUS supports AI model development, validation,
  benchmarking, and translational research while maintaining compliance with HIPAA
  and NIH data-sharing policies. CHoRUS is one of four data generation projects in
  the NIH-funded Bridge2AI consortium. The collaboration spans 20 academic centers,
  of which 14 contribute as Data Acquisition centers, with 60+ consortium members.
  The anticipated final dataset covers 100,000 patient admissions across 9 data
  modalities. As described on the CHoRUS project website, the current released
  dataset in the CHoRUS enclave covers 50,000 patient admissions from ICU, PICU, and
  NICU, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and
  23 TB of waveform data. The separately packaged RO-Crate release published
  2026-04-03 as version 1.0 Beta is an interim release with partial data: it totals
  approximately 1.2 TB across an EHR sub-crate and a waveforms sub-crate, does not
  include all patients in the CHoRUS full cohort, and includes no DICOM images. The
  two figures describe different release scopes and are not in conflict.
