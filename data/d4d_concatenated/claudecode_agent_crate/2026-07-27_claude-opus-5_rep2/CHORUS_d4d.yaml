extension_mechanism:
  name: Contribution and extension mechanisms
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - Clinical collaborators can contribute to semantic mapping and validation through
    the chorus-mapping repository, which holds documentation and pooled tabular
    mappings along with an associated clinical validation SOP
  - Issues in the creation or submission of a data extract can be posted in the
    Standards Discussions or Data Acquisition Discussions
  - Data contributing sites submit status updates either through the GitHub interface
    directly or by submitting a Google Form, which triggers a GoogleScript that calls
    the GitHub API to update status and issue information
  - Governance committee oversight is required for structural modifications
  - A web guide for contributors and users of the CHoRUS software packages compiles
    documentation in the chorus-developer repository

is_deidentified:
  name: De-identification of the CHoRUS dataset
  identifiable_elements_present: false
  method: >-
    De-identification consistent with HIPAA Safe Harbor, with removal or tokenization
    of direct identifiers, date shifting or limited date fields when required, imaging
    metadata de-identification using the RSNA Clinical Trial Processor, and
    pixel-level de-identification using IbisWorks EICON. Data are transformed using
    approaches that limit re-identification.
  identifiers_removed:
  - Direct identifiers (removed or tokenized)
  - Imaging metadata identifiers (RSNA Clinical Trial Processor)
  - Identifiers present in image pixels (IbisWorks EICON)
  - Dates (shifted or limited when required)
  - Raw clinical note and report text (retained locally; only tokens are distributed)
  deidentification_details:
  - The RO-Crate package records the dataset as de-identified
  - 'CHoRUS operates within a secure enclave environment aligned with NIST 800-53
    controls.'
  - Role-based access control (RBAC) and multi-factor authentication
  - Full audit logging of data access and queries
  - Prohibition of re-identification attempts
  - Data export restrictions and output review procedures to reduce risk of
    re-identification
  - Re-identification risk is periodically assessed and mitigation strategies updated
    as needed
  - As of August 2025, imaging de-identification was in process for a larger cohort

