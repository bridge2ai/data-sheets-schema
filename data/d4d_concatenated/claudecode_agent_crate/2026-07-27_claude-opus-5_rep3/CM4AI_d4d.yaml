missing_data_documentation:
  - name: release_completeness
    description: >-
      Missing and incomplete data documented for this release.
    missing_data_patterns:
      - Some datasets are under temporary pre-publication embargo.
      - >-
        Protein-protein interaction (SEC-MS), protein localization (IF
        imaging), and CRISPRi perturb-seq data interrogate sets of proteins
        which incompletely overlap.
      - Computed cell maps are not included in this release.
      - >-
        External data links for perturb-seq in KOLF2.1J iPSCs and in
        MDA-MB-468 cells are marked "Embargoed" on the June 2026 release page.
      - >-
        Checksums are present for only 8 of the 55,859 entities documented in
        the release RO-Crate.
    missing_data_causes:
      - >-
        The release is an interim, quarterly beta delivered while the project
        is still generating data.
      - >-
        Some components await publication before their raw depositions can be
        opened.
      - >-
        Integrated map products have not yet been computed for release.
    handling_strategy: >-
      Missing and embargoed components are declared explicitly in the release
      completeness statement, in the release RO-Crate, and in the external data
      links section of the release page; data are augmented on a quarterly
      basis through the end of the project.

