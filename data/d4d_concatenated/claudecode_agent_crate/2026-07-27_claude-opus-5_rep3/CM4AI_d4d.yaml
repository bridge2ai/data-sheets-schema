        The release is classified at confidentiality level Unrestricted, is not
        FDA regulated, and contains no human subjects data; the samples are
        recorded as de-identified.
      - >-
        A Data Access Committee supervises ethical matters related to dataset
        distribution and potential dual licensing for commercial use.

