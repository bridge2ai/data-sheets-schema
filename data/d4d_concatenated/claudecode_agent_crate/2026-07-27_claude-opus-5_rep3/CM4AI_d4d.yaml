    name: EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468 Cells Upon Paclitaxel Perturbation
    title: EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468 Cells Upon Paclitaxel Perturbation
    description: >-
      Affinity purification mass spectrometry (AP-MS) raw data generated from
      endogenously tagged MDA-MB-468 cells under paclitaxel perturbation,
      focused on drug-induced interactome rewiring of chromatin modifiers
      relevant to the triple-negative breast cancer context. All AP-MS
      experiments were performed in four biological replicates; each batch
      includes an untagged parental control, ten chromatin modifier tagged cell
      lines, and a positive control tagged line, with DMSO-treated samples
      serving as vehicle controls. Unpublished data. Content size 441.2 GB.
      Component crate of the June 2026 release, comprising 560 parts of which
      555 are datasets, with 2 schemas, 1 sample, 1 instrument, and 1
      experiment entity, and an evidence graph at
      AP-MS/apms-paclitaxel-rocrate/ro-crate-prov-graph.html.
