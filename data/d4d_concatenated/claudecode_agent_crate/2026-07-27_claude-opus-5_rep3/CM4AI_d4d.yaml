  method: >-
    Source material consists of commercially available human cell lines
    supplied to the project already de-identified; no additional
    de-identification procedure is applied by CM4AI.
  deidentification_details:
    - 'Dataverse Data Governance and Ethics section: De-identified Samples: Yes.'
    - >-
      CM4AI data are considered de-identified as they cannot be matched, with
      current knowledge, to a human subject.

external_resources:
  - name: external_repository_dependencies
    description: >-
      Resources outside the archival Dataverse deposit on which the release
      depends for its bulk payloads and for interactive access.
    external_resources:
      - >-
        MassIVE (https://massive.ucsd.edu/), holding raw AP-MS and SEC-MS
        depositions MSV000101915, MSV000101917, MSV000100676, and MSV000098237.
      - >-
        FigShare (https://figshare.com/s/ee85bb1880921326249b), holding the
        processed CRISPRi Perturbation Cell Atlas.
      - >-
        The NCBI Sequence Read Archive, intended host of the raw perturbation
        sequencing data, currently embargoed.
      - >-
        FAIRSCAPE (https://fairscape.net/), which mints and resolves the ARK
        persistent identifiers of the release crate and its components and
        serves their landing pages and evidence graphs.
      - >-
        The CM4AI web portal (https://cm4ai.org/), built on the U-BRITE
        platform, which lists releases, tools, and documentation.
      - >-
        The Network Data Exchange, NDEx (https://ndexbio.org), through which
        cell maps produced by the project are shared and visualized.
    archival: false
    future_guarantees:
      - >-
        Long term preservation of the release itself is committed in the
        University of Virginia Dataverse with committed institutional funds; no
        equivalent guarantee is stated for the external repositories holding
        the raw payloads.
    restrictions:
      - >-
        The perturb-seq raw sequence depositions are marked "Embargoed" and are
        not currently retrievable.
      - >-
        The Dataverse collection hosting the release carries a notice that it
        is under review for potential modification in compliance with
        Administration directives.

