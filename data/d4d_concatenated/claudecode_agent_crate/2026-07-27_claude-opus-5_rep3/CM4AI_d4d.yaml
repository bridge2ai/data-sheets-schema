    access_url: https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915
    raw_data_details:
      - >-
        AP-MS raw data under paclitaxel perturbation: MSV000101915 (441.2 GB).
      - >-
        AP-MS raw data under vorinostat perturbation: MSV000101917 (532.5 GB).
      - >-
        SEC-MS of KOLF2.1J differentiation series: MSV000100676 (1.11 TB).
      - >-
        SEC-MS of treated MDA-MB-468 cells: MSV000098237 (910 GB), DOI
        10.25345/C5348GV4S.
  - name: figshare_perturbation_atlas
    description: >-
      FigShare deposition of the processed CRISPRi Perturbation Cell Atlas.
    access_url: https://figshare.com/s/ee85bb1880921326249b
    raw_data_details:
