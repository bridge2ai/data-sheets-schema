    start_date: '2022-09-01'
    end_date: '2026-08-31'
    timeframe_details:
      - >-
        NIH RePORTER records the CM4AI Data Generation Project (core project
        OT2OD032742) with project start 2022-09-01 and project end 2026-08-31.
  - name: dataverse_creation_record
    description: >-
      Dates recorded in the Dataverse citation metadata for the release.
    start_date: '2025-02-27'
    end_date: '2025-02-27'
    timeframe_details:
      - >-
