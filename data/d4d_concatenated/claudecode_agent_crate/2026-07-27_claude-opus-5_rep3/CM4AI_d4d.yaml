        Processed perturbation cell atlas for KOLF2.1J human induced
        pluripotent stem cells, 177.35 GB, covering 11,739 targeted genes.

machine_annotation_tools:
  - name: llm_assembly_naming
    description: >-
      Machine annotation of protein assemblies.
    tools:
      - Gene Set AI (GSAI) large language model annotation pipeline
    tool_descriptions:
      - >-
        A large language model approach developed by the project that names
        sets of proteins in a cell map assembly and assigns a name confidence
        score, using an engineered prompt following chain-of-thought and
        one-shot strategies, with a separate citation module that constructs
        literature queries and evaluates whether returned publications support
        the generated analysis.
    tool_accuracy:
      - >-
        In the associated U2OS cell map study, the model assigned names to
        known assemblies with median confidence 0.92, to previously
        undocumented assemblies with median confidence 0.85, and to random
        protein sets with median confidence 0.0.

