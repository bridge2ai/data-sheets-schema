purposes:
  - name: interpretable_genotype_phenotype_learning
    description: >-
      Primary scientific objective of the CM4AI data generation project.
    response: >-
      To map the spatiotemporal architecture of human cells and use these maps
      toward the grand challenge of interpretable genotype-phenotype learning.
      In genomics and precision medicine, machine learning models are often
      "black boxes," predicting phenotypes from genotypes without revealing the
      mechanisms by which such translation occurs; CM4AI addresses this
      deficiency by producing a library of large-scale maps of cellular
      structure and function across demographic and disease contexts, so that
      "visible" machine learning systems can be built directly on knowledge
      maps of cell and tissue architecture.
  - name: ethical_ai_ready_data_production
    description: >-
      Overarching mission stated in the CM4AI project description.
    response: >-
      To produce ethical, AI-ready datasets of cell architecture, inferred from
      multimodal data collected for human cell lines, to enable transformative
      biomedical AI research. CM4AI defines AI-ready biomedical data as fully
      characterized FAIR data of known provenance that can be ethically and
      reliably processed by AI applications; whose models and software are
      available and well-described for validation and re-use; and whose
      predictions may be fully explained and interpreted to the user as needed.
  - name: fair_provenanced_data_standards
    description: >-
      Standards and provenance objective of the project.
    response: >-
      To implement a standards-based data management approach founded on FAIR
      access and software principles, with deep provenance and replication
      packages for the representation of cell maps and their underlying
      datasets, using an extended client-server version of the FAIRSCAPE
      framework to establish FAIRness, compute machine-readable provenance
      graphs resolvable as metadata for all results, and characterize and
      validate all datasets and data elements against public ontology
      vocabularies.
  - name: workforce_and_ethics_programs
    description: >-
      People and Ethics pillar objectives.
    response: >-
      To initiate a research program in ethical AI, especially as it relates to
      how cell maps will be used in genomic medicine and model interpretation,
      and to stimulate a diverse portfolio of training opportunities in the
      emerging field of biomachine learning.

tasks:
  - name: protein_protein_interaction_mapping
    description: Mass-spectrometry mapping of protein interaction networks.
    response: >-
      Map protein-protein interactions of chromatin regulators under multiple
      cellular conditions using affinity purification mass spectrometry (AP-MS)
      on endogenously tagged cell lines and size-exclusion chromatography
      coupled to mass spectrometry (SEC-MS) for proteome-wide complex and
      interaction mapping, as two orthogonal mass-spectrometry-based
      approaches.
  - name: spatial_proteomics_mapping
    description: Immunofluorescence imaging of subcellular protein localization.
    response: >-
      Map the spatial subcellular organization of chromatin modifiers, their
      interactors, and key signaling molecules using Human Protein Atlas
      antibodies with automated fixation and permeabilization protocols,
      immunofluorescence-based staining (ICC-IF), and confocal microscopy.
  - name: genetic_perturbation_mapping
    description: Single-cell CRISPR interference perturbation screens.
    response: >-
      Perform single-cell CRISPR screens perturbing chromatin regulators in
      MDA-MB-468 cells under three conditions (no treatment, paclitaxel,
      vorinostat) and in KOLF2.1J iPSCs, using a CRISPR lentiviral library and
      inducible dCas9 lines, to map transcriptional and fitness phenotypes.
  - name: multimodal_map_integration
    description: Integration of modalities into hierarchical cell maps.
    response: >-
      Integrate the multimodal input data streams via the Multi-Scale
      Integrated Cell (MuSIC) software pipeline, using deep-learning embedding
      of each modality followed by contrastive co-embedding and multi-resolution
      community detection, to produce hierarchical directed acyclic graphs in
      which each node is an assembly of proteins in proximity at a given scale.
  - name: ai_readiness_packaging
    description: Provenance and metadata packaging of released data.
    response: >-
      Package all data, software, metadata, and provenance graphs as AI-ready
      RO-Crates through the FAIRSCAPE client and server, assign persistent
      globally unique ARK identifiers to crates and their components, and
      compute end-to-end provenance entailments expressed in the EVI Evidence
      Graph Ontology.

addressing_gaps:
  - name: black_box_genotype_phenotype_models
    description: Interpretability gap in genomic machine learning.
    response: >-
      Machine learning models show great promise in analyzing the human genome
      to make predictions, but the inner workings of these models are typically
      difficult-to-interpret black boxes. CM4AI generates matched data and tools
      that enable the creation of "visible" machine learning systems built
      directly on knowledge maps of cell and tissue architecture rather than on
      opaque representations.
  - name: uncharted_subcellular_architecture
    description: Incomplete knowledge of human cell organization.
    response: >-
      Human cells are organized across a spatial hierarchy of components
      spanning nanometre-scale protein complexes to micrometre-scale organelles,
      and much of this architecture remains uncharted. Individual mapping
      technologies each miss part of that range; integration of complementary
      modalities is required to resolve subcellular components robustly across
      physical scales.
  - name: missing_ai_readiness_infrastructure
    description: Lack of provenanced, characterized, ethically packaged data.
    response: >-
      Datasets used to train and analyse AI/ML models must be FAIR,
      provenanced, characterized, explainable, and ethically obtained. CM4AI
      supplies an AI-readiness framework in which complete schemas, validation
      procedures, and data sheets for all datasets in the provenance graph, and
      model cards for all models used, are resolvable from the dataset's
      metadata.

