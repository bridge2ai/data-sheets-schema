other_tasks:
  - name: downstream_applications
    description: >-
      Further tasks the data can support beyond the project's own analyses.
    task_details:
      - >-
        Interpretation of genetic variants and mutations in human genomics
        using hierarchical cell maps as structured priors.
      - >-
        Construction of visible machine learning systems, also called visible
        neural networks, that interrogate how protein assemblies in the cell
        affect cell-level phenotype predictions.
      - >-
        Analysis of cell architectural changes and interactions in the presence
        of specific disease processes, treatment conditions, or genetic
        perturbations.

future_use_impacts:
  - name: interim_release_impacts
    description: >-
      Consequences of the release's interim status for future users.
    impact_details:
      - >-
        Composition will change: the dataset will be regularly updated and
        augmented on a quarterly basis through the end of the project in
        November 2026, so analyses should record the release DOI and version
        used.
      - >-
        Computed cell maps are absent from this release and will be added in
        future releases, so downstream products built on the current release
        rest on input data streams rather than on the project's integrated map
        output.
      - >-
        Embargoed raw components may become openly available on publication,
        changing what can be independently verified.
      - >-
        The repository collection carries a notice that it is under review for
        potential modification in compliance with Administration directives,
        which introduces uncertainty about the continued availability of the
        distributed content in its current form.

discouraged_uses:
  - name: clinical_use
    description: >-
      Uses the producers explicitly discourage.
    discouragement_details:
      - >-
        Clinical decision-making, or any context involving patient care,
        without appropriate regulatory oversight and approval.
      - >-
        Inference about population-level biological variation, since the data
        derive from two commercially available cell lines and do not represent
        all biological variants which may be seen in the population at large.
      - >-
        Analyses requiring an integrated multimodal product, since computed
        cell maps are not included and the modality-specific protein sets
        overlap only partially.

intended_uses:
  - name: declared_intended_uses
    description: >-
      Intended uses declared on the CM4AI Dataverse releases and in the release
      RO-Crate.
    examples:
      - AI-ready datasets to support research in functional genomics.
      - AI model training.
      - Cellular process analysis.
      - >-
        Analysis of cell architectural changes and interactions in the presence
        of specific disease processes, treatment conditions, or genetic
        perturbations.
    usage_notes: >-
      The release RO-Crate adds that a major goal is to enable
      biologically-driven, interpretable machine learning applications, for
      example as proposed in Ma et al. 2018 (PMID 29505029) and Kuenzi et al.
      2020 (PMID 33096023). Attribution is required to the copyright holders
      and the authors, and any publication referencing these data or derived
      products should cite the related publications as well as the data
      collection itself.
    use_category:
      - research
      - machine learning model development
      - non-commercial use

prohibited_uses:
  - name: clinical_decision_making
    description: >-
      Prohibited use published on every CM4AI release and repeated on each
      component crate in the release RO-Crate.
    prohibition_reason:
      - >-
        These laboratory data are not to be used in clinical decision-making or
        in any context involving patient care without appropriate regulatory
        oversight and approval.
  - name: unlicensed_commercial_use
    description: >-
      Commercial restriction arising from the release license and the project's
      licensing policy.
    prohibition_reason:
      - >-
        The dataset is licensed under Creative Commons
        Attribution-NonCommercial-ShareAlike 4.0 International, which does not
        permit use of the material for commercial purposes.
      - >-
        Commercial use requires a separate license negotiation with the
        copyright holder (UCSD, Stanford, and/or UCSF depending upon the
        specific data package in question); a Data Access Committee supervises
        ethical matters related to dataset distribution and potential dual
        licensing for commercial use.

