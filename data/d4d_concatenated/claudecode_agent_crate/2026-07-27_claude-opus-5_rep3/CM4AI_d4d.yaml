name: CM4AI_June_2026_Data_Release
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence
  (CM4AI), the Functional Genomics Grand Challenge Data Generation Project of
  the U.S. National Institutes of Health Bridge2AI program. CM4AI produces
  machine-readable hierarchical maps of human cell architecture as AI-ready
  data, inferred from multimodal interrogation of chromatin modifiers,
  metabolic enzymes, and other proteins implicated in cancer, neuropsychiatric,
  and cardiac disorders. Data are generated in two disease-relevant human cell
  lines under perturbed and unperturbed conditions: the triple-negative breast
  cancer line MDA-MB-468 (untreated / DMSO control, paclitaxel, and vorinostat)
  and the induced pluripotent stem cell line KOLF2.1J (undifferentiated, and
  differentiated into neural progenitor cells, neurons, and cardiomyocytes).
  Three complementary mapping modalities are combined: mass-spectrometry
  proteomics for protein-protein interactions (affinity purification
  mass spectrometry, AP-MS, and size-exclusion chromatography mass
  spectrometry, SEC-MS), immunofluorescence confocal imaging for spatial
  proteomics, and single-cell CRISPR interference perturbation sequencing
  (perturb-seq). This Beta release contains perturb-seq data for MDA-MB-468
  cells with and without treatment and for undifferentiated KOLF2.1J iPSCs;
  SEC-MS data for MDA-MB-468 cells with and without treatment and for
  undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and
  cardiomyocytes; AP-MS data for treated MDA-MB-468 cells; and
  immunofluorescence images of MDA-MB-468 cells with and without treatment.
  Outputs are packaged with provenance graphs and rich metadata as AI-ready
  datasets in RO-Crate format using the FAIRSCAPE framework, with persistent
  ARK identifiers and machine-readable evidence graphs. The release is
  distributed through LibraData, the University of Virginia Dataverse, with
  large raw payloads deposited in MassIVE, the Sequence Read Archive, and
  FigShare. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale,
  UT Austin, UA Birmingham, Simon Fraser University, and the Hastings Center.
