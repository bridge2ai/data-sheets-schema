anomalies:
  - name: crate_release_metadata_divergence
    description: >-
      Divergences observed between the release landing page and the release
      RO-Crate metadata for the same June 2026 release.
    anomaly_details:
      - >-
        The release RO-Crate declares version 1.0 and datePublished 2026-06-30,
        while the Dataverse record for the same DOI (10.18130/V3/HIGT4C)
        reports version 2.0, publication date 2026-06-17, and a version 2
        release timestamp of 2026-07-15T20:28:19Z.
      - >-
        The CM4AI data releases page labels the current release "June 2026 Data
        Release (Beta)" but displays a release date of June 17, 2025.
      - >-
        The citation string embedded in the release RO-Crate gives the year as
        2025 for a release whose Dataverse publication date is 2026-06-17.
      - >-
        No component crate in the release RO-Crate cites the release it belongs
        to. All ten component citation strings name the "March 2025 Data
        Release (Beta)"; six point at DOI 10.18130/V3/B35XWX, which is indeed
        the March 2025 release, while the two EndoTag AP-MS crates and the
        KOLF2 SEC-MS crate point at DOI 10.18130/V3/K7TGEM, which is the
        October 2025 release.
      - >-
        Several isPartOf references in the release RO-Crate carry a trailing
        comma inside the identifier string, producing identifiers such as
        "...-June-2026-data-release," that do not match the crate's own release
        entity identifier.
      - >-
        The Data Governance Committee contact is spelled "Jillian Parker" in
        the Dataverse release metadata and "Jilian Parker" in the release
        RO-Crate.
      - >-
        The release RO-Crate reports a total content size of 21,051,331,945,400
        bytes for its documented entities while stating a headline content size
        of 19.9 TB for the release itself; the CM4AI portal reports a data
        volume of 21.4 TB for the project overall.
  - name: image_archive_identity_carryover
    description: >-
      The three immunofluorescence component crates in the June 2026 release
      RO-Crate carry MD5 checksums and content sizes (2.6 GB, 3.2 GB, 2.8 GB)
      identical to the v0.6 beta image archives published in the March 2025
      release, while their descriptions state 464 proteins of interest, the
      count associated with the later 3.8 GB, 4.6 GB, and 4.2 GB archives
      distributed on the June 2026 Dataverse record. The component crate
      metadata therefore mixes older archive identity with newer content
      description.
  - name: sparse_checksum_coverage
    description: >-
      The AI-readiness self-assessment shipped with the release records that
      0 percent of files carry checksums (8 of 55,859 entities), so
      file-level integrity verification is not possible for the bulk of the
      documented content.

known_biases:
  - name: cell_line_representation_bias
    description: >-
      Bias statement published on the CM4AI Dataverse releases and repeated in
      the release RO-Crate.
    bias_type: representation_bias
    bias_description: >-
      Data in this release was derived from commercially available
      de-identified human cell lines, and does not represent all biological
      variants which may be seen in the population at large.
    affected_subsets:
      - All MDA-MB-468 derived data (AP-MS, SEC-MS, immunofluorescence imaging, perturb-seq)
      - All KOLF2.1J derived data (SEC-MS, perturb-seq)
  - name: modality_coverage_bias
    description: >-
      Consequence of incomplete overlap between the protein sets interrogated
      by each modality.
    bias_type: sampling_bias
    bias_description: >-
      Protein-protein interaction (SEC-MS), protein localization (IF imaging),
      and CRISPRi perturb-seq data interrogate sets of proteins which
      incompletely overlap, so analyses that require all three modalities are
      restricted to the intersection rather than to a representative sample of
      the proteome.

known_limitations:
  - name: interim_release
    description: Release completeness limitation stated on the Dataverse record.
    limitation_type: scope_limitation
    limitation_description: >-
      This is an interim release. These data are not yet in completed final
      form.
    scope_impact: >-
      Content and composition of the dataset will change in subsequent
      quarterly releases through the end of the project.
    recommended_mitigation: >-
      Cite the specific release DOI and version used, and check the CM4AI data
      releases page for a more recent quarterly release.
  - name: no_predicted_cell_maps
    description: Absence of the project's integrated map products in this release.
    limitation_type: coverage_limitation
    limitation_description: >-
      The release does not contain predicted cell maps, which will be added in
      future releases; computed cell maps are not included.
    scope_impact: >-
      Users receive the multimodal input data streams rather than the
      integrated hierarchical cell maps that are the project's headline
      product.
    recommended_mitigation: >-
      Construct maps from the released input streams using the openly available
      Cell Mapping Toolkit pipeline.
  - name: single_dataset_analysis_suitability
    description: Integration limitation stated on the Dataverse record.
    limitation_type: integration_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the
      individual datasets rather than of an integrated multimodal product.
    scope_impact: >-
      Cross-modality integration must be performed by the user and is limited
      by the incomplete overlap of the protein sets interrogated by each
      modality.
  - name: domain_expertise_required
    description: Methodological limitation stated on the Dataverse record.
    limitation_type: methodological_limitation
    limitation_description: >-
      Meaningful analysis of these data requires domain expertise.
    scope_impact: >-
      Non-specialist reuse, including naive use as machine-learning training
      material, risks misinterpretation of the proteomic, imaging, and
      perturbation measurements.
  - name: embargoed_components
    description: Availability limitation stated on the Dataverse record.
    limitation_type: coverage_limitation
    limitation_description: >-
      Some datasets are under temporary pre-publication embargo. On the June
      2026 release, the external links for perturb-seq data in KOLF2.1J iPSCs
      and in MDA-MB-468 cells are marked "Embargoed".
    scope_impact: >-
      Raw perturbation sequencing data are not retrievable from the linked
      external repositories at the time of release.
    recommended_mitigation: >-
      Use the processed perturb-seq cell atlas distributed through the release
      and FigShare, and await publication of the embargoed depositions.

confidential_elements:
  - name: confidentiality_assessment
    description: >-
      Confidentiality classification carried on the release and on every
      component crate in the release RO-Crate.
    confidential_elements_present: false
    confidentiality_details:
      - 'Confidentiality level: Unrestricted.'
      - >-
        The data are non-clinical, derived from commercially available
        de-identified human cell lines, and are considered de-identified as
        they cannot be matched, with current knowledge, to a human subject.

content_warnings:
  - name: clinical_use_warning
    description: >-
      Warning published with every CM4AI release and repeated on each component
      crate.
    content_warnings_present: true
    warnings:
      - >-
        These laboratory data are not to be used in clinical decision-making or
        in any context involving patient care without appropriate regulatory
        oversight and approval.

subpopulations:
  - name: cell_line_and_condition_strata
    description: >-
      The dataset is stratified by cell line, differentiation state, and
      treatment condition rather than by human demographic subpopulation.
    subpopulation_elements_present: false
    identification:
      - >-
        Strata are identified by cell line (MDA-MB-468, KOLF2.1J), by
        differentiation state for the iPSC line (undifferentiated parental,
        neural progenitor cell, neuron, cardiomyocyte), and by treatment
        condition for the cancer line (untreated or DMSO vehicle control,
        paclitaxel, vorinostat).
    distribution:
      - >-
        Immunofluorescence image collections are distributed in three
        condition-specific archives (untreated, paclitaxel, vorinostat); AP-MS
        collections in two treatment-specific archives (paclitaxel,
        vorinostat); SEC-MS collections in two cell-line archives (KOLF2.1J and
        derivatives, MDA-MB-468); and perturb-seq in a processed cell atlas and
        a raw sequence archive.

sensitive_elements:
  - name: sensitivity_assessment
    description: >-
      Assessment of personally sensitive content, derived from the human
      subjects and de-identification statements published with the release.
    sensitive_elements_present: false
    sensitivity_details:
      - >-
        Human Subjects: No. De-identified Samples: Yes. FDA Regulated: No.
      - >-
        CM4AI data are distinctive within Bridge2AI in that they are
        non-clinical, derived from tissue cultures, and are considered
        de-identified as they cannot be matched, with current knowledge, to a
        human subject.
      - >-
        The two source cell lines derive from human donors described only in
        aggregate terms in the project literature: MDA-MB-468 (RRID:CVCL_0419)
        was established from a metastatic pleural effusion of a 51-year-old
        black female with metastatic mammary adenocarcinoma, and KOLF2.1J
        (RRID:CVCL_B5P3) was derived from a healthy male Northern European
        donor.

relationships:
  - name: modality_and_hierarchy_relationships
    description: >-
      Structural relationships among instances within and across the released
      data streams.
    relationship_details:
      - >-
        Cell maps are hierarchical directed acyclic graphs in which each node
        represents an assembly of proteins in proximity at a given scale,
        spanning from large assemblies representing cell compartments to small
        assemblies of proteins in close proximity, and directed edges represent
        containment of a smaller assembly by a larger one.
      - >-
        Protein-protein interaction, protein localization, and perturbation
        measurements are linked to one another through the shared protein and
        gene identifiers targeted across modalities, but the interrogated
        protein sets overlap only partially.
      - >-
        Every released component is linked to its inputs, computations,
        software, and outputs through machine-readable provenance graphs
        expressed in the EVI Evidence Graph Ontology and resolvable from
        persistent ARK identifiers.
      - >-
        AP-MS batches are structured so that each batch includes an untagged
        parental control, ten chromatin modifier tagged cell lines, and a
        positive control tagged line, with DMSO-treated samples serving as
        vehicle controls; all AP-MS experiments were performed in four
        biological replicates.

splits:
  - name: no_predefined_splits
    description: >-
      Partitioning of the released data.
    split_details:
      - >-
        No training, validation, or test splits are defined for this release.
        The data are partitioned by modality (AP-MS, SEC-MS, immunofluorescence
        imaging, perturb-seq), by cell line, and by treatment or
        differentiation condition, and are distributed as separate archives on
        that basis.

acquisition_methods:
  - name: instance_acquisition
    description: >-
      How the released measurements were obtained.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        Protein-protein interactions were measured directly by affinity
        purification mass spectrometry on endogenously tagged MDA-MB-468 cells
        and by size-exclusion chromatography coupled to mass spectrometry for
        proteome-wide complex and interaction mapping.
      - >-
        Protein subcellular localization was observed directly by
        immunofluorescence-based staining (ICC-IF) with Human Protein Atlas
        antibodies followed by confocal microscopy.
      - >-
        Transcriptional and fitness phenotypes were measured by single-cell
        CRISPR interference perturbation sequencing using a lentiviral guide
        library and inducible dCas9 lines, read out on the 10x Genomics 3' HT
        kit.
      - >-
        Cell maps are derived rather than observed: protein assemblies are
        inferred by community detection over a learned multimodal co-embedding
        of the imaging and interaction data.
      - >-
        Findings from the perturbation cell atlas were validated via
        phenotypic, protein-interaction, and metabolic tracing assays.

collection_mechanisms:
  - name: mass_spectrometry_proteomics
    description: Proteomic mass spectrometry mapping.
    mechanism_details:
      - >-
        Affinity purification mass spectrometry (AP-MS) on endogenously tagged
        cell lines, focused on drug-induced interactome rewiring of chromatin
        modifiers in the triple-negative breast cancer context, in four
        biological replicates per experiment.
      - >-
        Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for
        proteome-wide complex and interaction mapping in MDA-MB-468 cells under
        untreated, paclitaxel, and vorinostat conditions and in KOLF2.1J iPSCs
        and their neural progenitor, neuronal, and cardiomyocyte derivatives.
      - >-
        SEC-MS data for the differentiation series were acquired on a Bruker
        timsTOF platform with quantitative analysis performed using
        Spectronaut.
  - name: spatial_proteomics_imaging
    description: Immunofluorescence confocal imaging.
    mechanism_details:
      - >-
        Automated fixation and permeabilization protocols implemented on a
        pipetting robot for the MDA-MB-468 and KOLF2 cell lines, followed by
        immunofluorescence staining with Human Protein Atlas antibodies against
        each protein of interest and confocal microscopy imaging.
      - >-
        Each image carries four channels: protein of interest (green), nuclei
        stained with DAPI (blue), endoplasmic reticulum stained with a
        calreticulin antibody (yellow), and microtubules stained with a tubulin
        antibody (red).
  - name: crispr_perturbation_screens
    description: Genetic perturbation mapping.
    mechanism_details:
      - >-
        A CRISPR lentiviral library targeting chromatin factors with six guide
        RNAs per gene was introduced into MDA-MB-468 and KOLF2 lines
        engineered to express inducible dCas9, and single-cell CRISPR screens
        were performed under the treatment and differentiation conditions of
        interest.
      - >-
        The KOLF2.1J perturbation cell atlas is an expressed genome-scale
        CRISPRi screen mapping transcriptional and fitness phenotypes
        associated with 11,739 targeted genes.

sampling_strategies:
  - name: protein_and_cell_line_selection
    description: >-
      How proteins, genes, and cell lines were selected for interrogation.
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        Human chromatin modifiers, metabolic enzymes, and other proteins
        involved in cancer, neuropsychiatric, and cardiac disorders.
    strategies:
      - >-
        CM4AI targets a shared list of proteins across all cell types and
        treatment conditions in order to achieve deep multi-modal coverage of
        the same targets, rather than sampling proteins at random.
      - >-
        Cell lines were selected for disease relevance and ethical
        sourcing: MDA-MB-468, a triple-negative breast cancer line established
        from a metastatic pleural effusion and available from ATCC, extensively
        characterized with transcriptomic, mutational, and whole-genome
        sequencing data; and KOLF2.1J, an iPSC line derived from a healthy
        donor, available from the Human Induced Pluripotent Stem Cells
        Initiative (HipSci) resource to not-for-profit organizations under a
        simple material transfer agreement.
    why_not_representative:
      - >-
        Data in this release was derived from commercially available
        de-identified human cell lines and does not represent all biological
        variants which may be seen in the population at large.
      - >-
        The interrogated protein sets differ between modalities and overlap
        only partially.

data_collectors:
  - name: krogan_laboratory_ucsf
    description: >-
      Nevan Krogan laboratory at the University of California San Francisco.
    role: Mass-spectrometry proteomics data generation
    collector_details:
      - >-
        Generated the SEC-MS datasets on undifferentiated KOLF2.1J human
        induced pluripotent stem cells and their derivatives, and on MDA-MB-468
        human breast cancer cells following treatment with vorinostat or
        paclitaxel.
  - name: lundberg_laboratory_stanford
    description: >-
      Emma Lundberg laboratory at Stanford University.
    role: Spatial proteomics image acquisition
    collector_details:
      - >-
        Acquired the immunofluorescence confocal image collections for the
        MDA-MB-468 breast cancer line under untreated, paclitaxel, and
        vorinostat conditions.
  - name: mali_laboratory_ucsd
    description: >-
      Prashant Mali laboratory at the University of California San Diego.
    role: Genetic perturbation screening
    collector_details:
      - >-
        Performed the single-cell CRISPR interference perturbation screens and
        produced the Perturbation Cell Atlas of human induced pluripotent stem
        cells.
  - name: ideker_laboratory_ucsd
    description: >-
      Trey Ideker laboratory at the University of California San Diego.
    role: Data integration, cell map construction, and project leadership
    collector_details:
      - >-
        Operates the Tools Module responsible for the Multi-Scale Integrated
        Cell (MuSIC) data integration and map production pipeline, and hosts
        the project principal investigator and point of contact.
  - name: uva_standards_module
    description: >-
      University of Virginia Standards Module.
    role: AI-readiness packaging, provenance, and archival deposition
    collector_details:
      - >-
        Operates the FAIRSCAPE client and server that package datasets,
        metadata, software, and provenance graphs into RO-Crates, assign
        persistent ARK identifiers, and compute evidence-graph entailments;
        deposits releases into LibraData, the University of Virginia Dataverse.

