ethical_reviews:
  - name: cm4ai_ethics_review
    description: >-
      Ethical review recorded in the Data Governance and Ethics section of the
      CM4AI Dataverse releases and in the release RO-Crate.
    contact_person: https://orcid.org/0000-0002-7080-8801
    reviewing_organization: d4d:org-cm4ai-ethics-module
    review_details:
      - >-
        Ethical review is provided by Vardit Ravitsky
        (ravitskyv@thehastingscenter.org) and Jean-Christophe Bélisle-Pipon
        (jean-christophe_belisle-pipon@sfu.ca).
      - >-
        The Ethics team worked with the Data Acquisition, Tools, and Standards
        Modules to develop a plan for ethical preparation, licensing,
        dissemination, and data access supervision of CM4AI datasets, balancing
        openness of the data with protection of intellectual property and
        supervision of potential commercialization.
      - >-
        The Ethics team employs a methodology inspired by Value-Sensitive
        Design, developing an axiological repository of values to guide design
        standards and expectations, and formulating the CM4AI Life Cycle, a
        framework elucidating governance milestones throughout data generation
        and AI system development.
      - >-
        The Ethics Pillar supported the Bridge2AI Ethics Working Group and the
        Bridge2AI Data Sharing and Dissemination Working Group in developing a
        Code of Conduct that participants must attest and commit to prior to
        accessing Bridge2AI data, including CM4AI datasets.

data_protection_impacts:
