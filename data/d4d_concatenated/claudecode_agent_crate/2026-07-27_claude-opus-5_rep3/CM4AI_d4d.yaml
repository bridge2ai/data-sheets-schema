direct_collection:
  - name: direct_collection_from_cell_cultures
    description: >-
      Whether data were obtained directly from the individuals they concern.
    is_direct: false
    collection_details:
      - >-
        All measurements were made on commercially available, de-identified
        human cell lines obtained from repositories (MDA-MB-468 from ATCC,
        KOLF2.1J from the HipSci resource) rather than collected from human
        participants. No primary human subjects research was conducted under
        this release.

collection_notifications:
  - name: notification_not_applicable
    description: >-
      Notification of individuals whose data were collected.
    notification_details:
      - >-
        Not applicable. Data were collected from commercially available
        de-identified human cell lines; no individuals were enrolled,
        contacted, or notified for this release.

collection_consents:
  - name: consent_not_applicable
    description: Consent status for the released data.
    consent_details:
      - >-
        Not applicable to this release. The release RO-Crate records that no
        primary human subjects research was conducted and that data were
        collected from commercially available de-identified human cell lines
        (KOLF2.1J iPSC and MDA-MB-468).
      - >-
        Both source cell lines are described by the project as ethically
