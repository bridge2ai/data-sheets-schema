  - id: https://fairscape.net/api/ark:59853/rocrate-sec-ms-characterization-of-kolf2-neuronal-and-cardiomyocyte-differentiation-cm4ai-yjftt2oec6c
    name: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
    title: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
    description: >-
      Mass-spectrometry proteomics data investigating protein-protein
      interaction networks during the differentiation of KOLF2.1J human induced
      pluripotent stem cells. Size Exclusion Chromatography coupled with Mass
      Spectrometry (SEC-MS) was used to map multiscale biological organization
      across four states: undifferentiated parental iPSCs, neural progenitor
      cells, terminally differentiated neurons, and terminally differentiated
      cardiomyocytes. The study aims to identify how protein complexes and
      networks are reorganized during neuronal lineage commitment and
      cardiomyocyte differentiation. Data were acquired on a Bruker timsTOF
      platform with quantitative analysis performed using Spectronaut. Content
      size 1.11 TB. Evidence graph at
      mass-spec/iPSCs/ro-crate-prov-graph.html.
