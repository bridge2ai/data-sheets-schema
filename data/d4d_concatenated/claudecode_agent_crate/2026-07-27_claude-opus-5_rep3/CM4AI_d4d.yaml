        No linkage to identifiable individual records is performed; released
        entities are linked only to other datasets, software, and computations
        through the provenance graph.

participant_compensation:
  - name: participant_compensation_status
    description: >-
      Compensation of human participants.
    compensation_provided: false
    compensation_rationale:
      - >-
        Not applicable. No human participants were enrolled; data derive from
        purchased, de-identified cell lines.

preprocessing_strategies:
  - name: music_pipeline
    description: >-
      The Multi-Scale Integrated Cell (MuSIC) data integration and map
      production pipeline operated by the CM4AI Tools Module.
    preprocessing_details:
      - >-
        Download step: protein-protein interaction networks for the cell line
        and conditions are retrieved from the Krogan Laboratory deposition
        archive and immunofluorescence images from the Lundberg Laboratory
        deposition archive.
      - >-
        Embedding step: downloaded PPI networks are processed with the node2vec
        deep learning model to reduce dimensionality, producing a PPI embedding
        that captures each protein's interaction neighbourhood; IF images are
        processed with a Human Protein Atlas deep learning model, producing an
        image embedding that captures protein localization.
      - >-
        Co-embedding step: the PPI and image embeddings are integrated into a
        per-protein co-embedding using contrastive deep learning, so that the
        original embeddings can be reconstructed with minimal information loss
        and proteins with similar inputs receive similar co-embeddings.
      - >-
        Community detection step: community detection over the all-by-all
        similarities of protein pairs in the co-embedding space yields a
        hierarchy of protein communities that constitutes the cell map.
      - >-
        Hierarchy evaluation step: cell maps are aligned to known protein
        function and pathway resources including the Gene Ontology and
        Reactome, and assemblies are additionally annotated by a large language
        model approach that names protein sets and assigns a name confidence
        score.
      - >-
        Each pipeline segment calls the FAIRSCAPE client package to validate
        inputs and create the output RO-Crate package for that segment, which
        is then dispatched to the FAIRSCAPE server for persistent identifier
        creation and provenance graph entailment computation.
    used_software:
      - id: https://github.com/idekerlab/cellmaps_pipeline
        name: Cell Mapping Toolkit (cellmaps_pipeline)
        description: >-
          Series of pip-installable Python packages implementing the end-to-end
          cell mapping pipeline, including cellmaps_imagedownloader,
          cellmaps_ppidownloader, cellmaps_image_embedding,
          cellmaps_ppi_embedding, cellmaps_coembedding,
          cellmaps_generate_hierarchy, and cellmaps_hierarchyeval, with
          documentation hosted at https://cellmaps-pipeline.readthedocs.io/.
        url: https://github.com/idekerlab/cellmaps_pipeline
        license: BSD-3
      - id: https://github.com/eliorc/node2vec
        name: node2vec
        description: >-
          Python implementation of the node2vec algorithm used to embed each
          protein's interaction neighbourhood as a feature vector.
        url: https://github.com/eliorc/node2vec
      - id: https://github.com/fanzheng10/HiDeF
        name: HiDeF
        description: >-
          Hierarchical community Decoding Framework used for pan-resolution
          community detection, representing hierarchical relationships among
          protein communities as a directed acyclic graph.
        url: https://github.com/fanzheng10/HiDeF
  - name: ai_readiness_packaging
    description: >-
      FAIRSCAPE-based AI-readiness packaging performed by the Standards Module.
    preprocessing_details:
      - >-
        The client-side FAIRSCAPE-CLI package is called when a computation or
        coherent set of computations completes, and is passed metadata defining
        JSON-Schema descriptions for the datasets in the computational unit as
        well as its inputs, computations, software, models, and outputs. It
        creates an RO-Crate package containing the datasets, metadata, and
        software, or resolvable references to them, plus identifier stubs for
        each component.
      - >-
        RO-Crates are sent to the FAIRSCAPE server, where they are registered
        and assigned persistent, resolvable, globally unique identifiers using
        the ARK scheme, and are then decomposed into their individual datasets,
        models, and software, which are also registered and assigned
        identifiers.
      - >-
        The server computes end-to-end entailments on each RO-Crate's
        provenance as expressed in the EVI Evidence Graph Ontology and links
        them together where possible; identifiers resolve to human- and
        machine-readable landing pages carrying JSON-LD metadata drawn from
        Schema.org, EVI, and other public ontologies.
      - >-
        Data elements are mapped to public ontology vocabularies where
        appropriate using JSON-Schema mini-data-dictionary descriptions
        resolvable from the provenance graph metadata; the June 2026 release
        crate documents 20 schemas.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        description: >-
          Client-server AI-readiness framework, comprising the Python3
          FAIRSCAPE-CLI client and a Python3 server application, that packages
          data, software, metadata, and provenance graphs, assigns ARK
          persistent identifiers, and computes evidence-graph entailments. The
          June 2026 release RO-Crate records FAIRSCAPE version 1.1.3.
        url: https://fairscape.github.io
        license: MIT
        version: 1.1.3
  - name: integrative_structure_modelling
    description: >-
      Structural annotation and modelling of protein communities.
    preprocessing_details:
      - >-
        A bioinformatics pipeline annotates MuSIC communities with available
        structural information about community members and their interactions,
        drawn from the Protein Data Bank, the AlphaFold Protein Structure
        Database, crosslinking mass spectrometry, and predictions of disordered
        sequence segments; communities are then ranked by the amount of
        available structural information as a proxy for modelling feasibility.
      - >-
        Integrative structure modelling of top-ranked communities proceeds
        through four stages: gathering input information; representing subunits
        and translating data into spatial restraints; configurational sampling
        to produce an ensemble of models satisfying the restraints; and
        analysing and validating the input information and models.
    used_software:
      - id: https://integrativemodeling.org
        name: Integrative Modeling Platform (IMP)
        description: >-
          Open-source package for modelling macromolecular complexes, scripted
          through the Python Modeling Interface package.
        url: https://integrativemodeling.org
        version: '2.18'

cleaning_strategies:
  - name: quality_control
    description: >-
      Quality control applied to generated data.
    cleaning_details:
      - >-
        AP-MS experiments include an untagged parental control, ten chromatin
        modifier tagged cell lines, and a positive control tagged line per
        batch, with DMSO-treated samples serving as vehicle controls, and were
        performed in four biological replicates.
      - >-
        Single-cell CRISPR screen data were subjected to quality control before
        release, as described in the project's status reporting.
      - >-
        Antibody quality for immunofluorescence imaging is scored according to
        standard Human Protein Atlas procedures for image and antibody quality
        control.

labeling_strategies:
  - name: assembly_annotation
    description: >-
      How protein assemblies in cell maps are named and annotated.
    data_annotation_protocol:
      - >-
        Cell map assemblies are annotated in a two-pronged approach: first by
        alignment to known protein function and pathway resources including the
        Gene Ontology and Reactome to identify assemblies with high overlap
        with known cell biology, and second by a large language model approach
        that names sets of proteins and assigns a name confidence score.
      - >-
        In the associated U2OS cell map study, annotation jamborees were held
        in which approximately a dozen individuals worked in pairs to assign
        names and putative functional roles to assemblies on the basis of
        expert knowledge and literature curation, informed by large language
        model suggestions that were passed to a human curation team for final
        naming determination.
    labeling_details:
      - >-
        Released image data are labelled by target protein, cell line, and
        treatment condition; perturbation data are labelled by targeted gene.

raw_sources:
  - name: massive_repository
    description: >-
      MassIVE mass spectrometry repository holding the raw AP-MS and SEC-MS
