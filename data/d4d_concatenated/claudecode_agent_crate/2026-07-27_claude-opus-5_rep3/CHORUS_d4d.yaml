name: CHoRUS for Clinical Care AI Dataset
title: >-
  The Bridge2AI CHoRUS for Clinical Care AI Dataset: A Multi-Center,
  Multi-Modal, High-Resolution Critical Care Dataset
description: >-
  The Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care AI
  is a clinical data network developing a flagship multi-hospital, multimodal,
  high-resolution dataset under the NIH Common Fund Bridge2AI program, where it is one of
  four data generation projects. CHoRUS harmonizes electronic health record (EHR) data,
  imaging, high-resolution physiologic signals (including telemetry data and EEG where
  available), and tokenized note and report text (via the OHNLP toolkit, with raw text
  retained locally) across participating institutions using standardized data models and
  governance frameworks. The repository is designed to enable secure, auditable, and
  reproducible artificial intelligence research to improve recovery from acute illness.
  Data are curated within a NIST 800-53-aligned secure enclave architecture with
  role-based access controls, audit logging, and controlled-access governance review.
  CHoRUS supports AI model development, validation, benchmarking, and translational
  research while maintaining compliance with HIPAA and NIH data-sharing policies.
  The collaboration spans 20 academic centers, of which 14 contribute as data acquisition
  centers, with more than 60 consortium members. The project website reports a current
  released dataset of 50,000 patient admissions from ICU, PICU, and NICU, 1.6 billion rows
  of EHR OMOP data, 7,642 admissions with radiology data, and 23 TB of waveform data,
  against an anticipated final dataset of 100,000 patient admissions spanning 9 data
  modalities from 14 data-contributing hospitals. The version 1.0 Beta package documented
  here is an interim release with partial data: not all patients in the CHoRUS full cohort
  are included, and no DICOM images are included.
version: 1.0 Beta
status: >-
  Version 1.0 Beta interim release with partial data; the project period of the
  underlying NIH award runs to 2026-11-30.
