purposes:
  - id: d4d:purpose-ai-ready-critical-care-dataset
    name: Develop a publicly available, AI-ready critical care dataset
    response: >-
      The project's overarching goal is to develop a publicly available, AI-ready critical
      care dataset, while ensuring the methods promote privacy, accountability, and
      clinical benefit, and promoting a new generation of AI clinicians and scientists.
      The CHoRUS data generation project meets the need of generating data for ML/AI
      applications aimed at characterizing acute and critical care illness, predicting
      complications, and measuring treatment response among patients with acute or
      critical illness, addressing challenges relevant to acquiring an AI-ready data set
      from more than 100,000 critically ill patients through three pillars: Data
      (standards, tool development and optimization, and data acquisition), Ethics
      (ethical and trustworthy AI), and People (team science and skill and workforce
      development).
  - id: d4d:purpose-secure-reproducible-ai-research
    name: Enable secure, auditable, and reproducible AI research
    response: >-
      The repository is designed to enable secure, auditable, and reproducible artificial
      intelligence research to improve recovery from acute illness. CHoRUS supports AI
      model development, validation, benchmarking, and translational research while
      maintaining compliance with HIPAA and NIH data-sharing policies.
  - id: d4d:purpose-diverse-ethically-sourced-dataset
    name: Build the most diverse, high-resolution, ethically sourced AI-ready dataset
    response: >-
      The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
      ethically sourced, AI-ready data set to answer the grand challenge of improving
      recovery from acute illness. Patient-focused efforts determine the ethical and legal
      approaches to manage privacy and bias while accounting for Social Determinants of
      Health; unified standards harmonize multi-modal EHR, waveform, imaging, and text
      data; and federated access enables sampling methods to ensure a balanced and diverse
      cohort.

tasks:
  - id: d4d:task-characterize-predict-measure
    name: Characterize illness, predict complications, and measure treatment response
    response: >-
      Generating data for ML/AI applications aimed at characterizing acute and critical
      care illness, predicting complications, and measuring treatment response among
      patients with acute or critical illness.
  - id: d4d:task-external-validation-holdout
    name: External validation using a sequestered holdout test set
    response: >-
      The dataset provisions a holdout test set, accessible for model external validation
      to aid marketplace adoption of AI-developed models for implementation in acute and
      critical care.
  - id: d4d:task-label-prediction-targets
    name: Label data with targets important for prediction
    response: >-
      A visualization and annotation environment labels data with targets important for
      prediction, supported by validated semantic mappings and a clinical validation SOP.

addressing_gaps:
  - id: d4d:gap-critical-care-ai-infrastructure
    name: Lack of infrastructure for AI/ML in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and
      machine learning (AI/ML) in critical care. Developing high-resolution multi-center
      data sets is a critical first step towards actionable and trustworthy AI.
  - id: d4d:gap-legal-ethical-framework
    name: Absence of a legal and ethical framework for data collection at scale
    response: >-
      The project establishes a legal framework for collecting data at scale, performs
      community-facing ethics focus groups to determine what data is appropriate for
      public sharing, and ensures that data elements feature appropriate contextual
      factors such as geographic distance to the nearest hospital.
  - id: d4d:gap-multimodal-standardization
    name: Fragmented multi-modal clinical data standards
    response: >-
      The project develops capabilities across a multi-center network to acquire,
      standardize, tokenize, store, visualize, and label data such as structured
      electronic health record data, tokenized unstructured electronic health record data,
      telemetry and EEG waveforms, imaging, and social determinants of health, and
      standardizes data to the OMOP Common Data Model using approaches that limit
      re-identification.
  - id: d4d:gap-ai-workforce
    name: Shortage of AI-literate clinicians and scientists
    response: >-
      The project cultivates expertise in the lay and scientific community to improve AI
      literacy and utilization through multimodal educational approaches, developing the
      skills and workforce for a next generation of diverse academic and community AI
      scientists.

