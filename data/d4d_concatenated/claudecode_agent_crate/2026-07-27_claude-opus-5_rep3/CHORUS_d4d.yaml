third_party_sharing:
  - id: d4d:third-party-sharing-chorus
    name: Sharing beyond the originating institutions
    description: >-
      Access is granted to parties outside the contributing institutions through a
      controlled-access framework requiring institutional affiliation and credentials, an
      approved research proposal reviewed by the CHoRUS governance committee, a Data Use
      Agreement executed between the requestor institution and CHoRUS, IRB approval or
      exemption documentation as applicable, and compliance with NIH Bridge2AI Other
      Transaction terms and applicable federal regulations. Access is restricted to the
      secure enclave environment and no raw data export is permitted unless explicitly
      approved.
    is_shared: true

license_and_use_terms:
