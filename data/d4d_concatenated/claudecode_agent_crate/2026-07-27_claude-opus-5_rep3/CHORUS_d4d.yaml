    mitigation_strategy: >-
      Bias assessment is ongoing and documented in dataset release notes.

known_limitations:
  - id: d4d:limitation-observational-data
    name: Observational, non-randomized real-world data
    limitation_type: methodological_limitation
    limitation_description: >-
      Observational data, and not randomized; collected as real-world clinical data, not
      through prospective research interactions with patients.
  - id: d4d:limitation-documentation-quality
    name: Documentation quality dependent on clinical workflows
    limitation_type: methodological_limitation
    limitation_description: >-
      Documentation quality dependent on routine clinical workflows and data elements
      being collected in clinical practice.
  - id: d4d:limitation-variable-sampling-rates
    name: Variable waveform sampling rates
    limitation_type: resolution_limitation
    limitation_description: >-
      Variable sampling rates across real-world data from hospital waveform systems and
      middleware.
  - id: d4d:limitation-institutional-heterogeneity
    name: Institutional heterogeneity in coding and collection practices
    limitation_type: integration_limitation
    limitation_description: >-
      Institutional heterogeneity in coding and clinical data collection practices.
    recommended_mitigation: >-
      Unified standards harmonize multi-modal EHR, waveform, imaging, and text data, and
      validated semantic mappings connect clinical data in various source formats to
      international standards.
  - id: d4d:limitation-generalizability
    name: Limited generalizability beyond participating hospitals
    limitation_type: representativeness_limitation
    limitation_description: Limited generalizability beyond participating hospitals.
    scope_impact: >-
      Population inference beyond participating institutions is listed as a not
      recommended use.
  - id: d4d:limitation-not-for-reidentification
    name: Not appropriate for re-identification, contact tracing, or intervention
    limitation_type: scope_limitation
    limitation_description: >-
      Not appropriate for re-identification, contact tracing, or patient-level
      intervention.
  - id: d4d:limitation-holdout-and-overfitting
    name: Overfitting risk within development splits
    limitation_type: methodological_limitation
    limitation_description: >-
      Hold-out splits are available for testing; training and validation in development
      splits require internal mechanisms to avoid overfitting.
  - id: d4d:limitation-interim-release-coverage
    name: Partial coverage of the interim release
    limitation_type: coverage_limitation
    limitation_description: >-
      Interim release with partial data. Not all patients in the CHoRUS full cohort are
      included. No DICOM images are included.
    scope_impact: >-
      The current released dataset covers 50,000 patient admissions against an anticipated
      final dataset of 100,000 patient admissions; as of August 2025, EEG extraction was
      in process and imaging de-identification was in process for a larger cohort.

confidential_elements:
  - id: d4d:confidentiality-chorus
    name: Confidentiality of CHoRUS clinical data
    confidential_elements_present: true
    confidentiality_details:
      - Confidentiality level HL7:2V (very restricted).
      - CHoRUS operates within a secure enclave environment aligned with NIST 800-53
        controls, with role-based access controls, audit logging, and controlled-access
        governance review.
      - Access is restricted to the secure enclave environment; no raw data export is
        permitted unless explicitly approved.
      - Raw clinical note text is stored locally at contributing institutions rather than
        in the enclave; only tokens are stored centrally.
      - Data are controlled-access across every documented modality (demographics,
        medication administration, procedures, nursing flowsheets, diagnoses, clinical
        notes, imaging, waveform telemetry, and waveform EEG).

subpopulations:
  - id: d4d:subpopulation-critical-care
    name: Critical care subpopulations
    subpopulation_elements_present: true
    identification:
      - Intensive care unit (ICU), pediatric intensive care unit (PICU), and neonatal
        intensive care unit (NICU) admissions.
      - Demographics are captured as an OMOP-standardized, controlled-access data type.
      - Social determinants of health are collected as a data modality, and data elements
        feature contextual factors such as geographic distance to the nearest hospital.
    distribution:
      - Socioeconomic and demographic distribution reflective of participating
        institutions.
      - Data are drawn from 14 data contributing hospitals within a network of 20 academic
        centers.

sensitive_elements:
  - id: d4d:sensitive-elements-chorus
    name: Sensitive clinical data elements
    sensitive_elements_present: true
    sensitivity_details:
      - Data are derived from routine clinical care and comprise electronic health record
        content, imaging, high-resolution physiologic signals, and clinical note and
        report text.
      - De-identification consistent with HIPAA Safe Harbor is applied.
      - Removal or tokenization of direct identifiers.
      - Date shifting or limited date fields when required.
      - Role-based access control (RBAC).
      - Multi-factor authentication.
      - Full audit logging of data access and queries.
      - Prohibition of re-identification attempts.
      - Data export restrictions and output review procedures to reduce risk of
        re-identification.
      - Re-identification risk is periodically assessed and mitigation strategies updated
        as needed.

relationships:
  - id: d4d:relationships-chorus
    name: Internal structure of the CHoRUS RO-Crate package
    relationship_details:
      - The CHoRUS RO-Crate Package contains two sub RO-Crates, one for Electronic Health
        Records and one for Waveforms.
      - The package is part of the Bridge2AI organization record in the RO-Crate graph.
      - Multi-modal data are organized around patient admissions, so that structured EHR,
        tokenized notes, imaging, telemetry, and EEG content for the same admission are
        related through the OMOP Common Data Model.

splits:
  - id: d4d:splits-chorus
    name: Holdout and development splits
    split_details:
      - The dataset provisions a holdout test set, accessible for model external
        validation to aid marketplace adoption of AI-developed models for implementation
        in acute and critical care.
      - Hold-out splits are available for testing; training and validation in development
        splits require internal mechanisms to avoid overfitting.
      - Holdout datasets are sequestered for external validation.

acquisition_methods:
  - id: d4d:acquisition-clinical-care
    name: Acquisition from routine clinical care
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - Data are derived from routine clinical care at participating hospitals under IRB
        oversight, and are documented by providers and clinical staff rather than reported
        by patients.
      - Data are not collected solely for research but repurposed from clinical workflows
        under ethical oversight.
      - Derived content includes tokenized note representations produced with the OHNLP
        toolkit and harmonized OMOP, WFDB, and DICOM representations of source records.
      - Validated semantic mappings connect clinical data in various source formats to
        international standards, with a clinical validation SOP for contributing to
        mapping efforts and an internal validation and review process for SOP documents.

collection_mechanisms:
  - id: d4d:collection-mechanisms-chorus
    name: Multi-modal collection and harmonization mechanisms
    mechanism_details:
      - Electronic health record extraction and transformation to the OMOP common data
        model.
      - Imaging metadata de-identification using the RSNA Clinical Trial Processor and
        pixel-level de-identification using IbisWorks EICON.
      - High-resolution physiologic waveform capture, extraction, and transformation to
        the WFDB standard.
      - Standardized harmonization to a common data model.
      - Waveform telemetry is captured from bedside monitors and gateway/middleware
        systems, and waveform EEG from hospital databases in EDF+ and Persyst formats.
      - Clinical notes are extracted and tokenized using the OHNLP toolkit.
      - Data contributing sites create and upload a CHoRUS data extract using dedicated
        tooling, following an interactive SOP workflow with dynamic links to validated SOP
        documents.
      - Retrospective data collection with controlled access.

sampling_strategies:
  - id: d4d:sampling-strategy-chorus
    name: Multi-center convenience sampling with balancing goals
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - Routine clinical care records at 14 data contributing hospitals within a
        collaboration spanning 20 academic centers.
    why_not_representative:
      - Referral bias from tertiary/quaternary academic centers.
      - Socioeconomic and demographic distribution reflective of participating
        institutions.
      - Limited generalizability beyond participating hospitals.
    strategies:
      - Sampling to ensure comprehensive sets of patient conditions and clinical treatment
        strategies.
      - Federated access enables sampling methods to ensure a balanced and diverse cohort.

data_collectors:
  - id: d4d:data-collectors-chorus
    name: CHoRUS data acquisition sites and Data Pillar
    role: Data acquisition and curation
    collector_details:
      - Data site managers at the 14 data contributing sites extract and contribute
        clinical data following the Chorus_SOP workflow, with sub-teams for Standards,
        Data Acquisition, and Tooling.
      - Primary maintainers are the CHoRUS Data Pillar in collaboration with institutional
        data stewards.
      - Clinical collaborators contribute clinical expertise to semantic mapping and
        validation.
      - Data contributing sites provide regular status updates on their progress in
        creating and curating a CHoRUS-specific clinical data extract.

collection_timeframes:
  - id: d4d:collection-timeframe-chorus
    name: Retrospective collection timeframe
    timeframe_details:
      - Retrospective data collection from routine clinical care.
      - As of August 2025, the dataset covered 14 different hospitals with over 45,000
        unique admissions.
      - The RO-Crate package documented here is version 1.0 Beta with a publication date
        of 2026-04-03; the same record also states a release date of 03/04/2026 in an
        ambiguous format.
      - The underlying NIH award (project 1OT2OD032701-01) has a project start of
        2022-09-01 and a project end of 2026-11-30; this is the award period rather than a
        stated data collection window.

direct_collection:
  - id: d4d:direct-collection-chorus
    name: Repurposed clinical data rather than direct research collection
    is_direct: false
    collection_details:
      - Data are not collected solely for research but repurposed from clinical workflows
        under ethical oversight.
      - Observational data, and not randomized; collected as real-world clinical data, not
        through prospective research interactions with patients.

collection_consents:
  - id: d4d:collection-consent-chorus
    name: IRB approval or waiver for retrospective clinical data
    consent_details:
      - IRB approval or waiver as appropriate.
      - Human subject exemption recorded as HIPAA exemption 4 (45 CFR 46.104(d)(4)).
      - Community-facing ethics focus groups are performed to determine what data is
        appropriate for public sharing.

missing_data_documentation:
  - id: d4d:missing-data-chorus
    name: Missing data in the CHoRUS interim release
    missing_data_patterns:
      - Variable sampling rates across real-world data from hospital waveform systems and
        middleware.
      - Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
      - No DICOM images are included in the version 1.0 Beta release.
      - Not all patients in the CHoRUS full cohort are included in the version 1.0 Beta
        release.
      - As of August 2025, EEG extraction was in process and approximately 1,000 imaging
        studies were available with de-identification in process for a larger cohort.
      - Metadata for clinical notes, imaging, and waveform EEG were listed as planned in
        the September 2025 webinar.
    missing_data_causes:
      - Real-world clinical data capture, where documentation quality depends on routine
        clinical workflows and on which data elements are collected in clinical practice.
      - Heterogeneous hospital waveform systems and middleware.
      - Interim release status, with de-identification and extraction pipelines still in
        progress for the imaging and EEG modalities.
    handling_strategy: >-
      Known issues are documented in release notes accompanying versioned dataset
      releases, and bias assessment is ongoing and documented in dataset release notes.

raw_data_sources:
  - id: d4d:raw-source-ehr
    source_description: >-
      Electronic health record systems at the 14 data contributing hospitals within the
      20-center CHoRUS collaboration.
    source_type:
      - electronic health record
    raw_data_format:
      - OMOP Common Data Model
    access_details: >-
      Source records remain in institutional systems; standardized extracts are created
      and uploaded to the CHoRUS enclave following the Chorus_SOP workflow and are
      controlled-access.
  - id: d4d:raw-source-imaging
    source_description: Hospital picture archiving and communication systems (PACS).
    source_type:
      - medical imaging archive
    raw_data_format:
      - DICOM
    access_details: >-
      Controlled access with a published DICOM schema. Imaging metadata is de-identified
      using the RSNA Clinical Trial Processor and pixel-level de-identification uses
      IbisWorks EICON.
  - id: d4d:raw-source-telemetry
    source_description: >-
      Bedside physiologic monitors and gateway/middleware systems producing waveform
      telemetry.
    source_type:
      - physiologic monitoring system
    raw_data_format:
      - WFDB
    access_details: >-
      Controlled access using an extended PhysioNet schema.
  - id: d4d:raw-source-eeg
    source_description: Hospital electroencephalography databases.
    source_type:
      - clinical EEG database
    raw_data_format:
      - EDF+
      - Persyst
    access_details: >-
      Controlled access using open-source EDF+ and Persyst schemas.
  - id: d4d:raw-source-clinical-notes
    source_description: >-
      Unstructured clinical notes and reports documented by providers in the electronic
      health record.
    source_type:
      - clinical narrative text
    raw_data_format:
      - OHNLP tokenized representation
    access_details: >-
      Raw note text is stored locally at contributing institutions and is not distributed;
      only tokenized representations are held in the enclave under controlled access with
      the OHNLP open-source schema.

ethical_reviews:
  - id: d4d:ethical-review-mgb-irb
    name: Mass General Brigham Institutional Review Board review
    reviewing_organization: d4d:organization-mgb-irb
    contact_person: mailto:irbreliance@mgb.org
    review_details:
      - IRB protocol #2022P000707.
      - Reviewed by the Mass General Brigham Institutional Review Board (MGB IRB),
        399 Revolution Drive, Suite 710, Somerville, MA 02145, US, with an IRB Reliance
        and Compliance contact point (irbreliance@mgb.org, +1-857-282-1900).
      - Ethical review was conducted by Eric S. Rosenthal, Michael J. Young,
        Ishan Williams, Ashley Cordes, and Barbara J. Evans in collaboration with the
        Mass General Brigham IRB, with local context review by IRBs, HIPAA Privacy
        Officers, and institutional counsels at contributing medical centers.
      - Human subject exemption recorded as HIPAA exemption 4 (45 CFR 46.104(d)(4)).
  - id: d4d:ethical-review-community-engagement
    name: Community-facing ethics review and engagement
    review_details:
      - Community-facing ethics focus groups are performed to determine what data is
        appropriate for public sharing.
      - The CHoRUS consortium evaluates community perspectives on clinical care AI to find
        ways to increase trustworthiness of provenance and privacy in AI, and new
        approaches are created as the existing legal and regulatory landscape is analyzed.
      - Ethics is one of the three project pillars, alongside Data and People.

data_protection_impacts:
  - id: d4d:data-protection-impact-chorus
    name: Re-identification and disclosure risk management
    impact_details:
      - Re-identification risk is periodically assessed and mitigation strategies updated
        as needed.
      - Data export restrictions and output review procedures reduce the risk of
        re-identification.
      - Re-identification attempts are prohibited.
      - CHoRUS operates within a secure enclave environment aligned with NIST 800-53
        controls, with audit-level protection, registration, role-based access controls,
        and protection against data exfiltration.
      - Data are transformed using approaches that limit re-identification.
      - A privacy scan tool for medical records is maintained in the CHoRUS GitHub
        organization.

human_subject_research:
  id: d4d:human-subject-research-chorus
  name: Human subject research status
  involves_human_subjects: true
  irb_approval:
    - IRB protocol #2022P000707.
    - IRB approval or waiver as appropriate at contributing sites.
    - Human subject exemption recorded as HIPAA exemption 4 (45 CFR 46.104(d)(4)).
  ethics_review_board:
    - Mass General Brigham Institutional Review Board (MGB IRB).
    - Local context review by IRBs, HIPAA Privacy Officers, and institutional counsels at
      contributing medical centers.
  special_populations:
    - Critically ill patients, including pediatric intensive care (PICU) and neonatal
      intensive care (NICU) populations.
  regulatory_compliance:
    - HIPAA, including de-identification consistent with HIPAA Safe Harbor.
    - NIH data-sharing policies.
    - NIST 800-53 secure enclave controls.
    - Compliance with NIH Bridge2AI Other Transaction terms and applicable federal
      regulations.
    - The RO-Crate package records the dataset as FDA-regulated.

informed_consent:
  - id: d4d:informed-consent-chorus
    name: Consent basis for retrospective clinical data
    consent_type:
      - IRB approval or waiver as appropriate for retrospective use of clinical data.
    consent_documentation:
      - Human subject exemption recorded as HIPAA exemption 4 (45 CFR 46.104(d)(4)).
    consent_scope:
      - Data are not collected solely for research but repurposed from clinical workflows
        under ethical oversight.
      - Community-facing ethics focus groups determine what data is appropriate for public
        sharing.

at_risk_populations:
  id: d4d:at-risk-populations-chorus
  name: At-risk populations in the CHoRUS cohort
  description: >-
    The cohort consists of critically ill patients, including pediatric intensive care
    (PICU) and neonatal intensive care (NICU) populations.
  at_risk_groups_included: true
  special_protections:
    - Layered privacy protection including de-identification, a data use agreement, and a
      controlled access data repository adhering to NIST 800-53 principles, with
      audit-level protection, registration, role-based access controls, and protection
      against data exfiltration.
    - Confidentiality level HL7:2V (very restricted).
    - Compliance with CHoRUS governance.

participant_privacy:
  - id: d4d:participant-privacy-chorus
    name: Participant privacy protections
    anonymization_method:
      - De-identification consistent with HIPAA Safe Harbor.
      - Removal or tokenization of direct identifiers.
      - Date shifting or limited date fields when required.
      - Imaging metadata de-identification using the RSNA Clinical Trial Processor and
        pixel-level de-identification using IbisWorks EICON.
      - Clinical notes are tokenized using the OHNLP toolkit, with raw text retained
        locally.
    reidentification_risk:
      - Re-identification risk is periodically assessed and mitigation strategies updated
        as needed.
      - Prohibition of re-identification attempts.
      - Data export restrictions and output review procedures to reduce risk of
        re-identification.
    privacy_techniques:
      - Secure enclave environment aligned with NIST 800-53 controls.
      - Role-based access control (RBAC).
      - Multi-factor authentication.
      - Full audit logging of data access and queries.
      - Protection against data exfiltration.
    data_linkage:
      - Data elements feature appropriate contextual factors such as geographic distance
        to the nearest hospital.
      - OMOP Location entities are geocoded via DeGauss in the UF-Geocoding tooling.
      - Social determinants of health are incorporated as a data modality.

preprocessing_strategies:
  - id: d4d:preprocessing-harmonization
    name: Standardization and harmonization to common data models
    preprocessing_details:
      - Electronic health record extraction and transformation to the OMOP common data
        model.
      - High-resolution physiologic waveform capture, extraction, and transformation to
        the WFDB standard.
      - Standardized harmonization to a common data model across contributing sites.
      - Clinical notes are extracted and tokenized using the OHNLP toolkit.
      - Validated semantic mappings connect clinical data in various source formats to
        international standards.
      - Data are transformed using approaches that limit re-identification.
    used_software:
      - id: d4d:software-ohnlp-toolkit
        name: OHNLP toolkit
        description: >-
          Toolkit used to extract and tokenize clinical notes, distributed with an
          open-source schema.
      - id: d4d:software-ohdsi-omop
        name: OHDSI/OMOP common data model tooling
        description: >-
          The OHDSI tool stack and OMOP common data model used for standardizing
          structured electronic health record data.
  - id: d4d:preprocessing-deidentification
    name: De-identification preprocessing
    preprocessing_details:
      - Imaging metadata de-identification using the RSNA Clinical Trial Processor.
      - Pixel-level de-identification of imaging using IbisWorks EICON.
      - Removal or tokenization of direct identifiers, with date shifting or limited date
        fields when required.
    used_software:
      - id: d4d:software-rsna-ctp
        name: RSNA Clinical Trial Processor
        description: Used for imaging metadata de-identification.
      - id: d4d:software-ibisworks-eicon
        name: IbisWorks EICON
        description: Used for pixel-level de-identification of imaging.

cleaning_strategies:
  - id: d4d:cleaning-site-characterization
    name: Site characterization and privacy scanning
    cleaning_details:
      - Characterization reports are produced and returned to sites following their data
        submissions.
      - Medical records are scanned for privacy issues using the CHoRUS privacy scan tool.
      - Standard operating protocols instruct data contributing sites about best practices
        for curating and delivering interoperable datasets, and SOP documents undergo an
        internal validation and review process.
    used_software:
      - id: d4d:software-chorus-reports-cleaning
        name: CHoRUSReports
        description: >-
          Produces characterization reports returned to sites following their data
          submissions.
      - id: d4d:software-privacy-scan-tool-cleaning
        name: privacy_scan_tool
        description: A privacy scan tool for medical records.

labeling_strategies:
  - id: d4d:labeling-strategy-chorus
    name: Annotation and semantic mapping
    data_annotation_platform:
      - A visualization and annotation environment developed within the project.
    data_annotation_protocol:
      - Clinical validation SOP for contributing to mapping efforts, maintained alongside
        the pooled tabular mappings in the chorus-mapping repository.
    labeling_details:
      - A visualization and annotation environment labels data with targets important for
        prediction.
      - Data are acquired, standardized, transformed using approaches that limit
        re-identification, and labeled as part of the data pillar.
      - Clinical expertise is applied to semantic mapping and validation within CHoRUS.
      - Differential care pathways affect label assignment (e.g., ICU vs non-ICU
        populations).

raw_sources:
  - id: d4d:raw-sources-chorus
    name: Availability of source data
    access_url: https://chorus4ai.org/dataset/
    raw_data_details:
      - Raw clinical note text is retained locally at contributing institutions and is not
        distributed; only tokenized representations are stored in the enclave.
      - Source EHR, imaging, waveform, and EEG records remain in institutional systems,
        with standardized extracts delivered to the CHoRUS secure enclave.
      - No raw data export from the enclave is permitted unless explicitly approved.

machine_annotation_tools:
  - id: d4d:machine-annotation-tools-chorus
    name: Automated processing and annotation tools
    tools:
      - OHNLP toolkit
      - RSNA Clinical Trial Processor
      - IbisWorks EICON
      - DeGauss (via UF-Geocoding)
    tool_descriptions:
      - The OHNLP toolkit extracts and tokenizes clinical notes and reports.
      - The RSNA Clinical Trial Processor performs imaging metadata de-identification.
      - IbisWorks EICON performs pixel-level de-identification of imaging.
      - DeGauss, wrapped by the UF-Geocoding repository, geocodes OMOP Location entities.

existing_uses:
  - id: d4d:existing-uses-chorus
    name: Current uses of the dataset
    examples:
      - Datasets are being used for training activities and publications, as reported in
        the September 2025 AIM-AHEAD Bridge2AI for Clinical Care informational webinar.
      - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
        Bridge2AI CHoRUS data through engagement, AI training, and mentorship, equipping
        trainees to apply AI/ML methods to big data analysis using multi-modal datasets
        from a broad range of cohort participants.
      - Trainees develop and present use cases suitable to apply in Bridge2AI Data Topics
        and participate in collaborative research on the Bridge2AI Clinical Care Cloud
        platform.

use_repository:
  - id: d4d:use-repository-chorus-github
    name: CHoRUS GitHub organization
    repository_url: https://github.com/chorus-ai
    repository_details:
      - The chorus-ai GitHub organization houses 28 active repositories with software and
        tooling, validated semantic mappings, standard operating protocols, and project
        management overviews.
      - A package status page reports versions, maintainers, and other metadata about
        CHoRUS packages, and documentation for both contributors and users is compiled in
        the chorus-developer repository.
      - Issues encountered in creating or submitting a data extract can be posted in the
        Standards Discussions or Data Acquisition Discussions areas.

other_tasks:
  - id: d4d:other-tasks-chorus
    name: Additional supported activities
    task_details:
      - Workforce development and AI literacy training, including canonical Jupyter
        notebooks for AI/ML in clinical care, workshops on the OHDSI tool stack and the
        OHDSI/OMOP common data model, and didactics on generative AI and specific use
        cases.
      - External validation of AI models developed elsewhere, using the sequestered
        holdout test set to aid marketplace adoption of AI-developed models.
      - Development of best practices for AI in health, including tools and standards
        created around ethically sourced datasets.

future_use_impacts:
  - id: d4d:future-use-impacts-chorus
    name: Factors affecting future use
    impact_details:
      - Institutional heterogeneity in coding and clinical data collection practices, and
        temporal trends related to evolving clinical practice, may affect the future
        validity of models built on this dataset.
      - The deprecation policy includes advance notice of schema changes, a backward
        compatibility window where feasible, and archival of prior versions within the
        enclave where possible or incremental change records.
      - Population inference beyond participating institutions is not supported.
      - Bias assessment is ongoing and documented in dataset release notes.

discouraged_uses:
  - id: d4d:discouraged-uses-chorus
    name: Not recommended uses
    discouragement_details:
      - Direct translation of trained algorithms to real-time clinical deployment without
        validation or regulatory clearance.
      - Use as sole evidence for clinical decision-making.
      - Population inference beyond participating institutions.

intended_uses:
  - id: d4d:intended-uses-chorus
    name: Intended use cases
    examples:
      - AI model training within the enclave.
      - Model validation and benchmarking.
      - Algorithm development and feature engineering.
      - Retrospective hypothesis testing.
      - Fine-tuning of multimodal models.
      - Comparative effectiveness research.
      - Reinforcement learning and development of expert AI.
      - Methodological research in trustworthy AI.
      - Trial emulation or powering.
    usage_notes: >-
      Usage must align with approved research scope and governance policies.
    use_category:
      - AI/ML model development and validation
      - Clinical and translational research
      - Benchmarking and external validation
      - Education and workforce training

prohibited_uses:
  - id: d4d:prohibited-uses-chorus
    name: Prohibited uses
    prohibition_reason:
      - Re-identification attempts are prohibited.
      - The dataset is not appropriate for re-identification, contact tracing, or
        patient-level intervention.
      - Access is restricted to the secure enclave environment; no raw data export is
        permitted unless explicitly approved.
      - Data use may not be for commercial purposes unless specifically authorized through
        a separate agreement consistent with governing award and consortium terms.

distribution_formats:
  - id: d4d:distribution-format-omop
    name: OMOP Common Data Model structured EHR data
    description: >-
      Demographics, medication administration, procedures, nursing flowsheets, and
      diagnoses standardized to the OMOP Common Data Model, controlled access, with a
      published OMOP schema (in some cases with extensions). The AI-readiness assessment
      reports text/tab-separated-values among the package formats.
    access_urls:
      - https://chorus4ai.org/dataset/
  - id: d4d:distribution-format-wfdb
    name: WFDB waveform telemetry
    description: >-
      Waveform telemetry from bedside monitors and gateway/middleware, controlled access,
      with an extended PhysioNet schema. The AI-readiness assessment reports wfdb among
      the package formats.
    access_urls:
      - https://chorus4ai.org/dataset/
  - id: d4d:distribution-format-eeg
    name: EDF+ and Persyst waveform EEG
    description: >-
      Waveform EEG extracted from hospital databases, controlled access, with open-source
      EDF+ and Persyst schemas; metadata was listed as planned as of September 2025.
  - id: d4d:distribution-format-dicom
    name: DICOM imaging
    description: >-
      Imaging from PACS in DICOM format, controlled access, with a published DICOM schema;
      metadata was listed as planned as of September 2025 and the version 1.0 Beta release
      states that no DICOM images are included.
  - id: d4d:distribution-format-ohnlp
    name: OHNLP tokenized clinical notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit, controlled access,
      with the OHNLP open-source schema; raw text remains local to contributing sites.
  - id: d4d:distribution-format-rocrate
    name: RO-Crate metadata package
    description: >-
      Machine-readable JSON-LD RO-Crate metadata conforming to RO-Crate 1.2 with EVI
      typing and Croissant RAI properties, describing the package and its EHR and
      Waveforms sub-crates. The AI-readiness assessment also reports .ipynb among the
      package formats.

