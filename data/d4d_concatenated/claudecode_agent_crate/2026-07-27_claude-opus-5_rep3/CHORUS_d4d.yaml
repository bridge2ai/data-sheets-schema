instances:
  - id: d4d:instance-patient-admissions
    name: Patient admissions
    instance_type: patient admission
    counts: 50000
    description: >-
      The CHoRUS project website reports a current released dataset of 50,000 patient
      admissions from ICU, PICU, and NICU. The September 2025 training webinar states that
      as of August 2025 the dataset covered 14 different hospitals with over 45,000 unique
      admissions. The anticipated final dataset is 100,000 patient admissions across
      9 different data modalities from 14 data contributing hospitals; the NIH award
      abstract describes acquiring an AI-ready data set from more than 100,000 critically
      ill patients.
  - id: d4d:instance-ehr-omop-rows
    name: EHR rows in the OMOP Common Data Model
    instance_type: electronic health record row (OMOP CDM)
    counts: 1600000000
    description: >-
      1.6 billion rows of EHR OMOP data in the current released dataset. OMOP-standardized
      content includes demographics, medication administration (dosing time-stamped upon
      each infusion change or dose administration), procedures documented by providers,
      nursing flowsheets (high-frequency documentation), and diagnoses documented by
      providers; all are controlled-access with published OMOP schema metadata, in some
      cases with extensions.
  - id: d4d:instance-radiology-admissions
    name: Admissions with radiology data
    instance_type: admission with radiology data
    counts: 7642
    description: >-
      7,642 admissions with radiology data in the current released dataset. Imaging is
      drawn from hospital PACS in DICOM format under controlled access, with a published
      DICOM schema; imaging metadata was still planned at the time of the September 2025
      webinar, which reported approximately 1,000 images available with de-identification
      in process for a larger cohort. The version 1.0 Beta RO-Crate release states that no
      DICOM images are included in that release.
  - id: d4d:instance-waveform-data
    name: Physiologic waveform recordings
    instance_type: physiologic waveform recording
    description: >-
      23 TB of waveform data in the current released dataset. Waveform telemetry is
      captured from bedside monitors and gateway/middleware and distributed in the WFDB
      format under controlled access using an extended PhysioNet schema; waveform EEG is
      drawn from hospital databases in EDF+ and Persyst formats under controlled access
      using open-source EDF+ and Persyst schemas, with metadata planned. The September
      2025 webinar reported that EEG extraction was in process at that point. The version
      1.0 Beta Waveforms sub RO-Crate is 1,201,567,472,832 bytes.
  - id: d4d:instance-clinical-notes
    name: Tokenized clinical notes
    instance_type: clinical note
    description: >-
      Clinical notes are extracted and tokenized using the OHNLP toolkit and distributed
      under controlled access with the OHNLP open-source schema; note metadata was
      planned at the time of the September 2025 webinar. Raw clinical note text is stored
      locally at contributing institutions and only tokens are held in the enclave.
  - id: d4d:instance-crate-files
    name: Files in the CHoRUS RO-Crate package
    instance_type: file
    counts: 1477
    description: >-
      The AI-readiness self-assessment for the CHoRUS RO-Crate Package reports that 99%
      of files have checksums (1,469 of 1,477), that 1,468 datasets are documented,
      that 2 computation/experiment steps and 1 software instance are documented, and that
      44 schemas are documented. Reported formats are .ipynb,
      text/tab-separated-values, and wfdb.

anomalies:
  - id: d4d:anomaly-variable-sampling-rates
    name: Variable waveform sampling rates and interim-release gaps
    anomaly_details:
      - Variable sampling rates across real-world data from hospital waveform systems and
        middleware.
      - Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
      - Interim release with partial data. Not all patients in the CHoRUS full cohort are
        included. No DICOM images are included.

