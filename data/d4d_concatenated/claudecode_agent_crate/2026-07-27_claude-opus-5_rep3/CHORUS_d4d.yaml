updates:
  id: d4d:update-plan-chorus
  name: Data release and maintenance plan
  frequency: >-
    Versioned dataset releases (for example, CHoRUS vX.Y); no fixed calendar schedule is
    stated.
  update_details:
    - Versioned dataset releases, e.g. CHoRUS vX.Y.
    - Release notes documenting schema changes, harmonization updates, and known issues.
    - Governance committee oversight for structural modifications.
    - Data upload.
    - Deprecation policy includes advance notice of schema changes, a backward
      compatibility window where feasible, and archival of prior versions within the
      enclave where possible or incremental change records.
    - Primary maintainers are the CHoRUS Data Pillar in collaboration with institutional
      data stewards.

retention_limit:
  id: d4d:retention-limits-chorus
  name: Retention of prior versions
  retention_details:
    - Prior versions are archived within the enclave where possible, or represented by
      incremental change records.

version_access:
  id: d4d:version-access-chorus
  name: Version access
  latest_version_doi: https://doi.org/10.18130/V3/XNBOPG
  versions_available:
    - 1.0 Beta (date published 2026-04-03)
  version_details:
    - Versioned dataset releases follow a CHoRUS vX.Y scheme.
    - Version 1.0 Beta is an interim release with partial data; not all patients in the
      CHoRUS full cohort are included and no DICOM images are included.
    - Prior versions are archived within the enclave where possible, or represented by
      incremental change records.

extension_mechanism:
  id: d4d:extension-mechanism-chorus
  name: Contribution and extension mechanisms
  contribution_url: https://github.com/chorus-ai
  extension_details:
    - Clinical collaborators can contribute to semantic mapping and validation through the
      chorus-mapping repository, which holds documentation and pooled tabular mappings
      together with an associated clinical validation SOP.
    - Data contributing sites submit regular status updates either through the GitHub
      interface directly or by submitting a Google Form, which triggers a script that
      calls the GitHub API to update status and issue information.
    - Issues in the creation or submission of a data extract can be posted in the
      Standards Discussions or Data Acquisition Discussions areas.
    - Requests for access or involvement in downstream analytics are directed to
      dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.

is_deidentified:
  id: d4d:deidentification-chorus
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    De-identification consistent with HIPAA Safe Harbor, with removal or tokenization of
    direct identifiers and date shifting or limited date fields when required.
  identifiers_removed:
    - Direct identifiers, removed or tokenized.
    - Dates, shifted or limited when required.
    - Imaging metadata identifiers, removed using the RSNA Clinical Trial Processor.
    - Identifying pixel content in imaging, removed by pixel-level de-identification using
      IbisWorks EICON.
  deidentification_details:
    - The RO-Crate package records the dataset as de-identified.
    - Raw clinical note text remains at contributing sites; only tokenized representations
      are stored in the enclave.
    - Data are transformed using approaches that limit re-identification.
    - Re-identification risk is periodically assessed and mitigation strategies updated as
      needed.

