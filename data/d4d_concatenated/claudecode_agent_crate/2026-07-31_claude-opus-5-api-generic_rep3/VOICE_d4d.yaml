instances:
  - description: >-
      Each instance in the phenotype tables represents a person - an enrolled
      adult research participant. Version 3.1.0 contains 833 participants; the
      initial v1.0 release contained 306 participants and 12,523 recordings.
  - description: >-
      Each row of the feature tables represents a single audio recording of one
      participant performing one acoustic task within one session, keyed by
      participant_id, session_id and task_name. Counts of recordings per feature
      type in v3.1.0 range from 28,640 (sparc EMA) to 32,522 (torchaudio pitch);
      spectrogram, mel spectrogram and MFCC tables each contain 29,278
      recordings.
  - description: >-
      Most participants completed all data collection in a single session, but a
      subset required multiple sessions, so a participant may be associated with
      more than one session and may give differing responses across visits.
  - description: >-
      Data modalities per participant are audio recordings (released as derived
      acoustic, prosodic, articulatory and phonetic features) and questionnaire
      responses, together with clinician-recorded diagnostic and gold-standard
      validation fields.

subsets:
  - id: https://doi.org/10.13026/8xbn-nq66#cohort-voice-disorders
    description: >-
      Voice disorders cohort, covering laryngeal cancer, laryngitis, precancerous
      lesions (keratosis, leukoplakia, erythroplakia), benign vocal fold lesions,
      muscle tension dysphonia, laryngeal dystonia/spasmodic dysphonia and vocal
      tremor, unilateral vocal fold paralysis, and glottic
      insufficiency/presbyphonia. Gold-standard validation is by laryngoscopy and
      stroboscopy images and, where relevant, biopsy pathology and CT imaging.
  - id: https://doi.org/10.13026/8xbn-nq66#cohort-respiratory
    description: >-
      Respiratory disorders cohort, covering airway stenosis (including bilateral
      vocal fold paralysis and supraglottic, glottic, subglottic, tracheal and
      multi-level stenosis), unexplained chronic cough, and COPD/asthma. Gold
      standards include spirometry with flow-volume loops and CT of neck and
      chest.
  - id: https://doi.org/10.13026/8xbn-nq66#cohort-neurological
    description: >-
      Neurological and neurodegenerative disorders cohort, covering mild
      cognitive impairment, Alzheimer's disease, other dementias, amyotrophic
      lateral sclerosis and Parkinson's disease and atypical parkinsonism. Gold
      standards include brain CT and MRI, serum p-tau biomarkers and whole genome
      sequencing (genomic data collected only at Canadian sites under a separate
      research ethics protocol and not included in this release).
  - id: https://doi.org/10.13026/8xbn-nq66#cohort-mood-psychiatric
    description: >-
      Mood and psychiatric disorders cohort, covering depression/major depressive
      disorder, anxiety disorder, bipolar disorder, and comorbid conditions
      including ADHD, autism spectrum disorder, PTSD, OCD, panic disorder,
      schizophrenia, eating disorders, borderline personality disorder, insomnia
      and alcohol or substance use disorder. Gold standards are the electronic
      health summary, a psychiatrist's clinical diagnosis and medication history.
  - id: https://doi.org/10.13026/8xbn-nq66#cohort-controls
    description: >-
      Control participants without the studied conditions, recruited to serve as
      comparators in the database.
  - id: https://doi.org/10.13026/8xbn-nq66#partition-features
    description: >-
      Derived audio feature partition, distributed under features/ as Parquet
      tensors (ppgs, sparc EMA, sparc loudness, sparc periodicity, sparc pitch,
      torchaudio spectrogram, mel spectrogram, MFCC and pitch) plus tab-delimited
      static_features.tsv and audio_quality_metrics.tsv with accompanying JSON
      data dictionaries.
  - id: https://doi.org/10.13026/8xbn-nq66#partition-phenotype
    description: >-
      Phenotype partition, distributed under phenotype/ as TSV tables with JSON
      data dictionaries, organised into confounders, demographics, diagnosis,
      enrollment, questionnaire and task subfolders.

splits:
  - description: >-
      No predefined or recommended train, validation or test splits are provided
      with the dataset. Researchers are expected to create their own data splits
      based on their specific requirements, and are advised to consider the
      multivariate distribution across disorder category, site and demographic
      factors when doing so.

relationships:
  - description: >-
      Instances are related hierarchically through identifiers: participant_id
      links to one or more session_id values, each session links to acoustic
      tasks (acoustic_task_id) and to individual recordings (recording_id), and
      feature rows are keyed by participant_id, session_id and task_name.
  - description: >-
      The project's own healthsheet states that relationships between individual
      participants are not made explicit and that participants are unrelated to
      one another; there is no clinical-trial arm structure or family/social
      linkage encoded in the data.

subpopulations:
  - description: >-
      The dataset identifies demographic sub-populations by age, gender, sex,
      ethnicity/race and socioeconomic status, collected through a detailed
      demographics instrument.
  - description: >-
      Eligibility for the adult dataset is a minimum age of 18 years and a
      maximum of 120 years; all sexes are eligible and healthy volunteers are
      accepted. Certain neurological cohorts additionally required participants
      to be over 44 and under 85 years of age.
  - description: >-
      The dataset is skewed by disorder category, collection site and other
      demographic factors, and public releases do not contain an equal
      distribution of the five disease categories.
  - description: >-
      Participants who are less proximal to the collection sites, or who have
      less trust in the medical system or in AI, were less likely to be
      recruited, so those groups are expected to be under-represented.
  - description: >-
      The pediatric cohort (ages 2-18, 300 participants, recruited at the
      Hospital for Sick Children) is distributed as a separate PhysioNet dataset
      rather than as a subpopulation of this adult dataset.

anomalies:
  - description: >-
      Different collection sites used different collection configurations,
      including distinct iPad devices at each site; recordings were made with a
      head-mounted headset and microphone whose distance from the mouth could
      vary between participants.
  - description: >-
      The data collection protocol changed over the course of the study, so
      instruments, tasks and available fields are not uniform across the whole
      participant set.
  - description: >-
      Sources of noise include background/room noise artifacts, variation in
      diagnostic practices between sites and clinicians, inaccurate questionnaire
      responses and participant underreporting.
  - description: >-
      Some audio files could not yield certain derived features, whether because
      of recording length or other processing issues, so those recordings are
      absent from the corresponding Parquet tables; counts therefore differ
      between feature types.
  - description: >-
      Spectrograms, mel spectrograms, MFCCs, phonetic posteriorgrams and EMA
      estimates for records flagged as sensitive, and for audio-check
      recordings, were removed from the release, producing systematic gaps
      relative to the recording inventory.
  - description: >-
      Version 3.0.0 shipped broken Parquet files that were repaired in version
      3.1.0; version 2.0.0 reprocessed spectrograms to fix minor issues
      identified in the earlier release.

confidential_elements:
  - description: >-
      The project's healthsheet states that the released dataset does not contain
      data considered confidential in the sense of legal privilege or
      doctor-patient confidentiality, because identifiable and sensitive elements
      were removed prior to release.
  - description: >-
      Raw voice recordings are withheld from the registered-access release and
      are treated as requiring controlled access, because a voice waveform is a
      biometric identifier that carries re-identification risk and potential for
      illicit or unauthorized use. A published memorandum sets out the ethical
      justification for controlled access to raw voice data samples.
  - description: >-
      Under the Data Transfer and Use Agreement the transferred data are treated
      as Personally Identifiable Information within the meaning of OMB
      Memorandum M-07-16 and are covered by an NIH Certificate of
      Confidentiality, which must be asserted against compulsory legal demands
      such as court orders and subpoenas.

sensitive_elements:
  - description: >-
      Health data, including clinician-assigned diagnoses across voice,
      neurological, psychiatric/mood and respiratory conditions, symptom severity
      scores from validated instruments, medication histories and surgical
      histories.
  - description: >-
      Racial and ethnic origin information is collected and retained in coarsened
      form in the demographics instrument.
  - description: >-
      Sexual orientation information is collected as part of the demographics
      instrument.
  - description: >-
      Socioeconomic information is collected; non-identifying but highly
      sensitive elements such as household income, mental health status and
      traumatic life experiences were removed from the release.
  - description: >-
      Biometric data - the human voice itself is a biometric identifier and
      raw waveforms carry re-identification risk; all raw audio was removed from
      the feature-only release.
  - description: >-
      Free-text and narrative content, including transcripts of free-speech
      tasks, was removed because it cannot be guaranteed free of identifying or
      sensitive disclosures.
  - description: >-
      Fields encoded as sensitive in the Bridge2AI REDCap data dictionary (column
      "Identifier?") were removed from the dataset at the de-identification
      stage.

content_warnings:
  - description: >-
      Questionnaire instruments and diagnostic forms include items on suicidal
      ideation and self-harm (PHQ-9, DSM-5 Adult), traumatic stress (PTSD Adult),
      depression, anxiety, substance use and eating disorders; encountering this
      content may be distressing.
  - description: >-
      The project notes that free-speech tasks are participant-generated, so
      although unlikely, offensive or upsetting language cannot be completely
      ruled out; transcripts of free-speech audio were therefore removed from the
      public release, and spectrogram-family features for free-speech recordings
      were also withheld.
  - description: >-
      IRB documentation notes that answering questions in the mood, depression
      and anxiety instruments can cause discomfort and may trigger negative
      emotions in participants.

acquisition_methods:
  - description: >-
      Data were both directly observed and self-reported. Acoustic data were
      directly recorded from participants performing standardized tasks;
      demographic, confounder, medical-history and patient-reported outcome data
      were reported by the participants themselves through the application.
  - description: >-
      Clinical diagnoses were verified by clinicians, who reviewed audio and/or
      imaging data, consulted electronic health records, or relied on active
      medication prescriptions; for the psychiatric cohort the assessment was
      determined from the participant's EHR record or an active prescription
      outside the data collection session.
  - description: >-
      A subset of the released variables is machine-derived rather than observed:
      acoustic, prosodic, articulatory and phonetic features and automatic
      transcriptions were computed from the raw waveforms by software.

collection_mechanisms:
  - description: >-
      A custom Bridge2AI-Voice smartphone/tablet application hosting the data
      acquisition protocols, used in clinic on a study iPad to collect acoustic
      tasks, demographic and confounder surveys, validated questionnaires and
      patient-reported outcomes.
  - description: >-
      Recording hardware consisted of iPads (9th or 10th generation) and iPad Air
      (5th generation) with an Avid AE-36 head-mounted microphone connected via
      an Apple dongle; participants were instructed to wear the headset with
      microphone for tasks involving voice recording, per Bridge2AI-Voice
      suggested standards.
  - description: >-
      A REDCap database held the instruments, data dictionary and clinical case
      report data; the REDCap data dictionary, metadata and instrument PDFs are
      published openly at https://github.com/eipm/bridge2ai-redcap and archived
      on Zenodo.
  - description: >-
      Two remote client applications were used in addition to in-clinic
      collection - the Bridge2AI Voice Web app (browser-based, no install, no
      login) and the Bridge2AI Voice iOS app - both HIPAA-compliant, storing data
      only during the collection phase and transmitting over HTTPS to a
      HIPAA-compliant NIH STRIDES cloud storage server (Amazon, Google or
      Microsoft). Remote data collection did not contribute to the initial
      dataset release.
  - description: >-
      Multimodal clinical data (imaging, laryngoscopy, EHR extracts) were
      retrieved at each site independently and uploaded through the REDCap
      database; no such external data are included in the v3.x releases.

collection_timeframes:
  - description: >-
      The Bridge2AI-Voice project period runs from 2022-09-01 to 2026-11-30. Data
      collection for the adult flagship cohort began after project launch in 2023
      and is ongoing at five North American sites. The source documents state
      different enrollment targets for the project (see human_subject_research);
      the RO-Crate evidence gives an anticipated enrollment of approximately
      3,000 participants by November 2026.
  - description: >-
      The project's healthsheet reports that the data were collected over a
      period of 12 months; the RO-Crate evidence describes the participants and
      recordings included in version 3.0.0 as collected roughly between 2023 and
      2025.
  - description: >-
      The mobile-application feasibility study that preceded broad data
      collection was conducted at the University of South Florida Health Voice
      Center between 2023-06-05 and 2023-07-28.
  - description: >-
      The IRB protocol describes a phased acquisition plan over four years -
      exploratory (completed November 2023), pilot (begun November 2023),
      expansion and outreach - with longitudinal collection permitted at 1-6
      month intervals for progressive or degenerative disease cohorts.

data_collectors:
  - description: >-
      Site research teams, which may include medical, graduate or undergraduate
      students, coordinated recruitment and administered the collection protocol
      with the assistance of a trained research assistant.
  - description: >-
      Clinicians and physicians at each site identified appropriate participants
      and provided the gold-standard diagnostic assessment; they were listed
      under the IRB as co-investigators and added to the consortium so that their
      names appear on consortium-level publications arising from the research.
  - description: >-
      Hospital staff were not involved in scheduling but assisted with the
      logistics of coordinating data collection.

direct_collection:
  - description: >-
      Acoustic and survey data were collected directly from the individuals
      concerned, in person at participating clinics, rather than obtained via
      third parties.
  - description: >-
      Clinical validation information was obtained indirectly, from electronic
      health record platforms and medication prescriptions, with participant
      consent permitting investigators to access medical information for
      gold-standard validation of diagnoses and symptoms.
  - description: >-
      Data were collected in the USA and Canada.

sampling_strategies:
  - description: >-
      Non-probability sampling. Participants were recruited from "high volume
      expert clinics" and screened against cohort-specific inclusion and
      exclusion criteria before their visit. The source documents define this
      term inconsistently: the project documentation describes outpatient clinics
      within hospital systems or academic institutions with expertise in a
      specific disease area seeing more than 50 patients per month from the same
      disease category, whereas the IRB protocol defines high volume expert
      clinics as clinics or programs within academic institutions with
      multidisciplinary programs targeted to the diseases studied and a volume of
      over 1,000 patients per year.
  - description: >-
      Selection was organised around five predetermined disease categories
      (voice, respiratory, neurological/neurodegenerative, mood/psychiatric and
      pediatric) plus control participants who do not have the conditions of
      interest.
  - description: >-
      Inclusion required being at least 18 years old (for the adult cohort) and
      being able to speak and read English; exclusion criteria included inability
      to provide informed consent in English, and having had a surgical
      intervention significantly altering the symptoms of the disease studied.
      Spanish-language protocols are under development but are not represented in
      version 3.x.
  - description: >-
      The released data are a sample of a larger, ongoing collection. The sample
      is not representative because it was collected at a limited number of
      geographic locations; the consortium intends to improve representativeness
      by shifting to remote collection and by designing recruitment to control
      for more variables.
  - description: >-
      Recruitment channels also included flyers in well-trafficked areas, QR
      codes linking to a secure REDCap screening survey, approved research staff
      approaching individuals in waiting rooms, social media (LinkedIn, X,
      Facebook, Instagram, YouTube, the project websites) and the FlowTrials
      platform. Where specific diagnoses or severities were under-represented,
      participants were identified by medical record review using diagnosis codes
      under a partial HIPAA waiver.

raw_sources:
  - description: >-
      Raw, unprocessed source data consist of high-quality voice, speech, cough
      and breathing audio waveforms recorded on tablet devices with headset
      microphones where available, in WAV format organised under a BIDS v1.9.0
      folder structure documented by the project as
      sub-<participant_id>/ses-<participant_id>/audio, with filenames of the form
      sub<participant_id>_ses<participant_id>_task-<task_name>.wav and
      accompanying JSON sidecars.
  - description: >-
      Raw tabular source data consist of REDCap exports of demographic,
      confounder, medical-history, disease-specific and patient-reported outcome
      instruments, together with clinician-entered diagnostic and gold-standard
      validation forms.
  - description: >-
      The raw data (post de-identification) are retained by the consortium but
      are not publicly accessible; they are disseminated only under controlled
      access.

raw_data_sources:
  - source_description: >-
      Raw adult audio waveforms for the Bridge2AI-Voice cohort. Not distributed
      through PhysioNet; access requires institutional sign-off and approval by
      the Data Access Compliance Office (DACO@b2ai-voice.org), after which data
      are made available via Synapse at
      https://www.synapse.org/Synapse:syn72370534/.
  - source_description: >-
      Raw pediatric audio waveforms for the Bridge2AI-Voice pediatric cohort,
      likewise available only under controlled access via Synapse at
      https://www.synapse.org/Synapse:syn73617068.
  - source_description: >-
      Bridge2AI-Voice REDCap instruments, data dictionary and metadata, published
      openly at https://github.com/eipm/bridge2ai-redcap and archived on Zenodo
      (https://zenodo.org/doi/10.5281/zenodo.12760724), under the MIT license.

preprocessing_strategies:
  - description: >-
      Raw audio was converted to monaural and resampled to 16 kHz with a
      Butterworth anti-aliasing filter applied, then segmented by task before
      feature extraction.
  - description: >-
      Spectrograms were computed with the short-time Fast Fourier Transform using
      a 25 ms window, 10 ms hop length and a 400-point FFT, yielding 201 x T
      tensors; from v2.0.0 onward spectrograms were additionally downsampled by a
      factor of two in the time domain. The initial v1.0/v1.1 release used a
      512-point FFT giving 513 x T spectrograms.
  - description: >-
      Mel spectrograms (60 x T) and 60 mel-frequency cepstral coefficients
      (60 x T) were derived using the same window, hop and FFT parameters with 60
      mel bins.
  - description: >-
      Pitch was extracted with torchaudio over a range of 80-500 Hz, and
      separately with the Speech Articulatory Coding package over 50-550 Hz.
  - description: >-
      Articulatory features were generated with the Speech Articulatory Coding
      (sparc) package at 50 Hz, comprising electromagnetic articulography
      estimates (T x 12, corresponding to X/Y positions of tongue dorsum, tongue
      body, tongue tip, lower incisor, upper lip and lower lip) plus loudness
      (20 ms windows) and periodicity measures.
  - description: >-
      Phonetic posteriorgrams giving a time-varying categorical distribution over
      40 phoneme categories at 100 Hz were generated with the ppgs package.
  - description: >-
      Static per-recording acoustic features were extracted with openSMILE
      (eGeMAPS-style functionals capturing temporal dynamics and spectral
      characteristics) and with Praat via parselmouth (fundamental frequency,
      formants, jitter, shimmer, HNR, cepstral peak prominence, spectral moments,
      speaking and articulation rate, and speech intelligibility metrics
      including STOI, PESQ and SI-SDR).
  - description: >-
      Transcriptions were generated with OpenAI's Whisper Large model.
  - description: >-
      Raw audio files and questionnaire data exported from REDCap were converted
      to be compliant with the Brain Imaging Data Structure v1.9.0 for the
      audio-bearing distribution. The PhysioNet feature-only release described by
      this record is not organised as a BIDS tree; it is organised into
      features/, phenotype/ and metadata/ folders.
  - description: >-
      Tabular phenotype data were exported from REDCap and merged into
      thematically organised TSV files with accompanying JSON data dictionaries
      using the open-source b2aiprep library; the single flat phenotype table
      used in v1.x/v2.x was split into per-instrument files in v3.0.0. Release
      3.0.0 was generated with b2aiprep v3.0.0.
  - description: >-
      Two feature storage formats are used: a fixed format holding static
      features extracted from the entire waveform, and a temporal format whose
      length varies per audio file with the recording duration.

cleaning_strategies:
  - description: >-
      The project's healthsheet states that no pre-processing was performed for
      the purpose of cleaning the data, and that no instances were excluded at
      the time of preprocessing.
  - description: >-
      An audit protocol is nevertheless applied to each release: generation of
      missingness tables; checking distributions and outliers; validating
      categorical responses against the schema; and running quality-control
      metrics on audio tasks, including the amount of silence and the duration of
      each waveform, and for speech tasks a comparison of produced speech against
      the intended passage.
  - description: >-
      Version 3.1.0 adds an audio_quality_metrics.tsv file exposing per-recording
      quality-control metrics derived from the raw audio.
  - description: >-
      All processing is performed with two open-source toolkits: b2aiprep, for
      organizing and preprocessing the dataset, and SenseLab, for processing
      audio files for research tasks.
  - description: >-
      Quality control during collection included acoustic quality standardisation
      in the application (volume standardisation and noise cancellation), review
      of all Year 1 exploratory samples by acoustic engineers and AI data
      scientists, and random selection of 10% of the data each month in
      subsequent years for quality control and ML-readiness review.

imputation_protocols:
  - description: >-
      No global statistical imputation is applied. Missing questionnaire
      responses, phenotype variables and derived features are left as explicit
      missing values or as omitted rows, and users may implement study-specific
      imputation or complete-case strategies appropriate to their analyses.

missing_data_documentation:
  - description: >-
      Phenotype data files contain a row for a participant only when at least one
      column is non-missing, so absence of a row indicates that no data for that
      instrument were captured for that participant.
  - description: >-
      Some questionnaire items are optional, and data collection irregularities
      caused information to be missing from individual instances. Each
      participant answered a common set of questions and then responded to
      additional questions relevant to their primary diagnostic category, so
      instrument coverage is systematically cohort-dependent.
  - description: >-
      Participants may have repeated visits, producing more than one row per
      participant in some files, and there is no requirement that a participant
      give the same response at each visit; values for the same data element may
      therefore vary across rows.
  - description: >-
      A missingness table is generated as part of the release audit and is
      included with the dataset; the dataset has been audited internally for
      missingness and consistency by the data release team.
  - description: >-
      Certain derived features could not be computed for all recordings, whether
      due to length or other issues, so counts differ across the Parquet feature
      files and those recordings are absent from the corresponding tables.

labeling_strategies:
  - description: >-
      Diagnostic labels are gold-standard labels resulting from a clinical
      assessment of the participant. At each site, a local clinician provided the
      diagnosis based on a clinical interview and appropriate work-up, following
      the Bridge2AI protocols and ICD-10 codes.
  - description: >-
      For the psychiatric disorders cohort, the assessment was determined from
      the participant's electronic health record or an active prescription,
      performed outside the data collection session by an appropriately licensed
      clinician.
  - description: >-
      A single labeler provides one label per instance; the labeler is typically
      the clinician at the site of data collection, or a clinician external to it
      in the case of a prior diagnostic assessment.
  - description: >-
      Cohort-specific gold-standard validation methods are specified per
      diagnosis, for example laryngoscopy images and stroboscopy videos for voice
      disorders, spirometry with flow-volume loops and CT for respiratory
      disorders, brain CT/MRI and whole-genome sequencing for neurological
      disorders, and electronic health summary plus psychiatrist diagnosis and
      medication history for psychiatric disorders.
  - description: >-
      Questionnaire-derived labels are produced by applying the standard scoring
      rules of each validated instrument, with the scoring logic encoded in the
      REDCap instruments and documented in the JSON data dictionaries.
  - description: >-
      Future researchers who create new labels or define new tasks are asked to
      describe the derivation process, including the exact variables used, in any
      accompanying model release or publication.

annotation_analyses:
  - description: >-
      Questionnaire-based labels are scored using the published rules for each
      validated instrument, yielding total and subscale scores that can be mapped
      to symptom-severity bands.
  - description: >-
      Because diagnostic labels are derived from clinical assessments and
      electronic health records rather than from crowd workers, there is no
      majority-vote or multiple-annotator scheme, and no inter-annotator
      agreement statistics or per-instance label-uncertainty measures are
      released.
  - description: >-
      The data release team audited the combined phenotype and feature tables for
      internal consistency, missingness patterns and data-entry issues.
  - description: >-
      Human-level performance on the applications the dataset is meant to address
      is reported by the project as varying widely.

machine_annotation_tools:
  - description: >-
      openSMILE - Speech and Music Interpretation by Large-space Extraction -
      used to extract acoustic feature sets capturing temporal dynamics and
      spectral characteristics.
  - description: >-
      Praat and the parselmouth Python interface, used to compute phonetic and
      prosodic features including fundamental frequency, formants and voice
      quality measures.
  - description: >-
      torchaudio, used to compute spectrograms, mel spectrograms, MFCCs and pitch
      contours.
  - description: >-
      Speech Articulatory Coding (sparc), used to estimate electromagnetic
      articulography traces and source features together with loudness,
      periodicity and pitch.
  - description: >-
      The ppgs package (high-fidelity neural phonetic posteriorgrams), used to
      generate time-varying distributions over 40 phoneme categories.
  - description: >-
      OpenAI Whisper Large, used for automatic transcription of speech tasks;
      transcripts of free-speech audio were removed before release.
  - description: >-
      b2aiprep (https://github.com/sensein/b2aiprep) and SenseLab
      (https://github.com/sensein/senselab), the open-source libraries used to
      orchestrate preprocessing, feature extraction and merging of phenotype data
      into the released files.
  - description: >-
      The project notes that these off-the-shelf models were used to generate
      transcription and some derived features but have not been independently
      audited by the dataset team for correctness or for fairness across
      demographic groups.

known_biases:
  - description: >-
      Sampling bias. Participants are recruited from specialty clinics and
      associated institutions using a non-probability sampling strategy, with
      inclusion focused on specific disease cohorts and on fluent English
      speakers, producing clinically enriched case mixes that do not represent
      general population distributions.
  - description: >-
      Geographic and cultural bias. Data are collected at a limited number of
      North American sites in the USA and Canada, so speakers from other regions,
      cultures, languages and healthcare systems may be under-represented; early
      releases are English-only, with Spanish protocols planned but not yet
      represented.
  - description: >-
      Clinical spectrum bias. Because participants are selected into disease
      cohorts where voice changes are expected, the prevalence and severity of
      conditions differ from those in routine primary care or community settings,
      which may inflate apparent model performance when evaluated within this
      dataset.
  - description: >-
      Device and environment bias. Recordings were made with standardized but not
      identical hardware, distinct iPad devices at each site, and primarily in
      clinical environments; at-home collection or deployment on other devices
      may encounter different background noise, channel characteristics and user
      behavior.
  - description: >-
      Label and site confounding. Participants were screened for different
      disorders depending on site, so cohort membership is confounded with the
      device used and with local diagnostic practice; changes in diagnostic
      criteria or practice over time are a further source of distribution shift.
  - description: >-
      Recruitment/participation bias. Groups that have less trust in the medical
      system or in AI, or that are less proximal to the collection sites, would
      have been less likely to be recruited.
  - description: >-
      Algorithmic bias in machine annotations. Transcripts and some derived
      features rely on off-the-shelf models such as OpenAI Whisper and other
      audio toolkits whose performance may vary across demographic groups; these
      tools were not independently audited for fairness by the dataset team.

known_limitations:
  - description: >-
      The feature-only release does not include raw audio waveforms or
      free-speech transcripts, which limits certain kinds of modeling and error
      analysis and constrains the ability to reproduce end-to-end audio
      pipelines.
  - description: >-
      Version 3.x includes only an adult cohort; models trained solely on this
      dataset may not generalize to younger age groups, and the dataset currently
      contains only fluent English speakers.
  - description: >-
      De-identification removed granular demographic and socio-economic
      variables, fine-grained location data and narrative context. This reduces
      re-identification risk but also limits detailed fairness assessments and
      certain confounder adjustments; K-anonymization with k greater than or
      equal to 2 is not achieved.
  - description: >-
      The dataset provides no predefined train/validation/test splits or
      benchmarking tasks and no explicit per-instance label-uncertainty measures,
      so researchers must design their own evaluation protocols and handle label
      noise and missingness themselves.
  - description: >-
      The registered-access and controlled-access governance structure, while
      appropriate for privacy, may limit participation by some institutions or
      researchers and can complicate reproducibility of pipelines that need both
      features and raw audio.
  - description: >-
      The public releases do not contain an equal distribution of the five
      disease categories, and no external multimodal data (imaging, genomics,
      pulmonary function tests) are included in the v3.x releases despite being
      collected under the broader protocol.
  - description: >-
      Certain aspects of the data, notably transcription, were generated using
      off-the-shelf models that have not been audited for correctness.

intended_uses:
  - description: >-
      Development, training and fine-tuning of machine-learning models that
      associate voice-derived features with diagnostic categories or symptom
      severity for conditions such as vocal fold pathology, neurological and
      neurodegenerative diseases, mood and anxiety disorders and respiratory
      illnesses.
  - description: >-
      Benchmarking and validation of existing voice-biomarker algorithms by
      testing their performance on a clinically diverse, multi-site cohort with
      standardized tasks and rich phenotype data.
  - description: >-
      Exploratory research on acoustic, phonetic, prosodic and articulatory
      correlates of disease using de-identified derived features, including work
      on representation learning, domain adaptation and multimodal integration
      with other health data.
  - description: >-
      Methodological research on fairness, robustness and AI safety in clinical
      voice models, including studies of bias related to demographic subgroups or
      recording conditions, subject to the ethical constraints in the data use
      agreement.
  - description: >-
      Use of the phenotype folder for cohort selection prior to modeling with the
      derived acoustic features.

existing_uses:
  - description: >-
      A restricted version of the dataset containing raw audio has been used in
      the Bridge2AI Summer School and hackathon.
  - description: >-
      The dataset and its protocols underpin consortium methodological work,
      including evidence-based recommendations for tablet recordings from the
      Bridge2AI-Voice acoustic experiments and the multi-disorder voice protocol
      development described in Bensoussan et al., Interspeech 2024.

other_tasks:
  - description: >-
      Study of developmental and normative variation in voice and speech, and
      creation of AI-driven early screening tools, particularly in combination
      with the companion pediatric dataset.
  - description: >-
      Research on voice re-identification risk, voice AI hacking and privacy
      safeguards, which the consortium identifies as growing ethical, legal and
      social challenges for voice AI.
  - description: >-
      Development of new digital endpoints for clinical trials and of remote
      monitoring approaches, for example remote voice monitoring in spasmodic
      dysphonia to assess botulinum toxin response.

discouraged_uses:
  - description: >-
      Non-research and non-clinical applications such as hiring decisions,
      insurance premium adjustments, or any form of surveillance that could lead
      to discrimination or harm are discouraged, in order to prevent unethical or
      biased outcomes that would negatively affect individuals on the basis of
      their health conditions or voice characteristics.
  - description: >-
      Uses that ignore the dataset's skews by disorder category, site and
      demographic factors are discouraged; users should consider the multivariate
      distribution when assessing utility for a given question.
  - description: >-
      Use of the feature-only release for end-to-end audio pipeline reproduction
      or for analyses requiring free-speech transcripts is not supported, since
      those elements have been withheld.

prohibited_uses:
  - description: >-
      Any attempt to re-identify research participants, or any action that could
      reasonably lead to re-identification, is prohibited under the Registered
      Access Agreement.
  - description: >-
      Any purpose that could foreseeably cause harm or stigmatization to research
      participants, their families, communities or specific populations is
      prohibited.
  - description: >-
      Using intellectual property protections, database rights or related rights
      in a manner that restricts or limits access to any part of the dataset, or
      to any conclusions derived from it, is prohibited; this preserves
      unrestricted future use in line with the consortium's Open Science
      principles.
  - description: >-
      Sale of all or part of the data on any media is not permitted, and
      recipients may not disclose, release, rent, lease, loan or otherwise grant
      access to the data to any third party other than approved Authorized
      Persons without prior written consent.
  - description: >-
      Recipients may not use the data, alone or with other information, to
      attempt to contact individuals who are the subjects of the data without
      appropriate IRB approval, specific written approval from the provider, and
      informed consent from the individual where required.

future_use_impacts:
  - description: >-
      Anticipated benefits include enabling voice to serve as an accessible,
      low-cost, non-invasive biomarker for screening, diagnosis and monitoring
      across a broad range of health conditions, potentially improving early
      detection and expanding access to specialist-level screening for
      underserved populations and low-resource settings.
  - description: >-
      Anticipated risks include privacy loss, misuse of voice biometrics, and
      algorithmic harms such as discrimination in hiring, insurance or
      surveillance contexts; these risks motivate the governance framework of IRB
      oversight, de-identification, tiered feature-only and raw-audio access, and
      usage restrictions encoded in the license and data use agreement.
  - description: >-
      Because the dataset has skews by disorder category, site and demographic
      factors, downstream models risk unfair treatment of groups, stereotyping or
      quality-of-service disparities; users are advised to assess the
      multivariate distribution and to design analyses accordingly.

use_repository:
  - description: >-
      The project states that there is no dedicated repository linking to papers
      or systems that use the dataset, beyond ordinary citation indices; users
      are asked to cite the protocol paper (Bensoussan et al., "Developing
      Multi-Disorder Voice Protocols", Proc. Interspeech 2024,
      https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html)
      and the dataset DOI. Training opportunities for using the dataset are
      hosted at https://www.b2aivoicescholars.org/.

distribution_formats:
  - description: >-
      Dense derived features are distributed as Apache Parquet files
      (column-oriented, open format): ppgs.parquet, sparc_ema.parquet,
      sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet,
      torchaudio_spectrogram.parquet, torchaudio_mel_spectrogram.parquet,
      torchaudio_mfcc.parquet and torchaudio_pitch.parquet, each row keyed by
      participant_id, session_id, task_name and n_frames.
  - description: >-
      Static per-recording features and audio quality metrics are distributed as
      tab-separated values (static_features.tsv, audio_quality_metrics.tsv), each
      with an accompanying JSON data dictionary.
  - description: >-
      Phenotype data are distributed as tab-separated values organised into
      confounders, demographics, diagnosis, enrollment, questionnaire and task
      subfolders, each TSV paired with a JSON data dictionary whose keys match the
      column names and whose values give a description, the question asked and the
      data type.
  - description: >-
      Version 3.1.0 adds a metadata folder containing a Parquet file and data
      dictionary with per-recording information including task instructions and
      prompts, the microphone used and its input gain.
  - description: >-
      Raw audio, where released under controlled access, is distributed as WAV
      files within a Brain Imaging Data Structure v1.9.0 folder layout with JSON
      sidecars.

distribution_dates:
  - description: >-
      Version 1.0 of the feature-only dataset was published at the end of
      November 2024 on the Health Data Nexus platform
      (https://doi.org/10.57764/qb6h-em84).
  - description: >-
      PhysioNet version 1.1 was published on 2025-01-17 (DOI
      10.13026/249v-w155), adding mel-frequency cepstral coefficients.
  - description: >-
      Version 2.0.0 was published on 2025-04-16 and version 2.0.1 on 2025-08-18.
  - description: >-
      Version 3.0.0 was published on 2025-12-16 (DOI 10.13026/k81f-qr68).
  - description: >-
      Version 3.1.0, the current release, was published on 2026-05-01 (DOI
      10.13026/8xbn-nq66); the latest-version DOI is 10.13026/37yb-1t42.

third_party_sharing:
  - description: >-
      The dataset is distributed broadly to individuals outside the entity that
      created it. Feature-only data are published on PhysioNet under registered
      then credentialed access; version 1.0 was published on the Health Data
      Nexus (https://healthdatanexus.ai/), a platform maintained by the Temerty
      Centre for Artificial Intelligence Research and Education in Medicine
      (T-CAIREM) at the University of Toronto.
  - description: >-
      Raw audio is disseminated only under controlled access. Requesters must
      complete a Data Access Request Form and a Data Use Agreement, submit the
      application to the Data Access Compliance Office for review, and, on
      approval, have a Data Transfer and Use Agreement signed by an authorized
      official at their institution; approved data are then made available via
      Synapse.
  - description: >-
      Under the Data Transfer and Use Agreement, collaborators at other research
      organizations, and other research teams at the same organization, must
      apply independently for access and sign their own agreement; recipients
      must bind Authorized Persons to equivalent confidentiality and security
      standards.
  - description: >-
      Within the consortium, identified data remain at each collecting
      institution behind password-protected REDCap access, and de-identified data
      are shared through a joint meta-database hosted on cloud infrastructure via
      NIH STRIDES partners (Amazon, Google, Microsoft) under pre-negotiated NIH
      agreements. Federated learning was planned so that models can be trained
      across institutions without data leaving the institution.

license_and_use_terms:
  description: >-
    The dataset is released under the Bridge2AI Voice Registered Access License
    with an associated Bridge2AI Voice Registered Access Agreement. On PhysioNet,
    versions up to 1.1 used registered access (registration and identity
    confirmation plus signing the agreement); from version 3.0.0 the access
    policy is credentialed access, requiring the user to be a credentialed
    PhysioNet user and to sign the data use agreement. No additional training is
    required. The dataset is intended solely for commercial and non-commercial
    research purposes by Authorized Researchers, and the consent terms place no
    non-commercial, geographic, research-type, genetic-research or
    method-development restriction on use. Raw audio requires a separate
    controlled-access pathway comprising a Data Access Request Form, a Data Use
    Agreement, Data Access Compliance Office review and an institutionally signed
    Data Transfer and Use Agreement. No fees are associated with the access
    restrictions, although a Data Transfer and Use Agreement may provide for
    reimbursement of costs associated with preparing, compiling and transferring
    the data, excluding payment for research effort by the provider.

ip_restrictions:
  description: >-
    Users acknowledge that the data may be protected by copyright and other
    intellectual property rights. Duplication as reasonably required to carry out
    the approved research project is permitted; sale of all or part of the data
    on any media is not. Nothing in the agreement transfers intellectual property
    rights in or relating to the data to the recipient. Recipients agree not to
    make intellectual property claims on the data and not to use intellectual
    property protection in ways that would prevent or block access to, or use of,
    any element of the data or conclusions drawn directly from it. Recipients may
    obtain intellectual property rights on downstream discoveries but agree to
    implement licensing policies that will not obstruct further research, and to
    respect the Fort Lauderdale Agreement. No third parties have imposed IP-based
    restrictions on the data associated with the instances, and the data provider
    gives no guarantee that the data are free of third-party intellectual
    property rights, database rights or other related rights. Supporting code is
    separately licensed: the Bridge2AI REDCap data dictionary and metadata and
    the documentation site source are MIT licensed, and the b2aiprep preparation
    library is Apache-2.0 licensed. The RO-Crate records a copyright notice of
    "Copyright 2026 University of South Florida all rights reserved".

regulatory_restrictions:
  description: >-
    No export controls or other regulatory restrictions apply to the dataset or
    to individual instances. HIPAA de-identification rules were applied and HIPAA
    Safe Harbor identifiers were removed; recipients must store the data with
    administrative, physical and technical safeguards adequate to protect
    Personally Identifiable Information and equivalent to those required of
    covered entities and business associates for electronic protected health
    information. The data are covered by an NIH Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders
    and subpoenas for identifying information or characteristics of a research
    participant. The Data Transfer and Use Agreement requires the recipient's
    authorized representative to warrant that the recipient does not use coercion
    for labor or services as defined in Florida Statutes section 787.06, and
    permits the provider to unilaterally amend the agreement if the federal
    sponsor requires revision. Recipients must also adhere to the specific
    requirements of PhysioNet.org, managed by the MIT Laboratory for
    Computational Physiology.

ethical_reviews:
  - description: >-
      Data collection and sharing were approved by the University of South
      Florida Institutional Review Board, acting as the single IRB for US
      participating institutions, with subsite IRBs approving through the single
      IRB process. Institutional review contact - University of South Florida
      Institutional Review Board, 3702 Spectrum Blvd., Suite 165, Tampa, FL
      33620, USA; RSCH-IRB@usf.edu; (813) 974-5638.
  - description: >-
      The mobile-application feasibility study conducted at the USF Health Voice
      Center was separately approved by the University of South Florida
      Institutional Review Board under IRB number 004890, and participants
      provided written informed consent.
  - description: >-
      Canadian participating institutions (Mount Sinai Hospital, the Hospital for
      Sick Children and the University of Toronto) do not fall under the single
      IRB process and obtained separate Research Ethics Board approvals; the
      pediatric dataset was approved by the Research Ethics Board at the Hospital
      for Sick Children. Genomic data collection and analysis at Mount Sinai
      Hospital and the University of Toronto were covered by a separate protocol
      and REB approval.
  - description: >-
      An additional ethical review was performed by Vardit Ravitsky at The
      Hastings Center for Bioethics as part of the consortium's ethics module,
      which also produced a published memorandum on the ethical justification for
      controlled access to raw voice data samples.
  - description: >-
      The study is not for a drug product and not for a medical device, and no
      data monitoring committee was appointed. The study is registered as an
      observational cohort study with a cross-sectional time perspective, with
      organization study ID OT2OD032720.

collection_consents:
  - description: >-
      All participants provided prospective informed consent to the collection
      and use of their data. Participants were explicitly informed about the data
      being collected, the methods used to secure the data, and how the
      information would be used.
  - description: >-
      Consent could be given by signing a physical paper copy, by indicating
      electronic consent within the application or through a REDCap survey, or by
      video recording within the application, in which the participant reads a
      consent statement aloud so that the recording can be used to verify that
      submitted acoustic data belong to the consented individual.
  - description: >-
      For pediatric participants, parental permission was obtained from one or
      both parents or legal guardians, and children provided verbal assent where
      developmentally appropriate; children under approximately seven years of
      age were not asked to assent, and assent was documented.
  - description: >-
      Consent explicitly covers sharing of research data without direct
      identifiers with external researchers for future research through a secure
      database, sharing of low re-identification risk data with the general
      public under registered access, and sharing through a controlled access
      mechanism with authorized researchers for data posing heightened
      re-identification risk.
  - description: >-
      For longitudinal or at-home collection, an electronic consent within the
      application was administered before each subsequent data collection to
      ensure ongoing consent.

collection_notifications:
  - description: >-
      Individuals were notified about the data collection through an
      IRB-approved consent process. Participants were informed during the consent
      process that the application was created by the Bridge2AI-Voice consortium,
      and were told its purpose.
  - description: >-
      Approximately 30 minutes were spent explaining the study and consent in
      detail, with time for questions; potential participants were asked to
      explain back to the research assistant what they had understood, and were
      informed that participation is voluntary and does not affect their medical
      care.

consent_revocations:
  - description: >-
      Consenting participants are informed that they may withdraw from the study
      at any point. If a participant withdraws during or before the voice data
      collection, their data will not be included in the database.
  - description: >-
      Participants are informed that research data, including voice recordings,
      cannot be removed from the database once the voice data collection process
      is completed. For longitudinal collection the minimum requirement for study
      completion is one data collection time point, and data already completed
      are retained if the participant later withdraws.
  - description: >-
      Participants who withdraw, decline participation, or express initial
      hesitation may optionally complete a satisfaction survey to help the team
      understand their reasons; no protected health information is collected in
      that survey.

data_protection_impacts:
  - description: >-
      The project's healthsheet states that an analysis of the potential impact
      of the dataset and its use on data subjects has not been conducted.
  - description: >-
      A published memorandum nevertheless sets out the ethical justification for
      the governance structure and for restricting raw voice data samples to
      controlled access, and the consortium's ethics module works on identifying,
      anticipating and addressing ethical and trustworthiness issues arising from
      voice data generation through to clinical adoption and downstream health
      outcomes.
  - description: >-
      Privacy risk mitigation embedded in the design includes two levels of
      privacy for the combined database - a de-identified master database hosted
      with a HIPAA-privacy-preserving NIH STRIDES partner, and federated learning
      allowing model training without data leaving the institution - together
      with data sharing and data use agreements between participating
      institutions.

participant_compensation:
  - description: >-
      Participants were compensated for their time through electronic gift cards:
      40 USD for a data collection session taking less than 90 minutes and 80 USD
      for a session taking over 90 minutes, for no more than three sessions and a
      maximum total compensation of 120 USD. Compensation was provided to the
      adult population only.
  - description: >-
      Participants in the earlier mobile-application feasibility study did not
      receive financial incentives for completion of that study.

participant_privacy:
  - description: >-
      All direct identifiers were removed, including name, civic address and
      social security numbers. Indirect identifiers were removed where they
      created a significant risk of re-identification through combination with
      public data on social media, in government registries or elsewhere,
      including select geographic and demographic identifiers and information
      about household composition or cultural identity.
  - description: >-
      Non-identifying elements revealing highly sensitive information, such as
      household income, mental health status and traumatic life experiences, were
      also removed.
  - description: >-
      All raw voice data were removed from the public release, because voice has
      the potential to cause individual re-identification or to be used for
      illicit or unauthorized purposes. Raw audio transcripts were reviewed and
      recordings containing potentially identifying information or external
      voices were removed from the release.
  - description: >-
      Identified data remain within each collecting institution in
      password-protected REDCap databases accessible only to approved
      investigators; all study personnel with data access must complete HIPAA and
      privacy training at their local institution. Identifiable data and the
      datasheets linking participant numbers to participant information are kept
      on local cloud storage for a maximum of ten years after study completion
      and are then destroyed by the local principal investigator.
  - description: >-
      Participants are informed that even after removal of all HIPAA-protected
      information, a person's voice is unique to them and cannot be fully
      de-identified, so recognition by someone who knows them, while unlikely,
      remains possible.

informed_consent:
  - description: >-
      Written informed consent was obtained from all participants for all study
      procedures. Consent forms are stored electronically in REDCap; paper
      consent documents are uploaded and saved electronically, and all paper and
      electronic versions of consent are retained for a minimum of five years
      after study completion, following University of South Florida procedure.
  - description: >-
      Consent options in the protocol include obtaining signed consent from the
      subject or legally authorized representative, signed parental permission,
      signed or verbal assent for children or adults unable to consent, online
      consent under a waiver of written documentation, and a partial waiver of
      HIPAA authorization for recruitment and screening only.
  - description: >-
      The consent process is conducted by research assistants in a clinic setting
      or remotely through REDCap survey forms or the application; electronic
      consent contains the same text as paper consent. Where a delay occurs
      between consent and data collection, participants are notified of any
      changes to the study and re-consented before data collection.

at_risk_populations:
  description: >-
    Pediatric participants are a protected population under the protocol. No
    pediatric data collection was performed at the University of South Florida;
    pediatric collection was carried out only at pediatric participating
    institutions, and the pediatric cohort is released as a separate dataset. A
    checklist for children under 21 was completed and appended to the protocol.
    For children, parental permission is obtained from one or both parents or
    legal guardians (the research being minimal risk, permission from both is not
    required), and children provide verbal assent where developmentally
    appropriate, documented on an assent form; children under approximately seven
    years of age are not asked to assent because of limitations in understanding
    due to age and development. For pediatric participants without adequate
    comprehension of their own medical history, a parent or decision-maker
    completed the survey on a separate tablet while the child completed the
    recording. The adult dataset released here is restricted to participants aged
    18 years and older. The protocol states that students, employees and wards of
    the state are neither specifically included nor excluded, and includes a Plan
    for Enhancing Diverse Perspectives intended to enroll participants from
    socially and economically disadvantaged and underserved populations.

is_deidentified:
  description: >-
    The dataset is de-identified. Identifiable information under HIPAA and the
    Common Rule, as well as data considered sensitive, has been removed. Direct
    identifiers are removed; HIPAA de-identification rules are applied; dates are
    rebased and/or replaced by integers; geographic information is removed or
    generalized (state and province removed, country of data collection
    retained); narrative text fields are removed. K-anonymization with k greater
    than or equal to 2 is not achieved. HIPAA Safe Harbor identifiers removed
    include names, geographic locators, sub-year date information, phone and fax
    numbers, email addresses, IP addresses, Social Security Numbers, medical
    record numbers, health plan beneficiary numbers, device identifiers, license
    numbers, account numbers, vehicle identifiers, website URLs, full face
    photographs, biometric identifiers and any other unique identifiers. Data
    were extracted from the raw audio specifically to limit re-identification,
    and only the extracted features are released; spectrograms and similar
    features were excluded where the audio contained free speech, while static
    features that do not encode the sensitive information were retained. The
    project acknowledges that a voice cannot be fully de-identified.

human_subject_research:
  description: >-
    Yes - the dataset arises from human subjects research. The study was
    submitted to and approved by the University of South Florida single IRB and
    by subsite IRBs through the single IRB process, with separate Research Ethics
    Board approvals for Canadian sites. The study is not exempt from human
    subjects protections, is not for a drug product or a medical device, is not
    FDA regulated, and no data monitoring committee was appointed. The study
    design is an observational cohort study with a cross-sectional time
    perspective, with biospecimens described as respiratory, voice and speech
    samples. The source documents give three different enrollment targets and do
    not reconcile them: the IRB protocol states a sample size of 30,000
    participants (and the audiomics white paper likewise describes a primary
    deliverable of a publicly available database of 30,000 human voices); the
    project documentation states an anticipated enrollment count of 10,000 by
    2027 and describes a flagship dataset of 10,000 voices; and the RO-Crate
    evidence states an anticipated enrollment of approximately 3,000 participants
    by November 2026. Version 3.1.0 contains 833 participants.

maintainers:
  - description: >-
      The Bridge2AI-Voice consortium maintains the dataset, supported by the NIH
      via the Bridge2AI Common Fund program. Satrajit Ghosh is identified as the
      data governance committee contact, and Yael Bensoussan is the principal
      investigator.
  - description: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology,
      hosts and distributes the feature-only dataset and provides continued
      access to interested researchers.
  - description: >-
      Version 1.0 was hosted by the Health Data Nexus, a data publishing platform
      maintained by the Temerty Centre for Artificial Intelligence Research and
      Education in Medicine (T-CAIREM) at the University of Toronto, which
      maintains the technical infrastructure for that release.
  - description: >-
      Access requests and questions about controlled access to raw audio are
      directed to the Data Access Compliance Office at DACO@b2ai-voice.org;
      general project contact is via https://b2ai-voice.org/contact-us/ and the
      documentation site https://docs.b2ai-voice.org/.

updates:
  description: >-
    The dataset is released as static, versioned snapshots rather than being
    dynamically updated. Further versions are planned on a semi-annual (twice a
    year) basis and are distributed as new versions on the hosting platform, with
    users notified through news items on the platform and standard communication
    channels. Release notes document added participants, new feature sets,
    reorganised phenotype tables and corrections. Planned enhancements include
    additional participants toward the target enrollment, incorporation of
    Spanish-language protocols, and inclusion of additional multimodal data.
    Version history to date: v1.0 (first release), v1.1 (added MFCCs), v2.0.0
    (136 additional participants, reprocessed spectrograms, removal of
    free-speech spectrograms and MFCCs), v2.0.1 (authorship corrections), v3.0.0
    (391 additional participants, phenotype file separation, sparc and ppgs
    features, reorganised files), and v3.1.0 (no new participants; repaired
    Parquet files, added audio quality metrics and per-recording metadata,
    back-filled validated diagnosis information, rearranged some phenotype files
    and renamed some gold-standard variables).

version_access:
  description: >-
    Each version of the dataset has a unique DOI and, by default, older versions
    continue to be supported, hosted and made available to researchers; the
    dataset publishers reserve the right to remove access to older versions. On
    PhysioNet the available versions are 1.1 (2025-01-17), 2.0.0 (2025-04-16),
    2.0.1 (2025-08-18), 3.0.0 (2025-12-16) and 3.1.0 (2026-05-01), with a
    latest-version DOI of 10.13026/37yb-1t42; the files for version 1.1 are no
    longer available and users are directed to the latest version. Version 1.0
    remains discoverable on the Health Data Nexus at
    https://doi.org/10.57764/qb6h-em84.

errata:
  - description: >-
      There is no erratum document. A changelog for each dataset version is
      published online with the dataset metadata; the BIDS-structured
      audio-bearing distribution documented by the project additionally includes
      a CHANGES.md file at the root of its folder tree.
  - description: >-
      Version 2.0.0 reprocessed spectrograms to fix minor issues identified in
      the previous release, and removed all spectrograms and MFCCs derived from
      free-speech recordings.
  - description: >-
      Version 2.0.1 consisted of corrections to the authorship list.
  - description: >-
      Version 3.1.0 fixed broken Parquet files shipped in the previous release
      and updated validated diagnosis information across conditions with
      back-filled information; some phenotype files were rearranged and certain
      gold-standard variable names were renamed.

retention_limit:
  description: >-
    Once data are contributed, they will be retained as long as they are useful
    for research purposes, possibly indefinitely; participants were not told that
    their data would be retained only for a fixed period. Separate limits apply
    to other holdings: identifiable data and the tables linking participant
    numbers to participant information are kept within each collecting
    institution on local cloud storage for a maximum of ten years after study
    completion and then destroyed by the local principal investigator;
    de-identified study data and original consent forms are retained for a
    minimum of five years after study completion per University of South Florida
    requirements. Under the Data Transfer and Use Agreement, recipients must
    destroy the transferred data two years after the start date, on completion of
    the project, on termination, or on expiration of the applicable ethics
    approval, whichever occurs first, and must certify destruction in writing
    within thirty days, except for one copy retained as necessary for records
    retention, research integrity and verification.

extension_mechanism:
  description: >-
    Others may extend or augment the dataset by publishing a derivative dataset
    on the hosting platform that references the original source; such derivative
    datasets may be made available under the same conditions as the source data.
    For augmentations to the code used to produce the data, the open-source
    repositories (notably b2aiprep and senselab) have discussion forums and issue
    pages allowing public discussion of data preprocessing, and a pull-request
    mechanism for contributing improvements to the preprocessing code. Recipients
    under the Data Transfer and Use Agreement may perform further research adding
    intellectual and resource capital to the data and may obtain intellectual
    property rights on downstream discoveries, provided they implement licensing
    policies that do not obstruct further research.

file_collections:
  - id: https://doi.org/10.13026/8xbn-nq66#features-parquet
    description: >-
      Dense derived-feature Parquet files under features/: ppgs.parquet,
      sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet,
      sparc_pitch.parquet, torchaudio_spectrogram.parquet,
      torchaudio_mel_spectrogram.parquet, torchaudio_mfcc.parquet and
      torchaudio_pitch.parquet. Per-file byte sizes and SHA-256 checksums are
      available only for version 3.0.0, where the RO-Crate records
      ppgs.parquet at 1,924,570,748 bytes, sparc_ema.parquet at 489,789,806,
      sparc_loudness.parquet at 44,560,637, sparc_periodicity.parquet at
      46,082,006, sparc_pitch.parquet at 30,238,017, torchaudio_mfcc.parquet at
      2,471,231,943, torchaudio_pitch.parquet at 35,527,542,
      torchaudio_spectrogram.parquet at 6,368,594,794 and
      torchaudio_mel_spectrogram.parquet at 2,377,493,590, with a total dataset
      content size of 12.9 GB. Those figures should not be assumed to hold for
      version 3.1.0, which repaired the Parquet files and changed per-feature
      recording counts (for example spectrograms from 29,020 to 29,278).
    file_count: 9
  - id: https://doi.org/10.13026/8xbn-nq66#features-tabular
    description: >-
      Tab-separated per-recording feature tables under features/, each paired
      with a JSON data dictionary: static_features.tsv, holding 135 columns of
      openSMILE, Praat/parselmouth and torchaudio-derived static features plus
      participant, session, task and transcription fields; and (new in version
      3.1.0) audio_quality_metrics.tsv, holding per-recording audio
      quality-control metrics.
  - id: https://doi.org/10.13026/8xbn-nq66#phenotype-tables
    description: >-
      Tab-separated phenotype tables with JSON data dictionaries, organised into
      confounders (547 columns), demographics, diagnosis (per-condition tables
      including airway_stenosis, amyotrophic_lateral_sclerosis, anxiety,
      benign_lesions, bipolar_disorder, cognitive_impairment, control,
      copd_and_asthma, depression, glottic_insufficiency, laryngeal_cancer,
      laryngeal_dystonia, laryngitis, muscle_tension_dysphonia,
      parkinsons_disease, precancerous_lesions, unexplained_chronic_cough and
      unilateral_vocal_fold_paralysis), enrollment (eligibility, enrollment_form,
      participant), questionnaire (adhd_adult, custom_affect_scale, dsm5_adult,
      dyspnea_index, gad7_anxiety, leicester_cough_questionnaire, panas, phq9,
      productive_vocabulary, psychiatric_history, ptsd_adult, vhi10,
      voice_perception) and task (acoustic_task, harvard_sentences,
      random_item_generation, recording, session, stroop, winograd) subfolders.
      In version 3.0.0 the confounders table was 721,577 bytes and the
      demographics table 212,790 bytes.
  - id: https://doi.org/10.13026/8xbn-nq66#metadata
    description: >-
      Metadata folder introduced in version 3.1.0, containing a Parquet file and
      its data dictionary with per-recording information including task
      instructions and prompts, the microphone used and its input gain.

variables:
  - variable_name: participant_id
    description: >-
      De-identified unique identifier for an enrolled participant; the join key
      across all feature, metadata and phenotype tables.
  - variable_name: session_id
    description: >-
      De-identified unique identifier for a data collection session; a
      participant may have more than one session.
  - variable_name: task_name
    description: >-
      Name of the acoustic task performed for a given recording, drawn from the
      Bridge2AI-Voice protocol task set (for example Prolonged Vowel, Maximum
      Phonation Time, Glides, Loudness, Diadochokinesis, Rainbow Passage,
      Caterpillar Passage, Cape-V Sentences, Free Speech, Picture Description,
      Story Recall, Animal Fluency, Word-Color Stroop, Productive Vocabulary,
      Random Item Generation, Cinderella Story, Respiration, Cough).
  - variable_name: n_frames
    description: >-
      Number of time frames associated with the stored feature tensor for a
      recording.
  - variable_name: spectrogram
    description: >-
      Short-time Fourier transform magnitude spectrogram of dimension 201 x T,
      computed with a 25 ms window, 10 ms hop and 400-point FFT, stored in power
      representation and downsampled by a factor of two in time.
  - variable_name: mel_spectrogram
    description: >-
      Mel spectrogram of dimension 60 x T computed with 60 mel bins and the same
      window, hop and FFT parameters as the spectrogram.
  - variable_name: mfcc
    description: >-
      Sixty mel-frequency cepstral coefficients of dimension 60 x T, derived from
      the mel spectrogram.
  - variable_name: pitch
    description: >-
      Detected fundamental frequency over time; the torchaudio estimate uses a
      range of 80-500 Hz, while the sparc estimate uses a different algorithm
      over 50-550 Hz.
  - variable_name: ema
    description: >-
      Estimated electromagnetic articulography traces of dimension T x 12,
      corresponding to X and Y positions of six articulators - tongue dorsum,
      tongue body, tongue tip, lower incisor, upper lip and lower lip - sampled
      at 50 Hz.
  - variable_name: loudness
    description: >-
      Estimated loudness based on the average absolute amplitude of the audio
      waveform, computed over 20 ms windows.
  - variable_name: periodicity
    description: >-
      Estimated periodicity, that is confidence of pitch presence, derived from
      the audio over 20 ms windows.
  - variable_name: ppgs
    description: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories at a
      frame rate of 100 Hz, giving a tensor of dimension 40 x T.
  - variable_name: transcription
    description: >-
      Automatic transcription of the recording produced by OpenAI Whisper Large;
      transcriptions of free-speech tasks were removed from the release.
  - variable_name: F0semitoneFrom27.5Hz_sma3nz_amean
    description: >-
      Mean fundamental frequency in semitones relative to 27.5 Hz, an openSMILE
      static functional included in static_features.tsv.
  - variable_name: local_jitter
    description: >-
      Local jitter, a cycle-to-cycle frequency perturbation measure of voice
      quality computed with Praat/parselmouth.
  - variable_name: localDB_shimmer
    description: >-
      Local shimmer in decibels, a cycle-to-cycle amplitude perturbation measure
      of voice quality computed with Praat/parselmouth.
  - variable_name: mean_hnr_db
    description: >-
      Mean harmonics-to-noise ratio in decibels.
  - variable_name: cepstral_peak_prominence_mean
    description: >-
      Mean cepstral peak prominence, a measure of the extent of harmonic
      structure in connected speech.
  - variable_name: stoi
    description: >-
      Short-time objective intelligibility metric, one of the speech
      intelligibility measures provided for speech tasks.
  - variable_name: vhi_10_calc_score
    description: >-
      Calculated total score for the Voice Handicap Index-10, a validated
      patient-reported outcome for dysphonia.
  - variable_name: winograd_score
    description: >-
      Score on the Winograd schema task administered in the neurological
      protocol.
  - variable_name: recording_microphone
    description: >-
      Microphone used for a recording, held in the task/recording table alongside
      recording_input_gain, recording_duration, recording_size and the recording
      profile name and version.
  - variable_name: is_control_participant
    description: >-
      Eligibility-table flag indicating whether the participant was enrolled as a
      control rather than into a disease cohort.
  - variable_name: selected_language
    description: >-
      Language selected by the participant for the protocol; English is the only
      option represented in version 3.x, with Spanish protocols under
      development.

# NOTE ON related_datasets (audit finding, medium): the declared bundle does
# support typed relationships to (a) the Bridge2AI-Voice Pediatric Dataset,
# DOI 10.13026/h995-bt35, a distinct PhysioNet project and cohort, and (b) the
# prior versions of this same resource (Health Data Nexus v1.0,
# DOI 10.57764/qb6h-em84; PhysioNet v1.1, v2.0.0, v2.0.1 and v3.0.0).
# The slot is nevertheless left unpopulated because DatasetRelationship
# requires `relationship_type`, and the declared schema inventory does not
# expose the permitted values for that field. Emitting an invented token would
# be an ungrounded assertion under the provenance guard. These relationships
# are therefore recorded in prose in external_resources and version_access
# below, where they are fully traceable to the bundle.

external_resources:
  - description: >-
      Bridge2AI-Voice project documentation, protocols, dashboards and healthsheet
      at https://docs.b2ai-voice.org/ and the project site
      https://b2ai-voice.org/ ; the documentation source is at
      https://github.com/eipm/bridge2ai-docs (MIT licensed, DOI
      https://zenodo.org/doi/10.5281/zenodo.13834653).
  - description: >-
      Bridge2AI-Voice REDCap data dictionary, metadata and instrument PDFs at
      https://github.com/eipm/bridge2ai-redcap (MIT licensed), archived on Zenodo
      at https://zenodo.org/doi/10.5281/zenodo.12760724 and
      https://zenodo.org/records/14989503.
  - description: >-
      b2aiprep, the open-source library used to organise and preprocess the
      dataset and to merge source data into the phenotype files, at
      https://github.com/sensein/b2aiprep (Apache-2.0).
  - description: >-
      SenseLab, the open-source library used to process audio files for research
      tasks, at https://github.com/sensein/senselab.
  - description: >-
      FHIR profiles for voice as a biomarker, published by the consortium as a
      separate source-code resource.
  - description: >-
      Protocol paper - Bensoussan, Y., Ghosh, S., Rameau, A., et al. "Developing
      Multi-Disorder Voice Protocols: A team science approach involving clinical
      expertise, bioethics, standards, and DEI." Proc. Interspeech 2024,
      1445-1449. doi:10.21437/Interspeech.2024-1926.
  - description: >-
      Feasibility study - Moothedan, E., Boyer, M., Watts, S., et al. "The
      Bridge2AI-voice application: initial feasibility study of voice data
      acquisition through mobile health." Frontiers in Digital Health, 2025;
      7:1514971. doi:10.3389/fdgth.2025.1514971. PMCID PMC12037532. Reports a
      single-site study of 47 participants with 68% overall task completion and
      41% successful acoustic task recording.
  - description: >-
      Opinion piece introducing audiomics - Bensoussan, Y., Elemento, O., Rameau,
      A. "Voice as an AI Biomarker of Health - Introducing Audiomics." JAMA
      Otolaryngology-Head & Neck Surgery, 2024;150(4):283-284.
      doi:10.1001/jamaoto.2023.4807.
  - description: >-
      Acoustic recording recommendations - Awan, S.N., Bahr, R., Watts, S.,
      Boyer, M., Budinsky, R., Bridge2AI-Voice Consortium, et al. "Evidence-based
      recommendations for tablet recordings from the Bridge2AI-voice acoustic
      experiments." Journal of Voice, 2024. doi:10.1016/j.jvoice.2024.08.029.
  - description: >-
      Companion dataset (typed relationship: separate but related resource) - the
      Bridge2AI-Voice Pediatric Dataset, a distinct PhysioNet project covering
      300 participants aged 2-18 with 23,533 derived recordings, collected at the
      Hospital for Sick Children under a separate pediatric protocol and REB
      approval. Current version 1.1.0, published 2026-05-01, DOI
      10.13026/h995-bt35 (latest-version DOI 10.13026/mf9s-5r03); landing page
      https://physionet.org/content/b2ai-voice-pediatric/. It is a separate
      cohort and project, not a version of this dataset.
  - description: >-
      Prior versions of this same resource (typed relationship: this dataset is a
      version of that resource) - Health Data Nexus v1.0
      (https://doi.org/10.57764/qb6h-em84) and PhysioNet v1.1
      (10.13026/249v-w155), v2.0.0, v2.0.1 and v3.0.0 (10.13026/k81f-qr68); the
      latest-version DOI for the PhysioNet series is 10.13026/37yb-1t42.
  - description: >-
      Controlled-access raw audio for the adult cohort, made available via
      Synapse at https://www.synapse.org/Synapse:syn72370534/ after DACO approval;
      pediatric raw audio via https://www.synapse.org/Synapse:syn73617068.
  - description: >-
      Training resources for using the dataset, including the Bridge2AI Voice
      Scholars program at https://www.b2aivoicescholars.org/, consortium
      webinars, and the Voice AI Symposium.
  - description: >-
      AI-readiness self-assessment against the "AI-readiness for Biomedical Data -
      Bridge2AI Recommendations" criteria. The published rating scores FAIRness
      100%, Provenance 100%, Characterization 80% (Data Quality criterion not
      met), Pre-model explainability 100%, Ethics 100%, Sustainability 50%
      (Domain-appropriate and Associated criteria not met) and Computability 75%
      (Contextualized criterion not met).
  - description: >-
      NIH RePORTER project record for the funding award, application ID 11376382,
      project number 3OT2OD032720-01S3, at
      https://reporter.nih.gov/project-details/11376382.