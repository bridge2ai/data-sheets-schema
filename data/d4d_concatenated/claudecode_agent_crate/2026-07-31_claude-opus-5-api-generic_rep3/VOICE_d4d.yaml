id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: >-
  Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
  information
description: >-
  Bridge2AI-Voice is a flagship, ethically sourced, demographically diverse voice
  dataset linked to health information, generated by the NIH Common Fund
  Bridge2AI program project "Voice as a Biomarker of Health." The dataset couples
  standardized acoustic tasks (voice, speech, breathing and cough recordings)
  with detailed participant metadata: clinical diagnoses spanning voice,
  neurological/neurodegenerative, mood/psychiatric and respiratory disorders,
  validated patient-reported outcome questionnaires, confounder surveys and
  demographics. Adult participants were recruited at five sites across North
  America. Version 3.1.0 of the adult dataset contains data for 833 participants.
  The public release is a feature-only, de-identified derivation: it contains
  spectrograms, mel spectrograms, MFCCs, pitch, loudness, periodicity,
  articulatory (EMA) estimates, phonetic posteriorgrams and static acoustic
  feature summaries stored as Parquet and TSV, together with tabular phenotype
  files and JSON data dictionaries. The original raw audio waveforms are not
  included in the PhysioNet release and are disseminated only through a separate
  controlled-access process.
