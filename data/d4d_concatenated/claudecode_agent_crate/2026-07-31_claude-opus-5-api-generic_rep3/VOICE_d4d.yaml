purposes:
  - description: >-
      To build a large-scale, multi-institutional, ethically sourced and diverse
      database of human voice, speech and respiratory sounds linked to multimodal
      health biomarkers, in order to fuel voice AI research and support the
      integration of voice as a biomarker of health into clinical care.
  - description: >-
      To enable the development, benchmarking and validation of clinically
      applicable machine-learning models that use voice to screen for, diagnose
      and monitor a broad range of health conditions, including vocal
      pathologies, neurological and neurodegenerative disorders, mood and
      psychiatric disorders, respiratory disorders and pediatric voice and speech
      disorders.
  - description: >-
      To introduce and standardise the field of "audiomics" by developing new
      standards for acoustic and voice data acquisition, interoperability,
      storage and analysis, including evidence-based recording protocols and new
      bioinformatics standards for voice data.
  - description: >-
      To address the ethical, legal and social challenges of voice AI, including
      voice re-identification risk, voice AI hacking, voice data sharing and
      privacy, and the influence of gender and racial diversity, and to develop
      new guidelines for consenting to voice data collection and sharing.
  - description: >-
      To provide an openly documented, AI-ready resource that is Findable,
      Accessible, Interoperable and Reusable (FAIR) for current and future
      generations of voice AI researchers, including those from underserved
      communities.

addressing_gaps:
  - description: >-
      Existing machine-learning studies of voice-based diagnosis produced
      promising results but relied on small- to medium-sized datasets; for
      laryngeal cancer screening and diagnosis, most studies reported training
      sets of fewer than 300 patients and only two used more than one data
      modality, limiting generalisation.
  - description: >-
      Prior voice datasets typically lacked the linked clinical, demographic and
      multimodal health metadata needed to train robust, clinically useful
      models, and lacked gold-standard clinical validation of diagnostic labels.
  - description: >-
      Industry-held voice datasets are large but private, which limits external
      auditing of models, verification of training-label accuracy, and assessment
      of fair representation of diverse populations.
  - description: >-
      There were no shared standards for how voice, speech and respiratory sounds
      are collected and measured, which made study comparison, meta-analysis and
      data pooling difficult.
  - description: >-
      Pediatric voice and speech data are especially sparse because of ethical
      concerns and acquisition challenges, and adult normative data cannot be
      generalised to children whose respiratory and laryngeal systems are still
      maturing.

tasks:
  - description: >-
      Disease detection and classification from voice-derived features, with
      diagnostic label categories covering vocal pathologies, neurological and
      neurodegenerative disorders, psychiatric and mood conditions, and
      respiratory disorders.
  - description: >-
      Training, fine-tuning and pretraining of AI/ML models on acoustic,
      phonetic, prosodic and articulatory representations of voice and speech.
  - description: >-
      Benchmarking and external validation of existing voice-biomarker algorithms
      on a clinically diverse, multi-site cohort collected with standardized
      tasks.
  - description: >-
      Exploratory research on acoustic correlates of disease, including
      representation learning, domain adaptation and multimodal integration with
      other health data.
  - description: >-
      Methodological research on fairness, robustness and AI safety in clinical
      voice models, including studies of bias related to demographic subgroups or
      recording conditions.

