updates:
  description: >-
    The dataset will be regularly updated and augmented through the end of the project in
    November 2026, with updates issued on a quarterly basis. Successive quarterly Beta
    releases each receive their own DOI in the Cell Maps for Artificial Intelligence
    Dataverse collection (May 2024, March 2025, June 2025, October 2025, June 2026), and
    within a release Dataverse minor and major version increments are used when files or
    metadata are revised. Planned enhancements include the addition of computed cell maps,
    which are explicitly absent from this release; immunofluorescence images for the iPSC
    lineage and AP-MS interactomes for the TNBC arm, both listed as "coming soon" on the
    project portal; and release of currently embargoed Perturb-seq deposits once
    pre-publication embargoes lift. Software packages will be versioned as the project
    progresses, and the version used to produce each dataset is referenced in that
    dataset's metadata.

retention_limit:
  description: >-
    Long-term preservation is committed in the University of Virginia Dataverse
    (LibraData), an NIH-approved generalist repository, supported by committed
    institutional funds. No deletion schedule or retention expiry is specified, and no
    file-level retention periods or embargo end dates are set on the deposited files. The
    only stated time-bounded limitation is temporary pre-publication embargo on certain
    external repository deposits. A standing risk to indefinite retention is noted by the
    hosting collection, which displays the notice that it "is under review for potential
    modification in compliance with Administration directives".

errata:
  - description: >-
      Documented revision to the June 2025 Data Release (DOI 10.18130/V3/F3TD5R), version
      2.1: "This revision includes adding RGB immunofluorescent images, corrections to
      ro-crate metadata, and changes to naming conventions." The three immunofluorescence
      archives in that release were correspondingly republished on 2025-10-22 under
      renamed files (cm4ai_ifimages_MDA-MB-468_{paclitaxel,untreated,vorinostat}.zip),
      superseding the earlier cm4ai-v0.6-beta-if-images-* archives of the March 2025
      release.
  - description: >-
      Divergent protein coverage figures across releases: the March 2025 release
      described immunofluorescence coverage of 563 proteins of interest per condition,
      while the June 2025, October 2025, and June 2026 releases describe 464 proteins for
      the same three archives. The project portal separately reports 523 proteins for the
      curated TNBC flagship IF dataset. These figures are not reconciled in the source
      documentation.
  - description: >-
      Internal metadata inconsistencies persisting in the June 2026 release that warrant
      correction: several component sub-crates carry citation strings and isPartOf links
      referring to earlier releases (March 2025, DOI 10.18130/V3/B35XWX; October 2025, DOI
      10.18130/V3/K7TGEM) rather than to this release; the release RO-Crate declares
      version 1.0 while Dataverse publishes version 2.0; the crate's contentSize string
      ("19.9 TB") disagrees with its own evi:totalContentSizeBytes
      (21,051,331,945,400 bytes, approximately 21.4 TB, matching the project portal's
      21.4 TB figure); the immunofluorescence sub-crate contentSize values (2.6, 3.2, and
      2.8 GB) disagree with the published Dataverse archive sizes (3.8, 4.6, and 4.2 GB);
      and the Data Governance Committee contact is spelled "Jilian Parker" in the crate
      versus "Jillian Parker" in the Dataverse description.
  - description: >-
      Display-date discrepancy: the CM4AI project portal lists the June 2026 Data Release
      as "Released on: June 17, 2025", whereas the authoritative Dataverse record gives a
      publication date of 2026-06-17 and a version 2 release time of
      2026-07-15T20:28:19Z.

version_access:
  description: >-
    All prior versions and prior quarterly releases remain individually citable and
    accessible. Within the University of Virginia Dataverse, each release is a separate
    deposit with its own persistent DOI, its own version history (accessible through the
    Versions tab, with a version-differences viewer), and its own published file
    inventory: May 2024 Data Release (10.18130/V3/DXWOS5); March 2025 Data Release (Beta)
    (10.18130/V3/B35XWX, version 1.4, six files); June 2025 Data Release (Beta)
    (10.18130/V3/F3TD5R, version 2.1, twenty-one files); October 2025 Data Release (Beta)
    (10.18130/V3/K7TGEM, version 2.1, eight files); and this June 2026 Data Release (Beta)
    (10.18130/V3/HIGT4C, version 2.0, ten files). Files are not removed from previously
    published versions when a new version is created. FAIRSCAPE additionally mints ARK
    persistent identifiers for the release crate, each component sub-crate, and each
    dataset, computation, software, and schema entity, which resolve to human- and
    machine-readable landing pages carrying full metadata and provenance; DOIs are planned
    as supplementary persistent identifiers for final-state publishable work. Software
    versions used to produce each dataset are referenced in that dataset's metadata, with
    alpha-level tools archived in GitHub and production-ready tools in Zenodo.

external_resources:
  - description: >-
      CM4AI project portal — https://cm4ai.org — providing project overview, people, data
      releases, tools, product documentation, publications, and learning resources; built
      on the U-BRITE platform at the University of Alabama at Birmingham.
  - description: >-
      Project description publication — Clark T, Mohan J, Schaffer L, Obernier K, Al Manir
      S, et al. "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell
      Architecture from Disease-Relevant Cell Lines", bioRxiv 2024.05.21.589311,
      doi:10.1101/2024.05.21.589311. This is the required citation for reuse of the data.
  - description: >-
      Perturbation atlas publication — Nourreddine S, Doctor Y, Dailamy A, Forget A, Lee
      YH, et al. "A Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells",
      bioRxiv 2024.11.03.621734, doi:10.1101/2024.11.03.621734, PMCID PMC11580897.
  - description: >-
      Methodological antecedent — Qin Y, Huttlin EL, Winsnes CF, et al. "A multi-scale map
      of cell structure fusing protein images and interactions", Nature 600:536-542 (2021),
      doi:10.1038/s41586-021-04115-9, which established the MuSIC proof of concept for
      fusing immunofluorescence and AP-MS modalities.
  - description: >-
      Methodological antecedent — Schaffer LV, Hu M, Qian G, et al. "Multimodal cell maps
      as a foundation for structural and functional genomics", Nature 642:222-231 (2025),
      doi:10.1038/s41586-025-08878-3. This paper reports a matched AP-MS and
      immunofluorescence cell map of over 5,100 proteins in U2OS osteosarcoma cells with
      275 resolved assemblies, together with a Multiscale Integrated Cell visualization
      portal (http://musicmaps.ai/u2os-cellmap/). It is a distinct dataset in a different
      cell line, is not part of this release, and is not referenced by the CM4AI release
      metadata; it is listed here because it demonstrates the analytic framework the CM4AI
      data are designed to feed.
  - description: >-
      Cell Mapping Toolkit / MuSIC pipeline source code —
      https://github.com/idekerlab/cellmaps_pipeline — a series of pip-installable Python
      packages implementing the end-to-end map construction pipeline, with user
      documentation at https://cellmaps-pipeline.readthedocs.io/.
  - description: >-
      FAIRSCAPE AI-readiness framework — https://fairscape.github.io — client
      (FAIRSCAPE-CLI) and server packages for RO-Crate packaging, ARK identifier minting,
      and evidence-graph provenance; MIT licensed, copyright the Rector and Visitors of
      the University of Virginia.
  - description: >-
      Integrative Modeling Platform (IMP) — http://integrativemodeling.org — open source
      package used for integrative structure modeling of protein assemblies.
  - description: >-
      Network Data Exchange (NDEx) — https://ndexbio.org — the sharing platform for cell
      maps, viewable in a web browser or via Cytoscape, HiView, and the Python ndex2
      library.
  - description: >-
      NIH RePORTER project record — https://reporter.nih.gov/project-details/11211616 —
      for award OT2OD032742, "Bridge2AI: Cell Maps for AI (CM4AI) Data Generation Project".
  - description: >-
      NIH Bridge2AI program — https://commonfund.nih.gov/bridge2ai — the NIH Common Fund
      program of which CM4AI is the Functional Genomics Data Generation Project.
  - description: >-
      License text — Creative Commons Attribution-NonCommercial-ShareAlike 4.0
      International, https://creativecommons.org/licenses/by-nc-sa/4.0/.
  - description: >-
      Controlled vocabulary terms indexed for this dataset: MeSH D001943 (Breast
      Neoplasms), D057026 (Induced Pluripotent Stem Cells), D064113 (CRISPR-Cas Systems),
      D013058 (Mass Spectrometry), D005453 (Fluorescent Antibody Technique), D017239
      (Paclitaxel), D000077337 (Vorinostat); EDAM topic_0121 (Proteomics), topic_3170
      (RNA-Seq), topic_3320 (Functional genomics), topic_3474 (Machine learning);
      Cellosaurus CVCL_0419 (MDA-MB-468) and CVCL_B5P3 (KOLF2.1J).

file_collections:
  - id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-paclitaxel
    description: >-
      EndoTag AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468
      Cells Upon Paclitaxel Perturbation. Affinity purification mass spectrometry raw data
      from endogenously tagged MDA-MB-468 cells under paclitaxel perturbation, focused on
      drug-induced interactome rewiring of chromatin modifiers in a triple-negative breast
      cancer context. Four biological replicates; each batch includes an untagged parental
      control, ten chromatin-modifier tagged cell lines, and a positive control tagged
      line, with DMSO-treated vehicle controls. Author Richa Tiwari; version 1.0;
      datePublished 2026-05-22; contentSize 441.2 GB. The provenance graph records 117
      sample inputs and 555 dataset outputs; these are entity counts, not a file
      inventory. Mirrored at MassIVE MSV000101915 under CC0. Distributed in the Dataverse
      deposit as cm4ai_apms_MDA-MB-468_paclitaxel.zip (113.3 KB metadata package, MD5
      8642317c321126213240af4837030a53). Unpublished data at time of release.
  - id: https://fairscape.net/api/ark:59853/rocrate-endotag-ap-ms-in-mda-mb-468-cells-vorinostat
    description: >-
      EndoTag-AP-MS Profiling of Chromatin Modifier Interactome Rewiring in MDA-MB-468
      Cells Upon Vorinostat Perturbation. Affinity purification mass spectrometry raw data
      from endogenously tagged MDA-MB-468 cells under vorinostat perturbation, with the
      same four-replicate design and control structure as the paclitaxel arm. Author Richa
      Tiwari; version 1.0; datePublished 2026-05-22; contentSize 532.5 GB. The provenance
      graph records 138 sample inputs and 718 dataset outputs; these are entity counts,
      not a file inventory. Mirrored at MassIVE MSV000101917 under CC0. Distributed as
      cm4ai_apms_MDA-MB-468_vorinostat.zip (135.8 KB metadata package, MD5
      b941f28d6f19c563d1222f7aff0c57b6). Unpublished data at time of release.
  - id: https://fairscape.net/api/ark:59853/rocrate-paclitaxel-if-data-release
    description: >-
      Paclitaxel IF Images. Spatial localization of 464 proteins of interest in
      MDA-MB-468 breast cancer cells treated with paclitaxel, imaged by
      immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg
      Lab at Stanford University. Channels: DAPI nuclei (blue), calreticulin antibody
      endoplasmic reticulum (yellow), tubulin antibody microtubules (red), antibody
      against protein of interest (green). Authors Hansen JN, Axelsson U, Johannesson A,
      Fall J, Ballllosera Navarro F, Lundberg E; version 0.1.0; datePublished 2025-02-28;
      crate contentSize 2.6 GB. The provenance graph records 468 experiments and 17,685
      image entity outputs. Distributed as cm4ai_ifimages_MDA-MB-468_paclitaxel.zip,
      3.8 GB, published 2026-07-15, MD5 6c1a86520eec2696ec19444eb8a8b428; note that the
      crate contentSize and the published archive size disagree.
  - id: https://fairscape.net/api/ark:59853/rocrate-untreated-if-data-release
    description: >-
      Untreated IF Images. Spatial localization of 464 proteins of interest in untreated
      MDA-MB-468 breast cancer cells, imaged by ICC-IF and confocal microscopy in the
      Lundberg Lab at Stanford University, with the same four-channel staining scheme.
      Authors Hansen JN, Axelsson U, Johannesson A, Fall J, Ballllosera Navarro F,
      Lundberg E; version 0.1.0; datePublished 2025-02-28; crate contentSize 3.2 GB. The
      provenance graph records 468 experiments and 15,905 image entity outputs.
      Distributed as cm4ai_ifimages_MDA-MB-468_untreated.zip, 4.6 GB, published
      2026-07-15, MD5 6d066e6b9d762284c6aa5d0b44565568; note that the crate contentSize
      and the published archive size disagree.
  - id: https://fairscape.net/api/ark:59853/rocrate-vorinostat-if-data-release
    description: >-
      Vorinostat IF Images. Spatial localization of 464 proteins of interest in MDA-MB-468
      breast cancer cells treated with vorinostat, imaged by ICC-IF and confocal
      microscopy in the Lundberg Lab at Stanford University, with the same four-channel
      staining scheme. Authors Hansen JN, Axelsson U, Johannesson A, Fall J, Ballllosera
      Navarro F, Lundberg E; version 0.1.0; datePublished 2025-02-28; crate contentSize
      2.8 GB. The provenance graph records 468 experiments and 17,849 image entity
      outputs. Distributed as cm4ai_ifimages_MDA-MB-468_vorinostat.zip, 4.2 GB, published
      2026-07-15, MD5 df79632753989ef23b0a3df6604d4af1; note that the crate contentSize
      and the published archive size disagree.
  - id: https://fairscape.net/api/ark:59853/rocrate-sec-ms-characterization-of-kolf2-neuronal-and-cardiomyocyte-differentiation-cm4ai-yjftt2oec6c
    description: >-
      SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation. Size
      exclusion chromatography coupled to mass spectrometry mapping protein-protein
      interaction networks across differentiation stages of KOLF2.1J human iPSCs:
      parental (undifferentiated, replicates 1-4), neural progenitor cells (replicates
      1-2), neurons (replicates 1-3), and cardiomyocytes (replicates 1-2). Acquired on a
      Bruker timsTOF platform; quantitative analysis in Spectronaut; downstream analysis in
      R using MSstats-compatible formats. Author Antoine Forget; version 1.0;
      datePublished 2026-05-27; contentSize 1.11 TB. The provenance graph records 862
      dataset outputs. Published by MassIVE as MSV000100676 under CC0. Distributed as
      cm4ai_mass-spec_KOLF2.zip (171.8 KB metadata package, MD5
      f250bf0b04f516f7462d30432441fc0e).
  - id: https://fairscape.net/api/ark:59853/rocrate-data-from-treated-human-cancer-cells-jan-26
    description: >-
      SEC-MS of MDA-MB-468 following treatment with vorinostat or paclitaxel. Size
      exclusion chromatography-mass spectrometry generated in the Nevan Krogan laboratory
      at UCSF across nine experiments — control replicates 1, 2 and 4; paclitaxel
      replicates 1-3; vorinostat replicates 1-3 — yielding nine quantitative reports plus
      raw acquisitions. Authors Forget A, Obernier K, Krogan N; version 1.5; identifier
      doi:10.25345/C5348GV4S; contentSize 910 GB; published by MassIVE as MSV000098237,
      with FTP access at ftp://massive-ftp.ucsd.edu/v10/MSV000098237/. The provenance
      graph records 18 datasets, 9 experiments, 9 computations and 9 schemas. Distributed
      as cm4ai_mass-spec_MDA-MB-468.zip (93.9 KB metadata package, MD5
      9aed30b6e8a91b151155316aae657ea5).
  - id: https://fairscape.net/api/ark:59853/rocrate-sra-data-for-perturbation-cell-atlas-58RmCGMQBj
    description: >-
      Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells - Raw Sequence Data.
      Raw single-cell sequencing data from the expressed genome-scale CRISPRi Perturbation
      Cell Atlas in KOLF2.1J human iPSCs, mapping transcriptional and fitness phenotypes
      for 11,739 targeted genes. Version 0.6; contentSize 16.7 TB. The provenance graph
      records 192 sample inputs and 103 sequence dataset outputs. Destined for the NCBI
      Sequence Read Archive but currently recorded with url "Embargoed". Distributed as
      cm4ai_perturb-seq_KOLF2_raw_sra.zip (73.3 KB metadata package, MD5
      8bb3f365f01fb8bbbd2ac6a535059305). Associated publication: Nourreddine S et al.,
      bioRxiv 2024.11.03.621734.
  - id: https://fairscape.net/api/ark:59853/rocrate-a-perturbation-cell-atlas-of-human-induced-pluripotent-stem-cells
    description: >-
      Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells - Perturb Seq. The
      aggregated expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human
      iPSCs, mapping transcriptional and fitness phenotypes associated with 11,739 targeted
      genes, validated via phenotypic, protein-interaction, and metabolic tracing assays.
      Version 1.0; publisher FigShare (https://figshare.com/s/ee85bb1880921326249b);
      contentSize 177.35 GB. Produced by a single documented aggregation computation from
      90 per-chip, per-channel molecule datasets, yielding a pan-genome aggregated dataset
      and a reduced-size variant, with an accompanying schema. Distributed as
      cm4ai_perturb-seq_KOLF2_cell_atlas.zip (30.2 KB metadata package, MD5
      291a362842a176a4fcccaf2cdc1dedde).