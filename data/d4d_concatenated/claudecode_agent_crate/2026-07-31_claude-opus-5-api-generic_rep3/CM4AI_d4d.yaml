purposes:
  - description: >-
      To deliver machine-readable hierarchical maps of human cell architecture as
      AI-ready data, produced from multimodal interrogation of proteins involved in
      cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines
      under perturbed and unperturbed conditions.
  - description: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the
      grand challenge of interpretable genotype-phenotype learning, addressing the fact
      that machine learning models in genomics and precision medicine are typically
      difficult-to-interpret "black boxes".
  - description: >-
      To broadly stimulate research and development in "visible" machine learning systems
      that are informed by multi-scale cell and tissue architecture rather than being
      opaque predictors.
  - description: >-
      To develop and apply an ethical, FAIR, AI-ready data packaging approach — deep
      provenance graphs, rich metadata, and RO-Crate packaging via FAIRSCAPE — which the
      project describes as providing important and reusable enabling capabilities, with
      datasets and software made available to the research community under minimally
      restrictive terms consistent with ethical guidelines, researcher attribution, and
      research integrity.
  - description: >-
      To serve as the Functional Genomics Data Generation Project within the NIH
      Bridge2AI program, contributing ethically produced datasets, tools, standards, and
      training to the biomedical AI/ML community.

addressing_gaps:
  - description: >-
      Machine learning models that predict phenotype from genotype are typically "black
      boxes" that do not expose the cellular mechanisms by which such translation occurs.
      This dataset supplies the structural knowledge of cell architecture needed to build
      interpretable, mechanism-grounded models.
  - description: >-
      Much of human subcellular architecture remains uncharted, and complementary mapping
      technologies (biochemical interaction, imaging, perturbation) have typically been
      applied separately rather than to a matched set of proteins in a matched cellular
      context.
  - description: >-
      Existing biomedical datasets frequently lack the provenance, characterization,
      validation, licensing, and ethical documentation required for reliable AI/ML reuse.
      CM4AI addresses this by defining and applying explicit AI-readiness criteria (FAIR,
      provenanced, characterized, explainable, ethical).
  - description: >-
      A lack of matched multi-modal data across treatment conditions and differentiation
      states limits the study of how cell architecture is remodeled by disease processes,
      drug treatment, and genetic perturbation.

tasks:
  - description: >-
      Construction of hierarchical, multi-scale maps of human cell architecture
      (directed acyclic graphs whose nodes are protein assemblies at scales from small
      complexes to organelles) by integrating protein-protein interaction and protein
      localization modalities.
  - description: >-
      Interpretable genotype-phenotype learning, including the development of "visible"
      machine learning systems and visible neural networks (VNNs) whose internal
      structure corresponds to cell and tissue architecture.
  - description: >-
      Analysis of how protein complexes, interaction networks, and subcellular
      localization are rewired under chemotherapy treatment (paclitaxel, vorinostat) and
      across iPSC differentiation states (undifferentiated, NPC, neuron, cardiomyocyte).
  - description: >-
      Mapping of transcriptional and fitness phenotypes associated with genome-scale
      CRISPRi gene perturbation in human induced pluripotent stem cells.
  - description: >-
      Downstream applications in human genomics, including interpretation of genetic
      variants and mutations against a structured reference of cell architecture.

acquisition_methods:
  - description: >-
      Directly observed and experimentally generated laboratory measurements. All
      instances are primary measurements made by CM4AI laboratories on commercially
      obtained, de-identified human cell lines; no data are derived from human subjects
      or from third-party human-participant sources.
  - description: >-
      Affinity purification mass spectrometry (AP-MS) on endogenously tagged MDA-MB-468
      cells, profiling drug-induced interactome rewiring of chromatin modifiers. AP-MS in
      this release covers only the two treated arms (paclitaxel and vorinostat); for each
      of those arms, each batch includes an untagged parental control, ten
      chromatin-modifier tagged cell lines, and a positive control tagged line, with
      DMSO-treated samples as vehicle controls, and experiments were performed in four
      biological replicates.
  - description: >-
      Size exclusion chromatography coupled to mass spectrometry (SEC-MS) for
      proteome-wide complex and interaction mapping, performed on MDA-MB-468 cells
      (untreated, paclitaxel, vorinostat) and on KOLF2.1J iPSCs and their NPC, neuron,
      and cardiomyocyte derivatives. iPSC-lineage SEC-MS was acquired on a Bruker timsTOF
      platform with quantitative analysis in Spectronaut; sample groups comprised
      Parental (replicates 1-4), NPC (replicates 1-2), Neuron (replicates 1-3), and
      Cardiomyocyte (replicates 1-2).
  - description: >-
      Immunofluorescence-based staining (ICC-IF) and confocal microscopy of MDA-MB-468
      cells, using the Human Protein Atlas antibody resource and automated fixation and
      permeabilization protocols implemented on a pipetting robot. Each image comprises
      four channels: DAPI for nuclei (blue), calreticulin antibody for endoplasmic
      reticulum (yellow), tubulin antibody for microtubules (red), and an antibody
      against the protein of interest (green).
  - description: >-
      Single-cell CRISPRi perturbation screens (Perturb-seq) using a lentiviral guide RNA
      library and inducible dCas9-expressing cell lines, read out by single-cell RNA
      sequencing on the 10x Genomics 3'HT platform.

collection_mechanisms:
  - description: >-
      Mass spectrometry instrumentation for proteomics: affinity purification mass
      spectrometry (AP-MS) and size exclusion chromatography-mass spectrometry (SEC-MS).
      iPSC-lineage SEC-MS used a Bruker timsTOF platform.
  - description: >-
      Confocal fluorescence microscopy with automated liquid handling, using Human
      Protein Atlas primary antibodies and reference-marker counterstains for nucleus,
      endoplasmic reticulum, and microtubules.
  - description: >-
      CRISPR/Cas9-based genetic perturbation: a designed CRISPR lentiviral library
      targeting chromatin factors (six guide RNAs per gene in the initial 100-gene
      design), delivered into MDA-MB-468 and KOLF2.1J lines engineered to express
      inducible dCas9, with single-cell transcriptomic readout via the 10x Genomics 3'HT
      kit.
  - description: >-
      Software pipelines as collection and integration instruments: the Multi-Scale
      Integrated Cell (MuSIC) pipeline, whose segments download PPI networks and IF
      images from the contributing laboratories' deposition archives, generate
      per-modality embeddings, compute a per-protein co-embedding, perform protein
      community detection and hierarchy creation, and evaluate the resulting hierarchy;
      and the FAIRSCAPE client (FAIRSCAPE-CLI) and server, which validate inputs and
      capture metadata, persistent identifiers, and provenance for each pipeline segment.

