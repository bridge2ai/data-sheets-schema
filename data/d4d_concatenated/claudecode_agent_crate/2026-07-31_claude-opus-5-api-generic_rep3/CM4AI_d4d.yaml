name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI;
  CM4AI.org), the Functional Genomics Grand Challenge Data Generation Project of the
  U.S. National Institutes of Health Bridge2AI program. CM4AI generates multi-modal data
  including protein-protein interaction (PPI), spatial protein localization, and genetic
  perturbation data in MDA-MB-468 triple-negative breast cancer cells (untreated, or
  treated with paclitaxel or vorinostat) and in KOLF2.1J human induced pluripotent stem
  cells (undifferentiated, or differentiated to neural progenitor cells, neurons, and
  cardiomyocytes). This Beta release includes: Perturb-seq data for MDA-MB-468 breast
  cancer cells (+/- treatment) and undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS
  data for MDA-MB-468 breast cancer cells (+/- treatment), undifferentiated KOLF2.1J
  iPSCs, and iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes;
  AP-MS data for MDA-MB-468 breast cancer cells with treatment; and immunofluorescence
  (IF) images of 464 proteins of interest in MDA-MB-468 breast cancer cells (+/-
  treatment). CM4AI output data are packaged with provenance graphs and rich metadata as
  AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. Computed cell maps
  are not included in this release. CM4AI is a collaboration of UCSD, UCSF, Stanford,
  UVA, Yale, UA Birmingham, Simon Fraser University, and the Hastings Center.
