ethical_reviews:
  - name: ethical_review_hastings_center
    contact_person: https://orcid.org/0000-0002-7080-8801
    reviewing_organization: d4d:organization/the-hastings-center
    review_details:
      - >-
        Every structured release page records "Ethical Review: Vardit Ravitsky
        (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon
        (jean-christophe_belisle-pipon@sfu.ca)". The release RO-Crate repeats
        this in its ethicalReview field, spelling the first name "Vardit
        Ravistky".
      - >-
        "The Ethics team worked closely with Data Acquisition, Tools, and
        Standards Modules to develop a plan for ethical preparation, licensing,
        dissemination, and Data Access supervision of CM4AI datasets. This plan
        balances the openness of the data produced, with protection of the
        intellectual property, and supervision and monitoring of potential
        efforts at commercialization."
  - name: ethical_review_simon_fraser
    contact_person: https://orcid.org/0000-0002-8965-8153
    reviewing_organization: d4d:organization/simon-fraser-university
    review_details:
      - >-
        Jean-Christophe Belisle-Pipon (Simon Fraser University) is the second
        named ethical review contact on all structured release pages and in the
        release RO-Crate.
      - >-
        "The Ethics team is instrumental in formulating the CM4AI Life Cycle, a
        framework designed to elucidate governance milestones throughout the data
        generation and AI system development processes."

data_protection_impacts:
  - name: data_protection_assessment
    impact_details:
      - >-
        No personal data are processed. The data are laboratory measurements on
        commercially available, de-identified human cell lines and are
        "considered to be de-identified as they cannot be matched, with current
        knowledge, to a human subject".
      - >-
        Confidentiality level is declared Unrestricted and all released files
        are public, so no access-control or re-identification safeguards are
        applied to the distributed content.
      - >-
        A Data Access Committee supervises ethical matters related to dataset
        distribution and potential dual licensing for commercial use, and a Data
        Governance Committee contact is named on every release.

human_subject_research:
  name: human_subject_research_status
  involves_human_subjects: false
  irb_approval:
    - >-
      "Exempt - research with commercially available de-identified human cell
      lines does not constitute human subjects research." No IRB protocol number
      appears anywhere in the corpus.
  ethics_review_board:
    - Vardit Ravitsky (ravitskyv@thehastingscenter.org)
    - Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca)
  special_populations:
    - >-
      None. The release RO-Crate records d4d:atRiskPopulations "None - no human
      subjects involved; commercially sourced de-identified cell lines only."
  regulatory_compliance:
    - "Human Subjects: No (stated on every structured release page)."
    - "De-identified Samples: Yes."
    - "FDA Regulated: No."
    - >-
      humanSubjectResearch in the release RO-Crate: "None - data collected from
      commercially available cell lines".
  description: >-
    Both source cell lines are described as ethically sourced. "CM4AI has elected
    to use the cancer cell line MDA-MB-468 (+/- treatment with paclitaxel and
    vorinostat) and the iPSC line KOLF2.1J (+/- neuronal and cardiomyocytic
    differentiation), both of which have been ethically sourced."

informed_consent:
  - name: informed_consent_status
    consent_type:
      - Not applicable
    consent_documentation:
      - >-
        "Not applicable - data collected from commercially available
        de-identified human cell lines (KOLF2.1J iPSC and MDA-MB-468). No
        primary human subjects research conducted under this release."
    consent_scope:
      - >-
        Consent for the original derivation of the two cell lines rests with
        their upstream providers (ATCC for MDA-MB-468, HipSci for KOLF2.1J); no
        consent instrument is reproduced in the corpus.

at_risk_populations:
  name: at_risk_population_status
  at_risk_groups_included: false
  special_protections:
    - >-
      "None - no human subjects involved; commercially sourced de-identified cell
      lines only."
  description: >-
    No at-risk or vulnerable population is enrolled or represented, because the
    programme enrolls no human participants at all.

participant_privacy:
  - name: participant_privacy_status
    anonymization_method:
      - >-
        Not applicable at the level of the released data: both source cell lines
        are supplied to the project already de-identified by their commercial or
        consortium providers.
    reidentification_risk:
      - >-
        Assessed as effectively absent by the project: the data "are considered
        to be de-identified as they cannot be matched, with current knowledge, to
        a human subject". The corpus records no formal re-identification risk
        analysis.
    data_linkage:
      - >-
        No linkage to individual-level human records is performed or possible
        from the released content.

preprocessing_strategies:
  - name: music_integration_pipeline
    preprocessing_details:
      - >-
        The MuSIC (Multi-Scale Integrated Cell) pipeline is the programme's
        integration route from raw modality data to cell maps. Its published
        segments are: download PPI and image data from the Krogan and Lundberg
        laboratory deposition archives; generate embeddings, using node2vec on
        the PPI networks and a Human Protein Atlas deep learning model on the IF
        images, each reducing dimensionality; co-embed the two representations
        using contrastive deep learning so that "the original embeddings can be
        reconstructed with minimal information loss and proteins with similar PPI
        and image embeddings have similar co-embeddings"; perform protein
        community detection on all-by-all similarities in co-embedding space to
        produce the hierarchy; and evaluate the hierarchy by alignment to Gene
        Ontology and Reactome and by LLM-based naming.
      - >-
        The pipeline outputs are not part of the captured releases: "Computed
        cell maps not included in this release."
    used_software:
      - id: https://github.com/idekerlab/cellmaps_pipeline
        name: Cell Mapping Toolkit (cellmaps_pipeline)
        url: https://github.com/idekerlab/cellmaps_pipeline
        description: >-
          Implements the end-to-end MuSIC pipeline as a series of Python PyPI
          packages with full user documentation.
  - name: mass_spectrometry_processing
    preprocessing_details:
      - >-
        For the KOLF2 differentiation SEC-MS data, "Raw data was processed using
        Spectronaut; downstream analysis was conducted in R using
        MSstats-compatible formats."
      - >-
        The SEC-MS crate for treated MDA-MB-468 cells registers 9 computations
        alongside 18 datasets, 9 experiments and 9 schemas, indicating a
        per-condition processing step recorded in the provenance graph.
  - name: fairscape_ai_readiness_packaging
    preprocessing_details:
      - >-
        "The client-side package, FAIRSCAPE-CLI, is called when any computation
        or coherent set of computations in the pipeline is completed, and it is
        passed metadata which defines schemas in JSON-Schema for the datasets in
        the computational unit, as well as the inputs, computations, software,
        models, and outputs. FAIRSCAPE-CLI creates an RO-Crate package with the
        datasets, metadata, and software - or resolvable references to these
        components - and unique stubs for identifier creation on each of these
        components."
      - >-
        "The RO-Crates are then sent to the FAIRSCAPE server where they are
        registered and assigned persistent, resolvable, globally unique
        persistent identifiers (PIDs) ... The PID system currently in use is the
        ARK scheme - with DOIs a future feature as supplementary PIDs for
        final-state publishable work. Lastly, the server computes end-to-end
        entailments on each RO-Crate's provenance as expressed in the EVI
        Evidence Graph Ontology and links them together where possible."
      - >-
        The June 2026 release crate reports 1,976 computation or experiment steps
        and 6 software instances recorded in its provenance graph.
    used_software:
      - id: https://fairscape.github.io
        name: FAIRSCAPE
        version: 1.1.3
        license: MIT
        url: https://fairscape.github.io
        description: >-
          AI-readiness packaging framework producing RO-Crates with EVI
          provenance graphs and ARK identifiers.

cleaning_strategies:
  - name: experimental_quality_control
    cleaning_details:
      - >-
        AP-MS batches are internally controlled: each includes an untagged
        parental control, ten chromatin modifier tagged cell lines and a positive
        control tagged line, with DMSO-treated samples as vehicle controls across
        all AP-MS experiments, in four biological replicates.
      - >-
        For the single-cell CRISPR screens the project article states that "The
        resulting data are currently being QCed"; the corpus records no final QC
        criteria or exclusion counts for the released Perturb-seq data.
  - name: metadata_curation_and_correction
    cleaning_details:
      - >-
        Release metadata are themselves cleaned between releases: the June 2025
        release is explicitly "a revision ... includes adding RGB immunofluorescent
        images, corrections to ro-crate metadata, and changes to naming
        conventions."

labeling_strategies:
  - name: llm_assisted_assembly_annotation
    data_annotation_protocol:
      - >-
        In the hierarchy evaluation step of the MuSIC pipeline, "cell maps are
        aligned to known protein function and pathway resources, including the
        Gene Ontology (GO) and Reactome, to determine protein assemblies in the
        cell map with high overlap with known cell biology", and "assemblies in
        the cell maps are annotated using a large language model (LLM) approach
        that we developed to name sets of proteins and assign a name confidence
        score."
    labeling_details:
      - >-
        Labels of this kind attach to computed cell maps, which are not included
        in any release captured here. No per-instance labels are distributed with
        the release payloads.
    annotator_demographics:
      - Not recorded in the corpus.
  - name: structured_ontology_annotation_of_releases
    data_annotation_protocol:
      - >-
        Release-level keywords are mapped to public ontology terms in the
        Dataverse metadata, for example AI and artificial intelligence to NCI
        Thesaurus NCIT_C16309, affinity purification to BAO_0002603, AP-MS to
        Software Ontology SWO_1100012, breast cancer to LOINC LA14283-8,
        cardiomyocyte to CL_0000746, CRISPR/Cas9 to BAO_0010249, induced
        pluripotent stem cell and iPSC to EFO_0004905, machine learning to
        OBI_0002587, mass spectroscopy to MeSH D013058, neural progenitor cell
        and NPC to CL_0011020, neuron to CL_0000540, paclitaxel to CHEBI_45863,
        perturb-seq and perturbation sequencing to EFO_0008860, protein-protein
        interaction to NCIT_C18469, protein localization to GO_0008104,
        single-cell RNA sequencing and scRNAseq to EFO_0008913, and vorinostat
        to CHEBI_45716.
      - >-
        The release RO-Crate additionally declares subject terms as MeSH records
        (Breast Neoplasms D001943, Induced Pluripotent Stem Cells D057026,
        CRISPR-Cas Systems D064113, Mass Spectrometry D013058, Fluorescent
        Antibody Technique D005453, Paclitaxel D017239, Vorinostat D000077337),
        EDAM topics (Proteomics topic_0121, RNA-Seq topic_3170, Functional
        genomics topic_3320, Machine learning topic_3474) and Cellosaurus cell
        lines (MDA-MB-468 CVCL_0419, KOLF2.1J CVCL_B5P3).
    labeling_details:
      - >-
        This is dataset-level semantic annotation for discovery, not instance-
        level labelling of the measurements.

raw_sources:
  - name: massive_raw_mass_spectrometry
    access_url: https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915
    raw_data_details:
      - >-
        Raw AP-MS data for the paclitaxel condition, 441.2 GB, MassIVE
        MSV000101915, released at MassIVE under CC0 1.0.
      - >-
        The corresponding vorinostat deposit is MassIVE MSV000101917, 532.5 GB,
        also CC0 1.0.
  - name: massive_raw_sec_ms
    access_url: https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676
    raw_data_details:
      - >-
        SEC-MS characterization of KOLF2 neuronal and cardiomyocyte
        differentiation, 1.11 TB, MassIVE MSV000100676, CC0 1.0, publisher
        MassIVE.
      - >-
        SEC-MS of MDA-MB468 following treatment of vorinostat or paclitaxel, 910
        GB, doi:10.25345/C5348GV4S, MassIVE MSV000098237, CC BY-NC-SA 4.0, with
        content at ftp://massive-ftp.ucsd.edu/v10/MSV000098237/.
  - name: embargoed_raw_sequence_data
    raw_data_details:
      - >-
        Raw sequence data for the Perturbation Cell Atlas, 16.7 TB, version 0.6,
