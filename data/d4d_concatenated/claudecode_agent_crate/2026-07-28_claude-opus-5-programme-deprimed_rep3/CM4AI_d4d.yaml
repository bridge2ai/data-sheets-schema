    description: >-
      Current quarterly release. "This dataset is the June 2026 Data Release of
      Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org), the Functional
      Genomics Grand Challenge in the NIH Bridge2AI program. CM4AI is generating
      multi-modal data including protein-protein interaction (PPI), spatial
      localization, and genetic perturbation data in MDA-MB-468 breast cancer
      cells (+/- paclitaxel or vorinostat) and iPSCs (+/- differentiation). This
      Beta release includes: Perturb-seq data for MDA-MB-468 breast cancer cells
      +/- treatment and undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data
      for MDA-MB-468 breast cancer cells +/- treatment, undifferentiated KOLF2.1J
      iPSCs, and iPSC-derived neuron progenitor cells (NPCs), neurons, and
      cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer cells + treatment;
      IF images in MDA-MB-468 breast cancer cells +/- treatment." The addition of
      AP-MS is what distinguishes this release from October 2025.

      Ten public ZIP archives are distributed on Dataverse; they are itemised in
      this datasheet's file_collections. The Dataverse payload totals only about
      16.6 GB because the mass-spectrometry, AP-MS and Perturb-seq archives are
      RO-Crate metadata packages that reference much larger payloads deposited
      at MassIVE, the NCBI Sequence Read Archive and Figshare. The release
      RO-Crate itself reports 53,877 datasets, 1,976 computation/experiment
      steps, 6 software instances, 20 schemas, 55,859 total entities and
      21,051,331,945,400 bytes of total content, while its own contentSize field
      states 19.9 TB; only 8 of 55,859 entities carry checksums.

      Linked sub-crates registered as parts of this release, each with its own
      ARK identifier: EndoTag AP-MS profiling of chromatin modifier interactome
      rewiring in MDA-MB-468 cells upon paclitaxel perturbation (MassIVE
      MSV000101915, 441.2 GB, 560 parts, author Richa Tiwari, published
      2026-05-22, CC0); the equivalent vorinostat sub-crate (MassIVE
      MSV000101917, 532.5 GB, 723 parts, published 2026-05-22, CC0); SEC-MS
      characterization of KOLF2 neuronal and cardiomyocyte differentiation
      (MassIVE MSV000100676, 1.11 TB, 867 parts, author Antoine Forget,
      published 2026-05-27, CC0); SEC-MS of MDA-MB468 following treatment of
      vorinostat or paclitaxel (doi:10.25345/C5348GV4S, MassIVE MSV000098237,
      910 GB, 45 parts, version 1.5, authors Forget A, Obernier K, Krogan N, CC
      BY-NC-SA 4.0); Perturbation Cell Atlas of Human Induced Pluripotent Stem
      Cells - Raw Sequence Data (16.7 TB, version 0.6, access recorded as
      "Embargoed"); Perturbation Cell Atlas of Human Induced Pluripotent Stem
      Cells - Perturb Seq (177.35 GB, version 1.0, published by FigShare at
      https://figshare.com/s/ee85bb1880921326249b); and Paclitaxel, Untreated
      and Vorinostat IF Images sub-crates from the Lundberg Lab at Stanford.

