        description: >-
          New in the June 2026 release. Raw AP-MS data generated from
          endogenously tagged MDA-MB-468 cells, focused on drug-induced
          interactome rewiring of chromatin modifiers relevant to the
          triple-negative breast cancer context. All AP-MS experiments were
