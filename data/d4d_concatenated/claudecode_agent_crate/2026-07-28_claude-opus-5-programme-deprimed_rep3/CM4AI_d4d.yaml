name: cm4ai_data_release_programme
title: Cell Maps for Artificial Intelligence (CM4AI) - Quarterly Data Release Programme
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data
  Generation Project of the U.S. National Institutes of Health Common Fund
  Bridge2AI program. This datasheet describes the CM4AI data-release programme
  as an ongoing series, not any single release. CM4AI "will deliver
  machine-readable hierarchical maps of cell architecture as AI-ready data,
  together with quarterly data releases of map-input data streams", and the
  project states that it "releases data quarterly, ensuring continuous updates
  to the cell maps and input data streams". Successive Beta releases are
  deposited as separate versioned datasets, each with its own DOI, in LibraData
  - the University of Virginia's instance of Dataverse, an NIH-approved
  generalist repository - inside the "Cell Maps for Artificial Intelligence"
  collection under LibraData > School of Medicine.

  The programme interrogates chromatin modifiers, metabolic enzymes and other
  proteins involved in cancer, neuropsychiatric and cardiac disorders in
  disease-relevant human cell lines under treated and untreated conditions,
  using three complementary mapping approaches: mass spectrometry-based
  proteomics (affinity purification mass spectrometry, AP-MS; and size-exclusion
  chromatography mass spectrometry, SEC-MS), spatial proteomics / cell imaging
  (immunofluorescence confocal microscopy), and genetic perturbation via
  CRISPR/Cas9 (single-cell CRISPRi Perturb-seq). The two cell systems are the
  triple-negative breast cancer line MDA-MB-468 (untreated / DMSO control,
  paclitaxel, vorinostat) and the induced pluripotent stem cell line KOLF2.1J
  (undifferentiated parental, and iPSC-derived neural progenitor cells, neurons
  and cardiomyocytes). Input data streams are integrated by the Multi-Scale
  Integrated Cell (MuSIC) pipeline, and outputs are packaged with provenance
  graphs and rich metadata as AI-ready datasets in RO-Crate format using an
  extended client-server version of the FAIRSCAPE framework, with ARK persistent
  identifiers.

  CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA
  Birmingham, Simon Fraser University and the Hastings Center. The project is
  organised into three pillars - Data, People and Ethics - across six modules
  (Data Acquisition; Tools; Standards; Skills and Workforce Development;
  Teaming; Ethics). Project-wide totals advertised by the CM4AI portal are 1,374
  protein interactions, 53,788 immunofluorescent images, 7,023 total proteins
  investigated, 11,739 genes targeted, and 21.4 TB of data volume. The programme
  is scheduled to run to the end of the project in November 2026, with the NIH
  award period running 2022-09-01 to 2026-08-31.

  All releases to date are labelled Beta and are explicitly interim: they do not
  contain the computed cell maps, which are to be added in future releases.
