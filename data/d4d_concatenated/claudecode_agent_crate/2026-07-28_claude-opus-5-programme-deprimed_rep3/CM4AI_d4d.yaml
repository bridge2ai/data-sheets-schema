purposes:
  - name: primary_purpose
    response: >-
      "CM4AI's objective is to deliver machine-readable hierarchical maps of cell
      architecture as AI-Ready data produced from multimodal interrogation of
      100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
      neuropsychiatric, and cardiac disorders in disease-relevant cell lines
      under perturbed and unperturbed conditions, utilizing state-of-the-art
      mass spectrometry based proteomics, spatial proteomics / cell imaging, and
      genetic perturbations using CRISPR." The quarterly release programme
      exists to publish the map-input data streams as ethical, FAIR, AI-ready
      datasets on a predictable schedule while the maps themselves are still
      being computed.
  - name: bridge2ai_grand_challenge_purpose
    response: >-
      "As part of the NIH Common Fund's Bridge2AI program, the CM4AI data
      generation project seeks to map the spatiotemporal architecture of human
      cells and use these maps toward the grand challenge of interpretable
      genotype-phenotype learning. In genomics and precision medicine, machine
      learning models are often 'black boxes,' predicting phenotypes from
      genotypes without understanding the mechanisms by which such translation
      occurs."
  - name: ai_readiness_demonstration_purpose
    response: >-
      A second purpose of the release programme is to demonstrate ethical
      AI-readiness in practice. "At a strategic level, CM4AI - as do other
      Bridge2AI DGPs - aims to ethically leverage the most state-of-the art
      computational and experimental tools in biomedical science to enable a new
      generation of transformative artificial intelligence research to benefit
      humanity. Its datasets and software are available to the research
      community under minimally restrictive terms consistent with ethical
      guidelines, researcher attribution, and research integrity."

tasks:
  - name: interpretable_genotype_phenotype_learning
    response: >-
      Supporting "visible" machine learning systems informed by multi-scale cell
      and tissue architecture: "this Bridge2AI data generation project will
      generate a resource of matched data and tools to enable the creation of
      'visible' ML systems, which are not black boxes but are built directly on
      knowledge maps of cell and tissue architecture."
  - name: multimodal_cell_map_construction
    response: >-
      Constructing hierarchical cell maps - directed acyclic graphs in which
      each node is an assembly of proteins in proximity at a given scale - by
      integrating protein-protein interaction and protein localisation data
      through self-supervised embedding followed by multi-resolution community
      detection.
  - name: perturbation_response_mapping
    response: >-
      Measuring how cell architecture, protein complexes and transcriptional
      state are reorganised by drug treatment (paclitaxel, vorinostat) in
      triple-negative breast cancer cells and by lineage commitment in iPSC
      differentiation to neural progenitor cells, neurons and cardiomyocytes.

addressing_gaps:
  - name: black_box_genomic_prediction_gap
    response: >-
      "Machine learning (ML) models show great promise in analyzing the human
      genome to make predictions, but the inner workings of these models are
      typically difficult-to-interpret 'black boxes.'" CM4AI addresses this by
      producing the structural knowledge maps on which interpretable models can
      be built.
  - name: unmapped_cell_architecture_gap
    response: >-
      Much of subcellular architecture remains uncharted and individual mapping
      modalities are incomplete on their own; integrating orthogonal modalities
      is needed to resolve assemblies across physical scales.
  - name: ai_ready_data_standards_gap
    response: >-
      Existing biomedical datasets frequently lack the provenance,
      characterisation, explainability and ethical documentation required for
      reliable AI use. CM4AI defines AI-ready biomedical data as "fully
      characterized FAIR data of known provenance, which can be ethically and
      reliably processed by AI applications; whose models and software are
      available and well-described for validation and re-use; and whose
      predictions may be fully explained and interpreted to the user as needed",
      and packages every release accordingly.

