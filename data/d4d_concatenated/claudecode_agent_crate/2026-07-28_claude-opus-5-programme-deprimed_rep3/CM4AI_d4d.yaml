        The aggregated atlas is available from Figshare at
        https://figshare.com/s/ee85bb1880921326249b.

machine_annotation_tools:
  - name: pipeline_and_analysis_tools
    tools:
      - node2vec
      - Human Protein Atlas deep learning image model
      - Contrastive deep-learning co-embedding model
      - Multi-resolution community detection
      - Large language model assembly naming
      - Spectronaut
      - R / MSstats
      - 10x Genomics 3' HT kit
      - Integrative Modeling Platform (IMP) version 2.18
    tool_descriptions:
      - >-
        node2vec reduces the dimensionality of downloaded PPI networks to
        produce a PPI embedding capturing each protein's interaction
        neighbourhood.
      - >-
        A Human Protein Atlas deep learning model reduces IF images to an image
        embedding capturing protein localisation.
      - >-
        Contrastive deep learning fuses the PPI and image embeddings into a
        per-protein co-embedding, followed by community detection over all-by-all
        similarities to produce the assembly hierarchy.
      - >-
        An LLM approach developed by the project names sets of proteins and
        assigns a name confidence score during hierarchy evaluation.
      - >-
        Spectronaut performs quantitative analysis of the KOLF2 differentiation
        SEC-MS raw data, with downstream analysis in R using MSstats-compatible
        formats.
      - >-
        Single-cell CRISPR screens were performed using the 10x Genomics 3' HT
        kit.
      - >-
        Integrative structure modelling of MuSIC communities uses the Python
        Modeling Interface over the open-source Integrative Modeling Platform
        (IMP) version 2.18, available at https://integrativemodeling.org.
    tool_accuracy:
      - >-
        No accuracy figures for these tools as applied to the released CM4AI data
        are given in the corpus.

existing_uses:
  - name: published_analyses_using_cm4ai_data
    examples:
      - >-
        "Nourreddine S, Doctor Y, Dailamy A, et al. (2024) A Perturbation Cell
        Atlas of Human Induced Pluripotent Stem Cells. bioRxiv 2024.11.03.621734;
        doi: https://doi.org/10.1101/2024.11.03.621734" - the publication
        associated with the Perturb-seq components of the releases.
      - >-
        "Clark T, Parker J, Al Manir S, et al. (2024) Cell Maps for Artificial
        Intelligence: AI-Ready Maps of Human Cell Architecture from
        Disease-Relevant Cell Lines. bioRxiv 2024.05.21.589311" - the project
        article, cited as the Related Publication on every release.
    description: >-
      The June 2026 release RO-Crate lists four associated publications: the two
      above, plus Qin Y, Huttlin EL, Winsnes CF et al., "A multi-scale map of
      cell structure fusing protein images and interactions", Nature 600, 536-542
      (2021), doi:10.1038/s41586-021-04115-9; and Schaffer LV, Hu M, Qian G et
      al., "Multimodal cell maps as a foundation for structural and functional
      genomics", Nature (2025), https://www.nature.com/articles/s41586-025-08878-3.
      The last two are methodological antecedents whose underlying measurements
      were made in HEK293 and U2OS osteosarcoma cells respectively and are
      deposited outside the CM4AI Dataverse releases; they demonstrate what the
      CM4AI mapping approach produces rather than describing the released CM4AI
      data.
  - name: demonstrated_downstream_modelling_uses
    examples:
      - >-
        Visible machine learning and visible neural networks: cell maps "have
        been used in AI tools for 'visible machine learning' or 'visible neural
        networks' (VNNs) to interrogate how protein assemblies in the cell affect
        cell-level phenotype predictions", with the release crate citing Ma et
        al. 2018 (PMID 29505029) and Kuenzi et al. 2020 (PMID 33096023) as the
        pattern to enable.
      - >-
        Interpretation of cancer mutations using a multiscale map of protein
        systems, Zheng F, Kelly MR, Ramms DJ et al., Science 374, eabf3067
        (2021).
  - name: training_and_community_use
    examples:
      - >-
        "Initial Datasets, Tools and Standards associated with all three parallel
        mapping platforms have been released and are publicly available at our
        CM4AI web portal. These data were also made available at our CodeFest in
        March 2024, accompanied by detailed tutorials explaining how the data
        were derived and integrated, and providing production ready software for
        producing the datasets."
      - >-
        The inaugural virtual CodeFest trained 38 registrants, of whom 40%
        identified as female and 30% came from underrepresented communities.

use_repository:
  - name: cm4ai_dataverse_collection
    repository_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    repository_details:
      - >-
        The "Cell Maps for Artificial Intelligence" collection in LibraData, the
        University of Virginia's instance of Dataverse and an NIH-approved
        generalist repository, reached via University of Virginia Dataverse >
        LibraData: UVa's Scholarly Research > School of Medicine. Dataverse
        software version at capture: v. 6.6 build 1829-192cdc4.
  - name: cm4ai_web_portal
    repository_url: https://cm4ai.org/data-releases/
    repository_details:
      - >-
        The CM4AI web portal, using the U-BRITE platform, "to support open and
        trustworthy data management and sharing, ensuring the broad dissemination
        of the datasets, cell maps, and tools developed".
  - name: software_repositories
    repository_url: https://github.com/idekerlab/cellmaps_pipeline
    repository_details:
      - >-
        "Software comprising the Tools data integration pipeline is available
        under BSD-3 open source license in GitHub (for alpha level tools) or in
        the Zenodo long-term archive (for production-ready tools). Links to these
        tools are packaged in RO-Crates as part of CM4AI provenance
        representations."
      - >-
        FAIRSCAPE is documented with a tutorial and installation instructions at
        https://fairscape.github.io and is available under the MIT License; the
        Integrative Modeling Platform is at http://integrativemodeling.org.
      - >-
        "All CM4AI integration and packaging software is freely available and
        licensed under nonrestrictive open-source licenses."

other_tasks:
  - name: downstream_task_opportunities
    task_details:
      - >-
        Interpretation of genetic variants and mutations: "Cell maps provide a
        foundation for downstream applications in human genomics, including
        interpretation of genetic variants and mutations."
      - >-
        Analysis of cell architectural change under disease processes, treatment
        conditions or genetic perturbation, named as an intended use on every
        structured release page.
      - >-
        Benchmarking and development of multimodal integration methods, since
        the releases publish matched modalities on the same cell systems.

future_use_impacts:
  - name: interim_state_impact
    impact_details:
      - >-
        Because every captured release is Beta and interim, analyses built on one
        release may not transfer cleanly to the next: file names, checksums and
        RO-Crate structure have already changed between releases, and the June
        2025 revision explicitly changed naming conventions and corrected
        RO-Crate metadata.
      - >-
        Computed cell maps "will be added in future releases", so conclusions
        drawn now from the individual modality datasets may be revised once the
        integrated maps are published.
  - name: embargo_and_availability_impact
    impact_details:
      - >-
        Perturb-seq external deposits are currently embargoed; users planning
        reproducible pipelines should expect their availability, and therefore
        the reproducibility of downstream work, to change when the embargo lifts.
  - name: institutional_review_impact
    impact_details:
      - >-
        Both the CM4AI Dataverse collection and the CM4AI website display the
        notice "This repository is under review for potential modification in
        compliance with Administration directives", which signals possible future
        change to the availability or content of the release programme.

discouraged_uses:
  - name: clinical_use_discouraged
    discouragement_details:
      - >-
        "These laboratory data are not to be used in clinical decision-making or
        in any context involving patient care without appropriate regulatory
        oversight and approval."
  - name: population_generalisation_discouraged
    discouragement_details:
      - >-
        Treating the data as representative of human biological variation is
        discouraged: the data "does not represent all biological variants which
        may be seen in the population at large".
  - name: naive_cross_modality_use_discouraged
    discouragement_details:
      - >-
        Joining the modalities without accounting for their incompletely
        overlapping protein sets, and expecting analysis-ready integrated cell
        maps from a release that explicitly excludes them.
  - name: commercial_use_without_licence_discouraged
    discouragement_details:
      - >-
        "Commercial use requires a separate license negotiation with the
        copyright holder (UCSD, Stanford, and/or UCSF depending upon the specific
        data package in question). A Data Access Committee will supervise ethical
        matters related to dataset distribution and potential dual licensing for
        commercial use."

intended_uses:
  - name: declared_intended_uses
    use_category:
      - AI-ready data for functional genomics research
      - AI and machine learning model training
      - Cellular process analysis
      - Perturbation and disease-context analysis
    examples:
      - AI-ready datasets to support research in functional genomics
      - AI model training
      - Cellular process analysis
      - >-
        Cell architectural changes and interactions in presence of specific
        disease processes, treatment conditions, or genetic perturbations
    usage_notes: >-
      The release RO-Crate elaborates the same list in rai:dataUseCases and adds:
      "A major goal is to enable biologically-driven, interpretable ML
      applications, for example as proposed in Ma et al. 2018 (PMID: 29505029)
      and Kuenzi et al. 2020 (PMID: 33096023)."

prohibited_uses:
  - name: clinical_decision_making_prohibited
    prohibition_reason:
      - >-
        "These laboratory data are not to be used in clinical decision-making or
        in any context involving patient care without appropriate regulatory
        oversight and approval." This statement appears as the Prohibited Uses
        entry on every structured release page and as both usageInfo and
        prohibitedUses in the release RO-Crate.
  - name: unlicensed_commercial_use_prohibited
    prohibition_reason:
      - >-
        The CC BY-NC-SA 4.0 licence excludes commercial use; commercial use
        requires separate licence negotiation with UCSD, Stanford and/or UCSF
        depending on the data package.

distribution_formats:
  - name: dataverse_distribution
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
    description: >-
      Primary distribution is by DOI-identified Dataverse deposit. The June 2026
      release ships 10 public ZIP archives; the October 2025 release 8 ZIP
      archives; the June 2025 release 21 files across Text, Data, Archive and
      Metadata types; and the March 2025 release 6 files (3 archives and 3 JSON
      documents). Dataverse states "The dataset is too large to download. Please
      select the files you need from the files table", warns that "The files
      selected are too large to download as a ZIP" above a 953.7 MB limit, and
      offers the Data Access API for programmatic access at
      https://dataverse.lib.virginia.edu/api/access/datafile/. Metadata export is
      offered as OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD, DDI Codebook
      v2, Dublin Core, Croissant (October 2025 onward), DDI HTML Codebook and
      JSON.
  - name: ro_crate_packaging_format
    description: >-
      Every release from June 2025 onward is packaged as an RO-Crate conforming
      to https://w3id.org/ro/crate/1.2, extended with the EVI Evidence Graph
      Ontology and Croissant Responsible AI (rai:) properties, produced by
      FAIRSCAPE 1.1.3 and identified by ARK persistent identifiers in the
      ark:59853 namespace. Renderings shipped alongside the crate include an
      HTML datasheet, per-modality RO-Crate previews and provenance-graph HTML,
      and an AI-readiness score JSON.
  - name: payload_file_formats
    description: >-
      Formats declared across the June 2026 release crate are .d, .d directory
      group, .tsv, .xml, TSV, csv, executable, fastq.gz, h5, h5ad, image/jpeg,
      pdf and unknown. On Dataverse these are wrapped as ZIP archives; the
      earlier releases also expose bare JSON RO-Crate metadata documents and
      HTML provenance-graph files, of which Dataverse notes "The .html
      provenance graph files require download to view properly. They will not
      display in the Dataverse preview."

distribution_dates:
  - name: quarterly_release_dates
    release_dates:
      - "May 2024: first data release, cited in the project article as doi:10.18130/V3/DXWOS5"
      - "2025-03-03: March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX"
      - "2025-07-01: June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R"
      - "2025-10-31: October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM"
      - "2026-06-17: June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C"
      - >-
        2026-07-15: three immunofluorescence image archives added to the June
        2026 release, corresponding to the Dataverse version 2 release time
        2026-07-15T20:28:19Z
    description: >-
      Releases are quarterly by policy: "CM4AI releases data quarterly, ensuring
      continuous updates to the cell maps and input data streams." Individual
      files within a release may be published later than the release itself, as
      with the June 2025 release whose IF archives are stamped 2025-10-22 and the
      October 2025 release whose Perturb-seq and metadata archives are stamped
      2025-12-22.

third_party_sharing:
  - name: external_repository_sharing
    is_shared: true
    description: >-
      Release payloads are deliberately mirrored to or hosted in
      domain-appropriate third-party repositories: MassIVE for mass-spectrometry
      data, the NCBI Sequence Read Archive and BioProject for raw sequence data,
      and Figshare for the aggregated Perturbation Cell Atlas. The releases
      themselves are held in LibraData at the University of Virginia. The project
      article also notes collaboration "with the NIH Common Fund Data Ecosystem
      (CFDE) for data curation".

license_and_use_terms:
  name: cm4ai_license_terms
  contact_person: https://orcid.org/0000-0002-1708-8454
  data_use_permission:
    - general_research_use
    - no_commercial_use
  license_terms:
    - >-
      "Dataset licensed for reuse under Creative Commons
      Attribution-NonCommercial-ShareAlike 4.0 International license
      (https://creativecommons.org/licenses/by-nc-sa/4.0/)." Recorded on every
      captured release as "License/Data Use Agreement: CC BY-NC-SA 4.0".
    - >-
      "Attribution is required to the copyright holders and the authors. Any
      publications referencing this data or derived data products should cite the
      Related Publications below, as well as directly citing this data
      collection."
    - >-
      "Copyright (c) 2026 The Regents of the University of California except
      where otherwise noted. Spatial proteomics raw image data is copyright (c)
      2026 The Board of Trustees of the Leland Stanford Junior University." The
      March 2025 release carries the same notice with year 2025, and the
      Perturbation Cell Atlas raw-sequence sub-crate with year 2024.
    - >-
      "Commercial use requires a separate license negotiation with the copyright
      holder (UCSD, Stanford, and/or UCSF depending upon the specific data
      package in question). A Data Access Committee will supervise ethical
      matters related to dataset distribution and potential dual licensing for
      commercial use."
    - >-
      Dataverse community norms apply in addition: "Our Community Norms as well
      as good scientific practices expect that proper credit is given via
      citation. Please use the data citation shown on the dataset page."
    - >-
      Licence heterogeneity exists below the release level. The AP-MS sub-crates
      (MassIVE MSV000101915 and MSV000101917) and the KOLF2 SEC-MS sub-crate
      (MSV000100676) declare https://creativecommons.org/publicdomain/zero/1.0/
      (CC0 1.0), while the treated-MDA-MB-468 SEC-MS sub-crate, the IF image
      sub-crates and both Perturbation Cell Atlas sub-crates declare CC BY-NC-SA
      4.0. Users relying on a specific component should check that component's
      own declared licence.
    - >-
      Software is licensed separately and more permissively: the Tools data
      integration pipeline under BSD-3 and FAIRSCAPE under MIT.
  description: >-
    The CC BY-NC-SA 4.0 deed captured in the corpus grants permission to share
    and adapt the material under the conditions of attribution, non-commercial
    use and ShareAlike, with no additional restrictions, and states that the
    licensor cannot revoke these freedoms as long as the terms are followed.

ip_restrictions:
  name: cm4ai_ip_restrictions
  restrictions:
    - >-
      Copyright in the datasets is held by The Regents of the University of
      California except where otherwise noted; copyright in the spatial
      proteomics raw image data is held by The Board of Trustees of the Leland
      Stanford Junior University.
    - >-
      Copyright in the FAIRSCAPE software is held by the Rector and Board of
      Visitors of the University of Virginia; the Dataverse instance is
      "Copyright (c) 2025, by the Rector and Visitors of the University of
      Virginia".
    - >-
      Commercial use requires separate licence negotiation with UCSD, Stanford
      and/or UCSF depending on the data package, supervised by a Data Access
      Committee that also considers potential dual licensing.
    - >-
      The Ethics plan explicitly "balances the openness of the data produced,
      with protection of the intellectual property, and supervision and
      monitoring of potential efforts at commercialization."

regulatory_restrictions:
  name: cm4ai_regulatory_status
  hipaa_compliant: not_applicable
  confidentiality_level: unrestricted
  governance_committee_contact: https://orcid.org/0000-0003-4535-3486
  regulatory_restrictions:
    - "FDA Regulated: No, stated on every structured release page."
    - >-
      No human subjects research is conducted, so no IRB approval, informed
      consent or human-subject regulatory regime applies; the crate records the
      exemption as "research with commercially available de-identified human cell
      lines does not constitute human subjects research."
  other_compliance:
    - >-
      Bridge2AI Code of Conduct: "The Ethics Pillar also supported the work
      initiated by the Bridge2AI Ethics Working Group for supporting the
      Bridge2AI Data Sharing and Dissemination Working Group in developing a Code
      of Conduct. The Code of Conduct outlines basic requirements for
      participants in the Bridge2AI Open House to access B2AI data (including
      CM4AI datasets), to attest and commit to it prior to accessing the data."
    - >-
      Institutional review notice: "This repository is under review for potential
      modification in compliance with Administration directives", displayed on
      both the Dataverse collection and the CM4AI website.
  description: >-
    HIPAA is recorded as not applicable because no protected health information
    is present; the data derive from commercially available de-identified cell
    lines. Confidentiality level is Unrestricted at both release and sub-crate
    level. The Data Governance Committee contact is Jillian Parker
    (jillianparker@health.ucsd.edu).

maintainers:
  - name: cm4ai_project_maintainers
    role: academic_institution
    maintainer_details:
      - >-
        The CM4AI project maintains the release programme through the end of the
        project; project-related inquiries go to Swathi Thaker, PhD (UAB, Program
        Manager, snthaker@uab.edu) and website support to Zhandos Sembay (UAB,
        zsembay8@uab.edu).
      - >-
        The point of contact recorded on every Dataverse release is Ideker Trey
        (University of California San Diego); the release RO-Crate gives
        contactEmail tideker@health.ucsd.edu.
  - name: repository_maintainers
    role: academic_institution
    maintainer_details:
      - >-
        LibraData, the University of Virginia's Dataverse instance, provides
        "Long term preservation in the https://dataverse.lib.virginia.edu/,
        supported by committed institutional funds", with support reachable
        through University of Virginia Dataverse Support.
      - >-
        Depositor of record for all four captured releases is Niestroy, Justin
        (University of Virginia).

errata:
  - name: june_2025_revision
    erratum_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
    erratum_details:
      - >-
        "This dataset is a revision of the June 2025 Data Release ... This
        revision includes adding RGB immunofluorescent images, corrections to
        ro-crate metadata, and changes to naming conventions." The revision is
        published as version 2.1 of doi:10.18130/V3/F3TD5R.
  - name: metadata_defects_observed_in_current_release
    erratum_details:
      - >-
        No formal erratum is published for the June 2026 release, but its
        RO-Crate contains uncorrected metadata defects: a version and
        datePublished that disagree with the Dataverse record, citation strings
        naming the wrong release and year, and IF sub-crate size, checksum,
        version and date fields inherited from the March 2025 release. The
        cm4ai.org release page also displays the wrong release year.

updates:
  name: cm4ai_update_plan
  frequency: quarterly
  update_details:
    - >-
      "Dataset will be regularly updated and augmented through the end of the
      project in November 2026", with "Updates on a quarterly basis". The
      RO-Crate states the same as rai:dataReleaseMaintenancePlan: "Dataset will
      be regularly updated and augmented on a quarterly basis through the end of
      the project (November, 2026)."
    - >-
      "Data presented here will be augmented regularly through the end of the
      project."
    - >-
      Each quarterly update is published as a new DOI-identified Dataverse
      dataset rather than as a new version of a single dataset, so the release
      series is a set of sibling records rather than a version chain.
  description: >-
    The update cadence is the defining property of this programme: a new Beta
    release approximately every quarter, each adding modalities or conditions.
    March 2025 introduced Perturb-seq in undifferentiated iPSCs, SEC-MS in iPSCs
    and derivatives, and IF images; June 2025 added SEC-MS in treated and
    untreated MDA-MB-468 cells and RGB IF images; October 2025 added Perturb-seq
    in MDA-MB-468 cells; and June 2026 added AP-MS in treated MDA-MB-468 cells.

retention_limit:
  name: cm4ai_retention
  retention_period: >-
    Indefinite. "Long term preservation in the
    https://dataverse.lib.virginia.edu/, supported by committed institutional
    funds."
  retention_details:
    - >-
      LibraData is "the University of Virginia's archival data repository" and
      "an NIH-approved generalist repository".
    - >-
      Dataverse retains superseded content: "Files will not be removed from
      previously published versions of the dataset."
    - >-
      A countervailing signal exists: the collection notice "This collection is
      under review for potential modification in compliance with Administration
      directives" appears on every captured Dataverse release page.

version_access:
  name: cm4ai_release_versions
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - >-
      May 2024 Data Release - listed in the Archive section of the CM4AI
      data-releases page; cited in the project article's Data and Software
      Availability Statement as "Clark T, Mohan J, Schaffer L, Obernier K, et al.
      Cell Maps for Artificial Intelligence - Data Release,
      https://doi.org/10.18130/V3/DXWOS5, University of Virginia Dataverse, V1".
      No processed record for this release is present in the current source
      bundle, so it is not represented as a resource in this datasheet.
    - "March 2025 Data Release (Beta) - doi:10.18130/V3/B35XWX, Dataverse version 1.4"
    - "June 2025 Data Release (Beta) - doi:10.18130/V3/F3TD5R, Dataverse version 2.1"
    - "October 2025 Data Release (Beta) - doi:10.18130/V3/K7TGEM, Dataverse version 2.1"
    - >-
      June 2026 Data Release (Beta) - doi:10.18130/V3/HIGT4C, Dataverse version
      2.0, current
  version_details:
    - >-
      Each quarterly release carries its own DOI and its own internal Dataverse
      version number; the two numbering systems are independent. Within a
      release, Dataverse offers Minor and Major version increments and preserves
      files from previously published versions.
    - >-
      Superseded releases remain publicly retrievable at their DOIs; the CM4AI
      data-releases page presents them under an "Archive" heading while promoting
      the current release under "Our latest data release".
    - >-
      The June 2026 release records Dataverse version 2 as released
      2026-07-15T20:28:19Z, after the 2026-06-17 publication date, which
      corresponds to the later addition of the three IF image archives.
    - >-
      The release RO-Crate declares its own version "1.0", which does not
      correspond to the Dataverse dataset version 2.0.

extension_mechanism:
  name: cm4ai_extension
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details:
    - >-
      The programme is designed for extension by others through its toolkit
      rather than by direct contribution to the releases: "To facilitate
      continued map improvement, incorporation of new datasets, and construction
      of new cell maps across subtypes and disease states, we also developed the
      Cell Mapping Toolkit, which implements the end-to-end pipeline described
      here as a series of Python packages complete with full user documentation.
      This toolkit provides a flexible and generalizable framework for cell map
      construction, enabling researchers to integrate and construct cell maps via
      multiple input modalities."
    - >-
      The corpus documents no mechanism for external parties to contribute data
      into a CM4AI quarterly release. Contact for the collection owner is
      available through the Dataverse "Contact Owner" function and through the
      named project contacts.

is_deidentified:
  name: cm4ai_deidentification
  identifiable_elements_present: false
  method: >-
    Not applicable in the usual sense: no identifiable human data enter the
    programme. Source materials are commercially available, already de-identified
    human cell lines, and the data "are considered to be de-identified as they
    cannot be matched, with current knowledge, to a human subject".
  identifiers_removed:
    - >-
      None removed by the project; no direct or indirect human identifiers are
      collected at any point.
  deidentification_details:
    - >-
      "De-identified Samples: Yes" is recorded on every structured release page,
      alongside "Human Subjects: No".
    - >-
      "CM4AI data are distinctive within Bridge2AI in that they are non-clinical
      (from tissue cultures) and are considered to be de-identified as they
      cannot be matched, with current knowledge, to a human subject."

related_datasets:
  - target_dataset: https://doi.org/10.18130/V3/DXWOS5
    relationship_type: is_new_version_of
    description: >-
      The May 2024 CM4AI Data Release, the earliest release cited in the project
      article's Data and Software Availability Statement. It is superseded by the
      later quarterly releases but has no processed record in the current source
      bundle, so it is documented here rather than as a resource.
  - target_dataset: https://doi.org/10.1101/2024.05.21.589311
    relationship_type: is_referenced_by
    description: >-
      Clark T et al., "Cell Maps for Artificial Intelligence: AI-Ready Maps of
      Human Cell Architecture from Disease-Relevant Cell Lines", bioRxiv 2024.
      The Related Publication recorded on every captured release, and the
      reference the licence terms require users to cite.
  - target_dataset: https://doi.org/10.1101/2024.11.03.621734
    relationship_type: is_referenced_by
    description: >-
      Nourreddine S et al., "A Perturbation Cell Atlas of Human Induced
      Pluripotent Stem Cells", bioRxiv 2024, PMCID PMC11580897. The publication
      associated with the Perturb-seq components of the releases.
  - target_dataset: https://doi.org/10.1038/s41586-025-08878-3
    relationship_type: references
    description: >-
      Schaffer LV, Hu M, Qian G et al., "Multimodal cell maps as a foundation for
      structural and functional genomics", Nature 642, 222-231 (2025), published
      09 April 2025 with a Publisher Correction on 02 October 2025
      (doi:10.1038/s41586-025-09648-x). Listed as an associated publication of
      the June 2026 release. Its measurements were made in U2OS osteosarcoma
      cells, not in the CM4AI cell systems, and its data are deposited separately
      at NDEx (cell map uuid f693137a-d2d7-11ef-8e41-005056ae3c32; AP-MS network
      uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa), MassIVE MSV000097168,
