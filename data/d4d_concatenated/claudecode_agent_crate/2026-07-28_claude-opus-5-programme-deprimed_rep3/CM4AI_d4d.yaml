anomalies:
  - name: release_date_conflict_june_2026
    anomaly_details:
      - >-
        The cm4ai.org data-releases page presents the June 2026 Data Release
        (Beta), doi.org/10.18130/V3/HIGT4C, with "Released on: June 17, 2025".
        The official Dataverse record for the same DOI gives publication date
        2026-06-17, and its files are stamped Jun 17 2026 and Jul 15 2026. The
        Dataverse metadata is authoritative; the website's year is incorrect.
  - name: crate_versus_dataverse_version_and_date_conflict
    anomaly_details:
      - >-
        For the same June 2026 release, the Dataverse record states Version 2.0,
        publication date 2026-06-17 and citation year 2026 with V2, while the
        release RO-Crate root entity states version "1.0", datePublished
        "2026-06-30" and a citation string beginning "... , 2025, ... V1". The
        crate's own citation for its sub-crates cites the March 2025 release
        title against the October 2025 DOI 10.18130/V3/K7TGEM, and the IF
        sub-crates cite doi:10.18130/V3/B35XWX. These are internal
        inconsistencies in the crate's citation fields.
  - name: stale_if_subcrate_metadata
    anomaly_details:
      - >-
        The June 2026 release RO-Crate carries IF image sub-crates whose
        contentSize (2.6 GB paclitaxel, 3.2 GB untreated, 2.8 GB vorinostat),
        MD5 (for example 0b4d129f5fbc3bb7f7ea564cd032cef7 for untreated),
        datePublished ("02/28/2025") and version ("0.1.0") all correspond to the
        March 2025 release rather than to the June 2026 Dataverse files
        (3.8 GB / 4.6 GB / 4.2 GB with different checksums). The same sub-crates
        state 464 proteins, whereas the March 2025 files they check-sum are
        described as covering 563 proteins.
  - name: protein_coverage_count_conflict
    anomaly_details:
      - >-
        Three different figures are given for the number of proteins covered by
        the MDA-MB-468 IF image sets: 563 (March 2025 Dataverse file
        descriptions), 464 (June 2025, October 2025 and June 2026 file and
        sub-crate descriptions) and 523 (cm4ai.org flagship dataset summary,
        which states no release scope). The 563 and 464 figures are separable by
        release; the 523 figure cannot be attributed to a release from the
        corpus.
  - name: contentsize_versus_byte_count_conflict
    anomaly_details:
      - >-
        The June 2026 release RO-Crate states contentSize "19.9 TB" and
        evi:totalContentSizeBytes 21051331945400 for the same object, and the
        AI-readiness self-assessment repeats "Total size: 19.9 TB". The
        project's Data Insights panel advertises 21.4 TB of data volume at
        programme scope. These three figures are not reconciled in the corpus.
  - name: checksum_coverage_anomaly
    anomaly_details:
      - >-
        The AI-readiness self-assessment reports "0% of files have checksums
        (8/55859)" for the June 2026 release, while simultaneously marking the
        "verifiable" criterion as satisfied.
  - name: stale_release_page_content
    anomaly_details:
      - >-
        The cm4ai.org data-releases page lists "AP-MS interactomes (coming
        soon!)" for the TNBC flagship datasets and "IF images (coming soon!)"
        for the iPSC flagship datasets, but the June 2026 release it links to
        already publishes AP-MS data for MDA-MB-468 cells with treatment. The
        page's Archive list also omits the current release from its own archive
        enumeration while naming May 2024, March 2025, June 2025 and October
        2025.

known_biases:
  - name: cell_line_representativeness_bias
    bias_type: representation_bias
    bias_description: >-
      "Data in this release was derived from commercially available
      de-identified human cell lines, and does not represent all biological
      variants which may be seen in the population at large." The programme
      rests on two cell lines only: MDA-MB-468, derived from a single
      51-year-old Black female donor with metastatic mammary adenocarcinoma, and
      KOLF2.1J, derived from a single healthy male Northern European donor.
    affected_subsets:
      - All releases and all modalities.
    mitigation_strategy: >-
      The limitation is stated explicitly on every structured release page and
      in the release RO-Crate as rai:dataBiases; no mitigation beyond disclosure
      is described in the corpus.
  - name: target_selection_bias
    bias_type: selection_bias
    bias_description: >-
      Protein and gene targets are not sampled at random. The programme
      deliberately selects "100 chromatin modifiers and 100 metabolic enzymes
      involved in cancer, neuropsychiatric, and cardiac disorders", extended
      with "another 500 proteins pending significant hits from the genetic
      perturbations and PPI results". Spatial proteomics coverage is further
      constrained to proteins for which Human Protein Atlas antibodies exist.
    affected_subsets:
      - AP-MS, IF imaging and Perturb-seq components.
  - name: cross_modality_coverage_bias
    bias_type: measurement_bias
    bias_description: >-
      "Protein-protein interaction (SEC-MS), protein localization (IF imaging),
      and CRISPRi perturbSeq data interrogate sets of proteins which incompletely
      overlap." Any analysis restricted to the intersection of modalities is
      therefore drawn from a narrower and non-random protein set than any single
      modality provides.

known_limitations:
  - name: interim_release_limitation
    limitation_type: scope_limitation
    limitation_description: >-
      "This is an interim release. It does not contain predicted cell maps,
      which will be added in future releases. The current release is most
      suitable for bioinformatics analysis of the individual datasets. Requires
      domain expertise for meaningful analysis."
    scope_impact: >-
      The headline product of the programme - the integrated hierarchical cell
      map - is absent from every release captured here. Users obtain the
      map-input data streams, not the maps.
    recommended_mitigation: >-
      Analyse the individual modality datasets on their own terms, and await
      later releases for computed cell maps.
  - name: completeness_limitation
    limitation_type: coverage_limitation
    limitation_description: >-
      "These data are not yet in completed final form, and some datasets are
      under temporary pre-publication embargo. Protein-protein interaction
      (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data
      interrogate sets of proteins which incompletely overlap. Computed cell maps
      not included in this release."
    scope_impact: >-
      Embargoed Perturb-seq deposits cannot be retrieved from their external
      repositories at the time of capture, and the modalities cannot be joined
      across the full protein set.
  - name: domain_expertise_limitation
    limitation_type: methodological_limitation
    limitation_description: >-
      The release explicitly "requires domain expertise for meaningful
      analysis". The Dataverse archives for the mass-spectrometry, AP-MS and
      Perturb-seq modalities are RO-Crate metadata packages rather than analysis-
      ready matrices; the substantive payloads must be retrieved from MassIVE,
      the SRA or Figshare.
    recommended_mitigation: >-
      Follow the RO-Crate provenance graph to the external repository holding
      each payload, and consult the CM4AI training material and Cell Mapping
      Toolkit documentation.
  - name: single_cell_type_map_limitation
    limitation_type: representativeness_limitation
    limitation_description: >-
      Cell maps are constructed per cell type and condition. Assemblies resolved
      in one cellular context are not guaranteed to transfer to another; the
      programme's own design of treated versus untreated and differentiated
      versus naive states presumes that architecture changes with context.

confidential_elements:
  - name: confidentiality_assessment
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The release RO-Crate records confidentialityLevel "Unrestricted" at both
        release and sub-crate level, and the AI-readiness self-assessment records
        "secure: Confidentiality level: Unrestricted". All files on the captured
        Dataverse releases are marked File Access: Public.

content_warnings:
  - name: content_warning_assessment
    content_warnings_present: false
    warnings:
      - >-
        No content warnings are declared in any captured source. The data are
        laboratory measurements on immortalised and induced pluripotent human
        cell lines.

subpopulations:
  - name: human_subpopulation_assessment
    subpopulation_elements_present: false
    identification:
      - >-
        No human subpopulations are identified. The crate states
        d4d:atRiskPopulations "None - no human subjects involved; commercially
        sourced de-identified cell lines only."
    distribution:
      - >-
        The only donor attributes recorded anywhere in the corpus are the
        provenance descriptions of the two source cell lines: MDA-MB-468 from a
        51-year-old Black female with metastatic mammary adenocarcinoma, and
        KOLF2.1J from a healthy male Northern European donor. Structured
        biological subpopulations within the data are experimental groups - cell
        line, treatment condition and differentiation state - not human
        subpopulations.

sensitive_elements:
  - name: sensitive_element_assessment
    sensitive_elements_present: false
    sensitivity_details:
      - >-
        "CM4AI data are distinctive within Bridge2AI in that they are
        non-clinical (from tissue cultures) and are considered to be
        de-identified as they cannot be matched, with current knowledge, to a
        human subject." Every structured release page records Human Subjects:
        No, De-identified Samples: Yes and FDA Regulated: No.

relationships:
  - name: cell_map_hierarchy_structure
    relationship_details:
      - >-
        "Cell maps are hierarchical directed acyclic graphs (DAG), where each
        node represents an assembly of proteins in proximity at a given scale,
        spanning from large assemblies representing cell compartments (e.g.
        nucleus, mitochondria) to small assemblies of proteins in close
        proximity (e.g. protein complexes or subunits)." This is the intended
        output structure of the programme; no computed map is present in the
        captured releases.
  - name: release_to_subcrate_relationships
    relationship_details:
      - >-
        Each release RO-Crate is a container whose parts are per-modality
        sub-crates, each with its own ARK identifier, author list, licence and
        external repository deposit. Sub-crates declare isPartOf against several
        releases at once - for example the AP-MS sub-crates declare membership
        of both a January 2026 and a June 2026 release - so a single sub-crate
        can be shared across releases rather than duplicated.
  - name: modality_intersection_relationship
    relationship_details:
      - >-
        The three primary modalities are linked by shared protein and gene
        identities rather than by shared instances, and the release states
        explicitly that these protein sets overlap incompletely.

acquisition_methods:
  - name: laboratory_measurement_acquisition
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        All instances are directly measured in the project's own laboratories
        from cultured cell lines; nothing is self-reported, because there are no
        human participants.
      - >-
        Derived instances exist alongside the measurements: protein embeddings,
        co-embeddings and community hierarchies are computed by the MuSIC
        pipeline, and mass-spectrometry protein quantifications are derived from
        raw spectra by search software.
      - >-
        Validation is built into the design. The Perturbation Cell Atlas
        findings were validated "via phenotypic, protein-interaction, and
        metabolic tracing assays", and the AP-MS design carries an untagged
        parental control, a positive control tagged line and DMSO vehicle
        controls in four biological replicates.

collection_mechanisms:
  - name: affinity_purification_mass_spectrometry
    mechanism_details:
      - >-
        AP-MS on endogenously tagged cell lines. "We have endogenously tagged 17
        genes in MDA-MB-468 and acquired AP-MS data under three conditions
        (untreated, paclitaxel and vorinostat treated). We are currently in the
        process of tagging 34 additional genes in MDA-MB-468 cells."
      - >-
        The released AP-MS submissions comprise raw data from endogenously
        tagged MDA-MB-468 cells under paclitaxel and vorinostat perturbation,
        performed in four biological replicates, with each batch containing an
        untagged parental control, 10 chromatin modifier tagged cell lines and a
        positive control tagged line, with DMSO-treated vehicle controls.
  - name: size_exclusion_chromatography_mass_spectrometry
    mechanism_details:
      - >-
        SEC-MS for proteome-wide complex and interaction mapping. "In addition,
        we have performed SEC-MS on MDA-MB-468 cells under three conditions
        (untreated, paclitaxel and vorinostat treated), which enabled us to
        identify 72/100 chromatin modifiers, with 52 of them being integral
        components of protein complexes ... We detected PPI profiles of over a
        thousand complexes in MDA-MB468 cells, with thousands of proteins
        exhibiting differential elution profiles between control and paclitaxel
        or vorinostat treated cells. SEC-MS has also been performed in KOLF2
        iPSCs and derivatives, uncovering more than 700 protein complexes in
        both parental iPSCs and differentiated neurons."
      - >-
        The iPSC differentiation SEC-MS data were acquired on a Bruker timsTOF
        platform for protein correlation profiling, across Parental, NPC, Neuron
        and Cardio sample groups.
  - name: immunofluorescence_confocal_imaging
    mechanism_details:
      - >-
        Immunofluorescence-based staining (ICC-IF) and confocal microscopy in
        the Lundberg Lab at Stanford University, using the Human Protein Atlas
        resource of antibodies. "We established automated fixation and
        permeabilization protocols for the pipetting robot for MDA-MB-468 and
        KOLF2 cell lines, and completed spatial proteomics mapping of 100
        chromatin regulators in the MDA-MB-468 cells (+/- paclitaxel or
        vorinostat), with another 500 proteins pending significant hits from the
        genetic perturbations and PPI results."
      - >-
        Each image carries four channels: nuclei stained with DAPI (blue),
        endoplasmic reticulum with a calreticulin antibody (yellow),
        microtubules with a tubulin antibody (red), and an antibody against the
        protein of interest (green).
  - name: crispri_single_cell_perturbation_screening
    mechanism_details:
      - >-
        "We performed single-cell CRISPR screens perturbing 100 chromatin
        regulators in the MDA-MB-468 cells under 3 conditions (no treatment,
        paclitaxel or vorinostat) and KOLF2 iPSC in the undifferentiated state.
        We have designed a CRISPR lentiviral library targeting 100 chromatin
        factors with 6 guide RNAs per gene. We generated and characterized
        MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9. Single-cell
        CRISPR screens of 100 chromatin regulators (+/- drug) in MDA-MB-468 cells
        and in undifferentiated KOLF2.1J iPSCs were done using the 10x Genomics
        3'HT kit."
      - >-
        The released Perturbation Cell Atlas is an expressed genome-scale CRISPRi
        screen in KOLF2.1J iPSCs mapping transcriptional and fitness phenotypes
        for 11,739 targeted genes.

sampling_strategies:
  - name: targeted_protein_and_gene_selection
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        Human chromatin modifiers, metabolic enzymes and other proteins
        implicated in cancer, neuropsychiatric and cardiac disorders.
    why_not_representative:
      - >-
        Targets were chosen for disease relevance and experimental tractability,
        not to be representative of the proteome or of any population. The
        Perturbation Cell Atlas is the exception in scale, being an expressed
        genome-scale CRISPRi screen of 11,739 targeted genes.
    strategies:
      - >-
        Deliberate selection of an initial panel of 100 chromatin modifiers and
        100 metabolic enzymes, extended by hit-driven expansion of about 500
        further proteins in spatial proteomics.
      - >-
        Full factorial coverage of the treatment conditions within each cell
        system: untreated / paclitaxel / vorinostat for MDA-MB-468, and
        parental / NPC / neuron / cardiomyocyte for KOLF2.1J.
  - name: replicate_design
    is_sample: true
    is_random: false
    strategies:
      - >-
        AP-MS experiments were performed in four biological replicates per
        condition, with an untagged parental control, ten tagged chromatin
        modifier lines and a positive control line in each batch.
      - >-
        The iPSC differentiation SEC-MS design uses Parental replicates 1-4, NPC
        replicates 1-2, Neuron replicates 1-3 and Cardio replicates 1-2.

data_collectors:
  - name: data_acquisition_module_laboratories
    role: >-
      Generation of the primary experimental data streams in the CM4AI Data
      Acquisition module
    collector_details:
      - >-
        Mass spectrometry (AP-MS and SEC-MS): the Nevan Krogan laboratory,
        University of California San Francisco.
      - >-
        Spatial proteomics imaging: the Lundberg Lab, Stanford University, with
        KTH Royal Institute of Technology co-authors.
      - >-
        Genetic perturbation and the Perturbation Cell Atlas: the Prashant Mali
        group, University of California San Diego.
  - name: tools_and_standards_modules
    role: Data integration, packaging and metadata production
    collector_details:
      - >-
        The Tools module, University of California San Diego, produces and
        maintains the MuSIC dataset integration and map production system.
      - >-
        The Standards module, University of Virginia, performs AI-readiness
        packaging of data, software, metadata and provenance graphs through the
        FAIRSCAPE framework, and deposits the releases in LibraData.
  - name: production_locations
    role: Institutions recorded by Dataverse as production locations
    collector_details:
      - >-
        "University of California San Diego; University of California San
        Francisco; Stanford University; University of Virginia" is recorded as
        the Production Location on the June 2025, October 2025 and June 2026
        releases; the March 2025 record lists University of California San
        Francisco twice.

collection_timeframes:
  - name: programme_collection_timeframe
    start_date: "2022-09-01"
    end_date: "2026-06-01"
    timeframe_details:
      - >-
        The June 2026 release RO-Crate records rai:dataCollectionTimeframe as
        "9/1/2022" to "6/1/2026", matching the NIH project start date of
        2022-09-01.
      - >-
        Sub-crates carry narrower end dates reflecting their own deposits:
        "1/31/2026" for the AP-MS and Perturb-seq crates and "10/13/25" for the
        paclitaxel IF crate.
      - >-
        NIH RePORTER gives the project period as 2022-09-01 to 2026-08-31, while
        the maintenance plan states that data will be augmented "through the end
        of the project in November 2026". These two end dates are not reconciled
        in the corpus.
  - name: release_publication_timeframe
    start_date: "2025-03-03"
    end_date: "2026-07-15"
    timeframe_details:
      - >-
        Publication dates of the four quarterly releases represented as resources
        here: 2025-03-03, 2025-07-01, 2025-10-31 and 2026-06-17, with the latest
        file additions to the current release stamped 2026-07-15. An earlier May
        2024 release predates this window.

direct_collection:
  - name: direct_generation_by_project_laboratories
    is_direct: true
    collection_details:
      - >-
        All primary data are generated directly by CM4AI laboratories from
        purchased or licensed cell lines. There is no third-party data
        acquisition and no collection from individuals.
      - >-
        Source materials are obtained from external providers: MDA-MB-468 from
        ATCC and KOLF2.1J from the Human Induced Pluripotent Stem Cells
        Initiative (HipSci) resource, the latter "available for access by
        non-for-profit organizations via a simple MTA".

missing_data_documentation:
  - name: release_missing_data_statement
    missing_data_patterns:
      - Some datasets are under temporary pre-publication embargo.
      - >-
        Protein-protein interaction (SEC-MS), protein localization (IF imaging),
        and CRISPRi perturbSeq data interrogate sets of proteins which
        incompletely overlap.
      - Computed cell maps not included in this release.
    missing_data_causes:
      - Pre-publication embargo pending associated manuscripts.
      - >-
        Independent modality-specific target selection and antibody or reagent
        availability.
      - Map computation deferred to later releases.
    handling_strategy: >-
      Missing and embargoed content is disclosed rather than imputed. The release
      RO-Crate carries the same statement in rai:dataCollectionMissingData and in
      a completeness field, and the Dataverse page repeats it under
      "Completeness". No imputation is performed anywhere in the corpus.

raw_data_sources:
  - name: mda_mb_468_cell_line_source
    source_description: >-
      MDA-MB-468 (RRID:CVCL_0419) triple negative breast cancer cell line,
