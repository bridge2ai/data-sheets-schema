  - description: >-
      The RO-Crate records a data collection timeframe of 2022-09-01 through 2026-06-01 for
      this release (rai:dataCollectionTimeframe). Component sub-crates record narrower
      windows, for example 2022-09-01 to 2025-10-13 for the immunofluorescence image sets and
