      Dataverse record lists a data creation date of 2025-02-27, which coincides with its
      deposit date and sits inside rather than at the start of the stated collection window;
      see the corresponding entry under anomalies. The parent NIH award period is 2022-09-01
      to 2026-08-31.

direct_collection:
  - description: >-
      Data were not collected from individuals, directly or via third parties. All data were
      generated in the laboratory from commercially available human cell lines: MDA-MB-468
      (RRID:CVCL_0419), a triple-negative breast cancer line available from ATCC, established
      from a metastatic-site pleural effusion of a 51-year-old Black female with metastatic
      mammary adenocarcinoma; and KOLF2.1J (RRID:CVCL_B5P3), an induced pluripotent stem cell
      line derived from a healthy male Northern European donor, available from the Human
      Induced Pluripotent Stem Cells Initiative (HipSci) resource to not-for-profit
      organizations via a simple material transfer agreement. Both lines are described by the
      project as ethically sourced.

sampling_strategies:
  - description: >-
      Purposive selection of cell lines. Two disease- and development-relevant human cell
      lines were selected: the triple-negative breast cancer line MDA-MB-468 (untreated versus
      paclitaxel or vorinostat treatment) and the reference iPSC line KOLF2.1J (undifferentiated
      versus differentiation to neural progenitor cells, neurons, and cardiomyocytes). Both
      were selected as ethically sourced and well characterized.
  - description: >-
      Purposive selection of protein targets. The project targets approximately 100 chromatin
      modifiers and 100 metabolic enzymes implicated in cancer, neuropsychiatric, and cardiac
      disorders, with additional proteins added on the basis of significant hits from genetic
      perturbation and protein-protein interaction results.
  - description: >-
      Genome-scale sampling for the iPSC perturbation atlas. The expressed genome-scale
      CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs targets 11,739 expressed genes. The
      targeted CRISPR lentiviral library for chromatin regulators used 6 guide RNAs per gene
      across 100 genes.
  - description: >-
      Limitation of the sampling frame. Because sampling is restricted to two commercially
      available cell lines and a purposively chosen protein panel, the released instances do
      not constitute a random or representative sample of human cells, tissues, donors, or
      the full proteome; protein sets interrogated by the different modalities overlap
      incompletely.

instances:
  - description: >-
      Immunofluorescence image instances. Each instance is a four-channel confocal microscopy
      image of MDA-MB-468 cells in a given treatment condition, capturing one protein of
      interest (green channel) together with three reference-marker channels (DAPI nuclei,
      calreticulin endoplasmic reticulum, tubulin microtubules). Each condition-level image
      set covers the spatial localization of 464 proteins of interest.
  - description: >-
      Mass spectrometry instances. For AP-MS, each instance is a raw mass spectrometry
      acquisition from an affinity purification of an endogenously tagged bait protein (or a
      control) in a given drug condition and biological replicate. For SEC-MS, each instance is
      a raw acquisition of one size-exclusion chromatography fraction, and the derived
      instance is a protein elution profile across fractions for a given sample and replicate.
  - description: >-
      Perturbation sequencing instances. Each instance is a single cell with an assigned
      CRISPRi guide RNA / targeted gene and its associated single-cell transcriptome; the
      aggregated atlas represents transcriptional and fitness phenotypes associated with
      11,739 targeted genes in KOLF2.1J iPSCs.

relationships:
  - description: >-
      Protein-protein relationships. AP-MS and SEC-MS instances encode pairwise
      protein-protein interaction and co-elution relationships among proteins; these are the
      edges from which protein interaction networks are constructed.
  - description: >-
      Hierarchical containment relationships. In the CM4AI cell-map representation (produced
      downstream from these data and not included in this release), nodes are protein
      assemblies and directed edges denote containment of a smaller assembly by a larger one,
      forming a directed acyclic graph spanning compartment-scale to complex-scale assemblies.
  - description: >-
      Condition and lineage relationships. Instances are related by matched experimental
      contrasts: untreated versus paclitaxel versus vorinostat in MDA-MB-468 cells, and
      undifferentiated iPSC versus neural progenitor cell versus neuron versus cardiomyocyte
      in the KOLF2.1J lineage series.

subpopulations:
  - name: MDA-MB-468 donor characteristics
    description: >-
      The MDA-MB-468 triple-negative breast cancer cell line (RRID:CVCL_0419) was established
      from a metastatic-site pleural effusion of a 51-year-old Black female with a metastatic
      mammary adenocarcinoma. All breast cancer instances in this release derive from this
      single donor-derived line.
  - name: KOLF2.1J donor characteristics
    description: >-
      The KOLF2.1J induced pluripotent stem cell line (RRID:CVCL_B5P3) was derived from a
      healthy male Northern European donor and is available from the Human Induced Pluripotent
      Stem Cells Initiative (HipSci) resource. All iPSC and iPSC-derived instances in this
      release derive from this single donor-derived line.
  - name: Cell state and lineage subpopulations
    description: >-
      Instances are grouped by cellular state: MDA-MB-468 untreated, paclitaxel-treated, and
      vorinostat-treated; and KOLF2.1J undifferentiated (parental), neural progenitor cells,
      neurons, and cardiomyocytes.

