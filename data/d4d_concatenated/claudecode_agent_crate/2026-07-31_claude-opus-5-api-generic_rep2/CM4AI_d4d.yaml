      (pmali@ucsd.edu) for CRISPRi perturbation data.

updates:
  description: >-
    The dataset will be regularly updated and augmented on a quarterly basis through the end of
    the project. The project end is stated as November 2026 in the release documentation and
    maintenance plan, while the NIH RePORTER record for award OT2OD032742 gives a project end
    date of 2026-08-31. Planned additions include predicted/computed cell maps, immunofluorescence
    images for iPSC-derived cell types, and AP-MS interactomes for additional conditions; the
    data releases page marks these as "coming soon". Long-term preservation is in the University
    of Virginia Dataverse, supported by committed institutional funds. Software packages are
    versioned as the project progresses, and the version used to produce each dataset is
    referenced in that dataset's metadata.

version_access:
  description: >-
    Version history is maintained by the University of Virginia Dataverse, which exposes a
    Versions tab and version-difference views for each dataset. Each quarterly release is
    additionally issued as a separately citable dataset with its own DOI, so earlier data
    releases remain independently retrievable: May 2024 (10.18130/V3/DXWOS5), March 2025
    (10.18130/V3/B35XWX, version 1.4), June 2025 (10.18130/V3/F3TD5R, version 2.1), October 2025
    (10.18130/V3/K7TGEM, version 2.1), and June 2026 (10.18130/V3/HIGT4C, version 2.0). The
    archived RO-Crates for each release provide corresponding machine-readable metadata and
    provenance snapshots.

retention_limit:
  description: >-
    Long-term preservation in the University of Virginia Dataverse (LibraData), supported by
    committed institutional funds. No deletion schedule or retention expiry is specified for the
    released data. Dataverse notes that individual files may carry retention periods or embargoes;
    for this release all ten files are public with no retention expiry indicated. A standing
    availability caveat is displayed by the hosting collection and by the CM4AI website: "This
    collection/repository is under review for potential modification in compliance with
    Administration directives."

errata:
  - description: >-
      June 2025 release revision. The June 2025 Data Release (DOI 10.18130/V3/F3TD5R) was
      revised to version 2, adding RGB immunofluorescent images, applying corrections to
      RO-Crate metadata, and changing naming conventions. Immunofluorescence archive names and
      MD5 checksums changed accordingly between the March 2025 release
      (cm4ai-v0.6-beta-if-images-*.zip) and subsequent releases (cm4ai_ifimages_MDA-MB-468_*.zip).
  - description: >-
      Immunofluorescence protein counts were restated between releases. The March 2025 release
      described spatial localization of 563 proteins of interest per condition; the June 2025,
      October 2025, and June 2026 releases describe 464 proteins of interest per condition.
  - description: >-
      Immunofluorescence archive checksums changed again for the June 2026 release relative to
      the October 2025 release despite identical file names and identical reported (one-decimal
      GB) sizes, for example cm4ai_ifimages_MDA-MB-468_untreated.zip MD5
      a98affcc05429650c6bb3906cd836d55 in October 2025 versus 6d066e6b9d762284c6aa5d0b44565568
      in June 2026.

extension_mechanism:
  description: >-
    The project provides open-source tooling that allows others to extend, reproduce, and build
    upon the released data. The Cell Mapping Toolkit / MuSIC pipeline is distributed as
    pip-installable Python packages on GitHub (https://github.com/idekerlab/cellmaps_pipeline)
    with full user documentation at https://cellmaps-pipeline.readthedocs.io/, under BSD-3 for
    alpha-level tools and archived in Zenodo for production-ready tools; it provides a flexible
    and generalizable framework enabling researchers to integrate and construct cell maps from
    multiple input modalities. The FAIRSCAPE AI-readiness framework (client and server) is
    pip-installable and MIT-licensed, documented at https://fairscape.github.io. The project
    solicits community engagement through the CM4AI web portal, mailing lists, shared
    collaboration spaces, CodeFest events, internships, and a Diversity, Equity, and Inclusion
    Committee. Project-related inquiries are directed to the Program Manager
    (snthaker@uab.edu), and dataset governance questions to the Data Governance Committee
    (jillianparker@health.ucsd.edu).

external_resources:
  - description: >-
      Project publication describing CM4AI goals, methods, standards, datasets, tools, status,
      and future directions: Clark T, Mohan J, Schaffer L, Obernier K, et al., "Cell Maps for
      Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant
      Cell Lines," bioRxiv 2024.05.21.589311, https://doi.org/10.1101/2024.05.21.589311
      (CC-BY-NC-ND 4.0).
  - description: >-
      Associated publication for the iPSC perturbation data: Nourreddine S, Doctor Y, Dailamy A,
      et al., "A Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells," bioRxiv
      2024.11.03.621734, https://doi.org/10.1101/2024.11.03.621734, PMCID PMC11580897.
  - description: >-
      Methodological precedent for multimodal cell mapping: Qin Y, Huttlin EL, Winsnes CF, et
      al., "A multi-scale map of cell structure fusing protein images and interactions," Nature
      600:536-542 (2021), https://doi.org/10.1038/s41586-021-04115-9.
  - description: >-
      Related multimodal cell map study listed among the release's associated publications:
      Schaffer LV, Hu M, Qian G, et al., "Multimodal cell maps as a foundation for structural
      and functional genomics," Nature 642:222-231 (2025),
      https://doi.org/10.1038/s41586-025-08878-3 (open access, CC BY 4.0), with a Publisher
      Correction published 2025-10-02 (https://doi.org/10.1038/s41586-025-09648-x). That study
      maps U2OS osteosarcoma cells and its underlying AP-MS, imaging, and SEC-MS data are a
      separate dataset; no U2OS data are included in this CM4AI release.
  - description: >-
      NIH RePORTER record for the funding award: https://reporter.nih.gov/project-details/11211616
      (application ID 11211616, project number 3OT2OD032742-01S2, core project OT2OD032742).
  - description: >-
      CM4AI project portal and data releases index: https://cm4ai.org/ and
      https://cm4ai.org/data-releases/. The portal reports cumulative project counts of 1,374
      protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated,
      11,739 genes targeted, and 21.4 TB of data volume.
  - description: >-
      MassIVE depositions of raw mass spectrometry data:
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915 (AP-MS paclitaxel),
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917 (AP-MS vorinostat),
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676 (SEC-MS iPSC series), and
      https://massive.ucsd.edu/ProteoSAFe/dataset.jsp?task=ad8b8084f5b14af5bafac70fdd42a577
      (SEC-MS treated cancer cells, MSV000098237, doi:10.25345/C5348GV4S).
  - description: >-
      Figshare deposition of the aggregated iPSC perturbation cell atlas:
      https://figshare.com/s/ee85bb1880921326249b.
  - description: >-
      Cell Mapping Toolkit source and documentation:
      https://github.com/idekerlab/cellmaps_pipeline and https://cellmaps-pipeline.readthedocs.io/.
  - description: >-
      FAIRSCAPE AI-readiness framework documentation and installation instructions:
      https://fairscape.github.io.
  - description: >-
      Integrative Modeling Platform (IMP) used for integrative structure modeling of protein
      assemblies: https://integrativemodeling.org.
  - description: >-
      Multiscale Integrated Cell visualization portal for browsing cell maps:
      http://musicmaps.ai/u2os-cellmap/, and the Network Data Exchange for map distribution:
      https://ndexbio.org.
  - description: >-
      License text governing reuse: Creative Commons Attribution-NonCommercial-ShareAlike 4.0
      International, https://creativecommons.org/licenses/by-nc-sa/4.0/.
  - description: >-
      Controlled vocabulary terms indexed for this release include MeSH D001943 (Breast
      Neoplasms), D057026 (Induced Pluripotent Stem Cells), D064113 (CRISPR-Cas Systems),
      D013058 (Mass Spectrometry), D005453 (Fluorescent Antibody Technique), D017239
      (Paclitaxel), D000077337 (Vorinostat); EDAM topic_0121 (Proteomics), topic_3170 (RNA-Seq),
      topic_3320 (Functional genomics), topic_3474 (Machine learning); and Cellosaurus CVCL_0419
      (MDA-MB-468) and CVCL_B5P3 (KOLF2.1J).