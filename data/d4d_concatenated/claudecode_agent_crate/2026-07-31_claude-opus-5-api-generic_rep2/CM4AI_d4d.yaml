purposes:
  - description: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
      produced from multimodal interrogation of chromatin modifiers, metabolic enzymes, and
      other proteins involved in cancer, neuropsychiatric, and cardiac disorders in
      disease-relevant cell lines under treated and untreated conditions, using
      mass-spectrometry-based proteomics, spatial proteomics / cell imaging, and genetic
      perturbation via CRISPR/Cas9.
  - description: >-
      To serve as the Functional Genomics Data Generation Project of the NIH Common Fund
      Bridge2AI program, mapping the spatiotemporal architecture of human cells and using
      these maps toward the grand challenge of interpretable genotype-phenotype learning.
  - description: >-
      To broadly stimulate research and development in "visible" machine learning systems
      informed by multi-scale cell and tissue architecture, so that genomic prediction models
      are built on knowledge maps of cell structure rather than being difficult-to-interpret
      black boxes.
  - description: >-
      To demonstrate and disseminate an ethical, FAIR, AI-readiness framework for biomedical
      data, including deep provenance graphs, rich metadata, data dictionaries, and
      replication packages, implemented with the FAIRSCAPE framework and RO-Crate packaging.

addressing_gaps:
  - description: >-
      In genomics and precision medicine, machine learning models are often "black boxes,"
      predicting phenotypes from genotypes without revealing the mechanisms by which such
      translation occurs. CM4AI addresses this deficiency by generating matched data and
      tools that enable creation of visible machine learning systems built directly on
      knowledge maps of cell and tissue architecture.
  - description: >-
      Much of human subcellular architecture remains uncharted, and complementary mapping
      technologies (imaging, biochemical proteomics, genetic perturbation) have typically been
      applied separately rather than integrated. CM4AI generates matched, proteome-scale
      datasets across modalities in the same cellular contexts so that they can be fused.
  - description: >-
      Existing biomedical datasets frequently lack the provenance, characterization, and
      ethical documentation required for reliable AI/ML use. CM4AI packages its outputs with
      machine-readable provenance graphs, schemas, and licensing to meet an explicit
      AI-readiness definition (FAIR, provenanced, characterized, explainable, ethical).

tasks:
  - description: >-
      Construction of hierarchical, multiscale maps of protein assemblies (cell maps) as
      directed acyclic graphs in which each node represents an assembly of proteins in
      proximity at a given scale, from large compartments (nucleus, mitochondria) to small
      protein complexes.
  - description: >-
      Training and evaluation of interpretable "visible" neural networks (VNNs) and other
      biologically structured machine learning models that use cell architecture to predict
      cell-level phenotypes from genotype.
  - description: >-
      Protein-protein interaction network inference from affinity purification-mass
      spectrometry (AP-MS) and size exclusion chromatography-mass spectrometry (SEC-MS)
      co-elution profiles.
  - description: >-
      Analysis of protein subcellular localization and distribution from multi-channel
      immunofluorescence confocal microscopy images.
  - description: >-
      Mapping of transcriptional and fitness phenotypes associated with targeted genes from
      single-cell CRISPRi perturbation (perturb-seq) screens.
  - description: >-
      Analysis of cell architectural changes and protein interaction rewiring in the presence
      of specific disease processes, drug treatment conditions (paclitaxel, vorinostat), or
      genetic perturbations, and across differentiation states.

