raw_data_sources:
  - source_description: >-
      MassIVE repository accession MSV000101915 - EndoTag AP-MS raw data from MDA-MB-468 cells
      under paclitaxel perturbation (441.2 GB), available at
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915 under CC0.
  - source_description: >-
      MassIVE repository accession MSV000101917 - EndoTag AP-MS raw data from MDA-MB-468 cells
      under vorinostat perturbation (532.5 GB), available at
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917 under CC0.
  - source_description: >-
      MassIVE repository accession MSV000100676 - SEC-MS raw data for the KOLF2.1J iPSC,
      NPC, neuron, and cardiomyocyte differentiation series (1.11 TB), available at
      https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676 under CC0.
  - source_description: >-
      MassIVE repository accession MSV000098237 (doi:10.25345/C5348GV4S) - SEC-MS raw data for
      MDA-MB-468 cells treated with vorinostat or paclitaxel (910 GB), FTP location
      ftp://massive-ftp.ucsd.edu/v10/MSV000098237/.
  - source_description: >-
      Raw single-cell sequence data (FASTQ) for the KOLF2.1J genome-scale CRISPRi Perturbation
      Cell Atlas (16.7 TB). Deposited to the NCBI Sequence Read Archive / BioProject; the
      access URL is recorded as "Embargoed" in the June 2026 release metadata.
  - source_description: >-
      Figshare deposition of the aggregated Perturbation Cell Atlas of human induced
      pluripotent stem cells (177.35 GB), https://figshare.com/s/ee85bb1880921326249b.
  - source_description: >-
      Raw four-channel confocal immunofluorescence microscopy images of MDA-MB-468 cells
      generated in the Lundberg Laboratory at Stanford University, distributed directly in the
      Dataverse release as per-condition ZIP archives.

raw_sources:
  - description: >-
      Bruker instrument raw acquisitions (.d files and .d directory groups) and associated
      .xml, .tsv, and TSV search outputs constitute the raw and intermediate mass spectrometry
      layer for the AP-MS and SEC-MS collections.
  - description: >-
      Raw confocal microscopy image files (image/jpeg among the catalogued formats) with four
      colour channels per field of view constitute the raw spatial proteomics layer; the June
      2025 revision added RGB immunofluorescent images alongside the channel images.
  - description: >-
      Compressed sequencing reads (fastq.gz) from 10x Genomics 3'HT single-cell libraries
      constitute the raw perturbation sequencing layer; h5 and h5ad matrices constitute the
      processed and aggregated layers.

preprocessing_strategies:
  - name: Mass spectrometry search and quantification
    description: >-
      Raw mass spectrometry acquisitions are searched and quantified to produce protein-level
      reports. For the KOLF2.1J SEC-MS differentiation series, raw data were processed using
      Spectronaut, with downstream analysis conducted in R using MSstats-compatible formats.
      For the treated cancer-cell SEC-MS collection, nine computations transform nine
      experiments into nine per-condition protein reports, each governed by a documented
      schema.
  - name: Single-cell perturbation data aggregation
    description: >-
      Per-channel molecule datasets (90 inputs across chips and channels) are processed and
      aggregated into a pan-genome perturbation cell atlas dataset (h5ad/h5), recorded in the
      RO-Crate as computation "perturbation-cell-atlas-data-processing" with an associated
      schema.
  - name: Modality-specific embedding and multimodal integration (MuSIC pipeline)
    description: >-
      The project's Multi-Scale Integrated Cell (MuSIC) pipeline reduces protein-protein
      interaction networks to embeddings using the node2vec deep learning model, reduces
      immunofluorescence images to embeddings using a Human Protein Atlas deep learning model,
      integrates the two into a per-protein co-embedding using contrastive deep learning such
      that original embeddings can be reconstructed with minimal information loss, and then
      performs multi-resolution community detection to produce a hierarchy of protein
      assemblies. This pipeline is implemented as pip-installable Python packages
      (cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding,
      cellmaps_ppi_embedding, cellmaps_coembedding, cellmaps_generate_hierarchy,
      cellmaps_hierarchyeval). Computed cell maps are not included in this release.
  - name: AI-readiness packaging
    description: >-
      Each pipeline segment calls the FAIRSCAPE client to validate inputs and emit an RO-Crate
      containing datasets, metadata, software, and JSON-Schema data-dictionary descriptions.
      RO-Crates are registered on the FAIRSCAPE server, assigned persistent ARK identifiers,
      decomposed into individually identified components, and linked by end-to-end provenance
      entailments expressed in the EVI Evidence Graph Ontology, serialized as JSON-LD and
      RDF-XML with human-readable landing pages.

cleaning_strategies:
  - description: >-
      Experimental controls built into acquisition. AP-MS experiments were performed in four
      biological replicates, with each batch including an untagged parental control, ten
      chromatin-modifier tagged cell lines, and a positive control tagged line;
      DMSO-treated samples serve as vehicle controls across all AP-MS experiments.
  - description: >-
      Replicate design for SEC-MS. The KOLF2.1J differentiation series was collected with
      multiple biological replicates per state (parental 1-4, NPC 1-2, neuron 1-3,
      cardiomyocyte 1-2), and the treated cancer-cell series with three conditions of three
      replicates each, enabling reproducibility assessment of elution profiles.
  - description: >-
      Quality control of perturbation screens. Following generation of single-cell CRISPR
      screens in MDA-MB-468 cells and undifferentiated KOLF2.1J iPSCs, the project reported
      that the resulting data were undergoing quality control; the iPSC atlas findings were
      further validated via phenotypic, protein-interaction, and metabolic tracing assays.
  - description: >-
      Imaging quality control. Spatial proteomics used established automated fixation and
      permeabilization protocols on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines,
      with antibodies drawn from the Human Protein Atlas resource.

missing_data_documentation:
  - description: >-
      Recorded missing-data statement for this release (rai:dataCollectionMissingData): some
      datasets are under temporary pre-publication embargo; protein-protein interaction
      (SEC-MS), protein localization (IF imaging), and CRISPRi perturb-seq data interrogate
      sets of proteins which incompletely overlap; and computed cell maps are not included in
      this release.
  - description: >-
      External access placeholders. In the June 2026 release, the external links for
      perturb-seq data in KOLF2.1J iPSCs (undifferentiated) and in MDA-MB-468 cells (with and
      without treatment) are both recorded as "Embargoed" rather than resolvable repository
      accessions.
  - description: >-
      Partial coverage relative to project plan. The project targets approximately 100
      chromatin modifiers and 100 metabolic enzymes; SEC-MS in MDA-MB-468 cells identified
      72 of 100 chromatin modifiers, of which 52 were integral components of protein
      complexes. Immunofluorescence coverage in this release is 464 proteins of interest per
      condition.

anomalies:
  - description: >-
      Sparse file-level integrity metadata. The AI-readiness assessment for this release
      reports that checksums are present for only 8 of 55,859 catalogued entities
      (approximately 0 percent), limiting file-level integrity verification of the deep
      inventory, although the ten distributed Dataverse archives each carry an MD5 checksum.
  - description: >-
      Release-date inconsistency in project documentation. The CM4AI data releases page labels
      DOI 10.18130/V3/HIGT4C as the "June 2026 Data Release (Beta)" while displaying "Released
      on: June 17, 2025"; the authoritative Dataverse metadata gives publication date
      2026-06-17 with version 2 released 2026-07-15T20:28:19Z.
  - description: >-
      Version and size discrepancies between packaging layers. The Dataverse record reports
      published version 2.0 while the RO-Crate root entity declares version "1.0"; the
      RO-Crate reports contentSize "19.9 TB" while its own evidence-graph total
      (evi:totalContentSizeBytes) is 21,051,331,945,400 bytes (approximately 21.05 TB). The
      RO-Crate root also records datePublished 2026-06-30, which matches neither the Dataverse
      publication date (2026-06-17) nor the version 2 release time (2026-07-15).
  - description: >-
      Author-list divergence between packaging layers. The RO-Crate author array lists Marquez
      C but not Park S or Zhao X, while the recommended citation string in the same RO-Crate
      lists Park S and Zhao X but not Marquez C.
  - description: >-
      Date-semantics tension for the Dataverse "Data Creation Date". Dataverse records both a
      Data Creation Date and a Deposit Date of 2025-02-27 for a release whose stated collection
      window runs 2022-09-01 to 2026-06-01 and whose files were published in 2026. The
      2025-02-27 value therefore appears to reflect record creation or deposit rather than the
      creation date of the underlying data.

known_biases:
  - description: >-
      Cell-line derivation bias (stated by the data producers): data in this release were
      derived from commercially available de-identified human cell lines and do not represent
      all biological variants which may be seen in the population at large.
  - description: >-
      Single-donor representation per lineage. All breast cancer instances derive from one
      donor-derived line (MDA-MB-468: 51-year-old Black female, metastatic mammary
      adenocarcinoma) and all stem-cell and differentiated instances from one donor-derived
      line (KOLF2.1J: healthy male Northern European donor). Sex, ancestry, age, and disease
      context are therefore confounded with cell line identity.
  - description: >-
      Cancer cell line genomic context. MDA-MB-468 is an established triple-negative breast
      cancer line with its own mutational profile; protein interaction and localization
      patterns observed in it reflect a transformed cellular context rather than normal tissue.
  - description: >-
      Target-selection bias. Proteins were purposively selected (approximately 100 chromatin
      modifiers and 100 metabolic enzymes implicated in cancer, neuropsychiatric, and cardiac
      disorders), so proteome coverage is concentrated on these functional classes rather than
      being uniform across the proteome.
  - description: >-
      Reagent-availability bias in spatial proteomics. Immunofluorescence mapping relies on
      the Human Protein Atlas resource of antibodies, so protein coverage in the imaging
      modality is constrained to targets for which validated antibodies are available.
  - description: >-
      Cross-modality coverage imbalance. Protein-protein interaction (SEC-MS), protein
      localization (IF imaging), and CRISPRi perturb-seq data interrogate sets of proteins
      which incompletely overlap, so integrative analyses will be biased toward proteins
      covered by multiple modalities.

known_limitations:
  - description: >-
      This is an interim (Beta) release; the data are not yet in completed final form.
  - description: >-
      The release does not contain predicted or computed cell maps, which are planned for
      future releases; the current release is most suitable for bioinformatics analysis of the
      individual datasets rather than integrated cell-map analysis.
  - description: >-
      Some datasets are under temporary pre-publication embargo, notably the perturb-seq
      external repository links.
  - description: >-
      Protein-protein interaction, protein localization, and CRISPRi perturb-seq data
      interrogate sets of proteins which incompletely overlap.
  - description: >-
      Meaningful analysis requires domain expertise in proteomics, spatial imaging, single-cell
      genomics, and cell biology.
  - description: >-
      The bulk of the underlying raw data volume resides in external repositories (MassIVE,
      SRA, Figshare); the small archives in the Dataverse release for AP-MS, SEC-MS, and
      perturb-seq are metadata and manifest packages rather than the raw data themselves.

sensitive_elements:
  - description: >-
      Human-derived molecular sequence content. The release includes single-cell RNA
      sequencing data and raw sequence data generated from human donor-derived cell lines
      (KOLF2.1J iPSC and MDA-MB-468). The project records these samples as de-identified,
      records "Human Subjects: No" and "FDA Regulated: No", and classifies the release
      confidentiality level as Unrestricted.
  - description: >-
      Donor demographic attributes are documented at the cell-line level (age, sex, and
      ancestry of the originating donors) in the source literature describing MDA-MB-468 and
      KOLF2.1J, and are inseparable from the cell lines used.

confidential_elements:
  - description: >-
      Temporarily embargoed components. External access to the perturb-seq raw sequence data
      for KOLF2.1J iPSCs and for MDA-MB-468 cells is recorded as "Embargoed" in the June 2026
      release, pending publication; the corresponding metadata and manifests are released.
  - description: >-
      Commercial-use restriction. Although the released data are openly accessible, commercial
      use is not permitted under the CC BY-NC-SA 4.0 license and requires a separate license
      negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending on the
      specific data package), supervised by the CM4AI Data Access Committee.

is_deidentified:
  description: >-
    The release is documented as containing no personal data. Dataverse governance metadata
    records "Human Subjects: No", "De-identified Samples: Yes", and "FDA Regulated: No". The
    RO-Crate records humanSubjectResearch as "None - data collected from commercially available
    cell lines" and humanSubjectExemption as "Exempt - research with commercially available
    de-identified human cell lines does not constitute human subjects research", with
    confidentialityLevel "Unrestricted". The CM4AI preprint states that CM4AI data are
    non-clinical, derived from tissue cultures, and are considered de-identified as they cannot
    be matched, with current knowledge, to a human subject.

human_subject_research:
  description: >-
    No human subjects research was conducted for this release. Data were collected from
    commercially available, de-identified human cell lines (MDA-MB-468 from ATCC; KOLF2.1J from
    the HipSci resource). The project records an explicit exemption: "Exempt - research with
    commercially available de-identified human cell lines does not constitute human subjects
    research." No IRB protocol number is reported in the release documentation. Ethical
    oversight for the project is provided by the CM4AI Ethics module rather than by a human
    subjects protocol.

informed_consent:
  - description: >-
      Recorded as not applicable: data were collected from commercially available de-identified
      human cell lines (KOLF2.1J iPSC and MDA-MB-468), and no primary human subjects research
      was conducted under this release. The KOLF2.1J line is distributed to not-for-profit
      organizations by the HipSci resource under a simple material transfer agreement.

at_risk_populations:
  description: >-
    Recorded as none: no human subjects are involved and only commercially sourced,
    de-identified cell lines are used. No minors, pregnant women, prisoners, or other
    specifically protected populations were enrolled or sampled for this release.

ethical_reviews:
  - description: >-
      Named ethical review leads for the release: Vardit Ravitsky (The Hastings Center /
      University of Montreal; ravitskyv@thehastingscenter.org) and Jean-Christophe
      Belisle-Pipon (Simon Fraser University; jean-christophe_belisle-pipon@sfu.ca).
  - description: >-
      Project-level ethics programme. The CM4AI Ethics module works with the Data Acquisition,
      Tools, and Standards modules on ethical preparation, licensing, dissemination, and Data
      Access supervision. It employs a methodology inspired by Value-Sensitive Design to create
      normative standards and expectations, has developed a first version of a Value
      Repository, and is formulating the CM4AI Life Cycle framework describing governance
      milestones across data generation and AI system development.
  - description: >-
      Consortium-level governance. The CM4AI Ethics Pillar supported the Bridge2AI Ethics
      Working Group and the Bridge2AI Data Sharing and Dissemination Working Group in
      developing a Code of Conduct that participants must attest and commit to before accessing
      Bridge2AI data, including CM4AI datasets.
  - description: >-
      Data governance. A Data Governance Committee, with Jillian Parker
      (jillianparker@health.ucsd.edu) named as contact, supervises ethical matters related to
      dataset distribution and potential dual licensing for commercial use.

license_and_use_terms:
  description: >-
    Released under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    license (CC BY-NC-SA 4.0, https://creativecommons.org/licenses/by-nc-sa/4.0/). Users are
    free to share and adapt the material provided they give appropriate credit, provide a link
    to the license, and indicate if changes were made; may not use the material for commercial
    purposes; must distribute contributions under the same license; and may not apply
    additional legal terms or technological measures that restrict others from doing what the
    license permits. Conditions of access recorded for this release: "Attribution is required
    to the copyright holders and the authors. Any publications referencing this data or derived
    data products should cite the Related Publications below, as well as directly citing this
    data collection." Some component sub-crates deposited in MassIVE are released under CC0
    (https://creativecommons.org/publicdomain/zero/1.0/).

ip_restrictions:
  description: >-
    Copyright (c) 2026 The Regents of the University of California except where otherwise
    noted. Spatial proteomics raw image data is copyright (c) 2026 The Board of Trustees of the
    Leland Stanford Junior University. Commercial use requires a separate license negotiation
    with the copyright holder (UCSD, Stanford, and/or UCSF depending on the specific data
    package in question). A Data Access Committee supervises ethical matters related to dataset
    distribution and potential dual licensing for commercial use. CM4AI integration and
    packaging software is separately licensed: the Tools data integration pipeline under BSD-3,
    and the FAIRSCAPE framework under the MIT license with copyright held by the Rector and
    Board of Visitors of the University of Virginia.

regulatory_restrictions:
  description: >-
    The release records "FDA Regulated: No" and "Human Subjects: No", with confidentiality
    level "Unrestricted". No export control (for example ITAR or EAR) or privacy-regulation
    (for example GDPR or HIPAA) restrictions are asserted in the release documentation. A
    non-regulatory availability caveat is displayed by the hosting repository: "This collection
    is under review for potential modification in compliance with Administration directives."

intended_uses:
  - description: >-
      Provision of AI-ready datasets to support research in functional genomics.
  - description: >-
      AI and machine learning model training, in particular biologically driven, interpretable
      ("visible") machine learning applications of the kind proposed in Ma et al. 2018
      (PMID 29505029) and Kuenzi et al. 2020 (PMID 33096023).
  - description: >-
      Cellular process analysis.
  - description: >-
      Analysis of cell architectural changes and protein interactions in the presence of
      specific disease processes, treatment conditions, or genetic perturbations.
  - description: >-
      Use as a foundation for downstream applications in human genomics, including
      interpretation of genetic variants and mutations.

other_tasks:
  - description: >-
      Integrative structure modeling. The project is exploring the feasibility of integrative
      structure modeling of MuSIC communities, annotating communities by available structural
      information from the Protein Data Bank, the AlphaFold Protein Structure Database,
      crosslinking mass spectrometry, and disorder prediction, and computing models with the
      open-source Integrative Modeling Platform (IMP).
  - description: >-
      Drug response and synergy prediction using deep learning models of human cancer cells,
      cited by the project as an established application of cell-structure-informed models.
  - description: >-
      Interpretation of cancer mutations using multiscale maps of protein systems.
  - description: >-
      Educational and training use. Datasets and tutorials were provided at the CM4AI CodeFest
      (March 2024) and are used in an in-person internship hosted at Yale University and the
      University of California San Diego covering the impact of cell maps on biomedical
      research, interaction with CM4AI data and standards, development of visible neural
      networks using cell maps, and integration of external data into an existing cell map.

existing_uses:
  - description: >-
      Internal use as input to the CM4AI Multi-Scale Integrated Cell (MuSIC) pipeline. The
      first set of immunofluorescence images was released as input for the CM4AI Tools module's
      MuSIC pipeline and processed to RO-Crate outputs.
  - description: >-
      The KOLF2.1J genome-scale CRISPRi perturbation data underpin the associated preprint
      Nourreddine S, Doctor Y, Dailamy A, et al., "A Perturbation Cell Atlas of Human Induced
      Pluripotent Stem Cells," bioRxiv 2024.11.03.621734 (PMCID PMC11580897).
  - description: >-
      Use in training and community engagement, including the CM4AI CodeFest held in March
      2024 with 38 registrants, where the data were distributed with tutorials explaining how
      they were derived and integrated and with production-ready software for producing the
      datasets.
  - description: >-
      Dataverse usage metrics recorded for CM4AI releases indicate downstream retrieval: 181
      downloads for the June 2026 release, 405 for October 2025, 302 for March 2025, and 256
      for June 2025.

discouraged_uses:
  - description: >-
      Use of this interim release for integrated, cell-map-level analysis is discouraged: the
      release does not contain predicted cell maps and is most suitable for bioinformatics
      analysis of the individual datasets.
  - description: >-
      Generalization to human population-level biology is discouraged: the data derive from two
      commercially available de-identified human cell lines and do not represent the biological
      variation present in the population at large.
  - description: >-
      Analysis without relevant domain expertise is discouraged; meaningful interpretation
      requires familiarity with the underlying proteomic, imaging, and single-cell assay
      modalities.

prohibited_uses:
  - description: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
  - description: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license without a separate
      license negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending on
      the data package).
  - description: >-
      Redistribution of adaptations under terms other than the same CC BY-NC-SA 4.0 license, or
      application of additional legal terms or technological measures that restrict what the
      license permits, is prohibited.
  - description: >-
      Use without attribution to the copyright holders and authors, and without citation of the
      related publications and this data collection, is prohibited by the stated conditions of
      access.

future_use_impacts:
  - description: >-
      Anticipated benefit: enabling a new generation of transformative, ethical, explainable,
      and interpretable biomedical AI. The project intends these data to deepen understanding
      of human disease and health, train a new generation of researchers, enable development of
      novel cures, and assist researchers and clinicians in equitably improving human lives.
  - description: >-
      Anticipated risk of over-generalization. Because the data derive from two cell lines,
      models trained on them may not transfer to other cell types, tissues, or human
      populations; users are cautioned that the data do not represent all biological variants
      seen in the population at large.
  - description: >-
      Anticipated risk of premature clinical translation. The project explicitly prohibits use
      in clinical decision-making or patient care without appropriate regulatory oversight and
      approval, and the Ethics module is developing guidelines, an axiological value repository,
      and a CM4AI Life Cycle governance framework to anticipate potential applications of the
      data and derived AI/ML systems, integrate them into data governance frameworks, optimize
      benefits, mitigate risks, and promote use for the collective good.

use_repository:
  - description: >-
      CM4AI web portal (http://www.cm4ai.org), built on the U-BRITE platform, providing open
      and trustworthy data management and sharing, data releases, tools, product documentation,
      publications, and learning resources.
  - description: >-
      University of Virginia Dataverse (LibraData) dataset page, which records download counts
      and citation metrics retrieved from Crossref via DataCite using Make Data Count standards.
  - description: >-
      Network Data Exchange (NDEx, https://ndexbio.org), through which CM4AI cell maps are
      shared and can be visualized in a web browser or accessed with Cytoscape, HiView, and the
      Python ndex2 library.
  - description: >-
      Integration with the NIH Common Fund Data Ecosystem (CFDE) for data curation, and a
      scholarly "talent graph" constructed by the Teaming module linking CM4AI investigators to
      their peer-reviewed publications, datasets, and tools.

distribution_formats:
  - description: >-
      Primary distribution as ZIP archives through the University of Virginia Dataverse
      (LibraData). The June 2026 release comprises ten ZIP archives: three immunofluorescence
      image archives (4.6 GB untreated, 3.8 GB paclitaxel, 4.2 GB vorinostat), two AP-MS
      metadata archives, two SEC-MS metadata archives, two perturb-seq archives, and a release
      metadata archive.
  - description: >-
      Machine-readable metadata packaging in RO-Crate format (JSON-LD conforming to RO-Crate
      1.2), with provenance graphs serialized as JSON-LD and RDF-XML, HTML provenance-graph
      views, and an HTML datasheet rendering. Metadata is also exportable from Dataverse as
      OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD, DDI Codebook v2, Dublin Core, Croissant,
      DDI HTML Codebook, and JSON.
  - description: >-
      Underlying content formats catalogued in the release RO-Crate: Bruker .d files and .d
      directory groups, .tsv and TSV, .xml, csv, fastq.gz, h5, h5ad, image/jpeg, pdf, and
      executable.
  - description: >-
      Programmatic access. Dataverse imposes a 1.9 GB browser ZIP download limit; larger files
      must be selected individually or retrieved via the Dataverse Data Access API
      (https://dataverse.lib.virginia.edu/api/access/datafile/ and
      https://dataverse.lib.virginia.edu/api/datasets/:persistentId/?persistentId=doi:10.18130/V3/HIGT4C).
  - description: >-
      Persistent identification. The release carries DOI 10.18130/V3/HIGT4C; internal
      components carry ARK persistent identifiers minted by FAIRSCAPE (ark:59853 namespace)
      that resolve to human- and machine-readable landing pages.

distribution_dates:
  - description: >-
      June 2026 Data Release (Beta), DOI 10.18130/V3/HIGT4C: Dataverse publication date
      2026-06-17; eight files published 2026-06-17 and the three immunofluorescence archives
      published 2026-07-15; version 2 release time 2026-07-15T20:28:19Z. The RO-Crate root
      entity records datePublished 2026-06-30.
  - description: >-
      Prior quarterly releases: May 2024 Data Release (DOI 10.18130/V3/DXWOS5); March 2025 Data
      Release (Beta), DOI 10.18130/V3/B35XWX, published 2025-03-03; June 2025 Data Release
      (Beta), DOI 10.18130/V3/F3TD5R, published 2025-07-01 (version 2.1 revision); October 2025
      Data Release (Beta), DOI 10.18130/V3/K7TGEM, published 2025-10-31 with additional files
      published 2025-12-22.
  - description: >-
      Planned cadence: CM4AI releases data quarterly, ensuring continuous updates to the cell
      maps and input data streams, through the end of the project.

third_party_sharing:
  - description: >-
      Open public distribution. All ten files in the June 2026 release are recorded with File
      Access "Public" in the University of Virginia Dataverse; no access request or guestbook
      gate is applied to these files.
  - description: >-
      Deposition in external domain repositories. Raw mass spectrometry data are deposited at
      MassIVE (MSV000101915, MSV000101917, MSV000100676, MSV000098237 / doi:10.25345/C5348GV4S);
      raw single-cell sequence data are deposited to the NCBI Sequence Read Archive /
      BioProject (currently embargoed); the aggregated perturbation cell atlas is shared via
      Figshare; and CM4AI cell maps are shared via the Network Data Exchange (NDEx).
  - description: >-
      Governance of onward sharing. Commercial use requires a separate license negotiation with
      the copyright holder (UCSD, Stanford, and/or UCSF depending on the specific data package),
      and a Data Access Committee supervises ethical matters related to dataset distribution and
      potential dual licensing for commercial use. Participants in the Bridge2AI Open House must
      attest and commit to a Code of Conduct prior to accessing Bridge2AI data, including CM4AI
      datasets.

