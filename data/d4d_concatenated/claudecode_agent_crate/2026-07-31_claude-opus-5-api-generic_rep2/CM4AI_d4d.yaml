acquisition_methods:
  - description: >-
      Directly observed laboratory measurement. All instances were generated de novo in cell
      culture from commercially available human cell lines by the CM4AI data generation
      laboratories, using affinity purification-mass spectrometry, size exclusion
      chromatography-mass spectrometry, immunofluorescence confocal microscopy, and
      single-cell CRISPRi perturbation sequencing.
  - description: >-
      Derived/computed. Search-engine outputs (protein and precursor quantification reports)
      and an aggregated CRISPRi perturbation cell atlas are derived from the corresponding raw
      instrument files by documented computational steps recorded in the RO-Crate provenance
      graph.

collection_mechanisms:
  - name: Affinity purification-mass spectrometry (AP-MS) on endogenously tagged cells
    description: >-
      Endogenous tagging ("EndoTag") of chromatin modifiers in MDA-MB-468 cells followed by
      affinity purification and mass spectrometry to profile drug-induced interactome
      rewiring. All AP-MS experiments were performed in four biological replicates. Each
      AP-MS batch includes an untagged parental control, 10 chromatin-modifier tagged cell
      lines, and a positive control tagged line; DMSO-treated samples serve as vehicle
      controls.
  - name: Size exclusion chromatography-mass spectrometry (SEC-MS)
    description: >-
      Proteome-wide complex and interaction mapping by separating cellular extracts by size
      exclusion chromatography and identifying proteins in each size fraction by mass
      spectrometry, producing protein correlation profiles. Data for the iPSC lineage series
      were acquired on a Bruker timsTOF platform and quantified with Spectronaut.
  - name: Immunofluorescence staining and confocal microscopy (ICC-IF)
    description: >-
      Spatial localization of proteins of interest in MDA-MB-468 cells imaged by
      immunofluorescence-based staining and confocal microscopy. Each image comprises four
      channels: nuclei stained with DAPI (blue), endoplasmic reticulum with a calreticulin
      antibody (yellow), microtubules with a tubulin antibody (red), and an antibody against
      the protein of interest (green). Automated fixation and permeabilization protocols were
      established on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
  - name: Single-cell CRISPR interference perturbation screening (perturb-seq)
    description: >-
      CRISPRi lentiviral libraries delivered to cell lines expressing inducible dCas9,
      followed by single-cell RNA sequencing using the 10x Genomics 3'HT kit. A targeted
      library covered 100 chromatin factors with 6 guide RNAs per gene; the genome-scale
      atlas mapped transcriptional and fitness phenotypes for 11,739 targeted expressed
      genes in KOLF2.1J iPSCs.

