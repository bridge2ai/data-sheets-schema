    - Compliance with NIH Bridge2AI OT terms and applicable federal regulations is required.
    - Data use may not be for commercial purposes unless specifically authorized through a separate
      agreement consistent with governing award and consortium terms.
    - The dataset record indicates FDA-regulated status.
  other_compliance:
    - Compliance with HIPAA and NIH data-sharing policies; de-identification consistent with HIPAA
      Safe Harbor.
    - Secure enclave architecture aligned with NIST 800-53 controls, with role-based access
      controls, audit logging, and controlled-access governance review.
    - Recorded human subject exemption "HIPAA exemption 4 ((45 CFR 46.104(d)(4))".
    - "Mass General Brigham IRB protocol #2022P000707 with local context review at
      contributing medical centers."
  description: >-
    The confidentiality level recorded for the dataset is "HL7:2V (very restricted)". The data
    governance committee contact is Eric Rosenthal, EROSENTHAL@mgh.harvard.edu.

