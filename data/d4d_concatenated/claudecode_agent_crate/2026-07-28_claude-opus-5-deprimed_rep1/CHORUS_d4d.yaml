      The dataset is distributed to external requestors under a controlled-access framework
      requiring institutional affiliation and credentials, an approved research proposal reviewed
      by the CHoRUS governance committee, an executed Data Use Agreement, and IRB approval or
      exemption documentation as applicable. Access is restricted to the secure enclave and no raw
      data export is permitted unless explicitly approved.

