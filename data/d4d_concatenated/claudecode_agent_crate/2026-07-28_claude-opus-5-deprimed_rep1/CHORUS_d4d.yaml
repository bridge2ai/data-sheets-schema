extension_mechanism:
  name: Contribution and extension mechanism
  contribution_url: https://github.com/chorus-ai
  extension_details:
    - Data contributing sites follow the Chorus_SOP interactive workflow diagram describing the
      step-by-step process for extracting and contributing clinical data to CHoRUS, with links to
      SOP documents that have undergone internal validation and review.
    - Issues encountered in creating or submitting a data extract can be posted in context-specific
      Standards Discussions or Data Acquisition Discussions.
    - Clinical collaborators contribute to semantic mapping through the chorus-mapping repository,
      which holds documentation, pooled tabular mappings, and an associated clinical validation
      SOP.
    - Software contributors use the chorus-developer web guide and the package status page listing
      versions, maintainers, and other metadata about CHoRUS packages.
    - Data contributing sites submit regular status updates through the GitHub interface or a
      Google Form, which triggers a GoogleScript that calls the GitHub API to update status and
      issue information into the Standards Project or the Data Acquisition Project.
    - Task tracking aggregates issues across repositories into an overall task management project
      with assigned users, anticipated delivery dates, and dependencies.

