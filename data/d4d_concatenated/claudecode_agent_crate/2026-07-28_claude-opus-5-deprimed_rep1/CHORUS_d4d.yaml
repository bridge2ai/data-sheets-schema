instances:
  - name: Patient admission
    instance_type: Hospital admission of a patient receiving intensive care
    counts: 50000
    description: >-
      The project website reports a current released dataset of 50,000 patient admissions from ICU,
      PICU, and NICU. The anticipated final dataset is 100,000 patient admissions across 14 data
      contributing hospitals. As of August 2025 the dataset covered 14 different hospitals with
      over 45,000 unique admissions. The NIH project abstract describes acquiring an AI-ready data
      set from more than 100,000 critically ill patients.
    label: true
    label_description: >-
      A visualization and annotation environment labels data with targets important for prediction.
  - name: Demographics
    instance_type: Structured EHR demographic records
    description: >-
      Demographics standardized to the OMOP common data model, controlled access, with metadata
      published under the OMOP schema.
  - name: Medication administration
    instance_type: Structured EHR medication administration records
    description: >-
      Medication administration with dosing time-stamped upon each infusion change or dose
      administration, standardized to the OMOP common data model, controlled access, with metadata
      published under the OMOP schema.
  - name: Procedures
    instance_type: Structured EHR procedure records
    description: >-
      Procedures documented by providers, standardized to the OMOP common data model, controlled
      access, with metadata published under the OMOP schema.
  - name: Nursing flowsheets
    instance_type: High-frequency structured EHR nursing documentation
    description: >-
      Nursing flowsheets capturing high-frequency documentation, standardized to the OMOP common
      data model, controlled access, with metadata published under the OMOP schema with extensions.
  - name: Diagnoses
    instance_type: Structured EHR diagnosis records
    description: >-
      Diagnoses documented by providers, standardized to the OMOP common data model, controlled
      access, with metadata published under the OMOP schema.
  - name: Clinical notes
    instance_type: Tokenized unstructured clinical text
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit, controlled access, with a
      published metadata schema based on the OHNLP open source schema. Raw clinical notes are
      stored locally at contributing institutions and only tokens are shared; as of August 2025
      note-level metadata was planned rather than complete.
  - name: Imaging study
    instance_type: Radiology imaging study from PACS
    description: >-
      Imaging obtained from hospital PACS in DICOM format under controlled access, with metadata
      published under the DICOM schema. The project website reports 7,642 admissions with radiology
      data in the current released dataset. As of August 2025, 1,000 images were available with
      de-identification in process for a larger cohort. The RO-Crate package version 1.0 Beta
      states that no DICOM images are included in that package.
  - name: Waveform telemetry record
    instance_type: High-resolution physiologic telemetry waveform
    description: >-
      Waveform telemetry captured from bedside monitors via gateway/middleware, transformed to the
      WFDB standard, controlled access, with metadata published under an extended PhysioNet schema.
      The project website reports 23 Tb of waveform data in the current released dataset; the
      waveforms sub ro-crate of the version 1.0 Beta package reports 1.201567472832 tb.
  - name: Waveform EEG record
    instance_type: Electroencephalography waveform
    description: >-
      EEG waveforms extracted from hospital EEG databases in EDF+ and Persyst formats, controlled
      access, with metadata published under the open source EDF+ and Persyst schemas. As of August
      2025, EEG extraction was in process and metadata was planned.
  - name: EHR OMOP data row
    instance_type: Row of OMOP common data model tabular data
    counts: 1600000000
    description: >-
      The project website reports 1.6 billion rows of EHR OMOP data in the current released
      dataset.

relationships:
  - name: Relationships between instances
    relationship_details:
      - Modality-specific records (demographics, medication administration, procedures, nursing
        flowsheets, diagnoses, tokenized clinical notes, imaging, telemetry waveforms and EEG
        waveforms) are linked to patient admissions after harmonization to the OMOP common data
        model.
      - Of the admissions in the current released dataset, 7,642 have associated radiology data.
      - Tokenized note and report text is linked to the structured record while raw text is
        retained locally at the contributing institution.
      - The RO-Crate package is composed of an EHR sub ro-crate and a waveforms sub ro-crate, each
        declared as part of the parent CHoRUS RO-Crate Package.
      - OMOP Location entities are geocoded so that data elements feature contextual factors such
        as geographic distance to the nearest hospital and social determinants of health.

splits:
  - name: Holdout and development splits
    split_details:
      - The dataset provisions a holdout test set, accessible for model external validation to aid
        marketplace adoption of AI-developed models for implementation in acute and critical care.
      - Sequestered holdout datasets are maintained for external validation.
      - Hold-out splits are available for testing; training and validation in development splits
        require internal mechanisms to avoid overfitting.

subpopulations:
  - name: Critical care unit populations
    subpopulation_elements_present: true
    identification:
      - Adult intensive care unit (ICU) admissions
      - Pediatric intensive care unit (PICU) admissions
      - Neonatal intensive care unit (NICU) admissions
      - Demographic attributes captured in the OMOP demographics domain
    distribution:
      - The current released dataset comprises 50,000 patient admissions drawn from ICU, PICU, and
        NICU settings.
      - Socioeconomic and demographic distribution is reflective of participating institutions.
      - Differential care pathways affect label assignment, for example ICU versus non-ICU
        populations.

anomalies:
  - name: Real-world data quality characteristics
    anomaly_details:
      - Variable sampling rates across real-world data from hospital waveform systems and
        middleware.
      - Documentation quality is dependent on routine clinical workflows and on which data elements
        are collected in clinical practice.
      - Institutional heterogeneity in coding and clinical data collection practices.

