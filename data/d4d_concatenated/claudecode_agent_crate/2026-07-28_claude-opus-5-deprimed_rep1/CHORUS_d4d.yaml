  - name: Referral bias
    bias_type: selection_bias
    bias_description: Referral bias from tertiary/quaternary academic centers.
    mitigation_strategy: Bias assessment is ongoing and documented in dataset release notes.
  - name: Institutional demographic representation
    bias_type: representation_bias
    bias_description: >-
      Socioeconomic and demographic distribution reflective of participating institutions.
    mitigation_strategy: Bias assessment is ongoing and documented in dataset release notes.
  - name: Documentation bias in clinical notes
    bias_type: measurement_bias
    bias_description: Documentation bias in clinical notes.
    mitigation_strategy: Bias assessment is ongoing and documented in dataset release notes.
  - name: Non-random missingness in acquisition
    bias_type: sampling_bias
    bias_description: >-
      Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
    mitigation_strategy: Bias assessment is ongoing and documented in dataset release notes.
  - name: Differential care pathways affecting labels
    bias_type: annotation_bias
    bias_description: >-
      Differential care pathways affecting label assignment (e.g., ICU vs non-ICU populations).
    mitigation_strategy: Bias assessment is ongoing and documented in dataset release notes.
  - name: Temporal trends in clinical practice
    bias_type: historical_bias
    bias_description: Temporal trends related to evolving clinical practice.
    mitigation_strategy: Bias assessment is ongoing and documented in dataset release notes.

known_limitations:
  - name: Observational, non-randomized data
    limitation_type: methodological_limitation
    limitation_description: >-
      Observational data; and not randomized; collected as real-world clinical data, not through
      prospective research interactions with patient.
  - name: Documentation quality dependent on clinical workflow
    limitation_type: methodological_limitation
    limitation_description: >-
      Documentation quality dependent on routine clinical workflows and data elements being
      collected in clinical practice.
  - name: Variable waveform sampling rates
    limitation_type: resolution_limitation
    limitation_description: >-
      Variable sampling rates across real-world data from hospital waveform systems and middleware.
  - name: Institutional heterogeneity
    limitation_type: integration_limitation
    limitation_description: >-
      Institutional heterogeneity in coding and clinical data collection practices.
    recommended_mitigation: >-
      Unified standards harmonize multi-modal EHR, waveform, imaging, and text data, and validated
      semantic mappings connect clinical data in various source formats to international standards.
  - name: Limited generalizability
    limitation_type: representativeness_limitation
    limitation_description: Limited generalizability beyond participating hospitals.
    scope_impact: >-
      Population inference beyond participating institutions is listed as a not-recommended use.
  - name: Inappropriate applications
    limitation_type: scope_limitation
    limitation_description: >-
      Not appropriate for re-identification, contact tracing, or patient-level intervention.
  - name: Overfitting risk in development splits
    limitation_type: methodological_limitation
    limitation_description: >-
      Hold-out splits are available for testing; training and validation in development splits
      require internal mechanisms to avoid overfitting.
  - name: Interim release completeness
    limitation_type: coverage_limitation
    limitation_description: >-
      Interim release with partial data. Not all patients in the CHoRUS full cohort are included.
      No DICOM images are included.
    scope_impact: >-
      Applies to the version 1.0 Beta RO-Crate package published 2026-04-03. As of August 2025,
      imaging de-identification was in process for a larger cohort and EEG extraction was in
      process.

confidential_elements:
  - name: Confidentiality of clinical source data
    confidential_elements_present: true
    confidentiality_details:
      - Confidentiality level is recorded as HL7:2V (very restricted).
      - Data are derived from patient clinical records covered by HIPAA and are made available only
        under controlled access.
      - Access is restricted to a secure enclave environment; no raw data export is permitted
        unless explicitly approved.
      - Raw clinical note text is stored locally at contributing institutions and only tokens are
        shared.

sensitive_elements:
  - name: Personal and sensitive information handling
    sensitive_elements_present: true
    sensitivity_details:
      - CHoRUS operates within a secure enclave environment aligned with NIST 800-53 controls.
      - De-identification consistent with HIPAA Safe Harbor
      - Removal or tokenization of direct identifiers
      - Date shifting or limited date fields when required
      - Role-based access control (RBAC)
      - Multi-factor authentication
      - Full audit logging of data access and queries
      - Prohibition of re-identification attempts
      - Data export restrictions and output review procedures to reduce risk of re-identification
      - Re-identification risk is periodically assessed and mitigation strategies updated as
        needed.

acquisition_methods:
  - name: Acquisition of instances from routine clinical care
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - Data are derived from routine clinical care at participating hospitals under IRB oversight
        and are directly observable clinical documentation rather than subject-reported responses.
      - Data are not collected solely for research but repurposed from clinical workflows under
        ethical oversight, and not through prospective research interactions with the patient.
      - Derived content includes tokenized note and report text produced by the OHNLP toolkit and
        records transformed into the OMOP common data model and the WFDB waveform standard.
      - Validated semantic mappings connect clinical data in various source formats to
        international standards, supported by a clinical validation SOP in the chorus-mapping
        repository and by characterization reports returned to sites after data submission.

collection_mechanisms:
  - name: Multi-modal collection mechanisms
    mechanism_details:
      - Electronic health record extraction and transformation to the OMOP common data model.
      - Imaging extraction from hospital PACS, with imaging metadata de-identification using the
        RSNA Clinical Trial Processor and pixel-level de-identification using IbisWorks EICON.
      - High-resolution physiologic waveform capture from bedside monitors via gateway/middleware,
        extracted and transformed to the WFDB standard.
      - EEG waveform extraction from hospital EEG databases into EDF+ and Persyst formats.
      - Clinical note extraction and tokenization using the OHNLP toolkit, with raw text retained
        locally.
      - Standardized harmonization to a common data model across contributing sites.
      - Site tooling for creating and uploading a CHoRUS data extract, distributed through the
        chorus-extract-upload repository, with a step-by-step workflow documented in the
        Chorus_SOP repository.

sampling_strategies:
  - name: Cohort sampling across contributing centers
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - Routine clinical care records of patients with acute or critical illness at 14 data
        acquisition centers within a 20-center academic collaboration.
    strategies:
      - Sampling to ensure comprehensive sets of patient conditions and clinical treatment
        strategies, established alongside a legal framework for collecting data at scale.
      - Federated access enables sampling methods to ensure a balanced and diverse cohort.
      - The released package is an interim release with partial data; not all patients in the
        CHoRUS full cohort are included.
    why_not_representative:
      - Referral bias from tertiary/quaternary academic centers.
      - Socioeconomic and demographic distribution reflective of participating institutions.
      - Limited generalizability beyond participating hospitals.

data_collectors:
  - name: Data acquisition centers
    role: Data contributing sites
    collector_details:
      - The collaboration spans 20 academic centers, of which 14 contribute as Data Acquisition
        centers.
      - Data site managers at contributing sites follow the Chorus_SOP workflow for extracting and
        contributing clinical data to CHoRUS, using SOP documents that have undergone internal
        validation and review.
      - Sites provide regular status updates on their progress creating and curating a
        CHoRUS-specific clinical data extract, submitted through the GitHub interface or a Google
        Form.
  - name: CHoRUS Data Pillar and institutional data stewards
    role: Central curation and stewardship
    collector_details:
      - Primary maintainers are the CHoRUS Data Pillar in collaboration with institutional data
        stewards.
      - The Data pillar covers Standards, Tool Development and Optimization, and Data Acquisition.
  - name: Clinical collaborators
    role: Semantic mapping and clinical validation
    collector_details:
      - Clinical expertise contributes to semantic mapping and validation within CHoRUS through the
        chorus-mapping repository, which holds documentation, pooled tabular mappings, and an
        associated clinical validation SOP.

collection_timeframes:
  - name: Retrospective collection timeframe
    timeframe_details:
      - Data collection is retrospective, drawing on documentation generated during routine
        clinical care.
      - As of August 2025 the dataset covered 14 different hospitals with over 45,000 unique
        admissions.
      - The RO-Crate package version 1.0 Beta was published on 2026-04-03.
      - The funded project period runs from 2022-09-01 to 2026-11-30.

direct_collection:
  - name: Source of the data
    is_direct: false
    collection_details:
      - Data were obtained from hospital systems of record rather than directly from the
        individuals in question; they are repurposed from clinical workflows under ethical
        oversight and not gathered through prospective research interactions with patients.
      - Sources include electronic health record systems, hospital PACS archives, bedside monitors
        with gateway/middleware capture, and hospital EEG databases at contributing centers.

collection_consents:
  - name: Consent and regulatory basis for collection
    consent_details:
      - Data are derived from routine clinical care at participating hospitals under IRB oversight,
        with IRB approval or waiver as appropriate.
      - "The dataset is covered by Mass General Brigham IRB protocol #2022P000707."
      - The recorded human subject exemption is "HIPAA exemption 4 ((45 CFR 46.104(d)(4))".
      - Local context review is performed by IRBs, HIPAA Privacy Officers, and institutional
        counsels at contributing medical centers.
      - Community-facing ethics focus groups are conducted to determine what data is appropriate
        for public sharing.

missing_data_documentation:
  - name: Missing data in the released dataset
    missing_data_patterns:
      - Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
      - Variable sampling rates across real-world data from hospital waveform systems and
        middleware.
      - Interim release with partial data; not all patients in the CHoRUS full cohort are included
        and no DICOM images are included in the version 1.0 Beta package.
      - As of August 2025, clinical notes were stored locally except for tokens, imaging
        de-identification was in process beyond an initial 1,000 images, and EEG extraction was in
        process.
      - Published metadata was recorded as planned rather than complete for clinical notes,
        telemetry waveforms, and EEG waveforms as of August 2025.
    missing_data_causes:
      - Documentation quality dependent on routine clinical workflows and on which data elements
        are collected in clinical practice.
      - Heterogeneous hospital waveform systems and middleware with differing sampling behaviour.
      - Institutional heterogeneity in coding and clinical data collection practices.
      - Staged de-identification and extraction pipelines for imaging and EEG modalities.
    handling_strategy: >-
      Release notes document schema changes, harmonization updates, and known issues, and bias
      assessment is ongoing and documented in dataset release notes.

raw_data_sources:
  - name: Hospital systems of record
    source_description: >-
      Electronic health record systems, PACS imaging archives, bedside physiologic monitors with
      gateway/middleware capture, and hospital EEG databases at the 14 data acquisition centers,
      together with unstructured clinical note and report text.
    source_type:
      - Electronic health record system
      - Picture archiving and communication system (PACS)
      - Bedside monitor and gateway/middleware telemetry capture
      - Hospital EEG database
      - Unstructured clinical note and report text
    access_details: >-
      Raw source data are not distributed. Raw clinical note text is stored locally at contributing
      institutions and only tokens are shared. Access to the curated dataset is restricted to a
      secure enclave environment, and no raw data export is permitted unless explicitly approved.
    raw_data_format:
      - Structured electronic health record data
      - Unstructured electronic health record text
      - DICOM imaging
      - Telemetry waveforms
      - EEG waveforms

raw_sources:
  - name: Availability of the raw source data
    raw_data_details:
      - The raw clinical source data remain within the contributing hospitals' systems of record
        and are not redistributed with the dataset.
      - Clinical notes are stored locally at contributing institutions; only tokenized text is
        shared through the dataset.
      - Curated data are held in a controlled-access secure enclave, and no raw data export is
        permitted unless explicitly approved.

preprocessing_strategies:
  - name: Harmonization to the OMOP common data model
    preprocessing_details:
      - Electronic health record extraction and transformation to the OMOP common data model.
      - Standardized harmonization to a common data model across contributing sites.
      - Validated semantic mappings connect clinical data in various source formats to
        international standards; pooled tabular mappings and a clinical validation SOP are
        maintained in the chorus-mapping repository.
    used_software:
      - id: software:chorus_extract_upload
        name: chorus-extract-upload
        description: >-
          Repository with tools to create and upload a CHoRUS Data Extract; Python; MIT licensed.
        url: https://github.com/chorus-ai
  - name: Waveform standardization
    preprocessing_details:
      - High-resolution physiologic waveform capture, extraction, and transformation to the WFDB
        standard.
      - EEG waveforms are handled in EDF+ and Persyst formats.
    used_software:
      - id: software:chorus_waveform
        name: chorus_waveform
        description: >-
          CHoRUS waveform documentation and various waveform conversion scripts; Jupyter Notebook;
          MIT licensed.
        url: https://github.com/chorus-ai
  - name: Imaging de-identification
    preprocessing_details:
      - Imaging metadata de-identification using the RSNA Clinical Trial Processor.
      - Pixel-level de-identification using IbisWorks EICON.
    used_software:
      - id: software:rsna_clinical_trial_processor
        name: RSNA Clinical Trial Processor
        description: Used for imaging metadata de-identification.
      - id: software:ibisworks_eicon
        name: IbisWorks EICON
        description: Used for pixel-level de-identification of images.
  - name: Clinical text tokenization
    preprocessing_details:
      - Clinical notes are extracted and tokenized using the OHNLP toolkit, and the tokenized
        output follows the OHNLP open source schema.
      - Raw note and report text is retained locally at contributing institutions.
    used_software:
      - id: software:ohnlp_toolkit
        name: OHNLP toolkit
        description: >-
          Open Health Natural Language Processing toolkit used to extract and tokenize clinical
          notes.
  - name: Geospatial contextualization
    preprocessing_details:
      - Data elements are enriched with appropriate contextual factors such as geographic distance
        to the nearest hospital and social determinants of health.
      - OMOP Location entities are geocoded using open source code.
    used_software:
      - id: software:uf_geocoding
        name: UF-Geocoding
        description: >-
          Open source code to geocode OMOP Location entities via DeGauss; forked from
          bihorac-LAB/Exposome; Python; MIT licensed.
        url: https://github.com/chorus-ai
  - name: Re-identification risk reduction
    preprocessing_details:
      - Data are transformed using approaches that limit re-identification.
      - Direct identifiers are removed or tokenized and dates are shifted or limited when required.

cleaning_strategies:
  - name: Validation and characterization of site submissions
    cleaning_details:
      - Standard operating protocols instruct data contributing sites about best practices for
        curating and delivering interoperable datasets, and SOP documents undergo an internal
        validation and review process.
      - Characterization reports are produced and returned to sites following their data
        submissions.
      - A privacy scan tool is applied to medical records.
    used_software:
      - id: software:chorus_reports
        name: CHoRUSReports
        description: >-
          Repository dedicated to producing characterization reports to return to sites following
          their data submissions; R.
        url: https://github.com/chorus-ai
      - id: software:privacy_scan_tool
        name: privacy_scan_tool
        description: A privacy scan tool for medical records; Python.
        url: https://github.com/chorus-ai

labeling_strategies:
  - name: Labeling for prediction targets
    data_annotation_platform:
      - A visualization and annotation environment developed within the CHoRUS network.
    labeling_details:
      - A visualization and annotation environment labels data with targets important for
        prediction.
      - The project develops capabilities across a multi-center network to acquire, standardize,
        tokenize, store, visualize, and label data.

machine_annotation_tools:
  - name: Automated text and privacy tooling
    tools:
      - OHNLP toolkit
      - privacy_scan_tool
      - RSNA Clinical Trial Processor
      - IbisWorks EICON
      - DeGauss (via UF-Geocoding)
    tool_descriptions:
      - OHNLP toolkit extracts and tokenizes clinical notes, with output following the OHNLP open
        source schema.
      - privacy_scan_tool is a privacy scan tool for medical records.
      - RSNA Clinical Trial Processor performs imaging metadata de-identification.
      - IbisWorks EICON performs pixel-level de-identification of images.
      - DeGauss geocodes OMOP Location entities through the UF-Geocoding repository.

ethical_reviews:
  - name: Ethical review of the CHoRUS dataset
    contact_person: mailto:EROSENTHAL@mgh.harvard.edu
    reviewing_organization: organization:mass_general_brigham_irb
    review_details:
      - Ethical review was performed by Eric S. Rosenthal, Michael J. Young, Ishan Williams, Ashley
        Cordes, and Barbara J. Evans in collaboration with the Mass General Brigham IRB, with local
        context review by IRBs, HIPAA Privacy Officers, and institutional counsels at contributing
        medical centers.
      - Reviewing board is the Mass General Brigham Institutional Review Board (MGB IRB), IRB
        Reliance and Compliance, 399 Revolution Drive, Suite 710, Somerville, MA 02145, US; email
        irbreliance@mgb.org; telephone +1-857-282-1900.
      - "IRB protocol identifier #2022P000707."
      - The recorded human subject exemption is "HIPAA exemption 4 ((45 CFR 46.104(d)(4))".
      - The Ethics pillar performs community-facing ethics focus groups to determine what data is
        appropriate for public sharing, and evaluates community perspectives on clinical care AI to
        increase trustworthiness of provenance and privacy in AI.

human_subject_research:
  name: Human subject research status
  involves_human_subjects: true
  irb_approval:
    - "Mass General Brigham IRB protocol #2022P000707."
    - IRB approval or waiver as appropriate at contributing sites.
    - Recorded human subject exemption "HIPAA exemption 4 ((45 CFR 46.104(d)(4))".
  ethics_review_board:
    - Mass General Brigham Institutional Review Board (MGB IRB).
    - Local context review by IRBs, HIPAA Privacy Officers, and institutional counsels at
      contributing medical centers.
  special_populations:
    - Critically ill and acutely ill patients.
    - Pediatric intensive care unit (PICU) patients.
    - Neonatal intensive care unit (NICU) patients.
  regulatory_compliance:
    - Compliance with HIPAA and NIH data-sharing policies.
    - Compliance with NIH Bridge2AI OT terms and applicable federal regulations.
    - Secure enclave architecture aligned with NIST 800-53 controls.
    - The dataset record indicates FDA-regulated status.
    - The dataset record indicates the data are de-identified.

informed_consent:
  - name: Informed consent basis
    consent_obtained: false
    consent_type:
      - IRB approval or waiver as appropriate rather than individual research consent.
    consent_documentation:
      - "Mass General Brigham IRB protocol #2022P000707."
      - Recorded human subject exemption "HIPAA exemption 4 ((45 CFR 46.104(d)(4))".
    consent_scope:
      - Data are repurposed from routine clinical workflows under ethical oversight rather than
        gathered through prospective research interactions with patients.
      - Community-facing ethics focus groups determine what data is appropriate for public sharing.

at_risk_populations:
  name: At-risk populations
  at_risk_groups_included: true
  special_protections:
    - De-identification consistent with HIPAA Safe Harbor, with removal or tokenization of direct
      identifiers and date shifting or limited date fields when required.
    - Secure enclave environment aligned with NIST 800-53 controls, with role-based access control,
      multi-factor authentication, full audit logging, and protection against data exfiltration.
    - Data use agreement and controlled-access governance review, with prohibition of
      re-identification attempts and export/output review procedures.
    - IRB oversight with local context review by IRBs, HIPAA Privacy Officers, and institutional
      counsels at contributing medical centers.
    - Community-facing ethics focus groups determine what data is appropriate for public sharing.
  description: >-
    The dataset covers critically ill patients, including pediatric intensive care unit and
    neonatal intensive care unit admissions.

participant_privacy:
  - name: Privacy protection for data subjects
    anonymization_method:
      - De-identification consistent with HIPAA Safe Harbor.
      - Removal or tokenization of direct identifiers.
      - Date shifting or limited date fields when required.
      - Imaging metadata de-identification using the RSNA Clinical Trial Processor and pixel-level
        de-identification using IbisWorks EICON.
      - Tokenization of note and report text via the OHNLP toolkit, with raw text retained locally.
    reidentification_risk:
      - Prohibition of re-identification attempts.
      - Data export restrictions and output review procedures to reduce risk of re-identification.
      - Re-identification risk is periodically assessed and mitigation strategies updated as
        needed.
      - Data are transformed using approaches that limit re-identification.
      - The dataset is not appropriate for re-identification, contact tracing, or patient-level
        intervention.
    privacy_techniques:
      - Secure enclave environment aligned with NIST 800-53 controls.
      - Role-based access control (RBAC).
      - Multi-factor authentication.
      - Full audit logging of data access and queries.
      - Protection against data exfiltration.
      - A privacy scan tool for medical records.
    data_linkage:
      - Tokenized note and report text is linked to the harmonized structured record.
      - OMOP Location entities are geocoded so that data elements feature contextual factors such
        as geographic distance to the nearest hospital and social determinants of health.

data_protection_impacts:
  - name: Layered privacy protection
    impact_details:
      - Ethical safeguards include IRB approval or waiver as appropriate and compliance with CHoRUS
        governance.
      - Layered privacy protection includes de-identification, a data use agreement, a
        controlled-access data repository adhering to NIST 800-53 principles, audit-level
        protection, registration, role-based access controls, and protection against data
        exfiltration.
      - Patient-focused efforts determine the ethical and legal approaches to manage privacy and
        bias, while accounting for Social Determinants of Health.

is_deidentified:
  name: De-identification of the dataset
  identifiable_elements_present: false
  method: >-
    De-identification consistent with HIPAA Safe Harbor, including removal or tokenization of
    direct identifiers, date shifting or limited date fields when required, imaging metadata
    de-identification using the RSNA Clinical Trial Processor, pixel-level de-identification using
    IbisWorks EICON, and tokenization of clinical note and report text using the OHNLP toolkit.
  identifiers_removed:
    - Direct identifiers, removed or tokenized.
    - Dates, shifted or limited when required.
    - Imaging metadata identifiers, processed with the RSNA Clinical Trial Processor.
    - Burned-in image identifiers, processed with IbisWorks EICON.
    - Raw clinical note text, replaced by tokens in the shared dataset and retained locally.
  deidentification_details:
    - The dataset record indicates the data are de-identified.
    - Data are transformed using approaches that limit re-identification.
    - Re-identification risk is periodically assessed and mitigation strategies updated as needed,
      and re-identification attempts are prohibited.

existing_uses:
  - name: Current uses of the dataset
    examples:
      - Datasets are being used for training activities and publications.
      - The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, running 2025-11-17 to
        2026-07-31) expands access to Bridge2AI CHoRUS data through engagement, AI training, and
        mentorship, with up to 30 trainees applying AI/ML methods to big data analysis using
        multi-modal datasets.
      - Trainees develop and present use cases, prepare poster presentations for the AIM-AHEAD and
        Bridge2AI Annual Meetings, submit abstracts for health informatics conferences, and/or
        develop manuscripts for peer-reviewed journals.
      - Hands-on training uses canonical Jupyter Notebooks and the OHDSI tool stack on the
        Bridge2AI AI/ML for Clinical Care Collaborative Cloud.

use_repository:
  - name: CHoRUS GitHub organization
    repository_url: https://github.com/chorus-ai
    repository_details:
      - The CHoRUS GitHub organization houses 28 active repositories providing software and tooling
        to interact with and extract insight from clinical data in diverse formats, validated
        semantic mappings, standard operating protocols for data contributing sites, and project
        management overviews.
      - A web guide for contributors and users of the CHoRUS software packages compiles
        documentation in the chorus-developer repository, and a package status page lists versions,
        maintainers, and other metadata about CHoRUS packages.
      - Public repositories include chorus-container-apps, privacy_scan_tool, chorus_waveform,
        Chorus_SOP, CADA, data_acq_SOP, CTP-deid, UF-Geocoding, chorus_waveform_resources,
        CHoRUSReports, cloud_public, chorus-extract-upload, and chorus-apps-internal.
  - name: CHoRUS project website
    repository_url: https://chorus4ai.org/
    repository_details:
      - The public-facing project website provides information about the project, its progress, and
        high-level aims, including pages for Team, Project Overview, Tools, Data Acquisition,
        Standards, Community Engagement, Ethics, Dataset, and Learning Resources & Opportunities.
      - An additional project page is listed at www.bridge2ai.org/chorus.

intended_uses:
  - name: Intended use cases
    examples:
      - AI model training within enclave
      - Model validation and benchmarking
      - Algorithm development and feature engineering
      - Retrospective hypothesis testing
      - Fine-tuning of multimodal models
      - Comparative effectiveness research
      - Reinforcement learning and development of expert AI
      - Methodological research in trustworthy AI
      - Trial emulation or powering
    use_category:
      - Health, medical, and biomedical AI research on acute and critical illness
    usage_notes: >-
      Usage must align with approved research scope and governance policies. Access is restricted
      to the secure enclave environment and no raw data export is permitted unless explicitly
      approved.

other_tasks:
  - name: Additional applications
    task_details:
      - External validation of models developed elsewhere using the provisioned holdout test set,
        to aid marketplace adoption of AI-developed models for implementation in acute and critical
        care.
      - Education and workforce development, cultivating expertise in the lay and scientific
        community to improve AI literacy and utilization through multimodal educational approaches.

discouraged_uses:
  - name: Not-recommended uses
    discouragement_details:
      - Direct translation of trained algorithms to real-time clinical deployment without
        validation or regulatory clearance.
      - Use as sole evidence for clinical decision-making.
      - Population inference beyond participating institutions.

prohibited_uses:
  - name: Prohibited uses
    prohibition_reason:
      - Re-identification attempts are prohibited.
      - The dataset is not appropriate for re-identification, contact tracing, or patient-level
        intervention.
      - Data use may not be for commercial purposes unless specifically authorized through a
        separate agreement consistent with governing award and consortium terms.
      - No raw data export from the secure enclave is permitted unless explicitly approved.

future_use_impacts:
  - name: Factors affecting future use
    impact_details:
      - Temporal trends related to evolving clinical practice and institutional heterogeneity in
        coding and clinical data collection practices may affect the comparability of future
        releases.
      - The deprecation policy provides advance notice of schema changes, a backward compatibility
        window where feasible, and an archive of prior versions within the enclave where possible
        or incremental change records.
      - Bias assessment is ongoing and documented in dataset release notes.
      - The project website carries the notice "This repoitory is under review for potential
        modification in compliance with Administration directives."

distribution_formats:
  - name: OMOP common data model tabular files
    description: >-
      Electronic health record data harmonized to the OMOP common data model and delivered as
      tab-separated values (text/tab-separated-values), with published metadata under the OMOP
      schema and OMOP schema extensions for nursing flowsheets.
    access_urls:
      - https://chorus4ai.org/dataset/
  - name: WFDB waveform files
    description: >-
      High-resolution physiologic telemetry waveforms in the WFDB format, with published metadata
      under an extended PhysioNet schema.
    access_urls:
      - https://chorus4ai.org/dataset/
  - name: EDF+ and Persyst EEG files
    description: >-
      EEG waveforms in EDF+ and Persyst formats, with published metadata under the open source EDF+
      and Persyst schemas. As of August 2025, EEG extraction was in process.
    access_urls:
      - https://chorus4ai.org/dataset/
  - name: DICOM imaging files
    description: >-
      Imaging from PACS in DICOM format, with published metadata under the DICOM schema. No DICOM
      images are included in the version 1.0 Beta RO-Crate package.
    access_urls:
      - https://chorus4ai.org/dataset/
  - name: OHNLP tokenized clinical text
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit, following the OHNLP open
      source schema.
    access_urls:
      - https://chorus4ai.org/dataset/
  - name: Jupyter notebooks
    description: >-
      Notebook files (.ipynb) distributed with the dataset package; canonical AI/ML for Clinical
      Care Jupyter Notebooks are used for hands-on training.
    access_urls:
      - https://chorus4ai.org/dataset/
  - name: RO-Crate JSON-LD package
    description: >-
      The dataset is packaged as a self-contained RO-Crate conforming to RO-Crate 1.2, using the
      schema.org vocabulary and the Croissant RAI specification, with machine-readable JSON-LD
      metadata. The crate documents 1,468 datasets, 44 schemas, 2 computation/experiment steps,
      and 1 software instance, and 1,469 of 1,477 files carry checksums.
    access_urls:
      - https://doi.org/10.18130/V3/XNBOPG

distribution_dates:
  - name: Release dates
    release_dates:
      - "2026-04-03 (datePublished of the CHoRUS RO-Crate Package, version 1.0 Beta)"
      - "03/04/2026 (releaseDate recorded in the RO-Crate metadata, i.e. 3 April 2026)"
    description: >-
      The citation records publication at Harvard Dataverse in April 2026. An earlier dataset state
      was described as of August 2025, covering 14 hospitals and over 45,000 unique admissions.

third_party_sharing:
