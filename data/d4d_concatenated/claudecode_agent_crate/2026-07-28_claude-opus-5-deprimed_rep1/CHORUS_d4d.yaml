purposes:
  - name: AI-ready critical care dataset for the NIH Bridge2AI program
    response: >-
      The project's overarching goal is to develop a publicly available, AI-ready critical care
      dataset, while ensuring the methods promote privacy, accountability, and clinical benefit,
      while promoting a new generation of AI clinicians and scientists. There is an urgent need for
      infrastructure to support artificial intelligence and machine learning (AI/ML) in critical
      care, and developing high-resolution multi-center data sets is a critical first step towards
      actionable and trustworthy AI.
  - name: Secure, auditable, and reproducible AI research
    response: >-
      The repository is designed to enable secure, auditable, and reproducible artificial
      intelligence (AI) research to improve recovery from acute illness. CHoRUS supports AI model
      development, validation, benchmarking, and translational research while maintaining
      compliance with HIPAA and NIH data-sharing policies.
  - name: Holdout test set for external model validation
    response: >-
      The dataset will also provision a holdout test set, accessible for model external validation
      to aid marketplace adoption of AI-developed models for implementation in acute and critical
      care.
  - name: Ethically sourced, diverse, high-resolution data
    response: >-
      The goal of the CHoRUS Network is to develop the most diverse, high-resolution, ethically
      sourced, AI-ready data set to answer the grand challenge of improving recovery from acute
      illness.

tasks:
  - name: Characterizing, predicting, and measuring outcomes in acute and critical illness
    response: >-
      The CHoRUS data generation project generates data for ML/AI applications aimed at
      characterizing acute and critical care illness, predicting complications, and measuring
      treatment response among patients with acute or critical illness.
  - name: Three-pillar project structure
    response: >-
      Through 3 pillars, the CHoRUS data generation project addresses multiple challenges relevant
      for acquiring an AI-ready data set from more than 100,000 critically ill patients: 1) Data
      (Standards, Tool Development and Optimization, and Data Acquisition), 2) Ethics (Ethical and
      Trustworthy AI), and 3) People (Team Science and Skill and Workforce Development).
  - name: Legal, ethical, and technical work packages
    response: >-
      The project will A) establish a legal framework for collecting data at scale, sampling to
      ensure comprehensive sets of patient conditions and clinical treatment strategies; B) perform
      community-facing ethics focus groups to determine what data is appropriate for public
      sharing; C) ensure that data elements feature appropriate contextual factors such as
      geographic distance to the nearest hospital; D) develop capabilities across a multi-center
      network to acquire, standardize, tokenize, store, visualize, and label data such as
      structured electronic health record data, tokenized unstructured electronic health record
      data, telemetry and EEG waveforms, imaging, and social determinants of health; E) acquire
      data, standardize data to the OMOP Common Data Model, transform data using approaches that
      limit re-identification, and label data; and F) cultivate expertise in the lay and scientific
      community to improve AI literacy and utilization through multimodal educational approaches.
  - name: Data labeling for prediction targets
    response: >-
      A visualization and annotation environment will label data with targets important for
      prediction.

addressing_gaps:
  - name: Lack of infrastructure for AI/ML in critical care
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning (AI/ML) in critical care. Developing high-resolution multi-center data sets is a
      critical first step towards actionable and trustworthy AI.
  - name: Absence of a diverse, ethically sourced, AI-ready critical care dataset
    response: >-
      The CHoRUS Network was established to develop the most diverse, high-resolution, ethically
      sourced, AI-ready data set to answer the grand challenge of improving recovery from acute
      illness, acquiring a dataset of unprecedented diversity and high resolution across a
      multi-center network.
  - name: Missing legal and ethical frameworks for sharing clinical data at scale
    response: >-
      Patient-focused efforts will determine the ethical and legal approaches to manage privacy and
      bias, while accounting for Social Determinants of Health. The consortium evaluates community
      perspectives on clinical care AI to find ways to increase trustworthiness of provenance and
      privacy in AI, and new approaches are being created as the existing legal and regulatory
      landscape is analyzed.
  - name: Lack of harmonized standards across modalities
    response: >-
      Unified standards will harmonize multi-modal EHR, waveform, imaging, and text data, using
      validated semantic mappings for connecting clinical data in various source formats to
      international standards.
  - name: Workforce and AI literacy gap
    response: >-
      A comprehensive set of approaches will develop the skills and workforce for a next generation
      of diverse academic and community AI scientists, cultivating expertise in the lay and
      scientific community to improve AI literacy and utilization through multimodal educational
      approaches.

