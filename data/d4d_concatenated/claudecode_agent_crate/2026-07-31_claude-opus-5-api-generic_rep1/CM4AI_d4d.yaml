name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI;
  CM4AI.org), the Functional Genomics Grand Challenge Data Generation Project of the U.S.
  National Institutes of Health Bridge2AI program (NIH Common Fund). CM4AI generates
  multi-modal data - protein-protein interaction (PPI), protein spatial localization, and
  genetic perturbation data - in MDA-MB-468 triple-negative breast cancer cells (untreated,
  paclitaxel-treated, or vorinostat-treated) and in KOLF2.1J induced pluripotent stem cells
  (undifferentiated and differentiated into neural progenitor cells, neurons, and
  cardiomyocytes). This Beta release comprises: perturb-seq (CRISPRi single-cell RNA
  sequencing) data for MDA-MB-468 cells with and without treatment and for undifferentiated
  parental KOLF2.1J iPSCs; size-exclusion chromatography mass spectrometry (SEC-MS) data for
  MDA-MB-468 cells with and without treatment and for undifferentiated KOLF2.1J iPSCs and
  iPSC-derived NPCs, neurons, and cardiomyocytes; affinity purification mass spectrometry
  (AP-MS) data for treated MDA-MB-468 cells generated from endogenously tagged
  ("EndoTag") chromatin-modifier cell lines; and immunofluorescence (IF) confocal images
  of MDA-MB-468 cells with and without treatment. Outputs are packaged with provenance
  graphs and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE
  framework, and are deposited in the University of Virginia Dataverse with bulk raw data
  mirrored at MassIVE, NCBI SRA, and Figshare. The overarching aim is to deliver
  machine-readable hierarchical maps of human cell architecture as ethical, FAIR, AI-ready
  data supporting interpretable ("visible") genotype-phenotype machine learning. CM4AI is a
  collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser
  University, and the Hastings Center.

