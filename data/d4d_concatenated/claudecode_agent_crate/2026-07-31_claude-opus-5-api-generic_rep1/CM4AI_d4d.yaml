subpopulations:
  - description: >-
      Cell line MDA-MB-468 (RRID:CVCL_0419): a triple-negative breast cancer line established
      from a metastatic pleural effusion site of a 51-year-old Black female with metastatic
      mammary adenocarcinoma. This is the sole donor background represented for the cancer arm of
      the dataset.
  - description: >-
      Cell line KOLF2.1J (RRID:CVCL_B5P3): an induced pluripotent stem cell line derived from a
      healthy male Northern European donor. This is the sole donor background represented for the
      stem cell arm of the dataset.
  - description: >-
      Differentiation-state subpopulations within the KOLF2.1J arm: undifferentiated parental
      iPSCs, neural progenitor cells, neurons, and cardiomyocytes.
  - description: >-
      Treatment-condition subpopulations within the MDA-MB-468 arm: untreated / DMSO vehicle
      control, paclitaxel-treated, and vorinostat-treated.
  - description: >-
      Because only two donor backgrounds are represented, demographic and genetic
      representation is intrinsically narrow; the data do not represent the range of biological
      variation present in the population at large.

relationships:
  - description: >-
      Protein-protein interaction edges: bait-prey relationships recovered by AP-MS from
      endogenously tagged chromatin modifiers, and co-elution relationships between proteins
      sharing size-exclusion chromatographic fractions in SEC-MS.
  - description: >-
      Hierarchical containment relationships among protein assemblies: cell maps are directed
      acyclic graphs in which an edge denotes containment of a smaller assembly by a larger one,
      spanning large compartments (for example nucleus, mitochondria) down to individual protein
      complexes and subunits.
  - description: >-
      Image-derived proximity relationships: pairs of proteins with similar subcellular
      distributions in the immunofluorescence image embedding.
  - description: >-
      Perturbation-phenotype relationships: associations between CRISPRi-repressed target genes
      and the resulting single-cell transcriptional and fitness phenotypes.
  - description: >-
      Machine-readable provenance relationships: the RO-Crate evidence graph links samples,
      instruments, experiments, computations, software, schemas, and datasets through EVI
      inputs/outputs and schema.org hasPart / isPartOf assertions, entailed end-to-end by the
      FAIRSCAPE server and rendered as HTML provenance graphs and JSON-LD / RDF-XML
      serializations.

