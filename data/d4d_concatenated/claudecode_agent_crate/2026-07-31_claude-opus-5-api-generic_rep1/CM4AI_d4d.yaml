direct_collection:
  - description: >-
      No data were collected directly from human individuals. All measurements derive from
      established, commercially or publicly available, de-identified human cell lines obtained
      from third parties: MDA-MB-468 from the American Type Culture Collection (ATCC) and
      KOLF2.1J from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource, the
      latter available to not-for-profit organizations via a simple material transfer agreement.
  - description: >-
      Consequently, the Dataverse governance block records "Human Subjects: No" and
      "De-identified Samples: Yes", and the RO-Crate records human subject research as "None -
      data collected from commercially available cell lines".

sampling_strategies:
  - description: >-
      Cell line selection: two ethically sourced, disease-relevant human cell lines were chosen -
      MDA-MB-468, a triple-negative breast cancer line that is extensively characterized
      (transcriptomic, mutational profile, and whole-genome sequencing data available), and
      KOLF2.1J, a reference iPSC line intended for large-scale collaborative studies.
  - description: >-
      Condition selection: MDA-MB-468 cells were profiled untreated (DMSO control) and after
      treatment with paclitaxel or vorinostat; KOLF2.1J cells were profiled undifferentiated
      (parental) and after differentiation into neural progenitor cells, neurons, and
      cardiomyocytes.
  - description: >-
      Protein/gene target selection: the project targets approximately 100 chromatin modifiers
      and 100 metabolic enzymes implicated in cancer, neuropsychiatric, and cardiac disorders,
      with a shared list of proteins carried across cell types and treatment conditions to
      maximize multimodal overlap. Spatial proteomics coverage was planned to extend to a further
      set of proteins contingent on significant hits from the genetic perturbation and PPI
      results.
  - description: >-
      Perturbation screen scope: an expressed genome-scale CRISPRi library covering 11,739
      targeted genes in KOLF2.1J iPSCs, and a focused screen of 200 genes in MDA-MB-468 cells.
      Six guide RNAs per gene were designed for the chromatin-factor library.
  - description: >-
      Replication design: AP-MS experiments in four biological replicates with batch-level
      untagged parental, positive-control, and DMSO vehicle controls; SEC-MS replicate structure
      for the KOLF2 differentiation series comprising Parental replicates 1-4, NPC replicates
      1-2, Neuron replicates 1-3, and Cardiomyocyte replicates 1-2.

instances:
  - description: >-
      Immunofluorescence image instances: four-channel confocal microscopy fields of MDA-MB-468
      cells. Channels are DAPI (nuclei, blue), calreticulin antibody (endoplasmic reticulum,
      yellow), tubulin antibody (microtubules, red), and an antibody against the protein of
      interest (green). Composite RGB renderings were added in a later revision. Individual
      channel images are registered as distinct entities in the RO-Crate provenance graph.
  - description: >-
      Mass spectrometry instances: raw acquisition files (Bruker .d directories and .d directory
      groups), instrument and experiment records, and processed protein-level report tables in
      TSV/CSV form.
  - description: >-
      SEC-MS derived instances: quantitative protein elution profiles across chromatographic
      size fractions, used to identify co-eluting protein complexes.
  - description: >-
      Perturb-seq instances: single-cell transcriptomes with associated CRISPR guide RNA
      assignments, delivered as raw sequence data (fastq.gz) and as aggregated cell atlas
      matrices in h5 / h5ad form mapping transcriptional and fitness phenotypes to targeted
      genes.
  - description: >-
      Protein-protein interaction instances: pairwise interaction records derived from AP-MS
      bait-prey relationships and from SEC-MS co-elution profiles.
  - description: >-
      Provenance and packaging instances: RO-Crate JSON-LD metadata documents, HTML datasheets,
      HTML provenance graph renderings, and JSON-Schema data dictionaries. The RO-Crate reports
      53,877 dataset entities, 1,976 computation or experiment entities, 6 software entities, and
      20 schema entities, for 55,859 total entities.

