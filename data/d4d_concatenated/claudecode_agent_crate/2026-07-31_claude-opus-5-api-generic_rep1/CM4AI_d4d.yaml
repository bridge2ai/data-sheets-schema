preprocessing_strategies:
  - description: >-
      Protein-protein interaction embedding: downloaded PPI networks are processed with the
      node2vec deep learning model to reduce dimensionality, producing a per-protein PPI
      embedding that encodes the protein's interaction neighbourhood.
  - description: >-
      Image embedding: immunofluorescence images are processed with a Human Protein Atlas deep
      learning model to reduce dimensionality, producing a per-protein image embedding that
      encodes protein localization.
  - description: >-
      Co-embedding: PPI and image embeddings are integrated using contrastive deep learning so
      that the original embeddings can be reconstructed with minimal information loss and
      proteins with similar PPI and image embeddings receive similar co-embeddings.
  - description: >-
      Protein community detection and hierarchy creation: all-by-all protein similarities in the
      co-embedding space are used for multi-resolution community detection, yielding a hierarchy
      of protein communities emitted as the final cell map.
  - description: >-
      Mass spectrometry processing: SEC-MS raw data for the KOLF2 differentiation series were
      processed with Spectronaut, with downstream analysis in R using MSstats-compatible
      formats.
  - description: >-
      Structural annotation pipeline: MuSIC communities are annotated with available structural
      information about community members and their interactions, drawn from the Protein Data
      Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry, and
      prediction of disordered sequence segments; communities are then ranked by the amount of
      available structural information as a proxy for the feasibility of integrative structure
      modeling.
  - description: >-
      AI-readiness packaging: each pipeline segment invokes the FAIRSCAPE client to validate
      inputs and produce an RO-Crate for that segment; the crate is dispatched to the FAIRSCAPE
      server, which mints ARK persistent identifiers, decomposes the crate into datasets, models,
      and software, and computes end-to-end provenance entailments in the EVI Evidence Graph
      Ontology.

cleaning_strategies:
  - description: >-
      Experimental control design used for quality control in AP-MS: every batch includes an
      untagged parental cell line control, a positive-control tagged line, and DMSO-treated
      vehicle controls, allowing non-specific background to be distinguished from
      treatment-induced interactome rewiring.
  - description: >-
      Replication-based quality control in SEC-MS: multiple biological replicates per condition
      (Parental 1-4, NPC 1-2, Neuron 1-3, Cardio 1-2 for the KOLF2 series; control replicates 1,
      2, 4 and three replicates each for paclitaxel and vorinostat in the MDA-MB-468 series)
      permit assessment of reproducibility of elution profiles.
  - description: >-
      Perturb-seq quality control: single-cell CRISPR screen outputs were subjected to QC prior
      to release; the CM4AI preprint records that resulting data were undergoing QC at the time
      of writing.
  - description: >-
      Metadata validation: the FAIRSCAPE client validates pipeline inputs against JSON-Schema
      data dictionaries before packaging outputs, and maps data elements to public ontology
      vocabularies where appropriate.

labeling_strategies:
  - description: >-
      Knowledge-base alignment: cell maps are aligned to established protein function and pathway
      resources, including the Gene Ontology and Reactome, to identify protein assemblies with
      high overlap with known cell biology.
  - description: >-
      Large language model annotation: assemblies in the cell maps are named using an LLM-based
      approach developed by the project that assigns a descriptive name to a set of proteins
      together with a name confidence score.
  - description: >-
      Ontology annotation of the release metadata: dataset keywords are bound to terms in NCI
      Thesaurus, BioAssay Ontology, Software Ontology, LOINC, Cell Ontology, Experimental Factor
      Ontology, ChEBI, Gene Ontology, MeSH, EDAM, and Cellosaurus, as recorded in the Dataverse
      keyword vocabulary fields and the RO-Crate DefinedTerm entries.

annotation_analyses:
  - description: >-
      Hierarchy evaluation is performed in two complementary passes: first by overlap with curated
      resources (Gene Ontology, Reactome) to establish agreement with known cell biology, and
      second by LLM-generated naming accompanied by an explicit confidence score, so that the
      reliability of each automatically generated assembly name can be judged by downstream
      users.
  - description: >-
      Structural corroboration: MuSIC communities are ranked by the volume of independent
      structural evidence available for their members and interactions (PDB entries, AlphaFold
      models, crosslinking mass spectrometry, disorder predictions), and top-ranked communities
      are subjected to integrative structure modeling whose validation stage estimates sampling
      precision, model precision, and the degree to which a model satisfies the information used
      to compute it.

machine_annotation_tools:
  - description: >-
      node2vec - scalable feature learning for networks, used to embed protein-protein
      interaction neighbourhoods.
  - description: >-
      Human Protein Atlas deep learning image classification model, used to embed four-channel
      immunofluorescence images into protein localization features.
  - description: >-
      MUSE-style contrastive deep learning integration model, used to co-embed the PPI and image
      modalities into a shared latent space.
  - description: >-
      Multiscale community detection algorithms, used to derive hierarchies of protein
      communities from co-embedding similarities.
  - description: >-
      A large language model (LLM) based gene-set naming approach developed by the project, which
      returns a descriptive assembly name together with a name confidence score. The CM4AI
      sources do not name the underlying model for this pipeline; the GPT-4 based Gene Set AI
      pipeline described in the associated Nature U2OS study is a separate application to a
      different cell line.
  - description: >-
      Integrative Modeling Platform (IMP) version 2.18 with the Python Modeling Interface,
      available at https://integrativemodeling.org, used for integrative structure modeling of
      selected MuSIC communities.
  - description: >-
      Spectronaut, used for quantitative analysis of SEC-MS acquisitions on the Bruker timsTOF
      platform.
  - description: >-
      FAIRSCAPE (client FAIRSCAPE-CLI and server), used to generate RO-Crates, mint ARK
      persistent identifiers, and compute EVI provenance entailments. The release RO-Crate
      records 6 software instances overall.
  - description: >-
      Cell Mapping Toolkit / MuSIC pipeline packages, distributed as pip-installable Python
      packages with documentation, implementing the end-to-end download, embedding,
      co-embedding, hierarchy generation, and hierarchy evaluation steps.

missing_data_documentation:
  - description: >-
      Some component datasets are under temporary pre-publication embargo. In this release the
      perturb-seq raw sequence data for KOLF2.1J iPSCs and the perturb-seq data for MDA-MB-468
      cells are marked "Embargoed" in the external data links, and the two EndoTag AP-MS
      sub-crates are described as unpublished data.
  - description: >-
      The protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
      perturb-seq modalities interrogate sets of proteins that incompletely overlap, so a given
      protein may be represented in some modalities and absent from others.
  - description: >-
      Computed cell maps are not included in this release; they are stated to be added in future
      releases.
  - description: >-
      Checksum coverage is incomplete: the AI-readiness self-assessment records that 8 of 55,859
      entities carry checksums (reported as 0% coverage).

known_biases:
  - description: >-
      Cell line representativeness bias: all data in this release derive from commercially
      available de-identified human cell lines and do not represent the range of biological
      variants present in the population at large. This limitation is stated explicitly in both
      the Dataverse "Potential Sources of Bias" block and the RO-Crate rai:dataBiases field.
  - description: >-
      Donor-background bias: the cancer arm is represented by a single donor background
      (MDA-MB-468, from a 51-year-old Black female with metastatic mammary adenocarcinoma) and the
      stem cell arm by a single donor background (KOLF2.1J, from a healthy male Northern European
      donor). Demographic, genetic, and ancestral diversity is therefore minimal.

known_limitations:
  - description: >-
      This is an interim (Beta) release and the data are not yet in completed final form.
  - description: >-
      The release does not contain predicted or computed cell maps; these are stated to be added
      in future releases.
  - description: >-
      The current release is most suitable for bioinformatics analysis of the individual
      datasets rather than for integrated cell-map analysis.
  - description: >-
      Meaningful analysis requires domain expertise in proteomics, spatial imaging, and
      single-cell genomics.
  - description: >-
      Some component datasets remain under temporary pre-publication embargo and are not
      retrievable from their external repositories at the time of release.
  - description: >-
      Protein coverage is not uniform across modalities, limiting the set of proteins for which
      fully matched multimodal evidence exists.
  - description: >-
      Only a small fraction of packaged entities carry checksums (8 of 55,859 according to the
      AI-readiness self-assessment), which limits automated integrity verification at the
      individual-file level even though the ten Dataverse archives each carry an MD5.

anomalies:
  - description: >-
      Version discrepancy: the University of Virginia Dataverse records this deposit as Version
      2.0 (citation V2), while the accompanying RO-Crate release metadata declares
      "version": "1.0".
  - description: >-
      Publication date discrepancy: the Dataverse metadata gives a publication date of
      2026-06-17, while the RO-Crate release metadata gives "datePublished": "2026-06-30".
  - description: >-
      Content size discrepancy: the RO-Crate root declares "contentSize": "19.9 TB", the same
      crate reports evi:totalContentSizeBytes of 21,051,331,945,400 bytes (approximately 21.05
      TB), and the CM4AI project website reports a data volume of 21.4 TB.
  - description: >-
      Release page date inconsistency: the cm4ai.org data-releases page labels this release the
      "June 2026 Data Release (Beta)" but displays "Released on: June 17, 2025"; the curated
      Dataverse metadata gives publication date 2026-06-17 and version 2 release time
      2026-07-15T20:28:19Z.
  - description: >-
      Immunofluorescence protein-count change across releases: the March 2025 release describes
      spatial localization of 563 proteins of interest per treatment arm, while the June 2025,
      October 2025, and June 2026 releases describe 464 proteins of interest per arm. The reason
      for the reduction is not stated in the sources.
  - description: >-
      Immunofluorescence archive checksum change: the three IF image ZIP archives carry different
      MD5 values in the June 2026 release (6c1a8652..., 6d066e6b..., df796327...) than in the
      October 2025 release (0d972b80..., a98affcc..., ad4e68cc...), indicating the archives were
      regenerated between releases.
  - description: >-
      Stale immunofluorescence sub-crate metadata: the three IF sub-crates embedded in the June
      2026 RO-Crate assert isPartOf the June 2026 release but carry the March 2025 checksums
      (9422486c80bc9e1d35b2fbbc72a5f043 for paclitaxel, 0b4d129f5fbc3bb7f7ea564cd032cef7 for
      untreated, ac577109a41a9806978461157b777d52 for vorinostat), the March 2025 content sizes
      (2.6 GB, 3.2 GB, 2.8 GB), a datePublished of 02/28/2025, and a March 2025 citation string.
      The archives actually deposited in this release carry different MD5s
      (6c1a86520eec2696ec19444eb8a8b428, 6d066e6b9d762284c6aa5d0b44565568,
      df79632753989ef23b0a3df6604d4af1) and larger sizes (3.8 GB, 4.6 GB, 4.2 GB). The sub-crate
      metadata is therefore stale with respect to the archives it describes.
  - description: >-
      Transposed checksum assignment for the two perturb-seq sub-crates: the RO-Crate assigns
      MD5 cbdb263b1c099396d75e16f00a79a818 to the raw sequence (SRA) sub-crate and
      MD5 1cafefa32a897998e3e2ba0a29a3ef5c to the Perturbation Cell Atlas sub-crate, whereas the
      March 2025 Dataverse file listing assigns cbdb263b1c099396d75e16f00a79a818 to
      "CRISPR Perturbation Cell Atlas/ro-crate-metadata.json" and
      1cafefa32a897998e3e2ba0a29a3ef5c to
      "CRISPR Perturbation RNA Sequences - Raw Sequences/ro-crate-metadata.json". The two
      assignments are transposed relative to one another.
  - description: >-
      Author list inconsistency: the RO-Crate citation string names Park S and Zhao X and omits
      Marquez C, whereas the RO-Crate author array and the Dataverse author list include
      Marquez C and do not include Park S or Zhao X.
  - description: >-
      Malformed identifier references: several isPartOf entries in the RO-Crate carry a trailing
      comma inside the identifier string (for example
      "https://fairscape.net/api/ark:59853/rocrate-cell-maps-for-artificial-intelligence-June-2026-data-release,"),
      which would not resolve as written.
  - description: >-
      Contact name spelling inconsistency: the data governance contact is given as "Jillian
      Parker" in the Dataverse governance block and as "Jilian Parker" in the RO-Crate
      dataGovernanceCommittee field; the ethics contact is given as "Vardit Ravitsky" in the
      Dataverse block and "Vardit Ravistky" in the RO-Crate ethicalReview field.
  - description: >-
      Sub-crate provenance carries stale citation strings: several sub-crates cite the March 2025
      release DOI (10.18130/V3/B35XWX) or the October 2025 release DOI (10.18130/V3/K7TGEM) even
      though they are asserted to be parts of the June 2026 release.
  - description: >-
      Reported file inventory scale differs by view: the Dataverse deposit lists 10 archive files
      totalling roughly 12.6 GB, while the RO-Crate accounts for 53,877 dataset entities and
      approximately 21 TB, because the bulk of the raw data is hosted externally at MassIVE, the
      SRA, and Figshare and is referenced rather than deposited.

intended_uses:
  - description: >-
      Provision of AI-ready datasets to support research in functional genomics.
  - description: >-
      Training of AI and machine learning models.
  - description: >-
      Analysis of cellular processes.
  - description: >-
      Study of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations.
  - description: >-
      Enabling biologically driven, interpretable machine learning applications - the RO-Crate
      explicitly cites the "visible" machine learning approach of Ma et al. 2018 (PMID 29505029)
      and the drug-response modelling of Kuenzi et al. 2020 (PMID 33096023) as motivating
      exemplars.
  - description: >-
      Serving as reference input to the CM4AI MuSIC pipeline and Cell Mapping Toolkit for
      construction of new cell maps across cell subtypes and disease states.

existing_uses:
  - description: >-
      Input to the CM4AI Multi-Scale Integrated Cell (MuSIC) data integration and map production
      pipeline, which consumes the PPI and image data streams and emits annotated cell map
      hierarchies packaged as RO-Crates.
  - description: >-
      Training material for the CM4AI virtual CodeFest held in March 2024, at which datasets,
      tools, and standards were released together with tutorials explaining how the data were
      derived and integrated and with production-ready software for reproducing the datasets.
      Thirty-eight registrants attended, 40% identifying as female and 30% from underrepresented
      communities.
  - description: >-
      Basis for the associated publication "A Perturbation Cell Atlas of Human Induced
      Pluripotent Stem Cells" (bioRxiv 2024.11.03.621734; PMCID PMC11580897), in which the
      genome-scale CRISPRi atlas findings were validated via phenotypic, protein-interaction, and
      metabolic tracing assays.
  - description: >-
      Feasibility studies for integrative structure modeling of MuSIC communities using the
      Integrative Modeling Platform.
  - description: >-
      Dissemination through the CM4AI web portal built on the U-BRITE platform, and integration
      with the NIH Common Fund Data Ecosystem for data curation.
  - description: >-
      Recorded usage metric at the University of Virginia Dataverse for this deposit: 181
      downloads at the time of capture.

other_tasks:
  - description: >-
      Integrative three-dimensional structure modeling of protein assemblies, combining
      experimental coordinates from the Protein Data Bank, AlphaFold and AlphaFold-Multimer
      predictions, crosslinking mass spectrometry, and disorder predictions.
  - description: >-
      Bioinformatic analysis of individual modalities in isolation - for example differential
      SEC-MS elution profiling between treated and untreated cells to detect complex remodelling,
      or single-modality analysis of CRISPRi transcriptional phenotypes.
  - description: >-
      Discovery of drug-induced interactome rewiring and identification of candidate
      cell-type-specific or condition-specific drug targets.
  - description: >-
      Benchmarking of multimodal representation learning and community detection methods.
  - description: >-
      Methodological research on AI-readiness, FAIR data packaging, provenance representation,
      and evidence graphs, using the RO-Crate and FAIRSCAPE artefacts as exemplars.
  - description: >-
      Ethics and governance research, including empirical study of stakeholder values and
      development of guidelines for the responsible design of datasets and AI technologies.

discouraged_uses:
  - description: >-
      Use as a source of predicted or computed cell maps: these are not present in this interim
      release and will be added in future releases.
  - description: >-
      Integrated cross-modality analysis that assumes complete protein overlap between SEC-MS,
      immunofluorescence, and perturb-seq data, since these modalities interrogate incompletely
      overlapping protein sets.
  - description: >-
      Analysis without appropriate domain expertise; the sources state that meaningful analysis
      requires domain expertise.
  - description: >-
      Generalization of findings to population-level biological variation, since the data derive
      from a small number of commercially available de-identified human cell lines.
  - description: >-
      Reliance on embargoed external components as if they were openly accessible; several raw
      data links were marked "Embargoed" at the time of release.
  - description: >-
      Commercial exploitation without a separate license: the CC BY-NC-SA 4.0 terms prohibit
      commercial use, and the project states that commercial use requires a separate license
      negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending on the
      specific data package), supervised by a Data Access Committee.

prohibited_uses:
  - description: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval. This
      prohibition is stated in the Dataverse "Prohibited Uses" block, in the RO-Crate usageInfo
      and prohibitedUses fields, and in every component sub-crate.
  - description: >-
      Commercial use of the data under the released license is not permitted: the CC BY-NC-SA 4.0
      NonCommercial term forbids use of the material primarily intended for commercial advantage
      or monetary compensation. Commercial use requires separate license negotiation with the
      copyright holder.
  - description: >-
      Redistribution of adapted material under terms other than the same CC BY-NC-SA 4.0 license
      is not permitted (ShareAlike term), nor is the application of legal terms or technological
      measures that legally restrict others from doing anything the license permits.

future_use_impacts:
  - description: >-
      Anticipated benefit: enabling a new generation of transformative, interpretable biomedical
      AI by grounding genotype-to-phenotype models in explicit maps of cell and tissue
      architecture, deepening understanding of processes of human disease and health, and
      assisting in the development of novel therapies.
  - description: >-
      Anticipated risk: inappropriate translation of laboratory cell-line findings into clinical
      or patient-care contexts. This risk is mitigated by an explicit prohibition on clinical
      decision-making use without regulatory oversight.
  - description: >-
      Anticipated risk: models trained on data from two donor backgrounds may encode
      non-representative biology and yield inequitable performance if applied across diverse
      populations; the sources flag the narrow biological representation explicitly.
  - description: >-
      Governance response: the Ethics module applies a Value-Sensitive Design-inspired
      methodology, is constructing an axiological repository of values to guide design standards
      and expectations, and is formulating a CM4AI Life Cycle framework of governance milestones
      spanning data generation and AI system development, with the aim of anticipating potential
      applications of the data and derived AI/ML systems, integrating them into data governance
      frameworks to optimize benefits and mitigate potential risks, and promoting their use for
      the collective good.
  - description: >-
      Institutional risk to continued availability: both the hosting Dataverse collection and the
      CM4AI project website carry the notice that the repository is "under review for potential
      modification in compliance with Administration directives."

use_repository:
  - description: >-
      CM4AI project portal at https://cm4ai.org, built on the U-BRITE platform, which lists data
      releases, tools, product documentation, publications, and learning resources. Reported
      aggregate figures at the time of capture: 1,374 protein interactions; 53,788
      immunofluorescent images; 7,023 total proteins investigated; 11,739 genes targeted; 21.4 TB
      data volume.
  - description: >-
      University of Virginia Dataverse (LibraData) dataset pages, which report per-file and
      per-dataset download counts and expose Crossref/DataCite citation tracking under Make Data
      Count standards.
  - description: >-
      Network Data Exchange (NDEx), through which CM4AI cell maps are shared and can be
      visualized in a web browser or accessed via Cytoscape, HiView, and the Python ndex2
      library.
  - description: >-
      MassIVE, NCBI SRA/BioProject, and Figshare, which host and track access to the underlying
      raw mass spectrometry and sequencing data.
  - description: >-
      A scholarly "talent graph" constructed by the CM4AI Teaming module, linking CM4AI
      investigators to their peer-reviewed publications and capturing knowledge graphs of
      experts, publications, datasets, and tools.
  - description: >-
      NIH Common Fund Data Ecosystem (CFDE) curation, through which CM4AI contributions are being
      integrated into the broader scientific community.

distribution_formats:
  - description: >-
      Primary distribution as ZIP archives through the University of Virginia Dataverse; the June
      2026 deposit comprises ten ZIP archives, each with a published MD5 checksum.
  - description: >-
      RO-Crate JSON-LD metadata documents (ro-crate-metadata.json and per-sub-crate variants),
      conforming to RO-Crate 1.2 and using schema.org and EVI vocabularies.
  - description: >-
      Human-readable HTML artefacts accompany the RO-Crate packaging. In the June 2025 release
      (DOI 10.18130/V3/F3TD5R) these were itemised in the Dataverse file table as a release
      datasheet (release-ro-crate-datasheet.html) and per-modality provenance graph renderings
      (for example Images-paclitaxel-provenance-graph.html and
      mass-spec-cancer-cells-provenance-graph.html), with a note that the provenance graph HTML
      files require download to view properly and do not render in the Dataverse preview. For the
      June 2026 release the corresponding artefacts are delivered inside
      cm4ai_release_metadata.zip, whose contents are not itemised in the file table.
  - description: >-
      File formats catalogued in the RO-Crate: .d and .d directory groups (Bruker mass
      spectrometry acquisitions), .tsv and TSV, csv, .xml, h5, h5ad, fastq.gz, image/jpeg, pdf,
      executable, and unknown.
  - description: >-
      Metadata export formats offered by the repository landing page: OAI_ORE, DataCite,
      OpenAIRE, Schema.org JSON-LD, DDI Codebook v2, Dublin Core, Croissant, DDI HTML Codebook,
      and JSON.
  - description: >-
      Access mechanics: the deposit is too large to download as a single ZIP; users select
      individual files from the file table or use the Dataverse Data Access API for programmatic
      access, subject to a per-download size limit (1.9 GB at the time of capture).

distribution_dates:
  - description: >-
      June 2026 release (this record), DOI 10.18130/V3/HIGT4C: publication date 2026-06-17;
      eight files published 2026-06-17 and the three immunofluorescence image archives published
      2026-07-15; version 2 released 2026-07-15T20:28:19Z. The RO-Crate declares datePublished
      2026-06-30.
  - description: >-
      October 2025 release, DOI 10.18130/V3/K7TGEM, version 2.1: publication date 2025-10-31,
      with additional files published 2025-12-22.
  - description: >-
      June 2025 release, DOI 10.18130/V3/F3TD5R, version 2.1: publication date 2025-07-01, with
      immunofluorescence archives published 2025-10-22.
  - description: >-
      March 2025 release, DOI 10.18130/V3/B35XWX, version 1.4: publication date 2025-03-03.
  - description: >-
      May 2024 release, DOI 10.18130/V3/DXWOS5, referenced in the CM4AI preprint as the first
      data release.
  - description: >-
      Planned cadence: quarterly data releases through the end of the project in November 2026.

third_party_sharing:
  - description: >-
      Openly deposited in the University of Virginia Dataverse (LibraData), an NIH-approved
      generalist repository, under the collection "Cell Maps for Artificial Intelligence" within
      the School of Medicine dataverse. All ten files in the June 2026 deposit have public file
      access.
  - description: >-
      Raw mass spectrometry data shared through MassIVE under accessions MSV000101915,
      MSV000101917, MSV000100676, and MSV000098237 (the latter with DOI 10.25345/C5348GV4S). The
      two EndoTag AP-MS sub-crates and the KOLF2 SEC-MS sub-crate are released at MassIVE under
      CC0 1.0.
  - description: >-
      Raw single-cell sequencing data shared through NCBI SRA / BioProject; the perturb-seq raw
      sequence links were marked "Embargoed" at the time of the June 2026 release.
  - description: >-
      Aggregated CRISPRi perturbation atlas shared through Figshare at
      https://figshare.com/s/ee85bb1880921326249b.
  - description: >-
      Cell maps shared through the Network Data Exchange (NDEx) for browser visualization and
      programmatic access.
  - description: >-
      Dissemination through the open-access CM4AI web portal (https://cm4ai.org) built on the
      U-BRITE platform, and integration with the NIH Common Fund Data Ecosystem and the
      Bridge2AI Center.
  - description: >-
      Access to Bridge2AI data, including CM4AI datasets, through the Bridge2AI Open House
      requires participants to attest and commit to a Code of Conduct developed by the Bridge2AI
      Ethics and Data Sharing and Dissemination Working Groups prior to accessing the data.

license_and_use_terms:
  description: >-
    The dataset is licensed under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0
    International license (CC BY-NC-SA 4.0), https://creativecommons.org/licenses/by-nc-sa/4.0/.
    Users are free to share (copy and redistribute in any medium or format) and adapt (remix,
    transform, and build upon the material) subject to the Attribution, NonCommercial, and
    ShareAlike terms, and may not apply additional legal terms or technological measures that
    legally restrict others from doing anything the license permits. Attribution requirement:
    attribution is required to the copyright holders and the authors; any publications
    referencing this data or derived data products should cite the related publications as well
    as directly citing this data collection, and the University of Virginia Dataverse community
    norms additionally expect that proper credit is given via the citation shown on the dataset
    page. The confidentiality level recorded in the RO-Crate is "Unrestricted"; all ten deposited
    files have public file access and no access request or guestbook gate is applied to the June
    2026 deposit. Component sub-datasets deposited at MassIVE (the two EndoTag AP-MS crates and
    the KOLF2 SEC-MS crate) are released under the CC0 1.0 public domain dedication, while the
    remaining component crates carry CC BY-NC-SA 4.0. Software terms differ from data terms: the
    Tools data integration pipeline is available under a BSD-3 open source license and the
    FAIRSCAPE AI-readiness framework under the MIT license; the Integrative Modeling Platform is
    open source. Software packages are versioned, and the version used to produce each dataset is
    referenced in that dataset's metadata.

ip_restrictions:
  description: >-
    Copyright in the data is held by The Regents of the University of California except where
    otherwise noted; spatial proteomics raw image data is copyright The Board of Trustees of the
    Leland Stanford Junior University. Commercial use requires a separate license negotiation
    with the copyright holder - UCSD, Stanford, and/or UCSF depending on the specific data
    package in question - and a Data Access Committee supervises ethical matters related to
    dataset distribution and potential dual licensing for commercial use. Copyright in the
    FAIRSCAPE AI-readiness framework software is held by the Rector and Board of Visitors of the
    University of Virginia and is released under the MIT license. The KOLF2.1J iPSC line is
    available for access by not-for-profit organizations via a simple material transfer agreement
    through the HipSci resource, which constrains redistribution of the underlying biological
    material (as distinct from the data).

regulatory_restrictions:
  description: >-
    FDA Regulated: No, as recorded in the Dataverse "Data Governance & Ethics" block. Human
    Subjects: No; the RO-Crate records a human subject exemption on the basis that research with
    commercially available de-identified human cell lines does not constitute human subjects
    research. A use restriction with regulatory character applies: the data are not to be used in
    clinical decision-making or in any context involving patient care without appropriate
    regulatory oversight and approval. No export control, ITAR, EAR, or GDPR-specific
    restrictions are documented in the sources.

confidential_elements:
  - description: >-
      Temporary pre-publication embargo: some component datasets are withheld from public access
      pending publication. In the June 2026 release the perturb-seq raw sequence data for KOLF2.1J
      iPSCs and the perturb-seq data for MDA-MB-468 cells are marked "Embargoed" in the external
      data links, and the two EndoTag AP-MS sub-crates are described as unpublished data. These
      constraints are time-limited rather than permanent.
  - description: >-
      No other confidential or access-restricted elements are documented: the RO-Crate
      confidentiality level is "Unrestricted" and all deposited Dataverse files have public
      access.

sensitive_elements:
  - description: >-
      No personally identifiable information, protected health information, or other legally
      sensitive personal data is present. All measurements derive from commercially available
      de-identified human cell lines that, with current knowledge, cannot be matched to a human
      subject.
  - description: >-
      Donor-derived attributes are present only at the level of published cell line
      characteristics (for MDA-MB-468, a 51-year-old Black female with metastatic mammary
      adenocarcinoma; for KOLF2.1J, a healthy male Northern European donor). These attributes are
      already public in the source cell line documentation.

is_deidentified:
  description: >-
    De-identified Samples: Yes, as recorded in the Dataverse "Data Governance & Ethics" block.
    CM4AI data are described as non-clinical, derived from tissue cultures, and considered
    de-identified in that they cannot be matched, with current knowledge, to a human subject.
    The underlying cell lines (MDA-MB-468 and KOLF2.1J) were obtained already de-identified from
    ATCC and the HipSci resource respectively; no additional de-identification procedure was
    applied or required, and no residual re-identification risk is asserted in the sources.

human_subject_research:
  description: >-
    Human Subjects: No. The RO-Crate records humanSubjectResearch as "None - data collected from
    commercially available cell lines" and humanSubjectExemption as "Exempt - research with
    commercially available de-identified human cell lines does not constitute human subjects
    research." No IRB approval number is reported, consistent with the exemption. Ethical
    oversight of the project is exercised through the CM4AI Ethics module rather than an IRB
    protocol for this dataset; ethical review contacts are Vardit Ravitsky (The Hastings Center,
    ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon (Simon Fraser University,
    jean-christophe_belisle-pipon@sfu.ca). Data governance is exercised by a Data Governance
    Committee, contact Jillian Parker (jillianparker@health.ucsd.edu).

at_risk_populations:
  description: >-
    None. The RO-Crate records: "None - no human subjects involved; commercially sourced
    de-identified cell lines only." No minors, pregnant women, prisoners, or other populations
    requiring special safeguards or assent procedures are involved, and no such protections were
    required or applied.

informed_consent:
  - description: >-
      Not applicable. The RO-Crate records: "Not applicable - data collected from commercially
      available de-identified human cell lines (KOLF2.1J iPSC and MDA-MB-468). No primary human
      subjects research conducted under this release." Consent for the original derivation of the
      cell lines was obtained by the originating institutions and resources (ATCC for MDA-MB-468;
      the HipSci resource for KOLF2.1J) and is not documented within this dataset; both lines are
      described in the project sources as ethically sourced.

ethical_reviews:
  - description: >-
      Ethical review contacts of record for the release: Vardit Ravitsky (The Hastings Center;
      ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon (Simon Fraser University;
      jean-christophe_belisle-pipon@sfu.ca).
  - description: >-
      Human subject exemption determination: "Exempt - research with commercially available
      de-identified human cell lines does not constitute human subjects research." Recorded in the
      RO-Crate and consistent with the Dataverse governance block (Human Subjects: No;
      De-identified Samples: Yes; FDA Regulated: No).
  - description: >-
      Data governance oversight: a CM4AI Data Governance Committee, contact Jillian Parker
      (jillianparker@health.ucsd.edu), together with a Data Access Committee that supervises
      ethical matters related to dataset distribution and potential dual licensing for commercial
      use.
  - description: >-
      Programmatic ethics framework: the CM4AI Ethics module worked with the Data Acquisition,
      Tools, and Standards modules to develop a plan for ethical preparation, licensing,
      dissemination, and data access supervision that balances openness with protection of
      intellectual property and monitoring of commercialization efforts. The module employs a
      methodology inspired by Value-Sensitive Design, is building an axiological repository of
      values to guide design standards and expectations, and is formulating a CM4AI Life Cycle
      framework of governance milestones spanning data generation and AI system development.
  - description: >-
      Consortium-level governance: the CM4AI Ethics Pillar supported the Bridge2AI Ethics Working
      Group and the Bridge2AI Data Sharing and Dissemination Working Group in developing a Code of
      Conduct that participants must attest and commit to prior to accessing Bridge2AI data,
      including CM4AI datasets.
  - description: >-
      Definition of ethical acquisition applied by the project: ethical treatment of subjects
      including protection of human subjects data and ethical treatment of animals; non-biasing
      data analysis and scientific integrity of methods, conclusions, and publications; full
      documentation of scientific methods and reagents; and licensing and distribution of data,
      software, and models with openness to the scientific community for reuse consistent with
      protection of human subjects privacy and responsible research conduct.

updates:
  description: >-
    The dataset will be regularly updated and augmented on a quarterly basis through the end of
    the project in November 2026. Releases to date follow this cadence: May 2024
    (10.18130/V3/DXWOS5), March 2025 (10.18130/V3/B35XWX), June 2025 (10.18130/V3/F3TD5R),
    October 2025 (10.18130/V3/K7TGEM), and June 2026 (10.18130/V3/HIGT4C). Each release is issued
    as a versioned Dataverse deposit with minor and major version increments. Planned additions
    include computed cell maps, immunofluorescence images for the iPSC-derived cell types, and
    release of currently embargoed perturb-seq and AP-MS components. Software packages are
    versioned as the project progresses, and the version used to produce each dataset is
    referenced in that dataset's metadata.

retention_limit:
  description: >-
    Long-term preservation is provided in the University of Virginia Dataverse (LibraData),
    supported by committed institutional funds. No deletion schedule or retention expiry is
    stated. A qualifying condition appears on both the hosting Dataverse collection and the
    project website: "This collection/repository is under review for potential modification in
    compliance with Administration directives."

version_access:
  description: >-
    Prior versions and prior releases remain individually citable and retrievable through the
    University of Virginia Dataverse, each with its own DOI and version history. Known releases:
    May 2024, DOI 10.18130/V3/DXWOS5, V1; March 2025 Data Release (Beta), DOI
    10.18130/V3/B35XWX, Version 1.4, published 2025-03-03, six files, 302 downloads; June 2025
    Data Release (Beta), DOI 10.18130/V3/F3TD5R, Version 2.1, published 2025-07-01, twenty-one
    files, 256 downloads, described as a revision adding RGB immunofluorescent images, correcting
    RO-Crate metadata, and changing naming conventions; October 2025 Data Release (Beta), DOI
    10.18130/V3/K7TGEM, Version 2.1, published 2025-10-31, eight files, 405 downloads; June 2026
    Data Release (Beta), DOI 10.18130/V3/HIGT4C, Version 2.0, published 2026-06-17, ten files,
    181 downloads. The Dataverse interface exposes a Versions tab and version-difference view; the
    October 2025 and June 2026 pages additionally expose a Curation Status History. Component
    sub-crates carry their own version strings (for example 0.1.0 for the immunofluorescence
    crates, 0.6 for the SRA perturb-seq crate, 1.5 for the treated-cancer-cell SEC-MS crate).

extension_mechanism:
  description: >-
    Extension and contribution proceed through open-source software and open community channels
    rather than a formal dataset submission portal. The Cell Mapping Toolkit / MuSIC pipeline is
    distributed as pip-installable Python packages on GitHub (https://github.com/idekerlab/cellmaps_pipeline)
    with complete user documentation, providing a flexible and generalizable framework that lets
    researchers integrate new modalities and construct new cell maps across cell subtypes and
    disease states. Alpha-level tools are published on GitHub and production-ready tools are
    archived in Zenodo, with links packaged in RO-Crates as part of CM4AI provenance
    representations. The FAIRSCAPE framework (https://fairscape.github.io) is available under the
    MIT license for third parties wishing to produce comparably packaged AI-ready datasets. The
    Teaming module maintains mailing lists, shared online folders and documents, and remote
    messaging and collaboration software within CM4AI, across the Bridge2AI program, and in the
    broader scientific community. Contributions and corrections may be directed to the program
    manager (Swathi Thaker, snthaker@uab.edu) or the principal investigator
    (Trey Ideker, tideker@health.ucsd.edu).

external_resources:
  - description: >-
      Project publication describing the dataset, methods, and standards: Clark T, Mohan J,
      Schaffer L, Obernier K, et al. "Cell Maps for Artificial Intelligence: AI-Ready Maps of
      Human Cell Architecture from Disease-Relevant Cell Lines." bioRxiv 2024.05.21.589311, posted
      2024-05-24; doi https://doi.org/10.1101/2024.05.21.589311. Licensed CC BY-NC-ND 4.0.
  - description: >-
      Associated publication: Nourreddine S, Doctor Y, Dailamy A, et al. "A Perturbation Cell
      Atlas of Human Induced Pluripotent Stem Cells." bioRxiv 2024.11.03.621734; PMCID
      PMC11580897; doi https://doi.org/10.1101/2024.11.03.621734.
  - description: >-
      Associated publication demonstrating the multimodal cell mapping methodology: Schaffer LV,
      Hu M, Qian G, et al. "Multimodal cell maps as a foundation for structural and functional
      genomics." Nature 642, 222-231 (2025); doi https://doi.org/10.1038/s41586-025-08878-3.
      Open access under CC BY 4.0. This study maps 5,147 proteins in U2OS osteosarcoma cells,
      resolving 275 molecular assemblies, and is distinct from the CM4AI cell lines released here.
      An Acknowledgements correction was applied on 2025-04-29 and a Publisher Correction was
      published on 2025-10-02 (https://doi.org/10.1038/s41586-025-09648-x).
  - description: >-
      Associated methodological antecedent: Qin Y, Huttlin EL, Winsnes CF, et al. "A multi-scale
      map of cell structure fusing protein images and interactions." Nature 600, 536-542 (2021);
      doi https://doi.org/10.1038/s41586-021-04115-9.
  - description: >-
      NIH RePORTER project record for the funding award: https://reporter.nih.gov/project-details/11211616
      (application ID 11211616; project number 3OT2OD032742-01S2; core project OT2OD032742).
  - description: >-
      NIH Bridge2AI program: https://commonfund.nih.gov/bridge2ai.
  - description: >-
      CM4AI project website and data release index: https://cm4ai.org and
      https://cm4ai.org/data-releases/.
  - description: >-
      Cell Mapping Toolkit source repository: https://github.com/idekerlab/cellmaps_pipeline,
      with documentation at https://cellmaps-pipeline.readthedocs.io/.
  - description: >-
      FAIRSCAPE AI-readiness framework, with tutorial and installation instructions at
      https://fairscape.github.io; MIT licensed.
  - description: >-
      Integrative Modeling Platform (IMP), open source, at https://integrativemodeling.org.
  - description: >-
      Network Data Exchange (NDEx) at https://ndexbio.org, used for sharing and visualizing cell
      maps.
  - description: >-
      License text for the dataset: Creative Commons Attribution-NonCommercial-ShareAlike 4.0
      International, https://creativecommons.org/licenses/by-nc-sa/4.0/ (deed) with legal code
      linked from the deed.
  - description: >-
      Ontology and vocabulary resources bound to the release keywords: MeSH (Breast Neoplasms
      D001943, Induced Pluripotent Stem Cells D057026, CRISPR-Cas Systems D064113, Mass
      Spectrometry D013058, Fluorescent Antibody Technique D005453, Paclitaxel D017239,
      Vorinostat D000077337), EDAM (Proteomics topic_0121, RNA-Seq topic_3170, Functional genomics
      topic_3320, Machine learning topic_3474), and Cellosaurus (MDA-MB-468 CVCL_0419, KOLF2.1J
      CVCL_B5P3).
  - description: >-
      AI-readiness self-assessment accompanying the release, scoring the dataset across FAIRness,
      provenance, characterization, pre-model explainability, ethics, sustainability, and
      computability dimensions; all assessed criteria are reported as having content, with the
      verifiability criterion noting that only 8 of 55,859 entities carry checksums.