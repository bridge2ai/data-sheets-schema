purposes:
  - description: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning, as stated in the NIH Bridge2AI
      CM4AI project description.
  - description: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
      produced from multimodal interrogation of chromatin modifiers, metabolic enzymes, and
      other proteins involved in cancer, neuropsychiatric, and cardiac disorders in
      disease-relevant cell lines under treated and untreated conditions.
  - description: >-
      To broadly stimulate research and development in "visible" machine learning systems
      informed by multi-scale cell and tissue architecture, so that genotype-to-phenotype models
      are not black boxes but are built directly on knowledge maps of cell and tissue
      architecture.
  - description: >-
      To implement and demonstrate a standards-based data management approach founded on FAIR
      access and software principles, with deep provenance and replication packages for
      representation of cell maps and their underlying datasets.
  - description: >-
      To initiate and support a research program in ethical AI, especially as it relates to how
      cell maps will be used in genomic medicine and model interpretation, and to stimulate a
      diverse portfolio of training opportunities in the emerging field of biomachine learning.

addressing_gaps:
  - description: >-
      Machine learning models in genomics and precision medicine are typically
      difficult-to-interpret "black boxes" that predict phenotypes from genotypes without
      exposing the cellular mechanisms by which such translation occurs. CM4AI addresses this
      deficiency by providing structured maps of cell architecture on which interpretable models
      can be built.
  - description: >-
      Much of human subcellular architecture remains uncharted, and complementary mapping
      technologies (proteomic mass spectrometry, spatial imaging, genetic perturbation) have
      historically been applied separately rather than in a matched, integrated fashion. CM4AI
      addresses this by generating deep multi-modal data for a shared list of proteins across
      all cell types and treatment conditions.
  - description: >-
      Existing biomedical datasets frequently lack the provenance, characterization,
      explainability, and ethical documentation required for reliable AI/ML use. CM4AI addresses
      this gap by defining and applying an AI-readiness framework (FAIR, provenanced,
      characterized, explainable, ethical) and packaging outputs as RO-Crates with persistent
      identifiers and machine-readable evidence graphs.
  - description: >-
      There is a shortage of a biomedical workforce adept at both the data and life sciences.
      CM4AI addresses this through a Skills and Workforce Development module offering
      asynchronous virtual training, virtual CodeFest events, and an in-person internship
      co-hosted at Yale University and the University of California San Diego.

tasks:
  - description: >-
      Construction of hierarchical, multi-scale maps of human cell architecture (directed
      acyclic graphs in which each node is an assembly of proteins in proximity at a given
      scale, spanning cell compartments down to protein complexes and subunits).
  - description: >-
      Multimodal data integration and representation learning: self-supervised co-embedding of
      protein-protein interaction features and protein image features into a shared latent
      space.
  - description: >-
      Protein community detection at multiple resolutions to resolve protein assemblies and
      their containment relationships.
  - description: >-
      Training and interrogation of "visible" machine learning models / visible neural networks
      (VNNs) that use cell-map structure to make and explain cell-level phenotype predictions.
  - description: >-
      Interpretation of genetic variants and mutations in a structural and functional cellular
      context, supporting human genomics and precision medicine applications.
  - description: >-
      Analysis of how cell architecture, protein complexes, and interactions change in the
      presence of specific disease processes, drug treatment conditions, or genetic
      perturbations.
  - description: >-
      Mapping of transcriptional and fitness phenotypes associated with targeted gene
      repression (CRISPRi perturbation atlas construction).

acquisition_methods:
  - description: >-
      Affinity purification mass spectrometry (AP-MS) on endogenously tagged ("EndoTag")
      MDA-MB-468 cell lines, capturing drug-induced interactome rewiring of chromatin modifiers
      under paclitaxel and vorinostat perturbation. Directly measured primary experimental data.
  - description: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
      complex and interaction mapping, applied to MDA-MB-468 cells with and without treatment
      and to KOLF2.1J iPSCs and their neural progenitor, neuronal, and cardiomyocyte
      derivatives. Directly measured primary experimental data.
  - description: >-
      Immunofluorescence-based staining (ICC-IF) followed by high-resolution confocal microscopy
      to determine subcellular protein localization and distribution. Directly measured primary
      experimental image data.
  - description: >-
      Single-cell CRISPR interference (CRISPRi) perturbation screens with single-cell RNA
      sequencing readout (perturb-seq), using the 10x Genomics 3'HT kit. Directly measured
      primary experimental data.
  - description: >-
      Derived and computed products: dimensionality-reduced embeddings, protein community
      hierarchies, quantitative protein elution profiles, aggregated perturbation cell atlas
      matrices, and RO-Crate provenance graphs. The RO-Crate records 1,976 computation or
      experiment steps and 6 software instances contributing to the release.

collection_mechanisms:
  - description: >-
      AP-MS instrumentation and workflow: endogenous tagging of chromatin modifier genes in
      MDA-MB-468 cells, affinity purification of tagged baits and associated complexes, and
      tandem mass spectrometry. Four biological replicates per AP-MS experiment. Each AP-MS
      batch includes an untagged parental control, ten tagged chromatin-modifier cell lines, and
      a positive-control tagged line; DMSO-treated samples serve as vehicle controls across all
      AP-MS experiments.
  - description: >-
      SEC-MS instrumentation and workflow: size-exclusion chromatographic fractionation of
      cellular extracts followed by mass spectrometry, acquired on a Bruker timsTOF platform for
      the KOLF2 differentiation series. Quantitative analysis performed with Spectronaut;
      downstream analysis conducted in R using MSstats-compatible formats.
  - description: >-
      Immunofluorescence imaging: automated fixation and permeabilization protocols executed on a
      pipetting robot for MDA-MB-468 and KOLF2 cell lines, staining with Human Protein Atlas
      antibodies, and confocal microscopy in the Lundberg Lab at Stanford University. Each image
      carries four channels - nuclei stained with DAPI (blue), endoplasmic reticulum with a
      calreticulin antibody (yellow), microtubules with a tubulin antibody (red), and an
      antibody against the protein of interest (green).
  - description: >-
      Genetic perturbation: a CRISPR lentiviral library targeting chromatin factors with six
      guide RNAs per gene; MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were
      generated and characterized; single-cell readout using the 10x Genomics 3'HT kit.
  - description: >-
      Metadata and provenance capture: the FAIRSCAPE framework, comprising a client-side
      Python 3 package (FAIRSCAPE-CLI) invoked by the MuSIC pipeline and a Python 3 server
      application that registers RO-Crates, mints ARK persistent identifiers, and computes
      end-to-end provenance entailments expressed in the EVI Evidence Graph Ontology.

