purposes:
  - description: >-
      To build a multi-modal, multi-institutional, large-scale, diverse and ethically sourced human
      voice database linked to other biomarkers of health that is AI/ML friendly, in order to fuel
      voice AI research (NIH RePORTER Specific Aim 1).
  - description: >-
      To enable the development, benchmarking or validation of clinically applicable machine-learning
      models for diagnosing a wide range of health conditions using voice data, including vocal
      pathologies and neurological, psychiatric, respiratory and pediatric voice disorders.
  - description: >-
      To introduce and standardize the field of acoustic biomarkers ("audiomics") by developing new
      standards of acoustic and voice data collection, interoperability and analysis for voice AI
      research (NIH RePORTER Specific Aim 2).
  - description: >-
      To develop software and cloud infrastructure for automated, non-invasive, user-friendly and
      high-quality voice data collection through a smartphone/tablet application, including acoustic
      quality standardization, and to implement federated learning to allow multi-institutional
      analysis while preserving patient privacy (NIH RePORTER Specific Aim 3).
  - description: >-
      To integrate and develop ethical and normative guidance for voice data generation, consent,
      sharing and downstream AI/ML use, including new guidelines for consenting to voice data
      collection and use in the context of voice AI technology (NIH RePORTER Specific Aim 4).
  - description: >-
      To bridge medical voice research, acoustic engineering and the AI/ML community, and to develop
      training pathways and a curriculum on voice biomarkers of health, including for researchers
      from underserved communities (NIH RePORTER Specific Aims 5 and 6).

tasks:
  - description: >-
      Disease detection and classification from voice, speech, cough and breathing sounds, with
      diagnostic labels spanning vocal pathologies, neurological and neurodegenerative disorders,
      psychiatric conditions and respiratory disorders.
  - description: >-
      Screening, diagnosis and longitudinal monitoring of health conditions using voice as a
      non-invasive, low-cost biomarker.
  - description: >-
      Benchmarking and external validation of existing voice-biomarker algorithms against a
      clinically diverse, multi-site cohort with standardized acoustic tasks and rich phenotype data.
  - description: >-
      Representation learning, domain adaptation and multimodal integration research using derived
      acoustic, phonetic, prosodic and articulatory features.
  - description: >-
      Methodological research on fairness, robustness and AI safety in clinical voice models,
      including bias analysis across demographic subgroups and recording conditions, subject to the
      constraints of the data use agreement.

addressing_gaps:
  - description: >-
      Existing machine-learning studies of voice-based diagnosis produced promising results but used
      small- to medium-sized datasets, frequently voice-only, without the key clinical metadata
      needed to train robust, clinically useful models. For example, a review of ML applications for
      laryngeal cancer screening and diagnosis found that most studies reported training datasets of
      fewer than 300 patients and that only two studies used more than one data modality.
  - description: >-
      There are no established standards for how voice and speech data are measured and collected,
      which makes it difficult to compare studies, pool data or perform meta-analysis. Bridge2AI-Voice
      addresses this by publishing standardized multi-disorder acquisition protocols and a shared
      REDCap data dictionary.
  - description: >-
      Industry holds large volumes of voice data but generally lacks accurate paired clinical and
      demographic information, and industry datasets are typically private, preventing external
      auditing of training data, label accuracy and fair representation of diverse populations.
  - description: >-
      There is a lack of large, publicly available, ethically sourced and demographically diverse
      voice datasets linked to gold-standard clinical validation, which the project addresses by
      releasing a permissioned but broadly accessible dataset with documented governance.
  - description: >-
      The pediatric voice and speech literature is especially sparse because of ethical concerns and
      data-acquisition challenges in children; the consortium addresses this through a separate
      pediatric protocol and dataset.

