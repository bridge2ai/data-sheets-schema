existing_uses:
  - description: >-
      A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
      and hackathon.
  - description: >-
      A single-site pilot feasibility study of the Bridge2AI-Voice application was conducted with 47
      participants at the USF Health Voice Center (June-July 2023) to assess task performance metrics and
      participant feedback; audio data were not collected at that stage of app development. Published as
      Moothedan et al., Frontiers in Digital Health 2025;7:1514971 (doi 10.3389/fdgth.2025.1514971).
  - description: >-
      Protocol development has been published as Bensoussan/Rameau et al., "Developing Multi-Disorder Voice
      Protocols: A team science approach involving clinical expertise, bioethics, standards, and DEI",
      Proc. Interspeech 2024:1445-1449 (doi 10.21437/Interspeech.2024-1926).
  - description: >-
      Related consortium outputs include evidence-based recommendations for tablet recordings from the
      Bridge2AI-Voice acoustic experiments (Awan et al., Journal of Voice 2024) and a national survey of
      current practices in voice data collection (Evangelista et al., Laryngoscope 2024;134(3):1333-9).

intended_uses:
  - description: >-
      Development, training and fine-tuning of machine-learning models that associate voice-derived features
      with diagnostic categories or symptom severity for vocal fold pathology, neurological and
      neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - description: >-
      Benchmarking and validation of existing voice-biomarker algorithms on a clinically diverse, multi-site
      cohort with standardized tasks and rich phenotype data.
  - description: >-
      Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
      de-identified derived features, including representation learning, domain adaptation and multimodal
      integration with other health data.
  - description: >-
      Methodological research on fairness, robustness and AI safety in clinical voice models, including
      studies of bias related to demographic subgroups or recording conditions, subject to the ethical
      constraints in the data use agreement.
  - description: >-
      Use is permitted for both commercial and non-commercial research purposes by Authorized Researchers;
      the consent does not restrict use to non-commercial purposes, to a specific geographic location, to a
      specific type of research, to genetic research, or to research that does not involve development of
      methods or algorithms.

prohibited_uses:
  - description: >-
      Attempting to re-identify research participants, or taking any actions that could reasonably lead to
      re-identification. Recipients may not use the data, alone or with other information, to contact
      individuals who are the subjects of the data without appropriate IRB approval, specific written
      approval from the provider, and informed consent from the individual.
  - description: >-
      Any purpose that could foreseeably cause harm or stigmatization to research participants, their
      families, communities or specific populations.
  - description: >-
      Use of intellectual property protections, database rights or related rights in a manner that restricts
      or limits access to any part of the dataset or to any conclusions derived from it. Recipients agree not
      to make intellectual property claims on the data and to implement licensing policies that will not
      obstruct further research, respecting the Fort Lauderdale Agreement.
  - description: >-
      Sale of all or part of the data on any media. Duplication is permitted only as reasonably required to
      carry out the approved research project.
  - description: >-
      Disclosure, release, rental, lease, loan or grant of access to any third party outside the Authorized
      Persons named in the Data Transfer and Use Agreement without prior written consent. Collaborators at
      other research organizations, and other research teams at the same organization, must apply
      independently and sign their own DTUA.

discouraged_uses:
  - description: >-
      Non-research and non-clinical applications such as hiring decisions, insurance premium adjustments, or
      any form of surveillance that could lead to discrimination or harm. These limitations are intended to
      prevent unethical or biased outcomes that could negatively impact individuals based on their health
      conditions or voice characteristics.
  - description: >-
      Operational decision making about specific individuals, including law enforcement uses; the dataset is
      intended strictly for research that prioritizes patient safety, privacy and ethical use.
  - description: >-
      Uses that assume population-representative prevalence or severity, given the clinically enriched,
      non-probability, geographically limited sample.

other_tasks:
  - description: >-
      The dataset can be used for AI model pretraining, fine-tuning, benchmarking or validation beyond the
      originally targeted diagnostic categories, given the breadth of derived acoustic representations.
  - description: >-
      Speech-technology methodological work (for example on articulatory inversion, phonetic posteriorgrams
      or intelligibility estimation) is supported by the released feature types, subject to the data use
      agreement.

future_use_impacts:
  - description: >-
      Composition and collection effects that may impact future uses: the dataset has skews based on disorder
      category, site and other demographic factors, and users should consider the multivariate distribution
      when assessing utility for different questions.
  - description: >-
      Anticipated benefit: the project aims to support research on voice as an accessible, low-cost biomarker
      for screening, diagnosis and monitoring of a broad range of health conditions, potentially improving
      early detection and care for underserved populations and reducing reliance on specialist access that
      can take months and incur high monetary cost.
  - description: >-
      Anticipated risk: the consortium explicitly recognizes risks associated with voice data, including
      privacy loss, misuse of voice biometrics, voice hacking and re-identification, and algorithmic harms
      such as discrimination in hiring, insurance or surveillance contexts. These risks motivate the
      governance framework of IRB oversight, rigorous de-identification, separation of feature-only and
      raw-audio tiers, and usage restrictions in the registered-access license and data use agreement.
  - description: >-
      Even after de-identification, each person's voice is unique; participants are informed that although
      HIPAA-protected information is removed, it is always possible, if unlikely, that someone could
      recognize a participant's voice, and voice can never be fully de-identified.

use_repository:
  - description: >-
      No dedicated repository or index tracking papers or systems that use the dataset is maintained; the
      healthsheet answers "No" to that question. Use tracking depends on the citation requirement attached
      to the protocol publication and on general bibliographic indexing.
  - description: >-
      Adjacent resources that are not use-tracking registries: training opportunities for using the dataset
      at https://www.b2aivoicescholars.org/, and interactive adult and pediatric dashboards describing the
      data at https://docs.b2ai-voice.org/.

distribution_formats:
  - description: >-
      Dense audio-derived features are distributed as Apache Parquet, an open-source column-oriented data
      file format, each keyed by participant_id, session_id, task_name and n_frames.
  - description: >-
      Tabular phenotype, static feature, audio-quality and metadata files are distributed as tab-separated
      values (TSV) with paired JSON data dictionaries; each dictionary key matches a column name and provides
      a description, the prompting question where applicable, and the response data type.
  - description: >-
      The overall dataset is organized according to the Brain Imaging Data Structure v1.9.0, with a
      dataset_description.json, CHANGES.md, README.md, a phenotype directory and per-subject session/audio
      directories.
  - description: >-
      Raw audio (controlled access only) is distributed as WAV files with JSON sidecars.
  - description: >-
      The v3.0.0 release is additionally packaged as an RO-Crate conforming to https://w3id.org/ro/crate/1.2
      with EVI/FAIRSCAPE provenance, JSON-Schema descriptions of each file, and a merkle root hash
      f1663e1069a9894b21202ebf05f4839b9fb82b79ba5b337df54dd18f36d3be47.
  - description: >-
      Total content size of the v3.0.0 package is reported in the RO-Crate as 12.9 GB. See the errata entry
      recording that this figure is smaller than the sum of the per-file byte sizes the same RO-Crate
      records.

distribution_dates:
  - description: >-
      Version 1.0 - first release of the Bridge2AI voice as a biomarker of health dataset, published at the
      end of November 2024 on Health Data Nexus (doi 10.57764/qb6h-em84); 12,523 recordings for 306
      participants.
  - description: >-
      Version 1.1 - published 2025-01-17 on PhysioNet under restricted (registered) access
      (doi 10.13026/249v-w155); added Mel-frequency cepstral coefficients. Files for this version are no
      longer available on PhysioNet.
  - description: >-
      Version 2.0.0 - published 2025-04-16; data for an additional 136 participants, spectrograms reprocessed,
      free-speech spectrograms and MFCCs removed.
  - description: >-
      Version 2.0.1 - published 2025-08-18; corrections in the authorship list.
  - description: >-
      Version 3.0.0 - published 2025-12-16 under credentialed access (doi 10.13026/k81f-qr68); data for an
      additional 391 participants, phenotype file separated into individual files, SPARC and PPG features
      added, files reorganized.
  - description: >-
      Version 3.1.0 - published 2026-05-01 under credentialed access (doi 10.13026/8xbn-nq66); no new
      participants but additional data for some participants, repaired parquet files, new audio-quality and
      per-recording metadata files, back-filled validated diagnosis information, phenotype file rearrangement
      and gold-standard variable renaming. Latest-version DOI is 10.13026/37yb-1t42.
  - description: >-
      Bridge2AI-Voice Pediatric Dataset (separate PhysioNet project) - v1.0.0 published 2025-12-17; v1.1.0
      published 2026-05-01 (doi 10.13026/h995-bt35; latest-version doi 10.13026/mf9s-5r03).
  - description: >-
      A news item dated 2026-03-09 announced that raw audio access for both the adult and pediatric cohorts is
      provided via Synapse rather than PhysioNet.

third_party_sharing:
  - description: >-
      The dataset is distributed broadly to individuals outside the entity that created it. Feature-only data
      are published on PhysioNet, maintained by the MIT Laboratory for Computational Physiology; version 1.0
      was published on the Health Data Nexus, a data publishing platform maintained by the Temerty Centre for
      Artificial Intelligence Research and Education in Medicine (T-CAIREM) at the University of Toronto,
      which provides cloud compute alongside the dataset rather than allowing data downloads.
  - description: >-
      Registered/credentialed access tier: users must register on PhysioNet, confirm their identity, become a
      credentialed user where required, and sign the Bridge2AI Voice Registered Access Agreement. No training
      is required for the v3.0.0 and v3.1.0 releases.
  - description: >-
      Controlled access tier for raw audio: applicants complete a Data Access Request Form and a Data Use
      Agreement, submit the application to the Data Access Compliance Office (DACO@b2ai-voice.org) for review,
      and, on approval, have a Data Transfer and Use Agreement signed by an authorized official at their
      institution. Raw audio is then made available via Synapse.
  - description: >-
      Under the Data Transfer and Use Agreement, recipients may not disclose, release, sell, rent, lease, loan
      or otherwise grant access to third parties except Authorized Persons named in Attachment 3, without
      prior written consent; collaborators at other organizations must sign their own DTUA.
  - description: >-
      A published memorandum sets out the ethical justification for controlled access to raw voice data
      samples and the reasoning behind the governance structure.

license_and_use_terms:
  - description: >-
      The dataset is released under the Bridge2AI Voice Registered Access License with an accompanying
      Bridge2AI Voice Registered Access Agreement (data use agreement). Version-specific license and DUA texts
      are published at https://physionet.org/content/b2ai-voice/view-license/3.0.0/ and
      https://physionet.org/content/b2ai-voice/view-dua/3.0.0/. There are no fees associated with the access
      restrictions.
  - description: >-
      Access policy for v3.0.0 and v3.1.0: only credentialed users who sign the DUA can access the files. For
      v1.1 the policy was that only registered users who sign the specified data use agreement can access the
      files.
  - description: >-
      Copyright notice recorded in the RO-Crate: "Copyright (c) 2026 University of South Florida all rights
      reserved". The RO-Crate schema and data-dictionary entities are separately labelled with
      https://creativecommons.org/licenses/by/4.0/.
  - description: >-
      Supporting code is released under permissive licenses: the REDCap data dictionary and metadata repository
      and the documentation/dashboard repository under MIT, and the b2aiprep preprocessing library under
      Apache-2.0.

ip_restrictions:
  - description: >-
      The registered access agreement states that the data may be protected by copyright and other intellectual
      property rights; duplication as reasonably required to carry out the research project is permitted, but
      sale of all or part of the data on any media is not. Nothing in the agreement transfers any intellectual
      property rights in or relating to the data to the recipient.
  - description: >-
      Recipients agree not to make intellectual property claims on the data and not to use intellectual property
      protection in ways that would prevent or block access to, or use of, any element of the data or
      conclusions drawn directly from it. Recipients may obtain intellectual property rights on downstream
      discoveries but agree to implement licensing policies that will not obstruct further research and to
      respect the Fort Lauderdale Agreement.
  - description: >-
      No IP-based or other restrictions have been imposed by third parties on the data associated with the
      instances. The data provider gives no guarantee that the data are free of third-party intellectual
      property rights, database rights or other related rights.

regulatory_restrictions:
  - description: >-
      No export controls or other regulatory restrictions apply to the dataset.
  - description: >-
      HIPAA de-identification rules were applied and HIPAA Safe Harbor identifiers were removed. The dataset is
      described in the Data Transfer and Use Agreement as Personally Identifiable Information as defined in OMB
      Memorandum M-07-16 and not covered under HIPAA, FERPA or similar laws requiring additional special terms.
  - description: >-
      The data are covered under a Certificate of Confidentiality, which must be asserted against compulsory
      legal demands such as court orders and subpoenas for identifying information or characteristics of a
      research participant.
  - description: >-
      The study is not a clinical study for a drug product and not for a medical device; the RO-Crate records
      fdaRegulated as false. No data monitoring committee was appointed.
  - description: >-
      Recipients must store the data with administrative, physical and technical safeguards adequate to protect
      Personally Identifiable Information, must not use or further disclose it other than as permitted, and must
      notify the provider of any unauthorized use or disclosure within five business days of discovery.
  - description: >-
      The Recipient's authorized representative warrants that the recipient does not use coercion for labor or
      services as defined in Florida Statute 787.06.

is_deidentified:
  description: >-
    The dataset is de-identified. Identifiable information under HIPAA and the Common Rule, as well as data
    considered sensitive, have been removed. Direct identifiers are removed; HIPAA de-identification rules are
    applied; dates are rebased and/or replaced by integers; geographic information is removed or generalized
    (state and province removed, country of data collection retained); narrative text fields are removed. The
    dataset does not achieve k-anonymization with k greater than or equal to 2. Direct identifiers removed
    include name, civic address and social security numbers. Indirect identifiers were removed where they
    created a significant risk of re-identification through combination with other public data available on
    social media, in government registries or elsewhere, including select geographic or demographic identifiers
    and some information about household composition or cultural identity. Non-identifying but highly sensitive
    elements, such as household income, mental health status and traumatic life experiences, were also removed.
    All raw voice data were removed from the public release because voice has the potential to cause individual
    re-identification or to be used for illicit or unauthorized purposes; raw audio transcripts were reviewed
    and recordings containing potentially identifying information or external voices were removed. All fields
    encoded as sensitive in the REDCap data dictionary were removed. In addition, all spectrograms, MFCCs, mel
    spectrograms, transcriptions, EMAs and PPGs derived from open-response prompts were removed from the
    feature-only dataset. The RO-Crate records deidentified as true. Participants are nevertheless informed that
    a voice can never be fully de-identified.

human_subject_research:
  description: >-
    The dataset involves human subjects research. The clinical study was submitted to and approved by the
    University of South Florida single IRB and by sub-site IRBs through the single IRB process; Canadian
    institutions (Mount Sinai Hospital, the Hospital for Sick Children and the University of Toronto) obtained
    separate Research Ethics Board approvals, as did the pediatric protocol at the Hospital for Sick Children.
    The RO-Crate records humanSubjectResearch as "Yes", humanSubjectExemption as "No", fdaRegulated as false,
    and names the IRB as the University of South Florida Institutional Review Board (3702 Spectrum Blvd., Suite
    165, Tampa, FL 33620, US; RSCH-IRB@usf.edu; (813) 974-5638); the irbProtocolId field is empty. The study is
    an observational cohort study with a cross-sectional time perspective; it is not a study of a drug product
    or a medical device and no data monitoring committee was appointed. The organization study ID is
    OT2OD032720 (U.S. NIH grant/contract award number). The preceding app feasibility study was approved
    separately by the University of South Florida IRB under IRB number 004890.

ethical_reviews:
  - description: >-
      Data collection and sharing were approved by the University of South Florida Institutional Review Board,
      operating as the single IRB for participating US institutions, with sub-site IRB review through the
      single IRB process.
  - description: >-
      Canadian participating institutions (Mount Sinai Hospital, the Hospital for Sick Children and the
      University of Toronto) do not use the US single IRB process and obtained separate Research Ethics Board
      approvals; the pediatric dataset was approved by the Research Ethics Board at the Hospital for Sick
      Children.
  - description: >-
      Genomic data collection and analysis for the Alzheimer's/neurological cohort is performed only at the
      University of Toronto and Mount Sinai Hospital under a separate protocol and separate REB approval.
  - description: >-
      The RO-Crate records "Ethical Review by Vardit Ravitsky at the Hastings Center for Bioethics" and names
      Satrajit Ghosh as the data governance committee contact. The consortium includes a dedicated ethics
      module producing normative guidance on voice AI, and a published memorandum giving the ethical
      justification for controlled access to raw voice data samples.
  - description: >-
      A partial HIPAA waiver was requested and granted for recruitment and screening purposes only, to allow
      review of EHR information for incoming clinic patients ahead of their appointments, limited to the
      study's inclusion criteria.

informed_consent:
  - description: >-
      All participants provided prospective informed consent for the collection and use of their data. During
      the consent process participants are explicitly informed about the data being collected, the methods used
      to secure the data, and how the information will be used.
  - description: >-
      Consent may be obtained in three ways: by signing a physical paper copy in clinic; electronically within
      the app or through REDCap survey forms (HIPAA compliant, containing the same text as paper consent); or
      by video recording within the app, in which the participant reads a statement aloud so that the audio can
      be used to verify that the acoustic data belong to the consented individual and to distinguish
      participants from bots.
  - description: >-
      Consent language regarding sharing: research data that do not contain direct identifiers will be shared
      with external researchers for future research through a secure database; data posing a low risk of
      re-identification will be shared in registered access with the general public; data posing a heightened
      risk of re-identification if shared in full open access will be shared through a controlled access
      mechanism with authorized researchers.
  - description: >-
      Consent is not restricted to non-commercial use, to a specific geographic location, to a specific type of
      research, to genetic research, or to research that excludes the development of methods or algorithms.
  - description: >-
      For longitudinal cohorts, an electronic consent within the app is administered before each subsequent
      data collection to confirm ongoing consent. Participants are given time to consider and ask questions,
      are asked to explain what they understood back to the research assistant, and are informed that
      participation is voluntary and does not affect their medical care.
  - description: >-
      Paper consent documents are uploaded and stored electronically in REDCap; all paper and electronic
      versions of consent are stored for a minimum of five years after study completion, following USF
      procedure.

collection_notifications:
  - description: >-
      The individuals in question were notified about the data collection; participants went through an
      IRB-approved consent process before any data were collected.
  - description: >-
      Participants were informed during the consent process that the application was created by the
      Bridge2AI-Voice consortium and were told its purpose, the data being collected, the methods used to
      secure the data, and the information that would be used for the study.

collection_consents:
  - description: >-
      All participants have been duly informed and agreed to the collection and the use of their data via
      prospective informed consent obtained before data collection.
  - description: >-
      Consent covers deposit of de-identified research data in a secure database for future research by
      external researchers, registered-access release of low-re-identification-risk data to the general public,
      and controlled-access release of higher-risk data to authorized researchers.
  - description: >-
      During the consent process participants are also offered the option to be contacted in the future for
      further voice data collection; contact information supplied for that purpose is stored only within the
      institutional database and is not shared or uploaded to the cloud.

consent_revocations:
  - description: >-
      Consenting participants are informed that they may withdraw from the study at any point. If a participant
      chooses to withdraw during or before the voice data collection, their data will not be included in the
      database.
  - description: >-
      Participants are informed that research data, including voice recordings, cannot be removed from the
      database once the voice data collection process is completed. For longitudinal collection, data already
      completed are retained if a participant withdraws later, since the minimal requirement for study
      completion is one data collection time point.
  - description: >-
      Participants who withdraw have the option to complete a satisfaction survey to help the team understand
      their reasons for withdrawal; completion is entirely optional and no PHI is collected.

data_protection_impacts:
  - description: >-
      No formal data protection impact assessment is reported; the healthsheet answers "No" to whether an
      analysis of the potential impact of the dataset and its use on data subjects has been conducted.
  - description: >-
      In place of a formal DPIA, the consortium published a memorandum setting out the ethical justification
      for controlled access to raw voice data samples and the reasoning behind the two-tier governance
      structure, and undertook an ethics-team review to identify sensitive fields for removal.
  - description: >-
      Operational privacy controls include IRB-approved consent, HIPAA-compliant transport over HTTPS to NIH
      STRIDES partner storage (Amazon, Google, Microsoft) with pre-negotiated NIH agreements, institution-local
      retention of identified data behind password-protected REDCap, planned federated learning so that
      algorithms run at each institution and only model updates are shared to a central node, and data transfer
      and use agreements between collaborating universities.

participant_privacy:
  - description: >-
      Identified data remain within the collecting institution: identifiable PHI is kept in REDCap databases
      with password-protected access limited to investigators at the institution where the data were collected,
      while only de-identified data and de-identified voice samples are shared through the joint
      cloud-hosted database. Participant numbers and institution numbers allow institutions to track their own
      data.
  - description: >-
      All investigators and project personnel with data access must complete institutional certification,
      including HIPAA and privacy training. Individual usernames and passwords are required for REDCap and the
      HIPAA-secure cloud server.
  - description: >-
      Identifiable data and datasheets linking participant numbers to participant information are kept at each
      institution on local cloud storage for a maximum of ten years after study completion and are then
      destroyed, under the responsibility of each local principal investigator.
  - description: >-
      Personal information remains confidential and is not used if study information is published or presented
      at a scientific meeting.

participant_compensation:
  - description: >-
      Participants are compensated for their time with electronic gift cards: USD 40 for a data collection
      session lasting under 90 minutes and USD 80 for a session lasting over 90 minutes, for no more than three
      sessions and a maximum total compensation of USD 120.
  - description: >-
      Compensation is provided to the adult population only.
  - description: >-
      Participants in the preceding single-site app feasibility study did not receive financial incentives for
      completion of that study.

at_risk_populations:
  description: >-
    Children are the principal at-risk population addressed by the protocol. No pediatric data collection is
    performed at the University of South Florida; pediatric cohorts are collected only at pediatric participating
    institutions, and pediatric participants for the released pediatric dataset are recruited strictly from the
    Hospital for Sick Children. Where children participate, parents or guardians provide consent and children
    provide assent where appropriate; parental permission may be obtained from one or both parents because the
    research is minimal risk. Where young children cannot reasonably be asked to assent because of limitations in
    understanding due to age and development, typically under seven years of age, they are not asked to do so, and
    assent, when obtained, is documented. The IRB checklist HRP-416 for children under 21 was completed and
    appended to the protocol. The protocol states that students, employees and wards of the state are neither
    specifically included nor excluded, and that a specific plan exists to enroll participants from socially and
    economically disadvantaged and underserved populations through the Plan for Enhancing Diverse Perspectives so
    that the database is diverse and fair. The adult dataset described here contains no minors (eligibility 18-120
    years).

maintainers:
  - description: >-
      The dataset is supported by the NIH via the Bridge2AI project and maintained by the Bridge2AI-Voice
      consortium. The RO-Crate names Satrajit Ghosh as the data governance committee contact; Yael Bensoussan is
      the principal investigator.
  - description: >-
      Hosting and technical infrastructure for the current releases are provided by PhysioNet, maintained by the
      MIT Laboratory for Computational Physiology and supported by NIBIB, NHLBI and the NIH Office of the
      Director under grants U24EB037545 and R01EB030362.
  - description: >-
      Version 1.0 was hosted by the Health Data Nexus, a data publishing platform maintained by the Temerty
      Centre for Artificial Intelligence Research and Education in Medicine (T-CAIREM) at the University of
      Toronto, which maintains the technical infrastructure hosting the dataset and provides continued access to
      interested researchers.
  - description: >-
      Contact points: the Data Access Compliance Office at DACO@b2ai-voice.org for raw audio access; the project
      contact page at https://b2ai-voice.org/contact-us/; the corresponding author listed on the PhysioNet
      project sidebar for dataset questions. The healthsheet directs platform questions and curator questions to
      separate project email addresses, which are redacted in the source documentation.

errata:
  - description: >-
      There is no erratum document. A changelog for each dataset version is published online with the dataset
      metadata.
  - description: >-
      Correction history recorded in the release notes: v2.0 reprocessed spectrograms to fix minor issues
      identified in the previous release; v2.0.1 made corrections in the authorship list; v3.1.0 fixed broken
      parquet files from the previous release and back-filled validated diagnosis information across conditions.
  - description: >-
      An inconsistency remains in the v3.0.0 RO-Crate, where the entity for
      features/sparc_periodicity.parquet is named "sparc_loudness.parquet" and the entity for
      features/torchaudio_pitch.parquet is named "torchaudio_spectrogram.parquet".
  - description: >-
      A size inconsistency is present in the v3.0.0 RO-Crate: the crate declares a package contentSize of
      12.9 GB, but the per-file byte sizes it records for the nine Parquet feature files alone sum to
      approximately 13.79 x 10^9 bytes, before the phenotype, static-feature and metadata files are counted.
      Because the two figures cannot both hold and the bundle does not reconcile them, no aggregate
      total_size_bytes or total_file_count is asserted in this record; the individual per-file sizes are
      reported as given in file_collections.

updates:
  description: >-
    The dataset is released as static versions rather than being dynamically updated, each with its own DOI and
    changelog. Further versions of the dataset are planned on a semi-annual (twice yearly) basis, distributed as
    new versions on the hosting platform; users are notified through news items on the platform as well as
    through standard communication channels. Planned expansions include additional participants as enrollment
    continues toward the project target, introduction and growth of the pediatric cohort, incorporation of
    Spanish-language protocols and data collection, and release of the additional multimodal data (imaging,
    genomics, pulmonary function tests) that were not included in v3.0.0. Metadata such as eligibility criteria
    will be updated when the pediatric cohort and additional languages are introduced.

version_access:
  description: >-
    By default, older versions of the dataset continue to be supported, hosted and made available to researchers,
    and each version of the dataset has a unique DOI; the dataset publishers reserve the right to remove access
    to older versions. Version DOIs are 10.13026/249v-w155 (1.1), 10.13026/k81f-qr68 (3.0.0) and
    10.13026/8xbn-nq66 (3.1.0), with 10.13026/37yb-1t42 resolving to the latest version; version 1.0 has DOI
    10.57764/qb6h-em84 on Health Data Nexus. In practice the files for version 1.1 are no longer available on
    PhysioNet, which directs users to the latest version (3.1.0). Versions listed on PhysioNet are 1.1
    (2025-01-17), 2.0.0 (2025-04-16), 2.0.1 (2025-08-18), 3.0.0 (2025-12-16) and 3.1.0 (2026-05-01). The
    pediatric project lists versions 1.0.0 (2025-12-17) and 1.1.0 (2026-05-01), with latest-version DOI
    10.13026/mf9s-5r03.

retention_limit:
  description: >-
    Once data are contributed, they will be retained as long as they are useful for research purposes, possibly
    indefinitely; participants were not told that their data would be deleted after a fixed period. Separately,
    recipients of raw audio under the Data Transfer and Use Agreement are bound by a term ending two years after
    the start date, on completion of the project, on expiration of the applicable ethics approval, or on
    termination by the provider, whichever occurs first; at that point the data must be destroyed in accordance
    with the provider's instructions and a written certification of destruction submitted within thirty days,
    with the recipient permitted to retain one copy only as necessary for records retention, research integrity
    and verification. Within the collecting institutions, identifiable data and the linking datasheets are kept
    on local cloud storage for a maximum of ten years after study completion and then destroyed, and study
    records and original consent documents are retained for a minimum of five years after study completion per
    USF and NIH requirements.

extension_mechanism:
  description: >-
    Others may extend or augment the dataset by publishing a derivative dataset on the hosting platform that
    references the original source; such derivative datasets may be made available under the same conditions as
    the source data. For augmentations to the code used to produce the data, the open-source repositories
    (b2aiprep, senselab, bridge2ai-redcap, bridge2ai-docs) have discussion forums and issue pages allowing public
    discussion of data preprocessing, and a pull request mechanism for contributing improvements to the
    preprocessing code. New collaborating sites can join the data collection effort through the single IRB
    process, and the project publishes a "Join Us" pathway and training resources for prospective collaborators.

external_resources:
  - description: >-
      Project website and documentation - https://b2ai-voice.org/ and https://docs.b2ai-voice.org/, including
      protocols, healthsheet, data governance, study metadata, preprocessing description, AI-readiness rating and
      adult and pediatric dashboards.
  - description: >-
      REDCap data dictionary, metadata and instrument PDFs - https://github.com/eipm/bridge2ai-redcap (MIT
      licensed), archived on Zenodo at https://zenodo.org/doi/10.5281/zenodo.12760724, with v3.20.0 at
      https://doi.org/10.5281/zenodo.14148755 and v3.23.0 at https://zenodo.org/records/14989503.
  - description: >-
      b2aiprep preprocessing library - https://github.com/sensein/b2aiprep, Apache-2.0; used to organize and
      preprocess the dataset. Release v3.0.0/v3.0.2 generated the v3.0.0 and v3.1.0 datasets.
  - description: >-
      senselab audio processing library - https://github.com/sensein/senselab.
  - description: >-
      Documentation and dashboard source - https://github.com/eipm/bridge2ai-docs, MIT licensed, DOI
      https://zenodo.org/doi/10.5281/zenodo.13834653.
  - description: >-
      FHIR profiles for voice as a biomarker, published by the consortium as supporting material.
  - description: >-
      Protocol publication - Rameau A, Ghosh S, Sigaras A, et al. "Developing Multi-Disorder Voice Protocols: A
      team science approach involving clinical expertise, bioethics, standards, and DEI." Proc. Interspeech 2024:
      1445-1449. doi:10.21437/Interspeech.2024-1926.
  - description: >-
      App feasibility publication - Moothedan E, Boyer M, Watts S, et al. "The Bridge2AI-voice application:
      initial feasibility study of voice data acquisition through mobile health." Front Digit Health.
      2025;7:1514971. doi:10.3389/fdgth.2025.1514971. Open access under CC BY.
  - description: >-
      Programmatic viewpoint - Bensoussan Y, Elemento O, Rameau A. "Voice as an AI Biomarker of
      Health-Introducing Audiomics." JAMA Otolaryngol Head Neck Surg. 2024;150(4):283-284.
      doi:10.1001/jamaoto.2023.4807.
  - description: >-
      NIH RePORTER project record - https://reporter.nih.gov/project-details/11376382 (application ID 11376382,
      core project OT2OD032720).
  - description: >-
      Raw audio distribution - adult cohort at https://www.synapse.org/Synapse:syn72370534/ and pediatric cohort
      at https://www.synapse.org/Synapse:syn73617068, both under controlled access via DACO@b2ai-voice.org.
  - description: >-
      Bridge2AI-Voice Pediatric Dataset on PhysioNet - https://physionet.org/content/b2ai-voice-pediatric/,
      v1.1.0 doi 10.13026/h995-bt35, latest-version doi 10.13026/mf9s-5r03; 300 participants aged 2-18 and
      23,533 derived recordings. A distinct PhysioNet project and a distinct cohort collected under a separate
      protocol at the Hospital for Sick Children, related to but not a version of this adult dataset.
  - description: >-
      Version 1.0 of this same adult dataset on Health Data Nexus - https://healthdatanexus.ai/, doi
      10.57764/qb6h-em84, providing cloud compute alongside the dataset rather than allowing data downloads.
      This is an earlier release of the resource described here, superseded by the PhysioNet series.
  - description: >-
      Training resources for using the dataset - https://www.b2aivoicescholars.org/.
  - description: >-
      AI-readiness criteria reference - "AI-readiness for Biomedical Data: Bridge2AI Recommendations", against
      which the project self-assesses. Self-rated scores: FAIRness 100%, Provenance 100%, Characterization 80%
      (data quality criterion not met), Pre-model explainability 100%, Ethics 100%, Sustainability 50%
      (domain-appropriate and associated criteria not met in the documentation table; the RO-Crate-derived
      ai_ready_score.json marks all sustainability sub-criteria as having content), Computability 75%
      (contextualized criterion not met in the documentation table).