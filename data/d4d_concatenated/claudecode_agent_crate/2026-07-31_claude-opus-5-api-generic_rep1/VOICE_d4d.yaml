id: https://doi.org/10.13026/8xbn-nq66

name: Bridge2AI-Voice

title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"

description: >-
  Bridge2AI-Voice is a large, ethically sourced, demographically diverse voice dataset linked to
  health information, generated by the NIH Common Fund Bridge2AI program project "Voice as a
  Biomarker of Health". The dataset couples standardized acoustic tasks (voice, speech, cough and
  breathing recordings) with detailed participant metadata including clinical diagnoses, validated
  patient-reported outcome questionnaires, demographics and known acoustic confounders.
  Participants were selected on the basis of conditions expected to manifest in the voice waveform,
  spanning voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders and respiratory disorders, together with control participants without those conditions.
  This record describes the adult flagship dataset distributed through PhysioNet. Version 3.1.0
  (published 1 May 2026) contains data for 833 participants collected across five sites in North
  America. The public release is a feature-only, de-identified derivation: it provides spectrograms,
  mel spectrograms, MFCCs, pitch tracks, articulatory (SPARC) features, phonetic posteriorgrams,
  static acoustic features, audio-quality metrics, per-recording metadata and organized phenotype
  tables, but not the original voice recordings. Raw audio is disseminated only through a separate
  controlled-access mechanism. Project documentation reports approximately 61,937 voice-derived
  recordings for 833 adult participants at version 3.0; the PhysioNet release notes instead report
  per-feature record counts (for example 29,278 spectrogram records and 32,522 torchaudio pitch
  records in v3.1.0), and these two accountings are not reconciled in the source material. Stated
  enrollment targets for the overall project also differ across sources in the bundle: the project
  documentation site describes a flagship dataset of 10,000 voices and gives an anticipated
  enrollment count by 2027 of 10,000; the NIH RePORTER abstract and the IRB protocol describe a
  target of 30,000 participants (5,000 at the University of South Florida); the JAMA Otolaryngology
  viewpoint states a primary deliverable of a publicly available database of 30,000 human voices;
  and the RO-Crate maintenance statement describes an anticipated enrollment of approximately 3,000
  participants by November 2026. A separate Bridge2AI-Voice Pediatric Dataset (300 participants aged
  2-18, 23,533 derived recordings at v1.1.0) is published as a distinct PhysioNet project collected
  under a separate protocol at the Hospital for Sick Children, and is not part of this adult dataset.

