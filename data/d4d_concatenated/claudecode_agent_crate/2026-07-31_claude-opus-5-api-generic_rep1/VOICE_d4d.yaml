acquisition_methods:
  - description: >-
      Directly observable acquisition: voice, speech, cough and breathing audio waveforms recorded
      prospectively from consenting participants performing a standardized battery of acoustic tasks.
  - description: >-
      Self-reported acquisition: participants completed demographic questionnaires, medical history
      and confounder surveys, and disease-specific validated patient-reported outcome instruments.
  - description: >-
      Clinician-verified acquisition: diagnoses were verified by clinicians reviewing audio and/or
      imaging data, examining electronic health records, or checking medication prescriptions.
  - description: >-
      Derived acquisition: the released feature files are computationally derived from the raw audio
      using open-source toolkits rather than directly observed. Transcriptions were machine generated.

collection_mechanisms:
  - description: >-
      A custom Bridge2AI-Voice application hosting the data acquisition protocols, available as an iOS
      application and as a web application. The applications transmit data over HTTPS to HIPAA-compliant
      storage hosted through NIH STRIDES partners (Amazon, Google, Microsoft); no data are retained on
      the client after the page is closed and no login is required for the web app.
  - description: >-
      Hardware: data were collected on iPads (9th or 10th generation) and iPad Air (5th generation)
      using an Avid AE-36 head-mounted microphone connected via an Apple dongle. Distinct iPad devices
      were used at each site. Participants were instructed to wear a headset with microphone for tasks
      involving voice recording, per Bridge2AI-Voice suggested standards.
  - description: >-
      REDCap was used as the underlying clinical data capture and export system; the REDCap data
      dictionary, metadata and instrument PDFs are published at github.com/eipm/bridge2ai-redcap and
      archived on Zenodo.
  - description: >-
      Pediatric data (separate dataset) were collected using reproschema-ui with the Bridge2AI-Voice
      pediatric protocol, then transformed into REDCap format and converted to BIDS.
  - description: >-
      A Bridge2AI Enrollment Web app and QR-code-linked REDCap surveys were used for screening and
      remote enrollment.

collection_timeframes:
  - description: >-
      The healthsheet states that the data were collected over a period of 12 months. The underlying
      NIH project runs from 2022-09-01 to 2026-11-30, with a phased acquisition plan (exploratory,
      pilot, expansion, outreach); the exploratory phase completed in November 2023 and the pilot phase
      began in November 2023 and was ongoing in November 2024.
  - description: >-
      Release timeline of the adult dataset: v1.0 published end of November 2024 (Health Data Nexus);
      v1.1 on 2025-01-17; v2.0.0 on 2025-04-16; v2.0.1 on 2025-08-18; v3.0.0 on 2025-12-16; v3.1.0 on
      2026-05-01.
  - description: >-
      The single-site app feasibility study that preceded broad collection was conducted at the
      University of South Florida Health Voice Center between June 5, 2023 and July 28, 2023.
  - description: >-
      Unreconciled conflict in the source material: the healthsheet's statement of a 12-month
      collection period cannot be reconciled with the release history, in which participant counts
      rise from 306 (v1.0/v1.1) to 442 (v2.0.0) to 833 (v3.0.0) across releases published between
      November 2024 and December 2025, nor with the RO-Crate statement that collection is ongoing
      toward an anticipated enrollment by November 2026. The bundle contains both accounts and does
      not resolve them; the 12-month figure may describe only the interval covered by an early
      release.

data_collectors:
  - description: >-
      Research teams at each participating site, which may include medical, graduate or undergraduate
      students, coordinated with clinicians and doctors to identify appropriate participants and
      administered the protocol in clinic.
  - description: >-
      Clinicians and doctors listed as co-investigators under the IRB provided diagnoses and were added
      to the consortium so that their names appear on consortium-level publications; they were not
      separately compensated for data collection. Hospital staff assisted with logistics but not
      scheduling.
  - description: >-
      Data were collected in the clinic with the assistance of a trained research assistant. Remote
      collection is planned and was permitted under the protocol, but remote collection did not occur
      for the initial dataset release.

direct_collection:
  - description: >-
      Data were collected directly from the individuals in question rather than obtained via third
      parties, using a prospective in-clinic protocol with a trained research assistant present.
  - description: >-
      Some linked clinical information (imaging, diagnostic confirmation, medication history) was
      extracted from site electronic health records with participant authorization, and for the
      psychiatric cohort diagnostic determination was made outside the data collection session by an
      appropriately licensed clinician using the participant's EHR record or an active prescription.

sampling_strategies:
  - description: >-
      Non-probability sampling. Participants were recruited at "high volume expert clinics" -
      outpatient clinics within hospital systems or academic institutions with expertise in a specific
      disease area seeing more than 50 patients per month from the same disease category - and screened
      against predefined inclusion and exclusion criteria before their visit.
  - description: >-
      Participants were assigned to one of five predetermined disease cohorts (voice disorders,
      respiratory disorders, neurological and neurodegenerative disorders, mood and psychiatric
      disorders, pediatric voice and speech disorders) or to a control group of individuals without
      those conditions.
  - description: >-
      The dataset is a sample of a larger, ongoing collection and is explicitly described as not
      representative, because it was collected at a limited number of geographic locations. The team
      states it hopes to improve representativeness by shifting to remote collection and by designing
      recruitment to control for more variables.
  - description: >-
      Eligibility for the adult dataset: all sexes, not gender based, minimum age 18 years, maximum age
      120 years, healthy volunteers accepted. Exclusion criteria include not reading or speaking
      English (Spanish protocols and data collection are planned for future releases) and having had a
      surgical intervention significantly altering the symptoms of the disease studied. Disease-specific
      inclusion and exclusion criteria and gold-standard validation methods are tabulated per diagnosis
      in the project documentation.
  - description: >-
      Recruitment channels included clinic appointments, flyers in well-trafficked areas, QR-code linked
      REDCap screening surveys, waiting-room recruitment where approved, social media (LinkedIn, X,
      Facebook, Instagram, YouTube, b2ai-voice.org, bridge2ai.org), the FlowTrials platform, and
      targeted medical record review where specific diagnoses or severities were under-represented.

instances:
  - description: >-
      Each instance in the phenotype tables represents a person. Version 3.0.0 and version 3.1.0 each
      contain 833 adult participants; version 1.0/1.1 contained 306 participants and 12,523 recordings;
      version 2.0 added 136 new participants; version 3.0.0 added 391 new participants; version 3.1.0
      added no new participants but released additional data for some existing participants.
  - description: >-
      Below the participant level, instances are organized as sessions and as individual acoustic-task
      recordings. Most participants completed a single session, but a subset required multiple sessions,
      so a participant may have more than one session in the dataset and may give differing responses
      across visits.
  - description: >-
      Recording-level counts in the v3.1.0 feature files: 29,278 records each for torchaudio spectrogram,
      mel spectrogram and MFCC; 32,522 torchaudio pitch records; 28,640 SPARC EMA records; 31,855 SPARC
      loudness records; 31,872 SPARC periodicity and SPARC pitch records; and 29,289 phonetic
      posteriorgram records. The project documentation separately reports approximately 61,937
      voice-derived recordings for version 3.0; these two accountings are not reconciled in the bundle.
  - description: >-
      Each instance's data modality comprises audio-derived representations (dense tensors keyed by
      participant_id, session_id, task_name and n_frames) plus questionnaire responses and clinical
      labels in tab-delimited phenotype tables.
  - description: >-
      Twenty-two acoustic tasks are recorded through the adult app, grouped as non-voice/non-speech
      (respiration, voluntary cough, breath sounds), voice/non-speech (prolonged vowel, maximum phonation
      time, glides, loudness, diadochokinesis) and speech (Rainbow Passage, Caterpillar Passage, CAPE-V
      sentences, free speech, picture description, story recall, animal fluency, open response questions,
      word-color Stroop, productive vocabulary, random item generation, Cinderella story).

relationships:
  - description: >-
      The healthsheet states that relationships between individual instances are not made explicit and
      that instances are unrelated; participants are not linked to one another.
  - description: >-
      Within a participant, records are linked by participant_id, session_id and task/recording
      identifiers, so multiple sessions and multiple task recordings can be associated with the same
      individual across the feature and phenotype tables.

splits:
  - description: >-
      No predefined or recommended train, validation or test splits are provided with the dataset.
      Researchers are encouraged to create their own data splits based on their specific requirements.
      Predefined tasks and diagnostic labels are supplied, but no benchmark partitioning.
  - description: >-
      Because the dataset has skews by disorder category, site and other demographic factors, users are
      advised to consider the multivariate distribution when constructing splits and assessing utility
      for different questions.

subsets:
  - id: https://b2ai-voice.org/cohort/voice-disorders
    description: >-
      Voice disorders cohort. Diagnoses include laryngeal cancer, laryngitis, pre-cancerous lesions
      (keratosis, leukoplakia), benign vocal fold lesions (nodule, polyp, cyst, Reinke's edema, ulcers,
      recurrent respiratory papilloma), muscle tension dysphonia, spasmodic dysphonia/laryngeal dystonia
      and laryngeal tremor, unilateral vocal fold paralysis, and glottic insufficiency/presbyphonia.
      Gold-standard validation uses laryngoscopy images and stroboscopy videos, with CT and spirometry
      for selected diagnoses.
  - id: https://b2ai-voice.org/cohort/respiratory-disorders
    description: >-
      Respiratory disorders cohort. Includes airway stenosis (bilateral vocal fold paralysis,
      supraglottic, glottic, posterior glottic, subglottic, tracheal and multi-level upper airway
      stenosis) and unexplained chronic cough (bothersome cough greater than 8 weeks with specified
      exclusions), plus COPD and asthma. Gold-standard validation uses spirometry with flow-volume loops
      and CT of the neck/chest.
  - id: https://b2ai-voice.org/cohort/neurological-disorders
    description: >-
      Neurological and neurodegenerative disorders cohort. Includes mild cognitive impairment,
      Alzheimer's disease, other dementias, amyotrophic lateral sclerosis and Parkinson's disease and
      atypical parkinsonism. Age eligibility for this cohort is over 44 and under 85 years. Gold-standard
      validation uses brain CT, brain MRI, serum p-tau biomarkers (Alzheimer's) and whole genome
      sequencing.
  - id: https://b2ai-voice.org/cohort/mood-psychiatric-disorders
    description: >-
      Mood and psychiatric disorders cohort. Includes anxiety disorder, bipolar disorder, depression or
      major depressive disorder, and comorbid conditions such as alcohol or substance use disorder,
      ADHD, autism spectrum disorder, borderline personality disorder, eating disorder,
      insomnia/sleep disorder, OCD, panic disorder, PTSD, schizophrenia, social anxiety disorder and
      other psychiatric disorders. Validation is by electronic health summary, clinical diagnosis from a
      psychiatrist and medication history.
  - id: https://b2ai-voice.org/cohort/controls
    description: >-
      Control cohort of participants not diagnosed or treated for a voice, respiratory, pediatric, mood
      or neurological disorder affecting voice, cough, breath or speech.
  - id: https://b2ai-voice.org/cohort/pediatric
    description: >-
      Pediatric voice and speech disorders form the fifth planned disease category. Pediatric
      participants are recruited strictly from the Hospital for Sick Children (SickKids) and grouped by
      age band (2-4, 4-6, 6-10, 10+). Pediatric data are released as a separate PhysioNet project
      (Bridge2AI-Voice Pediatric Dataset) and are not included in this adult dataset; the cohort is
      recorded here because it is part of the consortium's five-category acquisition design, not
      because pediatric records are present in this release. The public data releases do not contain an
      equal distribution of the five disease categories.

subpopulations:
  - description: >-
      The dataset identifies demographic sub-populations by age, gender, sex, ethnicity and
      socioeconomic status. Race information and sexual orientation information are collected; some
      granular demographic and socio-economic variables were removed during de-identification.
  - description: >-
      The dataset has skews based on disorder category, site and other demographic factors; users should
      consider the multivariate distribution when assessing utility.
  - description: >-
      Groups with less trust in the medical system or in AI, or who live further from collection sites,
      would have been less likely to be recruited, producing under-representation of those populations.
  - description: >-
      Only fluent English speakers are represented in the current releases; Spanish-language protocols
      are under development but are not present in the released data.
  - description: >-
      Adult eligibility spans 18 to 120 years, with the neurological cohort restricted to ages 44-85.
      The adult dataset therefore contains no minors; children are covered by the separate pediatric
      dataset (ages 2-18).

sensitive_elements:
  - description: >-
      Racial and ethnic origin. The dataset includes race information.
  - description: >-
      Sexual orientation. The dataset includes sexual orientation information.
  - description: >-
      Health data. The dataset encodes diagnostic categories for voice, neurological, psychiatric and
      respiratory disorders, symptom severity scores from validated questionnaires, medication and
      treatment history, and other clinical findings.
  - description: >-
      Socioeconomic information. The dataset includes socioeconomic information; highly sensitive
      elements such as household income, mental health status details and traumatic life experiences
      were removed from the release.
  - description: >-
      Biometric data. The raw voice recording is itself a biometric identifier with re-identification
      potential and is withheld from the feature-only release, being available only under controlled
      access.
  - description: >-
      Fields encoded as sensitive in the REDCap data dictionary (column "Identifier?") were removed from
      the release at the v3.0.0 processing stage.

confidential_elements:
  - description: >-
      The RO-Crate records a confidentiality level of "Limited dataset available with Data Use
      Agreement". Raw audio and the underlying identified data are held back: identified PHI remains in
      institution-local REDCap databases with password-protected access, and raw audio is disseminated
      only through controlled access to protect participant privacy.
  - description: >-
      For the released feature-only dataset, the healthsheet answers "No" to whether the dataset
      contains data that might be considered confidential, such as data protected by legal privilege or
      doctor-patient confidentiality or the content of individuals' non-public communications.

content_warnings:
  - description: >-
      The dataset includes machine transcription of free speech tasks. Although unlikely, offensive,
      insulting or distressing content cannot be completely avoided because research participants are
      responsible for their choice of language.
  - description: >-
      Mitigation in later releases: transcripts of free-speech audio were removed, and spectrograms, mel
      spectrograms, MFCCs, phonetic posteriorgrams and EMA features derived from free-speech and
      sensitive records were excluded from the v2.0, v3.0.0 and v3.1.0 releases. Raw audio transcripts
      were reviewed and any recordings containing potentially identifying information or external voices
      were removed from the release.
  - description: >-
      Clinical content includes mental health, traumatic-experience and substance-use questionnaire
      items (for example PHQ-9 self-harm items, PTSD and DSM-5 adult instruments), which some users may
      find distressing to read.

anomalies:
  - description: >-
      Different sites have different collection configurations, and the collection protocol changed over
      the course of the study, producing heterogeneity across records.
  - description: >-
      Recordings were made with a head-mounted headset microphone that could be at slightly different
      distances between participants, and distinct iPad devices were used at each site.
  - description: >-
      Confounding factors present in the data include noise artifacts, variations in diagnostic
      practices, inaccurate questionnaire responses and underreporting.
  - description: >-
      Some audio files, whether due to length or other issues, could not generate certain features and
      are therefore absent from the corresponding bundled feature files, producing unequal record counts
      across feature types.
  - description: >-
      Spectrograms were reprocessed at v2.0 to fix minor issues identified in the previous release, and
      v3.1.0 fixed broken parquet files carried over from the v3.0.0 release.
  - description: >-
      Certain aspects of the data, notably transcription, were generated using off-the-shelf models that
      have not been audited for correctness.
  - description: >-
      Determination of whether an acoustic task was successfully completed or recorded was, in the
      preceding feasibility study, made subjectively by the research assistant rather than against an
      objective benchmark.

known_biases:
  - description: >-
      Sampling bias. Participants are recruited from specialty clinics and associated institutions using
      a non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
      English speakers, producing clinically enriched case mixes that may not represent general
      population distributions.
  - description: >-
      Geographic and cultural bias. Data are collected at a limited number of North American sites (five
      recording sites, in the USA and Canada) and may under-represent speakers from other regions,
      cultures, languages and healthcare systems.
  - description: >-
      Clinical spectrum bias. Because participants are selected into disease cohorts where voice changes
      are expected, prevalence and severity differ from routine primary care or community settings,
      which may inflate model performance when evaluated within this dataset.
  - description: >-
      Device and environment bias. Recordings are made using standardized but not identical hardware and
      primarily in clinical environments; at-home collection or other devices may present different
      background noise, channel characteristics and user behavior.
  - description: >-
      Algorithmic bias in machine annotations. Transcripts and some derived features rely on off-the-shelf
      models such as OpenAI Whisper whose performance may vary across demographic groups; these tools
      have not been independently audited for fairness by the dataset team.
  - description: >-
      Recruitment trust bias. Groups with less trust in the medical system or in AI, or who are less
      proximal to collection sites, were less likely to be recruited.
  - description: >-
      Label-device confounding. Participants were screened for different disorders based on site, so
      cohort membership is partially confounded with the device and site used for collection.
  - description: >-
      Distribution shift over time. Changes in diagnostic criteria or practices over the collection
      period could be a source of distribution shift.
  - description: >-
      The dataset has skews by disorder category, site and other demographic factors; the public releases
      do not contain an equal distribution of the five disease categories.

known_limitations:
  - description: >-
      The feature-only release does not include raw audio waveforms or free-speech transcripts, which
      limits certain types of modeling and error analysis and may constrain the ability to reproduce
      end-to-end audio pipelines.
  - description: >-
      This dataset covers an adult cohort only; models trained solely on it may not generalize to younger
      age groups or to languages beyond those represented.
  - description: >-
      Because of de-identification, some granular demographic and socio-economic variables, fine-grained
      location data and narrative context have been removed, reducing re-identification risk but also
      limiting detailed fairness assessments and certain confounder adjustments.
  - description: >-
      The dataset does not provide predefined train/validation/test splits or benchmarking tasks and does
      not include explicit per-instance label-uncertainty measures, so researchers must design their own
      evaluation protocols and handle label noise and missingness.
  - description: >-
      The registered-access and controlled-access governance structure is appropriate for privacy but may
      limit participation by some institutions or researchers and can complicate reproducibility of
      pipelines that require both features and raw audio.
  - description: >-
      Human-level performance on the applications the dataset is intended to address "varies widely",
      and only one label per instance is provided, so inter-rater reliability cannot be estimated from
      the released data.
  - description: >-
      Multimodal data described in the protocol (imaging such as laryngoscopy, brain CT/MRI and chest
      X-ray; genomic data; pulmonary function tests) are extracted at sites and were not released with
      v3.0.0; the documentation states explicitly that no external data are released in that version.

preprocessing_strategies:
  - description: >-
      Raw audio was converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing filter
      applied, then segmented by task and passed through quality checks.
  - description: >-
      Spectrograms were computed with the short-time Fast Fourier Transform using a 25 ms window, 10 ms
      hop length and a 400-point FFT (a 512-point FFT was used in v1.1), producing 201 x T
      representations; spectrograms were further downsampled by a factor of two in the time domain after
      derivation.
  - description: >-
      Mel spectrograms (60 x T) were computed with the same window, hop and FFT parameters and 60 Mel
      bins; 60 Mel-frequency cepstral coefficients were derived from those spectrograms.
  - description: >-
      Articulatory features were generated with the Speech Articulatory Coding (sparc) package, yielding
      kinematic traces of vocal tract articulators (T x 12 electromagnetic articulography estimates for
      X/Y positions of tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip)
      plus loudness, periodicity and pitch measures at 50 Hz using 20 ms windows.
  - description: >-
      Phonetic posteriorgrams were generated with the ppgs package as a time-varying categorical
      distribution over 40 phoneme categories at 100 Hz.
  - description: >-
      Acoustic features were extracted with openSMILE (eGeMAPS-style summary statistics) and phonetic and
      prosodic features with Praat via parselmouth, providing fundamental frequency, formants, jitter,
      shimmer, HNR, cepstral peak prominence, spectral moments and voice quality measures. Torchaudio was
      used for spectrograms, mel spectrograms, MFCCs and pitch tracks (minimum 80 Hz, maximum 500 Hz).
  - description: >-
      Speech intelligibility metrics (STOI, PESQ, SI-SDR) and audio-quality metrics were computed per
      recording; transcriptions were generated with OpenAI's Whisper Large model.
  - description: >-
      Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap were
      converted to be compliant with the Brain Imaging Data Structure v1.9.0, with a phenotype directory
      of TSV/JSON pairs and per-subject session/audio directories.
  - description: >-
      Waveform-derived features are stored in two formats: a fixed feature format containing static
      features extracted from the entire waveform, and a temporal format that varies per audio file
      according to recording length. Dense features are distributed as Parquet; tabular phenotype data as
      TSV with JSON data dictionaries.
  - description: >-
      All processing was performed with the open-source b2aiprep toolkit (organizing and preprocessing
      the dataset) and SenseLab (processing audio files for research tasks). The v3.0.0 and v3.1.0
      releases were generated with b2aiprep v3.0.0.

cleaning_strategies:
  - description: >-
      An audit protocol is applied before release: generate missingness tables; check distributions and
      outliers; check categorical responses against the schema; and run quality control metrics for
      audio tasks, including the amount of silence and the duration for waveforms, and, for speech, a
      comparison of produced speech against the intended passage.
  - description: >-
      Raw audio transcripts were reviewed and any audio recordings that contained potentially identifying
      information or external voices were removed from the release.
  - description: >-
      Spectrograms, mel spectrograms, MFCCs, PPGs and EMAs for sensitive records and for audio checks were
      removed from the v3.0.0 and v3.1.0 releases; all spectrograms and MFCCs derived from free-speech
      files were removed at v2.0.
  - description: >-
      The dataset has been audited internally for missingness and consistency by the data release team,
      and a missingness table is included with the dataset. Certain aspects of the data, such as
      transcription, were generated using off-the-shelf models that have not been audited for correctness.
  - description: >-
      No instances were excluded from the dataset at the time of preprocessing, and the healthsheet
      answers "No" to whether there was any pre-processing for cleaning the data, in the sense of
      altering or correcting participant responses.

imputation_protocols:
  - description: >-
      No global statistical imputation is applied. Missing questionnaire responses, phenotype variables
      and derived features are left as explicit missing values or omitted rows, and users may implement
      study-specific imputation or complete-case strategies appropriate to their analyses.

missing_data_documentation:
  - description: >-
      Some questionnaire items are optional and some information is missing from individual instances;
      there may also have been data collection irregularities. Each participant answered a common set of
      questions and then responded to additional questions relevant to their primary diagnostic category.
  - description: >-
      Phenotype data files contain a row for a participant only when at least one column is not missing.
      Because participants may have repeated visits and are not required to give the same response each
      time, there may be more than one row per participant and participant information for the same data
      element may vary across a file.
  - description: >-
      Some derived audio features could not be computed for all recordings owing to quality or length
      constraints, and features relating to free speech or to sensitive records have been removed, so
      record counts differ across the feature files.
  - description: >-
      A missingness table is generated as part of the pre-release audit protocol and is included with the
      dataset.

raw_sources:
  - description: >-
      The original raw data consist of high-quality voice, speech and respiratory audio waveforms recorded
      on tablet or smartphone devices with headset microphones when available, plus responses to
      structured demographic and medical-history questionnaires, disease-specific validated questionnaires
      and other patient-reported outcomes, together with clinical diagnoses and metadata extracted from
      electronic health records.
  - description: >-
      The raw data (post de-identification) were saved in addition to the preprocessed data to support
      unanticipated future uses, but are not accessible publicly.

raw_data_sources:
  - source_description: >-
      Raw voice, speech, cough and breathing audio waveforms recorded prospectively with the
      Bridge2AI-Voice application. Not included in the PhysioNet feature-only release. Access requires
      institutional sign-off; requests go to the access committee at DACO@b2ai-voice.org and adult raw
      audio is made available via Synapse at https://www.synapse.org/Synapse:syn72370534/ (pediatric raw
      audio at https://www.synapse.org/Synapse:syn73617068).
  - source_description: >-
      REDCap-captured questionnaire, demographic, confounder, diagnosis, enrollment and task data. The
      supporting REDCap data dictionary, metadata and instrument PDFs are available at
      https://github.com/eipm/bridge2ai-redcap and archived on Zenodo
      (https://zenodo.org/doi/10.5281/zenodo.12760724; v3.20.0 at
      https://doi.org/10.5281/zenodo.14148755; v3.23.0 at https://zenodo.org/records/14989503).
  - source_description: >-
      Pediatric questionnaire and audio data collected through ReproSchema-UI at the Hospital for Sick
      Children, extracted and transformed into REDCap format and then converted to BIDS. Released as a
      separate PhysioNet project.

labeling_strategies:
  - description: >-
      Gold-standard labeling. Diagnostic labels are the result of a clinical assessment of the
      participant; at each site a local clinician provided the diagnosis based on a clinical interview
      and appropriate work-up, following the Bridge2AI protocols and ICD-10 codes.
  - description: >-
      Single labeler per instance. One labeler provides one label per instance; the labeler is typically
      the clinician at the site of data collection, or a clinician external to the study in the case of a
      prior diagnostic assessment. Labeler demographics are not reported.
  - description: >-
      For the psychiatric disorders cohort, the diagnostic assessment was determined using the
      participant's EHR record or an active prescription, performed outside of data collection by an
      appropriately licensed clinician.
  - description: >-
      Disease-specific gold-standard validation methods are specified per diagnosis: laryngoscopy images
      and stroboscopy videos for voice disorders, spirometry with flow-volume loops and CT for airway
      stenosis and chronic cough, brain CT/MRI, serum p-tau and whole genome sequencing for neurological
      conditions, and electronic health summary, psychiatrist diagnosis and medication history for
      psychiatric conditions.
  - description: >-
      Questionnaire-derived labels are scored using the published scoring rules for each validated
      instrument, encoded in the REDCap instruments and documented in the JSON data dictionaries (for
      example vhi_10_calc_score, winograd_score).
  - description: >-
      Guidance for downstream users: the process for any new labels should be described alongside any
      release of a model or publication, including the exact variables used for the determination.
  - description: >-
      Labeling and preprocessing software is open source and available at
      https://github.com/sensein/b2aiprep and https://github.com/sensein/senselab.

annotation_analyses:
  - description: >-
      Questionnaire-based labels are generated using the standard scoring rules for each validated
      instrument, yielding total and subscale scores mappable to symptom-severity bands; the scoring logic
      is encoded in the REDCap instruments and documented in the data dictionaries.
  - description: >-
      Diagnostic labels are derived from clinical assessments and electronic health records rather than
      crowd workers, so there is no explicit inter-rater majority-vote scheme; diagnoses are treated as
      reference labels and may include multiple comorbid conditions per participant.
  - description: >-
      The data release team audited the combined phenotype and feature tables for internal consistency,
      missingness patterns and data-entry issues, but per-annotator disagreement statistics and detailed
      label-uncertainty measures are not included in the released dataset.
  - description: >-
      Each recording is associated with one set of clinical labels and questionnaire responses derived
      from a single participant; the documentation does not report multiple independent human ratings per
      individual recording.

machine_annotation_tools:
  - description: >-
      openSMILE - extraction of acoustic feature sets capturing temporal dynamics and spectral
      characteristics (Eyben, Woellmer & Schuller, ACM Multimedia 2010).
  - description: >-
      Praat and the parselmouth Python interface - phonetic and prosodic feature extraction including
      fundamental frequency, formants and voice quality measures.
  - description: >-
      TorchAudio - spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - description: >-
      Speech Articulatory Coding (sparc) - estimated electromagnetic articulography, loudness, periodicity
      and pitch.
  - description: >-
      ppgs - high-fidelity neural phonetic posteriorgrams (Churchwell, Morrison & Pardo, ICASSP 2024
      workshop).
  - description: >-
      OpenAI Whisper Large - automatic speech transcription of structured speech tasks; transcripts from
      free-speech audio were removed before release.
  - description: >-
      b2aiprep (https://github.com/sensein/b2aiprep) - orchestration of preprocessing, feature extraction
      and merging of phenotype data; v3.0.0 used for the v3.0.0 and v3.1.0 releases.
  - description: >-
      SenseLab (https://github.com/sensein/senselab) - processing of audio files for research tasks.

variables:
  - variable_name: participant_id
    description: Unique de-identified identifier for the participant; present in every feature and phenotype file.
  - variable_name: session_id
    description: Unique identifier for the data collection session; a participant may have more than one session.
  - variable_name: task_name
    description: Name of the acoustic task performed for the recording (for example prolonged vowel, glides, Rainbow Passage).
  - variable_name: n_frames
    description: Number of time frames associated with a given time-varying feature tensor.
  - variable_name: spectrogram
    description: Short-time Fourier transform power spectrogram of dimension 201 x T (25 ms window, 10 ms hop, 400-point FFT), downsampled by two in time.
  - variable_name: mel_spectrogram
    description: Mel spectrogram of dimension 60 x T computed with 60 Mel bins.
  - variable_name: mfcc
    description: Sixty Mel-frequency cepstral coefficients of dimension 60 x T derived from the spectrograms.
  - variable_name: pitch
    description: Detected fundamental frequency over time; torchaudio pitch uses an 80-500 Hz range, SPARC pitch a 50-550 Hz range.
  - variable_name: ema
    description: Estimated electromagnetic articulography of dimension T x 12, giving X/Y positions of tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip.
  - variable_name: loudness
    description: Estimated loudness based on the average absolute amplitude of the audio waveform, computed over 20 ms windows.
  - variable_name: periodicity
    description: Estimated periodicity (confidence of pitch presence) derived from the audio over 20 ms windows.
  - variable_name: ppgs
    description: Phonetic posteriorgram probabilities across 40 phoneme categories at a 100 Hz frame rate.
  - variable_name: transcription
    description: Machine-generated transcription of the recording produced with OpenAI Whisper Large; free-speech transcripts are removed from the release.
  - variable_name: recording_microphone
    description: Microphone used for the recording, captured in the recording metadata table.
  - variable_name: recording_input_gain
    description: Input gain setting applied for the recording, captured in the recording metadata table.
  - variable_name: acoustic_task_cohort
    description: Disease cohort context in which the acoustic task was administered.
  - variable_name: vhi_10_calc_score
    description: Computed Voice Handicap Index-10 score from the VHI-10 validated patient-reported outcome instrument.
  - variable_name: winograd_score
    description: Computed score for the Winograd schema task administered in the neurological protocol.
  - variable_name: is_control_participant
    description: Eligibility-table flag indicating whether the participant was enrolled as a control.
  - variable_name: selected_language
    description: Language selected by the participant for the protocol; English only in the current releases.
  - variable_name: stoi
    description: Short-time objective intelligibility metric computed per recording as part of the static feature set.
  - variable_name: pesq
    description: Perceptual evaluation of speech quality metric computed per recording as part of the static feature set.
  - variable_name: si_sdr
    description: Scale-invariant signal-to-distortion ratio computed per recording as part of the static feature set.

