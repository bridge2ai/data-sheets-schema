# ---------------------------------------------------------------------------
# Composition
# ---------------------------------------------------------------------------
instances:
  - id: d4d:cm4ai-instance-ppi
    name: Protein-protein interactions
    instance_type: protein-protein interaction measurement
    counts: 1374
    label: false
    description: >-
      Protein interaction measurements produced by two orthogonal
      mass-spectrometry approaches, AP-MS on endogenously tagged cell lines and
      SEC-MS for proteome-wide complex and interaction mapping. The CM4AI portal
      reports 1,374 protein interactions across the programme to date. The project
      preprint reports that 17 genes had been endogenously tagged in MDA-MB-468
      with AP-MS acquired under three conditions (untreated, paclitaxel and
      vorinostat treated) and 34 additional genes were in the process of being
      tagged; that SEC-MS on MDA-MB-468 under the same three conditions identified
      72 of 100 chromatin modifiers, 52 of them integral components of protein
      complexes; that PPI profiles of over a thousand complexes were detected in
      MDA-MB-468 cells; and that SEC-MS in KOLF2 iPSCs and derivatives uncovered
      more than 700 protein complexes in both parental iPSCs and differentiated
      neurons.

  - id: d4d:cm4ai-instance-if-images
    name: Immunofluorescence images
    instance_type: confocal immunofluorescence image
    counts: 53788
    label: false
    description: >-
      Immunofluorescence images of MDA-MB-468 cells acquired by ICC-IF staining and
      confocal microscopy in the Lundberg Lab at Stanford University. Each image
      set uses four channels: nuclei stained with DAPI (blue), endoplasmic
      reticulum with a calreticulin antibody (yellow), microtubules with tubulin
      antibody (red), and the protein of interest with its own antibody (green).
      The CM4AI portal reports 53,788 immunofluorescent images across the
      programme. The number of proteins of interest imaged is reported differently
      by different sources and is scoped per release: the March 2025 release
      archives state 563 proteins of interest; the June 2026 release sub-crates
      state 464; and the CM4AI flagship-datasets section states "IF images for 523
      proteins" for the TNBC curated dataset.

  - id: d4d:cm4ai-instance-proteins
    name: Proteins investigated
    instance_type: protein
    counts: 7023
    label: false
    description: >-
      The CM4AI portal reports 7,023 total proteins investigated across the
      programme. The flagship-datasets section states that SEC-MS captures
      approximately 7,000 proteins for both the iPSC-lineage curated dataset and
      the TNBC curated dataset.

  - id: d4d:cm4ai-instance-perturbed-genes
    name: Genes targeted by CRISPR perturbation
    instance_type: targeted gene
    counts: 11739
    label: false
    description: >-
      The CM4AI portal reports 11,739 genes targeted. The Perturb-seq components of
      the June 2026 release describe "an expressed genome-scale CRISPRi
      Perturbation Cell Atlas in KOLF2.1J human induced pluripotent stem cells
      (hiPSCs) mapping transcriptional and fitness phenotypes associated with
      11,739 targeted genes". The flagship-datasets section states Perturb-seq of
      more than 11,000 genes (whole-genome) for the iPSC lineage and Perturb-seq of
      200 genes for the TNBC dataset. The project preprint describes a CRISPR
      lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene
      and single-cell CRISPR screens performed with the 10x Genomics 3'HT kit.

  - id: d4d:cm4ai-instance-crate-entities
    name: Entities documented in the current release crate
    instance_type: RO-Crate entity
    counts: 55859
    label: false
    description: >-
      The June 2026 release crate reports 55,859 total entities, comprising 53,877
      datasets, 1,976 computation or experiment steps, 6 software instances and 20
      schemas, with 8 entities carrying checksums. These are metadata entities
      describing the release's contents and provenance, not the ten ZIP archives
      deposited on Dataverse.

relationships:
  - id: d4d:cm4ai-relationships
    name: Relationships between instances
    relationship_details:
      - >-
        The three input data streams are matched by protein: cell maps are
        produced by integrating protein localization and interaction data for the
        same proteins measured in the same cellular context.
      - >-
        The modalities do not cover the same protein sets. Every release states
        that "Protein-protein interaction (SEC-MS), protein localization (IF
        imaging), and CRISPRi perturbSeq data interrogate sets of proteins which
        incompletely overlap".
      - >-
        Cell maps are hierarchical directed acyclic graphs in which each node is
        an assembly of proteins in proximity at a given scale, with smaller
        assemblies nested inside larger ones.
      - >-
        Instances are organized by cell system and treatment condition: MDA-MB-468
        untreated, paclitaxel-treated and vorinostat-treated; KOLF2.1J
        undifferentiated (parental) and differentiated to neural progenitor cells,
        neurons and cardiomyocytes.
      - >-
        Within the current release, each modality is packaged as its own RO-Crate
        sub-crate that is a part of the release crate and carries its own version,
        authorship, licence and provenance graph.

subpopulations:
  - id: d4d:cm4ai-subpopulations
    name: Subpopulations
    subpopulation_elements_present: false
    identification:
      - >-
        The data are not partitioned by human subpopulation. Every release records
        Human Subjects: No, and the data are derived from two commercially
        available de-identified human cell lines.
      - >-
        Donor characteristics are documented at the cell-line level only. MDA-MB-468
        (RRID:CVCL_0419) is described as "a triple negative breast cancer cell line
        established from a metastatic site pleural effusion of a 51-year-old black
        female with a metastatic mammary adenocarcinoma, available from ATCC".
        KOLF2.1J (RRID:CVCL_B5P3) "was derived from a healthy male Northern
        European donor, available from the Human Induced Pluripotent Stem Cells
        Initiative (HipSci) resource".
    distribution:
      - >-
        The relevant partitions of the data are experimental rather than
        demographic: cell system (MDA-MB-468 versus KOLF2.1J), treatment condition
        (untreated or DMSO control, paclitaxel, vorinostat) and differentiation
        state (parental, neural progenitor cell, neuron, cardiomyocyte).

sensitive_elements:
  - id: d4d:cm4ai-sensitive-elements
    name: Sensitive elements
    sensitive_elements_present: false
    sensitivity_details:
      - >-
        The releases record De-identified Samples: Yes and Human Subjects: No.
      - >-
        CM4AI data are described as "distinctive within Bridge2AI in that they are
        non-clinical (from tissue cultures) and are considered to be de-identified
        as they cannot be matched, with current knowledge, to a human subject".
      - >-
        The release crate records a confidentiality level of "Unrestricted".

confidential_elements:
  - id: d4d:cm4ai-confidential-elements
    name: Confidential elements
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The release crate records confidentialityLevel "Unrestricted", and the
        AI-readiness self-assessment records the release as secure on the grounds
        of that confidentiality level.
      - >-
        All ten files of the current release are listed with public file access.
      - >-
        The only access limitation recorded is temporary pre-publication embargo on
        some component datasets, which is a timing restriction rather than a
        confidentiality classification.

anomalies:
  - id: d4d:cm4ai-anomalies
    name: Errors, noise and incompleteness
    anomaly_details:
      - >-
        Every release states that "These data are not yet in completed final form".
      - >-
        "Some datasets are under temporary pre-publication embargo." The October
        2025 release records Perturb-seq data for both KOLF2.1J iPSCs and
        MDA-MB-468 cells as Embargoed.
      - >-
        "Protein-protein interaction (SEC-MS), protein localization (IF imaging),
        and CRISPRi perturbSeq data interrogate sets of proteins which incompletely
        overlap."
      - >-
        "Computed cell maps not included in this release."
      - >-
        Checksum coverage inside the current release crate is very low. The
        AI-readiness self-assessment records "0% of files have checksums
        (8/55859)". MD5 checksums are, however, published by Dataverse for all ten
        deposited archives.
      - >-
        The June 2025 release was revised to correct RO-Crate metadata and naming
        conventions and to add RGB immunofluorescent images, indicating that
        earlier packaging of the same content contained errors.

known_biases:
  - id: d4d:cm4ai-bias-cell-line-representation
    name: Cell-line representation bias
    bias_type: representation_bias
    bias_description: >-
      "Data in this release was derived from commercially available de-identified
      human cell lines, and does not represent all biological variants which may be
      seen in the population at large." The entire programme rests on two donors:
      MDA-MB-468, from a 51-year-old Black female with metastatic mammary
      adenocarcinoma, and KOLF2.1J, from a healthy male Northern European donor.
    mitigation_strategy: >-
      The releases disclose the bias explicitly under "Potential Sources of Bias"
      and the release crate records it as rai:dataBiases. No mitigation by
      additional donors or lines is described in the sources.
    affected_subsets:
      - All modalities in all releases

  - id: d4d:cm4ai-bias-protein-panel-selection
    name: Protein panel selection bias
    bias_type: selection_bias
    bias_description: >-
      The proteins interrogated were chosen rather than sampled. The stated
      objective is multimodal interrogation "of 100 chromatin modifiers and 100
      metabolic enzymes involved in cancer, neuropsychiatric, and cardiac
      disorders", with imaging of "100 chromatin regulators in the MDA-MB-468 cells
      (+/- paclitaxel or vorinostat), with another 500 proteins pending significant
      hits from the genetic perturbations and PPI results". Coverage therefore
      reflects the project's biological priorities and its intermediate results,
      not an unbiased survey of the proteome.
    mitigation_strategy: >-
      SEC-MS is described as proteome-wide, which extends coverage beyond the
      targeted panel: "In addition to chromatin modifiers of interest, SEC-MS
      allowed us to map complexes in MDA-MB-468 cells and investigate the impact of
      treatment proteome-wide."

known_limitations:
  - id: d4d:cm4ai-limitation-interim
    name: Interim release
    limitation_type: scope_limitation
    limitation_description: >-
      "This is an interim release." Every release to date is labelled Beta.
    scope_impact: >-
      Content and completeness change from quarter to quarter; a given release is a
      snapshot of an ongoing data generation effort.
    recommended_mitigation: >-
      Cite the specific release DOI and version used, and check the CM4AI data
      releases page for the current release.

  - id: d4d:cm4ai-limitation-no-cell-maps
    name: Predicted cell maps not included
    limitation_type: integration_limitation
    limitation_description: >-
      "Does not contain predicted cell maps, which will be added in future
      releases." The releases also state that "Computed cell maps not included in
      this release."
    scope_impact: >-
      The integrated hierarchical maps that are the programme's headline output are
      not obtainable from the released data alone; only the map-input data streams
      are distributed.
    recommended_mitigation: >-
      Published CM4AI cell maps are shared separately via the Network Data Exchange
      (NDEx) and can be visualized with Cytoscape, HiView or the Python ndex2
      library.

  - id: d4d:cm4ai-limitation-single-modality-analysis
    name: Best suited to single-dataset analysis
    limitation_type: methodological_limitation
    limitation_description: >-
      "The current release is most suitable for bioinformatics analysis of the
      individual datasets." "Requires domain expertise for meaningful analysis."
    scope_impact: >-
      Cross-modality integration by a downstream user is not straightforward from
      the release contents alone.
    recommended_mitigation: >-
      The MuSIC pipeline and the FAIRSCAPE provenance packaging are published so
      that the integration steps can be reproduced.

  - id: d4d:cm4ai-limitation-overlap
    name: Incomplete overlap between modalities
    limitation_type: coverage_limitation
    limitation_description: >-
      "Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
      CRISPRi perturbSeq data interrogate sets of proteins which incompletely
      overlap."
    scope_impact: >-
      Reduces the number of proteins for which all modalities are available, which
      is the set on which multimodal integration can operate.

  - id: d4d:cm4ai-limitation-embargo
    name: Temporary pre-publication embargo
    limitation_type: temporal_limitation
    limitation_description: >-
      "Some datasets are under temporary pre-publication embargo." The October 2025
      release lists Perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 cells as
      Embargoed under External Data Links.
    scope_impact: >-
      Some components named in a release are not retrievable at the time of that
      release.

  - id: d4d:cm4ai-limitation-external-hosting
    name: Most content is hosted outside the release deposit
    limitation_type: coverage_limitation
    limitation_description: >-
      The ten archives deposited on the current release total a few gigabytes as
      displayed by Dataverse, while the release crate reports a total content size
      of 21,051,331,945,400 bytes. The mass spectrometry, AP-MS and Perturb-seq
      archives carry RO-Crate metadata and provenance for data held in MassIVE, the
      Sequence Read Archive and Figshare; only the immunofluorescence archives
      carry substantial primary data in the deposit itself.
    scope_impact: >-
      Obtaining the full release requires retrieving data from several external
      repositories, each with its own availability and access terms.
    recommended_mitigation: >-
      Each release records External Data Links naming the repository holding each
      external stream, and the component sub-crates carry MassIVE accessions and,
      in one case, an FTP content URL and its own DOI.

# ---------------------------------------------------------------------------
# Collection
# ---------------------------------------------------------------------------
acquisition_methods:
  - id: d4d:cm4ai-acquisition
    name: Instance acquisition
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        All data are directly measured in the laboratory from cultured human cell
        lines; no data are reported by human subjects.
      - >-
        Protein-protein interaction data are acquired by affinity purification mass
        spectrometry on endogenously tagged cell lines and by size-exclusion
        chromatography coupled to mass spectrometry.
      - >-
        Protein localization data are acquired by immunofluorescence-based staining
        (ICC-IF) and confocal microscopy using the Human Protein Atlas resource of
        antibodies.
      - >-
        Genetic perturbation data are acquired by single-cell CRISPRi screens.
      - >-
        Derived content is present as well as measured content: cell maps are
        inferred by integrating localization and interaction data using
        self-supervised embedding and community detection, and the release crates
        record 1,976 computation or experiment steps.
      - >-
        Validation is described at several levels: two orthogonal
        mass-spectrometry approaches for interactions, whole-cell size-exclusion
        chromatography used to validate assemblies systematically, alignment of
        derived assemblies to the Gene Ontology and Reactome, and quality control
        of antibodies and images to Human Protein Atlas standards.

collection_mechanisms:
  - id: d4d:cm4ai-mechanism-apms
    name: Affinity purification mass spectrometry (AP-MS)
    mechanism_details:
      - >-
        AP-MS is performed on endogenously tagged cell lines to map protein-protein
        interactions of chromatin regulators under different conditions.
      - >-
        "All AP-MS experiments were performed in four biological replicates. Each
        AP-MS batch includes an untagged parental control, 10 chromatin modifier
        tagged cell lines, and a positive control tagged line. DMSO-treated samples
        serve as vehicle control across all AP-MS experiments."
      - >-
        The project preprint records 17 genes endogenously tagged in MDA-MB-468 with
        AP-MS acquired under untreated, paclitaxel-treated and vorinostat-treated
        conditions, with 34 additional genes in the process of being tagged.

  - id: d4d:cm4ai-mechanism-secms
    name: Size-exclusion chromatography mass spectrometry (SEC-MS)
    mechanism_details:
      - >-
        SEC-MS is used for proteome-wide complex and interaction mapping as an
        orthogonal approach to AP-MS.
      - >-
        For the KOLF2.1J differentiation series, "Data was acquired on a Bruker
        timsTOF platform, and quantitative analysis was performed using
        Spectronaut", across four stages: parental undifferentiated iPSCs, neural
        progenitor cells, terminally differentiated neurons and terminally
        differentiated cardiomyocytes, with replicate counts of 4, 2, 3 and 2
        respectively.
      - >-
        SEC-MS on MDA-MB-468 cells following treatment with vorinostat or
        paclitaxel was performed in the Nevan Krogan laboratory at the University of
        California San Francisco.

  - id: d4d:cm4ai-mechanism-if-imaging
    name: Immunofluorescence imaging (ICC-IF) and confocal microscopy
    mechanism_details:
      - >-
        Spatial subcellular organization is mapped using the Human Protein Atlas
        resource of antibodies with immunofluorescence-based staining and
        high-resolution confocal microscopy in the Lundberg Lab at Stanford
        University.
      - >-
        "We established automated fixation and permeabilization protocols for the
        pipetting robot for MDA-MB-468 and KOLF2 cell lines, and completed spatial
        proteomics mapping of 100 chromatin regulators in the MDA-MB-468 cells (+/-
        paclitaxel or vorinostat), with another 500 proteins pending significant
        hits from the genetic perturbations and PPI results."
      - >-
        Four channels are acquired per sample: DAPI for nuclei (blue), calreticulin
        antibody for endoplasmic reticulum (yellow), tubulin antibody for
        microtubules (red), and an antibody against the protein of interest (green).

  - id: d4d:cm4ai-mechanism-crispr
    name: Single-cell CRISPR perturbation screens
    mechanism_details:
      - >-
        "We have designed a CRISPR lentiviral library targeting 100 chromatin
        factors with 6 guide RNAs per gene. We generated and characterized
        MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9."
      - >-
        "Single-cell CRISPR screens of 100 chromatin regulators (+/- drug) in
        MDA-MB-468 cells and in undifferentiated KOLF2.1J iPSCs were done using the
        10x Genomics 3'HT kit."
      - >-
        The Perturb-seq components of the current release describe an expressed
        genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs covering
        11,739 targeted genes, with findings validated via phenotypic,
        protein-interaction and metabolic tracing assays.

  - id: d4d:cm4ai-mechanism-packaging
    name: FAIRSCAPE RO-Crate packaging
    mechanism_details:
      - >-
        "FAIRSCAPE-CLI creates an RO-Crate package with the datasets, metadata, and
        software - or resolvable references to these components - and unique stubs
        for identifier creation on each of these components."
      - >-
        "The RO-Crates are then sent to the FAIRSCAPE server where they are
        registered and assigned persistent, resolvable, globally unique persistent
        identifiers (PIDs)." The identifier scheme in use is ARK, with DOIs
        described as a future feature for final-state publishable work.
      - >-
        "Lastly, the server computes end-to-end entailments on each RO-Crate's
        provenance as expressed in the EVI Evidence Graph Ontology and links them
        together where possible."
      - >-
        The current release crate declares conformance to RO-Crate 1.2 and records
        fairscapeVersion 1.1.3.

sampling_strategies:
  - id: d4d:cm4ai-sampling
    name: Sampling strategy
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        The larger set is the human proteome and the human genome as expressed in
        the two cell systems studied.
    strategies:
      - >-
        Targeted selection of a protein panel: "100 chromatin modifiers and 100
        metabolic enzymes involved in cancer, neuropsychiatric, and cardiac
        disorders".
      - >-
        Genome-scale selection for the CRISPRi perturbation atlas, covering 11,739
        targeted genes in KOLF2.1J iPSCs.
      - >-
        Proteome-wide acquisition for SEC-MS, which extends beyond the targeted
        panel.
      - >-
        Staged expansion of the imaging panel, with a further 500 proteins "pending
        significant hits from the genetic perturbations and PPI results".
    why_not_representative:
      - >-
        The releases state that the data "does not represent all biological variants
        which may be seen in the population at large", being derived from
        commercially available de-identified human cell lines.
      - >-
        Protein selection is driven by the project's disease focus and by
        intermediate results rather than by random sampling.
    representative_verification:
      - >-
        No representativeness verification is described in the sources.

data_collectors:
  - id: d4d:cm4ai-collector-lundberg
    name: Lundberg Lab, Stanford University
    role: Spatial proteomics and immunofluorescence imaging
    collector_details:
      - >-
        Named in every immunofluorescence dataset description as the laboratory in
        which ICC-IF staining and confocal imaging were performed.
      - >-
        Named authors on the immunofluorescence sub-crates of the current release
        are Hansen JN, Axelsson U, Johannesson A, Fall J, Ballllosera Navarro F and
        Lundberg E.

  - id: d4d:cm4ai-collector-krogan
    name: Krogan Laboratory, University of California San Francisco
    role: Protein-protein interaction data generation
    collector_details:
      - >-
        The SEC-MS data on treated MDA-MB-468 cells were generated in the Nevan
        Krogan laboratory at UCSF; the authorship recorded for that sub-crate is
        "Forget A, Obernier K, Krogan N".
      - >-
        The MuSIC pipeline downloads PPI networks "from the Krogan Laboratory's
        deposition archive".

  - id: d4d:cm4ai-collector-mali
    name: Mali laboratory and collaborators, University of California San Diego
    role: Genetic perturbation and Perturb-seq data generation
    collector_details:
      - >-
        The Perturbation Cell Atlas components are authored by "Doctor Y; Dailamy A;
        Forget A; Lee YH; Chinn B; Khaliq H; Polacco B; Muralidharan, M; Pan E;
        Zhang Y; Sigaeva A; Hansen JN; Gao J; Parker JA; Obernier K; Clark T; Chen
        JY; Metallo C; Lundberg E; Ideker T; Krogan N; Mali P".

  - id: d4d:cm4ai-collector-apms
    name: AP-MS data generation team
    role: Affinity purification mass spectrometry
    collector_details:
      - >-
        Both AP-MS sub-crates in the current release record Richa Tiwari as author
        and Trey Ideker as principal investigator.

  - id: d4d:cm4ai-collector-standards
    name: CM4AI Standards Module, University of Virginia
    role: AI-readiness packaging, provenance and deposit
    collector_details:
      - >-
        "The Standards Module of CM4AI is responsible for AI-Readiness packaging of
        data, software, metadata and provenance graphs. This task is performed by
        the FAIRSCAPE framework."
      - >-
        Justin Niestroy is recorded as the depositor of the Dataverse releases.

collection_timeframes:
  - id: d4d:cm4ai-timeframe-collection
    name: Data collection timeframe
    start_date: "2022-09-01"
    end_date: "2026-06-01"
    timeframe_details:
      - >-
        The current release crate records a data collection timeframe of
        "9/1/2022" to "6/1/2026", written in an ambiguous month/day/year format and
        recorded here as 2022-09-01 to 2026-06-01. The AP-MS sub-crates carry an
        earlier end value of "1/31/2026", consistent with their earlier packaging
        for the January 2026 release.
      - >-
        The start date agrees with the NIH RePORTER project start of 2022-09-01.

  - id: d4d:cm4ai-timeframe-project
    name: Funded project period
    start_date: "2022-09-01"
    end_date: "2026-08-31"
    timeframe_details:
      - >-
        NIH RePORTER records the project period for OT2OD032742 as project start
        2022-09-01 and project end 2026-08-31.
      - >-
        The release maintenance plan states that updates continue "through the end
        of the project in November 2026", which is later than the RePORTER project
        end date; both statements are recorded rather than reconciled.

  - id: d4d:cm4ai-timeframe-deposit
    name: Dataverse deposit dates
    start_date: "2025-02-27"
    timeframe_details:
      - >-
        Every Dataverse release from March 2025 onward records Data Creation Date
        2025-02-27 and Deposit Date 2025-02-27, with depositor Niestroy, Justin.
        These are properties of the Dataverse record rather than of the underlying
        measurements.

direct_collection:
  - id: d4d:cm4ai-direct-collection
    name: Direct collection
    is_direct: true
    collection_details:
      - >-
        All data are generated directly by CM4AI laboratories from cultured cell
        lines. There are no human subjects from whom data could have been obtained
        directly or through third parties; every release records Human Subjects: No.
      - >-
        The cell lines themselves are obtained from third parties: MDA-MB-468 is
        available from ATCC and KOLF2.1J is available from the Human Induced
        Pluripotent Stem Cells Initiative (HipSci) resource, accessible to
        not-for-profit organizations via a simple material transfer agreement.

missing_data_documentation:
  - id: d4d:cm4ai-missing-data
    name: Missing data
    missing_data_patterns:
      - >-
        Datasets under temporary pre-publication embargo are absent from the
        release at the time of release.
      - >-
        Proteins measured by one modality but not another, because "Protein-protein
        interaction (SEC-MS), protein localization (IF imaging), and CRISPRi
        perturbSeq data interrogate sets of proteins which incompletely overlap".
      - >-
        Computed cell maps are absent from every release to date.
      - >-
        The CM4AI flagship-datasets section marks two planned components as "coming
        soon": IF images for the iPSC-lineage curated dataset and AP-MS interactomes
        for the TNBC curated dataset. The AP-MS component was subsequently added in
        the June 2026 release, so the portal statement is stale with respect to the
        current release.
    missing_data_causes:
      - >-
        Pre-publication embargo on components whose associated papers are not yet
        published.
      - >-
        Sequential, quarterly generation of a data resource that is still in
        progress.
      - >-
        Different assay coverage across modalities.
    handling_strategy: >-
      Missing and incomplete content is disclosed rather than imputed. Every
      release carries an explicit Completeness statement, and the current release
      crate records the same text under rai:dataCollectionMissingData. External
      Data Links name components as Embargoed where they are not yet retrievable.

raw_data_sources:
  - id: d4d:cm4ai-raw-source-massive
    name: MassIVE repository
    source_description: >-
      Raw mass spectrometry data for the AP-MS and SEC-MS streams are held in the
      MassIVE repository at UC San Diego and referenced from the release crates.
    source_type:
      - mass spectrometry data repository
    access_details: >-
      Accessions referenced by the current release: MSV000101915 (AP-MS, MDA-MB-468
      paclitaxel), MSV000101917 (AP-MS, MDA-MB-468 vorinostat), MSV000100676
      (SEC-MS, KOLF2 differentiation series) and MSV000098237 (SEC-MS, treated
      MDA-MB-468), the last of which additionally carries doi:10.25345/C5348GV4S and
      the content URL ftp://massive-ftp.ucsd.edu/v10/MSV000098237/. The June 2025
      and October 2025 releases record MassIVE links for iPSC and cancer-cell mass
      spectrometry data under External Data Links.
    raw_data_format:
      - ".d"
      - ".d directory group"
      - ".tsv"
      - ".xml"

  - id: d4d:cm4ai-raw-source-sra
    name: NCBI Sequence Read Archive
    source_description: >-
      Raw sequence data from the CRISPRi Perturbation Cell Atlas are held in the
      Sequence Read Archive. The June 2025 release records "Sequence Read Archive
      (SRA) Data: NCBI BioProject" under External Data Links, and the current
      release includes a Perturb-seq raw sequence sub-crate reporting 16.7 TB of
      content.
    source_type:
      - sequence read repository
    raw_data_format:
      - fastq.gz

  - id: d4d:cm4ai-raw-source-figshare
    name: Figshare
    source_description: >-
      The current release records "CRISPRi Perturbation Atlas of iPSCs: Figshare"
      under External Data Links.
    source_type:
      - general-purpose data repository

  - id: d4d:cm4ai-raw-source-lab-archives
    name: Originating laboratory deposition archives
    source_description: >-
      The MuSIC pipeline draws its inputs from laboratory deposition archives:
      "PPI networks for the cell line and conditions are downloaded from the Krogan
      Laboratory's deposition archive" and "IF images for the cell line and
      conditions are downloaded from the Lundberg Laboratory's deposition archive".
    source_type:
      - laboratory deposition archive

# ---------------------------------------------------------------------------
# Preprocessing, cleaning, labeling
# ---------------------------------------------------------------------------
preprocessing_strategies:
  - id: d4d:cm4ai-preprocessing-music
    name: MuSIC data integration pipeline
    preprocessing_details:
      - >-
        "Input data streams are integrated via the multi-scale integrated cell
        (MuSIC) software pipeline employing deep learning models and community
        detection algorithms."
      - >-
        Step a, download: PPI networks and IF images for the cell line and
        conditions are downloaded from the originating laboratories' deposition
        archives.
      - >-
        Step b, generate embeddings: "Downloaded PPI networks are processed using
        the node2vec deep learning model to reduce dimensionality, producing a PPI
        embedding"; "IF images are processed using a Human Protein Atlas deep
        learning model to reduce dimensionality, producing an image embedding".
      - >-
        Step c, co-embedding: "The PPI and image embeddings are integrated to obtain
        a co-embedding for each protein using contrastive deep learning."
      - >-
        Step d, community detection and hierarchy creation: "Community detection is
        performed based on the all-by-all similarities of pairs of proteins in the
        co-embedding space. The resulting hierarchy of protein communities is output
        as the final cell map."
      - >-
        Step e, hierarchy evaluation: cell maps are aligned to the Gene Ontology and
        Reactome, and assemblies are additionally annotated using a large language
        model approach that names sets of proteins and assigns a name confidence
        score.
      - >-
        Step f, integrative structure modeling: MuSIC communities are annotated by
        available structural information from the Protein Data Bank, the AlphaFold
        Protein Structure Database, crosslinking mass spectrometry and disorder
        prediction, then ranked and modelled using the Integrative Modeling Platform
        version 2.18 via the Python Modeling Interface.
      - >-
        Each pipeline segment calls the FAIRSCAPE client to validate inputs and
        create the output RO-Crate package for that segment.

  - id: d4d:cm4ai-preprocessing-secms-quant
    name: Mass spectrometry quantitative analysis
    preprocessing_details:
      - >-
        For the KOLF2 differentiation SEC-MS dataset, "Data was acquired on a Bruker
        timsTOF platform, and quantitative analysis was performed using
        Spectronaut."

  - id: d4d:cm4ai-preprocessing-fairscape
    name: AI-readiness packaging and characterization
    preprocessing_details:
      - >-
        CM4AI's AI-readiness features comprise "(a) establishing FAIRness including
        rich metadata and persistent, globally unique identifiers; (b) computing a
        machine-readable provenance graph, resolvable as metadata for all results,
        including inputs, computations, software, and outputs; and (c)
        characterizing and validating all datasets and data elements, and mapping
        data elements to public ontology vocabularies, where appropriate, using
        JSON-Schema mini-data-dictionary descriptions resolvable from the provenance
        graph metadata."
      - >-
        The current release crate reports 20 documented schemas and 6 documented
        software instances.

cleaning_strategies:
  - id: d4d:cm4ai-cleaning-hpa
    name: Antibody and image quality control
    cleaning_details:
      - >-
        Immunofluorescence images and antibodies are validated according to Human
        Protein Atlas standard procedures for image and antibody quality control.

  - id: d4d:cm4ai-cleaning-crispr-qc
    name: Perturbation screen quality control
    cleaning_details:
      - >-
        The project preprint records that the single-cell CRISPR screen data
        generated in the first year were undergoing quality control at the time of
        writing: "The resulting data are currently being QCed."

  - id: d4d:cm4ai-cleaning-schema-validation
    name: Schema-based validation of datasets and data elements
    cleaning_details:
      - >-
        FAIRSCAPE-CLI "is passed metadata which defines schemas in JSON-Schema for
        the datasets in the computational unit, as well as the inputs, computations,
        software, models, and outputs", and CM4AI characterizes and validates "all
        datasets and data elements", mapping data elements to public ontology
        vocabularies where appropriate.

labeling_strategies:
  - id: d4d:cm4ai-labeling-assemblies
    name: Annotation of protein assemblies
    data_annotation_protocol:
      - >-
        "Cell maps are annotated in a two pronged approach. First, cell maps are
        aligned to known protein function and pathway resources, including the Gene
        Ontology (GO) and Reactome, to determine protein assemblies in the cell map
        with high overlap with known cell biology. Second, assemblies in the cell
        maps are annotated using a large language model (LLM) approach that we
        developed to name sets of proteins and assign a name confidence score."
    labeling_details:
      - >-
        Labelling applies to the derived cell maps rather than to the released
        map-input data streams, which are unlabelled measurements.

machine_annotation_tools:
  - id: d4d:cm4ai-annotation-tools
    name: Automated annotation tooling
    tools:
      - Large language model assembly-naming approach
      - Gene Ontology and Reactome alignment
      - node2vec
      - Human Protein Atlas image embedding model
      - Integrative Modeling Platform (IMP) version 2.18
    tool_descriptions:
      - >-
        The LLM approach names sets of proteins and assigns a name confidence
        score to each named assembly.
      - >-
        Alignment to the Gene Ontology and Reactome identifies assemblies with high
        overlap with known cell biology.
      - >-
        node2vec reduces the dimensionality of PPI networks to produce a PPI
        embedding; a Human Protein Atlas deep learning model does the same for
        images.
      - >-
        The Integrative Modeling Platform, scripted via the Python Modeling
        Interface, is used for integrative structure modeling of top-ranked MuSIC
        communities.

raw_sources:
  - id: d4d:cm4ai-raw-retained
    name: Retention of raw data
    access_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    raw_data_details:
      - >-
        Raw data are retained and distributed. The releases carry raw
        immunofluorescence image archives directly, and raw mass spectrometry and
        raw sequence data are deposited in MassIVE and the Sequence Read Archive
        with references from the release crates.
      - >-
        One component of the current release is explicitly a raw-sequence
        deposition: "Perturbation Cell Atlas of Human Induced Pluripotent Stem
        Cells - Raw Sequence Data", reporting 16.7 TB.
      - >-
        The AP-MS sub-crates describe their contents as "affinity purification mass
        spectrometry (AP-MS) raw data generated from endogenously tagged MDA-MB-468
        cells".
      - >-
        Provenance graphs computed by FAIRSCAPE link derived data back to the
        inputs, computations and software used to produce them.

# ---------------------------------------------------------------------------
# Uses
# ---------------------------------------------------------------------------
intended_uses:
  - id: d4d:cm4ai-intended-uses
    name: Intended uses
    examples:
      - AI-ready datasets to support research in functional genomics
      - AI model training
      - Cellular process analysis
      - >-
        Cell architectural changes and interactions in presence of specific disease
        processes, treatment conditions, or genetic perturbations
    use_category:
      - functional genomics research
      - machine learning model development
      - cell biology
    usage_notes: >-
      The release crate expands the same statement under rai:dataUseCases and adds
      that "A major goal is to enable biologically-driven, interpretable ML
      applications, for example as proposed in Ma et al. 2018 (PMID: 29505029) and
      Kuenzi et al. 2020 (PMID: 33096023)." Cell maps "provide a foundation for
      downstream applications in human genomics, including interpretation of
      genetic variants and mutations", and "have been used in AI tools for 'visible
      machine learning' or 'visible neural networks' (VNNs) to interrogate how
      protein assemblies in the cell affect cell-level phenotype predictions".

prohibited_uses:
  - id: d4d:cm4ai-prohibited-clinical
    name: Clinical decision-making and patient care
    description: >-
      "These laboratory data are not to be used in clinical decision-making or in
      any context involving patient care without appropriate regulatory oversight
      and approval." The statement appears on every release, and the current
      release crate records it twice, as usageInfo and as prohibitedUses.
    prohibition_reason:
      - >-
        The data are laboratory measurements on cultured cell lines and are not
        validated for clinical use; the releases record that they are not FDA
        regulated and involve no human subjects.

  - id: d4d:cm4ai-prohibited-commercial
    name: Commercial use without a separate licence
    description: >-
      The releases are licensed CC BY-NC-SA 4.0, under which "You may not use the
      material for commercial purposes", where "A commercial use is one primarily
      intended for commercial advantage or monetary compensation."
    prohibition_reason:
      - >-
        "Commercial use requires a separate license negotiation with the copyright
        holder (UCSD, Stanford, and/or UCSF depending upon the specific data package
        in question). A Data Access Committee will supervise ethical matters related
        to dataset distribution and potential dual licensing for commercial use."

discouraged_uses:
  - id: d4d:cm4ai-discouraged-integration
    name: Premature cross-modality integration
    discouragement_details:
      - >-
        The releases state that "The current release is most suitable for
        bioinformatics analysis of the individual datasets", and that predicted cell
        maps are not included. Integrated analysis across modalities is therefore
        not what a current release supports directly.
      - >-
        Incomplete overlap between the protein sets interrogated by SEC-MS, IF
        imaging and CRISPRi Perturb-seq limits the set of proteins on which
        cross-modality analysis is possible.

  - id: d4d:cm4ai-discouraged-population-inference
    name: Inference about population-level biological variation
    discouragement_details:
      - >-
        The data are derived from two commercially available de-identified human
        cell lines and, in the project's own words, do "not represent all biological
        variants which may be seen in the population at large".

  - id: d4d:cm4ai-discouraged-without-expertise
    name: Analysis without domain expertise
    discouragement_details:
      - >-
        The releases state plainly that the data "Requires domain expertise for
        meaningful analysis".

existing_uses:
  - id: d4d:cm4ai-existing-use-multimodal-map
    name: Global multimodal map of human subcellular architecture
    examples:
      - >-
        Schaffer LV, Hu M, Qian G, et al. "Multimodal cell maps as a foundation for
        structural and functional genomics", Nature, published 09 April 2025,
        https://www.nature.com/articles/s41586-025-08878-3, listed as an associated
        publication of the current release. It constructs "a global map of human
        subcellular architecture through joint measurement of biophysical
        interactions and immunofluorescence images for over 5,100 proteins in U2OS
        osteosarcoma cells", resolving 275 molecular assemblies spanning 10e-8 to
        10e-5 m, validated systematically using whole-cell size-exclusion
        chromatography and annotated using large language models. The study is
        conducted in U2OS osteosarcoma cells rather than in the MDA-MB-468 and
        KOLF2.1J systems used for the quarterly releases; it demonstrates the
        programme's methodology rather than reusing the released data.
      - >-
        Reported outcomes of that study include structures for 111 heterodimeric
        complexes and an expanded Rag-Ragulator assembly, assignment of unexpected
        functions to 975 proteins, identification of 21 recurrently mutated
        assemblies in paediatric cancer genomes and implication of 102 validated new
        cancer proteins, together with a Cell Visualization Portal and Mapping
        Toolkit.

  - id: d4d:cm4ai-existing-use-perturbation-atlas
    name: Perturbation cell atlas of human induced pluripotent stem cells
    examples:
      - >-
        Nourreddine S, Doctor Y, Dailamy A, et al. "A Perturbation Cell Atlas of
        Human Induced Pluripotent Stem Cells", bioRxiv 2024.11.03.621734, PMCID
        PMC11580897, doi https://doi.org/10.1101/2024.11.03.621734. Listed as a
        related publication on the current release and as the associated publication
        of both Perturb-seq sub-crates.

  - id: d4d:cm4ai-existing-use-music
    name: Multi-scale integrated cell mapping
    examples:
      - >-
        Qin Y, Huttlin EL, Winsnes CF, et al. "A multi-scale map of cell structure
        fusing protein images and interactions", Nature 600, 536-542 (2021), doi
        10.1038/s41586-021-04115-9. Cited as the proof of concept for fusing two
        modalities, "with the initial version covering 661 human proteins", and
        listed among the associated publications of the current release.

  - id: d4d:cm4ai-existing-use-visible-neural-networks
    name: Visible neural networks
    examples:
      - >-
        Cell maps "have been used in AI tools for 'visible machine learning' or
        'visible neural networks' (VNNs) to interrogate how protein assemblies in
        the cell affect cell-level phenotype predictions". The release crate names
        Ma et al. 2018 (PMID: 29505029) and Kuenzi et al. 2020 (PMID: 33096023) as
        the applications it aims to enable.

  - id: d4d:cm4ai-existing-use-training
    name: Training and workforce development
    examples:
      - >-
        The data were made available at the CM4AI CodeFest in March 2024,
        "accompanied by detailed tutorials explaining how the data were derived and
        integrated, and providing production ready software for producing the
        datasets". The inaugural virtual CodeFest trained 38 registrants.

use_repository:
  - id: d4d:cm4ai-use-repo-portal
    name: CM4AI web portal
    repository_url: https://cm4ai.org/
    repository_details:
      - >-
        The open-access CM4AI web portal, built on the U-BRITE platform, hosts the
        data releases page, product documentation, publications and training
        material.
      - >-
        The portal carries the notice "This repository is under review for
        potential modification in compliance with Administration directives".

  - id: d4d:cm4ai-use-repo-dataverse
    name: University of Virginia Dataverse (LibraData)
    repository_url: https://dataverse.lib.virginia.edu/
    repository_details:
      - >-
        Every quarterly release is deposited in the Cell Maps for Artificial
        Intelligence collection under School of Medicine within LibraData, "the
        University of Virginia's archival data repository" and "an NIH-approved
        generalist repository".
      - >-
        The collection carries the notice "This collection is under review for
        potential modification in compliance with Administration directives".

  - id: d4d:cm4ai-use-repo-ndex
    name: Network Data Exchange (NDEx)
    repository_details:
      - >-
        "Cell maps are shared via the Network Data Exchange (NDEx) and can be
        visualized in a web browser or accessed via tools such as Cytoscape, HiView,
        and the Python ndex2 library."

  - id: d4d:cm4ai-use-repo-fairscape
    name: FAIRSCAPE
    repository_url: https://fairscape.github.io
    repository_details:
      - >-
        FAIRSCAPE registers each RO-Crate and its components and assigns persistent,
        resolvable ARK identifiers that resolve to machine- and human-readable
        landing pages carrying the metadata and evidence graph.
      - >-
        "The FAIRSCAPE AI-readiness framework is described with a tutorial and
        instructions for installation at https://fairscape.github.io." It is
        available under the MIT open source licence, copyright the Rector and Board
        of Visitors of the University of Virginia.

future_use_impacts:
  - id: d4d:cm4ai-future-use-impacts
    name: Future use impacts
    impact_details:
      - >-
        Releases are interim and the composition of the resource changes each
        quarter, so an analysis run against one release will not necessarily
        reproduce against a later one. Users should record the release DOI and
        version they used.
      - >-
        Predicted cell maps are to be added in future releases; conclusions drawn
        from the current map-input data streams may be revised once integrated maps
        are published.
      - >-
        Because the data derive from two cell lines, models trained on them may not
        transfer to other cellular or population contexts. The releases disclose
        this as a potential source of bias.
      - >-
        The programme anticipates governance implications of downstream use: its
        ethics work "involves anticipating potential applications of the data and
        derived AI/ML systems, integrating them into data governance frameworks to
        optimize benefits and mitigate potential risks, and promoting their use for
        the collective good".
      - >-
        Both the project portal and the Dataverse collection carry a notice that
        they are "under review for potential modification in compliance with
        Administration directives", which bears on future availability.

other_tasks:
  - id: d4d:cm4ai-other-tasks
    name: Other tasks the data could support
    task_details:
      - >-
        Interpretation of genetic variants and mutations, for which cell maps
        "provide a foundation for downstream applications in human genomics".
      - >-
        Structural biology, through integrative structure modeling of protein
        assemblies annotated by available structural information.
      - >-
        Study of treatment-induced interactome rewiring, the explicit focus of the
        AP-MS components, which examine "drug-induced interactome rewiring of
        chromatin modifiers relevant to the triple-negative breast cancer context".
      - >-
        Study of proteome reorganization during differentiation, the explicit aim of
        the KOLF2 SEC-MS component: "to identify how protein complexes and networks
        are reorganized during neuronal lineage commitment and cardiomycyte
        differentiation".

# ---------------------------------------------------------------------------
# Distribution
# ---------------------------------------------------------------------------
distribution_formats:
  - id: d4d:cm4ai-distribution-formats
    name: Distribution formats and access
    description: >-
      Releases are distributed as ZIP archives through the University of Virginia
      Dataverse. Dataverse states that "The dataset is too large to download.
      Please select the files you need from the files table", and that "The files
      selected are too large to download as a ZIP. You can select individual files
      that are below the 1.9 GB download limit from the files table, or use the
      Data Access API for programmatic access to the files." Package files are
      retrieved with a download URL of the form
      https://dataverse.lib.virginia.edu/api/access/datafile/ used with wget or a
      download manager. The current release crate records the formats present
      across its components as .d, .d directory group, .tsv, .xml, TSV, csv,
      executable, fastq.gz, h5, h5ad, image/jpeg, pdf and unknown. Metadata can be
      exported from Dataverse as OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD,
      DDI Codebook v2, Dublin Core, Croissant, DDI HTML Codebook and JSON.
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
      - https://cm4ai.org/data-releases/

distribution_dates:
  - id: d4d:cm4ai-distribution-dates
    name: Release schedule and dates
    release_dates:
      - "2025-03-03: March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX"
      - "2025-07-01: June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R"
      - "2025-10-31: October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM"
      - "2026-06-17: June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C"
      - "2026-07-15T20:28:19Z: version 2 of the June 2026 release published"
    description: >-
      "CM4AI releases data quarterly, ensuring continuous updates to the cell maps
      and input data streams." The archive list on the CM4AI data releases page
      also names a May 2024 Data Release, for which no DOI, file inventory or
      Dataverse record is present in this source bundle; the project preprint cites
      an earlier deposit, "Cell Maps for Artificial Intelligence - Data Release",
      https://doi.org/10.18130/V3/DXWOS5, V1. Individual files may carry publication
      dates later than the release date: three files of the June 2026 release are
      dated Jul 15, 2026, and two files of the October 2025 release are dated Dec
      22, 2025.

third_party_sharing:
  - id: d4d:cm4ai-third-party-sharing
    name: Distribution to third parties
    is_shared: true
    description: >-
      Beyond the University of Virginia Dataverse, release components are
      distributed through the MassIVE repository at UC San Diego for mass
      spectrometry data, through the NCBI Sequence Read Archive for raw sequence
      data, through Figshare for the CRISPRi Perturbation Atlas of iPSCs, and
      through the Network Data Exchange for cell maps. Persistent identifiers are
      additionally minted by FAIRSCAPE under the ARK scheme. The project states
      that "Its datasets and software are available to the research community under
      minimally restrictive terms consistent with ethical guidelines, researcher
      attribution, and research integrity."

license_and_use_terms:
  id: d4d:cm4ai-license-terms
  name: Licence and use terms
  description: >-
    Every release is licensed under the Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International licence, recorded on
    Dataverse as CC BY-NC-SA 4.0 and in the release crate as
    https://creativecommons.org/licenses/by-nc-sa/4.0/. Component sub-crates of the
    current release do not all carry the same licence: the two AP-MS sub-crates and
    the KOLF2 SEC-MS sub-crate are marked CC0 1.0
    (https://creativecommons.org/publicdomain/zero/1.0/) while the
    immunofluorescence, treated-cancer-cell SEC-MS and Perturb-seq sub-crates are
    marked CC BY-NC-SA 4.0. The licence contact referenced by ORCID
    https://orcid.org/0000-0002-1708-8454 is Trey Ideker
    (tideker@health.ucsd.edu), recorded as point of contact on every Dataverse
    release and as contactEmail on the release crate.
  license_terms:
    - >-
      Attribution: "You must give appropriate credit, provide a link to the
      license, and indicate if changes were made. You may do so in any reasonable
      manner, but not in any way that suggests the licensor endorses you or your
      use."
    - >-
      NonCommercial: "You may not use the material for commercial purposes", where
      "A commercial use is one primarily intended for commercial advantage or
      monetary compensation."
    - >-
      ShareAlike: "If you remix, transform, or build upon the material, you must
      distribute your contributions under the same license as the original."
    - >-
      No additional restrictions: "You may not apply legal terms or technological
      measures that legally restrict others from doing anything the license
      permits."
    - >-
      "Attribution is required to the copyright holders and the authors. Any
      publications referencing this data or derived data products should cite the
      Related Publications below, as well as directly citing this data collection."
    - >-
      Dataverse community norms: "Our Community Norms as well as good scientific
      practices expect that proper credit is given via citation. Please use the data
      citation shown on the dataset page."
    - >-
      The licence deed notes that "No warranties are given. The license may not give
      you all of the permissions necessary for your intended use. For example, other
      rights such as publicity, privacy, or moral rights may limit how you use the
      material."
  data_use_permission:
    - no_commercial_use
  contact_person: https://orcid.org/0000-0002-1708-8454

ip_restrictions:
  id: d4d:cm4ai-ip-restrictions
  name: Intellectual property restrictions
  restrictions:
    - >-
      "Copyright (c) 2026 The Regents of the University of California except where
      otherwise noted. Spatial proteomics raw image data is copyright (c) 2026 The
      Board of Trustees of the Leland Stanford Junior University." The March 2025
      release carries the same notice with the year 2025.
    - >-
      "Commercial use requires a separate license negotiation with the copyright
      holder (UCSD, Stanford, and/or UCSF depending upon the specific data package
      in question)."
    - >-
      "A Data Access Committee will supervise ethical matters related to dataset
      distribution and potential dual licensing for commercial use."
    - >-
      Software is separately licensed and less restricted: "All CM4AI integration
      and packaging software is freely available and licensed under nonrestrictive
      open-source licenses." The Tools data integration pipeline is available under
      the BSD-3 licence and FAIRSCAPE under the MIT licence, copyright the Rector
      and Board of Visitors of the University of Virginia.
    - >-
      The KOLF2.1J cell line "is available for access by non-for-profit
      organizations via a simple MTA".

regulatory_restrictions:
  id: d4d:cm4ai-regulatory-restrictions
  name: Regulatory and governance restrictions
  description: >-
    Every release records the same governance block: Human Subjects: No,
    De-identified Samples: Yes, FDA Regulated: No, with a named data governance
    committee contact and two named ethical review contacts. The governance
    contact referenced by ORCID https://orcid.org/0000-0003-4535-3486 is recorded
    on the releases as "Data Governance Committee: Jillian Parker
    (jillianparker@health.ucsd.edu)"; the release crate gives the same role to
    "Jilian Parker", spelled with one l, and the Dataverse spelling is used here.
    The ORCID is that of the release author recorded as "Parker J (University of
    California, San Diego)".
  regulatory_restrictions:
    - "FDA Regulated: No."
    - >-
      Data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
    - >-
      Both the CM4AI portal and the University of Virginia Dataverse collection
      carry the notice that they are "under review for potential modification in
      compliance with Administration directives".
  hipaa_compliant: not_applicable
  other_compliance:
    - >-
      The releases state that the research involves no human subjects and uses
      commercially available de-identified human cell lines, so no protected health
      information is involved.
    - >-
      Data packages are distributed under terms the project describes as "minimally
      restrictive terms consistent with ethical guidelines, researcher attribution,
      and research integrity".
  confidentiality_level: unrestricted
  governance_committee_contact: https://orcid.org/0000-0003-4535-3486

# ---------------------------------------------------------------------------
# Maintenance
# ---------------------------------------------------------------------------
maintainers:
  - id: d4d:cm4ai-maintainer-cm4ai
    name: CM4AI project
    role: academic_institution
    maintainer_details:
      - >-
        The CM4AI project maintains the release series. Project-related inquiries
        are directed on the portal to "Swathi Thaker, PhD, UAB, Program Manager,
        snthaker@uab.edu", and website support and updates to "Zhandos Sembay, UAB,
        zsembay8@uab.edu".
      - >-
        The point of contact recorded on every Dataverse release is Ideker Trey
        (University of California San Diego); the release crate records the contact
        email tideker@health.ucsd.edu.

  - id: d4d:cm4ai-maintainer-uva-dataverse
    name: University of Virginia Dataverse (LibraData)
    role: academic_institution
    maintainer_details:
      - >-
        "Long term preservation in the University of Virginia Dataverse, supported
        by committed institutional funds."
      - >-
        The Dataverse instance is operated by the University of Virginia Library;
        the release pages carry the notice "Copyright (c) 2026, by the Rector and
        Visitors of the University of Virginia" and run Dataverse v. 6.9.

updates:
  id: d4d:cm4ai-updates
  name: Update plan
  frequency: quarterly
  update_details:
    - >-
      "Dataset will be regularly updated and augmented through the end of the
      project in November 2026."
    - "Updates on a quarterly basis."
    - >-
      "CM4AI releases data quarterly, ensuring continuous updates to the cell maps
      and input data streams."
    - >-
      "Data presented here will be augmented regularly through the end of the
      project."
    - >-
      Updates are published as new DOI-bearing Dataverse deposits rather than as
      revisions of a single record, and each deposit is separately versioned within
      Dataverse; the June 2025 release, for example, reached version 2.1 through an
      in-place revision.

retention_limit:
  id: d4d:cm4ai-retention
  name: Retention and preservation
  retention_period: >-
    No retention limit or end-of-life date is stated. The project commits to long
    term preservation.
  retention_details:
    - >-
      "Long term preservation in the University of Virginia Dataverse, supported by
      committed institutional funds."
    - >-
      Older releases remain published and citable: the March 2025, June 2025 and
      October 2025 releases all remain retrievable under their own DOIs and are
      named in the archive list on the CM4AI data releases page.
    - >-
      Dataverse states that files "will not be removed from previously published
      versions of the dataset".

version_access:
  id: d4d:cm4ai-version-access
  name: Version access
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - "March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX, Dataverse version 1.4"
    - "June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R, Dataverse version 2.1"
    - "October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM, Dataverse version 2.1"
    - "June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, Dataverse version 2.0, current"
    - >-
      "May 2024 Data Release, named in the archive list on the CM4AI data releases
      page; no DOI, file inventory or Dataverse record for it is present in this
      source bundle"
    - >-
      "Cell Maps for Artificial Intelligence - Data Release, doi:10.18130/V3/DXWOS5,
      V1, cited in the project preprint's Data and Software Availability Statement"
  version_details:
    - >-
      Each quarterly release is a distinct Dataverse deposit with its own DOI, and
      is independently versioned within Dataverse; older releases are not
      superseded in place.
    - >-
      Version labels are not always consistent between a release's landing page and
      its recommended citation. The March 2025 release page shows version 1.4 while
      its citation shows V1; the June 2026 release page shows Version 2.0 while its
      release crate reports version "1.0" and a citation naming V1 and the year 2025.
    - >-
      A note on the June 2025 release page records that "The 'DRAFT' version was
      not found. This is version '2.1'."

extension_mechanism:
  id: d4d:cm4ai-extension
  name: Extension and contribution mechanism
  contribution_url: https://cm4ai.org/
  extension_details:
    - >-
      The ShareAlike licence permits others to remix, transform and build upon the
      material provided contributions are distributed under the same licence.
    - >-
      No formal mechanism for third parties to contribute data into a release is
      described in the sources. Dataset distribution and potential dual licensing
      for commercial use are supervised by a Data Access Committee.
    - >-
      Collaboration channels described by the project include the CM4AI web portal,
      engagement with the NIH Common Fund Data Ecosystem for data curation, and the
      Bridge2AI Center.
    - >-
      Contact for extension or reuse questions is via the Dataverse "Contact Owner"
      facility for each release, or the project contacts on the CM4AI portal.

errata:
  - id: d4d:cm4ai-erratum-june-2025-revision
    name: June 2025 release revision
    erratum_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
    erratum_details:
      - >-
        The June 2025 release record states that it "is a revision of the June 2025
        Data Release of Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org)"
        and that "This revision includes adding RGB immunofluorescent images,
        corrections to ro-crate metadata, and changes to naming conventions."
      - >-
        The revision is published as Dataverse version 2.1 of the same DOI rather
        than as a separate release.

  - id: d4d:cm4ai-erratum-release-date-discrepancy
    name: Release date discrepancy on the CM4AI data releases page
    erratum_url: https://cm4ai.org/data-releases/
    erratum_details:
      - >-
        The CM4AI data releases page labels doi:10.18130/V3/HIGT4C the "June 2026
        Data Release (Beta)" but displays "Released on: June 17, 2025". The
        Dataverse record for the same DOI gives publication date 2026-06-17. The
        Dataverse metadata is treated as authoritative and the portal display is
        recorded as an error of one year.
      - >-
        The release crate for the same release reports datePublished "2026-06-30"
        and version "1.0", and carries a citation string naming the year 2025 and
        version V1, against the Dataverse record's version 2.0 and publication date
        2026-06-17.

# ---------------------------------------------------------------------------
# Ethics, human subjects, governance
# ---------------------------------------------------------------------------
ethical_reviews:
  - id: d4d:cm4ai-ethical-review-ravitsky
    name: CM4AI ethical review contact, Vardit Ravitsky
    review_details:
      - >-
        Every release records under Data Governance & Ethics: "Ethical Review:
        Vardit Ravitsky (ravitskyv@thehastingscenter.org) and Jean-Christophe
        Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca)". The release crate
        records the same pair under ethicalReview, spelling the first name
        "Vardit Ravistky"; the Dataverse spelling is used here.
      - >-
        The reviewing body referenced as d4d:cm4ai-org-ethics-module is the CM4AI
        Ethics Module: "The Ethics team worked closely with Data Acquisition,
        Tools, and Standards Modules to develop a plan for ethical preparation,
        licensing, dissemination, and Data Access supervision of CM4AI datasets."
    contact_person: https://orcid.org/0000-0002-7080-8801
    reviewing_organization: d4d:cm4ai-org-ethics-module

  - id: d4d:cm4ai-ethical-review-belisle-pipon
    name: CM4AI ethical review contact, Jean-Christophe Belisle-Pipon
    review_details:
      - >-
        Named alongside Vardit Ravitsky as an ethical review contact on every
        release and in the release crate.
      - >-
        The Ethics team "employs a methodology inspired by Value-Sensitive Design
        (VSD), facilitating the creation of normative standards and expectations
        aimed at ensuring the responsible design of datasets and AI technologies, in
        alignment with core values", and is "instrumental in formulating the CM4AI
        Life Cycle, a framework designed to elucidate governance milestones
        throughout the data generation and AI system development processes".
    contact_person: https://orcid.org/0000-0002-8965-8153
    reviewing_organization: d4d:cm4ai-org-ethics-module

human_subject_research:
  id: d4d:cm4ai-human-subject-research
  name: Human subject research status
  involves_human_subjects: false
  ethics_review_board:
    - >-
      No institutional review board approval is recorded, consistent with the
      release's own determination that the work is not human subjects research.
    - >-
      Ethical oversight is provided by the CM4AI Ethics Module and by a Data Access
      Committee that "will supervise ethical matters related to dataset distribution
      and potential dual licensing for commercial use".
  regulatory_compliance:
    - "Human Subjects: No."
    - "De-identified Samples: Yes."
    - "FDA Regulated: No."
    - >-
      The release crate records humanSubjectResearch as "None - data collected from
      commercially available cell lines" and humanSubjectExemption as "Exempt -
      research with commercially available de-identified human cell lines does not
      constitute human subjects research."
  special_populations:
    - >-
      None. The programme involves no human participants; the cell lines used are
      commercially available and de-identified.

informed_consent:
  - id: d4d:cm4ai-informed-consent
    name: Informed consent
    consent_obtained: false
    consent_type:
      - Not applicable
    consent_documentation:
      - >-
        The release crate records under d4d:informedConsent: "Not applicable - data
        collected from commercially available de-identified human cell lines
        (KOLF2.1J iPSC and MDA-MB-468). No primary human subjects research conducted
        under this release."
    consent_scope:
      - >-
        Consent for the original derivation of the cell lines was obtained by the
        originating resources rather than by CM4AI. The project states that both
        cell lines "have been ethically sourced", that MDA-MB-468 is available from
        ATCC, and that KOLF2.1J is "available from the Human Induced Pluripotent
        Stem Cells Initiative (HipSci) resource".
    withdrawal_mechanism:
      - >-
        Not applicable; there are no participants who could withdraw. The data
        "cannot be matched, with current knowledge, to a human subject".

at_risk_populations:
  id: d4d:cm4ai-at-risk-populations
  name: At-risk populations
  at_risk_groups_included: false
  special_protections:
    - >-
      The release crate records under d4d:atRiskPopulations: "None - no human
      subjects involved; commercially sourced de-identified cell lines only."
  assent_procedures:
    - Not applicable; no human participants are involved.
  guardian_consent:
    - Not applicable; no human participants are involved.

is_deidentified:
  id: d4d:cm4ai-deidentification
  name: De-identification
  identifiable_elements_present: false
  method: >-
    Use of commercially available, already de-identified human cell lines rather
    than primary human subject material.
  deidentification_details:
    - "Every release records De-identified Samples: Yes."
    - >-
      "CM4AI data are distinctive within Bridge2AI in that they are non-clinical
      (from tissue cultures) and are considered to be de-identified as they cannot
      be matched, with current knowledge, to a human subject."
    - >-
      Donor characteristics survive only at the cell-line level, as documented
      properties of MDA-MB-468 (RRID:CVCL_0419) and KOLF2.1J (RRID:CVCL_B5P3), and
      are not attached to individual measurements.

# ---------------------------------------------------------------------------
# External resources and related datasets
# ---------------------------------------------------------------------------
external_resources:
  - id: d4d:cm4ai-external-massive
    name: MassIVE repository
    description: >-
      Mass spectrometry raw data for the AP-MS and SEC-MS streams are hosted at
      MassIVE, referenced by accession from the release crates and by External Data
      Links on the June 2025, October 2025 and June 2026 releases.
    external_resources:
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676
      - ftp://massive-ftp.ucsd.edu/v10/MSV000098237/
    archival: true
    future_guarantees:
      - >-
        No guarantee about MassIVE's future availability is given in the sources.
        One of the four accessions, MSV000098237, additionally carries its own DOI,
        doi:10.25345/C5348GV4S.

  - id: d4d:cm4ai-external-sra
    name: NCBI Sequence Read Archive
    description: >-
      Raw sequence data from the CRISPRi Perturbation Cell Atlas are hosted in the
      Sequence Read Archive, referenced from the June 2025 release as "Sequence Read
      Archive (SRA) Data: NCBI BioProject".
    archival: true

  - id: d4d:cm4ai-external-figshare
    name: Figshare
    description: >-
      The current release records "CRISPRi Perturbation Atlas of iPSCs: Figshare"
      under External Data Links.
    archival: true

  - id: d4d:cm4ai-external-ndex
    name: Network Data Exchange (NDEx)
    description: >-
      Cell maps produced from the released input data streams are shared via NDEx
      and can be visualized in a web browser or accessed via Cytoscape, HiView and
      the Python ndex2 library.

  - id: d4d:cm4ai-external-cell-lines
    name: Cell line sources
    description: >-
      The two cell lines are obtained from external resources. MDA-MB-468
      (RRID:CVCL_0419) is available from ATCC. KOLF2.1J (RRID:CVCL_B5P3) is
      available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
      resource.
    restrictions:
      - >-
        KOLF2.1J "is available for access by non-for-profit organizations via a
        simple MTA".

  - id: d4d:cm4ai-external-software
    name: CM4AI software
    description: >-
      Software used to produce the releases is distributed separately from the data.
      "Software comprising the Tools data integration pipeline is available under
      BSD-3 open source license in GitHub (for alpha level tools) or in the Zenodo
      long-term archive (for production-ready tools). Links to these tools are
      packaged in RO-Crates as part of CM4AI provenance representations." The
      Integrative Modeling Platform is available at http://integrativemodeling.org.
    external_resources:
      - https://fairscape.github.io
      - http://integrativemodeling.org
    future_guarantees:
      - >-
        "Software packages will be versioned as the project progresses, and the
        version used to produce each dataset will be referenced in the dataset's
        metadata."

related_datasets:
  - id: d4d:cm4ai-related-massive-101915
    name: MassIVE MSV000101915
    target_dataset: https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915
    relationship_type: is_part_of
    description: >-
      AP-MS raw data for paclitaxel-treated MDA-MB-468 cells, referenced as sameAs
      by the corresponding sub-crate of the June 2026 release.

  - id: d4d:cm4ai-related-massive-101917
    name: MassIVE MSV000101917
    target_dataset: https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917
    relationship_type: is_part_of
    description: >-
      AP-MS raw data for vorinostat-treated MDA-MB-468 cells, referenced as sameAs
      by the corresponding sub-crate of the June 2026 release.

  - id: d4d:cm4ai-related-massive-100676
    name: MassIVE MSV000100676
    target_dataset: https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676
    relationship_type: is_part_of
    description: >-
      SEC-MS data for the KOLF2.1J differentiation series, referenced as sameAs by
      the corresponding sub-crate of the June 2026 release.

  - id: d4d:cm4ai-related-massive-098237
    name: MassIVE MSV000098237
    target_dataset: https://doi.org/10.25345/C5348GV4S
    relationship_type: is_part_of
    description: >-
      SEC-MS data for treated MDA-MB-468 cells, carrying its own DOI and an FTP
      content URL, referenced by the corresponding sub-crate of the June 2026
      release.

  - id: d4d:cm4ai-related-dxwos5
    name: Cell Maps for Artificial Intelligence - Data Release (earlier deposit)
    target_dataset: https://doi.org/10.18130/V3/DXWOS5
    relationship_type: is_referenced_by
    description: >-
      An earlier CM4AI data deposit in the University of Virginia Dataverse, cited
      in the project preprint's Data and Software Availability Statement as "Clark
      T, Mohan J, Schaffer L, Obernier K, et al. Cell Maps for Artificial
      Intelligence - Data Release, https://doi.org/10.18130/V3/DXWOS5, University of
      Virginia Dataverse, V1". No Dataverse record for it is present in this source
      bundle, and it is not among the four quarterly releases listed in `resources`.

  - id: d4d:cm4ai-related-music
    name: MuSIC multi-scale integrated cell map
    target_dataset: https://doi.org/10.1038/s41586-021-04115-9
    relationship_type: derives_from
    description: >-
      The proof-of-concept multi-scale map that the CM4AI mapping approach builds
      on, covering 661 human proteins, listed among the associated publications of
      the June 2026 release.
