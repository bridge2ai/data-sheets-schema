# ---------------------------------------------------------------------------
# Motivation
# ---------------------------------------------------------------------------
purposes:
  - id: d4d:cm4ai-purpose-interpretable-learning
    name: Interpretable genotype-phenotype learning
    response: >-
      The CM4AI data generation project "seeks to map the spatiotemporal
      architecture of human cells and use these maps toward the grand challenge of
      interpretable genotype-phenotype learning". The stated motivation is that in
      genomics and precision medicine, machine learning models are often "black
      boxes", predicting phenotypes from genotypes without understanding the
      mechanisms by which such translation occurs. The releases exist to make the
      map-input data streams available as they are produced, on a quarterly
      cadence, so that the research community can build on them before the
      integrated maps are complete.

  - id: d4d:cm4ai-purpose-visible-machine-learning
    name: Enabling visible machine learning systems
    response: >-
      The project's objective is to "generate a resource of matched data and tools
      to enable the creation of 'visible' ML systems, which are not black boxes but
      are built directly on knowledge maps of cell and tissue architecture", and to
      "broadly stimulate research and development in 'visible' machine learning
      systems informed by multi-scale cell and tissue architecture".

  - id: d4d:cm4ai-purpose-ai-ready-data
    name: Producing ethical, AI-ready data
    response: >-
      The programme's overarching mission is "to produce ethical, AI-ready
      datasets of cell architecture, inferred from multimodal data collected for
      human cell lines, to enable transformative biomedical AI research". CM4AI
      defines AI-ready biomedical data as "fully characterized FAIR data of known
      provenance, which can be ethically and reliably processed by AI
      applications; whose models and software are available and well-described for
      validation and re-use; and whose predictions may be fully explained and
      interpreted to the user as needed". The criteria the project applies are
      FAIR, Provenanced, Characterized, Explainable and Ethical, and it treats
      these as interdependent.

  - id: d4d:cm4ai-purpose-standards-and-provenance
    name: Demonstrating FAIR data management with deep provenance
    response: >-
      The project undertakes to "implement a standards data management approach
      based on FAIR access and software principles, with deep provenance and
      replication packages for representation of cell maps and their underlying
      datasets", to "initiate a research program in ethical AI, especially as it
      relates to how maps will be used in genomic medicine and model
      interpretation", and to "stimulate a diverse portfolio of training
      opportunities in the emerging field of biomachine learning".

tasks:
  - id: d4d:cm4ai-task-cell-mapping
    name: Multimodal cell map construction
    response: >-
      Constructing hierarchical maps of cell architecture. Cell maps are described
      as "hierarchical directed acyclic graphs (DAG), where each node represents an
      assembly of proteins in proximity at a given scale, spanning from large
      assemblies representing cell compartments (e.g. nucleus, mitochondria) to
      small assemblies of proteins in close proximity (e.g. protein complexes or
      subunits)". Input data streams are integrated via the Multi-Scale Integrated
      Cell (MuSIC) software pipeline employing deep learning models and community
      detection algorithms.

  - id: d4d:cm4ai-task-ppi-mapping
    name: Protein-protein interaction mapping
    response: >-
      Mapping protein-protein interactions of chromatin regulators under different
      conditions using two orthogonal mass-spectrometry approaches, AP-MS on
      endogenously tagged cell lines and SEC-MS for proteome-wide complex and
      interaction mapping.

  - id: d4d:cm4ai-task-spatial-proteomics
    name: Spatial proteomics mapping
    response: >-
      Mapping the spatial subcellular organization of chromatin modifiers, their
      interactors and key signaling molecules involved in cancer, using the Human
      Protein Atlas resource of antibodies with immunofluorescence staining and
      confocal microscopy.

  - id: d4d:cm4ai-task-genetic-perturbation
    name: Genetic perturbation mapping
    response: >-
      Performing single-cell CRISPR screens perturbing chromatin regulators in
      MDA-MB-468 cells under three conditions (no treatment, paclitaxel or
      vorinostat) and in KOLF2.1J iPSCs, to map transcriptional and fitness
      phenotypes.

  - id: d4d:cm4ai-task-model-training
    name: AI model training
    response: >-
      The releases state that the data are intended for "AI model training", for
      "AI-ready datasets to support research in functional genomics", for
      "cellular process analysis", and for the study of "cell architectural changes
      and interactions in presence of specific disease processes, treatment
      conditions, or genetic perturbations".

addressing_gaps:
  - id: d4d:cm4ai-gap-black-box-models
    name: Uninterpretable genotype-phenotype models
    response: >-
      "Machine learning (ML) models show great promise in analyzing the human
      genome to make predictions, but the inner workings of these models are
      typically difficult-to-interpret 'black boxes'." The programme addresses this
      by generating matched, multimodal data and tools from which visible ML
      systems can be built directly on knowledge maps of cell and tissue
      architecture.

  - id: d4d:cm4ai-gap-unexplored-cell-architecture
    name: Unmapped subcellular architecture
    response: >-
      "Human cells consist of a complex hierarchy of components, many of which
      remain unexplored." Existing cell mapping technologies have typically been
      applied separately; the gap addressed is the systematic, integrated
      measurement of multiple complementary modalities on a matched set of proteins
      in the same cellular context.

  - id: d4d:cm4ai-gap-ai-readiness
    name: Absence of AI-ready standards for biomedical data
    response: >-
      "AI-Readiness has been defined in multiple ways in the literature.
      Regardless of the specific definitions adopted, in all cases significant
      requirements are placed on the datasets used to train AI/ML models and on
      datasets analyzed using these AI/ML models." CM4AI addresses the absence of
      an operational standard by packaging every release with machine-readable
      provenance graphs, resolvable persistent identifiers, dataset schemas and
      data dictionaries using the FAIRSCAPE framework, and by publishing an
      explicit AI-readiness self-assessment alongside the data.

  - id: d4d:cm4ai-gap-quarterly-availability
    name: Delay between data generation and data availability
    response: >-
      The programme's quarterly release cadence exists so that map-input data
      streams become available to the community before the integrated cell maps
      are finished. Each release is explicitly interim and states that "Computed
      cell maps not included in this release".

