id: https://cm4ai.org/data-releases/
name: CM4AI Quarterly Data Release Programme
title: Cell Maps for Artificial Intelligence (CM4AI) - Quarterly Data Release Programme
description: >-
  The CM4AI data-release programme is the continuing quarterly series of AI-ready
  data releases produced by Cell Maps for Artificial Intelligence (CM4AI;
  cm4ai.org), the Functional Genomics Data Generation Project of the U.S. National
  Institutes of Health Bridge2AI program. The programme's stated commitment is to
  "deliver machine-readable hierarchical maps of cell architecture as AI-ready
  data, together with quarterly data releases of map-input data streams", and its
  release page states that "CM4AI releases data quarterly, ensuring continuous
  updates to the cell maps and input data streams". Each quarterly release is
  deposited as a separate, separately versioned dataset with its own DOI in the
  University of Virginia Dataverse (LibraData), under the Cell Maps for Artificial
  Intelligence collection within the School of Medicine.

  The map-input data streams are generated by three complementary mapping
  approaches applied to disease-relevant human cell lines under treated and
  untreated conditions: mass-spectrometry-based proteomics (affinity purification
  mass spectrometry, AP-MS, and size-exclusion chromatography mass spectrometry,
  SEC-MS), spatial proteomics by immunofluorescence cell imaging, and genetic
  perturbation via CRISPR/Cas9 (single-cell CRISPRi Perturb-seq). The cell lines
  under investigation are the triple-negative breast cancer line MDA-MB-468
  (RRID:CVCL_0419), treated with paclitaxel or vorinostat versus untreated, and
  the induced pluripotent stem cell line KOLF2.1J (RRID:CVCL_B5P3), undifferentiated
  versus differentiated to neural progenitor cells, neurons and cardiomyocytes.
  Output data are packaged with provenance graphs and rich metadata as AI-ready
  datasets in RO-Crate format using the FAIRSCAPE framework.

  CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham,
  Simon Fraser University, and the Hastings Center, as part of the NIH Bridge2AI
  program. Across the programme to date the project portal reports 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated,
  11,739 genes targeted and 21.4 TB of data volume.

  Four DOI-bearing quarterly releases are represented in `resources`: March 2025
  (doi:10.18130/V3/B35XWX), June 2025 (doi:10.18130/V3/F3TD5R), October 2025
  (doi:10.18130/V3/K7TGEM) and June 2026 (doi:10.18130/V3/HIGT4C), the current
  release. Releases are labelled Beta and are explicitly interim: the project
  states that data "will be regularly updated and augmented on a quarterly basis
  through the end of the project (November, 2026)".

license: https://creativecommons.org/licenses/by-nc-sa/4.0/
publisher: https://dataverse.lib.virginia.edu/
page: https://cm4ai.org/data-releases/
status: >-
  Active. Quarterly releases are continuing; the release page and the release
  metadata both state that the dataset will be regularly updated and augmented
  through the end of the project in November 2026. All releases to date are
  labelled Beta.
citation: >-
  Clark T, Parker J, Al Manir S, et al. Cell Maps for Artificial Intelligence:
  AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell Lines.
  bioRxiv 2024.05.21.589311; doi: https://doi.org/10.1101/2024.05.21.589311.
  The programme states that attribution is required to the copyright holders and
  the authors, and that any publications referencing these data or derived data
  products should cite the related publications as well as directly citing the
  data collection using the data citation shown on each release's page.
