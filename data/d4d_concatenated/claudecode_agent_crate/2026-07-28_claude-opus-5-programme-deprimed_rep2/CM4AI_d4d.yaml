instances:
  - id: https://cm4ai.org/d4d/instance/if-images
    name: Immunofluorescence images of protein subcellular localization
    description: >-
      Four-channel confocal immunofluorescence images of MDA-MB-468 cells,
      untreated or treated with paclitaxel or vorinostat, generated in the
      Lundberg Lab at Stanford University. Nuclei are stained with DAPI (blue
      channel), endoplasmic reticulum with a calreticulin antibody (yellow
      channel), microtubules with a tubulin antibody (red channel) and the
      protein of interest with its antibody (green channel). The March 2025
      release covers 563 proteins of interest; the June 2025, October 2025 and
      June 2026 releases cover 464 proteins of interest. Programme-level data
      insights on the CM4AI portal report 53,788 immunofluorescent images.
    instance_type: immunofluorescence confocal image
    data_topic: http://purl.obolibrary.org/obo/GO_0008104
    data_substrate: https://meshb.nlm.nih.gov/record/ui?ui=D005453
    counts: 53788

  - id: https://cm4ai.org/d4d/instance/protein-interactions
    name: Protein-protein interactions
    description: >-
      Protein-protein interaction measurements produced by size exclusion
      chromatography-mass spectrometry (SEC-MS) and, from the June 2026 release
      onward, by affinity purification mass spectrometry (AP-MS) on
      endogenously tagged cell lines. Programme-level data insights on the CM4AI
      portal report 1,374 protein interactions. The CM4AI preprint reports
      SEC-MS identification of 72 of 100 chromatin modifiers in MDA-MB-468
      cells, 52 of them integral components of protein complexes, PPI profiles
      of over a thousand complexes in MDA-MB-468 cells, and more than 700
      protein complexes in both parental KOLF2 iPSCs and differentiated neurons.
    instance_type: protein-protein interaction
    data_topic: http://purl.obolibrary.org/obo/NCIT_C18469
    data_substrate: https://meshb.nlm.nih.gov/record/ui?ui=D013058
    counts: 1374

  - id: https://cm4ai.org/d4d/instance/proteins-investigated
    name: Proteins investigated
    description: >-
      Programme-level data insights on the CM4AI portal report 7,023 total
      proteins investigated across the mapping modalities. The data-releases
      page states that the flagship curated datasets capture approximately 7,000
      proteins by SEC-MS for both the iPSC lineage and the TNBC conditions.
    instance_type: protein
    data_topic: http://edamontology.org/topic_0121
    counts: 7023

  - id: https://cm4ai.org/d4d/instance/genes-targeted
    name: Genes targeted by CRISPRi perturbation
    description: >-
      Programme-level data insights on the CM4AI portal report 11,739 genes
      targeted. The CRISPRi Perturbation Cell Atlas in KOLF2.1J human induced
      pluripotent stem cells maps transcriptional and fitness phenotypes
      associated with 11,739 targeted genes, described on the data-releases page
      as whole-genome perturb-seq of more than 11,000 genes. Earlier CM4AI work
      designed a CRISPR lentiviral library targeting 100 chromatin factors with
      6 guide RNAs per gene.
    instance_type: gene perturbation
    data_topic: http://www.ebi.ac.uk/efo/EFO_0008860
    data_substrate: https://meshb.nlm.nih.gov/record/ui?ui=D064113
    counts: 11739
    missing_information:
      - id: https://cm4ai.org/d4d/instance/genes-targeted/missing
        name: Embargoed perturb-seq payloads
        missing:
          - >-
            Raw perturb-seq sequence data for KOLF2.1J iPSCs (undifferentiated)
            and for MDA-MB-468 breast cancer cells (with and without treatment).
        why_missing:
          - >-
            Both are listed as Embargoed in the external data links of the
            October 2025 and June 2026 releases; some datasets are under
            temporary pre-publication embargo.

  - id: https://cm4ai.org/d4d/instance/cell-lines
    name: Source cell lines
    description: >-
      Two human cell lines are interrogated across the programme. MDA-MB-468
      (RRID:CVCL_0419) is a triple negative breast cancer cell line established
      from a metastatic site pleural effusion of a 51-year-old black female with
      a metastatic mammary adenocarcinoma, available from ATCC, extensively used
      to study triple-negative breast cancer and well characterized with
      transcriptomic, mutational profile and whole-genome sequencing data
      available. KOLF2.1J (RRID:CVCL_B5P3) is an induced pluripotent stem cell
      line derived from a healthy male Northern European donor, available from
      the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource for
      access by not-for-profit organizations via a simple MTA. Both are
      described as ethically sourced.
    instance_type: immortalised human cell line
    data_substrate: https://www.cellosaurus.org/CVCL_0419
    counts: 2

  - id: https://cm4ai.org/d4d/instance/experimental-conditions
    name: Cell states and treatment conditions
    description: >-
      MDA-MB-468 cells are profiled untreated (DMSO control) and treated with
      paclitaxel or vorinostat. KOLF2.1J iPSCs are profiled undifferentiated
      (parental) and as iPSC-derived neural progenitor cells, neurons and
      cardiomyocytes. AP-MS batches include an untagged parental control, ten
      chromatin modifier tagged cell lines and a positive control tagged line,
      in four biological replicates, with DMSO-treated samples as vehicle
      controls.
    instance_type: experimental condition
    data_substrate: https://www.cellosaurus.org/CVCL_B5P3

  - id: https://cm4ai.org/d4d/instance/crate-documented-entities
    name: Entities documented in the June 2026 release RO-Crate
    description: >-
      The release RO-Crate for doi:10.18130/V3/HIGT4C reports 53,877 documented
      datasets, 1,976 computations, 6 software instances, 20 schemas and 55,859
      total entities, with evi:totalContentSizeBytes 21,051,331,945,400 and
      declared formats .d, ".d directory group", .tsv, .xml, TSV, csv,
      executable, fastq.gz, h5, h5ad, image/jpeg, pdf and unknown. Only 8 of the
      55,859 entities carry checksums. This logical inventory is far larger than
      the 10 archives published on the Dataverse landing page because the bulk
      payloads are hosted externally.
    instance_type: RO-Crate entity
    counts: 55859

anomalies:
  - id: https://cm4ai.org/d4d/anomaly/incomplete-modality-overlap
    name: Incomplete overlap between modality protein sets
    anomaly_details:
      - >-
        Protein-protein interaction (SEC-MS), protein localization (IF imaging),
        and CRISPRi perturbSeq data interrogate sets of proteins which
        incompletely overlap.
      - >-
        Computed cell maps are not included in any release published to date,
        so the integrated product that the input streams are intended to
        support cannot yet be checked against them.

  - id: https://cm4ai.org/d4d/anomaly/sparse-checksums
    name: Sparse checksum coverage in release metadata
    anomaly_details:
      - >-
        The June 2026 release RO-Crate records checksums for only 8 of its
        55,859 entities; the accompanying AI-readiness self-assessment reports
        "0% of files have checksums (8/55859)" under its verifiability
        criterion. MD5 checksums are, however, published for every file on the
        Dataverse landing pages.

  - id: https://cm4ai.org/d4d/anomaly/inconsistent-size-statements
    name: Inconsistent size statements for the current release
    anomaly_details:
      - >-
        The June 2026 release RO-Crate states contentSize "19.9 TB" while its
        own evi:totalContentSizeBytes is 21,051,331,945,400 bytes; the CM4AI
        portal separately reports a programme-level data volume of 21.4 TB. The
        ten archives actually published on the Dataverse landing page sum to
        approximately 12.6 GB by their displayed per-file sizes.

  - id: https://cm4ai.org/d4d/anomaly/release-date-display
    name: Release date displayed inconsistently on the project website
    anomaly_details:
      - >-
        The CM4AI data-releases page labels doi:10.18130/V3/HIGT4C as the "June
        2026 Data Release (Beta)" but displays "Released on: June 17, 2025". The
        Dataverse citation metadata for the same DOI gives publication date
        2026-06-17, and the release files are stamped as published on 2026-06-17
        and 2026-07-15. The Dataverse metadata is treated as authoritative.

known_biases:
  - id: https://cm4ai.org/d4d/bias/cell-line-representation
    name: Cell-line-derived data do not represent population variation
    bias_type: representation_bias
    bias_description: >-
      Data in this release was derived from commercially available de-identified
      human cell lines, and does not represent all biological variants which may
      be seen in the population at large. This statement is repeated verbatim as
      the Potential Sources of Bias section of the June 2025, October 2025 and
      June 2026 releases and as rai:dataBiases in the release RO-Crate. It
      applies to every modality in every release, since all released data derive
      from the same two cell lines.
    mitigation_strategy: >-
      No mitigation is claimed in the release documentation beyond disclosure;
      the programme interrogates two distinct lineages (a triple-negative breast
      cancer line and an induced pluripotent stem cell line with three
      differentiated derivatives) rather than a single cellular context.

  - id: https://cm4ai.org/d4d/bias/targeted-protein-panels
    name: Targeted selection of proteins and genes
    bias_type: selection_bias
    bias_description: >-
      Coverage is deliberately targeted rather than unbiased. The programme
      centres on 100 chromatin modifiers and 100 metabolic enzymes involved in
      cancer, neuropsychiatric and cardiac disorders; spatial proteomics mapping
      covered 100 chromatin regulators in MDA-MB-468 cells with a further 500
      proteins pending significant hits from the genetic perturbation and PPI
      results; and the released IF image sets cover 563 proteins (March 2025) or
      464 proteins (later releases). Findings are therefore conditioned on the
      chosen protein and gene panels and on the antibody availability of the
      Human Protein Atlas resource.

known_limitations:
  - id: https://cm4ai.org/d4d/limitation/interim-release
    name: Interim release status
    limitation_type: scope_limitation
    limitation_description: >-
      This is an interim release. It does not contain predicted cell maps, which
      will be added in future releases.
    scope_impact: >-
      The integrated hierarchical cell maps that are the programme's headline
      deliverable are absent from every release published to date; each release
      carries the Beta label.
    recommended_mitigation: >-
      Follow the quarterly release series; data will be regularly updated and
      augmented through the end of the project in November 2026.

  - id: https://cm4ai.org/d4d/limitation/per-dataset-analysis
    name: Best suited to per-dataset bioinformatics analysis
    limitation_type: integration_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the
      individual datasets rather than of an integrated product, and requires
      domain expertise for meaningful analysis.
    scope_impact: >-
      Cross-modality integration must be performed by the user, and is
      complicated by the incomplete overlap between the protein sets
      interrogated by each modality.

  - id: https://cm4ai.org/d4d/limitation/embargo-and-completeness
    name: Incomplete final form and temporary embargoes
    limitation_type: coverage_limitation
    limitation_description: >-
      These data are not yet in completed final form. Some datasets are under
      temporary pre-publication embargo; protein-protein interaction (SEC-MS),
      protein localization (IF imaging), and CRISPRi perturbSeq data interrogate
      sets of proteins which incompletely overlap; and computed cell maps are
      not included in this release.
    scope_impact: >-
      Perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 breast cancer cells
      are marked Embargoed in the external data links of the October 2025 and
      June 2026 releases.

  - id: https://cm4ai.org/d4d/limitation/download-constraints
    name: Practical download constraints
    limitation_type: methodological_limitation
    limitation_description: >-
      Every release landing page carries the notice "The dataset is too large to
      download. Please select the files you need from the files table." The
      browser ZIP download limit is 953.7 MB, so the multi-gigabyte image
      archives must be retrieved individually or through the Data Access API.
    recommended_mitigation: >-
      Use the Dataverse Data Access API or a download manager with the package
      download URL for large files.

confidential_elements:
  - id: https://cm4ai.org/d4d/confidentiality/unrestricted
    name: Confidentiality of released content
    confidential_elements_present: false
    confidentiality_details:
      - >-
        The June 2026 release RO-Crate records confidentialityLevel
        "Unrestricted".
      - >-
        Every release records Human Subjects: No and De-identified Samples: Yes.
        CM4AI data are described as non-clinical, generated from tissue
        cultures, and considered to be de-identified as they cannot be matched,
        with current knowledge, to a human subject.

subpopulations:
  - id: https://cm4ai.org/d4d/subpopulations/none
    name: Human subpopulations
    subpopulation_elements_present: false
    identification:
      - >-
        The released data contain no human-participant subpopulations. The
        release RO-Crate records d4d:atRiskPopulations as "None - no human
        subjects involved; commercially sourced de-identified cell lines only."
      - >-
        The two source cell lines nevertheless carry documented donor
        characteristics: MDA-MB-468 was established from a metastatic pleural
        effusion of a 51-year-old black female with metastatic mammary
        adenocarcinoma, and KOLF2.1J was derived from a healthy male Northern
        European donor. These are properties of commercially available,
        de-identified immortalised lines rather than of enrolled participants.
    distribution:
      - >-
        Not applicable: the programme does not enrol human participants and
        reports no subpopulation distribution.

sensitive_elements:
  - id: https://cm4ai.org/d4d/sensitive/none
    name: Sensitive elements
    sensitive_elements_present: false
    sensitivity_details:
      - >-
        The release RO-Crate records humanSubjectResearch as "None - data
        collected from commercially available cell lines" and
        humanSubjectExemption as "Exempt - research with commercially available
        de-identified human cell lines does not constitute human subjects
        research."
      - >-
        CM4AI data are distinctive within Bridge2AI in that they are
        non-clinical (from tissue cultures) and are considered to be
        de-identified as they cannot be matched, with current knowledge, to a
        human subject.

relationships:
  - id: https://cm4ai.org/d4d/relationships/programme-structure
    name: Relationships between releases, modalities and provenance objects
    relationship_details:
      - >-
        Releases form a cumulative quarterly series: each quarterly release adds
        modalities and conditions to its predecessor. The March 2025 release
        carries perturb-seq in undifferentiated KOLF2.1J iPSCs, SEC-MS in the
        iPSC lineage and IF images of MDA-MB-468; June 2025 adds SEC-MS in
        treated and untreated MDA-MB-468 and RGB immunofluorescent images;
        October 2025 adds perturb-seq in MDA-MB-468 with and without treatment;
        and June 2026 adds AP-MS in treated MDA-MB-468.
      - >-
        Within the current release the top-level RO-Crate points to nine
        sub-crates, one per modality and condition, each declared isPartOf the
        release crate. These are EndoTag AP-MS (paclitaxel and vorinostat),
        Paclitaxel, Untreated and Vorinostat IF Images, SEC-MS characterization
        of KOLF2 neuronal and cardiomyocyte differentiation, SEC-MS of MDA-MB468
        following treatment, and the Perturbation Cell Atlas perturb-seq and raw
        sequence sub-crates. The AP-MS sub-crates are also declared part of a
        January 2026 release crate.
      - >-
        FAIRSCAPE decomposes each RO-Crate into its individual components -
        datasets, models, software - which are registered and assigned ARK
        persistent identifiers, and the server computes end-to-end entailments
        on each crate's provenance expressed in the EVI Evidence Graph Ontology
        and links them together where possible.
      - >-
        Dataverse-published archives are pointers to, not copies of, the bulk
        payloads: raw mass spectrometry data reside at MassIVE, raw perturb-seq
        sequences at the NCBI Sequence Read Archive, and the CRISPRi
        Perturbation Atlas of iPSCs at Figshare.

acquisition_methods:
  - id: https://cm4ai.org/d4d/acquisition/instrumented-measurement
    name: Direct instrumented measurement of cultured cell lines
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        All released data are generated directly by CM4AI laboratories from
        cultured, commercially sourced cell lines using mass spectrometry,
        confocal microscopy and single-cell sequencing instruments; no data are
        reported by or collected from human subjects.
      - >-
        Derived content is produced computationally: PPI networks and images are
        embedded and co-embedded by deep learning models and integrated by
        multi-resolution community detection in the MuSIC pipeline, and the
        CRISPRi Perturbation Cell Atlas reports transcriptional and fitness
        phenotypes derived from single-cell readouts.
      - >-
        The CRISPRi Perturbation Cell Atlas findings were validated via
        phenotypic, protein-interaction, and metabolic tracing assays.

collection_mechanisms:
  - id: https://cm4ai.org/d4d/collection/modalities
    name: Multimodal data acquisition mechanisms
    mechanism_details:
      - >-
        Affinity purification mass spectrometry (AP-MS) on endogenously tagged
        cell lines. CM4AI endogenously tagged 17 genes in MDA-MB-468 and
        acquired AP-MS data under three conditions (untreated, paclitaxel and
        vorinostat treated), with a further 34 genes in the process of being
        tagged. The EndoTag AP-MS submissions in the June 2026 release comprise
        raw AP-MS data from endogenously tagged MDA-MB-468 cells under
        paclitaxel or vorinostat perturbation, performed in four biological
        replicates, with each batch including an untagged parental control, ten
        chromatin modifier tagged cell lines and a positive control tagged line,
        and DMSO-treated samples serving as vehicle controls.
      - >-
        Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for
        proteome-wide complex and interaction mapping, performed on MDA-MB-468
        cells under three conditions and on KOLF2 iPSCs and their derivatives,
        in the Nevan Krogan laboratory at the University of California San
        Francisco.
      - >-
        Immunofluorescence (IF) subcellular microscopy for spatial proteomics,
        using the Human Protein Atlas resource of antibodies, with automated
        fixation and permeabilization protocols established for a pipetting
        robot for the MDA-MB-468 and KOLF2 cell lines, performed in the Lundberg
        Lab at Stanford University. Imaging is by immunofluorescence-based
        staining (ICC-IF) and confocal microscopy in four channels.
      - >-
        Single-cell CRISPR perturbation screens. A CRISPR lentiviral library
        targeting 100 chromatin factors with 6 guide RNAs per gene was designed;
        MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were
        generated and characterized; and single-cell CRISPR screens of 100
        chromatin regulators with and without drug in MDA-MB-468 cells and in
        undifferentiated KOLF2.1J iPSCs were performed using the 10x Genomics
        3'HT kit. The genome-scale CRISPRi Perturbation Cell Atlas covers 11,739
        targeted genes.
      - >-
        The release RO-Crate summarises the collection types as "Perturb-seq; IF
        imaging; SEC-MS; AP-MS".

sampling_strategies:
  - id: https://cm4ai.org/d4d/sampling/targeted-panels
    name: Targeted panel sampling within two cell lines
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        MDA-MB-468 (RRID:CVCL_0419), obtained from ATCC.
      - >-
        KOLF2.1J (RRID:CVCL_B5P3), obtained from the Human Induced Pluripotent
        Stem Cells Initiative (HipSci) resource.
    strategies:
      - >-
        Multimodal interrogation of 100 chromatin modifiers and 100 metabolic
        enzymes involved in cancer, neuropsychiatric and cardiac disorders,
        under perturbed and unperturbed conditions.
      - >-
        Spatial proteomics mapping of 100 chromatin regulators in MDA-MB-468
        cells with and without paclitaxel or vorinostat, with another 500
        proteins pending significant hits from the genetic perturbation and PPI
        results; released IF image sets cover 563 proteins (March 2025) or 464
        proteins (later releases).
      - >-
        Genome-scale CRISPRi perturbation of 11,739 targeted genes in KOLF2.1J
        iPSCs, and targeted screens of 100 chromatin regulators in MDA-MB-468
        cells under three conditions.
      - >-
        Proteome-wide SEC-MS, which identified 72 of the 100 chromatin modifiers
        in MDA-MB-468 cells and mapped over a thousand complexes proteome-wide.
    why_not_representative:
      - >-
        Data in this release was derived from commercially available
        de-identified human cell lines, and does not represent all biological
        variants which may be seen in the population at large.

data_collectors:
  - id: https://cm4ai.org/d4d/collector/lundberg-lab
    name: Lundberg Lab, Stanford University
    role: Spatial proteomics and immunofluorescence imaging
    collector_details:
      - >-
        Generated the immunofluorescence image data displaying spatial
        localization of proteins of interest in MDA-MB-468 cells, imaged by
        ICC-IF staining and confocal microscopy. Named on the IF sub-crates as
        Hansen JN, Axelsson U, Johannesson A, Fall J, Ballllosera Navarro F and
        Lundberg E.

  - id: https://cm4ai.org/d4d/collector/krogan-lab
    name: Krogan Laboratory, University of California San Francisco
    role: Mass spectrometry proteomics
    collector_details:
      - >-
        Generated the SEC-MS data on undifferentiated KOLF2.1J iPSCs and their
        derivatives and on MDA-MB468 cells following treatment with vorinostat
        or paclitaxel. The SEC-MS sub-crates name Antoine Forget as author, and
        the treated-cancer-cell sub-crate names Forget A, Obernier K and Krogan
        N.

  - id: https://cm4ai.org/d4d/collector/apms-generator
    name: Richa Tiwari
    role: AP-MS data generation
    collector_details:
      - >-
        Named as the author of both EndoTag AP-MS sub-crates in the June 2026
        release RO-Crate, covering chromatin modifier interactome rewiring in
        MDA-MB-468 cells under paclitaxel and under vorinostat perturbation.
        This attribution appears only in the release RO-Crate; the Dataverse
        landing pages and CM4AI publications do not name an AP-MS data
        generator.

  - id: https://cm4ai.org/d4d/collector/data-acquisition-module
    name: CM4AI Data Acquisition Module
    role: Coordination of multimodal data generation
    collector_details:
      - >-
        The Data Acquisition Module completed parallel maps of protein-protein
        interactions, protein subcellular distributions and transcriptional
        states associated with a near-comprehensive set of chromatin regulators
        encoded by the human genome, all generated in ethically sourced breast
        cancer cells and extended to ethically sourced human induced pluripotent
        stem cells.

  - id: https://cm4ai.org/d4d/collector/standards-module
    name: CM4AI Standards Module, University of Virginia
    role: AI-readiness packaging and provenance capture
    collector_details:
      - >-
        Responsible for AI-Readiness packaging of data, software, metadata and
        provenance graphs using the FAIRSCAPE framework, which established FAIR
        AI-Readiness metadata and validation toolkits used to package and
        release the cell-line perturbation and measurement data.

collection_timeframes:
  - id: https://cm4ai.org/d4d/timeframe/programme
    name: Programme data collection timeframe
    start_date: "2022-09-01"
    end_date: "2026-06-01"
    timeframe_details:
      - >-
        The June 2026 release RO-Crate records rai:dataCollectionTimeframe as
        9/1/2022 to 6/1/2026.
      - >-
        NIH RePORTER records the CM4AI project start as 2022-09-01 and project
        end as 2026-08-31; the release maintenance plan states that data will be
        updated and augmented through the end of the project in November 2026.
      - >-
        Individual releases record a data creation date and deposit date of
        2025-02-27 in their Dataverse citation metadata, which is carried
        forward unchanged from the March 2025 release to the June 2026 release.

direct_collection:
  - id: https://cm4ai.org/d4d/direct-collection/first-party
    name: First-party generation from purchased cell lines
    is_direct: true
    collection_details:
      - >-
        Data are generated directly by CM4AI laboratories from cell lines
        obtained from ATCC (MDA-MB-468) and the HipSci resource (KOLF2.1J);
        there is no third-party data subject from whom data are collected.
      - >-
        A subset of released content is derived rather than measured: PPI
        networks are downloaded from the Krogan Laboratory's deposition archive
        and IF images from the Lundberg Laboratory's deposition archive into the
        MuSIC pipeline for embedding and integration.

missing_data_documentation:
  - id: https://cm4ai.org/d4d/missing-data/programme
    name: Documented missing and incomplete data
    missing_data_patterns:
      - >-
        Some datasets are under temporary pre-publication embargo.
      - >-
        Protein-protein interaction (SEC-MS), protein localization (IF imaging),
        and CRISPRi perturbSeq data interrogate sets of proteins which
        incompletely overlap.
      - >-
        Computed cell maps not included in this release.
    missing_data_causes:
      - >-
        Pre-publication embargo pending associated manuscripts; the release
        pages mark perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 cells as
        Embargoed.
      - >-
        Modality-specific technical coverage: each assay interrogates a
        different subset of the proteome, and the imaging modality is bounded by
        antibody availability in the Human Protein Atlas resource.
      - >-
        Sequencing of the map production pipeline: integrated cell maps are a
        later deliverable of the programme and are announced for future
        releases.
    handling_strategy: >-
      The incompleteness is disclosed in a dedicated Completeness section on
      every release landing page and repeated as rai:dataCollectionMissingData
      in the release RO-Crate, rather than being imputed or concealed.

