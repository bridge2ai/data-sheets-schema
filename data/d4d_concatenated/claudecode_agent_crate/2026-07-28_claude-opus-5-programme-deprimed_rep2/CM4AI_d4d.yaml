      Dataset licensed for reuse under the Creative Commons
      Attribution-NonCommercial-ShareAlike 4.0 International license
      (https://creativecommons.org/licenses/by-nc-sa/4.0/). Every release
      records "CC BY-NC-SA 4.0" as its License/Data Use Agreement.
    - >-
      Attribution is required to the copyright holders and the authors. Any
      publications referencing this data or derived data products should cite
      the Related Publications, as well as directly citing the data collection.
    - >-
      Copyright (c) 2026 The Regents of the University of California except
      where otherwise noted; spatial proteomics raw image data is copyright (c)
      2026 The Board of Trustees of the Leland Stanford Junior University. The
      March 2025 release states the same holders with year 2025.
    - >-
      Dataverse community norms as well as good scientific practices expect that
      proper credit is given via citation, using the data citation shown on the
      dataset page.
    - >-
      Licensing is not uniform below the release level. The June 2026 release
      RO-Crate records CC0 1.0 for the two EndoTag AP-MS sub-crates and for the
