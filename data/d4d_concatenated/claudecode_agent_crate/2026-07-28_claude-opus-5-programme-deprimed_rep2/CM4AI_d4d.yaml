purposes:
  - id: https://cm4ai.org/d4d/purpose/ai-ready-cell-architecture-maps
    name: Deliver AI-ready maps of human cell architecture
    response: >-
      CM4AI's objective is to deliver machine-readable hierarchical maps of cell
      architecture as AI-Ready data produced from multimodal interrogation of
      100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
      neuropsychiatric and cardiac disorders in disease-relevant cell lines
      under perturbed and unperturbed conditions, utilizing state-of-the-art
      mass spectrometry based proteomics, spatial proteomics / cell imaging, and
      genetic perturbations using CRISPR. Its overarching mission is to produce
      ethical, AI-ready datasets of cell architecture, inferred from multimodal
      data collected for human cell lines, to enable transformative biomedical
      AI research.

  - id: https://cm4ai.org/d4d/purpose/interpretable-genotype-phenotype-learning
    name: Enable interpretable genotype-phenotype learning
    response: >-
      As part of the NIH Common Fund's Bridge2AI program, the CM4AI data
      generation project seeks to map the spatiotemporal architecture of human
      cells and use these maps toward the grand challenge of interpretable
      genotype-phenotype learning. In genomics and precision medicine, machine
      learning models are often "black boxes", predicting phenotypes from
      genotypes without understanding the mechanisms by which such translation
      occurs; these data are intended to broadly stimulate research and
      development in "visible" machine learning systems informed by multi-scale
      cell and tissue architecture.

  - id: https://cm4ai.org/d4d/purpose/quarterly-release-series
    name: Sustain a quarterly series of map-input data releases
    response: >-
      CM4AI delivers machine-readable hierarchical maps of cell architecture as
      AI-ready data "together with quarterly data releases of map-input data
      streams". The release series is maintained on a quarterly cadence and will
      be regularly updated and augmented through the end of the project in
      November 2026, with long-term preservation in the University of Virginia
      Dataverse.

tasks:
  - id: https://cm4ai.org/d4d/task/three-mapping-approaches
    name: Three complementary mapping approaches
    response: >-
      The project launches a coordinated effort involving three complementary
      mapping approaches - proteomic mass spectrometry, cellular imaging, and
      genetic perturbation via CRISPR/Cas9 - creating a library of large-scale
      maps of cellular structure/function across demographic and disease
      contexts.

  - id: https://cm4ai.org/d4d/task/ai-readiness-standards
    name: Establish an AI-readiness standards framework
    response: >-
      The project implements a standards data management approach based on FAIR
      access and software principles, with deep provenance and replication
      packages for representation of cell maps and their underlying datasets.
      AI-readiness features comprise establishing FAIRness including rich
      metadata and persistent globally unique identifiers; computing a
      machine-readable provenance graph resolvable as metadata for all results
      including inputs, computations, software and outputs; and characterizing
      and validating all datasets and data elements, mapping data elements to
      public ontology vocabularies where appropriate using JSON-Schema
      mini-data-dictionary descriptions resolvable from the provenance graph
      metadata.

  - id: https://cm4ai.org/d4d/task/ethics-and-workforce
    name: Ethical AI research programme and workforce development
    response: >-
      The project initiates a research program in ethical AI, especially as it
      relates to how maps will be used in genomic medicine and model
      interpretation, and stimulates a diverse portfolio of training
      opportunities in the emerging field of biomachine learning.

addressing_gaps:
  - id: https://cm4ai.org/d4d/gap/black-box-models
    name: Opacity of genotype-phenotype machine learning models
    response: >-
      Machine learning models show great promise in analyzing the human genome
      to make predictions, but the inner workings of these models are typically
      difficult-to-interpret "black boxes". This Bridge2AI data generation
      project generates a resource of matched data and tools to enable the
      creation of "visible" ML systems, which are not black boxes but are built
      directly on knowledge maps of cell and tissue architecture.

  - id: https://cm4ai.org/d4d/gap/uncharted-cell-architecture
    name: Incomplete knowledge of subcellular organisation
    response: >-
      Cell maps are hierarchical directed acyclic graphs whose nodes are
      assemblies of proteins in proximity at a given scale, spanning from large
      assemblies representing cell compartments such as nucleus and mitochondria
      to small assemblies such as protein complexes or subunits. Much of cell
      architecture remains uncharted, and cell maps provide a foundation for
      downstream applications in human genomics including interpretation of
      genetic variants and mutations.

  - id: https://cm4ai.org/d4d/gap/ai-ready-data-scarcity
    name: Scarcity of ethically packaged, fully provenanced AI-ready biomedical data
    response: >-
      CM4AI defines AI-Ready biomedical data as fully characterized FAIR data of
      known provenance which can be ethically and reliably processed by AI
      applications, whose models and software are available and well-described
      for validation and re-use, and whose predictions may be fully explained
      and interpreted to the user as needed. The criteria adopted are FAIR,
      Provenanced, Characterized, Explainable and Ethical, and they are
      interdependent: ethical validation capability depends upon explainability,
      explainability depends upon provenance, and so forth. CM4AI addresses the
      gap by packaging outputs with provenance graphs and rich metadata using an
      extended client-server version of the FAIRSCAPE framework.

  - id: https://cm4ai.org/d4d/gap/workforce
    name: Training gaps in the functional genomics and biomedical AI/ML workforce
    response: >-
      The Skills and Workforce Development module identified gaps in training of
      the functional genomic and biomedical AI/ML workforce and works to recruit
      and prepare a biomedical workforce adept at both the data and life
      sciences, using asynchronous virtual training, hosted virtual events and
      an in-person internship co-hosted at Yale University and the University of
      California San Diego.

