machine_annotation_tools:
  - id: https://cm4ai.org/d4d/tools/music-and-fairscape
    name: Software used to derive and package CM4AI data
    tools:
      - node2vec
      - Human Protein Atlas image embedding model
      - Contrastive multimodal co-embedding model
      - Multiscale community detection
      - Large language model assembly naming pipeline
      - Integrative Modeling Platform (IMP) v2.18
      - FAIRSCAPE-CLI and FAIRSCAPE server
    tool_descriptions:
      - >-
        node2vec is used to reduce the dimensionality of downloaded PPI networks
        into a PPI embedding capturing each protein's interaction neighbourhood.
      - >-
        A Human Protein Atlas deep learning model reduces IF images to an image
        embedding capturing protein localization.
      - >-
        A contrastive deep learning model integrates the PPI and image
        embeddings into per-protein co-embeddings such that the original
        embeddings can be reconstructed with minimal information loss.
      - >-
        Community detection on all-by-all co-embedding similarities produces the
        hierarchy of protein communities output as the final cell map.
      - >-
        A large language model approach developed by the project names sets of
        proteins and assigns a name confidence score during hierarchy
        evaluation.
      - >-
        The Integrative Modeling Platform version 2.18, scripted through the
        Python Modeling Interface package, is used for integrative structure
        modeling of top-ranked MuSIC communities.
      - >-
        FAIRSCAPE-CLI (client) and the FAIRSCAPE server (both Python 3,
        pip-installable, MIT licensed) create RO-Crate packages, assign ARK
        persistent identifiers and compute EVI provenance entailments. The June
        2026 release crate documents 6 software instances and 1,976
        computations.

existing_uses:
  - id: https://cm4ai.org/d4d/existing-use/codefest-and-training
    name: Training and community use
    examples:
      - >-
        Initial datasets, tools and standards associated with all three parallel
        mapping platforms were released publicly on the CM4AI web portal and
        made available at the CM4AI CodeFest in March 2024, accompanied by
        detailed tutorials explaining how the data were derived and integrated
        and providing production-ready software for producing the datasets. The
        inaugural virtual CodeFest trained 38 registrants.
      - >-
        As of capture, the Dataverse landing pages record 302 downloads for the
        March 2025 release, 256 for the June 2025 release, 405 for the October
        2025 release and 181 for the June 2026 release; no citations were found
        for any release through Crossref/DataCite Make Data Count.

  - id: https://cm4ai.org/d4d/existing-use/visible-machine-learning
    name: Visible machine learning precedents cited by the programme
    examples:
      - >-
        Cell maps have been used in AI tools for "visible machine learning" or
        "visible neural networks" to interrogate how protein assemblies in the
        cell affect cell-level phenotype predictions. The release RO-Crate names
        Ma et al. 2018 (PMID 29505029) and Kuenzi et al. 2020 (PMID 33096023) as
        examples of the biologically driven interpretable ML applications the
        data are intended to enable.

use_repository:
  - id: https://cm4ai.org/d4d/use-repository/libradata
    name: LibraData Cell Maps for Artificial Intelligence collection
    repository_url: https://dataverse.lib.virginia.edu/
    repository_details:
      - >-
        Quarterly releases are deposited in the "Cell Maps for Artificial
        Intelligence" collection under University of Virginia Dataverse >
        LibraData: UVa's Scholarly Research > School of Medicine. Dataverse
        exposes each release through OAI_ORE, DataCite, OpenAIRE, Schema.org
        JSON-LD, DDI Codebook v2, Dublin Core, DDI HTML Codebook and JSON
        metadata exports; the October 2025 and June 2026 releases additionally
        offer a Croissant export.
      - >-
        Products, tools and documentation are additionally disseminated through
        the CM4AI web portal at https://cm4ai.org/, built on the U-BRITE
        platform.

other_tasks:
  - id: https://cm4ai.org/d4d/other-task/downstream
    name: Further tasks the data can support
    task_details:
      - >-
        Interpretation of genetic variants and mutations in human genomics using
        hierarchical cell maps as a structural prior.
      - >-
        Analysis of cell architectural changes and interactions in the presence
        of specific disease processes, treatment conditions or genetic
        perturbations.
      - >-
        Investigation of the impact of chemotherapy treatment on the proteome:
        SEC-MS detected PPI profiles of over a thousand complexes in MDA-MB-468
        cells with thousands of proteins exhibiting differential elution
        profiles between control and paclitaxel or vorinostat treated cells.
      - >-
        Study of protein complex reorganisation during iPSC differentiation into
        neural progenitor cells, neurons and cardiomyocytes.

future_use_impacts:
  - id: https://cm4ai.org/d4d/future-impact/interim-status
    name: Consequences of the interim release status
    impact_details:
      - >-
        Data presented here will be augmented regularly through the end of the
        project; consumers of any single release should expect its scope to be
        superseded by later quarterly releases.
      - >-
        Predicted cell maps will be added in future releases, so analyses built
        on the current input-stream-only releases may need revisiting once the
        integrated maps are published.
      - >-
        Software packages are versioned as the project progresses and the
        version used to produce each dataset is referenced in the dataset's
        metadata, so reproductions should pin the recorded software versions.
      - >-
        The CM4AI collection and the project website both carry the notice "This
        repository is under review for potential modification in compliance with
        Administration directives", indicating that availability of the
        collection may change.

discouraged_uses:
  - id: https://cm4ai.org/d4d/discouraged/clinical-and-unassisted
    name: Discouraged uses
    discouragement_details:
      - >-
        These laboratory data are not to be used in clinical decision-making or
        in any context involving patient care without appropriate regulatory
        oversight and approval.
      - >-
        Use without domain expertise is discouraged: the release documentation
        states that the data require domain expertise for meaningful analysis
        and that the current release is most suitable for bioinformatics
        analysis of the individual datasets.
      - >-
        Treating the data as representative of population-level biological
        variation is discouraged, since all data derive from commercially
        available de-identified human cell lines.

intended_uses:
  - id: https://cm4ai.org/d4d/intended-use/ai-ready-functional-genomics
    name: Intended uses stated by the programme
    examples:
      - >-
        AI-ready datasets to support research in functional genomics.
      - >-
        AI model training.
      - >-
        Cellular process analysis.
      - >-
        Cell architectural changes and interactions in presence of specific
        disease processes, treatment conditions, or genetic perturbations.
      - >-
        Enabling biologically-driven, interpretable machine learning
        applications, for example as proposed in Ma et al. 2018 (PMID 29505029)
        and Kuenzi et al. 2020 (PMID 33096023).
    usage_notes: >-
      The Intended Use list is stated identically on the June 2025, October 2025
      and June 2026 release pages and repeated as rai:dataUseCases in the
      release RO-Crate, with the interpretable-ML goal added only in the crate.
    use_category:
      - research
      - machine learning model training
      - non-commercial use

prohibited_uses:
  - id: https://cm4ai.org/d4d/prohibited/clinical-use
    name: Clinical decision-making and patient care
    prohibition_reason:
      - >-
        These laboratory data are not to be used in clinical decision-making or
        in any context involving patient care without appropriate regulatory
        oversight and approval. This statement appears as the Prohibited Uses
        section of every release page from June 2025 onward and as both
        usageInfo and prohibitedUses in the release RO-Crate.

  - id: https://cm4ai.org/d4d/prohibited/unlicensed-commercial-use
    name: Commercial use without a separate licence
    prohibition_reason:
      - >-
        Data packages are licensed under Creative Commons CC BY-NC-SA 4.0 terms,
        which exclude commercial use. Commercial use requires a separate license
        negotiation with the copyright holder - UCSD, Stanford and/or UCSF
        depending upon the specific data package in question - and a Data Access
        Committee supervises ethical matters related to dataset distribution and
        potential dual licensing for commercial use.

distribution_formats:
  - id: https://cm4ai.org/d4d/distribution/access-points
    name: Distribution access points
    access_urls:
      - https://doi.org/10.18130/V3/HIGT4C
      - https://doi.org/10.18130/V3/K7TGEM
      - https://doi.org/10.18130/V3/F3TD5R
      - https://doi.org/10.18130/V3/B35XWX
      - https://cm4ai.org/data-releases/
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676
      - ftp://massive-ftp.ucsd.edu/v10/MSV000098237/
    description: >-
      Releases are distributed as ZIP archives and JSON/HTML metadata documents
      from the University of Virginia Dataverse, with bulk raw payloads served
      from MassIVE, the NCBI Sequence Read Archive and Figshare. The release
      RO-Crate declares the formats present across the documented entities as
      .d, ".d directory group", .tsv, .xml, TSV, csv, executable, fastq.gz, h5,
      h5ad, image/jpeg, pdf and unknown. Dataverse offers a Data Access API for
      programmatic retrieval and a package download URL under
      https://dataverse.lib.virginia.edu/api/access/datafile/ for files too
      large for browser download.

distribution_dates:
  - id: https://cm4ai.org/d4d/distribution-dates/release-series
    name: Quarterly release dates
    release_dates:
      - "May 2024 Data Release (listed in the CM4AI release archive; earlier CM4AI data are cited as doi:10.18130/V3/DXWOS5, University of Virginia Dataverse V1)"
      - "2025-03-03 - March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX"
      - "2025-07-01 - June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R"
      - "2025-10-31 - October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM"
      - "2026-06-17 - June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C; immunofluorescence archives added 2026-07-15"
    description: >-
      CM4AI releases data quarterly, ensuring continuous updates to the cell
      maps and input data streams. The release archive on cm4ai.org lists a May
      2024 Data Release alongside the March 2025, June 2025 and October 2025
      releases; the June 2026 release is presented as the latest.

third_party_sharing:
  - id: https://cm4ai.org/d4d/third-party-sharing/external-repositories
    name: Sharing with external repositories
    is_shared: true
    description: >-
      Beyond the University of Virginia Dataverse, CM4AI deposits raw mass
      spectrometry data in MassIVE, raw perturb-seq sequences in the NCBI
      Sequence Read Archive, and the CRISPRi Perturbation Atlas of iPSCs in
      Figshare. RO-Crate packages are registered with the FAIRSCAPE service,
      which issues ARK identifiers and hosts resolvable metadata landing pages.
      The project also collaborates with the NIH Common Fund Data Ecosystem for
      data curation.

