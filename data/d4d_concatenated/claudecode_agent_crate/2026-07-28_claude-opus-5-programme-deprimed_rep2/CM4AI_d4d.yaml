id: https://cm4ai.org/
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI) - quarterly data-release programme
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data
  Generation Project of the U.S. National Institutes of Health Bridge2AI program.
  This datasheet describes the CM4AI data-release programme as an ongoing
  quarterly release series rather than any single release: CM4AI states that it
  "will deliver machine-readable hierarchical maps of cell architecture as
  AI-ready data, together with quarterly data releases of map-input data
  streams", and each quarterly release is represented here as a separate
  resource carrying its own DOI, version, publication date and file inventory.

  The programme's objective is to map the spatiotemporal architecture of human
  cells and apply those maps to the grand challenge of interpretable
  genotype-phenotype learning. It interrogates chromatin modifiers, metabolic
  enzymes and other proteins implicated in cancer, neuropsychiatric and cardiac
  disorders in disease-relevant human cell lines under treated and untreated
  conditions, using three complementary mapping approaches: mass
  spectrometry-based proteomics (AP-MS and SEC-MS), spatial proteomics /
  immunofluorescence cell imaging, and genetic perturbation via CRISPR/Cas9
  (single-cell CRISPRi perturb-seq). The cell lines under investigation are the
  triple-negative breast cancer line MDA-MB-468 (RRID:CVCL_0419), treated with
  paclitaxel or vorinostat versus untreated, and the induced pluripotent stem
  cell line KOLF2.1J (RRID:CVCL_B5P3), undifferentiated versus differentiated
  into neural progenitor cells, neurons and cardiomyocytes.

  Input data streams are integrated by the Multi-Scale Integrated Cell (MuSIC)
  software pipeline using deep-learning embeddings and multi-resolution
  community detection, and outputs are packaged with provenance graphs and rich
  metadata as AI-ready RO-Crate datasets using an extended client-server version
  of the FAIRSCAPE framework. CM4AI is organised into three pillars (Data,
  People, Ethics) across six modules: Data Acquisition, Tools, Standards, Skills
  and Workforce Development, Teaming, and Ethics. It is a collaboration of UCSD,
  UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University
  and the Hastings Center.

  Releases are published in LibraData, the University of Virginia's Dataverse
  instance and an NIH-approved generalist repository, within the "Cell Maps for
  Artificial Intelligence" collection (University of Virginia Dataverse >
  LibraData > School of Medicine). The Dataverse landing pages publish a
  comparatively small set of processed and metadata archives; the bulk raw
  proteomics and sequencing payloads are deposited in external repositories
  (MassIVE, NCBI SRA, Figshare) and referenced from the release RO-Crate. All
  releases to date are labelled Beta and carry the same CC BY-NC-SA 4.0 licence,
  the same 47-author roster, and the same governance, ethics, completeness,
  intended-use, limitation and bias statements; the file inventory, modality
  coverage and version metadata differ between releases. The current release is
  the June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C.

  The programme's data are non-clinical: they are generated from commercially
  available, de-identified immortalised human cell lines and are documented as
  not constituting human subjects research.
