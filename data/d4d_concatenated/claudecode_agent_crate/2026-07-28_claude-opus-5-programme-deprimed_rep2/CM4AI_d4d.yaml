  contact_person: https://orcid.org/0000-0002-1708-8454

ip_restrictions:
  id: https://cm4ai.org/d4d/ip/commercial-licensing
  name: Intellectual property and commercial licensing restrictions
  restrictions:
    - >-
      Copyright in the datasets is held by the Regents of the University of
      California except where otherwise indicated; raw image data for spatial
      proteomics is copyright by The Board of Trustees of the Leland Stanford
      Junior University.
    - >-
      Commercial use requires a separate license negotiation with the copyright
      holder (UCSD, Stanford, and/or UCSF depending upon the specific data
      package in question).
    - >-
      A Data Access Committee supervises ethical matters related to dataset
      distribution and potential dual licensing for commercial use. The ethics
      plan balances the openness of the data produced with protection of
      intellectual property and supervision and monitoring of potential efforts
      at commercialization.

regulatory_restrictions:
  id: https://cm4ai.org/d4d/regulatory/governance
  name: Regulatory and governance restrictions
  regulatory_restrictions:
    - >-
      Every release records FDA Regulated: No.
    - >-
      Every release records Human Subjects: No and De-identified Samples: Yes;
      the release RO-Crate records the exemption "Exempt - research with
      commercially available de-identified human cell lines does not constitute
      human subjects research."
    - >-
      The KOLF2.1J cell line is available for access by not-for-profit
      organizations via a simple MTA, a restriction attaching to the source
      material rather than to the released data.
  hipaa_compliant: not_applicable
  other_compliance:
    - >-
      The Bridge2AI Ethics Working Group, supported by the CM4AI Ethics Pillar,
      developed a Code of Conduct outlining basic requirements for participants
      in the Bridge2AI Open House to access B2AI data (including CM4AI
      datasets), to which they must attest and commit prior to accessing the
      data.
    - >-
      Both the CM4AI collection in Dataverse and the CM4AI website carry the
      notice "This repository is under review for potential modification in
      compliance with Administration directives."
  confidentiality_level: unrestricted
  governance_committee_contact: https://orcid.org/0000-0003-4535-3486

ethical_reviews:
  - id: https://cm4ai.org/d4d/ethical-review/release-review
    name: CM4AI ethical review of the data releases
    contact_person: https://orcid.org/0000-0002-7080-8801
    reviewing_organization: https://cm4ai.org/d4d/org/cm4ai-ethics-module
    review_details:
      - >-
        Ethical review for every release from June 2025 onward is recorded as
        Vardit Ravitsky (ravitskyv@thehastingscenter.org) and Jean-Christophe
        Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca); the release
        RO-Crate repeats this in its ethicalReview field.
      - >-
        The Ethics team worked closely with the Data Acquisition, Tools and
        Standards Modules to develop a plan for ethical preparation, licensing,
        dissemination and Data Access supervision of CM4AI datasets, balancing
        openness with protection of intellectual property and supervision of
        potential commercialization.
      - >-
        The Ethics team employs a methodology inspired by Value-Sensitive Design
        (VSD), creating an axiological repository of values to guide design
        standards and expectations, and is formulating the CM4AI Life Cycle, a
        framework elucidating governance milestones throughout data generation
        and AI system development.
      - >-
        The Ethics Pillar established guidelines addressing socio-ethical
        challenges and supported the Bridge2AI Ethics Working Group in
        developing a Code of Conduct for access to Bridge2AI data.

  - id: https://cm4ai.org/d4d/ethical-review/data-governance-committee
    name: CM4AI Data Governance Committee
    contact_person: https://orcid.org/0000-0003-4535-3486
    review_details:
      - >-
        Every release from June 2025 onward records the Data Governance
        Committee as Jillian Parker (jillianparker@health.ucsd.edu); the release
        RO-Crate records the same role as "Jilian Parker".
      - >-
        A Data Access Committee supervises ethical matters related to dataset
        distribution and potential dual licensing for commercial use.

data_protection_impacts:
  - id: https://cm4ai.org/d4d/data-protection/assessment
    name: Data protection posture
    impact_details:
      - >-
        The release RO-Crate records confidentialityLevel "Unrestricted", and
        every release records De-identified Samples: Yes and Human Subjects: No.
      - >-
        CM4AI data are described as non-clinical, coming from tissue cultures,
        and considered to be de-identified as they cannot be matched, with
        current knowledge, to a human subject; ethical conditions adopted by the
        programme include protection of human subjects data and licensing and
        distribution of data, software and models with openness to the
        scientific community consistent with protection of human subjects
        privacy.

human_subject_research:
  id: https://cm4ai.org/d4d/human-subjects/exempt
  name: Human subject research status
  involves_human_subjects: false
  irb_approval:
    - >-
      The release RO-Crate records humanSubjectExemption: "Exempt - research
      with commercially available de-identified human cell lines does not
      constitute human subjects research."
    - >-
      No IRB protocol identifier is stated for the data releases in the
      documentation or the release RO-Crate.
  ethics_review_board:
    - >-
      Ethical review by Vardit Ravitsky (The Hastings Center) and
      Jean-Christophe Belisle-Pipon (Simon Fraser University).
    - >-
      Data governance by the CM4AI Data Governance Committee, contact Jillian
      Parker, University of California San Diego.
  special_populations:
    - >-
      None. The release RO-Crate records d4d:atRiskPopulations as "None - no
      human subjects involved; commercially sourced de-identified cell lines
      only."
  regulatory_compliance:
    - >-
      FDA Regulated: No.
    - >-
      Human Subjects: No; De-identified Samples: Yes.
    - >-
      Cell lines are described as ethically sourced: MDA-MB-468 from ATCC and
      KOLF2.1J from the HipSci resource, the latter available to not-for-profit
      organizations via a simple MTA.

informed_consent:
  - id: https://cm4ai.org/d4d/consent/not-applicable
    name: Informed consent status
    description: >-
      The release RO-Crate records d4d:informedConsent as "Not applicable - data
      collected from commercially available de-identified human cell lines
      (KOLF2.1J iPSC and MDA-MB-468). No primary human subjects research
      conducted under this release."
    consent_documentation:
      - >-
        No consent documentation is associated with the releases because no
        primary human subjects research is conducted; the source cell lines are
        commercially available and de-identified.
    consent_scope:
      - >-
        Not applicable at the level of the data releases. Consent
        considerations attach upstream to the establishment of the MDA-MB-468
        and KOLF2.1J lines, which the programme describes as ethically sourced.

at_risk_populations:
  id: https://cm4ai.org/d4d/at-risk/none
  name: At-risk populations
  at_risk_groups_included: false
  special_protections:
    - >-
      The release RO-Crate records d4d:atRiskPopulations as "None - no human
      subjects involved; commercially sourced de-identified cell lines only."
    - >-
      Programme-level protections nevertheless apply to the ethical framing of
      the data: ethical conditions include ethical treatment of subjects
      including protection of human subjects data, proper non-biasing data
      analysis, scientific integrity of methods, full documentation of
      scientific methods and reagents, and anticipating potential applications
      of the data and derived AI/ML systems so as to optimize benefits and
      mitigate potential risks.

participant_privacy:
  - id: https://cm4ai.org/d4d/privacy/deidentified-cell-lines
    name: Privacy posture for cell-line-derived data
    anonymization_method:
      - >-
        Use of commercially available immortalised human cell lines that are
        already de-identified at source (MDA-MB-468 from ATCC, KOLF2.1J from the
        HipSci resource).
    reidentification_risk:
      - >-
        CM4AI data are considered to be de-identified as they cannot be matched,
        with current knowledge, to a human subject.
    privacy_techniques:
      - >-
        Confidentiality level of the release is recorded as Unrestricted, on the
        basis that no identifiable human subject data are present.
    data_linkage:
      - >-
        Released data are linked to external repository deposits (MassIVE, NCBI
        SRA, Figshare) and to provenance graph entities, not to any human
        subject record.

maintainers:
  - id: https://cm4ai.org/d4d/maintainer/cm4ai-project
    name: Cell Maps for Artificial Intelligence project
    role: academic_institution
    maintainer_details:
      - >-
        CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin,
        UA Birmingham, Simon Fraser University and the Hastings Center, as part
        of the NIH Bridge2AI program, and maintains the release series through
        the end of the project.
      - >-
        Project-related inquiries: Swathi Thaker, PhD, UAB, Program Manager,
        snthaker@uab.edu. Website support and updates: Zhandos Sembay, UAB,
        zsembay8@uab.edu.
      - >-
        Point of contact for the releases is Trey Ideker, University of
        California San Diego (tideker@health.ucsd.edu), recorded as
        principalInvestigator and contactEmail in the release RO-Crate.

  - id: https://cm4ai.org/d4d/maintainer/libradata
    name: LibraData, University of Virginia Dataverse
    role: academic_institution
    maintainer_details:
      - >-
        Long term preservation in the University of Virginia Dataverse,
        supported by committed institutional funds.
      - >-
        Justin Niestroy (University of Virginia) is recorded as depositor for
        every release.

errata:
  - id: https://cm4ai.org/d4d/erratum/june-2025-revision
    name: June 2025 release revision
    erratum_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
    erratum_details:
      - >-
        The June 2025 release was republished as a revision. Its description
        states: "This dataset is a revision of the June 2025 Data Release of
        Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) ... This
        revision includes adding RGB immunofluorescent images, corrections to
        ro-crate metadata, and changes to naming conventions."

  - id: https://cm4ai.org/d4d/erratum/release-page-date
    name: Release date shown incorrectly on the CM4AI release page
    erratum_url: https://cm4ai.org/data-releases/
    erratum_details:
      - >-
        The CM4AI data-releases page presents doi:10.18130/V3/HIGT4C as the
        "June 2026 Data Release (Beta)" but shows "Released on: June 17, 2025".
        The Dataverse citation metadata for the same DOI records publication
        date 2026-06-17.

updates:
  id: https://cm4ai.org/d4d/updates/quarterly
  name: Quarterly update plan
  frequency: quarterly
  update_details:
    - >-
      Dataset will be regularly updated and augmented through the end of the
      project in November 2026, with updates on a quarterly basis.
    - >-
      CM4AI releases data quarterly, ensuring continuous updates to the cell
      maps and input data streams.
    - >-
      Data presented in each release will be augmented regularly through the end
      of the project; predicted cell maps will be added in future releases.

retention_limit:
  id: https://cm4ai.org/d4d/retention/institutional
  name: Long-term retention
  retention_period: >-
    Indefinite, through committed institutional preservation; the active update
    period runs to the end of the project in November 2026.
  retention_details:
    - >-
      Long term preservation in the University of Virginia Dataverse
      (https://dataverse.lib.virginia.edu/), supported by committed
      institutional funds.
    - >-
      Superseded releases remain published and citable: the March 2025, June
      2025 and October 2025 releases are still accessible under their own DOIs.

version_access:
  id: https://cm4ai.org/d4d/version-access/release-series
  name: Access to current and prior releases
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - "May 2024 Data Release (listed in the release archive on cm4ai.org)"
    - "March 2025 Data Release (Beta) - doi:10.18130/V3/B35XWX, Dataverse version 1.4, published 2025-03-03"
    - "June 2025 Data Release (Beta) - doi:10.18130/V3/F3TD5R, Dataverse version 2.1, published 2025-07-01"
    - "October 2025 Data Release (Beta) - doi:10.18130/V3/K7TGEM, Dataverse version 2.1, published 2025-10-31"
    - "June 2026 Data Release (Beta) - doi:10.18130/V3/HIGT4C, Dataverse version 2.0, published 2026-06-17"
  version_details:
    - >-
      Each quarterly release is a separately published Dataverse dataset with
      its own DOI, and is itself versioned within Dataverse; prior releases
      remain listed under the Archive heading of the CM4AI data-releases page.
    - >-
      Earlier CM4AI data are cited in the CM4AI preprint as "Cell Maps for
      Artificial Intelligence - Data Release", doi:10.18130/V3/DXWOS5,
      University of Virginia Dataverse V1.
    - >-
      Dataverse version numbering is not monotonic across the series: the
      October 2025 release displays version 2.1 while the later June 2026
      release displays version 2.0, because version numbers are per-dataset
      rather than per-series.

extension_mechanism:
  id: https://cm4ai.org/d4d/extension/rocrate-and-tooling
  name: Extension and contribution mechanism
  contribution_url: https://fairscape.github.io
  extension_details:
    - >-
      Outputs are packaged as RO-Crates with resolvable ARK identifiers and EVI
      provenance graphs, so third parties can extend the provenance graph and
      reference individual datasets, models and software components directly.
    - >-
      All CM4AI integration and packaging software is freely available under
      nonrestrictive open-source licenses (BSD-3 for the Tools pipeline, MIT for
      FAIRSCAPE), and the FAIRSCAPE framework is described with a tutorial and
      installation instructions at https://fairscape.github.io.
    - >-
      Contributions and extension requests are directed through the project:
      Swathi Thaker (snthaker@uab.edu) for project-related inquiries, and the
      Data Access Committee for matters of distribution and dual licensing.

is_deidentified:
  id: https://cm4ai.org/d4d/deidentification/cell-lines
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    Exclusive use of commercially available immortalised human cell lines that
    are de-identified at source; no primary human subjects data are collected.
  deidentification_details:
    - >-
      Every release records De-identified Samples: Yes and Human Subjects: No.
    - >-
      CM4AI data are distinctive within Bridge2AI in that they are non-clinical
      (from tissue cultures) and are considered to be de-identified as they
      cannot be matched, with current knowledge, to a human subject.
    - >-
      The release RO-Crate records humanSubjectResearch as "None - data
      collected from commercially available cell lines".

related_datasets:
  - id: https://cm4ai.org/d4d/related/u2os-cell-map
    name: U2OS multimodal cell map
    target_dataset: https://ndexbio.org (NDEx uuid f693137a-d2d7-11ef-8e41-005056ae3c32)
    relationship_type: references
    description: >-
      The release RO-Crate lists Schaffer LV, Hu M, Qian G, et al. "Multimodal
      cell maps as a foundation for structural and functional genomics", Nature
      2025 (doi:10.1038/s41586-025-08878-3) among its associated publications.
      That study applies the same multimodal mapping and integration approach in
      U2OS osteosarcoma cells, producing a hierarchy of 275 protein assemblies
      from AP-MS interactions and immunofluorescence images for 5,147 matched
      proteins, with the map available at NDEx under uuid
      f693137a-d2d7-11ef-8e41-005056ae3c32, AP-MS interactions under NDEx uuid
      95bc75d5-d1d1-11ee-8a40-005056ae23aa, raw AP-MS files at MassIVE
      MSV000097168, SEC-MS files at ProteomeXchange PXD052362 and structural
      models at ModelArchive under ma-idk-u2osmap and ma-m5og4. Its data are not
      part of the CM4AI Dataverse release series; it is methodological and
      scientific context rather than released CM4AI content.

  - id: https://cm4ai.org/d4d/related/perturbation-cell-atlas
    name: A Perturbation Cell Atlas of Human Induced Pluripotent Stem Cells
    target_dataset: https://doi.org/10.1101/2024.11.03.621734
    relationship_type: is_referenced_by
    description: >-
      The perturb-seq content of the release series is the subject of
      Nourreddine S, Doctor Y, Dailamy A, et al. "A Perturbation Cell Atlas of
      Human Induced Pluripotent Stem Cells", bioRxiv 2024.11.03.621734
      (PMCID PMC11580897), listed as a Related Publication on the release pages
      and as an associatedPublication on the perturb-seq sub-crates.

  - id: https://cm4ai.org/d4d/related/music-2021
    name: MuSIC multi-scale map of cell structure
    target_dataset: https://doi.org/10.1038/s41586-021-04115-9
    relationship_type: derives_from
    description: >-
      Qin Y, Huttlin EL, Winsnes CF, et al. "A multi-scale map of cell structure
      fusing protein images and interactions", Nature 600, 536-542 (2021), is
      the methodological antecedent of the MuSIC pipeline used to integrate
      CM4AI input data streams and is listed among the release RO-Crate's
      associated publications.
