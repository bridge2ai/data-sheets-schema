preprocessing_strategies:
  - id: https://cm4ai.org/d4d/preprocessing/music-pipeline
    name: MuSIC data integration pipeline
    preprocessing_details:
      - >-
        Step a - Download PPI and image data. PPI networks for the cell line and
        conditions are downloaded from the Krogan Laboratory's deposition
        archive and IF images from the Lundberg Laboratory's deposition archive,
        and made available for further processing.
      - >-
        Step b - Generate embeddings. Downloaded PPI networks are processed with
        the node2vec deep learning model to reduce dimensionality, producing a
        PPI embedding that contains information about the protein's
        interactions; IF images are processed with a Human Protein Atlas deep
        learning model to produce an image embedding that contains information
        about protein localization.
      - >-
        Step c - Co-embedding. The PPI and image embeddings are integrated to
        obtain a co-embedding for each protein using contrastive deep learning;
        the integration model learns co-embeddings such that the original
        embeddings can be reconstructed with minimal information loss and
        proteins with similar PPI and image embeddings have similar
        co-embeddings.
      - >-
        Step d - Protein community detection and hierarchy creation. Community
        detection is performed on the all-by-all similarities of pairs of
        proteins in the co-embedding space, and the resulting hierarchy of
        protein communities is output as the final cell map.
      - >-
        Step e - Hierarchy evaluation. Cell maps are aligned to known protein
        function and pathway resources including the Gene Ontology and Reactome,
        and assemblies are annotated using a large language model approach that
        names sets of proteins and assigns a name confidence score.
      - >-
        Step f - Integrative structure modeling. MuSIC communities are annotated
        with available structural information from the Protein Data Bank, the
        AlphaFold Protein Structure Database, crosslinking mass spectrometry and
        disorder prediction, ranked by the amount of available structural
        information, and top-ranked communities are modelled with the Integrative
        Modeling Platform (IMP) version 2.18 scripted through the Python
        Modeling Interface.
      - >-
        The pipeline is divided into segments, each of which calls the FAIRSCAPE
        client package to validate inputs and create the output RO-Crate package
        for that segment, ready for dispatch to the FAIRSCAPE server for PID
        creation and provenance graph entailment computation.

  - id: https://cm4ai.org/d4d/preprocessing/ai-readiness-packaging
    name: FAIRSCAPE AI-readiness packaging
    preprocessing_details:
      - >-
        FAIRSCAPE-CLI is called when any computation or coherent set of
        computations in the pipeline is completed and is passed metadata
        defining JSON-Schema schemas for the datasets in the computational unit
        as well as the inputs, computations, software, models and outputs. It
        creates an RO-Crate package with the datasets, metadata and software - or
        resolvable references to these components - and unique stubs for
        identifier creation.
      - >-
        RO-Crates are sent to the FAIRSCAPE server where they are registered and
        assigned persistent, resolvable, globally unique identifiers in the ARK
        scheme, then decomposed into their individual components, which are also
        registered and assigned PIDs.
      - >-
        The server computes end-to-end entailments on each RO-Crate's provenance
        as expressed in the EVI Evidence Graph Ontology and links them together
        where possible, producing human-readable landing pages with JSON-LD and
        RDF/XML serializations.
      - >-
        The June 2026 release crate conforms to RO-Crate 1.2, declares
        fairscapeVersion 1.1.3, and carries Croissant RAI properties alongside
        schema.org and EVI vocabularies.

  - id: https://cm4ai.org/d4d/preprocessing/image-conversion
    name: Immunofluorescence image conversion
    preprocessing_details:
      - >-
        The June 2025 release added RGB immunofluorescent images as part of a
        revision to the original June 2025 deposit, alongside corrections to
        RO-Crate metadata and changes to naming conventions.

cleaning_strategies:
  - id: https://cm4ai.org/d4d/cleaning/qc-and-metadata-correction
    name: Quality control and metadata correction
    cleaning_details:
      - >-
        Single-cell CRISPR screen data generated in the first project year were
        reported as undergoing quality control before release.
      - >-
        The June 2025 release was republished as a revision that included
        corrections to RO-Crate metadata and changes to naming conventions.
      - >-
        Datasets and data elements are characterized and validated, with data
        elements mapped to public ontology vocabularies where appropriate using
        JSON-Schema mini-data-dictionary descriptions resolvable from the
        provenance graph metadata; the June 2026 release crate documents 20
        schemas.

labeling_strategies:
  - id: https://cm4ai.org/d4d/labeling/hierarchy-annotation
    name: Cell map hierarchy annotation
    data_annotation_platform:
      - Gene Ontology
      - Reactome
      - Large language model annotation pipeline
    data_annotation_protocol:
      - >-
        Cell maps are annotated in a two-pronged approach: first, cell maps are
        aligned to known protein function and pathway resources including the
        Gene Ontology and Reactome to determine protein assemblies with high
        overlap with known cell biology; second, assemblies in the cell maps are
        annotated using a large language model approach developed by the project
        to name sets of proteins and assign a name confidence score.
    labeling_details:
      - >-
        This annotation applies to the integrated cell maps produced by the
        MuSIC pipeline. Computed cell maps are not included in any release
        published to date, so the released map-input data streams are not
        themselves label-annotated by this procedure.
      - >-
        Ontology annotation is applied to release metadata: the Dataverse
        keyword lists bind terms to NCI Thesaurus, BioAssay Ontology, Software
        Ontology, LOINC, Cell Ontology, Experimental Factor Ontology, ChEBI,
        Gene Ontology, MeSH and OBI identifiers, and the release RO-Crate binds
        the release to MeSH, EDAM and Cellosaurus defined terms.

