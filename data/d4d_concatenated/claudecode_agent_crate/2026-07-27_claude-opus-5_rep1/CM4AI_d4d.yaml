missing_data_documentation:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/missing-data
    name: Missing and withheld data
    description: The release's own statement of what is absent.
    missing_data_patterns:
      - Some datasets are under temporary pre-publication embargo.
      - >-
        Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
        CRISPRi perturb-seq data interrogate sets of proteins which incompletely
        overlap.
      - Computed cell maps are not included in this release.
      - >-
        In the March 2025 beta, AP-MS interactomes for the TNBC cells and
        immunofluorescence images for the iPSC lineages were both advertised as
        "coming soon"; AP-MS data for treated MDA-MB-468 cells first appear in the
        June 2026 release.
    missing_data_causes:
      - Pre-publication embargo on datasets tied to manuscripts in preparation.
      - >-
        Different assays have different technical coverage limits, so their protein
        sets do not coincide.
      - >-
        The release series is interim by design; computed maps are scheduled for
        later releases.
    handling_strategy: >-
      Absences are documented rather than imputed. The release carries an explicit
      completeness statement, marks embargoed external links as "Embargoed", and
      states that data will be augmented regularly through the end of the project.

