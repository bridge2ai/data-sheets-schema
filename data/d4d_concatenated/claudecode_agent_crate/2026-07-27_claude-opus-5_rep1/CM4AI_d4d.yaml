    - >-
      A Data Access Committee supervises ethical matters related to dataset
      distribution and potential dual licensing for commercial use.
    - >-
      The Ethics plan explicitly balances the openness of the data produced with
      protection of intellectual property and supervision and monitoring of
      potential efforts at commercialization.
    - >-
      Copyright (c) 2026 The Regents of the University of California except where
      otherwise noted; spatial proteomics raw image data is copyright (c) 2026 The
      Board of Trustees of the Leland Stanford Junior University.

regulatory_restrictions:
  id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/regulatory-restrictions
  name: Regulatory and governance restrictions
  description: >-
    The release records no export control or regulatory restriction beyond its
    license terms and its prohibition on clinical use. Governance is exercised by a
    named data governance committee contact and a Data Access Committee.
  hipaa_compliant: not_applicable
  confidentiality_level: unrestricted
  regulatory_restrictions:
    - >-
      FDA Regulated is recorded as No on every release page.
    - >-
      HIPAA is not applicable because the data involve no human subjects, no
      protected health information, and are derived from commercially available
      de-identified cell lines.
    - >-
      The data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
  other_compliance:
    - >-
      Human Subjects is recorded as No and De-identified Samples as Yes.
    - >-
      Access to Bridge2AI data through the Bridge2AI Open House, including CM4AI
      datasets, requires participants to attest and commit to the Bridge2AI Code of
      Conduct prior to accessing the data.
    - >-
      The named data governance committee contact is Jillian Parker
      (jillianparker@health.ucsd.edu, University of California San Diego); the
      release RO-Crate records the same role with the spelling "Jilian Parker".
    - >-
      The University of Virginia Dataverse collection and the CM4AI portal both
      display the notice that the repository is under review for potential
      modification in compliance with Administration directives.
  governance_committee_contact: mailto:jillianparker@health.ucsd.edu

