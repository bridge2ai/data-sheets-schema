license_and_use_terms:
  id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/license-and-use-terms
  name: License and use terms
  description: >-
    The dataset is licensed for reuse under the Creative Commons
    Attribution-NonCommercial-ShareAlike 4.0 International license
    (https://creativecommons.org/licenses/by-nc-sa/4.0/).
  license_terms:
    - >-
      CC BY-NC-SA 4.0 permits sharing (copying and redistributing the material in
      any medium or format) and adaptation (remixing, transforming, and building
      upon the material), under three conditions: Attribution, requiring appropriate
      credit, a link to the license, and indication of changes; NonCommercial,
      prohibiting use of the material for commercial purposes; and ShareAlike,
      requiring contributions built on the material to be distributed under the same
      license. No additional legal or technological restrictions may be applied.
    - >-
      Attribution is required to the copyright holders and the authors. Any
      publications referencing this data or derived data products should cite the
      related publications as well as directly citing this data collection.
    - >-
      Copyright in the June 2026 release is held as follows: Copyright (c) 2026 The
      Regents of the University of California except where otherwise noted; spatial
      proteomics raw image data is copyright (c) 2026 The Board of Trustees of the
      Leland Stanford Junior University. Earlier releases carry the equivalent 2025
      notices, and the image component crates carry the Stanford notice for 2025.
    - >-
      The Dataverse community norms and good scientific practice expect that proper
      credit is given via citation using the data citation shown on the dataset page.
    - >-
      Component mass spectrometry sub-crates deposited in MassIVE are released under
      CC0 1.0 Universal, a more permissive term than the release as a whole.
    - >-
      Software is licensed separately: the Tools data integration pipeline under
      BSD-3, and the FAIRSCAPE AI-readiness framework under MIT.
    - >-
      All ten distributed files carry File Access Public on Dataverse; no access
      request, authentication, or approval step is required to download them.
    - >-
      The named point of contact for the release is Trey Ideker
      (ORCID 0000-0002-1708-8454, tideker@health.ucsd.edu, University of California
      San Diego), reachable through the Contact Owner button on the Dataverse
      record.
  data_use_permission:
    - no_commercial_use
  contact_person: https://orcid.org/0000-0002-1708-8454

ip_restrictions:
  id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/ip-restrictions
  name: Intellectual property restrictions
  description: >-
    Copyright is retained by the producing institutions and commercial use is
    reserved.
  restrictions:
    - >-
      Commercial use requires a separate license negotiation with the copyright
      holder - UCSD, Stanford, and/or UCSF depending upon the specific data package
