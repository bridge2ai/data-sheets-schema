instances:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/instance-if-images
    name: Immunofluorescence confocal microscopy images
    description: >-
      Four-channel confocal images of MDA-MB-468 cells stained by
      immunofluorescence-based staining (ICC-IF). Each image set covers 464 proteins
      of interest per treatment condition in the June 2025 and later releases; the
      March 2025 beta release covered 563 proteins. Channels are DAPI for nuclei
      (blue), calreticulin antibody for endoplasmic reticulum (yellow), tubulin
      antibody for microtubules (red), and the antibody against the protein of
      interest (green). The June 2025 release added RGB renderings of the
      immunofluorescent images. Images were acquired in the Lundberg Lab at Stanford
      University.
    instance_type: image
    data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D005453
    label: false
    label_description: >-
      Images are annotated by protein of interest, cell line, treatment condition,
      and stain rather than by an analysis-ready target label. The CM4AI portal
      reports 53,788 immunofluorescent images project-wide across all releases and
      conditions; within the June 2026 release the paclitaxel image crate registers
      17,685 output image entities and the vorinostat crate 17,849, organized by
      plate, well, replicate, z-position, and channel colour.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/instance-sec-ms
    name: SEC-MS protein elution profiles
    description: >-
      Size exclusion chromatography coupled to mass spectrometry measurements
      producing protein-level quantification across chromatographic size fractions,
      used for proteome-wide complex and interaction mapping. Covered biological
      material comprises MDA-MB-468 cells untreated and treated with paclitaxel or
      vorinostat (three replicates each in the cancer-cell component crate) and
      KOLF2.1J iPSCs, NPCs, neurons, and cardiomyocytes (Parental replicates 1-4,
      NPC replicates 1-2, Neuron replicates 1-3, Cardio replicates 1-2). Data were
      acquired on a Bruker timsTOF platform and analysed with Spectronaut.
    instance_type: mass spectrometry measurement
    data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D013058
    label: false
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/instance-ap-ms
    name: AP-MS protein interaction measurements
    description: >-
      Affinity purification mass spectrometry measurements on endogenously tagged
      MDA-MB-468 cells, profiling drug-induced interactome rewiring of chromatin
      modifiers under paclitaxel and vorinostat perturbation. Each AP-MS batch
      includes an untagged parental control, ten chromatin-modifier tagged cell
      lines, and a positive control tagged line, with DMSO-treated vehicle controls;
      all experiments were run in four biological replicates. The paclitaxel
      component crate records 555 output datasets and the vorinostat crate 718.
    instance_type: mass spectrometry measurement
    data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D013058
    label: false
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/instance-perturb-seq
    name: Single-cell CRISPRi perturbation transcriptomes
    description: >-
      Single-cell RNA sequencing readouts of CRISPR interference screens. The
      genome-scale Perturbation Cell Atlas in undifferentiated KOLF2.1J iPSCs maps
      transcriptional and fitness phenotypes for 11,739 targeted genes. Targeted
      screens in MDA-MB-468 cells under three conditions (no treatment, paclitaxel,
      vorinostat) perturb 100 chromatin regulators with six guide RNAs per gene,
      performed using the 10x Genomics 3'HT kit in cells expressing inducible dCas9.
    instance_type: single-cell transcriptome
    data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D064113
    label: false
    label_description: >-
      Each cell is associated with its CRISPR guide identity rather than an
      externally assigned analysis label.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/instance-cell-lines
    name: Human cell lines interrogated
    description: >-
      Two ethically sourced, commercially available, de-identified human cell lines
      underlie all instances. MDA-MB-468 (RRID:CVCL_0419; Cellosaurus CVCL_0419) is
      a triple-negative breast cancer line established from a metastatic pleural
      effusion of a 51-year-old Black female with metastatic mammary adenocarcinoma,
      available from ATCC, extensively used to study triple-negative breast cancer
      and well characterized with transcriptomic, mutational-profile, and
      whole-genome sequencing data available. KOLF2.1J (RRID:CVCL_B5P3; Cellosaurus
      CVCL_B5P3) is an induced pluripotent stem cell line derived from a healthy
      male Northern European donor, available from the Human Induced Pluripotent
      Stem Cells Initiative (HipSci) resource to not-for-profit organizations under
      a simple material transfer agreement.
    instance_type: cell line
    counts: 2

anomalies:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/anomaly-metadata-date-inconsistency
    name: Inconsistent dates and versions across release metadata surfaces
    description: Documented inconsistencies between the release surfaces.
    anomaly_details:
      - >-
        The CM4AI data releases page labels the current release "June 2026 Data
        Release (Beta)" but displays a release date of June 17, 2025, whereas the
        Dataverse record for the same DOI gives publication date 2026-06-17.
      - >-
        The Dataverse record reports version 2.0 (cited as V2), while the release
        RO-Crate root entity declares version "1.0" and datePublished 2026-06-30.
      - >-
        The citation string embedded in the June 2026 RO-Crate names the year 2025
        and version V1 for a release the Dataverse record dates to 2026 and
        versions as V2.
      - >-
        Several component RO-Crates carry citation strings pointing at earlier
        releases (March 2025, DOI 10.18130/V3/B35XWX, and DOI 10.18130/V3/K7TGEM)
        rather than at the June 2026 release they are part of.
      - >-
        The image component crates carry contentSize and MD5 values that match the
        March 2025 release files (for example 2.6 GB and MD5
        9422486c80bc9e1d35b2fbbc72a5f043 for the paclitaxel images) rather than the
        June 2026 release files listed on Dataverse (3.8 GB, MD5
        6c1a86520eec2696ec19444eb8a8b428), while their descriptions state the
        464-protein scope of the later releases.
      - >-
        The isPartOf links of several component crates include malformed
        identifiers with a trailing comma inside the URI.
      - >-
        The dataGovernanceCommittee value in the RO-Crate spells the contact
        "Jilian Parker" while the Dataverse release pages spell it "Jillian Parker".
      - >-
        The ethicalReview value in the RO-Crate spells the reviewer "Vardit
        Ravistky" while the Dataverse release pages and the project preprint spell
        it "Vardit Ravitsky".
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/anomaly-size-reporting
    name: Divergent dataset size figures
    description: Different total-size statements across sources.
    anomaly_details:
      - >-
        The release RO-Crate reports contentSize "19.9 TB" while its own
        evi:totalContentSizeBytes field gives 21,051,331,945,400 bytes, which is
        approximately 21.05 TB in decimal units or 19.15 TiB in binary units. The
        CM4AI portal separately reports a project data volume of 21.4 TB.
      - >-
        The RO-Crate counts 53,877 datasets, 1,976 computations, 6 software
        instances, 20 schemas, and 55,859 total entities, but only 8 entities carry
        checksums, which the accompanying AI-readiness self-assessment reports as
        0 percent of files verifiable by checksum.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/anomaly-repository-review-notice
    name: Repository under administrative review
    description: Notice displayed on the distribution surfaces.
    anomaly_details:
      - >-
        Both the CM4AI web portal and the University of Virginia Dataverse
        collection display the notice "This repository is under review for potential
        modification in compliance with Administration directives," which may affect
        availability or content of the distributed material.

known_biases:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/bias-cell-line-representation
    name: Cell-line derivation limits population representativeness
    description: The bias statement carried by every CM4AI release surface.
    bias_type: representation_bias
    bias_description: >-
      Data in this release was derived from commercially available de-identified
      human cell lines, and does not represent all biological variants which may be
      seen in the population at large.
    mitigation_strategy: >-
      No mitigation is claimed in the release documentation. The project scope
      places the limitation in context: CM4AI data are deliberately non-clinical and
      generated from tissue cultures, and the project plans a library of maps across
      demographic and disease contexts rather than a single representative sample.
    affected_subsets:
      - All MDA-MB-468 immunofluorescence, SEC-MS, AP-MS, and perturb-seq data
      - All KOLF2.1J iPSC and iPSC-derived SEC-MS and perturb-seq data
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/bias-donor-demographics
    name: Narrow donor demographic base
    description: >-
      Bias arising from the demographic origin of the two source cell lines rather
      than from a stated position in the release documentation.
    bias_type: selection_bias
    bias_description: >-
      All data derive from exactly two donors: MDA-MB-468 from a 51-year-old Black
      female with metastatic mammary adenocarcinoma, and KOLF2.1J from a healthy
      male Northern European donor. Any inference about generalizability across
      ancestry, sex, or age is unsupported by the sampled material.
    affected_subsets:
      - All data in the release
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/bias-target-selection
    name: Targeted protein and gene panel selection
    description: >-
      Bias arising from the deliberate, non-random choice of interrogation targets.
    bias_type: sampling_bias
    bias_description: >-
      Protein and gene targets were chosen by design rather than at random. The
      project's stated design targets 100 chromatin modifiers and 100 metabolic
      enzymes involved in cancer, neuropsychiatric, and cardiac disorders, with the
      imaging panel extending to further proteins pending significant hits from the
      genetic perturbation and protein-protein interaction results. Coverage
      therefore reflects prior biological interest and assay feasibility.
    mitigation_strategy: >-
      The genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs covers
      11,739 targeted genes, providing unbiased genome-scale coverage for that one
      modality and cell state.
    affected_subsets:
      - AP-MS interactome data
      - Immunofluorescence imaging data
      - Targeted perturb-seq screens in MDA-MB-468 cells
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/bias-antibody-measurement
    name: Antibody- and assay-dependent measurement bias
    description: >-
      Bias arising from the measurement technologies themselves.
    bias_type: measurement_bias
    bias_description: >-
      Immunofluorescence localization depends on antibody availability, specificity,
      and quality; the imaging protocol uses Human Protein Atlas antibodies scored
      by the standard HPA antibody validation procedure, with the highest scoring
      antibody per protein selected. Mass spectrometry detection is limited by
      protein abundance, ionization efficiency, and complex stability under the
      lysis and chromatography conditions used. Proteins that are poorly detected in
      one modality are systematically underrepresented in any integrated map.
    affected_subsets:
      - Immunofluorescence imaging data
      - SEC-MS data
      - AP-MS data

known_limitations:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/limitation-interim-release
    name: Interim release without computed cell maps
    description: The headline limitation stated on every release surface.
    limitation_type: scope_limitation
    limitation_description: >-
      This is an interim release. It does not contain predicted cell maps, which
      will be added in future releases. The current release is most suitable for
      bioinformatics analysis of the individual datasets. It requires domain
      expertise for meaningful analysis.
    scope_impact: >-
      Users seeking the integrated hierarchical cell maps that are the project's
      final deliverable will not find them in this release and must work from the
      constituent modality data.
    recommended_mitigation: >-
      Track the quarterly release series, which is scheduled to continue through
      November 2026, for the addition of computed cell maps.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/limitation-incomplete-overlap
    name: Incomplete overlap between modality protein sets
    description: Coverage limitation affecting cross-modality integration.
    limitation_type: coverage_limitation
    limitation_description: >-
      Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
      CRISPRi perturb-seq data interrogate sets of proteins which incompletely
      overlap.
    scope_impact: >-
      Multimodal integration is only possible for the intersection of the protein
      sets covered by each assay, reducing the effective number of proteins
      available for joint embedding relative to any single modality.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/limitation-embargo
    name: Temporary pre-publication embargo on some component datasets
    description: Availability limitation.
    limitation_type: coverage_limitation
    limitation_description: >-
      These data are not yet in completed final form and some datasets are under
      temporary pre-publication embargo. On the June 2026 release, perturb-seq data
      in undifferentiated KOLF2.1J iPSCs and perturb-seq data in MDA-MB-468 cells
      with and without treatment are both listed as Embargoed, and the raw sequence
      component crate records its access URL as "Embargoed".
    scope_impact: >-
      The corresponding raw sequence data cannot be retrieved from their external
      repositories at the time of this release, although the release archives carry
      the associated metadata and descriptors.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/limitation-checksum-coverage
    name: Sparse checksum coverage across crate entities
    description: Verifiability limitation identified by the release's own assessment.
    limitation_type: methodological_limitation
    limitation_description: >-
      The release RO-Crate registers 55,859 entities but records checksums for only
      8 of them. The accompanying AI-readiness self-assessment reports this as
      "0% of files have checksums (8/55859)" under its verifiability criterion.
    scope_impact: >-
      Byte-level integrity of individual files inside the release archives cannot be
      independently verified from crate metadata alone, although the ten
      Dataverse-level archive files each carry a published MD5.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/limitation-cell-line-scope
    name: Non-clinical, cell-line-only scope
    description: Scope limitation distinguishing CM4AI within Bridge2AI.
    limitation_type: representativeness_limitation
    limitation_description: >-
      CM4AI data are distinctive within Bridge2AI in that they are non-clinical,
      coming from tissue cultures, and are considered de-identified as they cannot
      be matched, with current knowledge, to a human subject. No patient-derived or
      clinical measurements are included.
    scope_impact: >-
      Models trained on these data describe cell-line biology under controlled
      laboratory perturbation and cannot be assumed to transfer to patient tissue or
      clinical decision contexts.
    recommended_mitigation: >-
      Observe the release's prohibited-use statement, which excludes clinical
      decision-making and patient care contexts without appropriate regulatory
      oversight and approval.

confidential_elements:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/confidentiality
    name: Confidentiality assessment
    description: >-
      The release RO-Crate and every component crate declare a confidentialityLevel
      of "Unrestricted". No confidential elements are identified. The data derive
      from commercially available de-identified human cell lines and contain no
      patient, participant, or clinical content.
    confidential_elements_present: false
    confidentiality_details:
      - Confidentiality level declared in the release RO-Crate is Unrestricted.
      - All ten distributed files are marked File Access Public on Dataverse.

content_warnings:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/content-warnings
    name: Content warnings
    description: >-
      No content warnings are stated in any release surface or in the release
      RO-Crate. The material is laboratory measurement data from cultured human cell
      lines.
    content_warnings_present: false

subpopulations:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/subpopulations
    name: Subpopulation identification
    description: >-
      The dataset does not contain human subject records and therefore does not
      identify subpopulations in the usual sense. The only donor-level attributes
      present are the published characteristics of the two source cell lines.
    subpopulation_elements_present: false
    identification:
      - >-
        MDA-MB-468 originates from a 51-year-old Black female with metastatic
        mammary adenocarcinoma; this is a published property of the cell line rather
        than a subpopulation label attached to data instances.
      - >-
        KOLF2.1J originates from a healthy male Northern European donor; likewise a
        published cell-line property.
    distribution:
      - >-
        Data instances are stratified by cell line, treatment condition (untreated,
        paclitaxel, vorinostat) and differentiation state (parental iPSC, NPC,
        neuron, cardiomyocyte), not by human subpopulation.

sensitive_elements:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/sensitive-elements
    name: Sensitive element assessment
    description: >-
      No sensitive personal elements are present. The release records Human
      Subjects: No, De-identified Samples: Yes, and FDA Regulated: No, and the
      RO-Crate states that no primary human subjects research was conducted under
      this release.
    sensitive_elements_present: false
    sensitivity_details:
      - >-
        The data are considered de-identified as they cannot be matched, with
        current knowledge, to a human subject.
      - >-
        Cell-line genomic content is inherently derived from a human donor, but the
        source lines are commercially distributed reference lines whose provenance
        is already public.

relationships:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/relationships
    name: Relationships between instances
    description: How the modality-specific instances relate to one another.
    relationship_details:
      - >-
        Instances are linked primarily by protein identity: the same proteins are
        interrogated across the immunofluorescence imaging, SEC-MS, AP-MS, and
        perturb-seq modalities so that per-protein features from different assays
        can be co-embedded. The project states it is generating deep multi-modal
        data for a shared list of proteins across all cell types and treatment
        conditions.
      - >-
        Instances are also linked by cell line, treatment condition, and
        differentiation state, which define the matched comparisons: untreated
        versus paclitaxel versus vorinostat in MDA-MB-468, and parental iPSC versus
        NPC versus neuron versus cardiomyocyte in KOLF2.1J.
      - >-
        The overlap between the modality-specific protein sets is explicitly
        incomplete, so the linkage is partial rather than a complete matched design.
      - >-
        All component datasets are linked to the release and to one another through
        the FAIRSCAPE-generated RO-Crate provenance graph, which records inputs,
        computations, software, and outputs as an EVI evidence graph with resolvable
        ARK identifiers.

splits:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/splits
    name: Data splits
    description: Splits defined by the release.
    split_details:
      - >-
        No training, validation, or test splits are defined by the release. The data
        are distributed as complete per-modality, per-condition archives, and any
        partitioning for machine learning is left to the downstream user.
      - >-
        The natural partitions present are experimental rather than statistical:
        by cell line, by treatment condition, and by differentiation state.

acquisition_methods:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/acquisition
    name: Instance acquisition
    description: How each instance was obtained.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: true
    was_validated_verified: true
    acquisition_details:
      - >-
        All measurements are direct laboratory observations of cultured human cell
        lines: mass spectrometric detection of peptides, confocal fluorescence
        imaging of stained cells, and single-cell sequencing of transcripts.
      - >-
        No data were reported by human subjects; the release records Human Subjects:
        No.
      - >-
        Derived quantities are produced from the raw acquisitions: DIA-PASEF and
        library-free searches yield protein-level quantification, Spectronaut and
        DIA-NN produce elution profiles, and CompPASS and CompPASS-Plus scoring
        selects high-confidence interactions from AP-MS spectra.
      - >-
        Validation is built into the design. The Perturbation Cell Atlas findings
        were validated via phenotypic, protein-interaction, and metabolic tracing
        assays. In the associated multimodal mapping study, assemblies derived from
        imaging and AP-MS were independently validated by whole-cell SEC-MS
        co-elution, and antibody quality was scored under the standard Human Protein
        Atlas validation protocol.

collection_mechanisms:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/mechanism-ap-ms
    name: Affinity purification mass spectrometry (AP-MS)
    description: Mechanism used to acquire protein-protein interaction data.
    mechanism_details:
      - >-
        AP-MS is applied to endogenously tagged cell lines to map protein-protein
        interactions of chromatin regulators under different conditions. In the
        MDA-MB-468 cancer context the conditions are no treatment, paclitaxel, and
        vorinostat.
      - >-
        Each AP-MS batch includes an untagged parental control, ten
        chromatin-modifier tagged cell lines, and a positive control tagged line,
        with DMSO-treated samples as vehicle controls, run in four biological
        replicates.
      - >-
        In the associated U2OS multimodal mapping study the analogous protocol used
        C-terminal HA-Flag-tagged constructs from the human ORFeome library
        introduced by lentiviral transfection, anti-HA agarose affinity capture, HA
        peptide elution, trypsin digestion, reversed-phase liquid chromatography on
        a C18 microcapillary column, and data-dependent tandem MS on a Thermo Fisher
        Q-Exactive HFX selecting the top 20 precursors for MS2.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/mechanism-sec-ms
    name: Size exclusion chromatography mass spectrometry (SEC-MS)
    description: Mechanism used for proteome-wide complex and interaction mapping.
    mechanism_details:
      - >-
        SEC-MS separates cellular extracts by size exclusion chromatography and
        identifies proteins in each size fraction by tandem mass spectrometry,
        giving quantitative fractionation profiles that reveal co-eluting complexes.
      - >-
        SEC-MS was performed on MDA-MB-468 cells under three conditions (untreated,
        paclitaxel-treated, vorinostat-treated) and on KOLF2.1J iPSCs and derived
        NPCs, neurons, and cardiomyocytes.
      - >-
        The KOLF2 differentiation dataset was acquired on a Bruker timsTOF platform
        with quantitative analysis in Spectronaut and downstream analysis in R using
        MSstats-compatible formats.
      - >-
        In the associated U2OS study the analogous protocol lysed cells with a
        Dounce homogenizer, ultracentrifuged at 100,000 rcf, concentrated over
        100 kDa cut-off spin columns, injected 600 micrograms of protein onto a
        300 x 7.8 mm BioSep-4000 column, collected 40 fractions at 15 seconds per
        fraction at 0.6 ml per minute and 6 degrees Celsius, then digested with
        trypsin and analysed on a Bruker TimsTOF Pro2 in DIA-PASEF mode.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/mechanism-if-imaging
    name: Immunofluorescence confocal imaging
    description: Mechanism used to acquire spatial proteomics data.
    mechanism_details:
      - >-
        Spatial subcellular organization is mapped by immunofluorescence-based
        staining (ICC-IF) and confocal microscopy using the Human Protein Atlas
        resource of antibodies, in the Lundberg Lab at Stanford University.
      - >-
        Automated fixation and permeabilization protocols were established on a
        pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
      - >-
        Each image carries four channels: DAPI for nuclei, calreticulin antibody for
        endoplasmic reticulum, tubulin antibody for microtubules, and the antibody
        against the protein of interest.
      - >-
        In the associated U2OS study the analogous protocol seeded cells in 96-well
        glass-bottom plates, grew them to 60-70 percent confluence in McCoy 5A
        medium with 10 percent fetal bovine serum, fixed in 4 percent
        paraformaldehyde, permeabilized with Triton X-100, incubated overnight at
        4 degrees Celsius with the HPA primary antibody, applied AlexaFluor
        secondary antibodies and DAPI counterstain, and imaged on a Leica SP5
        confocal microscope with a 63x HCX PL APO 1.40 oil CS objective.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/mechanism-crispr-perturbation
    name: Single-cell CRISPRi perturbation screening
    description: Mechanism used to acquire genetic perturbation data.
    mechanism_details:
      - >-
        Single-cell CRISPR screens perturb chromatin regulators and measure the
        resulting transcriptional and fitness phenotypes at single-cell resolution.
      - >-
        A CRISPR lentiviral library targeting 100 chromatin factors with six guide
        RNAs per gene was designed, and MDA-MB-468 and KOLF2 CRISPR lines expressing
        inducible dCas9 were generated and characterized.
      - >-
        Screens of 100 chromatin regulators with and without drug in MDA-MB-468
        cells, and in undifferentiated KOLF2.1J iPSCs, were performed using the
        10x Genomics 3'HT kit.
      - >-
        A separate expressed genome-scale CRISPRi Perturbation Cell Atlas in
        KOLF2.1J iPSCs maps transcriptional and fitness phenotypes for 11,739
        targeted genes.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/mechanism-fairscape-packaging
    name: FAIRSCAPE RO-Crate packaging
    description: Mechanism by which acquired data become the distributed artifact.
    mechanism_details:
      - >-
        FAIRSCAPE-CLI is invoked when any computation or coherent set of
        computations in the pipeline completes, and is passed metadata defining
        JSON-Schema schemas for the datasets in the computational unit together with
        the inputs, computations, software, models, and outputs.
      - >-
        FAIRSCAPE-CLI creates an RO-Crate package containing the datasets, metadata,
        and software - or resolvable references to them - plus identifier stubs for
        each component.
      - >-
        RO-Crates are sent to the FAIRSCAPE server, which registers them, assigns
        persistent resolvable globally unique ARK identifiers to the crate and to
        each decomposed component, and computes end-to-end provenance entailments
        expressed in the EVI Evidence Graph Ontology.
      - >-
        The June 2026 release crate declares conformance to RO-Crate 1.2 and records
        fairscapeVersion 1.1.3.

sampling_strategies:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/sampling
    name: Target selection strategy
    description: How the interrogated proteins, genes, and conditions were chosen.
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
      - >-
        The human proteome and transcriptome as accessible in MDA-MB-468
        triple-negative breast cancer cells and KOLF2.1J induced pluripotent stem
        cells and their neural and cardiac derivatives.
    strategies:
      - >-
        The project design targets 100 chromatin modifiers and 100 metabolic enzymes
        involved in cancer, neuropsychiatric, and cardiac disorders, interrogated
        under perturbed and unperturbed conditions.
      - >-
        Spatial proteomics mapping covered 100 chromatin regulators in MDA-MB-468
        cells with and without paclitaxel or vorinostat, with roughly 500 further
        proteins contingent on significant hits from the genetic perturbation and
        protein-protein interaction results; released image sets cover 563 proteins
        in the March 2025 beta and 464 proteins from the June 2025 release onward.
      - >-
        Endogenous tagging for AP-MS proceeded incrementally: 17 genes were tagged
        in MDA-MB-468 at the time of the project preprint with 34 further genes in
        progress; the released AP-MS batches each contain ten chromatin-modifier
        tagged lines plus controls.
      - >-
        The CRISPRi Perturbation Cell Atlas is genome-scale rather than targeted,
        covering 11,739 expressed genes in undifferentiated KOLF2.1J iPSCs.
      - >-
        Cell lines were selected for disease relevance and ethical sourcing rather
        than sampled from a population: MDA-MB-468 for triple-negative breast cancer
        and KOLF2.1J as a reference iPSC line for large-scale collaborative studies.
    why_not_representative:
      - >-
        The dataset is not intended to be a representative sample of any human
        population. It is a deliberately chosen panel of disease-relevant cell
        lines, targets, and perturbations, and its own release documentation states
        that it does not represent all biological variants which may be seen in the
        population at large.

data_collectors:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/collector-krogan-lab
    name: Krogan laboratory, University of California San Francisco
    description: Generator of the protein-protein interaction mass spectrometry data.
    role: SEC-MS and AP-MS data generation
    collector_details:
      - >-
        Generated the SEC-MS data on undifferentiated KOLF2.1J iPSCs and on
        MDA-MB-468 cells following vorinostat or paclitaxel treatment.
      - >-
        Named contributors on the SEC-MS component crates are Forget A, Obernier K,
        and Krogan N for the cancer-cell dataset and Antoine Forget for the KOLF2
        differentiation dataset; the contact email recorded for the cancer-cell
        SEC-MS crate is nevan.krogan@ucsf.edu.
      - >-
        The AP-MS component crates for paclitaxel and vorinostat perturbation name
        Richa Tiwari as author.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/collector-lundberg-lab
    name: Lundberg laboratory, Stanford University
    description: Generator of the spatial proteomics imaging data.
    role: Immunofluorescence imaging data generation
    collector_details:
      - >-
        Imaged the spatial localization of the proteins of interest in MDA-MB-468
        cells by ICC-IF and confocal microscopy.
      - >-
        Named contributors on the image component crates are Hansen JN, Axelsson U,
