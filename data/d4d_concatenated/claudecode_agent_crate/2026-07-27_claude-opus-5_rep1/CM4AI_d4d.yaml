  id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/version-access
  name: Access to versions
  description: >-
    Each quarterly release is deposited as a separate Dataverse dataset with its own
    DOI, so all earlier releases remain independently citable and retrievable. Within
    a release, Dataverse retains prior published versions.
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
    - https://doi.org/10.18130/V3/HIGT4C
    - https://doi.org/10.18130/V3/K7TGEM
    - https://doi.org/10.18130/V3/F3TD5R
    - https://doi.org/10.18130/V3/B35XWX
    - https://doi.org/10.18130/V3/DXWOS5
  version_details:
    - >-
      June 2026 Data Release (Beta), DOI 10.18130/V3/HIGT4C, Dataverse version 2.0
      cited as V2, publication date 2026-06-17, version 2 released
      2026-07-15T20:28:19Z, ten public ZIP archives. This is the current release. It
      is the first release to include AP-MS data for treated MDA-MB-468 cells and
      the first to link a Figshare copy of the CRISPRi Perturbation Atlas.
    - >-
      October 2025 Data Release (Beta), DOI 10.18130/V3/K7TGEM, Dataverse version
      2.1, publication date 2025-10-31, eight public ZIP archives covering SEC-MS in
      KOLF2 and MDA-MB-468, the KOLF2 perturb-seq cell atlas and raw SRA package,
      release metadata, and the three immunofluorescence image archives.
    - >-
      June 2025 Data Release (Beta), DOI 10.18130/V3/F3TD5R, Dataverse version 2.1,
      publication date 2025-07-01, twenty-one files. Published as a revision that
      added RGB immunofluorescent images, corrected RO-Crate metadata, and changed
      naming conventions. This release exposed the per-modality RO-Crate metadata
      and provenance graph files individually, including
      release-ro-crate-datasheet.html and release-ro-crate-metadata.json.
    - >-
      March 2025 Data Release (Beta), DOI 10.18130/V3/B35XWX, Dataverse version 1.4,
      publication date 2025-03-03, six public files: three immunofluorescence image
      archives covering 563 proteins under the cm4ai-v0.6-beta naming, and three
      RO-Crate metadata files for the CRISPR Perturbation Cell Atlas, its raw
      sequences, and SEC-MS protein-protein interaction data.
    - >-
      The CM4AI archive index lists a May 2024 Data Release. The project preprint,
      posted May 2024, cites "Cell Maps for Artificial Intelligence - Data Release",
      DOI 10.18130/V3/DXWOS5, University of Virginia Dataverse V1. The two are
      almost certainly the same deposit, but no source in the current bundle states
      that identification explicitly and no processed record of this release is
      present.

is_deidentified:
  id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/deidentification
  name: De-identification status
  description: >-
    The release records De-identified Samples: Yes. CM4AI data are considered to be
    de-identified as they cannot be matched, with current knowledge, to a human
    subject.
  identifiable_elements_present: false
  method: >-
    De-identification is inherent to the source material rather than applied: all
    measurements are made on commercially available, already de-identified human
    cell lines (MDA-MB-468 and KOLF2.1J), and no participant-level records exist in
    the dataset.
  deidentification_details:
    - >-
      The release RO-Crate records human subject research as "None - data collected
      from commercially available cell lines" and the exemption basis as "Exempt -
      research with commercially available de-identified human cell lines does not
      constitute human subjects research."
    - >-
      CM4AI data are distinctive within Bridge2AI in being non-clinical, coming from
      tissue cultures.

