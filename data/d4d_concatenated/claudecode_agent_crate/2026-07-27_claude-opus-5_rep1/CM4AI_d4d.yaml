errata:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/erratum-june-2025-revision
    name: June 2025 release revision
    description: >-
      The June 2025 release (DOI 10.18130/V3/F3TD5R) was published as a revision
      rather than as a first issue.
    erratum_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
    erratum_details:
      - >-
        The revision added RGB immunofluorescent images, applied corrections to
        RO-Crate metadata, and changed naming conventions.
      - >-
        File naming changed from the cm4ai-v0.6-beta-if-images-{condition}.zip
        pattern used in March 2025 to the cm4ai_ifimages_MDA-MB-468_{condition}.zip
        pattern retained in later releases.
      - >-
        The stated protein count for the immunofluorescence image sets changed from
        563 in March 2025 to 464 from June 2025 onward.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/erratum-crate-metadata-drift
    name: Stale metadata carried in component crates
    description: >-
      Component RO-Crates in the June 2026 release carry citation strings, content
      sizes, and MD5 checksums inherited from earlier releases.
    erratum_details:
      - >-
        Image component crates report the March 2025 file sizes and MD5 values while
        describing the later 464-protein image sets.
      - >-
        Several component crates cite the March 2025 or October 2025 release DOI
        rather than the June 2026 release DOI they are part of.
      - >-
        No published erratum notice corrects these; they are recorded here from
        direct comparison of the release page against the crate metadata.

updates:
  id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/updates
  name: Update plan
  description: >-
    The dataset will be regularly updated and augmented through the end of the
    project in November 2026.
  frequency: quarterly
  update_details:
    - >-
      CM4AI releases data quarterly, ensuring continuous updates to the cell maps and
      input data streams.
    - >-
      Data presented in a release will be augmented regularly through the end of the
      project.
    - >-
      Future releases are expected to add predicted cell maps, which the current
      release does not contain.
    - >-
      Updates are announced through the CM4AI data releases page, which maintains an
      archive index of prior releases, and are published as new Dataverse deposits
      with their own DOIs rather than as in-place replacements.

retention_limit:
  id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/retention-limits
  name: Retention and preservation
  description: >-
    Long term preservation in the University of Virginia Dataverse, supported by
    committed institutional funds.
  retention_period: >-
    Indefinite; no retention limit or planned deletion date is stated. Active
    augmentation continues through the end of the project in November 2026.
  retention_details:
    - >-
      LibraData is the University of Virginia's archival data repository and an
      NIH-approved generalist repository.
    - >-
      Preservation is backed by committed institutional funds according to the
      maintenance plan stated on every release.
    - >-
      Dataverse retains previously published versions: files removed in a later
      version are not removed from previously published versions of the dataset.

