purposes:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/purpose-interpretable-genotype-phenotype
    name: Interpretable genotype-phenotype learning
    description: Primary scientific purpose of the CM4AI data generation project.
    response: >-
      The CM4AI data generation project seeks to map the spatiotemporal architecture
      of human cells and use these maps toward the grand challenge of interpretable
      genotype-phenotype learning. In genomics and precision medicine, machine
      learning models are often "black boxes," predicting phenotypes from genotypes
      without revealing the mechanisms by which the translation occurs. CM4AI
      addresses this deficiency with a coordinated effort involving three
      complementary mapping approaches - proteomic mass spectrometry, cellular
      imaging, and genetic perturbation via CRISPR/Cas9 - creating a library of
      large-scale maps of cellular structure and function across demographic and
      disease contexts. These data are intended to stimulate research and
      development in "visible" machine learning systems informed by multi-scale cell
      and tissue architecture.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/purpose-ai-ready-data
    name: Production of ethical, FAIR, AI-ready data
    description: Purpose relating to data standards and AI-readiness.
    response: >-
      CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell
      architecture, inferred from multimodal data collected for human cell lines, to
      enable transformative biomedical AI research. As defined by CM4AI, AI-ready
      biomedical data are fully characterized FAIR data of known provenance that can
      be ethically and reliably processed by AI applications; whose models and
      software are available and well-described for validation and re-use; and whose
      predictions may be fully explained and interpreted to the user as needed. The
      project's AI-readiness criteria are FAIR, Provenanced, Characterized,
      Explainable, and Ethical, and these criteria are interdependent: ethical
      validation depends on explainability, explainability depends on provenance.
      The project implements this through the FAIRSCAPE framework, establishing rich
      metadata and persistent globally unique identifiers, computing a
      machine-readable provenance graph resolvable as metadata for all results, and
      characterizing and validating all datasets and data elements with JSON-Schema
      mini-data-dictionary descriptions resolvable from the provenance graph.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/purpose-quarterly-release
    name: Quarterly release of map-input data streams
    description: Purpose of the Dataverse release series specifically.
    response: >-
      CM4AI delivers machine-readable hierarchical maps of cell architecture as
      AI-ready data, together with quarterly data releases of map-input data
      streams. The releases exist so that the multimodal input data - protein-protein
      interaction, spatial localization, and genetic perturbation measurements - are
      publicly available and citable in advance of, and alongside, the computed cell
      maps themselves.

tasks:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/task-multimodal-cell-mapping
    name: Multimodal cell mapping
    description: The core analytical task the data are generated to support.
    response: >-
      Construct hierarchical maps of cell architecture by integrating multimodal
      measurements. Cell maps are hierarchical directed acyclic graphs in which each
      node represents an assembly of proteins in proximity at a given scale, ranging
      from large assemblies representing cell compartments such as the nucleus and
      mitochondria down to small assemblies such as protein complexes and subunits.
      Protein interaction networks are generated by AP-MS and SEC-MS, while
      immunofluorescence staining with high-resolution microscopy reveals protein
      localization and distribution. These streams are integrated with
      self-supervised embedding approaches from deep learning, followed by
      algorithmic community detection at multiple resolutions to generate the
      hierarchy of protein assemblies.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/task-visible-neural-networks
    name: Visible machine learning
    description: Downstream modeling task the maps are designed to enable.
    response: >-
      Cell maps provide a foundation for downstream applications in human genomics,
      including interpretation of genetic variants and mutations. They have been
      used in AI tools for "visible machine learning" or "visible neural networks"
      to interrogate how protein assemblies in the cell affect cell-level phenotype
      predictions. The June 2026 release metadata names Ma et al. 2018
      (PMID 29505029) and Kuenzi et al. 2020 (PMID 33096023) as the specific
      exemplars of the biologically-driven, interpretable machine learning
      applications the data are meant to enable.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/task-perturbation-response
    name: Characterizing perturbation and differentiation responses
    description: Comparative task enabled by the treated and differentiated conditions.
    response: >-
      Characterize how cell architecture, protein complexes, and transcriptional
      state are reorganized in response to chemotherapeutic perturbation and to
      lineage commitment. In MDA-MB-468 triple-negative breast cancer cells the
      comparison is untreated versus paclitaxel versus vorinostat; in KOLF2.1J
      induced pluripotent stem cells it is undifferentiated parental cells versus
      derived neural progenitor cells, neurons, and cardiomyocytes.

addressing_gaps:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/gap-black-box-models
    name: Opacity of genotype-to-phenotype machine learning models
    description: The principal gap motivating the dataset.
    response: >-
      Machine learning models show great promise in analyzing the human genome to
      make predictions, but the inner workings of these models are typically
      difficult-to-interpret black boxes. This Bridge2AI data generation project
      generates a resource of matched data and tools to enable the creation of
      visible machine learning systems, which are not black boxes but are built
      directly on knowledge maps of cell and tissue architecture.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/gap-uncharted-cell-architecture
    name: Incomplete knowledge of subcellular architecture
    description: Biological knowledge gap.
    response: >-
      Human cells consist of a complex hierarchy of components, many of which remain
      unexplored, and much of cell structure remains uncharted. Although cell
      mapping technologies such as immunofluorescence imaging and affinity
      purification mass spectrometry have typically been applied separately,
      integration of multiple complementary data modalities allows biological
      structure to be incorporated robustly across physical scales, resolving
      assemblies that neither modality recovers alone.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/gap-ai-ready-packaging
    name: Absence of standardized, provenanced, ethically packaged biomedical data
    description: Data-standards gap.
    response: >-
      AI-readiness places significant requirements on datasets used to train and to
      be analyzed by AI/ML models, and those requirements were not routinely met by
      functional genomics data. CM4AI addresses this by packaging outputs with
      machine-readable provenance graphs, resolvable persistent identifiers,
      data dictionaries, and datasheets, so that data, software, models, and
      computations are linked and independently verifiable.
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/gap-workforce
    name: Gaps in the functional genomics and biomedical AI/ML workforce
    description: Training and workforce gap addressed by the project.
    response: >-
      The Skills and Workforce Development module identified gaps in training of the
      functional genomic and biomedical AI/ML workforce and works to recruit and
      train a diverse group of participants in the scientific approach, data
      standards, and tools produced by CM4AI, using asynchronous virtual training,
      hosted virtual events, and an in-person internship co-hosted at Yale
      University and the University of California San Diego.

