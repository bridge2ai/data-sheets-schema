id: https://doi.org/10.18130/V3/HIGT4C
name: CM4AI
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data
  Generation Project of the U.S. National Institutes of Health Bridge2AI program.
  Its mission is to produce ethical, AI-ready datasets of human cell architecture,
  inferred from multimodal interrogation of disease-relevant human cell lines, in
  order to enable interpretable ("visible") machine learning that connects genotype
  to phenotype through explicit models of cell structure.

  This datasheet describes the CM4AI data release series distributed through
  LibraData, the University of Virginia's Dataverse instance, with the June 2026
  Data Release (Beta), DOI 10.18130/V3/HIGT4C, as the current release. The June
  2026 release contains protein-protein interaction, spatial localization, and
  genetic perturbation data generated in MDA-MB-468 triple-negative breast cancer
  cells (untreated, paclitaxel-treated, and vorinostat-treated) and in KOLF2.1J
  induced pluripotent stem cells and their derived neural progenitor cells,
  neurons, and cardiomyocytes. Specifically it comprises: CRISPRi perturb-seq data
  for MDA-MB-468 cells with and without treatment and for undifferentiated parental
  KOLF2.1J iPSCs; size-exclusion chromatography mass spectrometry (SEC-MS) data for
  MDA-MB-468 cells with and without treatment and for undifferentiated KOLF2.1J
  iPSCs, NPCs, neurons, and cardiomyocytes; affinity-purification mass spectrometry
  (AP-MS) data for treated MDA-MB-468 cells; and immunofluorescence confocal
  microscopy images of MDA-MB-468 cells with and without treatment.

  CM4AI output data are packaged with provenance graphs and rich metadata as
  AI-ready datasets in RO-Crate format using the FAIRSCAPE framework, which assigns
  ARK persistent identifiers to the crate and to its component datasets, software,
  and computations, and computes end-to-end provenance entailments expressed in the
  EVI Evidence Graph Ontology. The release crate declares conformance to RO-Crate
  1.2 and carries Croissant Responsible AI (rai:) properties describing collection,
  limitations, biases, use cases, and maintenance.

  Two different scopes are reported for size and count and are recorded separately
  here. The Dataverse deposit itself carries ten public ZIP archives totalling
  roughly 12.7 GB, which is the scope of the file count and of the file collections
  and distributions below. The release RO-Crate describes the release as a whole,
  including the component datasets held in MassIVE, Figshare, and the sequence
  archive, and registers 53,877 datasets, 1,976 computations, 6 software instances,
  20 schemas, and 55,859 total entities amounting to 21,051,331,945,400 bytes; that
  is the scope of the total size recorded below and of the resources listed below.

  CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA
  Birmingham, Simon Fraser University, and the Hastings Center. The data are
  non-clinical: they derive from commercially available, de-identified human cell
  lines and are considered not matchable to a human subject with current knowledge.
