preprocessing_strategies:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/preprocessing-embedding
    name: Modality-specific embedding and integration
    description: The MuSIC pipeline preprocessing sequence.
    preprocessing_details:
      - >-
        Downloaded protein-protein interaction networks are processed with the
        node2vec deep learning model to reduce dimensionality, producing a PPI
        embedding that encodes each protein's interaction neighbourhood.
      - >-
        Immunofluorescence images are processed with a Human Protein Atlas deep
        learning model to reduce dimensionality, producing an image embedding
        encoding protein localization; the associated U2OS study used DenseNet-121
        pre-trained for object recognition in protein IF confocal images to produce
        1,024-dimension feature vectors from the four image channels.
      - >-
        PPI and image embeddings are integrated into a per-protein co-embedding
        using contrastive deep learning, learned so that the original embeddings can
        be reconstructed with minimal information loss and proteins with similar
        inputs receive similar co-embeddings.
      - >-
        Community detection is performed on all-by-all protein similarities in the
        co-embedding space, and the resulting hierarchy of protein communities is
        output as the cell map. The associated U2OS study used the Hierarchical
        community Decoding Framework (HiDeF) with persistence threshold 10 and
        maximum resolution 80 across ten proximity networks.
      - >-
        Each pipeline segment calls the FAIRSCAPE client to validate its inputs and
        create the output RO-Crate package for that segment.
    used_software:
      - id: https://github.com/idekerlab/cellmaps_pipeline
        name: Cell Mapping Toolkit (MuSIC pipeline)
        license: BSD-3-Clause
        url: https://github.com/idekerlab/cellmaps_pipeline
      - id: https://github.com/eliorc/node2vec
        name: node2vec
        description: >-
          Python implementation used to embed protein-protein interaction
          neighbourhoods as fixed-length feature vectors.
        url: https://github.com/eliorc/node2vec
      - id: https://github.com/fanzheng10/HiDeF
        name: HiDeF
        description: >-
          Hierarchical community Decoding Framework used for pan-resolution
          community detection.
        url: https://github.com/fanzheng10/HiDeF
      - id: https://fairscape.github.io
        name: FAIRSCAPE-CLI
        license: MIT
        url: https://fairscape.github.io
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/preprocessing-mass-spec
    name: Mass spectrometry data processing
    description: Search and quantification steps applied to the raw MS acquisitions.
    preprocessing_details:
      - >-
        SEC-MS data for the KOLF2 differentiation series were processed with
        Spectronaut, with downstream analysis conducted in R using
        MSstats-compatible formats.
      - >-
        In the associated U2OS study, SEC-MS acquisitions were searched with
        DIA-NN v1.8.1.0 against UniProt human sequences (UP000005640) plus 229
        common contaminant sequences, with library-free search, trypsin/P
        specificity, one missed cleavage, 1 percent precursor FDR, match-between-runs
        enabled, robust LC high-precision quantification, and RT-dependent cross-run
        normalization.
      - >-
        In the associated U2OS study, AP-MS spectra were identified with Sequest,
        filtered to 1 percent protein-level FDR with entropy-based filtering, scored
        with CompPASS to select the top 2 percent of high-confidence interactions,
        and further filtered with CompPASS-Plus at 1 percent FDR.
    used_software:
      - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/software-spectronaut
        name: Spectronaut
        description: Commercial software used for SEC-MS quantitative analysis.
      - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/software-diann
        name: DIA-NN
        version: 1.8.1.0
        description: >-
          Neural-network-based DIA search engine used for SEC-MS analysis in the
          associated U2OS study.

cleaning_strategies:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/cleaning-qc
    name: Quality control and filtering
    description: Quality-control steps applied before release.
    cleaning_details:
      - >-
        Single-cell CRISPR screen data are quality-controlled before release; at the
        time of the project preprint the screens in MDA-MB-468 and undifferentiated
        KOLF2.1J iPSCs were described as currently being QCed.
      - >-
        Antibody quality for immunofluorescence is scored according to the standard
        Human Protein Atlas antibody validation protocol, and the highest-scoring
        antibody per protein is selected, with up to two technical replicate images.
      - >-
        In the associated U2OS study, AP-MS quality control required sequence
        validation of lentiviral clones, detection of the tagged bait protein in
        each run, higher bait abundance in its own pull-down than in other
        pull-downs on the same 96-well plate, and a minimum of roughly 5,000 peptide
        spectrum matches and about 700 proteins per LC-MS run to remove under-loaded
        samples.
      - >-
        In the associated U2OS study, perturb-seq knockouts were filtered to require
        on-target mRNA reduction greater than 30 percent and a strong transcriptional
        phenotype of at least 20 differentially expressed genes.
      - >-
        The June 2025 release explicitly applied corrections to RO-Crate metadata and
        changes to naming conventions as part of a revision.

labeling_strategies:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/labeling-annotation
    name: Assembly annotation and naming
    description: >-
      Labeling applies to the derived cell maps rather than to the raw measurement
      instances in this release. The procedure below is documented for the
      associated U2OS multimodal map (Schaffer et al. 2025) and for the CM4AI
      hierarchy evaluation step; computed cell maps are not part of the June 2026
      release.
    data_annotation_protocol:
      - >-
        Cell maps are annotated in a two-pronged approach: first aligned to known
        protein function and pathway resources including the Gene Ontology and
        Reactome to identify assemblies with high overlap with known cell biology,
        then annotated with a large language model approach that names sets of
        proteins and assigns a name confidence score.
      - >-
        In the associated U2OS study, in-person Annotation Jamborees were held in
        which approximately a dozen individuals worked in pairs to assign names and
        putative functional roles to assemblies on the basis of expert knowledge and
        literature curation.
      - >-
        Assemblies were categorized by Jaccard overlap against CORUM, Gene Ontology
        cellular component, and Human Protein Atlas reference sets: high overlap at
        Jaccard index of at least 50 percent, substantial variation between 20 and
        50 percent, and not previously documented below 20 percent.
      - >-
        The Gene Set AI pipeline guided GPT-4 (version gpt-4-1106-preview) to
        produce a descriptive name, a confidence score, and a referenced analysis
        essay for each assembly, using chain-of-thought and one-shot prompting; names
        with confidence of at least 0.85 were passed to the human curation team for
        final naming determination.
    inter_annotator_agreement: >-
      Reproducibility of the automated naming was assessed by running the Gene Set
      AI pipeline five additional times and computing semantic similarity between
      replicate names and the original, using the SapBERT model
      (cambridgeltl/SapBERT-from-PubMedBERT-fulltext).
    annotator_demographics:
      - >-
        Annotators were domain expert members of the project team; no demographic
        characterization of annotators is reported.
    labeling_details:
      - >-
        Released measurement instances carry structured experimental annotation
        (cell line, treatment, stain, replicate, channel, guide identity) rather
        than analysis target labels.

raw_sources:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/raw-data-availability
    name: Availability of raw data
    description: Whether the raw material underlying processed outputs is retained.
    access_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    raw_data_details:
      - >-
        Raw immunofluorescence image data is distributed directly in the release as
        per-condition ZIP archives.
      - >-
        Raw and processed mass spectrometry files are retained in MassIVE under
        MSV000100676, MSV000098237, MSV000101915, and MSV000101917, linked from the
        release as external data resources.
      - >-
        Raw single-cell sequence data for the perturbation atlas is retained but
        currently embargoed.
      - >-
        The FAIRSCAPE provenance graph links every released output to its inputs,
        computations, and software, so the derivation chain from raw acquisition to
        distributed product is recorded in the crate.

annotation_analyses:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/annotation-analysis
    name: Annotation quality analysis
    description: >-
      Quality analysis reported for the map annotation step of the associated U2OS
      study; no annotation quality analysis is reported for the raw measurement data
      in this release.
    agreement_metric: SapBERT semantic similarity across replicate LLM runs
    analysis_method: >-
      The Gene Set AI naming pipeline was run five additional times and the semantic
      similarity between each replicate name and the original name was computed with
      the SapBERT model using the transformers package v4.29.2. Assemblies not named
      by the original run were excluded from the reproducibility test.
    annotation_quality_details:
      - >-
        LLM naming confidence differed sharply by assembly category: median 0.92 for
        assemblies with high overlap with known components or with substantial
        variation on them, 0.85 for previously undocumented assemblies, and 0.0 for
        random protein sets with no correspondence to biological structure.
      - >-
        Human curators made the final naming determination for automatically named
        assemblies.

machine_annotation_tools:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/machine-annotation-tools
    name: Machine annotation and prediction tools
    description: >-
      Automated tools used in the CM4AI analytical stack and in the associated U2OS
      mapping study.
    tools:
      - GPT-4 (gpt-4-1106-preview) via the Gene Set AI pipeline
      - AlphaFold and AlphaFold-Multimer
      - HiDeF multiscale community detection
      - node2vec
      - DenseNet-121 Human Protein Atlas image model
      - Integrative Modeling Platform (IMP) v2.18
    tool_descriptions:
      - >-
        GPT-4 generates descriptive assembly names, confidence scores, and
        referenced analysis essays; a separate GPT-4 citation module extracts gene
        and function keywords, queries PubMed, and evaluates whether retrieved
        abstracts support the generated statements.
      - >-
        AlphaFold-Multimer predicts structural models for protein pairs within small
        assemblies, run through localcolabfold with default settings.
      - >-
        HiDeF identifies protein communities at multiple resolutions and represents
        their hierarchical relationships as a directed acyclic graph.
      - >-
        IMP is used for integrative structure modelling of selected assemblies,
        scripted with the Python Modeling Interface package.
    tool_accuracy:
      - >-
        LLM naming confidence medians of 0.92 for known assemblies, 0.85 for
        previously undocumented assemblies, and 0.0 for random protein sets.
      - >-
        AlphaFold-Multimer models were scored as 0.8 x ipTM + 0.2 x pTM, with a
        30 percent FDR cut-off corresponding to a weighted score of 0.39.

existing_uses:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/existing-uses
    name: Existing uses of CM4AI data and methods
    description: Documented uses to date.
    examples:
      - >-
        Schaffer LV, Hu M, Qian G, et al. "Multimodal cell maps as a foundation for
        structural and functional genomics." Nature 642:222-231 (2025),
        doi:10.1038/s41586-025-08878-3, is listed as an associated publication of
        the June 2026 release. It constructs a global map of human subcellular
        architecture from joint biophysical interaction and immunofluorescence
        measurements of more than 5,100 proteins in U2OS osteosarcoma cells,
        resolving 275 molecular assemblies, yielding structures for 111 heterodimeric
        complexes, assigning unexpected functions to 975 proteins, and identifying
        21 recurrently mutated assemblies and 102 validated new cancer proteins in
        paediatric cancer genomes.
      - >-
        Nourreddine S, Doctor Y, Dailamy A, et al. "A Perturbation Cell Atlas of
        Human Induced Pluripotent Stem Cells," bioRxiv 2024.11.03.621734, is the
        associated publication of the perturb-seq component datasets.
      - >-
        Qin Y, Huttlin EL, Winsnes CF, et al. "A multi-scale map of cell structure
        fusing protein images and interactions," Nature 600:536-542 (2021), is
        listed as an associated publication and is the proof-of-concept study on
        which the CM4AI mapping approach builds.
      - >-
        Clark T, Mohan J, Schaffer L, Obernier K, et al. "Cell Maps for Artificial
        Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant
        Cell Lines," bioRxiv 2024.05.21.589311, is the project description and the
        publication that all releases require citing.
      - >-
        The data were made available at the CM4AI CodeFest in March 2024 with
        detailed tutorials explaining how the data were derived and integrated and
        production-ready software for producing the datasets; 38 registrants
        attended, of whom 40 percent identified as female and 30 percent came from
        underrepresented communities.

use_repository:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/use-repository
    name: Where uses of the dataset are catalogued
    description: >-
      There is no dedicated registry of downstream uses. The CM4AI publications page
      and the Dataverse dataset metrics are the closest available surfaces.
    repository_url: https://cm4ai.org/
    repository_details:
      - >-
        The CM4AI web portal maintains a publications section covering how the
        project addresses the Bridge2AI Functional Genomics grand challenge.
      - >-
        Dataverse reports per-release download counts (181 downloads recorded for
        the June 2026 release at capture, 405 for October 2025, 302 for March 2025,
        and 256 for June 2025) and states that citation counts retrieved from
        Crossref via DataCite were not found for the release series.

other_tasks:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/other-tasks
    name: Other tasks the dataset could support
    description: Additional plausible tasks grounded in the release documentation.
    task_details:
      - >-
        Bioinformatics analysis of the individual modality datasets, which the
        release states is what the current interim form is most suitable for.
      - >-
        Comparative analysis of protein complex composition across differentiation
        states, using the KOLF2.1J parental, NPC, neuron, and cardiomyocyte SEC-MS
        series.
      - >-
        Analysis of chemotherapy-induced interactome rewiring in triple-negative
        breast cancer, using the paired untreated, paclitaxel, and vorinostat
        conditions across AP-MS, SEC-MS, imaging, and perturb-seq.
      - >-
        Benchmarking of multimodal representation learning methods on matched
        imaging and interaction data.
      - >-
        Methodological work on provenance-aware, AI-ready data packaging, using the
        RO-Crate, EVI evidence graph, and AI-readiness self-assessment shipped with
        the release.

future_use_impacts:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/future-use-impacts
    name: Composition and collection effects on future uses
    description: >-
      How the way the data were assembled constrains what future users can
      responsibly conclude.
    impact_details:
      - >-
        Because the material is two cell lines, conclusions about population-level
        biological variation are not supportable, and models trained on these data
        should not be presented as representative of human populations.
      - >-
        Because the modality protein sets overlap incompletely, integrative analyses
        are restricted to the intersection, and apparent absence of a protein in one
        modality reflects assay coverage rather than biology.
      - >-
        Because the release is interim and lacks computed cell maps, downstream
        users who need the integrated hierarchy must either wait for later releases
        or run the MuSIC pipeline themselves.
      - >-
        Because parts of the perturb-seq data are embargoed, analyses depending on
        raw sequence access are not currently reproducible end to end.
      - >-
        Because the license is non-commercial and share-alike, derived data products
        inherit distribution constraints, and commercial applications require
        separate negotiation.
      - >-
        The project's stated intention is that anticipated applications of the data
        and derived AI/ML systems be integrated into data governance frameworks so
        as to optimize benefits, mitigate potential risks, and promote use for the
        collective good.

discouraged_uses:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/discouraged-uses
    name: Discouraged uses
    description: Uses the release documentation advises against.
    discouragement_details:
      - >-
        Use without domain expertise is discouraged: the release states that
        meaningful analysis requires domain expertise.
      - >-
        Reliance on the release for integrated cell maps is discouraged, since
        predicted cell maps are explicitly not included.
      - >-
        Treating the data as representative of population-level biological variation
        is discouraged given the cell-line derivation.
      - >-
        Commercial use is discouraged without separate licensing: commercial use
        requires a separate license negotiation with the copyright holder (UCSD,
        Stanford, and/or UCSF depending on the specific data package), supervised by
        a Data Access Committee.

intended_uses:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/intended-uses
    name: Intended uses
    description: The release's own statement of intended use.
    examples:
      - AI-ready datasets to support research in functional genomics
      - AI and machine learning model training
      - Cellular process analysis
      - >-
        Analysis of cell architectural changes and interactions in the presence of
        specific disease processes, treatment conditions, or genetic perturbations
    use_category:
      - research
      - non-clinical
    usage_notes: >-
      The June 2026 release RO-Crate adds that a major goal is to enable
      biologically-driven, interpretable machine learning applications, for example
      as proposed in Ma et al. 2018 (PMID 29505029) and Kuenzi et al. 2020
      (PMID 33096023). Attribution is required to the copyright holders and the
      authors, and any publications referencing this data or derived data products
      should cite the related publications as well as directly citing this data
      collection.

prohibited_uses:
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/prohibited-uses
    name: Prohibited uses
    description: >-
      These laboratory data are not to be used in clinical decision-making or in any
      context involving patient care without appropriate regulatory oversight and
      approval.
    prohibition_reason:
      - >-
        The data are laboratory measurements on cultured cell lines and are not
        validated for clinical use; the release records FDA Regulated: No.
      - >-
        The prohibition is stated identically on every release page, in the release
        RO-Crate usageInfo and prohibitedUses fields, and on every component crate.

distribution_formats:
