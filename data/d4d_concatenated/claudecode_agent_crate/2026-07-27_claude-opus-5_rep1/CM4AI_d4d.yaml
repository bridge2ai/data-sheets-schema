    name: University of Virginia Dataverse (LibraData)
    description: >-
      Primary distribution channel. The June 2026 release is distributed as ten
      public ZIP archives from LibraData, the University of Virginia's Dataverse
      instance, an NIH-approved generalist repository, within the collection path
      University of Virginia Dataverse > LibraData > School of Medicine > Cell Maps
      for Artificial Intelligence. Dataverse states the dataset is too large to
      download in full and directs users to select individual files from the files
      table or to use the Data Access API for programmatic access.
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
      - https://doi.org/10.18130/V3/HIGT4C
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/distribution-external-repositories
    name: External domain repositories
    description: >-
      Raw mass spectrometry and sequence data are distributed from domain
      repositories linked as external data resources: MassIVE for SEC-MS and AP-MS
      data, Figshare for the CRISPRi Perturbation Atlas of iPSCs, and NCBI
      BioProject / SRA for raw perturb-seq sequences (currently embargoed).
    access_urls:
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000100676
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101915
      - https://massive.ucsd.edu/ProteoSAFe/QueryMSV?id=MSV000101917
      - https://figshare.com/s/ee85bb1880921326249b
  - id: https://w3id.org/bridge2ai/data-sheets-schema/CM4AI/distribution-formats-technical
    name: Technical formats present in the release
    description: >-
      The release RO-Crate enumerates the formats present across its registered
      entities as .d and .d directory groups, .tsv and TSV, .xml, csv, executable,
      fastq.gz, h5, h5ad, image/jpeg, pdf, and unknown. At the Dataverse level all
      ten distributed items are ZIP archives. Metadata is distributed as RO-Crate
      JSON-LD conforming to RO-Crate 1.2, with an accompanying HTML datasheet, an
      AI-readiness score in JSON, per-modality provenance graph renderings, and a
      LinkML rendering.
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C

