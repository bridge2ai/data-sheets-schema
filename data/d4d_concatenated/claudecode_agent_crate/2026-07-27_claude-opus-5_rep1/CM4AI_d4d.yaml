  - id: https://fairscape.net/api/ark:59853/rocrate-sec-ms-characterization-of-kolf2-neuronal-and-cardiomyocyte-differentiation-cm4ai-yjftt2oec6c
    name: SEC-MS characterization of KOLF2 neuronal and cardiomyocyte differentiation
    description: >-
      Mass spectrometry-based proteomics data investigating protein-protein
      interaction networks during differentiation of KOLF2.1J human induced
      pluripotent stem cells. Size exclusion chromatography coupled with mass
      spectrometry (SEC-MS) was used to map multiscale biological organization
      across four stages: parental undifferentiated iPSCs, neural progenitor cells,
      terminally differentiated neurons, and terminally differentiated
      cardiomyocytes. The study aims to identify how protein complexes and networks
      are reorganized during neuronal lineage commitment and cardiomyocyte
      differentiation. Sample groups are Parental (replicates 1-4), NPC (replicates
      1-2), Neuron (replicates 1-3), and Cardio (replicates 1-2). Data were acquired
      on a Bruker timsTOF platform; quantitative analysis was performed with
      Spectronaut and downstream analysis in R using MSstats-compatible formats.
    version: '1.0'
