external_resources:
- name: Infrastructure, standards, and tooling the dataset depends on
  description: >-
    The dataset is not self-contained: it is served from a controlled-access secure cloud enclave and
    depends on external standards, schemas, and software maintained inside and outside the CHoRUS
    consortium.
  external_resources:
  - CHoRUS secure cloud enclave; dockerized container applications and configurations deployed to
    support CHoRUS services on Azure (chorus-container-apps)
  - chorus-ai GitHub organization (28 repositories) hosting software and tooling, validated semantic
    mappings, standard operating protocols (SOPs) for data contributing sites, and project management
    overviews
  - OHDSI/OMOP Common Data Model and the OHDSI tool stack
  - OHNLP toolkit and OHNLP open-source note schema
  - DICOM schema and RSNA Clinical Trial Processor
  - WFDB waveform standard (published metadata schema described in the source as "PhysioNet schema
    extended")
  - EDF+ and Persyst open-source EEG schemas
  - RO-Crate 1.2 metadata profile and the Croissant Responsible AI (rai) specification
  - AIM-AHEAD Connect and InfoReady platforms, used to register for and administer trainee access to
    the dataset
  future_guarantees:
  - 'Deprecation policy includes advance notice of schema changes, a backward compatibility window
    where feasible, and archive of prior versions within the enclave where possible or incremental
    change records.'
  restrictions:
  - Access is restricted to the secure enclave environment; no raw data export is permitted unless
    explicitly approved.
  - Clinical notes are stored locally at contributing sites; only tokens are held in the enclave.

purposes:
- name: Generate an AI-ready critical care dataset
  description: Primary stated purpose of the CHoRUS data generation project.
  response: >-
    The project's overarching goal is to develop a publicly available, AI-ready critical care
    dataset, while ensuring the methods promote privacy, accountability, and clinical benefit, while
    promoting a new generation of AI clinicians and scientists. As part of the NIH Common Fund's
    Bridge2AI program, the CHoRUS for Clinical Care AI data generation project will meet the need of
    generating data for ML/AI applications aimed at characterizing acute and critical care illness,
    predicting complications, and measuring treatment response among patients with acute or critical
    illness.
- name: Enable secure, auditable, and reproducible AI research on recovery from acute illness
  description: Purpose as stated in the RO-Crate package metadata.
  response: >-
    The repository is designed to enable secure, auditable, and reproducible artificial intelligence
    (AI) research to improve recovery from acute illness. CHoRUS supports AI model development,
    validation, benchmarking, and translational research while maintaining compliance with HIPAA and
    NIH data-sharing policies. The goal of the CHoRUS Network is to develop the most diverse,
    high-resolution, ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness.
- name: Provision a holdout test set for external model validation
  description: Purpose relating to marketplace adoption of AI models in acute and critical care.
  response: >-
    The dataset will also provision a holdout test set, accessible for model external validation to
    aid marketplace adoption of AI-developed models for implementation in acute and critical care.
- name: Establish ethical and legal frameworks and build AI workforce capacity
  description: Purposes associated with the project's Ethics and People pillars.
  response: >-
    Through 3 pillars - Data (Standards, Tool Development and Optimization, and Data Acquisition),
    Ethics (Ethical and Trustworthy AI), and People (Team Science and Skill and Workforce
    Development) - the project establishes a legal framework for collecting data at scale, performs
    community-facing ethics focus groups to determine what data is appropriate for public sharing,
    and cultivates expertise in the lay and scientific community to improve AI literacy and
    utilization through multimodal educational approaches.

tasks:
- name: Characterize acute and critical care illness
  response: >-
    Generating data for ML/AI applications aimed at characterizing acute and critical care illness
    among patients with acute or critical illness.
- name: Predict complications and clinical deterioration
  response: >-
    Generating data for ML/AI applications aimed at predicting complications among patients with
    acute or critical illness. A visualization and annotation environment labels data with targets
    important for prediction.
- name: Measure treatment response
  response: >-
    Generating data for ML/AI applications aimed at measuring treatment response among patients with
    acute or critical illness.
- name: External validation of AI models on a sequestered holdout set
  response: >-
    Sequestering holdout datasets for external validation, accessible for model external validation
    to aid marketplace adoption of AI-developed models for implementation in acute and critical care.

addressing_gaps:
- name: Absence of infrastructure for AI/ML in critical care
  response: >-
    There is an urgent need for infrastructure to support artificial intelligence and machine
    learning (AI/ML) in critical care. Developing high-resolution multi-center data sets is a
    critical first step towards actionable and trustworthy AI.
- name: Lack of diverse, high-resolution, ethically sourced multi-center critical care data
  response: >-
    The project addresses multiple challenges relevant for acquiring an AI-ready data set from more
    than 100,000 critically ill patients, spanning data standards and acquisition, ethics, and
    workforce development. The goal of the CHoRUS Network is to develop the most diverse,
    high-resolution, ethically sourced, AI-ready data set to answer the grand challenge of improving
    recovery from acute illness.
- name: Absence of a legal and ethical framework for large-scale clinical data sharing
  response: >-
    The project establishes a legal framework for collecting data at scale, performs community-facing
    ethics focus groups to determine what data is appropriate for public sharing, and ensures that
    data elements feature appropriate contextual factors such as geographic distance to the nearest
    hospital. Patient-focused efforts determine the ethical and legal approaches to manage privacy
    and bias, while accounting for Social Determinants of Health.

