id: https://doi.org/10.18130/V3/XNBOPG
name: CHoRUS for Clinical Care AI Dataset
title: 'The Bridge2AI CHoRUS for Clinical Care AI Dataset: A Multi-Center, Multi-Modal,
  High-Resolution Critical Care Dataset'
description: >-
  The Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care AI is a
  clinical data network developing a flagship multi-hospital, multimodal, high-resolution dataset
  under the NIH Bridge2AI program. CHoRUS harmonizes electronic health record (EHR) data, imaging,
  high-resolution physiologic signals (including telemetry data and EEG where available), and
  tokenized note and report text (via OHNLP toolkit) with raw text retained locally across
  participating institutions using standardized data models and governance frameworks.


  The repository is designed to enable secure, auditable, and reproducible artificial intelligence
  (AI) research to improve recovery from acute illness. Data are curated within a NIST 800-53-aligned
  secure enclave architecture with role-based access controls, audit logging, and controlled-access
  governance review. CHoRUS supports AI model development, validation, benchmarking, and
  translational research while maintaining compliance with HIPAA and NIH data-sharing policies.


  The CHoRUS Network spans 20 academic centers, of which 14 contribute as Data Acquisition centers,
  with 60+ consortium members. The anticipated final dataset covers 100,000 patient admissions
  across 9 data modalities. As of the project website snapshot in the current source bundle, the
  released dataset covers 50,000 patient admissions from ICU, PICU, and NICU settings, 1.6 billion
  rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data. A
  September 2025 program webinar reported that, as of August 2025, the dataset covered 14 hospitals
  with over 45,000 unique admissions, with imaging then limited to approximately 1,000 images and
  EEG extraction in process.


  This record documents the CHoRUS RO-Crate Package version 1.0 Beta, published 2026-04-03 under
  DOI 10.18130/V3/XNBOPG, which the crate itself characterizes as an interim release with partial
  data in which not all patients in the CHoRUS full cohort are included and no DICOM images are
  included. Where the project website and the crate report different figures, the difference
  reflects the difference between the CHoRUS enclave dataset as a whole and this packaged interim
  release; both scopes are stated explicitly throughout this record.
