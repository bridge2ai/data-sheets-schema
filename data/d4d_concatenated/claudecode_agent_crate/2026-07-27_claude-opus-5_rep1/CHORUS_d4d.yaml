extension_mechanism:
  name: Mechanisms for external contribution
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - The following description of the GitHub contribution surface is drawn from the CHoRUS GitHub
    organization overview captured 2025-11-14 and is current as of that capture; the present project
    website does not preserve this detail.
  - The chorus-ai GitHub organization houses 28 active repositories providing software and tooling,
    validated semantic mappings, standard operating protocols, and project management overviews, and
    directs anticipated user groups - data site managers, clinical collaborators, project managers,
    software developers, and community users - to appropriate locations within the repository space.
  - Clinical collaborators may contribute semantic mappings through the chorus-mapping repository,
    which holds documentation and pooled tabular mappings along with an associated clinical
    validation SOP.
  - Issues encountered in the creation or submission of a data extract can be posted in
    context-specific discussion locations, namely the Standards Discussions and Data Acquisition
    Discussions.
  - Data contributing sites submit regular status updates through the GitHub interface or a Google
    Form; a GoogleScript triggered on each submission calls the GitHub API to update status and issue
    information, with statuses landing in the Standards Project or the Data Acquisition Project.
  - A web guide compiled in the chorus-developer repository serves both contributors and users of the
    CHoRUS software packages, and a package status page reports versions, maintainers, and other
    metadata about CHoRUS packages.
  - Contact for involvement in downstream analytics on the mapped and assembled dataset, and for
    access requests, is dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.

is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    De-identification consistent with HIPAA Safe Harbor, performed before data enter a NIST
    800-53-aligned secure enclave. The crate declares the dataset de-identified.
  identifiers_removed:
  - Removal or tokenization of direct identifiers
  - Date shifting or limited date fields when required
  - Imaging metadata de-identification using RSNA Clinical Trial Processor
  - Pixel-level image de-identification using IbisWorks EICON
  - Clinical note text tokenized using the OHNLP toolkit, with raw text retained locally at the
    contributing site
  deidentification_details:
  - Data are transformed using approaches that limit re-identification.
  - 'Residual risk is acknowledged and managed rather than assumed absent: re-identification risk is
    periodically assessed and mitigation strategies updated as needed, re-identification attempts are
    prohibited, and data export restrictions and output review procedures are applied to reduce risk
    of re-identification.'
  - Layered privacy protection includes de-identification, a data use agreement, and a
    controlled-access data repository with adherence to NIST 800-53 principles, audit-level
    protection, registration, role-based access controls, and protection against data exfiltration.
  used_software:
  - id: urn:chorus:software:rsna-clinical-trial-processor
    name: RSNA Clinical Trial Processor
  - id: urn:chorus:software:ibisworks-eicon
    name: IbisWorks EICON
  - id: urn:chorus:software:privacy-scan-tool
    name: privacy_scan_tool

