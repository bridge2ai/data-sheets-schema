id: https://doi.org/10.18130/V3/XNBOPG
name: CHoRUS for Clinical Care AI Dataset
title: >-
  The Bridge2AI CHoRUS for Clinical Care AI Dataset: A Multi-Center, Multi-Modal,
  High-Resolution Critical Care Dataset
description: >-
  The Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care AI is a
  clinical data network developing a flagship multi-hospital, multimodal, high-resolution
  dataset under the NIH Bridge2AI program. CHoRUS harmonizes electronic health record (EHR)
  data, imaging, high-resolution physiologic signals (including telemetry data and EEG where
  available), and tokenized note and report text (via OHNLP toolkit) with raw text retained
  locally across participating institutions using standardized data models and governance
  frameworks. The repository is designed to enable secure, auditable, and reproducible
  artificial intelligence (AI) research to improve recovery from acute illness. Data are
  curated within a NIST 800-53-aligned secure enclave architecture with role-based access
  controls, audit logging, and controlled-access governance review. CHoRUS supports AI model
  development, validation, benchmarking, and translational research while maintaining
  compliance with HIPAA and NIH data-sharing policies.
  The referent of this record is the released CHoRUS dataset as packaged and described by the
  RO-Crate evidence; the packaged artifact itself is named "CHoRUS RO-Crate Package" in that
  metadata and is composed of an EHR sub-crate (18.136671 mb) and a waveforms sub-crate
  (1.201567472832 tb), with a stated top-level content size of 1.2 tb. The stated publisher of
  the package is "B2AI CHoRUS".
  Reported scale differs by source and reporting date: the NIH RePORTER abstract describes an
  intended AI-ready data set from more than 100,000 critically ill patients; the project
  website reports an anticipated final dataset of 100,000 patient admissions, 9 data
  modalities and 14 contributing hospitals, and a current released dataset of 50,000 ICU,
  PICU and NICU admissions, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology
  data and 23 Tb of waveform data; the September 2025 training webinar states that as of
  August 2025 the dataset covered 14 hospitals with over 45K unique admissions.
version: 1.0 Beta
doi: 10.18130/V3/XNBOPG
license: "Data Use Agreement available at 'https://chorus4ai.org/dataset/'"
page: https://chorus4ai.org/dataset/
issued: '2026-04-03T00:00:00'
created_by: >-
  The CHoRUS for Clinical Care AI Network (B2AI CHoRUS), led from Massachusetts General
  Hospital; principal investigator Eric S. Rosenthal (EROSENTHAL@mgh.harvard.edu). The
  publisher recorded in the source metadata is "B2AI CHoRUS".
status: >-
  Version 1.0 Beta interim release with partial data; the RO-Crate completeness statement
  notes that not all patients in the CHoRUS full cohort are included and that no DICOM
  images are included in this package. The project website carries the notice, quoted
  verbatim, that "This repoitory is under review for potential modification in compliance
  with Administration directives."
conforms_to_schema: >-
  OMOP Common Data Model for structured electronic health record data, with modality-specific
  standards for other components (OHNLP for tokenized clinical notes, DICOM for imaging, WFDB
  with an extended PhysioNet schema for waveform telemetry, and EDF+ and Persyst for EEG).
was_derived_from: >-
  Routine clinical care data repurposed from electronic health record systems, PACS imaging
  archives, bedside monitor/gateway middleware and hospital EEG databases at 14 data
  acquisition hospitals within the 20-institution CHoRUS academic network.
keywords:
