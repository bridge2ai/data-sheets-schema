id: https://b2ai-voice.org/
name: Bridge2AI-Voice
title: Bridge2AI-Voice Dataset
description: |-
  Bridge2AI-Voice (B2AI-Voice) is a large, ethically sourced, demographically diverse collection of voice, speech, cough and respiratory audio linked to health information, produced by the Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program. The stated aim is to support the use of voice as a biomarker of health by supplying standardized, AI/ML-ready acoustic data linked to multimodal health biomarkers (demographics, validated questionnaires, clinical diagnoses, and, at some sites, imaging and genomic data). Data acquisition is centred on five disease cohort categories - voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and pediatric voice and speech disorders - plus controls.
  Two distinct released datasets are documented in the sources and are collected under separate protocols and at different sites. The adult flagship dataset is published on PhysioNet as "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"; its current release is v3.1.0 (1 May 2026), containing data for 833 participants across five North American sites. The pediatric dataset is published as a separate PhysioNet project, "Bridge2AI-Voice Pediatric Dataset"; its current release is v1.1.0 (1 May 2026), containing 23,533 derived recordings from 300 participants aged 2-18 recruited at the Hospital for Sick Children (SickKids). The two releases are distinct cohorts, not versions of one another, and the sources do not report combined counts.
  The public PhysioNet releases are feature-only: they contain de-identified derivations of the audio (spectrograms, mel spectrograms, MFCCs, pitch, loudness, periodicity, articulatory/EMA estimates, phonetic posteriorgrams, and static acoustic features) together with tabular phenotype files and data dictionaries, but not the original waveforms. Raw audio is distributed separately under controlled access via Synapse after institutional sign-off.
