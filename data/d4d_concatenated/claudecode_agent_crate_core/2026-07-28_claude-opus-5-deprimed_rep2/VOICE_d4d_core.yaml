language: >-
  English. English language was used for communication with study participants, and the project
  documentation states that "the only language option for v2.0.0 is English" and that Spanish
  versions of the protocol are under development. An exclusion criterion for the adult study
  is not reading or speaking English, with the documentation noting that Spanish protocols
  and data collection will be included in future releases; the IRB protocol was updated in
  February 2025 to include data collection from Spanish language speakers. The pediatric study
  required English proficiency. No released version is reported to contain non-English data.
license: >-
