- id: https://doi.org/10.13026/h995-bt35
  name: Bridge2AI-Voice Pediatric Dataset v1.1.0 (PhysioNet)
  title: Bridge2AI-Voice Pediatric Dataset v1.1.0
  description: >-
    Current release of the Bridge2AI-Voice pediatric dataset, published 1 May 2026. A separate
    PhysioNet project from the adult b2ai-voice dataset, not a version of it; the two releases
    are distinct cohorts collected under a separate pediatric protocol. Contains derived audio
    features for 23,533 recordings collected from 300 participants aged 2-18 at the Hospital
    for Sick Children. Eligibility required age 2 to 18 and English proficiency; participants
    over 18 and individuals who were non-verbal were excluded. Non-patients were recruited
    through research postings. All data were collected through reproschema-ui on tablets,
    with a headset used for most participants and the built-in tablet microphone used where
    headphones were not tolerated or complex medical conditions applied; all participants
    completed recording and demographic collection in a single session, with parents or decision-makers
    completing the survey on a separate tablet where the participant lacked adequate comprehension
    or familiarity with their medical history. Feature counts: torchaudio spectrograms, mel
    spectrograms, MFCCs and pitch n=23,533; sparc EMA, loudness, periodicity and pitch n=23,532;
    PPGs n=23,533. v1.1.0 released no new participants but added audio features for all free
    speech tasks that were manually checked for the presence of unconsented speakers and PII,
    new audio quality metrics, and per-recording metadata. Version 1.0.0 was published 17
    December 2025.
