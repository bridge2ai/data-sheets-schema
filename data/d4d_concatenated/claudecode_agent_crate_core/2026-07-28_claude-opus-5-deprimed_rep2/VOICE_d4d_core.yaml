    of clinically applicable machine-learning models for diagnosing a wide range of health
    conditions using voice data, including vocal pathologies, neurological, psychiatric, respiratory,
    and pediatric voice disorders. The dataset contains voice recordings and key metadata,
    and is structured to be Findable, Accessible, Interoperable and Reusable (FAIR).
- name: Build an ethically sourced, diverse, multi-institutional voice database
  description: Stated objective of the funded Bridge2AI-Voice grand challenge project.
  response: >-
    The group aims to integrate the use of voice as a biomarker of health in clinical care
    by generating a substantial multi-institutional, ethically sourced and diverse voice database
    linked to multimodal health biomarkers to fuel voice AI research and build predictive
    models to assist in screening, diagnosis and treatment of a broad range of diseases. Data
    collection is made possible through a smartphone application linked to electronic health
    records and other health biomarkers such as radiomics and genomics, and supported by federated
    learning technology to protect data privacy.
- name: Support the emerging field of audiomics
  description: Purpose stated in the consortium's audiomics viewpoint article.
  response: >-
    Through the Bridge2AI program, the Bridge2AI-Voice team gathered 50 multidisciplinary
    experts from 12 North American institutions to generate high-quality, ethically sourced
    datasets for biomedical research to advance the field of audiomics. Besides the primary
    deliverable of building a publicly available database of 30,000 human voices, the team
    aims to ensure quality and accuracy of acoustic and associated clinical data through clinical
    validation and evidence-based recording protocols; aim for interoperability by creating
    new bioinformatics standards for voice data; create benchmarks of diversity metrics and
    minimize risk of algorithmic bias; define ethical and legal norms safeguarding patients'
    data while supporting data-sharing efforts; develop infrastructure for audiomics data
    storage and sharing within and across research institutions; and formulate training pathways
    for scientists, engineers, bioethicists and clinicians.
- name: Research applications
  description: Applications the dataset is meant to address.
  response: >-
    The Bridge2AI Voice dataset is primarily intended for research applications, specifically
    in the development of AI and machine-learning models for healthcare. It aims to support
    clinical research in disease screening, diagnosis and monitoring through voice biomarkers.
    The dataset can be used for AI model pretraining, fine-tuning, benchmarking or validation.
tasks:
- name: Predefined disease detection and classification tasks
  description: Tasks and labels shipped with the release, per the project documentation.
  response: >-
    The current version of the dataset comes with predefined tasks and labeling. The tasks
    are primarily designed for training machine-learning models for disease detection and
    classification using voice data. Labels include diagnostic categories such as vocal pathologies,
    neurological disorders, psychiatric conditions and respiratory disorders. There are no
    predefined recommended data splits for training, validation or testing; researchers are
    encouraged to create their own data splits based on their specific requirements.
- name: Acoustic task protocol
  description: Standardized acoustic tasks recorded for each participant.
  response: >-
    A total of 22 acoustic tasks are recorded through the adult app, spanning non-voice and
    non-speech tasks (respiration, voluntary cough, breath sounds), voice but non-speech tasks
    (prolonged vowel, maximum phonation time, glides, loudness, diadochokinesis) and speech
    tasks (Rainbow Passage, Caterpillar Passage, CAPE-V sentences, free speech, picture description,
    story recall, animal fluency, open response questions, word-colour Stroop, productive
    vocabulary, random item generation, Cinderella story). Pediatric tasks are age-appropriate
    and include ABCs, ready for school, favourite show, favourite food, outside of school,
    months, counting, naming animals, naming food, identifying pictures, picture description,
    long sounds, noisy sounds, Caterpillar Passage, repeat words, role naming, repeat sentences
    and silly sounds.
addressing_gaps:
- name: Lack of large, diverse, well-documented voice data for clinical machine learning
  description: Gap the dataset was created to fill.
  response: >-
    The Bridge2AI Voice dataset was created to address a gap in the availability of large-scale,
    diverse and well-documented voice data for use in clinical machine-learning applications.
    Previous studies on machine learning-based voice diagnosis produced promising results,
    but their sample sizes were too small, or they lacked the key metadata needed for training
    robust, clinically useful models. The dataset aims to bridge this gap by providing an
    ethically sourced, large and diverse dataset to develop, benchmark or validate clinically
    applicable AI/ML models, so that voice can be used as a non-invasive, cost-effective biomarker
    for screening, diagnosis and monitoring of a wide range of health conditions.
- name: Absence of standards for voice data collection and analysis
  description: Standards gap identified in the consortium's publications.
  response: >-
    Comparing studies and pooling data is challenging due to a lack of existing standards
    in how voice and other acoustics are measured and collected. Within industry, datasets
    are often private, limiting the ability to audit machine-learning models and the accuracy
    of training data labels; industry has access to vast amounts of voice data but lacks accurate
    clinical data or demographic information. A specific project aim is to introduce the field
    of acoustic biomarkers by developing new standards of acoustic and voice data collection
    and analysis for voice AI research.
- name: Sparse pediatric voice and speech evidence
  description: Gap motivating the separate pediatric cohort.
  response: >-
    Pediatric and adult voice and speech production are fundamentally different because the
    respiratory system and larynx undergo rapid functional maturation throughout childhood,
    so normative data from adults cannot be generalized to pediatric populations. Despite
    the clinical importance of detecting pediatric communication disorders such as autism
    spectrum disorder and speech delays, the availability of large-scale pediatric datasets
    remains limited, with unique challenges around privacy, consent processes and the need
    for developmentally appropriate tasks.
