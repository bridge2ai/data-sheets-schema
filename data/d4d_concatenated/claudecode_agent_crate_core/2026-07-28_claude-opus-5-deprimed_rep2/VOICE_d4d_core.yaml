    latest version of the b2ai-voice-pediatric project.
  - >-
    The files for adult version 1.1 are no longer available on PhysioNet; users are directed
    to the latest version.
extension_mechanism:
  name: Extension and contribution mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
  - >-
    For dataset extensions and augmentations, it is possible for others to publish a derivative
    dataset on the Health Data Nexus which references the original source. These derivative
    datasets may be made available under the same conditions as the source data.
  - >-
    For augmentations to the code used to produce the data, the open-source repositories have
    discussion forums and issue pages which allow for public discussion of data preprocessing.
    The repository also has a mechanism (pull requests) for contributing improvements to the
    data preprocessing code.
is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  method: >-
    Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive,
    have been removed from this dataset. HIPAA Safe Harbor identifiers were removed and HIPAA
    de-identification rules applied. The dataset has been de-identified through removal of
    all audio data and certain sensitive fields identified by a team of ethicists. The RO-Crate
    for adult release v3.0.0 records deidentified true.
  identifiers_removed:
  - Names
  - Civic addresses
  - Social security numbers
  - Geographic locators; state and province removed, country of data collection retained
  - Date information at resolution finer than years; dates rebased or replaced by integers
  - Phone and fax numbers
  - Email addresses
  - IP addresses
  - Medical record numbers
  - Health plan beneficiary numbers
  - Device identifiers
  - License numbers
  - Account numbers
  - Vehicle identifiers
  - Website URLs
  - Full face photos
  - Biometric identifiers, including raw voice waveforms
  - Narrative text fields and transcripts of free speech audio
  - >-
    Select geographic or demographic indirect identifiers, and some information about household
    composition or cultural identity
  - >-
    Non-identifying but highly sensitive elements such as household income, mental health
    status and traumatic life experiences
  deidentification_details:
  - >-
    Direct identifiers are removed; HIPAA de-identification rules are applied; dates are rebased
    and/or replaced by integers; geographic information is removed or generalized; narrative
    text fields are removed. The dataset does not achieve k-anonymization with k greater than
    or equal to 2.
  - >-
    Raw audio transcripts were reviewed and any audio recordings containing potentially identifying
    information or external voices were removed from the release. All sensitive fields were
    removed, corresponding to data elements encoded as sensitive (column name "Identifier?")
    listed in the REDCap data dictionary. In addition, all spectrograms, MFCCs, Mel spectrograms,
    transcriptions, EMAs and PPGs from open-response prompts are removed from the feature-only
    dataset.
  - >-
    For the pediatric v1.1.0 release, audio features for all free speech tasks were manually
    checked for the presence of unconsented speakers and personally identifiable information
    before release.
