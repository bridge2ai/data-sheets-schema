data_collectors:
- name: Data contributing sites and CHoRUS sub-teams
  role: Data acquisition centers and site data managers
  collector_details:
  - The collaboration spans 20 academic centers, of which 14 will contribute as Data Acquisition centers.
  - Data site managers at contributing sites extract and submit data following the Chorus_SOP workflow,
    and provide regular status updates on their progress in creating and curating a CHoRUS-specific clinical
    data extract.
  - Sub-teams within the CHoRUS data generation project include Standards, Data Acquisition, and Tooling.
