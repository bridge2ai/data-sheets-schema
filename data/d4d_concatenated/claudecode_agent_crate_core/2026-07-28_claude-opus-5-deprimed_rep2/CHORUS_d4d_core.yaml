updates:
  name: Versioned release and deprecation plan
  update_details:
  - Versioned dataset releases e.g., CHoRUS vX.Y).
  - Release notes documenting schema changes, harmonization updates, and known issues.
  - Governance committee oversight for structural modifications.
  - Data upload.
  - 'Deprecation policy includes: advance notice of schema changes; backward compatibility window where
    feasible; archive of prior versions within enclave where possible or incremental change records.'
  - 'Primary maintainers: CHoRUS Data Pillar in collaboration with institutional data stewards.'
version_access:
  name: Version availability and deprecation
  latest_version_doi: https://doi.org/10.18130/V3/XNBOPG
