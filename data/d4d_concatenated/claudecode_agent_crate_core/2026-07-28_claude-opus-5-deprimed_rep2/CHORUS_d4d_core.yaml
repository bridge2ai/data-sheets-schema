    point for IRB Reliance and Compliance irbreliance@mgb.org, telephone +1-857-282-1900, 399 Revolution
    Drive, Suite 710, Somerville, MA 02145, US. Contact person: Eric S. Rosenthal (EROSENTHAL@mgh.harvard.edu).'
  review_details:
