purposes:
- name: AI-ready critical care dataset for the NIH Bridge2AI program
  response: The project's overarching goal is to develop a publicly available, AI-ready critical care
    dataset, while ensuring the methods promote privacy, accountability, and clinical benefit, while promoting
    a new generation of AI clinicians and scientists. The CHoRUS data generation project will meet the
    need of generating data for ML/AI applications aimed at characterizing acute and critical care illness,
    predicting complications, and measuring treatment response among patients with acute or critical illness.
- name: Secure, auditable, and reproducible AI research on recovery from acute illness
  response: The repository is designed to enable secure, auditable, and reproducible artificial intelligence
    (AI) research to improve recovery from acute illness. CHoRUS supports AI model development, validation,
    benchmarking, and translational research while maintaining compliance with HIPAA and NIH data-sharing
    policies.
- name: Ethically sourced datasets and best practices for AI in health
  response: The CHoRUS project is one data generation project of four in the National Institute of Health
    (NIH) funded Bridge2AI consortium. The goal is to work with projects to create ethically sourced datasets
    and tools around Artificial Intelligence and to create best practices for AI in health. The goal of
    the CHoRUS Network is to develop the most diverse, high-resolution, ethically sourced, AI-ready data
    set to answer the grand challenge of improving recovery from acute illness.
tasks:
- name: Characterization, prediction, and treatment response in acute and critical illness
  response: Generating data for ML/AI applications aimed at characterizing acute and critical care illness,
    predicting complications, and measuring treatment response among patients with acute or critical illness.
- name: Model development, validation, and benchmarking
  response: Supporting AI model development, validation, benchmarking, and translational research, including
    AI model training within the enclave, algorithm development and feature engineering, fine-tuning of
    multimodal models, and methodological research in trustworthy AI.
- name: External validation of AI models against a holdout test set
  response: The dataset will also provision a holdout test set, accessible for model external validation
    to aid marketplace adoption of AI-developed models for implementation in acute and critical care.
addressing_gaps:
- name: Infrastructure gap for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence and machine
    learning (AI/ML) in critical care. Developing high-resolution multi-center data sets is a critical
    first step towards actionable and trustworthy AI.
- name: Absence of a diverse, high-resolution, ethically sourced critical care dataset
  response: 'The goal of the CHoRUS Network is to develop the most diverse, high-resolution, ethically
    sourced, AI-ready data set to answer the grand challenge of improving recovery from acute illness.
    The project addresses multiple challenges relevant for acquiring an AI-ready data set from more than
    100,000 critically ill patients across three pillars: Data (standards, tool development and optimization,
    and data acquisition), Ethics (ethical and trustworthy AI), and People (team science and skill and
    workforce development).'
- name: Legal, ethical, and standards gaps for large-scale clinical data sharing
  response: The project will establish a legal framework for collecting data at scale; perform community-facing
    ethics focus groups to determine what data is appropriate for public sharing; ensure that data elements
    feature appropriate contextual factors such as geographic distance to the nearest hospital; develop
    capabilities across a multi-center network to acquire, standardize, tokenize, store, visualize, and
    label data; acquire and standardize data to the OMOP Common Data Model using approaches that limit
    re-identification; and cultivate expertise in the lay and scientific community to improve AI literacy
    and utilization.
