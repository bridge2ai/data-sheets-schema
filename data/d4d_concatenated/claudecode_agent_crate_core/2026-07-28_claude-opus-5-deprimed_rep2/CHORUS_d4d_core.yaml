confidential_elements:
- name: Patient-level clinical data under very restricted confidentiality
  confidential_elements_present: true
  confidentiality_details:
  - Confidentiality level recorded as 'HL7:2V (very restricted)'.
  - Data are derived from routine clinical care at participating hospitals and are curated within a NIST
    800-53-aligned secure enclave architecture with role-based access controls, audit logging, and controlled-access
    governance review.
  - Access is restricted to the secure enclave environment; no raw data export is permitted unless explicitly
    approved.
subpopulations:
- name: Critical care settings
  subpopulation_elements_present: true
  identification:
  - Care setting of the admission, distinguishing ICU, PICU, and NICU populations.
  - Demographics standardized to the OMOP Common Data Model.
  distribution:
  - The current released dataset comprises 50,000 patient admissions from ICU, PICU, and NICU.
  - Socioeconomic and demographic distribution reflective of participating institutions.
sensitive_elements:
- name: Clinical, imaging, waveform, and narrative patient data
  sensitive_elements_present: true
  sensitivity_details:
  - Structured electronic health record data, tokenized unstructured electronic health record data, telemetry
    and EEG waveforms, imaging, and social determinants of health.
  - Direct identifiers are removed or tokenized, with date shifting or limited date fields when required.
  - CHoRUS operates within a secure enclave environment aligned with NIST 800-53 controls.
acquisition_methods:
- name: Repurposed routine clinical documentation
  was_directly_observed: true
  acquisition_details:
  - Data are derived from routine clinical care at participating hospitals under IRB oversight.
  - Data are not collected solely for research but repurposed from clinical workflows under ethical oversight.
  - Retrospective data collection.
collection_mechanisms:
- name: Multi-center extraction, standardization, and enclave ingestion
  mechanism_details:
  - Electronic health record extraction and transformation to OMOP common data model.
  - High-resolution physiologic waveform capture extraction and transformation to the WFDB standard.
  - Clinical notes extracted and tokenized using the OHNLP toolkit, with raw text retained locally.
  - Imaging extracted from hospital PACS; waveform telemetry captured from bedside monitors and gateway/middleware;
    EEG waveforms extracted from hospital databases.
  - Standardized harmonization to common data model.
  - Data site managers at contributing sites follow the Chorus_SOP workflow, which provides a step-by-step
    process for extracting and contributing clinical data to CHoRUS with links to SOP documents that have
    undergone an internal validation and review process.
  - Validated semantic mappings connect clinical data in various source formats to international standards.
  used_software:
  - id: urn:chorus:software:ohnlp-toolkit
    name: OHNLP toolkit
    description: Toolkit used to extract and tokenize clinical notes; the published metadata schema is
      the OHNLP open source schema.
  - id: https://github.com/chorus-ai/chorus-extract-upload
    name: chorus-extract-upload
    description: Repository with tools to create and upload a CHoRUS Data Extract.
    license: MIT
    url: https://github.com/chorus-ai/chorus-extract-upload
  - id: https://github.com/chorus-ai/chorus-container-apps
