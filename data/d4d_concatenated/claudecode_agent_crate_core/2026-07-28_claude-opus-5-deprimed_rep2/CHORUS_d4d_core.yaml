labeling_strategies:
- name: Annotation, labeling, and semantic mapping
  labeling_details:
  - Develop capabilities across a multi-center network to acquire, standardize, tokenize, store, visualize,
    and label data such as structured electronic health record data, tokenized unstructured electronic
    health record data, telemetry and EEG waveforms, imaging, and social determinants of health.
  - A visualization and annotation environment will label data with targets important for prediction.
  data_annotation_platform:
  - CHoRUS visualization and annotation environment.
  data_annotation_protocol:
  - The chorus-mapping repository provides documentation and pooled tabular mappings along with an associated
    clinical validation SOP for contributing to mapping efforts.
  - Validated semantic mappings connect clinical data in various source formats to international standards.
machine_annotation_tools:
- name: Automated tokenization, de-identification, and geocoding tools
  tools:
  - OHNLP toolkit
  - RSNA Clinical Trial Processor
  - IbisWorks EICON
  - DeGauss (via UF-Geocoding)
  tool_descriptions:
  - OHNLP toolkit is used to extract and tokenize clinical notes and reports, with raw text retained locally.
  - RSNA Clinical Trial Processor is used for imaging metadata de-identification.
  - IbisWorks EICON is used for pixel-level de-identification of imaging.
  - DeGauss, applied through the UF-Geocoding tool, geocodes OMOP Location entities.
  used_software:
  - id: urn:chorus:software:ohnlp-toolkit
    name: OHNLP toolkit
    description: Toolkit used to extract and tokenize clinical notes; the published metadata schema is
      the OHNLP open source schema.
  - id: urn:chorus:software:rsna-clinical-trial-processor
    name: RSNA Clinical Trial Processor
    description: Used for imaging metadata de-identification.
  - id: urn:chorus:software:ibisworks-eicon
    name: IbisWorks EICON
    description: Used for pixel-level de-identification of imaging.
existing_uses:
- name: Training activities, publications, and the AIM-AHEAD training program
  examples:
  - Datasets are being used for training activities and publications.
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI CHoRUS data
    through engagement, AI training, and mentorship, equipping trainees to apply AI/ML methods to big
    data analysis using multi-modal datasets from a broad range of cohort participants.
  - Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care Network and leverage the
    data and tools to create practical use cases.
future_use_impacts:
- name: Considerations affecting future use
  impact_details:
  - Bias assessment is ongoing and documented in dataset release notes.
  - Re-identification risk is periodically assessed and mitigation strategies updated as needed.
  - Observational data collected as real-world clinical data, not through prospective research interactions
    with patients, constrains the inferences that downstream users can draw.
  - Limited generalizability beyond participating hospitals, and population inference beyond participating
    institutions is not recommended.
discouraged_uses:
- name: Uses that are not recommended
  discouragement_details:
  - Direct translation of trained algorithms to real-time clinical deployment without validation or regulatory
    clearance.
  - Use as sole evidence for clinical decision-making.
  - Population inference beyond participating institutions.
intended_uses:
- name: Recommended research uses within the enclave
  examples:
  - AI model training within enclave.
  - Model validation and benchmarking.
  - Algorithm development and feature engineering.
  - Retrospective hypothesis testing.
  - Fine-tuning of multimodal models.
  - Comparative effectiveness research.
  - Reinforcement learning and development of expert AI.
  - Methodological research in trustworthy AI.
  - Trial emulation or powering.
  usage_notes: Usage must align with approved research scope and governance policies.
  use_category:
  - AI model development and validation
  - Biomedical and health services research
  - Methodological research in trustworthy AI
prohibited_uses:
- name: Uses excluded by governance, license, and ethics
  prohibition_reason:
  - Prohibition of re-identification attempts.
  - Not appropriate for re-identification, contact tracing, or patient-level intervention.
  - Access is restricted to the secure enclave environment; no raw data export is permitted unless explicitly
    approved.
  - Data use may not be used for commercial purposes unless specifically authorized through a separate
    agreement consistent with governing award and consortium terms.
distribution_formats:
- name: Controlled-access distribution through the CHoRUS dataset portal and secure enclave
  description: The dataset is distributed as an RO-Crate package with electronic health record and waveform
    sub-crates, referenced by DOI 10.18130/V3/XNBOPG. Recorded formats include .ipynb, text/tab-separated-values,
    and wfdb, alongside DICOM for imaging and EDF+ and Persyst for EEG. Analysis access is provided within
    a secure enclave environment; the OMOP and telemetry data are held in the enclave, while clinical
    notes are stored locally except for tokens.
  access_urls:
  - https://chorus4ai.org/dataset/
  - https://doi.org/10.18130/V3/XNBOPG
  - http://chorus4ai.org/dataset
distribution_dates:
- name: Version 1.0 Beta release
  description: The RO-Crate metadata records datePublished 2026-04-03 for the package and its waveforms
    sub-crate, and a releaseDate of 03/04/2026 for the same version.
  release_dates:
  - '2026-04-03'
