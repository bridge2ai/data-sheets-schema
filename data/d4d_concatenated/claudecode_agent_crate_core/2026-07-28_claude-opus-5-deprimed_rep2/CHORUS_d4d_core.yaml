  reviewing_organization: mailto:irbreliance@mgb.org
data_protection_impacts:
- name: Layered privacy protection and periodic re-identification risk assessment
  impact_details:
  - Layered privacy protection including de-identification, data use agreement, controlled access data
    repository with adherence to NIST 800-53 principles, audit-level protection, registration, role-based
    access controls, protection against data exfiltration.
  - Data export restrictions and output review procedures to reduce risk of re-identification.
  - Re-identification risk is periodically assessed and mitigation strategies updated as needed.
  - Acquire data, standardize data to the OMOP Common Data Model, and transform data using approaches
    that limit re-identification.
