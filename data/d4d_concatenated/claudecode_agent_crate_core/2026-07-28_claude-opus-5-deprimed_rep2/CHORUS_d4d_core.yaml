  - id: https://github.com/chorus-ai/UF-Geocoding
    name: UF-Geocoding
    description: Open source code to geocode OMOP Location entities via DeGauss.
    license: MIT
    url: https://github.com/chorus-ai/UF-Geocoding
  - id: urn:chorus:software:ohnlp-toolkit
    name: OHNLP toolkit
    description: Toolkit used to extract and tokenize clinical notes; the published metadata schema is
