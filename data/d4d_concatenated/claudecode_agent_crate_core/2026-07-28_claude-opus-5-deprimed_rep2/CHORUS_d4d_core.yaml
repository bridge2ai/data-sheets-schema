  - Advance notice of schema changes with a backward compatibility window where feasible.
extension_mechanism:
  name: Community contribution through the CHoRUS GitHub organization
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - The CHoRUS GitHub organization houses active repositories providing software and tooling to interact
    with and extract insight from clinical data in diverse formats, validated semantic mappings, standard
    operating protocols (SOPs) for data contributing sites, and project management overviews.
  - Clinical collaborators can contribute to mapping efforts through the chorus-mapping repository, which
    holds documentation and pooled tabular mappings along with an associated clinical validation SOP.
  - Data contributing sites submit regular status updates either using the GitHub interface directly or
    by submitting a Google Form; a GoogleScript triggered on each submission calls the GitHub API to update
    status and issue information.
  - Issues encountered in creating or submitting a data extract can be posted in the Standards Discussions
    or Data Acquisition Discussions.
  - A web guide for contributors and users of the CHoRUS software packages compiles documentation in the
    chorus-developer repository, and a package status page lists versions, maintainers, and other metadata
    about CHoRUS packages.
