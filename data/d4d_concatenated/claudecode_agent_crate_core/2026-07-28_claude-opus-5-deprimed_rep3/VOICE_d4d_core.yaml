purposes:
- name: Enable voice as a biomarker of health
  description: Primary motivation for creating the dataset.
  response: The Bridge2AI-Voice dataset was created to address a gap in the availability of large-scale,
    diverse and well-documented voice data for clinical machine-learning applications. Previous studies
    on machine-learning-based voice diagnosis produced promising results, but their sample sizes were
    too small or they lacked the key metadata needed for training robust, clinically useful models. The
    dataset aims to bridge this gap by providing an ethically sourced, large and diverse dataset with
    which to develop, benchmark or validate clinically applicable AI/ML models, facilitating the use of
    voice as a non-invasive, cost-effective biomarker for the screening, diagnosis and monitoring of a
    wide range of health conditions.
- name: Integrate voice into clinical care
  description: Programme-level objective stated in the funded project and IRB protocol.
  response: The group aims to integrate the use of voice as a biomarker of health into clinical care by
    generating a substantial multi-institutional, ethically sourced and diverse voice database linked
    to multimodal health biomarkers to fuel voice AI research and build predictive models that assist
    in the screening, diagnosis and treatment of a broad range of diseases. Data collection is made possible
    by software delivered through a smartphone application linked to electronic health records and other
    health biomarkers such as radiomics and genomics, and is supported by federated learning technology
    to protect data privacy.
- name: Establish the field of audiomics
  description: Field-building purpose described in the consortium's audiomics viewpoint.
  response: The consortium seeks to define and create standards for "audiomics", the interdisciplinary
    field of audio analysis applied to biomedicine to identify unique audio biomarkers of health and disease.
    Beyond the primary deliverable of a publicly available voice database, the team aims to ensure quality
    and accuracy of acoustic and associated clinical data through clinical validation and evidence-based
    recording protocols; achieve data interoperability by creating new bioinformatics standards for voice
    data; create benchmarks of diversity metrics and minimise the risk of algorithmic bias; define ethical
    and legal norms that safeguard patients' data while supporting data sharing; develop infrastructure
    for audiomics data storage and sharing within and across research institutions; and formulate training
    pathways for scientists, engineers, bioethicists and clinicians.
tasks:
- name: Disease detection and classification from voice
  description: Predefined modelling tasks that accompany the released dataset.
  response: The current version of the dataset comes with predefined tasks and labelling. The tasks are
    primarily designed for training machine-learning models for disease detection and classification using
    voice data. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders. There are no predefined recommended data splits
    for training, validation or testing; researchers are encouraged to create their own splits based on
    their specific requirements.
- name: Development, benchmarking and validation of clinical voice models
  description: Stated analytic purpose of the released feature data.
  response: The dataset is intended to enable the development, benchmarking or validation of clinically
    applicable machine-learning models for diagnosing a wide range of health conditions using voice data,
    including vocal pathologies and neurological, psychiatric, respiratory and pediatric voice disorders.
    It can be used for AI model pretraining, fine-tuning, benchmarking or validation.
- name: Acoustic task battery administered to participants
  description: The structured acquisition tasks that generate the acoustic data.
  response: A total of 22 acoustic tasks are recorded through the adult application, grouped as non-voice
    / non-speech (respiration, voluntary cough, breath sounds), voice / non-speech (prolonged vowel, maximum
    phonation time, glides, loudness, diadochokinesis) and speech (Rainbow Passage, Caterpillar Passage,
    CAPE-V sentences, free speech, picture description, story recall, animal fluency, open response questions,
    word-colour Stroop, productive vocabulary, random item generation, Cinderella story). The pediatric
    protocol adds age-appropriate tasks including ABCs, ready for school, favourite show, favourite food,
    outside of school, months, counting, naming animals, naming food, identifying pictures, picture description,
    long sounds, noisy sounds, repeat words, role naming, repeat sentences and silly sounds.
addressing_gaps:
- name: Absence of large, standardised, multimodal voice datasets
  description: The unmet need the dataset is designed to fill.
  response: Existing literature on voice biomarkers had been studied only on small- to medium-sized datasets
    with limited data outside acoustic measures and no linkage to multimodal health data. Comparing studies
    and pooling data is challenging because of a lack of standards in how voice and other acoustics are
    measured and collected. Industry holds vast amounts of voice data but lacks accurate clinical or demographic
    information, which prevents annotation for AI training, comparison against criterion-standard medical
    assessment and external auditing for fair representation. In a review of machine-learning applications
    for laryngeal cancer screening and diagnosis, most studies reported training datasets of fewer than
    300 patients and only two studies used more than one data modality. Bridge2AI-Voice addresses this
    by building a standardised, clinically validated, multi-institutional dataset linked to multimodal
    health biomarkers.
- name: Lack of governance norms for voice AI
  description: Ethical and legal gap the consortium set out to address.
  response: Unique ethical and legal challenges in audiomics - linked to the Health Insurance Portability
    and Accountability Act, potential reidentification of patients by their voice, voice hacking and data
    ownership - call for a new governance framework covering diversity, data handling and privacy safeguards.
    The consortium addresses the growing ethical, legal and social challenges surrounding voice AI, including
    risks of voice re-identification, vulnerabilities such as voice AI hacking, concerns around voice
    data sharing and privacy, and the influence of gender and racial diversity on the development and
    application of these technologies.
- name: Sparse pediatric voice and speech data
  description: Gap specific to the pediatric release.
  response: Pediatric and adult voice/speech production are fundamentally different because the respiratory
    system and larynx undergo rapid functional maturation throughout childhood, and these developmental
    changes influence acoustic features such as fundamental frequency, so normative evidence from adults
    cannot be generalised to pediatric populations. Despite the clinical importance of detecting pediatric
    communication disorders such as autism spectrum disorder and speech delays, large-scale pediatric
    datasets remain limited because data collection in children poses distinct challenges of privacy,
    consent and developmentally appropriate task design.
