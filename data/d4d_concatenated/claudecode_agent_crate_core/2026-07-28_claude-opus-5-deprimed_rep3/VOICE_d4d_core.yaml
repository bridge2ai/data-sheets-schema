  title: Bridge2AI-Voice Pediatric Dataset v1.1.0
  description: Pediatric release on PhysioNet, a separate PhysioNet project from the adult b2ai-voice
    dataset rather than a version of it. Contains derived audio features for 23,533 recordings collected
    from 300 participants aged 2-18. Participants (patients and healthy volunteers) were recruited at
    the Hospital for Sick Children; eligibility required age 2-18 and English proficiency, and non-verbal
    individuals were excluded. Data were collected with ReproSchema-UI on tablets using the Bridge2AI-Voice
    pediatric protocol, with a headset for most participants and the built-in tablet microphone where
    headphones were not tolerated; all participants completed recording and demographic collection in
    a single session, and parents or decision-makers completed the survey on a separate tablet where the
    child could not. Compared with v1.0, this minor update adds no new participants but releases audio
    features for all free-speech tasks that were manually checked for unconsented speakers and personally
    identifying information, plus audio-quality metrics and per-recording metadata. Data collection and
    sharing were approved by the Research Ethics Board at the Hospital for Sick Children.
