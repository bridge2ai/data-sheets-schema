- name: Curator and generator backgrounds
  description: 'The curators and generators of the dataset come from a diverse range of backgrounds reflecting
    the interdisciplinary nature of the project: clinicians and healthcare professionals involved in direct
    collection of clinical data; biomedical researchers with expertise in clinical medicine, neurology
    and psychiatry; machine learning and AI specialists; data scientists and statisticians skilled in
    data curation, preprocessing and statistical analysis; social scientists and ethicists ensuring the
    dataset is ethically sourced and meets standards for privacy and consent; and engineers and technologists
    contributing to data collection, storage and dissemination infrastructure. The app development group
    consisted of researchers from 14 different institutions with expertise in software engineering, data
    science, machine learning, laryngology, speech pathology, acoustic science, bioethics, pulmonary science,
    neurological biomarkers and mood biomarkers.'
