id: https://b2ai-voice.org/
name: Bridge2AI-Voice
title: Bridge2AI-Voice Dataset
description: 'The Bridge2AI-Voice (B2AI-Voice) dataset is a large, ethically sourced and demographically
  diverse voice dataset linked to health information, produced by the Bridge2AI-Voice consortium under
  the NIH Common Fund Bridge2AI program. It couples standardized acoustic recordings (voice, speech, breathing
  and cough tasks) with detailed participant metadata: clinical diagnoses spanning voice, neurological/neurodegenerative,
  mood/psychiatric and respiratory disorders, validated patient questionnaires and patient-reported outcomes,
  demographics and known acoustic confounders. Data are collected prospectively at high-volume expert
  clinics across North America using a custom Bridge2AI-Voice application (adults) and ReproSchema-UI
  (pediatrics), with diagnoses validated by clinicians against established gold standards. The dataset
  is published as two distinct cohorts under separate protocols and ethics approvals: an adult flagship
  release on PhysioNet (b2ai-voice, current version 3.1.0, 833 participants across five North American
  sites) and a pediatric release on PhysioNet (b2ai-voice-pediatric, current version 1.1.0, 300 participants
  aged 2-18 recruited at the Hospital for Sick Children). Public releases are feature-only: they contain
  derived representations of the audio - spectrograms, mel spectrograms, MFCCs, pitch, loudness, periodicity,
  articulatory (SPARC/EMA) features, phonetic posteriorgrams and openSMILE/Praat static features - together
  with tabular phenotype files and JSON data dictionaries, but not the original waveforms. Raw audio is
  disseminated only through a separate controlled-access process and is distributed via Synapse. The consortium''s
  stated aims extend beyond the data themselves to establishing bioinformatic standards for acoustic data,
  benchmarking diversity and algorithmic bias, and defining ethical and legal norms for voice data sharing.'
