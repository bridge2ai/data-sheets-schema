instances:
- id: d4d:CHORUS-instance-admission
  name: Patient hospital admission
  instance_type: hospital admission (intensive care unit, pediatric intensive care unit, and neonatal
    intensive care unit)
  counts: 50000
  label: true
  label_description: A visualization and annotation environment labels data with targets important for
    prediction. Differential care pathways affecting label assignment (for example ICU versus non-ICU
    populations) are documented as a potential source of bias.
  description: The project website reports a current released dataset of 50,000 patient admissions from
    ICU, PICU, and NICU across 14 data contributing hospitals, and an anticipated final dataset of 100,000
    patient admissions with 9 different data modalities. An earlier snapshot presented at the September
    2025 training-program webinar reported that, as of August 2025, the dataset covered 14 different hospitals
    with over 45,000 unique admissions. The NIH project abstract describes acquiring an AI-ready data
    set from more than 100,000 critically ill patients.
- id: d4d:CHORUS-instance-demographics
  name: Demographics
  instance_type: structured demographic record
  description: Demographics represented in the OMOP Common Data Model, under controlled access, with metadata
    published against the OMOP schema.
- id: d4d:CHORUS-instance-medication-administration
  name: Medication administration record
  instance_type: structured medication administration record
  description: Medication administration, with dosing time-stamped upon each infusion change or dose administration.
    Represented in the OMOP Common Data Model under controlled access, with metadata published against
    the OMOP schema.
- id: d4d:CHORUS-instance-procedures
  name: Procedure record
  instance_type: structured procedure record
  description: Procedures documented by providers, represented in the OMOP Common Data Model under controlled
    access, with metadata published against the OMOP schema.
- id: d4d:CHORUS-instance-nursing-flowsheets
  name: Nursing flowsheet record
  instance_type: high-frequency structured nursing documentation
  description: Nursing flowsheets capturing high-frequency documentation, represented in the OMOP Common
    Data Model under controlled access, with metadata published against the OMOP schema with extensions.
- id: d4d:CHORUS-instance-diagnoses
  name: Diagnosis record
  instance_type: structured diagnosis record
  description: Diagnoses documented by providers, represented in the OMOP Common Data Model under controlled
    access, with metadata published against the OMOP schema.
- id: d4d:CHORUS-instance-ehr-omop-rows
  name: Structured EHR row in the OMOP Common Data Model
  instance_type: OMOP common data model row
  counts: 1600000000
  description: The project website reports 1.6 billion rows of EHR OMOP data in the current released dataset.
- id: d4d:CHORUS-instance-clinical-notes
  name: Clinical note
  instance_type: tokenized clinical note and report text
  description: Clinical notes are extracted and tokenized using the OHNLP toolkit and are under controlled
    access. Clinical notes are stored locally except for tokens, so raw note text is retained at the contributing
    institution rather than assembled centrally. A published metadata schema is planned for this modality;
    the schema referenced is the OHNLP open-source schema.
- id: d4d:CHORUS-instance-imaging
  name: Medical image
  instance_type: DICOM imaging study extracted from hospital PACS
  description: 'Imaging is drawn from hospital PACS, is represented in DICOM, is under controlled access,
    and has a published DICOM metadata schema. Scope and release status differ between sources and dates:
    the September 2025 training-program webinar reported that approximately 1,000 images were then available
    with de-identification in process for a larger cohort, and the project website reports 7,642 admissions
    with radiology data in the current released dataset, while the completeness statement for the version
    1.0 Beta RO-Crate package states that no DICOM images are included in that interim release.'
- id: d4d:CHORUS-instance-radiology-admission
  name: Admission with radiology data
  instance_type: hospital admission with associated radiology data
  counts: 7642
  description: The project website reports 7,642 admissions with radiology data in the current released
    dataset.
- id: d4d:CHORUS-instance-waveform-telemetry
  name: Waveform telemetry signal
  instance_type: high-resolution physiologic waveform from bedside monitors and gateway/middleware
  description: Waveform telemetry is captured from bedside monitors and gateway/middleware, transformed
    to the WFDB standard, and held under controlled access, with metadata published against an extended
    PhysioNet schema. The project website reports 23 Tb of waveform data in the current released dataset;
    the waveforms sub-crate of the version 1.0 Beta RO-Crate package records a content size of 1,201,567,472,832
    bytes.
- id: d4d:CHORUS-instance-waveform-eeg
  name: Waveform EEG recording
  instance_type: electroencephalography recording extracted from hospital databases
  description: EEG waveforms are drawn from hospital databases and represented in EDF+ and Persyst formats
    under controlled access, with a published open-source EDF+ and Persyst schema. The September 2025
    training-program webinar reported that EEG extraction was in process at that point and that a published
    metadata schema was planned.
subpopulations:
- id: d4d:CHORUS-subpopulation-critical-care-units
  name: Critical care unit populations
  subpopulation_elements_present: true
  identification:
  - The current released dataset comprises patient admissions from the intensive care unit (ICU), the
    pediatric intensive care unit (PICU), and the neonatal intensive care unit (NICU).
  - Data are contributed by 14 data acquisition centers out of 20 collaborating academic centers.
  distribution:
  - Socioeconomic and demographic distribution is reflective of participating institutions.
  - Patient-focused efforts determine the ethical and legal approaches to manage privacy and bias while
    accounting for Social Determinants of Health.
  - Data elements feature appropriate contextual factors such as geographic distance to the nearest hospital.
  - Federated access enables sampling methods intended to ensure a balanced and diverse cohort, and sampling
    is designed to ensure comprehensive sets of patient conditions and clinical treatment strategies.
