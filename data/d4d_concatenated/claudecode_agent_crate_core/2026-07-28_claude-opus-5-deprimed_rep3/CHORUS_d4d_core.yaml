known_limitations:
- id: d4d:CHORUS-limitation-observational
  name: Observational, non-randomized real-world data
  limitation_type: methodological_limitation
  limitation_description: Observational data, and not randomized; collected as real-world clinical data,
    not through prospective research interactions with patients.
  scope_impact: Causal inference and intervention effect estimation are constrained relative to randomized
    designs.
- id: d4d:CHORUS-limitation-documentation-quality
  name: Documentation quality dependent on clinical workflows
  limitation_type: methodological_limitation
  limitation_description: Documentation quality is dependent on routine clinical workflows and on which
    data elements are collected in clinical practice.
- id: d4d:CHORUS-limitation-variable-sampling-rates
  name: Variable waveform sampling rates
  limitation_type: resolution_limitation
  limitation_description: Variable sampling rates across real-world data from hospital waveform systems
    and middleware.
  scope_impact: Temporal resolution of physiologic signal data is not uniform across sites or devices.
- id: d4d:CHORUS-limitation-institutional-heterogeneity
  name: Institutional heterogeneity in coding and collection practice
  limitation_type: integration_limitation
  limitation_description: Institutional heterogeneity in coding and clinical data collection practices.
  recommended_mitigation: Harmonization to the OMOP Common Data Model, validated semantic mappings, and
    standard operating protocols for contributing sites.
- id: d4d:CHORUS-limitation-generalizability
  name: Limited generalizability beyond participating hospitals
  limitation_type: representativeness_limitation
  limitation_description: Limited generalizability beyond participating hospitals.
  recommended_mitigation: Population inference beyond participating institutions is listed among the uses
    that are not recommended.
- id: d4d:CHORUS-limitation-out-of-scope-uses
  name: Not appropriate for re-identification, contact tracing, or patient-level intervention
  limitation_type: scope_limitation
  limitation_description: The dataset is not appropriate for re-identification, contact tracing, or patient-level
    intervention.
- id: d4d:CHORUS-limitation-overfitting-controls
  name: Development splits require user-side overfitting controls
  limitation_type: methodological_limitation
  limitation_description: Hold-out splits are available for testing; training and validation in development
    splits require internal mechanisms to avoid overfitting.
- id: d4d:CHORUS-limitation-interim-completeness
  name: Interim release with partial data
  limitation_type: coverage_limitation
  limitation_description: Interim release with partial data. Not all patients in the CHoRUS full cohort
    are included. No DICOM images are included.
  scope_impact: The version 1.0 Beta release does not cover the full CHoRUS cohort and omits the imaging
    modality.
anomalies:
- id: d4d:CHORUS-anomaly-waveform-sampling-rates
  name: Variable sampling rates in waveform data
  anomaly_details:
  - Variable sampling rates across real-world data from hospital waveform systems and middleware, recorded
    as the dataset's data-quality characterization.
missing_data_documentation:
- id: d4d:CHORUS-missing-data
  name: Missing data patterns and handling
  missing_data_patterns:
  - Missingness not at random (MNAR) in laboratory, waveform, and imaging acquisition.
  - Variable sampling rates across real-world data from hospital waveform systems and middleware.
  - 'Interim release with partial data: not all patients in the CHoRUS full cohort are included, and no
    DICOM images are included in the version 1.0 Beta release.'
  missing_data_causes:
  - Documentation quality dependent on routine clinical workflows and on which data elements are collected
    in clinical practice.
  - Institutional heterogeneity in coding and clinical data collection practices.
  - Differential care pathways affecting label assignment (e.g., ICU vs non-ICU populations).
  - Modality extraction still in progress at the time of the source snapshots, including EEG extraction
    and de-identification of a larger imaging cohort.
  handling_strategy: Bias assessment is ongoing and documented in dataset release notes; release notes
    document schema changes, harmonization updates, and known issues.
confidential_elements:
- id: d4d:CHORUS-confidentiality
  name: Confidential clinical content and access restriction
  confidential_elements_present: true
  confidentiality_details:
  - The dataset is recorded at confidentiality level HL7:2V (very restricted).
  - All modalities are held under controlled access.
  - Clinical notes are stored locally except for tokens; raw note and report text is retained locally
    at contributing institutions rather than distributed.
  - Access is restricted to the secure enclave environment; no raw data export is permitted unless explicitly
    approved.
  - Data export restrictions and output review procedures are applied to reduce risk of re-identification.
sensitive_elements:
- id: d4d:CHORUS-sensitive-elements
  name: Sensitive clinical and personal information
  sensitive_elements_present: true
  sensitivity_details:
  - The dataset is derived from patient electronic health records, imaging, physiologic waveforms, and
    clinical note text, and is subject to HIPAA.
  - CHoRUS operates within a secure enclave environment aligned with NIST 800-53 controls.
  - De-identification consistent with HIPAA Safe Harbor.
  - Removal or tokenization of direct identifiers.
  - Date shifting or limited date fields when required.
  - Role-based access control (RBAC).
  - Multi-factor authentication.
  - Full audit logging of data access and queries.
  - Prohibition of re-identification attempts.
  - Data export restrictions and output review procedures to reduce risk of re-identification.
  - Re-identification risk is periodically assessed and mitigation strategies updated as needed.
is_deidentified:
  id: d4d:CHORUS-deidentification
  name: CHoRUS de-identification
  identifiable_elements_present: false
  method: De-identification consistent with HIPAA Safe Harbor, with removal or tokenization of direct
    identifiers and date shifting or limited date fields when required. Imaging metadata is de-identified
    using the RSNA Clinical Trial Processor and pixel-level de-identification uses IbisWorks EICON. Clinical
    notes are extracted and tokenized using the OHNLP toolkit, with raw text retained locally. Data are
    transformed using approaches that limit re-identification.
  identifiers_removed:
  - Direct identifiers, removed or tokenized
  - Dates, shifted or limited when required
  - Imaging metadata identifiers, removed with the RSNA Clinical Trial Processor
  - Burned-in pixel identifiers, removed with IbisWorks EICON pixel-level de-identification
  deidentification_details:
  - The RO-Crate metadata records the dataset as de-identified.
  - Residual re-identification risk is periodically assessed and mitigation strategies are updated as
    needed.
  - Re-identification attempts are prohibited, and data export restrictions and output review procedures
    further reduce re-identification risk.
  used_software:
  - id: d4d:CHORUS-software-rsna-ctp
    name: RSNA Clinical Trial Processor
    description: Used for imaging metadata de-identification.
  - id: d4d:CHORUS-software-ibisworks-eicon
    name: IbisWorks EICON
    description: Used for pixel-level de-identification of imaging.
  - id: d4d:CHORUS-software-ohnlp
    name: OHNLP toolkit
    description: Used to extract and tokenize clinical notes; an open-source schema is published for the
      resulting content.
  - id: d4d:CHORUS-software-privacy-scan-tool
    name: privacy_scan_tool
    description: A privacy scan tool for medical records, maintained in the CHoRUS GitHub organization.
    url: https://github.com/chorus-ai/privacy_scan_tool
acquisition_methods:
- id: d4d:CHORUS-acquisition
  name: Acquisition from routine clinical care
  was_directly_observed: true
  was_reported_by_subjects: false
  was_validated_verified: true
  acquisition_details:
  - Data are derived from routine clinical care at participating hospitals under IRB oversight, and are
    repurposed from clinical workflows rather than collected solely for research.
  - Observational data, not randomized, collected as real-world clinical data and not through prospective
    research interactions with the patient.
  - Retrospective data collection.
  - Structured data are documented by providers and by devices during care, including provider documentation
    of procedures and diagnoses and high-frequency nursing flowsheets.
  - Standard operating protocols instruct data contributing sites about best practices for curating and
    delivering interoperable datasets, and have undergone an internal validation and review process.
  - Clinical expertise supports semantic mapping and validation, with a clinical validation SOP associated
    with the pooled tabular mappings.
collection_mechanisms:
- id: d4d:CHORUS-collection-ehr
  name: Electronic health record extraction and OMOP transformation
  mechanism_details:
  - Electronic health record extraction and transformation to the OMOP common data model.
  - Structured electronic health record data are acquired, standardized, tokenized, stored, visualized,
    and labeled across a multi-center network.
  - Sites create and upload a CHoRUS Data Extract using project tooling.
  used_software:
  - id: d4d:CHORUS-software-chorus-extract-upload
    name: chorus-extract-upload
    description: Repository with tools to create and upload a CHoRUS Data Extract.
    url: https://github.com/chorus-ai/chorus-extract-upload
    license: MIT
  - id: d4d:CHORUS-software-ohdsi-tool-stack
    name: OHDSI tool stack
    description: The OHDSI/OMOP common data model and its associated tool stack, used for working with
      the standardized clinical data.
- id: d4d:CHORUS-collection-imaging
  name: Imaging extraction from PACS with de-identification
  mechanism_details:
  - Imaging is drawn from hospital picture archiving and communication systems (PACS).
  - Imaging metadata de-identification uses the RSNA Clinical Trial Processor, and pixel-level de-identification
    uses IbisWorks EICON.
  used_software:
  - id: d4d:CHORUS-software-rsna-ctp
    name: RSNA Clinical Trial Processor
  - id: d4d:CHORUS-software-ibisworks-eicon
    name: IbisWorks EICON
  - id: d4d:CHORUS-software-ctp-deid
    name: CTP-deid
    description: De-identification repository in the CHoRUS GitHub organization.
    url: https://github.com/chorus-ai/CTP-deid
- id: d4d:CHORUS-collection-waveform
  name: Physiologic waveform capture and WFDB transformation
  mechanism_details:
  - High-resolution physiologic waveform capture, extraction, and transformation to the WFDB standard.
  - Waveform telemetry is acquired from bedside monitors and from gateway/middleware systems.
  - EEG waveforms are extracted from hospital databases in EDF+ and Persyst formats.
  used_software:
  - id: d4d:CHORUS-software-chorus-waveform
    name: chorus_waveform
    description: CHoRUS waveform documentation and various waveform conversion scripts.
    url: https://github.com/chorus-ai/chorus_waveform
    license: MIT
- id: d4d:CHORUS-collection-notes
  name: Clinical note extraction and tokenization
  mechanism_details:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit.
  - Tokenized unstructured electronic health record data are acquired across the multi-center network,
    while raw text is retained locally.
  used_software:
  - id: d4d:CHORUS-software-ohnlp
    name: OHNLP toolkit
- id: d4d:CHORUS-collection-contextual-factors
  name: Contextual and social determinant enrichment
  mechanism_details:
  - Data elements feature appropriate contextual factors such as geographic distance to the nearest hospital,
    and social determinants of health are among the data being acquired.
  - OMOP Location entities are geocoded via DeGauss using open source code maintained in the CHoRUS GitHub
    organization.
  used_software:
  - id: d4d:CHORUS-software-uf-geocoding
    name: UF-Geocoding
    description: Open source code to geocode OMOP Location entities via DeGauss.
    url: https://github.com/chorus-ai/UF-Geocoding
    license: MIT
sampling_strategies:
- id: d4d:CHORUS-sampling
  name: CHoRUS cohort sampling
  is_sample: true
  is_representative: false
  source_data:
  - Routine clinical care records at 14 data acquisition centers within a network of 20 collaborating
    academic centers.
  strategies:
  - The project establishes a legal framework for collecting data at scale, sampling to ensure comprehensive
    sets of patient conditions and clinical treatment strategies.
  - Federated access enables sampling methods to ensure a balanced and diverse cohort.
  - The released cohort is drawn from intensive care, pediatric intensive care, and neonatal intensive
    care admissions.
  why_not_representative:
  - Referral bias from tertiary/quaternary academic centers.
  - Socioeconomic and demographic distribution reflective of participating institutions.
  - Limited generalizability beyond participating hospitals.
  representative_verification:
  - Bias assessment is ongoing and documented in dataset release notes.
data_collectors:
- id: d4d:CHORUS-collector-sites
  name: CHoRUS data acquisition centers
  role: Data contributing sites
  collector_details:
  - The CHoRUS collaboration spans 20 academic centers, of which 14 contribute as Data Acquisition centers.
  - Data site managers at contributing sites follow the Chorus_SOP workflow, an interactive workflow diagram
    describing the step-by-step process for extracting and contributing clinical data to CHoRUS, with
    links to SOP documents validated within the Chorus_SOP repository.
  - Sites provide regular status updates on their progress in creating and curating a CHoRUS-specific
    clinical data extract, submitted through the GitHub interface or a Google Form.
- id: d4d:CHORUS-collector-data-pillar
  name: CHoRUS Data Pillar
  role: Standards, tool development and optimization, and data acquisition
  collector_details:
  - The CHoRUS project operates through three pillars, the first of which is Data (Standards, Tool Development
    and Optimization, and Data Acquisition).
  - Sub-teams within the CHoRUS data generation project include Standards, Data Acquisition, and Tooling.
  - The CHoRUS Data Pillar, in collaboration with institutional data stewards, are the primary maintainers
    of the dataset.
- id: d4d:CHORUS-collector-clinical-collaborators
  name: Clinical collaborators
  role: Semantic mapping and clinical validation
  collector_details:
  - Clinical expertise supports semantic mapping and validation within CHoRUS.
  - A chorus-mapping repository holds documentation and pooled tabular mappings along with an associated
    clinical validation SOP for contributing to mapping efforts.
collection_timeframes:
- id: d4d:CHORUS-timeframe
  name: CHoRUS data collection period
  timeframe_details:
  - Retrospective data collection.
  - 'Funded project period recorded on the NIH project record: project start 2022-09-01, project end 2026-11-30.'
  - 'Cohort status reported at the September 2025 training-program webinar: as of August 2025 the dataset
    covered 14 different hospitals with over 45,000 unique admissions.'
  - The version 1.0 Beta RO-Crate package was published 2026-04-03.
  - The range of clinical encounter dates covered by the retrospective extract is not stated in the available
    sources.
informed_consent:
- id: d4d:CHORUS-informed-consent
  name: Informed consent and regulatory exemption
  consent_type:
  - IRB approval or waiver as appropriate
  consent_documentation:
  - 'Human subject exemption recorded for the dataset: HIPAA exemption 4 (45 CFR 46.104(d)(4)).'
  - 'Review by the Mass General Brigham Institutional Review Board under protocol #2022P000707, with local
    context review by IRBs, HIPAA Privacy Officers, and institutional counsels at contributing medical
    centers.'
  consent_scope:
  - Data are repurposed from routine clinical care rather than gathered through prospective research interactions
    with patients.
  - Community-facing ethics focus groups are performed to determine what data is appropriate for public
    sharing.
raw_data_sources:
- id: d4d:CHORUS-raw-source-ehr
  name: Hospital electronic health record systems
  source_description: Structured electronic health record data captured during routine clinical care at
    participating hospitals, including demographics, medication administration with dosing time-stamped
    at each infusion change or dose administration, procedures and diagnoses documented by providers,
    and high-frequency nursing flowsheets.
  source_type:
  - Electronic health record system
  access_details: Extracted at the contributing site and transformed to the OMOP Common Data Model before
    delivery to the CHoRUS enclave; the assembled data are held under controlled access.
  raw_data_format:
  - Site-native EHR export, transformed to the OMOP Common Data Model
- id: d4d:CHORUS-raw-source-notes
  name: Unstructured clinical notes and reports
  source_description: Free-text clinical notes and reports authored during routine care, extracted and
    tokenized using the OHNLP toolkit.
  source_type:
  - Electronic health record narrative text
  access_details: Clinical notes are stored locally except for tokens; raw note and report text is retained
    at the contributing institution and is not assembled centrally.
  raw_data_format:
  - Free-text clinical narrative, tokenized to the OHNLP open-source schema
- id: d4d:CHORUS-raw-source-pacs
  name: Hospital picture archiving and communication systems
  source_description: Clinical imaging studies drawn from hospital PACS at contributing sites.
  source_type:
  - Picture archiving and communication system (PACS)
  access_details: Imaging metadata is de-identified with the RSNA Clinical Trial Processor and pixel content
    with IbisWorks EICON; the version 1.0 Beta package includes no DICOM images.
  raw_data_format:
  - DICOM
- id: d4d:CHORUS-raw-source-telemetry
  name: Bedside monitors and telemetry middleware
  source_description: High-resolution physiologic waveform telemetry captured from bedside monitors and
    from gateway/middleware systems at contributing hospitals.
  source_type:
  - Bedside physiologic monitor
  - Telemetry gateway and middleware
  access_details: Captured, extracted, and transformed to the WFDB standard; held under controlled access
    in the enclave.
  raw_data_format:
  - Vendor-native waveform capture, transformed to WFDB
- id: d4d:CHORUS-raw-source-eeg
  name: Hospital EEG databases
  source_description: Electroencephalography recordings held in hospital EEG databases at contributing
    sites.
  source_type:
  - Hospital EEG database
  access_details: Extraction was reported as in process as of the September 2025 training-program webinar;
    content is held under controlled access.
  raw_data_format:
  - EDF+
  - Persyst
raw_sources:
- id: d4d:CHORUS-rawdata-local-text
  name: Locally retained raw clinical text
  raw_data_details:
  - Raw note and report text is retained locally at contributing institutions; only tokens are carried
    into the assembled dataset.
  - Access is restricted to the secure enclave environment; no raw data export is permitted unless explicitly
    approved.
preprocessing_strategies:
- id: d4d:CHORUS-preprocessing-omop
  name: Harmonization to the OMOP Common Data Model
  preprocessing_details:
  - Data are acquired, standardized to the OMOP Common Data Model, and transformed using approaches that
    limit re-identification.
  - Standardized harmonization to a common data model is applied across contributing sites.
  - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data.
  - Validated semantic mappings connect clinical data in various source formats to international standards;
    documentation and pooled tabular mappings are held in the chorus-mapping repository.
  used_software:
  - id: d4d:CHORUS-software-ohdsi-tool-stack
    name: OHDSI tool stack
- id: d4d:CHORUS-preprocessing-waveform
  name: Waveform transformation to WFDB
  preprocessing_details:
  - High-resolution physiologic waveform capture is extracted and transformed to the WFDB standard.
  used_software:
  - id: d4d:CHORUS-software-chorus-waveform
    name: chorus_waveform
    url: https://github.com/chorus-ai/chorus_waveform
    license: MIT
- id: d4d:CHORUS-preprocessing-tokenization
  name: Clinical note tokenization
  preprocessing_details:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit, producing content described by
    the OHNLP open-source schema.
  used_software:
  - id: d4d:CHORUS-software-ohnlp
    name: OHNLP toolkit
- id: d4d:CHORUS-preprocessing-deidentification
  name: De-identification and privacy transformation
  preprocessing_details:
  - Imaging metadata de-identification uses the RSNA Clinical Trial Processor and pixel-level de-identification
    uses IbisWorks EICON.
  - De-identification is consistent with HIPAA Safe Harbor, with removal or tokenization of direct identifiers
    and date shifting or limited date fields when required.
  used_software:
  - id: d4d:CHORUS-software-rsna-ctp
    name: RSNA Clinical Trial Processor
  - id: d4d:CHORUS-software-ibisworks-eicon
    name: IbisWorks EICON
- id: d4d:CHORUS-preprocessing-geocoding
  name: Geocoding of OMOP Location entities
  preprocessing_details:
  - OMOP Location entities are geocoded via DeGauss, supporting contextual factors such as geographic
    distance to the nearest hospital and social determinants of health.
  used_software:
  - id: d4d:CHORUS-software-uf-geocoding
    name: UF-Geocoding
    url: https://github.com/chorus-ai/UF-Geocoding
    license: MIT
cleaning_strategies:
- id: d4d:CHORUS-cleaning-sop-validation
  name: SOP-driven curation and site characterization feedback
  cleaning_details:
  - Standard operating protocols instruct data contributing sites about best practices for curating and
    delivering interoperable datasets, and the SOP documents have undergone an internal validation and
    review process within the Chorus_SOP repository.
  - Characterization reports are produced and returned to sites following their data submissions.
  - A clinical validation SOP accompanies the pooled tabular mappings, so that clinical expertise is applied
    to semantic mapping and validation.
  - Status tracking identifies and resolves blocking issues in site data creation and curation.
  used_software:
  - id: d4d:CHORUS-software-chorus-reports
    name: CHoRUSReports
    description: Repository dedicated to producing characterization reports to return to sites following
      their data submissions.
    url: https://github.com/chorus-ai/CHoRUSReports
labeling_strategies:
- id: d4d:CHORUS-labeling
  name: Annotation and labeling for prediction targets
  data_annotation_platform:
  - A visualization and annotation environment developed within CHoRUS.
  data_annotation_protocol:
  - Data are acquired, standardized, tokenized, stored, visualized, and labeled across the multi-center
    network.
  labeling_details:
  - A visualization and annotation environment labels data with targets important for prediction.
  - Differential care pathways affecting label assignment (for example ICU versus non-ICU populations)
    are documented as a potential source of bias.
machine_annotation_tools:
- id: d4d:CHORUS-machine-annotation
  name: Automated text processing tooling
  tools:
  - OHNLP toolkit
  tool_descriptions:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit; the resulting content is described
    by a published OHNLP open-source schema.
ethical_reviews:
- id: d4d:CHORUS-ethical-review-irb
  name: Institutional review board oversight
  contact_person: d4d:CHORUS-person-eric-rosenthal
  reviewing_organization: d4d:CHORUS-org-mgb-irb
  description: Ethical oversight is provided by the Mass General Brigham Institutional Review Board (MGB
    IRB), 399 Revolution Drive, Suite 710, Somerville, MA 02145, US, whose IRB Reliance and Compliance
    contact point is irbreliance@mgb.org, telephone +1-857-282-1900. The contact person recorded for this
    record is Eric S. Rosenthal (EROSENTHAL@mgh.harvard.edu).
  review_details:
  - Ethical review was conducted by Eric S. Rosenthal, Michael J. Young, Ishan Williams, Ashley Cordes,
    and Barbara J. Evans in collaboration with the Mass General Brigham IRB, with local context review
    by IRBs, HIPAA Privacy Officers, and institutional counsels at contributing medical centers.
  - 'IRB protocol identifier: #2022P000707.'
  - 'Human subject exemption: HIPAA exemption 4 (45 CFR 46.104(d)(4)).'
  - Ethical safeguards include IRB approval or waiver as appropriate and compliance with CHoRUS governance.
- id: d4d:CHORUS-ethical-review-community
  name: Community-facing ethics engagement
  review_details:
  - The project performs community-facing ethics focus groups to determine what data is appropriate for
    public sharing.
  - The CHoRUS consortium evaluates community perspectives on clinical care AI to find ways to increase
    trustworthiness of provenance and privacy in AI, and new approaches are created as the existing legal
    and regulatory landscape is analyzed.
  - Ethics is one of the project's three pillars, covering Ethical and Trustworthy AI, and draws on disciplines
    including law, ethics, and health services.
data_protection_impacts:
- id: d4d:CHORUS-dpia
  name: Layered privacy protection and re-identification risk assessment
  impact_details:
  - Layered privacy protection includes de-identification, a data use agreement, and a controlled access
    data repository with adherence to NIST 800-53 principles, audit-level protection, registration, role-based
    access controls, and protection against data exfiltration.
  - Re-identification risk is periodically assessed and mitigation strategies updated as needed.
  - Data export restrictions and output review procedures reduce the risk of re-identification.
  - Data are transformed using approaches that limit re-identification.
human_subject_research:
  id: d4d:CHORUS-human-subject-research
  name: CHoRUS human subject research status
  involves_human_subjects: true
  irb_approval:
  - 'Mass General Brigham Institutional Review Board protocol #2022P000707.'
  - IRB approval or waiver as appropriate at contributing sites, with local context review by IRBs, HIPAA
    Privacy Officers, and institutional counsels at contributing medical centers.
  ethics_review_board:
  - Mass General Brigham Institutional Review Board (MGB IRB), 399 Revolution Drive, Suite 710, Somerville,
    MA 02145, US; IRB Reliance and Compliance contact irbreliance@mgb.org, telephone +1-857-282-1900.
  special_populations:
  - The current released dataset includes admissions from the pediatric intensive care unit (PICU) and
    the neonatal intensive care unit (NICU), alongside adult intensive care admissions.
  regulatory_compliance:
  - Compliance with HIPAA and NIH data-sharing policies.
  - 'Human subject exemption: HIPAA exemption 4 (45 CFR 46.104(d)(4)).'
  - The dataset is recorded as FDA regulated.
  - Compliance with NIH Bridge2AI OT terms and applicable federal regulations.
  - Curation within a NIST 800-53-aligned secure enclave architecture with role-based access controls,
    audit logging, and controlled-access governance review.
at_risk_populations:
  id: d4d:CHORUS-at-risk-populations
  name: At-risk populations in the CHoRUS cohort
  at_risk_groups_included: true
  special_protections:
  - Pediatric and neonatal intensive care admissions are included in the current released dataset, so
    minors are represented in the cohort.
  - All data are held under controlled access in a secure enclave aligned with NIST 800-53 controls, with
    role-based access control, multi-factor authentication, and full audit logging of data access and
    queries.
  - De-identification consistent with HIPAA Safe Harbor is applied, with removal or tokenization of direct
    identifiers and date shifting or limited date fields when required.
  - Local context review by IRBs, HIPAA Privacy Officers, and institutional counsels is performed at contributing
    medical centers.
existing_uses:
- id: d4d:CHORUS-existing-use
  name: Training activities and publications
  examples:
  - Datasets are being used for training activities and publications.
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI CHoRUS data
    through engagement, AI training, and mentorship, equipping trainees to apply AI/ML methods to big
    data analysis using multi-modal datasets from a broad range of cohort participants.
  - Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care Network and Collaborative
    Cloud and use the data and tools to create practical use cases; the Cohort 2 program ran from a November
    17, 2025 start date to a July 31, 2026 end date, with up to 30 trainees selected.
  description: Learning opportunities offer hands-on training using the CHoRUS dataset to support the
    development of translational AI in clinical care.
intended_uses:
- id: d4d:CHORUS-intended-uses
  name: Intended use cases for the CHoRUS dataset
  examples:
  - AI model training within enclave
  - Model validation and benchmarking
  - Algorithm development and feature engineering
  - Retrospective hypothesis testing
  - Fine-tuning of multimodal models
  - Comparative effectiveness research
  - Reinforcement learning and development of expert AI
  - Methodological research in trustworthy AI
  - Trial emulation or powering
  use_category:
  - Health, medical, and biomedical research
  - AI/ML model development and evaluation
  usage_notes: Usage must align with approved research scope and governance policies.
discouraged_uses:
- id: d4d:CHORUS-discouraged-uses
  name: Uses that are not recommended
  discouragement_details:
  - Direct translation of trained algorithms to real-time clinical deployment without validation or regulatory
    clearance.
  - Use as sole evidence for clinical decision-making.
  - Population inference beyond participating institutions.
prohibited_uses:
- id: d4d:CHORUS-prohibited-uses
  name: Prohibited uses and access conditions
  prohibition_reason:
  - Re-identification attempts are prohibited.
  - The dataset is not appropriate for re-identification, contact tracing, or patient-level intervention.
  - Access is restricted to the secure enclave environment; no raw data export is permitted unless explicitly
    approved.
  - Data may not be used for commercial purposes unless specifically authorized through a separate agreement
    consistent with governing award and consortium terms.
  - Usage must align with approved research scope and governance policies.
future_use_impacts:
- id: d4d:CHORUS-future-use-impacts
  name: Anticipated impacts of future use
  impact_details:
  - The CHoRUS Network will develop the necessary network, tools, standards, data, and education to build
    machine-learning and artificial-intelligence-derived models to improve the care and outcomes of patients
    requiring critical care.
  - This data generation project will catalyze the biomedical research and expertise necessary to promote
    the patient-focused deployment of AI in acute and critical care.
  - A sequestered holdout test set accessible for external validation is intended to aid marketplace adoption
    of AI-developed models for implementation in acute and critical care.
  - Referral bias, institution-reflective demographics, and limited generalizability beyond participating
    hospitals constrain how far conclusions drawn from the dataset can be extended to other populations.
  - Models trained on the dataset should not be translated directly to real-time clinical deployment without
    validation or regulatory clearance, and the dataset should not be used as sole evidence for clinical
    decision-making.
distribution_formats:
- id: d4d:CHORUS-distribution-format-structured
  name: Standardized multi-modal distribution formats
  description: 'Content is distributed in standardized formats by modality: the OMOP Common Data Model
    for structured EHR data including demographics, medication administration, procedures, nursing flowsheets,
    and diagnoses; the OHNLP open-source schema for tokenized clinical notes; DICOM for imaging; WFDB
    for waveform telemetry; and EDF+ and Persyst for EEG. The AI-readiness assessment of the version 1.0
    Beta package records the formats present as .ipynb, text/tab-separated-values, and wfdb.'
  access_urls:
  - https://chorus4ai.org/dataset/
- id: d4d:CHORUS-distribution-format-crate
  name: RO-Crate package distribution
  description: The dataset release is packaged as a self-contained RO-Crate conforming to RO-Crate 1.2
    with EVI and Croissant RAI properties, comprising a top-level CHoRUS RO-Crate Package and EHR and
    Waveforms sub-crates. The JSON-LD metadata is machine-readable, 99% of files carry checksums (1,469
    of 1,477), and 44 schemas are documented within the package.
  access_urls:
  - https://doi.org/10.18130/V3/XNBOPG
distribution_dates:
- id: d4d:CHORUS-distribution-dates
  name: Release dates
  release_dates:
  - '2026-04-03'
  description: The RO-Crate metadata records datePublished 2026-04-03 for the CHoRUS RO-Crate Package
    and for the Waveforms sub-crate, and records the same release in the alternative day/month/year form
    03/04/2026 in the package releaseDate field and in the EHR sub-crate datePublished field. The recommended
    citation places the release in April 2026, which is consistent with the ISO-formatted date.
license_and_use_terms:
  id: d4d:CHORUS-license-terms
  name: CHoRUS data use terms
  description: Access to CHoRUS data is governed through a controlled-access framework requiring institutional
    affiliation and credentials, an approved research proposal reviewed by the CHoRUS governance committee,
    an executed Data Use Agreement, IRB approval or exemption documentation as applicable, and compliance
    with NIH Bridge2AI OT terms and applicable federal regulations. The contact person recorded here is
    Eric S. Rosenthal (EROSENTHAL@mgh.harvard.edu), named as the data governance committee contact in
    the RO-Crate metadata.
  license_terms:
  - Data Use Agreement available at 'https://chorus4ai.org/dataset/'.
  - Conditions of access are set out in the Data Use Agreement document at https://chorus4ai.org/wp-content/uploads/2025/10/Data-Agreement-9.30.2025.docx.
  - Providing institutional affiliation and credentials.
  - Approved research proposal reviewed by CHoRUS governance committee.
  - Data Use Agreement (DUA) executed between requestor institution and CHoRUS.
  - IRB approval or exemption documentation, as applicable.
  - Compliance with NIH Bridge2AI OT terms and applicable federal regulations.
  - Access restricted to secure enclave environment; no raw data export permitted unless explicitly approved.
  - Data use may not be used for commercial purposes unless specifically authorized through a separate
    agreement consistent with governing award and consortium terms.
  - Training-program participants must sign a licensing agreement included in the registration form before
    gaining access to the dataset, and a ".edu" email address is required to gain access to the dataset.
  - The CHoRUS GitHub organization's software is licensed under the MIT License.
  data_use_permission:
  - health_medical_biomedical_research
  - no_commercial_use
  - ethics_approval_required
  - institution_specific
  - project_specific
  contact_person: d4d:CHORUS-person-eric-rosenthal
