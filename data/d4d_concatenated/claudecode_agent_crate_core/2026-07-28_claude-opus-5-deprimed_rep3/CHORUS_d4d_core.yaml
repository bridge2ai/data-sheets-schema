extension_mechanism:
  id: d4d:CHORUS-extension-mechanism
  name: Contribution and extension routes
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - The CHoRUS GitHub organization houses active repositories providing software and tooling to interact
    with and extract insight from clinical data in diverse formats, validated semantic mappings, standard
    operating protocols for contributing sites, and project management overviews.
  - Clinical collaborators can contribute to mapping efforts through the chorus-mapping repository, which
    holds documentation, pooled tabular mappings, and an associated clinical validation SOP.
  - Issues encountered in creating or submitting a data extract can be posted to context-specific discussion
    locations, including Standards Discussions and Data Acquisition Discussions.
  - Data contributing sites submit regular status updates through the GitHub interface or a Google Form,
    which triggers a GoogleScript that calls the GitHub API to update status and issue information in
    the Standards Project or the Data Acquisition Project.
  - A web guide for contributors and users of the CHoRUS software packages compiles documentation in the
    chorus-developer repository, and a package status page records versions, maintainers, and other metadata
    about CHoRUS packages.
