purposes:
- id: d4d:CHORUS-purpose-ai-ready-critical-care-dataset
  name: Develop a publicly available, AI-ready critical care dataset
  response: The project's overarching goal is to develop a publicly available, AI-ready critical care
    dataset, while ensuring the methods promote privacy, accountability, and clinical benefit, while promoting
    a new generation of AI clinicians and scientists. The CHoRUS data generation project addresses the
    challenges of acquiring an AI-ready data set from more than 100,000 critically ill patients.
- id: d4d:CHORUS-purpose-support-ai-ml-critical-care
  name: Generate data for ML/AI applications in acute and critical care
  response: The CHoRUS data generation project meets the need of generating data for ML/AI applications
    aimed at characterizing acute and critical care illness, predicting complications, and measuring treatment
    response among patients with acute or critical illness.
- id: d4d:CHORUS-purpose-secure-reproducible-ai-research
  name: Enable secure, auditable, and reproducible AI research
  response: The repository is designed to enable secure, auditable, and reproducible artificial intelligence
    research to improve recovery from acute illness, supporting AI model development, validation, benchmarking,
    and translational research while maintaining compliance with HIPAA and NIH data-sharing policies.
- id: d4d:CHORUS-purpose-holdout-external-validation
  name: Provision a holdout test set for external model validation
  response: The dataset will also provision a holdout test set, accessible for model external validation
    to aid marketplace adoption of AI-developed models for implementation in acute and critical care.
- id: d4d:CHORUS-purpose-ethical-legal-framework
  name: Establish ethical and legal approaches for data at scale
  response: Patient-focused efforts determine the ethical and legal approaches to manage privacy and bias
    while accounting for Social Determinants of Health. The project establishes a legal framework for
    collecting data at scale, performs community-facing ethics focus groups to determine what data is
    appropriate for public sharing, and ensures data elements feature appropriate contextual factors such
    as geographic distance to the nearest hospital.
- id: d4d:CHORUS-purpose-standards-and-tooling
  name: Develop unified standards and multi-center data capabilities
  response: Unified standards harmonize multi-modal EHR, waveform, imaging, and text data, and the project
    develops capabilities across a multi-center network to acquire, standardize, tokenize, store, visualize,
    and label data. A visualization and annotation environment labels data with targets important for
    prediction.
- id: d4d:CHORUS-purpose-workforce-and-ai-literacy
  name: Cultivate AI expertise and workforce in clinical care
  response: A comprehensive set of approaches develops the skills and workforce for a next generation
    of diverse academic and community AI scientists, cultivating expertise in the lay and scientific community
    to improve AI literacy and utilization through multimodal educational approaches.
- id: d4d:CHORUS-purpose-bridge2ai-ethically-sourced-data
  name: Contribute ethically sourced datasets and AI best practices to Bridge2AI
  response: The CHoRUS project is one data generation project of four in the National Institutes of Health
    (NIH) funded Bridge2AI consortium. The goal is to work with projects to create ethically sourced datasets
    and tools around Artificial Intelligence and to create best practices for AI in health.
tasks:
- id: d4d:CHORUS-task-model-training
  name: AI model training within the enclave
  response: AI model training within enclave, including algorithm development and feature engineering.
- id: d4d:CHORUS-task-validation-benchmarking
  name: Model validation and benchmarking
  response: Model validation and benchmarking, including external validation of models against the sequestered
    hold-out test set.
- id: d4d:CHORUS-task-multimodal-fine-tuning
  name: Fine-tuning of multimodal models
  response: Fine-tuning of multimodal models across the harmonized EHR, imaging, waveform, and tokenized
    text modalities.
- id: d4d:CHORUS-task-retrospective-hypothesis-testing
  name: Retrospective hypothesis testing
  response: Retrospective hypothesis testing on the assembled multi-center retrospective cohort.
- id: d4d:CHORUS-task-comparative-effectiveness
  name: Comparative effectiveness research
  response: Comparative effectiveness research using the harmonized multi-center clinical record.
- id: d4d:CHORUS-task-reinforcement-learning
  name: Reinforcement learning and development of expert AI
  response: Reinforcement learning and development of expert AI.
- id: d4d:CHORUS-task-trustworthy-ai-methods
  name: Methodological research in trustworthy AI
  response: Methodological research in trustworthy AI, consistent with the project's aim of promoting
    privacy, accountability, and clinical benefit.
- id: d4d:CHORUS-task-trial-emulation
  name: Trial emulation or powering
  response: Trial emulation or powering.
- id: d4d:CHORUS-task-characterize-critical-illness
  name: Characterize illness, predict complications, measure treatment response
  response: Characterizing acute and critical care illness, predicting complications, and measuring treatment
    response among patients with acute or critical illness, in order to build machine-learning and artificial-intelligence-derived
    models that improve the care and outcomes of patients requiring critical care.
addressing_gaps:
- id: d4d:CHORUS-gap-critical-care-ai-infrastructure
  name: Lack of infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence and machine
    learning (AI/ML) in critical care. Developing high-resolution multi-center data sets is a critical
    first step towards actionable and trustworthy AI.
- id: d4d:CHORUS-gap-diverse-high-resolution-ethical-data
  name: Absence of a diverse, high-resolution, ethically sourced AI-ready dataset
  response: The goal of the CHoRUS Network is to develop the most diverse, high-resolution, ethically
    sourced, AI-ready data set to answer the grand challenge of improving recovery from acute illness,
    acquiring and standardizing a dataset of unprecedented diversity and high resolution.
- id: d4d:CHORUS-gap-external-validation-holdout
  name: No sequestered holdout data for external model validation
  response: By sequestering holdout datasets for external validation, the project addresses the absence
    of independent test data needed to aid marketplace adoption of AI-developed models for implementation
    in acute and critical care.
- id: d4d:CHORUS-gap-multimodal-harmonization
  name: Fragmented standards across multi-modal clinical data
  response: Unified standards are needed to harmonize multi-modal EHR, waveform, imaging, and text data
    across institutions; CHoRUS develops validated semantic mappings for connecting clinical data in various
    source formats to international standards, and standard operating protocols instructing data contributing
    sites about best practices for curating and delivering interoperable datasets.
- id: d4d:CHORUS-gap-legal-framework-at-scale
  name: Missing legal framework for collecting clinical data at scale
  response: The project establishes a legal framework for collecting data at scale, sampling to ensure
    comprehensive sets of patient conditions and clinical treatment strategies, and analyses the existing
    legal and regulatory landscape as new approaches are created.
