id: https://doi.org/10.18130/V3/XNBOPG
name: CHoRUS for Clinical Care AI Dataset
title: 'The Bridge2AI CHoRUS for Clinical Care AI Dataset: A Multi-Center, Multi-Modal, High-Resolution
  Critical Care Dataset'
description: 'The Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care AI is
  a clinical data network developing a flagship multi-hospital, multimodal, high-resolution dataset under
  the NIH Bridge2AI program. CHoRUS harmonizes electronic health record (EHR) data, imaging, high-resolution
  physiologic signals (including telemetry data and EEG where available), and tokenized note and report
  text (via OHNLP toolkit) with raw text retained locally across participating institutions using standardized
  data models and governance frameworks. The repository is designed to enable secure, auditable, and reproducible
  artificial intelligence (AI) research to improve recovery from acute illness. Data are curated within
  a NIST 800-53-aligned secure enclave architecture with role-based access controls, audit logging, and
  controlled-access governance review. CHoRUS supports AI model development, validation, benchmarking,
  and translational research while maintaining compliance with HIPAA and NIH data-sharing policies. CHoRUS
  is one of four data generation projects in the NIH-funded Bridge2AI consortium, and its network spans
  20 academic centers of which 14 contribute as data acquisition centers. Scope note: the identity, size,
  and file-count facts recorded at the top level of this record describe the published CHoRUS RO-Crate
  Package version 1.0 Beta (an interim release, dated 2026-04-03); the CHoRUS project website separately
  describes a larger current released dataset held in the enclave, and those broader figures are recorded
  on the individual instance records rather than at the top level.'
