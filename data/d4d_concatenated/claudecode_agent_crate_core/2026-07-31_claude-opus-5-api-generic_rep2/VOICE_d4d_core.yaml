id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a large, ethically sourced and demographically diverse voice dataset linked
  to health information, produced by the "Voice as a Biomarker of Health" Data Generation Project
  of the NIH Common Fund Bridge2AI program. Data are collected prospectively at specialty clinics
  and academic hospitals in North America using a custom Bridge2AI-Voice application on a tablet,
  and combine standardized acoustic tasks (sustained vowels, glides, diadochokinesis, reading
  passages, free speech, cough and breathing sounds) with detailed demographic information,
  acoustic confounders, disease-specific clinical diagnosis forms and validated patient-reported
  outcome questionnaires. Participants are selected on the basis of conditions known to manifest
  in the voice waveform - voice disorders, neurological and neurodegenerative disorders, mood and
  psychiatric disorders and respiratory disorders - together with healthy controls. Version 3.1.0
  of the adult dataset contains data for 833 participants across five North American sites. The
  release distributed through PhysioNet contains only data considered low risk: dense derived
  representations of the audio (spectrograms, mel spectrograms, MFCCs, pitch, loudness,
  periodicity, articulatory/EMA estimates and phonetic posteriorgrams), per-recording static
  acoustic features and audio-quality metrics, plus tabular phenotype files with JSON data
  dictionaries. The original raw audio waveforms are not included in this release and are
  obtainable only through a separate controlled-access process.
