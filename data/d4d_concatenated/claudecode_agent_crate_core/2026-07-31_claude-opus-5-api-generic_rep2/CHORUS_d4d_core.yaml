id: https://doi.org/10.18130/V3/XNBOPG
name: CHoRUS for Clinical Care AI Dataset
title: "The Bridge2AI CHoRUS for Clinical Care AI Dataset: A Multi-Center, Multi-Modal, High-Resolution Critical Care Dataset"
description: >-
  The Collaborative Hospital Repository Uniting Standards (CHoRUS) for Clinical Care AI is a clinical
  data network developing a flagship multi-hospital, multimodal, high-resolution dataset under the NIH
  Bridge2AI program. CHoRUS harmonizes electronic health record (EHR) data, imaging, high-resolution
  physiologic signals (including telemetry data and EEG where available), and tokenized note and report
  text (via OHNLP toolkit) with raw text retained locally across participating institutions using
  standardized data models and governance frameworks. The repository is designed to enable secure,
  auditable, and reproducible artificial intelligence (AI) research to improve recovery from acute
  illness. Data are curated within a NIST 800-53-aligned secure enclave architecture with role-based
  access controls, audit logging, and controlled-access governance review. CHoRUS supports AI model
  development, validation, benchmarking, and translational research while maintaining compliance with
  HIPAA and NIH data-sharing policies. The project website reports an anticipated final dataset of
  100,000 patient admissions across 9 data modalities from 14 contributing hospitals, with a current
  released dataset of 50,000 patient admissions from ICU, PICU, and NICU, 1.6 billion rows of EHR OMOP
  data, 7,642 admissions with radiology data, and 23 Tb of waveform data. The packaged RO-Crate release
  records a content size of 1.2 tb. Recommended citation: "The CHoRUS for Clinical Care AI Network. The
  Bridge2AI CHoRUS for Clinical Care AI Dataset: A Multi-Center, Multi-Modal, High-Resolution Critical
  Care Dataset, version 1.0 Beta. Harvard Dataverse, Apr. 2026."
doi: 10.18130/V3/XNBOPG
version: 1.0 Beta
status: >-
  Beta interim release; the packaged release contains partial data (not all patients in the CHoRUS full
  cohort are included, and no DICOM images are included).
issued: '2026-04-03T00:00:00'
license: Data Use Agreement available at 'https://chorus4ai.org/dataset/'
created_by: The CHoRUS for Clinical Care AI Network
page: https://chorus4ai.org/
conforms_to_schema: >-
  OMOP Common Data Model for structured EHR domains (demographics, medication administration,
  procedures, nursing flowsheets, diagnoses); OHNLP open-source schema for extracted and tokenized
  clinical notes; DICOM for imaging; WFDB for waveform telemetry; EDF+ and Persyst for EEG waveforms.
  The RO-Crate JSON-LD packaging descriptor conforms to RO-Crate 1.2 and the dataset metadata is
  additionally described using the Croissant RAI specification.
was_derived_from: >-
  Routine clinical care data repurposed from hospital electronic health records, PACS imaging archives,
  bedside monitor telemetry gateways/middleware, and hospital EEG databases at participating CHoRUS
  data acquisition centers.
keywords:
  - Bridge2AI
  - CHoRUS
  - Electronic health records
  - physiological data
  - medical images

