- id: d4d:resource-ai-readiness
  name: AI-readiness for Biomedical Data - Bridge2AI Recommendations
  description: 'The criteria against which the project rates its own AI-readiness. The project publishes
    a Precision Public Health (Voice) current rating: FAIRness 100% (findable, accessible, interoperable,
    reusable all met); Provenance 100% (transparent, traceable, interpretable, key actors identified all
    met); Characterization 80% (semantics, statistics, standards and potential sources of bias met, data
    quality not met); Pre-model explainability 100% (data documentation templates, fit for purpose, verifiable
    all met); Ethics 100% (ethically acquired, ethically managed, ethically disseminated, secure all met);
    Sustainability 50% (persistent and well-governed met, domain-appropriate and associated not met);
    Computability 75% (standardized, computationally accessible and portable met, contextualized not met).
    The RO-Crate ships an ai_ready_score.json self-assessment for release 3.0.0 that marks all criteria
    as having content, recording 15 documented datasets, 2 computation steps, 1 software instance, 117
    authors, 55 documented schemas, a total size of 12.9 GB, and checksums for 65% of files (11 of 17).'
- id: d4d:resource-rocrate
  name: RO-Crate metadata package for adult release 3.0.0
  description: An RO-Crate conforming to https://w3id.org/ro/crate/1.2, identified as ark:59853/rocrate-b2ai-voice-3.0.0,
    generated with fairscapeVersion 1.0.24 and typed as both an EVI Dataset and an EVI ROCrate. It carries
    schema.org and EVI vocabulary plus Croissant Responsible AI (rai:) properties covering data collection,
    limitations, biases, use cases, release and maintenance plan, missing data, raw data, collection timeframe,
    imputation, manipulation, preprocessing, annotation protocol and analysis, annotations per item, annotator
    demographics, machine annotation tools, annotation platform, personal and sensitive information, and
    social impact. It registers 15 component datasets, 55 EVI schemas describing 2,562 columns of released
    tables, two computations and one software entity, and records an evi:merkleRootHash of f1663e1069a9894b21202ebf05f4839b9fb82b79ba5b337df54dd18f36d3be47
    together with a local evidence graph rendering.
