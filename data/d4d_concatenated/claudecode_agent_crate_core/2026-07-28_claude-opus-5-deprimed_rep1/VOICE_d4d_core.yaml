- id: https://doi.org/10.13026/h995-bt35
  name: Bridge2AI-Voice Pediatric Dataset, PhysioNet version 1.1.0
  title: Bridge2AI-Voice Pediatric Dataset
  description: 'Current pediatric release, published 1 May 2026. Contains derived audio features for 23,533
    recordings collected from 300 participants aged 2 to 18 at the Hospital for Sick Children. A minor
    update over version 1.0.0 with no new participants: it releases audio features for all free speech
    tasks that were manually checked for the presence of unconsented speakers and personally identifying
    information, and adds new audio-quality metrics and per-recording metadata. This is a separate PhysioNet
    project from the adult b2ai-voice dataset, not a version of it. Data collection and sharing was approved
    by the Research Ethics Board at the Hospital for Sick Children. Participants were eligible if aged
    2 to 18 with English proficiency; participants over 18 and individuals who were non-verbal were excluded.
    Non-patients were recruited through research postings. All data were collected through customized
    reproschema-ui software on tablets, using a headset for most participants and the built-in tablet
    microphone for the remainder where headphones were not tolerated or complex medical conditions applied.
    All participants completed recording and demographic data collection in one session; where a participant
    lacked adequate comprehension or familiarity with their past medical history, a parent or decision-maker
    completed the survey on a separate tablet during the recording.'
