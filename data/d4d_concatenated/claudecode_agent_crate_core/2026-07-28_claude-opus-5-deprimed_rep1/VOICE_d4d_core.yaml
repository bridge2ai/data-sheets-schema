id: https://b2ai-voice.org/
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'Bridge2AI-Voice is a large, ethically sourced, demographically diverse dataset of voice,
  speech, and respiratory sounds linked to health information, generated by the Bridge2AI-Voice consortium
  under the NIH Common Fund Bridge2AI program (award OT2OD032720). Participants are recruited prospectively
  at high-volume expert specialty clinics and academic hospitals in the United States and Canada, and
  complete a standardized protocol combining acoustic tasks (sustained vowels, glides, loudness and diadochokinesis
  tasks, reading passages, free speech, cough and breathing sounds) with detailed demographics, confounder
  surveys, validated patient questionnaires and patient-reported outcomes, and clinician-validated diagnoses.
  Data acquisition is centred on five disease cohort categories for which voice change has been associated
  with specific diseases with recognized unmet needs: voice disorders, neurological and neurodegenerative
  disorders, mood and psychiatric disorders, respiratory disorders, and pediatric voice and speech disorders.
  Public releases are feature-only. They distribute de-identified derived representations of the audio
  - spectrograms, mel spectrograms, MFCCs, pitch, loudness, periodicity, articulatory (EMA) estimates,
  phonetic posteriorgrams and static acoustic features - together with tabular phenotype files and JSON
  data dictionaries; the original voice recordings are withheld and released only through a separate controlled-access
  process. The adult flagship dataset and the pediatric dataset are published as two distinct PhysioNet
  projects covering distinct cohorts collected under separate protocols and separate ethics approvals;
  the pediatric cohort is recruited exclusively at the Hospital for Sick Children (SickKids) using the
  reproschema-ui application, while the adult cohort is collected with the Bridge2AI-Voice app across
  five North American sites.'
purposes:
- name: Build a flagship ethically sourced voice dataset for AI research
  description: Primary objective of the Bridge2AI-Voice data generation project.
  response: Bridge2AI-Voice seeks to create a flagship, standardized and ethically sourced dataset of
    voices linked to health information to fuel research and discovery in voice biomarkers. The consortium
    aims to promote integration of voice as a biomarker of health in clinical care by generating a large
    multi-institutional, ethically sourced and diverse voice dataset linked to multimodal health biomarkers,
    and then to build predictive models that assist in screening, diagnosis and treatment of a broad range
    of diseases, including several with unmet clinical needs.
- name: Enable development, benchmarking and validation of clinical voice models
  description: Stated aim of the released dataset.
  response: The Bridge2AI Voice dataset aims to enable the development, benchmarking or validation of
    clinically applicable machine-learning models for diagnosing a wide range of health conditions using
    voice data, including vocal pathologies and neurological, psychiatric, respiratory and pediatric voice
    disorders. The dataset contains voice recordings and key metadata and is structured to be Findable,
    Accessible, Interoperable and Reusable (FAIR).
- name: Support research applications rather than operational decision making
  description: Applications the dataset is meant to address.
  response: The dataset is primarily intended for research applications, specifically the development
    of AI and machine-learning models for healthcare. It aims to support clinical research in disease
    screening, diagnosis and monitoring through voice biomarkers, and can be used for AI model pretraining,
    fine-tuning, benchmarking or validation.
- name: Establish the field of audiomics
  description: Programmatic purpose stated in the consortium white paper.
  response: The consortium set out to define and create standards for "audiomics", the interdisciplinary
    field of audio analysis applied to biomedicine to identify unique audio biomarkers of health and disease.
    Beyond the primary deliverable of a publicly available voice database, the team aims to ensure quality
    and accuracy of acoustic and associated clinical data through clinical validation and evidence-based
    recording protocols; achieve interoperability by creating new bioinformatics standards for voice data;
    create benchmarks of diversity metrics and minimize the risk of algorithmic bias; define ethical and
    legal norms safeguarding patients' data while supporting data sharing; develop infrastructure for
    audiomics data storage and sharing within and across research institutions; and formulate training
    pathways for scientists, engineers, bioethicists and clinicians.
tasks:
- name: Disease detection and classification from voice
  description: Predefined tasks accompanying the release.
  response: The current version of the dataset comes with predefined tasks and labeling. The tasks are
    primarily designed for training machine-learning models for disease detection and classification using
    voice data. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders. However, there are no predefined recommended data
    splits for training, validation or testing; researchers are encouraged to create their own data splits
    based on their specific requirements.
- name: Grant-level specific aims
  description: The six modules of the funded Bridge2AI-Voice project.
  response: 'Aim 1, Data Acquisition Module: build a multi-modal, multi-institutional, large scale, diverse
    and ethically sourced human voice database linked to other biomarkers of health that is AI/ML friendly.
    Aim 2, Standard Module: introduce the field of acoustic biomarkers by developing new standards of
    acoustic and voice data collection and analysis for voice AI research. Aim 3, Tool Development and
    optimization: develop software and cloud infrastructure for automated voice data collection through
    a smartphone application, including integrated acoustic amplifiers and acoustic quality standardization,
    and implement federated learning technology. Aim 4, Ethics Module: integrate existing scholarship,
    tools and guidance with new standards for identifying, anticipating and addressing ethical and trustworthy
    issues, and develop new guidelines for consenting to voice data collection, sharing and utilization.
    Aim 5, Teaming Module: build bridges between medical voice research, acoustic engineering and the
    AI/ML world. Aim 6, Skills and Workforce Development Module: develop a curriculum on voice biomarkers
    and create a community of voice AI researchers, especially from underserved communities.'
addressing_gaps:
- name: Absence of large, diverse, well-documented clinical voice data
  description: The gap the dataset was created to fill.
  response: The Bridge2AI Voice dataset was created to address a gap in the availability of large-scale,
    diverse and well-documented voice data for use in clinical machine-learning applications. Previous
    studies on machine learning-based voice diagnosis produced promising results, but their sample sizes
    were too small or they lacked the key metadata needed for training robust, clinically useful models.
    The dataset aims to bridge this gap by providing an ethically sourced, large and diverse dataset to
    develop, benchmark or validate clinically applicable AI/ML models, facilitating the use of voice as
    a non-invasive, cost-effective biomarker for screening, diagnosis and monitoring of a wide range of
    health conditions.
- name: Lack of standards for voice and speech data collection
  description: Methodological gap addressed by the consortium's standards work.
  response: Comparing studies and pooling data are challenging because of the lack of standards in how
    voice and speech data are collected. Within academic research many studies remain at the level of
    proof of concept with small- to medium-sized datasets often using voice as the only data type; within
    industry, datasets are often private, limiting the ability to audit ML models and the accuracy of
    training data labels. When machine-learning applications for screening and diagnosis of laryngeal
    cancer were reviewed, most studies reported training datasets of fewer than 300 patients and only
    two studies used more than one data modality.
- name: Industry voice data lacks clinical ground truth
  description: Gap between the scale of industry voice holdings and clinical validity.
  response: Although industry has access to vast amounts of voice data from users, it lacks access to
    accurate clinical data or demographic information. This deficiency limits the ability to annotate
    data for AI training and to compare algorithmic outputs with criterion standard medical assessment,
    and prevents external auditing of datasets used for training to ensure fair representation of diverse
    populations.
- name: Sparse pediatric voice and speech data
  description: Gap addressed specifically by the pediatric release.
  response: Pediatric and adult voice and speech production are fundamentally different because the respiratory
    system and larynx undergo rapid functional maturation throughout childhood, so normative data from
    adults cannot be generalized to pediatric populations. Despite the clinical importance of detecting
    pediatric communication disorders such as autism spectrum disorder and speech delays, the availability
    of large-scale pediatric datasets remains limited, in part because data collection in pediatric populations
    poses unique challenges including privacy issues, consent processes and the need for developmentally
    appropriate tasks.
