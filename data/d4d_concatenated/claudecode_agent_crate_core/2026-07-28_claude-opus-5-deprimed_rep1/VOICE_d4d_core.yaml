instances:
- name: Participant, adult flagship cohort
  instance_type: person
  description: Each instance represents a person. The dataset documentation states that there are currently
    around 833 instances and that the dataset represents 833 patients/subjects; the PhysioNet adult releases
    3.0.0 and 3.1.0 both report data for 833 participants across five sites in North America. Note that
    participants may have repeated visits, so there may be more than one row per participant in the phenotype
    data files, and there is no requirement that a participant provide the same response at each visit.
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant. At
    each site a local clinician provided the diagnosis based on a clinical interview and appropriate work-up.
    For the psychiatric disorders cohort, this assessment was determined using the participant's EHR record
    or an active prescription, done outside of data collection by an appropriately licensed clinician.
  sampling_strategies:
  - name: Non-probability clinic-based sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
    - Patients presenting at high volume expert specialty clinics and academic institutions in the United
      States and Canada
    - Healthy controls without the conditions of interest
    why_not_representative:
    - It is a sample of a larger, ongoing collection. The data is not representative because it was collected
      at a limited number of geographic locations.
    strategies:
    - Sampling Method recorded in the study metadata as Non-Probability Sample.
    - Participants are recruited across different academic institutions from high volume expert clinics
      based on diagnosis and inclusion/exclusion criteria. High volume expert clinics are outpatient clinics
      within hospital systems or academic institutions that have developed expertise in a specific disease
      area and see more than 50 patients per month from the same disease category.
    - The team hopes to make the sample more representative by shifting to remote collection and designing
      the recruiting approach in a way that controls for more variables.
  missing_information:
  - missing:
    - Responses to optional questionnaire items
    - Cohort-specific questionnaire items not applicable to a given participant
    - Derived features that could not be computed for some recordings
    why_missing:
    - Some questions are optional.
    - There may be data collection irregularities that caused some information to be missing from individual
      instances.
    - Each individual answered a common set of questions and then responded to additional questions relevant
      to their primary diagnostic category.
    - Some files, whether due to length or other issues, could not generate certain features and so are
      not included in the bundled data.
- name: Participant, pediatric cohort
  instance_type: person
  description: Each instance represents a person aged 2 to 18 recruited at the Hospital for Sick Children.
    The Bridge2AI-Voice Pediatric Dataset version 1.1.0 contains data from 300 participants. All pediatric
    participants completed the recording and demographic data collection in one session.
  counts: 300
- name: Voice-derived recording
  instance_type: audio recording derivation
  description: Each recording corresponds to one acoustic task performed by a participant within a session
    and is represented in the public releases by derived features rather than by the original waveform.
    The project documentation reports that adult version 3.0 contains approximately 61,937 voice-derived
    recordings from 833 adult participants; this figure is stated approximately and no exact release-level
    recording total is published, so no structured count is asserted here. Per-feature recording counts
    are given in the release documentation, for example 29,278 torchaudio spectrograms and 32,522 torchaudio
    pitch tracks in adult version 3.1.0, and 29,020 torchaudio spectrograms and 32,236 torchaudio pitch
    tracks in adult version 3.0.0. The pediatric version 1.1.0 release contains derived audio features
    for 23,533 recordings.
anomalies:
- name: Sources of noise and heterogeneity
  anomaly_details:
  - Different sites have different collection configurations.
  - The collection protocol changed over the course of the study.
  - 'Confounding factors: noise artifacts, variations in diagnostic practices, inaccurate questionnaire
    responses, underreporting.'
  - Distinct iPad devices were used at each site, and participants were screened for different disorders
    based on site, so they also had their data collected with different devices.
  - The data were recorded with a head-mounted headset with a microphone that could be at slightly different
    distances. The clinical diagnosis, depending on the disorder, was performed by one clinician or based
    on an EHR record or prescription.
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
  - Version 3.1.0 fixed broken parquet files present in the previous release, and version 2.0 reprocessed
    spectrograms to fix minor issues identified in the version 1.x release.
known_biases:
- name: Sampling bias
  bias_type: sampling_bias
  bias_description: Participants are recruited from specialty clinics and associated institutions using
    a non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
    English speakers; this produces clinically enriched case mixes that may not represent general population
    distributions.
  mitigation_strategy: The consortium plans to shift toward remote collection and to design recruitment
    in a way that controls for more variables, and includes community outreach clinics serving underserved
    and under-represented populations under a Plan for Enhancing Diverse Perspectives.
- name: Geographic and cultural bias
  bias_type: representation_bias
  bias_description: Data are collected at a limited number of North American sites, and although the project
    seeks diversity, it may under-represent speakers from other regions, cultures, languages and healthcare
    systems; early releases focus on English, with Spanish protocols planned but not yet fully represented.
  affected_subsets:
  - Non-English speakers
  - Populations outside the United States and Canada
- name: Clinical spectrum bias
  bias_type: selection_bias
  bias_description: Because participants are selected into disease cohorts where voice changes are expected,
    the prevalence and severity of conditions in the dataset differ from those in routine primary care
    or community settings, which may inflate model performance when evaluated within this dataset.
- name: Device and environment bias
  bias_type: measurement_bias
  bias_description: Recordings are made using standardized but not identical hardware and primarily in
    clinical environments; future at-home collection or deployment on other devices may encounter different
    background noise, channel characteristics and user behavior.
- name: Algorithmic bias in machine annotations
  bias_type: algorithmic_bias
  bias_description: Transcripts and some derived features rely on off-the-shelf models such as OpenAI
    Whisper and other audio toolkits whose performance may vary across demographic groups; the dataset
    team has not independently audited these tools for fairness, so downstream users should consider their
    biases when interpreting results.
- name: Participation and trust bias
  bias_type: selection_bias
  bias_description: Groups that have less trust in the medical system or in AI, or that are less proximal
    to the collection sites, would have been less likely to be recruited.
known_limitations:
- name: Feature-only release
  limitation_type: scope_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may constrain the ability
    to reproduce end-to-end audio pipelines.
  recommended_mitigation: Raw audio can be requested through the separate controlled-access process administered
    by the Data Access Compliance Office at DACO@b2ai-voice.org, with distribution via Synapse.
- name: Adult-only scope of the flagship release
  limitation_type: coverage_limitation
  limitation_description: The adult release only includes an adult cohort; models trained solely on this
    dataset may not generalize to younger age groups or to languages beyond those represented.
  recommended_mitigation: A separate pediatric dataset covering 300 participants aged 2 to 18 is published
    as its own PhysioNet project.
- name: De-identification reduces analytic granularity
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed, which reduces the risk of re-identification
    but also limits detailed fairness assessments and certain confounder adjustments.
- name: No predefined splits, benchmarks or label-uncertainty measures
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train-validation-test splits or benchmarking
    tasks and does not include explicit per-instance label-uncertainty measures, so researchers must design
    their own evaluation protocols and handle label noise and missingness.
- name: Access governance constrains reproducibility
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers and can complicate the
    reproducibility of pipelines that require both features and raw audio.
- name: Unequal cohort representation
  limitation_type: representativeness_limitation
  limitation_description: The public data releases do not contain an equal distribution of the five disease
    cohort categories, and the dataset has skews based on disorder category, site and other demographic
    factors.
  recommended_mitigation: Users should consider the multivariate distribution when assessing utility for
    different questions. Further releases will contain additional data.
- name: Distribution shift over time
  limitation_type: temporal_limitation
  limitation_description: Changes in diagnostic criteria or practices could be a source of distribution
    shift, and the collection protocol changed over the course of the study.
confidential_elements:
- name: Confidential data
  confidential_elements_present: false
  confidentiality_details:
  - The dataset documentation answers "No" to the question of whether the dataset contains data that might
    be considered confidential, such as data protected by legal privilege or doctor-patient confidentiality.
  - The RO-Crate for release 3.0.0 records a confidentiality level of "Limited dataset available with
    Data Use Agreement".
  - The Data Transfer and Use Agreement covering the raw data states that the Data is Personally Identifiable
    Information as defined in OMB Memorandum M-07-16 and is covered under a Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant.
content_warnings:
- name: Potentially offensive content in free speech transcripts
  content_warnings_present: true
  warnings:
  - This dataset includes the transcription of free speech tasks. While the inclusion of offensive, insulting
    or threatening content is unlikely, it cannot be completely avoided, as research participants are
    responsible for their choice of language.
  - Transcripts of free speech audio have been removed from the public releases, and spectrograms and
    similar features were excluded where the audio contained free speech.
subpopulations:
- name: Demographic sub-populations identified in the dataset
  subpopulation_elements_present: true
  identification:
  - Age
  - Gender
  - Sex
  - Ethnicity
  - Socioeconomic status
  - Race
  - Primary language
  distribution:
  - The public data releases do not contain an equal distribution of the five disease cohort categories.
    Further releases will contain additional data.
  - The dataset has skews based on disorder category, site and other demographic factors; users should
    consider the multivariate distribution when assessing utility for different questions.
sensitive_elements:
- name: Sensitive data elements
  sensitive_elements_present: true
  sensitivity_details:
  - 'Racial or ethnic origins: the dataset includes race information.'
  - 'Sexual orientations: the dataset includes sexual orientation information.'
  - 'Financial or health data: the dataset includes socioeconomic and health information.'
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory diseases,
    as well as symptom scores from questionnaires, which constitute sensitive personal health data.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    while finer-grained geographic identifiers, direct identifiers and many socio-economic and cultural
    details have been removed during de-identification to reduce re-identification risk.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    the feature-only dataset; raw voice recordings, which are themselves biometric identifiers, are made
    available only under controlled access.
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
acquisition_methods:
- name: Direct observation and self-report with clinical verification
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The data was directly observable and reported by subjects. Clinical diagnoses were verified by clinicians
    reviewing audio and/or imaging data, looking at electronic health records, or medication prescriptions.
  - Clinical validation is performed by a qualified physician or practitioner based on established gold
    standards for diagnosis, which differ by disease cohort.
  - Acoustic, phonetic, prosodic and articulatory features are derived computationally from the collected
    audio rather than observed directly.
collection_mechanisms:
- name: Bridge2AI-Voice application on tablets and smartphones
  mechanism_details:
  - Voice samples are collected prospectively using a custom software application, the Bridge2AI-Voice
    App, following the Bridge2AI-Voice protocols. Data collection was conducted using a custom application
    on a tablet with a headset used for data collection when possible.
  - Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36
    microphone and an Apple dongle to connect it to the iPad.
  - For pediatrics, all data is collected using reproschema-ui with the Bridge2AI-Voice pediatric protocol.
  - HVEC and remote data collection occur through two platforms, the Bridge2AI Voice Web app and the Bridge2AI
    Voice iOS app. The iOS app is restricted to iOS-compatible devices, while the Web App can run on a
    computer, tablet or phone device. No software is downloaded or installed. Both apps are HIPAA-compliant
    and only store data during the collection phase; the data are removed as soon as the page is closed
    and there is no login required. Data are sent over a secure HTTPS protocol to a HIPAA-compliant storage
    server hosted by an NIH STRIDES partner.
  - A total of 22 acoustic tasks are recorded through the app. Detailed demographic data and surveys about
    confounding factors such as smoking and drinking history are collected through the smartphone application,
    and validated tools and questionnaires for each disease category are integrated into the app.
  - Other multimodal data, including imaging, genomic data for the neuro cohort, laryngoscopy imaging
    and other EHR data, is extracted from different sites independently and uploaded through the REDCap
    database. No external data was released in the v3.0.0 release.
  - Data collection is performed in the clinic with the assistance of a trained research assistant. Future
    data collection will also occur remotely; remote data collection did not occur for the initial dataset
    release.
collection_timeframes:
- name: Funded project period, within which adult data collection takes place
  start_date: '2022-09-01'
  end_date: '2026-11-30'
  timeframe_details:
  - The start and end dates recorded here are the NIH project period from NIH RePORTER, not a published
    data collection window; no explicit collection start and end dates are given in the sources.
  - The dataset documentation states that the data was collected over a period of 12 months. That statement
    appears in the healthsheet section that describes the v2.0.0-era dataset and should be read as applying
    to that earlier release rather than to the current releases; the RO-Crate for release 3.0.0 gives
    the broader window below.
  - Data collection for the adult flagship cohort began after project launch in 2023 and is ongoing across
    five North American sites toward an anticipated enrollment of approximately 3,000 participants by
    November 2026; the participants and recordings included in dataset version 3.0.0 were collected roughly
    between 2023 and 2025.
  - 'The study protocol describes a prospective cohort study over 4 years with a phased approach: Phase
    1 Exploratory, with data collection for up to 180 participants at main sites, completed November 2023;
    Phase 2 Pilot, to cumulatively reach up to 600 participants, begun November 2023 and ongoing in November
    2024; Phase 3 Expansion, to cumulatively reach up to 3,000 participants; and Phase 4 Outreach, to
    cumulatively reach 5,000 participants.'
- name: Dataset release snapshots
  timeframe_details:
  - 'Dataset releases are static snapshots: adult v1.0 (initial public release in 2024, data published
    and made available at the end of November 2024), v1.1 (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18),
    v3.0.0 (2025-12-16) and v3.1.0 (2026-05-01), each corresponding to a frozen state of the underlying
    data collection.'
  - 'Pediatric releases: v1.0.0 (2025-12-17) and v1.1.0 (2026-05-01).'
data_collectors:
- name: Research teams and clinicians at participating sites
  role: Data collection and clinical validation
  collector_details:
  - Research teams, which may include medical, graduate or undergraduate students, coordinated with clinicians
    and doctors to identify appropriate participants. These clinicians and doctors were listed under the
    IRB as co-investigators and were added to the consortium so that their names are included on consortium-level
    publications that emerge from the research. Hospital staff were not involved in scheduling but assisted
    in the logistics of coordinating data collection.
  - Data collection takes place in high volume expert clinics across the participating institutions, performed
    during clinic visits by the research team including the investigator and research coordinators or
    research assistants.
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines; detailed demographic breakdowns
    of annotators are not provided in the public documentation.
missing_data_documentation:
- name: Missingness in the released files
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  - Some derived audio features could not be computed for all recordings due to quality or length constraints,
    and features relating to free speech or sensitive records have been removed.
  missing_data_causes:
  - Some questionnaire items are optional.
  - Data collection irregularities.
  - Cohort-specific instruments applied only to the relevant disease category.
  - Removal of free-speech and sensitive-record features during de-identification.
  - Processing failures for some recordings due to length or other issues.
  handling_strategy: No additional imputation is applied in the released files. The dataset has been audited
    internally for missingness and consistency by the data release team, and a missingness table is included
    with the dataset.
raw_data_sources:
- name: Original recordings and clinical records
  source_description: The original raw data consist of high-quality voice, speech and respiratory audio
    waveforms recorded on tablet or smartphone devices with headset microphones when available, plus responses
    to structured demographic and medical history questionnaires, disease-specific validated questionnaires
    and other patient-reported outcomes, together with clinical diagnoses and other metadata extracted
    from electronic health records.
  source_type:
  - Audio waveform recordings
  - Structured questionnaire responses captured in REDCap
  - Electronic health record extracts
  - Imaging collected retrospectively from patient charts
  - Genomic data for a defined sub-cohort
  access_details: The public feature-only PhysioNet releases contain de-identified derived representations
    of the audio; access to the underlying raw audio is available only through a separate controlled-access
    process. Raw audio for the adult cohort is distributed via Synapse at https://www.synapse.org/Synapse:syn72370534/
    and for the pediatric cohort at https://www.synapse.org/Synapse:syn73617068, in both cases after institutional
    sign-off arranged with the access committee at DACO@b2ai-voice.org.
  raw_data_format:
  - WAV audio
  - REDCap exports
  - Brain Imaging Data Structure v1.9.0 directory layout
sampling_strategies:
- name: Dataset-level sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Ongoing multi-site prospective collection across five North American recording sites
  why_not_representative:
  - The data is not representative because it was collected at a limited number of geographic locations.
  strategies:
  - The study metadata records the sampling method as Non-Probability Sample, the design as Observational
    with a Cohort observation model and a Cross-sectional time perspective, and the anticipated enrollment
    by 2027 as 10,000 participants.
  - The IRB protocol sets a target of up to 5,000 participants per disease category and controls, and
    states that the total number of 30,000 participants would be reached by collaboration with other participating
    institutions and existing cohorts. As this database is intended to fuel AI research, no sample size
    calculation was applicable to the methodology.
raw_sources:
- name: Retention and availability of raw data
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - The raw data, post de-identification, was saved in addition to the preprocessed data. It is saved
    and is not accessible publicly.
  - The published Bridge2AI-Voice Adult Dataset on PhysioNet contains derived features from the audio
    waveforms; the PhysioNet project does not contain raw audio. Accessing raw audio is a more involved
    process and requires institutional sign-off through the access committee at DACO@b2ai-voice.org, with
    data made available via Synapse at https://www.synapse.org/Synapse:syn72370534/ for the adult cohort
    and https://www.synapse.org/Synapse:syn73617068 for the pediatric cohort.
  - The consortium aims to include voice data in future releases with additional precautions taken to
    ensure data security.
preprocessing_strategies:
- name: Audio standardization and feature derivation
  description: Conversion of raw waveforms into the released derived representations.
  preprocessing_details:
  - Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing
    filter applied; the standardized audio is then segmented by task and passed through quality checks.
  - Spectrograms are time-frequency representations computed using the short-time Fast Fourier Transform
    with a 25 ms window size, 10 ms hop length and a 400-point FFT, downsampled by a factor of two in
    the time domain after derivation. Version 1.1 used a 512-point FFT without downsampling.
  - Sixty Mel-frequency cepstral coefficients are extracted using the spectrograms, and Mel spectrograms
    are computed with the same parameters and 60 Mel bins.
  - Articulatory features are generated using the Speech Articulatory Coding (sparc) package, producing
    kinematic traces of vocal tract articulators and source features as well as measures of loudness,
    periodicity and pitch, all gathered at 50 Hz.
  - Acoustic features are extracted using OpenSMILE, capturing temporal dynamics and acoustic characteristics;
    phonetic and prosodic features are computed using Parselmouth and Praat, providing measures of fundamental
    frequency, formants and voice quality.
  - Phonetic posteriorgrams, time-varying categorical distributions over acoustic units of speech at 100
    Hz, are generated via the ppgs package.
  - Transcriptions were generated using OpenAI's Whisper Large model. Transcripts from free-speech audio
    were removed before release.
  - 'Detected pitch is provided over time with a minimum and maximum pitch of 80 and 500 Hz for the torchaudio
    estimate, and with a range of 50-550 Hz for the sparc estimate. Estimated loudness is based on the
    average absolute amplitude of the audio waveform using 20 ms windows, and estimated periodicity is
    derived using 20 ms windows. Estimated electromagnetic articulography uses a deep learning model with
    dimensions T by 12 corresponding to X and Y positions of six articulators: tongue dorsum, tongue body,
    tongue tip, lower incisor, upper lip and lower lip. Phonetic posteriorgram probabilities span 40 phoneme
    categories.'
  - 'The waveform-derived features are stored using two formats: a fixed feature format that includes
    static features extracted from the entire waveform, and a temporal format that varies for each audio
    file depending on the length of the recording.'
  - The RO-Crate for release 3.0.0 records this as the computation "VOICE Features Processing", a processing
    step for taking raw data and converting it into spectrograms and features using b2ai-prep, run by
    "Alastair", dated 2026-01-29, which generated the nine Parquet feature datasets and used the B2AIPrep
    Library.
  used_software:
  - id: d4d:software-b2aiprep
    name: b2aiprep
    description: A Python package to prepare acoustic data for the Bridge2AI voice project; used for organizing
      and preprocessing the dataset, converting raw audio waveforms into the Parquet feature files and
      merging source data into the phenotype files. Release 3.0.0 was generated with b2aiprep v3.0.0;
      the RO-Crate registers the software entity at version 3.0.2 with a date modified of 2026-01-06.
    version: 3.0.2
    url: https://github.com/sensein/b2aiprep
  - id: d4d:software-senselab
    name: SenseLab
    description: Used for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
- name: Data organization and format conversion
  description: Conversion of collected data into the released directory layouts.
  preprocessing_details:
  - The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from REDCap
    were converted to be compliant with the Brain Imaging Data Structure v1.9.0. Pediatric data collected
    through ReproSchema-UI is extracted and transformed into REDCap format and subsequently converted
    to BIDS.
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using the b2aiprep library,
    reorganizing the former single phenotype table into thematically organized TSV files with accompanying
    JSON data dictionaries; static per-recording feature summaries are provided in static_features.tsv,
    and de-identification and filtering steps are applied before packaging.
  - The RO-Crate for release 3.0.0 records this as the computation "VOICE Phenotype Ingest", dumping and
    reformatting phenotype information from the REDCap database into b2ai-voice phenotype extracts, run
    by "Alastair", dated 2025-12-16, which generated the phenotype table datasets and used the B2AIPrep
    Library.
- name: De-identification and release filtering
  description: Transformations applied to reduce re-identification risk before release.
  preprocessing_details:
  - Prior to release, data are transformed to reduce re-identification risk and align with regulatory
    and ethical requirements. Direct identifiers and high-risk quasi-identifiers are removed; dates are
    coarsened or rebased; geographic information is generalized to the country level; narrative text fields
    and transcripts of free speech are removed; and raw voice waveforms are withheld from the feature-only
    release.
  - Additional filtering removes features for sensitive records and audio checks, and some derived features
    are dropped when processing fails or quality checks fail.
  - The data were extracted from the raw audio to limit re-identification, and only the extracted features
    are released with the dataset.
cleaning_strategies:
- name: Data cleaning
  cleaning_details:
  - The dataset documentation answers "No" to the question of whether there was any pre-processing for
    cleaning the data.
  - No instances were excluded from the dataset at the time of preprocessing.
  - Quality control of the data is performed throughout the four years of the project. The smartphone
    application for voice data collection includes models to ensure acoustic data quality, including volume
    standardization and noise cancellation. The team hired two acoustic engineers and three AI data scientists
    to analyze all samples from the Year 1 exploratory data collection phase to ensure acoustic quality
    and ML readiness. In each subsequent year of the study, 10% of the data is selected at random every
    month for quality control and ML readiness.
  - The audit protocol generates missingness tables, checks distributions and outliers, checks categorical
    responses against schema, runs quality control metrics for audio tasks, and for waveforms checks the
    amount of silence and duration and, for speech, checks produced speech relative to the intended passage.
  - The dataset has been audited internally for missingness and consistency by the data release team.
    A missingness table is included with the dataset. Certain aspects of the data, for example transcription,
    were generated using off-the-shelf models that have not been audited for correctness.
labeling_strategies:
- name: Clinical and questionnaire labeling
  data_annotation_protocol:
  - Annotations consist primarily of clinical labels and questionnaire-derived measures associated with
    each participant and recording. Participants complete validated instruments such as VHI-10, PHQ-9,
    GAD-7, PANAS, respiratory and cough questionnaires and voice instruments, which generate numerical
    scores and categorical indicators according to each instrument's published scoring guidelines.
  - Clinical investigators and care teams record diagnostic categories for voice, neurological, mood and
    respiratory conditions and other phenotype variables, drawing on clinical assessments and electronic
    health records; these labels are represented in disease-specific TSV files with accompanying JSON
    dictionaries.
  - The labeling strategy is a gold standard label available in the data, diagnosed by a clinician. Labelers
    follow the Bridge2AI protocols and ICD-10 codes.
  - In addition, machine-generated transcripts of certain voice tasks and numerous automatically extracted
    acoustic and articulatory features provide further labels and descriptors at the recording level.
  - 'Guidance for future researchers: the process for any new labels should be described alongside any
    release of a model or publication, and should include the exact variables used for the determination.'
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to the study for a
    prior diagnostic assessment. There is a single labeler per data item and one labeler provides a label
    per instance.
  - Clinical annotations are created by clinicians and research staff at participating North American
    institutions spanning otolaryngology, neurology, neuroscience, pulmonology and allied health disciplines;
    detailed demographic breakdowns of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves, whose demographics
    are captured in coarsened form in the phenotype tables; per-annotator demographic information, such
    as which specific clinician or staff member entered a label, is not exposed.
  labeling_details:
  - Each recording is associated with one set of clinical labels and questionnaire responses derived from
    a single participant, although participants may contribute multiple sessions over time; there is no
    crowd-sourced labeling and the documentation does not report multiple independent human ratings per
    individual recording.
  - Human-level performance in the applications the dataset is supposed to address varies widely.
imputation_protocols:
- name: Imputation
  imputation_rationale: The public datasets do not apply global statistical imputation to missing fields;
    instead, missing questionnaire responses, phenotype variables and derived features are left as explicit
    missing values or omitted rows.
  imputation_method:
  - No imputation is applied to the released data.
  imputation_validation:
  - The data release team audited missingness and users can implement study-specific imputation or complete-case
    strategies appropriate to their analyses.
annotation_analyses:
- name: Annotation quality analysis
  analysis_method: Questionnaire-based labels are generated using the standard scoring rules for each
    validated instrument, yielding total and subscale scores that can be mapped to symptom-severity bands;
    the scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  annotation_quality_details:
  - Diagnostic labels are derived from clinical assessments and electronic health records rather than
    crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses are treated
    as reference labels and may include multiple comorbid conditions per participant.
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues, but per-annotator disagreement statistics or detailed
    label-uncertainty measures are not presently included in the released dataset.
machine_annotation_tools:
- name: Automated feature extraction and transcription tools
  tools:
  - OpenSMILE
  - Praat
  - parselmouth
  - TorchAudio
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram (ppgs) models
  - OpenAI Whisper Large
  - b2aiprep
  tool_descriptions:
  - OpenSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including measures
    of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units for each
    recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and merging of
    phenotype data into the released files.
  tool_accuracy:
  - Transcripts and some derived features rely on off-the-shelf models whose performance may vary across
    demographic groups; the dataset team has not independently audited these tools for fairness, so downstream
    users should consider their biases when interpreting results.
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
existing_uses:
- name: Prior uses of the dataset
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
  - A pilot feasibility study of the Bridge2AI-Voice application was conducted at the University of South
    Florida Health Voice Center between 5 June 2023 and 28 July 2023, enrolling 47 participants and assessing
    task performance metrics and participant feedback; audio data was not collected at that stage of app
    development.
use_repository:
- name: Repository of works using the dataset
  repository_details:
  - The dataset documentation answers "No" to the question of whether there is a repository that links
    to any or all papers or systems that use the dataset, besides Google Scholar.
  - 'Using the dataset requires citation of the protocol development paper: Bensoussan, Yael, et al. "Developing
    Multi-Disorder Voice Protocols: A team science approach involving clinical expertise, bioethics, standards,
    and DEI." Proc. Interspeech 2024.'
other_tasks:
- name: Other potential tasks
  task_details:
  - Cohort selection using the questionnaire features distributed in the phenotype folder.
  - Study of developmental norms in pediatric voice, creation of AI-driven tools for early screening,
    and support of clinical insight, using the pediatric dataset.
future_use_impacts:
- name: Considerations for future use
  impact_details:
  - This dataset has skews based on disorder category, site and other demographic factors. Users should
    consider the multivariate distribution when assessing utility for different questions.
  - These restrictions reflect the B2AI-Voice Consortium's commitment to advancing ethical and trustworthy
    research practices that respect and protect the rights and interests of research participants.
discouraged_uses:
- name: Discouraged applications
  discouragement_details:
  - The dataset should not be used for non-research or non-clinical applications such as hiring decisions,
    insurance premium adjustments, or any form of surveillance that could lead to discrimination or harm.
    These limitations are intended to prevent unethical or biased outcomes that could negatively impact
    individuals based on their health conditions or voice characteristics.
  - The dataset is intended strictly for research that prioritizes patient safety, privacy and ethical
    use.
intended_uses:
- name: Intended research uses
  usage_notes: The dataset is intended solely for commercial and non-commercial research purposes by Authorized
    Researchers, and can be used for AI model pretraining, fine-tuning, benchmarking or validation.
  use_category:
  - Model development and training
  - Benchmarking and validation
  - Exploratory and methodological research
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived features
    with diagnostic categories or symptom severity for conditions such as vocal fold pathology, neurological
    and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance on
    a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
    de-identified derived features, including work on representation learning, domain adaptation and multimodal
    integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
prohibited_uses:
- name: Prohibited uses under the registered access agreement
  prohibition_reason:
  - The dataset is not to be used to attempt to re-identify research participants, nor for any actions
    that could reasonably lead to re-identification.
  - The dataset is not to be used for any purpose that could foreseeably cause harm or stigmatization
    to research participants, their families, communities, or specific populations.
  - Intellectual property protections, database rights, or related rights may not be used in a manner
    that restricts or limits access to any part of the dataset or to any conclusions derived from it.
    This restriction ensures that future use of the dataset remains unrestricted, in alignment with the
    Open Science principles upheld by the B2AI-Voice Consortium.
  - The dataset is explicitly not intended for operational decision making about specific individuals
    such as hiring, insurance pricing, law enforcement or surveillance.
  - Sale of all or part of the Data on any media is not permitted.
  - Recipients will not use the Data, either alone or in concert with any other information, to make any
    effort to contact individuals who are the subjects of the Data without appropriate IRB approval, specific
    written approval from the Provider, and informed consent from the individual if required.
distribution_formats:
- name: PhysioNet adult dataset, registered and credentialed access
  description: A derived dataset containing spectrograms and combined phenotypic data is available on
    PhysioNet under a permissioned access mechanism. Registration on PhysioNet and signing of a data use
    agreement enable access. For version 1.1 the access policy was that only registered users who signed
    the specified data use agreement could access the files; for versions 3.0.0 and 3.1.0 the access policy
    is that only credentialed users who sign the DUA can access the files, and no training is required.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  - https://physionet.org/content/b2ai-voice/3.0.0/
- name: PhysioNet pediatric dataset, credentialed access
  description: The pediatric dataset is available through a separate PhysioNet project under registered
    access. Only credentialed users who sign the DUA can access the files; no training is required.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
  - https://physionet.org/content/b2ai-voice-pediatric/
- name: Synapse controlled access for raw audio
  description: Raw audio data is disseminated through controlled access only, to protect participants'
    privacy. Users interested in accessing the audio data from any Bridge2AI-Voice dataset can request
    access from the access committee; data are made available via Synapse.
  access_urls:
  - https://www.synapse.org/Synapse:syn72370534/
  - https://www.synapse.org/Synapse:syn73617068
- name: Health Data Nexus, feature-only version 1.0
  description: An earlier version of the feature-only dataset is available on HealthDataNexus, which provides
    cloud compute alongside the dataset rather than allowing data downloads. This platform provides publicly
    accessible metadata regarding the dataset with a DOI for persistent resolution; the dataset itself
    requires registered access.
  access_urls:
  - https://healthdatanexus.ai/
- name: File formats
  description: Dense derived features are distributed as Parquet, an open-source column-oriented data
    file format. Phenotype and static-feature tables are distributed as tab-separated values with accompanying
    JSON data dictionaries whose keys match the column names of the associated data file. The RO-Crate
    for release 3.0.0 records the media type of the phenotype tables as text/tab-separated-values.
distribution_dates:
- name: Release dates
  release_dates:
  - 'Adult v1.0: the dataset documentation states the data was published and made available at the end
    of November 2024; the RO-Crate records v1.0 as the initial public release in 2024, and the v1.0 citation
    names Health Data Nexus as the publishing platform.'
  - 'Adult v1.1: 2025-01-17'
  - 'Adult v2.0.0: 2025-04-16'
  - 'Adult v2.0.1: 2025-08-18'
  - 'Adult v3.0.0: 2025-12-16'
  - 'Adult v3.1.0: 2026-05-01'
  - 'Pediatric v1.0.0: 2025-12-17'
  - 'Pediatric v1.1.0: 2026-05-01'
maintainers:
- name: Bridge2AI-Voice project team
  role: academic_institution
  description: The dataset is supported by the NIH via the Bridge2AI project. The curator of the data
    may be contacted through the project's contact address; the RO-Crate for release 3.0.0 gives the contact
    point as https://b2ai-voice.org/contact-us/ and names Satrajit Ghosh as the data governance committee.
    Questions regarding the dataset itself are directed to the corresponding author listed on the PhysioNet
    project sidebar.
  maintainer_details:
  - Releases are coordinated by the Bridge2AI-Voice project team and the MIT Laboratory for Computational
    Physiology; release notes document added participants, new feature sets, reorganized phenotype tables
    and corrections such as spectrogram reprocessing and authorship updates.
  - Access requests for raw audio are handled by the Data Access Compliance Office, reachable at DACO@b2ai-voice.org.
- name: PhysioNet, MIT Laboratory for Computational Physiology
  role: academic_institution
  description: PhysioNet hosts the adult and pediatric datasets and is maintained by the MIT Laboratory
    for Computational Physiology, supported by the National Institute of Biomedical Imaging and Bioengineering
    (NIBIB), the National Heart Lung and Blood Institute (NHLBI) and the NIH Office of the Director under
    NIH grant numbers U24EB037545 and R01EB030362. The RO-Crate for release 3.0.0 names PhysioNet as the
    publisher.
- name: Health Data Nexus, Temerty Centre for Artificial Intelligence Research and Education in Medicine
    (T-CAIREM)
  role: academic_institution
  description: The version 1.0 dataset is hosted by the Health Data Nexus, a data publishing platform
    maintained by T-CAIREM, based at the University of Toronto. The Health Data Nexus maintains the technical
    infrastructure hosting the dataset and provides continued access to interested researchers.
errata:
- name: Erratum policy
  erratum_details:
  - There is no erratum. A changelog for each dataset version is published online with the dataset metadata.
  - 'Corrections recorded in the release notes include: version 3.1.0 fixed broken parquet files from
    the previous release and updated validated diagnosis information across conditions with back-filled
    information; version 2.0.1 corrected the authorship list; and version 2.0 reprocessed spectrograms
    to fix minor issues identified in the previous release and removed all spectrograms and MFCCs from
    free-speech-related files.'
updates:
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details:
  - Further versions of the dataset will be released on a semi-annual basis. These updates will be distributed
    as new versions of the dataset. Users will be notified through news items on the platform as well
    as through standard communication channels.
  - Dataset releases follow a static versioning scheme managed through PhysioNet and related platforms,
    with version numbers such as 1.0, 1.1, 2.0.0, 2.0.1 and 3.0.0 and associated DOIs for each snapshot
    and for the latest version.
  - Future updates are planned as additional participants are enrolled and Spanish-language protocols
    are incorporated.
  - The dataset is released as static versions rather than being dynamically updated.
retention_limit:
  name: Data retention
  retention_period: Indefinite for contributed research data; 10 years for institution-held identifiable
    data
  retention_details:
  - Once data is contributed, the data will be retained as long as it is useful for research purposes,
    possibly indefinitely.
  - Identifiable data and datasheets linking participant numbers to participant information are kept in
    each institution on local cloud storage for a maximum of 10 years after study completion and are then
    destroyed, under the responsibility of each local principal investigator.
  - All entries to the REDCap recruitment screening system are deleted once patients are enrolled, or
    within 90 days of their submission, whichever comes first.
  - De-identified study data and original consent forms are stored for a minimum of 5 years after completion
    of the study, per USF IRB requirements.
version_access:
  name: Version access and history
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - 'Adult v1.0 (Health Data Nexus, DOI 10.57764/qb6h-em84): first release of the Bridge2AI voice as a
    biomarker of health dataset; 12,523 recordings for 306 participants.'
  - 'Adult v1.1 (2025-01-17, DOI 10.13026/249v-w155): added Mel-frequency cepstral coefficients.'
  - 'Adult v2.0.0 (2025-04-16): data for an additional 136 new participants; spectrograms reprocessed;
    all spectrograms and MFCCs from free-speech-related files removed.'
  - 'Adult v2.0.1 (2025-08-18): corrections in the authorship list.'
  - 'Adult v3.0.0 (2025-12-16, DOI 10.13026/k81f-qr68): major update with new data for an additional 391
    participants, phenotype file separation, sparc and ppgs features, file reorganization; 833 participants.'
  - 'Adult v3.1.0 (2026-05-01, DOI 10.13026/8xbn-nq66): minor update with no new participants; parquet
    repairs, audio-quality metrics, per-audio metadata, back-filled diagnosis information, phenotype rearrangement
    and gold-standard variable renaming.'
  - 'Pediatric v1.0.0 (2025-12-17): first release of the Bridge2AI-Voice Pediatric dataset.'
  - 'Pediatric v1.1.0 (2026-05-01, DOI 10.13026/h995-bt35): minor update with no new participants; audio
    features for all manually checked free speech tasks, audio-quality metrics and per-recording metadata.'
  version_details:
  - By default, older versions of the dataset will continue to be supported, hosted and made available
    to researchers. Each version of the dataset has a unique DOI. The dataset publishers reserve the right
    to remove access to older versions.
  - 'Older versions remain accessible for reproducibility while users are encouraged to adopt the latest
    version. PhysioNet also assigns version-independent DOIs that resolve to the latest version: 10.13026/37yb-1t42
    for the adult project and 10.13026/mf9s-5r03 for the pediatric project.'
  - The files for adult version 1.1 are no longer available; the latest version should be used instead.
extension_mechanism:
  name: Extension and contribution
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
  - For dataset extensions and augmentations, it is possible for others to publish a derivative dataset
    on the Health Data Nexus which references the original source. These derivative datasets may be made
    available under the same conditions as the source data.
  - For augmentations to the code used to produce the data, the open-source repositories have discussion
    forums and issue pages which allow for public discussion of data preprocessing. The repository also
    has a mechanism, pull requests, for contributing improvements to the data preprocessing code.
ethical_reviews:
- name: Consortium ethics review
  contact_person: d4d:person-vardit-ravitsky
  reviewing_organization: d4d:org-hastings
  review_details:
  - The RO-Crate for release 3.0.0 records "Ethical Review by Vardit Ravitsky at the Hastings Center for
    Bioethics".
  - The consortium's best ethical practices, developed through ethical inquiry, have guided the development
    of the voice collection protocol as well as data dissemination practices. The consortium is addressing
    the growing ethical, legal and social challenges surrounding voice AI, including risks of voice re-identification,
    vulnerabilities such as voice AI hacking, concerns around voice data sharing and privacy, and the
    influence of gender and racial diversity on the development and application of these technologies.
  - A memorandum, "Ethical Justification for Controlled Access to Raw Voice Data Samples", explaining
    the reasoning behind the governance structure, is published for download by the project.
- name: Institutional review board oversight
  reviewing_organization: d4d:org-usf-irb
  review_details:
  - The clinical study was submitted and approved by the USF Single IRB and subsite IRBs through the Single
    IRB process. The study is not for a drug product or a medical device and no data monitoring committee
    was appointed.
data_protection_impacts:
- name: Impact analysis on data subjects
  impact_details:
  - The dataset documentation answers "No" to the question of whether an analysis of the potential impact
    of the dataset and its use on data subjects has been conducted.
  - The consortium explicitly recognizes the risks associated with voice data, including privacy loss,
    misuse of voice biometrics and algorithmic harms such as discrimination in hiring, insurance or surveillance
    contexts; these risks motivate a governance framework with IRB oversight, rigorous de-identification,
    separation of feature-only and raw-audio tiers, and usage restrictions encoded in the registered-access
    license and data use agreement.
  - The project aims to create an ethically sourced, diverse voice dataset to support research on using
    voice as an accessible, low-cost biomarker for screening, diagnosis and monitoring of a broad range
    of health conditions, potentially improving early detection and care for underserved populations.
    Dataset documentation and ongoing ethics workstreams are intended to help downstream users reason
    about these risks and design responsible analyses and models.
human_subject_research:
  name: Human subjects research
  involves_human_subjects: true
  irb_approval:
  - Submitted to and approved by the USF Single IRB and subsite IRBs through the Single IRB process. The
    RO-Crate for release 3.0.0 names the University of South Florida Institutional Review Board, contactable
    at RSCH-IRB@usf.edu and (813) 974-5638, 3702 Spectrum Blvd., Suite 165, Tampa, FL 33620, US; the crate's
    irbProtocolId field is empty.
  - Data collection and sharing for the adult PhysioNet releases was approved by the University of South
    Florida Institutional Review Board.
  - Data collection and sharing for the pediatric PhysioNet release was approved by the Research Ethics
    Board at the Hospital for Sick Children.
  - The IRB protocol "Bridge2AI Voice Data Acquisition" was first issued as V1 on 17 January 2023 and
    has been amended through V13 of 11 July 2025. Canadian institutions (Mount Sinai Hospital, SickKids
    and the University of Toronto) do not follow the Single IRB process and apply for separate research
    ethics board approval; genomic data are collected and analyzed only at the University of Toronto and
    Mount Sinai Hospital under a separate protocol and REB approval.
  - The feasibility study of the Bridge2AI-Voice application conducted at the University of South Florida
    Health Voice Center was approved by the USF Institutional Review Board under IRB number 004890.
  ethics_review_board:
  - University of South Florida Institutional Review Board (Single IRB of record)
  - Research Ethics Board, Hospital for Sick Children (pediatric cohort)
  - Research ethics boards of the Canadian participating institutions for genomic data collection
  special_populations:
  - Pediatric participants are enrolled only through the pediatric sites and not at USF. Checklist HRP-416
    for children under 21 was completed and appended to the protocol.
  - Students, employees and wards of the state are neither specifically included nor excluded. There is
    a specific plan to enroll participants from socially and economically disadvantaged and underserved
    populations through the Plan for Enhancing Diverse Perspectives, so that the database is diverse and
    FAIR while representing the population.
  regulatory_compliance:
  - The study is not for a drug product and not for a medical device; no data monitoring committee was
    appointed.
  - The RO-Crate for release 3.0.0 records fdaRegulated as false, humanSubjects as Yes, humanSubjectExemption
    as No, and deidentified as true.
  - A partial HIPAA waiver was requested for recruitment purposes to allow the study team to review EHR
    information for incoming clinic patients ahead of their appointments; the PHI collected at that time
    is limited to the study's inclusion criteria.
  - All investigators and project-related personnel with data access must follow appropriate certification
    through their local institution, including HIPAA and privacy training.
informed_consent:
- name: Informed consent for data collection and sharing
  consent_obtained: true
  consent_type:
  - Written informed consent on paper
  - Electronic consent within the app or through REDCap surveys
  - Video-recorded consent within the app
  - Parental permission with child assent for pediatric participants
  consent_documentation:
  - All paper and electronic versions of consent are stored for a minimum of 5 years after completion
    of the study, following required USF procedure. Paper consent documents are uploaded and saved electronically
    in REDCap. The USF IRB requires de-identified study data and original consent forms to be stored for
    a minimum of 5 years after study completion, and original paper consent documents cannot be destroyed
    until 5 years after study completion even if uploaded into Florence.
  withdrawal_mechanism:
  - Participants may withdraw from the study at any point; data provided before completion of voice data
    collection are excluded from the database, while data already completed cannot be removed once the
    voice data collection process is finished.
  consent_scope:
  - Consent covers provision of a voice or speech sample for an open-sourced database and upload of de-identified
    voice and clinical data to that database.
  - Within the consent process individuals are asked whether they agree to be contacted in the future
    for further voice data collection if long-term follow-up is required as part of an eventual extension
    of the grant. Contact information provided for that purpose is stored within the institutional database
    only and is not part of the data shared with other centers or uploaded to the cloud.
at_risk_populations:
  name: At-risk and vulnerable populations
  at_risk_groups_included: true
  special_protections:
  - Pediatric patients are enrolled only through the pediatric sites and not at USF; Checklist HRP-416
    for children under 21 was completed and appended to the protocol.
  - Compensation is provided to the adult population only.
  - Participants in the mood disorders cohort may be asked questions that can lead to possible discomfort
    and could trigger negative emotions; this is identified as a risk in the protocol.
  assent_procedures:
  - Children provide verbal assent where appropriate. Where young children cannot reasonably be asked
    to assent because of limitations in understanding due to age and development, typically under seven
    years of age, they are not asked to do so. Assent is documented on a form.
  guardian_consent:
  - Parents or guardians provide consent for children. Parental permission is obtained from one or both
    parents; this research is minimal risk and does not require permission from both parents or legal
    guardians.
  - For pediatric participants who lack adequate comprehension or familiarity with their past medical
    history, a parent or decision-maker completes the survey on a separate tablet during the recording.
license_and_use_terms:
  name: License and terms of use
  description: Access to the feature-only releases is governed by the Bridge2AI Voice Registered Access
    License and the Bridge2AI Voice Registered Access Agreement. Raw audio is governed by a separate controlled-access
    process and a Data Transfer and Use Agreement. The RO-Crate for release 3.0.0 records the license
    as https://physionet.org/content/b2ai-voice/view-license/3.0.0/, the conditions of access as https://physionet.org/content/b2ai-voice/view-dua/3.0.0/,
    and the copyright notice as "Copyright (c) 2026 University of South Florida all rights reserved".
  license_terms:
  - The feature-only and raw audio datasets are available under distinct agreements appropriate for the
    sensitivity of their respective content.
  - 'Registered access for features-only data: register on PhysioNet and confirm your identity under the
    Registered Access License, then sign the Bridge2AI-Voice Registered Access Agreement, which outlines
    the terms and conditions for data use.'
  - 'Controlled access for raw audio data: complete the Data Access Request Form (DARF), complete the
    Data Use Agreement (DUA), submit the application to the Data Access Compliance Office for review,
    and upon approval ensure a Data Use and Transfer Agreement (DTUA) is signed by an authorized official
    at your institution.'
  - Users of the dataset must agree to terms laid out in the registered access agreement. There are no
    fees associated with these restrictions.
  - Under the Data Transfer and Use Agreement, the recipient shall use the Data solely to conduct the
    stated Project and solely by the Recipient Scientist and approved Recipient Personnel; shall retain
    control over the Data and not disclose, release, sell, rent, lease, loan or otherwise grant access
    to any third party without prior written consent; shall establish appropriate administrative, technical
    and physical safeguards; and shall comply with all applicable laws, rules, regulations and professional
    standards. The agreement term ends two years after the start date, upon completion of the project,
    upon expiration of the applicable ethics approval, or upon termination by the Provider Institution,
    whichever occurs first, and the Data shall then be destroyed in accordance with the Provider's instructions
    with written certification of destruction within thirty days. Data is provided "AS IS" with no representations
    or warranties. The agreement is only effective upon review and approval of the Data Access Compliance
    Office, which requires a distinct application. Recipients further agree to adhere to the specific
    requirements of PhysioNet.org, managed by the MIT Laboratory for Computational Physiology.
  - Recipients are encouraged to make publicly available the results of the Project in open-access journals
    or pre-print servers where possible, and agree to recognize the contribution of the Provider as the
    source of the Data in all written, visual or oral public disclosures.
  data_use_permission:
  - general_research_use
  - health_medical_biomedical_research
  - ethics_approval_required
  - user_specific
  - project_specific
  - time_limit
ip_restrictions:
  name: Intellectual property restrictions
  description: Terms relating to intellectual property, reproduced from the registered access agreement
    for informational purposes.
  restrictions:
  - You understand and acknowledge that the Data may be protected by copyright and other rights, including
    other intellectual property rights. Duplication, as reasonably required to carry out Your Research
    Project with the Data, is nonetheless permitted. Sale of all or part of the Data on any media is not
    permitted.
  - You recognize that nothing in this Agreement shall operate to transfer to You any intellectual property
    rights in or relating to the Data. You agree not to make intellectual property claims on the Data.
  - You agree not to use intellectual property protection in ways that would prevent or block access to,
    or use of, any element of these Data, or conclusions drawn directly from the Data. You can elect to
    perform further research that would add intellectual and resource capital to the Data and decide to
    obtain intellectual property rights on these downstream discoveries. You agree to implement licensing
    policies that will not obstruct further research. You agree to respect the Fort Lauderdale Agreement.
  - No IP-based restrictions have been imposed by third parties.
  - The Data Provider provides no guarantees that the Data is free of third-party intellectual property
    rights, database rights, and other related rights.
regulatory_restrictions:
  name: Regulatory and compliance status
  description: Export control, privacy compliance and confidentiality status of the released dataset.
  regulatory_restrictions:
  - No export controls apply to the dataset.
  - The dataset is not for a drug product or a medical device, and the RO-Crate for release 3.0.0 records
    fdaRegulated as false.
  hipaa_compliant: compliant
  other_compliance:
  - Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive, have
    been removed from the released dataset; the HIPAA de-identification rules are applied.
  - The raw Data is covered under a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas for identifying information or characteristics of
    a research participant.
  - Clinical data are hosted on cloud servers through NIH STRIDES partners, which have pre-determined
    agreements with the NIH to ensure HIPAA protection and participant safety.
  - The Bridge2AI Voice Web app, iOS app and Enrollment Web app are themselves HIPAA-compliant and only
    store data during the collection phase.
  confidentiality_level: restricted
  governance_committee_contact: d4d:person-satrajit-ghosh
is_deidentified:
  name: De-identification of the public releases
  identifiable_elements_present: false
  method: HIPAA Safe Harbor de-identification combined with removal of high-risk indirect identifiers,
    coarsening of dates and geography, removal of narrative text and free-speech transcripts, and withholding
    of the original audio waveforms.
  identifiers_removed:
  - Names
  - Civic address and other geographic locators, including state and province
  - Social security numbers
  - Date information at a resolution finer than years
  - Phone and fax numbers, email addresses and IP addresses
  - Medical record numbers, health plan beneficiary numbers, account numbers and license numbers
  - Device identifiers and vehicle identifiers
  - Website URLs
  - Full face photos and biometric identifiers
  - Any other unique identifiers
  - Narrative text fields and transcripts of free speech
  - Raw voice recordings
  deidentification_details:
  - 'Level of de-identification for this dataset: identifiable information under HIPAA and the Common
    Rule, as well as data considered sensitive, have been removed. The dataset removes direct identifiers,
    applies the HIPAA de-identification rules, rebases and/or replaces dates by integers, removes or generalizes
    geographic information and removes narrative text fields; it does not achieve k-anonymization with
    k greater than or equal to 2.'
  - Indirect identifiers were removed where these created a significant risk of participant re-identification,
    for example through combination with other public data available on social media, in government registries,
    or elsewhere. These include select geographic or demographic identifiers, as well as some information
    about household composition or cultural identity. Non-identifying elements of data that revealed highly
    sensitive information, such as information about household income, mental health status and traumatic
    life experiences, were also removed.
  - For version 3.0.0, raw audio transcripts were reviewed and any audio recordings that contained potentially
    identifying information and external voices were removed from the release. All sensitive fields were
    removed at that stage, corresponding to data elements encoded as sensitive under the column name "Identifier?"
    in the REDCap data dictionary. In addition, all spectrograms, MFCCs, Mel spectrograms, transcriptions,
    EMAs and PPGs from open-response prompts were removed from the feature-only dataset.
  - For the pediatric version 1.1.0 release, audio features for all free speech tasks were manually checked
    for the presence of unconsented speakers and personally identifying information before release.
  - Country of data collection was retained. In the event that a caregiver's voice was recorded inadvertently,
    such clips can be discarded either by re-recording manually during data collection or during data
    audit and post-processing.
