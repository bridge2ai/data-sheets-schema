instances:
- id: d4d:instance-participants
  name: Adult study participants
  description: Each instance represents a person. Participants are adults enrolled at specialty clinics
    across five North American sites, comprising cohorts with voice disorders, neurological and neurodegenerative
    disorders, mood and psychiatric disorders and respiratory disorders, plus control participants without
    those conditions. Participants may have more than one session and therefore more than one row in the
    phenotype tables, and there is no requirement that a participant give the same response at each visit.
  instance_type: person (adult study participant)
  counts: 833
  label: true
  label_description: Diagnostic labels drawn from clinical assessment. Each individual answered a common
    set of questions and then responded to additional questions relevant to their primary diagnostic category.
    Labels include diagnostic categories such as vocal pathologies, neurological disorders, psychiatric
    conditions and respiratory disorders, recorded in per-condition diagnosis tables, together with validated
    questionnaire scores.
  sampling_strategies:
  - id: d4d:sampling-clinic-recruitment
    name: Specialty-clinic recruitment into predetermined disease groups
    description: Participants were selected on the basis of membership in five predetermined groups and
      screened against inclusion and exclusion criteria before their clinic visit.
    is_sample: true
    is_random: false
    is_representative: false
  missing_information:
  - id: d4d:missing-info-optional-questions
    name: Optional and cohort-specific questions
    missing:
    - Responses to questions that are optional.
    - Responses to questions outside the participant's primary diagnostic category, because each individual
      answered a common set of questions and then only the additional questions relevant to that category.
    - Information lost to data collection irregularities.
    why_missing:
    - Some questions are optional, and there may be data collection irregularities that caused some information
      to be missing from individual instances.
- id: d4d:instance-derived-recordings
  name: Derived voice recordings
  description: Each recording is one performance of one acoustic task by one participant in one session,
    represented in the release by derived features rather than by the audio waveform. The count given
    here is the figure stated in project documentation for version 3.0; the counts of rows in individual
    feature files differ from it and from each other because some recordings could not yield some features
    and because features for sensitive records and audio checks were removed. For release 3.0.0 the per-file
    counts are torchaudio spectrograms, mel spectrograms and MFCCs 29,020 each; torchaudio pitch 32,236;
    sparc EMA and loudness 31,616 each; sparc periodicity and pitch 31,633 each; and phonetic posteriorgrams
    29,031. For release 3.1.0 they are torchaudio spectrograms, mel spectrograms and MFCCs 29,278 each;
    torchaudio pitch 32,522; sparc EMA 28,640; sparc loudness 31,855; sparc periodicity and pitch 31,872
    each; and phonetic posteriorgrams 29,289.
  instance_type: derived voice recording
  counts: 61937
  label: true
  label_description: Each Parquet element carries a participant identifier, a session identifier, the
    task performed, the number of time frames for that feature and the feature tensor itself, which links
    the recording to the participant-level diagnostic and questionnaire labels.
anomalies:
- id: d4d:anomaly-collection-variability
  name: Site and protocol variability
  description: Known sources of noise and inconsistency in the dataset.
  anomaly_details:
  - Different sites have different collection configurations, and the collection protocol changed over
    the course of the study.
  - Recording was made with a head-mounted headset with a microphone that could be at slightly different
    distances between recordings.
  - Distinct iPad devices were used at each site.
  - Clinical diagnosis, depending on the disorder, was performed by one clinician or based on an electronic
    health record or an active prescription.
  - Noise artefacts, variations in diagnostic practice, inaccurate questionnaire responses and underreporting
    are named as confounding factors present in the data.
  - Changes in diagnostic criteria or practice over the collection period could be a source of distribution
    shift.
- id: d4d:anomaly-audit-findings
  name: Audit status and unaudited machine outputs
  description: Results of the internal audit of the dataset.
  anomaly_details:
  - The dataset has been audited internally for missingness and consistency by the data release team,
    and a missingness table is included with the dataset.
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
  - The audit protocol comprises generating missingness tables, checking distributions and outliers, checking
    categorical responses against the schema, and running quality control metrics for audio tasks including
    the amount of silence, duration, and for speech tasks a comparison of produced speech against the
    intended passage.
- id: d4d:anomaly-release-defects
  name: Defects corrected between releases
  description: Data defects identified and repaired in later releases.
  anomaly_details:
  - Release 2.0 reprocessed spectrograms to fix minor issues identified in the previous release.
  - Release 2.0.1 corrected the authorship list.
  - Release 3.1.0 fixed broken Parquet files present in release 3.0.0 and back-filled validated diagnosis
    information across conditions.
  - Some files, whether because of length or other issues, could not generate certain features and are
    therefore absent from the bundled data.
known_biases:
- id: d4d:bias-sampling
  name: Sampling bias
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  bias_type: sampling_bias
  bias_description: Participants are recruited from specialty clinics and associated institutions using
    a non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
    English speakers; this produces clinically enriched case mixes that may not represent general population
    distributions.
  mitigation_strategy: Documentation states that the sample is not representative because it was collected
    at a limited number of geographic locations, and that the team hopes to make it more representative
    by shifting to remote collection and designing the recruiting approach so as to control for more variables.
    The IRB protocol adds a Plan for Enhancing Diverse Perspectives and partnerships with community outreach
    clinics serving underserved and under-represented populations.
- id: d4d:bias-geographic-cultural
  name: Geographic and cultural bias
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  bias_type: representation_bias
  bias_description: Data are collected at a limited number of North American sites, and although the project
    seeks diversity, it may under-represent speakers from other regions, cultures, languages and healthcare
    systems; early releases focus on English, with Spanish protocols planned but not yet fully represented.
  mitigation_strategy: Spanish-language protocols and data collection are under development and were added
    to the IRB protocol in February 2025; documentation states that Spanish protocols and data collection
    will be included in future releases.
- id: d4d:bias-clinical-spectrum
  name: Clinical spectrum bias
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  bias_type: selection_bias
  bias_description: Because participants are selected into disease cohorts where voice changes are expected,
    the prevalence and severity of conditions in the dataset differ from those in routine primary care
    or community settings, which may inflate model performance when evaluated within this dataset.
  affected_subsets:
  - Voice disorders cohort
  - Neurological and neurodegenerative disorders cohort
  - Mood and psychiatric disorders cohort
  - Respiratory disorders cohort
- id: d4d:bias-device-environment
  name: Device and environment bias
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  bias_type: measurement_bias
  bias_description: Recordings are made using standardized but not identical hardware and primarily in
    clinical environments; future at-home collection or deployment on other devices may encounter different
    background noise, channel characteristics and user behavior.
  mitigation_strategy: Data are collected on iPads (9th or 10th generation) and iPad Air (5th generation)
    using an Avid AE-36 microphone connected through an Apple dongle, with participants asked to wear
    a headset with microphone for recording tasks per the Bridge2AI-Voice suggested standards. The IRB
    protocol states that the collection application includes models to ensure acoustic data quality, including
    volume standardization and noise cancellation.
- id: d4d:bias-machine-annotation
  name: Algorithmic bias in machine annotations
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  bias_type: algorithmic_bias
  bias_description: Transcripts and some derived features rely on off-the-shelf models such as OpenAI
    Whisper and other audio toolkits whose performance may vary across demographic groups; the dataset
    team has not independently audited these tools for fairness, so downstream users should consider their
    biases when interpreting results.
- id: d4d:bias-recruitment-trust
  name: Differential recruitment by trust and proximity
  description: Interaction between demographic or historically marginalized groups and the recording process,
    as documented on the project site.
  bias_type: selection_bias
  bias_description: Groups that have less trust in the medical system or in AI, or that are less proximal
    to the collection sites, would have been less likely to be recruited. Participants were screened for
    different disorders depending on site, so cohorts also had their data collected with different devices.
- id: d4d:bias-cohort-imbalance
  name: Unequal representation of disease categories
  description: Skew across cohorts, sites and demographic factors in the public releases.
  bias_type: representation_bias
  bias_description: The public data releases do not contain an equal distribution of the five disease
    categories, and the dataset has skews based on disorder category, site and other demographic factors.
    Users should consider the multivariate distribution when assessing utility for different questions.
  mitigation_strategy: Assess the multivariate distribution of disorder category, site and demographic
    variables before drawing conclusions, and account for the resulting imbalance in model evaluation.
    Documentation states that further releases will contain additional data.
known_limitations:
- id: d4d:limitation-no-raw-audio
  name: Feature-only release without raw audio or free-speech transcripts
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  limitation_type: coverage_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may constrain the ability
    to reproduce end-to-end audio pipelines.
  recommended_mitigation: Request the raw audio through the controlled-access process operated by the
    Data Access Compliance Office at DACO@b2ai-voice.org, through which approved recipients receive the
    audio via Synapse.
- id: d4d:limitation-adult-only
  name: Adult, English-language scope
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  limitation_type: scope_limitation
  limitation_description: This version only includes an adult cohort; models trained solely on this dataset
    may not generalize to younger age groups or to languages beyond those represented.
  scope_impact: Study eligibility requires an ability to read and speak English; the only language option
    for the earlier v2.0.0 release was English. Participants must be 18 years or older for the adult protocol.
  recommended_mitigation: For pediatric applications, use the separate Bridge2AI-Voice Pediatric Dataset,
    which covers a distinct cohort of 300 participants aged 2 to 18 recruited at the Hospital for Sick
    Children under its own protocol and research ethics board approval.
- id: d4d:limitation-deidentification-cost
  name: Analytical cost of de-identification
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed, which reduces the risk of re-identification
    but also limits detailed fairness assessments and certain confounder adjustments.
- id: d4d:limitation-no-splits
  name: No predefined splits, benchmarks or label-uncertainty measures
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train, validation and test splits or
    benchmarking tasks and does not include explicit per-instance label-uncertainty measures, so researchers
    must design their own evaluation protocols and handle label noise and missingness.
- id: d4d:limitation-access-governance
  name: Access governance as a barrier to participation and reproducibility
  description: Recorded in the upstream RO-Crate for release 3.0.0 as a documented responsible-AI property
    of the dataset.
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers and can complicate the
    reproducibility of pipelines that require both features and raw audio.
- id: d4d:limitation-external-data-not-released
  name: Multimodal and external data not yet released
  description: Scope limitation stated in project documentation for the v3.0.0 release.
  limitation_type: coverage_limitation
  limitation_description: The remainder of the multimodal data, including imaging, genomic data for the
    neurological cohort, laryngoscopy imaging and other electronic health record data, is extracted independently
    at each site and uploaded through the REDCap database. Documentation states explicitly that no external
    data is released in the v3.0.0 release.
- id: d4d:limitation-feasibility-study
  name: Limitations of the app feasibility study
  description: Limitations declared for the Bridge2AI-Voice application feasibility study, which assessed
    the collection instrument rather than the released dataset.
  limitation_type: methodological_limitation
  limitation_description: The feasibility study of the Bridge2AI-Voice application was conducted at a
    single site with 47 participants and without geographical diversity, which limits generalizability;
    as a feasibility pilot it had no control arm, so true efficacy could not be tested; and the determination
    of whether a task was successfully completed or recorded was subjective, resting on the judgement
    of the research assistant. Overall task completion was 68% and acoustic tasks were successfully recorded
    in 41% of cases, with assistance requested in 41.2% of instances. No audio data was collected at that
    stage of app development.
  scope_impact: These limitations describe the June to July 2023 feasibility evaluation of the collection
    application at the University of South Florida Health Voice Center, not the released dataset.
confidential_elements:
- id: d4d:confidentiality-b2ai-voice
  name: Confidentiality of released content
  description: Confidential material present in the released dataset.
  confidential_elements_present: false
  confidentiality_details:
  - Documentation states that the dataset does not contain data that might be considered confidential,
    such as data protected by legal privilege or by doctor-patient confidentiality, or the content of
    individuals' non-public communications.
  - The RO-Crate for release 3.0.0 records the confidentiality level as "Limited dataset available with
    Data Use Agreement".
  - The Data Transfer and Use Agreement records that the data are covered under a Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant.
  - Under the IRB protocol, identifiable protected health information is held only within the collecting
    institution's REDCap database with password-protected access, and is not part of the shared de-identified
    meta-database.
content_warnings:
- id: d4d:content-warning-free-speech
  name: Free speech content
  description: Material that might be offensive, insulting or distressing.
  content_warnings_present: true
  warnings:
  - The dataset includes the transcription of free speech tasks. While the inclusion of offensive, insulting
    or threatening content is unlikely, it cannot be completely avoided, because research participants
    are responsible for their own choice of language. Transcripts of free-speech audio are removed from
    the feature-only release, and spectrogram-family features derived from free-speech audio are excluded.
  - The IRB protocol notes that questions asked of participants in certain disease cohorts, such as mood
    disorders, depression and anxiety, can cause discomfort and could trigger negative emotions.
subpopulations:
- id: d4d:subpopulation-demographic
  name: Demographic sub-populations
  description: Demographic sub-populations identified in the dataset.
  subpopulation_elements_present: true
  identification:
  - Age
  - Gender
  - Sex
  - Ethnicity
  - Socioeconomic status
  distribution:
  - Detailed demographic data are collected through the collection application, including age, sex, gender,
    race and ethnicity, and language, together with education level, employment status, self-reported
    disability and other factors that could affect voice and speech such as weight, socio-economic status
    and literacy status.
  - Fine-grained geographic identifiers were removed during de-identification; state and province were
    removed and only the country of data collection was retained. Some socio-economic and cultural details
    were also removed.
- id: d4d:subpopulation-disease-cohorts
  name: Disease cohorts
  description: Clinical sub-populations by which participants were recruited and labelled.
  subpopulation_elements_present: true
  identification:
  - Voice disorders cohort
  - Neurological and neurodegenerative disorders cohort
  - Mood and psychiatric disorders cohort
  - Respiratory disorders cohort
  - Pediatric voice and speech disorders cohort
  - Controls
  distribution:
  - Data are collected across five disease categories. The public data releases do not contain an equal
    distribution of these categories, and the initial release contained data collected from four of the
    five.
  - The adult flagship release covers voice, neurological, mood and respiratory cohorts plus controls;
    the pediatric cohort is published separately.
sensitive_elements:
- id: d4d:sensitive-elements-b2ai-voice
  name: Sensitive personal data in the release
  description: Sensitive categories present in the dataset, combining the statement in project documentation
    with the responsible-AI description recorded in the upstream RO-Crate for release 3.0.0.
  sensitive_elements_present: true
  sensitivity_details:
  - 'Racial or ethnic origins: the dataset includes race information.'
  - 'Sexual orientations: the dataset includes sexual orientation information.'
  - 'Financial or health data: the dataset includes socioeconomic and health information.'
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory diseases,
    as well as symptom scores from questionnaires, which constitute sensitive personal health data.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    while finer-grained geographic identifiers, direct identifiers and many socio-economic and cultural
    details have been removed during de-identification to reduce re-identification risk.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset; raw voice recordings, which are themselves biometric identifiers, are made
    available only under controlled access.
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
  - All sensitive fields were removed from the dataset at the v3.0.0 de-identification stage. These correspond
    to the data elements encoded as sensitive under the column name "Identifier?" in the REDCap data dictionary.
acquisition_methods:
- id: d4d:acquisition-b2ai-voice
  name: How instance data were acquired
  description: Acquisition mode for the data associated with each instance.
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The data were directly observable and reported by subjects. Clinical diagnoses were verified by clinicians
    reviewing audio and/or imaging data, looking at electronic health records, or medication prescriptions.
  - The released features are derived from the raw audio waveforms by automated processing rather than
    observed directly.
  - The upstream RO-Crate for release 3.0.0 records the data collection types as direct measurement, surveys,
    self-reporting, secondary data analysis and document analysis.
  - 'Clinical validation is performed by a qualified physician or practitioner based on established gold
    standards for diagnosis, which differ by cohort: laryngoscopy images and stroboscopy videos for voice
    disorders, with CT and spirometry added for vocal fold paralysis; spirometry and flow volume loops
    with neck and chest CT for airway stenosis and chronic cough; brain CT, brain MRI and whole genome
    sequencing for neurological and neurodegenerative disorders, with serum p-tau protein markers for
    Alzheimer''s disease; and electronic health summaries, psychiatrist diagnosis and medication history
    for mood and psychiatric disorders.'
collection_mechanisms:
- id: d4d:collection-mechanism-app
  name: Bridge2AI-Voice collection applications
  description: Hardware and software used to collect the data.
  mechanism_details:
  - The data were collected using an iPad app. Voice samples are collected prospectively using a custom
    software application, the Bridge2AI-Voice App, following the Bridge2AI-Voice protocols, in the clinic
    with the assistance of a trained research assistant.
  - Data are collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36
    microphone and an Apple dongle to connect it to the iPad. Distinct iPad devices were used at each
    site.
  - Remote and in-clinic collection occur through two platforms, the Bridge2AI Voice Web app and the Bridge2AI
    Voice iOS app. The iOS app is restricted to iOS-compatible devices while the web app runs on a computer,
    tablet or phone. No software is downloaded or installed; both apps are HIPAA-compliant, store data
    only during the collection phase, remove the data as soon as the page is closed and require no login.
    Data are sent over a secure HTTPS protocol to a HIPAA-compliant storage server hosted by an NIH STRIDES
    partner.
  - Clinical and questionnaire data are captured in a REDCap database as part of the case report form.
    For the pediatric protocol, all data are collected using reproschema-ui with the Bridge2AI-Voice pediatric
    protocol.
  - A total of 22 acoustic tasks are recorded through the app for adults, spanning non-voice/non-speech
    tasks (respiration, voluntary cough, breath sounds), voice/non-speech tasks (prolonged vowel, maximum
    phonation time, glides, loudness, diadochokinesis) and speech tasks (Rainbow Passage, Caterpillar
    Passage, CAPE-V sentences, free speech, picture description, story recall, animal fluency, open response
    questions, word-colour Stroop, productive vocabulary, random item generation, Cinderella story), with
    a separate pediatric task set.
  - The RO-Crate for release 3.0.0 summarizes acquisition as a prospective observational study at multiple
    specialty clinics and academic hospitals across North America, in which eligible adults presenting
    to voice, neurology, psychiatry and respiratory clinics plus healthy controls were screened against
    predefined inclusion and exclusion criteria; after informed consent a standardized protocol combined
    structured voice and respiratory tasks such as sustained vowels, coughs and reading passages with
    demographic questions, health history, disease-specific questionnaires and other patient-reported
    outcomes, captured on a mobile or tablet application and stored in REDCap, with most participants
    completing a single in-clinic session and a subset completing repeated sessions.
  used_software:
  - id: https://github.com/eipm/bridge2ai-redcap
    name: Bridge2AI Voice REDCap
    description: REDCap instrument library defining the demographic, confounder, diagnostic and validated-questionnaire
      forms used during collection.
    version: 3.23.0
    license: MIT
    url: https://github.com/eipm/bridge2ai-redcap
collection_timeframes:
- id: d4d:timeframe-project
  name: Funded project period
  description: The overall period of the funded data generation project.
  start_date: '2022-09-01'
  end_date: '2026-11-30'
  timeframe_details:
  - NIH RePORTER records a project start of 2022-09-01 and a project end of 2026-11-30 for core project
    OT2OD032720.
  - The IRB protocol describes a prospective cohort study over four years involving 11 different academic
    sites across the United States, with the possibility of adding further collection sites in phases
    3 and 4, and a study duration for individual participants of up to four years.
- id: d4d:timeframe-release-cohort
  name: Collection period for the released cohort
  description: Period over which the data in the current public releases were collected.
  timeframe_details:
  - Documentation states that the data were collected over a period of 12 months.
  - The upstream RO-Crate for release 3.0.0 states that collection for the adult flagship cohort began
    after project launch in 2023 and is ongoing across five North American sites toward an anticipated
    enrollment of approximately 3,000 participants by November 2026, and that the participants and recordings
    included in version 3.0.0 were collected roughly between 2023 and 2025.
  - The IRB protocol phases record phase 1 exploratory collection of up to 180 participants as completed
    in November 2023, and phase 2 pilot collection as begun in November 2023 and ongoing in November 2024.
- id: d4d:timeframe-releases
  name: Release snapshot timeline
  description: Dataset releases are static snapshots, each corresponding to a frozen state of the underlying
    collection.
  timeframe_details:
  - PhysioNet versions and publication dates are 1.1 on 2025-01-17, 2.0.0 on 2025-04-16, 2.0.1 on 2025-08-18,
    3.0.0 on 2025-12-16 and 3.1.0 on 2026-05-01. The pediatric project's versions are 1.0.0 on 2025-12-17
    and 1.1.0 on 2026-05-01.
  - Version 1.0 was published on the Health Data Nexus; documentation states that the data were published
    and made available at the end of November 2024.
  - The upstream RO-Crate for release 3.0.0 lists the release snapshots as v1.0 (initial public release
    in 2024), v1.1 (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), and
    records the crate's own datePublished in the ambiguous form 12/16/2025.
- id: d4d:timeframe-feasibility-study
  name: Application feasibility study period
  description: Period of the single-site feasibility evaluation of the collection application. This describes
    the instrument, not the released dataset.
  start_date: '2023-06-05'
  end_date: '2023-07-28'
  timeframe_details:
  - The feasibility study was conducted at the University of South Florida Health Voice Center in Tampa,
    Florida between 5 June 2023 and 28 July 2023, enrolling 47 participants over a two-month period across
    three Plan-Do-Study-Act cycles of 15, 20 and 12 participants.
data_collectors:
- id: d4d:collector-research-teams
  name: Research teams and clinicians
  description: Who collected the data and how they were compensated.
  role: Data collection and clinical validation
  collector_details:
  - Research teams, which may include medical, graduate or undergraduate students, coordinated with clinicians
    and doctors to identify appropriate participants. These clinicians and doctors were listed under the
    IRB as co-investigators and were added to the consortium so that their names are included on consortium-level
    publications arising from the research. Hospital staff were not involved in scheduling but assisted
    in the logistics of coordinating data collection.
  - Data are collected in the clinic with the assistance of a trained research assistant, who observes
    the session and records completion metrics.
  - 'The IRB protocol names lead investigators per site and role: Yael Bensoussan (USF) and Anais Rameau
    (WCM) as co-leads of data acquisition; Alexandros Sigaras and Olivier Elemento (WCM) as co-leads for
    tools, software and IT infrastructure; Stephanie Watts (USF) lead for respiratory disorders; Ruth
    Bahr (USF) lead for voice disorders; Satrajit Ghosh (MIT) lead for mood disorders; Frank Rudzicz (UofT)
    lead for neurological disorders; Tempestt Neal (USF) investigator for machine learning readiness;
    Karim Hanna (USF) investigator for control data; Stephen Aradi (USF) investigator for neurology; Maria
    Powell (VUMC), Anthony Law (Emory), Phillip Song and Matthew Naunheim (MEEI) investigators for voice
    disorders; Jordan Lerner-Ellis (MSH) lead for genomic data under a separate IRB; and Alistair Johnson
    (HSC) lead for data integration.'
  - The team hired two acoustic engineers and three AI data scientists to analyse all samples from the
    year 1 exploratory data collection phase for acoustic quality and machine-learning readiness.
  - The RO-Crate for release 3.0.0 records the two computations that produced the release, VOICE Features
    Processing and VOICE Phenotype Ingest, as run by "Alastair", with a creation date of 2025-12-16 for
    the phenotype ingest.
missing_data_documentation:
- id: d4d:missing-data-b2ai-voice
  name: Missing data in the released files
  description: Patterns and causes of missing data, and how missingness is handled in the release.
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  - Some derived audio features could not be computed for all recordings due to quality or length constraints,
    and features relating to free speech or sensitive records have been removed.
  missing_data_causes:
  - Some questions are optional.
  - Data collection irregularities caused some information to be missing from individual instances.
  - Each individual answered a common set of questions and then responded only to the additional questions
    relevant to their primary diagnostic category.
  - Spectrograms, mel spectrograms, MFC coefficients, phonetic posteriorgrams and EMA features for sensitive
    records and audio checks were removed from the release; some files, whether because of length or other
    issues, could not generate certain features.
  handling_strategy: No additional imputation is applied in the released files. Missingness is audited
    by the data release team and a missingness table is included with the dataset, leaving users to implement
    study-specific imputation or complete-case strategies.
raw_data_sources:
- id: d4d:raw-data-source-audio
  name: Raw voice, speech and respiratory audio
  source_description: High-quality voice, speech and respiratory audio waveforms recorded on tablet or
    smartphone devices with headset microphones when available, captured under the Bridge2AI-Voice acoustic
    task protocol.
  source_type:
  - Prospective acoustic recording
  access_details: Not part of the feature-only public release. Available only through the controlled-access
    process, which requires a Data Access Request Form, a Data Use Agreement, review by the Data Access
    Compliance Office and a signed Data Use and Transfer Agreement, with requests to DACO@b2ai-voice.org
    and distribution via Synapse at https://www.synapse.org/Synapse:syn72370534/.
  raw_data_format:
  - WAV audio with sidecar JSON, organized per BIDS v1.9.0
- id: d4d:raw-data-source-questionnaires
  name: Questionnaire and clinical form responses
  source_description: Responses to structured demographic and medical-history questionnaires, disease-specific
    validated questionnaires and other patient-reported outcomes, captured in REDCap for the adult protocol
    and in ReproSchema-UI for the pediatric protocol.
  source_type:
  - Self-report questionnaire
  - Patient-reported outcome
  access_details: Released in de-identified, aggregated form as the tab-delimited phenotype tables under
    registered or credentialed access.
  raw_data_format:
  - REDCap export
  - ReproSchema-UI export
- id: d4d:raw-data-source-ehr
  name: Electronic health record extracts
  source_description: Clinical diagnoses, disease type, severity, symptoms, management, validated questionnaire
    scores and other metadata extracted from electronic health records for gold-standard validation, together
    with imaging collected retrospectively from patient charts, such as video-laryngoscopy images for
    voice disorders, chest X-rays for respiratory disorders, and brain CT and MRI for neurological disorders.
  source_type:
  - Electronic health record
  - Clinical imaging
  access_details: Not released. Documentation states explicitly that no external data is released in the
    v3.0.0 release; imaging, genomic and other EHR data are extracted independently at each site and uploaded
    through the REDCap database.
  raw_data_format:
  - EHR extract
  - Clinical imaging study
sampling_strategies:
- id: d4d:sampling-strategy-b2ai-voice
  name: Non-probability clinic-based sampling
  description: Sampling design for the released dataset.
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Patients presenting at specialty clinics and institutions participating in the Bridge2AI-Voice consortium,
    who were considered for enrollment on the basis of membership in five predetermined groups.
  - Individuals without the conditions of interest, enrolled as controls.
  why_not_representative:
  - The data are a sample of a larger, ongoing collection. The data are not representative because they
    were collected at a limited number of geographic locations.
  - Participants are recruited from specialty clinics using a non-probability sampling strategy, with
    inclusion focused on specific disease cohorts and fluent English speakers, producing clinically enriched
    case mixes that may not represent general population distributions.
  representative_verification:
  - No verification of representativeness is claimed. The study metadata record the sampling method as
    a non-probability sample and the design observation model as a cohort with a cross-sectional time
    perspective.
  strategies:
  - Participants are recruited across different academic institutions from high volume expert clinics,
    defined as outpatient clinics within hospital systems or academic institutions with expertise in a
    specific disease area seeing more than 50 patients per month from that disease category. The IRB protocol
    defines them as clinics or programmes within academic institutions with multidisciplinary programmes
    targeting the listed disease cohorts and a volume of over 1,000 patients per year.
  - Recruitment is also planned through community outreach clinics, defined as clinics whose main mission
    is to provide health services to underserved and under-represented populations, in order to make the
    database diverse and representative, through a Plan for Enhancing Diverse Perspectives.
  - Charts of patients presenting at high volume expert clinics are screened against inclusion and exclusion
    criteria before the clinic day, under a partial HIPAA waiver for recruitment and screening. Recruitment
    also uses flyers, QR-code linked REDCap screening surveys, waiting-room approach where permitted,
    social media including LinkedIn, X, Facebook, Instagram and YouTube, the project websites, and the
    FlowTrials platform. Where specific diagnoses or severities are under-represented, participants are
    identified by medical record review based on voice-disorder related diagnostic codes.
  - The team plans to make the sample more representative by shifting to remote collection and designing
    the recruiting approach so as to control for more variables.
raw_sources:
- id: d4d:raw-sources-b2ai-voice
  name: Availability of the raw data
  description: Whether the raw data were retained after de-identification, and how they may be accessed.
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - The raw data were saved in addition to the preprocessed data, and are not accessible publicly.
  - Raw audio is available under a controlled access mechanism, disseminated only to protect participants'
    privacy. Users interested in accessing the audio data from any Bridge2AI-Voice dataset request access
    by emailing the access committee.
  - As announced on 2026-03-09, raw audio data access for the adult cohort is via Synapse at https://www.synapse.org/Synapse:syn72370534/,
    and for the pediatric cohort via https://www.synapse.org/Synapse:syn73617068. Accessing raw audio
    requires institutional sign-off.
  - The upstream RO-Crate for release 3.0.0 records that the original raw data consist of high-quality
    voice, speech and respiratory audio waveforms recorded on tablet or smartphone devices with headset
    microphones when available, plus responses to structured demographic and medical history questionnaires,
    disease-specific validated questionnaires and other patient-reported outcomes, together with clinical
    diagnoses and other metadata extracted from electronic health records, and that access to the underlying
    raw audio is available only through a separate controlled-access process.
preprocessing_strategies:
- id: d4d:preprocessing-audio
  name: Audio standardization and feature extraction
  description: How raw audio was preprocessed into the released derived features.
  preprocessing_details:
  - Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing
    filter applied.
  - Spectrograms were computed with the short-time Fast Fourier Transform using a 25 ms window, 10 ms
    hop length and a 400-point FFT, and were further downsampled by a factor of two in the time domain
    after derivation, giving dimension 201 by T. In release 1.1 the spectrograms used a 512-point FFT
    and had dimension 513 by N.
  - Sixty Mel-frequency cepstral coefficients were extracted from those spectrograms, and Mel spectrograms
    were computed with the same parameters and 60 Mel bins.
  - 'Articulatory features were generated with the Speech Articulatory Coding package, producing kinematic
    traces of vocal tract articulators and source features together with measures of loudness, periodicity
    and pitch, all gathered at 50 Hz. EMA output has dimension T by 12, corresponding to X and Y positions
    of six articulators: tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip.'
  - Acoustic features were extracted using openSMILE, capturing temporal dynamics and acoustic characteristics;
    phonetic and prosodic features were computed using Parselmouth and Praat, providing measures of fundamental
    frequency, formants and voice quality.
  - Phonetic posteriorgrams, time-varying categorical distributions over 40 phoneme categories at 100
    Hz, were generated via the ppgs package.
  - Torchaudio pitch tracks were computed with minimum and maximum pitch of 80 and 500 Hz; the sparc pitch
    estimator uses a different algorithm with a range of 50 to 550 Hz.
  - Transcriptions were generated using OpenAI's Whisper Large model.
  - The upstream RO-Crate for release 3.0.0 describes the same pipeline and adds that after standardization
    the audio is segmented by task and passed through quality checks before feature computation, and that
    all features are stored as dense tensors in Parquet files with participant, session and task identifiers.
  - 'The feature-only dataset provides AI-ready derivations from the raw audio: openSMILE eGeMAPS features
    per audio file, Parselmouth and Praat speech features for speech tasks, speech intelligibility metrics
    for speech tasks, torchaudio-based pitch contour, spectrograms, mel spectrogram and MFCCs, sparc-based
    features including electromagnetic articulography estimates plus loudness, periodicity and pitch measures,
    and phonetic posteriorgrams. The waveform-derived features are stored in two formats: a fixed format
    holding static features extracted from the entire waveform, and a temporal format that varies with
    the length of each recording.'
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    description: Library used to process the raw audio into the released features and to merge the source
      data into the phenotype files. The 3.0.0 and 3.1.0 release pages state the release was generated
      with b2aiprep v3.0.0; the RO-Crate for release 3.0.0 records version 3.0.2.
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://www.audeering.com/research/opensmile/
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, used for acoustic feature
      extraction.
  - id: https://www.fon.hum.uva.nl/praat/
    name: Praat
    description: Phonetics software used with the parselmouth Python interface for phonetic and prosodic
      feature extraction.
  - id: https://parselmouth.readthedocs.io/
    name: parselmouth
    description: Python interface to Praat.
  - id: https://pytorch.org/audio/
    name: torchaudio
    description: Audio processing library used for spectrograms, mel spectrograms, MFCCs and pitch tracks.
- id: d4d:preprocessing-phenotype
  name: Phenotype export and organization
  description: How tabular phenotype data were produced.
  preprocessing_details:
  - Data were exported and converted from REDCap using an open source library developed by the team. Pediatric
    data collected through ReproSchema-UI are extracted and transformed into REDCap format and subsequently
    converted to the Brain Imaging Data Structure.
  - The upstream RO-Crate for release 3.0.0 records that tabular phenotype and questionnaire files are
    exported from REDCap and merged using the b2aiprep library, reorganizing the former single phenotype
    table into thematically organized TSV files with accompanying JSON data dictionaries, that static
    per-recording feature summaries are provided in static_features.tsv, and that de-identification and
    filtering steps are applied before packaging.
  - The crate models this as a distinct computation, VOICE Phenotype Ingest, described as dumping and
    reformatting phenotype information from the REDCap database into b2ai-voice phenotype extracts, and
    a second computation, VOICE Features Processing, described as taking raw data and converting it into
    spectrograms and features using b2aiprep. Both are recorded as using the B2AIPrep Library software
    entity.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    description: Library used to export and merge REDCap source data into the phenotype files.
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
cleaning_strategies:
- id: d4d:cleaning-b2ai-voice
  name: Cleaning and de-identification filtering
  description: Transformations applied to the data before release, beyond feature derivation.
  cleaning_details:
  - Documentation answers the question of whether there was any pre-processing for cleaning the data with
    "No", while stating that pre-processing for de-identification was performed by extracting features
    from the raw audio to limit re-identification and releasing only the extracted features.
  - 'The upstream RO-Crate for release 3.0.0 records a data manipulation protocol: before release, data
    are transformed to reduce re-identification risk and align with regulatory and ethical requirements.
    Direct identifiers and high-risk quasi-identifiers are removed; dates are coarsened or rebased; geographic
    information is generalized to the country level; narrative text fields and transcripts of free speech
    are removed; and raw voice waveforms are withheld from the feature-only release. Additional filtering
    removes features for sensitive records and audio checks, and some derived features are dropped when
    processing fails or quality checks fail.'
  - No instances were excluded from the dataset at the time of preprocessing.
  - Quality control of the data is performed throughout the four years of the project. The collection
    application includes models to ensure acoustic data quality including volume standardization and noise
    cancellation. Two acoustic engineers and three AI data scientists analysed all samples from the year
    1 exploratory collection phase for acoustic quality and machine-learning readiness, and in each subsequent
    year 10% of the data is selected at random every month for quality control and machine-learning readiness.
labeling_strategies:
- id: d4d:labeling-b2ai-voice
  name: Clinical and questionnaire labeling
  description: How labels were produced and by whom.
  annotations_per_item: 1
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.
  data_annotation_protocol:
  - Diagnostic labels are the result of a clinical assessment of the participant. At each site a local
    clinician provided the diagnosis based on a clinical interview and appropriate work-up. For the psychiatric
    disorders cohort the assessment was determined using the participant's electronic health record or
    an active prescription, outside of data collection, by an appropriately licensed clinician.
  - The labeling strategy is a gold standard label available in the data, diagnosed by a clinician, following
    Bridge2AI protocols and ICD-10 codes.
  - The upstream RO-Crate for release 3.0.0 records that annotations consist primarily of clinical labels
    and questionnaire-derived measures associated with each participant and recording; that participants
    complete validated instruments such as VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough questionnaires
    and voice instruments, which generate numerical scores and categorical indicators according to each
    instrument's published scoring guidelines; that clinical investigators and care teams record diagnostic
    categories for voice, neurological, mood and respiratory conditions and other phenotype variables
    drawing on clinical assessments and electronic health records, represented in disease-specific TSV
    files with accompanying JSON dictionaries; and that machine-generated transcripts of certain voice
    tasks and numerous automatically extracted acoustic and articulatory features provide further labels
    and descriptors at the recording level.
  - Guidance for future researchers is that the process for any new labels should be described alongside
    any release of a model or publication, and that this process should include the exact variables used
    for the determination.
  annotator_demographics:
  - A single labeler per data item, typically the clinician at the site of data collection, or a clinician
    external to it for a prior diagnostic assessment.
  - The upstream RO-Crate for release 3.0.0 records that clinical annotations, including diagnostic labels
    and certain phenotype variables, are created by clinicians and research staff at participating North
    American institutions spanning otolaryngology, neurology, neuroscience, pulmonology and allied health
    disciplines, and that detailed demographic breakdowns of annotators are not provided in the public
    documentation.
  - The crate further records that questionnaire-based labels reflect self-reported information from participants
    themselves, whose demographics are captured in coarsened form in the phenotype tables, for example
    age bands, sex and country of data collection, and that per-annotator demographic information, such
    as which specific clinician or staff member entered a label, is not exposed.
  labeling_details:
  - One labeler provides a label per instance.
  - Human-level performance in the applications the dataset is meant to address is reported to vary widely.
  - The upstream RO-Crate for release 3.0.0 records that each recording is associated with one set of
    clinical labels and questionnaire responses derived from a single participant, although participants
    may contribute multiple sessions over time, and that there is no crowd-sourced labeling and no multiple
    independent human ratings per individual recording.
  - Validated questionnaires integrated into the collection application, by cohort, include the Voice
    Handicap Index-10, Patient Health Questionnaire-9 and General Anxiety Disorder-7 across all adult
    cohorts; PANAS and a custom affect scale for mood and control cohorts; PTSD Adult, ADHD-Adult and
    DSM-5 Adult for the mood cohort; the Dyspnea Index and Leicester Cough Questionnaire for respiratory
    cohorts; the Winograd questionnaire and Montreal Cognitive Assessment for neurological cohorts; and
    pediatric instruments C-VHI-10, the Pediatric Voice Outcomes Survey, Pediatric Voice-Related Quality-of-Life
    and PHQ-A for the pediatric cohort.
  used_software:
  - id: https://github.com/eipm/bridge2ai-redcap
    name: Bridge2AI Voice REDCap
    description: REDCap instruments encoding the scoring logic for the validated questionnaires, documented
      in the released data dictionaries.
    version: 3.23.0
    license: MIT
    url: https://github.com/eipm/bridge2ai-redcap
imputation_protocols:
- id: d4d:imputation-none
  name: No imputation applied
  description: Handling of missing values in the released files.
  imputation_method:
  - No global statistical imputation is applied to missing fields.
  imputation_rationale: The upstream RO-Crate for release 3.0.0 records that missing questionnaire responses,
    phenotype variables and derived features are left as explicit missing values or omitted rows; that
    the data release team audited missingness; and that users can implement study-specific imputation
    or complete-case strategies appropriate to their analyses.
  imputation_validation:
  - Missingness is audited by the data release team and a missingness table is included with the dataset.
annotation_analyses:
- id: d4d:annotation-analysis-b2ai-voice
  name: Label quality and agreement analysis
  description: What is and is not known about annotation quality, as recorded in the upstream RO-Crate
    for release 3.0.0.
  analysis_method: Questionnaire-based labels are generated using the standard scoring rules for each
    validated instrument, yielding total and subscale scores that can be mapped to symptom-severity bands;
    the scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  disagreement_patterns:
  - Diagnostic labels are derived from clinical assessments and electronic health records rather than
    crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses are treated
    as reference labels and may include multiple comorbid conditions per participant.
  annotation_quality_details:
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues, but per-annotator disagreement statistics and detailed
    label-uncertainty measures are not presently included in the released dataset.
  - Because a single labeler provides a label per instance, no inter-annotator agreement statistic is
    computed or reported.
machine_annotation_tools:
- id: d4d:machine-annotation-tools-b2ai-voice
  name: Automated tools used to derive features and transcripts
  description: Machine annotation tooling, as enumerated in the upstream RO-Crate for release 3.0.0 and
    corroborated by the release documentation.
  tools:
  - openSMILE
  - Praat and parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram (ppgs) models
  - OpenAI Whisper Large
  - b2aiprep
  - SenseLab
  tool_descriptions:
  - openSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including measures
    of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units for each
    recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and merging of
    phenotype data into the released files.
  - SenseLab for processing audio files for research tasks.
  tool_accuracy:
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
  - The upstream RO-Crate for release 3.0.0 warns that transcripts and some derived features rely on off-the-shelf
    models such as OpenAI Whisper and other audio toolkits whose performance may vary across demographic
    groups, and that the dataset team has not independently audited these tools for fairness.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    description: Orchestrates preprocessing, feature extraction and merging of phenotype data into the
      released files.
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://github.com/sensein/senselab
    name: SenseLab
    description: Processes audio files for research tasks.
    url: https://github.com/sensein/senselab
existing_uses:
- id: d4d:existing-uses-b2ai-voice
  name: Existing uses of the dataset
  description: Tasks for which the dataset has already been used.
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
  - Training opportunities for using the dataset are offered through https://www.b2aivoicescholars.org/.
  - 'Use of the dataset requires citation. Documentation directs users to cite the Interspeech 2024 protocol
    paper "Developing Multi-Disorder Voice Protocols: A team science approach involving clinical expertise,
    bioethics, standards, and DEI", https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html,
    doi 10.21437/Interspeech.2024-1926, alongside the resources specified in the Bridge2AI-Voice documentation
    for the relevant dataset version. Project documentation gives the first author of that paper as Bensoussan,
    while the PhysioNet release pages give it as Rameau with Bensoussan as last author; the two sources
    disagree on author order for the same work. Use of the REDCap data dictionary and metadata additionally
    requires citing the Zenodo record at https://zenodo.org/doi/10.5281/zenodo.12760724.'
use_repository:
- id: d4d:use-repository-b2ai-voice
  name: Repository of works using the dataset
  description: Whether a repository linking to papers or systems that use the dataset exists.
  repository_details:
  - Documentation states that there is no repository, besides Google Scholar, that links to any or all
    papers or systems that use the dataset.
other_tasks:
- id: d4d:other-tasks-b2ai-voice
  name: Other tasks the dataset could support
  description: Further research uses beyond the predefined disease-classification tasks.
  task_details:
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance on
    a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
    de-identified derived features, including work on representation learning, domain adaptation and multimodal
    integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
  - Cohort selection using the questionnaire features distributed in the phenotype folder.
future_use_impacts:
- id: d4d:future-use-impact-b2ai-voice
  name: Composition and collection factors affecting future use
  description: What a future user needs to know to avoid unfair treatment of individuals or groups and
    other undesirable harms.
  impact_details:
  - The dataset has skews based on disorder category, site and other demographic factors. Users should
    consider the multivariate distribution when assessing utility for different questions.
  - Factors that might limit the generalization of derived models include the number and diversity of
    devices, since distinct iPad devices were used at each site; the recording specificity, since a head-mounted
    headset microphone could be at slightly different distances and clinical diagnosis was performed by
    one clinician or from an EHR record or prescription depending on the disorder; the number and diversity
    of recording sites, of which there are five; and distribution shift over time from changes in diagnostic
    criteria or practice.
  - Groups that have less trust in the medical system or in AI, or that are less proximal to the collection
    sites, would have been less likely to be recruited, and participants were screened for different disorders
    depending on site, so cohort membership is confounded with device and location.
  - 'The upstream RO-Crate for release 3.0.0 frames the same considerations as a social impact: voice
    data carry risks of privacy loss, misuse of voice biometrics and algorithmic harms such as discrimination
    in hiring, insurance or surveillance, which motivate the tiered access model and the usage restrictions
    encoded in the license and data use agreement.'
discouraged_uses:
- id: d4d:discouraged-uses-b2ai-voice
  name: Discouraged applications
  description: Uses that are discouraged and the reasons for discouraging them.
  discouragement_details:
  - The dataset should not be used for non-research or non-clinical applications such as hiring decisions,
    insurance premium adjustments, or any form of surveillance that could lead to discrimination or harm.
  - These discouraged uses are intended to prevent unethical or biased outcomes that could negatively
    impact individuals based on their health conditions or voice characteristics. The dataset is intended
    strictly for research that prioritizes patient safety, privacy and ethical use.
  - The upstream RO-Crate for release 3.0.0 states that the dataset is explicitly not intended for operational
    decision making about specific individuals such as hiring, insurance pricing, law enforcement or surveillance,
    nor for attempts at re-identification, nor for uses likely to stigmatize individuals or groups.
intended_uses:
- id: d4d:intended-use-clinical-ml
  name: Clinical machine-learning model development and validation
  description: The dataset's primary intended use, as stated in project documentation and in the upstream
    RO-Crate for release 3.0.0.
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived features
    with diagnostic categories or symptom severity for conditions such as vocal fold pathology, neurological
    and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms on a clinically diverse, multi-site
    cohort with standardized tasks and rich phenotype data.
  - Enabling the development, benchmarking or validation of clinically applicable machine-learning models
    for diagnosing a wide range of health conditions using voice data, including vocal pathologies, neurological,
    psychiatric, respiratory and pediatric voice disorders.
  usage_notes: The dataset contains voice recordings and key metadata and is structured to be Findable,
    Accessible, Interoperable and Reusable. Users must construct their own train, validation and test
    splits, and must handle label noise and missingness themselves, because the release provides neither
    recommended splits nor per-instance label-uncertainty measures.
  use_category:
  - Research
  - AI and machine-learning model pretraining, fine-tuning, benchmarking and validation
  - Clinical research in disease screening, diagnosis and monitoring
prohibited_uses:
- id: d4d:prohibited-uses-b2ai-voice
  name: Uses prohibited by the access agreement
  description: Restrictions on use set out in the Registered Data Access Agreement and the Data Transfer
    and Use Agreement.
  prohibition_reason:
  - The dataset must not be used to attempt to re-identify research participants, nor for any action that
    could reasonably lead to re-identification.
  - The dataset must not be used for any purpose that could foreseeably cause harm or stigmatization to
    research participants, their families, communities, or specific populations.
  - Intellectual property protections, database rights or related rights may not be used in a manner that
    restricts or limits access to any part of the dataset or to any conclusions derived from it, so that
    future use of the dataset remains unrestricted in alignment with the open science principles upheld
    by the consortium.
  - Sale of all or part of the data on any media is not permitted.
  - The recipient must not disclose, release, sell, rent, lease, loan or otherwise grant access to the
    data to any third party, except authorized persons, without the prior written consent of the provider.
    Collaborators at other research organizations, and other research teams at the same organization,
    must apply independently for access and sign their own Data Transfer and Use Agreement before accessing
    the data.
  - The recipient must not use the data, alone or in concert with any other information, to make any effort
    to contact the individuals who are the subjects of the data without appropriate Institutional Review
    Board approval, specific written approval from the provider, and informed consent from the individual
    if required.
  - The restrictions reflect the consortium's commitment to advancing ethical and trustworthy research
    practices that respect and protect the rights and interests of research participants; the dataset
    is intended solely for commercial and non-commercial research purposes by authorized researchers.
distribution_formats:
- id: d4d:distribution-format-parquet
  name: Parquet feature files
  description: Dense binary files holding per-recording feature tensors, made available as Parquet, an
    open-source column-oriented data file format. Each element carries participant_id, session_id, task_name,
    n_frames and the feature tensor. Files are ppgs.parquet, sparc_ema.parquet, sparc_loudness.parquet,
    sparc_periodicity.parquet, sparc_pitch.parquet, torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet,
    torchaudio_pitch.parquet and torchaudio_mel_spectrogram.parquet. Release 3.1.0 adds a Parquet file
    of per-recording metadata in a metadata folder.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
- id: d4d:distribution-format-tsv-json
  name: Tab-delimited tables with JSON data dictionaries
  description: Phenotype tables, static per-recording feature summaries and audio-quality metrics are
    distributed as tab-delimited text with headers, each accompanied by a JSON data dictionary sharing
    the same file stem. The RO-Crate for release 3.0.0 records the media type of these files as text/tab-separated-values
    and their schemas declare a tab separator with a header row.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
- id: d4d:distribution-format-registered-access
  name: PhysioNet registered and credentialed access
  description: The feature-only dataset is distributed through PhysioNet, which provides publicly accessible
    metadata with a DOI for persistent resolution while requiring authenticated access to the files. Releases
    1.1 and earlier were listed as restricted access, requiring registration and a signed data use agreement;
    releases 3.0.0 and 3.1.0 are listed as credentialed access, requiring the user to be a credentialed
    user and to sign the project data use agreement, with no training required. The adult and pediatric
    datasets are available through separate PhysioNet links under registered access.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- id: d4d:distribution-format-controlled-audio
  name: Controlled-access raw audio via Synapse
  description: Raw audio is disseminated through controlled access only, in order to protect participants'
    privacy. Approved recipients receive the audio via Synapse. Access requires a Data Access Request
    Form, a Data Use Agreement, submission to the Data Access Compliance Office for review and, upon approval,
    a Data Use and Transfer Agreement signed by an authorized official at the recipient institution. The
    contact person referenced as d4d:person-daco-access-committee is the Bridge2AI-Voice Data Access Compliance
    Office, reachable at DACO@b2ai-voice.org, which reviews controlled-access requests for raw audio and
    administers the Data Use and Transfer Agreement.
  access_urls:
  - https://www.synapse.org/Synapse:syn72370534/
  - https://www.synapse.org/Synapse:syn73617068
- id: d4d:distribution-format-health-data-nexus
  name: Health Data Nexus cloud-compute access (historical)
  description: An earlier version of the feature-only dataset is available on the Health Data Nexus, which
    provides cloud compute alongside the dataset rather than allowing data downloads, and requires registered
    access. Documentation describes this platform as providing publicly accessible metadata with a DOI
    for persistent resolution. This applies to the v1.0 release only.
  access_urls:
  - https://healthdatanexus.ai/
distribution_dates:
- id: d4d:distribution-dates-b2ai-voice
  name: Release dates
  description: Publication dates of the successive releases.
  release_dates:
  - 'Adult dataset, PhysioNet: v1.1 on 2025-01-17; v2.0.0 on 2025-04-16; v2.0.1 on 2025-08-18; v3.0.0
    on 2025-12-16; v3.1.0 on 2026-05-01.'
  - 'Adult dataset, Health Data Nexus: v1.0 published at the end of November 2024.'
  - 'Pediatric dataset, PhysioNet: v1.0.0 on 2025-12-17; v1.1.0 on 2026-05-01.'
  - The RO-Crate describing release 3.0.0 records its datePublished as 12/16/2025, in an ambiguous month/day/year
    form.
maintainers:
- id: d4d:maintainer-physionet-mit-lcp
  name: MIT Laboratory for Computational Physiology (PhysioNet)
  description: PhysioNet hosts the current releases of both the adult and pediatric datasets and is maintained
    by the MIT Laboratory for Computational Physiology, supported by NIBIB, NHLBI and the NIH Office of
    the Director under NIH grant numbers U24EB037545 and R01EB030362. The upstream RO-Crate for release
    3.0.0 records PhysioNet as the publisher of the dataset.
  role: academic_institution
  maintainer_details:
  - Maintains the technical infrastructure hosting the dataset and provides continued access to interested
    researchers.
  - The upstream RO-Crate for release 3.0.0 records that releases are coordinated by the Bridge2AI-Voice
    project team together with the MIT Laboratory for Computational Physiology.
- id: d4d:maintainer-b2ai-voice-consortium
  name: Bridge2AI-Voice consortium
  description: The consortium curates the dataset and operates the access-governance process. The dataset
    is supported by the NIH via the Bridge2AI project.
  role: academic_institution
  maintainer_details:
  - General questions, suggestions and feedback about the dataset are directed to the consortium contact
    address published on the project site. The upstream RO-Crate for release 3.0.0 records the contact
    point as https://b2ai-voice.org/contact-us/.
  - Raw-audio access requests are handled by the Data Access Compliance Office at DACO@b2ai-voice.org.
  - The RO-Crate for release 3.0.0 names Satrajit Ghosh as the data governance committee and Yael Bensoussan
    as principal investigator.
- id: d4d:maintainer-health-data-nexus
  name: Health Data Nexus, T-CAIREM, University of Toronto (historical)
  description: Documentation of the v1.0 release states that the dataset is hosted by the Health Data
    Nexus, a data publishing platform maintained by the Temerty Centre for Artificial Intelligence Research
    and Education in Medicine (T-CAIREM) based at the University of Toronto, and that the platform maintains
    the technical infrastructure hosting the dataset and provides continued access to interested researchers.
    This describes the v1.0 release; current releases are hosted on PhysioNet.
  role: academic_institution
  maintainer_details:
  - The platform team may be contacted through the Health Data Nexus support address, and the curator
    of the data through the consortium address.
errata:
- id: d4d:errata-b2ai-voice
  name: Errata and changelog
  description: How corrections are recorded and communicated.
  erratum_details:
  - There is no erratum. A changelog for each dataset version is published online with the dataset metadata.
  - Corrections recorded in the release notes include reprocessing of spectrograms in v2.0 to fix minor
    issues identified in the previous release, correction of the authorship list in v2.0.1, and in v3.1.0
    the repair of broken Parquet files from the previous release together with back-filled validated diagnosis
    information and renaming of some phenotype files and gold-standard variables.
  - 'Within the upstream RO-Crate for release 3.0.0, two file entries carry names that contradict their
    own contentUrl: the entry for features/torchaudio_pitch.parquet is named torchaudio_spectrogram.parquet
    and the entry for features/sparc_periodicity.parquet is named sparc_loudness.parquet. Two data-dictionary
    entities share the identifier ark:59853/b2ai-voice-schema-phenotype-confounders while carrying different
    names, and one file entry records its size under the property "size" while all others use "contentSize".
    These are defects of the crate''s own metadata rather than of the released data.'
updates:
  id: d4d:updates-b2ai-voice
  name: Update plan
  description: How and how often the dataset is updated.
  frequency: Static versioned releases. Documentation for the v1.0 release states that further versions
    would be released on a semi-annual, twice yearly, basis; the observed PhysioNet cadence has been 1.1
    in January 2025, 2.0.0 in April 2025, 2.0.1 in August 2025, 3.0.0 in December 2025 and 3.1.0 in May
    2026.
  update_details:
  - The dataset is released as static versions rather than being dynamically updated. Further versions
    of the dataset will be released, distributed as new versions on the hosting platform, and users will
    be notified through news items on the platform and through standard communication channels.
  - 'The upstream RO-Crate for release 3.0.0 records the maintenance plan: releases follow a static versioning
    scheme managed through PhysioNet and related platforms, with version numbers such as 1.0, 1.1, 2.0.0,
    2.0.1 and 3.0.0 and associated DOIs for each snapshot and for the latest version; releases are coordinated
    by the Bridge2AI-Voice project team and the MIT Laboratory for Computational Physiology, and release
    notes document added participants, new feature sets, reorganized phenotype tables and corrections
    such as spectrogram reprocessing and authorship updates; future updates are planned as additional
    participants are enrolled and Spanish-language protocols are incorporated, with older versions remaining
    accessible for reproducibility while users are encouraged to adopt the latest version.'
retention_limit:
  id: d4d:retention-limit-b2ai-voice
  name: Retention limits
  description: Limits on retention of the data associated with instances.
  retention_period: Indefinite for the shared research data; a maximum of ten years after study completion
    for identifiable institutional data; a minimum of five years after study completion for consent documentation.
  retention_details:
  - Once data is contributed, the data will be retained as long as it is useful for research purposes,
    possibly indefinitely.
  - Identifiable data and datasheets linking participant numbers to participant information are kept in
    each institution on local cloud storage for a maximum of ten years after study completion, after which
    the identifiable data are destroyed; this is the responsibility of each local principal investigator.
  - The USF IRB requires de-identified study data and original consent forms to be stored for a minimum
    of five years after completion of the study; original paper consent documents cannot be destroyed
    until five years after study completion even if uploaded to the Florence platform.
  - Under the Data Transfer and Use Agreement, on expiration or early termination the recipient must destroy
    the data in accordance with the provider's instructions and certify destruction in writing within
    thirty days, retaining at most one copy as needed for records retention, research integrity and verification.
version_access:
  id: d4d:version-access-b2ai-voice
  name: Access to prior versions
  description: Whether older versions continue to be supported, hosted and made available.
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - 1.0 (Health Data Nexus, DOI 10.57764/qb6h-em84)
  - 1.1, published 2025-01-17, DOI 10.13026/249v-w155
  - 2.0.0, published 2025-04-16
  - 2.0.1, published 2025-08-18
  - 3.0.0, published 2025-12-16, DOI 10.13026/k81f-qr68
  - 3.1.0, published 2026-05-01, DOI 10.13026/8xbn-nq66
  version_details:
