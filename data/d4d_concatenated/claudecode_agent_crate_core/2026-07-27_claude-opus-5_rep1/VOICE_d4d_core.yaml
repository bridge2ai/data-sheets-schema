  name: JSON data dictionaries
  description: JSON data dictionaries accompanying every released data file, sharing the file stem of
    the file they describe. For phenotype tables their keys match the column names of the associated table
    and their values give a one-sentence description of the column, the question asked of the participant
    where applicable, and the data type of the response. The upstream RO-Crate for release 3.0.0 represents
    these as 55 EVI:Schema entities, each declaring a header row and a typed column list, and each carrying
    a CC BY 4.0 license that is distinct from the registered-access license on the data itself. The tabular
    schemas declare a tab separator; the schemas attached to the Parquet feature files declare a comma
    separator and a header row, neither of which is a meaningful property of a Parquet file.
