extension_mechanism:
  id: d4d:extension-mechanism-b2ai-voice
  name: Extension and contribution mechanism
  description: How others may extend, augment, build on or contribute to the dataset.
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
  - For dataset extensions and augmentations, others may publish a derivative dataset on the hosting platform
    that references the original source. These derivative datasets may be made available under the same
    conditions as the source data.
  - For augmentations to the code used to produce the data, the open-source repositories have discussion
    forums and issue pages allowing public discussion of data preprocessing, and a pull request mechanism
    for contributing improvements to the preprocessing code.
ethical_reviews:
- id: d4d:ethical-review-usf-irb
  name: University of South Florida Institutional Review Board
  description: The reviewing IRB of record for the Bridge2AI Voice Data Acquisition protocol and for data
    collection and sharing in the adult PhysioNet releases.
  reviewing_organization: d4d:organization-usf-irb
  review_details:
  - Data collection and sharing was approved by the University of South Florida Institutional Review Board.
    The RO-Crate for release 3.0.0 records the reviewing IRB (identifier d4d:organization-usf-irb) at
    3702 Spectrum Blvd., Suite 165 Usf, Tampa, FL 33620, US, with contact email RSCH-IRB@usf.edu and telephone
    (813) 974-5638; the crate's irbProtocolId field is present but empty.
  - The study was submitted to and approved by the USF Single IRB and by subsite IRBs through the Single
    IRB process. All US-based institutions abide by the Single IRB process; once approved at USF, each
    participating institution submits review based on the Single IRB at USF.
  - Two exceptions to the Single IRB apply. Genomic data are collected and analysed only at the University
    of Toronto and Mount Sinai Hospital in Canada under a separate protocol, whose research ethics board
    approval is submitted to the USF IRB once obtained. Canadian institutions, namely Mount Sinai Hospital,
    SickKids and the University of Toronto, do not abide by the Single IRB process and apply for a separate
    research ethics board application to comply with Canadian regulations.
  - The IRB protocol titled "Bridge2AI Voice Data Acquisition" is version 1 dated 17 January 2023, with
    thirteen subsequent revisions through V13 on 11 July 2025 covering, among other changes, inclusion
    of the pediatric cohort under the single IRB (V2, 3 May 2023), compensation for adults (V3, 15 August
    2023), electronic consent and social media recruitment (V4, 11 December 2023), control data collection
    and new disease categories (V5, 31 January 2024), remote consent and changed compensation (V7, 19
    July 2024), remote enrollment and remote data collection apps (V8, 27 September 2024), and Spanish-language
    collection with a new recruitment platform (V11, 10 February 2025).
  - The feasibility study of the Bridge2AI-Voice application, a separate single-site study, was approved
    by the Institutional Review Board of the University of South Florida under IRB number 004890, and
    all participants provided written informed consent.
  - Study oversight metadata record that the clinical study is not for a drug product, is not for a medical
    device, and that no data monitoring committee was appointed.
- id: d4d:ethical-review-hastings-center
  name: Bioethics review at the Hastings Center for Bioethics
  description: An ethical review recorded only in the upstream RO-Crate for release 3.0.0, which names
    the reviewer and the reviewing body.
  contact_person: d4d:person-vardit-ravitsky
  reviewing_organization: d4d:organization-hastings-center-bioethics
  review_details:
  - The RO-Crate for release 3.0.0 records the ethical review as "Ethical Review by Vardit Ravitsky at
    the Hastings Center for Bioethics". This attribution appears only in the crate; the document corpus
    names Vardit Ravitsky, PhD, as an ethics-module investigator affiliated with The Hastings Center and
    previously with the University of Montreal, but does not describe a Hastings Center ethical review
    of the dataset. The referenced identifiers are d4d:person-vardit-ravitsky for the reviewer and d4d:organization-hastings-center-bioethics
    for the reviewing body.
  - The consortium's stated best ethical practices, developed through ethical inquiry, guided the development
    of the voice collection protocol and the data dissemination practices, and a memorandum sets out the
    ethical justification for controlled access to raw voice data samples.
- id: d4d:ethical-review-sickkids-reb
  name: Hospital for Sick Children Research Ethics Board
  description: The reviewing body for the separate pediatric cohort. Recorded here because the pediatric
    dataset is a related resource of this programme; it does not govern the adult release.
  reviewing_organization: d4d:organization-sickkids-reb
  review_details:
  - Data collection and sharing for the Bridge2AI-Voice Pediatric Dataset was approved by the Research
    Ethics Board at the Hospital for Sick Children, referenced here as d4d:organization-sickkids-reb.
data_protection_impacts:
- id: d4d:data-protection-impact-b2ai-voice
  name: Impact of the dataset on data subjects
  description: Whether an analysis of potential impact on data subjects has been conducted, and the risk
    reasoning the project has published.
  impact_details:
  - Project documentation answers the question of whether an analysis of the potential impact of the dataset
    and its use on data subjects has been conducted with "No".
  - 'The upstream RO-Crate for release 3.0.0 nonetheless records a social impact statement: the project
    aims to create an ethically sourced, diverse voice dataset to support research on using voice as an
    accessible, low-cost biomarker for screening, diagnosis and monitoring of a broad range of health
    conditions, potentially improving early detection and care for underserved populations. At the same
    time the consortium explicitly recognizes the risks associated with voice data, including privacy
    loss, misuse of voice biometrics and algorithmic harms such as discrimination in hiring, insurance
    or surveillance contexts. These risks motivate a governance framework with IRB oversight, rigorous
    de-identification, separation of feature-only and raw-audio tiers and usage restrictions encoded in
    the registered-access license and data use agreement. Dataset documentation and ongoing ethics workstreams
    are intended to help downstream users reason about these risks and design responsible analyses and
    models. The crate statement is a narrative risk rationale rather than a completed formal impact assessment,
    and does not contradict the documentation''s answer.'
  - The IRB protocol records that the study has no direct immediate benefits to participants, that voice
    collection is a safe, non-invasive method with minimal risk, and that the most important risk lies
    in the protection of data privacy, mitigated by collecting only through the HIPAA-compliant client
    applications and transmitting over secure HTTPS to NIH STRIDES partners.
human_subject_research:
  id: d4d:human-subject-research-b2ai-voice
  name: Human subject research status
  description: The dataset is derived from prospective human subjects research conducted under IRB and
    research ethics board oversight.
  involves_human_subjects: true
  irb_approval:
  - Approved by the University of South Florida Institutional Review Board; submitted and approved by
    the USF Single IRB and subsite IRBs through the Single IRB process.
  - The separate Bridge2AI-Voice application feasibility study was approved under USF IRB number 004890.
  - Pediatric data collection and sharing was approved by the Research Ethics Board at the Hospital for
    Sick Children.
  - The upstream RO-Crate for release 3.0.0 records human subject research as "Yes", human subject exemption
    as "No", and an empty irbProtocolId.
  ethics_review_board:
  - University of South Florida Institutional Review Board
  - Separate Canadian research ethics boards at Mount Sinai Hospital, the Hospital for Sick Children and
    the University of Toronto
  - Research Ethics Board at the Hospital for Sick Children, for the pediatric cohort
  - The Hastings Center for Bioethics, recorded in the RO-Crate for release 3.0.0 as the body conducting
    ethical review
  special_populations:
  - Pediatric participants are enrolled only through the pediatric sites and not at the University of
    South Florida; checklist HRP-416 for children under 21 was completed and appended to the IRB protocol.
  - Participants in the mood and psychiatric disorders cohort are asked questions that can cause discomfort
    and could trigger negative emotions.
  - The protocol does not specifically include or exclude students, employees or wards of the state, and
    includes a plan to enrol participants from socially and economically disadvantaged and underserved
    populations through a Plan for Enhancing Diverse Perspectives.
  regulatory_compliance:
  - 'HIPAA: both collection applications are HIPAA-compliant and transmit over secure HTTPS to HIPAA-compliant
    storage hosted by NIH STRIDES partners (Amazon, Google, Microsoft), which hold pre-negotiated agreements
    with the NIH for data privacy and HIPAA protection. A partial HIPAA waiver was granted for recruitment
    and screening only. Identifiable information under HIPAA and the Common Rule, as well as data considered
    sensitive, have been removed from the released dataset.'
  - 'Certificate of Confidentiality: the Data Transfer and Use Agreement records that the data are covered
    under a Certificate of Confidentiality, which must be asserted against compulsory legal demands.'
  - All investigators and project-related personnel with data access must complete appropriate certification
    through their local institution, including HIPAA and privacy training.
  - The upstream RO-Crate for release 3.0.0 records fdaRegulated as false and deidentified as true.
informed_consent:
- id: d4d:informed-consent-b2ai-voice
  name: Informed consent process
  description: The consent process applied to participants.
  consent_obtained: true
  consent_type:
  - Prospective written informed consent
  - Electronic consent within the application or through REDCap surveys
  - Video-recorded consent within the application
  - Verbal assent for children, with parental or guardian permission
  consent_documentation:
  - In most cases the consent or assent process takes place in the clinic setting of the recruiting high
    volume expert clinic and is conducted by research assistants; about 30 minutes is spent explaining
    the study and consent in detail, and potential participants are asked to explain what they have understood
    to confirm comprehension.
  - Consent may also take place remotely through REDCap survey forms accessed electronically; electronic
    consent contains the same text as paper consent. In some cases remote consent does not require the
    signature of the researcher, in which case the consent form omits the Statement of Person Obtaining
    Informed Consent section but is otherwise identical.
  - Paper consent documents are uploaded and saved electronically in REDCap. All paper and electronic
    versions of consent are stored for a minimum of five years after completion of the study, following
    required USF procedure, and original paper consent documents cannot be destroyed until five years
    after study completion.
  - Participants are informed that participation is voluntary and does not affect their medical care in
    any way, and that no undue influence or coercion is possible.
  withdrawal_mechanism:
  - Participants may withdraw from the study at any point. Withdrawal before or during voice data collection
    means their data are not included in the database; once voice data collection is complete, research
    data including voice recordings cannot be removed from the database.
  consent_scope:
  - Consent covers collection of voice, speech and respiratory samples, completion of self-reported demographic
    and medical history questionnaires and disease-specific validated questionnaires, and investigator
    access to medical information through electronic health record platforms in order to perform gold
    standard validation of diagnoses and symptoms.
  - 'Consent covers sharing of de-identified voice and clinical data through an open-sourced database
    for future research, in tiered form: registered access for data posing a low risk of re-identification
    and controlled access for data that would pose a heightened risk.'
  - Participants may separately agree to be contacted in the future for further voice data collection;
    contact details given for that purpose are stored only within the institutional database and are not
    shared with other centres or uploaded to the cloud.
  - For longitudinal cohorts, consent is re-administered electronically before each subsequent data collection.
at_risk_populations:
  id: d4d:at-risk-populations-b2ai-voice
  name: At-risk and vulnerable populations
  description: Vulnerable-population handling across the Bridge2AI-Voice programme. The adult flagship
    release itself contains only participants aged 18 years and over.
  at_risk_groups_included: true
  special_protections:
  - The adult protocol requires participants to be 18 years old or older, with a minimum age of 18 years
    and a maximum age of 120 years recorded in the study eligibility metadata; the study population for
    the earlier v2.0.0 dataset contained only adult populations.
  - Pediatric patients are enrolled only through the pediatric sites and not at the University of South
    Florida. Checklist HRP-416 for children under 21 was completed and appended to the IRB protocol. Pediatric
    participants are recruited strictly from the Hospital for Sick Children and are grouped by age; the
    resulting data are published as the separate Bridge2AI-Voice Pediatric Dataset.
  - Compensation is provided to the adult population only.
  - Participants in the mood and psychiatric disorders cohort face potential discomfort from questionnaire
    content; the protocol acknowledges this as the only risk beyond information release.
  assent_procedures:
  - Children provide verbal assent where appropriate. Where young children cannot reasonably be asked
    to assent because of limitations in understanding due to age and development, typically those under
    seven years of age, they are not asked to do so. Assent is documented on a dedicated form.
  guardian_consent:
  - When children participate, parents or guardians provide consent. Parental permission may be obtained
    from one or both parents; because the research is minimal risk it does not require permission from
    both parents or legal guardians.
  - Exclusion applies where consent is not given or, in the case of pediatric participants, where consent
    is not received from a parent or guardian for voice and clinical de-identified data to be uploaded
    to an open-sourced database.
license_and_use_terms:
  id: d4d:license-and-use-terms-b2ai-voice
  name: License and terms of use
  description: The released files carry the Bridge2AI Voice Registered Access License and are governed
    by the Bridge2AI Voice Registered Access Agreement; raw audio is additionally governed by the Data
    Use Agreement and the Data Transfer and Use Agreement.
  license_terms:
  - 'License for files: Bridge2AI Voice Registered Access License. Data use agreement: Bridge2AI Voice
    Registered Access Agreement. For releases 3.0.0 and 3.1.0, only credentialed users who sign the DUA
    can access the files, and no training is required.'
  - Users of the dataset must agree to the terms laid out in the registered access agreement. The intellectual
    property terms state that the data may be protected by copyright and other rights; that duplication
    as reasonably required to carry out the research project is permitted; that sale of all or part of
    the data on any media is not permitted; that nothing in the agreement transfers any intellectual property
    rights in or relating to the data; that users agree not to make intellectual property claims on the
    data or to use intellectual property protection in ways that would prevent or block access to or use
    of any element of the data or conclusions drawn directly from it; that users may obtain intellectual
    property rights on downstream discoveries but agree to implement licensing policies that will not
    obstruct further research; and that users agree to respect the Fort Lauderdale Agreement. There are
    no fees associated with these restrictions.
  - Access to the feature-only data requires registering on PhysioNet, confirming identity under the Registered
    Access License, and signing the Bridge2AI-Voice Registered Access Agreement. Access to raw audio requires
    completing a Data Access Request Form and a Data Use Agreement, submitting the application to the
    Data Access Compliance Office for review, and on approval ensuring a Data Use and Transfer Agreement
    is signed by an authorized official at the recipient institution.
  - The Data Transfer and Use Agreement names the University of South Florida Board of Trustees as provider
    institution. Its term ends two years after the start date, on completion of the project, on expiration
    of the applicable ethics approval, or on termination by the provider institution, whichever occurs
    first; either party may terminate on thirty days written notice. On expiry the recipient must follow
    the provider's disposition instructions and destroy the data, certifying destruction in writing within
    thirty days, while being permitted to retain one copy to the extent necessary for records retention,
    research integrity and verification, with the agreement's restrictions surviving for that archival
    copy. The agreement is effective only upon review and approval by the Data Access Compliance Office,
    which requires a distinct application. The data are provided as-is with no representations or warranties
    of any kind, the recipient assumes all liability for damages arising from its use, storage, disclosure
    or disposal, and no indemnification is provided by either party. The recipient is encouraged to make
    the results of the project publicly available in open-access journals or preprint servers where possible,
    and must recognize the provider as the source of the data in all written, visual or oral public disclosures.
  - The upstream RO-Crate for release 3.0.0 records the license as https://physionet.org/content/b2ai-voice/view-license/3.0.0/
    and the conditions of access as https://physionet.org/content/b2ai-voice/view-dua/3.0.0/, and carries
    the copyright notice "Copyright (c) 2026 University of South Florida all rights reserved". The data
    dictionaries represented in the crate as EVI:Schema entities each carry a separate CC BY 4.0 license.
  - The consent metadata record that the dataset does not allow only non-commercial use, does not restrict
    use to a specific geographic location, does not restrict use to a specific type of research, does
    not restrict use to genetic research, and does not exclude research involving the development of methods
    or algorithms.
  data_use_permission:
  - general_research_use
  - health_medical_biomedical_research
  contact_person: d4d:person-daco-access-committee
ip_restrictions:
  id: d4d:ip-restrictions-b2ai-voice
  name: Intellectual property restrictions
  description: Third-party and provider intellectual property positions on the data.
  restrictions:
  - No intellectual property based restrictions have been imposed by third parties.
  - The data provider provides no guarantees that the data are free of third-party intellectual property
    rights, database rights or other related rights. Nothing in the Data Transfer and Use Agreement operates
    to transfer any intellectual property rights in or relating to the data to the recipient, and the
    recipient agrees not to use intellectual property protection, database rights or related rights in
    a way that could prevent or limit access to, or use of, any element of the data or research conclusions
    derived from it.
  - The recipient may elect to perform further research adding intellectual and resource capital to the
    data and may obtain intellectual property rights on downstream discoveries, subject to implementing
    licensing policies that will not obstruct further research.
  - Neither party may use the other party's name, trademarks or logos in publicity, advertising or news
    releases without prior written approval.
regulatory_restrictions:
  id: d4d:regulatory-restrictions-b2ai-voice
  name: Regulatory and compliance restrictions
  description: Export control, privacy regulation and compliance status of the dataset.
  regulatory_restrictions:
  - No export controls apply to the dataset.
  - The upstream RO-Crate for release 3.0.0 records the dataset as not FDA regulated.
  hipaa_compliant: compliant
  other_compliance:
  - Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive, have
    been removed from the released dataset. The dataset removes direct identifiers, applies the HIPAA
    de-identification rules, rebases or replaces dates by integers, removes or generalizes geographic
    information and removes narrative text fields, but does not achieve k-anonymization with k greater
    than or equal to 2.
  - The data are covered under a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas for identifying information or characteristics of
    a research participant.
  - Data are hosted on cloud infrastructure through NIH STRIDES partners, which hold pre-negotiated agreements
    with the NIH to ensure data privacy and HIPAA protection of medical information.
  - The upstream RO-Crate for release 3.0.0 names Satrajit Ghosh, PhD, of the Massachusetts Institute
    of Technology, referenced here as d4d:person-satrajit-ghosh, as the dataset's data governance committee.
  - The Data Transfer and Use Agreement, which governs controlled-access transfer of the identifiable
    raw material rather than the de-identified public release, records the data it covers as personally
    identifiable information as defined in OMB Memorandum M-07-16 and not covered under HIPAA, FERPA or
    similar laws requiring special terms beyond those in the agreement; this characterization is of the
    transferred data under that agreement and does not describe the HIPAA de-identification applied to
    the published feature-only release; the Federal Privacy Act checkbox is unchecked while the Certificate
    of Confidentiality checkbox is checked. The recipient's authorized representative also warrants that
    the recipient does not use coercion for labor or services as defined in section 787.06, Florida Statutes.
  confidentiality_level: restricted
  governance_committee_contact: d4d:person-satrajit-ghosh
is_deidentified:
  id: d4d:deidentification-b2ai-voice
  name: De-identification status
  description: Level of de-identification applied to the released dataset. Identifiable information under
    HIPAA and the Common Rule, as well as data considered sensitive, have been removed. The upstream RO-Crate
    for release 3.0.0 records the dataset as de-identified.
  identifiable_elements_present: false
  method: HIPAA Safe Harbor identifier removal combined with removal of high-risk indirect identifiers,
    coarsening of dates and geography, removal of narrative text and free-speech transcripts, and withholding
    of the raw audio waveforms from the public release.
  identifiers_removed:
  - Names
  - Civic addresses
  - Social security numbers
  - Geographic locators, including state and province; country of collection retained
  - Date information at a resolution finer than years; dates rebased or replaced by integers
  - Phone and fax numbers
  - Email addresses
  - IP addresses
  - Medical record numbers
  - Health plan beneficiary numbers
  - Device identifiers
  - License numbers
  - Account numbers
  - Vehicle identifiers
  - Website URLs
  - Full face photographs
  - Biometric identifiers, including the raw voice recordings themselves
  - Any other unique identifiers
  - Narrative text fields and transcripts of free speech audio
  - Select geographic or demographic indirect identifiers, and some information about household composition
    or cultural identity
  - Non-identifying but highly sensitive elements such as household income, mental health status and traumatic
    life experiences
  deidentification_details:
  - All direct identifiers were removed because they would reveal the identity of the research participant.
    Indirect identifiers were removed where they created a significant risk of re-identification, for
    example through combination with other public data available on social media, in government registries
    or elsewhere.
  - All raw voice data was removed, as this data has the potential to cause individual re-identification
    or to be used for illicit or unauthorized purposes. The dataset was de-identified through removal
    of all audio data and of certain sensitive fields identified by a team of ethicists.
  - For v3.0.0, raw audio transcripts were reviewed and any audio recordings containing potentially identifying
    information or external voices were removed from the release. All sensitive fields were removed at
    this stage, corresponding to data elements encoded as sensitive under the column name "Identifier?"
    in the REDCap data dictionary. In addition, all spectrograms, MFCCs, mel spectrograms, transcriptions,
    EMAs and phonetic posteriorgrams from open-response prompts were removed from the feature-only dataset.
  - The de-identification metadata record that direct identifiers are removed, that HIPAA de-identification
    rules are applied, that dates are rebased or replaced by integers, that geographic information is
    removed or generalized and that narrative text fields are removed, but that k-anonymization with k
    greater than or equal to 2 is not achieved.
  - In the event that a caregiver's voice is recorded inadvertently, the clips can be discarded either
    by re-recording manually during data collection or during data audit and post-processing.
external_resources:
- id: d4d:external-resources-b2ai-voice
  name: External resource dependencies
  description: Documentation for the released dataset states that the dataset is self-contained. Guarantees
    about the persistence of external resources and the availability of archival versions of external
    resources are recorded as not applicable. Supporting software and metadata repositories are published
    separately and are not required in order to read the released files.
  external_resources:
  - b2aiprep, the open-source library used to preprocess raw audio waveforms into the released feature
    files and to merge source data into the phenotype files (https://github.com/sensein/b2aiprep). The
    RO-Crate for release 3.0.0 records b2aiprep version 3.0.2, last modified 2026-01-06; the PhysioNet
    3.0.0 and 3.1.0 release pages both state that the release was generated with b2aiprep v3.0.0.
  - SenseLab, used for processing audio files for research tasks (https://github.com/sensein/senselab).
  - The Bridge2AI REDCap data dictionary, metadata and instrument PDFs (https://github.com/eipm/bridge2ai-redcap),
    archived on Zenodo at https://zenodo.org/doi/10.5281/zenodo.12760724, MIT licensed. Release 1.1 cites
    Bridge2AI Voice REDCap v3.20.0 (https://doi.org/10.5281/zenodo.14148755); releases 3.0.0 and 3.1.0
    cite v3.23.0 (https://zenodo.org/records/14989503).
  - The Bridge2AI-Voice documentation site and dashboards (https://docs.b2ai-voice.org/), source at https://github.com/eipm/bridge2ai-docs,
    MIT licensed, archived at https://zenodo.org/doi/10.5281/zenodo.13834653.
  - FHIR profiles for voice as a biomarker, published by the consortium as a separate source-code resource.
  - Training resources for dataset users at https://www.b2aivoicescholars.org/.
  future_guarantees:
  - Documentation records guarantees that external resources will exist and remain constant over time
    as not applicable, and states that the dataset is self-contained.
  archival: false
  restrictions:
  - 'Documentation records restrictions associated with external resources as not applicable, because
    the dataset is self-contained. The supporting code repositories carry their own permissive licenses:
    MIT for the REDCap dictionary and the documentation site, Apache-2.0 for the preprocessing library.'
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    description: A Python package that prepares acoustic data for the Bridge2AI Voice project. It converts
      raw audio waveforms into the released feature files and merges the source data into the phenotype
      files. The PhysioNet 3.0.0 and 3.1.0 release pages state that the release was generated with b2aiprep
      v3.0.0, which is the version recorded here; the RO-Crate for release 3.0.0 instead records version
      3.0.2, last modified 2026-01-06.
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://github.com/sensein/senselab
    name: SenseLab
    description: Toolkit used for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
  - id: https://github.com/eipm/bridge2ai-redcap
    name: Bridge2AI Voice REDCap
    description: Bridge2AI REDCap data dictionary, metadata and instrument PDFs defining the questionnaires
      and clinical forms used during collection.
    version: 3.23.0
    license: MIT
    url: https://github.com/eipm/bridge2ai-redcap
resources:
- id: https://doi.org/10.13026/k81f-qr68
  name: b2ai-voice-3.0.0
  title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information, version
    3.0.0'
  description: The immediately preceding release of the adult flagship dataset, published on PhysioNet
    on 2025-12-16 with data for 833 participants across five North American sites. This is the release
    described by the upstream Bridge2AI-Voice RO-Crate (ark:59853/rocrate-b2ai-voice-3.0.0, crate version
    3.0.0, crate datePublished recorded in the ambiguous form 12/16/2025). Relative to v2.0.1 it added
    data for 391 further participants, separated the single phenotype table into individual thematic files,
    added Speech Articulatory Coding features and phonetic posteriorgrams, and reorganized the file layout.
    The crate records a total content size of 12.9 GB for this release and a Merkle root hash of f1663e1069a9894b21202ebf05f4839b9fb82b79ba5b337df54dd18f36d3be47
