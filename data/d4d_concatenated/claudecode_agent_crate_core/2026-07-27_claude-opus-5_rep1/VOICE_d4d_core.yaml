version: 3.1.0
was_derived_from: Voice, speech, cough and respiratory audio waveforms recorded prospectively on tablet
  devices under the Bridge2AI Voice Data Acquisition protocol, together with questionnaire and clinical
  data captured in REDCap and, for the pediatric protocol, ReproSchema-UI. The published release contains
  de-identified derived features computed from those waveforms rather than the waveforms themselves.
id: https://doi.org/10.13026/8xbn-nq66
name: b2ai-voice
description: 'The Bridge2AI-Voice (B2AI-Voice) flagship adult dataset is a large, ethically sourced, demographically
  diverse collection of data derived from voice, speech and respiratory recordings, linked to detailed
  health information. It is produced by the Bridge2AI-Voice consortium, a multi-institutional Precision
  Public Health grand challenge funded by the NIH Common Fund Bridge2AI program, and is published on PhysioNet.
  Participants were recruited at specialty clinics across five North American sites on the basis of conditions
  known to manifest in the voice waveform: voice disorders, neurological and neurodegenerative disorders,
  mood and psychiatric disorders and respiratory disorders, together with control participants without
  those conditions. Each participant performed a standardized protocol of acoustic tasks (sustained vowels,
  glides, diadochokinesis, validated reading passages, free speech, cough and breathing sounds) on a tablet
  application, and completed demographic, confounder, medical-history and disease-specific validated questionnaires;
  clinical diagnoses were validated by qualified clinicians against established gold standards drawn from
  clinical assessment, imaging and electronic health records.

  The public release is a feature-only, de-identified derivation of the audio rather than the audio itself.
  It provides dense per-recording tensors (spectrograms, mel spectrograms, MFCCs, pitch tracks, phonetic
  posteriorgrams, and articulatory/loudness/periodicity estimates from the Speech Articulatory Coding
  package) in Parquet form, static per-recording acoustic feature summaries derived with openSMILE, Praat,
  parselmouth and torchaudio, and tab-delimited phenotype tables with accompanying JSON data dictionaries
  covering enrollment, demographics, confounders, per-condition diagnoses, validated questionnaires and
  per-task metadata. Raw audio waveforms are withheld from this release and are distributed only through
  a separate controlled-access process.

  The current release is v3.1.0, published on PhysioNet on 2026-05-01, which contains data for 833 participants.
  It is a minor update over v3.0.0 (published 2025-12-16, also 833 participants) that adds data for some
  existing participants, repairs broken Parquet files, adds audio-quality metric and per-recording metadata
  files, back-fills validated diagnosis information and renames some phenotype files and gold-standard
  variables. A separate Bridge2AI-Voice Pediatric Dataset covering a distinct cohort of 300 participants
  aged 2 to 18 is published as its own PhysioNet project and is not a version of this dataset.'
