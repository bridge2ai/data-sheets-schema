purposes:
- id: d4d:purpose-voice-biomarker-research
  name: Enable voice as a biomarker of health
  description: Primary motivation for creating the dataset.
  response: The dataset was created to address the absence of large-scale, diverse, well-documented voice
    data suitable for clinical machine-learning applications. Earlier machine-learning studies of voice-based
    diagnosis produced promising results but used sample sizes that were too small or lacked the metadata
    needed to train robust, clinically useful models. The consortium set out to build an ethically sourced,
    large and diverse dataset with which to develop, benchmark or validate clinically applicable AI and
    ML models, so that voice can be used as a non-invasive, cost-effective biomarker for the screening,
    diagnosis and monitoring of a wide range of health conditions.
- id: d4d:purpose-audiomics-standards
  name: Establish standards for audiomics
  description: Standards and interoperability motivation.
  response: A second purpose is to introduce and support the field of audiomics, the interdisciplinary
    application of audio analysis to biomedicine, by developing new standards for acoustic and voice data
    collection and analysis. The consortium's stated agenda is that standards for audiomics data acquisition,
    interoperability and AI readiness must be defined; that diverse teams spanning clinicians, engineers,
    bioethicists and social scientists must collaborate; and that the ethical and legal challenges of
    audiomics, including HIPAA exposure, potential re-identification of patients by their voice, voice
    hacking and data ownership, require a new governance framework.
- id: d4d:purpose-scale-target
  name: Build a flagship voice database at scale
  description: Stated scale targets, which differ across the source documents and are recorded here with
    their scope.
  response: Current project documentation states the goal of a flagship, standardized and ethically sourced
    dataset of 10,000 voices linked to health information, and the study metadata records an anticipated
    enrollment count of 10,000 by 2027. The 2024 audiomics white paper describes the primary deliverable
    as a publicly available database of 30,000 human voices, and the IRB protocol gives a sample size
    of 30,000 participants, of which 5,000 were to be enrolled at the University of South Florida through
    high volume expert clinics and community outreach clinics with the remainder reached through collaborating
    institutions and existing cohorts. The RO-Crate for release 3.0.0 describes collection as ongoing
    toward an anticipated enrollment of approximately 3,000 participants by November 2026. The IRB protocol's
    phased plan targets up to 180 participants in phase 1 (completed November 2023), a cumulative 600
    in phase 2 (begun November 2023), a cumulative 3,000 in phase 3 and a cumulative 5,000 in phase 4,
    with complete multi-modal acquisition for up to 5,000 participants per disease category and controls.
- id: d4d:purpose-applications
  name: Intended application domain
  description: Applications the dataset is meant to address.
  response: The dataset is primarily intended for research applications, specifically the development
    of AI and machine-learning models for healthcare. It aims to support clinical research in disease
    screening, diagnosis and monitoring through voice biomarkers, and can be used for model pretraining,
    fine-tuning, benchmarking or validation.
tasks:
- id: d4d:task-disease-classification
  name: Disease detection and classification from voice
  description: Predefined tasks and labels shipped with the release.
  response: The release comes with predefined tasks and labeling. The tasks are primarily designed for
    training machine-learning models for disease detection and classification using voice data, with labels
    comprising diagnostic categories such as vocal pathologies, neurological disorders, psychiatric conditions
    and respiratory disorders. There are no recommended data splits for training, validation or testing;
    researchers are expected to construct their own splits according to their requirements.
- id: d4d:task-project-aims
  name: Bridge2AI-Voice grand challenge aims
  description: The six aims of the funded project that generated the dataset.
  response: The funded project defines six modules. Aim 1, data acquisition, is to build a multi-modal,
    multi-institutional, large-scale, diverse and ethically sourced human voice database linked to other
    biomarkers of health that is AI/ML friendly. Aim 2, standards, is to introduce the field of acoustic
    biomarkers by developing new standards of acoustic and voice data collection and analysis. Aim 3,
    tool development and optimization, is to develop software and cloud infrastructure for automated voice
    data collection through a smartphone application with integrated acoustic amplifiers and acoustic
    quality standardization, and to implement federated learning so that multi-institutional data can
    be analysed while minimizing data sharing. Aim 4, ethics, is to integrate existing scholarship, tools
    and guidance with new normative insight on trustworthy voice AI, and to develop new guidelines for
    consenting to voice data collection, sharing and use. Aim 5, teaming, is to build bridges between
    medical voice research, acoustic engineering and the AI/ML world. Aim 6, skills and workforce development,
    is to create a curriculum on voice biomarkers and to build a community of voice AI researchers, especially
    from underserved communities.
addressing_gaps:
- id: d4d:gap-small-datasets
  name: Small, non-standardized and non-diverse existing datasets
  description: The unmet need the dataset addresses.
  response: Existing voice-AI research was limited to small and medium-sized datasets, often using voice
    as the only data type and without the metadata needed to link acoustics to clinical ground truth.
    Comparing studies and pooling data was hampered by the lack of standards for how voice and speech
    are measured and collected. In laryngeal-cancer screening and diagnosis, most reported training datasets
    contained fewer than 300 patients and only two studies used more than one data modality. Industry
    holds vast quantities of voice data but lacks accurate clinical or demographic annotation and does
    not permit external auditing for fair representation. Bridge2AI-Voice addresses these gaps by combining
    standardized prospective acquisition, clinician-validated diagnoses, rich multimodal phenotype data
    and public release under ethical governance.
- id: d4d:gap-ethical-legal
  name: Ethical, legal and governance gaps in voice AI
  description: Governance gaps the project set out to close.
  response: 'The consortium identified unresolved ethical and legal challenges specific to voice: the
    possibility of re-identifying patients from their voice, voice AI hacking, uncertainty about voice
    data ownership and sharing, and the influence of gender and racial diversity on the development and
    application of voice technologies. The project addresses these through ethical inquiry that shapes
    the collection protocol and dissemination practice, new consent guidelines for voice data collection
    and sharing, and a tiered access model that separates low-risk derived features from raw audio.'
- id: d4d:gap-pediatric-norms
  name: Absence of pediatric voice and speech datasets
  description: Gap addressed by the separate pediatric cohort, recorded here because it motivates part
    of the programme.
  response: Pediatric and adult voice and speech production differ fundamentally because the respiratory
    system and larynx mature rapidly through childhood, so adult normative data cannot be generalized
    to children. Despite the clinical importance of early detection of pediatric communication disorders
    such as autism spectrum disorder and speech delay, large-scale pediatric datasets remain scarce because
    of privacy concerns, consent complexity and the need for developmentally appropriate tasks. The separate
    Bridge2AI-Voice Pediatric Dataset was created to close that gap; it is not part of this adult release.
