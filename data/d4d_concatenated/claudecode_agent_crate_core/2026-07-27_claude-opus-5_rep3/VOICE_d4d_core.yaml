instances:
- id: instance_participant
  name: participant
  description: The primary instance type in the dataset.
  instance_type: person
  counts: 833
  label: true
  label_description: Each instance represents a person. The healthsheet reports approximately 833 instances,
    and the v3.1.0 release notes confirm 833 participants with no new participants added over v3.0.0.
    Each participant carries diagnostic labels drawn from the five disease cohort categories or is a control.
    Because participants may have repeated visits, there may be more than one row per participant in the
    data files, and responses need not be identical across visits.
  sampling_strategies:
  - id: sampling_strategy_instance_level
    name: clinic_based_cohort_sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
    - A larger, ongoing collection targeting an anticipated enrollment of 10,000 participants by 2027
      in the study metadata, with the IRB protocol describing a phased approach towards 30,000 participants
      across all participating institutions.
    why_not_representative:
    - The data are not representative because they were collected at a limited number of geographic locations.
      The project hopes to make the sample more representative by shifting to remote collection and by
      designing recruitment to control for more variables.
    strategies:
    - Non-probability sampling.
    - Participants are recruited across academic institutions from "high volume expert clinics", defined
      in the dataset documentation as outpatient clinics within hospital systems or academic institutions
      with expertise in a specific disease area that see more than 50 patients per month from the same
      disease category.
  missing_information:
  - id: missing_info_optional_items
    name: optional_and_irregular_responses
    missing:
    - Responses to optional questionnaire items.
    - Items outside the common core that are only asked of participants in a particular primary diagnostic
      category.
    why_missing:
    - Some questions are optional.
    - There may be data collection irregularities that caused some information to be missing from individual
      instances.
    - Each individual answered a common set of questions and then responded to additional questions relevant
      to their primary diagnostic category.
- id: instance_recording
  name: derived_voice_recording
  description: The recording-level instances that carry the derived acoustic features.
  instance_type: derived audio recording
  label: false
  label_description: 'Each derived recording is keyed by participant_id, session_id and task_name. In
    the v3.1.0 release the per-feature record counts are: torchaudio_spectrogram 29,278; torchaudio_mel_spectrogram
    29,278; torchaudio_mfcc 29,278; torchaudio_pitch 32,522; sparc_ema 28,640; sparc_loudness 31,855;
    sparc_periodicity 31,872; sparc_pitch 31,872; and ppgs 29,289. The project documentation describes
    version 3.0 as containing approximately 61,937 voice-derived recordings from 833 adult participants.
    Counts differ between features because spectrograms, mel spectrograms, MFC coefficients, PPGs and
    EMAs for sensitive records and audio checks have been removed, and because some files could not generate
    certain features owing to length or other issues.'
anomalies:
- id: anomaly_collection_variability
  name: collection_configuration_variability
  description: Errors, sources of noise and redundancy identified in the released data.
  anomaly_details:
  - Different sites have different collection configurations.
  - The collection protocol changed over the course of the study.
  - Confounding factors present in the data include noise artifacts, variations in diagnostic practices,
    inaccurate questionnaire responses and underreporting.
  - Recordings were made with a head-mounted headset with a microphone that could be at slightly different
    distances from the speaker.
  - Certain aspects of the data, such as transcription, were generated using off-the-shelf models that
    have not been audited for correctness.
  - Some derived audio features could not be computed for all recordings owing to quality or length constraints,
    so those records are absent from the corresponding feature files.
  - The v3.1.0 release notes record that broken Parquet files from the previous release were fixed, that
    validated diagnosis information was updated across conditions with back-filled information, that some
    phenotype files were rearranged and that certain gold-standard variable names were renamed.
known_biases:
- id: bias_sampling
  name: sampling_bias
  bias_type: sampling_bias
  bias_description: Participants are recruited from specialty clinics and associated institutions using
    a non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
    English speakers. This produces clinically enriched case mixes that may not represent general population
    distributions. The public data releases do not contain an equal distribution of the five disease categories.
  mitigation_strategy: Users should consider the multivariate distribution across disorder category, site
    and demographic factors when assessing utility for a given question. The project plans to shift to
    remote collection and to design recruitment to control for more variables.
  affected_subsets:
  - All disease cohorts.
- id: bias_geographic_and_cultural
  name: geographic_and_cultural_bias
  bias_type: representation_bias
  bias_description: Data are collected at a limited number of North American sites, and although the project
    seeks diversity, it may under-represent speakers from other regions, cultures, languages and healthcare
    systems. Early releases focus on English, with Spanish protocols planned but not yet fully represented.
    Groups that have less trust in the medical system or in AI, or that are less proximal to the collection
    sites, would have been less likely to be recruited.
  mitigation_strategy: Spanish-language protocols and data collection are under development and were added
    to the IRB protocol in February 2025; the consortium's Plan for Enhancing Diverse Perspectives is
    intended to enroll participants from socially and economically disadvantaged and underserved populations.
  affected_subsets:
  - Non-English speakers.
  - Populations distant from the five collection sites.
- id: bias_clinical_spectrum
  name: clinical_spectrum_bias
  bias_type: selection_bias
  bias_description: Because participants are selected into disease cohorts where voice changes are expected,
    the prevalence and severity of conditions in the dataset differ from those in routine primary care
    or community settings, which may inflate model performance when evaluated within this dataset.
  affected_subsets:
  - All disease cohorts.
- id: bias_device_and_environment
  name: device_and_environment_bias
  bias_type: measurement_bias
  bias_description: Recordings are made using standardized but not identical hardware and primarily in
    clinical environments. Distinct iPad devices were used at each site, and participants were screened
    for different disorders based on site, so participants with different conditions also had their data
    collected with different devices. Future at-home collection or deployment on other devices may encounter
    different background noise, channel characteristics and user behaviour.
  affected_subsets:
  - Recordings grouped by collection site.
- id: bias_machine_annotation
  name: algorithmic_bias_in_machine_annotations
  bias_type: algorithmic_bias
  bias_description: Transcripts and some derived features rely on off-the-shelf models such as OpenAI
    Whisper and other audio toolkits whose performance may vary across demographic groups. The dataset
    team has not independently audited these tools for fairness, so downstream users should consider their
    biases when interpreting results.
  mitigation_strategy: The dataset documentation flags the unaudited status of machine-generated content
    so that downstream users can account for it.
- id: bias_distribution_shift
  name: temporal_distribution_shift
  bias_type: historical_bias
  bias_description: Changes in diagnostic criteria or practices over the collection period could be a
    source of distribution shift, and the clinical diagnosis, depending on the disorder, was performed
    by one clinician or based on an EHR record or prescription.
known_limitations:
- id: limitation_no_raw_audio
  name: feature_only_release
  limitation_type: scope_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts.
  scope_impact: This limits certain types of modeling and error analysis and may constrain the ability
    to reproduce end-to-end audio pipelines.
  recommended_mitigation: Researchers who require the underlying audio can apply for controlled access
    through the Data Access Compliance Office at DACO@b2ai-voice.org; adult raw audio is distributed via
    Synapse.
- id: limitation_adult_only
  name: adult_cohort_only
  limitation_type: coverage_limitation
  limitation_description: This version of the flagship dataset includes an adult cohort only, and the
    current adult dataset contains fluent English speakers.
  scope_impact: Models trained solely on this dataset may not generalize to younger age groups or to languages
    beyond those represented.
  recommended_mitigation: The separately published Bridge2AI-Voice Pediatric Dataset covers participants
    aged 2-18, and Spanish protocols are under development for future adult releases.
- id: limitation_deidentification_tradeoff
  name: deidentification_reduces_analysable_detail
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed.
  scope_impact: This reduces the risk of re-identification but also limits detailed fairness assessments
    and certain confounder adjustments.
- id: limitation_no_splits_or_uncertainty
  name: no_predefined_splits_or_label_uncertainty
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train-validation-test splits or benchmarking
    tasks and does not include explicit per-instance label-uncertainty measures.
  scope_impact: Researchers must design their own evaluation protocols and handle label noise and missingness
    themselves.
- id: limitation_governance_friction
  name: access_governance_friction
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers.
  scope_impact: It can complicate the reproducibility of pipelines that require both derived features
    and raw audio.
- id: limitation_no_external_data_in_release
  name: multimodal_data_not_released
  limitation_type: scope_limitation
  limitation_description: Other multimodal data collected by the project - imaging, genomic data for the
    neurological cohort, laryngoscopy imaging and other EHR data - is extracted at each site independently
    and uploaded through the REDCap database, but no external data was released in the v3.0.0 public release.
  scope_impact: Analyses requiring linked imaging or genomic modalities cannot be performed on the public
    release.
- id: limitation_no_k_anonymization
  name: no_k_anonymization
  limitation_type: methodological_limitation
  limitation_description: The dataset documentation states that the dataset does not achieve k-anonymization
    with k greater than or equal to 2, although direct identifiers are removed, HIPAA de-identification
    rules are applied, dates are rebased or replaced by integers, geographic information is removed or
    generalized and narrative text fields are removed.
  scope_impact: Formal anonymity guarantees are not provided; the access controls and the data use agreement
    are the operative protections.
confidential_elements:
- id: confidentiality_assessment
  name: confidentiality_assessment
  confidential_elements_present: false
  confidentiality_details:
  - Asked whether the dataset contains data that might be considered confidential, for example data protected
    by legal privilege or doctor-patient confidentiality, or the content of individuals' non-public communications,
    the dataset documentation answers "No".
  - The upstream RO-Crate for release 3.0.0 nonetheless records a confidentiality level of "Limited dataset
    available with Data Use Agreement", and access to the released files requires credentialing and a
    signed agreement.
content_warnings:
- id: content_warning_free_speech
  name: free_speech_content
  content_warnings_present: true
  warnings:
  - The dataset includes the transcription of free speech tasks. While the inclusion of offensive, insulting
    or threatening content is unlikely, it cannot be completely avoided, as research participants are
    responsible for their choice of language.
  - Some cohort questionnaires ask about mood disorders, depression, anxiety and traumatic experiences;
    answering these questions can cause discomfort and could trigger negative emotions for participants.
subpopulations:
- id: subpopulation_demographics
  name: identified_demographic_subpopulations
  subpopulation_elements_present: true
  identification:
  - Age
  - Gender
  - Sex
  - Ethnicity
  - Socioeconomic status
  distribution:
  - The dataset does not contain an equal distribution of the five disease cohort categories, and the
    dataset has skews based on disorder category, site and other demographic factors.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form;
    finer-grained geographic identifiers and many socio-economic and cultural details were removed during
    de-identification.
- id: subpopulation_disease_cohorts
  name: disease_cohort_subpopulations
  subpopulation_elements_present: true
  identification:
  - Voice disorders cohort
  - Neurological and neurodegenerative disorders cohort
  - Mood and psychiatric disorders cohort
  - Respiratory disorders cohort
  - Pediatric voice and speech disorders cohort
  - Controls
  distribution:
  - Data are collected across five disease categories; the initial data release contained data collected
    from four of the five categories, and the adult flagship release covers voice, neurological, mood
    and respiratory disorders plus controls.
  - The pediatric category is released as a separate PhysioNet project covering 300 participants aged
    2-18.
sensitive_elements:
- id: sensitive_elements_assessment
  name: sensitive_data_elements
  sensitive_elements_present: true
  sensitivity_details:
  - Racial or ethnic origins - the dataset includes race information.
  - Sexual orientation - the dataset includes sexual orientation information.
  - Financial and health data - the dataset includes socioeconomic and health information.
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory diseases,
    as well as symptom scores from questionnaires, which constitute sensitive personal health data.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    the feature-only dataset.
  - Raw voice recordings are themselves biometric identifiers and are made available only under controlled
    access.
  - The Data Transfer and Use Agreement classifies the data as Personally Identifiable Information as
    defined in OMB Memorandum M-07-16 and records that the data are covered by a Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant.
acquisition_methods:
- id: acquisition_method_primary
  name: direct_observation_and_self_report
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The data were directly observable and reported by subjects. Clinical diagnoses were verified by clinicians
    reviewing audio and/or imaging data, looking at electronic health records, or medication prescriptions.
  - Participants who consent are asked to perform speaking tasks and to complete self-reported demographic
    and medical history questionnaires as well as disease-specific validated questionnaires, and permit
    investigators to access medical information through EHR platforms in order to perform gold-standard
    validation of diagnoses and symptoms.
  - The released features are inferred or derived from the raw audio by automated feature extraction pipelines
    rather than observed directly.
collection_mechanisms:
- id: collection_mechanism_apps
  name: collection_applications_and_hardware
  mechanism_details:
  - Adult voice samples are collected prospectively using a custom software application, the Bridge2AI-Voice
    App, following the Bridge2AI-Voice protocols. The data were collected using an iPad app.
  - Data collection occurs through two platforms, the Bridge2AI-Voice Web app and the Bridge2AI-Voice
    iOS app. The iOS app is restricted to iOS-compatible devices, while the web app can run on a computer,
    tablet or phone. No software is downloaded or installed; both apps are HIPAA-compliant and only store
    data during the collection phase, with data removed as soon as the page is closed and no login required.
  - Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36
    microphone and an Apple dongle to connect it to the iPad.
  - Pediatric data are collected using reproschema-ui with the Bridge2AI-Voice pediatric protocol.
  - Data are sent over a secure HTTPS protocol to a HIPAA-compliant storage server hosted by an NIH STRIDES
    partner (Amazon, Google or Microsoft), which have pre-negotiated agreements with NIH covering data
    privacy and HIPAA protection.
  - Clinical and phenotype data are managed in a REDCap database; the supporting REDCap data dictionary,
    metadata and instrument PDFs are published at https://github.com/eipm/bridge2ai-redcap.
  - A separate feasibility study of the collection application was carried out at the USF Health Voice
    Center between 5 June 2023 and 28 July 2023 with 47 participants, using the Plan-Do-Study-Act model
    over three cycles; it measured task completion, recording success and requests for assistance, and
    led to the addition of a user-experience specialist to the team. No audio data was collected at that
    stage of app development.
collection_timeframes:
- id: collection_timeframe_overall
  name: collection_timeframe
  timeframe_details:
  - The healthsheet states that the data was collected over a period of 12 months.
  - The upstream RO-Crate for release 3.0.0 records that data collection for the adult flagship cohort
    began after project launch in 2023 and is ongoing across five North American sites, and that the participants
    and recordings included in dataset version 3.0.0 were collected roughly between 2023 and 2025.
  - 'The RO-Crate further records that dataset releases are static snapshots: v1.0 as the initial public
    release in 2024, v1.1 on 2025-01-17, v2.0.0 on 2025-04-16, v2.0.1 on 2025-08-18 and v3.0.0 on 2025-12-16,
    each corresponding to a frozen state of the underlying data collection.'
  - The IRB protocol describes a four-year prospective cohort study with four phases - exploratory, pilot,
    expansion and outreach - with phase 1 completed in November 2023 and pilot data collection begun in
    November 2023.
  - The NIH RePORTER record gives a project start of 2022-09-01 and a project end of 2026-11-30.
data_collectors:
- id: data_collector_research_teams
  name: research_teams_and_clinicians
  role: data collection and clinical validation
  collector_details:
  - Research teams, which may include medical, graduate or undergraduate students, coordinated with clinicians
    and doctors to identify appropriate participants.
  - These clinicians and doctors were listed under the IRB as co-investigators and were added to the consortium
    so that their names are included on consortium-level publications that emerge from the research.
  - Hospital staff were not involved in scheduling but assisted in the logistics of coordinating data
    collection.
  - Data is collected in the clinic with the assistance of a trained research assistant; clinical validation
    is performed by a qualified physician or practitioner based on established gold standards for diagnosis.
missing_data_documentation:
- id: missing_data_documentation_release
  name: missing_data_in_the_release
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  - Some derived audio features could not be computed for all recordings, so the per-feature record counts
    differ.
  missing_data_causes:
  - Some questionnaire items are optional.
  - Data collection irregularities.
  - Cohort-specific instruments are administered only to participants in the relevant primary diagnostic
    category.
  - Audio quality or recording length constraints prevented feature computation.
  - Features relating to free speech or to sensitive records have been deliberately removed before release.
  handling_strategy: No additional imputation is applied in the released files; missing values are left
    explicit or the row is omitted. The data release team audited the dataset internally for missingness
    and consistency, and a missingness table is included with the dataset.
raw_data_sources:
- id: raw_data_source_audio_and_survey
  name: raw_audio_and_survey_sources
  source_description: The original raw data consist of high-quality voice, speech and respiratory audio
    waveforms recorded on tablet or smartphone devices with headset microphones when available, plus responses
    to structured demographic and medical history questionnaires, disease-specific validated questionnaires
    and other patient-reported outcomes, together with clinical diagnoses and other metadata extracted
    from electronic health records.
  source_type:
  - Acoustic recordings (voice, speech, breath and cough)
  - Participant-reported questionnaire responses
  - Clinician-assigned diagnostic labels
  - Electronic health record extracts
  access_details: The public feature-only PhysioNet release contains de-identified derived representations
    of the audio together with tabular phenotype files and data dictionaries. Access to the underlying
    raw audio is available only through a separate controlled-access process; adult raw audio is distributed
    via Synapse at https://www.synapse.org/Synapse:syn72370534/ following institutional sign-off, with
    requests directed to DACO@b2ai-voice.org.
  raw_data_format:
  - WAV audio waveforms
  - REDCap survey exports
  - reproschema-ui exports (pediatric)
sampling_strategies:
- id: sampling_strategy_dataset
  name: dataset_sampling_strategy
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - A larger, ongoing collection. The study metadata records an anticipated enrollment count of 10,000
    by 2027; the RO-Crate for release 3.0.0 describes collection as ongoing across five North American
    sites toward an anticipated enrollment of approximately 3,000 participants by November 2026; and the
    IRB protocol describes a phased plan reaching 30,000 participants across all participating institutions,
    with up to 5,000 participants per disease category.
  why_not_representative:
  - The data is not representative because it was collected at a limited number of geographic locations.
  strategies:
  - Non-probability sample; observational cohort design with a cross-sectional time perspective.
  - 'Patients presenting at specialty clinics and institutions were screened against predefined inclusion
    and exclusion criteria prior to their visit by the project investigators, and were selected on membership
    of five predetermined groups: respiratory disorders, voice disorders, neurological disorders, mood
    disorders and pediatric.'
  - Participants without the conditions of interest were also enrolled to serve as controls.
  - Adult eligibility required participants to be at least 18 years old with a maximum age of 120 years,
    of any sex, with healthy volunteers accepted; the principal exclusion criterion for the current release
    is not reading or speaking English.
  representative_verification:
  - No representativeness validation is reported; the documentation states directly that the sample is
    not representative.
raw_sources:
- id: raw_source_controlled_access_audio
  name: raw_audio_availability
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - The raw data, post de-identification, was saved in addition to the preprocessed data; it is saved
    and is not accessible publicly.
  - Users interested in accessing the audio data from any Bridge2AI-Voice dataset can request access by
    emailing the access committee at DACO@b2ai-voice.org. Raw audio data is disseminated through controlled
    access only, to protect participants' privacy.
  - Accessing raw audio requires institutional sign-off. As announced on 2026-03-09, adult raw audio is
    made available via Synapse at https://www.synapse.org/Synapse:syn72370534/, and pediatric raw audio
    via https://www.synapse.org/Synapse:syn73617068.
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
preprocessing_strategies:
- id: preprocessing_strategy_audio_features
  name: audio_standardization_and_feature_extraction
  description: Derivation of the released acoustic features from the raw waveforms.
  preprocessing_details:
  - Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing
    filter applied; audio is then segmented by task and passed through quality checks.
  - Spectrograms are computed using the short-time Fast Fourier Transform with a 25 ms window size, 10
    ms hop length and a 400-point FFT, and are downsampled by a factor of two in the time domain after
    derivation; released spectrograms have dimension 201xT.
  - Sixty Mel-frequency cepstral coefficients are extracted from those spectrograms, and Mel spectrograms
    are computed with the same parameters and 60 Mel bins, both of dimension 60xT.
  - Pitch is detected over time with a minimum and maximum of 80 and 500 Hz for the torchaudio estimate,
    and with a range of 50-550 Hz for the sparc estimate.
  - 'Articulatory features are generated with the Speech Articulatory Coding (sparc) package, producing
    kinematic traces of vocal tract articulators and source features together with loudness, periodicity
    and pitch measures, all gathered at 50 Hz. Estimated electromagnetic articulography has dimensions
    Tx12 corresponding to X/Y positions of six articulators: tongue dorsum, tongue body, tongue tip, lower
    incisor, upper lip and lower lip. Loudness is based on the average absolute amplitude of the waveform
    using 20 ms windows, and periodicity expresses the confidence of pitch presence using 20 ms windows.'
  - Acoustic features were extracted using openSMILE, capturing temporal dynamics and acoustic characteristics,
    and phonetic and prosodic features were computed using Parselmouth and Praat, providing measures of
    fundamental frequency, formants and voice quality. These appear as one row per unique recording in
    static_features.tsv.
  - Phonetic posteriorgrams giving a time-varying categorical distribution over 40 phoneme categories
    at 100 Hz were generated via the ppgs package.
  - Transcriptions were generated using OpenAI's Whisper Large model.
  - All dense features are stored as tensors in Parquet files keyed by participant, session and task identifiers.
  - The raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap were
    converted to be compliant with the Brain Imaging Data Structure v1.9.0.
  - The v3.1.0 release was generated with b2aiprep v3.0.0; the upstream RO-Crate for release 3.0.0 records
    the B2AIPrep Library at version 3.0.2 as the software used by both registered computations.
  used_software:
  - id: software_b2aiprep
    name: b2aiprep
    description: A Python package to prepare acoustic data for the Bridge2AI voice project. It organizes
      and preprocesses the dataset, converts raw audio waveforms into the Parquet feature files and merges
      the source data into the phenotype files. The upstream RO-Crate registers it as the software used
      by both the "VOICE Features Processing" computation and the "VOICE Phenotype Ingest" computation.
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: software_senselab
    name: SenseLab
    description: Toolkit for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
- id: preprocessing_strategy_phenotype_etl
  name: phenotype_extraction_and_reorganization
  description: Derivation of the released tabular phenotype data.
  preprocessing_details:
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using the b2aiprep library,
    reorganizing the former single phenotype table into thematically organized TSV files with accompanying
    JSON data dictionaries.
  - Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap format and
    subsequently converted to the Brain Imaging Data Structure.
  - The upstream RO-Crate for release 3.0.0 registers this step as a computation named "VOICE Phenotype
    Ingest", described as dumping and reformatting phenotype information from the REDCap database into
    b2ai-voice phenotype extracts, dated 12/16/2025 and run by "Alastair". The companion computation "VOICE
    Features Processing" is dated 01/29/2026 and generated the nine feature Parquet files.
  used_software:
  - id: software_b2aiprep_phenotype
    name: b2aiprep
    description: The same open-source library is used to merge source data into the phenotype files.
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
- id: preprocessing_strategy_deidentification
  name: deidentification_and_filtering
  description: Transformations applied to reduce re-identification risk before release.
  preprocessing_details:
  - Prior to release, data are transformed to reduce re-identification risk and align with regulatory
    and ethical requirements. Direct identifiers and high-risk quasi-identifiers are removed; dates are
    coarsened or rebased; geographic information is generalized to the country level; narrative text fields
    and transcripts of free speech are removed; and raw voice waveforms are withheld from the feature-only
    release.
  - Additional filtering removes features for sensitive records and audio checks, and some derived features
    are dropped when processing or quality checks fail.
  - All sensitive fields were removed from the dataset, corresponding to data elements encoded as sensitive
    under the column name "Identifier?" in the REDCap data dictionary.
  - All spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs and PPGs from open-response prompts
    are removed from the feature-only dataset.
  - Yes, the data were extracted from the raw audio to limit re-identification and only the extracted
    features are released with the dataset.
cleaning_strategies:
- id: cleaning_strategy_none
  name: data_cleaning
  cleaning_details:
  - Asked whether there was any pre-processing for cleaning the data, the dataset documentation answers
    "No".
  - 'Quality control is nonetheless applied through an audit protocol rather than through modification
    of values: generating missingness tables, checking distributions and outliers, checking categorical
    responses against the schema, and running quality control metrics for audio tasks including the amount
    of silence, duration, and, for speech, comparison of the produced speech against the intended passage.'
  - The smartphone application for voice data collection includes models to ensure acoustic data quality,
    including volume standardization and noise cancellation. In years two to four of the project, 10 per
    cent of the data is selected at random every month for quality control and ML readiness.
  used_software:
  - id: software_b2aiprep_qc
    name: b2aiprep
    description: Used for organizing and preprocessing the dataset during quality control.
    url: https://github.com/sensein/b2aiprep
labeling_strategies:
- id: labeling_strategy_clinical_gold_standard
  name: clinical_gold_standard_labeling
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.
  data_annotation_protocol:
  - Diagnostic labels are the result of a clinical assessment of the participant. At each site, a local
    clinician provided the diagnosis based on a clinical interview and appropriate work-up. For the psychiatric
    disorders cohort, the assessment was determined using the participant's EHR record or an active prescription,
    done outside of data collection by an appropriately licensed clinician.
  - The labeling strategy is a gold standard label available in the data, diagnosed by a clinician. Gold-standard
    validation methods vary by cohort and include laryngoscopy images and stroboscopy videos for voice
    disorders, spirometry and flow-volume loops and CT of the neck and chest for respiratory disorders,
    brain CT and MRI and whole genome sequencing for neurological disorders, and electronic health summaries,
    psychiatrist diagnosis and medication history for mood and psychiatric disorders.
  - Labelers followed the Bridge2AI protocols and ICD-10 codes.
  - Participants complete validated instruments such as VHI-10, PHQ-9, GAD-7, PANAS, respiratory and cough
    questionnaires and voice instruments, which generate numerical scores and categorical indicators according
    to each instrument's published scoring guidelines; the scoring logic is encoded in the REDCap instruments
    and documented in the data dictionaries.
  - Machine-generated transcripts of certain voice tasks and automatically extracted acoustic and articulatory
    features provide further labels and descriptors at the recording level.
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to the study for a
    prior diagnostic assessment.
  - Clinical annotations are created by clinicians and research staff at participating North American
    institutions spanning otolaryngology, neurology, neuroscience, pulmonology and allied health disciplines;
    detailed demographic breakdowns of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves, whose demographics
    are captured in coarsened form in the phenotype tables; per-annotator demographic information, such
    as which specific clinician or staff member entered a label, is not exposed.
  labeling_details:
  - Single labeler per data item; one labeler provides a label per instance.
  - Each recording is associated with one set of clinical labels and questionnaire responses derived from
    a single participant, although participants may contribute multiple sessions over time. There is no
    crowd-sourced labeling and the documentation does not report multiple independent human ratings per
    individual recording.
  - Asked about human-level performance in the applications the dataset is meant to address, the documentation
    answers that it varies widely.
  - Future researchers creating new labels or defining new tasks are advised that the process for any
    new labels should be described alongside any release of a model or publication, including the exact
    variables used for the determination.
imputation_protocols:
- id: imputation_protocol_none
  name: no_global_imputation
  imputation_method:
  - No global statistical imputation is applied to missing fields.
  imputed_fields:
  - None.
  imputation_rationale: Missing questionnaire responses, phenotype variables and derived features are
    left as explicit missing values or omitted rows so that users can implement study-specific imputation
    or complete-case strategies appropriate to their analyses.
  imputation_validation:
  - The data release team audited missingness rather than imputing it, and a missingness table is published
    with the dataset.
annotation_analyses:
- id: annotation_analysis_quality
  name: annotation_quality_analysis
  analysis_method: Internal audit of the combined phenotype and feature tables by the data release team
    for internal consistency, missingness patterns and data entry issues.
  annotation_quality_details:
  - Diagnostic labels are derived from clinical assessments and electronic health records rather than
    from crowd workers, so there is no explicit inter-rater majority-vote scheme; diagnoses are treated
    as reference labels and may include multiple comorbid conditions per participant.
  - Per-annotator disagreement statistics and detailed label-uncertainty measures are not presently included
    in the released dataset.
  - The dataset has been audited internally for missingness and consistency by the data release team,
    and a missingness table is included with the dataset. Certain aspects of the data, such as transcription,
    were generated using off-the-shelf models that have not been audited for correctness.
machine_annotation_tools:
- id: machine_annotation_tools_record
  name: automated_feature_and_transcription_tools
  tools:
  - openSMILE
  - Praat
  - parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram (ppgs) models
  - OpenAI Whisper Large
  - b2aiprep
  tool_descriptions:
  - openSMILE (Speech and Music Interpretation by Large-space Extraction) is used for extraction of acoustic
    feature sets capturing temporal dynamics and spectral characteristics.
  - Praat and the parselmouth Python interface are used for phonetic and prosodic feature extraction,
    including measures of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines compute spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - The Speech Articulatory Coding package estimates articulatory kinematics and related features.
  - Phonetic posteriorgram models produce time-varying distributions over phonetic units for each recording.
  - OpenAI Whisper Large performs automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library orchestrates preprocessing, feature extraction and merging of phenotype
    data into the released files.
  tool_accuracy:
  - Transcripts and some derived features rely on off-the-shelf models whose performance may vary across
    demographic groups; the dataset team has not independently audited these tools for fairness or for
    correctness.
  used_software:
  - id: software_whisper
    name: OpenAI Whisper Large
    description: Automatic speech recognition model used to generate transcriptions.
  - id: software_opensmile
    name: openSMILE
    description: Open-source audio feature extractor used for acoustic feature sets.
  - id: software_praat_parselmouth
    name: Praat and parselmouth
    description: Phonetic analysis software and its Python interface.
  - id: software_torchaudio
    name: torchaudio
    description: PyTorch audio processing library used for spectrograms, MFCCs and pitch.
  - id: software_sparc
    name: Speech Articulatory Coding (sparc)
    description: Package used to estimate articulatory kinematics and source features.
  - id: software_ppgs
    name: ppgs
    description: Package generating high-fidelity neural phonetic posteriorgrams.
existing_uses:
- id: existing_use_summer_school
  name: existing_uses
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
  - Training opportunities for using the dataset are offered through the Bridge2AI-Voice Scholars programme
    at https://www.b2aivoicescholars.org/.
use_repository:
- id: use_repository_none
  name: repository_of_dataset_uses
  repository_details:
  - Asked whether there is a repository that links to any or all papers or systems that use the dataset,
    besides Google Scholar, the dataset documentation answers "No".
  - Project views recorded on the PhysioNet landing pages are 93 for adult version 3.1.0 and 801 across
    all adult versions, and 42 for pediatric version 1.1.0 and 119 across all pediatric versions.
other_tasks:
- id: other_task_potential
  name: additional_supported_research_tasks
  task_details:
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance on
    a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
    de-identified derived features, including work on representation learning, domain adaptation and multimodal
    integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
future_use_impacts:
- id: future_use_impact_skews
  name: composition_effects_on_future_use
  impact_details:
  - Yes - this dataset has skews based on disorder category, site and other demographic factors. Users
    should consider the multivariate distribution when assessing utility for different questions.
  - The project aims to create an ethically sourced, diverse voice dataset to support research on using
    voice as an accessible, low-cost biomarker for screening, diagnosis and monitoring of a broad range
    of health conditions, potentially improving early detection and care for underserved populations.
    At the same time, the consortium explicitly recognizes the risks associated with voice data, including
    privacy loss, misuse of voice biometrics and algorithmic harms such as discrimination in hiring, insurance
    or surveillance contexts.
  - Dataset documentation and ongoing ethics workstreams are intended to help downstream users reason
    about these risks and design responsible analyses and models.
discouraged_uses:
- id: discouraged_use_non_research
  name: discouraged_uses
  discouragement_details:
  - The dataset should not be used for non-research or non-clinical applications such as hiring decisions,
    insurance premium adjustments, or any form of surveillance that could lead to discrimination or harm.
  - These discouraged uses are intended to prevent unethical or biased outcomes that could negatively
    impact individuals based on their health conditions or voice characteristics.
  - The dataset is explicitly not intended for operational decision making about specific individuals
    such as hiring, insurance pricing, law enforcement or surveillance.
intended_uses:
- id: intended_use_clinical_ml
  name: intended_uses
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived features
    with diagnostic categories or symptom severity for conditions such as vocal fold pathology, neurological
    and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms on a clinically diverse, multi-site
    cohort with standardized tasks and rich phenotype data.
  - AI model pretraining, fine-tuning, benchmarking or validation.
  - Cohort selection using the questionnaire features distributed in the phenotype folder format.
  usage_notes: The Parquet dataset can be loaded with any library that supports Parquet, for example the
    HuggingFace Datasets library; spectrograms can be plotted in decibels by converting from the original
    power representation with librosa. Phenotype files can be read with any statistical analysis tool,
    for example pandas. Each data file has a companion JSON data dictionary describing the columns, the
    question asked where applicable, and the response data type.
  use_category:
  - Research
  - Clinical machine-learning model development
  - Methodological and fairness research
- id: intended_use_applications
  name: intended_application_domains
  examples:
  - The Bridge2AI Voice dataset is primarily intended for research applications, specifically in the development
    of AI and machine-learning models for healthcare.
  - It aims to support clinical research in disease screening, diagnosis and monitoring through voice
    biomarkers.
prohibited_uses:
- id: prohibited_use_reidentification_and_harm
  name: prohibited_uses
  prohibition_reason:
  - The dataset is not to be used to attempt to re-identify research participants, nor for any actions
    that could reasonably lead to re-identification.
  - The dataset is not to be used for any purpose that could foreseeably cause harm or stigmatization
    to research participants, their families, communities or specific populations.
  - Intellectual property protections, database rights or related rights may not be used in a manner that
    restricts or limits access to any part of the dataset or to any conclusions derived from it; this
    restriction ensures that future use of the dataset remains unrestricted, in alignment with the Open
    Science principles upheld by the consortium.
  - Sale of all or part of the data on any media is not permitted.
  - Recipients may not disclose, release, sell, rent, lease, loan or otherwise grant access to the data
    to any third party except authorized persons without the prior written consent of the provider; collaborators
    at other research organizations and other research teams at the same organization must apply independently
    for access and sign their own Data Transfer and Use Agreement.
distribution_formats:
- id: distribution_format_physionet_features
  name: physionet_registered_access_features
  description: The primary distribution channel. A derived dataset containing spectrograms and combined
    phenotypic data is available on PhysioNet under a permissioned access mechanism. Registration on PhysioNet
    and signing of a data use agreement enable access. Dense features are distributed as Parquet files,
    tabular phenotype and static feature data as TSV, and data dictionaries as JSON.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  - https://physionet.org/content/b2ai-voice/
- id: distribution_format_controlled_audio
  name: controlled_access_raw_audio
  description: Raw audio is available under a controlled-access mechanism. Applicants complete the Data
    Access Request Form and the Data Use Agreement, submit the application to the Data Access Compliance
    Office for review, and on approval ensure that a Data Use and Transfer Agreement is signed by an authorized
    official at their institution. Adult raw audio is distributed via Synapse.
  access_urls:
  - https://www.synapse.org/Synapse:syn72370534/
- id: distribution_format_pediatric
  name: pediatric_registered_access
  description: The pediatric dataset is distributed under a separate PhysioNet project link with the same
    registered-access mechanism; pediatric raw audio is distributed via Synapse.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
  - https://www.synapse.org/Synapse:syn73617068
- id: distribution_format_health_data_nexus
  name: health_data_nexus_historical
  description: An earlier version of the feature-only dataset is available on HealthDataNexus, a data
    publishing platform maintained by the Temerty Centre for Artificial Intelligence Research and Education
    in Medicine (T-CAIREM) at the University of Toronto, which provides cloud compute alongside the dataset
    rather than allowing data downloads. The healthsheet published with the dataset describes this platform
    as the distribution route, providing publicly accessible metadata with a DOI for persistent resolution
    while the dataset itself requires registered access. Version 1.0 on HealthDataNexus carries DOI 10.57764/qb6h-em84.
  access_urls:
  - https://healthdatanexus.ai/
distribution_dates:
- id: distribution_dates_record
  name: release_dates
  release_dates:
  - 'Adult v1.1: 2025-01-17'
  - 'Adult v2.0.0: 2025-04-16'
  - 'Adult v2.0.1: 2025-08-18'
  - 'Adult v3.0.0: 2025-12-16'
  - 'Adult v3.1.0: 2026-05-01'
  - 'Pediatric v1.0.0: 2025-12-17'
  - 'Pediatric v1.1.0: 2026-05-01'
  - The healthsheet records that the data was published and made available at the end of November 2024,
    referring to the earlier HealthDataNexus release.
maintainers:
- id: maintainer_bridge2ai_voice
  name: Bridge2AI-Voice project team
  role: academic_institution
  description: Curatorial and governance responsibility for the dataset.
  maintainer_details:
  - The dataset is supported by the NIH via the Bridge2AI project. Releases are coordinated by the Bridge2AI-Voice
    project team.
  - The curator of the data may be contacted through the project contact address; the upstream RO-Crate
    for release 3.0.0 lists https://b2ai-voice.org/contact-us/ as the contact point, and the access committee
    is reachable at DACO@b2ai-voice.org.
  - The upstream RO-Crate for release 3.0.0 names Satrajit Ghosh as the data governance committee.
- id: maintainer_physionet
  name: PhysioNet and the MIT Laboratory for Computational Physiology
  role: academic_institution
  description: Platform hosting and technical maintenance for the current releases.
  maintainer_details:
  - PhysioNet is the publisher of the adult and pediatric datasets and is maintained by the MIT Laboratory
    for Computational Physiology, supported by NIBIB, NHLBI and the NIH Office of the Director under NIH
    grant numbers U24EB037545 and R01EB030362.
  - Releases are coordinated jointly by the Bridge2AI-Voice project team and the MIT Laboratory for Computational
    Physiology.
- id: maintainer_health_data_nexus
  name: Health Data Nexus (T-CAIREM, University of Toronto)
  role: academic_institution
  description: Platform that hosted the earlier feature-only release.
  maintainer_details:
  - The healthsheet records that the dataset is hosted by the Health Data Nexus, a data publishing platform
    maintained by the Temerty Centre for Artificial Intelligence Research and Education in Medicine (T-CAIREM)
    based at the University of Toronto, which maintains the technical infrastructure hosting the dataset
    and provides continued access to interested researchers. This describes the earlier v1.0 distribution
    route.
errata:
- id: erratum_changelog
  name: erratum_and_changelog
  erratum_details:
  - There is no erratum. A changelog for each dataset version is published online with the dataset metadata.
  - 'Release notes serve this function: v3.1.0 fixed broken Parquet files from the previous release, added
    audio quality metrics and per-audio metadata, updated validated diagnosis information across conditions
    with back-filled information, rearranged some phenotype files and renamed certain gold-standard variables.
    v2.0.1 corrected the authorship list. v2.0 reprocessed spectrograms to fix minor issues identified
    in the previous release and removed all spectrograms and MFCCs derived from free-speech files.'
updates:
  id: update_plan_record
  name: update_plan
  frequency: Semi-annual (twice a year)
  description: Planned update cadence and communication channels.
  update_details:
  - Yes, further versions of the dataset will be released on a semi-annual basis. These updates will be
    distributed as new versions of the dataset on the publishing platform. Users will be notified through
    news items on the platform as well as through standard communication channels.
  - Dataset releases follow a static versioning scheme managed through PhysioNet and related platforms,
    with version numbers and associated DOIs for each snapshot and for the latest version.
  - Release notes document added participants, new feature sets, reorganized phenotype tables and corrections
    such as spectrogram reprocessing and authorship updates.
  - Future updates are planned as additional participants are enrolled and Spanish-language protocols
    are incorporated; older versions remain accessible for reproducibility while users are encouraged
    to adopt the latest version.
  - The dataset is released as static versions rather than being dynamically updated.
  - The public data releases do not contain an equal distribution of the disease categories; further releases
    will contain additional data.
retention_limit:
  id: retention_limits_record
  name: retention_limits
  retention_period: Indefinite for the released research data.
  description: Retention rules for released data and for identifiable source data.
  retention_details:
  - Once data is contributed, the data will be retained as long as it is useful for research purposes,
    possibly indefinitely.
  - Identifiable data and datasheets linking participant numbers to participant information are kept at
    each institution on local cloud storage for a maximum of ten years after study completion and are
    then destroyed; this is the responsibility of each local principal investigator.
  - The USF IRB requires de-identified study data and original consent forms to be stored for a minimum
    of five years after completion of the study.
  - Under the Data Transfer and Use Agreement, recipients must destroy the data two years after the start
    date, on completion of the project, on termination, or on expiration of the applicable ethics approval,
    whichever occurs first, and certify destruction in writing within thirty days.
version_access:
  id: version_access_record
  name: version_access
  description: Availability and identification of dataset versions.
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - 1.1 (2025-01-17), DOI 10.13026/249v-w155
  - 2.0.0 (2025-04-16)
  - 2.0.1 (2025-08-18)
  - 3.0.0 (2025-12-16), DOI 10.13026/k81f-qr68
  - 3.1.0 (2026-05-01), DOI 10.13026/8xbn-nq66
  - Pediatric 1.0.0 (2025-12-17)
  - Pediatric 1.1.0 (2026-05-01), DOI 10.13026/h995-bt35, latest-version DOI 10.13026/mf9s-5r03
  - Health Data Nexus 1.0, DOI 10.57764/qb6h-em84
  version_details:
  - By default, older versions of the dataset will continue to be supported, hosted and made available
    to researchers. Each version of the dataset has a unique DOI. The dataset publishers reserve the right
    to remove access to older versions.
  - v3.1.0 is a minor update over v3.0.0 with no new participants, but with some additional data released
    for certain participants.
  - v3.0.0 was a major update with new data for an additional 391 participants, separating the single
    phenotype data file into individual files, adding sparc and ppgs features, and reorganizing the file
    layout.
  - v2.0 provided data for an additional 136 new participants.
  - v1.1 added Mel-frequency cepstral coefficients; v1.0 was the first release of the dataset.
  - v1.0 of the feature-only dataset released on Health Data Nexus reported 12,523 recordings for 306
    participants collected across five sites in North America.
extension_mechanism:
  id: extension_mechanism_record
  name: extension_mechanism
  description: How third parties may extend or contribute to the dataset.
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
  - For dataset extensions and augmentations, it is possible for others to publish a derivative dataset
    on the hosting platform which references the original source. These derivative datasets may be made
    available under the same conditions as the source data.
  - For augmentations to the code used to produce the data, the open-source repositories have discussion
    forums and issue pages that allow public discussion of data preprocessing, and a pull request mechanism
    for contributing improvements to the preprocessing code.
ethical_reviews:
- id: ethical_review_usf_irb
  name: usf_institutional_review_board
  description: Primary human subjects review for the adult data collection.
  reviewing_organization: organization_usf_irb
  review_details:
  - Data collection and sharing was approved by the University of South Florida Institutional Review Board.
  - The study was submitted to and approved by the USF Single IRB, with subsite IRBs approved through
    the Single IRB process. All US-based institutions abide by the single IRB process.
  - The IRB protocol is titled "Bridge2AI Voice Data Acquisition", with principal investigator Yael Bensoussan;
    version 1 is dated 17 January 2023, and the revision history runs to version 13, dated 11 July 2025,
    covering additions such as the pediatric cohort under single IRB, participant compensation, electronic
    and remote consent, control-cohort collection, remote enrollment and data collection apps, and Spanish-language
    data collection.
  - The upstream RO-Crate for release 3.0.0 records the IRB as the University of South Florida Institutional
    Review Board at 3702 Spectrum Blvd., Suite 165 Usf, Tampa, FL 33620, US, with contact email RSCH-IRB@usf.edu
    and telephone (813) 974-5638, and leaves the IRB protocol identifier field empty.
  - The feasibility study of the collection application was approved by the Institutional Review Board
    of the University of South Florida under IRB number 004890.
  - No data monitoring committee was appointed for this study. The study is not for a drug product and
    not for a medical device.
- id: ethical_review_canadian_rebs
  name: canadian_research_ethics_boards
  description: Separate review for the Canadian participating institutions.
  review_details:
  - Canadian institutions - Mount Sinai Hospital, the Hospital for Sick Children and the University of
    Toronto - do not follow the single IRB process and apply for a separate research ethics board approval
    to comply with Canadian regulations. A copy of the approved Canadian REB is submitted with their application
    to the USF IRB.
  - Genomic data are collected and analysed only at the University of Toronto and Mount Sinai Hospital
    under a separate protocol and REB approval, a copy of which is submitted to the USF IRB once approved.
  - Data collection and sharing for the pediatric dataset was approved by the Research Ethics Board at
    the Hospital for Sick Children.
- id: ethical_review_bioethics_oversight
  name: consortium_bioethics_review
  description: Bioethics review recorded by the upstream RO-Crate for release 3.0.0.
  contact_person: person_vardit_ravitsky
  reviewing_organization: organization_hastings_center
  review_details:
  - The upstream RO-Crate for release 3.0.0 records the ethical review as "Ethical Review by Vardit Ravitsky
    at the Hastings Center for Bioethics".
  - The same crate names Satrajit Ghosh as the dataset's data governance committee.
  - The consortium published a memorandum setting out the ethical justification for controlled access
    to raw voice data samples, available for download from the project documentation.
data_protection_impacts:
- id: data_protection_impact_assessment
  name: data_subject_impact_analysis
  impact_details:
  - Asked whether an analysis of the potential impact of the dataset and its use on data subjects has
    been conducted, the dataset documentation answers "No".
  - 'The consortium nonetheless documents the risks it recognizes: privacy loss, misuse of voice biometrics,
    and algorithmic harms such as discrimination in hiring, insurance or surveillance contexts. These
    risks motivate a governance framework with IRB oversight, rigorous de-identification, separation of
    feature-only and raw-audio tiers, and usage restrictions encoded in the registered-access license
    and data use agreement.'
  - The IRB protocol records that even after removing all HIPAA-protected information, each person's voice
    is unique to them, so it is always possible, even if unlikely, that someone could recognize a participant's
    voice; voice can never be fully de-identified.
human_subject_research:
  id: human_subject_research_record
  name: human_subject_research
  involves_human_subjects: true
  irb_approval:
  - University of South Florida Institutional Review Board, single IRB of record for US sites.
  - Separate Canadian research ethics board approvals for Mount Sinai Hospital, the Hospital for Sick
    Children and the University of Toronto.
  - Research Ethics Board at the Hospital for Sick Children for the pediatric dataset.
  - The upstream RO-Crate for release 3.0.0 records humanSubjects "Yes", humanSubjectResearch "Yes" and
    humanSubjectExemption "No".
  ethics_review_board:
  - University of South Florida Institutional Review Board
  - Research Ethics Board, Hospital for Sick Children
  special_populations:
  - Pediatric participants are enrolled only through the pediatric sites and not at USF; checklist HRP-416
    for children under 21 was completed and appended to the protocol.
  - The protocol does not specifically include or exclude students, employees or wards of the state, and
    has a specific plan to enroll participants from socially and economically disadvantaged and underserved
    populations through the Plan for Enhancing Diverse Perspectives.
  regulatory_compliance:
  - HIPAA - collection applications are HIPAA-compliant, data are stored behind a HIPAA firewall in REDCap
    and on HIPAA-compliant cloud servers provided by NIH STRIDES partners, and HIPAA de-identification
    rules are applied to the released data.
  - A partial HIPAA waiver was requested for recruitment purposes to allow the study team to review EHR
    information for incoming clinic patients ahead of their appointments, limited to the study's inclusion
    criteria.
  - The data are covered by a Certificate of Confidentiality.
  - The upstream RO-Crate for release 3.0.0 records fdaRegulated as false.
informed_consent:
- id: informed_consent_record
  name: informed_consent
  consent_obtained: true
  consent_type:
  - Prospective written informed consent
  - Electronic consent within the app or through REDCap surveys
  - Video-recorded consent within the app
  - Verbal consent under a waiver of written documentation
  - Parental permission with child assent for pediatric participants
  consent_documentation:
  - All participants provided written informed consent for all study procedures in the feasibility study,
    and the main protocol requires an informed consent process for every participant.
  - Paper consent documents are uploaded and saved electronically in REDCap; all paper and electronic
    versions of consent are stored for a minimum of five years after study completion.
  - The USF IRB requires de-identified study data and original consent forms to be stored for a minimum
    of five years after completion of the study, and original paper consent documents cannot be destroyed
    until five years after study completion even if uploaded into the Florence platform.
  withdrawal_mechanism:
  - Participants may withdraw at any point; data provided before completion of voice data collection is
    excluded, while data from completed collections is retained.
  consent_scope:
  - Consent covers collection of voice, speech and respiratory data plus linked demographic and clinical
    data, sharing of de-identified data through an open-source database, and access to medical information
    through EHR platforms for gold-standard validation of diagnoses.
  - Within the consent process, individuals are asked whether they agree to be contacted in the future
    for further voice data collection; contact details for those who agree are stored within the institutional
    database only and are not shared with other centres or uploaded to the cloud.
at_risk_populations:
  id: at_risk_populations_record
  name: at_risk_populations
  at_risk_groups_included: true
  special_protections:
  - Pediatric patients are enrolled only through the pediatric participating institutions and not at USF;
    checklist HRP-416 for children under 21 was completed and appended to the protocol.
  - Participants with mood and psychiatric disorders are asked questions that can cause discomfort or
    trigger negative emotions; the protocol identifies this as the principal non-privacy risk.
  - Recruitment includes Community Outreach Clinics, defined as clinics whose main mission is to provide
    health services to underserved and under-represented populations.
  assent_procedures:
  - Children provide verbal assent where appropriate, and assent is documented. Where young children cannot
    reasonably be asked to assent because of limitations in understanding due to age and development,
    they are not asked to do so; this typically holds for children under seven years of age.
  guardian_consent:
  - When children participate, parents or guardians provide consent. Parental permission is obtained from
    one or both parents; the research is minimal risk and does not require permission from both parents
    or legal guardians.
  - For the pediatric dataset, parental or participant consent was obtained prior to data collection and
    data sharing, and for participants without adequate comprehension or familiarity with their own medical
    history, parents or decision-makers completed the survey on a separate tablet during the recording.
license_and_use_terms:
  id: license_and_use_terms_record
  name: license_and_use_terms
  description: Files are released under the Bridge2AI Voice Registered Access License, with access governed
    by the Bridge2AI Voice Registered Access Agreement. No training is required for credentialed access.
    The upstream RO-Crate for release 3.0.0 records the license as https://physionet.org/content/b2ai-voice/view-license/3.0.0/
    and the conditions of access as https://physionet.org/content/b2ai-voice/view-dua/3.0.0/, together
    with the copyright notice "Copyright (c) 2026 University of South Florida all rights reserved". There
    are no fees associated with these restrictions.
  contact_person: person_daco
  license_terms:
  - 'Registered access for the feature-only data: register on PhysioNet, confirm your identity under the
    Registered Access License, and sign the Bridge2AI-Voice Registered Access Agreement, which sets out
    the terms and conditions for data use. Only credentialed users who sign the data use agreement can
    access the files.'
  - 'Controlled access for raw audio: complete the Data Access Request Form and the Data Use Agreement,
    submit the application to the Data Access Compliance Office for review, and on approval ensure that
    a Data Use and Transfer Agreement is signed by an authorized official at your institution.'
  - The dataset is intended solely for commercial and non-commercial research purposes by Authorized Researchers,
    reflecting the consortium's commitment to advancing ethical and trustworthy research practices that
    respect and protect the rights and interests of research participants.
  - The Data Transfer and Use Agreement runs for two years from the start date, or until completion of
    the project, expiration of the applicable ethics approval, or termination by the provider institution,
    whichever occurs first. The provider institution is the University of South Florida Board of Trustees.
    On expiration or termination, data must be destroyed in accordance with the provider's instructions
    and the recipient must submit written certification of destruction within thirty days, retaining at
    most one copy as required for records retention, research integrity and verification.
  - Recipients must establish appropriate administrative, technical and physical safeguards to prevent
    unauthorized use or access, must bind authorized persons to equivalent standards of confidentiality
    and security, must use the data in compliance with all applicable laws and professional standards,
    and must notify the provider of any unauthorized use or disclosure no later than five business days
    after discovery.
  - Recipients are encouraged to make the results of their project publicly available in open-access journals
    or preprint servers where possible, and must recognize the provider as the source of the data in all
    written, visual or oral public disclosures.
  - Data delivered under the agreement is provided "as is" with no representations or warranties; the
    recipient assumes all liability for damages arising from its use, storage, disclosure or disposal
    of the data, and no indemnification is provided by either party.
  - Recipients further agree to adhere to the specific requirements of PhysioNet.org, managed by the MIT
    Laboratory for Computational Physiology.
  data_use_permission:
  - general_research_use
  - health_medical_biomedical_research
  - user_specific
ip_restrictions:
  id: ip_restrictions_record
  name: intellectual_property_restrictions
  description: Intellectual property terms are set out in the registered access agreement and are repeated
    in the dataset documentation for informational purposes.
  restrictions:
  - Users understand and acknowledge that the data may be protected by copyright and other rights, including
    other intellectual property rights.
  - Duplication, as reasonably required to carry out the user's research project with the data, is permitted.
    Sale of all or part of the data on any media is not permitted.
  - Nothing in the agreement operates to transfer any intellectual property rights in or relating to the
    data to the user, and users agree not to make intellectual property claims on the data.
  - Users agree not to use intellectual property protection in ways that would prevent or block access
    to, or use of, any element of the data, or conclusions drawn directly from the data.
  - Users may elect to perform further research that adds intellectual and resource capital to the data
    and to obtain intellectual property rights on those downstream discoveries, but agree to implement
    licensing policies that will not obstruct further research and to respect the Fort Lauderdale Agreement.
  - No IP-based restrictions have been imposed by third parties on the data associated with the instances.
  - The data provider provides no guarantees that the data is free of third-party intellectual property
    rights, database rights or other related rights.
regulatory_restrictions:
  id: regulatory_restrictions_record
  name: regulatory_and_compliance_restrictions
  description: Regulatory posture of the released dataset, drawn from the dataset documentation, the Data
    Transfer and Use Agreement and the upstream RO-Crate for release 3.0.0.
  governance_committee_contact: person_satrajit_ghosh
  hipaa_compliant: compliant
  confidentiality_level: restricted
  regulatory_restrictions:
  - No export controls apply to the dataset.
  - The data are covered by a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas for identifying information or characteristics of
    a research participant.
  - The data are classified as Personally Identifiable Information as defined in OMB Memorandum M-07-16
    and are not covered under HIPAA, FERPA or similar laws requiring additional special terms beyond those
    in the agreement.
  - The provider may unilaterally amend the agreement should the federal sponsor require revision; if
    the recipient objects, the agreement terminates immediately and all data must be returned or destroyed.
  - The upstream RO-Crate for release 3.0.0 records the dataset as not FDA regulated, as de-identified,
    and as a limited dataset available with a data use agreement.
  other_compliance:
  - HIPAA de-identification rules are applied to the released dataset; direct identifiers are removed,
    dates are rebased or replaced by integers, geographic information is removed or generalized, and narrative
    text fields are removed. K-anonymization with k greater than or equal to 2 is not achieved.
  - 'Collection infrastructure is HIPAA-compliant: both collection apps are HIPAA-compliant and store
    data only during the collection phase, and data are transmitted over secure HTTPS to HIPAA-compliant
    storage hosted by NIH STRIDES partners.'
  - Recipient institutions must confirm that relevant institutional policies and applicable federal, state
    or local laws have been followed, including completion of any required IRB review or approval prior
    to use of the data.
is_deidentified:
  id: deidentification_record
  name: deidentification
  identifiable_elements_present: false
  method: 'HIPAA Safe Harbor de-identification combined with removal of high-risk indirect identifiers,
    removal of all raw audio, and removal of features derived from free-speech prompts. The level of de-identification
    is stated as: identifiable information under HIPAA and the Common Rule, as well as data considered
    sensitive, have been removed from this dataset. The upstream RO-Crate for release 3.0.0 records the
    dataset as deidentified.'
  identifiers_removed:
  - Names
  - Civic addresses
  - Social Security numbers
  - Geographic locators, including state and province; country of collection is retained
  - Date information at a resolution finer than years
  - Phone and fax numbers
  - Email addresses and IP addresses
  - Medical record numbers and health plan beneficiary numbers
  - Device identifiers, licence numbers, account numbers and vehicle identifiers
  - Website URLs
  - Full face photographs
  - Biometric identifiers, including all raw voice recordings
  - Narrative text fields and free-speech transcripts
  - Selected demographic identifiers and information about household composition, cultural identity, household
    income, mental health status and traumatic life experiences
  deidentification_details:
  - Does this dataset remove direct identifiers? Yes.
  - Does this dataset apply the HIPAA de-identification rules? Yes.
  - Does this dataset rebase and/or replace dates by integers? Yes.
  - Does this dataset remove or generalize geographic information? Yes.
  - Does this dataset remove narrative text fields? Yes.
  - Does this dataset achieve K-anonymization (k>=2)? No.
  - This dataset has been de-identified through removal of all audio data and certain sensitive fields
    identified by a team of ethicists.
  - Raw audio transcripts were reviewed and any audio recordings containing potentially identifying information
    or external voices were removed from the release.
external_resources:
- id: external_resource_supporting_code_and_protocols
  name: supporting_code_and_protocols
  description: Supporting repositories, protocol instruments and documentation referenced by the dataset.
    The healthsheet published with the dataset states that the released data themselves are self-contained.
  external_resources:
  - https://github.com/sensein/b2aiprep
  - https://github.com/sensein/senselab
  - https://github.com/eipm/bridge2ai-redcap
  - https://github.com/eipm/bridge2ai-docs
  - https://docs.b2ai-voice.org/
  - https://zenodo.org/records/14989503
  - https://zenodo.org/doi/10.5281/zenodo.13834653
  future_guarantees:
  - The healthsheet answers "NA" to whether guarantees exist that external resources will remain constant
    over time, and "NA" to whether official archival versions of the complete dataset including external
    resources exist. It states that the dataset itself is self-contained.
  restrictions:
  - The b2aiprep library is distributed under the Apache-2.0 license.
  - The REDCap data dictionary and metadata repository is distributed under the MIT license.
