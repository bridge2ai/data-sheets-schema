  name: b2ai_voice_physionet_release_3_0_0
  title: Bridge2AI-Voice v3.0.0 PhysioNet release
  description: Superseded PhysioNet release of the adult flagship dataset, published 2025-12-16. This
    is the release described by the upstream Bridge2AI-Voice RO-Crate (ark:59853/rocrate-b2ai-voice-3.0.0,
    crate version 3.0.0, crate date published 12/16/2025). It contains data for 833 participants across
    five sites in North America and was a major update over v2.0.1 that added data for a further 391 participants,
    split the single phenotype file into individual thematic files, added Speech Articulatory Coding (sparc)
    features and phonetic posteriorgrams, and reorganized the file layout. All packaging facts recorded
    on this resource - total content size, per-file checksums, ARK identifiers, Merkle root hash, license
    and data use agreement URLs, and the copyright notice - are crate-derived and are scoped to release
    3.0.0 rather than to the current 3.1.0 release.
