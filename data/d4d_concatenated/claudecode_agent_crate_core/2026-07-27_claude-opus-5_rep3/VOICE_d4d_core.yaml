id: https://doi.org/10.13026/8xbn-nq66
name: bridge2ai_voice_dataset
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'The Bridge2AI-Voice (B2AI-Voice) dataset is a large, ethically sourced, demographically
  diverse voice dataset linked to health information, generated by the Bridge2AI-Voice consortium under
  the NIH Common Fund Bridge2AI program. The flagship adult dataset is published on PhysioNet; the current
  release, v3.1.0 (published 2026-05-01), contains data for 833 adult participants collected across five
  sites in North America. Participants were selected on the basis of conditions known to manifest in the
  voice waveform, spanning voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders and respiratory disorders, together with control participants without those conditions. The
  public release is a feature-only, low-risk derivation of the underlying audio: spectrograms, mel spectrograms,
  MFCCs, articulatory and prosodic features, pitch, loudness, periodicity and phonetic posteriorgrams,
  stored as Parquet tensors, plus tab-delimited phenotype tables covering demographics, confounders, disease-specific
  diagnosis forms, enrollment, validated questionnaires and per-task recording metadata. The original
  voice recordings are not distributed through PhysioNet; raw audio is released separately under a controlled-access
  mechanism via Synapse. A separate Bridge2AI-Voice Pediatric Dataset covering a distinct cohort of 300
  participants aged 2-18 is published as its own PhysioNet project.'
