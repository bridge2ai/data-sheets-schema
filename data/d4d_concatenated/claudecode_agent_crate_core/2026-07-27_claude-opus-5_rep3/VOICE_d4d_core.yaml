- id: https://www.synapse.org/Synapse:syn72370534/
  name: b2ai_voice_adult_raw_audio
  title: Bridge2AI-Voice adult raw audio (controlled access)
  description: The original raw audio waveforms recorded from adult participants. These are deliberately
    excluded from the PhysioNet feature-only release because voice is itself a biometric identifier. Raw
    audio is disseminated only through a controlled-access mechanism requiring institutional sign-off,
    and is made available via Synapse (syn72370534). Requests are directed to the Bridge2AI-Voice access
    committee at DACO@b2ai-voice.org. The change of distribution route for adult raw audio to Synapse
    was announced on 2026-03-09.
  status: controlled access
  download_url: https://www.synapse.org/Synapse:syn72370534/
  page: https://physionet.org/content/b2ai-voice/3.1.0/
- id: https://doi.org/10.13026/h995-bt35
  name: b2ai_voice_pediatric_dataset
  title: Bridge2AI-Voice Pediatric Dataset v1.1.0
  description: A companion Bridge2AI-Voice dataset covering a distinct pediatric cohort. It is a separate
    PhysioNet project (b2ai-voice-pediatric), not a version of the adult b2ai-voice dataset, and was collected
    under a separate age-appropriate protocol. Version 1.1.0 was published on 2026-05-01 and contains
    derived audio features for 23,533 recordings from 300 participants aged 2 to 18. Participants were
    patients and healthy volunteers at the Hospital for Sick Children (SickKids) in Toronto, eligible
    if aged 2-18 with English proficiency, and excluded if over 18 or non-verbal; non-patients were recruited
    through research postings. Data collection used the reproschema-ui software on tablets, with a headset
    used for most participants and the built-in tablet microphone for the remainder. All participants
    completed recording and demographic collection in a single session; where a participant could not
    report their own medical history, a parent or decision-maker completed the survey on a separate tablet.
    Data collection and sharing were approved by the Research Ethics Board at the Hospital for Sick Children.
    Access is credentialed, under the Bridge2AI Voice Registered Access License and Registered Access
    Agreement, with raw pediatric audio distributed separately via Synapse (syn73617068). Version 1.0.0
    was published 2025-12-17; v1.1.0 added no new participants but released audio features for all free-speech
    tasks after manual checks for unconsented speakers and personally identifying information, plus new
    audio-quality metrics and per-recording metadata.
  version: 1.1.0
  doi: 10.13026/h995-bt35
  issued: '2026-05-01T00:00:00Z'
  page: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
  publisher: https://physionet.org/
