distributions:
- id: distribution_features
  name: features
  path: features/
  description: 'Derived audio features for the v3.1.0 adult release. Dense binary features are distributed
    as Parquet, an open-source column-oriented file format: ppgs.parquet (n=29289), sparc_ema.parquet
    (n=28640), sparc_loudness.parquet (n=31855), sparc_periodicity.parquet (n=31872), sparc_pitch.parquet
    (n=31872), torchaudio_spectrogram.parquet (n=29278), torchaudio_mfcc.parquet (n=29278), torchaudio_pitch.parquet
    (n=32522) and torchaudio_mel_spectrogram.parquet (n=29278). Every element carries participant_id,
    session_id, task_name, n_frames and the feature tensor. The folder also contains two plain-text files,
    audio_quality_metrics.tsv and static_features.tsv, each with one row per audio recording. Every file
    has a companion JSON data dictionary with the same file stem. The folder holds 11 files in total.'
- id: distribution_phenotype
  name: phenotype
  path: phenotype/
  format: TSV
  media_type: text/tab-separated-values
  description: Tab-delimited phenotype tables organized into confounders, demographics, diagnosis, enrollment,
    questionnaire and task subfolders. Diagnosis tables cover airway stenosis, amyotrophic lateral sclerosis,
    anxiety, benign lesions, bipolar disorder, cognitive impairment, control, COPD and asthma, depression,
    glottic insufficiency, laryngeal cancer, laryngeal dystonia, laryngitis, muscle tension dysphonia,
    Parkinson's disease, precancerous lesions, unexplained chronic cough and unilateral vocal fold paralysis.
    Questionnaire tables cover ADHD adult, custom affect scale, DSM-5 adult, dyspnea index, GAD-7 anxiety,
    Leicester cough questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric history, PTSD adult,
    VHI-10 and voice perception. Task tables cover acoustic task, Harvard sentences, random item generation,
    recording, session, Stroop and Winograd. Each TSV has a companion JSON data dictionary whose keys
    match the column names and whose values give a one-sentence description, the question asked of the
    participant where applicable, and the response data type. A row appears for a participant only when
    at least one column is non-missing, and participants with repeated visits may have more than one row.
- id: distribution_metadata
  name: metadata
  path: metadata/
  description: Per-recording metadata released as a Parquet binary file with a corresponding data dictionary,
    covering task instructions and prompts and information about the microphone used and its gain.
purposes:
- id: purpose_voice_as_biomarker
  name: voice_as_a_biomarker_of_health
  description: Primary motivation for creating the dataset.
  response: The Bridge2AI-Voice dataset was created to enable the integration of voice as a biomarker
    of health into clinical care. The consortium's stated aim is to generate a large, multi-institutional,
    ethically sourced and diverse voice database linked to multimodal health biomarkers, in order to fuel
    voice AI research and to support predictive models that assist in screening, diagnosis and treatment
    of a broad range of diseases. The dataset is intended to enable the development, benchmarking or validation
    of clinically applicable machine-learning models for diagnosing health conditions from voice, including
    vocal pathologies and neurological, psychiatric, respiratory and pediatric voice disorders, and is
    structured to be Findable, Accessible, Interoperable and Reusable.
- id: purpose_ethically_sourced_infrastructure
  name: ethically_sourced_open_infrastructure
  description: Motivation relating to ethics, governance and open data infrastructure.
  response: A second purpose is to demonstrate that a voice dataset of this scale can be built ethically
    and shared responsibly. The consortium set out to define ethical and legal norms that safeguard participants'
    data while supporting data sharing, to develop new guidelines for consenting to voice data collection
    and reuse in the context of voice AI, and to create infrastructure for audiomics data storage and
    sharing within and across research institutions. Best ethical practices developed through ethical
    inquiry guided both the voice collection protocol and the dissemination practices, including the split
    between registered-access derived features and controlled-access raw audio.
- id: purpose_standards_and_workforce
  name: standards_interoperability_and_workforce
  description: Motivation relating to standards, interoperability and training.
  response: The project also aims to introduce and standardize the field of acoustic biomarkers - "audiomics"
    - by developing new standards for acoustic and voice data collection and analysis, creating bioinformatics
    standards for voice data to make datasets interoperable, building benchmarks of diversity metrics
    that minimize the risk of algorithmic bias, and formulating training pathways and a curriculum for
    scientists, engineers, bioethicists and clinicians entering voice AI research.
tasks:
- id: task_disease_classification
  name: disease_detection_and_classification
  description: Predefined machine-learning tasks shipped with the dataset.
  response: The current version of the dataset comes with predefined tasks and labeling. The tasks are
    primarily designed for training machine-learning models for disease detection and classification using
    voice data. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders. There are no predefined recommended data splits
    for training, validation or testing; researchers are encouraged to create their own splits based on
    their specific requirements.
- id: task_acoustic_protocol
  name: acoustic_task_protocol
  description: The acoustic elicitation tasks performed by participants during collection.
  response: A total of 22 acoustic tasks are recorded through the adult app, grouped as non-voice or non-speech
    tasks (respiration, voluntary cough, breath sounds), voice but non-speech tasks (prolonged vowel /e/,
    maximum phonation time, glides from lowest to highest /e/, loudness "Hey", diadochokinesis /pa/ta/ka/
    and "buttercup") and speech tasks (Rainbow Passage, Caterpillar Passage, CAPE-V sentences, free speech,
    picture description, story recall, animal fluency, open response questions, word-colour Stroop, productive
    vocabulary, random item generation and the Cinderella story). Tasks are assigned by protocol part
    and by disease cohort. The pediatric protocol uses a separate age-appropriate task set delivered through
    reproschema-ui, including ABCs, months, counting, naming animals and foods, identifying and describing
    pictures, repeating words and sentences, role naming, long sounds, noisy sounds and silly sounds.
- id: task_questionnaire_instruments
  name: validated_questionnaire_instruments
  description: Validated questionnaires and patient-reported outcomes integrated into the protocol.
  response: Validated instruments integrated into the collection app and mapped to disease cohorts include
    the Voice Handicap Index-10 (VHI-10), Patient Health Questionnaire-9 (PHQ-9), General Anxiety Disorder-7
    (GAD-7), Positive and Negative Affect Schedule (PANAS), a custom affect scale, the PTSD Adult and
    ADHD Adult questionnaires, DSM-5 Adult, the Dyspnea Index, the Leicester Cough Questionnaire, the
    Winograd questionnaire and the Montreal Cognitive Assessment. Pediatric instruments include the Children's
    Voice Handicap Index-10 (C-VHI-10), the Pediatric Voice Outcomes Survey (PVOS), Pediatric Voice-Related
    Quality-of-Life (PVRQOL) and the Patient Health Questionnaire modified for Adolescents (PHQ-A).
addressing_gaps:
- id: addressing_gap_small_datasets
  name: small_and_non_standardized_prior_datasets
  description: The evidence gap the dataset is intended to close.
  response: Previous studies of machine-learning-based voice diagnosis produced promising results, but
    their sample sizes were too small or they lacked the key metadata needed to train robust, clinically
    useful models. Reviews of machine learning applied to laryngeal cancer screening found that most studies
    reported training datasets of fewer than 300 patients and that only two studies used more than one
    data modality. Comparing studies and pooling data is challenging because of a lack of standards in
    how voice and speech data are collected. The dataset aims to bridge this gap by providing an ethically
    sourced, large and diverse resource with linked clinical metadata for developing, benchmarking or
    validating clinically applicable AI/ML models.
- id: addressing_gap_private_industry_data
  name: inaccessible_industry_datasets
  description: Gap arising from the concentration of voice data in the private sector.
  response: Industry has access to vast amounts of voice data from users but lacks accurate clinical data
    or demographic information, which limits the ability to annotate data for AI training, to compare
    algorithmic outputs against criterion-standard medical assessment, and to audit training datasets
    externally for fair representation of diverse populations. Making an openly documented, clinically
    validated dataset available to the research community is intended to remove that dependence on private-sector
    holdings.
- id: addressing_gap_pediatric_norms
  name: absence_of_pediatric_reference_data
  description: Gap specific to the pediatric cohort.
  response: Pediatric and adult voice and speech production are fundamentally different because the respiratory
    system and larynx undergo rapid maturation throughout childhood, so adult normative data cannot be
    generalized to children. Despite the clinical importance of early detection of pediatric communication
    disorders such as autism spectrum disorder and speech delay, large-scale pediatric voice datasets
    remain scarce because of privacy issues, consent processes and the need for developmentally appropriate
    tasks. The companion pediatric dataset is intended to enable study of developmental norms and AI-driven
    early screening tools.
