conforms_to_schema: >-
  OMOP Common Data Model (structured EHR), OHNLP open-source schema (tokenized clinical notes),
  DICOM (imaging), WFDB / extended PhysioNet schema (waveform telemetry), and EDF+ and Persyst
  open-source schemas (EEG). The RO-Crate metadata additionally conforms to the Croissant
  Responsible AI (rai:) specification.
was_derived_from: >-
  Routine clinical care data repurposed from hospital electronic health record systems, PACS
  imaging archives, bedside monitor/gateway-middleware telemetry streams, and hospital EEG
  databases at the CHoRUS data-acquisition sites; not collected through prospective research
  interactions with patients.
