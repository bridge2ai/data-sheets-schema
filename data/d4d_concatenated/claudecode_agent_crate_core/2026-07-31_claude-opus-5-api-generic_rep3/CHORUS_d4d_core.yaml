instances:
  - description: >-
      Instances are hospital patient admissions (encounters) of critically ill patients, each
      associated with multimodal records: structured EHR data standardized to OMOP, tokenized
      clinical note text, imaging, waveform telemetry and EEG where available. The project
      abstract describes acquiring an AI-ready data set from more than 100,000 critically ill
      patients.
  - description: >-
      Project website snapshot of the "Current Released Dataset": 50,000 patient admissions from
      ICU, PICU and NICU, comprising 1.6 billion rows of EHR OMOP data, 7,642 admissions with
      radiology data and 23 Tb of waveform data. These website figures describe a different scope
      from the version 1.0 Beta RO-Crate release described elsewhere in this record.
  - description: >-
      The Cohort 2 training webinar reports that, as of August 2025, the CHoRUS dataset covered 14
      different hospitals with over 45,000 unique admissions, with 1,000 images currently available
      and de-identification in process for a larger imaging cohort, and EEG extraction in process.
      These admission counts differ from the counts published on the project website snapshot and
      are recorded here as stated by each source.
  - description: >-
      The RO-Crate for the version 1.0 Beta release states the release is interim and partial: not
      all patients in the CHoRUS full cohort are included and no DICOM images are included in this
      release.

