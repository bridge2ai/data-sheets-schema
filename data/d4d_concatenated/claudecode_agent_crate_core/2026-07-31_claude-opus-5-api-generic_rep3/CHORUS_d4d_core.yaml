purposes:
  - description: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning
      (AI/ML) in critical care by generating data for ML/AI applications aimed at characterizing
      acute and critical care illness, predicting complications, and measuring treatment response
      among patients with acute or critical illness.
  - description: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring that the
      methods promote privacy, accountability and clinical benefit, and while promoting a new
      generation of AI clinicians and scientists.
  - description: >-
      To provision a holdout test set, accessible for model external validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - description: >-
      To develop the most diverse, high-resolution, ethically sourced, AI-ready data set to answer
      the grand challenge of improving recovery from acute illness (CHoRUS Network goal), and to
      create best practices for AI in health as one of four data generation projects in the NIH
      Bridge2AI consortium.
  - description: >-
      To establish unified standards that harmonize multi-modal EHR, waveform, imaging and text
      data, and a visualization and annotation environment that labels data with targets important
      for prediction.

tasks:
  - description: >-
      Characterizing acute and critical care illness from multimodal, high-resolution hospital data.
  - description: >-
      Predicting complications and clinical deterioration among patients with acute or critical
      illness.
  - description: Measuring treatment response in acute and critical care populations.
  - description: >-
      External validation of AI/ML models against a sequestered holdout test set, to support
      marketplace adoption of models for acute and critical care.
  - description: >-
      Accounting for contextual factors and social determinants of health (for example geographic
      distance to the nearest hospital) in AI/ML model development.

addressing_gaps:
  - description: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center data sets is a critical
      first step towards actionable and trustworthy AI.
  - description: >-
      Existing resources lack an ethically sourced, AI-ready, multi-center dataset of the diversity
      and resolution required for acute and critical care AI; CHoRUS addresses this by acquiring
      and standardizing a dataset of unprecedented diversity and high resolution across a
      multi-center network.
  - description: >-
      The legal and regulatory landscape for clinical-care AI is incompletely analyzed; CHoRUS
      addresses this by establishing a legal framework for collecting data at scale and by
      performing community-facing ethics focus groups to determine what data is appropriate for
      public sharing.
  - description: >-
      Workforce and AI literacy gaps in the lay and scientific community are addressed through
      multimodal educational approaches and training of engineers, data scientists and clinicians.

