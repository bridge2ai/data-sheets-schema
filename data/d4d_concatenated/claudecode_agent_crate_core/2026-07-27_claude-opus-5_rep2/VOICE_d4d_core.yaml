instances:
- id: d4d:VOICE-instance-adult-participants
  name: Adult participants
  instance_type: person
  counts: 833
  label: true
  label_description: Each instance represents a person. Diagnostic labels are the result of a clinical
    assessment of the participant; labels include diagnostic categories such as vocal pathologies, neurological
    disorders, psychiatric conditions and respiratory disorders. The count of 833 participants is stated
    for adult releases v3.0.0 and v3.1.0; v3.1.0 added no new participants relative to v3.0.0. The initial
    v1.0 release provided 12,523 recordings for 306 participants.
  description: Adult participants in the flagship b2ai-voice cohort, collected across five sites in North
    America. Each participant may have more than one recording session, so phenotype tables may contain
    more than one row per participant and responses may vary across visits.
  sampling_strategies:
  - id: d4d:VOICE-sampling-adult-nonprobability
    name: Non-probability clinic-based sampling of adults
    description: Sampling design for the adult cohort.
    is_sample: true
    is_random: false
    is_representative: false
    source_data:
    - Adults presenting at High Volume Expert Clinics and academic specialty clinics (otolaryngology/laryngology,
      neurology, psychiatry and respiratory) within participating institutions, plus healthy volunteers
      recruited as controls.
    why_not_representative:
    - The data is not representative because it was collected at a limited number of geographic locations.
      The project hopes to make it more representative by shifting to remote collection and designing
      the recruiting approach in a way that controls for more variables.
    strategies:
    - Non-Probability Sample.
    - Participants are recruited across different academic institutions from High Volume Expert Clinics,
      defined as outpatient clinics within hospital systems or academic institutions with expertise in
      a specific disease area that see more than 50 patients per month from the same disease category.
    - Recruitment is by clinic appointment, recruitment flyers in well-trafficked areas, QR codes linking
      to a secure REDCap screening survey, waiting-room recruitment where approved, social media platforms
      (LinkedIn, X, Facebook, Instagram, YouTube, the Bridge2AI-Voice website and the Bridge2AI website)
      and the FlowTrials platform. Where specific diagnoses or severities are under-represented, participants
      are identified by medical record review based on voice-disorder related diagnostic codes.
  missing_information:
  - id: d4d:VOICE-missing-optional-questions
    name: Optional and cohort-specific questions
    description: Sources of item-level missingness at the participant level.
    missing:
    - Responses to optional questionnaire items.
    - Responses to questions outside a participant's primary diagnostic category, since each individual
      answered a common set of questions and then only the additional questions relevant to their primary
      diagnostic category.
    why_missing:
    - Some questions are optional.
    - There may be data collection irregularities that caused some information to be missing from individual
      instances.
- id: d4d:VOICE-instance-pediatric-participants
  name: Pediatric participants
  instance_type: person
  counts: 300
  label: true
  label_description: Pediatric participants aged 2 to 18 with demographic information, voice and speech
    related questionnaires and medical-history questionnaires. Where a participant lacked adequate comprehension
    or familiarity with their past medical history, a parent or decision-maker completed the survey.
  description: Participants in the separate Bridge2AI-Voice Pediatric Dataset v1.1.0, recruited at the
    Hospital for Sick Children. Eligibility required an age of 2 to 18 years and English proficiency;
    participants over 18 and individuals who were non-verbal were excluded. Non-patients were recruited
    through research postings and evaluated against the same criteria.
  sampling_strategies:
  - id: d4d:VOICE-sampling-pediatric-single-site
    name: Single-site pediatric recruitment
    description: Sampling design for the pediatric cohort.
    is_sample: true
    is_random: false
    source_data:
    - Patients and healthy volunteers at the Hospital for Sick Children; non-patients recruited through
      research postings.
    strategies:
    - Pediatric participants are recruited strictly from the Hospital for Sick Children (SickKids) and
      are grouped by age.
- id: d4d:VOICE-instance-adult-recordings
  name: Adult derived audio recordings
  instance_type: audio recording (feature-only derivation)
  label: false
  description: Derived representations of individual task recordings, keyed by participant identifier,
    session identifier and task name. In adult release v3.1.0 the per-feature record counts are 29,278
    for spectrograms, mel spectrograms and MFCCs, 32,522 for torchaudio pitch, 28,640 for SPARC EMA, 31,855
    for SPARC loudness, 31,872 for SPARC periodicity and SPARC pitch, and 29,289 for phonetic posteriorgrams.
    The corresponding v3.0.0 counts are 29,020, 32,236, 31,616, 31,616, 31,633 and 29,031 respectively.
    The project documentation summarizes version 3.0 as containing approximately 61,937 voice-derived
    recordings from 833 adult participants.
  missing_information:
  - id: d4d:VOICE-missing-removed-features
    name: Removed and uncomputable derived features
    description: Recording-level gaps in the feature tables.
    missing:
    - Spectrograms, mel spectrograms, MFC coefficients, phonetic posteriorgrams and EMAs for sensitive
      records and audio checks.
    - Certain features for some files.
    why_missing:
    - Sensitive records and audio checks were removed from the release; in v2.0 and later, all spectrograms
      and MFCCs derived from free-speech files were removed, and static and other features that do not
      encode the sensitive information were retained.
    - Some files, whether due to length or other issues, could not generate certain features and so are
      not included in the bundled data.
- id: d4d:VOICE-instance-pediatric-recordings
  name: Pediatric derived audio recordings
  instance_type: audio recording (feature-only derivation)
  counts: 23533
  label: false
  description: Bridge2AI-Voice Pediatric Dataset v1.1.0 contains derived audio features for 23,533 recordings
    collected from 300 participants aged 2 to 18. Per-feature record counts are 23,533 for spectrograms,
    mel spectrograms, MFCCs, torchaudio pitch and phonetic posteriorgrams and 23,532 for the SPARC EMA,
    loudness, periodicity and pitch features.
anomalies:
- id: d4d:VOICE-anomaly-collection-heterogeneity
  name: Site, protocol and device heterogeneity
  description: Known errors, sources of noise and redundancies.
  anomaly_details:
  - Different sites have different collection configurations.
  - The collection protocol changed over the course of the study.
  - Confounding factors that may be present in the data include noise artifacts, variations in diagnostic
    practices, inaccurate questionnaire responses and underreporting.
  - The data were recorded with a head-mounted headset with a microphone that could be at slightly different
    distances; distinct iPad devices were used at each site.
  - Participants may have repeated visits, so there may be more than one row per participant in the phenotype
    data files, and there is no requirement that a participant provide the same response at each visit;
    participant information for the same data element may therefore vary across a file.
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
- id: d4d:VOICE-anomaly-crate-naming-inconsistencies
  name: Naming inconsistencies in the v3.0.0 RO-Crate file inventory
  description: Metadata-level inconsistencies observed in the packaged provenance record rather than in
    the data itself.
  anomaly_details:
  - 'Two file entities in the v3.0.0 RO-Crate carry a display name that does not match their own content
    URL and schema: the sparc periodicity entity is named "sparc_loudness.parquet" and the torchaudio
    pitch entity is named "torchaudio_spectrogram.parquet".'
  - The task phenotype entity in the same crate is named "VOICE Questionnaire Tables", duplicating the
    name of the questionnaire entity.
  - The crate records the sparc_pitch.parquet publication date as 2025-08-18 while all other v3.0.0 artifacts
    are dated 2025-12-16, and dates throughout the crate are written in an ambiguous MM/DD/YYYY form.
  - The crate carries empty values for irbProtocolId and completeness, and gives every file the placeholder
    description "a datafile description" or "A Dataset description".
known_biases:
- id: d4d:VOICE-bias-sampling
  name: Sampling bias
  description: Recruitment-driven bias recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  bias_type: sampling_bias
  bias_description: Participants are recruited from specialty clinics and associated institutions using
    a non-probability sampling strategy, with inclusion focused on specific disease cohorts and fluent
    English speakers; this produces clinically enriched case mixes that may not represent general population
    distributions.
  mitigation_strategy: The consortium plans to shift toward remote collection and to design the recruiting
    approach so that more variables are controlled, and has a Plan for Enhancing Diverse Perspectives
    to enroll participants from socially and economically disadvantaged and underserved populations.
  affected_subsets:
  - Adult flagship cohort.
- id: d4d:VOICE-bias-geographic-cultural
  name: Geographic and cultural bias
  description: Coverage bias recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  bias_type: representation_bias
  bias_description: Data are collected at a limited number of North American sites, and although the project
    seeks diversity, it may under-represent speakers from other regions, cultures, languages and healthcare
    systems; early releases focus on English, with Spanish protocols planned but not yet fully represented.
  mitigation_strategy: Spanish-language protocols and data collection are under development and are to
    be included in future releases.
  affected_subsets:
  - The adult flagship cohort, which is the release the v3.0.0 RO-Crate describes.
  - The project documentation separately records that the pediatric cohort also required English proficiency
    and was recruited at a single site.
- id: d4d:VOICE-bias-clinical-spectrum
  name: Clinical spectrum bias
  description: Case-mix bias recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  bias_type: selection_bias
  bias_description: Because participants are selected into disease cohorts where voice changes are expected,
    the prevalence and severity of conditions in the dataset differ from those in routine primary care
    or community settings, which may inflate model performance when evaluated within this dataset.
  affected_subsets:
  - The adult disease cohorts described by the v3.0.0 RO-Crate.
- id: d4d:VOICE-bias-device-environment
  name: Device and environment bias
  description: Measurement bias recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  bias_type: measurement_bias
  bias_description: Recordings are made using standardized but not identical hardware and primarily in
    clinical environments; future at-home collection or deployment on other devices may encounter different
    background noise, channel characteristics and user behavior. Data are collected on iPads (9th or 10th
    generation) and iPad Air (5th generation) using an Avid AE-36 microphone and an Apple dongle, with
    distinct iPad devices used at each site. Participants were screened for different disorders based
    on site, so they also had their data collected with different devices.
  mitigation_strategy: The data acquisition application includes models to ensure acoustic data quality,
    including volume standardization and noise cancellation, and evidence-based recommendations for tablet
    recordings were published by the consortium's acoustic experiments group.
  affected_subsets:
  - The adult collection sites described by the v3.0.0 RO-Crate.
  - The project documentation separately records that, in the pediatric cohort, some recordings used the
    built-in tablet microphone rather than a headset.
- id: d4d:VOICE-bias-machine-annotation
  name: Algorithmic bias in machine annotations
  description: Annotation-tool bias recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  bias_type: algorithmic_bias
  bias_description: Transcripts and some derived features rely on off-the-shelf models such as OpenAI
    Whisper and other audio toolkits whose performance may vary across demographic groups; the dataset
    team has not independently audited these tools for fairness, so downstream users should consider their
    biases when interpreting results.
  affected_subsets:
  - Transcription-derived and model-derived feature sets.
- id: d4d:VOICE-bias-recruitment-trust
  name: Differential recruitment by trust and proximity
  description: Bias in who was reachable for recruitment, recorded in the project documentation.
  bias_type: selection_bias
  bias_description: Groups that have less trust in the medical system or in AI, or that are less proximal
    to the collection sites, would have been less likely to be recruited.
  affected_subsets:
  - All sites.
- id: d4d:VOICE-bias-disorder-site-demographic-skew
  name: Disorder, site and demographic skew
  description: Composition skew flagged for future users in the project documentation.
  bias_type: representation_bias
  bias_description: The dataset has skews based on disorder category, site and other demographic factors,
    and the public data releases do not contain an equal distribution of the five disease categories.
  mitigation_strategy: Users should consider the multivariate distribution when assessing utility for
    different questions. Further releases will contain additional data.
known_limitations:
- id: d4d:VOICE-limitation-feature-only
  name: Feature-only release without raw audio or free-speech transcripts
  description: Limitation recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  limitation_type: scope_limitation
  limitation_description: The feature-only release does not include raw audio waveforms or free-speech
    transcripts, which limits certain types of modeling and error analysis and may constrain the ability
    to reproduce end-to-end audio pipelines.
  recommended_mitigation: Raw audio is obtainable for both cohorts through the separate controlled-access
    process administered by the Data Access Compliance Office (DACO@b2ai-voice.org), with distribution
    via Synapse.
- id: d4d:VOICE-limitation-adult-only-and-language
  name: Cohort and language coverage of a single release
  description: Limitation recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  limitation_type: coverage_limitation
  limitation_description: The b2ai-voice release only includes an adult cohort; models trained solely
    on this dataset may not generalize to younger age groups or to languages beyond those represented.
    The only language option for data collection to date is English, and participants who do not read
    or speak English are excluded.
  scope_impact: Pediatric coverage is supplied instead by the separate Bridge2AI-Voice Pediatric Dataset,
    which is a distinct PhysioNet project with its own cohort, protocol and ethics approval.
  recommended_mitigation: Spanish protocols and data collection are under development and are stated to
    be included in future releases.
- id: d4d:VOICE-limitation-deidentification-tradeoff
  name: Fairness analysis limited by de-identification
  description: Limitation recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  limitation_type: resolution_limitation
  limitation_description: Because of de-identification, some granular demographic and socio-economic variables,
    fine-grained location data and narrative context have been removed, which reduces the risk of re-identification
    but also limits detailed fairness assessments and certain confounder adjustments.
- id: d4d:VOICE-limitation-no-splits-no-uncertainty
  name: No predefined splits or label-uncertainty measures
  description: Limitation recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  limitation_type: methodological_limitation
  limitation_description: The dataset does not provide predefined train-validation-test splits or benchmarking
    tasks and does not include explicit per-instance label-uncertainty measures, so researchers must design
    their own evaluation protocols and handle label noise and missingness.
- id: d4d:VOICE-limitation-access-governance
  name: Access governance constrains participation and reproducibility
  description: Limitation recorded in the v3.0.0 RO-Crate responsible-AI metadata.
  limitation_type: integration_limitation
  limitation_description: The registered-access and controlled-access governance structure is appropriate
    for privacy but may limit participation by some institutions or researchers and can complicate the
    reproducibility of pipelines that require both features and raw audio.
- id: d4d:VOICE-limitation-representativeness
  name: Not representative of a larger population
  description: Representativeness limitation stated in the project documentation.
  limitation_type: representativeness_limitation
  limitation_description: The dataset is a sample of a larger, ongoing collection. The data is not representative
    because it was collected at a limited number of geographic locations.
  recommended_mitigation: The project intends to improve representativeness by shifting to remote collection
    and designing the recruiting approach to control for more variables.
- id: d4d:VOICE-limitation-single-labeler
  name: Single-labeler diagnostic assignment
  description: Labeling limitation stated in the project documentation.
  limitation_type: methodological_limitation
  limitation_description: A single labeler provides a label per instance, typically the clinician at the
    site of data collection or a clinician external to it for a prior diagnostic assessment, so no inter-annotator
    agreement statistics are available. Human-level performance in the applications the dataset addresses
    is stated to vary widely.
- id: d4d:VOICE-limitation-no-external-data-in-release
  name: Multimodal data collected but not released
  description: Scope limitation on the multimodal linkage that motivates the project, stated in the project
    documentation.
  limitation_type: scope_limitation
  limitation_description: Other multimodal data, including imaging, genomic data for the neurological
    cohort, laryngoscopy imaging and other electronic-health-record data, is extracted from different
    sites independently and uploaded through the REDCap database, but no external data is released in
    the v3.0.0 release.
- id: d4d:VOICE-limitation-k-anonymization
  name: K-anonymization not achieved
  description: De-identification limitation stated in the project documentation.
  limitation_type: methodological_limitation
  limitation_description: The dataset does not achieve K-anonymization (k>=2), although it removes direct
    identifiers, applies HIPAA de-identification rules, rebases or replaces dates by integers, generalizes
    or removes geographic information and removes narrative text fields.
- id: d4d:VOICE-limitation-ai-readiness-gaps
  name: Self-assessed AI-readiness gaps
  description: Criteria not met in the project's own Precision Public Health (Voice) AI-readiness rating
    table.
  limitation_type: methodological_limitation
  limitation_description: In the project's AI-readiness self-rating, the criteria Data Quality (2.e),
    Domain-appropriate (5.b), Associated (5.d) and Contextualized (6.d) are scored 0, giving category
    totals of 80% for Characterization, 50% for Sustainability and 75% for Computability, while FAIRness,
    Provenance, Pre-model explainability and Ethics score 100%.
confidential_elements:
- id: d4d:VOICE-confidentiality
  name: Confidential data elements
  description: Presence of legally privileged or otherwise confidential content.
  confidential_elements_present: false
  confidentiality_details:
  - The project documentation answers "No" to whether the dataset contains data that might be considered
    confidential, for example data protected by legal privilege or by doctor-patient confidentiality.
  - The v3.0.0 RO-Crate nonetheless records the confidentiality level as "Limited dataset available with
    Data Use Agreement", and the data transfer and use agreement records that the data is covered under
    a Certificate of Confidentiality, which must be asserted against compulsory legal demands such as
    court orders and subpoenas for identifying information or characteristics of a research participant.
content_warnings:
- id: d4d:VOICE-content-warnings
  name: Potentially distressing content
  description: Content that might be offensive, insulting, threatening or otherwise pose a safety risk.
  content_warnings_present: true
  warnings:
  - The dataset includes the transcription of free speech tasks. While the inclusion of offensive, insulting
    or threatening content is unlikely, it cannot be completely avoided, as research participants are
    responsible for their choice of language.
  - Questions asked of participants from certain disease cohorts such as mood disorders, depression and
    anxiety can lead to possible discomfort and could trigger negative emotions for participants.
subpopulations:
- id: d4d:VOICE-subpopulations
  name: Demographic sub-populations
  description: Demographic sub-populations identified in the released data.
  subpopulation_elements_present: true
  identification:
  - Age
  - Gender
  - Sex
  - Ethnicity
  - Socioeconomic status
  - Disease cohort category (voice disorders, respiratory disorders, neurological and neurodegenerative
    disorders, mood and psychiatric disorders, pediatric voice and speech disorders, and controls).
  distribution:
  - The public data releases do not contain an equal distribution of the five disease categories; further
    releases will contain additional data.
  - The v3.0.0 RO-Crate states that demographic variables such as age, sex and country of data collection
    are included in coarsened form, while finer-grained geographic identifiers, direct identifiers and
    many socio-economic and cultural details have been removed during de-identification.
  - The eligibility record for the adult study gives sex "All", not gender-based, minimum age 18 years,
    maximum age 120 years and healthy volunteers accepted; the pediatric cohort covers ages 2 to 18.
sensitive_elements:
- id: d4d:VOICE-sensitive-elements
  name: Sensitive data elements
  description: Categories of sensitive information present in the released data.
  sensitive_elements_present: true
  sensitivity_details:
  - 'Racial or ethnic origins: the dataset includes race information. Sexual orientations: the dataset
    includes sexual orientation information. Financial or health data: the dataset includes socioeconomic
    and health information.'
  - The dataset encodes health-related information including diagnostic categories for voice disorders,
    neurological and neurodegenerative conditions, mood and psychiatric disorders and respiratory diseases,
    as well as symptom scores from questionnaires, which constitute sensitive personal health data.
  - Demographic variables such as age, sex and country of data collection are included in coarsened form,
    while finer-grained geographic identifiers, direct identifiers and many socio-economic and cultural
    details have been removed during de-identification to reduce re-identification risk.
  - Highly sensitive content including detailed narrative responses, some information about household
    income, traumatic life experiences and granular cultural identifiers has been removed entirely from
    this feature-only dataset; raw voice recordings, which are themselves biometric identifiers, are made
    available only under controlled access.
  - Use of the data is restricted to authorized researchers under a registered-access license and associated
    data use agreement that explicitly forbids attempts at re-identification, stigmatizing or discriminatory
    uses and applications such as surveillance or high-stakes individual decision making.
  - All sensitive fields were removed from the v3.0.0 release; these correspond to data elements encoded
    as sensitive under the column name "Identifier?" in the REDCap data dictionary.
acquisition_methods:
- id: d4d:VOICE-acquisition
  name: How instance data were acquired
  description: Whether the data were directly observed, subject-reported or inferred, and how verified.
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The data was directly observable and reported by subjects. Clinical diagnoses were verified by clinicians
    reviewing audio and/or imaging data, looking at electronic health records, or medication prescriptions.
  - Clinical validation is performed by a qualified physician or practitioner based on established gold
    standards for diagnosis, which differ per cohort and include laryngoscopy images, stroboscopy videos,
    CT and MRI of the brain, whole genome sequencing, spirometry and flow volume loops, chest X-rays and
    psychiatric assessment.
  - Derived acoustic and articulatory features are inferred from the raw waveforms by computational tools
    rather than observed directly.
collection_mechanisms:
- id: d4d:VOICE-collection-mechanism-apps
  name: Custom data acquisition applications
  description: Software mechanisms used to collect voice, speech and questionnaire data.
  mechanism_details:
  - The data were collected using an iPad app.
  - Voice samples are collected prospectively using a custom software application (the Bridge2AI-Voice
    App) following the Bridge2AI-Voice protocols. Data collection occurs in clinic with the assistance
    of a trained research assistant; remote data collection did not occur for the initial dataset release.
  - Data collection occurs through two platforms, the Bridge2AI Voice Web app and the Bridge2AI Voice
    iOS app. The iOS app is restricted to iOS-compatible devices, while the web app can run on a computer,
    tablet or phone. No software is downloaded or installed, there is no login required, both apps are
    HIPAA-compliant and only store data during the collection phase, and data are removed as soon as the
    page is closed. Data are sent over a secure HTTPS protocol to a HIPAA-compliant storage server hosted
    by an NIH STRIDES partner (Amazon, Google or Microsoft).
  - For the pediatric cohort, all data is collected using reproschema-ui on tablets with the Bridge2AI-Voice
    pediatric protocol.
  - Detailed demographic data, confounder surveys and validated questionnaires are collected through the
    smartphone or tablet application; clinical and case-report-form data are entered into a REDCap database.
  used_software:
  - id: d4d:VOICE-software-b2ai-voice-app
    name: Bridge2AI-Voice App
    description: Custom iOS and web data acquisition application hosting the Bridge2AI-Voice protocols
      for acoustic tasks, demographic surveys, confounder questionnaires and validated patient-reported
      outcomes; HIPAA-compliant, with no local install and no login required.
  - id: d4d:VOICE-software-reproschema-ui
    name: reproschema-ui
    description: Web-based schema-driven data collection interface used to administer the Bridge2AI-Voice
      pediatric protocol on tablets.
  - id: d4d:VOICE-software-redcap
    name: REDCap
    description: Electronic data capture system used to manage clinical and phenotype data, hold the case
      report form, house electronic consent, and store the Bridge2AI-Voice data dictionary and instruments;
      the supporting data dictionary, metadata and instrument PDFs are published at https://github.com/eipm/bridge2ai-redcap.
    url: https://github.com/eipm/bridge2ai-redcap
- id: d4d:VOICE-collection-mechanism-hardware
  name: Recording hardware
  description: Devices and microphones used for acoustic capture.
  mechanism_details:
  - Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36
    microphone and an Apple dongle to connect it to the iPad.
  - Data collection was conducted using a custom application on a tablet with a headset used for data
    collection when possible; participants were instructed to wear a headset with microphone if the task
    included voice recording, as per the Bridge2AI-Voice suggested standards.
  - For the pediatric cohort, a headset was used to record for most participants, while the remaining
    recordings used the built-in tablet microphone due to low tolerance of wearing headphones or existing
    complex medical conditions.
sampling_strategies:
- id: d4d:VOICE-sampling-overall
  name: Overall sampling design
  description: Whether the dataset is a sample of a larger set and how it was drawn.
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - An ongoing prospective collection targeting an anticipated enrollment of 10,000 participants by 2027,
    drawn from five disease cohort categories plus controls at participating North American institutions.
  why_not_representative:
  - It is a sample of a larger, ongoing collection. The data is not representative because it was collected
    at a limited number of geographic locations. The project hopes to make it more representative by shifting
    to remote collection and designing the recruiting approach in a way that controls for more variables.
  strategies:
  - The sampling method is recorded as a Non-Probability Sample.
  - Adults presenting to voice, neurology, psychiatry and respiratory clinics, plus healthy controls,
    were screened against predefined inclusion and exclusion criteria before enrollment.
  - 'Data acquisition was planned in four phases: exploratory (up to 180 participants, completed November
    2023), pilot (cumulatively up to 600 participants, begun November 2023), expansion (cumulatively up
    to 3,000 participants through community outreach clinics and additional high volume expert clinics)
    and outreach (cumulatively up to 5,000 participants).'
data_collectors:
- id: d4d:VOICE-collector-research-teams
  name: Site research teams
  role: Data collection and participant coordination
  description: Who collected the data and how they were compensated.
  collector_details:
  - Research teams, which may include medical, graduate or undergraduate students, coordinated with clinicians
    and doctors to identify appropriate participants.
  - Hospital staff were not involved in scheduling but assisted in the logistics of coordinating data
    collection.
  - Participants were brought to a private clinic room and introduced to the app on a study iPad by a
    member of the research staff, who observed and timed task completion.
- id: d4d:VOICE-collector-clinicians
  name: Site clinicians and investigators
  role: Clinical diagnosis and gold-standard validation
  description: Clinicians who assigned and validated the diagnostic labels.
  collector_details:
  - Clinicians and doctors were listed under the IRB as co-investigators and were added to the consortium
    so that their names are included on consortium-level publications that emerge from the research; they
    were not otherwise compensated for the collection role.
  - At each site, a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up. For the psychiatric disorders cohort, this assessment was determined using the participant's
    electronic health record or an active prescription, which was done outside of data collection by an
    appropriately licensed clinician.
  - The team hired 2 acoustic engineers and 3 AI data scientists to analyze all samples from the Year
    1 exploratory data collection phase to ensure acoustic quality and machine-learning readiness.
collection_timeframes:
- id: d4d:VOICE-timeframe-adult-cohort
  name: Adult cohort collection timeframe
  description: Period over which the released adult data were collected.
  timeframe_details:
  - The v3.0.0 RO-Crate records that data collection for the adult flagship cohort began after project
    launch in 2023 and is ongoing across five North American sites toward an anticipated enrollment of
    approximately 3,000 participants by November 2026, and that the participants and recordings included
    in dataset version 3.0.0 were collected roughly between 2023 and 2025.
  - The project documentation states that the data was collected over a period of 12 months.
  - The IRB protocol describes a prospective cohort study over 4 years, with phase 1 exploratory data
    collection completed in November 2023 and phase 2 pilot data collection begun November 2023 and ongoing
    in November 2024.
  - The underlying NIH award runs from 2022-09-01 to 2026-11-30.
- id: d4d:VOICE-timeframe-releases
  name: Release snapshot timeframe
  description: Static release snapshots of the underlying collection.
  timeframe_details:
  - 'The v3.0.0 RO-Crate records that dataset releases are static snapshots: v1.0 (initial public release
    in 2024), v1.1 (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18) and v3.0.0 (2025-12-16), each
    corresponding to a frozen state of the underlying data collection.'
  - PhysioNet additionally lists adult v3.1.0, published 2026-05-01, which post-dates the crate.
  - The pediatric project lists v1.0.0 published 2025-12-17 and v1.1.0 published 2026-05-01.
- id: d4d:VOICE-timeframe-feasibility-study
  name: App feasibility study timeframe
  description: Timeframe of the single-site feasibility study of the data acquisition application, which
    preceded and informed dataset collection but contributed no audio data.
  start_date: '2023-06-05'
  end_date: '2023-07-28'
  timeframe_details:
  - The feasibility study was conducted at the University of South Florida Health Voice Center in Tampa,
    Florida between June 5, 2023 and July 28, 2023, enrolling 47 participants over a two-month enrollment
    period. Audio data was not collected at this stage of app development.
missing_data_documentation:
- id: d4d:VOICE-missing-data-documentation
  name: Missingness patterns and handling
  description: Documented missingness in the released tables and features.
  missing_data_patterns:
  - Phenotype tables include a row for a participant only when at least one variable is non-missing, and
    participants may have repeated visits with differing responses.
  - Questionnaire completion varies by participant and cohort, so some forms and items are systematically
    or sporadically missing.
  - Some derived audio features could not be computed for all recordings due to quality or length constraints,
    and features relating to free speech or sensitive records have been removed.
  missing_data_causes:
  - Some questions are optional.
  - Each individual answered a common set of questions and then responded to additional questions relevant
    to their primary diagnostic category.
  - There may be data collection irregularities that caused some information to be missing from individual
    instances.
  - Sensitive records, audio checks and free-speech-derived features were deliberately removed before
    release.
  handling_strategy: No additional imputation is applied in the released files. The dataset has been audited
    internally for missingness and consistency by the data release team, and a missingness table is included
    with the dataset.
raw_data_sources:
- id: d4d:VOICE-raw-data-source
  name: Underlying raw data
  description: The raw material from which the released derived features were produced.
  source_description: The original raw data consist of high-quality voice, speech and respiratory audio
    waveforms recorded on tablet or smartphone devices with headset microphones when available, plus responses
    to structured demographic and medical history questionnaires, disease-specific validated questionnaires
    and other patient-reported outcomes, together with clinical diagnoses and other metadata extracted
    from electronic health records.
  source_type:
  - Audio waveform recordings of acoustic tasks
  - Structured questionnaire and patient-reported outcome responses
  - Clinician-assigned diagnoses and gold-standard validation results
  - Electronic health record extracts
  access_details: The public feature-only PhysioNet release contains de-identified derived representations
    of the audio, along with tabular phenotype files and data dictionaries; access to the underlying raw
    audio is available only through a separate controlled-access process. Raw audio is saved and is not
    accessible publicly. For the adult cohort it is distributed via Synapse (https://www.synapse.org/Synapse:syn72370534/)
    and for the pediatric cohort via Synapse (https://www.synapse.org/Synapse:syn73617068), in both cases
    after institutional sign-off and approval by the Data Access Compliance Office (DACO@b2ai-voice.org).
  raw_data_format:
  - WAV audio at the source, organized per participant and session under a BIDS-style layout
  - REDCap and ReproSchema-UI exports for questionnaire and phenotype data
ethical_reviews:
- id: d4d:VOICE-ethics-usf-irb
  name: University of South Florida Institutional Review Board
  description: Single IRB of record for the adult study.
  contact_person: d4d:VOICE-person-usf-irb-contact
  reviewing_organization: d4d:VOICE-org-usf-irb
  review_details:
  - The clinical study was submitted to and approved by the USF Single IRB and subsite IRBs through the
    Single IRB process. Data collection and sharing was approved by the University of South Florida Institutional
    Review Board.
  - The v3.0.0 RO-Crate records the reviewing organization as the University of South Florida Institutional
    Review Board, with postal address 3702 Spectrum Blvd., Suite 165 Usf, Tampa, FL 33620, US, telephone
    (813) 974-5638 and email RSCH-IRB@usf.edu.
  - The USF IRB protocol is titled "Bridge2AI Voice Data Acquisition", with principal investigator Yael
    Bensoussan; version 1 is dated January 17, 2023 and thirteen revisions through version 13 dated July
    11, 2025 are recorded. The feasibility study of the acquisition app was approved separately under
    USF IRB number 004890.
  - The v3.0.0 RO-Crate records that the dataset involves human subjects, that the human-subject exemption
    is "No", and that the dataset is not FDA regulated; its irbProtocolId field is empty.
  - The study is not for a drug product and is not for a medical device, and no data monitoring committee
    was appointed.
- id: d4d:VOICE-ethics-hastings-review
  name: Ethical review at The Hastings Center for Bioethics
  description: Dataset-level ethical review recorded in the v3.0.0 RO-Crate.
  contact_person: d4d:VOICE-person-vardit-ravitsky
  reviewing_organization: d4d:VOICE-org-hastings
  review_details:
  - The v3.0.0 RO-Crate records the dataset's ethical review as "Ethical Review by Vardit Ravitsky at
    the Hastings Center for Bioethics".
  - The consortium's ethics module was chartered to integrate existing scholarship, tools and guidance
    with the development of new standards and normative insights for identifying, anticipating and addressing
    ethical and trustworthy issues arising from voice data generation and AI/ML research through to clinical
    adoption, and to develop new guidelines for consenting to voice data collection, sharing and utilization
    in the context of voice AI technology.
  - A memorandum setting out the ethical justification for controlled access to raw voice data samples
    is published alongside the dataset documentation.
- id: d4d:VOICE-ethics-sickkids-reb
  name: Hospital for Sick Children Research Ethics Board
  description: Ethics approval for the pediatric cohort.
  reviewing_organization: d4d:VOICE-org-sickkids-reb
  review_details:
  - Pediatric data collection and sharing was approved by the Research Ethics Board at the Hospital for
    Sick Children.
  - Canadian institutions (Mount Sinai Hospital, SickKids and the University of Toronto) do not abide
    by the US single-IRB process and applied for separate research ethics board approvals to comply with
    Canadian regulations; copies of the approved approvals were submitted with their applications to the
    USF IRB.
- id: d4d:VOICE-ethics-genomic-separate-reb
  name: Separate ethics approval for genomic data collection
  description: Scope carve-out from the single IRB.
  review_details:
  - Genomic data is collected and analyzed only at the University of Toronto and Mount Sinai Hospital
    in Canada; that team has a separate protocol and research ethics board approval for genomic data collection
    and analysis, a copy of which is submitted to the USF IRB once approved. No genetic information is
    collected at the USF site.
data_protection_impacts:
- id: d4d:VOICE-data-protection-impact
  name: Impact assessment on data subjects
  description: Whether an analysis of the potential impact of the dataset on data subjects was conducted.
  impact_details:
  - The project documentation answers the question of whether an analysis of the potential impact of the
    dataset and its use on data subjects has been conducted with "No."
  - 'The v3.0.0 RO-Crate nonetheless records a social-impact statement: the project aims to create an
    ethically sourced, diverse voice dataset to support research on using voice as an accessible, low-cost
    biomarker for screening, diagnosis and monitoring of a broad range of health conditions, potentially
    improving early detection and care for underserved populations. At the same time, the consortium explicitly
    recognizes the risks associated with voice data, including privacy loss, misuse of voice biometrics
    and algorithmic harms such as discrimination in hiring, insurance or surveillance contexts; these
    risks motivate a governance framework with IRB oversight, rigorous de-identification, separation of
    feature-only and raw-audio tiers and usage restrictions encoded in the registered-access license and
    data use agreement.'
human_subject_research:
  id: d4d:VOICE-human-subject-research
  name: Human subject research status
  description: Human-subjects status, approvals and regulatory posture.
  involves_human_subjects: true
  irb_approval:
  - Submitted and approved by the USF Single IRB and subsite IRBs through the Single IRB process; the
    v3.0.0 RO-Crate records humanSubjects "Yes" and humanSubjectExemption "No".
  - USF IRB protocol "Bridge2AI Voice Data Acquisition", principal investigator Yael Bensoussan.
  - Feasibility study of the acquisition application approved under USF IRB number 004890.
  ethics_review_board:
  - University of South Florida Institutional Review Board (single IRB for US sites).
  - Research Ethics Board, Hospital for Sick Children (pediatric cohort).
  - Separate Canadian research ethics board approvals at Mount Sinai Hospital and the University of Toronto,
    including a distinct protocol for genomic data.
  - Dataset-level ethical review by Vardit Ravitsky at The Hastings Center for Bioethics, per the v3.0.0
    RO-Crate.
  special_populations:
  - Pediatric patients are enrolled only through the pediatric sites and not at USF; checklist HRP-416
    for children under 21 was completed and appended to the protocol.
  - The study does not specifically include or exclude students, employees or wards of the state, and
    has a specific plan to enroll participants from socially and economically disadvantaged and underserved
    populations through the Plan for Enhancing Diverse Perspectives.
  regulatory_compliance:
  - 'HIPAA: all clinical data are hosted on cloud servers through NIH STRIDES partners that have pre-determined
    agreements with the NIH to ensure HIPAA protection; the collection applications are themselves HIPAA-compliant;
    HIPAA Safe Harbor identifiers were removed from the release.'
  - A partial HIPAA waiver was requested for recruitment purposes to allow the study team to review electronic
    health record information for incoming clinic patients ahead of their appointments, limited to the
    study's inclusion criteria.
  - The data transfer and use agreement records that the data is covered under a Certificate of Confidentiality
    and that it is Personally Identifiable Information as defined in OMB Memorandum M-07-16.
  - The dataset is not FDA regulated, per the v3.0.0 RO-Crate.
informed_consent:
- id: d4d:VOICE-informed-consent
  name: Informed consent process
  description: How consent was obtained, documented and scoped.
  consent_obtained: true
  consent_type:
  - Written informed consent on paper.
  - Electronic consent within the Bridge2AI-Voice app or through REDCap survey forms.
  - Video-recorded consent within the application, used to verify identity.
  - Parental permission with verbal or documented assent from children where age-appropriate; children
    under about seven years of age are not asked to assent.
  - Ongoing electronic consent administered before each subsequent longitudinal data collection.
  consent_documentation:
  - Paper consent documents are uploaded and saved electronically in REDCap; all paper and electronic
    versions are stored for a minimum of five years after study completion, and original paper consent
    documents cannot be destroyed until five years after study completion.
  - All study-related material at USF is stored through the Florence platform in accordance with USF and
    NIH regulations.
  withdrawal_mechanism:
  - Participants may withdraw at any point; withdrawal during or before voice data collection excludes
    their data from the database, while data cannot be removed once the voice data collection process
    is completed.
  consent_scope:
  - Consent covers collection of acoustic, demographic, questionnaire and clinical data; access to medical
    information through EHR platforms for gold-standard validation; and sharing of de-identified data
    with external researchers through registered and controlled access mechanisms.
  - Within the consent process individuals are asked whether they agree to be contacted in the future
    for further voice data collection; contact information provided for that purpose is stored within
    the institutional database only and is not shared with other centers or uploaded to the cloud.
  - Consent is obtained without undue influence or coercion, since participation is voluntary and takes
    place during a typical patient care appointment.
at_risk_populations:
  id: d4d:VOICE-at-risk-populations
  name: At-risk and vulnerable populations
  description: Vulnerable populations included and the protections applied.
  at_risk_groups_included: true
  special_protections:
  - Pediatric patients are enrolled only through the pediatric participating institutions and not at USF;
    checklist HRP-416 for children under 21 was completed and appended to the protocol.
  - Participants in the mood and psychiatric cohorts may experience discomfort or negative emotions from
    certain questions; this is disclosed as a study risk.
  - Compensation is provided to the adult population only, so that payment cannot act as an inducement
    for pediatric participants.
  - A specific plan exists to enroll participants from socially and economically disadvantaged and underserved
    populations through the Plan for Enhancing Diverse Perspectives, with data collection at Community
    Outreach Clinics whose main mission is to serve underserved and under-represented populations.
  assent_procedures:
  - Children provide verbal assent where appropriate. Where young children cannot reasonably be asked
    to assent, due to limitations in understanding arising from age and development, they are not asked
    to do so; this typically holds for children under seven years of age. Assent is documented on a dedicated
    form.
  guardian_consent:
  - When children participate, parents or guardians provide consent. Parental permission is obtained from
    one or both parents; because the research is minimal risk it does not require permission from both
    parents or legal guardians.
  - Pediatric participants who do not receive consent from a parent or guardian for de-identified voice
    and clinical data to be uploaded to an open-sourced database are excluded.
preprocessing_strategies:
- id: d4d:VOICE-preprocessing-audio
  name: Audio standardization and feature extraction
  description: How raw waveforms were converted into the released derived features.
  preprocessing_details:
  - Raw audio waveforms are converted to mono and resampled to 16 kHz using anti-aliasing filtering (a
    Butterworth anti-aliasing filter); they are then segmented by task and passed through quality checks.
  - From the standardized audio, multiple derived feature sets are computed including spectrograms, mel
    spectrograms, MFCCs, articulatory features using the Speech Articulatory Coding package, pitch and
    loudness estimates, acoustic features from openSMILE, phonetic and prosodic features from Praat and
    parselmouth, and phonetic posteriorgrams using a dedicated model; all are stored as dense tensors
    in Parquet files with participant, session and task identifiers.
  - Spectrograms are computed with the short-time Fast Fourier Transform using a 25 ms window size, 10
    ms hop length and a 400-point FFT, and were further downsampled by a factor of two in the time domain
    after derivation; mel spectrograms and MFCCs use the same parameters with 60 Mel bins; SPARC features
    are gathered at 50 Hz; phonetic posteriorgrams are generated at 100 Hz.
  - Transcriptions were generated using OpenAI's Whisper Large model. Transcripts of free-speech audio
    were removed before release.
  - In the earlier v1.1 release the spectrogram parameters were a 25 ms window, 10 ms hop length and a
    512-point FFT, producing 513xN spectrograms, in contrast to the 400-point FFT and 201xT spectrograms
    of v3.0.0 and later.
  used_software:
  - id: d4d:VOICE-software-b2aiprep
    name: b2aiprep
    description: A simple Python package to prepare acoustic data for the Bridge2AI voice project; the
      code used to preprocess the raw audio waveforms into the parquet files and to merge the source data
      into the phenotype files. The v3.0.0 RO-Crate records version 3.0.2, last modified 2026-01-06, while
      the PhysioNet v3.0.0 release notes state that the release was generated with b2aiprep v3.0.0.
    version: 3.0.2
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: d4d:VOICE-software-senselab
    name: SenseLab
    description: Library for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
  - id: d4d:VOICE-software-opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction; used to extract acoustic feature
      sets capturing temporal dynamics and spectral characteristics, including eGeMAPS features per audio
      file.
  - id: d4d:VOICE-software-praat-parselmouth
    name: Praat and parselmouth
    description: Used for phonetic and prosodic feature extraction, providing measures of fundamental
      frequency, formants and voice quality.
  - id: d4d:VOICE-software-torchaudio
    name: torchaudio
    description: Used to compute spectrograms, mel spectrograms, MFCCs and pitch contours.
  - id: d4d:VOICE-software-sparc
    name: Speech Articulatory Coding (sparc)
    description: Used to estimate articulatory kinematics, including electromagnetic articulography estimates,
      plus loudness, periodicity and pitch measures.
  - id: d4d:VOICE-software-ppgs
    name: ppgs
    description: Package generating phonetic posteriorgrams, time-varying categorical distributions over
      acoustic units of speech.
  - id: d4d:VOICE-software-whisper
    name: OpenAI Whisper Large
    description: Automatic speech recognition model used to transcribe structured speech tasks; transcripts
      from free-speech audio were removed before release.
- id: d4d:VOICE-preprocessing-phenotype
  name: Phenotype export and reorganization
  description: How tabular phenotype data were produced.
  preprocessing_details:
  - Tabular phenotype and questionnaire files are exported from REDCap and merged using a dedicated open-source
    b2aiprep library, reorganizing the former single phenotype table into thematically organized TSV files
    with accompanying JSON data dictionaries; static per-recording feature summaries are provided in static_features.tsv,
    and de-identification and filtering steps are applied before packaging.
  - Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap format and
    subsequently converted to the Brain Imaging Data Structure.
  - The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from REDCap
    were converted to be compliant with the Brain Imaging Data Structure v1.9.0.
  - The v3.0.0 RO-Crate attributes the phenotype export to a computation named "VOICE Phenotype Ingest"
    dated 2025-12-16 and the feature derivation to a computation named "VOICE Features Processing" dated
    2026-01-29, both run by "Alastair" using the B2AIPrep library.
- id: d4d:VOICE-preprocessing-deidentification-preprocessing
  name: De-identification as a preprocessing step
  description: Preprocessing performed specifically to reduce re-identification risk before release.
  preprocessing_details:
  - Yes, the data were extracted from the raw audio to limit re-identification, and only the extracted
    features are being released with the dataset.
  - In addition, all spectrograms, MFCCs, mel spectrograms, transcriptions, EMAs and PPGs from open-response
    prompts are removed from the feature-only dataset.
  - The raw data, post de-identification, was saved in addition to the preprocessed data; it is saved
    and is not accessible publicly.
  - No instances were excluded from the dataset at the time of preprocessing.
cleaning_strategies:
- id: d4d:VOICE-cleaning
  name: Cleaning and data manipulation before release
  description: Transformations applied to the data prior to release.
  cleaning_details:
  - The project documentation answers the question of whether there was any pre-processing for cleaning
    the data with "No", distinguishing cleaning from the de-identification preprocessing that was performed.
  - 'The v3.0.0 RO-Crate records a data-manipulation protocol: prior to release, data are transformed
    to reduce re-identification risk and align with regulatory and ethical requirements. Direct identifiers
    and high-risk quasi-identifiers are removed; dates are coarsened or rebased; geographic information
    is generalized to the country level; narrative text fields and transcripts of free speech are removed;
    and raw voice waveforms are withheld from this feature-only release. Additional filtering removes
    features for sensitive records and audio checks, and some derived features are dropped when processing
    fails or quality checks fail.'
  - In v2.0 spectrograms were reprocessed to fix minor issues identified in the previous release, and
    all spectrograms and MFCCs from free-speech-related files were removed. In v3.1.0 broken parquet files
    from the previous release were fixed.
  - Quality control of the data is performed throughout the four years of the project. In each of study
    years 2 to 4, 10% of the data is selected at random every month for quality control and machine-learning
    readiness.
  - The audit protocol is to generate missingness tables; check distributions and outliers; check categorical
    responses against the schema; and for audio tasks run quality control metrics, including for waveforms
    the amount of silence and duration, and for speech a check of the produced speech relative to the
    intended passage.
  used_software:
  - id: d4d:VOICE-software-b2aiprep-cleaning
    name: b2aiprep
    description: Used for organizing and preprocessing the dataset, including the audit routines.
    url: https://github.com/sensein/b2aiprep
labeling_strategies:
- id: d4d:VOICE-labeling
  name: Labeling and annotation strategy
  description: How labels were produced, by whom and on what platform.
  annotations_per_item: 1
  inter_annotator_agreement: Not available. A single labeler provides a label per instance, so there is
    no explicit inter-rater majority-vote scheme; per-annotator disagreement statistics and detailed label-uncertainty
    measures are not included in the released dataset.
  data_annotation_platform:
  - Custom Bridge2AI-Voice mobile and tablet application used for in-clinic collection of acoustic tasks
    and questionnaires.
  - REDCap-based data capture system used to manage clinical and phenotype data.
  - Electronic health record systems used as a source of some gold-standard diagnostic information.
  - Open-source preprocessing and curation tools, including the b2aiprep library, used to merge and organize
    annotations with derived features.
  data_annotation_protocol:
  - Annotations consist primarily of clinical labels and questionnaire-derived measures associated with
    each participant and recording. Participants complete validated instruments such as VHI-10, PHQ-9,
    GAD-7, PANAS, respiratory and cough questionnaires and voice instruments, which generate numerical
    scores and categorical indicators according to each instrument's published scoring guidelines.
  - Clinical investigators and care teams record diagnostic categories for voice, neurological, mood and
    respiratory conditions and other phenotype variables, drawing on clinical assessments and electronic
    health records; these labels are represented in disease-specific TSV files with accompanying JSON
    dictionaries.
  - Machine-generated transcripts of certain voice tasks and numerous automatically extracted acoustic
    and articulatory features provide further labels and descriptors at the recording level.
  - The labeling strategy is a gold standard label available in the data, diagnosed by a clinician, following
    the Bridge2AI protocols and ICD-10 codes.
  annotator_demographics:
  - Clinical annotations, including diagnostic labels and certain phenotype variables, are created by
    clinicians and research staff at participating North American institutions spanning otolaryngology,
    neurology, neuroscience, pulmonology and allied health disciplines; detailed demographic breakdowns
    of annotators are not provided in the public documentation.
  - Questionnaire-based labels reflect self-reported information from participants themselves, whose demographics
    are captured in coarsened form in the phenotype tables, for example age bands, sex and country of
    data collection; however, per-annotator demographic information, such as which specific clinician
    or staff member entered a label, is not exposed.
  - The project documentation records the labeler demographic as "typically, the clinician at site of
    data collection, or external to (for prior diagnostic assessment)".
  labeling_details:
  - Each recording is associated with one set of clinical labels and questionnaire responses derived from
    a single participant, although participants may contribute multiple sessions over time; there is no
    crowd-sourced labeling and the documentation does not report multiple independent human ratings per
    individual recording.
  - Guidance for future researchers is that the process for any new labels should be described alongside
    any release of a model or publication, and should include the exact variables used for the determination.
  - Human-level performance in the applications the dataset is supposed to address varies widely.
raw_sources:
- id: d4d:VOICE-raw-source-adult-audio
  name: Adult raw audio via Synapse
  description: Access point for the withheld adult raw audio.
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - The published Bridge2AI-Voice Adult Dataset contains derived features from the audio waveforms; the
    PhysioNet project does not contain raw audio.
  - Accessing raw audio is a more involved process and requires institutional sign-off; requests go to
    the access committee at DACO@b2ai-voice.org. Data are made available via Synapse.
- id: d4d:VOICE-raw-source-pediatric-audio
  name: Pediatric raw audio via Synapse
  description: Access point for the withheld pediatric raw audio.
  access_url: https://www.synapse.org/Synapse:syn73617068
  raw_data_details:
  - The published Bridge2AI-Voice Pediatric Dataset contains derived features from the audio waveforms;
    the PhysioNet project does not contain raw audio. Access requires institutional sign-off through DACO@b2ai-voice.org,
    with distribution via Synapse.
- id: d4d:VOICE-raw-source-retention
  name: Retention of raw data within the consortium
  description: Where the underlying raw material is kept.
  raw_data_details:
  - The raw data, post de-identification, was saved in addition to the preprocessed data; it is saved
    and is not accessible publicly.
  - De-identified clinical and voice data are shared between institutions on a cloud-based infrastructure
    hosted through an NIH STRIDES partner; identifiable data and datasheets linking participant numbers
    to participant information are kept in each institution on local cloud storage.
imputation_protocols:
- id: d4d:VOICE-imputation
  name: Imputation protocol
  description: Whether and how missing values are imputed before release.
  imputation_method:
  - No global statistical imputation is applied. Missing questionnaire responses, phenotype variables
    and derived features are left as explicit missing values or omitted rows.
  imputation_rationale: The v3.0.0 RO-Crate records that the public datasets do not apply global statistical
    imputation to missing fields; instead the data release team audited missingness, and users can implement
    study-specific imputation or complete-case strategies appropriate to their analyses.
  imputation_validation:
  - The data release team audited the released tables for missingness, and a missingness table is included
    with the dataset.
annotation_analyses:
- id: d4d:VOICE-annotation-analysis
  name: Analysis of annotation quality
  description: How label quality and agreement were assessed.
  analysis_method: Questionnaire-based labels are generated using the standard scoring rules for each
    validated instrument, yielding total and subscale scores that can be mapped to symptom-severity bands;
    the scoring logic is encoded in the REDCap instruments and documented in the data dictionaries.
  disagreement_patterns:
  - Diagnostic labels are derived from clinical assessments and electronic health records rather than
    crowd workers, so there is no explicit inter-rater majority-vote scheme; however, diagnoses are treated
    as reference labels and may include multiple comorbid conditions per participant.
  annotation_quality_details:
  - The data release team audited the combined phenotype and feature tables for internal consistency,
    missingness patterns and data entry issues, but per-annotator disagreement statistics and detailed
    label-uncertainty measures are not presently included in the released dataset.
  - The dataset has been audited internally for missingness and consistency by the data release team;
    certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
machine_annotation_tools:
- id: d4d:VOICE-machine-annotation-tools
  name: Automated annotation and feature extraction tools
  description: Machine tools that generated labels, transcripts and derived descriptors.
  tools:
  - openSMILE
  - Praat and parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - Phonetic posteriorgram (ppgs) models
  - OpenAI Whisper Large
  - b2aiprep
  tool_descriptions:
  - openSMILE for extraction of acoustic feature sets capturing temporal dynamics and spectral characteristics.
  - Praat and the parselmouth interface for phonetic and prosodic feature extraction, including measures
    of fundamental frequency, formants and voice quality.
  - TorchAudio-based pipelines for computing spectrograms, mel spectrograms, MFCCs and pitch tracks.
  - Speech Articulatory Coding (sparc) package for estimating articulatory kinematics and related features.
  - Phonetic posteriorgram models that produce time-varying distributions over phonetic units for each
    recording.
  - OpenAI Whisper Large for automatic speech transcription of structured speech tasks, with transcripts
    from free-speech audio removed before release.
  - The open-source b2aiprep library for orchestrating preprocessing, feature extraction and merging of
    phenotype data into the released files.
  tool_accuracy:
  - Transcripts and some derived features rely on off-the-shelf models whose performance may vary across
    demographic groups; the dataset team has not independently audited these tools for fairness, so downstream
    users should consider their biases when interpreting results.
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
existing_uses:
- id: d4d:VOICE-existing-uses
  name: Existing uses of the dataset
  description: Tasks the dataset has already been used for.
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
  - Training opportunities for using the dataset are offered through the Bridge2AI-Voice Scholars program
    at https://www.b2aivoicescholars.org/.
use_repository:
- id: d4d:VOICE-use-repository
  name: Repository of works using the dataset
  description: Whether a repository links to papers or systems that use the dataset.
  repository_details:
  - The project documentation answers the question of whether there is a repository that links to any
    or all papers or systems that use the dataset, besides Google Scholar, with "No."
  - 'Using the dataset requires citation of the protocol-development publication: Bensoussan, Yael, et
    al. "Developing Multi-Disorder Voice Protocols: A team science approach involving clinical expertise,
    bioethics, standards, and DEI." Proc. Interspeech 2024, 1445-1449, doi 10.21437/Interspeech.2024-1926,
    available at https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html.'
other_tasks:
- id: d4d:VOICE-other-tasks
  name: Other tasks the dataset could support
  description: Additional uses beyond the predefined disease classification tasks.
  task_details:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived features
    with diagnostic categories or symptom severity for conditions such as vocal fold pathology, neurological
    and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - Representation learning, domain adaptation and multimodal integration of voice-derived features with
    other health data.
  - Study of developmental norms in pediatric voice, creation of AI-driven tools for early screening and
    support for clinical insight, using the separate pediatric release.
future_use_impacts:
- id: d4d:VOICE-future-use-impacts
  name: Impacts of composition and processing on future use
  description: What future users must know to avoid unfair treatment or other harms.
  impact_details:
  - The dataset has skews based on disorder category, site and other demographic factors. Users should
    consider the multivariate distribution when assessing utility for different questions.
  - Because the release is feature-only, certain types of modeling and error analysis are constrained
    and end-to-end audio pipelines may not be reproducible without separate controlled access to the raw
    audio.
  - De-identification removed granular demographic and socio-economic variables, fine-grained location
    data and narrative context, limiting detailed fairness assessments and certain confounder adjustments.
  - The consortium recognizes risks of privacy loss, misuse of voice biometrics and algorithmic harms
    such as discrimination in hiring, insurance or surveillance contexts; dataset documentation and ongoing
    ethics workstreams are intended to help downstream users reason about these risks and design responsible
    analyses and models.
discouraged_uses:
- id: d4d:VOICE-discouraged-uses
  name: Discouraged uses
  description: Applications the consortium discourages.
  discouragement_details:
  - The dataset should not be used for non-clinical or non-research applications such as hiring decisions,
    insurance premium adjustments, or any form of surveillance that could lead to discrimination or harm.
    These discouraged uses are intended to prevent unethical or biased outcomes that could negatively
    impact individuals based on their health conditions or voice characteristics.
  - The dataset is explicitly not intended for operational decision making about specific individuals
    such as hiring, insurance pricing, law enforcement or surveillance.
  - The dataset is intended strictly for research that prioritizes patient safety, privacy and ethical
    use.
intended_uses:
- id: d4d:VOICE-intended-uses
  name: Intended uses
  description: Uses the dataset was designed and released to support.
  use_category:
  - Research
  - Clinical machine-learning model development
  - Benchmarking and validation
  - Methodological and fairness research
  examples:
  - Development, training and fine-tuning of machine-learning models that associate voice-derived features
    with diagnostic categories or symptom severity for conditions such as vocal fold pathology, neurological
    and neurodegenerative diseases, mood and anxiety disorders and respiratory illnesses.
  - Benchmarking and validation of existing voice-biomarker algorithms by testing their performance on
    a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
  - Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease using
    de-identified derived features, including work on representation learning, domain adaptation and multimodal
    integration with other health data.
  - Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
  usage_notes: The dataset aims to enable the development, benchmarking or validation of clinically applicable
    machine-learning models for diagnosing a wide range of health conditions using voice data, including
    vocal pathologies and neurological, psychiatric, respiratory and pediatric voice disorders. It is
    structured to be Findable, Accessible, Interoperable and Reusable. Because there are no recommended
    splits, users must design their own evaluation protocols and handle label noise and missingness.
prohibited_uses:
- id: d4d:VOICE-prohibited-uses
  name: Prohibited uses
  description: Uses forbidden by the registered access agreement.
  prohibition_reason:
  - The dataset is not to be used to attempt to re-identify research participants, nor for any actions
    that could reasonably lead to re-identification.
  - The dataset is not to be used for any purpose that could foreseeably cause harm or stigmatization
    to research participants, their families, communities or specific populations.
  - Intellectual property protections, database rights or related rights may not be used in a manner that
    restricts or limits access to any part of the dataset or to any conclusions derived from it, ensuring
    that future use of the dataset remains unrestricted in alignment with the Open Science principles
    upheld by the consortium.
  - Sale of all or part of the data on any media is not permitted, and collaborators at other research
    organizations and other research teams at the same organization must apply independently for access
    and sign a Data Transfer and Use Agreement before accessing the data.
