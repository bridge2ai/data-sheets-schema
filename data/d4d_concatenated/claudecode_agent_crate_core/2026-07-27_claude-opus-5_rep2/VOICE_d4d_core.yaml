- id: d4d:VOICE-creator-curator-backgrounds
  name: Curator and generator expertise profile
  description: 'The curators and generators of the Bridge2AI-Voice dataset come from a diverse range of
    backgrounds reflecting the interdisciplinary nature of the project: clinicians and healthcare professionals
    involved in direct collection of clinical data; biomedical researchers with expertise in clinical
    medicine, neurology and psychiatry; machine learning and AI specialists; data scientists and statisticians
    skilled in data curation, preprocessing and statistical analysis; social scientists and ethicists
    ensuring the dataset is ethically sourced and meets standards for privacy and consent; and engineers
    and technologists contributing software development, systems engineering and data infrastructure.
    The consortium gathered approximately 50 multidisciplinary experts from 12 North American institutions.'
