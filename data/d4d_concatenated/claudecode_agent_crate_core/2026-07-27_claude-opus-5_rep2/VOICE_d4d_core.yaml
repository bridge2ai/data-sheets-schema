license_and_use_terms:
  id: d4d:VOICE-license-and-use-terms
  name: License and terms of use
  description: Licensing, data use agreements and access tiers.
  license_terms:
  - 'License for files: Bridge2AI Voice Registered Access License. Data use agreement: Bridge2AI Voice
    Registered Access Agreement.'
  - For PhysioNet v1.1 the access policy was that only registered users who sign the specified data use
    agreement can access the files; for v3.0.0, v3.1.0 and the pediatric v1.1.0 the access policy is that
    only credentialed users who sign the DUA can access the files, with no training required.
  - Registered access to the features-only data requires registering on PhysioNet, confirming identity,
    and signing the Bridge2AI-Voice Registered Access Agreement.
  - Controlled access to the raw audio data requires completing the Data Access Request Form, completing
    the Data Use Agreement, submitting the application to the Data Access Compliance Office for review,
    and, upon approval, ensuring a Data Use and Transfer Agreement is signed by an authorized official
    at the recipient institution.
  - The dataset is intended solely for commercial and non-commercial research purposes by Authorized Researchers;
    the consent does not restrict the data to non-commercial use, to a specific geographic location, to
    a specific type of research, to genetic research, or to research that does not involve the development
    of methods or algorithms.
  - There are no fees associated with the licence restrictions.
  - The Data Transfer and Use Agreement is between the University of South Florida Board of Trustees as
    provider and a recipient institution; its term ends two years after the start date, upon completion
    of the project, upon expiration of the applicable ethics approval, or on termination by the provider
    institution, whichever occurs first, and it is effective only upon review and approval by the Data
    Access Compliance Office through a distinct application.
  - Data delivered under the agreement is provided "AS IS", with no representations or warranties of any
    kind, express or implied, including no warranties of merchantability or fitness for a particular purpose
    or non-infringement; the recipient assumes all liability for damages arising from its use, storage,
    disclosure or disposal of the data.
  - Recipients must recognize the contribution of the provider as the source of the data in all written,
    visual or oral public disclosures of research using the data, are encouraged to make results publicly
    available in open-access journals or pre-print servers, and must adhere to the specific requirements
    of PhysioNet.org.
  - Access questions and controlled-access applications are handled by the Bridge2AI-Voice Data Access
    Compliance Office at DACO@b2ai-voice.org; the general dataset contact recorded in the v3.0.0 RO-Crate
    is https://b2ai-voice.org/contact-us/.
  - The v3.0.0 RO-Crate records the licence URL as https://physionet.org/content/b2ai-voice/view-license/3.0.0/,
    the conditions of access as https://physionet.org/content/b2ai-voice/view-dua/3.0.0/, and the copyright
    notice as "Copyright (c) 2026 University of South Florida all rights reserved".
  - The project documentation repository and the docs site are released under the MIT license; the b2aiprep
    preparation library is released under Apache-2.0.
  data_use_permission:
  - general_research_use
  - user_specific
  contact_person: d4d:VOICE-person-daco
ip_restrictions:
  id: d4d:VOICE-ip-restrictions
  name: Intellectual property restrictions
  description: IP terms attaching to the data and to downstream work.
  restrictions:
  - Users of the dataset must agree to the terms laid out in the registered access agreement. The data
    may be protected by copyright and other rights, including other intellectual property rights. Duplication,
    as reasonably required to carry out the research project with the data, is permitted. Sale of all
    or part of the data on any media is not permitted.
  - Nothing in the agreement operates to transfer any intellectual property rights in or relating to the
    data to the user; users agree not to make intellectual property claims on the data and not to use
    intellectual property protection in ways that would prevent or block access to, or use of, any element
    of the data or conclusions drawn directly from it.
  - Users may elect to perform further research that adds intellectual and resource capital to the data
    and to obtain intellectual property rights on those downstream discoveries, but agree to implement
    licensing policies that will not obstruct further research and to respect the Fort Lauderdale Agreement.
  - No IP-based restrictions have been imposed by third parties on the data associated with the instances.
  - The data provider provides no guarantees that the data is free of third-party intellectual property
    rights, database rights and other related rights.
regulatory_restrictions:
  id: d4d:VOICE-regulatory-restrictions
  name: Regulatory and compliance restrictions
  description: Export controls, compliance status and confidentiality level.
  hipaa_compliant: compliant
  confidentiality_level: restricted
  regulatory_restrictions:
  - No export controls apply to the dataset.
  - The data transfer and use agreement records that the data is covered under a Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant.
  - The data is Personally Identifiable Information as defined in OMB Memorandum M-07-16 and is not covered
    under HIPAA, FERPA or similar laws requiring special terms beyond those in the agreement's data-specific
    terms and conditions.
  - Neither party may use the other party's name, trademarks or logos in publicity, advertising or news
    releases without prior written approval.
  - The provider may unilaterally amend the agreement should the federal sponsor require revision; if
    the recipient objects, the agreement terminates immediately and the recipient must return or destroy
    all data.
  other_compliance:
  - HIPAA de-identification rules are applied to the dataset; HIPAA Safe Harbor identifiers were removed;
    direct identifiers are removed; dates are rebased or replaced by integers; geographic information
    is removed or generalized; narrative text fields are removed. K-anonymization (k>=2) is not achieved.
  - Recipients must store data with security controls adequate to protect Personally Identifiable Information,
    including administrative, physical and technical safeguards that covered entities and business associates
    must put in place to secure electronic protected health information.
  - Recipients must notify the provider of any unauthorized use or disclosure as soon as possible and
    no later than 5 business days after discovery.
  - The v3.0.0 RO-Crate records the dataset as de-identified, involving human subjects, not FDA regulated,
    and with a confidentiality level of "Limited dataset available with Data Use Agreement", and names
    Satrajit Ghosh, PhD (McGovern Institute for Brain Research, Massachusetts Institute of Technology)
    as the dataGovernanceCommittee for the dataset.
  - A repository notice on the project documentation site states that the repository is under review for
    potential modification in compliance with Administration directives.
  governance_committee_contact: d4d:VOICE-person-satrajit-ghosh
maintainers:
- id: d4d:VOICE-maintainer-consortium
  name: Bridge2AI-Voice Consortium
  role: academic_institution
  description: Primary curator and maintainer of the dataset.
  maintainer_details:
  - The dataset is supported by the NIH via the Bridge2AI project. The curator of the data may be contacted
    at the Bridge2AI-Voice project contact address; the v3.0.0 RO-Crate records the contact point as https://b2ai-voice.org/contact-us/.
  - Releases are coordinated by the Bridge2AI-Voice project team together with the MIT Laboratory for
    Computational Physiology.
  - The v3.0.0 RO-Crate names Satrajit Ghosh as the data governance committee, and both packaged computations
    were run by "Alastair".
- id: d4d:VOICE-maintainer-physionet
  name: PhysioNet / MIT Laboratory for Computational Physiology
  role: academic_institution
  description: Hosting platform and publisher of the current releases.
  maintainer_details:
  - PhysioNet is recorded as the publisher of the dataset in the v3.0.0 RO-Crate and hosts both the adult
    and pediatric releases.
  - PhysioNet is maintained by the MIT Laboratory for Computational Physiology and supported by NIBIB,
    NHLBI and the NIH Office of the Director under NIH grant numbers U24EB037545 and R01EB030362.
- id: d4d:VOICE-maintainer-healthdatanexus
  name: Health Data Nexus / T-CAIREM
