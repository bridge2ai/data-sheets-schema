id: https://doi.org/10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'Bridge2AI-Voice is a flagship, ethically sourced, demographically diverse voice, speech
  and respiratory-sound dataset linked to multimodal health information, produced by the Bridge2AI-Voice
  consortium under the NIH Common Fund Bridge2AI program. Participants perform standardized acoustic tasks
  (sustained vowels, glides, diadochokinesis, validated reading passages, free speech, cough and breathing
  sounds) and complete demographic, confounder, medical-history and disease-specific validated questionnaires;
  clinician-assigned gold-standard diagnoses are recorded for five disease cohort categories (voice disorders,
  neurological and neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders,
  and pediatric voice and speech disorders) plus controls. The public releases are feature-only: they
  contain de-identified derived representations of the audio (spectrograms, mel spectrograms, MFCCs, pitch,
  loudness, periodicity, articulatory EMA traces, phonetic posteriorgrams and openSMILE/Praat static features)
  together with tabular phenotype tables and JSON data dictionaries, but not the original waveforms. The
  current adult release is PhysioNet v3.1.0 (published 2026-05-01), containing data for 833 participants
  collected across five North American sites; it is a minor update over v3.0.0 with no new participants.
  A separate Bridge2AI-Voice Pediatric Dataset (PhysioNet v1.1.0, 300 participants aged 2-18) is published
  as its own PhysioNet project. Raw audio for both cohorts is distributed only through a controlled-access
  process via Synapse.'
