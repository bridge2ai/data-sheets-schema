    or fees are asserted to apply to future users.
purposes:
- id: d4d:VOICE-purpose-flagship-voice-database
  name: Create a flagship, ethically sourced, diverse voice dataset linked to health information
  description: Primary motivation for creating the dataset.
  response: The Bridge2AI-Voice dataset was created to address a gap in the availability of large-scale,
    diverse and well-documented voice data for use in clinical machine-learning applications. Previous
    studies on machine-learning-based voice diagnosis produced promising results, but their sample sizes
    were too small or they lacked the key metadata needed for training robust, clinically useful models.
    The dataset aims to bridge this gap by providing an ethically sourced, large and diverse dataset to
    develop, benchmark or validate clinically applicable AI/ML models. The goal is to facilitate the use
    of voice as a non-invasive, cost-effective biomarker for the screening, diagnosis and monitoring of
    a wide range of health conditions.
- id: d4d:VOICE-purpose-audiomics-standards
  name: Establish standards and infrastructure for audiomics
  description: Secondary motivation covering standards, interoperability and workforce development.
  response: Beyond the primary deliverable of a publicly available voice database, the consortium set
    out to ensure quality and accuracy of acoustic and associated clinical data through clinical validation
    and evidence-based recording protocols; to achieve interoperability by creating new bioinformatics
    standards for voice data; to create benchmarks of diversity metrics and minimize the risk of algorithmic
    bias; to define ethical and legal norms safeguarding patients' data while supporting data-sharing
    efforts; to develop infrastructure for audiomics data storage and sharing within and across research
    institutions; and to formulate training pathways for scientists, engineers, bioethicists and clinicians
    to develop skills in audiomics.
- id: d4d:VOICE-purpose-applications
  name: Intended application domain
  description: Type of application the dataset is meant to address.
  response: The Bridge2AI-Voice dataset is primarily intended for research applications, specifically
    the development of AI and machine-learning models for healthcare. It aims to support clinical research
    in disease screening, diagnosis and monitoring through voice biomarkers. The dataset can be used for
    AI model pretraining, fine-tuning, benchmarking or validation.
tasks:
- id: d4d:VOICE-task-disease-classification
  name: Voice-based disease detection and classification
  description: Predefined machine-learning tasks supplied with the release.
  response: The current version of the dataset comes with predefined tasks and labeling. The tasks are
    primarily designed for training machine-learning models for disease detection and classification using
    voice data. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders. However, there are no predefined recommended data
    splits for training, validation or testing; researchers are encouraged to create their own data splits
    based on their specific requirements.
- id: d4d:VOICE-task-benchmarking-validation
  name: Benchmarking and validation of voice-biomarker algorithms
  description: Task family named in the RO-Crate use-case statement.
  response: Benchmarking and validation of existing voice-biomarker algorithms by testing their performance
    on a clinically diverse, multi-site cohort with standardized tasks and rich phenotype data.
- id: d4d:VOICE-task-acoustic-correlates
  name: Exploratory research on acoustic correlates of disease
  description: Task family named in the RO-Crate use-case statement.
  response: Exploratory research on acoustic, phonetic, prosodic and articulatory correlates of disease
    using de-identified derived features, including work on representation learning, domain adaptation
    and multimodal integration with other health data.
- id: d4d:VOICE-task-fairness-robustness
  name: Methodological research on fairness and robustness in clinical voice models
  description: Task family named in the RO-Crate use-case statement.
  response: Methodological research on fairness, robustness and AI safety in clinical voice models, including
    studies of bias related to demographic subgroups or recording conditions, subject to the ethical constraints
    in the data use agreement.
addressing_gaps:
- id: d4d:VOICE-gap-small-fragmented-datasets
  name: Small, private and non-standardized voice datasets
  description: The core gap in the field that the dataset was built to fill.
  response: Prior literature on voice as a biomarker was limited to small- to medium-sized datasets, often
    using voice as the only data type and without linkage to multimodal health data. Comparing studies
    and pooling data is difficult because standards for how voice and speech are measured and collected
    are lacking. Industry holds vast amounts of voice data but lacks accurate clinical or demographic
    annotation, which prevents external auditing of training datasets for fair representation. When machine-learning
    applications for laryngeal cancer screening and diagnosis were reviewed, most studies reported training
    datasets of fewer than 300 patients and only two studies used more than one data modality.
- id: d4d:VOICE-gap-pediatric-normative-data
  name: Absence of large-scale pediatric voice datasets
  description: Gap addressed by the separate pediatric cohort.
  response: Pediatric and adult voice/speech production are fundamentally different because the respiratory
    system and larynx undergo rapid functional maturation throughout childhood, so normative data from
    adults cannot be generalized to pediatric populations. Despite the clinical importance of detecting
    pediatric communication disorders such as autism spectrum disorder and speech delays, the availability
    of large-scale pediatric datasets remains limited, in part because data collection in pediatric populations
    poses unique challenges of privacy, consent and the need for developmentally appropriate tasks.
- id: d4d:VOICE-gap-governance-framework
  name: Missing governance framework for voice AI
  description: Ethical and legal gap the consortium set out to address.
  response: The unique ethical and legal challenges in audiomics, linked to the Health Insurance Portability
    and Accountability Act, potential re-identification of patients by their voice, voice hacking and
    data ownership, call for a new governance framework covering diversity, data handling and privacy
    safeguards.
