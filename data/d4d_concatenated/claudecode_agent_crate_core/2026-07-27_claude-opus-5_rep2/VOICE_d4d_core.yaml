    hosting that dataset and provides continued access to interested researchers.
errata:
- id: d4d:VOICE-errata
  name: Erratum policy
  description: Whether an erratum exists and how corrections are communicated.
  erratum_details:
  - There is no erratum. A changelog for each dataset version is published online with the dataset metadata.
  - 'Corrections are communicated through release notes: v2.0.1 corrected the authorship list; v2.0 reprocessed
    spectrograms to fix minor issues identified in the previous release; v3.1.0 fixed broken parquet files
    from the previous release and back-filled validated diagnosis information across conditions.'
updates:
  id: d4d:VOICE-updates
  name: Update plan
  description: How and how often the dataset is updated.
  frequency: Further versions of the dataset will be released on a semi-annual (twice a year) basis. Observed
    adult release cadence is v1.1 (2025-01-17), v2.0.0 (2025-04-16), v2.0.1 (2025-08-18), v3.0.0 (2025-12-16)
    and v3.1.0 (2026-05-01).
  update_details:
  - Yes, further versions of the dataset will be released, distributed as new versions on the hosting
    platform. Users will be notified through news items on the platform as well as through standard communication
    channels.
  - Dataset releases follow a static versioning scheme managed through PhysioNet and related platforms,
    with version numbers such as 1.0, 1.1, 2.0.0, 2.0.1 and 3.0.0 and associated DOIs for each snapshot
    and for the latest version. The dataset is released as static versions rather than being dynamically
    updated.
  - Releases are coordinated by the Bridge2AI-Voice project team and the MIT Laboratory for Computational
    Physiology; release notes document added participants, new feature sets, reorganized phenotype tables
    and corrections such as spectrogram reprocessing and authorship updates.
  - Future updates are planned as additional participants are enrolled and Spanish-language protocols
    are incorporated; older versions remain accessible for reproducibility while users are encouraged
    to adopt the latest version.
retention_limit:
  id: d4d:VOICE-retention-limit
  name: Data retention limits
  description: Limits on retention of participant-related data.
  retention_period: Indefinite for the research dataset; five years minimum for consent documentation;
    up to ten years for institutionally held identifiable data; two years from the start date for data
    held by an external recipient under a Data Transfer and Use Agreement.
  retention_details:
  - Once data is contributed, the data will be retained as long as it is useful for research purposes,
    possibly indefinitely.
  - The USF IRB requires de-identified study data and original consent forms to be stored for a minimum
    of five years after the completion of the study; original paper consent documents cannot be destroyed
    until five years after study completion even if uploaded to Florence.
  - Identifiable data and datasheets linking participant numbers to participant information are kept at
    each institution on local cloud storage for a maximum of ten years after study completion and are
    then destroyed, which is the responsibility of each local principal investigator.
  - Under the Data Transfer and Use Agreement, disposition is required two years after the start date,
    upon completion of the project, upon termination, or upon expiration of the applicable ethics approval,
    whichever occurs first; data must be destroyed in accordance with the provider's instructions and
    a written certification of destruction submitted within thirty days of termination or expiration.
    A recipient may retain one archival copy to the extent necessary to comply with records retention
    requirements under law, regulation or institutional policy and for research integrity and verification,
    with the agreement's restrictions surviving for as long as the recipient holds it.
version_access:
  id: d4d:VOICE-version-access
  name: Version availability
  description: Which versions remain available and how they are identified.
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - Adult v1.1, published 2025-01-17, DOI 10.13026/249v-w155 (files no longer available)
  - Adult v2.0.0, published 2025-04-16
  - Adult v2.0.1, published 2025-08-18
  - Adult v3.0.0, published 2025-12-16, DOI 10.13026/k81f-qr68
  - Adult v3.1.0, published 2026-05-01, DOI 10.13026/8xbn-nq66 (current)
  - Pediatric v1.0.0, published 2025-12-17
  - Pediatric v1.1.0, published 2026-05-01, DOI 10.13026/h995-bt35 (current)
  version_details:
  - By default, older versions of the dataset will continue to be supported, hosted and made available
    to researchers. Each version of the dataset has a unique DOI. The dataset publishers reserve the right
    to remove access to older versions.
  - The adult latest-version DOI is 10.13026/37yb-1t42 and the pediatric latest-version DOI is 10.13026/mf9s-5r03.
  - The files for adult version 1.1 are no longer available on PhysioNet; that page directs users to the
    latest version.
  - Older versions remain accessible for reproducibility while users are encouraged to adopt the latest
    version.
extension_mechanism:
  id: d4d:VOICE-extension-mechanism
  name: Extension and contribution mechanism
  description: How others may extend, augment or contribute to the dataset.
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
  - For dataset extensions and augmentations, it is possible for others to publish a derivative dataset
    on the hosting platform which references the original source. These derivative datasets may be made
    available under the same conditions as the source data.
  - For augmentations to the code used to produce the data, the open-source repositories have discussion
    forums and issue pages which allow for public discussion of data preprocessing. The repository also
    has a pull request mechanism for contributing improvements to the data preprocessing code.
  - Guidance for new labels is that the process for any new labels should be described alongside any release
    of a model or publication, and should include the exact variables used for the determination.
is_deidentified:
  id: d4d:VOICE-deidentification
  name: De-identification status
  description: Level and method of de-identification applied to the released data.
  identifiable_elements_present: false
  method: Identifiable information, under HIPAA and the Common Rule, as well as data considered sensitive,
    has been removed from this dataset. HIPAA de-identification rules are applied; the dataset is recorded
    as deidentified in the v3.0.0 RO-Crate.
  identifiers_removed:
  - Names
  - Civic and street addresses
  - Social security numbers
  - Geographic locators; state and province removed, country of data collection retained
  - Date information at a resolution finer than years; dates rebased or replaced by integers
  - Phone and fax numbers
  - Email addresses
  - IP addresses
  - Medical record numbers
  - Health plan beneficiary numbers
  - Device identifiers
  - Licence numbers
  - Account numbers
  - Vehicle identifiers
  - Website URLs
  - Full-face photographs
  - Biometric identifiers, including all raw voice waveforms
  - Narrative text fields and transcripts of free speech audio
  - Select geographic or demographic indirect identifiers and some information about household composition
    or cultural identity
  - Non-identifying but highly sensitive elements such as household income, mental health status and traumatic
    life experiences
  deidentification_details:
  - The dataset removes direct identifiers, applies the HIPAA de-identification rules, rebases and/or
    replaces dates by integers, removes or generalizes geographic information and removes narrative text
    fields, but does not achieve K-anonymization (k>=2).
  - This dataset has been de-identified through removal of all audio data and certain sensitive fields
    identified by a team of ethicists.
  - For v3.0.0, raw audio transcripts were reviewed and any audio recordings that contained potentially
    identifying information or external voices were removed from the release, and all sensitive fields,
    corresponding to data elements encoded as sensitive under the column name "Identifier?" in the REDCap
    data dictionary, were removed at that stage.
  - For the pediatric v1.1.0 release, audio features for all free-speech tasks were manually checked for
    the presence of unconsented speakers and personally identifiable information before release.
