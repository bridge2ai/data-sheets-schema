purposes:
- name: Flagship dataset for voice as a biomarker of health
  response: >-
    The Bridge2AI-Voice project seeks to create an ethically sourced flagship
    dataset to enable future research in artificial intelligence and support
    critical insights into the use of voice as a biomarker of health.
- name: Pediatric voice data integrated with demographic information
  response: >-
    The dataset page states that establishing a robust multi-institutional
    dataset that integrates pediatric voice data with demographic information
    would advance the understanding of voice and disease as well as early
    detection and intervention.
addressing_gaps:
- name: Limited availability of pediatric voice datasets
  response: >-
    The availability of large-scale pediatric datasets is limited; the
    challenges of data collection in pediatric populations (privacy issues,
    consent processes, the need for developmentally appropriate tasks) have
    contributed to the lack of publicly available pediatric data sets that
    enable machine learning for pediatric voice analysis.
- name: Adult evidence does not generalize to children
  response: >-
    Pediatric and adult voice and speech production are fundamentally
    different, so the evidence and normative data available for adults cannot
    be generalized to pediatric populations.
intended_uses:
- name: Study of developmental norms
  description: Enable study of developmental norms.
- name: AI-driven tools for early screening
  description: Create AI-driven tools for early screening.
- name: Clinical insight
  description: Support clinical insight.
