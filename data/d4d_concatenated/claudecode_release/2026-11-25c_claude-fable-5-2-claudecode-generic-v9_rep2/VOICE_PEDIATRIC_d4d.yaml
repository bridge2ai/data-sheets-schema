sampling_strategies:
- name: Enrollment at the Hospital for Sick Children
  description: >-
    Patients were considered eligible if they fulfilled the inclusion criteria
    of 2 to 18 years of age and English proficiency. Exclusion criteria
    included participants over 18 years of age and individuals who were
    non-verbal. Non-patients were evaluated for eligibility based on the
    study's inclusion and exclusion criteria.
  source_data: >-
    Patients and healthy volunteers at the Hospital for Sick Children, and
    non-patients recruited through research postings. The project
    documentation states that pediatric participants are recruited strictly
    from the Hospital for Sick Children (SickKids).
collection_mechanisms:
- name: reproschema-ui on tablets
  mechanism_details: >-
    All data was collected through customized software, reproschema-ui, on
    tablets. The project documentation states that for pediatrics all data is
    collected using reproschema-ui with the Bridge2AI-Voice pediatric
    protocol.
  used_software:
  - id: doi:10.13026/h995-bt35#software-reproschema-ui
    name: reproschema-ui
- name: Headset
  mechanism_details: A headset was used to record for most participants.
- name: Built-in tablet microphone
  mechanism_details: >-
    The remaining recordings utilized the built-in tablet microphone due to
    low tolerance of wearing headphones or existing complex medical
    conditions.
acquisition_methods:
- name: Voice and speech recordings
  was_directly_observed: true
  acquisition_details: >-
    Recordings were made with a headset for most participants and with the
    built-in tablet microphone for the rest. The project documentation states
    that voice, breathing, cough, and speech data are recorded with
    reproschema-ui for pediatrics. Its table of acoustic tasks in the protocol
    marks the following tasks with the part Peds: ABC's (recalling alphabet),
    Ready For School (recalling a typical day preparing for school), Favorite
    Show (recalling favorite shows), Favorite Food (describing their favorite
    food), Outside of School (after school activities description), Months
    (listing the months), Counting, Naming Animals (listing animals), Naming
    Food (listing foods), Identifying Pictures (picture identification),
    Picture Description (Pediatrics) (describing a picture), Long Sounds
    (sustained /ee/ and /ah/ sounds), Noisy Sounds (/jj/ /ah/ /ee/ /oo/ /sh/
    /ss/ /muh/ /nuh/ /zz/ /hh/), Caterpillar Passage (Pediatrics) (validated
    passage), Repeat Words (word repetition), Role naming (recalling days,
    months, and counting from 60 – 70), Repeat Sentences (sentence recall) and
    Silly Sounds (/PUH/ /TUH/ /KUH/ /PUH TUH KUH/).
- name: Demographic information and questionnaires
  acquisition_details: >-
    The protocol included the collection of demographic information, voice and
    speech related questionnaires, and questionnaires inquiring about medical
    history. For participants without adequate comprehension and familiarity
    with their past medical history, parents or decision-makers completed the
    survey during the recording on a separate tablet.
  source_caveats: >-
    The project documentation's table of validated questionnaires has a
    Pediatrics column, but the extracted text does not preserve which column
    each mark belongs to, so no named questionnaire is assigned to the
    pediatric cohort here.
- name: Derived audio features
  was_inferred_derived: true
  acquisition_details: >-
    The published dataset contains derived features from the audio waveforms.
direct_collection:
- name: Collection from participants in one session
  is_direct: true
  collection_details: >-
    All participants completed the recording and demographic data collection
    in one session; where a participant lacked adequate comprehension of and
    familiarity with their past medical history, parents or decision-makers
    completed the survey.
