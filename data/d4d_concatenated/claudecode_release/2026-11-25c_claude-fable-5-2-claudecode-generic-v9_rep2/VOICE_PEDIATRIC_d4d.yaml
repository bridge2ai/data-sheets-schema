id: doi:10.13026/h995-bt35
name: Bridge2AI-Voice Pediatric Dataset
title: Bridge2AI-Voice Pediatric Dataset
description: >-
  The Bridge2AI-Voice Pediatric Dataset v1.1.0 contains derived audio features
  for 23,533 recordings collected from 300 participants aged 2-18. The release
  contains data considered low risk, including derivations such as spectrograms
  but not the original voice recordings. Detailed demographic, clinical, and
  validated questionnaire data are also made available. The dataset holds
  derived audio data features, phenotypic information acquired during data
  collection, and metadata information for the recordings.
