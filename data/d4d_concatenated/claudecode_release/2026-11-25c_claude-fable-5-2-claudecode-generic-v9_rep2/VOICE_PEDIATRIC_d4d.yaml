source_caveats: >-
  Only one of the six sources in the bundle, the PhysioNet page for release
  1.1.0, is about the pediatric dataset itself. The other five (an
  institutional review board protocol titled Bridge2AI Voice Data Acquisition,
  the project documentation site, an NIH RePORTER project page, a Data
  Transfer and Use Agreement template and a documentation repository README)
  describe the wider Bridge2AI-Voice project and its adult dataset. Values
  were taken from them only where the passage is about the pediatric cohort,
  about a named person, or about the project as a whole; their statements
  about the adult dataset (its counts, de-identification, consent details,
  compensation, hosting, update cadence and retention) are not recorded as
  facts about this dataset. The project documentation states that the
  pediatric dataset v1.0 is available containing data from 300 participants
  and, in a separate banner, that the v1.1.0 pediatric dataset is available;
  the PhysioNet page states that no new participants were released in v1.1,
  so the statements are compatible. The PhysioNet page writes the feature file
  names two ways: the data description names torchaudio_spectrograms.parquet
  and torchaudio_mel_spectrograms.parquet, the usage notes load
  torchaudio_spectrogram.parquet and torchaudio_mel_spectrogram.parquet, and
  the data dictionary example is torch_spectrogram.json; the data description
  names are the ones recorded. The PhysioNet page footer line "Maintained by
  the MIT Laboratory for Computational Physiology" and the grant numbers that
  follow it describe the PhysioNet platform, as the agreement template in the
  bundle confirms, and are not recorded as the maintainer or funders of this
  dataset. The page states that the corresponding author's contact
  information is visible only to logged-in users, so no corresponding author
  is recorded.
