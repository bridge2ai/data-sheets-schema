  ethics_review_board: Research Ethics Board at the Hospital for Sick Children
ethical_reviews:
- name: Research Ethics Board approval
  reviewing_organization: Research Ethics Board at the Hospital for Sick Children
  review_details: >-
    Data collection and sharing was approved by the Research Ethics Board at
    the Hospital for Sick Children. The Bridge2AI Voice Data Acquisition
    protocol states that the Canadian institutions (MSH, SickKids and UofT) do
    not abide by the single IRB process and will apply for a separate research
    ethics board (REB) application to comply with the Canadian regulations.
participant_privacy:
- name: Manual check of free speech tasks
  privacy_techniques: >-
    Version 1.1 releases audio features for all free speech tasks that were
    manually checked for presence of unconsented speakers and PII.
sensitive_elements:
- name: Low-risk release without original recordings
  sensitivity_details: >-
    The release contains data considered low risk, including derivations such
    as spectrograms but not the original voice recordings. Spectrograms, Mel
    spectrograms, MFC coefficients, PPGs, and EMAs for sensitive records and
    audio checks have been removed from v1.1.
preprocessing_strategies:
- name: Export and conversion to tab-delimited values
  preprocessing_details: >-
    Data were exported and converted to tab delimited values using an open
    source library developed by the team.
- name: Feature extraction and phenotype merging with b2aiprep
  preprocessing_details: >-
    The code used to preprocess the raw audio waveforms into the parquet files
    and to merge the source data into the phenotype files has been made open
    source in the b2aiprep library.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    description: >-
      Bridge2AI Data Processing Library, cited by the dataset page as computer
      software.
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    license: Apache-2.0
- name: Static feature derivation
  preprocessing_details: >-
    Features derived from the open-source Speech and Music Interpretation by
    Large-space Extraction (openSMILE), Praat, parselmouth, and torchaudio are
    provided in a plain-text file.
  used_software:
  - id: doi:10.13026/h995-bt35#software-opensmile
    name: openSMILE
  - id: doi:10.13026/h995-bt35#software-praat
    name: Praat
  - id: doi:10.13026/h995-bt35#software-parselmouth
    name: parselmouth
  - id: doi:10.13026/h995-bt35#software-torchaudio
    name: torchaudio
- name: Conversion to the Brain Imaging Data Structure
  preprocessing_details: >-
    The project documentation states that pediatric data collected through
    ReproSchema-UI is extracted and transformed into REDCap format, and
    subsequently converted to the Brain Imaging Data Structure (BIDS); the raw
    audio files and the questionnaire data retrieved from ReproSchema-UI or
    exported from REDCap were converted to be compliant with the Brain Imaging
    Data Structure v1.9.0.
cleaning_strategies:
- name: Removal of features for sensitive records and audio checks
  cleaning_details: >-
    Spectrograms, Mel spectrograms, MFC coefficients, PPGs, and EMAs for
    sensitive records and audio checks have been removed from v1.1.
missing_data_documentation:
- name: Features that could not be generated
  missing_data_patterns: >-
    Some files could not generate certain features and so are not included in
    the bundled data.
  missing_data_causes: Length or other issues.
raw_sources:
- name: Raw audio recordings
  access_url: https://www.synapse.org/Synapse:syn73617068
  raw_data_details: >-
    The PhysioNet project contains derived features from the audio waveforms
    and does not contain raw audio. The dataset page states that raw audio
    access for the pediatric cohort is via Synapse and that data will be made
    available via Synapse; accessing raw audio is a more involved process and
    requires institutional sign off. The project documentation states that
    raw audio data is disseminated through controlled access only to protect
    participants' privacy.
file_collections:
- id: doi:10.13026/h995-bt35#collection-features
  name: features
  path: features
  description: >-
    Derived audio data features. In addition to the parquet feature files, the
    folder contains a plain-text file of static features; the page also names
    a file of audio quality metrics. Each
    file is associated with a data dictionary file that has the same file stem
    and a JSON suffix, structured as a dictionary whose keys are the column
    names of the associated data file and whose values give further detail,
    including a one sentence description of the column.
  resources:
  - id: doi:10.13026/h995-bt35#file-torchaudio_spectrograms.parquet
    name: torchaudio_spectrograms.parquet
    file_type: data_file
    description: >-
      Spectrograms of dimension 201xT generated using the short-time Fast
      Fourier Transform (FFT) with a 25ms window size, 10ms hop length, and a
      400-point FFT (n=23533).
  - id: doi:10.13026/h995-bt35#file-torchaudio_mel_spectrograms.parquet
    name: torchaudio_mel_spectrograms.parquet
    file_type: data_file
    description: >-
      Mel spectrograms of dimension 60xT generated with a 25ms window size,
      10ms hop length, a 400-point FFT and 60 Mel bins (n=23533).
  - id: doi:10.13026/h995-bt35#file-torchaudio_mfcc.parquet
    name: torchaudio_mfcc.parquet
    file_type: data_file
    description: >-
      Mel-frequency cepstrum coefficients of dimension 60xT using the same
      parameters as the mel spectrograms (n=23533).
  - id: doi:10.13026/h995-bt35#file-torchaudio_pitch.parquet
    name: torchaudio_pitch.parquet
    file_type: data_file
    description: >-
      Detected pitch (fundamental frequency) over time, of dimension T, with a
      min and max pitch of 80 and 500 respectively (n=23533).
  - id: doi:10.13026/h995-bt35#file-sparc_ema.parquet
    name: sparc_ema.parquet
    file_type: data_file
    description: >-
      Estimated electromagnetic articulography (EMA) using a deep learning
      model, with dimensions Tx12 where the 12 correspond to X/Y positions of
      six articulators: tongue dorsum (TD), tongue body (TB), tongue tip (TT),
      lower incisor (LI), upper lip (UL) and lower lip (LL) (n=23532).
  - id: doi:10.13026/h995-bt35#file-sparc_loudness.parquet
    name: sparc_loudness.parquet
    file_type: data_file
    description: >-
      Estimated loudness based on the average absolute amplitude of the audio
      waveform, of size T, using 20ms windows (n=23532).
  - id: doi:10.13026/h995-bt35#file-sparc_periodicity.parquet
    name: sparc_periodicity.parquet
    file_type: data_file
    description: >-
      Estimated periodicity (confidence of pitch presence) derived from the
      audio using 20ms windows, of dimension T (n=23532).
  - id: doi:10.13026/h995-bt35#file-sparc_pitch.parquet
    name: sparc_pitch.parquet
    file_type: data_file
    description: >-
      Estimated fundamental frequency (F0) of the audio signal, described by
      the page as using a different algorithm than before, with a range of
      50-550Hz and dimension T (n=23532).
  - id: doi:10.13026/h995-bt35#file-ppgs.parquet
    name: ppgs.parquet
    file_type: data_file
    description: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories,
      giving a dimension of 40xT with a frame rate of 100Hz (n=23533).
  - id: doi:10.13026/h995-bt35#file-static_features.tsv
    name: static_features.tsv
    file_type: data_file
    format: TSV
    media_type: text/tab-separated-values
    description: >-
      Plain-text file in which each feature derived from openSMILE, Praat,
      parselmouth and torchaudio is present.
  - id: doi:10.13026/h995-bt35#file-audio_quality_metrics.tsv
    name: audio_quality_metrics.tsv
    file_type: data_file
    format: TSV
    media_type: text/tab-separated-values
    description: Metrics related to audio quality derived from the recordings.
    source_caveats: >-
      The page names this file in its paragraph on the contents of the
      features folder, directly after static_features.tsv, without restating
      the folder for it; it is listed here on that reading.
- id: doi:10.13026/h995-bt35#collection-phenotype
  name: phenotype
  path: phenotype
  description: >-
    Phenotypic information acquired during data collection. The usage notes
    state that a phenotype file can be loaded with any statistical analysis
    tool and give demographics.tsv as the example file name.
- id: doi:10.13026/h995-bt35#collection-metadata
  name: metadata
  path: metadata
  description: Metadata information for the recordings.
distribution_formats:
- name: Parquet
  format: Parquet
  description: >-
    Binary files are made available as Parquet, an open-source
    column-oriented data file format.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- name: Tab-separated values
  format: TSV
  media_type: text/tab-separated-values
  description: >-
    Plain-text files of static features and audio quality metrics in the
    features folder.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- name: JSON data dictionaries
  format: JSON
  media_type: application/json
  description: >-
    Each data file is associated with a data dictionary file that has the same
    file stem and a JSON suffix.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
distribution_dates:
- name: Version 1.0.0
  release_dates:
  - '2025-12-17'
- name: Version 1.1.0
  release_dates:
  - '2026-05-01'
version_access:
  latest_version_doi: doi:10.13026/mf9s-5r03
  versions_available:
  - 1.0.0 (Dec. 17, 2025)
  - 1.1.0 (May 1, 2026)
  version_details: >-
    Version 1.0 was the first release of the Bridge2AI-Voice Pediatric
    dataset; the project documentation states that the pediatric dataset v1.0
    contains data from 300 participants. Version 1.1 is a minor update in
    which no new participants were released, but which releases audio features
    for all free speech tasks that were manually checked for presence of
    unconsented speakers and PII, and additionally releases new metrics
    related to the audio quality of the recordings and per recording metadata
    information.
license_and_use_terms:
  license_terms: >-
    Only credentialed users who sign the DUA can access the files. The license
    for files is the Bridge2AI Voice Registered Access License and the data
    use agreement is the Bridge2AI Voice Registered Access Agreement; no
    training is required. The project documentation describes registered
    access to the features-only data as registering on PhysioNet and
    confirming identity, then signing the Bridge2AI-Voice Registered Access
    Agreement, which outlines the terms and conditions for data use;
    credentialed users must be approved and sign the DUA.
regulatory_restrictions:
  confidentiality_level: restricted
data_governance:
  committee_name: Data Access Compliance Office
  description: >-
    The dataset page calls this body the access committee and gives
    DACO@b2ai-voice.org as the address to reach it about raw audio access.
  access_review_process: >-
    Accessing raw audio is a more involved process than accessing the derived
    features and requires institutional sign off. The project documentation
    describes controlled access to raw audio data in four steps: complete the
    Data Access Request Form (DARF); complete the Data Use Agreement (DUA);
    submit the application to the Data Access Compliance Office for review;
    and, upon approval, ensure a Data Use and Transfer Agreement (DTUA) is
    signed by an authorized official at the requesting institution.
variables:
- variable_name: participant_id
  description: A unique identifier for the participant.
  data_type: identifier
  is_identifier: true
- variable_name: session_id
  description: A unique identifier for the recording session.
  data_type: identifier
  is_identifier: true
- variable_name: task_name
  description: The task performed.
- variable_name: n_frames
  description: The number of time frames associated with the feature.
related_datasets:
- name: Bridge2AI-Voice Adult Dataset
  target_dataset: https://physionet.org/content/b2ai-voice/
  relationship_type: references
  description: >-
    The pediatric dataset page notes that the Bridge2AI-Voice Adult Dataset is
    also available on PhysioNet. The project documentation states that the
    adult and pediatric datasets are available through separate PhysioNet
    links under registered access, and announces the v3.1.0 adult dataset
    together with the v1.1.0 pediatric dataset.
  source_caveats: >-
    The relationship type is recorded as references because the pediatric
    dataset's own page points to the adult dataset; no passage states a
    derivation, version or part-whole relation between the two. Most of the
    bundle's project documentation, protocol and agreement text describes the
    adult dataset and is not transcribed here.
external_resources:
- name: Bridge2AI-Voice project website
  external_resources:
  - https://b2ai-voice.org/
- name: PhysioNet standard citation
  description: >-
    The dataset page asks users to include the standard citation for
    PhysioNet: Pollard, T., Moody, B. E., Lehman, L., Gow, B., Fernandes, C.,
    Xie, C., Johnson, A., Mark, R. G., & Heldt, T. (2026). PhysioNet as a
    global platform for biomedical research. Nature Health.
  external_resources:
  - https://doi.org/10.1038/s44360-026-00096-z
