source_caveats: >-
  The record describes the adult dataset at its current PhysioNet release,
  3.1.0; the project-level DOI is used as the identifier and the
  version-specific DOI appears in the citation. The project documentation's
  healthsheet was written for an earlier release (it names v2.0.0 and hosting
  on the Health Data Nexus), so values taken from it say so. Two release pages
  of equal rank (3.0.0 and 3.1.0) are in the bundle; the manifest marks 3.0.0
  as superseded by 3.1.0, and 3.1.0 values are stated where the two differ
  (for example the per-file element counts). conforms_to is stated by the
  project documentation for the raw audio files and questionnaire data; the
  3.1.0 release page does not name the standard. The documentation spells two
  investigators differently from the release page ("Jennifer Sui", "Frank
  Rudzizc", against "Jennifer Siu", "Frank Rudzicz"); the release page
  spelling is used. Stated absences are not entered as values: the healthsheet
  answers that there are no predefined recommended data splits, that no
  repository links papers or systems using the dataset, that no analysis of
  the potential impact on data subjects has been conducted, that no export
  controls apply, and that no third parties have imposed IP-based
  restrictions.
