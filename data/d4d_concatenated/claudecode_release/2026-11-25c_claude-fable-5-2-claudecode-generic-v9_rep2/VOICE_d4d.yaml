id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a collection of data derived from voice recordings with
  corresponding clinical information. Version 3.1 contains data for 833
  participants across five sites in North America. Participants were selected
  based on known conditions which manifest within the voice waveform,
  including voice disorders, neurological disorders, mood disorders, and
  respiratory disorders. The release contains data considered low risk,
  including derivations such as spectrograms but not the original voice
  recordings; detailed demographic, clinical, and validated questionnaire data
  are also made available. The dataset contains derived audio data features,
  phenotypic information acquired during data collection, and metadata related
  to the specific audio task and recording.
