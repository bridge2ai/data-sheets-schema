purposes:
  - response: >-
      The Voice project seeks to create an ethically sourced flagship dataset
      to enable future research in artificial intelligence and support
      critical insights into the use of voice as a biomarker of health.
  - response: >-
      The project documentation states that the dataset aims to provide an
      ethically sourced, large, and diverse dataset to develop, benchmark, or
      validate clinically applicable AI/ML models, with the goal of
      facilitating the use of voice as a non-invasive, cost-effective
      biomarker for the screening, diagnosis, and monitoring of a wide range
      of health conditions.
  - response: >-
      The study protocol states its primary objective as building a large
      multi-institutional database of human voices, speech and respiratory
      sounds that is ethically sourced, diverse, and linked to multimodal
      health biomarkers to fuel voice AI research.
tasks:
  - response: >-
      The project documentation states that the tasks are primarily designed
      for training machine-learning models for disease detection and
      classification using voice data.
  - response: >-
      The funded project aims to build predictive models to assist in
      screening, diagnosis, and treatment of a broad range of diseases.
    source_caveats: Stated as an aim in the NIH RePORTER project abstract.
addressing_gaps:
  - response: >-
      The dataset was created to address a gap in the availability of
      large-scale, diverse, and well-documented voice data for use in clinical
      machine-learning applications. Previous studies on machine
      learning-based voice diagnosis produced promising results, but their
      sample sizes were too small, or they lacked the key metadata needed for
      training robust, clinically useful models.
  - response: >-
      Comparing studies and pooling data is challenging due to a lack of
      existing standards in how voice and other acoustics are measured and
      collected.
  - response: >-
      Within the industry, datasets are often private, limiting the ability to
      audit machine-learning models and the accuracy of training data labels.
    source_caveats: >-
      Stated in the audiomics viewpoint as a limitation of the field that the
      project team aims to address.
