funders:
  - grantor: NIH
    grants:
      - name: >-
          Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting
          Standards (CHoRUS) for Equitable AI
        grant_number: OT2OD032701
        description: >-
          NIH RePORTER lists project number 1OT2OD032701-01 (core project number
          OT2OD032701) for fiscal year 2022, with an award amount of 5880300, a
          project start of 2022-09-01 and a project end of 2026-11-30.
    description: >-
      The project website states that the project is funded by the NIH under
      award number OT2OD032701 and that the CHoRUS project is one data generation
      project of four in the NIH-funded Bridge2AI consortium; the NIH project
      abstract places it in the NIH Common Fund's Bridge2AI program.
instances:
  - instance_type: Patient admissions
    counts: 50000
    description: >-
      The project website's snapshot of the current released dataset lists 50,000
      patient admissions from ICU, PICU, and NICU, 1.6 billion rows of EHR OMOP
      data, 7,642 admissions with radiology data, and 23 Tb of waveform data. The
      September 2025 webinar states that, as of August 2025, the dataset covers 14
      different hospitals with over 45K unique admissions.
    source_caveats: >-
      The count is the website's figure for its "Current Released Dataset"; the
      website does not date the snapshot. The webinar's "over 45K unique
      admissions" as of August 2025 is a lower bound from a different observation
      and is compatible with it, so both are kept and neither is treated as a
      conflict.
  - instance_type: Demographics
    description: Data standard listed in the webinar table is OMOP.
  - instance_type: Medication administration
    description: >-
      Dosing time-stamped upon each infusion change or dose administration.
  - instance_type: Procedures
    description: Documentation by providers.
  - instance_type: Nursing flowsheets
    description: High-frequency documentation.
  - instance_type: Diagnoses
    description: Documentation by providers.
  - instance_type: Clinical notes
    description: >-
      Extracted and tokenized using the OHNLP toolkit. The September 2025 webinar
      states that clinical notes are stored locally except tokens.
  - instance_type: Imaging
    description: >-
      Imaging from PACS, with DICOM listed as the data standard. The September
      2025 webinar states that 1000 images were currently available, with
      de-identification in process for the larger cohort.
  - instance_type: Waveform telemetry
    description: >-
      Waveform telemetry from bedside monitors and gateway/middleware, with WFDB
      listed as the data standard.
  - instance_type: Waveform EEG
    description: >-
      Waveform EEG from a hospital database, with EDF+ and Persyst listed as the
      data standard. The September 2025 webinar states that EEG extraction was in
      process at that point.
sampling_strategies:
  - strategies: >-
      Planned, not reported as applied: the 2022 NIH project abstract states the
      project will establish a legal framework for collecting data at scale,
      sampling to ensure comprehensive sets of patient conditions and clinical
      treatment strategies; the GitHub organization overview states that federated
      access will enable sampling methods to ensure a balanced and diverse cohort.
splits:
  - split_details: >-
      Planned: the 2022 NIH project abstract states that the dataset will also
      provision a holdout test set, accessible for model external validation to
      aid marketplace adoption of AI-developed models for implementation in acute
      and critical care.
collection_mechanisms:
  - name: Retrospective data collection
    mechanism_details: >-
      The September 2025 webinar describes the CHoRUS dataset as retrospective
      data collection.
data_collectors:
  - role: Data managers at data contributing sites
    collector_details: >-
      The GitHub organization overview describes data managers at data
      contributing sites following a step-by-step process, documented in standard
      operating protocols (SOPs) in the Chorus_SOP repository, for extracting and
      contributing clinical data to CHoRUS.
raw_data_sources:
  - name: PACS
    source_description: Imaging is drawn from PACS.
  - name: Bedside monitors and gateway/middleware
    source_description: >-
      Waveform telemetry is drawn from bedside monitors and gateway/middleware.
  - name: Hospital database
    source_description: Waveform EEG is drawn from a hospital database.
preprocessing_strategies:
  - name: Standardization to common standards
    preprocessing_details: >-
      The 2022 NIH project abstract states that the project will standardize data
      to the OMOP Common Data Model, and the GitHub organization overview states
      that unified standards will harmonize multi-modal EHR, waveform, imaging,
      and text data. The project website's snapshot of the current released
      dataset counts rows of EHR OMOP data.
  - name: Semantic mapping
    preprocessing_details: >-
      The GitHub organization overview describes a chorus-mapping repository with
      documentation and pooled tabular mappings, along with an associated clinical
      validation SOP for contributing to mapping efforts, and refers to the mapped
      and assembled dataset.
  - name: Clinical note tokenization
    preprocessing_details: >-
      Clinical notes are extracted and tokenized using the OHNLP toolkit.
    used_software:
      - id: https://chorus4ai.org/#software-ohnlp-toolkit
        name: OHNLP toolkit
labeling_strategies:
  - labeling_details: >-
      Planned, not reported as applied: the GitHub organization overview states
      that a visualization and annotation environment will label data with targets
      important for prediction, and the 2022 NIH project abstract lists labeling
      data among the capabilities the project will develop.
is_deidentified:
  deidentification_details: >-
    The 2022 NIH project abstract states that the project will transform data
    using approaches that limit re-identification. The September 2025 webinar
    states that de-identification of imaging was in process for the larger cohort.
existing_uses:
  - name: Training activities
    description: >-
      The September 2025 webinar states that the datasets are being used for
      training activities. The AIM-AHEAD Bridge2AI for Clinical Care Training
      Program expands access to Bridge2AI CHoRUS data through engagement, AI
      training, and mentorship; the webinar states that trainees will receive
      hands-on training on the Bridge2AI AI/ML for Clinical Care Network.
  - name: Publications
    description: >-
      The September 2025 webinar states that the datasets are being used for
      publications.
intended_uses:
  - description: >-
      Building machine-learning (ML) and artificial intelligence (AI)-derived
      models to improve the care and outcomes of patients requiring critical care.
distribution_formats:
  - description: >-
      The data are held in a cloud enclave. The September 2025 webinar states that
      OMOP and telemetry data are in the enclave, except that clinical notes are
      stored locally except tokens, 1000 images were currently available, and EEG
      extraction was in process.
license_and_use_terms:
  license_terms: >-
    Controlled access. The September 2025 webinar states that all participants
    in the AIM-AHEAD Bridge2AI for Clinical Care Training Program must sign a
    licensing agreement, included in the registration form, before gaining access
    to the dataset.
data_governance:
  access_review_process: >-
    For participants in the AIM-AHEAD Bridge2AI for Clinical Care Training
    Program, the September 2025 webinar describes a registration process:
    participants fill out a registration form with name, email, and institution,
    and an email is sent once access is granted and compute is provisioned. A
    ".edu" email address is needed to gain access to the dataset, and program
    administrators will assist with this access if needed. The GitHub
    organization overview captured on 2025-11-14 directs access requests to
    dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
updates:
  update_details: >-
    The project website contrasts its current released dataset with an
    "Anticipated Final Dataset" of 100,000 patient admissions, 9 different data
    modalities and 14 data contributing hospitals, and lists under the same
    heading 60+ CHoRUS consortium members across 20 different institutions. The
    September 2025 webinar reports imaging de-identification in process for the
    larger cohort and EEG extraction in process.
external_resources:
  - name: CHoRUS for Equitable AI GitHub organization (chorus-ai)
    external_resources:
      - https://github.com/chorus-ai
    description: >-
      The CHoRUS GitHub organization houses active repositories that provide
      software and tooling to interact with and extract insight from clinical
      data in diverse formats, validated semantic mappings for connecting clinical
      data in various source formats to international standards, standard
      operating protocols (SOPs) instructing data contributing sites about best
      practices for curating and delivering interoperable datasets, and project
      management overviews. Repositories listed in the 2025-11-14 capture include
      chorus-extract-upload (tools to create and upload a CHoRUS Data Extract),
      CHoRUSReports (characterization reports returned to sites following their
      data submissions) and chorus_waveform_resources (resources which support
      the preparation and release of waveforms).
  - name: Bridge2AI CHoRUS web page
    external_resources:
      - www.bridge2ai.org/chorus
notes: >-
  The project website lists Ciera McCrary, MGH, Program Manager, under "Contact
  Us", with the address cmccrary@mgh.havard.edu as the website spells it.
source_caveats: >-
  The project website carried the banner "This repoitory is under review for
  potential modification in compliance with Administration directives." The NIH
  project abstract dates from fiscal year 2022 and is written as plans; values
  taken from it are stated as plans. The webinar's data-type table reached the
  bundle as flattened text that does not preserve row and column ownership: a
  data standard is attributed to a data type only where the text prints it on
  the same line as, or directly after, that data type's label, and the table's
  "Metadata" and "Published metadata schema" columns are not transcribed. The
  NIH abstract's aim of a data set from more than 100,000 critically ill patients
  and the website's anticipated final dataset of 100,000 patient admissions count
  different units and are not merged. The GitHub organization overview states
  "This project is licensed under the MIT License"; that statement concerns the
  GitHub project and no source states a license for the dataset itself. No
  dataset DOI or version identifier appears in the sources.
