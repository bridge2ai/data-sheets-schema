id: https://chorus4ai.org/
name: CHoRUS
title: CHoRUS Dataset
page: https://chorus4ai.org/
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
description: >-
  The CHoRUS dataset is the multicenter, multimodal and high-resolution clinical
  care dataset of the CHoRUS project (Patient-Focused Collaborative Hospital
  Repository Uniting Standards for Equitable AI), one of four data generation
  projects in the NIH-funded Bridge2AI consortium. The project website describes
  the CHoRUS project as the collection of multi-modal data across 14 different
  hospitals, using ongoing and new standardization practices, with tools created
  to support a cloud enclave. A September 2025 training-program webinar
  describes retrospective data collection under controlled access, with OMOP and
  telemetry data in the enclave. The GitHub organization overview captured on
  2025-11-14 states that the collaboration spans 20 academic centers, of which 14
  will contribute as Data Acquisition centers. The 2022 NIH project abstract
  describes, as plans, developing capabilities to acquire, standardize, tokenize,
  store, visualize, and label data such as structured electronic health record
  data, tokenized unstructured electronic health record data, telemetry and EEG
  waveforms, imaging, and social determinants of health.
keywords:
  - Critical Care
  - Critical Illness
  - Artificial Intelligence
  - Bridge to Artificial Intelligence
  - Machine Learning
  - Electronic Health Record
  - Electroencephalography
  - Telemetry
  - acute care
  - data standards
  - multimodality
  - social health determinants
conforms_to: >-
  OMOP; DICOM; WFDB; OHNLP; EDF+ and Persyst (for waveform EEG, whose extraction
  was in process at the time of the September 2025 webinar)
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
purposes:
  - name: Publicly available, AI-ready critical care dataset
    response: >-
      The 2022 NIH project abstract states that the project's overarching goal is
      to develop a publicly available, AI-ready critical care dataset, while
      ensuring the methods promote privacy, accountability, and clinical benefit,
      while promoting a new generation of AI clinicians and scientists.
  - name: Improving recovery from acute illness
    response: >-
      The GitHub organization overview states that the goal of the CHoRUS Network
      is to develop the most diverse, high-resolution, ethically sourced, AI-ready
      data set to answer the grand challenge of improving recovery from acute
      illness; the project website carries the heading "Expanding Artificial
      Intelligence and Machine Learning to Improve Recovery from Acute Illness".
tasks:
  - name: Characterizing acute and critical care illness
    response: >-
      ML/AI applications aimed at characterizing acute and critical care illness.
  - name: Predicting complications
    response: >-
      ML/AI applications aimed at predicting complications.
  - name: Measuring treatment response
    response: >-
      ML/AI applications aimed at measuring treatment response among patients with
      acute or critical illness.
addressing_gaps:
  - name: Infrastructure for AI/ML in critical care
    response: >-
      The NIH project abstract states that there is an urgent need for
      infrastructure to support artificial intelligence and machine learning
      (AI/ML) in critical care, and that developing high-resolution multi-center
      data sets is a critical first step towards actionable and trustworthy AI.
