id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  A collection of data derived from voice recordings with corresponding clinical
  information, published on PhysioNet as the adult dataset of the Voice project.
  Version 3.1.0 contains data for 833 participants collected across five sites
  in North America; the project documentation gives the countries of
  collection as the USA and Canada. Participants were selected based on known conditions which
  manifest within the voice waveform, including voice disorders, neurological
  disorders, mood disorders and respiratory disorders. The dataset contains
  derived audio data features, phenotypic information acquired during data
  collection (demographic, clinical and validated questionnaire data), and
  metadata related to the specific audio task and recording. The release
  contains data considered low risk, including derivations such as
  spectrograms, but not the original voice recordings.
