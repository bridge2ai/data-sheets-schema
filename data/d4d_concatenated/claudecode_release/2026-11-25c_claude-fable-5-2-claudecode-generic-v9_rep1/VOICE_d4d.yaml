is_tabular: true
source_caveats: >-
  The record describes the adult dataset at its current PhysioNet release,
  3.1.0; the PhysioNet pages for versions 1.1 and 3.0.0 in the bundle were read
  as statements about those versions. The project documentation site carries a
  datasheet whose distribution and maintenance answers describe an earlier
  release hosted on Health Data Nexus (published at the end of November 2024)
  and whose population statement names version 2.0.0; those answers were not
  written as the current state of the dataset. The documentation site states
  about 61,937 voice-derived recordings for version 3.0; the version 3.1.0 page
  states no total recording count, only an element count for each feature
  file. The version 3.1.0 page lists the spectrogram files as
  torchaudio_spectrogram.parquet and torchaudio_mel_spectrogram.parquet and
  describes them as torchaudio_spectrograms.parquet and
  torchaudio_mel_spectrograms.parquet; the listed names, which the usage note
  also uses, are the ones recorded. The documentation datasheet says the
  dataset comes with no predefined recommended data splits, that there is no
  erratum (a changelog is published for each version), that no pre-processing
  for cleaning was applied, that no export controls apply and that no analysis
  of the potential impact of the dataset on data subjects has been conducted;
  the slots for those things are left empty. The same datasheet says the
  dataset includes transcriptions of free speech tasks, while the
  documentation's de-identification section for version 3.0.0 says
  transcriptions from open-response prompts are removed from the feature-only
  dataset; no content warning is recorded.
purposes:
  - response: >-
      To provide an ethically sourced flagship dataset that enables future
      research in artificial intelligence and supports critical insights into
      the use of voice as a biomarker of health, with which clinically
      applicable AI/ML models can be developed, benchmarked or validated.
  - response: >-
      To facilitate the use of voice as a non-invasive, cost-effective biomarker
      for the screening, diagnosis and monitoring of a wide range of health
      conditions.
tasks:
  - response: >-
      Training machine-learning models for disease detection and classification
      using voice data.
addressing_gaps:
  - response: >-
      Previous studies of machine learning-based voice diagnosis produced
      promising results, but their sample sizes were too small or they lacked
      the key metadata needed to train robust, clinically useful models.
  - response: >-
      Comparing studies and pooling data is challenging because standards for
      how voice and other acoustic data are measured and collected are lacking.
  - response: >-
      Industry datasets are often private, which limits the ability to audit
      machine-learning models and the accuracy of training data labels.
