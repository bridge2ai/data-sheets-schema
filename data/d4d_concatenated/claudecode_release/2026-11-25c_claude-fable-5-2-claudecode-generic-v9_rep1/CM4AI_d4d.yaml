intended_uses:
- name: Research in functional genomics
  description: AI-ready datasets to support research in functional genomics.
- name: AI model training
  description: AI model training.
- name: Cellular process analysis
  description: Cellular process analysis.
- name: Analysis of cell architectural changes and interactions
  description: >-
    Cell architectural changes and interactions in presence of specific
    disease processes, treatment conditions, or genetic perturbations.
prohibited_uses:
- name: Clinical decision-making or patient care without regulatory oversight
  description: >-
    These laboratory data are not to be used in clinical decision-making or in
    any context involving patient care without appropriate regulatory
    oversight and approval.
known_limitations:
- name: Interim release
  limitation_description: This is an interim release.
- name: No predicted cell maps
  limitation_description: >-
    The release does not contain predicted cell maps, which will be added in
    future releases; computed cell maps are not included in this release.
- name: Suitability
  limitation_description: >-
    The current release is most suitable for bioinformatics analysis of the
    individual datasets.
- name: Domain expertise
  limitation_description: Requires domain expertise for meaningful analysis.
- name: Pre-publication embargo
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo. The External
    Data Links of the June 2026 Data Release list Perturb-seq data in KOLF2.1J
    iPSCs (undifferentiated) and Perturb-seq data in MDA-MB-468 breast cancer
    cells (+/- treatment) as "Embargoed".
- name: Incompletely overlapping protein sets
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturbSeq data interrogate sets of proteins which incompletely
    overlap.
known_biases:
- name: Commercially available cell lines
  bias_description: >-
    Data in this release was derived from commercially available de-identified
    human cell lines.
- name: Biological variants not represented
  bias_description: >-
    Does not represent all biological variants which may be seen in the
    population at large.
