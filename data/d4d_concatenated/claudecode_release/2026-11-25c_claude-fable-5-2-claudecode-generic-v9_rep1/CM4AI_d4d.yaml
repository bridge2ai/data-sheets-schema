source_caveats: >-
  Referent. This record describes the CM4AI dataset as the project's series of
  data releases; each captured Dataverse release is a component under
  `resources`, and its files are a collection under `file_collections`. The
  June 2026 Data Release (doi 10.18130/V3/HIGT4C) is treated as the current
  state; statements taken from earlier releases, from the 2024 project preprint
  or from the project website are attributed where they are used. Release date.
  The project's data releases page displays "Released on: June 17, 2025" for
  the June 2026 Data Release, while the release's Dataverse citation metadata
  gives the publication date 2026-06-17; the two disagree, the Dataverse record
  is the higher-ranked source in the manifest and its date is the one recorded.
  Project end. The release's Maintenance Plan speaks of the end of the project
  in November 2026, while the NIH RePORTER record for project
  3OT2OD032742-01S2 gives the project end 2026-08-31; the two statements may
  not concern the same period, and each is recorded where it is stated.
  Website figures. The "Data Insights" figures quoted in the description are
  undated and are not tied to a particular release; the same page marks AP-MS
  interactomes as "coming soon" although the June 2026 Data Release includes
  AP-MS data. Packaging standard. RO-Crate conformance is stated by the March
  2025 release description for CM4AI output data in general; the June 2026
  release page does not repeat it. Dated text. The Data Governance & Ethics, Completeness, Maintenance Plan,
  Intended Use, Limitations, Prohibited Uses and Potential Sources of Bias text
  of the June 2026 release is identical to that of the June 2025 and October
  2025 releases and carries the stamp "(2025-06-30)". Affiliation identifier.
  The June 2026 release gives the affiliation of five authors (Clark T, Al
  Manir S, Levinson MA, Niestroy J, Ratcliffe S) only as
  https://ror.org/0153tk833; the name University of Virginia is taken from the
  earlier releases, which state it for the same five authors. Person
  identifiers. The ORCIDs given for the named governance and ethics contacts
  and for the principal investigator are those the release author lists state
  for Parker J, Ravitsky V, Bélisle-Pipon JC and Ideker T; the match is by
  surname and initial. File sizes. Dataverse displays rounded file sizes, so no
  byte counts are recorded; the displayed size is kept in each file's
  description. External data links. The bundle captures the labels of the
  release's External Data Links but not their URLs. Unused source. The bundle
  also contains a Nature article describing a multimodal cell map of U2OS
  cells; no passage in the bundle states how that study's data relate to the
  CM4AI data releases, so none of its dataset facts are recorded here.
