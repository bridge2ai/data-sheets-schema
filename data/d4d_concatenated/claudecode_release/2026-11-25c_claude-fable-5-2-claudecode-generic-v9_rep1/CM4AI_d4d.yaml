purposes:
- name: Ethical, AI-ready datasets of cell architecture
  response: >-
    The overarching mission of CM4AI is to produce ethical, AI-ready datasets of
    cell architecture, inferred from multimodal data collected for human cell
    lines, to enable transformative biomedical AI research.
- name: Mapping the spatiotemporal architecture of human cells
  response: >-
    The CM4AI data generation project seeks to map the spatiotemporal
    architecture of human cells and use these maps toward the grand challenge
    of interpretable genotype-phenotype learning.
tasks:
- name: Interpretable genotype-phenotype learning
  response: >-
    The project description states that the Bridge2AI data generation project
    will generate a resource of matched data and tools to enable the creation
    of "visible" machine learning systems, which are not black boxes but are
    built directly on knowledge maps of cell and tissue architecture.
addressing_gaps:
- name: Black-box genotype-to-phenotype models
  response: >-
    In genomics and precision medicine, machine learning models are often
    "black boxes," predicting phenotypes from genotypes without understanding
    the mechanisms by which such translation occurs.
