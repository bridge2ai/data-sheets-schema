  description: >-
    The project's data releases page describes a curated dataset for
    undifferentiated (parental) iPSCs and iPSC-derived neural progenitor cells
    (NPCs), neurons, and cardiomyocytes that includes Perturb-seq of >11,000
    genes (whole-genome) and SEC-MS capturing ~7,000 proteins; IF images are
    marked "coming soon".
- id: https://cm4ai.org/#subset-tnbc-curated-datasets
  name: Curated datasets for TNBC cells
  description: >-
    The project's data releases page describes curated datasets for TNBC cells
    under untreated (DMSO control), vorinostat, and paclitaxel conditions that
    include SEC-MS capturing ~7,000 proteins, IF images for 523 proteins, and
    Perturb-seq of 200 genes; AP-MS interactomes are marked "coming soon".
collection_mechanisms:
- name: Immunofluorescence staining and confocal microscopy
  mechanism_details: >-
    Spatial localization of proteins of interest in cells of the breast cancer
    cell line MDA-MB-468 was imaged by immunofluorescence-based staining
    (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
    University. Nuclei were stained with DAPI (blue channel); endoplasmic
    reticulum with a calreticulin antibody (yellow channel); microtubules with
    tubulin antibody (red channel); and antibody against protein of interest
    (green channel).
  source_caveats: >-
    Taken from the file descriptions of the October 2025 Data Release, which
    the March 2025 and June 2025 releases word the same way; the June 2026
    release page carries no file descriptions.
- name: Size exclusion chromatography-mass spectroscopy (SEC-MS)
  mechanism_details: >-
    SEC-MS data were generated on undifferentiated KOLF2.1J human induced
    pluripotent stem cells (hiPSCs), and following the treatment of vorinostat
    or paclitaxel on MDA-MB468 human breast cancer cells, in the Nevan Krogan
    laboratory at the University of California San Francisco.
  source_caveats: >-
    Taken from the file descriptions of the October 2025 Data Release; the
    June 2026 release page carries no file descriptions.
- name: Affinity purification mass spectroscopy (AP-MS)
  mechanism_details: >-
    The June 2026 Data Release includes AP-MS data for MDA-MB-468 breast cancer
    cells treated with paclitaxel and treated with vorinostat. The 2024 project
    preprint states that AP-MS was employed on endogenously tagged cell lines.
- name: Perturb-seq (CRISPRi perturbation)
  mechanism_details: >-
    The October 2025 Data Release describes an expressed genome-scale CRISPRi
    Perturbation Cell Atlas in KOLF2.1J human induced pluripotent stem cells
    (hiPSCs) mapping transcriptional and fitness phenotypes associated with
    11,739 targeted genes.
data_collectors:
- name: Lundberg Lab at Stanford University
  collector_details: >-
    Immunofluorescence-based staining (ICC-IF) and confocal microscopy imaging
    of MDA-MB-468 cells.
- name: Nevan Krogan laboratory at the University of California San Francisco
  collector_details: >-
    Generation of the size exclusion chromatography-mass spectroscopy (SEC-MS)
    data.
raw_data_sources:
- name: MDA-MB-468 cell line
  source_description: >-
    MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line
    established from a metastatic site pleural effusion of a 51-year-old black
    female with a metastatic mammary adenocarcinoma.
  source_type: human cell line
  access_details: Available from ATCC.
- name: KOLF2.1J iPSC line
  source_description: >-
    The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy
    male Northern European donor.
  source_type: human cell line
  access_details: >-
    Available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
    resource; available for access by non-for-profit organizations via a simple
    MTA.
preprocessing_strategies:
- name: AI-readiness packaging in RO-Crate format with FAIRSCAPE
  preprocessing_details: >-
    CM4AI output data are packaged with provenance graphs and rich metadata as
    AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. The
    2024 project preprint states that the project's FAIR AI-Readiness metadata
    and validation toolkits have been used to package and release its
    cell-line perturbation and measurement data. As that preprint describes
    the framework, the FAIRSCAPE client package (FAIRSCAPE-CLI) creates an
    RO-Crate package with the datasets, metadata, and software, or resolvable
    references to these components; the RO-Crates are then sent to the
    FAIRSCAPE server, where they are registered and assigned persistent
    identifiers.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    url: https://fairscape.github.io
    license: MIT
  source_caveats: >-
    The packaging statement is taken from the description of the March 2025
    Data Release and from the 2024 project preprint; the June 2026 release
    page does not repeat it.
is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The June 2026 Data Release states "De-identified Samples: Yes" and that the
    data in the release were derived from commercially available de-identified
    human cell lines. The 2024 project preprint states that CM4AI data are
    non-clinical (from tissue cultures) and are considered to be de-identified
    as they cannot be matched, with current knowledge, to a human subject.
