id: https://cm4ai.org/
name: CM4AI
title: Cell Maps for Artificial Intelligence
description: >-
  CM4AI (Cell Maps for Artificial Intelligence) is the Functional Genomics Grand
  Challenge in the NIH Bridge2AI program. CM4AI is generating multi-modal data
  including protein-protein interaction (PPI), spatial localization, and genetic
  perturbation data in MDA-MB-468 breast cancer cells (+/- paclitaxel or
  vorinostat) and induced pluripotent stem cells (iPSCs) (+/- differentiation),
  and releases data quarterly; the captured releases are deposited in the
  University of Virginia Dataverse, each under its own DOI. The current release,
  the June 2026 Data Release (Beta), includes Perturb-seq data for MDA-MB-468
  breast cancer cells +/- treatment and undifferentiated (parental) KOLF2.1J
  iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells +/- treatment,
  undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron progenitor cells
  (NPCs), neurons, and cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer
  cells + treatment; and IF images in MDA-MB-468 breast cancer cells +/-
  treatment. The release states that these data are not yet in completed final
  form and that computed cell maps are not included. The project's data
  releases page states that CM4AI will deliver machine-readable hierarchical
  maps of cell architecture as AI-ready data, together with quarterly data
  releases of map-input data streams, and that CM4AI is a collaboration of UCSD,
  UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University,
  and the Hastings Center. The project website's "Data Insights" panel reports
  1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total
  proteins investigated, 11,739 genes targeted and a data volume of 21.4 TB.
