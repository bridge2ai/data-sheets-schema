id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset consists of data collected from individuals with and
  without Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data
  collection sites. This version contains data from 2280 participants that was
  collected between July 19, 2023 and May 01, 2025. Data from multiple
  modalities are included: survey data, clinical data, retinal imaging data,
  environmental sensor data, continuous glucose monitor data, and wearable
  activity monitor data. The data in this dataset contain no protected health
  information (PHI); information related to the sex and race/ethnicity of the
  participants as well as medication used has also been removed. The dataset
  contains 356,343 files and is around 3.82 TB in size.
