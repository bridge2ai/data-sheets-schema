instances:
- instance_type: individual patient
  counts: 2280
  label: false
  description: >-
    Each instance consists of all of the data available for an individual
    participating in the study. Multiple modalities of data are collected for
    each participant, including survey data, clinical data, retinal imaging
    data, environmental sensor data, continuous glucose monitor data, and
    wearable activity monitor data. These encompass tabular data, imaging
    data, and physiological signal/waveform data. There is no unstructured
    text data included in this dataset.
sampling_strategies:
- name: Participant recruitment
  is_random: false
  is_representative: false
  why_not_representative: >-
    Building balanced data sets is critical for the development of unbiased
    machine learning models, so rather than targeting the demographic
    distribution of the US population, the study is triple-balanced by
    recruiting in equal proportions four race/ethnic groups (Asian, Black,
    White, Hispanic), four categories of T2DM (no diabetes, pre-diabetes or
    lifestyle-controlled diabetes, diabetes treated with oral or non-insulin
    injectable medications, and insulin-controlled diabetes) and biological
    males and females.
  source_data: >-
    The study base is all patients aged 40 years or older who had a medical
    encounter within each health system site (UAB, UCSD, UW) between 2020 and
    2025; recruitment pools were identified by screening electronic health
    records for diabetes and prediabetes ICD-10 codes.
  strategies: >-
    Non-probability sample. Participants are recruited in waves; the
    composition of participants is monitored and will be adjusted by under-
    and oversampling groups as needed. Recruitment sampling procedures were aimed
    at achieving approximately equal distribution of participants across
    diabetes severity.
  description: >-
    Eligibility criteria: able to provide consent, 40 years old or older,
    persons with or without type 2 diabetes, must speak and read English;
    excluded are adults older than 85 years of age, pregnancy, gestational
    diabetes and Type 1 diabetes. The healthsheet states that the dataset
    contains all possible instances and that no data were excluded from the
    dataset at the time of preprocessing.
subpopulations:
- name: Race/ethnicity, sex and diabetes status groups in the suggested split
  identification: >-
    Diabetes status groups are defined as: No DM, participants who do not have
    Type 1 or Type 2 Diabetes; Lifestyle, participants with pre-Type 2
    Diabetes and those with Type 2 Diabetes whose blood sugar is controlled by
    lifestyle adjustments; Oral, participants with Type 2 Diabetes whose blood
    sugar is controlled by oral or injectable medications other than insulin;
    Insulin, participants with Type 2 Diabetes whose blood sugar is controlled
    by insulin.
  distribution: >-
    Totals in the README suggested-split summary (2280 participants):
    race/ethnicity Hispanic 380, Asian 545, Black 519, White 836; sex Male
    951, Female 1329; diabetes status No DM 776, Lifestyle 560, Oral 686,
    Insulin 258; mean age 60.8 ± 11.3 years.
  source_caveats: >-
    The healthsheet answers "No" to whether the dataset identifies any
    demographic sub-populations, and states that sex, race, and ethnicity
    data are not being released with the public version of the dataset; the
    counts above are the summary table the README publishes for the suggested
    split.
splits:
- name: Suggested split for training, validation and testing
  split_details: >-
    The current version of the dataset comes with recommended data splits. The
    project team prepared data splits into proportions (70%/15%/15%) that can
    be used for subsequent training/validation/testing, where the validation
    and test sets are balanced as well as possible for sex, race/ethnicity and
    diabetes status. The README summary gives 1576 participants in Train, 352
    in Val and 352 in Test, for a Total of 2280.
  description: >-
    The suggested split for training, validating, and testing AI/ML models is
    included in the participants.tsv file. It was prepared because sex, race,
    and ethnicity data are not being released with the public version of the
    dataset.
anomalies:
- name: Survey data
  anomaly_details: >-
    In cases of survey data, skipped questions or incomplete responses are
    expected.
- name: Wearable data
  anomaly_details: >-
    In cases of using wearables, improper use and technical failure such as
    battery failure or system malfunction are expected.
- name: Imaging data
  anomaly_details: >-
    In cases of imaging data, patient uncooperation, noise that may obscure
    the images, technical failure such as system malfunction, and data
    transfer failures are expected.
known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants are volunteers; therefore, there is selection bias known as
    volunteer bias which may limit the generalizability of the results among
    those who are not represented in the study population.
known_limitations:
- name: English-language requirement
  limitation_description: >-
    Requiring that eligible participants speak, read and understand English
    may have created challenges in recruiting Hispanic and/or Asian persons.
- name: Urban and hospital-based recruitment
  limitation_description: >-
    Factors influencing the generalization of derived models include the
    predominantly urban and hospital-based recruitment, which may not fully
    capture diverse cultural and socioeconomic backgrounds.
- name: Races/ethnicities not included
  limitation_type: representativeness_limitation
  limitation_description: >-
    The study cohort may not provide a comprehensive representation of the
    population, as it does not include other races/ethnicities such as Pacific
    Islanders and Native Americans.
- name: Balanced distribution across groups may not have been achieved
  limitation_description: >-
    As enrollment is ongoing, the periodic updates to data releases may not
    have achieved balanced distribution across groups.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: >-
    The dataset does not contain data that might be considered confidential.
    No personally identifiable information is included in the dataset.
content_warnings:
- content_warnings_present: false
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: >-
    The public dataset will not contain data that is considered sensitive.
    However, the controlled access dataset will contain data regarding racial
    and ethnic origins, location (5-digit zip code), as well as motor vehicle
    accident reports.
is_deidentified:
  identifiable_elements_present: false
  identifiers_removed: >-
    Information related to the sex and race/ethnicity of the participants as
    well as medication used has been removed.
  deidentification_details: >-
    No identifiers were collected so no active de-identification was necessary
    but it was checked that no identifiable data per US HIPAA were present in
    the data. The dataset was also reviewed internally by AI-READI team
    members to ensure that no personally identifiable information was
    accidentally included.
relationships:
- relationship_details: >-
    All instances are part of the same prospective data generation project
    (AI-READI). There is currently only one visit per participant.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: >-
    The acquisition of data varied based on the domain; some data were
    directly observable (such as labs, vitals, and retinal imaging), whereas
    other data were reported by subjects (e.g. survey responses). Verification
    of data entry was performed when possible (e.g. cross-referencing entered
    medications with medications that were physically brought in or
    photographed by each study participant).
collection_mechanisms:
- name: REDCap questionnaires and clinical data entry
  mechanism_details: >-
    REDCap is used for collecting patient-reported data from questionnaires
    and the following clinical data from the visit: medications assessment,
    vitals, visual acuity, contrast sensitivity, monofilament test results and
    CBC test results.
- name: 12-lead electrocardiogram
  mechanism_details: >-
    A 12-lead ECG is performed (Philips Pagewriter TC30 Cardiograph) while the
    participant sits in a reclining chair or lies supine.
- name: Montreal Cognitive Assessment (MoCA)
  mechanism_details: >-
    A general cognitive screener is carried out using the Montreal Cognitive
    Assessment (MoCA), administered electronically on an iPad using the MoCA
    Duo Application.
- name: Monofilament testing for peripheral neuropathy
  mechanism_details: >-
    The monofilament test is done using a standard 10g monofilament applying
    pressure to different points on the plantar surface of the feet.
- name: Visual acuity testing
  mechanism_details: >-
    Photopic letter visual acuity is measured with the Electronic Visual
    Acuity tester (M&S Technology); mesopic acuity is measured by the
    participant viewing the display through a 2.0 neutral density (ND) filter.
- name: Contrast sensitivity testing
  mechanism_details: >-
    Photopic letter contrast sensitivity is measured with the Mars chart (Mars
    Perceptrix); mesopic contrast sensitivity is assessed by viewing through
    the 2.0 ND filter.
- name: Autorefraction
  mechanism_details: >-
    Autorefraction data for each eye are obtained using the autorefractor's
    standard protocol (Topcon KR 800).
- name: Blood and urine collection for laboratory testing
  mechanism_details: >-
    Blood (non-fasting) and urine samples are collected from participants
    during the visit. Clinical Laboratory Improvement Amendments-certified
    laboratories local to each data collection site perform complete blood
    count (CBC) testing on fresh whole blood samples; all other lab tests are
    performed by the University of Washington Nutrition and Obesity Research
    Center (NORC) testing facility using stored, frozen samples.
- name: Optomed Aurora undilated fundus photography
  mechanism_details: >-
    The Optomed Aurora IQ is a handheld fundus camera that can take
    non-mydriatic images of the ocular fundus. Images taken during the
    AI-READI visit are undilated images taken in a dark room.
- name: iCare EIDON dilated fundus photography
  mechanism_details: >-
    The iCare EIDON is a widefield TrueColor confocal fundus imaging system.
    AI-READI images using EIDON include two main modalities: Single Field
    Central IR/FAF and Smart Horizontal Mosaic.
- name: Heidelberg Spectralis HRA
  mechanism_details: >-
    The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that
    combines optical coherence tomography (OCT) with retinal angiography;
    imaging is done in a dark room using the following modalities: ONH-RC,
    PPole-H, and OCTA of the macula.
- name: Topcon DRI OCT Triton
  mechanism_details: >-
    The DRI OCT Triton is a device from Topcon Healthcare that combines
    swept-source OCT technology with multimodal fundus imaging. Imaging is
    done in 12.0X12.0 mm and 6.0X6.0 mm OCTA, and 3D Horizontal and Radial
    scan modes.
- name: Topcon Maestro2 3D OCT
  mechanism_details: >-
    The Maestro2 is a robotic OCT and color fundus camera system from Topcon
    Healthcare. Protocols include 12.0 mm X9.0 mm widefield, 6.0 mm X 6.0 mm
    3D macula scan and 6.0 mm X 6.0 mm OCTA.
- name: Heidelberg FLIO
  mechanism_details: >-
    Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) imaging is done by an
    operator in a dark room and is performed as the last modality of an
    AI-READI visit.
- name: Zeiss Cirrus 5000 Angioplex
  mechanism_details: >-
    The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence
    tomography (OCT) system. Imaging protocols include 512 X 512 and 200 X 200
    macula and ONH scans and also OCTA of the macula.
- name: Dexcom G6 continuous glucose monitor
  mechanism_details: >-
    The Dexcom G6 is a real-time, integrated continuous glucose monitoring
    system (iCGM) that directly monitors blood glucose levels without
    requiring finger sticks; it is used for post-visit data collection for 10
    days.
- name: Garmin Vivosmart 5 fitness tracker
  mechanism_details: >-
    The Garmin Vivosmart 5 Fitness Activity tracker is used to measure data
    related to physical activity during the 10 days of post-visit data
    collection.
- name: LeeLab Anura environmental sensor
  mechanism_details: >-
    Participants are sent home with an environmental sensor (a custom-designed
    sensor unit called the LeeLab Anura), which they use for 10 continuous
    days before returning the devices to the clinical research coordinators
    for data download.
data_collectors:
- role: Clinical research coordinator
  collector_details: >-
    All research personnel at the three data sites who recruited, enrolled and
    collected data underwent training by the data manager at UAB and a
    detailed Manual of Procedures (MOP). Successful completion of a
    certification process is required for all coordinators. Their effort was
    supported by the National Institutes of Health award OT2OD032644.
  description: >-
    Data collection sites are the University of Alabama at Birmingham
    (Birmingham, Alabama), the University of California, San Diego (San
    Diego, California) and the University of Washington (Seattle,
    Washington).
collection_timeframes:
- start_date: "2023-07-19"
  end_date: "2025-05-01"
  timeframe_details: >-
    For this version of the dataset, the timeframe for data collection was
    July 19, 2023 to May 01, 2025. The BMJ Open protocol states that
    preliminary pilot enrollment occurred between 18 July 2023 and 30 November
    2023 and that the formal data collection process began on 1 December 2023.
direct_collection:
- is_direct: true
  collection_details: >-
    The data was collected directly from participants across the three
    recruiting sites.
collection_notifications:
- notification_details: >-
    Each individual was aware of the data collection, as this was not passive
    data collection or secondary use of existing data, but rather active data
    collection directly from participants.
collection_consents:
- consent_details: >-
    Informed consent to participate was required before participation in any
    part of the protocol (including questionnaires). Potential participants
    were given the option to read all consent documentation electronically
    (e-consent) before their visit and give their consent with an electronic
    signature without verbal communication with a clinical research
    coordinator.
consent_revocations:
- revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease
    study participation. However, any data that had been shared or used up to
    that point would stay in the dataset.
missing_data_documentation:
- missing_data_patterns: >-
    Not all modalities are available for all participants.
  missing_data_causes: >-
    Some participants elected not to participate in some study elements. In a
    few cases, the data collection device did not have any stored results or
    was returned too late to retrieve the results (e.g. battery died, data was
    lost). In a few cases, there may have been a data collision at some point
    in the process and data has been lost.
raw_data_sources:
- name: Electrocardiograph export
  source_description: >-
    Data from the ECG device are exported in their raw format to local
    storage.
  raw_data_format: .xml
- name: MoCA Duo application export
  source_description: >-
    Data from the MoCA Duo application (total score, section subscores, Memory
    Index Score and task completion times) are exported in their raw format to
    local storage.
  raw_data_format: .csv
ethical_reviews:
- reviewing_organization: Institutional Review Board (IRB) of the University of Washington
  review_details: >-
    The initial IRB approval at the University of Washington was received on
    December 20, 2022, with reliance agreements with the IRBs of University of
    Alabama at Birmingham and University of California, San Diego. An annual
    renewal application to the IRB about the status and progress of the study
    is required.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - AI-READI was approved by the Institutional Review Board (IRB) of the University of Washington (approval number STUDY00016228).
informed_consent:
- consent_obtained: true
  consent_type: >-
    Written informed consent, given electronically (e-consent) or in person at
    the start of the visit.
  consent_documentation: >-
    The approved consent form is that of the principal project site,
    University of Washington; the other clinical sites had IRB reliance and
    used the same consent form, with minor institution-specific language
    incorporated depending on individual institutional requirements.
participant_privacy:
- privacy_techniques: >-
    The environmental sensor and the Garmin fitness tracker were specifically
    chosen with participant privacy as a primary concern. These devices do not
    capture video or audio, are not equipped with GPS location monitoring and
    are not synced with participant-owned devices.
participant_compensation:
- compensation_provided: true
  compensation_type: Stipend for participation
  compensation_amount: $200 for the study visit
preprocessing_strategies:
- name: Mapping to standardized terminologies
  preprocessing_details: >-
    Once data were sent from each of the study sites to the central project
    team, all data were mapped to standardized terminologies when possible,
    such as the Observational Medical Outcomes Partnership (OMOP) Common Data
    Model and the Digital Imaging and Communications in Medicine (DICOM)
    standard.
- name: Conversion of retinal images to DICOM
  preprocessing_details: >-
    All participant images are exported from imaging devices in their raw
    format and some images required conversion to a DICOM standard format
    prior to upload.
cleaning_strategies:
- name: Quality control at data entry and acquisition
  cleaning_details: >-
    Clinical data outside of expected min/max ranges were flagged in REDCap,
    which was visible in reports viewed by clinical research coordinators
    (CRCs) and Data Managers. Data were checked for credibility based on range
    checks, incorrect flow through prescribed skip patterns, missing data that
    can be directly filled from other portions of an individual's record, and
    the omission and/or duplication of records, and edited if errors were
    detected. Editing was only done under the guidance and approval of the
    site PI.
- name: Site data manager quality control before upload
  cleaning_details: >-
    The Data Manager at each data site is responsible for the quality control
    of all data before uploading to FAIRhub.
raw_sources:
- raw_data_details: >-
    The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project but is not anticipated to be
    shared outside the project team right now, because it has not been mapped
    to standardized terminologies and because the raw data may accidentally
    include personal health information or personally identifiable
    information. There is a possibility that raw data may be included in
    future releases of the controlled access dataset.
future_use_impacts:
- impact_details: >-
    To the extent of the creators' knowledge, no uses of the dataset are
    currently anticipated that could result in unfair treatment or harm.
    However, there is a theoretical risk of future re-identification.
intended_uses:
- name: Type 2 diabetes related research
  description: >-
    The public version of the dataset can only be used for type 2 diabetes
    related research.
  use_category: research
- name: Training, validating and testing AI/ML models
  description: >-
    A suggested split for training, validating, and testing AI/ML models is
    provided with the dataset.
prohibited_uses:
- name: Clinical treatment decisions
  description: >-
    Licensees shall not make clinical treatment decisions based on the Data.
  prohibition_reason: The Data is intended solely as a research resource.
- name: Re-identification or contact of data subjects
  description: >-
    Licensees shall not use or attempt to use the Data to compromise the
    confidentiality or privacy of any Data Subject, to attempt to identify or
    contact any Data Subject or group of Data Subjects, to extract or
    extrapolate any identifying information about a Data Subject, or to
    establish a Data Subject's membership in a particular group of persons.
- name: Conveying the data to non-licensees
  description: >-
    Licensees shall not transfer, license, sublicense, sell, assign, display,
    share or otherwise convey any portion of the Data or any derivative work
    to any third party other than another licensee bound by an agreement with
    the Licensor on identical terms.
- name: Sharing data with third-party model vendors for training
  description: >-
    Licensees shall not share or distribute Data with any third party model
    vendor or developer for training or development purposes.
- name: Reproducing data in publications
  description: >-
    Data may not be reproduced in papers, articles, presentations, analyses,
    reports or publications, except that small representative samples of Data
    may be reproduced in up to five images or figures per Paper for
    illustrative purposes only.
distribution_formats:
- media_type: application/dicom
- media_type: text/markdown
- media_type: text/csv
- media_type: application/json
- format: WaveForm DataBase (WFDB)
distribution_dates:
- release_dates:
  - "2025-11-17"
  description: Date the dataset was made available on FAIRhub.
third_party_sharing:
- is_shared: true
  description: The dataset will be distributed and be available for public use.
license_and_use_terms:
  name: AI-READI Data License Agreement (Version 2.0)
  license_terms: >-
    The Licensor, Washington University in St. Louis, grants a non-exclusive
    and non-transferable license to download, reproduce and use the Data, and
    to create derivative works of the Data, for research, commercial and
    non-commercial purposes. The license terms are available at
    https://doi.org/10.5281/zenodo.17555036 and were specifically tailored to
    enable reuse of the AI-READI dataset for commercial or research purpose
    while putting strong requirements around data usage, security, and
    secondary sharing to protect study participants.
  data_use_permission:
  - disease_specific_research
  description: >-
    Accessing the dataset requires several steps, including: login through a
    verified ID system, agreeing to use the data only for type 2 diabetes
    related research, and agreeing to the license terms which set certain
    restrictions and obligations for data usage.
regulatory_restrictions:
  regulatory_restrictions:
  - Licensees agree to comply with all data security and privacy standards established by the U.S. National Institutes of Health under its Genomic Data Sharing (GDS) Policy.
  - Licensees may use and store the data only on servers and devices maintained by and located within the Licensee's Institution/Employer, or on cloud or remote storage and backup services that have a HIPAA-approved Business Associate Agreement (BAA) in place with the Licensee's Institution/Employer.
maintainers:
- id: ROR:01yc7t268
  name: Washington University in St. Louis
  description: Named as the managing organization in the FAIRhub dataset description.
- name: AI-READI team
  maintainer_details: >-
    The AI-READI team will be supporting and maintaining the dataset. The
    dataset is hosted on FAIRhub through Microsoft Azure.
updates:
  frequency: approximately once a year
  update_details: >-
    The dataset will not be updated. Rather, new versions of the dataset will
    be released with additional instances as more study participants complete
    the study visit. There are plans to release new versions of the dataset
    approximately once a year with additional data from participants who have
    been enrolled since the last dataset version release.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - Version 3.0.0, 10.60775/fairhub.3, Nov 17, 2025
  - Version 2.0.0, 10.60775/fairhub.2, Nov 8, 2024
  - Version 1.0.0, 10.60775/fairhub.1, May 3, 2024
  version_details: >-
    The dataset gets released as static versions. The first version of the
    dataset contains data from 204 participants, the second version contains
    additional data from 863 participants for a total of 1067 participants,
    and this version contains a total of 2280 participants. The Snellen visual
    acuity variables were dropped in this version of the dataset. The FAIRhub
    page for version 2.0.0 (2.01 TB, 165,051 files) states that that version
    of the dataset is no longer accessible. A smaller version is available
    for pipeline development.
external_resources:
- name: AI-READI dataset documentation
  description: >-
    The dataset is self-contained but does rely on the dataset documentation
    for users requiring additional information about the provenance of the
