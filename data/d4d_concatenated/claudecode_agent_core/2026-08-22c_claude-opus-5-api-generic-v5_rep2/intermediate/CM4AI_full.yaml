distribution_dates:
  - release_dates: >-
      The June 2026 release was published 2026-06-17 as version 2.0, with the three
      immunofluorescence image archives published 2026-07-15. Earlier releases in the series were
      published in May 2024, March 2025 (2025-03-03), June 2025 (2025-07-01) and October 2025
      (2025-10-31). Releases are issued quarterly and will continue through the end of the project
      in November 2026.

third_party_sharing:
  - is_shared: true
    notes: >-
      Beyond the University of Virginia Dataverse deposit, components are shared through external
      third-party repositories: mass spectrometry data in MassIVE, raw perturb-seq sequence data in
      the NCBI Sequence Read Archive under a BioProject, and the CRISPRi perturbation atlas of iPSCs
      on Figshare. Data are additionally disseminated through the CM4AI web portal, built on the
      U-BRITE platform, and CM4AI contributions are curated into the NIH Common Fund Data Ecosystem.

external_resources:
  - external_resources: >-
      Mass spectrometry deposits in the MassIVE repository: SEC-MS in KOLF2.1J iPSCs
      (undifferentiated, NPC, neuron and cardiomyocyte); SEC-MS in MDA-MB-468 breast cancer cells
      with and without treatment; AP-MS in MDA-MB-468 cells treated with paclitaxel; and AP-MS in
      MDA-MB-468 cells treated with vorinostat.
    archival: true
    source_caveats: >-
      The release page renders these as link text ("MassIVE Repository") without exposing the target
      URLs in the extracted source, so no accession or URL is recorded here.
  - external_resources: >-
      Raw perturb-seq sequence data deposited with the NCBI Sequence Read Archive under a
      BioProject, and the CRISPRi Perturbation Atlas of iPSCs deposited on Figshare.
    archival: true
    restrictions:
    - >-
      The perturb-seq links for KOLF2.1J iPSCs (undifferentiated) and for MDA-MB-468 cells with and
      without treatment are marked embargoed on the June 2026 release record.
  - external_resources: >-
      Related publications: Clark T, Mohan J, Schaffer L, et al., "Cell Maps for Artificial
      Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell Lines",
      bioRxiv 2024, doi 10.1101/2024.05.21.589311 (the citation required by the release's attribution
      terms); and Nourreddine S, Doctor Y, Dailamy A, et al., "A perturbation cell atlas of human
      induced pluripotent stem cells", bioRxiv 2024, doi 10.1101/2024.11.03.621734, PMCID
      PMC11580897.
  - external_resources: >-
      CM4AI project web portal at https://cm4ai.org, with the data releases index at
      https://cm4ai.org/data-releases/, providing documentation, tools, publications and training
      material.
    future_guarantees: >-
      The portal and the data release collection both display a notice that the repository is under
      review for potential modification in compliance with Administration directives.
  - external_resources: >-
      Software underpinning the release: the Cell Mapping Toolkit, a series of Python packages
      implementing the end-to-end MuSIC pipeline, at https://github.com/idekerlab/cellmaps_pipeline
      with documentation at https://cellmaps-pipeline.readthedocs.io/; the FAIRSCAPE AI-readiness
      framework, documented at https://fairscape.github.io and released under the MIT license; and
      the open-source Integrative Modeling Platform at http://integrativemodeling.org. Tools
      software is released under BSD-3 license, in GitHub for alpha-level tools and in the Zenodo
      long-term archive for production-ready tools.
    archival: true
  - external_resources: >-
      A separate, related resource produced with the CM4AI Cell Mapping Toolkit: the U2OS multimodal
      cell map published as Schaffer LV, Hu M, Qian G, et al., "Multimodal cell maps as a foundation
      for structural and functional genomics", Nature 642:222-231 (2025),
      doi 10.1038/s41586-025-08878-3. That study's data — AP-MS interactions and the cell map at
      NDEx, images in the Human Protein Atlas v23 release, AP-MS raw files at MassIVE MSV000097168,
      SEC-MS raw files at ProteomeXchange PXD052362, structural models at ModelArchive — are held
      separately and are not part of this release.
    source_caveats: >-
      This publication acknowledges Bridge2AI award OT2 OD032742 and uses the same pipeline, but
      describes a distinct dataset in U2OS osteosarcoma cells; its facts have not been merged into
      this record.

