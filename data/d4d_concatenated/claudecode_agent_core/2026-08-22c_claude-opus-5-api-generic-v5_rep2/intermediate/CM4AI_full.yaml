description: >-
  CM4AI (Cell Maps for Artificial Intelligence) is the Functional Genomics Grand Challenge of the
  NIH Bridge2AI program. This record describes the June 2026 Data Release (Beta), deposited in the
  University of Virginia Dataverse. CM4AI generates multi-modal data — protein-protein interaction,
  spatial protein localization, and genetic perturbation — in MDA-MB-468 triple-negative breast
  cancer cells (untreated, or treated with paclitaxel or vorinostat) and in KOLF2.1J induced
  pluripotent stem cells and their derivatives (neural progenitor cells, neurons, cardiomyocytes).
  The June 2026 release comprises perturb-seq data for MDA-MB-468 cells with and without treatment
  and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 cells with and
  without treatment and for undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons and
  cardiomyocytes; AP-MS data for treated MDA-MB-468 cells; and immunofluorescence confocal images
  of MDA-MB-468 cells with and without treatment. The release is distributed as ten ZIP archives
  totalling roughly 12.6 GB, of which the three immunofluorescence image archives (4.6 GB untreated,
  4.2 GB vorinostat, 3.8 GB paclitaxel) account for nearly all the volume; the remaining archives
  hold AP-MS, SEC-MS, perturb-seq and release-level metadata and are between 30 KB and 1.1 MB each.
  Output data are packaged with provenance graphs and rich metadata as AI-ready RO-Crates using the
  FAIRSCAPE framework. The project portal reports project-wide totals of 1,374 protein interactions,
  53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted, and
  21.4 TB of data volume. The eventual product of the project — computed cell maps, hierarchical
  directed acyclic graphs whose nodes are protein assemblies resolved at increasing physical scale —
  is not included in this release.

