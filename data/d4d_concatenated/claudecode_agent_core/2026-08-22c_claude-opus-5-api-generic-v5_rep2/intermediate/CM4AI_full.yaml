updates:
  frequency: quarterly
  update_details: >-
    The dataset will be regularly updated and augmented through the end of the project in November
    2026, with updates on a quarterly basis. Computed cell maps, absent from this release, are to be
    added in future releases. CM4AI describes quarterly data releases of map-input data streams
    alongside the eventual machine-readable hierarchical cell maps.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  version_details: >-
    The June 2026 release is version 2.0 (cited as V2). Prior releases in the series remain
    separately citable in the University of Virginia Dataverse: October 2025 (doi
    10.18130/V3/K7TGEM, version 2.1), June 2025 (doi 10.18130/V3/F3TD5R, version 2.1), March 2025
    (doi 10.18130/V3/B35XWX, version 1.4), and May 2024 (doi 10.18130/V3/DXWOS5). Software packages
    are versioned as the project progresses and the version used to produce each dataset is
    referenced in the dataset's metadata.

retention_limit:
  retention_details: >-
    Long-term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds. No deletion schedule or retention cut-off is stated.

errata:
  - erratum_details: >-
      The June 2025 release was revised after initial publication: the revision added RGB
      immunofluorescent images, corrected RO-Crate metadata, and changed naming conventions.
    source_caveats: >-
      Recorded on the June 2025 release page (tier 5); no errata are recorded against the June 2026
      release itself.

notes: >-
  The University of Virginia Dataverse collection hosting this release, and the CM4AI project
  website, both display the notice: "This repository is under review for potential modification in
  compliance with Administration directives." This bears on the future availability of the
  collection and its files rather than on their content.

source_caveats: >-
  This record describes the CM4AI June 2026 Data Release (Beta), doi 10.18130/V3/HIGT4C, the
  highest-ranked source in the declared bundle and the one that supersedes the October 2025 release.
  Earlier dated releases (October 2025, June 2025, March 2025, May 2024) are represented as prior
  versions rather than merged into this record. Where the June 2026 record is silent — notably the
  per-file descriptions, the copyright statements and the immunofluorescence protein coverage — the
  values here are carried over from the next-best source and the carry-over is flagged locally.
  Creator names are recorded in the surname-plus-initials form used by the release's own author
  list; the CM4AI preprint gives fuller forms for some of the same people, which have not been
  substituted. The Nature 2025 paper on multimodal cell maps in U2OS osteosarcoma cells is present
  in the bundle and shares the project's Bridge2AI funding and Cell Mapping Toolkit software, but it
  describes a distinct dataset held in different repositories; its experimental parameters, counts
  and deposits have not been merged into this record and appear only as a related external resource.
  Project-wide counters (1,374 protein interactions, 53,788 immunofluorescent images, 7,023 proteins
  investigated, 11,739 genes targeted, 21.4 TB) come from the CM4AI portal (tier 2) and are not
  release-specific. Archive sizes are recorded as the repository displays them (rounded to GB, MB or
  KB), so total_size_bytes and total_file_count are omitted rather than approximated.