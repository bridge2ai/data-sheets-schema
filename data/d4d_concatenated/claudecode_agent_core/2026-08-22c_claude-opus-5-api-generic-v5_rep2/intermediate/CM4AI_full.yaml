purposes:
  - response: >-
      To map the spatiotemporal architecture of human cells and use those maps toward the grand
      challenge of interpretable genotype-phenotype learning.
  - response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data, produced
      from multimodal interrogation of chromatin modifiers, metabolic enzymes and other proteins
      involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant cell lines
      under treated and untreated conditions.
  - response: >-
      To broadly stimulate research and development in "visible" machine learning systems informed
      by multi-scale cell and tissue architecture, in which models are built directly on knowledge
      maps of cell structure rather than operating as black boxes.
  - response: >-
      To implement a standards-based data management approach founded on FAIR access and software
      principles, with deep provenance and replication packages for representation of cell maps and
      their underlying datasets.
  - response: >-
      To initiate a research program in ethical AI, especially as it relates to how cell maps will
      be used in genomic medicine and model interpretation, and to stimulate a diverse portfolio of
      training opportunities in the emerging field of biomachine learning.

addressing_gaps:
  - response: >-
      In genomics and precision medicine, machine learning models are often "black boxes" that
      predict phenotypes from genotypes without revealing the mechanisms by which such translation
      occurs. This dataset supplies the multi-scale cell architecture on which interpretable,
      "visible" models can be built.
  - response: >-
      Much of cell structure remains uncharted, and cell mapping technologies have typically been
      applied separately. CM4AI addresses the absence of matched, proteome-scale datasets acquired
      across complementary modalities in the same cellular context.
  - response: >-
      Existing biomedical datasets frequently lack the characteristics needed for reliable AI use.
      CM4AI addresses the absence of ethically sourced, fully provenanced, schema-characterized,
      explainable AI-ready datasets by packaging outputs with machine-readable provenance graphs,
      data dictionaries and licensing metadata.

tasks:
  - response: Training and evaluation of biomedical AI and machine learning models.
  - response: >-
      Construction of hierarchical cell maps by self-supervised multimodal embedding of protein
      interaction and protein image data followed by multi-resolution community detection.
  - response: >-
      Development of visible machine learning systems and visible neural networks that interrogate
      how protein assemblies in the cell affect cell-level phenotype predictions.
  - response: >-
      Analysis of cellular processes and of cell architectural changes and interactions in the
      presence of specific disease processes, treatment conditions or genetic perturbations.
  - response: >-
      Interpretation of genetic variants and mutations in downstream human genomics applications.

acquisition_methods:
  - acquisition_details: >-
      Protein-protein interactions were acquired by affinity purification-mass spectrometry (AP-MS)
      on endogenously tagged cell lines, measuring physical association of bait proteins with their
      interacting partners.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      Proteome-wide complex and interaction profiles were acquired by size-exclusion chromatography
      coupled to mass spectrometry (SEC-MS), an orthogonal mass-spectrometry approach to AP-MS.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      Spatial protein localization was acquired by immunofluorescence-based staining (ICC-IF) and
      confocal microscopy, imaging the subcellular distribution of proteins of interest.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      Transcriptional and fitness phenotypes were acquired by single-cell CRISPR interference
      (CRISPRi) perturbation screens read out by single-cell RNA sequencing (perturb-seq).
    was_directly_observed: true
    was_reported_by_subjects: false

collection_mechanisms:
  - mechanism_details: >-
      Immunofluorescence imaging: automated fixation and permeabilization protocols on a pipetting
      robot were established for the MDA-MB-468 and KOLF2 cell lines, using the Human Protein Atlas
      resource of antibodies. Each image carries four channels — DAPI for the nucleus (blue), a
      calreticulin antibody for the endoplasmic reticulum (yellow), a tubulin antibody for
      microtubules (red), and an antibody against the protein of interest (green).
  - mechanism_details: >-
      Affinity purification-mass spectrometry on endogenously tagged cell lines; genes were
      endogenously tagged in MDA-MB-468 cells and AP-MS acquired under untreated, paclitaxel-treated
      and vorinostat-treated conditions.
  - mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry for proteome-wide complex and
      interaction mapping, applied to MDA-MB-468 cells under three conditions and to KOLF2.1J iPSCs
      and their differentiated derivatives.
  - mechanism_details: >-
      Single-cell CRISPR screens using a CRISPR lentiviral library targeting chromatin factors with
      six guide RNAs per gene, in MDA-MB-468 and KOLF2 lines engineered to express inducible dCas9,
      read out with the 10x Genomics 3'HT kit.

data_collectors:
  - collector_details: >-
      Lundberg Lab, Stanford University — generation of immunofluorescence confocal images of
      MDA-MB-468 cells.
    role: spatial proteomics / cell imaging data generation
  - collector_details: >-
      Nevan Krogan laboratory, University of California San Francisco — generation of SEC-MS and
      AP-MS protein-protein interaction data in MDA-MB-468 cells and KOLF2.1J iPSCs and derivatives.
    role: mass spectrometry proteomics data generation
  - collector_details: >-
      University of California San Diego — genetic perturbation mapping by single-cell CRISPRi
      perturb-seq, and operation of the MuSIC data integration and map production pipeline.
    role: genetic perturbation data generation and data integration
  - collector_details: >-
      University of Virginia — AI-readiness packaging of data, software, metadata and provenance
      graphs using the FAIRSCAPE framework, and deposition into the University of Virginia
      Dataverse.
    role: standards, provenance and archival deposition

collection_timeframes:
  - timeframe_details: >-
      Data generation spans the CM4AI project period; NIH RePORTER records a project start of
      2022-09-01 and a project end of 2026-08-31, and the release states that the dataset will be
      regularly updated and augmented through the end of the project in November 2026, on a
      quarterly release cadence.
    source_caveats: >-
      The Dataverse record gives a Data Creation Date and Deposit Date of 2025-02-27 for the release
      itself; project start and end dates are transcribed from NIH RePORTER (tier 4) and describe
      the award period rather than an explicitly stated data collection window, so no start_date or
      end_date is asserted here.

direct_collection:
  - is_direct: false
    collection_details: >-
      Data were not collected from individuals. They were generated in the laboratory from
      commercially available, de-identified human cell lines obtained from third parties: MDA-MB-468
      (RRID:CVCL_0419) from ATCC, and KOLF2.1J (RRID:CVCL_B5P3) from the Human Induced Pluripotent
      Stem Cells Initiative (HipSci) resource, which makes the line available to not-for-profit
      organizations under a simple material transfer agreement.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Two disease-relevant, ethically sourced human cell lines were selected: MDA-MB-468, a triple
      negative breast cancer line established from a metastatic pleural effusion, and KOLF2.1J, an
      induced pluripotent stem cell line, each interrogated under perturbed and unperturbed
      conditions (paclitaxel or vorinostat treatment for the cancer line; neural progenitor,
      neuronal and cardiomyocyte differentiation for the iPSC line).
    why_not_representative: >-
      The release states that data were derived from commercially available de-identified human cell
      lines and do not represent all biological variants which may be seen in the population at
      large.
  - is_sample: true
    is_random: false
    strategies: >-
      Target selection was deliberate rather than random: the project set out to interrogate 100
      chromatin modifiers and 100 metabolic enzymes implicated in cancer, neuropsychiatric and
      cardiac disorders, expanding to genome-scale CRISPRi coverage of 11,739 targeted genes and
      project-wide interrogation of 7,023 proteins.
    source_caveats: >-
      The 100 + 100 target framing is from the CM4AI preprint (tier 3); the 11,739 gene and 7,023
      protein figures are project-wide counters from the CM4AI portal (tier 2) and are not restated
      on the June 2026 release record.

