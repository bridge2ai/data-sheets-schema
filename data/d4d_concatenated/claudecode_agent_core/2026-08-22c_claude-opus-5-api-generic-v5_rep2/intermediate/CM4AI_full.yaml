    The copyright statements are transcribed from the March 2025 and June 2025 release descriptions
    (tier 5) and the CM4AI preprint (tier 3); the June 2026 release record does not restate them and
    does not contradict them.

data_governance:
  committee_name: CM4AI Data Governance Committee
  committee_contact:
    name: Jillian Parker
    email: jillianparker@health.ucsd.edu
  access_review_process: >-
    The release names a Data Governance Committee contact. The CM4AI preprint records that the
    Ethics team worked with the Data Acquisition, Tools and Standards modules to develop a plan for
    ethical preparation, licensing, dissemination and Data Access supervision, balancing openness of
    the data against protection of intellectual property and supervision and monitoring of potential
    efforts at commercialization, and that a Data Access Committee supervises ethical matters
    related to dataset distribution and potential dual licensing for commercial use.
  stewardship_roles:
  - >-
    Ethical oversight contacts are named separately from the governance contact. Program management
    sits with the CM4AI Program Manager at the University of Alabama at Birmingham; deposition and
    long-term preservation sit with the University of Virginia Dataverse.
  notes: >-
    The Bridge2AI Ethics Working Group, supported by the CM4AI Ethics pillar, developed a Code of
    Conduct that participants in the Bridge2AI Open House must attest and commit to before accessing
    Bridge2AI data, including CM4AI datasets.

regulatory_restrictions:
  confidentiality_level: unrestricted
  regulatory_restrictions:
  - >-
    The release records that the data do not involve human subjects, that samples are de-identified,
    and that the data are not FDA regulated. All deposited files in the June 2026 release are
    publicly accessible without an access request.
  governance_committee_contact:
    name: Jillian Parker
    email: jillianparker@health.ucsd.edu

human_subject_research:
  involves_human_subjects: false
  regulatory_compliance:
  - >-
    The release states explicitly: Human Subjects — No; De-identified Samples — Yes; FDA Regulated —
    No. The CM4AI preprint adds that CM4AI data are distinctive within Bridge2AI in being
    non-clinical, derived from tissue cultures, and are considered de-identified as they cannot be
    matched, with current knowledge, to a human subject.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The release records that samples are de-identified and that data were derived from commercially
    available de-identified human cell lines. The CM4AI preprint states that the data are
    non-clinical, coming from tissue cultures, and are considered de-identified because they cannot
    be matched, with current knowledge, to a human subject. No de-identification procedure was
    applied by the project itself; the cell lines were obtained already de-identified from ATCC and
    the HipSci resource.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The dataset comprises laboratory measurements — mass spectrometry, confocal microscopy images
      and single-cell sequencing — on two commercially available, de-identified human cell lines. No
      human subjects are involved and no personal identifiers are recorded.
    source_caveats: >-
      Recorded as absent on the basis of the release's explicit governance statements (Human
      Subjects — No; De-identified Samples — Yes); the sources do not make a direct affirmative
      statement that no sensitive elements are present.

collection_consents:
  - consent_details: >-
      Both cell lines used by the project are described as ethically sourced. MDA-MB-468 is available
      from ATCC and KOLF2.1J was derived from a healthy male Northern European donor and is available
      from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource for access by
      not-for-profit organizations via a simple material transfer agreement.
    source_caveats: >-
      Ethical sourcing and cell line provenance are stated in the CM4AI preprint (tier 3); the
      Dataverse releases record only that samples are de-identified and that no human subjects are
      involved. No project-level consent process is described, consistent with the absence of human
      subjects.

ethical_reviews:
  - contact_person:
      id: ORCID:0000-0002-7080-8801
      name: Vardit Ravitsky
      email: ravitskyv@thehastingscenter.org
    review_details: >-
      Named on the release as an ethical review contact for the CM4AI data release.
  - contact_person:
      id: ORCID:0000-0002-8965-8153
      name: Jean-Christophe Bélisle-Pipon
      email: jean-christophe_belisle-pipon@sfu.ca
    reviewing_organization: Simon Fraser University
    review_details: >-
      Named on the release as an ethical review contact for the CM4AI data release.
  - review_details: >-
      CM4AI operates a dedicated Ethics module, one of the project's three pillars alongside Data
      and People. It employs a methodology inspired by Value-Sensitive Design to create normative
      standards and expectations for responsible design of datasets and AI technologies, has
      developed an axiological repository of values, and is formulating the CM4AI Life Cycle, a
      framework elucidating governance milestones throughout data generation and AI system
      development. The module conducts mixed qualitative and quantitative empirical research to
      capture community insights and is developing tools to support awareness of the ethical, legal
      and social ramifications of CM4AI data and derived AI systems.
    source_caveats: >-
      Described in the CM4AI preprint (tier 3); no institutional review board approval or ethics
      committee determination number is recorded in any source, consistent with the release's
      statement that no human subjects are involved.

