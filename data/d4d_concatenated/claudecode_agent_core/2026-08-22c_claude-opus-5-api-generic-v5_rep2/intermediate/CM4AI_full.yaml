subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      The dataset derives from two human donor-derived cell lines whose donor characteristics are
      documented in the cell line records.
    distribution: >-
      MDA-MB-468 was established from a metastatic site pleural effusion of a 51-year-old Black
      female with metastatic mammary adenocarcinoma. KOLF2.1J was derived from a healthy male
      Northern European donor. No other donor backgrounds are represented.
    source_caveats: >-
      Donor descriptions are taken from the CM4AI preprint (tier 3), which characterizes both cell
      lines; the Dataverse release records only that the samples are commercially available and
      de-identified.

relationships:
  - relationship_details: >-
      Protein-protein interaction data encode explicit relationships between proteins: AP-MS links a
      tagged bait protein to its recovered partners, and SEC-MS co-elution links proteins that
      fractionate together. Across modalities, instances are related by shared protein or gene
      target, so that an image, an interaction profile and a perturbation phenotype can be joined
      for the same protein. The release notes that the SEC-MS, immunofluorescence imaging and
      CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap, so the
      cross-modality join is partial.

missing_data_documentation:
  - missing_data_patterns: >-
      The SEC-MS, immunofluorescence imaging and CRISPRi perturb-seq modalities interrogate sets of
      proteins which incompletely overlap, so many proteins are covered by some modalities but not
      others. Computed cell maps, the integrated product of the pipeline, are absent from this
      release. Perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 cells are marked embargoed at
      their external links.
    missing_data_causes: >-
      The release is explicitly described as interim and not in completed final form; some datasets
      are under temporary pre-publication embargo.
    handling_strategy: >-
      The dataset is to be regularly updated and augmented on a quarterly basis through the end of
      the project in November 2026, with computed cell maps to be added in future releases.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from commercially available de-identified human cell lines
      and do not represent all biological variants which may be seen in the population at large.
      Only two donor genetic backgrounds are represented.
    mitigation_strategy: >-
      The release documents this explicitly under Potential Sources of Bias so that users can scope
      conclusions accordingly.
  - bias_type: selection_bias
    bias_description: >-
      Protein and gene targets were chosen deliberately rather than sampled without preference —
      the project focuses on chromatin modifiers, metabolic enzymes and other proteins involved in
      cancer, neuropsychiatric and cardiac disorders — and the modalities cover incompletely
      overlapping protein sets, so coverage across the proteome is uneven.

known_limitations:
  - limitation_type: temporal_limitation
    limitation_description: >-
      This is an interim release; the data are not yet in completed final form.
    recommended_mitigation: >-
      Track the quarterly release cadence through November 2026 and cite the specific dated release
      version used.
  - limitation_type: scope_limitation
    limitation_description: >-
      The release does not contain predicted or computed cell maps, which will be added in future
      releases.
    scope_impact: >-
      Applications that depend on the integrated hierarchical cell map, rather than on the
      individual input modalities, cannot be served by this release.
  - limitation_type: integration_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the individual datasets
      rather than for integrated cross-modality analysis.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The protein-protein interaction (SEC-MS), protein localization (immunofluorescence imaging)
      and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Some datasets are under temporary pre-publication embargo; the perturb-seq deposits for
      KOLF2.1J iPSCs and for MDA-MB-468 cells are marked embargoed at their external links.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Meaningful analysis requires domain expertise in proteomics, cell imaging and functional
      genomics.

intended_uses:
  - use_category: AI-ready data for functional genomics research
    usage_notes: >-
      The release is intended to provide AI-ready datasets supporting research in functional
      genomics, packaged with provenance graphs and rich metadata.
  - use_category: AI model training
    usage_notes: >-
      Intended for training biomedical AI and machine learning models, including "visible" models
      built directly on knowledge maps of cell and tissue architecture.
  - use_category: Cellular process analysis
    usage_notes: >-
      Intended for analysis of cellular processes using protein interaction, spatial localization
      and genetic perturbation evidence in matched cellular contexts.
  - use_category: Analysis of cell architecture under disease, treatment and perturbation
    usage_notes: >-
      Intended for study of cell architectural changes and interactions in the presence of specific
      disease processes, treatment conditions or genetic perturbations.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license; commercial use requires a
      separate license negotiation with the copyright holder, and a Data Access Committee supervises
      ethical matters related to dataset distribution and potential dual licensing for commercial
      use.

discouraged_uses:
  - discouragement_details: >-
      Use of this release as a source of integrated hierarchical cell maps is discouraged, because
      computed cell maps are not included; the release is most suitable for bioinformatics analysis
      of the individual modality datasets.
  - discouragement_details: >-
      Treating protein coverage as uniform across modalities is discouraged, because the SEC-MS,
      imaging and perturb-seq datasets interrogate incompletely overlapping protein sets.

existing_uses:
  - notes: >-
      The genome-scale CRISPRi perturbation data in KOLF2.1J induced pluripotent stem cells are
      reported in Nourreddine S, Doctor Y, Dailamy A, et al., "A perturbation cell atlas of human
      induced pluripotent stem cells", bioRxiv 2024, doi 10.1101/2024.11.03.621734, which is listed
      as a related publication of the release.
  - notes: >-
      The project, its methods, standards, datasets, software tools and status are described in
      Clark T, Mohan J, Schaffer L, et al., "Cell Maps for Artificial Intelligence: AI-Ready Maps of
      Human Cell Architecture from Disease-Relevant Cell Lines", bioRxiv 2024,
      doi 10.1101/2024.05.21.589311, the release's primary related publication.
  - notes: >-
      An initial release of CM4AI datasets, tools and standards was distributed with detailed
      tutorials at a project CodeFest in March 2024, attended by 38 registrants from within and
      outside the project.

future_use_impacts:
  - impact_details: >-
      The project anticipates that these data will underpin a new generation of interpretable
      biomedical AI, and its ethics program is explicitly directed at how cell maps will be used in
      genomic medicine and model interpretation. The stated ethical requirement includes
      anticipating potential applications of the data and derived AI/ML systems, integrating them
      into data governance frameworks to optimize benefits and mitigate potential risks, and
      promoting their use for the collective good.
  - impact_details: >-
      Future releases are expected to add computed cell maps, which would extend the usable scope of
      the resource from single-modality bioinformatics analysis to integrated, multi-scale
      structure-informed modeling; users building on the current release should expect the resource
      they depend on to grow and change.

raw_data_sources:
  - source_description: >-
      Immunofluorescence confocal microscopy images of MDA-MB-468 cells generated in the Lundberg
      Lab at Stanford University using Human Protein Atlas antibodies.
    source_type: laboratory imaging
    raw_data_format: Four-channel confocal image files, distributed as ZIP archives
    access_details: >-
      Distributed directly in this release as the three cm4ai_ifimages_MDA-MB-468_*.zip archives.
  - source_description: >-
      Raw mass spectrometry files from size-exclusion chromatography-mass spectrometry and affinity
      purification-mass spectrometry experiments performed in the Nevan Krogan laboratory at the
      University of California San Francisco.
    source_type: mass spectrometry proteomics
    raw_data_format: Mass spectrometry raw files and search results
    access_details: >-
      Deposited externally in the MassIVE repository, to which the release links separately for
      SEC-MS in KOLF2.1J iPSCs and derivatives, SEC-MS in MDA-MB-468 cells, and AP-MS in
      paclitaxel-treated and vorinostat-treated MDA-MB-468 cells.
  - source_description: >-
      Raw single-cell sequencing reads from genome-scale CRISPRi perturb-seq screens in KOLF2.1J
      induced pluripotent stem cells and in MDA-MB-468 breast cancer cells.
    source_type: single-cell RNA sequencing
    raw_data_format: Sequence read data
    access_details: >-
      Raw sequence data are lodged with the NCBI Sequence Read Archive under a BioProject; the
      accompanying cm4ai_perturb-seq_KOLF2_raw_sra.zip archive in this release carries the
      RO-Crate metadata for that deposit. The perturb-seq links for KOLF2.1J iPSCs and for
      MDA-MB-468 cells are marked embargoed on the June 2026 release record.

preprocessing_strategies:
  - preprocessing_details: >-
      Input data streams are integrated by the Multi-Scale Integrated Cell (MuSIC) software
      pipeline. Protein-protein interaction networks are reduced in dimensionality with the node2vec
      deep learning model to produce a PPI embedding; immunofluorescence images are reduced with a
      Human Protein Atlas deep learning model to produce an image embedding; the two embeddings are
      integrated by contrastive deep learning into a per-protein co-embedding such that the original
      embeddings can be reconstructed with minimal information loss; community detection over
      all-by-all co-embedding similarities then yields a hierarchy of protein communities. The
      resulting hierarchy is annotated by alignment to Gene Ontology and Reactome and by a large
      language model that names protein sets and assigns a name confidence score.
    source_caveats: >-
      This pipeline is described in the CM4AI preprint (tier 3). The June 2026 release (tier 1)
      states that computed cell maps are not included in this release, so the pipeline is recorded
      here as the project's map-production workflow applied to these input data streams rather than
      as processing already reflected in the deposited files.
  - preprocessing_details: >-
      Each pipeline segment invokes the FAIRSCAPE client to validate inputs and emit an RO-Crate
      package containing datasets, metadata and software or resolvable references to them; the
      FAIRSCAPE server then registers the crate and its components, assigns persistent resolvable
      ARK identifiers, and computes end-to-end provenance entailments expressed in the EVI Evidence
      Graph Ontology, available as JSON-LD and RDF/XML.

