id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset generated by AI-READI (the Bridge2AI
  Salutogenesis Grand Challenge), containing cross-sectional data from 2,280 adult
  participants with and without type 2 diabetes mellitus (T2DM) collected between
  19 July 2023 and 1 May 2025 at three United States sites (University of Alabama at
  Birmingham, University of California San Diego, University of Washington) and
  harmonized across sites. Recruitment sampling aimed at an approximately equal
  distribution of participants across diabetes severity groups (no diabetes;
  pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin injectable
  medication; insulin-controlled), self-reported race/ethnicity, and sex, so that the
  data would support downstream artificial intelligence and machine learning analyses
  that existing claims or electronic health record sources cannot. Modalities include
  survey and clinical data mapped to the OMOP Common Data Model, blood and urine
  laboratory results, physical and vision measurements, cognitive (MoCA) and
  monofilament testing, 12-lead electrocardiography stored as WFDB, retinal photography,
  optical coherence tomography, optical coherence tomography angiography and
  fluorescence lifetime imaging ophthalmoscopy stored as DICOM, ten-day continuous
  glucose monitoring and wearable activity monitoring stored as Open mHealth, and
  ten-day home environmental sensor data. The release contains no protected health
  information; information on sex, race/ethnicity and medications used has also been
  removed and is held only under controlled access. The dataset comprises 356,343 files
  and approximately 3.82 TB, organized according to the Clinical Dataset Structure (CDS)
  v0.1.1 with one directory per datatype, then modality, then device, then participant.
version: '3.0.0'
