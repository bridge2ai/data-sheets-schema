raw_data_sources:
  - source_description: >-
      Participant-completed questionnaires and coordinator-entered clinical data captured
      in the REDCap electronic data capture system.
    source_type: primary data capture system
    raw_data_format: REDCap exports
    access_details: >-
      Not shared. The raw REDCap data have not been mapped to standardized terminologies
      and free-text fields may contain personal health or personally identifiable
      information.
  - source_description: >-
      Retinal imaging device exports from the six imaging devices, in native device
      formats.
    source_type: imaging device export
    raw_data_format: >-
      DICOM natively for Optomed Aurora, iCare EIDON, Heidelberg Spectralis and Zeiss
      Cirrus; .fda for Topcon Maestro2 and Topcon Triton; .sdt for Heidelberg FLIO.
    access_details: >-
      Not shared; the converted DICOM representations are what appear in the released
      dataset.
  - source_description: 12-lead electrocardiogram exports from the Philips PageWriter TC30.
    source_type: clinical device export
    raw_data_format: .xml
  - source_description: >-
      Continuous glucose monitoring exports from the Dexcom G6 covering the ten-day
      wear period.
    source_type: wearable device export
    raw_data_format: .csv
  - source_description: Physical activity exports from the Garmin Vivosmart 5.
    source_type: wearable device export
    raw_data_format: .FIT
  - source_description: >-
      Indoor environmental measurements from the custom LeeLab Anura home sensor.
    source_type: custom sensor export
    raw_data_format: .csv
  - source_description: >-
      Blood and urine assay results returned by the local CLIA-certified laboratories and
      by the University of Washington Nutrition and Obesity Research Center.
    source_type: laboratory information system output
    raw_data_format: .csv
  - source_description: >-
      Electronic health records at the three health systems, screened for ICD-10 codes
      E11.X and R73.09 and for demographics to build recruitment contact pools.
    source_type: electronic health record screening
    access_details: >-
      Used to identify and invite potential participants; the screening extract is not
      part of the released dataset.

raw_sources:
  - raw_data_details: >-
      The raw data are saved and are expected to be preserved by the project for at least
      the duration of the project, but are not currently anticipated to be shared outside
      the project team, because they have not been mapped to standardized terminologies
      and because raw records may accidentally contain personal health or personally
      identifiable information in free-text fields. Raw data may be included in future
      releases of the controlled-access dataset.

preprocessing_strategies:
  - preprocessing_details: >-
      Data were mapped to standardized terminologies and models wherever possible: the
      Observational Medical Outcomes Partnership Common Data Model for clinical data,
      DICOM for medical imaging, the WaveForm DataBase standard for electrocardiography,
      Open mHealth for wearable activity and continuous glucose monitoring, and the NASA
      ASCII file format guidelines for environmental sensor data.
  - preprocessing_details: >-
      Proprietary device outputs were converted before upload: Topcon .fda files and
      Heidelberg FLIO .sdt files were converted to DICOM, Garmin .FIT files were converted
      to the Open mHealth standard, and ECG exports were placed in WFDB form.
  - preprocessing_details: >-
      Protected health information was withheld from the release, and information related
      to sex, race/ethnicity and medications used was additionally removed, in the latter
      case to prevent stigmatization of findings. Five-digit zip code, genetic sequencing
      data, past health records and traffic and accident reports are held under controlled
      access rather than released publicly.
  - preprocessing_details: >-
      The dataset was organized according to the Clinical Dataset Structure v0.1.1, with
      one directory per datatype at the root, then modality, then device, then
      participant, and with manifest and description metadata files generated at each
      level.
  - preprocessing_details: >-
      Processing for this release used a combination of automated pipelines and custom
      steps; the changelog records processing as ad hoc and custom for version 1.0.0 and
      as automated plus custom for the year-two and year-three data included in this
      version.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the point of data entry: clinical data outside expected minimum
      and maximum ranges were flagged in REDCap and appeared in reports viewed by clinical
      research coordinators and data managers, who then examined the participant record
      and determined whether an error was likely.
  - cleaning_details: >-
      Records were checked for credibility against prespecified reasonable ranges, for
      incorrect flow through prescribed skip patterns, for missing data that could be
      filled directly from other portions of an individual's record, and for the omission
      or duplication of records.
  - cleaning_details: >-
      Editing was done only under the guidance and approval of the site principal
      investigator. Where corrected data were available elsewhere in the respondent's
      answers the error was corrected; where there was no logical or appropriate way to
      correct a value, the site principal investigator reviewed it and decided whether it
      should be removed.
  - cleaning_details: >-
      The data manager at each site was responsible for quality control of all data before
      upload to FAIRhub, and the central project team performed further processing before
      dissemination. The dataset has not been externally audited but has been reviewed
      internally by team members for quality and to confirm that no personally identifiable
      information was accidentally included.
  - cleaning_details: >-
      No instances were excluded at the time of preprocessing; exclusion operated at the
      point of recruitment through the eligibility criteria rather than after collection.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; completeness varies by
      modality and by participant rather than following a single pattern.
    missing_data_causes: >-
      Some participants elected not to take part in some study elements. In a few cases
      the data collection device held no stored results or was returned too late for the
      results to be retrieved, for example because the battery died or the data were
      lost. In a few cases a data collision at some point in the process led to loss of
      data. Skipped questions and incomplete responses are expected in the survey data,
      and the Garmin battery had to be charged every two to three days, which creates
      gaps in the wearable record.
    handling_strategy: >-
      Missing values are left missing; no imputation protocol is described. During
      cleaning, missing data that could be filled directly from other portions of an
      individual's record were filled, under site principal investigator approval.

anomalies:
  - anomaly_details: >-
      Survey data contain skipped questions and incomplete responses, which the creators
      describe as expected.
  - anomaly_details: >-
      Wearable data are subject to improper use, technical failure such as battery
      failure, and system malfunction.
  - anomaly_details: >-
      Imaging data are subject to participant non-cooperation, noise that may obscure the
      images, system malfunction and data transfer failures.
  - anomaly_details: >-
      Optomed Aurora images are acquired handheld and undilated, which makes a good view
      harder to obtain, so image quality varies from participant to participant and within
      the same participant.
  - anomaly_details: >-
      FLIO acquisition is performed last in the visit because it takes longer than a
      standard OCT and exposes participants to uncomfortable levels of light, so
      participants may not be at their best possible compliance; the device cannot
      tolerate more than about one centimeter of movement during acquisition, and
      background light or lens fluorescence contributes unwanted signal that cannot simply
      be subtracted because it belongs to the same photon distribution as the useful data.
  - anomaly_details: >-
      Devices operated manually rather than automatically, such as the Heidelberg
      Spectralis, are more exposed to operator-induced error and quality problems, which
      may lead to a modality being skipped and data being missing.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so the study is subject to volunteer bias, which may
      limit the generalizability of results to people not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of the composition of enrolled participants,
      and under- or oversampling of groups as needed.
  - bias_type: sampling_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based and draws only on patients who
      have had an encounter with one of three academic health systems, which may not fully
      capture the range of cultural and socioeconomic backgrounds in the wider population.
    mitigation_strategy: >-
      Three recording sites were selected for geographic variability across the United
      States and to broaden representation across racial and ethnic groups, and
      individuals from all demographic backgrounds were recruited at all three sites.
      Uniform data collection protocols were used for all participants at all sites.
  - bias_type: representation_bias
    bias_description: >-
      The cohort does not include other races and ethnicities such as Pacific Islanders
      and Native Americans, and the eligibility requirement that participants speak and
      read English may itself have created difficulty recruiting Hispanic and Asian
      participants.
    mitigation_strategy: >-
      The creators state that if balancing on race and ethnicity emerges as a challenge,
      new recruitment strategies will be implemented; the project also engages the Native
      Biodata Consortium on the distinct questions raised by American Indian and Alaska
      Native data.
  - bias_type: representation_bias
    bias_description: >-
      Although the study design targets balance across race/ethnicity, biological sex and
      diabetes presence and severity, enrollment is ongoing and interim releases,
      including this one, may not have achieved a balanced distribution across groups.
    mitigation_strategy: >-
      A suggested train/validation/test split is supplied in which the validation and test
      sets are balanced as far as possible for sex, race/ethnicity and diabetes status.
    affected_subsets:
      - suggested training split
  - bias_type: measurement_bias
    bias_description: >-
      Modalities such as OCT were captured on several different device makes and models
      with different scan protocols, so measurements are not directly interchangeable
      across devices.
    mitigation_strategy: >-
      Device make and model and the specific scan modality were documented to ensure
      repeatability, and multiple devices were deliberately included for a single measure
      to improve generalizability and to represent the range of equipment used in clinical
      settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population;
      it is balanced by design rather than demographically representative, and omits
      racial and ethnic groups including Pacific Islanders and Native Americans.
    scope_impact: >-
      Affects the external validity of any model trained on the dataset when applied to
      populations not represented.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Sex, race, ethnicity, medications, five-digit zip code, genetic sequencing data,
      past health records and traffic and accident reports are not present in this public
      release; they are held under controlled access requiring a data use agreement.
    recommended_mitigation: >-
      Users requiring these variables must enter into a data use agreement for the
      controlled-access version.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The design is cross-sectional with a single study visit per participant and ten days
      of at-home monitoring; only about 10 percent of the cohort is planned for a
      follow-up visit in year four, so this release supports no within-person longitudinal
      analysis.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility restricts the cohort to adults aged at least 40 (and not older than 85)
      who are able to provide consent and who speak and read English; pregnancy,
      gestational diabetes and type 1 diabetes are exclusionary.
  - limitation_type: coverage_limitation
    limitation_description: >-
      No unstructured text data are included in the dataset.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Version 3.0.0 dropped the Snellen visual acuity variables, so only logMAR visual
      acuity measurements are available; analyses depending on Snellen values cannot be
      reproduced against this version.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The creators state that the dataset contains no data that, if viewed directly, might
      be offensive, insulting, threatening or otherwise pose a safety risk such as
      psychological safety or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The creators state that the dataset contains no data that might be considered
      confidential, such as data protected by legal privilege or doctor-patient
      confidentiality, and that no personally identifiable information is included in the
      release.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public release does not contain data considered sensitive. The controlled-access
      counterpart does contain sensitive elements, namely racial and ethnic origin, sex,
      location at the level of five-digit zip code, genetic sequencing data, past health
      records, medications, and motor vehicle traffic and accident reports.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification was applied because no identifiers were collected; instead
    the data were checked to confirm that no identifiable data as defined by US HIPAA were
    present.
  identifiers_removed: >-
    Protected health information as defined by the HIPAA Privacy Rule, together with sex,
    race/ethnicity and medications used.
  deidentification_details: >-
    The DataCite de-identification block records direct identifier removal and HIPAA
    de-identification as applied, with date shifting, non-arrangement and k-anonymity not
    applied. The RO-Crate records the dataset as de-identified. Participant folders are
    named with a study-assigned participant identifier rather than any direct identifier.
    Privacy techniques applied around the release include a tiered public and
    controlled-access dissemination system, access only after login through a verified ID
    system, a strict license agreement, static watermarking of the data to identify the
    licensee, storage restricted to institution servers or cloud services covered by a
    HIPAA Business Associate Agreement, and a prohibition on sharing data with third-party
    model vendors for training. The creators state that there is a theoretical risk of
    future re-identification and note that AI algorithms can infer individual patient
    characteristics and could facilitate individual-level identification, which is why the
    dissemination system, license and watermarking were put in place. Within the dataset, a
    study-assigned participant identifier links a participant's files across datatypes,
    modalities and devices; the controlled-access version links further variables,
    including five-digit zip code, past health records and traffic and accident reports, to
    the same participants. The at-home devices were selected with participant privacy as a
    primary concern: they capture no video or audio, have no GPS location monitoring and
    are not synced with participant-owned devices. No data protection impact assessment has
    been conducted.
  source_caveats: >-
    The Nature Metabolism comment describes the public set as being stripped of Protected
    Health Information via the HIPAA Safe Harbor method, whereas the tier-1 FAIRhub
    metadata states that no identifiers were collected so no active de-identification was
    necessary and only verification was performed. The tier-1 statement is preferred here.
    The healthsheet questions on de-identification pre-processing were left blank.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted, as stated in the healthsheet
      response to the question about analysis of the potential impact of the dataset and
      its use on data subjects.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      Approved by the University of Washington Institutional Review Board under protocol
      STUDY00016228; initial approval received 20 December 2022.
    - >-
      Annual renewal application to the IRB reporting the status and progress of the study
      is required and is due within 90 days of expiration.
    - >-
      Reliance agreements cover the Institutional Review Boards of the University of
      Alabama at Birmingham and the University of California, San Diego.
  ethics_review_board: >-
    Institutional Review Board of the University of Washington, with reliance agreements
    covering the Institutional Review Boards of the University of Alabama at Birmingham
    and the University of California, San Diego.
  regulatory_compliance:
    - Registered on ClinicalTrials.gov as NCT06002048.
    - >-
      Recorded in the FAIRhub oversight metadata as not FDA-regulated for drugs and not
      FDA-regulated for devices; the RO-Crate likewise records fdaRegulated as false.
    - >-
      Recorded in the FAIRhub oversight metadata as having no data monitoring committee.
    - >-
      Human subject review status recorded in the FAIRhub oversight metadata as submitted
      and approved.
    - >-
      Licensees of the dataset must comply with the NIH Genomic Data Sharing Policy
      security best practices for controlled-access data.
  special_populations:
    - >-
      None targeted. Participants are adults aged 40 to 85 who are able to provide
      consent, and no protected population is an inclusion criterion.
    - >-
      Pregnancy, gestational diabetes and type 1 diabetes are exclusionary; children,
      prisoners and neonates are not enrolled.
  source_caveats: >-
    The RO-Crate names the reviewing body "Washington University IRB" but gives the
    contact and postal address of the University of Washington Human Subjects Division
    (hsdrely@uw.edu, Human Subjects Division, University of Washington, 4333 Brooklyn Ave
    NE Box 359470, Seattle WA 98195-9470). The IRB application form and the study protocol
    publication both identify the reviewing body as the University of Washington IRB.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      Protocol STUDY00016228, initial approval 20 December 2022, with the approval letter
      published alongside the dataset documentation. The other clinical sites operated
      under IRB reliance and used the same consent form with minor institution-specific
      language. Written informed consent is provided by all participants.
  - reviewing_organization: AI-READI ethics team
    contact_person:
      name: Camille Nebeker
    review_details: >-
      Ethical, legal and social implications are considered at every stage of the project
      cycle, with guidance from bioethicists. The RO-Crate records the ethical review as
      carried out by Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      A Community Advisory Board of 11 persons drawn from the three sites, including
      diversity in race and ethnicity as represented in the sample, contributes to the
      development of the protocol and evaluates the consent forms and research protocols,
      with its feedback incorporated into protocol modifications.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically before the visit or in
      person at the start of the visit. The DataCite metadata classifies the consent as
      "ConsentSpecifiedNotElsewhereCategorised", with no non-commercial, geographic,
      research-type, genetic-only or methods restrictions recorded at the consent level.
    consent_scope: >-
      Consent covers participation in the study protocol and placement of the resulting
      data in an open-source repository, and biospecimen banking for future research. The
      public version of the dataset may be used only for type 2 diabetes related research;
      a private version allows more generic use.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of
      Washington, is published with the dataset documentation as
      "AI-READI Consent_Form_Standard_Mod17May2023_useforpilot.pdf". Electronic consent
      was captured in REDCap and the signed form was emailed automatically to the
      participant, who could request a further copy from the study coordinator at any time
      during the study.
    withdrawal_mechanism: >-
      Participants may withdraw consent at any time and cease study participation; any
      data that had been shared or used up to that point remain in the dataset. This is
      stated in the consent document.
    notes: >-
      Informed consent was required before participation in any part of the protocol,
      including the questionnaires. Potential participants could read all consent
      documentation electronically before the visit and consent with an electronic
      signature without speaking to a coordinator, could request a call back or video
      conference to ask questions, or could wait and sign in person at the visit. Access to
      study questionnaires in REDCap was opened only after consent had been given, with the
      exception of the screening questionnaire; those without internet access could call
      research staff for alternative methods of enrollment. Every individual was aware of
      the data collection, because this was active collection directly from participants
      rather than passive collection or secondary use of existing data: notification began
      with a personalized hardcopy invitation letter and an invitation email carrying
      links, access codes and QR codes into the online REDCap recruitment interface, where
      individuals could read an overview of the research programme, the expectations for
      participation and answers to frequently asked questions, download the informed
      consent document, or request a call back from study staff. Participants received a
      stipend of 200 US dollars for the study visit, paid from the NIH grant funding once
      the final data and study devices had been received, typically at least two weeks
      after the visit and not prorated, together with reimbursement of reasonable parking,
      public transit or rideshare costs and, where travel barriers were reported, provision
      of rideshare transportation assistance. Study personnel effort was supported by NIH
      award OT2OD032644 in proportion to effort contributed and at salaries aligned with
      the funding guidelines at each site; the IRB application notes that transport costs
      above 25 US dollars would not be reimbursed.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      Eligibility requires participants to be at least 40 years old, which excludes minors
      by design.
    - >-
      Eligibility excludes adults older than 85 years of age.
    - >-
      Participants must be able to provide consent for themselves; no legally authorized
      representative pathway is used.
    - >-
      Pregnancy and gestational diabetes are exclusionary, established by the screening
      questionnaire before enrollment.
    - >-
      Prisoners are not a target population and are not enrolled.

data_governance:
  committee_name: Data Access Committee
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: >-
    Access to the public dataset requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to
    the license terms, which set restrictions and obligations for data usage. The DataCite
    access type is recorded as PublicDownloadSelfAttestationRequired, and conditions of
    access are published at https://fairhub.io/datasets/3/access. The controlled-access set
    contains everything in the public set plus more sensitive data, and is available only
    to scientists whose institutions have completed legal and privacy use agreements with
    the research programme.
  stewardship_roles:
    - >-
      Data managers at each site are responsible for quality control of all data before
      upload to FAIRhub.
    - >-
      The central project team performs standardization and packaging before dissemination.
    - The AI-READI team supports and maintains the dataset.
    - FAIRhub, running on Microsoft Azure, hosts the dataset.
    - >-
      Washington University in St. Louis is recorded as the managing organization, the
      lead sponsor and the Licensor under the data license.
    - >-
      The RO-Crate names the AI-READI Consortium as the data governance committee.
  notes: >-
    Through engagement with the Native Biodata Consortium, the project treats American
    Indian and Alaska Native data as a distinct governance question, evaluating data usage
    agreements, contract negotiations, transparent access agreements and forms of assured
    return of benefit and sustainable input, control and monitoring of Tribal data. The
    requirements for the controlled-access set were still being developed by the Data
    Access Committee at the time the study protocol was published. The dataset is
    distributed publicly through the FAIRhub platform to users outside the creating
    institutions; onward sharing by a licensee is tightly constrained, in that data may be
    conveyed only to another licensee bound by an identical agreement, and then only for
    the purpose of collaborating on one or more projects involving the data.
  source_caveats: >-
    The FAIRhub metadata gives Washington University in St. Louis as managing organization
    and lead sponsor, while the RO-Crate places the principal investigator in the
    Department of Ophthalmology at the University of Washington and the study protocol
    publication and NIH RePORTER record place the award and the IRB at the University of
    Washington. Both institutions appear in tier-1 sources.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    The AI-READI Data License Agreement version 2.0, with Washington University in St.
    Louis as Licensor, published at https://doi.org/10.5281/zenodo.17555036. It grants a
    non-exclusive, non-transferable license to download, reproduce and use the data and to
    create derivative works, for research and for commercial and non-commercial purposes.
    A licensee may be an individual or an authorized group within an institution, in which
    case the licensee is liable for all acts and omissions of authorized users. Data may be
    shared only with other licensees bound by identical terms, and may be stored only on
    servers and devices maintained by and located within the licensee's institution or on
    cloud or backup services covered by a HIPAA Business Associate Agreement with that
    institution. Data may not be shared with any third-party model vendor or developer for
    training or development, though a third-party model under a Business Associate
    Agreement may be used for short-term analysis such as prompting or querying. Models
    trained on the data may be distributed provided they do not themselves contain the data
    and provided the licensee has taken all reasonable efforts to minimize the likelihood
    that data can be memorized, derived, reconstructed or reconstituted from them.
    Derivative data and synthetic data generated from the data are themselves treated as
    data under the agreement. Data may not be reproduced in papers except as small
    representative samples in up to five images or figures per paper. Licensees may not
    make clinical treatment decisions based on the data, nor attempt to identify, contact
    or infer information about any data subject. Licensees must acknowledge the licensor,
    source and funder, comply with NIH Genomic Data Sharing security best practices, and
    not remove or alter the static watermarking. The agreement terminates automatically on
    any breach, requiring deletion of all copies. The data are provided "as is" with a
    disclaimer of warranty, an aggregate liability cap of one US dollar, and an
    indemnification obligation on the licensee.
  notes: >-
    The license was written specifically to enable reuse of this and other clinical
    datasets for commercial or research purposes while imposing strong requirements on
    data usage, security and secondary sharing to protect study participants, particularly
    where data are reused for AI and ML applications. An earlier version of the license
    terms was published on Zenodo in 2024. The single data use permission term recorded
    here reflects the access condition attached to the public release, that the data be
    used only for type 2 diabetes related research; the license text itself permits
    research, commercial and non-commercial use, so the restriction operates through the
    access self-attestation rather than through the license grant.

ip_restrictions:
  restrictions:
    - >-
      Title to the data and all industrial and intellectual property rights in it remain
      solely and exclusively with the Licensor, Washington University in St. Louis, and
      its suppliers; the licensee must take no action inconsistent with that ownership and
      any rights not expressly granted are reserved.
    - >-
      Licensees may make, reproduce and distribute models, algorithms and programs
      developed, trained or adapted using the data provided those artefacts do not
      themselves contain the data or a modified version of it.
    - >-
      Publishers and conference organizers wishing to reproduce more than the permitted
      five images or figures per paper must obtain a separate license from the Licensor.
    - >-
      The creators state that no third parties have imposed IP-based or other restrictions
      on the data beyond those in the license.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      In response to the datasheet question about export controls and other regulatory
      restrictions, the creators refer to the dataset license rather than naming any
      specific export-control regime.
    - >-
      The license requires the licensee to comply with all applicable laws, regulations
      and restrictions relating to the distribution and use of the data and of models
      built from it.
  other_compliance: >-
    Licensees must comply with the data security and privacy standards established by the
    US National Institutes of Health under its Genomic Data Sharing Policy, in the version
    current from time to time. The study is recorded as not FDA-regulated for drugs or
    devices. The release contains no protected health information as defined by HIPAA.
  source_caveats: >-
    The RO-Crate, a tier-1 source, records the confidentiality level as "HL7:2N (normal)".
    The enum value "restricted" is recorded here because access requires verified identity,
    self-attestation and acceptance of the license, and because a controlled-access
    counterpart exists; no source states a confidentiality level in the schema's own terms,
    so this value is an interpretation rather than a transcription. Similarly, no source
    characterizes the dataset with a HIPAA compliance status term; "compliant" is recorded
    on the basis that the release contains no protected health information and was checked
    against the HIPAA definition.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the retinal photography, OCT, OCTA and FLIO directories.
  - format: CSV
    media_type: text/csv
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the clinical data directory, where each file maps one-to-one to an OMOP
      Common Data Model table, and for environmental sensor data.
  - format: JSON
    media_type: application/json
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for wearable activity monitor and continuous glucose monitoring data following
      Open mHealth schemas, and for the root metadata files dataset_description.json,
      dataset_structure_description.json, study_description.json and participants.json.
  - format: Markdown
    media_type: text/markdown
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the README, CHANGELOG and healthsheet metadata files.
  - format: WFDB
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      WaveForm DataBase signal and annotation files for the 12-lead electrocardiogram
      directory.
  - format: Tab-separated values
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      manifest.tsv files within each datatype directory and the root participants.tsv file
      carrying the suggested data split.

distribution_dates:
  - release_dates: '2024-05-03'
    notes: >-
      Version 1.0.0, comprising data from the pilot data collection phase, DOI
      10.60775/fairhub.1. The study protocol publication describes this as the May 2024
      release of publicly accessible pilot data.
  - release_dates: '2024-11-08'
    notes: >-
      Version 2.0.0, DOI 10.60775/fairhub.2, covering data collected through the end of
      the first full year of the study.
  - release_dates: '2025-11-17'
    notes: >-
      Version 3.0.0, DOI 10.60775/fairhub.3, the version described by this datasheet.

intended_uses:
  - use_category: research
    examples:
      - >-
        Development of artificial intelligence and machine learning models on multimodal
        type 2 diabetes data, including multimodal model development that may improve
        understanding of a complex, multifactorial disease.
    usage_notes: >-
      Access to the public version is conditional on agreeing to use the data only for
      type 2 diabetes related research.
  - use_category: research
    examples:
      - >-
        Pseudo-time manifold analysis to reconstruct a temporal atlas of type 2 diabetes
        development and reversal toward health from cross-sectional data spanning the
        severity spectrum.
  - use_category: research
    examples:
      - >-
        Investigation of salutogenesis in type 2 diabetes, that is, the pathway from
        disease back to health, which the creators identify as poorly understood.
  - use_category: methodological
    examples:
      - >-
        Use of the dataset and its accompanying guidelines as a model for future efforts to
        develop other medical and health datasets targeted for AI/ML, including the FAIR
        data practices, the Clinical Dataset Structure specification and the documentation
        approach.
  - use_category: research
    examples:
      - >-
        Analyses that require immediate use without reformatting or preprocessing, since
        the data are stored and shared as "AI-ready".

other_tasks:
  - task_details: >-
      Broader biomedical research beyond type 2 diabetes is contemplated for the
      controlled-access version: the consent details record that the public version may be
      used only for type 2 diabetes related research while a private version will allow
      more generic use.
  - task_details: >-
      Because a single measure was captured on several device makes and models, the dataset
      also supports methodological work on cross-device comparability and generalization
      in retinal imaging.

discouraged_uses:
  - discouragement_details: >-
      Treating the cohort as demographically representative of the United States
      population, or generalizing findings to groups not enrolled, including Pacific
      Islanders, Native Americans, non-English speakers, people under 40 or over 85, and
      people outside urban academic health system catchments.
  - discouragement_details: >-
      Analyses that assume a balanced distribution across race/ethnicity, sex and diabetes
      severity in this release: enrollment is ongoing and the creators state that the
      periodic releases may not have achieved balanced distribution across groups. Users
      needing balance are directed to the suggested validation and test splits, which were
      balanced deliberately.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited by the license,
      as the data are intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or with other information, to compromise
      the confidentiality or privacy of a data subject, to identify or contact a data
      subject or group of data subjects, to extract or extrapolate identifying information,
      to establish a data subject's membership of a particular group, or otherwise to cause
      harm or injury to a data subject, is prohibited.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for
      training or development purposes is prohibited, even where that vendor is party to a
      Business Associate Agreement with the licensee's institution; training here includes
      model weight modification and other adjustments to a model's logic or operation.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or
      otherwise conveying any portion of the data or any derivative work to a third party
      that is not itself a licensee under identical terms is prohibited.
  - prohibition_reason: >-
      Storing the data anywhere other than on servers and devices maintained by and located
      within the licensee's institution, or on cloud or remote storage and backup services
      covered by a HIPAA Business Associate Agreement with that institution, is prohibited.
  - prohibition_reason: >-
      Reproducing data in papers, articles, presentations, analyses, reports or
      publications beyond small representative samples in up to five images or figures per
      paper is prohibited, and larger amounts may not be published or made available via
      supplemental files, zip archives, code packages or other means.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking applied to identify
      the licensee for security purposes is prohibited.
  - prohibition_reason: >-
      Using the public version of the dataset for research unrelated to type 2 diabetes is
      excluded by the access agreement, which requires the requester to agree to use the
      data only for type 2 diabetes related research.

future_use_impacts:
  - impact_details: >-
      The creators state that, to the extent of their knowledge, they do not currently
      anticipate uses of the dataset that could result in unfair treatment or harm, but
      that there is a theoretical risk of future re-identification.
  - impact_details: >-
      AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification. To prevent re-identification attempts the project
      implemented a robust data dissemination system, a strict license agreement and data
      watermarking for both the public and the controlled sets.
  - impact_details: >-
      American Indian and Alaska Native people are described as unique and highly
      identifiable groups who could benefit from precision health AI studies; engagement
      with the Native Biodata Consortium is intended to surface the challenges specific to
      those communities and to evaluate tools such as data usage agreements, contract
      negotiation, transparent access agreements and assured return of benefit.
  - impact_details: >-
      Information related to sex and race/ethnicity was withheld from the public set
      specifically to prevent stigmatization of findings, which constrains fairness
      auditing by public-set users; the suggested balanced splits are offered as a partial
      substitute for demographic labels.

existing_uses:
  - examples:
      - >-
        None. In response to the datasheet question about whether the dataset has been used
        for any tasks already, the creators answer "No"; the FAIRhub API records zero
        citations for version 3.0.0 at the time of the source snapshot.

use_repository:
  - repository_url: https://fairhub.io/datasets/3
    repository_details: >-
      The FAIRhub dataset page carries a Dataset Uses section with usage statistics
      covering views, citations and mentions, approved access counts, and a dataset impact
      panel. At the time of the source snapshot the API reported 24,636 views and zero
      citations for version 3.0.0.
    notes: >-
      The creators state that there is no separate repository, beyond general citation
      indices, linking to papers or systems that use the dataset.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. The creators direct
      contact enquiries to the README file included with the dataset, to the project
      contact page at https://aireadi.org/contact and to the documentation contact page at
      https://docs.aireadi.org/docs/3/contact; the study metadata gives a central contact
      email of contact@aireadi.org.
  - role: other
    maintainer_details: >-
      The dataset is hosted on FAIRhub, a Microsoft Azure cloud-based data management,
      curation and sharing platform developed for this project, which the creators
      anticipate making available to future data generation projects.

updates:
  frequency: approximately annually
  update_details: >-
    Existing versions are static and are not updated to correct labeling errors, add
    instances or delete instances. Instead, new versions are released with additional
    instances as more study participants complete the study visit, approximately once a
    year. Changes between versions are documented in detail in the CHANGELOG file included
    with the dataset and reproduced in the documentation site. Version 3.0.0 added 1,213
    participants and three imaging devices relative to version 2.0.0.
  notes: >-
    The creators state that there is currently no mechanism for people outside the project
    to extend, augment or contribute to the dataset.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the dataset outside of
    those involved in the project, as stated in the healthsheet maintenance section.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
    - >-
      Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants,
      pilot data.
    - >-
      Version 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants,
      2.01 TB across 165,051 files.
    - >-
      Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants,
      3.82 TB across 356,343 files.
  version_details: >-
    Each version has its own DOI and its own documentation set, selectable from a dropdown
    at docs.aireadi.org. The FAIRhub pages for versions 1.0.0 and 2.0.0 state that those
    versions are no longer accessible. Data fields are largely unchanged between versions
    2.0.0 and 3.0.0, except that the Snellen visual acuity variables were dropped so that
    only logMAR measurements remain. A separate healthsheet was produced for each earlier
    version, at https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet.

retention_limit:
  retention_period: no limit
  retention_details: >-
    The creators state that there are no applicable limits on the retention of the data
    associated with the instances; participants were not told that their data would be
    retained for a fixed period and then deleted.

