notes: >-
  Citation follows the instructions at https://docs.aireadi.org; the release cites as
  "AI-READI Consortium. (2025). Flagship Dataset of Type 2 Diabetes from the AI-READI
  Project (3.0.0) [Data set]. FAIRhub. https://doi.org/10.60775/fairhub.3".
  Both the FAIRhub dataset pages and the AI-READI documentation site carry the banner
  "This repository is under review for potential modification in compliance with
  Administration directives" in the captured snapshots, alongside a note that the FAIRhub
  platform is in beta. Several results are returned to participants rather than only
  archived: heart rate, blood pressure and visual acuity results are given on an exam card
  before the participant leaves the visit, a Dexcom report of average blood glucose and a
  Glucose Management Indicator is emailed after the ten-day monitoring period, and
  laboratory test results with normative values are sent by HIPAA-compliant encrypted email
  at the time of the yearly data release. A biorepository of plasma, serum, buffy coats,
  genomic DNA, PAXgene-stabilized RNA and peripheral blood mononuclear cells is being
  assembled at the University of Alabama at Birmingham Center for Clinical and Translational
  Science for future ancillary studies; those specimens are governed separately from this
  dataset and procedures for reviewing and prioritizing written requests were still being
  developed at the time of the source snapshots. The project also runs a year-long research
  internship programme whose inaugural 2023-2024 cohort of ten interns was 70 percent women,
  30 percent Black and 50 percent from backgrounds under-represented by NIH criteria.
  Measured and derived domains include the laboratory panel (HbA1c, glucose, insulin,
  C-peptide, NT-proBNP, troponin-T, high-sensitivity CRP, total cholesterol, triglycerides,
  HDL and calculated LDL cholesterol, creatinine, blood urea nitrogen and their ratio,
  albumin, calculated total globulin and A/G ratio, urine creatinine and urine albumin),
  vital signs and anthropometry (systolic and diastolic blood pressure, heart rate,
  calculated body mass index and waist-hip ratio), photopic and mesopic logMAR visual
  acuity, photopic and mesopic Mars log contrast sensitivity, autorefraction spherical and
  cylindrical components with axis, the MoCA total score and subscores, monofilament
  yes/no responses, five-minute continuous glucose values, Garmin heart rate, steps, oxygen
  saturation, respiratory rate, sleep duration, stress level and caloric burn, and home
  ambient temperature, relative humidity, particulate matter, nitrogen oxides, volatile
  organic compounds and eleven multi-spectral light intensity measurements. Laboratory
  reference ranges reported by the testing laboratories, and the MoCA instrument ceiling of
  30, describe clinical or instrument normality rather than the range of values present in
  the released data.

source_caveats: >-
  Institutional attribution is inconsistent across tier-1 sources. The FAIRhub API metadata
  names Washington University in St. Louis as managing organization, lead sponsor,
  responsible-party affiliation and central-contact affiliation, and the license names
  Washington University in St. Louis as Licensor; the RO-Crate, also tier 1, gives the
  principal investigator as "Aaron Lee, Department of Ophthalmology, University of
  Washington", and the study protocol publication, the NIH RePORTER record and the IRB
  application all place the award, the IRB and the principal investigator at the University
  of Washington. Same-tier disagreement is represented rather than resolved.
  The expansion of the acronym also differs: the study protocol and Nature comment write
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights", while the
  FAIRhub study title, README and NIH RePORTER write "Artificial Intelligence Ready and
  Exploratory Atlas for Diabetes Insights"; the tier-1 form is used here.
  Target enrollment is given as 4,000 by the FAIRhub study metadata (anticipated enrollment
  count), the study protocol publication and NIH RePORTER, and as 4,600 by the IRB
  application form; the tier-1 figure of 4,000 is preferred.
  The start of data collection is 19 July 2023 in the FAIRhub metadata and 18 July 2023 in
  the study protocol publication; the tier-1 date is used for the release collection window,
  while the pilot enrollment period is recorded from the study protocol as beginning
  18 July 2023.
  The award identifier differs between tier-1 sources: the FAIRhub DataCite metadata links
  to NIH RePORTER application 10885481 while the README acknowledgement and the NIH
  RePORTER source document give application 10471118, both for core project OT2OD032644.
  The healthsheet describes version 3.0.0 as consisting of data collected "up through the
  end of the second year of the study" while the changelog in the same source labels the
  newly added participants "year 3 data"; both statements come from the FAIRhub API record.
  The healthsheet answers "No" to whether the dataset identifies demographic
  sub-populations, while the README in the same source reports race/ethnicity and sex
  counts for the suggested split; the reconciliation is that those variables are not
  released in the public data files but their aggregate distribution is documented.
  The study base is described as patients with an encounter between 2020 and 2025 in the
  study protocol publication and as patients with an encounter "within the past 2 years" in
  the healthsheet.
  RO_CRATE is not listed in conforms_to_standard: an RO-Crate metadata document describes
  the release, but no source states that the distributed dataset is itself packaged as an
  RO-Crate, and the released tree is organized per the Clinical Dataset Structure. The nine
  ark:59853/rocrate-b2ai-ai-readi-* identifiers name the RO-Crate subcrate documents rather
  than the released directories, and are therefore recorded in the notes of the
  corresponding distributions rather than used as directory identifiers.
  Per-distribution format and media type were recorded only where the schema's controlled
  vocabularies admit the value; DICOM and WFDB directories carry the standard in
  conforms_to and conforms_to_standard instead, and because conforms_to_standard on a
  distribution is single-valued the CDS organizing standard is stated in conforms_to and in
  the notes for those entries. No checksums, encoding declarations or direct download URL
  are given by the sources, and access is gated behind verified login, so those slots are
  left empty.
  Two enum values are interpretations rather than transcriptions and are flagged locally:
  confidentiality_level "restricted" against the RO-Crate's "HL7:2N (normal)", and
  hipaa_compliant "compliant", which no source states in those terms.