id: https://chorus4ai.org/
name: CHoRUS Dataset
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  The CHoRUS dataset is a multicenter, multimodal, high-resolution, controlled-access
  critical care dataset assembled by the CHoRUS data generation project, one of four data
  generation projects in the NIH Bridge2AI consortium. The dataset is built from
  retrospective clinical data contributed by 14 hospitals within a network of 20
  collaborating academic centers, and covers hospital admissions from adult intensive care
  units, pediatric intensive care units (PICU), and neonatal intensive care units (NICU).
  The currently released dataset comprises 50,000 patient admissions, approximately
  1.6 billion rows of electronic health record data standardized to the OMOP Common Data
  Model, 7,642 admissions with radiology data, and 23 Tb of waveform data. The anticipated
  final dataset is 100,000 patient admissions across 9 data modalities from 14 data
  contributing hospitals. Data types include demographics, medication administration
  (time-stamped at each infusion change or dose administration), procedures, high-frequency
  nursing flowsheets, diagnoses, clinical notes extracted and tokenized with the OHNLP
  toolkit, imaging from PACS, waveform telemetry from bedside monitors and
  gateway/middleware, and EEG waveforms from hospital EEG databases. All data types are
  controlled access and are held in a cloud enclave, with clinical notes retained locally
  at contributing sites and only tokens placed in the enclave. The project also sequesters
  a holdout test set to support external validation of AI models.
page: https://chorus4ai.org/
status: >-
  Under active development: a controlled-access released dataset is available while data
  acquisition, imaging de-identification, and EEG extraction continue toward the anticipated
  final dataset.
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - social determinants of health
  - machine learning
  - artificial intelligence
  - Bridge2AI
conforms_to: >-
  Structured electronic health record data are standardized to the OMOP Common Data Model;
  imaging follows the DICOM schema; waveform telemetry follows WFDB using an extended
  PhysioNet schema; EEG waveforms use the open-source EDF+ and Persyst schemas; tokenized
  clinical notes use the OHNLP open-source schema.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
notes: >-
  The CHoRUS public website carries the banner notice "This repoitory is under review for
  potential modification in compliance with Administration directives" (spelling as
  printed). Separately from the dataset itself, software produced by the chorus-ai GitHub
  organization is distributed under the MIT License, with the Chorus_SOP documentation site
  under Apache-2.0.
source_caveats: >-
  The sources disagree on the size of the released dataset: the project documentation at
  chorus4ai.org (tier 2) reports a current released dataset of 50,000 patient admissions,
  while the AIM-AHEAD cohort 2 informational webinar (tier 4) states that as of August 2025
  the dataset covered 14 different hospitals with over 45K unique admissions. The higher
  ranked project documentation value is stated in this record. Both sources agree on 14
  contributing hospitals. The NIH RePORTER abstract describes acquisition from "more than
  100,000 critically ill patients", which matches the anticipated rather than the released
  dataset. The NIH award figures describe the CHoRUS data generation project as a whole,
  which includes tooling, ethics, and workforce activities beyond dataset assembly.

