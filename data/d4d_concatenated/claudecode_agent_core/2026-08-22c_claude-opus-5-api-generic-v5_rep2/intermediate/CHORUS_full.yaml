purposes:
  - response: >-
      Generate data for ML/AI applications aimed at characterizing acute and critical care
      illness, predicting complications, and measuring treatment response among patients
      with acute or critical illness.
  - response: >-
      Develop a publicly available, AI-ready critical care dataset while ensuring the
      methods promote privacy, accountability, and clinical benefit.
  - response: >-
      Provision a holdout test set, accessible for model external validation, to aid
      marketplace adoption of AI-developed models for implementation in acute and critical
      care.
  - response: >-
      Create ethically sourced datasets and tools around artificial intelligence and
      establish best practices for AI in health, in collaboration with the other Bridge2AI
      data generation projects.
  - response: >-
      Cultivate expertise in the lay and scientific community and promote a new generation
      of AI clinicians and scientists, including by supplying data for hands-on AI/ML
      training.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and
      machine learning in critical care; developing high-resolution multi-center data sets
      is a critical first step towards actionable and trustworthy AI.
  - response: >-
      No sufficiently diverse, high-resolution, ethically sourced, AI-ready data set exists
      to answer the grand challenge of improving recovery from acute illness.
  - response: >-
      Sequestered holdout data for external validation of clinical AI models is lacking,
      limiting marketplace adoption of models in acute and critical care.
  - response: >-
      Multi-modal EHR, waveform, imaging, and text data lack unified standards; CHoRUS
      harmonizes them through standardization and validated semantic mappings.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration in critically ill patients.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of AI/ML models against a sequestered holdout test set.
  - response: >-
      Labeling data with targets important for prediction within a visualization and
      annotation environment.

