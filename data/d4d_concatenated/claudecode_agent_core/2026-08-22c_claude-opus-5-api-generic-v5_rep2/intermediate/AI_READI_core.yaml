    notes: >-
      Race and ethnicity are not released in the public dataset; they are held under
      controlled access. The aggregate counts above are reported in the README table
      describing the suggested train/validation/test split.
  - subpopulation_elements_present: true
    identification: Biological sex, self-reported in the screening questionnaire.
    distribution: 'Across the 2,280 participants: male 951, female 1,329.'
    notes: >-
      Sex is not released in the public dataset and is held under controlled access; the
      counts are reported in the README split table.
  - subpopulation_elements_present: true
    identification: >-
      Study group by diabetes status and severity: no diabetes; pre-diabetes or type 2
      diabetes controlled by lifestyle adjustment; type 2 diabetes controlled by oral or
      non-insulin injectable medication; type 2 diabetes controlled by insulin.
    distribution: >-
      Across the 2,280 participants: no diabetes 776, lifestyle 560, oral 686,
      insulin 258.
  - subpopulation_elements_present: true
    identification: >-
      Age in years; eligibility required participants to be at least 40 years old, with
      adults older than 85 excluded.
    distribution: >-
      Mean age 60.8 years with a standard deviation of 11.3 across all 2,280
      participants; 61.1 ± 11.3 in the suggested training set, 60.3 ± 10.8 in the
      validation set and 60.5 ± 11.4 in the test set.

