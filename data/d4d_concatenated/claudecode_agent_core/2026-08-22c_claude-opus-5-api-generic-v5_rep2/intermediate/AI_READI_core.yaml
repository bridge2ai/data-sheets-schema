related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.2
    notes: >-
      Version 3.0.0 succeeds version 2.0.0, which was released on 8 November 2024 with
      1,067 participants and is recorded on FAIRhub as no longer accessible. Version 2.0.0
      itself succeeded version 1.0.0 (DOI 10.60775/fairhub.1, 204 pilot participants,
      released 3 May 2024).
  - relationship_type: has_part
    target_dataset: https://fairhub.io/datasets/4
    description: >-
      A smaller mini-subset of the release, intended for pipeline development, referenced
      from the version 3.0.0 dataset page and from the documentation's preliminary
      information section.
    source_caveats: >-
      The FAIRhub API records the release as having a child dataset with identifier 4 and
      a "mini" flag of false for the parent; the sources do not state a DOI or title for
      the child, so the relationship is inferred from the child identifier together with
      the dataset page note that a smaller version is available for pipeline development.

notes: >-
  Both the FAIRhub dataset pages and the AI-READI documentation site carry the banner
  "This repository is under review for potential modification in compliance with
  Administration directives" in the captured snapshots, alongside a note that the FAIRhub
  platform is in beta. Several results are returned to participants rather than only
  archived: heart rate, blood pressure and visual acuity results are given on an exam card
  before the participant leaves the visit, a Dexcom report of average blood glucose and a
  Glucose Management Indicator is emailed after the ten-day monitoring period, and
  laboratory test results with normative values are sent by HIPAA-compliant encrypted email
  at the time of the yearly data release. A biorepository of plasma, serum, buffy coats,
  genomic DNA, PAXgene-stabilized RNA and peripheral blood mononuclear cells is being
  assembled at the University of Alabama at Birmingham Center for Clinical and Translational
  Science for future ancillary studies; those specimens are governed separately from this
  dataset and procedures for reviewing and prioritizing written requests were still being
  developed at the time of the source snapshots. Measured domains include the laboratory
  panel (HbA1c, glucose, insulin, C-peptide, NT-proBNP, troponin-T, high-sensitivity CRP,
  lipids, renal and hepatic markers, urine creatinine and albumin), vital signs and
  anthropometry, photopic and mesopic logMAR visual acuity and Mars log contrast
  sensitivity, autorefraction, the MoCA total and subscores, monofilament responses,
  five-minute continuous glucose values, Garmin heart rate, steps, oxygen saturation,
  respiratory rate, sleep and stress, and home temperature, relative humidity, particulate
  matter, nitrogen oxides, volatile organic compounds and multi-spectral light intensity.

source_caveats: >-
  Institutional attribution is inconsistent across tier-1 sources. The FAIRhub API metadata
  names Washington University in St. Louis as managing organization, lead sponsor,
  responsible-party affiliation and central-contact affiliation, and the licence names
  Washington University in St. Louis as Licensor; the RO-Crate, also tier 1, gives the
  principal investigator as "Aaron Lee, Department of Ophthalmology, University of
  Washington", and the study protocol publication, the NIH RePORTER record and the IRB
  application all place the award, the IRB and the principal investigator at the University
  of Washington. Same-tier disagreement is represented rather than resolved.
  The expansion of the acronym also differs: the study protocol and Nature comment write
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights", while the
  FAIRhub study title, README and NIH RePORTER write "Artificial Intelligence Ready and
  Exploratory Atlas for Diabetes Insights"; the tier-1 form is used here.
  Target enrolment is given as 4,000 by the FAIRhub study metadata (anticipated enrolment
  count), the study protocol publication and NIH RePORTER, and as 4,600 by the IRB
  application form; the tier-1 figure of 4,000 is preferred.
  The start of data collection is 19 July 2023 in the FAIRhub metadata and 18 July 2023 in
  the study protocol publication; the tier-1 date is used.
  The healthsheet describes version 3.0.0 as consisting of data collected "up through the
  end of the second year of the study" while the changelog in the same source labels the
  newly added participants "year 3 data"; both statements come from the FAIRhub API record.
  The healthsheet answers "No" to whether the dataset identifies demographic
  sub-populations, while the README in the same source reports race/ethnicity and sex
  counts for the suggested split; the reconciliation is that those variables are not
  released in the public data files but their aggregate distribution is documented.
  The study base is described as patients with an encounter between 2020 and 2025 in the
  study protocol publication and as patients with an encounter "within the past 2 years" in
  the healthsheet.
  Per-distribution format and media type were recorded only where the schema's controlled
  vocabularies admit the value; DICOM and WFDB directories carry the standard in
  conforms_to and conforms_to_standard instead. No checksums, encoding declarations or
  direct download URL are given by the sources, and access is gated behind verified login,
  so those slots are left empty.