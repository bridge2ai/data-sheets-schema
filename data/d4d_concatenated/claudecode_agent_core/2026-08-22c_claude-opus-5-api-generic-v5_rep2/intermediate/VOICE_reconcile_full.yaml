id: doi:10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a large, ethically sourced, demographically diverse voice dataset linked to
  health information, generated by the Bridge2AI-Voice consortium under the NIH Common Fund
  Bridge2AI program. This record describes the adult flagship release, version 3.1.0, published on
  PhysioNet. The release contains derived audio features for 833 adult participants recruited at
  five sites in North America, selected on the basis of conditions known to manifest in the voice
  waveform: voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders, and respiratory disorders, together with control participants without those
  conditions. Data were collected in clinic on study iPads using a custom application (the
  Bridge2AI-Voice app) that administers standardized acoustic tasks (breathing, cough, sustained
  vowels, glides, loudness, diadochokinesis, validated reading passages, picture description, story
  recall, free speech, and cognitive-linguistic tasks), demographic and confounder surveys, and
  validated patient-reported outcome questionnaires. Clinical diagnoses were validated by
  qualified clinicians against per-condition gold standards such as laryngoscopy and stroboscopy,
  spirometry and flow-volume loops, brain CT and MRI, and electronic health record review.
  The published release contains data considered low risk. Raw audio waveforms are not included;
  instead the features folder distributes spectrograms, mel spectrograms, mel-frequency cepstral
  coefficients, pitch contours, Speech Articulatory Coding estimates of electromagnetic
  articulography, loudness and periodicity, phonetic posteriorgrams, static acoustic features from
  openSMILE, Praat and Parselmouth, and audio quality metrics. A phenotype folder distributes
  tab-delimited demographic, confounder, enrollment, diagnosis, questionnaire and task tables with
  accompanying JSON data dictionaries, and a metadata folder distributes per-recording metadata
  including task instructions, prompts, microphone and gain information. Raw audio is disseminated
  separately under a controlled access mechanism via Synapse to protect participant privacy,
  because voice is inherently re-identifying.
