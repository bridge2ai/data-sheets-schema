    source_caveats: >-
      The healthsheet answers that the dataset is self-contained and does not link to or rely on
      external resources, and marks the questions about guarantees, archival versions and
      restrictions as not applicable. The resources listed here are supporting materials published
      alongside the dataset rather than dependencies of the released files.
  - archival: true
    restrictions:
      - MIT license
    notes: >-
      The Bridge2AI-Voice REDCap data dictionary, metadata and instrument PDFs at
