purposes:
  - response: >-
      To generate a large-scale, multi-institutional, ethically sourced and diverse voice, speech
      and cough database linked to multimodal health biomarkers, in order to fuel voice AI
      research.
  - response: >-
      To build predictive models that assist in the screening, diagnosis and treatment of a broad
      range of diseases, and to integrate the use of voice as a biomarker of health into clinical
      care.
  - response: >-
      To enable the development, benchmarking or validation of clinically applicable
      machine-learning models for diagnosing health conditions using voice data, including vocal
      pathologies and neurological, psychiatric, respiratory and pediatric voice disorders.
  - response: >-
      To introduce the field of acoustic biomarkers by developing new standards of acoustic and
      voice data collection and analysis for voice AI research, and to create interoperable
      bioinformatics standards for voice data.
  - response: >-
      To create a flagship, standardized and ethically sourced dataset of 10,000 voices linked to
      health information, with an anticipated enrollment count of 10,000 by 2027.
    source_caveats: >-
      The project documentation gives a target of 10,000 voices and an anticipated enrollment of
      10,000 by 2027; the IRB protocol states a target of 30,000 participants and the audiomics
      white paper states a primary deliverable of a publicly available database of 30,000 human
      voices. All three are tier 2 sources, so the ranking does not decide between them and both
      figures are recorded.
  - response: >-
      To define ethical and legal norms safeguarding participants' data while supporting
      data-sharing efforts, and to develop infrastructure for audiomics data storage and sharing
      within and across research institutions.

addressing_gaps:
  - response: >-
      Previous studies on machine learning-based voice diagnosis produced promising results, but
      their sample sizes were too small or they lacked the key metadata needed for training robust,
      clinically useful models. Current literature has been studied only on small- to medium-sized
      datasets with limited data outside acoustic measures and not linked to multi-modal health
      data.
  - response: >-
      Comparing studies and pooling data is challenging because of a lack of existing standards for
      how voice and other acoustics are measured and collected.
  - response: >-
      Within industry, voice datasets are often private, limiting the ability to audit machine
      learning models and the accuracy of training data labels, and preventing external auditing of
      training datasets to ensure fair representation of diverse populations.
  - response: >-
      There is a lack of prospective study and validation of AI algorithms in audiomics on external
      datasets, compounded by the limited size, quality and diversity of existing open-source
      datasets.
  - response: >-
      Pediatric voice and speech data are sparse because of ethical concerns and challenges in data
      acquisition for that cohort.

tasks:
  - response: >-
      Disease detection and classification from voice, with diagnostic labels spanning vocal
      pathologies, neurological disorders, psychiatric conditions and respiratory disorders.
  - response: >-
      Development, benchmarking and validation of clinically applicable machine-learning models
      using voice as a biomarker.
  - response: AI model pretraining and fine-tuning on voice and speech data.
  - response: >-
      Cohort selection and phenotypic analysis using the questionnaire features distributed in the
      phenotype folder.
    notes: >-
      No recommended data splits for training, validation or testing are provided; researchers are
      encouraged to create their own splits based on their specific requirements.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      The data were directly observable and reported by subjects. Participants performed acoustic
      tasks that were recorded, and completed self-reported demographic, confounder and validated
      questionnaire instruments. Clinical diagnoses were verified by clinicians reviewing audio
      and/or imaging data, examining electronic health records, or checking medication
      prescriptions.
  - was_inferred_derived: true
    acquisition_details: >-
      All features in the published release are derived from the raw audio waveforms rather than
      observed directly: spectrograms, mel spectrograms, mel-frequency cepstral coefficients,
      pitch, Speech Articulatory Coding articulatory and source features, phonetic posteriorgrams,
      openSMILE, Praat and Parselmouth static features, audio quality metrics, and transcriptions
      generated with a speech recognition model.

collection_mechanisms:
  - mechanism_details: >-
      Adult data were collected in clinic using a custom software application, the Bridge2AI-Voice
      app, running on a study tablet, with the assistance of a trained research assistant.
      Participants wore a head-mounted headset with a microphone where possible.
  - mechanism_details: >-
      Hardware consisted of iPads (9th or 10th generation) and iPad Air (5th generation) with an
      Avid AE-36 microphone connected to the iPad through an Apple dongle. Distinct iPad devices
      were used at each site.
  - mechanism_details: >-
      Demographic, confounder, diagnostic and validated questionnaire data were captured through
      the application and managed in REDCap. The supporting REDCap data dictionary, metadata and
      instrument PDFs are published at https://github.com/eipm/bridge2ai-redcap.
  - mechanism_details: >-
      A Bridge2AI Voice Web app and a Bridge2AI Voice iOS app support remote data collection. No
      software is downloaded or installed for the web app, no login is required, data are held only
      during the collection phase and removed when the page is closed, and data are transmitted
      over a secure HTTPS protocol to a HIPAA-compliant storage server hosted by an NIH STRIDES
      partner.
    notes: >-
      Remote data collection had not occurred for the initial dataset release; data in the
      published releases were collected in clinic.

collection_timeframes:
  - timeframe_details: The data were collected over a period of 12 months.
    source_caveats: >-
      This figure is taken from the healthsheet published in the project documentation alongside an
      earlier version of the dataset and may not cover the full collection period for version
      3.1.0, which contains 833 participants. No start or end date for collection is stated in any
      source.

data_collectors:
  - role: researcher
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students, coordinated
      data collection sessions and administered the protocol; a research assistant introduced the
      application, observed the session and recorded task metrics.
  - role: researcher
    collector_details: >-
      Clinicians and physicians listed as co-investigators under the IRB identified appropriate
      participants and provided the gold standard clinical diagnoses. They were added to the
      consortium so that their names appear on consortium-level publications arising from the
      research. Hospital staff were not involved in scheduling but assisted with the logistics of
      coordinating data collection.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from the individuals in question rather than obtained via third
      parties such as hospitals or app companies. Clinical validation additionally drew on
      electronic health record review performed by site clinicians.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      Patients presenting at participating high-volume expert specialty clinics and institutions,
      together with individuals without the conditions of interest recruited to serve as controls.
    strategies:
      - Non-probability sampling
      - >-
        Purposive recruitment by disease cohort from high-volume expert clinics, defined as
        outpatient clinics within hospital systems or academic institutions with expertise in a
        specific disease area seeing more than 50 patients per month from the same disease
        category
      - >-
        Screening of patient charts against per-diagnosis inclusion and exclusion criteria prior to
        the clinic visit, under a partial HIPAA waiver granted for recruitment and screening
      - Recruitment flyers, QR-code linked REDCap screening surveys, social media and online
        study-listing platforms
    why_not_representative: >-
      The data are not representative of the larger set because they were collected at a limited
      number of geographic locations. The consortium expects to make the sample more representative
      by shifting to remote collection and designing the recruiting approach to control for more
      variables.
    representative_verification:
      - >-
        No verification or validation of representativeness against a larger population was
        performed.

instances:
  - instance_type: Adult research participant
    counts: 833
    data_topic: B2AI_TOPIC:36
    label: true
    label_description: >-
      Each participant carries a gold standard diagnostic label assigned by a clinician. Labels
      span voice disorders (laryngeal cancer, laryngitis, pre-cancerous lesions, benign vocal fold
      lesions, muscle tension dysphonia, laryngeal dystonia, unilateral vocal fold paralysis,
      glottic insufficiency), respiratory disorders (airway stenosis, unexplained chronic cough,
      COPD and asthma), neurological and neurodegenerative disorders (cognitive impairment,
      Alzheimer's disease and other dementias, amyotrophic lateral sclerosis, Parkinson's disease),
      mood and psychiatric disorders (anxiety, bipolar disorder, depression), and controls.
    notes: >-
      Each instance in the dataset represents a person. A participant may have more than one
      recording session, so phenotype and task tables may contain more than one row per
      participant.
  - instance_type: Audio recording with derived acoustic features
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:37
    notes: >-
      Each element of a feature parquet file records a participant identifier, a session
      identifier, the task performed, the number of time frames, and the feature tensor.
      Per-feature record counts in version 3.1.0 are 29,278 for spectrograms, mel spectrograms and
      MFCCs; 32,522 for torchaudio pitch; 28,640 for Speech Articulatory Coding electromagnetic
      articulography; 31,855 for loudness; 31,872 for periodicity and Speech Articulatory Coding
      pitch; and 29,289 for phonetic posteriorgrams. The released artifacts are stored as Apache
      Parquet files.
  - instance_type: Questionnaire and survey response
    data_substrate: B2AI_SUBSTRATE:80
    data_topic: B2AI_TOPIC:31
    notes: >-
      Responses to demographic and confounder surveys and to validated instruments including the
      Voice Handicap Index-10, Patient Health Questionnaire-9, General Anxiety Disorder-7, Positive
      and Negative Affect Schedule, a custom affect scale, the adult PTSD and ADHD questionnaires,
      the DSM-5 adult measure, the Dyspnea Index, the Leicester Cough Questionnaire, the Winograd
      questionnaire and the Montreal Cognitive Assessment. The released artifacts are tab-delimited
      tables with accompanying JSON data dictionaries.
  - instance_type: Clinician-validated diagnosis record
    data_substrate: B2AI_SUBSTRATE:41
    data_topic: B2AI_TOPIC:7
    notes: >-
      One tab-delimited table and accompanying JSON data dictionary per condition in the
      phenotype/diagnosis folder, holding the gold standard diagnostic assessment for participants
      in that cohort.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Demographic subpopulations are identified from self-reported responses collected through the
      Bridge2AI-Voice app: age, gender, sex, race, ethnicity and socioeconomic status.
    distribution: >-
      The dataset has skews based on disorder category, site and other demographic factors. Users
      should consider the multivariate distribution when assessing utility for different questions.
    notes: >-
      Select geographic and demographic identifiers, and some information about household
      composition or cultural identity, were removed during de-identification where their
      combination with public data created a significant re-identification risk.
  - subpopulation_elements_present: true
    identification: >-
      Disease cohort subpopulations are identified by the diagnostic category assigned at
      enrollment: voice disorders, respiratory disorders, neurological and neurodegenerative
      disorders, mood and psychiatric disorders, and controls.
    distribution: >-
      The public data releases do not contain an equal distribution of the disease categories;
      further releases are expected to contain additional data.
  - subpopulation_elements_present: true
    identification: >-
      Groups defined by trust in the medical system and by proximity to collection sites.
    distribution: >-
      Groups that have less trust in the medical system or in AI, or that are less proximal to the
      collection sites, were less likely to be recruited.

subsets:
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-voice-disorders
    name: Voice disorders cohort
    description: >-
      Participants with laryngeal cancer, laryngitis, pre-cancerous lesions such as keratosis and
      leukoplakia, benign lesions of the vocal cord, muscle tension dysphonia, spasmodic dysphonia
      and laryngeal tremor, unilateral vocal fold paralysis, or glottic insufficiency and
      presbyphonia. Diagnoses are validated against laryngoscopy images and stroboscopy videos, and
      for unilateral vocal fold paralysis additionally against CT scan and spirometry.
    is_subpopulation: true
    is_data_split: false
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-respiratory-disorders
    name: Respiratory disorders cohort
    description: >-
      Participants with airway stenosis (bilateral vocal fold paralysis, supraglottic, glottic,
      posterior glottic, subglottic, tracheal or multi-level upper airway stenosis) or unexplained
      chronic cough, together with COPD and asthma. Diagnoses are validated against spirometry and
      flow volume loops and CT scans of the neck and chest.
    is_subpopulation: true
    is_data_split: false
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-neurological-disorders
    name: Neurological and neurodegenerative disorders cohort
    description: >-
      Participants aged 44 to 85 with mild cognitive impairment, Alzheimer's disease, other
      dementias, amyotrophic lateral sclerosis or Parkinson's disease. Diagnoses are validated
      against brain CT, brain MRI, whole genome sequencing and, for Alzheimer's disease, serum
      phospho-tau protein markers.
    is_subpopulation: true
    is_data_split: false
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-mood-psychiatric-disorders
    name: Mood and psychiatric disorders cohort
    description: >-
      Participants with anxiety disorder, bipolar disorder, or depression or major depressive
      disorder as the primary inclusion diagnosis, with alcohol or substance use disorder, ADHD,
      autism spectrum disorder, borderline personality disorder, eating disorder, insomnia or sleep
      disorder, obsessive-compulsive disorder, panic disorder, PTSD, schizophrenia and social
      anxiety disorder recorded as comorbidities. Diagnoses are validated against the electronic
      health summary, a clinical diagnosis from a psychiatrist, and medication history.
    is_subpopulation: true
    is_data_split: false
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#cohort-controls
    name: Control cohort
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, mood or neurological disorder
      affecting voice, cough, breath or speech, recruited to serve as controls in the dataset.
    is_subpopulation: true
    is_data_split: false

splits:
  - split_details: >-
      No predefined recommended data splits for training, validation or testing are provided.
      Researchers are encouraged to create their own data splits based on their specific
      requirements.

relationships:
  - relationship_details: >-
      Instances are unrelated to one another; participants are independent individuals and no
      inter-participant relationships are recorded. Within the dataset, records are linked
      hierarchically by participant identifier, session identifier and task name across the
      feature, metadata, phenotype and task files. A subset of participants required multiple
      sessions to complete data collection, so there may be more than one session per participant,
      and there is no requirement that a participant provide the same response at each visit.

anomalies:
  - anomaly_details: >-
      Different sites have different collection configurations, and the collection protocol changed
      over the course of the study. Distinct iPad devices were used at each site.
  - anomaly_details: >-
      Confounding factors present in the data include noise artifacts, variations in diagnostic
      practices, inaccurate questionnaire responses and underreporting.
  - anomaly_details: >-
      Data collection irregularities caused some information to be missing from individual
      instances, and some protocol questions are optional.
  - anomaly_details: >-
      Some audio files, whether because of length or other issues, could not generate certain
      features and are therefore absent from the corresponding bundled feature files; per-feature
      record counts consequently differ across the parquet files.
  - anomaly_details: >-
      Certain aspects of the data, for example transcription, were generated using off-the-shelf
      models that have not been audited for correctness.
  - anomaly_details: >-
      The recording headset was head-mounted and could sit at slightly different distances from the
      speaker between sessions, introducing variability in recording conditions.

errata:
  - erratum_details: >-
      Version 2.0.0 reprocessed spectrograms to fix minor issues identified in version 1.1, and
      removed all spectrograms and mel-frequency cepstral coefficients derived from free speech
      related files.
  - erratum_details: Version 2.0.1 corrected errors in the authorship list.
  - erratum_details: Version 3.1.0 fixed broken parquet files carried over from version 3.0.0.
  - erratum_details: >-
      Version 3.1.0 updated validated diagnosis information across conditions with back-filled
      information, rearranged some phenotypic files, and renamed certain gold standard variable
      names.
    notes: >-
      The project documentation states that there is no erratum and that a changelog for each
      dataset version is published online with the dataset metadata; the corrections recorded here
      are drawn from the PhysioNet release notes.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants were recruited from a limited number of geographic locations, at high-volume
      expert clinics within participating academic institutions. Groups that have less trust in the
      medical system or in AI, or that are less proximal to the collection sites, would have been
      less likely to be recruited.
    mitigation_strategy: >-
      The consortium intends to shift to remote collection and to design the recruiting approach to
      control for more variables, and pursues partnerships with community outreach clinics serving
      underserved populations.
  - bias_type: sampling_bias
    bias_description: >-
      The sampling method is a non-probability sample. The public data releases do not contain an
      equal distribution of the five disease categories, and the dataset has skews based on
      disorder category and site.
    affected_subsets:
      - Voice disorders cohort
      - Respiratory disorders cohort
      - Neurological and neurodegenerative disorders cohort
      - Mood and psychiatric disorders cohort
      - Control cohort
    mitigation_strategy: >-
      Users are advised to consider the multivariate distribution when assessing the dataset's
      utility for different questions.
  - bias_type: representation_bias
    bias_description: >-
      Eligibility required the ability to read and speak English, and the released data contain
      fluent English speakers only. The single language option for the collection protocol at the
      time of the documented release was English.
    mitigation_strategy: >-
      Spanish versions of the protocol are under development and Spanish protocols and data
      collection are planned for future releases.
  - bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders based on site, so cohorts also had their
      data collected with different devices, confounding disorder label with recording device and
      site.
  - bias_type: annotation_bias
    bias_description: >-
      A single labeler provided one label per instance. Diagnostic labels were assigned by the
      clinician at the site of data collection or, for the psychiatric disorders cohort, derived
      from the participant's electronic health record or an active prescription assessed outside of
      data collection. Variations in diagnostic practices exist between sites and clinicians.
  - bias_type: historical_bias
    bias_description: >-
      Changes in diagnostic criteria or practices over the course of the study could be a source of
      distribution shift within the dataset.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample of a larger, ongoing collection and is not representative of that
      larger set, because it was collected at a limited number of geographic locations.
    scope_impact: >-
      Models trained on the dataset may not generalize to populations, sites or recording
      conditions outside those sampled.
    recommended_mitigation: >-
      Assess the multivariate distribution of disorder category, site and demographic factors
      before drawing population-level conclusions.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Data collection was restricted to participants who read and speak English, and the released
      adult data cover only four of the five target disease categories plus controls; the pediatric
      cohort is published as a separate dataset.
  - limitation_type: scope_limitation
    limitation_description: >-
      The release does not contain raw audio waveforms. Spectrograms, mel spectrograms,
      mel-frequency cepstral coefficients, phonetic posteriorgrams and electromagnetic
      articulography estimates were removed for sensitive records, audio checks and free speech
      tasks, so dense time-frequency representations are unavailable for those recordings.
    recommended_mitigation: >-
      Investigators requiring raw audio may apply for controlled access through the Data Access
      Compliance Office.
  - limitation_type: integration_limitation
    limitation_description: >-
      The other multimodal data described in the protocol, including imaging, laryngoscopy imaging,
      genomic data for the neurological cohort and other electronic health record data, are
      extracted at each site independently and were not released with the version 3.0.0 or 3.1.0
      dataset.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Recording conditions varied: five recording sites, distinct devices per site, a head-mounted
      microphone at variable distance, and clinical diagnosis performed by a single clinician or
      based on an electronic health record entry or a prescription depending on the disorder.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The collection protocol changed over the course of the study and diagnostic criteria or
      practices may have shifted, so records collected at different times are not fully comparable.

content_warnings:
  - content_warnings_present: true
    warnings:
      - >-
        The dataset covers free speech tasks in which participants are responsible for their own
        choice of language, so the inclusion of offensive, insulting or distressing material cannot
        be completely avoided even though it is unlikely.
      - >-
        The dataset concerns clinical populations including people with cancer, neurodegenerative
        disease and psychiatric conditions, and the underlying protocol asks questions about
        depression, anxiety and traumatic experience that could trigger negative emotions.
    source_caveats: >-
      The healthsheet in the project documentation states that the dataset includes the
      transcription of free speech tasks, while the PhysioNet de-identification notes state that
      transcripts of free speech audio were removed and that spectrogram-family features were
      excluded where the audio contained free speech. The PhysioNet statement is preferred as the
      higher-ranked source.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes race and ethnic origin, sexual orientation, socioeconomic status and
      health information. Voice itself is a biometric characteristic capable of identifying an
      individual.
  - sensitive_elements_present: true
    sensitivity_details: >-
      All fields encoded as sensitive in the Bridge2AI-Voice REDCap data dictionary were removed
      from the dataset at the version 3.0.0 stage, together with non-identifying elements revealing
      highly sensitive information such as household income, mental health status and traumatic
      life experiences.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet records that the dataset does not contain data that might be considered
      confidential, such as data protected by legal privilege or doctor-patient confidentiality or
      the content of individuals' non-public communications.
    source_caveats: >-
      This negative answer applies to the released, de-identified content. The underlying raw audio
      is nonetheless withheld from the registered access release and disseminated only through a
      controlled access mechanism, and the data are covered by an NIH Certificate of
      Confidentiality that must be asserted against compulsory legal demands.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor identifier removal combined with expert review of indirect and sensitive
    elements, removal of raw audio, and exclusion of dense derived features for free speech and
    sensitive records.
  identifiers_removed:
    - Names
    - Civic addresses and geographic locators
    - Social security numbers
    - Date information at a resolution finer than years
    - Phone and fax numbers
    - Email addresses
    - IP addresses
    - Medical record numbers
    - Health plan beneficiary numbers
    - Device identifiers
    - License numbers
    - Account numbers
    - Vehicle identifiers
    - Website URLs
    - Full face photographs
    - Biometric identifiers
    - State and province of collection
    - Transcripts of free speech audio
    - Raw audio waveforms
  deidentification_details: >-
    All direct identifiers were removed. Indirect identifiers were removed where they created a
    significant risk of participant re-identification through combination with other public data
    available on social media, in government registries or elsewhere; these include select
    geographic or demographic identifiers and some information about household composition or
    cultural identity. Non-identifying elements revealing highly sensitive information, such as
    household income, mental health status and traumatic life experiences, were also removed.
    Country of data collection was retained while state and province were removed. Raw audio
    transcripts were reviewed and any audio recordings containing potentially identifying
    information or external voices were removed from the release. The dataset applies the HIPAA
    de-identification rules, rebases or replaces dates by integers, generalizes or removes
    geographic information and removes narrative text fields, but does not achieve
    K-anonymization at k greater than or equal to 2.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      Data collection and sharing were approved by the University of South Florida Institutional
      Review Board. The study was submitted and approved by the USF Single IRB, with subsite IRBs
      joining through the Single IRB process. Canadian participating institutions do not follow the
      US Single IRB process and applied separately to their own research ethics boards; genomic
      data collection and analysis at the University of Toronto and Mount Sinai Hospital are
      covered by a separate protocol and approval.
  ethics_review_board: University of South Florida Institutional Review Board
  regulatory_compliance:
    - >-
      HIPAA de-identification rules were applied and identifiable information under HIPAA and the
      Common Rule was removed. A partial HIPAA waiver was granted for recruitment and screening
      purposes only. The data are covered by an NIH Certificate of Confidentiality. No export
      controls or other regulatory restrictions apply to the dataset. Data are hosted on
      HIPAA-compliant infrastructure through NIH STRIDES partners, and federated learning is used
      to permit multi-institutional analysis while minimizing data sharing.
  notes: >-
    No data monitoring committee was appointed for the study. The clinical study is not for a drug
    product and is not for a medical device.

ethical_reviews:
  - reviewing_organization: University of South Florida Institutional Review Board
    contact_person:
      name: Yael Bensoussan
    review_details: >-
      The Bridge2AI Voice Data Acquisition protocol was submitted to and approved by the USF Single
      IRB. Participating US institutions were integrated into the Single IRB process. The protocol
      passed through thirteen documented revisions between January 2023 and July 2025, covering the
      addition of the pediatric cohort, participant compensation, electronic and remote consent,
      control data collection, remote enrollment and data collection platforms, Spanish-language
      collection and additional recruitment sites.
  - reviewing_organization: Research Ethics Board, Hospital for Sick Children
    review_details: >-
      The pediatric cohort was reviewed and approved by the Research Ethics Board at the Hospital
      for Sick Children; pediatric participants are recruited strictly from that institution.
  - reviewing_organization: >-
      Research ethics boards of the Canadian participating institutions (Mount Sinai Hospital, the
      Hospital for Sick Children and the University of Toronto)
    review_details: >-
      Canadian institutions applied for separate research ethics board approval to comply with
      Canadian regulations rather than joining the US Single IRB. Genomic data collection and
      analysis were covered by a distinct protocol submitted at the University of Toronto and Mount
      Sinai Hospital, with a copy of the approval provided to the USF IRB.
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      IRB number 004890 approved the separate feasibility study of the Bridge2AI-Voice application
      conducted at the USF Health Voice Center between 5 June and 28 July 2023 with 47
      participants; that study assessed app usability and did not collect audio data.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Prospective informed consent, obtained in writing on paper, electronically through REDCap
      surveys or within the application, or by video recording within the application.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap; electronic consent is
      housed in REDCap and is HIPAA compliant. All paper and electronic versions of consent are
      stored for a minimum of five years after study completion. Video consent, in which the
      participant reads a statement aloud and submits the recording, is used to verify that the
      acoustic data submitted belong to the consented individual and to distinguish participants
      from bots.
    consent_scope: >-
      Consent covers collection and use of the data, sharing of research data that does not contain
      direct identifiers with external researchers through a secure database, release under
      registered access to the general public of data posing a low risk of re-identification, and
      release through a controlled access mechanism to authorized researchers of data that would
      pose a heightened risk if shared in full open access. Consenting participants also permit
      investigators to access medical information through electronic health record platforms for
      gold standard validation of diagnoses and symptoms. Participants may optionally consent to
      being contacted in future for further voice data collection.
    withdrawal_mechanism: >-
      Consenting participants are informed that they may withdraw from the study at any point. If a
      participant withdraws during or before voice data collection, their data are not included in
      the database. Participants are informed that research data, including voice recordings,
      cannot be removed from the database once the voice data collection process is completed. For
      longitudinal collection, data already completed are retained. Participants who withdraw may
      optionally complete a satisfaction survey, which collects no protected health information.
    notes: >-
      For pediatric participants, parents or guardians provide consent and children provide verbal
      assent where appropriate; parental permission from one parent or guardian is sufficient
      because the research is minimal risk, and children under approximately seven years of age are
      not asked to assent.

collection_consents:
  - consent_details: >-
      All participants were duly informed and agreed to the collection and use of their data via
      prospective informed consent. Participants were explicitly informed about the data being
      collected, the methods used to secure those data, and the purpose for which the information
      would be used.
  - consent_details: >-
      The consent process ordinarily takes place in the clinic setting of the recruiting clinic and
      is conducted by a research assistant, with about thirty minutes spent explaining the study
      and the consent form and time for questions; potential participants are asked to explain what
      they have understood to confirm comprehension. Consent may also be obtained remotely, in
      which case participants can contact researchers with questions before signing. Where a delay
      occurs between consent and data collection, participants are notified of any changes to the
      study and re-consented. For longitudinal collection, electronic consent within the
      application is administered before each subsequent collection to confirm ongoing consent.
    notes: >-
      The consent stated that participation is voluntary, that declining does not affect the
      participant's standard of care, and that no undue influence or coercion applies.

collection_notifications:
  - notification_details: >-
      Individuals were notified about the data collection; participants went through an
      IRB-approved consent process before any data were collected.

consent_revocations:
  - revocation_details: >-
      Participants are informed that they may withdraw from the study at any point. Withdrawal
      before or during voice data collection excludes the participant's data from the database.
      Once the voice data collection process is complete, research data including voice recordings
      cannot be removed from the database, and participants are informed of this at consent. For
      longitudinal cohorts, participants may leave the study at any time during the collection
      period and data already collected are retained, because the purpose of the project is to
      provide an open-source database rather than to analyze a fixed cohort.

data_protection_impacts:
  - impact_details: >-
      No analysis of the potential impact of the dataset and its use on data subjects has been
      conducted.
  - impact_details: >-
      The consortium published a memorandum setting out the ethical justification for restricting
      raw voice data samples to controlled access, explaining the reasoning behind the governance
      structure; it is available for download from the project documentation site.

participant_privacy:
  - anonymization_method: >-
      HIPAA Safe Harbor identifier removal, removal of state and province with country retained,
      expert-reviewed removal of indirect and highly sensitive elements, removal of raw audio
      waveforms and of transcripts of free speech audio, and exclusion of spectrogram-family
      features for free speech and sensitive records.
    privacy_techniques:
      - Direct identifier removal
      - Indirect identifier removal following expert review by a team of ethicists
      - Geographic generalization
      - Date rebasing and replacement by integers
      - Narrative text field removal
      - Withholding of raw audio, with release only of derived features
      - >-
        Tiered access, with registered access for low-risk derivations and controlled access for
        raw audio
      - >-
        Federated learning to permit multi-institutional model training without moving data between
        institutions
    reidentification_risk: >-
      All raw voice data were removed because that data has the potential to cause individual
      re-identification or to be used for illicit or unauthorized purposes. The dataset does not
      achieve K-anonymization at k greater than or equal to 2. Even with all HIPAA-protected
      information removed, each person's voice is unique to them and it remains possible, though
      unlikely, that someone could recognize a participant's voice.
    data_linkage: >-
      During collection, investigators linked participant records to electronic health record data
      for gold standard validation of diagnoses. The released dataset is self-contained and does
      not link to or rely on external resources. Recipients are prohibited from using the data,
      alone or in concert with other information, to contact the individuals who are its subjects
      without IRB approval, specific written approval from the provider and informed consent.

participant_compensation:
  - compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      40 US dollars for a data collection session taking less than 90 minutes and 80 US dollars for
      a session taking over 90 minutes, for no more than three sessions and a maximum total
      compensation of 120 US dollars.
    source_caveats: >-
      Compensation was introduced by protocol revision V3 in August 2023 and the amount was changed
      by revisions V7 and V8 in 2024. Participants in the separate app feasibility study did not
      receive financial incentives.

at_risk_populations:
  at_risk_groups_included: false
  notes: >-
    Eligibility for the adult dataset is restricted to participants aged 18 years or older, with a
    stated maximum age of 120 years. Pediatric participants are enrolled only through pediatric
    sites under a separate research ethics board approval and are released as a separate dataset;
    for that cohort, parents or guardians provide consent, children provide documented verbal
    assent where appropriate, and children under approximately seven years of age are not asked to
    assent. No special protections beyond standard informed consent are documented for adult
    participants with cognitive impairment, dementia or psychiatric conditions.

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing
      filter applied, producing the standardized audio from which all derived features were
      computed.
  - preprocessing_details: >-
      Spectrograms were computed with the short-time Fast Fourier Transform using a 25 ms window
      size, a 10 ms hop length and a 400-point FFT, then downsampled by a factor of two in the time
      domain. Dimension is 201 by T.
  - preprocessing_details: >-
      Mel spectrograms of 60 mel bins and 60 mel-frequency cepstral coefficients were computed with
      the same window, hop and FFT parameters as the spectrograms. Each is of dimension 60 by T.
  - preprocessing_details: >-
      Articulatory features were generated with the Speech Articulatory Coding (sparc) package at
      50 Hz, yielding kinematic traces of six vocal tract articulators — tongue dorsum, tongue
      body, tongue tip, lower incisor, upper lip and lower lip — as X and Y positions, together
      with loudness, periodicity and pitch measures. Loudness and periodicity are estimated using
      20 ms windows.
  - preprocessing_details: >-
      Phonetic posteriorgrams, a time-varying categorical distribution over 40 acoustic units of
      speech, were generated with the ppgs package at 100 Hz.
  - preprocessing_details: >-
      Static acoustic features capturing temporal dynamics and acoustic characteristics were
      extracted with openSMILE, and phonetic and prosodic features providing measures of
      fundamental frequency, formants and voice quality were computed with Parselmouth and Praat.
      Pitch contours were computed with torchaudio over a range of 80 to 500 Hz, and with sparc
      over a range of 50 to 550 Hz.
  - preprocessing_details: >-
      Transcriptions were generated using OpenAI's Whisper Large model.
  - preprocessing_details: >-
      Raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from
      REDCap were converted to be compliant with the Brain Imaging Data Structure version 1.9.0.
  - preprocessing_details: >-
      All processing for the release was performed with the open-source b2aiprep library version
      3.0.0, which organizes and preprocesses the dataset, and senselab, which processes audio files
      for research tasks.
  - preprocessing_details: >-
      Features are stored in two formats: a fixed feature format holding static features extracted
      from the entire waveform, and a temporal format whose length varies per audio file according
      to the length of the recording.

cleaning_strategies:
  - cleaning_details: >-
      No pre-processing for cleaning the data was performed; the healthsheet records that the data
      were not cleaned.
  - cleaning_details: >-
      An audit protocol is applied instead of cleaning: missingness tables are generated,
      distributions and outliers are checked, categorical responses are checked against the schema,
      and audio tasks are run through quality control metrics. For waveforms the checks cover the
      amount of silence and the duration; for speech, the produced speech is checked against the
      intended passage.
  - cleaning_details: >-
      No instances were excluded from the dataset at the time of preprocessing on the basis of
      participant characteristics; the healthsheet records that no instances, including those
      relating to participants under 18, were discarded.

labeling_strategies:
  - labeling_details: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each site a
      local clinician provided the diagnosis based on a clinical interview and appropriate work-up.
      For the psychiatric disorders cohort the assessment was determined from the participant's
      electronic health record or an active prescription, and was performed outside of data
      collection by an appropriately licensed clinician. Gold standard labels are therefore
      available in the data.
    annotations_per_item: 1
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician external to the
        study in the case of a prior diagnostic assessment. No further demographic
        characterization of labelers is recorded.
    data_annotation_protocol: >-
      Labeling followed the Bridge2AI-Voice protocols and ICD-10 codes, with per-diagnosis gold
      standard validation methods: laryngoscopy images and stroboscopy videos for voice disorders,
      with CT scan and spirometry additionally for unilateral vocal fold paralysis; spirometry and
      flow volume loops and neck and chest CT for airway stenosis and chronic cough; brain CT, brain
      MRI and whole genome sequencing for neurological and neurodegenerative disorders, with serum
      phospho-tau markers for Alzheimer's disease; and electronic health summary, psychiatrist
      diagnosis and medication history for mood and psychiatric disorders.
    inter_annotator_agreement: >-
      Not assessed; a single labeler provided one label per instance.
    data_annotation_platform: REDCap
    notes: >-
      Any new labels or task definitions created by downstream researchers should be described
      alongside the release of a model or publication, including the exact variables used for the
      determination.

machine_annotation_tools:
  - tools:
      - openSMILE
      - Praat
      - Parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
      - OpenAI Whisper Large
      - b2aiprep
      - senselab
    tool_descriptions:
      - >-
        openSMILE, the Speech and Music Interpretation by Large-space Extraction toolkit, was used
        to extract acoustic features capturing temporal dynamics and acoustic characteristics.
      - >-
        Praat and its Python interface Parselmouth were used to compute phonetic and prosodic
        features including fundamental frequency, formants and voice quality measures.
      - >-
        torchaudio was used to compute spectrograms, mel spectrograms, mel-frequency cepstral
        coefficients and pitch contours.
      - >-
        The Speech Articulatory Coding package was used to estimate electromagnetic articulography
        traces for six articulators together with loudness, periodicity and pitch at 50 Hz.
      - >-
        The ppgs package was used to generate high-fidelity neural phonetic posteriorgrams over 40
        phoneme categories at 100 Hz.
      - OpenAI's Whisper Large model was used to generate transcriptions of the audio.
      - >-
        b2aiprep, the open-source Bridge2AI data processing library, was used to organize and
        preprocess the dataset and to merge the source data into the phenotype files; senselab was
        used to process audio files for research tasks.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using off-the-shelf
        models that have not been audited for correctness.

annotation_analyses:
  - analysis_method: >-
      Gold standard clinical labeling with a single labeler per instance; no inter-annotator
      agreement analysis was performed because only one label was provided per instance.
    disagreement_patterns:
      - >-
        Not assessed. Variations in diagnostic practices between sites and clinicians are recorded
        as a confounding factor rather than measured as annotator disagreement.
    annotation_quality_details: >-
      Human-level performance in the applications the dataset is intended to address varies widely.
      Labeling followed the Bridge2AI protocols and ICD-10 codes with per-condition gold standard
      validation methods.

missing_data_documentation:
  - missing_data_patterns:
      - Optional protocol questions left unanswered by participants
      - >-
        Cohort-specific branching, in which each participant answered a common set of questions and
        then only the additional questions relevant to their primary diagnostic category
      - >-
        Phenotype data files contain a row for a participant only if at least one column is not
        missing
      - >-
        Feature parquet files omit recordings for which the corresponding feature could not be
        generated, so per-feature record counts differ
      - >-
        Spectrograms, mel spectrograms, mel-frequency cepstral coefficients, phonetic posteriorgrams
        and electromagnetic articulography estimates are absent for sensitive records, audio checks
        and free speech tasks
    missing_data_causes:
      - Questions that are optional in the protocol
      - Data collection irregularities during the session
      - Cohort-dependent branching of the instrument
      - Feature extraction failures caused by recording length or other issues
      - Deliberate removal during de-identification
    handling_strategy: >-
      A missingness table generated during the internal audit is included with the dataset. No
      imputation was performed; missing values are left missing.

raw_sources:
  - raw_data_details: >-
      Raw audio waveforms recorded during the acoustic tasks. The raw data, after de-identification,
      were saved in addition to the preprocessed data to support unanticipated future uses, but are
      not publicly accessible; raw audio is disseminated only through a controlled access mechanism,
      to protect participants' privacy.
    access_url: https://www.synapse.org/Synapse:syn72370534/
  - raw_data_details: >-
      Questionnaire, demographic, confounder and diagnostic responses captured in the
      Bridge2AI-Voice app and managed in REDCap, exported and converted into the released
      tab-delimited phenotype tables.
    access_url: https://github.com/eipm/bridge2ai-redcap

raw_data_sources:
  - source_description: >-
      Prospectively recorded audio of acoustic tasks, covering breathing sounds, voluntary cough,
      prolonged vowels, maximum phonation time, glides, loudness, diadochokinesis, validated
      passages such as the Rainbow Passage, the Caterpillar Passage and the CAPE-V sentences, free
      speech, picture description, story recall, animal fluency, open response questions, the
      word-color Stroop task, productive vocabulary, random item generation and the Cinderella
      story.
    source_type: Prospectively collected audio recordings
    raw_data_format: >-
      Audio waveforms captured through the Bridge2AI-Voice app, standardized to 16 kHz monaural for
      feature extraction.
    access_details: >-
      Not included in the PhysioNet release. Available under controlled access via Synapse at
      https://www.synapse.org/Synapse:syn72370534/, with requests directed to the Data Access
      Compliance Office at DACO@b2ai-voice.org.
  - source_description: >-
      Self-reported demographic data, confounder and social habit data such as smoking and
      hydration status, past medical history, and responses to validated patient questionnaires and
      patient-reported outcomes.
    source_type: Participant-reported survey and questionnaire data
    raw_data_format: REDCap export converted to tab-delimited values with JSON data dictionaries
    access_details: Released in the phenotype folder of the dataset.
  - source_description: >-
      Clinical validation data confirming diagnosis and treatment, drawn from clinician assessment,
      laryngoscopy and stroboscopy, imaging, spirometry, electronic health record summaries and
      medication prescriptions.
    source_type: Clinician assessment and electronic health record review
    access_details: >-
      Underlying source records are not released; the resulting validated diagnoses are released as
      per-condition tables in the phenotype/diagnosis folder.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    notes: >-
      Unique identifier for the participant, present in every feature parquet file and in the
      phenotype and task tables. Used to join records across the dataset.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    notes: >-
      Unique identifier for the recording session. A participant may have more than one session, so
      more than one row per participant may appear.
  - variable_name: task_name
    data_type: categorical
    notes: Name of the acoustic task performed for the recording.
  - variable_name: n_frames
    data_type: integer
    notes: Number of time frames associated with the feature for that recording.
  - variable_name: spectrogram
    data_type: array
    derivation: >-
      Short-time Fast Fourier Transform with a 25 ms window size, 10 ms hop length and 400-point
      FFT, downsampled by a factor of two in the time domain after derivation.
    measurement_technique: torchaudio
    notes: Dimension 201 by T. Present for 29,278 recordings in version 3.1.0.
  - variable_name: mel_spectrogram
    data_type: array
    derivation: >-
      Computed with a 25 ms window size, 10 ms hop length, 400-point FFT and 60 mel bins.
    measurement_technique: torchaudio
    notes: Dimension 60 by T. Present for 29,278 recordings in version 3.1.0.
  - variable_name: mfcc
    data_type: array
    derivation: >-
      Mel-frequency cepstral coefficients computed with the same parameters as the mel spectrogram.
    measurement_technique: torchaudio
    notes: Dimension 60 by T. Present for 29,278 recordings in version 3.1.0.
  - variable_name: pitch
    data_type: array
    unit: Hz
    minimum_value: 80.0
    maximum_value: 500.0
    derivation: Detected fundamental frequency over time.
    measurement_technique: torchaudio
    notes: Dimension T. Present for 32,522 recordings in version 3.1.0.
  - variable_name: sparc_pitch
    data_type: array
    unit: Hz
    minimum_value: 50.0
    maximum_value: 550.0
    derivation: >-
      Estimated fundamental frequency of the audio signal using an algorithm distinct from the
      torchaudio pitch estimate.
    measurement_technique: Speech Articulatory Coding (sparc)
    notes: Dimension T. Present for 31,872 recordings in version 3.1.0.
  - variable_name: sparc_ema
    data_type: array
    derivation: Estimated electromagnetic articulography produced by a deep learning model.
    measurement_technique: Speech Articulatory Coding (sparc)
    notes: >-
      Dimension T by 12, corresponding to the X and Y positions of six articulators: tongue dorsum,
      tongue body, tongue tip, lower incisor, upper lip and lower lip. Present for 28,640
      recordings in version 3.1.0.
  - variable_name: sparc_loudness
    data_type: array
    derivation: >-
      Estimated loudness based on the average absolute amplitude of the audio waveform, using 20 ms
      windows.
    measurement_technique: Speech Articulatory Coding (sparc)
    notes: Dimension T. Present for 31,855 recordings in version 3.1.0.
  - variable_name: sparc_periodicity
    data_type: array
    derivation: Estimated periodicity, the confidence of pitch presence, using 20 ms windows.
    measurement_technique: Speech Articulatory Coding (sparc)
    notes: Dimension T. Present for 31,872 recordings in version 3.1.0.
  - variable_name: ppgs
    data_type: array
    derivation: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories at a frame rate of 100 Hz.
    measurement_technique: ppgs package
    notes: Dimension 40 by T. Present for 29,289 recordings in version 3.1.0.

file_collections:
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#features
    name: features
    path: features/
    collection_type: processed_data
    description: >-
      Derived audio features. Dense binary files are distributed as Parquet: ppgs.parquet,
      sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet,
      torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet, torchaudio_pitch.parquet and
      torchaudio_mel_spectrogram.parquet. Plain-text files are audio_quality_metrics.tsv, holding
      one quality control feature per audio recording, and static_features.tsv, holding one row per
      unique recording with the openSMILE, Praat, Parselmouth and torchaudio static features. Each
      file is accompanied by a JSON data dictionary with the same file stem.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#phenotype
    name: phenotype
    path: phenotype/
    collection_type: processed_data
    description: >-
      Tab-delimited tables with JSON data dictionaries, organized into subfolders: confounders;
      demographics; diagnosis, with one table per condition covering airway stenosis, amyotrophic
      lateral sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment, control,
      COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal dystonia,
      laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous lesions, unexplained
      chronic cough and unilateral vocal fold paralysis; enrollment, covering eligibility, the
      enrollment form and participant records; questionnaire, covering the adult ADHD measure, the
      custom affect scale, the DSM-5 adult measure, the Dyspnea Index, GAD-7, the Leicester Cough
      Questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric history, the adult PTSD
      measure, VHI-10 and voice perception; and task, covering acoustic tasks, Harvard sentences,
      random item generation, recording, session, Stroop and Winograd. Each dictionary key matches a
      column name and records a description, the question asked of the participant where
      applicable, and the data type of the response.
  - id: https://physionet.org/content/b2ai-voice/3.1.0/#metadata
    name: metadata
    path: metadata/
    collection_type: metadata
    description: >-
      A Parquet binary file and its data dictionary holding per-recording metadata, including task
      instructions and prompts and information about the microphone used and its gain. Introduced
      in version 3.1.0.

distribution_formats:
  - format: Apache Parquet
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Dense derived audio features are distributed as Parquet, an open-source column-oriented data
      file format. Files can be read with any Parquet-capable library, for example the HuggingFace
      Datasets library in Python.
  - format: Tab-separated values
    media_type: text/tab-separated-values
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Phenotype tables, static features and audio quality metrics are distributed as tab-delimited
      text and can be read with any statistical analysis tool.
  - format: JSON
    media_type: application/json
    notes: >-
      Data dictionaries accompany each Parquet and tab-delimited file, sharing the file stem with a
      .json suffix.
  - format: WAV audio
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    notes: >-
      Raw audio waveforms are not part of the PhysioNet release. They are distributed separately
      through a controlled access mechanism on Synapse, requiring institutional sign-off and a
      request to the Data Access Compliance Office.

distribution_dates:
  - release_dates:
      - "1.0: released on the Health Data Nexus at the end of November 2024"
      - "1.1: 2025-01-17 on PhysioNet"
      - "2.0.0: 2025-04-16 on PhysioNet"
      - "2.0.1: 2025-08-18 on PhysioNet"
      - "3.0.0: 2025-12-16 on PhysioNet"
      - "3.1.0: 2026-05-01 on PhysioNet"
    notes: >-
      Companion pediatric dataset releases: 1.0.0 on 2025-12-17 and 1.1.0 on 2026-05-01. The Synapse
      route for controlled access to raw audio was announced on 2026-03-09.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it. The
      features-only release is distributed on PhysioNet under credentialed access to users who sign
      the Bridge2AI Voice Registered Access Agreement; raw audio is distributed through a controlled
      access mechanism on Synapse. Under the Data Transfer and Use Agreement the recipient must
      retain control over the data and may not disclose, release, sell, rent, lease, loan or grant
      access to any third party other than named Authorized Persons without prior written consent
      of the provider; collaborators at other research organizations, and other research teams at
      the same organization, must apply independently and sign their own agreement.

data_governance:
  committee_name: Data Access Compliance Office (DACO)
  accountable_organization:
    name: University of South Florida Board of Trustees
  access_review_process: >-
    Two tiers apply. Registered access to the features-only dataset requires registration on
    PhysioNet, confirmation of identity, and signature of the Bridge2AI-Voice Registered Access
    Agreement, which sets out the terms and conditions for data use; version 3.0.0 onward requires
    the user to be a credentialed PhysioNet user, with no additional training required. Controlled
    access to raw audio requires completion of a Data Access Request Form and a Data Use Agreement,
    submission of the application to the Data Access Compliance Office for review, and, on
    approval, a Data Use and Transfer Agreement signed by an authorized official at the applicant's
    institution. Requests for controlled access are made by email to DACO@b2ai-voice.org.
  stewardship_roles:
    - >-
      The University of South Florida Board of Trustees acts as the Provider Institution under the
      Data Transfer and Use Agreement, with a named Provider Institutional Official and Provider
      Scientist signing each agreement.
    - >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the
      credentialed-access feature release and provides continued access to interested researchers.
    - Synapse hosts the controlled-access raw audio for both the adult and pediatric cohorts.
    - The Bridge2AI-Voice consortium curates the dataset and prepares each release.
  notes: >-
    A memorandum setting out the ethical justification for controlled access to raw voice data
    samples, explaining the reasoning behind the governance structure, is published for download on
    the project documentation site. The Data Transfer and Use Agreement runs for two years from its
    start date or until completion of the project, expiry of the applicable ethics approval, or
    termination, whichever comes first, and may be terminated by either party on thirty days'
    written notice. The provider may unilaterally amend the agreement should the federal sponsor
    require revision.

license_and_use_terms:
  license_terms: >-
    Bridge2AI Voice Registered Access License, with access granted only to credentialed users who
    sign the Bridge2AI Voice Registered Access Agreement. The data may be protected by copyright and
    other rights; duplication as reasonably required to carry out the user's research project is
    permitted, but sale of all or part of the data on any media is not. Users agree not to make
    intellectual property claims on the data and not to use intellectual property protection in ways
    that would prevent or block access to, or use of, any element of the data or conclusions drawn
    directly from it. Users who perform further research adding intellectual and resource capital
    may obtain intellectual property rights on downstream discoveries, but agree to implement
    licensing policies that will not obstruct further research and to respect the Fort Lauderdale
    Agreement. There are no fees associated with these restrictions.
  data_use_permission: general_research_use
  notes: >-
    The dataset is intended for both commercial and non-commercial research purposes by Authorized
    Researchers. The healthsheet records that the dataset does not restrict use to non-commercial
    purposes, to a specific geographic location, to a specific type of research, to genetic
    research, or to research that does not involve the development of methods or algorithms.

ip_restrictions:
  restrictions:
    - >-
      The data may be protected by copyright and other rights, including other intellectual
      property rights.
    - >-
      Nothing in the agreement operates to transfer to the recipient any intellectual property
      rights in or relating to the data.
    - Recipients agree not to make intellectual property claims on the data.
    - >-
      Recipients agree not to use intellectual property protection, database rights or related
      rights in a manner that would prevent or block access to, or use of, any element of the data
      or conclusions drawn directly from it.
    - Sale of all or part of the data on any media is not permitted.
    - >-
      Recipients who perform further research adding intellectual and resource capital may obtain
      intellectual property rights on downstream discoveries, but agree to implement licensing
      policies that will not obstruct further research and to respect the Fort Lauderdale
      Agreement.
    - >-
      The data provider gives no guarantee that the data are free of third-party intellectual
      property rights, database rights or other related rights.
    - No IP-based or other restrictions have been imposed on the data by third parties.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      No export controls or other regulatory restrictions apply to the dataset or to individual
      instances.
  other_compliance: >-
    The data are covered by an NIH Certificate of Confidentiality, which must be asserted against
    compulsory legal demands such as court orders and subpoenas for identifying information or
    characteristics of a research participant. Recipients must establish appropriate
    administrative, technical and physical safeguards, must not use or further disclose the data
    other than as permitted, and must notify the provider of any unauthorized use or disclosure as
    soon as possible and no later than five business days after discovery. Recipient institutions
    must confirm that relevant institutional policies and applicable federal, state or local laws
    have been followed, including any required IRB review or approval.
  source_caveats: >-
    The Data Transfer and Use Agreement classifies the data as Personally Identifiable Information
    as defined in OMB Memorandum M-07-16 and states that it is not covered under HIPAA, FERPA or
    similar laws requiring the addition of special terms, whereas the project documentation states
    that the HIPAA de-identification rules were applied and that identifiable information under
    HIPAA and the Common Rule has been removed. Both are tier 2 sources and the statements address
    different questions: whether additional contractual terms are required, and what
    de-identification was performed. Both are recorded rather than one being selected.

existing_uses:
  - examples:
      - >-
        A restricted version of the dataset containing raw audio has been used in the Bridge2AI
        Summer School and hackathon.
      - >-
        Training opportunities for using the dataset are offered through the Bridge2AI-Voice
        Scholars program at https://www.b2aivoicescholars.org/.
    notes: >-
      No repository linking to papers or systems that use the dataset is maintained beyond general
      citation indices.

intended_uses:
  - use_category: Clinical machine learning research
    examples:
      - >-
        Development, benchmarking or validation of clinically applicable machine-learning models
        for diagnosing vocal pathologies and neurological, psychiatric, respiratory and pediatric
        voice disorders.
    usage_notes: >-
      No predefined recommended data splits are provided; researchers should construct their own
      splits for training, development and testing.
  - use_category: Voice biomarker research
    examples:
      - >-
        Use of voice as a non-invasive, cost-effective biomarker for the screening, diagnosis and
        monitoring of a wide range of health conditions.
      - >-
        Remote voice monitoring to assess treatment response, for example in spasmodic dysphonia,
        and voice screening for detection and monitoring of laryngeal cancer in at-risk
        populations.
  - use_category: AI model pretraining, fine-tuning and benchmarking
    examples:
      - Pretraining or fine-tuning acoustic and speech models on a clinically labeled corpus.
  - use_category: Cohort selection and phenotypic analysis
    usage_notes: >-
      The questionnaire features distributed in the phenotype folder can be used for cohort
      selection.

other_tasks:
  - task_details: >-
      Beyond disease classification, the dataset supports work on acoustic and voice bioinformatics
      standards, since establishing standards for audiomics data acquisition, interoperability and
      AI readiness is one of the consortium's stated aims and the release publishes its feature
      extraction parameters, data dictionaries and processing code in full.

discouraged_uses:
  - discouragement_details: >-
      Use in hiring decisions is discouraged, because it could lead to unethical or biased outcomes
      that negatively affect individuals on the basis of their health conditions or voice
      characteristics.
  - discouragement_details: >-
      Use in insurance premium adjustments is discouraged, for the same reason.
  - discouragement_details: >-
      Use in any form of surveillance that could lead to discrimination or harm is discouraged.
  - discouragement_details: >-
      Non-research and non-clinical applications generally are discouraged; the dataset is intended
      strictly for research that prioritizes patient safety, privacy and ethical use.

prohibited_uses:
  - prohibition_reason: >-
      Attempting to re-identify research participants, or taking any action that could reasonably
      lead to re-identification, is prohibited by the Registered Access Agreement in order to
      protect participant privacy.
  - prohibition_reason: >-
      Any purpose that could foreseeably cause harm or stigmatization to research participants,
      their families, communities or specific populations is prohibited, reflecting the
      consortium's commitment to research practices that respect and protect the rights and
      interests of research participants.
  - prohibition_reason: >-
      Using intellectual property protections, database rights or related rights in a manner that
      restricts or limits access to any part of the dataset or to conclusions derived from it is
      prohibited, so that future use of the dataset remains unrestricted in alignment with the Open
      Science principles upheld by the consortium.
  - prohibition_reason: >-
      Sale of all or part of the data on any media is prohibited by the terms of the access
      agreement.
  - prohibition_reason: >-
      Contacting individuals who are the subjects of the data, using the data alone or in concert
      with other information, is prohibited without appropriate Institutional Review Board approval,
      specific written approval from the provider and, where required, informed consent from the
      individual.
  - prohibition_reason: >-
      Disclosing, releasing, selling, renting, leasing, loaning or otherwise granting access to the
      data to any third party other than the named Authorized Persons, without the prior written
      consent of the provider, is prohibited under the Data Transfer and Use Agreement.

future_use_impacts:
  - impact_details: >-
      The dataset has skews based on disorder category, site and other demographic factors. A future
      user should consider the multivariate distribution when assessing utility for different
      questions, to avoid conclusions that do not hold for underrepresented groups.
  - impact_details: >-
      Applying the dataset outside research could result in unfair treatment of individuals or
      groups, including stereotyping and quality-of-service issues, or in financial harms and legal
      risks. The consortium restricts such uses to prevent unethical or biased outcomes that could
      negatively affect individuals on the basis of their health conditions or voice
      characteristics.
  - impact_details: >-
      Voice AI raises unique ethical and legal challenges linked to the Health Insurance Portability
      and Accountability Act, potential re-identification of patients by their voice, voice hacking
      and data ownership, which motivated the tiered governance framework applied to this dataset.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the current
      credentialed-access releases and provides the technical infrastructure and continued access
      for researchers. PhysioNet is supported by the National Institute of Biomedical Imaging and
      Bioengineering, the National Heart Lung and Blood Institute and the NIH Office of the
      Director under grant numbers U24EB037545 and R01EB030362.
  - role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, a data publishing platform maintained by the Temerty Center for
      Artificial Intelligence Research and Education in Medicine (T-CAIREM) based at the University
      of Toronto, hosted the earlier feature-only release, providing cloud compute alongside the
      dataset rather than allowing data downloads, and can be contacted through its platform team.
    source_caveats: >-
      The project documentation names the Health Data Nexus as the hosting platform and the source
      of maintenance; the tier 1 PhysioNet releases show that versions 1.1 onward are hosted on
      PhysioNet, with the Health Data Nexus retaining version 1.0. The PhysioNet arrangement is
      preferred as current.
  - role: government_agency
    maintainer_details: The dataset is supported by the NIH via the Bridge2AI project.
  - role: researcher
    maintainer_details: >-
      The Bridge2AI-Voice consortium curates the dataset. Questions about the dataset itself go to
      the corresponding author listed on the release page, and access requests go to the Data Access
      Compliance Office at DACO@b2ai-voice.org.

updates:
  frequency: Semi-annual, that is twice a year
  update_details: >-
    Further versions of the dataset are released on the hosting platform as distinct new versions,
    each with a unique DOI. Updates may correct labeling errors, add new instances or delete
    instances. Users are notified through news items on the platform and through standard
    communication channels.
  source_caveats: >-
    The semi-annual cadence and the notification mechanism are recorded in the project documentation
    with reference to the Health Data Nexus platform; the observed PhysioNet release dates
    (2025-01-17, 2025-04-16, 2025-08-18, 2025-12-16 and 2026-05-01) are broadly consistent with that
    cadence.

version_access:
  versions_available:
    - "1.0 — Health Data Nexus, November 2024, doi:10.57764/qb6h-em84"
    - "1.1 — PhysioNet, 2025-01-17, doi:10.13026/249v-w155"
    - "2.0.0 — PhysioNet, 2025-04-16"
    - "2.0.1 — PhysioNet, 2025-08-18"
    - "3.0.0 — PhysioNet, 2025-12-16, doi:10.13026/k81f-qr68"
    - "3.1.0 — PhysioNet, 2026-05-01, doi:10.13026/8xbn-nq66"
  latest_version_doi: doi:10.13026/37yb-1t42
  version_details: >-
    By default, older versions of the dataset continue to be supported, hosted and made available to
    researchers, and each version has a unique DOI. The dataset publishers reserve the right to
    remove access to older versions; the files for version 1.1 are no longer available and users are
    directed to the latest version. Each release is accompanied by release notes describing what
    changed. Version 1.1 was distributed under restricted access to registered users, while versions
    3.0.0 and 3.1.0 require credentialed access.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the hosting
    platform that references the original source; derivative datasets may be made available under
    the same conditions as the source data. For augmentations to the code used to produce the data,
    the open-source repositories provide discussion forums and issue pages for public discussion of
    data preprocessing, and a pull request mechanism for contributing improvements to the
    preprocessing code.

retention_limit:
  retention_period: >-
    Indefinite for the hosted dataset; a maximum of two years for recipients under the Data Transfer
    and Use Agreement.
  retention_details: >-
    Once data are contributed they are retained as long as they are useful for research purposes,
    possibly indefinitely. Under the Data Transfer and Use Agreement, recipient institutions must
    dispose of the data two years after the start date, on completion of the project, on
    termination, or on expiration of the applicable ethics approval, whichever occurs first, and
    must submit written certification of destruction within thirty days, though one copy may be
    retained where necessary to comply with records retention requirements or for research integrity
    and verification. Within the collecting institutions, identifiable data and the sheets linking
    participant numbers to participant information are kept on local cloud storage for a maximum of
    ten years after study completion and are then destroyed, under the responsibility of each local
    principal investigator. De-identified study data and original consent forms are retained for a
    minimum of five years after completion of the study.

