notes: >-
  The consortium publishes a self-assessment of the dataset against the Bridge2AI AI-readiness
  recommendations. The scored criteria are FAIRness at 100 percent (findable, accessible,
  interoperable and reusable all met); provenance at 100 percent (transparent, traceable,
  interpretable, key actors identified); characterization at 80 percent (semantics, statistics,
  standards and potential sources of bias met, data quality not met); pre-model explainability at
  100 percent (data documentation templates, fit for purpose, verifiable); ethics at 100 percent
  (ethically acquired, ethically managed, ethically disseminated, secure); sustainability at 50
  percent (persistent and well-governed met, domain-appropriate and associated not met); and
  computability at 75 percent (standardized, computationally accessible and portable met,
  contextualized not met).

source_caveats: >-
  Referent. This record describes the adult Bridge2AI-Voice dataset as published on PhysioNet at
  version 3.1.0, the highest-ranked and most recent tier 1 source in the bundle. The Bridge2AI-Voice
  Pediatric Dataset is a distinct PhysioNet project with its own DOI and is recorded under
  related_datasets rather than merged here. Identifier. The `id` and `doi` slots carry the
  version-specific 3.1.0 DOI, matching the stated referent; the version-independent DOI for the
  dataset concept is recorded in version_access.latest_version_doi. Counts and versions. Participant
  counts differ by release: 306 participants and 12,523 recordings at version 1.0, an additional 136
  participants at version 2.0, and 833 participants at versions 3.0.0 and 3.1.0. The project
  documentation reports approximately 61,937 voice-derived recordings from 833 adult participants
  for version 3.0, whereas the tier 1 PhysioNet pages report per-feature record counts ranging from
  28,640 to 32,522; the per-feature counts are used here as the tier 1 figures and the documentation
  figure is not restated as a total. Hosting. The project documentation describes the Health Data
  Nexus at the University of Toronto as the hosting and maintenance platform with semi-annual
  updates; the tier 1 PhysioNet releases show that versions 1.1 onward are hosted on PhysioNet, with
  Health Data Nexus retaining only version 1.0. PhysioNet is preferred as the higher-ranked and
  current source. Free-speech transcripts. The healthsheet in the project documentation states that
  the dataset includes transcription of free speech tasks; the PhysioNet de-identification notes
  state that transcripts of free speech audio were removed and that spectrogram-family features were
  excluded where audio contained free speech. The PhysioNet statement is preferred as the
  higher-ranked source. Enrollment target. The project documentation gives a target of 10,000 voices
  with an anticipated enrollment count of 10,000 by 2027; the IRB protocol states 30,000
  participants and the audiomics white paper states 30,000 human voices. All are tier 2, so the
  ranking does not decide and both figures are recorded. Award identifiers. The grant is written as
  OT2OD032720, 3OT2OD032720-01S1, 3OT2OD032720-01S3, 1OT2OD032720-01, OT2 OD032720 and
  "3Tf-OTOD03272001S2" across the bundle. Authorship and roles. The PhysioNet version 3.1.0 release
  names roughly 120 authors; only the consortium leads whose roles are stated in the IRB protocol
  and the project documentation are represented in creators, and no registry identifiers are
  supplied for people or organizations because none appear in the bundle. CRediT roles are recorded
  only for the nine individuals whose contributions are itemized in the author contributions section
  of the feasibility publication, and are transcribed from that section rather than inferred from
  module leadership; leads named only in the IRB protocol or project documentation carry no
  credit_roles. Feasibility study. The publication PMC12037532 describes a separate single-site
  study of the data collection application, conducted at the USF Health Voice Center under USF IRB
  004890 with 47 participants between 5 June and 28 July 2023, in which no audio data were collected
  and participants received no financial incentives; its findings are not attributes of this dataset
  and are recorded only where they document the collection instrument or the ethical review history.
  Substrate mappings. In the instances slot, data_substrate names the nature of the instance rather
  than its container: waveform data for the acoustic recordings, questionnaire response data for the
  survey responses, tab-separated values for the diagnosis tables. Container formats are recorded in
  distribution_formats and file_collections. Study metadata staleness. Several statements in the
  project documentation, including the healthsheet answers on collection timeframe, cleaning,
  language, eligibility and the number of instances, are written against version 2.0.0 and are
  marked as such where they may not describe version 3.1.0.