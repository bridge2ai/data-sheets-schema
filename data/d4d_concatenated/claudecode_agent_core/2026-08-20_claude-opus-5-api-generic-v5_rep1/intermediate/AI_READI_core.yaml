conforms_to: >-
  The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1
  (https://cds-specification.readthedocs.io/en/v0.1.1/), with one directory per datatype, one
  subdirectory per modality, one subdirectory per acquisition device, and one subdirectory per
  participant. Within each datatype directory the data files follow a domain standard: WaveForm
  DataBase (WFDB) for cardiac ECG; the Observational Medical Outcomes Partnership (OMOP) Common
  Data Model for clinical data; Digital Imaging and Communications in Medicine (DICOM) for
  retinal FLIO, OCT, OCTA, and photography; Open mHealth for wearable activity monitoring and
  continuous glucose monitoring; and the NASA ASCII File Format Guidelines for Earth Science Data
  for environmental sensor data. An RO-Crate metadata description conforming to RO-Crate
  1.2-DRAFT and the FAIRscape profile 0.1 accompanies the dataset and its per-datatype subcrates.
