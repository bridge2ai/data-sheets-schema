id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset collected from 2,280 adults with and without type 2 diabetes
  mellitus (T2DM), harmonized across three United States data collection sites (University of
  Alabama at Birmingham, University of California San Diego, and University of Washington) and
  released as version 3.0.0 of the AI-READI flagship dataset. Data were collected between
  July 19, 2023 and May 1, 2025 under a cross-sectional, hypothesis-agnostic protocol spanning
  more than ten domains: self-reported surveys (demographics, depression screening, diabetes
  distress and self-care, diet, substance use, general health, social determinants of health,
  vision and eye care access), physical measurements and vitals, blood and urine laboratory
  results, 12-lead electrocardiography, cognitive screening, monofilament testing for peripheral
  neuropathy, visual acuity and contrast sensitivity under photopic and mesopic conditions,
  autorefraction, multi-device retinal imaging (color fundus photography, fundus autofluorescence,
  near-infrared reflectance, optical coherence tomography, optical coherence tomography
  angiography, and fluorescence lifetime imaging ophthalmoscopy), ten days of continuous glucose
  monitoring, ten days of wrist-worn activity monitoring, and ten days of in-home environmental
  sensing. Recruitment sampling aimed at an approximately equal distribution of participants
  across diabetes severity, self-reported race/ethnicity, and biological sex so that downstream
  artificial intelligence and machine learning analyses would not inherit the imbalance of
  existing claims or electronic health record sources. The released dataset contains no protected
  health information; information on sex, race/ethnicity, and medications used has been removed
  from this public version and is held under controlled access. The dataset comprises 356,343
  files totaling approximately 3.82 TB (3,815,969,779,678 bytes), organized according to the
  Clinical Dataset Structure (CDS) v0.1.1, with each datatype directory following an established
  file format standard. The recommended citation is: AI-READI Consortium. (2025). Flagship Dataset
  of Type 2 Diabetes from the AI-READI Project (3.0.0) [Data set]. FAIRhub.
  https://doi.org/10.60775/fairhub.3
