acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Laboratory values, vital signs, anthropometry, electrocardiography, monofilament testing,
      visual function testing, autorefraction, retinal imaging, continuous glucose monitoring,
      wearable activity monitoring, and in-home environmental sensing were directly observed or
      instrument-recorded during the single in-person study visit and the subsequent ten-day
      at-home monitoring period.
  - was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Survey responses covering demographics, depression screening, diabetes distress and
      self-care, diet, ophthalmic history, smoking, alcohol, vaping and marijuana use, general
      health history, social determinants of health, and current medications were reported by
      participants through REDCap. Verification of data entry was performed where possible - for
      example, entered medications were cross-referenced with medications physically brought in or
      photographed by the participant.
  - was_directly_observed: true
    acquisition_details: >-
      Data were collected directly from participants at the three recruiting sites; this was
      active collection rather than passive collection or secondary use of existing data.
      Recruitment pools were identified by screening electronic health records for diabetes and
      pre-diabetes ICD-10 codes (R73.09 and E11.X) among patients aged 40 and over who had had an
      encounter with the site's health system. Past health records, medications, and traffic and
      accident reports obtained from third-party sources are held under controlled access and are
      not part of this public release.

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used to collect participant-reported questionnaire data and the following
      clinical data from the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results, and complete blood count results. REDCap also
      hosted the recruitment interface, screening survey, and electronic consent.
  - mechanism_details: >-
      Retinal imaging was performed with six devices selected for their different but partially
      overlapping modalities: Optomed Aurora IQ handheld non-mydriatic fundus camera (4 images per
      participant, undilated); iCare Eidon widefield TrueColor confocal fundus system (12 images);
      Heidelberg Spectralis HRA OCT/OCTA (6 images); Topcon Maestro2 3D OCT-1 (6 images); Topcon
      Triton DRI OCT (6 images); Zeiss Cirrus 5000 (8 images); and Heidelberg FLIO (2 images).
      Both eyes were imaged on each participant, under dilation except for the Optomed.
  - mechanism_details: >-
      A 12-lead electrocardiogram was recorded with a Philips PageWriter TC30 Cardiograph and
      exported as .xml to local storage.
  - mechanism_details: >-
      A Dexcom G6 continuous glucose monitor was applied at the visit and worn for ten days;
      participants were masked to the results during the monitoring period.
  - mechanism_details: >-
      A Garmin Vivosmart 5 physical activity monitor was worn for ten consecutive days on the
      participant's chosen wrist; participants returned a data sheet recording which wrist was
      used and their dominant hand.
  - mechanism_details: >-
      A custom-designed environmental sensor (the LeeLab Anura, built at the Karalis Johnson
      Retina Center, University of Washington) was placed in a frequently used area of the home
      for ten days; participants recorded the placement location on return. The environmental
      sensor and the fitness tracker were specifically chosen with participant privacy as a
      primary concern: neither captures video or audio, neither has GPS location monitoring, and
      neither is synced with participant-owned devices.
  - mechanism_details: >-
      Cognitive screening used the Montreal Cognitive Assessment administered on an iPad with the
      MoCA Duo application (MoCA Cognition, Quebec, Canada). The total score ranges from 0 to 30,
      with higher numbers representing better performance; 26 and above is considered normal and
      below 24 is a sign of cognitive impairment. Section subscores, Memory Index Score, and task
      completion times were also captured.
  - mechanism_details: >-
      Visual function was measured with the M&S Technologies Electronic Visual Acuity tester at 4
      meters, best-corrected, right and left eyes separately, under photopic conditions and under
      mesopic conditions viewed through a 2.0 neutral density filter, and reported as logMAR
      (lower numbers indicating better resolution). Contrast sensitivity used the Mars letter
      contrast sensitivity chart (Mars Perceptrix) under photopic and mesopic conditions.
      Autorefraction used a Topcon KR 800. Lensometry used NIDEK LM-600P, Topcon CL-200, or Topcon
      CL-300 devices depending on site.
  - mechanism_details: >-
      Blood pressure and heart rate were measured twice, two minutes apart, with an automatic
      oscillometric medically approved device; devices in use across sites were the OMRON HEM
      907XL, the Medline MDS4001, and the Welch Allyn 6000 series vital signs monitor.
  - mechanism_details: >-
      Peripheral neuropathy was assessed with the 10 g monofilament test at three locations on
      each foot, ten times per location, with the participant's eyes closed and shoes and socks
      removed; insensate areas were retested for confirmation.
  - mechanism_details: >-
      Non-fasting blood (approximately 53 mL) and a urine specimen were collected during the
      visit. One EDTA vacutainer was sent to a CLIA-certified local clinical laboratory for
      complete blood count; whole blood, plasma, serum, and urine for central assays were
      batch-shipped on dry ice approximately quarterly to the University of Washington Nutrition
      and Obesity Research Center. Assays reported with laboratory-supplied reference ranges
      include HbA1c (4.0-6.0 percent), glucose (62-125 mg/dL), insulin (0.0-24.9 ng/mL), C-peptide
      (1.1-4.4 ng/mL), NT-proBNP (varies by age), troponin-T (female under 11, male under 16 ng/L),
      high-sensitivity C-reactive protein (0.0-10.0 mg/L), total cholesterol (under 200 mg/dL), and
      urine albumin and creatinine (no reference range supplied).

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Data collection window for version 3.0.0 of the dataset, spanning the pilot phase and the
      first two years of the main study. Recruitment for the overall project began with a
      preliminary pilot enrollment period and continues; the study completion date is anticipated
      as 2027-01-01. Formal data collection began on December 1, 2023 following the pilot period.
    source_caveats: >-
      The FAIRhub structured metadata (highest-ranked source) gives the collected date range as
      2023-07-19/2025-05-01 and the study start date as 2023-07-19 (Actual). The BMJ Open protocol
      publication states that enrollment began on 18 July 2023 and that pilot enrollment ran from
      18 July 2023 to 30 November 2023, with formal data collection beginning 1 December 2023. The
      FAIRhub date is preferred here; the one-day discrepancy in the start date is unresolved.

data_collectors:
  - role: Clinical research coordinator
    collector_details: >-
      Clinical research coordinators at the three sites recruited and consented participants,
      administered the protocol, provided device instructions, and entered data. All research
      personnel who recruited, enrolled, and collected data underwent training by the data manager
      at the University of Alabama at Birmingham and worked from a detailed Manual of Procedures.
      Certification required mandatory institutional compliance training for human subject
      research and the successful administration of all protocol elements to at least three
      volunteer practice subjects to the standards set out in the Manual of Procedures.
  - role: Site data manager
    collector_details: >-
      A Data Manager at each site oversaw the data collection process and was responsible for
      quality control of all data before upload to FAIRhub.
  - role: Retinal imaging technician
    collector_details: >-
      Retinal imaging technicians acquired the multi-device imaging protocol and were trained to
      detect potentially life- or vision-threatening conditions (retinal detachment, tumor, optic
      disc edema) for immediate referral.
  - role: Phlebotomist and laboratory staff
    collector_details: >-
      Phlebotomists collected blood from participants; laboratory assistants processed and shipped
      samples. Local processing of plasma, serum, and buffy coats used standardized operating
      procedures on the day of collection.
  - role: Consortium data and informatics staff
    collector_details: >-
      Software engineers, cloud engineers, database managers, and data scientists in the AI-READI
      Consortium ingested data into REDCap, built the curation pipelines, mapped data to
      standards, and prepared releases on FAIRhub.

sampling_strategies:
  - is_sample: false
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling by invitation. Adult patients aged 40 and over with a medical
      encounter at one of the three health systems were identified from electronic health records
      and recruited in waves; the composition and size of each wave were influenced by the
      observed participation characteristics of race/ethnicity, gender, T2DM severity, and site.
      The cohort design is triple-balanced, recruiting in equal proportions across four
      race/ethnic groups (Asian, Black, white, Hispanic), four categories of T2DM (no diabetes;
      pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin injectable
      medication; insulin-controlled), and biological sex, rather than targeting the demographic
      distribution of the United States population. All study groups were recruited at every site,
      with the proportion of each group varying with the local demographic prevalence.
    representative_verification:
    - >-
      This release contains all participants enrolled in the covered window rather than a sample
      drawn from them; no representativeness verification against a wider population was
      performed.
    why_not_representative: >-
      The cohort is deliberately balanced rather than demographically representative, so that
      training data are not skewed by population base rates. Recruitment was predominantly urban
      and hospital-based and may not capture all cultural and socioeconomic backgrounds. The
      cohort does not include other races and ethnicities such as Pacific Islanders and Native
      Americans. Participants must speak, read, and understand English. Participation is
      voluntary, introducing volunteer bias. Because enrollment is ongoing, this release has not
      yet achieved the intended balanced distribution across groups.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the point of data entry: clinical data outside expected minimum and
      maximum ranges were flagged in REDCap and surfaced in reports viewed by clinical research
      coordinators and Data Managers, who examined the participant record and determined whether
      an error was likely. Data were checked for credibility against prespecified reasonable
      ranges; incorrect flow through prescribed skip patterns; missing data that could be filled
      directly from other portions of an individual's record; and the omission or duplication of
      records. Editing was carried out only under the guidance and approval of the site principal
      investigator. Where corrected data were available elsewhere in the respondent's answers the
      error was corrected; where there was no logical or appropriate way to correct the data, the
      site principal investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      Central quality control: after data were sent from the study sites to the central project
      team, the dataset was reviewed internally by AI-READI team members for quality checks and to
      ensure that no personally identifiable information had been accidentally included. The
      dataset has not undergone any formal external audit.

preprocessing_strategies:
  - preprocessing_details: >-
      Mapping to standardized terminologies and data models: clinical data were mapped to the
      Observational Medical Outcomes Partnership Common Data Model, with each released CSV a
      one-to-one mapping to an OMOP CDM table, and a data quality dashboard configuration
      (dqd_omop.json) supplied for running the OMOP CDM Data Quality Dashboard checks.
  - preprocessing_details: >-
      Format conversion of imaging data: participant images were exported from the imaging devices
      in their raw formats and converted to DICOM where necessary. Topcon Maestro2 and Triton
      acquisitions were exported as .fda and converted to DICOM; Heidelberg FLIO acquisitions were
      exported as .sdt and converted to DICOM. Optomed, iCare Eidon, Heidelberg Spectralis, and
      Zeiss Cirrus acquisitions were exported natively as DICOM.
  - preprocessing_details: >-
      Format conversion of wearable data: Garmin Vivosmart 5 exports in .FIT format were converted
      to the Open mHealth standard for the dataset; Dexcom G6 exports were provided as CSV and
      organized under Open mHealth.
  - preprocessing_details: >-
      Removal of identifying and sensitive fields before public release: the public set is
      stripped of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe
      Harbor method, and also of information related to the sex and race/ethnicity of the
      participants and the medications used, in order to prevent stigmatization of findings.
  - preprocessing_details: >-
      Preparation of the recommended data splits into training, validation, and test partitions
      (70/15/15), balanced as far as possible for sex, race/ethnicity, and diabetes status, and
      recorded in participants.tsv.
  - preprocessing_details: >-
      Processing maturity has changed across releases. The version 1.0.0 pilot release was
      processed by custom and ad hoc means; the year 2 and year 3 data included in versions 2.0.0
      and 3.0.0 were processed by a combination of automated pipelines and custom steps.

raw_sources:
  - raw_data_details: >-
      Raw device exports and REDCap extracts are retained by the AI-READI project and are expected
      to be preserved at least for the duration of the project. They are not shared outside the
      project team, because they have not been mapped to standardized terminologies and because
      raw data may accidentally include personal health information or personally identifiable
      information in free text fields. Raw data may be included in future releases of the
      controlled-access dataset.

raw_data_sources:
  - source_description: >-
      Electrocardiogram recordings exported from the Philips PageWriter TC30 Cardiograph.
    source_type: Instrument export
    raw_data_format: .xml
    access_details: Retained by the project; not distributed.
  - source_description: >-
      Montreal Cognitive Assessment output from the MoCA Duo application, comprising total score,
      section subscores, Memory Index Score, and task completion times.
    source_type: Instrument export
    raw_data_format: .csv
    access_details: Retained by the project; not distributed.
  - source_description: >-
      Retinal imaging acquisitions from the Optomed Aurora, iCare Eidon, Heidelberg Spectralis,
      Topcon Maestro2, Topcon Triton, Zeiss Cirrus, and Heidelberg FLIO devices.
    source_type: Instrument export
    raw_data_format: Native DICOM, or .fda (Topcon) and .sdt (FLIO) converted to DICOM
    access_details: Retained by the project; converted forms are distributed.
  - source_description: >-
      Continuous glucose monitoring readings from the Dexcom G6, recorded every five minutes.
    source_type: Wearable device export
    raw_data_format: .csv
    access_details: Retained by the project; converted forms are distributed.
  - source_description: >-
      Physical activity, heart rate, oxygen saturation, respiratory rate, sleep, and stress data
      from the Garmin Vivosmart 5.
    source_type: Wearable device export
    raw_data_format: .FIT
    access_details: Retained by the project; converted forms are distributed.
  - source_description: >-
      In-home environmental measurements from the custom LeeLab Anura sensor.
    source_type: Custom sensor export
    raw_data_format: .csv
    access_details: Retained by the project; converted forms are distributed.
  - source_description: >-
      Participant-reported survey responses and coordinator-entered clinical measures held in
      REDCap, together with blood and urine testing results returned by the University of
      Washington Nutrition and Obesity Research Center and local CLIA-certified laboratories.
    source_type: Electronic data capture system and laboratory reports
    raw_data_format: REDCap export and .csv
    access_details: Retained by the project; mapped forms are distributed.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; coverage varies by datatype and by
      participant. Survey items may be skipped or responses left incomplete.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In a few cases the data
      collection device had no stored results or was returned too late to retrieve the results,
      for example because the battery died or the data were lost. In a few cases a data collision
      occurred at some point in the process and data were lost. Wearable gaps also arise because
      the activity tracker had to be recharged every two to three days. Imaging modalities may be
      skipped when quality is inadequate, particularly for operator-dependent devices.
    handling_strategy: >-
      No imputation was performed and no instances were excluded at the time of preprocessing;
      records with missing modalities are retained as collected. Missing data that could be filled
      directly from other portions of an individual's record were completed during cleaning under
      site principal investigator approval.

anomalies:
  - anomaly_details: >-
      Survey data: skipped questions and incomplete responses are expected.
  - anomaly_details: >-
      Wearable data: improper use and technical failure such as battery failure or system
      malfunction are expected.
  - anomaly_details: >-
      Imaging data: participant non-cooperation, noise that may obscure the images, technical
      failure such as system malfunction, and data transfer failures are expected.
  - anomaly_details: >-
      Optomed Aurora undilated handheld fundus photography: because the images are taken without
      pupil dilation and the camera is handheld, obtaining a good view is challenging and image
      quality varies from participant to participant and within the same participant.
  - anomaly_details: >-
      FLIO acquisition: the device is highly sensitive and cannot tolerate more than about one
      centimeter of movement during acquisition. Background light and lens fluorescence cannot
      simply be subtracted because they belong to the same photon distribution as the useful
      signal. Because FLIO takes longer than a standard OCT and exposes participants to
      uncomfortable light levels, it was performed last in the visit, when participant compliance
      may be lowest.
  - anomaly_details: >-
      Operator-dependent devices: the Heidelberg Spectralis is operated manually rather than
      automatically, so quality issues may arise that lead to a modality being skipped and data
      being missing.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers responding to mailed and emailed invitations, producing
      volunteer bias which may limit the generalizability of results to those not represented in
      the study population. Recruitment is predominantly urban and hospital-based, drawn from
      patients with a recent encounter at one of three academic health systems.
    mitigation_strategy: >-
      Three geographically distributed recording sites were selected to broaden recruitment, and
      individuals from all demographic backgrounds were recruited at all three sites. Recruitment
      proceeds in waves whose composition is monitored and adjusted by under- and oversampling
      groups as needed.
  - bias_type: representation_bias
    bias_description: >-
      The cohort does not include other races and ethnicities such as Pacific Islanders and Native
      Americans, and the requirement that participants speak, read, and understand English may
      have created difficulty recruiting Hispanic and Asian persons. Recruiting Black men into
      health research is documented to be more difficult than recruiting other populations, in
      part because of medical mistrust rooted in historical events, while that population carries
      a disproportionate share of the T2DM burden.
    mitigation_strategy: >-
      The study design targets equal proportions across four race/ethnic groups, and the project
      states that new recruitment strategies will be implemented if balancing on race/ethnicity
      emerges as a challenge. The project engaged with the Native Biodata Consortium as a
      co-learning opportunity on challenges specific to American Indian and Alaska Native
      communities, and planned a tribal consultation, but no such cohort is present in this
      release.
  - bias_type: sampling_bias
    bias_description: >-
      Although the cross-sectional database ultimately aims for balance across race/ethnicity,
      biological sex, and diabetes presence and severity, the pilot and interim releases are not
      balanced across these parameters, and this release, drawn from ongoing enrollment, may not
      have achieved balanced distribution across groups.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects regardless of
      race/ethnicity, biological sex, or diabetes severity across all study sites, and study sites
      were selected to ensure varied representation and minimize the potential for sampling bias.
      A recommended data split is supplied in which the validation and test sets are balanced as
      far as possible for sex, race/ethnicity, and diabetes status.
    affected_subsets:
    - >-
      The training split retains the cohort imbalance; the validation and test splits are
      deliberately balanced.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population.
      Recruitment was predominantly urban and hospital-based and may not fully capture all
      cultural and socioeconomic backgrounds; the cohort excludes race and ethnicity groups such
      as Pacific Islanders and Native Americans.
    scope_impact: >-
      Models derived from the dataset may generalize poorly to rural, non-health-system-attached,
      or non-English-speaking populations and to groups absent from the cohort.
  - limitation_type: scope_limitation
    limitation_description: >-
      The design is cross-sectional with a single study visit per participant. Eligibility is
      restricted to adults aged 40 and over who can provide consent and read and speak English;
      participants who are pregnant, who have gestational diabetes, or who have type 1 diabetes
      are excluded, as are adults older than 85.
    scope_impact: >-
      No within-participant temporal trajectory is available in this release; findings do not
      extend to younger adults, to type 1 diabetes, or to pregnancy.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The public release omits variables held under controlled access: 5-digit zip code, sex,
      race, ethnicity, genetic sequencing data, past health records, medications, and traffic and
      accident reports.
    recommended_mitigation: >-
      Investigators requiring these variables must enter into a data use agreement for the
      controlled-access set, whose requirements are set by the Data Access Committee.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The release covers data collected through May 1, 2025 while enrollment is ongoing toward the
      target cohort, so the composition of this version does not reflect the intended final
      balance and will change in later versions.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The biorepository holds a finite number of samples available to share with scientists
      wishing to use them in research; procedures for reviewing and prioritizing written requests
      were still to be developed at the time the protocol was published. Biospecimens are not part
      of this data release.
  - limitation_type: integration_limitation
    limitation_description: >-
      Snellen visual acuity variables present in the previous release were dropped in this
      version, leaving only logMAR measurements, so visual acuity is not directly comparable
      across dataset versions without conversion.

content_warnings:
  - content_warnings_present: false
    warnings:
    - >-
      The dataset creators state that the dataset does not contain data that, if viewed directly,
      might be offensive, insulting, threatening, or otherwise pose a safety risk such as
      psychological harm or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The creators state that the dataset does not contain data that might be considered
      confidential; no personally identifiable information is included in the public release.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public release does not contain data considered sensitive: it carries no protected
      health information, and information related to the sex and race/ethnicity of the
      participants and the medications used has been removed.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled-access counterpart contains data considered sensitive: 5-digit zip code, sex,
      race, ethnicity, genetic sequencing data, past health records, medications, and motor
      vehicle traffic and accident reports. Access requires an institutional data use agreement.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor. No direct identifiers were collected for the released dataset, so no active
    de-identification step was required; the team verified that no data identifiable under the US
    HIPAA Privacy Rule were present.
  identifiers_removed: >-
    Protected Health Information as defined by the HIPAA Privacy Rule; additionally sex,
    race/ethnicity, and medications used were removed from the public set to prevent
    stigmatization of findings.
  deidentification_details: >-
    The FAIRhub de-identification level records deIdentType "NoDeIdentification" with
    deIdentDirect true and deIdentHIPAA true, and deIdentDates, deIdentNonarr, and deIdentKAnon
    all false, with the explanation that no identifiers were collected so no active
    de-identification was necessary but the team checked that no identifiable data per US HIPAA
    were present. Data are statically watermarked to identify the licensee for security purposes.
    Participant folders are named by the study participant identifier only, and that identifier is
    what links a participant's files across all datatype directories; linkage to external records -
    past health records, medications, and traffic and accident reports - exists only in the
    controlled-access set. A theoretical risk of future re-identification remains, since AI
    algorithms can infer individual patient characteristics and could facilitate individual-level
    identification; the project cites this as the reason for its dissemination controls, license
    terms, and watermarking.
  source_caveats: >-
    The FAIRhub structured metadata records the de-identification type as "NoDeIdentification"
    while the RO-Crate records "deidentified: true"; both are highest-ranked sources and are
    reconcilable in that no active de-identification step was needed because no identifiers were
    collected. The healthsheet questions on de-identification measures and on pre-processing for
    de-identification were left with empty responses.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    Approved under protocol STUDY00016228. Initial IRB approval was received on December 20, 2022;
    an annual renewal application reporting status and progress is required and due within 90 days
    of expiration. The other clinical sites operated under IRB reliance and used the same consent
    form with minor institution-specific language.
  ethics_review_board: >-
    The RO-Crate names the reviewing body as "Washington University IRB", with the IRB Reliance
    Team contact hsdrely@uw.edu at the Human Subjects Division, 4333 Brooklyn Ave NE Box 359470,
    Seattle, WA 98195-9470, United States. The BMJ Open protocol publication states that AI-READI
    was approved by the Institutional Review Board of the University of Washington under approval
    number STUDY00016228, with reliance agreements with the IRBs of the University of Alabama at
    Birmingham and the University of California, San Diego.
  regulatory_compliance:
  - >-
    Human subject review status is recorded as submitted and approved. The study is registered on
    ClinicalTrials.gov as NCT06002048. It is not FDA-regulated for either drug or device, and has
    no Data Monitoring Committee. Licensees must comply with the data security and privacy
    standards established by the NIH under its Genomic Data Sharing Policy. The public release
    follows the HIPAA Privacy Rule Safe Harbor method.
  special_populations:
  - >-
    Eligibility is restricted to adults aged 40 to 85. Pregnancy, gestational diabetes, and type 1
    diabetes are exclusionary; no minors are enrolled and prisoners are not a target population.
  source_caveats: >-
    The FAIRhub study description records the ClinicalTrials.gov secondary identifier as
    NCT06002048, while the BMJ Open publication refers to "Clinicaltrials.org approval number
    STUDY00016228", which is the IRB protocol number rather than a registry identifier.

ethical_reviews:
  - reviewing_organization: Washington University IRB
    review_details: >-
      IRB of record for protocol STUDY00016228, with initial approval December 20, 2022 and annual
      renewal required. Reliance agreements cover the University of Alabama at Birmingham and the
      University of California, San Diego sites. The IRB Reliance Team can be reached at
      hsdrely@uw.edu. The initial approval letter is published in the dataset documentation.
    source_caveats: >-
      The RO-Crate names the organization "Washington University IRB" but gives a University of
      Washington Human Subjects Division address in Seattle and a uw.edu contact address; the
      IRB protocol application in the bundle is a University of Washington Human Subjects Division
      form. The BMJ Open protocol publication attributes the approval to the University of
      Washington IRB.
  - reviewing_organization: AI-READI ethics module
    review_details: >-
      Ethical, legal, and social implications were considered at every stage of the project cycle,
      with guidance from bioethicists. The RO-Crate names Camille Nebeker, Debra Mathews, Kadija
      Ferryman, and Nicholas Evans as those responsible for ethical review within the project. The
      project reviewed existing documentation approaches, including datasheets and healthsheets,
      to identify the most suitable for biomedical data, and engaged with the Native Biodata
      Consortium on data usage agreements, contract negotiations, transparent access agreements,
      and forms of assured return of benefit and sustainable input, control, and monitoring of
      Tribal data.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      A Community Advisory Board of eleven persons drawn from the three sites, including diversity
      in race and ethnicity as represented in the AI-READI sample, contributes to the development
      of the protocol and evaluates consent forms and research protocols, with feedback
      incorporated into protocol modifications.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent from every participant, obtained either as electronic consent with
      an electronic signature in REDCap before the visit or in person at the start of the visit.
    consent_documentation: >-
      The approved consent form for the principal project site is published in the dataset
      documentation. Other clinical sites operated under IRB reliance and used the same consent
      form with minor institution-specific language depending on individual institutional
      requirements; the University of California, San Diego version additionally includes the
      State of California Bill of Rights. Informed consent was required before participation in
      any part of the protocol, including questionnaires; participants could read all consent
      documentation electronically before their visit and consent with an electronic signature
      without verbal communication with a coordinator, or decline, request additional information,
      request a call back, or wait to consent in person at the start of the visit. Signed
      electronic consent was automatically emailed to the participant, and additional copies could
      be requested from the study coordinator for the duration of the study.
    consent_scope: >-
      Consent covers the full protocol, including questionnaires, and the placement of data in an
      open-source repository and of samples in the study repository for future research. The
      FAIRhub consent record classifies the consent type as
      "ConsentSpecifiedNotElsewhereCategorised" with no non-commercial, geographic, research-type,
      genetic-only, or no-methods restrictions flagged at the consent level, and notes that the
      public version of the dataset can only be used for type 2 diabetes related research while a
      private version will allow more generic use.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation;
      any data that had been shared or used up to that point would remain in the dataset, a
      limitation clearly communicated in the consent document. Because the dataset is released as
      static versions, records already published in a released version are not retracted from that
      version.
    notes: >-
      Every individual was aware of the data collection, since this was active collection directly
      from participants rather than passive collection or secondary use of existing data.
      Individuals in each recruitment pool were mailed a personalized hardcopy invitation letter
      and sent an invitation email directing them into an online REDCap recruitment interface using
      links, access codes, and QR codes, where they could read an overview of the research program,
      expectations for participation, and answers to frequently asked questions, download the
      informed consent document, request a call back from study staff, complete a screening survey,
      and enroll. Those without internet access could call research staff for alternative methods
      of enrollment. Recruitment letters state how the recipient's name and contact information
      were obtained.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    No minors are enrolled: eligibility requires an age of 40 years or older, so no parental
    permission or child assent procedures apply. Prisoners are not a target population. Pregnancy
    and gestational diabetes are exclusion criteria. Participants must be able to provide consent,
    so adults unable to consent for themselves are not enrolled and no legally authorized
    representative pathway is used.

license_and_use_terms:
  license_terms: >-
