purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, multimodal dataset optimized for
      artificial intelligence and machine learning research into type 2 diabetes mellitus,
      including salutogenesis - the pathway from disease back to health.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria or biases and can be used to reconstruct a temporal atlas of T2DM
      development and reversal toward health.
  - response: >-
      To establish and disseminate a blueprint - standards, best practices, and guidelines for
      collection, preparation, and sharing - that future data generation projects can follow when
      building AI-ready biomedical datasets.
  - response: >-
      To support the AI-READI training mission by providing a dataset around which a year-long
      research internship program at the intersection of biomedicine and artificial intelligence
      is organized.

addressing_gaps:
  - response: >-
      A major barrier to AI-based discovery in type 2 diabetes has been the lack of diverse
      datasets that are AI ready for training AI models. The AI-READI dataset is intended to fill
      this gap by providing data that is off-the-shelf ready for AI-based analysis without
      reformatting and preprocessing.
  - response: >-
      Existing large datasets for AI/ML training lack racial and ethnic diversity. A
      meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020 found
      that samples lacked racial and ethnic diversity; the AI-READI cohort was designed to be
      approximately balanced across Asian, Black, Hispanic, and white participants.
  - response: >-
      Understanding and affecting the course of complex, multi-organ diseases such as T2DM has
      been limited by the absence of well-designed, high-quality, large, and inclusive multimodal
      datasets that capture molecular, physiological, pathological, and clinical states at
      different stages of illness.
  - response: >-
      Existing data sources such as insurance claims or electronic health records do not support
      the downstream AI/ML analyses the project targets; the multi-domain acquisition protocol was
      designed specifically to enable analyses those sources cannot.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis - an approach adapted from developmental biology and
      used to predict disease trajectories by learning from complex, multimodal data collected
      from participants of differing disease severity, from no diabetes through insulin-dependent
      type 2 diabetes.
  - response: >-
      Reconstruction of a temporal atlas of type 2 diabetes development and of reversal toward
      health (salutogenesis).
  - response: >-
      Multimodal AI/ML model development across survey, clinical, laboratory, imaging, waveform,
      wearable, and environmental modalities collected on the same participants.

instances:
  - instance_type: Individual human research participant
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with each instance. The dataset is
      hypothesis-agnostic and was assembled to support multiple potential downstream AI/ML
      applications rather than a single predefined task.
    notes: >-
      All instances are participants in the same prospective data generation project (AI-READI).
      There is currently one study visit per participant, so each participant contributes a single
      cross-sectional record; within a participant, files across all datatype directories are
      linked by the participant identifier used as the directory name. Approximately 10 percent of
      the study cohort is planned to be invited for a follow-up visit in year 4 of the project,
      which would introduce a longitudinal relationship in a future release.

