    right to download, reproduce, and use the data and to create derivative works for research and
    for commercial and non-commercial purposes, subject to conditions. A licensee may be an
    individual or, where indicated in the data request workflow, an internal group, lab, or
    business unit within an institution or employer, whose legal members become Authorized Users;
    an individual's Authorized User status terminates automatically when their relationship with
    the group or institution ends, and the licensee is fully liable for the acts and omissions of
    each Authorized User. Data may be shared only with another licensee bound by identical terms,
