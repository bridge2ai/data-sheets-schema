  data_use_permission: disease_specific_research
  source_caveats: >-
    Both the FAIRhub dataset landing page and the FAIRhub API are highest-ranked sources and label
    the license differently: the landing page shows "Health Data License", while the API rights
    entry gives rightsName "AI-READI custom license v2.0" with rightsURI
    https://doi.org/10.5281/zenodo.17555036. The license document itself is titled "AI-READI DATA
    LICENSE AGREEMENT (Version 2.0)". The API name is used here. The data_use_permission value
    reflects the access condition that users agree to use the data only for type 2 diabetes
    related research; the license grant itself permits commercial and non-commercial research use,
    so the two are recorded together rather than as alternatives.

ip_restrictions:
  restrictions:
  - >-
    Title to the data and all industrial and intellectual property rights in it remain solely and
    exclusively with the Licensor and its suppliers at all times; the licensee must take no action
    inconsistent with that ownership, and any rights not expressly granted are reserved. All full
    and partial copies made by the licensee are subject to the license terms. Licensees may make,
    reproduce, and distribute models, algorithms, and programs developed, trained, or adapted
    using the data provided those artifacts do not themselves contain the data or any modified
    version of it. Publishers and conference organizers wishing to reproduce more data than the
    permitted five images or figures per paper must obtain a separate license from the Licensor.
    Asked whether third parties had imposed IP-based or other restrictions on the data, the
    creators refer to the license.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    Asked whether export controls or other regulatory restrictions apply, the creators refer to
    the license. The license requires compliance with all applicable laws, regulations, and
    restrictions relating to the distribution and use of the data and models, and with the data
    security and privacy standards established by the US National Institutes of Health under its
    Genomic Data Sharing Policy, currently the NIH Security Best Practices for Controlled-Access
    Data Subject to the NIH GDS Policy. Licensees acknowledge that the data may be statically
    watermarked to identify them for security purposes and agree to take no action to remove,
    obscure, alter, or mask the watermarking.
  other_compliance: >-
    The public release follows the HIPAA Privacy Rule Safe Harbor method and contains no protected
    health information. The study is recorded as not FDA-regulated for either drug or device. The
    RO-Crate records a confidentiality level of "HL7:2N (normal)".
  source_caveats: >-
    The confidentiality_level value "restricted" is an interpretation of the documented access
    conditions - verified identity login, self-attestation, and acceptance of license terms -
    rather than a verbatim source value; the RO-Crate's own confidentialityLevel string is
    "HL7:2N (normal)", which does not map onto the permitted values for this slot.

data_governance:
  committee_name: AI-READI Consortium data governance committee
  committee_contact:
    id: ORCID:0000-0002-7452-1648
    name: Aaron Y. Lee
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: >-
    Accessing the public dataset requires logging in through a verified identity system, agreeing
    to use the data only for type 2 diabetes related research, and agreeing to the license terms,
    which set restrictions and obligations for data usage. The FAIRhub access type is recorded as
    PublicDownloadSelfAttestationRequired. The full dataset, including the controlled-access
    elements, is accessible only by entering into a data use agreement; the controlled-access set
    is available for use by scientists whose institutions have completed legal and privacy use
    agreements with the AI-READI research program, and its requirements are set by the project's
    Data Access Committee.
  stewardship_roles:
  - >-
    The Data Manager at each data collection site was responsible for quality control of all data
    before uploading to FAIRhub. The central project team performs mapping to standards and
    prepares releases. The AI-READI team supports and maintains the released dataset. Access
    requests are handled through the FAIRhub data request workflow, and the RO-Crate names the
    AI-READI Consortium as the data governance committee.
  source_caveats: >-
    The BMJ Open protocol publication states that the requirements for the controlled-access
    dataset were still being developed by the Data Access Committee at the time of writing; no
    committee membership list, decision timeframe, or appeal process is documented in any source
    in the bundle.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    access_urls:
      - https://fairhub.io/datasets/3
      - https://fairhub.io/datasets/3/access
    notes: >-
      Used for all retinal imaging datatypes: FLIO, OCT, OCTA, and photography.
  - format: CSV
    media_type: text/csv
    notes: >-
      Used for the OMOP CDM clinical data tables and for delimited environmental and wearable
      outputs, and for the manifest.tsv and participants.tsv metadata files.
  - format: JSON
    media_type: application/json
    notes: >-
      Used for Open mHealth wearable and continuous glucose monitoring records and for the CDS
      metadata files dataset_description.json, dataset_structure_description.json,
      study_description.json, participants.json, and dqd_omop.json.
  - format: Markdown
    media_type: text/markdown
    notes: >-
      Used for the README.md, CHANGELOG.md, and healthsheet.md metadata files.

distribution_dates:
  - release_dates: >-
      Version 1.0.0 (DOI 10.60775/fairhub.1) released May 3, 2024, containing pilot data collection
      from 204 participants. Version 2.0.0 (DOI 10.60775/fairhub.2) released November 8, 2024,
      containing 1,067 participants and no longer accessible. Version 3.0.0 (DOI
      10.60775/fairhub.3) released November 17, 2025, containing 2,280 participants. New versions
      are planned approximately annually.
    source_caveats: >-
      The BMJ Open protocol publication, written earlier, describes the November 2024 release as
      planned and refers to a first release in May 2024; the FAIRhub version list and healthsheet
      supply the exact dates used here.

version_access:
  versions_available:
  - >-
    Three versions have been published on FAIRhub: 1.0.0 (10.60775/fairhub.1, May 3, 2024), 2.0.0
    (10.60775/fairhub.2, November 8, 2024), and 3.0.0 (10.60775/fairhub.3, November 17, 2025).
    Documentation is versioned in parallel at docs.aireadi.org, with one documentation version per
    dataset version selectable from a dropdown.
  latest_version_doi: doi:10.60775/fairhub.3
  version_details: >-
    The dataset is released as static versions rather than being dynamically updated; released
    versions are not modified. The FAIRhub pages for versions 1.0.0 and 2.0.0 state that those
    versions are no longer accessible and direct users to the latest version, and the version
    2.0.0 documentation carries the same notice. A smaller mini version of the current release is
    made available for pipeline development. Version 3.0.0 adds year 3 data to the year 2 data
    that constituted version 2.0.0 and the pilot data that constituted version 1.0.0: participant
    counts across releases are 204, then 863 additional (1,067 cumulative), then 1,213 additional
    (2,280 cumulative). Version 3.0.0 also adds three imaging devices relative to the year 2 data
    and drops the Snellen visual acuity variables, and it introduces a new recommended
    training/validation/test split for the 2,280 participants balanced for age, sex,
    race/ethnicity, and study group.

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset will not be updated in place. New versions will be released with additional
    instances as more study participants complete the study visit, approximately once a year, each
    including data from participants enrolled since the last version release. Changes between
    versions are documented in the CHANGELOG file included in the dataset and visible at
    docs.aireadi.org. Older versions are not maintained as accessible releases.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants
    were not told that their data would be retained only for a fixed period and then deleted. Raw
    data are expected to be preserved by the AI-READI project at least for the duration of the
    project.

maintainers:
  - role: researcher
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. Contact is through
      https://aireadi.org/contact and the address contact@aireadi.org; the README file included
      with the dataset carries contact information, and the study_description.json and
      dataset_description.json metadata files identify the contact person and entity, authors, and
      contributors. The named central contact and study principal investigator is Aaron Y. Lee.
  - role: other
    maintainer_details: >-
      FAIRhub hosts the dataset. FAIRhub is a cloud-based data management, curation, and sharing
      platform built for this project on Microsoft Azure, developed to include intuitive user
      interfaces and a suite of tools that simplify and automate the project's guidelines for
      making data AI ready. The project anticipates making the platform available for future data
      generation projects wishing to manage and share AI-ready clinical research datasets.

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes
    examples:
    - >-
      Development of AI/ML models of type 2 diabetes pathogenesis and salutogenesis using
      multimodal data spanning survey, clinical, laboratory, imaging, waveform, wearable, and
      environmental domains collected on the same participants.
    usage_notes: >-
      Access to the public set is conditioned on agreeing to use the data only for type 2 diabetes
      related research.
  - use_category: Disease trajectory modeling
    examples:
    - >-
      Downstream pseudotime manifold analysis to predict disease trajectories from participants
      spanning normal glucose tolerance through insulin-dependent type 2 diabetes, and
      reconstruction of a temporal atlas of T2DM development and reversal toward health.
  - use_category: Methodological and equity research on AI-ready data
    examples:
    - >-
      Use of the recommended training/validation/test split, which balances the validation and
      test sets for sex, race/ethnicity, and diabetes status, to study and reduce disparities in
      model performance when demographic labels are unavailable to the developer; and use of the
      project's blueprint, standards, and documentation as a model for other AI-ready dataset
      efforts.
  - use_category: Commercial research and product development
    usage_notes: >-
      The license grants rights to use the data and create derivative works for research and for
      commercial and non-commercial purposes, subject to the sharing, storage, third-party model,
      publication, and re-identification restrictions.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited: the data are intended
      solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or in concert with other information, to
      compromise or infringe the confidentiality of information about a data subject, to invade or
      compromise a data subject's privacy, to identify or contact a data subject or group of data
      subjects, to extract or extrapolate identifying information, to establish a data subject's
      membership in a particular group of persons, or otherwise to cause harm or injury to a data
      subject, is prohibited.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for training
      or development purposes - including model weight modification and other adjustments to a
      model's logic or operation - is prohibited, even if that vendor is party to a Business
      Associate Agreement with the licensee's institution. A third-party model may be used to
      analyze the data only where the vendor is party to such an agreement and the model's
      interaction with the data is limited to short-term interaction such as prompting or
      querying.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing, or otherwise
      conveying any portion of the data or any derivative work to any third party other than
      another licensee bound by an identical agreement is prohibited.
  - prohibition_reason: >-
      Reproducing the data in papers, articles, presentations, analyses, or reports beyond small
      representative samples in up to five images or figures per paper is prohibited, and larger
      amounts must not be published, posted, or otherwise made available via supplemental files,
      zip archives, code packages, or other means, notwithstanding journal or conference
      requirements.
  - prohibition_reason: >-
      Storing the data anywhere other than on servers and devices maintained by and located within
      the licensee's institution, or on cloud or remote storage and backup services covered by a
      HIPAA-approved Business Associate Agreement with that institution, is prohibited.
  - prohibition_reason: >-
      Removing, obscuring, altering, or masking the static watermarking applied to the data for
      security purposes is prohibited.
  - prohibition_reason: >-
      Use of the public dataset for research other than type 2 diabetes related research is
      excluded by the access condition attached to the public release; broader use requires the
      private version and a data use agreement.

future_use_impacts:
  - impact_details: >-
      A theoretical risk of future re-identification exists. AI algorithms can infer individual
      patient characteristics and could facilitate individual-level identification, which is why
      the project implements a robust data dissemination system, a strict license agreement, and
      data watermarking for both the public and controlled sets. Beyond this, the creators state
      that to the extent of their knowledge they do not currently anticipate uses of the dataset
      that could result in unfair treatment or harm.
  - impact_details: >-
      Information related to the sex and race/ethnicity of participants was withheld from the
      public set specifically to prevent stigmatization of findings, which constrains what
      fairness auditing a public-set user can perform; the recommended split is offered as a
      partial mitigation, since it is designed to reduce disparities in models developed from the
      dataset when demographic labels are unavailable.
  - impact_details: >-
      Because the pilot and interim releases are not balanced across race/ethnicity, biological
      sex, and diabetes severity, and because enrollment is ongoing, models trained on this
      version may inherit imbalance that later versions are intended to reduce. Users comparing
      results across versions should account for the changing cohort composition and for the
      removal of Snellen visual acuity variables in this version.

external_resources:
  - external_resources: >-
      Dataset documentation at https://docs.aireadi.org (see "Dataset v3.0.0" for this version),
      which contains an overall description of the dataset using the Healthsheet template, the
      protocol followed, details for each data domain including clinical context, acquisition,
      relevant individual variables, file formats, data standards, metadata and example outputs,
      an AI-readiness section covering FAIR principles and ethical practices, controlled variables,
      a changelog, and citation instructions.
    archival: false
    restrictions:
    - >-
      The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
      associated with its use.
    future_guarantees: >-
      The dataset is self-contained but relies on the documentation for users requiring additional
      information about its provenance. One version of the documentation is maintained for each
      version of the dataset. The documentation site carries a notice that the repository is under
      review for potential modification in compliance with Administration directives.
  - external_resources: >-
      AI-READI project website at https://aireadi.org, including the team page at
      https://aireadi.org/team, the data sharing goals page at https://aireadi.org/goals/data-sharing,
      and the contact page at https://aireadi.org/contact.
    archival: false
  - external_resources: >-
      AI-READI GitHub organization at https://github.com/AI-READI and Zenodo community at
      https://zenodo.org/communities/aireadi, which hold the project's guidelines and blueprint
      for collecting and sharing AI-ready datasets; the AI-READI data license at
      https://doi.org/10.5281/zenodo.17555036; and the Clinical Dataset Structure specification at
      https://cds-specification.readthedocs.io, a standard developed by the project as a simple
      and intuitive way to organize clinical research datasets and include structured metadata.
    archival: true
    future_guarantees: >-
      The license is deposited on Zenodo with a DOI; the CDS specification is versioned, and this
      dataset cites v0.1.1.
  - external_resources: >-
      AI-READI research internship program at https://shileyeye.ucsd.edu/research/ai_readi, a
      year-long immersive training program comprising a two-week data science and programming
      bootcamp followed by a yearlong curriculum of didactic lectures and mentored research;
      interns contribute to developing healthsheets describing the AI-READI data, mapping project
      data into common data models, and analyzing equity and ethical issues.
    archival: false

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.2
    description: >-
      Version 2.0.0 of the AI-READI flagship dataset, released November 8, 2024 with 1,067
      participants. Its FAIRhub page states that the version is no longer accessible.
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.1
    description: >-
      Version 1.0.0 of the AI-READI flagship dataset, released May 3, 2024 with 204 participants
      from the pilot data collection phase.
    source_caveats: >-
      target_dataset is expressed as a DOI CURIE because the digest does not declare the range of
      this slot; both prior versions are identified by DOIs supplied in the FAIRhub version list.

notes: >-
  Participants received a stipend of 200 USD for the study visit, paid from grant funding once the
  final data were received and the study devices returned - typically at least two weeks after the
  visit - and not prorated; the same compensation is planned for participants invited back for the
  year 4 follow-up visit. Reasonable parking, public transit, or rideshare costs related to the
  study visit were covered, and transportation assistance through rideshare services was offered to
  participants reporting barriers to reaching study visits. A smaller mini version of this release
  is made available on FAIRhub for pipeline development; the API records it as a child dataset with
  FAIRhub identifier 4 and no separate DOI. The RO-Crate carries the copyright notice
  "Copyright (c) 2026 AI-READI". As of the capture of the FAIRhub API record, the landing page
  reported 24,636 views and zero recorded citations. Both the FAIRhub and docs.aireadi.org pages
  carry a notice that the repository is under review for potential modification in compliance with
  Administration directives.

source_caveats: >-
  Institutional attribution is inconsistent across the bundle. The highest-ranked sources (FAIRhub
  structured metadata and the RO-Crate) name Washington University in St. Louis (ROR:01yc7t268) as
  the managing organization, lead sponsor, license Licensor, and affiliation of the responsible
  party and of principal investigators Aaron Lee, Cecilia Lee, and Aaron Y. Lee's central contact
  entry; the same RO-Crate simultaneously describes the principal investigator as "Aaron Lee,
  Department of Ophthalmology, University of Washington" and gives the IRB a University of
  Washington Human Subjects Division address in Seattle with a uw.edu contact. Lower-ranked
  sources are consistent with University of Washington: NIH RePORTER lists the awardee
  organization as University of Washington, and the BMJ Open protocol publication lists Aaron Lee
  and Cecilia Lee at the University of Washington and attributes IRB approval to the University of
  Washington. Both organizations are therefore recorded where they appear, and the conflict is not
  resolved here. -- The project name differs across sources: the highest-ranked FAIRhub study
  description and NIH RePORTER give "AI Ready and Exploratory Atlas for Diabetes Insights", while
  the BMJ Open and Nature Metabolism publications give "Artificial Intelligence Ready and
  Equitable Atlas for Diabetes Insights"; the FAIRhub form is preferred. -- Target enrollment
  differs: FAIRhub records an anticipated enrollment of 4,000 and the publications state a target
  of 4,000 people, while the University of Washington IRB protocol application in the bundle
  states 4,600 (1,000 in each of four diabetes groups, with a stated aim of 1,000 subjects from
  each of four racial and ethnic groups). The FAIRhub figure is preferred as the higher-ranked
  source. -- The IRB protocol application also describes exclusionary and eligibility details and
  a 200 USD stipend not stated in the tier-1 sources; those details are recorded here from that
  source alone. -- The per-directory file counts in the FAIRhub structured metadata sum to 356,334,
  nine fewer than the stated total of 356,343; the difference is consistent with the nine
  root-level metadata files, which are listed separately from the directory list. -- The FAIRhub
  healthsheet contains internal inconsistencies: the Demographic Information section answers "No"
  to whether the dataset identifies demographic sub-populations, while the README in the same
  record publishes race/ethnicity, sex, and diabetes-status counts for the whole cohort and for
  each recommended split; the versioning section describes this release as "data collected up
  through the end of the second year of the study" while the changes table labels it "v3.0.0 main
  study" incorporating year 2 and year 3 data; and several healthsheet questions
  (de-identification measures, pre-processing for de-identification, erratum) were left with empty
  responses. -- The healthsheet composition section states that the dataset contains data from all
  participants enrolled "during the first year of data collection", which is inconsistent with the
  stated collection window of July 19, 2023 to May 1, 2025 and the 2,280-participant count; the
  collection window and count are taken from the dataset description and README. -- Numbered
  publication references and figure/table cross-references appearing in the BMJ Open and Nature
  Metabolism source text have been dropped where content from those sources is reported here. --
  This core record is a projection of the phase 1 full record; slots with no CoreDataset
  counterpart (per-variable descriptions, biospecimen and participant-privacy detail, and the
  file-collection identifiers) were folded into distributions, is_deidentified, informed_consent,
  and notes, or omitted where no fitting slot exists. Slots for which the bundle states only an
  absence - existing uses, use repositories, errata, labeling strategies, machine annotation
  tools, annotation analyses, imputation protocols, data protection impacts, and extension
  mechanism - were omitted rather than populated with a statement of absence.