distributions:
  - path: cardiac_ecg
    bytes: 302931703
    conforms_to: >-
      WaveForm DataBase (WFDB), a set of file standards for reading and storing physiologic signal
      data and associated annotations; directory naming follows Clinical Dataset Structure (CDS)
      v0.1.1.
    conforms_to_standard:
      - WFDB
      - CDS
    notes: >-
      4,515 files. Electrocardiogram data collected using the 12-lead protocol on the Philips
      PageWriter TC30 Cardiograph, recorded while the participant sits in a reclining chair or lies
      supine, with the chair position (0, 30, 60, or 90 degrees relative to supine) recorded.
  - path: clinical_data
    bytes: 176182781
    format: CSV
    media_type: text/csv
    conforms_to: >-
      The Observational Medical Outcomes Partnership (OMOP) Common Data Model; directory naming
      follows Clinical Dataset Structure (CDS) v0.1.1.
    conforms_to_standard:
      - OMOP_CDM
      - CDS
    notes: >-
      7 files. Clinical data collected through REDCap, including blood and urine laboratory
      values, Montreal Cognitive Assessment results, monofilament testing, physical and vision
      assessments, and survey questionnaire results. Each CSV file is a one-to-one mapping to an
      OMOP CDM table. A dqd_omop.json file supports data quality analysis using the OMOP CDM Data
      Quality Dashboard.
  - path: environment
    bytes: 55625676514
    conforms_to: >-
      NASA ASCII File Format Guidelines for Earth Science Data (Earth Science Data Systems);
      directory naming follows Clinical Dataset Structure (CDS) v0.1.1.
    conforms_to_standard:
      - ESDS
      - CDS
    notes: >-
      2,232 files. Indoor environmental measurements collected by the LeeLab Anura, a sensor unit
      custom built for the AI-READI project and placed by the participant in a frequently used area
      of the home for ten days. Recorded variables include ambient temperature, relative humidity,
      nitrogen oxides (NO and NO2), volatile organic compounds, particulate matter counts (PM1.0,
      PM2.5, PM4, PM10), and eleven multi-spectral light intensity measurements.
  - path: retinal_flio
    bytes: 1069466876718
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory naming follows Clinical
      Dataset Structure (CDS) v0.1.1. Source files were exported in .sdt format and converted to
      DICOM for the dataset.
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      7,969 files. Fluorescence lifetime imaging ophthalmoscopy data acquired on the Heidelberg
      FLIO device for in vivo measurement of lifetimes of endogenous retinal fluorophores. Each eye
      is recorded at two wavelength channels, short (498-560 nm) and long (560-720 nm), supplied as
      separate DICOM files; each pixel carries a photon arrival-time curve following a Poisson
      distribution.
  - path: retinal_oct
    bytes: 1317625293027
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory naming follows Clinical
      Dataset Structure (CDS) v0.1.1. Topcon acquisitions were exported in .fda format and
      converted to DICOM for the dataset.
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      56,478 files. Structural optical coherence tomography data from four devices - Heidelberg
      Spectralis, Topcon Maestro2, Topcon Triton, and Zeiss Cirrus - providing cross-sectional
      views of the retinal layers.
  - path: retinal_octa
    bytes: 1155908809724
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory naming follows Clinical
      Dataset Structure (CDS) v0.1.1.
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      173,721 files. Optical coherence tomography angiography data from Heidelberg Spectralis,
      Topcon Maestro2, Topcon Triton, and Zeiss Cirrus devices, organized into en face, flow cube,
      and segmentation modalities. En face images give a two-dimensional view of the retinal layers
      derived from 3D volume scans; flow cube data describe blood flow in three dimensions;
      segmentation data are presented as heightmaps with associated layer information.
  - path: retinal_photography
    bytes: 174381046406
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory naming follows Clinical
      Dataset Structure (CDS) v0.1.1.
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      93,921 files. Two-dimensional retinal (fundus) photography organized into three modalities -
      color fundus photography (iCare Eidon, Optomed Aurora, Topcon Maestro2, Topcon Triton),
      fundus autofluorescence (iCare Eidon), and near-infrared reflectance (Heidelberg Spectralis,
      iCare Eidon, Topcon Maestro2, Zeiss Cirrus). All retinal images were collected under dilated
      conditions except those from the handheld Optomed Aurora, which are undilated.
  - path: wearable_activity_monitor
    bytes: 38313536220
    conforms_to: >-
      Open mHealth, the Open Standard for Mobile Health Data; directory naming follows Clinical
      Dataset Structure (CDS) v0.1.1. Source files were exported in .FIT format and converted to
      the Open mHealth standard for the dataset.
    conforms_to_standard:
      - OPEN_MHEALTH
      - CDS
    notes: >-
      15,245 files. Data from the Garmin Vivosmart 5 wrist-worn fitness tracker, worn for ten
      consecutive days concurrently with the continuous glucose monitor and the in-home
      environmental sensor, at a sampling frequency of 5 seconds. Organized into heart rate, oxygen
      saturation, physical activity, physical activity calorie, respiratory rate, sleep, and stress
      modalities. Gaps in collection occur because the device had to be charged every two to three
      days.
  - path: wearable_blood_glucose
    bytes: 4169006971
    conforms_to: >-
      Open mHealth, the Open Standard for Mobile Health Data; directory naming follows Clinical
      Dataset Structure (CDS) v0.1.1.
    conforms_to_standard:
      - OPEN_MHEALTH
      - CDS
    notes: >-
      2,246 files. Interstitial glucose measurements from the Dexcom G6 real-time integrated
      continuous glucose monitoring system, recorded every five minutes over a ten-day wear period.
      Participants were masked to the readings during the monitoring period.
  - conforms_to: Clinical Dataset Structure (CDS) v0.1.1
    conforms_to_standard:
