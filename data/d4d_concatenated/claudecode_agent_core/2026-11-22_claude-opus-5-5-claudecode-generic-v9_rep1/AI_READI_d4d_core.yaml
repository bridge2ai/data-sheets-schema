funders:
- name: National Institutes of Health
  grantor: National Institutes of Health
  description: The creation of the dataset was funded by the National Institutes of Health
    (NIH) through the NIH Common Fund's Bridge2AI program. The funding institution is not
    creating or managing the dataset; the dataset is created and managed by the awardees of
    the grant.
  grants:
  - id: https://reporter.nih.gov/search/yatARMM-qUyKAhnQgsCTAQ/project-details/10885481
    name: 'Bridge2AI: Salutogenesis Data Generation Project'
    grant_number: OT2OD032644
    description: NIH RePORTER lists project number 1OT2OD032644-01 (fiscal year 2022) for
      this award.
  source_caveats: The FAIRhub healthsheet writes the grant number as "OT2ODO32644" (letter
    O in place of the digit 0); the FAIRhub funding reference, NIH RePORTER and both articles
    give OT2OD032644, which the record uses. The funding statements of the two articles additionally
    name NIH grants P30DK035816 and UL1TR003096 and Research to Prevent Blindness as support
    for the articles' work; those statements concern the articles, so they are not recorded
    as funders of the dataset.
instances:
- name: Participants
  instance_type: Individual patient (study participant)
  counts: 2280
  description: Each instance represents an individual patient; there are 2280 instances in
    version 3.0.0, released in fall 2025. The README's suggested-split table reports a mean
    age of 60.8 ± 11.3 years across all 2280 participants.
anomalies:
- name: Survey nonresponse
  anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- name: Wearable device failures
  anomaly_details: For wearables, improper use and technical failure such as battery failure
    or system malfunction are expected.
- name: Imaging noise and failures
  anomaly_details: For imaging data, patient uncooperation, noise that may obscure the images,
    and technical failure such as system malfunction and data transfer failures are expected.
- name: Variable undilated fundus image quality
  anomaly_details: Optomed Aurora images are undilated and handheld, so image quality varies
    from patient to patient and within the same patient.
- name: Spectralis quality issues
  anomaly_details: The Spectralis is operated by the imaging team and is not fully automated,
    so quality issues may arise, which may lead to skipping this modality and missing data.
- name: FLIO participant compliance
  anomaly_details: FLIO takes longer than a usual Spectralis OCT and exposes patients to uncomfortable
    levels of light, so it is performed last in the visit, when patients may not be at their
    best possible compliance.
known_biases:
- name: Volunteer bias
  bias_type: selection_bias
  bias_description: Participants are volunteers; therefore, there is selection bias known
    as volunteer bias, which may limit the generalizability of results among those not represented
    in the study population.
known_limitations:
- name: English-language requirement
  limitation_description: Requiring that eligible participants speak, read and understand
    English may have created challenges in recruiting Hispanic and/or Asian persons.
- name: Balance not yet achieved
  limitation_description: The cohort ultimately aims for balance across race/ethnicity, biological
    sex, and diabetes presence and severity, but the pilot study is not balanced across these
    parameters, and as enrollment is ongoing the pilot data release and periodic updates may
    not have achieved balanced distribution across groups.
- name: Urban and hospital-based recruitment
  limitation_description: Recruitment was predominantly urban and hospital-based, which may
    not fully capture diverse cultural and socioeconomic backgrounds.
  scope_impact: Named in the healthsheet as a factor influencing the generalization of derived
    models.
- name: Races/ethnicities not included
  limitation_description: The cohort does not include other races/ethnicities such as Pacific
    Islanders and Native Americans and may not provide a comprehensive representation of the
    population.
