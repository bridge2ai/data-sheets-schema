title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: 'AI-READI dataset release 3.0.0. The AI-READI project seeks to create and share
  a flagship ethically-sourced dataset of type 2 diabetes. The dataset consists of data collected
  from individuals with and without type 2 diabetes mellitus (T2DM) and harmonized across
  3 data collection sites, from an observational, cross-sectional cohort study. Data are collected
  in a multivariable protocol covering more than 10 domains, including vitals, retinal imaging,
  electrocardiogram, cognitive function, continuous glucose monitoring, physical activity,
  home air quality, blood and urine laboratory testing, and psychosocial variables including
  social determinants of health. Multiple modalities are collected for each participant (survey
  data, clinical data, retinal imaging data, environmental sensor data, continuous glucose
  monitor data and wearable activity monitor data), encompassing tabular data, imaging data
  and physiological signal/waveform data; there is no unstructured text data. The data contain
  no protected health information (PHI), and information related to the sex and race/ethnicity
  of the participants as well as medication used has been removed. Data are organized following
  the Clinical Dataset Structure (CDS) v0.1.1: one directory per datatype at the root level,
  then one folder per modality, one folder per device, and one folder per participant.'
source_caveats: '(1) Name expansion: the BMJ Open protocol (publication, tier 3) expands AI-READI
  as "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights"; NIH RePORTER
  (tier 4) and the FAIRhub healthsheet and README (structured metadata, tier 1) use "Artificial
  Intelligence Ready and Exploratory Atlas for Diabetes Insights", and the FAIRhub study description
  gives the official title "AI Ready and Exploratory Atlas for Diabetes Insights". The record
  uses the FAIRhub dataset title and does not choose an expansion. (2) Totals are the record''s
  own computation from the FAIRhub dataset structure description: the nine datatype directory
  sizes sum to 3,815,969,360,064 bytes, 419,614 bytes less than the stated dataset size of
  3,815,969,779,678 bytes (the nine root-level metadata files are listed without sizes); the
  directory file counts sum to 356,334, and adding the nine listed root-level metadata files
  gives 356,343, equal to the stated file count. (3) The FAIRhub healthsheet answers "No"
  to whether the dataset identifies demographic sub-populations, and the public release removes
  sex and race/ethnicity, while the README''s suggested-split table reports participant counts
  by race/ethnicity, sex and diabetes status; the subpopulation entries are taken from that
  table. (4) The Nature Metabolism comment carries a "Principal Investigators" roster whose
  text extraction interleaves it with the Writing Committee list, so person-role assignments
  are not taken from it; principal investigators are taken from the FAIRhub study description.
  (5) Target enrollment is stated differently across sources (4000 in the BMJ Open protocol
  and FAIRhub study description, 4,600 in the 2022 IRB protocol application); no target is
  recorded. (6) The sources state several absences that the record therefore leaves empty:
  no labels are provided; the dataset has not undergone formal external audits; no data protection
  impact analysis was conducted; the dataset has not been used for any tasks yet; there is
  no repository linking uses; no erratum is listed; there is no mechanism for others to extend
  the dataset; there are no limits on retention of the data; and the healthsheet states that
  the dataset does not contain data that might be considered confidential. (7) The documentation
  pages for v2.0.0 and v3.0.0 both state that the version "contains data from the participants
  of the pilot study phase", and the healthsheet composition answer refers to participants
  enrolled during the first year of data collection, while the healthsheet versioning answers,
  the FAIRhub description and the README state that v3.0.0 contains 2280 participants collected
  between July 19, 2023 and May 1, 2025; the record follows the latter, which the structured
  metadata states directly. (8) The FAIRhub landing page notes that a smaller version is available
  for pipeline development; that version is not described in the bundle and is not part of
  this record.'
