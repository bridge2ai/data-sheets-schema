  description: First release, including preliminary data from the pilot enrollment period.
- name: Version 2.0.0 release
  release_dates:
  - '2024-11-08'
  description: Second release, including data collected through 31 July 2024.
- name: Version 3.0.0 release
  release_dates:
  - '2025-11-17'
  description: Third release, distributed in November 2025.
maintainers:
- id: ROR:01yc7t268
  name: Washington University in St. Louis
  description: Managing organization of the dataset in the FAIRhub dataset metadata.
- name: AI-READI team
  maintainer_details: The AI-READI team supports and maintains the dataset, which is hosted
    on FAIRhub through Microsoft Azure. Questions, suggestions and feedback are directed to
    https://aireadi.org/contact.
updates:
  frequency: Approximately once a year (new static versions)
  update_details: The dataset is released as static versions and is not updated; new versions
    are released with additional data from participants enrolled since the previous release.
    Version 3.0.0 consists of data collected through the end of the second year of the study,
    between July 19, 2023 and May 1, 2025. The Nature Metabolism comment (November 2024) states
    that data are released annually, that each version is accessible through FAIRhub, and
    that each release makes two datasets available, a controlled-access set and a publicly
    accessible set with fewer requirements for access; the v3.0.0 documentation states that
    the full dataset will be accessible by entering into a data use agreement.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 1.0.0
  - 2.0.0
  - 3.0.0
  version_details: There is one version of the dataset documentation for each dataset version.
    Version 1.0.0 (DOI 10.60775/fairhub.1) contains data from 204 participants from the pilot
    data collection phase; version 2.0.0 (DOI 10.60775/fairhub.2) added data from 863 participants
    for a total of 1067 and is no longer accessible (its FAIRhub page listed 2.01 TB and 165,051
    files); version 3.0.0 (DOI 10.60775/fairhub.3) contains 2280 participants. The Snellen
    visual acuity variables were dropped in version 3.0.0, leaving only logMAR visual acuity
    measurements.
ethical_reviews:
- name: University of Washington IRB approval STUDY00016228
  reviewing_organization: Institutional Review Board of the University of Washington
  review_details: AI-READI was approved by the Institutional Review Board of the University
    of Washington (approval number STUDY00016228), including reliance agreements with the
    IRBs of the University of Alabama at Birmingham and the University of California, San
    Diego. The initial approval was received on December 20, 2022; an annual renewal application
    on the status and progress of the study is required.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - University of Washington IRB, approval number STUDY00016228
  description: The FAIRhub study description gives the human subject review status as "Submitted,
    approved" and lists ClinicalTrials.gov identifier NCT06002048.
  source_caveats: The BMJ Open abstract labels STUDY00016228 a "Clinicaltrials.org approval
    number"; its methods section and the FAIRhub metadata identify it as the University of
    Washington IRB approval number, and the FAIRhub study description lists NCT06002048 as
    the ClinicalTrials.gov identifier.
informed_consent:
- name: Informed consent of adult participants
  consent_obtained: true
  description: Written informed consent is provided by all participants.
  consent_type: Written documentation of consent for all research procedures, by electronic
    signature (e-consent) or in person
  consent_documentation: Potential participants could read all consent documentation electronically
    (e-consent in REDCap, accessed with a unique code) before their visit and give consent
    with an electronic signature, or consent in person at the start of the visit. For most
    participants, consent was performed remotely by computer, tablet or smartphone through
    a link in the invitation letter or email. The other clinical sites had IRB reliance and
    used the same consent form, with minor institution-specific language.
  consent_scope: The 2022 IRB protocol application states that consent for secondary use,
    banking and future sharing will be obtained, with the language included in the informed
    consent form.
  withdrawal_mechanism: Participants were permitted to withdraw consent at any time and cease
    study participation.
license_and_use_terms:
  id: doi:10.5281/zenodo.17555036
  name: Health Data License
  description: Custom license tailored to enable reuse of the AI-READI dataset (and other
    clinical datasets) for commercial or research purposes while putting strong requirements
    around data usage, security and secondary sharing to protect study participants. The licensor
    of the AI-READI Data License Agreement (Version 2.0) is Washington University in St. Louis.
  license_terms: The licensor grants the licensee a non-exclusive and non-transferable license
    to download, reproduce and use the data, and to create derivative works of the data, for
    research, commercial and non-commercial purposes. The licensee may use and store the data
    only on servers and devices within the licensee's institution/employer or on cloud or
    remote storage services that have a HIPAA-approved Business Associate Agreement with that
    institution/employer.
  data_use_permission:
  - disease_specific_research
  source_caveats: 'The license is named three ways in the bundle: "AI-READI custom license
    v2.0" (FAIRhub dataset metadata, with URI https://doi.org/10.5281/zenodo.17555036), "Health
    Data License" (FAIRhub landing page) and "AI-READI Data License Agreement (Version 2.0)"
    (the license document). The FAIRhub consent metadata state that the public version can
    only be used for type 2 diabetes related research and that a private version will allow
    more generic use.'
ip_restrictions:
  restrictions:
  - Title to the data, and all industrial and intellectual property rights therein, remain
    solely and exclusively with the licensor and its suppliers.
data_governance:
  description: 'The 2022 IRB protocol application planned two databases for data distribution:
    a de-identified one, publicly available, and a second with identifiable or sensitive information
    (genomic data and race/ethnicity) requiring a data use agreement and an approval process
    developed by the project committee.'
  access_review_process: 'Accessing the dataset requires several steps: logging in through
    a verified ID system, agreeing to use the data only for type 2 diabetes related research,
    and agreeing to the license terms, which set certain restrictions and obligations for
    data usage.'
  stewardship_roles:
  - Principal investigators and lead co-investigators at each participating institution, named
    in the 2022 IRB protocol application as those who will oversee and manage data sharing.
is_deidentified:
  identifiable_elements_present: false
  method: No active de-identification (FAIRhub de-identification type "NoDeIdentification")
  deidentification_details: No identifiers were collected so no active de-identification was
    necessary, but the data were checked to confirm that no identifiable data per US HIPAA
    were present. The data contain no protected health information (PHI).
  identifiers_removed: Information related to the sex and race/ethnicity of the participants
    as well as medication used has been removed.
  source_caveats: The sources disagree on the method. The Nature Metabolism comment (publication,
    tier 3; November 2024) states that the public set is stripped of PHI via the HIPAA Privacy
    Rule "Safe Harbor" method; the FAIRhub dataset metadata for v3.0.0 (structured metadata,
    tier 1) state that no identifiers were collected so no active de-identification was necessary.
    The record states the higher-ranked FAIRhub metadata. The BMJ Open protocol states that
    de-identified data are released.
