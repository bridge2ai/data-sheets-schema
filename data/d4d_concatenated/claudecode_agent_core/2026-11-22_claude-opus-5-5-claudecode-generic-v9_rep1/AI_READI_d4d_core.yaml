  source_caveats: The BMJ Open protocol dates the start of pilot enrollment to 18 July 2023;
    the FAIRhub metadata give 19 July 2023 as the start of data collection and the actual
    study start date. The two refer to enrollment and to data collection respectively and
    are recorded as stated.
- name: Formal data collection start
  start_date: '2023-12-01'
  timeframe_details: The formal data collection process began on 1 December 2023 (BMJ Open
    protocol).
- name: At-home monitoring period
  timeframe_details: Participants use the at-home monitoring devices continuously for 10 days
    after the study visit.
- name: Collection period for release 3.0.0
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: Period when the data in this version were collected (through the end
    of the second year of the study).
- name: Study status
  start_date: '2023-07-19'
  timeframe_details: The FAIRhub study description lists the overall status as "Enrolling
    by invitation", an actual start date of 2023-07-19 and an anticipated completion date
    of 2027-01-01.
