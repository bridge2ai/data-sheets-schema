sensitive_elements:
- name: Data held under controlled access
  sensitivity_details: The documentation states that the data held under controlled access
    include 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records,
    medications, and traffic and accident reports. The healthsheet states that the public
    dataset will not contain data considered sensitive, while the controlled access dataset
    will contain data on racial and ethnic origins, location (5-digit zip code) and motor
    vehicle accident reports.
  source_caveats: The documentation's list and the healthsheet's lists differ in which elements
    they name (the healthsheet summary omits medications); both are recorded as stated. Neither
    establishes which of these elements are present in this release.
acquisition_methods:
- name: Observed and self-reported data
  was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: 'Acquisition varied by domain: some data were directly observable (such
    as labs, vitals and retinal imaging), whereas other data were reported by subjects (for
    example survey responses). Verification of data entry was performed when possible, for
    example cross-referencing entered medications with medications physically brought in or
    photographed by each participant.'
collection_mechanisms:
- name: Self-reported questionnaires (REDCap)
  mechanism_details: Participants complete self-reporting surveys online after enrollment.
    REDCap is used for collecting patient-reported questionnaire data and the clinical data
    from the visit (medications assessment, vitals, visual acuity, contrast sensitivity, monofilament
    test results and CBC results).
- name: Anthropometric measurements
  mechanism_details: Height, weight, and waist and hip circumference are measured, followed
    by calculation of the waist-hip ratio and body mass index.
- name: Blood pressure and heart rate measurement
  mechanism_details: Measured with an automatic oscillometric, medically approved device.
    The blood pressure devices used across the sites are the OMRON HEM 907XL Blood Pressure
    Monitor, the Medline MDS4001 Automatic Digital Blood Pressure Monitor, and the Welch Allyn
    6000 series Vital signs monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff.
- name: 12-lead electrocardiogram (Philips PageWriter TC30)
  mechanism_details: A 12-lead ECG is performed with the Philips PageWriter TC30 Cardiograph.
- name: Monofilament test
  mechanism_details: Peripheral neuropathy is assessed with a standard 10 g monofilament applied
    to points on the plantar surface of both feet.
- name: Montreal Cognitive Assessment (MoCA)
  mechanism_details: Research staff administer the MoCA on an iPad using the MoCA Duo application.
- name: Electronic Visual Acuity tester (M&S Technologies)
  mechanism_details: Photopic and mesopic letter visual acuity are measured with the M&S Technologies
    EVA device at 4 meters.
- name: Mars Letter Contrast Sensitivity test (Mars Perceptrix)
  mechanism_details: Contrast sensitivity is tested monocularly under photopic and mesopic
    conditions.
- name: Topcon KR 800 autorefractor
  mechanism_details: Autorefraction data for each eye are obtained with the KR 800 Auto Keratometer/Refractor.
- name: Blood and urine collection for laboratory testing
  mechanism_details: Non-fasting blood and urine samples are collected during the visit. Laboratories
    local to each site perform complete blood count testing on fresh whole blood; all other
    tests are performed by the University of Washington Nutrition and Obesity Research Center
    (NORC) using stored, frozen samples.
- name: Environmental sensor (LeeLab Anura)
  mechanism_details: A custom-designed sensor unit, designed at the Karalis Johnson Retina
    Center, University of Washington, placed in the home for 10 continuous days; it measures
    temperature, humidity, light spectrometry, particulate matter (PM1.0, PM2.5, PM4.0, PM10.0),
    NOx and volatile organic compounds.
- name: Garmin Vivosmart 5 activity tracker
  mechanism_details: Wearable fitness tracker used for physical activity monitoring (heart
    rate, respiration rate, activity type, SpO2, stress level, sleep phases).
- name: Dexcom G6 continuous glucose monitor
  mechanism_details: Continuous glucose monitoring system worn for 10 days after the visit,
    recording blood glucose measurements (mg/dL) every 5 minutes.
- name: Optomed Aurora IQ fundus camera
  mechanism_details: Handheld, non-mydriatic fundus camera used for undilated color fundus
    photographs.
- name: iCare EIDON confocal fundus imaging system
  mechanism_details: Widefield TrueColor confocal fundus imaging system used for color fundus
    photographs, fundus autofluorescence and infrared images.
- name: Heidelberg Spectralis HRA+OCT
  mechanism_details: Ophthalmic imaging system combining optical coherence tomography (OCT)
    with retinal angiography; used for OCT, OCTA and infrared images.
- name: Topcon Maestro2 3D OCT-1
  mechanism_details: Robotic OCT and color fundus camera system manufactured by Topcon; used
    for OCT, OCTA and color fundus photographs.
- name: Topcon Triton DRI OCT
  mechanism_details: Swept-source OCT with multimodal fundus imaging, manufactured by Topcon;
    used for OCT, OCTA and color fundus photographs.
- name: Zeiss Cirrus 5000 Angioplex
  mechanism_details: High-definition OCT system manufactured by Zeiss; used for OCT, OCTA
    and infrared images.
- name: Heidelberg fluorescence lifetime imaging ophthalmoscopy (FLIO)
  mechanism_details: Fluorescence lifetime imaging ophthalmoscopy device manufactured by Heidelberg,
    performed as the last modality of the visit.
- name: Lensometry
  mechanism_details: 'Lensometer devices used across the sites: NIDEK LM-600P Auto Lensometer,
    Topcon CL-200 computerized Lensometer, and Topcon CL-300 computerized Lensometer.'
