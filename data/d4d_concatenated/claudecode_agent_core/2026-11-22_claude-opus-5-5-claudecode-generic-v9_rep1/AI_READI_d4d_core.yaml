purposes:
- name: AI/ML research into type 2 diabetes and salutogenesis
  response: The dataset was created to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM),
    including salutogenic pathways to return to health; the primary goal is to collect and
    publicly share a multimodal, AI-ready dataset for studying the pathogenesis and salutogenesis
    (the pathway from disease to health) of T2DM.
- name: Foundational dataset for a temporal atlas of T2DM
  response: The project's stated long-term objective is to develop a foundational dataset
    in diabetes, agnostic to existing classification criteria, which can be used to reconstruct
    a temporal atlas of T2DM development and reversal towards health (salutogenesis).
  source_caveats: Stated as the project's long-term objective in the NIH RePORTER abstract
    of grant OT2OD032644.
tasks:
- name: Pseudotime manifold analysis and AI applications
  response: The multimodal dataset is gathered to facilitate downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories by learning from multimodal
    data from participants with differing disease severity (normal to insulin-dependent T2DM),
    and various applications in artificial intelligence.
addressing_gaps:
- name: Lack of diverse, AI-ready data
  response: A key issue for AI-based approaches to T2DM is the lack of diverse data ready
    for training AI models; to address inherent limitations of many existing large datasets
    for AI/ML training, the cohort is designed to be balanced in race/ethnicity, T2DM severity
    and biological sex. The AI-READI dataset is intended to fill this gap.
- name: Lack of racial and ethnic diversity in prior T2DM studies
  response: The BMJ Open protocol cites a meta-epidemiological review of T2DM studies published
    from 2000 to 2020 indicating that samples lacked racial and ethnic diversity, and describes
    AI-READI as a step toward addressing these demographic inequities in research.
- name: Lack of large multimodal datasets
  response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, and large multimodal
    datasets.
