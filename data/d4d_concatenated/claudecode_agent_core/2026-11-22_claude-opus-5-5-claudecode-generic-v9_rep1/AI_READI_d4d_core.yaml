missing_data_documentation:
- name: Marijuana use not assessed in Alabama
  missing_data_causes: Marijuana use was not assessed for participants living in Alabama because
    it is an illegal substance there.
- name: Modalities missing for some participants
  missing_data_patterns: Not all modalities are available for all participants.
  missing_data_causes: Some participants elected not to participate in some study elements;
    in a few cases the data collection device had no stored results or was returned too late
    to retrieve results (for example the battery died or data were lost); in a few cases a
    data collision may have occurred and data were lost.
raw_data_sources:
- source_description: Electrocardiogram device exports, exported in their raw format to local
    storage.
  raw_data_format: .xml
- source_description: MoCA Duo application exports (total score, section subscores, Memory
    Index Score and task completion times).
  raw_data_format: .csv
- source_description: Blood and urine testing results from the UW NORC laboratory, provided
    in .csv format.
  raw_data_format: .csv
- source_description: Medical records, named in the 2022 IRB protocol application as a planned
    source of study data alongside data obtained from participants, devices and specimens.
  source_caveats: Stated in the IRB protocol application as a plan; the v3.0.0 documentation
    lists past health records among the data held under controlled access.
- source_description: Driving and accident records, named in the 2022 IRB protocol application
    as to be obtained from the Department of Licensing.
  source_caveats: Stated in the IRB protocol application as a plan; the v3.0.0 documentation
    lists traffic and accident reports among the data held under controlled access.
sampling_strategies:
- name: Triple-balanced recruitment
  description: 'Eligibility: inclusion of adults 40 years or older, with or without type 2
    diabetes, able to provide consent and to speak and read English; exclusion of pregnancy,
    gestational diabetes, type 1 diabetes, and (per the FAIRhub study description) adults
    older than 85 years.'
  strategies: The study recruits in equal proportions four race/ethnic groups (Asian, Black,
    white, Hispanic), four categories of T2DM (no diabetes, prediabetes/lifestyle-controlled
    diabetes, diabetes treated with oral medications or non-insulin injectable medications,
    and insulin-controlled diabetes) and biological males and females, with recruitment sampling
    aimed at an approximately equal distribution across diabetes severity. The IRB protocol
    application describes UAB selecting a stratified sample of potential participants from
    the combined site lists, recursively, to balance race/ethnicity, sex and diabetes severity,
    with race and ethnicity information to be self-reported at screening and enrollment.
  source_data: The study base is all patients aged 40 years or older who had a medical encounter
    within each health system site (UAB, UCSD, UW) between 2020 and 2025; recruitment pools
    were identified by screening electronic health records for diabetes and prediabetes ICD-10
    codes for patients with an encounter in the past 2 years.
  is_random: false
  source_caveats: The FAIRhub study description gives the sampling method as "Non-Probability
    Sample".
raw_sources:
- name: Retained raw data
  raw_data_details: The raw data are saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but are not anticipated to be shared outside
    the project team, because they have not been mapped to standardized terminologies and
    may accidentally include personal health information or personally identifiable information.
    Raw data may be included in future releases of the controlled access dataset.
preprocessing_strategies:
- name: Conversion of imaging data to DICOM
  description: Participant images are exported from imaging devices in their raw format, and
    some images required conversion to DICOM before upload.
  preprocessing_details: Some devices' exports (.fda and .sdt files) were converted to DICOM
    for the dataset.
- name: Mapping to data standards
  description: All data are mapped to standardized terminologies when possible, such as the
    OMOP Common Data Model for clinical data and DICOM for retinal imaging.
- name: Transformation of proprietary device data
  description: For some devices, the data are transformed from their proprietary state into
    a standard model format before upload to FAIRhub.
- name: Conversion of activity tracker data to Open mHealth
  description: Activity tracker data were exported in .FIT file format and converted to the
    mHealth standard for the dataset.
cleaning_strategies:
- name: Data-entry quality control
  description: The Data Manager at each data site is responsible for the quality control of
    all data before upload to FAIRhub.
  cleaning_details: Clinical data outside expected minimum/maximum ranges were flagged in
    REDCap and reviewed by clinical research coordinators and Data Managers; data were checked
    for credibility (range checks), incorrect flow through skip patterns, missing data that
    could be filled from other portions of a record, and omission or duplication of records.
    Editing was done only under the guidance and approval of the site PI.
- name: Internal review
  description: The dataset has been reviewed internally by AI-READI team members for quality
    checks and to ensure that no personally identifiable information was accidentally included.
future_use_impacts:
- name: Theoretical re-identification risk
  impact_details: The creators do not currently anticipate uses of the dataset that could
    result in unfair treatment or harm; however, there is a theoretical risk of future re-identification.
prohibited_uses:
- name: Clinical treatment decisions
  description: Licensees shall not make clinical treatment decisions based on the data.
  prohibition_reason: The data are intended solely as a research resource.
- name: Re-identification of data subjects
  description: Licensees shall not use the data, alone or with other information, to compromise
    the confidentiality or privacy of any data subject, to attempt to identify or contact
    any data subject or group of data subjects, or to extract or extrapolate identifying information
    about a data subject.
- name: Sharing with third-party model vendors for training
  description: Licensees shall not share or distribute data with any third-party model vendor
    or developer for training or development purposes, where training includes model weight
    modification.
- name: Reproduction in publications
  description: Data may not be reproduced in papers, presentations or other publications,
    except small representative samples in up to five images or figures per paper for illustrative
    purposes.
- name: Transfer to non-licensees
  description: Licensees shall not transfer, license, sell, share or otherwise convey any
    portion of the data or any derivative work to any third party other than another licensee
    bound by identical terms.
distribution_formats:
- name: DICOM
  media_type: application/dicom
- name: Markdown
  media_type: text/markdown
- name: CSV
  media_type: text/csv
- name: JSON
  media_type: application/json
