  description:
    receipts:
    - chunk: c002
      snippet: Data are collected in a multivariable protocol containing over 10 domains,
        including vitals, retinal imaging, electrocardiogram, cognitive function,
        continuous glucose monitoring, physical activity, home air quality, blood
        and urine collection for laboratory testing and psychosocial variables including
        social determinants of health.
    - chunk: c011
      snippet: The AI-READI is a dataset consisting of data collected from individuals
        with and without Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data
        collection sites.
    - chunk: c014
      snippet: The AI-READI project seeks to create and share a flagship ethically-sourced
        dataset of type 2 diabetes.
    - chunk: c015
      snippet: Data from multiple modalities are included. The data in this dataset
        contain no protected health information (PHI). Information related to the
        sex and race/ethnicity of the participants as well as medication used has
        also been removed.
    - chunk: c018
      snippet: Multiple modalities of data are collected for each participant, including
        survey data, clinical data, retinal imaging data, environmental sensor data,
        continuous glucose monitor data, and wearable activity monitor data. These
        encompass tabular data, imaging data, and physiological signal/waveform data.
        There is no unstructured text data included in this dataset.
    - chunk: c019
      snippet: Briefly, data is organized at the root level into one directory per
        datatype (c.f. Table below). Within each datatype folder, there is one folder
        per modality. Within each modality folder, there is one folder per device
        used to collect that modality. Within each device folder, there is one folder
        per participant.
    - chunk: c019
      snippet: '"studyType": "Observational", "isPatientRegistry": "No", "designInfo":
        { "designObservationalModelList": [ "Cohort" ], "designTimePerspectiveList":
        [ "Cross-sectional" ]'
    core_path: description
