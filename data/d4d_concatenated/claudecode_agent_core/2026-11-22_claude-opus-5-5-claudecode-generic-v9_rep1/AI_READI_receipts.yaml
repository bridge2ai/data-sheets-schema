slots:
  acquisition_methods[0]:
    receipts:
    - chunk: c019
      snippet: The acquisition of data varied based on the domain; some data were
        directly observable (such as labs, vitals, and retinal imaging), whereas other
        data were reported by subjects (e.g. survey responses).
    core_path: acquisition_methods[0]
  acquisition_methods[0].was_validated_verified:
    receipts:
    - chunk: c019
      snippet: Verification of data entry was performed when possible (e.g. cross-referencing
        entered medications with medications that were physically brought in or photographed
        by each study participant).
    core_path: acquisition_methods[0].was_validated_verified
  addressing_gaps[0]:
    receipts:
    - chunk: c002
      snippet: to address inherent limitations of many existing large data sets for
        AI/ML training, the cohort is designed to be balanced in race/ethnicity, T2DM
        severity and biological sex
    - chunk: c007
      snippet: a major barrier has been the lack of diverse datasets that are AI ready1
        for training AI models, which the AI-READI project is designed to address.
    - chunk: c018
      snippet: a key issue is the lack of data ready for training AI models. The AI-READI
        dataset is intended to fill this gap.
    core_path: addressing_gaps[0]
  addressing_gaps[1]:
    receipts:
    - chunk: c005
      snippet: A meta- epidemiological review of T2DM studies published from 2000
        to 2020 indicated that samples lacked racial and ethnic diversity,17 thus
        making AI- READI an important step forward in addressing these demographic
        inequities in research.
    core_path: addressing_gaps[1]
  addressing_gaps[2]:
    receipts:
    - chunk: c009
      snippet: The ability to understand and affect the course of complex, multi-organ
        diseases such as T2DM has been limited by a lack of well-designed, high quality,
        and large multimodal datasets.
    core_path: addressing_gaps[2]
  anomalies[0]:
    receipts:
    - chunk: c018
      snippet: In cases of survey data, skipped questions or incomplete responses
        are expected.
    core_path: anomalies[0]
  anomalies[1]:
    receipts:
    - chunk: c018
      snippet: In cases of using wearables, improper use, technical failure such as
        battery failure or system malfunction are expected.
    core_path: anomalies[1]
  anomalies[2]:
    receipts:
    - chunk: c018
      snippet: In cases of imaging data, patient uncooperation, noise that may obscure
        the images and technical failure such as system malfunction, and data transfer
        failures are expected.
    core_path: anomalies[2]
  anomalies[3]:
    receipts:
    - chunk: c018
      snippet: As it becomes challenging to get a good view because of the patients
        not being dilated and the handheld nature of this imaging modality, the quality
        of the images vary from patient to patient and within the same patient.
    core_path: anomalies[3]
  anomalies[4]:
    receipts:
    - chunk: c018
      snippet: As the machine is operated by the imaging team and is not fully automated,
        quality issues may arise, which may lead to skipping this modality and missing
        data.
    core_path: anomalies[4]
  anomalies[5]:
    receipts:
    - chunk: c018
      snippet: as it takes longer than a usual spectralis OCT and exposes patients
        to uncomfortable levels of light, it is kept to be performed as the last modality
        of an AI READI visit. Because of this patients may not be at their best possible
        compliance.
    core_path: anomalies[5]
  cleaning_strategies[0]:
    receipts:
    - chunk: c004
      snippet: The Data Manager at each data site is responsible for the quality control
        of all data before uploading to FAIRhub.
    core_path: cleaning_strategies[0]
  cleaning_strategies[0].cleaning_details:
    receipts:
    - chunk: c018
      snippet: clinical data outside of expected min/max ranges were flagged in REDCap,
        which was visible in reports viewed by clinical research coordinators (CRCs)
        and Data Managers.
    - chunk: c018
      snippet: Editing was only done under the guidance and approval of the site PI.
    core_path: cleaning_strategies[0].cleaning_details
  cleaning_strategies[1]:
    receipts:
    - chunk: c018
      snippet: The dataset has not undergone any formal external audits. However,
        the dataset has been reviewed internally by AI-READI team members for quality
        checks and to ensure that no personally identifiable information was accidentally
        included.
    core_path: cleaning_strategies[1]
  collection_mechanisms[0]:
    receipts:
    - chunk: c002
      snippet: Once enrolled, participants are presented with questionnaires for online
        completion.
    core_path: collection_mechanisms[0]
  collection_mechanisms[0].mechanism_details:
    receipts:
    - chunk: c004
      snippet: 'REDCap is used for collecting patient- reported data from questionnaires
        and the following clinical data from the visit: medications assessment, vitals,
        visual acuity, contrast sensitivity, monofilament test results and CBC test
        results.'
    - chunk: c007
      snippet: Self-reporting surveys
    core_path: collection_mechanisms[0].mechanism_details
  collection_mechanisms[10]:
