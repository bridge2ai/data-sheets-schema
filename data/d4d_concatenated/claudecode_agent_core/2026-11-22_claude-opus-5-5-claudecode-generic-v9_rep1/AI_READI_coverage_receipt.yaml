    snippet: "Custom designed, Karalis Johnson Retina Center, University of Washington (Seattle, Washington)"
  - slot: known_limitations[0]
    snippet: "Requiring that eligible participants speak, read and under- stand English may have created challenges in recruiting Hispanic and/or Asian persons."
  - slot: addressing_gaps[1]
    snippet: "A meta- epidemiological review of T2DM studies published from 2000 to 2020 indicated that samples lacked racial and ethnic diversity,17 thus making AI- READI an important step forward in addressing these demographic inequities in research."
  - slot: funders[0]
    snippet: "AI- READI is an NIH Common Fund Bridge2AI- supported data collection effort"
  - slot: funders[0].grants[0]
    snippet: "This research is supported by National Institutes of Health grants OT2OD032644"
