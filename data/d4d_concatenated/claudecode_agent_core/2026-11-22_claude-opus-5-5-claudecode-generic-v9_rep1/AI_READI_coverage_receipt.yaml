chunks:
- id: c001
  status: nothing_relevant
  reason: "Concatenation preamble and table of contents listing the ten source files; carries no fact about the dataset."
- id: c002
  status: extracted
  extracted:
  - slot: purposes[0]
    snippet: "is a data collection project on type 2 diabetes mellitus (T2DM) to facilitate the widespread use of artificial intelligence and machine learning (AI/ML) approaches to study salutogenesis"
  - slot: description
    snippet: "Data are collected in a multivariable protocol containing over 10 domains, including vitals, retinal imaging, electrocardiogram, cognitive function, continuous glucose monitoring, physical activity, home air quality, blood and urine collection for laboratory testing and psychosocial variables including social determinants of health."
  - slot: addressing_gaps[0]
    snippet: "to address inherent limitations of many existing large data sets for AI/ML training, the cohort is designed to be balanced in race/ethnicity, T2DM severity and biological sex"
  - slot: funders[0]
    snippet: "four National Institutes of Health- funded Bridge2AI"
  - slot: ethical_reviews[0]
    snippet: "AI- READI was approved by the Institutional Review Board (IRB) of the University of Washington (approval number STUDY00016228), including reliance agreements with the IRBs of University of Alabama at Birmingham and University of California, San Diego."
  - slot: human_subject_research.irb_approval
    snippet: "approved by the Institutional Review Board (IRB) of the University of Washington (approval number STUDY00016228)"
  - slot: informed_consent[0]
    snippet: "Written informed consent is provided by all participants."
  - slot: informed_consent[0].consent_documentation
    snippet: "For most participants, informed consent is performed remotely by computer, tablet or smart phone through a link in the hardcopy invitation letter or the invitation email which directed them into our REDCap database."
  - slot: sampling_strategies[0]
    snippet: "the study is triple- balanced by recruiting the following populations in equal proportions: four race/ethnic groups (Asian, black, white, Hispanic), four categories of T2DM"
  - slot: sampling_strategies[0].source_data
    snippet: "The study base is all patients aged ≥40 years of age who had a medical encounter within each health system site (UAB, UCSD, UW) between 2020 and 2025."
  - slot: sampling_strategies[0].description
    snippet: "Participants are required to speak, read and understand English. Pregnancy and type 1 diabetes are exclusionary for participation."
  - slot: data_collectors[0]
    snippet: "Birmingham, Alabama (University of Alabama at Birmingham (UAB))"
  - slot: data_collectors[1]
    snippet: "San Diego, California (University of California, San Diego (UCSD))"
  - slot: data_collectors[2]
    snippet: "Seattle, Washington (University of Washington (UW))"
  - slot: known_biases[0]
    snippet: "Participants are volunteers; therefore, there is selection bias known as volunteer bias which may limit the generalisability of the results among those who are not represented in the study population."
  - slot: collection_timeframes[0]
    snippet: "Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023"
  - slot: collection_timeframes[1]
    snippet: "The formal data collection process began on 1 December 2023."
  - slot: distribution_dates[0]
    snippet: "Preliminary data from the pilot enrollment period were included in the first released data set released in May 2024."
  - slot: collection_mechanisms[0]
    snippet: "Once enrolled, participants are presented with questionnaires for online completion."
  - slot: collection_mechanisms[1]
    snippet: "Height, weight and waist and hip circumference are measured, followed by calculation of the waist- hip ratio and body mass index."
  - slot: external_resources[0]
    snippet: "Insights (AI- READI). BMJ Open 2025;15:e097449. doi:10.1136/ bmjopen-2024-097449"
- id: c003
  status: extracted
  extracted:
  - slot: collection_mechanisms[2]
    snippet: "an automatic oscillometric, medically approved device."
  - slot: collection_mechanisms[3]
    snippet: "A 12- lead ECG is performed (Philips Pagewriter TC30 Cardiograph, Amsterdam, The Netherlands)"
  - slot: collection_mechanisms[4]
    snippet: "Peripheral neuropathy is performed using the monofilament test11 assessing touch perception on both feet"
  - slot: collection_mechanisms[5]
    snippet: "A general cognitive screener is carried out using the Montreal Cognitive Assessment12 (MoCA), administered electronically on an iPad using the MoCA Duo Application"
  - slot: collection_mechanisms[6]
    snippet: "Photopic letter visual acuity is measured with the Electronic Visual Acuity tester13 (M&S Technology, Niles, Illinois)"
  - slot: collection_mechanisms[7]
    snippet: "Photopic letter contrast sensitivity is measured with the Mars chart (Mars Perceptrix, Chap- paqua, New York)"
  - slot: collection_mechanisms[8]
    snippet: "Autore- fraction data for each eye are obtained (spherical and cylindrical components expressed as diopter with cylin- drical axis) using the autorefractor’s standard protocol (Topcon KR 800, Topcon Healthcare, Oakland, New Jersey)."
  - slot: collection_mechanisms[9]
    snippet: "Blood (non- fasting) and urine samples are collected from participants during the visit."
  - slot: collection_mechanisms[9].mechanism_details
    snippet: "perform complete blood count (CBC) testing on fresh whole blood samples; all other lab tests are performed by the University of Washington Nutrition and Obesity Research Center (NORC) testing facility using stored, frozen samples."
  - slot: missing_data_documentation[0]
    snippet: "*Marijuana use not assessed for participants living in Alabama because it is an illegal substance."
- id: c004
  status: extracted
  extracted:
  - slot: preprocessing_strategies[0]
    snippet: "All participant images are exported from imaging devices in their raw format and some images required conver- sion to a DICOM standard format prior to upload to an external AI- READI data storage site"
  - slot: collection_mechanisms[10]
    snippet: "participants are sent home with three data monitoring devices as listed in table 4: (1) home environmental sensor"
  - slot: collection_mechanisms[11]
    snippet: "(2) Garmin fitness tracker"
  - slot: collection_mechanisms[12]
    snippet: "(3) Dexcom Continuous Glucose Monitor (CGM)"
  - slot: collection_timeframes[2]
    snippet: "Coordinators provide instructions on how to use these monitoring devices continuously for 10 days."
  - slot: participant_privacy[0]
    snippet: "The envi- ronmental sensor and the Garmin fitness tracker were specifically chosen with participant privacy as a primary concern. These devices do not capture video or audio, are not equipped with GPS location monitoring and are not synced with participant- owned devices."
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "REDCap is used for collecting patient- reported data from questionnaires and the following clinical data from the visit: medications assessment, vitals, visual acuity, contrast sensitivity, monofilament test results and CBC test results."
  - slot: raw_data_sources[0]
    snippet: "Data from the following devices are exported in their raw"
  - slot: raw_data_sources[0].raw_data_format
    snippet: "format to local storage: ECG (.xml)"
  - slot: raw_data_sources[1]
    snippet: "MoCA Duo applica- tion (total score, section subscores, Memory Index Score and task completion times; .csv)"
  - slot: raw_data_sources[2]
    snippet: "Blood and urine testing by the NORC lab is provided in .csv format."
  - slot: preprocessing_strategies[1]
    snippet: "All data are mapped to applicable data standard formats, such as the Observational Medical Outcomes Partnership Common Data Model for clinical data and the DICOM format for retinal imaging."
  - slot: publisher
    snippet: "called FAIRhub (https://fairhub.io/), a Microsoft Azure cloud- based platform developed for this project."
  - slot: preprocessing_strategies[2]
    snippet: "For some devices, the data are transformed from its proprietary state into a standard model format prior to upload to FAIRhub"
  - slot: cleaning_strategies[0]
    snippet: "The Data Manager at each data site is responsible for the quality control of all data before uploading to FAIRhub."
  - slot: updates.frequency
    snippet: "Deidentified data are released approximately yearly in two data sets: a controlled access set and publicly accessible set with fewer requirements for access."
  - slot: distribution_dates[0]
    snippet: "The publicly accessible data set from pilot data collection was made available in May 2024."
  - slot: distribution_dates[1]
    snippet: "All data collected through 31 July 2024 were made available in November 2024."
  - slot: external_resources[1]
    snippet: "More details about the AI- readiness of the data set are provided in the data set documentation (https://docs. aireadi.org/)."
