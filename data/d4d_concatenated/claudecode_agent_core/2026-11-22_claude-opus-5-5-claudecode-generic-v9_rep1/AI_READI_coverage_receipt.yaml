  - slot: cleaning_strategies[1]
    snippet: "The dataset has not undergone any formal external audits. However, the dataset has been reviewed internally by AI-READI team members for quality checks and to ensure that no personally identifiable information was accidentally included."
  - slot: updates.update_details
    snippet: "The dataset gets released as static versions. This is the third version of the dataset and consists of data collected up through the end of the second year of the study, i.e. between July 19, 2023 and May 1st, 2025."
  - slot: updates.frequency
    snippet: "There are plans to release new versions of the dataset approximately once a year with additional data from participants who have been enrolled since the last dataset version release."
  - slot: version_access.version_details
    snippet: "the first version of the dataset contains data from 204 participants, the second version contains additional data from 863 participants for a total of 1067 participants, and this version contains a total of 2280 participants"
  - slot: version_access.version_details
    snippet: "the Snellen visual acuity variables were dropped in this version of the dataset, such that now only logMAR visual acuity measurements are available."
  - slot: splits[0]
    snippet: "It does include a new recommended data split for the 2280 participants balancing training, validation, and testing sets for age, sex, races/ethnicities, and study group."
  - slot: purposes[0]
    snippet: "The purpose for creating the dataset was to enable future generations of artificial intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways to return to health."
  - slot: addressing_gaps[0]
    snippet: "a key issue is the lack of data ready for training AI models. The AI-READI dataset is intended to fill this gap."
  - slot: tasks[0]
    snippet: "The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime manifolds and various applications in artificial intelligence."
  - slot: created_by
    snippet: "This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI Consortium."
  - slot: funders[0]
    snippet: "The creation of the dataset was funded by the National Institutes of Health (NIH) through their Bridge2AI Program"
  - slot: funders[0].source_caveats
    snippet: "The grant number is OT2ODO32644"
  - slot: funders[0].description
    snippet: "Note that the funding institution is not creating or managing the dataset. The dataset is created and managed by the awardees of the grant"
  - slot: instances[0]
    snippet: "Each instance represents an individual patient."
  - slot: instances[0].counts
    snippet: "There are 2280 instances in this current version of the dataset (version 3, released fall 2025)."
  - slot: description
    snippet: "Multiple modalities of data are collected for each participant, including survey data, clinical data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable activity monitor data. These encompass tabular data, imaging data, and physiological signal/waveform data. There is no unstructured text data included in this dataset."
  - slot: missing_data_documentation[1]
    snippet: "Yes, not all modalities are available for all participants. Some participants elected not to participate in some study elements. In a few cases, the data collection device did not have any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost). In a few cases, there may have been a data collision at some point in the process and data has been lost."
  - slot: relationships[0]
    snippet: "Yes - all instances are part of the same prospective data generation project (AI-READI). There is currently only one visit per participant."
  - slot: anomalies[0]
    snippet: "In cases of survey data, skipped questions or incomplete responses are expected."
  - slot: anomalies[1]
    snippet: "In cases of using wearables, improper use, technical failure such as battery failure or system malfunction are expected."
  - slot: anomalies[2]
    snippet: "In cases of imaging data, patient uncooperation, noise that may obscure the images and technical failure such as system malfunction, and data transfer failures are expected."
  - slot: external_resources[1].description
    snippet: "The dataset is self-contained but does rely on the dataset documentation for users requiring additional information about the provenance of the dataset. The documentation is available at https://docs.aireadi.org. The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated with its use."
  - slot: is_deidentified.identifiable_elements_present
    snippet: "No personally identifiable information is included in the dataset."
  - slot: sensitive_elements[0]
    snippet: "No, the public dataset will not contain data that is considered sensitive. However, the controlled access dataset will contain data regarding racial and ethnic origins, location (5-digit zip code), as well as motor vehicle accident reports."
  - slot: collection_mechanisms[10]
    snippet: "Participants will be sent home with an environmental sensor (a custom-designed sensor unit called the LeeLab Anura), which they will use for 10 continuous days"
  - slot: collection_mechanisms[12].mechanism_details
    snippet: "The Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM) that directly monitors blood glucose levels without requiring finger sticks."
  - slot: collection_mechanisms[11]
    snippet: "The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure data related to physical activity."
  - slot: collection_mechanisms[2].mechanism_details
    snippet: "Blood pressure devices used for the study across the various data acquisition sites are: OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series Vital signs monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff."
  - slot: collection_mechanisms[6].mechanism_details
    snippet: "M&S Technologies EVA device to test visual acuity. The test is administered at a distance of 4 meters from a touch-screen monitor that is 12x20 inches."
  - slot: collection_mechanisms[7].mechanism_details
    snippet: "The MARS Letter Contrast Sensitivity test (Perceptrix) was conducted monocularly under both Photopic conditions (with a general occluder) and Mesopic conditions (using a Neutral Density occluder with a low luminance filter lens)."
  - slot: collection_mechanisms[8].mechanism_details
    snippet: "KR 800 Auto Keratometer/Refractor."
  - slot: collection_mechanisms[3].mechanism_details
    snippet: "Philips (manufacturer of Pagewriter TC30 Cardiograph)"
  - slot: collection_mechanisms[20]
    snippet: "Lensometer devices used at data acquisition sites across the study include: NIDEK LM-600P Auto Lensometer, Topcon-CL-200 computerized Lensometer, and Topcon-CL-300 computerized Lensometer"
  - slot: collection_mechanisms[13].mechanism_details
    snippet: "The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the ocular fundus."
  - slot: anomalies[3]
    snippet: "As it becomes challenging to get a good view because of the patients not being dilated and the handheld nature of this imaging modality, the quality of the images vary from patient to patient and within the same patient."
  - slot: collection_mechanisms[14]
    snippet: "The iCare EIDON is a widefield TrueColor confocal fundus imaging system that can capture images up to 200°."
  - slot: collection_mechanisms[15]
    snippet: "The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that combines optical coherence tomography (OCT) with retinal angiography."
  - slot: anomalies[4]
    snippet: "As the machine is operated by the imaging team and is not fully automated, quality issues may arise, which may lead to skipping this modality and missing data."
  - slot: collection_mechanisms[17]
    snippet: "The DRI OCT Triton is a device from Topcon Healthcare that combines swept-source OCT technology with multimodal fundus imaging."
  - slot: collection_mechanisms[16]
    snippet: "The Maestro2 is a robotic OCT and color fundus camera system from Topcon Healthcare."
  - slot: collection_mechanisms[19]
    snippet: "Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) is an advanced imaging technique used in ophthalmology."
  - slot: anomalies[5]
    snippet: "as it takes longer than a usual spectralis OCT and exposes patients to uncomfortable levels of light, it is kept to be performed as the last modality of an AI READI visit. Because of this patients may not be at their best possible compliance."
  - slot: collection_mechanisms[18]
    snippet: "The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence tomography (OCT) system that offers non-invasive imaging of retinal microvasculature."
  - slot: collection_mechanisms[4].mechanism_details
    snippet: "It is done using a standard 10g monofilament applying pressure to different points on the plantar surface of the feet."
  - slot: collection_mechanisms[5].mechanism_details
    snippet: "AI READI research staff perform this test on an iPad using a pre-installed software (MoCA Duo app downloaded from the app store) that captures all the patients responses in an interactive manner."
  - slot: known_limitations[1]
    snippet: "While the AI-READI's cross-sectional database ultimately aims to achieve balance across race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is not balanced across these parameters."
  - slot: known_limitations[2]
    snippet: "Factors influencing the generalization of derived models include the predominantly urban and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds."
  - slot: known_limitations[3]
    snippet: "The study cohort may not provide a comprehensive representation of the population, as it does not include other races/ethnicities such as Pacific Islanders and Native Americans."
  - slot: splits[0].description
    snippet: "We are suggesting a split for training/validation/testing models that is aimed at reducing disparities in models developed using this dataset."
  - slot: cleaning_strategies[0].cleaning_details
    snippet: "clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in reports viewed by clinical research coordinators (CRCs) and Data Managers."
  - slot: cleaning_strategies[0].cleaning_details
    snippet: "Editing was only done under the guidance and approval of the site PI."
  - slot: preprocessing_strategies[1]
    snippet: "all data were mapped to standardized terminologies when possible, such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model, a common data model for observational health data, and the Digital Imaging and Communications in Medicine (DICOM), a commonly used standard for medical imaging data."
  - slot: raw_sources[0]
    snippet: "The raw data is saved and expected to be preserved by the AI-READI project at least for the duration of the project but is not anticipated to be shared outside the project team right now, because it has not been mapped to standardized terminologies and because the raw data may accidentally include personal health information or personally identifiable information (e.g. in free text fields)."
  - slot: raw_sources[0].raw_data_details
    snippet: "The raw data is saved and expected to be preserved by the AI-READI project at least for the duration of the project"
  - slot: raw_sources[0].raw_data_details
    snippet: "There is a possibility that raw data may be included in future releases of the controlled access dataset."
  - slot: sampling_strategies[0].description
    snippet: "Inclusion Criteria:\\n\\n - Able to provide consent\\n - ≥ 40 years old\\n - Persons with or without type 2 diabetes\\n - Must speak and read English\\n\\n Exclusion Criteria:\\n\\n - Must not be pregnant\\n - Must not have gestational diabetes\\n - Must not have Type 1 diabetes"
