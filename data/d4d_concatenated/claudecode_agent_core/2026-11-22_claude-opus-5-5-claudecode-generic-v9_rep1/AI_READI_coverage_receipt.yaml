    snippet: "Dexcom G6 Continuous Glucose Monitor Blood glucose measurements (mg/dL) every 5 min"
  - slot: collection_mechanisms[11].mechanism_details
    snippet: "Garmin VivoSmart 5 Physical Activity Monitor"
  - slot: preprocessing_strategies[3]
    snippet: "Exported in .FIT file format; converted to mHealth standard for the data set"
