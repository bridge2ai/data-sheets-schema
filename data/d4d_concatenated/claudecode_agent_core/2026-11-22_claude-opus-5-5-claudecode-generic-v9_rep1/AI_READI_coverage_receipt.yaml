- id: c007
  status: extracted
  extracted:
  - slot: purposes[0]
    snippet: "The primary goal of AI-READI is to collect and publicly share a multimodal, AI-ready dataset for studying the pathogenesis and salutogenesis (that is, the pathway from disease to health) of type 2 diabetes mellitus (T2DM)."
  - slot: addressing_gaps[0]
    snippet: "a major barrier has been the lack of diverse datasets that are AI ready1 for training AI models, which the AI-READI project is designed to address."
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "Self-reporting surveys"
  - slot: collection_mechanisms[12]
    snippet: "post-visit data collection for 10 days using a Dexcom G6 for continuous glucose monitoring"
  - slot: collection_mechanisms[11]
    snippet: "Garmin Vivosmart 5 for physical activity monitoring"
  - slot: collection_mechanisms[11].mechanism_details
    snippet: "Physical activity monitoring (heart rate, respiration rate, activity type, SpO2, stress level, sleep phases)"
  - slot: collection_mechanisms[10]
    snippet: "a custom-built environmental sensor for indoor environmental parameter measurements"
  - slot: collection_mechanisms[10].mechanism_details
    snippet: "Environmental measurements (temperature, humidity, light spectrometry, PM1.0, PM2.5, PM4.0, PM10.0, NOx, volatile organic compounds)"
  - slot: updates.update_details
    snippet: "Data are released annually, and each version is accessible through FAIRhub. At each release, two datasets are made available: a controlled-access set and a publicly accessible set with fewer requirements for access."
  - slot: updates.update_details
    snippet: "Data are released annually, and each version is accessible through FAIRhub."
  - slot: is_deidentified.source_caveats
    snippet: "The public set is stripped of Protected Health Information (PHI), as defined by the HIPAA (Health Insurance Portability and Accountability Act) Privacy Rule via the “Safe Harbor” method, as well as information related to the sex and race/ethnicity of the participants to prevent stigmatization of findings."
  - slot: participant_privacy[1]
    snippet: "To prevent reidentifi- cation attempts, we are implementing a robust data dissemination system, a strict licence agreement and data watermarking for both public and controlled sets."
  - slot: external_resources[2]
    snippet: "AI-READI: rethinking AI data collection, preparation and sharing in diabetes research and beyond https://doi.org/10.1038/s42255-024-01165-x"
  - slot: funders[0].source_caveats
    snippet: "This work was supported by the US National Institutes of Health (NIH) through grants OT2OD032644 and P30 DK035816."
- id: c008
  status: nothing_relevant
  reason: "Continuation of the Nature Metabolism comment's author roster (staff, project managers, interns, NIH program scientists), the paper's affiliation key and its correspondence address; these describe the paper's authorship, and the extracted roster interleaves names and affiliation numbers, so no dataset role is attested."
- id: c009
  status: extracted
  extracted:
  - slot: funders[0].grants[0].grant_number
    snippet: "Core project number: OT2OD032644"
  - slot: funders[0].grants[0].name
    snippet: "Title: Bridge2AI: Salutogenesis Data Generation Project"
  - slot: funders[0].grants[0].description
    snippet: "Project number: 1OT2OD032644-01"
  - slot: creators[0].principal_investigator
    snippet: "Principal investigator: LEE, AARON Organization: UNIVERSITY OF WASHINGTON"
  - slot: addressing_gaps[2]
    snippet: "The ability to understand and affect the course of complex, multi-organ diseases such as T2DM has been limited by a lack of well-designed, high quality, and large multimodal datasets."
  - slot: tasks[0]
    snippet: "Data collection will be specifically designed to permit downstream pseudotime manifold analysis, an approach used to predict disease trajectories by collecting and learning from complex, multimodal data from participants with differing disease severity (normal to insulin-dependent T2DM)."
  - slot: purposes[1]
    snippet: "The long-term objective for this project is to develop a foundational dataset in diabetes, agnostic to existing classification criteria, which can be used to reconstruct a temporal atlas of T2DM development and reversal towards health (i.e., salutogenesis)."
