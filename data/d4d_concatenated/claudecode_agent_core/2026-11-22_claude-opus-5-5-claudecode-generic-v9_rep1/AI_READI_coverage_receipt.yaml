  - slot: ethical_reviews[0].review_details
    snippet: "The initial IRB approval at the University of Washington was received on December 20, 2022."
  - slot: ethical_reviews[0].review_details
    snippet: "An annual renewal application to the IRB about the status and progress of the study is required and due within 90 days of expiration."
  - slot: acquisition_methods[0]
    snippet: "The acquisition of data varied based on the domain; some data were directly observable (such as labs, vitals, and retinal imaging), whereas other data were reported by subjects (e.g. survey responses)."
  - slot: acquisition_methods[0].was_validated_verified
    snippet: "Verification of data entry was performed when possible (e.g. cross-referencing entered medications with medications that were physically brought in or photographed by each study participant)."
  - slot: participant_compensation[0]
    snippet: "Study subjects received a compensation of $200 for the study visit also through the grant funding."
  - slot: collection_timeframes[3]
    snippet: "For this version of the dataset, the timeframe for data collection was July 19, 2023 to May 01, 2025."
  - slot: direct_collection[0]
    snippet: "The data was collected directly from participants across the three recruiting sites."
  - slot: sampling_strategies[0].source_data
    snippet: "Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes and prediabetes ICD-10 codes for all patients who have had an encounter with the sites' health systems within the past 2 years."
  - slot: collection_notifications[0]
    snippet: "Yes, each individual was aware of the data collection, as this was not passive data collection or secondary use of existing data, but rather active data collection directly from participants."
  - slot: informed_consent[0].consent_documentation
    snippet: "Potential participants were given the option to read all consent documentation electronically (e-consent) before their visit and give their consent with an electronic signature without verbal communication with a clinical research coordinator."
  - slot: informed_consent[0]
    snippet: "Informed consent to participate was required before participation in any part of the protocol (including questionnaires)."
  - slot: informed_consent[0].consent_documentation
