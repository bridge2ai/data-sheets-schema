id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset collected from individuals with and without type 2 diabetes
  mellitus (T2DM) and harmonized across three data collection sites (University of Alabama at
  Birmingham, University of California San Diego, University of Washington). Version 3.0.0
  contains data from 2280 participants collected between July 19, 2023 and May 1, 2025 and
  comprises 356,343 files totalling approximately 3.82 TB. Modalities include REDCap survey data,
  clinical laboratory results from blood and urine, physical measurements and vitals, 12-lead
  electrocardiography, cognitive screening, monofilament peripheral neuropathy testing, visual
  function testing, retinal photography, optical coherence tomography (OCT), OCT angiography
  (OCTA), fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous glucose monitoring,
  wearable activity monitoring, and home environmental sensing. The dataset was designed to be
  balanced across diabetes severity, self-reported race/ethnicity, and biological sex in order to
  support downstream artificial intelligence and machine learning research into salutogenesis, the
  pathway from disease back to health. The publicly distributed version contains no protected
  health information; sex, race/ethnicity, and medication information have been removed and are
  held under controlled access.
