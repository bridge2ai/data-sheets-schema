purposes:
  - name: Map the spatiotemporal architecture of human cells
    description: >-
      As stated in the NIH RePORTER project description, CM4AI seeks to map the spatiotemporal
      architecture of human cells and to use these maps toward the grand challenge of
      interpretable genotype-phenotype learning.
  - name: Enable interpretable genotype-phenotype machine learning
    description: >-
      To address the deficiency that machine learning models in genomics and precision medicine
      are often black boxes that predict phenotypes from genotypes without revealing the
      mechanisms by which such translation occurs, and to enable visible machine learning
      systems built directly on knowledge maps of cell and tissue architecture.
  - name: Deliver machine-readable hierarchical maps of cell architecture as AI-ready data
    description: >-
      CM4AI's stated objective is to deliver machine-readable hierarchical maps of cell
      architecture as AI-ready data produced from multimodal interrogation of chromatin
      modifiers, metabolic enzymes, and other proteins involved in cancer, neuropsychiatric,
      and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed
      conditions.
  - name: Create a library of large-scale maps of cellular structure and function across contexts
    description: >-
      A coordinated effort involving three complementary mapping approaches (proteomic mass
      spectrometry, cellular imaging, and genetic perturbation via CRISPR/Cas9) to create a
      library of large-scale maps of cellular structure and function across demographic and
      disease contexts, so as to broadly stimulate research and development in visible machine
      learning systems.
  - name: Implement a FAIR, provenanced standards data management approach
    description: >-
      To implement a standards data management approach based on FAIR access and software
      principles, with deep provenance and replication packages for representation of cell maps
      and their underlying datasets.
  - name: Initiate a research program in ethical AI
    description: >-
      To initiate a research program in ethical AI, especially as it relates to how cell maps
      will be used in genomic medicine and model interpretation, including the ethical
      preparation, licensing, dissemination and data access supervision of CM4AI datasets.
  - name: Stimulate training opportunities in biomachine learning
    description: >-
      To stimulate a diverse portfolio of training opportunities in the emerging field of
      biomachine learning and to recruit and prepare a biomedical workforce adept at both the
      data and life sciences.

addressing_gaps:
  - name: Black-box machine learning in genomics and precision medicine
    description: >-
      In genomics and precision medicine, machine learning models are often black boxes,
      predicting phenotypes from genotypes without understanding the mechanisms by which such
      translation occurs. CM4AI was established to address this deficiency.
  - name: Absence of matched multimodal data and tools for visible machine learning
    description: >-
      The Bridge2AI data generation project generates a resource of matched data and tools to
      enable the creation of visible machine learning systems that are built directly on
      knowledge maps of cell and tissue architecture rather than being black boxes.
  - name: Lack of ethical, AI-ready, fully provenanced biomedical datasets
    description: >-
      CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture,
      which the project defines as fully characterized FAIR data of known provenance that can be
      ethically and reliably processed by AI applications, with models and software available
      for validation and reuse and with predictions that can be explained and interpreted.
  - name: Gaps in training of the functional genomic and biomedical AI/ML workforce
    description: >-
      The Workforce Development Module identified gaps in training of the functional genomic and
      biomedical AI/ML workforce, noting that new training is needed to allow researchers to
      leverage the data sets produced by Bridge2AI and other programs.

tasks:
  - name: Interpretable genotype-phenotype learning
    description: >-
      The grand challenge toward which CM4AI maps are directed, as stated in the NIH RePORTER
      project description.
  - name: Construction of hierarchical cell maps from multimodal data
    description: >-
      Integration of protein-protein interaction and protein localization data into hierarchical
      directed acyclic graphs of protein assemblies spanning scales from cell compartments to
      small protein complexes, using self-supervised embedding and multi-resolution community
      detection.
  - name: Visible machine learning and visible neural network (VNN) development
    description: >-
      Cell maps have been used in AI tools for visible machine learning or visible neural
      networks to interrogate how protein assemblies in the cell affect cell-level phenotype
      predictions.
  - name: Identification of protein complexes and assemblies
    description: >-
      SEC-MS profiling in CM4AI cell lines was used to identify chromatin modifiers that are
      integral components of protein complexes and to map complexes proteome-wide.
  - name: Analysis of cellular processes and of architectural change under perturbation
    description: >-
      Analysis of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations.
  - name: AI model training on functional genomics data
    description: >-
      The release is explicitly intended to provide AI-ready datasets for AI model training.

