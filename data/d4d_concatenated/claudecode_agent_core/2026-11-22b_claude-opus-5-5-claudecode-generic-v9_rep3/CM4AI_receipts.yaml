        mapping approaches – proteomic mass spectrometry, cellular imaging, and genetic
        perturbation via CRISPR/Cas9
    - chunk: c016
      snippet: Cell Maps for Artificial Intelligence (CM4AI) will deliver machine-readable
        hierarchical maps of cell architecture as AI-ready data, together with quarterly
        data releases of map-input data streams.
    - chunk: c016
      snippet: CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin,
        UA Birmingham, Simon Fraser University, and the Hastings Center, as part of
        the NIH Bridge2AI program.
    - chunk: c026
      snippet: CM4AI is generating multi-modal data including protein-protein interaction
        (PPI), spatial localization, and genetic perturbation data in MDA-MB-468 breast
        cancer cells (+/- paclitaxel or vorinostat) and iPSCs (+/- differentiation).
