  - {slot: "sensitive_elements[0]", snippet: "The release contains data considered low risk, including derivations such as spectrograms but not the original voice recordings."}
  - {slot: "sampling_strategies[0]", snippet: "Patients/healthy volunteers at the Hospital for Sick Children were considered for enrollment in the study."}
  - {slot: "sampling_strategies[0]", snippet: "if they fulfilled the inclusion criteria of 2 to 18 years of age, and English proficiency."}
  - {slot: "sampling_strategies[0]", snippet: "Exclusion criteria included participants over 18 years of age, and individuals who were non-verbal."}
  - {slot: "sampling_strategies[0]", snippet: "Non-patients, recruited through research postings, were evaluated for eligibility"}
  - {slot: "informed_consent[0]", snippet: "parental or participant consent was obtained prior to data collection and data sharing."}
