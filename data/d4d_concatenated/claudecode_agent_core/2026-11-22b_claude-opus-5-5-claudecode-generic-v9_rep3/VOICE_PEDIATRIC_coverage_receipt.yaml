  - {slot: "at_risk_populations.guardian_consent", snippet: "parental or participant consent was obtained prior to data collection and data sharing."}
  - {slot: "collection_mechanisms[0]", snippet: "a standardized age-appropriate protocol for data collection was adopted. The protocol included the collection of demographic information, voice and speech related questionnaires, and questionnaires inquiring about medical history."}
  - {slot: "collection_mechanisms[1]", snippet: "All data was collected through customized software –"}
  - {slot: "collection_mechanisms[1]", snippet: "reproschema-ui –"}
  - {slot: "collection_mechanisms[2]", snippet: "A headset was used to record for most participants, while the remaining recordings utilized the built-in tablet microphone due to low tolerance of wearing headphones or existing complex medical conditions."}
  - {slot: "direct_collection[0]", snippet: "All participants completed the recording and demographic data collection in one session."}
  - {slot: "direct_collection[0]", snippet: "parents or decision-makers completed the survey during the recording on a separate tablet."}
  - {slot: "preprocessing_strategies[0]", snippet: "Data were exported and converted to tab delimited values using an open source library developed by our team [4]."}
  - {slot: "preprocessing_strategies[1]", snippet: "The code used to preprocess the raw audio waveforms into the parquet file and to merge the source data into the phenotype files has been made open source in the"}
  - {slot: "preprocessing_strategies[2]", snippet: "features derived from the open-source Speech and Music Interpretation by Large-space Extraction (openSMILE [5]), Praat [6], parselmouth [7], and torchaudio [8, 9] are provided."}
  - {slot: "cleaning_strategies[0]", snippet: "Spectrograms, Mel Spectrograms, MFC coefficients, PPGs, and EMAs for sensitive records and audio checks have been removed from v1.1."}
  - {slot: "anomalies[0]", snippet: "some files, whether due to length or other issues, could not generate certain features and so are not included in the bundled data."}
  - {slot: "file_collections[0]", snippet: "derived audio data features (under features)"}
  - {slot: "file_collections[1]", snippet: "phenotypic information acquired during data collection (under phenotype)"}
  - {slot: "file_collections[2]", snippet: "metadata information for the recordings (available under metadata)"}
  - {slot: "file_collections[0].description", snippet: "Binary files are made available as Parquet, an open-source column-oriented data file format."}
  - {slot: "file_collections[0].description", snippet: "All of the above files are associated with a data dictionary file which has the same file stem and a JSON suffixes"}
  - {slot: "file_collections[0].resources[0]", snippet: "torchaudio_spectrograms.parquet (n=23533) contains spectrograms of dimension 201xT generated using the short-time Fast Fourier Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT."}
  - {slot: "file_collections[0].resources[1]", snippet: "torchaudio_mel_spectrograms.parquet (n=23533) contains Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms hop length, a 400-point FFT and 60 Mel bins."}
  - {slot: "file_collections[0].resources[2]", snippet: "torchaudio_mfcc.parquet (n=23533) contains Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the mel spectrograms."}
  - {slot: "file_collections[0].resources[3]", snippet: "torchaudio_pitch.parquet (n=23533) contains the detected pitch (fundamental frequency) over time and is of dimension T with a min and max pitch of 80 and 500 respectively."}
  - {slot: "file_collections[0].resources[4]", snippet: "sparc_ema.parquet (n=23532) contains the estimated electromagnetic articulography (EMA) using a deep learning model with dimensions Tx12"}
  - {slot: "file_collections[0].resources[5]", snippet: "sparc_loudness.parquet (n=23532) contains the estimated loudness based on the average absolute amplitude of the audio waveform of size T, using 20ms windows."}
  - {slot: "file_collections[0].resources[6]", snippet: "sparc_periodicity.parquet (n=23532) contains the estimated periodicity (confidence of pitch presence) derived from the audio using 20ms windows of dimension T."}
  - {slot: "file_collections[0].resources[7]", snippet: "sparc_pitch.parquet (n=23532) contains the estimated fundamental frequency (F0) of the audio signal using a different algorithm than before with a range of 50-550Hz and dimension T."}
  - {slot: "file_collections[0].resources[8]", snippet: "ppgs.parquet (n=23533) contains the phonetic posteriorgram probabilities across 40 phoneme categories giving a dimension of 40xT with a frame rate of 100Hz."}
  - {slot: "file_collections[0].resources[9]", snippet: "Each feature is present in the static_features.tsv file."}
  - {slot: "description", snippet: "metrics related to audio quality derived from the recordings present in the audio_quality_metrics.tsv file."}
  - {slot: "file_collections[0].source_caveats", snippet: "There is also metrics related to audio quality derived from the recordings present in the audio_quality_metrics.tsv file."}
  - {slot: "file_collections[0].source_caveats", snippet: "a JSON suffixes (e.g. torch_spectrogram.json)"}
