  - {slot: "addressing_gaps[0]", snippet: "These factors have contributed to the lack of publicly/open access/ available pediatric data sets that enable machine learning for pediatric voice analysis"}
  - {slot: "intended_uses[0]", snippet: "intended to enable study of developmental norms"}
  - {slot: "intended_uses[1]", snippet: "create AI-driven tools for early screening"}
  - {slot: "intended_uses[2]", snippet: "and support clinical insight."}
