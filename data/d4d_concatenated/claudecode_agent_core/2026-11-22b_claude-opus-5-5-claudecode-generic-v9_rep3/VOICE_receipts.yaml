  file_collections[0].resources[1]:
    receipts:
    - chunk: c019
      snippet: sparc_ema.parquet (n=28640) contains the estimated electromagnetic
        articulography (EMA) using a deep learning model with dimensions Tx12
    core_path: distributions[2]
  file_collections[0].resources[2]:
    receipts:
    - chunk: c019
      snippet: sparc_loudness.parquet (n=31855) contains the estimated loudness based
        on the average absolute amplitude of the audio waveform of size T, using 20ms
        windows.
    core_path: distributions[3]
  file_collections[0].resources[3]:
    receipts:
    - chunk: c019
      snippet: sparc_periodicity.parquet (n=31872) contains the estimated periodicity
        (confidence of pitch presence) derived from the audio using 20ms windows of
        dimension T.
    core_path: distributions[4]
  file_collections[0].resources[4]:
    receipts:
    - chunk: c019
      snippet: sparc_pitch.parquet (n=31872) contains the estimated fundamental frequency
        (F0) of the audio signal using a different algorithm than before with a range
        of 50-550Hz and dimension T.
    core_path: distributions[5]
  file_collections[0].resources[5]:
    receipts:
    - chunk: c019
      snippet: torchaudio_spectrograms.parquet (n=29278) contains spectrograms of
        dimension 201xT generated using the short-time Fast Fourier Transform (FFT)
        with a 25ms window size, 10ms hop length, and a 400-point FFT.
    core_path: distributions[6]
  file_collections[0].resources[6]:
    receipts:
    - chunk: c019
      snippet: torchaudio_mfcc.parquet (n=29278) contains Mel-frequency cepstrum coefficients
        of dimension 60xT using the same parameters as the mel spectrograms.
    core_path: distributions[7]
  file_collections[0].resources[7]:
    receipts:
    - chunk: c019
      snippet: torchaudio_pitch.parquet (n=32522) contains the detected pitch (fundamental
        frequency) over time and is of dimension T with a min and max pitch of 80
        and 500 respectively.
    core_path: distributions[8]
  file_collections[0].resources[8]:
    receipts:
    - chunk: c019
      snippet: torchaudio_mel_spectrograms.parquet (n=29278) contains Mel spectrograms
        of dimension 60xT generated with a 25ms window size, 10ms hop length, a 400-point
        FFT and 60 Mel bins.
    core_path: distributions[9]
  file_collections[0].resources[9]:
    receipts:
    - chunk: c019
