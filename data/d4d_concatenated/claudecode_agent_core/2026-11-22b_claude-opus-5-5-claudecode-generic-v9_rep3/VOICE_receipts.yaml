slots:
  acquisition_methods[0]:
    receipts:
    - chunk: c007
      snippet: Clinical validation is performed by a qualified physician or practitioner
        based on established gold standards for diagnosis
    core_path: acquisition_methods[0]
  acquisition_methods[0].was_directly_observed:
    receipts:
    - chunk: c009
      snippet: The data was directly observable and reported by subjects.
    core_path: acquisition_methods[0].was_directly_observed
  acquisition_methods[0].was_reported_by_subjects:
    receipts:
    - chunk: c009
      snippet: The data was directly observable and reported by subjects.
    core_path: acquisition_methods[0].was_reported_by_subjects
  acquisition_methods[0].was_validated_verified:
    receipts:
    - chunk: c009
      snippet: Clinical diagnoses were verified by clinicians reviewing audio and/or
        imaging data, looking at electronic health records, or medication prescriptions.
    core_path: acquisition_methods[0].was_validated_verified
  addressing_gaps[0]:
    receipts:
    - chunk: c002
      snippet: Current literature on this topic has only been studied on small- to
        medium-sized data sets with limited data outside of acoustic measures not
        linked to multi-modal health data
    core_path: addressing_gaps[0]
  addressing_gaps[1]:
    receipts:
    - chunk: c002
      snippet: comparing studies and pooling data is challenging due to a lack of
        existing standards in how voice and other acoustics are measured and collected
    core_path: addressing_gaps[1]
  addressing_gaps[2]:
    receipts:
    - chunk: c008
      snippet: created to address a gap in the availability of large-scale, diverse,
        and well-documented voice data for use in clinical machine-learning applications
    - chunk: c008
      snippet: their sample sizes were too small, or they lacked the key metadata
        needed for training robust, clinically useful models
    core_path: addressing_gaps[2]
  anomalies[0]:
    receipts:
    - chunk: c008
      snippet: different sites have different collection configurations. The collection
        protocol changed over the course of the study
    core_path: anomalies[0]
  citation:
    receipts:
    - chunk: c018
      snippet: 'Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M.,
        Dorr, D., Payne, P., Ravitsky, V., Bélisle-Pipon, J., Bahr, R., Watts, S.,
