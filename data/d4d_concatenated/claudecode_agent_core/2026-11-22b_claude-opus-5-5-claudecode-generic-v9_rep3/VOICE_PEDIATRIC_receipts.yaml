bundle_md5: 0350223711484a63c21b2dd57af6f4c9
slots:
  addressing_gaps[0]:
    receipts:
    - chunk: c002
      snippet: These factors have contributed to the lack of publicly/open access/
        available pediatric data sets that enable machine learning for pediatric voice
        analysis
    core_path: addressing_gaps[0]
  anomalies[0]:
    receipts:
    - chunk: c002
      snippet: some files, whether due to length or other issues, could not generate
        certain features and so are not included in the bundled data.
    core_path: anomalies[0]
  at_risk_populations:
    receipts:
    - chunk: c002
      snippet: inclusion criteria of 2 to 18 years of age
    core_path: at_risk_populations
  at_risk_populations.assent_procedures:
    receipts:
    - chunk: c005
      snippet: When children will be participating in the research, parents or guardians
        will provide consent, and children will provide verbal assent where appropriate.
    - chunk: c005
      snippet: Where young children cannot reasonably be asked to assent (due to limitations
        in understanding due to age and development) they will not be asked to do
        so. This typically holds for children under seven years of age.
    core_path: at_risk_populations.assent_procedures
  at_risk_populations.guardian_consent:
    receipts:
    - chunk: c002
      snippet: parental or participant consent was obtained prior to data collection
        and data sharing.
    - chunk: c004
      snippet: in the case of pediatric participants, not receiving consent from a
        parent or guardian
    core_path: at_risk_populations.guardian_consent
  at_risk_populations.special_protections:
    receipts:
    - chunk: c004
      snippet: Pediatric patients will be enrolled ONLY through the pediatric sites
        and not at USF. Checklist HRP-416 for children under 21 has been completed
        and is appended to this protocol.
    - chunk: c005
      snippet: No pediatric data collection will be performed at USF. Data Collection
        for Pediatric cohorts will ONLY be performed at the pediatric participating
        institutions.
    core_path: at_risk_populations.special_protections
  citation:
    receipts:
    - chunk: c002
      snippet: Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M.,
        Dorr, D., Payne, P., Ravitsky, V., Bélisle-Pipon, J., Bahr, R., Watts, S.,
        Bolser, D., Siu, J., Lerner-Ellis, J., Rudzicz, F., Boyer, M., Abdel-Aty,
        Y., Ahmed Syed, T., Amraei, D., ... Ghosh, S. (2026). Bridge2AI-Voice Pediatric
        Dataset (version 1.1.0).
    core_path: citation
  cleaning_strategies[0]:
    receipts:
    - chunk: c002
      snippet: Spectrograms, Mel Spectrograms, MFC coefficients, PPGs, and EMAs for
        sensitive records and audio checks have been removed from v1.1.
    core_path: cleaning_strategies[0]
  cleaning_strategies[1]:
    receipts:
    - chunk: c003
      snippet: releasing audio features for all free speech tasks that were manually
        checked for presence of unconsented speakers and PII.
    core_path: cleaning_strategies[1]
  collection_mechanisms[0]:
    receipts:
    - chunk: c002
      snippet: a standardized age-appropriate protocol for data collection was adopted.
        The protocol included the collection of demographic information, voice and
        speech related questionnaires, and questionnaires inquiring about medical
        history.
    core_path: collection_mechanisms[0]
  collection_mechanisms[1]:
    receipts:
    - chunk: c002
      snippet: All data was collected through customized software –
    - chunk: c002
      snippet: reproschema-ui –
    - chunk: c006
      snippet: For Pediatrics, all data is collected using reproschema-ui with the
        Bridge2AI-Voice pediatric protocol.
    - chunk: c006
      snippet: Voice, breathing, cough, and speech data are recorded with the app
        for adults and with reproschema-ui for pediatrics.
    core_path: collection_mechanisms[1]
  collection_mechanisms[2]:
    receipts:
    - chunk: c002
      snippet: A headset was used to record for most participants, while the remaining
        recordings utilized the built-in tablet microphone due to low tolerance of
        wearing headphones or existing complex medical conditions.
    core_path: collection_mechanisms[2]
  collection_mechanisms[3]:
    receipts:
    - chunk: c007
      snippet: ABC’s Recalling alphabet Peds
    - chunk: c007
