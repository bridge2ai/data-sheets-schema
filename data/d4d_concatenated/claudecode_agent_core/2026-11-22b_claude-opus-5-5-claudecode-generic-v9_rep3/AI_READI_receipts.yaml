  description:
    receipts:
    - chunk: c011
      snippet: The AI-READI is a dataset consisting of data collected from individuals
        with and without Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data
        collection sites.
    - chunk: c014
      snippet: The AI-READI project seeks to create and share a flagship ethically-sourced
        dataset of type 2 diabetes.
    - chunk: c015
      snippet: This dataset contains data from 2280 participants that was collected
        between from July 19, 2023 and May 01, 2025. Data from multiple modalities
        are included.
    - chunk: c018
      snippet: Multiple modalities of data are collected for each participant, including
        survey data, clinical data, retinal imaging data, environmental sensor data,
        continuous glucose monitor data, and wearable activity monitor data.
    - chunk: c018
      snippet: These encompass tabular data, imaging data, and physiological signal/waveform
        data. There is no unstructured text data included in this dataset.
    - chunk: c019
      snippet: The dataset contains 356,343 files and is around 3.82 TB in size.
    - chunk: c019
      snippet: Within each datatype folder, there is one folder per modality. Within
        each modality folder, there is one folder per device used to collect that
        modality. Within each device folder, there is one folder per participant.
    core_path: description
  direct_collection[0]:
    receipts:
    - chunk: c019
      snippet: The data was collected directly from participants across the three
        recruiting sites.
    core_path: direct_collection[0]
  direct_collection[0].collection_details:
    receipts:
    - chunk: c019
      snippet: Recruitment pools were identified by screening Electronic Health Records
        (EHR) for diabetes and prediabetes ICD-10 codes for all patients who have
        had an encounter with the sites' health systems within the past 2 years.
    core_path: direct_collection[0].collection_details
