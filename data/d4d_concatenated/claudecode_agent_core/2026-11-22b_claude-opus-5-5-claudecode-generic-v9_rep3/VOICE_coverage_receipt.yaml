  - slot: raw_sources[0]
    snippet: "The published Bridge2AI-Voice Adult Dataset contains derived features from the audio waveforms. This PhysioNet project does not contain raw audios."
  - slot: raw_sources[0].raw_data_details
    snippet: "Accessing raw audio is a more involved process and requires institutional sign off. Please reach out to the access committee if you are interested in access: DACO@b2ai-voice.org"
  - slot: raw_sources[0].access_url
    snippet: "https://www.synapse.org/Synapse:syn72370534/"
  - slot: citation
    snippet: "Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M., Dorr, D., Payne, P., Ravitsky, V., Bélisle-Pipon, J., Bahr, R., Watts, S., Bolser, D., Siu, J., Lerner-Ellis, J., Rudzicz, F., Boyer, M., Abdel-Aty, Y., Ahmed Syed, T., Anibal, J., ... Ghosh, S. (2026). Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information (version 3.1.0)."
  - slot: version_access.versions_available
    snippet: "https://doi.org/10.13026/8xbn-nq66"
  - slot: description
    snippet: "Bridge2AI-Voice v3.1 contains data for 833 participants across five sites in North America."
  - slot: instances[0].counts
    snippet: "Bridge2AI-Voice v3.1 contains data for 833 participants across five sites in North America."
  - slot: description
    snippet: "The release contains data considered low risk, including derivations such as spectrograms but not the original voice recordings. Detailed demographic, clinical, and validated questionnaire data are also made available."
  - slot: sampling_strategies[0].description
    snippet: "Participants were selected based on known conditions which manifest within the voice waveform including voice disorders, neurological disorders, mood disorders, and respiratory disorders."
  - slot: sampling_strategies[0].description
    snippet: "Patients presenting at the given clinic were screened for inclusion and exclusion criteria prior to their visit by the project investigators."
  - slot: informed_consent[0]
    snippet: "patient consent was sought for the data collection initiative and to share the acquired research data"
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "Data collection was conducted using a custom application on a tablet with a headset used for data collection when possible."
  - slot: instances[0].notes
    snippet: "a subset of participants required multiple sessions to complete the data collection. As a result, there may be more than one session per participant in the current dataset"
  - slot: preprocessing_strategies[0].preprocessing_details
    snippet: "Data were exported and converted from RedCap using an open source library developed by our team"
  - slot: preprocessing_strategies[2]
    snippet: "Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing filter applied."
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "Spectrograms - Time-frequency representations were computed using the short-time Fast Fourier Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT. Spectrograms were further downsampled by a factor of two in the time domain after derivation."
  - slot: page
    snippet: "Source URL: https://physionet.org/content/b2ai-voice/3.1.0/"
  - slot: citation
    snippet: "PhysioNet . RRID:SCR_007345. https://doi.org/10.13026/8xbn-nq66"
  - slot: related_datasets[0].relationship_type
    snippet: "Note that the Bridge2AI-Voice Pediatric Dataset is also available on PhysioNet: https://physionet.org/content/b2ai-voice-pediatric/"
- id: c019
  status: extracted
  extracted:
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "Mel-frequency cepstral coefficients (MFCC) - 60 MFCCs were extracted using the above spectrograms."
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "Mel Spectrogram - a combination of the above two computed with the same parameters (25ms window size, 10ms hop length, a 400-point FFT, and 60 Mels)."
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "Articulatory features - using the Speech Articulatory Coding (sparc) package, we generate the kinematic traces of vocal tract articulators and source features as well as measures of loudness, periodicity, and pitch. All features were gathered at 50Hz."
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "Acoustic features were extracted using OpenSMILE, capturing temporal dynamics and acoustic characteristics."
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "Phonetic and prosodic features were computed using Parselmouth and Praat, providing measures of fundamental frequency, formants, and voice quality."
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "Phonetic Posteriorgrams (ppgs) - time-varying categorical distribution over acoustic units of speech (e.g., phonemes) at 100Hz were generated via the ppgs package"
  - slot: machine_annotation_tools[0]
    snippet: "Transcriptions were generated using OpenAI's Whisper Large model."
  - slot: is_deidentified.method
    snippet: "HIPAA Safe Harbor identifiers were removed."
  - slot: is_deidentified.identifiers_removed
    snippet: "State and province were removed. Country of data collection was retained."
  - slot: is_deidentified.deidentification_details
    snippet: "Spectrograms and similar features were excluded if the audio contained free speech. Static and other features which do not encode the sensitive information were retained."
  - slot: description
    snippet: "The dataset contains both derived audio data features (under features) and phenotypic information acquired during data collection, as well as metadata related to the specific audio task and recording."
  - slot: file_collections[0]
    snippet: "Binary files are made available as Parquet, an open-source column-oriented data file format. The following dense binary files are available in the features subfolder"
  - slot: file_collections[0].resources[0]
    snippet: "ppgs.parquet (n=29289) contains the phonetic posteriorgram probabilities across 40 phoneme categories giving a dimension of 40xT with a frame rate of 100Hz."
  - slot: file_collections[0].resources[1]
    snippet: "sparc_ema.parquet (n=28640) contains the estimated electromagnetic articulography (EMA) using a deep learning model with dimensions Tx12"
  - slot: file_collections[0].resources[2]
    snippet: "sparc_loudness.parquet (n=31855) contains the estimated loudness based on the average absolute amplitude of the audio waveform of size T, using 20ms windows."
  - slot: file_collections[0].resources[3]
    snippet: "sparc_periodicity.parquet (n=31872) contains the estimated periodicity (confidence of pitch presence) derived from the audio using 20ms windows of dimension T."
  - slot: file_collections[0].resources[4]
    snippet: "sparc_pitch.parquet (n=31872) contains the estimated fundamental frequency (F0) of the audio signal using a different algorithm than before with a range of 50-550Hz and dimension T."
  - slot: file_collections[0].resources[5]
    snippet: "torchaudio_spectrograms.parquet (n=29278) contains spectrograms of dimension 201xT generated using the short-time Fast Fourier Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT."
  - slot: file_collections[0].resources[6]
    snippet: "torchaudio_mfcc.parquet (n=29278) contains Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the mel spectrograms."
  - slot: file_collections[0].resources[7]
    snippet: "torchaudio_pitch.parquet (n=32522) contains the detected pitch (fundamental frequency) over time and is of dimension T with a min and max pitch of 80 and 500 respectively."
  - slot: file_collections[0].resources[8]
    snippet: "torchaudio_mel_spectrograms.parquet (n=29278) contains Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms hop length, a 400-point FFT and 60 Mel bins."
  - slot: file_collections[0].resources[9]
    snippet: "audio_quality_metrics.tsv - One feature per audio recording derived from the raw audio related to quality control metrics."
  - slot: file_collections[0].resources[10]
    snippet: "static_features.tsv - Features derived from the raw audio, with one feature per audio recording."
  - slot: file_collections[0].description
    snippet: "All of the above files are associated with a data dictionary file which has the same file stem and a JSON suffixes"
  - slot: file_collections[0].source_caveats
    snippet: "torchaudio_spectrogram.parquet"
  - slot: is_deidentified.deidentification_details
    snippet: "Spectrograms, Mel Spectrograms, MFC coefficients, PPGs, and EMAs for sensitive records and audio checks have been removed from v3.1."
  - slot: missing_data_documentation[1]
    snippet: "some files, whether due to length or other issues, could not generate certain features and so are not included in the bundled data"
  - slot: file_collections[1].collection_type
    snippet: "as well as metadata related to the specific audio task and recording"
  - slot: file_collections[1]
    snippet: "The metadata folder contains a binary file made available as Parquet and its corresponding data dictionary. This includes specific information about the recording, including task instructions and prompts, as well as information about the microphone used and its gain."
  - slot: file_collections[2]
    snippet: "The phenotype subfolder contains organized information collected from the participant or other individual during their encounter"
  - slot: file_collections[2].description
    snippet: "the question (if any) that was asked the participant to prompt the answer, and the data type of the response"
  - slot: missing_data_documentation[0].handling_strategy
    snippet: "Phenotype data files only contain rows for a participant if at least one column is not missing."
  - slot: instances[0].notes
    snippet: "there is no requirement the participant provide the same response for each visit. As a result, participant information for the same data element may vary across the data file"
