maintainers:
- id: ROR:01yc7t268
  name: Washington University in St. Louis
  description: Managing organization of the dataset in the FAIRhub structured metadata.
- name: AI-READI team
  description: The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub
    through Microsoft Azure.
  maintainer_details: Questions, suggestions and feedback are directed to https://aireadi.org/contact.
updates:
  frequency: Approximately yearly; new static versions are released approximately once a year.
  update_details: The dataset is released as static versions and is not updated; new versions
    are released with additional instances as more study participants complete the study visit.
    This third version consists of data collected through the end of the second year of the
    study (July 19, 2023 to May 1, 2025).
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 3.0.0 (10.60775/fairhub.3, November 17, 2025)
  - 2.0.0 (10.60775/fairhub.2, November 8, 2024)
  - 1.0.0 (10.60775/fairhub.1, May 3, 2024)
  version_details: Version 1.0.0 contained data from 204 participants (pilot data collection
    phase); version 2.0.0 added 863 participants for a total of 1067 (first year of the study)
    and, per its FAIRhub record, comprised 2.01 TB in 165,051 files; version 3.0.0 contains
    2280 participants. The README's change table labels the 1213 participants added in version
    3.0.0 "year 3 data" and the 863 added in version 2.0.0 "year 2 data", while the healthsheet
    describes the same releases as covering the first and second years of the study. Snellen
    visual acuity variables were dropped in version 3.0.0, leaving only logMAR visual acuity
    measurements. FAIRhub and the v2 documentation state that version 2.0.0 is no longer accessible.
  source_caveats: The v3.0.0 documentation page states that v3.0 contains data from the participants
    of the pilot study phase, the same wording as the v2.0.0 page; this conflicts with the
    FAIRhub record and healthsheet for v3.0.0 and appears to be carried-over text.
ethical_reviews:
- name: University of Washington IRB review
  reviewing_organization: Institutional Review Board of the University of Washington
  review_details: The initial IRB approval at the University of Washington was received on
    December 20, 2022 (approval number STUDY00016228). The IRBs of the University of Alabama
    at Birmingham and the University of California, San Diego rely on the University of Washington
    IRB.
  notes: An annual renewal application to the IRB about the status and progress of the study
    is required and due within 90 days of expiration.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - Approved by the Institutional Review Board of the University of Washington (approval number
    STUDY00016228), with reliance agreements with the IRBs of the University of Alabama at
    Birmingham and the University of California, San Diego.
  ethics_review_board: University of Washington IRB
  regulatory_compliance:
  - The FAIRhub study description records the study as not an FDA-regulated drug or device
    study and its human subject review status as submitted and approved.
  notes: The FAIRhub study description lists ClinicalTrials.gov identifier NCT06002048.
informed_consent:
- name: Informed consent for study participation
  consent_obtained: true
  consent_type: Written informed consent, documented by electronic signature (e-consent in
    REDCap) or in person in a private room with a study team member.
  consent_documentation: Participants could read all consent documentation electronically
    (e-consent) and consent with an electronic signature, using UW ITHS REDCap; those who
    did not consent electronically consented in person at the start of the visit.
  consent_scope: Consent covered participation in all protocol elements (including questionnaires),
    and the IRB protocol states that consent for secondary use, banking and future sharing
    is obtained in the informed consent form.
  withdrawal_mechanism: Participants may withdraw consent at any time and cease study participation;
    data already shared or used remain in the dataset.
  notes: The other clinical sites had IRB reliance and used the same consent form as the University
    of Washington, with minor institution-specific language.
license_and_use_terms:
  id: doi:10.5281/zenodo.17555036
  name: AI-READI custom license v2.0
  license_terms: The AI-READI Data License Agreement (Version 2.0) grants a non-exclusive,
    non-transferable license to download, reproduce and use the data, and to create derivative
    works, for research, commercial and non-commercial purposes. The terms were tailored to
    enable reuse of the dataset for commercial or research purposes while putting strong requirements
    around data usage, security and secondary sharing to protect study participants. Data
    may be stored only on servers and devices of the licensee's institution or on cloud services
    with a HIPAA Business Associate Agreement. Licensees may distribute models developed using
    the data that do not contain the data, after reasonable efforts to minimize memorization
    or reconstruction of data. Licensees must acknowledge the licensor, the source and any
    funder in papers.
  data_use_permission:
  - disease_specific_research
  source_caveats: The license is named "AI-READI custom license v2.0" in the FAIRhub structured
    metadata, "Health Data License" on the FAIRhub landing page and "AI-READI DATA LICENSE
    AGREEMENT (Version 2.0)" in the license document; these are treated as names of the same
    license. The FAIRhub consent metadata and README state that the public version can only
    be used for type 2 diabetes related research, while the license grant covers research,
    commercial and non-commercial purposes; both statements are recorded.
ip_restrictions:
  restrictions:
  - Title to the data and all industrial and intellectual property rights therein remain solely
    and exclusively with the licensor and its suppliers.
  notes: The license names Washington University in St. Louis as the licensor.
regulatory_restrictions:
  other_compliance: Licensees must comply with the data security and privacy standards established
    by the U.S. National Institutes of Health under its Genomic Data Sharing (GDS) Policy.
data_governance:
  access_review_process: 'Accessing the dataset requires logging in through a verified ID
    system, agreeing to use the data only for type 2 diabetes related research, and agreeing
    to the license terms, which set restrictions and obligations for data usage (FAIRhub access
    type: public download, self-attestation required).'
  notes: The UW IRB protocol states that UCSD has a health Data Oversight Committee (HDOC)
    that oversees data sharing with other institutions.
is_deidentified:
  method: 'The FAIRhub record gives the de-identification type as NoDeIdentification: no identifiers
    were collected, so no active de-identification was necessary.'
  deidentification_details: No identifiers were collected so no active de-identification was
    necessary, but the team checked that no identifiable data per US HIPAA were present in
    the data.
  identifiers_removed: The data contain no protected health information (PHI); information
    related to the sex and race/ethnicity of the participants as well as medication used has
    been removed.
  source_caveats: The Nature Metabolism comment (2024) states that the public set is stripped
    of PHI as defined by the HIPAA Privacy Rule via the Safe Harbor method, together with
    sex and race/ethnicity information. The FAIRhub structured metadata for v3.0.0 (higher-ranked)
    states NoDeIdentification because no identifiers were collected; its method is the one
    recorded here.
