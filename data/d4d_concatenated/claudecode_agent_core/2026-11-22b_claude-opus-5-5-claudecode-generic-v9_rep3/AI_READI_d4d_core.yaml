instances:
- name: Participant
  instance_type: Each instance represents an individual patient (study participant).
  counts: 2280
  notes: 'Mean age (years ± sd) in the suggested split: train 61.1 ± 11.3, validation 60.3
    ± 10.8, test 60.5 ± 11.4, total 60.8 ± 11.3.'
  source_caveats: The healthsheet states that the dataset contains all possible instances
    and, in the same answer, that it contains data from all participants enrolled during the
    first year of data collection, while elsewhere it states that version 3 covers the first
    two years (July 19, 2023 to May 1, 2025) and 2280 participants. The first-year wording
    appears to be carried over from an earlier version.
anomalies:
- name: Survey responses
  anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- name: Wearables
  anomaly_details: For wearables, improper use and technical failure such as battery failure
    or system malfunction are expected.
- name: Imaging
  anomaly_details: For imaging data, patient uncooperation, noise that may obscure images,
    technical failure and data transfer failures are expected.
- name: Undilated handheld fundus photography quality
  anomaly_details: Optomed Aurora images are undilated and handheld; image quality varies
    from patient to patient and within the same patient.
- name: FLIO participant compliance
  anomaly_details: FLIO is performed as the last modality of the visit because it takes longer
    and exposes patients to uncomfortable levels of light; patients may not be at their best
    possible compliance.
known_biases:
- name: Volunteer bias
  bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias, which may limit the generalizability of results to those not represented in the
    study population.
known_limitations:
- name: English-language requirement
  limitation_description: Eligible participants must speak, read and understand English, which
    may have created challenges in recruiting Hispanic and/or Asian persons.
  notes: The IRB protocol states that non-English speaking participants were not initially
    enrolled and that Hispanic participants enrolled in the meantime needed to be fluent in
    English.
- name: Group balance not yet achieved
  limitation_description: As enrollment is ongoing, the pilot data release and periodic updates
    to data releases may not have achieved balanced distribution across groups; the pilot
    study is not balanced across race/ethnicity, biological sex and diabetes presence and
    severity.
- name: Urban and hospital-based recruitment
  limitation_description: Recruitment is predominantly urban and hospital-based.
  scope_impact: The healthsheet names this among factors influencing the generalization of
    derived models, as it may not fully capture diverse cultural and socioeconomic backgrounds.
- name: Races/ethnicities not included
  limitation_description: The study cohort does not include other races/ethnicities such as
    Pacific Islanders and Native Americans and may not provide a comprehensive representation
    of the population.
subpopulations:
- name: Race/ethnicity groups
  identification: Self-reported race/ethnicity; the study recruits Asian, Black, Hispanic
    and White participants.
  distribution: 'Suggested-split summary counts (README): Hispanic 380, Asian 545, Black 519,
    White 836 (total 2280); train 204/369/343/660, validation 88 each, test 88 each.'
- name: Diabetes status groups
  identification: No DM (no type 1 or type 2 diabetes); Lifestyle (pre-type 2 diabetes and
    type 2 diabetes controlled by lifestyle adjustments); Oral (type 2 diabetes controlled
    by oral or injectable medications other than insulin); Insulin (type 2 diabetes controlled
    by insulin).
  distribution: 'Suggested-split summary counts (README): No DM 776, Lifestyle 560, Oral 686,
    Insulin 258 (total 2280); train 600/384/487/105, validation 88/88/109/67, test 88/88/90/86.'
- name: Biological sex
  identification: Biological males and females.
  distribution: 'Suggested-split summary counts (README): Male 951, Female 1329 (total 2280);
    train 599/977, validation 176/176, test 176/176.'
  source_caveats: The README states that sex, race and ethnicity data are not released with
    the public version of the dataset; these counts are summaries published with the suggested
    split. The healthsheet answers "No" to whether the dataset identifies demographic sub-populations.
acquisition_methods:
- name: Directly observed data
  was_directly_observed: true
  acquisition_details: Some data were directly observable, such as labs, vitals and retinal
    imaging.
- name: Subject-reported data
  was_reported_by_subjects: true
  acquisition_details: Other data were reported by subjects (for example, survey responses).
    Verification of data entry was performed when possible, for example by cross-referencing
    entered medications with medications physically brought in or photographed by each participant.
collection_mechanisms:
- name: REDCap
  mechanism_details: Online REDCap interface used for recruitment, electronic consent, patient-reported
    questionnaire data and clinical visit data (medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament test results and CBC results).
  notes: Uniform data collection protocols were implemented for all subjects, irrespective
    of race/ethnicity, biological sex or diabetes severity, across all study sites.
- name: Philips PageWriter TC30 Cardiograph
  description: 12-lead electrocardiogram (ECG), performed while the participant sits in a
    reclining chair or lies supine.
- name: Monofilament test
  description: Peripheral neuropathy assessment of touch perception on both feet.
  mechanism_details: Performed with a standard 10 g monofilament applied to points on the
    plantar surface of the feet.
- name: Montreal Cognitive Assessment (MoCA)
  description: General cognitive screener, administered electronically.
  mechanism_details: Administered on an iPad using the MoCA Duo app.
- name: M&S Technologies Electronic Visual Acuity (EVA) tester
  description: Photopic and mesopic letter visual acuity for each eye.
  mechanism_details: Administered at 4 meters from a 12x20 inch touch-screen monitor.
- name: Mars Letter Contrast Sensitivity test (Mars Perceptrix)
  description: Photopic and mesopic letter contrast sensitivity.
  mechanism_details: Conducted monocularly under photopic conditions (general occluder) and
    mesopic conditions (neutral density occluder).
- name: Topcon KR 800 Auto Keratometer/Refractor
  description: Autorefraction of each eye.
  mechanism_details: KR 800 Auto Keratometer/Refractor (Topcon Healthcare).
- name: Blood and urine specimen collection
  description: Non-fasting blood and urine samples are collected during the visit for clinical
    laboratory testing.
  mechanism_details: A small amount of blood is sent to the local site hospital lab for a
    complete blood count on the day of the encounter; an additional portion of blood and the
    urine sample are stored at the site and batch-shipped to the University of Washington
    Nutrition and Obesity Research Center for specialized lab tests.
- name: LeeLab Anura environmental sensor
  description: Custom-designed home environmental sensor for indoor environmental parameter
    measurements (ambient temperature, relative humidity, nitrogen oxides, volatile organic
    compounds, particulate matter, multispectral light).
  mechanism_details: Participants use the at-home monitoring devices continuously for 10 days.
  notes: Custom designed at the Karalis Johnson Retina Center, University of Washington (Seattle,
    Washington).
  source_caveats: The measured variables are taken from the BMJ Open Table 4, whose extracted
    layout lists them after the device names.
- name: Garmin Vivosmart 5
  description: Wearable fitness tracker for physical activity monitoring.
  mechanism_details: Used to measure physical activity; recorded variables include number
    of steps, heart rate, sleep duration and oxygen saturation.
- name: Dexcom G6 Continuous Glucose Monitor
  description: Continuous glucose monitoring for 10 days at home; participants are masked
    to the results during the monitoring period.
  mechanism_details: Real-time integrated continuous glucose monitoring system measuring blood
    glucose (mg/dL) every 5 minutes without finger sticks.
- name: iCare EIDON
  description: Widefield TrueColor confocal fundus imaging system.
  mechanism_details: AI-READI images include single field central IR/FAF and Smart Horizontal
    Mosaic.
- name: Heidelberg Spectralis HRA+OCT
  description: OCT and OCTA imaging system.
  mechanism_details: Modalities used are ONH-RC, PPole-H and OCTA of the macula.
- name: Topcon Maestro2 3D OCT-1
  description: Robotic OCT and color fundus camera system.
  mechanism_details: Protocols include 12.0 x 9.0 mm widefield, 6.0 x 6.0 mm 3D macula scan
    and 6.0 x 6.0 mm OCTA.
- name: Topcon Triton DRI OCT
  description: Swept-source OCT with multimodal fundus imaging.
  mechanism_details: Imaging in 12.0 x 12.0 mm and 6.0 x 6.0 mm OCTA, and 12.0 x 9.0 x 6.0
    mm 3D horizontal and radial scan modes.
- name: Zeiss Cirrus 5000 Angioplex
  description: OCT system with OCTA.
  mechanism_details: Protocols include 512 x 512 and 200 x 200 macula and ONH scans and OCTA
    of the macula.
- name: Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO)
  description: Macula-centered fluorescence lifetime imaging ophthalmoscopy.
- name: Optomed Aurora IQ
  description: Handheld non-mydriatic fundus camera used for undilated color fundus photographs.
  mechanism_details: The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic
    images of the ocular fundus.
- name: NIDEK LM-600P Auto Lensometer
  description: Lensometer used at data acquisition sites, as part of vision testing.
- name: OMRON HEM 907XL Blood Pressure Monitor
  description: Blood pressure device used at data acquisition sites.
- name: Medline MDS4001 Automatic Digital Blood Pressure Monitor
  description: Blood pressure device used at data acquisition sites.
- name: Welch Allyn 6000 series Vital signs monitor
  description: Blood pressure device used at data acquisition sites, with a Welch Allyn FlexiPort
    reusable blood pressure cuff.
- name: Topcon CL-200 computerized Lensometer
  description: Lensometer used at data acquisition sites.
- name: Topcon CL-300 computerized Lensometer
  description: Lensometer used at data acquisition sites.
collection_timeframes:
- name: Pilot enrollment
  start_date: '2023-07-18'
  end_date: '2023-11-30'
  timeframe_details: Enrollment began on July 18, 2023; preliminary pilot enrollment occurred
    between July 18, 2023 and November 30, 2023 (BMJ Open protocol).
- name: Formal data collection start
  start_date: '2023-12-01'
  timeframe_details: The formal data collection process began on December 1, 2023 (BMJ Open
    protocol).
- name: Version 3.0.0 data collection period
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: For this version of the dataset, the timeframe for data collection was
    July 19, 2023 to May 1, 2025, covering data through the end of the second year of the
    study.
  source_caveats: The FAIRhub metadata gives July 19, 2023 as the start of collection; the
    BMJ Open protocol gives July 18, 2023 as the start of enrollment. The two refer to different
    events and are both kept.
- name: Overall project timeline
  timeframe_details: The overall project spans four years, with one year dedicated to protocol
    development and training and years 2-4 allocated to subject recruitment and data collection.
data_collectors:
- name: Clinical research coordinator/study coordinator
  role: Responsible for contacting and consenting participants, ushering participants through
    the research visit, conducting study visits including collection of ophthalmologic images.
  description: All research personnel at the three data sites who recruited, enrolled and
    collected data were trained by the data manager at UAB using a Manual of Procedures and
    completed a certification process.
  collector_details: Team members' effort was supported by NIH award OT2OD032644 based on
    the percentage of effort contributed.
- name: Local CLIA-certified clinical laboratory at each data collection site
  collector_details: Performs complete blood count testing on fresh whole blood samples.
- name: University of Washington Nutrition and Obesity Research Center (NORC)
  collector_details: Performs all other laboratory tests using stored, frozen samples.
missing_data_documentation:
- name: Modality-level missingness
  description: Not all modalities are available for all participants; some participants elected
    not to participate in some study elements.
  missing_data_causes: In a few cases the data collection device had no stored results or
    was returned too late to retrieve them (for example, battery died, data lost); in a few
    cases a data collision may have occurred and data were lost.
  missing_data_patterns: Spectralis imaging is operated by the imaging team and is not fully
    automated; quality issues may lead to skipping this modality and missing data.
raw_data_sources:
- source_description: ECG data exported from the device in raw format to local storage.
  raw_data_format: .xml
- source_description: Blood and urine test results from the NORC laboratory.
  raw_data_format: .csv
- source_description: Retinal images exported from imaging devices in the .fda file format
    and converted to DICOM for the dataset.
  raw_data_format: .fda
  source_caveats: The BMJ Open Table 4 extraction does not attach this format to a specific
    device.
- source_description: Retinal images exported from an imaging device in the .sdt file format
    and converted to DICOM for the dataset.
  raw_data_format: .sdt
  source_caveats: The BMJ Open Table 4 extraction does not attach this format to a specific
    device.
- source_description: Garmin VivoSmart 5 physical activity data exported in the .FIT file
    format and converted to the mHealth standard for the dataset.
  raw_data_format: .FIT
  source_caveats: Attribution to the Garmin device follows the row order of the extracted
    BMJ Open Table 4.
- source_description: The IRB protocol states that participants already using a Dexcom CGM
    will be given the option to provide glucose data for up to 90 days before the study visit
    (up to 100 days in total) through the CGM vendor's Clarity application; the additional
    collection is optional.
- source_description: MoCA Duo application output (total score, section subscores, Memory
    Index Score and task completion times) exported to local storage.
  raw_data_format: .csv
sampling_strategies:
- name: Triple-balanced non-probability recruitment
  description: Recruitment sampling procedures aimed at approximately equal distribution of
    participants across sex, race and diabetes severity. Rather than targeting the demographic
    distribution of the US population, the study recruits in equal proportions four race/ethnic
    groups (Asian, Black, Hispanic, White), four categories of T2DM and biological males and
    females.
  is_sample: true
  is_random: false
  source_data: The study base is all patients aged 40 or older who had a medical encounter
    within each health system site (UAB, UCSD, UW) between 2020 and 2025; recruitment pools
    are identified from electronic health records using ICD-10 codes and demographic data.
  strategies: 'Inclusion: able to provide consent; 40 years or older; persons with or without
    type 2 diabetes; must speak and read English. Exclusion: pregnancy; gestational diabetes;
    type 1 diabetes; adults older than 85 years (the last is listed in the FAIRhub eligibility
    module and IRB protocol). Recruitment selects individuals by clinical diagnosis (ICD-10
    codes) and demographic data from the electronic health records of the study sites.'
  notes: 'The FAIRhub study description records the sampling method as a non-probability sample.
    Data were collected in the USA at three sites: the University of Alabama at Birmingham,
    the University of California San Diego and the University of Washington, chosen for geographic
    diversity and diverse racial and ethnic representation. The IRB protocol describes UAB
    selecting a stratified sample of potential participants from the combined site lists,
    and site priorities (UW: Asian>Hispanic>Black; UCSD: Hispanic>Asian>Black; UAB: Black>Hispanic>Asian;
    all sites recruit White participants). Enrollment targets are stated as plans: 4,000 participants
    over 2022-2026 (Nature Metabolism) and approximately 1,000 per diabetes group.'
raw_sources:
- name: Retained raw data
  raw_data_details: The raw data are saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but are not anticipated to be shared outside
    the project team, because they have not been mapped to standardized terminologies and
    may accidentally include personal health information or personally identifiable information.
  source_caveats: The healthsheet states a possibility that raw data may be included in future
    releases of the controlled access dataset.
preprocessing_strategies:
- name: DICOM conversion of retinal images
  preprocessing_details: Some images required conversion to a DICOM standard format before
    upload.
- name: Mapping to data standards
  preprocessing_details: After data were sent from the study sites to the central project
    team, all data were mapped to standardized terminologies and data standards when possible,
    such as the OMOP Common Data Model for clinical data and DICOM for retinal imaging.
cleaning_strategies:
- name: Site data manager quality control
  cleaning_details: The Data Manager at each data site is responsible for quality control
    of all data before uploading to FAIRhub.
- name: Internal review
  cleaning_details: The dataset has been reviewed internally by AI-READI team members for
    quality checks and to ensure that no personally identifiable information was accidentally
    included.
- name: REDCap range checks and record review
  description: Clinical data outside expected minimum/maximum ranges were flagged in REDCap
    reports reviewed by clinical research coordinators and Data Managers.
  cleaning_details: Data were checked for credibility (range checks against prespecified reasonable
    ranges), incorrect flow through prescribed skip patterns, missing data that can be filled
    from other portions of a record, and omission or duplication of records, and edited if
    errors were detected.
  notes: Editing was only done under the guidance and approval of the site PI.
  source_caveats: The healthsheet states that no data were excluded from the dataset at the
    time of preprocessing.
future_use_impacts:
- name: Re-identification risk
  impact_details: The creators do not currently anticipate uses of the dataset that could
    result in unfair treatment or harm, but state that there is a theoretical risk of future
    re-identification.
prohibited_uses:
- name: Sharing with third parties other than other licensees
  description: Licensees may not transfer, license, sublicense, sell, assign, display, share
    or otherwise convey any portion of the data or any derivative work to any third party
    other than another licensee bound by identical terms.
- name: Sharing with third-party model vendors for training
  description: Licensees may not share or distribute data with any third-party model vendor
    or developer for training or development purposes; short-term interaction (prompting or
    querying) with a third-party model under a BAA is permitted.
- name: Reproducing data in publications
  description: Data may not be reproduced in papers, presentations or publications, except
    small representative samples in up to five images or figures per paper for illustrative
    purposes.
- name: Clinical treatment decisions
  description: Licensees may not make clinical treatment decisions based on the data.
  prohibition_reason: The data are intended solely as a research resource.
- name: Re-identification or contact of data subjects
  description: Licensees may not use the data to compromise confidentiality or privacy of
    any data subject, to attempt to identify or contact any data subject or group of data
    subjects, or to extract identifying information.
