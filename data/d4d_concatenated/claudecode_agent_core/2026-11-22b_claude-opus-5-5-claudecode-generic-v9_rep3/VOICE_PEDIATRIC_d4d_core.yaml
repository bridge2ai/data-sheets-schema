id: doi:10.13026/mf9s-5r03
name: Bridge2AI-Voice Pediatric Dataset
description: Bridge2AI-Voice Pediatric Dataset v1.1.0 contains derived audio features for
  23,533 recordings collected from 300 participants aged 2-18 at the Hospital for Sick Children.
  The release contains data considered low risk, including derivations such as spectrograms,
  but not the original voice recordings. Detailed demographic, clinical, and validated questionnaire
  data are also made available. The release is organized into derived audio features (features),
  phenotypic information acquired during data collection (phenotype), and per-recording metadata
  (metadata). Metrics related to audio quality derived from the recordings are provided in
  an audio_quality_metrics.tsv file.
source_caveats: The bundle also documents the Bridge2AI-Voice adult dataset, which the pediatric
  PhysioNet page notes "is also available on PhysioNet" (https://physionet.org/content/b2ai-voice/);
  the project documentation states that the adult and pediatric datasets are available through
  separate PhysioNet links. No passage states a relationship type from the schema's vocabulary,
  so no related_datasets entry is recorded, and facts about the adult dataset (its healthsheet,
  counts, de-identification and oversight answers, Health Data Nexus distribution) are not
  used for this record. The multi-site "Bridge2AI Voice Data Acquisition" IRB protocol in
  the bundle governs the wider Bridge2AI-Voice study; it is used here only for statements
  about pediatric participants and about the investigators.
