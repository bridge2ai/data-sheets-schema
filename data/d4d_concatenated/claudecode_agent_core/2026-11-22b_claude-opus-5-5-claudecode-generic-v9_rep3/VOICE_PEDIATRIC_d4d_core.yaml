instances:
- name: Recordings
  instance_type: voice recording represented by derived audio features
  description: Derived audio features are released for 23,533 recordings; the original voice
    recordings are not part of the release.
  counts: 23533
- name: Participants
  instance_type: pediatric participant
  description: Recordings were collected from 300 participants aged 2-18.
  counts: 300
anomalies:
- name: Features missing for some files
  anomaly_details: Some files, whether due to length or other issues, could not generate certain
    features and so are not included in the bundled data.
subpopulations:
- name: Pediatric age groups
  identification: Pediatric participants are recruited strictly from the Hospital for Sick
    Children (SickKids) and are grouped by age; the project documentation lists pediatric
    protocols for the groups Peds 10+, Peds 6-10, Peds 4-6 and Peds 2-4.
sensitive_elements:
- name: Original voice recordings withheld
  sensitivity_details: The release contains data considered low risk, including derivations
    such as spectrograms, but not the original voice recordings.
collection_mechanisms:
- name: Standardized age-appropriate collection protocol
  description: Once consented, patients were assigned a unique study identification number
    and a standardized age-appropriate protocol was adopted, including demographic information,
    voice and speech related questionnaires, and questionnaires about medical history.
- name: reproschema-ui on tablets
  description: All data was collected through customized software (reproschema-ui) on tablets
    with the Bridge2AI-Voice pediatric protocol; voice, breathing, cough and speech data are
    recorded with reproschema-ui for pediatrics.
- name: Headset or built-in tablet microphone
  description: A headset was used to record most participants; the remaining recordings used
    the built-in tablet microphone due to low tolerance of wearing headphones or existing
    complex medical conditions.
- name: Pediatric acoustic tasks
  description: The project documentation's table of acoustic tasks lists tasks for the pediatric
    protocol, including ABC's (recalling the alphabet), Ready For School, Favorite Show, Long
    Sounds (sustained /ee/ and /ah/ sounds), Silly Sounds (/PUH/ /TUH/ /KUH/) and Repeat Sentences
    (sentence recall).
sampling_strategies:
- name: Eligibility criteria at the Hospital for Sick Children
  description: Patients and healthy volunteers at the Hospital for Sick Children were considered
    for enrollment; pediatric participants are recruited strictly from SickKids. Inclusion
    criteria were 2 to 18 years of age and English proficiency. Exclusion criteria included
    participants over 18 years of age and individuals who were non-verbal. Non-patients, recruited
    through research postings, were evaluated for eligibility against the same criteria.
raw_sources:
- name: Raw audio for the pediatric cohort
  raw_data_details: This PhysioNet project does not contain raw audio. Accessing raw audio
    is a more involved process and requires institutional sign off; requests go to the access
    committee. A notice on the PhysioNet page dated March 9, 2026 states that raw audio data
    access for the pediatric cohort is via Synapse and that data will be made available via
    Synapse. Raw audio data is disseminated through controlled access only to protect participants'
    privacy.
  access_url: https://www.synapse.org/Synapse:syn73617068
preprocessing_strategies:
- name: Export to tab-delimited values
  preprocessing_details: Data were exported and converted to tab delimited values using an
    open source library developed by the team (reference [4] of the PhysioNet page, the b2aiprep
    library).
- name: Feature extraction and phenotype merge with b2aiprep
  preprocessing_details: The code used to preprocess the raw audio waveforms into the parquet
    file and to merge the source data into the phenotype files has been made open source in
    the b2aiprep library.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep (Bridge2AI Data Processing Library)
    url: https://github.com/sensein/b2aiprep
    license: Apache-2.0
    description: Cited on the PhysioNet page as Bridge2AI Data Processing Library (Version
      3.0.0); the version used for this release is not stated.
- name: Static feature extraction
  preprocessing_details: Static features were derived from the open-source openSMILE toolkit,
    Praat, parselmouth and torchaudio and are provided in static_features.tsv.
- name: Conversion of pediatric data to BIDS
  preprocessing_details: Pediatric data collected through ReproSchema-UI is extracted and
    transformed into REDCap format, and subsequently converted to the Brain Imaging Data Structure
    (BIDS).
cleaning_strategies:
- name: Removal of features for sensitive records
  cleaning_details: Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive
    records and audio checks have been removed from v1.1.
- name: Manual check of free speech tasks
  cleaning_details: Release 1.1 releases audio features for all free speech tasks that were
    manually checked for presence of unconsented speakers and PII.
intended_uses:
- name: Study of developmental norms
  description: Resources such as this project are intended to enable study of developmental
    norms.
- name: AI-driven tools for early screening
  description: Resources such as this project are intended to create AI-driven tools for early
    screening.
- name: Clinical insight
  description: Resources such as this project are intended to support clinical insight.
distribution_formats:
- name: Parquet
  format: Parquet
  description: Binary feature files are made available as Parquet, an open-source column-oriented
    data file format; in Python they can be loaded with the HuggingFace datasets library.
- name: Tab-separated values
  format: TSV
  media_type: text/tab-separated-values
  description: Plain-text feature and phenotype files (for example static_features.tsv and
    demographics.tsv), readable with any statistical analysis tool.
- name: JSON data dictionaries
  format: JSON
  media_type: application/json
  description: Each data file is associated with a data dictionary file with the same file
    stem and a JSON suffix.
