- name: Parental or participant consent
  consent_obtained: true
  description: Following confirmation of eligibility, parental or participant consent was
    obtained prior to data collection and data sharing.
at_risk_populations:
  at_risk_groups_included: true
  guardian_consent:
  - Parental or participant consent was obtained prior to data collection and data sharing.
  - Under the Bridge2AI Voice Data Acquisition protocol, pediatric participants whose parent
    or guardian does not consent to voice and clinical de-identified data being uploaded to
    an open-sourced database are excluded.
  assent_procedures: Under the Bridge2AI Voice Data Acquisition protocol, when children participate,
    parents or guardians provide consent and children provide verbal assent where appropriate;
    young children who cannot reasonably be asked to assent (typically under seven years of
    age) are not asked to do so.
  special_protections:
  - Pediatric participants are enrolled only through the pediatric sites and not at USF; no
    pediatric data collection is performed at USF.
  - Checklist HRP-416 for children under 21 has been completed and appended to the protocol.
  source_caveats: The assent procedure, guardian-consent exclusion and enrollment restrictions
    come from the multi-site Bridge2AI Voice Data Acquisition protocol; the pediatric release
    documentation itself states only that parental or participant consent was obtained.
