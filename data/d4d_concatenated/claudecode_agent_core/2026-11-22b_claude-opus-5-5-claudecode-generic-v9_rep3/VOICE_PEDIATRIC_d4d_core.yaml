    the Hospital for Sick Children.
  source_caveats: The multi-site Bridge2AI Voice Data Acquisition protocol (USF single IRB)
    records a revision "Modified to include pediatric cohort under single IRB" (V2, May 3,
    2023), and also states that Canadian institutions, including SickKids, do not abide by
    the single IRB process and apply for a separate research ethics board approval. The pediatric
    PhysioNet page names the Hospital for Sick Children Research Ethics Board.
