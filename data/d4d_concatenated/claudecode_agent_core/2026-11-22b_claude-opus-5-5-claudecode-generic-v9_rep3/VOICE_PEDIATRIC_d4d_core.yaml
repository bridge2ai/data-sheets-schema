distributions:
- description: Derived audio data features. Binary files are made available as Parquet, an
    open-source column-oriented data file format; each element contains participant_id, session_id,
    task_name, n_frames and the tensor data for the feature. The folder also contains a plain-text
    file of static features (static_features.tsv). Each data file is associated with a data
    dictionary file with the same file stem and a JSON suffix, whose keys are the column names
    of the associated data file and whose description value gives a one-sentence summary of
    each column.
  id: doi:10.13026/mf9s-5r03#features
  name: features
  path: features
  source_caveats: The usage examples on the PhysioNet page name torchaudio_spectrogram.parquet
    and torchaudio_mel_spectrogram.parquet, and the data dictionary example names torch_spectrogram.json,
    while the file listing names torchaudio_spectrograms.parquet and torchaudio_mel_spectrograms.parquet;
    the listed names are recorded. The page also names audio_quality_metrics.tsv without stating
    which folder holds it, so that file is described in the dataset description rather than
    listed in a collection.
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-spectrograms
  name: torchaudio_spectrograms.parquet
- description: Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms
    hop length, a 400-point FFT and 60 Mel bins (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-mel-spectrograms
  name: torchaudio_mel_spectrograms.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters
    as the mel spectrograms (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-mfcc
  name: torchaudio_mfcc.parquet
- description: Detected pitch (fundamental frequency) over time, of dimension T, with a minimum
    and maximum pitch of 80 and 500 respectively (n=23533).
  id: doi:10.13026/mf9s-5r03#file-torchaudio-pitch
  name: torchaudio_pitch.parquet
- description: Estimated electromagnetic articulography (EMA) using a deep learning model,
    with dimensions Tx12 corresponding to X/Y positions of six articulators (tongue dorsum,
    tongue body, tongue tip, lower incisor, upper lip, lower lip) (n=23532).
  id: doi:10.13026/mf9s-5r03#file-sparc-ema
  name: sparc_ema.parquet
- description: Estimated loudness based on the average absolute amplitude of the audio waveform,
    of size T, using 20ms windows (n=23532).
  id: doi:10.13026/mf9s-5r03#file-sparc-loudness
  name: sparc_loudness.parquet
- description: Estimated periodicity (confidence of pitch presence) derived from the audio
    using 20ms windows, of dimension T (n=23532).
  id: doi:10.13026/mf9s-5r03#file-sparc-periodicity
  name: sparc_periodicity.parquet
- description: Estimated fundamental frequency (F0) of the audio signal using a different
    algorithm, with a range of 50-550Hz and dimension T (n=23532).
  id: doi:10.13026/mf9s-5r03#file-sparc-pitch
  name: sparc_pitch.parquet
- description: Phonetic posteriorgram probabilities across 40 phoneme categories, of dimension
    40xT, with a frame rate of 100Hz (n=23533).
  id: doi:10.13026/mf9s-5r03#file-ppgs
  name: ppgs.parquet
- description: Static features derived with openSMILE, Praat, parselmouth and torchaudio.
  format: TSV
  id: doi:10.13026/mf9s-5r03#file-static-features
  media_type: text/tab-separated-values
  name: static_features.tsv
- description: Phenotypic information acquired during data collection; a phenotype file can
    be loaded with any statistical analysis tool.
  id: doi:10.13026/mf9s-5r03#phenotype
  name: phenotype
  path: phenotype
- description: Phenotype file named in the release's usage example.
  format: TSV
  id: doi:10.13026/mf9s-5r03#file-demographics
  media_type: text/tab-separated-values
  name: demographics.tsv
- description: Metadata information for the recordings; release 1.1 added per-recording metadata
    information.
  id: doi:10.13026/mf9s-5r03#metadata
  name: metadata
  path: metadata
purposes:
- name: Ethically sourced flagship voice dataset
  response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset
    to enable future research in artificial intelligence and support critical insights into
    the use of voice as a biomarker of health.
addressing_gaps:
- name: Lack of open pediatric voice datasets for machine learning
  response: Data collection in pediatric populations poses challenges such as privacy issues,
    consent processes and the need for developmentally appropriate tasks; these factors have
    contributed to the lack of publicly available pediatric data sets that enable machine
    learning for pediatric voice analysis.
