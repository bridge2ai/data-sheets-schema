purposes:
- response: The project's overarching goal, as stated in the NIH RePORTER abstract, is to
    develop a publicly available, AI-ready critical care dataset, while ensuring the methods
    promote privacy, accountability, and clinical benefit.
- response: The goal of the CHoRUS Network, as stated in the GitHub organization overview
    (captured 2025-11-14), is to develop the most diverse, high-resolution, ethically sourced,
    AI-ready data set to answer the grand challenge of improving recovery from acute illness.
tasks:
- response: Characterizing acute and critical care illness (an ML/AI application the NIH RePORTER
    abstract says the project will generate data for).
- response: Predicting complications (an ML/AI application the NIH RePORTER abstract says
    the project will generate data for).
- response: Measuring treatment response among patients with acute or critical illness (an
    ML/AI application the NIH RePORTER abstract says the project will generate data for).
