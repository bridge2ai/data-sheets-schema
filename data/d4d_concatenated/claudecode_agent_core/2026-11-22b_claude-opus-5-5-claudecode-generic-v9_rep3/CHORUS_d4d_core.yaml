collection_mechanisms:
- mechanism_details: Retrospective data collection (September 2025 webinar).
- mechanism_details: Data contributing sites create and curate a CHoRUS-specific clinical
    data extract and contribute it following the step-by-step process for extracting and contributing
    clinical data to CHoRUS in the Chorus_SOP workflow. The CHoRUS GitHub organization (overview
    captured 2025-11-14) provides standard operating protocols (SOPs) instructing data contributing
    sites about best practices for curating and delivering interoperable datasets, and lists
    a repository with tools to create and upload a CHoRUS Data Extract.
preprocessing_strategies:
- preprocessing_details: 'Semantic mapping and validation take place within CHoRUS, with clinical
    expertise contributing to them: the GitHub organization overview (captured 2025-11-14)
    states that its repositories provide validated semantic mappings for connecting clinical
    data in various source formats to international standards, that a chorus-mapping repository
    holds documentation and pooled tabular mappings along with an associated clinical validation
    SOP, and refers to downstream analytics on the mapped and assembled dataset.'
