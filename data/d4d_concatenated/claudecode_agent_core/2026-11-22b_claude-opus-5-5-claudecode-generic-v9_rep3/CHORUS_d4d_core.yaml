name: CHoRUS
description: 'CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards)
  is the dataset of the CHoRUS project, one data generation project of four in the National
  Institute of Health (NIH) funded Bridge2AI consortium. The CHoRUS project is the collection
  of multi-modal data across 14 different hospitals; the GitHub organization overview (captured
  2025-11-14) states that the collaboration spans 20 academic centers, of which 14 will contribute
  as data acquisition centers. The project website reports a current released dataset of 50,000
  patient admissions from ICU, PICU, and NICU, 1.6 billion rows of EHR OMOP data, 7,642 admissions
  with radiology data, and 23 Tb of waveform data, and describes an anticipated final dataset
  of 100,000 patient admissions, 9 different data modalities, and 14 data contributing hospitals,
  with 60+ CHoRUS consortium members across 20 different institutions. An AIM-AHEAD informational
  webinar (September 2025) states that, as of August 2025, the dataset covers 14 different
  hospitals with over 45K unique admissions; that OMOP and telemetry data are in the enclave,
  except that clinical notes are stored locally except tokens; that imaging currently has
  1000 images available; and that EEG extraction is in process. The team creates tools to
  support the cloud enclave. The NIH RePORTER abstract states the project''s plans: to acquire
  an AI-ready data set from more than 100,000 critically ill patients; to develop capabilities
  to acquire, standardize, tokenize, store, visualize, and label data such as structured electronic
  health record data, tokenized unstructured electronic health record data, telemetry and
  EEG waveforms, imaging, and social determinants of health; and to standardize data to the
  OMOP Common Data Model and transform data using approaches that limit re-identification.'
notes: 'Contact listed on the project website: Ciera McCrary, MGH, Program Manager, cmccrary@mgh.havard.edu
  (address as written on the site).'
source_caveats: 'The project website carries the banner "This repoitory is under review for
  potential modification in compliance with Administration directives." The admission figures
  are treated as compatible rather than conflicting: the webinar reports over 45K unique admissions
  as of August 2025 and the undated project website (ranked higher in the source manifest)
  reports 50,000 admissions in the current released dataset. The webinar''s 1000 available
  images and the website''s 7,642 admissions with radiology data count different units and
  are not compared. The NIH RePORTER abstract describes plans (future tense), recorded here
  as plans. The GitHub organization overview is historical documentation captured 2025-11-14,
  ranked lowest in the source manifest. Its statement "This project is licensed under the
  MIT License" concerns the GitHub project; no document states a license for the dataset itself,
  so the dataset license is left empty. The people listed as creators are named in the documents
  as the Bridge2AI CHoRUS Leadership Team; the documents do not state individual dataset authorship
  or contributor roles. In the webinar''s data table the extracted text interleaves columns,
  so access-control, metadata and "Planned" cells cannot be reliably attributed to rows; only
  data-standard pairings that sit beside their data type are recorded. "23 Tb" is the website''s
  unit as written.'
