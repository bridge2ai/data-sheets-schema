errata:
- erratum_details: Release 3.1.0 fixed broken parquet files from the previous release.
updates:
  frequency: semi-annual (twice a year)
  update_details: The dataset is released as static versions rather than dynamically updated.
    The project documentation states further releases will contain additional data, and the
    healthsheet states further versions will be released on a semi-annual basis.
  source_caveats: The healthsheet states updates will be distributed as new versions on the
    Health Data Nexus platform, whereas releases 1.1 through 3.1.0 are on PhysioNet.
retention_limit:
  retention_details: Once data is contributed, the data will be retained as long as it is
    useful for research purposes, possibly indefinitely.
version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
  - '1.0: initial release, 12,523 recordings for 306 participants collected across five sites
    in North America; Health Data Nexus, https://doi.org/10.57764/qb6h-em84'
  - '1.1: https://doi.org/10.13026/249v-w155'
  - '3.0.0: 833 participants across five sites in North America; https://doi.org/10.13026/k81f-qr68'
  - '3.1.0: https://doi.org/10.13026/8xbn-nq66'
  version_details: 'Release notes: v1.1 added Mel-frequency cepstral coefficients (MFCCs);
    v2.0 provided data for an additional 136 new participants; v2.0.1 made corrections in
    the authorship list; v3.0.0 was a major update with new data for an additional 391 participants;
    v3.1.0 was a minor update with no new participants but some additional data released for
    certain participants, adding files related to audio quality metrics and per-audio metadata,
    updated validated diagnosis information with back-filled information, and some phenotypic
    files rearranged and gold standard variables renamed. An earlier version of the feature-only
    dataset is available on Health Data Nexus, which provides cloud compute alongside the
    dataset rather than allowing data downloads. The healthsheet, which describes distribution
    through the Health Data Nexus platform, states the data was published and made available
    at the end of November 2024. By default, older versions continue to be supported, hosted,
    and made available, each version has a unique DOI, and the publishers reserve the right
    to remove access to older versions. A changelog for each dataset version is published
    online with the dataset metadata.'
extension_mechanism:
  description: Others may publish a derivative dataset on the Health Data Nexus which references
    the original source.
  extension_details: The open-source preprocessing repository has a pull-request mechanism
    for contributing improvements to the data preprocessing code.
ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: Data collection and sharing was approved by the University of South Florida
    Institutional Review Board; the project documentation states the study was submitted and
    approved by the USF Single IRB and subsite IRBs through the Single IRB process.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - Submitted and approved by the USF Single IRB and subsite IRBs through the Single IRB process.
  description: The IRB protocol describes a prospective cohort study; the project documentation's
    study metadata describe an observational study with a cohort observation model and a cross-sectional
    time perspective.
informed_consent:
- consent_obtained: true
  description: Patient consent was sought for the data collection initiative and to share
    the acquired research data; all participants were informed and agreed to the collection
    and the use of their data via prospective informed consent.
  consent_scope: Research data that does not contain direct identifiers will be shared with
    external researchers for future research through a secure database. Data that poses a
    low risk of re-identification will be shared in registered access, and data that would
    pose a heightened risk of re-identification if shared in full open access will be shared
    through a controlled access mechanism with authorized researchers.
  consent_documentation: Per the IRB protocol, participants may consent by signing a physical
    paper copy, by indicating electronic consent within the app or through REDCap surveys,
    or through video recording within the app.
license_and_use_terms:
  license_terms: Only credentialed users who sign the DUA can access the files. Access requires
    registration on PhysioNet and signing the Bridge2AI Voice Registered Access Agreement,
    which outlines the terms and conditions for data use; no training is required. The dataset
    is intended solely for commercial and non-commercial research purposes by Authorized Researchers.
ip_restrictions:
  restrictions:
  - Intellectual property protections, database rights, or related rights may not be used
    in a manner that restricts or limits access to any part of the dataset or to any conclusions
    derived from it.
  - Sale of all or part of the Data on any media is not permitted.
  - Users agree not to make intellectual property claims on the Data.
  - Users agree to respect the Fort Lauderdale Agreement.
  notes: There are no fees associated with these restrictions.
regulatory_restrictions:
  other_compliance: Certificate of Confidentiality (the DTUA template marks the data as covered
    under a Certificate of Confidentiality).
data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: 'The feature-only and raw audio datasets are available under distinct
    agreements appropriate for the sensitivity of their content. Controlled access to raw
    audio data: complete the Data Access Request Form (DARF) and the Data Use Agreement (DUA),
    submit the application to the Data Access Compliance Office for review, and upon approval
    ensure a Data Use and Transfer Agreement (DTUA) is signed by an authorized official at
    the requesting institution. Collaborators at other research organizations, and other research
    teams at the same organization, must apply independently and sign their own DTUA.'
  notes: Per the DTUA template, the agreement ends two years after the start date, upon completion
    of the project, upon expiration of the applicable ethics approval, or on termination by
    the provider institution, whichever occurs first.
is_deidentified:
  method: HIPAA Safe Harbor identifiers were removed; the project documentation states the
    dataset applies the HIPAA de-identification rules, and that it was de-identified through
    removal of all audio data and certain sensitive fields identified by a team of ethicists.
  identifiers_removed: All direct identifiers, including name, civic address, and social security
    numbers; state and province (country of data collection was retained).
  deidentification_details: Identifiable information (under HIPAA and the Common Rule), as
    well as data considered sensitive, have been removed. Indirect identifiers were removed
    where these created a significant risk of participant re-identification. All raw voice
    data was removed, as this data has the potential to cause individual re-identification
    or to be used for illicit or unauthorized purposes. Raw audio transcripts were reviewed,
    and any audio recordings that contained potentially identifying information and external
    voices were removed from the release. Spectrograms and similar features were excluded
    if the audio contained free speech; static and other features which do not encode the
    sensitive information were retained. Spectrograms, Mel spectrograms, MFC coefficients,
    PPGs, and EMAs for sensitive records and audio checks have been removed from v3.1. The
    documentation also states that spectrograms, MFCCs, Mel spectrograms, transcriptions,
    EMAs, and PPGs from open-response prompts are removed from the feature-only dataset.
