title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
version: 3.1.0
id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
description: A large, ethically sourced, and demographically diverse voice dataset linked
  to health information, released by the NIH Bridge2AI initiative. Version 3.1.0 contains
  data for 833 participants across five sites in North America; the healthsheet names the
  countries of data collection as the USA and Canada and states that five recording sites
  are included. The release contains data considered low risk, including derived audio features
  such as spectrograms but not the original voice recordings, together with detailed demographic,
  clinical, and validated questionnaire data and metadata related to the specific audio task
  and recording. The underlying samples come from conventional acoustic tasks including respiratory
  sounds, cough sounds, and free speech prompts.
source_caveats: 'Language: the healthsheet states English was used for communication with
  study participants and that the only language option for v2.0.0 is English, with Spanish
  versions of the protocol under development; the IRB protocol revision of February 10, 2025
  (V11) was updated to include data collection from Spanish language speakers. No source states
  whether release 3.1.0 contains any Spanish-language data.'
