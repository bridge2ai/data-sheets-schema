distributions:
- description: Derived audio data features. Binary files are made available as Parquet, an
    open-source column-oriented data file format; each parquet element contains a participant
    identifier, a recording session identifier, the task performed, the number of time frames,
    and the tensor data for the feature. All files are associated with a data dictionary file
    which has the same file stem and a JSON suffix.
  id: doi:10.13026/37yb-1t42#features
  name: features
  path: features
  source_caveats: The directory listing names torchaudio_spectrogram.parquet and torchaudio_mel_spectrogram.parquet,
    while the per-file descriptions name them torchaudio_spectrograms.parquet and torchaudio_mel_spectrograms.parquet;
    the listing names are recorded.
- description: Phonetic posteriorgram probabilities across 40 phoneme categories (40xT, 100Hz
    frame rate); n=29289.
  id: doi:10.13026/37yb-1t42#file-ppgs.parquet
  name: ppgs.parquet
- description: Estimated electromagnetic articulography (EMA) from a deep learning model,
    dimensions Tx12 (X/Y positions of six articulators); n=28640.
  id: doi:10.13026/37yb-1t42#file-sparc_ema.parquet
  name: sparc_ema.parquet
- description: Estimated loudness based on the average absolute amplitude of the audio waveform,
    20ms windows; n=31855.
  id: doi:10.13026/37yb-1t42#file-sparc_loudness.parquet
  name: sparc_loudness.parquet
- description: Estimated periodicity (confidence of pitch presence), 20ms windows; n=31872.
  id: doi:10.13026/37yb-1t42#file-sparc_periodicity.parquet
  name: sparc_periodicity.parquet
- description: Estimated fundamental frequency (F0), range 50-550Hz; n=31872.
  id: doi:10.13026/37yb-1t42#file-sparc_pitch.parquet
  name: sparc_pitch.parquet
- description: Spectrograms of dimension 201xT (short-time FFT, 25ms window, 10ms hop, 400-point
    FFT); n=29278.
  id: doi:10.13026/37yb-1t42#file-torchaudio_spectrogram.parquet
  name: torchaudio_spectrogram.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60xT; n=29278.
  id: doi:10.13026/37yb-1t42#file-torchaudio_mfcc.parquet
  name: torchaudio_mfcc.parquet
- description: Detected pitch (fundamental frequency) over time, dimension T, min and max
    pitch of 80 and 500; n=32522.
  id: doi:10.13026/37yb-1t42#file-torchaudio_pitch.parquet
  name: torchaudio_pitch.parquet
- description: Mel spectrograms of dimension 60xT (25ms window, 10ms hop, 400-point FFT, 60
    Mel bins); n=29278.
  id: doi:10.13026/37yb-1t42#file-torchaudio_mel_spectrogram.parquet
  name: torchaudio_mel_spectrogram.parquet
- description: One feature per audio recording derived from the raw audio related to quality
    control metrics.
  format: TSV
  id: doi:10.13026/37yb-1t42#file-audio_quality_metrics.tsv
  media_type: text/tab-separated-values
  name: audio_quality_metrics.tsv
- description: Features derived from the raw audio (openSMILE, Praat, parselmouth, torchaudio),
    with one row per unique recording.
  format: TSV
  id: doi:10.13026/37yb-1t42#file-static_features.tsv
  media_type: text/tab-separated-values
  name: static_features.tsv
- description: A binary file made available as Parquet and its corresponding data dictionary,
    with specific information about each recording, including task instructions and prompts
    and information about the microphone used and its gain.
  id: doi:10.13026/37yb-1t42#metadata
  name: metadata
  path: metadata
- description: Organized information collected from the participant or other individual during
    their encounter, in TSV data files with JSON data dictionaries, under the subfolders confounders,
    demographics, diagnosis, enrollment, questionnaire, and task. Dictionary entries give
    a one-sentence description of each column, the question (if any) that was asked the participant
    to prompt the answer, and the data type of the response.
  id: doi:10.13026/37yb-1t42#phenotype
  name: phenotype
  path: phenotype
purposes:
- response: The Bridge2AI-Voice consortium aims to generate a large-scale, ethically sourced
    voice, speech, and cough database linked to health metadata in order to support AI-driven
    research.
- response: Bridge2AI-Voice seeks to create a flagship, standardized, and ethically sourced
    dataset of 10,000 voices linked to health information to fuel research and discovery in
    voice biomarkers (a stated target, not a count of the current release).
  source_caveats: Target sizes differ across sources. The project documentation (manifest
    tier 2) states a flagship dataset of 10,000 voices; the IRB protocol (also tier 2) states
    a sample size of 30 000 participants; the JAMA Otolaryngology viewpoint (tier 3) states
    a primary deliverable of a publicly available database of 30 000 human voices. The two
    tier-2 sources share a rank and are targets stated at different times, so both are recorded
    rather than one selected. Version 3.1 contains data for 833 participants.
- response: 'Specific Aim 1 of the NIH project: to build a multi-modal, multi-institutional,
    large scale, diverse and ethically sourced human voice database linked to other biomarkers
    of health that is AI/ML friendly to fuel voice AI research.'
- response: To facilitate the use of voice as a non-invasive, cost-effective biomarker for
    the screening, diagnosis, and monitoring of a wide range of health conditions.
tasks:
- response: The tasks are primarily designed for training machine-learning models for disease
    detection and classification using voice data.
addressing_gaps:
- response: Existing literature has studied voice only in small- to medium-sized data sets
    with limited data outside of acoustic measures, not linked to multi-modal health data.
- response: Comparing studies and pooling data is challenging due to a lack of existing standards
    in how voice and other acoustics are measured and collected.
- response: The dataset was created to address a gap in the availability of large-scale, diverse,
    and well-documented voice data for use in clinical machine-learning applications; previous
    studies' sample sizes were too small, or they lacked the key metadata needed for training
    robust, clinically useful models.
