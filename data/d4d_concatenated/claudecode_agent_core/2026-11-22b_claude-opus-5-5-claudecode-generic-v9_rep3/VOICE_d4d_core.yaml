  - grant_number: 3OT2OD032720-01S1
    name: 'Bridge2AI: Voice as a Biomarker of Health - Building an ethically sourced, bioaccoustic
      database to understand disease like never before'
  source_caveats: OT2OD032720 is the core project number in NIH RePORTER and the study ID
    in the project documentation; the JAMA Otolaryngology viewpoint cites award OT2 OD032720.
