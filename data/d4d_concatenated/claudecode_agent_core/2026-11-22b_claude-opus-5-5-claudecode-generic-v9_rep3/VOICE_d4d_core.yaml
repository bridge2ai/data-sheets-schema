instances:
- instance_type: person
  counts: 833
  label: true
  label_description: Labels include diagnostic categories such as vocal pathologies, neurological
    disorders, psychiatric conditions, and respiratory disorders.
  notes: A subset of participants required multiple sessions to complete the data collection,
    so there may be more than one session per participant; there is no requirement the participant
    provide the same response for each visit, so participant information for the same data
    element may vary across the data file.
anomalies:
- anomaly_details: Different sites have different collection configurations, and the collection
    protocol changed over the course of the study.
known_biases:
- bias_description: Groups that have less trust in the medical system, AI, or are less proximal
    to the collection sites would have been less likely to be recruited.
- bias_description: Participants were screened for different disorders based on site, so they
    also had their data collected with different devices.
- bias_description: The dataset has skews based on disorder category, site, and other demographic
    factors.
  mitigation_strategy: Users should consider the multivariate distribution when assessing
    utility for different questions.
known_limitations:
- limitation_description: The public data releases do not contain an equal distribution of
    the disease categories.
- limitation_description: Certain aspects of the data (e.g., transcription) were generated
    using off-the-shelf models that have not been audited for correctness.
- limitation_description: Distinct iPad devices were used at each site, and the data were
    recorded with a head-mounted headset with a microphone that could be at slightly different
    distances.
- limitation_description: Changes in diagnostic criteria or practices could be a source of
    distribution shift.
- limitation_description: 'Confounding factors that might be present in the data: noise artifacts,
    variations in diagnostic practices, inaccurate questionnaire responses, and underreporting.'
content_warnings:
- warnings:
  - The healthsheet states the dataset includes the transcription of free speech tasks; while
    the inclusion of offensive, threatening, or otherwise unsafe content of that type is unlikely,
    it cannot be completely avoided, as research participants are responsible for their choice
    of language.
  source_caveats: The same project documentation states that transcriptions from open-response
    prompts are removed from the feature-only dataset, the v1.1 release notes state transcripts
    of free speech audio were removed, and the PhysioNet 3.1.0 file description names no transcript
    file; whether release 3.1.0 contains any transcriptions is not established by the sources.
subpopulations:
- identification: Age, Gender, Sex, Ethnicity, Socioeconomic status
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset includes race information.
- sensitive_elements_present: true
  sensitivity_details: The dataset includes sexual orientation information.
- sensitive_elements_present: true
  sensitivity_details: The dataset includes socioeconomic and health information.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: The data was directly observable and reported by subjects. Clinical
    validation is performed by a qualified physician or practitioner based on established
    gold standards for diagnosis; clinical diagnoses were verified by clinicians reviewing
    audio and/or imaging data, looking at electronic health records, or medication prescriptions.
collection_mechanisms:
- name: Bridge2AI-Voice App
  description: A novel smartphone application created to collect standardized recordings of
    acoustic tasks, validated patient questionnaires, and validated patient reported outcomes;
    data collection is performed via the app, which is linked to electronic health records
    (EHR).
  mechanism_details: The app collects breathing sounds and voice, speech, and linguistic tasks,
    along with health information through surveys and validated questionnaires. A total of
    22 acoustic tasks are recorded through the app. Detailed demographic data and surveys
    about confounding factors such as smoking and drinking history are collected through the
    app. The healthsheet states the data were collected using an iPad app; the PhysioNet release
    states data collection was conducted using a custom application on a tablet with a headset
    used when possible.
- name: Recording hardware
  mechanism_details: Data is collected on iPads (9th or 10th generation) and iPad Air (5th
    generation) using an Avid AE-36 microphone and an Apple dongle to connect it to the iPad.
collection_timeframes:
- timeframe_details: The healthsheet states the data was collected over a period of 12 months.
  source_caveats: The healthsheet answer is not tied to a named release, and no collection
    start or end date is stated for release 3.1.0.
data_collectors:
- description: Data is collected in the clinic with the assistance of a trained research assistant.
  collector_details: Research teams, which may include medical, graduate, or undergraduate
    students, coordinated with clinicians/doctors to identify appropriate participants.
missing_data_documentation:
- missing_data_causes: Some questions are optional, and data collection irregularities may
    have caused some information to be missing from individual instances.
  missing_data_patterns: Each individual answered a common set of questions and then responded
    to additional questions relevant to their primary diagnostic category.
  handling_strategy: Phenotype data files only contain rows for a participant if at least
    one column is not missing.
- missing_data_causes: Some files, whether due to length or other issues, could not generate
    certain features and so are not included in the bundled data.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies: Non-probability sample
  why_not_representative: The data is not representative because it was collected at a limited
    number of geographic locations.
  description: A sample of a larger, ongoing collection. Participants were selected based
    on known conditions which manifest within the voice waveform, including voice disorders,
    neurological disorders, mood disorders, and respiratory disorders. Participants are recruited
    across different academic institutions from high volume expert clinics (outpatient clinics
    within hospital systems or academic institutions that have developed an expertise in a
    specific disease area and see more than 50 patients per month from the same disease category),
    based on diagnosis and inclusion/exclusion criteria. Patients presenting at the given
    clinic were screened for inclusion and exclusion criteria prior to their visit by the
    project investigators. The project documentation's study metadata state a minimum age
    of 18 years, a maximum age of 120 years, and that healthy volunteers are accepted; its
    exclusion criteria include not reading or speaking English, and its disease-cohort table
    and the IRB protocol exclude having had a surgical intervention significantly altering
    the symptoms of the disease studied.
  source_caveats: The English-only exclusion is from the project documentation; the IRB protocol
    revision of February 10, 2025 (V11) was updated to include data collection from Spanish
    language speakers, so the language criterion applied to release 3.1.0 participants is
    not established.
raw_sources:
- name: Raw audio recordings
  description: The published Bridge2AI-Voice Adult Dataset contains derived features from
    the audio waveforms; the PhysioNet project does not contain raw audio. Raw audio is available
    under a controlled access mechanism.
  raw_data_details: Raw audio data is disseminated through controlled access only to protect
    participants' privacy. The healthsheet states the raw data is saved and is not accessible
    publicly. Accessing raw audio requires institutional sign off; requests go to the access
    committee (DACO@b2ai-voice.org), and data will be made available via Synapse. The raw
    audio files and questionnaire data were converted to be compliant with the Brain Imaging
    Data Structure v1.9.0.
  access_url: https://www.synapse.org/Synapse:syn72370534/
preprocessing_strategies:
- description: Features were extracted from the raw audio to limit re-identification, and
    only the extracted features are released with the dataset.
  preprocessing_details: Data were exported and converted from REDCap using an open source
    library developed by the team.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    url: https://github.com/sensein/b2aiprep
    version: 3.0.0
    description: Organizing and preprocessing the dataset; release 3.1.0 was generated with
      b2aiprep v3.0.0.
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Processing audio files for research tasks.
- description: The feature-only dataset provides AI-ready derivations from the raw audio (project
    documentation).
  preprocessing_details: Features extracted include OpenSmile eGeMaps features per audio file;
    Parselmouth/Praat speech features for any speech tasks; Torchaudio-based pitch contour,
    spectrograms, mel spectrogram, and MFCCs; Speech Articulatory Coding (sparc)-based features
    including electromagnetic articulography (EMA) estimates, plus loudness, periodicity,
    and pitch measures; and phonetic posteriorgrams (PPGs). Waveform-derived features are
    stored in a fixed feature format of static features extracted from the entire waveform
    and a temporal format that varies for each audio file depending on the length of recording.
- description: Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
    with a Butterworth anti-aliasing filter applied (PhysioNet release 3.1.0).
  preprocessing_details: Spectrograms were computed using the short-time Fast Fourier Transform
    with a 25ms window size, 10ms hop length, and a 400-point FFT, and further downsampled
    by a factor of two in the time domain. 60 MFCCs were extracted from the spectrograms.
    Mel spectrograms were computed with the same parameters and 60 Mels. Articulatory features
    were generated with the Speech Articulatory Coding (sparc) package at 50Hz. Acoustic features
    were extracted using OpenSMILE. Phonetic and prosodic features were computed using Parselmouth
    and Praat. Phonetic posteriorgrams at 100Hz were generated via the ppgs package.
cleaning_strategies:
- description: The dataset has been audited internally for missingness and consistency by
    the data release team; a missingness table is included with the dataset.
  cleaning_details: 'Audit protocol: generate missingness tables; check distributions and
    outliers; for categorical responses, check against schema; for audio tasks, run quality
    control metrics.'
labeling_strategies:
- labeling_details: Diagnostic labels are the result of a clinical assessment of the participant.
    At each site, a local clinician provided the diagnosis based on a clinical interview and
    appropriate work-up. For the psychiatric disorders cohort, this assessment was determined
    by using the participant's EHR record or using an active prescription. A gold standard
    label is available in the data (diagnosed by a clinician).
  annotations_per_item: 1
  annotator_demographics:
  - Typically, the clinician at site of data collection, or external to (for prior diagnostic
    assessment)
  data_annotation_protocol: Per Bridge2AI Protocols and ICD-10 codes.
machine_annotation_tools:
- tools:
  - OpenAI Whisper Large unknown
  tool_descriptions: Transcriptions were generated using OpenAI's Whisper Large model.
existing_uses:
- description: A restricted version of the dataset containing raw audio has been used in the
    Bridge2AI Summer School and hackathon.
discouraged_uses:
- description: Non-research applications such as hiring decisions, insurance premium adjustments,
    or any form of surveillance that could lead to discrimination or harm.
  notes: These limitations are intended to prevent unethical or biased outcomes that could
    negatively impact individuals based on their health conditions or voice characteristics.
  source_caveats: 'The healthsheet states this restriction twice with different wording: once
    as "non-research applications" and once as "non-clinical applications", with the same
    examples. Both statements come from the same documentation source.'
intended_uses:
- description: Development, benchmarking, or validation of clinically applicable machine-learning
    models for diagnosing a wide range of health conditions using voice data.
  examples:
  - AI model pretraining
  - fine-tuning
  - benchmarking
  - validation
- description: Clinical research in disease screening, diagnosis, and monitoring through voice
    biomarkers.
prohibited_uses:
- description: Attempting to re-identify research participants, or any actions that could
    reasonably lead to re-identification (restriction of the Registered Data Access Agreement).
  prohibition_reason: The restrictions reflect the B2AI-Voice Consortium's commitment to advancing
    ethical and trustworthy research practices that respect and protect the rights and interests
    of research participants.
- description: Any purpose that could foreseeably cause harm or stigmatization to research
    participants, their families, communities, or specific populations (restriction of the
    Registered Data Access Agreement).
  prohibition_reason: The restrictions reflect the B2AI-Voice Consortium's commitment to advancing
    ethical and trustworthy research practices that respect and protect the rights and interests
    of research participants.
- description: Under the Data Transfer and Use Agreement template for controlled-access data,
    the recipient will not use the data, alone or with other information, to make any effort
    to contact individuals who are the subjects of the data without appropriate IRB approval,
    specific written approval from the provider, and informed consent from the individual
    where required.
