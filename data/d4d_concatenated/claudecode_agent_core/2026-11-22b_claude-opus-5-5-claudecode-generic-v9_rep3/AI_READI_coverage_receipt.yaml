- id: c002
  status: extracted
  extracted:
  - slot: purposes[0]
    snippet: "to facilitate the widespread use of artificial intelligence and machine learning (AI/ML) approaches to study salutogenesis"
  - slot: human_subject_research.irb_approval
    snippet: "AI- READI was approved by the Institutional Review Board (IRB) of the University of Washington (approval number STUDY00016228)"
  - slot: ethical_reviews[0]
    snippet: "including reliance agreements with the IRBs of University of Alabama at Birmingham and University of California, San Diego"
  - slot: informed_consent[0]
    snippet: "Written informed consent is provided by all participants."
  - slot: sampling_strategies[0]
    snippet: "the study is triple- balanced by recruiting the following populations in equal proportions"
  - slot: sampling_strategies[0].source_data
    snippet: "The study base is all patients aged ≥40 years of age who had a medical encounter within each health system site (UAB, UCSD, UW) between 2020 and 2025"
  - slot: known_biases[0]
    snippet: "there is selection bias known as volunteer bias which may limit the generalis- ability of the results"
  - slot: collection_timeframes[0]
    snippet: "Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023"
  - slot: collection_timeframes[0].start_date
    snippet: "Enrolment began on 18 July 2023"
  - slot: collection_timeframes[1]
    snippet: "The formal data collection process began on 1 December 2023."
  - slot: data_collectors[0]
    snippet: "All research personnel at the three data sites who recruited, enrolled and collected data underwent training by the data manager at UAB"
  - slot: collection_mechanisms[0]
    snippet: "direct them into our online REDCap recruitment inter- face"
  - slot: distribution_dates[0]
    snippet: "were included in the first released data set released in May 2024"
  - slot: subpopulations[0]
    snippet: "four race/ethnic groups (Asian, black, white, Hispanic)"
  - slot: subpopulations[1]
    snippet: "four categories of T2DM (no diabetes, pre- diabetes/lifestyle- controlled"
  - slot: subpopulations[2]
    snippet: "biolog- ical males and females"
  - slot: sampling_strategies[0].strategies
    snippet: "Participants are required to speak, read and understand English. Pregnancy and type 1 diabetes are exclusionary for participation."
- id: c003
  status: extracted
  extracted:
  - slot: collection_mechanisms[1]
    snippet: "A 12- lead ECG is performed (Philips Pagewriter TC30 Cardiograph, Amsterdam, The Netherlands)"
  - slot: collection_mechanisms[2]
    snippet: "Peripheral neuropathy is performed using the monofilament test"
  - slot: collection_mechanisms[3]
    snippet: "A general cogni- tive screener is carried out using the Montreal Cognitive Assessment12 (MoCA), administered electronically on an iPad using the MoCA Duo Application"
  - slot: collection_mechanisms[4]
    snippet: "Photopic letter visual acuity is measured with the Electronic Visual Acuity tester13 (M&S Technology, Niles, Illinois)"
  - slot: collection_mechanisms[5]
    snippet: "Photopic letter contrast sensitivity is measured with the Mars chart (Mars Perceptrix, Chap- paqua, New York)"
  - slot: collection_mechanisms[6]
    snippet: "using the autorefractor’s standard protocol (Topcon KR 800, Topcon Healthcare, Oakland, New Jersey)"
  - slot: collection_mechanisms[7]
    snippet: "Blood (non- fasting) and urine samples are collected from participants during the visit."
  - slot: data_collectors[1]
    snippet: "Amendments- certified laboratories local to each data collection site perform complete blood count (CBC) testing on fresh whole blood samples"
  - slot: data_collectors[2]
    snippet: "all other lab tests are performed by the University of Washington Nutrition and Obesity Research Center (NORC) testing facility using stored, frozen samples"
- id: c004
  status: extracted
  extracted:
  - slot: preprocessing_strategies[0]
    snippet: "some images required conver- sion to a DICOM standard format prior to upload"
  - slot: collection_mechanisms[8]
    snippet: "(1) home environmental sensor"
  - slot: collection_mechanisms[9]
    snippet: "(2) Garmin fitness tracker"
  - slot: collection_mechanisms[10]
    snippet: "(3) Dexcom Continuous Glucose Monitor (CGM)"
  - slot: collection_mechanisms[10].description
    snippet: "Participants are masked to the results from the Dexcom CGM during the monitoring period."
  - slot: collection_mechanisms[8].mechanism_details
    snippet: "Coordinators provide instructions on how to use these monitoring devices continuously for 10 days."
  - slot: participant_privacy[0]
    snippet: "These devices do not capture video or audio, are not equipped with GPS location monitoring and are not synced with participant- owned devices."
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "REDCap is used for collecting patient- reported data from questionnaires"
  - slot: raw_data_sources[0]
    snippet: "format to local storage: ECG (.xml)"
  - slot: raw_data_sources[6]
    snippet: "MoCA Duo applica- tion (total score, section subscores, Memory Index Score and task completion times; .csv)"
  - slot: publisher
    snippet: "the AI- READI- specific data management platform called FAIRhub (https://fairhub.io/)"
  - slot: raw_data_sources[1]
    snippet: "Blood and urine testing by the NORC lab is provided in .csv format."
  - slot: preprocessing_strategies[1]
    snippet: "All data are mapped to applicable data standard formats, such as the Observational Medical Outcomes Partnership Common Data Model for clinical data and the DICOM format for retinal imaging."
  - slot: cleaning_strategies[0]
    snippet: "The Data Manager at each data site is responsible for the quality control of all data before uploading to FAIRhub."
  - slot: updates.frequency
    snippet: "Deidentified data are released approximately yearly in two data sets"
  - slot: source_caveats
    snippet: "more sensitive data that are only available for use by scientists whose institutions have completed legal and privacy use agreements with the AI- READI research programme"
