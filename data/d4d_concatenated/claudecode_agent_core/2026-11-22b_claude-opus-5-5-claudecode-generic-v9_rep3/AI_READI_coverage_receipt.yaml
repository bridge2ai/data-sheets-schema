- id: c011
  status: extracted
  extracted:
  - slot: title
    snippet: "This is the documentation for the AI-READI dataset called Flagship Dataset of Type 2 Diabetes from the AI-READI Project"
  - slot: version
    snippet: "Version: 3.0.0"
  - slot: description
    snippet: "The AI-READI is a dataset consisting of data collected from individuals with and without Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data collection sites."
  - slot: purposes[0]
    snippet: "The goal is to better understand salutogenesis (the pathway from disease to health) in T2DM."
  - slot: sampling_strategies[0]
    snippet: "recruitment sampling procedures aimed at achieving approximately equal distribution of participants across diabetes severity"
  - slot: addressing_gaps[3]
    snippet: "to enable downstream AI/ML analyses that may not be feasible with existing data sources such as claims or electronic health records data"
  - slot: source_caveats
    snippet: "The full dataset will be accessible by entering into a data use agreement."
  - slot: source_caveats
    snippet: "The data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic and accident reports."
  - slot: known_limitations[1]
    snippet: "As enrollment is ongoing, the pilot data release and periodic updates to data releases may not have achieved balanced distribution across groups."
  - slot: version_access.source_caveats
    snippet: "This documentation is associated with v3.0 of the dataset, which contains data from the participants of the pilot study phase."
  - slot: version_access.versions_available
    snippet: "There is one version of this documentation associated with each version of the AI-READI dataset."
