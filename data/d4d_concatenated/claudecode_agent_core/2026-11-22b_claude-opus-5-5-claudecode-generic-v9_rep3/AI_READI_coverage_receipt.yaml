- id: c007
  status: extracted
  extracted:
  - slot: purposes[0]
    snippet: "The primary goal of AI-READI is to collect and publicly share a multimodal, AI-ready dataset for studying the pathogenesis and salutogenesis"
  - slot: addressing_gaps[1]
    snippet: "a major barrier has been the lack of diverse datasets that are AI ready1 for training AI models, which the AI-READI project is designed to address"
  - slot: sampling_strategies[0].notes
    snippet: "AI-READI is enrolling 4,000 participants at three study sites over 4 years (2022–2026)"
  - slot: sampling_strategies[0].strategies
    snippet: "The recruitment process consists of a selection of individuals based on the available clinical diagnosis using ICD-10 codes and demo- graphic data from the electronic health records of study sites."
  - slot: source_caveats
    snippet: "Driving record (accident report)"
  - slot: collection_mechanisms[18]
    snippet: "Vision testing (lensometer, autorefraction"
  - slot: collection_mechanisms[9]
    snippet: "Garmin Vivosmart 5 for physical activity monitoring"
  - slot: collection_mechanisms[10]
    snippet: "using a Dexcom G6 for continuous glucose monitoring"
  - slot: collection_mechanisms[8]
    snippet: "a custom-built environmental sensor for indoor environmental parameter measurements"
  - slot: updates.frequency
    snippet: "Data are released annually, and each version is accessible through FAIRhub."
  - slot: is_deidentified.method
    snippet: "The public set is stripped of Protected Health Information (PHI), as defined by the HIPAA (Health Insurance Portability and Accountability Act) Privacy Rule via the “Safe Harbor” method"
  - slot: is_deidentified.identifiers_removed
    snippet: "as well as information related to the sex and race/ethnicity of the participants to prevent stigmatization of findings"
  - slot: license_and_use_terms.license_terms
    snippet: "a new licence developed as part of this project that allows reuse for any purpose but includes restrictions to protect participant privacy"
  - slot: participant_privacy[1]
    snippet: "To prevent reidentifi- cation attempts, we are implementing a robust data dissemination system, a strict licence agreement and data watermarking for both public and controlled sets."
