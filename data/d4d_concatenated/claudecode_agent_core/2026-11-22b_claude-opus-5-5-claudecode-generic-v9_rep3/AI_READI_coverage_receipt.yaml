  - slot: sampling_strategies[0]
    snippet: "recruitment sampling procedures aimed at achieving approximately equal distribution of participants across sex, race, and diabetes severity"
  - slot: cleaning_strategies[1]
    snippet: "the dataset has been reviewed internally by AI-READI team members for quality checks and to ensure that no personally identifiable information was accidentally included"
  - slot: updates.update_details
    snippet: "The dataset gets released as static versions. This is the third version of the dataset and consists of data collected up through the end of the second year of the study, i.e. between July 19, 2023 and May 1st, 2025."
  - slot: updates.frequency
    snippet: "There are plans to release new versions of the dataset approximately once a year with additional data from participants who have been enrolled since the last dataset version release."
  - slot: version_access.version_details
    snippet: "the first version of the dataset contains data from 204 participants, the second version contains additional data from 863 participants for a total of 1067 participants, and this version contains a total of 2280 participants"
  - slot: version_access.version_details
    snippet: "the Snellen visual acuity variables were dropped in this version of the dataset, such that now only logMAR visual acuity measurements are available"
  - slot: splits[0]
    snippet: "It does include a new recommended data split for the 2280 participants balancing training, validation, and testing sets for age, sex, races/ethnicities, and study group."
  - slot: splits[0].split_details
    snippet: "We are suggesting a split for training/validation/testing models that is aimed at reducing disparities in models developed using this dataset."
  - slot: purposes[0]
    snippet: "The purpose for creating the dataset was to enable future generations of artificial intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including salutogenic pathways to return to health."
  - slot: addressing_gaps[1]
    snippet: "a key issue is the lack of data ready for training AI models. The AI-READI dataset is intended to fill this gap."
  - slot: tasks[0]
    snippet: "The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime manifolds and various applications in artificial intelligence."
  - slot: creators[0]
    snippet: "This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI Consortium."
  - slot: creators[0].description
    snippet: "including senior, mid-career, and early career faculty members as well as clinical research coordinators, staff, and interns"
  - slot: funders[0].grantor
    snippet: "The creation of the dataset was funded by the National Institutes of Health (NIH) through their Bridge2AI Program"
  - slot: funders[0].description
    snippet: "Note that the funding institution is not creating or managing the dataset. The dataset is created and managed by the awardees of the grant"
  - slot: funders[0].grants[0].source_caveats
    snippet: "The grant number is OT2ODO32644"
  - slot: instances[0]
    snippet: "Each instance represents an individual patient."
  - slot: instances[0].counts
    snippet: "There are 2280 instances in this current version of the dataset (version 3, released fall 2025)."
  - slot: instances[0].source_caveats
    snippet: "The dataset contains all possible instances. More specifically, the dataset contains data from all participants who have been enrolled during the first year of data collection for AI-READI."
  - slot: description
    snippet: "Multiple modalities of data are collected for each participant, including survey data, clinical data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable activity monitor data."
  - slot: description
    snippet: "These encompass tabular data, imaging data, and physiological signal/waveform data. There is no unstructured text data included in this dataset."
  - slot: missing_data_documentation[0]
    snippet: "not all modalities are available for all participants. Some participants elected not to participate in some study elements."
  - slot: missing_data_documentation[0].missing_data_causes
    snippet: "In a few cases, the data collection device did not have any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost). In a few cases, there may have been a data collision at some point in the process and data has been lost."
  - slot: relationships[0]
    snippet: "all instances are part of the same prospective data generation project (AI-READI). There is currently only one visit per participant."
  - slot: anomalies[0]
    snippet: "In cases of survey data, skipped questions or incomplete responses are expected."
  - slot: anomalies[1]
    snippet: "In cases of using wearables, improper use, technical failure such as battery failure or system malfunction are expected."
  - slot: anomalies[2]
    snippet: "In cases of imaging data, patient uncooperation, noise that may obscure the images and technical failure such as system malfunction, and data transfer failures are expected."
  - slot: external_resources[0]
    snippet: "The dataset is self-contained but does rely on the dataset documentation for users requiring additional information about the provenance of the dataset."
  - slot: external_resources[0].notes
    snippet: "The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated with its use."
  - slot: source_caveats
    snippet: "the controlled access dataset will contain data regarding racial and ethnic origins, location (5-digit zip code), as well as motor vehicle accident reports"
  - slot: collection_mechanisms[8]
    snippet: "a custom-designed sensor unit called the LeeLab Anura"
  - slot: collection_mechanisms[10].mechanism_details
    snippet: "The Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM) that directly monitors blood glucose levels without requiring finger sticks."
  - slot: collection_mechanisms[9].mechanism_details
    snippet: "The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure data related to physical activity."
  - slot: collection_mechanisms[19]
    snippet: "OMRON HEM 907XL Blood Pressure Monitor"
  - slot: collection_mechanisms[20]
    snippet: "Medline MDS4001 Automatic Digital Blood Pressure Monitor"
  - slot: collection_mechanisms[21]
    snippet: "Welch Allyn 6000 series Vital signs monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff"
  - slot: collection_mechanisms[4].mechanism_details
    snippet: "M&S Technologies EVA device to test visual acuity. The test is administered at a distance of 4 meters from a touch-screen monitor that is 12x20 inches."
  - slot: collection_mechanisms[5].mechanism_details
    snippet: "The MARS Letter Contrast Sensitivity test (Perceptrix) was conducted monocularly under both Photopic conditions (with a general occluder) and Mesopic conditions"
  - slot: collection_mechanisms[6].mechanism_details
    snippet: "KR 800 Auto Keratometer/Refractor."
  - slot: collection_mechanisms[18]
    snippet: "NIDEK LM-600P Auto Lensometer"
  - slot: collection_mechanisms[22]
    snippet: "Topcon-CL-200 computerized Lensometer"
  - slot: collection_mechanisms[23]
    snippet: "Topcon-CL-300 computerized Lensometer"
  - slot: collection_mechanisms[17].mechanism_details
    snippet: "The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the ocular fundus."
  - slot: anomalies[3]
    snippet: "the quality of the images vary from patient to patient and within the same patient"
  - slot: collection_mechanisms[11].mechanism_details
    snippet: "AI READI images using EIDON include two main modalities: 1. Single Field Central IR/FAF 2. Smart Horizontal Mosaic."
  - slot: collection_mechanisms[12].mechanism_details
    snippet: "For AI READI subjects, imaging is done in a dark room using the following modalities: ONH-RC, PPole-H, and OCTA of the macula."
  - slot: missing_data_documentation[0].missing_data_patterns
    snippet: "As the machine is operated by the imaging team and is not fully automated, quality issues may arise, which may lead to skipping this modality and missing data."
  - slot: collection_mechanisms[14].mechanism_details
    snippet: "Imaging is done in 12.0X12.0 mm and 6.0X6.0 mm OCTA, and 12.0 mm X9.0 mmX6.0 mm 3D Horizontal and Radial scan modes."
  - slot: collection_mechanisms[13].mechanism_details
    snippet: "Protocols include 12.0 mm X9.0 mm widefield, 6.0 mm X 6.0 mm 3D macula scan and 6.0 mm X 6.0 mm OCTA (scan rate: 50 kHz)."
  - slot: anomalies[4]
    snippet: "it is kept to be performed as the last modality of an AI READI visit. Because of this patients may not be at their best possible compliance."
  - slot: collection_mechanisms[15].mechanism_details
    snippet: "Imaging protocols include 512 X 512 and 200 X 200 macula and ONH scans and also OCTA of the macula."
  - slot: collection_mechanisms[2].mechanism_details
    snippet: "It is done using a standard 10g monofilament applying pressure to different points on the plantar surface of the feet."
  - slot: collection_mechanisms[3].mechanism_details
    snippet: "AI READI research staff perform this test on an iPad using a pre-installed software (MoCA Duo app downloaded from the app store)"
  - slot: known_limitations[1]
    snippet: "the pilot study is not balanced across these parameters"
  - slot: known_limitations[2]
    snippet: "Factors influencing the generalization of derived models include the predominantly urban and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds."
  - slot: known_limitations[3]
    snippet: "The study cohort may not provide a comprehensive representation of the population, as it does not include other races/ethnicities such as Pacific Islanders and Native Americans."
  - slot: sampling_strategies[0].notes
    snippet: "The sites were chosen for geographic diversity across the United States and to ensure diverse representation across various racial and ethnic groups."
  - slot: collection_mechanisms[0].notes
    snippet: "Uniform data collection protocols were implemented for all subjects, irrespective of their race/ethnicity, biological sex, or diabetes severity, across all study sites."
  - slot: cleaning_strategies[2]
    snippet: "clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in reports viewed by clinical research coordinators (CRCs) and Data Managers"
  - slot: cleaning_strategies[2].cleaning_details
    snippet: "Credibility, based on range checks to determine if all responses fall within a prespecified reasonable range"
  - slot: cleaning_strategies[2].cleaning_details
    snippet: "Incorrect flow through prescribed skip patterns"
  - slot: cleaning_strategies[2].cleaning_details
    snippet: "The omission and/or duplication of records"
  - slot: cleaning_strategies[2].notes
    snippet: "Editing was only done under the guidance and approval of the site PI."
  - slot: preprocessing_strategies[1]
    snippet: "all data were mapped to standardized terminologies when possible, such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model"
  - slot: raw_sources[0]
    snippet: "The raw data is saved and expected to be preserved by the AI-READI project at least for the duration of the project but is not anticipated to be shared outside the project team right now"
  - slot: raw_sources[0].source_caveats
    snippet: "There is a possibility that raw data may be included in future releases of the controlled access dataset."
  - slot: sampling_strategies[0].strategies
    snippet: "Able to provide consent - ≥ 40 years old - Persons with or without type 2 diabetes - Must speak and read English"
  - slot: sampling_strategies[0].strategies
    snippet: "Must not be pregnant - Must not have gestational diabetes - Must not have Type 1 diabetes"
  - slot: cleaning_strategies[2].source_caveats
    snippet: "No data were excluded from the dataset at the time of preprocessing."
  - slot: source_caveats
    snippet: "No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML applications."
- id: c019
  status: extracted
  extracted:
  - slot: splits[0].split_details
    snippet: "the project team has prepared data splits into proportions (70%/15%/15%) that can be used for subsequent training/validation/testing where the validation and test sets are balanced as well as possible for sex, race/ethnicity and diabetes status"
  - slot: splits[0].notes
    snippet: "Because sex, race, and ethnicity data are not being released with the public version of the dataset"
  - slot: ethical_reviews[0].review_details
    snippet: "The initial IRB approval at the University of Washington was received on December 20, 2022."
  - slot: ethical_reviews[0].notes
    snippet: "An annual renewal application to the IRB about the status and progress of the study is required and due within 90 days of expiration."
  - slot: acquisition_methods[0]
    snippet: "some data were directly observable (such as labs, vitals, and retinal imaging)"
  - slot: acquisition_methods[1]
    snippet: "other data were reported by subjects (e.g. survey responses)"
  - slot: acquisition_methods[1].acquisition_details
    snippet: "Verification of data entry was performed when possible (e.g. cross-referencing entered medications with medications that were physically brought in or photographed by each study participant)."
  - slot: data_collectors[0].collector_details
    snippet: "Their effort was supported by the National Institutes of Health award OT2OD032644 based on the percentage of effort contributed"
  - slot: participant_compensation[0]
    snippet: "Study subjects received a compensation of $200 for the study visit also through the grant funding."
  - slot: collection_timeframes[2].timeframe_details
    snippet: "For this version of the dataset, the timeframe for data collection was July 19, 2023 to May 01, 2025."
  - slot: collection_timeframes[3]
    snippet: "The timeline for the overall project spans four years, encompassing one year dedicated to protocol development and training, and years 2-4 allocated for subject recruitment and data collection."
  - slot: direct_collection[0]
    snippet: "The data was collected directly from participants across the three recruiting sites."
  - slot: direct_collection[0].collection_details
    snippet: "Recruitment pools were identified by screening Electronic Health Records (EHR) for diabetes and prediabetes ICD-10 codes for all patients who have had an encounter with the sites' health systems within the past 2 years."
