title: Cell Maps for Artificial Intelligence
id: https://cm4ai.org/
name: CM4AI
description: 'CM4AI (Cell Maps for Artificial Intelligence) is the Functional Genomics Grand
  Challenge data generation project in the NIH Bridge2AI program. The project states that
  it will deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
  together with quarterly data releases of map-input data streams, using three complementary
  mapping approaches: proteomic mass spectrometry, cellular imaging, and genetic perturbation
  via CRISPR/Cas9. CM4AI is generating multi-modal data including protein-protein interaction
  (PPI), spatial localization, and genetic perturbation data in MDA-MB-468 breast cancer cells
  (with or without paclitaxel or vorinostat) and induced pluripotent stem cells (with or without
  differentiation). The data releases are deposited in the University of Virginia Dataverse;
  this record describes the release series, with each release captured in the bundle listed
  under resources and the June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, as the current
  release. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham,
  Simon Fraser University, and the Hastings Center. The project website reports 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 proteins investigated, 11,739 genes
  targeted and a data volume of 21.4 TB.'
source_caveats: 'Referent: this record describes the CM4AI dataset as a release series (https://cm4ai.org/),
  with the four Dataverse releases captured in the bundle (doi:10.18130/V3/B35XWX, doi:10.18130/V3/F3TD5R,
  doi:10.18130/V3/K7TGEM and doi:10.18130/V3/HIGT4C) under resources; facts about the governance,
  maintenance, intended uses, limitations, prohibited uses and biases are taken from the current
  June 2026 release page. The cm4ai.org pages and the Dataverse collection both state that
  they are under review for potential modification in compliance with Administration directives.
  The number of proteins with immunofluorescence images differs by source and release: 563
  (March 2025 release), 464 (June 2025 and October 2025 releases) and 523 (cm4ai.org data
  releases page); these describe different releases or page snapshots and are not reconciled
  here. The data releases page lists AP-MS interactomes for TNBC cells as coming soon, while
  the June 2026 release includes AP-MS data for treated MDA-MB-468 cells. The Nature article
  in the bundle (Multimodal cell maps as a foundation for structural and functional genomics)
  describes a U2OS cell map study and is not stated to describe any CM4AI data release, so
  no values are taken from it.'
