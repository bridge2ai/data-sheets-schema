known_biases:
- bias_description: Data in this release was derived from commercially available de-identified
    human cell lines.
- bias_description: Does not represent all biological variants which may be seen in the population
    at large.
known_limitations:
- description: Some datasets are under temporary pre-publication embargo; the June 2026 release
    lists the Perturb-seq data in KOLF2.1J iPSCs (undifferentiated) and in MDA-MB-468 breast
    cancer cells (+/- treatment) as embargoed.
- description: Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi Perturb-seq data interrogate sets of proteins which incompletely overlap.
- description: Computed cell maps are not included in the June 2026 release; the release states
    that predicted cell maps will be added in future releases.
- description: This is an interim release.
- description: The current release is most suitable for bioinformatics analysis of the individual
    datasets.
- description: Requires domain expertise for meaningful analysis.
subpopulations:
- name: MDA-MB-468 breast cancer cells
  identification: MDA-MB-468 (RRID:CVCL_0419), a triple negative breast cancer cell line established
    from a metastatic site pleural effusion of a 51-year-old Black female with a metastatic
    mammary adenocarcinoma, available from ATCC.
  distribution: 'The data releases page lists curated datasets for TNBC cells under untreated
    (DMSO control), vorinostat, and paclitaxel conditions: SEC-MS capturing about 7,000 proteins,
    IF images for 523 proteins, Perturb-seq of 200 genes, and AP-MS interactomes (listed there
    as coming soon).'
- name: KOLF2.1J induced pluripotent stem cells and derived cells
  identification: KOLF2.1J (RRID:CVCL_B5P3), an iPSC line derived from a healthy male Northern
    European donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
    resource.
  distribution: 'The data releases page lists a curated dataset for undifferentiated (parental)
    iPSCs and iPSC-derived neural progenitor cells (NPCs), neurons, and cardiomyocytes: Perturb-seq
    of more than 11,000 genes (whole-genome), SEC-MS capturing about 7,000 proteins, and IF
    images (listed there as coming soon).'
collection_mechanisms:
- name: Immunofluorescence subcellular microscopy
  description: Immunofluorescence (IF) subcellular microscopy for spatial proteomics data.
- name: Affinity purification mass spectrometry (AP-MS)
  description: AP-MS on endogenously tagged cell lines for protein-protein interaction data.
    The 2024 preprint reports 17 genes endogenously tagged in MDA-MB-468 with AP-MS data acquired
    under three conditions (untreated, paclitaxel and vorinostat treated).
- name: Size exclusion chromatography mass spectrometry (SEC-MS)
  description: SEC-MS for protein-protein interaction data. The 2024 preprint reports SEC-MS
    performed in KOLF2 iPSCs and derivatives, uncovering more than 700 protein complexes in
    both parental iPSCs and differentiated neurons.
- name: Single-cell CRISPR perturbation screens (Perturb-seq)
  description: Single-cell CRISPR-Cas perturbation screens by cell type. The 2024 preprint
    reports single-cell CRISPR screens of 100 chromatin regulators (+/- drug) in MDA-MB-468
    cells and in undifferentiated KOLF2.1J iPSCs using the 10x Genomics 3' HT kit.
data_collectors:
- name: Lundberg Lab at Stanford University
  description: Imaged the MDA-MB-468 immunofluorescence data sets by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy.
- name: Nevan Krogan laboratory at the University of California San Francisco
  description: Generated the size exclusion chromatography-mass spectroscopy (SEC-MS) data
    sets in KOLF2.1J iPSCs and MDA-MB-468 cells.
preprocessing_strategies:
- name: Multi-Scale Integrated Cell (MuSIC) pipeline
  description: 'The 2024 preprint describes the pipeline by which CM4AI input data streams
    are integrated into cell maps: protein-protein interaction networks are embedded with
    the node2vec model and immunofluorescence images with a Human Protein Atlas deep learning
    model; the two embeddings are integrated into a co-embedding for each protein by contrastive
    deep learning; community detection on all-by-all protein similarities in the co-embedding
    produces a hierarchy of protein communities output as the cell map; and cell maps are
    annotated by alignment to Gene Ontology and Reactome and by a large language model naming
    approach.'
  source_caveats: The June 2026 release states that computed cell maps are not included in
    that release, so this pipeline describes how CM4AI cell maps are produced, not processing
    applied to the released input data files.
- name: FAIRSCAPE RO-Crate packaging
  description: FAIRSCAPE-CLI creates an RO-Crate package with the datasets, metadata, and
    software (or resolvable references to them), which the FAIRSCAPE server registers and
    assigns persistent identifiers; the PID system in use when the 2024 preprint was written
    was the ARK scheme.
intended_uses:
- description: The project states that the data will broadly stimulate research and development
    in "visible" machine learning systems informed by multi-scale cell and tissue architecture.
- description: AI-ready datasets to support research in functional genomics.
- description: AI model training.
- description: Cellular process analysis.
- description: Cell architectural changes and interactions in presence of specific disease
    processes, treatment conditions, or genetic perturbations.
prohibited_uses:
- description: Use of these laboratory data in clinical decision-making or in any context
    involving patient care without appropriate regulatory oversight and approval.
