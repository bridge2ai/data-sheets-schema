known_limitations:
- id: cm4ai:limitation:1
  description: The March, June, and October 2025 Dataverse records describe beta/interim releases. Some datasets are under temporary pre-publication embargo, protein localization, SEC-MS, and perturb-seq data interrogate incompletely overlapping protein sets, and computed cell maps are not included in those releases.
  limitation_type: temporal_limitation
  limitation_description: Interim beta releases are incomplete and do not yet contain predicted cell maps.
  scope_impact: The releases are most suitable for bioinformatics analysis of individual datasets until computed cell maps and complete integration are released.
  recommended_mitigation: Use the latest CM4AI release documentation and future releases through November 2026 for augmented data and computed cell maps.
- id: cm4ai:limitation:2
  description: CM4AI data are derived from commercially available de-identified human cell lines and do not represent all biological variants which may be seen in the population at large.
  limitation_type: representativeness_limitation
  limitation_description: Cell-line-derived data are not population-representative.
  scope_impact: Population-level generalizations require caution and supporting evidence.
  recommended_mitigation: Interpret findings in the context of the selected MDA-MB-468 and KOLF2.1J cell-line models.
