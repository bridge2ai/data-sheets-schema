purposes:
- id: cm4ai:purpose:1
  description: 'Deliver machine-readable hierarchical maps of cell architecture as AI-Ready data from multimodal interrogation of disease-relevant cell lines to enable transformative biomedical AI research. CM4AI produces integrated cell maps from spatial proteomics, protein-protein interactions, and genetic perturbations using state-of-the-art mass spectrometry, cell imaging, and CRISPR technologies.

    '
- id: cm4ai:purpose:2
  description: 'Address the grand challenge of interpretable genotype-phenotype learning in genomics and precision medicine. Machine learning models are often "black boxes" predicting phenotypes from genotypes without understanding the mechanisms. CM4AI enables "visible" machine learning systems informed by multi-scale cell and tissue architecture, allowing AI tools to interrogate how protein assemblies in the cell affect cell-level phenotype predictions.

    '
- id: cm4ai:purpose:3
  description: 'Establish standards, best practices, and guidelines for ethical AI-readiness in biomedical data. This includes implementing FAIR principles, computing machine-readable provenance graphs, characterizing and validating all datasets with JSON-Schema mini-data-dictionaries, and mapping data elements to public ontology vocabularies where appropriate.

    '
- id: cm4ai:purpose:4
  description: 'Provide multimodal cell maps as a foundation for structural and functional genomics, enabling integrative structure modeling of protein assemblies identified via the MuSIC pipeline. Demonstrated in peer-reviewed publication in Nature (Schaffer, Hu et al., April 2025, doi:10.1038/s41586-025-08878-3) integrating IF imaging, AP-MS, SEC-MS, and structure modeling.

    '
tasks:
- id: cm4ai:task:1
  description: 'Integrate multimodal data streams (spatial proteomics via IF imaging, protein-protein interactions via AP-MS and SEC-MS, and genetic perturbations via CRISPR screens) using the Multi-Scale Integrated Cell (MuSIC) software pipeline employing deep learning models and community detection algorithms to produce hierarchical cell maps.

    '
- id: cm4ai:task:2
  description: 'Enable development of visible neural networks (VNNs) and visible machine learning tools that use hierarchical cell maps as interpretable structures for AI model architectures, allowing interrogation of how protein assemblies affect cell-level phenotypes and interpretation of genetic variants and mutations.

    '
- id: cm4ai:task:3
  description: 'Characterize cell architecture and protein interactions in disease-relevant cell lines including treated and untreated MDA-MB-468 breast cancer cells (with paclitaxel and vorinostat) and differentiated and naive KOLF2.1J induced pluripotent stem cells (iPSCs) differentiated into neurons and cardiomyocytes.

    '
- id: cm4ai:task:4
  description: 'Develop ethical AI frameworks and governance structures for biomedical data, including Value-Sensitive Design methodologies, axiological repositories, CM4AI Life Cycle framework, and guidelines for responsible design of datasets and AI technologies.

    '
- id: cm4ai:task:5
  description: 'Perform integrative structure modeling of MuSIC protein communities to determine structural models using data from PDB, AlphaFoldDB, crosslinking mass spectrometry, and prediction of disordered sequence segments, enabling structural and functional genomics applications.

    '
addressing_gaps:
- id: cm4ai:gap:1
  description: 'Address the limitation that machine learning models in genomics and precision medicine are typically difficult-to-interpret "black boxes" by providing hierarchical cell maps that enable visible machine learning systems built directly on knowledge maps of cell and tissue architecture.

    '
- id: cm4ai:gap:2
  description: 'Provide fully provenanced, ethically validated, and FAIR-compliant AI-ready datasets with machine-readable provenance graphs, complete schemas, validation procedures, and data sheets that can be reliably processed by AI applications with full explainability.

    '
- id: cm4ai:gap:3
  description: 'Create integrated datasets combining protein localization (spatial proteomics), protein-protein interactions (AP-MS and SEC-MS), and transcriptional states (CRISPR perturbation screens) at multiple scales, enabling complex multi-modal AI analyses not feasible with single data types.

    '
- id: cm4ai:gap:4
  description: 'Bridge the gap between protein interaction networks and structural biology by enabling integrative structure modeling of protein communities identified from multimodal cell maps, combining PDB, AlphaFoldDB, crosslinking MS, and sequence disorder predictions.

    '
