name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset (Artificial Intelligence Ready and Equitable/Exploratory Atlas for Diabetes
  Insights) is a cross-sectional, multimodal dataset collected from individuals with and without
  type 2 diabetes mellitus (T2DM) and harmonized across three United States data collection sites
  (University of Alabama at Birmingham, University of California San Diego, and University of
  Washington). Version 3.0.0 contains data from 2,280 participants collected between 19 July 2023
  and 1 May 2025, comprising 356,343 files totalling approximately 3.82 TB. Modalities include
  survey data, physical measurements and clinical data (mapped to the OMOP Common Data Model),
  blood and urine laboratory results, 12-lead electrocardiography (WFDB), retinal photography,
  optical coherence tomography (OCT), OCT angiography (OCTA) and fluorescence lifetime imaging
  ophthalmoscopy (FLIO) (all DICOM), continuous glucose monitoring and wearable activity monitoring
  (Open mHealth), and indoor environmental sensor data. The composition was designed for downstream
  AI/machine learning research, with recruitment sampling aimed at approximately equal distribution
  of participants across diabetes severity, sex, and race/ethnicity, in order to study salutogenesis
  (the pathway from disease to health) in T2DM. The public release contains no protected health
  information; sex, race/ethnicity and medication information are also removed and held under
  controlled access together with 5-digit zip code, genetic sequencing data, past health records,
  and traffic and accident reports.
