raw_sources:
  - raw_data_details: >-
      Raw data are saved and are expected to be preserved by the AI-READI project at least for the
      duration of the project, but are not anticipated to be shared outside the project team at
      present, because they have not been mapped to standardized terminologies and because the raw
      data may accidentally include personal health information or personally identifiable
      information (for example in free text fields). There is a possibility that raw data may be
      included in future releases of the controlled access dataset. Data from each device were
      exported in their native format to local storage before transformation and upload to FAIRhub.

raw_data_sources:
  - source_description: >-
      Participant-completed questionnaires and coordinator-entered clinical measurements captured in
      the REDCap electronic data capture system at the three study sites.
    source_type: survey and electronic data capture system
    access_details: >-
      Not released in raw form; released after mapping to the OMOP Common Data Model in the
      clinical_data directory. The exact forms used for data collection in REDCap are published at
      https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf.
  - source_description: 12-lead electrocardiogram exported from the Philips PageWriter TC30 Cardiograph.
    source_type: medical device
    raw_data_format: XML (.xml)
  - source_description: >-
      Montreal Cognitive Assessment results (total score, section subscores, Memory Index Score and
      task completion times) exported from the MoCA Duo iPad application.
    source_type: tablet application
    raw_data_format: CSV (.csv)
  - source_description: >-
      Retinal images exported from the imaging devices in their raw format (Optomed Aurora, iCare
      EIDON, Heidelberg Spectralis, Topcon Maestro2, Topcon Triton, Zeiss Cirrus, Heidelberg FLIO).
    source_type: ophthalmic imaging devices
    raw_data_format: >-
      DICOM natively for Optomed, iCare EIDON, Heidelberg Spectralis and Zeiss Cirrus; Topcon .fda
      files and Heidelberg FLIO .sdt files, both converted to DICOM for the dataset.
  - source_description: Continuous glucose monitoring records downloaded from the Dexcom G6 device.
    source_type: wearable medical device
    raw_data_format: CSV (.csv)
  - source_description: Physical activity records downloaded from the Garmin Vivosmart 5 tracker.
    source_type: wearable activity monitor
    raw_data_format: FIT (.FIT), converted to the Open mHealth standard for the dataset
  - source_description: >-
      Indoor environmental measurements downloaded from the custom-built LeeLab Anura environmental
      sensor.
    source_type: custom-built environmental sensor
    raw_data_format: CSV (.csv)
  - source_description: >-
      Blood and urine laboratory results from the University of Washington Nutrition and Obesity
      Research Center laboratory and complete blood counts from CLIA-certified laboratories local to
      each data collection site.
    source_type: clinical laboratory
    raw_data_format: CSV (.csv)
  - source_description: >-
      Electronic health records at UAB, UCSD and UW, screened for ICD-10 codes E11.X and R73.09 and
      demographic data to identify recruitment pools.
    source_type: electronic health records
    access_details: >-
      Used for recruitment and screening; past health records are held under controlled access rather
      than released in the public dataset.

preprocessing_strategies:
  - preprocessing_details: >-
      Clinical data captured in REDCap were mapped to the Observational Medical Outcomes Partnership
      (OMOP) Common Data Model, with each CSV file in the clinical_data directory being a one-to-one
      mapping to an OMOP CDM table.
  - preprocessing_details: >-
      Retinal imaging data were mapped to the DICOM standard; images exported by the Topcon Maestro2
      and Triton devices in .fda format and by the Heidelberg FLIO in .sdt format were converted to
      DICOM prior to inclusion in the dataset, while other devices exported DICOM natively.
  - preprocessing_details: >-
      Wearable activity monitor data exported by the Garmin Vivosmart 5 in .FIT format and continuous
      glucose monitoring data from the Dexcom G6 were transformed into the Open mHealth standard.
  - preprocessing_details: >-
      Electrocardiogram data exported as .xml were stored following the WaveForm DataBase (WFDB) set
      of file standards for physiologic signal data and associated annotations.
  - preprocessing_details: >-
      Environmental sensor data were formatted following the NASA ASCII File Format Guidelines for
      Earth Science Data.
  - preprocessing_details: >-
      The whole dataset was organised according to the Clinical Dataset Structure (CDS) v0.1.1
      specification: one directory per datatype at the root, then one folder per modality, then one
      folder per device, then one folder per participant named with the participant study ID, with a
      manifest.tsv in each datatype directory and root-level CDS metadata files.
  - preprocessing_details: >-
      Preparation for public dissemination: removal of protected health information as defined by the
      HIPAA Privacy Rule via the Safe Harbor method, and removal of information related to the sex
      and race/ethnicity of participants and to medications used; sensitive variables were routed to
      the controlled-access tier instead.
  - preprocessing_details: >-
      Preparation of a recommended 70/15/15 train/validation/test split balanced as far as possible
      for sex, race/ethnicity and diabetes status, distributed in the participants.tsv file.
    notes: >-
      No instances were excluded from the dataset at the time of preprocessing; exclusions operated at
      the level of study eligibility criteria rather than post hoc data filtering.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the time of data entry/acquisition: clinical data outside expected
      minimum/maximum ranges were flagged in REDCap and appeared in reports viewed by clinical
      research coordinators and data managers. Using these reports as guides, data managers and
      coordinators examined participant records and determined whether an error was likely. Data were
      checked and edited for credibility (range checks), incorrect flow through prescribed skip
      patterns, missing data that could be directly filled from other portions of an individual's
      record, and the omission and/or duplication of records.
  - cleaning_details: >-
      Editing was only done under the guidance and approval of the site principal investigator. If
      corrected data were available from elsewhere in the respondent's answers, the error was
      corrected; if there was no logical or appropriate way to correct the data, the site principal
      investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      Central processing after data were sent from each study site to the project team, including
      mapping to standardized terminologies where possible (OMOP CDM for clinical data, DICOM for
      imaging) in preparation for dissemination; the data manager at each site was responsible for
      quality control of all data before uploading to FAIRhub.
  - cleaning_details: >-
      Internal review of the dataset by AI-READI team members for quality checks and to ensure that no
      personally identifiable information was accidentally included.

missing_data_documentation:
  - missing_data_patterns:
      - Not all modalities are available for all participants.
      - Skipped questions or incomplete responses in survey data.
      - Missing or partial wearable-device records for individual participants.
      - Missing or degraded imaging series for individual participants.
    missing_data_causes:
      - Some participants elected not to participate in some study elements.
      - >-
        The data collection device did not have any stored results, or was returned too late to
        retrieve the results (for example the battery died or data were lost).
      - A data collision at some point in the process caused data to be lost.
      - >-
        For wearables, improper use, technical failure such as battery failure, or system
        malfunction.
      - >-
        For imaging, patient uncooperation, noise that may obscure the images, system malfunction and
        data transfer failures.
    handling_strategy: >-
      During cleaning, missing data that could be directly filled from other portions of an
      individual's record were completed; where there was no logical or appropriate way to correct
      the data, the site principal investigator reviewed the values and decided whether they should
      be removed. No instances were excluded from the dataset at the time of preprocessing.

anomalies:
  - anomaly_details: >-
      Incomplete modality coverage: not all data modalities are present for every participant, because
      of participant opt-out from individual study elements, absent stored device results, late
      device return, or data loss.
  - anomaly_details: >-
      Survey data: skipped questions or incomplete responses are expected.
  - anomaly_details: >-
      Wearable data: improper use, technical failure such as battery failure, or system malfunction
      are expected sources of error or noise.
  - anomaly_details: >-
      Imaging data: patient uncooperation, noise that may obscure the images, system malfunction and
      data transfer failures are expected sources of error or noise.
  - anomaly_details: >-
      Optomed Aurora undilated handheld fundus photography: because participants are not dilated and
      the device is handheld, it is challenging to get a good view, so image quality varies from
      patient to patient and within the same patient.
  - anomaly_details: >-
      FLIO acquisition: because it takes longer than a usual Spectralis OCT and exposes participants
      to uncomfortable levels of light, it is performed as the last modality of a visit, so
      participants may not be at their best possible compliance.
  - anomaly_details: >-
      Operator-dependent acquisition on the Heidelberg Spectralis: the machine is operated by the
      imaging team and is not fully automated, so quality issues may arise which may lead to skipping
      this modality and to missing data.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers; therefore there is selection bias known as volunteer bias, which
      may limit the generalisability of results to those who are not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of the composition of enrolled participants for diversity
      and inclusion, and adjustment by under- and oversampling groups as needed.
  - bias_type: sampling_bias
    bias_description: >-
      The cohort is a non-probability sample drawn from patients with an encounter in three academic
      health systems, identified by screening electronic health records; recruitment is predominantly
      urban and hospital-based and may not fully capture diverse cultural and socioeconomic
      backgrounds.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity across the United
      States and to ensure diverse representation across racial and ethnic groups, and individuals
      from all demographic backgrounds were recruited at all three sites.
  - bias_type: representation_bias
    bias_description: >-
      Interim releases may not have achieved the intended balanced distribution across race/ethnicity,
      sex and diabetes severity because enrollment is ongoing; the pilot study in particular is not
      balanced across these parameters. The cohort also does not include other races/ethnicities such
      as Pacific Islanders and Native Americans, and English-language fluency is required.
    affected_subsets: >-
      Version 1.0.0 (pilot, 204 participants) and the interim releases v2.0.0 (1,067 participants) and
      v3.0.0 (2,280 participants), relative to the 4,000-participant triple-balanced design target.
    mitigation_strategy: >-
      The eventual target cohort is triple-balanced by race/ethnicity, T2DM severity and biological
      sex; new recruitment strategies will be implemented if sample balancing on race/ethnicity
      emerges as a challenge; and the released recommended split balances the validation and test
      sets as far as possible for sex, race/ethnicity and diabetes status.
  - bias_type: historical_bias
    bias_description: >-
      Recruiting Black men into health research is well documented to be more difficult than
      recruiting other populations, although this population bears a disproportionate percentage of
      the burden of T2DM; factors such as medical mistrust and fear for safety stem from historical
      events such as the Tuskegee syphilis study. Similar trends of under-recruitment together with
      higher disease burden have been reported for Hispanic and Asian persons.
    mitigation_strategy: >-
      Strategies identified in the literature to encourage participation, such as tailoring printed
      materials and using a personalised, participatory approach to recruitment, together with a
      Community Advisory Board of 11 persons from the three sites reflecting the diversity of the
      AI-READI sample.
  - bias_type: measurement_bias
    bias_description: >-
      Acquisition varies across devices and operators: several imaging modalities are operator
      dependent (for example the handheld undilated Optomed camera and the Heidelberg Spectralis and
      FLIO), while others are fully automated with minimal operator involvement, so image quality and
      operator-induced noise differ across modalities and participants.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites; device make and
      model and scan protocol were documented to ensure repeatability; and multiple devices were
      included for one measure to enhance generalizability and represent the diverse range of
      equipment used in clinical settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      While the AI-READI cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study and interim
      releases are not balanced across these parameters.
    scope_impact: >-
      Models trained on an interim version may reflect the imbalance of that version rather than the
      intended triple-balanced design.
    recommended_mitigation: >-
      Use the recommended train/validation/test split, whose validation and test sets are balanced as
      far as possible for sex, race/ethnicity and diabetes status.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The study cohort does not provide a comprehensive representation of the population: it does not
      include other races/ethnicities such as Pacific Islanders and Native Americans, and recruitment
      is predominantly urban and hospital-based.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility restricts the cohort to adults aged 40 years or older (maximum 85 years per the
      FAIRhub eligibility module) who are able to provide consent and who must speak and read
      English; pregnancy, gestational diabetes and type 1 diabetes are exclusionary. Requiring
      English fluency may have created challenges in recruiting Hispanic and/or Asian persons.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The public release withholds sex, race, ethnicity, 5-digit zip code, genetic sequencing data,
      past health records, medications, and traffic and accident reports, which are available only
      under controlled access after entering a data use agreement.
    scope_impact: >-
      Analyses of demographic subgroups and of medication effects cannot be performed directly on the
      public dataset.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The dataset is cross-sectional, with currently only one visit per participant, so disease
      trajectories cannot be observed directly within individuals; longitudinal follow-up data are
      planned for a subgroup of participants in year 4 of the project.
  - limitation_type: methodological_limitation
    limitation_description: >-
      A limitation of the biorepository is that there are a finite number of samples to share with
      scientists interested in using them in research; procedures for reviewing and prioritising
      written requests were to be developed before the biorepository is complete.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Recorded in the FAIRhub dataset_description as deIdentType "NoDeIdentification" with
    deIdentDirect and deIdentHIPAA both true and deIdentDates, deIdentNonarr and deIdentKAnon all
    false: no identifiers were collected, so no active de-identification was necessary, but the team
    checked that no identifiable data per US HIPAA were present in the data. The Nature Metabolism
    comment describes the public set as stripped of Protected Health Information as defined by the
    HIPAA Privacy Rule via the "Safe Harbor" method.
  identifiers_removed:
    - Protected Health Information as defined by the HIPAA Privacy Rule (Safe Harbor method)
    - Sex
    - Race and ethnicity
    - Medication information
  deidentification_details: >-
    The data in the public v3.0.0 release contain no protected health information. Information
    related to the sex and race/ethnicity of the participants, as well as medications used, has also
    been removed, in the case of sex and race/ethnicity to prevent stigmatization of findings. More
    sensitive variables (5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health
    records, medications, and traffic and accident reports) are retained in a controlled-access
    dataset available only to scientists whose institutions have completed legal and privacy use
    agreements with the AI-READI research programme. Raw data are not shared because they may
    accidentally include personal health information or personally identifiable information, for
    example in free-text fields.
  notes: >-
    The healthsheet questions asking whether measures were taken to avoid re-identification and
    whether there was any pre-processing for de-identification of the patients were left unanswered
    in the v3.0.0 record.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      Race and ethnic origin (self-reported). Not included in the public dataset; available only in
      the controlled-access dataset.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Biological sex. Removed from the public dataset to prevent stigmatization of findings;
      available only in the controlled-access dataset.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Location data in the form of 5-digit zip code. Held under controlled access only.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Genetic sequencing data. Held under controlled access only; genomic DNA is extracted from
      banked buffy coats for future studies such as whole genome sequencing.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Past health records and current medications (recorded with RxNorm codes). Held under controlled
      access only.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Motor vehicle traffic and accident reports, including driving record and accident reports
      obtained for the previous three years. Held under controlled access only.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential and that no personally identifiable information is included in the dataset.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet answers "No" to whether the dataset contains data that, if viewed directly,
      might be offensive, insulting, threatening, or otherwise pose any safety risk such as
      psychological safety and anxiety.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: >-
    Institutional Review Board of the University of Washington, with reliance agreements with the
    IRBs of the University of Alabama at Birmingham and the University of California, San Diego.
  regulatory_compliance: >-
    The FAIRhub study description oversight module records the study as not FDA-regulated for either
    drug or device, with human subject review status "Submitted, approved" and no Data Monitoring
    Committee. Written informed consent is provided by all participants. The study is registered on
    ClinicalTrials.gov as NCT06002048.
  notes: >-
    Initial IRB approval at the University of Washington was received on 20 December 2022 under
    approval number STUDY00016228, with the initial approval letter published at
    https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf. An annual renewal application
    to the IRB about the status and progress of the study is required and due within 90 days of
    expiration. The BMJ Open protocol refers to the same number, STUDY00016228, as a
    "Clinicaltrials.org approval number".

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      AI-READI was approved by the Institutional Review Board of the University of Washington
      (approval number STUDY00016228), including reliance agreements with the IRBs of the University
      of Alabama at Birmingham and the University of California, San Diego. Initial approval was
      received on 20 December 2022; the approval letter is published in the dataset documentation.
      Annual renewal reporting on the status and progress of the study is required within 90 days of
      expiration.
  - review_details: >-
      Ethical, legal and social implications are considered at every stage of the project cycle, with
      guidance from bioethicists; the project reviewed existing documentation approaches such as
      datasheets and healthsheets to identify the most suitable one for biomedical data, and
      implements a robust data dissemination system, a strict licence agreement and data watermarking
      for both public and controlled sets to prevent re-identification attempts.
    notes: >-
      Through engagement with the Native Biodata Consortium, the project provides a co-learning
      opportunity for understanding challenges specific to American Indian and Alaska Native
      communities and for evaluating tools such as data usage agreements, contract negotiations,
      transparent access agreements and forms of assured return of benefit and sustainable input,
      control and monitoring of Tribal data.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically (e-consent signed in REDCap before the
      visit) or in person at the start of the visit for participants who did not select the
      electronic option.
    consent_scope: >-
      Consent covered participation in the full study protocol, banking of biospecimens for future
      research, and placement of data in an open-source repository. Informed consent to participate
      was required before participation in any part of the protocol, including questionnaires. The
      dataset consent metadata records that the public version of the dataset can only be used for
      type 2 diabetes related research while a private version will allow for more generic use.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington, is
      published at
      https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf. The
      other clinical sites had IRB reliance and used the same consent form, with minor
      institution-specific language incorporated depending on individual institutional requirements
      (for example, the State of California requires inclusion of the Bill of Rights in the UCSD
      consent form). Once signed, the electronic consent form is automatically emailed to the
      participant, who may request an additional copy from the study coordinator for the duration of
      the study.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation;
      however, any data that had been shared or used up to that point would stay in the dataset, and
      this is clearly communicated in the consent document.
    notes: >-
      Potential participants could read all consent documentation electronically before their visit
      and give consent with an electronic signature without verbal communication with a clinical
      research coordinator, or could decide at that point not to participate or to request additional
      information. No study-specific questionnaires other than the screening questionnaire were
      available to participants until consent was given.

collection_consents:
  - consent_details: >-
      Written informed consent was provided by all participants before any protocol activity. For most
      participants, informed consent was performed remotely by computer, tablet or smart phone
      through a link in the hardcopy invitation letter or the invitation email that directed them into
      the REDCap database; participants who did not select electronic consent were consented in person
      at the start of the visit, followed by completion of all questionnaires. Consent was obtained in
      a private room by a study team member, with the opportunity to ask questions before signing and
      the option of additional time and a scheduled follow-up discussion.

collection_notifications:
  - notification_details: >-
      Each individual was aware of the data collection, as this was active data collection directly
      from participants rather than passive collection or secondary use of existing data. Individuals
      in each recruitment pool were mailed a hardcopy invitation letter and sent an invitation email,
      both personalised to direct them into the online REDCap recruitment interface using links,
      access codes and QR codes. Within the REDCap interface, individuals could read an overview of
      the research programme, expectations for participation and answers to Frequently Asked
      Questions, download the informed consent document, request a call back from study staff,
      complete a screening survey for qualification, and enroll by signing the electronic consent.
      Those without internet access could call research staff for alternative methods of enrolment.

consent_revocations:
  - revocation_details: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset. This
      is clearly communicated in the consent document.

participant_compensation:
  - compensation_provided: true
    compensation_amount: USD 200
    compensation_type: Monetary stipend, plus reimbursement of reasonable travel costs
    compensation_rationale: >-
      Compensation for the burden of the study visit, which lasts 2.5-4 hours, plus a subsequent
      10-day at-home monitoring period and return of the study devices.
    notes: >-
      The healthsheet states that study subjects received a compensation of $200 for the study visit,
      funded through the grant. The UW IRB protocol form states that the $200 stipend is provided when
      the final data are received from participants and the study devices are returned, typically at
      least two weeks after the study visit, that the payment is not prorated, and that the study
      covers reasonable costs for parking, public transit or rideshare fees related to the study
      visit; the same type and amount of compensation applies to participants asked to return in year
      4. Costs for transport exceeding $25 may not be reimbursed. Study staff effort was supported by
      NIH award OT2OD032644 according to percentage of effort, with salaries aligned to the funding
      guidelines at each site.

participant_privacy:
  - anonymization_method: >-
      No identifiers were collected, so no active de-identification was necessary; the team verified
      that no data identifiable per US HIPAA were present. The public release is stripped of
      Protected Health Information via the HIPAA Safe Harbor method and additionally of sex,
      race/ethnicity and medication information.
    privacy_techniques:
      - HIPAA Safe Harbor removal and verification of Protected Health Information
      - >-
        Removal of sex and race/ethnicity from the public set to prevent stigmatization of findings
      - Removal of medication information from the public set
      - >-
        A two-tier release model in which more sensitive variables are available only in a
        controlled-access dataset requiring completed legal and privacy use agreements
      - Data watermarking for both the public and controlled sets
      - >-
        A robust data dissemination system with a strict licence agreement, verified-ID login and
        self-attestation before download
      - >-
        Selection of at-home monitoring devices that do not capture video or audio, are not equipped
        with GPS location monitoring and are not synced with participant-owned devices
    data_linkage: >-
      Within the released dataset, records are linked across datatypes only by the participant's study
      ID number, which names the participant folder in each device directory; no direct identifiers
      are released alongside the data.
    reidentification_risk: >-
      A theoretical risk of future re-identification is acknowledged. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level identification; to
      prevent re-identification attempts the project implements a robust data dissemination system, a
      strict licence agreement and data watermarking for both public and controlled sets. The license
      further prohibits any attempt to identify or contact data subjects or to establish their
      membership in a particular group.

license_and_use_terms:
  license_terms: >-
    Version 3.0.0 is released under a custom license, "AI-READI custom license v2.0"
    (https://doi.org/10.5281/zenodo.17555036), specifically tailored to enable reuse of the AI-READI
    dataset (and other clinical datasets) for commercial or research purposes while placing strong
    requirements around data usage, security and secondary sharing to protect study participants,
    especially when data are reused for artificial intelligence and machine learning applications.
    The corresponding v1.0 license text present in the source bundle (University of Washington Data
    License Agreement, Zenodo 10.5281/zenodo.10642459) grants a non-exclusive, non-transferable
    license to download, reproduce and use the data and create derivative works for research and
    commercial purposes; forbids conveying any portion of the data or derivative works to third
    parties other than another identically bound licensee; permits distribution of models trained on
    the data provided they do not contain the data and provided reasonable efforts are made to
    minimise memorisation or reconstruction; forbids clinical treatment decisions based on the data;
    forbids re-identification or contact of data subjects; requires compliance with NIH Genomic Data
    Sharing Policy security and privacy standards; requires acknowledgement of the source and funder
    in publications; provides the data "as is" without warranty; limits the licensor's aggregate
    liability to one US dollar; requires indemnification of the licensor; and terminates
    automatically on any breach, after which the licensee must delete all copies.
  data_use_permission: disease_specific_research
  contact_person: >-
    Aaron Lee, MD, central contact for the study, contact@aireadi.org; general contact form at
    https://aireadi.org/contact.
  notes: >-
    Access to the dataset requires several steps: logging in through a verified ID system; agreeing
    to use the data only for type 2 diabetes related research; and agreeing to the license terms. The
    FAIRhub record labels the license "Health Data License" and the dataset accessType is
    "PublicDownloadSelfAttestationRequired". The BMJ Open protocol describes an additional
    controlled-access set containing all publicly available data plus more sensitive data, available
    only to scientists whose institutions have completed legal and privacy use agreements with the
    AI-READI research programme, with requirements set by a Data Access Committee.

ip_restrictions:
  restrictions:
    - >-
      Title to the data, and all industrial and intellectual property rights therein, remain solely
      and exclusively with the licensor (University of Washington) and its suppliers; the licensee
      shall not take any action inconsistent with such ownership and any rights not expressly granted
      are reserved.
    - >-
      The licensee shall not transfer, license, sublicense, sell, assign, display, share or otherwise
      convey any portion of the data or any derivative work to any third party other than another
      licensee bound by an agreement on identical terms.
    - >-
      Licensees must acknowledge the source and any funder of the data in any publications reporting
      use of the data, following the citation instructions in the dataset documentation.
  notes: >-
    Transcribed from the AI-READI Data License Agreement v1.0. The healthsheet answers the question
    about third-party IP-based restrictions by referring to the license.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      The licensee agrees to comply with all data security and privacy standards established by the
      US National Institutes of Health under its Genomic Data Sharing (GDS) Policy from time to time,
      including the NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS
      Policy.
    - >-
      The licensee agrees to comply with all applicable laws, regulations and restrictions relating
      to the distribution and use of the data and of models developed from it.
  notes: >-
    The public dataset is stripped of Protected Health Information as defined by the HIPAA Privacy
    Rule using the Safe Harbor method, and the project verified that no data identifiable per US
    HIPAA were present. The healthsheet answers the question about export controls and other
    regulatory restrictions by referring to the license. Requirements for the controlled-access
    dataset were being developed by a Data Access Committee at the time of the BMJ Open protocol
    publication.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed publicly through the FAIRhub platform (https://fairhub.io/), outside
      the entities that created it, subject to verified-ID login, self-attestation of type 2 diabetes
      related research use, and acceptance of the license. Onward sharing by licensees is
      constrained: under the license, a licensee may give access to the data only to another licensee
      bound by an identical agreement, for the purpose of collaborating on projects involving the
      data, and may not otherwise convey any portion of the data or a derivative work to third
      parties.

distribution_formats:
  - access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      DICOM (application/dicom): all retinal photography, OCT, OCTA and FLIO imaging files.
  - access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      CSV (text/csv): clinical data mapped to OMOP CDM tables, environmental sensor data, and other
      tabular outputs. Manifest files within each datatype directory are TSV, as is participants.tsv.
  - access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      JSON (application/json): Clinical Dataset Structure metadata files including
      dataset_description.json, dataset_structure_description.json, study_description.json and
      participants.json, and the Open mHealth formatted wearable and continuous glucose monitoring
      data.
  - access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Markdown (text/markdown): README.md, CHANGELOG.md and healthsheet.md.
  - access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      WaveForm DataBase (WFDB) files for the 12-lead electrocardiogram data. All of the dataset's
      file formats are accessible with free software commonly used for such data types, so no
      specific software is required. The v3.0.0 documentation additionally describes Azure Storage
      access and a mini-subset version of the dataset for pipeline development.

distribution_dates:
  - release_dates:
      - '2024-05-03'
    notes: >-
      Release of version 1.0.0 (DOI 10.60775/fairhub.1), containing data from the pilot data
      collection phase (204 participants). The BMJ Open protocol describes this as the publicly
      accessible dataset from pilot data collection made available in May 2024.
  - release_dates:
      - '2024-11-08'
    notes: >-
      Release of version 2.0.0 (DOI 10.60775/fairhub.2), containing all data collected through 31
      July 2024 (1,067 participants; 2.01 TB across 165,051 files). The FAIRhub record for this
      version states that it is no longer accessible and directs users to the latest version.
  - release_dates:
      - '2025-11-17'
    notes: >-
      Release of version 3.0.0 (DOI 10.60775/fairhub.3), containing data from 2,280 participants
      collected between 19 July 2023 and 1 May 2025 (3.82 TB across 356,343 files); recorded in the
      FAIRhub metadata with dateType "Available" and publication year 2025.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants (pilot phase)
    - >-
      Version 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants, 2.01 TB
      across 165,051 files
    - >-
      Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants, 3.82 TB
      across 356,343 files
  version_details: >-
    The dataset is released as static versions rather than being dynamically updated, and each
    version is accessible through FAIRhub with its own DOI and its own documentation version at
    docs.aireadi.org. New versions are planned approximately once a year with additional data from
    participants enrolled since the previous release. The FAIRhub page for v2.0.0 states that that
    version of the dataset is no longer accessible and refers users to the latest version. Changes
    between versions are documented in the CHANGELOG file included in the dataset: participants grew
    from 204 (v1.0.0 pilot) through 863 additional in year 2 and 1,213 additional in year 3 to 2,280
    in v3.0.0; one additional imaging device was added in year 2 and three more in year 3; processing
    moved from custom/ad hoc in v1.0.0 to automated plus custom; and the Snellen visual acuity
    variables were dropped in v3.0.0 so that only logMAR visual acuity measurements are available. A
    separate, smaller "Mini Version" of the dataset (100 participants, DOI 10.60775/fairhub.4) is
    available for pipeline development.
  notes: >-
    A datasheet (healthsheet) exists for each version: v1.0.0 at
    https://docs.aireadi.org/docs/1/dataset/healthsheet, v2.0.0 at
    https://docs.aireadi.org/docs/2/dataset/healthsheet, and v3.0.0 as the healthsheet embedded in
    the FAIRhub record for this version.

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset will not be updated in place. Instead, new static versions will be released with
    additional instances as more study participants complete the study visit; enrollment is ongoing
    and future versions will include larger numbers of participants. Data are released annually and
    each version is accessible through FAIRhub with its own DOI.
  notes: >-
    The healthsheet answers the question about continued support for older versions with "N/A",
    reiterating that the dataset will not be updated but that new versions will be released; the
    FAIRhub record for v2.0.0 nonetheless states that that version is no longer accessible.

maintainers:
  - role: researcher
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. Contact information is provided in the
      README file included with the dataset and via https://aireadi.org/contact; the central contact
      recorded in the FAIRhub study description is Aaron Lee, MD (contact@aireadi.org). Details about
      team members are available at https://aireadi.org/team.
  - role: other
    maintainer_details: >-
      The dataset is hosted on the FAIRhub platform (https://fairhub.io/) through Microsoft Azure.
      FAIRhub is a cloud-based data management, curation and sharing platform developed for this
      project by the FAIR Data Innovations Hub at the California Medical Innovations Institute, with
      the intention of making the platform available for future data generation projects wishing to
      manage and share AI-ready clinical research datasets.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants were
    not told that their data would be retained only for a fixed period and then deleted.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.

external_resources:
  - external_resources:
      - https://docs.aireadi.org/ (dataset documentation, including the version-specific documentation for v3.0.0)
      - https://aireadi.org/ (AI-READI project website)
      - https://aireadi.org/goals/data-sharing (information on dataset availability and access)
      - https://fairhub.io/ (FAIRhub data management and sharing platform)
      - https://zenodo.org/communities/aireadi (Zenodo community of the AI-READI project)
      - https://github.com/AI-READI (GitHub organization of the AI-READI project)
      - https://cds-specification.readthedocs.io (Clinical Dataset Structure specification)
      - https://doi.org/10.5281/zenodo.17555036 (AI-READI custom license v2.0)
      - https://doi.org/10.5281/zenodo.10642459 (AI-READI dataset license v1.0)
      - https://commonfund.nih.gov/bridge2ai (NIH Common Fund Bridge2AI program)
      - https://shileyeye.ucsd.edu/research/ai_readi (AI-READI research internship programme)
    restrictions:
      - >-
        The dataset documentation is shared under the CC-BY 4.0 license, so there are no restrictions
        associated with its use.
    notes: >-
      The healthsheet states that the dataset is self-contained but relies on the dataset
      documentation for users requiring additional information about the provenance of the dataset.
      Related publications describing the dataset and its design are the AI-READI Consortium comment
      "AI-READI: rethinking AI data collection, preparation and sharing in diabetes research and
      beyond", Nature Metabolism 2024;6:2210-2 (https://doi.org/10.1038/s42255-024-01165-x), and
      Owsley C, Matthies DS, McGwin G, et al., "Cross-sectional design and protocol for Artificial
      Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI)", BMJ Open
      2025;15:e097449 (doi:10.1136/bmjopen-2024-097449). The FAIRhub metadata records both
      https://docs.aireadi.org/ and https://aireadi.org/ as related identifiers with relation type
      IsDocumentedBy.

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.60775/fairhub.2
    notes: >-
      Version 2.0.0 of the same dataset, released 8 November 2024 with 1,067 participants, 2.01 TB
      and 165,051 files; the FAIRhub record for that version states it is no longer accessible.
  - relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.60775/fairhub.1
    notes: >-
      Version 1.0.0 of the same dataset, released 3 May 2024 with 204 participants from the pilot
      data collection phase.
  - relationship_type: is_source_of
    target_dataset: https://doi.org/10.60775/fairhub.4
    notes: >-
      A smaller "Mini Version" of the dataset containing 100 participants, provided for pipeline
      development; recorded as the child record of this dataset in the FAIRhub API metadata.

variables:
  - variable_name: N-terminal pro-B-type natriuretic peptide (NT-proBNP)
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma test (University of Washington NORC laboratory)
    notes: 'Reference range varies by age. Included as a severity and outcome predictor of heart failure.'
  - variable_name: Troponin-T
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma test (University of Washington NORC laboratory)
    notes: 'Reference range female <11, male <16. Included as a marker of myocardial injury.'
  - variable_name: C peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test (University of Washington NORC laboratory)
    notes: 'Reference range 1.1-4.4. Included as an indicator of insulin production.'
  - variable_name: Insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test (University of Washington NORC laboratory)
    notes: 'Reference range 0.0-24.9. Included as a marker for diabetes.'
  - variable_name: C reactive protein, high sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 0.0-10.0. Included as an inflammation marker and risk factor for T2DM.'
  - variable_name: Total cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range <200. Included as a cardiovascular disease risk factor.'
  - variable_name: Triglycerides
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range <150. Included as a cardiovascular disease risk factor.'
  - variable_name: High-density lipoprotein cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range >39. Included as a cardiovascular disease risk factor.'
  - variable_name: Low-density lipoprotein cholesterol (calculated)
    data_type: float
    unit: mg/dL
    derivation: Calculated from the lipid panel rather than measured directly.
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range <130. Included as a cardiovascular disease risk factor.'
  - variable_name: Glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 62-125. Included as a marker for diabetes.'
  - variable_name: Blood urea nitrogen
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 8.0-21.0. Included as a marker for kidney and liver function.'
  - variable_name: Creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range female 0.38-1.02, male 0.51-1.18. Included as a marker for kidney function.'
  - variable_name: Blood urea nitrogen/creatinine ratio
    data_type: float
    derivation: Calculated from blood urea nitrogen and creatinine.
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Included as an indicator of kidney function.'
  - variable_name: Sodium
    data_type: float
    unit: mEq/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 135-145. Included as a marker of metabolic health.'
  - variable_name: Potassium
    data_type: float
    unit: mEq/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 3.6-5.2. Included as a marker of metabolic health.'
  - variable_name: Chloride
    data_type: float
    unit: mEq/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 98-108. Included as a marker of metabolic health.'
  - variable_name: Carbon dioxide, total
    data_type: float
    unit: mEq/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 22-32. Included as a marker of metabolic health.'
  - variable_name: Calcium
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 8.9-10.2. Included as a marker of metabolic health.'
  - variable_name: Protein, total
    data_type: float
    unit: g/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 6.0-8.2. Included as a useful tool for overall health status.'
  - variable_name: Albumin
    data_type: float
    unit: g/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 3.5-5.2. Included as a useful tool for overall health status.'
  - variable_name: Globulin, total (calculated)
    data_type: float
    unit: g/dL
    derivation: Calculated from total protein and albumin.
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Included as a useful tool for overall health status.'
  - variable_name: A/G ratio (calculated)
    data_type: float
    derivation: Calculated ratio of albumin to globulin.
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Included as a useful tool for overall health status.'
  - variable_name: Bilirubin, total
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 0.2-1.3. Included as a marker of liver health.'
  - variable_name: Alkaline phosphatase
    data_type: float
    unit: IU/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range varies by age. Included as a marker of liver health.'
  - variable_name: Aspartate aminotransferase
    data_type: float
    unit: IU/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: 'Reference range 9-38. Included as a marker of liver health.'
  - variable_name: Alanine aminotransferase
    data_type: float
    unit: IU/L
    measurement_technique: Serum test (University of Washington NORC laboratory)
    notes: >-
      Reference range female age 7-33 and male age 0-49: 10-64; male age 50 and over: 10-48. Included
      as a marker of liver health.
  - variable_name: HbA1c (hemoglobin A1c)
    data_type: float
    unit: '%'
    measurement_technique: Whole blood test (University of Washington NORC laboratory)
    notes: 'Reference range 4.0-6.0. Included as a marker for diabetes.'
  - variable_name: White blood cell count
    data_type: float
    unit: x10E3/uL
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 3.4-10.8. Included as a useful tool for overall health status.'
  - variable_name: Red blood cell count
    data_type: float
    unit: x10E6/uL
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 3.77-5.80. Included as a useful tool for overall health status.'
  - variable_name: Haemoglobin
    data_type: float
    unit: g/dL
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 11.1-17.7. Included as a useful tool for overall health status.'
  - variable_name: Haematocrit
    data_type: float
    unit: '%'
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 34.0-51.0. Included as a useful tool for overall health status.'
  - variable_name: Mean corpuscular volume (MCV)
    data_type: float
    unit: fL
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 79-97. Included as a useful tool for overall health status.'
  - variable_name: Mean corpuscular hemoglobin (MCH)
    data_type: float
    unit: pg
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 26.6-33.0. Included as a useful tool for overall health status.'
  - variable_name: Mean corpuscular hemoglobin concentration (MCHC)
    data_type: float
    unit: g/dL
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 31.5-35.7. Included as a useful tool for overall health status.'
  - variable_name: Red blood cell distribution width (RDW)
    data_type: float
    unit: '%'
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 11.6-15.4. Included as a useful tool for overall health status.'
  - variable_name: Platelets
    data_type: float
    unit: x10E3/uL
    measurement_technique: >-
      Complete blood count on fresh whole blood, performed by a CLIA-certified laboratory local to
      each data collection site
    notes: 'Reference range 150-450. Included as a useful tool for overall health status.'
  - variable_name: Urine creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test (University of Washington NORC laboratory)
    notes: >-
      No reference range provided (N/A). Included as a urinary biomarker for early diabetic
      nephropathy.
  - variable_name: Urine albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test (University of Washington NORC laboratory)
    notes: >-
      No reference range provided (N/A). Included as a urinary biomarker for early diabetic
      nephropathy.
  - variable_name: Height
    data_type: float
    measurement_technique: Physical measurement during the on-site visit.
  - variable_name: Weight
    data_type: float
    measurement_technique: Physical measurement during the on-site visit.
  - variable_name: Waist circumference
    data_type: float
    measurement_technique: Physical measurement during the on-site visit.
  - variable_name: Hip circumference
    data_type: float
    measurement_technique: Physical measurement during the on-site visit.
  - variable_name: Waist-hip ratio
    data_type: float
    derivation: Calculated from measured waist and hip circumference.
  - variable_name: Body mass index
    data_type: float
    derivation: Calculated from measured height and weight.
  - variable_name: Systolic blood pressure
    data_type: float
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric medically approved device; measured twice separated by 2 minutes.
    notes: >-
      Participants with readings over 180 mm Hg, or under 100 mm Hg with any symptoms of
      haemodynamic instability, are recommended to go for emergency care.
  - variable_name: Diastolic blood pressure
    data_type: float
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric medically approved device; measured twice separated by 2 minutes.
    notes: >-
      Participants with readings greater than 120 mm Hg, or less than 60 mm Hg along with any
      symptoms of haemodynamic instability, are recommended to go for emergency care.
  - variable_name: Heart rate
    data_type: float
    unit: beats per minute
    measurement_technique: >-
      Read from the blood pressure measurement device or the electrocardiogram; measured twice
      separated by 2 minutes.
  - variable_name: 12-lead electrocardiogram waveform
    data_type: array
    measurement_technique: >-
      Philips PageWriter TC30 Cardiograph, with the participant sitting in a reclining chair or lying
      supine.
  - variable_name: ECG recording position
    data_type: categorical
    categories:
      - 0 degrees
      - 30 degrees
      - 60 degrees
      - 90 degrees
    notes: 'Position of the participant relative to supine, recorded at the time of the ECG.'
  - variable_name: Monofilament touch perception
    data_type: categorical
    categories:
      - 'yes (felt the filament)'
      - 'no (insensate)'
    measurement_technique: >-
      10 g monofilament applied at three locations on each foot, 10 times per location, with the
      participant's eyes closed and shoes and socks removed; insensate areas retested for
      confirmation.
  - variable_name: Montreal Cognitive Assessment (MoCA) total score
    data_type: integer
    maximum_value: 30
    measurement_technique: >-
      MoCA administered electronically on an iPad using the MoCA Duo application (MoCA Cognition,
      Quebec, Canada).
    notes: >-
      Higher numbers represent better performance; the maximum score is 30. Section subscores, the
      Memory Index Score and task completion times are also exported.
  - variable_name: Photopic best-corrected visual acuity
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes tested
      separately under best-corrected conditions with a general occluder.
    notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate better
      resolution. Snellen visual acuity variables were dropped in v3.0.0.
  - variable_name: Mesopic best-corrected visual acuity
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester viewed through a 2.0 neutral density filter,
      which reduces the light level of the test to a mesopic level.
  - variable_name: Photopic letter contrast sensitivity
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars letter contrast sensitivity chart (Mars Perceptrix) read monocularly at approximately 50
      cm with a general occluder, background luminance 60-120 cd/m2 (optimal 85 cd/m2), illuminance
      189-377 lux (optimal 267 lux).
    derivation: >-
      Log contrast sensitivity computed by multiplying the number of errors prior to the final
      correct letter by 0.04 and subtracting the result from the log CS value at the final correct
      letter.
    notes: 'Higher numbers mean better sensitivity.'
  - variable_name: Mesopic letter contrast sensitivity
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars letter contrast sensitivity chart viewed through a 2.0 neutral density occluder with a low
      luminance filter lens.
  - variable_name: Autorefraction spherical component
    data_type: float
    unit: diopter
    measurement_technique: Topcon KR 800 auto keratometer/refractor, standard protocol, each eye.
  - variable_name: Autorefraction cylindrical component
    data_type: float
    unit: diopter
    measurement_technique: Topcon KR 800 auto keratometer/refractor, standard protocol, each eye.
  - variable_name: Autorefraction cylindrical axis
    data_type: float
    unit: degrees
    measurement_technique: Topcon KR 800 auto keratometer/refractor, standard protocol, each eye.
  - variable_name: Continuous glucose measurement
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Dexcom G6 continuous glucose monitor worn for 10 days, recording a measurement every 5 minutes.
    notes: >-
      Participants are masked to the results during the monitoring period. Participants already
      wearing a Dexcom G6 could optionally share up to 90 days of prior glucose data through Dexcom
      Clarity, for up to 100 days total.
  - variable_name: Step count
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Wearable heart rate
    data_type: float
    unit: beats per minute
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Sleep duration and sleep phases
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
    notes: 'Captures circadian and diurnal rhythm.'
  - variable_name: Oxygen saturation (SpO2)
    data_type: float
    unit: '%'
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Respiratory rate
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Stress level
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Physical activity calories
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Ambient temperature
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Relative humidity
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Nitrogen oxides (NO and NO2)
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Volatile organic compounds
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Particulate matter PM1.0
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Particulate matter PM2.5
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Particulate matter PM4.0
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Particulate matter PM10.0
    data_type: float
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days.
  - variable_name: Multi-spectral light intensity measurements
    data_type: array
    measurement_technique: >-
      Custom-built LeeLab Anura indoor environmental sensor placed in the participant's home for 10
      days; 11 spectral channels.