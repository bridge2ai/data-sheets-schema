notes: >-
  Additional documented facts that fit no dedicated slot. (1) Audit status: the healthsheet states
  the dataset has not undergone any formal external audits, but has been reviewed internally by
  AI-READI team members for quality checks and to ensure that no personally identifiable
  information was accidentally included. (2) Data protection impact assessment: the healthsheet
  states that no data protection impact analysis has been conducted. (3) Prior use: at the time of
  the v3.0.0 healthsheet the dataset had not been used for any tasks, and there is no repository
  that links to papers or systems that use the dataset. (4) In-kind support: the Nature Metabolism
  comment thanks the Microsoft AI for Good Lab for supporting the cloud services needed for the
  project; Topcon Corporation (Tokyo, Japan), Optomed (Oulu, Finland), iCare World (Raleigh, NC)
  and Carl Zeiss (Oberkochen, Germany) for loaning devices for research purposes at no cost; and
  Heidelberg Engineering (Heidelberg, Germany), Dexcom (San Diego, CA) and Garmin (Olathe, KS) for
  research discounts on study devices. (5) Organizational discrepancy: the FAIRhub structured
  metadata records the managing organization and lead sponsor as "Washington University in St.
  Louis" (ROR 01yc7t268) and gives that as the affiliation of the study principal investigators
  Aaron Lee and Cecilia Lee, whereas the NIH RePORTER record (project 1OT2OD032644-01), the BMJ Open
  protocol and the Nature Metabolism comment identify the University of Washington as the awardee
  organization, the reviewing IRB, and the investigators' institution. (6) Target enrolment
  discrepancy: the BMJ Open protocol, the FAIRhub study description and the NIH RePORTER abstract
  give a target of 4,000 participants (1,000 in each of four diabetes-severity groups; NIH RePORTER
  states "4,000+ people and longitudinal data from 10% of the study cohort"), while the UW IRB
  protocol form states 4,600. (7) Participant-facing return of results: heart rate, blood pressure
  and visual acuity results are given to participants on an exam card at the end of the visit; a
  Dexcom report of average blood glucose and a Glucose Management Indicator is sent by encrypted
  email after the 10-day at-home monitoring period; laboratory results with normative values are
  released to participants at the time of the yearly data release by HIPAA-compliant encrypted
  email. Coordinators alert participants to defined incidental findings (extreme blood pressure or
  heart rate readings; suspected retinal detachment, tumour or optic disc oedema) and refer them for
  emergency or ophthalmic care. (8) Communication and inclusion: all communication with participants
  was in English; accessibility measurements were not specifically assessed, but transportation
  assistance (rideshare services) was offered to participants who reported barriers to transport.
  Data were collected in the USA. (9) Workforce development: AI-READI hosts a year-long research
  internship programme (2-week data science/programming bootcamp followed by a yearlong curriculum
  of didactic lectures and mentored research); the inaugural 2023-2024 cohort had 10 interns, 70%
  women, 30% Black, 50% from under-represented backgrounds based on NIH criteria. (10) Community
  involvement: a Community Advisory Board of 11 persons from the three sites, including diversity in
  race and ethnicity as represented in the AI-READI sample, contributes to protocol development; the
  project also engages the Native Biodata Consortium as a co-learning opportunity on challenges
  specific to American Indian and Alaska Native communities. (11) Biorepository: blood derivatives
  (plasma, serum, buffy coats, genomic DNA, PAXgene-stabilised RNA and peripheral blood mononuclear
  cells) are banked at the University of Alabama at Birmingham Center for Clinical and Translational
  Science for future genomics, proteomics, metabolomics and immunological studies; these specimens
  are not part of the released digital dataset and procedures for reviewing and prioritising written
  requests were still in development.

