purposes:
  - response: >-
      To collect and publicly share a large, ethically sourced, AI-ready multimodal dataset on type 2
      diabetes mellitus that enables future generations of artificial intelligence and machine
      learning research into the pathogenesis and salutogenesis of T2DM.
  - response: >-
      To develop a foundational dataset in type 2 diabetes, agnostic to existing classification
      criteria or biases, that can be used to reconstruct a temporal atlas of T2DM development and
      reversal towards health.
  - response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data for AI/ML purposes, including guidance from bioethicists, so that the project
      can serve as a blueprint for future data generation projects.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel at
      the intersection of biomedicine and artificial intelligence.
  - response: >-
      To engage in tribal consultation and, through engagement with the Native Biodata Consortium,
      address barriers and facilitators of participation with the goal of collecting similar data
      within a Native American cohort in an ethical and respectful manner.

addressing_gaps:
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as T2DM
      has been limited by a lack of well-designed, high quality, large and inclusive multimodal
      datasets that are AI ready for training models.
  - response: >-
      Under-representation of racialised groups in past T2DM research; a meta-epidemiological review
      of type 2 diabetes randomised clinical trials published between 2000 and 2020 found that
      samples lacked racial and ethnic diversity, while the prevalence and consequences of T2DM are
      greater in certain racial and ethnic populations.
  - response: >-
      Current understanding of T2DM, especially in the context of salutogenesis (the pathway from
      disease back to health), is limited.
  - response: >-
      Existing data sources such as claims or electronic health record data do not support the
      downstream AI/ML analyses that the multi-domain, multimodal AI-READI acquisition protocol
      enables.
  - response: >-
      Most existing large datasets used for AI/ML training are not balanced across race/ethnicity,
      biological sex and disease severity, which is critical for the development of unbiased machine
      learning models.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease trajectories by
      collecting and learning from complex multimodal data from participants with differing disease
      severity (normal to insulin-dependent T2DM).
  - response: >-
      Development of AI and machine learning models of type 2 diabetes pathogenesis and
      salutogenesis, including multimodal model development.
  - response: >-
      Reconstruction of a temporal atlas of T2DM development and reversal towards health.
  - response: >-
      Investigation of underlying genetic links in different racial/ethnic cohorts using the
      controlled-access genomic data.

intended_uses:
  - use_category: research
    examples:
      - Type 2 diabetes related research
    usage_notes: >-
      Accessing the public v3.0.0 dataset requires logging in through a verified ID system and
      agreeing to use the data only for type 2 diabetes related research, in addition to agreeing to
      the license terms. The FAIRhub dataset consent metadata states that the public version of the
      dataset can only be used for type 2 diabetes related research, while a private (controlled
      access) version will allow for more generic use.
  - use_category: commercial
    examples:
      - Development of models, algorithms and programs that are trained or adapted using the data
    usage_notes: >-
      The AI-READI Data License Agreement v1.0 grants a non-exclusive and non-transferable license to
      download, reproduce and use the data and to create derivative works for research and
      commercial purposes. Licensees may make, reproduce and distribute models, algorithms and
      programs developed, trained or adapted using the data provided the models do not themselves
      contain the data or a modified version of it, and provided reasonable efforts are undertaken
      before dissemination to minimise the likelihood that data can be memorized, derived,
      reconstructed or reconstituted through use or construction of such models.

prohibited_uses:
  - prohibition_reason: >-
      Licensees shall not make clinical treatment decisions based on the data, as it is intended
      solely as a research resource (AI-READI Data License Agreement v1.0, section 3(i)).
  - prohibition_reason: >-
      Licensees shall not use or attempt to use the data, alone or in concert with other information,
      to compromise or otherwise infringe the confidentiality of information on an individual data
      subject or their right to privacy, to identify or contact any individual data subject or group
      of data subjects, to extract or extrapolate identifying information, to establish a particular
      data subject's membership in a particular group of persons, or otherwise to cause harm or
      injury to any data subject (section 3(ii)).
  - prohibition_reason: >-
      Licensees shall not transfer, license, sublicense, sell, assign, display, share or otherwise
      convey any portion of the data or any derivative work to any third party other than another
      licensee bound by an agreement with the licensor on identical terms (section 2).
  - prohibition_reason: >-
      Licensees shall not disseminate models developed from the data without first undertaking all
      reasonable efforts to minimise the likelihood that data can be memorized, derived,
      reconstructed or reconstituted through the use or construction of such models (section 2).
    notes: >-
      These prohibitions are transcribed from the University of Washington AI-READI Data License
      Agreement v1.0 (Zenodo record 10.5281/zenodo.10642459), which is the license text present in
      the source bundle. Version 3.0.0 of the dataset is distributed under "AI-READI custom license
      v2.0" (https://doi.org/10.5281/zenodo.17555036), whose text is not present in the bundle.

future_use_impacts:
  - impact_details: >-
      To the extent of the creators' knowledge, no uses of the dataset are currently anticipated that
      could result in unfair treatment of individuals or groups or other undesirable harms; however,
      there is a theoretical risk of future re-identification. The project notes that AI algorithms
      can infer individual patient characteristics and could facilitate individual-level
      identification, and it implements a robust data dissemination system, a strict licence
      agreement and data watermarking for both the public and controlled sets to prevent
      re-identification attempts.
  - impact_details: >-
      Because sex, race and ethnicity are withheld from the public release, users of the public
      dataset cannot directly evaluate model behaviour across those groups; to mitigate disparities
      in models developed from the dataset, the project supplies a recommended train/validation/test
      split whose validation and test sets are balanced as well as possible for sex, race/ethnicity
      and diabetes status.
  - impact_details: >-
      Enrollment is ongoing, so the pilot data release and periodic updates to data releases may not
      have achieved the intended balanced distribution across race/ethnicity, sex and diabetes
      severity groups; models trained on an interim version may therefore reflect the imbalance of
      that version rather than the intended triple-balanced design.
  - impact_details: >-
      Factors that may limit generalization of derived models include predominantly urban and
      hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic
      backgrounds, and a cohort that does not include other races/ethnicities such as Pacific
      Islanders and Native Americans.

acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Directly observed data were acquired during a single in-person study visit of approximately
      2.5-4 hours: vital signs and anthropometrics, 12-lead ECG, monofilament testing for peripheral
      neuropathy, cognitive screening, vision testing and autorefraction, retinal imaging on multiple
      devices, and blood and urine collection for clinical laboratory testing.
  - was_directly_observed: true
    acquisition_details: >-
      At-home directly measured data were acquired over a 10-day period after the visit using a
      Dexcom G6 continuous glucose monitor, a Garmin Vivosmart 5 physical activity monitor, and a
      custom-built indoor environmental sensor; participants returned the devices to study staff by
      overnight mail or in person, together with a data sheet indicating which wrist the fitness
      tracker was worn on, their dominant hand, and where the environmental sensor was placed.
  - was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Subject-reported data were collected through self-administered questionnaires completed
      electronically in REDCap before or after the visit (or on paper), covering screening/eligibility,
      demographics, depressive symptoms, diabetes distress and self-care, diet, ophthalmic history,
      smoking/alcohol/vaping/marijuana use, general health history, social determinants of health,
      and current medications. Verification of data entry was performed when possible, for example by
      cross-referencing entered medications with medications that were physically brought in or
      photographed by each study participant.
  - was_inferred_derived: true
    acquisition_details: >-
      Derived values were computed from directly measured quantities, including body mass index and
      waist-hip ratio from anthropometrics, calculated LDL cholesterol, calculated total globulin,
      calculated A/G ratio and calculated blood urea nitrogen/creatinine ratio from the laboratory
      panel, logMAR visual acuity, and log contrast sensitivity computed from the number of errors
      before the final correct letter on the Mars chart.

collection_mechanisms:
  - mechanism_details: >-
      REDCap electronic data capture was used for patient-reported questionnaire data and for the
      following clinical data from the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results, and complete blood count results. REDCap was also used
      for the recruitment interface, screening survey and electronic consent.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Philips, Amsterdam, The Netherlands) used for a 12-lead
      ECG performed with the participant in a reclining chair or supine; the position is recorded as
      0, 30, 60 or 90 degrees relative to supine. Data are exported as .xml.
  - mechanism_details: >-
      Retinal photography: Optomed Aurora IQ handheld non-mydriatic fundus camera (Optomed, Oulu,
      Finland), 50-degree field of view, 5 Mpix sensor, 4 images per participant, undilated, DICOM
      output; and iCare EIDON widefield truecolor confocal fundus system (iCare USA, Raleigh, North
      Carolina), up to 200 degrees, ultra-wide field central/nasal/temporal colour images, central
      infrared and fundus autofluorescence, plus a mosaic, 12 images per participant, DICOM output,
      operated in fully automated mode.
  - mechanism_details: >-
      Heidelberg Spectralis HRA OCT and OCTA (Heidelberg Engineering GmbH, Heidelberg, Germany):
      Optic Nerve Head Radial Circle High Resolution (OCT), Posterior Pole Macula HR 61 lines (OCT),
      and Macula 20x20 HS 512 lines (OCTA); 6 images per participant; DICOM output.
  - mechanism_details: >-
      Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan): 3D Wide (H)
      12x9-512x128 (OCT), 3D Macula 6x6-512x128 (OCT), Macula 6x6-360x360 (OCTA); 6 images per
      participant; exported in .fda and converted to DICOM for the dataset.
  - mechanism_details: >-
      Topcon Triton DRI OCT (Topcon Healthcare): 3D(H)+Rad 12x9-512x256 (OCT), Macula 6x6-320x320
      (OCTA), Macula 12x12-512x512 (OCTA); swept-source, 1,050 nm light source with non-mydriatic
      colour fundus camera; 6 images per participant; exported in .fda and converted to DICOM.
  - mechanism_details: >-
      Zeiss Cirrus 5000 Angioplex (Carl Zeiss Meditec AG, Jena, Germany): Disc Cube 200x200 (OCT),
      Macula Cube 512x128 (OCT), Macula 6x6 (OCTA), Disc 6x6 (OCTA); 8 images per participant; DICOM
      output.
  - mechanism_details: >-
      Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) (Heidelberg Engineering GmbH):
      macula-centred acquisition, 2 images per participant; exported in .sdt file format and
      converted to DICOM for the dataset. FLIO is performed last in the visit because it takes longer
      and exposes participants to uncomfortable levels of light.
  - mechanism_details: >-
      Dexcom G6 continuous glucose monitor (Dexcom, Inc., San Diego, California) worn continuously
      for 10 days, recording blood glucose measurements in mg/dL every 5 minutes; participants are
      masked to the results during the monitoring period; .csv output.
  - mechanism_details: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland) recording
      steps, heart rate, sleep duration, oxygen saturation, respiration rate, activity type and
      stress level; exported in .FIT and converted to the Open mHealth standard for the dataset.
  - mechanism_details: >-
      Custom-designed indoor environmental sensor (the LeeLab Anura), designed at the Karalis Johnson
      Retina Center, University of Washington, Seattle, recording ambient temperature, relative
      humidity, nitrogen oxides (NO and NO2), volatile organic compounds, particulate matter
      (PM1.0, PM2.5, PM4, PM10) and 11 multi-spectral light intensity measurements; .csv output. The
      environmental sensor and fitness tracker were specifically chosen with participant privacy as a
      primary concern: they do not capture video or audio, are not equipped with GPS location
      monitoring, and are not synced with participant-owned devices.
  - mechanism_details: >-
      Montreal Cognitive Assessment (MoCA) administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada); total score, section subscores, Memory Index
      Score and task completion times exported as .csv.
  - mechanism_details: >-
      Vision testing instruments: M&S Technologies Electronic Visual Acuity tester (Niles, Illinois)
      at 4 metres on a 12x20 inch touch-screen monitor for photopic and mesopic best-corrected
      acuity (mesopic via a 2.0 neutral density filter); Mars letter contrast sensitivity chart (Mars
      Perceptrix, Chappaqua, New York) read monocularly at approximately 50 cm under photopic and
      mesopic conditions; Topcon KR 800 autorefractor/keratometer (Topcon Healthcare); and
      lensometers (NIDEK LM-600P, Topcon CL-200, Topcon CL-300).
  - mechanism_details: >-
      Blood pressure and heart rate measured twice, separated by 2 minutes, with an automatic
      oscillometric medically approved device; devices used across sites are the OMRON HEM 907XL, the
      Medline MDS4001 Automatic Digital Blood Pressure Monitor, and the Welch Allyn 6000 series vital
      signs monitor with FlexiPort reusable cuff.
  - mechanism_details: >-
      Peripheral neuropathy assessed with the 10 g monofilament test on both feet with shoes and
      socks removed; participants keep their eyes closed and respond yes/no to the filament at three
      locations on each foot, 10 times per location, with insensate areas retested for confirmation;
      results recorded on iPad, laptop or paper and entered into REDCap.
  - mechanism_details: >-
      Laboratory testing of blood and urine: complete blood count performed on fresh whole blood by
      Clinical Laboratory Improvement Amendments-certified laboratories local to each data collection
      site; all other assays performed by the University of Washington Nutrition and Obesity Research
      Center (NORC) testing facility on stored frozen samples, with results provided in .csv format.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Collection window for the data contained in version 3.0.0 of the dataset, as recorded in the
      FAIRhub dataset_description (dateType Collected) and in the healthsheet and README.
  - start_date: '2023-07-18'
    end_date: '2023-11-30'
    timeframe_details: >-
      Preliminary pilot enrolment period described in the BMJ Open protocol, conducted so that all
      coordinators could secure sufficient familiarity with the protocol; formal data collection began
      on 1 December 2023. Preliminary data from the pilot enrolment period were included in the first
      released dataset (v1.0.0, May 2024). Note that the BMJ Open protocol gives 18 July 2023 as the
      enrolment start date whereas the FAIRhub metadata and study description give 19 July 2023.
  - start_date: '2023-07-18'
    end_date: '2026-11-30'
    timeframe_details: >-
      Planned overall recruitment period stated in the BMJ Open protocol ("Enrolment began on 18 July
      2023 and will continue until 30 November 2026"). The FAIRhub study description records a study
      start date of 2023-07-19 (Actual) and an anticipated completion date of 2027-01-01. The NIH
      RePORTER record gives a project period of 2022-09-01 to 2025-08-31, and the Nature Metabolism
      comment describes enrolment of 4,000 participants at three study sites over four years
      (2022-2026).
  - timeframe_details: >-
      Per-participant timeframe: a single in-person visit lasting between 2.5 and 4 hours, preceded by
      approximately 1 hour of at-home self-reported surveys and followed by 10 days of at-home
      continuous glucose monitoring, physical activity monitoring and environmental measurement.
      Approximately 10 percent (elsewhere stated as approximately 4 percent) of participants are
      expected to be invited back for a follow-up examination in year 4 of the project.

data_collectors:
  - role: academic_institution
    collector_details: >-
      Clinical research coordinators and research assistants at the three data collection sites
      (University of Alabama at Birmingham, University of California San Diego, University of
      Washington) contacted and consented participants, conducted the study visit including
      ophthalmic imaging, trained participants on the continuous glucose monitor and fitness tracker,
      and ensured the return of all study materials.
    notes: >-
      All research personnel at the three data sites who recruited, enrolled and collected data
      underwent training by the data manager at UAB and used a detailed Manual of Procedures.
      Successful completion of a certification process was required for all coordinators, including
      mandatory institutional compliance training for human subject research; before enrolling and
      testing participants, all coordinators had to successfully administer all protocol elements to
      at least three volunteer practice subjects, meeting the standards outlined in the Manual of
      Procedures.
  - role: academic_institution
    collector_details: >-
      Data managers at each site oversaw the data collection process and were responsible for the
      quality control of all data before uploading to the FAIRhub platform, including review of
      REDCap range-check reports and editing of flagged records under the guidance and approval of
      the site principal investigator.
  - role: data_subject
    collector_details: >-
      Study participants themselves generated data by completing self-administered questionnaires
      before or after the visit and by wearing or placing the continuous glucose monitor, fitness
      tracker and home environmental sensor for 10 days, returning them with a data sheet recording
      wrist worn, dominant hand and sensor placement.
  - role: academic_institution
    collector_details: >-
      Phlebotomists and laboratory assistants at each site collected approximately 53 mL of
      non-fasting blood plus a urine specimen, processed plasma, serum and buffy coats locally on the
      day of collection using standardised operating procedures, and shipped samples on dry ice to
      the University of Washington NORC laboratory (approximately quarterly) and to the UAB Center
      for Clinical and Translational Science biobank.
  - role: automated_system
    collector_details: >-
      Instrumented data capture by the study devices themselves (retinal imaging systems,
      electrocardiograph, MoCA Duo tablet application, Dexcom G6, Garmin Vivosmart 5 and the custom
      LeeLab Anura environmental sensor), whose outputs were exported in raw format to local storage
      and then uploaded at regular intervals to FAIRhub.

direct_collection:
  - is_direct: true
    collection_details: >-
      The data were collected directly from participants across the three recruiting sites.
      Recruitment pools were identified by screening electronic health records for diabetes and
      pre-diabetes ICD-10 codes (E11.X and R73.09) among patients who had had an encounter with the
      sites' health systems; the study base is all patients aged 40 years or older with a medical
      encounter at UAB, UCSD or UW between 2020 and 2025. Data collection was active rather than
      passive or secondary use of existing data.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      Patients aged 40 years or older with a medical encounter within each health system site (UAB,
      UCSD, UW) between 2020 and 2025, identified by screening electronic health records for ICD-10
      diagnosis codes R73.09 (pre-diabetes) and E11.X (type 2 diabetes); patients without diabetes do
      not have encounters with these ICD codes.
    strategies:
      - >-
        Triple balancing: participants are recruited in approximately equal proportions across four
        self-reported race/ethnic groups (Asian, Black, Hispanic, White), four categories of T2DM (no
        diabetes; pre-diabetes/lifestyle-controlled diabetes; diabetes treated with oral medications
        or non-insulin injectable medications; insulin-controlled diabetes) and biological sex (male,
        female), rather than targeting the demographic distribution of the US population.
      - >-
        Recruitment in waves, with the composition and size of each wave influenced by observed
        participation characteristics of race/ethnicity, gender, T2DM severity and site according to
        health records; composition is monitored for diversity and inclusion and adjusted by under-
        and oversampling groups as needed.
      - >-
        Site-level prioritisation based on regional demographics: all study groups are recruited at
        every site, but the proportion of each group varies with the demographic prevalence of that
        group in the site's geographical area.
      - >-
        Mailed hardcopy invitation letters and invitation emails personalised with links, access codes
        and QR codes directing individuals into an online REDCap recruitment interface, with follow-up
        phone calls; the FAIRhub study description records the sampling method as "Non-Probability
        Sample".
    why_not_representative: >-
      The cohort is deliberately balanced rather than demographically representative of the US
      population. Participants are volunteers, so there is selection bias known as volunteer bias
      which may limit generalisability to those not represented in the study population. Recruitment
      is predominantly urban and hospital-based and may not fully capture diverse cultural and
      socioeconomic backgrounds, and the cohort does not include other races/ethnicities such as
      Pacific Islanders and Native Americans. Requiring that eligible participants speak, read and
      understand English may also have created challenges in recruiting Hispanic and/or Asian
      persons.
    notes: >-
      The healthsheet answers the "sample versus all possible instances" question by stating that the
      dataset contains all possible instances, that is, data from all participants enrolled during
      the covered collection period, and answers the preprocessing question about sampling strategy
      with "N/A". Three recording sites were strategically selected for geographic diversity across
      the United States and to ensure diverse representation across racial and ethnic groups.

instances:
  - instance_type: Individual participant (patient)
    data_substrate: >-
      Tabular survey and clinical data, medical imaging (DICOM), physiological signal/waveform data
      (WFDB), and time-series wearable and environmental sensor data (Open mHealth and ASCII/CSV).
      There is no unstructured text data in the dataset.
    data_topic: >-
      Type 2 diabetes mellitus and salutogenesis, including vitals and anthropometrics, retinal
      imaging, electrocardiography, cognitive function, continuous glucose monitoring, physical
      activity, home air quality, blood and urine laboratory results, and psychosocial variables
      including social determinants of health.
    label_description: >-
      No explicit label or target is associated with each data instance; the dataset is
      hypothesis-agnostic and no labeling was performed, so no gold-standard or proxy labels, no
      annotation software and no human labellers are involved.
    missing_information: >-
      Not all modalities are available for all participants: some participants elected not to
      participate in some study elements; in a few cases the data collection device had no stored
      results or was returned too late to retrieve the results (for example the battery died or data
      were lost); and in a few cases a data collision at some point in the process caused data loss.
    notes: >-
      Each instance consists of all data available for one individual participating in the study.
      Version 3.0.0 contains 2,280 instances; version 1.0.0 contained 204 (pilot phase) and version
      2.0.0 contained 1,067. Data are organised in the released dataset as one folder per participant
      within each device folder, named after the participant's study ID number.

relationships:
  - relationship_details: >-
      All instances are part of the same prospective data generation project (AI-READI). There is
      currently only one visit per participant, so instances are not linked longitudinally in this
      version; the study design anticipates inviting approximately 10 percent of the cohort back for
      a follow-up visit in year 4 of the project.

subpopulations:
  - subpopulation_elements_present: false
    identification: >-
      Self-reported race/ethnicity in four groups (Asian, Black, Hispanic, White) is collected at
      screening but is withheld from the public dataset and released only under controlled access, so
      the public release does not identify this demographic sub-population at the instance level.
    distribution: >-
      Aggregate counts documented in the v3.0.0 README recommended-split table for all 2,280
      participants: Hispanic 380, Asian 545, Black 519, White 836. Within the recommended split the
      training set contains Hispanic 204, Asian 369, Black 343, White 660, while the validation and
      test sets each contain 88 participants in each of the four groups.
    notes: >-
      The Nature Metabolism comment states that information related to sex and race/ethnicity is
      stripped from the public set to prevent stigmatization of findings.
  - subpopulation_elements_present: false
    identification: >-
      Biological sex (male, female) is collected at screening but is withheld from the public dataset
      and released only under controlled access.
    distribution: >-
      Aggregate counts for all 2,280 participants: male 951, female 1,329. Training set male 599,
      female 977; validation set male 176, female 176; test set male 176, female 176.
  - identification: >-
      Diabetes status group in four categories used to balance the cohort: no diabetes; pre-diabetes
      or type 2 diabetes controlled by lifestyle adjustments; type 2 diabetes controlled by oral or
      non-insulin injectable medications; and insulin-controlled type 2 diabetes.
    distribution: >-
      Aggregate counts for all 2,280 participants: no diabetes 776, lifestyle 560, oral 686, insulin
      258. Training set 600/384/487/105; validation set 88/88/109/67; test set 88/88/90/86.
  - identification: >-
      Age of participants (inclusion criterion 40 years or older; the FAIRhub eligibility module
      records a maximum age of 85 years).
    distribution: >-
      Mean age in years for the v3.0.0 cohort: overall 60.8 +/- 11.3; training set 61.1 +/- 11.3;
      validation set 60.3 +/- 10.8; test set 60.5 +/- 11.4.

splits:
  - split_details: >-
      The v3.0.0 release comes with a recommended train/validation/test split in proportions of
      70%/15%/15% (1,576 / 352 / 352 participants of 2,280), provided in the participants.tsv file.
      Because sex, race and ethnicity are not released with the public version of the dataset, the
      project team prepared the split so that the validation and test sets are balanced as well as
      possible for sex, race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle
      controlled, oral medication controlled, and insulin controlled). The healthsheet states that
      this recommended split is new in v3.0.0 and is aimed at reducing disparities in models
      developed using the dataset.

subsets:
  - id: https://doi.org/10.60775/fairhub.3#train
    name: Recommended training split
    description: >-
      1,576 participants (approximately 70% of the 2,280 in v3.0.0). Race/ethnicity: Hispanic 204,
      Asian 369, Black 343, White 660. Sex: male 599, female 977. Diabetes status: no diabetes 600,
      lifestyle 384, oral 487, insulin 105. Mean age 61.1 +/- 11.3 years.
    is_data_split: true
  - id: https://doi.org/10.60775/fairhub.3#validation
    name: Recommended validation split
    description: >-
      352 participants (approximately 15%). Race/ethnicity: Hispanic 88, Asian 88, Black 88, White
      88. Sex: male 176, female 176. Diabetes status: no diabetes 88, lifestyle 88, oral 109, insulin
      67. Mean age 60.3 +/- 10.8 years.
    is_data_split: true
  - id: https://doi.org/10.60775/fairhub.3#test
    name: Recommended test split
    description: >-
      352 participants (approximately 15%). Race/ethnicity: Hispanic 88, Asian 88, Black 88, White
      88. Sex: male 176, female 176. Diabetes status: no diabetes 88, lifestyle 88, oral 90, insulin
      86. Mean age 60.5 +/- 11.4 years.
    is_data_split: true

