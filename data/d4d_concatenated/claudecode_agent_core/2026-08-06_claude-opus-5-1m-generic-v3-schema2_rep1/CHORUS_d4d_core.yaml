raw_data_sources:
  - source_description: >-
      Structured electronic health record data from contributing hospital EHR systems, including
      demographics, diagnoses, procedures, medication administration, and nursing flowsheets.
    notes: "Standardized to the OMOP Common Data Model after extraction."
  - source_description: "Unstructured electronic health record text (clinical notes) from contributing hospital EHR systems."
    raw_data_format: "free text"
    notes: "Extracted and tokenized using the OHNLP toolkit; notes remain stored locally except tokens."
  - source_description: "Medical images retrieved from hospital picture archiving and communication systems (PACS)."
    raw_data_format: "DICOM"
  - source_description: >-
      Continuous physiological waveform telemetry acquired from bedside monitors via
      gateway/middleware systems.
    raw_data_format: "WFDB"
  - source_description: "EEG waveform recordings from hospital EEG databases."
    raw_data_format: "EDF+ and Persyst"
  - source_description: >-
      Social determinants of health and contextual factors, including geographic distance to the
      nearest hospital derived from OMOP Location entities.

acquisition_methods:
  - acquisition_details: >-
      Retrospective extraction of existing clinical data recorded during care at 14 data contributing
      hospitals, covering structured EHR data, clinical notes, PACS imaging, bedside monitor waveform
      telemetry, and hospital EEG database recordings.
    was_directly_observed: true
  - acquisition_details: >-
      Derived data elements are generated from the source records: unstructured EHR text is tokenized
      with the OHNLP toolkit, and OMOP Location entities are geocoded via DeGauss to add contextual
      factors such as geographic distance to the nearest hospital.
    was_inferred_derived: true
  - acquisition_details: >-
      Semantic mappings connecting source-format clinical data to international standards undergo
      clinical validation; a chorus-mapping repository holds documentation and pooled tabular mappings
      with an associated clinical validation SOP, and SOP documents undergo internal validation and
      review within the Chorus_SOP repository.
    was_validated_verified: true

collection_mechanisms:
  - mechanism_details: >-
      Site-level extraction and upload tooling: the chorus-extract-upload repository provides tools to
      create and upload a CHoRUS Data Extract, and contributing sites follow the interactive workflow
      and SOP documents in the Chorus_SOP and data_acq_SOP repositories.
  - mechanism_details: >-
      Bedside monitors with gateway/middleware systems for the acquisition of waveform telemetry.
  - mechanism_details: "Hospital picture archiving and communication systems (PACS) for imaging."
  - mechanism_details: "Hospital EEG databases for EEG waveform recordings."
  - mechanism_details: >-
      The OHNLP toolkit for extraction and tokenization of unstructured electronic health record text.

data_collectors:
  - collector_details: >-
      Fourteen hospitals act as Data Acquisition centers within a collaboration spanning 20 academic
      centers; site data managers extract, curate, and deliver interoperable CHoRUS data extracts.
    notes: >-
      Data contributing sites provide regular status updates on their progress in creating and curating
      a CHoRUS-specific clinical data extract, submitted through the GitHub interface or a Google Form
      that triggers updates to GitHub status and issue information via the API.
  - collector_details: >-
      CHoRUS sub-teams (Standards, Data Acquisition, and Tooling) within the CHoRUS data generation
      project support and coordinate the acquisition, standardization, tokenization, storage,
      visualization, and labeling of contributed data.

collection_timeframes:
  - timeframe_details: >-
      Retrospective data collection carried out over the CHoRUS data generation project period; the
      NIH award runs from 2022-09-01 to 2026-11-30. As of August 2025 the dataset covered 14 different
      hospitals with over 45K unique admissions. The declared bundle does not state the calendar range
      of the underlying clinical records, so no start or end date for the retrospective data itself is
      recorded here.

sampling_strategies:
  - notes: >-
      The project establishes a legal framework for collecting data at scale, sampling to ensure
      comprehensive sets of patient conditions and clinical treatment strategies. Federated access is
      described as an approach that will enable sampling methods to ensure a balanced and diverse
      cohort; the declared bundle presents this as a design intention for the network rather than as a
      completed property of the released data.

preprocessing_strategies:
  - preprocessing_details: >-
      Source clinical data are standardized to the OMOP Common Data Model using validated semantic
      mappings maintained in the chorus-mapping repository, with an associated clinical validation SOP.
  - preprocessing_details: >-
      Unstructured electronic health record text is extracted and tokenized using the OHNLP toolkit and
      released under the OHNLP open source schema.
  - preprocessing_details: >-
      Waveform telemetry is converted to WFDB (PhysioNet schema, extended) using documentation and
      conversion scripts in the chorus_waveform and chorus_waveform_resources repositories; EEG data
      are handled in EDF+ and Persyst formats.
  - preprocessing_details: >-
      Imaging from PACS is delivered in DICOM and passed through de-identification, with tooling such
      as CTP-deid; de-identification for a larger imaging cohort was in process as of September 2025.
  - preprocessing_details: >-
      Data are transformed using approaches that limit re-identification, including tokenization of
      unstructured EHR data.
  - preprocessing_details: >-
      OMOP Location entities are geocoded via DeGauss (UF-Geocoding, forked from bihorac-LAB/Exposome)
      to support contextual factors such as geographic distance to the nearest hospital.

cleaning_strategies:
  - cleaning_details: >-
      Data contributing sites follow standard operating protocols (Chorus_SOP, data_acq_SOP) that have
      undergone internal validation and review, instructing sites on best practices for curating and
      delivering interoperable datasets.
    notes: >-
      Characterization reports are produced and returned to sites following their data submissions via
      the CHoRUSReports repository; issues in creating or submitting a data extract are raised in the
      Standards and Data Acquisition discussion areas.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment labels data with targets important for prediction;
      the project develops capabilities across the multi-center network to acquire, standardize,
      tokenize, store, visualize, and label data.
    notes: >-
      Clinical expertise is used for semantic mapping and validation, supported by pooled tabular
      mappings and a clinical validation SOP in the chorus-mapping repository.

machine_annotation_tools:
  - tools:
      - "OHNLP toolkit"
    notes: >-
      Clinical notes are extracted and tokenized automatically using the OHNLP toolkit; the resulting
      tokens follow the OHNLP open source schema.

missing_data_documentation:
  - missing_data_patterns: >-
      Modality availability is uneven in the released data: clinical notes are stored locally at
      contributing sites with only tokens available, imaging de-identification was in process with
      1,000 images available as of September 2025, and EEG extraction was in process at that time.
    notes: >-
      Published metadata schemas were listed as "Planned" for clinical notes, imaging, and EEG
      waveforms, and as available for demographics, medication administration, procedures, nursing
      flowsheets, diagnoses, and waveform telemetry.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all planned modalities were fully available in the released dataset as of September 2025:
      imaging de-identification was in process (1,000 images available), EEG extraction was in process,
      and clinical notes remained stored locally at contributing sites with only tokens shared.
    recommended_mitigation: >-
      Consult the CHoRUS dataset documentation for the current modality availability before designing
      analyses that depend on imaging, EEG, or full-text clinical notes.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers acute and critical care admissions (ICU, PICU, NICU) contributed by 14
      hospitals within a collaboration of 20 academic centers.
    scope_impact: >-
      Findings may not generalize beyond acute and critical care settings or beyond the contributing
      academic hospital network.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The data are retrospectively collected, and the released dataset is a partial snapshot of an
      anticipated final dataset of 100,000 patient admissions.

known_biases:
  - bias_description: >-
      Data are contributed by 14 hospitals drawn from a collaboration of 20 academic centers, and the
      project explicitly frames the management of bias, privacy, and Social Determinants of Health as
      an open patient-focused ethical and legal problem for the assembled cohort. The declared bundle
      does not name or measure a specific bias present in the released data.
    mitigation_strategy: >-
      Sampling is designed to ensure comprehensive sets of patient conditions and clinical treatment
      strategies; federated access is intended to enable sampling methods that ensure a balanced and
      diverse cohort; data elements feature contextual factors such as geographic distance to the
      nearest hospital; and patient-focused efforts determine ethical and legal approaches to manage
      privacy and bias while accounting for Social Determinants of Health.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset comprises hospital clinical records of critically ill patients, including
      demographics, diagnoses, procedures, medication administration, nursing flowsheets, clinical
      notes, PACS imaging, waveform telemetry, EEG recordings, and social determinants of health. All
      listed data types are released under controlled access.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Every data type in the dataset (demographics, medication administration, procedures, nursing
      flowsheets, diagnoses, clinical notes, imaging, waveform telemetry, and EEG) is designated
      controlled access. Clinical notes are stored locally at contributing sites, and only tokens are
      made available in the enclave.
    notes: >-
      Community-facing ethics focus groups are conducted to determine what data is appropriate for
      public sharing.

is_deidentified:
  method: >-
    Tokenization of unstructured electronic health record text using the OHNLP toolkit, with full
    notes retained locally at contributing sites; de-identification of DICOM imaging supported by
    tooling including the CTP-deid repository; transformation of data using approaches that limit
    re-identification.
  deidentification_details: >-
    Data are transformed using approaches that limit re-identification. Imaging de-identification was
    in process for the larger cohort as of September 2025, with 1,000 de-identified images available.
    All modalities remain under controlled access within the cloud enclave.
  notes: >-
    The consortium maintains de-identification and privacy tooling in the chorus-ai GitHub
    organization, including the CTP-deid repository and a privacy_scan_tool for medical records.

human_subject_research:
  involves_human_subjects: true
  special_populations:
    - >-
      The current released dataset includes admissions from pediatric intensive care units (PICU) and
      neonatal intensive care units (NICU), and therefore covers minors and neonates.
  notes: >-
    The dataset consists of retrospective clinical records from critically ill patients, with an
    anticipated cohort of more than 100,000 critically ill patients.

at_risk_populations:
  at_risk_groups_included: true
  notes: >-
    Minors and neonates: the current released dataset covers patient admissions from pediatric
    intensive care units (PICU) and neonatal intensive care units (NICU) alongside adult ICU
    admissions. The declared bundle records the inclusion of PICU and NICU admissions but does not
    describe specific assent procedures, guardian consent arrangements, or additional safeguards
    applied to these groups.

ethical_reviews:
  - review_details: >-
      Ethics is one of the three pillars of the CHoRUS data generation project (Ethical and Trustworthy
      AI). The project establishes a legal framework for collecting data at scale, performs
      community-facing ethics focus groups to determine what data is appropriate for public sharing,
      and analyses the existing legal and regulatory landscape to increase trustworthiness of
      provenance and privacy in AI.
    notes: >-
      Patient-focused efforts determine the ethical and legal approaches to manage privacy and bias
      while accounting for Social Determinants of Health; expertise is drawn from team science, law,
      ethics, health services, biomedical science, engineering, and scientific journal publications.
      The declared bundle does not name an IRB or ethics committee of record for the dataset.

license_and_use_terms:
  data_use_permission: institution_specific
  license_terms: >-
    The CHoRUS dataset is controlled access. Users complete a registration form providing name, email,
    and institution, and all participants must sign a licensing agreement included in the registration
    form before gaining access to the dataset. Access to the dataset requires a ".edu" email address;
    once access is granted and compute is provisioned, an email is sent to the user.
  contact_person: >-
    Access requests: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org
  notes: >-
    In the AIM-AHEAD Bridge2AI for Clinical Care Training Program, the licensing agreement and .edu
    email requirements are stated not to be barriers to acceptance into the program; program
    administrators assist with access if needed.

ip_restrictions:
  restrictions:
    - >-
      Software of the CHoRUS project published in the chorus-ai GitHub organization is licensed under
      the MIT License, with individual repositories carrying MIT or Apache-2.0 licenses (for example
      Chorus_SOP under Apache-2.0; UF-Geocoding, chorus-extract-upload, and chorus_waveform under MIT).
  notes: >-
    These license terms are stated for the CHoRUS software repositories; access to the dataset itself
    is governed by a separate signed licensing agreement.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions:
    - >-
      All data modalities are designated controlled access; access is granted only after registration,
      signature of a licensing agreement, and verification of an institutional (".edu") email address,
      with data accessed inside a provisioned cloud enclave.

distribution_formats:
  - notes: >-
      OMOP Common Data Model tables for demographics, medication administration, procedures, nursing
      flowsheets, and diagnoses. Controlled access within the cloud enclave.
  - notes: >-
      OHNLP open source schema for clinical note tokens. Controlled access; full notes are retained
      locally at the contributing site and are not distributed.
  - notes: "DICOM for imaging retrieved from PACS. Controlled access."
  - notes: >-
      WFDB (PhysioNet schema, extended) for bedside monitor waveform telemetry. Controlled access
      within the cloud enclave.
  - notes: "EDF+ and Persyst open source schemas for EEG waveforms. Controlled access."

version_access:
  version_details: >-
    The project distinguishes a current released dataset (50,000 patient admissions from ICU, PICU and
    NICU; 1.6 billion rows of EHR OMOP data; 7,642 admissions with radiology data; 23 Tb of waveform
    data) from an anticipated final dataset (100,000 patient admissions, 9 data modalities, 14 data
    contributing hospitals).

updates:
  update_details: >-
    Data acquisition is ongoing toward the anticipated final dataset of 100,000 patient admissions
    across 9 modalities. Imaging de-identification for a larger cohort and EEG extraction were in
    process as of September 2025, and published metadata schemas were planned for clinical notes,
    imaging, and EEG. Data contributing sites provide regular status updates on their extract
    preparation, which are tracked in the Standards Project and the Data Acquisition Project on GitHub.

maintainers:
  - maintainer_details: >-
      Ciera McCrary, Program Manager, Massachusetts General Hospital; website contact for the CHoRUS
      project. Email as printed in the source: cmccrary@mgh.havard.edu (reproduced verbatim, including
      the evident "havard" typo).
    role: academic_institution
  - maintainer_details: >-
      Data access requests are handled by dbold@emory.edu (Emory) and
      jared.houghtaling@tuftsmedicine.org (Tufts Medicine).
    role: academic_institution
  - maintainer_details: >-
      The chorus-ai GitHub organization (37 followers, 28 repositories, 3 projects) maintains software
      and tooling, validated semantic mappings, standard operating protocols, and project management
      overviews; versions, maintainers, and other metadata about CHoRUS packages are tracked on a
      package status page compiled in the chorus-developer repository.

extension_mechanism:
  contribution_url: "https://github.com/chorus-ai"
  extension_details: >-
    Clinical collaborators can contribute to semantic mapping and validation through the chorus-mapping
    repository, which provides documentation, pooled tabular mappings, and an associated clinical
    validation SOP. Data site managers raise issues in context-specific Standards Discussions and Data
    Acquisition Discussions. Data contributing sites submit status updates through the GitHub interface
    or a Google Form whose submissions trigger a GoogleScript that updates GitHub status and issue
    information through the API. Software contributors are supported by a web guide compiled in the
    chorus-developer repository.

external_resources:
  - external_resources:
      - "https://chorus4ai.org/"
    notes: >-
      CHoRUS project website, with pages for Team, Project Overview, Tools, Data Acquisition,
      Standards, Community Engagement, Ethics, Dataset, and Learning Resources & Opportunities. An
      additional project page is listed as www.bridge2ai.org/chorus.
  - external_resources:
      - "https://github.com/chorus-ai"
    notes: >-
      CHoRUS GitHub organization: 28 repositories housing software and tooling to interact with and
      extract insight from clinical data in diverse formats, validated semantic mappings to
      international standards, standard operating protocols for data contributing sites, and project
      management overviews. Repositories include chorus-container-apps, Chorus_SOP, data_acq_SOP,
      chorus-mapping, chorus_waveform, chorus_waveform_resources, chorus-extract-upload,
      chorus-apps-internal, CHoRUSReports, CTP-deid, UF-Geocoding, privacy_scan_tool, CADA, and
      cloud_public. Top languages: JavaScript, Python, Jupyter Notebook, CSS, MDX.
  - external_resources:
      - "https://reporter.nih.gov/project-details/10472824"
    notes: "NIH RePORTER project record for the award (application ID 10472824)."

intended_uses:
  - use_category: "Machine learning and AI model development for acute and critical care"
    notes: >-
      Generating data for ML/AI applications aimed at characterizing acute and critical care illness,
      predicting complications, and measuring treatment response among patients with acute or critical
      illness, in service of improving recovery from acute illness.
  - use_category: "External validation of AI/ML models"
    notes: >-
      The provisioned holdout test set is accessible for model external validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - use_category: "Training and workforce development in clinical AI/ML"
    usage_notes: >-
      Trainees access the dataset through the Bridge2AI AI/ML for Clinical Care Collaborative Cloud
      using canonical Jupyter Notebooks and the OHDSI tool stack.
    notes: >-
      The AIM-AHEAD Bridge2AI for Clinical Care Training Program equips trainees to apply AI/ML methods
      to big data analysis and to conduct innovative research at the intersection of healthcare
      challenges and AI/ML using multi-modal datasets from a broad range of cohort participants.
  - use_category: "Downstream analytics on the mapped and assembled dataset"
    notes: >-
      The CHoRUS GitHub organization invites clinical collaborators interested in downstream analytics
      on the mapped and assembled dataset to make contact with the project.

other_tasks:
  - task_details: >-
      Research using contextual and social determinants of health elements, such as geographic distance
      to the nearest hospital derived from geocoded OMOP Location entities.
  - task_details: >-
      Development of practical use cases and trainee research outputs, including posters for the
      AIM-AHEAD and Bridge2AI Annual Meetings, health informatics conference abstracts, and manuscripts
      for peer-reviewed journals.

existing_uses:
  - examples:
      - "Training activities"
      - "Publications"
    notes: >-
      As of the September 2025 CHoRUS dataset overview, the datasets are being used for training
      activities and publications.
  - examples:
      - >-
        AIM-AHEAD Bridge2AI for Clinical Care Training Program, Cohort 2 (program start 2025-11-17,
        program end 2026-07-31), providing hands-on AI/ML training to up to 30 selected trainees
    notes: >-
      Training delivery includes asynchronous Jupyter notebooks, synchronous office hours, and a hybrid
      workshop on AI in Clinical Care covering Python and version control, structured EHR datasets, ML
      for clinical applications, clinical deep learning, and ethics of clinical AI.

future_use_impacts:
  - impact_details: >-
      The project's overarching goal is to develop a publicly available, AI-ready critical care dataset
      while ensuring that the methods promote privacy, accountability, and clinical benefit, and while
      promoting a new generation of AI clinicians and scientists.
  - impact_details: >-
      Sequestered holdout datasets for external validation are intended to aid marketplace adoption of
      AI-developed models for implementation in acute and critical care.
  - impact_details: >-
      Patient-focused ethical and legal work is intended to manage privacy and bias while accounting
      for Social Determinants of Health, and to increase trustworthiness of provenance and privacy in
      clinical care AI.