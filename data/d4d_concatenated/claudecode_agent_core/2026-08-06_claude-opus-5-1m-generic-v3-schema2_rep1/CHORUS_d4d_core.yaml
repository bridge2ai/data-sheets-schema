id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution, controlled-access dataset of retrospectively
  collected acute and critical care hospital data, generated by the CHoRUS Network as one of four data
  generation projects in the NIH Common Fund Bridge2AI consortium. The dataset is assembled from
  clinical data contributed by 14 hospitals within a collaboration spanning 20 academic centers, and
  covers patient admissions to adult, pediatric (PICU) and neonatal (NICU) intensive care units. Data
  modalities include structured electronic health record data standardized to the OMOP Common Data
  Model (demographics, diagnoses, procedures, medication administration, nursing flowsheets),
  tokenized clinical notes, imaging from PACS, waveform telemetry from bedside monitors, and EEG
  waveforms. The project website reports a current released dataset of 50,000 patient admissions,
  1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data,
  against an anticipated final dataset of 100,000 patient admissions across 9 data modalities from 14
  contributing hospitals. The stated goal of the CHoRUS Network is to develop the most diverse,
  high-resolution, ethically sourced, AI-ready data set to answer the grand challenge of improving
  recovery from acute illness.
page: https://chorus4ai.org/
status: >-
  Data acquisition ongoing. A current released dataset is available to approved users under controlled
  access within a cloud enclave, with an anticipated final dataset still in preparation; imaging
  de-identification and EEG extraction were in process as of September 2025. The project website
  additionally displays the banner notice "This repoitory is under review for potential modification
  in compliance with Administration directives" (reproduced as printed in the source).
created_by: "CHoRUS for Equitable AI Network, a Bridge2AI data generation project"
was_derived_from: >-
  Retrospective structured and unstructured electronic health record data, PACS imaging, bedside
  monitor waveform telemetry, and hospital EEG database recordings from 14 contributing hospitals of
  the CHoRUS Network.
conforms_to: "OMOP Common Data Model (OHDSI)"
license: >-
  MIT License — stated for the CHoRUS software repositories published in the chorus-ai GitHub
  organization (individual repositories carry MIT or Apache-2.0). The dataset itself is not released
  under an open license: it is controlled access, governed by a signed licensing agreement completed
  at registration.
keywords:
  - critical care
  - intensive care unit
  - acute illness
  - artificial intelligence
  - machine learning
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - Bridge2AI
  - multimodal data
  - AI-ready dataset
  - equitable AI
notes: >-
  The CHoRUS consortium comprises 60+ members across 20 different institutions, of which 14 contribute
  as Data Acquisition centers, and collaborates with Bridge2AI and 3 other data generation projects.
  The project is funded by the NIH under award number OT2OD032701; website content is stated to be
  solely the responsibility of the authors and not necessarily to represent official NIH views.
  General project contact listed on the website: Ciera McCrary, MGH, Program Manager,
  cmccrary@mgh.havard.edu (address reproduced verbatim as printed in the source, including the evident
  "havard" typo). Additional project web presence: www.bridge2ai.org/chorus. The dataset provisions a
  sequestered holdout test set, held separately from the data used for model development and
  accessible for external validation of models; the core schema has no data-split slot, so this is
  recorded here rather than as a component resource. Data are shared beyond the creating consortium
  under controlled access; the AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access
  to Bridge2AI CHoRUS data for selected trainees (up to 30 in Cohort 2), who register, sign the
  licensing agreement, and are provisioned compute on the Bridge2AI AI/ML for Clinical Care
  Collaborative Cloud. Data are retrospectively collected from clinical records held by 14
  contributing hospitals rather than gathered directly from patients for research purposes.

