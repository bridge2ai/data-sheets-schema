instances:
  - instance_type: "Patient hospital admission to an intensive care unit (adult ICU, PICU, or NICU)"
    notes: >-
      The declared bundle reports several admission counts from different sources and these are not
      reconciled by the sources themselves. The project website's current released dataset snapshot
      reports 50,000 patient admissions from ICU, PICU, and NICU, together with 1.6 billion rows of
      EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data. The September
      2025 Bridge2AI for Clinical Care webinar states that, as of August 2025, the dataset covered 14
      different hospitals with over 45K unique admissions. The anticipated final dataset is 100,000
      patient admissions across 9 data modalities from 14 data contributing hospitals; the NIH project
      abstract describes acquiring an AI-ready data set from more than 100,000 critically ill patients.
      No single count is asserted here because the sources disagree.

subpopulations:
  - identification: >-
      Admissions in the current released dataset are drawn from adult intensive care units (ICU),
      pediatric intensive care units (PICU), and neonatal intensive care units (NICU).
    notes: >-
      Federated access is intended to enable sampling methods that ensure a balanced and diverse
      cohort, and data elements are intended to feature contextual factors such as geographic distance
      to the nearest hospital, alongside social determinants of health.

