purposes:
  - response: >-
      To generate data for ML/AI applications aimed at characterizing acute and critical care illness,
      predicting complications, and measuring treatment response among patients with acute or critical
      illness.
  - response: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring the methods
      promote privacy, accountability, and clinical benefit.
  - response: >-
      To provision a holdout test set accessible for model external validation, in order to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      To develop the most diverse, high-resolution, ethically sourced, AI-ready data set to answer the
      grand challenge of improving recovery from acute illness.
  - response: >-
      To cultivate expertise in the lay and scientific community and promote a new generation of AI
      clinicians and scientists through multimodal educational approaches and AI literacy work.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning (AI/ML) in critical care; developing high-resolution multi-center data sets is a
      critical first step towards actionable and trustworthy AI.
  - response: >-
      Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready critical care
      dataset that harmonizes multi-modal EHR, waveform, imaging, and text data under unified
      standards.
  - response: >-
      Sequestered holdout datasets for external validation of models were lacking; CHoRUS provisions a
      holdout test set to aid marketplace adoption of AI models in acute and critical care.
  - response: >-
      Legal and ethical approaches for collecting critical care data at scale, managing privacy and
      bias, and accounting for Social Determinants of Health needed to be established.

