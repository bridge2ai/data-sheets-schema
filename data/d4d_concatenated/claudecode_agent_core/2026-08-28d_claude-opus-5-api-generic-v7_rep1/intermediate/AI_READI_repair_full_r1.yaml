acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Clinical measurements were directly observed during a single in-person study visit
      lasting between 2.5 and 4 hours: vitals and physical measurements, 12-lead ECG,
      monofilament testing for peripheral neuropathy, cognitive screening, visual acuity and
      contrast sensitivity under photopic and mesopic conditions, autorefraction, retinal
      imaging of both eyes, and blood and urine collection for laboratory testing.
  - was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Survey and questionnaire responses were reported by participants, completed online in
      REDCap before or after the visit or on paper. Verification of data entry was performed
      when possible, for example by cross-referencing entered medications with medications that
      were physically brought in or photographed by each study participant.
  - was_directly_observed: true
    acquisition_details: >-
      At the end of the in-person visit participants were sent home with three monitoring
      devices used continuously for ten days: a Dexcom G6 continuous glucose monitor, a Garmin
      Vivosmart 5 activity tracker, and a custom-built indoor environmental sensor. Devices
      were returned to study staff by overnight mail or in person for data download.

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used to collect patient-reported questionnaire data and clinical data from the
      visit including the medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament test results and complete blood count results. Self-report instruments
      included a screening questionnaire, demographic information, the Center for
      Epidemiological Studies Depression Scale-10 (screening for depressive symptoms), Problem
      Areas in Diabetes-5, a diabetes self-care score, a dietary assessment, an ophthalmic
      survey, smoking, alcohol, vaping and marijuana use history, a general health survey,
      PhenX-based social determinants of health surveys, and a current medications list with
      RxNorm codes.
    notes: >-
      Marijuana use was not assessed for participants living in Alabama because it is an
      illegal substance there.
  - mechanism_details: >-
      A 12-lead ECG was recorded with a Philips PageWriter TC30 cardiograph while the
      participant sat in a reclining chair or lay supine, with the chair position recorded
      relative to supine.
  - mechanism_details: >-
      Retinal imaging used multiple devices with different but partially overlapping
      modalities, both eyes imaged per participant: the Optomed Aurora IQ handheld undilated
      fundus camera, the iCare EIDON widefield TrueColor confocal fundus system, the Heidelberg
      Spectralis HRA OCT/OCTA, the Topcon Maestro2 3D OCT-1, the Topcon Triton DRI swept-source
      OCT, the Zeiss Cirrus 5000 Angioplex, and Heidelberg fluorescence lifetime imaging
      ophthalmoscopy. All retinal images were collected under dilated conditions except the
      Optomed.
  - mechanism_details: >-
      Home monitoring devices were issued at the end of the visit with instructions to use them
      continuously for ten days: the Dexcom G6 continuous glucose monitoring system, the Garmin
      Vivosmart 5 fitness tracker worn on the participant's chosen wrist, and the LeeLab Anura
      custom-designed environmental sensor placed in a frequently used area of the home.
      Participants recorded which wrist the tracker was worn on, their dominant hand, and where
      the sensor was placed.
  - mechanism_details: >-
      Additional in-clinic instruments included the Montreal Cognitive Assessment administered
      electronically on an iPad with the MoCA Duo application, the M&S Technologies Electronic
      Visual Acuity tester at four metres, the Mars Letter Contrast Sensitivity chart, the
      Topcon KR-800 autorefractor, lensometers (NIDEK LM-600P, Topcon CL-200, Topcon CL-300),
      and automatic oscillometric blood pressure monitors (OMRON HEM 907XL, Medline MDS4001,
      Welch Allyn 6000 series).

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Version 3.0.0 contains data collected between July 19, 2023 and May 1, 2025, that is,
      through the end of the second year of the study including the pilot data collection
      phase.
    notes: >-
      The protocol publication states that enrolment began on 18 July 2023 and will continue
      until 30 November 2026, with a preliminary pilot enrolment period between 18 July 2023
      and 30 November 2023 and formal data collection beginning 1 December 2023. The registered
      study start date is 2023-07-19 (actual) with an anticipated completion date of
      2027-01-01.
    source_caveats: >-
      The collection start date is given as 2023-07-19 by the FAIRhub structured metadata and
      as 18 July 2023 by the BMJ Open protocol publication, a one-day discrepancy. The
      structured metadata is tier 1 and the protocol publication tier 3, so the ranking settles
      it in favour of 2023-07-19, the value recorded here.

data_collectors:
  - role: clinical research coordinator
    collector_details: >-
      Research personnel at the three data collection sites recruited, enrolled and collected
      data. All underwent training by the data manager at the University of Alabama at
      Birmingham with a detailed Manual of Procedures for reference, completed mandatory
      institutional compliance training for human subject research, and were required to
      successfully administer all protocol elements to at least three volunteer practice
      subjects before enrolling participants.
  - role: data manager
    collector_details: >-
      Data managers at each site oversaw the collection process and were responsible for the
      quality control of all data before uploading to FAIRhub.
  - role: research team
    collector_details: >-
      Effort of the AI-READI team members involved in data collection was supported by National
      Institutes of Health award OT2OD032644 based on the percentage of effort contributed,
      with salaries aligned to the funding guidelines at each site.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from participants across the three recruiting sites; this
      was active data collection rather than passive collection or secondary use of existing
      data. Recruitment pools were identified by screening electronic health records for
      diabetes and prediabetes ICD-10 codes among patients who had an encounter with the sites'
      health systems.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      Patients aged 40 years and older with a medical encounter at one of the three health
      systems; patients with type 2 diabetes and pre-diabetes were identified by screening
      electronic health records for ICD-10 diagnosis codes E11.X and R73.09 respectively.
    strategies: >-
      Recruitment sampling procedures aimed at an approximately equal distribution of
      participants across sex, race and diabetes severity: four race/ethnic groups (Asian,
      Black, Hispanic, White), four diabetes categories (no diabetes; pre-diabetes or
      lifestyle-controlled; controlled by oral or non-insulin injectable medications; and
      insulin-controlled), and biological males and females. Participants were recruited in
      waves; the composition and size of each wave were influenced by observed participation
      characteristics, and composition was monitored and adjusted by under- and oversampling
      groups as needed. The registered sampling method is a non-probability sample.
    why_not_representative: >-
      Rather than targeting the demographic distribution of the US population, the study
      deliberately recruits balanced groups. Recruitment was predominantly urban and
      hospital-based and the cohort does not include other races and ethnicities such as
      Pacific Islanders and Native Americans. Participation is voluntary, introducing volunteer
      bias, and eligibility required speaking, reading and understanding English.
    notes: >-
      The healthsheet states that the dataset contains all possible instances, that is, all
      participants enrolled during the covered collection period, and answers "N/A" to the
      question about a sampling strategy for drawing the dataset from a larger set.

instances:
  - instance_type: individual study participant
    counts: 2280
    label: false
    data_topic: B2AI_TOPIC:43
    label_description: >-
      No explicit label or target is associated with each data instance. No labeling was
      performed because the dataset is hypothesis-agnostic and aimed at facilitating multiple
      potential downstream AI/ML applications.
    notes: >-
      Each instance consists of all of the data available for an individual participating in
      the study, spanning survey data, clinical data, retinal imaging data, environmental
      sensor data, continuous glucose monitor data and wearable activity monitor data, which
      together encompass tabular data, imaging data and physiological signal/waveform data. No
      unstructured text data is included.
    source_caveats: >-
      The data_topic slot admits a single term. The bundle names type 2 diabetes as the
      resource type and the subject of the collection, so B2AI_TOPIC:43 (Diabetes) was chosen;
      the collection equally supports Clinical Observations, Ophthalmic Imaging, mHealth,
      Waveform, Survey and Environment. The data_substrate slot is likewise single-valued and
      is omitted because the bundle states that instances span tabular, imaging and
      physiological signal/waveform substrates and no single term covers them.

relationships:
  - relationship_details: >-
      All instances are part of the same prospective data generation project, AI-READI. There
      is currently only one visit per participant, so instances are not linked longitudinally
      in this release.

splits:
  - split_details: >-
      The release comes with a recommended data split into proportions of 70% training, 15%
      validation and 15% testing, provided in the participants.tsv file. The three partitions
      are recorded in this datasheet as doi:10.60775/fairhub.3#split-train (1,576
      participants), doi:10.60775/fairhub.3#split-validation (352 participants) and
      doi:10.60775/fairhub.3#split-test (352 participants). Because sex, race and ethnicity
      data are not released with the public version, the project team prepared the split so
      that the validation and test sets are balanced as well as possible for sex,
      race/ethnicity and diabetes status (no diabetes, prediabetes/lifestyle controlled, oral
      medication controlled, and insulin controlled). The split is intended to reduce
      disparities in models developed using the dataset when demographic labels are
      unavailable.

