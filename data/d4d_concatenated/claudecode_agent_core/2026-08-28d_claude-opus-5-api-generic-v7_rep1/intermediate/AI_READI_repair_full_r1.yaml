purposes:
  - response: >-
      To create a flagship ethically-sourced dataset that enables future generations of
      artificial intelligence and machine learning research to provide critical insights into
      type 2 diabetes mellitus, including salutogenic pathways to return to health.
  - response: >-
      To develop a foundational dataset in type 2 diabetes mellitus that is agnostic to
      existing classification criteria or biases and can be used to reconstruct a temporal
      atlas of T2DM development and reversal towards health.
  - response: >-
      To create a model and blueprint for developing large, scalable, AI-ready datasets,
      including guidelines for project management and for data collection, management and
      sharing that future data generation projects can follow.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including through a year-long AI-READI research internship programme.

addressing_gaps:
  - response: >-
      A major barrier to AI-based understanding of type 2 diabetes has been the lack of diverse
      datasets that are AI ready for training AI models; the AI-READI dataset is intended to
      fill this gap.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large and inclusive
      multimodal datasets.
  - response: >-
      Past research studies under-represented groups that bear a higher burden of disease; the
      cohort is balanced by self-reported race/ethnicity to address this under-representation,
      and three geographically separated collection sites increase geographic representation.
  - response: >-
      The dataset enables downstream analyses that may not be feasible with existing data
      sources such as claims or electronic health records data.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease trajectories
      by learning from complex, multimodal data collected from participants with differing
      disease severity, from normal to insulin-dependent type 2 diabetes.
  - response: >-
      Development of AI/ML models of salutogenesis in type 2 diabetes, that is, of the pathway
      from disease back to health.

intended_uses:
  - use_category: Type 2 diabetes related research
    usage_notes: >-
      Access to the public version of the dataset is conditioned on agreeing to use the data
      only for type 2 diabetes related research. A private (controlled access) version will
      allow for more generic use.
  - use_category: Artificial intelligence and machine learning model development
    examples:
    - >-
      Multimodal model development across survey, clinical, imaging, waveform, wearable and
      environmental data; pseudotime manifold analysis of disease trajectories.
    usage_notes: >-
      The license permits creating derivative works and distributing models, algorithms and
      programs trained or adapted using the Data, for research, commercial and non-commercial
      purposes, provided those models do not themselves contain the Data or any modified
      version of it and reasonable efforts are made to minimise the likelihood that Data can be
      memorized, derived, reconstructed or reconstituted through their use.

other_tasks:
  - task_details: >-
      The public version is restricted to type 2 diabetes related research, but the creators
      state that a private version of the dataset will allow for more generic use beyond
      diabetes research.

discouraged_uses:
  - discouragement_details: >-
      Asked whether any types of usage or applications are discouraged, the creators respond
      that the AI-READI dataset license imposes certain restrictions on the usage of the data
      and refer users to the license files available at https://doi.org/10.5281/zenodo.17555036.
      Asked separately whether there are tasks for which the dataset should not be used, they
      refer back to the same license terms rather than naming additional discouraged
      applications.
    source_caveats: >-
      The healthsheet answers the discouraged-use and should-not-be-used questions solely by
      reference to the license. The specific hard restrictions the license imposes are recorded
      individually under prohibited_uses; no separately discouraged-but-permitted use is
      attested in the bundle.

prohibited_uses:
  - prohibition_reason: >-
      Licensees shall not make clinical treatment decisions based on the Data, as it is
      intended solely as a research resource.
  - prohibition_reason: >-
      Licensees shall not use or attempt to use the Data, alone or in concert with other
      information, to compromise the confidentiality or privacy of a Data Subject, to attempt
      to identify or contact any Data Subject or group of Data Subjects, to extract or
      extrapolate identifying information, to establish a Data Subject's membership in a
      particular group of persons, or otherwise to cause harm or injury to any Data Subject.
  - prohibition_reason: >-
      Licensees shall not share or distribute Data with any third party model vendor or
      developer for training or development purposes, even if that vendor is a party to a
      Business Associate Agreement, where training includes model weight modification and other
      adjustments to a model's logic or operation; short-term interaction such as prompting or
      querying a model covered by a BAA is permitted for analysis.
  - prohibition_reason: >-
      Licensees shall not transfer, license, sublicense, sell, assign, display, share or
      otherwise convey any portion of the Data or any derivative work to any third party other
      than another licensee bound by an agreement on identical terms; derivative and synthetic
      data created from the Data are themselves treated as Data subject to all restrictions.
  - prohibition_reason: >-
      Data may not be reproduced in papers, articles, presentations, analyses, reports or
      publications except that small representative samples may be reproduced in up to five
      images or figures per paper for illustrative purposes only; larger amounts may not be
      published, posted or made available via supplemental files, zip archives, code packages
      or other means, notwithstanding journal or conference requirements.
  - prohibition_reason: >-
      The Data may be statically watermarked to identify the Licensee for security purposes,
      and the Licensee agrees to take no action to remove, obscure, alter or mask such
      watermarking.
  - prohibition_reason: >-
      Data may be stored only on servers and devices maintained by and located within the
      Licensee's institution or employer, or on cloud or remote storage and backup services
      that have a HIPAA-approved Business Associate Agreement in place with that institution or
      employer.

future_use_impacts:
  - impact_details: >-
      The creators state that, to the extent of their knowledge, they do not currently
      anticipate uses of the dataset that could result in unfair treatment or harm; however,
      there is a theoretical risk of future re-identification.
  - impact_details: >-
      AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification. To prevent reidentification attempts the project
      implements a robust data dissemination system, a strict licence agreement and data
      watermarking for both the public and controlled sets.
  - impact_details: >-
      Factors that may limit the generalization of models derived from the data include the
      predominantly urban and hospital-based recruitment, which may not fully capture diverse
      cultural and socioeconomic backgrounds, and the absence of some racial and ethnic groups
      such as Pacific Islanders and Native Americans.

existing_uses:
  - examples:
    - >-
      None. Asked whether the dataset has been used for any tasks already, the creators respond
      "No". The FAIRhub API record for this version reports a citation count of zero and a view
