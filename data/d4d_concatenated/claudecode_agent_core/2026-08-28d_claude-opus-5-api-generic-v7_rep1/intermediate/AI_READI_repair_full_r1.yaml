distribution_formats:
  - format: >-
      Directory tree organized per the Clinical Dataset Structure (CDS) v0.1.1, distributed
      through the FAIRhub platform, which is hosted on Microsoft Azure; Azure Storage access is
      described in the version 3.0.0 documentation. All data files are in formats accessible
      with freely available software, so no specific software is required.
    access_urls:
      - https://fairhub.io/datasets/3/access
  - format: DICOM
    media_type: application/dicom
  - format: Comma-separated values
    media_type: text/csv
  - format: Markdown
    media_type: text/markdown
  - format: JSON
    media_type: application/json

distribution_dates:
  - release_dates:
      - >-
        Version 1.0.0 was released on May 3, 2024; version 2.0.0 on November 8, 2024; version
        3.0.0 on November 17, 2025.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed and available for public use through the FAIRhub platform.
      Access requires logging in through a verified identity system, agreeing to use the data
      only for type 2 diabetes related research, and agreeing to the license terms, which set
      restrictions and obligations for data usage. The registered access type is
      PublicDownloadSelfAttestationRequired.

license_and_use_terms:
  data_use_permission: disease_specific_research
  contact_person: Aaron Lee
  license_terms: >-
    The dataset is released under the AI-READI custom license v2.0
    (https://doi.org/10.5281/zenodo.17555036), a custom agreement with Washington University in
    St. Louis as Licensor, tailored to enable reuse of the AI-READI dataset for commercial or
    research purposes while placing strong requirements on data usage, security and secondary
    sharing to protect study participants, especially when data are reused for AI and ML
    applications. The Licensor grants a non-exclusive, non-transferable license to download,
    reproduce and use the Data and to create derivative works, for research, commercial and
    non-commercial purposes. A licensee may be an individual or an internal group, lab or
    business unit within an institution, in which case Authorized Users are legal members of
    that group and their rights terminate when their relationship with the group or employer
    ends. Data may be shared only with other licensees bound by identical terms and may be
    stored only on institution-maintained servers or on cloud services covered by a
    HIPAA-approved Business Associate Agreement. Derivative data and synthetic data generated
    from the Data are themselves treated as Data. Licensee models trained on the Data may be
    distributed provided they do not contain the Data and reasonable efforts are made to
    minimise memorization or reconstruction. Licensees must acknowledge the Licensor, the
    source and any funder of the Data in papers, using the citation published at
    docs.aireadi.org, and must comply with NIH Genomic Data Sharing Policy security best
    practices. The agreement terminates automatically upon any breach, after which all copies
    must be deleted. Title and all intellectual property rights remain with the Licensor and
    its suppliers; the Data are provided "as is" without warranty, liability is capped in the
    aggregate at one US dollar, and the licensee indemnifies the Licensor. The language of the
    agreement is English.
  notes: >-
    Contact person Aaron Lee, ORCID:0000-0002-7452-1648. Central contact for the study and
    dataset, reachable at contact@aireadi.org; licensees are also directed to
    https://aireadi.org/contact and to the citation and contact information published at
    docs.aireadi.org.
  source_caveats: >-
    The FAIRhub structured metadata names the license "AI-READI custom license v2.0" with
    rightsURI https://doi.org/10.5281/zenodo.17555036, while the FAIRhub dataset landing pages
    for versions 2.0.0 and 3.0.0 label the license "Health Data License". Both are tier 1 and
    equally ranked, so the ranking cannot settle the disagreement; the structured metadata name
    is recorded in the top-level license slot and the landing-page label is recorded here.

ip_restrictions:
  restrictions:
  - >-
    Title to the Data, and all industrial and intellectual property rights therein, remain
    solely and exclusively with the Licensor, Washington University in St. Louis, and its
    suppliers; the licensee shall take no action inconsistent with such ownership and any
    rights not expressly granted are reserved. Beyond these license terms, the creators state
    that no third parties have imposed additional IP-based restrictions on the data associated
    with the instances.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  governance_committee_contact: Aaron Lee
  regulatory_restrictions:
  - >-
    The creators refer to the dataset license for export controls and other regulatory
    restrictions. Licensees agree to comply with all applicable laws, regulations and
    restrictions relating to the distribution and use of the Data and of models, and with the
    data security and privacy standards established by the US National Institutes of Health
    under its Genomic Data Sharing Policy, currently the NIH Security Best Practices for
    Controlled-Access Data Subject to the NIH GDS Policy.
  other_compliance: >-
    The study is recorded as not FDA-regulated for either drug or device. Licensee storage of
    the Data is limited to institution-maintained servers and devices or to cloud and remote
    storage services covered by a HIPAA-approved Business Associate Agreement with the
    licensee's institution or employer.
  notes: >-
    The RO-Crate metadata records the confidentiality level of the release as "HL7:2N
    (normal)". Governance committee contact Aaron Lee, ORCID:0000-0002-7452-1648; registered
    central contact for the study, contact@aireadi.org; general enquiries about access and
    governance are directed to https://aireadi.org/contact.

data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
    description: >-
      Managing organization of the dataset and lead sponsor of the study, and the Licensor
      named in the AI-READI data license agreement.
  committee_contact: Aaron Lee
  access_review_process: >-
    Accessing the dataset requires several steps: logging in through a verified identity
    system, agreeing to use the data only for type 2 diabetes related research, and agreeing to
    the license terms, which set certain restrictions and obligations for data usage. The full
    dataset, containing the more sensitive elements, is accessible only by entering into a data
    use agreement; it is available for use by scientists whose institutions have completed
    legal and privacy use agreements with the AI-READI research programme. The requirements for
    the controlled access dataset are being developed by the project's Data Access Committee.
    Conditions of access are published at https://fairhub.io/datasets/3/access.
  stewardship_roles:
  - >-
    The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub through
    Microsoft Azure.
  - >-
    Aaron Lee is the study principal investigator and responsible party; Aaron Lee and Cecilia
    Lee are listed as study principal investigators alongside site principal investigators at
    the participating institutions.
  - >-
    The data manager at each data site is responsible for quality control of all data before
    upload to FAIRhub.
  - >-
    Biobanked specimens are held at the University of Alabama at Birmingham Center for Clinical
    and Translational Science, and procedures for reviewing and prioritising written requests
    for them are in development.
  notes: >-
    Committee contact Aaron Lee, ORCID:0000-0002-7452-1648. Study principal investigator and
    registered central contact, MD; email contact@aireadi.org. Contact information for the
    owner, curator and manager of the dataset is also provided in the README file included with
    the dataset and at https://docs.aireadi.org/docs/3/contact.
  source_caveats: >-
    The RO-Crate metadata names the data governance committee as the "AI-READI Consortium"
    while the BMJ Open protocol publication refers to a "Data Access Committee" that is
    developing the controlled-access requirements. The RO-Crate is tier 1 and the publication
    tier 3, so the RO-Crate value is used for the committee name and the publication's account
    is recorded in the access review process.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset; it is hosted on FAIRhub through
      Microsoft Azure. Contact information for the owner, curator and manager of the dataset is
      provided in the README file included with the dataset, at https://aireadi.org/contact and
      at https://docs.aireadi.org/docs/3/contact; the registered central contact is Aaron Lee,
      contact@aireadi.org.

updates:
  frequency: approximately annually
  update_details: >-
    The dataset is released as static versions and will not be updated in place; instead, new
    versions are released with additional instances as more study participants complete the
    study visit. There are plans to release new versions approximately once a year with
    additional data from participants enrolled since the last version release. Enrollment is
    ongoing, so future versions will include larger numbers of participants. Changes between
    versions are documented in detail in the CHANGELOG file included in the dataset and visible
    at docs.aireadi.org.

errata:
  - erratum_details: >-
      No erratum is recorded. The healthsheet maintenance section asks "Is there an erratum? If
      so, please provide a link or other access point" and the published response field is
      blank, so the question was posed and left unanswered rather than answered in the
      negative.
    source_caveats: >-
      The blank response in the source is reported here as a blank rather than interpreted as a
      denial that any erratum exists.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - >-
    Version 1.0.0 (DOI 10.60775/fairhub.1, May 3, 2024, 204 participants from the pilot data
    collection phase); version 2.0.0 (DOI 10.60775/fairhub.2, November 8, 2024, 1,067
    participants); version 3.0.0 (DOI 10.60775/fairhub.3, November 17, 2025, 2,280
    participants).
  version_details: >-
    Each version has its own DOI and its own version of the documentation at docs.aireadi.org,
    navigable from a dropdown. Data types are largely the same across versions, with additional
    imaging devices added in later years and the Snellen visual acuity variables dropped in
    version 3.0.0. The FAIRhub pages for versions 1.0.0 and 2.0.0 state that those versions are
    no longer accessible, while the maintenance section of the healthsheet states that older
    versions are not updated and that new versions are released instead. A smaller mini-subset
    version of the current release is available for pipeline development.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants
    were not told that their data would be retained for a fixed period and then deleted.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset
    outside of those who are involved in the project.

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.2
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.1

