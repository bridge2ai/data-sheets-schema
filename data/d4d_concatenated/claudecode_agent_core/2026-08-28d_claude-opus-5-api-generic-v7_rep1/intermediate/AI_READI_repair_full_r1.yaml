subpopulations:
  - subpopulation_elements_present: false
    identification: >-
      The public dataset does not identify demographic sub-populations: sex, race and ethnicity
      are withheld from the public release and held under controlled access, so subgroups
      cannot be identified at the instance level. Study group membership corresponds to four
      diabetes categories: participants without type 1 or type 2 diabetes; participants with
      pre-type 2 diabetes or type 2 diabetes controlled by lifestyle adjustments; participants
      whose blood sugar is controlled by oral or non-insulin injectable medications; and
      participants whose blood sugar is controlled by insulin.
    distribution: >-
      The overall enrollment goal is a balanced distribution between racial groups, biological
      sexes and diabetes severity groups. Across the whole 2,280-participant release, the
      race/ethnicity counts summarised with the recommended splits are 380 Hispanic, 545 Asian,
      519 Black and 836 White; sex counts are 951 male and 1,329 female; diabetes status counts
      are 776 no diabetes, 560 lifestyle controlled, 686 oral medication controlled and 258
      insulin controlled; mean age is 60.8 years with a standard deviation of 11.3. As
      enrollment is ongoing, the pilot data release and periodic updates to data releases may
      not have achieved balanced distribution across groups.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers; therefore there is selection bias known as volunteer bias,
      which may limit the generalizability of results to those not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition is monitored for diversity and inclusion
      and adjusted by under- and oversampling groups as needed.
  - bias_type: selection_bias
    bias_description: >-
      Requiring that eligible participants speak, read and understand English may have created
      challenges in recruiting Hispanic and/or Asian persons. Recruiting Black men into health
      research is also well documented as more difficult than recruiting other populations,
      driven in part by medical mistrust rooted in historical events, and similar
      under-recruitment trends have been reported for Hispanic and Asian persons.
    mitigation_strategy: >-
      If sample balancing on race/ethnicity emerges as a challenge, new recruitment strategies
      such as tailoring printed materials and using a personalised, participatory approach will
      be implemented.
  - bias_type: representation_bias
    bias_description: >-
      Recruitment was predominantly urban and hospital-based, which may not fully capture
      diverse cultural and socioeconomic backgrounds, and the study cohort does not include
      other races and ethnicities such as Pacific Islanders and Native Americans.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity across the
      United States and to ensure diverse representation across racial and ethnic groups, and
      individuals from all demographic backgrounds were recruited at all three sites.
  - bias_type: sampling_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot study is
      not balanced across these parameters and periodic data releases may not have achieved a
      balanced distribution across groups.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites, and site
      selection was intended to ensure equitable representation and minimize the potential for
      sampling bias.
    affected_subsets:
    - >-
      Earlier dataset versions derived from the pilot phase and the first study year.
  - bias_type: measurement_bias
    bias_description: >-
      Image quality varies by device and by operator involvement. Undilated handheld Optomed
      Aurora images vary in quality from patient to patient and within the same patient; FLIO
      is performed last in the visit, takes longer and exposes participants to uncomfortable
      light levels, so participants may not be at their best possible compliance; Heidelberg
      Spectralis acquisition is operator-driven and not fully automated, so quality issues may
      arise and lead to skipping the modality.
    mitigation_strategy: >-
      Device make and model and the specific scan modality were documented to ensure
      repeatability, and multiple devices were used for one measure to enhance generalizability
      and represent the range of equipment used in clinical settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population.
    scope_impact: >-
      Models derived from the dataset may generalize poorly to rural populations, to
      socioeconomic backgrounds not captured by hospital-based recruitment, and to racial and
      ethnic groups not enrolled.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements; in a few cases the data collection device had no
      stored results or was returned too late to retrieve results, and in a few cases a data
      collision resulted in lost data.
    recommended_mitigation: >-
      Users should check the per-datatype manifest.tsv files and the participants.tsv file for
      the modalities available for each participant.
  - limitation_type: scope_limitation
    limitation_description: >-
      The public release omits data held under controlled access: 5-digit zip code, sex, race,
      ethnicity, genetic sequencing data, past health records, medications, and traffic and
      accident reports. Raw, unprocessed data are not shared.
    recommended_mitigation: >-
      The full dataset is accessible by entering into a data use agreement.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The design is cross-sectional with currently only one visit per participant; longitudinal
      data are planned for only a small fraction of the cohort in a later study year.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The Snellen visual acuity variables were dropped in this version of the dataset, so only
      logMAR visual acuity measurements are available.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has not undergone any formal external audit; it has been reviewed only
      internally by AI-READI team members for quality checks and to ensure that no personally
      identifiable information was accidentally included.

anomalies:
  - anomaly_details: >-
      In survey data, skipped questions or incomplete responses are expected.
  - anomaly_details: >-
      For wearable devices, improper use and technical failures such as battery failure or
      system malfunction are expected; the Garmin activity tracker has gaps in data collection
      because the battery had to be charged every two to three days.
  - anomaly_details: >-
      For imaging data, patient uncooperation, noise that may obscure the images, technical
      failures such as system malfunction, and data transfer failures are expected.
  - anomaly_details: >-
      In a few cases there may have been a data collision at some point in the processing
      pipeline and data has been lost.
  - anomaly_details: >-
      FLIO data are sensitive to acquisition conditions: the device cannot tolerate more than
      about one centimetre of movement during image acquisition, and unwanted signals such as
      background light or lens fluorescence cannot simply be subtracted because they belong to
      the same photon distribution as the useful data.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; missingness is at the level of
      whole modalities or whole device recordings rather than scattered fields.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements; in a few cases the
      data collection device did not have any stored results or was returned too late to
      retrieve the results, for example because the battery died or data was lost; and in a few
      cases a data collision occurred during processing.
    handling_strategy: >-
      During data cleaning, missing data that could be directly filled from other portions of
      an individual's record were completed. If there was no logical or appropriate way to
      correct the data, the site principal investigator reviewed the values and decided whether
      they should be removed from the data.

content_warnings:
  - content_warnings_present: false
    warnings:
    - >-
      The creators state that the dataset does not contain data that, if viewed directly, might
      be offensive, insulting, threatening, or otherwise pose a safety risk such as
      psychological safety or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The released dataset does not contain data that might be considered confidential and no
      personally identifiable information is included.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public dataset does not contain data considered sensitive: it contains no protected
      health information, and information related to the sex and race/ethnicity of the
      participants as well as medications used has been removed.
    source_caveats: >-
      This statement comes from the FAIRhub healthsheet and dataset description. It conflicts
      with the RO-Crate metadata for the same release, which lists EHR, wearable monitoring,
      ECG, environmental sensor, continuous glucose monitor and wearable accelerometer data as
      personal and sensitive information present in the collection; that conflicting statement
      is recorded as a separate entry in this slot. Both sources are tier 1 and equally ranked,
      so the ranking cannot settle the disagreement and both are represented.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled access counterpart of this release does contain sensitive data: 5-digit
      zip code, sex, race, ethnicity, genetic sequencing data, past health records, medications,
      and motor vehicle traffic and accident reports.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The RO-Crate metadata for the release lists the following categories as personal and
      sensitive information present in the collection: EHR, wearable monitoring, ECG,
      environmental sensor, continuous glucose monitor and wearable accelerometer data.
    source_caveats: >-
      This conflicts with the FAIRhub healthsheet statement, recorded as the first entry in
      this slot, that the public dataset contains no sensitive data. Both sources are tier 1
      and equally ranked, so the ranking cannot settle the disagreement and both are recorded.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification was applied because no identifiers were collected; the data
    were checked against the US HIPAA identifier list to confirm that no identifiable data were
    present.
  identifiers_removed: >-
    Protected health information; information related to participant sex and race/ethnicity;
    medications used.
  deidentification_details: >-
    The FAIRhub structured metadata records the de-identification type as
    "NoDeIdentification" with direct-identifier and HIPAA flags set, and explains that no
    identifiers were collected so no active de-identification was necessary, but that the team
    checked that no identifiable data per US HIPAA were present. The RO-Crate metadata records
    the release as deidentified. Participant folders are named after the study ID number.
  source_caveats: >-
    The Nature Metabolism comment describes the public set as being stripped of Protected
    Health Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, as well
    as information related to sex and race/ethnicity to prevent stigmatization of findings.
    That account of an active Safe Harbor process differs from the structured metadata
    statement that no de-identification was necessary. The structured metadata is tier 1 and
    the publication tier 3, so the ranking settles it in favour of the structured metadata; the
    publication account is recorded here.

participant_privacy:
  - anonymization_method: >-
      No direct identifiers are released; participants are represented only by the study ID
      number used to name their folder in each datatype directory.
    privacy_techniques: >-
      A robust data dissemination system, a strict licence agreement and static data
      watermarking that identifies the licensee are implemented for both the public and
      controlled sets. Access is gated behind login through a verified identity system and
      self-attestation. The environmental sensor and the Garmin fitness tracker were
      specifically chosen with participant privacy as a primary concern: they do not capture
      video or audio, are not equipped with GPS location monitoring, and are not synced with
      participant-owned devices.
    reidentification_risk: >-
      The creators state that there is a theoretical risk of future re-identification, and that
      AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Eligibility is restricted to adults aged 40 years and older (registered maximum age 85) who
    are able to provide consent. Pregnancy, gestational diabetes and type 1 diabetes are
    exclusionary for participation, so pregnant persons are not enrolled. The study does not
    enroll minors or prisoners.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: Washington University IRB
  irb_approval:
  - >-
    IRB protocol STUDY00016228. The initial IRB approval at the University of Washington was
    received on December 20, 2022. An annual renewal application to the IRB about the status
    and progress of the study is required and due within 90 days of expiration. The registered
    human subject review status is "Submitted, approved".
  regulatory_compliance:
  - >-
    The study is registered on ClinicalTrials.gov as NCT06002048. It is recorded as not
    FDA-regulated for either drug or device, is not a patient registry, and has no Data
    Monitoring Committee. Licensees must comply with the data security and privacy standards
    established by the US National Institutes of Health under its Genomic Data Sharing Policy.
  special_populations:
  - >-
    Adults aged 40 years and older; persons with and without type 2 diabetes. Pregnant persons,
    persons with gestational diabetes and persons with type 1 diabetes are excluded, as are
    adults older than 85 years of age.
  notes: >-
    The reviewing board operates as the University of Washington Institutional Review Board,
    with reliance agreements with the IRBs of the University of Alabama at Birmingham and the
    University of California, San Diego. Its contact point is the IRB Reliance Team,
    hsdrely@uw.edu, Human Subjects Division, University of Washington, 4333 Brooklyn Ave NE Box
    359470, Seattle, WA 98195-9470, US. Selected individual results are returned to
    participants: heart rate, blood pressure and visual acuity results are provided on an exam
    card before the participant leaves the visit; a Dexcom report of average blood glucose
    levels and a Glucose Management Indicator are sent by encrypted email after the ten-day
    monitoring period; and laboratory test results with normative values are sent by
    HIPAA-compliant encrypted email at the time of the yearly data release. Coordinators alert
    participants to incidental findings requiring emergency care, and retinal imaging
    technicians are trained to detect potentially life- or vision-threatening conditions such
    as retinal detachment, tumour and optic disc oedema and to trigger immediate referral.
  source_caveats: >-
    The board name recorded here, "Washington University IRB", is the form used in the RO-Crate
    metadata; the BMJ Open protocol publication and the IRB protocol application both identify
    the reviewing body as the Institutional Review Board of the University of Washington, whose
    Human Subjects Division address the RO-Crate itself supplies. The RO-Crate is tier 1 and
    the publication tier 3, so its wording is used, but the two names denote the same board.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      IRB protocol STUDY00016228 was initially approved on December 20, 2022. The other
      clinical sites operated under IRB reliance and used the same consent form with minor
      institution-specific language incorporated according to individual institutional
      requirements. The approved consent form for the principal project site is published with
      the dataset documentation.
  - review_details: >-
      Ethical review for the release is attributed in the RO-Crate metadata to four named
      individuals: Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans. Ethical,
      legal and social implications are considered at every stage of the project cycle, with
      guidance from bioethicists, and a Community Advisory Board of 11 persons from the three
      sites, including diversity in race and ethnicity as represented in the sample,
      contributes to development of the protocol.
    source_caveats: >-
      The RO-Crate records the ethicalReview field as a list of four personal names with no
      organizational affiliation for the reviewing body; no organization name is attested for
      this review, so reviewing_organization is left unpopulated rather than invented.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, provided either electronically through REDCap e-consent with an
      electronic signature or in person at the start of the visit.
    consent_scope: >-
      Informed consent to participate was required before participation in any part of the
      protocol, including questionnaires. The consent covers placement of de-identified data in
      an open-source repository and the storage of biospecimens in the study sample repository
      for future research.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington,
      is published with the version 3.0.0 dataset documentation; signed electronic consents are
      emailed automatically to the participant, who may request an additional copy from the
      study coordinator for the duration of the study.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study
      participation, though data already shared or used would remain in the dataset; this is
      clearly communicated in the consent document.

collection_consents:
  - consent_details: >-
      Potential participants were given the option to read all consent documentation
      electronically before their visit and to give consent with an electronic signature
      without verbal communication with a clinical research coordinator. Participants could
      access the e-consent documentation in REDCap and decide at that point that they did not
      want to participate or would like additional information, including requesting a call
      back or video conference with a coordinator. Participants who did not select the
      electronic option were consented in person in a private room at the start of the visit,
      followed by completion of all questionnaires.

consent_revocations:
  - revocation_details: >-
      Participants were permitted to withdraw consent at any time and cease study
      participation. However, any data that had been shared or used up to that point would stay
      in the dataset. This is clearly communicated in the consent document.

collection_notifications:
  - notification_details: >-
      Each individual was aware of the data collection, as this was active data collection
      directly from participants rather than passive collection or secondary use of existing
      data. Individuals in each recruitment pool were mailed a hardcopy invitation letter and
      sent an invitation email, both personalised with links, access codes and QR codes
      directing them into an online REDCap recruitment interface where they could read an
      overview of the research programme, expectations for participation and answers to
      frequently asked questions, download the informed consent document, request a call back
      from study staff, complete a screening survey and enroll. Those without internet access
      could call research staff for alternative methods of enrolment.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis of the potential impact of the dataset and its use on
      data subjects has been conducted.

participant_compensation:
  - compensation_provided: true
    compensation_amount: 200 USD
    compensation_type: stipend for the study visit
    compensation_rationale: >-
      Study subjects received a compensation of 200 US dollars for the study visit, paid
      through the grant funding. Per the IRB protocol the stipend is provided once the final
      data and the study devices have been received, typically at least two weeks after the
      study visit, and is not prorated.
  - compensation_provided: true
    compensation_type: travel support and reimbursement
    compensation_rationale: >-
      The study covers reasonable costs for parking, public transit or rideshare fees related
      to the study visit, and transportation assistance through rideshare services was offered
      to participants who reported barriers to transporting themselves to study visits.
    notes: >-
      Transportation costs exceeding 25 US dollars are not reimbursed.

labeling_strategies:
  - labeling_details: >-
      No labeling was performed. No explicit label or target is associated with each data
      instance, no gold-standard or proxy label definition was applied, no human labellers were
      engaged, and no labeling software was used, because the dataset is hypothesis-agnostic
      and aimed at facilitating multiple potential downstream AI/ML applications. The RO-Crate
      metadata records the data annotation protocol as "N/A - no labels are provided". The
      creators state that they have no formal guidelines in place for future researchers
      creating new labels or defining new tasks.

annotation_analyses:
  - annotation_quality_details: >-
      No inter-annotator agreement analysis exists because no labeling was performed and no
      labellers were engaged; the healthsheet answers each question about labeller count,
      demographics, guidelines, rater agreement, disagreement handling, annotation time and
      labeller compensation with "N/A - no labels are provided".

cleaning_strategies:
  - cleaning_details: >-
      Quality control measures were applied at the time of data entry and acquisition. Clinical
      data outside expected minimum and maximum ranges were flagged in REDCap and appeared in
      reports viewed by clinical research coordinators and data managers, who examined
      participant records and determined whether an error was likely. Data were checked for
      credibility using range checks, for incorrect flow through prescribed skip patterns, for
      missing data that could be directly filled from other portions of an individual's record,
      and for the omission or duplication of records.
  - cleaning_details: >-
      Editing was only done under the guidance and approval of the site principal investigator.
      If corrected data were available from elsewhere in the respondent's answers the error was
      corrected; if there was no logical or appropriate way to correct the data, the site
      principal investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      The data manager at each data site is responsible for the quality control of all data
      before uploading to FAIRhub. The dataset has additionally been reviewed internally by
      AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included; a data quality dashboard file (dqd_omop.json)
      supporting more than 3,500 OMOP CDM data quality checks is distributed with the clinical
      data.

preprocessing_strategies:
  - preprocessing_details: >-
      Once data were sent from each study site to the central project team, all data were
      mapped to standardized terminologies where possible, notably the Observational Medical
      Outcomes Partnership (OMOP) Common Data Model for observational health data and Digital
      Imaging and Communications in Medicine (DICOM) for medical imaging data.
  - preprocessing_details: >-
      Device outputs were transformed from proprietary states into standard model formats prior
      to upload: ECG was exported as .xml and is distributed in WaveForm DataBase (WFDB)
      format; MoCA Duo output (total score, section subscores, Memory Index Score and task
      completion times) was exported as .csv; Topcon images exported in .fda format and
      Heidelberg FLIO images exported in .sdt format were converted to DICOM for the dataset;
      Garmin data exported in .FIT format were converted to the Open mHealth standard; Dexcom
      CGM and environmental sensor outputs were exported as .csv.
  - preprocessing_details: >-
      The released files are organized following the Clinical Dataset Structure (CDS) v0.1.1,
      with one directory per datatype, then modality, then device, then participant, and a
      manifest.tsv metadata file in each datatype directory.
  - preprocessing_details: >-
      Processing for this release was a combination of automated and custom pipelines, in
      contrast to the custom and ad hoc processing used for version 1.0.0.
  - preprocessing_details: >-
      No instances were excluded from the dataset at the time of preprocessing; exclusion
      operated only through study eligibility criteria.

raw_sources:
  - raw_data_details: >-
      The raw data are saved and expected to be preserved by the AI-READI project at least for
      the duration of the project, but are not anticipated to be shared outside the project team
      at present, because they have not been mapped to standardized terminologies and because
      the raw data may accidentally include personal health information or personally
      identifiable information, for example in free text fields. There is a possibility that
      raw data may be included in future releases of the controlled access dataset.

raw_data_sources:
  - source_description: >-
      Participant questionnaire responses and in-visit clinical data entered into REDCap,
      including the medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament test results and complete blood count results.
    source_type: electronic data capture system
    raw_data_format: REDCap exports
    access_details: >-
      Not shared outside the project team in raw form; released after mapping to the OMOP
      Common Data Model.
  - source_description: 12-lead electrocardiogram recordings from the Philips PageWriter TC30 cardiograph.
    source_type: clinical device
    raw_data_format: .xml
  - source_description: >-
      Retinal images from the Optomed Aurora, iCare EIDON, Heidelberg Spectralis, Topcon
      Maestro2, Topcon Triton, Zeiss Cirrus 5000 and Heidelberg FLIO devices.
    source_type: imaging device
    raw_data_format: DICOM natively; .fda for Topcon devices and .sdt for FLIO, both converted to DICOM.
  - source_description: Continuous glucose measurements from the Dexcom G6 monitor worn for ten days.
    source_type: wearable device
    raw_data_format: .csv
  - source_description: >-
      Physical activity, heart rate, oxygen saturation, respiratory rate, sleep and stress data
      from the Garmin Vivosmart 5 activity monitor worn for ten days.
    source_type: wearable device
    raw_data_format: .FIT
  - source_description: >-
      Indoor environmental measurements from the LeeLab Anura custom environmental sensor
      placed in the participant's home for ten days.
    source_type: custom-built sensor
    raw_data_format: .csv
  - source_description: >-
      Clinical laboratory results from blood and urine specimens; complete blood counts were
      performed by CLIA-certified laboratories local to each site and all other assays by the
      University of Washington Nutrition and Obesity Research Center testing facility.
    source_type: clinical laboratory
    raw_data_format: .csv
  - source_description: >-
      Electronic health records at the three health systems, screened for ICD-10 diagnosis
      codes and demographic data to identify recruitment pools, and used as the source of past
      health records.
    source_type: electronic health record
    access_details: >-
      Past health records are held under controlled access and are not part of the public
      release.
  - source_description: >-
      Biorepository specimens collected during the study visit and banked at the University of
      Alabama at Birmingham Center for Clinical and Translational Science: buffy coats from
      EDTA anticoagulated vacutainers, genomic DNA, plasma, serum, PAXgene-stabilised
      unisolated RNA and peripheral blood mononuclear cells. Approximately 53 mL of blood is
      collected for clinical lab assays and biobanking, together with a urine specimen. Plasma,
      serum and buffy coats collected at the University of Washington and the University of
      California San Diego are batch-shipped to Birmingham for integration into a central
      study-wide biobank; CPT mononuclear cell tubes and PAXgene RNA vacutainers are
      centrally processed at Birmingham.
    source_type: biorepository
    access_details: >-
      Biobanked samples are not part of this data release. They will eventually be available to
      scientists according to procedures and policies that are in development; a limitation of
      the biorepository is that there are a finite number of samples to share, and procedures
      for reviewing and prioritising written requests will be developed before the biorepository
      is complete.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    notes: >-
      Study ID number used to name each participant's folder within every datatype, modality
      and device directory, and listed in the participants.tsv file.
  - variable_name: recommended_split
    data_type: categorical
    categories:
    - train, validation, test
    notes: >-
      Suggested partition for training, validating and testing AI/ML models, distributed in the
      participants.tsv file.
  - variable_name: blood glucose
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system, capturing readings
      every five minutes from a subcutaneous sensor worn continuously for ten days.
  - variable_name: heart rate
    data_type: float
    measurement_technique: >-
      Read from the electrocardiogram or the blood pressure measurement device during the
      in-person visit, and recorded continuously by the Garmin Vivosmart 5 activity monitor
      during the ten-day home monitoring period.
  - variable_name: oxygen saturation
    data_type: float
    unit: '%'
    measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
  - variable_name: number of steps
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
  - variable_name: sleep duration
    measurement_technique: >-
      Garmin Vivosmart 5 wrist-worn activity monitor; reported as circadian and diurnal rhythm
      and sleep phases.
  - variable_name: respiratory rate
    measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
  - variable_name: stress level
    measurement_technique: Garmin Vivosmart 5 wrist-worn activity monitor.
  - variable_name: ambient temperature
    data_type: float
    measurement_technique: >-
      LeeLab Anura custom-designed environmental sensor placed in the participant's home for
      ten days.
  - variable_name: relative humidity
    data_type: float
    measurement_technique: LeeLab Anura custom-designed environmental sensor.
  - variable_name: particulate matter
    data_type: float
    measurement_technique: LeeLab Anura custom-designed environmental sensor.
    notes: Counts are reported for the PM1.0, PM2.5, PM4 and PM10 fractions.
  - variable_name: nitrogen oxides
    data_type: float
    measurement_technique: LeeLab Anura custom-designed environmental sensor.
    notes: Reported for NO and NO2.
  - variable_name: volatile organic compounds
    data_type: float
    measurement_technique: LeeLab Anura custom-designed environmental sensor.
  - variable_name: multi-spectral light intensity
    data_type: float
    measurement_technique: >-
      LeeLab Anura custom-designed environmental sensor; eleven multi-spectral light intensity
      measurements.
  - variable_name: best-corrected visual acuity
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity device at a distance of four metres from a
      touch-screen monitor, each eye tested separately under photopic conditions and under
      mesopic conditions using a neutral density filter.
    quality_notes: >-
      Lower numbers indicate better resolution. The Snellen visual acuity variables were
      dropped in version 3.0.0, so only logMAR measurements are available.
  - variable_name: letter contrast sensitivity
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars Letter Contrast Sensitivity test (Perceptrix), conducted monocularly under photopic
      conditions with a general occluder and mesopic conditions with a neutral density
      occluder, under undilated conditions.
    quality_notes: >-
      Higher numbers mean better sensitivity. Testing was terminated when the patient made two
      consecutive errors or reached the end of the chart.
  - variable_name: Montreal Cognitive Assessment total score
    data_type: integer
    maximum_value: 30.0
    measurement_technique: >-
      MoCA Duo application administered on an iPad by research staff, capturing responses
      interactively; the assessment yields a total score and six domain-specific index scores.
    quality_notes: >-
      The maximum score is 30; a total score of 26 and above is considered normal and anything
      below 24 is a sign of cognitive impairment. Education level, socioeconomic factors and
      mental health conditions may affect the score.
  - variable_name: monofilament test response
    data_type: categorical
    categories:
    - sensate, insensate
    measurement_technique: >-
      A standard 10 g monofilament applied to three locations on the plantar surface of each
      foot, ten times per location, with the participant's shoes and socks removed and eyes
      closed; insensate areas are retested for confirmation.
  - variable_name: HbA1c
    data_type: float
    unit: '%'
    minimum_value: 4.0
    maximum_value: 6.0
    measurement_technique: >-
      Whole blood laboratory test performed at the University of Washington Nutrition and
      Obesity Research Center on samples collected during the study visit.
    quality_notes: >-
      Marker for diabetes. The stated minimum and maximum are the reference range supplied by
      the testing laboratory, not the observed data range.
  - variable_name: N-terminal pro-B-type natriuretic peptide
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma test performed at the University of Washington Nutrition and Obesity Research Center.
    quality_notes: >-
      Severity and outcome predictor of heart failure. The reference range supplied by the
      testing laboratory varies by age, so no numeric bounds are recorded.
  - variable_name: Troponin-T
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma test performed at the University of Washington Nutrition and Obesity Research Center.
    quality_notes: >-
      Marker of myocardial injury. The laboratory reference range is sex-specific (female under
      11; male under 16), so no single numeric bound is recorded.
  - variable_name: C-peptide
    data_type: float
    unit: ng/mL
    minimum_value: 1.1
    maximum_value: 4.4
    measurement_technique: EDTA plasma test performed at the University of Washington Nutrition and Obesity Research Center.
    quality_notes: Indicator of insulin production. Bounds are the laboratory reference range.
  - variable_name: Insulin
    data_type: float
    unit: ng/mL
    minimum_value: 0.0
    maximum_value: 24.9
    measurement_technique: EDTA plasma test performed at the University of Washington Nutrition and Obesity Research Center.
    quality_notes: Marker for diabetes. Bounds are the laboratory reference range.
  - variable_name: C reactive protein, high sensitivity
    data_type: float
    unit: mg/L
    minimum_value: 0.0
    maximum_value: 10.0
    measurement_technique: Serum test performed at the University of Washington Nutrition and Obesity Research Center.
