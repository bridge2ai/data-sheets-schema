notes: >-
  The FAIRhub dataset pages and the AI-READI documentation site both carry the statement "This
  repository is under review for potential modification in compliance with Administration
  directives." Device manufacturers Topcon Corporation, Optomed, iCare World and Carl Zeiss
  loaned their devices for research purposes at no cost, and Heidelberg Engineering, Dexcom and
  Garmin provided research discounts on study devices.

source_caveats: >-
  Sources in the bundle disagree on several points; where the ranking settles the disagreement
  the higher-ranked source has been preferred and the conflict recorded, and where the
  disagreeing sources are equally ranked both are represented. (1) Acronym expansion: the
  FAIRhub structured metadata, README and healthsheet expand AI-READI as "Artificial
  Intelligence Ready and Exploratory Atlas for Diabetes Insights" and the registered official
  title is "AI Ready and Exploratory Atlas for Diabetes Insights", while the BMJ Open protocol
  and Nature Metabolism publications expand it as "Artificial Intelligence Ready and Equitable
  Atlas for Diabetes Insights"; the structured metadata is tier 1 and the publications tier 3,
  so the structured metadata form is used. (2) Publisher: the FAIRhub structured metadata gives
  the publisher as FAIRhub while the RO-Crate metadata gives it as the AI-READI Consortium;
  these tier-1 sources are equally ranked and the bundle supplies no identifier for either as a
  publishing entity, so the publisher slot, whose range is uriorcurie, is left unpopulated and
  both statements are recorded here. (3) Lead organization: the FAIRhub structured metadata
  names Washington University in St. Louis (ROR 01yc7t268) as managing organization, lead
  sponsor and affiliation of the responsible-party investigator, while the RO-Crate metadata
  and the NIH RePORTER record place the principal investigator at the University of Washington;
  both are recorded. (4) Target enrollment: the structured metadata and the publications give
  an anticipated enrollment of 4,000 participants, the IRB protocol application states 4,600,
  and the NIH RePORTER abstract says "4,000+"; the structured metadata figure is used. (5)
  De-identification method: see the caveat on is_deidentified. (6) Sensitivity: see the caveats
  on sensitive_elements. (7) Collection start date: see the caveat on collection_timeframes.
  (8) License name: see the caveat on license_and_use_terms. (9) Tabularity: is_tabular is set
  to false because the release is dominated by DICOM imaging, waveform and JSON files, but the
  collection is mixed: the healthsheet states that instances encompass tabular data, imaging
  data and physiological signal/waveform data, and the clinical_data directory is entirely CSV
  mapped one-to-one to OMOP CDM tables. A single boolean cannot represent that mixture.