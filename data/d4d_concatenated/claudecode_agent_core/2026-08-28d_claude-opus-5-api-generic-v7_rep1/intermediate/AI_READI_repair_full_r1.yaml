      - >-
        Dataset documentation for version 3.0.0 at https://docs.aireadi.org, which complements
        the dataset landing page and describes each data domain, its clinical context,
        acquisition, variables, file formats, standards, metadata and example outputs, together
        with the healthsheet, controlled variables, AI-readiness considerations and changelog.
    archival: false
    restrictions:
    - >-
      The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
      associated with its use.
    future_guarantees: >-
      The dataset is described as self-contained; it relies on the documentation only for users
      requiring additional information about provenance. The creators identify no official
      archival version of the documentation as it existed at the time the dataset was created,
      and note that the site is versioned per dataset release with a dropdown for older
      versions.
  - external_resources:
      - >-
        AI-READI project website at https://aireadi.org/, including the team page at
        https://aireadi.org/team and the contact form at https://aireadi.org/contact.
    archival: false
    future_guarantees: >-
      No archival guarantee is stated for the project website; the dataset is described as
      self-contained and does not depend on it.
  - external_resources:
      - >-
        Zenodo community of the AI-READI project at https://zenodo.org/communities/aireadi,
        which hosts the versioned license document
        (https://doi.org/10.5281/zenodo.17555036) and project guidelines.
    archival: true
