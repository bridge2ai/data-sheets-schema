description: >-
  The AI-READI dataset is a multimodal, AI-ready dataset collected from 2,280 adults with and
  without type 2 diabetes mellitus (T2DM) and harmonized across three United States data
  collection sites: the University of Alabama at Birmingham, the University of California San
  Diego, and the University of Washington. Version 3.0.0 contains data collected between July
  19, 2023 and May 1, 2025, spanning the pilot phase and the first two years of the study.
  Modalities include survey and clinical data captured through REDCap and mapped to the OMOP
  Common Data Model, 12-lead electrocardiography, retinal photography, optical coherence
  tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging ophthalmoscopy
  (FLIO), continuous glucose monitoring, wearable activity monitoring, and indoor environmental
  sensing. The release comprises 356,343 files (approximately 3.82 TB) organized into nine
  datatype directories following the Clinical Dataset Structure (CDS) v0.1.1. The composition
  of the dataset was designed with future AI/machine learning studies in mind: recruitment
  sampling aimed at an approximately equal distribution of participants across sex, race and
  diabetes severity, and the acquisition protocol spans domains that enable downstream analyses
  not feasible with claims or electronic health record data alone. The overarching scientific
  goal is to better understand salutogenesis, the pathway from disease to health, in T2DM. The
  public release contains no protected health information; information related to participant
  sex and race/ethnicity, and medications used, has also been removed and is held under
  controlled access. Access requires login through a verified identity system, agreement to use
  the data only for type 2 diabetes related research, and acceptance of the AI-READI custom
  license. AI-READI (the Bridge2AI Salutogenesis Grand Challenge) is one of four Data
  Generation Projects funded by the NIH Common Fund Bridge2AI program; the study principal
  investigator is Aaron Lee.

conforms_to: >-
  The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1
  (https://cds-specification.readthedocs.io/en/v0.1.1/): one directory per datatype at the
  root, then one folder per modality, then one per device, then one per participant, with each
  participant folder named after the participant's study ID number. Within datatype
  directories, data files follow: WaveForm DataBase (WFDB) for cardiac_ecg; the Observational
  Medical Outcomes Partnership (OMOP) Common Data Model for clinical_data, where each CSV file
  is a one-to-one mapping to an OMOP CDM table; the NASA ASCII File Format Guidelines for Earth
  Science Data for environment; Digital Imaging and Communications in Medicine (DICOM) for
  retinal_flio, retinal_oct, retinal_octa and retinal_photography; and Open mHealth for
  wearable_activity_monitor and wearable_blood_glucose. An RO-Crate metadata document
  conforming to the RO-Crate 1.2-DRAFT specification and the FAIRscape profile 0.1 also
  describes the release and its nine sub-crates.

