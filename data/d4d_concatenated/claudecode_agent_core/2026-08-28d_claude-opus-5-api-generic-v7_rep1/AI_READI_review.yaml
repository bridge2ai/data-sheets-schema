notes: >-
  Instrument findings for the validator: (a) c008 is marked nothing_relevant yet creators[0].description
  carries the institution list that only lines 2144–2148 state — a chunk-status/claim mismatch the
  receipt validator cannot see because the value has no receipt; (b) slot-055's reshaped path is not named
  in the pack — publisher was deleted in phase 4 and the receipted statement now lives only in top-level
  source_caveats, so the 'reshaped' item has no slot to read; (c) the Table 2 lab reference ranges are
  column-scrambled in the preprocessed BMJ Open text (names at lines 561–620, ranges at 662–690 and 775,
  units at 733–745), so every variables[*] bound/unit is read by row order across three blocks —
  supported, but a reader should know the alignment is positional. Two receipts (slot-019, slot-026) cite
  real but non-attesting snippets from the right chunk while the attesting line sits uncited elsewhere.
