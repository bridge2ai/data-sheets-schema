notes: >-
  Adverse items: slot-011 (weak — the receipted deed passage defines
  'commercial use' but the prohibition and the negotiation clause the value
  asserts sit at bundle lines 3771–3773, unreceipted for that slot); slot-033,
  slot-039, slot-056 (inferred — enum/prose classifications the bundle does not
  state in those terms). None is a fabrication. Two observations outside the
  items: machine_annotation_tools[0].tools is 'GPT-4 unknown' although line 1214
  states 'v.gpt-4-1106-preview' — that version belongs to the Nature U2OS study
  the record deliberately keeps out of the dataset's method slots, so the choice
  is consistent with the referent decision but loses a stated version; and
  maintainers[1] (a website-support contact, role 'researcher') is a thin fit
  for a dataset maintainer. No defect that the receipt validator should have
  caught was found. The pack lists no gaps.
