updates:
  update_details: 'The released dataset is growing toward the anticipated final dataset of
    100,000 patient admissions across 9 data modalities: EEG extraction was in process, and
    imaging de-identification was in process for a cohort larger than the 1000 images then
    available. Data contributing sites provide regular status updates on their progress in
    creating and curating their CHoRUS data extract, submitted either through the GitHub interface
    or a Google Form, and these statuses are tracked in the Standards and Data Acquisition
    projects.'
ethical_reviews:
- reviewing_organization: CHoRUS consortium
  review_details: The project performs community-facing ethics focus groups to determine what
    data is appropriate for public sharing. The CHoRUS consortium evaluates community perspectives
    on clinical care AI to find ways to increase trustworthiness of provenance and privacy
    in AI, and new approaches are being created as the existing legal and regulatory landscape
    is analyzed. Patient-focused efforts determine the ethical and legal approaches to manage
    privacy and bias, while accounting for social determinants of health.
human_subject_research:
  involves_human_subjects: true
  special_populations:
  - Critically ill patients admitted to ICU, PICU, and NICU
  description: The dataset is assembled from the clinical records of critically ill patients
    admitted to the contributing hospitals.
license_and_use_terms:
  license_terms: All access is controlled. Participants fill out a registration form and all
    participants must sign a licensing agreement included in the registration form before
    gaining access to the dataset. Once access is granted and compute is provisioned, an email
    is sent.
  source_caveats: The CHoRUS GitHub organization README states "This project is licensed under
    the MIT License. See the LICENSE file for more details.", and several repositories in
    that organization are individually marked MIT while the Chorus_SOP repository is marked
    Apache-2.0. Those statements govern the organization's software, not the dataset; no license
    is stated for the dataset itself, whose terms are the signed licensing agreement recorded
    in license_terms.
data_governance:
  description: The project establishes a legal framework for collecting data at scale, sampling
    to ensure comprehensive sets of patient conditions and clinical treatment strategies,
    and determines the ethical and legal approaches to manage privacy and bias.
  access_review_process: Participants fill out a registration form with name, email, and institution,
    and sign a licensing agreement included in that form. A .edu email address is required
    in order to gain access to the dataset; program administrators will assist with this access
    if needed, and the requirement is not a barrier to acceptance into the training program.
    Once access is granted and compute is provisioned, an email is sent. The CHoRUS GitHub
    organization directs access requests to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  stewardship_roles:
  - Data site managers at data contributing sites, who follow the CHoRUS standard operating
    protocols to extract, curate and submit their site's clinical data extract and report
    status
is_deidentified:
  method: Tokenization of unstructured clinical notes using the OHNLP toolkit, de-identification
    of imaging, and transformations that limit re-identification. The organization publishes
    de-identification tooling in its CTP-deid repository.
  deidentification_details: At the time of the AIM-AHEAD cohort 2 webinar, 1000 images were
    available with de-identification in process for a larger cohort.
external_resources:
- name: Bridge2AI AI/ML for Clinical Care Collaborative Cloud
  description: The cloud enclave in which the dataset is held and analyzed. OMOP and telemetry
    data are held in the enclave; clinical notes are stored locally at the contributing sites,
    with only tokens in the enclave. The CHoRUS team creates tools to support the cloud enclave,
    including a set of dockerized container applications and associated configurations deployed
    to support CHoRUS services on Azure. Users are given hands-on training on the platform
    and leverage the data and tools to create practical use cases.
  restrictions:
  - Controlled access
  - Registration and a signed licensing agreement are required before access is granted
  - A .edu email address is required in order to gain access to the dataset
- id: https://github.com/chorus-ai
  name: CHoRUS for Equitable AI GitHub organization
  description: The CHoRUS GitHub organization houses active repositories that provide software
    and tooling to interact with and extract insight from clinical data in diverse formats,
    validated semantic mappings for connecting clinical data in various source formats to
    international standards, standard operating protocols to instruct data contributing sites,
    and project management overviews to track data delivery statuses. A web guide for contributors
    and users of the CHoRUS software packages is compiled in the chorus-developer repository,
    and a package status page reports versions, maintainers and other metadata about CHoRUS
    packages.
