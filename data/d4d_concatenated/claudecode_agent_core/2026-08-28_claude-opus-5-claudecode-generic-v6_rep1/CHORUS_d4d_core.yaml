id: https://chorus4ai.org/
name: CHoRUS
description: CHoRUS is a multi-center, multimodal, high-resolution critical care dataset assembled
  by the CHoRUS consortium, one of four data generation projects in the NIH-funded Bridge2AI
  consortium. Data is collected retrospectively from 14 data contributing hospitals and standardized
  to the OMOP Common Data Model, and is made available under controlled access. The currently
  released dataset covers 50,000 patient admissions from ICU, PICU, and NICU, comprising 1.6
  billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform
  data; the anticipated final dataset covers 100,000 patient admissions across 9 different
  data modalities. The consortium describes its aim as developing the necessary network, tools,
  standards, data, and education to build machine-learning (ML) and artificial intelligence
  (AI)-derived models to improve the care and outcomes of patients requiring critical care.
source_caveats: Two sources in the bundle give different current admission counts. The project
  documentation at chorus4ai.org (source id project_documentation, source_priority tier 2)
  states a current released dataset of 50,000 patient admissions; the AIM-AHEAD cohort 2 informational
  webinar (source id cohort_2_webinar, tier 4) states that "As of August 2025, covers 14 different
  hospitals with over 45K unique admissions". The higher-ranked source is preferred and its
  figure is recorded; the webinar figure is retained in the caveat of the corresponding instance
  entry. The two sources agree on 14 contributing hospitals. The modality table in the webinar
  is a PDF text extraction in which the column alignment between data type, data standard,
  access control, metadata and published metadata schema is degraded; only the data-type-to-standard
  pairings that the text makes unambiguous are recorded here, and per-modality access-control
  and metadata status are asserted only where the text is unambiguous.
