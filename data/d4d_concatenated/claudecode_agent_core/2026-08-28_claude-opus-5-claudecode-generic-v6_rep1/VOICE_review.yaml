notes: >-
  Pack lists no gaps. Adverse findings: one laundered receipt (slot-011, a
  recruitment passage receipting a clinical-validation value), three weak
  receipts (slot-010 tagline, slot-013 eligibility bounds receipting a
  distribution, slot-027 a neighbouring table row), two inferences carried
  as values (slot-031, slot-042), and three rule violations (rule-01 via
  those inferences; rule-06 statements of absence in impact_details and
  erratum_details; rule-14 fourteen File/FileCollection fragments no value
  points at). On rule-14 there is an instrument tension worth an issue rather
  than a verdict change: the core derivation projects resources by id, so
  the File ids the rule counts as noise are what the projector consumes.
  Instrument finding for the receipt validator: slot-011's snippet verified
  verbatim in c011 while bearing no relation to the value, and slot-027's
  snippet verified while the value sits on the adjacent line; verbatim
  verification cannot see either. Two receipted values (slot-025, slot-026)
  are only partly covered by their cited passages; the remainder is
  supported by other chunks the receipt does not cite for that slot.
