purposes:
- response: The purpose for creating the dataset was to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights into type
    2 diabetes mellitus (T2DM), including salutogenic pathways to return to health. T2DM is
    a growing public health threat, yet the current understanding of T2DM, especially in the
    context of salutogenesis, is limited. Given the complexity of T2DM, AI-based approaches
    may help with improving our understanding, but a key issue is the lack of data ready for
    training AI models. The AI-READI dataset is intended to fill this gap.
  description: The primary goal of AI-READI is to collect and publicly share a multimodal,
    AI-ready dataset for studying the pathogenesis and salutogenesis of type 2 diabetes mellitus.
- response: AI-READI is an NIH Common Fund Bridge2AI-supported data collection effort to generate
    a 4000-person data set with T2DM that is suitable for AI/ML. It is triple-balanced with
    respect to race/ethnicity, biological sex and T2DM severity (including those who do not
    have T2DM), and multimodal with over 10 variable domains, yet hypothesis agnostic.
- response: The long-term objective for this project is to develop a foundational dataset
    in diabetes, agnostic to existing classification criteria, which can be used to reconstruct
    a temporal atlas of T2DM development and reversal towards health, that is, salutogenesis.
- response: A further aim is to establish standards, best practices and guidelines for the
    collection, preparation and sharing of data for AI/ML, and to share that blueprint so
    that future data generation projects can follow it.
tasks:
- response: Data collection was specifically designed to permit downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories by collecting and learning
    from complex, multimodal data from participants with differing disease severity, from
    normal to insulin-dependent type 2 diabetes mellitus.
  description: The multimodal dataset was gathered to facilitate downstream pseudotime manifolds
    and various applications in artificial intelligence.
- response: Specific aims include 1) collect and share the dataset for AI/ML research according
    to the Findable, Accessible, Interoperable, Reusable (FAIR) data principles, 2) create
    a model for developing large scalable datasets, and 3) increase access to and quality
    of AI/ML research by recruiting and training personnel.
addressing_gaps:
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as type 2 diabetes mellitus has been limited by a lack of well-designed, high quality,
    large and inclusive multimodal datasets. Type 2 diabetes affects a high proportion of
    the population - the BMJ Open protocol cites a prevalence of 10.5% of the world's adult
    population and the Nature Metabolism comment more than 6% - and certain populations experience
    a greater burden of disease.
- response: A major barrier has been the lack of diverse datasets that are AI ready for training
    AI models, which the AI-READI project is designed to address. A meta-epidemiological review
    of type 2 diabetes studies published from 2000 to 2020 indicated that samples lacked racial
    and ethnic diversity.
