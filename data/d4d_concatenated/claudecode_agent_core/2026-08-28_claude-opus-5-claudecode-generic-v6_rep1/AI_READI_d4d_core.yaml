    solely and exclusively with the licensor and its suppliers; any rights not expressly granted
    are reserved.
  - Copyright (c) 2026 AI-READI.
  description: The licensee agrees to indemnify, defend and hold harmless the licensor and
    its suppliers against claims arising directly or indirectly from use of the data or from
