  other_compliance: Licensees must comply with all applicable laws, regulations and restrictions
    relating to the distribution and use of the data and models. The RO-Crate records a confidentiality
    level of "HL7:2N (normal)".
data_governance:
  committee_name: AI-READI Consortium
  committee_contact: ORCID:0000-0002-7452-1648
  access_review_process: Accessing the dataset requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to the
    license terms, which the FAIRhub metadata records as access type PublicDownloadSelfAttestationRequired
    with conditions of access at https://fairhub.io/datasets/3/access. The controlled access
    data set contains all data available in the publicly accessible set plus more sensitive
    data that are only available for use by scientists whose institutions have completed legal
    and privacy use agreements with the AI-READI research program; the full dataset is accessible
    by entering into a data use agreement. Licensees indicate assent through a data request
    workflow, and the information provided in that workflow constitutes an integral part of
    the agreement.
  stewardship_roles:
  - The University of California San Diego has a health Data Oversight Committee (HDOC) that
    oversees data sharing with other institutions.
  - The data manager at each data site is responsible for the quality control of all data
    before uploading to FAIRhub.
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
    description: Recorded in the FAIRhub dataset description as the managing organization,
      and named as licensor in the AI-READI Data License Agreement.
  source_caveats: The tier-1 RO-Crate records the data governance committee as the AI-READI
    Consortium; the tier-3 BMJ Open protocol instead refers to a "Data Access Committee" whose
    requirements for controlled access data sets were being developed at the time of writing.
  description: The governance contact is Aaron Lee (ORCID:0000-0002-7452-1648), Central study
