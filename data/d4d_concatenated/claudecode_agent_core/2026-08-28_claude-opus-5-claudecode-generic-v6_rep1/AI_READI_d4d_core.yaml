  identifiers_removed: Protected Health Information as defined by the HIPAA Privacy Rule,
    together with information related to the sex and race/ethnicity of the participants and
    medication used. At screening the study collects name, medical record number, date of
    birth, age, sex, race/ethnicity, address, phone number, driver's license number and email.
  deidentification_details: The FAIRhub dataset description states that no identifiers were
    collected so no active de-identification was necessary, but that the team checked that
    no identifiable data per US HIPAA were present in the data.
