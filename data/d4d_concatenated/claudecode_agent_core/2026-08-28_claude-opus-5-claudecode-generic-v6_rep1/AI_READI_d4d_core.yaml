instances:
- instance_type: individual patient
  counts: 2280
  label: false
  description: Each instance represents an individual patient, and consists of all of the
    data available for that individual participating in the study. Multiple modalities are
    collected for each participant, including survey data, clinical data, retinal imaging
    data, environmental sensor data, continuous glucose monitor data and wearable activity
    monitor data. These encompass tabular data, imaging data, and physiological signal/waveform
    data. There is no unstructured text data included in this dataset.
  label_description: No labels are provided. No specific labeling was performed in the dataset,
    as it is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream
    AI/ML applications.
  notes: The first version of the dataset contained data from 204 participants, the second
    version a total of 1067 participants, and this third version a total of 2280 participants.
    The NIH RePORTER abstract describes an intended cross-sectional dataset of 4,000+ people
    with longitudinal data from 10% of the study cohort.
anomalies:
- anomaly_details: Marijuana use is not assessed for participants living in Alabama because
    it is an illegal substance there.
  description: The Alcohol, Smoking, Marijuana and Vaping Use and History Questionnaire is
    used at the University of Washington and University of California San Diego sites, while
    the University of Alabama at Birmingham site uses an Alcohol, Smoking and Vaping Use and
    History Questionnaire only.
- anomaly_details: The dataset has not undergone any formal external audits. It has been reviewed
    internally by AI-READI team members for quality checks and to ensure that no personally
    identifiable information was accidentally included.
- anomaly_details: In cases of survey data, skipped questions or incomplete responses are
    expected. In cases of using wearables, improper use and technical failure such as battery
    failure or system malfunction are expected. In cases of imaging data, patient uncooperation,
    noise that may obscure the images, technical failure such as system malfunction, and data
    transfer failures are expected.
- anomaly_details: For the handheld Optomed Aurora fundus camera, because it is challenging
    to get a good view with undilated pupils and because of the handheld nature of the modality,
    the quality of the images varies from patient to patient and within the same patient.
- anomaly_details: The FLIO device is very sensitive and several factors can induce noise
    in the images; it cannot handle more than 1 centimeter of movement during image acquisition.
    Because FLIO takes longer than a usual Spectralis OCT and exposes patients to uncomfortable
    levels of light, it is performed as the last modality of a visit, so patient compliance
    may be lower.
- anomaly_details: For the Garmin Vivosmart 5 fitness tracker there are gaps in data collection
    because the battery had to be charged every 2-3 days. The sampling frequency of the fitness
    tracker is 5 seconds.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers; therefore there is selection bias known as
    volunteer bias, which may limit the generalizability of results among those who are not
    represented in the study population.
  mitigation_strategy: 'Three recording sites were strategically selected for geographic variability
    and to ensure representation across racial and ethnic groups, and each site prioritizes
    different groups according to local demographics: the University of Washington concentrates
    on recruiting Asian, then Hispanic, then Black participants; the University of California
    San Diego prioritizes Hispanic, then Asian, then Black participants; and the University
    of Alabama at Birmingham prioritizes Black, then Hispanic, then Asian participants. All
    sites recruit White participants.'
- bias_description: It is a well-documented observation in health research that recruiting
    Black men into studies is more difficult than recruiting other populations, yet this population
    represents a disproportionate percentage of the burden in type 2 diabetes. Factors such
    as medical mistrust and fear for safety stem from historical events. These trends for
    under-recruitment and for disease burden have also been reported for Hispanic and Asian
    persons.
  mitigation_strategy: If sample balancing on race/ethnicity emerges as a challenge, new recruitment
    strategies will be implemented to overcome the imbalance.
  affected_subsets:
  - Black male participants
  - Hispanic participants
  - Asian participants
- bias_description: Factors influencing the generalization of derived models include the predominantly
    urban and hospital-based recruitment, which may not fully capture diverse cultural and
    socioeconomic backgrounds.
- bias_description: While the AI-READI cross-sectional database ultimately aims to achieve
    balance across race/ethnicity, biological sex, and diabetes presence and severity, the
    pilot study is not balanced across these parameters.
  mitigation_strategy: Uniform data collection protocols were implemented for all subjects,
    irrespective of their race/ethnicity, biological sex or diabetes severity, across all
    study sites. The selection of study sites was intended to ensure equitable representation
    and minimize the potential for sampling bias.
known_limitations:
- limitation_description: A limitation of the biorepository is that there is a finite number
    of samples to share with scientists interested in using them in research.
  scope_impact: Blood derivatives are sent to the biorepository at the University of Alabama
    at Birmingham Center for Clinical and Translational Science and will be available to researchers
    for future ancillary studies.
  recommended_mitigation: Procedures for reviewing and prioritizing written requests will
    be developed before the biorepository is complete.
- limitation_type: representativeness_limitation
  limitation_description: Requiring that eligible participants speak, read and understand
    English may have created challenges in recruiting Hispanic and/or Asian persons.
  scope_impact: Non-English-speaking participants are not initially enrolled, and all patients
    need to be proficient enough to understand instructions for study procedures such as using
    the fitness tracker and continuous glucose monitor.
  recommended_mitigation: An NIH supplement was submitted to fund translation of all study
    materials. If recruitment goals for Hispanic participants are not met, the consent form
    will be translated into Spanish by UCSD translation services, and native Spanish-speaking
    research staff will provide interpretation and instructions as needed.
- limitation_description: As enrollment is ongoing, the pilot data release and periodic updates
    to data releases may not have achieved balanced distribution across groups.
- limitation_type: representativeness_limitation
  limitation_description: The study cohort may not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific Islanders
    and Native Americans.
  scope_impact: The three recording sites were chosen for geographic variability across the
    United States and to ensure representation across various racial and ethnic groups, and
    individuals from all demographic backgrounds were recruited at all three sites.
- limitation_description: Because of delay in obtaining the laboratory results and the lack
    of standard interpretation methods for other data such as imaging, it is unlikely that
    those data would be clinically actionable for participants.
confidential_elements:
- confidential_elements_present: false
  confidentiality_details: The dataset does not contain data that might be considered confidential.
    No personally identifiable information is included in the dataset.
  description: 'Confidentiality breach is assessed as low risk in the IRB protocol: all identifiable
    information is kept on encrypted computers or servers, or in a locked cabinet or room
    with restricted access at all sites, and only authorized research personnel have access
    to identifiable information.'
content_warnings:
