informed_consent:
- consent_obtained: true
  consent_type: Written informed consent, obtained either electronically as e-consent through
    REDCap with an electronic signature, or in person at the start of the visit.
  consent_documentation: The approved consent form for the principal project site, the University
    of Washington, is distributed with the dataset documentation. The other clinical sites
    had IRB reliance and used the same consent form, with minor institution-specific language
    incorporated depending on individual institutional requirements. Upon signing, the signed
    consent form is automatically emailed to subjects, who may request additional copies from
    the study coordinator for the duration of the study.
  withdrawal_mechanism: Participants may withdraw consent at any time and cease study participation,
    although any data already shared or used remains in the dataset.
  consent_scope: The public version of the dataset can only be used for type 2 diabetes related
    research; a private version allows more generic use. The consent form begins with a table
    clarifying which information will be publicly available and which requires an application
    and approval process containing privacy protection.
  source_caveats: The FAIRhub dataset description records the consent type as "ConsentSpecifiedNotElsewhereCategorised"
    with consentNoncommercial, consentGeogRestrict, consentResearchType, consentGeneticOnly
    and consentNoMethods all false.
at_risk_populations:
  special_protections:
  - Through engagement with the Native Biodata Consortium, the project provides a co-learning
    opportunity for understanding challenges specific to American Indian and Alaska Native
    communities and evaluating tools for addressing them, such as data usage agreements, contract
    negotiations, transparent access agreements and forms of assured return of benefit and
    sustainable input, control and monitoring of Tribal data. The project also engages in
    a tribal consultation to address barriers and facilitators of participation with the goal
    of collecting similar data within a Native American cohort in an ethical and respectful
    manner.
  - Transportation assistance in the form of rideshare services was offered to study participants
    who endorsed barriers to transporting themselves to study visits.
license_and_use_terms:
  id: doi:10.5281/zenodo.17555036
  name: AI-READI custom license v2.0
  license_terms: The AI-READI Data License Agreement (Version 2.0) is granted by Washington
    University in St. Louis as licensor. The licensor grants the licensee a non-exclusive
    and non-transferable license to download, reproduce and use the data, and to create derivative
    works of the data, for research, commercial and non-commercial purposes. The license terms
    were specifically tailored to enable reuse of the AI-READI dataset, and other clinical
    datasets, for commercial or research purposes while putting strong requirements around
    data usage, security and secondary sharing to protect study participants, especially when
    data is reused for artificial intelligence and machine learning applications. The licensee
    may use and store the data only on servers and devices maintained by and located within
    the licensee's institution or employer, or on cloud or remote storage and backup services
    that have a HIPAA-approved business associate agreement in place with that institution.
    Derivative data, including synthetic data created using the data, is considered data subject
    to all restrictions. The agreement terminates automatically upon any breach, upon which
    the licensee must delete all copies of the data and cease all use.
  data_use_permission: disease_specific_research
  description: Accessing the dataset requires several steps, including logging in through
    a verified ID system, agreeing to use the data only for type 2 diabetes related research,
    and agreeing to the license terms which set certain restrictions and obligations for data
    usage. The dataset landing page records the license as the "Health Data License".
  notes: The data is provided on an "as is" basis, without warranty of any kind, including
    without limitation the warranties that it is free from defects, merchantable, fit for
    a particular purpose or non-infringing. The licensor's entire liability under any provision
    of the agreement shall not exceed one U.S. dollar in the aggregate, with the exception
    of death or personal injury caused by the negligence of the licensor to the extent applicable
    law prohibits limitation of damages. The language of the agreement is English.
