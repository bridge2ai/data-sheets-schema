title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: AI-READI dataset
description: The AI-READI dataset consists of data collected from individuals with and without
  type 2 diabetes mellitus (T2DM) and harmonized across three data collection sites. Version
  3.0.0 contains data from 2280 participants collected between July 19, 2023 and May 01, 2025.
  The composition of the dataset was designed with future studies using AI and machine learning
  in mind, through recruitment sampling procedures aimed at approximately equal distribution
  of participants across diabetes severity, and through a data acquisition protocol spanning
  multiple domains (survey data, physical measurements, clinical data, imaging data, wearable
  device data) to enable downstream AI/ML analyses that may not be feasible with existing
  sources such as claims or electronic health record data. The goal is to better understand
  salutogenesis, the pathway from disease to health, in T2DM. The data contain no protected
  health information; information related to the sex and race/ethnicity of participants, and
  medication used, has also been removed from the publicly downloadable version. The dataset
  contains 356,343 files and is around 3.82 TB in size, organized following the Clinical Dataset
  Structure specification.
notes: 'FAIRhub records internal identifiers for this release: dataset_id d894862f-0795-4ba6-b40b-fae14eb77813,
  study_id f5d4172f-b0fb-48c8-b545-0192d812b329 and version_id 504ba283-30fc-4a78-b2f9-857d3108a4ad.
  The FAIRhub dataset description conforms to https://schema.aireadi.org/v0.1.0/dataset_description.json
  and the structure description to https://schema.aireadi.org/v0.1.1/dataset_structure_description.json.'
source_caveats: 'Several sources in the bundle disagree, and the manifest''s source_priority
  ranking was used to decide. (1) Expansion of the acronym: the tier-1 structured metadata
  and the dataset README give "AI Ready and Exploratory Atlas for Diabetes Insights" and "Artificial
  Intelligence Ready and Exploratory Atlas for Diabetes Insights", while the tier-3 BMJ Open
  protocol gives "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights";
  the tier-1 wording is preferred here. (2) Target enrollment: the tier-1 FAIRhub study description
  records enrollmentCount 4000 (Anticipated) and the tier-3 publications say 4000, while the
  tier-2 IRB protocol says 4600; the tier-1 figure is stated. (3) Blood volume: the tier-2
  IRB protocol says approximately 50-60 mL while the tier-3 BMJ Open protocol says 53 mL;
  the tier-2 figure is stated. (4) Study visit duration: the tier-2 IRB protocol and the tier-3
  Nature Metabolism comment say 3-4 hours, while the tier-3 BMJ Open protocol says 2.5-4 hours;
  the tier-2 figure is stated. (5) Publisher: the tier-1 FAIRhub metadata names FAIRhub as
  publisher while the tier-1 RO-Crate names the AI-READI Consortium; the two sources share
  a rank, so the ranking cannot decide and no single publisher is asserted. (6) Enrollment
  window: the tier-3 BMJ Open protocol says enrollment began 18 July 2023 and continues to
  30 November 2026, while the tier-3 Nature Metabolism comment says enrollment runs over four
  years, 2022-2026; both are recorded as separate collection timeframes. (7) The healthsheet
  writes the grant number as "OT2ODO32644" where every other source writes "OT2OD032644".'
