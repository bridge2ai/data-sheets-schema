regulatory_restrictions:
  regulatory_restrictions:
  - Protected Health Information is removed from the public set as defined by the HIPAA Privacy
    Rule via the Safe Harbor method.
  - Licensees must comply with all data security and privacy standards established by the
    U.S. National Institutes of Health under its Genomic Data Sharing (GDS) Policy, the current
    version being the NIH Security Best Practices for Controlled-Access Data Subject to the
    NIH GDS Policy.
  - Data may be used and stored only on servers and devices within the licensee's institution
    or employer, or on cloud or remote storage services covered by a HIPAA-approved business
    associate agreement.
