  description: The healthsheet answers "No" to whether the dataset contains data that, if
    viewed directly, might be offensive, insulting, threatening or otherwise pose a safety
    risk.
subpopulations:
- identification: 'Participants are recruited in equal proportions from four self-reported
    race/ethnic groups: Asian, Black, Hispanic and White. All race and ethnicity information
    is self-reported at the time of screening and enrollment.'
  distribution: In the suggested train/validation/test split summary for the 2280 participants
    of version 3.0.0, the totals by race/ethnicity are Hispanic 380, Asian 545, Black 519
    and White 836.
  source_caveats: The healthsheet answers "No" to whether the dataset identifies demographic
    sub-populations, consistent with sex and race/ethnicity being withheld from the public
    download; the counts recorded here come from the suggested-split summary in the dataset
    README, which reports them for the full release.
- identification: Participants are balanced by biological sex, recorded as male and female.
  distribution: In the suggested split summary the totals by sex are 951 male and 1329 female
    across the 2280 participants.
- identification: 'Participants are recruited into four diabetes status groups: no diabetes;
    pre-diabetes and type 2 diabetes controlled by lifestyle adjustments; type 2 diabetes
    controlled by oral or injectable medications other than insulin; and type 2 diabetes controlled
    by insulin.'
  distribution: In the suggested split summary the totals by diabetes status are No DM 776,
    Lifestyle 560, Oral 686 and Insulin 258.
- identification: Participants are adults aged 40 years and older.
  distribution: Mean age across the 2280 participants is 60.8 years with a standard deviation
    of 11.3; 61.1 +/- 11.3 in the training set, 60.3 +/- 10.8 in the validation set and 60.5
    +/- 11.4 in the test set.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The public dataset does not contain data considered sensitive. The
    data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
    sequencing data, past health records, medications, and traffic and accident reports.
  description: At screening the study collects name, medical record number, date of birth,
    age, sex, race/ethnicity, address, phone number, driver's license number and email; the
    variables retained in the study dataset include age (from date of birth), sex, race/ethnicity,
    5-digit ZIP code and driver's license number.
- sensitive_elements_present: true
  sensitivity_details: The RO-Crate lists the categories of personal sensitive information
    in the release as EHR, wearable monitoring, ECG, environmental sensor, continuous glucose
    monitor and wearable accelerometer data.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: The acquisition of data varied based on the domain; some data were
    directly observable, such as labs, vitals and retinal imaging, whereas other data were
    reported by subjects, such as survey responses. Verification of data entry was performed
    when possible, for example by cross-referencing entered medications with medications that
    were physically brought in or photographed by each study participant.
  description: The recruitment process consists of a selection of individuals based on the
    available clinical diagnosis using ICD-10 codes and demographic data from the electronic
    health records of study sites. Patients with type 2 diabetes and pre-diabetes are identified
    by screening electronic health records for ICD-10 diagnosis codes E11.X and R73.09 respectively.
- acquisition_details: All participants follow the custom AI-READI protocol, recorded in the
    FAIRhub study description as an intervention of type "Other" named "AI-READI protocol".
  description: Cross-sectional and longitudinal observational study with data and sample collections.
collection_mechanisms:
- name: Blood pressure and heart rate measurement
  mechanism_details: Systolic blood pressure, diastolic blood pressure and heart rate are
    measured twice, separated by 2 minutes, with an automatic oscillometric, medically approved
    device. Blood pressure devices used across the data acquisition sites are the OMRON HEM
    907XL Blood Pressure Monitor, the Medline MDS4001 Automatic Digital Blood Pressure Monitor,
    and the Welch Allyn 6000 series vital signs monitor with Welch Allyn FlexiPort Reusable
    Blood Pressure Cuff.
- name: 12-lead electrocardiogram
  mechanism_details: A 12-lead ECG is performed with a Philips PageWriter TC30 Cardiograph
    (Amsterdam, The Netherlands) while the participant sits in a reclining chair or lies supine;
    the position is recorded as 0, 30, 60 or 90 degrees relative to the supine position.
- name: Monofilament test for peripheral neuropathy
  mechanism_details: Peripheral neuropathy is assessed using the monofilament test, assessing
    touch perception on both feet with shoes and socks removed. The participant's eyes are
    closed while responding yes or no as to whether they feel the 10 g filament in three locations
    on each foot, 10 times per location. Insensate areas are retested for confirmation, and
    results are recorded on an iPad, laptop or paper questionnaire and added directly to the
    project's REDCap by clinical research staff.
- name: Montreal Cognitive Assessment
  mechanism_details: A general cognitive screener is carried out using the Montreal Cognitive
    Assessment (MoCA), administered electronically on an iPad using the MoCA Duo application
    (MoCA Cognition, Quebec, Canada). The total possible score is 30, with higher numbers
    representing better performance.
  description: The MoCA is a screening tool that helps detect mild cognitive impairment and
    early onset of dementia, evaluating memory, executive functioning, attention, language,
    visuospatial ability, orientation, visuoconstructional skills, conceptual thinking and
    calculations, and generating a total score and six domain-specific index scores.
- name: Visual acuity testing
  mechanism_details: Photopic letter visual acuity is measured with the M&S Technologies Electronic
    Visual Acuity tester (Niles, Illinois) using the instrument's routine protocol. The test
    is administered at a distance of 4 meters from a touch-screen monitor that is 12 by 20
    inches. Mesopic acuity is measured by the participant viewing the display through a 2.0
    neutral density filter. Visual acuity is measured under best-corrected conditions and
    expressed as the logarithm of the minimum angle of resolution.
- name: Contrast sensitivity testing
  mechanism_details: Photopic letter contrast sensitivity is measured with the Mars chart
    (Mars Perceptrix, Chappaqua, New York) using the routine procedure, and mesopic contrast
    sensitivity by viewing through the 2.0 neutral density filter. Contrast sensitivity is
    expressed as log sensitivity, with higher numbers meaning better sensitivity.
  description: The MARS Letter Contrast Sensitivity test is conducted monocularly under photopic
    conditions with a general occluder and mesopic conditions using a neutral density occluder,
    in the standardized order Photopic OD, Photopic OS, Mesopic OD, Mesopic OS. Background
    luminance falls within 60 to 120 cd/m2 with an optimal level of 85 cd/m2, illuminance
    between 189 and 377 lux with an optimal level of 267 lux, and viewing distance nominally
    50 cm varying between 40 and 59 cm.
- name: Autorefraction
  mechanism_details: Autorefraction data for each eye are obtained, with spherical and cylindrical
    components expressed as diopters with cylindrical axis, using the autorefractor's standard
    protocol on a Topcon KR 800 auto keratometer/refractor (Topcon Healthcare, Oakland, New
    Jersey).
- name: Lensometry
  mechanism_details: Lensometer devices used at data acquisition sites across the study include
    the NIDEK LM-600P Auto Lensometer and the Topcon CL-200 and CL-300 computerized lensometers.
- name: Blood and urine collection
  mechanism_details: Blood and urine samples are collected from participants during the visit;
    approximately 50-60 mL of blood is collected for clinical lab assays and biobanking purposes.
    Participants do not need to be fasting. Whole blood, blood derivatives and urine are used
    for clinical lab testing.
  description: Clinical Laboratory Improvement Amendments-certified laboratories local to
    each data collection site perform complete blood count testing on fresh whole blood samples;
    all other lab tests are performed by the University of Washington Nutrition and Obesity
    Research Center testing facility using stored, frozen samples.
  source_caveats: The tier-2 IRB protocol states approximately 50-60 mL of blood; the tier-3
    BMJ Open protocol states 53 mL.
- name: Retinal photography
  mechanism_details: Retinal photography is performed with the Optomed Aurora IQ, a handheld
    non-mydriatic fundus camera with a 50 degree field of view and 5 Mpix sensor used for
    undilated imaging, and the iCare EIDON widefield TrueColor confocal fundus imaging system,
    which can capture images up to 200 degrees and offers TrueColor, blue, red, red-free and
    infrared confocal modalities. All retinal images are collected under dilated conditions
    except for the Optomed.
  description: EIDON imaging in AI-READI uses two main modalities, Single Field Central IR/FAF
    and Smart Horizontal Mosaic, performed in fully automated mode in a dark room.
- name: Optical coherence tomography and OCT angiography
  mechanism_details: 'OCT and OCTA are collected on four devices: the Heidelberg Spectralis
    HRA+OCT (protocols ONH-RC, PPole-H and OCTA of the macula), the Topcon Maestro2 3D OCT-1
    (12.0 x 9.0 mm widefield, 6.0 x 6.0 mm 3D macula scan and 6.0 x 6.0 mm OCTA at a scan
    rate of 50 kHz), the Topcon Triton DRI OCT swept-source device with a 1,050 nm wavelength
    light source (12.0 x 12.0 mm and 6.0 x 6.0 mm OCTA, and 12.0 x 9.0 x 6.0 mm 3D horizontal
    and radial scans), and the Carl Zeiss Meditec Cirrus 5000 Angioplex (512 x 512 and 200
    x 200 macula and optic nerve head scans, macular OCTA, a 60 degree OCTA widefield view,
    8 x 8 mm single scans and 14 x 14 mm automated OCTA montage).'
- name: Fluorescence lifetime imaging ophthalmoscopy
  mechanism_details: Fluorescence Lifetime Imaging Ophthalmoscopy is performed on a Heidelberg
    Engineering device. The device exposes retinal tissue to intermittent laser beams and
    records the timing and number of photons for each point after each laser pulse. Scans
    record images at two wavelengths, short (498-560 nm) and long (560-720 nm), provided as
    two separate DICOM files for each eye.
- name: Dexcom G6 continuous glucose monitor
  mechanism_details: The Dexcom G6 is a real-time, integrated continuous glucose monitoring
    system that directly monitors blood glucose levels without requiring finger sticks, capturing
    blood glucose readings every five minutes. Participants wear the device continuously for
    10 days and are masked to the results during the monitoring period.
  description: A single sensor lasts a maximum of ten days and the transmitter saves data
    for thirty days, so data must be downloaded within thirty days of activation. Participants
    already wearing a Dexcom G6 may either place an additional study sensor at least 3 inches
    from their current sensor, or share their existing Dexcom Clarity data with the study
    clinic using a unique code; those participants may also allow download of previously collected
    glucose values for up to 90 days prior to the visit, giving up to 100 days of glucose
    data in total.
- name: Garmin Vivosmart 5 physical activity monitor
  mechanism_details: The Garmin Vivosmart 5 fitness tracker is used to measure data related
    to physical activity. Participants are advised to wear the wristwatch on their non-dominant
    wrist for 10 consecutive days but may choose their preferred wrist, and on return supply
    a form specifying the wrist worn and their dominant hand. The tracker continuously records
    data related to physical activity and sleep.
- name: LeeLab Anura home environmental sensor
  mechanism_details: Participants are sent home with a custom-designed environmental sensor
    unit called the LeeLab Anura, custom built for the AI-READI project at the Karalis Johnson
    Retina Center, University of Washington, which they place in a frequently used area of
    the home for 10 continuous days before returning it. On return the participant notes where
    the sensor was placed.
  description: 'Component documentation is referenced by part: the AS7431 datasheet from ams-osram,
    the DS3231 Precision RTC from Adafruit, and the Sensirion SEN5x datasheet and NOx Index
    note from Sensirion.'
- name: REDCap questionnaires and clinical data capture
  mechanism_details: REDCap is used for collecting patient-reported data from questionnaires
    and clinical data from the visit, including medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament test results and complete blood count results. Participants
    complete a screening questionnaire, demographic information, the Center for Epidemiological
    Studies Depression Scale-10, the Problem Areas in Diabetes questionnaire (PAID-5), a diabetes
    self-care score, a dietary assessment, an ophthalmic survey, smoking, alcohol, vaping
    and marijuana use questions, a general health survey, Social Determinants of Health surveys
    drawn from the PhenX Toolkit, a current medications list with RxNorm codes, and an exit
    survey.
  description: To reduce visit time, questionnaires may be filled out electronically or on
    paper before or after the in-person visit; paper questionnaires may be brought to the
    study visit or mailed back with the devices.
- name: Electronic health record extraction
  mechanism_details: Medical records are extracted to obtain data on general health, eye health,
    medical and surgical history, diabetes, medications, laboratory records and previous medical
    imaging such as eye imaging. Information about car accidents and traffic tickets received
    in the last 3 years is also collected.
collection_timeframes:
- name: Version 3.0.0 data collection period
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: For this version of the dataset, the timeframe for data collection was
    July 19, 2023 to May 01, 2025. The FAIRhub dataset description records this as a "Collected"
    date range of 2023-07-19/2025-05-01.
- name: Pilot enrollment period
  start_date: '2023-07-18'
  end_date: '2023-11-30'
  timeframe_details: Preliminary pilot enrollment occurred between 18 July 2023 and 30 November
    2023 in order to secure sufficient familiarity for all coordinators. Preliminary data
    from the pilot enrollment period were included in the first released data set.
- name: Formal data collection start
  start_date: '2023-12-01'
  timeframe_details: The formal data collection process began on 1 December 2023.
- name: Overall enrollment window
  start_date: '2023-07-18'
  end_date: '2026-11-30'
  timeframe_details: Enrollment began on 18 July 2023 and will continue until 30 November
    2026.
  source_caveats: The BMJ Open protocol gives this window; the Nature Metabolism comment instead
    states that AI-READI is enrolling 4,000 participants at three study sites over 4 years
    (2022-2026). Both sources share the same manifest rank, so both are recorded.
- name: NIH project period
  start_date: '2022-09-01'
  end_date: '2025-08-31'
  timeframe_details: The NIH RePORTER record for application ID 10471118 gives a project start
    of 2022-09-01 and a project end of 2025-08-31.
- name: Overall project timeline
  timeframe_details: The timeline for the overall project spans four years, encompassing one
    year dedicated to protocol development and training, and years 2-4 allocated for subject
    recruitment and data collection. Approximately 4% of participants are expected to undergo
    a follow-up examination in Year 4.
- name: Participant study visit
  timeframe_details: The protocol is performed as a single visit lasting approximately 3 to
    4 hours, depending on the participant, and if requested by subjects the visit can be performed
    over a couple of days instead of a single visit. A pre-visit questionnaire stage takes
    about 1 hour at home, and post-visit at-home data collection runs for 10 days.
  source_caveats: The tier-2 IRB protocol and the tier-3 Nature Metabolism comment give 3-4
    hours; the tier-3 BMJ Open protocol gives between 2.5 and 4 hours.
data_collectors:
- id: ROR:008s83205
  name: University of Alabama at Birmingham
  role: data collection site
  collector_details: Recruiting site in Birmingham, Alabama, recorded in the FAIRhub study
    description with status "Enrolling by invitation". Also hosts the central study biobank
    at the Center for Clinical and Translational Science and coordinates the recruitment sampling.
- id: ROR:0168r3w48
  name: University of California, San Diego
  role: data collection site
  collector_details: Recruiting site in San Diego, California, recorded in the FAIRhub study
    description with status "Enrolling by invitation".
- id: ROR:00cvxb145
  name: University of Washington
  role: data collection site
  collector_details: Recruiting site in Seattle, Washington, recorded in the FAIRhub study
    description with status "Enrolling by invitation".
- name: University of Washington Nutrition and Obesity Research Center
  role: central clinical laboratory
  collector_details: Performs all laboratory tests other than complete blood count, using
    stored frozen samples. Samples analyzed by the NORC laboratory are first stored locally
    at UAB and UCSD at -70 degrees Celsius, then batch-shipped to the University of Washington
    on dry ice approximately once per quarter.
- name: Oregon Health & Science University
  role: recruitment data processing
  collector_details: Responsible for uploading the combined UW, UCSD and UAB dataset into
    REDCap for the purpose of creating patient-specific REDCap survey links and distributing
    REDCap email invitations.
- name: Adapt Inc.
  role: recruitment mailing service
  collector_details: An SSAE16 SOC security-certified and HIPAA-compliant printing and fulfillment
    service used to send out the recruitment letters containing patient-specific REDCap survey
    links.
- role: clinical research coordinator
  collector_details: Responsible for contacting and consenting research participants, ushering
    participants through the research visit, conducting study visits including collection
    of ophthalmologic images, providing training on study procedures such as continuous glucose
    monitoring or the fitness tracker, and ensuring the return of all study materials.
- role: research assistant
  collector_details: Conducts study visits including collection of ophthalmologic images,
    provides training on study procedures, ensures the return of all study materials under
    the direction of the study coordinator or project manager, and is responsible for data
    upload and management from each clinic visit.
- role: program/project manager
  collector_details: Oversees data collection and management of research coordinators and
    project managers, makes project-related decisions in collaboration with the investigators,
    and oversees integration and collaboration between all study members and modules.
- role: database manager
  collector_details: Ingests data into the REDCap database and extracts it for processing.
- role: research/data scientist or postdoctoral fellow
  collector_details: Processes data for release in the database and develops standards.
- role: software engineer
  collector_details: Responsible for designing, implementing and testing the different data
    curation pipelines.
- role: cloud engineer
  collector_details: Responsible for cloud infrastructure customization, configuration and
    deployment, including integrating, configuring, deploying and managing centrally provided
    common cloud services.
- role: phlebotomist
  collector_details: Responsible for blood collection from research participants.
- role: lab assistant
  collector_details: Responsible for processing and shipping samples.
- role: domain expert
  collector_details: Provides guidance on issues arising from collecting data from each domain
    of medicine such as endocrinology and cardiology.
- name: AI-READI project team
  collector_details: All research personnel at the three data sites who recruited, enrolled
    and collected data underwent training by the data manager at the University of Alabama
    at Birmingham and use a detailed Manual of Procedures. Successful completion of a certification
    process is required for all coordinators, including mandatory institutional compliance
    training for human subject research, and prior to enrolling participants all coordinators
    must successfully administer all protocol elements to at least three volunteer practice
    subjects. Six cross-disciplinary project modules involving teams located across eight
    institutions work together to develop the dataset.
  description: There is a wide range of experience within the project team, including senior,
    mid-career and early career faculty members as well as clinical research coordinators,
    staff and interns, collectively covering clinical research, data collection, data management,
    data standards, bioinformatics, team science and ethics. Their effort was supported by
    National Institutes of Health award OT2OD032644 based on percentage of effort contributed,
    and salaries aligned with the funding guidelines at each site.
missing_data_documentation:
- missing_data_patterns: Not all modalities are available for all participants. In a few cases
    the data collection device did not have any stored results or was returned too late to
    retrieve the results, for example because the battery died or data was lost. In a few
    cases there may have been a data collision at some point in the process and data has been
    lost.
  missing_data_causes: Some participants elected not to participate in some study elements;
    device failure or late return; data collision during processing.
raw_data_sources:
- source_description: REDCap is used for collecting patient-reported data from questionnaires
    and clinical data from the study visit, including medications assessment, vitals, visual
    acuity, contrast sensitivity, monofilament test results and complete blood count results.
  source_type: study data capture system
  raw_data_format: REDCap exports
- source_description: Electronic health records at the three study sites are extracted to
    obtain data on general health, eye health, medical and surgical history, diabetes, medications,
    laboratory records and previous medical imaging such as eye imaging.
  source_type: electronic health record
- source_description: Driving and accident records, covering car accidents experienced and
    traffic tickets received in the last 3 years.
  source_type: state licensing records
  access_details: Driving and accident records are obtained from the Department of Licensing;
    no additional approvals are required beyond the IRB approval.
sampling_strategies:
- is_sample: false
  is_random: false
  source_data: The study base is all patients aged 40 years or older who had a medical encounter
    within each health system site (University of Alabama at Birmingham, University of California
    San Diego, University of Washington) between 2020 and 2025. The FAIRhub study description
    records an anticipated enrollment count of 4000 and a sampling method of "Non-Probability
    Sample".
  is_representative: false
  why_not_representative: Rather than targeting the demographic distribution of the US population,
    the study recruits equal numbers of four racial/ethnic groups and four diabetes severity
    groups. Exclusion criteria are pregnancy, gestational diabetes and type 1 diabetes, and
    adults older than 85 years of age.
  representative_verification:
  - Subjects are age- and sex-matched within and between groups.
  - As recruitment progresses the composition of participants is monitored in terms of diversity
    and inclusion and adjusted by under- and oversampling groups as needed.
  strategies: 'Target enrollment is 4000 people aged 40 and older, triple-balanced by self-reported
    race/ethnicity, type 2 diabetes presence and severity, and biological sex. Inclusion criteria
    are: able to provide consent; aged 40 years or older; persons with or without type 2 diabetes;
    must speak and read English. The investigators aim to recruit approximately 1000 patients
    into each of the four diabetes groups and 1,000 subjects from each of the White, Asian,
    Hispanic and Black racial and ethnic groups.'
  description: Recruitment sampling procedures aimed at achieving approximately equal distribution
    of participants across diabetes severity. The dataset contains all possible instances,
    that is, data from all participants enrolled in the covered period.
- name: Recruitment wave sampling
  strategies: Participants are recruited in waves to facilitate efficient sampling of the
    study base. Over the 3 or more years of study recruitment, approximately 50,000 invitation
    letters from each site are sent by both mail and email to participants identified through
    the electronic medical record search.
  source_data: Using the combined University of Washington, University of California San Diego
    and University of Alabama at Birmingham dataset, UAB selects a stratified sample of potential
    participants based on the sampling scheme, recursively, until recruitment goals for race/ethnicity,
    sex and diabetes severity are achieved.
raw_sources:
- raw_data_details: 'The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but is not anticipated to be shared outside
    the project team at present, because it has not been mapped to standardized terminologies
    and because the raw data may accidentally include personal health information or personally
    identifiable information, for example in free text fields. There is a possibility that
    raw data may be included in future releases of the controlled access dataset. Data from
    devices are exported in their raw format to local storage: ECG as .xml, MoCA Duo application
    output as .csv, retinal imaging, and at-home monitoring device data; blood and urine testing
    by the NORC lab is provided in .csv format.'
- name: AI-READI biorepository
  raw_data_details: Biobank blood specimens are stored at the University of Alabama at Birmingham
    Center for Clinical and Translational Science as a central study-wide repository. Local
    processing for plasma, serum and buffy coats is performed using standardized operating
    procedures. Genomic DNA extractions from stored buffy coats are performed at UAB CCTS,
    as is centralized processing of CPT mononuclear cell preparation tubes; PAXgene RNA vacutainers
    are stable for up to 72 hours after collection, allowing overnight shipment from UW and
    UCSD to UAB. Biobanked samples will eventually be available to scientists according to
    procedures and policies that are in development; during the project an infrastructure
    will be created to decide who is allowed to request and receive specimens for future research.
preprocessing_strategies:
- preprocessing_details: All data are mapped to applicable data standard formats, such as
    the Observational Medical Outcomes Partnership Common Data Model for clinical data and
    the DICOM format for retinal imaging. All participant images are exported from imaging
    devices in their raw format and some images required conversion to a DICOM standard format
    prior to upload to the external AI-READI data storage site.
  description: Once data were sent from each of the study sites to the central project team,
    additional processing steps were conducted in preparation for dissemination, mapping all
    data to standardized terminologies where possible.
- preprocessing_details: For some devices the data are transformed from a proprietary state
    into a standard model format prior to upload to FAIRhub; Topcon .fda files and Heidelberg
    .sdt files are converted to DICOM for the dataset, and Garmin .FIT files are converted
    to the mHealth standard.
cleaning_strategies:
- cleaning_details: Several quality control measures were used at the time of data entry and
    acquisition. Clinical data outside of expected minimum and maximum ranges were flagged
    in REDCap, visible in reports viewed by clinical research coordinators and data managers.
    Using these reports as guides, data managers and coordinators examined participant records
    and determined if an error was likely. Data were checked for credibility based on range
    checks, incorrect flow through prescribed skip patterns, missing data that could be filled
    directly from other portions of an individual's record, and the omission or duplication
    of records. Editing was only done under the guidance and approval of the site principal
    investigator.
  description: The data manager at each data site is responsible for the quality control of
    all data before uploading to FAIRhub.
- cleaning_details: The dqd_omop.json file distributed with the dataset supports OMOP CDM
    data quality analysis using the OMOP CDM Data Quality Dashboard, which runs a set of more
    than 3500 data quality checks against an OMOP CDM instance.
labeling_strategies:
- labeling_details: No labels are provided. No specific labeling was performed in the dataset,
    as the dataset is a hypothesis-agnostic dataset aimed at facilitating multiple potential
    downstream AI/ML applications, and no software was used to label instances. There are
    no formal guidelines in place for future researchers creating new labels or defining new
    tasks.
future_use_impacts:
- impact_details: To the extent of the creators' knowledge, no uses of the dataset are currently
    anticipated that could result in unfair treatment or harm. However, there is a theoretical
    risk of future re-identification.
discouraged_uses:
- discouragement_details: The AI-READI dataset license imposes certain restrictions on the
    usage of the data. The restrictions are described in the license file available at https://doi.org/10.5281/zenodo.17555036.
intended_uses:
- use_category: research
  examples:
  - Artificial intelligence and machine learning research into type 2 diabetes mellitus, including
    salutogenic pathways to return to health.
  - Downstream pseudotime manifold analysis to predict disease trajectories from multimodal
    data across differing disease severity.
  - Novel discoveries into type 2 diabetes pathogenesis and salutogenesis benefiting a broader
    population, given the diversity of the study participants.
  usage_notes: All data are stored and shared using FAIRhub as "AI-ready", which enables immediate
    AI/ML research without reformatting and preprocessing. Those who download and use AI-READI
    data are encouraged to publish their results in the scientific literature.
- use_category: model development
  examples:
  - Making, reproducing and distributing models, algorithms and programs that are developed,
    trained or adapted using the data but which do not themselves contain the data or any
    modified version of it.
  usage_notes: Before disseminating any such licensee models, the licensee must undertake
    all reasonable efforts to minimize the likelihood that data can be memorized, derived,
    reconstructed or reconstituted through the use or construction of those models. There
    are no plans for the researchers who collected the dataset to develop commercial products
    or file patents, but the dataset is publicly available with a commercial-friendly license
    and products or patents may be developed from it in the future.
prohibited_uses:
- prohibition_reason: Licensees shall not share or distribute the data with any third party
    model vendor or developer for training or development purposes, even if that vendor is
    party to a business associate agreement, where training includes model weight modification
    and other adjustments to a model's logic or operation.
- prohibition_reason: Data may not be reproduced in papers, articles, presentations, analyses,
    reports or publications, except that small representative samples may be reproduced in
    up to five images or figures per paper for illustrative purposes only; larger amounts
    must not be published via supplemental files, zip archives, code packages or other means.
- prohibition_reason: Licensees shall not make clinical treatment decisions based on the data,
    as it is intended solely as a research resource.
- prohibition_reason: Licensees shall not use the data to compromise the confidentiality or
    privacy of any data subject, to attempt to identify or contact any data subject or group
    of data subjects, to extract or extrapolate identifying information, to establish a data
    subject's membership in a particular group of persons, or otherwise to cause harm or injury
    to any data subject.
distribution_formats:
- name: FAIRhub public download
  description: The dataset is available through the FAIRhub platform, a Microsoft Azure cloud-based
    data management, curation and sharing platform developed for this project. Accessing the
    dataset requires logging in through a verified ID system, agreeing to use the data only
    for type 2 diabetes related research, and agreeing to the license terms. The FAIRhub access
    type is recorded as PublicDownloadSelfAttestationRequired.
  access_urls:
  - https://fairhub.io/datasets/3
  - https://fairhub.io/datasets/3/access
  format: Clinical Dataset Structure (CDS) v0.1.1 directory bundle
- name: DICOM imaging distribution
  media_type: application/dicom
  description: Retinal imaging data across the FLIO, OCT, OCTA and retinal photography directories.
- name: CSV distribution
  media_type: text/csv
  description: Tabular clinical, wearable and environmental data.
- name: JSON distribution
  media_type: application/json
  description: Structured metadata files such as dataset_description.json and participants.json.
- name: Markdown distribution
  media_type: text/markdown
  description: Documentation files such as README.md, CHANGELOG.md and healthsheet.md.
- name: Mini subset
  description: A smaller version of the dataset is available for pipeline development, recorded
    in the FAIRhub metadata as a child dataset of release 3.0.0. The dataset documentation
    covers the mini-subset version alongside license and training prerequisites and Azure
    Storage access.
- name: Controlled access distribution
  description: A controlled access set contains all data available in the publicly accessible
    set plus more sensitive data, available only for use by scientists whose institutions
    have completed legal and privacy use agreements with the AI-READI research program. The
    full dataset is accessible by entering into a data use agreement.
distribution_dates:
- name: Version 1.0.0 release
  release_dates:
  - '2024-05-03'
  description: The publicly accessible data set from pilot data collection was made available
    in May 2024, covering 204 participants.
- name: Version 2.0.0 release
  release_dates:
  - '2024-11-08'
  description: All data collected through 31 July 2024 were made available in November 2024,
    for a total of 1067 participants.
- name: Version 3.0.0 release
  release_dates:
  - '2025-11-17'
  description: The third version of the dataset, covering 2280 participants and data collected
    up to 1 May 2025, was distributed in November 2025.
- name: Release cadence
  release_dates:
  - approximately once a year
  description: Deidentified data are released approximately yearly in two data sets, a controlled
    access set and a publicly accessible set with fewer requirements for access, and each
    version is accessible through FAIRhub.
maintainers:
- name: AI-READI Consortium
  maintainer_details: The AI-READI team supports and maintains the dataset. The dataset is
    hosted on FAIRhub through Microsoft Azure. Each data collection site uploads data at regular
    intervals to the FAIRhub platform.
  description: The dataset README refers users to the README file included with the dataset
    for contact information, and to https://aireadi.org/contact and https://docs.aireadi.org/docs/3/contact
    for questions, suggestions or feedback. The study_description.json and dataset_description.json
    metadata files included in the dataset carry additional information about the contact
    person or entity, authors and contributors. The central study contact is recorded as Aaron
    Lee at contact@aireadi.org, and the Nature Metabolism comment gives leeay@uw.edu.
errata:
- erratum_details: The Snellen visual acuity variables were dropped in version 3.0.0 of the
    dataset, such that now only logMAR visual acuity measurements are available. The data
    fields and types are otherwise largely the same as the prior version.
updates:
  frequency: approximately once a year
  update_details: The dataset is released as static versions and is not updated in place.
    Rather, new versions of the dataset are released with additional instances as more study
    participants complete the study visit. There are plans to release new versions approximately
    once a year with additional data from participants enrolled since the last dataset version
    release, and future versions will include larger numbers of subjects as enrollment increases.
retention_limit:
  retention_period: There are no limits on the retention of the data associated with the instances.
  retention_details: Upon termination of the license agreement, the licensee shall delete
    all copies of the data in its possession and control, including in the possession or control
    of all authorized users, and cease all use of the data. The raw data is expected to be
    preserved by the AI-READI project at least for the duration of the project.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - Version 1.0.0, doi:10.60775/fairhub.1, released 3 May 2024, 204 participants
  - Version 2.0.0, doi:10.60775/fairhub.2, released 8 November 2024, 1067 participants, 2.01
    TB across 165,051 files
  - Version 3.0.0, doi:10.60775/fairhub.3, released 17 November 2025, 2280 participants
  version_details: There is one version of the documentation associated with each version
    of the AI-READI dataset. Version 2.0.0 is no longer accessible and its documentation directs
    readers to the latest version. A previous datasheet was created for the first version
    of the dataset, available at https://docs.aireadi.org/docs/1/dataset/healthsheet, and
    for the second version at https://docs.aireadi.org/docs/2/dataset/healthsheet. Older versions
    of the dataset are not separately maintained, because the dataset is not updated in place;
    new versions are released instead. The changelog summarizes participant counts of 204
    for the v1.0.0 pilot, 863 added for year 2 data, 1213 added for year 3 data, and 2280
    in total for the v3.0.0 main study.
extension_mechanism:
  extension_details: There is currently no mechanism for others to extend or augment the AI-READI
    dataset outside of those who are involved in the project.
ethical_reviews:
- name: University of Washington Institutional Review Board
  reviewing_organization: University of Washington Institutional Review Board
  review_details: AI-READI was approved by the Institutional Review Board of the University
    of Washington under approval number STUDY00016228, including reliance agreements with
    the IRBs of the University of Alabama at Birmingham and the University of California,
    San Diego. The initial IRB approval at the University of Washington was received on December
    20, 2022. An annual renewal application to the IRB about the status and progress of the
    study is required and due within 90 days of expiration.
  source_caveats: The RO-Crate names the reviewing organization "Washington University IRB"
    while giving a University of Washington Human Subjects Division address and the University
    of Washington protocol number STUDY00016228; the BMJ Open protocol and the healthsheet
    both name the University of Washington IRB.
  description: Contact point given in the RO-Crate for the reviewing board, at the Human Subjects
    Division, University of Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470,
    US. The contact is the IRB Reliance Team at hsdrely@uw.edu.
  contact_person: mailto:hsdrely@uw.edu
- name: AI-READI ethics review
  review_details: The RO-Crate records the ethical review for this release as carried out
    by Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans. Ethical, legal
    and social implications are considered at every stage of the project cycle, with guidance
    from bioethicists.
- name: Community Advisory Board
  review_details: A Community Advisory Board of 11 persons from the three sites, including
    diversity in race and ethnicity as represented in the AI-READI sample, contributes to
    the development of the protocol. The board also evaluates the consent forms and research
    protocols, and its feedback is considered in modifications to the IRB application as needed.
