notes: >-
  Two slot_receipted items (slot-004, slot-011) are weak because the cited snippet
  is on topic but the value's main claim lives in an unreceipted chunk (c004 lines
  985-995 and 1006 respectively) — attribution precision rather than fabrication.
  slot-009 and slot-013 show the same pattern in a milder form: the cited passage
  supports part of a composite value and the rest is stated elsewhere in the bundle
  (lines 7023 and 246-249), marked supported. Instrument note: the receipt validator
  cannot see either pattern, since the snippets it verified are real; a per-slot
  'value words covered by cited passages' figure would surface it. rule-14's
  violation is structural (unused fragment ids on every file_collections entry),
  not factual, and rule-07's is one entry (distribution_formats[6]) that duplicates
  access-tier prose already carried elsewhere. No gaps were listed in the pack.
