  - slot: sampling_strategies[2].strategies
    snippet: there is no sample size calculation applicable to our methodology. The sample
      sizes have been defined according to the existing literature
  - slot: collection_mechanisms[2].mechanism_details
    snippet: HVEC and remote data collection occur through two platforms, the Bridge2AI
      Voice Web app and the Bridge2AI Voice iOS app. The iOS app is restricted to iOS-compatible
      devices, while the Web App can run on a computer, tablet, or phone device
  - slot: at_risk_populations.special_protections[2]
    snippet: Pediatric patients will be enrolled ONLY through the pediatric sites and
      not at USF. Checklist HRP-416 for children under 21 has been completed and is appended
      to this protocol
  - slot: subpopulations[2].identification
    snippet: There is a specific plan in place to enroll participants from socially/ economically
      disadvantaged and underserved population so that the database is diverse and FAIR
  - slot: data_collectors[1].collector_details
    snippet: Potential participants will be recruited through clinic appointments at
      the participating facilities in this study. Additionally, recruitment flyers will
      be placed in well-trafficked areas to recruit participants in HVEC and COC
  - slot: participant_privacy[0].privacy_techniques
    snippet: All clinical data will be hosted on cloud/servers through NIH STRIDE partners.
      NIH Stride partners have pre-determined agreements with the NIH to ensure HIPAA
      protection and participant safety
  - slot: participant_privacy[0].data_linkage
    snippet: Each institution will keep their identified data within their institution.
      Identifiable PHI will be kept on the REDCap databases with password protected access
      only for investigators at the institution where the data is collected
  - slot: informed_consent[0].consent_documentation
    snippet: Consent may take place electronically, within the app, or on paper. Electronic
