  - slot: acquisition_methods[2].acquisition_details
    snippet: 'Individuals will be offered to enroll with the option to contribute with
      single time point data or longitudinal data (for certain disease cohorts)'
  - slot: known_limitations[0].limitation_description
    snippet: 'Exclusion criteria: - Not speaking the English or Spanish Language - Having
