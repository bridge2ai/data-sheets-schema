- id: c007
  status: extracted
  extracted:
  - slot: description
    snippet: dataset is a large, ethically sourced, and demographically diverse voice
      dataset linked to health information, released by the NIH's Bridge2AI initiative
  - slot: instances[0].description
    snippet: The dataset includes many derived voice recordings (such as spectrograms
      and other acoustic features) rather than raw audio in the public release, along
      with detailed participant metadata
  - slot: version_access.versions_available[3]
    snippet: with version 3.0 containing ~61,937 voice-derived recordings from 833 adult
      participants
  - slot: license_and_use_terms.license_terms
    snippet: The adult and pediatric datasets are available through separate PhysioNet
      links under registered access. Credentialed users must be approved and sign DUA
  - slot: confidential_elements[0].confidentiality_details
    snippet: Raw audio data is disseminated through controlled access only to protect
      participants' privacy
  - slot: purposes[1].response
    snippet: seeks to create a flagship, standardized, and ethically sourced dataset
      of 10,000 voices linked to health information to fuel research and discovery in
      voice biomarkers
  - slot: data_collectors[0].collector_details
    snippet: Data is collected in the clinic with the assistance of a trained research
      assistant. Future data collection will also occur remotely; however, remote data
      collection did not occur for the initial dataset release
  - slot: sampling_strategies[0].strategies
    snippet: Participants are recruited across different academic institutions from
      "high volume expert clinics" based on diagnosis and inclusion/exclusion criteria
  - slot: acquisition_methods[1].acquisition_details
    snippet: A total of 22 acoustic tasks are recorded through the app
  - slot: external_resources[1].description
    snippet: The supporting REDCap data dictionary, metadata, and instrument PDFs are
      available at
  - slot: external_resources[1].external_resources[1]
    snippet: https://zenodo.org/doi/10.5281/zenodo.12760724
  - slot: known_biases[0].bias_description
    snippet: The public data releases do not contain an equal distribution of these
      categories of diseases. Further releases will contain additional data
  - slot: missing_data_documentation[1].missing_data_patterns
    snippet: Please note that no external data is released in this v3.0.0 release
