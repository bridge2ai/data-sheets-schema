  - slot: addressing_gaps[0].response
    snippet: created to address a gap in the availability of large-scale, diverse, and
      well-documented voice data for use in clinical machine-learning applications
  - slot: creators[2].description
    snippet: Voice as a Biomarker of Health is being co-led by Dr. Yaël Bensoussan, MD,
