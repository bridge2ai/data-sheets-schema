  - slot: informed_consent[0].withdrawal_mechanism
    snippet: If participants withdraw from the study after they complete the voice data
      collection the data they have provided will be kept until completion of study
  - slot: retention_limit.retention_details
    snippet: The USF IRB requires de-identified study data and original consent forms
      be stored for a minimum of 5 years after the completion of the study
  - slot: annotation_analyses[0].analysis_method
    snippet: Each subsequent year of the study (2-4) 10% of the data will be selected
