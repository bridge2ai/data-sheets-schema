      collect standardized recordings of acoustic tasks, validated patient questionnaires,
      and validated patient reported outcomes
  - slot: subpopulations[1].identification
    snippet: 'four different categories of diseases in the adult population: vocal pathologies,
      neurological and neurodegenerative disorders, mood and psychiatric disorders,
      and respiratory disorders'
