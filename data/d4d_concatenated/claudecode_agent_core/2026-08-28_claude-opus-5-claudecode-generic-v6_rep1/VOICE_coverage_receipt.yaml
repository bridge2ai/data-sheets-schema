      collection, their data will not be included in the database
  - slot: existing_uses[0].examples[0]
    snippet: A restricted version of the dataset containing raw audio has been used in
      the Bridge2AI Summer School and hackathon
  - slot: future_use_impacts[0].impact_details
    snippet: this dataset has skews based on disorder category, site, and other demographic
