  - slot: purposes[0].response
    snippet: a data collection project on type 2 diabetes mellitus (T2DM) to facilitate the widespread
      use of artificial intelligence and machine learning (AI/ML) approaches to study salutogenesis
  - slot: addressing_gaps[0].response
    snippet: its high prevalence of 10.5% of the world’s adult population
  - slot: sampling_strategies[0].strategies
    snippet: target enrollment is 4000 people aged 40 and older, triple- balanced by self- reported race/ethnicity
  - slot: subpopulations[0].identification
    snippet: four race/ethnic groups (Asian, black, white, Hispanic), four categories of T2DM
  - slot: instances[0].description
    snippet: a multivariable protocol containing over 10 domains, including vitals, retinal imaging, electrocardiogram,
      cognitive function, continuous glucose monitoring, physical activity, home air quality, blood and
      urine collection for laboratory testing
  - slot: data_collectors[0].collector_details
    snippet: 'There are three study sites: Birmingham, Alabama; San Diego, California; and Seattle, Washington.'
  - slot: ethical_reviews[0].reviewing_organization
    snippet: approved by the Institutional Review Board (IRB) of the University of Washington (approval
      number STUDY00016228)
  - slot: ethical_reviews[0].review_details
    snippet: including  reliance agreements with the  IRBs  of  University  of  Alabama  at  Birmingham  and
      University  of  California,  San  Diego
  - slot: informed_consent[0].consent_obtained
    snippet: Written  informed consent is provided by all participants.
  - slot: informed_consent[0].consent_type
    snippet: informed  consent  is  performed  remotely  by  computer, tablet or smart phone
  - slot: sampling_strategies[0].source_data
    snippet: The study base is all patients aged ≥40 years of age who had a medical encounter within each
      health system site
  - slot: acquisition_methods[0].acquisition_details
    snippet: identified by screening elec- tronic health records for ICD- 10 diagnosis codes R73.09 and
      E11.X
  - slot: collection_timeframes[3].timeframe_details
    snippet: Enrolment began on 18 July 2023 and will continue until 30  November  2026.
  - slot: collection_timeframes[1].timeframe_details
    snippet: Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023
  - slot: collection_timeframes[2].timeframe_details
    snippet: The formal data collection process began on 1 December 2023.
  - slot: distribution_dates[0].release_dates
    snippet: included in the first released data set released in  May  2024
  - slot: known_biases[0].bias_description
    snippet: Partic- ipants  are  volunteers;  therefore,  there  is  selection  bias known  as  volunteer  bias
  - slot: known_limitations[0].limitation_description
    snippet: A limitation of our biorepository is that there are a finite  number  of  samples  to  share
