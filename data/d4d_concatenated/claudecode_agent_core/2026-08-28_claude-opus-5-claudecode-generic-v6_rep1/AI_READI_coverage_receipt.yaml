  - slot: title
    snippet: AI Ready and Exploratory Atlas for Diabetes Insights (AI-READI) University of Washington
  - slot: source_caveats
    snippet: The study will collect a cross-sectional dataset of 4600 people across the US from diverse
      racial/ethnic groups
  - slot: purposes[0].description
    snippet: The purpose of this project is data generation to allow future creation of artificial intelligence/machine
      learning (AI/ML) algorithms aimed at defining disease trajectories and underlying genetic links
      in different racial/ethnic cohorts.
  - slot: collection_timeframes[5].timeframe_details
    snippet: A smaller subgroup of participants will be invited to come for a follow-up visit in year
      4 of the project (longitudinal arm of the study).
  - slot: acquisition_methods[1].description
    snippet: Cross-sectional and longitudinal observational study with data and sample collections.
  - slot: instances[0].description
    snippet: AI/ML ready data will include physical measurements, medical history, motor vehicle driving
      history, health surveys, continuous glucose monitoring, serological testing for endocrine, cardiac,
      and renal biomarkers, genome-wide polymorphism assessment, visual function testing, retinal imaging,
      ECG, cognitive testing, 24-hr activity monitoring, and environmental sensing.
  - slot: tasks[0].response
    snippet: The dataset will be specifically designed to permit downstream pseudotime manifold analysis.
      This approach has been utilized in developmental biology successfully to identify differentiation
      pathways
  - slot: data_collectors[2].collector_details
    snippet: Data collection will take place at the University of Washington (UW), the University of Alabama
      Birmingham (UAB), and the University of California San Diego (UCSD).
  - slot: sampling_strategies[0].description
    snippet: We aim to recruit approximately 1000 patients into each of the four groups.
  - slot: known_limitations[1].recommended_mitigation
    snippet: We are submitting an NIH supplement to obtain funding for translation of all study materials
      to enable recruitment and participation of Spanish-speaking participants
  - slot: sampling_strategies[0].strategies
    snippet: "No type 2 diabetes\t1000"
  - slot: known_biases[0].mitigation_strategy
    snippet: UW will concentrate in recruiting Asian>Hispanic>Black participants, while the University
      of California at San Diego site will prioritize Hispanic>Asian>Black participants, and the University
      of Alabama at Birmingham site will prioritize Black>Hispanic>Asian participants.
  - slot: subpopulations[0].identification
    snippet: All race and ethnicity information will be self-reported at the time of screening and enrollment.
  - slot: data_governance.stewardship_roles[0]
    snippet: UCSD has a health Data Oversight Committee (HDOC) that oversees data sharing with other institutions.
  - slot: acquisition_methods[0].description
    snippet: We will first screen for eligible participants using medical records data search from each
      institution including ICD diagnosis codes, race, and age.
  - slot: sampling_strategies[1].strategies
    snippet: Over the 3+ years of study recruitment, approximately 50,000 invitation letters from each
      site will be sent by both mail and email to participants identified through the electronic medical
      record search
  - slot: sampling_strategies[1].source_data
    snippet: Using the combined UW, UCSD, and UAB dataset, UAB will select a stratified sample of potential
      participants based on the sampling scheme.
  - slot: data_collectors[4].collector_details
    snippet: OHSU is responsible for uploading the combined UW, UCSD, and UAB dataset into REDCap for
