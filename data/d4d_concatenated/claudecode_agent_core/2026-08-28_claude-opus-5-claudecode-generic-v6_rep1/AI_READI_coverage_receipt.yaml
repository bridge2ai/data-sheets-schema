  - slot: human_subject_research.irb_approval
    snippet: An annual renewal application to the IRB about the status and progress of the study is required
      and due within 90 days of expiration.
  - slot: acquisition_methods[0].acquisition_details
    snippet: some data were directly observable (such as labs, vitals, and retinal imaging), whereas other
      data were reported by subjects (e.g. survey responses)
  - slot: acquisition_methods[0].was_validated_verified
    snippet: Verification of data entry was performed when possible (e.g. cross-referencing entered medications
      with medications that were physically brought in or photographed by each study participant)
  - slot: participant_compensation[0].compensation_amount
    snippet: Study subjects received a compensation of $200 for the study visit also through the grant
      funding.
  - slot: data_collectors[16].description
    snippet: Their effort was supported by the National Institutes of Health award OT2OD032644 based on
      the percentage of effort contributed
  - slot: collection_timeframes[6].timeframe_details
    snippet: The timeline for the overall project spans four years, encompassing one year dedicated to
      protocol development and training, and years 2-4 allocated for subject recruitment and data collection.
  - slot: collection_timeframes[0].timeframe_details
    snippet: For this version of the dataset, the timeframe for data collection was July 19, 2023 to May
      01, 2025.
  - slot: collection_timeframes[5].timeframe_details
    snippet: Approximately 4% of participants are expected to undergo a follow-up examination in Year
      4.
  - slot: direct_collection[0].collection_details
    snippet: The data was collected directly from participants across the three recruiting sites. Recruitment
      pools were identified by screening Electronic Health Records (EHR)
  - slot: collection_notifications[0].notification_details
    snippet: Yes, each individual was aware of the data collection, as this was not passive data collection
      or secondary use of existing data, but rather active data collection directly from participants.
  - slot: collection_consents[0].consent_details
    snippet: Informed consent to participate was required before participation in any part of the protocol
      (including questionnaires). Potential participants were given the option to read all consent documentation
      electronically (e-consent)
  - slot: informed_consent[0].consent_documentation
    snippet: The approved consent form for the principal project site University of Washington is available
  - slot: consent_revocations[0].revocation_details
    snippet: Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset.
  - slot: data_protection_impacts[0].impact_details
    snippet: No, a data protection impact analysis has not been conducted.
  - slot: at_risk_populations.special_protections
    snippet: transportation assistance (rideshare services) was offered to study participants who endorsed
      barriers to transporting themselves to study visits
  - slot: future_use_impacts[0].impact_details
    snippet: we do not currently anticipate any uses of the dataset that could result in unfair treatment
      or harm. However, there is a theoretical risk of future re-identification.
  - slot: third_party_sharing[0].is_shared
    snippet: The dataset will be distributed and be available for public use.
  - slot: distribution_formats[0].access_urls[0]
