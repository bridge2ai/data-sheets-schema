- id: c007
  status: extracted
  extracted:
  - slot: funders[0].description
    snippet: The AI-READI project is one of four Data Generation Projects (DGPs) funded by Bridge2AI (https://commonfund.nih.gov/bridge2ai),
      a new NIH Common Fund Program
  - slot: purposes[0].description
    snippet: The primary goal of AI-READI is to collect and publicly share a multimodal, AI-ready dataset
      for studying the pathogenesis and salutogenesis
  - slot: addressing_gaps[1].response
    snippet: a major barrier has been the lack of diverse datasets that are AI ready1 for training AI
      models, which the AI-READI project is designed to address.
  - slot: collection_timeframes[3].source_caveats
    snippet: AI-READI is enrolling 4,000 participants at three study sites over 4 years (2022–2026)
  - slot: acquisition_methods[0].description
    snippet: The recruitment process consists of a selection of individuals based on the available clinical
      diagnosis using ICD-10 codes and demo- graphic data from the electronic health records of study
      sites.
  - slot: raw_sources[1].raw_data_details
    snippet: Blood is being collected to establish a large repository of participant plasma, serum and
      buffy coats at the University of Alabama at Birming- ham.
  - slot: instances[0].instance_type
    snippet: which includes pre-visit questionnaires, on-site data collection and post-visit data collection
      for 10 days
  - slot: collection_timeframes[6].timeframe_details
    snippet: On-site visit (3 to 4 hours)
  - slot: distribution_dates[2].release_dates
    snippet: Data are released annually, and each version is accessible through FAIRhub.
  - slot: is_deidentified.method
    snippet: The public set is stripped of Protected Health Information (PHI), as defined by the HIPAA
      (Health Insurance Portability and Accountability Act) Privacy Rule via the “Safe Harbor” method
  - slot: is_deidentified.identifiers_removed
    snippet: as well as information related to the sex and race/ethnicity of the participants to prevent
      stigmatization of findings
  - slot: license_and_use_terms.license_terms
    snippet: shared using a new licence developed as part of this project that allows reuse for any purpose
      but includes restrictions to protect participant privacy
  - slot: external_resources[0].external_resources[1]
    snippet: https:// zenodo.org/communities/aireadi; https://github.com/AI-READI; https://aireadi.org
  - slot: conforms_to_standard[2]
    snippet: developing new standards, such as the Clinical Dataset Structure (CDS), a simple and intuitive
      way to organize clinical research datasets
  - slot: external_resources[0].external_resources[6]
    snippet: https://cds-specification.readthedocs.io
  - slot: participant_privacy[0].reidentification_risk
    snippet: To prevent reidentifi- cation attempts, we are implementing a robust data dissemination system,
      a strict licence agreement and data watermarking for both public and controlled sets.
  - slot: at_risk_populations.special_protections
    snippet: Through engagement with the Native Biodata Consortium, this project will provide a co-learning
      opportunity for understanding challenges specific to AI/AN communities
  - slot: intended_uses[1].examples
    snippet: We expect that the flagship dataset will lead to novel discoveries into the T2DM pathogenesis
      and salutogenesis
  - slot: funders[0].grants[0].description
    snippet: This work was supported by the US National Institutes of Health (NIH) through grants OT2OD032644
      and P30 DK035816.
