- id: c003
  status: extracted
  extracted:
  - slot: collection_mechanisms[1].mechanism_details
    snippet: A  12- lead  ECG  is  performed  (Philips  Pagewriter  TC30 Cardiograph,  Amsterdam,  The  Netherlands)
  - slot: collection_mechanisms[2].mechanism_details
    snippet: Peripheral  neuropathy  is  performed  using  the monofilament test11 assessing touch perception
      on both feet
  - slot: collection_mechanisms[3].mechanism_details
    snippet: A  general  cogni- tive screener is carried out using the Montreal Cognitive Assessment12
      (MoCA), administered electronically on an iPad
  - slot: collection_mechanisms[4].mechanism_details
    snippet: Photopic letter visual acuity is measured with the Electronic Visual Acuity tester13 (M&S
      Technology, Niles, Illinois)
  - slot: collection_mechanisms[5].mechanism_details
    snippet: Photopic letter contrast sensitivity is measured  with  the  Mars  chart (Mars  Perceptrix,
      Chap- paqua, New York)
  - slot: collection_mechanisms[6].mechanism_details
    snippet: Autore- fraction  data  for  each  eye  are  obtained ... using  the  autorefractor’s  standard  protocol
      (Topcon  KR  800,  Topcon  Healthcare,  Oakland,  New Jersey)
  - slot: collection_mechanisms[8].mechanism_details
    snippet: Blood  (non- fasting)  and  urine  samples  are  collected from  participants  during  the  visit.
  - slot: collection_mechanisms[8].description
    snippet: Clinical Laboratory Improvement Amendments- certified  laboratories  local  to  each  data
      collection  site  perform  complete  blood  count  (CBC) testing
  - slot: data_collectors[3].collector_details
    snippet: all other lab tests are performed by the University of Washington Nutrition and  Obesity  Research  Center  (NORC)  testing  facility
  - slot: known_limitations[0].scope_impact
    snippet: blood  deriv- atives  are  sent  to  the  biorepository  at  UAB’s  Center  for Clinical  and  Translational  Science  (CCTS)
  - slot: collection_mechanisms[9].mechanism_details
    snippet: The  retinal  imaging  protocol  is  designed  to  capture imaging  from  multiple  devices.  Both  eyes  are  imaged
      on  each  participant.
  - slot: collection_mechanisms[9].mechanism_details
    snippet: All retinal images are collected under dilated conditions, except for the Optomed
  - slot: instances[0].label_description
    snippet: Asks about social determinants of health and access to healthcare. Surveys on food and job
      insecurity, educational attainment, health insurance coverage
  - slot: anomalies[0].anomaly_details
    snippet: Marijuana use not assessed for participants living in Alabama because it is an illegal substance.
