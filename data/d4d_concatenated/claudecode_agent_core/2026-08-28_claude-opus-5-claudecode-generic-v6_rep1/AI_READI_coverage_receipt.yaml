- id: c028
  status: extracted
  extracted:
  - slot: participant_compensation[0].description
    snippet: Results obtained during the study visit may be clinically actionable, such as blood pressure
      or visual acuity/eye exam data and will be shared with the study participants in real time. Each
      participant will receive a card with these results at the end of the visit.
  - slot: participant_compensation[0].notes
    snippet: All clinical laboratory results will be uploaded on a yearly basis, and participants will
      be able to access them (but there may be a substantial lag between the study visit and the yearly
      upload).
  - slot: participant_compensation[0].description
    snippet: All abnormal laboratory results will be marked/flagged, and it will be recommended that subjects
      use the information and discuss the results with their primary care provider or specialist.
  - slot: intended_uses[1].usage_notes
    snippet: There are no plans for the researchers involved in collecting the data set to develop any
      commercial products or file for patents. However, the data set will be publicly available with a
      commercial-friendly open-source license
  - slot: participant_compensation[0].compensation_rationale
    snippet: Subjects may incur costs for transport that will not be reimbursed if transportation fees
      exceed $25.
  - slot: data_collectors[8].role
    snippet: 'Program/project manager: Oversee data collection and management of research coordinators/project
      managers'
  - slot: data_collectors[9].role
    snippet: 'Database manager: Ingest data into the Redcap database and extract for processing'
  - slot: data_collectors[10].role
    snippet: 'Research/Data scientist/Postdoctoral Fellow: Process data for release in database and development
      of standards'
  - slot: data_collectors[6].role
    snippet: 'Clinical research coordinator/study coordinator: Responsible for contacting and consenting
      the research participants, ushering participants through the research visit'
  - slot: data_collectors[11].role
    snippet: 'Software engineer: Responsible for designing, implementing, and testing the different data
      curation pipelines'
  - slot: data_collectors[12].role
    snippet: 'Cloud engineer: Responsible for cloud infrastructure customization, configuration and deployment'
  - slot: data_collectors[13].role
    snippet: 'Phlebotomist: Responsible for blood collection from research participants'
  - slot: data_collectors[15].role
    snippet: 'Domain experts: Provide guidance on issues arising from collecting data from each domain
      of medicine such as endocrinology and cardiology.'
  - slot: known_limitations[4].limitation_description
    snippet: Due to delay in obtaining the laboratory results and lack of standard interpretation methods
      for other data (e.g., imaging), it is unlikely that these data would be clinically actionable.
