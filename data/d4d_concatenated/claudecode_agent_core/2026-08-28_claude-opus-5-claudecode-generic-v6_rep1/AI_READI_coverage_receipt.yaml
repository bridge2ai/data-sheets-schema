  - slot: purposes[0].response
    snippet: The purpose for creating the dataset was to enable future generations of artificial intelligence/machine
      learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including
      salutogenic pathways to return to health.
  - slot: tasks[0].description
    snippet: The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
      manifolds and various applications in artificial intelligence.
  - slot: discouraged_uses[0].discouragement_details
    snippet: The AI READI dataset License imposes certain restrictions on the usage of the data. The restrictions
      are described in the License files available at https://doi.org/10.5281/zenodo.17555036.
  - slot: creators[0].description
    snippet: This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI
      Consortium. Details about each member and their institutions are available on the project website
      at https://aireadi.org.
  - slot: funders[0].description
    snippet: The creation of the dataset was funded by the National Institutes of Health (NIH) through
      their Bridge2AI Program (https://commonfund.nih.gov/bridge2ai).
  - slot: funders[0].grants[0].source_caveats
    snippet: The grant number is OT2ODO32644 and more information about the funding is available at https://reporter.nih.gov/search/T-mv2dbzIEqp9V6UJjHpgw/project-details/10885481
  - slot: data_collectors[16].description
    snippet: There is a wide range of experience within the project team, including senior, mid-career,
      and early career faculty members as well as clinical research coordinators, staff, and interns.
  - slot: instances[0].instance_type
    snippet: Each instance represents an individual patient.
  - slot: sampling_strategies[0].is_sample
    snippet: The dataset contains all possible instances. More specifically, the dataset contains data
      from all participants who have been enrolled
  - slot: instances[0].description
    snippet: Multiple modalities of data are collected for each participant, including survey data, clinical
      data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable
      activity monitor data.
  - slot: is_tabular
    snippet: These encompass tabular data, imaging data, and physiological signal/waveform data. There
      is no unstructured text data included in this dataset.
  - slot: missing_data_documentation[0].missing_data_causes
    snippet: Yes, not all modalities are available for all participants. Some participants elected not
      to participate in some study elements.
  - slot: missing_data_documentation[0].missing_data_patterns
    snippet: In a few cases, the data collection device did not have any stored results or was returned
      too late to retrieve the results (e.g. battery died, data was lost).
  - slot: relationships[0].relationship_details
    snippet: all instances are part of the same prospective data generation project (AI-READI). There
      is currently only one visit per participant.
  - slot: anomalies[2].anomaly_details
    snippet: In cases of using wearables, improper use, technical failure such as battery failure or system
      malfunction are expected. In cases of imaging data, patient uncooperation, noise that may obscure
      the images
  - slot: external_resources[0].future_guarantees
    snippet: The dataset is self-contained but does rely on the dataset documentation for users requiring
      additional information about the provenance of the dataset.
  - slot: external_resources[0].restrictions[0]
    snippet: The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated
      with its use.
  - slot: confidential_elements[0].confidentiality_details
    snippet: No, the dataset does not contain data that might be considered confidential. No personally
      identifiable information is included in the dataset.
  - slot: content_warnings[0].content_warnings_present
    snippet: Does the dataset contain data that, if viewed directly, might be offensive, insulting, threatening,
      or might otherwise pose any safety risk
  - slot: sensitive_elements[0].sensitivity_details
    snippet: the controlled access dataset will contain data regarding racial and ethnic origins, location
      (5-digit zip code), as well as motor vehicle accident reports
  - slot: collection_mechanisms[14].name
    snippet: a custom-designed sensor unit called the LeeLab Anura
  - slot: collection_mechanisms[0].mechanism_details
    snippet: 'Blood pressure devices used for the study across the various data acquisition sites are:
      OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor,
      and Welch Allyn 6000 series Vital signs monitor'
  - slot: collection_mechanisms[4].mechanism_details
    snippet: M&S Technologies EVA device to test visual acuity. The test is administered at a distance
      of 4 meters from a touch-screen monitor that is 12x20 inches.
  - slot: collection_mechanisms[7].mechanism_details
    snippet: 'Lensometer devices used at data acquisition sites across the study include: NIDEK LM-600P
      Auto Lensometer, Topcon-CL-200 computerized Lensometer, and Topcon-CL-300 computerized Lensometer'
  - slot: collection_mechanisms[9].mechanism_details
    snippet: The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the
      ocular fundus. It has a 50° field of view, 5 Mpix sensor
  - slot: anomalies[3].anomaly_details
    snippet: As it becomes challenging to get a good view because of the patients not being dilated and
      the handheld nature of this imaging modality, the quality of the images vary from patient to patient
  - slot: collection_mechanisms[10].mechanism_details
    snippet: The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system that combines optical coherence
      tomography (OCT) with retinal angiography.
  - slot: collection_mechanisms[3].description
    snippet: The Montreal Cognitive Assessment (MoCA) is a simple, in-office screening tool that helps
      detect mild cognitive impairment and early onset of dementia.
  - slot: known_biases[2].bias_description
    snippet: Factors influencing the generalization of derived models include the predominantly urban
      and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds.
  - slot: known_limitations[3].limitation_description
    snippet: The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races/ethnicities such as Pacific Islanders and Native Americans.
  - slot: known_biases[3].mitigation_strategy
    snippet: Uniform data collection protocols were implemented for all subjects, irrespective of their
      race/ethnicity, biological sex, or diabetes severity, across all study sites.
  - slot: subpopulations[0].source_caveats
