notes: >-
  The pack samples slot-002 through slot-051; there is no slot-001, so 50 slot items and one chunk
  item were answered. Two receipts the validator verified verbatim are bare repository names
  ('CTP-deid Public', 'privacy_scan_tool') receipting de-identification and privacy claims — a
  snippet-match the validator cannot distinguish from support, as designed. The webinar's
  modality table (lines 260-375) is a degraded PDF extraction; the record flags this in its
  record-level source_caveats yet slot-014 still asserts the 'Planned' column against the wrong
  modalities, contradicting the record's own instance descriptions. The `status` value is a
  website maintenance banner copied into a dataset-status slot.
