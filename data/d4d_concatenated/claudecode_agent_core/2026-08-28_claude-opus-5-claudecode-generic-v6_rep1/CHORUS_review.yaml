notes: >-
  Adverse findings are slot-002 (repository listing read as an applied privacy
  technique), slot-014 (the 'Planned' cells of the degraded webinar table read as
  the published-metadata-schema column, contradicting lines 338-339, 343-344 and
  374-375 and the record's own instances[7], [9], [10]), slot-030 (scope_impact is an
  inferred consequence with no passage), and rules 01, 06 and 07 (the CTP-deid clause
  inferred from a bare repository name at line 1522; sampling_strategies naming no
  strategy; the NIH award period standing in for the collection timeframe). The
  record is otherwise carefully grounded and its deliberate omissions are well argued.
  Instrument findings for the receipt validator: (a) the receipt entries
  'is_deidentified.method: CTP-deid Public' (c008) and 'participant_privacy[0].privacy_techniques:
  privacy_scan_tool ...' (c007) verify as verbatim snippets while the passage is a
  bare repository name — a verbatim match cannot see that the snippet carries no
  predicate; (b) c002's receipt for collection_timeframes[0].start_date quotes both
  the start and end lines, yet the pack lists end_date as receiptless, so the
  pack's receipted/receiptless split is by exact slot path and a receipt covering
  two sibling slots under one path leaves the sibling looking unreceipted.
  Procedure notes from this first use: (1) the agent definition says to 'read the
  instruction in full first', but the pack gives the instruction only as a basis
  line, hash and char count — no path and no text; I read
  src/download/prompts/d4d_generic_arm_prompt_v6.md (the file the record's spec
  names, sha256 57ac2030...) as the nearest stand-in, which is the template rather
  than the substituted instruction. The pack should write the re-rendered text to a
  file or include it. (2) The agent definition says the pack includes a 'schema
  digest' with slot descriptions; the pack has none, so descriptions were read from
  data_sheets_schema_all.yaml via SchemaView as the lead directed. (3) The pack's
  chunk line spans stop at c007 (1113-1512) although the manifest has 8 chunks
  (c008 = 1513-1698); the c008 span appears nowhere in the pack because no sampled
  item cites it, so a reviewer cannot tell the bundle's length from the pack alone.
  (4) Verdict vocabulary gaps: the slot_receiptless kind has no verdict for a value
  that is a reasonable inference from stated lines rather than a stated fact
  (slot-030 was marked not_in_bundle, slot-044 cannot_tell, slot-050 exempt_by_nature
  — three different verdicts for the same underlying situation, an interpretive slot
  with no passage); and slot_receipted has no verdict for 'passage supports the text
  but the slot's question is not answered' (slot-022), which I marked supported and
  carried to rule-06. (5) The pack item slot-007 cites a snippet (line 1059 tagline)
  that does not contain the value 'CHoRUS'; the sampled receipt is weak rather than
  wrong, and there is no verdict between supported and unsupported for that. (6)
  The pack does not carry the record's values, so every item required opening the
  full record; including the value under each slot item would remove one read per
  item. (7) The reconciliation report's line count for the bundle (1698) and chunk
  count (8) were the only place the bundle's extent was stated.
