distributions:
- description: Features derived from the raw audio waveforms. Dense binary files are made
    available as Parquet, an open-source column-oriented data file format; each element of
    a parquet file carries a participant identifier, a session identifier, the task performed,
    the number of time frames for that feature, and the tensor data. Each file has an accompanying
    JSON data dictionary with the same file stem describing the feature and the processing
    done to prepare it.
  id: doi:10.13026/37yb-1t42#features
  name: Derived audio features
  path: features
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT (n=29278).
  id: doi:10.13026/37yb-1t42#features-torchaudio-spectrogram
  name: torchaudio_spectrogram.parquet
  path: features/torchaudio_spectrogram.parquet
- description: Mel spectrograms of dimension 60xT generated with a 25 ms window size, 10 ms
    hop length, a 400-point FFT and 60 Mel bins (n=29278).
  id: doi:10.13026/37yb-1t42#features-torchaudio-mel-spectrogram
  name: torchaudio_mel_spectrogram.parquet
  path: features/torchaudio_mel_spectrogram.parquet
- description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters
    as the Mel spectrograms (n=29278).
  id: doi:10.13026/37yb-1t42#features-torchaudio-mfcc
  name: torchaudio_mfcc.parquet
  path: features/torchaudio_mfcc.parquet
- description: Detected pitch (fundamental frequency) over time, of dimension T, with a minimum
    and maximum pitch of 80 and 500 respectively (n=32522).
  id: doi:10.13026/37yb-1t42#features-torchaudio-pitch
  name: torchaudio_pitch.parquet
  path: features/torchaudio_pitch.parquet
- description: 'Estimated electromagnetic articulography produced by a deep learning model,
    of dimension Tx12, where the twelve values are the X and Y positions of six articulators:
    tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip (n=28640).'
  id: doi:10.13026/37yb-1t42#features-sparc-ema
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
- description: Estimated loudness based on the average absolute amplitude of the audio waveform,
    of size T, using 20 ms windows (n=31855).
  id: doi:10.13026/37yb-1t42#features-sparc-loudness
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
- description: Estimated periodicity, the confidence of pitch presence, derived from the audio
    using 20 ms windows, of dimension T (n=31872).
  id: doi:10.13026/37yb-1t42#features-sparc-periodicity
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
- description: Estimated fundamental frequency of the audio signal, computed with a different
    algorithm from torchaudio_pitch, with a range of 50 to 550 Hz and dimension T (n=31872).
  id: doi:10.13026/37yb-1t42#features-sparc-pitch
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
- description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a
    dimension of 40xT with a frame rate of 100 Hz (n=29289).
  id: doi:10.13026/37yb-1t42#features-ppgs
  name: ppgs.parquet
  path: features/ppgs.parquet
- description: Features derived from the raw audio, with one feature per audio recording and
    one row per unique recording, drawn from openSMILE, Praat, parselmouth and torchaudio.
  format: TSV
  id: doi:10.13026/37yb-1t42#features-static-features
  name: static_features.tsv
  path: features/static_features.tsv
- description: One feature per audio recording derived from the raw audio, related to quality
    control metrics. Added in version 3.1.0.
  format: TSV
  id: doi:10.13026/37yb-1t42#features-audio-quality-metrics
  name: audio_quality_metrics.tsv
  path: features/audio_quality_metrics.tsv
- description: Organized information collected from the participant or another individual
    during their encounter, arranged into subfolders for confounders, demographics, diagnosis,
    enrollment, questionnaire and task. Each tab-separated data file is paired with a JSON
    data dictionary whose keys match the column names; each dictionary value gives a one-sentence
    description of the column, the question asked of the participant where one applies, and
    the data type of the response. The diagnosis subfolder holds one file pair per condition,
    including airway stenosis, amyotrophic lateral sclerosis, anxiety, benign lesions, bipolar
    disorder, cognitive impairment, control, COPD and asthma, depression, glottic insufficiency,
    laryngeal cancer, laryngeal dystonia, laryngitis, muscle tension dysphonia, Parkinson's
    disease, precancerous lesions, unexplained chronic cough and unilateral vocal fold paralysis.
    The questionnaire subfolder holds the validated instruments, including the Voice Handicap
    Index-10, PHQ-9, GAD-7, PANAS, a custom affect scale, DSM-5 adult, PTSD adult, ADHD adult,
    the Dyspnea Index, the Leicester Cough Questionnaire, productive vocabulary and voice
    perception.
  id: doi:10.13026/37yb-1t42#phenotype
  name: Phenotypic data
  path: phenotype
- description: A binary Parquet file and its corresponding data dictionary carrying specific
    information about each recording, including task instructions and prompts and information
    about the microphone used and its gain. Added in version 3.1.0.
  id: doi:10.13026/37yb-1t42#metadata
  name: Recording metadata
  path: metadata
purposes:
- name: Voice as a biomarker of health
  response: To generate a large-scale, ethically sourced voice, speech and cough database
    linked to health metadata in order to support AI-driven research, and to integrate the
    use of voice as a biomarker of health in clinical care.
- name: Flagship publicly available dataset
  response: To create a flagship, standardized and ethically sourced dataset of voices linked
    to health information to fuel research and discovery in voice biomarkers, and to make
    it publicly available.
  source_caveats: The project documentation states a target of 10,000 voices and the IRB protocol
    a sample size of 30,000 participants; the audiomics white paper states a primary deliverable
    of 30,000 human voices. The two documents that disagree share a rank in the source manifest,
    so no single figure is selected.
- name: Enable AI and machine learning research on voice
  response: To enable the development, benchmarking or validation of clinically applicable
    machine-learning models for diagnosing a wide range of health conditions using voice data,
    including vocal pathologies and neurological, psychiatric and respiratory disorders.
tasks:
- name: Data acquisition module
  response: To build a multi-modal, multi-institutional, large scale, diverse and ethically
    sourced human voice database linked to other biomarkers of health that is AI/ML friendly
    to fuel voice AI research.
- name: Standards module
  response: To introduce the field of acoustic biomarkers by developing new standards of acoustic
    and voice data collection and analysis for voice AI research.
- name: Tool development and optimization
  response: To develop software and cloud infrastructure for automated voice data collection
    through a smartphone application allowing non-invasive, user-friendly, high quality voice
    data collection while minimizing human manipulation, and to implement federated learning
    technology so that multi-institutional data can be analyzed while minimizing data sharing.
- name: Ethics module
  response: To develop new guidelines for consenting to voice data collection, voice data
    sharing and utilization in the context of voice AI technology, and to provide normative
    guidance on ethical and trustworthy issues arising from voice data generation through
    to clinical adoption.
- name: Disease screening, diagnosis and monitoring
  response: To build predictive models that assist in screening, diagnosis and treatment of
    a broad range of diseases with unmet clinical needs.
addressing_gaps:
- name: Absence of large, diverse, well-documented voice datasets
  response: Previous studies on machine learning-based voice diagnosis produced promising
    results, but their sample sizes were too small or they lacked the key metadata needed
    for training robust, clinically useful models. There is a crucial need for large datasets
    that capture diverse populations and disease statuses alongside other established physiologic
    biomarkers.
- name: Lack of standards for voice data collection
  response: Comparing studies and pooling data is challenging because of the lack of standards
    in how voice and speech data are measured and collected. The dataset addresses this by
    aiming for interoperability through new bioinformatics standards for voice data.
- name: Private industry datasets that cannot be audited
  response: Within industry, voice datasets are often private, limiting the ability to audit
    machine-learning models and the accuracy of training data labels, and preventing external
    verification of fair representation of diverse populations.
