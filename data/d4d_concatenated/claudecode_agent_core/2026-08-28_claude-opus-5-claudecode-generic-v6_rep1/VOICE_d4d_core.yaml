title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
version: 3.1.0
id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
description: 'Bridge2AI-Voice is a large, ethically sourced, demographically diverse voice
  dataset linked to health information, released by the NIH Bridge2AI initiative. The public
  release carries features derived from the audio waveforms — spectrograms, Mel spectrograms,
  Mel-frequency cepstral coefficients, articulatory and phonetic features — rather than the
  original recordings, alongside detailed participant metadata: clinical diagnoses across
  voice, neurological, mood and respiratory conditions, validated questionnaires, and demographics.
  Version 3.1.0 contains data for 833 participants collected across five sites in North America.
  The dataset is structured to be Findable, Accessible, Interoperable and Reusable (FAIR).
  Raw audio is not part of the PhysioNet release and is disseminated separately under controlled
  access to protect participant privacy.'
source_caveats: 'Several source statements disagree and the disagreements are recorded rather
  than silently resolved. (1) Target size: the project documentation (tier 2) states a flagship
  dataset of 10,000 voices and an anticipated enrollment count of 10,000 by 2027, while the
  IRB protocol (tier 2, same rank) states a sample size of 30,000 participants reached through
  collaborating institutions and existing cohorts, and the audiomics white paper (tier 3)
  states a primary deliverable of 30,000 human voices; because the two tier-2 sources share
  a rank the ranking cannot decide, so both figures are stated. (2) Grant identifier surface
  forms: the sources give OT2OD032720 as the core project number, 3OT2OD032720-01S1 on the
  PhysioNet releases, 3OT2OD032720-01S3 on the NIH RePORTER page, 1OT2OD032720-01 in the feasibility
  publication, and "3Tf-OTOD03272001S2" and "3TF-OT2ActfOD032720Projectf01S1" in the project
  documentation; the core project number and the release-specific supplement number are recorded
  and the variants noted. (3) Affiliations: the feasibility publication''s consortium member
  list places Vardit Ravitsky at the University of Montreal and Frank Rudzicz at Dalhousie
  University, while the project documentation and IRB protocol (both tier 2, higher than the
  publication''s tier 3) place them at The Hastings Center and the University of Toronto respectively;
  the tier-2 values are stated. (4) The project documentation spells the SickKids investigator
  "Jennifer Sui" while the PhysioNet release author lists (tier 1) spell it "Jennifer Siu";
  the tier-1 spelling is used. (5) Project website: the v1.1 PhysioNet page gives https://docs.b2ai-voice.org
  and the v3.0.0 and v3.1.0 pages give https://b2ai-voice.org/; the current release''s value
  is used. (6) No personal identifier (ORCID) or organization registry identifier (ROR) appears
  anywhere in the declared bundle, so no Person object is emitted — the schema requires an
  identifier on Person and supplying one from outside the evidence would be an unsupported
  claim. Creator names and affiliation names are recorded instead. (7) Contact email addresses
  in the project documentation are redacted in the preprocessed bundle; only the addresses
  the PhysioNet pages and the IRB protocol state in the clear are recorded. (8) The 47-participant
  feasibility study described in the feasibility publication tested the data collection application
  and explicitly collected no audio data; its participants are not instances of this dataset
  and its figures are not recorded as dataset composition.'
