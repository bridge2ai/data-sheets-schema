id: https://doi.org/10.18130/V3/HIGT4C
name: CM4AI June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI; cm4ai.org), the
  Functional Genomics Grand Challenge in the U.S. National Institutes of Health Bridge2AI program.
  CM4AI generates multi-modal data including protein-protein interaction (PPI), spatial localization,
  and genetic perturbation data in MDA-MB-468 breast cancer cells (with and without paclitaxel or
  vorinostat treatment) and KOLF2.1J induced pluripotent stem cells (with and without
  differentiation). The Dataverse release description states that this Beta release comprises:
  Perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment and for
  undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells with
  and without treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron progenitor cells
  (NPCs), neurons, and cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer cells with treatment;
  and immunofluorescence (IF) images in MDA-MB-468 breast cancer cells with and without treatment.
  The deposited file inventory does not contain an MDA-MB-468 Perturb-seq file and the External Data
  Links mark that resource as embargoed; see the anomalies section. Output data are packaged with
  provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE
  framework. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham,
  Simon Fraser University, and the Hastings Center.
