conforms_to_schema: >-
  Dataset and data-element schemas are expressed in JSON-Schema as mini-data-dictionary descriptions
  resolvable from the provenance graph metadata. Provenance is expressed in the EVI Evidence Graph
  Ontology and serialized as JSON-LD (using Schema.org and EVI vocabularies) and RDF-XML.
was_derived_from: >-
  Two ethically sourced human cell lines: MDA-MB-468 (RRID:CVCL_0419), a triple-negative breast
  cancer line established from a metastatic pleural effusion, available from ATCC; and KOLF2.1J
  (RRID:CVCL_B5P3), an induced pluripotent stem cell line available from the Human Induced
  Pluripotent Stem Cells Initiative (HipSci) resource. iPSC-derived neural progenitor cells,
  neurons, and cardiomyocytes were generated by differentiation of KOLF2.1J.

