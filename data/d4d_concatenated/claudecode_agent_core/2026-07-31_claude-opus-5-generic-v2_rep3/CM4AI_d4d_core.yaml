purposes:
  - name: Deliver AI-ready machine-readable maps of human cell architecture
    description: >-
      CM4AI's stated objective is to deliver machine-readable hierarchical maps of cell architecture
      as AI-Ready data produced from multimodal interrogation of chromatin modifiers, metabolic
      enzymes, and other proteins involved in cancer, neuropsychiatric, and cardiac disorders in
      disease-relevant cell lines under perturbed and unperturbed conditions.
  - name: Map the spatiotemporal architecture of human cells for interpretable genotype-phenotype learning
    description: >-
      The NIH RePORTER project abstract states that the CM4AI data generation project seeks to map
      the spatiotemporal architecture of human cells and use these maps toward the grand challenge
      of interpretable genotype-phenotype learning, addressing the deficiency that machine learning
      models in genomics and precision medicine are often "black boxes" predicting phenotypes from
      genotypes without understanding the mechanisms by which such translation occurs.
  - name: Stimulate research and development in "visible" machine learning systems
    description: >-
      The data are intended to broadly stimulate research and development in "visible" machine
      learning systems informed by multi-scale cell and tissue architecture, which are not black
      boxes but are built directly on knowledge maps of cell and tissue architecture.
  - name: Ethically leverage state-of-the-art tools to enable transformative biomedical AI
    description: >-
      At a strategic level CM4AI aims to ethically leverage the most state-of-the-art computational
      and experimental tools in biomedical science to enable a new generation of transformative
      artificial intelligence research to benefit humanity, with datasets and software available to
      the research community under minimally restrictive terms consistent with ethical guidelines,
      researcher attribution, and research integrity.
  - name: Demonstrate an end-to-end AI-readiness standard for functional genomics data
    description: >-
      A stated purpose is to implement a standards data management approach based on FAIR access and
      software principles, with deep provenance and replication packages for representation of cell
      maps and their underlying datasets.

tasks:
  - name: Multimodal cell map construction
    description: >-
      Integration of protein localization and protein interaction data using self-supervised
      embedding approaches from deep learning, followed by algorithmic community detection at
      multiple resolutions to generate a hierarchy of protein assemblies. Cell maps are hierarchical
      directed acyclic graphs in which each node represents an assembly of proteins in proximity at
      a given scale, spanning from large assemblies representing cell compartments to small
      assemblies of proteins in close proximity.
  - name: Visible neural network (VNN) development
    description: >-
      Cell maps provide a foundation for AI tools implementing "visible machine learning" or
      "visible neural networks" to interrogate how protein assemblies in the cell affect cell-level
      phenotype predictions.
  - name: Interpretation of genetic variants and mutations
    description: >-
      Cell maps provide a foundation for downstream applications in human genomics, including
      interpretation of genetic variants and mutations.
  - name: Mapping transcriptional and fitness phenotypes from genetic perturbation
    description: >-
      Genome-scale CRISPR interference perturbation screens map transcriptional and fitness
      phenotypes associated with targeted genes in the cell lines under study.
  - name: Proteome-wide protein complex and interaction mapping
    description: >-
      Size-exclusion chromatography coupled to mass spectrometry is applied for proteome-wide
      complex and interaction mapping, and affinity purification mass spectrometry is applied as an
      orthogonal mass spectrometry based approach.

addressing_gaps:
  - name: Opacity of machine learning models in genomics and precision medicine
    description: >-
      In genomics and precision medicine, machine learning models are often "black boxes",
      predicting phenotypes from genotypes without understanding the mechanisms by which such
      translation occurs. CM4AI was launched to address this deficiency by generating a resource of
      matched data and tools enabling the creation of "visible" ML systems.
  - name: Absence of ethical, FAIR, AI-ready functional genomics data
    description: >-
      The CM4AI preprint argues that significant requirements are placed on datasets used to train
      and analyse with AI/ML models, and that datasets meeting these requirements ("AI-Ready") must
      be FAIR, provenanced, characterized, explainable, and ethical. CM4AI addresses the gap by
      producing datasets that satisfy these criteria end to end.
  - name: Need for training data spanning matched modalities in disease-relevant contexts
    description: >-
      CM4AI generates deep multi-modal data for a shared list of proteins across all cell types and
      treatment conditions, described on cm4ai.org as being undertaken to achieve an unparalleled
      level of biological insight; matched interaction, localization, and perturbation data in the
      same disease-relevant cellular contexts were not previously available.
  - name: Gap in the biomedical AI/ML workforce
    description: >-
      The CM4AI preprint states that to recruit and prepare a biomedical workforce adept at both the
      data and life sciences, new training that will allow researchers to leverage the data sets
      produced by Bridge2AI and other programs is needed, and that the Skills and Workforce
      Development module identified gaps in training of the functional genomic and biomedical AI/ML
      workforce.

intended_uses:
  - name: AI-ready datasets to support research in functional genomics
    description: Listed under "Intended Use" on the Dataverse record for this release.
  - name: AI model training
    description: Listed under "Intended Use" on the Dataverse record for this release.
  - name: Cellular process analysis
    description: Listed under "Intended Use" on the Dataverse record for this release.
  - name: >-
      Study of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations
    description: >-
      Listed under "Intended Use" on the Dataverse record for this release. The release supports
      this through paired treated and untreated MDA-MB-468 breast cancer conditions and
      undifferentiated versus differentiated iPSC states.

other_tasks:
  - name: Bioinformatics analysis of the individual modality datasets
    description: >-
      The Dataverse record states that the current release is most suitable for bioinformatics
      analysis of the individual datasets, an application distinct from the integrated cell mapping
      that motivated their generation.
  - name: Integrative structure modeling of protein assemblies
    description: >-
      The CM4AI preprint reports that the project is exploring the feasibility of integrative
      structure modeling of MuSIC communities, ranking communities by the amount of available
      structural information from the Protein Data Bank, AlphaFold Protein Structure Database,
      crosslinking mass spectrometry, and prediction of disordered sequence segments, and performing
      integrative structure modeling of top-ranked communities using the Integrative Modeling
      Platform.
  - name: Construction of new cell maps for other cell types and disease states
    description: >-
      The Cell Mapping Toolkit is described as providing a flexible and generalizable framework for
      cell map construction, enabling researchers to integrate and construct cell maps via multiple
      input modalities, including for new subtypes and disease states.

prohibited_uses:
  - name: Clinical decision-making and patient care
    description: >-
      Stated verbatim under "Prohibited Uses" on the Dataverse record: these laboratory data are not
      to be used in clinical decision-making or in any context involving patient care without
      appropriate regulatory oversight and approval.
  - name: Commercial use without a separate negotiated license
    description: >-
      The dataset is licensed under Creative Commons Attribution-NonCommercial-ShareAlike 4.0
      International, whose NonCommercial term states that you may not use the material for
      commercial purposes, where a commercial use is one primarily intended for commercial advantage
      or monetary compensation. The CM4AI preprint further states that commercial use requires a
      separate license negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending
      upon the specific data package in question).
  - name: Redistribution of adaptations under different license terms
    description: >-
      Under the ShareAlike term of CC BY-NC-SA 4.0, if you remix, transform, or build upon the
      material you must distribute your contributions under the same license as the original, and
      you may not apply legal terms or technological measures that legally restrict others from
      doing anything the license permits.

discouraged_uses:
  - name: Treating this interim Beta release as a complete or final CM4AI resource
    description: >-
      The Dataverse record states that this is an interim release, that these data are not yet in
      completed final form, and that computed cell maps are not included; it also states the dataset
      will be regularly updated and augmented through the end of the project.
  - name: Analysis without relevant domain expertise
    description: >-
      Listed under "Limitations" on the Dataverse record: the data require domain expertise for
      meaningful analysis.
  - name: Use as a source of predicted or computed cell maps
    description: >-
      Listed under "Limitations" on the Dataverse record: the release does not contain predicted
      cell maps, which will be added in future releases.

future_use_impacts:
  - name: Anticipated benefit to interpretable biomedical AI and human health
    description: >-
      The CM4AI preprint states the intention that CM4AI become a highly transformative platform for
      ethical, explainable, and interpretable biomedical AI, deepen understanding of processes of
      human disease and health, help train a new generation of researchers, enable development of
      novel cures, and assist researchers and clinicians in equitably improving human lives.
  - name: Anticipated risk from downstream AI systems, addressed through value-sensitive governance
    description: >-
      The CM4AI Ethics module employs a methodology inspired by Value-Sensitive Design to create
      normative standards and expectations for responsible design of datasets and AI technologies,
      and is formulating the CM4AI Life Cycle, a framework designed to elucidate governance
      milestones throughout the data generation and AI system development processes. The stated
      ethical requirement involves anticipating potential applications of the data and derived AI/ML
      systems, integrating them into data governance frameworks to optimize benefits and mitigate
      potential risks, and promoting their use for the collective good.
  - name: Risk of inappropriate clinical extrapolation
    description: >-
      Because the release states that these laboratory data are not to be used in clinical
      decision-making or in any context involving patient care without appropriate regulatory
      oversight and approval, a foreseeable adverse consequence of future use is premature clinical
      application of models trained on these data.
  - name: Risk of over-generalization from a narrow cellular sample
    description: >-
      The Dataverse record notes that the data derive from commercially available de-identified
      human cell lines and do not represent all biological variants which may be seen in the
      population at large, so models built on these data may not generalize across human biological
      variation.

known_limitations:
  - name: Interim release
    description: Listed under "Limitations" on the Dataverse record - this is an interim release.
  - name: Predicted cell maps absent
    description: >-
      Listed under "Limitations" on the Dataverse record - the release does not contain predicted
      cell maps, which will be added in future releases.
  - name: Suited to single-modality analysis rather than integrated analysis
    description: >-
      Listed under "Limitations" on the Dataverse record - the current release is most suitable for
      bioinformatics analysis of the individual datasets.
  - name: Requires domain expertise
    description: >-
      Listed under "Limitations" on the Dataverse record - the data require domain expertise for
      meaningful analysis.
  - name: Scope restricted to two parental cell lines and a defined perturbation panel
    description: >-
      The data are confined to MDA-MB-468 triple-negative breast cancer cells under untreated,
      paclitaxel, and vorinostat conditions, and to KOLF2.1J iPSCs together with iPSC-derived neural
      progenitor cells, neurons, and cardiomyocytes. No other tissue, donor, or disease context is
      represented.

known_biases:
  - name: Cell-line derivation bias
    description: >-
      Listed under "Potential Sources of Bias" on the Dataverse record - data in this release were
      derived from commercially available de-identified human cell lines.
  - name: Limited representation of population biological variation
    description: >-
      Listed under "Potential Sources of Bias" on the Dataverse record - the data do not represent
      all biological variants which may be seen in the population at large.
  - name: Single-donor origin of each cell line
    description: >-
      Each parental line traces to one donor: MDA-MB-468 to a 51-year-old Black female with a
      metastatic mammary adenocarcinoma, and KOLF2.1J to a healthy male Northern European donor.
      Demographic and genetic diversity across the dataset is therefore bounded by two individuals.
  - name: Target-selection bias in the targeted modalities
    description: >-
      The CM4AI objective statement scopes multimodal interrogation to 100 chromatin modifiers and
      100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders, so proteins
      outside these functional classes and disease associations are less represented in the targeted
      interaction and imaging modalities. This scoping does not apply uniformly across the release:
      the deposited CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs is expressed genome-scale,
      covering 11,739 targeted genes, and the SEC-MS datasets are described on cm4ai.org as
      capturing approximately 7,000 proteins.

anomalies:
  - name: Release description asserts Perturb-seq content absent from the deposited file inventory
    description: >-
      The June 2026 Dataverse description states that the release includes "Perturb-seq data for
      MDA-MB-468 breast cancer cells +/- treatment", but the file listing for the same record
      contains only cm4ai_perturb-seq_KOLF2_cell_atlas.zip and cm4ai_perturb-seq_KOLF2_raw_sra.zip,
      with no MDA-MB-468 Perturb-seq file. The External Data Links section of the same record marks
      "Perturb-seq data in MDA-MB-468 breast cancer cells (+/- treatment)" as Embargoed. The
      description text and the deposited inventory therefore disagree within a single source; both
      statements are recorded here without resolution.
  - name: Divergent reported protein counts for the immunofluorescence imaging data
    description: >-
      Sources in the bundle disagree on how many proteins the MDA-MB-468 immunofluorescence image
      sets cover. The March 2025 release (doi 10.18130/V3/B35XWX) file descriptions state 563
      proteins of interest for the untreated, paclitaxel, and vorinostat image sets. The June 2025
      release (doi 10.18130/V3/F3TD5R) and October 2025 release (doi 10.18130/V3/K7TGEM) file
      descriptions state 464 proteins of interest for the same three image sets. The cm4ai.org data
      releases page, describing the TNBC flagship dataset, states IF images for 523 proteins. The
      June 2026 release file listing carries no per-file protein count. All three figures are
      recorded here without resolution.
  - name: Release date inconsistency on the CM4AI data releases page
    description: >-
      The curation note accompanying the cm4ai.org data releases page records that the page labels
      doi 10.18130/V3/HIGT4C as the June 2026 release but displays a release date of June 17, 2025,
      whereas the official Dataverse metadata reports a publication date of 2026-06-17 and a version
      2 release time of 2026-07-15T20:28:19Z.
  - name: Portal availability statements not matching the current release contents
    description: >-
      The cm4ai.org data releases page lists AP-MS interactomes for the TNBC flagship dataset as
      "coming soon", while the June 2026 Dataverse release includes AP-MS data files for MDA-MB-468
      cells treated with paclitaxel and with vorinostat. The same page lists IF images for the iPSC
      flagship dataset as "coming soon", and no iPSC IF image files appear in the June 2026 release
      file listing.
  - name: Immunofluorescence image file checksums differ from the preceding release
    description: >-
      The three MDA-MB-468 immunofluorescence archives in the June 2026 release carry filenames
      identical to those in the October 2025 release but different MD5 checksums (for example
      cm4ai_ifimages_MDA-MB-468_untreated.zip is a98affcc05429650c6bb3906cd836d55 in the October
      2025 release and 6d066e6b9d762284c6aa5d0b44565568 in the June 2026 release), with displayed
      sizes identical to one decimal place (4.6 GB in both). The bundle does not state what changed
      between them, and the displayed sizes are rounded rather than exact byte counts.
  - name: Data Creation Date invariant across four successive releases
    description: >-
      The Dataverse citation metadata records a Data Creation Date of 2025-02-27 and a Deposit Date
      of 2025-02-27 identically on the March 2025, June 2025, October 2025, and June 2026 release
      records, notwithstanding that files in the later records were published as late as 2026-07-15.
      The field appears to be carried forward rather than specific to the content of each release.

missing_data_documentation:
  - name: Temporary pre-publication embargo on some component datasets
    description: >-
      The Dataverse record states under "Completeness" that some datasets are under temporary
      pre-publication embargo. Under "External Data Links", the Perturb-seq data in KOLF2.1J iPSCs
      (undifferentiated) and the Perturb-seq data in MDA-MB-468 breast cancer cells (with and
      without treatment) are both marked "Embargoed" rather than carrying a repository link.
  - name: Incomplete overlap of interrogated protein sets across modalities
    description: >-
      The Dataverse record states under "Completeness" that the protein-protein interaction
      (SEC-MS), protein localization (IF imaging), and CRISPRi Perturb-seq data interrogate sets of
      proteins which incompletely overlap. Analyses requiring the same protein to be present in all
      three modalities will therefore encounter systematic missingness.
  - name: Computed cell maps not included
    description: >-
      The Dataverse record states under "Completeness" that computed cell maps are not included in
      this release, and under "Limitations" that predicted cell maps will be added in future
      releases. The integrated hierarchical cell maps that are the project's principal deliverable
      are therefore absent from the deposited files.
  - name: Immunofluorescence imaging limited to the cancer cell line
    description: >-
      The release description lists IF images only for MDA-MB-468 breast cancer cells with and
      without treatment; no iPSC or iPSC-derived cell type IF images are listed among the release
      contents or the external data links.
  - name: AP-MS coverage limited to treated conditions
    description: >-
      The release description states that AP-MS data are provided for MDA-MB-468 breast cancer cells
      "+ treatment", and the deposited AP-MS files and external MassIVE links cover only the
      paclitaxel-treated and vorinostat-treated conditions. No untreated-condition AP-MS file is
      listed.
  - name: MDA-MB-468 Perturb-seq data not deposited in the release
    description: >-
      Although listed in the release description as release content, no MDA-MB-468 Perturb-seq file
      appears in the deposited inventory, and the corresponding external resource is marked
      Embargoed. Users seeking cancer-cell perturbation data will not find it in this release.

errata:
  - name: June 2025 release revision
    description: >-
      The June 2025 Data Release record (doi 10.18130/V3/F3TD5R, version 2.1) states that the
      dataset is a revision of the June 2025 Data Release and that the revision includes adding RGB
      immunofluorescent images, corrections to RO-Crate metadata, and changes to naming conventions.
  - name: Provenance graph rendering caveat in the June 2025 release
    description: >-
      Several files in the June 2025 release carry the note that the .html provenance graph files
      require download to view properly and will not display in the Dataverse preview.

instances:
  - name: Immunofluorescence confocal image
    description: >-
      Each instance is a confocal microscopy image of MDA-MB-468 breast cancer cells stained by
      immunofluorescence-based staining (ICC-IF), displaying the spatial localization of one protein
      of interest. Each image carries four channels: nuclei stained with DAPI (blue channel),
      endoplasmic reticulum with a calreticulin antibody (yellow channel), microtubules with tubulin
      antibody (red channel), and antibody against the protein of interest (green channel). The June
      2025 revision notes that RGB immunofluorescent images were added.
  - name: SEC-MS protein elution profile
    description: >-
      Each instance is a size-exclusion chromatography-mass spectrometry measurement for a protein
      across chromatographic fractions, from which protein complex membership and differential
      elution between conditions are inferred. The CM4AI preprint reports detection of PPI profiles
      of over a thousand complexes in MDA-MB-468 cells and more than 700 protein complexes in both
      parental iPSCs and differentiated neurons.
  - name: AP-MS protein-protein interaction measurement
    description: >-
      Each instance is an affinity purification-mass spectrometry measurement on MDA-MB-468 cells,
      recording a bait protein and the interacting partners recovered with it, used to map
      protein-protein interactions under paclitaxel and vorinostat treatment conditions. The
      deposited files do not state which tagging approach was used for the baits in this release.
  - name: Single-cell CRISPRi perturbation transcriptional profile
    description: >-
      Each instance is a single-cell transcriptional readout associated with a CRISPR interference
      perturbation of a targeted gene, from which transcriptional and fitness phenotypes are
      derived. The CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs maps phenotypes associated with
      11,739 targeted genes.
  - name: Raw sequencing read set
    description: >-
      Raw sequence data from the genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J human
      induced pluripotent stem cells, deposited to the NCBI Sequence Read Archive and referenced
      from the release through the cm4ai_perturb-seq_KOLF2_raw_sra package.
  - name: RO-Crate provenance and metadata record
    description: >-
      Each data package is accompanied by an RO-Crate containing datasets, metadata, and software or
      resolvable references to these components, registered with persistent globally unique
      identifiers under the ARK scheme, with end-to-end provenance entailments expressed in the EVI
      Evidence Graph Ontology and serialized as JSON-LD and RDF-XML.

subpopulations:
  - name: MDA-MB-468 donor characteristics
    description: >-
      MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from a
      metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary
      adenocarcinoma, available from ATCC. It is described as extensively used to study
      triple-negative breast cancer and well characterized, with transcriptomic, mutational profile,
      and whole-genome sequencing data available.
  - name: KOLF2.1J donor characteristics
    description: >-
      The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was derived from a healthy male Northern European
      donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource,
      and accessible to not-for-profit organizations via a simple MTA.
  - name: Representation imbalance across the dataset
    description: >-
      Only two donor-derived genetic backgrounds are represented across the entire release: one
      diseased (metastatic mammary adenocarcinoma) and one healthy. The Dataverse record notes that
      the data do not represent all biological variants which may be seen in the population at
      large.

