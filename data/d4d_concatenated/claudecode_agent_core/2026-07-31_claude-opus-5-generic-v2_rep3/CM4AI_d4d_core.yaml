acquisition_methods:
  - name: Affinity purification mass spectrometry (AP-MS)
    description: >-
      Protein-protein interactions were mapped by AP-MS. Directly measured from cell culture
      material. The June 2026 release deposits AP-MS data for paclitaxel-treated and
      vorinostat-treated MDA-MB-468 cells, with raw acquisitions referenced to the MassIVE
      repository.
  - name: Size-exclusion chromatography coupled to mass spectrometry (SEC-MS)
    description: >-
      SEC-MS was used for proteome-wide complex and interaction mapping as an orthogonal mass
      spectrometry based approach, applied to MDA-MB-468 cells with and without treatment and to
      KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and cardiomyocytes. Directly measured from cell
      culture material.
  - name: Immunofluorescence staining with high-resolution confocal microscopy
    description: >-
      Spatial subcellular organization was mapped using immunofluorescence-based staining (ICC-IF)
      and confocal microscopy against proteins of interest, drawing on the Human Protein Atlas
      resource of antibodies. Directly observed from stained cell cultures in the Lundberg Lab at
      Stanford University.
  - name: Single-cell CRISPR interference perturbation screening
    description: >-
      Genetic perturbation mapping was performed by single-cell CRISPR interference screens.
      Directly measured from perturbed cell populations.

collection_mechanisms:
  - name: Human Protein Atlas antibody resource and ICC-IF protocol
    description: >-
      Spatial proteomics mapping used the Human Protein Atlas resource of antibodies. Nuclei were
      stained with DAPI (blue channel), endoplasmic reticulum with a calreticulin antibody (yellow
      channel), microtubules with tubulin antibody (red channel), and the protein of interest with a
      target-specific antibody (green channel). Imaging was performed in the Lundberg Lab at
      Stanford University. This channel scheme is stated in the file-level descriptions of the
      deposited immunofluorescence archives.
  - name: Automated fixation and permeabilization on a pipetting robot
    description: >-
      Reported in the May 2024 CM4AI preprint as a Year 1 method: automated fixation and
      permeabilization protocols were established for the pipetting robot for the MDA-MB-468 and
      KOLF2 cell lines. The bundle does not state whether this protocol was used for the material in
      the June 2026 release.
  - name: CRISPR lentiviral guide library with inducible dCas9
    description: >-
      Reported in the May 2024 CM4AI preprint as a Year 1 method: a CRISPR lentiviral library
      targeting 100 chromatin factors with 6 guide RNAs per gene was designed, and MDA-MB-468 and
      KOLF2 CRISPR lines expressing inducible dCas9 were generated and characterized. The
      genome-scale CRISPRi atlas deposited in this release targets 11,739 genes, a larger panel than
      that Year 1 library, and the bundle does not describe the guide design used for it.
  - name: 10x Genomics 3'HT single-cell kit
    description: >-
      Reported in the May 2024 CM4AI preprint as a Year 1 method: single-cell CRISPR screens of 100
      chromatin regulators (with and without drug) in MDA-MB-468 cells and in undifferentiated
      KOLF2.1J iPSCs were performed using the 10x Genomics 3'HT kit. The bundle does not state
      whether this kit was used for the perturbation data deposited in the June 2026 release.
  - name: Endogenous tagging for affinity purification
    description: >-
      Reported in the May 2024 CM4AI preprint as a Year 1 method: AP-MS was performed on
      endogenously tagged cell lines, with 17 genes endogenously tagged in MDA-MB-468 and a further
      34 in progress at that time. The bundle does not state which baits or tagging approach
      underlie the AP-MS files deposited in the June 2026 release.

data_collectors:
  - name: Lundberg Laboratory, Stanford University
    description: >-
      Generated the immunofluorescence subcellular imaging (spatial proteomics) data, as stated in
      the file-level descriptions of the deposited immunofluorescence archives. Raw image data for
      spatial proteomics is stated to be copyright of The Board of Trustees of the Leland Stanford
      Junior University. Emma Lundberg is the module lead.
  - name: Krogan Laboratory, University of California San Francisco
    description: >-
      Generated the SEC-MS and AP-MS protein-protein interaction data, as stated in the file-level
      descriptions for cm4ai_mass-spec_KOLF2.zip and cm4ai_mass-spec_MDA-MB-468.zip and in the CM4AI
      preprint. Nevan Krogan is the module lead; Kirsten Obernier, Antoine Forget, Ben Polacco and
      Monita Muralidharan are among the named contributors.
  - name: Mali Laboratory and collaborators, University of California San Diego
    description: >-
      Generated the genetic perturbation (CRISPRi Perturb-seq) data. Prashant Mali is a named
      corresponding author of the CM4AI preprint and senior author of the Perturbation Cell Atlas
      preprint; Sami Nourreddine, Yesh Doctor, Amir Dailamy and colleagues are named contributors.
  - name: Ideker Laboratory, University of California San Diego
    description: >-
      Responsible for the Tools module producing the MuSIC data integration and map production
      pipeline. Trey Ideker is the CM4AI Principal Investigator and dataset Point of Contact.
  - name: Clark group, University of Virginia
    description: >-
      Responsible for the Standards module and the FAIRSCAPE AI-readiness packaging of data,
      software, metadata, and provenance graphs, and for deposit of the release into the University
      of Virginia Dataverse.

collection_timeframes:
  - name: NIH project period
    description: >-
      NIH RePORTER records the project period for OT2OD032742 as 2022-09-01 to 2026-08-31, bounding
      the period during which project data were generated.
  - name: Stated project end for data generation and maintenance
    description: >-
      The Dataverse record states under "Maintenance Plan" that the dataset will be regularly
      updated and augmented through the end of the project in November 2026. This differs from the
      NIH RePORTER project end date of 2026-08-31; both statements are recorded without resolution.
  - name: Data generation milestones reported at Year 1
    description: >-
      The CM4AI preprint, posted 2024-05-24, reports that by the end of Year 1 spatial proteomics
      mapping of 100 chromatin regulators in MDA-MB-468 cells with and without paclitaxel or
      vorinostat had been completed, single-cell CRISPR screens perturbing 100 chromatin regulators
      in MDA-MB-468 under three conditions and in undifferentiated KOLF2 iPSC had been performed,
      and SEC-MS had been performed on MDA-MB-468 cells under three conditions and on KOLF2 iPSCs
      and derivatives. Generation of the material in the June 2026 release therefore spans a period
      beginning no later than Year 1 and continuing to the release date.

sampling_strategies:
  - name: Targeted panel of chromatin modifiers and metabolic enzymes
    description: >-
      CM4AI's stated design interrogates 100 chromatin modifiers and 100 metabolic enzymes involved
      in cancer, neuropsychiatric, and cardiac disorders. In Year 1, protein-protein interaction
      mapping and spatial proteomics mapping targeted 100 chromatin regulators, and single-cell
      CRISPR screens perturbed 100 chromatin regulators.
  - name: Genome-scale expressed-gene CRISPRi screening in iPSCs
    description: >-
      The CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs is an expressed genome-scale screen
      mapping transcriptional and fitness phenotypes associated with 11,739 targeted genes. The
      cm4ai.org flagship dataset summary describes this as Perturb-seq of more than 11,000 genes
      (whole-genome).
  - name: Guide RNA design for the targeted chromatin-factor library
    description: >-
      The CM4AI preprint reports that the CRISPR lentiviral library for the targeted screens was
      designed to cover 100 chromatin factors with 6 guide RNAs per gene.
  - name: Condition and cell-state sampling design
    description: >-
      Sampling spans matched perturbed and unperturbed conditions: treated (paclitaxel, vorinostat)
      versus untreated MDA-MB-468 breast cancer cells, and undifferentiated versus differentiated
      (NPC, neuron, cardiomyocyte) states derived from KOLF2.1J iPSCs.

raw_sources:
  - name: Raw mass spectrometry acquisitions
    description: >-
      Raw SEC-MS and AP-MS acquisitions underlying the deposited interaction data are held in the
      MassIVE repository and referenced from the release through External Data Links; the deposited
      Dataverse packages contain processed outputs and metadata rather than the raw instrument
      files.
  - name: Raw single-cell sequencing reads
    description: >-
      Raw sequence data from the genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs are
      deposited to the NCBI Sequence Read Archive under an NCBI BioProject, referenced from the
      release through the cm4ai_perturb-seq_KOLF2_raw_sra package.
  - name: Raw confocal image acquisitions
    description: >-
      Raw immunofluorescence image data were acquired in the Lundberg Lab at Stanford University and
      are distributed within the Dataverse release as ZIP archives; raw image data for spatial
      proteomics is stated to be copyright of The Board of Trustees of the Leland Stanford Junior
      University.

raw_data_sources:
  - source_description: >-
      NCBI Sequence Read Archive, accessed through an NCBI BioProject, holding the Sequence Read
      Archive (SRA) data for the CRISPRi Perturb-seq experiments, linked under External Data Links
      on the Dataverse release record.
  - source_description: >-
      MassIVE Repository, holding mass spectrometry data for human iPSCs (SEC-MS in KOLF2.1J iPSCs
      undifferentiated, NPC, neuron, and cardiomyocyte), linked under External Data Links on the
      Dataverse release record.
  - source_description: >-
      MassIVE Repository, holding mass spectrometry data for human cancer cells (SEC-MS in
      MDA-MB-468 breast cancer cells with and without treatment), linked under External Data Links
      on the Dataverse release record.
  - source_description: >-
      MassIVE Repository, holding AP-MS data in MDA-MB-468 breast cancer cells treated with
      paclitaxel, linked under External Data Links on the June 2026 Dataverse release record.
  - source_description: >-
      MassIVE Repository, holding AP-MS data in MDA-MB-468 breast cancer cells treated with
      vorinostat, linked under External Data Links on the June 2026 Dataverse release record.
  - source_description: >-
      Figshare, holding the CRISPRi Perturbation Atlas of iPSCs, linked under External Data Links on
      the June 2026 Dataverse release record.
  - source_description: >-
      Perturb-seq source data for KOLF2.1J iPSCs (undifferentiated), listed under External Data
      Links but marked Embargoed rather than carrying a repository link; the underlying source is
      therefore identified but not currently reachable.
  - source_description: >-
      Perturb-seq source data for MDA-MB-468 breast cancer cells (with and without treatment),
      listed under External Data Links but marked Embargoed rather than carrying a repository link;
      the underlying source is therefore identified but not currently reachable.
  - source_description: >-
      ATCC, source of the MDA-MB-468 (RRID:CVCL_0419) triple-negative breast cancer cell line used
      to generate the cancer-cell data streams.
  - source_description: >-
      Human Induced Pluripotent Stem Cells Initiative (HipSci) resource, source of the KOLF2.1J
      (RRID:CVCL_B5P3) induced pluripotent stem cell line, available to not-for-profit organizations
      via a simple MTA.

preprocessing_strategies:
  - name: PPI network embedding with node2vec (MuSIC pipeline)
    description: >-
      Within the CM4AI MuSIC pipeline, downloaded protein-protein interaction networks are processed
      using the node2vec deep learning model to reduce dimensionality, producing a PPI embedding
      that contains information about the protein's interactions. This step contributes to cell map
      construction; the Dataverse record states that computed cell maps are not included in this
      release, so the deposited files are pipeline inputs rather than outputs of this step.
  - name: Image embedding with a Human Protein Atlas deep learning model (MuSIC pipeline)
    description: >-
      Within the CM4AI MuSIC pipeline, immunofluorescence images are processed using a Human Protein
      Atlas deep learning model to reduce dimensionality, producing an image embedding that contains
      information about protein localization. As above, this step contributes to cell map
      construction and its outputs are not part of this release.
  - name: Contrastive multimodal co-embedding (MuSIC pipeline)
    description: >-
      Within the CM4AI MuSIC pipeline, the PPI and image embeddings are integrated to obtain a
      co-embedding for each protein using contrastive deep learning. The integration model learns
      co-embeddings such that the original embeddings can be reconstructed with minimal information
      loss and proteins with similar PPI and image embeddings have similar co-embeddings. Its
      outputs are not part of this release.
  - name: Protein community detection and hierarchy creation (MuSIC pipeline)
    description: >-
      Within the CM4AI MuSIC pipeline, community detection is performed based on the all-by-all
      similarities of pairs of proteins in the co-embedding space; the resulting hierarchy of
      protein communities is output as the final cell map. The Dataverse record states computed cell
      maps are not included in this release.
  - name: FAIRSCAPE AI-readiness packaging
    description: >-
      Applied to the deposited material. Each pipeline segment calls the FAIRSCAPE client package
      (FAIRSCAPE-CLI) to validate inputs and create an RO-Crate output package containing datasets,
      metadata, and software or resolvable references, with unique stubs for identifier creation.
      RO-Crates are sent to the FAIRSCAPE server, registered, assigned persistent resolvable
      globally unique identifiers under the ARK scheme, decomposed into individual components which
      are themselves registered and assigned identifiers, and end-to-end provenance entailments are
      computed and expressed in the EVI Evidence Graph Ontology.
  - name: Structural annotation of protein communities
    description: >-
      A bioinformatics pipeline annotates MuSIC communities by available structural information
      about community members and their interactions, drawing on the Protein Data Bank, the
      AlphaFold Protein Structure Database, crosslinking mass spectrometry, and prediction of
      disordered sequence segments, and ranks communities by the amount of available structural
      information. The CM4AI preprint describes this as exploratory work on the feasibility of
      integrative structure modeling.

labeling_strategies:
  - name: Alignment to curated protein function and pathway resources
    description: >-
      The CM4AI preprint describes a two-pronged annotation approach for cell maps. First, cell maps
      are aligned to known protein function and pathway resources, including the Gene Ontology (GO)
      and Reactome, to determine protein assemblies in the cell map with high overlap with known
      cell biology. This annotation applies to the cell maps produced by the CM4AI pipeline, which
      the Dataverse record states are not included in this release.
  - name: Large language model naming with confidence scoring
    description: >-
      Second, the CM4AI preprint states that assemblies in the cell maps are annotated using a large
      language model approach developed by the project to name sets of proteins and assign a name
      confidence score. As above, this applies to cell maps not included in this release. The bundle
      does not describe the prompt design or citation-verification mechanism used by CM4AI for this
      step.

machine_annotation_tools:
  - name: node2vec
    description: >-
      Deep learning model used to represent protein-protein interaction neighbourhoods as
      lower-dimensional feature vectors in the CM4AI MuSIC pipeline.
  - name: Human Protein Atlas image classification model
    description: >-
      Deep learning model pre-trained for protein immunofluorescence confocal image analysis, used
      to reduce image dimensionality and produce protein localization embeddings in the CM4AI MuSIC
      pipeline.
  - name: Contrastive multimodal co-embedding model
    description: >-
      Self-supervised integration model that learns joint co-embeddings from the PPI and image
      embeddings such that original embeddings can be reconstructed with minimal information loss.
  - name: Community detection over the co-embedding space
    description: >-
      Algorithmic community detection at multiple resolutions, applied to all-by-all protein
      similarities in the co-embedding space to generate the hierarchy of protein assemblies.
  - name: Large language model assembly-naming module
    description: >-
      The CM4AI preprint states that assemblies in the cell maps are annotated using a large
      language model approach developed by the project to name sets of proteins and assign a name
      confidence score. The bundle does not identify the specific model, prompt strategy, or
      confidence-scoring method used by CM4AI.

distribution_formats:
  - name: ZIP archives in the University of Virginia Dataverse
    description: >-
      All ten files in the June 2026 release are distributed as ZIP archives through the University
      of Virginia Dataverse (LibraData), under the School of Medicine "Cell Maps for Artificial
      Intelligence" collection. All files are marked Public access. The record states that the
      dataset is too large to download in its entirety and that users should select the files they
      need from the files table; individual files below the 1.9 GB download limit can be selected
      from the files table.
  - name: Programmatic access via the Dataverse Data Access API
    description: >-
      The Dataverse record offers programmatic access to the files through the Data Access API, with
      a package file download URL pattern of
      https://dataverse.lib.virginia.edu/api/access/datafile/ for use with a Wget command or a
      download manager; download via web browser is not recommended for package files.
  - name: RO-Crate packaging with resolvable persistent identifiers
    description: >-
      Data packages are distributed as RO-Crates containing datasets, metadata, and software or
      resolvable references to these components. ARK persistent identifiers resolve to machine- and
      human-readable landing pages containing metadata expressed in JSON-LD using vocabularies from
      Schema.org, EVI, and other public ontologies, with alternate serializations in JSON-LD and
      RDF-XML. Earlier releases additionally exposed an HTML datasheet summarizing key release
      information and HTML provenance graph files.
  - name: Metadata export formats offered by the repository
    description: >-
      The Dataverse record offers metadata export as OAI_ORE, DataCite, OpenAIRE, Schema.org
      JSON-LD, DDI Codebook v2, Dublin Core, Croissant, DDI HTML Codebook, and JSON.

distribution_dates:
  - name: June 2026 release publication
    description: >-
      Publication Date 2026-06-17 for doi 10.18130/V3/HIGT4C. Seven data files plus the release
      metadata package were published 2026-06-17; the three immunofluorescence image archives were
      published 2026-07-15. Version 2 was released 2026-07-15T20:28:19Z.
  - name: October 2025 release
    description: >-
      Cell Maps for Artificial Intelligence - October 2025 Data Release (Beta), doi
      10.18130/V3/K7TGEM, Version 2.1, Publication Date 2025-10-31, with individual files published
      2025-10-31 and 2025-12-22, 8 files, 405 downloads recorded.
  - name: June 2025 release
    description: >-
      Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta), doi
      10.18130/V3/F3TD5R, Version 2.1, Publication Date 2025-07-01, with individual files published
      2025-07-01 and 2025-10-22, 21 files, 256 downloads recorded.
  - name: March 2025 release
    description: >-
      Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta), doi
      10.18130/V3/B35XWX, Version 1.4, Publication Date 2025-03-03, 6 files, 302 downloads recorded.
  - name: May 2024 release
    description: >-
      The cm4ai.org data releases archive lists a May 2024 Data Release. The CM4AI preprint records
      that the most recent data and metadata at that time were available in LibraData, cited as
      Clark T, Mohan J, Schaffer L, Obernier K, et al., "Cell Maps for Artificial Intelligence -
      Data Release", https://doi.org/10.18130/V3/DXWOS5, University of Virginia Dataverse, V1.
  - name: Planned release cadence
    description: >-
      CM4AI states that it delivers quarterly data releases of map-input data streams, with updates
      on a quarterly basis through the end of the project.

license_and_use_terms:
  name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0)
  description: >-
    The dataset is licensed for reuse under CC BY-NC-SA 4.0
    (https://creativecommons.org/licenses/by-nc-sa/4.0/). Users are free to share (copy and
    redistribute the material in any medium or format) and adapt (remix, transform, and build upon
    the material), subject to: Attribution - appropriate credit must be given, a link to the license
    provided, and changes indicated; NonCommercial - the material may not be used for commercial
    purposes, a commercial use being one primarily intended for commercial advantage or monetary
    compensation; ShareAlike - contributions built upon the material must be distributed under the
    same license as the original; and No additional restrictions - no legal terms or technological
    measures may be applied that legally restrict others from doing anything the license permits.
    The Dataverse record adds that community norms and good scientific practices expect proper
    credit via citation using the data citation shown on the dataset page. Attribution is required
    to the copyright holders and the authors, and publications referencing this data or derived
    products should cite the related publication as well as directly citing the data collection. The
    recommended citation for this release is: Clark T; Parker J; Al Manir S; et al., 2026, "Cell
    Maps for Artificial Intelligence - June 2026 Data Release (Beta)",
    https://doi.org/10.18130/V3/HIGT4C, University of Virginia Dataverse, V2. The CM4AI preprint
    states that commercial use requires a separate license negotiation with the copyright holder
    (UCSD, Stanford, and/or UCSF depending upon the specific data package in question), and that a
    Data Access Committee will supervise ethical matters related to dataset distribution and
    potential dual licensing for commercial use. Associated software is separately licensed: the
    FAIRSCAPE framework under the MIT open-source license (copyright the Rector and Board of
    Visitors of the University of Virginia), the Tools data integration pipeline under the BSD-3
    open source license, and the Integrative Modeling Platform as open source.

ip_restrictions:
  name: Copyright holdings across contributing institutions
  description: >-
    Copyright in the data is held by The Regents of the University of California except where
    otherwise noted; the March 2025 record states "Copyright (c) 2025 The Regents of the University
    of California except where otherwise noted". Spatial proteomics raw image data is copyright of
    The Board of Trustees of the Leland Stanford Junior University. The CM4AI preprint states that
    copyright to the datasets is held by the Regents of the University of California except where
    otherwise indicated, and that raw image data for spatial proteomics is copyright by The Board of
    Trustees of the Leland Stanford Junior University. Copyright in the FAIRSCAPE AI-readiness
    software is held by the Rector and Board of Visitors of the University of Virginia. The CM4AI
    ethics and data governance plan is described as balancing the openness of the data produced with
    protection of the intellectual property, and supervision and monitoring of potential efforts at
    commercialization. Commercial reuse is withheld from the open license and requires a separate
    negotiated license with the relevant copyright holder.

regulatory_restrictions:
  name: Regulatory status and clinical-use restriction
  description: >-
    The Dataverse record records under Data Governance and Ethics: Human Subjects - No; De-identified
    Samples - Yes; FDA Regulated - No. Notwithstanding the non-regulated status of the data
    themselves, the record states under Prohibited Uses that these laboratory data are not to be
    used in clinical decision-making or in any context involving patient care without appropriate
    regulatory oversight and approval. The University of Virginia Dataverse collection hosting the
    release carries the notice that the collection is under review for potential modification in
    compliance with Administration directives; the same notice appears on cm4ai.org.

is_deidentified:
  name: De-identified cell-line derived data
  description: >-
    The Dataverse record states De-identified Samples: Yes and Human Subjects: No. The CM4AI
    preprint states that CM4AI data are distinctive within Bridge2AI in that they are non-clinical
    (from tissue cultures) and are considered to be de-identified as they cannot be matched, with
    current knowledge, to a human subject. The Dataverse record further notes under Potential
    Sources of Bias that data in this release were derived from commercially available de-identified
    human cell lines. The donor characteristics that remain associated with the source lines are
    those published for the cell lines themselves: for MDA-MB-468, a 51-year-old black female with a
    metastatic mammary adenocarcinoma; for KOLF2.1J, a healthy male Northern European donor.

human_subject_research:
  name: Non-human-subjects determination
  description: >-
    The Dataverse record records Human Subjects: No, De-identified Samples: Yes, and FDA Regulated:
    No. The CM4AI preprint describes the data as non-clinical, generated from tissue cultures of
    commercially available and ethically sourced human cell lines (MDA-MB-468 from ATCC and KOLF2.1J
    from the HipSci resource), and considered de-identified as they cannot be matched, with current
    knowledge, to a human subject. Ethical oversight is exercised through named Ethical Review
    contacts and a Data Governance Committee rather than through a participant-facing consent
    process.

ethical_reviews:
  - name: CM4AI Ethical Review contacts for the release
    description: >-
      The Dataverse record names Vardit Ravitsky (ravitskyv@thehastingscenter.org) and
      Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca) as the Ethical Review
      contacts under Data Governance and Ethics.
  - name: CM4AI Data Governance Committee
    description: >-
      The Dataverse record names Jillian Parker (jillianparker@health.ucsd.edu) as the Data
      Governance Committee contact under Data Governance and Ethics.
  - name: CM4AI Data Access Committee
    description: >-
      The CM4AI preprint states that a Data Access Committee will supervise ethical matters related
      to dataset distribution and potential dual licensing for commercial use.
  - name: CM4AI Ethics Module governance framework
    description: >-
      The Ethics Module worked with the Data Acquisition, Tools, and Standards Modules to develop a
      plan for ethical preparation, licensing, dissemination, and Data Access supervision of CM4AI
      datasets, established guidelines addressing socio-ethical challenges, developed a first
      version of a Value Repository (an axiological repository) to guide design standards and
      expectations using a methodology inspired by Value-Sensitive Design, and is formulating the
      CM4AI Life Cycle framework to elucidate governance milestones throughout data generation and
      AI system development.
  - name: Bridge2AI Code of Conduct
    description: >-
      The CM4AI Ethics Pillar supported the Bridge2AI Ethics Working Group in assisting the
      Bridge2AI Data Sharing and Dissemination Working Group to develop a Code of Conduct, outlining
      basic requirements for participants in the Bridge2AI Open House to attest and commit to prior
      to accessing B2AI data including CM4AI datasets.

confidential_elements:
  - name: Pre-publication embargoed component datasets
    description: >-
      The Dataverse record states under Completeness that some datasets are under temporary
      pre-publication embargo. Specifically, the External Data Links list marks the Perturb-seq data
      in KOLF2.1J iPSCs (undifferentiated) and the Perturb-seq data in MDA-MB-468 breast cancer
      cells (with and without treatment) as "Embargoed", withholding the corresponding external
      repository access pending publication. All ten files deposited in the Dataverse release itself
      are marked Public access.

updates:
  name: Quarterly release plan through project end
  description: >-
    The Dataverse record states under Maintenance Plan that the dataset will be regularly updated
    and augmented through the end of the project in November 2026, with updates on a quarterly
    basis. CM4AI describes itself as delivering machine-readable hierarchical maps of cell
    architecture as AI-ready data together with quarterly data releases of map-input data streams.
    The cm4ai.org FAQ states that CM4AI releases data quarterly, ensuring continuous updates to the
    cell maps and input data streams. The CM4AI preprint states that data presented will be
    augmented regularly through the end of the project, and that the article itself will be
    continuously updated as CM4AI progresses. Planned additions include predicted cell maps, which
    the Limitations section states will be added in future releases, and IF images for the iPSC
    flagship dataset, listed as "coming soon" on cm4ai.org. Each release is issued under its own DOI
    rather than as a version of a single record; within a record, Dataverse minor and major version
    increments are used (this release is Version 2.0).

retention_limit:
  name: Long-term preservation commitment
  description: >-
    The Dataverse record states under Maintenance Plan that there will be long term preservation in
    the University of Virginia Dataverse, supported by committed institutional funds. No deletion
    schedule or retention expiry is stated. The hosting collection carries the notice that it is
    under review for potential modification in compliance with Administration directives.

version_access:
  name: Release history and prior version availability
  description: >-
    This release is Version 2.0 of doi 10.18130/V3/HIGT4C; version 2 was released
    2026-07-15T20:28:19Z. The Dataverse interface exposes a Versions tab and version-differences
    view for the record. Preceding CM4AI data releases remain independently citable under their own
    DOIs in the same University of Virginia Dataverse collection: October 2025 Data Release (Beta),
    doi 10.18130/V3/K7TGEM, Version 2.1; June 2025 Data Release (Beta), doi 10.18130/V3/F3TD5R,
    Version 2.1; March 2025 Data Release (Beta), doi 10.18130/V3/B35XWX, Version 1.4; and the May
    2024 Data Release, cited in the CM4AI preprint as doi 10.18130/V3/DXWOS5, V1. The cm4ai.org data
    releases page maintains an archive listing the May 2024, March 2025, June 2025, and October 2025
    releases alongside the current release.

external_resources:
  - name: CM4AI project web portal
    description: >-
      https://cm4ai.org - the open-access CM4AI portal, built on the U-BRITE platform, providing
      project overview, data releases, tools, product documentation, publications, and learning
      resources. The portal reports project-level Data Insights figures of 1,374 protein
      interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes
      targeted, and 21.4 TB data volume; these are portal-wide aggregates and are not stated to
      correspond to the contents of this single release.
  - name: CM4AI project preprint (Related Publication of this release)
    description: >-
      Clark T, Mohan J, Schaffer L, Obernier K, Al Manir S, Churas CP, Dailamy A, Doctor Y, Forget
      A, Hansen JN, Hu M, Lenkiewicz J, Levinson MA, Marquez C, Nourreddine S, Niestroy J, Pratt D,
      Qian G, Thaker S, Belisle-Pipon JC, Brandt C, Chen J, Ding Y, Fodeh S, Krogan N, Lundberg E,
      Mali P, Payne-Foster P, Ratcliffe S, Ravitsky V, Sali A, Schulz W, Ideker T. "Cell Maps for
      Artificial Intelligence: AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell
      Lines." bioRxiv, doi 10.1101/2024.05.21.589311, posted 2024-05-24, available under a
      CC-BY-NC-ND 4.0 International license. Cited as a Related Publication for the release and
      required for attribution.
  - name: Perturbation Cell Atlas preprint (Related Publication of this release)
    description: >-
      Nourreddine S, Doctor Y, Dailamy A, Forget A, Lee YH, Chinn B, Khaliq H, Polacco B,
      Muralidharan M, Pan E, Zhang Y, Sigaeva A, Hansen JN, Gao J, Parker JA, Obernier K, Clark T,
      Chen JY, Metallo C, Lundberg E, Ideker T, Krogan N, Mali P. "A Perturbation Cell Atlas of
      Human Induced Pluripotent Stem Cells." bioRxiv 2024 Nov 4;2024.11.03.621734, PMCID
      PMC11580897, doi 10.1101/2024.11.03.621734. Listed as a Related Publication on the release
      record.
  - name: >-
      Multimodal cell maps publication (U2OS) - not a stated Related Publication of this release
    description: >-
      Schaffer LV, Hu M, Qian G, et al. "Multimodal cell maps as a foundation for structural and
      functional genomics." Nature 642, 222-231 (2025), doi 10.1038/s41586-025-08878-3, published
      2025-04-09, open access under CC BY 4.0, with a Publisher Correction published 2025-10-02 (doi
      10.1038/s41586-025-09648-x). This paper is present in the source bundle as an independently
      selected project-affiliated publication; it is not listed as a Related Publication on any
      CM4AI Dataverse release record. It reports a multimodal cell map of U2OS osteosarcoma cells
      covering over 5,100 proteins and resolving 275 molecular assemblies. Its underlying data are
      U2OS-derived and are distinct from the MDA-MB-468 and KOLF2.1J data constituting this CM4AI
      release; its acknowledgements record support from the Bridge2AI Program (NIH Common Fund; OT2
      OD032742).
  - name: Cell Mapping Toolkit
    description: >-
      https://github.com/idekerlab/cellmaps_pipeline - open-source Python package series
      implementing the end-to-end cell mapping pipeline, with user documentation at
      https://cellmaps-pipeline.readthedocs.io/. Packages include cellmaps_imagedownloader,
      cellmaps_ppidownloader, cellmaps_image_embedding, cellmaps_ppi_embedding, cellmaps_coembedding,
      cellmaps_generate_hierarchy, and cellmaps_hierarchyeval. The CM4AI preprint states the Tools
      data integration pipeline software is available under BSD-3 open source license in GitHub for
      alpha-level tools or in the Zenodo long-term archive for production-ready tools.
  - name: FAIRSCAPE AI-readiness framework
    description: >-
      https://fairscape.github.io - the FAIRSCAPE framework, comprising a client-side Python3
      application (FAIRSCAPE-CLI) and a server application, used to package CM4AI data, software,
      metadata, and provenance graphs as RO-Crates with ARK persistent identifiers and EVI evidence
      graphs. Both client-side and server-side packages are PIP-installable and freely available
      under the MIT open-source license.
  - name: Network Data Exchange (NDEx)
    description: >-
      https://ndexbio.org - the platform through which CM4AI cell maps are shared, viewable in a web
      browser or accessible via tools such as Cytoscape, HiView, and the Python ndex2 library.
  - name: Integrative Modeling Platform
    description: >-
      http://integrativemodeling.org - the open-source Integrative Modeling Platform (IMP) package,
      version 2.18, used with the Python Modeling Interface for integrative structure modeling of
      protein communities.
  - name: NIH RePORTER project record
    description: >-
      https://reporter.nih.gov/project-details/11211616 - NIH RePORTER record for "Bridge2AI: Cell
      Maps for AI (CM4AI) Data Generation Project", application ID 11211616, project number
      3OT2OD032742-01S2, core project number OT2OD032742, PI Trey Ideker, University of California
      San Diego, fiscal year 2025, award amount 5,289,382, project period 2022-09-01 to 2026-08-31.
  - name: Creative Commons license deed
    description: >-
      https://creativecommons.org/licenses/by-nc-sa/4.0/ - the canonical URL for the Attribution-
      NonCommercial-ShareAlike 4.0 International license under which the dataset is released.

resources:
  - id: https://doi.org/10.18130/V3/HIGT4C#subset-mdamb468-untreated
    name: MDA-MB-468 untreated (DMSO control)
    description: >-
      Untreated MDA-MB-468 triple-negative breast cancer cells. Separately materialized in this
      release as cm4ai_ifimages_MDA-MB-468_untreated.zip; SEC-MS profiles for this condition are
      combined with the treated conditions inside cm4ai_mass-spec_MDA-MB-468.zip. The cm4ai.org
      page describes the untreated condition as the DMSO control arm of the TNBC flagship dataset.
      The identifier above is a local fragment coined for this datasheet; the bundle does not expose
      a repository-assigned identifier for this grouping.
  - id: https://doi.org/10.18130/V3/HIGT4C#subset-mdamb468-paclitaxel
    name: MDA-MB-468 treated with paclitaxel
    description: >-
      MDA-MB-468 cells treated with paclitaxel. Separately materialized in this release as
      cm4ai_apms_MDA-MB-468_paclitaxel.zip and cm4ai_ifimages_MDA-MB-468_paclitaxel.zip; SEC-MS
      profiles are combined with the other conditions inside cm4ai_mass-spec_MDA-MB-468.zip. The
      identifier above is a local fragment coined for this datasheet.
  - id: https://doi.org/10.18130/V3/HIGT4C#subset-mdamb468-vorinostat
    name: MDA-MB-468 treated with vorinostat
    description: >-
      MDA-MB-468 cells treated with vorinostat. Separately materialized in this release as
      cm4ai_apms_MDA-MB-468_vorinostat.zip and cm4ai_ifimages_MDA-MB-468_vorinostat.zip; SEC-MS
      profiles are combined with the other conditions inside cm4ai_mass-spec_MDA-MB-468.zip. The
      identifier above is a local fragment coined for this datasheet.
  - id: https://doi.org/10.18130/V3/HIGT4C#subset-kolf2-undifferentiated
    name: KOLF2.1J undifferentiated (parental) iPSCs
    description: >-
      Undifferentiated parental KOLF2.1J induced pluripotent stem cells. Represented by the CRISPRi
      Perturbation Cell Atlas and its associated raw sequence package, and by SEC-MS profiles held
      within cm4ai_mass-spec_KOLF2.zip alongside the differentiated cell types. The identifier above
      is a local fragment coined for this datasheet.
  - id: https://doi.org/10.18130/V3/HIGT4C#subset-ipsc-npc
    name: iPSC-derived neural progenitor cells
    description: >-
      Neural progenitor cells differentiated from KOLF2.1J iPSCs. Documented as a distinct
      experimental arm in the release description, but not separately addressable in the deposited
      inventory: SEC-MS profiles for this cell type are held within cm4ai_mass-spec_KOLF2.zip
      together with the other iPSC-derived states. The identifier above is a local fragment coined
      for this datasheet.
  - id: https://doi.org/10.18130/V3/HIGT4C#subset-ipsc-neuron
    name: iPSC-derived neurons
    description: >-
      Neurons differentiated from KOLF2.1J iPSCs. Documented as a distinct experimental arm in the
      release description, but not separately addressable in the deposited inventory: SEC-MS
      profiles for this cell type are held within cm4ai_mass-spec_KOLF2.zip together with the other
      iPSC-derived states. The identifier above is a local fragment coined for this datasheet.
  - id: https://doi.org/10.18130/V3/HIGT4C#subset-ipsc-cardiomyocyte
    name: iPSC-derived cardiomyocytes
    description: >-
      Cardiomyocytes differentiated from KOLF2.1J iPSCs. Documented as a distinct experimental arm
      in the release description, but not separately addressable in the deposited inventory: SEC-MS
      profiles for this cell type are held within cm4ai_mass-spec_KOLF2.zip together with the other
      iPSC-derived states. The identifier above is a local fragment coined for this datasheet.