id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship dataset of the Artificial Intelligence Ready and Equitable
  (also rendered Exploratory) Atlas for Diabetes Insights (AI-READI) project, one of four Data
  Generation Projects of the NIH Common Fund Bridge2AI program. The dataset contains multimodal
  data collected from 2,280 participants with and without type 2 diabetes mellitus (T2DM) between
  19 July 2023 and 1 May 2025, harmonised across three data collection sites (University of Alabama
  at Birmingham, University of California San Diego, University of Washington). Modalities include
  survey/questionnaire data, clinical laboratory results from blood and urine, physical measurements
  and vitals, 12-lead electrocardiography, cognitive and visual function testing, retinal photography,
  optical coherence tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging
  ophthalmoscopy (FLIO), continuous glucose monitoring, wearable activity monitoring, and indoor
  environmental sensing. The public release contains no protected health information; information on
  sex, race/ethnicity, and medications used has been removed. The dataset comprises 356,343 files and
  approximately 3.82 TB, organised according to the Clinical Dataset Structure (CDS) v0.1.1 and
  distributed through the FAIRhub platform.
