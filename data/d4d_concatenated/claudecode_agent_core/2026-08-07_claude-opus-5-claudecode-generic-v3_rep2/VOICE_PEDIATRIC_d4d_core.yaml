id: https://doi.org/10.13026/h995-bt35
name: Bridge2AI-Voice Pediatric Dataset
title: Bridge2AI-Voice Pediatric Dataset v1.1.0
description: The Bridge2AI-Voice Pediatric Dataset is a credentialed-access PhysioNet release of derived
  acoustic features and linked phenotypic data from pediatric voice and speech recordings, produced by
  the Bridge2AI-Voice project. Version 1.1.0 contains derived audio features for 23,533 recordings collected
  from 300 participants aged 2 to 18, together with detailed demographic, clinical and validated questionnaire
  data. The release contains data considered low risk, including derivations such as spectrograms but
  not the original voice recordings; raw pediatric audio is distributed separately through Synapse under
  controlled access. Participants were patients and healthy volunteers at the Hospital for Sick Children,
  together with non-patients recruited through research postings, all recorded on tablets using the reproschema-ui
  software under a standardized age-appropriate Bridge2AI-Voice pediatric protocol. Data collection and
  sharing were approved by the Research Ethics Board at the Hospital for Sick Children. This is a separate
  PhysioNet project from the Bridge2AI-Voice Adult Dataset, which covers a distinct cohort under its own
  release series.
source_caveats: 'Scope. The project documentation at docs.b2ai-voice.org contains a healthsheet whose
  composition, labeling, uses, distribution and maintenance answers are explicitly scoped to the adult
  releases (833 instances, minimum age 18 years, "The current v.2.0.0 dataset contains only adult populations",
  hosting on Health Data Nexus). Those answers were not carried into this record, which describes the
  pediatric release only. Funding identifiers. The pediatric release acknowledges NIH project number 3OT2OD032720-01S1,
  while the NIH RePORTER page in the bundle is application 11376382 with project number 3OT2OD032720-01S3;
  both carry core project number OT2OD032720, and the project documentation footer additionally shows
  a garbled award string ("Award #3Tf-OTOD03272001S2"), which was not transcribed as a grant number. Ethics
  review. The Bridge2AI Voice Data Acquisition protocol''s revision history records that V2 (3 May 2023)
  was "Modified to include pediatric cohort under single IRB", while the same protocol states that pediatric
  enrollment occurs only at pediatric participating institutions and that the Canadian institutions (Mount
  Sinai Hospital, SickKids and the University of Toronto) do not follow the single IRB process and apply
  for a separate research ethics board approval; the PhysioNet record attributes approval for this dataset
  to the Research Ethics Board at the Hospital for Sick Children. HIPAA. The Data Transfer and Use Agreement
  states that the Data is Personally Identifiable Information under OMB Memorandum M-07-16 and "not covered
  under HIPAA, FERPA, or similar laws", while the project documentation''s de-identification section answers
  "Yes" to whether HIPAA de-identification rules are applied; no single HIPAA compliance status was asserted.
  Names. The PhysioNet author list gives "Jennifer Siu" and the project documentation gives "Jennifer
  Sui, MD (Hospital for Sick Children)". Versions. The project documentation states in one paragraph that
  "The pediatric dataset v1.0 is now available containing data from 300 participants" while announcing
  v1.1.0 elsewhere on the same page; the PhysioNet v1.1.0 record was treated as authoritative. The DOI
  labelled "DOI (latest version)" (10.13026/mf9s-5r03) differs from the v1.1.0 DOI (10.13026/h995-bt35)
  even though v1.1.0 is the most recent version listed. File locations. URLs for folders and files inside
  the PhysioNet project were constructed from the documented project URL plus the folder and file names
  given in the PhysioNet data description; the file listing itself is restricted and could not be transcribed.
  Questionnaires. The validated-questionnaire table in the project documentation is flattened from HTML
  and its column marks cannot be attributed to cohorts reliably, so only the instruments named as pediatric
  were recorded. Contacts. The corresponding-author contact on the PhysioNet page requires a login and
  is not present in the bundle. Collection window. No collection start or end date is stated for the pediatric
  cohort anywhere in the bundle.'
