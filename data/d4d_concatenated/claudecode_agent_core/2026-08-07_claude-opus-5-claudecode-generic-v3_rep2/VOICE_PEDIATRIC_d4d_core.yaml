purposes:
- name: Enable AI research on voice as a biomarker of pediatric health
  response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset to enable
    future research in artificial intelligence and to support critical insights into the use of voice
    as a biomarker of health. The pediatric release extends that goal to children, whose voice and speech
    production differs fundamentally from that of adults.
- name: Advance early detection of pediatric communication disorders
  response: Establishing a robust multi-institutional dataset that integrates pediatric voice data with
    demographic information would advance understanding of voice and disease as well as early detection
    and intervention. Resources such as this project are intended to enable study of developmental norms,
    create AI-driven tools for early screening, and support clinical insight.
tasks:
- name: Machine learning for pediatric voice analysis
  response: The release is intended to support machine learning on pediatric voice and speech, including
    the detection of pediatric communication disorders such as autism spectrum disorder and speech delays,
    for which existing studies are limited by small and non-public datasets.
- name: Characterisation of developmental norms
  response: Because the respiratory system and larynx undergo rapid functional maturation throughout childhood,
    and these changes influence acoustic features such as fundamental frequency, the dataset is intended
    to support the study of developmental norms across age.
addressing_gaps:
- name: Adult normative voice data does not generalize to children
  response: Pediatric and adult voice and speech production are fundamentally different because the respiratory
    system and larynx undergo rapid functional maturation and development throughout childhood, and these
    developmental changes influence acoustic features such as fundamental frequency. As a result, the
    evidence and normative data available in adults cannot be generalized to pediatric populations.
- name: Scarcity of open large-scale pediatric voice datasets
  response: Despite the clinical importance of detecting pediatric communication disorders such as autism
    spectrum disorder and speech delays, the availability of large-scale pediatric databases remains limited.
    Data collection in pediatric populations poses unique challenges including privacy issues, consent
    processes and the need for developmentally appropriate tasks, and these factors have contributed to
    the lack of publicly available pediatric datasets that enable machine learning for pediatric voice
    analysis.
