distributions:
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/torchaudio_spectrograms.parquet
  name: torchaudio_spectrograms.parquet
  path: features/torchaudio_spectrograms.parquet
  description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier Transform with
    a 25 ms window size, 10 ms hop length and a 400-point FFT. n=23533. Apache Parquet format, which the
    schema's format enumeration does not cover.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/torchaudio_mel_spectrograms.parquet
  name: torchaudio_mel_spectrograms.parquet
  path: features/torchaudio_mel_spectrograms.parquet
  description: Mel spectrograms of dimension 60xT generated with a 25 ms window size, 10 ms hop length,
    a 400-point FFT and 60 Mel bins. n=23533. Apache Parquet format.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/torchaudio_mfcc.parquet
  name: torchaudio_mfcc.parquet
  path: features/torchaudio_mfcc.parquet
  description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the
    Mel spectrograms. n=23533. Apache Parquet format.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/torchaudio_pitch.parquet
  name: torchaudio_pitch.parquet
  path: features/torchaudio_pitch.parquet
  description: Detected pitch (fundamental frequency) over time, of dimension T, with a minimum and maximum
    pitch of 80 and 500 respectively. n=23533. Apache Parquet format.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/sparc_ema.parquet
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
  description: 'Estimated electromagnetic articulography derived with a deep learning model, of dimensions
    Tx12, where the twelve values are the X and Y positions of six articulators: tongue dorsum, tongue
    body, tongue tip, lower incisor, upper lip and lower lip. n=23532. Apache Parquet format.'
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/sparc_loudness.parquet
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
  description: Estimated loudness based on the average absolute amplitude of the audio waveform, of size
    T, using 20 ms windows. n=23532. Apache Parquet format.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/sparc_periodicity.parquet
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
  description: Estimated periodicity, the confidence of pitch presence, derived from the audio using 20
    ms windows, of dimension T. n=23532. Apache Parquet format.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/sparc_pitch.parquet
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
  description: Estimated fundamental frequency of the audio signal using a different algorithm from torchaudio_pitch,
    with a range of 50-550 Hz and dimension T. n=23532. Apache Parquet format.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/ppgs.parquet
  name: ppgs.parquet
  path: features/ppgs.parquet
  description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a dimension of
    40xT with a frame rate of 100 Hz. n=23533. Apache Parquet format.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/static_features.tsv
  name: static_features.tsv
  path: features/static_features.tsv
  format: TSV
  media_type: text/tab-separated-values
  description: Plain-text file of static features derived with openSMILE (Speech and Music Interpretation
    by Large-space Extraction), Praat, parselmouth and torchaudio.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/features/audio_quality_metrics.tsv
  name: audio_quality_metrics.tsv
  path: features/audio_quality_metrics.tsv
  format: TSV
  media_type: text/tab-separated-values
  description: Metrics related to audio quality derived from the recordings.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/phenotype/demographics.tsv
  name: demographics.tsv
  path: phenotype/demographics.tsv
  format: TSV
  media_type: text/tab-separated-values
  description: Demographic phenotype table, named in the release's usage notes as a tab-separated file
    readable with pandas.
- id: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/metadata
  name: metadata
  path: metadata
  description: Metadata information for the recordings. Per-recording metadata was newly released in v1.1.0.
