purposes:
- id: b2aivoice:purpose-fill-data-gap
  name: Fill the gap in large-scale, diverse, well-documented clinical voice data
  response: The Bridge2AI Voice dataset was created to address a gap in the availability of
    large-scale, diverse, and well-documented voice data for use in clinical machine-learning
    applications. Previous studies on machine learning-based voice diagnosis produced promising
    results, but their sample sizes were too small, or they lacked the key metadata needed
    for training robust, clinically useful models. The dataset aims to bridge this gap by
    providing an ethically sourced, large, and diverse dataset to develop, benchmark, or validate
    clinically applicable AI/ML models.
- id: b2aivoice:purpose-voice-as-biomarker
  name: Establish voice as a non-invasive biomarker of health
  response: The goal is to facilitate the use of voice as a non-invasive, cost-effective biomarker
    for the screening, diagnosis, and monitoring of a wide range of health conditions, and
    to promote integration of voice as a biomarker of health in clinical care by generating
    a multi-institutional, ethically sourced and diverse voice dataset linked to multimodal
    health biomarkers.
- id: b2aivoice:purpose-ethical-infrastructure
  name: Provide an ethically sourced, publicly accessible alternative to private voice corpora
  response: The consortium set out to create safe, innovative infrastructures to disseminate
    ethically sourced data for future generations of voice AI researchers, in a field where
    industry holds vast amounts of voice data but lacks accurate clinical or demographic information,
    and where private datasets cannot be externally audited for fair representation of diverse
    populations.
tasks:
- id: b2aivoice:task-model-development
  name: Develop, benchmark and validate clinical machine-learning models from voice
  response: The dataset is intended to enable the development, benchmarking, or validation
    of clinically applicable machine-learning models for diagnosing a wide range of health
    conditions using voice data, including vocal pathologies and neurological, psychiatric,
    respiratory and pediatric voice disorders. It can be used for AI model pretraining, fine-tuning,
    benchmarking, or validation.
- id: b2aivoice:task-disease-classification
  name: Disease detection and classification from voice
  response: The current version comes with predefined tasks and labeling. The tasks are primarily
    designed for training machine-learning models for disease detection and classification
    using voice data, with labels comprising diagnostic categories such as vocal pathologies,
    neurological disorders, psychiatric conditions, and respiratory disorders.
- id: b2aivoice:task-standards-development
  name: Develop acoustic and bioinformatic standards for voice AI
  response: A stated aim of the programme that produced the dataset is to introduce the field
    of acoustic biomarkers by developing new standards of acoustic and voice data collection
    and analysis for voice AI research, and to achieve interoperability of data by creating
    new bioinformatics standards for voice data.
addressing_gaps:
- id: b2aivoice:gap-small-samples
  name: Small, metadata-poor training sets in prior voice AI work
  response: Prior work on machine learning-based voice diagnosis produced promising results
    but used sample sizes that were too small or lacked the key metadata needed for training
    robust, clinically useful models. In laryngeal-cancer screening and diagnosis, most studies
    reported training datasets of fewer than 300 patients and only two studies used more than
    one data modality; published AI/ML models linking voice to the disease categories of interest
    consist of datasets ranging from 20 to 400 patients.
- id: b2aivoice:gap-no-standards
  name: Absence of standards for voice and speech data collection
  response: Comparing studies and pooling data is challenging because of the lack of standards
    in how voice and speech data are collected and measured, which precludes meta-analysis
    and limits external validity.
- id: b2aivoice:gap-private-unauditable-data
  name: Private industry datasets that cannot be audited
  response: Within industry, datasets are often private, limiting the ability to audit machine
    learning models and the accuracy of training data labels, and preventing external auditing
    of training datasets to ensure fair representation of diverse populations.
- id: b2aivoice:gap-multimodal-linkage
  name: Voice data unlinked to other health biomarkers
  response: Current literature has studied only small- to medium-sized datasets with limited
    data outside acoustic measures and no linkage to multimodal health data; audiomics needs
    to be integrated into multi-omics efforts in which audio data are analysed together with
    clinical, imaging and genomic data.
