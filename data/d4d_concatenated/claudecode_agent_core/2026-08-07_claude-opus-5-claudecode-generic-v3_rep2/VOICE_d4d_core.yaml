id: https://doi.org/10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: |-
  The Bridge2AI-Voice (B2AI-Voice) adult dataset is a large, ethically sourced, demographically diverse voice dataset linked to health information, produced by the Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program. Each instance is a person. Participants were recruited at specialty clinics ("high volume expert clinics") in North America on the basis of membership in predefined disease cohort categories - voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders, and respiratory disorders - together with control participants without those conditions. Consenting participants performed a standardized battery of acoustic tasks (respiration, cough, sustained vowels, glides, loudness, diadochokinesis, validated reading passages, free speech, story recall, picture description and cognitive-speech tasks) on a tablet application, and completed demographic, confounder, medical-history and disease-specific validated questionnaires. Clinical diagnoses were validated by a qualified clinician against established gold standards, or from the electronic health record or an active prescription.
  The published release does not contain the original voice recordings. It contains derived acoustic features computed from the raw audio - spectrograms, Mel spectrograms, MFCCs, pitch, Speech Articulatory Coding (sparc) articulatory traces, loudness, periodicity, phonetic posteriorgrams, and openSMILE/Praat/Parselmouth static features - together with the phenotypic data (demographics, confounders, per-condition diagnosis tables, enrollment, validated questionnaires, and per-task records), each accompanied by a JSON data dictionary. Version 3.1.0, published 2026 May 1 on PhysioNet, contains data for 833 participants collected across five sites in North America, and is available under credentialed access to users who sign the Bridge2AI Voice Registered Access Agreement. Raw audio is released separately under a more restrictive controlled-access process administered by the project's Data Access Compliance Office.
