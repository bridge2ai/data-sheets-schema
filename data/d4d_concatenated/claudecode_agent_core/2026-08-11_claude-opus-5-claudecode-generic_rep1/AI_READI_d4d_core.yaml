source_caveats: 'The bundle documents three releases of one dataset. Figures given here are for release
  3.0.0 (DOI 10.60775/fairhub.3, 2025-11-17, 2,280 participants, 356,343 files, 3.82 TB). The FAIRhub
  capture for release 2.0.0 in the same bundle reports 2.01 TB across 165,051 files and is marked upstream
  as no longer accessible; those figures are recorded here only under version_access as historical. Target
  enrolment is stated inconsistently across sources - 4,000 in the BMJ Open protocol, the Nature Metabolism
  comment and the FAIRhub study description, "4,000+" in the NIH RePORTER abstract, and 4,600 in the UW
  IRB protocol form, whose own subject table nonetheless sums to 4,000. The BMJ Open protocol labels STUDY00016228
  a "Clinicaltrials.org approval number"; every other source in the bundle, including the IRB documentation,
  treats it as the University of Washington IRB approval number, and the ClinicalTrials.gov registration
  is NCT06002048. Variable-level detail is not represented in this record: the only per-variable inventory
  in the bundle is BMJ Open Table 2, whose columns (test name, unit, reference range, rationale) are separated
  into non-adjacent blocks by PDF text extraction, so units and ranges cannot be attached to the correct
  analyte without guessing.'
purposes:
- id: aireadi:purpose-ai-ready-t2dm
  name: Enable AI/ML research into type 2 diabetes salutogenesis
  response: To enable future generations of artificial intelligence and machine learning research to provide
    critical insights into type 2 diabetes mellitus, including salutogenic pathways to return to health.
  description: T2DM is a growing public health threat and current understanding of it, especially in the
    context of salutogenesis, is limited. AI-based approaches may improve that understanding, but a key
    obstacle is the lack of data ready for training AI models; the AI-READI dataset is intended to fill
    that gap. The long-term objective stated in the NIH RePORTER abstract and the dataset README is a
    foundational T2DM dataset, agnostic to existing classification criteria or biases, that can be used
    to reconstruct a temporal atlas of T2DM development and reversal towards health.
- id: aireadi:purpose-blueprint
  name: Provide a blueprint for ethically sourced, AI-ready dataset generation
  response: To establish and share standards, best practices and guidelines for the collection, preparation
    and sharing of data for AI/ML purposes, so that the project can serve as a model for future medical
    and health datasets.
  description: The Nature Metabolism comment describes sharing a blueprint for collecting and sharing
    AI-ready datasets so that future Data Generation Projects can follow it, including guidelines for
    project management and for data collection, management and sharing, adherence to the FAIR principles,
    ethical review at every stage of the project cycle, and the development of new standards such as the
    Clinical Dataset Structure. The BMJ Open protocol states that AI-READI can be viewed as a model for
    future efforts to develop other medical or health datasets targeted for AI/ML.
tasks:
- id: aireadi:task-pseudotime-manifold
  name: Pseudotime manifold analysis of disease trajectory
  response: Data collection was specifically designed to permit downstream pseudotime manifold analysis,
    an approach used to predict disease trajectories by collecting and learning from complex multimodal
    data from participants with differing disease severity, from normal to insulin-dependent T2DM.
  description: The IRB protocol adds that the approach has been used successfully in developmental biology
    to identify differentiation pathways from complex single-cell gene expression datasets, relies on
    dimensionality reduction, is agnostic to existing classification criteria or biases, and can be used
    to reconstruct a temporal atlas of pathogenesis and healing.
- id: aireadi:task-hypothesis-agnostic
  name: Hypothesis-agnostic multimodal AI/ML model development
  response: The dataset supports general AI/ML model development across more than ten health domains rather
    than one predefined task; the protocol was deliberately designed to be agnostic to hypotheses.
  description: The BMJ Open protocol states that the multidisciplinary team designed the protocol so that
    it is agnostic to hypotheses, assembling assessments from many health domains likely to be affected
    by T2DM. The healthsheet states that no labelling was performed because the dataset is hypothesis-agnostic
    and aimed at facilitating multiple potential downstream AI/ML applications.
addressing_gaps:
- id: aireadi:gap-ai-ready-data
  name: Absence of AI-ready multimodal T2DM data
  response: The ability to understand and affect the course of complex multi-organ diseases such as T2DM
    has been limited by a lack of well-designed, high quality, large and inclusive multimodal datasets
    that are ready for AI training.
- id: aireadi:gap-demographic-representation
  name: Under-representation of racialised groups in T2DM research
  response: Samples in previous T2DM epidemiological studies and clinical trials lacked racial and ethnic
    diversity, despite a disproportionate disease burden in those populations; the cohort is therefore
    recruited to be balanced rather than to mirror the demographic distribution of the US population.
  description: The BMJ Open protocol cites a meta-epidemiological review of T2DM studies published from
    2000 to 2020 finding that samples lacked racial and ethnic diversity, and describes AI-READI as an
    important step forward in addressing these demographic inequities in research.
- id: aireadi:gap-balanced-severity
  name: Absence of data balanced across diabetes severity
  response: Existing large datasets for AI/ML training are not balanced across T2DM severity, so the cohort
    is triple-balanced by self-reported race/ethnicity, T2DM presence and severity, and biological sex
    to support unbiased model development.
