id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: A multimodal, cross-sectional human research dataset collected by the Artificial Intelligence
  Ready and Equitable/Exploratory Atlas for Diabetes Insights (AI-READI) project, one of four Data Generation
  Projects of the NIH Common Fund Bridge2AI program. The dataset holds data from individuals with and
  without type 2 diabetes mellitus (T2DM), harmonised across three US data collection sites (University
  of Alabama at Birmingham, University of California San Diego, and University of Washington), and is
  intended to support artificial intelligence and machine learning research into salutogenesis - the pathway
  from T2DM back to health. Release 3.0.0, the release this record describes, contains data from 2,280
  participants collected between 19 July 2023 and 1 May 2025, comprising 356,343 files and approximately
  3.82 TB. Per-participant content spans survey data, physical measurements, clinical laboratory results
  mapped to the OMOP Common Data Model, 12-lead electrocardiography in WFDB format, retinal photography,
  OCT, OCTA and fluorescence lifetime imaging ophthalmoscopy in DICOM, continuous glucose monitoring and
  wearable activity data in Open mHealth format, and custom environmental sensor readings. The dataset
  is organised according to the Clinical Dataset Structure (CDS) v0.1.1 and distributed through the FAIRhub
  platform. Two access tiers exist at each release - a public set stripped of protected health information
  and of sex, race/ethnicity and medication fields, and a controlled-access set that additionally contains
  5-digit ZIP code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and
  traffic and accident reports.
