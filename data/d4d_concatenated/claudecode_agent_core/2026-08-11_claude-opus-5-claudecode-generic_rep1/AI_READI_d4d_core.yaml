- id: aireadi:instance-participant
  name: Participant record
  instance_type: individual study participant
  data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D003924
  counts: 2280
  label: false
  description: 'Each instance represents an individual participant and consists of all data available
    for that person. Multiple modalities are held per participant: survey data, clinical data, retinal
    imaging data, environmental sensor data, continuous glucose monitor data and wearable activity monitor
