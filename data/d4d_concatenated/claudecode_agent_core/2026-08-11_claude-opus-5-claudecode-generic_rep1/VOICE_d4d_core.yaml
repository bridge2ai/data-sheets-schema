purposes:
- id: d4d:VOICE-purpose-flagship-dataset
  name: Build a flagship ethically sourced voice dataset
  response: To create a flagship, standardized and ethically sourced dataset of 10,000 voices linked to
    health information, to fuel research and discovery in voice biomarkers, as the Precision Public Health
    grand challenge project of the NIH Common Fund Bridge2AI program.
- id: d4d:VOICE-purpose-close-data-gap
  name: Close the gap in large-scale clinical voice data
  response: To address a gap in the availability of large-scale, diverse and well-documented voice data
    for clinical machine-learning applications. Previous studies on machine learning-based voice diagnosis
    produced promising results, but their sample sizes were too small, or they lacked the key metadata
    needed for training robust, clinically useful models.
- id: d4d:VOICE-purpose-voice-as-biomarker
  name: Establish voice as a biomarker of health
  response: To facilitate the use of voice as a non-invasive, cost-effective biomarker for the screening,
    diagnosis and monitoring of a wide range of health conditions, and to promote the integration of voice
    as a biomarker of health into clinical care.
- id: d4d:VOICE-purpose-standards-and-infrastructure
  name: Establish audiomics standards and infrastructure
  response: To introduce the field of acoustic biomarkers by developing new standards of acoustic and
    voice data collection and analysis for voice AI research, to develop software and cloud infrastructure
    for automated voice data collection, and to build interoperable bioinformatics standards for voice
    data.
tasks:
- id: d4d:VOICE-task-model-development
  name: Develop, benchmark and validate clinical voice AI models
  response: To enable the development, benchmarking or validation of clinically applicable machine-learning
    models for diagnosing a wide range of health conditions using voice data, including vocal pathologies
    and neurological, psychiatric and respiratory disorders.
- id: d4d:VOICE-task-disease-detection-classification
  name: Disease detection and classification from voice
  response: The predefined tasks that accompany the release are primarily designed for training machine-learning
    models for disease detection and classification using voice data, with labels drawn from diagnostic
    categories including vocal pathologies, neurological disorders, psychiatric conditions and respiratory
    disorders.
- id: d4d:VOICE-task-predictive-models
  name: Build predictive models for screening, diagnosis and treatment
  response: To build predictive models that assist in the screening, diagnosis and treatment of a broad
    range of diseases, several of which have unmet clinical needs.
addressing_gaps:
- id: d4d:VOICE-gap-sample-size-and-metadata
  name: Small samples and missing metadata in prior voice AI research
  response: Existing literature on voice-based machine learning has been studied only on small- to medium-sized
    datasets, often with limited data outside acoustic measures and not linked to multi-modal health data.
    Reviews of machine learning applications for laryngeal cancer found most studies reported training
    datasets of fewer than 300 patients and only two used more than one data modality. The dataset addresses
    this by providing a large, diverse, multi-modal collection with linked clinical metadata.
- id: d4d:VOICE-gap-collection-standards
  name: Absence of standards for voice and acoustic data collection
  response: Comparing studies and pooling data is challenging because of a lack of existing standards
    in how voice and other acoustics are measured and collected. The consortium addresses this by publishing
    standardized multi-disorder acquisition protocols, a shared REDCap instrument library, and new bioinformatics
    standards for voice data.
- id: d4d:VOICE-gap-private-industry-datasets
  name: Private industry datasets that cannot be audited
  response: Within industry, voice datasets are often private, limiting the ability to audit machine-learning
    models and the accuracy of training data labels, and industry data lacks accurate clinical or demographic
    information. A publicly available, ethically sourced database with clinician-validated diagnoses gives
    the research community access to voice data without reliance on the private sector.
- id: d4d:VOICE-gap-ethical-governance
  name: Unresolved ethical, legal and social questions in voice AI
  response: The consortium addresses the growing ethical, legal and social challenges surrounding voice
    AI, including risks of voice re-identification, vulnerabilities such as voice AI hacking, concerns
    around voice data sharing and privacy, and the influence of gender and racial diversity on the development
    and application of these technologies, by developing new guidelines for consenting to voice data collection
    and sharing.
creators:
- id: d4d:VOICE-creator-consortium
  name: Bridge2AI-Voice Consortium
  description: A collaborative multi-institutional consortium that generates the dataset on behalf of
    the NIH Common Fund Bridge2AI program. The consortium gathered multidisciplinary experts from North
    American institutions, and the healthsheet records that more than 50 other investigators, clinicians,
    scholars and trainees contributed to the development of the dataset. The curators and generators include
    clinicians and healthcare professionals, biomedical researchers in clinical medicine, neurology and
    psychiatry, machine learning and AI specialists, data scientists and statisticians, social scientists
    and ethicists, and engineers and technologists.
