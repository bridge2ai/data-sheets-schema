source_caveats: 'The declared bundle documents several releases of the same PhysioNet project (1.1, 3.0.0
  and 3.1.0) alongside a project healthsheet and documentation site written for version 2.0.0. This record
  describes the dataset as of version 3.1.0 and marks, in the source_caveats of the individual objects,
  the places where an earlier-release statement disagrees with the current one. Two grant-number strings
  in the bundle are corrupted by extraction ("Award #3Tf-OTOD03272001S2" in the documentation site footer
  and "3TF-OT2ActfOD032720Projectf01S1" in the healthsheet); the core project number OT2OD032720 is consistent
  across the remaining sources. Contact email addresses on the documentation site are redacted in the
  preprocessed source as "[email protected]" and are therefore not recorded. The bundle also contains
  the PhysioNet page for the Bridge2AI-Voice Pediatric Dataset, a separate project recorded here under
  related_datasets rather than merged into this record.'
