    describes 50 multidisciplinary experts from 12 North American institutions, while the feasibility
    publication says the app development group consisted of researchers from 14 different institutions
    and additionally names Florida Atlantic University, the University of Central Florida, UT Health Houston
    and Dalhousie University among member affiliations. The IRB protocol names a partly different set
    of participating institutions, adding Massachusetts Eye and Ear and Emory University.
