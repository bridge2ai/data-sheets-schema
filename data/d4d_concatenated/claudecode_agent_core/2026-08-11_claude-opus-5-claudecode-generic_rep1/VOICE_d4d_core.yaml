id: https://doi.org/10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'Bridge2AI-Voice is an ethically sourced, demographically diverse voice dataset linked to
  health information, generated by the Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI
  program and published on PhysioNet under registered access. Version 3.1.0, released 1 May 2026, contains
  data for 833 adult participants collected across five sites in North America. Participants were selected
  on the basis of known conditions that manifest within the voice waveform: voice disorders, neurological
  and neurodegenerative disorders, mood and psychiatric disorders, and respiratory disorders, together
  with control participants. The release contains data considered low risk: derived audio features computed
  from the recordings, including spectrograms, Mel spectrograms, Mel-frequency cepstral coefficients,
  pitch and loudness contours, articulatory estimates and phonetic posteriorgrams, but not the original
  voice recordings. Detailed demographic, clinical and validated questionnaire data are made available
  alongside the features, plus per-recording metadata and audio quality metrics. Files are distributed
  as Apache Parquet and tab-separated values with JSON data dictionaries in a Brain Imaging Data Structure
  v1.9.0 layout. The dataset is intended to enable development, benchmarking and validation of clinically
  applicable machine-learning models that use voice as a biomarker of health.'
distributions:
- id: d4d:VOICE-file-torchaudio-spectrogram
  name: torchaudio_spectrogram.parquet
  path: features/torchaudio_spectrogram.parquet
  description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier Transform with
    a 25 ms window size, 10 ms hop length and a 400-point FFT, then downsampled by a factor of two in
    the time domain. Contains 29,278 records in v3.1.0 (29,020 in v3.0.0).
- id: d4d:VOICE-file-torchaudio-mel-spectrogram
  name: torchaudio_mel_spectrogram.parquet
  path: features/torchaudio_mel_spectrogram.parquet
  description: Mel spectrograms of dimension 60xT generated with a 25 ms window size, 10 ms hop length,
    a 400-point FFT and 60 Mel bins. Contains 29,278 records in v3.1.0.
- id: d4d:VOICE-file-torchaudio-mfcc
  name: torchaudio_mfcc.parquet
  path: features/torchaudio_mfcc.parquet
  description: Mel-frequency cepstrum coefficients of dimension 60xT computed with the same parameters
    as the Mel spectrograms. Contains 29,278 records in v3.1.0.
- id: d4d:VOICE-file-torchaudio-pitch
  name: torchaudio_pitch.parquet
  path: features/torchaudio_pitch.parquet
  description: Detected pitch (fundamental frequency) over time, of dimension T, with a minimum and maximum
    pitch of 80 and 500 respectively. Contains 32,522 records in v3.1.0.
- id: d4d:VOICE-file-sparc-ema
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
  description: 'Estimated electromagnetic articulography produced by a deep learning model, of dimension
    Tx12, where the twelve values are the X and Y positions of six articulators: tongue dorsum, tongue
    body, tongue tip, lower incisor, upper lip and lower lip. Contains 28,640 records in v3.1.0.'
- id: d4d:VOICE-file-sparc-loudness
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
  description: Estimated loudness based on the average absolute amplitude of the audio waveform, of size
    T, using 20 ms windows. Contains 31,855 records in v3.1.0.
- id: d4d:VOICE-file-sparc-periodicity
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
  description: Estimated periodicity, the confidence of pitch presence, derived from the audio using 20
    ms windows, of dimension T. Contains 31,872 records in v3.1.0.
- id: d4d:VOICE-file-sparc-pitch
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
  description: Estimated fundamental frequency of the audio signal computed with a different algorithm
    from torchaudio_pitch, with a range of 50-550 Hz and dimension T. Contains 31,872 records in v3.1.0.
- id: d4d:VOICE-file-ppgs
  name: ppgs.parquet
  path: features/ppgs.parquet
  description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a dimension of
    40xT with a frame rate of 100 Hz. Contains 29,289 records in v3.1.0.
- id: d4d:VOICE-file-static-features
  name: static_features.tsv
  path: features/static_features.tsv
  format: TSV
  media_type: text/tab-separated-values
  description: Static features derived from the raw audio, one row per unique recording, including features
    from openSMILE, Praat, parselmouth and torchaudio. The accompanying data dictionary describes each
    feature.
- id: d4d:VOICE-file-audio-quality-metrics
  name: audio_quality_metrics.tsv
  path: features/audio_quality_metrics.tsv
  format: TSV
  media_type: text/tab-separated-values
  description: Quality-control metrics derived from the raw audio, one feature per audio recording. Added
    in v3.1.0.
- id: d4d:VOICE-files-metadata
  name: Recording metadata
  path: metadata/
  description: A binary Parquet file and its corresponding data dictionary carrying information about
    each recording, including the task instructions and prompts presented to the participant and information
    about the microphone used and its gain. Per-audio metadata was released for the first time in v3.1.0.
