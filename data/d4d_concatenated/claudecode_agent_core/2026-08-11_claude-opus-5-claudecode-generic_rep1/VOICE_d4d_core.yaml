instances:
- id: d4d:VOICE-instance-participant
  name: Participant
  instance_type: A person. Each participant contributes one or more recording sessions, and each session
    contributes multiple audio recordings, one per acoustic task. Phenotype files carry one row per participant
    per visit, and feature files carry one row per recording, keyed by participant identifier, session
    identifier and task name.
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant. Labels
    are the diagnostic categories - vocal pathologies, neurological disorders, psychiatric conditions
    and respiratory disorders, plus controls - recorded in the per-condition files under phenotype/diagnosis
    and assigned following the Bridge2AI protocols and ICD-10 codes.
  description: Version 3.1.0 contains data for 833 participants across five sites in North America. The
    project documentation reports approximately 61,937 voice-derived recordings from 833 adult participants
    for version 3.0. Because participants may have repeated visits, there may be more than one row per
    participant in the data files, and there is no requirement that a participant give the same response
    at each visit.
  missing_information:
  - id: d4d:VOICE-missing-info-instances
    name: Information absent from individual instances
    missing:
    - Responses to optional questionnaire items
    - Responses to instruments outside a participant's primary diagnostic category
    - Original voice recordings and waveform audio
    - Spectrograms, Mel spectrograms, MFC coefficients, phonetic posteriorgrams and electromagnetic articulography
      estimates for sensitive records and audio checks
    - Derived features for some recordings
    - State and province of data collection
    - Externally sourced multimodal data such as imaging, genomic and other EHR data
    why_missing:
    - Some questions are optional.
    - Each individual answered a common set of questions and then responded to additional questions relevant
      to their primary diagnostic category.
    - Raw audio was withheld from the release to limit re-identification risk and is distributed only
      under controlled access.
    - Removed from v3.1 as part of the de-identification of sensitive records.
    - Some files, whether due to length or other issues, could not generate certain features and so are
      not included in the bundled data.
    - Removed under HIPAA Safe Harbor de-identification; country of data collection was retained.
    - Multimodal data is extracted from the sites independently and uploaded through the REDCap database;
      the documentation states that no external data is released in the v3.0.0 release.
  source_caveats: The healthsheet, written for v2.0.0, states "There are currently around 833 instances"
    and gives 833 patients; the PhysioNet v3.0.0 and v3.1.0 pages also give 833 participants, and v3.1.0
    adds no new participants. The earlier v1.1 page describes 12,523 recordings for 306 participants in
    the initial v1.0 release. Recording-level counts differ between feature files within a single release
    because not every recording yields every feature.
sampling_strategies:
- id: d4d:VOICE-sampling-strategy
  name: Non-probability clinic-based sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data: Patients and healthy volunteers presenting at high-volume expert clinics and other specialty
    clinics at the participating North American institutions, screened for membership in five predetermined
    disease groups - respiratory disorders, voice disorders, neurological disorders, mood disorders and
    pediatric voice and speech disorders - together with participants without those conditions who serve
    as controls.
  why_not_representative: The data is not representative because it was collected at a limited number
    of geographic locations.
  strategies: Non-probability sample. Charts of patients presenting at high-volume expert clinics were
    screened against per-cohort inclusion and exclusion criteria before the clinic day; eligible patients
    were offered enrollment. Recruitment also used flyers in well-trafficked areas, QR codes linking to
    a secure REDCap screening survey, waiting room approaches at approved facilities, social media platforms,
    the project websites, and the FlowTrials platform. Where specific diagnoses or severities were under-represented,
    participants were identified by medical record review based on voice-disorder related diagnostic codes.
    A plan for enhancing diverse perspectives governs enrollment of participants from socially and economically
    disadvantaged and underserved populations.
  description: The released data is a sample of a larger, ongoing collection. The consortium states it
    hopes to make the sample more representative by shifting to remote collection and designing the recruiting
    approach to control for more variables.
anomalies:
- id: d4d:VOICE-anomaly-site-configuration
  name: Site-to-site variation and protocol change
  anomaly_details: Different sites have different collection configurations, and the collection protocol
    changed over the course of the study. Distinct iPad devices were used at each site, and the head-mounted
    headset microphone could be at slightly different distances from the speaker. Clinical diagnosis,
    depending on the disorder, was performed by one clinician or based on an electronic health record
    or prescription.
- id: d4d:VOICE-anomaly-confounders
  name: Noise and response-quality confounders
  anomaly_details: Confounding factors present in the data include noise artifacts, variations in diagnostic
    practices, inaccurate questionnaire responses and underreporting.
- id: d4d:VOICE-anomaly-missing-features
  name: Recordings for which features could not be generated
  anomaly_details: Some files, whether due to length or other issues, could not generate certain features
    and so are not included in the bundled data. As a result the number of records differs between feature
    files within the same release, from 28,640 for articulatory estimates to 32,522 for pitch in v3.1.0.
- id: d4d:VOICE-anomaly-unaudited-model-outputs
  name: Unaudited automated derivations
  anomaly_details: Certain aspects of the data, for example transcription, were generated using off-the-shelf
    models that have not been audited for correctness.
- id: d4d:VOICE-anomaly-parquet-corruption
  name: Corrupted parquet files in the previous release
  anomaly_details: Version 3.0.0 shipped broken parquet files, which were fixed in version 3.1.0. Version
    2.0 reprocessed spectrograms to fix minor issues identified in the previous release.
known_biases:
- id: d4d:VOICE-bias-geographic-representation
  name: Limited geographic coverage
  bias_type: representation_bias
  bias_description: The dataset is a sample of a larger, ongoing collection and is not representative,
    because it was collected at a limited number of geographic locations. Version 3.1.0 covers five recording
    sites in North America, in the USA and Canada.
  mitigation_strategy: The consortium intends to make the sample more representative by shifting to remote
    collection and by designing the recruiting approach in a way that controls for more variables.
  affected_subsets:
  - Participants recruited at the five North American collection sites
- id: d4d:VOICE-bias-recruitment-trust
  name: Recruitment bias against less-proximal and lower-trust groups
  bias_type: selection_bias
  bias_description: Groups that have less trust in the medical system or in AI, or that are less proximal
    to the collection sites, would have been less likely to be recruited.
  affected_subsets:
  - Populations distant from the participating academic medical centres
  - Populations with lower trust in medical institutions or in artificial intelligence
- id: d4d:VOICE-bias-device-cohort-confounding
  name: Device and cohort confounding
  bias_type: measurement_bias
  bias_description: Participants were screened for different disorders based on site, so they also had
    their data collected with different devices. Distinct iPad devices were used at each site, which confounds
    device characteristics with disease cohort.
  affected_subsets:
  - Disease cohorts recruited predominantly at a single site
- id: d4d:VOICE-bias-cohort-skew
  name: Skew across disorder category, site and demographics
  bias_type: sampling_bias
  bias_description: The dataset has skews based on disorder category, site and other demographic factors.
    The public data releases do not contain an equal distribution of the five disease cohort categories.
  mitigation_strategy: Users should consider the multivariate distribution when assessing utility for
    different questions. Further releases will contain additional data.
  affected_subsets:
  - Under-represented disease cohort categories
- id: d4d:VOICE-bias-english-only
  name: English-language restriction
  bias_type: selection_bias
  bias_description: English was the only language used for communication with study participants, and
    the only language option for the collection application at the time of the v2.0.0 release. Participants
    who do not read or speak English were excluded, so the released cohort contains fluent English speakers.
  mitigation_strategy: Spanish versions of the protocol are under development, and the IRB protocol was
    updated in February 2025 to include data collection from Spanish-language speakers; Spanish protocols
    and data collection are to be included in future releases.
  affected_subsets:
  - Speakers of languages other than English
known_limitations:
- id: d4d:VOICE-limitation-cohort-imbalance
  name: Unequal representation of the disease cohort categories
  limitation_type: coverage_limitation
  limitation_description: The public data releases do not contain an equal distribution of the five disease
    cohort categories. The v3.x abstract names four of the five categories - voice, neurological, mood
    and respiratory disorders - as the basis for participant selection in the adult release.
  scope_impact: Analyses that assume balanced cohorts, or that require adequate power within a specific
    category, may not be supportable from a single release.
  recommended_mitigation: Inspect the per-condition diagnosis files before selecting a cohort and consider
    the multivariate distribution across disorder category, site and demographics.
- id: d4d:VOICE-limitation-no-raw-audio
  name: Derived features only, no original recordings
  limitation_type: scope_limitation
  limitation_description: The published PhysioNet project contains derived features from the audio waveforms
    and not the original voice recordings. Work that requires the waveform itself cannot be done from
    this release.
  scope_impact: Methods that depend on the raw signal, or on features other than those precomputed here,
    are out of scope for the registered-access release.
  recommended_mitigation: 'Request raw audio through the controlled-access process: a Data Access Request
    Form, a Data Use Agreement, review by the Data Access Compliance Office and a signed Data Transfer
    and Use Agreement, after which data is made available via Synapse.'
- id: d4d:VOICE-limitation-representativeness
  name: Five sites and one language
  limitation_type: representativeness_limitation
  limitation_description: Data comes from five recording sites in the USA and Canada and from fluent English
    speakers only, so the cohort does not represent the wider population.
  scope_impact: Models trained on this release may not generalise to other geographies, health systems
    or languages.
  recommended_mitigation: Treat external validation on independent cohorts as necessary, and track the
    planned expansion to remote collection and Spanish-language protocols.
- id: d4d:VOICE-limitation-distribution-shift
  name: Distribution shift over the collection period
  limitation_type: temporal_limitation
  limitation_description: Changes in diagnostic criteria or practices over the course of the study could
    be a source of distribution shift, and the collection protocol itself changed during the study.
  scope_impact: Label semantics and acquisition conditions are not constant across the collection period.
  recommended_mitigation: Use the session and recording metadata to account for collection period and
    site when modelling.
- id: d4d:VOICE-limitation-no-splits
  name: No recommended data splits
  limitation_type: methodological_limitation
  limitation_description: There are no predefined recommended data splits for training, validation or
    testing. Researchers are encouraged to create their own splits based on their specific requirements.
  scope_impact: Results reported by different groups are not directly comparable unless they publish their
    split construction.
  recommended_mitigation: Publish the exact split construction alongside any model or result, and account
    for repeated sessions from the same participant when splitting.
- id: d4d:VOICE-limitation-no-external-modalities
  name: Multimodal data not included in the release
  limitation_type: integration_limitation
  limitation_description: The wider study collects imaging, genomic data for the neurological cohort,
    laryngoscopy imaging and other EHR data independently at each site for upload through the REDCap database,
    but the documentation states that no external data is released in the v3.0.0 release.
  scope_impact: Multi-omic and image-plus-voice analyses cannot be performed from the released files alone,
    despite the project's multimodal design.
- id: d4d:VOICE-limitation-data-quality-criterion
  name: Data quality criterion unmet in the project's own AI-readiness rating
  limitation_type: methodological_limitation
  limitation_description: In the project's self-assessment against the Bridge2AI AI-readiness criteria,
    the Data Quality criterion under Characterization scores 0, giving that category 80 per cent. Domain-appropriate
    and Associated under Sustainability also score 0, giving 50 per cent, and Contextualized under Computability
    scores 0, giving 75 per cent.
  scope_impact: The project itself does not claim full AI-readiness on data quality, sustainability or
    contextualization.
confidential_elements:
- id: d4d:VOICE-confidentiality
  name: Confidential content in the released files
  confidential_elements_present: false
  confidentiality_details: 'The project healthsheet answers "No" to whether the dataset contains data
    that might be considered confidential, such as data protected by legal privilege or doctor-patient
    confidentiality. Identifiable information under HIPAA and the Common Rule, as well as data considered
    sensitive, has been removed. Access is nonetheless restricted: only credentialed users who sign the
    data use agreement can access the files.'
  source_caveats: The healthsheet's "No" describes the registered-access feature-only release. The Data
    Transfer and Use Agreement, which governs the controlled-access raw audio, describes the Data it covers
    as Personally Identifiable Information as defined in OMB Memorandum M-07-16 and records that it is
    covered by a Certificate of Confidentiality. The two statements describe different distributions of
    the project's data.
content_warnings:
- id: d4d:VOICE-content-warning-free-speech
  name: Free-speech transcription content
  content_warnings_present: true
  warnings:
  - Transcriptions of free speech tasks may contain offensive, insulting, threatening or otherwise distressing
    language. The inclusion of such content is unlikely but cannot be completely avoided, as research
    participants are responsible for their choice of language.
  source_caveats: The statement is taken from the healthsheet, which describes the v2.0.0 release and
    says the dataset includes the transcription of free speech tasks. The v3.0.0 and v3.1.0 release documentation
    states that all spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs and PPGs from open-response
    prompts were removed from the feature-only dataset, and the v1.1 documentation states that transcripts
    of free speech audio were removed. Whether free-speech transcriptions remain in the current release
    is not settled by the sources.
subpopulations:
- id: d4d:VOICE-subpopulations
  name: Demographic and disease-cohort subpopulations
  subpopulation_elements_present: true
  identification: Demographic subpopulations are identified by age, gender, sex, ethnicity and socioeconomic
    status, collected through the demographic questionnaire, which also records primary language, education
    level, employment status, self-reported disability and other characteristics that may affect voice
    and speech. Participants are separately grouped by disease cohort category - voice disorders, neurological
    and neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and controls
    - with cohort membership expressed through the per-condition files under phenotype/diagnosis.
  description: Detailed demographic data is collected through the application, including age, sex, gender,
    race and ethnicity and language, together with confounders and social habits known to affect voice
    and speech such as smoking and hydration status. The protocol also asks about disabilities.
  source_caveats: No distribution of instances across the identified subpopulations is given in the sources.
    The documentation states only that the public data releases do not contain an equal distribution of
    the disease cohort categories, and the healthsheet reports skews by disorder category, site and demographic
    factors without counts.
sensitive_elements:
- id: d4d:VOICE-sensitive-elements
  name: Sensitive attributes in the dataset
  sensitive_elements_present: true
  sensitivity_details: The healthsheet records that the dataset includes race information, sexual orientation
    information, and socioeconomic and health information. Voice itself is a biometric that the protocol
    acknowledges can never be fully de-identified. Fields encoded as sensitive in the REDCap data dictionary,
    under the column "Identifier?", were removed from the dataset at the v3.0.0 de-identification stage,
    together with non-identifying elements revealing highly sensitive information such as household income,
    mental health status and traumatic life experiences.
acquisition_methods:
- id: d4d:VOICE-acquisition
  name: How instance data was acquired
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details: Data was both directly observable and reported by subjects. Acoustic data - voice,
    speech, cough and breathing - was recorded directly through a custom application on a tablet with
    a head-mounted microphone, following a standardized protocol of acoustic tasks. Demographic information,
    confounder questions and validated questionnaires were self-reported by the participant through the
    same application. Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data,
    looking at electronic health records, or medication prescriptions, against per-cohort gold-standard
    validation methods. The values distributed in the features folder are computationally derived from
    the raw waveforms rather than observed directly.
collection_mechanisms:
- id: d4d:VOICE-collection-mechanism-app
  name: Bridge2AI-Voice application on a tablet
  mechanism_details: Data collection was conducted using a custom application on a tablet, with a headset
    used for data collection when possible. The healthsheet records that data is collected on iPads (9th
    or 10th generation) and iPad Air (5th generation) using an Avid AE-36 microphone and an Apple dongle
    to connect it to the iPad, and that distinct iPad devices were used at each site. A total of 22 acoustic
    tasks are recorded through the app, spanning non-voice/non-speech tasks such as respiration and voluntary
    cough, voice without speech tasks such as prolonged vowel, maximum phonation time, glides, loudness
    and diadochokinesis, and speech tasks such as the Rainbow Passage, the Caterpillar Passage, CAPE-V
    sentences, free speech, picture description, story recall, animal fluency, the word-colour Stroop,
    productive vocabulary, random item generation and the Cinderella story. The collection application
    includes models to ensure acoustic data quality, including volume standardization and noise cancellation.
  description: 'Validation of the mechanism: the app underwent continuous alpha- and beta-testing, and
    a separate pilot feasibility study at the University of South Florida Health Voice Center assessed
    task performance metrics and participant feedback for the application.'
- id: d4d:VOICE-collection-mechanism-redcap
  name: REDCap electronic data capture
  mechanism_details: Demographic, confounder, questionnaire, clinical validation and diagnosis data were
    entered into a REDCap database as part of the case report form. The supporting REDCap data dictionary,
    metadata and instrument PDFs are published, and the full data acquisition protocols are available
    in the REDCap instrument Shared Library and for download from the project's REDCap repository. Access
    to REDCap is password protected with individual usernames, behind the institutional HIPAA firewall.
  used_software:
  - id: https://github.com/eipm/bridge2ai-redcap
    name: Bridge2AI Voice REDCap
    license: MIT
    url: https://github.com/eipm/bridge2ai-redcap
- id: d4d:VOICE-collection-mechanism-remote
  name: Remote collection through web and iOS applications
  mechanism_details: The protocol provides for collection through two platforms in addition to in-clinic
    collection, the Bridge2AI Voice Web app and the Bridge2AI Voice iOS app. The iOS app is restricted
    to iOS-compatible devices, while the web app can run on a computer, tablet or phone. No software is
    downloaded or installed, no login is required, and data is stored only during the collection phase
    and removed as soon as the page is closed. Both apps are HIPAA compliant and send data over a secure
    HTTPS protocol to a HIPAA-compliant storage server hosted with an NIH STRIDES partner.
  source_caveats: The project documentation states that future data collection will also occur remotely
    but that remote data collection did not occur for the initial dataset release; the sources do not
    say whether any remote collection contributed to v3.1.0.
data_collectors:
- id: d4d:VOICE-data-collector-research-team
  name: Site research teams
  role: Research staff
  collector_details: Research teams, which may include medical, graduate or undergraduate students, coordinated
    with clinicians and doctors to identify appropriate participants. Data is collected in the clinic
    with the assistance of a trained research assistant, who conducts the consent process, introduces
    the application and supervises the session. Hospital staff were not involved in scheduling but assisted
    in the logistics of coordinating data collection. Clinicians and doctors were listed under the IRB
    as co-investigators and were added to the consortium so that their names are included on consortium-level
    publications that emerge from the research; the healthsheet records this consortium authorship as
    their compensation.
- id: d4d:VOICE-data-collector-clinician
  name: Site clinicians
  role: Clinician
  collector_details: At each site, a local clinician provided the diagnosis based on a clinical interview
    and appropriate work-up. For the psychiatric disorders cohort, the assessment was determined by using
    the participant's EHR record or an active prescription, outside of data collection, by an appropriately
    licensed clinician. Clinical validation is performed by a qualified physician or practitioner based
    on established gold standards for diagnosis.
- id: d4d:VOICE-data-collector-technical-team
  name: Acoustic engineers and AI data scientists
  role: Quality control
  collector_details: The team hired two acoustic engineers and three AI data scientists to analyse all
    samples from the year one exploratory data collection phase to ensure acoustic quality and machine-learning
    readiness. In each subsequent year of the study, 10 per cent of the data is selected at random every
    month for quality control and ML readiness.
collection_timeframes:
- id: d4d:VOICE-collection-timeframe
  name: Collection period
  timeframe_details: The healthsheet states that the data was collected over a period of 12 months. The
    underlying study is a four-year prospective cohort study; the NIH project runs from 1 September 2022
    to 30 November 2026. The IRB protocol is dated 17 January 2023 for V1 with revisions recorded through
    V13 on 11 July 2025. Phase 1 exploratory data collection was completed in November 2023 and phase
    2 pilot collection began in November 2023 and was ongoing in November 2024. The collection timeframe
    matches the creation timeframe of the underlying data, which is recorded prospectively at the point
    of the participant encounter.
  source_caveats: No start or end date is given in the sources for the collection window of the released
    cohort, and the healthsheet's 12-month statement describes the v2.0.0 release rather than v3.1.0.
    Dates finer than year resolution were removed from the data as part of HIPAA Safe Harbor de-identification,
    so the collection window cannot be recovered from the released files.
missing_data_documentation:
- id: d4d:VOICE-missing-data-documentation
  name: Missing data patterns and handling
  missing_data_patterns: Phenotype data files only contain rows for a participant if at least one column
    is not missing. Each individual answered a common set of questions and then responded to additional
    questions relevant to their primary diagnostic category, so coverage of condition-specific instruments
    follows cohort membership rather than being uniform. Because participants may have repeated visits,
    there may be more than one row per participant, and there is no requirement that the participant give
    the same response at each visit, so participant information for the same data element may vary across
    the file. Feature files carry different numbers of records from one another because not every recording
    yields every feature.
  missing_data_causes: Some questions are optional; there may have been data collection irregularities
    that caused information to be missing from individual instances; some files, whether due to length
    or other issues, could not generate certain features; and spectrograms, Mel spectrograms, MFC coefficients,
    PPGs and EMAs for sensitive records and audio checks were removed from the release.
  handling_strategy: Missing values are left absent rather than imputed. The audit protocol generates
    missingness tables, and the healthsheet records that a missingness table is included with the dataset.
raw_data_sources:
- id: d4d:VOICE-raw-data-source-audio
  name: Original audio recordings
  source_description: Original voice, speech, cough and breathing audio recordings captured from participants
    during the standardized acoustic task protocol, using a custom application on a tablet with a head-mounted
    microphone, or the built-in tablet microphone where a headset could not be used.
  source_type: Audio recordings captured prospectively by a mobile data collection application
  access_details: The published PhysioNet project does not contain raw audios. Accessing raw audio is
    a more involved process and requires institutional sign-off; requests go to the access committee at
    DACO@b2ai-voice.org, and data is made available via Synapse at https://www.synapse.org/Synapse:syn72370534/.
  raw_data_format: WAV audio with JSON sidecars, laid out per the Brain Imaging Data Structure as sub-<participant_id>/ses-<session_id>/audio/sub<participant_id>_ses<session_id>_task-<task_name>.wav
- id: d4d:VOICE-raw-data-source-redcap
  name: REDCap questionnaire and clinical records
  source_description: Demographic, confounder, validated questionnaire, clinical validation and diagnosis
    responses captured during the participant encounter and entered into a REDCap database as part of
    the case report form, together with clinical data reviewed from the site electronic health record.
  source_type: REDCap electronic data capture, with review of the site electronic health record
  access_details: Raw REDCap exports are not distributed. The released phenotype folder contains the converted
    data. The supporting REDCap data dictionary, metadata and instrument PDFs are published at https://github.com/eipm/bridge2ai-redcap
    and archived on Zenodo.
  raw_data_format: REDCap export, converted to tab-delimited values by the b2aiprep library
ethical_reviews:
- id: d4d:VOICE-ethical-review-usf-irb
  name: University of South Florida Institutional Review Board
  reviewing_organization: University of South Florida Institutional Review Board
  review_details: Data collection and sharing was approved by the University of South Florida Institutional
    Review Board. The protocol, titled "Bridge2AI Voice Data Acquisition", was submitted to and approved
    by the USF Single IRB, and US participating institutions were integrated into that Single IRB process,
    each submitting review based on the Single IRB at USF. The protocol is dated V1, 17 January 2023,
    with a recorded revision history through V13, 11 July 2025, covering the addition of the pediatric
    cohort, compensation, electronic and remote consent, control data collection, new disease categories,
    remote enrollment and data collection platforms, Spanish-language collection and additional sites.
    The study is not for a drug product and not for a medical device, and no data monitoring committee
    was appointed. A partial HIPAA waiver was granted for recruitment and screening purposes only, limited
    to the study's inclusion criteria. The principal investigator named on the protocol is Yael Bensoussan,
    MD MSc FRCSC, Department of Otolaryngology - Head and Neck Surgery, University of South Florida, telephone
    (323) 509-6483, email yaelbensoussan@usf.edu.
  contact_person: Yael Bensoussan
- id: d4d:VOICE-ethical-review-canadian-reb
  name: Canadian research ethics boards
  reviewing_organization: Research ethics boards of Mount Sinai Hospital, The Hospital for Sick Children
    and the University of Toronto
  review_details: Canadian institutions do not follow the US Single IRB process and apply separately for
    research ethics board approval to comply with Canadian regulations; a copy of the approved REB is
    submitted to the USF IRB with their application. Genomic data is collected, managed and analysed only
    at the University of Toronto and Mount Sinai Hospital, under a separate protocol and separate REB
    approval, and no genomic data is collected at the USF site.
data_protection_impacts:
- id: d4d:VOICE-data-protection-impact
  name: Data protection impact analysis
  impact_details: 'The project healthsheet answers "No" to whether an analysis of the potential impact
    of the dataset and its use on data subjects has been conducted. Related ethical analysis exists but
    is not a data protection impact assessment: the de-identification review was carried out by a team
    of ethicists who identified the sensitive fields to be removed, and the consortium published a memorandum
    setting out the ethical justification for controlled access to raw voice data samples, explaining
    the reasoning behind the governance structure.'
human_subject_research:
  id: d4d:VOICE-human-subject-research
  name: Human subjects research status
  involves_human_subjects: true
  ethics_review_board: University of South Florida Institutional Review Board, acting as the single IRB
    of record for the US participating institutions, with separate research ethics board review at the
    Canadian participating institutions.
  irb_approval:
  - Approved by the University of South Florida Institutional Review Board; the clinical study was submitted
    and approved by the USF Single IRB and subsite IRBs through the Single IRB process.
  - Canadian participating institutions - Mount Sinai Hospital, The Hospital for Sick Children and the
    University of Toronto - obtained separate research ethics board approval, copies of which were submitted
    to the USF IRB.
  special_populations:
  - The adult cohort is restricted to participants aged 18 years or older, with a maximum age of 120;
    pediatric participants are enrolled only through the pediatric sites and not at USF, and are released
    as a separate dataset.
  - The protocol states that students, employees and wards of the state are neither specifically included
    nor excluded, and sets out a plan for enhancing diverse perspectives to enroll participants from socially
    and economically disadvantaged and underserved populations.
  regulatory_compliance:
  - HIPAA - identifiable information under HIPAA and the Common Rule was removed, the HIPAA de-identification
    rules were applied, and HIPAA Safe Harbor identifiers were removed from the released data.
  - 45 CFR 46 Common Rule - the study is conducted as human subjects research with informed consent and
    IRB oversight.
  - A partial HIPAA waiver was obtained for recruitment and screening purposes only, limited to the study's
    inclusion criteria, with identifiers destroyed at the earliest opportunity consistent with the conduct
    of the research.
  - A Certificate of Confidentiality covers the data governed by the Data Transfer and Use Agreement and
    must be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant.
  - Recipients of raw audio must adhere to the specific requirements of PhysioNet.org, managed by the
    MIT Laboratory for Computational Physiology.
informed_consent:
- id: d4d:VOICE-informed-consent
  name: Informed consent procedures
  consent_obtained: true
  consent_type: Prospective informed consent, obtained in writing on paper, electronically within the
    application or through a REDCap survey, or by video recording within the application.
  consent_documentation: Paper consent documents are uploaded and saved electronically in REDCap; electronic
    consent is housed in REDCap and is HIPAA compliant. All paper and electronic versions of consent are
    stored for a minimum of five years after the completion of the study, following required USF procedure.
    The USF IRB requires de-identified study data and original consent forms to be stored for a minimum
    of five years after study completion, and original paper consent documents cannot be destroyed until
    five years after study completion even if uploaded to the institutional platform.
  withdrawal_mechanism: Participants may withdraw from the study at any point. If a participant withdraws
    during or before the voice data collection, their data is not included in the database. Once the voice
    data collection process is completed, research data including voice recordings cannot be removed from
    the database.
  consent_scope: Participants consent to the collection of voice, speech and respiratory data linked to
    health information; to the sharing of research data that does not contain their direct identifiers
    with external researchers through a secure database; to registered-access release of data posing a
    low re-identification risk to the general public and controlled-access release of higher-risk data
    to authorized researchers; and to investigator access to medical information through EHR platforms
    for gold standard validation of diagnoses and symptoms. The consent does not restrict the data to
    non-commercial use, to a specific geographic location, to a specific type of research, to genetic
    research, or to research that does not develop methods or algorithms. Within the consent process individuals
    are also asked whether they agree to be contacted in the future for further voice data collection;
    contact details given for that purpose are stored within the institutional database only and are not
    shared or uploaded to the cloud.
at_risk_populations:
  id: d4d:VOICE-at-risk-populations
  name: At-risk population protections
  at_risk_groups_included: false
  description: Eligibility for the adult dataset is 18 years or older, with a maximum age of 120. Pediatric
    patients are enrolled only through the pediatric sites and not at USF, and the protocol notes that
    a checklist for children under 21 has been completed and appended. The protocol neither specifically
    includes nor excludes students, employees or wards of the state.
  special_protections:
  - Data collection is covered by a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas for identifying information or characteristics of
    a research participant.
  - The protocol identifies a specific risk that questions asked of participants from the mood disorders
    cohort - covering depression, anxiety and related conditions - can lead to discomfort and could trigger
    negative emotions.
  source_caveats: The governing IRB protocol also covers a pediatric cohort, for which parents or guardians
    provide consent and children give verbal assent where appropriate, with assent typically not sought
    below seven years of age. That cohort is enrolled only at the pediatric sites and released as the
    separate Bridge2AI-Voice Pediatric Dataset; its protections are therefore not recorded as protections
    of this dataset.
preprocessing_strategies:
- id: d4d:VOICE-preprocessing-audio-standardization
  name: Audio standardization
  preprocessing_details: Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
    with a Butterworth anti-aliasing filter applied. All released features are derived from this standardized
    audio.
- id: d4d:VOICE-preprocessing-feature-extraction
  name: Derived feature extraction
  preprocessing_details: 'From the standardized audio, several types of derived data were extracted. Spectrograms
    are time-frequency representations computed using the short-time Fast Fourier Transform with a 25
    ms window size, 10 ms hop length and a 400-point FFT, then downsampled by a factor of two in the time
    domain. Sixty Mel-frequency cepstral coefficients were extracted using those spectrograms, and Mel
    spectrograms were computed with the same parameters and 60 Mel bins. Articulatory features were generated
    with the Speech Articulatory Coding package, giving kinematic traces of vocal tract articulators and
    source features as well as measures of loudness, periodicity and pitch, all gathered at 50 Hz. Acoustic
    features were extracted using openSMILE, capturing temporal dynamics and acoustic characteristics,
    including eGeMAPS features per audio file. Phonetic and prosodic features were computed using Parselmouth
    and Praat, providing measures of fundamental frequency, formants and voice quality, and speech intelligibility
    metrics were computed for speech tasks. Phonetic posteriorgrams, a time-varying categorical distribution
    over acoustic units of speech at 100 Hz, were generated via the ppgs package. Transcriptions were
    generated using OpenAI''s Whisper Large model. The waveform-derived features are stored in two formats:
    a fixed feature format holding static features extracted from the entire waveform, and a temporal
    format that varies per audio file with the length of the recording. In the v1.1 release the spectrogram
    FFT size was 512 points and the spectrogram dimension 513xN; from v3.0.0 a 400-point FFT and a 201xT
    dimension are used.'
  used_software:
  - id: d4d:VOICE-software-opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, an open-source audio feature
      extractor used for the acoustic features and eGeMAPS feature set.
  - id: d4d:VOICE-software-praat
    name: Praat
    description: Acoustic analysis software used for phonetic and prosodic measures.
  - id: d4d:VOICE-software-parselmouth
    name: parselmouth
    description: A Python interface to Praat, used for phonetic and prosodic features.
  - id: d4d:VOICE-software-torchaudio
    name: torchaudio
    description: PyTorch audio processing library used for the spectrogram, Mel spectrogram, MFCC and
      pitch features.
  - id: d4d:VOICE-software-sparc
    name: Speech Articulatory Coding (sparc)
    description: Package used to generate kinematic traces of vocal tract articulators and source features,
      plus loudness, periodicity and pitch measures at 50 Hz.
  - id: d4d:VOICE-software-ppgs
    name: ppgs
    description: Package generating high-fidelity neural phonetic posteriorgrams at a 100 Hz frame rate
      over 40 phoneme categories.
  - id: d4d:VOICE-software-whisper
    name: OpenAI Whisper Large
    description: Automatic speech recognition model used to generate transcriptions.
- id: d4d:VOICE-preprocessing-conversion-and-organisation
  name: Export, conversion and BIDS organisation
  preprocessing_details: Data were exported and converted from REDCap using b2aiprep, an open source library
    developed by the team, which also merges the source data into the phenotype files; version 3.1.0 of
    the dataset was generated with b2aiprep v3.0.0. The raw audio files and the questionnaire data retrieved
    from ReproSchema-UI or exported from REDCap were converted to be compliant with the Brain Imaging
    Data Structure v1.9.0. In v3.0.0 the single phenotype data file was separated into individual per-instrument
    files and the files were reorganized; in v3.1.0 some phenotypic files were rearranged again and certain
    gold standard variable names were renamed.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
- id: d4d:VOICE-preprocessing-deidentification
  name: De-identification applied before release
  preprocessing_details: 'De-identification was performed as a preprocessing step before release: HIPAA
    Safe Harbor identifiers were removed, state and province were removed while country of data collection
    was retained, and spectrograms and similar features were excluded if the audio contained free speech,
    while static and other features that do not encode the sensitive information were retained. The healthsheet
    records that the data were extracted from the raw audio to limit re-identification and that only the
    extracted features are released.'
cleaning_strategies:
- id: d4d:VOICE-cleaning
  name: Cleaning and exclusion of records
  cleaning_details: 'The healthsheet states that there was no pre-processing for cleaning the data, and
    that no instances were excluded from the dataset at the time of preprocessing. Records were nonetheless
    withheld from the release on privacy grounds: raw audio transcripts were reviewed and any audio recordings
    containing potentially identifying information or external voices were removed from the release, and
    spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records and audio checks
    were removed from v3.1. The protocol also provides that a caregiver''s voice recorded inadvertently
    can be discarded either by re-recording manually during data collection or during data audit and postprocessing.'
  source_caveats: The healthsheet's "No" answers describe the v2.0.0 release and are in tension with the
    removals documented for v3.0.0 and v3.1.0. The removals described are exclusions made for privacy
    rather than quality cleaning, which is consistent with both statements if "cleaning" is read narrowly.
labeling_strategies:
- id: d4d:VOICE-labeling
  name: Clinician gold-standard diagnostic labelling
  data_annotation_platform: REDCap case report forms, including a clinical validation section completed
    at the collection site.
  data_annotation_protocol: 'Gold standard labels are available in the data, diagnosed by a clinician.
    Diagnostic labels are the result of a clinical assessment of the participant: at each site, a local
    clinician provided the diagnosis based on a clinical interview and appropriate work-up. For the psychiatric
    disorders cohort this assessment was determined by using the participant''s EHR record or an active
    prescription, which was done outside of data collection by an appropriately licensed clinician. Labellers
    followed the Bridge2AI protocols and ICD-10 codes. Per-cohort gold standard validation methods are
    specified in the protocol: laryngoscopy images and stroboscopy videos for the voice disorders cohort,
    with CT scan and spirometry added for unilateral vocal fold paralysis; spirometry, flow volume loops
    and CT of the neck and chest for airway stenosis, and spirometry and flow volume loops for chronic
    cough; brain CT, brain MRI and whole genome sequencing for the neurological and neurodegenerative
    cohort, with serum p-tau biomarkers added for Alzheimer''s disease; and electronic health summary,
    clinical diagnosis from a psychiatrist and medication history for the mood and psychiatric disorders
    cohort.'
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to it where the diagnostic
    assessment predated the study visit.
  labeling_details: 'A single labeller provides the label for each item, so no inter-annotator agreement
    can be computed. The healthsheet records that human-level performance in the applications the dataset
    is intended to address varies widely. Guidance for future work: the process for any new labels should
    be described alongside any release of a model or publication, and should include the exact variables
    used for the determination.'
raw_sources:
- id: d4d:VOICE-raw-sources
  name: Availability of the raw audio
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details: 'The raw data was saved in addition to the released features and is not accessible
    publicly. The published Bridge2AI-Voice Adult Dataset contains derived features from the audio waveforms
    and this PhysioNet project does not contain raw audios. Accessing raw audio requires institutional
    sign-off: a Data Access Request Form, a Data Use Agreement, submission to the Data Access Compliance
    Office for review and, on approval, a Data Use and Transfer Agreement signed by an authorized official
    at the recipient institution. Requests are made to the access committee at DACO@b2ai-voice.org, and
    data is made available via Synapse. Raw audio data is disseminated through controlled access only,
    to protect participants'' privacy.'
machine_annotation_tools:
- id: d4d:VOICE-machine-annotation-tools
  name: Automated transcription
  tools:
  - OpenAI Whisper Large unknown
  tool_descriptions: Transcriptions of the audio recordings were generated using OpenAI's Whisper Large
    model. The healthsheet records that certain aspects of the data, for example transcription, were generated
    using off-the-shelf models that have not been audited for correctness.
  source_caveats: No version identifier for the Whisper Large model is given in the sources, and no accuracy
    or performance metric for it is reported. Transcriptions from open-response prompts were removed from
    the feature-only dataset at v3.0.0.
existing_uses:
- id: d4d:VOICE-existing-uses
  name: Known prior uses
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
  description: 'Use of the dataset is expected to be acknowledged by citing the protocol development publication,
    Bensoussan et al., "Developing Multi-Disorder Voice Protocols: A team science approach involving clinical
    expertise, bioethics, standards, and DEI", Proc. Interspeech 2024, alongside the dataset citation.'
use_repository:
- id: d4d:VOICE-use-repository
  name: Repository of known uses
  repository_details: The project healthsheet answers "No" to whether there is a repository that links
    to papers or systems using the dataset, beyond Google Scholar. The documentation site maintains a
    publications section for consortium output, but no registry of third-party uses is published.
other_tasks:
- id: d4d:VOICE-other-tasks
  name: Further tasks the dataset could support
  task_details: Beyond disease detection and classification, the dataset can be used for AI model pretraining,
    fine-tuning, benchmarking or validation. The questionnaire features distributed in the phenotype folder
    can be used for cohort selection. The consortium also positions the resource as a foundation for establishing
    voice bioinformatic standards, developing infrastructure for audiomic data storage, and training clinicians
    and scientists in voice AI.
future_use_impacts:
- id: d4d:VOICE-future-use-impact-skew
  name: Skew in composition affecting downstream models
  impact_details: The dataset has skews based on disorder category, site and other demographic factors.
    Users should consider the multivariate distribution when assessing utility for different questions.
    Because participants were screened for different disorders based on site and had their data collected
    with different devices, models may learn site or device characteristics rather than disease signal.
- id: d4d:VOICE-future-use-impact-voice-ai-risks
  name: Re-identification and misuse risks specific to voice
  impact_details: The consortium identifies risks of voice re-identification, vulnerabilities such as
    voice AI hacking, concerns around voice data sharing and privacy, and the influence of gender and
    racial diversity on the development and application of voice AI technologies. A person's voice cannot
    be fully de-identified, so recognition of a participant remains possible in principle. Raw audio is
    therefore distributed only under controlled access, with the reasoning set out in a published memorandum
    on the ethical justification for controlled access to raw voice data samples.
discouraged_uses:
- id: d4d:VOICE-discouraged-uses
  name: Uses that are discouraged
  discouragement_details: The dataset should not be used for non-clinical or non-research applications
    such as hiring decisions, insurance premium adjustments, or any form of surveillance that could lead
    to discrimination or harm. These discouraged uses are intended to prevent unethical or biased outcomes
    that could negatively impact individuals based on their health conditions or voice characteristics.
    The dataset is intended strictly for research that prioritizes patient safety, privacy and ethical
    use.
intended_uses:
- id: d4d:VOICE-intended-uses
  name: Recommended applications
  use_category: research
  examples:
  - Development, benchmarking or validation of clinically applicable machine-learning models for diagnosing
    health conditions using voice data.
  - Clinical research into disease screening, diagnosis and monitoring through voice biomarkers.
  - AI model pretraining and fine-tuning on derived acoustic features.
  - Cohort selection using the questionnaire and diagnosis features distributed in the phenotype folder.
  usage_notes: The dataset is intended solely for commercial and non-commercial research purposes by Authorized
    Researchers. The parquet dataset can be loaded with any library that supports parquet, for example
    the HuggingFace Datasets library; a spectrogram is stored in its original power representation and
    can be plotted in decibels after conversion, for example with librosa. The phenotype files can be
    loaded with any statistical analysis tool, for example the pandas library. Each data file has a companion
    JSON data dictionary whose keys match the column names of the associated data file.
prohibited_uses:
- id: d4d:VOICE-prohibited-use-reidentification
  name: Re-identification of research participants
  prohibition_reason: The Registered Data Access Agreement forbids using the dataset to attempt to re-identify
    research participants, or to take any action that could reasonably lead to re-identification.
- id: d4d:VOICE-prohibited-use-harm
  name: Uses that could harm or stigmatise participants
  prohibition_reason: The Registered Data Access Agreement forbids any purpose that could foreseeably
    cause harm or stigmatization to research participants, their families, communities, or specific populations.
- id: d4d:VOICE-prohibited-use-ip-blocking
  name: Intellectual property claims that restrict access
  prohibition_reason: Users agree not to make intellectual property claims on the Data, and not to use
    intellectual property protections, database rights or related rights in a manner that restricts or
    limits access to any part of the dataset or to any conclusions derived from it, in alignment with
    the open science principles upheld by the consortium.
- id: d4d:VOICE-prohibited-use-sale-redistribution
  name: Sale or onward distribution of the data
  prohibition_reason: Sale of all or part of the Data on any media is not permitted. Recipients may not
    disclose, release, sell, rent, lease, loan or otherwise grant access to the Data to any third party
    other than Authorized Persons without the Provider's prior written consent; collaborators at other
    research organizations and other research teams at the same organization must apply independently
    and sign their own Data Transfer and Use Agreement.
- id: d4d:VOICE-prohibited-use-contacting-subjects
  name: Contacting the individuals who are the subjects of the data
  prohibition_reason: Under the Data Transfer and Use Agreement the recipient will not use the Data, either
    alone or in concert with any other information, to make any effort to contact individuals who are
    the subjects of the Data without appropriate Institutional Review Board approval, specific written
    approval from the Provider, and informed consent from the individual if required.
distribution_formats:
- id: d4d:VOICE-distribution-physionet-registered
  name: PhysioNet registered access - derived features
  format: Apache Parquet dense feature files and tab-separated value tables, each with a companion JSON
    data dictionary, organised in a Brain Imaging Data Structure v1.9.0 layout.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  - https://physionet.org/content/b2ai-voice/
  description: 'The primary distribution. This is a restricted-access resource: to access the files a
    user must be a credentialed PhysioNet user and sign the data use agreement for the project. The access
    policy states that only credentialed users who sign the DUA can access the files, the licence for
    the files is the Bridge2AI Voice Registered Access License, the data use agreement is the Bridge2AI
    Voice Registered Access Agreement, and no training is required. Registration for access is reached
    from the project documentation site.'
- id: d4d:VOICE-distribution-synapse-controlled
  name: Controlled access - raw audio via Synapse
  format: WAV audio recordings with companion JSON sidecars, in a BIDS layout
  access_urls:
  - https://www.synapse.org/Synapse:syn72370534/
  description: 'The published PhysioNet project does not contain raw audios. Raw audio for the adult cohort
    is made available via Synapse after a more involved process requiring institutional sign-off: a Data
    Access Request Form, a Data Use Agreement, submission to the Data Access Compliance Office for review,
    and a Data Use and Transfer Agreement signed by an authorized official at the recipient institution.
    Requests go to the access committee at DACO@b2ai-voice.org.'
- id: d4d:VOICE-distribution-health-data-nexus
  name: Health Data Nexus - earlier feature-only release
  access_urls:
  - https://healthdatanexus.ai/
  description: An earlier version of the feature-only dataset is available on the Health Data Nexus, which
    provides cloud compute alongside the dataset rather than allowing data downloads. Version 1.0 was
    published there under DOI 10.57764/qb6h-em84. The healthsheet, written for v2.0.0, describes Health
    Data Nexus as the distribution platform, providing publicly accessible metadata with a DOI for persistent
    resolution while the dataset itself requires registered access.
  source_caveats: The healthsheet and the documentation site describe distribution through Health Data
    Nexus; the current releases from v1.1 onward are distributed through PhysioNet. Both channels are
    recorded rather than one being selected.
distribution_dates:
- id: d4d:VOICE-distribution-dates
  name: Release dates
  release_dates:
  - 'End of November 2024: initial release (v1.0) on Health Data Nexus'
  - '2025-01-17: v1.1 on PhysioNet'
  - '2025-04-16: v2.0.0 on PhysioNet'
  - '2025-08-18: v2.0.1 on PhysioNet'
  - '2025-12-16: v3.0.0 on PhysioNet'
  - '2026-05-01: v3.1.0 on PhysioNet'
  description: The version history published on the PhysioNet project page lists five versions from 1.1
    to 3.1.0. The healthsheet separately records that the data was published and made available at the
    end of November 2024, which corresponds to the version 1.0 release on Health Data Nexus.
license_and_use_terms:
  id: d4d:VOICE-license-and-use-terms
  name: Licence and terms of use
  license_terms: The licence for the files is the Bridge2AI Voice Registered Access License, and the data
    use agreement is the Bridge2AI Voice Registered Access Agreement. The access policy is that only credentialed
    users who sign the DUA can access the files; no training is required and there are no fees. Users
    must agree to the terms laid out in the registered access agreement, under which the dataset is intended
    solely for commercial and non-commercial research purposes by Authorized Researchers. Raw audio is
    governed separately by a Data Transfer and Use Agreement between the University of South Florida Board
    of Trustees as Provider and the recipient institution; that agreement expires two years after the
    start date, on completion of the project, on expiration of the applicable ethics approval, or on termination,
    whichever occurs first, and is effective only on review and approval by the Data Access Compliance
    Office through a distinct application. Recipients are encouraged to make the results of their project
    publicly available in open-access journals or pre-print servers where possible, and must recognise
    the Provider as the source of the Data in written, visual or oral public disclosures.
  data_use_permission: general_research_use
  description: The consent obtained from participants does not restrict the data to non-commercial use,
    to a specific geographic location, to a specific type of research, to genetic research, or to research
    that does not develop methods or algorithms.
ip_restrictions:
  id: d4d:VOICE-ip-restrictions
  name: Intellectual property restrictions
  restrictions:
  - No IP-based restrictions have been imposed by third parties, according to the project healthsheet.
  - The Data Provider provides no guarantees that the Data is free of third-party intellectual property
    rights, database rights, and other related rights.
  - The Data may be protected by copyright and other rights, including other intellectual property rights.
    Nothing in the agreements operates to transfer to the recipient any intellectual property rights in
    or relating to the Data.
  - Duplication, as reasonably required to carry out the recipient's research project with the Data, is
    permitted. Sale of all or part of the Data on any media is not permitted.
  - Users agree not to make intellectual property claims on the Data and not to use intellectual property
    protection in ways that would prevent or block access to, or use of, any element of the Data or conclusions
    drawn directly from it.
  - A recipient may elect to perform further research that adds intellectual and resource capital to the
    Data and to obtain intellectual property rights on those downstream discoveries, but agrees to implement
    licensing policies that will not obstruct further research and to respect the Fort Lauderdale Agreement.
  - Neither party may use the other party's name, trademarks or logos in publicity, advertising or a news
    release without prior written approval of an authorized representative of that party.
  - There are no fees associated with these restrictions.
regulatory_restrictions:
  id: d4d:VOICE-regulatory-restrictions
  name: Regulatory and export control restrictions
  regulatory_restrictions:
  - No export controls apply to the dataset, according to the project healthsheet.
  - HIPAA - identifiable information under HIPAA and the Common Rule has been removed and the HIPAA de-identification
    rules were applied; the collection applications and storage infrastructure are HIPAA compliant.
  - Certificate of Confidentiality - the Data governed by the Data Transfer and Use Agreement is covered
    by a Certificate of Confidentiality, which must be asserted against compulsory legal demands such
    as court orders and subpoenas for identifying information or characteristics of a research participant.
  - Recipients must adhere to the specific requirements of PhysioNet.org, managed by the MIT Laboratory
    for Computational Physiology, or of such other data distribution mechanism as the Provider may use.
  - Recipients must use the Data in compliance with all applicable laws, rules and regulations, and with
    all professional standards applicable to such research, including completion of any IRB review or
    approval required before use of the Data.
  hipaa_compliant: compliant
  other_compliance: The Data Transfer and Use Agreement records that the Data it governs is Personally
    Identifiable Information as defined in OMB Memorandum M-07-16 and is not covered under HIPAA, FERPA
    or similar laws or regulations requiring special terms beyond those in the agreement, and that it
    is not subject to the Federal Privacy Act of 1974. The Provider may unilaterally amend the agreement
    should the Federal sponsor require revision. The recipient's authorized representative warrants that
    the recipient does not use coercion for labor or services as defined in section 787.06 of the Florida
    Statutes.
  confidentiality_level: restricted
  source_caveats: The healthsheet describes the released dataset as de-identified under HIPAA and the
    Common Rule, while the Data Transfer and Use Agreement describes the Data it governs as Personally
    Identifiable Information not covered under HIPAA. The two statements apply to the registered-access
    feature release and the controlled-access raw audio respectively.
maintainers:
- id: d4d:VOICE-maintainer-consortium
  name: Bridge2AI-Voice Consortium
  role: academic_institution
  maintainer_details: The dataset is supported by the NIH via the Bridge2AI project. The Bridge2AI-Voice
    consortium, co-led from the University of South Florida and Weill Cornell Medicine, curates the data,
    publishes the releases and operates the Data Access Compliance Office, reachable at DACO@b2ai-voice.org,
    which reviews applications for raw audio access. Questions regarding the dataset itself go to the
    corresponding author listed on the PhysioNet project sidebar, whose contact information is visible
    only to logged-in users.
- id: d4d:VOICE-maintainer-physionet
  name: MIT Laboratory for Computational Physiology (PhysioNet)
  role: academic_institution
  maintainer_details: The PhysioNet platform that hosts the dataset is maintained by the MIT Laboratory
    for Computational Physiology, supported by the National Institute of Biomedical Imaging and Bioengineering,
    the National Heart Lung and Blood Institute, and the NIH Office of the Director under NIH grant numbers
    U24EB037545 and R01EB030362.
- id: d4d:VOICE-maintainer-health-data-nexus
  name: Health Data Nexus, T-CAIREM, University of Toronto
  role: academic_institution
  maintainer_details: The earlier feature-only release is hosted by the Health Data Nexus, a data publishing
    platform maintained by the Temerty Center for Artificial Intelligence Research and Education in Medicine
    (T-CAIREM) based at the University of Toronto. The Health Data Nexus maintains the technical infrastructure
    hosting the dataset and provides continued access to interested researchers.
errata:
- id: d4d:VOICE-erratum-release-corrections
  name: Corrections recorded in the release notes
  erratum_url: https://physionet.org/content/b2ai-voice/3.1.0/
  erratum_details: Corrections made across releases, as recorded in the PhysioNet release notes. Version
    3.1.0 fixed broken parquet files from the previous release and updated validated diagnosis information
    across conditions with back-filled information; some phenotypic files were rearranged and certain
    gold standard variable names were renamed. Version 2.0.1 corrected the authorship list. Version 2.0
    reprocessed spectrograms to fix minor issues identified in the previous release and removed all spectrograms
    and Mel-frequency cepstral coefficients derived from free speech files.
  source_caveats: The project healthsheet states that there is no erratum and that a changelog for each
    dataset version is published online with the dataset metadata. The corrections recorded here are taken
    from the PhysioNet release notes, which serve that changelog function; no document titled as an erratum
    exists.
updates:
  id: d4d:VOICE-update-plan
  name: Update and versioning plan
  frequency: Semi-annual, twice a year, according to the project healthsheet. The observed PhysioNet cadence
    between January 2025 and May 2026 is five releases.
  update_details: 'The dataset is released as static versions rather than being dynamically updated. Further
    versions will be released and distributed as new versions of the dataset on the hosting platform;
    users will be notified through news items on the platform as well as through standard communication
    channels. Updates correct labelling errors, add new instances and reorganise files: v2.0 added 136
    new participants, v3.0.0 added 391, and v3.1.0 added no new participants but released additional data
    for certain participants. The documentation states that further releases will contain additional data,
    that the public releases do not yet contain an equal distribution of the disease cohort categories,
    and that Spanish protocols and data collection will be included in future releases. Each version of
    the dataset has a unique DOI.'
  source_caveats: The stated semi-annual cadence comes from the healthsheet, which describes the Health
    Data Nexus release process for v2.0.0; the PhysioNet version history shows five releases between 17
    January 2025 and 1 May 2026, a faster cadence than semi-annual.
retention_limit:
  id: d4d:VOICE-retention-limits
  name: Data retention limits
  retention_period: Indefinite for the shared de-identified dataset; a maximum of ten years after study
    completion for identifiable data held at the collecting institutions; a minimum of five years after
    study completion for consent documents and de-identified study data; two years from the start date
    for data transferred under the Data Transfer and Use Agreement.
  retention_details: Once data is contributed, it will be retained as long as it is useful for research
    purposes, possibly indefinitely. Identifiable data and the datasheets linking participant numbers
    to participant information are kept within each institution on local cloud storage for a maximum of
    ten years after study completion and are then destroyed, which is the responsibility of each local
    principal investigator. The USF IRB requires de-identified study data and original consent forms to
    be stored for a minimum of five years after completion of the study, and original paper consent documents
    cannot be destroyed until five years after study completion. Under the Data Transfer and Use Agreement,
    data must be destroyed in accordance with the Provider's instructions two years after the start date,
    on completion of the project, on termination, or on expiration of the applicable ethics approval,
    whichever occurs first, and the recipient must submit written certification of destruction within
    thirty days; the recipient may retain one copy to the extent necessary to comply with records retention
    requirements under law, regulation or institutional policy and for research integrity and verification,
    with the agreement's restrictions surviving for that archival copy.
version_access:
  id: d4d:VOICE-version-access
  name: Access to dataset versions
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - 1.0 - first release of the Bridge2AI voice as a biomarker of health dataset, published on Health Data
    Nexus under DOI 10.57764/qb6h-em84, providing 12,523 recordings for 306 participants.
  - 1.1 - 17 January 2025 - DOI 10.13026/249v-w155 - added Mel-frequency cepstral coefficients. The files
    for this version are no longer available on PhysioNet.
  - 2.0.0 - 16 April 2025 - added data for 136 new participants; spectrograms reprocessed to fix minor
    issues; all spectrograms and MFCCs from free speech related files removed.
  - 2.0.1 - 18 August 2025 - corrections in the authorship list.
  - 3.0.0 - 16 December 2025 - DOI 10.13026/k81f-qr68 - major update adding data for 391 further participants;
    the single phenotype data file separated into individual files; sparc articulatory features and ppgs
    phonetic posteriorgrams added; files reorganised.
  - 3.1.0 - 1 May 2026 - DOI 10.13026/8xbn-nq66 - minor update with no new participants but additional
    data for certain participants; broken parquet files from the previous release fixed; audio quality
    metrics and per-audio metadata added; validated diagnosis information updated with back-filled information;
    some phenotypic files rearranged and certain gold standard variable names renamed.
  version_details: By default, older versions of the dataset continue to be supported, hosted and made
    available to researchers, and each version of the dataset has a unique DOI; the dataset publishers
    reserve the right to remove access to older versions. In practice the files for version 1.1 are no
    longer available and PhysioNet directs users to version 3.1.0. The project-level DOI 10.13026/37yb-1t42
    resolves to the latest version, while per-version DOIs identify each release. Obsolescence is communicated
    on the version page, which displays a notice that the version being viewed is not the latest and links
    to the current one.
extension_mechanism:
  id: d4d:VOICE-extension-mechanism
  name: Mechanisms for contribution and extension
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: For dataset extensions and augmentations, it is possible for others to publish a
    derivative dataset on the Health Data Nexus which references the original source; these derivative
    datasets may be made available under the same conditions as the source data. For augmentations to
    the code used to produce the data, the open-source repositories have discussion forums and issue pages
    which allow public discussion of data preprocessing, and the repositories have a pull request mechanism
    for contributing improvements to the data preprocessing code. Guidance for new labels is that the
    process should be described alongside any release of a model or publication, including the exact variables
    used for the determination.
is_deidentified:
  id: d4d:VOICE-deidentification
  name: De-identification status
  identifiable_elements_present: false
  method: HIPAA Safe Harbor, applied together with removal of indirect identifiers and of fields flagged
    as sensitive in the REDCap data dictionary, with the sensitive fields identified by a team of ethicists.
  identifiers_removed: Names, geographic locators, date information at resolution finer than years, phone
    and fax numbers, email addresses, IP addresses, Social Security Numbers, medical record numbers, health
    plan beneficiary numbers, device identifiers, license numbers, account numbers, vehicle identifiers,
    website URLs, full face photos, biometric identifiers and any unique identifiers; state and province,
    with country of data collection retained; civic addresses; select geographic and demographic identifiers;
    information about household composition or cultural identity; narrative text fields; and all raw voice
    data.
  deidentification_details: The level of de-identification for this dataset is that identifiable information
    under HIPAA and the Common Rule, as well as data considered sensitive, has been removed. The dataset
    removes direct identifiers, applies the HIPAA de-identification rules, rebases or replaces dates by
    integers, removes or generalises geographic information and removes narrative text fields; it does
    not achieve K-anonymization at k>=2. Non-identifying elements of data that revealed highly sensitive
    information, such as household income, mental health status and traumatic life experiences, were also
    removed. All raw voice data was removed because it has the potential to cause individual re-identification
    or to be used for illicit or unauthorized purposes, and the data were extracted from the raw audio
    so that only the derived features are released. For v3.0.0, raw audio transcripts were reviewed and
    any recordings containing potentially identifying information or external voices were removed from
    the release, and all sensitive fields, corresponding to elements encoded as sensitive under the "Identifier?"
    column of the REDCap data dictionary, were removed.
  source_caveats: The protocol notes that a voice can never be fully de-identified, so a residual risk
    of voice recognition remains even after all HIPAA-protected information is removed. This is the stated
    reason for restricting raw audio to controlled access rather than including it in this release.
