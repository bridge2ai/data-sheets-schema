  description: De-identification assessment recorded on the Dataverse release record and in the CM4AI
    project preprint.
  identifiable_elements_present: false
  method: 'Not applicable in the conventional sense: the data are laboratory measurements on established,
    commercially or institutionally distributed human cell lines rather than records about identifiable
    individuals.'
  identifiers_removed:
  - No direct or indirect personal identifiers are present in the released measurement data.
  deidentification_details:
  - 'The Dataverse release record states De-identified Samples: Yes and Human Subjects: No.'
