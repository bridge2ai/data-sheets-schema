purposes:
- name: Interpretable genotype-phenotype learning
  description: Primary scientific purpose stated by the CM4AI data generation project on the NIH RePORTER
    project page and the CM4AI web portal.
  response: As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project seeks
    to map the spatiotemporal architecture of human cells and use these maps toward the grand challenge
    of interpretable genotype-phenotype learning. In genomics and precision medicine, machine learning
    models are often black boxes, predicting phenotypes from genotypes without understanding the mechanisms
    by which such translation occurs. The project launches a coordinated effort involving three complementary
    mapping approaches - proteomic mass spectrometry, cellular imaging, and genetic perturbation via CRISPR/Cas9
    - creating a library of large-scale maps of cellular structure and function across demographic and
    disease contexts.
- name: Ethical AI-ready data production
  description: Purpose stated in the CM4AI preprint describing the project's overarching mission.
  response: CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture,
    inferred from multimodal data collected for human cell lines, to enable transformative biomedical
    AI research. As defined by CM4AI, AI-ready biomedical data are fully characterized FAIR data of known
    provenance, which can be ethically and reliably processed by AI applications; whose models and software
    are available and well described for validation and re-use; and whose predictions may be fully explained
    and interpreted to the user as needed. The five stated AI-readiness criteria are FAIR, Provenanced,
    Characterized, Explainable, and Ethical, and they are interdependent.
- name: Delivery of machine-readable hierarchical cell maps
  description: Purpose stated on the CM4AI data releases page.
  response: CM4AI will deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
    together with quarterly data releases of map-input data streams. CM4AI cell maps are produced from
    multimodal interrogation of chromatin modifiers, metabolic enzymes, and other proteins involved in
    cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines under treated and untreated
    conditions.
- name: Standards, ethics, and workforce development
  description: Additional programmatic purposes stated on the NIH RePORTER project page.
  response: In addition to data and tools, the project implements a standards data management approach
    based on FAIR access and software principles, with deep provenance and replication packages for representation
    of cell maps and their underlying datasets; initiates a research program in ethical AI, especially
    as it relates to how maps will be used in genomic medicine and model interpretation; and stimulates
    a diverse portfolio of training opportunities in the emerging field of biomachine learning.
tasks:
- name: Enable visible machine learning systems
  description: Machine learning task the dataset is intended to support, as stated on the NIH RePORTER
    project page and in the CM4AI preprint.
  response: Machine learning models show great promise in analyzing the human genome to make predictions,
    but the inner workings of these models are typically difficult-to-interpret black boxes. This Bridge2AI
    data generation project generates a resource of matched data and tools to enable the creation of visible
    machine learning systems, which are not black boxes but are built directly on knowledge maps of cell
    and tissue architecture. Cell maps have been used in AI tools for visible machine learning or visible
    neural networks (VNNs) to interrogate how protein assemblies in the cell affect cell-level phenotype
    predictions.
- name: Multimodal data integration into hierarchical cell maps
  description: Computational task performed on the released data streams by the CM4AI MuSIC pipeline.
  response: Cell maps are hierarchical directed acyclic graphs in which each node represents an assembly
    of proteins in proximity at a given scale, spanning from large assemblies representing cell compartments
    such as the nucleus and mitochondria to small assemblies of proteins in close proximity such as protein
    complexes or subunits. Cell maps are produced by integrating protein localization and interaction
    data using self-supervised embedding approaches from deep learning, followed by algorithmic community
    detection at multiple resolutions to generate a hierarchy of protein assemblies.
- name: Interpretation of genetic variants and mutations
  description: Downstream application task named in the CM4AI preprint.
  response: Cell maps provide a foundation for downstream applications in human genomics, including interpretation
    of genetic variants and mutations.
- name: Bioinformatics analysis of individual data streams
  description: Task for which the current interim release is stated to be most suitable.
  response: The Dataverse release record states that the current release is most suitable for bioinformatics
    analysis of the individual datasets, because computed cell maps are not included in this release.
addressing_gaps:
- name: Black-box genotype-phenotype models
  description: Gap the CM4AI project is designed to address, as stated on the NIH RePORTER project page.
  response: In genomics and precision medicine, machine learning models are often black boxes, predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs. CM4AI
    addresses this deficiency by creating a library of large-scale maps of cellular structure and function
    across demographic and disease contexts, so that predictive models can be built directly on knowledge
    of cell architecture.
- name: Absence of matched, ethically produced, AI-ready multimodal cell data
  description: Gap addressed by CM4AI's AI-readiness and ethics program, as described in the CM4AI preprint.
  response: AI-readiness places significant requirements on datasets used to train and to be analyzed
    by AI/ML models. CM4AI addresses the absence of matched, fully provenanced, characterized, explainable
    and ethically produced multimodal cell-architecture data by establishing FAIRness with rich metadata
    and persistent globally unique identifiers; computing a machine-readable provenance graph resolvable
    as metadata for all results including inputs, computations, software and outputs; and characterizing
    and validating all datasets and data elements, mapping data elements to public ontology vocabularies
    where appropriate using JSON-Schema mini-data-dictionary descriptions resolvable from the provenance
    graph metadata.
- name: Gaps in the functional genomics and biomedical AI/ML workforce
  description: Training gap identified by the CM4AI Skills and Workforce Development module in the CM4AI
    preprint.
  response: The Workforce Development Module identified gaps in training of the functional genomic and
    biomedical AI/ML workforce, and responded with asynchronous virtual training, hosted virtual events
    including a CodeFest held in March 2024, and an in-person internship co-hosted at Yale University
    and the University of California San Diego.
