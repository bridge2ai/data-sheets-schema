anomalies:
- name: Metadata inconsistencies observed across the CM4AI source documents
  description: Documentation and metadata inconsistencies identified within the current source corpus.
    These are recorded so that users are not misled by conflicting statements; they are not known errors
    in the measured data.
  anomaly_details:
  - 'The CM4AI data releases page labels the current release "June 2026 Data Release (Beta)" with DOI
    doi.org/10.18130/V3/HIGT4C but displays "Released on: June 17, 2025". The Dataverse record for the
    same DOI gives Publication Date 2026-06-17. The Dataverse metadata is treated as authoritative here
    and the portal date is treated as a typographical error in the year.'
  - The Dataset Description block of the June 2025, October 2025 and June 2026 Dataverse releases all
    end with the parenthetical date "(2025-06-30)", which appears to be a description timestamp carried
    forward from the June 2025 revision rather than a date specific to each release.
  - 'The number of proteins covered by the immunofluorescence image archives is stated differently across
    sources: 563 proteins for the March 2025 v0.6-beta archives, 464 proteins for the June 2025 and October
    2025 archives, and 523 proteins on the CM4AI data releases page. The June 2026 release page states
    no protein count for its image archives.'
  - The CM4AI data releases page lists AP-MS interactomes for the TNBC curated datasets as "coming soon",
    while the June 2026 Dataverse release already publishes AP-MS archives for paclitaxel-treated and
    vorinostat-treated MDA-MB-468 cells.
  - The four Dataverse release pages carry version numbers 1.4, 2.1, 2.1 and 2.0 in publication-date order,
    which do not increase monotonically; the June 2026 page header states Version 2.0 while its citation
    string renders the version as V2.
  - The CM4AI data releases page describes the project as a collaboration of UCSD, UCSF, Stanford, UVA,
    Yale, UT Austin, UA Birmingham, Simon Fraser University and the Hastings Center, whereas the March
    2025 Dataverse release description gives the same list without UT Austin. KTH Royal Institute of Technology
    appears as an author affiliation in every Dataverse release but is named in neither collaboration
    list.
  - The June 2026 release publication date is 2026-06-17, but its three immunofluorescence archives carry
    a file publication date of 2026-07-15, after the release was published.
  - Andrej Sali's affiliation is recorded as University of California San Diego in the Dataverse release
    author lists but as University of California San Francisco in both the CM4AI project preprint and
    the Nature publication.
  - Vardit Ravitsky's affiliation is recorded as University of Montreal in the Dataverse author lists,
    while the ethical review contact email given on the same page is at thehastingscenter.org and the
    CM4AI data releases page lists the Hastings Center among the collaborating institutions.
  - The maintenance plan states that the dataset will be updated through the end of the project in November
    2026, whereas NIH RePORTER records the project end date as 2026-08-31.
known_biases:
- name: Cell-line representation bias
  bias_type: representation_bias
  bias_description: The Dataverse release record states, under Potential Sources of Bias, that data in
    this release was derived from commercially available de-identified human cell lines and does not represent
    all biological variants which may be seen in the population at large.
  mitigation_strategy: The release record discloses this limitation explicitly. The project states an
    intention to produce maps of cellular structure and function across demographic and disease contexts,
    and the CM4AI preprint notes that the two cell lines were selected for disease relevance and ethical
    sourcing rather than for population representativeness.
  affected_subsets:
  - MDA-MB-468 breast cancer cell data
  - KOLF2.1J iPSC lineage data
- name: Donor-derived demographic narrowness
  bias_type: sampling_bias
  bias_description: Both cell lines derive from single donors with specific and narrow demographic characteristics.
    MDA-MB-468 was established from a metastatic site pleural effusion of a 51-year-old black female with
    a metastatic mammary adenocarcinoma. KOLF2.1J was derived from a healthy male Northern European donor.
    Findings therefore reflect two individual genetic backgrounds.
  mitigation_strategy: The donor characteristics of both cell lines are documented explicitly in the CM4AI
    project preprint, together with their RRIDs (MDA-MB-468 RRID:CVCL_0419; KOLF2.1J RRID:CVCL_B5P3),
    so that users can account for genetic background when interpreting results.
  affected_subsets:
  - MDA-MB-468 breast cancer cell data
  - KOLF2.1J iPSC lineage data
- name: Protein selection bias toward chromatin modifiers and metabolic enzymes
  bias_type: selection_bias
  bias_description: The proteins interrogated by CM4AI were selected as chromatin modifiers, metabolic
    enzymes, and other proteins involved in cancer, neuropsychiatric and cardiac disorders, rather than
    sampled uniformly from the proteome. The CM4AI preprint describes a target set of 100 chromatin modifiers
    and 100 metabolic enzymes, with the Year 1 CRISPR library targeting 100 chromatin factors and spatial
    proteomics mapping 100 chromatin regulators plus a further 500 proteins pending significant hits.
  mitigation_strategy: The targeting strategy is documented in the CM4AI preprint and on the CM4AI data
    releases page, so that users can restrict inference to the interrogated protein classes.
known_limitations:
- name: Interim release
  limitation_type: scope_limitation
  limitation_description: The Dataverse release record states under Limitations that this is an interim
    release, and under Completeness that these data are not yet in completed final form.
  scope_impact: Conclusions drawn from the release may change as further data are added in subsequent
    quarterly releases through the end of the project.
  recommended_mitigation: Cite the specific release DOI and version used, and check the CM4AI Dataverse
    collection for a newer quarterly release before reuse.
- name: Computed cell maps not included
  limitation_type: scope_limitation
  limitation_description: The release record states under Completeness that computed cell maps are not
    included in this release, and under Limitations that the release does not contain predicted cell maps,
    which will be added in future releases.
  scope_impact: Users receive the map-input data streams rather than the integrated hierarchical cell
    maps that are the project's headline deliverable.
  recommended_mitigation: The release record states that the current release is most suitable for bioinformatics
    analysis of the individual datasets. Users who need integrated maps can run the openly released Cell
    Mapping Toolkit / MuSIC pipeline on the released data streams.
- name: Incompletely overlapping protein coverage across modalities
  limitation_type: coverage_limitation
  limitation_description: The release record states under Completeness that protein-protein interaction
    (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data interrogate sets of proteins
    which incompletely overlap.
  scope_impact: Analyses that require all three modalities for the same protein are restricted to the
    intersection of the three protein sets, which is smaller than any individual modality.
  recommended_mitigation: Compute the modality intersection explicitly before multimodal analysis, and
    treat single-modality coverage as the upper bound for per-modality analyses.
- name: Temporary pre-publication embargo on some component datasets
  limitation_type: temporal_limitation
  limitation_description: The release record states under Completeness that some datasets are under temporary
    pre-publication embargo. The June 2026 release lists the external perturb-seq data links for KOLF2.1J
    iPSCs and for MDA-MB-468 cells as Embargoed.
  scope_impact: External raw data for the embargoed components cannot be retrieved from the linked repositories
    until the embargo lifts, even though summary or processed archives are published in the Dataverse
    release.
  recommended_mitigation: Use the Dataverse-hosted archives for the embargoed components and re-check
    the external data links after publication of the corresponding manuscripts.
- name: Domain expertise required
  limitation_type: methodological_limitation
  limitation_description: The release record states under Limitations that the data require domain expertise
    for meaningful analysis.
  scope_impact: Naive reuse of the mass spectrometry, imaging and perturbation data without proteomics,
    imaging or single-cell genomics expertise is likely to produce misleading results.
  recommended_mitigation: Consult the RO-Crate metadata, JSON-Schema data dictionaries and provenance
    graphs distributed with the release, the Cell Mapping Toolkit documentation, and the CM4AI training
    materials described by the Skills and Workforce Development module.
confidential_elements:
- name: Confidential content assessment
  confidential_elements_present: false
  confidentiality_details:
  - 'The Dataverse release record states Human Subjects: No, De-identified Samples: Yes, and FDA Regulated:
    No, and all ten files of the June 2026 release are marked Public access.'
  - The CM4AI project preprint states that CM4AI data are distinctive within Bridge2AI in that they are
    non-clinical (from tissue cultures) and are considered to be de-identified as they cannot be matched,
    with current knowledge, to a human subject.
content_warnings:
- name: Content warning assessment
  content_warnings_present: false
  warnings:
  - No content warnings are stated in the release record or the CM4AI documentation. The data consist
    of laboratory measurements and microscopy images of cultured human cell lines.
subpopulations:
- name: Donor and cell-line characteristics
  subpopulation_elements_present: true
  identification:
  - MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from a metastatic
    site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma, available
    from ATCC.
  - KOLF2.1J (RRID:CVCL_B5P3) is an induced pluripotent stem cell line derived from a healthy male Northern
    European donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource.
  distribution:
  - 'The release covers two donor-derived cell lines only. Within MDA-MB-468, data are distributed across
    three conditions: untreated (DMSO control), paclitaxel-treated and vorinostat-treated. Within the
    KOLF2.1J lineage, data are distributed across undifferentiated (parental) iPSCs and iPSC-derived neural
    progenitor cells, neurons and cardiomyocytes.'
sensitive_elements:
- name: Sensitive element assessment
  sensitive_elements_present: false
  sensitivity_details:
  - 'The Dataverse release record records Human Subjects: No and De-identified Samples: Yes.'
  - The only donor-level attributes present are the published characteristics of the two commercially
    or institutionally available cell lines (age, sex, ancestry and disease state of the original donors),
    which are already public in the cell-line documentation cited by the CM4AI preprint.
acquisition_methods:
- name: Instance acquisition
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Protein interaction, protein localization and transcriptional perturbation measurements were made
    directly on cultured cells by the project''s laboratories: AP-MS and SEC-MS in the Nevan Krogan laboratory
    at the University of California San Francisco, immunofluorescence confocal imaging in the Lundberg
    Lab at Stanford University, and single-cell CRISPR screens described in the CM4AI preprint.'
  - 'No data were reported by human subjects; the release record states Human Subjects: No.'
  - Derived products in the release include the CRISPRi Perturbation Cell Atlas, which maps transcriptional
    and fitness phenotypes inferred from the raw single-cell sequence data, and the embeddings and hierarchies
    produced by the MuSIC pipeline from the released input streams.
  - The March 2025 file description for the CRISPR Perturbation Cell Atlas states that the findings were
    validated via phenotypic, protein-interaction, and metabolic tracing assays.
collection_mechanisms:
- name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - 'AP-MS was employed on endogenously tagged cell lines to map protein-protein interactions of chromatin
    regulators under different conditions (cancer cells: no treatment, paclitaxel or vorinostat; iPSC:
    undifferentiated, neurons and cardiomyocytes).'
  - As of the CM4AI preprint, 17 genes had been endogenously tagged in MDA-MB-468 with AP-MS data acquired
    under three conditions (untreated, paclitaxel- and vorinostat-treated), with 34 additional genes then
    in the process of being tagged. This is the status reported in May 2024 and is not a description of
    the June 2026 release contents.
  - AP-MS archives for paclitaxel-treated and vorinostat-treated MDA-MB-468 cells first appear in the
    June 2026 Dataverse release, which also links the corresponding AP-MS data in the MassIVE repository.
- name: Size exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS was used for proteome-wide complex and interaction mapping as an orthogonal mass-spectrometry
    approach to AP-MS.
  - SEC-MS was performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel- and vorinostat-treated),
    enabling identification of 72 of 100 chromatin modifiers, 52 of them integral components of protein
    complexes, and detection of PPI profiles of over a thousand complexes, with thousands of proteins
    exhibiting differential elution profiles between control and treated cells. SEC-MS was also performed
    in KOLF2 iPSCs and derivatives, uncovering more than 700 protein complexes in both parental iPSCs
    and differentiated neurons. These are the outcomes reported in the CM4AI preprint of May 2024.
  - SEC-MS data in the released archives were generated in the Nevan Krogan laboratory at the University
    of California San Francisco.
- name: Immunofluorescence confocal microscopy (spatial proteomics)
  mechanism_details:
  - Spatial subcellular organization was mapped using the Human Protein Atlas resource of antibodies.
    Automated fixation and permeabilization protocols were established for a pipetting robot for the MDA-MB-468
    and KOLF2 cell lines.
  - Images are acquired by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg
    Lab at Stanford University. Nuclei are stained with DAPI (blue channel), endoplasmic reticulum with
    a calreticulin antibody (yellow channel), microtubules with a tubulin antibody (red channel), and
    the protein of interest with a specific antibody (green channel).
  - The CM4AI preprint reports completion of spatial proteomics mapping of 100 chromatin regulators in
    MDA-MB-468 cells with and without paclitaxel or vorinostat, with another 500 proteins pending significant
    hits from the genetic perturbation and PPI results, and states that the first set of images was released
    as input for the CM4AI Tools Module MuSIC pipeline and processed to RO-Crate outputs.
- name: Single-cell CRISPR interference perturbation screens
  mechanism_details:
  - Single-cell CRISPR screens perturbing 100 chromatin regulators were performed in MDA-MB-468 cells
    under three conditions (no treatment, paclitaxel or vorinostat) and in KOLF2 iPSCs in the undifferentiated
    state, as reported in the CM4AI preprint.
  - A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene was designed,
    and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were generated and characterized.
  - Single-cell CRISPR screens were performed using the 10x Genomics 3'HT kit.
  - The released CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs is an expressed genome-scale atlas
    mapping transcriptional and fitness phenotypes associated with 11,739 targeted genes.
sampling_strategies:
- name: Targeted protein and cell-line sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - 'Human cell cultures of two lines: MDA-MB-468 triple-negative breast cancer cells and KOLF2.1J induced
    pluripotent stem cells and their neural progenitor, neuronal and cardiomyocyte derivatives.'
  strategies:
  - The project targets 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric
    and cardiac disorders, together with their interactors and key signaling molecules, in disease-relevant
    cell lines under perturbed and unperturbed conditions.
  - The CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs is instead expressed genome-scale, covering
    11,739 targeted genes; the CM4AI data releases page describes the curated iPSC dataset as perturb-seq
    of more than 11,000 genes (whole-genome) and the curated TNBC datasets as perturb-seq of 200 genes.
  - Cell lines were selected for disease relevance and for having been ethically sourced, not by random
    sampling.
  why_not_representative:
  - The release record states that data in this release were derived from commercially available de-identified
    human cell lines and do not represent all biological variants which may be seen in the population
    at large.
  - Protein coverage is targeted rather than proteome-wide for the AP-MS and imaging modalities, and the
    three modalities interrogate incompletely overlapping protein sets.
