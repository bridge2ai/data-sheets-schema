extension_mechanism:
  name: Contribution and extension mechanisms
  description: Mechanisms by which others can extend, augment or build on the dataset and its software.
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details:
  - The Cell Mapping Toolkit, which implements the end-to-end cell map construction pipeline as a series
    of pip-installable Python packages, is released openly at https://github.com/idekerlab/cellmaps_pipeline
    with full user documentation at https://cellmaps-pipeline.readthedocs.io/, providing a flexible and
    generalizable framework that enables researchers to integrate and construct cell maps from multiple
    input modalities.
  - The FAIRSCAPE AI-readiness framework, described with a tutorial and installation instructions at https://fairscape.github.io,
    is pip-installable and freely available under the MIT open source license for both the client-side
    and server-side packages.
  - The Integrative Modeling Platform used for integrative structure modeling is open source and available
    at http://integrativemodeling.org.
  - The Teaming module fosters community involvement through mailing lists, shared online collaborating
    folders, shared documents, and remote messaging and collaboration software within CM4AI, across the
    Bridge2AI program, and in the broader scientific community, and collaborates with the NIH Common Fund
    Data Ecosystem for data curation.
  - The CM4AI preprint states that the article presents the work as a whole in preprint form and will
    be continuously updated as CM4AI progresses, with citations to detailed publications in each contributing
    area.
is_deidentified:
