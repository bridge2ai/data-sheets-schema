preprocessing_strategies:
- name: MuSIC data integration pipeline
  description: The Multi-Scale Integrated Cell (MuSIC) pipeline, maintained by the CM4AI Tools module,
    converts the released multimodal input data streams into integrated hierarchical cell maps. Computed
    cell maps are not included in the June 2026 release; the pipeline is documented here because it defines
    how the released input streams are intended to be processed.
  preprocessing_details:
  - Step a - Download PPI and image data. PPI networks for the cell line and conditions are downloaded
    from the Krogan Laboratory deposition archive; IF images for the cell line and conditions are downloaded
    from the Lundberg Laboratory deposition archive.
  - Step b - Generate embeddings. Downloaded PPI networks are processed using the node2vec deep learning
    model to reduce dimensionality, producing a PPI embedding containing information about a protein's
    interactions. IF images are processed using a Human Protein Atlas deep learning model to reduce dimensionality,
    producing an image embedding containing information about protein localization.
  - Step c - Co-embedding. The PPI and image embeddings are integrated to obtain a co-embedding for each
    protein using contrastive deep learning, such that the original embeddings can be reconstructed with
    minimal information loss and proteins with similar PPI and image embeddings have similar co-embeddings.
  - Step d - Protein community detection and hierarchy creation. Community detection is performed on the
    all-by-all similarities of pairs of proteins in the co-embedding space; the resulting hierarchy of
    protein communities is output as the final cell map.
  - 'Step e - Hierarchy evaluation. Cell maps are annotated in a two-pronged approach: alignment to known
    protein function and pathway resources including the Gene Ontology and Reactome to determine assemblies
    with high overlap with known cell biology, and annotation using a large language model approach that
    names sets of proteins and assigns a name confidence score.'
  - Step f - Integrative structure modeling. A bioinformatics pipeline annotates MuSIC communities by
    available structural information about community members and their interactions, drawing on the Protein
    Data Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry and prediction
    of disordered sequence segments; communities are ranked by the amount of available structural information
    and top ranked communities are modeled using the four-stage integrative structure modeling framework
    scripted with the Python Modeling Interface package on the Integrative Modeling Platform (IMP) version
    2.18.
- name: FAIRSCAPE AI-readiness packaging
  description: Packaging and provenance workflow applied to each computational unit of the pipeline before
    deposit.
  preprocessing_details:
  - The MuSIC pipeline is divided into multiple segments, each of which calls the FAIRSCAPE client package
    to validate inputs and create the output RO-Crate package for that segment, which is then dispatched
    to the FAIRSCAPE server for persistent identifier creation and provenance graph entailment computation.
  - The client-side package FAIRSCAPE-CLI is called when any computation or coherent set of computations
    in the pipeline completes, and is passed metadata defining JSON-Schema schemas for the datasets in
    the computational unit as well as the inputs, computations, software, models and outputs. It creates
    an RO-Crate package containing the datasets, metadata and software, or resolvable references to these
    components, and unique stubs for identifier creation.
  - RO-Crates sent to the FAIRSCAPE server are registered and assigned persistent, resolvable, globally
    unique identifiers using the ARK scheme, with DOIs planned as supplementary identifiers for final-state
    publishable work. RO-Crates are then decomposed into their individual components - datasets, models,
    software - which are also registered and assigned identifiers.
  - The server computes end-to-end entailments on each RO-Crate's provenance as expressed in the EVI Evidence
    Graph Ontology and links them together where possible. Persistent identifiers resolve to machine-
    and human-readable landing pages containing metadata expressed in JSON-LD using vocabularies from
    Schema.org, EVI and other well-defined public ontologies, with alternate JSON-LD and RDF-XML serializations
    available.
  - The Standards module established FAIR AI-readiness metadata and validation toolkits which have been
    used to package and release the cell-line perturbation and measurement data.
- name: Release-level repackaging across versions
  description: Changes made to the packaged form of the data between quarterly releases.
  preprocessing_details:
  - The June 2025 release is described as a revision of the June 2025 Data Release that adds RGB immunofluorescent
    images, applies corrections to RO-Crate metadata, and changes naming conventions.
  - Between the March 2025 and June 2025 releases the immunofluorescence archives were renamed from cm4ai-v0.6-beta-if-images-{condition}.zip
    to cm4ai_ifimages_MDA-MB-468_{condition}.zip and their stated protein coverage changed from 563 to
    464 proteins.
  - Between the June 2025 and October 2025 releases the per-segment RO-Crate metadata and provenance-graph
    files, together with the release-ro-crate-metadata.json and release-ro-crate-datasheet.html files,
    were consolidated into a single cm4ai_release_metadata.zip archive.
  - Between the October 2025 and June 2026 releases the AP-MS archives were added and the MD5 checksums
    of all three immunofluorescence archives changed, so the June 2026 image archives are not byte-identical
    to their identically named October 2025 predecessors.
cleaning_strategies:
- name: Quality control and data curation
  cleaning_details:
  - The CM4AI preprint states that the resulting single-cell CRISPR screen data were undergoing quality
    control at the time of writing.
  - The FAIRSCAPE client validates the inputs of each pipeline segment against JSON-Schema data dictionaries
    before the RO-Crate package for that segment is created, so that schema validation is applied to every
    released computational unit.
  - The Standards module established FAIR AI-readiness metadata and validation toolkits used to package
    and release the cell-line perturbation and measurement data.
  - No further data cleaning, filtering or normalization procedures specific to the released archives
    are described in the source corpus.
labeling_strategies:
- name: Ontology-based and LLM-based annotation of protein assemblies
  data_annotation_platform:
  - CM4AI hierarchy evaluation component of the MuSIC pipeline
  - Gene Set AI (GSAI) pipeline built on GPT-4
  data_annotation_protocol:
  - Cell maps are aligned to known protein function and pathway resources, including the Gene Ontology
    and Reactome, to determine which protein assemblies in the cell map have high overlap with known cell
    biology.
  - Assemblies in the cell maps are annotated using a large language model approach developed by the project
    to name sets of proteins and assign a name confidence score.
  - In the associated Nature study of the U2OS cell map, assemblies were aligned to the Gene Ontology
    cellular component branch (June 2023 release), CORUM (4.1 human complexes) and the Human Protein Atlas
    (v23), with hypergeometric tests and Benjamini-Hochberg FDR correction, and labelled as high overlap
    with a known assembly (Jaccard index at or above 50 per cent), substantial variation on a known assembly
    (Jaccard index below 50 per cent for all resources and at or above 20 per cent for at least one),
    or not previously documented (Jaccard index below 20 per cent for all resources). This protocol description
    is scoped to that publication and not to the CM4AI Dataverse release contents.
  - In the same Nature study, human curators worked in pairs at in-person Annotation Jamborees to assign
    names and putative functional roles to assemblies on the basis of expert knowledge and literature
    curation, informed by GPT-4 suggestions, with the human curation team making the final naming determination.
  labeling_details:
  - Released data archives carry cell line, treatment condition, and modality labels through their file
    names and RO-Crate metadata.
  - Assembly-level labels are a product of the map-generation pipeline rather than of the released input
    data streams; computed cell maps are not included in the June 2026 release.
annotation_analyses:
- name: Reproducibility of LLM-generated assembly names
  analysis_method: In the associated Nature study of the U2OS cell map, the Gene Set AI pipeline was run
    for five additional replicate GPT-4 runs and the semantic similarity between the assembly names generated
    in each run and the original run was computed using the SapBERT model (cambridgeltl/SapBERT-from-PubMedBERT-fulltext)
    from HuggingFace with the transformers package v4.29.2. Assemblies not named by the original run were
    excluded from the reproducibility test.
  agreement_metric: Semantic similarity of generated assembly names across replicate LLM runs, computed
    with SapBERT embeddings.
  annotation_quality_details:
  - In the same study, GPT-4 assigned names to known assemblies with very high self-reported confidence
    (median 0.92 for both the high-overlap and substantial-variation categories) and to previously undocumented
    assemblies with moderately high confidence (median 0.85), contrasting with a median confidence of
    0.0 for sets of proteins drawn randomly.
  - For 104 of the 144 not previously documented assemblies, the literature was sufficiently coherent
    for GPT-4 to propose a confident assembly name (confidence at or above 0.85), each of which was passed
    to the human curation team for final naming determination.
  - These figures describe the U2OS cell map reported in the associated Nature publication and are not
    measurements of the CM4AI Dataverse release contents.
machine_annotation_tools:
- name: Automated annotation and integration tooling
  tools:
  - node2vec
  - Human Protein Atlas deep learning image model
  - GPT-4 (gpt-4-1106-preview in the associated Nature study)
  - Gene Set AI (GSAI) pipeline
  - SapBERT
  - Gene Ontology
  - Reactome
  - CORUM
  - AlphaFold and AlphaFold-Multimer
  - Integrative Modeling Platform (IMP) v2.18
  - Cytoscape
  - HiView
  - Network Data Exchange (NDEx)
  tool_descriptions:
  - node2vec reduces the dimensionality of downloaded PPI networks, producing a PPI embedding that captures
    a protein's interaction neighbourhood.
  - A Human Protein Atlas deep learning model reduces the dimensionality of IF images, producing an image
    embedding that captures protein localization.
  - GPT-4, driven by the Gene Set AI pipeline, generates descriptive names, confidence scores and referenced
    reasoning essays for protein assemblies; a separate GPT-4 based citation module extracts gene symbols
    and functional keywords, constructs and executes PubMed queries, and evaluates whether retrieved publications
    support the generated statements.
  - Gene Ontology, Reactome and CORUM are used as reference resources to align detected assemblies with
    known cell biology.
  - The Integrative Modeling Platform, scripted through the Python Modeling Interface package, is used
    for integrative structure modeling of ranked MuSIC communities.
  - Cell maps are shared via the Network Data Exchange (NDEx) and can be visualized in a web browser or
    accessed via Cytoscape, HiView, or the Python ndex2 library.
  tool_accuracy:
  - LLM-generated assembly names carry an explicit self-assessed confidence score, and the associated
    Nature study reports median confidences of 0.92 for known assemblies, 0.85 for previously undocumented
    assemblies, and 0.0 for random protein sets.
  - No accuracy figures for automated annotation of the CM4AI Dataverse release contents are given in
    the corpus.
existing_uses:
- name: Documented uses of CM4AI data and derived resources
  examples:
  - The associated Nature publication "Multimodal cell maps as a foundation for structural and functional
    genomics" (Schaffer, Hu et al., Nature 642, 222-231, published 09 April 2025) applies the same multimodal
    mapping approach to U2OS osteosarcoma cells, acknowledging Bridge2AI Program funding (NIH Common Fund,
    OT2 OD032742). It reports a hierarchy of 275 protein assemblies across 5,147 proteins, 111 previously
    undocumented heterodimeric structures, functional assignments for 975 proteins, and 21 recurrently
    mutated assemblies implicating 102 validated new cancer proteins. That study analyses U2OS cells and
    is a separate dataset from the MDA-MB-468 and KOLF2.1J data released by CM4AI.
  - The related preprint "A perturbation cell atlas of human induced pluripotent stem cells" (Nourreddine
    et al., bioRxiv 2024.11.03.621734, PMCID PMC11580897) is cited as a Related Publication of the CM4AI
    March 2025 and June 2025 releases.
  - Initial datasets, tools and standards associated with all three parallel mapping platforms were made
    available at the CM4AI CodeFest in March 2024, accompanied by detailed tutorials explaining how the
    data were derived and integrated and providing production-ready software for producing the datasets.
  - Cell maps have been used in AI tools for visible machine learning or visible neural networks to interrogate
    how protein assemblies in the cell affect cell-level phenotype predictions.
  - Dataverse download counters record 302 downloads for the March 2025 release, 256 for the June 2025
    release, 405 for the October 2025 release, and 181 for the June 2026 release at the time of capture.
use_repository:
- name: CM4AI web portal and product documentation
  repository_url: https://cm4ai.org/
  repository_details:
  - The Teaming module supports open dissemination of CM4AI-generated data, maps and tools via the CM4AI
    web portal, using the U-BRITE platform, to support open and trustworthy data management and sharing.
  - The portal provides Data Releases, Tools, Product Documentation, Publications and Learning sections,
    and reports project-level Data Insights figures.
- name: CM4AI Dataverse collection in LibraData
  repository_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  repository_details:
  - 'The CM4AI collection sits within University of Virginia Dataverse > LibraData: UVa''s Scholarly Research
    > School of Medicine > Cell Maps for Artificial Intelligence.'
  - LibraData is the University of Virginia's instance of Dataverse, an NIH-approved generalist repository.
other_tasks:
- name: Additional tasks the data could support
  task_details:
  - Comparison of protein complex composition and elution behaviour between untreated and drug-treated
    cancer cells, since SEC-MS in MDA-MB-468 cells revealed thousands of proteins with differential elution
    profiles between control and paclitaxel- or vorinostat-treated cells.
  - Comparison of protein complexes across differentiation states, since SEC-MS in KOLF2 iPSCs and derivatives
    uncovered more than 700 protein complexes in both parental iPSCs and differentiated neurons.
  - Genome-scale analysis of transcriptional and fitness phenotypes from the CRISPRi Perturbation Cell
    Atlas covering 11,739 targeted genes in KOLF2.1J iPSCs.
  - Development and benchmarking of multimodal representation learning methods, using the paired interaction
    and imaging data as matched modalities.
  - Reuse of the released RO-Crate packages and EVI provenance graphs as worked examples for FAIR and
    AI-readiness metadata practice.
future_use_impacts:
- name: Considerations for future users
  impact_details:
  - The release is interim and will be augmented quarterly through the end of the project, so analyses
    based on a given release DOI may not reflect later, more complete releases. Users should cite the
    exact release DOI and version.
  - Computed cell maps are not present in this release; users expecting the integrated hierarchical maps
    must generate them with the Cell Mapping Toolkit or await a later release.
  - Because the data derive from two cell lines only, models trained on them may not generalize to other
    cell types, tissues, or to human populations.
  - The CM4AI preprint states that software packages will be versioned as the project progresses and that
    the version used to produce each dataset will be referenced in the dataset's metadata, so reproduction
    of derived results requires attention to software versions recorded in the provenance graphs.
  - The CM4AI Dataverse collection and web portal display a notice that the repository is under review
    for potential modification in compliance with Administration directives, which introduces uncertainty
    about the future availability and content of the hosted material.
  - Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question), so downstream products intended
    for commercial deployment need rights clearance before development.
discouraged_uses:
- name: Uses for which the release is not suited
  discouragement_details:
  - Use of the current release as a source of integrated or predicted cell maps; the release record states
    that computed cell maps are not included and that predicted cell maps will be added in future releases.
  - Analysis without domain expertise; the release record states that the data require domain expertise
    for meaningful analysis.
  - Treating the data as representative of human biological variation; the release record states that
    the data derive from commercially available de-identified human cell lines and do not represent all
    biological variants which may be seen in the population at large.
  - Multimodal analyses that assume complete protein overlap across modalities, given the explicit statement
    that the SEC-MS, IF imaging and CRISPRi perturb-seq data interrogate incompletely overlapping protein
    sets.
intended_uses:
- name: Intended uses stated on the Dataverse release record
  use_category:
  - AI-ready data for functional genomics research
  - AI model training
  - Cellular process analysis
  - Disease, treatment and perturbation response analysis
  examples:
  - AI-ready datasets to support research in functional genomics.
  - AI model training.
  - Cellular process analysis.
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations.
  usage_notes: The release record adds that this is an interim release most suitable for bioinformatics
    analysis of the individual datasets, that predicted cell maps will be added in future releases, and
    that meaningful analysis requires domain expertise. Any publication referencing this data or derived
    products should cite the Related Publication as well as directly citing the data collection.
prohibited_uses:
- name: Clinical decision-making and patient care
  prohibition_reason:
  - The Dataverse release record states under Prohibited Uses that these laboratory data are not to be
    used in clinical decision-making or in any context involving patient care without appropriate regulatory
    oversight and approval.
- name: Commercial use without separate licensing
  prohibition_reason:
  - The data are licensed under Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International,
    whose NonCommercial term states that the material may not be used for commercial purposes, defined
    as a use primarily intended for commercial advantage or monetary compensation.
  - The CM4AI preprint states that commercial use requires a separate license negotiation with the copyright
    holder (UCSD, Stanford, and/or UCSF depending upon the specific data package in question), and that
    a Data Access Committee will supervise ethical matters related to dataset distribution and potential
    dual licensing for commercial use.
- name: Redistribution under incompatible terms or with added restrictions
  prohibition_reason:
  - The ShareAlike term of CC BY-NC-SA 4.0 requires that remixed, transformed or built-upon material be
    distributed under the same license as the original, or a license listed as compatible by Creative
    Commons.
  - The No additional restrictions term states that licensees may not apply legal terms or technological
    measures that legally restrict others from doing anything the license permits.
