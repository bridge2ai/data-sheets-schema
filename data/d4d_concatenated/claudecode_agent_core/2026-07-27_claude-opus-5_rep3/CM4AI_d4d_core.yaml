missing_data_documentation:
- name: Known gaps in the June 2026 release
  missing_data_patterns:
  - Computed cell maps are absent from the release; the release record states that computed cell maps
    are not included and that predicted cell maps will be added in future releases.
  - AP-MS archives are published only for treated MDA-MB-468 cells (paclitaxel and vorinostat); no untreated-condition
    AP-MS archive appears in the June 2026 file list.
  - Immunofluorescence image archives are published only for MDA-MB-468 cells; the CM4AI data releases
    page lists IF images for the curated iPSC dataset as coming soon.
  - The external perturb-seq data links for KOLF2.1J iPSCs and for MDA-MB-468 cells are marked Embargoed
    on the June 2026 release page.
  - No exact byte counts are published for the release files; the Dataverse file table shows only rounded
    display sizes.
  - The June 2026 release file table carries no per-file descriptions, in contrast to the March 2025,
    June 2025 and October 2025 releases.
  missing_data_causes:
  - The release is explicitly an interim Beta release, and the record states that these data are not yet
    in completed final form.
  - Some datasets are under temporary pre-publication embargo.
  - Protein-protein interaction, protein localization and CRISPRi perturb-seq data interrogate sets of
    proteins which incompletely overlap, so per-protein coverage is uneven by construction.
  handling_strategy: The release record states that the dataset will be regularly updated and augmented
    through the end of the project, with updates on a quarterly basis, and that data presented will be
    augmented regularly through the end of the project. Missing components are disclosed in the Completeness
    and Limitations sections of the release record rather than imputed.
