    channel), microtubules with a tubulin antibody (red channel), and an antibody against the protein
    of interest (green channel).
  counts: 53788
  label: true
  label_description: Each image is associated with the protein of interest targeted by the green-channel
    antibody, and with the cell line and treatment condition.
  description: The CM4AI web portal and data releases page report 53,788 immunofluorescent images as a
    cumulative project-level Data Insights figure. This is a portal-level statistic for the project as
    a whole and is not stated as the count for any single Dataverse release.
- name: Protein-protein interaction
  instance_type: Measured interaction between two proteins, derived from affinity purification mass spectrometry
    or size exclusion chromatography mass spectrometry.
  counts: 1374
  description: The CM4AI web portal and data releases page report 1,374 protein interactions as a cumulative
    project-level Data Insights figure. This is a portal-level statistic for the project as a whole and
    is not stated as the count for any single Dataverse release.
- name: Investigated protein
  instance_type: Human protein interrogated by one or more CM4AI data modalities.
  counts: 7023
  description: The CM4AI web portal and data releases page report 7,023 total proteins investigated as
    a cumulative project-level Data Insights figure. The data releases page separately states that the
    curated iPSC-family and TNBC datasets each include SEC-MS capturing approximately 7,000 proteins.
- name: Targeted gene perturbation
  instance_type: CRISPR interference perturbation of a single target gene, profiled by single-cell RNA
    sequencing (perturb-seq).
  counts: 11739
  label: true
  label_description: Each perturbation is labelled with its target gene and with the transcriptional and
    fitness phenotypes associated with that perturbation.
