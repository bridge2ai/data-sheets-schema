name: CM4AI_June_2026_Data_Release
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: 'The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI; cm4ai.org),
  the Functional Genomics Grand Challenge data generation project of the NIH Common Fund Bridge2AI program.
  CM4AI generates multi-modal data streams - protein-protein interaction data, spatial protein localization
  data, and genetic perturbation data - in MDA-MB-468 triple-negative breast cancer cells (untreated or
  treated with paclitaxel or vorinostat) and in KOLF2.1J induced pluripotent stem cells (undifferentiated
  or differentiated to neural progenitor cells, neurons, and cardiomyocytes). This Beta release comprises:
  perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment and for undifferentiated
  (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 cells with and without treatment, undifferentiated
  KOLF2.1J iPSCs, and iPSC-derived NPCs, neurons and cardiomyocytes; AP-MS data for treated MDA-MB-468
  cells; and immunofluorescence images in MDA-MB-468 cells with and without treatment. Output data are
  packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the
  FAIRSCAPE framework, and are archived in LibraData, the University of Virginia''s Dataverse instance,
  an NIH-approved generalist repository. The release is distributed under DOI 10.18130/V3/HIGT4C, Dataverse
  version 2.0, with a publication date of 2026-06-17 and ten archive files. CM4AI is a collaboration of
  UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University, and the Hastings
  Center. The stated project goal is to map the spatiotemporal architecture of human cells and use these
  maps toward the grand challenge of interpretable genotype-phenotype learning, enabling "visible" machine
  learning systems built on knowledge maps of cell and tissue architecture rather than black-box models.
  Computed cell maps are not included in this release; it delivers the map-input data streams. Four earlier
  quarterly Dataverse releases exist and remain separately citable: March 2025 (10.18130/V3/B35XWX), June
  2025 (10.18130/V3/F3TD5R), October 2025 (10.18130/V3/K7TGEM), and an earlier data release cited in the
  CM4AI preprint as 10.18130/V3/DXWOS5; each is a distinct historical release and is not merged into the
  current release described here.'
