notes: >-
  Three findings the items cannot fully carry. (1) The rubric evaluator's flag is
  confirmed and is worse than self-inconsistency: source_caveats item (7) is
  arithmetically wrong in both magnitude and direction — the attested per-directory
  sizes sum to 3,815,969,360,064 (419,614 bytes under the declared total), not the
  stated 3,815,974,377,264 (claimed 4,597,586 over) — recorded as the rule-01
  violation. Item (6)'s file-count arithmetic (356,334 + 9 root files) checks out.
  (2) The reconciliation report contradicts the records: §2.1, §3 and §4 say
  extension_mechanism was retained in the full record, but it is absent from both
  records (slot-058). (3) Instrument note: the pack joins pre-reconciliation
  receipt paths to post-reconciliation indices, so list insertions shift receipts
  onto the wrong entries — slot-029 (related_datasets) is scored unsupported on an
  index shift even though its value is bundle-attested, and slot-057 only resolves
  because the moved value is findable; a claims join keyed to entry identity rather
  than index would remove this artifact.
