    was_directly_observed, the third subpopulation, at_risk_populations) rather than padding,
    and thin sources (c008) yield few slots.
- id: rule-05
  verdict: followed
  evidence: >-
    one object per entity throughout: purposes (4), tasks (4), instances (11), data_collectors
    (3), external_resources (5 entries), machine_annotation_tools (2), intended_uses (3 by
    use_category). creators holds the two attested creator entities (the PI and the
    consortium); the five leadership members are deliberately prose context in
    creators[1].notes because the bundle does not attest them as creators - an evidence
    decision under rule-01, not a collapse of creator entities.
- id: rule-06
  verdict: followed
  evidence: >-
    absences are recorded in source_caveats (e.g. top-level: no DOI, version, citation,
    retention policy), not as slot values; no field answers with a pointer or a pending
    placeholder. The "metadata is planned" phrases in instances[*].notes transcribe the
    webinar table's Metadata column - a fact about the dataset, not a statement that the
    record's answer is pending.
- id: rule-07
  verdict: violated
  evidence: >-
    data_governance.committee_contact holds "Jared Houghtaling", attested only as an
    access-request contact (line 1383) - the slot asks for the governance committee's contact,
    and the record's own caveat concedes no source names a committee; license_and_use_terms.contact_person
    holds "Ciera McCrary", attested only as program manager (line 1107), with the caveat
    conceding no licensing-specific contact exists; maintainers[1].maintainer_details answers
    software-package maintenance (lines 1353-1359) in a dataset-maintainer slot. The rule's
    remedy for evidence that answers a neighbouring question is to put it there or omit.
- id: rule-08
  verdict: violated
  evidence: >-
    three Person-ranged slots hold bare name strings with the class's declared fields empty:
    creators[0].principal_investigator ("Eric S. Rosenthal"), data_governance.committee_contact
    ("Jared Houghtaling"), license_and_use_terms.contact_person ("Ciera McCrary"). The Phase-4
    report (section 2.4) states this shape was chosen deliberately to avoid minting person
    identifiers (Person.id is forced by the schema and the bundle supplies no registry ids) -
    a real conflict among the rules, but the rule as written is not met: the evidence answers
    Person.name and the declared field is not populated.
- id: rule-09
  verdict: followed
  evidence: >-
    data_topic and data_substrate use CURIEs (B2AI_TOPIC:4, B2AI_SUBSTRATE:11, ...); no
    ror.org, orcid.org, or doi.org resolver URL appears anywhere in either record; the
    record's id uses a URL because no declared prefix covers chorus4ai.org (the uri fallback);
    contribution_url is uri-ranged and correctly holds a URL.
- id: rule-10
  verdict: followed
  evidence: >-
