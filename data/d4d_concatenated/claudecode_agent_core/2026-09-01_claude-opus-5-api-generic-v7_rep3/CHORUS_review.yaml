    chunk's receipt" - fails: bundle-supplied phase-1 values carry no receipt, e.g. name
    "CHoRUS dataset" (bundle line 236), created_by (lines 1196, 1093), instances[0].instance_type
    (lines 1075-1076), description, keywords, and all five raw_data_sources entries (lines
    245-247, 346, 350-352, 364-365). 111 of 201 counted slots are receiptless, and the
    sampled 25 came back mostly bundle_supports - values the bundle supplied that the receipt
    never named.
- id: rule-16
  verdict: followed
  evidence: >-
    no object sits in a scalar-ranged slot: grantor, instance_type, role, license_terms and
    the other string-ranged slots all hold strings; the one shape defect runs the opposite
    direction (bare strings in Person-ranged slots) and is judged under rule-08.
notes: >-
  (1) The pack's claims sidecar is null; receipts were matched from the coverage receipt
  alone. (2) slot-017 is a stale pre-reshape receipt: Phase 4 rebuilt creators after the
  receipt was written, so the cited snippet (University of Florida) now sits under a path
  holding the consortium affiliation - the unsupported verdict is against the pair as posed,
  and the underlying cause is the no-receipt-route reconcile rewrite (#742), an instrument
  reporting matter as much as a record defect; the four "<path does not resolve>" items
  (slot-007/009/014/021) are the same rewrite seen from the other side. (3) B2AI_TOPIC and
  B2AI_SUBSTRATE term labels are not resolvable from the schema files the pack names (only
  the prefix is declared), so the correctness of specific term choices (e.g. B2AI_TOPIC:8
  for medication administration) could not be checked - the exempt_by_nature verdicts attest
  the underlying data types, not the term mappings. (4) Minor: the core record's
  conforms_to_schema holds a file path while the full record holds the w3id URI - two forms
  for one identity (excluded slot, so reported here only); maintainers[*].role
  "academic_institution" is a loose enum fit for the GitHub organization in maintainers[1].
