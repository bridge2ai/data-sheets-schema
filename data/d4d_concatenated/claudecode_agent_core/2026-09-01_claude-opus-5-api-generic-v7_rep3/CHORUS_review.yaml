    1070-1071 give only the count). The record otherwise follows the rule well - doi, version,
    citation, license, at_risk_populations, human_subject_research all omitted with the
    absence named in source_caveats - but these carried inferences are populated slots the
    bundle does not support as stated.
- id: rule-02
