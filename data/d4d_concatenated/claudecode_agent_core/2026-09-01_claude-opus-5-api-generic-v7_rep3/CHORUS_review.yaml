- id: rule-15
  verdict: violated
  evidence: >-
    the receipt document itself is well-formed (bundle_md5 matches 9b2ef4b65d67957f79362266cab0bc7a,
    chunks c001-c008 in order, closed statuses, verbatim multi-word snippets), but the rule's
