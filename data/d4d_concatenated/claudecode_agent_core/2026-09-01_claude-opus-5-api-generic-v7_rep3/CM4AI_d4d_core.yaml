id: doi:10.18130/V3/HIGT4C
name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: 'CM4AI (Cell Maps for Artificial Intelligence) is the Functional Genomics Data
  Generation Project of the U.S. National Institutes of Health Bridge2AI program. This record
  describes the June 2026 Data Release (Beta), a multimodal, AI-ready dataset characterizing
  human cell architecture in two disease-relevant cell lines: MDA-MB-468 triple-negative breast
  cancer cells, untreated or treated with paclitaxel or vorinostat, and KOLF2.1J induced pluripotent
  stem cells (iPSCs), undifferentiated or differentiated into neural progenitor cells (NPCs),
  neurons and cardiomyocytes. The release comprises single-cell CRISPR interference perturbation
  sequencing (perturb-seq) for MDA-MB-468 cells with and without treatment and for undifferentiated
  KOLF2.1J iPSCs; size-exclusion chromatography-mass spectrometry (SEC-MS) protein-protein
  interaction data for MDA-MB-468 cells with and without treatment and for undifferentiated
  KOLF2.1J iPSCs and iPSC-derived NPCs, neurons and cardiomyocytes; affinity purification-mass
  spectrometry (AP-MS) data for treated MDA-MB-468 cells; and immunofluorescence confocal
  images of protein subcellular localization in MDA-MB-468 cells with and without treatment.
  Data are packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate
  format using the FAIRSCAPE framework and are archived in the University of Virginia Dataverse.
  The project''s stated objective is to deliver machine-readable hierarchical maps of cell
  architecture, produced by multimodal interrogation of chromatin modifiers, metabolic enzymes
  and other proteins involved in cancer, neuropsychiatric and cardiac disorders, in support
  of interpretable genotype-phenotype learning. CM4AI is described as a collaboration of UCSD,
  UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University and the Hastings
  Center.'
notes: 'The CM4AI project portal reports project-wide totals accumulated across all quarterly
  releases rather than for this release alone: 1,374 protein interactions, 53,788 immunofluorescent
  images, 7,023 total proteins investigated, 11,739 genes targeted and 21.4 TB of data volume.
  The figure of 11,739 genes also appears at release scope, as the number of genes targeted
  by the genome-scale CRISPR interference perturbation cell atlas in KOLF2.1J iPSCs; the portal
  total and the atlas figure coincide but are stated at different scopes. The University of
  Virginia Dataverse collection hosting the release carries the notice "This collection is
  under review for potential modification in compliance with Administration directives."'
source_caveats: 'Referent: this record describes the CM4AI June 2026 Data Release (Beta),
  doi:10.18130/V3/HIGT4C, which the declared source ranking treats as the current release
  and as superseding the October 2025 release. Earlier quarterly releases are recorded under
  related_datasets. Source disagreements resolved here: (1) the CM4AI project portal states
  "Released on: June 17, 2025" for the June 2026 release, while the Dataverse record gives
  a publication date of 2026-06-17; the higher-ranked Dataverse record is preferred. (2) The
  March 2025 release describes immunofluorescence imaging of 563 proteins of interest in MDA-MB-468
  cells, while the June 2025 and October 2025 releases describe 464; the June 2026 file listing
  carries no per-file descriptions, so no protein count is asserted for the image archives
  in this release. (3) The June 2025 release lists NCBI BioProject / Sequence Read Archive
  links for raw perturb-seq sequence data, while the June 2026 release lists the corresponding
  perturb-seq external links as embargoed; the June 2026 statement is preferred. (4) The project
  portal''s data-release page marks AP-MS interactomes for the breast cancer cells as "coming
  soon", while the June 2026 Dataverse release includes AP-MS archives for paclitaxel- and
  vorinostat-treated MDA-MB-468 cells; the Dataverse release is preferred. Observation on
  the evidence: the three immunofluorescence image archives in the June 2026 release report
  the same file sizes as those in the October 2025 release but different MD5 checksums, indicating
  the archives were regenerated; for that reason the per-file protein counts stated in the
  October 2025 descriptions are not carried over. Copyright wording is transcribed from the
  March 2025 release, the most recent release in the bundle that states it explicitly; the
  June 2026 landing page does not restate it. The bundle names no publisher for the release
  and no dataset-level modification date, so `publisher` and `last_updated_on` are omitted.
  Creator affiliations are recorded from the institution names the June 2026 Dataverse listing
  prints for each author; that listing prints a ROR URL rather than an institution name for
  the five University of Virginia authors, and those entries are recorded with the ROR identifier.
  Nine of the 47 listed authors carry no ORCID in the bundle and are recorded with fragment
  identifiers minted on the release DOI, their names and affiliations held in notes.'
