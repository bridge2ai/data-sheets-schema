ethical_reviews:
- review_details: The release states that the dataset does not involve human subjects, that
    samples are de-identified, and that the data are not FDA regulated, and names Vardit Ravitsky
    and Jean-Christophe Belisle-Pipon as ethical review contacts. The CM4AI Ethics module
    developed guidelines and best practices for the ethical development of AI systems leveraging
    this data, using a methodology inspired by Value-Sensitive Design to create normative
    standards and expectations, an axiological repository of values, and a CM4AI Life Cycle
    framework elucidating governance milestones throughout data generation and AI system development.
    It also conducts mixed qualitative and quantitative empirical research to capture community
    insights and is developing tools to support awareness of the ethical, legal and social
    ramifications of the data and consequent AI systems.
  reviewing_organization: CM4AI Ethics module
  contact_person: ORCID:0000-0002-7080-8801
