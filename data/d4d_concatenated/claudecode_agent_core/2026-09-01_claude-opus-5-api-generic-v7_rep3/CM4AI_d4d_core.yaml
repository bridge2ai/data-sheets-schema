instances:
- instance_type: Confocal immunofluorescence image of MDA-MB-468 breast cancer cells stained
    for a protein of interest, acquired under untreated, paclitaxel-treated or vorinostat-treated
    conditions. Nuclei are stained with DAPI (blue channel), endoplasmic reticulum with a
    calreticulin antibody (yellow channel), microtubules with a tubulin antibody (red channel)
    and the protein of interest with its antibody (green channel).
  data_substrate: B2AI_SUBSTRATE:56
  data_topic: B2AI_TOPIC:15
- instance_type: Size-exclusion chromatography-mass spectrometry (SEC-MS) protein elution
    profile used for proteome-wide protein complex and interaction mapping, generated for
    MDA-MB-468 breast cancer cells with and without treatment and for undifferentiated KOLF2.1J
    iPSCs and iPSC-derived neural progenitor cells, neurons and cardiomyocytes.
  data_substrate: B2AI_SUBSTRATE:59
  data_topic: B2AI_TOPIC:28
- instance_type: Affinity purification-mass spectrometry (AP-MS) protein interaction measurement
    from endogenously tagged bait proteins in paclitaxel- or vorinostat-treated MDA-MB-468
    breast cancer cells.
  data_substrate: B2AI_SUBSTRATE:58
  data_topic: B2AI_TOPIC:26
- instance_type: Single-cell transcriptome from a CRISPR interference perturbation screen
    (perturb-seq), associated with a targeted gene; the KOLF2.1J iPSC perturbation cell atlas
    maps transcriptional and fitness phenotypes associated with 11,739 targeted genes, and
    perturb-seq data are also provided for MDA-MB-468 cells with and without treatment.
  data_substrate: B2AI_SUBSTRATE:64
  data_topic: B2AI_TOPIC:12
known_biases:
- bias_type: representation_bias
  bias_description: Data in this release were derived from commercially available de-identified
    human cell lines and do not represent all biological variants which may be seen in the
    population at large.
  affected_subsets:
  - 'All modalities in the release, which derive from two donor-derived cell lines: MDA-MB-468,
    established from a 51-year-old black female with metastatic mammary adenocarcinoma, and
    KOLF2.1J, derived from a healthy male Northern European donor.'
- bias_type: selection_bias
  bias_description: Proteins and genes were selected for interrogation on the basis of their
    role as chromatin modifiers, metabolic enzymes and other proteins involved in cancer,
    neuropsychiatric and cardiac disorders, rather than sampled at random from the proteome;
    the panels interrogated by the imaging, interaction and perturbation modalities are targeted
    rather than exhaustive.
  mitigation_strategy: The perturbation component was extended to an expressed genome-scale
    CRISPR interference screen of 11,739 targeted genes in KOLF2.1J iPSCs, broadening coverage
    beyond the initial targeted panels.
known_limitations:
- limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps,
    which will be added in future releases; the current release is most suitable for bioinformatics
    analysis of the individual datasets.
  recommended_mitigation: Users requiring integrated cell maps should await a later quarterly
    release, or construct maps from the released input data streams using the Cell Mapping
    Toolkit.
- limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging)
    and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
  scope_impact: Analyses requiring all three modalities for the same protein are limited to
    the intersection of the three panels.
- limitation_type: temporal_limitation
  limitation_description: Some datasets are under temporary pre-publication embargo; in this
    release the external perturb-seq links for KOLF2.1J iPSCs and for MDA-MB-468 cells are
    listed as embargoed.
- limitation_type: methodological_limitation
  limitation_description: Meaningful analysis of these data requires domain expertise.
- limitation_type: coverage_limitation
  limitation_description: Immunofluorescence imaging in this release covers only the MDA-MB-468
    breast cancer cell line under the three treatment conditions; the project portal lists
    iPSC immunofluorescence images as forthcoming.
sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: The release records no human subjects and de-identified samples; the
    released content consists of laboratory measurements on commercially available human cell
    lines (immunofluorescence images, mass spectrometry-derived interaction data and single-cell
    sequencing summaries) rather than personal identifiers or protected health information.
acquisition_methods:
- acquisition_details: Protein-protein interactions measured by affinity purification-mass
    spectrometry (AP-MS) on endogenously tagged cell lines.
  was_directly_observed: true
  was_reported_by_subjects: false
- acquisition_details: Proteome-wide protein complex and interaction profiles measured by
    size-exclusion chromatography coupled to mass spectrometry (SEC-MS), used as an orthogonal
    mass spectrometry-based approach to AP-MS.
  was_directly_observed: true
  was_reported_by_subjects: false
- acquisition_details: Protein subcellular localization observed by immunofluorescence-based
    staining (ICC-IF) using Human Protein Atlas antibodies followed by confocal microscopy.
  was_directly_observed: true
  was_reported_by_subjects: false
- acquisition_details: Transcriptional and fitness phenotypes observed in single-cell CRISPR
    interference perturbation screens.
  was_directly_observed: true
  was_reported_by_subjects: false
collection_mechanisms:
- mechanism_details: Affinity purification-mass spectrometry on cell lines in which target
    genes were endogenously tagged; the project reports tagging 17 genes in MDA-MB-468 with
    AP-MS acquired under untreated, paclitaxel and vorinostat conditions, with 34 additional
    genes in progress at the time of the preprint.
- mechanism_details: Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for
    proteome-wide complex and interaction mapping in MDA-MB-468 cells under three conditions
    and in KOLF2.1J iPSCs and derivatives.
- mechanism_details: Immunofluorescence staining using the Human Protein Atlas resource of
    antibodies, with automated fixation and permeabilization protocols implemented on a pipetting
    robot for the MDA-MB-468 and KOLF2 cell lines, followed by confocal microscopy in four
    colour channels.
- mechanism_details: Single-cell CRISPR screens using a CRISPR lentiviral library targeting
    chromatin factors with 6 guide RNAs per gene, in MDA-MB-468 and KOLF2 lines engineered
    to express inducible dCas9, read out with the 10x Genomics 3'HT kit.
collection_timeframes:
- timeframe_details: The NIH RePORTER record for the CM4AI Data Generation Project (core project
    OT2OD032742) gives a project period of 2022-09-01 to 2026-08-31, during which the data
    in this and other quarterly releases were generated; no source states a data collection
    start or end date for this release.
- timeframe_details: The Dataverse record for this release gives a data creation date of 2025-02-27;
    the release was published 2026-06-17, with the immunofluorescence image archives published
    2026-07-15. The project states that data collection and release continue on a quarterly
    basis through the end of the project in November 2026.
