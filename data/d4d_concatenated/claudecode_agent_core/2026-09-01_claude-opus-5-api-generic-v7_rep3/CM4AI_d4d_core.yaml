  id: doi:10.18130/V3/HIGT4C#release-metadata
  name: Release metadata archive
purposes:
- response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data, produced from multimodal interrogation of chromatin modifiers, metabolic enzymes
    and other proteins involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant
    cell lines under perturbed and unperturbed conditions.
- response: To stimulate research and development in "visible" machine learning systems that
    are informed by multi-scale cell and tissue architecture rather than being black boxes.
- response: To produce ethical, AI-ready datasets, packaged with provenance and rich metadata,
    that demonstrate FAIR data management and enable transformative biomedical AI research.
tasks:
- response: Construction of hierarchical, multi-scale maps of human cell architecture, in
    which each node is an assembly of proteins in proximity at a given scale, by integrating
    protein-protein interaction data and immunofluorescence imaging data.
- response: Training and evaluation of visible machine learning systems, including visible
    neural networks (VNNs), for interpretable genotype-phenotype prediction.
- response: Interpretation of genetic variants and mutations against a structured representation
    of cellular components.
addressing_gaps:
- response: In genomics and precision medicine, machine learning models are often black boxes,
    predicting phenotypes from genotypes without an account of the mechanisms by which such
    translation occurs. The project addresses this deficiency by generating matched data and
    tools that allow models to be built directly on knowledge maps of cell and tissue architecture.
- response: Much of human subcellular architecture remains uncharted, and complementary mapping
    technologies have typically been applied separately; the project addresses the absence
    of matched, proteome-wide multimodal measurements collected in the same disease-relevant
    cellular contexts.
- response: The project addresses the absence of an agreed operational definition of AI-readiness
    for biomedical data by releasing datasets that are FAIR, provenanced, characterized, explainable
    and ethically prepared, licensed and distributed.
