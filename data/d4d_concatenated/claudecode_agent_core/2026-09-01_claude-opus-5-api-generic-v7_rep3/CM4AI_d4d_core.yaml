    breast cancer cells, one for paclitaxel treatment (113.3 KB) and one for vorinostat treatment
    (135.8 KB).
  id: doi:10.18130/V3/HIGT4C#ap-ms
  name: AP-MS protein interaction archives, MDA-MB-468
- compression: zip
  description: Two ZIP archives of size-exclusion chromatography-mass spectrometry data, one
    for KOLF2.1J iPSCs and iPSC-derived cell types (171.8 KB) and one for MDA-MB-468 breast
