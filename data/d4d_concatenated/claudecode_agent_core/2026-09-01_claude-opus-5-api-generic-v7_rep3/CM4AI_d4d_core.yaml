- use_category: AI model training
  usage_notes: The project's stated aim is to enable visible machine learning systems built
    on knowledge maps of cell and tissue architecture rather than black-box models.
- use_category: Cellular process analysis
- use_category: Analysis of cell architectural changes and interactions in the presence of
