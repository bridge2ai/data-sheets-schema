missing_data_documentation:
- missing_data_patterns: Computed cell maps are not included in this release. Protein-protein
    interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq data interrogate
    sets of proteins which incompletely overlap. Perturb-seq external repository links for
    KOLF2.1J iPSCs and for MDA-MB-468 cells are listed as embargoed rather than open. AP-MS
    data are present for treated MDA-MB-468 cells only; no AP-MS archive is included for the
    iPSC lines or for untreated MDA-MB-468 cells in this release.
  missing_data_causes: Some datasets are under temporary pre-publication embargo. The release
    is an interim Beta release of an ongoing project whose data acquisition and integration
    continue through the end of the project in November 2026.
  handling_strategy: The release documents its incompleteness explicitly under a completeness
    statement, and commits to regular quarterly updates and augmentation of the dataset through
    the end of the project.
raw_data_sources:
- source_description: MDA-MB-468 (RRID:CVCL_0419), a triple negative breast cancer cell line
    established from a metastatic site pleural effusion of a 51-year-old black female with
    a metastatic mammary adenocarcinoma. The project states the line has been extensively
    used to study triple-negative breast cancer and is well characterized, with transcriptomic,
    mutational profile and whole-genome sequencing data available.
  source_type: Commercially available human cancer cell line
  access_details: Available from ATCC.
- source_description: KOLF2.1J (RRID:CVCL_B5P3), an induced pluripotent stem cell line derived
    from a healthy male Northern European donor, used undifferentiated and differentiated
    into neural progenitor cells, neurons and cardiomyocytes.
  source_type: Human induced pluripotent stem cell line
  access_details: Available from the Human Induced Pluripotent Stem Cells Initiative (HipSci)
    resource, and available for access by non-for-profit organizations via a simple MTA.
- source_description: Raw mass spectrometry files underlying the SEC-MS and AP-MS archives
    in this release.
  source_type: Repository deposit
  raw_data_format: Mass spectrometry raw data files
  access_details: Deposited in the MassIVE repository; separate deposits are listed for SEC-MS
    in KOLF2.1J iPSCs and derivatives, SEC-MS in MDA-MB-468 cells, and AP-MS in paclitaxel-treated
    and vorinostat-treated MDA-MB-468 cells.
- source_description: Raw single-cell sequence data underlying the genome-scale CRISPR interference
    perturbation cell atlas in KOLF2.1J iPSCs and the perturb-seq data in MDA-MB-468 cells.
  source_type: Repository deposit
  raw_data_format: Single-cell RNA sequencing raw sequence data
  access_details: The June 2026 release lists the external perturb-seq links for both KOLF2.1J
    iPSCs and MDA-MB-468 cells as embargoed; a raw sequence archive record is included in
    the release itself.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies: 'Targeted selection of proteins for multimodal interrogation, initially 100
    chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric and
    cardiac disorders, subsequently expanded to additional interactors and signaling molecules.
    Immunofluorescence imaging of a defined panel of proteins of interest in MDA-MB-468 cells
    under each of three treatment conditions. Genome-scale CRISPR interference screening of
    11,739 expressed genes in KOLF2.1J iPSCs, and targeted screening of chromatin regulators
    with 6 guide RNAs per gene. Selection of two disease-relevant cell lines and a defined
    panel of perturbations: MDA-MB-468 untreated or treated with paclitaxel or vorinostat,
    and KOLF2.1J iPSCs undifferentiated or differentiated into neural progenitor cells, neurons
    and cardiomyocytes.'
  why_not_representative: Data in this release were derived from commercially available de-identified
    human cell lines and do not represent all biological variants which may be seen in the
    population at large.
  source_caveats: The number of proteins imaged is not stated for the June 2026 release, whose
    file listing carries no per-file descriptions. The October 2025 and June 2025 releases
    describe 464 proteins of interest and the March 2025 release describes 563; the June 2026
    image archives report the same file sizes as the October 2025 ones but different MD5 checksums,
    so no count is carried over.
preprocessing_strategies:
- preprocessing_details: Protein-protein interaction networks are processed using the node2vec
    deep learning model to reduce dimensionality, producing a PPI embedding that contains
    information about each protein's interactions.
  source_caveats: This is a step of the CM4AI Multi-Scale Integrated Cell (MuSIC) pipeline,
    which consumes the released input data streams to produce cell maps; the June 2026 release
    states that computed cell maps are not included in this release, so this step was not
    applied to the artifacts distributed here.
- preprocessing_details: Immunofluorescence images are processed using a Human Protein Atlas
    deep learning model to reduce dimensionality, producing an image embedding that contains
    information about protein localization.
  source_caveats: A step of the MuSIC pipeline that produces cell maps; the June 2026 release
    states that computed cell maps are not included in this release.
- preprocessing_details: The PPI and image embeddings are integrated into a co-embedding for
    each protein using contrastive deep learning, so that the original embeddings can be reconstructed
    with minimal information loss and proteins with similar PPI and image embeddings receive
    similar co-embeddings.
  source_caveats: A step of the MuSIC pipeline that produces cell maps; the June 2026 release
    states that computed cell maps are not included in this release.
- preprocessing_details: Community detection is performed on the all-by-all similarities of
    pairs of proteins in the co-embedding space, and the resulting hierarchy of protein communities
    is output as the final cell map.
  source_caveats: A step of the MuSIC pipeline that produces cell maps; the June 2026 release
    states that computed cell maps are not included in this release.
cleaning_strategies:
- cleaning_details: Each segment of the MuSIC pipeline calls the FAIRSCAPE client package
    to validate inputs and to create the output RO-Crate package for that segment, with complete
    schemas and validation procedures for all datasets in the provenance graph expressed in
    JSON-Schema and resolvable from the package metadata.
  source_caveats: Described for the MuSIC pipeline, whose cell map outputs are not included
    in this release; the release itself is distributed with RO-Crate metadata and provenance
    produced by the same FAIRSCAPE framework.
- cleaning_details: Data generated by the acquisition modules undergo quality control before
    release; the project preprint records that single-cell CRISPR screen data were being quality
    controlled at the time of writing.
labeling_strategies:
- labeling_details: 'Cell maps are annotated in a two-pronged approach: first, cell maps are
    aligned to known protein function and pathway resources, including the Gene Ontology and
    Reactome, to determine protein assemblies with high overlap with known cell biology; second,
    assemblies are annotated using a large language model approach that names sets of proteins
    and assigns a name confidence score.'
  source_caveats: This annotation procedure applies to the computed cell maps, which the June
    2026 release states are not included in this release.
other_tasks:
- task_details: The individual data streams support analyses beyond cell map construction,
    including proteome-wide mapping of protein complexes and of differential elution profiles
    between control and drug-treated cells, and analysis of transcriptional and fitness phenotypes
    from genome-scale CRISPR interference screens.
- task_details: The project reports exploring integrative structure modeling of protein communities,
    ranking communities by the amount of available structural information from the Protein
    Data Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry and
    disorder prediction, and computing integrative structural models of top-ranked communities
    using the Integrative Modeling Platform.
future_use_impacts:
- impact_details: Because the data derive from two commercially available de-identified human
    cell lines and do not represent all biological variants seen in the population at large,
    models trained on them may not generalize across donors, populations or cellular contexts.
- impact_details: The project's Ethics module anticipates potential applications of the data
    and derived AI and machine learning systems and integrates them into data governance frameworks
    in order to optimize benefits, mitigate potential risks and promote use for the collective
    good; it is developing guidelines, a value repository, a CM4AI Life Cycle framework of
    governance milestones and tools to support awareness of the ethical, legal and social
    ramifications of the data and consequent AI systems.
- impact_details: Applying these laboratory data in clinical or patient-care settings without
    appropriate regulatory oversight and approval is identified by the data generators as
    a foreseeable misuse.
discouraged_uses:
- discouragement_details: Use of this interim release for analyses that require integrated,
    computed cell maps is discouraged, because cell maps are not included and will be added
    in future releases; the current release is most suitable for bioinformatics analysis of
    the individual datasets.
- discouragement_details: Analysis without relevant domain expertise is discouraged; the release
    states that meaningful analysis requires domain expertise.
- discouragement_details: Generalization from these data to the population at large is discouraged,
    since the data derive from commercially available de-identified human cell lines and do
    not represent all biological variants which may be seen in the population at large.
