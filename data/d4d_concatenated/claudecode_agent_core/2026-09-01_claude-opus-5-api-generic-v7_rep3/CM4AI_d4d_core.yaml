distributions:
- compression: zip
  description: 'Three ZIP archives of confocal immunofluorescence images showing the spatial
    localization of proteins of interest in MDA-MB-468 breast cancer cells, one archive per
    condition: untreated (4.6 GB), paclitaxel-treated (3.8 GB) and vorinostat-treated (4.2
    GB). Imaging was performed in the Lundberg Lab at Stanford University.'
