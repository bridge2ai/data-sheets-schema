notes: >-
  The three weak receipts (slot-017, slot-018, slot-028) share one mechanism with the
  rule-11/rule-14 violations: Phase 4 rewrote or added content after the receipt was
  written (funders[0].notes trimmed to only the corrupted award strings, report 2.4;
  the org/grant fragment ids were introduced by reconciliation itself, 2.2/2.4/2.9), so
  the pattern is a playbook-level property of the #742 no-receipt-route path, not a
  one-off drift. In each weak case the value is bundle-true — support exists at lines I
  name — so these are attribution defects, not fabrications. The 12 snippets the
  validator reports in another chunk (9 adjacent, 3 elsewhere) are the known ~2%
  attribution-precision issue (#763), already reported not gated. No instrument
  defects observed: the deterministic validator's counts match what I found in the
  receipt and bundle.
