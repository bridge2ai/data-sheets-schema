  access_review_process: >-
    Access is described as public download with self-attestation. Accessing the
    dataset requires logging in through a verified ID system, agreeing to use the data
    only for type 2 diabetes related research, and agreeing to the license terms,
    which set restrictions and obligations for data usage. The full dataset, including
    the more sensitive variables held under controlled access, is available only by
    entering into a data use agreement; the BMJ Open protocol reports that the
    requirements for controlled access data sets were being developed by the study's
    Data Access Committee, and that controlled access data are available only to
    scientists whose institutions have completed legal and privacy use agreements with
    the AI-READI research programme.
  stewardship_roles:
  - >-
    The AI-READI Consortium is recorded as the data governance committee. Data Managers
    at each data collection site were responsible for quality control of all data
    before uploading to FAIRhub, with additional central processing by the project team
