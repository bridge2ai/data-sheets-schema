relationships:
- relationship_details: >-
    All instances are part of the same prospective data generation project (AI-READI).
    There is currently only one visit per participant; approximately 4 to 10 percent of
    participants are expected to be invited for a follow-up examination in year 4 of the
    project.

splits:
- split_details: >-
    The release comes with a recommended data split. Because sex, race and ethnicity are
    not released with the public version of the dataset, the project team prepared splits
    in proportions of 70%/15%/15% for training, validation and testing, where the
    validation and test sets are balanced as well as possible for sex, race/ethnicity and
    diabetes status (no diabetes, prediabetes/lifestyle controlled, oral medication
    controlled, and insulin controlled). The suggested split is recorded in the
    participants.tsv file included with the dataset. Counts are 1,576 training, 352
    validation and 352 testing, totalling 2,280 participants; mean age is 61.1 +/- 11.3
    years in training, 60.3 +/- 10.8 in validation and 60.5 +/- 11.4 in testing. The
    split is intended to reduce disparities in models developed using the dataset and is
    new in version 3.0.0.

anomalies:
- anomaly_details: >-
    In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: >-
    In wearable device data, improper use and technical failures such as battery failure
    or system malfunction are expected. The Garmin Vivosmart 5 had to be charged every
    two to three days, producing gaps in data collection.
- anomaly_details: >-
    In imaging data, participant uncooperation, noise that may obscure the images,
    technical failures such as system malfunction, and data transfer failures are
    expected.
- anomaly_details: >-
    In a few cases the data collection device had no stored results or was returned too
    late to retrieve the results (for example the battery died and data was lost), and in
    a few cases a data collision at some point in the process caused data loss.
- anomaly_details: >-
    Image quality varies for the handheld, undilated Optomed Aurora fundus camera, both
    between participants and within the same participant, because obtaining a good view
    is challenging without dilation and with a handheld modality. Operator-dependent
    modalities such as the Heidelberg Spectralis may also show quality issues that led to
    skipping the modality and missing data, and the FLIO acquisition is performed last in
    the visit and exposes participants to uncomfortable light levels, so participant
    compliance may be lower.

missing_data_documentation:
- missing_data_patterns: >-
    Not all modalities are available for all participants; missingness is at the level of
    whole study elements or whole device datasets rather than scattered fields.
  missing_data_causes: >-
    Some participants elected not to participate in some study elements. In a few cases
    the data collection device did not have any stored results or was returned too late
    to retrieve the results (for example the battery died and data was lost). In a few
    cases there may have been a data collision at some point in the process and data has
    been lost.
  handling_strategy: >-
    During quality control, records were checked for missing data that could be directly
    filled from other portions of an individual's record, and for incorrect flow through
    prescribed skip patterns; editing was performed only under the guidance and approval
    of the site principal investigator. No instances were excluded from the dataset at the
    time of preprocessing.

