license_and_use_terms:
  license_terms: >-
    AI-READI Data License Agreement, Version 2.0, with Washington University in
    St. Louis as Licensor (https://doi.org/10.5281/zenodo.17555036). The license is a
    custom license specifically tailored to enable reuse of the AI-READI dataset for
    commercial or research purposes while placing strong requirements around data
    usage, security and secondary sharing to protect study participants, especially
    when data is reused for artificial intelligence and machine learning applications.
    It grants a non-exclusive, non-transferable license to download, reproduce and use
    the data and to create derivative works; permits sharing only with other licensees
    bound by identical terms; restricts storage to institutional servers or to cloud
    or remote storage services covered by a HIPAA-approved Business Associate
    Agreement; treats derivative and synthetic data as data subject to all
    restrictions; and requires the licensee to acknowledge the Licensor, the source and
    any funder of the data in any papers reporting use of the data. The agreement
    terminates automatically upon any breach, upon which all copies of the data must be
    deleted. The FAIRhub dataset pages label the license "Health Data License".
  data_use_permission: disease_specific_research

