  distribution: >-
    Aggregate group counts for the 2,280 participants are published in the dataset
    README as part of the recommended split table: by race/ethnicity, Hispanic 380,
    Asian 545, Black 519, white 836; by sex, male 951, female 1,329; by diabetes status,
