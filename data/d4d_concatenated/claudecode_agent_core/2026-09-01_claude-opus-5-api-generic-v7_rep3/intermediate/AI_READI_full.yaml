known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, so there is selection bias known as volunteer bias, which
    may limit the generalisability of results to those who are not represented in the
    study population.
  mitigation_strategy: >-
    Participants are recruited in waves whose composition and size are influenced by the
    observed participation characteristics of race/ethnicity, gender, severity of type 2
    diabetes and site; composition is monitored for diversity and inclusion and adjusted
    by under- and oversampling groups as needed.
- bias_type: sampling_bias
  bias_description: >-
    Recruitment pools were identified by screening the electronic health records of three
    academic health systems for diabetes and prediabetes ICD-10 codes among patients with a
    recent encounter, so recruitment is predominantly urban and hospital-based.
  mitigation_strategy: >-
    Uniform data collection protocols were implemented for all subjects, irrespective of
    race/ethnicity, biological sex or diabetes severity, across all study sites, and the
    three study sites were selected to ensure varied geographic and demographic
    representation and to minimize the potential for sampling bias.
- bias_type: representation_bias
  bias_description: >-
    The study aims for balance across race/ethnicity, biological sex and diabetes presence
    and severity, but interim releases may not have achieved balanced distribution across
    groups, and the cohort omits other races and ethnicities such as Pacific Islanders and
    Native Americans. Black men, Hispanic persons and Asian persons are historically
    under-recruited into health research relative to their disease burden, and the English
    language requirement may have created additional recruitment challenges.
  affected_subsets:
  - >-
    Race/ethnicity groups (Asian, Black, Hispanic, white) and diabetes severity groups.
  mitigation_strategy: >-
    Triple-balanced recruitment targets in equal proportions across four race/ethnic
    groups, four diabetes categories and biological sex; site-specific prioritisation of
    under-represented groups; tailored, personalised recruitment materials; a commitment to
    implement new recruitment strategies if imbalance emerges; and recommended data splits
    with validation and test sets balanced as far as possible for sex, race/ethnicity and
    diabetes status.
- bias_type: measurement_bias
  bias_description: >-
    Several measures were acquired with more than one device model across sites (for
    example three blood pressure monitors and three lensometers, and several retinal
    imaging platforms), and image quality varies with the degree of operator involvement
    and participant cooperation.
  mitigation_strategy: >-
    Information on device make and model, including the specific modality such as macula
    or wide scans during OCT, was documented to ensure repeatability, and multiple devices
    were deliberately included for one measure to enhance generalizability and represent
    the range of equipment used in clinical settings.

known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: >-
    Recruitment is predominantly urban and hospital-based and may not fully capture all
    possible cultural and socioeconomic backgrounds. The study cohort may not provide a
    comprehensive representation of the population, as it does not include other
    races/ethnicities such as Pacific Islanders and Native Americans.
  scope_impact: >-
    Limits the generalization of models derived from the dataset to rural, non-clinic and
    unrepresented populations.
- limitation_type: coverage_limitation
  limitation_description: >-
    While the cross-sectional database ultimately aims to achieve balance across
    race/ethnicity, biological sex, and diabetes presence and severity, the pilot phase is
    not balanced across these parameters, and because enrollment is ongoing the periodic
    data releases may not have achieved balanced distribution across groups.
  recommended_mitigation: >-
    Use the recommended training/validation/testing splits, whose validation and test sets
    are balanced as far as possible for sex, race/ethnicity and diabetes status.
- limitation_type: scope_limitation
  limitation_description: >-
    The public release omits protected health information as well as sex, race/ethnicity
    and medication information; 5-digit zip code, sex, race, ethnicity, genetic sequencing
    data, past health records, medications, and traffic and accident reports are available
    only under controlled access. Raw, pre-standardization data are retained by the
    project but are not shared.
- limitation_type: temporal_limitation
  limitation_description: >-
    The design is cross-sectional and there is currently only one visit per participant, so
    within-person change over time cannot be studied in this release; a longitudinal arm
    inviting a subgroup back in year 4 of the project is planned.
- limitation_type: scope_limitation
  limitation_description: >-
    Eligibility was restricted to adults aged 40 to 85 who are able to provide consent and
    who speak and read English, with pregnancy, gestational diabetes and type 1 diabetes as
    exclusions. Requiring participants to speak, read and understand English may have
    created challenges in recruiting Hispanic and/or Asian persons.

variables:
- variable_name: HbA1c
  data_type: float
  unit: '%'
  measurement_technique: >-
    Whole blood test performed by the University of Washington Nutrition and Obesity
    Research Center testing facility on samples batch-shipped from the collection sites.
  quality_notes: >-
    Reference ranges for the clinical laboratory tests were provided by the testing
    laboratories.
- variable_name: Continuous blood glucose
  data_type: float
  unit: mg/dL
  measurement_technique: >-
    Dexcom G6 real-time integrated continuous glucose monitoring system, one measurement
    every 5 minutes over a 10-day at-home wear period; participants were masked to the
    results during the monitoring period.
- variable_name: Best-corrected visual acuity (logMAR)
  data_type: float
  unit: logMAR
  measurement_technique: >-
    Electronic Visual Acuity tester (M&S Technologies) administered at 4 metres, each eye
    separately, under photopic conditions and under mesopic conditions using a 2.0 neutral
    density filter; expressed as the logarithm of the minimum angle of resolution.
  quality_notes: >-
    Lower numbers indicate better resolution. The Snellen visual acuity variables were
    dropped in version 3.0.0, so only logMAR measurements are available.
- variable_name: Letter contrast sensitivity
  data_type: float
  unit: log contrast sensitivity
  measurement_technique: >-
    Mars Letter Contrast Sensitivity test (Mars Perceptrix) conducted monocularly under
    photopic conditions with a general occluder and under mesopic conditions with a neutral
    density occluder, undilated, at a designed viewing distance of 50 cm.
  quality_notes: >-
    Higher numbers mean better sensitivity; log contrast sensitivity is recorded by
    multiplying the number of errors prior to the final correct letter by 0.04 and
    subtracting the result from the log CS value at the final correct letter.
- variable_name: Montreal Cognitive Assessment total score
  data_type: integer
  maximum_value: 30.0
  measurement_technique: >-
    Montreal Cognitive Assessment administered electronically by research staff on an iPad
    using the MoCA Duo application, capturing total score, section subscores, Memory Index
    Score and task completion times.
  quality_notes: >-
    The maximum score is 30 and anything below 24 is a sign of cognitive impairment; a final
    total score of 26 and above is considered normal. Scores may be affected by a person's
    level of education, socioeconomic factors and mental health conditions.
- variable_name: Systolic blood pressure
  data_type: float
  unit: mm Hg
  measurement_technique: >-
    Measured twice, separated by 2 minutes, with an automatic oscillometric, medically
    approved device; devices used across sites were the OMRON HEM 907XL, the Medline MDS4001
    Automatic Digital Blood Pressure Monitor and the Welch Allyn 6000 series vital signs
    monitor.
- variable_name: Step count
  data_type: integer
  measurement_technique: >-
    Garmin Vivosmart 5 physical activity monitor worn for 10 consecutive days, sampling
    every 5 seconds; participants recorded which wrist the tracker was worn on and their
    dominant hand.
- variable_name: Particulate matter PM2.5
  data_type: float
  measurement_technique: >-
    LeeLab Anura custom-designed environmental sensor placed in a frequently used area of
    the participant's home for 10 days, recording particulate matter counts (PM1.0, PM2.5,
    PM4, PM10) alongside temperature, relative humidity, volatile organic compounds,
    nitrogen oxides and 11 multi-spectral light intensity measurements.

acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: >-
    The acquisition of data varied based on the domain: some data were directly observable,
    such as laboratory results, vitals and retinal imaging, whereas other data were reported
    by subjects, such as survey responses. Verification of data entry was performed when
    possible, for example by cross-referencing entered medications with the medications that
    were physically brought in or photographed by each study participant. The collection type
    is recorded in the RO-Crate as manual human curation.

collection_mechanisms:
- mechanism_details: >-
    REDCap was used for collecting patient-reported questionnaire data and the following
    clinical data from the visit: medications assessment, vitals, visual acuity, contrast
    sensitivity, monofilament test results and complete blood count results. REDCap also
    hosted the recruitment interface, screening survey and electronic consent. The exact
    forms used for data collection in REDCap are published with the dataset documentation.
- mechanism_details: >-
    Electronic health record screening at each site identified recruitment pools, using
    ICD-10 diagnosis codes R73.09 for prediabetes and E11.X for type 2 diabetes among
    patients aged 40 and older with an encounter in the site health system.
- mechanism_details: >-
    Twelve-lead electrocardiography using the Philips PageWriter TC30 Cardiograph, performed
    with the participant in a reclining chair or supine, with the chair position recorded
    (0, 30, 60 or 90 degrees relative to supine).
- mechanism_details: >-
    Retinal photography and fundus imaging using the Optomed Aurora IQ handheld
    non-mydriatic fundus camera (undilated, 50 degree field of view, 5 Mpix sensor) and the
    iCare Eidon widefield TrueColor confocal fundus imaging system (single field central
    infrared/fundus autofluorescence and smart horizontal mosaic, fully automated mode). All
    retinal images are collected under dilated conditions except for the Optomed.
- mechanism_details: >-
    Optical coherence tomography and OCT angiography using the Heidelberg Spectralis HRA
    (optic nerve head radial circle, posterior pole macula 61 lines, macula 20x20 OCTA), the
    Topcon Maestro2 3D OCT-1 (12x9 mm wide, 6x6 mm 3D macula, 6x6 mm OCTA), the Topcon Triton
    DRI OCT (12x9 mm 3D horizontal and radial, 6x6 mm and 12x12 mm OCTA) and the Zeiss Cirrus
    5000 Angioplex (disc cube 200x200, macula cube 512x128, 6x6 mm macula and disc OCTA).
- mechanism_details: >-
    Fluorescence lifetime imaging ophthalmoscopy (FLIO) using the Heidelberg Engineering FLIO
    device, macula-centred, recording short (498-560 nm) and long (560-720 nm) wavelength
    channels; acquisition is performed last in the visit because it takes longer than a
    standard OCT and exposes participants to uncomfortable light levels.
- mechanism_details: >-
    Dexcom G6 continuous glucose monitor applied at the visit and worn continuously for 10
    days at home, recording blood glucose every 5 minutes; participants returned the device by
    overnight mail or in person.
- mechanism_details: >-
    Garmin Vivosmart 5 physical activity monitor worn on the wrist for 10 consecutive days,
    recording steps, heart rate, respiration rate, activity type, oxygen saturation, stress
    level and sleep phases at a 5-second sampling frequency.
- mechanism_details: >-
    LeeLab Anura custom-designed home environmental sensor placed in a frequently used area of
    the participant's home for 10 days, recording ambient temperature, relative humidity,
    nitrogen oxides, volatile organic compounds, particulate matter (PM1.0, PM2.5, PM4, PM10)
    and 11 multi-spectral light intensity measurements. The environmental sensor and the
    fitness tracker were specifically chosen with participant privacy as a primary concern.
- mechanism_details: >-
    Vision and ocular measurement instruments: M&S Technologies EVA for visual acuity at 4
    metres, Mars Letter Contrast Sensitivity charts, Topcon KR 800 auto keratometer/refractor
    for autorefraction, and lensometers (NIDEK LM-600P, Topcon CL-200 and Topcon CL-300).
- mechanism_details: >-
    Peripheral neuropathy assessed with a standard 10 g monofilament applied to three
    locations on the plantar surface of each foot with the participant's eyes closed, with
    insensate areas retested for confirmation; responses recorded on an iPad, laptop or paper
    questionnaire and entered into REDCap. Cognition screened with the Montreal Cognitive
    Assessment on an iPad using the pre-installed MoCA Duo application.
- mechanism_details: >-
    Blood (non-fasting) and urine collection during the visit. Clinical Laboratory Improvement
    Amendments-certified laboratories local to each site performed complete blood counts on
    fresh whole blood; all other laboratory tests were performed by the University of
    Washington Nutrition and Obesity Research Center testing facility on stored, frozen
    samples batch-shipped on dry ice approximately once per quarter. Blood derivatives were
    sent to the biorepository at the University of Alabama at Birmingham Center for Clinical
    and Translational Science.

collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: >-
    The version 3.0.0 release covers data collected from July 19, 2023 to May 1, 2025. The
    overall project timeline spans four years, with one year dedicated to protocol development
    and training and years two to four allocated to subject recruitment and data collection;
    the study start date is recorded as actual on 2023-07-19 and the completion date as
    anticipated on 2027-01-01. Preliminary pilot enrolment occurred between 18 July 2023 and
    30 November 2023 and formal data collection began on 1 December 2023, with recruitment
    planned to continue until 30 November 2026. Approximately 4 percent of participants are
    expected to undergo a follow-up examination in year 4.
  source_caveats: >-
    The FAIRhub study metadata gives an actual start date of 2023-07-19 while the BMJ Open
    protocol states that enrolment began on 18 July 2023; the higher-ranked FAIRhub value is
    used for start_date.

data_collectors:
- role: Clinical research coordinators and research assistants at the three data collection sites
  collector_details: >-
    All research personnel at the three data sites who recruited, enrolled and collected data
    underwent training by the data manager at the University of Alabama at Birmingham and had a
    detailed Manual of Procedures for reference. Successful completion of a certification
    process was required for all coordinators, including mandatory institutional compliance
    training for human subject research, and before enrolling participants all coordinators had
    to successfully administer all protocol elements to at least three volunteer practice
    subjects. Data managers at each site oversaw the process.
- role: AI-READI Consortium research, technical, clinical and data staff
  collector_details: >-
    Roles named in the IRB application include principal and co-investigators, program and
    project managers, database managers, research and data scientists and postdoctoral fellows,
    clinical research coordinators, research assistants, software engineers, cloud engineers,
    phlebotomists, laboratory assistants and domain experts. Their effort was supported by NIH
    award OT2OD032644 based on the percentage of effort contributed, with salaries aligned with
    the funding guidelines at each site. The project team spans senior, mid-career and early
    career faculty as well as coordinators, staff and interns, collectively covering clinical
    research, data collection, data management, data standards, bioinformatics, team science and
    ethics.

direct_collection:
- is_direct: true
  collection_details: >-
    The data was collected directly from participants across the three recruiting sites.
    Recruitment pools were identified by screening electronic health records for diabetes and
    prediabetes ICD-10 codes for all patients who had an encounter with the sites' health
    systems within the past two years. Individuals in each pool were mailed a hardcopy
    invitation letter and sent an invitation email, personalised with links, access codes and QR
    codes directing them to an online REDCap recruitment interface.

sampling_strategies:
- is_sample: false
  is_random: false
  is_representative: false
  source_data: >-
    The study base is all patients aged 40 years and older who had a medical encounter within
    each health system site (University of Alabama at Birmingham, University of California San
    Diego, University of Washington) between 2020 and 2025.
  strategies: >-
    Non-probability sampling. Participants are recruited in waves from contact pools identified
    by screening electronic health records at each site; the composition and size of each wave
    are influenced by the observed participation characteristics of race/ethnicity, gender,
    severity of type 2 diabetes and site, and are adjusted by under- and oversampling groups as
    recruitment progresses. The cohort is triple-balanced by recruiting four race/ethnic groups
    (Asian, Black, white, Hispanic), four categories of type 2 diabetes (no diabetes,
    prediabetes/lifestyle-controlled, controlled by oral or non-insulin injectable medications,
    and insulin-controlled) and biological males and females in equal proportions. All study
    groups are recruited from each site, but the proportion of each group varies with the
    demographic prevalence of that group in the site's geographical area. The dataset itself
    contains all participants enrolled within the collection window rather than a sample of them.
  why_not_representative: >-
    Building balanced datasets is critical for the development of unbiased machine learning
    models, so rather than targeting the demographic distribution of the US population the study
    recruits four race/ethnic groups, four diabetes severity categories and both biological sexes
    in equal proportions. Recruitment is predominantly urban and hospital-based, and the cohort
    does not include other races and ethnicities such as Pacific Islanders and Native Americans.

raw_sources:
- raw_data_details: >-
    Raw data are saved and expected to be preserved by the AI-READI project at least for the
    duration of the project, but are not anticipated to be shared outside the project team,
    because they have not been mapped to standardized terminologies and because the raw data may
    accidentally include personal health information or personally identifiable information, for
    example in free text fields. There is a possibility that raw data may be included in future
    releases of the controlled access dataset.

raw_data_sources:
- source_description: >-
    REDCap electronic data capture containing participant-reported questionnaire responses and
    clinical measurements recorded at the visit (medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament testing and complete blood count results).
  source_type: Electronic data capture system
  access_details: Not shared outside the project team in raw form.
- source_description: >-
    Retinal imaging devices exporting device-native files, including Topcon .fda files from the
    Maestro2 and Triton and Heidelberg .sdt files from FLIO, alongside devices that export DICOM
    directly (Optomed Aurora, iCare Eidon, Heidelberg Spectralis, Zeiss Cirrus).
  raw_data_format: .fda, .sdt and DICOM
- source_description: >-
    Philips PageWriter TC30 Cardiograph 12-lead electrocardiogram exports.
  raw_data_format: .xml
- source_description: >-
    Garmin Vivosmart 5 physical activity monitor exports.
  raw_data_format: .FIT
- source_description: >-
    Dexcom G6 continuous glucose monitor exports of blood glucose measurements taken every 5
    minutes.
  raw_data_format: .csv
- source_description: >-
    LeeLab Anura custom home environmental sensor exports.
  raw_data_format: .csv
- source_description: >-
    MoCA Duo application exports of the Montreal Cognitive Assessment total score, section
    subscores, Memory Index Score and task completion times.
  raw_data_format: .csv
- source_description: >-
    Laboratory results from the University of Washington Nutrition and Obesity Research Center
    for blood and urine testing, and complete blood count results from Clinical Laboratory
    Improvement Amendments-certified laboratories local to each data collection site.
  raw_data_format: .csv
- source_description: >-
    Electronic health records at the University of Alabama at Birmingham, the University of
    California San Diego and the University of Washington, screened for ICD-10 diagnosis codes
    and demographic data to identify eligible participants.
  source_type: Electronic health record system

preprocessing_strategies:
- preprocessing_details: >-
    All data were mapped to standardized terminologies when possible, such as the Observational
    Medical Outcomes Partnership (OMOP) Common Data Model for observational clinical data and
    the Digital Imaging and Communications in Medicine (DICOM) standard for medical imaging
    data.
- preprocessing_details: >-
    For some devices the data are transformed from their proprietary state into a standard model
    format prior to upload to FAIRhub: Topcon .fda and Heidelberg .sdt files are converted to
    DICOM, Garmin .FIT files are converted to the Open mHealth standard, and electrocardiogram
    data are stored in the WaveForm DataBase (WFDB) format.
- preprocessing_details: >-
    The public release is stripped of Protected Health Information as defined by the HIPAA
    Privacy Rule via the Safe Harbor method, as well as information related to the sex and
    race/ethnicity of the participants, which is removed to prevent stigmatization of findings,
    and information about medications used.
- preprocessing_details: >-
    The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1: at the root
    level one directory per datatype, then one folder per modality, then one folder per device
    used to collect that modality, then one folder per participant named after the participant's
    study ID number. Each datatype directory carries a manifest.tsv metadata file, and the
    dataset root carries CHANGELOG.md, dataset_description.json, dataset_structure_description.json,
    healthsheet.md, LICENSE.txt, participants.json, participants.tsv, README.md and
    study_description.json.
- preprocessing_details: >-
    The data may be statically watermarked to identify the licensee for security purposes, as part
    of a data dissemination system intended to deter re-identification attempts.

cleaning_strategies:
- cleaning_details: >-
    Quality control at the time of data entry and acquisition: clinical data outside of expected
    minimum and maximum ranges were flagged in REDCap and were visible in reports viewed by
    clinical research coordinators and data managers. Using these reports as guides, data managers
    and coordinators examined participant records and determined if an error was likely. Data were
    checked for credibility based on range checks, for incorrect flow through prescribed skip
    patterns, for missing data that could be directly filled from other portions of an individual's
    record, and for the omission or duplication of records. Editing was done only under the guidance
    and approval of the site principal investigator; where there was no logical or appropriate way
    to correct the data, the site principal investigator reviewed the values and decided whether
    they should be removed.
- cleaning_details: >-
    Central quality control before dissemination: the data manager at each site was responsible for
    quality control of all data before uploading to FAIRhub, and once data were sent to the central
    project team additional processing steps were conducted in preparation for dissemination. The
    dataset has not undergone any formal external audits, but has been reviewed internally by
    AI-READI team members for quality checks and to ensure that no personally identifiable
    information was accidentally included. An OMOP CDM Data Quality Dashboard file (dqd_omop.json)
    supporting more than 3,500 data quality checks is published with the clinical data directory.

labeling_strategies:
- labeling_details: >-
    No labels or targets are provided and no specific labeling was performed, as the dataset is
    hypothesis-agnostic and aimed at facilitating multiple potential downstream AI/ML applications.
    Consequently there are no annotators, no annotation guidelines, no inter-annotator agreement and
    no labeling software to report, and the project has no formal guidelines recommending how future
    researchers should create new labels or define new tasks.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Recorded in the FAIRhub dataset description as de-identification type "NoDeIdentification": no
    identifiers were collected so no active de-identification was necessary, but the team checked
    that no identifiable data per US HIPAA were present in the data. Direct identifier removal and
    HIPAA de-identification are flagged as applied; date shifting, non-arrangement of dates and
    k-anonymization are flagged as not applied. The public set is stripped of Protected Health
    Information as defined by the HIPAA Privacy Rule using the Safe Harbor method.
  deidentification_details: >-
    The RO-Crate records the release as de-identified. Beyond HIPAA identifiers, information related
    to the sex and race/ethnicity of participants and to medications used has been removed from the
    public release. The dataset was reviewed internally by AI-READI team members to ensure that no
    personally identifiable information was accidentally included. The healthsheet items asking
    specifically about measures taken to avoid re-identification and about de-identification
    preprocessing were returned without a response in the retrieved metadata.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    IRB protocol STUDY00016228. Initial IRB approval was received on December 20, 2022; the initial
    approval letter is published with the version 3.0.0 dataset documentation. An annual renewal
    application to the IRB about the status and progress of the study is required and is due within
    90 days of expiration.
  ethics_review_board: >-
    University of Washington Human Subjects Division IRB, IRB Reliance Team (hsdrely@uw.edu), Human
    Subjects Division, University of Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA
    98195-9470, United States. Reliance agreements are in place with the IRBs of the University of
    Alabama at Birmingham and the University of California, San Diego.
  regulatory_compliance:
  - >-
    Human subject review status is recorded as submitted and approved. The study is not FDA-regulated
    (isFDARegulatedDrug "No", isFDARegulatedDevice "No") and has no data monitoring committee. The
    study is registered on ClinicalTrials.gov as NCT06002048. Licensees must comply with NIH Genomic
    Data Sharing Policy security best practices for controlled-access data.
  special_populations:
  - >-
    Eligibility was limited to adults aged 40 to 85 years who are able to provide consent, with or
    without type 2 diabetes, and who must be able to read and speak English. People who are pregnant,
    who have gestational diabetes, or who have type 1 diabetes were excluded, as were adults older
    than 85 years of age.
  source_caveats: >-
    The RO-Crate names the reviewing body "Washington University IRB" while giving a University of
    Washington Human Subjects Division address and a uw.edu reliance contact; the healthsheet, of
    the same rank, states that initial IRB approval was at the University of Washington, and the BMJ
    Open protocol states that AI-READI was approved by the Institutional Review Board of the
    University of Washington. The University of Washington reading is recorded here.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Minors were not eligible: participants had to be 40 years of age or older. Pregnancy and
    gestational diabetes were exclusion criteria, and pregnancy is exclusionary for participation.
    Transportation assistance in the form of rideshare services was offered to study participants
    who endorsed barriers to transporting themselves to study visits.
  source_caveats: >-
    Derived from the stated eligibility criteria and inclusion measures; the protected-populations
    checkboxes in the retrieved University of Washington IRB application form are not filled in.

informed_consent:
- consent_obtained: true
  consent_type: >-
    Written informed consent, obtained either electronically (e-consent with an electronic signature
    in REDCap, accessed through a unique code emailed to the participant) or in person at the start
    of the visit. The FAIRhub dataset description records the consent type as
    "ConsentSpecifiedNotElsewhereCategorised".
  consent_scope: >-
    The public version of the dataset can only be used for type 2 diabetes related research; a
    private (controlled access) version will allow for more generic use. The recorded consent is not
    restricted to non-commercial use, is not geographically restricted, is not limited to genetic
    studies and does not prohibit methods development.
  consent_documentation: >-
    The approved consent form for the principal project site, the University of Washington
    (AI-READI Consent Form, Standard, Mod 17 May 2023), is published with the version 3.0.0 dataset
    documentation. The other clinical sites had IRB reliance and used the same consent form, with
    minor institution-specific language incorporated depending on individual institutional
    requirements; the University of California, San Diego site additionally includes the State of
    California Experimental Subject's Bill of Rights.
  withdrawal_mechanism: >-
    Participants were permitted to withdraw consent at any time and cease study participation.

collection_consents:
- consent_details: >-
    Informed consent to participate was required before participation in any part of the protocol,
    including questionnaires. Potential participants were given the option to read all consent
    documentation electronically before their visit and to give consent with an electronic signature
    without verbal communication with a clinical research coordinator; participants could access the
    e-consent documentation in REDCap and decide at that point that they did not want to participate
    or that they would like additional information, and could request a call back or a video
    conference with a coordinator. If participants did not select the option to consent
    electronically, consent was performed in person at the start of the visit, followed by
    completion of all questionnaires. Signed electronic consent forms were automatically emailed to
    subjects, who could request an additional copy from the study coordinator for the duration of
    the study.

consent_revocations:
- revocation_details: >-
    Participants were permitted to withdraw consent at any time and cease study participation;
    however, any data that had been shared or used up to that point would stay in the dataset. This
    limitation is clearly communicated in the consent document.

collection_notifications:
- notification_details: >-
    Each individual was aware of the data collection, as this was not passive data collection or
    secondary use of existing data, but rather active data collection directly from participants.
    Potential participants were notified through personalised mailed invitation letters and
    invitation emails directing them to an online REDCap interface where they could read an
    overview of the research programme, expectations for participation and answers to frequently
    asked questions, and could download the informed consent document.

data_protection_impacts:
- impact_details: >-
    No data protection impact analysis has been conducted for the dataset.

participant_privacy:
- anonymization_method: >-
    No direct identifiers were collected, so no active de-identification was necessary; the project
    verified that no identifiable data per US HIPAA were present. The public release is stripped of
    Protected Health Information as defined by the HIPAA Privacy Rule using the Safe Harbor method,
    and additionally omits sex, race/ethnicity and medication information.
  privacy_techniques: >-
    A robust data dissemination system, a strict licence agreement and static data watermarking that
    identifies the licensee are implemented for both the public and controlled sets. The home
    environmental sensor and the Garmin fitness tracker were specifically chosen with participant
    privacy as a primary concern: these devices do not capture video or audio, are not equipped with
    GPS location monitoring and are not synced with participant-owned devices. Study data and
    identifiable information are kept on encrypted servers or in locked cabinets or rooms with
    restricted access at all sites, under a Level 3 data security classification, with access limited
    to authorized research personnel.
  reidentification_risk: >-
    The project reports a theoretical risk of future re-identification, and notes that AI algorithms
    can infer individual patient characteristics and could facilitate individual-level
    identification.
  data_linkage: >-
    The controlled access version links additional variables to the same participants: 5-digit zip
    code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and
    traffic and accident reports.

participant_compensation:
- compensation_provided: true
  compensation_amount: 200 US dollars
  compensation_type: Stipend for the study visit, funded through the grant
  compensation_rationale: >-
    Study subjects received a compensation of 200 US dollars for the study visit through the grant
    funding. The study also covered reasonable costs for parking, public transit or rideshare fees
    related to the study visit, and transportation assistance in the form of rideshare services was
    offered to participants who endorsed barriers to transporting themselves to study visits.
  notes: >-
    The University of Washington IRB application records that the stipend is provided when the final
    data and the study devices are received, typically at least two weeks after the study visit, and
    that the payment is not prorated; it also notes that subjects may incur transport costs that will
    not be reimbursed if transportation fees exceed 25 US dollars.

ethical_reviews:
- reviewing_organization: University of Washington Institutional Review Board (Human Subjects Division)
  review_details: >-
    AI-READI was approved under IRB protocol STUDY00016228, with reliance agreements with the IRBs of
    the University of Alabama at Birmingham and the University of California, San Diego. Initial
    approval was received on December 20, 2022, and the initial approval letter is published with the
    dataset documentation. An annual renewal application about the status and progress of the study is
    required and is due within 90 days of expiration. Written informed consent is provided by all
    participants.
  source_caveats: >-
    The RO-Crate names this body "Washington University IRB" while giving a University of Washington
    Human Subjects Division address and the uw.edu IRB reliance contact.
- reviewing_organization: AI-READI ethics team
  review_details: >-
    The RO-Crate records ethical review by Camille Nebeker, Debra Mathews, Kadija Ferryman and
    Nicholas Evans. Ethical, legal and social implications are considered at every stage of the
    project cycle, and the project aims to establish standards, best practices and guidelines for
    collection, preparation and sharing of the data for AI/ML purposes, including guidance from
    bioethicists. Through engagement with the Native Biodata Consortium the project also pursues a
    co-learning opportunity for understanding challenges specific to American Indian and Alaska
    Native communities and for evaluating tools such as data usage agreements, contract negotiations
    and transparent access agreements.

distribution_formats:
- format: DICOM
  media_type: application/dicom
  notes: >-
    Used for retinal photography, OCT, OCTA and FLIO data.
- format: CSV
  media_type: text/csv
  notes: >-
    Used for clinical data mapped to OMOP CDM tables and for environmental sensor data.
- format: JSON
  media_type: application/json
  notes: >-
    Used for Open mHealth wearable data and for dataset-level metadata files.
- format: Markdown
  media_type: text/markdown
  notes: >-
    Used for dataset documentation files such as README.md, CHANGELOG.md and healthsheet.md.

distribution_dates:
- release_dates: >-
    Version 1.0.0 was distributed on May 3, 2024; version 2.0.0 on November 8, 2024; and version
    3.0.0 on November 17, 2025.
  notes: >-
    The healthsheet summarises the same sequence as May 2024, November 2024 and November 2025.

third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed and available for public use through the FAIRhub platform. Onward
    sharing by licensees is restricted: data may be shared only with another licensee bound by an
    agreement on identical terms, for the purpose of collaborating on projects involving the data.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - >-
    Version 1.0.0 (DOI 10.60775/fairhub.1, released May 3, 2024, 204 participants from the pilot
    data collection phase); version 2.0.0 (DOI 10.60775/fairhub.2, released November 8, 2024, 1,067
    participants, 2.01 TB, 165,051 files); version 3.0.0 (DOI 10.60775/fairhub.3, released November
    17, 2025, 2,280 participants, 3.82 TB, 356,343 files).
  version_details: >-
    The dataset is released as static versions rather than being dynamically updated, and each
    version is accessible through FAIRhub with its own DOI and its own documentation set at
    docs.aireadi.org. The FAIRhub page for version 2.0.0 states that that version is no longer
    accessible and directs users to the latest version. Version 3.0.0 added participants relative to
    version 2.0.0, retained largely the same data fields and types, dropped the Snellen visual
    acuity variables in favour of logMAR measurements only, added imaging devices relative to the
    pilot, and introduced a recommended training/validation/testing split. A smaller mini-subset
    version is available for pipeline development.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset itself will not be updated; instead, new versions of the dataset will be released
    with additional instances as more study participants complete the study visit. There are plans to
    release new versions approximately once a year with additional data from participants enrolled
    since the last release. Enrollment is ongoing, so future versions will include larger numbers of
    participants. Changes between versions are documented in detail in the CHANGELOG file included in
    the dataset and visible at docs.aireadi.org.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. Older versions of
    the dataset are superseded by new releases rather than updated.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.

external_resources:
- external_resources: >-
    AI-READI dataset documentation at https://docs.aireadi.org (select "Dataset v3.0.0" for this
    version), which complements the FAIRhub landing page and describes the citation requirements,
    preliminary information about access and training prerequisites, the healthsheet, each data
    domain with its clinical context, acquisition procedure, individual variables, file formats, data
    standards, metadata and example outputs, AI-readiness considerations, controlled variables, and a
    changelog.
  restrictions:
  - >-
    The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated
    with its use.
  future_guarantees: >-
    The dataset is self-contained; it relies on the documentation only for users requiring additional
    information about the provenance of the dataset.
- external_resources: >-
    AI-READI project website at https://aireadi.org, including the team page and the data sharing
    goals page; the Zenodo community of the AI-READI project at https://zenodo.org/communities/aireadi;
    and the GitHub organization of the AI-READI project at https://github.com/AI-READI. The Clinical
    Dataset Structure specification is published at https://cds-specification.readthedocs.io.

related_datasets:
- relationship_type: is_new_version_of
  target_dataset: doi:10.60775/fairhub.2
  description: >-
    Version 2.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI Project, released
    November 8, 2024, containing 1,067 participants in 165,051 files totalling 2.01 TB. That version
    is no longer accessible on FAIRhub.
- relationship_type: is_described_by
  target_dataset: doi:10.1038/s42255-024-01165-x
  description: >-
    AI-READI Consortium (2024). "AI-READI: rethinking AI data collection, preparation and sharing in
    diabetes research and beyond." Nature Metabolism 6:2210-2212. Introduces the AI-READI dataset, the
    blueprint for AI-ready data generation and the workforce training programme.
- relationship_type: is_described_by
  target_dataset: doi:10.1136/bmjopen-2024-097449
  description: >-
    Owsley C, Matthies DS, McGwin G, et al. "Cross-sectional design and protocol for Artificial
    Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI)." BMJ Open
    2025;15:e097449. Describes the study design, recruitment, protocol, measurement instruments,
    laboratory panel and biorepository.

