purposes:
- response: >-
    To enable future generations of artificial intelligence and machine learning
    (AI/ML) research to provide critical insights into type 2 diabetes mellitus
    (T2DM), including salutogenic pathways to return to health.
- response: >-
    To develop a foundational dataset in type 2 diabetes, agnostic to existing
    classification criteria or biases, which can be used to reconstruct a temporal
    atlas of T2DM development and reversal towards health (salutogenesis).
- response: >-
    To create a model and blueprint for developing large, scalable, ethically sourced
    datasets, and to establish standards, best practices and guidelines for the
    collection, preparation and sharing of data for AI/ML, following the Findable,
    Accessible, Interoperable, Reusable (FAIR) principles.
- response: >-
    To increase access to and quality of AI/ML research by recruiting and training
    personnel, including a year-long research internship programme at the intersection
    of biomedicine and AI.

addressing_gaps:
- response: >-
    The ability to understand and affect the course of complex, multi-organ diseases
    such as type 2 diabetes mellitus has been limited by a lack of well-designed, high
    quality, large and inclusive multimodal datasets.
- response: >-
    A major barrier to AI-based approaches in diabetes research has been the lack of
    diverse datasets that are AI ready for training AI models; the AI-READI dataset is
    intended to fill this gap by being immediately usable for AI/ML research without
    reformatting and preprocessing.
- response: >-
    Past research studies under-represent groups that bear a higher burden of the
    disease. A meta-epidemiological review of type 2 diabetes studies published from
    2000 to 2020 indicated that samples lacked racial and ethnic diversity; the
    AI-READI cohort is designed to be approximately balanced with respect to sex and
    four self-reported race/ethnicity groups (Asian, Black, Hispanic, white) and across
    four categories of diabetes severity.

tasks:
- response: >-
    Downstream pseudotime manifold analysis, an approach used to predict disease
    trajectories by collecting and learning from complex, multimodal data from
    participants with differing disease severity, ranging from normal to
    insulin-dependent type 2 diabetes mellitus.
- response: >-
    Reconstruction of a temporal atlas of type 2 diabetes development and reversal
    towards health (salutogenesis) from a foundational dataset that is agnostic to
    existing classification criteria or biases.
- response: >-
    General multimodal artificial intelligence and machine learning model development
    across clinical, survey, retinal imaging, electrocardiography, continuous glucose
    monitoring, wearable activity and home environmental data. The dataset is
    hypothesis-agnostic and no predefined labels or targets are supplied.

intended_uses:
- use_category: >-
    Artificial intelligence and machine learning research on type 2 diabetes mellitus
    and its salutogenic pathways.
  examples:
  - >-
    Pseudotime manifold analysis of disease trajectories; multimodal model development
    combining retinal imaging, continuous glucose monitoring, wearable activity,
    environmental and clinical data.
  usage_notes: >-
    Access to the public version requires logging in through a verified ID system and
    agreeing to use the data only for type 2 diabetes related research.
- use_category: >-
    Commercial and non-commercial research use, and creation of derivative works,
    under the AI-READI Data License Agreement version 2.0.
  usage_notes: >-
    Licensees may make, reproduce and distribute models, algorithms and programs that
    are developed, trained or adapted using the data but which do not themselves
    contain the data or any modified version of it, provided that before dissemination
    they undertake all reasonable efforts to minimise the likelihood that data can be
    memorized, derived, reconstructed or reconstituted through the use or construction
    of such models. A third-party model may be used to analyze the data if the model
    vendor is party to a HIPAA Business Associate Agreement with the licensee's
    institution and the interaction is short-term, such as prompting or querying.

prohibited_uses:
- prohibition_reason: >-
    Licensees shall not make clinical treatment decisions based on the data, as it is
    intended solely as a research resource.
- prohibition_reason: >-
    Licensees shall not use or attempt to use the data, alone or in concert with other
    information, to compromise or otherwise infringe the confidentiality of information
    about a data subject, to invade or compromise the privacy of any data subject, to
    attempt to identify or contact any data subject or group of data subjects, to
    extract or extrapolate identifying information, to establish a data subject's
    membership in a particular group of persons, or otherwise to cause harm or injury
    to any data subject.
- prohibition_reason: >-
    Licensees shall not share or distribute the data with any third-party model vendor
    or developer for training or development purposes, including model weight
    modification and other adjustments to a model's logic or operation, even where that
    vendor is party to a Business Associate Agreement with the licensee's institution.
- prohibition_reason: >-
    Licensees shall not transfer, license, sublicense, sell, assign, display, share or
    otherwise convey any portion of the data or any derivative work to any third party
    other than another licensee bound by an agreement on identical terms, because
    secondary sharing controls are what protect the study participants.
- prohibition_reason: >-
    Data may not be reproduced in papers, articles, presentations, analyses, reports or
    publications except that small representative samples may be reproduced in up to
    five images or figures per paper for illustrative purposes only; larger amounts
    shall not be published, posted or otherwise made available via supplemental files,
    zip archives, code packages or other means, notwithstanding journal or conference
    requirements.
- prohibition_reason: >-
    Licensees shall take no action to remove, obscure, alter or mask the static
    watermarking that may be applied to identify the licensee for security purposes.

future_use_impacts:
- impact_details: >-
    To the extent of the creators' knowledge, no uses of the dataset are currently
    anticipated that could result in unfair treatment or harm. However, there is a
    theoretical risk of future re-identification.
- impact_details: >-
    AI algorithms can infer individual patient characteristics and could facilitate
    individual-level identification. To prevent re-identification attempts, the project
    implements a robust data dissemination system, a strict licence agreement and data
    watermarking for both the public and controlled sets.

