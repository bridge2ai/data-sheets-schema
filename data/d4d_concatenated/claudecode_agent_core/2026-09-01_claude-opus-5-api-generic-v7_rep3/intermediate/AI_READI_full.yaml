description: >-
  Version 3.0.0 of the AI-READI flagship dataset, an ethically sourced, multimodal
  and AI-ready dataset collected from 2,280 adults with and without type 2 diabetes
  mellitus (T2DM) and harmonized across three data collection sites (University of
  Alabama at Birmingham, University of California San Diego, and University of
  Washington). Data were collected between July 19, 2023 and May 1, 2025. The
  composition of the dataset was designed with future AI/machine learning studies in
  mind: recruitment sampling procedures aimed at an approximately equal distribution
  of participants across diabetes severity, and the acquisition protocol spans
  multiple domains (survey data, physical measurements, clinical data, imaging data,
  wearable device data) to enable downstream AI/ML analyses that may not be feasible
  with existing data sources such as claims or electronic health records. Included
  modalities are clinical and survey data mapped one-to-one to Observational Medical
  Outcomes Partnership (OMOP) Common Data Model tables, 12-lead electrocardiography
  in WaveForm DataBase (WFDB) format, retinal photography, optical coherence
  tomography, optical coherence tomography angiography and fluorescence lifetime
  imaging ophthalmoscopy in DICOM, continuous glucose monitoring and wearable
  activity monitoring in Open mHealth format, and indoor environmental sensor data.
  The release contains 356,343 files totalling approximately 3.82 TB, organized
  following the Clinical Dataset Structure (CDS) v0.1.1 as one directory per
  datatype, then modality, then device, then participant. The public release
  contains no protected health information; information related to participants' sex
  and race/ethnicity and the medications used has been removed and is held in a
  controlled access version together with 5-digit zip code, genetic sequencing data,
  past health records, and traffic and accident reports.

notes: >-
  Device manufacturers Topcon Corporation (Tokyo, Japan), Optomed (Oulu, Finland),
  iCare World (Raleigh, NC) and Carl Zeiss (Oberkochen, Germany) loaned their devices
  for research purposes at no cost, and Heidelberg Engineering, Dexcom and Garmin
  provided research discounts on study devices. The FAIRhub dataset pages and the
  AI-READI documentation site both carry the notice that the repository is under
  review for potential modification in compliance with Administration directives.

source_caveats: >-
  Several source disagreements were encountered. (1) Project name: the FAIRhub
  structured metadata, the healthsheet, the dataset README and the NIH RePORTER
  record all expand AI-READI as "Artificial Intelligence Ready and Exploratory Atlas
  for Diabetes Insights", while the BMJ Open protocol paper expands it as "Artificial
  Intelligence Ready and Equitable Atlas for Diabetes Insights"; the higher-ranked
  FAIRhub sources were preferred. (2) Responsible organization: FAIRhub study
  metadata records Washington University in St. Louis (ROR 01yc7t268) as lead sponsor,
  managing organization and the affiliation of principal investigator Aaron Lee, and
  the license names Washington University in St. Louis as Licensor, while the
  RO-Crate records the principal investigator as "Aaron Lee, Department of
  Ophthalmology, University of Washington" and the BMJ Open protocol and the
  healthsheet place IRB oversight at the University of Washington; the sources are not
  reconciled here. (3) IRB name: the RO-Crate names the reviewing body "Washington
  University IRB" but gives a University of Washington Human Subjects Division address
  and a uw.edu reliance contact, while the healthsheet states that initial IRB
  approval was received at the University of Washington; both are tier-1 sources and
  both readings are recorded. (4) Enrollment start: FAIRhub study metadata gives an
  actual start date of 2023-07-19 (also used as the collection window start), while the
  BMJ Open protocol states enrolment began on 18 July 2023; the higher-ranked FAIRhub
  value was preferred. (5) Target enrollment: FAIRhub, the Nature Metabolism comment
  and the BMJ Open protocol give 4,000 participants, NIH RePORTER gives "4,000+", and
  the University of Washington IRB application form gives 4,600; the higher-ranked
  value of 4,000 was preferred. (6) File counts: the nine datatype directories listed
  in the FAIRhub structure description sum to 356,334 files, while the dataset total is
  reported as 356,343; the difference of nine corresponds to the root-level metadata
  files also listed in that source. (7) Release scope: the healthsheet describes
  version 3.0.0 as covering data "up through the end of the second year of the study",
  while the README changelog labels it the main study release combining year-2 and
  year-3 data; the collection window of 2023-07-19 to 2025-05-01 is consistent across
  both.

conforms_to: >-
  The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1
  specification. Within that structure, each datatype directory follows a file-format
  standard: WaveForm DataBase (WFDB) for cardiac ECG; the Observational Medical
  Outcomes Partnership (OMOP) Common Data Model for clinical data, with each CSV file
  a one-to-one mapping to an OMOP CDM table; the NASA ASCII File Format Guidelines for
  Earth Science Data (ESDS) for environmental sensor data; Digital Imaging and
  Communications in Medicine (DICOM) for retinal FLIO, OCT, OCTA and photography; and
  Open mHealth for the wearable activity monitor and wearable blood glucose data. An
  RO-Crate metadata file conforming to RO-Crate 1.2-DRAFT and the FAIRscape profile 0.1
  is also published for the release.

