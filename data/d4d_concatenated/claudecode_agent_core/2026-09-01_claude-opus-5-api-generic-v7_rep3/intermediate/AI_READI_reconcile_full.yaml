data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: >-
    Access to version 3.0.0 is recorded by the FAIRhub structured metadata as
    "PublicDownloadSelfAttestationRequired". Accessing the dataset requires logging in
    through a verified ID system, agreeing to use the data only for type 2 diabetes
    related research, and agreeing to the license terms, which set restrictions and
    obligations for data usage. The full dataset, including the more sensitive variables
    held under controlled access, is available only by entering into a data use
    agreement. The BMJ Open protocol paper, describing the position as of its writing,
    reported that the requirements for controlled access data sets were then being
    developed by the study's Data Access Committee, and that controlled access data
    would be available only to scientists whose institutions have completed legal and
    privacy use agreements with the AI-READI research programme.
  stewardship_roles:
  - >-
    The AI-READI Consortium is recorded as the data governance committee.
  - >-
    Data Managers at each data collection site were responsible for quality control of
    all data before uploading to FAIRhub, with additional central processing by the
    project team before dissemination.
  - >-
    A Community Advisory Board of 11 persons from the three sites, including diversity
    in race and ethnicity as represented in the AI-READI sample, contributes to the
    development of the protocol.
  notes: >-
    The RO-Crate gives an access conditions URL of https://fairhub.io/datasets/3/access.
  source_caveats: >-
    FAIRhub study metadata records Washington University in St. Louis (ROR 01yc7t268)
    as lead sponsor and managing organization and the license names it as Licensor,
    while the RO-Crate places the principal investigator in the Department of
    Ophthalmology at the University of Washington and the healthsheet and BMJ Open
    protocol place IRB oversight at the University of Washington. The accountable
    organization recorded here follows the FAIRhub structured metadata; the conflict is
    unresolved in the sources and is also recorded at the record root.

license: AI-READI custom license v2.0

license_and_use_terms:
  license_terms: >-
    AI-READI Data License Agreement, Version 2.0, with Washington University in
    St. Louis as Licensor (https://doi.org/10.5281/zenodo.17555036). The license is a
    custom license specifically tailored to enable reuse of the AI-READI dataset for
    commercial or research purposes while placing strong requirements around data
    usage, security and secondary sharing to protect study participants, especially
    when data is reused for artificial intelligence and machine learning applications.
    It grants a non-exclusive, non-transferable license to download, reproduce and use
    the data and to create derivative works; permits sharing only with other licensees
    bound by identical terms; restricts storage to institutional servers or to cloud
    or remote storage services covered by a HIPAA-approved Business Associate
    Agreement; treats derivative and synthetic data as data subject to all
    restrictions; and requires the licensee to acknowledge the Licensor, the source and
    any funder of the data in any papers reporting use of the data. The agreement
    terminates automatically upon any breach, upon which all copies of the data must be
    deleted. Three names for the same license appear in the bundle: the FAIRhub
    structured metadata gives rightsName "AI-READI custom license v2.0", the FAIRhub
    dataset pages label it "Health Data License", and the RO-Crate identifies it by the
    Zenodo DOI https://doi.org/10.5281/zenodo.17555036 alone.
  data_use_permission: disease_specific_research

ip_restrictions:
  restrictions:
  - >-
    Title to the data, and all industrial and intellectual property rights therein,
    remain solely and exclusively with the Licensor (Washington University in
    St. Louis) and its suppliers, and the licensee must not take any action
    inconsistent with such ownership; any rights not expressly granted in the license
    are reserved.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    The healthsheet refers all questions about export controls and other regulatory
    restrictions to the dataset license. Licensees must comply with all data security
    and privacy standards established by the US National Institutes of Health under
    its Genomic Data Sharing (GDS) Policy, currently the NIH Security Best Practices
    for Controlled-Access Data Subject to the NIH GDS Policy, and with all applicable
    laws, regulations and restrictions relating to the distribution and use of the data
    and of models derived from it. The data may be statically watermarked to identify
    the licensee for security purposes, and the licensee must take no action to remove,
    obscure, alter or mask such watermarking.
  other_compliance: >-
    The study is recorded as not FDA-regulated (isFDARegulatedDrug "No",
    isFDARegulatedDevice "No", fdaRegulated false) and as having no data monitoring
    committee. The public release is de-identified under the HIPAA Privacy Rule Safe
    Harbor method.
  notes: >-
    The RO-Crate records a confidentiality level of "HL7:2N (normal)", which does not
    map onto the confidentiality level values available in this schema and is therefore
    recorded here in prose.
  source_caveats: >-
    Two derived values are recorded here rather than quoted. The confidentiality_level
    of "restricted" is derived from the stated access model (verified-ID login,
    type-2-diabetes-only use attestation, licence agreement) rather than from any
    source using that term; the RO-Crate's own term is "HL7:2N (normal)". The
    hipaa_compliant value of "compliant" is derived from the FAIRhub statement that no
    identifiers were collected and that the team verified no identifiable data per US
    HIPAA were present, together with the Nature Metabolism statement that the public
    set is stripped of Protected Health Information via the HIPAA Safe Harbor method;
    no source in the bundle makes a compliance determination in those words.

purposes:
- response: >-
    To enable future generations of artificial intelligence and machine learning
    (AI/ML) research to provide critical insights into type 2 diabetes mellitus
    (T2DM), including salutogenic pathways to return to health.
- response: >-
    To create a model and blueprint for developing large, scalable, ethically sourced
    datasets, and to establish standards, best practices and guidelines for the
    collection, preparation and sharing of data for AI/ML, following the Findable,
    Accessible, Interoperable, Reusable (FAIR) principles.
- response: >-
    To increase access to and quality of AI/ML research by recruiting and training
    personnel, including a year-long research internship programme at the intersection
    of biomedicine and AI.

addressing_gaps:
- response: >-
    The ability to understand and affect the course of complex, multi-organ diseases
    such as type 2 diabetes mellitus has been limited by a lack of well-designed, high
    quality, large and inclusive multimodal datasets.
- response: >-
    A major barrier to AI-based approaches in diabetes research has been the lack of
    diverse datasets that are AI ready for training AI models; the AI-READI dataset is
    intended to fill this gap by being immediately usable for AI/ML research without
    reformatting and preprocessing.
- response: >-
    Past research studies under-represent groups that bear a higher burden of the
    disease. A meta-epidemiological review of type 2 diabetes studies published from
    2000 to 2020 indicated that samples lacked racial and ethnic diversity; the
    AI-READI cohort is designed to be approximately balanced with respect to sex and
    four self-reported race/ethnicity groups (Asian, Black, Hispanic, white) and across
    four categories of diabetes severity.

tasks:
- response: >-
    Downstream pseudotime manifold analysis, an approach used to predict disease
    trajectories by collecting and learning from complex, multimodal data from
    participants with differing disease severity, ranging from normal to
    insulin-dependent type 2 diabetes mellitus.
- response: >-
    Reconstruction of a temporal atlas of type 2 diabetes development and reversal
    towards health, from a foundational dataset agnostic to existing classification
    criteria or biases.
- response: >-
    General multimodal artificial intelligence and machine learning model development
    across clinical, survey, retinal imaging, electrocardiography, continuous glucose
    monitoring, wearable activity and home environmental data.

intended_uses:
- use_category: >-
    Artificial intelligence and machine learning research on type 2 diabetes mellitus
    and its salutogenic pathways.
  examples:
  - >-
    Pseudotime manifold analysis of disease trajectories; multimodal model development
    combining retinal imaging, continuous glucose monitoring, wearable activity,
    environmental and clinical data.
  usage_notes: >-
    Access to the public version requires logging in through a verified ID system and
    agreeing to use the data only for type 2 diabetes related research.
- use_category: >-
    Commercial and non-commercial research use, and creation of derivative works,
    under the AI-READI Data License Agreement version 2.0.
  usage_notes: >-
    Licensees may make, reproduce and distribute models, algorithms and programs that
    are developed, trained or adapted using the data but which do not themselves
    contain the data or any modified version of it, provided that before dissemination
    they undertake all reasonable efforts to minimise the likelihood that data can be
    memorized, derived, reconstructed or reconstituted through the use or construction
    of such models. A third-party model may be used to analyze the data if the model
    vendor is party to a HIPAA Business Associate Agreement with the licensee's
    institution and the interaction is short-term, such as prompting or querying.

prohibited_uses:
- prohibition_reason: >-
    Licensees shall not make clinical treatment decisions based on the data, as it is
    intended solely as a research resource.
- prohibition_reason: >-
    Licensees shall not use or attempt to use the data, alone or in concert with other
    information, to compromise or otherwise infringe the confidentiality of information
    about a data subject, to invade or compromise the privacy of any data subject, to
    attempt to identify or contact any data subject or group of data subjects, to
    extract or extrapolate identifying information, to establish a data subject's
    membership in a particular group of persons, or otherwise to cause harm or injury
    to any data subject.
- prohibition_reason: >-
    Licensees shall not share or distribute the data with any third-party model vendor
    or developer for training or development purposes, including model weight
    modification and other adjustments to a model's logic or operation, even where that
    vendor is party to a Business Associate Agreement with the licensee's institution.
- prohibition_reason: >-
    Licensees shall not transfer, license, sublicense, sell, assign, display, share or
    otherwise convey any portion of the data or any derivative work to any third party
    other than another licensee bound by an agreement on identical terms, because
    secondary sharing controls are what protect the study participants.
- prohibition_reason: >-
    Data may not be reproduced in papers, articles, presentations, analyses, reports or
    publications except that small representative samples may be reproduced in up to
    five images or figures per paper for illustrative purposes only; larger amounts
    shall not be published, posted or otherwise made available via supplemental files,
    zip archives, code packages or other means, notwithstanding journal or conference
    requirements.
- prohibition_reason: >-
    Licensees shall take no action to remove, obscure, alter or mask the static
    watermarking that may be applied to identify the licensee for security purposes.

future_use_impacts:
- impact_details: >-
    To the extent of the creators' knowledge, no uses of the dataset are currently
    anticipated that could result in unfair treatment or harm. However, there is a
    theoretical risk of future re-identification.
- impact_details: >-
    AI algorithms can infer individual patient characteristics and could facilitate
    individual-level identification. To prevent re-identification attempts, the project
    implements a robust data dissemination system, a strict licence agreement and data
    watermarking for both the public and controlled sets.

