subsets:
- id: doi:10.60775/fairhub.3#public
  name: Public release
  description: >-
    The publicly downloadable version of version 3.0.0, containing no protected health information.
    Beyond HIPAA Safe Harbor identifiers, information related to the sex and race/ethnicity of
    participants and to medications used has been removed. The public dataset includes survey data,
    blood and urine lab results, fitness activity levels, clinical measurements such as monofilament
    and cognitive function testing, retinal images, ECG, blood sugar levels, and environmental
    variables such as home air quality. Access requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to the license
    terms. This is the subset the file counts, sizes and DOI recorded on the parent dataset describe.
  is_data_split: false
  is_subpopulation: false
- id: doi:10.60775/fairhub.3#controlled_access
  name: Controlled access release
  description: >-
    A controlled access version containing all data available in the publicly accessible set plus more
    sensitive data. The variables held under controlled access are 5-digit zip code, sex, race,
    ethnicity, genetic sequencing data, past health records, medications, and traffic and accident
    reports. The full dataset is accessible only by entering into a data use agreement; the BMJ Open
    protocol reported that controlled access data would be available only to scientists whose
    institutions have completed legal and privacy use agreements with the AI-READI research programme,
    with the detailed requirements then under development by the study's Data Access Committee. Raw,
    pre-standardization data may be included in future releases of the controlled access dataset.
