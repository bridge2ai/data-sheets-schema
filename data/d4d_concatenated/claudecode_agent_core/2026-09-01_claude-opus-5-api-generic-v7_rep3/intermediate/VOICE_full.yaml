distribution_formats:
- format: >-
    Apache Parquet, an open-source column-oriented binary data file format, used for the dense
    derived features (spectrograms, Mel spectrograms, MFCCs, torchaudio pitch, sparc
    electromagnetic articulography, loudness, periodicity and pitch, phonetic posteriorgrams) and
    for the per-recording metadata.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
- format: >-
    Tab-separated values for the static feature table, the audio quality metrics and the phenotype
    tables, each paired with a JSON data dictionary keyed by column name.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
- format: >-
    WAV audio, organized according to the Brain Imaging Data Structure, available only under
    controlled access.
  access_urls:
  - https://www.synapse.org/Synapse:syn72370534/

distribution_dates:
- release_dates:
  - "2025-01-17 (version 1.1)"
  - "2025-04-16 (version 2.0.0)"
  - "2025-08-18 (version 2.0.1)"
  - "2025-12-16 (version 3.0.0)"
  - "2026-05-01 (version 3.1.0)"

third_party_sharing:
- is_shared: true
  notes: >-
    The dataset is distributed broadly to individuals outside the entity that created it, through
    PhysioNet under registered and credentialed access with a signed data use agreement. Raw audio is
    distributed separately through a controlled access mechanism requiring institutional sign-off.

intended_uses:
- use_category: Clinical machine-learning research
  examples:
  - >-
    Developing, benchmarking or validating clinically applicable machine-learning models for
    diagnosing a wide range of health conditions using voice data.
  - Pretraining and fine-tuning AI models on the derived acoustic features.
  usage_notes: >-
    The dataset is structured to be Findable, Accessible, Interoperable and Reusable, and is
    intended for commercial and non-commercial research purposes by authorized researchers.
- use_category: Voice biomarker research
  examples:
  - >-
    Investigating voice as a non-invasive, cost-effective biomarker for the screening, diagnosis and
    monitoring of vocal pathologies and of neurological, psychiatric and respiratory conditions.
  usage_notes: >-
    Data are organized into disease cohorts with clinician-validated diagnoses, permitting analyses
    that contrast a cohort with controls.
- use_category: Methods, standards and cohort construction
  examples:
  - >-
    Using the questionnaire features distributed in the phenotype folder for cohort selection.
  - >-
    Developing bioinformatics standards and evidence-based recording protocols for acoustic data.
  usage_notes: >-
    The process for deriving any new labels should be described alongside any release of a model or
    publication, including the exact variables used for that determination.

existing_uses:
- examples:
  - >-
    A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer
    School and hackathon.
  - >-
    Training opportunities for using the dataset are offered through the Bridge2AI Voice Scholars
    program at https://www.b2aivoicescholars.org/

discouraged_uses:
- discouragement_details: >-
    Use in hiring decisions is discouraged, because such non-research application of health and
    voice characteristics could produce unethical or biased outcomes that negatively affect
    individuals.
- discouragement_details: >-
    Use in insurance premium adjustment is discouraged, because it could lead to individuals being
    disadvantaged on the basis of their health conditions or voice characteristics.
- discouragement_details: >-
    Use in any form of surveillance that could lead to discrimination or harm is discouraged; the
    dataset is intended strictly for research that prioritizes patient safety, privacy and ethical
    use.

prohibited_uses:
- prohibition_reason: >-
    Attempting to re-identify research participants, or taking any action that could reasonably lead
    to re-identification, is prohibited under the Registered Access Agreement, because participants
    consented on the understanding that identifying information would be withheld and because voice
    is inherently identifying.
- prohibition_reason: >-
    Any purpose that could foreseeably cause harm or stigmatization to research participants, their
    families, communities or specific populations is prohibited, reflecting the consortium's
    commitment to research practices that respect and protect the rights and interests of research
    participants.
- prohibition_reason: >-
    Using intellectual property protections, database rights or related rights in a manner that
    restricts or limits access to any part of the dataset, or to conclusions derived directly from
    it, is prohibited so that future use of the dataset remains unrestricted, in alignment with the
    Open Science principles upheld by the consortium.
- prohibition_reason: >-
    Sale of all or part of the data on any media is not permitted under the Data Transfer and Use
    Agreement, which grants only the duplication reasonably required to carry out the approved
    research project.
- prohibition_reason: >-
    Recipients may not use the data, alone or in concert with any other information, to make any
    effort to contact individuals who are the subjects of the data without appropriate institutional
    review board approval, specific written approval from the provider, and informed consent from
    the individual where required.

future_use_impacts:
- impact_details: >-
    The dataset carries skews by disorder category, site and other demographic factors. Users should
    consider the multivariate distribution when assessing utility for different questions, since
    models trained without accounting for those skews risk unfair treatment of groups, quality of
    service problems, or other harms.
- impact_details: >-
    Integration of voice-based assessments into digital health tools has the potential to advance
    early disease detection, continuous disease monitoring and personalized treatment strategies,
    and to extend screening to low-resource settings where specialist assessment is costly or slow.

maintainers:
- role: academic_institution
  maintainer_details: >-
    The dataset is hosted on PhysioNet, maintained by the MIT Laboratory for Computational
    Physiology, which provides the technical infrastructure and continued access for credentialed
    researchers.
  source_caveats: >-
    The project documentation describes hosting by the Health Data Nexus, a platform maintained by
    the Temerty Centre for Artificial Intelligence Research and Education in Medicine at the
    University of Toronto; that description corresponds to the earlier v1.0 release, and the
    PhysioNet record for the current version is preferred here.
- role: academic_institution
  maintainer_details: >-
    The Bridge2AI-Voice consortium curates the data and handles access requests through the Data
    Access Compliance Office, reachable at DACO@b2ai-voice.org; questions about the dataset itself go
    to the corresponding author listed on the PhysioNet record.
- role: government_agency
  maintainer_details: >-
    The dataset is supported by the National Institutes of Health via the Bridge2AI Common Fund
    program.

updates:
- frequency: Semi-annual, that is twice a year.
  update_details: >-
    Further versions are released periodically as new versions of the dataset on the publishing
    platform, and users are notified through news items on the platform and through standard
    communication channels. There is no separate erratum document; a changelog for each dataset
    version is published online with the dataset metadata. Version 3.1.0 added no new participants
    but released additional data for certain participants, fixed broken parquet files from the
    previous release, added audio quality metrics and per-recording metadata, back-filled validated
    diagnosis information across conditions, rearranged some phenotype files and renamed certain
    gold standard variables.
  source_caveats: >-
    The semi-annual cadence is stated in the project documentation; the observed PhysioNet release
    dates run January 2025, April 2025, August 2025, December 2025 and May 2026.

version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
  - "1.0, published on the Health Data Nexus, DOI 10.57764/qb6h-em84"
  - "1.1, 17 January 2025, DOI 10.13026/249v-w155"
  - "2.0.0, 16 April 2025"
  - "2.0.1, 18 August 2025"
  - "3.0.0, 16 December 2025, DOI 10.13026/k81f-qr68"
  - "3.1.0, 1 May 2026, DOI 10.13026/8xbn-nq66"
  version_details: >-
    Each version of the dataset has a unique DOI and a version-independent DOI resolves to the
    latest version. By default older versions continue to be supported, hosted and made available to
    researchers, though the dataset publishers reserve the right to remove access to older versions;
    the files for version 1.1 are no longer available and users are directed to the latest version.
    The initial release provided 12,523 recordings for 306 participants.

errata:
- erratum_details: >-
    Spectrograms were reprocessed in version 2.0 to fix minor issues identified in the previous
    release, and all spectrograms and Mel-frequency cepstral coefficients derived from free speech
    files were removed.
- erratum_details: Version 2.0.1 corrected errors in the authorship list.
- erratum_details: Version 3.1.0 fixed broken parquet files present in the version 3.0.0 release.

retention_limit:
  retention_period: >-
    Indefinite for the hosted dataset; two years for recipients under the Data Transfer and Use
    Agreement; a maximum of ten years after study completion for identifiable data held locally by
    the collecting institutions.
  retention_details: >-
    Once data is contributed it will be retained as long as it is useful for research purposes,
    possibly indefinitely, and participants were not told that their data would be deleted after a
    fixed period. Recipients of the data under the Data Transfer and Use Agreement must destroy or
    return it two years after the start date, upon completion of the project, upon termination, or
    upon expiration of the applicable ethics approval, whichever occurs first, and must submit
    written certification of destruction within thirty days, retaining at most one copy where records
    retention law, institutional policy or research integrity verification requires it. Under the
    collection protocol, identifiable data and the datasheets linking participant numbers to
    participant information are kept at each institution on local cloud storage for a maximum of ten
    years after study completion and are then destroyed, which is the responsibility of each local
    principal investigator.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    Others may extend or augment the dataset by publishing a derivative dataset that references the
    original source, made available under the same conditions as the source data. For the code used
    to produce the data, the open-source repositories have discussion forums and issue pages for
    public discussion of data preprocessing, and accept pull requests contributing improvements to
    the preprocessing code.

data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: >-
    Access is tiered. For the feature-only data under registered access, a user registers on
    PhysioNet, confirms their identity, becomes a credentialed user and signs the Bridge2AI Voice
    Registered Access Agreement; no additional training is required. For the raw audio under
    controlled access, the applicant completes a Data Access Request Form and a Data Use Agreement
    and submits the application to the Data Access Compliance Office for review at
    DACO@b2ai-voice.org; upon approval, a Data Use and Transfer Agreement must be signed by an
    authorized official at the applicant's institution before the data are released through Synapse.
    A published memorandum sets out the ethical justification for controlled access to raw voice
    data samples.
  stewardship_roles:
  - >-
    The University of South Florida Board of Trustees is the provider institution under the Data
    Transfer and Use Agreement, and the recipient scientist together with the recipient institution's
    authorized official are accountable for compliance at the receiving institution. Recipients must
    retain control over the data, restrict use to authorized persons listed in the agreement, and
    bind those persons to equivalent confidentiality and security standards. Collaborators at other
    research organizations, and other research teams at the same organization, must apply
    independently for access and sign their own Data Transfer and Use Agreement. Each collecting
    institution retains its own identifiable data behind institutional access controls.

license_and_use_terms:
  data_use_permission: general_research_use
  license_terms: >-
    Files are released under the Bridge2AI Voice Registered Access License, with access limited to
    credentialed users who sign the Bridge2AI Voice Registered Access Agreement. The data may be
    protected by copyright and other rights; duplication as reasonably required to carry out the
    approved research project is permitted, but sale of all or part of the data on any media is not.
    Nothing in the agreement transfers intellectual property rights in the data to the user, users
    agree not to make intellectual property claims on the data, and users agree to respect the Fort
    Lauderdale Agreement and to implement licensing policies that will not obstruct further research.
    No fees are associated with these restrictions.

ip_restrictions:
  restrictions:
  - >-
    Users acknowledge that the data may be protected by copyright and other intellectual property
    rights, and that nothing in the access agreement transfers any such rights to them.
  - >-
    Users agree not to make intellectual property claims on the data and not to use intellectual
    property protection, database rights or related rights in ways that would prevent or block access
    to, or use of, any element of the data or conclusions drawn directly from it.
  - >-
    Users who perform further research adding intellectual and resource capital to the data may
    obtain intellectual property rights on those downstream discoveries, provided they implement
    licensing policies that will not obstruct further research.
  - >-
    No third parties have imposed intellectual-property-based or other restrictions on the data
    associated with the instances.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  other_compliance: >-
    No export controls or other regulatory restrictions apply to the dataset. The identifiable source
    data are covered by a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas for identifying information or characteristics
    of a research participant. Recipients must store the data with administrative, physical and
    technical safeguards adequate to protect personally identifiable information, must notify the
    provider of any unauthorized use or disclosure no later than five business days after discovery,
    and must adhere to the specific requirements of PhysioNet, managed by the MIT Laboratory for
    Computational Physiology.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor de-identification supplemented by removal of indirect identifiers, of
    highly sensitive non-identifying elements, and of all raw voice data from the public release.
  identifiers_removed:
  - Names
  - Civic addresses and other geographic locators
  - Social security numbers
  - Date information at a resolution finer than years
  - Phone and fax numbers
  - Email addresses and IP addresses
  - Medical record numbers and health plan beneficiary numbers
  - Device identifiers, license numbers, account numbers and vehicle identifiers
  - Website URLs, full face photos and biometric identifiers
  - State and province, with only the country of data collection retained
  - Narrative text fields and transcripts of free speech audio
  - Select geographic and demographic identifiers, household composition and cultural identity
  - >-
    Non-identifying but highly sensitive elements such as household income, mental health status and
    traumatic life experiences
  - Raw voice recordings
  deidentification_details: >-
    All direct identifiers were removed because they would reveal the identity of the research
    participant. Indirect identifiers were removed where they created a significant risk of
    re-identification through combination with other public data available on social media, in
    government registries or elsewhere. Raw audio transcripts were reviewed and any recordings
    containing potentially identifying information or external voices were removed from the release.
    All fields encoded as sensitive in the REDCap data dictionary were removed. Spectrograms, Mel
    spectrograms, MFCCs, phonetic posteriorgrams and articulography estimates derived from
    open-response prompts were withheld. The dataset does not achieve k-anonymization with k greater
    than or equal to two.

participant_privacy:
- anonymization_method: >-
    Removal of direct and HIPAA Safe Harbor identifiers, removal of indirect identifiers presenting
    significant re-identification risk, removal of narrative text fields, generalization of
    geographic information to country, and exclusion of raw voice waveforms from the public release.
  privacy_techniques:
  - Tiered dissemination, with registered access for low-risk derived features and controlled access for raw audio.
  - Retention of identifiable data behind institutional firewalls at each collecting site.
  - Assignment of study participant identifiers in place of institutional identifiers.
  - Review of transcripts to remove recordings containing identifying information or external voices.
  - Transmission of collected data over secure HTTPS protocols to HIPAA-compliant storage.
  - Federated learning infrastructure allowing model training without data leaving the institution.
  data_linkage: >-
    Released records are linked across features and phenotype tables by participant_id and
    session_id. The key linking participant numbers to participant information is held at each
    institution and is not part of the release.
  reidentification_risk: >-
    Voice is inherently identifying and cannot be fully de-identified, so raw voice data was removed
    from the public release and is disseminated only under controlled access. K-anonymization with k
    greater than or equal to two is not achieved for the released tables.

informed_consent:
- consent_obtained: true
  consent_type: >-
    Prospective written informed consent obtained before data collection, with parental permission
    and child assent used for the pediatric arm collected under a separate release.
  consent_documentation: >-
    Consent may be recorded on a signed paper copy, electronically within the application or through
    REDCap survey forms, or by video recording within the application in which the participant reads
    a statement aloud so that identity can be verified. Paper consent documents are uploaded and
    saved electronically in REDCap, and all paper and electronic versions are stored for at least
    five years after study completion.
  consent_scope: >-
    Consent covers collection and use of voice, speech and respiratory sound data together with
    demographic, questionnaire and clinical information; access by investigators to medical
    information through electronic health record platforms for gold standard validation; sharing of
    research data not containing direct identifiers with external researchers through a secure
    database; registered-access release to the general public of data posing a low risk of
    re-identification; and controlled-access release to authorized researchers of data that would
    pose a heightened risk if shared in full open access.
  withdrawal_mechanism: >-
    Participants may withdraw at any point. Data are excluded if withdrawal occurs during or before
    completion of voice data collection; data already completed cannot be removed once voice data
    collection is finished. Participants who withdraw may optionally complete a satisfaction survey
    that collects no protected health information.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    The clinical study was submitted to and approved by the University of South Florida single IRB,
    with subsite IRBs approved through the single IRB process. Data collection and sharing for the
    released dataset was approved by the University of South Florida Institutional Review Board.
  ethics_review_board: University of South Florida Institutional Review Board
  regulatory_compliance:
  - >-
    The study is not for a drug product and not for a medical device, and no data monitoring
    committee was appointed. Voice, clinical and identifiable data are handled under HIPAA-compliant
    procedures, with a partial HIPAA waiver obtained for chart review during recruitment and
    screening; identifiable data are covered by a Certificate of Confidentiality.
  special_populations:
  - >-
    Eligibility for the adult cohort was 18 years and older, up to a maximum age of 120, with healthy
    volunteers accepted. Minors were enrolled only at pediatric sites under a separate arrangement
    and are released as a separate dataset.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    The adult cohort is restricted to participants aged 18 or older who are able to read and speak
    English and to provide informed consent for themselves; individuals unable to provide informed
    consent in English were excluded.
  notes: >-
    The collection protocol also governs a pediatric cohort recruited only at pediatric sites, for
    which parental or guardian permission was obtained and verbal assent was sought from children
    where developmentally appropriate, typically from seven years of age; that cohort is published
    as a separate dataset.

participant_compensation:
- compensation_provided: true
  compensation_type: Electronic gift cards.
  compensation_amount: >-
    40 US dollars for a data collection session taking less than 90 minutes and 80 US dollars for a
    session taking over 90 minutes, for no more than three sessions and a maximum total compensation
    of 120 US dollars.

ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: >-
    The clinical study was submitted to and approved by the USF single IRB, and subsite IRBs were
    approved through the single IRB process. Data collection and sharing was approved by the
    University of South Florida Institutional Review Board. The study is not for a drug product or
    medical device, and no data monitoring committee was appointed.
- reviewing_organization: >-
    Research ethics boards of the Canadian participating institutions, including Mount Sinai
    Hospital, The Hospital for Sick Children and the University of Toronto
  review_details: >-
    Canadian institutions do not fall under the United States single-IRB process and applied
    separately for research ethics board approval to comply with Canadian regulations; copies of the
    approved applications were submitted to the USF IRB. Genomic data collection and analysis, which
    is not part of this release, was covered by a separate protocol at the University of Toronto and
    Mount Sinai Hospital.

data_protection_impacts:
- impact_details: >-
    A team of ethicists reviewed the data and identified the sensitive fields to be removed, and the
    consortium published a memorandum setting out the ethical justification for restricting raw voice
    data samples to controlled access, on the basis that voice can cause individual re-identification
    or be used for illicit or unauthorized purposes. The consortium also identifies re-identification
    of patients by voice, voice hacking and data ownership as ethical and legal challenges requiring
    a governance framework.
  source_caveats: >-
    The healthsheet answers "No" to the question of whether an analysis of the potential impact of
    the dataset and its use on data subjects has been conducted; the ethics review of sensitive
    fields and the controlled-access memorandum are recorded separately in the same documentation.

funders:
- grantor: >-
    National Institutes of Health Common Fund, through the Bridge2AI program, awarded to the
    University of South Florida.
  notes: >-
    Award identifiers cited across the sources are OT2OD032720 as the core project number,
    3OT2OD032720-01S1 in the PhysioNet release acknowledgements, 1OT2OD032720-01 in the feasibility
    publication, and 3OT2OD032720-01S3 as the application recorded in NIH RePORTER (application ID
    11376382, fiscal year 2025 award amount 4,660,942 US dollars). The project period runs from 1
    September 2022 to 30 November 2026.