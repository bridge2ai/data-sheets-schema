splits:
- split_details: >-
    No recommended training, validation or test splits are provided. Researchers are encouraged to
    create their own splits based on their specific requirements, taking into account the skews in
    the data by disorder category, site and demographic factors.

subpopulations:
- subpopulation_elements_present: true
  identification: >-
    Demographic subpopulations are identified by age, gender, sex, ethnicity and socioeconomic
    status in the demographics instrument; participants are additionally grouped by disease cohort
    into voice disorders, respiratory disorders, neurological and neurodegenerative disorders,
    mood and psychiatric disorders, and controls.
  distribution: >-
    The public data releases do not contain an equal distribution of the disease cohort categories,
    and the dataset shows skews by disorder category, recording site and demographic factors.

sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: >-
    The dataset includes race and ethnicity information reported by participants in the
    demographics instrument.
- sensitive_elements_present: true
  sensitivity_details: >-
    The dataset includes sexual orientation information reported by participants.
- sensitive_elements_present: true
  sensitivity_details: >-
    The dataset includes socioeconomic and health information, including diagnosis, psychiatric
    history and validated questionnaire responses covering depression, anxiety, post-traumatic
    stress and attention deficit symptoms.
- sensitive_elements_present: true
  sensitivity_details: >-
    Raw voice recordings are biometric data capable of identifying the speaker. They are excluded
    from the registered-access release and disseminated only under controlled access.

confidential_elements:
- confidential_elements_present: false
  confidentiality_details: >-
    The dataset creators report that the released data do not contain material protected by legal
    privilege, by doctor-patient confidentiality, or non-public communications of individuals.

content_warnings:
- content_warnings_present: true
  warnings:
  - >-
    Phenotype tables contain self-reported responses to instruments covering depression, suicidal
    ideation, anxiety, post-traumatic stress, substance use and psychiatric history, which some
    users may find distressing.
  - >-
    Free speech tasks were recorded in open-response form, and although the inclusion of
    offensive or distressing content is unlikely it cannot be completely avoided because
    participants are responsible for their choice of language.
  source_caveats: >-
    The healthsheet in the project documentation notes the risk arising from transcriptions of free
    speech tasks. The PhysioNet v3.0.0 and v3.1.0 releases state that transcripts of free speech
    audio were removed and that spectrogram-like features were excluded where the audio contained
    free speech, so the residual exposure in the released files is limited to questionnaire content
    and static features.

anomalies:
- anomaly_details: >-
    Different sites used different collection configurations, and the collection protocol changed
    over the course of the study.
- anomaly_details: >-
    Recordings contain noise artifacts, and the recording distance varied because the head-mounted
    headset microphone could sit at slightly different distances from the speaker.
- anomaly_details: >-
    Diagnostic practice varies between clinicians and sites; depending on the disorder the
    clinical diagnosis was made by a single clinician, or taken from an electronic health record or
    an active prescription.
- anomaly_details: >-
    Questionnaire responses may be inaccurate and conditions may be underreported by participants.
- anomaly_details: >-
    Derived text such as transcription was generated using off-the-shelf models that have not been
    audited for correctness.
- anomaly_details: >-
    Some audio files could not generate certain derived features, whether because of length or
    other issues, and are therefore absent from the corresponding feature files.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Participants were recruited from high-volume expert clinics at a limited number of academic
    institutions, so the sample reflects the case mix and referral patterns of specialty care
    rather than of the general population.
  affected_subsets:
  - All adult disease cohorts and the control cohort.
- bias_type: sampling_bias
  bias_description: >-
    The study used a non-probability sample drawn from an ongoing collection at a limited number of
    geographic locations, and is therefore not representative of the larger population.
  mitigation_strategy: >-
    The creators state that they hope to make the dataset more representative by shifting to remote
    collection and by designing the recruiting approach to control for more variables.
- bias_type: representation_bias
  bias_description: >-
    Eligibility required fluency in English, and the dataset shows skews by disorder category, site
    and other demographic factors. Groups with less trust in the medical system or in AI, or living
    further from the collection sites, were less likely to be recruited.
  mitigation_strategy: >-
    Users should consider the multivariate distribution of disorder, site and demographic variables
    when assessing the dataset's utility for a given question.
- bias_type: measurement_bias
  bias_description: >-
    Participants were screened for different disorders depending on the site, so cohort membership
    is confounded with the recording site and with the particular tablet device used there.
  affected_subsets:
  - Cohorts recruited at a single site.
- bias_type: annotation_bias
  bias_description: >-
    A single labeler provided the diagnostic label for each instance, typically the clinician at the
    site of data collection or a clinician who had made a prior diagnostic assessment, so
    labels carry that clinician's judgment without adjudication.

known_limitations:
- limitation_type: coverage_limitation
  limitation_description: >-
    Data collection was conducted in English only; participants who do not read or speak English
    were excluded. Spanish versions of the protocol are under development and were not part of this
    release.
- limitation_type: representativeness_limitation
  limitation_description: >-
    The release is a sample of a larger, ongoing collection gathered at five North American sites,
    and is not representative because of the limited number of geographic locations.
- limitation_type: temporal_limitation
  limitation_description: >-
    Changes in diagnostic criteria or clinical practice over the collection period are a potential
    source of distribution shift between earlier and later participants.
- limitation_type: scope_limitation
  limitation_description: >-
    Raw audio waveforms are not part of the release, and spectrograms, Mel spectrograms, MFCCs,
    phonetic posteriorgrams and articulography estimates were withheld for sensitive records, audio
    checks and free speech tasks, so analyses requiring the original signal or the acoustic detail
    of open-response speech cannot be performed on the registered-access files.
- limitation_type: integration_limitation
  limitation_description: >-
    Multimodal data collected by the project outside the app, including laryngoscopy imaging, brain
    imaging, respiratory function tests, genomic data and other electronic health record content,
    are extracted at the collecting sites and were not included in this release.
- limitation_type: methodological_limitation
  limitation_description: >-
    The dataset was audited internally for missingness and consistency by the data release team,
    but the AI-readiness self-assessment records the data quality criterion as not met, and
    human-level performance on the tasks the dataset supports is reported to vary widely.

missing_data_documentation:
- missing_data_patterns:
  - >-
    Phenotype data files contain a row for a participant only if at least one column is not
    missing, so participants with no response to an instrument do not appear in that file.
  - >-
    Each participant answered a common set of questions and then additional questions relevant to
    their primary diagnostic category, so cohort-specific instruments are systematically absent for
    participants outside that cohort.
  - >-
    Derived feature files omit recordings for which the feature could not be generated, and omit
    features for sensitive records, audio checks and free speech tasks.
  missing_data_causes:
  - Some questionnaire items are optional and were left unanswered.
  - Data collection irregularities caused information to be missing from individual instances.
  - Removal of sensitive and re-identifying content during de-identification.
  handling_strategy: >-
    No imputation was performed. A missingness table is generated as part of the audit protocol and
    is included with the dataset.

cleaning_strategies:
- cleaning_details: >-
    The dataset creators report that no pre-processing for cleaning the data was applied, in either
    the preliminary or the current version.
- cleaning_details: >-
    An audit protocol is applied instead of cleaning. It generates missingness tables, checks
    distributions and outliers, validates categorical responses against the schema, and runs
    quality-control metrics on audio tasks, including the amount of silence and the duration of the
    waveform and, for speech tasks, comparison of the produced speech against the intended passage.
    Version 3.1.0 releases the resulting audio quality metrics as a tab-separated file.

preprocessing_strategies:
- preprocessing_details: >-
    Raw audio was standardized by converting to monaural and resampling to 16 kHz with a Butterworth
    anti-aliasing filter applied.
- preprocessing_details: >-
    Time-frequency representations were computed with the short-time Fast Fourier Transform using a
    25 ms window, a 10 ms hop length and a 400-point FFT, and spectrograms were downsampled by a
    factor of two in the time domain after derivation. Mel spectrograms were computed with the same
    parameters and 60 Mel bins, and 60 Mel-frequency cepstral coefficients were derived from them.
  source_caveats: >-
    The v1.1 release used a 512-point FFT and did not downsample in the time domain; the parameters
    recorded here are those of the v3.1.0 release.
- preprocessing_details: >-
    Articulatory features were generated with the Speech Articulatory Coding package at 50 Hz,
    yielding kinematic traces of six vocal tract articulators as electromagnetic articulography
    estimates, together with loudness, periodicity and pitch measures; torchaudio pitch was computed
    over a range of 80 to 500 Hz and the sparc pitch estimator over 50 to 550 Hz.
- preprocessing_details: >-
    Acoustic features were extracted with openSMILE, capturing temporal dynamics and acoustic
    characteristics, and phonetic and prosodic features providing fundamental frequency, formants
    and voice quality measures were computed with Parselmouth and Praat. Phonetic posteriorgrams
    over 40 phoneme categories were generated at 100 Hz.
- preprocessing_details: >-
    De-identification removed HIPAA Safe Harbor identifiers, removed state and province while
    retaining the country of collection, removed narrative text fields and transcripts of free
    speech audio, and excluded spectrograms and similar features where the audio contained free
    speech. Static and other features that do not encode the sensitive information were retained.
- preprocessing_details: >-
    Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap
    were converted to be compliant with the Brain Imaging Data Structure v1.9.0, and the phenotype
    tables and derived features were assembled with the open-source b2aiprep library, version 3.0.0
    for this release.

labeling_strategies:
- labeling_details: >-
    Diagnostic labels are the result of a clinical assessment of the participant. At each site a
    local clinician provided the diagnosis based on a clinical interview and appropriate work-up
    against cohort-specific gold standards. For the psychiatric disorders cohort the assessment was
    determined from the participant's electronic health record or an active prescription, made
    outside of data collection by an appropriately licensed clinician.
  annotations_per_item: 1
  annotator_demographics:
  - >-
    Typically the clinician at the site of data collection, or a clinician external to the study who
    made the prior diagnostic assessment.
  data_annotation_platform: >-
    Diagnosis and clinical validation forms captured in REDCap alongside the custom tablet
    application used for acoustic and questionnaire data collection.
  data_annotation_protocol: >-
    Gold standard label available in the data, diagnosed by a clinician, following the Bridge2AI
    protocols and ICD-10 codes.
  inter_annotator_agreement: >-
    Not assessed; a single labeler provides one label per instance.

machine_annotation_tools:
- tools:
  - OpenAI Whisper Large
  - openSMILE
  - Praat
  - Parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - ppgs
  - b2aiprep
  - senselab
  tool_descriptions:
  - Transcriptions were generated using OpenAI's Whisper Large model.
  - >-
    openSMILE was used to extract acoustic features, including eGeMAPS features per audio file,
    capturing temporal dynamics and acoustic characteristics.
  - >-
    Praat, accessed through the Parselmouth Python interface, provided phonetic and prosodic
    measures of fundamental frequency, formants and voice quality.
  - >-
    torchaudio produced pitch contours, spectrograms, Mel spectrograms and MFCCs.
  - >-
    The Speech Articulatory Coding package produced electromagnetic articulography estimates plus
    loudness, periodicity and pitch measures.
  - >-
    The ppgs package produced phonetic posteriorgrams over acoustic units of speech.
  - >-
    b2aiprep organized and preprocessed the dataset, and senselab processed audio files for
    research tasks.
  tool_accuracy:
  - >-
    Certain aspects of the data, for example transcription, were generated using off-the-shelf
    models that have not been audited for correctness.

raw_data_sources:
- source_description: >-
    Raw audio waveforms recorded during the acoustic tasks of the Bridge2AI-Voice protocol,
    including breathing sounds, voluntary cough, sustained vowels, and speech passages.
  source_type: Prospective primary collection from research participants
  raw_data_format: WAV audio files
  access_details: >-
    Retained by the project but not publicly accessible. Raw audio is disseminated only through
    controlled access, via Synapse (syn72370534), after institutional sign-off and review by the
    Data Access Compliance Office, which can be reached at DACO@b2ai-voice.org.
- source_description: >-
    Participant-reported demographic, confounder and validated questionnaire responses collected
    through the tablet application.
  source_type: Self-reported survey responses from research participants
  raw_data_format: REDCap export
  access_details: >-
    Released in de-identified form as the tab-separated phenotype tables with accompanying JSON data
    dictionaries; identifiable source records remain within the collecting institution's REDCap
    database.
- source_description: >-
    Clinical validation of diagnoses and symptoms, drawn from clinician assessment, laryngoscopy and
    stroboscopy, imaging, spirometry, the electronic health record and medication prescriptions.
  source_type: Clinician-generated clinical validation records
  raw_data_format: REDCap clinical validation and diagnosis forms
  access_details: >-
    Released as the de-identified diagnosis tables; the underlying imaging, genomic and other
    electronic health record content was extracted at each site and is not part of this release.

acquisition_methods:
- was_directly_observed: true
  acquisition_details: >-
    Acoustic data were directly observed and recorded during a supervised session using a custom
    application on a tablet, with a head-mounted headset microphone used where possible.
- was_reported_by_subjects: true
  acquisition_details: >-
    Demographic information, confounders such as smoking and hydration status, and validated
    questionnaire responses were reported by the participants themselves through the application.
- was_validated_verified: true
  acquisition_details: >-
    Clinical diagnoses were verified by clinicians reviewing audio and imaging data, consulting
    electronic health records, or checking medication prescriptions, against gold standards defined
    per disease cohort.
- was_inferred_derived: true
  acquisition_details: >-
    All features distributed in the release were derived computationally from the standardized audio
    rather than observed directly, using the b2aiprep pipeline.

collection_mechanisms:
- mechanism_details: >-
    A custom Bridge2AI-Voice application running on a tablet hosted the data acquisition protocols,
    presenting the acoustic tasks, demographic surveys, confounder questions and validated
    questionnaires and capturing the recordings.
- mechanism_details: >-
    Recording hardware consisted of iPads (9th or 10th generation) and iPad Air (5th generation)
    with an Avid AE-36 microphone connected through an Apple dongle. Distinct devices were used at
    each site.
- mechanism_details: >-
    Clinical, diagnostic and case report information was entered into a REDCap database, using the
    Bridge2AI-Voice REDCap instruments and data dictionary.

collection_timeframes:
- timeframe_details: The data was collected over a period of 12 months.
  source_caveats: >-
    The healthsheet gives the collection duration but no calendar start or end dates for the
    released cohort.

collection_notifications:
- notification_details: >-
    Participants were notified about the data collection through an IRB-approved consent process.
    They were informed of the data being collected, the methods used to secure it, and the ways in
    which the data would be shared, including that research data not containing direct identifiers
    would be shared with external researchers through a secure database.

collection_consents:
- consent_details: >-
    All participants were duly informed and agreed to the collection and use of their data through
    prospective informed consent. Consent was obtained in the clinic by trained research staff, or
    remotely, and could be recorded on paper, electronically within the application or through
    REDCap survey forms, or by video recording within the application, which was used to verify that
    the acoustic data submitted belonged to the consented individual.
- consent_details: >-
    Consent does not restrict use to non-commercial purposes, to a specific geographic location, to
    a specific type of research, to genetic research, or to research that does not involve the
    development of methods or algorithms.
- consent_details: >-
    Participants consenting to the study also permit investigators to access medical information
    through electronic health record platforms in order to perform gold standard validation of
    diagnoses and symptoms.

consent_revocations:
- revocation_details: >-
    Consenting participants are informed that they may withdraw from the study at any point. If a
    participant chooses to withdraw during or before the voice data collection, their data will not
    be included in the database. Participants are informed that research data, including voice
    recordings, cannot be removed from the database once the voice data collection process is
    completed.

data_collectors:
- role: researcher
  collector_details: >-
    Research teams, which may include medical, graduate or undergraduate students, coordinated with
    clinicians and doctors to identify appropriate participants and administered the protocol in
    clinic with the assistance of a trained research assistant.
- role: academic_institution
  collector_details: >-
    Clinicians and doctors who provided diagnoses were listed under the IRB as co-investigators and
    added to the consortium so that their names appear on consortium-level publications. Hospital
    staff were not involved in scheduling but assisted in the logistics of coordinating data
    collection. Data were collected at five North American academic sites.

direct_collection:
- is_direct: true
  collection_details: >-
    Data were collected directly from the individuals in question rather than obtained via third
    parties such as hospitals or app companies, with clinical validation drawn from the
    participants' own records with their consent.

sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies:
  - Non-probability sampling.
  - >-
    Purposive recruitment from high-volume expert clinics, defined as outpatient clinics within
    hospital systems or academic institutions with expertise in a specific disease area seeing more
    than 50 patients per month from that disease category.
  - >-
    Screening of clinic patients against cohort-specific inclusion and exclusion criteria before the
    visit, with eligible patients invited to participate.
  source_data: >-
    Patients presenting at specialty clinics and institutions across five North American sites, plus
    participants without the conditions of interest who serve as controls.
  why_not_representative: >-
    The data are not representative because they were collected at a limited number of geographic
    locations, and because the cohort is a sample of a larger, ongoing collection.
  representative_verification:
  - >-
    No verification of representativeness was performed; the creators state that they hope to
    improve representativeness by shifting to remote collection and controlling for more variables
    in recruitment.

relationships:
- relationship_details: >-
    The creators report that individual instances are unrelated to one another. Recordings and
    sessions are linked to participants through participant_id and session_id, and a subset of
    participants required multiple sessions to complete data collection, so more than one session
    and more than one phenotype row can belong to the same participant.

external_resources:
- external_resources:
  - >-
    b2aiprep, the open-source library used to organize and preprocess the dataset, to process raw
    audio into the released features and to merge the source data into the phenotype files, at
    https://github.com/sensein/b2aiprep
  archival: false
  restrictions:
  - Apache-2.0 license.
- external_resources:
  - >-
    senselab, the open-source library used to process audio files for research tasks, at
    https://github.com/sensein/senselab
  archival: false
- external_resources:
  - >-
    The Bridge2AI-Voice REDCap data dictionary, metadata and instrument PDFs at
    https://github.com/eipm/bridge2ai-redcap, archived at https://zenodo.org/doi/10.5281/zenodo.12760724
  archival: true
  restrictions:
  - MIT license.
- external_resources:
  - >-
    The project documentation site and dashboards at https://docs.b2ai-voice.org/, whose source code
    is at https://github.com/eipm/bridge2ai-docs and is archived at
    https://zenodo.org/doi/10.5281/zenodo.13834653
  archival: true
  restrictions:
  - MIT license.
- external_resources:
  - FHIR profiles for voice as a biomarker, published by the consortium as source code.
  archival: false
- external_resources:
  - >-
    The protocol development publication, Bensoussan, Yael, et al. "Developing Multi-Disorder Voice
    Protocols: A team science approach involving clinical expertise, bioethics, standards, and DEI."
