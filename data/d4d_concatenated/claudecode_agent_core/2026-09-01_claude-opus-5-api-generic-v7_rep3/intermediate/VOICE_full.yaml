  (version 3.1.0). PhysioNet. RRID:SCR_007345. https://doi.org/10.13026/8xbn-nq66
description: >-
  Bridge2AI-Voice is a large, ethically sourced and demographically diverse dataset of voice,
  speech and respiratory sounds linked to health information, produced by the Bridge2AI-Voice
  consortium under the NIH Common Fund Bridge2AI program and published on PhysioNet. Version
  3.1.0 contains data for 833 adult participants collected at five sites in North America
  (United States and Canada). Participants were recruited at high-volume expert clinics on the
  basis of conditions known to manifest in the voice waveform, grouped into four adult disease
  cohorts - voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders, and respiratory disorders - together with control participants who do not have the
  conditions of interest. Each participant completed a standardized protocol on a tablet
  application comprising acoustic tasks (breathing sounds, voluntary cough, prolonged vowel,
  maximum phonation time, glides, loudness, diadochokinesis, the Rainbow and Caterpillar
  passages, Cape-V sentences, free speech, picture description, story recall, animal fluency,
  word-color Stroop, productive vocabulary, random item generation and the Cinderella story),
  demographic and confounder surveys, and validated questionnaires selected per cohort (VHI-10,
  PHQ-9, GAD-7, PANAS, a custom affect scale, DSM-5 Adult, PTSD Adult, ADHD Adult, Dyspnea Index,
  the Leicester Cough Questionnaire, the Winograd questionnaire and the Montreal Cognitive
  Assessment). Diagnoses were validated by clinicians against cohort-specific gold standards
  such as laryngoscopy and stroboscopy images, spirometry and flow-volume loops, brain CT and
  MRI, and psychiatric assessment documented in the electronic health record or by active
  prescription.
  The public release contains data considered low risk: features derived from the audio rather
  than the original waveforms. Dense derived features are distributed as Parquet files
  (spectrograms, Mel spectrograms, MFCCs, torchaudio pitch, Speech Articulatory Coding estimates
  of electromagnetic articulography, loudness, periodicity and pitch, and phonetic
  posteriorgrams), alongside tab-separated static feature tables, audio quality metrics,
  per-recording metadata, and phenotype tables organized into confounders, demographics,
  diagnosis, enrollment, questionnaire and task folders, each accompanied by a JSON data
  dictionary. Raw audio is withheld from this release and is disseminated only under controlled
  access after review by the Data Access Compliance Office.
notes: >-
  The consortium published a self-assessment of the dataset against the Bridge2AI AI-readiness
  recommendations. FAIRness, provenance, pre-model explainability and ethics were rated as fully
  met; characterization scored 80 percent (data quality not met), computability 75 percent
  (contextualized not met) and sustainability 50 percent (domain-appropriate and associated not
  met).
source_caveats: >-
  Values describing the released data follow the PhysioNet v3.1.0 record, which supersedes the
  v3.0.0 record where the two differ. The project documentation site states that version 3.0
  contains approximately 61,937 voice-derived recordings from 833 adult participants; the
  PhysioNet releases give per-feature record counts rather than a single recording total, while
  the participant count of 833 is consistent across both. The documentation site describes the
  dataset as hosted by the Health Data Nexus at the University of Toronto, whereas the PhysioNet
  releases place hosting with the MIT Laboratory for Computational Physiology; the documentation
  statement appears to describe the earlier v1.0 release. Target enrollment for the project is
  given as 10,000 voices by the project documentation and as 30,000 participants by the IRB
  protocol, with the audiomics white paper citing 30,000; the documentation and the IRB protocol
  share the same source rank, so both figures are recorded here. Several contact email addresses
  in the project documentation were redacted in the supplied text, so the Data Access Compliance
  Office address is taken from the PhysioNet release notices.

purposes:
- response: >-
    To generate a large, multi-institutional, ethically sourced and diverse voice, speech and
    respiratory sound dataset linked to multimodal health biomarkers, so that voice can be
    integrated as a biomarker of health in clinical care.
- response: >-
    To enable the development, benchmarking and validation of clinically applicable
    machine-learning models that diagnose a wide range of health conditions from voice,
    including vocal pathologies and neurological, psychiatric, respiratory and pediatric voice
    disorders.
- response: >-
    To introduce and standardize the field of acoustic biomarkers, or audiomics, by creating new
    bioinformatics standards for acoustic and voice data collection, interoperability and
    analysis for voice AI research.

addressing_gaps:
- response: >-
    Previous studies of machine-learning-based voice diagnosis produced promising results, but
    their sample sizes were too small or they lacked the key metadata needed for training robust,
    clinically useful models.
- response: >-
    Comparing studies and pooling data has been difficult because of the absence of standards for
    how voice and other acoustic data are measured and collected.
- response: >-
    Industry holds vast quantities of voice data but the datasets are private and lack accurate
    clinical or demographic annotation, which prevents external auditing of training data and of
    algorithmic outputs against gold-standard medical assessment.
- response: >-
    Existing open-source voice datasets are limited in size, quality and diversity, which
    contributes to the absence of validated and regulator-approved AI algorithms for voice-based
    disease detection and monitoring.

tasks:
- response: >-
    Training and evaluating machine-learning models for disease detection and classification from
    voice, speech and respiratory sounds, with labels drawn from diagnostic categories including
    vocal pathologies, neurological disorders, psychiatric conditions and respiratory disorders.
- response: >-
    Pretraining, fine-tuning, benchmarking and validating AI models on the derived acoustic
    feature representations distributed with the dataset.
- response: >-
    Cohort selection and phenotypic analysis using the questionnaire, demographic, confounder and
    diagnosis tables distributed in the phenotype folder.

