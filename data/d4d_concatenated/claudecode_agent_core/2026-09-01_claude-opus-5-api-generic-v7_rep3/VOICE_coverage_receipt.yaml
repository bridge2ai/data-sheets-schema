  extracted:
  - slot: purposes[0]
    snippet: "aims to generate a large-scale, ethically sourced voice, speech, and cough database linked to health metadata in order to support AI-driven research"
  - slot: addressing_gaps[0]
    snippet: "Current literature on this topic has only been studied on small- to medium-sized data sets with limited data outside of acoustic measures not linked to multi-modal health data"
  - slot: addressing_gaps[1]
    snippet: "comparing studies and pooling data is challenging due to a lack of existing standards in how voice and other acoustics are measured and collected"
  - slot: future_use_impacts[1]
    snippet: "The integration of voice-based assessments into digital health tools has the potential to advance early disease detection, continuous disease monitoring, and personalized treatment strategies"
