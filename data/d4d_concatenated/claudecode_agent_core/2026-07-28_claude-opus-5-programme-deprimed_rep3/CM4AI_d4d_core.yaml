    perturbation and measurement data."'
machine_annotation_tools:
- id: https://cm4ai.org/data-releases/#annotation-llm
  name: llm_assisted_assembly_annotation
  description: Large language model assistance used in the cell-map annotation step of the MuSIC pipeline.
  tools:
  - GPT-4
  - Gene Set AI (GSAI) pipeline
  tool_descriptions:
  - '"Second, assemblies in the cell maps are annotated using a large language model (LLM) approach that
    we developed to name sets of proteins and assign a name confidence score."'
  - '"We also used our recently developed Gene Set AI (GSAI) pipeline to guide the GPT-4 model (v.gpt-4-1106-preview)
    to annotate assemblies ... This approach uses a well-engineered prompt that follows the chain-of-thought
    and one-shot strategies to query GPT-4 for a descriptive name, a confidence score and a detailed reasoning
    assay of the protein members from each assembly." Cell maps are also "aligned to known protein function
    and pathway resources, including the Gene Ontology (GO) and Reactome".'
  tool_accuracy:
  - 'Reported for the U2OS reference map published by the project team: "the LLM assigned names to known
    assemblies with very high confidence (median of 0.92 for both high overlap and substantial variation)
    and to the previously undocumented assemblies with moderately high confidence (median, 0.85), contrasting
    starkly with its confidence for sets of proteins drawn randomly without any correspondence to biological
    structure (median, 0.0)."'
  - 'Scope note: these figures come from the published U2OS multimodal cell map, a separate resource produced
    with the same toolkit, not from the quarterly CM4AI release series, and the releases published to
    date contain no computed cell maps.'
