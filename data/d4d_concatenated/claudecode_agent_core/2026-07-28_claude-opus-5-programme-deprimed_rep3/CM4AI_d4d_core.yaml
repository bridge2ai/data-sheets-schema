anomalies:
- id: https://cm4ai.org/data-releases/#anomaly-release-date-conflict
  name: june_2026_release_date_conflict
  description: Metadata inconsistency observed across the sources describing the current release.
  anomaly_details:
  - 'The CM4AI project release page presents "June 2026 Data Release (Beta), doi.org/10.18130/V3/HIGT4C
    ... Released on: June 17, 2025." The LibraData record for the same DOI gives Publication Date 2026-06-17,
    a 2026 citation year, and file publication dates of 2026-06-17 and 2026-07-15. The Dataverse metadata
    is treated as authoritative; the project page appears to carry an incorrect year.'
  - 'Release version labels differ between the dataset page and the recommended citation on every release
    examined: March 2025 displays "Version 1.4" and cites V1; June 2025 displays "Version 2.1" and cites
    V2; October 2025 displays "Version 2.1" and cites V2; June 2026 displays "Version 2.0" and cites V2.'
  - Every release records the same Data Creation Date and Deposit Date (2025-02-27), including the June
    2026 release, so these deposit-level dates do not distinguish the releases.
  - The end of the project is given as November 2026 in the release maintenance plan and as 2026-08-31
    in the NIH RePORTER project period.
  - The SEC-MS and perturb-seq archives shrink between the October 2025 and June 2026 releases despite
    the same file names (for example cm4ai_mass-spec_KOLF2.zip, 23.8 MB then 171.8 KB), with different
    checksums; the sources do not explain the change.
known_biases:
- id: https://cm4ai.org/data-releases/#bias-cell-line-representation
  name: cell_line_representation_bias
  bias_type: representation_bias
  bias_description: '"Data in this release was derived from commercially available de-identified human
    cell lines" and "Does not represent all biological variants which may be seen in the population at
    large." The two lines represent narrow donor origins: MDA-MB-468 was "established from a metastatic
    site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma" and
    KOLF2.1J "was derived from a healthy male Northern European donor."'
  mitigation_strategy: The release records disclose the limitation explicitly under "Potential Sources
    of Bias"; the programme spans multiple cell types and treatment conditions ("across demographic and
    disease contexts").
  affected_subsets:
  - All modalities in all releases
  description: Potential source of bias recorded on the CM4AI data releases.
- id: https://cm4ai.org/data-releases/#bias-target-selection
  name: targeted_panel_selection_bias
  bias_type: selection_bias
  bias_description: 'Measurement is concentrated on pre-selected protein and gene panels rather than being
    unbiased across the proteome: the programme interrogates "100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric, and cardiac disorders", spatial proteomics targeted
    100 chromatin regulators "with another 500 proteins pending significant hits from the genetic perturbations
    and PPI results", and AP-MS baits are limited ("We have endogenously tagged 17 genes in MDA-MB-468
    ... We are currently in the process of tagging 34 additional genes").'
  mitigation_strategy: 'Orthogonal proteome-wide methods are applied alongside the targeted panels: "SEC-MS
    allowed us to map complexes in MDA-MB-468 cells and investigate the impact of treatment proteome-wide",
    and the KOLF2.1J CRISPRi atlas is genome-scale over 11,739 targeted genes.'
  affected_subsets:
  - AP-MS interactomes
  - Spatial proteomics image sets
  description: Selection bias arising from the programme's targeted panel design.
known_limitations:
- id: https://cm4ai.org/data-releases/#limitation-interim
  name: interim_release_limitation
  limitation_type: scope_limitation
  limitation_description: '"This is an interim release" and "Does not contain predicted cell maps, which
    will be added in future releases." All releases published to date are labelled Beta.'
  scope_impact: The central deliverable of the programme - integrated hierarchical cell maps - is not
    present in any release published so far; only map-input data streams are distributed.
  recommended_mitigation: '"The current release is most suitable for bioinformatics analysis of the individual
    datasets." Updates are committed on a quarterly basis through the end of the project in November 2026.'
  description: Limitation recorded on the CM4AI data releases.
- id: https://cm4ai.org/data-releases/#limitation-coverage
  name: modality_coverage_limitation
  limitation_type: coverage_limitation
  limitation_description: '"Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap", and "Some datasets
    are under temporary pre-publication embargo."'
  scope_impact: Cross-modality integration for any given protein may be impossible where the modalities
    do not overlap, and embargoed components are not accessible at the time of release.
  recommended_mitigation: '"We are generating deep multi-modal data for a shared list of proteins across
    all cell types and treatment conditions to achieve an unparallelled level of biological insight."'
  description: Limitation recorded on the CM4AI data releases.
- id: https://cm4ai.org/data-releases/#limitation-expertise
  name: domain_expertise_limitation
  limitation_type: methodological_limitation
  limitation_description: '"Requires domain expertise for meaningful analysis."'
  scope_impact: The released data are instrument-level and pipeline-level outputs rather than analysis-ready
    summaries, and interpreting them requires proteomics, imaging and single-cell genomics expertise.
  recommended_mitigation: Documentation, tutorials and training are provided through the CM4AI portal,
    the Skills and Workforce Development module, and the RO-Crate datasheets and provenance graphs shipped
    with the releases.
  description: Limitation recorded on the CM4AI data releases.
- id: https://cm4ai.org/data-releases/#limitation-cell-lines
  name: cell_line_representativeness_limitation
