purposes:
- id: https://cm4ai.org/data-releases/#purpose-mission
  name: cm4ai_overarching_mission
  description: Overarching mission of the CM4AI data generation project.
  response: '"Its overarching mission is to produce ethical, AI-ready datasets of cell architecture, inferred
    from multimodal data collected for human cell lines, to enable transformative biomedical AI research."
    The NIH project record states that "the CM4AI data generation project seeks to map the spatiotemporal
    architecture of human cells and use these maps toward the grand challenge of interpretable genotype-phenotype
    learning."'
- id: https://cm4ai.org/data-releases/#purpose-visible-ml
  name: enable_visible_machine_learning
  description: Purpose of enabling interpretable, "visible" machine learning.
  response: '"In genomics and precision medicine, machine learning models are often ''black boxes,'' predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs. To
    address this deficiency, project will launch a coordinated effort involving three complementary mapping
    approaches - proteomic mass spectrometry, cellular imaging, and genetic perturbation via CRISPR/Cas9
    - creating a library of large-scale maps of cellular structure/function across demographic and disease
    contexts. These data will broadly stimulate research and development in ''visible'' machine learning
    systems informed by multi-scale cell and tissue architecture." Cell maps "have been used in AI tools
    for ''visible machine learning'' or ''visible neural networks'' (VNNs) to interrogate how protein
    assemblies in the cell affect cell-level phenotype predictions."'
- id: https://cm4ai.org/data-releases/#purpose-quarterly-release
  name: quarterly_release_of_map_input_streams
  description: Purpose of the quarterly release series itself.
  response: '"Cell Maps for Artificial Intelligence (CM4AI) will deliver machine-readable hierarchical
    maps of cell architecture as AI-ready data, together with quarterly data releases of map-input data
    streams." Data packages are published so that the community can reuse both the input streams and the
    software, metadata and provenance graphs used to produce them: "Its datasets and software are available
    to the research community under minimally restrictive terms consistent with ethical guidelines, researcher
    attribution, and research integrity."'
tasks:
- id: https://cm4ai.org/data-releases/#task-multimodal-mapping
  name: multimodal_cell_architecture_mapping
  description: The programme's core data-generation task.
  response: Deliver "machine-readable hierarchical maps of cell architecture as AI-Ready data produced
    from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
    neuropsychiatric, and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed
    conditions, utilizing state-of-the-art mass spectrometry based proteomics, spatial proteomics / cell
    imaging, and genetic perturbations using CRISPR."
- id: https://cm4ai.org/data-releases/#task-ai-readiness
  name: ai_readiness_packaging
  description: The AI-readiness and standards task.
  response: 'Package data, software, metadata and provenance graphs so they meet the project''s AI-readiness
    criteria: FAIR, Provenanced ("Provenance Graphs of computations, data, software, and models used to
    prepare the dataset must be available as metadata"), Characterized ("Complete schemas, validation
    procedures, and data sheets for all datasets in the provenance graph; and model cards for all models
    used to prepare the dataset, are resolvable from the dataset''s metadata"), Explainable, and Ethical.
    This is performed by the FAIRSCAPE framework, which creates RO-Crate packages, registers them, assigns
    ARK persistent identifiers, and computes end-to-end provenance entailments in the EVI Evidence Graph
    Ontology.'
- id: https://cm4ai.org/data-releases/#task-genotype-phenotype
  name: interpretable_genotype_phenotype_learning
  description: The downstream analytical task the data are intended to support.
  response: Support "the grand challenge of interpretable genotype-phenotype learning". "Cell maps provide
    a foundation for downstream applications in human genomics, including interpretation of genetic variants
    and mutations."
addressing_gaps:
- id: https://cm4ai.org/data-releases/#gap-black-box-models
  name: black_box_model_gap
  description: Gap in interpretability of genomic machine learning models.
  response: '"Machine learning (ML) models show great promise in analyzing the human genome to make predictions,
    but the inner workings of these models are typically difficult-to-interpret ''black boxes.'' To address
    this challenge, this Bridge2AI data generation project will generate a resource of matched data and
    tools to enable the creation of ''visible'' ML systems, which are not black boxes but are built directly
    on knowledge maps of cell and tissue architecture."'
- id: https://cm4ai.org/data-releases/#gap-uncharted-cell-architecture
  name: uncharted_subcellular_architecture_gap
  description: Gap in knowledge of subcellular organization.
  response: '"Human cells consist of a complex hierarchy of components, many of which remain unexplored."
    "One of the ultimate goals of the biological sciences is to understand this multiscale subcellular
    organization and its relationship to biological function and human disease. As much of cell structure
    still remains uncharted, there has been long-standing interest in strategies to map this architecture
    systematically." Individual modalities are individually insufficient: "maps constructed from only
    the imaging data tended to recover large assemblies but miss small ones, while maps constructed from
    only the AP-MS data recovered small assemblies but tended to miss large ones."'
- id: https://cm4ai.org/data-releases/#gap-ai-ready-data
  name: ai_ready_data_gap
  description: Gap in ethically prepared, AI-ready biomedical data.
  response: '"As defined by CM4AI, AI-Ready biomedical data are fully characterized FAIR data of known
    provenance, which can be ethically and reliably processed by AI applications; whose models and software
    are available and well-described for validation and re-use; and whose predictions may be fully explained
    and interpreted to the user as needed. CM4AI data are distinctive within Bridge2AI in that they are
    non-clinical (from tissue cultures) and are considered to be de-identified as they cannot be matched,
    with current knowledge, to a human subject."'
- id: https://cm4ai.org/data-releases/#gap-workforce
  name: biomedical_ai_workforce_gap
  description: Gap in the biomedical AI/ML workforce.
  response: '"To recruit and prepare a biomedical workforce that is adept at both the data and life sciences,
    new training that will allow researchers to leverage the data sets produced by Bridge2AI and other
    programs is needed." The Workforce Development Module "identified gaps in training of the functional
    genomic and biomedical AI/ML workforce" and organized a CodeFest in March 2024 attended by 38 registrants.'
