id: https://cm4ai.org/data-releases/
name: CM4AI_data_release_programme
title: Cell Maps for Artificial Intelligence (CM4AI) — Quarterly Data Release Programme
description: 'Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge2AI program. This datasheet describes the CM4AI
  data-release programme as an ongoing series rather than any single release: "Cell Maps for Artificial
  Intelligence (CM4AI) will deliver machine-readable hierarchical maps of cell architecture as AI-ready
  data, together with quarterly data releases of map-input data streams." Each quarterly release is published
  as a separately identified, separately versioned dataset in LibraData, the University of Virginia''s
  Dataverse instance, and is represented here as an entry under `resources`. The programme''s stated objective
  is "to deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced from
  multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric,
  and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed conditions, utilizing
  state-of-the-art mass spectrometry based proteomics, spatial proteomics / cell imaging, and genetic
  perturbations using CRISPR." The cell lines under investigation are the triple-negative breast cancer
  line MDA-MB-468 (untreated, paclitaxel-treated and vorinostat-treated) and the KOLF2.1J induced pluripotent
  stem cell line (undifferentiated and differentiated to neural progenitor cells, neurons and cardiomyocytes).
  Input data streams are generated by immunofluorescence (IF) subcellular microscopy for spatial proteomics;
  affinity purification mass spectrometry (AP-MS) and size-exclusion chromatography mass spectrometry
  (SEC-MS) for protein-protein interaction data; and single-cell CRISPR (perturb-seq) screens. Streams
  are integrated by the Multi-Scale Integrated Cell (MuSIC) software pipeline, and outputs are "packaged
  with provenance graphs and rich metadata as AI-Ready datasets in RO-Crate format using an extended,
  client-server version of the FAIRSCAPE framework." CM4AI is a collaboration of UCSD, UCSF, Stanford,
  UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University, and the Hastings Center, as part of the
  NIH Bridge2AI program. Aggregate figures published on the project portal for the programme as a whole
  are 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated,
  11,739 genes targeted, and 21.4 TB of data volume. Releases to date are labelled Beta. Release-level
  documentation states that the data "are not yet in completed final form", that some datasets are under
  temporary pre-publication embargo, and that computed cell maps are not included in the releases published
  so far.'
license: https://creativecommons.org/licenses/by-nc-sa/4.0/
page: https://cm4ai.org/data-releases/
publisher: https://dataverse.lib.virginia.edu/
language: en
conforms_to: RO-Crate research object packaging with FAIRSCAPE-generated JSON-LD metadata and EVI Evidence
  Graph Ontology provenance graphs; persistent identifiers issued under the ARK scheme.
status: Active, ongoing quarterly Beta release series. Release documentation states that the "Dataset
  will be regularly updated and augmented through the end of the project in November 2026" with "Updates
  on a quarterly basis". The current release is the June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C.
  Both the CM4AI project portal and the LibraData collection display the notice "This repository is under
  review for potential modification in compliance with Administration directives."
