version_access:
  id: https://cm4ai.org/data-releases/#version-access
  name: cm4ai_version_access
  latest_version_doi: doi:10.18130/V3/HIGT4C
  description: Versioning and access to earlier releases in the quarterly series.
  versions_available:
  - May 2024 Data Release (archived; no DOI recorded in the sources used here)
  - March 2025 Data Release (Beta) - doi:10.18130/V3/B35XWX - page version 1.4
  - June 2025 Data Release (Beta) - doi:10.18130/V3/F3TD5R - page version 2.1
  - October 2025 Data Release (Beta) - doi:10.18130/V3/K7TGEM - page version 2.1
  - June 2026 Data Release (Beta) - doi:10.18130/V3/HIGT4C - page version 2.0 (current)
  version_details:
  - Each quarterly release is a separate LibraData deposit with its own DOI and its own internal version
    history, rather than a new version of a single record. Earlier releases remain published and retrievable;
    the project release page groups them under "Archive".
  - Within a release, LibraData exposes a Versions tab and version differences; the June 2025 record notes
    'The "DRAFT" version was not found. This is version "2.1".'
  - Displayed page versions and recommended-citation versions disagree on every release examined (page
    1.4 vs cited V1; page 2.1 vs cited V2; page 2.1 vs cited V2; page 2.0 vs cited V2).
  - Version 2 of the June 2026 release was published 2026-07-15T20:28:19Z, consistent with the three immunofluorescence
    archives carrying a file publication date of 2026-07-15.
ethical_reviews:
- id: https://cm4ai.org/data-releases/#ethical-review
  name: cm4ai_ethical_review
  description: 'Ethical review contacts recorded on the CM4AI data releases from June 2025 onward, under
    the heading "Data Governance & Ethics". Contact person: Vardit Ravitsky (ORCID 0000-0002-7080-8801;
    ravitskyv@thehastingscenter.org), named with Jean-Christophe Bélisle-Pipon (ORCID 0000-0002-8965-8153;
    jean-christophe_belisle-pipon@sfu.ca, Simon Fraser University) as "Ethical Review" on the CM4AI releases;
    listed as University of Montreal in the release author metadata with a contact address at The Hastings
    Center. Reviewing organization: The Hastings Center, one of the institutions in the CM4AI collaboration.'
  contact_person: https://orcid.org/0000-0002-7080-8801
  reviewing_organization: https://cm4ai.org/data-releases/#org-hastings
  review_details:
  - '"Ethical Review: Vardit Ravitsky (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon
    (jean-christophe_belisle-pipon@sfu.ca)".'
  - '"The Ethics team worked closely with Data Acquisition, Tools, and Standards Modules to develop a
    plan for ethical preparation, licensing, dissemination, and Data Access supervision of CM4AI datasets.
    This plan balances the openness of the data produced, with protection of the intellectual property,
    and supervision and monitoring of potential efforts at commercialization."'
  - '"The Ethics team employs a methodology inspired by Value-Sensitive Design (VSD), facilitating the
    creation of normative standards and expectations aimed at ensuring the responsible design of datasets
    and AI technologies, in alignment with core values." The team is "instrumental in formulating the
    CM4AI Life Cycle, a framework designed to elucidate governance milestones throughout the data generation
    and AI system development processes."'
  - '"The Ethics Pillar also supported the work initiated by the Bridge2AI Ethics Working Group for supporting
    the Bridge2AI Data Sharing and Dissemination Working Group in developing a Code of Conduct. The Code
    of Conduct outlines basic requirements for participants in the Bridge2AI Open House to access B2AI
    data (including CM4AI datasets), to attest and commit to it prior to accessing the data."'
  - 'No institutional review board approval is recorded, consistent with the release metadata statement
    "Human Subjects: No".'
