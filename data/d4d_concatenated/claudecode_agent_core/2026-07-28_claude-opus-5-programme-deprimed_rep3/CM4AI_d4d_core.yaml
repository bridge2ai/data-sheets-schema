acquisition_methods:
- id: https://cm4ai.org/data-releases/#acquisition-multimodal
  name: multimodal_instrument_acquisition
  description: How the programme's data instances were acquired.
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details:
  - '"CM4AI input data streams are generated using immunofluorescence (IF) subcellular microscopy for
    spatial proteomics data; affinity purification mass spectroscopy (AP-MS) and size exclusion mass spectroscopy
    (SEC-MS) methods for protein-protein interaction (PPI) data; and single-cell CRISPR-Cas perturbation
    screens by cell type."'
  - '"To map protein-protein interactions (PPIs) of 100 chromatin regulators under different conditions
    (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes),
    we employed AP-MS on endogenously tagged cell lines and size-exclusion chromatography coupled to mass
    spectrometry (SEC-MS) for proteome-wide complex/interaction mapping as two orthogonal mass spectrometry-based
    approaches."'
  - '"We established automated fixation and permeabilization protocols for the pipetting robot for MDA-MB-468
    and KOLF2 cell lines, and completed spatial proteomics mapping of 100 chromatin regulators in the
    MDA-MB-468 cells (+/- paclitaxel or vorinostat), with another 500 proteins pending significant hits
    from the genetic perturbations and PPI results."'
  - '"We have designed a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per
    gene. We generated and characterized MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9.
    Single-cell CRISPR screens of 100 chromatin regulators (+/- drug) in MDA-MB-468 cells and in undifferentiated
    KOLF2.1J iPSCs were done using the 10x Genomics 3''HT kit."'
  - 'Validation of the released perturb-seq atlas is reported as follows: "We validated these findings
    via phenotypic, protein-interaction, and metabolic tracing assays."'
collection_mechanisms:
- id: https://cm4ai.org/data-releases/#mechanism-instruments
  name: instrument_and_assay_mechanisms
  description: Instruments, assays and platforms used to collect the data.
  mechanism_details:
  - 'Immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
    University, with four-channel imaging: DAPI for nuclei (blue), calreticulin antibody for endoplasmic
    reticulum (yellow), tubulin antibody for microtubules (red), and an antibody against the protein of
    interest (green).'
  - Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) in the Nevan Krogan laboratory
    at the University of California San Francisco, applied to MDA-MB-468 cells under three conditions
    (untreated, paclitaxel and vorinostat treated) and to KOLF2 iPSCs and derivatives.
  - 'Affinity purification mass spectrometry (AP-MS) on endogenously tagged cell lines: "We have endogenously
    tagged 17 genes in MDA-MB-468 and acquired AP-MS data under three conditions (untreated, paclitaxel
    and vorinostat treated). We are currently in the process of tagging 34 additional genes in MDA-MB-468
    cells."'
  - Single-cell CRISPRi perturbation screens using the 10x Genomics 3'HT kit with a lentiviral library
    of 6 guide RNAs per gene and inducible dCas9 lines.
- id: https://cm4ai.org/data-releases/#mechanism-cell-lines
  name: cell_line_sourcing
  description: Provenance of the biological material.
  mechanism_details:
  - '"CM4AI has elected to use the cancer cell line MDA-MB-468 (+/- treatment with paclitaxel and vorinostat)
    and the iPSC line KOLF2.1J (+/- neuronal and cardiomyocytic differentiation), both of which have been
    ethically sourced."'
  - MDA-MB-468 (RRID:CVCL_0419) is available from ATCC; KOLF2.1J (RRID:CVCL_B5P3) is available from the
    Human Induced Pluripotent Stem Cells Initiative (HipSci) resource and "is available for access by
    non-for-profit organizations via a simple MTA".
