preprocessing_strategies:
- id: https://cm4ai.org/data-releases/#preprocessing-music-pipeline
  name: music_integration_pipeline
  description: The Multi-Scale Integrated Cell (MuSIC) pipeline, which converts the multimodal input streams
    into integrated cell maps.
  preprocessing_details:
  - '"The Tools Module of CM4AI is responsible for producing and maintaining a dataset integration and
    map production system, the Multi-Scale Integrated Cell (MuSIC) pipeline, which produces integrated
    cell maps from the multiple, multi-modal input data streams. The MuSIC pipeline is divided into multiple
    segments, each of which calls the FAIRSCAPE client package to validate inputs and create the output
    RO-Crate package for that segment."'
  - 'Pipeline steps: (a) download PPI and image data from the Krogan and Lundberg laboratory deposition
    archives; (b) generate embeddings, with PPI networks processed using the node2vec deep learning model
    and IF images processed using a Human Protein Atlas deep learning model; (c) co-embedding of the PPI
    and image embeddings using contrastive deep learning; (d) protein community detection and hierarchy
    creation; (e) hierarchy evaluation against Gene Ontology and Reactome and annotation using a large
    language model.'
  - '"Cell maps are hierarchical directed acyclic graphs (DAG), where each node represents an assembly
    of proteins in proximity at a given scale, spanning from large assemblies representing cell compartments
    (e.g. nucleus, mitochondria) to small assemblies of proteins in close proximity (e.g. protein complexes
    or subunits)."'
  - Computed cell maps are not included in the releases published to date; the release records state "Computed
    cell maps not included in this release" and "Does not contain predicted cell maps, which will be added
    in future releases."
  used_software:
  - id: https://github.com/idekerlab/cellmaps_pipeline
    name: Cell Mapping Toolkit (cellmaps_pipeline)
    url: https://github.com/idekerlab/cellmaps_pipeline
    license: BSD-3
    description: '"The Cell Mapping Toolkit implements a series of Python packages to execute the end-to-end
      pipeline. Specific packages include steps for processing the protein imaging and biophysical interaction
      datasets (cellmaps_imagedownloader, cellmaps_ppidownloader), embedding the input modalities (cellmaps_image_embedding,
      cellmaps_ppi_embedding), integrating the modalities (cellmaps_coembedding), constructing the hierarchical
      cell map (cellmaps_generate_hierarchy) and annotating the cell map with known resources such as
      GO (cellmaps_hierarchyeval). Each package is pip-installable and is linked to complete user documentation
      hosted at ReadTheDocs (https://cellmaps-pipeline.readthedocs.io/)." "Software comprising the Tools
      data integration pipeline is available under BSD-3 open source license in GitHub (for alpha level
      tools) or in the Zenodo long-term archive (for production-ready tools)."'
- id: https://cm4ai.org/data-releases/#preprocessing-fairscape
  name: fairscape_ai_readiness_packaging
  description: FAIRSCAPE packaging of datasets, software, metadata and provenance graphs.
  preprocessing_details:
  - '"The Standards Module of CM4AI is responsible for AI-Readiness packaging of data, software, metadata
    and provenance graphs. This task is performed by the FAIRSCAPE framework."'
  - '"The client-side package, FAIRSCAPE-CLI, is called when any computation or coherent set of computations
    in the pipeline is completed, and it is passed metadata which defines schemas in JSON-Schema for the
    datasets in the computational unit, as well as the inputs, computations, software, models, and outputs.
    FAIRSCAPE-CLI creates an RO-Crate package with the datasets, metadata, and software - or resolvable
    references to these components - and unique stubs for identifier creation on each of these components."'
  - '"The RO-Crates are then sent to the FAIRSCAPE server where they are registered and assigned persistent,
    resolvable, globally unique persistent identifiers (PIDs). The RO-Crates are then decomposed into
    their individual components - datasets, models, software - which are also registered and assigned
    PIDs. The PID system currently in use is the ARK scheme - with DOIs a future feature as supplementary
    PIDs for final-state publishable work."'
  - '"Lastly, the server computes end-to-end entailments on each RO-Crate''s provenance as expressed in
    the EVI Evidence Graph Ontology and links them together where possible." "PIDs generated by the server
    resolve to machine- and human-readable landing pages containing the metadata, expressed in the JSON-LD
    graph language using vocabularies from Schema.org, EVI, and other well-defined public ontologies."'
  - '"At present they comprise: (a) establishing FAIRness including rich metadata and persistent, globally
    unique identifiers; (b) computing a machine-readable provenance graph, resolvable as metadata for
    all results, including inputs, computations, software, and outputs; and (c) characterizing and validating
    all datasets and data elements, and mapping data elements to public ontology vocabularies, where appropriate,
    using JSON-Schema mini-data-dictionary descriptions resolvable from the provenance graph metadata."'
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    url: https://fairscape.github.io
    license: MIT
    description: '"The FAIRSCAPE AI-readiness framework is described with a tutorial and instructions
      for installation at https://fairscape.github.io. Copyright (c) 2024 to this software is held by
      the Rector and Board of Visitors of the University of Virginia. It is available under open source
      MIT License." "Both the client-side and sever-side FAIRSCAPE packages are PIP-installable and are
      freely available, under the MIT open-source license."'
cleaning_strategies:
- id: https://cm4ai.org/data-releases/#cleaning-qc
  name: quality_control_and_revision
  description: Quality control and post-release correction practices.
  cleaning_details:
  - 'Single-cell CRISPR screen data underwent quality control before release: "The resulting data are
    currently being QCed."'
  - 'The June 2025 release was revised after publication: "This revision includes adding RGB immunofluorescent
    images, corrections to ro-crate metadata, and changes to naming conventions."'
  - 'Metadata are validated as part of AI-readiness packaging: "The Standards Module established FAIR
