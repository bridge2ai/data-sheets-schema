    to 975 proteins ... It decodes paediatric cancer genomes, identifying 21 recurrently mutated assemblies
    and implicating 102 validated new cancer proteins."'
  - Acknowledged funding for that work includes "the Bridge2AI Program (NIH Common Fund; OT2 OD032742)".
