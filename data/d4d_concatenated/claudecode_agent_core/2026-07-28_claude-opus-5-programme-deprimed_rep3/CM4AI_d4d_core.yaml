sampling_strategies:
- id: https://cm4ai.org/data-releases/#sampling-targeted-panels
  name: targeted_protein_and_gene_panels
  description: How proteins, genes and cell states were selected for measurement.
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Human chromatin modifiers and metabolic enzymes implicated in cancer, neuropsychiatric and cardiac
    disorders
  - Two disease-relevant human cell lines, MDA-MB-468 and KOLF2.1J, under perturbed and unperturbed conditions
  strategies:
  - '"multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
    neuropsychiatric, and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed
    conditions"'
  - Spatial proteomics targeted 100 chromatin regulators "with another 500 proteins pending significant
    hits from the genetic perturbations and PPI results".
  - The KOLF2.1J CRISPRi perturbation atlas is genome-scale over expressed genes, "mapping transcriptional
    and fitness phenotypes associated with 11,739 targeted genes".
  why_not_representative:
