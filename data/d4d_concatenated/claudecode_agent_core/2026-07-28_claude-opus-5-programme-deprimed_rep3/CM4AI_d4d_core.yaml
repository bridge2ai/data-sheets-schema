  name: cm4ai_sensitive_elements
  sensitive_elements_present: false
  sensitivity_details:
  - 'No human-subject data are collected. Release metadata records "Human Subjects: No" and "De-identified
    Samples: Yes".'
  - 'The donor characteristics of the source cell lines are published in the scientific literature and
    reproduced in the project documentation (MDA-MB-468: 51-year-old black female with metastatic mammary
