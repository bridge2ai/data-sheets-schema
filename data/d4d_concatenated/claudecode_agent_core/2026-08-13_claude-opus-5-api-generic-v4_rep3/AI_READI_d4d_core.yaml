acquisition_methods:
  - was_directly_observed: true
    was_validated_verified: true
    acquisition_details: >-
      Directly observable data were acquired at the study visit or from returned devices:
      laboratory tests on blood and urine, vitals and physical measurements, 12-lead ECG,
      monofilament testing, cognitive screening, visual function testing, autorefraction,
      retinal imaging, continuous glucose monitoring, wearable activity monitoring and home
      environmental sensing. Verification of data entry was performed where possible, for
      example by cross-referencing entered medications against medications physically brought in
      or photographed by the participant.
    notes: >-
      Data were collected directly from participants at the three recruiting sites; this was
      active data collection rather than passive collection or secondary use of existing data.
      Recruitment pools were identified indirectly by screening electronic health records, and
      past health record and traffic and accident report variables in the controlled-access
      release originate from records rather than from the participant directly.
  - was_reported_by_subjects: true
    acquisition_details: >-
      Self-reported data were collected through REDCap questionnaires completed before, during
      or after the visit: screening and eligibility, demographic information, CES-D-10
      depression screen, PAID-5, diabetes self-care score, dietary assessment, ophthalmic
      survey, smoking, alcohol, vaping and marijuana use history, general health history, social
      determinants of health surveys drawn from the PhenX Toolkit, and current medications.
      Race, ethnicity and biological sex used for cohort balancing are self-reported.
  - was_inferred_derived: true
    acquisition_details: >-
      Derived data include values calculated from directly measured quantities (waist-hip ratio
      and body mass index from height, weight and circumferences; calculated LDL cholesterol;
      calculated globulin and A/G ratio; blood urea nitrogen to creatinine ratio) and all data
      mapped from source formats into standardised terminologies and models, notably the OMOP
      Common Data Model for clinical data and DICOM for retinal imaging.

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used to collect participant-reported questionnaire data and the following
      clinical data from the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results and complete blood count results. REDCap also
      hosted the online recruitment interface, the e-consent documents and the screening survey.
  - mechanism_details: >-
      Retinal imaging devices: Optomed Aurora IQ handheld non-mydriatic fundus camera (Oulu,
      Finland), 4 images per participant; iCare EIDON widefield TrueColor confocal fundus system
      (Raleigh, North Carolina), 12 images; Heidelberg Spectralis HRA OCT and OCTA (Heidelberg,
      Germany), 6 images; Topcon Maestro2 3D OCT-1 (Tokyo, Japan), 6 images; Topcon Triton DRI
      OCT, 6 images; Carl Zeiss Meditec Cirrus 5000 (Jena, Germany), 8 images; and Heidelberg
      Fluorescence Lifetime Imaging Ophthalmoscopy, 2 images. Both eyes are imaged for each
      participant. Devices were chosen for their different but partially overlapping modalities,
      and scan types for widespread coverage of the retina with the goal of detecting pixel-level
      differences in pathology.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Amsterdam, The Netherlands) for the 12-lead ECG, with
      the participant reclining or supine and the chair position recorded.
  - mechanism_details: >-
      At-home monitoring devices issued at the end of the in-person visit and used continuously
      for ten days: a Dexcom G6 continuous glucose monitor (San Diego, California), a Garmin
      Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland) worn on the
      non-dominant wrist, and a custom-designed LeeLab Anura home environmental sensor built at
      the Karalis Johnson Retina Center, University of Washington. Devices were returned by
      overnight mail with prepaid materials or in person.
  - mechanism_details: >-
      Clinical laboratory testing: CLIA-certified laboratories local to each data collection site
      perform complete blood count testing on fresh whole blood; all other laboratory tests are
      performed by the University of Washington Nutrition and Obesity Research Center testing
      facility using stored frozen samples that are batch-shipped on dry ice approximately once
      per quarter after local storage at -70 degrees Celsius.
  - mechanism_details: >-
      Instrumented clinical measurement devices: automatic oscillometric blood pressure monitors
      (OMRON HEM 907XL, Medline MDS4001, Welch Allyn 6000 series), M&S Technologies Electronic
      Visual Acuity tester, Mars Perceptrix letter contrast sensitivity charts, Topcon KR 800
      autorefractor, lensometers (NIDEK LM-600P, Topcon CL-200, Topcon CL-300), a 10 g
      monofilament applied at three locations on each foot, and the MoCA Duo iPad application.
  - mechanism_details: >-
      Electronic health records at the three sites were screened to build recruitment pools,
      using ICD-10 diagnosis codes R73.09 and E11.X together with demographic data, and to
      extract past health record variables held under controlled access.
  - mechanism_details: >-
      FAIRhub, a Microsoft Azure cloud-based data management, curation and sharing platform
      developed for the project, receives uploads from each data collection site at regular
      intervals and serves the released dataset.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      The collection window for the data contained in version 3.0.0 of the dataset, comprising
      2,280 participants. Version 1.0.0 covered the pilot data collection phase and version
      2.0.0 the first full year of the study.
    source_caveats: >-
      The BMJ Open protocol states that enrolment began on 18 July 2023, one day earlier than
      the 2023-07-19 start date recorded in the FAIRhub metadata, the README and the healthsheet.
  - start_date: '2023-07-18'
    end_date: '2026-11-30'
    timeframe_details: >-
      The overall study enrolment period. Preliminary pilot enrolment occurred between 18 July
      2023 and 30 November 2023 to build coordinator familiarity, and formal data collection
      began on 1 December 2023. Enrolment is planned to continue until 30 November 2026. The
      four-year project timeline allocates year 1 to protocol development and training and years
      2 to 4 to recruitment and data collection, with a follow-up examination for a subgroup in
      year 4; the anticipated study completion date recorded in the study metadata is 2027-01-01.

data_collectors:
  - role: Clinical research coordinator
    collector_details: >-
      Coordinators at the three data collection sites recruited, consented and enrolled
      participants, administered the protocol elements, issued and retrieved the at-home
      monitoring devices, and entered data into REDCap. All research personnel who recruited,
      enrolled and collected data underwent training by the data manager at the University of
      Alabama at Birmingham and worked from a detailed Manual of Procedures. A certification
      process is required for all coordinators, including mandatory institutional compliance
      training for human subject research and successful administration of all protocol elements
      to at least three volunteer practice subjects.
  - role: Site data manager
    collector_details: >-
      Data managers at each site oversee the data collection process and are responsible for
      quality control of all data before uploading to FAIRhub, including reviewing REDCap range
      and credibility flags with coordinators.
  - role: Retinal imaging technician
    collector_details: >-
      Imaging technicians operate the seven retinal imaging devices and are trained to detect
      conditions that are potentially life or vision threatening, specifically retinal
      detachment, tumour and optic disc oedema.
  - role: Laboratory and biorepository staff
    collector_details: >-
      Phlebotomists and laboratory assistants collect and process blood and urine, local
      CLIA-certified laboratories perform complete blood counts, the University of Washington
      Nutrition and Obesity Research Center performs the remaining assays, and the University of
      Alabama at Birmingham Center for Clinical and Translational Science operates the central
      biorepository.
  - role: Central project team
    collector_details: >-
      The central project team receives data from the sites and performs the additional
      processing required for dissemination, including mapping to standardised terminologies and
      packaging for release on FAIRhub.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. The study base is all patients aged 40 years or older with a
      medical encounter at one of the three health systems between 2020 and 2025. Patients with
      T2DM and pre-diabetes are identified by screening electronic health records for ICD-10
      diagnosis codes R73.09 and E11.X; patients without diabetes have no encounters with these
      codes. Participants are recruited in waves, with the composition and size of each wave
      influenced by observed participation characteristics of race/ethnicity, gender, T2DM
      severity and site; composition is monitored as recruitment progresses and adjusted by
      under- and oversampling groups as needed. Contact pools are mailed a personalised hardcopy
      invitation letter and sent an invitation email directing them into a REDCap recruitment
      interface. All study groups are recruited at every site, but the proportion of each group
      varies with the demographic prevalence of that group in the site's geographical area.
    why_not_representative: >-
      Rather than targeting the demographic distribution of the US population, the study
      deliberately recruits four race/ethnic groups, four categories of T2DM severity and both
      biological sexes in approximately equal proportions, because balanced datasets are held to
      be critical for the development of unbiased machine learning models. Participants are
      volunteers, so selection bias known as volunteer bias may limit the generalisability of
      results to those not represented in the study population.
    representative_verification:
      - >-
        No formal verification of representativeness against a larger population was performed.
        The healthsheet states that the dataset contains all possible instances, meaning all
        participants enrolled within the collection window, and answers "N/A" to the question
        about sampling strategy from a larger set.
    notes: >-
      Eligibility criteria are: able to provide consent; aged 40 years or older; with or without
      type 2 diabetes; able to speak and read English. Exclusions are: pregnancy; gestational
      diabetes; type 1 diabetes. The study eligibility metadata additionally records a maximum
      age of 85 years.

raw_data_sources:
  - source_description: >-
      REDCap electronic data capture system holding participant-reported survey responses and
      coordinator-entered clinical measurements from the study visit.
    source_type: Study data capture system
    raw_data_format: REDCap exports
    access_details: Not released; the released clinical data are the OMOP CDM mapping of these records.
  - source_description: >-
      Philips PageWriter TC30 Cardiograph 12-lead electrocardiograph output exported at each site.
    source_type: Clinical device export
    raw_data_format: .xml
  - source_description: >-
      Montreal Cognitive Assessment results from the MoCA Duo iPad application, comprising total
      score, section subscores, Memory Index Score and task completion times.
    source_type: Tablet application export
    raw_data_format: .csv
  - source_description: >-
      Retinal imaging device exports from the Optomed Aurora, iCare Eidon, Heidelberg Spectralis,
      Heidelberg FLIO, Topcon Maestro2, Topcon Triton and Zeiss Cirrus 5000.
    source_type: Imaging device export
    raw_data_format: >-
      Native DICOM for the Optomed Aurora, iCare Eidon, Heidelberg Spectralis and Zeiss Cirrus;
      .fda for the Topcon Maestro2 and Triton; .sdt for the Heidelberg FLIO. Non-DICOM formats
      were converted to DICOM for the dataset.
  - source_description: Dexcom G6 continuous glucose monitor transmitter downloads.
    source_type: Wearable device export
    raw_data_format: .csv
  - source_description: Garmin Vivosmart 5 activity tracker downloads.
    source_type: Wearable device export
    raw_data_format: .FIT, converted to the Open mHealth standard for the dataset
  - source_description: LeeLab Anura custom home environmental sensor downloads.
    source_type: Custom sensor export
    raw_data_format: .csv
  - source_description: >-
      Blood and urine laboratory results from CLIA-certified laboratories local to each site
      (complete blood count) and from the University of Washington Nutrition and Obesity
      Research Center (all other assays).
    source_type: Clinical laboratory report
    raw_data_format: .csv
  - source_description: >-
      Electronic health records at the University of Alabama at Birmingham, the University of
      California San Diego and the University of Washington, used for recruitment screening and
      for the past health record variables held under controlled access.
    source_type: Electronic health record system
    access_details: Not released in the public dataset.

raw_sources:
  - raw_data_details: >-
      The raw data are saved and expected to be preserved by the AI-READI project at least for
      the duration of the project, but are not currently shared outside the project team,
      because they have not been mapped to standardised terminologies and because raw data may
      accidentally include personal health information or personally identifiable information,
      for example in free text fields. There is a possibility that raw data may be included in
      future releases of the controlled-access dataset.

preprocessing_strategies:
  - preprocessing_details: >-
      All data are mapped to applicable data standard formats: the Observational Medical
      Outcomes Partnership Common Data Model for clinical data and the DICOM format for retinal
      imaging. Each CSV file in the clinical_data directory is a one-to-one mapping to an OMOP
      CDM table.
  - preprocessing_details: >-
      Proprietary imaging exports are transformed into standard model formats prior to upload to
      FAIRhub: Topcon Maestro2 and Triton .fda files and Heidelberg FLIO .sdt files are converted
      to DICOM.
  - preprocessing_details: >-
      Garmin Vivosmart 5 .FIT exports are converted to the Open mHealth standard; Dexcom G6
      exports are published in Open mHealth; ECG data are published in the WaveForm DataBase
      (WFDB) format; environmental sensor data are published following the NASA ASCII File
      Format Guidelines for Earth Science Data.
  - preprocessing_details: >-
      The whole release is organised according to the Clinical Dataset Structure (CDS) v0.1.1
      specification, with one directory per datatype at the root, one folder per modality within
      each datatype, one folder per device within each modality, and one folder per participant
      within each device folder, named by the participant's study ID. Root-level metadata files
      and per-datatype manifest.tsv files are generated to the same specification.
  - preprocessing_details: >-
      Removal of protected health information from the public release, together with removal of
      information related to the sex and race/ethnicity of participants and medications used, in
      order to prevent stigmatisation of findings. The public set is stripped of PHI as defined
      by the HIPAA Privacy Rule via the Safe Harbor method.
  - preprocessing_details: >-
      Data watermarking is applied for both the public and controlled sets as part of a data
      dissemination system intended to deter re-identification attempts; the licence notes that
      data may be statically watermarked to identify the licensee.
  - preprocessing_details: >-
      Processing was described as custom or ad hoc for the v1.0.0 pilot data and as automated
      plus custom for the year 2 and year 3 data included in versions 2.0.0 and 3.0.0.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the time of data entry and acquisition: clinical data outside expected
      minimum and maximum ranges were flagged in REDCap and surfaced in reports viewed by
      clinical research coordinators and data managers. Using these reports as guides, data
      managers and coordinators examined participant records and determined whether an error was
      likely. Data were checked for credibility using range checks, for incorrect flow through
      prescribed skip patterns, for missing data that could be directly filled from other
      portions of an individual's record, and for the omission or duplication of records.
      Editing was done only under the guidance and approval of the site principal investigator;
      where corrected data were available elsewhere in the respondent's answers the error was
      corrected, and where there was no logical or appropriate way to correct the data the site
      principal investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      The data manager at each site is responsible for the quality control of all data before
      uploading to FAIRhub. Additional processing steps were conducted by the central project
      team after receipt from the sites in preparation for dissemination.
  - cleaning_details: >-
      No instances were excluded from the dataset at the time of preprocessing; exclusion
      operated only through the study eligibility criteria at recruitment.
  - cleaning_details: >-
      The clinical data are shipped with a dqd_omop.json file supporting analysis with the OMOP
      CDM Data Quality Dashboard, which runs a set of more than 3,500 data quality checks
      against an OMOP CDM instance.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; missingness is at the level of an
      entire modality for a participant rather than scattered within a modality. Wearable
      activity monitor records contain gaps because the Garmin battery had to be charged every
      two to three days.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In a few cases the
      data collection device had no stored results or was returned too late to retrieve the
      results, for example because the battery died or data were lost. In a few cases a data
      collision occurred at some point in the process and data were lost. Skipped questions or
      incomplete responses are expected in survey data. Imaging modalities may be skipped
      because of quality problems, particularly for operator-dependent devices such as the
      Heidelberg Spectralis.
    handling_strategy: >-
      Missing data that could be directly filled from other portions of an individual's record
      were filled during cleaning under site principal investigator approval; otherwise
      missingness is retained rather than imputed. No imputation protocol is described for the
      released data.

anomalies:
  - anomaly_details: >-
      In survey data, skipped questions and incomplete responses are expected.
  - anomaly_details: >-
      In wearable data, improper use and technical failure such as battery failure or system
      malfunction are expected.
  - anomaly_details: >-
      In imaging data, patient uncooperation, noise that may obscure the images, technical
      failure such as system malfunction, and data transfer failures are expected.
  - anomaly_details: >-
      Optomed Aurora fundus images are acquired undilated with a handheld camera in a dark room,
      which makes a good view challenging; image quality therefore varies from participant to
      participant and within the same participant.
  - anomaly_details: >-
      FLIO is highly sensitive to movement: the device cannot handle more than one centimetre of
      movement during image acquisition. Because the FLIO scan takes longer than a standard
      Spectralis OCT and exposes participants to uncomfortable levels of light, it is performed
      last in the visit, when participant compliance may be lower. Unwanted signals such as
      background light or lens fluorescence cannot simply be subtracted because they are part of
      the same photon distribution as the useful data.
  - anomaly_details: >-
      Devices with substantial operator involvement, notably the Heidelberg Spectralis, can
      produce operator-induced quality issues that may lead to a modality being skipped and data
      being missing, whereas largely automated devices such as the Topcon Triton and Maestro2 and
      the iCare Eidon minimise operator-induced error.
  - anomaly_details: >-
      A data collision at some point in the processing pipeline caused loss of data for a small
      number of participants.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so there is selection bias known as volunteer bias, which may
      limit the generalisability of results among those who are not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of the composition of enrolled participants, and
      under- and oversampling of groups as needed to move towards the intended balance.
  - bias_type: sampling_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based, drawn from patients with a recent
      encounter in one of three academic health systems, which may not fully capture all
      possible cultural and socioeconomic backgrounds. Sampling is non-probability sampling.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic variability across the
      United States and to ensure representation across various racial and ethnic groups, and
      individuals from all demographic backgrounds were recruited at all three sites. Uniform
      data collection protocols were implemented for all subjects irrespective of race/ethnicity,
      biological sex or diabetes severity, across all study sites.
  - bias_type: representation_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across
      race/ethnicity, biological sex, and diabetes presence and severity, the pilot and interim
      releases are not balanced across these parameters, and enrolment is ongoing so periodic
      data releases may not have achieved balanced distribution across groups. The cohort does
      not include other races and ethnicities such as Pacific Islanders and Native Americans.
    affected_subsets:
      - >-
        Race/ethnicity, biological sex and diabetes severity strata in the training partition of
        the recommended split, which is markedly less balanced than the validation and test
        partitions.
    mitigation_strategy: >-
      The recommended validation and test splits are balanced as well as possible for sex,
      race/ethnicity and diabetes status, so that model evaluation is not dominated by the
      imbalance in the training data.
  - bias_type: selection_bias
    bias_description: >-
      Recruiting Black men into health research is well documented to be more difficult than
      recruiting other populations, driven by factors such as medical mistrust and fear of safety
      stemming from historical events including the Tuskegee syphilis study, yet this population
      bears a disproportionate share of the T2DM burden. Similar trends of under-recruitment and
      disease burden have been reported for Hispanic and Asian persons.
    mitigation_strategy: >-
      Tailoring printed materials and using a personalised, participatory approach to
      recruitment; a Community Advisory Board of eleven persons from the three sites, including
      diversity in race and ethnicity as represented in the sample, contributes to protocol
      development; new recruitment strategies will be implemented if sample balancing on
      race/ethnicity emerges as a challenge.
  - bias_type: selection_bias
    bias_description: >-
      Requiring that eligible participants speak, read and understand English may have created
      challenges in recruiting Hispanic and Asian persons and excludes non-English speakers
      entirely.
    mitigation_strategy: >-
      The IRB protocol records an intention to translate the consent form and study materials
      into Spanish, contingent on supplementary funding, if recruitment goals for Hispanic
      participants are not met.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races and ethnicities such as Pacific Islanders and Native
      Americans, and the interim releases have not yet achieved the intended balance across
      race/ethnicity, biological sex and diabetes severity.
    scope_impact: >-
      Models derived from the dataset may generalise poorly to groups absent from or
      under-represented in the cohort.
    recommended_mitigation: >-
      Use the recommended validation and test splits, which are balanced as far as possible for
      sex, race/ethnicity and diabetes status.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Recruitment is predominantly urban and hospital-based across three academic medical
      centres in Birmingham, San Diego and Seattle, and does not cover rural populations or
      people without a recent encounter in these health systems.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility is restricted to adults aged 40 and older (with an upper bound of 85 recorded
      in the study eligibility metadata) who can provide consent and can speak and read English.
      Pregnancy, gestational diabetes and type 1 diabetes are exclusionary. The public release
      further omits sex, race, ethnicity, medications, 5-digit ZIP code, genomic sequencing data,
      past health records and traffic and accident reports.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The released data are cross-sectional with a single study visit per participant plus a
      ten-day at-home monitoring window; longitudinal follow-up of approximately 4% to 10% of the
      cohort is planned for year 4 of the project but is not part of this release.
    scope_impact: >-
      Disease trajectories must be inferred across participants of differing severity rather
      than observed within individuals, which is the reason the protocol was designed for
      pseudotime manifold analysis.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets or gold-standard annotations are provided, and no formal guidelines
      exist for researchers creating new labels or defining new tasks on this dataset.
  - limitation_type: integration_limitation
    limitation_description: >-
      Multiple devices were deliberately used for the same measure, for example four OCT
      platforms, which improves coverage of equipment used in clinical settings but means that
      records for a given modality are not device-homogeneous and may require device-aware
      harmonisation.

content_warnings:
  - content_warnings_present: false
    warnings:
      - >-
        The healthsheet states that the dataset contains no data that, if viewed directly, might
        be offensive, insulting, threatening, or otherwise pose a safety risk such as
        psychological safety or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states the dataset does not contain data that might be considered
      confidential and that no personally identifiable information is included. The licence
      nevertheless treats all released Data, and any Derivative Data or Synthetic Data generated
      from it, as subject to storage, sharing and usage restrictions.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public release does not contain data considered sensitive. It contains no protected
      health information, and information related to the sex and race/ethnicity of participants
      and medications used has been removed.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled-access release contains data regarding racial and ethnic origins, biological
      sex, location at the level of 5-digit ZIP code, genetic sequencing data, past health
      records, medications, and motor vehicle traffic and accident reports.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor. The public set is stripped of Protected Health Information as defined by
    the HIPAA Privacy Rule via the Safe Harbor method, and additionally of information related to
    participant sex and race/ethnicity and of medications used.
  identifiers_removed: >-
    All direct HIPAA identifiers; additionally sex, race/ethnicity, medications, 5-digit ZIP
    code, past health records and traffic and accident reports are withheld from the public
    release and held under controlled access.
  deidentification_details: >-
    The dataset description records deIdentType as NoDeIdentification with deIdentHIPAA true, and
    explains that no identifiers were collected so no active de-identification was necessary, but
    that the team checked that no identifiable data per US HIPAA were present in the data. Data
    were also reviewed internally by AI-READI team members for quality checks and to ensure that
    no personally identifiable information was accidentally included. Direct identifiers are
    marked as removed and dates are not shifted. To deter re-identification attempts the project
    implements a data dissemination system requiring verified-ID login, a strict licence
    agreement, and data watermarking for both public and controlled sets. A theoretical risk of
    future re-identification is acknowledged, because AI algorithms can infer individual patient
    characteristics and could facilitate individual-level identification; modalities are linked
    within a participant by the participant identifier, and the controlled-access release adds
    variables that increase linkage potential.
  source_caveats: >-
    The healthsheet leaves the two questions about de-identification measures and preprocessing
    for de-identification unanswered, so the details above are drawn from the dataset description
    metadata, the Nature Metabolism comment and the RO-Crate rather than from the healthsheet
    itself.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either as an electronic signature in REDCap before the
      visit or on paper in person at the start of the visit. Consent is required before
      participation in any part of the protocol, including the questionnaires.
    consent_documentation: >-
      The approved University of Washington consent form is distributed with the dataset
      documentation as AI-READI Consent_Form_Standard_Mod17May2023; the other clinical sites
      operated under IRB reliance and used the same form with minor institution-specific
      language. Signed electronic consents are automatically emailed to participants, who may
      request an additional copy from the study coordinator at any time during the study.
      Individuals in each recruitment pool were notified by a personalised hardcopy invitation
      letter and an invitation email directing them into the REDCap recruitment interface, where
      they could read an overview of the programme, expectations for participation and frequently
      asked questions, download the consent document, request a call back, complete a screening
      survey and enrol.
    consent_scope: >-
      Consent covers participation in the study protocol and the placement of the resulting data
      in an open-source repository, together with the sending of biospecimens to the study sample
      repository for future research. The dataset consent metadata records the consent type as
      "ConsentSpecifiedNotElsewhereCategorised" with the note that the public version of the
      dataset can only be used for type 2 diabetes related research while a private version will
      allow more generic use, and with no non-commercial, geographic, research-type, genetic-only
      or no-methods restrictions flagged.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset.
      This is clearly communicated in the consent document.

ethical_reviews:
  - reviewing_organization: >-
      University of Washington Institutional Review Board (Human Subjects Division), with
      reliance agreements from the Institutional Review Boards of the University of Alabama at
      Birmingham and the University of California, San Diego.
    review_details: >-
      Approval number STUDY00016228. Initial IRB approval was received on 20 December 2022 and
      the initial approval letter is published with the dataset documentation. An annual renewal
      application to the IRB about the status and progress of the study is required and due
      within 90 days of expiration. The study is registered on ClinicalTrials.gov as NCT06002048.
      The oversight metadata records the human subject review status as submitted and approved,
      no FDA-regulated drug, no FDA-regulated device, and no Data Monitoring Committee. Contact
      for the IRB reliance team is hsdrely@uw.edu, Human Subjects Division, University of
      Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470.
    source_caveats: >-
      The RO-Crate names the reviewing body "Washington University IRB" while giving a University
      of Washington Human Subjects Division address and contact; the BMJ Open protocol and the
      IRB protocol document both identify the reviewing IRB as that of the University of
      Washington.
  - reviewing_organization: AI-READI ethics and bioethics reviewers
    review_details: >-
      The RO-Crate records ethical review by Camille Nebeker, Debra Mathews, Kadija Ferryman and
      Nicholas Evans. Ethical, legal and social implications are considered at every stage of the
      project cycle, and the project sought guidance from bioethicists in establishing standards
      for collection, preparation and sharing of the data. A Community Advisory Board of eleven
      persons from the three sites, including diversity in race and ethnicity as represented in
      the sample, contributes to protocol development and evaluates the consent forms and
      research protocols.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      University of Washington IRB protocol STUDY00016228, initially approved 20 December 2022,
      with annual renewal.
  ethics_review_board: >-
    University of Washington Institutional Review Board, acting as the reviewing IRB with
    reliance agreements from the University of Alabama at Birmingham and the University of
    California, San Diego.
  regulatory_compliance:
    - >-
      Public release de-identified under the HIPAA Privacy Rule Safe Harbor method; licensees
      must comply with the data security and privacy standards established by the NIH under its
      Genomic Data Sharing Policy, currently the NIH Best Practices for Controlled-Access Data
      Subject to the NIH GDS Policy. The study is not FDA-regulated with respect to either drugs
      or devices.
  special_populations:
    - >-
      No protected population is purposefully included. Pregnant persons, persons with
      gestational diabetes and persons with type 1 diabetes are excluded, and eligibility begins
      at age 40 so no minors participate.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      Pregnancy and gestational diabetes are exclusion criteria, and the minimum age of 40
      excludes minors. Devices sent home with participants were specifically chosen with
      participant privacy as a primary concern: the environmental sensor and Garmin fitness
      tracker do not capture video or audio, are not equipped with GPS location monitoring, and
      are not synced with participant-owned devices. Transportation assistance through rideshare
      services was offered to participants who reported barriers to reaching study visits.

data_governance:
  committee_name: AI-READI Data Access Committee
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: >-
    Access to the public release requires logging in through a verified ID system, agreeing to
    use the data only for type 2 diabetes related research, and agreeing to the licence terms
    that set restrictions and obligations for data usage. The access type is recorded as
    "PublicDownloadSelfAttestationRequired". The full dataset is accessible only by entering into
    a data use agreement, and the more sensitive controlled-access set is available only to
    scientists whose institutions have completed legal and privacy use agreements with the
    AI-READI research programme. The BMJ Open protocol states that requirements for controlled
    access datasets were being developed by the Data Access Committee at the time of writing.
  stewardship_roles:
    - >-
      The AI-READI team supports and maintains the dataset, hosted on FAIRhub through Microsoft
      Azure. The data manager at each collection site is responsible for the quality control of
      all data before uploading to FAIRhub. The central project team performs standardisation and
      packaging for dissemination. Washington University in St. Louis is recorded as the managing
      organization of the dataset, lead sponsor of the study and licensor of the data; the
      RO-Crate names the AI-READI Consortium as the data governance committee. A biorepository at
      the University of Alabama at Birmingham Center for Clinical and Translational Science holds
      biospecimens, with procedures for reviewing and prioritising written requests to be
      developed before the biorepository is complete.
  notes: >-
    Through engagement with the Native Biodata Consortium the project is evaluating tools for
    American Indian and Alaska Native data governance, including data usage agreements, contract
    negotiations, transparent access agreements, and forms of assured return of benefit and
    sustainable input, control and monitoring of Tribal data.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    The AI-READI Data License Agreement version 2.0, issued by Washington University in St. Louis
    as Licensor and archived at https://doi.org/10.5281/zenodo.17555036, grants a non-exclusive,
    non-transferable licence to download, reproduce and use the Data and to create derivative
    works, for research and for commercial and non-commercial purposes. A licensee may be an
    individual or an authorised group within an institution, in which case the licensee
    sublicenses to authorised users and is fully liable for their acts and omissions. Data may be
    shared only with another licensee bound by identical terms, and only for collaboration on
    projects involving the Data. Storage is restricted to servers and devices maintained by and
    located within the licensee's institution, or cloud and backup services covered by a
    HIPAA-approved Business Associate Agreement with that institution. Derivative Data, including
    synthetic data generated from the Data, is treated as Data and subject to all the same
    restrictions. Models trained or adapted using the Data may be made, reproduced and
    distributed provided they do not themselves contain the Data or a modified version of it, and
    provided the licensee undertakes all reasonable efforts to minimise the likelihood that Data
    can be memorised, derived, reconstructed or reconstituted through them. Data may be
    reproduced in publications only as small representative samples in up to five images or
    figures per paper for illustrative purposes. Licensees must acknowledge the Licensor, the
    source and any funder in papers reporting use of the Data, using the current citation at
    docs.aireadi.org, and must comply with NIH Genomic Data Sharing Policy security standards and
    not tamper with watermarking. The Data is provided "as is" without warranty; the Licensor's
    aggregate liability is limited to one US dollar except where applicable law prohibits such a
    limitation; and the licensee indemnifies the Licensor. The agreement terminates automatically
    on any breach, whereupon the licensee must delete all copies of the Data and cease all use.
    The licence is described as specifically tailored to enable reuse of the AI-READI dataset and
    other clinical datasets for commercial or research purposes while placing strong requirements
    around data usage, security and secondary sharing to protect study participants, especially
    when data is reused for AI and ML applications.
  source_caveats: >-
    The data_use_permission value describes the public tier only: access to the public release is
    conditioned on agreeing to use the data solely for type 2 diabetes related research. The
    licence text itself permits both commercial and non-commercial use and imposes no
    disease-specific limit, and the dataset consent metadata records that "a private version will
    allow for more generic use". The single-valued enum cannot express both tiers, so the more
    restrictive public-tier condition is recorded and the fuller terms are set out in
    license_terms.
  notes: >-
    An earlier set of licence terms for reusing the AI-READI dataset was published on Zenodo in
    2024 (Contreras, J. et al., https://doi.org/10.5281/zenodo.10642459); version 2.0 archived at
    https://doi.org/10.5281/zenodo.17555036 is the version referenced by release 3.0.0. FAIRhub
    labels the licence "Health Data License" and the dataset description names it "AI-READI custom
    license v2.0". The dataset documentation itself is shared under CC-BY 4.0, and the BMJ Open
    protocol article is published under CC BY-NC 4.0.

ip_restrictions:
  restrictions:
    - >-
      Title to the Data, and all industrial and intellectual property rights in it, remain solely
      and exclusively with the Licensor, Washington University in St. Louis, and its suppliers;
      the licensee must not take any action inconsistent with such ownership and any rights not
      expressly granted are reserved. The licensee may not transfer, license, sublicense, sell,
      assign, display, share or otherwise convey any portion of the Data or any derivative work
      to any third party other than another licensee bound by identical terms. Licensees may
      refer publishers and conference organisers to the Licensor if they wish to obtain a
      separate licence to the Data for publication purposes. Models, algorithms and programs
      developed, trained or adapted using the Data but not themselves containing the Data may be
      made, reproduced and distributed by the licensee. The healthsheet records no third-party
      IP-based restrictions beyond the licence itself.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      The healthsheet answers the export-control and regulatory-restriction question by referring
      to the licence. The licence requires the licensee to comply with all applicable laws,
      regulations and restrictions relating to the distribution and use of the Data and of models
      built from it, and specifically to comply with the data security and privacy standards
      established by the NIH under its Genomic Data Sharing Policy. It does not name a specific
      export-control regime such as ITAR or EAR.
  other_compliance: >-
    NIH Genomic Data Sharing Policy security best practices for controlled-access data; HIPAA
    Privacy Rule Safe Harbor de-identification for the public release; storage limited to
    institutional infrastructure or cloud services under a HIPAA Business Associate Agreement.
    The RO-Crate records a confidentiality level of "HL7:2N (normal)" and states that the release
    is de-identified, is human subject research, and is not FDA-regulated.
  source_caveats: >-
    The only explicit confidentiality classification in the sources is the RO-Crate value "HL7:2N
    (normal)", which has no direct counterpart in this slot's enumeration. The value "restricted"
    is recorded because access to even the public tier requires verified-ID login, a
    disease-specific use attestation and acceptance of the licence, and because a second tier of
    the release is available only under institutional legal and privacy use agreements; it is an
    interpretation of that two-tier arrangement rather than a classification stated in the
    sources.

intended_uses:
  - use_category: >-
      Artificial intelligence and machine learning research into type 2 diabetes mellitus,
      including salutogenesis, the pathway from disease back to health.
    examples:
      - >-
        Downstream pseudotime manifold analysis to predict disease trajectories from participants
        of differing severity, ranging from normal to insulin-dependent T2DM.
    usage_notes: >-
      Public access is conditioned on agreeing to use the data only for type 2 diabetes related
      research; broader use requires the controlled-access route and a data use agreement.
  - use_category: >-
      Multimodal model development spanning survey, clinical, laboratory, retinal imaging,
      electrocardiographic, continuous glucose monitoring, wearable activity and home
      environmental sensor data.
    usage_notes: >-
      Data are shared as AI-ready, which the project defines as enabling immediate AI/ML research
      without reformatting and preprocessing, with all files in formats accessible with free and
      commonly used software.
  - use_category: >-
      A model and blueprint for future data-generating projects preparing and sharing AI-ready
      clinical datasets, including the guidelines, standards and platform developed alongside the
      data.
    examples:
      - >-
        The Clinical Dataset Structure (CDS) specification for organising clinical research
        datasets, the FAIRhub curation and sharing platform, and the healthsheet documentation
        approach.

other_tasks:
  - task_details: >-
      Because the acquisition protocol is hypothesis agnostic and spans more than ten health
      domains, the released data can support analyses beyond diabetes trajectory modelling, for
      example ophthalmic image analysis across seven imaging devices and six retinal modalities,
      cardiac waveform analysis, sleep and physical activity analysis, cognitive screening
      research, and indoor environmental exposure research linking home air quality to health
      measures. No formal guidelines are in place for researchers creating new labels or defining
      new tasks on the dataset.

discouraged_uses:
  - discouragement_details: >-
      Analyses that require sex, race/ethnicity, medication, geographic or genomic variables
      should not be attempted on the public release, from which these variables have been removed;
      they are available only through the controlled-access release under a data use agreement.
  - discouragement_details: >-
      Inferences about populations not represented in the cohort are not supported: Pacific
      Islander and Native American communities are absent, non-English speakers are excluded,
      eligibility begins at age 40 with an upper bound of 85, and people with type 1 or
      gestational diabetes and pregnant people are excluded. Recruitment is urban and
      hospital-based across three academic health systems.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the Data is prohibited, as the Data is intended
      solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the Data, alone or with other information, to compromise or
      infringe the confidentiality of information about any Data Subject, to invade or compromise
      their privacy, to attempt to identify or contact any Data Subject or group of Data Subjects,
      to extract or extrapolate identifying information, to establish a Data Subject's membership
      in a particular group of persons, or otherwise to cause harm or injury to any Data Subject.
  - prohibition_reason: >-
      Sharing or distributing the Data with any third-party model vendor or developer for training
      or development purposes, including model weight modification and other adjustments to a
      model's logic or operation, even where that vendor is party to a Business Associate
      Agreement with the licensee's institution. Short-term interaction such as prompting or
      querying a third-party model under a Business Associate Agreement for analysis purposes is
      permitted.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or otherwise
      conveying any portion of the Data or any derivative work to a third party that is not
      another licensee bound by identical terms.
  - prohibition_reason: >-
      Reproducing Data in papers, articles, presentations, analyses, reports or publications
      beyond small representative samples in up to five images or figures per paper for
      illustrative purposes; publishing or posting larger amounts via supplemental files, zip
      archives, code packages or other means is prohibited notwithstanding journal or conference
      requirements.
  - prohibition_reason: >-
      Storing the Data anywhere other than servers and devices maintained by and located within
      the licensee's institution, or cloud and remote storage and backup services covered by a
      HIPAA-approved Business Associate Agreement with that institution.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking that may be applied to the
      Data to identify the licensee for security purposes.
  - prohibition_reason: >-
      Disseminating models built from the Data without first undertaking all reasonable efforts to
      minimise the likelihood that Data can be memorised, derived, reconstructed or reconstituted
      through their use or construction.

future_use_impacts:
  - impact_details: >-
      A theoretical risk of future re-identification exists. AI algorithms can infer individual
      patient characteristics and could facilitate individual-level identification; the project
      responds with a robust data dissemination system, a strict licence agreement and data
      watermarking for both public and controlled sets. Beyond this, the project states that to
      the extent of its knowledge it does not currently anticipate uses of the dataset that could
      result in unfair treatment or harm.
  - impact_details: >-
      Because enrolment is ongoing and interim releases have not achieved the intended balance
      across race/ethnicity, biological sex and diabetes severity, models trained on this release
      may inherit the current imbalance. The recommended split is designed to mitigate this by
      balancing the validation and test partitions.
  - impact_details: >-
      The project expects that the flagship dataset will lead to novel discoveries into T2DM
      pathogenesis and salutogenesis while benefiting a broader population given the diversity of
      participants, and that the accompanying blueprint has the potential to remove a major
      bottleneck to the widespread use of AI in healthcare, namely the availability of data that
      is off-the-shelf ready for AI-based analysis.
  - impact_details: >-
      Information related to sex and race/ethnicity was removed from the public release
      specifically to prevent stigmatisation of findings, which constrains fairness auditing on
      the public set and shifts such analyses to the controlled-access route.

distributions:
  - path: cardiac_ecg/
    bytes: 302931703
    conforms_to: WaveForm DataBase (WFDB); directory layout per Clinical Dataset Structure v0.1.1
    conforms_to_standard:
      - WFDB
      - CDS
    notes: >-
      4,515 files. Electrocardiogram data collected by a 12-lead protocol using the Philips
      PageWriter TC30 Cardiograph, with the participant seated in a reclining chair or supine and
      the position recorded at 0, 30, 60 or 90 degrees relative to supine. Exported from the
      device in .xml and converted for release.
  - path: clinical_data/
    format: CSV
    media_type: text/csv
    bytes: 176182781
    conforms_to: >-
      Observational Medical Outcomes Partnership (OMOP) Common Data Model; directory layout per
      Clinical Dataset Structure v0.1.1
    conforms_to_standard:
      - OMOP_CDM
      - CDS
    notes: >-
      7 files. Clinical data collected through REDCap, including blood and urine laboratory
      values, physical measurements, vitals, visual acuity and contrast sensitivity, monofilament
      test results, cognitive testing and survey data. Each CSV file is a one-to-one mapping to an
      OMOP CDM table. A dqd_omop.json file supports data quality analysis with the OMOP CDM Data
      Quality Dashboard.
  - path: environment/
    format: CSV
    media_type: text/csv
    bytes: 55625676514
    conforms_to: >-
      NASA ASCII File Format Guidelines for Earth Science Data; directory layout per Clinical
      Dataset Structure v0.1.1
    conforms_to_standard:
      - ESDS
      - CDS
    notes: >-
      2,232 files. Data collected through the LeeLab Anura, an environmental sensor device custom
      built for the AI-READI project at the Karalis Johnson Retina Center, University of
      Washington. Variables include ambient temperature, relative humidity, nitrogen oxides (NO
      and NO2), volatile organic compounds, particulate matter counts (PM1.0, PM2.5, PM4 and
      PM10) and eleven multi-spectral light intensity measurements.
  - path: retinal_flio/
    bytes: 1069466876718
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory layout per Clinical
      Dataset Structure v0.1.1
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      7,969 files. Fluorescence lifetime imaging ophthalmoscopy data from the Heidelberg FLIO
      device. Each eye is recorded at two wavelength channels, short (498-560 nm) and long
      (560-720 nm), supplied as separate DICOM files; each pixel contains a photon arrival-time
      curve following Poisson statistics. Exported in .sdt and converted to DICOM.
  - path: retinal_oct/
    bytes: 1317625293027
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory layout per Clinical
      Dataset Structure v0.1.1
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      56,478 files. Structural optical coherence tomography data from the Heidelberg Spectralis,
      Topcon Maestro2, Topcon Triton and Zeiss Cirrus 5000. Topcon data were exported in .fda and
      converted to DICOM.
  - path: retinal_octa/
    bytes: 1155908809724
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory layout per Clinical
      Dataset Structure v0.1.1
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      173,721 files. Optical coherence tomography angiography data organised into en face, flow
      cube and segmentation modalities, each captured on the Heidelberg Spectralis, Topcon
      Maestro2, Topcon Triton and Zeiss Cirrus devices.
  - path: retinal_photography/
    bytes: 174381046406
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM); directory layout per Clinical
      Dataset Structure v0.1.1
    conforms_to_standard:
      - DICOM
      - CDS
    notes: >-
      93,921 files. Two-dimensional retinal (fundus) photography in three modalities: colour
      fundus photography from the iCare Eidon, Optomed Aurora, Topcon Maestro2 and Topcon Triton;
      fundus autofluorescence from the iCare Eidon; and near-infrared reflectance from the
