    conforms_to_standard:
      - OPEN_MHEALTH
      - CDS
    notes: >-
      2,246 files. Continuous glucose monitoring data from the Dexcom G6, recording a blood
      glucose measurement in mg/dL every five minutes over a ten-day wear period during which
