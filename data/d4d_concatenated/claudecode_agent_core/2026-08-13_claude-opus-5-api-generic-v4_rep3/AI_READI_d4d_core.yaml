conforms_to: >-
  The dataset as a whole is organised according to the Clinical Dataset Structure (CDS) v0.1.1
  specification (https://cds-specification.readthedocs.io/en/v0.1.1/), which defines the root
  datatype / modality / device / participant directory hierarchy and the accompanying metadata
  files. Within that structure each data type follows its own community standard: WaveForm
  DataBase (WFDB) for the 12-lead ECG data; the Observational Medical Outcomes Partnership
  (OMOP) Common Data Model for the clinical, laboratory and survey data; Digital Imaging and
  Communications in Medicine (DICOM) for retinal photography, OCT, OCTA and FLIO; Open mHealth
  for the wearable activity monitor and continuous glucose monitoring data; and the NASA ASCII
  File Format Guidelines for Earth Science Data for the environmental sensor data. A separate
  RO-Crate 1.2-DRAFT metadata description of the release is also published.
