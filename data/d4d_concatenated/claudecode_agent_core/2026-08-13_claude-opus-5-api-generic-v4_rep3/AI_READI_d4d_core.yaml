id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset is a multimodal, AI-ready dataset collected from individuals with and
  without type 2 diabetes mellitus (T2DM) and harmonised across three data collection sites in
  the United States: the University of Alabama at Birmingham, the University of California San
  Diego, and the University of Washington. Version 3.0.0 contains data from 2,280 participants
  collected between 19 July 2023 and 1 May 2025, comprising 356,343 files totalling
  approximately 3.82 TB. Data span more than ten health domains: pre-visit self-report surveys
  (screening, demographics, CES-D-10 depression screen, PAID-5, diabetes self-care score, diet,
  smoking, alcohol, vaping and marijuana use, general health, social determinants of health,
  ophthalmic survey, and current medications coded with RxNorm); on-site physical measurements
  and vitals (height, weight, waist and hip circumference, blood pressure, heart rate); 12-lead
  electrocardiography; monofilament testing for peripheral neuropathy; the Montreal Cognitive
  Assessment; visual acuity and letter contrast sensitivity under both photopic and mesopic
  conditions; autorefraction; retinal imaging from seven devices covering colour fundus
  photography, fundus autofluorescence, near-infrared reflectance, optical coherence tomography,
  optical coherence tomography angiography and fluorescence lifetime imaging ophthalmoscopy;
  non-fasting blood and urine laboratory testing; and ten days of at-home monitoring with a
  Dexcom G6 continuous glucose monitor, a Garmin Vivosmart 5 activity tracker and a custom-built
  indoor environmental sensor. The cohort was recruited by screening electronic health records
  at the three sites and is intended to be triple-balanced across self-reported race/ethnicity
  (Asian, Black, Hispanic, White), diabetes severity (no diabetes; pre-diabetes or
  lifestyle-controlled; controlled by oral or non-insulin injectable medication;
  insulin-controlled) and biological sex, in order to support artificial intelligence and
  machine learning research into salutogenesis, the pathway from disease back to health. The
  public release contains no protected health information and omits sex, race/ethnicity and
  medication variables; those variables, together with 5-digit ZIP code, genomic sequencing
  data, past health records and traffic and accident reports, are held in a controlled-access
  release. The dataset is organised according to the Clinical Dataset Structure (CDS) v0.1.1,
  with each data type stored in the community file standard appropriate to it.
