maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. Contact information is provided in the
      README file included with the dataset, at https://aireadi.org/contact and at
      https://docs.aireadi.org/docs/3/contact; the central study contact recorded in the study
      metadata is contact@aireadi.org.
  - role: other
    maintainer_details: >-
      FAIRhub hosts the dataset on Microsoft Azure cloud infrastructure and issues its DOIs. The
      FAIRhub platform was developed for this project as a cloud-based data management, curation
      and sharing platform.

updates:
  frequency: Approximately once a year.
  update_details: >-
    The dataset is released as static versions and is not updated in place to correct labelling
    errors, add instances or delete instances. Instead, new versions are released with additional
    data from participants enrolled since the last version release. Changes between the current
    version and the previous one are documented in detail in the CHANGELOG file included in the
    dataset and visible at docs.aireadi.org. Between the pilot v1.0.0 and v3.0.0 the participant
    count grew from 204 to 2,280 through the addition of 863 year-2 and 1,213 year-3 participants,
    the number of imaging devices grew by one and then three, and processing moved from custom and
    ad hoc to automated plus custom. Further versions are expected while enrolment continues.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
    - >-
      Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants; version 2.0.0,
      DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants, 165,051 files, 2.01
      TB; version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants,
      356,343 files, 3.82 TB.
  version_details: >-
    Older versions are not updated but their landing pages and per-version documentation remain
    published; FAIRhub marks versions 1.0.0 and 2.0.0 as no longer accessible for download, and
    the v2.0.0 documentation carries a banner directing readers to the latest version. Each
    dataset version has its own documentation set at docs.aireadi.org, selectable from a version
    dropdown. Datasheets in healthsheet form exist for versions 1, 2 and 3. The data fields are
    largely the same between versions 2.0.0 and 3.0.0, except that the Snellen visual acuity
    variables were dropped in version 3.0.0, leaving only logMAR visual acuity measurements, and
    version 3.0.0 adds a recommended training/validation/test split not present in earlier
    versions.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. Participants
    were not told that their data would be retained for a fixed period and then deleted. Licensees
    are subject to a different obligation: on termination of the licence for breach, a licensee
    must delete all copies of the Data in its possession and control, including that of all
    authorised users, and cease all use.

notes: >-
  Version 3.0.0 ships a recommended split into training, validation and testing partitions in
  proportions of 70%, 15% and 15% (1,576 / 352 / 352 participants), distributed in the
  participants.tsv file. Because sex, race and ethnicity are not released with the public version,
  the project team prepared the split itself so that the validation and test sets are balanced as
  far as possible for sex, race/ethnicity and diabetes status, with mean age also matched across
  partitions (train 61.1 +/- 11.3 years; validation 60.3 +/- 10.8; test 60.5 +/- 11.4). Training
  race/ethnicity counts are Hispanic 204, Asian 369, Black 343, White 660, with 88 of each group in
  each of validation and test; training sex counts are male 599 and female 977, with 176 of each
  sex in each of validation and test; training diabetes status counts are no diabetes 600,
  lifestyle-controlled 384, oral-medication-controlled 487 and insulin-controlled 105. Earlier
  versions did not include a recommended split.
  Participants received a 200 USD stipend for the study visit, paid through NIH award OT2OD032644
  once the final data were received and the study devices returned, typically at least two weeks
  after the visit, and not pro-rated; reasonable parking, public transit or rideshare costs were
  also covered. Study team effort was supported by the same award in proportion to effort
  contributed, at salaries aligned to each site's funding guidelines.
  Participants receive results back from the study: heart rate, blood pressure and visual acuity on
  an exam card before leaving the visit, a Dexcom report of average blood glucose and Glucose
  Management Indicator by encrypted email after the ten-day monitoring period, and laboratory
  results with normative values by HIPAA-compliant encrypted email at the time of the yearly data
  release. Coordinators alert participants to incidental findings requiring emergency care, and
  imaging technicians are trained to detect retinal detachment, tumour and optic disc oedema and to
  trigger immediate referral.
  The project maintains a biorepository at the University of Alabama at Birmingham Center for
  Clinical and Translational Science holding buffy coats, genomic DNA, plasma, serum,
  PAXgene-stabilised RNA and peripheral blood mononuclear cells for future genomics, proteomics,
  metabolomics, gene expression and immunological studies. Biospecimens are not part of this
  dataset, the number of samples available to share is finite, and procedures for reviewing and
  prioritising written requests were still being developed.
  Two accompanying programmes are recorded but are not part of the released data: a year-long
  research internship programme at UC San Diego comprising a two-week data science and programming
  bootcamp followed by a year of didactic lectures and mentored research, whose inaugural 2023-2024
  cohort of ten interns was 70% women, 30% Black and 50% from backgrounds under-represented by NIH
  criteria and who contributed to developing healthsheets and mapping project data into common data
  models; and team science strategies to understand the interaction patterns of the project's
  multi-team systems.
  The required citation for the dataset is "AI-READI Consortium. (2025). Flagship Dataset of Type 2
  Diabetes from the AI-READI Project (3.0.0) [Data set]. FAIRhub. https://doi.org/10.60775/
  fairhub.3", and users are required to cite the resources specified in the AI-READI documentation
  for version 3.0.0 at https://docs.aireadi.org.

source_caveats: >-
  Several disagreements and gaps exist across the sources in the bundle. (1) The acronym is
  expanded as "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights" in the BMJ
  Open protocol and the Nature Metabolism comment, but as "Artificial Intelligence Ready and
  Exploratory Atlas for Diabetes Insights" in the NIH RePORTER record, the FAIRhub study metadata,
  the healthsheet and the dataset README. (2) The responsible institution is inconsistent: FAIRhub
  records Washington University in St. Louis (ROR 01yc7t268) as managing organization, lead sponsor
  and the affiliation of PIs Aaron Lee, Cecilia Lee and Linda Zangwill, and the licence names
  Washington University in St. Louis as Licensor; the BMJ Open protocol, NIH RePORTER and the
  RO-Crate place Aaron Lee and the IRB at the University of Washington, and the RO-Crate names the
  IRB "Washington University IRB" while giving a University of Washington Human Subjects Division
  address. Linda Zangwill's affiliation is also given as UC San Diego in the Nature Metabolism
  author list; the FAIRhub study metadata is used uniformly for the affiliations recorded on the
  Creator objects, which is why Zangwill appears with UC San Diego and the two Lees with
  Washington University in St. Louis. (3) Enrolment start is 18 July 2023 in BMJ Open but
  2023-07-19 in the FAIRhub metadata and README. (4) Target enrolment is 4,000 in BMJ Open and the
  FAIRhub study metadata, "4,000+" in NIH RePORTER, and 4,600 in the IRB protocol form; the IRB
  form and FAIRhub eligibility impose an upper age limit of 85 that BMJ Open does not mention. (5)
  T2DM prevalence is cited as 10.5% of the world's adult population in BMJ Open and as more than
  6% of the world's population in the Nature Metabolism comment. (6) The healthsheet describes
  version 3.0.0 as consisting of data collected "up through the end of the second year of the
  study" while simultaneously giving the window as 19 July 2023 to 1 May 2025 and while the README
  CHANGELOG attributes 1,213 participants to year 3 data. (7) The healthsheet answers "No" to
  whether the dataset identifies demographic sub-populations, while the README publishes
  race/ethnicity, sex and diabetes-status counts for all 2,280 participants in the split summary;
  the reconciliation is that these variables are used for split construction and reported in
  aggregate but not released as per-record variables in the public set. (8) De-identification is
  recorded as deIdentType "NoDeIdentification" with deIdentDirect and deIdentHIPAA both true and a
  note that no identifiers were collected, while the Nature Metabolism comment describes the public
  set as stripped of PHI via the HIPAA Safe Harbor method; the two healthsheet questions on
  de-identification measures and de-identification preprocessing are left blank, as is the erratum
  question. (9) The IRB protocol form in the bundle is a partially completed application describing
  an earlier design (4,600 participants, diet-controlled rather than lifestyle-controlled
  terminology, PhenX surveys, an option to import up to 90 days of prior Dexcom Clarity data, and a
  plan to invite 10% of participants back in year 4); where it conflicts with the published
  protocol and the released dataset metadata, the latter have been preferred. (10) Marijuana use is
  not assessed for participants living in Alabama because it is an illegal substance there, so that
  questionnaire item is site-dependent. (11) The healthsheet's device section and the BMJ Open
  Table 4 differ in device naming granularity (for example "Cirrus 5000" versus "Cirrus 5000
  Angioplex"); device identities were taken from the dataset structure description where available.
  (12) File and byte counts for the nine data type directories sum to 356,334 files, nine fewer
  than the reported total of 356,343, the difference corresponding to the nine root-level metadata
  files. (13) Garmin is located in Olathe, Kansas in the Nature Metabolism acknowledgement and in
  Schaffhausen, Switzerland in the BMJ Open device table. (14) Two enumerated values in this record
  are interpretations rather than statements found in the sources, and are annotated as such on the
  objects that carry them: regulatory_restrictions.confidentiality_level and
  license_and_use_terms.data_use_permission. (15) The healthsheet answers "No" or "N/A" to
  questions about prior task use of the dataset, a repository tracking papers that use it, an
  erratum, external audits, a data protection impact assessment, labelling and a mechanism for
  outside parties to extend the dataset; those slots are therefore left unpopulated rather than
  filled with statements of absence.