      15,245 files. Data from the Garmin Vivosmart 5 wearable fitness tracker, worn for ten
      consecutive days at a five-second sampling frequency, organised into heart rate, oxygen
      saturation, physical activity, physical activity calorie, respiratory rate, sleep and stress
      modalities. Exported in .FIT and converted to Open mHealth.
  - path: wearable_blood_glucose/
