purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset
      that enables future generations of artificial intelligence and machine learning research
      to provide critical insights into type 2 diabetes mellitus, including salutogenic pathways
      back to health.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria or biases and can be used to reconstruct a temporal atlas of T2DM
      development and reversal towards health.
  - response: >-
      To establish and share a blueprint of standards, best practices and guidelines for the
      collection, preparation and sharing of data targeted at AI/ML, so that future data
      generation projects can follow them.
  - response: >-
      To increase access to and the quality of AI/ML research by recruiting and training
      personnel, including a year-long research internship programme at the intersection of
      biomedicine and AI.

addressing_gaps:
  - response: >-
      A major barrier to AI in health research has been the lack of diverse datasets that are AI
      ready for training AI models; AI-READI is designed to address that lack.
  - response: >-
      Understanding and affecting the course of complex, multi-organ diseases such as T2DM has
      been limited by the absence of well-designed, high-quality, large and inclusive multimodal
      datasets covering molecular, physiological, pathological and clinical states at various
      stages of illness.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published between 2000 and 2020
      found that samples lacked racial and ethnic diversity. AI-READI recruits four
      race/ethnicity groups in approximately equal proportions rather than mirroring the US
      demographic distribution, as a demographic improvement over prior epidemiological studies
      and clinical trials on T2DM.
  - response: >-
      Current understanding of T2DM in the context of salutogenesis, the pathway from disease
      back to health, is limited; most prior work studies pathogenesis rather than resilience.
  - response: >-
      Existing secondary data sources such as claims data or electronic health records do not
      support the downstream AI/ML analyses the project targets, motivating a purpose-built
      multi-domain acquisition protocol.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease trajectories
      by collecting and learning from complex, multimodal data from participants with differing
      disease severity, from normal to insulin-dependent T2DM.
  - response: >-
      Development of multimodal AI/ML models of type 2 diabetes pathogenesis and salutogenesis
      across imaging, waveform, wearable, environmental, laboratory and survey modalities.
  - response: >-
      Reconstruction of a temporal atlas of T2DM development and reversal towards health from
      cross-sectional multimodal data.

instances:
  - instance_type: >-
      An individual study participant. Each instance consists of all of the data available for
      one person participating in the study, across survey, clinical, laboratory, retinal
      imaging, electrocardiographic, continuous glucose monitoring, wearable activity and home
      environmental sensor modalities.
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with each data instance. The dataset is
      hypothesis agnostic and was assembled to facilitate multiple potential downstream AI/ML
      applications rather than a single prediction task, so no labelling was performed and no
      human or machine annotators were engaged.
    notes: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements; in a few cases the data collection device had no
      stored results or was returned too late to retrieve the results, for example because the
      battery died; and in a few cases a data collision occurred at some point in the process
      and data was lost.
    source_caveats: >-
      A single data_topic term is recorded because the slot is single-valued; the dataset also
      spans terms that would apply equally well, including Ophthalmic Imaging, Waveform, mHealth,
      Glucose Monitoring, Activity Monitoring and Survey. No data_substrate term is recorded for
      the same reason: the release mixes DICOM imaging, waveform data, delimited text, JSON and
      time-series records, and no single enumerated substrate describes the instance as a whole.

