distribution_formats:
  - format: DICOM medical imaging files for all retinal photography, OCT, OCTA and FLIO data
    media_type: application/dicom
  - format: >-
      Comma-separated values files for the OMOP CDM clinical tables, environmental sensor
      readings and other tabular data
    media_type: text/csv
  - format: >-
      JSON files for Open mHealth wearable and continuous glucose monitoring records and for
      Clinical Dataset Structure metadata
    media_type: application/json
  - format: Markdown documentation files distributed with the dataset
    media_type: text/markdown
  - format: >-
      Tab-separated manifest and participant files (manifest.tsv in each data type directory,
      participants.tsv at the root) and WFDB signal and header files for the ECG data
  - format: >-
      Whole-dataset download through the FAIRhub portal, backed by Microsoft Azure storage, gated
      by verified-ID login, self-attestation that use will be for type 2 diabetes related
      research, and acceptance of the licence. Version 3.0.0 additionally offers a smaller
      mini-subset of the dataset for pipeline development and documents Azure Storage access.
    access_urls:
      - https://fairhub.io/datasets/3
      - https://fairhub.io/datasets/3/access

distribution_dates:
  - release_dates:
      - >-
        Version 1.0.0 released 3 May 2024; version 2.0.0 released 8 November 2024; version 3.0.0
        released 17 November 2025. The dataset description records 2025-11-17 as the date version
        3.0.0 was made available on FAIRhub and 2025 as the publication year.
    notes: >-
      The BMJ Open protocol describes the first release as the publicly accessible dataset from
      pilot data collection made available in May 2024, with all data collected through 31 July
      2024 made available in November 2024. The dataset is distributed and available for public
      use outside the creating organisation through the FAIRhub platform under DOI
      10.60775/fairhub.3; onward sharing by a licensee is confined to other licensees bound by
      identical terms.

