id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a flagship, ethically sourced dataset of human voice, speech, cough and
  breathing recordings linked to demographic, clinical and validated questionnaire data, created by
  the Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program. The consortium
  identified five disease cohort categories in which voice changes have been associated with
  specific conditions and with recognised unmet clinical need: voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and pediatric
  voice and speech disorders. Participants were recruited at high-volume expert clinics across
  North America, screened against per-diagnosis inclusion and exclusion criteria, consented, and
  then completed a standardised protocol of acoustic tasks, demographic and confounder surveys,
  disease-specific validated questionnaires, and clinician-performed gold-standard diagnostic
  validation. Collection used a custom tablet application (the Bridge2AI-Voice App) for adults and
  reproschema-ui for the pediatric protocol, with phenotype data managed in REDCap.
  This record describes the adult release published on PhysioNet as version 3.1.0, containing data
  for 833 participants collected across five sites. The published release is a feature-only
  derivation: raw audio waveforms are withheld and only lower-risk derived representations are
  distributed, including spectrograms, Mel spectrograms, Mel-frequency cepstral coefficients,
  pitch, loudness, periodicity, articulatory (electromagnetic articulography) traces, phonetic
  posteriorgrams, and static acoustic feature tables from openSMILE, Praat and Parselmouth. These
  are distributed as Apache Parquet and tab-separated files with accompanying JSON data
  dictionaries, alongside per-recording metadata, audio quality metrics, and phenotype tables
  covering enrollment, demographics, confounders, per-condition diagnosis and validated
  questionnaires. Raw audio remains available only through a separate controlled-access process
  administered by the consortium's Data Access Compliance Office.
