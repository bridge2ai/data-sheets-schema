source_caveats: >-
  Enrollment targets differ across sources. The NIH RePORTER narrative and the IRB protocol describe
  a database of 30,000 human voices with up to 5,000 participants per disease category; the
  audiomics viewpoint states a primary deliverable of a publicly available database of 30,000 human
  voices; the project documentation and study metadata give a target of 10,000 voices with an
  anticipated enrollment of 10,000 by 2027. The released adult dataset contains 833 participants.
  Award identifiers are inconsistent: NIH RePORTER gives project number 3OT2OD032720-01S3 with core
  project number OT2OD032720; the PhysioNet acknowledgement gives 3OT2OD032720-01S1; the feasibility
  publication gives grant 1OT2OD032720-01; and the project website footer renders the award as
  "3Tf-OTOD03272001S2" and "3TF-OT2ActfOD032720Projectf01S1", both of which appear garbled.
  Recording counts differ: the project documentation describes version 3.0 as containing
  approximately 61,937 voice-derived recordings from 833 adult participants, while the PhysioNet
  version 3.1.0 data description gives per-feature row counts between 23,533 and 32,522. The
  healthsheet states five recording sites; the IRB protocol lists nine participating institutions
  with lead investigators and the documentation lists twelve collaborating organisations. The
  healthsheet, study metadata and de-identification sections published on the documentation site
  were written against versions 2.0.0 and 3.0.0 and were not fully updated for version 3.1.0: they
  name the Health Data Nexus rather than PhysioNet as the hosting platform, and state that the
  dataset contains only adult populations even though a separate pediatric dataset has since been
  released.

