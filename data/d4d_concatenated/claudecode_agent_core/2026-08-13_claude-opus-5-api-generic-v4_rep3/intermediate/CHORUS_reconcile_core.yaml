subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Care setting of the admission: adult intensive care unit (ICU), pediatric intensive care
      unit (PICU) and neonatal intensive care unit (NICU).
    distribution: >-
      The current released dataset comprises 50,000 patient admissions drawn from ICU, PICU and
      NICU; per-unit counts are not broken out in the sources.
  - subpopulation_elements_present: true
    identification: >-
      Contributing hospital: admissions originate from 14 data acquisition hospitals within a
      20-institution academic network.
    distribution: >-
      As of August 2025 the dataset covered 14 different hospitals with over 45,000 unique
      admissions; the number of admissions per hospital is not reported.

sampling_strategies:
  - is_sample: true
    strategies: >-
      Retrospective sampling of critically ill patient admissions across 14 data acquisition
      hospitals, designed to ensure comprehensive sets of patient conditions and clinical
      treatment strategies; federated access enables sampling methods intended to ensure a
      balanced and diverse cohort.
    representative_verification: >-
      The project states the goal of assembling the most diverse, high-resolution, ethically
      sourced AI-ready data set of its kind and of accounting for social determinants of health
      and contextual factors such as geographic distance to the nearest hospital.
    source_caveats: >-
      The sources describe diversity and balance as design goals; no quantitative
      representativeness assessment against a reference critical care population is reported.

acquisition_methods:
  - acquisition_details: >-
      Retrospective extraction of existing clinical records from hospital source systems at 14
      data acquisition centers — structured EHR, unstructured clinical notes, PACS imaging,
      bedside monitor/gateway telemetry and hospital EEG databases — followed by standardization
      and delivery of a CHoRUS data extract to the central enclave.
    was_inferred_derived: false
    was_validated_verified: true
    notes: >-
      Validation includes internal validation and review of SOPs, validated semantic mappings for
      connecting source-format clinical data to international standards, and a clinical validation
      SOP for contributed mappings.
    source_caveats: >-
      The records were generated by direct clinical observation and documentation in the course of
      care, but were not observed for this project; the sources do not frame acquisition in terms
      of direct observation, so that flag is left unset here.

collection_mechanisms:
  - mechanism_details: >-
      Hospital electronic health record systems supplying demographics, medication administration
      (time-stamped at each infusion change or dose administration), procedures documented by
      providers, high-frequency nursing flowsheet documentation, and provider-documented diagnoses.
  - mechanism_details: >-
      Hospital picture archiving and communication systems (PACS) supplying radiology imaging in
      DICOM format.
  - mechanism_details: >-
      Bedside physiological monitors with gateway/middleware supplying waveform telemetry.
  - mechanism_details: >-
      Hospital EEG databases supplying EEG waveforms in EDF+ and Persyst formats.
  - mechanism_details: >-
      CHoRUS site tooling and standard operating procedures — the chorus-extract-upload tools for
      creating and uploading a CHoRUS Data Extract, and the Chorus_SOP interactive workflow
      diagram with step-by-step extraction and contribution instructions.

collection_timeframes:
  - timeframe_details: >-
      Retrospective data collection carried out over the course of the award (project period
      2022-09-01 to 2026-11-30). Coverage as of August 2025 was 14 hospitals and over 45,000
      unique admissions, with acquisition of additional modalities and admissions ongoing.
    source_caveats: >-
      The calendar period spanned by the clinical records themselves is not stated in any source;
      the dates given are the NIH project start and end dates.

data_collectors:
  - collector_details: >-
      Data contributing sites: fourteen data acquisition centers within the 20-center CHoRUS
      Network, staffed by site data managers who extract, curate and submit CHoRUS data extracts
      following validated standard operating procedures and who provide regular status updates on
      their progress.
    role: academic_institution
  - collector_details: >-
      Central coordinating teams: the CHoRUS sub-teams for Standards, Data Acquisition and
      Tooling, which maintain SOPs, semantic mappings and software and resolve submission issues
      through context-specific GitHub discussion spaces.
    role: other

raw_data_sources:
  - source_description: >-
      Structured electronic health record data at 14 contributing hospitals (demographics,
      medication administration, procedures, nursing flowsheets, diagnoses).
    source_type: Hospital electronic health record system
    raw_data_format: Site-native EHR extracts, mapped to the OMOP Common Data Model
    access_details: >-
      Source data remain at the contributing institution; only the curated CHoRUS extract is
      delivered to the controlled-access enclave.
  - source_description: Unstructured clinical notes in the hospital electronic health record.
    source_type: Hospital electronic health record system
    raw_data_format: Free text, extracted and tokenized with the OHNLP toolkit
    access_details: >-
      Clinical notes are stored locally at contributing sites; only tokens are available in the
      enclave.
  - source_description: Radiology imaging studies held in hospital PACS.
    source_type: Picture archiving and communication system (PACS)
    raw_data_format: DICOM
    access_details: >-
      As of August 2025, 1,000 images were available with de-identification in process for a
      larger cohort.
  - source_description: >-
      Continuous physiological telemetry from bedside monitors, captured through gateway and
      middleware systems.
    source_type: Bedside patient monitoring system
    raw_data_format: Vendor monitor output converted to WFDB (PhysioNet schema extended)
  - source_description: EEG recordings held in hospital EEG databases.
    source_type: Hospital clinical EEG database
    raw_data_format: EDF+ and Persyst
    access_details: EEG extraction was in process as of August 2025.

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of structured clinical data to the OMOP Common Data Model, including use of
      OMOP schema extensions for high-frequency nursing flowsheet documentation, supported by
      validated semantic mappings between source formats and international standards.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit, with the
      notes themselves retained locally at contributing sites and only derived tokens transferred
      to the enclave.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, including
      de-identification of DICOM imaging prior to release of the larger imaging cohort.
  - preprocessing_details: >-
      Conversion of waveform data into WFDB using the CHoRUS waveform conversion scripts and
      documentation maintained in the chorus_waveform repository.
  - preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss so that records carry contextual factors
      such as geographic distance to the nearest hospital and social determinants of health.

cleaning_strategies:
  - cleaning_details: >-
      Site submissions are reviewed against standard operating procedures that have undergone
      internal validation and review, and characterization reports are generated and returned to
      each site following its data submission (CHoRUSReports).
  - cleaning_details: >-
      Semantic mappings are pooled and clinically validated: clinical collaborators contribute to
      the chorus-mapping repository following an associated clinical validation SOP.

labeling_strategies:
  - labeling_details: >-
      Data are labeled with targets important for prediction using a dedicated CHoRUS
      visualization and annotation environment; the project develops multi-center capabilities to
      acquire, standardize, tokenize, store, visualize and label data.
    source_caveats: >-
      The sources do not state who the annotators are, how many annotations are made per item, or
      what inter-annotator agreement was achieved.

machine_annotation_tools:
  - tools: OHNLP toolkit
    tool_descriptions: >-
      Open-source natural language processing toolkit used to extract and tokenize unstructured
      clinical notes; the resulting representation follows the OHNLP open-source schema.
  - tools: DeGauss (via the UF-Geocoding repository)
    tool_descriptions: >-
      Open-source code used to geocode OMOP Location entities so that geographic and exposome
      context can be attached to clinical records.
  - tools: privacy_scan_tool
    tool_descriptions: A privacy scanning tool for medical records maintained in the chorus-ai organization.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Several modalities were incomplete as of August 2025: only about 1,000 images were available
      with de-identification still in process for a larger cohort, EEG extraction was still in
      process, and clinical notes were held locally at sites with only tokens available in the
      enclave.
    scope_impact: >-
      Analyses requiring imaging, EEG or full note text are limited relative to the structured
      OMOP and telemetry components, which are already in the enclave.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Metadata were listed as planned rather than available for clinical notes, imaging and
      waveform EEG at the time of the August 2025 description, although published metadata schemas
      were identified for each.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers admissions to ICU, PICU and NICU at 14 data acquisition hospitals drawn
      from a 20-institution academic consortium in the United States.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Diversity and cohort balance are pursued through sampling methods enabled by federated
      access, but the sources report no completed assessment demonstrating that the assembled
      cohort is representative.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      All records originate from the 14 academic data acquisition centers of the CHoRUS Network,
      so the cohort reflects the patient populations and care practices of those participating
      hospitals.
    mitigation_strategy: >-
      Sampling is designed to ensure comprehensive sets of patient conditions and clinical
      treatment strategies, and federated access enables sampling methods intended to ensure a
      balanced and diverse cohort; patient-focused ethical and legal work explicitly addresses the
      management of bias and accounts for social determinants of health.
    source_caveats: >-
      The sources identify bias management as a project aim and describe mitigations, but do not
      enumerate specific measured biases in the released data.

is_deidentified:
  method: >-
    Tokenization of unstructured electronic health record text using the OHNLP toolkit;
    de-identification of DICOM imaging (in process for the larger imaging cohort); and
    transformation of data using approaches that limit re-identification.
  deidentification_details: >-
    De-identification is applied as part of the standardization pipeline before data are made
    available in the controlled-access enclave; imaging de-identification was still in progress for
    the larger cohort as of August 2025, with 1,000 images available at that point.
  source_caveats: >-
    The sources do not enumerate which identifier categories are removed, nor report a residual
    re-identification risk assessment.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset is built from protected health information of critically ill patients:
      demographics, diagnoses, procedures, medication administration, nursing flowsheets, clinical
      notes, radiology images, telemetry waveforms and EEG waveforms.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Social determinants of health and geographic contextual factors, such as distance to the
      nearest hospital derived by geocoding OMOP Location entities, are attached to records.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Clinical notes are not released: they are stored locally at contributing sites and only
      tokens derived from them are placed in the enclave. Every listed data type — demographics,
      medication administration, procedures, nursing flowsheets, diagnoses, note tokens, imaging,
      telemetry waveforms and EEG waveforms — is designated controlled access.

human_subject_research:
  involves_human_subjects: true
  special_populations: >-
    Critically ill patients, including pediatric patients admitted to PICU and neonates admitted
    to NICU.
  source_caveats: >-
    Human subject involvement follows from the retrospective use of hospital clinical records from
    critically ill patients. The figure of more than 100,000 critically ill patients appears in the
    NIH abstract as an acquisition target rather than a current holding. No IRB approval, protocol
    number or approving board is named in any source, and the sources do not state whether records
    were identifiable at the point of extraction.

ethical_reviews:
  - review_details: >-
      Ethics is one of the three pillars of the CHoRUS data generation project (Ethical and
      Trustworthy AI). The consortium performs community-facing ethics focus groups to determine
      what data are appropriate for public sharing, evaluates community perspectives on clinical
      care AI to increase trustworthiness of provenance and privacy, establishes a legal framework
      for collecting data at scale, and analyses the existing legal and regulatory landscape.
    source_caveats: >-
      No institutional review board, ethics committee or other reviewing organization is named in
      the available sources, and no approval identifier is reported; the activities recorded here
      are the project's own ethics workstream rather than an external review of the dataset.

data_governance:
  accountable_organization:
    id: https://chorus4ai.org/organization/massachusetts-general-hospital
    name: Massachusetts General Hospital
  committee_contact:
    id: https://chorus4ai.org/person/ciera-mccrary
    name: Ciera McCrary
  access_review_process: >-
    The dataset is controlled access. Prospective users request access by contacting the CHoRUS
    access contacts (dbold@emory.edu or jared.houghtaling@tuftsmedicine.org). Within the AIM-AHEAD
    Bridge2AI for Clinical Care Training Program, participants complete a registration form giving
    name, email and institution and sign a licensing agreement included in the registration form
    before gaining access; a ".edu" email address is required to gain access to the dataset, and
    program administrators assist with this access where needed. Once access is granted and compute
    is provisioned, the user is notified by email.
  stewardship_roles: >-
    Program management is based at Massachusetts General Hospital (Ciera McCrary, Program Manager);
    access requests are handled by CHoRUS leads at Emory University and Tufts Medicine; site data
    managers at the 14 data acquisition centers steward the extraction and curation of their own
    contributions; Standards, Data Acquisition and Tooling sub-teams maintain the shared SOPs,
    mappings and software.
  notes: >-
    The program manager contact address is given on chorus4ai.org as "cmccrary@mgh.havard.edu";
    the domain appears to contain a typographical error in the source and is reproduced here as
    transcribed rather than corrected.

license_and_use_terms:
  contact_person:
    id: mailto:jared.houghtaling@tuftsmedicine.org
    name: Jared Houghtaling
  license_terms: >-
    Access is controlled and all users must sign a licensing agreement before gaining access to the
    dataset; access in the training program additionally requires a ".edu" email address. The
    chorus-ai software organization is licensed under the MIT License (the Chorus_SOP documentation
    repository is Apache-2.0), which governs the tooling rather than the clinical data.
  source_caveats: >-
    No named data licence (for example a Creative Commons or PhysioNet credentialed licence) is
    given for the dataset itself; the MIT statement appears in the chorus-ai GitHub README and
    applies to code.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions: >-
    All nine data types are designated controlled access and are worked with inside a cloud
    enclave; a signed licensing agreement is a precondition of access. The CHoRUS public repository
    web page states that it is under review for potential modification in compliance with
    Administration directives.

distribution_formats:
  - format: >-
      OMOP Common Data Model tables covering demographics, medication administration, procedures,
      nursing flowsheets (OMOP schema with extensions) and diagnoses
    notes: Delivered through the controlled-access cloud enclave rather than by direct download.
  - format: OHNLP-tokenized clinical note derivatives following the OHNLP open-source schema
    notes: Delivered through the controlled-access cloud enclave rather than by direct download.
  - format: DICOM imaging exported from hospital PACS
    notes: Delivered through the controlled-access cloud enclave rather than by direct download.
  - format: WFDB waveform telemetry files following the extended PhysioNet schema
    notes: Delivered through the controlled-access cloud enclave rather than by direct download.
  - format: EEG waveforms in EDF+ and Persyst formats
    notes: Delivered through the controlled-access cloud enclave rather than by direct download.

existing_uses:
  - examples: >-
      CHoRUS datasets are being used for training activities and publications, as reported in the
      August 2025 dataset overview.
  - examples: >-
      The dataset underpins the AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2,
      program start 17 November 2025 to 31 July 2026), in which up to 30 trainees carry out
      hands-on AI/ML work — Jupyter notebooks, the OHDSI tool stack, the OHDSI/OMOP common data
      model, clinical deep learning and generative AI use cases — on the Bridge2AI AI/ML for
      Clinical Care Collaborative Cloud, producing posters, conference abstracts and manuscripts.

intended_uses:
  - use_category: Machine learning model development for acute and critical care
    examples: >-
      Characterizing acute and critical care illness, predicting complications and deterioration,
      and measuring treatment response among patients with acute or critical illness.
    usage_notes: >-
      The dataset was assembled specifically to be AI-ready and multi-modal at high resolution
      across 14 hospitals.
  - use_category: External validation of AI models
    examples: >-
      Validating externally developed models against the sequestered CHoRUS holdout test set to
      support marketplace adoption of AI-derived models in acute and critical care.
  - use_category: AI/ML education and workforce development
    examples: >-
      Foundational hands-on training in the CHoRUS ecosystem, including structured EHR datasets,
      ML for clinical applications, clinical deep learning, ethics of clinical AI, and data schemas
      in the clinical cloud.
  - use_category: Research on contextual and social determinants of health
    examples: >-
      Analyses that make use of contextual data elements such as geographic distance to the nearest
      hospital and other social determinants of health attached to clinical records.

other_tasks:
  - task_details: >-
      Downstream analytics on the mapped and assembled dataset by clinical collaborators, who are
      invited to get involved through the CHoRUS contact channels.
  - task_details: >-
      Methodological work on semantic mapping and clinical validation, using the pooled tabular
      mappings and clinical validation SOP in the chorus-mapping repository.

future_use_impacts:
  - impact_details: >-
      The project's overarching goal is that the methods used to build and share the dataset
      promote privacy, accountability and clinical benefit while cultivating a new generation of AI
      clinicians and scientists; community-facing ethics focus groups determine which data are
      appropriate for public sharing, and patient-focused legal and ethical work addresses privacy
      and bias while accounting for social determinants of health.
  - impact_details: >-
      By sequestering holdout data for external validation, the project anticipates supporting
      trustworthy assessment of models before implementation in acute and critical care settings.

