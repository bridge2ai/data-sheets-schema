extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    The chorus-ai GitHub organization hosts 28 repositories with software and tooling, validated
    semantic mappings, standard operating procedures for contributing sites, and project management
    boards. Contributing sites follow the interactive workflow diagram in Chorus_SOP and raise
    problems in the Standards Discussions or Data Acquisition Discussions spaces. Clinical
    collaborators contribute pooled tabular mappings via the chorus-mapping repository under a
    clinical validation SOP. Sites submit regular status updates either through the GitHub
    interface or through a Google Form, whose submissions trigger a GoogleScript that calls the
    GitHub API to update status and issue information in the Standards Project or Data Acquisition
    Project boards.

updates:
  update_details: >-
    The dataset is being expanded from the current release toward an anticipated final dataset of
    100,000 patient admissions across 9 data modalities from 14 contributing hospitals. As of
    August 2025, de-identification was in process for a larger imaging cohort, EEG extraction was
    in process, and metadata were planned for clinical notes, imaging and waveform EEG.
  source_caveats: >-
    No versioning policy, release cadence or scheduled update dates are stated in the sources.

