purposes:
  - response: >-
      Generate a publicly available, AI-ready critical care dataset for machine learning and
      artificial intelligence applications aimed at characterizing acute and critical care
      illness, predicting complications, and measuring treatment response among patients with
      acute or critical illness.
  - response: >-
      Provision a holdout test set accessible for external validation of models, to aid
      marketplace adoption of AI-derived models for implementation in acute and critical care.
  - response: >-
      Develop the network, tools, standards, data and education needed to build ML/AI-derived
      models that improve the care and outcomes of patients requiring critical care, while
      ensuring methods promote privacy, accountability and clinical benefit.
  - response: >-
      As one of four Bridge2AI data generation projects, create ethically sourced datasets and
      tools around artificial intelligence and establish best practices for AI in health.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support AI/ML in critical care; developing
      high-resolution multi-center data sets is a critical first step towards actionable and
      trustworthy AI.
  - response: >-
      Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready data set
      able to address the grand challenge of improving recovery from acute illness.
  - response: >-
      Community perspectives on what clinical data are appropriate for public sharing, and the
      legal and regulatory framework for collecting critical care data at scale, had not been
      established; CHoRUS conducts community-facing ethics focus groups and legal analysis to
      close that gap.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among critically ill patients.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: External validation of AI/ML models against a sequestered holdout dataset.
  - response: >-
      Labeling of data with targets important for prediction through a visualization and
      annotation environment.

