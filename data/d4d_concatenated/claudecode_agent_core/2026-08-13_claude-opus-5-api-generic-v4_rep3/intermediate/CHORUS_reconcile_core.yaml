notes: >-
  The CHoRUS public repository web page carries the banner "This repoitory is under review for
  potential modification in compliance with Administration directives" (spelling as in the source).
  As of the August 2025 description, imaging de-identification for a larger cohort and EEG
  extraction were still in process, and metadata for clinical notes, imaging and waveform EEG were
  listed as planned.

source_caveats: >-
  The four sources disagree on the size of the released data. The Cohort 2 webinar states that, as
  of August 2025, the dataset covered 14 different hospitals with over 45,000 unique admissions and
  that roughly 1,000 images were available with de-identification in process; chorus4ai.org
  describes a current released dataset of 50,000 patient admissions with 7,642 admissions carrying
  radiology data, 1.6 billion rows of EHR OMOP data and 23 Tb of waveform data. Both figures are
  recorded here rather than reconciled, and neither source is dated on the website. The NIH
  abstract refers to acquiring an AI-ready data set from more than 100,000 critically ill patients,
  while chorus4ai.org gives 100,000 patient admissions as the anticipated final figure — patients
  and admissions are not necessarily interchangeable units, and both are targets rather than
  current holdings. The "9 different data modalities" cited by the website corresponds to the nine
  rows of the webinar's data type table. The waveform volume is written "23 Tb" in the source and
  it is not clear whether terabits or terabytes are meant, so no byte count is recorded. The
  program manager email transcribed from the website reads "cmccrary@mgh.havard.edu", which appears
  to contain a typographical error in the domain, so it is recorded as a note rather than as a
  resolvable identifier. Person and organization identifiers used in this record are minted from
  the project domain; the sources supply no persistent identifiers for individuals or institutions.
  The MIT licence statement comes from the chorus-ai GitHub README and covers the software
  organization; the sources state no licence for the clinical data beyond a required licensing
  agreement, so the dataset-level license slot is left unpopulated. Physical storage substrates for
  the OMOP-standardized components are not described in any source, so data_substrate is recorded
  only where a source names a format. The repository CTP-deid appears in the GitHub listing with no
  description and is therefore not classified as a de-identification tool here.