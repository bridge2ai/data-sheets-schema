id: https://chorus4ai.org/dataset
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multi-center, multi-modal, high-resolution critical care dataset generated by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH Common Fund Bridge2AI program. The
  CHoRUS Network spans 20 academic centers, of which 14 contribute as data acquisition centers,
  and comprises more than 60 consortium members. The dataset assembles retrospectively collected
  clinical data around patient admissions and covers nine data modalities: demographics,
  medication administration (time-stamped at each infusion change or dose administration),
  procedures, nursing flowsheets (high-frequency documentation), diagnoses, clinical notes
  (extracted and tokenized with the OHNLP toolkit), radiology imaging from hospital PACS,
  waveform telemetry from bedside monitors and gateway/middleware, and EEG waveforms from
  hospital databases. Structured data are standardized to the OMOP Common Data Model; imaging
  uses DICOM; telemetry uses WFDB with an extended PhysioNet schema; EEG uses EDF+ and Persyst.
  The project website describes a current released dataset of 50,000 patient admissions from
  ICU, PICU and NICU containing 1.6 billion rows of EHR OMOP data, 7,642 admissions with
  radiology data and 23 Tb of waveform data, with an anticipated final dataset of 100,000
  patient admissions across nine modalities from 14 contributing hospitals. All modalities are
  under controlled access and are worked with inside a cloud enclave (CHoRUS services are
  deployed on Azure via containerized applications), with clinical notes retained locally at
  contributing sites so that only derived tokens reach the enclave. The dataset also provisions
  a sequestered holdout test set for external validation of models.
page: https://chorus4ai.org/
publisher: https://chorus4ai.org/organization/massachusetts-general-hospital
status: partially released; acquisition and curation ongoing
is_tabular: false
conforms_to: >-
  Structured electronic health record data (demographics, medication administration, procedures,
  nursing flowsheets, diagnoses) are standardized to the OMOP Common Data Model, with OMOP schema
  extensions used for nursing flowsheets; imaging from PACS follows DICOM; waveform telemetry
  follows WFDB with the PhysioNet schema extended; EEG waveforms use the open-source EDF+ and
  Persyst schemas; extracted and tokenized clinical notes follow the OHNLP open-source schema.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: CoreDataset
