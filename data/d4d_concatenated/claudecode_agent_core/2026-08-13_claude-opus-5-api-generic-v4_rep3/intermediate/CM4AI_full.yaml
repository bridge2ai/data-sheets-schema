sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Targeted selection of a shared protein panel: 100 chromatin modifiers and 100
      metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders, profiled
      across all cell types and treatment conditions to achieve matched multi-modal
      coverage. The immunofluorescence panel was extended with interactors and key signaling
      molecules, and further proteins were to be added conditional on significant hits from
      the genetic perturbation and PPI results.
    why_not_representative: >-
      The panel was chosen for disease relevance rather than to represent the proteome; the
      CRISPRi screens in KOLF2.1J iPSCs were subsequently extended to genome scale, covering
      11,739 targeted genes.
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Selection of two ethically sourced, disease-relevant human cell lines and a small set
      of conditions: MDA-MB-468 untreated or treated with paclitaxel or vorinostat, and
      KOLF2.1J iPSCs undifferentiated or differentiated into neural progenitor cells,
      neurons and cardiomyocytes.
    why_not_representative: >-
      Two cell lines from two donors cannot represent the biological variation present in
      the human population.

instances:
  - instance_type: >-
      Immunofluorescence confocal microscopy image of MDA-MB-468 cells, four channels
      (protein of interest, nucleus, endoplasmic reticulum, microtubules)
    data_substrate: B2AI_SUBSTRATE:56
    data_topic: B2AI_TOPIC:19
    counts: 53788
    label: false
    source_caveats: >-
      The count of 53,788 immunofluorescent images is the project-wide figure reported on
      the CM4AI portal and is not scoped to a single release. The June 2026 release contains
      three image archives covering 464 proteins of interest under untreated, paclitaxel and
      vorinostat conditions.
  - instance_type: >-
      Size exclusion chromatography mass spectrometry protein elution profile
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:28
    label: false
    notes: >-
      SEC-MS in MDA-MB-468 cells identified 72 of the 100 chromatin modifiers of interest,
      52 of them as integral components of protein complexes, and detected interaction
      profiles for over a thousand complexes; more than 700 protein complexes were
      uncovered in parental KOLF2 iPSCs and in differentiated neurons.
  - instance_type: >-
      Affinity purification mass spectrometry bait-prey protein interaction record from
      endogenously tagged MDA-MB-468 cells
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:26
    label: false
  - instance_type: >-
      Single-cell CRISPRi perturbation transcriptional profile
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
    label: false
    notes: >-
      CRISPRi screens were extended to an expressed genome-scale perturbation cell atlas in
      KOLF2.1J iPSCs mapping transcriptional and fitness phenotypes for 11,739 targeted
      genes; the targeted screens use a lentiviral library with six guide RNAs per gene.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Donor demographic information is available only through the provenance of the two
      source cell lines. MDA-MB-468 was established from a metastatic site pleural effusion
      of a 51-year-old Black female with metastatic mammary adenocarcinoma. KOLF2.1J was
      derived from a healthy male Northern European donor.
    distribution: >-
      Every measurement in the release derives from one of these two donors; the breast
      cancer arm of the release (immunofluorescence images, AP-MS, and the MDA-MB-468 SEC-MS
      and perturb-seq data) derives from the first, and the iPSC arm (KOLF2.1J
      undifferentiated, neural progenitor, neuron and cardiomyocyte data) from the second.

relationships:
  - relationship_details: >-
      Cell maps are hierarchical directed acyclic graphs in which each node is an assembly
      of proteins in proximity at a given scale and each directed edge expresses containment
      of a smaller assembly by a larger one, spanning from cell compartments such as nucleus
      and mitochondria down to protein complexes and subunits.
  - relationship_details: >-
      Individual proteins are the linking entity across modalities: a protein may appear in
      the interaction data, the localization images and the perturbation screens, but the
      protein sets interrogated by the three modalities overlap incompletely.

missing_data_documentation:
  - missing_data_patterns: >-
      Protein-protein interaction (SEC-MS), protein localization (immunofluorescence
      imaging) and CRISPRi perturb-seq data interrogate sets of proteins which incompletely
      overlap, so many proteins are present in some modalities and absent from others.
    missing_data_causes: >-
      Differences in assay coverage, antibody availability and gene-panel scope between the
      three mapping approaches.
  - missing_data_patterns: >-
      Computed cell maps are absent from this release, and some component datasets are not
      yet present in completed final form.
    missing_data_causes: >-
      The release is an interim Beta; some datasets remain under temporary pre-publication
      embargo, notably the perturb-seq raw data for KOLF2.1J iPSCs and for MDA-MB-468 cells.
    handling_strategy: >-
      Missing components are scheduled for inclusion in subsequent quarterly releases
      through the end of the project.

preprocessing_strategies:
  - preprocessing_details: >-
      Protein-protein interaction networks are processed with the node2vec deep learning
      model to reduce dimensionality, producing a PPI embedding per protein that encodes its
      interaction neighbourhood.
  - preprocessing_details: >-
      Immunofluorescence images are processed with a Human Protein Atlas deep learning model
      to reduce dimensionality, producing an image embedding per protein that encodes its
      subcellular localization.
  - preprocessing_details: >-
      The PPI and image embeddings are integrated into a per-protein co-embedding using
      contrastive deep learning, so that the original embeddings can be reconstructed with
      minimal information loss and proteins with similar PPI and image embeddings receive
      similar co-embeddings.
  - preprocessing_details: >-
      Community detection is performed on the all-by-all similarities of protein pairs in
      the co-embedding space at multiple resolutions, and the resulting hierarchy of protein
      communities is output as the cell map.

cleaning_strategies:
  - cleaning_details: >-
      Single-cell CRISPR screen outputs undergo quality control before release. The
      FAIRSCAPE client package is invoked at each pipeline segment to validate inputs
      against declared JSON-Schema descriptions before the segment's RO-Crate output package
      is assembled.

labeling_strategies:
  - labeling_details: >-
      Cell map assemblies are aligned to known protein function and pathway resources,
      including the Gene Ontology and Reactome, to identify assemblies with high overlap
      with known cell biology.
    data_annotation_protocol: >-
      Alignment of assembly protein sets against curated reference component sets, performed
      by the cellmaps_hierarchyeval component of the Cell Mapping Toolkit.
  - labeling_details: >-
      Assemblies are annotated using a large language model approach developed by the
      project to name sets of proteins and assign a name confidence score.
    data_annotation_protocol: >-
      An engineered prompt guides the language model to generate a descriptive name for each
      assembly together with a self-assessed confidence score.

machine_annotation_tools:
  - tools: >-
      Large language model gene-set naming pipeline; node2vec; Human Protein Atlas image
      classification deep learning model; contrastive multimodal co-embedding model;
      hierarchical community detection.
    tool_descriptions: >-
      The language model pipeline generates descriptive names and confidence scores for
      protein assemblies. node2vec produces protein interaction embeddings and the Human
      Protein Atlas convolutional model produces image embeddings; these are fused by a
      contrastive co-embedding model and partitioned by multi-resolution community detection
      to yield the assembly hierarchy annotated in the preceding steps.

