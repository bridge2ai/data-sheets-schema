name: CM4AI
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge2AI program. The project produces
  ethical, AI-ready datasets of human cell architecture, inferred from multimodal
  interrogation of disease-relevant human cell lines, and delivers machine-readable
  hierarchical maps of cell architecture together with quarterly releases of the map-input
  data streams. Cell maps are hierarchical directed acyclic graphs in which each node
  represents an assembly of proteins in proximity at a given scale, spanning from large
  assemblies representing cell compartments (for example nucleus, mitochondria) to small
  assemblies such as protein complexes or subunits.


  Data are generated in two ethically sourced cell lines: the triple-negative breast cancer
  line MDA-MB-468 (RRID:CVCL_0419), untreated or treated with paclitaxel or vorinostat; and
  the induced pluripotent stem cell line KOLF2.1J (RRID:CVCL_B5P3), undifferentiated or
  differentiated into neural progenitor cells, neurons and cardiomyocytes. Three
  complementary mapping approaches are applied: mass-spectrometry-based proteomics for
  protein-protein interactions (affinity purification mass spectrometry, AP-MS; and size
  exclusion chromatography mass spectrometry, SEC-MS), spatial proteomics by
  immunofluorescence confocal imaging for protein subcellular localization, and single-cell
  CRISPRi genetic perturbation screens (perturb-seq).


  Input data streams are integrated by the Multi-Scale Integrated Cell (MuSIC) software
  pipeline, which embeds each modality separately using deep learning, fuses the embeddings
  by contrastive learning into a joint co-embedding, and applies multi-resolution community
  detection to yield a hierarchy of protein assemblies. Output data are packaged with
  provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using a
  client-server implementation of the FAIRSCAPE framework, which assigns persistent ARK
  identifiers resolving to human- and machine-readable landing pages.


  The June 2026 Beta release comprises perturb-seq data for MDA-MB-468 cells with and
  without treatment and for undifferentiated KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468
  cells with and without treatment and for undifferentiated KOLF2.1J iPSCs and iPSC-derived
  neural progenitor cells, neurons and cardiomyocytes; AP-MS data for treated MDA-MB-468
  cells; and immunofluorescence images for MDA-MB-468 cells with and without treatment.
  Computed cell maps are not included in this release.
