updates:
  frequency: quarterly
  update_details: >-
    The dataset is regularly updated and augmented through the end of the project in
    November 2026, with quarterly releases of cell maps and of the map-input data streams.
    Each release is deposited as a separate versioned Dataverse record.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
