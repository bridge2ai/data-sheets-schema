notes: >-
  The CM4AI project is organized into three pillars (Data, People and Ethics) implemented as
  six modules: Data Acquisition, Tools and Standards under Data; Skills and Workforce
  Development and Teaming under People; and Ethics. It is a collaboration of UCSD, UCSF,
  Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University and the Hastings
  Center.


  Aggregate figures reported on the CM4AI portal across the project as a whole, rather than
  for this or any single release, include a total data volume of 21.4 TB, 7,023 total
  proteins investigated, 11,739 genes targeted, 53,788 immunofluorescent images and 1,374
  protein interactions. The release comprises ten files.


  Recommended citation: Clark T; Parker J; Al Manir S; Axelsson U; Ballllosero Navarro F;
  Chinn B; Churas CP; Dailamy A; Doctor Y; Fall J; Forget A; Gao J; Hansen JN; Hu M;
  Johannesson A; Khaliq H; Lee YH; Lenkiewicz J; Levinson MA; Marquez C; Metallo C;
  Muralidharan M; Nourreddine S; Niestroy J; Obernier K; Pan E; Polacco B; Pratt D; Qian G;
  Schaffer L; Sigaeva A; Thaker S; Zhang Y; Belisle-Pipon JC; Brandt C; Chen JY; Ding Y;
  Fodeh S; Krogan N; Lundberg E; Mali P; Payne-Foster P; Ratcliffe S; Ravitsky V; Sali A;
  Schulz W; Ideker T, 2026, "Cell Maps for Artificial Intelligence - June 2026 Data Release
  (Beta)", https://doi.org/10.18130/V3/HIGT4C, University of Virginia Dataverse, V2.
  CoreDataset declares no citation slot, so the recommended citation is recorded here.

source_caveats: >-
  This record describes the June 2026 Beta release identified by doi:10.18130/V3/HIGT4C.
  Where slots necessarily describe the enclosing CM4AI project rather than this release
  alone — purposes, addressing_gaps, tasks, funders, collection_mechanisms, maintainers,
  updates — that scope is stated in the slot.


  The Nature 2025 publication included in the input bundle reports a multimodal cell map of
  U2OS osteosarcoma cells built by an overlapping group of investigators with partial
  Bridge2AI support. U2OS is not one of the CM4AI cell lines, and none of that study's
  quantitative findings, protein counts or assembly counts are attributed to this dataset
  here; it is recorded only as a related external resource and methodological antecedent.


  The MuSIC embedding, co-embedding, community-detection, hierarchy-annotation and
  structure-modelling steps described in preprocessing_strategies, labeling_strategies,
  machine_annotation_tools, tasks and other_tasks operate downstream of the data streams in
  this release and produce computed cell maps, which the release explicitly does not
  contain. Each such slot states this.


  The CM4AI portal lists the June 2026 Data Release with a release date of June 17, 2025,
  whereas the University of Virginia Dataverse record for the same DOI gives a publication
  date of 2026-06-17; the Dataverse value is used.


  Release documentation states that updates continue through the end of the project in
  November 2026, while NIH RePORTER records a project end date of 2026-08-31.


  Counts reported on the CM4AI portal (protein interactions, immunofluorescent images, total
  proteins investigated, genes targeted, data volume) are project-wide and are not scoped to
  this release; they appear only in notes, not in instances.


  created_on and the Dataverse data creation date are 2025-02-27, carried forward unchanged
  from the March 2025 deposit; last_updated_on is the 2026-07-15 publication date of the
  three immunofluorescence image files within this record. Neither is a dataset-level
  modification timestamp stated as such in the bundle.


  Creator entities are minted from ORCID identifiers where the Dataverse author list supplies
  them; eight contributors (Axelsson, Chinn, Fall, Johannesson, Khaliq, Muralidharan, Pan,
  Polacco, Zhang) have no ORCID in the bundle and carry placeholder urn identifiers. Given
  names for several contributors are recorded in the bundle only as initials and are
  reproduced as such. Organization identifiers are ROR identifiers where the organization is
  unambiguous; the Hastings Center carries a placeholder urn.


  was_derived_from admits a single scalar resource and names the MDA-MB-468 cell line
  (Cellosaurus CVCL_0419). The second source line, KOLF2.1J (RRID:CVCL_B5P3, obtained from
  the HipSci resource), is recorded in description and subpopulations.


  CREDiT roles are asserted only where the bundle states a role directly: Ideker as
  corresponding author and NIH principal investigator, Thaker as program manager, Niestroy as
  depositor, and the Krogan and Lundberg laboratories as data generators. The Contributions
  section available in the bundle belongs to the U2OS Nature study and was not used.


  Byte sizes are omitted from the distributions because the per-file sizes shown in the
  repository are rounded to one decimal place.


  No download_url is asserted: the bundle supplies the Dataverse Data Access API base
  (https://dataverse.lib.virginia.edu/api/access/datafile/), which is a template requiring a
  per-file identifier rather than a direct download URL for the dataset.