      on the specific data package. The ShareAlike condition requires derivative works to be
      distributed under the same license. CM4AI integration and packaging software is
      separately licensed under nonrestrictive open-source terms: the Tools data integration
      pipeline under BSD-3 and the FAIRSCAPE framework under the MIT License, with FAIRSCAPE
      copyright held by the Rector and Board of Visitors of the University of Virginia.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: not_applicable
  regulatory_restrictions:
    - >-
      The release records that the data do not involve human subjects and are not FDA
      regulated, and that samples are de-identified. No export-control restrictions are
      stated. Access to the deposited files is public, but reuse is bounded by the
      NonCommercial and ShareAlike license conditions, by Data Access Committee supervision
      of distribution and potential dual licensing, and by temporary pre-publication embargo
      on some linked external components.
  governance_committee_contact: Jillian Parker
  source_caveats: >-
    HIPAA is recorded as not applicable because the dataset does not involve human subjects
    and derives from de-identified cell lines. The confidentiality level is recorded as
    restricted rather than unrestricted because commercial reuse is prohibited and a Data
    Access Committee supervises distribution, notwithstanding public file access.

collection_mechanisms:
  - mechanism_details: >-
      Affinity purification mass spectrometry (AP-MS) on endogenously tagged cell lines,
      used to map protein-protein interactions of chromatin regulators under different
      treatment conditions.
  - mechanism_details: >-
      Size exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
      complex and interaction mapping, applied as an orthogonal mass-spectrometry approach
      to AP-MS.
  - mechanism_details: >-
      Immunofluorescence-based staining (ICC-IF) with Human Protein Atlas antibodies
      followed by confocal microscopy for spatial proteomics. Automated fixation and
      permeabilization protocols were established on a pipetting robot for the MDA-MB-468
      and KOLF2 cell lines. Nuclei are stained with DAPI (blue channel), endoplasmic
      reticulum with a calreticulin antibody (yellow channel), microtubules with a tubulin
      antibody (red channel), and the protein of interest in the green channel.
  - mechanism_details: >-
      Single-cell CRISPR interference perturbation screens using a CRISPR lentiviral library
      with six guide RNAs per gene in cell lines expressing inducible dCas9, read out with
      the 10x Genomics 3'HT kit.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: false
    acquisition_details: >-
      Primary measurements were generated directly in cell culture by the project
      laboratories: mass spectrometry of cellular extracts and affinity purifications,
      confocal imaging of fixed and immunostained cells, and single-cell sequencing of
      CRISPRi-perturbed populations. All data streams in this release are of this kind.
  - was_inferred_derived: true
    acquisition_details: >-
      Hierarchical cell maps are derived computationally from the primary measurements by
      the MuSIC pipeline through modality-specific embedding, contrastive co-embedding and
      multi-resolution community detection. No such derived maps are present in this
      release.

data_collectors:
  - collector_details: >-
      Krogan Laboratory, University of California San Francisco: generation of AP-MS and
      SEC-MS protein-protein interaction data in MDA-MB-468 cells and in KOLF2.1J iPSCs and
      their derivatives, and maintenance of the PPI deposition archive consumed by the MuSIC
      pipeline.
    role: academic_institution
  - collector_details: >-
      Lundberg Laboratory, Stanford University: generation of immunofluorescence confocal
      microscopy images for spatial proteomics mapping, and maintenance of the image
      deposition archive consumed by the MuSIC pipeline.
    role: academic_institution
  - collector_details: >-
      University of California San Diego: design and execution of the single-cell CRISPRi
      perturbation screens, and design, generation and characterization of the MDA-MB-468
      and KOLF2 CRISPR lines expressing inducible dCas9.
    role: academic_institution
  - collector_details: >-
      University of Virginia: AI-readiness packaging of data, software, metadata and
      provenance graphs using the FAIRSCAPE client and server framework, and deposition into
      the LibraData archive.
    role: academic_institution

collection_timeframes:
  - timeframe_details: >-
      The bundle does not state when the measurements in this release were collected. The
      funded project period recorded by NIH RePORTER for core project OT2OD032742 runs from
      2022-09-01 to 2026-08-31, and the release documentation states that updates continue
      through the end of the project in November 2026. The Dataverse record gives a data
      creation date and deposit date of 2025-02-27, both carried forward unchanged from the
      March 2025 deposit.
    source_caveats: >-
      No start_date or end_date is asserted because the bundle supplies an award period and
      a repository deposit date, neither of which is a data collection window. The award end
      date (2026-08-31) and the stated project end (November 2026) also disagree.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Targeted selection of a shared protein panel: 100 chromatin modifiers and 100
      metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders, profiled
      across all cell types and treatment conditions to achieve matched multi-modal
      coverage. The immunofluorescence panel was extended with interactors and key signaling
      molecules, and further proteins were to be added conditional on significant hits from
      the genetic perturbation and PPI results.
    why_not_representative: >-
      The panel was chosen for disease relevance rather than to represent the proteome; the
      CRISPRi screens in KOLF2.1J iPSCs were subsequently extended to expressed genome
      scale, covering 11,739 targeted genes.
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Selection of two ethically sourced, disease-relevant human cell lines and a small set
      of conditions: MDA-MB-468 untreated or treated with paclitaxel or vorinostat, and
      KOLF2.1J iPSCs undifferentiated or differentiated into neural progenitor cells,
      neurons and cardiomyocytes.
    why_not_representative: >-
      Two cell lines from two donors cannot represent the biological variation present in
      the human population.

instances:
  - instance_type: >-
      Immunofluorescence confocal microscopy image of MDA-MB-468 cells, four channels
      (protein of interest, nucleus, endoplasmic reticulum, microtubules)
    data_substrate: B2AI_SUBSTRATE:56
    data_topic: B2AI_TOPIC:19
    label: false
    notes: >-
      Three image archives in this release cover 464 proteins of interest under untreated,
      paclitaxel and vorinostat conditions. The bundle does not state a per-release image
      count.
  - instance_type: >-
      Size exclusion chromatography mass spectrometry protein elution profile
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:28
    label: false
    notes: >-
      SEC-MS in MDA-MB-468 cells identified 72 of the 100 chromatin modifiers of interest,
      52 of them as integral components of protein complexes, and detected interaction
      profiles for over a thousand complexes; more than 700 protein complexes were
      uncovered in parental KOLF2 iPSCs and in differentiated neurons.
  - instance_type: >-
      Affinity purification mass spectrometry bait-prey protein interaction record from
      endogenously tagged MDA-MB-468 cells
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:28
    label: false
  - instance_type: >-
      Single-cell CRISPRi perturbation transcriptional profile
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
    counts: 11739
    label: false
    notes: >-
      The count is the number of genes targeted by the expressed genome-scale CRISPRi
      perturbation cell atlas in KOLF2.1J iPSCs, which maps transcriptional and fitness
      phenotypes for each. The targeted MDA-MB-468 screens use a lentiviral library with six
      guide RNAs per gene against a 100-gene chromatin regulator panel.

subpopulations:
  - subpopulation_elements_present: false
    identification: >-
      The dataset contains no human subpopulations. Donor demographic information exists
      only as provenance of the two source cell lines: MDA-MB-468 was established from a
      metastatic site pleural effusion of a 51-year-old Black female with metastatic mammary
      adenocarcinoma, and KOLF2.1J was derived from a healthy male Northern European donor.
    distribution: >-
      Every measurement derives from one of these two donors. The breast cancer data streams
      (immunofluorescence images, AP-MS, and the MDA-MB-468 SEC-MS and perturb-seq data)
      derive from the first; the iPSC data streams (KOLF2.1J undifferentiated, neural
      progenitor, neuron and cardiomyocyte SEC-MS and the KOLF2.1J perturbation atlas)
      derive from the second.

missing_data_documentation:
  - missing_data_patterns: >-
      Protein-protein interaction (SEC-MS), protein localization (immunofluorescence
      imaging) and CRISPRi perturb-seq data interrogate sets of proteins which incompletely
      overlap, so many proteins are present in some modalities and absent from others.
    missing_data_causes: >-
      Differences in assay coverage, antibody availability and gene-panel scope between the
      three mapping approaches.
  - missing_data_patterns: >-
      Computed cell maps are absent from this release, and some component datasets are not
      yet present in completed final form.
    missing_data_causes: >-
      The release is an interim Beta; some datasets remain under temporary pre-publication
      embargo, notably the perturb-seq raw data for KOLF2.1J iPSCs and for MDA-MB-468 cells.
    handling_strategy: >-
      Missing components are scheduled for inclusion in subsequent quarterly releases
      through the end of the project.

anomalies:
  - anomaly_details: >-
      Immunofluorescence image coverage differs between releases. The March 2025 release
      archives describe the spatial localization of 563 proteins of interest in MDA-MB-468
      cells, whereas the June 2025, October 2025 and June 2026 archives describe 464. The
      bundle does not state why the number changed.

preprocessing_strategies:
  - preprocessing_details: >-
      Mass spectrometry, imaging and single-cell sequencing outputs are assembled into
      per-stream RO-Crate packages by the FAIRSCAPE client, which validates inputs against
      declared JSON-Schema descriptions and attaches provenance graphs, before registration
      on the FAIRSCAPE server and assignment of persistent ARK identifiers.
  - preprocessing_details: >-
      The following steps are applied by the project's MuSIC pipeline to produce cell maps
      from these data streams, and are not represented in this release, which contains no
      computed maps. Protein-protein interaction networks are processed with the node2vec
      deep learning model to produce a PPI embedding per protein; immunofluorescence images
      are processed with a Human Protein Atlas deep learning model to produce an image
      embedding per protein; the two embeddings are integrated into a per-protein
      co-embedding using contrastive deep learning; and community detection is performed on
      the all-by-all similarities of protein pairs in the co-embedding space at multiple
      resolutions to yield a hierarchy of protein communities.

cleaning_strategies:
  - cleaning_details: >-
      The FAIRSCAPE client package is invoked at each pipeline segment to validate inputs
      against declared JSON-Schema descriptions before the segment's RO-Crate output package
      is assembled.
  - cleaning_details: >-
      Single-cell CRISPR screen outputs undergo quality control before release.
    source_caveats: >-
      The bioRxiv preprint states that the Year 1 single-cell CRISPR screen data were
      undergoing QC at the time of writing; it does not describe the QC procedure or its
      completion for the data in this release.

labeling_strategies:
  - labeling_details: >-
      Cell map assemblies are aligned to known protein function and pathway resources,
      including the Gene Ontology and Reactome, to identify assemblies with high overlap
      with known cell biology.
    data_annotation_protocol: >-
      Alignment of assembly protein sets against curated reference component sets, performed
      by the cellmaps_hierarchyeval component of the Cell Mapping Toolkit. This annotates
      computed cell maps, which are not part of this release.
  - labeling_details: >-
      Assemblies are annotated using a large language model approach developed by the
      project to name sets of proteins and assign a name confidence score.
    data_annotation_protocol: >-
      An engineered prompt guides the language model to generate a descriptive name for each
      assembly together with a self-assessed confidence score. This annotates computed cell
      maps, which are not part of this release.

machine_annotation_tools:
  - tools:
      - Large language model gene-set naming pipeline
      - node2vec
      - Human Protein Atlas image classification deep learning model
      - contrastive multimodal co-embedding model
      - hierarchical community detection
    tool_descriptions: >-
      node2vec produces protein interaction embeddings and the Human Protein Atlas
      convolutional model produces image embeddings; these are fused by a contrastive
      co-embedding model and partitioned by multi-resolution community detection to yield an
      assembly hierarchy, which the language model pipeline then names with a confidence
      score. These tools operate downstream of the data streams released here and produce
      cell maps that this release does not contain.

