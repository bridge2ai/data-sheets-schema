purposes:
  - response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the
      grand challenge of interpretable genotype-phenotype learning.
  - response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
      produced from multimodal interrogation of chromatin modifiers, metabolic enzymes and
      other proteins involved in cancer, neuropsychiatric and cardiac disorders in
      disease-relevant cell lines under treated and untreated conditions.
  - response: >-
      To broadly stimulate research and development in "visible" machine learning systems
      informed by multi-scale cell and tissue architecture, in place of black-box models
      that predict phenotype from genotype without exposing the mechanisms of translation.
  - response: >-
      To implement a standards data management approach based on FAIR access and software
      principles, with deep provenance and replication packages for representation of cell
      maps and their underlying datasets.
  - response: >-
      To initiate a research program in ethical AI, especially as it relates to how cell
      maps will be used in genomic medicine and model interpretation.
  - response: >-
      To stimulate a diverse portfolio of training opportunities in the emerging field of
      biomachine learning and to enhance the biomedical AI/ML workforce.
    notes: >-
      These purposes are stated for the CM4AI project as a whole; this release is one
      quarterly increment toward them.

addressing_gaps:
  - response: >-
      Machine learning models in genomics and precision medicine are typically black boxes
      that predict phenotypes from genotypes without exposing the mechanisms by which such
      translation occurs. No matched, large-scale resource of cell and tissue architecture
      existed on which visible, interpretable models could be built directly.
  - response: >-
      Much of human subcellular architecture remains uncharted, and cell mapping
      technologies have typically been applied separately rather than as matched
      proteome-wide datasets in a shared cellular context.
  - response: >-
      Datasets suitable for training AI/ML models frequently lack the FAIRness, machine-
      readable provenance, characterization, explainability and ethical documentation
      required for responsible reuse; CM4AI defines and applies an AI-readiness framework
      to close that gap.

tasks:
  - response: >-
      Construction of hierarchical, multi-scale maps of protein assemblies by self-
      supervised integration of protein interaction and protein localization data followed
      by multi-resolution community detection.
    notes: >-
      A downstream task of the project; computed cell maps are not included in this release.
  - response: >-
      Training and evaluation of visible machine learning systems and visible neural
      networks (VNNs) that interrogate how protein assemblies in the cell affect cell-level
      phenotype predictions.
  - response: >-
      Interpretation of genetic variants and mutations against a structured representation
      of cellular architecture.
  - response: >-
      Integrative structure modeling of protein assemblies, combining Protein Data Bank
      structures, AlphaFold predictions, crosslinking mass spectrometry and disorder
      prediction.

intended_uses:
  - use_category: AI-ready data for functional genomics research
    examples:
      - >-
        Reuse of the packaged, provenanced multimodal data streams as AI-ready inputs for
        research in functional genomics.
  - use_category: AI model training
    usage_notes: >-
      Datasets are packaged with provenance graphs, schemas and rich metadata to support
      model training and validation.
  - use_category: Cellular process analysis
  - use_category: Analysis of cell architectural change
    examples:
      - >-
        Study of cell architectural changes and interactions in the presence of specific
        disease processes, treatment conditions (paclitaxel, vorinostat) or genetic
        perturbations.

other_tasks:
  - task_details: >-
      Comparison of protein assemblies and elution profiles between treated and untreated
      conditions to investigate proteome-wide impact of chemotherapy, and between
      undifferentiated iPSCs and their neuronal and cardiomyocyte derivatives.
  - task_details: >-
      Bioinformatic annotation and ranking of protein communities by the amount of
      available structural information, and integrative structure modeling of top-ranked
      communities using the Integrative Modeling Platform. This applies to computed cell
      map communities, which are not part of this release.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any
      context involving patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license; commercial use
      requires a separate license negotiation with the copyright holder (UCSD, Stanford
      and/or UCSF depending on the specific data package).

known_limitations:
  - limitation_type: temporal_limitation
    limitation_description: >-
      This is an interim Beta release; the data are not yet in completed final form and
      some datasets are under temporary pre-publication embargo.
    recommended_mitigation: >-
      Consult later quarterly releases, which are issued through the end of the project.
  - limitation_type: scope_limitation
    limitation_description: >-
      Computed cell maps are not included in this release and will be added in future
      releases.
    scope_impact: >-
      The release is most suitable for bioinformatics analysis of the individual data
      streams rather than for map-level analysis.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Protein-protein interaction (SEC-MS), protein localization (immunofluorescence
      imaging) and CRISPRi perturb-seq data interrogate sets of proteins that incompletely
      overlap.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Meaningful analysis requires domain expertise in proteomics, spatial imaging and
      single-cell genomics.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Data are derived from two commercially available human cell lines under a small set
      of treatment and differentiation conditions, and do not represent all biological
      variants which may be seen in the population at large.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from commercially available de-identified human
      cell lines and do not represent all biological variants which may be seen in the
      population at large. The two donor backgrounds are a 51-year-old Black female with
      metastatic mammary adenocarcinoma (MDA-MB-468) and a healthy male Northern European
      donor (KOLF2.1J).
    affected_subsets:
      - All subsets; every measurement derives from one of the two cell lines.
  - bias_type: selection_bias
    bias_description: >-
      Proteins interrogated were selected as a targeted panel of chromatin modifiers,
      metabolic enzymes and other proteins implicated in cancer, neuropsychiatric and
      cardiac disorders, rather than sampled without regard to prior biological interest.
    mitigation_strategy: >-
      SEC-MS is applied proteome-wide, and the CRISPRi perturbation screen in KOLF2.1J
      iPSCs was extended to expressed genome scale covering 11,739 targeted genes. These
      extensions apply to those two data streams only; the protein sets interrogated across
      the three modalities still overlap incompletely.

human_subject_research:
  involves_human_subjects: false
  regulatory_compliance:
    - >-
      The dataset does not involve human subjects research and is not FDA regulated. CM4AI
      data are non-clinical, deriving from tissue culture of established cell lines.
  ethics_review_board: >-
    Ethical review for the project is carried out by the CM4AI Ethics module, with named
    contacts Vardit Ravitsky (The Hastings Center) and Jean-Christophe Belisle-Pipon (Simon
    Fraser University).
  source_caveats: >-
    Values transcribed from the Data Governance & Ethics block of the June 2026 Dataverse
    release description, which records Human Subjects: No and FDA Regulated: No.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    CM4AI data are considered de-identified because they are non-clinical, derive from
    tissue cultures of established cell lines, and cannot be matched, with current
    knowledge, to a human subject.
  method: >-
    Use of commercially available, established and already de-identified human cell lines
    as the sole source material.
  source_caveats: >-
    The June 2026 Dataverse release description records De-identified Samples: Yes; the
    reasoning about non-clinical cell-line provenance is stated in the bioRxiv preprint.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      No personal identifiers or protected health information are present; the measured
      entities are proteins, transcripts and images from cultured cell lines.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      Every file in the release is publicly accessible. Some linked external resources,
      specifically the perturb-seq raw data for KOLF2.1J iPSCs and for MDA-MB-468 cells, are
      under temporary pre-publication embargo rather than permanent restriction.
    source_caveats: >-
      Public accessibility is transcribed from the File Access field shown against each file
      in the Dataverse record.

ethical_reviews:
  - review_details: >-
      Named ethical review contact for the CM4AI data releases
      (ravitskyv@thehastingscenter.org). The Ethics module developed the plan for ethical
      preparation, licensing, dissemination and Data Access supervision of CM4AI datasets,
      balancing openness of the data with protection of intellectual property and
      supervision of potential commercialization.
    contact_person: Vardit Ravitsky
    source_caveats: >-
      The bundle names this individual as an ethical review contact for the release. It does
      not attest an IRB, ethics committee or approval number, consistent with the dataset
      not involving human subjects; no reviewing_organization is asserted for that reason.
  - review_details: >-
      Named ethical review contact for the CM4AI data releases
      (jean-christophe_belisle-pipon@sfu.ca). The Ethics module employs a methodology
      inspired by Value-Sensitive Design to create normative standards and expectations for
      responsible design of datasets and AI technologies, including an axiological
      repository of values and the CM4AI Life Cycle framework of governance milestones.
    contact_person: Jean-Christophe Belisle-Pipon
    source_caveats: >-
      The bundle names this individual as an ethical review contact for the release; no
      formal reviewing organization or approval is attested.

data_governance:
  committee_name: CM4AI Data Access Committee
  committee_contact: Jillian Parker
  access_review_process: >-
    A Data Access Committee supervises ethical matters related to dataset distribution and
    potential dual licensing for commercial use. The June 2026 release names Jillian Parker
    (jillianparker@health.ucsd.edu) as the data governance committee contact.
  stewardship_roles:
    - >-
      The Standards module is responsible for AI-readiness packaging of data, software,
      metadata and provenance graphs via the FAIRSCAPE framework; the Ethics module
      supervises ethical preparation, licensing and dissemination; the Teaming module
      supports open dissemination through the CM4AI web portal on the U-BRITE platform; the
      University of Virginia Dataverse (LibraData) provides long-term preservation.
  source_caveats: >-
    No accountable organization is asserted because the bundle attributes copyright variously
    to the Regents of the University of California, the Board of Trustees of the Leland
    Stanford Junior University and, for FAIRSCAPE software, the Rector and Board of Visitors
    of the University of Virginia, while hosting the deposit at the University of Virginia
    and naming a UCSD-affiliated governance contact.

