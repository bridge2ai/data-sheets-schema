id: doi:10.18130/V3/HIGT4C
name: CM4AI
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Beta release of Cell Maps for Artificial Intelligence (CM4AI) comprises
  four multimodal data streams generated in two human cell lines. It contains perturb-seq
  data for MDA-MB-468 breast cancer cells with and without treatment and for
  undifferentiated KOLF2.1J induced pluripotent stem cells; SEC-MS data for MDA-MB-468
  cells with and without treatment and for undifferentiated KOLF2.1J iPSCs and iPSC-derived
  neural progenitor cells, neurons and cardiomyocytes; AP-MS data for treated MDA-MB-468
  cells; and immunofluorescence confocal images covering 464 proteins of interest in
  MDA-MB-468 cells under untreated, paclitaxel and vorinostat conditions.


  The two source cell lines are the triple-negative breast cancer line MDA-MB-468
  (RRID:CVCL_0419) and the induced pluripotent stem cell line KOLF2.1J (RRID:CVCL_B5P3).
  Computed cell maps are not included in this release; the release is most suitable for
  bioinformatics analysis of the individual data streams. Some component datasets remain
  under temporary pre-publication embargo, notably the raw perturb-seq sequence data.


  The release is one of a series of quarterly releases issued by the CM4AI project, the
  Functional Genomics Data Generation Project of the U.S. National Institutes of Health
  Bridge2AI program. Files are deposited in the University of Virginia Dataverse
  (LibraData) and are accompanied by a release metadata package containing RO-Crate
  metadata, provenance graphs and a human-readable datasheet.
