retention_limit:
  retention_period: Indefinite; no deletion schedule is stated.
  retention_details: >-
    Long-term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds.

errata:
  - erratum_details: >-
      The June 2025 release (doi:10.18130/V3/F3TD5R) was revised after initial publication.
      The revision added RGB immunofluorescent images, applied corrections to the RO-Crate
      metadata, and changed file naming conventions. The correction is recorded in the
      description of the revised release itself; the bundle contains no separate erratum
      notice.

extension_mechanism:
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details: >-
    The Cell Mapping Toolkit implements the end-to-end pipeline as a series of
    pip-installable Python packages with complete user documentation, released under BSD-3;
    the FAIRSCAPE AI-readiness framework is released under the MIT License with installation
    instructions and a tutorial at https://fairscape.github.io. Because the toolkit is a
    flexible and generalizable framework for cell map construction, third parties can
    integrate additional input modalities and construct new cell maps. The project fosters
    community contribution through mailing lists, shared collaboration spaces, CodeFest
    events and a talent graph linking the extended community of experts, publications,
    datasets and tools.

existing_uses:
  - examples:
      - >-
        The first data release was used at the CM4AI CodeFest in March 2024, accompanied by
        tutorials explaining how the data were derived and integrated and by production-ready
        software for producing the datasets.
  - examples:
      - >-
        The genome-scale CRISPRi perturbation data in KOLF2.1J iPSCs underpin the perturbation
        cell atlas of human induced pluripotent stem cells reported by Nourreddine and
        colleagues (bioRxiv 2024.11.03.621734).
    source_caveats: >-
      The claim that the atlas findings were validated by phenotypic, protein-interaction and
      metabolic tracing assays is transcribed from the March 2025 Dataverse abstract, which
      describes the atlas dataset's own validation rather than an independent third-party
      reuse of this release. The Nourreddine preprint full text is not in the declared bundle.

future_use_impacts:
  - impact_details: >-
      Anticipated benefits include a highly transformative platform for ethical, explainable
      and interpretable biomedical AI; deeper understanding of processes of human disease and
      health; training of a new generation of researchers; enabling development of novel
      cures; and assisting researchers and clinicians in equitably improving human lives.
  - impact_details: >-
      Anticipated risks centre on misapplication of laboratory data to clinical decision
      making or patient care without regulatory oversight, and on downstream AI systems
      built from cell-line-derived data that do not represent population-level biological
      variation. The Ethics module anticipates potential applications of the data and derived
      AI/ML systems and integrates them into data governance frameworks to optimize benefits
      and mitigate risks.

