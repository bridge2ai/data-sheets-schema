conforms_to: >-
  The dataset as a whole is organized according to the Clinical Dataset Structure (CDS) v0.1.1
  specification, which fixes the directory hierarchy (datatype / modality / device / participant)
  and the set of root metadata files. Within directories, the content follows domain standards:
  WaveForm DataBase (WFDB) for 12-lead electrocardiography; the Observational Medical Outcomes
  Partnership (OMOP) Common Data Model for clinical, laboratory and survey data; Digital Imaging
  and Communications in Medicine (DICOM) for retinal photography, OCT, OCT angiography and
  fluorescence lifetime imaging ophthalmoscopy; Open mHealth for wearable activity monitoring and
  continuous glucose monitoring; and the NASA ASCII File Format Guidelines for Earth Science Data
  for environmental sensor data. The release is additionally packaged as an RO-Crate conforming to
  the FAIRscape profile 0.1 and RO-Crate 1.2-DRAFT.
