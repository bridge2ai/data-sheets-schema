id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship dataset produced by the Artificial Intelligence Ready and
  Equitable/Exploratory Atlas for Diabetes Insights (AI-READI) project, one of four Data Generation
  Projects funded by the NIH Common Fund Bridge2AI program. Also referred to as the "AI-READI
  dataset". The release contains multimodal data from 2,280 adult participants with and without
  type 2 diabetes mellitus (T2DM), collected between 19 July 2023 and 1 May 2025 and harmonized
  across three data collection sites (University of Alabama at Birmingham, University of California
  San Diego, and University of Washington). Data span more than ten health domains: survey and
  social-determinants-of-health questionnaires, clinical measurements and physical assessments,
  blood and urine laboratory results, cognitive screening, monofilament testing for peripheral
  neuropathy, visual function testing, 12-lead electrocardiography, retinal photography, optical
  coherence tomography and OCT angiography, fluorescence lifetime imaging ophthalmoscopy,
  continuous glucose monitoring, wearable activity monitoring, and home environmental sensing.
  The cohort was recruited so as to approach an equal distribution across self-reported
  race/ethnicity, biological sex, and four categories of diabetes severity (no diabetes;
  pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin injectable medication;
  insulin-controlled), rather than to mirror the demographic distribution of the US population.
  The publicly released version contains no protected health information; information on sex,
  race/ethnicity and medications used has been removed and is held in a controlled-access variant.
  The dataset is organized following the Clinical Dataset Structure (CDS) specification, with each
  data type mapped to an established file or content standard, and is intended to be "AI ready" so
  that machine learning research can proceed without further reformatting.
