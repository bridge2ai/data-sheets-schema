splits:
  - split_details: >-
      The project team supplies a recommended participant-level partition into 70% training, 15%
      validation and 15% testing, distributed in the participants.tsv metadata file. Because sex,
      race and ethnicity are not released with the public version, the validation and test sets were
      constructed by the team to be balanced as far as possible for sex, race/ethnicity and diabetes
      status (no diabetes; pre-diabetes or lifestyle controlled; oral or non-insulin injectable
      medication controlled; insulin controlled), so that users without access to those variables can
      still evaluate models on demographically balanced held-out data. The recommended split is new
      in version 3.0.0 and is intended to reduce disparities in models developed from the dataset.

subpopulations:
  - identification: >-
      Self-reported race and ethnicity, recorded at screening in four groups (Hispanic, Asian, Black,
      White). These variables are held under controlled access and are not distributed with the
      public dataset; only the aggregate counts published with the recommended splits are visible to
      public users.
    distribution: >-
      Across all 2,280 participants: Hispanic 380, Asian 545, Black 519, White 836.
    subpopulation_elements_present: false
  - identification: >-
      Biological sex, self-reported at screening. Held under controlled access and removed from the
      public dataset; aggregate counts are published with the recommended splits.
    distribution: >-
      Across all 2,280 participants: 951 male, 1,329 female.
    subpopulation_elements_present: false
  - identification: >-
      Diabetes severity group, assigned at screening from diabetes health status and treatment
      (no type 1 or type 2 diabetes; pre-type 2 diabetes or type 2 diabetes controlled by lifestyle
      adjustment; type 2 diabetes controlled by oral or injectable medication other than insulin;
      type 2 diabetes controlled by insulin). This variable is released with the public dataset.
    distribution: >-
      Across all 2,280 participants: 776 no diabetes, 560 lifestyle controlled, 686 oral or
      non-insulin injectable medication controlled, 258 insulin controlled. Mean age across the
      cohort is 60.8 +/- 11.3 years.
    subpopulation_elements_present: true

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      All patients aged 40 years and older who had a medical encounter within one of the three
      participating health systems (University of Alabama at Birmingham, University of California San
      Diego, University of Washington) between 2020 and 2025. Patients with type 2 diabetes and
      pre-diabetes were identified by screening electronic health records for ICD-10 diagnosis codes
      E11.X and R73.09 respectively; patients without those codes formed the no-diabetes pool.
    strategies:
      - >-
        Non-probability sampling. Recruitment proceeds in waves; for each wave a contact pool is
        drawn by screening electronic health records at each site, and the composition and size of a
        wave are set from the observed participation characteristics of race/ethnicity, gender,
        diabetes severity and site.
      - >-
        Triple balancing rather than demographic matching: the target is equal proportions across
        four race/ethnicity groups, four diabetes severity categories, and biological male and
        female, because balanced training data are held to be critical for unbiased machine learning
        models. Under- and oversampling of groups is applied as recruitment progresses.
      - >-
        Site-level allocation: all study groups are recruited at every site to capture diversity, but
        the proportion of each group varies with the demographic prevalence of that group in the
        site's geographical area.
    why_not_representative: >-
      The cohort is deliberately not representative of the US population: groups are recruited in
      approximately equal proportions rather than in population proportions. Participation is
      voluntary, introducing volunteer bias. Recruitment is predominantly urban and hospital-based
      and so may not capture the full range of cultural and socioeconomic backgrounds. Racial and
      ethnic groups outside the four target groups, including Pacific Islanders and Native Americans,
      are not represented. Eligibility is restricted to adults aged 40 and older who speak and read
      English.
    source_caveats: >-
      The healthsheet answers "N/A" to the question about sampling strategy and states that the
      dataset "contains all possible instances", meaning all participants enrolled to date; the
      recruitment sampling described here is drawn from the BMJ Open protocol publication and the
      FAIRhub study description, which records the sampling method as "Non-Probability Sample".

acquisition_methods:
  - acquisition_details: >-
      Directly observed measurements taken during a single in-person study visit lasting between 2.5
      and 4 hours: vitals and anthropometry, 12-lead electrocardiogram, monofilament testing on both
      feet, cognitive screening, visual acuity and contrast sensitivity under photopic and mesopic
      conditions, autorefraction, retinal imaging on multiple devices, and collection of non-fasting
      blood and urine for laboratory assay. Ten further days of directly observed data are captured
      at home by a continuous glucose monitor, a wrist-worn activity monitor and a home environmental
      sensor issued at the end of the visit.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
    was_validated_verified: true
  - acquisition_details: >-
      Participant-reported data collected through self-administered questionnaires in REDCap, mostly
      completed before the visit: screening and eligibility, demographic information, CES-D-10
      depression screening, Problem Areas in Diabetes (PAID-5), diabetes self-care score, dietary
      assessment, ophthalmic survey, smoking, alcohol, vaping and marijuana use, general health
      history, social determinants of health surveys, and a current medication list coded with
      RxNorm. Reported medication entries were verified where possible by cross-referencing against
      medications physically brought in or photographed by the participant.
    was_directly_observed: false
    was_reported_by_subjects: true
    was_validated_verified: true
    notes: >-
      Marijuana use was not assessed for participants living in Alabama because it is an illegal
      substance there.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from participants at the three recruiting sites rather than
      obtained from a third party or through secondary use of existing data. Recruitment pools were
      identified by screening the sites' own electronic health records for diabetes and pre-diabetes
      ICD-10 codes among patients with a recent health-system encounter; identified individuals were
      then mailed and emailed a personalized invitation directing them into a REDCap recruitment
      interface. Prior medical record content was additionally abstracted for enrolled participants
      and is held under controlled access.

collection_mechanisms:
  - mechanism_details: >-
      REDCap electronic data capture, used for all patient-reported questionnaires and for
      clinician-entered visit data including the medications assessment, vitals, visual acuity,
      contrast sensitivity, monofilament results and complete blood count results. REDCap also hosts
      the recruitment interface and the electronic consent workflow.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Philips, Amsterdam, Netherlands) for the 12-lead
      electrocardiogram, recorded with the participant reclining or supine and the chair position
      (0, 30, 60 or 90 degrees relative to supine) noted. Exported as .xml.
  - mechanism_details: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system (Dexcom, Inc., San Diego,
      California), worn continuously for 10 days after the visit and recording interstitial glucose
      every 5 minutes. Participants were masked to the readings during the monitoring period.
      Exported as .csv.
  - mechanism_details: >-
      Garmin Vivosmart 5 wrist-worn physical activity monitor (Garmin Ltd, Schaffhausen,
      Switzerland), worn for 10 days at a 5-second sampling interval, recording steps, heart rate,
      respiratory rate, oxygen saturation, stress and sleep phases. Participants recorded which wrist
      was used and their dominant hand. Exported as .FIT.
  - mechanism_details: >-
      LeeLab Anura home environmental sensor, custom designed at the Karalis Johnson Retina Center,
      University of Washington, placed by the participant in a frequently used area of the home for
      10 days. Records ambient temperature, relative humidity, nitrogen oxides (NO and NO2), volatile
      organic compounds, particulate matter (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral light
      intensity measurements. The device captures no video, audio or GPS location and is not synced
      with participant-owned devices.
  - mechanism_details: >-
      Optomed Aurora IQ handheld non-mydriatic fundus camera (Optomed, Oulu, Finland), 50 degree
      field of view, 5 Mpix sensor. Four undilated colour fundus images per participant, macula and
      disc centred, captured in a dark room. Native DICOM.
  - mechanism_details: >-
      iCare EIDON widefield TrueColor confocal fundus imaging system (iCare USA, Inc., Raleigh, North
      Carolina), operated in fully automated mode. Twelve images per participant covering ultra-wide
      field central, nasal and temporal colour fundus photography, central infrared, central fundus
      autofluorescence, and a mosaic of ultra-wide field images. Native DICOM.
  - mechanism_details: >-
      Heidelberg Spectralis HRA with optical coherence tomography and OCT angiography (Heidelberg
      Engineering GmbH, Heidelberg, Germany). Six acquisitions per participant: optic nerve head
      radial circle high resolution OCT, posterior pole macula high-resolution 61-line OCT, and
      20x20 high-speed 512-line macular OCTA. Native DICOM.
  - mechanism_details: >-
      Heidelberg fluorescence lifetime imaging ophthalmoscopy (FLIO) (Heidelberg Engineering GmbH),
      macula-centred, two acquisitions per participant recording photon arrival times in a short
      (498-560 nm) and a long (560-720 nm) spectral channel. Exported in .sdt format and converted to
      DICOM for the dataset. Performed last in the visit because of the light exposure involved.
  - mechanism_details: >-
      Topcon Maestro2 3D OCT-1 robotic OCT and colour fundus camera (Topcon Healthcare, Itabashi-ku,
      Tokyo, Japan). Six acquisitions per participant: 12x9 mm 512x128 wide 3D OCT, 6x6 mm 512x128 3D
      macula OCT, and 6x6 mm 360x360 macular OCTA at 50 kHz. Exported in .fda format and converted to
      DICOM for the dataset.
  - mechanism_details: >-
      Topcon Triton DRI swept-source OCT (Topcon Healthcare, Itabashi-ku, Tokyo, Japan), 1,050 nm
      light source with non-mydriatic colour fundus camera. Six acquisitions per participant: 12x9 mm
      512x256 3D horizontal plus radial OCT, 6x6 mm 320x320 macular OCTA and 12x12 mm 512x512 macular
      OCTA. Exported in .fda format and converted to DICOM for the dataset.
  - mechanism_details: >-
      Carl Zeiss Meditec Cirrus 5000 AngioPlex (Carl Zeiss Meditec AG, Jena, Germany). Eight
      acquisitions per participant: 200x200 disc cube OCT, 512x128 macula cube OCT, 6x6 mm macular
      OCTA and 6x6 mm disc OCTA. Native DICOM.
  - mechanism_details: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada), capturing the total score, section subscores, the
      Memory Index Score and task completion times. Exported as .csv.
  - mechanism_details: >-
      M&S Technologies Electronic Visual Acuity tester (M&S Technology, Niles, Illinois) for
      best-corrected photopic and mesopic letter visual acuity, tested monocularly at 4 metres on a
      12x20 inch touch-screen monitor. Mesopic testing uses a 2.0 neutral density filter or an
      ND-occluder.
  - mechanism_details: >-
      Mars letter contrast sensitivity chart (Mars Perceptrix, Chappaqua, New York), administered
      monocularly under photopic conditions and under mesopic conditions through a 2.0 neutral
      density filter, undilated, at a viewing distance of 40-59 cm with background luminance of
      60-120 cd/m2. Log contrast sensitivity is scored from the final correct letter and the number
      of preceding errors.
  - mechanism_details: >-
      Topcon KR 800 auto keratometer/refractor (Topcon Healthcare, Oakland, New Jersey) for
      autorefraction of each eye, reporting spherical and cylindrical components in dioptres with
      cylindrical axis.
  - mechanism_details: >-
      Lensometry for the participant's habitual correction, using NIDEK LM-600P, Topcon CL-200 or
      Topcon CL-300 computerized lensometers depending on site.
  - mechanism_details: >-
      10 g monofilament applied to three locations on the plantar surface of each foot, ten times per
      location, with the participant's eyes closed and shoes and socks removed; insensate areas are
      retested for confirmation. Results are entered directly into REDCap.
  - mechanism_details: >-
      Automatic oscillometric blood pressure devices for two seated measurements separated by two
      minutes: OMRON HEM 907XL, Medline MDS4001 Automatic Digital Blood Pressure Monitor, or Welch
      Allyn 6000 series vital signs monitor with FlexiPort reusable cuff, depending on site.
  - mechanism_details: >-
      Venipuncture and urine collection during the visit (approximately 53 mL of blood) into EDTA
      vacutainers, serum separator vacutainers, CPT mononuclear cell preparation tubes and PAXgene
      RNA vacutainers. Complete blood counts are run on fresh whole blood by a CLIA-certified
      laboratory local to each site; all other assays are performed by the University of Washington
      Nutrition and Obesity Research Center on stored frozen samples batch-shipped on dry ice
      approximately quarterly. Results are provided in .csv.

data_collectors:
  - collector_details: >-
      Clinical research coordinators and research assistants at the three data collection sites
      recruited, consented and enrolled participants and performed the protocol elements, including
      ophthalmic imaging and instruction in the use of the take-home devices. All research personnel
      were trained by the data manager at the University of Alabama at Birmingham against a detailed
      Manual of Procedures, completed mandatory institutional compliance training for human subject
      research, and had to administer all protocol elements successfully to at least three volunteer
      practice subjects before enrolling participants. Their effort was supported by NIH award
      OT2OD032644 in proportion to percentage effort, at salaries aligned with the funding guidelines
      at each site.
  - collector_details: >-
      Data managers at each site oversaw the certification process for coordinators, reviewed REDCap
      range-check reports with the coordinators, and were responsible for quality control of all data
      before upload to FAIRhub.
  - collector_details: >-
      Phlebotomists and laboratory assistants at each site collected blood specimens and processed
      and shipped samples; local processing of plasma, serum and buffy coats followed standardized
      operating procedures on the day of collection.
  - collector_details: >-
      The central project team, including software and cloud engineers and research and data
      scientists, received the data from the sites and performed the additional curation,
      standardization and packaging steps required for dissemination through FAIRhub.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Version 3.0.0 contains data from participants seen between these dates, spanning the pilot data
      collection phase and the first two years of main study data collection. A preliminary pilot
      enrolment period ran until 30 November 2023 so that coordinators could gain familiarity with
      the protocol, and formal data collection began on 1 December 2023. The overall project spans
      four years: one year of protocol development and training followed by three years of
      recruitment and data collection, with an anticipated study completion date of 1 January 2027.
    source_caveats: >-
      The FAIRhub dataset description records the collection period as 2023-07-19/2025-05-01 and this
      is followed here. The BMJ Open protocol publication states that enrolment began on 18 July 2023
      and would continue until 30 November 2026.

collection_consents:
  - consent_details: >-
      Informed consent was required before participation in any part of the protocol, including the
      questionnaires. Most participants were offered the option to read all consent documentation
      electronically in REDCap before their visit and to sign with an electronic signature without
      speaking to a coordinator; potential participants could also decide at that point not to
      participate or to request further information or a call back from study staff. Participants who
      did not consent electronically were consented in person at the start of the visit, in a private
      room, before completing the questionnaires. Study staff read the form to participants who had
      difficulty reading it.

collection_notifications:
  - notification_details: >-
      Every individual was aware of the data collection: this was active collection directly from
      participants rather than passive collection or secondary use of existing data. Individuals
      identified by electronic health record screening received a personalized hardcopy invitation
      letter and an invitation email, each stating how their contact information had been obtained
      and linking them to a REDCap interface where they could read an overview of the research
      programme, the expectations for participation and answers to frequently asked questions.

consent_revocations:
  - revocation_details: >-
      Participants were permitted to withdraw consent at any time and to cease study participation.
      Any data that had already been shared or used at that point remain in the dataset; this
      limitation is stated explicitly in the consent document.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either as an electronic signature in REDCap before the visit
      or on paper in person at the start of the visit. FAIRhub classifies the consent as
      "ConsentSpecifiedNotElsewhereCategorised".
    consent_scope: >-
      Consent covers the full study protocol, including questionnaires, on-site measurements, retinal
      imaging, take-home device monitoring, collection of blood and urine for clinical assay and for
      long-term biobanking, abstraction of past health and driving records, and placement of the
      resulting data in an open-source repository for future research use. FAIRhub records that the
      public version of the dataset may be used only for type 2 diabetes related research while a
      private version allows more general use.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington, is
      published with the version 3.0.0 documentation. The other clinical sites operated under IRB
      reliance and used the same form with minor institution-specific language.
    withdrawal_mechanism: >-
      Participants may withdraw at any time; data already shared or used remain in the dataset, as
      stated in the consent document.

ethical_reviews:
  - reviewing_organization: >-
      Institutional Review Board of the University of Washington (Human Subjects Division), with
      reliance agreements from the IRBs of the University of Alabama at Birmingham and the University
      of California, San Diego.
    review_details: >-
      Approved under protocol STUDY00016228; initial approval was granted on 20 December 2022 and an
      annual renewal application reporting study status and progress is required within 90 days of
      expiration. FAIRhub records the human subject review status as "Submitted, approved", the study
      as not FDA-regulated for either drug or device, and no data monitoring committee. The initial
      approval letter is published with the version 3.0.0 documentation.
    source_caveats: >-
      The RO-Crate metadata names the reviewing body "Washington University IRB" while giving the
      Human Subjects Division of the University of Washington, 4333 Brooklyn Ave NE, Seattle, as its
      address and hsdrely@uw.edu as its contact; the IRB protocol form, the healthsheet and the BMJ
      Open publication all identify the reviewing body as the University of Washington IRB. The
      University of Washington reading is followed here.
  - review_details: >-
      Ethical, legal and social implications were considered at every stage of the project cycle by a
      designated ethics group. The RO-Crate metadata names Camille Nebeker, Debra Mathews, Kadija
      Ferryman and Nicholas Evans as responsible for ethical review of the dataset, and the project
      engaged with the Native Biodata Consortium as a co-learning opportunity on challenges specific
      to American Indian and Alaska Native communities, including data usage agreements, contract
      negotiation, transparent access agreements and forms of assured return of benefit and
      sustainable Tribal control and monitoring of data. A Community Advisory Board of eleven people
      drawn from the three sites, with racial and ethnic diversity reflecting the AI-READI sample,
      contributed to protocol development and reviewed consent forms.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    STUDY00016228, University of Washington Institutional Review Board, initial approval 20 December
    2022.
  ethics_review_board: >-
    University of Washington Institutional Review Board, with IRB reliance agreements covering the
    University of Alabama at Birmingham and the University of California, San Diego sites.
  regulatory_compliance:
  - >-
    The study is registered on ClinicalTrials.gov as NCT06002048 and is recorded as involving no
    FDA-regulated drug and no FDA-regulated device, with no data monitoring committee. The public
    dataset is stripped of Protected Health Information as defined by the HIPAA Privacy Rule using
    the Safe Harbor method. Licensees are required to comply with the data security and privacy
    standards established by the NIH under its Genomic Data Sharing Policy.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Eligibility is limited to adults aged 40 years and older who are able to provide consent, so no
    minors are enrolled and no guardian consent or assent procedures apply. Pregnancy and gestational
    diabetes are exclusion criteria, and adults older than 85 years are excluded. Prisoners are not a
    target population. Transportation assistance in the form of rideshare services was offered to
    participants who reported barriers to travelling to study visits.

participant_compensation:
  - compensation_provided: true
    compensation_amount: 'USD 200'
    compensation_type: >-
      Cash stipend for the study visit, together with coverage of reasonable parking, public transit
      or rideshare costs related to the visit.
    compensation_rationale: >-
      Paid from the grant funding for completion of the study visit. Payment is made once the final
      data have been received and the study devices returned, typically at least two weeks after the
      visit given the 10-day home monitoring period and the time needed for devices to be returned by
      mail; it is not pro-rated.
    retention_incentive_rationale: >-
      Participants invited back for the year 4 follow-up visit receive the same type and amount of
      compensation as for the initial visit.

participant_privacy:
  - anonymization_method: >-
      Removal of Protected Health Information as defined by the HIPAA Privacy Rule using the Safe
      Harbor method, together with removal of information on sex, race/ethnicity and medications used
      from the public dataset in order to prevent stigmatization of findings.
    privacy_techniques:
      - Access gated behind login through a verified ID system and self-attestation of intended use.
      - A strict custom license agreement with obligations on storage, secondary sharing and model training.
      - Static watermarking of the data to identify the licensee for security purposes, which licensees may not remove, obscure, alter or mask.
      - A two-tier dissemination model in which the more sensitive variables are released only under a data use agreement.
      - Selection of home monitoring devices that capture no video, audio or GPS location and are not synced with participant-owned devices.
    data_linkage: >-
      Participants are identified within the dataset only by a study participant number used
      consistently across all directories and in participants.tsv. The controlled-access variant adds
      5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records,
      medications, and traffic and accident reports.
    reidentification_risk: >-
      A theoretical risk of future re-identification is acknowledged. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level identification, which
      is the stated motivation for the dissemination system, the license agreement and the data
      watermarking applied to both the public and the controlled sets.

is_deidentified:
  identifiable_elements_present: false
  method: HIPAA Safe Harbor
  identifiers_removed:
    - Direct identifiers as enumerated by the HIPAA Privacy Rule Safe Harbor method
    - Sex
    - Race and ethnicity
    - Medications used
  deidentification_details: >-
    FAIRhub records the de-identification type as "NoDeIdentification" with direct identifiers and
    HIPAA identifiers flagged, and states that no identifiers were collected in the released data so
    no active de-identification step was necessary; the team instead verified that no data
    identifiable under US HIPAA were present. Dates were not shifted, non-arrayed data were not
    altered, and k-anonymity was not applied. The healthsheet leaves the question about measures
    taken to avoid re-identification unanswered.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The released dataset is stated not to contain data that might be considered confidential, and
      no personally identifiable information is included. Free-text fields from the raw data, which
      could inadvertently contain personal health information, are among the reasons the raw data are
      not released.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The RO-Crate metadata records the dataset as containing personal sensitive information in the
      categories of electronic health record data, wearable monitoring, electrocardiography,
      environmental sensor data, continuous glucose monitoring and wearable accelerometry. Variables
      judged too sensitive for public release - 5-digit zip code, sex, race, ethnicity, genetic
      sequencing data, past health records, medications, and traffic and accident reports - are held
      in the controlled-access variant of the dataset and are obtainable only under a data use
      agreement.
    source_caveats: >-
      The tier-1 RO-Crate metadata lists personal sensitive information categories present in the
      dataset, whereas the healthsheet states that the public dataset "will not contain data that is
      considered sensitive" and that the sensitive variables are confined to the controlled-access
      set. The RO-Crate is followed here, with the healthsheet position recorded.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet states that the dataset contains no data that, if viewed directly, might be
      offensive, insulting, threatening, or pose a psychological safety risk.

anomalies:
  - anomaly_details: >-
      Survey data contain skipped questions and incomplete responses; these are expected and were not
      back-filled unless the answer could be derived directly from another part of the same
      participant's record.
  - anomaly_details: >-
      Wearable and take-home device data are affected by improper use and technical failure,
      including battery exhaustion and system malfunction. In some cases the device held no stored
      results, or was returned too late for the results to be retrieved.
  - anomaly_details: >-
      Imaging data are affected by participant non-cooperation, by noise that may obscure the images,
      by media opacity such as cataract, and by system malfunction and data transfer failure. Image
      quality varies between participants and within a participant, particularly for the handheld
      undilated Optomed Aurora acquisitions and for FLIO, which is performed last in the visit after
      substantial light exposure and requires the participant to stay within about one centimetre of
      the starting position.
  - anomaly_details: >-
      In a small number of cases a data collision occurred at some point in the processing chain and
      data were lost.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, giving rise to volunteer bias which may limit the generalizability
      of results to people not represented in the study population. The contact pool is drawn
      entirely from patients who have had an encounter with one of the three health systems, so
      individuals without recent health-system contact are absent.
    mitigation_strategy: >-
      Recruitment proceeds in monitored waves whose composition is adjusted for diversity and
      inclusion, with under- and oversampling of groups as needed.
  - bias_type: sampling_bias
    bias_description: >-
      Sampling is non-probabilistic and deliberately balanced across race/ethnicity, sex and diabetes
      severity rather than matched to the demographic distribution of the US population, so
      prevalence estimates derived from the dataset will not reflect any real population.
    mitigation_strategy: >-
      Uniform data collection protocols were applied to all subjects irrespective of race/ethnicity,
      biological sex or diabetes severity across all study sites, and the three sites were selected
      for geographic variability and representation across racial and ethnic groups in order to
      minimize the potential for site-linked sampling bias.
  - bias_type: representation_bias
    bias_description: >-
      Recruiting Black men into health research is documented as more difficult than recruiting other
      populations, in part because of medical mistrust rooted in historical events such as the
      Tuskegee syphilis study, and similar under-recruitment trends are reported for Hispanic and
      Asian persons; these groups also bear a disproportionate burden of type 2 diabetes. Requiring
      that participants speak, read and understand English may itself have created difficulty in
      recruiting Hispanic and Asian participants. Released versions may therefore not have achieved
      the intended balanced distribution across groups.
    mitigation_strategy: >-
      Tailored printed materials and a personalized, participatory approach to recruitment; new
      recruitment strategies to be implemented if balancing on race/ethnicity emerges as a challenge;
      publication of recommended validation and test splits that are balanced by construction.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Although the study ultimately aims for balance across race/ethnicity, biological sex, and
      diabetes presence and severity, enrolment is ongoing and this release is not balanced across
      those parameters.
    scope_impact: >-
      Models trained on the full release without reweighting may inherit the residual imbalance.
    recommended_mitigation: >-
      Use the supplied 70/15/15 split, whose validation and test partitions are balanced as far as
      possible for sex, race/ethnicity and diabetes status.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The cohort does not include racial and ethnic groups outside the four target groups, such as
      Pacific Islanders and Native Americans, and recruitment is predominantly urban and
      hospital-based, so the full range of cultural and socioeconomic backgrounds is not captured.
    scope_impact: >-
      Generalization of derived models to unrepresented groups and to non-urban or
      non-health-system populations is not supported by the data.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility is restricted to adults aged 40 to 85 who are able to consent and who speak and
      read English; pregnancy, gestational diabetes and type 1 diabetes are exclusion criteria.
    scope_impact: >-
      Younger adults, non-English speakers, pregnant people and people with type 1 diabetes are
      absent from the dataset.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The design is cross-sectional with a single visit per participant in this release. Longitudinal
      follow-up is planned for a subgroup in year 4 of the project but is not included here, so
      within-person change over time cannot be observed.
    scope_impact: >-
      Disease trajectory work must rely on cross-sectional pseudotime approaches rather than on
      observed longitudinal change.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels or targets are provided; the dataset is deliberately hypothesis agnostic and no
      annotation was performed. There are also no formal guidelines for researchers who create new
      labels or define new tasks.
    scope_impact: >-
      Supervised tasks require users to define and derive their own outcome definitions, which may
      reduce comparability between analyses built on the dataset.
  - limitation_type: integration_limitation
    limitation_description: >-
      Multiple device makes and models were used for the same measure, and specific acquisition
      protocols differ between devices; device and protocol information was documented to support
      repeatability, but data from different devices are not interchangeable.
    scope_impact: >-
      Cross-device harmonization is left to the user; device provenance is preserved in the directory
      structure so that device effects can be modelled.
    recommended_mitigation: >-
      Use the device-level directory organization and the per-directory documentation to stratify or
      adjust analyses by acquisition device.

missing_data_documentation:
  - missing_data_patterns:
      - Not all modalities are available for all participants.
      - Within survey instruments, individual items may be unanswered.
    missing_data_causes:
      - Some participants elected not to participate in particular study elements.
      - The data collection device held no stored results, or was returned too late for the results to be retrieved, for example after the battery died.
      - Data were lost through a data collision at some point in the processing chain.
      - Survey questions were skipped or responses left incomplete.
    handling_strategy: >-
      Missing values that could be filled directly from another portion of the same individual's
      record were completed during data review; where there was no logical or appropriate way to
      correct a value, the site principal investigator reviewed it and decided whether it should be
      removed. No instances were excluded from the dataset at the time of preprocessing, and no
      imputation is described. Modalities a participant did not complete are simply absent from that
      participant's directories.

cleaning_strategies:
  - cleaning_details: >-
      Quality control was applied at the point of data entry and acquisition. Clinical values outside
      expected minimum/maximum ranges were flagged in REDCap and surfaced in reports reviewed by
      clinical research coordinators and data managers, who examined the participant record to judge
      whether an error was likely. Records were checked for credibility against prespecified
      reasonable ranges, for incorrect flow through prescribed skip patterns, for missing data that
      could be filled directly from other portions of an individual's record, and for omission or
      duplication of records. Editing was performed only under the guidance and approval of the site
      principal investigator.

preprocessing_strategies:
  - preprocessing_details: >-
      After transfer from the sites to the central project team, data were mapped to standardized
      terminologies and formats: clinical, laboratory and survey data to the OMOP Common Data Model,
      with each CSV file corresponding one-to-one to an OMOP CDM table; retinal imaging to DICOM,
      including conversion of Topcon .fda and Heidelberg FLIO .sdt exports; electrocardiograms from
      Philips .xml to the WaveForm DataBase format; Garmin .FIT exports to the Open mHealth schema,
      as for the Dexcom continuous glucose data; and environmental sensor data to the NASA ASCII
      guidelines for Earth science data. Current medications were coded with RxNorm. The version
      3.0.0 processing chain is described as automated with custom steps, in contrast to the custom
      and ad hoc processing used for the v1.0.0 pilot release.
  - preprocessing_details: >-
      The whole release was assembled into the Clinical Dataset Structure (CDS) v0.1.1 layout, adding
      per-directory manifest.tsv files and root metadata files (README.md, CHANGELOG.md, LICENSE.txt,
      dataset_description.json, dataset_structure_description.json, study_description.json,
      healthsheet.md, participants.tsv and participants.json), and data were watermarked before
      release.
  - preprocessing_details: >-
      Variables judged too sensitive for public release were withheld: information on sex,
      race/ethnicity and medications used was removed from the public version, along with all
      Protected Health Information. The Snellen visual acuity variables present in the previous
      version were dropped, leaving only logMAR visual acuity measurements.

raw_sources:
  - raw_data_details: >-
      The raw, pre-standardization data are retained and are expected to be preserved by the AI-READI
      project at least for the duration of the project, but are not currently shared outside the
      project team, both because they have not been mapped to standardized terminologies and because
      they may inadvertently contain personal health information or personally identifiable
      information, for example in free-text fields. Raw data may be included in future releases of
      the controlled-access dataset.

raw_data_sources:
  - source_description: >-
      REDCap project holding participant-reported questionnaire responses and coordinator-entered
      visit data (medications assessment, vitals, visual acuity, contrast sensitivity, monofilament
      results, complete blood count results).
    source_type: Electronic data capture system
    raw_data_format: REDCap export
    access_details: >-
      Not distributed; mapped to the OMOP Common Data Model for release. The exact forms used for
      data collection in REDCap are published with the version 3.0.0 documentation.
  - source_description: Philips PageWriter TC30 12-lead electrocardiograph export.
    source_type: Clinical device export
    raw_data_format: .xml
    access_details: Not distributed; converted to WaveForm DataBase format for release.
  - source_description: >-
      Topcon Maestro2 and Topcon Triton optical coherence tomography and OCT angiography exports.
    source_type: Imaging device export
    raw_data_format: .fda
    access_details: Not distributed; converted to DICOM for release.
  - source_description: Heidelberg fluorescence lifetime imaging ophthalmoscopy export.
    source_type: Imaging device export
    raw_data_format: .sdt
    access_details: Not distributed; converted to DICOM for release.
  - source_description: >-
      Optomed Aurora, iCare EIDON, Heidelberg Spectralis and Zeiss Cirrus 5000 imaging exports, which
      are produced natively in DICOM.
    source_type: Imaging device export
    raw_data_format: DICOM
  - source_description: Dexcom G6 continuous glucose monitor export.
    source_type: Wearable device export
    raw_data_format: .csv
    access_details: Not distributed in raw form; converted to the Open mHealth schema for release.
  - source_description: Garmin Vivosmart 5 physical activity monitor export.
    source_type: Wearable device export
    raw_data_format: .FIT
    access_details: Not distributed in raw form; converted to the Open mHealth schema for release.
  - source_description: LeeLab Anura home environmental sensor export.
    source_type: Sensor device export
    raw_data_format: .csv
    access_details: Not distributed in raw form; reformatted to the NASA ASCII Earth science data guidelines for release.
  - source_description: MoCA Duo iPad application export of Montreal Cognitive Assessment results.
    source_type: Application export
    raw_data_format: .csv
  - source_description: >-
      Laboratory results from CLIA-certified laboratories local to each site (complete blood count)
      and from the University of Washington Nutrition and Obesity Research Center (all other blood
      and urine assays).
    source_type: Clinical laboratory
    raw_data_format: .csv
  - source_description: >-
      Electronic health records at the three health systems, screened for recruitment and abstracted
      for past health records, medications, and traffic and accident reports.
    source_type: Electronic health record
    access_details: >-
      Abstracted content is held in the controlled-access variant of the dataset and is not part of
      the public release.

variables:
  - variable_name: hemoglobin_a1c
    data_type: float
    unit: '%'
    measurement_technique: Whole blood assay at the University of Washington Nutrition and Obesity Research Center
    notes: 'Marker for diabetes. Reference range supplied by the testing laboratory: 4.0-6.0%.'
  - variable_name: glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum chemistry, non-fasting sample
    notes: 'Marker for diabetes. Reference range supplied by the testing laboratory: 62-125 mg/dL.'
  - variable_name: insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay
    notes: 'Marker for diabetes. Reference range supplied by the testing laboratory: 0.0-24.9 ng/mL.'
  - variable_name: c_peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay
    notes: 'Indicator of insulin production. Reference range supplied by the testing laboratory: 1.1-4.4 ng/mL.'
  - variable_name: nt_probnp
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma assay
    notes: 'N-terminal pro-B-type natriuretic peptide; severity and outcome predictor of heart failure. Reference range varies by age.'
  - variable_name: troponin_t
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma assay
    notes: 'Marker of myocardial injury. Reference range supplied by the testing laboratory: female <11, male <16 ng/L.'
  - variable_name: c_reactive_protein_high_sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum assay
    notes: 'Inflammation marker and risk factor for type 2 diabetes. Reference range supplied by the testing laboratory: 0.0-10.0 mg/L.'
  - variable_name: total_cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: 'Cardiovascular disease risk factor. Reference range supplied by the testing laboratory: <200 mg/dL.'
  - variable_name: hdl_cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: 'Cardiovascular disease risk factor. Reference range supplied by the testing laboratory: >39 mg/dL.'
  - variable_name: ldl_cholesterol_calculated
    data_type: float
    unit: mg/dL
    derivation: Calculated from the serum lipid panel rather than measured directly.
    notes: 'Cardiovascular disease risk factor. Reference range supplied by the testing laboratory: <130 mg/dL.'
  - variable_name: triglycerides
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: 'Cardiovascular disease risk factor. Reference range supplied by the testing laboratory: <150 mg/dL.'
  - variable_name: creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum chemistry
    notes: 'Marker for kidney function. Reference range supplied by the testing laboratory: female 0.38-1.02, male 0.51-1.18 mg/dL.'
  - variable_name: blood_urea_nitrogen
    data_type: float
    unit: mg/dL
    measurement_technique: Serum chemistry
    notes: 'Marker for kidney and liver function. Reference range supplied by the testing laboratory: 8.0-21.0 mg/dL.'
  - variable_name: urine_albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine assay at the University of Washington Nutrition and Obesity Research Center
    notes: Urinary biomarker for early diabetic nephropathy; no reference range supplied.
  - variable_name: urine_creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Urine assay at the University of Washington Nutrition and Obesity Research Center
    notes: Urinary biomarker for early diabetic nephropathy; no reference range supplied.
  - variable_name: interstitial_glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Dexcom G6 continuous glucose monitor, one reading every 5 minutes over 10 days
  - variable_name: heart_rate
    data_type: integer
    unit: beats per minute
    measurement_technique: >-
      Measured twice at the visit with an automatic oscillometric device, two minutes apart, and
      recorded continuously at home by the Garmin Vivosmart 5.
  - variable_name: systolic_blood_pressure
    data_type: integer
    unit: mm Hg
    measurement_technique: Automatic oscillometric device, two seated measurements separated by two minutes
  - variable_name: diastolic_blood_pressure
    data_type: integer
    unit: mm Hg
    measurement_technique: Automatic oscillometric device, two seated measurements separated by two minutes
  - variable_name: body_mass_index
    data_type: float
    derivation: Calculated from measured height and weight.
  - variable_name: waist_hip_ratio
    data_type: float
    derivation: Calculated from measured waist and hip circumference.
  - variable_name: moca_total_score
    data_type: integer
    maximum_value: 30.0
    measurement_technique: Montreal Cognitive Assessment administered on an iPad using the MoCA Duo application
    notes: >-
      Higher scores indicate better performance; total possible score is 30. Section subscores, the
      Memory Index Score and task completion times are also recorded. Scoring may be affected by the
      participant's level of education, socioeconomic factors, and depression or other mental health
      conditions.
  - variable_name: best_corrected_visual_acuity_logmar
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, each eye separately, under
      photopic conditions and under mesopic conditions through a 2.0 neutral density filter.
    notes: >-
      Lower numbers indicate better resolution. The Snellen visual acuity variables available in the
      previous dataset version were dropped in version 3.0.0.
  - variable_name: letter_contrast_sensitivity_logcs
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars letter contrast sensitivity chart, each eye separately, undilated, under photopic and
      mesopic conditions.
    notes: >-
      Higher numbers indicate better sensitivity. Scored as the log CS value at the final correct
      letter minus 0.04 times the number of errors preceding it.
  - variable_name: monofilament_response
    data_type: categorical
    measurement_technique: >-
      10 g monofilament applied to three locations on the plantar surface of each foot, ten times per
      location, with the participant's eyes closed.
    categories:
    - 'yes; no'
  - variable_name: oxygen_saturation
    data_type: float
    unit: '%'
    measurement_technique: Garmin Vivosmart 5 wrist-worn monitor
  - variable_name: step_count
    data_type: integer
    unit: steps
    measurement_technique: Garmin Vivosmart 5 wrist-worn monitor
  - variable_name: respiratory_rate
    data_type: float
    unit: breaths per minute
    measurement_technique: Garmin Vivosmart 5 wrist-worn monitor
  - variable_name: sleep_duration
    data_type: float
    measurement_technique: >-
      Garmin Vivosmart 5 wrist-worn monitor, recording sleep phases and supporting analysis of
      circadian and diurnal rhythm.
  - variable_name: particulate_matter_pm2_5
    data_type: float
    measurement_technique: LeeLab Anura home environmental sensor
    notes: >-
      Particulate matter is recorded in four size fractions - PM1.0, PM2.5, PM4 and PM10 - as counts
      from the Sensirion SEN5x sensing module.
  - variable_name: ambient_temperature
    data_type: float
    measurement_technique: LeeLab Anura home environmental sensor
  - variable_name: relative_humidity
    data_type: float
    unit: '%'
    measurement_technique: LeeLab Anura home environmental sensor
  - variable_name: nitrogen_oxides_index
    data_type: float
    measurement_technique: LeeLab Anura home environmental sensor, reported as the Sensirion NOx Index
  - variable_name: volatile_organic_compounds
    data_type: float
    measurement_technique: LeeLab Anura home environmental sensor
  - variable_name: multispectral_light_intensity
    data_type: array
    measurement_technique: >-
      LeeLab Anura home environmental sensor, eleven multi-spectral light intensity channels from the
      AS7431 sensor.

file_collections:
  - id: doi:10.60775/fairhub.3#cardiac_ecg
    name: cardiac_ecg
    path: cardiac_ecg
    collection_type: processed_data
    file_count: 4515
    total_bytes: 302931703
    description: >-
      12-lead electrocardiogram data acquired with the Philips PageWriter TC30, organized as
      ecg_12lead/philips_tc30. Accompanied by a manifest.tsv file conforming to the Clinical Dataset
