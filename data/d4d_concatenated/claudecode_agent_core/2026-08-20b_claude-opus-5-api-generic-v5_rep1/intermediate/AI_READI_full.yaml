external_resources:
  - external_resources:
      - >-
        AI-READI dataset documentation at https://docs.aireadi.org, which provides the version-specific
        description of every data domain, the clinical context, the individual variables, the file
        formats and data standards, the citation instructions, and the AI-readiness discussion. The
        version 3.0.0 documentation also publishes the REDCap forms, the IRB approval letter and the
        consent form.
      - AI-READI project website at https://aireadi.org, including the team listing and the contact page.
    archival: false
    restrictions:
      - >-
        The documentation is shared under the CC-BY 4.0 license, so no licensing restrictions apply to
        future users of the documentation itself.
    future_guarantees: >-
      The dataset itself is described as self-contained; the documentation is a companion resource
      that users requiring additional provenance information will need. No guarantee is stated that
      the external sites will remain unchanged, and no archival snapshot of them is distributed with
      the dataset.
    notes: >-
      Both aireadi.org and docs.aireadi.org display a notice that the repository is under review for
      potential modification in compliance with Administration directives.

