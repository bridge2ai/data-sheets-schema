id: https://chorus4ai.org/#dataset
name: CHoRUS for Equitable AI dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
description: >-
  CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards) for Equitable AI is a
  multicenter, multimodal, high-resolution acute and critical care dataset produced by one of the four
  data generation projects of the NIH Common Fund Bridge2AI program. The dataset assembles
  retrospective clinical data from acute and critical care admissions contributed by 14 data
  acquisition hospitals within a consortium of 20 academic centers and 60+ members, standardized to
  the OMOP Common Data Model together with modality-specific standards for imaging, waveform and
  clinical text. The project website describes a currently released dataset of 50,000 patient
  admissions from ICU, PICU and NICU settings, comprising 1.6 billion rows of OMOP EHR data, 7,642
  admissions with radiology data and 23 Tb of waveform data, and an anticipated final dataset of
  100,000 patient admissions across 9 data modalities. The nine documented modalities are
  demographics, medication administration, procedures, nursing flowsheets, diagnoses, extracted and
  tokenized clinical notes, PACS imaging, bedside waveform telemetry and hospital EEG. Data are held
  under controlled access in a cloud enclave; clinical notes remain stored locally at contributing
  sites except for tokens, imaging de-identification is in process for cohorts beyond an initial set
  of available images, and EEG extraction is in process. The project also intends to provision a
  holdout test set accessible for external validation of models.
status: Partially released under controlled access and actively growing
page: https://chorus4ai.org/
conforms_to: >-
  OMOP Common Data Model for structured electronic health record data; DICOM for imaging; WFDB with an
  extended PhysioNet schema for waveform telemetry; EDF+ and Persyst for EEG; the OHNLP open-source
  schema for extracted and tokenized clinical notes.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
keywords:
  - critical care
  - intensive care
  - acute illness
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - social determinants of health
  - multimodal dataset
  - Bridge2AI
  - AI-ready data
source_caveats: >-
  The two sources that quantify the released cohort disagree: the project website
  (project_documentation, tier 2) reports 50,000 released patient admissions from ICU, PICU and NICU,
  while the cohort 2 informational webinar (cohort_2_webinar, tier 4) states that as of August 2025
  the dataset covered 14 hospitals with over 45,000 unique admissions. The higher-ranked project
  website value is stated in this record; both figures are consistent with an actively growing
  collection captured at different dates. The dataset identifier is minted as a fragment on the
  project website URL, which is the only persistent identifier the bundle supplies for the resource;
  no DOI or repository accession is attested.

