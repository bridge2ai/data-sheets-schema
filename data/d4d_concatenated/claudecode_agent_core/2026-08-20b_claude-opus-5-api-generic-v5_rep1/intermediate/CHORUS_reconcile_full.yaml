purposes:
  - response: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by generating a publicly available, AI-ready critical care dataset drawn from more
      than 100,000 critically ill patients.
  - response: >-
      To create ethically sourced datasets and tools around artificial intelligence and to establish
      best practices for AI in health, as one of four data generation projects in the NIH Bridge2AI
      consortium.
  - response: >-
      To provision a holdout test set accessible for external validation of models, aiding marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      To develop the network, tools, standards, data and education needed to build ML- and AI-derived
      models that improve the care and outcomes of patients requiring critical care, while promoting
      privacy, accountability and clinical benefit.
  - response: >-
      To cultivate expertise in the lay and scientific community and train a next generation of diverse
      academic and community AI scientists, engineers, data scientists and clinicians.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support AI/ML in critical care; developing
      high-resolution multi-center data sets is a critical first step towards actionable and
      trustworthy AI.
  - response: >-
      Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready data set capable
      of answering the grand challenge of improving recovery from acute illness.
  - response: >-
      Multi-modal EHR, waveform, imaging and text data are not harmonized across centers; unified
      standards and validated semantic mappings are needed to make such data interoperable.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.

