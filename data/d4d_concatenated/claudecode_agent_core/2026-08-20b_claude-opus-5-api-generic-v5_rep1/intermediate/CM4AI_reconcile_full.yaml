preprocessing_strategies:
  - preprocessing_details: >-
      The release separates derived products from raw source files. Raw mass spectrometry and
      sequencing files are deposited in external repositories, while the archives distributed
      through the University of Virginia Dataverse carry derived products - for example the
      expressed genome-scale CRISPRi Perturbation Cell Atlas of transcriptional and fitness
      phenotypes for 11,739 targeted genes - together with RO-Crate provenance metadata generated by
      the FAIRSCAPE framework.
  - preprocessing_details: >-
      The downstream CM4AI Multi-Scale Integrated Cell (MuSIC) pipeline, which consumes these data
      streams, proceeds through: download of protein-protein interaction networks and
      immunofluorescence images; within-modality dimensionality reduction, using a node2vec model for
      interaction networks and a Human Protein Atlas deep learning model for images, each producing a
      1,024-dimension feature vector per protein; contrastive deep learning integration of the two
      embeddings into a co-embedding per protein; community detection over all-by-all co-embedding
      similarities to produce a hierarchy of protein assemblies; and hierarchy evaluation by
      alignment to Gene Ontology and Reactome together with large language model naming of assemblies
      with a name confidence score. The cell maps produced by this pipeline are not part of the June
      2026 release.

cleaning_strategies:
  - cleaning_details: >-
      The FAIRSCAPE client package is called at each segment of the MuSIC pipeline to validate
      inputs before the output RO-Crate package for that segment is created, so that datasets,
      schemas and provenance are checked as part of packaging rather than after the fact. The CM4AI
      preprint additionally records that the single-cell CRISPR screen data were undergoing quality
      control at the time of writing.
    source_caveats: >-
      Both statements come from the CM4AI project description preprint (tier 3), which describes the
      project's first year; the release records themselves do not describe cleaning or
      quality-control procedures applied to the archives distributed in June 2026.

machine_annotation_tools:
  - tools:
      - GPT-4 (OpenAI), applied through the CM4AI Gene Set AI (GSAI) annotation pipeline
    tool_descriptions: >-
      The CM4AI hierarchy-evaluation step annotates protein assemblies in two ways: by alignment to
      known protein function and pathway resources, including the Gene Ontology and Reactome, to
      identify assemblies with high overlap with documented cell biology; and by a large language
      model approach developed by the project to name sets of proteins and assign a name confidence
      score. The GSAI pipeline uses an engineered prompt following chain-of-thought and one-shot
      strategies to obtain a descriptive name, a confidence score and a referenced reasoning essay
      for each assembly, with a separate GPT-4 citation module that extracts gene symbols and
      functional keywords, queries PubMed, and evaluates whether returned publications support the
      statements made.
    source_caveats: >-
      These tools annotate the computed cell maps produced by the MuSIC pipeline, which are not
      included in the June 2026 release. They are recorded because they are the annotation machinery
      applied to these data streams downstream, not because annotations produced by them are
      distributed here.

