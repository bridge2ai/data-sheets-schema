id: doi:10.18130/V3/HIGT4C
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Common Fund Bridge to Artificial
  Intelligence (Bridge2AI) program. The project produces AI-ready, multimodal measurements of
  human cell architecture in disease-relevant cell lines, together with machine-readable
  hierarchical maps of cell architecture inferred from those measurements. This record
  describes the CM4AI data resource as distributed in its June 2026 Data Release (Beta)
  through the University of Virginia Dataverse (doi:10.18130/V3/HIGT4C), the most recent
  release in a quarterly series that began in May 2024.
  Data are generated in two ethically sourced human cell lines. The first is the triple-negative
  breast cancer line MDA-MB-468 (RRID:CVCL_0419), studied untreated and after treatment with
  paclitaxel or vorinostat. The second is the induced pluripotent stem cell line KOLF2.1J
  (RRID:CVCL_B5P3), studied undifferentiated and after differentiation into neural progenitor
  cells, neurons and cardiomyocytes. Four measurement modalities are combined: immunofluorescence
  (ICC-IF) confocal imaging of protein subcellular localization; affinity purification-mass
  spectrometry (AP-MS) and size-exclusion chromatography-mass spectrometry (SEC-MS) for
  protein-protein interactions; and single-cell CRISPRi perturbation sequencing (perturb-seq).
  The June 2026 release contains perturb-seq data for MDA-MB-468 cells with and without treatment
  and for undifferentiated KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 cells with and without
  treatment and for undifferentiated iPSCs and iPSC-derived neural progenitor cells, neurons and
  cardiomyocytes; AP-MS data for treated MDA-MB-468 cells; and immunofluorescence images for
  MDA-MB-468 cells with and without treatment. Computed cell maps are not included in this
  release.
  Releases are packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate
  format using the FAIRSCAPE framework, and are distributed under the Creative Commons
  Attribution-NonCommercial-ShareAlike 4.0 International license. The project website reports
  project-wide totals of 1,374 protein interactions, 53,788 immunofluorescent images, 7,023
  proteins investigated, 11,739 genes targeted and 21.4 TB of data; these are cumulative project
  figures rather than counts for this release. The release records name CM4AI as a collaboration
  of UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham, Simon Fraser University and the Hastings
  Center; the release author list separately records affiliations at the University of Texas at
  Austin, the University of Alabama, the University of Montreal and KTH Royal Institute of
  Technology. The project is organized into three pillars (Data, People, Ethics) and six modules:
  Data Acquisition, Tools, Standards, Teaming, Skills and Workforce Development, and Ethics.
