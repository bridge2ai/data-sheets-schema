distribution_formats:
  - format: ZIP archives distributed through the University of Virginia Dataverse
    media_type: application/zip
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    notes: >-
      All ten files in the June 2026 release are public ZIP archives with published MD5 checksums.
      The Dataverse interface reports that the dataset as a whole is too large to download in one
      operation and that files above the per-download size limit must be retrieved individually or
      through the Data Access API.
  - format: >-
      RO-Crate packages with JSON-LD metadata and EVI provenance graphs, produced by the FAIRSCAPE
      framework and identified by ARK persistent identifiers
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C

distribution_dates:
  - release_dates:
      - "May 2024 - first CM4AI data release, doi:10.18130/V3/DXWOS5"
      - "2025-03-03 - March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX"
      - "2025-07-01 - June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R"
      - "2025-10-31 - October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM"
      - "2026-06-17 - June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C; the three immunofluorescence image archives in this release were published 2026-07-15"
    notes: >-
      Releases are issued quarterly and are stated to continue through the end of the project in
      November 2026.
    source_caveats: >-
      Sources disagree on the June 2026 release date. The Dataverse record (tier 1) gives a
      publication date of 2026-06-17; the CM4AI data releases page (tier 2) states "Released on:
      June 17, 2025" for the same DOI. The Dataverse date is stated here.

third_party_sharing:
  - is_shared: true
    notes: >-
      The release is distributed publicly through the University of Virginia Dataverse under CC
      BY-NC-SA 4.0, with all ten files marked public. Component raw data are deposited with
      third-party repositories (MassIVE for mass spectrometry, Figshare for the iPSC CRISPRi
      perturbation atlas), and some perturb-seq deposits remain under temporary pre-publication
      embargo. The project also states an intention to integrate its contributions with the NIH
      Common Fund Data Ecosystem.

license_and_use_terms:
  data_use_permission: no_commercial_use
  license_terms: >-
    Data and metadata are licensed under the Creative Commons Attribution-NonCommercial-ShareAlike
    4.0 International license (CC BY-NC-SA 4.0). Users are free to share and adapt the material
    provided they give appropriate credit, provide a link to the license and indicate if changes
    were made; may not use the material for commercial purposes; must distribute contributions under
    the same license if they remix, transform or build upon the material; and may not apply legal
    terms or technological measures that legally restrict others from doing anything the license
    permits. Attribution is required to the copyright holders, to the authors and to the Cell Maps
    for Artificial Intelligence project; publications referencing the data or derived products
    should cite both the related CM4AI publication and the data collection itself. The CM4AI preprint
    states that commercial use requires a separate license negotiation with the copyright holder and
    that a Data Access Committee supervises ethical matters related to dataset distribution and
    potential dual licensing for commercial use. Software produced by the project is separately
    licensed: the data integration pipeline under BSD-3 and the FAIRSCAPE AI-readiness framework
    under the MIT license.

ip_restrictions:
  restrictions:
  - >-
    Copyright in the released data is held by The Regents of the University of California except
    where otherwise noted, and spatial proteomics raw image data is copyright The Board of Trustees
    of the Leland Stanford Junior University. The CM4AI preprint states that commercial use requires
    separate license negotiation with the copyright holder, which may be the University of California
    San Diego, Stanford University and/or the University of California San Francisco depending on the
    specific data package. FAIRSCAPE software copyright is held by the Rector and Board of Visitors
    of the University of Virginia.
  source_caveats: >-
    The copyright statements are drawn from the March 2025 and June 2025 release descriptions and
    from the CM4AI preprint; the June 2026 release description does not restate them.

data_governance:
  committee_name: Data Governance Committee
  committee_contact:
    name: Jillian Parker
  access_review_process: >-
    All ten files in the June 2026 release are marked public in the University of Virginia
    Dataverse, so no access request is required for the released archives; some component data
    remain under temporary pre-publication embargo and are not yet distributed. The named contact
    for the Data Governance Committee is Jillian Parker, at jillianparker@health.ucsd.edu. The CM4AI
    preprint states that a Data Access Committee supervises ethical matters related to dataset
    distribution and potential dual licensing for commercial use, and that the governance plan was
    developed jointly by the Ethics, Data Acquisition, Tools and Standards modules to balance
    openness of the data against protection of intellectual property and supervision of
    commercialization efforts.
  source_caveats: >-
    The bundle supplies only an email address for the committee contact and no personal identifier,
    so `committee_contact.id` is omitted and the address is recorded in the access review prose.

regulatory_restrictions:
  regulatory_restrictions:
  - >-
    The June 2026 release records that the dataset does not involve human subjects, that samples are
    de-identified, and that the dataset is not FDA regulated. The release additionally states that
    the laboratory data are not to be used in clinical decision-making or in any context involving
    patient care without appropriate regulatory oversight and approval.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The June 2026 release records samples as de-identified and human subjects as not involved. The
    CM4AI preprint states that the project's data are distinctive within Bridge2AI in being
    non-clinical, derived from tissue cultures, and considered de-identified because they cannot be
    matched, with current knowledge, to a human subject. Data derive from commercially available
    human cell lines rather than from identifiable individuals.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      No personal identifiers or protected health information are reported. The only person-related
      attributes present anywhere in the documentation are the donor characteristics of the two cell
      lines described in the project preprint, which are cell line provenance facts rather than data
      elements in the released files.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      The June 2026 release states that the data are not yet in completed final form and that some
      datasets are under temporary pre-publication embargo. Specifically, the external perturb-seq
      deposits for undifferentiated KOLF2.1J iPSCs and for MDA-MB-468 breast cancer cells with and
      without treatment are listed as embargoed rather than linked to an accessible repository.

human_subject_research:
  involves_human_subjects: false
  regulatory_compliance:
  - >-
    The June 2026 release records human subjects as "No", de-identified samples as "Yes" and FDA
    regulated as "No".
  ethics_review_board: >-
    Ethical oversight is provided by the CM4AI Ethics Module rather than by an institutional review
    board for human subjects research. The named ethical review contacts in the June 2026 release
    are Vardit Ravitsky and Jean-Christophe Bélisle-Pipon.

ethical_reviews:
  - reviewing_organization: CM4AI Ethics Module
    contact_person:
      id: ORCID:0000-0002-7080-8801
      name: Vardit Ravitsky
    review_details: >-
      The June 2026 release records that the dataset does not involve human subjects, that samples
      are de-identified and that the data are not FDA regulated, and names two ethical review
      contacts: Vardit Ravitsky (ravitskyv@thehastingscenter.org) and Jean-Christophe Bélisle-Pipon
      (jean-christophe_belisle-pipon@sfu.ca). The CM4AI preprint describes the Ethics Module's
      approach as inspired by Value-Sensitive Design, producing an axiological repository of values
      to guide design standards, a CM4AI Life Cycle framework setting out governance milestones
      across data generation and AI system development, mixed qualitative and quantitative empirical
      research to capture community perspectives, and tools to support ethical decision-making. The
      module also supported the Bridge2AI Code of Conduct that participants must attest to before
      accessing Bridge2AI data, and states that both cell lines used by the project were ethically
      sourced.
    source_caveats: >-
      The bundle names the Ethics Module and gives contact addresses at Simon Fraser University and
      The Hastings Center, but does not state a formal institutional name for the reviewing body
      beyond the module designation.

intended_uses:
  - use_category: AI-ready data for functional genomics research
    usage_notes: >-
      The release is intended to supply AI-ready datasets supporting research in functional genomics.
  - use_category: AI model training
    usage_notes: >-
      The release is intended for training artificial intelligence and machine learning models,
      including the interpretable or "visible" machine learning systems that motivate the project.
  - use_category: Cellular process analysis
    usage_notes: >-
      The release is intended to support analysis of cellular processes from multimodal
      measurements of protein localization, protein-protein interaction and genetic perturbation
      response.
  - use_category: >-
      Analysis of cell architectural change under disease, treatment and genetic perturbation
    usage_notes: >-
      The release is intended to support study of cell architectural changes and interactions in the
      presence of specific disease processes, treatment conditions or genetic perturbations.
    examples:
      - Comparison of protein complex elution profiles between untreated MDA-MB-468 cells and cells treated with paclitaxel or vorinostat
      - Comparison of protein complexes across undifferentiated iPSCs and iPSC-derived neural progenitor cells, neurons and cardiomyocytes

existing_uses:
  - examples:
      - >-
        Nourreddine S, Doctor Y, Dailamy A, Forget A, Lee YH, Chinn B, Khaliq H, Polacco B,
        Muralidharan M, Pan E, Zhang Y, Sigaeva A, Hansen JN, Gao J, Parker JA, Obernier K, Clark T,
        Chen JY, Metallo C, Lundberg E, Ideker T, Krogan N, Mali P. A perturbation cell atlas of human
        induced pluripotent stem cells. bioRxiv 2024.11.03.621734, PMCID PMC11580897,
        doi 10.1101/2024.11.03.621734 - reports the genome-scale CRISPRi perturbation atlas in
        KOLF2.1J iPSCs distributed in this release, with validation via phenotypic, protein-interaction
        and metabolic tracing assays.
      - >-
        Clark T, Mohan J, Schaffer L, Obernier K, et al. Cell Maps for Artificial Intelligence:
        AI-Ready Maps of Human Cell Architecture from Disease-Relevant Cell Lines. bioRxiv
        2024.05.21.589311, doi 10.1101/2024.05.21.589311 - the project description publication that all
        releases require users to cite.
      - >-
        The first data release was used as teaching material at the CM4AI CodeFest in March 2024,
        which provided tutorials on how the data were derived and integrated together with
        production-ready software for producing the datasets.

use_repository:
  - repository_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    repository_details: >-
      The University of Virginia Dataverse records download metrics for each release and retrieves
      citations from Crossref via DataCite using Make Data Count standards. Reported download counts
      at the time of capture were 181 for the June 2026 release, 405 for October 2025, 256 for June
      2025 and 302 for March 2025; the citation panel reported no citations found for any release.

other_tasks:
  - task_details: >-
      Integrative structure modeling of protein communities. The CM4AI preprint describes a
      bioinformatics pipeline that annotates communities with available structural information from
      the Protein Data Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry
      and disorder prediction, ranks communities by the amount of structural information available as
      a proxy for modeling feasibility, and then computes integrative structure models for
      top-ranked communities using the Integrative Modeling Platform.

discouraged_uses:
  - discouragement_details: >-
      Using the release as a source of integrated, predicted cell maps is discouraged, because
      computed cell maps are not included; the release states that it is most suitable for
      bioinformatics analysis of the individual datasets. Use without relevant domain expertise is
      also discouraged, since the release states that meaningful analysis requires such expertise.
      Treating the release as final is discouraged, as it is an interim release still being augmented.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval. The data are
      research-grade measurements from cell lines and are not FDA regulated.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license without a separate license
      negotiated with the copyright holder; the CM4AI preprint states that commercial use requires
      such negotiation and that a Data Access Committee supervises potential dual licensing.

future_use_impacts:
  - impact_details: >-
      The project anticipates that its data will be used to build AI and machine learning systems in
      genomic medicine, and treats that prospect as a governance responsibility rather than an
      external matter. The Ethics Module's stated work is to anticipate potential applications of the
      data and derived AI/ML systems, integrate them into data governance frameworks to optimize
      benefits and mitigate potential risks, and promote their use for the collective good, through a
      value repository, guidelines and best practices for ethical AI development, a CM4AI Life Cycle
      framework of governance milestones, and tools to raise awareness of the ethical, legal and
      social ramifications of the data and the AI systems built on it.
  - impact_details: >-
      A foreseeable risk is over-generalization: because the data derive from two commercially
      available cell lines, downstream models trained on them may not transfer to the range of
      biological variation present in human populations, and predictions from such models should not
      be carried into clinical contexts without regulatory oversight.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from commercially available de-identified human cell lines
      and do not represent all biological variants which may be seen in the population at large.
    mitigation_strategy: >-
      Users are directed by the release to be aware of this limitation when interpreting results;
      the release does not describe a corrective procedure.
  - bias_type: selection_bias
    bias_description: >-
      Proteins and genes were selected for interrogation on disease-relevance grounds rather than at
      random. The project design targets 100 chromatin modifiers and 100 metabolic enzymes implicated
      in cancer, neuropsychiatric and cardiac disorders, and expands coverage to further proteins
      conditional on significant hits emerging from the genetic perturbation and protein-protein
      interaction results, so inclusion in the later data streams depends on earlier findings.
    affected_subsets:
    - >-
      All modalities except the KOLF2.1J CRISPRi perturbation screen, which is expressed
      genome-scale at 11,739 targeted genes.
    mitigation_strategy: >-
      The bundle describes no mitigation. Users comparing coverage across modalities should note that
      the shared protein list was chosen for disease relevance and expanded on the basis of prior
      results.

known_limitations:
  - limitation_type: temporal_limitation
    limitation_description: >-
      This is an interim release and the data are not yet in completed final form. Some component
      datasets are under temporary pre-publication embargo.
    recommended_mitigation: >-
      Consult later quarterly releases, which are planned through the end of the project in November
      2026, for more complete coverage.
  - limitation_type: integration_limitation
    limitation_description: >-
      Computed cell maps are not included in this release, and the release states that it is most
      suitable for bioinformatics analysis of the individual datasets rather than for integrated
      analysis.
    scope_impact: >-
      The primary intended product of the project - hierarchical maps of cell architecture - cannot be
      obtained from this release directly; only the input data streams are available.
    recommended_mitigation: >-
      Predicted cell maps are stated to be added in future releases; the CM4AI Cell Mapping Toolkit
      implements the end-to-end integration pipeline for users who wish to compute maps themselves.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The protein-protein interaction (SEC-MS), protein localization (immunofluorescence imaging) and
      CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap, so not every
      protein is covered by every modality.
    scope_impact: >-
      Multimodal integration is possible only over the intersection of the modalities' protein sets.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Meaningful analysis of the release requires domain expertise in the relevant proteomics,
      imaging and single-cell genomics methods.

missing_data_documentation:
  - missing_data_patterns: >-
      Coverage is uneven across modalities and strata. The protein-protein interaction (SEC-MS),
      protein localization (immunofluorescence imaging) and CRISPRi perturb-seq data interrogate sets
      of proteins which incompletely overlap. Within the June 2026 release, AP-MS is present only for
      the paclitaxel- and vorinostat-treated MDA-MB-468 conditions and not for untreated cells;
      immunofluorescence images are present only for MDA-MB-468 and not for any iPSC-derived lineage;
      and SEC-MS is the only modality covering the neural progenitor cell, neuron and cardiomyocyte
      strata.
    missing_data_causes: >-
      The release is an interim one in a quarterly series, with data generation continuing through
      November 2026; some external deposits are additionally under temporary pre-publication embargo.
    handling_strategy: >-
      No imputation or gap-filling is applied. The release documents the incomplete overlap as a
      stated limitation and directs users to later releases for fuller coverage.

extension_mechanism:
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details: >-
    The Cell Mapping Toolkit is released as a series of pip-installable Python packages on GitHub
    with complete user documentation hosted at ReadTheDocs and a step-by-step guide in the
    repository. The project describes it as a flexible and generalizable framework for cell map
    construction that enables researchers to integrate and construct cell maps via multiple input
    modalities, developed to facilitate continued map improvement, incorporation of new datasets and
    construction of new cell maps across subtypes and disease states. The FAIRSCAPE AI-readiness
    framework is likewise freely available under the MIT license with installation instructions and
    a tutorial.
  source_caveats: >-
    The mechanism described is for extending and reusing the project's mapping software and for
    building further maps; the bundle does not describe a procedure for third parties to contribute
    additions or corrections to the released data archives themselves.

updates:
  frequency: Quarterly
  update_details: >-
    The dataset is regularly updated and augmented through the end of the project in November 2026,
    with releases issued on a quarterly basis. Each release adds new modalities, conditions and cell
    types; the June 2026 release added AP-MS data for treated MDA-MB-468 cells relative to earlier
    releases, and the June 2025 revision added RGB immunofluorescent images, corrected RO-Crate
    metadata and changed naming conventions.

retention_limit:
  retention_period: Long-term, with no stated deletion date
  retention_details: >-
    The release maintenance plan commits to long-term preservation in the University of Virginia
    Dataverse, supported by committed institutional funds. Prior releases remain published and
    citable by their own DOIs.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  version_details: >-
    The June 2026 release is version 2.0 of its Dataverse record. Earlier quarterly releases remain
    separately published in the University of Virginia Dataverse under their own DOIs and version
    numbers - March 2025 at version 1.4, June 2025 at version 2.1, October 2025 at version 2.1 - and
    the CM4AI data releases page maintains an archive listing the May 2024, March 2025, June 2025 and
    October 2025 releases. Dataverse retains the version history of each record and will not remove
    files from previously published versions.

