      whether it counts interaction pairs, interactomes or another unit; no per-release count is
      stated in the bundle. B2AI_SUBSTRATE has no term for protein interaction data, so
      `data_substrate` is omitted rather than approximated.
  - instance_type: >-
      Single-cell transcriptional and fitness phenotype profile resulting from CRISPRi knockdown of a
      targeted gene (perturb-seq).
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
    notes: >-
      The KOLF2.1J screen is expressed genome-scale, covering 11,739 targeted genes; the MDA-MB-468
      screens are described on the project website as covering 200 genes. Cell-level counts are not
      stated in the bundle.
  - instance_type: >-
      Protein elution or interaction profile from proteome-wide size-exclusion chromatography-mass
      spectrometry.
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:28
    notes: >-
      The project website reports SEC-MS capturing approximately 7,000 proteins in each of the iPSC
      and breast cancer flagship datasets.

subsets:
  - id: doi:10.18130/V3/HIGT4C#subset-mdamb468-untreated
    name: MDA-MB-468, untreated
    description: >-
      Triple-negative breast cancer cells cultured without drug treatment, serving as the control
      condition. In the June 2026 release this stratum is covered by immunofluorescence images, by
      SEC-MS within the MDA-MB-468 mass spectrometry archive, and by perturb-seq. It is not covered
      by AP-MS, which is present only for the two treated conditions.
    is_data_split: false
    is_subpopulation: true
  - id: doi:10.18130/V3/HIGT4C#subset-mdamb468-paclitaxel
    name: MDA-MB-468, paclitaxel-treated
    description: >-
      Triple-negative breast cancer cells treated with the chemotherapeutic paclitaxel. Covered in
      the June 2026 release by AP-MS, immunofluorescence images, SEC-MS and perturb-seq.
    is_data_split: false
    is_subpopulation: true
  - id: doi:10.18130/V3/HIGT4C#subset-mdamb468-vorinostat
    name: MDA-MB-468, vorinostat-treated
    description: >-
      Triple-negative breast cancer cells treated with vorinostat. Covered in the June 2026 release
      by AP-MS, immunofluorescence images, SEC-MS and perturb-seq.
    is_data_split: false
    is_subpopulation: true
  - id: doi:10.18130/V3/HIGT4C#subset-kolf2-undifferentiated
    name: KOLF2.1J induced pluripotent stem cells, undifferentiated
    description: >-
      Parental, undifferentiated iPSCs. Covered in the June 2026 release by SEC-MS and by
      genome-scale CRISPRi perturb-seq, including the perturbation cell atlas and the raw sequence
      package. Immunofluorescence images for iPSC lineages are described by the project website as
      forthcoming.
    is_data_split: false
    is_subpopulation: true
  - id: doi:10.18130/V3/HIGT4C#subset-ipsc-npc
    name: iPSC-derived neural progenitor cells
    description: >-
      Neural progenitor cells differentiated from KOLF2.1J iPSCs. Covered in the June 2026 release by
      SEC-MS within the KOLF2 mass spectrometry archive.
    is_data_split: false
    is_subpopulation: true
  - id: doi:10.18130/V3/HIGT4C#subset-ipsc-neuron
    name: iPSC-derived neurons
    description: >-
      Neurons differentiated from KOLF2.1J iPSCs. Covered in the June 2026 release by SEC-MS within
      the KOLF2 mass spectrometry archive. The CM4AI preprint reports SEC-MS in parental iPSCs and
      differentiated neurons uncovering more than 700 protein complexes.
    is_data_split: false
    is_subpopulation: true
  - id: doi:10.18130/V3/HIGT4C#subset-ipsc-cardiomyocyte
    name: iPSC-derived cardiomyocytes
    description: >-
      Cardiomyocytes differentiated from KOLF2.1J iPSCs. Covered in the June 2026 release by SEC-MS
      within the KOLF2 mass spectrometry archive.
    is_data_split: false
    is_subpopulation: true

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      The dataset contains no human participants; the only demographic characteristics present are
      those of the two cell line donors, documented in the CM4AI project description preprint rather
      than in the data files themselves.
    distribution: >-
      Two donors are represented. MDA-MB-468 derives from a 51-year-old Black female with metastatic
      mammary adenocarcinoma, established from a pleural effusion metastatic site. KOLF2.1J derives
      from a healthy male Northern European donor.

