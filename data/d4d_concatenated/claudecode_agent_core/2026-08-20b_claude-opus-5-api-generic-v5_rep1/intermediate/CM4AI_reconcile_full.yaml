notes: >-
  Both the University of Virginia Dataverse collection holding this release and the CM4AI project
  website display the notice: "This repository is under review for potential modification in
  compliance with Administration directives."

source_caveats: >-
  Referent. The Dataset class admits one referent. This record describes the CM4AI data resource as
  distributed in its June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, which the source ranking
  identifies as the current authoritative release; the earlier quarterly releases are recorded as
  related datasets rather than merged into the same referent, and the October 2025 release is marked
  in the ranking as superseded by this one.
  Scope of counts. The project-wide totals reported on the CM4AI website - 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 proteins investigated, 11,739 genes targeted
  and 21.4 TB of data - describe the project as a whole and are not stated as figures for this
  release. They are therefore recorded in prose rather than in the `counts` field of any Instance
  object, and the 21.4 TB figure is not used for `total_size_bytes`.
  Size and file counts. `total_size_bytes` and each FileCollection's `total_bytes` are converted from
  the per-file sizes the Dataverse listing gives in binary units (KB, MB, GB) and are therefore
  approximate to the precision the listing reports; `total_file_count` and each `file_count` record
  distributed archives, since the bundle does not state how many files any archive contains.
  Collection timeframe. The record omits `collection_timeframes`: the bundle states an NIH award
  period of 2022-09-01 to 2026-08-31 and a Dataverse deposit date of 2025-02-27, but gives no
  measurement window for any data stream. The award period is recorded under `funders` where it
  belongs.
  Creators and roles. The Creator class carries a `principal_investigator` field, but the bundle
  identifies only Trey Ideker as principal investigator (NIH RePORTER). The remaining Creator entries
  record the corresponding and co-corresponding authors of the CM4AI project description preprint,
  who are the named leads of the project's modules and laboratories; for those parties the field
  records a responsible lead rather than an attested PI designation, and each carries a note or
  caveat to that effect. `credit_roles` is populated only where the bundle attributes a specific
  contribution - the Lundberg Lab for imaging, the Krogan laboratory for SEC-MS, the Standards module
  for packaging, and Ideker as PI - and is omitted elsewhere. The complete authorship of the release,
  which runs to 47 named authors, is preserved verbatim in the `citation` slot.
  Affiliation identifiers. ROR:0153tk833 is recorded for the University of Virginia creators because
  the June 2026 release itself gives that ROR; no other affiliation in the bundle carries a registry
  identifier, so the remaining affiliations record a name only. The same ROR is used for `publisher`
  on the reasoning that the release names the University of Virginia Dataverse as publisher and gives
  that ROR for the institution, though the bundle does not attach the identifier to the publisher
  role directly.
  Release contents versus website. Sources disagree on completeness. The CM4AI website (tier 2) lists
  AP-MS interactomes for the breast cancer flagship dataset and immunofluorescence images for the
  iPSC flagship dataset as "coming soon", whereas the June 2026 release (tier 1) includes AP-MS
  archives for paclitaxel- and vorinostat-treated MDA-MB-468 cells. The June 2026 contents are stated
  here; the iPSC imaging remains absent from the release in both accounts.
  Separate study. The Nature publication in the bundle, "Multimodal cell maps as a foundation for
  structural and functional genomics", reports a multimodal cell map of U2OS osteosarcoma cells and a
  distinct set of measurements from those released by CM4AI. It was partly supported by the same
  Bridge2AI award and shares methodology and personnel, and it is used here only for methodological
  context corroborated by the CM4AI preprint. Its numerical results - such as 5,147 proteins, 275
  assemblies, 36,842 interactions and the U2OS SEC-MS replicates - are not attributed to this
  dataset.
  Language. `language: en` is inferred from the documents themselves; the bundle makes no explicit
  statement of the language of the dataset.
  Project stage. Several methodological statements drawn from the CM4AI project description preprint
  describe the state of work in the project's first year - for example 17 genes endogenously tagged
  with 34 more in progress, and single-cell CRISPR screen data then undergoing quality control - and
  may not describe the contents of the June 2026 release.