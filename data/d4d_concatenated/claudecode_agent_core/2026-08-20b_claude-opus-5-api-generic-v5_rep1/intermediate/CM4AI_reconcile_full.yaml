direct_collection:
  - collection_details: >-
      No data were collected from individuals. All measurements were generated in the project's own
      laboratories from commercially available, de-identified human cell lines obtained from
      external repositories: MDA-MB-468 from the American Type Culture Collection and KOLF2.1J from
      the Human Induced Pluripotent Stem Cells Initiative resource. The release records human
      subjects as "No" and samples as de-identified. Because no individuals were enrolled, no
      consent, notification, revocation, compensation or at-risk-population procedures apply, and
      the corresponding slots are omitted from this record.
    is_direct: false

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    why_not_representative: >-
      Targets were chosen for disease relevance rather than sampled at random or for
      representativeness. The project design specifies multimodal interrogation of 100 chromatin
      modifiers and 100 metabolic enzymes implicated in cancer, neuropsychiatric and cardiac
      disorders, with a shared protein list carried across all cell types and treatment conditions,
      expanding to further proteins as significant hits emerge from the perturbation and interaction
      results. The CRISPRi perturbation screen in KOLF2.1J iPSCs is the exception, being expressed
      genome-scale at 11,739 targeted genes. Only two cell lines are studied, so the material is not
      a sample of any human population.

