purposes:
  - response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data, produced
      from multimodal interrogation of chromatin modifiers, metabolic enzymes and other proteins
      involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant cell lines
      under treated and untreated conditions.
  - response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning, so that machine learning models in
      genomics and precision medicine need not remain black boxes.
  - response: >-
      To stimulate research and development in "visible" machine learning systems that are built
      directly on knowledge maps of multi-scale cell and tissue architecture rather than on opaque
      predictors.
  - response: >-
      To produce ethical, AI-ready datasets, together with reusable software, standards and
      provenance packaging, and to make them available to the research community under minimally
      restrictive terms consistent with ethical guidelines, researcher attribution and research
      integrity.

addressing_gaps:
  - response: >-
      Machine learning models that predict phenotype from genotype are typically difficult-to-
      interpret black boxes, offering no account of the mechanisms by which the translation occurs.
      The dataset supplies the cell-architecture knowledge maps needed to build interpretable
      alternatives.
  - response: >-
      Complementary cell mapping technologies - imaging, biochemical proteomics and genetic
      perturbation - have typically been applied separately. The dataset provides matched
      multimodal measurements over shared protein sets in the same cellular contexts so that the
      modalities can be integrated.
  - response: >-
      Much of human subcellular architecture remains uncharted, and existing resources do not cover
      how that architecture changes across treatment conditions, differentiation states and
      disease-relevant cell types. The dataset interrogates perturbed and unperturbed conditions in
      matched cell lines to address that gap.
  - response: >-
      Training a biomedical workforce fluent in both data science and life science requires
      datasets prepared to explicit AI-readiness criteria. The release supplies FAIR, provenanced,
      characterized, explainable and ethically prepared data intended for that purpose.

tasks:
  - response: >-
      Construction of multi-scale hierarchical cell maps by self-supervised integration of protein
      imaging and protein-protein interaction data followed by community detection at multiple
      resolutions.
  - response: >-
      Interpretable genotype-phenotype learning, including training and evaluation of visible
      machine learning systems and visible neural networks whose internal structure follows cell
      architecture.
  - response: >-
      Identification and annotation of protein assemblies, complexes and subcellular compartments,
      including alignment to Gene Ontology and Reactome and large language model assisted naming of
      assemblies.

acquisition_methods:
  - acquisition_details: >-
      Immunofluorescence images were acquired by direct measurement: MDA-MB-468 cells were fixed,
      permeabilized, stained by immunofluorescence-based staining (ICC-IF) with antibodies against
      each protein of interest plus reference markers, and imaged by confocal microscopy.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      Protein-protein interactions were measured directly by affinity purification-mass spectrometry
      (AP-MS) on endogenously tagged MDA-MB-468 cells under treatment conditions.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      Protein complex and interaction profiles were measured directly by size-exclusion
      chromatography coupled to mass spectrometry (SEC-MS) applied proteome-wide to cell lysates.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      Transcriptional and fitness phenotypes were measured directly by single-cell CRISPRi
      perturbation screens (perturb-seq) in cells carrying an inducible dCas9 and a lentiviral guide
      RNA library.
    was_directly_observed: true
    was_reported_by_subjects: false
  - acquisition_details: >-
      Summary products distributed in the release, such as the expressed genome-scale CRISPRi
      Perturbation Cell Atlas mapping transcriptional and fitness phenotypes for 11,739 targeted
      genes, are derived from the underlying single-cell measurements rather than observed directly.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      Spatial proteomics mapping by immunofluorescence: automated fixation and permeabilization
      protocols implemented on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines, staining
      with Human Protein Atlas antibodies, and confocal imaging in the Lundberg Laboratory at
      Stanford University. Each image carries four channels: nuclei stained with DAPI (blue
      channel), endoplasmic reticulum with a calreticulin antibody (yellow channel), microtubules
      with a tubulin antibody (red channel), and the antibody against the protein of interest
      (green channel).
  - mechanism_details: >-
      Affinity purification-mass spectrometry on endogenously tagged cell lines, used to map
      protein-protein interactions of chromatin regulators under untreated, paclitaxel and
      vorinostat conditions. The CM4AI preprint reports 17 genes endogenously tagged in MDA-MB-468
      with AP-MS acquired under the three conditions and 34 further genes in progress at the time of
      writing.
  - mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry for proteome-wide complex and
      interaction mapping, performed in the Nevan Krogan laboratory at the University of California
      San Francisco as an orthogonal approach to AP-MS.
  - mechanism_details: >-
      Single-cell CRISPRi perturbation screens using a CRISPR lentiviral library with six guide RNAs
      per gene, cell lines engineered to express inducible dCas9, and the 10x Genomics 3'HT kit for
      single-cell capture and sequencing.

