purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset that
      enables artificial intelligence and machine learning research into type 2 diabetes mellitus,
      including salutogenesis - the pathway from disease back to health - which is poorly understood
      relative to pathogenesis.
  - response: >-
      To support downstream pseudotime manifold analysis, an approach for predicting disease
      trajectories by learning from complex multimodal data gathered from participants spanning a
      range of disease severity, from no diabetes to insulin-dependent type 2 diabetes, so that a
      temporal atlas of T2DM development and reversal can be reconstructed without relying on
      existing classification criteria.
  - response: >-
      To establish and demonstrate standards, best practices and guidelines for the collection,
      preparation and sharing of health data intended for AI/ML, so that the dataset can serve as a
      model for future data generation projects.

addressing_gaps:
  - response: >-
      Existing large datasets available for AI/ML training in diabetes are not AI ready: they
      require substantial reformatting and preprocessing, and lack the harmonized structure and
      standardized terminologies needed for immediate model development.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as type
      2 diabetes has been limited by the absence of well-designed, high-quality, large and inclusive
      multimodal datasets that capture molecular, physiological, pathological and clinical states at
      different stages of illness.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published between 2000 and 2020 found
      that samples lacked racial and ethnic diversity. Recruiting a cohort approximately balanced
      across Asian, Black, Hispanic and White participants is intended to address that demographic
      inequity in the training data available for AI/ML.
  - response: >-
      Claims data and electronic health record data do not support many downstream AI/ML analyses
      because they lack the breadth of concurrently collected domains - imaging, wearable, physiologic
      signal, environmental and survey data - that the AI-READI acquisition protocol was designed to
      provide for every participant.

tasks:
  - response: >-
      Pseudotime manifold analysis to reconstruct disease trajectories across the four diabetes
      severity groups and to characterize salutogenic pathways back to health.
  - response: >-
      Development and evaluation of multimodal machine learning models that combine imaging,
      waveform, wearable, environmental, laboratory and survey data for a single participant.
  - response: >-
      Training and benchmarking of models using the recommended 70/15/15 participant-level splits,
      which are balanced as far as possible for sex, race/ethnicity and diabetes status.

instances:
  - instance_type: Individual human research participant
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    notes: >-
      Each instance is one participant and consists of all data available for that individual across
      the modalities collected. There is currently one study visit per participant; approximately 10%
      of the cohort is planned to be invited for a follow-up visit in year 4 of the project, which is
      not part of this release. All instances belong to the same prospective data generation project
      and are linked across directories by a single participant identifier used consistently in every
      datatype, modality and device folder and in the participants.tsv metadata file; because there is
      only one visit per participant, no within-participant longitudinal relationships exist in this
      version. The single permitted data_topic value records the primary subject, type 2 diabetes; the
      release also spans ophthalmic imaging, mHealth, waveform and glucose monitoring topics, which
      this slot cannot represent.

