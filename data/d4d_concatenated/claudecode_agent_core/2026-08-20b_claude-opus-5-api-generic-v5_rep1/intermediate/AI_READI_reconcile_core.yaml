data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  committee_contact:
    id: ORCID:0000-0002-7452-1648
    name: Aaron Lee
  access_review_process: >-
    FAIRhub records the access type as PublicDownloadSelfAttestationRequired. Obtaining the dataset
    requires logging in through a verified ID system, agreeing to use the data only for type 2
    diabetes related research, and accepting the AI-READI custom license v2.0, which sets
    restrictions and obligations on data usage. Requesters indicate in the data request workflow
    whether they are contracting as an individual or on behalf of a named internal group, lab or
    business unit within an identified institution or employer; the information provided in that
    workflow forms an integral part of the license agreement. Access to the fuller controlled variant
    of the dataset requires entering into a data use agreement.
  stewardship_roles:
    - >-
      The data manager at each data collection site is responsible for the quality control of all data
      before uploading to FAIRhub.
    - >-
      The central project team performs the standardization, curation and packaging of the data for
      release, and the AI-READI team supports and maintains the released dataset.
    - >-
      Washington University in St. Louis is recorded as the managing organization and lead sponsor,
      and Aaron Lee as the responsible-party principal investigator and central contact.
  source_caveats: >-
    The RO-Crate metadata names the data governance committee as the AI-READI Consortium and is
    followed here; the BMJ Open protocol publication instead refers to a Data Access Committee that
    was, at the time of that publication, still developing the requirements for controlled-access
    datasets, and states that procedures for reviewing and prioritising written requests for
    biorepository specimens were also still to be developed. FAIRhub records the managing
    organization and lead sponsor as Washington University in St. Louis (ROR 01yc7t268), whereas NIH
    RePORTER lists the awardee organization as the University of Washington and the same RO-Crate
    gives the principal investigator's department as Ophthalmology, University of Washington.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    AI-READI Data License Agreement version 2.0, issued by Washington University in St. Louis as
    Licensor and published at https://doi.org/10.5281/zenodo.17555036. It grants a non-exclusive,
    non-transferable license to download, reproduce and use the data and to create derivative works,
    for research and for commercial and non-commercial purposes, and permits sublicensing to
    authorized users who are legal members of a named authorized group within the licensee's
    institution. Data may be shared only with other licensees bound by identical terms, and may be
    stored only on servers and devices maintained within the licensee's institution or on cloud or
    backup services covered by a HIPAA Business Associate Agreement with that institution. Derivative
    data, including synthetic data generated from the data, are themselves treated as data and are
    subject to every restriction. Models, algorithms and programs trained or adapted on the data may
    be distributed provided they do not themselves contain the data and provided the licensee has
    taken all reasonable steps to minimize the likelihood that data can be memorized, derived,
    reconstructed or reconstituted from them. In publications, only small representative samples may
    be reproduced, in up to five images or figures per paper. Licensees must acknowledge the licensor,
    the source and any funder of the data, and must comply with NIH Genomic Data Sharing Policy
    security best practices. The agreement terminates automatically on any breach, whereupon all
    copies must be deleted. Title and all industrial and intellectual property rights in the data
    remain solely and exclusively with the licensor and its suppliers; any rights not expressly
    granted are reserved. The data are provided "as is" without warranty, the licensor's aggregate
    liability is capped at one US dollar except where law prohibits such limitation, and the licensee
    indemnifies the licensor against claims arising from its use of the data or from any model it
    distributes.
  notes: >-
    The license was written specifically to enable reuse of the AI-READI dataset, and other clinical
    datasets, for commercial or research purposes while imposing strong requirements around data
    usage, security and secondary sharing to protect study participants, particularly where data are
    reused for AI and machine learning applications. The canonical license URI is
    https://doi.org/10.5281/zenodo.17555036; an earlier statement of license terms for the dataset is
    archived at https://doi.org/10.5281/zenodo.10642459. The dataset is distributed to third parties
    outside the creating organization and is available for public use through the FAIRhub platform;
    onward transfer by a licensee is tightly constrained, in that data may be given only to another
    licensee bound by an identical agreement, and never to a third-party model vendor or developer for
    training or development purposes even where that vendor holds a Business Associate Agreement with
    the licensee's institution, although a third-party model may be used to analyze the data where the
    vendor holds such an agreement and the interaction is short-term, such as prompting or querying,
    and is not used for training.

ip_restrictions:
  restrictions:
    - >-
      Title to the data, and all industrial and intellectual property rights in it, remain solely and
      exclusively with the licensor, Washington University in St. Louis, and its suppliers; the
      licensee must take no action inconsistent with that ownership and any rights not expressly
      granted by the license are reserved.
    - >-
      Publishers and conference organizers who wish to reproduce more than the permitted small
      representative samples must obtain a separate license from the licensor.
  notes: >-
    The healthsheet records that no third party has imposed IP-based or other restrictions on the
    data associated with the instances beyond those set out in the license.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  other_compliance: >-
    The study is recorded as involving no FDA-regulated drug and no FDA-regulated device. Licensees
    must comply with the data security and privacy standards established by the NIH under its Genomic
    Data Sharing Policy, the current version of which is the NIH Security Best Practices for
    Controlled-Access Data Subject to the NIH GDS Policy, and with all applicable laws, regulations
    and restrictions relating to the distribution and use of the data and of models built from it.
    The RO-Crate records the confidentiality level as HL7:2N (normal). The license and the FAIRhub
    access record do not state any export control restriction; the healthsheet answers the question
    about export controls and regulatory restrictions by referring to the license.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    access_urls:
      - https://fairhub.io/datasets/3/access
  - format: CSV
    media_type: text/csv
  - format: JSON
    media_type: application/json
  - format: Markdown
    media_type: text/markdown

distribution_dates:
  - release_dates:
      - '2024-05-03: version 1.0.0, from the pilot data collection phase (204 participants)'
      - '2024-11-08: version 2.0.0, adding the first full year of the study (1,067 participants)'
      - '2025-11-17: version 3.0.0, the current release (2,280 participants)'
    notes: >-
      Releases are approximately annual. The BMJ Open protocol publication describes the first public
      release as having been made available in May 2024 and the release covering all data collected
      through 31 July 2024 as having been made available in November 2024.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and existing versions are not updated in place;
    instead, a new version is released with additional instances as more study participants complete
    the study visit. Changes between versions are documented in detail in the CHANGELOG file included
    with the dataset and mirrored at docs.aireadi.org. Between version 2.0.0 and version 3.0.0 the
    participant count rose from 1,067 to 2,280, three further imaging devices were added, processing
    moved further towards automation, the Snellen visual acuity variables were dropped in favour of
    logMAR only, and a recommended training/validation/test split was introduced. Enrolment is
    ongoing, so further versions with larger cohorts are expected.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
    - '1.0.0 - 10.60775/fairhub.1, released 3 May 2024'
    - '2.0.0 - 10.60775/fairhub.2, released 8 November 2024'
    - '3.0.0 - 10.60775/fairhub.3, released 17 November 2025'
  version_details: >-
    Each version has its own DOI and its own documentation set, selectable from the version dropdown
    at docs.aireadi.org. Version 2.0.0 is marked on FAIRhub as no longer accessible, and its
    documentation carries a notice directing users to the latest version; a datasheet exists for
    version 1.0.0 (docs.aireadi.org/docs/1/dataset/healthsheet) and for version 2.0.0
    (docs.aireadi.org/docs/2/dataset/healthsheet). The healthsheet states that older versions will
    not continue to be supported because the dataset is not updated in place.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants were
    not told that their data would be retained for a fixed period and then deleted. Licensees,
    however, must delete all copies of the data in their possession and control, including copies
    held by their authorized users, upon termination of the license agreement.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others outside the project to extend, augment or contribute
    to the AI-READI dataset.

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes mellitus
    examples:
      - Pseudotime manifold analysis to reconstruct disease trajectories and salutogenic pathways.
      - Multimodal model development combining imaging, waveform, wearable, environmental and clinical data.
      - Research into salutogenesis, the pathway from type 2 diabetes back to health.
    usage_notes: >-
      Accessing the public dataset requires agreeing to use the data only for type 2 diabetes related
      research; broader use requires the controlled variant and a data use agreement. The dataset is
      shared as "AI-ready", meaning it is intended to support AI/ML work without further reformatting
      and preprocessing.
  - use_category: Pipeline and infrastructure development
    examples:
      - Development and testing of data processing pipelines against the smaller mini subset released alongside version 3.0.0.
    usage_notes: >-
      The mini subset exists so that pipeline work does not require downloading the full 3.82 TB
      release.

other_tasks:
  - task_details: >-
      The dataset was assembled to be hypothesis agnostic, with a protocol composed of assessments
      from many health domains likely to be affected by type 2 diabetes rather than from a
      pre-specified analysis plan. It may therefore support analyses the creators did not plan,
      including work on cardiac, renal, ophthalmic, cognitive, sleep, physical activity and indoor
      environmental exposure measures, subject to the license condition that the public version be
      used only for type 2 diabetes related research.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited, because the dataset is
      intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or with other information, to compromise the
      confidentiality of information about a data subject, to invade or compromise their privacy, to
      identify or contact a data subject or group of data subjects, to extract or extrapolate
      identifying information, to establish a data subject's membership in a particular group, or
      otherwise to cause harm or injury to a data subject, is prohibited under the license.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for training or
      development purposes - that is, for model weight modification or other adjustment of a model's
      logic or operation - is prohibited even where the vendor holds a Business Associate Agreement
      with the licensee's institution.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or otherwise
      conveying any portion of the data or of any derivative work to a third party who is not an
      other licensee bound by an identical agreement is prohibited.
  - prohibition_reason: >-
      Reproducing the data in papers, articles, presentations, analyses, reports or publications
      beyond small representative samples in up to five images or figures per paper, or publishing
      larger amounts of data via supplemental files, zip archives, code packages or other means, is
      prohibited notwithstanding journal or conference requirements; publishers and conference
      organizers who need more must obtain a separate license.
  - prohibition_reason: >-
      Storing the data anywhere other than on servers and devices maintained by and located within the
      licensee's institution, or on cloud or remote storage and backup services covered by a
      HIPAA-approved Business Associate Agreement with that institution, is prohibited.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking applied to identify the
      licensee is prohibited, because the watermark exists for security purposes.

future_use_impacts:
  - impact_details: >-
      Because AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification, there is a theoretical risk that future analyses could
      re-identify participants. The project's response is a robust data dissemination system, a strict
      license agreement and data watermarking applied to both the public and the controlled sets.
  - impact_details: >-
      No uses of the dataset that could result in unfair treatment of individuals or groups are
      currently anticipated by the creators, but the composition of the cohort - deliberately balanced
      rather than population-representative, restricted to English-speaking adults aged 40 and older
      recruited from three urban academic health systems, and excluding groups such as Pacific
      Islanders and Native Americans - constrains what conclusions future users can legitimately draw
      about populations at large.

existing_uses:
  - examples:
      - >-
        None. The healthsheet states that the dataset has not been used for any tasks at the time of
        publication, and FAIRhub records zero citations for this version at the time the metadata
        were captured.

use_repository:
  - repository_details: >-
      There is no repository linking to papers or systems that use the dataset, beyond ordinary
      literature search. FAIRhub displays "Cited by" and "Mentions" counters on the dataset landing
      page, recording zero citations for version 3.0.0 at the time the metadata were captured.

source_caveats: >-
  The record describes version 3.0.0 of the FAIRhub-distributed dataset, the referent shared by the
  tier-1 FAIRhub dataset page, the FAIRhub API metadata and the RO-Crate metadata. Several facts about
  the wider AI-READI study - the 4,000-participant enrolment target, the year 4 longitudinal arm, the
  biorepository at the University of Alabama at Birmingham, and the controlled-access variant - are
  described in the sources but are properties of the study or of a different distribution rather than
  of this release, and are recorded here only where they bear on how this release should be read. The
  project name is expanded as "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights"
  in the BMJ Open protocol publication and as "Artificial Intelligence Ready and Exploratory Atlas for
  Diabetes Insights" in the NIH RePORTER record, the healthsheet, the README and the FAIRhub study
  title; both readings appear in the bundle and neither is corrected here. The institutional
  attribution is internally inconsistent across tier-1 sources: FAIRhub records Washington University
  in St. Louis (ROR 01yc7t268) as managing organization, lead sponsor and the affiliation of the
  responsible-party principal investigator, while the same RO-Crate gives that investigator's
  department as Ophthalmology, University of Washington, NIH RePORTER lists the awardee organization as
  University of Washington, and the IRB protocol is a University of Washington protocol. Cohort counts
  differ by version: 204 participants in v1.0.0, 1,067 in v2.0.0 and 2,280 in v3.0.0; the healthsheet's
  versioning section describes v3.0.0 as covering data "up through the end of the second year of the
  study" while its collection section and the FAIRhub metadata both give the collection window as
  19 July 2023 to 1 May 2025, and the README changelog labels the increments "year 2 data" and
  "year 3 data". The keywords recorded above are those attested by FAIRhub, the RO-Crate and the
  FAIRhub study-description keyword list; terms such as "type 2 diabetes" and "salutogenesis" are
  pervasive in the bundle as subject matter but are not attested as keywords by any source and are
  therefore not listed. The NIH award number OT2OD032644 is stated by every tier of the bundle but no
  award CURIE or registry identifier for it is supplied by any source, so the Grant object carries the
  FAIRhub award URI as its identifier and the award number in a note. The core schema provides no
  slot for per-instance variable metadata, so the laboratory assays, device measures and their units
  and reference ranges are summarized within collection_mechanisms rather than enumerated; the
  CoreDistribution objects likewise carry no file-count field, so per-directory file counts are
  recorded in notes alongside the byte sizes, and the DICOM and WFDB collections, whose formats have
  no matching enum value, record their media type in notes.

notes: >-
  The recommended participant-level partition is 70% training (1,576 participants), 15% validation
  (352) and 15% testing (352), distributed in participants.tsv and detailed in the resources section
  above. The recommended citation is: AI-READI Consortium. (2025). Flagship Dataset of Type 2 Diabetes
  from the AI-READI Project (3.0.0) [Data set]. FAIRhub. https://doi.org/10.60775/fairhub.3. The
  FAIRhub dataset pages and the AI-READI documentation site both carry a banner stating that the
  repository is under review for potential modification in compliance with Administration directives;
  FAIRhub reports 24,636 views and zero recorded citations for this version at the time the metadata
  were captured.