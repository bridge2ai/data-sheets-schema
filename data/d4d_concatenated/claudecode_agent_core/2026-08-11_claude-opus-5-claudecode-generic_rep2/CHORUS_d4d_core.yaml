id: https://chorus4ai.org/
name: CHoRUS
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
description: The CHoRUS dataset is a multi-center, multi-modal, high-resolution critical care dataset
  generated by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable
  AI project, one of four data generation projects in the NIH-funded Bridge2AI consortium. It assembles
  retrospectively collected clinical data contributed by 14 hospitals within a network of 20 academic
  centers, covering admissions to intensive, pediatric intensive and neonatal intensive care units. Modalities
  include structured electronic health record data standardized to the OMOP Common Data Model (demographics,
  diagnoses, procedures, medication administration and nursing flowsheets), clinical notes extracted and
  tokenized with the OHNLP toolkit, imaging drawn from hospital PACS in DICOM, waveform telemetry from
  bedside monitors in WFDB, and EEG waveforms in EDF+ and Persyst formats. The project website describes
  a current released dataset of 50,000 patient admissions from ICU, PICU and NICU comprising 1.6 billion
  rows of EHR OMOP data, 7,642 admissions with radiology data and 23 Tb of waveform data, and an anticipated
  final dataset of 100,000 patient admissions across 9 data modalities from 14 data contributing hospitals.
  Every data type is under controlled access. The project's stated goal is a publicly available, AI-ready
  critical care dataset supporting characterization of acute and critical illness, prediction of complications
  and measurement of treatment response, together with a holdout test set provisioned for external validation
  of models.
status: In progress. The project website distinguishes a "Current Released Dataset" from a larger "Anticipated
  Final Dataset", and a September 2025 informational webinar reports that imaging de-identification and
  EEG extraction were still under way as of August 2025.
page: https://chorus4ai.org/
