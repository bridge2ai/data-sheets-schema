source_caveats: 'Four sources were consulted and they describe the dataset at different dates and at different
  scopes; disagreeing figures are recorded separately rather than merged. The project website''s snapshot
  reports a current released dataset of 50,000 patient admissions, while the September 2025 AIM-AHEAD
  informational webinar reports 14 hospitals with over 45,000 unique admissions as of August 2025; neither
  states whether the two count the same cohort. The NIH RePORTER abstract describes a target of more than
  100,000 critically ill patients, and the website an anticipated final dataset of 100,000 patient admissions.
  The webinar''s data-type table survives PDF extraction with its column alignment broken: data type,
  data standard and access control could be recovered from the ordering, but the "Metadata" column and
  the "Published metadata schema" column could not be assigned to individual rows with confidence, so
  only the unambiguous pairings are recorded and the per-row metadata availability is not. One of the
  five OMOP rows is documented as "Yes (OMOP schema with extensions)" but the extraction does not identify
  which row. The MIT License stated in the CHoRUS GitHub organization README applies to that software
  project (one repository in the same listing carries Apache-2.0); no license is stated anywhere in the
  bundle for the dataset itself, which is instead governed by a licensing agreement signed at registration,
  so no dataset license is asserted here. The project website carries the banner "This repoitory is under
  review for potential modification in compliance with Administration directives" and gives its program-manager
  contact address as cmccrary@mgh.havard.edu; both are transcribed as printed, including the apparent
  misspellings. The keywords are transcribed from the "Preferred terms" list on the NIH RePORTER project
  page and are therefore project-level index terms rather than dataset-level ones. The GitHub organization
  overview is a 2025-11-14 capture that the source manifest retains as a historical supplement because
  the current project website does not preserve its repository, SOP, standards and tooling detail; values
  taken from it are dated accordingly.'
purposes:
- id: d4d:CHORUS-purpose-ai-ready-critical-care-dataset
  name: Generate an AI-ready critical care dataset
  response: To generate data for ML/AI applications aimed at characterizing acute and critical care illness,
    predicting complications, and measuring treatment response among patients with acute or critical illness.
  description: The NIH RePORTER abstract states the project's overarching goal as developing a publicly
    available, AI-ready critical care dataset while ensuring the methods promote privacy, accountability
    and clinical benefit, and while promoting a new generation of AI clinicians and scientists. The CHoRUS
    GitHub organization states the goal as developing the most diverse, high-resolution, ethically sourced,
    AI-ready data set to answer the grand challenge of improving recovery from acute illness.
- id: d4d:CHORUS-purpose-external-validation-holdout
  name: Provision a holdout test set for external validation
  response: To provision a holdout test set, accessible for model external validation, to aid marketplace
    adoption of AI-developed models for implementation in acute and critical care.
- id: d4d:CHORUS-purpose-ethically-sourced-data-and-best-practices
  name: Create ethically sourced datasets and best practices for AI in health
  response: As one of four data generation projects in the NIH-funded Bridge2AI consortium, to work with
    the other projects to create ethically sourced datasets and tools around artificial intelligence and
    to create best practices for AI in health.
tasks:
- id: d4d:CHORUS-task-characterize-critical-illness
  name: Characterize acute and critical care illness
  response: Characterizing acute and critical care illness in patients with acute or critical illness.
- id: d4d:CHORUS-task-predict-complications
  name: Predict complications
  response: Predicting complications among patients with acute or critical illness.
- id: d4d:CHORUS-task-measure-treatment-response
  name: Measure treatment response
  response: Measuring treatment response among patients with acute or critical illness.
- id: d4d:CHORUS-task-improve-recovery-from-acute-illness
  name: Improve recovery from acute illness
  response: Building machine-learning and artificial-intelligence-derived models to improve the care and
    outcomes of patients requiring critical care, addressed by the CHoRUS Network as the grand challenge
    of improving recovery from acute illness.
addressing_gaps:
- id: d4d:CHORUS-gap-ai-infrastructure-in-critical-care
  name: Lack of infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence and machine
    learning in critical care, and developing high-resolution multi-center data sets is a critical first
    step towards actionable and trustworthy AI.
- id: d4d:CHORUS-gap-diverse-high-resolution-data
  name: Absence of a diverse, high-resolution, ethically sourced critical care dataset
  response: No sufficiently diverse, high-resolution, ethically sourced, AI-ready critical care data set
    existed; CHoRUS acquires one of unprecedented diversity and high resolution across a multi-center
    network.
- id: d4d:CHORUS-gap-multimodal-standards
  name: Absence of unified standards across clinical data modalities
  response: Unified standards were needed to harmonize multi-modal EHR, waveform, imaging and text data,
    together with validated semantic mappings connecting clinical data in various source formats to international
    standards.
