instances:
- id: d4d:CHORUS-instance-patient-admission
  name: Patient admission
  instance_type: patient admission
  counts: 50000
  description: The project website's snapshot of the current released dataset reports 50,000 patient admissions
    from ICU, PICU and NICU, comprising 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology
    data and 23 Tb of waveform data. The anticipated final dataset is reported as 100,000 patient admissions,
    9 different data modalities and 14 data contributing hospitals.
  source_caveats: The September 2025 informational webinar gives a different figure for a different date
    — 14 hospitals with over 45,000 unique admissions as of August 2025 — and does not state whether it
    counts the same released cohort. The NIH RePORTER abstract describes acquiring an AI-ready data set
    from more than 100,000 critically ill patients, which counts patients rather than admissions.
- id: d4d:CHORUS-instance-demographics
  name: Demographics
  instance_type: demographics record
  description: Demographic data standardized to the OMOP Common Data Model and held under controlled access.
- id: d4d:CHORUS-instance-diagnoses
  name: Diagnoses
  instance_type: diagnosis record
  description: Diagnoses documented by providers, standardized to the OMOP Common Data Model and held
    under controlled access.
- id: d4d:CHORUS-instance-procedures
  name: Procedures
  instance_type: procedure record
  description: Procedures documented by providers, standardized to the OMOP Common Data Model and held
    under controlled access.
- id: d4d:CHORUS-instance-medication-administration
  name: Medication administration
  instance_type: medication administration record
  description: Medication administration with dosing time-stamped upon each infusion change or dose administration,
    standardized to the OMOP Common Data Model and held under controlled access.
- id: d4d:CHORUS-instance-nursing-flowsheets
  name: Nursing flowsheets
  instance_type: nursing flowsheet record
  description: High-frequency nursing flowsheet documentation, standardized to the OMOP Common Data Model
    and held under controlled access.
- id: d4d:CHORUS-instance-clinical-notes
  name: Clinical notes
  instance_type: clinical note
  description: Clinical notes extracted and tokenized using the OHNLP toolkit, held under controlled access,
    with a published metadata schema recorded as the OHNLP open source schema. As of August 2025 the notes
    themselves are stored locally at the contributing sites and only the tokens are held in the enclave.
- id: d4d:CHORUS-instance-imaging
  name: Imaging
  instance_type: imaging study
  counts: 1000
  description: Imaging drawn from hospital PACS in DICOM, held under controlled access, with a published
    metadata schema recorded as the DICOM schema. The September 2025 webinar reports that 1,000 images
    were available as of August 2025 with de-identification in process for a larger cohort.
  source_caveats: The count of 1,000 is the number of images reported available in August 2025; the project
    website separately reports 7,642 admissions with radiology data in the current released dataset. The
    two figures count different things (images versus admissions) and are not reconciled by any source
    in the bundle.
- id: d4d:CHORUS-instance-waveform-telemetry
  name: Waveform telemetry
  instance_type: physiological waveform recording
  description: Waveform telemetry captured from bedside monitors via gateway/middleware, distributed in
    WFDB, held under controlled access, with a published metadata schema recorded as the PhysioNet schema
    extended. The project website reports 23 Tb of waveform data in the current released dataset.
- id: d4d:CHORUS-instance-waveform-eeg
  name: Waveform EEG
  instance_type: EEG recording
  description: EEG waveforms drawn from the hospital EEG database in EDF+ and Persyst formats, held under
    controlled access, with a published metadata schema recorded as the open source EDF+ and Persyst schema.
    As of August 2025 EEG extraction was still in process.
subpopulations:
- id: d4d:CHORUS-subpopulation-care-unit-and-demographics
  name: Care unit type and demographic subpopulations
  subpopulation_elements_present: true
  identification: Admissions are identified by care unit — ICU, PICU and NICU — and demographic elements
    are carried in the OMOP Common Data Model. The NIH RePORTER abstract states that data elements feature
    appropriate contextual factors such as geographic distance to the nearest hospital, and that social
    determinants of health are among the acquired data.
  distribution: The project website reports 50,000 patient admissions from ICU, PICU and NICU in the current
    released dataset without giving a breakdown by unit, and no source in the bundle gives a demographic
    distribution.
sensitive_elements:
- id: d4d:CHORUS-sensitive-elements
  name: Sensitive clinical data from critically ill patients
  sensitive_elements_present: true
  sensitivity_details: 'The dataset comprises hospital records of critically ill patients: demographics,
    diagnoses, procedures, medication administration, nursing flowsheets, clinical notes, imaging from
    PACS, telemetry and EEG waveforms, and social determinants of health. Every data type is listed as
    controlled access. The project describes patient-focused efforts to determine the ethical and legal
    approaches to manage privacy and bias while accounting for social determinants of health.'
confidential_elements:
- id: d4d:CHORUS-confidential-elements
  name: Confidential elements retained at contributing sites
  confidential_elements_present: true
  confidentiality_details: As of August 2025 clinical notes are stored locally at contributing sites and
    only tokens are held in the enclave; imaging de-identification was in process for a larger cohort.
    All modalities are under controlled access, reachable only after registration, a signed licensing
    agreement and provisioning of compute.
known_limitations:
- id: d4d:CHORUS-limitation-modality-coverage
  name: Modality coverage incomplete as of August 2025
  limitation_type: coverage_limitation
  limitation_description: The September 2025 informational webinar reports that OMOP and telemetry data
    were in the enclave, but that clinical notes were stored locally except for tokens, that imaging had
    1,000 images available with de-identification in process for a larger cohort, and that EEG extraction
    was still in process.
  scope_impact: Analyses depending on full-text clinical notes, on imaging at cohort scale, or on EEG
    were not supported by the data available at that date.
- id: d4d:CHORUS-limitation-in-progress-release
  name: Released dataset is smaller than the anticipated final dataset
  limitation_type: temporal_limitation
  limitation_description: The project website distinguishes a current released dataset of 50,000 patient
    admissions from an anticipated final dataset of 100,000 patient admissions across 9 data modalities
    and 14 data contributing hospitals, so the released data represent an intermediate state of an ongoing
    acquisition.
  scope_impact: Cohort size, modality coverage and hospital coverage at the time of use may differ from
    both the figures recorded here and the anticipated final figures.
  source_caveats: Neither source frames these facts as a limitation; the framing is this datasheet's,
    and the underlying statements are quoted from the project website and the September 2025 informational
    webinar.
missing_data_documentation:
- id: d4d:CHORUS-missing-data-modality-availability
  name: Modalities not yet available in the enclave
  missing_data_patterns: As of August 2025, full clinical note text was absent from the enclave (only
    tokens were present), imaging was limited to 1,000 images, and EEG data were not yet extracted.
  missing_data_causes: Clinical notes are stored locally at the contributing sites; imaging de-identification
    was in process for a larger cohort; EEG extraction was in process.
  handling_strategy: Tokenized representations of clinical notes produced with the OHNLP toolkit are held
    in the enclave in place of the full text, and the remaining modalities were being de-identified and
    extracted for later release.
acquisition_methods:
- id: d4d:CHORUS-acquisition-retrospective-clinical-records
  name: Retrospective extraction of clinical records
  was_directly_observed: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details: 'Data are collected retrospectively from records generated in the course of clinical
    care: structured EHR documentation by providers, nursing flowsheet documentation, imaging from PACS,
    telemetry from bedside monitors via gateway/middleware, and EEG from the hospital database. Derived
    elements are also produced — clinical notes are tokenized with the OHNLP toolkit, data are transformed
    using approaches that limit re-identification, and contextual factors such as geographic distance
    to the nearest hospital are added, with OMOP Location entities geocoded via DeGauss. Contributed extracts
    are checked: SOP documents have undergone an internal validation and review process, a clinical validation
    SOP governs semantic mapping contributions, and characterization reports are returned to sites following
    their data submissions.'
collection_mechanisms:
- id: d4d:CHORUS-collection-site-extract-and-upload
  name: Site data extract creation and upload
  mechanism_details: Data managers at data contributing sites follow the step-by-step process described
    by the Chorus_SOP interactive workflow diagram to extract and contribute clinical data to CHoRUS,
    with tooling to create and upload a CHoRUS Data Extract. Services supporting the transfer are deployed
    as dockerized container applications on Azure.
  used_software:
  - id: d4d:CHORUS-software-chorus-extract-upload
    name: chorus-extract-upload
    description: Repository in the chorus-ai GitHub organization with tools to create and upload a CHoRUS
      Data Extract; listed as Python and MIT-licensed in the 2025-11-14 capture.
    license: MIT
  - id: d4d:CHORUS-software-chorus-container-apps
    name: chorus-container-apps
    description: Set of dockerized container applications and associated configurations to be deployed
      to support CHoRUS services on Azure; listed as JavaScript in the 2025-11-14 capture.
- id: d4d:CHORUS-collection-clinical-notes
  name: Clinical note extraction and tokenization
  mechanism_details: Clinical notes are extracted and tokenized using the OHNLP toolkit; the notes themselves
    remain stored locally at the contributing sites and only the tokens are held centrally.
  used_software:
  - id: d4d:CHORUS-software-ohnlp-toolkit
    name: OHNLP toolkit
    description: Toolkit named by the September 2025 informational webinar as the means by which clinical
      notes are extracted and tokenized; the corresponding data standard is recorded as OHNLP with an
      open source schema.
- id: d4d:CHORUS-collection-imaging
  name: Imaging retrieval from PACS
  mechanism_details: Imaging is drawn from hospital PACS and distributed in DICOM, with de-identification
    in process for a cohort larger than the 1,000 images available as of August 2025.
- id: d4d:CHORUS-collection-waveform-telemetry
  name: Waveform telemetry capture from bedside monitors
  mechanism_details: Waveform telemetry is captured from bedside monitors through gateway/middleware and
    distributed in WFDB, with the metadata schema recorded as the PhysioNet schema extended.
  used_software:
  - id: d4d:CHORUS-software-chorus-waveform
    name: chorus_waveform
    description: Repository in the chorus-ai GitHub organization holding CHoRUS waveform documentation
      and various waveform conversion scripts; listed as Jupyter Notebook and MIT-licensed in the 2025-11-14
      capture. A companion repository, chorus_waveform_resources, holds resources which support the preparation
      and release of waveforms.
    license: MIT
- id: d4d:CHORUS-collection-eeg
  name: EEG extraction from the hospital database
  mechanism_details: EEG waveforms are extracted from the hospital EEG database and distributed in EDF+
    and Persyst formats; extraction was still in process as of August 2025.
sampling_strategies:
- id: d4d:CHORUS-sampling-balanced-diverse-cohort
  name: Sampling for a balanced and diverse cohort
  is_sample: true
  source_data: Retrospective clinical records from 14 data contributing hospitals within a network of
    20 academic centers, covering ICU, PICU and NICU admissions.
  strategies: The project establishes a legal framework for collecting data at scale and samples to ensure
    comprehensive sets of patient conditions and clinical treatment strategies. Federated access is described
    as enabling sampling methods to ensure a balanced and diverse cohort. The project's stated aim is
    the most diverse, high-resolution, ethically sourced, AI-ready data set.
  source_caveats: The bundle states the sampling aim but no achieved representativeness, so no representativeness
    claim is recorded here.
data_collectors:
- id: d4d:CHORUS-collector-data-site-managers
  name: Data site managers at contributing sites
  role: Data extraction and submission
  collector_details: Data managers at data contributing sites extract and contribute clinical data following
    the Chorus_SOP workflow, and provide regular status updates on their progress in creating and curating
    a CHoRUS-specific clinical data extract, submitted either through the GitHub interface or through
    a Google Form.
- id: d4d:CHORUS-collector-chorus-subteams
  name: CHoRUS sub-teams
  role: Standards, data acquisition and tooling
  collector_details: The CHoRUS data generation project is organised into sub-teams for Standards, Data
    Acquisition and Tooling, which compile the recordings and documentation referenced by the SOP workflow
    and run the discussion locations where submission issues are raised.
- id: d4d:CHORUS-collector-clinical-collaborators
  name: Clinical collaborators
  role: Semantic mapping and clinical validation
  collector_details: Clinical expertise contributes to semantic mapping and validation within CHoRUS through
    the chorus-mapping repository, which holds documentation and pooled tabular mappings together with
    an associated clinical validation SOP.
collection_timeframes:
- id: d4d:CHORUS-timeframe-retrospective-ongoing
  name: Retrospective and ongoing collection
  timeframe_details: The September 2025 informational webinar describes CHoRUS data collection as retrospective
    and reports the state of the collection as of August 2025. The NIH RePORTER record gives the award
    period as 2022-09-01 to 2026-11-30.
  source_caveats: The award period is the funding period, not the time span of the clinical records; no
    source in the bundle states the calendar range of the admissions collected, so the start and end date
    slots are left empty rather than filled with the award dates.
