preprocessing_strategies:
- id: d4d:CHORUS-preprocessing-omop-standardization
  name: Standardization to the OMOP Common Data Model
  preprocessing_details: Acquired data are standardized to the OMOP Common Data Model, with unified standards
    harmonizing multi-modal EHR, waveform, imaging and text data and validated semantic mappings connecting
    clinical data in various source formats to international standards. Pooled tabular mappings and their
    documentation are held in the chorus-mapping repository with an associated clinical validation SOP.
- id: d4d:CHORUS-preprocessing-tokenization-and-deidentification
  name: Tokenization and de-identification
  preprocessing_details: Unstructured electronic health record data are tokenized, and data are transformed
    using approaches that limit re-identification. Clinical notes are extracted and tokenized with the
    OHNLP toolkit; imaging de-identification was in process for a larger cohort as of August 2025.
  used_software:
  - id: d4d:CHORUS-software-privacy-scan-tool
    name: privacy_scan_tool
    description: Repository in the chorus-ai GitHub organization described as a privacy scan tool for
      medical records; listed as Python in the 2025-11-14 capture.
  - id: d4d:CHORUS-software-ctp-deid
    name: CTP-deid
    description: Repository in the chorus-ai GitHub organization listed in the 2025-11-14 capture without
      a description.
- id: d4d:CHORUS-preprocessing-waveform-conversion
  name: Waveform conversion
  preprocessing_details: Waveform conversion scripts and documentation are maintained for the preparation
    and release of waveform data, which are distributed in WFDB for telemetry and in EDF+ and Persyst
    for EEG.
- id: d4d:CHORUS-preprocessing-geocoding
  name: Geocoding of location entities for contextual factors
  preprocessing_details: Data elements are given appropriate contextual factors such as geographic distance
    to the nearest hospital; OMOP Location entities are geocoded via DeGauss using open source code held
    in the UF-Geocoding repository, forked from bihorac-LAB/Exposome.
  used_software:
  - id: d4d:CHORUS-software-uf-geocoding
    name: UF-Geocoding
    description: Repository in the chorus-ai GitHub organization holding open source code to geocode OMOP
      Location entities via DeGauss; listed as Python and MIT-licensed in the 2025-11-14 capture.
    license: MIT
cleaning_strategies:
- id: d4d:CHORUS-cleaning-sop-and-characterization
  name: SOP-governed curation and site characterization reports
  cleaning_details: Standard operating protocols instruct data contributing sites about best practices
    for curating and delivering interoperable datasets, and the SOP documents have undergone an internal
    validation and review process. Characterization reports are produced and returned to sites following
    their data submissions. Semantic mappings contributed by clinical collaborators are governed by a
    clinical validation SOP.
  used_software:
  - id: d4d:CHORUS-software-chorus-reports
    name: CHoRUSReports
    description: Repository in the chorus-ai GitHub organization dedicated to producing characterization
      reports to return to sites following their data submissions; listed as R in the 2025-11-14 capture.
labeling_strategies:
- id: d4d:CHORUS-labeling-visualization-annotation-environment
  name: Visualization and annotation environment
  data_annotation_platform: A visualization and annotation environment developed by the CHoRUS Network
    to label data with targets important for prediction.
  labeling_details: The project develops capabilities across a multi-center network to acquire, standardize,
    tokenize, store, visualize and label data. No source in the bundle states the label inventory, the
    annotation protocol, the number of annotations per item or any inter-annotator agreement measure.
external_resources:
- id: d4d:CHORUS-external-resources
  name: Standards, toolkits and infrastructure the dataset depends on
  external_resources:
  - OHDSI/OMOP Common Data Model
  - OHNLP toolkit and OHNLP open source schema
  - DICOM
  - WFDB and the PhysioNet schema extended
  - EDF+
  - Persyst
  - DeGauss
  - Microsoft Azure
  - https://github.com/chorus-ai
  - https://chorus4ai.org/
  - www.bridge2ai.org/chorus
  description: The dataset's content is expressed in externally maintained standards, its processing depends
    on externally maintained toolkits, and its services are deployed to Azure. The software, semantic
    mappings, SOPs and project management overviews are held in the chorus-ai GitHub organization, whose
    package versions and maintainers are listed on a package status page and whose contributor and user
    documentation is compiled in the chorus-developer repository.
is_deidentified:
  id: d4d:CHORUS-deidentification
  name: De-identification and re-identification limitation
  method: Unstructured electronic health record data are tokenized, clinical notes are extracted and tokenized
    with the OHNLP toolkit, imaging de-identification was in process for a larger cohort as of August
    2025, and data are transformed using approaches that limit re-identification.
  deidentification_details: Privacy tooling in the chorus-ai GitHub organization includes a privacy scan
    tool for medical records and a CTP-deid repository. Patient-focused efforts determine the ethical
    and legal approaches to manage privacy and bias. No source in the bundle enumerates which identifiers
    are removed or states a residual re-identification risk.
human_subject_research:
  id: d4d:CHORUS-human-subject-research
  name: Human subject data
  involves_human_subjects: true
  special_populations:
  - Critically ill patients
  - Pediatric intensive care patients
  - Neonatal intensive care patients
  description: The dataset is assembled from the hospital records of patients with acute or critical illness,
    and the current released dataset is reported as 50,000 patient admissions from ICU, PICU and NICU.
  source_caveats: No source in the bundle names an IRB, an approval number or an ethics review board for
    the data collection, so those slots are left empty. The mention of HIPAA and GDPR compliance in the
    bundle appears as a topic in a training curriculum, not as a statement about this dataset's regulatory
    status, and is therefore not recorded as such.
at_risk_populations:
  id: d4d:CHORUS-at-risk-populations
  name: At-risk populations represented
  at_risk_groups_included: true
  description: The dataset covers patients with acute or critical illness, including admissions to pediatric
    and neonatal intensive care units. No source in the bundle describes special protections, assent procedures
    or guardian consent arrangements for these groups.
ethical_reviews:
- id: d4d:CHORUS-ethical-review-community-focus-groups
  name: Community-facing ethics focus groups
  reviewing_organization: CHoRUS consortium
  review_details: The project performs community-facing ethics focus groups to determine what data is
    appropriate for public sharing. Ethics is one of the project's three pillars (Ethical and Trustworthy
    AI). The CHoRUS consortium evaluates community perspectives on clinical care AI to find ways to increase
    trustworthiness of provenance and privacy in AI, and new approaches are being created as the existing
    legal and regulatory landscape is analyzed. The project also establishes a legal framework for collecting
    data at scale.
existing_uses:
- id: d4d:CHORUS-existing-use-training-and-publications
  name: Training activities and publications
  examples:
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI CHoRUS data
    through engagement, AI training and mentorship, with Cohort 2 running from a program start date of
    2025-11-17 to a program end date of 2026-07-31 and up to 30 trainees selected.
  - Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud and
    use the data and tools to create practical use cases.
  description: The September 2025 informational webinar states that the datasets are being used for training
    activities and publications. No specific publication is named anywhere in the bundle.
intended_uses:
- id: d4d:CHORUS-intended-use-critical-care-ai
  name: AI/ML development for acute and critical care
  use_category: AI/ML model development and validation in acute and critical care
  examples:
  - Characterizing acute and critical care illness
  - Predicting complications among patients with acute or critical illness
  - Measuring treatment response among patients with acute or critical illness
  - Building machine-learning and artificial-intelligence-derived models to improve the care and outcomes
    of patients requiring critical care
  - External validation of models against the provisioned holdout test set
  usage_notes: 'Access is controlled: a registration form recording name, email and institution must be
    completed, a licensing agreement included in that form must be signed before access is granted, and
    a ".edu" email address is required to gain access to the dataset. Access and compute provisioning
    are confirmed by email.'
other_tasks:
- id: d4d:CHORUS-other-task-marketplace-adoption
  name: External validation supporting marketplace adoption
  task_details: The holdout test set is accessible for model external validation to aid marketplace adoption
    of AI-developed models for implementation in acute and critical care.
- id: d4d:CHORUS-other-task-trainee-use-cases
  name: Trainee-developed use cases
  task_details: Trainees in the AIM-AHEAD Bridge2AI for Clinical Care Training Program develop and present
    use cases suitable to apply in Bridge2AI Data Topics and conduct collaborative research on the Bridge2AI
    Clinical Care Cloud platform.
future_use_impacts:
- id: d4d:CHORUS-future-impact-access-conditions
  name: Access conditions constrain who can use the data
  impact_details: Access is controlled and conditional on registration, a signed licensing agreement and
    a ".edu" email address, so use is limited to those able to satisfy those conditions. Compute must
    also be provisioned before access begins.
- id: d4d:CHORUS-future-impact-composition-in-progress
  name: Composition will change as acquisition continues
  impact_details: 'The released dataset is an intermediate state of an ongoing acquisition: imaging de-identification
    and EEG extraction were in process as of August 2025, and the anticipated final dataset is twice the
    size of the current release. Results obtained on one state of the dataset may not be reproducible
    on another.'
- id: d4d:CHORUS-future-impact-site-under-review
  name: Project website under administrative review
  impact_details: The project website carries the banner "This repoitory is under review for potential
    modification in compliance with Administration directives", so the documentation recorded here may
    be modified.
distribution_formats:
- id: d4d:CHORUS-format-omop
  name: Structured EHR data in the OMOP Common Data Model
  format: OMOP Common Data Model
  description: Demographics, diagnoses, procedures, medication administration and nursing flowsheets are
    standardized to the OMOP Common Data Model and held under controlled access in the enclave. The published
    metadata schema is recorded as the OMOP schema, one row of the source table being documented as the
    OMOP schema with extensions.
- id: d4d:CHORUS-format-ohnlp
  name: Tokenized clinical notes in OHNLP
  format: OHNLP
  description: Clinical notes extracted and tokenized using the OHNLP toolkit, held under controlled access,
    with the OHNLP open source schema recorded as the published metadata schema.
- id: d4d:CHORUS-format-dicom
  name: Imaging in DICOM
  format: DICOM
  description: Imaging from PACS, held under controlled access, with the DICOM schema recorded as the
    published metadata schema.
- id: d4d:CHORUS-format-wfdb
  name: Waveform telemetry in WFDB
  format: WFDB
  description: Waveform telemetry from bedside monitors and gateway/middleware, held under controlled
    access, with the PhysioNet schema extended recorded as the published metadata schema.
- id: d4d:CHORUS-format-edf-persyst
  name: EEG waveforms in EDF+ and Persyst
  format: EDF+ and Persyst
  description: EEG waveforms from the hospital EEG database, held under controlled access, with the open
    source EDF+ and Persyst schema recorded as the published metadata schema.
license_and_use_terms:
  id: d4d:CHORUS-license-and-use-terms
  name: Dataset licensing agreement and access terms
  license_terms: All participants must sign a licensing agreement, included in the registration form,
    before gaining access to the dataset. Access additionally requires a registration form recording name,
    email and institution, and a ".edu" email address; the webinar states that the email requirement is
    not a barrier to acceptance into the training program and that program administrators will assist
    with access if needed. The contents of the licensing agreement are not reproduced in any source in
    the bundle.
  contact_person: d4d:CHORUS-person-jared-houghtaling
  description: 'The CHoRUS GitHub organization overview gives two addresses for requesting access: dbold@emory.edu
    and jared.houghtaling@tuftsmedicine.org. Jared Houghtaling is listed elsewhere in the bundle as a
    Tufts lecturer in the AIM-AHEAD Bridge2AI for Clinical Care training curriculum, and is recorded here
    as the named contact person; the Emory address is given without an accompanying name.'
  source_caveats: The MIT License named in the CHoRUS GitHub organization README applies to that software
    project, and one repository in the same listing carries Apache-2.0; no source in the bundle states
    a license for the dataset, so none is asserted.
regulatory_restrictions:
  id: d4d:CHORUS-regulatory-restrictions
  name: Confidentiality and access restrictions
  confidentiality_level: restricted
  description: Every data type listed in the September 2025 informational webinar — demographics, medication
    administration, procedures, nursing flowsheets, diagnoses, clinical notes, imaging, waveform telemetry
    and EEG — is recorded as controlled access. Access requires registration, a signed licensing agreement
    and a ".edu" email address.
  source_caveats: No source in the bundle asserts a HIPAA or GDPR compliance status for the dataset; the
    only mention of those regimes in the bundle is a training curriculum topic, so the compliance slots
    are left empty.
maintainers:
- id: d4d:CHORUS-maintainer-chorus-network
  name: CHoRUS Network
  role: academic_institution
  maintainer_details: The CHoRUS collaboration spans 20 academic centers, of which 14 contribute as Data
    Acquisition centers, and the project website reports 60+ consortium members across 20 different institutions.
    The chorus-ai GitHub organization houses the active repositories and holds 28 repositories as of the
    2025-11-14 capture; versions, maintainers and other metadata about CHoRUS packages are published on
    a package status page, and contributor and user documentation is compiled in the chorus-developer
    repository. The project website lists Ciera McCrary, MGH Program Manager, as its contact, and the
    GitHub organization overview lists dbold@emory.edu and jared.houghtaling@tuftsmedicine.org for access
    requests, with www.bridge2ai.org/chorus as a further project website.
updates:
  id: d4d:CHORUS-update-plan
  name: Ongoing acquisition and status tracking
  update_details: The dataset is being extended toward an anticipated final dataset of 100,000 patient
    admissions across 9 data modalities from 14 data contributing hospitals, against a current released
    dataset of 50,000 admissions. As of August 2025 imaging de-identification was in process for a larger
    cohort and EEG extraction was in process. Data contributing sites provide regular status updates on
    their progress in creating and curating a CHoRUS-specific clinical data extract, submitted through
    the GitHub interface or a Google Form; a GoogleScript triggered on each form submission calls the
    GitHub API to update status and issue information, and the resulting site statuses appear in the Standards
    Project or the Data Acquisition Project. No update frequency for the dataset itself is stated in the
    bundle.
extension_mechanism:
  id: d4d:CHORUS-extension-mechanism
  name: Contribution routes for sites and collaborators
  contribution_url: https://github.com/chorus-ai
  extension_details: Data contributing sites extend the dataset by creating and submitting CHoRUS data
    extracts following the SOP workflow, and may raise problems in the Standards Discussions or Data Acquisition
    Discussions. Clinical collaborators may contribute to semantic mapping efforts through the chorus-mapping
    repository and its associated clinical validation SOP, and are invited to reach out about downstream
    analytics on the mapped and assembled dataset. Software contributors work through the repositories
    of the chorus-ai organization, guided by the web guide compiled in the chorus-developer repository.
