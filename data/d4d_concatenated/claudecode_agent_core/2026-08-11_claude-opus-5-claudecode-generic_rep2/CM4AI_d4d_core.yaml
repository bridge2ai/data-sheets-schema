purposes:
- name: Map the spatiotemporal architecture of human cells
  description: The CM4AI data generation project seeks to map the spatiotemporal architecture of human
    cells and use these maps toward the grand challenge of interpretable genotype-phenotype learning.
  response: 'To create a library of large-scale maps of cellular structure and function across demographic
    and disease contexts, using three complementary mapping approaches: proteomic mass spectrometry, cellular
    imaging, and genetic perturbation via CRISPR/Cas9.'
- name: Deliver AI-ready datasets of cell architecture
  description: CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture
    as AI-ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant cell lines
    under perturbed and unperturbed conditions.
  response: To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal data
    collected for human cell lines, to enable transformative biomedical AI research.
- name: Enable visible machine learning
  description: The data are intended to broadly stimulate research and development in "visible" machine
    learning systems informed by multi-scale cell and tissue architecture, which are not black boxes but
    are built directly on knowledge maps of cell and tissue architecture.
  response: To provide a resource of matched data and tools enabling the creation of visible machine learning
    systems and visible neural networks.
- name: Advance ethical AI-readiness standards
  description: To implement a standards data management approach based on FAIR access and software principles,
    with deep provenance and replication packages for representation of cell maps and their underlying
    datasets; to initiate a research program in ethical AI, especially as it relates to how maps will
    be used in genomic medicine and model interpretation; and to stimulate a diverse portfolio of training
    opportunities in the emerging field of biomachine learning.
  response: To establish that AI-ready biomedical data are fully characterized FAIR data of known provenance,
    which can be ethically and reliably processed by AI applications; whose models and software are available
    and well-described for validation and re-use; and whose predictions may be fully explained and interpreted
    to the user as needed.
tasks:
- name: AI model training
  description: The releases state that the dataset is intended for AI model training.
  response: AI model training on AI-ready functional genomics data.
- name: Cellular process analysis
  description: The releases state that the dataset is intended for cellular process analysis.
  response: Analysis of cellular processes from protein-protein interaction, spatial localization and
    genetic perturbation data.
- name: Analysis of cell architectural change under perturbation
  description: The releases state that the dataset is intended for analysis of cell architectural changes
    and interactions in the presence of specific disease processes, treatment conditions, or genetic perturbations.
  response: Comparison of protein complexes, localization and transcriptional phenotypes between untreated,
    drug-treated and genetically perturbed conditions and between cell types.
- name: Cell map construction
  description: 'Integration of the input data streams into hierarchical cell maps: directed acyclic graphs
    whose nodes are assemblies of proteins in proximity at a given scale, spanning from large assemblies
    representing cell compartments to small assemblies such as protein complexes or subunits.'
  response: Construction of multi-scale hierarchical maps of cell architecture from multimodal input data
    via the MuSIC pipeline.
addressing_gaps:
- name: Black-box machine learning in genomics
  description: In genomics and precision medicine, machine learning models are often "black boxes", predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs. The
    project was launched to address this deficiency.
  response: Providing knowledge maps of cell and tissue architecture on which interpretable, "visible"
    machine learning systems can be built directly.
- name: Absence of ethical, FAIR, AI-ready functional genomics data
  description: The project defines AI-Ready biomedical data as FAIR, provenanced, characterized, explainable
    and ethical, and observes that significant requirements are placed on datasets used to train and to
    be analyzed by AI/ML models. CM4AI packages its outputs with machine-readable provenance graphs, JSON-Schema
    data dictionaries and ontology mappings to meet these criteria.
  response: Delivering datasets that are FAIR, fully provenanced through evidence graphs, characterized
    with schemas and datasheets, explainable, and ethically obtained and licensed.
- name: Uncharted subcellular organization
  description: Cell maps provide a foundation for downstream applications in human genomics, including
    interpretation of genetic variants and mutations, which requires systematic knowledge of how proteins
    are organized within cells.
  response: Systematic, data-driven mapping of protein assemblies across scales in disease-relevant human
    cell lines.
creators:
- name: Cell Maps for Artificial Intelligence (CM4AI) project
  description: The NIH Bridge2AI Functional Genomics Data Generation Project that generates, packages
    and releases the data. Its Data Module completed parallel maps of protein-protein interactions, protein
    subcellular distributions and transcriptional states; its Tools Module produced the MuSIC toolkit;
    its Standards Module established the FAIR AI-readiness metadata and validation toolkits used to package
    and release the cell-line perturbation and measurement data.
