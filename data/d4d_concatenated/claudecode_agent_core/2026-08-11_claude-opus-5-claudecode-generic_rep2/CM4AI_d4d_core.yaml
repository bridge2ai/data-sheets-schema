    to Pride when available".
- name: Raw sequence data in NCBI BioProject / Sequence Read Archive
  source_description: Raw sequence data from the expressed genome-scale CRISPRi Perturbation Cell Atlas
    in KOLF2.1J hiPSCs, distributed in the releases as cm4ai_perturb-seq_KOLF2_raw_sra.zip and linked
    from the June 2025 release as Sequence Read Archive (SRA) data at NCBI BioProject.
  source_type: External sequence data repository
  access_details: Linked as an "External Data Links" entry from the June 2025 Dataverse release page.
- name: CRISPRi Perturbation Atlas of iPSCs on Figshare
  source_description: The June 2026 release adds an external data link to a CRISPRi Perturbation Atlas
    of iPSCs hosted on Figshare.
  source_type: External general-purpose data repository
  access_details: Linked as an "External Data Links" entry from the June 2026 Dataverse release page.
- name: Deposition archives of the source laboratories
  source_description: The MuSIC pipeline downloads PPI networks for the cell line and conditions from
    the Krogan Laboratory's deposition archive, and IF images for the cell line and conditions from the
    Lundberg Laboratory's deposition archive, before further processing.
  source_type: Laboratory deposition archive
preprocessing_strategies:
- name: MuSIC data integration pipeline
  preprocessing_details: 'Input data streams are integrated via the Multi-Scale Integrated Cell (MuSIC)
    software pipeline. Its steps are: download PPI and image data from the source laboratories'' deposition
    archives; generate embeddings, processing downloaded PPI networks with the node2vec deep learning
    model and IF images with a Human Protein Atlas deep learning model to reduce dimensionality; co-embedding,
    integrating the PPI and image embeddings using contrastive deep learning so that the original embeddings
    can be reconstructed with minimal information loss and proteins with similar PPI and image embeddings
    have similar co-embeddings; protein community detection based on all-by-all similarities of pairs
    of proteins in the co-embedding space, producing a hierarchy of protein communities as the final cell
    map; and hierarchy evaluation. The pipeline is divided into segments, each of which calls the FAIRSCAPE
    client package to validate inputs and create the output RO-Crate package for that segment.'
  used_software:
  - id: https://github.com/idekerlab/cellmaps_pipeline
    name: Cell Mapping Toolkit (cellmaps_pipeline)
    description: A series of pip-installable Python packages implementing the end-to-end cell mapping
      pipeline, including cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding,
      cellmaps_ppi_embedding, cellmaps_coembedding, cellmaps_generate_hierarchy and cellmaps_hierarchyeval,
      with documentation at https://cellmaps-pipeline.readthedocs.io/.
    license: BSD-3
    url: https://github.com/idekerlab/cellmaps_pipeline
- name: FAIRSCAPE AI-readiness packaging
  preprocessing_details: Outputs are packaged as AI-ready datasets in RO-Crate format using an extended,
    client-server version of the FAIRSCAPE framework. FAIRSCAPE-CLI is called when any computation or
    coherent set of computations in the pipeline completes, and is passed metadata defining JSON-Schema
    schemas for the datasets in that computational unit along with its inputs, computations, software,
    models and outputs; it creates an RO-Crate package with the datasets, metadata and software, or resolvable
    references to them. RO-Crates are sent to the FAIRSCAPE server, where they are registered and assigned
    persistent, resolvable, globally unique identifiers in the ARK scheme, then decomposed into their
    components, which are also registered and assigned PIDs. The server computes end-to-end entailments
    on each RO-Crate's provenance, expressed in the EVI Evidence Graph Ontology, and links them where
    possible. PIDs resolve to machine- and human-readable landing pages containing metadata in JSON-LD
    using vocabularies from Schema.org, EVI and other public ontologies, with alternate JSON-LD and RDF-XML
    serialisations.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    description: A framework for FAIR and reproducible biomedical analytics, comprising a client-side
      Python 3 application (FAIRSCAPE-CLI) and a Python 3 server application; both are pip-installable
      and freely available. Copyright is held by the Rector and Board of Visitors of the University of
      Virginia.
    license: MIT
    url: https://fairscape.github.io
labeling_strategies:
- name: Cell map assembly annotation
  data_annotation_protocol: Cell maps are annotated in a two-pronged approach. First, cell maps are aligned
    to known protein function and pathway resources, including the Gene Ontology and Reactome, to determine
    protein assemblies in the cell map with high overlap with known cell biology. Second, assemblies in
    the cell maps are annotated using a large language model approach developed by the project to name
    sets of proteins and assign a name confidence score.
  labeling_details: Applied to the cell maps produced by the MuSIC pipeline's hierarchy evaluation step;
    the computed cell maps themselves are not included in the data releases in this bundle.
- name: Ontology mapping of data elements
  data_annotation_protocol: Datasets and data elements are characterized and validated and data elements
    mapped to public ontology vocabularies, where appropriate, using JSON-Schema mini-data-dictionary
    descriptions resolvable from the provenance graph metadata.
  labeling_details: The Dataverse release metadata carries ontology identifiers for many of its keywords,
    drawn from the NCI Thesaurus, BioAssay Ontology, Software Ontology, LOINC, Cell Ontology, Experimental
    Factor Ontology, Ontology of Biomedical Investigations, MeSH, ChEBI and the Gene Ontology.
machine_annotation_tools:
- name: LLM-based assembly naming
  tools:
  - Large language model assembly-naming approach developed by the project
  tool_descriptions: Assemblies in the cell maps are annotated using a large language model approach that
    the project developed to name sets of proteins and assign a name confidence score.
intended_uses:
- name: Intended uses stated in the data releases
  use_category: Research
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations
  usage_notes: These four items are the "Intended Use" list carried on the June 2025, October 2025 and
    June 2026 Dataverse release pages.
other_tasks:
- name: Interpretation of genetic variants and mutations
  task_details: Cell maps provide a foundation for downstream applications in human genomics, including
    interpretation of genetic variants and mutations. They have been used in AI tools for "visible machine
    learning" or "visible neural networks" to interrogate how protein assemblies in the cell affect cell-level
    phenotype predictions.
- name: Construction of new cell maps across subtypes and disease states
  task_details: The Cell Mapping Toolkit implements the end-to-end pipeline as a series of Python packages
    and provides a flexible and generalizable framework for cell map construction, enabling researchers
    to integrate and construct cell maps via multiple input modalities.
existing_uses:
- name: Project publications using CM4AI data and methods
  examples:
  - Nourreddine S, Doctor Y, Dailamy A, et al. A perturbation cell atlas of human induced pluripotent
    stem cells. bioRxiv 2024 Nov 4; 2024.11.03.621734; PMCID PMC11580897; doi 10.1101/2024.11.03.621734.
    Listed as a Related Publication of the March 2025, June 2025 and October 2025 releases.
  - 'Clark T, Parker J, Schaffer L, et al. Cell Maps for Artificial Intelligence: AI-Ready Maps of Human
    Cell Architecture from Disease-Relevant Cell Lines. bioRxiv 2024; doi 10.1101/2024.05.21.589311. The
    Related Publication cited by every release and the article that publications referencing the data
    are required to cite.'
  description: Uses recorded in the bundle at the level of the project's own publications. Dataverse reports
    no dataset citations retrieved from Crossref via DataCite for any of the releases, and download counts
    of 302 (March 2025), 256 (June 2025), 405 (October 2025) and 181 (June 2026).
- name: CodeFest and training use
  examples:
  - Initial datasets, tools and standards were made available at the project's CodeFest in March 2024,
    accompanied by detailed tutorials explaining how the data were derived and integrated and providing
    production-ready software for producing the datasets. The inaugural virtual CodeFest trained 38 registrants.
  description: Educational and workforce-development use of the data by the project's Skills and Workforce
    Development module.
future_use_impacts:
- name: Ethical anticipation of downstream AI applications
  impact_details: The project's ethical criteria require anticipating potential applications of the data
    and derived AI/ML systems, integrating them into data governance frameworks to optimize benefits and
    mitigate potential risks, and promoting their use for the collective good. The Ethics team is developing
    tools to enhance awareness and comprehension of the ethical, legal and social ramifications associated
    with CM4AI data and the consequent AI systems, and is formulating the CM4AI Life Cycle framework of
    governance milestones through data generation and AI system development.
discouraged_uses:
- name: Treating a release as containing integrated cell maps
  discouragement_details: The releases state that they do not contain predicted cell maps, which will
    be added in future releases, and that the current release is most suitable for bioinformatics analysis
    of the individual datasets. Use of a release as a source of computed multi-scale cell maps is therefore
    not supported by its contents.
prohibited_uses:
- name: Clinical decision-making and patient care
  prohibition_reason: The releases state that these laboratory data are not to be used in clinical decision-making
    or in any context involving patient care without appropriate regulatory oversight and approval.
- name: Commercial use without a separate licence
  prohibition_reason: The data are licensed CC BY-NC-SA 4.0, under which the material may not be used
    for commercial purposes; commercial use requires a separate license negotiation with the copyright
    holder (UCSD, Stanford and/or UCSF depending upon the specific data package in question), and a Data
    Access Committee supervises ethical matters related to dataset distribution and potential dual licensing
    for commercial use.
distribution_formats:
- name: ZIP archives via the University of Virginia Dataverse
  format: ZIP archive
  media_type: application/zip
  description: Each release is published in LibraData, the University of Virginia's Dataverse instance
    and an NIH-approved generalist repository, primarily as ZIP archives of images, mass spectrometry
    data and perturbation data. Dataverse states that the datasets are too large to download in full and
    that individual files must be selected from the file table; files above the 953.7 MB download limit
    cannot be downloaded as a ZIP through the browser, and the Data Access API is offered for programmatic
    access.
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
- name: RO-Crate metadata and provenance graphs
  format: JSON-LD RO-Crate metadata, and HTML provenance graph and datasheet files
  media_type: application/ld+json, text/html
  description: Releases carry RO-Crate metadata files (for example ro-crate-metadata.json per sub-dataset
    in the March 2025 release, and release-ro-crate-metadata.json with pointers to sub-crates in the June
    2025 release), HTML provenance graph files that the release notes say require download to view properly
    and will not display in the Dataverse preview, and an HTML datasheet summarising key release information
    (release-ro-crate-datasheet.html). The June 2026 and October 2025 releases bundle this material as
    cm4ai_release_metadata.zip.
- name: Export formats offered by the repository
  format: OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD, DDI Codebook v2, Dublin Core, DDI HTML Codebook,
    JSON, Croissant
  description: Metadata export formats offered on each Dataverse release page. Croissant is offered only
    on the October 2025 and June 2026 release pages; the other formats are offered on all four.
distribution_dates:
- name: Release publication dates
  release_dates:
  - May 2024 (May 2024 Data Release)
  - 2025-03-03 (March 2025 Data Release, Dataverse Publication Date)
  - 2025-07-01 (June 2025 Data Release, Dataverse Publication Date)
  - 2025-10-31 (October 2025 Data Release, Dataverse Publication Date)
  - 2026-06-17 (June 2026 Data Release, Dataverse Publication Date)
  description: Publication dates of the CM4AI data releases as recorded on their Dataverse pages, together
    with the May 2024 release listed in the cm4ai.org archive.
  source_caveats: 'The cm4ai.org data-releases page gives "Released on: June 17, 2025" for the June 2026
    Data Release, which disagrees with the Dataverse Publication Date of 2026-06-17 for the same DOI.
    Both are recorded; neither is preferred here. The bundle gives no day or month-day for the May 2024
    release beyond the month named in the cm4ai.org archive listing.'
license_and_use_terms:
  name: CC BY-NC-SA 4.0 with attribution and citation requirements
  data_use_permission: no_commercial_use
  contact_person: https://orcid.org/0000-0002-1708-8454
  license_terms: 'Data and metadata are licensed for reuse under the Creative Commons Attribution-NonCommercial-ShareAlike
    4.0 International license (https://creativecommons.org/licenses/by-nc-sa/4.0/). The deed states that
    users are free to share (copy and redistribute the material in any medium or format) and adapt (remix,
    transform and build upon the material) under three terms: Attribution, which requires appropriate
    credit, a link to the license and an indication of whether changes were made; NonCommercial, under
    which the material may not be used for commercial purposes, a commercial use being one primarily intended
    for commercial advantage or monetary compensation; and ShareAlike, under which contributions built
    on the material must be distributed under the same license. No additional legal or technological restrictions
    may be applied. Attribution requirements for these datasets include attribution to the copyright holders
    and to the Cell Maps for Artificial Intelligence project as referenced in the datasets, and citation
    of the project article. Dataverse adds that its Community Norms and good scientific practices expect
    proper credit via citation using the data citation shown on the dataset page. Any publications referencing
    this data or derived products should cite the Related Publication as well as directly citing the data
    collection.'
  source_caveats: '`contact_person` records the ORCID of Trey Ideker, named as the Point of Contact on
    every Dataverse release page and reachable only through the repository''s email button; no licensing-specific
    contact address is given in the bundle. `data_use_permission` is set to no_commercial_use as the enumerated
    value corresponding to the NonCommercial term of CC BY-NC-SA 4.0; the licence''s Attribution and ShareAlike
    terms have no corresponding enumerated value and are recorded in `license_terms`.'
ip_restrictions:
  name: Copyright and commercial licensing restrictions
  restrictions:
  - Copyright to the release data is held by The Regents of the University of California except where
    otherwise noted.
  - Spatial proteomics raw image data is copyright The Board of Trustees of the Leland Stanford Junior
    University.
  - Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford and/or
    UCSF depending upon the specific data package in question).
  - Software comprising the Tools data integration pipeline is available under the BSD-3 open source license
    in GitHub (for alpha level tools) or in the Zenodo long-term archive (for production-ready tools);
    FAIRSCAPE is available under the MIT license, with copyright held by the Rector and Board of Visitors
    of the University of Virginia.
  - The University of Virginia Dataverse pages carry the notice "Copyright (c) 2025, by the Rector and
    Visitors of the University of Virginia".
  source_caveats: 'Copyright years differ between sources for the same statements: the 2025 Dataverse
    release descriptions give 2025 for both the University of California and the Leland Stanford Junior
    University holdings, while the 2024 project preprint gives 2024 for both. The years are therefore
    omitted from the restriction statements rather than one being chosen.'
regulatory_restrictions:
  name: Regulatory status and repository notices
  regulatory_restrictions:
  - 'The CM4AI collection in the University of Virginia Dataverse, the CM4AI website and the CM4AI data-releases
    page all display the notice: "This repository is under review for potential modification in compliance
    with Administration directives."'
  other_compliance: 'Each Dataverse release records Human Subjects: No, De-identified Samples: Yes, and
    FDA Regulated: No. No IRB approval, HIPAA determination or export control classification is stated
    anywhere in the source bundle.'
maintainers:
- name: Swathi Thaker
  maintainer_details: Program Manager, University of Alabama at Birmingham; listed on cm4ai.org and on
    the cm4ai.org data-releases page as the contact for project-related inquiries, at snthaker@uab.edu.
- name: Zhandos Sembay
  maintainer_details: University of Alabama at Birmingham; listed on cm4ai.org and on the cm4ai.org data-releases
    page as the contact for website support and updates, at zsembay8@uab.edu.
- name: Trey Ideker
  maintainer_details: Listed as the Point of Contact on every Dataverse release page (University of California
    San Diego), reachable through the repository's email button, and recorded by NIH RePORTER as the project's
    principal investigator.
- name: Justin Niestroy
  maintainer_details: Recorded as the Depositor of the March 2025, June 2025, October 2025 and June 2026
    Dataverse releases, with Deposit Date 2025-02-27 on each.
- name: University of Virginia Dataverse (LibraData)
  role: academic_institution
  maintainer_details: LibraData is the University of Virginia's archival data repository and its instance
    of Dataverse, an NIH-approved generalist repository. The release maintenance plans commit to long-term
    preservation there, supported by committed institutional funds.
updates:
  name: Quarterly release plan
  frequency: Quarterly
  update_details: The releases state that the dataset will be regularly updated and augmented through
    the end of the project in November 2026, with updates on a quarterly basis. CM4AI's data-releases
    page repeats that CM4AI releases data quarterly, ensuring continuous updates to the cell maps and
    input data streams, and the project preprint states that data presented will be augmented regularly
    through the end of the project and that software packages will be versioned as the project progresses,
    with the version used to produce each dataset referenced in the dataset's metadata.
retention_limit:
  name: Long-term preservation commitment
  retention_details: The maintenance plan on each release states long-term preservation in the University
    of Virginia Dataverse, supported by committed institutional funds. No retention period or deletion
    schedule is given. Dataverse notes that files are not removed from previously published versions of
    a dataset when deleted from a later one.
version_access:
  name: Release versions and their identifiers
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
  - 'May 2024 Data Release: https://doi.org/10.18130/V3/DXWOS5'
  - 'March 2025 Data Release (Beta): https://doi.org/10.18130/V3/B35XWX'
  - 'June 2025 Data Release (Beta): https://doi.org/10.18130/V3/F3TD5R'
  - 'October 2025 Data Release (Beta): https://doi.org/10.18130/V3/K7TGEM'
  - 'June 2026 Data Release (Beta): https://doi.org/10.18130/V3/HIGT4C'
  source_caveats: 'For every release the Dataverse citation block and the page header give different version
    numbers: V1 against "Version 1.4" for March 2025, and V2 against "Version 2.1", "Version 2.1" and
    "Version 2.0" for June 2025, October 2025 and June 2026 respectively. The page-header value is recorded
    on each release under `resources` and the discrepancy is noted there.'
  version_details: Each quarterly release is deposited as a separate Dataverse dataset with its own DOI
    rather than as a new version of a single dataset, and the cm4ai.org data-releases page presents the
    June 2026 release as the latest with the May 2024, March 2025, June 2025 and October 2025 releases
    in an archive. Within a release, Dataverse maintains major and minor versions; the June 2025 release
    page records that a DRAFT version was not found and that the displayed version is 2.1.
errata:
- name: June 2025 release revision
  erratum_url: https://doi.org/10.18130/V3/F3TD5R
  erratum_details: The June 2025 Data Release page describes the deposited dataset as a revision of the
    June 2025 Data Release, adding RGB immunofluorescent images, correcting RO-Crate metadata, and changing
    naming conventions.
external_resources:
- name: Cell Mapping Toolkit and MuSIC pipeline
  description: Open-source software for cell map construction, released as a series of Python PyPI packages
    and linked through the Multiscale Integrated Cell web portal, with complete user documentation hosted
    at ReadTheDocs and a step-by-step guide in the GitHub repository.
  external_resources:
  - https://github.com/idekerlab/cellmaps_pipeline
  - https://cellmaps-pipeline.readthedocs.io/
  archival: false
  restrictions:
  - Alpha level tools are in GitHub under BSD-3; production-ready tools are in the Zenodo long-term archive.
  used_software:
  - id: https://github.com/idekerlab/cellmaps_pipeline
    name: Cell Mapping Toolkit (cellmaps_pipeline)
    description: A series of pip-installable Python packages implementing the end-to-end cell mapping
      pipeline, including cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding,
      cellmaps_ppi_embedding, cellmaps_coembedding, cellmaps_generate_hierarchy and cellmaps_hierarchyeval,
      with documentation at https://cellmaps-pipeline.readthedocs.io/.
    license: BSD-3
    url: https://github.com/idekerlab/cellmaps_pipeline
- name: FAIRSCAPE AI-readiness framework
  description: The framework used to package CM4AI data, software, metadata and provenance graphs into
    RO-Crates and to mint and resolve ARK persistent identifiers. It is described with a tutorial and
    installation instructions at its documentation site.
  external_resources:
  - https://fairscape.github.io
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    description: A framework for FAIR and reproducible biomedical analytics, comprising a client-side
      Python 3 application (FAIRSCAPE-CLI) and a Python 3 server application; both are pip-installable
      and freely available. Copyright is held by the Rector and Board of Visitors of the University of
      Virginia.
    license: MIT
    url: https://fairscape.github.io
- name: Integrative Modeling Platform (IMP)
  description: The open-source integrative modeling platform used by the project's exploratory integrative
    structure modeling of MuSIC communities; the modeling protocol was scripted using the Python Modeling
    Interface package on IMP version 2.18.
  external_resources:
  - https://integrativemodeling.org
  used_software:
  - id: https://integrativemodeling.org
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    url: https://integrativemodeling.org
- name: Network Data Exchange (NDEx)
  description: Cell maps are shared via the Network Data Exchange and can be visualized in a web browser
    or accessed via tools such as Cytoscape, HiView and the Python ndex2 library.
  external_resources:
  - https://ndexbio.org
  - https://ndex2.readthedocs.io/en/latest/
- name: CM4AI web portal
  description: The project portal, built on the U-BRITE platform, disseminates CM4AI data, maps and tools
    and hosts the project's documentation, publications, data release listings and training material.
  external_resources:
  - http://www.cm4ai.org
  - https://cm4ai.org/data-releases/
- name: Related publications describing the project and its data
  description: The preprint that every release names as its Related Publication and that publications
    referencing the data are required to cite, together with the perturbation cell atlas preprint named
    as a Related Publication of the March, June and October 2025 releases.
  external_resources:
  - https://doi.org/10.1101/2024.05.21.589311
  - https://www.biorxiv.org/content/10.1101/2024.05.21.589311v1
  - https://doi.org/10.1101/2024.11.03.621734
- name: Companion U2OS multimodal cell map study (Schaffer et al., Nature 2025)
  description: '"Multimodal cell maps as a foundation for structural and functional genomics", Nature
    642:222-231 (2025), doi 10.1038/s41586-025-08878-3, received 2024-06-03, accepted 2025-03-10, published
    2025-04-09, with a Publisher Correction published 2025-10-02 (doi 10.1038/s41586-025-09648-x). The
    study builds a map of human subcellular architecture in U2OS osteosarcoma cells from AP-MS biophysical
    interactions and immunofluorescence images for over 5,100 proteins, resolving 275 molecular assemblies,
    and it acknowledges funding from the Bridge2AI Program (NIH Common Fund; OT2 OD032742) among other
    sources. Its associated resources are the Multiscale Integrated Cell visualization portal, the U2OS
    cell map on NDEx (uuid f693137a-d2d7-11ef-8e41-005056ae3c32), the AP-MS interaction network on NDEx
    (uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa), raw AP-MS files at MassIVE (MSV000097168), SEC-MS raw
    files and search results at ProteomeXchange (PXD052362), structural models at ModelArchive (ma-idk-
    u2osmap and ma-m5og4), assemblies in the EBI Complex Portal under query CLO:0009454, and the image
    dataset within the Human Protein Atlas v23 release.'
  external_resources:
  - https://www.nature.com/articles/s41586-025-08878-3
  - https://doi.org/10.1038/s41586-025-08878-3
  - http://musicmaps.ai/u2os-cellmap/
  - https://ndexbio.org
  - https://www.ebi.ac.uk/complexportal
  - https://modelarchive.org
  source_caveats: 'This study is recorded as an external resource, not as part of the CM4AI dataset: it
    reports a map of U2OS osteosarcoma cells, which is not among the cell lines covered by the CM4AI data
    releases, and none of its data appears in those releases. Its protein and assembly counts, methods,
    author list and repository accessions are therefore not carried into this record''s own composition,
    collection, preprocessing or creator statements.'
