id: https://cm4ai.org/
name: Cell Maps for Artificial Intelligence (CM4AI)
title: Cell Maps for Artificial Intelligence (CM4AI)
description: 'Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge2AI program. Its mission is to produce ethical,
  AI-ready datasets of human cell architecture, inferred from multimodal interrogation of disease-relevant
  human cell lines under perturbed and unperturbed conditions, and to deliver machine-readable hierarchical
  maps of cell architecture built from those data.

  The measured data streams are: affinity purification mass spectrometry (AP-MS) and size-exclusion chromatography
  mass spectrometry (SEC-MS) for protein-protein interactions; immunofluorescence (IF) subcellular confocal
  microscopy for spatial proteomics; and single-cell CRISPR (perturb-seq) genetic perturbation screens.
  The cell lines interrogated are the triple-negative breast cancer line MDA-MB-468 (untreated, paclitaxel-treated
  and vorinostat-treated) and the induced pluripotent stem cell line KOLF2.1J (undifferentiated, and iPSC-derived
  neural progenitor cells, neurons and cardiomyocytes).

  The data are released quarterly through LibraData, the University of Virginia''s Dataverse instance,
  as a series of Beta data releases, each packaged with provenance graphs and rich metadata in RO-Crate
  format using the FAIRSCAPE framework. The CM4AI web portal reports cumulative figures of 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted
  and 21.4 TB of data volume.

  CM4AI is a multi-institution collaboration organised into three pillars (Data, People, Ethics) across
  six modules: Data Acquisition, Tools, Standards, Skills and Workforce Development, Teaming, and Ethics.'
source_caveats: 'The record''s referent is the CM4AI dataset as a whole, identified by its project landing
  page https://cm4ai.org/, because no single DOI is minted for the dataset across releases; the five quarterly
  Dataverse releases carry their own DOIs and are represented under `resources` and `version_access`.
  Consequently the top-level `doi`, `version`, `total_file_count` and `total_size_bytes` slots are left
  absent: every candidate value in the bundle is scoped to one release rather than to the dataset.

  The bundle also contains the 2025 Nature article "Multimodal cell maps as a foundation for structural
  and functional genomics" (Schaffer et al.), which was funded in part by the Bridge2AI Program award
  OT2 OD032742 and uses the same multimodal mapping approach, but reports a map of U2OS osteosarcoma cells.
  U2OS is not one of the cell lines covered by the CM4AI data releases, and none of that study''s data
  is in the Dataverse releases; its counts, methods, resources and author list are therefore recorded
  only under `external_resources` and `existing_uses` as a companion study, and are not merged into this
  dataset''s own composition, collection or creator statements.'
conforms_to: RO-Crate, with FAIRSCAPE-generated provenance metadata expressed in JSON-LD using Schema.org,
  the EVI Evidence Graph Ontology and other public vocabularies, and JSON-Schema data dictionaries for
  dataset elements.
