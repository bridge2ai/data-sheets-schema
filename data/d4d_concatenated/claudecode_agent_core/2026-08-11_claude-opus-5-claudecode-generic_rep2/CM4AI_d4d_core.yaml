subpopulations:
- name: Donor origins of the interrogated cell lines
  subpopulation_elements_present: true
  identification: All data derive from two human cell lines rather than from individual human subjects.
    MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from a metastatic
    site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma, available
    from ATCC. KOLF2.1J (RRID:CVCL_B5P3) is an iPSC line derived from a healthy male Northern European
    donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource and accessible
    to not-for-profit organizations via a simple MTA.
  distribution: Two donors are represented, one per cell line. The releases state that the data were derived
    from commercially available de-identified human cell lines and do not represent all biological variants
    which may be seen in the population at large.
known_biases:
- name: Cell-line-derived data do not represent population variation
  bias_type: representation_bias
  bias_description: Data in the releases were derived from commercially available de-identified human
    cell lines and do not represent all biological variants which may be seen in the population at large.
  affected_subsets:
  - All data modalities in every release
known_limitations:
- name: Interim Beta release
  limitation_type: scope_limitation
  limitation_description: Every release in the bundle is labelled Beta and is described as an interim
    release; the releases state that these data are not yet in completed final form.
  scope_impact: Content and organisation of the data are expected to change between quarterly releases.
- name: Computed cell maps not included
  limitation_type: coverage_limitation
  limitation_description: The releases do not contain predicted or computed cell maps, which the release
    notes say will be added in future releases. The current release is therefore described as most suitable
    for bioinformatics analysis of the individual datasets.
  recommended_mitigation: Analyse the individual input data streams, or construct maps with the Cell Mapping
    Toolkit.
- name: Incomplete overlap between modalities
  limitation_type: integration_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging) and
    CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
  scope_impact: Multimodal integration is possible only over the intersection of the protein sets covered
    by each modality.
- name: Domain expertise required
  limitation_type: methodological_limitation
  limitation_description: The releases state that the data require domain expertise for meaningful analysis.
confidential_elements:
- name: Pre-publication embargo
  confidential_elements_present: true
  confidentiality_details: The release notes state that some datasets are under temporary pre-publication
    embargo. In the October 2025 and June 2026 releases the external data links for perturb-seq data in
    KOLF2.1J iPSCs (undifferentiated) and in MDA-MB-468 breast cancer cells with and without treatment
    are marked "Embargoed" rather than pointing to a repository.
sensitive_elements:
- name: No human subject data
  sensitive_elements_present: false
  sensitivity_details: 'The release metadata records Human Subjects: No, De-identified Samples: Yes, and
    FDA Regulated: No. The project preprint states that CM4AI data are distinctive within Bridge2AI in
    that they are non-clinical (from tissue cultures) and are considered to be de-identified as they cannot
    be matched, with current knowledge, to a human subject.'
is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  deidentification_details: 'CM4AI data are non-clinical, generated from tissue cultures of commercially
    available human cell lines, and are considered de-identified because they cannot be matched, with
    current knowledge, to a human subject. Each Dataverse release records De-identified Samples: Yes.'
human_subject_research:
  name: Human subject research status
  involves_human_subjects: false
  description: 'Each Dataverse release records Human Subjects: No and FDA Regulated: No. The data are
    generated from two commercially available, ethically sourced human cell lines rather than from human
    subjects.'
  regulatory_compliance:
  - Not FDA regulated
  source_caveats: 'All three statements are taken from the Data Governance & Ethics block of the Dataverse
    release pages, which records the fields Human Subjects: No, De-identified Samples: Yes and FDA Regulated:
    No. No IRB determination or ethics review board of record is named anywhere in the bundle, so `irb_approval`
    and `ethics_review_board` are left absent.'
ethical_reviews:
- name: CM4AI ethical review contact - Vardit Ravitsky
  contact_person: mailto:ravitskyv@thehastingscenter.org
  review_details: The Data Governance & Ethics block of the June 2025, October 2025 and June 2026 releases
    names Vardit Ravitsky (ravitskyv@thehastingscenter.org) as an Ethical Review contact for the release.
- name: CM4AI ethical review contact - Jean-Christophe Belisle-Pipon
  contact_person: mailto:jean-christophe_belisle-pipon@sfu.ca
  reviewing_organization: Simon Fraser University
  review_details: The Data Governance & Ethics block of the June 2025, October 2025 and June 2026 releases
    names Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca) as an Ethical Review contact
    for the release.
- name: CM4AI Ethics Module
  review_details: The project's Ethics Module worked with the Data Acquisition, Tools and Standards Modules
    to develop a plan for ethical preparation, licensing, dissemination and Data Access supervision of
    CM4AI datasets, balancing openness of the data with protection of intellectual property and supervision
    of potential commercialization. It employs a methodology inspired by Value-Sensitive Design, has developed
    a first version of a Value Repository, and is formulating the CM4AI Life Cycle, a framework that sets
    out governance milestones through data generation and AI system development. The Ethics Pillar also
    supported the Bridge2AI Ethics Working Group and the Data Sharing and Dissemination Working Group
    in developing a Code of Conduct, which participants in the Bridge2AI Open House must attest and commit
    to before accessing B2AI data including CM4AI datasets.
acquisition_methods:
- name: Direct laboratory measurement on cultured cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  acquisition_details: 'Instances are laboratory measurements generated by the project on cultured human
    cell lines: affinity purification mass spectrometry and size-exclusion chromatography mass spectrometry
    for protein-protein interactions, immunofluorescence confocal microscopy for spatial proteomics, and
    single-cell CRISPR perturbation screens for genetic perturbation. No data are reported by human subjects.'
collection_mechanisms:
- name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details: 'AP-MS on endogenously tagged cell lines, used together with SEC-MS as two orthogonal
    mass spectrometry approaches for mapping protein-protein interactions of 100 chromatin regulators
    under different conditions (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated,
    neurons and cardiomyocytes). Seventeen genes were endogenously tagged in MDA-MB-468 and AP-MS data
    acquired under three conditions, with 34 additional genes in the process of being tagged at the time
    of the preprint.'
- name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details: SEC-MS for proteome-wide complex and interaction mapping, performed on MDA-MB-468
    cells under three conditions (untreated, paclitaxel-treated and vorinostat-treated) and on KOLF2.1J
    iPSCs and derivatives. The release file metadata attributes the SEC-MS data to the Nevan Krogan laboratory
    at the University of California San Francisco.
- name: Immunofluorescence confocal microscopy
  mechanism_details: Spatial subcellular mapping using the Human Protein Atlas resource of antibodies,
    with automated fixation and permeabilization protocols established for a pipetting robot for the MDA-MB-468
    and KOLF2 cell lines. Images are acquired by immunofluorescence-based staining (ICC-IF) and confocal
    microscopy in the Lundberg Lab at Stanford University, with nuclei stained by DAPI (blue channel),
    endoplasmic reticulum by a calreticulin antibody (yellow channel), microtubules by a tubulin antibody
    (red channel), and the protein of interest by its own antibody (green channel).
- name: Single-cell CRISPR perturbation screens (perturb-seq)
  mechanism_details: Single-cell CRISPR screens perturbing 100 chromatin regulators in MDA-MB-468 cells
    under three conditions and in undifferentiated KOLF2.1J iPSCs, using a CRISPR lentiviral library targeting
    100 chromatin factors with 6 guide RNAs per gene, MDA-MB-468 and KOLF2 CRISPR lines expressing inducible
    dCas9, and the 10x Genomics 3'HT kit. An expressed genome-scale CRISPRi Perturbation Cell Atlas in
    undifferentiated KOLF2.1J hiPSCs maps transcriptional and fitness phenotypes for 11,739 targeted genes;
    the project states that these findings were validated via phenotypic, protein-interaction and metabolic
    tracing assays.
sampling_strategies:
- name: Targeted protein and gene panels in two cell lines
  is_sample: true
  source_data: Human cell lines MDA-MB-468 (with and without paclitaxel or vorinostat) and KOLF2.1J (undifferentiated
    and differentiated into neural progenitor cells, neurons and cardiomyocytes).
  is_representative: false
  why_not_representative: Data in the releases were derived from commercially available de-identified
    human cell lines and do not represent all biological variants which may be seen in the population
    at large.
  strategies: Multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in
    cancer, neuropsychiatric and cardiac disorders, together with their interactors and key signaling
    molecules; spatial proteomics mapping of 100 chromatin regulators in MDA-MB-468 with a further 500
    proteins pending significant hits from the genetic perturbation and PPI results; a CRISPR lentiviral
    library of 100 chromatin factors with 6 guide RNAs per gene; and an expressed genome-scale CRISPRi
    atlas over 11,739 targeted genes in KOLF2.1J.
data_collectors:
- name: Lundberg Lab, Stanford University
  role: Spatial proteomics image acquisition
  collector_details: Named in the release file metadata as the laboratory in which the immunofluorescence
    images of MDA-MB-468 cells were acquired by ICC-IF staining and confocal microscopy.
- name: Nevan Krogan laboratory, University of California San Francisco
  role: Mass spectrometry data generation
  collector_details: Named in the release file metadata as the laboratory in which the SEC-MS data on
    KOLF2.1J hiPSCs and on treated MDA-MB-468 breast cancer cells were generated.
- name: CM4AI Data Acquisition Module
  role: Data generation across modalities
  collector_details: The Data Acquisition Module is one of six CM4AI modules and completed parallel maps
    of protein-protein interactions, protein subcellular distributions and transcriptional states associated
    with a near-comprehensive set of chromatin regulators encoded by the human genome, generated in ethically
    sourced breast cancer cells and extended to ethically sourced human induced pluripotent stem cells.
collection_timeframes:
- name: NIH award period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details: NIH RePORTER records the CM4AI Data Generation Project as starting 2022-09-01 and
    ending 2026-08-31. Data are released quarterly over this period.
  source_caveats: The Dataverse release pages state instead that the dataset will be regularly updated
    and augmented "through the end of the project in November 2026". The two statements about when the
    project ends are not reconciled here.
missing_data_documentation:
- name: Coverage gaps and pending data
  missing_data_patterns: Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi
    perturb-seq data interrogate sets of proteins which incompletely overlap. Computed cell maps are not
    included in any release in the bundle. The flagship dataset summary marks IF images for the iPSC-derived
    cell types and AP-MS interactomes for the TNBC conditions as "coming soon"; AP-MS data for treated
    MDA-MB-468 cells first appear in the June 2026 release.
  missing_data_causes: Staged, quarterly release of an ongoing data generation project; temporary pre-publication
    embargo on some datasets; modality-specific coverage of different protein and gene sets.
raw_data_sources:
- name: Mass spectrometry raw data in the MassIVE repository
  source_description: SEC-MS data for KOLF2.1J iPSCs (undifferentiated, NPC, neuron and cardiomyocyte)
    and for MDA-MB-468 breast cancer cells with and without treatment, and AP-MS data for MDA-MB-468 cells
    treated with paclitaxel and with vorinostat, are linked from the release pages to the MassIVE repository.
  source_type: External mass spectrometry data repository
  access_details: Linked as "External Data Links" from the June 2025, October 2025 and June 2026 Dataverse
