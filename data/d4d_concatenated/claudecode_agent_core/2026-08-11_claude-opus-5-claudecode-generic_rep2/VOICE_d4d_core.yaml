source_caveats: 'This record is about the Bridge2AI-Voice adult dataset as a versioned PhysioNet project,
  identified by the project-level DOI 10.13026/37yb-1t42 that the pages record as "DOI (latest version)".
  Version-specific fields describe the current release, 3.1.0, whose own DOI is 10.13026/8xbn-nq66; the
  per-version DOIs are carried in resources and in version_access rather than at the top level. The bundle
  mixes documentation written for different releases and the disagreements are left as the sources state
  them rather than reconciled. The project documentation site (docs.b2ai-voice.org) carries a healthsheet
  whose composition, distribution and maintenance answers are written for the v2.0.0/v3.0.0 era: it reports
  the dataset as hosted by the Health Data Nexus and distributed at healthdatanexus.ai, whereas the PhysioNet
  v3.0.0 and v3.1.0 pages state the resource is maintained by the MIT Laboratory for Computational Physiology.
  Both statements are recorded here, scoped to what each source describes. The target size of the collection
  is stated three ways: the documentation site gives "a flagship, standardized, and ethically sourced
  dataset of 10,000 voices" and an anticipated enrolment count by 2027 of 10,000; the audiomics white
  paper gives "a publicly available database of 30 000 human voices"; and the IRB protocol gives 5,000
  participants at USF with 30,000 reached through participating institutions. Grant identifiers also disagree
  in form: NIH RePORTER gives project number 3OT2OD032720-01S3 and core project number OT2OD032720, the
  PhysioNet acknowledgements give 3OT2OD032720-01S1, and the documentation site renders the award as "3TF-OT2ActfOD032720Projectf01S1"
  and "Award #3Tf-OTOD03272001S2", which are evidently corrupted transcriptions and are not carried into
  the grant records here. The IRB number 004890 that appears in the bundle is the University of South
  Florida approval cited by the 2025 app feasibility publication, not an approval number stated for the
  data acquisition protocol, and is recorded only with that scope. Contact email addresses on the documentation
  site were redacted to a placeholder during preprocessing, so only the addresses that survive elsewhere
  in the bundle are recorded.'
distributions:
- id: d4d:b2ai-voice-adult/file/features/ppgs.parquet
  name: ppgs.parquet
  path: features/ppgs.parquet
  description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a dimension of
    40xT with a frame rate of 100 Hz. Contains 29,289 elements in v3.1.0 and 29,031 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/sparc_ema.parquet
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
  description: 'Estimated electromagnetic articulography produced by a deep learning model, with dimensions
    Tx12 where the twelve values are the X and Y positions of six articulators: tongue dorsum, tongue
    body, tongue tip, lower incisor, upper lip and lower lip. Contains 28,640 elements in v3.1.0 and 31,616
    in v3.0.0.'
- id: d4d:b2ai-voice-adult/file/features/sparc_loudness.parquet
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
  description: Estimated loudness based on the average absolute amplitude of the audio waveform, of size
    T, using 20 ms windows. Contains 31,855 elements in v3.1.0 and 31,616 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/sparc_periodicity.parquet
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
  description: Estimated periodicity, the confidence of pitch presence, derived from the audio using 20
    ms windows, of dimension T. Contains 31,872 elements in v3.1.0 and 31,633 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/sparc_pitch.parquet
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
  description: Estimated fundamental frequency of the audio signal computed with a different algorithm
    from torchaudio pitch, over a range of 50-550 Hz and of dimension T. Contains 31,872 elements in v3.1.0
    and 31,633 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/torchaudio_spectrogram.parquet
  name: torchaudio_spectrogram.parquet
  path: features/torchaudio_spectrogram.parquet
  description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier Transform with
    a 25 ms window size, 10 ms hop length and a 400-point FFT. Contains 29,278 elements in v3.1.0 and
    29,020 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/torchaudio_mel_spectrogram.parquet
  name: torchaudio_mel_spectrogram.parquet
  path: features/torchaudio_mel_spectrogram.parquet
  description: Mel spectrograms of dimension 60xT generated with a 25 ms window size, 10 ms hop length,
    a 400-point FFT and 60 Mel bins. Contains 29,278 elements in v3.1.0 and 29,020 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/torchaudio_mfcc.parquet
  name: torchaudio_mfcc.parquet
  path: features/torchaudio_mfcc.parquet
  description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the
    Mel spectrograms. Contains 29,278 elements in v3.1.0 and 29,020 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/torchaudio_pitch.parquet
  name: torchaudio_pitch.parquet
  path: features/torchaudio_pitch.parquet
  description: Detected pitch, the fundamental frequency, over time, of dimension T, with a minimum and
    maximum pitch of 80 and 500 respectively. Contains 32,522 elements in v3.1.0 and 32,236 in v3.0.0.
- id: d4d:b2ai-voice-adult/file/features/audio_quality_metrics.tsv
  name: audio_quality_metrics.tsv
  path: features/audio_quality_metrics.tsv
  description: One feature per audio recording derived from the raw audio, related to quality control
    metrics. Added in v3.1.0.
  format: TSV
  media_type: text/tab-separated-values
- id: d4d:b2ai-voice-adult/file/features/static_features.tsv
  name: static_features.tsv
  path: features/static_features.tsv
  description: Features derived from the raw audio with one feature per audio recording and one row per
    unique recording, drawn from openSMILE, Praat, parselmouth and torchaudio, with the accompanying data
    dictionary describing each feature.
  format: TSV
  media_type: text/tab-separated-values
- id: d4d:b2ai-voice-adult/file-collection/metadata
  name: metadata
  path: metadata/
  description: A Parquet binary file and its corresponding data dictionary carrying information about
    each recording, including task instructions and prompts and information about the microphone used
    and its gain. Introduced in v3.1.0.
- id: d4d:b2ai-voice-adult/file-collection/phenotype
  name: phenotype
  path: phenotype/
  description: Organised information collected from the participant or another individual during their
    encounter, as paired TSV data files and JSON data dictionaries under the subfolders confounders, demographics,
    diagnosis, enrollment, questionnaire and task. The diagnosis subfolder covers airway_stenosis, amyotrophic_lateral_sclerosis,
    anxiety, benign_lesions, bipolar_disorder, cognitive_impairment, control, copd_and_asthma, depression,
    glottic_insufficiency, laryngeal_cancer, laryngeal_dystonia, laryngitis, muscle_tension_dysphonia,
    parkinsons_disease, precancerous_lesions, unexplained_chronic_cough and unilateral_vocal_fold_paralysis.
    The questionnaire subfolder covers adhd_adult, custom_affect_scale, dsm5_adult, dyspnea_index, gad7_anxiety,
    leicester_cough_questionnaire, panas, phq9, productive_vocabulary, psychiatric_history, ptsd_adult,
    vhi10 and voice_perception. The task subfolder covers acoustic_task, harvard_sentences, random_item_generation,
    recording, session, stroop and winograd. Phenotype data files only contain rows for a participant
    if at least one column is not missing.
purposes:
- name: Enable voice AI research through an ethically sourced, diverse voice database
  response: The project aims to integrate the use of voice as a biomarker of health in clinical care by
    generating a substantial multi-institutional, ethically sourced and diverse voice database linked
    to multimodal health biomarkers, to fuel voice AI research and build predictive models that assist
    in screening, diagnosis and treatment of a broad range of diseases.
  description: 'Stated as the group''s aim in the NIH RePORTER project record, the IRB protocol and the
    project documentation site. The intended scale of the collection is given differently by different
    sources in the bundle: the documentation site describes a flagship dataset of 10,000 voices and an
    anticipated enrolment count by 2027 of 10,000, while the audiomics white paper describes a primary
    deliverable of a publicly available database of 30,000 human voices and the IRB protocol sets an enrolment
    aim of 5,000 participants at USF with 30,000 reached in collaboration with other participating institutions.'
- name: Support development of clinically applicable machine-learning models
  response: The dataset aims to enable the development, benchmarking or validation of clinically applicable
    machine-learning models for diagnosing a wide range of health conditions using voice data, including
    vocal pathologies and neurological, psychiatric, respiratory and pediatric voice disorders, and it
    is structured to be Findable, Accessible, Interoperable and Reusable.
- name: Establish standards for audiomics
  response: Beyond the database itself, the consortium aims to ensure quality and accuracy of acoustic
    and associated clinical data through clinical validation and evidence-based recording protocols, to
    achieve interoperability by creating new bioinformatics standards for voice data, to create benchmarks
    of diversity metrics and minimise the risk of algorithmic bias, to define ethical and legal norms
    safeguarding patients' data while supporting data-sharing efforts, to develop infrastructure for audiomics
    data storage and sharing within and across research institutions, and to formulate training pathways
    for scientists, engineers, bioethicists and clinicians.
tasks:
- name: Disease detection and classification from voice
  response: The current version of the dataset comes with predefined tasks and labelling. The tasks are
    primarily designed for training machine-learning models for disease detection and classification using
    voice data, with labels comprising diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders.
- name: Model pretraining, fine-tuning, benchmarking and validation
  response: The dataset can be used for AI model pretraining, fine-tuning, benchmarking or validation
    in support of clinical research on disease screening, diagnosis and monitoring through voice biomarkers.
addressing_gaps:
- name: Absence of large, diverse, well-documented clinical voice data
  response: The dataset was created to address a gap in the availability of large-scale, diverse and well-documented
    voice data for clinical machine-learning applications. Previous studies on machine-learning-based
    voice diagnosis produced promising results, but their sample sizes were too small or they lacked the
    key metadata needed for training robust, clinically useful models.
- name: Lack of standards for voice and speech data collection
  response: Comparing studies and pooling data are challenging because of the lack of standards in how
    voice and speech data are collected, and industry datasets are often private, limiting the ability
    to audit machine-learning models and the accuracy of training data labels. The consortium's stated
    purpose includes defining standards for audiomics data acquisition, interoperability and AI readiness.
- name: Limited size, quality and diversity of open-source voice datasets
  response: There is a lack of prospective study and validation of AI algorithms in audiomics on external
    datasets, which, compounded by the limited size, quality and diversity of existing open-source datasets,
    likely explains the absence of validated and FDA approved AI algorithms for disease detection and
    monitoring in this space. In machine-learning applications for screening and diagnosis of laryngeal
    cancer, most studies reported training datasets of fewer than 300 patients and only two studies used
    more than one data modality.
