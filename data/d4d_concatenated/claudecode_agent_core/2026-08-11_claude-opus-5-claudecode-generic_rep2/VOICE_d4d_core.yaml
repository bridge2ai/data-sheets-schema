id: https://doi.org/10.13026/37yb-1t42
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'Bridge2AI-Voice is a multi-institutional, ethically sourced voice, speech and respiratory-sound
  dataset linked to health metadata, produced by the Bridge2AI-Voice consortium under the NIH Common Fund
  Bridge2AI program and published on PhysioNet under credentialed registered access. Version 3.1.0 contains
  data for 833 adult participants recruited at five sites in North America, selected on the basis of known
  conditions that manifest within the voice waveform: voice disorders, neurological and neurodegenerative
  disorders, mood and psychiatric disorders, and respiratory disorders, together with control participants.
  Participants completed a standardised protocol of acoustic tasks, demographic and confounder surveys,
  disease-specific validated questionnaires, and clinician-performed gold-standard diagnostic validation,
  administered through a custom application on a tablet with a headset. The PhysioNet release contains
  data considered low risk: derived audio features such as spectrograms, Mel spectrograms, MFCCs, pitch,
  articulatory (sparc) features, phonetic posteriorgrams and openSMILE/Praat static features, delivered
  as Parquet and TSV files with JSON data dictionaries, together with per-recording metadata and organised
  phenotype tables covering demographics, confounders, diagnoses, enrolment and validated questionnaires.
  It does not contain the original voice recordings; raw audio for the adult cohort is disseminated separately
  through controlled access via Synapse after institutional sign-off.'
