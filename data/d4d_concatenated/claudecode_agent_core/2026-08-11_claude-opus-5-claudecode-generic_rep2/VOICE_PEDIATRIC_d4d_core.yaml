anomalies:
- id: d4d:VOICE_PEDIATRIC-anomaly-missing-features
  name: Recordings for which some features could not be generated
  description: 'Some files, whether due to length or other issues, could not generate certain features
    and so are not included in the bundled data. This is visible in the per-file counts: the torchaudio-derived
    features and the phonetic posteriorgrams cover 23,533 recordings, while the four sparc-derived feature
    files cover 23,532.'
  anomaly_details: torchaudio_spectrograms, torchaudio_mel_spectrograms, torchaudio_mfcc, torchaudio_pitch
    and ppgs have n=23533; sparc_ema, sparc_loudness, sparc_periodicity and sparc_pitch have n=23532.
- id: d4d:VOICE_PEDIATRIC-anomaly-removed-sensitive
  name: Features removed for sensitive records and audio checks
  description: Spectrograms, mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records and
    audio checks have been removed from version 1.1, so feature coverage is not uniform across all recordings
    in the release.
  anomaly_details: Removal applied in version 1.1 to sensitive records and audio checks.
known_biases:
- id: d4d:VOICE_PEDIATRIC-bias-single-site
  name: Single-site recruitment
  bias_type: selection_bias
  bias_description: 'All paediatric participants were recruited at a single institution, The Hospital
    for Sick Children in Toronto: the release methods state that patients and healthy volunteers at the
    Hospital for Sick Children were considered for enrollment, and the project documentation states that
    paediatric participants are recruited strictly from the Hospital for Sick Children and are grouped
    by age. Eligibility additionally required English proficiency.'
  affected_subsets:
  - All 300 participants in the release
  source_caveats: The declared bundle contains no bias analysis, demographic breakdown or representativeness
    assessment for the paediatric release. The entry records the recruitment arrangement the sources state;
    the resulting distribution is not described anywhere in the bundle.
known_limitations:
- id: d4d:VOICE_PEDIATRIC-limitation-no-raw-audio
  name: No original voice recordings in this release
  limitation_type: scope_limitation
  limitation_description: The published PhysioNet project contains derived features from the audio waveforms
    and does not contain raw audio. The release contains data considered low risk, including derivations
    such as spectrograms but not the original voice recordings.
  scope_impact: Work requiring the waveform itself cannot be carried out on this release.
  recommended_mitigation: Raw audio is available via Synapse at https://www.synapse.org/Synapse:syn73617068
    through a more involved process requiring institutional sign-off; interested users are directed to
    contact the access committee.
- id: d4d:VOICE_PEDIATRIC-limitation-single-site
  name: Collection at one institution
  limitation_type: representativeness_limitation
  limitation_description: Participants were enrolled at a single paediatric hospital in Toronto, Canada,
    and eligibility required English proficiency. The bundle presents no evidence about how the resulting
    cohort compares with any wider paediatric population.
  scope_impact: Generalisation beyond an English-proficient paediatric population seen at one tertiary
    paediatric centre is not supported by anything in the documentation.
- id: d4d:VOICE_PEDIATRIC-limitation-uneven-feature-coverage
  name: Uneven feature coverage across recordings
  limitation_type: coverage_limitation
  limitation_description: Features for sensitive records and audio checks were removed from version 1.1,
    and some files could not generate certain features because of length or other issues and are therefore
    absent from the bundled data.
  scope_impact: A recording present in one feature file is not guaranteed to be present in another; per-file
    counts differ.
  recommended_mitigation: Join feature tables on participant_id, session_id and task_name rather than
    assuming aligned row order or equal coverage.
- id: d4d:VOICE_PEDIATRIC-limitation-nonverbal-excluded
  name: Non-verbal children excluded
  limitation_type: coverage_limitation
  limitation_description: Exclusion criteria included individuals who were non-verbal, so the dataset
    does not represent children who cannot produce speech.
  scope_impact: The population of non-verbal children is out of scope for any analysis based on this dataset.
