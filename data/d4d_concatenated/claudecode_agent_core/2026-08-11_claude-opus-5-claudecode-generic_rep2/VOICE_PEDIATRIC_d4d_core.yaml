ethical_reviews:
- id: d4d:VOICE_PEDIATRIC-ethical-review
  name: Research Ethics Board approval at The Hospital for Sick Children
  reviewing_organization: Research Ethics Board, The Hospital for Sick Children, Toronto, Ontario, Canada
  review_details: Data collection and sharing was approved by the Research Ethics Board at the Hospital
    for Sick Children. The Bridge2AI Voice Data Acquisition protocol records that Canadian institutions,
    including SickKids, do not follow the University of South Florida single IRB process and apply for
    a separate research ethics board approval to comply with Canadian regulations, and that a copy of
    the approved board decision is submitted with their application. Revision V2 of that protocol, dated
    3 May 2023, was the modification that introduced the paediatric cohort.
  source_caveats: 'No approval number or approval date for the SickKids Research Ethics Board decision
    appears anywhere in the declared bundle. The two sources also differ on which body reviewed the paediatric
    cohort: the protocol''s revision history records V2 as bringing the paediatric cohort "under single
    IRB", while the body of the same protocol and the paediatric release state that the Canadian sites
    operate under a separate research ethics board approval. Both statements are recorded rather than
    one being selected.'
human_subject_research:
  id: d4d:VOICE_PEDIATRIC-human-subject-research
  name: Human subjects research involving children
  involves_human_subjects: true
  ethics_review_board: Research Ethics Board, The Hospital for Sick Children, Toronto, Ontario, Canada
  irb_approval:
  - Approved by the Research Ethics Board at The Hospital for Sick Children
  special_populations:
  - Children and adolescents aged 2 to 18 years
  description: The dataset derives from a prospective study in which patients and healthy volunteers at
    a paediatric hospital performed voice and speech tasks and completed questionnaires. The governing
    Bridge2AI Voice Data Acquisition protocol records that paediatric patients are enrolled only through
    the paediatric sites and that Checklist HRP-416 for children under 21 was completed and appended to
    the protocol.
informed_consent:
- id: d4d:VOICE_PEDIATRIC-informed-consent
  name: Consent for collection and data sharing
  consent_obtained: true
  consent_type: Parental or participant consent, with verbal child assent where developmentally appropriate
  consent_documentation: Assent is documented on a form; the governing protocol provides for signed parental
    permission and for signed or verbal assent for children.
  consent_scope: Consent covered both data collection and data sharing, and was obtained before any data
    were collected.
  withdrawal_mechanism: Participants may withdraw at any point; data provided before completion of the
    voice data collection are not included in the database, while data from completed collections are
    retained.
  source_caveats: The withdrawal terms are those of the University of South Florida single-IRB protocol;
    the paediatric cohort operates under a separate SickKids Research Ethics Board approval that is not
    in the declared bundle.
at_risk_populations:
  id: d4d:VOICE_PEDIATRIC-at-risk-populations
  name: Children as a protected population
  at_risk_groups_included: true
  special_protections:
  - Paediatric enrollment restricted to paediatric participating institutions
  - Checklist HRP-416 for children under 21 completed and appended to the protocol
  - No compensation offered to paediatric participants
  - Raw audio withheld from the public release
  assent_procedures: Children provide verbal assent where appropriate. Where young children cannot reasonably
    be asked to assent owing to limitations in understanding due to age and development, they are not
    asked to do so; this typically holds for children under seven years of age. Assent is documented.
  guardian_consent:
  - Parents or guardians provide consent for participating children
  - Parental permission may be obtained from one or both parents; the research is minimal risk and does
    not require permission from both parents or legal guardians
  description: Every data subject in this dataset was a minor between 2 and 18 years of age at the time
    of collection.
preprocessing_strategies:
- id: d4d:VOICE_PEDIATRIC-preprocessing-features
  name: Derivation of audio features from raw waveforms
  preprocessing_details: The code used to preprocess the raw audio waveforms into the parquet files and
    to merge the source data into the phenotype files has been made open source in the b2aiprep library.
    Time-varying features were computed with torchaudio (spectrograms with a 25 ms window, 10 ms hop and
    400-point FFT; 60-bin mel spectrograms; MFCCs; pitch with a range of 80-500), with sparc (electromagnetic
    articulography estimates from a deep learning model, loudness, periodicity and pitch over 20 ms windows
    with a 50-550 Hz range), and as phonetic posteriorgrams over 40 phoneme categories at 100 Hz. Static
    features were derived with openSMILE, Praat, parselmouth and torchaudio and collected in static_features.tsv,
    alongside audio quality metrics.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    description: Bridge2AI Data Processing Library, cited in the release as Johnson, A., Bevers, I., Ng,
      E., Wilke, J., Brito, R., Bedrick, S., Catania, F. & Ghosh, S. (2025), version 3.0.0.
  - id: d4d:VOICE_PEDIATRIC-software-torchaudio
    name: torchaudio
  - id: d4d:VOICE_PEDIATRIC-software-opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, the open-source audio feature
      extractor.
  - id: d4d:VOICE_PEDIATRIC-software-praat
    name: Praat
  - id: d4d:VOICE_PEDIATRIC-software-parselmouth
    name: parselmouth
    description: A Python interface to Praat.
  - id: d4d:VOICE_PEDIATRIC-software-sparc
    name: sparc
    description: Speech Articulatory Coding, used for electromagnetic articulography, loudness, periodicity
      and pitch estimates.
- id: d4d:VOICE_PEDIATRIC-preprocessing-tabular-export
  name: Export and conversion of collected data to tabular form
  preprocessing_details: Data were exported and converted to tab delimited values using an open-source
    library developed by the team. Paediatric data collected through ReproSchema-UI is extracted and transformed
    into REDCap format and subsequently converted to the Brain Imaging Data Structure (BIDS).
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    description: Bridge2AI Data Processing Library, cited in the release as Johnson, A., Bevers, I., Ng,
      E., Wilke, J., Brito, R., Bedrick, S., Catania, F. & Ghosh, S. (2025), version 3.0.0.
cleaning_strategies:
- id: d4d:VOICE_PEDIATRIC-cleaning-manual-check
  name: Manual review of free speech tasks
  cleaning_details: For version 1.1, audio features for all free speech tasks were manually checked for
    the presence of unconsented speakers and personally identifiable information before release. Spectrograms,
    mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records and audio checks were removed.
raw_sources:
- id: d4d:VOICE_PEDIATRIC-raw-source-synapse
  name: Raw audio for the Bridge2AI Voice paediatric cohort
  access_url: https://www.synapse.org/Synapse:syn73617068
  raw_data_details: The published PhysioNet project does not contain raw audios. Accessing raw audio is
    a more involved process and requires institutional sign-off; prospective users are directed to the
    access committee at DACO@b2ai-voice.org. The data are made available via Synapse.
intended_uses:
- id: d4d:VOICE_PEDIATRIC-intended-use-research
  name: Research on paediatric voice and speech
  use_category: Research
  description: The dataset is intended to enable future research in artificial intelligence and to support
    critical insights into the use of voice as a biomarker of health, specifically in a paediatric population
    for which adult normative data do not generalise.
  examples:
  - Study of developmental norms in paediatric voice and speech
  - Creation of AI-driven tools for early screening of communication disorders
  - Investigation of the relationship between voice and disease in children, including autism spectrum
    disorder and speech delays
  usage_notes: If using Python, the parquet dataset can be loaded with the HuggingFace datasets library,
    for example Dataset.from_parquet("torchaudio_spectrogram.parquet"). A spectrogram can be plotted in
    decibels by converting it from its original power representation with librosa.power_to_db. A phenotype
    file can be read with any statistical analysis tool, for example pandas.read_csv with a tab separator.
    Each data file is accompanied by a JSON data dictionary whose keys are the column names and whose
    description values give a one-sentence summary of each column.
discouraged_uses:
- id: d4d:VOICE_PEDIATRIC-discouraged-non-research
  name: Non-research applications
  discouragement_details: The dataset should not be used for non-research applications such as hiring
    decisions, insurance premium adjustments, or any form of surveillance that could lead to discrimination
    or harm. These limitations are intended to prevent unethical or biased outcomes that could negatively
    impact individuals based on their health conditions or voice characteristics.
  description: Stated in the project documentation as a restriction flowing from the Registered Data Access
    Agreement, which is the agreement a user of this dataset signs on PhysioNet.
prohibited_uses:
- id: d4d:VOICE_PEDIATRIC-prohibited-reidentification
  name: Attempts to re-identify research participants
  prohibition_reason: The dataset is not to be used to attempt to re-identify research participants, nor
    for any actions that could reasonably lead to re-identification.
  description: A term of the Registered Data Access Agreement, reflecting the consortium's commitment
    to advancing ethical and trustworthy research practices that respect and protect the rights and interests
    of research participants.
- id: d4d:VOICE_PEDIATRIC-prohibited-harm
  name: Uses that could cause harm or stigmatisation
  prohibition_reason: The dataset is not to be used for any purpose that could foreseeably cause harm
    or stigmatization to research participants, their families, communities, or specific populations.
- id: d4d:VOICE_PEDIATRIC-prohibited-ip-blocking
  name: Use of intellectual property rights to restrict access
  prohibition_reason: Intellectual property protections, database rights, or related rights may not be
    used in a manner that restricts or limits access to any part of the dataset or to any conclusions
    derived from it, so that future use of the dataset remains unrestricted in alignment with the consortium's
    open science principles.
distribution_formats:
- id: d4d:VOICE_PEDIATRIC-distribution-parquet
  name: Parquet feature files
  format: Parquet
  description: Binary files are made available as Parquet, an open-source column-oriented data file format.
    Each parquet file carries participant_id, session_id, task_name, n_frames and the tensor data for
    the feature.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- id: d4d:VOICE_PEDIATRIC-distribution-tsv
  name: Tab-delimited tables
  format: TSV
  media_type: text/tab-separated-values
  description: Plain-text tab-delimited tables carrying static features, audio quality metrics and the
    phenotype data. Data were exported and converted to tab delimited values by the team's open-source
    library.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- id: d4d:VOICE_PEDIATRIC-distribution-json
  name: JSON data dictionaries
  format: JSON
  media_type: application/json
  description: Each data file is associated with a data dictionary file that has the same file stem and
    a JSON suffix. Each dictionary maps column names of the associated data file to further detail, including
    a one-sentence description of the column.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
distribution_dates:
- id: d4d:VOICE_PEDIATRIC-distribution-dates
  name: PhysioNet release dates
  release_dates:
  - '2025-12-17'
  - '2026-05-01'
  description: Version 1.0.0 was released on 17 December 2025 and version 1.1.0 on 1 May 2026.
license_and_use_terms:
  id: d4d:VOICE_PEDIATRIC-license-and-use-terms
  name: Registered access licence and agreement
  license_terms: 'Access policy: only credentialed users who sign the data use agreement can access the
    files. The licence for the files is the Bridge2AI Voice Registered Access License and the data use
    agreement is the Bridge2AI Voice Registered Access Agreement. No training is required. For the features-only
    data, users register on PhysioNet, confirm their identity under the Registered Access License, and
    sign the Bridge2AI-Voice Registered Access Agreement. For the raw audio data, users complete a Data
    Access Request Form and a Data Use Agreement, submit the application to the Data Access Compliance
    Office for review, and on approval ensure that a Data Use and Transfer Agreement is signed by an authorised
    official at their institution.'
  data_use_permission: general_research_use
  description: The Registered Data Access Agreement states that the dataset is intended solely for commercial
    and non-commercial research purposes by Authorized Researchers.
ip_restrictions:
  id: d4d:VOICE_PEDIATRIC-ip-restrictions
  name: Intellectual property terms of the access agreement
  restrictions:
  - The Data may be protected by copyright and other rights, including other intellectual property rights;
    duplication as reasonably required to carry out the research project is nonetheless permitted.
  - Sale of all or part of the Data on any media is not permitted.
  - Nothing in the agreement operates to transfer any intellectual property rights in or relating to the
    Data to the user, and users agree not to make intellectual property claims on the Data.
  - Users agree not to use intellectual property protection in ways that would prevent or block access
    to, or use of, any element of the Data, or conclusions drawn directly from the Data.
  - Users may obtain intellectual property rights on downstream discoveries but agree to implement licensing
    policies that will not obstruct further research, and to respect the Fort Lauderdale Agreement.
  description: Reproduced from the intellectual property clause of the registered access agreement. There
    are no fees associated with these restrictions.
regulatory_restrictions:
  id: d4d:VOICE_PEDIATRIC-regulatory-restrictions
  name: Access restrictions and confidentiality status
  confidentiality_level: restricted
  other_compliance: The Data Transfer and Use Agreement records that the Data is covered under a Certificate
    of Confidentiality, which must be asserted against compulsory legal demands such as court orders and
    subpoenas, and that the Data is Personally Identifiable Information as defined in OMB Memorandum M-07-16.
    Recipients agree to store the Data with security controls adequate to protect personally identifiable
    information, and not to use the Data to contact data subjects without appropriate ethics board approval,
    written approval from the provider, and informed consent from the individual where required.
  description: 'PhysioNet describes the resource as a restricted-access resource: to access the files
    a user must be a credentialed user and sign the data use agreement for the project.'
  source_caveats: The declared bundle makes no statement about export controls applying to this dataset,
    and the HIPAA de-identification statements in the project documentation are scoped to the adult release;
    neither is asserted here.
is_deidentified:
  id: d4d:VOICE_PEDIATRIC-deidentification
  name: De-identification of the released data
  identifiable_elements_present: false
  method: Publication of derived features in place of the original recordings, combined with manual review
    of free speech features and removal of features for sensitive records.
  identifiers_removed: The original voice recordings are not included in the release. In version 1.1,
    audio features for all free speech tasks were manually checked for the presence of unconsented speakers
    and personally identifiable information before release.
  deidentification_details: The release contains data considered low risk, including derivations such
    as spectrograms but not the original voice recordings. Spectrograms, mel spectrograms, MFC coefficients,
    PPGs and EMAs for sensitive records and audio checks have been removed from version 1.1.
maintainers:
- id: d4d:VOICE_PEDIATRIC-maintainer-lcp
  name: MIT Laboratory for Computational Physiology
  role: academic_institution
  maintainer_details: PhysioNet, the platform on which this dataset is published, is maintained by the
    MIT Laboratory for Computational Physiology and supported by NIBIB, NHLBI and the NIH Office of the
    Director under NIH grant numbers U24EB037545 and R01EB030362.
- id: d4d:VOICE_PEDIATRIC-maintainer-consortium
  name: Bridge2AI-Voice Consortium
  role: academic_institution
  maintainer_details: The consortium prepared the release and operates the access committee and Data Access
    Compliance Office. For questions regarding the dataset itself, the PhysioNet page directs users to
    the corresponding author listed on the sidebar; the corresponding author's contact information is
    visible only to logged-in users and is therefore not recorded here.
updates:
  id: d4d:VOICE_PEDIATRIC-updates
  name: Release history of the paediatric dataset
  update_details: Version 1.0.0 was the first release of the Bridge2AI-Voice Pediatric dataset. Version
    1.1 released no new participants; it added audio features for all free speech tasks that were manually
    checked for the presence of unconsented speakers and personally identifiable information, new metrics
    related to the audio quality of the recordings, and per-recording metadata information.
  source_caveats: The declared bundle states no schedule or frequency for future paediatric releases.
retention_limit:
  id: d4d:VOICE_PEDIATRIC-retention-limit
  name: Retention terms in the governing agreements
  retention_details: Under the Data Transfer and Use Agreement, the agreement term ends two years after
    the start date, upon completion of the project, upon expiration of the applicable ethics approval,
    or upon termination, whichever occurs first, at which point the recipient destroys the Data in accordance
    with the provider's instructions and submits written certification of destruction within thirty days;
    the recipient may retain one copy to the extent necessary to comply with records retention requirements
    under law, regulation or institutional policy and for research integrity and verification. Under the
    Bridge2AI Voice Data Acquisition protocol, identifiable data and the datasheets linking participant
    numbers to participant information are kept at each institution on local cloud storage for a maximum
    of ten years after study completion and are then destroyed, and de-identified study data and original
    consent forms are stored for a minimum of five years after study completion.
  source_caveats: Both statements govern the recipient's copy and the collecting institutions' local holdings
    respectively. Neither is a statement about how long this PhysioNet release will remain available.
version_access:
  id: d4d:VOICE_PEDIATRIC-version-access
  name: Published versions
  latest_version_doi: https://doi.org/10.13026/mf9s-5r03
  versions_available:
  - 1.0.0
  - 1.1.0
  version_details: Version 1.0.0 was published on 17 December 2025 and version 1.1.0 on 1 May 2026. The
    DOI for version 1.1.0 is https://doi.org/10.13026/h995-bt35 and the DOI for the latest version is
    https://doi.org/10.13026/mf9s-5r03.
extension_mechanism:
  id: d4d:VOICE_PEDIATRIC-extension-mechanism
  name: Contributing to the processing code
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: The code used to preprocess the raw audio waveforms into the parquet files and to
    merge the source data into the phenotype files has been made open source, so improvements to the data
    preprocessing can be contributed through the repository's issue and pull request mechanisms.
  source_caveats: The declared bundle describes no mechanism for third parties to contribute additional
    data or derivative releases of the paediatric dataset itself.
distributions:
- id: d4d:VOICE_PEDIATRIC-file-torchaudio-spectrograms
  name: torchaudio_spectrograms.parquet
  path: features/torchaudio_spectrograms.parquet
  description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier Transform with
    a 25 ms window size, 10 ms hop length and a 400-point FFT. n=23533.
- id: d4d:VOICE_PEDIATRIC-file-torchaudio-mel-spectrograms
  name: torchaudio_mel_spectrograms.parquet
  path: features/torchaudio_mel_spectrograms.parquet
  description: Mel spectrograms of dimension 60xT generated with a 25 ms window size, 10 ms hop length,
    a 400-point FFT and 60 Mel bins. n=23533.
- id: d4d:VOICE_PEDIATRIC-file-torchaudio-mfcc
  name: torchaudio_mfcc.parquet
  path: features/torchaudio_mfcc.parquet
  description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the
    mel spectrograms. n=23533.
- id: d4d:VOICE_PEDIATRIC-file-torchaudio-pitch
  name: torchaudio_pitch.parquet
  path: features/torchaudio_pitch.parquet
  description: Detected pitch (fundamental frequency) over time, of dimension T, with a minimum and maximum
    pitch of 80 and 500 respectively. n=23533.
- id: d4d:VOICE_PEDIATRIC-file-sparc-ema
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
  description: 'Estimated electromagnetic articulography (EMA) produced with a deep learning model, of
    dimensions Tx12, where the 12 correspond to the X and Y positions of six articulators: tongue dorsum,
    tongue body, tongue tip, lower incisor, upper lip and lower lip. n=23532.'
- id: d4d:VOICE_PEDIATRIC-file-sparc-loudness
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
  description: Estimated loudness based on the average absolute amplitude of the audio waveform, of size
    T, using 20 ms windows. n=23532.
- id: d4d:VOICE_PEDIATRIC-file-sparc-periodicity
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
  description: Estimated periodicity (confidence of pitch presence) derived from the audio using 20 ms
    windows, of dimension T. n=23532.
- id: d4d:VOICE_PEDIATRIC-file-sparc-pitch
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
  description: Estimated fundamental frequency of the audio signal using a different algorithm from torchaudio_pitch,
    with a range of 50-550 Hz and dimension T. n=23532.
- id: d4d:VOICE_PEDIATRIC-file-ppgs
  name: ppgs.parquet
  path: features/ppgs.parquet
  description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a dimension of
    40xT with a frame rate of 100 Hz. n=23533.
- id: d4d:VOICE_PEDIATRIC-file-static-features
  name: static_features.tsv
  path: features/static_features.tsv
  format: TSV
  description: Plain-text table of features derived from the open-source Speech and Music Interpretation
    by Large-space Extraction (openSMILE), Praat, parselmouth and torchaudio.
- id: d4d:VOICE_PEDIATRIC-file-audio-quality-metrics
  name: audio_quality_metrics.tsv
  path: features/audio_quality_metrics.tsv
  format: TSV
  description: Plain-text table of metrics related to audio quality derived from the recordings. Introduced
    in version 1.1.
- id: d4d:VOICE_PEDIATRIC-file-demographics
  name: demographics.tsv
  path: phenotype/demographics.tsv
  format: TSV
  description: Tab-separated demographic responses, named in the usage notes as an example of a phenotype
    file.
