id: https://doi.org/10.13026/mf9s-5r03
name: Bridge2AI-Voice Pediatric Dataset
title: Bridge2AI-Voice Pediatric Dataset
description: A credentialed-access PhysioNet database of derived audio features and linked phenotypic
  data from paediatric voice and speech recordings. Version 1.1.0 contains derived audio features for
  23,533 recordings collected from 300 participants aged 2-18 years, together with detailed demographic,
  clinical and validated questionnaire data. The release contains data considered low risk, including
  derivations such as spectrograms, but not the original voice recordings; raw audio is distributed separately
  under controlled access. Participants were patients and healthy volunteers enrolled at The Hospital
  for Sick Children (SickKids) in Toronto, Canada, using a standardised age-appropriate protocol delivered
  through reproschema-ui on tablets. The dataset is part of the Bridge2AI-Voice project, an NIH Common
  Fund Bridge2AI Grand Challenge that seeks to create an ethically sourced flagship dataset enabling research
  into voice as a biomarker of health.
version: 1.1.0
doi: 10.13026/mf9s-5r03
page: https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
publisher: https://physionet.org/
issued: '2026-05-01T00:00:00+00:00'
status: Published
language: en
license: Bridge2AI Voice Registered Access License
is_tabular: true
was_derived_from: Raw audio waveforms and questionnaire responses collected from paediatric participants
  at The Hospital for Sick Children; audio features were derived from the waveforms and the source data
  merged into the phenotype files using the open-source b2aiprep library.
keywords:
- health
- pediatric
- biomarkers
- bridge2ai
- voice
source_caveats: 'The PhysioNet landing page gives two DOIs for this resource: 10.13026/mf9s-5r03 for the
  latest version and 10.13026/h995-bt35 for version 1.1.0 specifically. The project-level DOI is used
  as the record identifier and the release DOI is carried in the citation and in version_access. Five
  of the six documents in the declared bundle (the USF IRB protocol, the b2ai-voice.org documentation,
  the NIH RePORTER page, the data transfer and use agreement and the documentation repository README)
  describe the Bridge2AI-Voice programme as a whole and were written primarily around the adult cohort;
  statements in them that are explicitly scoped to the adult dataset (for example the healthsheet figures
  of 833 participants, five recording sites, a 12-month collection window, iPad and Avid AE-36 microphone
  hardware, and dataset versions 2.0.0 and 3.0.0) are not asserted of this dataset and are not reproduced
  here. Only the PhysioNet paediatric release page is specific to this dataset.'
