purposes:
- id: d4d:VOICE_PEDIATRIC-purpose-pediatric-voice-dataset
  name: Establish a paediatric voice and speech dataset
  description: Establishing a robust multi-institutional dataset that integrates paediatric voice data
    with demographic information would advance the understanding of voice and disease as well as early
    detection and intervention. Resources such as this project are intended to enable study of developmental
    norms, create AI-driven tools for early screening and support clinical insight.
  response: To provide paediatric voice, speech and linked phenotypic data for machine learning research,
    in a population for which large-scale publicly available datasets have been lacking.
- id: d4d:VOICE_PEDIATRIC-purpose-voice-as-biomarker
  name: Support voice as a biomarker of health
  description: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset to enable
    future research in artificial intelligence and support critical insights into the use of voice as
    a biomarker of health. Voice is a promising characteristic to measure as it is simple to collect,
    cost-effective, and has broad clinical utility.
  response: To enable future artificial intelligence research on voice as a biomarker of health, of which
    this paediatric release forms one part.
tasks:
- id: d4d:VOICE_PEDIATRIC-task-developmental-norms
  name: Study of developmental norms
  description: Enabling study of developmental norms in paediatric voice and speech. Paediatric and adult
    voice and speech production are fundamentally different because the respiratory system and larynx
    undergo rapid functional maturation throughout childhood, and these developmental changes can influence
    acoustic features such as fundamental frequency.
  response: Study of developmental norms in paediatric voice and speech.
- id: d4d:VOICE_PEDIATRIC-task-early-screening
  name: AI-driven tools for early screening
  description: Creating AI-driven tools for early screening of paediatric communication disorders such
    as autism spectrum disorder and speech delays, and supporting timely intervention.
  response: Development of AI-driven early screening tools.
addressing_gaps:
- id: d4d:VOICE_PEDIATRIC-gap-scarce-pediatric-data
  name: Scarcity of large-scale paediatric voice datasets
  description: Despite the clinical importance of detecting paediatric communication disorders such as
    autism spectrum disorder and speech delays, the availability of large-scale paediatric databases remains
    limited. Data collection in paediatric populations poses unique challenges such as privacy issues,
    consent processes and the need for developmentally appropriate tasks. These factors have contributed
    to the lack of publicly available paediatric datasets that enable machine learning for paediatric
    voice analysis.
  response: Provides a publicly documented, credentialed-access paediatric voice feature dataset where
    large-scale paediatric datasets were previously unavailable.
- id: d4d:VOICE_PEDIATRIC-gap-adult-data-not-generalisable
  name: Adult normative data do not generalise to children
  description: Evidence and normative data available in adults cannot be generalised to paediatric populations,
    because the respiratory system and larynx undergo rapid functional maturation and development throughout
    childhood.
  response: Supplies paediatric-specific acoustic and phenotypic data rather than relying on extrapolation
    from adult cohorts.
