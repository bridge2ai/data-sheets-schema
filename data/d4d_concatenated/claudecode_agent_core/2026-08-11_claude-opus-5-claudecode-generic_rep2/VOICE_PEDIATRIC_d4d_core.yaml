sensitive_elements:
- id: d4d:VOICE_PEDIATRIC-sensitive-elements
  name: Health, demographic and questionnaire data about minors
  sensitive_elements_present: true
  sensitivity_details: The release makes available detailed demographic, clinical and validated questionnaire
    data collected from children and adolescents aged 2 to 18, alongside derived acoustic features. The
    questionnaires covered voice and speech and medical history.
  description: All data subjects were minors at the time of collection, and the data concern their health.
    Access is correspondingly restricted to credentialed users who sign the data use agreement.
acquisition_methods:
- id: d4d:VOICE_PEDIATRIC-acquisition
  name: Acquisition of paediatric voice and questionnaire data
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  acquisition_details: Voice and speech were recorded directly from participants performing a standardised
    age-appropriate protocol. Demographic information, voice and speech related questionnaires, and questionnaires
    inquiring about medical history were reported by the participants, or by parents or decision-makers
    on a separate tablet where the participant lacked adequate comprehension of, or familiarity with,
    their own past medical history. The published feature values are derived from the recorded waveforms
    rather than observed directly.
collection_mechanisms:
- id: d4d:VOICE_PEDIATRIC-collection-mechanism
  name: Tablet-based collection through reproschema-ui
  mechanism_details: All data were collected through customised software, reproschema-ui, on tablets.
    A headset was used to record for most participants, while the remaining recordings used the built-in
    tablet microphone because of low tolerance of wearing headphones or existing complex medical conditions.
    All participants completed the recording and demographic data collection in one session; where needed,
    a parent or decision-maker completed the survey on a separate tablet at the same time, which improved
    efficiency and minimised participant burden and fatigue.
  description: The project documentation confirms that for paediatrics all data is collected using reproschema-ui
    with the Bridge2AI-Voice paediatric protocol, in contrast to the Bridge2AI-Voice app used for adults.
  used_software:
  - id: d4d:VOICE_PEDIATRIC-software-reproschema-ui
    name: reproschema-ui
    description: Customised tablet software through which the paediatric protocol was administered.
sampling_strategies:
- id: d4d:VOICE_PEDIATRIC-sampling
  name: Eligibility-screened enrollment at one paediatric hospital
  is_sample: true
  strategies: Patients and healthy volunteers at The Hospital for Sick Children were considered for enrollment.
    Patients were eligible if they were 2 to 18 years of age and English proficient. Exclusion criteria
    were being over 18 years of age and being non-verbal. Non-patients, recruited through research postings,
    were evaluated for eligibility against the same inclusion and exclusion criteria.
  description: Version 1.1.0 released no new participants relative to version 1.0.0, so the 300 participants
    are those enrolled for the first release.
  source_caveats: The bundle does not state the size of the population from which the 300 participants
    were drawn, nor whether selection among eligible candidates was randomised.
data_collectors:
- id: d4d:VOICE_PEDIATRIC-collector-sickkids
  name: Research team at The Hospital for Sick Children
  role: Site data collection team
  collector_details: Paediatric data collection was performed only at paediatric participating institutions
    and not at the University of South Florida. The project documentation names Jennifer Sui, MD as the
    Hospital for Sick Children lead investigator; Annex C of the IRB protocol names Alistair Johnson,
    DPhil as the lead investigator for the same site.
  description: Eligibility screening, consent, and administration of the age-appropriate protocol on tablets
    were carried out at the site.
missing_data_documentation:
- id: d4d:VOICE_PEDIATRIC-missing-data
  name: Known gaps in feature coverage
  missing_data_patterns: 'Feature files differ in coverage: five feature files cover 23,533 recordings
    and four cover 23,532. Spectrograms, mel spectrograms, MFC coefficients, PPGs and EMAs are absent
    for sensitive records and audio checks.'
  missing_data_causes: Some files, whether due to length or other issues, could not generate certain features
    and so are not included in the bundled data. Separately, features for sensitive records and audio
    checks were deliberately removed in version 1.1.
  handling_strategy: Affected rows are omitted from the corresponding feature files rather than imputed
    or flagged.
