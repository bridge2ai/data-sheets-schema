acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: The data was directly observable and reported by subjects. Clinical
    diagnoses were verified by clinicians reviewing audio and/or imaging data, looking at
    electronic health records, or medication prescriptions.
collection_mechanisms:
- name: Bridge2AI-Voice App
  description: Custom software application used with the Bridge2AI-Voice protocols to collect
    voice samples prospectively; data collection was conducted using the application on a
    tablet, with a headset when possible.
  mechanism_details: The protocol involved collection of demographic information, health questionnaires,
    targeted questionnaires inquiring about known confounders for voice (such as smoking and
    drinking history), disease-specific information, and voice recording tasks such as sustained
    phonation of a vowel sound.
- name: iPad (9th or 10th generation)
  description: Tablet on which data is collected.
  source_caveats: Device detail from the project documentation's healthsheet, which describes
    version 2.0.0 of the dataset.
- name: iPad Air (5th generation)
  description: Tablet on which data is collected.
  source_caveats: Device detail from the project documentation's healthsheet, which describes
    version 2.0.0 of the dataset.
- name: Avid AE-36 microphone
  description: Microphone connected to the iPad with an Apple dongle for recording.
  source_caveats: Device detail from the project documentation's healthsheet, which describes
    version 2.0.0 of the dataset.
- name: REDCap database
  description: Under the IRB protocol, data will be entered into a REDCap database as part
    of the Case Report Form.
  source_caveats: Stated in the IRB protocol's future tense; the release page states that
    data were exported and converted from REDCap.
missing_data_documentation:
- missing_data_causes: Some questions are optional, and data collection irregularities may
    have caused some information to be missing from individual instances.
  missing_data_patterns: Phenotype data files only contain rows for a participant if at least
    one column is not missing.
  handling_strategy: The dataset has been audited internally for missingness and consistency
    by the data release team, and a missingness table is included with the dataset.
- missing_data_causes: Some files, whether due to length or other issues, could not generate
    certain features, and those features are not included in the bundled data.
raw_data_sources:
- source_description: Raw audio files and questionnaire data retrieved from ReproSchema-UI
    or exported from REDCap, converted to be compliant with the Brain Imaging Data Structure
    (BIDS) v1.9.0. The raw audio is not part of this release.
  raw_data_format: WAV
  access_details: Raw audio data is disseminated through controlled access only, to protect
    participants' privacy.
sampling_strategies:
- strategies: Non-probability sample. Participants are recruited across different academic
    institutions from high volume expert clinics based on diagnosis and inclusion/exclusion
    criteria; patients presenting at a given clinic were screened for inclusion and exclusion
    criteria prior to their visit by the project investigators. Under the IRB protocol, potential
    participants will be recruited through clinic appointments at the participating facilities,
    and if specific diagnoses or severities are under-represented in the dataset, participants
    will be identified by medical record review based on voice-disorder related diagnostic
    codes.
  is_sample: true
  is_random: false
  is_representative: false
  why_not_representative: The data was collected at a limited number of geographic locations.
  source_caveats: Sample and representativeness statements are from the project documentation's
    healthsheet, which describes version 2.0.0 of the dataset.
preprocessing_strategies:
- name: Export and conversion of REDCap data
  description: Data were exported and converted from REDCap using an open source library developed
    by the project team.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    description: Library for organizing and preprocessing the dataset; release 3.1.0 was generated
      with b2aiprep v3.0.0.
- name: Audio standardization
  description: Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
    with a Butterworth anti-aliasing filter applied.
- name: Feature extraction
  description: Features were extracted from the raw audio to limit re-identification, and
    only the extracted features are released.
  preprocessing_details: Spectrograms computed with the short-time FFT (25 ms window, 10 ms
    hop, 400-point FFT) and downsampled by a factor of two in time; 60 MFCCs extracted from
    the spectrograms; Mel spectrograms (60 Mels); articulatory features from the Speech Articulatory
    Coding (sparc) package, including electromagnetic articulography (EMA) estimates plus
    loudness, periodicity and pitch; acoustic features from OpenSMILE (eGeMAPS features per
    audio file); phonetic and prosodic features from Parselmouth and Praat; and phonetic posteriorgrams
    (PPGs) from the ppgs package; torchaudio-based pitch contours.
  used_software:
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Toolkit for processing audio files for research tasks.
cleaning_strategies:
- name: Audit protocol
  description: Generate missingness tables.
  cleaning_details: Check distributions and outliers; for categorical responses, check against
    schema; for audio tasks, run quality control metrics; for speech, check produced speech
    relative to intended passage.
labeling_strategies:
- description: Clinical validation is performed by a qualified physician or practitioner based
    on established gold standards for diagnosis.
  labeling_details: 'Diagnostic labels are the result of a clinical assessment of the participant:
    at each site a local clinician provided the diagnosis based on a clinical interview and
    appropriate work-up. For the psychiatric disorders cohort, the assessment was determined
    using the participant''s EHR record or an active prescription.'
  annotations_per_item: 1
  data_annotation_protocol: Per Bridge2AI Protocols and ICD-10 codes.
machine_annotation_tools:
- tools:
  - OpenAI Whisper Large
  tool_descriptions: Transcriptions were generated using OpenAI's Whisper Large model.
existing_uses:
- description: A restricted version of the dataset containing raw audio has been used in the
    Bridge2AI Summer School and hackathon.
discouraged_uses:
- description: Non-research applications such as hiring decisions, insurance premium adjustments,
    or any form of surveillance that could lead to discrimination or harm.
intended_uses:
- description: AI model pretraining, fine-tuning, benchmarking, or validation.
prohibited_uses:
- description: Attempting to re-identify research participants, or any actions that could
    reasonably lead to re-identification.
- description: Any purpose that could foreseeably cause harm or stigmatization to research
    participants, their families, communities, or specific populations.
- description: Using the controlled-access data, alone or with other information, to contact
    individuals who are the subjects of the data without appropriate IRB approval.
  source_caveats: Stated in the Data Transfer and Use Agreement template, which governs data
    provided under controlled access (the raw audio route); the release page does not state
    it for the credentialed-access feature release.
