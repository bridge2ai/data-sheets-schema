instances:
- instance_type: person
  description: Each instance represents a person (participant). A subset of participants required
    multiple sessions to complete data collection, so there may be more than one session per
    participant in the current dataset.
  counts: 833
  source_caveats: The count is the release 3.1.0 statement of 833 participants; the project
    documentation's healthsheet states the same figure.
anomalies:
- anomaly_details: Different sites have different collection configurations, and the collection
    protocol changed over the course of the study.
known_biases:
- bias_description: The dataset has skews based on disorder category, site, and other demographic
    factors.
  mitigation_strategy: Users should consider the multivariate distribution when assessing
    utility for different questions.
- bias_description: Groups that have less trust in the medical system or AI, or that are less
    proximal to the collection sites, would have been less likely to be recruited.
known_limitations:
- limitation_description: The public data releases do not contain an equal distribution of
    the disease categories.
- limitation_description: Certain aspects of the data (for example, transcription) were generated
    using off-the-shelf models that have not been audited for correctness.
- limitation_description: Participants were screened for different disorders based on site,
    so they also had their data collected with different devices.
- limitation_description: 'Confounding factors that may be present: noise artifacts, variations
    in diagnostic practices, inaccurate questionnaire responses, and underreporting.'
- limitation_description: There is no requirement that a participant provide the same response
    at each visit, so participant information for the same data element may vary across a
    data file.
content_warnings:
- warnings:
  - The dataset includes the transcription of free speech tasks; while the inclusion of offensive
    or unsafe content is unlikely, it cannot be completely avoided because research participants
    are responsible for their choice of language.
