errata:
- erratum_details: Release 3.1.0 fixed broken parquet files from the previous release.
updates:
  frequency: Planned semi-annual (twice a year) releases of further versions.
  update_details: Further releases will contain additional data.
  source_caveats: The semi-annual plan is stated in the project documentation's healthsheet,
    which names the Health Data Nexus platform as the release channel.
retention_limit:
  retention_details: Once data is contributed, it will be retained as long as it is useful
    for research purposes, possibly indefinitely.
version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
  - '1.1'
  - 2.0.0
  - 2.0.1
  - 3.0.0
  - 3.1.0
  version_details: Release 3.1.0 (DOI 10.13026/8xbn-nq66) is a minor update with no new participants
    but some additional data for certain participants. Older versions are supported by default
    and each version has a unique DOI. An earlier version of the feature-only dataset is available
    on Health Data Nexus, which provides cloud compute alongside the dataset rather than allowing
    downloads.
extension_mechanism:
  extension_details: The open-source preprocessing repositories accept pull requests for contributing
    improvements to the data preprocessing code.
ethical_reviews:
- reviewing_organization: University of South Florida Institutional Review Board
  review_details: Data collection and sharing was approved by the University of South Florida
    Institutional Review Board; the study was submitted and approved by the USF Single IRB
    and subsite IRBs through the Single IRB process.
- review_details: Under the IRB protocol, the Canadian institutions (MSH, SickKids and UofT)
    do not use the single IRB process and will apply for a separate research ethics board
    review to comply with Canadian regulations.
human_subject_research:
  involves_human_subjects: true
informed_consent:
- consent_obtained: true
  description: All participants were informed and agreed to the collection and use of their
    data via prospective informed consent; consent was sought for the data collection initiative
    and to share the acquired research data.
  consent_scope: Data that poses a low risk of individual re-identification is shared in registered
    access with the general public.
  consent_documentation: Participants may consent by signing a physical paper copy, by indicating
    electronic consent within the app or through REDCap surveys, or through video recording
    within the app.
license_and_use_terms:
  license_terms: 'Credentialed access: only credentialed users who sign the data use agreement
    (Bridge2AI Voice Registered Access Agreement) can access the files, under the Bridge2AI
    Voice Registered Access License. No training is required.'
  source_caveats: The release page (manifest tier 1) labels access as credentialed; the project
    documentation (tier 2) describes the features-only data as registered access requiring
    PhysioNet registration and a signed agreement. The release page is preferred.
ip_restrictions:
  restrictions:
  - Sale of all or part of the Data on any media is not permitted.
  - Users agree not to make intellectual property claims on the Data.
  - Users agree not to use intellectual property protection in ways that would prevent or
    block access to, or use of, any element of the Data or conclusions drawn directly from
    the Data.
regulatory_restrictions:
  regulatory_restrictions:
  - The data is covered under a Certificate of Confidentiality, which must be asserted against
    compulsory legal demands.
  source_caveats: Marked in the Data Transfer and Use Agreement template, which governs data
    provided under controlled access (the raw audio route); the release page does not state
    it for the credentialed-access feature release.
data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: Accessing raw audio requires institutional sign-off and review by
    the access committee. A Data Transfer and Use Agreement is effective only upon review
    and approval by the Data Access Compliance Office through a distinct application, and
    collaborators at other organizations must apply independently and sign their own Data
    Transfer and Use Agreement.
is_deidentified:
  method: HIPAA Safe Harbor identifiers were removed; identifiable information under HIPAA
    and the Common Rule, as well as data considered sensitive, has been removed.
  identifiers_removed: All direct identifiers (such as name, civic address and social security
    numbers); state and province (country of data collection was retained); all raw voice
    data.
  deidentification_details: Indirect identifiers were removed where they created a significant
    risk of re-identification. Raw audio transcripts were reviewed, and audio recordings that
    contained potentially identifying information or external voices were removed. Spectrograms
    and similar features were excluded if the audio contained free speech, while static and
    other features that do not encode the sensitive information were retained. Spectrograms,
    Mel spectrograms, MFCCs, PPGs and EMAs for sensitive records and audio checks have been
    removed from v3.1.
external_resources:
