name: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: The Voice adult dataset is a collection of data derived from voice recordings
  with corresponding clinical information. Release 3.1.0 (v3.1) contains data for 833 participants
  across five sites in North America. The release contains data considered low risk, including
  derivations such as spectrograms but not the original voice recordings, together with detailed
  demographic, clinical and validated questionnaire data.
source_caveats: 'Referent: the adult Voice dataset identified by its PhysioNet project DOI
  (latest version); the current release is 3.1.0. The Bridge2AI-Voice Pediatric Dataset is
  a separate dataset and appears only under related_datasets. The project documentation''s
  healthsheet describes version 2.0.0 and its Health Data Nexus distribution; values taken
  from it are marked where they are version-specific. Release-specific counts from the 1.1
  and 3.0.0 release pages and from the project documentation are not recorded as current-release
  values.'
