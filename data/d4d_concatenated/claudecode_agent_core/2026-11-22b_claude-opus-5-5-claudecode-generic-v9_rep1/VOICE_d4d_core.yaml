distributions:
- description: Derived audio data features. Dense binary files are distributed as Parquet,
    plus plain-text TSV files; each file has a JSON data dictionary with the same file stem
    describing the feature and its processing.
  id: doi:10.13026/37yb-1t42#features
  name: features
  path: features
- description: Phonetic posteriorgram probabilities across 40 phoneme categories (40xT, 100
    Hz); n=29289.
  id: doi:10.13026/37yb-1t42#features-ppgs-parquet
  name: ppgs.parquet
- description: Estimated electromagnetic articulography (Tx12, X/Y positions of six articulators);
    n=28640.
  id: doi:10.13026/37yb-1t42#features-sparc-ema-parquet
  name: sparc_ema.parquet
- description: Estimated loudness using 20 ms windows; n=31855.
  id: doi:10.13026/37yb-1t42#features-sparc-loudness-parquet
  name: sparc_loudness.parquet
- description: Estimated periodicity (confidence of pitch presence) using 20 ms windows; n=31872.
  id: doi:10.13026/37yb-1t42#features-sparc-periodicity-parquet
  name: sparc_periodicity.parquet
- description: Estimated fundamental frequency (50-550 Hz); n=31872.
  id: doi:10.13026/37yb-1t42#features-sparc-pitch-parquet
  name: sparc_pitch.parquet
- description: Spectrograms of dimension 201xT; n=29278.
  id: doi:10.13026/37yb-1t42#features-torchaudio-spectrogram-parquet
  name: torchaudio_spectrogram.parquet
  source_caveats: Listed as torchaudio_spectrogram.parquet; the file description calls it
    torchaudio_spectrograms.parquet.
- description: Mel-frequency cepstrum coefficients of dimension 60xT; n=29278.
  id: doi:10.13026/37yb-1t42#features-torchaudio-mfcc-parquet
  name: torchaudio_mfcc.parquet
- description: Detected pitch over time (80-500 Hz); n=32522.
  id: doi:10.13026/37yb-1t42#features-torchaudio-pitch-parquet
  name: torchaudio_pitch.parquet
- description: Mel spectrograms of dimension 60xT with 60 Mel bins; n=29278.
  id: doi:10.13026/37yb-1t42#features-torchaudio-mel-spectrogram-parquet
  name: torchaudio_mel_spectrogram.parquet
  source_caveats: Listed as torchaudio_mel_spectrogram.parquet; the file description calls
    it torchaudio_mel_spectrograms.parquet.
- description: Quality control metrics derived from the raw audio, one row per audio recording.
  format: TSV
  id: doi:10.13026/37yb-1t42#features-audio-quality-metrics-tsv
  media_type: text/tab-separated-values
  name: audio_quality_metrics.tsv
- description: Features derived from the raw audio (openSMILE, Praat, parselmouth and torchaudio),
    one row per audio recording.
  format: TSV
  id: doi:10.13026/37yb-1t42#features-static-features-tsv
  media_type: text/tab-separated-values
  name: static_features.tsv
- description: A binary Parquet file and its data dictionary with information about each recording,
    including task instructions and prompts and the microphone used and its gain.
  id: doi:10.13026/37yb-1t42#metadata
  name: metadata
  path: metadata
- description: Organized information collected from the participant or other individual during
    their encounter, as TSV data files each with a JSON data dictionary whose keys match the
    column names of the associated data file.
  id: doi:10.13026/37yb-1t42#phenotype
  name: phenotype
  path: phenotype
purposes:
- name: Ethically sourced, diverse voice database linked to health biomarkers
  description: Build a large multi-institutional database of human voices, speech and respiratory
    sounds that is ethically sourced, diverse, and linked to multimodal health biomarkers
    to fuel voice AI research; the project seeks to create an ethically sourced flagship dataset
    to enable future research in artificial intelligence and support insights into the use
    of voice as a biomarker of health, and to build predictive models to assist in screening,
    diagnosis, and treatment of a broad range of diseases.
- name: Target database size
  description: 'Stated enrollment targets differ by source: the IRB protocol gives a sample
    size of 30 000 participants and the white paper names a primary deliverable of a publicly
    available database of 30 000 human voices, while the project documentation states that
    the project seeks to create a flagship dataset of 10,000 voices linked to health information.'
  source_caveats: Targets, not achieved counts. The IRB protocol and the project documentation
    share manifest tier 2 and disagree (30 000 versus 10,000); the white paper (tier 3) agrees
    with the protocol. Their dates and scopes differ and the ranking cannot decide between
    the equal-tier sources, so both figures are recorded.
- name: Enable clinically applicable machine-learning models
  description: Enable the development, benchmarking, or validation of clinically applicable
    machine-learning models for diagnosing a wide range of health conditions using voice data.
tasks:
- description: Training machine-learning models for disease detection and classification using
    voice data.
addressing_gaps:
- description: Comparing studies and pooling data is challenging due to a lack of existing
    standards in how voice and other acoustics are measured and collected.
- description: Many studies remain at the level of proof of concept with small- to medium-sized
    datasets, often using voice as the only data type.
- description: Industry datasets are often private, limiting the ability to audit machine
    learning models and the accuracy of training data labels.
- description: Previous studies on machine learning-based voice diagnosis had sample sizes
    that were too small or lacked the key metadata needed for training robust, clinically
    useful models.
