  - https://zenodo.org/records/14989503
- name: Raw audio access via Synapse
  description: The release contains derived features only and no raw audio; raw audio for
    the adult cohort is made available via Synapse after institutional sign-off.
  external_resources:
  - https://www.synapse.org/Synapse:syn72370534/
