    receipts:
    - chunk: c002
      snippet: Data are collected in a multivariable protocol containing over 10 domains
    - chunk: c003
      snippet: The  retinal  imaging  protocol  is  designed  to  capture
    - chunk: c011
      snippet: The AI-READI is a dataset consisting of data collected from individuals
        with and without Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data
        collection sites.
    - chunk: c011
      snippet: The public dataset will include survey data, blood and urine lab results,
        fitness activity levels
    - chunk: c014
      snippet: The AI-READI project seeks to create and share a flagship ethically-sourced
        dataset of type 2 diabetes.
    - chunk: c014
      snippet: A smaller version is available for pipeline development...
    - chunk: c018
      snippet: Multiple modalities of data are collected for each participant, including
        survey data, clinical data, retinal imaging data, environmental sensor data,
        continuous glucose monitor data, and wearable activity monitor data.
    - chunk: c018
      snippet: These encompass tabular data, imaging data, and physiological signal/waveform
        data. There is no unstructured text data included in this dataset.
    - chunk: c018
      snippet: the dataset is a hypothesis-agnostic dataset aimed at facilitating
        multiple potential downstream AI/ML applications
    - chunk: c019
      snippet: '"question": "In which countries was the data collected?",'
    - chunk: c019
      snippet: Briefly, data is organized at the root level into one directory per
        datatype (c.f. Table below). Within each datatype folder, there is one folder
        per modality.
    - chunk: c019
      snippet: All of our data files are in formats that are accessible with free
        software commonly used for such data types so no specific software is required.
    core_path: description
