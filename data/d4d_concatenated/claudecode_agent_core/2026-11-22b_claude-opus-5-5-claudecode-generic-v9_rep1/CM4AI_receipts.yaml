  addressing_gaps[0].description:
    receipts:
    - chunk: c014
      snippet: machine learning models are often "black boxes," predicting phenotypes
        from genotypes without understanding the mechanisms by which such translation
        occurs
    core_path: addressing_gaps[0].description
  collection_mechanisms[0]:
    receipts:
    - chunk: c010
      snippet: CM4AI input data streams are generated using immunofluorescence (IF)
        subcellular microscopy for spatial proteomics data
    core_path: collection_mechanisms[0]
  collection_mechanisms[0].description:
    receipts:
    - chunk: c023
      snippet: imaged by immunofluorescence-based staining (ICC-IF) and confocal microscopy
    - chunk: c023
      snippet: Nuclei were stained with DAPI (blue channel); endoplasmic reticulum
        with a calreticulin antibody (yellow channel); microtubules with tubulin antibody
        (red channel); and antibody against protein of interest (green channel).
    core_path: collection_mechanisms[0].description
  collection_mechanisms[1]:
    receipts:
    - chunk: c010
