  description:
    receipts:
    - chunk: c010
      snippet: The cell lines currently under investigation in CM4AI are treated (with
        paclitaxel and vorinostat) versus untreated MDA-MB-468 breast cancer cell
        lines
    - chunk: c010
      snippet: CM4AI is the Functional Genomics Data Generation Project in the U.S.
        National Institute of Health’s (NIH) Bridge2AI program.
    - chunk: c015
      snippet: Protein Interactions 1,374 Immunofluorescent Images 53,788 Total Proteins
        Investigated 7,023 genes targeted 11,739 Data volume 21.4 TB
    - chunk: c015
      snippet: CM4AI project is a coordinated effort involving three complementary
        mapping approaches – proteomic mass spectrometry, cellular imaging, and genetic
        perturbation via CRISPR/Cas9
    - chunk: c016
      snippet: Cell Maps for Artificial Intelligence (CM4AI) will deliver machine-readable
        hierarchical maps of cell architecture as AI-ready data, together with quarterly
        data releases of map-input data streams.
    - chunk: c016
      snippet: CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin,
        UA Birmingham, Simon Fraser University, and the Hastings Center, as part of
        the NIH Bridge2AI program.
    - chunk: c026
      snippet: CM4AI is generating multi-modal data including protein-protein interaction
        (PPI), spatial localization, and genetic perturbation data in MDA-MB-468 breast
        cancer cells (+/- paclitaxel or vorinostat) and iPSCs (+/- differentiation).
    - chunk: c026
      snippet: 'University of Virginia Dataverse > LibraData: UVa''s Scholarly Research
        > School of Medicine > Cell Maps for Artificial Intelligence'
