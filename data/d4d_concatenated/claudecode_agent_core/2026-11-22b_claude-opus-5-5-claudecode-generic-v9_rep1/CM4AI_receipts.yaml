    core_path: collection_mechanisms[2].description
  collection_mechanisms[3]:
    receipts:
    - chunk: c010
      snippet: single-cell CRISPR-Cas perturbation screens by cell type
    core_path: collection_mechanisms[3]
  collection_mechanisms[3].description:
    receipts:
    - chunk: c010
      snippet: Single-cell CRISPR screens of 100 chromatin regulators (+/– drug) in
        MDA-MB-468 cells and in undifferentiated KOLF2.1J iPSCs were done using the
        10x Genomics 3’HT kit.
    core_path: collection_mechanisms[3].description
