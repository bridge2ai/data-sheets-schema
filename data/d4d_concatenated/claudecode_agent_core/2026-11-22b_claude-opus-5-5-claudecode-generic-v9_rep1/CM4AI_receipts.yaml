  preprocessing_strategies[0].preprocessing_details:
    receipts:
    - chunk: c011
      snippet: Downloaded PPI networks are processed using the node2vec deep learning
        model
    - chunk: c011
      snippet: IF images are processed using a Human Protein Atlas deep learning model
    - chunk: c011
      snippet: The PPI and image embeddings are integrated to obtain a co-embedding
        for each protein using contrastive deep learning.
    - chunk: c011
