        spectroscopy (AP-MS)
    core_path: collection_mechanisms[1]
  collection_mechanisms[1].description:
    receipts:
    - chunk: c010
      snippet: we employed AP-MS on endogenously tagged cell lines and size-exclusion
        chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex/interaction
        mapping as two orthogonal mass spectrometry-based approaches
    core_path: collection_mechanisms[1].description
  collection_mechanisms[2]:
    receipts:
    - chunk: c010
      snippet: and size exclusion mass spectroscopy (SEC-MS) methods for protein-protein
        interaction (PPI) data
    core_path: collection_mechanisms[2]
  collection_mechanisms[2].description:
    receipts:
    - chunk: c010
      snippet: size-exclusion chromatography coupled to mass spectrometry (SEC-MS)
