    snippet: "The dataset has been audited internally for missingness and consistency by the data release team. A missingness table is included with the dataset."
  - slot: anomalies[0]
    snippet: "Yes, different sites have different collection configurations. The collection protocol changed over the course of the study."
  - slot: content_warnings[0]
    snippet: "This dataset includes the transcription of free speech tasks. While the inclusion of information of that type is unlikely, it cannot be completely avoided"
