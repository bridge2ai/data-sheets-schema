    snippet: "a unique identifier for the recording session (session_id)"
  - slot: variables[2]
    snippet: "the task performed (task_name)"
  - slot: variables[3]
    snippet: "the number of time frames associated with that feature (n_frames)"
  - slot: file_collections[0]
    snippet: "The following dense binary files are available in the features subfolder:"
  - slot: file_collections[0].description
    snippet: "All of the above files are associated with a data dictionary file which has the same file stem and a JSON suffixes"
  - slot: file_collections[0].resources[0]
    snippet: "ppgs.parquet (n=29289) contains the phonetic posteriorgram probabilities across 40 phoneme categories giving a dimension of 40xT with a frame rate of 100Hz."
  - slot: file_collections[0].resources[1]
    snippet: "sparc_ema.parquet (n=28640) contains the estimated electromagnetic articulography (EMA)"
  - slot: file_collections[0].resources[2]
    snippet: "sparc_loudness.parquet (n=31855) contains the estimated loudness based on the average absolute amplitude of the audio waveform of size T, using 20ms windows."
  - slot: file_collections[0].resources[3]
    snippet: "sparc_periodicity.parquet (n=31872) contains the estimated periodicity (confidence of pitch presence) derived from the audio using 20ms windows of dimension T."
  - slot: file_collections[0].resources[4]
    snippet: "sparc_pitch.parquet (n=31872) contains the estimated fundamental frequency (F0) of the audio signal using a different algorithm than before with a range of 50-550Hz and dimension T."
  - slot: file_collections[0].resources[5]
    snippet: "torchaudio_spectrograms.parquet (n=29278) contains spectrograms of dimension 201xT"
  - slot: file_collections[0].resources[6]
    snippet: "torchaudio_mfcc.parquet (n=29278) contains Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the mel spectrograms."
  - slot: file_collections[0].resources[7]
    snippet: "torchaudio_pitch.parquet (n=32522) contains the detected pitch (fundamental frequency) over time and is of dimension T with a min and max pitch of 80 and 500 respectively."
  - slot: file_collections[0].resources[8]
    snippet: "torchaudio_mel_spectrograms.parquet (n=29278) contains Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms hop length, a 400-point FFT and 60 Mel bins."
  - slot: file_collections[0].resources[9]
    snippet: "audio_quality_metrics.tsv - One feature per audio recording derived from the raw audio related to quality control metrics."
  - slot: file_collections[0].resources[10]
    snippet: "static_features.tsv - Features derived from the raw audio, with one feature per audio recording."
  - slot: file_collections[1]
    snippet: "The metadata folder contains a binary file made available as Parquet and its corresponding data dictionary. This includes specific information about the recording, including task instructions and prompts, as well as information about the microphone used and its gain."
  - slot: file_collections[2]
    snippet: "The phenotype subfolder contains organized information collected from the participant or other individual during their encounter"
  - slot: file_collections[2].description
    snippet: "For phenotype data, dictionary files have keys with the same name as the column names in the associated data file."
  - slot: file_collections[2].description
    snippet: "all of the TSV data files have a data dictionary available with the data file"
  - slot: related_datasets[0].relationship_type
    snippet: "This was the first release of the Bridge2AI voice as a biomarker of health dataset [9]."
