    snippet: "The Bridge2AI Voice dataset aims to enable the development, benchmarking, or validation of clinically applicable machine-learning models for diagnosing a wide range of health conditions using voice data"
  - slot: addressing_gaps[3]
    snippet: "Previous studies on machine learning-based voice diagnosis produced promising results, but their sample sizes were too small, or they lacked the key metadata needed for training robust, clinically useful models."
  - slot: intended_uses[0]
    snippet: "The dataset can be used for AI model pretraining, fine-tuning, benchmarking, or validation."
  - slot: tasks[0]
    snippet: "The tasks are primarily designed for training machine-learning models for disease detection and classification using voice data."
  - slot: prohibited_uses[0]
    snippet: "the dataset is not to be used a) to attempt to re-identify research participants, nor any actions that could reasonably lead to re-identification"
  - slot: prohibited_uses[1]
    snippet: "b) for any purpose that could foreseeably cause harm or stigmatization to research participants, their families, communities, or specific populations"
  - slot: discouraged_uses[0]
    snippet: "the dataset should not be used for non-research applications, such as hiring decisions, insurance premium adjustments, or any form of surveillance that could lead to discrimination or harm"
