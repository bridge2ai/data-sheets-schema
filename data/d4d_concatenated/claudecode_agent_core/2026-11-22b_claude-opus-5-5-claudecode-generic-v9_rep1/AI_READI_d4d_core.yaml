title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: 'Version 3.0.0 of the AI-READI dataset, published on the FAIRhub platform. The
  AI-READI project seeks to create and share a flagship ethically sourced dataset of type
  2 diabetes mellitus (T2DM). The dataset consists of data collected from individuals with
  and without T2DM and harmonized across 3 data collection sites in the USA. The FAIRhub metadata
  state that this version contains data from 2280 participants collected between July 19,
  2023 and May 1, 2025. Data are collected in a multivariable protocol containing over 10
  domains, and the dataset includes survey data, clinical data, retinal imaging data, environmental
  sensor data, continuous glucose monitor data, wearable activity monitor data and electrocardiogram
  data; these encompass tabular data, imaging data and physiological signal/waveform data,
  and there is no unstructured text data. The retinal imaging protocol captures imaging from
  multiple devices. The dataset is described as hypothesis-agnostic, aimed at facilitating
  multiple potential downstream AI/ML applications. Data are organized following the Clinical
  Dataset Structure (CDS) v0.1.1: at the root level there is one directory per data type,
  within each data type one folder per modality, within each modality one folder per device
  and within each device one folder per participant. All data files are in formats accessible
  with free software commonly used for such data types, so no specific software is required.
  The v3.0.0 documentation states that the public dataset will include survey data, blood
  and urine lab results, fitness activity levels, clinical measurements, retinal images, ECG,
  blood sugar levels and environmental variables such as home air quality. Data were collected
  in the USA. The FAIRhub landing page states that a smaller version is available for pipeline
  development.'
source_caveats: 'Referent: version 3.0.0 of the AI-READI dataset (doi:10.60775/fairhub.3);
  earlier releases (fairhub.1, fairhub.2) are described only as version history. Source disagreements:
  (1) The project name is expanded as "Artificial Intelligence Ready and Equitable Atlas for
  Diabetes Insights" in the BMJ Open paper and Nature Metabolism comment, as "Artificial Intelligence
