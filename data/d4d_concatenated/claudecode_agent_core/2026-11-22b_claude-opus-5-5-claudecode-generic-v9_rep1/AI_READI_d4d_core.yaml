conforms_to: The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1.
  Per the FAIRhub dataset structure description, the data files in cardiac_ecg follow WaveForm
  DataBase (WFDB); clinical_data follows the Observational Medical Outcomes Partnership (OMOP)
  Common Data Model (CDM); environment follows the ASCII File Format Guidelines for Earth
  Science Data (Earth Science Data Systems, ESDS); retinal_flio, retinal_oct, retinal_octa
  and retinal_photography follow Digital Imaging and Communications in Medicine (DICOM); wearable_activity_monitor
  and wearable_blood_glucose follow Open mHealth.
