purposes:
- name: Enable AI/ML research on type 2 diabetes and salutogenesis
  response: The purpose for creating the dataset was to enable future generations of artificial
    intelligence/machine learning (AI/ML) research to provide critical insights into type
    2 diabetes mellitus (T2DM), including salutogenic pathways to return to health. The primary
    goal of AI-READI is to collect and publicly share a multimodal, AI-ready dataset for studying
    the pathogenesis and salutogenesis (the pathway from disease to health) of T2DM; AI-READI
    is a data collection project on T2DM intended to facilitate the use of AI/ML approaches
    to study salutogenesis.
- name: Foundational dataset for a temporal atlas of T2DM
  response: The long-term objective stated for the project is to develop a foundational dataset
    in diabetes, agnostic to existing classification criteria, which can be used to reconstruct
    a temporal atlas of T2DM development and reversal towards health (salutogenesis).
tasks:
- name: Pseudotime manifold analysis
  response: Data collection is designed to permit downstream pseudotime manifold analysis,
    an approach used to predict disease trajectories by learning from complex, multimodal
    data from participants with differing disease severity (normal to insulin-dependent T2DM).
    The healthsheet states the dataset is being gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence.
addressing_gaps:
- name: Limitations of existing large datasets for AI/ML training
  response: To address inherent limitations of many existing large data sets for AI/ML training,
    the cohort is designed to be balanced in race/ethnicity, T2DM severity and biological
    sex.
- name: Lack of racial and ethnic diversity in T2DM study samples
  response: The BMJ Open protocol paper cites a meta-epidemiological review of T2DM studies
    published from 2000 to 2020 indicating that samples lacked racial and ethnic diversity.
- name: Lack of AI-ready data for training AI models
  response: A key issue for AI-based approaches to T2DM is the lack of data ready for training
    AI models (described in the Nature Metabolism comment as a lack of diverse datasets that
    are AI ready); the AI-READI dataset is intended to fill this gap.
- name: Lack of large, high-quality multimodal datasets
  response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large and inclusive
    multimodal datasets.
- name: Analyses not feasible with claims or EHR data
  response: The data acquisition protocol across multiple domains was designed to enable downstream
    AI/ML analyses that may not be feasible with existing data sources such as claims or electronic
    health records data.
