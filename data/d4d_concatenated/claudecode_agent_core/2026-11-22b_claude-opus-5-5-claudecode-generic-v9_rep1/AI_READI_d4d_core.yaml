  format: JSON
  media_type: application/json
distribution_dates:
- name: Version 3.0.0 release
  release_dates:
  - '2025-11-17'
  description: Date the dataset was made available on FAIRhub (the healthsheet states the
    third version was distributed in November 2025).
maintainers:
- name: AI-READI team
  maintainer_details: The AI-READI team will be supporting and maintaining the dataset. The
    dataset is hosted on FAIRhub through Microsoft Azure.
updates:
  frequency: Approximately yearly
  update_details: The dataset is released as static versions and is not updated; new versions
    are released approximately once a year with additional data from participants enrolled
    since the last release. Version 3.0.0 is the third version and consists of data collected
    up through the end of the second year of the study.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 3.0.0 (DOI 10.60775/fairhub.3, Nov 17, 2025)
  - 2.0.0 (DOI 10.60775/fairhub.2, Nov 8, 2024)
  - 1.0.0 (DOI 10.60775/fairhub.1, May 3, 2024)
  version_details: Version 1.0.0 (pilot data collection phase, 204 participants) was released
    May 3, 2024; version 2.0.0 (data collected up to the end of the first full year of the
    study, a total of 1067 participants) was released in November 2024 and its documentation
    and landing page state that it is no longer accessible; version 3.0.0 contains a total
    of 2280 participants and was released November 17, 2025. The README version table lists
    863 participants from year 2 data included in v2.0.0 and 1213 from year 3 data included
    in v3.0.0. Data fields are largely the same as in the prior version, but the Snellen visual
    acuity variables were dropped in version 3.0.0 so that only logMAR visual acuity measurements
    are available.
ethical_reviews:
- name: University of Washington IRB approval STUDY00016228
  reviewing_organization: Institutional Review Board of the University of Washington
  review_details: AI-READI was approved by the IRB of the University of Washington (approval
    number STUDY00016228), including reliance agreements with the IRBs of the University of
    Alabama at Birmingham and the University of California, San Diego. Initial approval was
    received on December 20, 2022; an annual renewal application to the IRB is required.
human_subject_research:
  involves_human_subjects: true
  ethics_review_board: Institutional Review Board of the University of Washington
  irb_approval:
  - University of Washington IRB, approval number STUDY00016228 (initial approval December
    20, 2022)
  regulatory_compliance:
  - The study description states the study is not an FDA-regulated drug study.
  - The study description states the study is not an FDA-regulated device study.
  description: The study description records the human subject review status as submitted
    and approved.
informed_consent:
- name: Informed consent for study participation
  consent_obtained: true
  consent_type: Written informed consent, obtained electronically (e-consent) or in person
  consent_documentation: Informed consent was required before participation in any part of
    the protocol (including questionnaires). Most participants consent remotely through a
    REDCap e-consent interface reached from the invitation letter or email, with electronic
    signature through UW ITHS REDCap; otherwise consent is performed in person in a private
    room at the start of the visit. The other clinical sites had IRB reliance and used the
    same consent form, with minor institution-specific language.
  consent_scope: The IRB protocol states that a table at the beginning of the consent form
    clarifies which information will be publicly available and which would require an application
    and approval process with privacy protection.
  withdrawal_mechanism: Participants were permitted to withdraw consent at any time and cease
    participation; data shared or used up to that point stay in the dataset.
license_and_use_terms:
  id: doi:10.5281/zenodo.17555036
  name: AI-READI Data License Agreement (Version 2.0)
  description: The public dataset is available for download upon agreement with a license
    that defines how the data can be used; the full dataset is accessible by entering into
    a data use agreement. The Nature Metabolism comment (November 2024) states that the first
    version of the public set was shared using a new license developed as part of the project
    that allows reuse for any purpose but includes restrictions to protect participant privacy;
    version 3.0.0 is distributed under the AI-READI Data License Agreement Version 2.0.
  license_terms: The licensor is Washington University in St. Louis. Subject to compliance,
    the licensor grants a non-exclusive, non-transferable license to download, reproduce and
    use the Data, and to create derivative works of the Data, for research, commercial and
    non-commercial purposes; the terms are described as tailored to enable reuse for commercial
    or research purposes while placing strong requirements on data usage, security and secondary
    sharing. The licensee may use and store the data only on servers and devices maintained
    by and located within the licensee's institution, or on cloud or remote storage services
    with a HIPAA-approved Business Associate Agreement with that institution. The licensee
    agrees to acknowledge the licensor, the source and any funder of the Data in papers reporting
    use of the Data. The agreement terminates automatically on any breach, after which all
    copies of the Data must be deleted. Access to the public version also requires agreeing
    to use the data only for type 2 diabetes related research.
  data_use_permission:
  - disease_specific_research
  source_caveats: The FAIRhub landing page labels the license "Health Data License" while
    the FAIRhub dataset metadata name it "AI-READI custom license v2.0" (DOI 10.5281/zenodo.17555036);
    both are tier-1 FAIRhub sources. The license grants use for research, commercial and non-commercial
    purposes, while the dataset consent details and access steps state that the public version
    can only be used for type 2 diabetes related research and that a private version will
    allow more generic use; both statements are recorded.
ip_restrictions:
  restrictions:
  - Title to the Data and all industrial and intellectual property rights therein remain solely
    and exclusively with the Licensor and its suppliers; rights not expressly granted are
    reserved.
regulatory_restrictions:
  other_compliance: Licensees agree to comply with the data security and privacy standards
    established by the U.S. National Institutes of Health under its Genomic Data Sharing (GDS)
    Policy.
data_governance:
  description: The IRB protocol notes that UC San Diego has a health Data Oversight Committee
    (HDOC) that oversees data sharing with other institutions.
  committee_name: Data Access Committee
  access_review_process: 'Access type for the FAIRhub release is public download with self-attestation
    required. Accessing the dataset requires logging in through a verified ID system, agreeing
    to use the data only for type 2 diabetes related research, and agreeing to the license
    terms. The IRB protocol describes two databases for distribution: a deidentified one that
    is publicly available, and one with identifiable or sensitive information (genomic data
    and race/ethnicity) that requires a data use agreement and an approval process developed
    by the project committee. The protocol paper states that requirements for controlled access
    data sets are being developed by the Data Access Committee.'
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
    description: Managing organization named in the FAIRhub dataset metadata.
  stewardship_roles:
  - Principal investigators and lead co-investigators at each participating institution oversee
    and manage data sharing (IRB protocol).
is_deidentified:
  identifiable_elements_present: false
  description: The data in this dataset contain no protected health information (PHI).
  method: Per the FAIRhub dataset metadata, no identifiers were collected, so no active de-identification
    was necessary, but the data were checked to confirm that no identifiable data per US HIPAA
    were present.
  identifiers_removed: Information related to the sex and race/ethnicity of the participants
    as well as medication used has been removed.
  deidentification_details: No identifiers were collected so no active de-identification was
    necessary but we checked that no identifiable data per US HIPAA were present in the data.
  source_caveats: The Nature Metabolism comment (November 2024) states that the public set
    is stripped of Protected Health Information as defined by the HIPAA Privacy Rule via the
    Safe Harbor method, together with information related to sex and race/ethnicity. The FAIRhub
    dataset metadata (ranked higher in the source manifest) state that no identifiers were
    collected and no active de-identification was necessary; that statement is recorded as
    the method. The BMJ Open protocol paper also describes released data as deidentified.
    The IRB protocol states that the study team accesses and obtains identifiers (such as
    name, MRN, date of birth, address and 5-digit ZIP code) for study operations, stored separately
    from study data with a coded link; the FAIRhub statement concerns the content of the released
    dataset, not the study's internal records.
