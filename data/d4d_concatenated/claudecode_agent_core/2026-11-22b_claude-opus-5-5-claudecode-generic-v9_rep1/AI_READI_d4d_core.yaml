instances:
- name: Participant
  instance_type: Individual participant (patient); each instance represents an individual
    patient.
  counts: 2280
  label: false
  description: There are 2280 instances in version 3.0.0 (released fall 2025). Each instance
    consists of all of the data available for an individual participating in the study. No
    labels or targets are provided.
  notes: Mean age of the 2280 participants is 60.8 ± 11.3 years (README suggested-split summary
    table).
anomalies:
- name: Survey nonresponse
  anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- name: Wearable device failures
  anomaly_details: For wearables, improper use and technical failure such as battery failure
    or system malfunction are expected.
- name: Imaging noise and failures
  anomaly_details: For imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are expected.
- name: Variable Optomed image quality
  anomaly_details: Optomed Aurora images are undilated and taken with a handheld camera; the
    quality of the images varies from patient to patient and within the same patient.
known_biases:
- name: Volunteer bias
  bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias, which may limit the generalizability of results among those not represented in the
    study population.
- name: Urban and hospital-based recruitment
  bias_description: The predominantly urban and hospital-based recruitment may not fully capture
    diverse cultural and socioeconomic backgrounds; the healthsheet lists it among factors
    influencing the generalization of derived models.
known_limitations:
- name: Finite biorepository samples
  limitation_description: A limitation of the biorepository is that there is a finite number
    of samples to share with scientists. Biobanked samples will eventually be available to
    scientists according to procedures and policies that are in development; procedures for
    reviewing and prioritizing written requests will be developed before the biorepository
    is complete.
- name: English-language requirement
  limitation_description: Participants are required to speak, read and understand English;
    the protocol paper states this may have created challenges in recruiting Hispanic and/or
    Asian persons. The IRB protocol states that non-English-speaking participants will not
    be initially enrolled and that Hispanic participants enrolled in the meantime need to
    be fluent in English.
- name: Group balance not yet achieved
  limitation_description: As enrollment is ongoing, the pilot data release and periodic updates
    to data releases may not have achieved balanced distribution across groups; the healthsheet
    states that while the cross-sectional database ultimately aims to achieve balance across
    race/ethnicity, biological sex and diabetes presence and severity, the pilot study is
    not balanced across these parameters.
- name: Racial and ethnic groups not included
  limitation_type: representativeness_limitation
  limitation_description: The study cohort may not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific Islanders
    and Native Americans.
