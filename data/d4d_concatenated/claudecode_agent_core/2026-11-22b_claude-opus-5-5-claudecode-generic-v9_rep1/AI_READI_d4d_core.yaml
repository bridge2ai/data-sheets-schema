sensitive_elements:
- name: Sensitive data held under controlled access
  sensitive_elements_present: true
  sensitivity_details: The healthsheet states that the public dataset will not contain data
    considered sensitive, but the controlled access dataset will contain data regarding racial
    and ethnic origins, location (5-digit zip code) and motor vehicle accident reports. The
    v3.0.0 documentation lists the data held under controlled access as 5-digit zip code,
    sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic
    and accident reports; the controlled access set contains more sensitive data available
    only to scientists whose institutions have completed legal and privacy use agreements
    with the AI-READI research program.
  source_caveats: The documentation and healthsheet lists differ (the healthsheet omits medications).
    The IRB protocol lists whole genome sequencing in years 2-4 as planned, funding permitted;
    no source states that genomic data are included in version 3.0.0.
acquisition_methods:
- name: Direct observation and self-report
  was_directly_observed: true
  was_reported_by_subjects: true
  acquisition_details: 'Acquisition varied by domain: some data were directly observable (such
    as labs, vitals and retinal imaging), whereas other data were reported by subjects (such
    as survey responses). Verification of data entry was performed when possible (for example,
    cross-referencing entered medications with medications physically brought in or photographed
    by each participant).'
collection_mechanisms:
- name: AI-READI study visit protocol
  mechanism_details: Each participant completes the study protocol, which includes questionnaires,
    on-site data collection and at-home data collection. The on-site protocol is performed
    as a single visit lasting between 2.5 and 4 hours depending on the participant.
- name: REDCap
  mechanism_details: REDCap is used for collecting patient-reported data from questionnaires
    (content domains listed in table 1 of the protocol paper) and clinical data from the visit
    (medications assessment, vitals, visual acuity, contrast sensitivity, monofilament test
    results and complete blood count results).
- name: Philips PageWriter TC30 Cardiograph
  mechanism_details: A 12-lead ECG is performed with the Philips PageWriter TC30 while the
    participant sits in a reclining chair or lies supine.
- name: Montreal Cognitive Assessment (MoCA)
  mechanism_details: A general cognitive screener carried out using the MoCA, administered
    electronically on an iPad by research staff using the MoCA Duo application.
- name: M&S Technologies Electronic Visual Acuity (EVA) tester
  mechanism_details: Visual acuity is assessed under photopic and mesopic conditions for each
    eye separately using the M&S Technologies EVA device.
- name: Topcon KR 800 autorefractor
  mechanism_details: Autorefraction data for each eye are obtained using the KR 800 Auto Keratometer/Refractor
    (Topcon).
- name: Blood and urine specimen collection
  mechanism_details: Non-fasting blood (53 mL) and urine samples are collected during the
    visit. A local clinical lab performs complete blood count testing on fresh whole blood;
    other lab tests are performed by the University of Washington Nutrition and Obesity Research
    Center using stored, frozen samples. Blood derivatives are sent to the biorepository at
    UAB's Center for Clinical and Translational Science for future studies, including DNA
    isolations.
- name: Mars Letter Contrast Sensitivity test (Perceptrix)
  mechanism_details: Contrast sensitivity was tested monocularly under photopic and mesopic
    conditions with the MARS Letter Contrast Sensitivity test.
- name: LeeLab Anura environmental sensor
  mechanism_details: A custom-designed home environmental sensor unit (LeeLab Anura; custom
    designed at the Karalis Johnson Retina Center, University of Washington) used at home
    for 10 continuous days.
- name: Garmin Vivosmart 5
  mechanism_details: The Garmin Vivosmart 5 fitness activity tracker is used to measure data
    related to physical activity.
- name: Dexcom G6 Continuous Glucose Monitor
  mechanism_details: The Dexcom G6, a real-time integrated continuous glucose monitoring system,
    records blood glucose measurements (mg/dL).
- name: Optomed Aurora IQ
  mechanism_details: A handheld fundus camera that takes non-mydriatic images of the ocular
    fundus; all retinal images are collected under dilated conditions except for the Optomed.
- name: iCare EIDON
  mechanism_details: A widefield TrueColor confocal fundus imaging system that can capture
    images up to 200°.
- name: Heidelberg Spectralis HRA+OCT
  mechanism_details: For AI-READI participants, imaging is done in a dark room using the ONH-RC,
    PPole-H and OCTA of the macula modalities.
- name: Topcon Triton DRI OCT
  mechanism_details: A device that combines swept-source OCT technology with multimodal fundus
    imaging.
- name: Topcon Maestro2 3D OCT
  mechanism_details: A robotic OCT and color fundus camera system.
- name: Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO)
  mechanism_details: FLIO is performed as the last modality of the visit; because of this,
    patients may not be at their best possible compliance.
- name: Zeiss Cirrus 5000 Angioplex
  mechanism_details: A high-definition optical coherence tomography (OCT) system.
- name: Monofilament test
  mechanism_details: Peripheral neuropathy is assessed using a standard 10 g monofilament
    applied to different points on the plantar surface of the feet.
- name: OMRON HEM 907XL Blood Pressure Monitor
  mechanism_details: Blood pressure device used at one or more data acquisition sites.
- name: Medline MDS4001 Automatic Digital Blood Pressure Monitor
  mechanism_details: Blood pressure device used at one or more data acquisition sites.
- name: Welch Allyn 6000 series Vital signs monitor
  mechanism_details: Blood pressure device used at one or more data acquisition sites (with
    Welch Allyn FlexiPort Reusable Blood Pressure Cuff).
- name: NIDEK LM-600P Auto Lensometer
  mechanism_details: Lensometer device used at one or more data acquisition sites.
- name: Topcon CL-200 computerized Lensometer
  mechanism_details: Lensometer device used at one or more data acquisition sites.
- name: Topcon CL-300 computerized Lensometer
  mechanism_details: Lensometer device used at one or more data acquisition sites.
collection_timeframes:
- name: Study enrollment (protocol paper)
  timeframe_details: The BMJ Open protocol paper states that enrollment began on 18 July 2023
    and will continue until 30 November 2026; preliminary pilot enrollment occurred between
    18 July 2023 and 30 November 2023, and the formal data collection process began on 1 December
    2023.
- name: Study registration dates
  start_date: '2023-07-19'
  timeframe_details: The FAIRhub study description gives an actual study start date of 2023-07-19
    and an anticipated completion date of 2027-01-01.
- name: At-home monitoring period
  timeframe_details: After the in-person visit, participants use the home environmental sensor,
    fitness tracker and continuous glucose monitor continuously for 10 days.
- name: Data collection period for version 3.0.0
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: For this version of the dataset, the timeframe for data collection was
    July 19, 2023 to May 1, 2025 (data collected up through the end of the second year of
    the study).
- name: Overall project timeline
  timeframe_details: The overall project timeline spans four years, with one year for protocol
    development and training and years 2-4 for subject recruitment and data collection; the
    Nature Metabolism comment describes enrollment of 4,000 participants at three sites over
    4 years (2022-2026).
data_collectors:
- name: Site research personnel
  role: Recruitment, enrollment and data collection at the three data collection sites
  collector_details: All research personnel at the three sites who recruited, enrolled and
    collected data underwent training by the data manager at UAB and used a detailed Manual
    of Procedures; data managers at each site oversee the process. Their effort was supported
    by the NIH award OT2OD032644 based on percentage of effort contributed.
- name: Clinical research coordinator/study coordinator
  role: Clinical research coordinator
  collector_details: Responsible for contacting and consenting participants, ushering participants
    through the research visit and conducting study visits including collection of ophthalmologic
    images (IRB protocol role description).
- name: Research assistant
  role: Research assistant
  collector_details: Conducts study visits including collection of ophthalmologic images (IRB
    protocol role description).
- name: Phlebotomist
  role: Phlebotomist
  collector_details: Responsible for blood collection from research participants (IRB protocol
    role description).
missing_data_documentation:
- name: Marijuana use not assessed in Alabama
  missing_data_patterns: Marijuana use was not assessed for participants living in Alabama.
  missing_data_causes: Marijuana is an illegal substance in Alabama.
- name: Modalities unavailable for some participants
  missing_data_patterns: Not all modalities are available for all participants.
  missing_data_causes: Some participants elected not to participate in some study elements;
    in a few cases the data collection device had no stored results or was returned too late
    to retrieve the results (for example, the battery died or data was lost); in a few cases
    there may have been a data collision at some point in the process and data were lost.
- name: Skipped Spectralis imaging
  missing_data_causes: Because the Heidelberg Spectralis is operated by the imaging team and
    is not fully automated, quality issues may arise that lead to skipping this modality and
    missing data.
raw_data_sources:
- name: Electronic medical records
  source_description: The IRB protocol states that medical records will be extracted to obtain
    data on general health, eye health, medical and surgical history, diabetes, medications,
    laboratory records and previous medical imaging.
- name: Department of Licensing driving and accident records
  source_description: The IRB protocol states that driving and accident records will be obtained
    from the Department of Licensing.
- name: Dexcom Clarity application
  source_description: The IRB protocol states that participants already using a Dexcom G6
    may optionally provide access to glucose data for up to 90 days before the study visit
    through the CGM vendor's Clarity application.
sampling_strategies:
- name: Triple-balanced recruitment design
  strategies: 'Rather than targeting the demographic distribution of the US population, the
    study is triple-balanced by recruiting in equal proportions four race/ethnic groups (Asian,
    Black, White, Hispanic), four categories of T2DM (no diabetes, pre-diabetes/lifestyle-controlled
    diabetes, diabetes treated with oral medications or non-insulin-injectable medications,
    and insulin-controlled diabetes) and biological males and females; recruitment sampling
    procedures aimed at approximately equal distribution across sex, race and diabetes severity.
    The study registration states an aim to recruit approximately 1000 patients into each
    of the four groups, with subjects age- and sex-matched within and between groups, and
    describes the sample as a non-probability sample. Participants are recruited at three
    sites (University of Alabama at Birmingham, University of California, San Diego, and University
    of Washington), chosen for geographic diversity and diverse representation across racial
    and ethnic groups; uniform data collection protocols were implemented for all subjects
    across sites. Inclusion criteria: able to provide consent, 40 years or older, persons
    with or without type 2 diabetes, and able to speak and read English. Exclusion criteria:
    pregnancy, gestational diabetes, type 1 diabetes and (per the study registration and IRB
    protocol) age older than 85 years.'
  is_random: false
- name: EHR-based recruitment in waves
  strategies: Patients with T2DM and pre-diabetes are identified by screening electronic health
    records for diagnosis codes at each site, and participants are recruited in waves whose
    composition is monitored and adjusted by under- and oversampling groups as needed. The
    IRB protocol describes UAB selecting a stratified sample of potential participants based
    on the sampling scheme, with approximately 50,000 invitation letters per site planned
    to be sent by mail and email over the recruitment period.
- name: Site-specific recruitment priorities
  strategies: The IRB protocol states that, based on local demographics, UW will concentrate
    on recruiting Asian>Hispanic>Black participants, UC San Diego will prioritize Hispanic>Asian>Black
    participants and UAB will prioritize Black>Hispanic>Asian participants, with all sites
    recruiting white participants; all race and ethnicity information is self-reported at
    screening and enrollment.
raw_sources:
- name: Raw data retained by the project
  raw_data_details: The raw data is saved and expected to be preserved by the AI-READI project
    at least for the duration of the project but is not anticipated to be shared outside the
    project team at present, because it has not been mapped to standardized terminologies
    and may accidentally include personal health information or personally identifiable information.
    Raw data may possibly be included in future releases of the controlled access dataset.
preprocessing_strategies:
- name: Mapping to data standards
  preprocessing_details: Once data were sent from each site to the central project team, all
    data were mapped to standardized terminologies when possible, such as the OMOP Common
    Data Model for clinical data and DICOM for medical imaging; some images required conversion
    to a DICOM standard format before upload.
- name: Conversion from proprietary device formats
  preprocessing_details: For some devices, data are transformed from their proprietary state
    into a standard model format before upload to FAIRhub; for example, the protocol paper's
    device table lists imaging exports in .fda and .sdt file formats converted to DICOM for
    the data set, and, among the at-home monitoring devices, an export in .FIT file format
    converted to the mHealth standard.
  source_caveats: The protocol paper's Table 4 text extraction does not make explicit which
    imaging device or monitoring device each export format belongs to, so formats are not
    attributed to individual devices here.
cleaning_strategies:
- name: Data entry quality control
  cleaning_details: The Data Manager at each site is responsible for the quality control of
    all data before upload to FAIRhub. Clinical data outside expected min/max ranges were
    flagged in REDCap reports reviewed by clinical research coordinators and Data Managers,
    and data were checked for credibility (range checks), incorrect flow through prescribed
    skip patterns, missing data that can be filled from other portions of a record, and omission
    and/or duplication of records. Editing was done only under the guidance and approval of
    the site PI.
- name: Internal review
  cleaning_details: The dataset has not undergone formal external audits, but it has been
    reviewed internally by AI-READI team members for quality checks and to ensure that no
    personally identifiable information was accidentally included.
future_use_impacts:
- name: Model for future AI-ready dataset efforts
  impact_details: Following FAIR principles, AI-READI can be viewed as a model for future
    efforts to develop other medical/health data sets targeted for AI/ML.
- name: Theoretical risk of re-identification
  impact_details: The healthsheet states that, to the extent of the team's knowledge, no uses
    of the dataset that could result in unfair treatment or harm are currently anticipated,
    but there is a theoretical risk of future re-identification.
- name: Possible commercial products or patents
  impact_details: The IRB protocol states that there are no plans for the researchers collecting
    the data set to develop commercial products or file patents, but that the data set will
    be publicly available with a commercial-friendly license and products or patents may be
    developed from it in the future.
intended_uses:
- name: AI/ML research on type 2 diabetes
  description: Research use of the dataset, including AI/ML research into T2DM pathogenesis
    and salutogenesis. Access to the public version requires agreeing to use the data only
    for type 2 diabetes related research.
  usage_notes: Those who download and use AI-READI data are encouraged to publish their results
    in the scientific literature.
- name: Development and distribution of models trained on the data
  description: The license permits the licensee to make, reproduce and distribute models,
    algorithms and programs developed, trained or adapted using the Data that do not themselves
    contain the Data, provided reasonable efforts are made before dissemination to minimize
    the likelihood that Data can be memorized, derived, reconstructed or reconstituted through
    such models.
prohibited_uses:
- name: Clinical treatment decisions
  description: The license prohibits making clinical treatment decisions based on the Data.
  prohibition_reason: The Data is intended solely as a research resource.
- name: Re-identification or harm to data subjects
  description: The license prohibits using or attempting to use the Data, alone or with other
    information, to compromise the confidentiality or privacy of any Data Subject, to attempt
    to identify or contact any Data Subject or group of Data Subjects, to extract or extrapolate
    identifying information, to establish a Data Subject's membership in a particular group,
    or otherwise to cause harm to any Data Subject.
- name: Sharing with third parties other than other licensees
  description: The licensee shall not transfer, license, sublicense, sell, assign, display,
    share or otherwise convey any portion of the Data or any derivative work to any third
    party other than another licensee bound by an agreement with the Licensor on identical
    terms.
- name: Sharing data with third-party model vendors for training
  description: The licensee shall not share or distribute Data with any third-party model
    vendor or developer for training or development purposes (including model weight modification),
    even where the vendor has a Business Associate Agreement with the licensee's institution;
    short-term interaction such as prompting or querying with a BAA-covered vendor's model
    is permitted.
- name: Reproducing data in publications beyond small samples
  description: Data may not be reproduced in papers, articles, presentations, analyses, reports
    or publications, except that small representative samples may be reproduced in up to five
    images or figures per paper for illustrative purposes; larger amounts may not be published
    or made available via supplemental files, zip archives, code packages or other means.
