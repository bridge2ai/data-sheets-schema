bundle_md5: 0350223711484a63c21b2dd57af6f4c9
slots:
  acquisition_methods[0]:
    receipts:
    - chunk: c002
      snippet: The protocol included the collection of demographic information, voice
        and speech related questionnaires, and questionnaires inquiring about medical
        history.
    core_path: acquisition_methods[0]
  addressing_gaps[0]:
    receipts:
    - chunk: c002
      snippet: These factors have contributed to the lack of publicly/open access/
        available pediatric data sets that enable machine learning for pediatric voice
        analysis
    core_path: addressing_gaps[0]
  addressing_gaps[1]:
    receipts:
    - chunk: c004
      snippet: The literature is sparser in terms of pediatric voice and speech analysis
        partly due to ethical concerns and challenges in data acquisition for this
        cohort
    - chunk: c004
      snippet: creating a voice database of “normal cohort” of different age groups
        will be key to help machine learning models diagnose age specific speech delays
        and disorders
    core_path: addressing_gaps[1]
  at_risk_populations.assent_procedures:
    receipts:
    - chunk: c005
      snippet: children will provide verbal assent where appropriate
    - chunk: c005
      snippet: Where young children cannot reasonably be asked to assent (due to limitations
        in understanding due to age and development) they will not be asked to do
        so. This typically holds for children under seven years of age.
    core_path: at_risk_populations.assent_procedures
  at_risk_populations.at_risk_groups_included:
    receipts:
    - chunk: c002
      snippet: collected from 300 participants aged 2-18
    - chunk: c004
      snippet: Pediatric patients will be enrolled ONLY through the pediatric sites
        and not at USF.
    core_path: at_risk_populations.at_risk_groups_included
  at_risk_populations.guardian_consent:
    receipts:
    - chunk: c004
      snippet: in the case of pediatric participants, not receiving consent from a
        parent or guardian
    - chunk: c005
      snippet: When children will be participating in the research, parents or guardians
        will provide consent
    - chunk: c005
      snippet: Parental permission will be obtained from one or both parents; this
        research is minimal risk and does not require permission from both parents
        or legal guardians.
    core_path: at_risk_populations.guardian_consent
  at_risk_populations.special_protections:
    receipts:
    - chunk: c004
      snippet: Checklist HRP-416 for children under 21 has been completed and is appended
        to this protocol.
    - chunk: c005
      snippet: Data Collection for Pediatric cohorts will ONLY be performed at the
        pediatric participating institutions.
    core_path: at_risk_populations.special_protections
  citation:
    receipts:
    - chunk: c002
      snippet: Bridge2AI-Voice Pediatric Dataset (version 1.1.0).
    core_path: citation
  cleaning_strategies[0]:
    receipts:
    - chunk: c002
      snippet: Spectrograms, Mel Spectrograms, MFC coefficients, PPGs, and EMAs for
        sensitive records and audio checks have been removed from v1.1.
    core_path: cleaning_strategies[0]
  cleaning_strategies[1]:
    receipts:
    - chunk: c003
      snippet: releasing audio features for all free speech tasks that were manually
        checked for presence of unconsented speakers and PII
    core_path: cleaning_strategies[1]
  collection_mechanisms[0]:
    receipts:
    - chunk: c002
      snippet: All data was collected through customized software
    - chunk: c002
      snippet: reproschema-ui –
    - chunk: c002
      snippet: A headset was used to record for most participants, while the remaining
        recordings utilized the built-in tablet microphone
    - chunk: c002
      snippet: All participants completed the recording and demographic data collection
        in one session.
    - chunk: c002
      snippet: parents or decision-makers completed the survey during the recording
        on a separate tablet
    - chunk: c006
      snippet: with the Bridge2AI-Voice pediatric protocol.
    - chunk: c006
      snippet: Voice, breathing, cough, and speech data are recorded with the app
        for adults and with reproschema-ui for pediatrics.
    core_path: collection_mechanisms[0]
