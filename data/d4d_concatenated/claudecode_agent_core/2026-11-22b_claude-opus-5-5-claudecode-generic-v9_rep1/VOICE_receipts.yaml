bundle_md5: 9193c3cbe60b62a2fc0f704a2c4d23a3
slots:
  acquisition_methods[0]:
    receipts:
    - chunk: c009
      snippet: The data was directly observable and reported by subjects. Clinical
        diagnoses were verified by clinicians reviewing audio and/or imaging data,
        looking at electronic health records, or medication prescriptions.
    core_path: acquisition_methods[0]
  addressing_gaps[0]:
    receipts:
    - chunk: c002
      snippet: comparing studies and pooling data is challenging due to a lack of
        existing standards in how voice and other acoustics are measured and collected
    core_path: addressing_gaps[0]
  addressing_gaps[1]:
    receipts:
    - chunk: c005
      snippet: many studies1,2 remain at the level of proof of concept with small-
        to medium-sized datasets often using voice as the only data type
    core_path: addressing_gaps[1]
  addressing_gaps[2]:
    receipts:
    - chunk: c005
      snippet: Within the industry, data-...sets are often private, limiting the ability
        to audit ML models and the accuracy of training data labels
    core_path: addressing_gaps[2]
  addressing_gaps[3]:
    receipts:
    - chunk: c008
      snippet: Previous studies on machine learning-based voice diagnosis produced
        promising results, but their sample sizes were too small, or they lacked the
        key metadata needed for training robust, clinically useful models.
    core_path: addressing_gaps[3]
  anomalies[0]:
    receipts:
    - chunk: c008
      snippet: Yes, different sites have different collection configurations. The
        collection protocol changed over the course of the study.
    core_path: anomalies[0]
  citation:
    receipts:
    - chunk: c018
      snippet: 'Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M.,
        Dorr, D., Payne, P., Ravitsky, V., Bélisle-Pipon, J., Bahr, R., Watts, S.,
        Bolser, D., Siu, J., Lerner-Ellis, J., Rudzicz, F., Boyer, M., Abdel-Aty,
        Y., Ahmed Syed, T., Anibal, J., ... Ghosh, S. (2026). Bridge2AI-Voice: An
        ethically-sourced, diverse voice dataset linked to health information (version
        3.1.0).'
    - chunk: c018
      snippet: https://doi.org/10.13026/8xbn-nq66
    core_path: citation
  cleaning_strategies[0]:
    receipts:
    - chunk: c009
      snippet: Generate missingness tables
    core_path: cleaning_strategies[0]
  cleaning_strategies[0].cleaning_details:
    receipts:
    - chunk: c009
      snippet: Check distributions and outliers
    - chunk: c009
      snippet: For categorical responses, check against schema
    - chunk: c009
      snippet: For audio tasks, run quality control metrics
    - chunk: c009
      snippet: For speech, check produced speech relative to intended passage
    core_path: cleaning_strategies[0].cleaning_details
  collection_mechanisms[0]:
    receipts:
    - chunk: c007
      snippet: Voice samples are collected prospectively using a custom software application
        (the Bridge2AI-Voice App) with the Bridge2AI-Voice protocols.
    - chunk: c018
      snippet: Data collection was conducted using a custom application on a tablet
        with a headset used for data collection when possible.
    core_path: collection_mechanisms[0]
  collection_mechanisms[0].mechanism_details:
    receipts:
    - chunk: c007
      snippet: Detailed demographic data and surveys about confounding factors such
        as smoking and drinking history are collected through the smartphone application.
    - chunk: c018
      snippet: This protocol involved the collection of demographic information, health
        questionnaires, targeted questionnaires inquiring about known confounders
        for voice, disease specific information, and voice recording tasks such as
        sustained phonation of a vowel sound.
    core_path: collection_mechanisms[0].mechanism_details
  collection_mechanisms[1]:
    receipts:
    - chunk: c008
      snippet: Data is collected on iPads (9th or 10th generation)
    core_path: collection_mechanisms[1]
  collection_mechanisms[2]:
    receipts:
    - chunk: c008
      snippet: iPad Air (5th generation) using an Avid AE-36 microphone
    core_path: collection_mechanisms[2]
  collection_mechanisms[3]:
    receipts:
    - chunk: c008
      snippet: using an Avid AE-36 microphone and an Apple dongle to connect it to
        the iPad
    core_path: collection_mechanisms[3]
  collection_mechanisms[4]:
    receipts:
    - chunk: c011
      snippet: Data will be entered into a REDCap database as part of the Case Report
        Form.
    core_path: collection_mechanisms[4]
  collection_mechanisms[4].source_caveats:
    receipts:
    - chunk: c018
      snippet: Data were exported and converted from RedCap using an open source library
        developed by our team [2].
    core_path: collection_mechanisms[4].source_caveats
  collection_notifications[0]:
    receipts:
    - chunk: c009
      snippet: Yes, participants went through an IRB-approved consent process.
    core_path: collection_notifications[0]
  consent_revocations[0]:
    receipts:
    - chunk: c009
      snippet: Consenting participants are informed that they may withdraw from the
        study at any point. If a participant chooses to withdraw during or before
        the voice data collection, their data will not be included in the database.
    core_path: consent_revocations[0]
  consent_revocations[0].revocation_details:
    receipts:
    - chunk: c009
      snippet: Participants are informed that research data (including voice recordings)
        cannot be removed from the database once the voice data collection process
        is completed.
    - chunk: c012
      snippet: If participants withdraw from the study after they complete the voice
        data collection the data they have provided will be kept until completion
        of study.
    core_path: consent_revocations[0].revocation_details
  content_warnings[0]:
    receipts:
    - chunk: c008
      snippet: This dataset includes the transcription of free speech tasks. While
