name: CHoRUS
description: The CHoRUS dataset is a multicenter, multimodal clinical care dataset produced
  by the CHoRUS project, which the project website describes as one data generation project
  of four in the NIH-funded Bridge2AI consortium and as the collection of multi-modal data
  across 14 different hospitals, using ongoing and new standardization practices, with tools
  the team creates to support a cloud enclave. The project website reports the current released
  dataset as 50,000 patient admissions from ICU, PICU, and NICU, 1.6 billion rows of EHR OMOP
  data, 7,642 admissions with radiology data, and 23 Tb of waveform data. The same page gives
  the anticipated final dataset as 100,000 patient admissions, 9 different data modalities,
  and 14 data contributing hospitals, with 60+ CHoRUS consortium members across 20 different
  institutions; the GitHub organization overview states that the collaboration spans 20 academic
  centers, of which 14 will contribute as data acquisition centers. The 2022 grant abstract
  stated the aim of acquiring an AI-ready data set from more than 100,000 critically ill patients.
  The cohort 2 training webinar (September 2025) describes the CHoRUS dataset as retrospective
  data collection with controlled access.
notes: 'Project website contact: Ciera McCrary, MGH, Program Manager (cmccrary@mgh.havard.edu).'
source_caveats: '(1) The project website carries the banner "This repoitory is under review
  for potential modification in compliance with Administration directives." (2) The 2022 NIH
  RePORTER abstract is written in the future tense; its statements (more than 100,000 critically
  ill patients, a publicly available dataset, a holdout test set, OMOP standardization) are
  recorded as plans. (3) Admission counts: the website (manifest tier 2, undated) reports
  50,000 patient admissions in the current released dataset; the cohort 2 webinar (tier 4)
  reports over 45K unique admissions as of August 2025. The figures are compatible (a lower
  bound below the stated figure) and both are retained. (4) Imaging: the webinar reports 1000
  images currently available and the website reports 7,642 admissions with radiology data;
  these count different units and the bundle does not establish whether they describe the
  same release, so both are retained without choosing one. (5) The webinar''s data-type table
  was extracted from slides with its column order lost; data standards are recorded only where
  the table text places them beside a data type (Demographics-OMOP, Imaging-DICOM, Waveform
  telemetry-WFDB, Waveform EEG-EDF+ and Persyst, Clinical notes-OHNLP), and the per-row values
  of its "Metadata" column (Yes or Planned) are not assigned because the extracted text does
  not establish row ownership; every access-control value in the table reads "Controlled".
  (6) The website contact email domain is spelled "mgh.havard.edu" in the source and is reproduced
  as written. (7) The GitHub organization overview is ranked as historical documentation (tier
  5) in the source manifest. (8) Award number OT2OD032701 is stated by both NIH RePORTER and
  the project website; the grantor is recorded as "NIH" as the website states it, and RePORTER
  places the award in the NIH Common Fund''s Bridge2AI program.'
