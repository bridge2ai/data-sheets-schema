instances:
- instance_type: Patient admissions from ICU, PICU, and NICU
  counts: 50000
  description: The project website reports 50,000 patient admissions from ICU, PICU, and NICU
    in the current released dataset. The cohort 2 webinar states that, as of August 2025,
    the dataset covers 14 different hospitals with over 45K unique admissions.
- instance_type: Demographics
  description: Demographics; the webinar's CHoRUS Dataset table lists OMOP as its data standard.
- instance_type: Medication administration
  description: Medication administration (dosing time-stamped upon each infusion change or
    dose administration).
- instance_type: Procedures
  description: Procedures (documentation by providers).
- instance_type: Nursing flowsheets
  description: Nursing flowsheets (high-frequency documentation).
- instance_type: Diagnoses
  description: Diagnoses (documentation by providers).
- instance_type: Clinical notes
  description: Clinical notes (extracted and tokenized using the OHNLP toolkit). Per the cohort
    2 webinar, clinical notes are stored locally except tokens, an exception to the OMOP and
    telemetry data held in the enclave.
- instance_type: Imaging (from PACS)
  description: Imaging from PACS, with DICOM as its data standard. Per the cohort 2 webinar,
    1000 images are currently available, with de-identification in process for a larger cohort.
    The project website reports 7,642 admissions with radiology data in the current released
    dataset.
- instance_type: Waveform telemetry
  description: Waveform telemetry (bedside monitors, gateway/middleware), with WFDB as its
    data standard.
- instance_type: Waveform EEG
  description: Waveform EEG (hospital database), with EDF+ and Persyst as its data standard.
    Per the cohort 2 webinar, EEG extraction was in process at that point.
  source_caveats: The webinar does not state that EEG data are available.
collection_mechanisms:
- mechanism_details: Retrospective data collection (cohort 2 webinar, CHoRUS Dataset slide).
- mechanism_details: Data contributing sites extract and contribute clinical data to CHoRUS
    following a step-by-step workflow linked to standard operating procedure (SOP) documents
    that have undergone an internal validation and review process within the Chorus_SOP repository.
preprocessing_strategies:
- preprocessing_details: Clinical notes are extracted and tokenized using the OHNLP toolkit.
- preprocessing_details: Validated semantic mappings connect clinical data in various source
    formats to international standards; a chorus-mapping repository holds documentation and
    pooled tabular mappings along with an associated clinical validation SOP for contributing
    to mapping efforts, and the GitHub overview refers to downstream analytics on the mapped
    and assembled dataset.
existing_uses:
- description: Per the cohort 2 webinar, the datasets are being used for training activities
    and publications.
- description: The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
    Bridge2AI CHoRUS data through engagement, AI training, and mentorship; the project website
    points to opportunities to gain hands-on training using the CHoRUS dataset.
license_and_use_terms:
  license_terms: Training program participants must sign a licensing agreement, included in
    the registration form, before gaining access to the dataset (cohort 2 webinar).
  source_caveats: The bundle does not name the licensing agreement or state its terms.
data_governance:
  access_review_process: 'For participants in the AIM-AHEAD Bridge2AI for Clinical Care Training
    Program (cohort 2 webinar): participants fill out a registration form with name, email,
    and institution, and an email is sent once access is granted and compute is provisioned;
    gaining access to the dataset requires a ".edu" email address, and program administrators
    will assist with this access if needed. The GitHub organization overview lists dbold@emory.edu
    and jared.houghtaling@tuftsmedicine.org as contacts to request access.'
external_resources:
