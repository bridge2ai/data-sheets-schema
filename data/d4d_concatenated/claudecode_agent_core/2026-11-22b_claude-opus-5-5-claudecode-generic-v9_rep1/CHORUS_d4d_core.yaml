purposes:
- response: 'Overarching goal stated in the 2022 grant abstract: to develop a publicly available,
    AI-ready critical care dataset, while ensuring the methods promote privacy, accountability,
    and clinical benefit.'
- response: 'Goal of the CHoRUS Network stated in the GitHub organization overview: to develop
    the most diverse, high-resolution, ethically sourced, AI-ready data set to answer the
    grand challenge of improving recovery from acute illness.'
tasks:
- response: Characterizing acute and critical care illness (an ML/AI application the 2022
    grant abstract says the project generates data for).
- response: Predicting complications (an ML/AI application the 2022 grant abstract says the
    project generates data for).
- response: Measuring treatment response among patients with acute or critical illness (an
    ML/AI application the 2022 grant abstract says the project generates data for).
addressing_gaps:
- response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care (2022 grant abstract).
