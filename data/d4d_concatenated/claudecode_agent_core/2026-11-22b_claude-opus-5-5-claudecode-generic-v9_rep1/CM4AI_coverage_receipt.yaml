  - slot: distribution_formats[1].format
    snippet: "as AI-Ready datasets in RO-Crate format"
  - slot: purposes[0].description
    snippet: "Its overarching mission is to produce ethical, AI-ready datasets of cell architecture, inferred from multimodal data collected for human cell lines, to enable transformative biomedical AI research."
  - slot: purposes[1].description
    snippet: "CM4AI’s objective is to deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders"
  - slot: collection_mechanisms[0]
    snippet: "CM4AI input data streams are generated using immunofluorescence (IF) subcellular microscopy for spatial proteomics data"
  - slot: collection_mechanisms[1]
    snippet: "microscopy for spatial proteomics data; affinity purification mass spectroscopy (AP-MS)"
  - slot: collection_mechanisms[2]
    snippet: "and size exclusion mass spectroscopy (SEC-MS) methods for protein-protein interaction (PPI) data"
  - slot: collection_mechanisms[3]
    snippet: "single-cell CRISPR-Cas perturbation screens by cell type"
  - slot: collection_mechanisms[1].description
    snippet: "we employed AP-MS on endogenously tagged cell lines and size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex/interaction mapping as two orthogonal mass spectrometry-based approaches"
  - slot: collection_mechanisms[2].description
    snippet: "size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex/interaction mapping"
  - slot: collection_mechanisms[3].description
    snippet: "Single-cell CRISPR screens of 100 chromatin regulators (+/– drug) in MDA-MB-468 cells and in undifferentiated KOLF2.1J iPSCs were done using the 10x Genomics 3’HT kit."
  - slot: preprocessing_strategies[0].description
    snippet: "Input data streams are integrated via the multi-scale integrated cell (MuSIC) software pipeline employing deep learning models and community detection algorithms"
  - slot: preprocessing_strategies[0].name
    snippet: "the Multi-Scale Integrated Cell (MuSIC) pipeline, which produces integrated cell maps from the multiple, multi-modal input data streams"
  - slot: conforms_to
    snippet: "output cell maps are packaged with provenance graphs and rich metadata as AI-Ready datasets in RO-Crate format"
  - slot: conforms_to_standard
