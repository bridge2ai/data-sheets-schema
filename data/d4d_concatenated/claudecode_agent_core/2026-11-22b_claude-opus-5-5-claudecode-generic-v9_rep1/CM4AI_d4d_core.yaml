license: CC BY-NC-SA 4.0 (Attribution-NonCommercial-ShareAlike 4.0 International)
page: https://cm4ai.org/
title: 'Cell Maps For AI: Mapping Cellular Structure and Function'
id: https://cm4ai.org/
name: Cell Maps For AI (CM4AI)
description: 'CM4AI (Cell Maps for Artificial Intelligence) is the Functional Genomics data
  generation project of the NIH Bridge2AI program. This record describes the CM4AI dataset
  as an ongoing series of data releases deposited in the University of Virginia Dataverse;
  the individual releases are listed under resources. The project states that it will deliver
  machine-readable hierarchical maps of cell architecture as AI-ready data, together with
  quarterly data releases of map-input data streams. CM4AI generates multi-modal data, including
  protein-protein interaction (PPI), spatial localization and genetic perturbation data, in
  MDA-MB-468 breast cancer cells (with or without paclitaxel or vorinostat treatment) and
  in induced pluripotent stem cells (with or without differentiation), using three complementary
  mapping approaches: proteomic mass spectrometry, cellular imaging, and genetic perturbation
  via CRISPR/Cas9. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin,
  UA Birmingham, Simon Fraser University, and the Hastings Center, as part of the NIH Bridge2AI
  program. The project website''s undated "Data Insights" panel lists 1,374 protein interactions,
  53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted
  and a data volume of 21.4 TB.'
notes: Project-related inquiries are directed on the project website to Swathi Thaker, PhD,
  UAB, Program Manager (snthaker@uab.edu). The Dataverse point of contact for the June 2026
  release is Ideker Trey (University of California San Diego).
source_caveats: 'The project website and the Dataverse collection both state that they are
  "under review for potential modification in compliance with Administration directives".
  The June 2026 release''s Data Governance & Ethics section lists "FDA Regulated: No"; no
  regulatory restriction is recorded. The release-listing page labels the June 2026 Data Release
  with "Released on: June 17, 2025", while the release''s Dataverse record (ranked higher
  in the source manifest) gives the publication date 2026-06-17; the Dataverse date is used.
  The "Data Insights" figures are reported by the project website without a date or release,
  so they are not attributed to any single release. The May 2024 preprint''s statements are
  dated to that preprint (for example, its description of a Data Access Committee and of cell-map
  production) and are reported in the tense it uses.'
