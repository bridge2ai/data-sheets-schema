    (from tissue cultures) and are considered to be de-identified as they cannot be matched,
    with current knowledge, to a human subject. The June 2026 release lists "De-identified
    Samples: Yes".'
external_resources:
- name: Multimodal cell maps as a foundation for structural and functional genomics (Nature
    642, 222-231, 2025)
  description: Publication that constructs a map of human subcellular architecture through
    joint measurement of biophysical interactions and immunofluorescence images for over 5,100
    proteins in U2OS osteosarcoma cells, explores use cases including 3D structural modeling,
    protein function, cell type specificity, protein multi-localization and tumor mutations,
    and releases the Cell Mapping Toolkit, a series of Python packages implementing its end-to-end
    pipeline.
  external_resources:
  - https://doi.org/10.1038/s41586-025-08878-3
  - https://github.com/idekerlab/cellmaps_pipeline
  notes: Its acknowledgements cite funding from the Bridge2AI Program (NIH Common Fund; OT2
    OD032742).
  source_caveats: The article studies U2OS cells and does not state that it uses the CM4AI
    data releases; it is recorded as a related resource only, through the shared award number.
