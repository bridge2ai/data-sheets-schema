purposes:
- description: The overarching mission of CM4AI is to produce ethical, AI-ready datasets of
    cell architecture, inferred from multimodal data collected for human cell lines, to enable
    transformative biomedical AI research.
- description: CM4AI's objective is to deliver machine-readable hierarchical maps of cell
    architecture as AI-ready data produced from multimodal interrogation of 100 chromatin
    modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac
    disorders.
- description: The CM4AI data generation project seeks to map the spatiotemporal architecture
    of human cells and use these maps toward the grand challenge of interpretable genotype-phenotype
    learning.
tasks:
- description: The NIH project description states that these data will broadly stimulate research
    and development in "visible" machine learning systems informed by multi-scale cell and
    tissue architecture.
addressing_gaps:
- description: In genomics and precision medicine, machine learning models are often "black
    boxes", predicting phenotypes from genotypes without understanding the mechanisms by which
    such translation occurs; the project addresses this deficiency.
