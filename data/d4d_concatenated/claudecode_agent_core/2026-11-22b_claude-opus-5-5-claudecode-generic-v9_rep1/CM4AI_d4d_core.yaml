known_biases:
- bias_description: Data in this release was derived from commercially available de-identified
    human cell lines.
- bias_description: Does not represent all biological variants which may be seen in the population
    at large.
known_limitations:
- limitation_description: The June 2026 release is an interim release.
- limitation_description: The release does not contain predicted cell maps, which the release
    states will be added in future releases.
- limitation_description: The current release is most suitable for bioinformatics analysis
    of the individual datasets.
- limitation_description: Requires domain expertise for meaningful analysis.
subpopulations:
- name: MDA-MB-468 triple-negative breast cancer cells
  description: MDA-MB-468 (RRID:CVCL_0419) is a triple-negative breast cancer cell line established
    from a metastatic site pleural effusion of a 51-year-old black female with a metastatic
    mammary adenocarcinoma, available from ATCC. The project's release page states that its
    curated datasets for these TNBC cells under untreated (DMSO control), vorinostat and paclitaxel
    conditions include SEC-MS capturing about 7,000 proteins, IF images for 523 proteins,
    Perturb-seq of 200 genes, and AP-MS interactomes (listed there as coming soon).
- name: KOLF2.1J induced pluripotent stem cells and derived cells
  description: The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was derived from a healthy male Northern
    European donor and is available from the Human Induced Pluripotent Stem Cells Initiative
    (HipSci) resource. The project's release page states that its curated dataset for undifferentiated
    (parental) iPSCs and iPSC-derived neural progenitor cells (NPCs), neurons and cardiomyocytes
    includes Perturb-seq of more than 11,000 genes (whole-genome), SEC-MS capturing about
    7,000 proteins, and IF images (listed there as coming soon).
collection_mechanisms:
- name: Immunofluorescence subcellular imaging
  description: Immunofluorescence (IF) subcellular microscopy generates spatial proteomics
    data. The release files describe immunofluorescence-based staining (ICC-IF) and confocal
    microscopy in which nuclei were stained with DAPI, the endoplasmic reticulum with a calreticulin
    antibody, microtubules with a tubulin antibody, and the protein of interest with its own
    antibody.
- name: Affinity purification mass spectrometry (AP-MS)
  description: AP-MS on endogenously tagged cell lines generates protein-protein interaction
    data.
- name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  description: Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) is used
    for proteome-wide complex and interaction mapping.
- name: Single-cell CRISPR perturbation screens (Perturb-seq)
  description: Single-cell CRISPR-Cas perturbation screens by cell type. The May 2024 preprint
    states that single-cell CRISPR screens of 100 chromatin regulators (+/- drug) in MDA-MB-468
    cells and in undifferentiated KOLF2.1J iPSCs were done using the 10x Genomics 3'HT kit.
data_collectors:
- name: Lundberg Lab at Stanford University
  description: The release files state that the immunofluorescence images were acquired in
    the Lundberg Lab at Stanford University.
- name: Nevan Krogan laboratory at the University of California San Francisco
  description: The release files state that the SEC-MS data were generated in the Nevan Krogan
    laboratory at the University of California San Francisco.
missing_data_documentation:
- missing_data_patterns: Some datasets are under temporary pre-publication embargo.
  description: The June 2026 release lists the Perturb-seq data in KOLF2.1J iPSCs (undifferentiated)
    and in MDA-MB-468 breast cancer cells (+/- treatment) as "Embargoed" under its External
    Data Links.
- missing_data_patterns: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturbSeq data interrogate sets of proteins which incompletely overlap.
- missing_data_patterns: Computed cell maps are not included in the June 2026 release.
preprocessing_strategies:
- name: Multi-Scale Integrated Cell (MuSIC) pipeline
  description: Per the May 2024 preprint, input data streams are integrated via the multi-scale
    integrated cell (MuSIC) software pipeline employing deep learning models and community
    detection algorithms to produce cell maps.
  preprocessing_details: Downloaded PPI networks are processed using the node2vec deep learning
    model; IF images are processed using a Human Protein Atlas deep learning model; the PPI
    and image embeddings are integrated to obtain a co-embedding for each protein using contrastive
    deep learning; community detection on the co-embedding produces a hierarchy of protein
    communities that is output as the final cell map.
  notes: Software comprising the Tools data integration pipeline is available under the BSD-3
    open source license in GitHub (alpha-level tools) or in the Zenodo long-term archive (production-ready
    tools).
  source_caveats: The June 2026 release states that computed cell maps are not included in
    it, so this pipeline describes how the project's cell maps are produced rather than a
    step applied to the files in the current release.
- name: FAIRSCAPE RO-Crate packaging
  description: FAIRSCAPE-CLI creates an RO-Crate package with the datasets, metadata, and
    software, which the FAIRSCAPE server registers and assigns persistent identifiers.
  preprocessing_details: The May 2024 preprint states that the PID system currently in use
    is the ARK scheme, with DOIs a future feature as supplementary PIDs for final-state publishable
    work.
labeling_strategies:
- description: Per the May 2024 preprint, assemblies in the cell maps are annotated using
    a large language model (LLM) approach developed by the project to name sets of proteins
    and assign a name confidence score.
  labeling_details: Cell maps are also aligned to known protein function and pathway resources,
    including the Gene Ontology (GO) and Reactome.
  source_caveats: Applies to computed cell maps, which the June 2026 release states are not
    included in that release.
existing_uses:
- description: The May 2024 preprint states that the initial data were made available at the
    CM4AI CodeFest in March 2024, accompanied by detailed tutorials explaining how the data
    were derived and integrated.
intended_uses:
- description: AI-ready datasets to support research in functional genomics
- description: AI model training
- description: Cellular process analysis
- description: Cell architectural changes and interactions in presence of specific disease
    processes, treatment conditions, or genetic perturbations
prohibited_uses:
- description: Commercial use of the material, a commercial use being one primarily intended
    for commercial advantage or monetary compensation.
  prohibition_reason: The NonCommercial term of the Creative Commons Attribution-NonCommercial-ShareAlike
    4.0 International license.
  source_caveats: The May 2024 preprint states that commercial use requires a separate license
    negotiation with the copyright holder (UCSD, Stanford, and/or UCSF depending upon the
    specific data package).
- description: These laboratory data are not to be used in clinical decision-making or in
    any context involving patient care without appropriate regulatory oversight and approval.
distribution_formats:
- format: ZIP
  description: The files of the October 2025 and June 2026 releases are ZIP archives deposited
    in the University of Virginia Dataverse.
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
- format: RO-Crate
  description: CM4AI output data are packaged with provenance graphs and rich metadata as
    AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. The May 2024 preprint
    states that all RO-Crates for the then-current release were available in the University
    of Virginia's LibraData data archive, an instance of Dataverse.
