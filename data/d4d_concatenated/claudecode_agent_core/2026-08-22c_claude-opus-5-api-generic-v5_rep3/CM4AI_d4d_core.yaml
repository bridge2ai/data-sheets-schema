confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Some constituent datasets are under temporary pre-publication embargo and are therefore not
      released with this version. The June 2026 release marks the external perturb-seq datasets
      for both KOLF2.1J iPSCs and MDA-MB-468 breast cancer cells as embargoed. The embargo is
      temporary and tied to pending publication rather than to any confidentiality of the data
      themselves; the distributed archives are all listed as publicly accessible.

