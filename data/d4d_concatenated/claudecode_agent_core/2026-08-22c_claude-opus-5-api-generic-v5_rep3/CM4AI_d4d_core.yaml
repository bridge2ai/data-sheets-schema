updates:
  frequency: Quarterly
  update_details: >-
    The dataset will be regularly updated and augmented through the end of the project in
    November 2026, on a quarterly basis. The project portal states that CM4AI releases data
    quarterly, ensuring continuous updates to the cell maps and input data streams.

retention_limit:
  retention_details: >-
    Long-term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  version_details: >-
    Quarterly releases are deposited as separate Dataverse datasets, each with its own DOI and its
    own internal version history: May 2024 (doi 10.18130/V3/DXWOS5), March 2025
    (doi 10.18130/V3/B35XWX, version 1.4, published 2025-03-03), June 2025
    (doi 10.18130/V3/F3TD5R, version 2.1, published 2025-07-01), October 2025
    (doi 10.18130/V3/K7TGEM, version 2.1, published 2025-10-31), and June 2026
    (doi 10.18130/V3/HIGT4C, version 2.0, published 2026-06-17). Version numbers are internal to
    each dataset record and are therefore not monotonic across the series. Superseded releases
    remain accessible from the CM4AI project portal's Data Releases archive.

source_caveats: >-
  Referent: this record describes the CM4AI data release as distributed in the June 2026 Data
  Release (Beta), the highest-ranked and most recent source in the bundle; earlier quarterly
  releases are recorded under related_datasets rather than merged into the description. The
  referent is identical to that of the paired full record.

  Immunofluorescence protein counts disagree across sources. The October 2025 release (tier 1)
  and the June 2025 release state that the imaging archives cover 464 proteins of interest in
  MDA-MB-468 cells; the March 2025 release (tier 5) states 563 proteins; the CM4AI data-releases
  documentation page (tier 2) states IF images for 523 proteins. The tier 1 figure of 464 is
  preferred. The June 2026 release does not restate a protein count.

  Panel sizes for the targeted protein and gene sets (100 chromatin modifiers, 100 metabolic
  enzymes) come from the project descriptor preprint (tier 3) as a statement of project
  objective; the tier 1 June 2026 release does not restate them, and the tier 2 portal gives
  different flagship figures for the breast cancer arm. These are recorded under
  sampling_strategies with their conflict noted.

  Project end date disagrees: the release description (tier 1) states the project ends in
  November 2026, while the NIH RePORTER project page (tier 4) gives a project end of 2026-08-31.
  The release statement is preferred.

  Affiliation for Andrej Sali disagrees: the June 2026 release author metadata (tier 1) records
  "Sali A, University of California San Diego", while the project descriptor preprint (tier 3)
  places him at the University of California San Francisco. The higher-ranked release value would
  be preferred, but no Creator entry is asserted for this author, so the conflict is recorded here
  only.

  Affiliation for Vardit Ravitsky disagrees within a single tier 1 source: the June 2026 release
  citation records "Ravitsky V, University of Montreal" while the ethics contact block gives an
  email at The Hastings Center, also named as a CM4AI collaborating institution. Same-tier
  disagreement cannot be settled by ranking, so both statements are represented in the
  ethical_reviews entry rather than one being selected.

  The June 2026 release page records the dataset publication date as 2026-06-17, while the three
  immunofluorescence image archives within it show a file publication date of 2026-07-15;
  last_updated_on reflects the later file date and both dates are recorded per-distribution.

  Creators scoping: the release citation lists 47 named authors, reproduced in full in notes.
  Creator entries are limited to the four creating groups whose leads and contributions the bundle
  explicitly attests — the Krogan laboratory at UCSF for mass spectrometry, the Lundberg Lab at
  Stanford for imaging, Trey Ideker at UCSD as project principal investigator and point of
  contact, and Timothy Clark at UVA for standards and packaging. Recording every listed author
  would assert contributions the sources do not differentiate. The NIH RePORTER record (tier 4)
  names Trey Ideker as the sole principal investigator of the award; the other three entries
  occupy the Creator class's principal_investigator slot as laboratory or module leads, which is
  noted on the Clark entry.

  Organization identifiers: the bundle supplies a ROR identifier only for the University of
  Virginia (attached to five authors' affiliations in the June 2026 release). Other institutions
  are named without registry identifiers because none appears in the input documents.

  Distribution sizes: the Dataverse file table gives rounded display sizes (for example "3.8 GB",
  "113.3 KB") rather than exact byte counts, so the integer-ranged bytes field is left unpopulated
  and the stated size is recorded verbatim in each distribution's notes. No arithmetic over the
  rounded values is asserted.

  Instance counts are omitted throughout: the release states no per-modality instance counts, and
  the figures available (11,739 targeted genes; 53,788 project-wide images) count perturbation
  targets and cumulative program output rather than instances in this release.

  Portal aggregate figures (1,374 protein interactions; 53,788 immunofluorescent images; 7,023
  proteins investigated; 11,739 genes targeted; 21.4 TB data volume) are cumulative project-wide
  counts reported by cm4ai.org (tier 2), not counts of the ten files in this release, and are
  recorded in the description on that basis.

  External repository links (MassIVE, NCBI BioProject, Figshare) appear in the preprocessed source
  as link labels without URLs or accessions, so raw_data_sources record the repository names
  without resolvable identifiers.

  The Nature publication in the bundle (doi 10.1038/s41586-025-08878-3) describes a multimodal cell
  map of U2OS osteosarcoma cells built with the same pipeline family and acknowledging Bridge2AI
  award OT2 OD032742. Its datasets (AP-MS, HPA imaging, SEC-MS in U2OS; MassIVE MSV000097168;
  ProteomeXchange PXD052362; NDEx and ModelArchive deposits) are not part of the CM4AI cell-line
  release described here and are recorded only as a related external resource. Assembly counts,
  protein counts, and accessions from that study are excluded from every slot describing this
  dataset.

  Slots present in the full record but absent from the core schema — total_file_count (10),
  citation, relationships, direct_collection, and third_party_sharing — are not asserted here.
  The required citation string is carried in notes; the ten distributed archives are carried in
  distributions; the five cell-line and treatment strata that the full record carries as subsets
  are carried here as resources, the core schema's slot for component parts of the dataset.

