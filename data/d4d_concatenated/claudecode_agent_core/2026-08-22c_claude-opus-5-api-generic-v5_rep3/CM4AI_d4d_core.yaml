extension_mechanism:
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details: >-
    The Cell Mapping Toolkit is released as open-source, pip-installable Python packages on
    GitHub with full user documentation and a step-by-step guide, described by the project as a
    flexible and generalizable framework enabling researchers to integrate and construct cell
    maps via multiple input modalities. This is a mechanism for extending the project's software
    and constructing new maps rather than for contributing records to this dataset; the bundle
    describes no submission route for additions or corrections to the released data.

intended_uses:
  - use_category: AI-ready datasets to support research in functional genomics
    usage_notes: >-
      The release is packaged with provenance graphs and rich metadata in RO-Crate format so that
      datasets can be validated, traced, and reused in AI workflows.
  - use_category: AI model training
    examples:
      - >-
        Development of "visible" machine learning systems and visible neural networks built
        directly on knowledge maps of cell and tissue architecture rather than as opaque
        predictors.
  - use_category: Cellular process analysis
  - use_category: >-
      Analysis of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations
    examples:
      - >-
        Comparison of protein complex elution profiles, protein localization, and transcriptional
        response in MDA-MB-468 breast cancer cells between untreated, paclitaxel-treated, and
        vorinostat-treated conditions.
      - >-
        Comparison of protein complexes between undifferentiated KOLF2.1J iPSCs and iPSC-derived
        neural progenitor cells, neurons, and cardiomyocytes.

existing_uses:
  - examples:
      - >-
        The genome-scale CRISPR interference perturbation cell atlas in KOLF2.1J human induced
        pluripotent stem cells underlies Nourreddine et al., "A Perturbation Cell Atlas of Human
        Induced Pluripotent Stem Cells" (bioRxiv 2024, doi 10.1101/2024.11.03.621734), which
        reports validation via phenotypic, protein-interaction, and metabolic tracing assays.
  - examples:
      - >-
        Initial CM4AI datasets, tools, and standards were used in a virtual CodeFest in March
        2024, attended by 38 registrants from within and outside the project, accompanied by
        tutorials explaining how the data were derived and integrated and by production-ready
        software for producing the datasets.

discouraged_uses:
  - discouragement_details: >-
      Use of this release as a source of computed, integrated cell maps is discouraged: the
      release explicitly does not contain predicted cell maps, which are planned for future
      releases. The release states it is most suitable for bioinformatics analysis of the
      individual constituent datasets.
  - discouragement_details: >-
      Cross-modality integration that assumes complete overlap of interrogated proteins is
      discouraged, because the SEC-MS, immunofluorescence imaging, and CRISPR interference
      perturb-seq data interrogate protein sets that overlap incompletely.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license under which the data are
      released; commercial use requires a separate license negotiation with the copyright holder,
      which the project states may be UCSD, Stanford, and/or UCSF depending on the specific data
      package.

future_use_impacts:
  - impact_details: >-
      The project's ethics work explicitly anticipates potential applications of the data and of
      derived AI/ML systems, integrating them into data governance frameworks in order to
      optimize benefits and mitigate potential risks, and to promote use for the collective good.
  - impact_details: >-
      Because the data are derived from two human cell lines, models trained on them may inherit
      the representativeness limits of those lines; the release notes that the data do not
      represent all biological variants which may be seen in the population at large.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from commercially available de-identified human cell
      lines and do not represent all biological variants which may be seen in the population at
      large.
    affected_subsets:
      - doi:10.18130/V3/HIGT4C#subset-mda-mb-468-untreated
      - doi:10.18130/V3/HIGT4C#subset-mda-mb-468-paclitaxel
      - doi:10.18130/V3/HIGT4C#subset-mda-mb-468-vorinostat
      - doi:10.18130/V3/HIGT4C#subset-kolf2-undifferentiated
      - doi:10.18130/V3/HIGT4C#subset-kolf2-differentiated
    notes: >-
      Every subset in the release is affected, since all modalities derive from only two cell
      lines. The bundle states no mitigation strategy.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      This is an interim Beta release; the data are not yet in completed final form and the
      release does not contain predicted cell maps.
    recommended_mitigation: >-
      Computed cell maps will be added in future releases; the dataset is updated quarterly
      through the end of the project.
    scope_impact: >-
      Users seeking the integrated hierarchical cell maps that are the project's headline output
      cannot obtain them from this release.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the individual
      datasets and requires domain expertise for meaningful analysis.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The immunofluorescence imaging, mass spectrometry interaction, and CRISPR interference
      perturbation modalities were generated for panels of targeted proteins and genes rather
      than uniformly across the proteome, and the protein sets they interrogate overlap
      incompletely.

missing_data_documentation:
  - missing_data_patterns: >-
      Protein-protein interaction (SEC-MS), protein localization (immunofluorescence imaging),
      and CRISPR interference perturb-seq data interrogate sets of proteins which incompletely
      overlap, so many proteins are present in some modalities and absent from others. Computed
      cell maps are not included in this release. Perturb-seq external datasets for both
      KOLF2.1J iPSCs and MDA-MB-468 breast cancer cells are marked embargoed in the June 2026
      release. AP-MS data are present only for treated MDA-MB-468 cells; the release description
      lists AP-MS for "MDA-MB-468 breast cancer cells + treatment", and the distributed archives
      cover the paclitaxel and vorinostat conditions only. Immunofluorescence images are released
      for MDA-MB-468 cells only; the project portal lists iPSC immunofluorescence images as
      forthcoming.
    missing_data_causes: >-
      Temporary pre-publication embargo on some constituent datasets. Staged, quarterly data
      generation across an ongoing project.
    handling_strategy: >-
      The dataset is regularly updated and augmented through the end of the project in November
      2026, with quarterly updates; missing components are documented in the release description
      rather than imputed.

errata:
  - erratum_details: >-
      The June 2025 Data Release was issued as a revision that added RGB immunofluorescence
      images, corrected errors in the RO-Crate metadata, and changed file naming conventions
      relative to the previous release.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The release records that the dataset does not involve human subjects, that samples are
    de-identified, and that the data are not FDA regulated. The project descriptor states that
    CM4AI data are non-clinical, derived from tissue cultures, and are considered de-identified
    because they cannot be matched, with current knowledge, to a human subject.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The release governance statement records Human Subjects: No, De-identified Samples: Yes,
      and FDA Regulated: No. Cell line donor characteristics (a 51-year-old Black female donor
      for MDA-MB-468; a healthy male Northern European donor for KOLF2.1J) are published
      properties of widely distributed commercial cell lines rather than identifiable
      participant data.

human_subject_research:
  involves_human_subjects: false
  regulatory_compliance:
    - The release records the dataset as not involving human subjects.
    - The release records the samples as de-identified.
    - The release records the data as not FDA regulated.
    - >-
      Cell lines were required by the project to be ethically sourced; the KOLF2.1J line is
      available to not-for-profit organizations via a simple material transfer agreement from the
      HipSci resource, and MDA-MB-468 is obtained from ATCC.

ethical_reviews:
  - reviewing_organization: >-
      Vardit Ravitsky is recorded in the same release under two affiliations: the citation author
      list gives University of Montreal, while the ethics contact block gives an email address at
      The Hastings Center, which the release also names as a CM4AI collaborating institution.
    review_details: >-
      Named in the release as one of two designated ethical review contacts for the dataset. The
      CM4AI Ethics module developed guidelines and best practices for ethical development of AI
      systems leveraging the data, using a methodology inspired by Value-Sensitive Design, and
      formulated the CM4AI Life Cycle framework describing governance milestones through data
      generation and AI system development.
    contact_person: Vardit Ravitsky
    notes: >-
      Contact person identifier: ORCID:0000-0002-7080-8801. Contact email given in the release
      ethics block: ravitskyv@thehastingscenter.org.
    source_caveats: >-
      The two affiliation statements appear in the same tier 1 source, so the source ranking
      cannot decide between them; both are represented in the reviewing_organization value rather
      than one being silently selected.
  - reviewing_organization: Simon Fraser University
    review_details: >-
      Named in the release as one of two designated ethical review contacts for the dataset.
      Contributed to the Value Repository supporting the CM4AI ethics guidelines and to the
      Bridge2AI Code of Conduct that participants attest to before accessing Bridge2AI data.
    contact_person: Jean-Christophe Bélisle-Pipon
    notes: >-
      Contact person identifier: ORCID:0000-0002-8965-8153. Contact email given in the release
      ethics block: jean-christophe_belisle-pipon@sfu.ca. No institutional review board approval,
      ethics committee determination, or compliance certification is recorded for this dataset,
      consistent with the release's statement that the work does not involve human subjects.
      These entries record the designated ethical review contacts and the project's
      ethics-guideline work.

data_governance:
  committee_name: CM4AI Data Governance Committee
  committee_contact: Jillian Parker
  accountable_organization:
    name: University of California San Diego
    description: >-
      Awardee organization for the NIH Bridge2AI Functional Genomics award and the institution of
      the project principal investigator and dataset point of contact. Copyright in the data is
      held by The Regents of the University of California except where otherwise noted.
  access_review_process: >-
    Release files are openly downloadable from the University of Virginia Dataverse under the
    CC BY-NC-SA 4.0 license without an access request; the Dataverse record lists all distributed
    files as Public, and no guestbook or access request is required. Separately, the project
    descriptor states that a Data Access Committee supervises ethical matters related to dataset
    distribution and potential dual licensing for commercial use; this committee governs
    commercial licensing rather than gating access to the openly released files. Some constituent
    datasets remain under temporary pre-publication embargo and are therefore not yet released.
  stewardship_roles:
    - >-
      Ethical review and governance oversight: Vardit Ravitsky and Jean-Christophe Bélisle-Pipon,
      as named in the release.
    - >-
      Long-term preservation and hosting: University of Virginia Dataverse (LibraData), supported
      by committed institutional funds.
    - >-
      Program management and project inquiries: Swathi Thaker, PhD, University of Alabama at
      Birmingham (snthaker@uab.edu), as listed on the CM4AI project portal.
    - >-
      Website support and updates: Zhandos Sembay, University of Alabama at Birmingham
      (zsembay8@uab.edu), as listed on the CM4AI project portal.
  notes: >-
    Committee contact identifier: ORCID:0000-0003-4535-3486. Jillian Parker is named in the
    release as the Data Governance Committee contact; contact email jillianparker@health.ucsd.edu.
  source_caveats: >-
    The open-access statement derives from the tier 1 Dataverse file table, which lists every
    distributed file as Public; the Data Access Committee statement derives from the tier 3
    project descriptor. These describe different regimes rather than conflicting claims, and both
    are represented.

