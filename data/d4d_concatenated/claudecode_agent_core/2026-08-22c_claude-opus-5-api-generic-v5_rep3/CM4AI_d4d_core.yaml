acquisition_methods:
  - acquisition_details: >-
      Protein subcellular localization was directly observed by immunofluorescence-based staining
      (ICC-IF) and confocal microscopy of fixed and permeabilized cells, using Human Protein
      Atlas antibodies against the proteins of interest together with reference markers.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
  - acquisition_details: >-
      Protein-protein interactions were directly measured by two orthogonal mass
      spectrometry-based approaches: affinity purification mass spectrometry on endogenously
      tagged cell lines, and size-exclusion chromatography coupled to mass spectrometry for
      proteome-wide complex and interaction mapping.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
  - acquisition_details: >-
      Transcriptional and fitness phenotypes were directly measured by single-cell CRISPR
      interference screens, sequenced and demultiplexed by guide RNA identity.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
  - acquisition_details: >-
      The CRISPR interference perturbation cell atlas is derived from the underlying raw
      single-cell sequence data by quality control, guide assignment, and computation of
      per-perturbation transcriptional and fitness phenotypes.
    was_inferred_derived: true
    was_directly_observed: false
    was_validated_verified: true
    notes: >-
      The related publication describing the atlas reports validation via phenotypic,
      protein-interaction, and metabolic tracing assays.

collection_mechanisms:
  - mechanism_details: >-
      Immunofluorescence subcellular microscopy for spatial proteomics, using Human Protein
      Atlas antibody resources. Automated fixation and permeabilization protocols were
      established on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
  - mechanism_details: >-
      Affinity purification mass spectrometry (AP-MS) applied to endogenously tagged cell lines
      to recover bait proteins and their associated complexes.
  - mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
      complex and interaction mapping, applied to whole-cell extracts separated into
      chromatographic fractions.
  - mechanism_details: >-
      Single-cell CRISPR interference screens. A CRISPR lentiviral library targeting chromatin
      factors with six guide RNAs per gene was designed, and MDA-MB-468 and KOLF2 lines
      expressing inducible dCas9 were generated and characterized; screens were read out with
      the 10x Genomics 3'HT single-cell kit.

data_collectors:
  - role: Spatial proteomics data generation
    collector_details: >-
      The Lundberg Lab at Stanford University acquired the immunofluorescence-based staining
      (ICC-IF) and confocal microscopy images of MDA-MB-468 cells.
  - role: Protein-protein interaction data generation
    collector_details: >-
      The Nevan Krogan laboratory at the University of California San Francisco generated the
      SEC-MS datasets for KOLF2.1J iPSCs and derivatives and for MDA-MB-468 cells, and the AP-MS
      datasets for treated MDA-MB-468 cells.
  - role: Genetic perturbation data generation
    collector_details: >-
      The genome-scale CRISPR interference perturbation cell atlas in KOLF2.1J iPSCs and the
      targeted perturb-seq screens were generated within the CM4AI Data Acquisition module at
      the University of California San Diego.

