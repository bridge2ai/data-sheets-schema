name: CM4AI June 2026 Data Release
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  CM4AI (Cell Maps for Artificial Intelligence) is the Functional Genomics Grand Challenge
  Data Generation Project of the U.S. National Institutes of Health Bridge2AI program. This
  record describes the June 2026 Data Release (Beta), version 2.0, distributed through the
  University of Virginia Dataverse (LibraData). The project generates multi-modal data on
  human cell architecture — protein-protein interaction, protein spatial localization, and
  genetic perturbation data — in MDA-MB-468 triple-negative breast cancer cells with and
  without chemotherapy (paclitaxel or vorinostat) and in KOLF2.1J induced pluripotent stem
  cells with and without differentiation, toward the goal of machine-readable hierarchical
  maps of cell architecture usable as AI-ready data for interpretable genotype-phenotype
  learning.

  This Beta release contains: perturb-seq data for MDA-MB-468 breast cancer cells with and
  without treatment and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for
  MDA-MB-468 cells with and without treatment and for undifferentiated KOLF2.1J iPSCs and
  iPSC-derived neural progenitor cells, neurons, and cardiomyocytes; AP-MS data for treated
  MDA-MB-468 cells; and immunofluorescence images of MDA-MB-468 cells with and without
  treatment. Ten archive files are distributed. The three immunofluorescence image archives
  are the largest, with stated sizes of 4.6 GB (untreated), 4.2 GB (vorinostat), and 3.8 GB
  (paclitaxel); the mass spectrometry, perturb-seq, and release-metadata archives are small
  packages, ranging from 30.2 KB to 1.1 MB, that carry data products, RO-Crate metadata, and
  provenance graphs, with raw instrument and sequence files deposited in external repositories
  (MassIVE, NCBI SRA, Figshare) or held under temporary pre-publication embargo.

  The two cell lines were selected as ethically sourced and disease-relevant. MDA-MB-468
  (RRID:CVCL_0419) is a triple-negative breast cancer line established from a pleural effusion
  metastatic site of a 51-year-old Black female with metastatic mammary adenocarcinoma, obtained
  from ATCC. KOLF2.1J (RRID:CVCL_B5P3) is an induced pluripotent stem cell line derived from a
  healthy male Northern European donor, available from the Human Induced Pluripotent Stem Cells
  Initiative (HipSci) resource to not-for-profit organizations under a simple material transfer
  agreement.

  Beyond this individual release, the CM4AI project portal reports cumulative figures across
  the program of 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total
  proteins investigated, 11,739 genes targeted, and 21.4 TB of data volume; these are
  project-wide aggregates rather than counts of the files in this release. The project also
  develops the Multi-Scale Integrated Cell (MuSIC) pipeline and Cell Mapping Toolkit, which
  fuse protein-protein interaction and image embeddings into hierarchical cell maps, and the
  FAIRSCAPE AI-readiness framework, which packages outputs as RO-Crates with globally unique
  persistent identifiers and machine-readable EVI provenance graphs. Computed cell maps are
  not part of this release.
