sampling_strategies:
  - is_sample: true
    is_representative: false
    strategies: >-
      Protein and gene targets were selected for disease relevance. The project descriptor
      states an objective of multimodal interrogation of 100 chromatin modifiers and 100
      metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders, with a
      shared list of proteins generated across all cell types and treatment conditions. The
      CRISPR interference perturbation cell atlas in KOLF2.1J iPSCs is expressed genome-scale,
      mapping 11,739 targeted genes. For the triple-negative breast cancer arm, the project
      portal describes curated datasets of SEC-MS capturing approximately 7,000 proteins,
      immunofluorescence images for 523 proteins, and perturb-seq of 200 genes; the October 2025
      and June 2025 releases state that the immunofluorescence archives cover 464 proteins of
      interest.
    why_not_representative: >-
      Targets were chosen as disease-relevant panels and, for the imaging and interaction
      modalities, do not cover the whole proteome; the protein sets interrogated by SEC-MS,
      immunofluorescence imaging, and CRISPR interference perturb-seq overlap incompletely.
    source_caveats: >-
      Panel sizes disagree across sources and tiers. The 100-chromatin-modifier and
      100-metabolic-enzyme figures come from the project descriptor preprint (tier 3) describing
      the project objective; the tier-1 June 2026 release does not restate them. The
      immunofluorescence protein count is stated as 464 by the October 2025 release (tier 1) and
      the June 2025 release, as 563 by the March 2025 release (tier 5), and as 523 by the
      cm4ai.org data-releases page (tier 2). The tier-1 figure of 464 is preferred; the tier-2
      figure of 523 is reproduced above only as part of the portal's own flagship-dataset summary.
  - is_sample: true
    is_representative: false
    strategies: >-
      Two disease-relevant cell lines were selected and were required to be ethically sourced:
      MDA-MB-468, a triple-negative breast cancer line with extensive existing transcriptomic,
      mutational, and whole-genome sequencing characterization, and KOLF2.1J, a reference
      induced pluripotent stem cell line intended for large-scale collaborative studies.
    why_not_representative: >-
      The release states that data were derived from commercially available de-identified human
      cell lines and do not represent all biological variants which may be seen in the
      population at large.

labeling_strategies:
  - labeling_details: >-
      For the immunofluorescence imaging modality, antibody quality was scored according to a
      standard Human Protein Atlas protocol and the highest-scoring antibody per protein was
      selected. Each image carries four channels with fixed semantics: the protein of interest
      (green), nuclei stained with DAPI (blue), endoplasmic reticulum stained with a calreticulin
      antibody (yellow), and microtubules stained with a tubulin antibody (red), providing a set
      of subcellular landmarks common to all images.
    data_annotation_protocol: >-
      Human Protein Atlas standard procedures for image and antibody quality control.

preprocessing_strategies:
  - preprocessing_details: >-
      Each data-generation and processing step calls the FAIRSCAPE client to validate inputs and
      to create an RO-Crate output package containing datasets, metadata, and software or
      resolvable references to them. The FAIRSCAPE server registers each crate and its
      components, assigns persistent ARK identifiers, and computes end-to-end provenance
      entailments expressed in the EVI Evidence Graph Ontology, resolvable as JSON-LD and
      RDF/XML. This packaging applies to the archives distributed in this release, whose
      release-metadata package carries the RO-Crate metadata, HTML datasheet, and provenance
      graphs.
  - preprocessing_details: >-
      Acquired data streams are intended to be processed by the Multi-Scale Integrated Cell
      (MuSIC) pipeline, whose segments download protein-protein interaction networks and
      immunofluorescence images, generate per-modality embeddings (node2vec for interaction
      neighborhoods; a Human Protein Atlas deep learning image model for localization), integrate
      the two into a contrastive co-embedding, perform community detection to build a hierarchy
      of protein assemblies, and evaluate the resulting hierarchy against Gene Ontology and
      Reactome and with a large language model naming step.
    source_caveats: >-
      This pipeline is described in the CM4AI project descriptor preprint (tier 3). The June 2026
      release (tier 1) states explicitly that computed cell maps are not included, so these steps
      describe the project's downstream processing rather than any product distributed here; the
      archives in this release did not pass through them.

machine_annotation_tools:
  - tools:
      - node2vec
      - Human Protein Atlas deep learning image classification model
      - GPT-4 (Gene Set AI naming and confidence-scoring pipeline)
    tool_descriptions: >-
      node2vec represents each protein as a feature vector from its protein-protein interaction
      neighborhood; a Human Protein Atlas deep learning model represents each protein as a
      feature vector from the channels of its immunofluorescence image; and a large language
      model pipeline assigns descriptive names to protein assemblies together with a name
      confidence score.
    notes: >-
      These tools belong to the MuSIC cell-map construction pipeline. Computed cell maps are not
      included in this release, so no output of these tools is distributed here; they are
      recorded for completeness of the project's processing description.

