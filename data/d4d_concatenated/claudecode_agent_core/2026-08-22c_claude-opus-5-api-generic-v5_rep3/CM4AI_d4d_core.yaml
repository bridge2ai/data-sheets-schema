purposes:
  - response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning.
  - response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
      produced from multimodal interrogation of chromatin modifiers, metabolic enzymes, and
      other proteins involved in cancer, neuropsychiatric, and cardiac disorders in
      disease-relevant cell lines under treated and untreated conditions.
  - response: >-
      To produce ethical, AI-ready datasets of cell architecture inferred from multimodal data
      collected for human cell lines, in order to enable transformative biomedical AI research.
  - response: >-
      To broadly stimulate research and development in "visible" machine learning systems that
      are informed by multi-scale cell and tissue architecture rather than being opaque
      predictors.

addressing_gaps:
  - response: >-
      In genomics and precision medicine, machine learning models are often black boxes that
      predict phenotypes from genotypes without exposing the mechanisms by which such
      translation occurs. The project generates matched data and tools so that models can be
      built directly on knowledge maps of cell and tissue architecture.
  - response: >-
      Cell mapping technologies such as mass spectrometry proteomics, spatial proteomics
      imaging, and CRISPR perturbation screens have typically been applied separately. The
      project generates matched, multimodal datasets on a shared set of proteins across cell
      types and treatment conditions so that complementary modalities can be integrated.
  - response: >-
      Biomedical datasets are frequently distributed without machine-readable provenance,
      schemas, or ethical documentation. The project establishes an AI-readiness framework
      combining FAIR metadata, deep provenance graphs, dataset characterization, explainability,
      and ethical licensing and governance.

tasks:
  - response: >-
      Construction of hierarchical, multi-scale maps of protein assemblies in human cells by
      integrating protein-protein interaction and protein localization data.
  - response: >-
      Training of AI and machine learning models, including visible neural networks whose
      internal structure is constrained by cell architecture.
  - response: >-
      Analysis of cellular processes and of cell architectural changes and interactions in the
      presence of specific disease processes, treatment conditions, or genetic perturbations.
  - response: >-
      Bioinformatics analysis of the individual constituent modalities: protein-protein
      interaction profiling, protein subcellular localization, and single-cell transcriptional
      response to CRISPR interference.

instances:
  - instance_type: >-
      Immunofluorescence confocal image of MDA-MB-468 cells stained against one protein of
      interest, acquired under one treatment condition.
    data_substrate: B2AI_SUBSTRATE:19
    data_topic: B2AI_TOPIC:15
    label_description: >-
      Each image carries four channels: nuclei stained with DAPI (blue channel), endoplasmic
      reticulum with a calreticulin antibody (yellow channel), microtubules with a tubulin
      antibody (red channel), and the antibody against the protein of interest (green channel).
      RGB immunofluorescence images were added in the June 2025 revision.
    notes: >-
      No instance count is asserted. The 53,788 immunofluorescent image figure on the project
      portal is a cumulative project-wide aggregate rather than a count of images in this
      release, and the June 2026 release states no per-archive image count.
  - instance_type: >-
      Size-exclusion chromatography mass spectrometry elution profile giving protein-level
      quantification across chromatographic size fractions.
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:28
    label_description: >-
      SEC-MS is used for proteome-wide complex and interaction mapping; co-elution across
      fractions is the evidence for membership in a protein complex.
  - instance_type: >-
      Affinity purification mass spectrometry pull-down of an endogenously tagged bait protein
      and its interacting partners.
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:28
    label_description: >-
      AP-MS on endogenously tagged cell lines is used together with SEC-MS as an orthogonal
      mass spectrometry approach to protein-protein interaction mapping.
  - instance_type: >-
      Single-cell transcriptional profile of a cell carrying a CRISPR interference guide RNA
      against one targeted gene (perturb-seq).
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
    label_description: >-
      The KOLF2.1J perturbation cell atlas maps transcriptional and fitness phenotypes
      associated with 11,739 targeted genes. The CRISPR lentiviral library design described for
      the targeted chromatin-factor screens used six guide RNAs per gene in lines expressing
      inducible dCas9.
    notes: >-
      The figure 11,739 counts targeted genes rather than instances, so no instance count is
      asserted.
  - instance_type: >-
      Raw single-cell RNA sequence read data underlying the CRISPR interference perturbation
      screens.
    data_substrate: B2AI_SUBSTRATE:63
    data_topic: B2AI_TOPIC:34

