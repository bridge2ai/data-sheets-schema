id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset generated by the AI-READI project
  (Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights), one of the
  data generation projects of the NIH Common Fund Bridge2AI program. The dataset contains
  data from 2,280 participants with and without type 2 diabetes mellitus (T2DM), collected
  between July 19, 2023 and May 1, 2025 and harmonized across three US data collection
  sites: the University of Alabama at Birmingham, the University of California San Diego,
  and the University of Washington. Recruitment sampling aimed at an approximately equal
  distribution of participants across diabetes severity (no diabetes; pre-diabetes or
  lifestyle-controlled; controlled by oral or non-insulin injectable medication; insulin
  controlled), self-reported race/ethnicity, and biological sex. Each participant completed
  a single cross-sectional protocol spanning more than ten domains: pre-visit self-report
  surveys, on-site physical and vision assessment, retinal imaging on multiple devices,
  12-lead electrocardiography, cognitive screening, monofilament testing, blood and urine
  laboratory testing, and ten days of at-home continuous glucose monitoring, wearable
  activity monitoring, and indoor environmental sensing. The release comprises 356,343
  files totaling approximately 3.82 TB, organized by datatype, modality, device, and
  participant. The public version contains no protected health information; information
  on participant sex, race/ethnicity, and medications used has been removed and is held
  under controlled access. The dataset is hypothesis agnostic and was designed to support
  downstream artificial intelligence and machine learning research into T2DM pathogenesis
  and salutogenesis (the pathway from disease back to health).
