      (AI-READI)", BMJ Open 2025;15:e097449, https://doi.org/10.1136/bmjopen-2024-097449.
    archival: true
  - external_resources: >-
      ClinicalTrials.gov registration NCT06002048,
      https://classic.clinicaltrials.gov/ct2/show/NCT06002048.
    archival: true
