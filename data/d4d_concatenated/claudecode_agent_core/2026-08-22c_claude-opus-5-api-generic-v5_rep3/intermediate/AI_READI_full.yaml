      the public dataset; counts are published in the recommended-split table in the dataset
      README.
    distribution: >-
      Across all 2,280 participants: Hispanic 380, Asian 545, Black 519, White 836.
    subpopulation_elements_present: true
  - identification: >-
      Biological sex, collected at screening. This variable is held under controlled access
      and is not released with the public dataset; counts are published in the
      recommended-split table in the dataset README.
    distribution: >-
      Across all 2,280 participants: male 951, female 1,329.
    subpopulation_elements_present: true
  - identification: >-
      Diabetes status group, in four categories: no diabetes; pre-diabetes or
      lifestyle-controlled type 2 diabetes; type 2 diabetes controlled by oral or
      non-insulin injectable medication; insulin-controlled type 2 diabetes.
    distribution: >-
      Across all 2,280 participants: no diabetes 776, lifestyle 560, oral 686, insulin 258.
    subpopulation_elements_present: true
  - identification: >-
      Age in years; eligibility required age 40 years or older, with a stated maximum of 85
      years in the study eligibility module.
    distribution: >-
      Mean age across all 2,280 participants 60.8 years, standard deviation 11.3 years.
    subpopulation_elements_present: true
  - identification: >-
      Study site, one of three geographically distinct US recruiting locations chosen for
      geographic variability and to broaden representation: University of Alabama at
      Birmingham (Birmingham, Alabama), University of California San Diego (San Diego,
      California), and University of Washington (Seattle, Washington).
    subpopulation_elements_present: true
    notes: >-
      Individuals from all demographic backgrounds were recruited at all three sites, but
      the proportion of each group varies with the demographic prevalence of that group in
      each site's geographic area.

