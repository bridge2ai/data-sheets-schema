splits:
  - split_details: >-
      Version 3.0.0 introduces a recommended 70/15/15 train/validation/test split over the
      2,280 participants, distributed in the participants.tsv file included with the
      dataset. Because sex, race and ethnicity are not released with the public version, the
      project team prepared the split so that the validation and test sets are balanced as
      well as possible for sex, race/ethnicity and diabetes status (no diabetes,
      pre-diabetes/lifestyle controlled, oral medication controlled, and insulin
      controlled), and reported mean age per partition. The stated rationale is to reduce
      disparities in models developed from the dataset when demographic labels are
      unavailable to the user. Earlier dataset versions did not include recommended splits.

