      NIH RePORTER project record for award OT2OD032644, Bridge2AI: Salutogenesis Data
      Generation Project.
    archival: true

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.2
    notes: >-
      Version 2.0.0, released 2024-11-08, contained 1,067 participants and 165,051 files
      totaling 2.01 TB. It is no longer accessible on FAIRhub.
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.1
    notes: >-
      Version 1.0.0, released 2024-05-03, contained 204 participants from the pilot data
      collection phase. It is no longer accessible on FAIRhub.

intended_uses:
  - use_category: AI/ML research on type 2 diabetes
    examples:
    - >-
      Training and evaluating artificial intelligence and machine learning models on
      multimodal type 2 diabetes data, including multimodal model development across survey,
      clinical, imaging, waveform and wearable modalities.
    usage_notes: >-
      Access is conditioned on agreeing to use the data only for type 2 diabetes related
      research; a controlled access version will allow more generic use.
  - use_category: Disease trajectory modeling
    examples:
    - >-
      Downstream pseudotime manifold analysis to predict disease trajectories from complex
      multimodal data spanning participants from normal to insulin-dependent T2DM, and
      reconstruction of a temporal atlas of T2DM development and reversal toward health.
  - use_category: Methodological and community resource
    examples:
    - >-
      Use as a model and blueprint for future data generation projects seeking to produce
      ethically sourced, FAIR, AI-ready biomedical datasets, and as training material for the
      AI-READI year-long research internship program.
  - use_category: Fairness-aware model development
    examples:
    - >-
      Use of the distributed 70/15/15 train/validation/test split, whose validation and test
      partitions are balanced as far as possible for sex, race/ethnicity and diabetes status,
      to reduce disparities in derived models when demographic labels are unavailable.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited; the dataset is
      intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or with other information, to compromise the
      confidentiality or privacy of a data subject, to identify or contact any data subject or
      group of data subjects, to extract or extrapolate identifying information, to establish
      a data subject's membership in a particular group of persons, or otherwise to cause harm
      or injury to any data subject.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or
      otherwise conveying any portion of the data or any derivative work to a third party
      other than another licensee bound by identical terms.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for
      training or development purposes, including model weight modification and other
      adjustments to a model's logic or operation, even where that vendor is party to a
      Business Associate Agreement with the licensee's institution. Short-term interaction
      such as prompting or querying a third-party model under a Business Associate Agreement
      is permitted for analysis.
  - prohibition_reason: >-
      Reproducing the data in papers, articles, presentations, analyses, reports or
      publications, except that small representative samples may appear in up to five images
      or figures per paper for illustrative purposes; larger amounts must not be published,
      posted or otherwise made available via supplemental files, zip archives, code packages
      or other means, notwithstanding journal or conference requirements.
  - prohibition_reason: >-
      Storing the data anywhere other than on servers and devices maintained by and located
      within the licensee's institution, or on cloud or remote storage and backup services
      that have a HIPAA-approved Business Associate Agreement in place with that institution.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking that may be applied to
      the data to identify the licensee for security purposes.

future_use_impacts:
  - impact_details: >-
      There is a theoretical risk of future re-identification. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level identification,
      so the project implements a robust data dissemination system, a strict license
      agreement and data watermarking for both the public and controlled sets. Beyond this,
      the creators do not currently anticipate uses of the dataset that could result in
      unfair treatment or harm.
  - impact_details: >-
      Licensees may make, reproduce and distribute models, algorithms and programs developed,
      trained or adapted using the data provided those models do not themselves contain the
      data or any modified version of it, and provided the licensee undertakes all reasonable
      efforts before dissemination to minimize the likelihood that data can be memorized,
      derived, reconstructed or reconstituted through the use or construction of such models.
  - impact_details: >-
      The project anticipates that the flagship dataset will lead to novel discoveries into
      T2DM pathogenesis and salutogenesis while benefiting a broader population, and that the
      accompanying blueprint may remove one of the major bottlenecks to widespread use of AI
      in healthcare, namely the availability of data that is off-the-shelf ready for AI-based
      analysis.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed publicly through the FAIRhub platform. Onward sharing by a
      licensee is restricted: data may be given only to another licensee bound by an identical
      agreement, and then only for collaboration with the licensee on one or more projects
      involving the data. A licensee entering the agreement on behalf of an authorized group
      may sublicense to authorized users who are legal members of that group; their rights
      terminate automatically when their relationship with the group or institution ends.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    access_urls:
      - https://fairhub.io/datasets/3
      - https://fairhub.io/datasets/3/access
    notes: Used for all retinal imaging datatypes (FLIO, OCT, OCTA and photography).
  - format: CSV
    media_type: text/csv
    access_urls:
      - https://fairhub.io/datasets/3
    notes: Used for clinical data mapped to OMOP CDM tables and for environmental sensor data.
  - format: JSON
    media_type: application/json
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for metadata files including dataset_description.json,
      dataset_structure_description.json, study_description.json, participants.json and
      dqd_omop.json, and for Open mHealth wearable data.
  - format: Markdown
    media_type: text/markdown
    access_urls:
      - https://fairhub.io/datasets/3
    notes: Used for README.md, CHANGELOG.md and healthsheet.md.
  - format: FAIRhub portal with Azure Storage access
    access_urls:
      - https://fairhub.io/datasets/3/access
    notes: >-
      Access requires logging in through a verified ID system, agreeing to use the data only
      for type 2 diabetes related research, and agreeing to the license terms. Azure Storage
      access is described in the version 3.0.0 documentation. All data files are in formats
      accessible with freely available software, so no specific software is required.

distribution_dates:
  - release_dates: >-
      Version 1.0.0 released 2024-05-03; version 2.0.0 released 2024-11-08; version 3.0.0
      released 2025-11-17. New versions are planned approximately once a year.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    AI-READI Data License Agreement, Version 2.0, with Washington University in St. Louis as
    Licensor, available at https://doi.org/10.5281/zenodo.17555036. The license grants a
    non-exclusive, non-transferable license to download, reproduce and use the data and to
    create derivative works, for research and for commercial and non-commercial purposes,
    subject to restrictions on sharing, storage, interaction with third-party models,
    publication and use. Derivative data, including synthetic data generated from the data,
    remain subject to all restrictions. Licensees must acknowledge the Licensor and the
    source and funder of the data in any papers, and must comply with NIH Genomic Data
    Sharing Policy security best practices for controlled-access data. The agreement
    terminates automatically on any breach, whereupon the licensee must delete all copies and
    cease all use. Title and all industrial and intellectual property rights remain with the
    Licensor and its suppliers. The data are provided "as is" without warranty, liability is
    capped at one US dollar in the aggregate, and the licensee indemnifies the Licensor. This
    license was specifically tailored to enable reuse of clinical datasets for commercial or
    research purposes while imposing strong requirements around data usage, security and
    secondary sharing to protect study participants, especially when data are reused for AI
    and ML applications.
  notes: >-
    Access to the public version additionally requires agreeing to use the data only for type
    2 diabetes related research; the FAIRhub consent metadata records that a private version
    will allow more generic use. The full dataset is accessible by entering into a data use
    agreement, and the controlled access set is available only to scientists whose
    institutions have completed legal and privacy use agreements with the AI-READI research
    program.

ip_restrictions:
  restrictions:
  - >-
    Title to the data and all industrial and intellectual property rights in it remain solely
    and exclusively with the Licensor, Washington University in St. Louis, and its suppliers;
    the licensee must not take any action inconsistent with that ownership, and any rights not
    expressly granted in the license are reserved. Licensees may not reproduce the data in
    publications beyond up to five illustrative images or figures per paper, and may refer
    publishers and conference organizers to the Licensor to obtain a separate license for such
    purposes.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  other_compliance: >-
    Licensees must comply with all data security and privacy standards established by the NIH
    under its Genomic Data Sharing Policy, currently the NIH Security Best Practices for
    Controlled-Access Data Subject to the NIH GDS Policy, and with all applicable laws,
    regulations and restrictions relating to the distribution and use of the data and models.
    The public set is stripped of protected health information under the HIPAA Privacy Rule
    Safe Harbor method. The study is recorded as not FDA-regulated for either drug or device,
    and as having no data monitoring committee.
  notes: >-
    The RO-Crate metadata records a confidentiality level of "HL7:2N (normal)". The value
    "restricted" is used here because it is the schema term that matches an access route
    requiring verified-ID login, self-attestation and license acceptance, with a further tier
    behind institutional agreements. Questions in the healthsheet about export controls and
    other regulatory restrictions are answered by referring to the license.

data_governance:
  committee_name: AI-READI Data Access Committee
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: >-
    Access to the publicly available set requires logging in through a verified ID system,
    agreeing to use the data only for type 2 diabetes related research, and agreeing to the
    license terms, which set restrictions and obligations for data usage. The controlled
    access set contains all data in the public set plus more sensitive data and is available
    only for use by scientists whose institutions have completed legal and privacy use
    agreements with the AI-READI research program; the requirements for the controlled access
    sets were being developed by the Data Access Committee at the time of the protocol
    publication. Access status is recorded on FAIRhub as
    PublicDownloadSelfAttestationRequired.
  stewardship_roles:
  - >-
    The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub
    through Microsoft Azure. The RO-Crate metadata names the AI-READI Consortium as the data
    governance committee. Washington University in St. Louis is recorded as the managing
    organization of the dataset and as the lead sponsor of the study, and is the Licensor
    under the data license.
  notes: >-
    A Community Advisory Board of eleven persons from the three sites, including diversity in
    race and ethnicity as represented in the AI-READI sample, contributes to the development
    of the protocol. The project also engaged with the Native Biodata Consortium to evaluate
    tools such as data usage agreements, contract negotiations, transparent access agreements
    and forms of assured return of benefit and sustainable input, control and monitoring of
    Tribal data.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      Approved under protocol STUDY00016228, with reliance agreements with the IRBs of the
      University of Alabama at Birmingham and the University of California, San Diego. Initial
      approval was received on December 20, 2022, and the initial approval letter is published
      with the version 3.0.0 documentation. An annual renewal application reporting the status
      and progress of the study is required and is due within 90 days of expiration. Human
      subject review status is recorded as "Submitted, approved". Written informed consent is
      provided by all participants.
    source_caveats: >-
      The RO-Crate metadata names the reviewing body "Washington University IRB" while giving
      a University of Washington Human Subjects Division postal address in Seattle and the
      contact hsdrely@uw.edu; the healthsheet and the BMJ Open protocol both name the
      University of Washington. Both are tier-1 or supporting sources and the ranking does not
      settle the discrepancy, so the institution is recorded as the University of Washington,
      consistent with the address, contact and protocol number, and the RO-Crate label is
      noted here.
  - reviewing_organization: AI-READI ethics module
    review_details: >-
      The RO-Crate metadata records ethical review by Camille Nebeker, Debra Mathews, Kadija
      Ferryman and Nicholas Evans. Ethical, legal and social implications are considered at
      every stage of the project cycle, with guidance from bioethicists, and the project team
      reviewed existing documentation approaches such as datasheets and healthsheets to
      identify the most suitable one for biomedical data.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - STUDY00016228
  ethics_review_board: >-
    University of Washington Institutional Review Board, with reliance agreements with the
    IRBs of the University of Alabama at Birmingham and the University of California, San
    Diego.
  regulatory_compliance:
  - >-
    Registered on ClinicalTrials.gov as NCT06002048. Recorded as not FDA-regulated for drug
    or device and as having no data monitoring committee. HIPAA Privacy Rule Safe Harbor
    de-identification applied to the public release; NIH Genomic Data Sharing Policy security
    best practices imposed on licensees. Data collection took place in the USA.
  special_populations:
  - >-
    No protected population was purposefully included. Eligibility was restricted to adults
    aged 40 years or older (with a stated maximum of 85 years) who were able to provide
    consent and who could speak and read English. Pregnancy, gestational diabetes and type 1
    diabetes were exclusion criteria.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Pregnant women were excluded, as were people with gestational diabetes and type 1
    diabetes. Minors were not eligible; the minimum age was 40 years. Accessibility
    measurements were not specifically assessed, but transportation assistance in the form of
    rideshare services was offered to participants who reported barriers to transporting
    themselves to study visits. Coordinators alerted participants to several incidental
    findings before they left a visit and referred them for emergency or ophthalmologic care
    where blood pressure, heart rate or retinal findings met defined thresholds.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically before the visit or in person
      at the start of the visit.
    consent_documentation: >-
      Informed consent to participate was required before participation in any part of the
      protocol, including questionnaires. Potential participants could read all consent
      documentation electronically in REDCap before their visit and give consent with an
      electronic signature without verbal communication with a clinical research coordinator,
      or could decide at that point not to participate or to request additional information.
      The approved consent form for the principal project site, the University of Washington,
      is published with the version 3.0.0 documentation; the other clinical sites had IRB
      reliance and used the same form with minor institution-specific language.
    consent_scope: >-
      Participation in the single-visit protocol and the ten-day at-home monitoring period;
      placement of data in an open-source repository; and provision of blood and urine
      specimens for the study biorepository and future research.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study
      participation. Any data that had been shared or used up to that point would remain in
      the dataset. This is clearly communicated in the consent document.

collection_consents:
  - consent_details: >-
      Consent was requested through a personalized REDCap recruitment interface reached from
      links, access codes and QR codes in a mailed invitation letter and an invitation email.
      In the interface individuals could read an overview of the research program,
      expectations for participation and answers to frequently asked questions, download the
      informed consent document, request a call back from study staff, complete a screening
      survey for qualification, and enroll by signing the electronic consent. Those without
      internet access could call research staff for alternative methods of enrollment. Study
      questionnaires became available only after consent was given.

collection_notifications:
  - notification_details: >-
      Each individual was aware of the data collection: this was active data collection
      directly from participants rather than passive collection or secondary use of existing
      data. Notification took the form of a personalized hardcopy invitation letter and an
      invitation email directing potential participants to the REDCap recruitment interface,
      followed by the consent process.

consent_revocations:
  - revocation_details: >-
      Participants could withdraw consent at any time and cease participation. Data already
      shared or used at the point of withdrawal remain in the dataset, and this limit on
      revocation is stated in the consent document.

participant_privacy:
  - anonymization_method: >-
      HIPAA Safe Harbor removal of protected health information, plus removal of sex,
      race/ethnicity and medication information from the public set. No direct identifiers
      were collected for the dataset.
    privacy_techniques: >-
      Verified-ID login and self-attestation for public download; a separate controlled access
      tier requiring institutional legal and privacy use agreements; a strict custom license
      restricting storage, third-party model training and secondary sharing; static
      watermarking of data to identify the licensee; and selection of at-home devices that
      capture no video or audio, have no GPS location monitoring and do not sync with
      participant-owned devices.
    reidentification_risk: >-
      A theoretical risk of future re-identification is acknowledged. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level identification,
      which motivated the dissemination system, license and watermarking controls.
    data_linkage: >-
      Records are linked across modalities within the dataset by the study participant ID.
      The controlled access set links participants to 5-digit ZIP code, sex, race, ethnicity,
      genetic sequencing data, past health records, medications, and traffic and accident
      reports.

participant_compensation:
  - compensation_provided: true
    compensation_amount: >-
      $200 for the study visit, paid from grant funding. The IRB protocol adds that reasonable
      costs for parking, public transit or rideshare related to the study visit are covered,
      and notes that transportation fees above $25 may not be reimbursed.
    compensation_type: >-
      Monetary stipend, with reimbursement of travel costs and, where needed, provision of
      rideshare transportation assistance.
    compensation_rationale: >-
      Compensation for the time required by a single visit lasting between 2.5 and 4 hours
      plus a ten-day at-home monitoring period and return of three devices.
    notes: >-
      The IRB protocol states that the stipend is provided after the final data and study
      devices are received, typically at least two weeks after the study visit, and is not
      prorated. Mailing materials and fees for returning the at-home devices were provided by
      the site.

maintainers:
  - role: researcher
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset; it is hosted on FAIRhub through
      Microsoft Azure. Contact information is provided in the README file included with the
      dataset and at https://aireadi.org/contact; the central study contact recorded in the
      study metadata is Aaron Lee at contact@aireadi.org. The study_description.json and
      dataset_description.json metadata files included with the dataset carry additional
      information about the contact person or entity, authors and contributors.

updates:
  frequency: Approximately annual
  update_details: >-
    The dataset is released as static versions and existing versions are not updated. New
    versions are released approximately once a year with additional data from participants
    enrolled since the previous release, and more versions are expected while enrollment
    continues. Changes between versions are described in detail in the CHANGELOG file included
    in the dataset and visible in the documentation.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - >-
    Version 1.0.0, DOI 10.60775/fairhub.1, released 2024-05-03, 204 participants (pilot
    phase); version 2.0.0, DOI 10.60775/fairhub.2, released 2024-11-08, 1,067 participants,
    165,051 files, 2.01 TB; version 3.0.0, DOI 10.60775/fairhub.3, released 2025-11-17, 2,280
    participants, 356,343 files, 3.82 TB.
  version_details: >-
    Each version has its own DOI and its own documentation set, selectable from a version
    dropdown at https://docs.aireadi.org. Versions 1.0.0 and 2.0.0 are marked on FAIRhub as no
    longer accessible. Datasheets exist for the first version
    (https://docs.aireadi.org/docs/1/dataset/healthsheet) and the second
    (https://docs.aireadi.org/docs/2/dataset/healthsheet) as well as for this version. Data
    fields are largely the same as in version 2.0.0, except that the Snellen visual acuity
    variables were dropped so that only logMAR visual acuity measurements remain; version
    3.0.0 also adds three imaging devices relative to the pilot release and introduces a
    recommended data split.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances;
    participants were not told that their data would be retained only for a fixed period.
    Older versions of the dataset are not maintained as accessible releases: rather than
    updating a version, new versions are published with additional instances.

notes: >-
  A smaller mini-subset of version 3.0.0 is available for pipeline development; the FAIRhub
  record links it as a child dataset (record 4) and the version 3.0.0 documentation describes
  it in the Preliminary Information section. No separate DOI for the mini-subset is stated in
  the sources. Both the FAIRhub dataset pages and the AI-READI documentation site carry the
  banner "This repository is under review for potential modification in compliance with
  Administration directives."

source_caveats: >-
  Sources in the bundle disagree on several points, resolved as follows. (1) Collection start
  date: FAIRhub gives 2023-07-19 and the BMJ Open protocol gives 18 July 2023; the
  higher-ranked FAIRhub value is used. (2) Target enrollment: the FAIRhub study description,
  the Nature Metabolism comment and the BMJ Open protocol all give 4,000 participants, while
  the IRB protocol form states 4,600; the tier-1 FAIRhub figure is used and the IRB figure is
  noted here. (3) Institutional attribution: the FAIRhub study description names Washington
  University in St. Louis (ROR 01yc7t268) as lead sponsor, managing organization and the
  affiliation of principal investigator Aaron Lee, while the RO-Crate names him as being in
  the Department of Ophthalmology, University of Washington and NIH RePORTER lists the awardee
  organization as University of Washington; the tier-1 values are recorded and the discrepancy
  is retained rather than resolved. (4) IRB naming, described under ethical_reviews. (5) The
  version 3.0.0 documentation "About" page states that it "is associated with v3.0 of the
  dataset, which contains data from the participants of the pilot study phase", which
  contradicts the FAIRhub description, the healthsheet and the README, all of which report
  2,280 participants collected through May 1, 2025; the documentation sentence appears to be
  carried over from the version 1.0.0 page and is not followed here. (6) The healthsheet
  describes version 3.0.0 as covering data "up through the end of the second year of the
  study", while the README changelog table attributes 1,213 of its participants to year three
  data; the collection window July 19, 2023 to May 1, 2025 is common to both and is used.
  (7) The healthsheet answers "No" to whether the dataset identifies demographic
  subpopulations, reflecting their removal from the public release, while the README publishes
  race/ethnicity and sex counts for the recommended splits; both facts are represented in
  subpopulations. (8) The dataset name is given as "Artificial Intelligence Ready and
  Equitable Atlas for Diabetes Insights" in the BMJ Open protocol and Nature Metabolism, and
  as "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights" in the NIH
  RePORTER abstract, healthsheet and README; both expansions of the acronym appear in the
  bundle. (9) The healthsheet questions on de-identification pre-processing (composition Q13,
  preprocessing Q1) and on errata are left blank in the source, so no value is asserted for
  them here. (10) Prevalence of T2DM is given as 10.5% of the world's adult population in the
  BMJ Open protocol and as greater than 6% of the world's population in Nature Metabolism;
  neither figure is used in this record.