      Dataset documentation for version 3.0.0, describing every data domain, its clinical
      context, acquisition, individual variables, file formats, data standards, metadata and
      example outputs, together with the healthsheet, citation instructions, controlled
      variables, AI-readiness considerations and changelog.
    archival: false
    restrictions:
    - >-
      The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
      associated with its use.
    future_guarantees: >-
      One version of the documentation is maintained for each version of the dataset and is
      selectable from the version dropdown. Available at https://docs.aireadi.org.
  - external_resources: >-
      AI-READI project website, describing the project, team, goals and data sharing
      approach, at https://aireadi.org.
    archival: false
  - external_resources: >-
      Zenodo community of the AI-READI project at https://zenodo.org/communities/aireadi,
      which hosts the dataset license (https://doi.org/10.5281/zenodo.17555036) and project
      guidelines.
    archival: true
  - external_resources: >-
      GitHub organization of the AI-READI project at https://github.com/AI-READI, holding
      project code and guidelines.
    archival: false
  - external_resources: >-
      Clinical Dataset Structure (CDS) specification, a standard developed by the project for
      organizing clinical research datasets and including structured metadata, at
      https://cds-specification.readthedocs.io.
    archival: false
  - external_resources: >-
      Associated publication: AI-READI Consortium (2024), "AI-READI: rethinking AI data
      collection, preparation and sharing in diabetes research and beyond", Nature Metabolism
      6:2210-2212, https://doi.org/10.1038/s42255-024-01165-x.
    archival: true
  - external_resources: >-
      Associated publication: Owsley C, Matthies DS, McGwin G, et al. "Cross-sectional design
