conforms_to: >-
  The dataset is organized according to the Clinical Dataset Structure (CDS) v0.1.1
  specification: one directory per datatype at the root level, then one directory per
  modality, then per device, then per participant. Within datatypes, file content follows
  the WaveForm DataBase (WFDB) standard for 12-lead electrocardiography; the Observational
  Medical Outcomes Partnership (OMOP) Common Data Model for clinical, laboratory and survey
  data; Digital Imaging and Communications in Medicine (DICOM) for retinal FLIO, OCT, OCTA
  and photography; Open mHealth for wearable activity monitor and continuous glucose
  monitoring data; and the NASA ASCII File Format Guidelines for Earth Science Data for
  environmental sensor data. A separate RO-Crate metadata description of the release
  (RO-Crate 1.2-DRAFT, FAIRscape profile 0.1) declares the release and nine per-modality
  subcrates.
