variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    notes: >-
      Study-internal participant identifier. Each participant directory within a device
      directory is named after the participant's ID number used in the study, and the ID
      links a participant's records across all modalities.
  - variable_name: hemoglobin_a1c
    data_type: float
    unit: "%"
    measurement_technique: Whole blood test performed by the University of Washington Nutrition and Obesity Research Center
    notes: "Reference range 4.0-6.0% as provided by the testing laboratory. Marker for diabetes."
  - variable_name: glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test performed by the University of Washington Nutrition and Obesity Research Center
    notes: "Reference range 62-125 mg/dL as provided by the testing laboratory. Marker for diabetes. Blood was collected non-fasting."
  - variable_name: insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test
    notes: "Reference range 0.0-24.9 ng/mL as provided by the testing laboratory. Marker for diabetes."
  - variable_name: c_peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test
    notes: "Reference range 1.1-4.4 ng/mL as provided by the testing laboratory. Indicator of insulin production."
  - variable_name: nt_pro_bnp
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma test
    notes: "N-terminal pro-B-type natriuretic peptide. Reference range varies by age. Severity and outcome predictor of heart failure."
  - variable_name: troponin_t
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma test
    notes: "Reference range female <11, male <16 as provided by the testing laboratory. Marker of myocardial injury."
  - variable_name: c_reactive_protein_high_sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum test
    notes: "Reference range 0.0-10.0 mg/L as provided by the testing laboratory. Inflammation marker and risk factor for T2DM."
  - variable_name: total_cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: "Reference range <200 mg/dL as provided by the testing laboratory. Cardiovascular disease risk factor."
  - variable_name: high_density_lipoprotein_cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: "Reference range >39 mg/dL as provided by the testing laboratory."
  - variable_name: low_density_lipoprotein_cholesterol
    data_type: float
    unit: mg/dL
    derivation: Calculated
    measurement_technique: Serum lipid panel
    notes: "Reference range <130 mg/dL as provided by the testing laboratory."
  - variable_name: triglycerides
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: "Reference range <150 mg/dL as provided by the testing laboratory."
  - variable_name: creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test
    notes: "Reference range female 0.38-1.02, male 0.51-1.18 mg/dL as provided by the testing laboratory. Marker for kidney function."
  - variable_name: urine_albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test performed by the University of Washington Nutrition and Obesity Research Center
    notes: "No reference range provided. Urinary biomarker for early diabetic nephropathy."
  - variable_name: urine_creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test performed by the University of Washington Nutrition and Obesity Research Center
    notes: "No reference range provided. Urinary biomarker for early diabetic nephropathy."
  - variable_name: moca_total_score
    data_type: integer
    maximum_value: 30.0
    measurement_technique: Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo application
    notes: >-
      Total possible score is 30, with higher numbers representing better performance.
      Section subscores, Memory Index Score and task completion times were also exported.
  - variable_name: best_corrected_visual_acuity_logmar
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester, right and left eyes tested
      separately under photopic conditions and under mesopic conditions using a 2.0 neutral
      density filter
    notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate
      better resolution. Snellen visual acuity variables present in earlier dataset versions
      were dropped in version 3.0.0, leaving only logMAR measurements.
  - variable_name: letter_contrast_sensitivity_log_cs
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars Letter Contrast Sensitivity chart, monocular, under photopic conditions and under
      mesopic conditions using a neutral density occluder
    notes: >-
      Higher numbers mean better sensitivity. Testing was terminated after two consecutive
      errors or at the end of the chart; log CS was recorded by multiplying the number of
      errors prior to the final correct letter by 0.04 and subtracting from the log CS value
      at the final correct letter.
  - variable_name: systolic_blood_pressure
    data_type: integer
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric, medically approved device, measured twice separated by two
      minutes. Devices used across sites were the OMRON HEM 907XL, Medline MDS4001 and
      Welch Allyn 6000 series
  - variable_name: diastolic_blood_pressure
    data_type: integer
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric, medically approved device, measured twice separated by two
      minutes
  - variable_name: heart_rate
    data_type: integer
    unit: bpm
    measurement_technique: Read from electrocardiography or blood pressure measurement devices; also recorded continuously by the Garmin Vivosmart 5
  - variable_name: continuous_glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Dexcom G6 continuous glucose monitor, recorded every five minutes over a ten-day wear period
    notes: Participants were masked to the Dexcom results during the monitoring period.
  - variable_name: monofilament_test_response
    data_type: categorical
    categories:
    - "yes; no"
    measurement_technique: >-
      10 g monofilament applied to three locations on the plantar surface of each foot, ten
      times per location, with the participant's eyes closed; insensate areas were retested
      for confirmation
    notes: Standard clinical test used to monitor peripheral neuropathy in people with diabetes.
  - variable_name: particulate_matter
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for ten days
    notes: >-
      Recorded in four size fractions, PM1.0, PM2.5, PM4 and PM10. Units are not stated in
      the sources. The same sensor recorded ambient temperature, relative humidity, nitrogen
      oxides (NO and NO2), volatile organic compounds, and eleven multi-spectral light
      intensity measurements.
  - variable_name: zip_code_5_digit
    data_type: string
    is_sensitive: true
    notes: Held under controlled access; not released with the public dataset.
  - variable_name: sex
    data_type: categorical
    is_sensitive: true
    notes: >-
      Biological sex, self-reported at screening. Held under controlled access; removed from
      the public dataset to prevent stigmatization of findings.
  - variable_name: race
    data_type: categorical
    is_sensitive: true
    notes: >-
      Self-reported race. Held under controlled access; removed from the public dataset to
      prevent stigmatization of findings.
  - variable_name: ethnicity
    data_type: categorical
    is_sensitive: true
    notes: >-
      Self-reported ethnicity. Held under controlled access; removed from the public dataset
      to prevent stigmatization of findings.
  - variable_name: current_medications
    data_type: categorical
    is_sensitive: true
    measurement_technique: >-
      Self-report of all prescription and over-the-counter medications currently used,
      including pills, injections, creams, salves, sprays, eye drops and dermal patches,
      coded with RxNorm
    notes: >-
      Medication information has been removed from the public version of dataset 3.0.0 and
      is held under controlled access.
  - variable_name: genetic_sequencing_data
    data_type: string
    is_sensitive: true
    notes: Held under controlled access; not released with the public dataset.
  - variable_name: traffic_and_accident_reports
    data_type: string
    is_sensitive: true
    notes: >-
      Driving record and motor vehicle accident information; held under controlled access
      and not released with the public dataset.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so the study is subject to volunteer bias, which may limit
      the generalizability of results to people not represented in the study population.
    mitigation_strategy: >-
      Recruitment proceeded in waves whose composition and size were adjusted by under- and
      oversampling groups as needed, based on monitored participation characteristics.
  - bias_type: sampling_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based, drawn from patients who had a
      medical encounter within one of three academic health systems, which may not fully
      capture all possible cultural and socioeconomic backgrounds.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic variability across
      the United States and to broaden representation across racial and ethnic groups, and
      uniform data collection protocols were implemented for all subjects at all sites.
  - bias_type: representation_bias
    bias_description: >-
      The study cohort does not include other races and ethnicities such as Pacific
      Islanders and Native Americans, so it may not provide a comprehensive representation of
      the population.
    affected_subsets:
    - All splits and all modalities.
  - bias_type: representation_bias
    bias_description: >-
      Eligibility required participants to speak, read and understand English, which may have
      created challenges in recruiting Hispanic and/or Asian persons.
  - bias_type: sampling_bias
    bias_description: >-
      While the cross-sectional design ultimately aims for balance across race/ethnicity,
      biological sex, and diabetes presence and severity, enrollment is ongoing and the
      interim data releases, including the pilot phase, have not achieved balanced
      distribution across those groups.
    mitigation_strategy: >-
      A recommended train/validation/test split is distributed in which the validation and
      test partitions are balanced as well as possible for sex, race/ethnicity and diabetes
      status.
  - bias_type: measurement_bias
    bias_description: >-
      Image quality varies between and within participants for handheld, undilated
      acquisition on the Optomed Aurora, and operator involvement differs across imaging
      devices; devices such as the Heidelberg Spectralis are operated manually and are not
      fully automated, so quality issues may arise that lead to a modality being skipped.
    mitigation_strategy: >-
      Device make, model and specific scan modality were documented to ensure repeatability,
      and multiple devices were included for a single measure to enhance generalizability
      and represent the range of equipment used in clinical settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Predominantly urban and hospital-based recruitment at three academic medical centers
      may not fully capture all possible cultural and socioeconomic backgrounds.
    scope_impact: Affects generalization of models derived from the dataset.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The cohort covers four self-reported race/ethnicity groups (Asian, Black, Hispanic,
      White) and excludes other groups such as Pacific Islanders and Native Americans.
    recommended_mitigation: >-
      Users should not assume coverage of populations absent from the cohort. The project
      engaged with the Native Biodata Consortium as a co-learning opportunity on challenges
      specific to American Indian and Alaska Native communities.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The design is cross-sectional with a single study visit per participant; the ten-day
      at-home monitoring period is the only longitudinal component in this release.
    scope_impact: >-
      Disease trajectories cannot be observed directly within a participant; the intended
      analytic approach infers trajectories across participants of differing severity.
  - limitation_type: scope_limitation
    limitation_description: >-
      No explicit labels or targets are provided with the data instances, and no formal
      guidelines exist for future researchers creating new labels or defining new tasks.
  - limitation_type: scope_limitation
    limitation_description: >-
      Raw, pre-standardization data are retained by the project but are not shared, because
      they have not been mapped to standardized terminologies and may inadvertently contain
      personal health information in free-text fields.
    recommended_mitigation: >-
      Raw data may be included in future releases of the controlled access dataset.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The biorepository holds a finite number of biospecimens available to share with
      scientists; procedures for reviewing and prioritizing written requests were still being
      developed at the time of the protocol publication.
  - limitation_type: integration_limitation
    limitation_description: >-
      The public version omits sex, race/ethnicity and medication information, which limits
      fairness auditing, subgroup analysis and medication-adjusted modeling unless the user
      obtains the controlled access version.

anomalies:
  - anomaly_details: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements; in a few cases the data collection device had no
      stored results or was returned too late to retrieve the results, for example because
      the battery died or data was lost; and in a few cases a data collision occurred at some
      point in the process and data were lost.
  - anomaly_details: >-
      In survey data, skipped questions and incomplete responses are expected.
  - anomaly_details: >-
      In wearable data, improper use and technical failures such as battery failure or system
      malfunction are expected. The Garmin Vivosmart 5 required charging every two to three
      days, producing gaps in the activity record.
  - anomaly_details: >-
      In imaging data, participant non-cooperation, noise that may obscure the images, system
      malfunction and data transfer failures are expected. FLIO acquisition is particularly
      sensitive: the device cannot tolerate more than one centimeter of movement during image
      acquisition, and unwanted signals such as background light or lens fluorescence cannot
      simply be subtracted because they belong to the same Poisson distribution as the useful
      data.
  - anomaly_details: >-
      FLIO was performed as the last modality of a study visit because it takes longer than a
      standard OCT and exposes participants to uncomfortable levels of light, so participant
      compliance may be lower for this modality than for others.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The dataset creators state that the dataset does not contain data that, if viewed
      directly, might be offensive, insulting, threatening, or otherwise pose a safety risk.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public version of the dataset does not contain data considered sensitive. Protected
      health information as defined by the HIPAA Privacy Rule has been stripped, and
      information about participant sex, race/ethnicity and medications used has additionally
      been removed.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled access version contains sensitive elements: 5-digit ZIP code, sex, race,
      ethnicity, genetic sequencing data, past health records, medications, and traffic and
      accident reports. Access requires the requester's institution to complete legal and
      privacy use agreements with the AI-READI research program.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The dataset creators state that the dataset does not contain data that might be
      considered confidential, and that no personally identifiable information is included.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor. The public set is stripped of Protected Health Information as defined
    by the HIPAA Privacy Rule via the Safe Harbor method.
  identifiers_removed: >-
    Protected health information; information related to the sex and race/ethnicity of the
    participants; medications used.
  deidentification_details: >-
    No identifiers were collected, so no active de-identification was necessary, but the team
    verified that no identifiable data per US HIPAA were present in the data. Sex and
    race/ethnicity were additionally removed from the public set to prevent stigmatization of
    findings. A robust data dissemination system, a strict license agreement and data
    watermarking are implemented for both the public and controlled sets to prevent
    re-identification attempts, since AI algorithms can infer individual patient
    characteristics and could facilitate individual-level identification. The RO-Crate
    metadata records the release as deidentified with confidentiality level HL7:2N (normal).
  source_caveats: >-
    The FAIRhub dataset description records deIdentType "NoDeIdentification" together with
    deIdentDirect true and deIdentHIPAA true; the accompanying detail explains that no
    identifiers were collected so no active de-identification step was required, which
    reconciles the apparently conflicting flags.

relationships:
  - relationship_details: >-
      All instances are part of the same prospective data generation project, AI-READI, and
      were collected under a single harmonized protocol across three sites. There is
      currently one study visit per participant. Within the dataset, a participant's records
      across all datatypes, modalities and devices are linked by the participant ID used to
      name the per-participant directories and rows of participants.tsv.

acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Directly observed measurements include vital signs, anthropometrics, visual acuity and
      contrast sensitivity, autorefraction, 12-lead electrocardiography, monofilament
      testing, cognitive screening, retinal imaging on six devices, and laboratory testing of
      blood and urine specimens.
  - was_reported_by_subjects: true
    acquisition_details: >-
      Self-reported data include the screening questionnaire, demographics, CES-D-10
      depression screening, PAID-5 diabetes distress, diabetes self-care score, dietary
      assessment, ophthalmic survey, smoking/alcohol/vaping/marijuana history, general health
      history, social determinants of health surveys, and the current medications list.
      Marijuana use was not assessed for participants living in Alabama because it is an
      illegal substance there.
  - was_validated_verified: true
    acquisition_details: >-
      Verification of data entry was performed where possible, for example by
      cross-referencing entered medications with medications that were physically brought in
      or photographed by the participant.
  - was_inferred_derived: true
    acquisition_details: >-
      Derived values include waist-hip ratio and body mass index calculated from measured
      height, weight, and waist and hip circumference, and calculated laboratory values such
      as LDL cholesterol, total globulin, the A/G ratio and the BUN/creatinine ratio.

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for participant recruitment workflows, electronic consent, all
      participant-completed questionnaires, and clinical data captured at the visit including
      medications assessment, vitals, visual acuity, contrast sensitivity, monofilament test
      results and complete blood count results.
  - mechanism_details: >-
      Retinal imaging devices: Optomed Aurora IQ handheld fundus camera (undilated), iCare
      EIDON widefield truecolor confocal fundus system, Heidelberg Spectralis HRA OCT/OCTA,
      Heidelberg FLIO, Topcon Maestro2 3D OCT-1, Topcon Triton DRI OCT, and Zeiss Cirrus 5000
      Angioplex. All retinal images were collected under dilated conditions except the
      Optomed acquisition.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph for 12-lead electrocardiography, with the
      participant's position recorded at 0, 30, 60 or 90 degrees relative to supine.
  - mechanism_details: >-
      At-home monitoring devices issued at the end of the in-person visit and used
      continuously for ten days: Dexcom G6 continuous glucose monitor, Garmin Vivosmart 5
      physical activity monitor worn on the participant's chosen wrist, and the LeeLab Anura
      custom environmental sensor placed in a frequently used area of the home. Devices were
      returned by overnight mail or in person. The environmental sensor and fitness tracker
      were specifically chosen with participant privacy as a primary concern: they capture no
      video or audio, are not equipped with GPS location monitoring, and are not synced with
      participant-owned devices.
  - mechanism_details: >-
      Clinical measurement instruments: automatic oscillometric blood pressure monitors
      (OMRON HEM 907XL, Medline MDS4001, Welch Allyn 6000 series), M&S Technologies Electronic
      Visual Acuity tester at four meters, Mars Letter Contrast Sensitivity charts, Topcon KR
      800 autorefractor, lensometers (NIDEK LM-600P, Topcon CL-200, Topcon CL-300), 10 g
      monofilament, and the MoCA Duo application on an iPad.
  - mechanism_details: >-
      Biospecimen collection and laboratory analysis: EDTA vacutainers, serum separator
      vacutainers, CPT mononuclear cell preparation tubes, PAXgene RNA vacutainers and a urine
      collection kit. Approximately 53 mL of blood was collected. CLIA-certified laboratories
      local to each site performed complete blood counts on fresh whole blood; all other
      assays were performed by the University of Washington Nutrition and Obesity Research
      Center on stored frozen samples batch-shipped on dry ice approximately quarterly.
  - mechanism_details: >-
      Electronic health record screening at each site using ICD-10 diagnosis codes R73.09 for
      pre-diabetes and E11.X for type 2 diabetes, together with demographic data, to build
      per-wave recruitment contact pools.
  - mechanism_details: >-
      FAIRhub, a Microsoft Azure cloud-based data management, curation and sharing platform
      developed for this project, to which each site uploads data at regular intervals and
      from which the dataset is distributed.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Data collection period covered by version 3.0.0. Preliminary pilot enrollment ran from
      July 2023 to November 2023 and formal data collection began on December 1, 2023; pilot
      data were included in the first released dataset. The overall project timeline spans
      four years, with one year for protocol development and training and years two to four
      for recruitment and data collection; the study start date is recorded as 2023-07-19
      (actual) and anticipated completion as 2027-01-01. Enrollment was still ongoing at the
      time of this release.
    source_caveats: >-
      The FAIRhub dataset description and healthsheet give the collection start as July 19,
      2023, while the BMJ Open protocol states that enrollment began on 18 July 2023. The
      FAIRhub value is preferred as the higher-ranked source. The BMJ Open protocol also
      states that recruitment would continue until 30 November 2026, whereas the FAIRhub
      study description gives an anticipated completion date of 2027-01-01.

data_collectors:
  - role: Clinical research coordinator
    collector_details: >-
      Recruited, consented, enrolled and tested participants; administered protocol elements
      including imaging, monofilament and cognitive testing; instructed participants on the
      at-home devices; and ensured return of study materials. All research personnel at the
      three sites underwent training by the data manager at the University of Alabama at
      Birmingham and worked from a detailed Manual of Procedures. Certification required
      mandatory institutional compliance training for human subject research and successful
      administration of all protocol elements to at least three volunteer practice subjects
      before enrolling participants.
  - role: Data manager
    collector_details: >-
      Data managers at each site oversaw the training and certification process and were
      responsible for the quality control of all data before uploading to FAIRhub.
  - role: Retinal imaging technician
    collector_details: >-
      Acquired retinal images and were trained to detect certain potentially life- or
      vision-threatening conditions, specifically retinal detachment, tumor and optic disc
      edema.
  - role: Phlebotomist and laboratory staff
    collector_details: >-
      Collected, processed and shipped blood and urine specimens. Local processing for
      plasma, serum and buffy coats followed standardized operating procedures at each site
      on the day of collection.
  - role: Study team
    collector_details: >-
      Effort was supported by NIH award OT2OD032644 based on percentage of effort contributed
      and salaries aligned with the funding guidelines at each site.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from participants at the three recruiting sites. This was
      active data collection rather than passive collection or secondary use of existing data.
      Recruitment pools were identified by screening electronic health records for diabetes
      and prediabetes ICD-10 codes among patients who had an encounter with the sites' health
      systems.

sampling_strategies:
  - is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling of a triple-balanced cohort. The study base is all patients
      aged 40 years or older who had a medical encounter within each health system site
      between 2020 and 2025. Contact pools were identified per recruitment wave by screening
      electronic health records; individuals were mailed a personalized hardcopy invitation
      and sent an invitation email directing them into an online REDCap recruitment
      interface. The composition and size of each wave were influenced by observed
      participation characteristics of race/ethnicity, gender, T2DM severity and site, and
      were adjusted by under- and oversampling groups as recruitment progressed. Rather than
      targeting the demographic distribution of the US population, the study recruits four
      race/ethnic groups, four T2DM categories and both biological sexes in equal
      proportions. Within the released dataset, all enrolled participants for the covered
      period are included rather than a further sample of them.
    why_not_representative: >-
      Building balanced datasets was judged critical for the development of unbiased machine
      learning models, so the cohort is deliberately balanced across race/ethnicity, diabetes
      severity and biological sex rather than mirroring the demographic distribution of the
      US population. Participation is voluntary, so volunteer bias applies.
    source_data: >-
      Electronic health records of the University of Alabama at Birmingham, University of
      California San Diego and University of Washington health systems.
    source_caveats: >-
      The healthsheet answers "the dataset contains all possible instances" for the
      composition question and "N/A" for the sampling-strategy question, while the protocol
      and study description describe non-probability wave-based sampling from a defined study
      base. Both facts are recorded above; they describe different stages, recruitment into
      the study and inclusion in the release.

preprocessing_strategies:
  - preprocessing_details: >-
      All data were mapped to standardized terminologies and data models where possible,
      including the Observational Medical Outcomes Partnership Common Data Model for clinical
      data and DICOM for retinal imaging. Each CSV file in the clinical_data directory is a
      one-to-one mapping to an OMOP CDM table.
  - preprocessing_details: >-
      Device-native imaging exports were converted to DICOM for the dataset: Topcon Maestro2
      and Triton acquisitions from .fda format and Heidelberg FLIO acquisitions from .sdt
      format.
  - preprocessing_details: >-
      Garmin Vivosmart 5 data were exported in .FIT format and converted to the Open mHealth
      standard; Dexcom G6 data were provided as CSV and mapped to Open mHealth. ECG data were
      exported as XML and organized to the WaveForm DataBase standard. Environmental sensor
      data were organized to the NASA ASCII File Format Guidelines for Earth Science Data.
  - preprocessing_details: >-
      The whole dataset was organized according to the Clinical Dataset Structure (CDS)
      v0.1.1 specification, with per-directory manifest.tsv metadata files and root-level
      metadata files, and stored and shared through FAIRhub as AI-ready so that AI/ML
      research can begin without further reformatting and preprocessing.
  - preprocessing_details: >-
      The public release was processed to remove protected health information and,
      additionally, sex, race/ethnicity and medication information. Data may be statically
      watermarked to identify the licensee for security purposes.
  - preprocessing_details: >-
      Processing evolved across releases: version 1.0.0 pilot data were processed with custom
      or ad hoc methods, while year two and year three data used a combination of automated
      and custom processing.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the time of data entry and acquisition: clinical data outside
      expected minimum and maximum ranges were flagged in REDCap and appeared in reports
      viewed by clinical research coordinators and data managers, who examined participant
      records to determine whether an error was likely.
  - cleaning_details: >-
      Data were checked for credibility using range checks, for incorrect flow through
      prescribed skip patterns, for missing data that could be filled directly from other
      portions of an individual's record, and for the omission or duplication of records.
  - cleaning_details: >-
      Editing was performed only under the guidance and approval of the site principal
      investigator. Where corrected data were available elsewhere in the respondent's
      answers, the error was corrected; where there was no logical or appropriate way to
      correct the data, the site principal investigator reviewed the values and decided
      whether they should be removed.
  - cleaning_details: >-
      The data manager at each site was responsible for quality control of all data before
      upload to FAIRhub. The dataset has not undergone any formal external audit, but has
      been reviewed internally by AI-READI team members for quality checks and to ensure that
      no personally identifiable information was accidentally included. A dqd_omop.json file
      supports running the OMOP CDM Data Quality Dashboard, a set of more than 3,500 data
      quality checks, against the clinical data.

missing_data_documentation:
  - missing_data_patterns: >-
      Modality-level missingness: not all modalities are available for all participants.
      Item-level missingness in survey data from skipped questions and incomplete responses.
      Time-gap missingness in wearable activity data because the tracker required charging
      every two to three days.
    missing_data_causes: >-
      Participants electing not to take part in some study elements; data collection devices
      returning no stored results or being returned too late to retrieve results, for example
      because the battery died or data was lost; data collisions during processing; skipped
      survey questions; improper device use; technical failure or system malfunction; and,
      for imaging, participant non-cooperation and data transfer failures.
    handling_strategy: >-
      No imputation was applied and no instances were excluded at the time of preprocessing.
      Missing data that could be directly filled from other portions of an individual's
      record were filled during cleaning under site principal investigator approval.

raw_data_sources:
  - source_description: >-
      Device-native exports produced at the point of acquisition before standardization:
      electrocardiography as .xml, MoCA Duo application output as .csv (total score, section
      subscores, Memory Index Score and task completion times), Topcon retinal imaging as
      .fda, Heidelberg FLIO as .sdt, Garmin activity data as .FIT, and Dexcom continuous
      glucose data as .csv.
    source_type: instrument export
    raw_data_format: .xml, .csv, .fda, .sdt, .FIT and device-native DICOM
    access_details: >-
      Exported to local storage at each site and uploaded at regular intervals to FAIRhub.
      Raw data are saved and expected to be preserved by the project at least for the
      duration of the project but are not currently shared outside the project team, because
      they have not been mapped to standardized terminologies and may accidentally include
      personal health information in free-text fields. Raw data may be included in future
      releases of the controlled access dataset.
  - source_description: >-
      REDCap electronic data capture records for questionnaires and for clinical data
      recorded at the visit, including medications assessment, vitals, visual acuity,
      contrast sensitivity, monofilament test results and complete blood count results.
    source_type: electronic data capture system
    access_details: >-
      Held by the study team; the exact forms used for data collection in REDCap are
      published as a PDF in the dataset documentation.
  - source_description: >-
      Electronic health records of the three health systems, screened with ICD-10 codes and
      demographic fields to build recruitment contact pools and, for the controlled access
      set, to supply past health records.
    source_type: electronic health record
    access_details: >-
      Accessed by site study teams under IRB approval; past health records form part of the
      controlled access dataset rather than the public dataset.
  - source_description: >-
      Central laboratory results from the University of Washington Nutrition and Obesity
      Research Center and complete blood count results from CLIA-certified laboratories local
      to each site.
    source_type: clinical laboratory
    raw_data_format: .csv
  - source_description: >-
      Biospecimens banked at the University of Alabama at Birmingham Center for Clinical and
      Translational Science: plasma, serum, buffy coats, genomic DNA extracted from buffy
      coats, peripheral blood mononuclear cells, and PAXgene-stabilized RNA.
    source_type: biorepository
    access_details: >-
      Banked samples will eventually be available to scientists according to procedures and
      policies that were still in development at the time of the protocol publication; the
      biorepository holds a finite number of samples.

raw_sources:
  - raw_data_details: >-
      Raw, pre-standardization data are retained by the AI-READI project and are not
      distributed with this release.
    access_url: https://docs.aireadi.org

