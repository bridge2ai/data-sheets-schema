purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal
      dataset that enables future artificial intelligence and machine learning research to
      provide critical insights into type 2 diabetes mellitus, including salutogenic
      pathways back to health.
  - response: >-
      To assemble a hypothesis-agnostic, foundational dataset in T2DM that is independent of
      existing classification criteria and can be used to reconstruct a temporal atlas of
      T2DM development and reversal toward health.
  - response: >-
      To establish and disseminate standards, best practices and guidelines for the
      collection, preparation and sharing of data intended for AI/ML, so that the approach
      can serve as a model for future biomedical data generation projects.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training
      personnel at the intersection of biomedicine and artificial intelligence.

addressing_gaps:
  - response: >-
      A major barrier to AI in diabetes research has been the lack of well-designed,
      high-quality, large multimodal datasets that are AI ready for training models; the
      AI-READI dataset is intended to fill that gap.
  - response: >-
      Existing large T2DM datasets lack racial and ethnic diversity. A meta-epidemiological
      review of T2DM studies published from 2000 to 2020 found that samples lacked racial
      and ethnic diversity; the cohort is designed to be approximately balanced across
      Asian, Black, Hispanic and White participants.
  - response: >-
      Current understanding of T2DM in the context of salutogenesis, the pathway from
      disease back to health, is limited; the dataset includes participants across a range
      of health states to enable that line of research.
  - response: >-
      Downstream AI/ML analyses that are not feasible with existing data sources such as
      claims or electronic health record data are enabled by a purpose-built acquisition
      protocol spanning survey, physical, clinical, imaging and wearable device domains.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis to predict disease trajectories by learning
      from complex multimodal data across participants with differing disease severity, from
      normal to insulin-dependent T2DM.
  - response: >-
      Development of multimodal AI/ML models of type 2 diabetes pathogenesis and
      salutogenesis using data balanced for diabetes severity.
  - response: >-
      Reconstruction of a temporal atlas of T2DM development and reversal toward health.

instances:
  - id: doi:10.60775/fairhub.3#instance-participant
    instance_type: >-
      An individual human research participant, aged 40 years or older, with or without type
      2 diabetes mellitus, enrolled at one of three US study sites.
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with each data instance. The dataset is
      hypothesis agnostic and was assembled to support multiple potential downstream AI/ML
      applications rather than one predefined task.
    notes: >-
      Each instance consists of all data available for that participant across survey,
      clinical, laboratory, retinal imaging, electrocardiography, continuous glucose
      monitoring, wearable activity and home environmental sensing modalities. There is
      currently one study visit per participant. Version 1.0.0 contained 204 participants
      and version 2.0.0 contained 1,067.

