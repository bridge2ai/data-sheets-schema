splits:
  - split_details: >-
      The project provisions a sequestered holdout test set, accessible for external validation of
      models, intended to aid marketplace adoption of AI-developed models for implementation in
      acute and critical care.

acquisition_methods:
  - acquisition_details: >-
      Retrospective extraction of clinical data recorded during routine care at 14 contributing
      hospitals, including structured electronic health record data, imaging from PACS, telemetry
      waveforms from bedside monitors, and EEG from hospital EEG databases.
    was_directly_observed: true
  - acquisition_details: >-
      Derived data products, including clinical notes extracted and tokenized with the OHNLP
      toolkit, transformations applied to limit re-identification, and geocoding of OMOP Location
      entities to supply contextual factors such as geographic distance to the nearest hospital.
    was_inferred_derived: true
  - acquisition_details: >-
      Semantic mappings connecting source-format clinical data to international standards are
      validated; the chorus-mapping repository holds pooled tabular mappings and an associated
      clinical validation standard operating procedure, and standard operating procedures for data
      contribution undergo internal validation and review.
    was_validated_verified: true

collection_mechanisms:
  - mechanism_details: >-
      Extraction of structured electronic health record data from hospital systems and
      transformation into the OMOP Common Data Model.
  - mechanism_details: >-
      Extraction and tokenization of unstructured electronic health record text using the OHNLP
      toolkit.
  - mechanism_details: Retrieval of imaging studies from hospital PACS in DICOM format.
  - mechanism_details: >-
      Capture of telemetry waveforms from bedside monitors through gateway and middleware systems.
  - mechanism_details: Extraction of EEG waveforms from hospital EEG databases in EDF+ and Persyst formats.
  - mechanism_details: >-
      Site-facing tooling in the CHoRUS GitHub organization, including chorus-extract-upload for
      creating and uploading a CHoRUS Data Extract and dockerized container applications deployed to
      support CHoRUS services on Azure.

data_collectors:
  - collector_details: >-
      Fourteen of the 20 academic centers in the CHoRUS collaboration contribute as data acquisition
      centers, supplying multi-modal clinical data from their hospitals.
    role: Data contributing site
  - collector_details: >-
      Data managers at contributing sites extract and submit clinical data following the CHoRUS
      standard operating procedures, using an interactive workflow diagram that links to validated
      SOP documents, and provide regular status updates on their extraction and curation progress.
    role: Site data manager
  - collector_details: >-
      The CHoRUS Standards, Data Acquisition, and Tooling sub-teams support and review data
      contribution across the network.
    role: Coordinating sub-team

direct_collection:
  - is_direct: false
    collection_details: >-
      Data are collected retrospectively from clinical systems at the 14 contributing hospitals,
      rather than gathered directly from patients for research purposes.

collection_timeframes:
  - timeframe_details: >-
      Data collection is retrospective. As of August 2025 the assembled dataset covered 14 hospitals
      and the reported admission counts; the funded project period runs from 2022-09-01 to
      2026-11-30.
    source_caveats: >-
      The sources give the award period and coverage snapshots but do not state the calendar range
      of the clinical encounters represented in the data.

sampling_strategies:
  - is_sample: true
    strategies: >-
      Sampling across contributing hospitals is designed to ensure comprehensive sets of patient
      conditions and clinical treatment strategies, supported by a legal framework for collecting
      data at scale. Federated access is intended to enable sampling methods that ensure a balanced
      and diverse cohort.

raw_data_sources:
  - source_description: >-
      Structured electronic health record data recorded during routine hospital care, including
      demographics, medication administration, procedures, nursing flowsheets, and diagnoses.
    source_type: Hospital electronic health record system
    raw_data_format: Site-specific source formats, transformed to the OMOP Common Data Model
    access_details: Controlled access; standardized data are held in the CHoRUS cloud enclave.
  - source_description: Unstructured clinical notes documented by providers.
    source_type: Hospital electronic health record system
    raw_data_format: Free text, extracted and tokenized using the OHNLP toolkit
    access_details: >-
      Full note text remains stored locally at contributing sites; only tokens are held centrally
      under controlled access.
  - source_description: Radiology imaging studies.
    source_type: Hospital picture archiving and communication system (PACS)
    raw_data_format: DICOM
    access_details: Controlled access; de-identification in process for a larger imaging cohort.
  - source_description: Telemetry waveforms recorded by bedside monitors.
    source_type: Bedside monitors with gateway and middleware capture
    raw_data_format: WFDB
    access_details: Controlled access; telemetry is held in the cloud enclave.
  - source_description: Electroencephalography waveforms.
    source_type: Hospital EEG database
    raw_data_format: EDF+ and Persyst
    access_details: Controlled access; extraction was in process as of September 2025.
  - source_description: >-
      Contextual and social determinants of health information, including geographic factors such as
      distance to the nearest hospital.
    source_type: Contextual data linked to OMOP Location entities
    raw_data_format: OMOP Common Data Model Location entities enriched by geocoding

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of acquired clinical data to the OMOP Common Data Model, using ongoing and new
      standardization practices and validated semantic mappings that connect source formats to
      international standards.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured electronic health record text using the OHNLP
      toolkit, so that tokens rather than full note text are shared.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, together with
      tokenization of identifiers.
  - preprocessing_details: >-
      De-identification of imaging drawn from PACS, in process for the larger imaging cohort at the
      time of reporting.
  - preprocessing_details: >-
      Conversion and preparation of waveform data using the CHoRUS waveform conversion scripts and
      documentation.
  - preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss to supply contextual factors such as
      geographic distance to the nearest hospital and social determinants of health.

cleaning_strategies:
  - cleaning_details: >-
      Characterization reports are produced from each site data submission and returned to the
      contributing site, supporting review and correction of the submitted extract.
  - cleaning_details: >-
      Data contribution follows standard operating procedures that have undergone internal
      validation and review within the CHoRUS network, and submission issues are raised in
      context-specific Standards and Data Acquisition discussion forums for resolution.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is developed to label data with targets important
      for prediction; the project also builds capabilities across the multi-center network to
      acquire, standardize, tokenize, store, visualize, and label data.

distribution_formats:
  - format: OMOP Common Data Model relational tables
    notes: Held in the CHoRUS cloud enclave under controlled access.
  - format: DICOM imaging
  - format: WFDB waveform records
    notes: Telemetry waveforms are held in the cloud enclave under controlled access.
  - format: EDF+ and Persyst EEG records
  - format: OHNLP-tokenized clinical text

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is made available beyond the contributing consortium under controlled access.
      Access is expanded to trainees through the AIM-AHEAD Bridge2AI for Clinical Care Training
      Program, in which participants register, sign a licensing agreement, and are provisioned
      compute on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.

data_governance:
  access_review_process: >-
    Access to all nine data modalities is controlled. Within the AIM-AHEAD Bridge2AI for Clinical
    Care Training Program, participants complete a registration form giving name, email, and
    institution, and must sign a licensing agreement included in that form before gaining access; a
    ".edu" email address is required to gain access to the dataset, and program administrators
    assist with this access where needed. Once access is granted and compute is provisioned, an
    email is sent to the participant.
  accountable_organization:
    name: Massachusetts General Hospital
  stewardship_roles:
  - >-
    Data contributing sites curate and deliver interoperable extracts under CHoRUS standard
    operating procedures; the Standards, Data Acquisition, and Tooling sub-teams maintain the
    procedures, mappings, and tooling; project managers track task dependencies and per-site
    delivery status, with site status updates submitted through GitHub or a Google Form and
    reflected automatically in the Standards Project or Data Acquisition Project boards.
  notes: >-
    Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.

license_and_use_terms:
  license_terms: >-
    The dataset is controlled access rather than openly licensed: all participants must sign a
    licensing agreement before gaining access to the data. Software published by the CHoRUS GitHub
    organization is separately licensed, principally under the MIT License.
  contact_person:
    name: Jared Houghtaling
  notes: >-
    Access request contacts given by the CHoRUS GitHub organization: dbold@emory.edu or
    jared.houghtaling@tuftsmedicine.org.

ip_restrictions:
  restrictions:
  - >-
    The CHoRUS GitHub organization states that its project is licensed under the MIT License, and
    individual repositories carry MIT or Apache-2.0 licenses; these terms cover the CHoRUS software
    and documentation rather than the clinical dataset, which is released only under a signed
    licensing agreement with controlled access.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions:
  - >-
    The project establishes a legal framework for collecting data at scale and analyzes the existing
    legal and regulatory landscape, with patient-focused work determining the ethical and legal
    approaches to manage privacy and bias. Access to every data modality is controlled.

is_deidentified:
  method: >-
    Tokenization of unstructured electronic health record text using the OHNLP toolkit;
    de-identification of imaging drawn from PACS; transformation of data using approaches that limit
    re-identification.
  deidentification_details: >-
    Full clinical note text is retained locally at contributing sites and only tokens are shared
    centrally. Imaging de-identification was in process for a larger cohort as of September 2025,
    with 1,000 images then available. A privacy scan tool for medical records is maintained in the
    CHoRUS GitHub organization, alongside a CTP-deid repository.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      Structured clinical records of critically ill patients, including demographics, diagnoses,
      procedures, medication administration, and high-frequency nursing documentation.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Unstructured clinical notes, which are held locally at contributing sites and shared only as
      tokens.
  - sensitive_elements_present: true
    sensitivity_details: Radiology imaging studies drawn from hospital PACS.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Physiological waveform recordings from bedside monitors and hospital EEG databases.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Social determinants of health and geographically derived contextual factors, such as distance
      to the nearest hospital, obtained by geocoding OMOP Location entities.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Full clinical note text is not released into the enclave and remains stored locally at
      contributing sites; only tokens leave the site. Community-facing ethics focus groups are
      conducted to determine what data is appropriate for public sharing.

ethical_reviews:
  - review_details: >-
      Ethics is one of the three pillars of the project (Ethical and Trustworthy AI). The consortium
      performs community-facing ethics focus groups to determine what data is appropriate for public
      sharing, evaluates community perspectives on clinical care AI to increase trustworthiness of
      provenance and privacy, and analyzes the existing legal and regulatory landscape to develop
      new approaches.
    reviewing_organization: CHoRUS consortium ethics pillar
    source_caveats: >-
      The sources describe consortium-level ethics work and community engagement; they do not report
      an institutional review board determination or approval number for the dataset.

human_subject_research:
  involves_human_subjects: true
  special_populations:
  - >-
    Released admissions are drawn from adult, pediatric, and neonatal intensive care settings, so
    minors and neonates are represented alongside critically ill adults.
  notes: >-
    The data are clinical records of patients with acute or critical illness, acquired
    retrospectively; the NIH abstract describes an AI-ready dataset drawn from more than 100,000
    critically ill patients.

at_risk_populations:
  at_risk_groups_included: true
  special_protections:
  - >-
    Critically ill patients, including pediatric and neonatal intensive care patients, are
    represented. Protections described include controlled access to every modality, tokenization of
    unstructured text with full notes retained locally, imaging de-identification, transformations
    that limit re-identification, and community-facing ethics work determining what data is
    appropriate for sharing.
  source_caveats: >-
    The sources do not describe guardian consent or assent procedures for the pediatric and neonatal
    admissions represented in the data.

data_protection_impacts:
  - impact_details: >-
      Privacy risk is addressed by transforming data using approaches that limit re-identification,
      by tokenizing unstructured clinical text so that full notes remain at the contributing site,
      and by maintaining a privacy scan tool for medical records. Community-facing ethics focus
      groups inform which data are appropriate for public sharing, and the project frames its
      methods as promoting privacy, accountability, and clinical benefit.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Data are contributed by 14 hospitals drawn from a collaboration of 20 academic centers, so the
      cohort reflects the patient case mix and documentation practices of participating academic
      medical centers and of intensive care settings specifically.
    mitigation_strategy: >-
      Sampling is designed to ensure comprehensive sets of patient conditions and clinical treatment
      strategies, and federated access is intended to enable sampling methods that ensure a balanced
      and diverse cohort. Patient-focused ethical and legal work determines approaches to manage
      privacy and bias while accounting for social determinants of health.
    source_caveats: >-
      The sources describe diversity and bias management as project aims and design commitments;
      they do not report measured bias or representativeness statistics for the released data.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all nine modalities were equally available at the time of reporting: EEG extraction was in
      process, and imaging de-identification was in process for a larger cohort with 1,000 images
      then available.
    recommended_mitigation: >-
      Check the current modality availability before planning analyses that depend on EEG or large
      imaging cohorts.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Full clinical note text is not available in the enclave; notes are stored locally at
      contributing sites and only tokens are shared.
  - limitation_type: scope_limitation
    limitation_description: >-
      The released dataset is smaller than the anticipated final dataset: 50,000 admissions against
      an anticipated 100,000 patient admissions.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset covers admissions to intensive care settings (ICU, PICU, NICU) at 14 hospitals and
      is therefore specific to acute and critical illness rather than to general hospital or
      ambulatory care.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data collection is retrospective, so the dataset reflects clinical documentation and treatment
      practices as they were recorded at the contributing hospitals rather than prospectively
      designed measurements.

intended_uses:
  - use_category: Clinical prediction and characterization research
    usage_notes: >-
      Building machine learning and AI models that characterize acute and critical care illness,
      predict complications and deterioration, and measure treatment response.
  - use_category: External model validation
    usage_notes: >-
      Validating models against the sequestered holdout test set to support marketplace adoption of
      AI models for acute and critical care.
  - use_category: Training and workforce development
    usage_notes: >-
      Hands-on AI/ML training on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud,
      including canonical Jupyter Notebooks, the OHDSI tool stack, and the OHDSI/OMOP common data
      model, with trainees developing practical use cases.
  - use_category: Equity-aware clinical AI research
    usage_notes: >-
      Research that accounts for social determinants of health and contextual factors such as
      geographic distance to the nearest hospital, alongside clinical data.

existing_uses:
  - examples: >-
      As of the September 2025 program webinar, CHoRUS datasets were being used for training
      activities and publications.
  - examples: >-
      The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to CHoRUS data for
      up to 30 trainees per cohort, who apply AI/ML methods to big data analysis on the
      Collaborative Cloud and present works-in-progress posters at the Bridge2AI and AIM-AHEAD
      annual meetings.

other_tasks:
  - task_details: >-
      Trainees develop and present their own use cases suitable for application in Bridge2AI data
      topics, extending the dataset's application beyond the originally planned prediction and
      characterization tasks.

future_use_impacts:
  - impact_details: >-
      By sequestering holdout datasets for external validation, the dataset is expected to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care and
      to catalyze biomedical research on patient-focused deployment of AI.
  - impact_details: >-
      The project frames future use as requiring methods that promote privacy, accountability, and
      clinical benefit, with community perspectives evaluated to increase the trustworthiness of
      provenance and privacy in clinical care AI.

maintainers:
  - maintainer_details: >-
      Program management for the CHoRUS project is based at Massachusetts General Hospital; Ciera
      McCrary is listed as Program Manager and project contact (cmccrary@mgh.havard.edu).
    role: academic_institution
  - maintainer_details: >-
      The CHoRUS GitHub organization maintains 28 repositories of software, standard operating
      procedures, semantic mappings, and project management resources, with package versions,
      maintainers, and other metadata tracked on a package status page. Access requests are handled
      by contacts at Emory (dbold@emory.edu) and Tufts Medicine
      (jared.houghtaling@tuftsmedicine.org).
    role: academic_institution

updates:
  update_details: >-
    The dataset is being expanded from the current release toward an anticipated final dataset of
    100,000 patient admissions across nine data modalities from 14 contributing hospitals. EEG
    extraction and de-identification of a larger imaging cohort were in process as of September
    2025, and published metadata schemas were planned for some modalities. Contributing sites
    provide regular status updates on their extraction and curation progress, submitted through the
    GitHub interface or a Google Form that automatically updates status and issue information.

extension_mechanism:
  extension_details: >-
    Clinical collaborators can contribute to semantic mapping through the chorus-mapping repository,
    which holds documentation, pooled tabular mappings, and an associated clinical validation
    standard operating procedure. Data site managers raise issues encountered in creating or
    submitting an extract in the Standards or Data Acquisition discussion forums, and software
    contributors are supported by a web guide compiled in the chorus-developer repository.
  contribution_url: https://github.com/chorus-ai

external_resources:
  - external_resources: >-
      CHoRUS project website (https://chorus4ai.org/), covering the team, project overview, tools,
      data acquisition, standards, community engagement, ethics, dataset snapshot, and learning
      resources.
    archival: false
  - external_resources: >-
      CHoRUS for Equitable AI GitHub organization (https://github.com/chorus-ai), housing 28
