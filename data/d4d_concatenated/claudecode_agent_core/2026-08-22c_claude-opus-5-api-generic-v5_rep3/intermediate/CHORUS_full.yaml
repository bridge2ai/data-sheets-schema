id: https://chorus4ai.org/#chorus-dataset
name: CHoRUS Dataset
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards) is a multicenter,
  multimodal, high-resolution critical care dataset assembled by one of the four data generation
  projects of the NIH Common Fund Bridge2AI program. It brings together retrospectively collected
  clinical data from intensive care admissions at 14 contributing hospitals within a collaboration
  spanning 20 academic centers, standardized so that structured electronic health record data follow
  the OMOP Common Data Model, imaging follows DICOM, telemetry waveforms follow WFDB, EEG follows
  EDF+ and Persyst formats, and clinical notes are extracted and tokenized with the OHNLP toolkit.
  The currently released dataset is reported as 50,000 patient admissions from ICU, PICU, and NICU
  settings, 1.6 billion rows of OMOP electronic health record data, 7,642 admissions with radiology
  data, and 23 Tb of waveform data; the anticipated final dataset covers 100,000 patient admissions
  across nine data modalities. All nine modalities are held under controlled access. OMOP and
  telemetry data reside in a cloud enclave, while full clinical note text remains stored locally at
  contributing sites and only tokens are shared. A holdout test set is sequestered so that models
  can be externally validated, with the aim of aiding marketplace adoption of AI models for acute
  and critical care.
status: >-
  Under active assembly. A controlled-access dataset has been released while further work continues:
  EEG extraction and imaging de-identification for a larger cohort were in process as of the
  September 2025 program webinar, and the anticipated final dataset is larger than the current
  release.
page: https://chorus4ai.org/
created_by: CHoRUS Consortium
is_tabular: false
was_derived_from: >-
  Electronic health records, PACS imaging archives, bedside monitor telemetry (via gateway and
  middleware), and hospital EEG databases at the 14 CHoRUS data acquisition hospitals.
conforms_to: >-
  Structured clinical data are standardized to the OMOP Common Data Model (with schema extensions
  for high-frequency nursing flowsheet documentation); imaging follows DICOM; telemetry waveforms
  follow WFDB with a published metadata schema described as an extended PhysioNet schema; EEG uses
  the EDF+ and Persyst formats; clinical notes are extracted and tokenized using the OHNLP open
  source schema.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - AI-ready dataset
  - multimodal clinical data
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - electronic health records
  - social determinants of health
  - Bridge2AI

