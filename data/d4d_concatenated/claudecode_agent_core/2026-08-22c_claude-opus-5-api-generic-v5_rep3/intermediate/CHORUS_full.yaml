funders:
  - grantor: National Institutes of Health (NIH) Common Fund, Bridge2AI program
    notes: >-
      Award OT2OD032701 (project number 1OT2OD032701-01, NIH RePORTER application ID 10472824),
      awarded to Massachusetts General Hospital. Fiscal year 2022 award amount 5,880,300 USD.
      Project period 2022-09-01 to 2026-11-30. The project website states that the content it
      publishes is solely the responsibility of the authors and does not necessarily represent the
      official views of the NIH.

purposes:
  - response: >-
      To generate an AI-ready critical care dataset for machine learning and artificial intelligence
      applications aimed at characterizing acute and critical care illness, predicting
      complications, and measuring treatment response among patients with acute or critical illness.
  - response: >-
      To develop the most diverse, high-resolution, ethically sourced, AI-ready dataset to answer the
      grand challenge of improving recovery from acute illness.
  - response: >-
      To provision a holdout test set accessible for external validation of models, aiding
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      To develop the network, tools, standards, data, and education needed to build machine learning
      and AI-derived models that improve the care and outcomes of patients requiring critical care,
      and to create best practices for AI in health.
  - response: >-
      To support education and workforce development, cultivating expertise in the lay and
      scientific community and training a new generation of AI clinicians and scientists.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center datasets is a critical
      first step toward actionable and trustworthy AI.
  - response: >-
      Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready dataset for
      acute and critical illness that harmonizes multi-modal EHR, waveform, imaging, and text data
      under unified standards.
  - response: >-
      Sequestered holdout datasets for external validation of models have been unavailable, limiting
      marketplace adoption of AI models in acute and critical care.
  - response: >-
      Contextual factors relevant to equity, such as social determinants of health and geographic
      distance to the nearest hospital, are commonly absent from clinical datasets.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among critically ill patients.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of AI and machine learning models against a sequestered holdout test set.
  - response: >-
      Labeling data with prediction targets using a visualization and annotation environment.

instances:
  - instance_type: >-
      Patient admission to an intensive care unit (ICU), pediatric intensive care unit (PICU), or
      neonatal intensive care unit (NICU)
    counts: 50000
    data_topic: B2AI_TOPIC:4
    source_caveats: >-
      The project documentation (chorus4ai.org) reports 50,000 admissions in the current released
      dataset; the cohort 2 informational webinar states that as of August 2025 the dataset covered
      14 hospitals with over 45,000 unique admissions. The higher-ranked project documentation value
      is stated here. The anticipated final dataset is 100,000 patient admissions.
  - instance_type: Row of standardized electronic health record data in the OMOP Common Data Model
    counts: 1600000000
    data_topic: B2AI_TOPIC:9
  - instance_type: Patient admission with associated radiology imaging
    counts: 7642
    data_substrate: B2AI_SUBSTRATE:11
    data_topic: B2AI_TOPIC:15
    source_caveats: >-
      The project documentation reports 7,642 admissions with radiology data in the current released
      dataset; the cohort 2 webinar separately states that 1,000 images were available with
      de-identification in process for a larger cohort. The two figures count different things
      (admissions versus images) and were reported by different sources.
  - instance_type: Bedside monitor telemetry waveform recording
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:37
    notes: >-
      The current released dataset is reported as containing 23 Tb of waveform data. Telemetry is
      held in the cloud enclave.
  - instance_type: Hospital EEG waveform recording
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:37
    notes: EEG extraction was in process as of the September 2025 program webinar.
  - instance_type: Clinical note extracted and tokenized with the OHNLP toolkit
    data_substrate: B2AI_SUBSTRATE:43
    data_topic: B2AI_TOPIC:32
    notes: >-
      Full clinical note text is stored locally at contributing sites; only tokens are held
      centrally.

