    archival: false

notes: >-
  The CHoRUS project website carried the banner "This repoitory is under review for potential
  modification in compliance with Administration directives." at the time the source documentation
  was captured (quoted as written, including the typographical error).

source_caveats: >-
  Referent: this record describes the CHoRUS clinical care dataset, not the CHoRUS software
  repositories or the AIM-AHEAD Bridge2AI for Clinical Care Training Program, both of which appear
  in the bundle and are recorded only where they bear on the dataset. Source disagreements: the
  project documentation (tier 2, chorus4ai.org) reports 50,000 released patient admissions while the
  cohort 2 webinar (tier 4) reports over 45,000 unique admissions as of August 2025; the
  higher-ranked project documentation value is stated, with the webinar value recorded alongside it.
  The two sources also report imaging availability differently (7,642 admissions with radiology data
  versus 1,000 images available with de-identification in process); these count different units and
  both are recorded. The webinar's modality table was garbled in text extraction: the data type and
  data standard columns are recoverable and all rows are listed under controlled access, but the
  per-row alignment of the "Metadata" (Yes/Planned) and "Published metadata schema" columns could
  not be reliably reconstructed, so per-modality metadata status is not asserted; the "OMOP schema
  with extensions" entry is attributed to nursing flowsheets on the basis of column order only.
  Creators: NIH RePORTER names Eric S. Rosenthal as principal investigator on award OT2OD032701; the
  other five people listed here appear on the webinar's "Bridge2AI CHoRUS Leadership Team" slide,
  and are recorded in the Creator class's only person-valued field because the schema provides no
  other slot for a named creator. No personal or organizational registry identifiers are stated in
  the sources, so none are supplied. The project contact email is transcribed exactly as published
  on chorus4ai.org (cmccrary@mgh.havard.edu), which appears to contain a typographical error in the
  domain. The MIT License statement applies to the CHoRUS GitHub project rather than to the dataset,
  which is controlled access under a signed licensing agreement.