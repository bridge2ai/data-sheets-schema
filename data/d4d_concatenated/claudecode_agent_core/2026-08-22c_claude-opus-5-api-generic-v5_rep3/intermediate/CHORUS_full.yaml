      project management overviews.
    archival: false
  - external_resources: >-
      Bridge2AI program page for the project (www.bridge2ai.org/chorus), given as the project website
      in the GitHub organization contact section.
    archival: false
  - external_resources: >-
      NIH RePORTER record for award OT2OD032701
      (https://reporter.nih.gov/project-details/10472824).
    archival: false
  - external_resources: >-
      AIM-AHEAD Bridge2AI for Clinical Care Training Program cohort 2 informational webinar,
