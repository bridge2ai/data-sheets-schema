description: >-
  Bridge2AI-Voice is a flagship, ethically sourced voice dataset linking voice, speech, breathing
  and cough recordings to detailed health information, generated by the Precision Public Health
  grand challenge of the NIH Common Fund Bridge2AI program. Version 3.1.0 covers 833 adult
  participants recruited at five sites in North America across five disease cohort categories -
  voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders,
  respiratory disorders, and controls - selected because voice changes have been associated with
  those conditions and because those conditions carry well-recognized unmet needs. Data was
  collected in the United States and Canada. Participants completed a standardized protocol of
  acoustic tasks together with demographic questions, questions about known acoustic confounders
  such as smoking and hydration status, disease-specific clinical items, and validated
  questionnaires; diagnoses were validated by clinicians against gold standards such as
  laryngoscopy and stroboscopy, brain imaging, spirometry and flow volume loops, electronic health
  record review, or an active prescription. The public release contains derived audio features
  rather than raw waveforms: spectrograms, Mel spectrograms, Mel-frequency cepstral coefficients,
  pitch contours, articulatory (SPARC) traces, phonetic posteriorgrams, and static openSMILE, Praat
  and torchaudio features, distributed as Apache Parquet alongside tab-delimited phenotype tables,
  recording-level metadata and JSON data dictionaries. Raw audio is retained but disseminated only
  under controlled access. The study is an observational cohort study with a cross-sectional time
  perspective and non-probability sampling; the study metadata published against version 2.0.0
  gives adult eligibility as 18 to 120 years of age, all sexes, able to read and speak English,
  with healthy volunteers accepted, and the consortium anticipated enrolling 10,000 participants by
  2027. The consortium is co-led by Yael Bensoussan (University of South Florida) and Olivier
  Elemento (Weill Cornell Medicine) as co-principal investigators, with lead investigators
  including Alexandros Sigaras and Anais Rameau (Weill Cornell Medicine), Maria Powell (Vanderbilt
  University Medical Center), Ruth Bahr (University of South Florida), Jennifer Siu and Alistair
  Johnson (Hospital for Sick Children), Philip Payne (Washington University in St. Louis), David
  Dorr (Oregon Health & Science University), Jean-Christophe Belisle-Pipon (Simon Fraser
  University), Vardit Ravitsky (The Hastings Center), Satrajit Ghosh (Massachusetts Institute of
  Technology), Frank Rudzicz (University of Toronto), Jordan Lerner-Ellis (Sinai Health) and
  Donald Bolser (University of Florida).

notes: >-
  The consortium published a self-assessment of this dataset against the Bridge2AI AI-readiness
  criteria, scoring FAIRness 100% (findable, accessible, interoperable and reusable criteria all
  met), Provenance 100% (transparent, traceable, interpretable, key actors identified),
  Characterization 80% (semantics, statistics, standards and potential sources of bias met; the
