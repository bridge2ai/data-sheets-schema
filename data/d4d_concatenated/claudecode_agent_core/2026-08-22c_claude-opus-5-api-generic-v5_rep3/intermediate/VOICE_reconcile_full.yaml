  secure), Sustainability 50% (persistent and well-governed met; domain-appropriate and associated
  criteria not met), and Computability 75% (standardized, computationally accessible and portable
  met; contextualized not met).

source_caveats: >-
  This record takes the Bridge2AI-Voice adult flagship dataset published on PhysioNet as its
  referent, at the latest version stated in the bundle (3.1.0, published 1 May 2026); the
  companion Bridge2AI-Voice Pediatric Dataset is recorded under related_datasets rather than
  merged in. The record `id` is the version 3.1.0 DOI rather than the concept DOI
  (doi:10.13026/37yb-1t42, recorded under version_access.latest_version_doi), so it pins the record
  to a fixed release even though the dataset is updated semi-annually. Several sources disagree. On
  participant and recording counts, the project documentation (tier 2) states version 3.0 contains
  approximately 61,937 voice-derived recordings from 833 adult participants, while the PhysioNet
  3.0.0 and 3.1.0 releases (tier 1) give per-feature record counts ranging from 23,533 to 32,522
  and no single aggregate; the tier-1 per-feature counts are used here. On hosting, the project
  documentation states the dataset is hosted by the Health Data Nexus platform maintained by the
  Temerty Centre for Artificial Intelligence Research and Education in Medicine at the University
  of Toronto, and that version 1.0 was published there in November 2024; the tier-1 PhysioNet
  releases show versions 1.1 through 3.1.0 hosted on PhysioNet and maintained by the MIT Laboratory
  for Computational Physiology, and that is preferred. On names, the project documentation writes
  "Jennifer Sui" and "Frank Rudzizc" where the PhysioNet author lists write "Jennifer Siu" and
  "Frank Rudzicz"; the tier-1 spellings are used. The IRB protocol lists Frank Rudzicz at Dalhousie
  University while the documentation and the feasibility publication place him at the University of
  Toronto. The award identifier appears variously as OT2OD032720, OT2 OD032720, 3OT2OD032720-01S1
  (PhysioNet acknowledgements), 3OT2OD032720-01S3 (NIH RePORTER application 11376382), and in two
  evidently corrupted forms in the project documentation ("3TF-OT2ActfOD032720Projectf01S1" and
  "Award #3Tf-OTOD03272001S2"). Study metadata on the documentation site is written against version
  2.0.0 and states the dataset contains only adult populations, which no longer holds for the
  separately released pediatric cohort; the eligibility bounds of 18 to 120 years quoted in the
  description come from that v2.0.0-era metadata, which itself notes that eligibility criteria
  would be updated when a pediatric cohort was introduced. The bundle states five recording sites
  and separately states that collection took place in the USA and Canada, but does not state how
  the five sites distribute across the two countries. Three slots in this record -
  data_protection_impacts, cleaning_strategies and confidential_elements - are populated with
  material the project documentation answers negatively or does not label as such; each carries its
  own caveat explaining what the source actually says.

