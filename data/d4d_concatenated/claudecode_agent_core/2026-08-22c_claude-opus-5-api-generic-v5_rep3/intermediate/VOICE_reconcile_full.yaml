purposes:
  - response: >-
      To create an ethically sourced flagship dataset that enables future research in artificial
      intelligence and supports critical insights into the use of voice as a biomarker of health.
  - response: >-
      To generate a large multi-institutional, ethically sourced and diverse voice dataset linked
      to multimodal health biomarkers to fuel voice AI research and to build predictive models
      that assist in the screening, diagnosis and treatment of a broad range of diseases.
  - response: >-
      To enable the development, benchmarking or validation of clinically applicable
      machine-learning models for diagnosing a wide range of health conditions using voice data,
      including vocal pathologies and neurological, psychiatric, respiratory and pediatric voice
      disorders.
  - response: >-
      To introduce the field of acoustic biomarkers by developing new standards of acoustic and
      voice data collection and analysis for voice AI research, and to create new bioinformatics
      standards that make voice data interoperable.
  - response: >-
      To develop and disseminate ethical, legal and normative guidance for voice data generation,
      consent, sharing and utilization in the context of voice AI technology, and to create safe
      infrastructures for disseminating ethically sourced data to future generations of voice AI
      researchers.

addressing_gaps:
  - response: >-
      Previous studies on machine learning-based voice diagnosis produced promising results, but
      their sample sizes were too small or they lacked the key metadata needed for training robust,
      clinically useful models. Current literature has been studied only on small to medium-sized
      datasets with limited data outside acoustic measures and not linked to multi-modal health
      data.
  - response: >-
      Comparing studies and pooling data is challenging because of a lack of existing standards in
      how voice and other acoustics are measured and collected, which precludes meta-analysis and
      limits external validity.
  - response: >-
      Industry holds vast amounts of voice data from users but lacks access to accurate clinical
      data or demographic information. Industry datasets are often private, which limits the
      ability to audit machine learning models, to check the accuracy of training data labels, and
      to verify fair representation of diverse populations.
  - response: >-
      There is a lack of prospective study and validation of AI algorithms in audiomics on
      external datasets, and the limited size, quality and diversity of existing open-source
      datasets likely explains the absence of validated, US Food and Drug Administration-approved
      AI algorithms for disease detection and monitoring in this space.

tasks:
  - response: >-
      Disease detection and classification from voice data, with labels drawn from diagnostic
      categories including vocal pathologies, neurological disorders, psychiatric conditions and
      respiratory disorders.
  - response: >-
      Screening, diagnosis and monitoring of health conditions using voice as a non-invasive,
      low-cost biomarker, including remote monitoring and the development of new digital endpoints
      for clinical trials.
  - response: >-
      Pretraining, fine-tuning, benchmarking or validation of machine-learning and artificial
      intelligence models on voice and speech data linked to health information.

intended_uses:
  - use_category: research
    usage_notes: >-
      The dataset is intended solely for commercial and non-commercial research purposes by
      Authorized Researchers who have signed the applicable access agreement. It is intended to
      support research that prioritizes patient safety, privacy and ethical use.
    examples:
      - Developing, benchmarking or validating clinically applicable machine-learning models for
        diagnosing health conditions from voice
      - Studying voice, speech and respiratory sound biomarkers of laryngeal, neurological,
        psychiatric and respiratory disease
      - Cohort selection using the phenotype tables for downstream acoustic analyses
      - Methodological work on acoustic feature extraction, standards and AI readiness for voice
        data
  - use_category: education and training
    usage_notes: >-
      Training opportunities for using the dataset are offered by the Bridge2AI-Voice scholars
      program.
    examples:
      - Bridge2AI Summer School and hackathon, which used a restricted version of the dataset
        containing raw audio

prohibited_uses:
  - prohibition_reason: >-
      The dataset is not to be used to attempt to re-identify research participants, nor for any
      actions that could reasonably lead to re-identification. Recipients will not use the data,
      either alone or in concert with any other information, to make any effort to contact
      individuals who are the subjects of the data without appropriate institutional review board
      approval, specific written approval from the provider, and informed consent from the
      individual where required.
  - prohibition_reason: >-
      The dataset is not to be used for any purpose that could foreseeably cause harm or
      stigmatization to research participants, their families, communities, or specific
      populations.
  - prohibition_reason: >-
      Intellectual property protections, database rights or related rights may not be used in a
      manner that restricts or limits access to any part of the dataset or to any conclusions
      derived from it. This restriction ensures that future use of the dataset remains
      unrestricted, in alignment with the Open Science principles upheld by the consortium.
  - prohibition_reason: >-
      Sale of all or part of the data on any media is not permitted, and recipients may not
      disclose, release, sell, rent, lease, loan or otherwise grant access to the data to any third
      party other than Authorized Persons without prior written consent of the provider.
      Collaborators at other research organizations, and other research teams at the same
      organization, must apply independently for access and sign their own Data Transfer and Use
      Agreement.

discouraged_uses:
  - discouragement_details: >-
      The dataset should not be used for non-research applications such as hiring decisions,
      insurance premium adjustments, or any form of surveillance that could lead to discrimination
      or harm. These limitations are intended to prevent unethical or biased outcomes that could
      negatively impact individuals on the basis of their health conditions or voice
      characteristics.

existing_uses:
  - examples:
      - A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer
        School and hackathon.

future_use_impacts:
  - impact_details: >-
      The dataset has skews based on disorder category, site and other demographic factors. Users
      should consider the multivariate distribution when assessing utility for different research
      questions, and should be aware that composition, collection, preprocessing and labeling
      choices could otherwise lead to unfair treatment of individuals or groups, including
      stereotyping and quality of service issues.
  - impact_details: >-
      Any new labels or task definitions derived from the dataset should be described alongside
      the release of a model or publication, including the exact variables used for the
      determination.

instances:
  - instance_type: Human research participant enrolled in one of five disease cohort categories
    counts: 833
    data_topic: B2AI_TOPIC:36
    label: true
    label_description: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each site a
      local clinician provided the diagnosis based on a clinical interview and appropriate
      work-up. For the psychiatric disorders cohort the assessment was determined using the
      participant's electronic health record or an active prescription, done outside of data
      collection by an appropriately licensed clinician.
    notes: >-
      Because some participants required more than one session to complete data collection, a
      participant may appear in more than one session and therefore in more than one row of some
      data files.
  - instance_type: >-
      Audio recording of a single acoustic task, released as derived feature tensors rather than as
      the raw waveform
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:36
    notes: >-
      Version 3.1.0 releases 29,278 spectrogram, Mel spectrogram and MFCC records; 32,522
      torchaudio pitch records; 28,640 SPARC electromagnetic articulography records; 31,855 SPARC
      loudness records; 31,872 SPARC periodicity and pitch records; and 29,289 phonetic
      posteriorgram records. Counts differ between features because features for sensitive records
      and audio checks were removed, and because some files could not generate certain features.
      The released instances are Waveform Data derivations packaged in Apache Parquet; the
      packaging format is recorded under distribution_formats rather than as the instance
      substrate.
  - instance_type: >-
      Participant questionnaire and clinical record, covering demographics, acoustic confounders,
      eligibility and enrollment, disease-specific diagnosis forms, and validated questionnaires
    data_substrate: B2AI_SUBSTRATE:80
    data_topic: B2AI_TOPIC:31

relationships:
  - relationship_details: >-
      Individual participants are unrelated to one another. Within the dataset, recordings and
      derived features are linked to the person who produced them through a participant
      identifier and to the encounter through a session identifier, and phenotype records are
      linked to the same participant identifier; a participant may have more than one session.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      The dataset identifies demographic sub-populations by age, gender, sex, ethnicity and
      socioeconomic status.
    distribution: >-
      Detailed demographic data collected through the application include age, sex at birth,
      gender identity, race and ethnicity, and languages spoken, together with education level and
      employment status; select geographic or demographic identifiers were removed during
      de-identification where they created a significant risk of re-identification.
  - subpopulation_elements_present: true
    identification: >-
      Participants are grouped into five disease cohort categories - voice disorders, neurological
      and neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and
      controls - with membership determined by per-cohort inclusion and exclusion criteria and
      confirmed by gold standard clinical validation.
    distribution: >-
      The public data releases do not contain an equal distribution of the disease cohort
      categories, and further releases are expected to contain additional data.

subsets:
  - id: doi:10.13026/8xbn-nq66#cohort-voice-disorders
    name: Voice disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with laryngeal and voice pathology, comprising laryngeal cancer, laryngitis,
      pre-cancerous lesions such as keratosis and leukoplakia, benign lesions of the vocal fold
      such as nodules, polyps, cysts, Reinke's edema and recurrent respiratory papilloma, muscle
      tension dysphonia, laryngeal dystonia including adductor and abductor forms and vocal tremor,
      unilateral vocal fold paralysis, and glottic insufficiency or presbyphonia. Diagnoses are
      validated against laryngoscopy images and stroboscopy videos, and for vocal fold paralysis
      also against CT and spirometry.
  - id: doi:10.13026/8xbn-nq66#cohort-respiratory
    name: Respiratory disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with airway stenosis, including bilateral vocal fold paralysis and supraglottic,
      glottic, posterior glottic, subglottic, tracheal and multi-level upper airway stenosis; with
      unexplained chronic cough, defined as a bothersome cough lasting more than eight weeks after
      exclusion of other causes; and with chronic obstructive pulmonary disease and asthma.
      Diagnoses are validated against spirometry and flow volume loops and CT of the neck and
      chest.
  - id: doi:10.13026/8xbn-nq66#cohort-neurological
    name: Neurological and neurodegenerative disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants aged over 44 and under 85 with mild cognitive impairment, Alzheimer's disease,
      other dementias including frontotemporal, Lewy body, vascular, mixed and alcohol-induced
      dementia, amyotrophic lateral sclerosis, or Parkinson's disease and related parkinsonian
      syndromes. Diagnoses are validated against brain CT, brain MRI, whole genome sequencing and,
      for Alzheimer's disease, serum phosphorylated tau markers.
  - id: doi:10.13026/8xbn-nq66#cohort-mood-psychiatric
    name: Mood and psychiatric disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with an existing clinical diagnosis of depression or major depressive disorder,
      anxiety disorder, or bipolar I or II disorder, and participants with conditions co-morbid
      with those diagnoses including alcohol or substance use disorder, ADHD, autism spectrum
      disorder, borderline personality disorder, eating disorder, insomnia or sleep disorder,
      obsessive-compulsive disorder, panic disorder, post-traumatic stress disorder, schizophrenia
      and social anxiety disorder. Diagnoses are validated against an electronic health summary, a
      clinical diagnosis from a psychiatrist, or medication history.
  - id: doi:10.13026/8xbn-nq66#cohort-controls
    name: Controls
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, mood or neurological disorder
      affecting voice, cough, breath or speech, enrolled to serve as controls. Healthy volunteers
      are accepted under the study eligibility criteria.

anomalies:
  - anomaly_details: >-
      Different sites have different collection configurations, and the collection protocol changed
      over the course of the study. Distinct iPad devices were used at each site.
  - anomaly_details: >-
      Recordings were made with a head-mounted headset with a microphone that could be at slightly
      different distances from the speaker, and noise artifacts are present in the audio.
  - anomaly_details: >-
      Certain aspects of the data, for example transcription, were generated using off-the-shelf
      models that have not been audited for correctness.
  - anomaly_details: >-
      Some audio files, whether due to length or other issues, could not generate certain features
      and are therefore absent from the corresponding bundled feature files, which is why record
      counts differ between feature types.
  - anomaly_details: >-
      Inaccurate questionnaire responses and underreporting are possible confounders, alongside
      variations in diagnostic practices between sites and clinicians.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample of a larger, ongoing collection and is not representative, because it
      was collected at a limited number of geographic locations. The sampling method is a
      non-probability sample drawn from high volume expert clinics.
    recommended_mitigation: >-
      The consortium intends to make the dataset more representative by shifting to remote
      collection and by designing the recruiting approach to control for more variables.
    scope_impact: >-
      Limits the generalizability of models trained on the dataset to populations, sites and
      recruitment settings not represented.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Communication with study participants and the collection protocol are in English only.
      Participants who do not read or speak English were excluded. Spanish versions of the protocol
      are under development and Spanish data collection is planned for future releases.
  - limitation_type: scope_limitation
    limitation_description: >-
      The published release contains derived features rather than raw audio. Spectrograms, Mel
      spectrograms, Mel-frequency cepstral coefficients, phonetic posteriorgrams and
      electromagnetic articulography estimates for sensitive records and audio checks were removed,
      and all such features and transcriptions from open-response and free-speech prompts were
      excluded. Static and other features that do not encode sensitive information were retained.
    recommended_mitigation: >-
      Researchers who require the raw waveforms can apply for controlled access through the Data
      Access Compliance Office.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Clinical diagnosis, depending on the disorder, was performed by a single clinician or was
      based on an electronic health record entry or a prescription rather than a study-specific
      assessment. Human-level performance on the applications the dataset is meant to address
      varies widely.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Changes in diagnostic criteria or practices over the collection period could be a source of
      distribution shift.
  - limitation_type: integration_limitation
    limitation_description: >-
      Multimodal data other than acoustic and questionnaire data - imaging, genomic data for the
      neurological cohort, laryngoscopy imaging and other electronic health record data - is
      extracted at each site independently and uploaded through the REDCap database, and no such
      external data was released in the version 3.0.0 release.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Groups that have less trust in the medical system or in artificial intelligence, or that are
      less proximal to the collection sites, would have been less likely to be recruited.
    mitigation_strategy: >-
      The consortium planned recruitment through community outreach clinics representing
      underserved populations and a Plan for Enhancing Diverse Perspectives, and aims to create
      benchmarks of diversity metrics to minimize the risk of algorithmic bias.
  - bias_type: sampling_bias
    bias_description: >-
      Participants were recruited by non-probability sampling from high volume expert clinics -
      outpatient clinics within hospital systems or academic institutions with recognized
      expertise in a disease area seeing more than 50 patients per month from that disease
      category - rather than from a general population.
  - bias_type: representation_bias
    bias_description: >-
      The dataset has skews based on disorder category, site and other demographic factors, and the
      public releases do not contain an equal distribution of the five disease cohort categories.
    affected_subsets:
      - >-
        All five disease cohort categories, and demographic subgroups defined by age, gender, sex,
        ethnicity and socioeconomic status.
  - bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders based on site, so participants with
      different labels also had their data collected with different devices and under different
      site configurations, confounding disorder category with recording apparatus.
  - bias_type: annotation_bias
    bias_description: >-
      A single labeler provided the diagnostic label for each participant, typically the clinician
      at the site of data collection or a clinician external to the study who made a prior
      diagnostic assessment, and the basis for the label varied by cohort between clinical
      interview with work-up, electronic health record review, and an active prescription.

content_warnings:
  - content_warnings_present: true
    warnings:
      - >-
        Transcriptions of free speech tasks may contain material that is offensive, insulting,
        threatening, or that otherwise poses a psychological safety or anxiety risk; while the
        inclusion of such content is unlikely it cannot be completely avoided, because research
        participants are responsible for their choice of language.
      - >-
        Phenotype content includes questionnaire responses on depression, anxiety, post-traumatic
        stress and other psychiatric symptoms, which some users may find distressing.
    source_caveats: >-
      The warning about free speech transcription is stated in the project documentation
      healthsheet. From version 3.0.0 onward, transcriptions and dense features derived from
      open-response and free-speech prompts were removed from the feature-only release.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes data considered sensitive: race and ethnic origin, sexual orientation,
      and socioeconomic and health information. Voice itself is a biometric characteristic unique
      to the individual.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Non-identifying elements of data that revealed highly sensitive information - household
      income, mental health status, traumatic life experiences and the like - were removed before
      release, as were all fields encoded as sensitive in the REDCap data dictionary.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The project documentation states that the dataset does not contain data that might be
      considered confidential, such as data protected by legal privilege or doctor-patient
      confidentiality or the content of individuals' non-public communications.
    source_caveats: >-
      This boolean records the project documentation's own answer and should be read against
      evidence pointing the other way. The same documentation withholds all raw voice recordings
      from the registered access release on the grounds that they could cause individual
      re-identification or be used for illicit or unauthorized purposes, and the data transfer
      agreement records that the data is covered by a Certificate of Confidentiality that must be
      asserted against compulsory legal demands such as court orders and subpoenas. The false value
      and this caveat pull in opposite directions.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor de-identification combined with removal of selected indirect identifiers and
    of highly sensitive non-identifying elements, review of raw audio transcripts, and withholding
    of raw voice waveforms from the registered-access release.
  identifiers_removed:
    - Names
    - Civic addresses and other geographic locators, including state and province; country of data
      collection was retained
    - Date information at a resolution finer than years
    - Phone and fax numbers, email addresses and IP addresses
    - Social Security numbers, medical record numbers, health plan beneficiary numbers, account
      numbers, license numbers and other unique identifiers
    - Device identifiers, vehicle identifiers and website URLs
    - Full face photographs and biometric identifiers
    - Narrative text fields, including transcripts of free speech audio
    - Selected geographic and demographic identifiers, and information about household composition
      or cultural identity, where their combination with public data created a significant
      re-identification risk
    - All raw voice recordings
  deidentification_details: >-
    Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive,
    has been removed. Direct identifiers were removed because they would reveal the identity of the
    research participant. Indirect identifiers were removed where they created a significant risk
    of re-identification, for example through combination with other public data available on social
    media, in government registries or elsewhere. Dates are rebased or replaced by integers and
    geographic information is removed or generalized. Raw audio transcripts were reviewed and any
    recordings containing potentially identifying information or external voices were removed from
    the release. K-anonymization with k of two or greater is not achieved.

participant_privacy:
  - anonymization_method: >-
      Direct identifier removal, HIPAA Safe Harbor de-identification, removal of selected indirect
      identifiers and of highly sensitive non-identifying data elements, and exclusion of raw
      waveforms and of dense features derived from open-response prompts.
    privacy_techniques:
      - Pseudonymous study identification numbers assigned at enrollment, with the linking
        datasheets held locally at each institution rather than shared
      - Two-tier dissemination, with low-risk derived features under registered access and raw
        audio under controlled access
      - Federated learning, so that models can be trained across institutions without the data
        leaving each institution
      - Storage of collected data on HIPAA-compliant infrastructure provided by NIH STRIDES
        partners, with transfer over a secure HTTPS protocol
      - Individual usernames and passwords for REDCap and the secure cloud server, with access
        limited to authorized study personnel who have completed HIPAA and privacy training
    data_linkage: >-
      Participants who consent permit investigators to access medical information through
      electronic health record platforms in order to perform gold standard validation of diagnoses
      and symptoms. Within the released dataset, records are linked only through participant and
      session identifiers.
    reidentification_risk: >-
      Raw voice data was removed because it has the potential to cause individual re-identification
      or to be used for illicit or unauthorized purposes. K-anonymization with k of two or greater
      is not achieved. Even when all HIPAA-protected information associated with a participant is
      removed, each person's voice is unique to them and to their health at that point in life, so
      it is always possible, even if unlikely, that someone could recognize a participant's voice.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: >-
    University of South Florida Institutional Review Board, acting as the single IRB for United
    States sites, with subsite IRBs approved through the single IRB process. Canadian institutions -
    Mount Sinai Hospital, the Hospital for Sick Children and the University of Toronto - do not
    follow the single IRB process and applied for separate Research Ethics Board approval in
    compliance with Canadian regulations.
  irb_approval:
    - >-
      Data collection and sharing was approved by the University of South Florida Institutional
      Review Board. The clinical study was submitted to and approved by the USF single IRB and by
      subsite IRBs through the single IRB process.
  regulatory_compliance:
    - >-
      Identifiable information under HIPAA and the Common Rule was removed before release and the
      HIPAA de-identification rules were applied. The data is covered by a Certificate of
      Confidentiality. A partial HIPAA waiver was requested for recruitment and screening purposes
      only, limited to the study's inclusion criteria, with identifiers to be destroyed at the
      earliest opportunity consistent with the conduct of the research. No data monitoring
      committee was appointed; the study is not for a drug product or a medical device.
  special_populations:
    - >-
      The study metadata published against version 2.0.0 gives adult eligibility as 18 to 120 years
      of age. The wider study includes a pediatric cohort recruited strictly at the Hospital for
      Sick Children and released as a separate dataset, and adult cohorts of participants with mild
      cognitive impairment, Alzheimer's disease and other dementias, and active psychiatric
      conditions including bipolar disorder, schizophrenia and depression.

at_risk_populations:
  at_risk_groups_included: true
  at_risk_groups_included_details: placeholder
  special_protections:
    - >-
      The adult cohort includes participants with mild cognitive impairment, Alzheimer's disease
      and other dementias, and with active psychiatric conditions including bipolar disorder,
      schizophrenia and depression, whose capacity to consent may be affected. Participants must be
      able to provide informed consent in English to be eligible, and the IRB protocol requires
      about thirty minutes of explanation with a teach-back check in which potential participants
      explain what they have understood to the research assistant.
    - >-
      The IRB protocol identifies as the principal non-privacy risk that questions asked of
      participants in the mood and psychiatric cohorts can lead to possible discomfort and could
      trigger negative emotions.
    - >-
      Minors are not present in the adult release; participants in this dataset are adults under the
      eligibility criteria published with the version 2.0.0 study metadata.
  source_caveats: >-
    The bundle does not use the phrase "at-risk population", so this boolean is an assessment of
    the cohorts the bundle describes rather than a value the sources state. It is set to true
    because the adult cohort includes people with dementia, cognitive impairment and active
    psychiatric conditions. The IRB protocol governing the wider study completed checklist HRP-416
    for children under 21 and describes parental permission from one or both parents plus
    documented verbal assent from children where appropriate, with young children who cannot
    reasonably be asked to assent - typically those under seven - not asked to do so. Those
    provisions apply to the pediatric cohort, which is released as the separate Bridge2AI-Voice
    Pediatric Dataset and is not the referent of this record.

ethical_reviews:
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Reviewed and approved the Bridge2AI Voice Data Acquisition protocol as the single IRB for
      United States participating institutions, covering enrollment, consent, data collection,
      de-identification and data sharing. Participants provided written informed consent, and the
      studies were conducted in accordance with local legislation and institutional requirements.
    contact_person:
      name: Yael Bensoussan
  - reviewing_organization: Mount Sinai Hospital Research Ethics Board
    review_details: >-
      Mount Sinai Hospital applied for separate Research Ethics Board approval rather than joining
      the single IRB, in compliance with Canadian regulations, with a copy of the approved
      application submitted to the USF IRB. Genomic data collection and analysis for the
      neurological cohort was covered by a separate protocol and approval at Mount Sinai Hospital
      and the University of Toronto.
  - reviewing_organization: Hospital for Sick Children Research Ethics Board
    review_details: >-
      The Hospital for Sick Children applied for separate Research Ethics Board approval rather
      than joining the single IRB, in compliance with Canadian regulations, with a copy of the
      approved application submitted to the USF IRB.
  - reviewing_organization: University of Toronto Research Ethics Board
    review_details: >-
      The University of Toronto applied for separate Research Ethics Board approval rather than
      joining the single IRB, in compliance with Canadian regulations, with a copy of the approved
      application submitted to the USF IRB. Genomic data collection and analysis for the
      neurological cohort was covered by a separate protocol and approval at the University of
      Toronto and Mount Sinai Hospital.
  - reviewing_organization: Bridge2AI-Voice ethics team
    review_details: >-
      A team of ethicists identified the sensitive fields to be removed from the release, and the
      consortium published a memorandum setting out the ethical justification for controlled access
      to raw voice data samples and the reasoning behind the governance structure. Best ethical
      practices developed through ethical inquiry guided both the voice collection protocol and
      data dissemination practices.

collection_consents:
  - consent_details: >-
      All participants were duly informed and agreed to the collection and use of their data
      through prospective informed consent. Research data that does not contain direct identifiers
      is shared with external researchers for future research through a secure database; data that
      poses a low risk of causing individual re-identification is shared in registered access with
      the general public, and data that would pose a heightened risk of re-identification if shared
      in full open access is shared through a controlled access mechanism with authorized
      researchers.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Prospective written informed consent, obtained on paper, electronically through REDCap survey
      forms, within the application, or by video recording in which the participant reads a
      statement aloud so that identity can be verified and participants distinguished from bots.
      For longitudinal collection, an electronic consent is administered through the application
      before each subsequent data collection to ensure ongoing consent.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap. All paper and
      electronic versions of consent are stored for a minimum of five years after completion of the
      study, as required by USF procedure, alongside de-identified study data.
    consent_scope: >-
      Consent covers the study procedures, the collection and use of voice and associated health
      data, access to medical information through electronic health record platforms for gold
      standard validation, and the sharing of de-identified data with external researchers through
      a secure database under registered and controlled access. Participants may separately agree
      to be contacted in the future for further voice data collection. The consent does not
      restrict use of the data to non-commercial purposes, to a specific geographic location, to a
      specific type of research, to genetic research, or to research that does not involve the
      development of methods or algorithms.
    withdrawal_mechanism: >-
      Participants are informed that participation is voluntary and that they may withdraw at any
      point. If a participant chooses to withdraw during or before the voice data collection, their
      data will not be included in the database.

consent_revocations:
  - revocation_details: >-
      Participants are informed that research data, including voice recordings, cannot be removed
      from the database once the voice data collection process is completed. For longitudinal
      collection, data already contributed is retained if a participant withdraws later, since the
      minimum requirement for study completion is a single data collection time point.
      Participants who withdraw, decline participation, or express initial hesitation may
      optionally complete a satisfaction survey to help the team understand their reasons; no
      protected health information is collected in that survey.

collection_notifications:
  - notification_details: >-
      Participants were notified about the data collection through an IRB-approved consent process
      conducted by research staff, in most cases in a clinic setting and in some cases remotely.
      Roughly thirty minutes is spent explaining the study and the consent in detail with time for
      questions, and potential participants are asked to explain what they have understood to the
      research assistant to confirm comprehension. Participants are informed that participation is
      voluntary and does not affect their medical care in any way.

data_protection_impacts:
  - impact_details: >-
      A team of ethicists reviewed the dataset and identified the direct identifiers, indirect
      identifiers and highly sensitive non-identifying elements to be removed before release, and
      the consortium published a memorandum setting out the ethical justification for restricting
      raw voice data samples to controlled access. The risk analysis considered re-identification
      through combination with public data available on social media, in government registries or
      elsewhere, and the potential for raw voice to be used for illicit or unauthorized purposes.
    source_caveats: >-
      The project documentation answers "No" to the question of whether an analysis of the
      potential impact of the dataset and its use on data subjects has been conducted. No formal
      data protection impact assessment is reported; the ethics review and access-governance work
      recorded here is adjacent activity, not a DPIA, and this slot should be read as describing
      that activity rather than as asserting that a DPIA exists.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      The data was directly observable and reported by subjects. Acoustic tasks were performed by
      the participant and recorded, while demographics, confounders and validated questionnaires
      were self-reported. Clinical diagnoses were verified by clinicians reviewing audio and/or
      imaging data, looking at electronic health records, or checking medication prescriptions.
  - was_inferred_derived: true
    acquisition_details: >-
      The released feature files are derived from the collected audio by automated signal
      processing and machine-learning tools rather than collected directly.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data was collected from the individuals in question directly, rather than obtained through
      third parties such as hospitals or app companies. Data is collected in clinic with the
      assistance of a trained research assistant; remote collection is planned but did not occur
      for the initial dataset release.

collection_mechanisms:
  - mechanism_details: >-
      Voice samples are collected prospectively using a custom software application, the
      Bridge2AI-Voice app, running on a tablet. Data is collected on iPads (9th or 10th generation)
      and iPad Air (5th generation) using an Avid AE-36 microphone connected through an Apple
      dongle, with participants wearing a head-mounted headset with microphone where possible, as
      per the Bridge2AI-Voice suggested standards.
  - mechanism_details: >-
      Remote consent, enrollment and data collection are supported by the Bridge2AI Voice Web app
      and the Bridge2AI Voice iOS app, which are themselves HIPAA-compliant, require no software
      download or login, retain data only during the collection phase, and transmit over a secure
      HTTPS protocol to a HIPAA-compliant storage server operated by an NIH STRIDES partner.
  - mechanism_details: >-
      Demographic, confounder, clinical validation and questionnaire data are captured through the
      application and managed in a REDCap database; the supporting REDCap data dictionary, metadata
      and instrument PDFs are published openly.

collection_timeframes:
  - timeframe_details: >-
      The data was collected over a period of twelve months.
    source_caveats: >-
      No calendar start or end dates are given for dataset collection in the bundle, so start_date
      and end_date are omitted. Date information at a resolution finer than years was removed under
      HIPAA Safe Harbor. The funded project period runs from 1 September 2022 to 30 November 2026.

data_collectors:
  - role: researcher
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students, coordinated
      with clinicians and doctors to identify appropriate participants, conducted the consent
      process, introduced participants to the application, and supervised data collection in a
      private clinic room.
  - role: researcher
    collector_details: >-
      Clinicians and doctors listed under the IRB as co-investigators provided the clinical
      diagnoses and gold standard validation; they were added to the consortium so that their names
      are included on consortium-level publications arising from the research. Hospital staff were
      not involved in scheduling but assisted in the logistics of coordinating data collection.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      Patients presenting at high volume expert clinics within participating academic institutions
      in the United States and Canada, together with individuals without the conditions of interest
      recruited to serve as controls.
    strategies:
      - Non-probability sampling
      - Screening of clinic patient charts against per-cohort inclusion and exclusion criteria
        ahead of the appointment, using the site electronic health record
      - Recruitment from high volume expert clinics, defined as outpatient clinics within hospital
        systems or academic institutions with recognized expertise in a disease area seeing more
        than 50 patients per month from the same disease category
      - Planned recruitment through community outreach clinics serving underserved and
        under-represented populations
      - Recruitment flyers with QR codes linking to a secure REDCap screening survey, waiting-room
        recruitment where approved, social media, and the FlowTrials platform
      - Targeted medical record review to identify participants where specific diagnoses or
        severities are under-represented in the dataset
    why_not_representative: >-
      The data is not representative because it was collected at a limited number of geographic
      locations, and because recruitment from specialty clinics and from populations proximal to
      and trusting of the collection sites skews who was enrolled.
    representative_verification:
      - >-
        No verification of representativeness is reported; the consortium instead documents the
        limitation and plans to shift to remote collection and to control for more variables in
        recruitment.

raw_data_sources:
  - source_description: >-
      Voice, speech, breathing and cough recordings captured prospectively from consented
      participants performing 22 standardized acoustic tasks through the Bridge2AI-Voice
      application, covering non-voice non-speech tasks such as respiration and voluntary cough,
      voice non-speech tasks such as prolonged vowel, maximum phonation time, glides, loudness and
      diadochokinesis, and speech tasks such as the Rainbow Passage, the Caterpillar Passage,
      CAPE-V sentences, free speech, picture description, story recall, animal fluency, word-color
      Stroop, productive vocabulary, random item generation and the Cinderella story.
    source_type: Prospective primary collection from human participants
    raw_data_format: WAV audio; standardized to monaural 16 kHz during preprocessing
    access_details: >-
      Raw audio is disseminated through controlled access only, to protect participants' privacy.
      Requests are made to the Data Access Compliance Office at DACO@b2ai-voice.org, and approved
      data is made available via Synapse.
  - source_description: >-
      Self-reported demographic data, questions on confounders such as smoking and hydration
      status, disease-specific clinical items, and validated questionnaires including VHI-10,
      PHQ-9, GAD-7, PANAS, a custom affect scale, PTSD Adult, ADHD Adult, DSM-5 Adult, the Dyspnea
      Index, the Leicester Cough Questionnaire, the Winograd questionnaire and the Montreal
      Cognitive Assessment.
    source_type: Participant-reported questionnaire data captured through the application
    raw_data_format: REDCap export, converted to tab-delimited files with JSON data dictionaries
  - source_description: >-
      Clinical validation data confirming diagnosis and treatment, drawn from laryngoscopy images
      and stroboscopy videos, chest and neck CT, brain CT and MRI, spirometry and flow volume
      loops, serum phosphorylated tau markers, electronic health summaries, and active
      prescriptions.
    source_type: Clinician assessment and electronic health record extraction
    access_details: >-
      Multimodal data other than acoustic and questionnaire data is extracted at each site
      independently and uploaded through the REDCap database; no such external data was released in
      the version 3.0.0 release.

raw_sources:
  - raw_data_details: >-
      Raw audio waveforms and raw questionnaire response data are retained after de-identification
      but are not publicly accessible; the public release carries features extracted from the audio
      instead, in order to limit re-identification.
    access_url: https://www.synapse.org/Synapse:syn72370534/

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a
      Butterworth anti-aliasing filter applied.
  - preprocessing_details: >-
      Time-frequency representations were computed from the standardized audio using the short-time
      Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT;
      spectrograms were further downsampled by a factor of two in the time domain after derivation.
      Sixty Mel-frequency cepstral coefficients and a 60-bin Mel spectrogram were computed with the
      same parameters.
  - preprocessing_details: >-
      Articulatory features were generated with the Speech Articulatory Coding (sparc) package,
      producing kinematic traces of vocal tract articulators and source features together with
      measures of loudness, periodicity and pitch, all gathered at 50 Hz using 20 ms windows.
      Phonetic posteriorgrams, a time-varying categorical distribution over 40 acoustic units of
      speech, were generated at 100 Hz via the ppgs package.
  - preprocessing_details: >-
      Static acoustic features were extracted with openSMILE, capturing temporal dynamics and
      acoustic characteristics, and phonetic and prosodic features including fundamental frequency,
      formants and voice quality measures were computed with Parselmouth and Praat. Transcriptions
      were generated using OpenAI's Whisper Large model. Speech intelligibility metrics were
      computed for speech tasks.
  - preprocessing_details: >-
      Raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from
      REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0, giving a
      layout with dataset-level description files, a phenotype directory holding confounders,
      demographics, diagnosis, enrollment, questionnaire and task tables, and per-subject
      per-session audio directories.
  - preprocessing_details: >-
      All processing is performed with the b2aiprep toolkit, which organizes and preprocesses the
      dataset, and SenseLab, which processes audio files for research tasks. Version 3.1.0 was
      generated with b2aiprep v3.0.0. Waveform-derived features are stored in two formats: a fixed
      feature format holding static features extracted from the entire waveform, and a temporal
      format that varies per file with the length of the recording.

cleaning_strategies:
  - cleaning_details: >-
      A release audit protocol is applied that generates missingness tables, checks distributions
      and outliers, checks categorical responses against the schema, and runs quality control
      metrics on audio tasks, including the amount of silence and the duration of each waveform and,
      for speech tasks, a comparison of the produced speech against the intended passage.
    source_caveats: >-
      The project documentation healthsheet answers "No" to the question of whether any
      pre-processing was performed for cleaning the data. This entry records the release audit
      protocol described elsewhere in the same documentation, which is quality assessment rather
      than cleaning; no cleaning transformation of the data is reported.
  - cleaning_details: >-
      Raw audio transcripts were reviewed and any recordings that contained potentially identifying
      information or external voices were removed from the release.
    source_caveats: >-
      This removal is a privacy measure applied at release rather than a data cleaning step, and
      the project documentation does not describe it as cleaning.

labeling_strategies:
  - annotations_per_item: 1
    labeling_details: >-
      A gold standard diagnostic label is available in the data, diagnosed by a clinician. At each
      site a local clinician provided the diagnosis based on a clinical interview and appropriate
      work-up. For the psychiatric disorders cohort the assessment was determined using the
      participant's electronic health record or an active prescription, performed outside of data
      collection by an appropriately licensed clinician.
    annotator_demographics:
      - >-
        Typically the clinician at the site of data collection, or a clinician external to the
        study who had made a prior diagnostic assessment. No further demographic characterization
        of labelers is reported.
    data_annotation_protocol: >-
      Labeling followed the Bridge2AI protocols and ICD-10 codes, with per-cohort gold standard
      validation methods specified for each diagnosis.
    data_annotation_platform: >-
      REDCap, through the clinical validation section of the data acquisition protocol.

machine_annotation_tools:
  - tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat
      - Parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
      - b2aiprep
      - SenseLab
    tool_descriptions:
      - OpenAI Whisper Large generated the transcriptions of recorded speech.
      - openSMILE, the Speech and Music Interpretation by Large-space Extraction toolkit, produced
        eGeMAPS and other acoustic features per audio file, capturing temporal dynamics and
        acoustic characteristics.
      - Praat and its Python interface Parselmouth produced phonetic and prosodic features
        including fundamental frequency, formants and voice quality measures for speech tasks.
      - torchaudio produced pitch contours, spectrograms, Mel spectrograms and Mel-frequency
        cepstral coefficients.
      - The Speech Articulatory Coding package produced electromagnetic articulography estimates
        for six articulators plus loudness, periodicity and pitch measures.
      - The ppgs package produced high-fidelity neural phonetic posteriorgrams over 40 phoneme
        categories.
      - b2aiprep organizes and preprocesses the dataset, converting raw audio waveforms into the
        parquet feature files and merging source data into the phenotype files.
      - SenseLab processes audio files for research tasks.
    tool_accuracy:
      - >-
        Certain aspects of the data, for example transcription, were generated using off-the-shelf
        models that have not been audited for correctness.

missing_data_documentation:
  - missing_data_causes: >-
      Some questionnaire items are optional and participants may skip them. Data collection
      irregularities caused some information to be missing from individual instances. Each
      individual answered a common set of questions and then responded to additional questions
      relevant to their primary diagnostic category, so cohort-specific instruments are absent for
      participants outside that cohort. Some audio files could not generate certain features owing
      to length or other issues.
    missing_data_patterns: >-
      The dataset was audited internally for missingness and consistency by the data release team,
      and a missingness table is included with the dataset. Phenotype data files contain a row for a
      participant only if at least one column is not missing.
    handling_strategy: >-
      Missingness is documented rather than filled: missingness tables are generated as part of the
      release audit protocol, and rows that would be entirely missing are omitted from the
      corresponding phenotype file.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    derivation: >-
      A pseudonymous study identification number assigned at enrollment; the datasheet linking
      participant numbers to participant information is held locally at the collecting institution.
    quality_notes: >-
      Present in every parquet feature file and used to join feature records to phenotype records.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    quality_notes: >-
      A unique identifier for the recording session. A participant may have more than one session,
      so more than one row per participant can appear in the data files, and there is no
      requirement that a participant give the same response at each visit.
  - variable_name: task_name
    data_type: categorical
    quality_notes: >-
      Names the acoustic task performed during the recording, drawn from the 22 tasks in the adult
      protocol.
  - variable_name: n_frames
    data_type: integer
    quality_notes: >-
      The number of time frames associated with the feature in that record.
  - variable_name: spectrogram
    data_type: array
    derivation: >-
      Short-time Fast Fourier Transform of the standardized 16 kHz monaural audio with a 25 ms
      window size, 10 ms hop length and 400-point FFT, downsampled by a factor of two in the time
      domain; dimension 201 by T.
    quality_notes: >-
      29,278 records in version 3.1.0. Excluded for sensitive records, audio checks, and
      open-response or free-speech prompts.
  - variable_name: mel_spectrogram
    data_type: array
    derivation: >-
      Mel spectrogram of dimension 60 by T computed with a 25 ms window size, 10 ms hop length,
      400-point FFT and 60 Mel bins.
  - variable_name: mfcc
    data_type: array
    derivation: >-
      Sixty Mel-frequency cepstral coefficients of dimension 60 by T, computed with the same
      parameters as the Mel spectrogram.
  - variable_name: pitch
    data_type: array
    unit: Hz
    minimum_value: 80.0
    maximum_value: 500.0
    derivation: >-
      Detected pitch, that is fundamental frequency, over time from torchaudio, of dimension T.
    quality_notes: >-
      The stated minimum and maximum are the detector's configured bounds; 32,522 records in
      version 3.1.0.
  - variable_name: sparc_pitch
    data_type: array
    unit: Hz
    minimum_value: 50.0
    maximum_value: 550.0
    derivation: >-
      Estimated fundamental frequency of the audio signal computed by the Speech Articulatory
      Coding package using a different algorithm from the torchaudio pitch, of dimension T.
  - variable_name: sparc_ema
    data_type: array
    derivation: >-
      Estimated electromagnetic articulography from a deep learning model, of dimension T by 12,
      where the twelve columns are the X and Y positions of six articulators - tongue dorsum,
      tongue body, tongue tip, lower incisor, upper lip and lower lip.
  - variable_name: sparc_loudness
    data_type: array
    derivation: >-
      Estimated loudness based on the average absolute amplitude of the audio waveform, of size T,
      using 20 ms windows.
  - variable_name: sparc_periodicity
    data_type: array
    derivation: >-
      Estimated periodicity, that is the confidence of pitch presence, derived from the audio using
      20 ms windows, of dimension T.
  - variable_name: ppgs
    data_type: array
    derivation: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories, dimension 40 by T, at a
      frame rate of 100 Hz.

file_collections:
  - id: doi:10.13026/8xbn-nq66#features
    name: Derived audio features
    path: features/
    collection_type: processed_data
    description: >-
      Nine dense binary files in Apache Parquet - ppgs, sparc_ema, sparc_loudness,
      sparc_periodicity, sparc_pitch, torchaudio_spectrogram, torchaudio_mfcc, torchaudio_pitch and
      torchaudio_mel_spectrogram - together with two plain-text tab-separated files:
      static_features.tsv, holding one openSMILE, Praat, Parselmouth and torchaudio feature row per
      audio recording, and audio_quality_metrics.tsv, holding quality control metrics per
      recording. Every file has a matching JSON data dictionary with the same file stem describing
      the feature and the processing applied.
  - id: doi:10.13026/8xbn-nq66#phenotype
    name: Phenotype tables
    path: phenotype/
    collection_type: processed_data
    description: >-
      Tab-delimited tables with matching JSON data dictionaries, organized into confounders,
      demographics, diagnosis, enrollment, questionnaire and task subfolders. The diagnosis
      subfolder holds one table per condition, including airway stenosis, amyotrophic lateral
      sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment, control, COPD and
      asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal dystonia, laryngitis,
      muscle tension dysphonia, Parkinson's disease, precancerous lesions, unexplained chronic
      cough and unilateral vocal fold paralysis. The questionnaire subfolder holds ADHD Adult, the
      custom affect scale, DSM-5 Adult, the Dyspnea Index, GAD-7, the Leicester Cough
      Questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric history, PTSD Adult, VHI-10
      and voice perception. The task subfolder holds acoustic task, Harvard sentences, random item
      generation, recording, session, Stroop and Winograd tables. Each data dictionary key matches a
      column name and gives a description, the question asked of the participant where applicable,
      and the data type of the response.
  - id: doi:10.13026/8xbn-nq66#metadata
    name: Recording metadata
    path: metadata/
    collection_type: metadata
    description: >-
      A binary file in Apache Parquet with its corresponding data dictionary, holding specific
      information about each recording including task instructions and prompts and the microphone
      used with its gain. New in version 3.1.0.

distribution_formats:
  - format: Apache Parquet, an open-source column-oriented data file format
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Used for the dense time-varying audio features and for the recording metadata. Loadable with
      any Parquet-capable library, for example the HuggingFace Datasets library in Python.
  - format: Tab-separated values
    media_type: text/tab-separated-values
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Used for the phenotype tables, the static feature table and the audio quality metrics table;
      readable with any statistical analysis tool.
  - format: JSON data dictionaries
    media_type: application/json
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      One dictionary accompanies each data file, sharing its file stem, with keys matching column
      names.
  - format: WAV audio waveforms
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    notes: >-
      Raw audio is not part of the PhysioNet release. It is disseminated through controlled access
      only, via Synapse, after institutional sign-off.

distribution_dates:
  - release_dates:
      - "1.0: published on the Health Data Nexus at the end of November 2024"
      - "1.1: 17 January 2025"
      - "2.0.0: 16 April 2025"
      - "2.0.1: 18 August 2025"
      - "3.0.0: 16 December 2025"
      - "3.1.0: 1 May 2026"

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it, through
      a data publishing platform that provides publicly accessible metadata and a DOI for
      persistent resolution while requiring registered or credentialed access to the data itself.

license_and_use_terms:
  data_use_permission: general_research_use
  license_terms: >-
    Files are released under the Bridge2AI Voice Registered Access License, and users must sign the
    Bridge2AI Voice Registered Access Agreement. The consent does not restrict use to
    non-commercial purposes, to a geographic location, to a specific type of research, to genetic
    research, or to research that excludes methods and algorithm development; the agreement limits
    use to commercial and non-commercial research purposes by Authorized Researchers. Duplication
    as reasonably required to carry out the approved research project is permitted; sale of all or
    part of the data on any media is not. No fees are associated with these restrictions.

ip_restrictions:
  restrictions:
    - The data may be protected by copyright and other rights, including other intellectual
      property rights.
    - Nothing in the agreement operates to transfer to the recipient any intellectual property
      rights in or relating to the data.
    - Users agree not to make intellectual property claims on the data.
    - Users agree not to use intellectual property protection, database rights or related rights in
      ways that would prevent or block access to, or use of, any element of the data or conclusions
      drawn directly from the data.
    - Users may elect to perform further research that adds intellectual and resource capital to
      the data and to obtain intellectual property rights on those downstream discoveries, but
      agree to implement licensing policies that will not obstruct further research and to respect
      the Fort Lauderdale Agreement.
    - The data provider gives no guarantee that the data is free of third-party intellectual
      property rights, database rights or other related rights.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      The project documentation records the determination that no export controls apply to the
      dataset, and that no third parties have imposed intellectual-property-based or other
      restrictions on the data associated with the instances.
  other_compliance: >-
    The data is covered by a Certificate of Confidentiality, which must be asserted against
    compulsory legal demands such as court orders and subpoenas for identifying information or
    characteristics of a research participant. The Data Transfer and Use Agreement classifies the
    transferred data as Personally Identifiable Information as defined in OMB Memorandum M-07-16;
    recipients must establish appropriate administrative, technical and physical safeguards, notify
    the provider of any unauthorized use or disclosure within five business days of discovery, and
    provide documentation of their own IRB-approved protocol on request. Recipients must also
    adhere to the requirements of PhysioNet, managed by the MIT Laboratory for Computational
    Physiology.
  source_caveats: >-
    The Data Transfer and Use Agreement states that the data it governs is not covered under HIPAA,
    FERPA or similar laws requiring special terms, whereas the project documentation states that the
    HIPAA de-identification rules were applied to the released dataset. The two statements concern
    different artifacts - the identifiable data transferred under the agreement and the
    de-identified public release - and both sources sit at the same tier, so neither is preferred
    over the other.

data_governance:
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: >-
    Access is granted at two levels. For registered access to the feature-only data, a user
    registers on PhysioNet, confirms their identity, becomes a credentialed user, and signs the
    Bridge2AI-Voice Registered Access Agreement; no additional training is required. For controlled
    access to the raw audio data, an applicant completes a Data Access Request Form and a Data Use
    Agreement, submits the application to the Data Access Compliance Office for review at
    DACO@b2ai-voice.org, and on approval ensures that a Data Use and Transfer Agreement is signed
    by an authorized official at their institution; approved raw audio is then made available via
    Synapse. Collaborators at other research organizations, and other research teams at the same
    organization, must apply independently and sign their own agreement. Access is time-limited:
    the transfer agreement ends two years after its start date, on completion of the project, on
    expiry of the applicable ethics approval, or on termination by the provider, whichever comes
    first.
  accountable_organization:
    name: University of South Florida Board of Trustees
  stewardship_roles:
    - The Data Access Compliance Office reviews and approves applications for controlled access to
      raw voice data and must approve any modification of a Data Transfer and Use Agreement.
    - PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the
      registered-access release, manages credentialing, and enforces the data use agreement.
    - The Bridge2AI-Voice consortium curates the data, publishes documentation and code, and can be
      reached through the project's data access address.
    - Each participating institution retains its identified data locally, with access to REDCap
      records limited to authorized investigators at that institution, and each local principal
      investigator is responsible for destroying identifiable data after the retention period.
  notes: >-
    The consortium published a memorandum explaining the ethical justification for controlled
    access to raw voice data samples and the reasoning behind the governance structure.
  source_caveats: >-
    The project documentation describes hosting and curation by the Health Data Nexus platform
    maintained by the Temerty Centre for Artificial Intelligence Research and Education in Medicine
    at the University of Toronto, with a platform contact and a curator contact; the tier-1
    PhysioNet releases show PhysioNet as the current host and are preferred here.

retention_limit:
  retention_period: >-
    Indefinite for the published dataset; two years from the start date for recipients under a Data
    Transfer and Use Agreement.
  retention_details: >-
    Once data is contributed it will be retained as long as it is useful for research purposes,
    possibly indefinitely. Recipients of raw data under a Data Transfer and Use Agreement must
    destroy the data two years after the start date, on completion of the project, on termination,
    or on expiry of the applicable ethics approval, whichever occurs first, and must submit written
    certification of destruction within thirty days; one copy may be retained where necessary to
    meet records retention requirements under law, regulation or institutional policy and for
    research integrity and verification. Within the collecting institutions, identifiable data and
    the datasheets linking participant numbers to participant information are kept on local cloud
    storage for a maximum of ten years after study completion and then destroyed, while
    de-identified study data and original consent forms are retained for a minimum of five years
    after study completion.

updates:
  frequency: Semi-annual, that is twice a year
  update_details: >-
    Further versions of the dataset will be released on a semi-annual basis and distributed as new
    versions on the publishing platform. Users will be notified through news items on the platform
    as well as through standard communication channels. Updates correct labeling errors, add new
    instances and reorganize files; version 3.1.0 added no new participants but released additional
    data for certain participants, fixed broken parquet files, added audio quality metrics and
    per-recording metadata, back-filled validated diagnosis information across conditions,
    rearranged some phenotypic files and renamed certain gold standard variables.

version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
    - "1.0 - Health Data Nexus, end of November 2024, doi 10.57764/qb6h-em84"
    - "1.1 - PhysioNet, 17 January 2025, doi 10.13026/249v-w155; added Mel-frequency cepstral
      coefficients"
    - "2.0.0 - PhysioNet, 16 April 2025; added 136 new participants, reprocessed spectrograms, and
      removed spectrograms and MFCCs derived from free speech"
    - "2.0.1 - PhysioNet, 18 August 2025; corrections to the authorship list"
    - "3.0.0 - PhysioNet, 16 December 2025, doi 10.13026/k81f-qr68; added 391 new participants,
      split the single phenotype file into individual files, and added SPARC and phonetic
      posteriorgram features"
    - "3.1.0 - PhysioNet, 1 May 2026, doi 10.13026/8xbn-nq66"
  version_details: >-
    Each version of the dataset has a unique DOI, alongside a DOI that always resolves to the
    latest version. By default older versions continue to be supported, hosted and made available
    to researchers, though the dataset publishers reserve the right to remove access to older
    versions; the files for version 1.1 are no longer available on PhysioNet, which directs users to
    the latest version. A changelog for each dataset version is published online with the dataset
    metadata.

errata:
  - erratum_details: >-
      Version 3.1.0 fixed broken parquet files carried over from version 3.0.0, back-filled updated
      validated diagnosis information across conditions, rearranged some phenotypic files - moving
      ADHD Adult, PTSD Adult and psychiatric history from the diagnosis subfolder to the
      questionnaire subfolder - and renamed certain gold standard variable names. Version 2.0.0
      reprocessed the spectrograms to fix minor issues identified in the previous release, and
      version 2.0.1 corrected the authorship list.
    source_caveats: >-
      The project documentation states that there is no erratum for the dataset and that a
      changelog is published online with the dataset metadata instead; the corrections recorded
      here are drawn from the PhysioNet release notes. No erratum_url is given because no distinct
      erratum document exists; the release notes appear on the version landing page recorded under
      the page slot.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the
    publishing platform that references the original source; derivative datasets may be made
    available under the same conditions as the source data. For augmentations to the code used to
    produce the data, the open-source repositories have discussion forums and issue pages allowing
    public discussion of data preprocessing, and a pull request mechanism for contributing
    improvements to the preprocessing code.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the released
      dataset, manages credentialing and the data use agreement, and provides continued access to
      interested researchers. PhysioNet is supported by the National Institute of Biomedical
      Imaging and Bioengineering, the National Heart Lung and Blood Institute, and the NIH Office of
      the Director under grant numbers U24EB037545 and R01EB030362.
  - role: academic_institution
    maintainer_details: >-
      The Bridge2AI-Voice consortium curates the dataset, maintains the documentation site and
      dashboards, and can be contacted about the dataset through the project's data access address;
      questions about the dataset itself are directed to the corresponding author on the release
      page.
  - role: government_agency
    maintainer_details: >-
      The dataset is supported by the National Institutes of Health via the Bridge2AI project.
  - role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, a data publishing platform maintained by the Temerty Centre for
      Artificial Intelligence Research and Education in Medicine at the University of Toronto,
      hosted version 1.0 of the dataset and, per the project documentation, maintained the technical
      infrastructure for that earlier feature-only release with cloud compute alongside the dataset
      rather than data downloads.
    source_caveats: >-
      This entry describes a prior host rather than the current one. The project documentation
      (tier 2) presents the Health Data Nexus as the hosting and maintaining platform for the
      dataset; the tier-1 PhysioNet releases show PhysioNet as the host from version 1.1 onward and
      are preferred, so this maintainer applies to the version 1.0 release only.

external_resources:
  - external_resources: >-
      Bridge2AI-Voice project documentation and dashboards at https://docs.b2ai-voice.org/ and
      https://b2ai-voice.org/; the eipm/bridge2ai-redcap repository holding the REDCap data
      dictionary, metadata and instrument PDFs at https://github.com/eipm/bridge2ai-redcap; the
      b2aiprep preprocessing library at https://github.com/sensein/b2aiprep; the SenseLab audio
      processing toolkit; FHIR profiles for voice as a biomarker; the eipm/bridge2ai-docs
      repository; and training resources at https://www.b2aivoicescholars.org/.
    restrictions:
      - >-
        The REDCap data dictionary and the documentation source code are released under the MIT
        license; the b2aiprep preprocessing library is released under the Apache-2.0 license.
    source_caveats: >-
      The project documentation healthsheet answers that the dataset is self-contained and that
      questions of guarantees, archival versions and third-party restrictions on external resources
      are not applicable; the resources listed here are the supporting materials the same
      documentation publishes alongside the dataset.

