    description: >-
      The first release of the dataset, published on the Health Data Nexus, providing 12,523
      recordings for 306 participants collected across five sites in North America.
  - relationship_type: is_supplemented_by
    target_dataset: doi:10.13026/h995-bt35
    name: "Bridge2AI-Voice Pediatric Dataset v1.1.0"
    description: >-
      The companion pediatric release, published 1 May 2026, containing derived audio features for
      23,533 recordings from 300 participants aged 2 to 18, collected at the Hospital for Sick
