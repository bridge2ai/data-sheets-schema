participant_compensation:
  - compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      40 US dollars for a data collection session taking less than 90 minutes and 80 US dollars for
      a session taking over 90 minutes, for no more than three sessions and a maximum total
      compensation of 120 US dollars.
    compensation_rationale: >-
      Participants were compensated for their time. Members of the research and clinical teams were
      not separately compensated for data collection; clinicians and doctors were listed under the
      IRB as co-investigators and added to the consortium so that their names appear on
      consortium-level publications.
    source_caveats: >-
      Participants in the separate app feasibility study conducted at the USF Health Voice Center
      received no financial incentives for completion; compensation was added to the data
      acquisition protocol by amendment in August 2023 and revised in later versions.