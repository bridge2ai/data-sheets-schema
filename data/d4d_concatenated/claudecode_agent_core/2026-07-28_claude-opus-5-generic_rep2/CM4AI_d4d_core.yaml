  description: 'The March 2025 Data Release of CM4AI. This Beta release includes perturb-seq data in undifferentiated
    KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and
    cardiomyocytes; and IF images in MDA-MB-468 breast cancer cells in the presence and absence of chemotherapy
    (vorinostat and paclitaxel). CM4AI output data are packaged with provenance graphs and rich metadata
    as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. The release description states
    that the data is Copyright (c) 2025 The Regents of the University of California except where otherwise
    noted, that spatial proteomics raw image data is copyright (c) 2025 The Board of Trustees of the Leland
    Stanford Junior University, and that attribution is required to the copyright holders and the authors.
    Six public files: 3 archives and 3 data files.'
