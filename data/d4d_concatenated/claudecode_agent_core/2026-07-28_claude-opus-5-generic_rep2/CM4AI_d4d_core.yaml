  scope_impact: Cross-modality analyses are restricted to the intersection of protein sets actually covered
    by each modality in a given release.
acquisition_methods:
- id: d4d:CM4AI_acquisition
  name: Acquisition of instances
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Primary measurements are directly acquired in cell culture: AP-MS and SEC-MS mass spectrometry, immunofluorescence
    confocal microscopy, and single-cell CRISPR perturbation sequencing.'
  - Derived content includes deep-learning embeddings of PPI networks and images, co-embeddings, and the
    hierarchical protein assemblies produced by community detection.
  - The CRISPRi Perturbation Cell Atlas findings were validated via phenotypic, protein-interaction, and
    metabolic tracing assays.
  - 'No human subjects are involved; the release metadata records Human Subjects: No.'
collection_mechanisms:
- id: d4d:CM4AI_mechanism_apms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - AP-MS is performed on endogenously tagged cell lines to map protein-protein interactions of chromatin
    regulators. 17 genes were endogenously tagged in MDA-MB-468 and AP-MS data were acquired under three
    conditions (untreated, paclitaxel-treated and vorinostat-treated), with 34 additional genes being
    tagged at the time the project preprint was written.
- id: d4d:CM4AI_mechanism_secms
  name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS provides proteome-wide complex and interaction mapping as an orthogonal mass-spectrometry approach
    to AP-MS. It was performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel and vorinostat
    treated) and on KOLF2 iPSCs and their derivatives.
- id: d4d:CM4AI_mechanism_if
  name: Immunofluorescence confocal imaging
  mechanism_details:
  - Spatial proteomics data are generated by immunofluorescence subcellular microscopy using the Human
    Protein Atlas resource of antibodies. Automated fixation and permeabilization protocols were established
    for a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
  - 'Each image carries four channels: DAPI for nuclei (blue), a calreticulin antibody for endoplasmic
    reticulum (yellow), a tubulin antibody for microtubules (red), and an antibody against the protein
    of interest (green).'
- id: d4d:CM4AI_mechanism_crispr
  name: Single-cell CRISPR perturbation screens
  mechanism_details:
  - A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene was designed,
    and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were generated and characterized.
    Single-cell CRISPR screens of 100 chromatin regulators with and without drug in MDA-MB-468 cells and
    in undifferentiated KOLF2.1J iPSCs were done using the 10x Genomics 3'HT kit.
sampling_strategies:
- id: d4d:CM4AI_sampling
  name: Protein and gene target selection
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - MDA-MB-468 triple negative breast cancer cell line (RRID:CVCL_0419), available from ATCC.
  - KOLF2.1J induced pluripotent stem cell line (RRID:CVCL_B5P3), available from the HipSci resource.
  strategies:
  - CM4AI's stated objective is multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines
    under perturbed and unperturbed conditions.
  - For spatial proteomics, 100 chromatin regulators were mapped in MDA-MB-468 cells with and without
    paclitaxel or vorinostat, with another 500 proteins pending significant hits from the genetic perturbation
    and PPI results.
  - The iPSC CRISPRi Perturbation Cell Atlas is expressed genome-scale, covering 11,739 targeted genes.
  why_not_representative:
  - Data were derived from commercially available de-identified human cell lines and do not represent
    all biological variants which may be seen in the population at large.
data_collectors:
- id: d4d:CM4AI_collector_lundberg
  name: Lundberg Lab, Stanford University
  role: Immunofluorescence spatial proteomics imaging
  collector_details:
  - The immunofluorescence subcellular image datasets are attributed in the Dataverse file metadata to
    imaging "in the Lundberg Lab at Stanford University, as part of the Cell Maps for Artificial Intelligence
    (CM4AI; CM4AI.org) project".
  - Raw image data for spatial proteomics is stated to be copyright of The Board of Trustees of the Leland
    Stanford Junior University.
- id: d4d:CM4AI_collector_krogan
  name: Nevan Krogan laboratory, University of California San Francisco
  role: Mass-spectrometry protein-protein interaction data generation
  collector_details:
  - The SEC-MS datasets on undifferentiated KOLF2.1J hiPSCs and on MDA-MB-468 cells following vorinostat
    or paclitaxel treatment are attributed in the Dataverse file metadata to generation "in the Nevan
    Krogan laboratory at the University of California San Francisco".
  - In the MuSIC pipeline, PPI networks for the cell line and conditions are downloaded from the Krogan
    Laboratory's deposition archive, and IF images from the Lundberg Laboratory's deposition archive.
- id: d4d:CM4AI_collector_project
  name: CM4AI Data Acquisition module
  role: Multimodal data generation across participating institutions
  collector_details:
  - 'CM4AI is organized into three pillars - Data, People, and Ethics - across six modules: Data Acquisition,
    Tools, and Standards; Skills and Workforce Development, and Teaming; and Ethics. The Data Acquisition
    module is responsible for generating the protein-protein interaction, spatial proteomics and genetic
    perturbation data streams.'
  - 'Production Location recorded on the Dataverse releases: University of California San Diego; University
    of California San Francisco; Stanford University; University of Virginia.'
collection_timeframes:
- id: d4d:CM4AI_timeframe_project
  name: NIH project period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details:
  - Project start and end dates as recorded on the NIH RePORTER entry for application ID 11211616 (project
