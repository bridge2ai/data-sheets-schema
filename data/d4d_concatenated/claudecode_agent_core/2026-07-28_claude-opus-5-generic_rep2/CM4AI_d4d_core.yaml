    undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells +/- treatment,
    undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes;
    AP-MS data for MDA-MB-468 breast cancer cells + treatment; and IF images in MDA-MB-468 breast cancer
    cells +/- treatment. All ten files are ZIP archives with public access. Dataverse metadata records
    Data Creation Date 2025-02-27, Deposit Date 2025-02-27, Depositor Niestroy, Justin, Production Location
    "University of California San Diego; University of California San Francisco; Stanford University;
    University of Virginia", and Funding Information "National Institutes of Health: 1OT2OD032742-01".'
