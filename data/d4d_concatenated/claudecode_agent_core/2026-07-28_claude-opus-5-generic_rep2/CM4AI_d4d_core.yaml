- id: d4d:CM4AI_maintainer_project
  name: Cell Maps for Artificial Intelligence (CM4AI) project
  role: academic_institution
  maintainer_details:
  - 'Project-related inquiries: Swathi Thaker, PhD, University of Alabama at Birmingham, Program Manager,
    snthaker@uab.edu.'
  - 'Website support and updates: Zhandos Sembay, University of Alabama at Birmingham, zsembay8@uab.edu.'
  - 'Point of Contact recorded on every captured Dataverse release: Ideker Trey, University of California
    San Diego. The project preprint gives tideker@health.ucsd.edu as the corresponding author address.'
  - 'Data Governance Committee contact: Jillian Parker, jillianparker@health.ucsd.edu.'
- id: d4d:CM4AI_maintainer_repository
  name: University of Virginia Dataverse (LibraData)
  role: academic_institution
  maintainer_details:
  - The releases are hosted and preserved in LibraData, the University of Virginia's archival data repository
    and its instance of Dataverse, an NIH-approved generalist repository.
  - Long term preservation in the University of Virginia Dataverse is supported by committed institutional
    funds.
  - Repository support is reached through the "Contact University of Virginia Dataverse Support" form
    on the dataset pages.
errata:
- id: d4d:CM4AI_erratum_june2025
  name: June 2025 release revision
  erratum_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
  erratum_details:
  - The June 2025 Data Release page describes its content as "a revision of the June 2025 Data Release",
    stating that "This revision includes adding RGB immunofluorescent images, corrections to ro-crate
    metadata, and changes to naming conventions." The page is served at Dataset Version 2.1 with citation
    version V2.
  - File naming changed between the March 2025 and later releases, from cm4ai-v0.6-beta-if-images-* to
    cm4ai_ifimages_MDA-MB-468_*.
updates:
  id: d4d:CM4AI_updates
  name: Update plan
  frequency: quarterly
  update_details:
  - Dataset will be regularly updated and augmented through the end of the project in November 2026.
  - Updates on a quarterly basis.
  - '"CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data streams."'
  - The project preprint states that data presented in a release "will be augmented regularly through
    the end of the project", and that software packages will be versioned as the project progresses, with
    the version used to produce each dataset referenced in the dataset's metadata.
retention_limit:
  id: d4d:CM4AI_retention
  name: Retention and preservation
  retention_period: Long term; no end date is stated for preservation.
  retention_details:
  - '"Long term preservation in the University of Virginia Dataverse, supported by committed institutional
    funds."'
  - 'Dataverse retains previously published versions: the repository states that files "will not be removed
    from previously published versions of the dataset".'
version_access:
  id: d4d:CM4AI_version_access
  name: Version access
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
  - May 2024 Data Release - doi:10.18130/V3/DXWOS5 (University of Virginia Dataverse, V1)
  - March 2025 Data Release (Beta) - doi:10.18130/V3/B35XWX, Dataset Version 1.4, citation V1
  - June 2025 Data Release (Beta) - doi:10.18130/V3/F3TD5R, Dataset Version 2.1, citation V2
  - October 2025 Data Release (Beta) - doi:10.18130/V3/K7TGEM, Dataset Version 2.1, citation V2
  - June 2026 Data Release (Beta) - doi:10.18130/V3/HIGT4C, Dataset Version 2.0, citation V2
  version_details:
  - Each quarterly release is published as a distinct Dataverse dataset with its own DOI rather than as
    a new version of a single dataset; releases are grouped in the "Cell Maps for Artificial Intelligence"
    Dataverse collection.
  - The CM4AI data-releases page lists an Archive of the May 2024, March 2025, June 2025, and October
    2025 Data Releases alongside the current release.
  - Within a release, Dataverse tracks minor and major version updates; the June 2026 release carries
    files published on 2026-06-17 and immunofluorescence image archives published on 2026-07-15.
