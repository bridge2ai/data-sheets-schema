subpopulations:
- id: d4d:CM4AI_subpopulations
  name: Donor-derived cell line origins
  subpopulation_elements_present: true
  identification:
  - MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from a metastatic
    site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma, available
    from ATCC.
  - The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was derived from a healthy male Northern European donor, available
    from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource.
  distribution:
  - The captured releases carry data from these two cell lines only. Cell-line conditions represented
    are MDA-MB-468 untreated, paclitaxel-treated and vorinostat-treated; and KOLF2.1J undifferentiated
    (parental) together with iPSC-derived neural progenitor cells, neurons and cardiomyocytes.
  - The publisher states that the data "does not represent all biological variants which may be seen in
    the population at large".
sensitive_elements:
- id: d4d:CM4AI_sensitive_elements
  name: Sensitive elements
  sensitive_elements_present: false
  sensitivity_details:
  - 'The release metadata records Human Subjects: No; De-identified Samples: Yes; FDA Regulated: No.'
  - CM4AI data are stated to be distinctive within Bridge2AI in that they are non-clinical (from tissue
    cultures) and are considered to be de-identified as they cannot be matched, with current knowledge,
    to a human subject.
confidential_elements:
- id: d4d:CM4AI_confidential_elements
  name: Confidentiality of released content
  confidential_elements_present: false
  confidentiality_details:
  - 'All files in the captured Dataverse releases are marked File Access: Public.'
  - The releases nonetheless state that "Some datasets are under temporary pre-publication embargo", and
    the October 2025 and June 2026 releases list the external perturb-seq data links for KOLF2.1J iPSCs
    and for MDA-MB-468 cells as "Embargoed".
known_biases:
