    for mass spectrometry data: SEC-MS in KOLF2.1J iPSCs (undifferentiated, NPC, neuron and cardiomyocyte),
    SEC-MS in MDA-MB-468 cells with and without treatment, and, from the June 2026 release, AP-MS in MDA-MB-468
