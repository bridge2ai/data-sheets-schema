  limitation_description: Meaningful analysis of the data requires domain expertise.
- id: d4d:CM4AI_limitation_embargo
  name: Partial embargo and incomplete modality overlap
  limitation_type: coverage_limitation
  limitation_description: Some datasets are under temporary pre-publication embargo, and the protein sets
