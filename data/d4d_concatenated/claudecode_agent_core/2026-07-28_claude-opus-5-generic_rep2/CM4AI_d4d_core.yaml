- id: d4d:CM4AI_timeframe_deposit
  name: Dataverse data creation and deposit
  start_date: '2025-02-27'
  end_date: '2026-07-15'
  timeframe_details:
  - Every captured Dataverse release records Data Creation Date 2025-02-27 and Deposit Date 2025-02-27.
  - Individual files carry their own publication dates, ranging from 2025-03-03 in the March 2025 release
    through 2026-07-15 for the immunofluorescence image archives of the June 2026 release.
missing_data_documentation:
- id: d4d:CM4AI_missing_data
  name: Documented incompleteness of the releases
  missing_data_patterns:
  - Some datasets are under temporary pre-publication embargo.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturb-seq data
    interrogate sets of proteins which incompletely overlap.
  - Computed cell maps are not included in the captured releases.
  missing_data_causes:
  - 'The releases are explicitly interim: "These data are not yet in completed final form."'
  - Some components were still pending at the time of the sources captured here; the CM4AI data-releases
    page marks IF images for the iPSC-derived flagship datasets and AP-MS interactomes for the TNBC flagship
    datasets as "coming soon", although AP-MS archives for treated MDA-MB-468 cells appear in the June
    2026 release.
  handling_strategy: The release metadata documents the incompleteness explicitly under a "Completeness"
    heading and commits to quarterly augmentation through the end of the project.
raw_data_sources:
- id: d4d:CM4AI_raw_massspec
  name: Raw mass spectrometry data
  source_description: 'Raw mass spectrometry data underlying the SEC-MS and AP-MS releases are deposited
    in the MassIVE repository and linked from the Dataverse release pages as External Data Links: SEC-MS
    data in KOLF2.1J iPSCs (undifferentiated, NPC, neuron, and cardiomyocyte); SEC-MS data in MDA-MB-468
    breast cancer cells with and without treatment; and, in the June 2026 release, AP-MS data in MDA-MB-468
    cells treated with paclitaxel and with vorinostat.'
  source_type:
  - external repository deposition
  access_details: Linked from the Dataverse release page under "External Data Links". The March 2025 release
    states for the SEC-MS component that "The data will be uploaded to Pride when available".
  raw_data_format:
  - mass spectrometry raw and search-result files
- id: d4d:CM4AI_raw_sequencing
  name: Raw perturbation sequencing data
  source_description: Raw sequence data from the expressed genome-scale CRISPRi Perturbation Cell Atlas
    in KOLF2.1J hiPSCs are released as a dedicated component (cm4ai_perturb-seq_KOLF2_raw_sra) and linked
    to the NCBI BioProject / Sequence Read Archive. Perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468
    cells are listed as Embargoed in the October 2025 and June 2026 releases; the June 2026 release adds
    a Figshare link for the CRISPRi Perturbation Atlas of iPSCs.
  source_type:
  - external repository deposition
  - released archive component
  access_details: The June 2025 release links Sequence Read Archive (SRA) data through NCBI BioProject;
    embargoed perturb-seq links are marked "Embargoed" on the October 2025 and June 2026 release pages.
  raw_data_format:
  - single-cell RNA sequencing reads
- id: d4d:CM4AI_raw_images
  name: Raw immunofluorescence image data
  source_description: Raw immunofluorescence image data for spatial proteomics are distributed within
    the release as ZIP archives per treatment condition. The June 2025 release notes that its revision
    added RGB immunofluorescent images.
  source_type:
  - released archive component
  access_details: Publicly downloadable from the Dataverse release; individual archives exceed the repository's
    953.7 MB ZIP download limit and must be selected individually or retrieved through the Data Access
    API.
  raw_data_format:
  - four-channel confocal microscopy images
raw_sources:
- id: d4d:CM4AI_rawsource_massive
  name: MassIVE repository depositions
  raw_data_details:
  - Linked from the CM4AI Dataverse release pages as the repository holding mass spectrometry data for
    human iPSCs and for human cancer cells, and, from the June 2026 release, AP-MS data for paclitaxel-
    and vorinostat-treated MDA-MB-468 cells. The release pages present these as named "MassIVE Repository"
    links rather than as literal accession identifiers.
- id: d4d:CM4AI_rawsource_bioproject
  name: NCBI BioProject / Sequence Read Archive
  raw_data_details:
  - Linked from the June 2025 CM4AI Dataverse release page as the location of Sequence Read Archive (SRA)
    data for the release, presented as a named "NCBI BioProject" link rather than as a literal accession
    identifier.
preprocessing_strategies:
- id: d4d:CM4AI_preprocessing_music
  name: MuSIC data integration pipeline
  preprocessing_details:
  - 'Step a - Download PPI and image data: PPI networks for the cell line and conditions are downloaded
    from the Krogan Laboratory''s deposition archive, and IF images for the cell line and conditions from
    the Lundberg Laboratory''s deposition archive.'
  - 'Step b - Generate embeddings: downloaded PPI networks are processed with the node2vec deep learning
    model to produce a PPI embedding encoding each protein''s interactions; IF images are processed with
    a Human Protein Atlas deep learning model to produce an image embedding encoding protein localization.'
  - 'Step c - Co-embedding: the PPI and image embeddings are integrated into a per-protein co-embedding
    using contrastive deep learning, learned so that the original embeddings can be reconstructed with
    minimal information loss and proteins with similar PPI and image embeddings have similar co-embeddings.'
  - 'Step d - Protein community detection and hierarchy creation: community detection is performed on
    the all-by-all similarities of protein pairs in the co-embedding space, and the resulting hierarchy
    of protein communities is output as the final cell map.'
  - 'Step f - Integrative structure modeling: a bioinformatics pipeline annotates MuSIC communities with
    available structural information from the Protein Data Bank, the AlphaFold Protein Structure Database,
    crosslinking mass spectrometry, and disordered-segment prediction; communities are ranked by available
    structural information and top-ranked communities are modeled with the Python Modeling Interface on
    the Integrative Modeling Platform (IMP) v2.18.'
  used_software:
  - id: d4d:CM4AI_software_cellmaps_pipeline
    name: Cell Mapping Toolkit (cellmaps_pipeline)
    url: https://github.com/idekerlab/cellmaps_pipeline
    description: A series of Python PyPI packages implementing the end-to-end cell mapping pipeline, with
      steps for processing protein imaging and biophysical interaction datasets, embedding the input modalities,
      integrating the modalities, constructing the hierarchical cell map, and annotating it against known
      resources. Documentation is hosted at https://cellmaps-pipeline.readthedocs.io/. Software comprising
      the Tools data integration pipeline is stated to be available under a BSD-3 open source license
      on GitHub for alpha-level tools, or in the Zenodo long-term archive for production-ready tools.
    license: BSD-3
  - id: d4d:CM4AI_software_imp
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    url: https://integrativemodeling.org
    description: Open-source package used, through the Python Modeling Interface (PMI) library, for integrative
      structure modeling of MuSIC communities.
- id: d4d:CM4AI_preprocessing_fairscape
  name: FAIRSCAPE AI-readiness packaging
  preprocessing_details:
  - The Standards module packages data, software, metadata and provenance graphs using the FAIRSCAPE framework,
    which consists of a client-side Python3 application (FAIRSCAPE-CLI) and a Python3 server application.
  - FAIRSCAPE-CLI is called when any computation or coherent set of computations in the pipeline completes;
    it receives metadata defining JSON-Schema schemas for the datasets in the computational unit as well
    as the inputs, computations, software, models and outputs, and creates an RO-Crate package with the
    datasets, metadata and software - or resolvable references to these components - plus unique stubs
    for identifier creation.
  - RO-Crates are sent to the FAIRSCAPE server where they are registered and assigned persistent, resolvable,
    globally unique identifiers, then decomposed into their individual components - datasets, models,
    software - which are also registered and assigned identifiers. The identifier scheme in use is ARK,
    with DOIs planned as supplementary identifiers for final-state publishable work.
  - The server computes end-to-end entailments on each RO-Crate's provenance as expressed in the EVI Evidence
    Graph Ontology and links them together where possible. Identifiers resolve to machine- and human-readable
    landing pages containing metadata expressed in JSON-LD using vocabularies from Schema.org, EVI, and
    other public ontologies, with alternate JSON-LD and RDF-XML serializations.
  - 'Present AI-readiness features comprise: establishing FAIRness including rich metadata and persistent
    globally unique identifiers; computing a machine-readable provenance graph resolvable as metadata
    for all results, including inputs, computations, software and outputs; and characterizing and validating
    all datasets and data elements, mapping data elements to public ontology vocabularies where appropriate
    using JSON-Schema mini-data-dictionary descriptions resolvable from the provenance graph metadata.'
  used_software:
  - id: d4d:CM4AI_software_fairscape
    name: FAIRSCAPE
    url: https://fairscape.github.io
    license: MIT
    description: AI-readiness framework with client-side and server-side PIP-installable Python3 packages,
      freely available under the open source MIT License. Copyright is held by the Rector and Board of
      Visitors of the University of Virginia. Installation instructions and a tutorial are published at
      https://fairscape.github.io.
cleaning_strategies:
- id: d4d:CM4AI_cleaning_qc
  name: Quality control of perturbation screen data
  cleaning_details:
  - The project preprint states that the resulting single-cell CRISPR screen data from Year 1 were undergoing
    quality control at the time of writing.
  - The FAIRSCAPE client validates inputs and creates the output RO-Crate package for each pipeline segment
    before dispatch to the FAIRSCAPE server, so that validation is part of the packaging path rather than
    a separate step.
labeling_strategies:
- id: d4d:CM4AI_labeling_hierarchy_eval
  name: Cell map hierarchy annotation
  labeling_details:
  - Cell maps are annotated in a two-pronged approach. First, cell maps are aligned to known protein function
    and pathway resources, including the Gene Ontology (GO) and Reactome, to determine protein assemblies
    in the cell map with high overlap with known cell biology.
  - Second, assemblies in the cell maps are annotated using a large language model approach developed
    by the project to name sets of proteins and assign a name confidence score.
  data_annotation_protocol:
  - Hierarchy evaluation is implemented as a step of the MuSIC pipeline (cellmaps_hierarchyeval).
machine_annotation_tools:
- id: d4d:CM4AI_machine_annotation
  name: LLM-assisted assembly naming
  tools:
  - Large language model gene-set naming approach developed by the project
  - Gene Ontology and Reactome alignment
  tool_descriptions:
  - Assemblies in the cell maps are annotated using a large language model approach that the project developed
    to name sets of proteins and assign a name confidence score.
  - Cell maps are aligned to known protein function and pathway resources, including the Gene Ontology
    and Reactome, to determine which assemblies have high overlap with known cell biology.
existing_uses:
- id: d4d:CM4AI_existing_uses
  name: Publications and events using the released data
  examples:
  - Nourreddine S, Doctor Y, Dailamy A, Forget A, Lee YH, Chinn B, Khaliq H, Polacco B, Muralidharan M,
    Pan E, Zhang Y, Sigaeva A, Hansen JN, Gao J, Parker JA, Obernier K, Clark T, Chen JY, Metallo C, Lundberg
    E, Ideker T, Krogan N, Mali P. A perturbation cell atlas of human induced pluripotent stem cells.
    bioRxiv 2024 Nov 4; 2024.11.03.621734. PMCID PMC11580897. doi:10.1101/2024.11.03.621734 - listed as
    a Related Publication on the CM4AI Dataverse releases.
  - 'Clark T, Mohan J, Schaffer L, Obernier K, et al. Cell Maps for Artificial Intelligence: AI-Ready
    Maps of Human Cell Architecture from Disease-Relevant Cell Lines. bioRxiv, May 2024, doi:10.1101/2024.05.21.589311
    - the project description publication, cited as the Related Publication on every captured release
    and required for attribution.'
  - Initial datasets, tools and standards were made available at the CM4AI CodeFest in March 2024, accompanied
    by detailed tutorials explaining how the data were derived and integrated and providing production-ready
    software for producing the datasets; the CodeFest trained 38 registrants.
use_repository:
- id: d4d:CM4AI_use_repo_portal
  name: CM4AI web portal
  repository_url: https://cm4ai.org/
  repository_details:
  - The open-access CM4AI web portal, built on the U-BRITE platform, disseminates CM4AI-generated data,
    maps and tools, and hosts the project's Data Releases, Tools, Product Documentation, Publications
    and Learning sections.
- id: d4d:CM4AI_use_repo_dataverse
  name: University of Virginia Dataverse (LibraData) CM4AI collection
  repository_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  repository_details:
  - 'The releases are published in the "Cell Maps for Artificial Intelligence" collection within University
    of Virginia Dataverse > LibraData: UVa''s Scholarly Research > School of Medicine. LibraData is the
    University of Virginia''s instance of Dataverse, an NIH-approved generalist repository.'
intended_uses:
- id: d4d:CM4AI_intended_uses
  name: Intended uses stated by the publisher
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations
  usage_notes: The current release is stated to be most suitable for bioinformatics analysis of the individual
    datasets, and to require domain expertise for meaningful analysis.
prohibited_uses:
- id: d4d:CM4AI_prohibited_clinical
  name: Clinical decision-making and patient care
  description: These laboratory data are not to be used in clinical decision-making or in any context
    involving patient care without appropriate regulatory oversight and approval.
  prohibition_reason:
  - 'The data are laboratory measurements on cell lines and the release metadata records FDA Regulated:
    No.'
- id: d4d:CM4AI_prohibited_commercial
  name: Commercial use without separate licensing
  description: The dataset license, CC BY-NC-SA 4.0, prohibits use of the material for commercial purposes.
    Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question).
  prohibition_reason:
  - Data packages are licensed under Creative Commons CC-BY-NC-SA 4.0 terms; a Data Access Committee supervises
    ethical matters related to dataset distribution and potential dual licensing for commercial use.
future_use_impacts:
- id: d4d:CM4AI_future_impacts
  name: Anticipated impacts of future use
  impact_details:
  - The project's stated intention is that CM4AI become a highly transformative platform for ethical,
    explainable, and interpretable biomedical AI, deepen understanding of processes of human disease and
    health, help train a new generation of researchers, enable development of novel cures, and assist
    researchers and clinicians in equitably improving human lives.
  - The Ethics module's approach involves anticipating potential applications of the data and derived
    AI/ML systems, and integrating them into data governance frameworks to optimize benefits and mitigate
    potential risks, promoting their use for the collective good.
  - Because the releases are interim and their content will change quarterly through the end of the project,
    analyses should record the exact release DOI and version used.
distribution_formats:
- id: d4d:CM4AI_dist_format_zip
  name: ZIP archives
  description: Data components are distributed as ZIP archives, one per modality and cell line or treatment
    condition (for example cm4ai_ifimages_MDA-MB-468_paclitaxel.zip, cm4ai_mass-spec_KOLF2.zip, cm4ai_perturb-seq_KOLF2_cell_atlas.zip,
    cm4ai_apms_MDA-MB-468_vorinostat.zip). Each file carries an MD5 checksum in the Dataverse file metadata.
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
- id: d4d:CM4AI_dist_format_rocrate
  name: RO-Crate metadata (JSON / JSON-LD)
  description: Releases carry RO-Crate metadata files, including a release-level RO-Crate with pointers
    to sub RO-Crates (release-ro-crate-metadata.json) and per-component ro-crate-metadata.json files.
    Metadata is expressed in JSON-LD using vocabularies from Schema.org, EVI and other public ontologies,
    with RDF-XML serializations also provided on FAIRSCAPE landing pages.
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
- id: d4d:CM4AI_dist_format_html
  name: HTML datasheet and provenance graphs
  description: The June 2025 release includes release-ro-crate-datasheet.html, an HTML datasheet summarizing
    key release information, and per-component provenance graph HTML files (for example Images-paclitaxel-provenance-graph.html,
    mass-spec-cancer-cells-provenance-graph.html). The provenance graph HTML files require download to
    view properly and do not display in the Dataverse preview.
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
distribution_dates:
- id: d4d:CM4AI_dist_dates
  name: Release publication dates
  release_dates:
  - May 2024 Data Release (doi:10.18130/V3/DXWOS5, University of Virginia Dataverse V1)
  - March 2025 Data Release (Beta), publication date 2025-03-03, doi:10.18130/V3/B35XWX
  - June 2025 Data Release (Beta), publication date 2025-07-01, doi:10.18130/V3/F3TD5R
  - October 2025 Data Release (Beta), publication date 2025-10-31, doi:10.18130/V3/K7TGEM
  - June 2026 Data Release (Beta), publication date 2026-06-17, doi:10.18130/V3/HIGT4C
  description: 'CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input
    data streams. The CM4AI data-releases page labels HIGT4C as the June 2026 Data Release (Beta) while
    displaying "Released on: June 17, 2025"; the Dataverse citation metadata for the same DOI gives publication
    date 2026-06-17 and a 2026 citation year. Both statements are recorded here as found.'
license_and_use_terms:
  id: d4d:CM4AI_license_terms
  name: License and use terms
  license_terms:
  - Dataset licensed for reuse under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    license (CC BY-NC-SA 4.0), https://creativecommons.org/licenses/by-nc-sa/4.0/.
  - Under the CC BY-NC-SA 4.0 deed the licensee is free to share (copy and redistribute the material in
    any medium or format) and adapt (remix, transform, and build upon the material), subject to Attribution
    (give appropriate credit, provide a link to the license, and indicate if changes were made), NonCommercial
    (may not use the material for commercial purposes), ShareAlike (contributions built upon the material
    must be distributed under the same license as the original), and no additional restrictions.
  - Attribution is required to the copyright holders and the authors, and to the Cell Maps for Artificial
    Intelligence project as referenced in the datasets.
  - Any publications referencing this data or derived products should cite the Related Publication as
    well as directly citing the data collection.
  - 'Dataverse dataset terms state: "Our Community Norms as well as good scientific practices expect that
    proper credit is given via citation. Please use the data citation shown on the dataset page."'
  - 'All CM4AI integration and packaging software is freely available and licensed under nonrestrictive
    open-source licenses: BSD-3 for the Tools data integration pipeline and MIT for FAIRSCAPE.'
  - The Bridge2AI Data Sharing and Dissemination Working Group developed a Code of Conduct that outlines
    basic requirements for participants in the Bridge2AI Open House to access B2AI data, including CM4AI
    datasets, and to which participants attest and commit prior to accessing the data.
  - 'The captured Dataverse releases mark every file as File Access: Public; no request-access or credentialing
    step is recorded on the release pages themselves.'
  data_use_permission:
  - general_research_use
  - no_commercial_use
ip_restrictions:
  id: d4d:CM4AI_ip_restrictions
  name: Intellectual property restrictions
  restrictions:
  - Copyright to the release data is held by the Regents of the University of California except where
    otherwise noted; the March 2025 release states "This data is Copyright (c) 2025 The Regents of the
    University of California except where otherwise noted."
  - Spatial proteomics raw image data is copyright of The Board of Trustees of the Leland Stanford Junior
    University.
  - Commercial use requires a separate license negotiation with the copyright holder - UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question.
  - A Data Access Committee supervises ethical matters related to dataset distribution and potential dual
    licensing for commercial use.
  - Copyright to the FAIRSCAPE software is held by the Rector and Board of Visitors of the University
    of Virginia and it is released under the MIT License.
  - Dataverse pages carry the notice "Copyright (c) 2025, by the Rector and Visitors of the University
    of Virginia".
regulatory_restrictions:
  id: d4d:CM4AI_regulatory
  name: Regulatory and governance restrictions
  confidentiality_level: unrestricted
  governance_committee_contact: Jillian Parker (jillianparker@health.ucsd.edu)
  regulatory_restrictions:
  - 'Human Subjects: No'
  - 'De-identified Samples: Yes'
  - 'FDA Regulated: No'
  - The Dataverse collection hosting the releases displays "This collection is under review for potential
    modification in compliance with Administration directives", and the CM4AI web site carries the same
    notice for the repository.
  description: Data Governance and Ethics fields recorded on the CM4AI Dataverse release pages. The Data
    Governance Committee contact is Jillian Parker (jillianparker@health.ucsd.edu). The Ethics team worked
    with the Data Acquisition, Tools and Standards modules to develop a plan for ethical preparation,
    licensing, dissemination and data-access supervision of CM4AI datasets, balancing openness of the
    data with protection of intellectual property and supervision of potential commercialization efforts.
ethical_reviews:
- id: d4d:CM4AI_ethical_review
  name: CM4AI ethical review
  contact_person: Vardit Ravitsky (ravitskyv@thehastingscenter.org)
  review_details:
  - 'Ethical Review contacts recorded on the CM4AI Dataverse releases: Vardit Ravitsky (ravitskyv@thehastingscenter.org)
    and Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca).'
  - The Ethics team employs a methodology inspired by Value-Sensitive Design, creating an axiological
    repository - a repository of values - to guide the articulation of design standards and expectations
    for the responsible design of datasets and AI technologies.
  - The Ethics team formulated the CM4AI Life Cycle, a framework designed to elucidate governance milestones
    throughout the data generation and AI system development processes, embedding ethical considerations
    at every phase.
  - The Ethics pillar supported the Bridge2AI Ethics Working Group and the Bridge2AI Data Sharing and
    Dissemination Working Group in developing a Code of Conduct, which outlines basic requirements for
    participants in the Bridge2AI Open House to access B2AI data (including CM4AI datasets), to attest
    and commit to prior to accessing the data.
  - The Ethics team conducts mixed empirical research combining qualitative and quantitative methods to
    capture community insights, and is developing tools to enhance awareness of the ethical, legal and
    social ramifications associated with CM4AI data and consequent AI systems.
  reviewing_organization: CM4AI Ethics Module (The Hastings Center; Simon Fraser University)
human_subject_research:
  id: d4d:CM4AI_human_subjects
  name: Human subject research status
  involves_human_subjects: false
  regulatory_compliance:
  - 'Human Subjects: No (recorded in the Data Governance & Ethics section of each release)'
  - 'FDA Regulated: No'
  description: CM4AI data are stated to be distinctive within Bridge2AI in that they are non-clinical,
    derived from tissue cultures, and are considered to be de-identified as they cannot be matched, with
    current knowledge, to a human subject. The underlying cell lines are commercially or institutionally
    available human cell lines described by the project as ethically sourced.
is_deidentified:
  id: d4d:CM4AI_deidentification
  name: De-identification status
  identifiable_elements_present: false
  method: 'Not applicable in the usual sense: the data are laboratory measurements on established human
    cell lines rather than on identifiable human subjects.'
  deidentification_details:
  - 'De-identified Samples: Yes, as recorded in each release''s Data Governance & Ethics section.'
  - CM4AI data "are non-clinical (from tissue cultures) and are considered to be de-identified as they
    cannot be matched, with current knowledge, to a human subject".
  - 'Donor-level attributes reported for the source cell lines are those published with the lines themselves:
    MDA-MB-468 from a 51-year-old black female with metastatic mammary adenocarcinoma, and KOLF2.1J from
    a healthy male Northern European donor.'
