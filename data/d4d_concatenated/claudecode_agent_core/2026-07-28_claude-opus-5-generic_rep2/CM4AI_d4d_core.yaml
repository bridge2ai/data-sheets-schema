id: d4d:CM4AI
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: 'Cell Maps for Artificial Intelligence (CM4AI; CM4AI.org) is the Functional Genomics Grand
  Challenge / Data Generation Project of the U.S. National Institutes of Health Bridge2AI program. Its
  stated mission is to produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
  data collected for human cell lines, to enable transformative biomedical AI research, and to use these
  maps toward the grand challenge of interpretable genotype-phenotype learning.

  This record describes the CM4AI data release series published as a collection in the University of Virginia
  Dataverse (LibraData), the University of Virginia''s archival data repository and an NIH-approved generalist
  repository. CM4AI delivers machine-readable hierarchical maps of cell architecture as AI-ready data,
  together with quarterly data releases of map-input data streams. The releases carry multimodal data
  generated from chromatin modifiers, metabolic enzymes, and other proteins involved in cancer, neuropsychiatric,
  and cardiac disorders, measured in disease-relevant cell lines under treated and untreated conditions:
  protein-protein interaction data from affinity purification mass spectrometry (AP-MS) and size-exclusion
  chromatography mass spectrometry (SEC-MS); spatial proteomics from immunofluorescence (IF) confocal
  imaging; and single-cell CRISPR/Cas9 genetic perturbation (perturb-seq) data. The cell lines are the
  triple-negative breast cancer line MDA-MB-468 (with and without paclitaxel or vorinostat treatment)
  and the induced pluripotent stem cell line KOLF2.1J (undifferentiated and differentiated to neural progenitor
  cells, neurons, and cardiomyocytes).

  Input data streams are integrated by the Multi-Scale Integrated Cell (MuSIC) software pipeline using
  deep-learning embeddings and community detection, and outputs are packaged with provenance graphs and
  rich metadata as AI-ready datasets in RO-Crate format using an extended client-server version of the
  FAIRSCAPE framework, which assigns persistent ARK identifiers and computes EVI evidence-graph provenance
  entailments.

  The CM4AI project portal reports the following aggregate figures for the data generation effort: 1,374
  protein interactions; 53,788 immunofluorescent images; 7,023 total proteins investigated; 11,739 genes
  targeted; and 21.4 TB of data volume. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT
  Austin, UA Birmingham, Simon Fraser University, and the Hastings Center, as part of the NIH Bridge2AI
  program.'
