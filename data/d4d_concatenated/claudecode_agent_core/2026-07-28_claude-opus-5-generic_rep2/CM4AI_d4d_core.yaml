purposes:
- id: d4d:CM4AI_purpose_main
  name: Interpretable genotype-phenotype learning
  response: The CM4AI data generation project seeks to map the spatiotemporal architecture of human cells
    and use these maps toward the grand challenge of interpretable genotype-phenotype learning. In genomics
    and precision medicine, machine learning models are often "black boxes", predicting phenotypes from
    genotypes without understanding the mechanisms by which such translation occurs. The project addresses
    this deficiency through a coordinated effort involving three complementary mapping approaches - proteomic
    mass spectrometry, cellular imaging, and genetic perturbation via CRISPR/Cas9 - creating a library
    of large-scale maps of cellular structure/function across demographic and disease contexts.
- id: d4d:CM4AI_purpose_ai_ready
  name: Ethical, FAIR, AI-ready data production
  response: CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture,
    inferred from multimodal data collected for human cell lines, to enable transformative biomedical
    AI research. CM4AI defines AI-ready biomedical data as fully characterized FAIR data of known provenance
    that can be ethically and reliably processed by AI applications; whose models and software are available
    and well-described for validation and re-use; and whose predictions may be fully explained and interpreted
    to the user as needed. The stated criteria are FAIR, Provenanced, Characterized, Explainable, and
    Ethical.
- id: d4d:CM4AI_purpose_visible_ml
  name: Enabling visible machine learning systems
  response: The data are intended to broadly stimulate research and development in "visible" machine learning
    systems informed by multi-scale cell and tissue architecture - systems that are not black boxes but
    are built directly on knowledge maps of cell and tissue architecture. Cell maps have been used in
    AI tools for "visible machine learning" or "visible neural networks" (VNNs) to interrogate how protein
    assemblies in the cell affect cell-level phenotype predictions.
tasks:
- id: d4d:CM4AI_task_ppi_mapping
  name: Protein-protein interaction mapping
  response: 'Map protein-protein interactions of chromatin regulators under different conditions (cancer
    cells: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes)
    using AP-MS on endogenously tagged cell lines and size-exclusion chromatography coupled to mass spectrometry
    (SEC-MS) for proteome-wide complex and interaction mapping, as two orthogonal mass-spectrometry-based
    approaches.'
- id: d4d:CM4AI_task_spatial_proteomics
  name: Spatial proteomics mapping
  response: Map the spatial subcellular organization of chromatin modifiers, their interactors and key
    signaling molecules involved in cancer, using the Human Protein Atlas resource of antibodies and immunofluorescence
    confocal microscopy, with automated fixation and permeabilization protocols established for the MDA-MB-468
    and KOLF2 cell lines.
- id: d4d:CM4AI_task_genetic_perturbation
  name: Genetic perturbation mapping
  response: Perform single-cell CRISPR screens perturbing chromatin regulators in MDA-MB-468 cells under
    three conditions (no treatment, paclitaxel or vorinostat) and in KOLF2.1J iPSCs, using a CRISPR lentiviral
    library targeting 100 chromatin factors with 6 guide RNAs per gene and inducible dCas9 lines, read
    out with the 10x Genomics 3'HT kit; and to build an expressed genome-scale CRISPRi Perturbation Cell
    Atlas mapping transcriptional and fitness phenotypes for 11,739 targeted genes.
- id: d4d:CM4AI_task_map_integration
  name: Multimodal cell map construction
  response: Integrate the multimodal input data streams into hierarchical cell maps - directed acyclic
    graphs in which each node represents an assembly of proteins in proximity at a given scale - through
    the Multi-Scale Integrated Cell (MuSIC) pipeline, using self-supervised embedding approaches from
    deep learning followed by algorithmic community detection at multiple resolutions.
- id: d4d:CM4AI_task_ai_readiness_packaging
  name: AI-readiness packaging and provenance
  response: 'Package data, software, metadata and provenance graphs for AI-readiness using the FAIRSCAPE
    framework: create RO-Crate packages via FAIRSCAPE-CLI, register them on the FAIRSCAPE server, assign
    persistent globally unique ARK identifiers to crates and their components, and compute end-to-end
    provenance entailments expressed in the EVI Evidence Graph Ontology.'
addressing_gaps:
- id: d4d:CM4AI_gap_black_box
  name: Uninterpretable genotype-phenotype models
  response: Machine learning models show great promise in analyzing the human genome to make predictions,
    but the inner workings of these models are typically difficult-to-interpret "black boxes". CM4AI generates
    a resource of matched data and tools to enable the creation of "visible" ML systems built directly
    on knowledge maps of cell and tissue architecture.
- id: d4d:CM4AI_gap_uncharted_architecture
  name: Incomplete knowledge of subcellular architecture
  response: Knowledge of how the proteins of the human genome are organized within cells is still evolving.
    CM4AI addresses this by interrogating cells with matched multimodal datasets and integrating them
    into hierarchical maps spanning from large assemblies representing cell compartments to small assemblies
    of proteins in close proximity.
- id: d4d:CM4AI_gap_ai_readiness
  name: Absence of ethical, provenanced, AI-ready biomedical data
  response: AI-readiness has been defined in multiple ways in the literature, and in all cases places
    significant requirements on datasets used to train and to be analyzed by AI/ML models. CM4AI's software
    pipeline and AI-readiness framework provide reusable enabling capabilities that establish FAIRness
    with rich metadata and persistent globally unique identifiers, machine-readable provenance graphs
    resolvable for all results, and characterization and validation of all datasets and data elements
    mapped to public ontology vocabularies.
- id: d4d:CM4AI_gap_workforce
  name: Gaps in the biomedical AI/ML workforce
  response: The Skills and Workforce Development module works to enhance the biomedical AI/ML workforce
    by recruiting and training a diverse group of participants in the scientific approach, data standards,
    and tools of CM4AI, because new training is needed to allow researchers to leverage the datasets produced
    by Bridge2AI and other programs.
