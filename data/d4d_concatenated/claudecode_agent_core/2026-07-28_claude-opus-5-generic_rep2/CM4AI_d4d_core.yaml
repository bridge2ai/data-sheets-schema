  name: U2OS multimodal cell map data deposits (Schaffer et al. 2025)
  archival: true
  description: Data resources of the associated Nature publication "Multimodal cell maps as a foundation
    for structural and functional genomics" (Nature 642:222-231, 2025; doi:10.1038/s41586-025-08878-3),
    which acknowledges funding from the Bridge2AI Program (NIH Common Fund; OT2 OD032742) among others.
    These deposits describe a U2OS osteosarcoma cell map and are a distinct data collection from the CM4AI
    Dataverse release series described by this record; they are listed here as related external resources
    and are not part of the CM4AI releases. The Multiscale Integrated Cell web portal provides links to
    all major data and derived resources associated with that study, including AP-MS protein interactions,
    protein IF images, SEC data, and the online interactive U2OS cell map.
