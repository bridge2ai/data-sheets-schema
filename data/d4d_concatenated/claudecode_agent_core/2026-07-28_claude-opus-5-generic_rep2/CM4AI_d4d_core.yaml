instances:
- id: d4d:CM4AI_instance_perturbseq_ipsc
  name: CRISPRi Perturbation Cell Atlas in KOLF2.1J iPSCs
  instance_type: single-cell CRISPRi perturbation with transcriptional and fitness phenotype readout
  counts: 11739
  description: An expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J
    human induced pluripotent stem cells (hiPSCs), mapping transcriptional and fitness phenotypes associated
    with 11,739 targeted genes. The count given here is the number of targeted genes, which is also the
    figure the CM4AI portal reports as "genes targeted". Findings were validated via phenotypic, protein-interaction,
    and metabolic tracing assays. Raw sequence data for this atlas are released as a separate component.
  label: false
- id: d4d:CM4AI_instance_perturbseq_tnbc
  name: Perturb-seq in MDA-MB-468 triple-negative breast cancer cells
  instance_type: single-cell CRISPRi perturbation with transcriptional readout
  counts: 200
  description: Perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment. The CM4AI
    data-releases page describes the curated TNBC datasets as including "Perturb-seq of 200 genes". The
    project preprint describes single-cell CRISPR screens perturbing 100 chromatin regulators in MDA-MB-468
    cells under three conditions (no treatment, paclitaxel, vorinostat), using a CRISPR lentiviral library
    with 6 guide RNAs per gene and inducible dCas9, read out with the 10x Genomics 3'HT kit. These two
    figures describe different reporting scopes and are recorded as stated rather than reconciled.
  label: false
- id: d4d:CM4AI_instance_secms
  name: SEC-MS protein elution profiles
  instance_type: size-exclusion chromatography mass spectrometry protein elution profile
  counts: 7000
  description: SEC-MS data for MDA-MB-468 breast cancer cells with and without treatment, undifferentiated
    KOLF2.1J iPSCs, and iPSC-derived neural progenitor cells, neurons, and cardiomyocytes. The CM4AI data-releases
    page reports SEC-MS "capturing ~7,000 proteins" for both the iPSC-derived and the TNBC flagship datasets;
    the count recorded here is that approximate figure. The project preprint additionally reports that
    SEC-MS in MDA-MB-468 cells identified 72 of 100 chromatin modifiers, 52 of them integral components
    of protein complexes, detected PPI profiles of over a thousand complexes, and uncovered more than
    700 protein complexes in both parental KOLF2 iPSCs and differentiated neurons.
  label: false
- id: d4d:CM4AI_instance_if_images
  name: Immunofluorescence subcellular images of MDA-MB-468 cells
  instance_type: four-channel immunofluorescence confocal microscopy image
  counts: 464
  description: 'Spatial localization images of proteins of interest in the breast cancer cell line MDA-MB-468,
    untreated and treated with paclitaxel or vorinostat, imaged by immunofluorescence-based staining (ICC-IF)
    and confocal microscopy in the Lundberg Lab at Stanford University. Nuclei were stained with DAPI
    (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow channel); microtubules
    with tubulin antibody (red channel); and an antibody against the protein of interest (green channel).
    The protein count recorded here, 464, is the figure carried by the June 2025, October 2025 and June
    2026 release file descriptions. Three different protein counts appear in the sources at different
    scopes and are all retained here rather than reconciled: the March 2025 v0.6-beta image archives state
    563 proteins of interest; the CM4AI data-releases page states "IF images for 523 proteins" for the
    curated TNBC datasets; and the CM4AI portal reports 53,788 immunofluorescent images in aggregate for
    the project.'
  label: false
- id: d4d:CM4AI_instance_apms
  name: AP-MS interactomes in MDA-MB-468 cells
  instance_type: affinity purification mass spectrometry protein interaction measurement
  description: AP-MS data for MDA-MB-468 breast cancer cells with treatment, released for the first time
    in the June 2026 Data Release as separate paclitaxel-treated and vorinostat-treated archives. The
    CM4AI data-releases page had listed "AP-MS interactomes" among the curated TNBC datasets as "coming
    soon". The project preprint reports that 17 genes were endogenously tagged in MDA-MB-468 and AP-MS
    data acquired under three conditions (untreated, paclitaxel and vorinostat treated), with 34 additional
    genes in the process of being tagged at the time of writing. The CM4AI portal reports 1,374 protein
    interactions and 7,023 total proteins investigated in aggregate for the project.
  label: false
- id: d4d:CM4AI_instance_cell_maps
  name: Hierarchical cell maps
  instance_type: hierarchical directed acyclic graph of protein assemblies
  description: 'The project''s target output: cell maps are hierarchical directed acyclic graphs where
    each node represents an assembly of proteins in proximity at a given scale, spanning from large assemblies
    representing cell compartments (for example nucleus, mitochondria) to small assemblies of proteins
    in close proximity (for example protein complexes or subunits). Cell maps are shared via the Network
    Data Exchange (NDEx) and can be visualized in a web browser or accessed via tools such as Cytoscape,
    HiView, and the Python ndex2 library. Computed cell maps are explicitly stated as not included in
    the captured Dataverse releases.'
  label: false
