  name: Cell-line derivation limits population representativeness
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the population at large.
  affected_subsets:
  - All released modalities, which derive from the MDA-MB-468 and KOLF2.1J cell lines only.
