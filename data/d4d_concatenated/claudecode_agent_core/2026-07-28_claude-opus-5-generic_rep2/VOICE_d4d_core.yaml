  distributions:
  - id: https://physionet.org/content/b2ai-voice/3.1.0/features/
    name: Adult derived audio features
    description: 'Dense derived audio features stored as Parquet files, plus plain-text feature tables and their JSON data dictionaries. Each Parquet element carries participant_id, session_id, task_name, n_frames and the feature tensor. Files: ppgs.parquet (n=29,289; 40 phoneme categories, 40xT at 100 Hz), sparc_ema.parquet (n=28,640; Tx12 electromagnetic articulography estimates for six articulators), sparc_loudness.parquet (n=31,855), sparc_periodicity.parquet (n=31,872), sparc_pitch.parquet (n=31,872; F0 range 50-550 Hz), torchaudio_spectrogram.parquet (n=29,278; 201xT), torchaudio_mel_spectrogram.parquet (n=29,278; 60xT), torchaudio_mfcc.parquet (n=29,278; 60xT), torchaudio_pitch.parquet (n=32,522; pitch range 80-500). Plain-text files: audio_quality_metrics.tsv and static_features.tsv, each with one row per audio recording.'
    path: features/
  - id: https://physionet.org/content/b2ai-voice/3.1.0/phenotype/
    name: Adult phenotype tables
    description: Tab-delimited phenotype tables with paired JSON data dictionaries, organised into confounders, demographics, diagnosis (airway_stenosis, amyotrophic_lateral_sclerosis, anxiety, benign_lesions, bipolar_disorder, cognitive_impairment, control, copd_and_asthma, depression, glottic_insufficiency, laryngeal_cancer, laryngeal_dystonia, laryngitis, muscle_tension_dysphonia, parkinsons_disease, precancerous_lesions, unexplained_chronic_cough, unilateral_vocal_fold_paralysis), enrollment (eligibility, enrollment_form, participant), questionnaire (adhd_adult, custom_affect_scale, dsm5_adult, dyspnea_index, gad7_anxiety, leicester_cough_questionnaire, panas, phq9, productive_vocabulary, psychiatric_history, ptsd_adult, vhi10, voice_perception) and task (acoustic_task, harvard_sentences, random_item_generation, recording, session, stroop, winograd) subfolders. Rows are present for a participant only if at least one column is not missing, and participants with repeated visits may have more than one row.
    path: phenotype/
  - id: https://physionet.org/content/b2ai-voice/3.1.0/metadata/
    name: Adult recording metadata
    description: Introduced in version 3.1.0. Contains a Parquet binary file and its corresponding data dictionary with information about each recording, including task instructions and prompts as well as the microphone used and its gain.
    path: metadata/
  dialect:
    delimiter: \t
    header: 'true'
- id: https://physionet.org/content/b2ai-voice-pediatric/
  name: Bridge2AI-Voice Pediatric Dataset
  title: Bridge2AI-Voice Pediatric Dataset
  description: The pediatric component of the Bridge2AI-Voice dataset, published on PhysioNet as a separate project from the adult b2ai-voice dataset rather than as a version of it; the two releases are distinct cohorts collected under a separate pediatric protocol. Version 1.1.0 contains derived audio features for 23,533 recordings collected from 300 participants aged 2-18. Pediatric participants were recruited at the Hospital for Sick Children (SickKids), either as patients and healthy volunteers presenting at the hospital or through research postings, with inclusion criteria of 2 to 18 years of age and English proficiency, and exclusion of participants over 18 or who were non-verbal. All data were collected through reproschema-ui on tablets in a single session per participant, with a headset used for most recordings and the built-in tablet microphone used where headphones were not tolerated or complex medical conditions precluded them.
