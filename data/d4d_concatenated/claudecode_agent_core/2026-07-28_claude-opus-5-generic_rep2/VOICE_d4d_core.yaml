  - Bridge2AI-Voice is supported by NIH grant OT2OD032720 through the NIH Bridge2AI Common Fund programme.
- id: https://b2ai-voice.org/maintainer/consortium
  name: Bridge2AI-Voice consortium and Data Access Compliance Office
  role: academic_institution
  maintainer_details:
  - For questions, suggestions or feedback related to the dataset, the documentation directs users to email the project; the curator of the data may be contacted through the address given on the documentation site.
  - Requests for access to raw audio are handled by the access committee at DACO@b2ai-voice.org.
  - For questions regarding the dataset itself, PhysioNet directs users to contact the corresponding author listed on the project sidebar.
- id: https://b2ai-voice.org/maintainer/physionet
  name: PhysioNet and the MIT Laboratory for Computational Physiology
  role: academic_institution
