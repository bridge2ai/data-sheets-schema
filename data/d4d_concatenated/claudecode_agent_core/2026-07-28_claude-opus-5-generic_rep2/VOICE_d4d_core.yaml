purposes:
- id: https://b2ai-voice.org/purpose/flagship-voice-database
  name: Build a flagship ethically sourced voice database linked to health information
  response: To generate a large, multi-institutional, ethically sourced and diverse database of human voice, speech and respiratory sounds linked to multimodal health biomarkers, in order to fuel voice AI research and build predictive models to assist in screening, diagnosis and treatment of a broad range of diseases.
- id: https://b2ai-voice.org/purpose/clinical-ml
  name: Enable clinically applicable machine learning from voice
  response: To enable the development, benchmarking or validation of clinically applicable machine-learning models for diagnosing a wide range of health conditions using voice data, including vocal pathologies and neurological, psychiatric, respiratory and pediatric voice disorders, and to facilitate use of voice as a non-invasive, cost-effective biomarker for screening, diagnosis and monitoring.
- id: https://b2ai-voice.org/purpose/audiomics-standards
  name: Establish standards for audiomics
  response: To introduce and standardise the field of acoustic biomarkers ('audiomics') by developing new standards of acoustic and voice data collection and analysis for voice AI research, creating new bioinformatics standards for voice data interoperability, and building benchmarks of diversity metrics that minimise the risk of algorithmic bias.
- id: https://b2ai-voice.org/purpose/infrastructure-and-ethics
  name: Build collection infrastructure and ethical governance
  response: To develop software and cloud infrastructure for automated, non-invasive, user-friendly voice data collection through a smartphone application; to implement federated learning so multi-institutional data can be analysed while minimising data sharing and preserving patient privacy; and to define ethical and legal norms safeguarding participants' data while supporting data-sharing efforts, including new guidelines for consenting to voice data collection and sharing.
- id: https://b2ai-voice.org/purpose/workforce
  name: Teaming and workforce development
  response: To build bridges between medical voice research, acoustic engineering and the AI/ML world, and to develop a curriculum and community of voice AI researchers, especially those from underserved communities, with competency assessment and mentorship.
- id: https://b2ai-voice.org/purpose/target-size
  name: Stated target dataset size
  description: Recorded because the sources in the bundle state different targets for the size of the dataset being built.
  response: Sources in the documentation bundle state different enrolment targets. The project documentation describes a flagship standardised dataset of 10,000 voices linked to health information and lists an anticipated enrolment count of 10,000 by 2027; the 2024 audiomics viewpoint describes a primary deliverable of a publicly available database of 30,000 human voices; and the IRB protocol states a sample size of 30,000 participants overall, with 5,000 to be enrolled through USF high-volume expert and community outreach clinics and complete multi-modal acquisition for up to 5,000 participants per disease category and controls.
tasks:
- id: https://b2ai-voice.org/task/disease-detection
  name: Disease detection and classification from voice
  response: Training machine-learning models for disease detection and classification using voice data. Labels include diagnostic categories such as vocal pathologies, neurological disorders, psychiatric conditions and respiratory disorders.
- id: https://b2ai-voice.org/task/pretraining-benchmarking
  name: Model pretraining, fine-tuning, benchmarking and validation
  response: The dataset can be used for AI model pretraining, fine-tuning, benchmarking or validation of clinically applicable AI/ML models.
- id: https://b2ai-voice.org/task/screening-monitoring
  name: Screening, diagnosis and monitoring via voice biomarkers
  response: Supporting clinical research in disease screening, diagnosis and monitoring through voice biomarkers, including early disease detection, continuous disease monitoring and personalised treatment strategies.
addressing_gaps:
- id: https://b2ai-voice.org/gap/small-datasets
  name: Small, poorly documented voice datasets
  response: Previous studies on machine-learning-based voice diagnosis produced promising results, but their sample sizes were too small or they lacked the key metadata needed for training robust, clinically useful models. When machine-learning applications for screening and diagnosis of laryngeal cancer were reviewed, most studies reported training datasets of fewer than 300 patients and only two studies used more than one data modality.
- id: https://b2ai-voice.org/gap/lack-of-standards
  name: Absence of standards for voice data collection
  response: Comparing studies and pooling data are challenging because of the lack of standards in how voice and speech data are collected and measured, which precludes meta-analysis and limits external validity and clinical usability.
- id: https://b2ai-voice.org/gap/private-industry-data
  name: Private industry datasets that cannot be audited
  response: Within industry, voice datasets are often private, limiting the ability to audit machine-learning models and the accuracy of training data labels, and preventing external auditing of training datasets to ensure fair representation of diverse populations. Industry has access to vast amounts of voice data from users but lacks access to accurate clinical data or demographic information.
- id: https://b2ai-voice.org/gap/multimodal-linkage
  name: Voice data not linked to other health biomarkers
  response: For voice to emerge as a biomarker of health there is a pressing need for a large, high-quality, multi-institutional and diverse voice database linked to other health biomarkers of different modalities - demographics, imaging, genomics, risk factors - to fuel voice AI research and answer tangible clinical questions.
- id: https://b2ai-voice.org/gap/pediatric-data
  name: Scarcity of pediatric voice datasets
  response: Despite the clinical importance of detecting pediatric communication disorders such as autism spectrum disorder and speech delays, the availability of large-scale pediatric voice datasets remains limited. Data collection in pediatric populations poses unique challenges such as privacy issues, consent processes and the need for developmentally appropriate tasks, and adult normative data cannot be generalised to pediatric populations because the respiratory system and larynx undergo rapid maturation throughout childhood.
