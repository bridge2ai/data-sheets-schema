errata:
- id: https://b2ai-voice.org/erratum/none-declared
  name: Erratum status
  erratum_details:
  - There is no erratum. A changelog for each dataset version is published online with the dataset metadata.
- id: https://b2ai-voice.org/erratum/authorship-correction
  name: Authorship list correction in version 2.0.1
  erratum_details:
  - The adult release version 2.0.1, published 18 August 2025, consisted of corrections in the authorship list.
  - Version 3.1.0 fixed broken parquet files from the previous release and back-filled validated diagnosis information across conditions.
updates:
  id: https://b2ai-voice.org/updates/plan
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details:
  - Further versions of the dataset will be released on a semi-annual basis. These updates will be distributed as new versions of the dataset on the hosting platform.
  - Users will be notified through news items on the platform as well as through standard communication channels.
  - The dataset is released as static versions rather than being dynamically updated.
  - Further releases will contain additional data, including additional categories of disease that are not equally represented in the current public releases; the documentation states that the study population will expand to include a pediatric cohort and data collection in Spanish, with inclusion and exclusion criteria and study metadata updated at that time.
retention_limit:
  id: https://b2ai-voice.org/retention/limits
  name: Retention limits
  retention_period: Indefinite for contributed research data; a maximum of 10 years after study completion for identifiable data held at each institution; a minimum of 5 years after study completion for consent documents
  retention_details:
  - Once data is contributed, the data will be retained as long as it is useful for research purposes, possibly indefinitely.
  - Identifiable data and datasheets linking participant numbers to participant information will be kept in each institution on local cloud storage for a maximum of 10 years after study completion, after which identifiable data will be destroyed; this is the responsibility of each local principal investigator.
  - The USF IRB requires de-identified study data and original consent forms to be stored for a minimum of 5 years after the completion of the study; original paper consent documents cannot be destroyed until 5 years after study completion.
  - All entries to the REDCap recruitment screening system are deleted once patients are enrolled, or within 90 days of their submission, whichever comes first.
  - Identifiers collected under the partial HIPAA waiver will be destroyed at the earliest opportunity consistent with the conduct of the research.
  - Under the Data Transfer and Use Agreement, recipients must destroy the Data in accordance with provider instructions two years after the start date, upon completion of the project, upon termination, or upon expiration of the applicable ethics approval, whichever occurs first, and submit written certification of destruction within thirty days.
version_access:
  id: https://b2ai-voice.org/version-access/policy
  name: Version access policy
  versions_available:
  - 'Adult PhysioNet releases: 1.1 (2025-01-17), 2.0.0 (2025-04-16), 2.0.1 (2025-08-18), 3.0.0 (2025-12-16), 3.1.0 (2026-05-01)'
  - 'Pediatric PhysioNet releases: 1.0.0 (2025-12-17), 1.1.0 (2026-05-01)'
  - An earlier version of the feature-only dataset remains available on Health Data Nexus (DOI 10.57764/qb6h-em84)
  version_details:
  - By default, older versions of the dataset will continue to be supported, hosted and made available to researchers. Each version of the dataset has a unique DOI. The dataset publishers reserve the right to remove access to older versions.
  - The PhysioNet page for adult version 1.1 states that the files for that version are no longer available and directs users to the latest version, which is consistent with the publishers' reserved right to remove access to older versions.
  - A changelog for each dataset version is published online with the dataset metadata.
  - The documentation advertises the current releases as adult v3.1.0 and pediatric v1.1.0, with voice available upon request.
extension_mechanism:
  id: https://b2ai-voice.org/extension/mechanism
  name: Extension and contribution mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
  - For dataset extensions and augmentations, it is possible for others to publish a derivative dataset on the hosting platform which references the original source; these derivative datasets may be made available under the same conditions as the source data.
  - For augmentations to the code used to produce the data, the open-source repositories have discussion forums and issue pages which allow for public discussion of data preprocessing, and a pull request mechanism for contributing improvements to the data preprocessing code.
  - The documentation invites collaboration and contribution through the project's Join Us and Contact Us pages.
ethical_reviews:
- id: https://b2ai-voice.org/ethics/usf-single-irb
  name: University of South Florida single IRB review
  description: Reviewed by the University of South Florida Institutional Review Board, the single IRB of record for the US-based institutions participating in the Bridge2AI Voice Data Acquisition protocol. The protocol contact is the principal investigator, Yael Bensoussan (yaelbensoussan@usf.edu), Department of Otolaryngology-Head and Neck Surgery, University of South Florida.
  reviewing_organization: https://b2ai-voice.org/organization/usf-irb
  contact_person: https://b2ai-voice.org/person/bensoussan-yael
  review_details:
  - 'The clinical study has been reviewed and approved by at least one human subjects'' protection review board: submitted and approved by the USF Single IRB and subsite IRBs through the Single IRB process.'
  - Data collection and sharing was approved by the University of South Florida Institutional Review Board.
  - All US-based institutions abide by the single IRB process; once the protocol is approved at USF, each participating institution submits review based on the single IRB at USF.
  - The study is not a clinical study for a drug product or a medical device, and no data monitoring committee was appointed for the study.
  - The IRB protocol (Bridge2AI Voice Data Acquisition, V1 dated 17 January 2023) has a documented revision history through V13 dated 11 July 2025, covering the addition of the pediatric cohort under the single IRB, adult compensation, electronic and remote consent, control data collection, remote enrolment and data collection apps, Spanish-language collection, and additional USF sites.
  - A partial HIPAA waiver was requested for recruitment purposes to allow the study team to review EHR information for incoming clinic patients ahead of their appointments, limited to the study's inclusion criteria.
- id: https://b2ai-voice.org/ethics/sickkids-reb
  name: Hospital for Sick Children Research Ethics Board review
  description: Reviewed by the Research Ethics Board at The Hospital for Sick Children.
  reviewing_organization: https://b2ai-voice.org/organization/sickkids-reb
  review_details:
  - Pediatric data collection and sharing was approved by the Research Ethics Board at the Hospital for Sick Children.
  - Pediatric patients are enrolled only through the pediatric sites and not at USF. Checklist HRP-416 for children under 21 has been completed and appended to the protocol.
- id: https://b2ai-voice.org/ethics/canadian-reb
  name: Canadian research ethics board reviews and separate genomic protocol
  review_details:
  - Canadian institutions (Mount Sinai Hospital, SickKids and the University of Toronto) do not abide by the single IRB process and apply for a separate research ethics board application to comply with Canadian regulations; a copy of the approved application is submitted with their application to USF.
  - Genomic data are collected and analysed only at the University of Toronto and Mount Sinai Hospital under a separate protocol and research ethics board approval; a copy of the protocol and REB approval is submitted to the USF IRB once approved. No genetic information is collected at the USF site.
- id: https://b2ai-voice.org/ethics/feasibility-study-irb
  name: Application feasibility study IRB approval
  description: Reviewed by the University of South Florida Institutional Review Board.
  reviewing_organization: https://b2ai-voice.org/organization/usf-irb
  review_details:
  - The feasibility study of the Bridge2AI-Voice application was approved by the Institutional Review Board of the University of South Florida under IRB number 004890, and all participants provided written informed consent for all study procedures.
  - 'Scope note: IRB number 004890 belongs to the 47-participant single-site feasibility study of the application, not to the Bridge2AI Voice Data Acquisition protocol under which the released dataset was collected.'
data_protection_impacts:
- id: https://b2ai-voice.org/dpia/status
  name: Data protection impact analysis status
  impact_details:
  - The healthsheet answers 'No' to whether an analysis of the potential impact of the dataset and its use on data subjects has been conducted.
  - A memorandum titled 'Ethical Justification for Controlled Access to Raw Voice Data Samples' is published with the documentation and explains the reasoning behind the governance structure that restricts raw audio to controlled access.
  - The consortium states that it is addressing the ethical, legal and social challenges surrounding voice AI, including risks of voice re-identification, vulnerabilities such as voice AI hacking, concerns around voice data sharing and privacy, and the influence of gender and racial diversity on the development and application of these technologies.
human_subject_research:
  id: https://b2ai-voice.org/human-subjects/overview
  name: Human subjects research status
  involves_human_subjects: true
  irb_approval:
  - Submitted and approved by the USF Single IRB and subsite IRBs through the Single IRB process.
  - Data collection and sharing was approved by the University of South Florida Institutional Review Board.
  - Pediatric data collection and sharing was approved by the Research Ethics Board at the Hospital for Sick Children.
  - The feasibility study of the Bridge2AI-Voice application was approved under University of South Florida IRB number 004890.
  ethics_review_board:
  - University of South Florida Institutional Review Board (single IRB of record for US sites)
  - Subsite Institutional Review Boards participating through the Single IRB process
  - Research Ethics Board, The Hospital for Sick Children
  - Separate Canadian research ethics boards at Mount Sinai Hospital and the University of Toronto, including a separate protocol for genomic data collection
  special_populations:
  - Children aged 2-18 are enrolled in the pediatric cohort, only at the pediatric participating institutions; Checklist HRP-416 for children under 21 was completed and appended to the protocol.
  - The protocol states that students, employees and wards of the state are neither specifically included nor excluded, and that there is a specific plan to enrol participants from socially and economically disadvantaged and underserved populations through the Plan for Enhancing Diverse Perspectives.
  regulatory_compliance:
  - Health Insurance Portability and Accountability Act (HIPAA), including HIPAA-compliant applications and storage, HIPAA de-identification rules applied to the release, and a partial HIPAA waiver for recruitment and screening
  - Certificate of Confidentiality covering the data under the Data Transfer and Use Agreement
  - Single IRB process for US institutions and separate research ethics board approvals for Canadian institutions
  - NIH STRIDES partner agreements governing cloud storage of study data
informed_consent:
- id: https://b2ai-voice.org/informed-consent/procedures
  name: Informed consent procedures
  consent_obtained: true
  consent_type:
  - Written consent by signing a physical paper copy
  - Electronic consent indicated within the application
  - Electronic consent through REDCap survey forms, housed in REDCap and HIPAA compliant
  - Video-recorded consent within the application, in which the participant reads a statement out loud
  - Parental permission and, where appropriate, verbal child assent for pediatric participants
  consent_documentation:
  - Paper consent documents are uploaded and saved electronically in REDCap; all paper and electronic versions of consent are stored for a minimum of five years after completion of the study, following required USF procedure.
  - All study-related material at USF is stored through the Florence platform in accordance with USF and NIH regulations; original paper consent documents cannot be destroyed until five years after study completion even if uploaded into Florence.
  - Assent is documented on a dedicated form; consent, assent and parental permission documents accompany the protocol.
  withdrawal_mechanism:
  - Participants may withdraw from the study at any point. Data collected before completion of voice data collection is not included in the database; data cannot be removed once the voice data collection process is completed.
  - Participants can decide to leave the longitudinal data collection at any point throughout the study period.
  consent_scope:
  - Participants consent to provide a voice or speech sample for an open-sourced database and to the upload of de-identified voice and clinical data to that database.
  - Participants who consent also permit investigators to access medical information through EHR platforms in order to perform gold standard validation of diagnoses and symptoms.
  - Within the consent process, individuals are asked whether they agree to be contacted in the future for further voice data collection if long-term follow-up is required; contact information provided for this purpose is stored within the institutional database only and is not shared with other centres or uploaded to the cloud.
  - The consent details state that data posing a low re-identification risk will be shared in registered access with the general public and that data posing a heightened risk will be shared through a controlled access mechanism with authorised researchers.
at_risk_populations:
  id: https://b2ai-voice.org/at-risk/pediatric
  name: Protections for at-risk populations
  at_risk_groups_included: true
  special_protections:
  - Pediatric patients are enrolled only through the pediatric participating institutions and not at USF; Checklist HRP-416 for children under 21 has been completed and appended to the protocol.
  - Pediatric participants are recruited strictly from the Hospital for Sick Children and are grouped by age, with age-appropriate protocols for ages 10+, 6-10, 4-6 and 2-4.
  - Compensation is provided to the adult population only.
  - For pediatric v1.1.0, audio features for free speech tasks were released only after being manually checked for the presence of unconsented speakers and personally identifying information.
  - Where a caregiver's voice is recorded inadvertently, the clips can be discarded either by re-recording manually during data collection or during data audit and post-processing.
  assent_procedures:
  - When children participate, parents or guardians provide consent and children provide verbal assent where appropriate. Where young children cannot reasonably be asked to assent, due to limitations in understanding related to age and development, they are not asked to do so; this typically holds for children under seven years of age. Assent is documented on a dedicated form.
  guardian_consent:
  - Parental permission is obtained from one or both parents; the research is minimal risk and does not require permission from both parents or legal guardians.
  - Pediatric participants are excluded if consent is not received from a parent or legal guardian for voice and clinical de-identified data to be uploaded to an open-sourced database.
  - For pediatric participants without adequate comprehension or familiarity with their past medical history, parents or decision-makers completed the medical history survey during the recording on a separate tablet.
license_and_use_terms:
  id: https://b2ai-voice.org/license/registered-access
  name: License and use terms
  license_terms:
  - 'License for files: Bridge2AI Voice Registered Access License (applied to both the adult and pediatric PhysioNet releases).'
  - 'Data Use Agreement: Bridge2AI Voice Registered Access Agreement. Users of the dataset must agree to the terms laid out in the registered access agreement.'
  - Registered access to features-only data requires registering on PhysioNet and confirming identity under the Registered Access License, and signing the Bridge2AI-Voice Registered Access Agreement. From version 3.0.0 the access policy states that only credentialed users who sign the DUA can access the files; no training is required.
  - Controlled access to raw audio requires completing a Data Access Request Form and a Data Use Agreement, submitting an application to the Data Access Compliance Office for review, and, on approval, ensuring a Data Use and Transfer Agreement is signed by an authorised official at the recipient institution. Requests are directed to DACO@b2ai-voice.org.
  - The dataset is intended solely for commercial and non-commercial research purposes by Authorized Researchers.
  - There are no fees associated with these restrictions.
  - 'Intellectual property terms reproduced from the registered access agreement: the Data may be protected by copyright and other rights; duplication as reasonably required to carry out the Research Project is permitted; sale of all or part of the Data on any media is not permitted; nothing in the agreement transfers intellectual property rights in or relating to the Data; users agree not to make intellectual property claims on the Data and not to use intellectual property protection in ways that would prevent or block access to, or use of, any element of the Data or conclusions drawn directly from it; users may obtain intellectual property rights on downstream discoveries but agree to implement licensing policies that will not obstruct further research and to respect the Fort Lauderdale Agreement.'
  - The Data Transfer and Use Agreement has a term ending two years after the start date, upon completion of the project, upon expiration of the applicable ethics approval, or upon termination by the provider institution, whichever occurs first, after which the data must be destroyed in accordance with provider instructions with written certification of destruction submitted within thirty days; one archival copy may be retained where required by law, regulation, institutional policy, or for research integrity and verification.
  - 'Supporting materials carry their own licenses: the Bridge2AI REDCap data dictionary and metadata are MIT licensed, the preparation library used to produce the parquet and phenotype files is Apache-2.0 licensed, and the documentation and dashboard source code is MIT licensed.'
  data_use_permission:
  - general_research_use
  - health_medical_biomedical_research
  - project_specific
  - user_specific
ip_restrictions:
  id: https://b2ai-voice.org/ip-restrictions/terms
  name: Intellectual property restrictions
  restrictions:
  - No IP-based restrictions have been imposed by third parties.
  - The Data Provider provides no guarantees that the Data is free of third-party intellectual property rights, database rights and other related rights.
  - Nothing in the Data Transfer and Use Agreement operates to transfer to the Recipient any intellectual property rights in or relating to the Data; the Recipient agrees not to use intellectual property protection, database rights or related rights in a way that could prevent or limit access to, or use of, any element of the Data or research conclusions derived from it.
  - The Recipient may elect to perform further research that would add intellectual and resource capital to the Data and obtain intellectual property rights on those downstream discoveries.
  - There are no fees associated with these restrictions.
regulatory_restrictions:
  id: https://b2ai-voice.org/regulatory/restrictions
  name: Regulatory and export control restrictions
  regulatory_restrictions:
  - No export controls apply to the dataset.
  - 'The Health Insurance Portability and Accountability Act applies: the HIPAA de-identification rules are applied to the released dataset, the collection applications and storage servers are HIPAA compliant, and a partial HIPAA waiver was obtained for recruitment and screening.'
  - The data transferred under the Data Transfer and Use Agreement is covered under a Certificate of Confidentiality, which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying information or characteristics of a research participant.
  hipaa_compliant: compliant
  other_compliance:
  - Certificate of Confidentiality (NIH)
  - The Data Transfer and Use Agreement records that the Data is not subject to the Federal Privacy Act of 1974 (that checkbox is not marked) and is not covered under HIPAA, FERPA or similar laws requiring additional special terms, being instead Personally Identifiable Information as defined in OMB Memorandum M-07-16.
  - Recipients must adhere to the specific requirements of PhysioNet.org, managed by the MIT Laboratory for Computational Physiology and supported by NIBIB under NIH grant R01EB030362, or to other data distribution mechanisms used by the provider.
  - Recipients warrant that they do not use coercion for labor or services as defined in section 787.06, Florida Statutes.
  - Canadian participating institutions comply with Canadian research ethics board requirements rather than the US single IRB process.
  confidentiality_level: restricted
is_deidentified:
  id: https://b2ai-voice.org/deidentification/status
  name: De-identification status
  identifiable_elements_present: false
  method: HIPAA Safe Harbor, supplemented by removal of indirect identifiers and of all raw voice audio
  identifiers_removed:
  - name
  - civic address
  - Social Security Number
  - geographic locators
  - state and province
  - date information at resolution finer than years
  - phone and fax numbers
  - email addresses
  - IP addresses
  - medical record numbers
  - health plan beneficiary numbers
  - device identifiers
  - license numbers
  - account numbers
  - vehicle identifiers
  - website URLs
  - full face photos
  - biometric identifiers
  - any unique identifiers
  - select geographic or demographic identifiers
  - information about household composition or cultural identity
  - household income, mental health status and traumatic life experiences
  - narrative text fields
  - raw voice audio
  - transcripts of free speech audio
  deidentification_details:
  - The level of de-identification recorded for the dataset is that identifiable information under HIPAA and the Common Rule, as well as data considered sensitive, have been removed.
  - The dataset removes direct identifiers, applies the HIPAA de-identification rules, rebases and/or replaces dates by integers, removes or generalises geographic information and removes narrative text fields; it does not achieve K-anonymisation with k greater than or equal to 2.
  - The dataset was de-identified through removal of all audio data and certain sensitive fields identified by a team of ethicists.
  - Country of data collection was retained.
  - 'Residual risk: a voice can never be fully de-identified, and it is always possible, even if unlikely, that someone could recognise a participant''s voice.'
