    versions_available:
    - 1.1 (published 2025-01-17, DOI 10.13026/249v-w155, restricted access; 12,523 recordings for 306 participants in the initial v1.0 release; v1.1 added Mel-frequency cepstral coefficients)
    - 2.0.0 (published 2025-04-16; added data for an additional 136 participants; spectrograms reprocessed; spectrograms and MFCCs from free-speech files removed)
    - 2.0.1 (published 2025-08-18; corrections in the authorship list)
    - 3.0.0 (published 2025-12-16, DOI 10.13026/k81f-qr68, credentialed access; data for 833 participants after adding 391 new participants; phenotype file separated into individual files; sparc and ppgs features added)
