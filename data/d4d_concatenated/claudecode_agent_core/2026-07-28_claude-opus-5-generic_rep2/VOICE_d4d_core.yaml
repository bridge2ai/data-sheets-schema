id: https://b2ai-voice.org/
name: Bridge2AI-Voice Dataset
description: 'The Bridge2AI-Voice (B2AI-Voice) dataset is a large, ethically sourced, and demographically diverse voice dataset linked to health information, released by the NIH''s Bridge2AI initiative. It is produced by the Bridge2AI-Voice consortium, a Precision Public Health grand challenge project funded by the NIH Common Fund Bridge2AI Program, whose stated goal is to create a flagship, standardized, ethically sourced dataset of voices linked to health information to fuel research and discovery in voice biomarkers. Data are collected prospectively at multiple sites across North America using a custom smartphone/tablet application (the Bridge2AI-Voice App) for adults and reproschema-ui for pediatric participants, and comprise acoustic tasks (voice, speech, breathing and cough recordings), detailed demographics, confounder surveys, validated patient questionnaires and patient-reported outcomes, and clinically validated diagnoses. Participants are recruited across five disease cohort categories - voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and pediatric voice and speech disorders - together with controls. The dataset is published as two distinct PhysioNet resources: an adult release (Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information) and a separate pediatric release (Bridge2AI-Voice Pediatric Dataset). The public releases contain derived audio features (spectrograms, Mel spectrograms, MFCCs, pitch, articulatory and phonetic-posteriorgram features) and phenotypic tables rather than raw audio waveforms; raw audio is disseminated only under controlled access to protect participant privacy.'
