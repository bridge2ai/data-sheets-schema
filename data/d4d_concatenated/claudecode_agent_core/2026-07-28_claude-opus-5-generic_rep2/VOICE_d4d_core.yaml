instances:
- id: https://b2ai-voice.org/instance/adult-participant
  name: Adult participant
  description: Each instance represents a person. The adult PhysioNet releases 3.0.0 and 3.1.0 contain data for 833 participants across five sites in North America; the initial v1.0 release contained 12,523 recordings for 306 participants, v2.0 added 136 new participants and v3.0.0 added a further 391.
  instance_type: participant (person)
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant. At each site a local clinician provided the diagnosis based on a clinical interview and appropriate work-up. For the psychiatric disorders cohort the assessment was determined using the participant's EHR record or an active prescription, done outside of data collection by an appropriately licensed clinician. Labelling follows the Bridge2AI protocols and ICD-10 codes, with a single labeller per instance.
- id: https://b2ai-voice.org/instance/pediatric-participant
  name: Pediatric participant
  description: Pediatric release v1.1.0 contains data collected from 300 participants aged 2-18, recruited at the Hospital for Sick Children as patients, healthy volunteers, or through research postings.
  instance_type: participant (child aged 2-18)
  counts: 300
  label: true
  label_description: Pediatric participants provide demographic information, voice and speech related questionnaires, and questionnaires inquiring about medical history; for participants without adequate comprehension or familiarity with their past medical history, parents or decision-makers completed the survey.
- id: https://b2ai-voice.org/instance/adult-recording
  name: Adult derived audio recording
  description: A recording of a single acoustic task by a single participant within a session, represented in the release by derived features rather than the original waveform. Counts differ by feature and by release, and the sources in the bundle do not agree on a single recording total. The project documentation states that version 3.0 contains approximately 61,937 voice-derived recordings from 833 adult participants. The PhysioNet v3.1.0 feature files report torchaudio_spectrogram n=29,278, torchaudio_mel_spectrogram n=29,278, torchaudio_mfcc n=29,278, torchaudio_pitch n=32,522, sparc_ema n=28,640, sparc_loudness n=31,855, sparc_periodicity n=31,872, sparc_pitch n=31,872 and ppgs n=29,289; the corresponding v3.0.0 counts are 29,020, 29,020, 29,020, 32,236, 31,616, 31,616, 31,633, 31,633 and 29,031. The v1.0 release reported 12,523 recordings for 306 participants. No single total is asserted here because the counts differ by feature and by release.
  instance_type: audio recording (acoustic task performance)
  label: false
- id: https://b2ai-voice.org/instance/pediatric-recording
  name: Pediatric derived audio recording
  description: Pediatric release v1.1.0 contains derived audio features for 23,533 recordings collected from 300 participants aged 2-18.
  instance_type: audio recording (acoustic task performance)
  counts: 23533
  label: false
anomalies:
- id: https://b2ai-voice.org/anomaly/site-configuration
  name: Site and protocol variation
  anomaly_details:
  - Different sites have different collection configurations, and the collection protocol changed over the course of the study.
  - Distinct iPad devices were used at each site, and the data were recorded with a head-mounted headset with a microphone that could be at slightly different distances.
  - The clinical diagnosis, depending on the disorder, was performed by one clinician or based on an EHR record or prescription.
- id: https://b2ai-voice.org/anomaly/confounding-noise
  name: Noise and response quality
  anomaly_details:
  - Confounding factors that might be present in the data include noise artifacts, variations in diagnostic practices, inaccurate questionnaire responses and underreporting.
- id: https://b2ai-voice.org/anomaly/unaudited-transcription
  name: Unaudited automated derivations
  anomaly_details:
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models that have not been audited for correctness.
- id: https://b2ai-voice.org/anomaly/missing-feature-files
  name: Feature generation failures and repaired files
  anomaly_details:
  - Some files, whether due to length or other issues, could not generate certain features and so are not included in the bundled data.
  - Version 3.1.0 fixed broken parquet files from the previous release.
  - Version 2.0 reprocessed spectrograms to fix minor issues identified in the previous release.
- id: https://b2ai-voice.org/anomaly/repeated-visits
  name: Repeated participant rows
  anomaly_details:
  - As participants may have repeated visits in order to collect data, there may be more than one row per participant in the data files, and there is no requirement that the participant provide the same response at each visit; participant information for the same data element may therefore vary across a data file.
known_biases:
- id: https://b2ai-voice.org/bias/site-selection
  name: Site-based selection bias
  bias_type: selection_bias
  bias_description: Participants are recruited from a limited number of geographic locations - five recording sites are included in the dataset - and primarily from 'high volume expert clinics' within hospital systems or academic institutions specialising in a given disease area. Groups that have less trust in the medical system or AI, or that are less proximal to the collection sites, would have been less likely to be recruited.
  mitigation_strategy: The documentation states the intention to make the data more representative by shifting to remote collection and by designing the recruiting approach in a way that controls for more variables. The IRB protocol describes a Plan for Enhancing Diverse Perspectives (PEDP) and partnerships with Community Outreach Clinics serving underserved and under-represented populations.
  affected_subsets:
  - Participants recruited at high volume expert clinics
  - Populations geographically distant from the five collection sites
- id: https://b2ai-voice.org/bias/cohort-representation
  name: Unequal representation of disease categories
  bias_type: representation_bias
  bias_description: The public data releases do not contain an equal distribution of the five categories of diseases, and the dataset has skews based on disorder category, site and other demographic factors.
  mitigation_strategy: Users should consider the multivariate distribution when assessing utility for different questions. Further releases are stated to contain additional data, and where specific diagnoses or severities are under-represented, participants are identified by medical record review based on voice-disorder related diagnostic codes.
  affected_subsets:
  - Disease cohort categories that are under-represented in a given public release
- id: https://b2ai-voice.org/bias/non-probability-sampling
  name: Non-probability sampling
  bias_type: sampling_bias
  bias_description: The sampling method is recorded as a non-probability sample. The released data are a sample of a larger, ongoing collection and are stated not to be representative because they were collected at a limited number of geographic locations.
- id: https://b2ai-voice.org/bias/device-measurement
  name: Device and site-linked measurement bias
  bias_type: measurement_bias
  bias_description: Participants were screened for different disorders based on site, so they also had their data collected with different devices. Distinct iPad devices were used at each site and the head-mounted microphone could be at slightly different distances between recordings, so device characteristics may be confounded with diagnostic label.
  affected_subsets:
  - Participants recruited for disorders that were screened at only one or a subset of sites
- id: https://b2ai-voice.org/bias/single-labeler
  name: Single-labeller annotation bias
  bias_type: annotation_bias
  bias_description: One labeller provides the label per instance, typically the clinician at the site of data collection or a clinician external to the study for a prior diagnostic assessment. No inter-annotator agreement can therefore be computed, and diagnostic practice varies between clinicians and sites.
- id: https://b2ai-voice.org/bias/language-representation
  name: English-language representation bias
  bias_type: representation_bias
  bias_description: English was the only language used for communication with study participants, and the released dataset contains fluent English speakers. Spanish protocols and Spanish-language data collection are stated to be under development for future releases.
  mitigation_strategy: The documentation states the study will expand to include data collection in Spanish; the IRB protocol was updated in February 2025 to include data collection from Spanish language speakers.
  affected_subsets:
  - Non-English-speaking populations, who are excluded by the inclusion criteria
known_limitations:
- id: https://b2ai-voice.org/limitation/language-coverage
  name: English-only coverage
  limitation_type: coverage_limitation
  limitation_description: Participants who do not read or speak English are excluded from the released cohorts, and the only language option for the collection protocol at the time of the v2.0.0 documentation was English.
  scope_impact: Models trained on the dataset cannot be assumed to generalise to speakers of other languages.
  recommended_mitigation: Await the Spanish-language protocol and data collection that the documentation states are under development.
- id: https://b2ai-voice.org/limitation/geographic-representativeness
  name: Limited geographic representativeness
  limitation_type: representativeness_limitation
  limitation_description: The data are a sample of a larger, ongoing collection and are stated not to be representative because collection took place at a limited number of geographic locations; five recording sites are included.
  scope_impact: Findings may not transfer to populations outside the participating North American sites.
  recommended_mitigation: Consider the multivariate distribution of site, disorder category and demographics when assessing utility for a given question.
- id: https://b2ai-voice.org/limitation/no-raw-audio
  name: Raw audio excluded from the public releases
  limitation_type: scope_limitation
  limitation_description: The public PhysioNet releases contain derived features rather than the original voice recordings. Transcripts of free speech audio were removed; spectrograms and similar features were excluded where the audio contained free speech; and spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records and audio checks were removed. No external data such as imaging or genomic data was released in the v3.0.0 release.
  scope_impact: Analyses requiring the original waveform, free-speech content or linked multimodal data cannot be performed on the public release alone.
  recommended_mitigation: Request raw audio through the controlled access mechanism by contacting the Data Access Compliance Office at DACO@b2ai-voice.org; adult raw audio is made available via Synapse.
- id: https://b2ai-voice.org/limitation/no-splits
  name: No recommended data splits
  limitation_type: methodological_limitation
  limitation_description: There are no predefined recommended data splits for training, validation or testing; researchers are encouraged to create their own splits based on their specific requirements.
  scope_impact: Results reported on this dataset are not directly comparable across studies unless the splitting procedure is described.
  recommended_mitigation: Describe the exact splitting procedure alongside any release of a model or publication.
- id: https://b2ai-voice.org/limitation/protocol-drift
  name: Protocol change and diagnostic drift over time
  limitation_type: temporal_limitation
  limitation_description: The collection protocol changed over the course of the study, and changes in diagnostic criteria or practices could be a source of distribution shift.
  scope_impact: Features and labels are not guaranteed to be homogeneous across collection periods or releases.
  recommended_mitigation: Consult the per-version release notes and changelog published with the dataset metadata.
- id: https://b2ai-voice.org/limitation/k-anonymity
  name: K-anonymisation not achieved
  limitation_type: integration_limitation
  limitation_description: The de-identification metadata records that the dataset does not achieve K-anonymisation with k greater than or equal to 2, even though direct identifiers are removed and the HIPAA de-identification rules are applied.
  scope_impact: Residual re-identification risk remains when the data are combined with other sources.
  recommended_mitigation: Observe the terms of the registered access agreement, which prohibit attempts to re-identify research participants.
- id: https://b2ai-voice.org/limitation/geographic-and-date-resolution
  name: Reduced geographic and temporal resolution
  limitation_type: resolution_limitation
  limitation_description: Dates are rebased or replaced by integers, geographic information is removed or generalised, state and province were removed while country of data collection was retained, and narrative text fields are removed.
  scope_impact: Longitudinal analyses at fine temporal resolution and geographic analyses below country level are not possible.
- id: https://b2ai-voice.org/limitation/audio-task-completion
  name: Acoustic task completion difficulties observed in feasibility testing
  limitation_type: methodological_limitation
  limitation_description: In the single-site feasibility study of the Bridge2AI-Voice application, the overall task completion rate was 68 percent and acoustic tasks were successfully recorded in only 41 percent of cases, with participants requesting assistance in 41.2 percent of tasks and the Glides task requiring assistance 100 percent of the time. The determination of whether a task was successfully completed or recorded was subjective, being made at the decision of the research assistant.
  scope_impact: This limitation is scoped to the 47-participant feasibility study of the application conducted at a single tertiary academic voice centre between 5 June 2023 and 28 July 2023, in which audio data was not collected; it is not a measurement on the released dataset.
  recommended_mitigation: The feasibility findings prompted a focus on user experience and interface, including the addition of a UX/UI expert to the team for further iterations of the app.
confidential_elements:
- id: https://b2ai-voice.org/confidentiality/released-dataset
  name: Confidentiality status of the released dataset
  confidential_elements_present: false
  confidentiality_details:
  - The project healthsheet answers 'No' to whether the dataset contains data that might be considered confidential, such as data protected by legal privilege or doctor-patient confidentiality or the content of individuals' non-public communications.
  - Identifiable information under HIPAA and the Common Rule, as well as data considered sensitive, have been removed from the released dataset.
- id: https://b2ai-voice.org/confidentiality/transferred-data
  name: Confidentiality status of data transferred under the Data Transfer and Use Agreement
  confidential_elements_present: true
  confidentiality_details:
  - The Data Transfer and Use Agreement states that the Data is Personally Identifiable Information as defined in OMB Memorandum M-07-16 and is not covered under HIPAA, FERPA or similar laws requiring additional special terms; the checkbox for the Federal Privacy Act of 1974 is not marked.
  - The Data Transfer and Use Agreement records that the Data is covered under a Certificate of Confidentiality, which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying information or characteristics of a research participant.
  - This entry is scoped to data transferred under the Data Transfer and Use Agreement, which covers a broader set of data than the de-identified feature-only public release described in the preceding record.
content_warnings:
- id: https://b2ai-voice.org/content-warning/free-speech-transcripts
  name: Free speech transcription content
  content_warnings_present: true
  warnings:
  - The healthsheet states that the dataset includes the transcription of free speech tasks, and that while the inclusion of offensive or otherwise unsafe material is unlikely it cannot be completely avoided, as research participants are responsible for their choice of language.
  - 'Scope note: the PhysioNet release notes state that transcripts of free speech audio were removed from the release, that spectrograms and similar features were excluded where the audio contained free speech, and that all transcriptions from open-response prompts are removed from the feature-only dataset. The healthsheet statement and the release notes describe different scopes and are recorded here without reconciliation.'
- id: https://b2ai-voice.org/content-warning/mental-health-items
  name: Distressing questionnaire content
  content_warnings_present: true
  warnings:
  - The IRB protocol records that questions asked of participants from certain disease cohorts such as mood disorders, depression and anxiety can lead to possible discomfort and could trigger negative emotions for participants. Instruments in the protocol include the PHQ-9, GAD-7, DSM-5 Adult, PTSD Adult and ADHD Adult questionnaires.
subpopulations:
- id: https://b2ai-voice.org/subpopulation/demographics
  name: Demographic subpopulations
  subpopulation_elements_present: true
  identification:
  - The dataset identifies demographic sub-populations by age, gender, sex, ethnicity and socioeconomic status.
  - Detailed demographic data collected through the smartphone application include age, sex at birth, gender identity, race and ethnicity, and languages spoken; the protocol also asks about weight, socio-economic status and literacy status, and about disabilities.
  - The dataset includes race information, sexual orientation information, and socioeconomic and health information.
  distribution:
  - The adult releases 3.0.0 and 3.1.0 contain 833 participants across five sites in North America; the pediatric release v1.1.0 contains 300 participants aged 2-18.
  - The public data releases do not contain an equal distribution of the five categories of diseases.
  - Per-group counts for the released cohorts are not stated in the documentation bundle.
- id: https://b2ai-voice.org/subpopulation/disease-cohorts
  name: Disease cohort subpopulations
  subpopulation_elements_present: true
  identification:
  - Participants are grouped into five predetermined disease cohort categories - voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and pediatric voice and speech disorders - plus controls, using the inclusion and exclusion criteria and gold standard validation methods defined in the collection protocol.
  - Pediatric participants are grouped by age, with separate protocols for ages 10+, 6-10, 4-6 and 2-4.
  distribution:
  - Data are collected across five disease categories; the initial data release contained data collected from four of the five categories.
  - The adult release abstract states that participants were selected based on known conditions which manifest within the voice waveform including voice disorders, neurological disorders, mood disorders and respiratory disorders.
sensitive_elements:
- id: https://b2ai-voice.org/sensitive/participant-attributes
  name: Sensitive participant attributes
  sensitive_elements_present: true
  sensitivity_details:
  - 'The dataset contains data considered sensitive: racial or ethnic origins (the dataset includes race information), sexual orientation, and financial or health data (the dataset includes socioeconomic and health information).'
  - All sensitive fields were removed from the dataset at the v3.0.0 preparation stage; these correspond to data elements encoded as sensitive under the column name 'Identifier?' in the REDCap data dictionary.
  - Non-identifying elements of data that revealed highly sensitive information, such as household income, mental health status and traumatic life experiences, were also removed.
  - All raw voice data was removed from the public release, as this data has the potential to cause individual re-identification or to be used for illicit or unauthorised purposes.
acquisition_methods:
- id: https://b2ai-voice.org/acquisition/mixed
  name: Direct observation, self-report and derivation
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The data was directly observable and reported by subjects. Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data, looking at electronic health records, or medication prescriptions.
  - Acoustic data - voice, breathing, cough and speech - are recorded directly with the application for adults and with reproschema-ui for pediatrics; a total of 22 acoustic tasks are recorded through the app.
  - Demographic data, confounder surveys and validated questionnaires are self-reported by participants through the application.
  - The released features are computationally derived from the raw waveform using openSMILE, Praat, parselmouth, torchaudio, the Speech Articulatory Coding (sparc) package, the ppgs package and OpenAI's Whisper Large model.
  - Clinical validation is performed by a qualified physician or practitioner based on established gold standards for diagnosis.
collection_mechanisms:
- id: https://b2ai-voice.org/mechanism/apps
  name: Bridge2AI-Voice applications and hardware
  mechanism_details:
  - The data were collected using an iPad app. Voice samples are collected prospectively using a custom software application, the Bridge2AI-Voice App, following the Bridge2AI-Voice protocols.
  - Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36 microphone and an Apple dongle to connect it to the iPad.
  - HVEC and remote data collection occur through two platforms, the Bridge2AI Voice Web app and the Bridge2AI Voice iOS app. The iOS app is restricted to iOS-compatible devices while the Web app can run on a computer, tablet or phone. No software is downloaded or installed, both apps are HIPAA-compliant, and they only store data during the collection phase, with data removed as soon as the page is closed. No login is required and data are sent over a secure https protocol to a HIPAA-compliant storage server.
  - The Bridge2AI Enrollment Web app is used for remote recruitment and enrolment and behaves in the same way.
  - For pediatrics, all data is collected using reproschema-ui with the Bridge2AI-Voice pediatric protocol, on tablets; a headset was used to record for most participants, while the remaining recordings used the built-in tablet microphone due to low tolerance of wearing headphones or existing complex medical conditions.
  - Participants were instructed to wear a headset with microphone if the task included voice recording, as per the Bridge2AI-Voice suggested standards.
  - Clinical and questionnaire data are entered into a REDCap database as part of the Case Report Form; the supporting REDCap data dictionary, metadata and instrument PDFs are available at https://github.com/eipm/bridge2ai-redcap.
  - The smartphone application for voice data collection includes models to ensure acoustic data quality including volume standardisation and noise cancellation.
  - The data are sent over a secure https protocol to one of the NIH STRIDES partners - Amazon, Google or Microsoft - which have pre-negotiated contracts with the NIH to ensure data privacy and HIPAA protection.
  used_software:
  - id: https://github.com/eipm/bridge2ai-redcap
    name: Bridge2AI Voice REDCap
    description: Bridge2AI REDCap data dictionary, metadata and instrument PDFs, also available in the REDCap Instrument Shared Library. Archived on Zenodo (v3.20.0 at https://doi.org/10.5281/zenodo.14148755 and v3.23.0 at https://zenodo.org/records/14989503).
    license: MIT
    url: https://github.com/eipm/bridge2ai-redcap
  - id: https://b2ai-voice.org/software/reproschema-ui
    name: reproschema-ui
    description: Customised software used on tablets to collect all pediatric data under the Bridge2AI-Voice pediatric protocol.
collection_timeframes:
- id: https://b2ai-voice.org/timeframe/data-acquisition
  name: Bridge2AI-Voice data acquisition period
  timeframe_details:
  - The healthsheet states that the data was collected over a period of 12 months.
  - 'The IRB protocol describes a prospective cohort study over four years involving USF and 11 other participating academic sites, with a phased approach: Phase 1 (Exploratory, up to 180 participants at main sites) completed November 2023; Phase 2 (Pilot, cumulatively up to 600 participants) begun November 2023 and ongoing in November 2024; Phase 3 (Expansion, cumulatively up to 3,000 participants) and Phase 4 (Outreach, cumulatively up to 5,000 participants) to follow.'
  - NIH RePORTER records a project start of 2022-09-01 and a project end of 2026-11-30.
  - Individuals may enrol with the option to contribute single time point data or longitudinal data for certain disease cohorts; at-home longitudinal collection is requested at intervals of 1-6 months for a maximum of three to four years depending on the section of the protocol consulted.
- id: https://b2ai-voice.org/timeframe/feasibility-study
  name: Application feasibility study period
  start_date: '2023-06-05'
  end_date: '2023-07-28'
  timeframe_details:
  - 'Scope note: these dates are for the single-site feasibility study of the Bridge2AI-Voice application, conducted at the University of South Florida Health Voice Center in Tampa, Florida between 5 June 2023 and 28 July 2023 with 47 participants. Audio data was not collected at that stage of app development, so this timeframe does not describe collection of the released dataset.'
data_collectors:
- id: https://b2ai-voice.org/collector/research-teams
  name: Site research teams and clinicians
  role: Research team members, clinicians and research assistants at the participating institutions
  collector_details:
  - Research teams, which may include medical, graduate or undergraduate students, coordinated with clinicians and doctors to identify appropriate participants. These clinicians and doctors were listed under the IRB as co-investigators and were added to the consortium so that their names are included on consortium-level publications that emerge from the research.
  - Hospital staff were not involved in scheduling but assisted in the logistics of coordinating data collection.
  - Data is collected in the clinic with the assistance of a trained research assistant; future data collection will also occur remotely, but remote data collection did not occur for the initial dataset release.
  - The team hired two acoustic engineers and three AI data scientists to analyse all samples from the Year 1 exploratory data collection phase to ensure acoustic quality and ML readiness.
  - The documentation bundle does not state how the research staff themselves were compensated.
missing_data_documentation:
- id: https://b2ai-voice.org/missing-data/patterns
  name: Missing data patterns, causes and handling
  missing_data_patterns:
  - Phenotype data files only contain rows for a participant if at least one column is not missing.
  - Each individual answered a common set of questions and then responded to additional questions relevant to their primary diagnostic category, so cohort-specific instruments are systematically absent for participants outside that cohort.
  - As participants may have repeated visits, there may be more than one row per participant in the data files, and responses for the same data element may vary across rows.
  missing_data_causes:
  - Some questions are optional.
  - There may be data collection irregularities that caused some information to be missing from individual instances.
  - Some files, whether due to length or other issues, could not generate certain features and so are not included in the bundled data.
  - Sensitive records, audio checks and free-speech-derived features were deliberately removed from the release.
  handling_strategy: The dataset has been audited internally for missingness and consistency by the data release team, and a missingness table is included with the dataset. Generating missingness tables is the first step of the stated audit protocol. The healthsheet records that no pre-processing was performed for cleaning the data, and no imputation procedure is described.
raw_data_sources:
- id: https://b2ai-voice.org/raw-source/audio-and-redcap
  name: Raw audio, questionnaire and clinical source data
  source_description: Raw audio waveforms of voice, speech, breathing and cough tasks recorded from participants through the Bridge2AI-Voice iOS and Web applications (adults) or reproschema-ui (pediatrics), together with self-reported demographic, confounder and validated questionnaire responses, clinician-entered diagnostic and clinical validation data captured in REDCap, and clinical data extracted from site electronic health records including imaging.
  source_type:
  - Tablet and smartphone application recording
  - Self-reported survey and validated questionnaire
  - Clinician-entered case report form in REDCap
  - Electronic health record extraction
  - Imaging collected retrospectively from patient charts
  - Genomic sequencing (collected only at the University of Toronto and Mount Sinai Hospital under a separate research ethics board approval)
  access_details: 'The raw audio files and the questionnaire data retrieved from reproschema-ui or exported from REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0. Raw audio is disseminated through controlled access only, to protect participants'' privacy: users must complete a Data Access Request Form and a Data Use Agreement, submit an application to the Data Access Compliance Office for review, and ensure a Data Use and Transfer Agreement is signed by an authorised official at their institution. Requests are made by emailing DACO@b2ai-voice.org. Adult raw audio is made available via Synapse at https://www.synapse.org/Synapse:syn72370534/, and the source manifest records that pediatric raw audio is distributed via Synapse under syn73617068 rather than PhysioNet.'
  raw_data_format:
  - WAV
  - JSON
  - TSV
  - REDCap export
sampling_strategies:
- id: https://b2ai-voice.org/sampling/non-probability
  name: Non-probability purposive sampling from expert clinics
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - A larger, ongoing collection of voice, speech and respiratory data being gathered by the Bridge2AI-Voice consortium across participating institutions.
  why_not_representative:
  - The data is not representative because it was collected at a limited number of geographic locations.
  strategies:
  - Non-Probability Sample (the sampling method recorded in the study metadata).
  - 'Patients presenting at specialty clinics and institutions were considered for enrolment and were selected based on membership of five predetermined groups: respiratory disorders, voice disorders, neurological disorders, mood disorders and pediatric.'
  - 'Participants are recruited across different academic institutions from high volume expert clinics, based on diagnosis and inclusion/exclusion criteria. The sources define high volume expert clinics differently: the project documentation defines them as outpatient clinics within hospital systems or academic institutions that have developed expertise in a specific disease area and see more than 50 patients per month from the same disease category, while the IRB protocol defines them as clinics or programmes within academic institutions with multidisciplinary programmes targeted to the listed disease cohorts and a volume of over 1,000 patients per year. Community Outreach Clinics are defined as clinics within or outside academic institutions whose main mission is to provide health services to underserved and under-represented populations.'
  - Patients presenting at the given clinic were screened for inclusion and exclusion criteria prior to their visit by the project investigators, including chart screening through the site EHR under a partial HIPAA waiver.
  - Pediatric participants are recruited strictly from the Hospital for Sick Children and grouped by age; non-patients were recruited through research postings.
  - Recruitment also takes place through flyers in well-trafficked areas, QR codes linking to a secure REDCap screening survey, social media platforms (LinkedIn, X, Facebook, Instagram, YouTube, the Bridge2AI-Voice website and the Bridge2AI website) and the FlowTrials platform.
  - If specific diagnoses or severities are under-represented in the dataset, participants are identified by medical record review based on voice-disorder related diagnostic codes.
raw_sources:
- id: https://b2ai-voice.org/raw-data/controlled-access
  name: Raw audio availability
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - The raw data post de-identification was saved in addition to the preprocessed data, and is not accessible publicly.
  - The published Bridge2AI-Voice adult dataset contains derived features from the audio waveforms; the PhysioNet project does not contain raw audio.
  - Accessing raw audio is a more involved process and requires institutional sign-off; requests are directed to the access committee at DACO@b2ai-voice.org and data are made available via Synapse.
  - Users interested in accessing the audio data from any Bridge2AI-Voice dataset can request access by email; raw audio data is disseminated through controlled access only to protect participants' privacy.
  - The feasibility study publication states that the raw data supporting its conclusions will be made available by the authors without undue reservation; that statement is scoped to the feasibility study rather than to the released dataset.
preprocessing_strategies:
- id: https://b2ai-voice.org/preprocessing/audio-standardisation
  name: Audio standardisation and feature extraction
  preprocessing_details:
  - Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing filter applied.
  - Spectrograms are time-frequency representations computed using the short-time Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT, further downsampled by a factor of two in the time domain after derivation (the v1.1 release used a 512-point FFT and no downsampling).
  - Sixty Mel-frequency cepstral coefficients were extracted from the spectrograms, and Mel spectrograms were computed with the same parameters and 60 Mel bins.
  - Articulatory features were generated with the Speech Articulatory Coding (sparc) package, producing kinematic traces of vocal tract articulators and source features as well as measures of loudness, periodicity and pitch, all gathered at 50 Hz.
  - Acoustic features were extracted using openSMILE, capturing temporal dynamics and acoustic characteristics; phonetic and prosodic features were computed using Parselmouth and Praat, providing measures of fundamental frequency, formants and voice quality.
  - Phonetic posteriorgrams - time-varying categorical distributions over acoustic units of speech at 100 Hz - were generated via the ppgs package.
  - Transcriptions were generated using OpenAI's Whisper Large model.
  - 'Speech intelligibility metrics are computed for speech tasks, and waveform-derived features are stored in two formats: a fixed feature format containing static features extracted from the entire waveform, and a temporal format that varies for each audio file depending on the length of the recording.'
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    description: 'Library used for organising and preprocessing the dataset: converting the raw audio waveforms into the parquet files and merging the source data into the phenotype files. The adult v3.1.0 release was generated with b2aiprep v3.0.0.'
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://github.com/sensein/senselab
    name: SenseLab
    description: Toolkit used for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
  - id: https://b2ai-voice.org/software/opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, used to extract acoustic features capturing temporal dynamics and acoustic characteristics.
  - id: https://b2ai-voice.org/software/praat
    name: Praat
    description: Used, through parselmouth, to compute phonetic and prosodic features including fundamental frequency, formants and voice quality.
  - id: https://b2ai-voice.org/software/parselmouth
    name: parselmouth
    description: Python interface to Praat used for phonetic and prosodic feature extraction.
  - id: https://b2ai-voice.org/software/torchaudio
    name: torchaudio
    description: Used to compute spectrograms, Mel spectrograms, MFCCs and pitch contours.
  - id: https://b2ai-voice.org/software/sparc
    name: Speech Articulatory Coding (sparc)
    description: Package used to generate electromagnetic articulography estimates and measures of loudness, periodicity and pitch at 50 Hz.
  - id: https://b2ai-voice.org/software/ppgs
    name: ppgs
    description: Package used to generate phonetic posteriorgrams at 100 Hz across 40 phoneme categories.
  - id: https://b2ai-voice.org/software/whisper-large
    name: Whisper Large
    description: OpenAI speech recognition model used to generate transcriptions.
- id: https://b2ai-voice.org/preprocessing/bids-conversion
  name: Conversion to BIDS and phenotype assembly
  preprocessing_details:
  - The raw audio files and the questionnaire data retrieved from reproschema-ui or exported from REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0.
  - Pediatric data collected through reproschema-ui is extracted and transformed into REDCap format, and subsequently converted to the Brain Imaging Data Structure.
  - The resulting layout places phenotype tables under confounders, demographics, diagnosis, enrollment, questionnaire and task subfolders, with per-participant audio under sub-<participant_id>/ses-<participant_id>/audio as paired .wav and .json files named sub<participant_id>_ses<participant_id>_task-<task_name>.
  - The questionnaire features are collected and distributed in the phenotype folder format and can be used for cohort selection.
- id: https://b2ai-voice.org/preprocessing/deidentification-pipeline
  name: De-identification preprocessing
  preprocessing_details:
  - 'The healthsheet records that pre-processing for de-identification was performed: the data were extracted from the raw audio to limit re-identification and only the extracted features are released with the dataset.'
  - No instances were excluded from the dataset at the time of preprocessing.
cleaning_strategies:
- id: https://b2ai-voice.org/cleaning/stated-position
  name: Stated cleaning position
  cleaning_details:
  - The healthsheet answers 'No' to whether there was any pre-processing for cleaning the data, for both the preliminary and the current version of the dataset.
- id: https://b2ai-voice.org/cleaning/audit-and-removal
  name: Audit protocol and record removal
  cleaning_details:
  - The stated audit protocol is to generate missingness tables; check distributions and outliers; check categorical responses against the schema; run quality control metrics for audio tasks; for waveforms check the amount of silence and the duration; and for speech check the produced speech relative to the intended passage.
  - Raw audio transcripts were reviewed and any audio recordings that contained potentially identifying information or external voices were removed from the release.
  - All sensitive fields, corresponding to data elements encoded as sensitive under the 'Identifier?' column in the REDCap data dictionary, were removed from the dataset at the v3.0.0 stage.
  - 'Quality control of the data is performed throughout the four years of the project: all samples from the Year 1 exploratory phase were analysed by two acoustic engineers and three AI data scientists to ensure acoustic quality and ML readiness, and in each subsequent year 10 percent of the data is selected at random every month for quality control and ML readiness.'
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    description: Used for organising and preprocessing the dataset.
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: https://github.com/sensein/senselab
    name: SenseLab
    description: Used for processing audio files for research tasks.
    url: https://github.com/sensein/senselab
labeling_strategies:
- id: https://b2ai-voice.org/labeling/clinical-gold-standard
  name: Clinician gold-standard labelling
  data_annotation_platform:
  - REDCap (clinical validation section of the case report form)
  - Bridge2AI-Voice iOS and Web applications
  - reproschema-ui (pediatric protocol)
  data_annotation_protocol:
  - Labelling follows the Bridge2AI protocols and ICD-10 codes.
  - Diagnostic labels are the result of a clinical assessment of the participant; at each site a local clinician provided the diagnosis based on a clinical interview and appropriate work-up.
  - For the psychiatric disorders cohort, the assessment was determined using the participant's EHR record or an active prescription, and was done outside of data collection by an appropriately licensed clinician.
  - Clinical validation is performed by a qualified physician or practitioner based on established gold standards for diagnosis defined per disease cohort, such as laryngoscopy images and stroboscopy videos for voice disorders, spirometry and flow-volume loops and CT for respiratory disorders, brain CT/MRI and whole genome sequencing for neurological disorders, and the electronic health summary, psychiatrist diagnosis and medication history for mood and psychiatric disorders.
  - The labelling strategy is described as a gold standard label available in the data, diagnosed by a clinician.
  - The documentation recommends that the process for any new labels be described alongside any release of a model or publication, including the exact variables used for the determination.
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to the study for a prior diagnostic assessment.
  labeling_details:
  - A single labeller is used per data item, and one labeller provides a label per instance.
  - Human-level performance in the applications the dataset is intended to address is stated to vary widely.
  - The software used to preprocess, clean and label the instances is available at https://github.com/sensein/b2aiprep and https://github.com/sensein/senselab.
annotation_analyses:
- id: https://b2ai-voice.org/annotation-analysis/single-labeller
  name: Annotation quality assessment
  analysis_method: One labeller provides the label per instance and a single labeller is used per data item, so no inter-annotator agreement metric is computed or reported in the documentation bundle.
  annotation_quality_details:
  - Annotation quality is instead addressed through clinical gold-standard validation performed by a qualified physician or practitioner and through the internal audit for missingness and consistency conducted by the data release team.
  - Certain automatically generated aspects of the data, for example transcription, have not been audited for correctness.
machine_annotation_tools:
- id: https://b2ai-voice.org/machine-annotation/feature-extraction
  name: Automated feature extraction and transcription tools
  tools:
  - Whisper Large unknown
  - openSMILE unknown
  - Praat unknown
  - parselmouth unknown
  - torchaudio unknown
  - sparc unknown
  - ppgs unknown
  - b2aiprep 3.0.0
  tool_descriptions:
  - OpenAI's Whisper Large model generated transcriptions of the audio recordings; transcriptions from open-response prompts were subsequently removed from the feature-only release.
  - openSMILE extracted acoustic features capturing temporal dynamics and acoustic characteristics, provided in static_features.tsv.
  - Praat provided phonetic and prosodic measures of fundamental frequency, formants and voice quality.
  - parselmouth provided the Python interface to Praat used for those measures.
  - torchaudio produced spectrograms, Mel spectrograms, MFCCs and pitch contours.
  - The Speech Articulatory Coding package produced electromagnetic articulography estimates for six articulators plus loudness, periodicity and pitch at 50 Hz.
  - The ppgs package produced phonetic posteriorgram probabilities across 40 phoneme categories at 100 Hz.
  - b2aiprep organised and preprocessed the dataset, converting raw waveforms into the parquet feature files and merging source data into the phenotype files.
existing_uses:
- id: https://b2ai-voice.org/existing-use/summer-school
  name: Known existing uses
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School and hackathon.
  - Training opportunities for using the dataset are offered through the Bridge2AI-Voice scholars programme at https://www.b2aivoicescholars.org/.
use_repository:
- id: https://b2ai-voice.org/use-repository/none
  name: Repository of known uses
  repository_details:
  - The healthsheet answers 'No' to whether there is a repository that links to any or all papers or systems that use the dataset, beyond Google Scholar.
  - 'Use of the dataset requires citation of the protocol development publication: Bensoussan, Yael, et al. ''Developing Multi-Disorder Voice Protocols: A team science approach involving clinical expertise, bioethics, standards, and DEI.'' Proc. Interspeech 2024, available at https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html.'
other_tasks:
- id: https://b2ai-voice.org/other-task/beyond-original-intent
  name: Additional potential tasks
  task_details:
  - The dataset can be used for AI model pretraining, fine-tuning, benchmarking or validation.
  - Pediatric resources of this kind are intended to enable study of developmental norms, creation of AI-driven tools for early screening and support of clinical insight.
  - The consortium's standards work implies use of the dataset in developing and testing bioinformatics and acoustic standards for voice data and in benchmarking diversity metrics.
  - The audiomics viewpoint describes use cases such as voice screening for detection and monitoring of laryngeal cancer in at-risk populations for timely referral, and remote voice monitoring in spasmodic dysphonia for assessing botulinum toxin response to fine-tune and personalise treatment.
future_use_impacts:
- id: https://b2ai-voice.org/future-impact/skews
  name: Distributional skews affecting future use
  impact_details:
  - The dataset has skews based on disorder category, site and other demographic factors; users should consider the multivariate distribution when assessing utility for different questions.
  - Factors that might limit the generalisation of derived models include the number and diversity of devices, recording specificities such as headset distance, the number and diversity of recording sites, and distribution shifts over time arising from changes in diagnostic criteria or practices.
- id: https://b2ai-voice.org/future-impact/reidentification
  name: Re-identification and misuse risks
  impact_details:
  - 'Voice can never be fully de-identified: each person''s voice is unique to them and their health at that time, so recognition by a listener remains possible even after removal of HIPAA-protected information.'
  - The ethical and legal challenges in audiomics include potential reidentification of patients by their voice, voice hacking and data ownership, which the consortium states call for a new governance framework covering diversity, data handling and privacy safeguards.
  - Registered access users must not take any action that could reasonably lead to re-identification, nor use the data for any purpose that could foreseeably cause harm or stigmatisation to research participants, their families, communities or specific populations.
discouraged_uses:
- id: https://b2ai-voice.org/discouraged/non-clinical-decisions
  name: Non-research and consequential decision-making uses
  discouragement_details:
  - The dataset should not be used for non-clinical or non-research applications such as hiring decisions, insurance premium adjustments, or any form of surveillance that could lead to discrimination or harm.
  - These discouraged uses are intended to prevent unethical or biased outcomes that could negatively impact individuals based on their health conditions or voice characteristics. The dataset is intended strictly for research that prioritises patient safety, privacy and ethical use.
intended_uses:
- id: https://b2ai-voice.org/intended-use/research
  name: Intended uses
  examples:
  - Development of AI and machine-learning models for healthcare, including model pretraining, fine-tuning, benchmarking and validation.
  - Clinical research in disease screening, diagnosis and monitoring through voice biomarkers.
  - Development, benchmarking or validation of clinically applicable machine-learning models for diagnosing vocal pathologies and neurological, psychiatric, respiratory and pediatric voice disorders.
  - Commercial and non-commercial research purposes by Authorized Researchers, as permitted by the Registered Data Access Agreement.
  usage_notes: The dataset is structured to be Findable, Accessible, Interoperable and Reusable (FAIR). Users must consider the dataset's skews by disorder category, site and demographic factors, create their own data splits because none are recommended, and observe the terms of the registered access agreement.
  use_category:
  - research
  - clinical
  - educational
prohibited_uses:
- id: https://b2ai-voice.org/prohibited/reidentification
  name: Re-identification and harmful use
  description: The dataset is not to be used to attempt to re-identify research participants, nor for any actions that could reasonably lead to re-identification, and not for any purpose that could foreseeably cause harm or stigmatisation to research participants, their families, communities or specific populations.
  prohibition_reason:
  - Restriction stated in the Registered Data Access Agreement, reflecting the B2AI-Voice Consortium's commitment to advancing ethical and trustworthy research practices that respect and protect the rights and interests of research participants.
- id: https://b2ai-voice.org/prohibited/ip-blocking-and-sale
  name: Sale of data and restrictive intellectual property claims
  description: Sale of all or part of the data on any media is not permitted. Users agree not to make intellectual property claims on the data and not to use intellectual property protection, database rights or related rights in ways that would prevent or block access to, or use of, any element of the data or conclusions drawn directly from it, and to implement licensing policies that will not obstruct further research.
  prohibition_reason:
  - License restriction in the registered access agreement, intended to ensure that future use of the dataset remains unrestricted, in alignment with the Open Science principles upheld by the B2AI-Voice Consortium.
  - Users also agree to respect the Fort Lauderdale Agreement.
- id: https://b2ai-voice.org/prohibited/onward-disclosure
  name: Onward disclosure outside authorised persons
  description: Under the Data Transfer and Use Agreement, the recipient shall not disclose, release, sell, rent, lease, loan or otherwise grant access to the Data to any third party except Authorized Persons without the prior written consent of the Provider. Collaborators at other research organisations, and other research teams at the same organisation, must apply independently for access and sign their own Data Transfer and Use Agreement before accessing the data.
  prohibition_reason:
  - Contractual constraint in the Data Transfer and Use Agreement executed between the provider institution and the recipient institution.
distribution_formats:
- id: https://b2ai-voice.org/distribution/physionet-adult
  name: PhysioNet adult release
  description: The adult featurized dataset is distributed on PhysioNet under a permissioned access mechanism. A derived dataset containing spectrograms and combined phenotypic data is available; registration on PhysioNet and signing of a data use agreement enable access, and from version 3.0.0 onwards only credentialed users who sign the DUA can access the files. No training is required.
  access_urls:
