instances:
- id: https://cm4ai.org/data-releases/#instance-mda-mb-468
  name: MDA-MB-468 triple-negative breast cancer cell line
  instance_type: human cancer cell line under treated and untreated conditions
  description: '"MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established
    from a metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma,
    available from ATCC. This cell line has been extensively used to study triple-negative breast cancer
    and is well characterized with data such as transcriptomic, mutational profile and whole-genome sequencing
    available." CM4AI interrogates it untreated (DMSO control) and treated with paclitaxel or vorinostat.
    Released data streams for this line comprise immunofluorescence images, SEC-MS protein-protein interaction
    data, AP-MS interactomes (first released in June 2026) and perturb-seq of 200 genes.'
- id: https://cm4ai.org/data-releases/#instance-kolf2-1j
  name: KOLF2.1J induced pluripotent stem cell line and its derivatives
  instance_type: human induced pluripotent stem cell line and differentiated derivatives
  description: '"The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male Northern
    European donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource.
    It is available for access by non-for-profit organizations via a simple MTA." CM4AI interrogates undifferentiated
    (parental) KOLF2.1J together with iPSC-derived neural progenitor cells (NPCs), neurons and cardiomyocytes.
    Released data streams for this line comprise whole-genome perturb-seq of more than 11,000 genes and
    SEC-MS capturing approximately 7,000 proteins.'
- id: https://cm4ai.org/data-releases/#instance-if-images
  name: Immunofluorescence confocal microscopy images
  instance_type: immunofluorescence image
  counts: 53788
  description: Immunofluorescence images acquired by immunofluorescence-based staining (ICC-IF) and confocal
    microscopy in the Lundberg Lab at Stanford University. In each image "Nuclei were stained with DAPI
    (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow channel); microtubules
    with tubulin antibody (red channel); and antibody against protein of interest (green channel)." The
    March 2025 release covers 563 proteins of interest per condition; the June 2025, October 2025 and
    June 2026 releases cover 464 proteins of interest per condition. The CM4AI data releases page lists
    IF images for 523 proteins among the flagship TNBC datasets and marks iPSC IF images as "coming soon".
  source_caveats: The count of 53,788 immunofluorescent images is the project-level "Data Insights" figure
    reported on cm4ai.org and cm4ai.org/data-releases; the sources do not break it down per release. The
    per-condition protein counts of 563 and 464 come from the Dataverse file descriptions of the individual
    releases, and the flagship-dataset figure of 523 comes from the releases page; the sources do not
    reconcile these three numbers.
- id: https://cm4ai.org/data-releases/#instance-protein-interactions
  name: Protein-protein interactions
  instance_type: protein-protein interaction
  counts: 1374
  description: Protein-protein interaction measurements generated by affinity purification mass spectrometry
    (AP-MS) and size-exclusion chromatography mass spectrometry (SEC-MS). The figure of 1,374 protein
