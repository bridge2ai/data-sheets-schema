  description: '"This dataset is the June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI;
    CM4AI.org), the Functional Genomics Grand Challenge in the NIH Bridge2AI program. CM4AI is generating
    multi-modal data including protein-protein interaction (PPI), spatial localization, and genetic perturbation
    data in MDA-MB-468 breast cancer cells (+/- paclitaxel or vorinostat) and iPSCs (+/- differentiation).
    This Beta release includes: Perturb-seq data for MDA-MB-468 breast cancer cells +/- treatment and
    undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells +/- treatment,
    undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron progenitor cells (NPCs), neurons, and cardiomyocytes;
    AP-MS data for MDA-MB-468 breast cancer cells + treatment; IF images in MDA-MB-468 breast cancer cells
    +/- treatment." Dataverse Publication Date 2026-06-17; version 2 released 2026-07-15T20:28:19Z; 181
    downloads recorded at capture. This is the first captured release to include AP-MS interactome data,
    and the first to link a Figshare copy of the CRISPRi Perturbation Atlas of iPSCs. The description
    block ends with the date "(2025-06-30)", carried over from the earlier releases. The CM4AI data releases
    page presents this as "Our latest data release" under the heading "June 2026 Data Release (Beta)"
    with the DOI doi.org/10.18130/V3/HIGT4C, and describes it as "the June 2026 Data Release of CM4AI,
    the Functional Genomics Grand Challenge in the NIH Bridge2AI program."'
  source_caveats: 'The page displays "Version 2.0" while the data citation on the same page ends "V2".
    The CM4AI data releases page shows "Released on: June 17, 2025" for this release while the Dataverse
    record gives Publication Date 2026-06-17. The three immunofluorescence archives carry the same file
    names and displayed sizes as in the June 2025 and October 2025 releases but different MD5 checksums,
    and the release gives no file-level descriptions. Some author affiliations are recorded as ROR identifiers
    rather than names in this release. File sizes are displayed in rounded units, so `bytes` is omitted
    for every file.'
