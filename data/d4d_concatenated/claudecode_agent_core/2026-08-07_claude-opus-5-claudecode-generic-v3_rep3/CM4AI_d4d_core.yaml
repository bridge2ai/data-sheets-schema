  description: 'Releases are deposited in the collection "University of Virginia Dataverse > LibraData:
    UVa''s Scholarly Research > School of Medicine > Cell Maps for Artificial Intelligence". "LibraData
    is the University of Virginia''s instance of Dataverse, an NIH-approved generalist repository." All
    files in every captured release are marked File Access "Public". Each release page states "The dataset
    is too large to download. Please select the files you need from the files table", and the download
    dialog states "The files selected are too large to download as a ZIP. You can select individual files
    that are below the 953.7 MB download limit from the files table, or use the Data Access API for programmatic
    access to the files." Package files can also be retrieved with a download manager from https://dataverse.lib.virginia.edu/api/access/datafile/.
    Metadata can be exported as OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD, DDI Codebook v2, Dublin
    Core, DDI HTML Codebook and JSON; the October 2025 and June 2026 releases additionally offer Croissant.'
