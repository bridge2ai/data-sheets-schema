    version 2.1.
updates:
  id: https://cm4ai.org/data-releases/#update-plan
  name: Quarterly release plan
  frequency: Quarterly
  update_details: '"CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input
    data streams." The Maintenance Plan in the release records states that the "Dataset will be regularly
    updated and augmented through the end of the project in November 2026", with "Updates on a quarterly
    basis" and "Long term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds". The March 2025 release description adds that "Data presented here will be augmented
    regularly through the end of the project." The CM4AI data releases page marks IF images for the iPSC
    flagship dataset and AP-MS interactomes for the TNBC flagship dataset as "coming soon"; AP-MS interactomes
    for MDA-MB-468 first appear in the June 2026 release.'
  source_caveats: NIH RePORTER gives the project end as 2026-08-31, while the maintenance plan in the
    release records says the project ends in November 2026.
version_access:
  id: https://cm4ai.org/data-releases/#version-access
  name: Release versioning and archive
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
  - Cell Maps for Artificial Intelligence - Data Release, V1, doi:10.18130/V3/DXWOS5 (cited in the CM4AI
    preprint)
  - Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta), Version 1.4, doi:10.18130/V3/B35XWX
  - Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta), Version 2.1, doi:10.18130/V3/F3TD5R
  - Cell Maps for Artificial Intelligence - October 2025 Data Release (Beta), Version 2.1, doi:10.18130/V3/K7TGEM
  - Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta), Version 2.0, doi:10.18130/V3/HIGT4C
  version_details: Each quarterly release is a separate published Dataverse dataset with its own DOI and
    its own version history, and earlier releases remain published and publicly accessible. The CM4AI
    data releases page presents the June 2026 release as "Our latest data release" and lists "May 2024
    Data Release", "March 2025 Data Release", "June 2025 Data Release" and "October 2025 Data Release"
    under "Archive". Long-term preservation is in the University of Virginia Dataverse, "supported by
    committed institutional funds". Both the CM4AI website and the Dataverse collection carry the notice
    "This repository is under review for potential modification in compliance with Administration directives."
  source_caveats: 'The displayed version number and the version in the data citation disagree on every
    captured release: Version 1.4 versus citation V1 for the March 2025 release, Version 2.1 versus V2
    for the June 2025 and October 2025 releases, and Version 2.0 versus V2 for the June 2026 release.
    The Dataset Version / Version Note / Contributors / Published on table returns "No records found."
    on every captured page, so no per-version publication history is available from the bundle.'
external_resources:
- id: https://cm4ai.org/data-releases/#external-repositories
  name: External repositories hosting CM4AI raw and component data
