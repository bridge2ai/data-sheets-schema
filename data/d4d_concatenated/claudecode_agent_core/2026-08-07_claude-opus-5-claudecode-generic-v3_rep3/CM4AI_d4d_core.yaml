- id: https://cm4ai.org/data-releases/#instance-proteins-investigated
  name: Proteins investigated
  instance_type: protein
  counts: 7023
  description: Project-level "Data Insights" count of total proteins investigated, reported on cm4ai.org
    and cm4ai.org/data-releases. The releases page separately states that SEC-MS captures approximately
    7,000 proteins for both the iPSC and the TNBC flagship datasets.
- id: https://cm4ai.org/data-releases/#instance-genes-targeted
  name: Genes targeted by CRISPRi perturbation
  instance_type: gene
  counts: 11739
  description: '"This dataset represents an expressed genome-scale CRISPRi Perturbation Cell Atlas in
    undifferentiated KOLF2.1J human induced pluripotent stem cells (hiPSCs) mapping transcriptional and
