purposes:
- id: https://cm4ai.org/data-releases/#purpose-ai-ready-cell-architecture
  name: Deliver AI-ready maps of human cell architecture
  response: '"CM4AI''s objective is to deliver machine-readable hierarchical maps of cell architecture
    as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines
    under perturbed and unperturbed conditions." Its overarching mission is "to produce ethical, AI-ready
    datasets of cell architecture, inferred from multimodal data collected for human cell lines, to enable
    transformative biomedical AI research."'
- id: https://cm4ai.org/data-releases/#purpose-interpretable-genotype-phenotype
  name: Support interpretable genotype-phenotype learning
  response: '"The CM4AI data generation project seeks to map the spatiotemporal architecture of human
    cells and use these maps toward the grand challenge of interpretable genotype-phenotype learning."
    The project creates "a library of large-scale maps of cellular structure/function across demographic
    and disease contexts" that "will broadly stimulate research and development in ''visible'' machine
    learning systems informed by multi-scale cell and tissue architecture."'
- id: https://cm4ai.org/data-releases/#purpose-ethical-ai-readiness
  name: Demonstrate ethical, FAIR, AI-ready data practice
  response: CM4AI defines AI-Ready biomedical data as "fully characterized FAIR data of known provenance,
    which can be ethically and reliably processed by AI applications; whose models and software are available
    and well-described for validation and re-use; and whose predictions may be fully explained and interpreted
    to the user as needed." The project implements "a standards data management approach based on FAIR
    access and software principles, with deep provenance and replication packages for representation of
    cell maps and their underlying datasets" and initiates "a research program in ethical AI".
tasks:
- id: https://cm4ai.org/data-releases/#task-visible-machine-learning
  name: Enable visible machine learning systems
  response: '"This Bridge2AI data generation project will generate a resource of matched data and tools
    to enable the creation of ''visible'' ML systems, which are not black boxes but are built directly
    on knowledge maps of cell and tissue architecture." Cell maps "have been used in AI tools for ''visible
    machine learning'' or ''visible neural networks'' (VNNs) to interrogate how protein assemblies in
    the cell affect cell-level phenotype predictions."'
- id: https://cm4ai.org/data-releases/#task-ai-model-training
  name: AI model training and functional genomics analysis
  response: The release records state the datasets are intended as "AI-ready datasets to support research
    in functional genomics", for "AI model training", for "cellular process analysis", and for study of
    "cell architectural changes and interactions in presence of specific disease processes, treatment
    conditions, or genetic perturbations".
addressing_gaps:
- id: https://cm4ai.org/data-releases/#gap-black-box-models
  name: Uninterpretable genotype-to-phenotype models
  response: '"In genomics and precision medicine, machine learning models are often ''black boxes,'' predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs. To
    address this deficiency, project will launch a coordinated effort involving three complementary mapping
    approaches - proteomic mass spectrometry, cellular imaging, and genetic perturbation via CRISPR/Cas9."
    "Machine learning (ML) models show great promise in analyzing the human genome to make predictions,
    but the inner workings of these models are typically difficult-to-interpret ''black boxes.''"'
- id: https://cm4ai.org/data-releases/#gap-unexplored-cell-architecture
  name: Incomplete knowledge of subcellular architecture
  response: The CM4AI preprint states that cell maps "provide a foundation for downstream applications
    in human genomics, including interpretation of genetic variants and mutations", and that the project's
    contribution is to produce these maps as ethically sourced, provenanced, AI-ready data rather than
    as isolated experimental results.
- id: https://cm4ai.org/data-releases/#gap-ai-ready-standards
  name: Absence of an operational AI-readiness standard for biomedical data
  response: '"AI-Readiness has been defined in multiple ways in the literature. Regardless of the specific
    definitions adopted, in all cases significant requirements are placed on the datasets used to train
    AI/ML models and on datasets analyzed using these AI/ML models." CM4AI therefore defines and implements
    five criteria - FAIR, Provenanced, Characterized, Explainable and Ethical - and uses an expanded FAIRSCAPE
    framework to establish a basis for AI-readiness.'
