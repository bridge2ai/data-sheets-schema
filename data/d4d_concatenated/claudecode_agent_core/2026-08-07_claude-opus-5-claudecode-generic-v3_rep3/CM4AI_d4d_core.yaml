    (undifferentiated) and in MDA-MB-468 breast cancer cells (+/- treatment) are marked "Embargoed" rather
    than resolving to a repository.
  description: 'Release records list these under "External Data Links: Access external data resources
    related to this dataset". The releases themselves also bundle RO-Crate metadata that carries "resolvable
    references" to externally held components, and FAIRSCAPE-issued ARK persistent identifiers "resolve
    to complete human- and machine-readable metadata including licensing information, and provide links
    to the underlying datasets".'
- id: https://cm4ai.org/data-releases/#external-vocabularies
  name: Public ontologies and vocabularies used in release metadata
  external_resources:
  - NCI Thesaurus (NCIT) - AI, artificial intelligence, protein-protein interaction
  - BioAssay Ontology (BAO) - affinity purification, CRISPR/Cas9
  - Software Ontology (SWO) - AP-MS
  - LOINC - breast cancer
  - Cell Ontology (CL) - cardiomyocyte, neural progenitor cell, NPC, neuron
  - Experimental Factor Ontology (EFO) - induced pluripotent stem cell, iPSC, perturb-seq, perturbation
    sequencing, single-cell RNA sequencing, scRNAseq
  - Ontology of Biomedical Investigations (OBI) - machine learning
  - Medical Subject Headings (MeSH) - mass spectroscopy
  - Chemical Entities of Biological Interest (ChEBI) - paclitaxel, vorinostat
  - Gene Ontology (GO) - protein localization
  - Schema.org, EVI Evidence Graph Ontology and PROV-O - RO-Crate and provenance metadata
  description: Keyword terms in the Dataverse citation metadata are bound to public ontology IRIs, and
    FAIRSCAPE metadata is "expressed in the JSON-LD graph language using vocabularies from Schema.org,
    EVI, and other well-defined public ontologies". CM4AI AI-readiness also requires "mapping data elements
    to public ontology vocabularies, where appropriate, using JSON-Schema mini-data-dictionary descriptions
    resolvable from the provenance graph metadata." The keywords Bridge2AI, CM4AI, KOLF2.1J, MDA-MB-468,
    SEC-MS and size exclusion chromatography carry no ontology binding in the release metadata.
