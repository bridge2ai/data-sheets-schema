id: https://cm4ai.org/data-releases/
name: CM4AI Data Releases
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: The quarterly data release programme of Cell Maps for Artificial Intelligence (CM4AI), the
  Functional Genomics Grand Challenge in the U.S. National Institutes of Health Bridge2AI programme. CM4AI
  states that it "will deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
  together with quarterly data releases of map-input data streams". The map-input data streams are generated
  by multimodal interrogation of chromatin modifiers, metabolic enzymes and other proteins implicated
  in cancer, neuropsychiatric and cardiac disorders, in disease-relevant human cell lines under treated
  and untreated conditions, using mass-spectrometry-based proteomics (affinity purification mass spectrometry,
  AP-MS; size-exclusion chromatography mass spectrometry, SEC-MS), spatial proteomics / immunofluorescence
  cell imaging, and genetic perturbation via CRISPR/Cas9 (perturb-seq). The two cell systems interrogated
  are the MDA-MB-468 triple-negative breast cancer line (untreated / DMSO control, paclitaxel and vorinostat)
  and the KOLF2.1J induced pluripotent stem cell line (parental and iPSC-derived neural progenitor cells,
  neurons and cardiomyocytes). Output data are packaged with provenance graphs and rich metadata as AI-ready
  datasets in RO-Crate format using an extended client-server version of the FAIRSCAPE framework, and
  are deposited in LibraData, the University of Virginia's Dataverse instance and an NIH-approved generalist
  repository. Each quarterly release is published as a separate Dataverse dataset with its own DOI; the
  releases captured in the declared bundle are the March 2025 (10.18130/V3/B35XWX), June 2025 (10.18130/V3/F3TD5R),
  October 2025 (10.18130/V3/K7TGEM) and June 2026 (10.18130/V3/HIGT4C) releases, together with the earlier
  "Cell Maps for Artificial Intelligence - Data Release" V1 (10.18130/V3/DXWOS5) cited in the CM4AI preprint.
  The project website reports aggregate figures of 1,374 protein interactions, 53,788 immunofluorescent
  images, 7,023 total proteins investigated, 11,739 genes targeted and 21.4 TB of data volume. All releases
  are labelled Beta; the release records state that computed cell maps are not yet included.
notes: 'CM4AI is organised into three pillars (Data, People, Ethics) implemented by six modules: Data
  Acquisition, Tools and Standards (Data pillar); Skills and Workforce Development and Teaming (People
  pillar); and Ethics. The Tools module produces the Multi-Scale Integrated Cell (MuSIC) pipeline that
  integrates the released input data streams into hierarchical cell maps; the Standards module produces
  the FAIRSCAPE AI-readiness packaging used on every release.'
source_caveats: 'Referent: this record documents the CM4AI data release programme as a whole - the ongoing
  quarterly series of CM4AI Data Releases in the University of Virginia Dataverse - with the individual
  releases enumerated under `resources`. The declared bundle describes the programme (cm4ai.org, cm4ai.org/data-releases,
  the CM4AI preprint, NIH RePORTER) and four separate release landing pages with four distinct DOIs, so
  no single release is the referent the bundle best supports. The bundle also contains a Nature research
  article (Schaffer et al., Nature 642, 222-231, 2025, doi:10.1038/s41586-025-08878-3) describing a multimodal
  cell map of U2OS osteosarcoma cells. That is a distinct dataset: it uses a different cell line, is distributed
  through NDEx, MassIVE (MSV000097168), ProteomeXchange (PXD052362), the Human Protein Atlas v23 release
  and ModelArchive rather than through the CM4AI Dataverse releases, and none of the four CM4AI release
  records lists it among their contents or their Related Publications. Its funding acknowledgement names
  the Bridge2AI programme award OT2 OD032742 among several others, and several authors are shared with
  CM4AI. Its composition, methods, counts, funders and access facts have therefore not been merged into
  this record; the two entities are kept distinct. `total_size_bytes` is omitted although cm4ai.org reports
  a data volume of 21.4 TB, and `File.bytes` is omitted throughout although Dataverse displays rounded
  file sizes (for example "3.8 GB", "31.1 KB"): the sources do not state whether these use decimal or
  binary units, and converting them would fabricate precision. The displayed sizes are recorded in the
  corresponding file descriptions instead. MD5 checksums, which the source states exactly, are recorded
  in `md5`. Source disagreements carried through rather than resolved: (a) the CM4AI data releases page
  labels the current release "June 2026 Data Release (Beta)" but displays "Released on: June 17, 2025",
  while the Dataverse record for the same DOI gives publication date 2026-06-17; (b) the collaborating-institution
  list differs between sources (see `creators`); (c) NIH RePORTER gives a project end of 2026-08-31 while
  the release records'' maintenance plan says the project ends in November 2026; (d) every release record,
  including the June 2026 one, repeats Data Creation Date and Deposit Date 2025-02-27. The bundle contains
  no CM4AI-sourced repository URL for the MuSIC / Tools pipeline software, so no `Software` object was
  created for it; the only CM4AI-stated software URLs are https://fairscape.github.io (FAIRSCAPE, MIT)
  and http://integrativemodeling.org (Integrative Modeling Platform). Quotation convention: passages quoted
  from the CM4AI preprint have their inline reference-marker digits removed, because the PDF-to-text conversion
  in the bundle renders superscript citation numbers as digits inside the running text (for example "the
  Network Data Exchange (NDEx)13 and can be visualized..."). Typographic apostrophes and accented characters
  from the sources are rendered as their ASCII equivalents. No other wording has been altered.'
