sampling_strategies:
- id: https://cm4ai.org/data-releases/#sampling-protein-selection
  name: Targeted protein and gene selection with genome-scale perturbation
  is_sample: true
  is_representative: false
  why_not_representative: '"Data in this release was derived from commercially available de-identified
    human cell lines" and "Does not represent all biological variants which may be seen in the population
    at large."'
  strategies: CM4AI targets "100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric,
    and cardiac disorders". Protein-protein interaction mapping addresses "100 chromatin regulators under
    different conditions"; seventeen genes were endogenously tagged in MDA-MB-468 for AP-MS with 34 additional
    genes in progress. Spatial proteomics mapped 100 chromatin regulators in MDA-MB-468 "with another
    500 proteins pending significant hits from the genetic perturbations and PPI results". Single-cell
    CRISPR screens used "a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs
    per gene"; the KOLF2.1J perturbation atlas is expressed-genome-scale, covering 11,739 targeted genes.
  source_caveats: The declared bundle does not state how the 100 chromatin modifiers and 100 metabolic
    enzymes were chosen from the larger set of candidates, nor whether the selection was random.
acquisition_methods:
- id: https://cm4ai.org/data-releases/#acquisition-direct-measurement
  name: Direct experimental measurement on cultured human cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  acquisition_details: 'All released data are direct laboratory measurements on cultured cell lines rather
    than observations of or reports by human participants. "CM4AI input data streams are generated using
    immunofluorescence (IF) subcellular microscopy for spatial proteomics data; affinity purification
    mass spectroscopy (AP-MS) and size exclusion mass spectroscopy (SEC-MS) methods for protein-protein
    interaction (PPI) data; and single-cell CRISPR-Cas perturbation screens by cell type." The Dataverse
    governance block for each release records "Human Subjects: No" and "De-identified Samples: Yes".'
collection_mechanisms:
- id: https://cm4ai.org/data-releases/#mechanism-ap-ms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details: '"To map protein-protein interactions (PPIs) of 100 chromatin regulators under different
    conditions (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes),
    we employed AP-MS on endogenously tagged cell lines... We have endogenously tagged 17 genes in MDA-MB-468
    and acquired AP-MS data under three conditions (untreated, paclitaxel and vorinostat treated). We
    are currently in the process of tagging 34 additional genes in MDA-MB-468 cells." AP-MS interactomes
    for MDA-MB-468 first appear in the June 2026 release.'
- id: https://cm4ai.org/data-releases/#mechanism-sec-ms
  name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details: SEC-MS was used "for proteome-wide complex/interaction mapping" as an orthogonal
    mass-spectrometry approach. "In addition, we have performed SEC-MS on MDA-MB-468 cells under three
    conditions (untreated, paclitaxel and vorinostat treated), which enabled us to identify 72/100 chromatin
    modifiers, with 52 of them being integral components of protein complexes... We detected PPI profiles
    of over a thousand complexes in MDA-MB468 cells, with thousands of proteins exhibiting differential
    elution profiles between control and paclitaxel or vorinostat treated cells. SEC-MS has also been
    performed in KOLF2 iPSCs and derivatives, uncovering more than 700 protein complexes in both parental
    iPSCs and differentiated neurons." SEC-MS data were generated in the Nevan Krogan laboratory at the
    University of California San Francisco.
- id: https://cm4ai.org/data-releases/#mechanism-if-imaging
  name: Immunofluorescence subcellular imaging
  mechanism_details: '"For Year 1, we proposed to map the spatial subcellular organization of key chromatin
    modifiers, their interactors and key signaling molecules involved in cancer using the Human Protein
    Atlas resource of antibodies. We established automated fixation and permeabilization protocols for
    the pipetting robot for MDA-MB-468 and KOLF2 cell lines, and completed spatial proteomics mapping
    of 100 chromatin regulators in the MDA-MB-468 cells (+/- paclitaxel or vorinostat)." Imaging is by
    immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
    University, with DAPI, calreticulin and tubulin reference channels alongside the channel for the protein
    of interest.'
- id: https://cm4ai.org/data-releases/#mechanism-crispr-perturb-seq
  name: Single-cell CRISPR perturbation screens (perturb-seq)
  mechanism_details: '"For Year 1, we performed single-cell CRISPR screens perturbing 100 chromatin regulators
    in the MDA-MB-468 cells under 3 conditions (no treatment, paclitaxel or vorinostat) and KOLF2 iPSC
    in the undifferentiated state. We have designed a CRISPR lentiviral library targeting 100 chromatin
    factors with 6 guide RNAs per gene. We generated and characterized MDA-MB-468 and KOLF2 CRISPR lines
    expressing inducible dCas9. Single-cell CRISPR screens of 100 chromatin regulators (+/- drug) in MDA-MB-468
    cells and in undifferentiated KOLF2.1J iPSCs were done using the 10x Genomics 3''HT kit." The genome-scale
    CRISPRi Perturbation Cell Atlas in KOLF2.1J maps "transcriptional and fitness phenotypes associated
    with 11,739 targeted genes"; the preprint states the findings were validated "via phenotypic, protein-interaction,
    and metabolic tracing assays".'
