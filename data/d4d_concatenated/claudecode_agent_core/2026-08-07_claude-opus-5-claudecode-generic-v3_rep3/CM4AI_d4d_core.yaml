  source_caveats: Because the same creation date is carried on the June 2026 release, which contains files
    first published on 2026-06-17 and 2026-07-15, this field cannot be read as the collection date of
    the content of the later releases. It is recorded as stated rather than corrected or converted into
    `start_date` / `end_date`.
raw_data_sources:
- id: https://cm4ai.org/data-releases/#raw-source-krogan-archive
  name: Krogan Laboratory deposition archive
  source_description: Protein-protein interaction networks for the cell line and conditions are downloaded
    from the Krogan Laboratory's deposition archive and made available for further processing by the MuSIC
    pipeline.
  source_type: laboratory deposition archive
- id: https://cm4ai.org/data-releases/#raw-source-lundberg-archive
  name: Lundberg Laboratory deposition archive
  source_description: Immunofluorescence images for the cell line and conditions are downloaded from the
    Lundberg Laboratory's deposition archive and made available for further processing by the MuSIC pipeline.
  source_type: laboratory deposition archive
- id: https://cm4ai.org/data-releases/#raw-source-massive
  name: MassIVE Repository
  source_description: Mass spectrometry data underlying the releases are deposited in the MassIVE Repository.
    The June 2025 release links "Mass Spectrometry Data (Human iPSCs)" and "Mass Spectrometry Data (Human
    Cancer Cells)"; the October 2025 and June 2026 releases link SEC-MS data for KOLF2.1J iPSCs (undifferentiated,
    NPC, neuron and cardiomyocyte) and for MDA-MB-468 cells (+/- treatment), and the June 2026 release
    additionally links AP-MS data for MDA-MB-468 cells treated with paclitaxel and with vorinostat.
  source_type: public proteomics repository
  access_details: Linked from the External Data Links block of the release records.
- id: https://cm4ai.org/data-releases/#raw-source-sra
  name: NCBI BioProject / Sequence Read Archive
  source_description: 'The June 2025 release links "Sequence Read Archive (SRA) Data: NCBI BioProject"
    for the CRISPRi perturbation raw sequence data. Raw sequence data from the genome-scale CRISPRi Perturbation
    Cell Atlas in KOLF2.1J hiPSCs are also distributed inside the releases themselves as cm4ai_perturb-seq_KOLF2_raw_sra.'
  source_type: public sequence repository
- id: https://cm4ai.org/data-releases/#raw-source-figshare
  name: Figshare
  source_description: 'The June 2026 release links "CRISPRi Perturbation Atlas of iPSCs: Figshare" among
    its external data resources.'
  source_type: generalist repository
- id: https://cm4ai.org/data-releases/#raw-source-pride
  name: PRIDE
  source_description: The March 2025 release states of the SEC-MS dataset generated on undifferentiated
    KOLF2.1J hiPSCs that "The data will be uploaded to Pride when available."
  source_type: public proteomics repository
raw_sources:
- id: https://cm4ai.org/data-releases/#raw-data-perturb-seq-sra
  name: Raw CRISPRi perturb-seq sequence data
  raw_data_details: Raw sequence data are distributed alongside the processed perturbation atlas. "This
    dataset represents raw sequence data from an expressed genome-scale CRISPRi Perturbation Cell Atlas
    in KOLF2.1J human induced pluripotent stem cells (hiPSCs) mapping transcriptional and fitness phenotypes
    associated with 11,739 targeted genes." The March 2025 release carries this as the "CRISPR Perturbation
    RNA Sequences - Raw Sequences" RO-Crate; the October 2025 and June 2026 releases carry it as cm4ai_perturb-seq_KOLF2_raw_sra.zip.
preprocessing_strategies:
- id: https://cm4ai.org/data-releases/#preprocessing-fairscape-packaging
  name: FAIRSCAPE AI-readiness packaging into RO-Crates
  preprocessing_details: '"CM4AI output data are packaged with provenance graphs and rich metadata as
    AI-ready datasets in RO-Crate format using the FAIRSCAPE framework." FAIRSCAPE consists of a client-side
    Python3 application (FAIRSCAPE-CLI) and a server application. "The client-side package, FAIRSCAPE-CLI,
    is called when any computation or coherent set of computations in the pipeline is completed, and it
    is passed metadata which defines schemas in JSON-Schema for the datasets in the computational unit,
    as well as the inputs, computations, software, models, and outputs. FAIRSCAPE-CLI creates an RO-Crate
    package with the datasets, metadata, and software - or resolvable references to these components -
    and unique stubs for identifier creation on each of these components. The RO-Crates are then sent
    to the FAIRSCAPE server where they are registered and assigned persistent, resolvable, globally unique
    persistent identifiers (PIDs)... The PID system currently in use is the ARK scheme - with DOIs a future
    feature as supplementary PIDs for final-state publishable work. Lastly, the server computes end-to-end
    entailments on each RO-Crate''s provenance as expressed in the EVI Evidence Graph Ontology and links
    them together where possible." PIDs "resolve to machine- and human-readable landing pages containing
    the metadata, expressed in the JSON-LD graph language using vocabularies from Schema.org, EVI, and
    other well-defined public ontologies", with alternate JSON-LD and RDF-XML serializations.'
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    license: MIT
    url: https://fairscape.github.io
    description: '"The FAIRSCAPE AI-readiness framework is described with a tutorial and instructions
      for installation at https://fairscape.github.io. Copyright (c) 2024 to this software is held by
      the Rector and Board of Visitors of the University of Virginia. It is available under open source
      MIT License." Both the client-side and server-side FAIRSCAPE packages are pip-installable.'
- id: https://cm4ai.org/data-releases/#preprocessing-music-pipeline
  name: Multi-Scale Integrated Cell (MuSIC) integration pipeline
  preprocessing_details: 'The Tools module maintains "a dataset integration and map production system,
    the Multi-Scale Integrated Cell (MuSIC) pipeline, which produces integrated cell maps from the multiple,
    multi-modal input data streams. The MuSIC pipeline is divided into multiple segments, each of which
    calls the FAIRSCAPE client package to validate inputs and create the output RO-Crate package for that
    segment." Its steps are: (a) download PPI and image data from the Krogan and Lundberg laboratory deposition
    archives; (b) generate embeddings, processing PPI networks with the node2vec deep learning model and
    IF images with a Human Protein Atlas deep learning model, each reducing dimensionality; (c) co-embedding,
    integrating the PPI and image embeddings "using contrastive deep learning" so that "the original embeddings
    can be reconstructed with minimal information loss and proteins with similar PPI and image embeddings
    have similar co-embeddings"; (d) protein community detection over all-by-all co-embedding similarities,
    yielding a hierarchy of protein communities as the final cell map; and (e) hierarchy evaluation, aligning
    cell maps to Gene Ontology and Reactome and annotating assemblies with a large language model. Software
    is "available under BSD-3 open source license in GitHub (for alpha level tools) or in the Zenodo long-term
    archive (for production-ready tools)", with links packaged in the RO-Crates.'
  source_caveats: The pipeline produces cell maps, which every captured release record states are not
    included ("Computed cell maps not included in this release"). It is recorded here because the CM4AI
    data releases page defines the programme's deliverable as cell maps "together with quarterly data
    releases of map-input data streams", so the pipeline is in scope for the programme even though its
    outputs are not in the captured releases. The declared bundle gives no CM4AI-sourced repository URL
    for this software.
- id: https://cm4ai.org/data-releases/#preprocessing-integrative-structure-modeling
  name: Integrative structure modelling of MuSIC communities
  preprocessing_details: '"We are currently exploring the feasibility of integrative structure modeling
    of the MuSIC communities... we developed a bioinformatics pipeline for annotating MuSIC communities
    by the available structural information about the community members and their interactions. This structural
    information includes data from the Protein Data Bank (PDB), AlphaFold Protein Structure Database (AlphaFoldDB),
    crosslinking mass spectrometry, and prediction of disordered sequence segments. We then ranked the
    MuSIC communities by the amount of available structural information, serving as a proxy for the feasibility
    of integrative structure modeling." The four-stage modelling protocol was "scripted using the Python
    Modeling Interface package, a library for modeling macromolecular complexes based on our open-source
    Integrative Modeling Platform (IMP) package version 2.18".'
  used_software:
  - id: http://integrativemodeling.org
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    url: http://integrativemodeling.org
    description: Open-source package underlying the Python Modeling Interface used to script the integrative
      structure modelling protocol.
  source_caveats: The preprint describes this work as exploratory and in progress; no structural models
    appear in the captured release file inventories.
cleaning_strategies:
- id: https://cm4ai.org/data-releases/#cleaning-june-2025-revision
  name: June 2025 release revision
  cleaning_details: '"This dataset is a revision of the June 2025 Data Release of Cell Maps for Artificial
    Intelligence (CM4AI; CM4AI.org)... This revision includes adding RGB immunofluorescent images, corrections
    to ro-crate metadata, and changes to naming conventions."'
- id: https://cm4ai.org/data-releases/#cleaning-perturb-seq-qc
  name: Quality control of single-cell CRISPR screen data
  cleaning_details: 'Of the Year 1 single-cell CRISPR screens in MDA-MB-468 and undifferentiated KOLF2.1J
    iPSCs, the CM4AI preprint states: "The resulting data are currently being QCed."'
machine_annotation_tools:
- id: https://cm4ai.org/data-releases/#annotation-llm-assembly-naming
  name: Large language model annotation of cell map assemblies
  tools:
  - large language model (LLM) assembly naming with confidence scoring
  - Gene Ontology alignment
  - Reactome alignment
  tool_descriptions: '"Cell maps are annotated in a two pronged approach. First, cell maps are aligned
    to known protein function and pathway resources, including the Gene Ontology (GO) and Reactome, to
    determine protein assemblies in the cell map with high overlap with known cell biology. Second, assemblies
    in the cell maps are annotated using a large language model (LLM) approach that we developed to name
    sets of proteins and assign a name confidence score."'
  source_caveats: This annotation step applies to computed cell maps, which the captured releases state
    are not included. It is recorded as part of the programme's declared pipeline rather than as a property
    of the released files.
missing_data_documentation:
- id: https://cm4ai.org/data-releases/#completeness
  name: Release completeness statement
  missing_data_patterns: 'The release records state under Completeness that "These data are not yet in
    completed final form": some datasets are under temporary pre-publication embargo; "Protein-protein
    interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturbSeq data interrogate sets
    of proteins which incompletely overlap"; and "Computed cell maps not included in this release".'
  missing_data_causes: The releases are interim products of an ongoing quarterly release programme, and
    the modalities were applied to overlapping but non-identical protein sets. In the October 2025 and
    June 2026 releases, perturb-seq data in KOLF2.1J iPSCs (undifferentiated) and in MDA-MB-468 cells
    (+/- treatment) are marked "Embargoed" in the External Data Links block.
  handling_strategy: '"Data presented here will be augmented regularly through the end of the project",
    with updates on a quarterly basis; the CM4AI data releases page marks not-yet-released components
    explicitly, listing IF images for iPSC-derived cell types and AP-MS interactomes for the TNBC datasets
    as "coming soon".'
anomalies:
- id: https://cm4ai.org/data-releases/#anomaly-metadata-corrections
  name: RO-Crate metadata corrections and naming-convention changes
  anomaly_details: The June 2025 release record states that the published dataset is a revision that "includes
    adding RGB immunofluorescent images, corrections to ro-crate metadata, and changes to naming conventions",
    indicating that the metadata and file naming of the preceding version required correction. The June
    2025 landing page also carries the notice 'The "DRAFT" version was not found. This is version "2.1".'
- id: https://cm4ai.org/data-releases/#anomaly-if-image-checksums
  name: Identical immunofluorescence archive names and sizes with differing checksums
  anomaly_details: The three MDA-MB-468 immunofluorescence archives (paclitaxel, untreated, vorinostat)
    appear in the June 2025, October 2025 and June 2026 releases under identical file names and identical
    displayed sizes (3.8 GB, 4.6 GB, 4.2 GB). The June 2025 and October 2025 releases carry the same MD5
    checksums (0d972b80744344ddeede516a0cf6e3d7, a98affcc05429650c6bb3906cd836d55, ad4e68ccc14b0f3349dad3321e7b81b2),
    whereas the June 2026 release reports different checksums for the same three names (6c1a86520eec2696ec19444eb8a8b428,
    6d066e6b9d762284c6aa5d0b44565568, df79632753989ef23b0a3df6604d4af1). The declared bundle does not
    explain what changed.
known_biases:
- id: https://cm4ai.org/data-releases/#bias-cell-line-representation
  name: Cell-line-derived data do not represent population biological variation
  bias_type: representation_bias
  bias_description: 'Under "Potential Sources of Bias" the release records state: "Data in this release
    was derived from commercially available de-identified human cell lines" and "Does not represent all
    biological variants which may be seen in the population at large."'
  affected_subsets:
  - MDA-MB-468 triple-negative breast cancer cell line data
  - KOLF2.1J induced pluripotent stem cell line data
known_limitations:
- id: https://cm4ai.org/data-releases/#limitation-interim-release
  name: Interim release
  limitation_type: scope_limitation
  limitation_description: The release records list "This is an interim release" first among the inherent
    limitations researchers should be aware of. Every captured release is labelled "(Beta)".
- id: https://cm4ai.org/data-releases/#limitation-no-cell-maps
  name: Predicted cell maps not included
  limitation_type: coverage_limitation
  limitation_description: The release "does not contain predicted cell maps, which will be added in future
    releases".
  recommended_mitigation: Future quarterly releases are stated to add the computed maps.
- id: https://cm4ai.org/data-releases/#limitation-individual-datasets
  name: Best suited to analysis of the individual datasets
  limitation_type: integration_limitation
  limitation_description: '"The current release is most suitable for bioinformatics analysis of the individual
    datasets."'
- id: https://cm4ai.org/data-releases/#limitation-domain-expertise
  name: Requires domain expertise
  limitation_description: The release records state that the data "Requires domain expertise for meaningful
    analysis."
- id: https://cm4ai.org/data-releases/#limitation-embargo
  name: Temporary pre-publication embargo on some component datasets
  limitation_type: temporal_limitation
  limitation_description: '"Some datasets are under temporary pre-publication embargo." In the October
    2025 and June 2026 release records the external links for perturb-seq data in KOLF2.1J iPSCs (undifferentiated)
    and in MDA-MB-468 cells (+/- treatment) are marked "Embargoed".'
existing_uses:
- id: https://cm4ai.org/data-releases/#use-codefest-2024
  name: CM4AI CodeFest, March 2024
  examples:
  - '"Initial Datasets, Tools and Standards associated with all three parallel mapping platforms have
    been released and are publicly available at our CM4AI web portal. These data were also made available
    at our CodeFest in March 2024, accompanied by detailed tutorials explaining how the data were derived
    and integrated, and providing production ready software for producing the datasets."'
  - The CodeFest was organised by the Workforce Development module "in collaboration with the Tools, Standards,
    Data, and Teaming Modules" and "was attended by both within-project and external participants", with
    training provided to 38 registrants.
- id: https://cm4ai.org/data-releases/#use-perturbation-atlas-preprint
  name: Perturbation cell atlas of human induced pluripotent stem cells
  examples:
  - 'The March 2025 and June 2025 release records list as a Related Publication: "Nourreddine S, Doctor
    Y, Dailamy A, Forget A, Lee YH, Chinn B, Khaliq H, Polacco B, Muralidharan M, Pan E, Zhang Y, Sigaeva
    A, Hansen JN, Gao J, Parker JA, Obernier K, Clark T, Chen JY, Metallo C, Lundberg E, Ideker T, Krogan
    N, Mali P. A PERTURBATION CELL ATLAS OF HUMAN INDUCED PLURIPOTENT STEM CELLS. bioRxiv. 2024 Nov 4;2024.11.03.621734.
    PMCID: PMC11580897 doi https://doi.org/10.1101/2024.11.03.621734"'
intended_uses:
- id: https://cm4ai.org/data-releases/#intended-use
  name: Stated intended uses
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations
  usage_notes: This four-item list is carried verbatim under the "Intended Use" heading of the June 2025,
    October 2025 and June 2026 release records.
other_tasks:
- id: https://cm4ai.org/data-releases/#other-task-variant-interpretation
  name: Interpretation of genetic variants and mutations
  task_details: '"Cell maps provide a foundation for downstream applications in human genomics, including
    interpretation of genetic variants and mutations. As an example, they have been used in AI tools for
    ''visible machine learning'' or ''visible neural networks'' (VNNs) to interrogate how protein assemblies
    in the cell affect cell-level phenotype predictions."'
prohibited_uses:
- id: https://cm4ai.org/data-releases/#prohibited-clinical-use
  name: Clinical decision-making and patient care
  prohibition_reason: '"These laboratory data are not to be used in clinical decision-making or in any
    context involving patient care without appropriate regulatory oversight and approval."'
- id: https://cm4ai.org/data-releases/#prohibited-commercial-use
  name: Commercial use without a separate licence
  prohibition_reason: The datasets are licensed CC BY-NC-SA 4.0, under which "You may not use the material
    for commercial purposes"; "A commercial use is one primarily intended for commercial advantage or
    monetary compensation." The CM4AI preprint adds that "Commercial use requires a separate license negotiation
    with the copyright holder (UCSD, Stanford, and/or UCSF depending upon the specific data package in
    question)."
future_use_impacts:
- id: https://cm4ai.org/data-releases/#future-impact-governance
  name: Ethical governance of downstream AI development
  impact_details: '"The Ethics team worked closely with Data Acquisition, Tools, and Standards Modules
    to develop a plan for ethical preparation, licensing, dissemination, and Data Access supervision of
    CM4AI datasets. This plan balances the openness of the data produced, with protection of the intellectual
    property, and supervision and monitoring of potential efforts at commercialization. In addition to
    CM4AI data governance initiatives, comprehensive guidelines and best practices are being established
    for the ethical development of AI systems leveraging this data." The ethical criterion for AI-readiness
    "involves anticipating potential applications of the data and derived AI/ML systems, integrating them
    into data governance frameworks to optimize benefits and mitigate potential risks, and promoting their
    use for the collective good."'
ethical_reviews:
- id: https://cm4ai.org/data-releases/#ethical-review-ravitsky
  name: CM4AI ethical review contact - Vardit Ravitsky
  review_details: 'The Data Governance & Ethics block of the June 2025, October 2025 and June 2026 release
    records names "Ethical Review: Vardit Ravitsky (ravitskyv@thehastingscenter.org) and Jean-Christophe
    Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca)".'
  contact_person: https://orcid.org/0000-0002-7080-8801
  source_caveats: '`contact_person` is not inlined in this schema, so it carries Vardit Ravitsky''s ORCID
    URI (0000-0002-7080-8801) as an identifier reference rather than a structured person record. The Dataverse
    author metadata gives Ravitsky''s affiliation as the University of Montreal, while the ethical-review
    contact email is ravitskyv@thehastingscenter.org and the CM4AI data releases page lists the Hastings
    Center among the collaborating institutions. Both are recorded rather than reconciled.'
- id: https://cm4ai.org/data-releases/#ethical-review-belisle-pipon
  name: CM4AI ethical review contact - Jean-Christophe Belisle-Pipon
  reviewing_organization: Simon Fraser University
  review_details: Named jointly with Vardit Ravitsky as the ethical review contact in the Data Governance
    & Ethics block of the June 2025, October 2025 and June 2026 release records, with contact email jean-christophe_belisle-pipon@sfu.ca.
  contact_person: https://orcid.org/0000-0002-8965-8153
  source_caveats: '`contact_person` is not inlined in this schema, so it carries Jean-Christophe Belisle-Pipon''s
    ORCID URI (0000-0002-8965-8153) as an identifier reference rather than a structured person record.'
- id: https://cm4ai.org/data-releases/#ethical-review-ethics-module
  name: CM4AI Ethics Module review process
  reviewing_organization: CM4AI Ethics Module
  review_details: '"The Ethics team employs a methodology inspired by Value-Sensitive Design (VSD), facilitating
    the creation of normative standards and expectations aimed at ensuring the responsible design of datasets
    and AI technologies, in alignment with core values. This entails the Ethics team engaging in conceptual
    efforts to craft an axiological repository - a repository of values - to guide the articulation of
    design standards and expectations. Further advancing this work, the Ethics team is instrumental in
    formulating the CM4AI Life Cycle, a framework designed to elucidate governance milestones throughout
    the data generation and AI system development processes." The Ethics Pillar "also supported the work
    initiated by the Bridge2AI Ethics Working Group for supporting the Bridge2AI Data Sharing and Dissemination
    Working Group in developing a Code of Conduct. The Code of Conduct outlines basic requirements for
    participants in the Bridge2AI Open House to access B2AI data (including CM4AI datasets), to attest
    and commit to it prior to accessing the data." The Ethics team is also "dedicated to conducting mixed
    empirical research, combining qualitative and quantitative methods" to capture community insights.'
human_subject_research:
  id: https://cm4ai.org/data-releases/#human-subjects
  name: Human subjects determination
  involves_human_subjects: false
  description: 'The Data Governance & Ethics block of the June 2025, October 2025 and June 2026 release
    records states "Human Subjects: No", "De-identified Samples: Yes" and "FDA Regulated: No". The CM4AI
    preprint states that CM4AI data "are non-clinical (from tissue cultures) and are considered to be
    de-identified as they cannot be matched, with current knowledge, to a human subject", and that both
    cell lines "have been ethically sourced".'
is_deidentified:
  id: https://cm4ai.org/data-releases/#deidentification
  name: De-identification status
  identifiable_elements_present: false
  deidentification_details: '"CM4AI data are distinctive within Bridge2AI in that they are non-clinical
    (from tissue cultures) and are considered to be de-identified as they cannot be matched, with current
    knowledge, to a human subject." Every captured release record with a Data Governance & Ethics block
    states "De-identified Samples: Yes".'
  source_caveats: The declared bundle records donor characteristics for both source cell lines - MDA-MB-468
    "established from a metastatic site pleural effusion of a 51-year-old black female with a metastatic
    mammary adenocarcinoma" and KOLF2.1J "derived from a healthy male Northern European donor" - but does
    not describe any de-identification procedure applied by CM4AI; the de-identification claim rests on
    the commercial provenance of the lines.
regulatory_restrictions:
  id: https://cm4ai.org/data-releases/#governance
  name: Data governance and regulatory status
  other_compliance: 'The Data Governance & Ethics block of the June 2025, October 2025 and June 2026 release
    records states "Human Subjects: No", "De-identified Samples: Yes" and "FDA Regulated: No". The Bridge2AI
    Code of Conduct developed with the Bridge2AI Data Sharing and Dissemination Working Group "outlines
    basic requirements for participants in the Bridge2AI Open House to access B2AI data (including CM4AI
    datasets), to attest and commit to it prior to accessing the data."'
  governance_committee_contact: mailto:jillianparker@health.ucsd.edu
  description: The Data Governance Committee contact named in the June 2025, October 2025 and June 2026
    release records is Jillian Parker (jillianparker@health.ucsd.edu). The Dataverse author metadata lists
    Parker J at the University of California, San Diego with ORCID 0000-0003-4535-3486.
  source_caveats: '`governance_committee_contact` is not inlined in this schema, so it carries a mailto
    URI as an identifier reference rather than a structured person record. The release records give only
    the name and email; the identification of that contact with the Dataverse author "Parker J" is supported
    by the shared surname, initial and UCSD affiliation but is not stated by the sources.'
license_and_use_terms:
  id: https://creativecommons.org/licenses/by-nc-sa/4.0/
  name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
  data_use_permission: no_commercial_use
  license_terms: 'All four captured releases record License/Data Use Agreement "CC BY-NC-SA 4.0". Under
    the licence deed a user is free to Share ("copy and redistribute the material in any medium or format")
    and Adapt ("remix, transform, and build upon the material"), under the terms: Attribution ("You must
    give appropriate credit, provide a link to the license, and indicate if changes were made. You may
    do so in any reasonable manner, but not in any way that suggests the licensor endorses you or your
    use."); NonCommercial ("You may not use the material for commercial purposes."); ShareAlike ("If you
    remix, transform, or build upon the material, you must distribute your contributions under the same
    license as the original."); and No additional restrictions ("You may not apply legal terms or technological
    measures that legally restrict others from doing anything the license permits."). The deed notes that
    no warranties are given and that other rights such as publicity, privacy or moral rights may limit
    use. CM4AI adds that "Attribution is required to the copyright holders and the authors" and that "Any
    publications referencing this data or derived products should cite the Related Publication below,
    as well as directly citing this data collection." Dataverse further states: "Our Community Norms as
    well as good scientific practices expect that proper credit is given via citation. Please use the
    data citation shown on the dataset page."'
  description: The CM4AI preprint states that "All CM4AI integration and packaging software is freely
    available and licensed under nonrestrictive open-source licenses. Data packages are licensed under
    Creative Commons CC-BY-NC-SA 4.0 license terms, which include a requirement for attribution to the
    dataset authors and the copyright holding institutions, and citation of this article." The bioRxiv
    preprint itself is made available under a CC-BY-NC-ND 4.0 International license, which differs from
    the licence on the data packages it describes.
ip_restrictions:
  id: https://cm4ai.org/data-releases/#ip-restrictions
  name: Copyright, commercial licensing and material transfer restrictions
  restrictions:
  - '"This data is Copyright (c) 2025 The Regents of the University of California except where otherwise
    noted." The CM4AI preprint gives the equivalent statement for 2024.'
  - '"Spatial proteomics raw image data is copyright (c) 2025 The Board of Trustees of the Leland Stanford
    Junior University."'
  - '"Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question)."'
  - '"A Data Access Committee will supervise ethical matters related to dataset distribution and potential
    dual licensing for commercial use."'
  - The KOLF2.1J iPSC line "is available for access by non-for-profit organizations via a simple MTA"
    from the HipSci resource.
  - Dataverse pages carry the footer "Copyright (c) 2025, by the Rector and Visitors of the University
    of Virginia".
