  description: 'The first CM4AI data release, cited in the CM4AI preprint''s Data and Software Availability
    Statement as: "Clark T, Mohan J, Schaffer L, Obernier K, et al. Cell Maps for Artificial Intelligence
    - Data Release, https://doi.org/10.18130/V3/DXWOS5, University of Virginia Dataverse, V1". The preprint
    describes this as the release whose RO-Crate packages are archived in LibraData, and Figure 4 of the
    preprint shows an evidence graph "generated on an RO-Crate package from CM4AI''s 0.5 alpha data release".'
  source_caveats: No Dataverse landing page for this DOI is present in the declared bundle, so no publication
    date, version history, file inventory or checksums are available for it. The CM4AI data releases page
    lists a "May 2024 Data Release" in its archive but gives no DOI, and the bundle does not state that
    DXWOS5 and the archived "May 2024 Data Release" are the same release; they are not merged here.
- id: https://doi.org/10.18130/V3/B35XWX
  name: Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta)
  title: Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta)
  doi: 10.18130/V3/B35XWX
  version: '1.4'
  status: Beta
  page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
  publisher: https://dataverse.lib.virginia.edu/
  license: https://creativecommons.org/licenses/by-nc-sa/4.0/
  description: '"This dataset is the March 2025 Data Release of Cell Maps for Artificial Intelligence
    (CM4AI; CM4AI.org), the Functional Genomics Grand Challenge in the NIH Bridge2AI program. This Beta
    release includes perturb-seq data in undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated
    KOLF2.1J iPSCs and iPSC-derived NPCs, neurons, and cardiomyocytes; and IF images in MDA-MB-468 breast
    cancer cells in the presence and absence of chemotherapy (vorinostat and paclitaxel). CM4AI output
    data are packaged with provenance graphs and rich metadata as AI-ready datasets in RO-Crate format
    using the FAIRSCAPE framework. Data presented here will be augmented regularly through the end of
    the project. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UA Birmingham, Simon Fraser
    University, and the Hastings Center." Dataverse Publication Date 2025-03-03; 302 downloads recorded
    at capture. The description ends with the parenthetical dates "(2025-03-04). (2025-03-07)". The immunofluorescence
    archives in this release are named with the cm4ai-v0.6-beta-if-images convention and cover 563 proteins
    of interest per condition; the later captured releases use the cm4ai_ifimages_ convention and cover
    464. Unlike the later releases, this record carries no External Data Links, Data Governance & Ethics,
    Completeness, Maintenance Plan, Intended Use, Limitations, Prohibited Uses or Potential Sources of
    Bias blocks.'
  source_caveats: The page displays "Version 1.4" while the data citation on the same page ends "V1".
    The Dataset Version summary table reports "No records found." File sizes are displayed in rounded
    units, so `bytes` is omitted for every file; the exact MD5 checksums are recorded.
