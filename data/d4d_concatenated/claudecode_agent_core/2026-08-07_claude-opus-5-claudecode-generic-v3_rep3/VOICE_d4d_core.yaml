  role: academic_institution
  maintainer_details: The project documentation states that the dataset is hosted by the Health Data
    Nexus, a data publishing platform maintained by T-CAIREM at the University of Toronto, and that
    the Health Data Nexus maintains the technical infrastructure hosting the dataset and provides continued
    access to interested researchers. The platform team may be contacted through the address given on
