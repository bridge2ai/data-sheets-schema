purposes:
- id: b2ai-voice:purpose/voice-biomarker-database
  name: Create an ethically sourced voice biomarker database
  response: The Bridge2AI-Voice dataset was created to address a gap in the availability of large-scale,
    diverse and well-documented voice data for use in clinical machine-learning applications. Previous
    studies on machine-learning-based voice diagnosis produced promising results, but their sample sizes
    were too small or they lacked the key metadata needed for training robust, clinically useful models.
    The dataset aims to bridge this gap by providing an ethically sourced, large and diverse dataset
    with which to develop, benchmark or validate clinically applicable AI/ML models, so that voice can
    be used as a non-invasive, cost-effective biomarker for the screening, diagnosis and monitoring
    of a wide range of health conditions.
- id: b2ai-voice:purpose/grand-challenge-aims
  name: Bridge2AI grand challenge aims
  response: 'Bridge2AI-Voice is a Precision Public Health grand challenge project funded by the NIH
    Common Fund Bridge2AI program. Beyond the dataset itself, the funded project has six specific aims:
    a data acquisition module building a multi-modal, multi-institutional, large-scale, diverse and
    ethically sourced human voice database linked to other biomarkers of health; a standards module
    introducing the field of acoustic biomarkers by developing new standards of acoustic and voice data
    collection and analysis; tool development, comprising software and cloud infrastructure for automated
    voice data collection through a smartphone application together with federated learning to allow
    multi-institutional analysis without sharing data; an ethics module developing normative guidance
    and new guidelines for consenting to voice data collection, sharing and use; a teaming module bridging
    medical voice research, acoustic engineering and AI/ML; and a skills and workforce development module
    building a curriculum and a community of voice AI researchers, especially from underserved communities.'
tasks:
- id: b2ai-voice:task/disease-classification
  name: Disease detection and classification from voice
  response: The current version of the dataset comes with predefined tasks and labeling. The tasks are
    primarily designed for training machine-learning models for disease detection and classification
    using voice data. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions and respiratory disorders.
- id: b2ai-voice:task/model-development-benchmarking
  name: Model pretraining, fine-tuning, benchmarking and validation
  response: The dataset is intended to enable the development, benchmarking or validation of clinically
    applicable machine-learning models for diagnosing a wide range of health conditions using voice
    data, and can be used for AI model pretraining, fine-tuning, benchmarking or validation.
addressing_gaps:
- id: b2ai-voice:gap/small-fragmented-voice-datasets
  name: Small, non-standardized and inaccessible voice datasets
  response: Existing work on voice as a biomarker has been limited to small- to medium-sized datasets,
    often using voice as the only data type and without the clinical metadata needed to train or audit
    models. Comparing studies and pooling data is difficult because standards for how voice and speech
    data are collected do not exist. Industry holds large volumes of voice data but lacks accurate clinical
    or demographic annotation, and industry datasets are private, preventing external auditing for fair
    representation of diverse populations. Bridge2AI-Voice addresses these gaps by ensuring the quality
    and accuracy of acoustic and associated clinical data through clinical validation and evidence-based
    recording protocols, by creating bioinformatics standards for voice data to make data interoperable,
    by creating benchmarks of diversity metrics and minimizing the risk of algorithmic bias, by defining
    ethical and legal norms that safeguard participants' data while supporting data sharing, by developing
    infrastructure for audiomics data storage and sharing, and by formulating training pathways for
    scientists, engineers, bioethicists and clinicians.
- id: b2ai-voice:gap/unmet-clinical-need-cohorts
  name: Disease categories with recognized unmet need
  response: 'Five disease cohort categories were identified from the literature as those for which voice
    changes have been associated with specific diseases and for which there are well-recognized unmet
    needs: voice disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders,
    respiratory disorders, and pediatric voice and speech disorders. Data acquisition efforts are centered
    on these categories. The public releases of this adult dataset do not contain an equal distribution
    of these categories, and the pediatric category is covered by a separate dataset.'
