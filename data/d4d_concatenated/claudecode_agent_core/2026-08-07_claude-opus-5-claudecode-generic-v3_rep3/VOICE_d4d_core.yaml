errata:
- id: b2ai-voice:erratum/none
  name: Erratum
  erratum_details: There is no erratum. A changelog for each dataset version is published online with
    the dataset metadata, and the PhysioNet record carries release notes for each version.
updates:
  id: b2ai-voice:updates/semi-annual
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details: Further versions of the dataset will be released on a semi-annual basis. These updates
    will be distributed as new versions of the dataset on the hosting platform, and users will be notified
    through news items on the platform as well as through standard communication channels. The dataset
    is released as static versions rather than being dynamically updated. Later releases are stated
    to contain additional data across the disease categories, and Spanish-language data collection is
    planned for future releases.
retention_limit:
  id: b2ai-voice:retention/indefinite
  name: Retention limits
  retention_period: Indefinite for contributed research data; a minimum of five years after study completion
    for consent documents and de-identified study data; a maximum of ten years after study completion
    for institution-held identifiable data.
  retention_details: Once data is contributed, it will be retained as long as it is useful for research
    purposes, possibly indefinitely. The USF IRB requires de-identified study data and original consent
    forms to be stored for a minimum of five years after the completion of the study, and original paper
    consent documents cannot be destroyed until five years after study completion even if they have
    been uploaded to the study platform. Identifiable data and datasheets linking participant numbers
    to participant information are kept at each institution on local cloud storage for a maximum of
    ten years after study completion and are then destroyed, which is the responsibility of each local
    principal investigator. Under the Data Transfer and Use Agreement, recipient institutions must dispose
    of transferred data two years after the start date, on completion of the project, on termination,
    or on expiration of the applicable ethics approval, whichever occurs first, and must certify destruction
    in writing within thirty days, while being permitted to retain one copy where records retention
    requirements or research integrity and verification require it.
version_access:
  id: b2ai-voice:version-access/physionet-versions
  name: Version availability
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - 1.0 (Health Data Nexus, https://doi.org/10.57764/qb6h-em84)
  - 1.1 (2025-01-17, https://doi.org/10.13026/249v-w155)
  - 2.0.0 (2025-04-16)
  - 2.0.1 (2025-08-18)
  - 3.0.0 (2025-12-16, https://doi.org/10.13026/k81f-qr68)
  - 3.1.0 (2026-05-01, https://doi.org/10.13026/8xbn-nq66)
  version_details: 'By default older versions of the dataset will continue to be supported, hosted and
    made available to researchers, and each version of the dataset has a unique DOI; the dataset publishers
    reserve the right to remove access to older versions. On PhysioNet the files for superseded versions
    are no longer available for download even though the version record remains: the v1.1 page states
    that the files for that version are no longer available and directs users to the latest version.
    Release notes record the changes at each version: v1.1 added Mel-frequency cepstral coefficients;
    v2.0 provided data for an additional 136 participants, reprocessed spectrograms to fix minor issues
    and removed all spectrograms and MFCCs derived from free-speech files; v2.0.1 corrected the authorship
    list; v3.0.0 was a major update with data for an additional 391 participants, separated the single
    phenotype file into individual files, added sparc and ppgs features and reorganized the files; and
    v3.1.0 added no new participants but released additional data for some participants, fixed broken
    parquet files from the previous release, added audio quality metrics and per-recording metadata,
    back-filled validated diagnosis information across conditions, rearranged some phenotype files and
    renamed certain gold-standard variables.'
extension_mechanism:
  id: b2ai-voice:extension/derivative-datasets-and-code
  name: Extension and contribution mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: For dataset extensions and augmentations, others may publish a derivative dataset
    on the hosting platform which references the original source; such derivative datasets may be made
    available under the same conditions as the source data. For augmentations to the code used to produce
    the data, the open-source repositories have discussion forums and issue pages that allow public
    discussion of data preprocessing, and the repository provides a pull request mechanism for contributing
    improvements to the data preprocessing code.
is_deidentified:
  id: b2ai-voice:deidentification/v3
  name: De-identification
  identifiable_elements_present: false
  method: Removal of direct identifiers, removal of indirect identifiers that created a significant
    risk of re-identification, removal of highly sensitive non-identifying elements, removal of all
    raw voice data, and removal of HIPAA Safe Harbor identifiers, with state and province removed and
    country of data collection retained.
  identifiers_removed: Names, civic addresses and social security numbers; select geographic and demographic
    identifiers and some information about household composition or cultural identity; household income,
    mental health status, traumatic life experiences and similar highly sensitive non-identifying elements;
    all raw voice data; all data elements encoded as sensitive in the REDCap data dictionary; and, for
    the feature-only dataset, all spectrograms, MFCCs, Mel spectrograms, transcriptions, EMA estimates
    and phonetic posteriorgrams derived from open-response prompts.
  deidentification_details: All direct identifiers were removed because they would reveal the identity
    of the research participant. Indirect identifiers were removed where they created a significant
    risk of participant re-identification, for example through combination with other public data available
    on social media, in government registries or elsewhere. Non-identifying elements of data that revealed
    highly sensitive information were also removed. All raw voice data was removed because it has the
    potential to cause individual re-identification or to be used for illicit or unauthorized purposes.
    For v3.0.0 and later, raw audio transcripts were reviewed and any audio recordings that contained
    potentially identifying information or external voices were removed from the release, and all sensitive
    fields were removed. The de-identification was performed by extracting features from the raw audio
    to limit re-identification, with only the extracted features released. Sensitive fields were identified
    by a team of ethicists. The dataset removes direct identifiers, applies the HIPAA de-identification
    rules, rebases or replaces dates by integers, removes or generalizes geographic information and
    removes narrative text fields, but does not achieve k-anonymization with k greater than or equal
    to 2.
