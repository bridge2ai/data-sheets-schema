source_caveats: 'Referent: this record describes the adult Bridge2AI-Voice flagship dataset as published
  on PhysioNet, at its current version 3.1.0 (published 2026-05-01). The Bridge2AI-Voice Pediatric Dataset
  is a separate PhysioNet project with its own DOI, cohort, protocol and ethics approval, and is represented
  here only through related_datasets rather than as part of this dataset. Sources in the bundle describe
  different release points and disagree accordingly: the project documentation site (docs.b2ai-voice.org)
  carries study metadata written for v2.0.0 (for example "The current v.2.0.0 dataset contains only
  adult populations") alongside statements about v3.0 and v3.1.0, and states that distribution is via
  Health Data Nexus, whereas the PhysioNet v3.0.0 and v3.1.0 records are the current distribution channel
  and the Health Data Nexus copy is described elsewhere in the same documentation as an earlier feature-only
  version. Where sources disagree, values here follow the most recent PhysioNet release record, and
  the older statement is retained where its historical scope is explicit. Grant identifiers are rendered
  inconsistently across sources: NIH RePORTER gives project number 3OT2OD032720-01S3 with core project
  number OT2OD032720; PhysioNet acknowledgements give 3OT2OD032720-01S1; the feasibility publication
  gives 1OT2OD032720-01; and the documentation site contains two evidently corrupted renderings ("3TF-OT2ActfOD032720Projectf01S1"
  and "Award #3Tf-OTOD03272001S2"). All are recorded separately rather than merged. Several contact
  e-mail addresses on the documentation capture were replaced by the literal placeholder "[email protected]"
  during preprocessing; the only mailbox legible in the bundle is the Data Access Compliance Office
  address given on the PhysioNet pages. The documentation site states that v3.0 contains approximately
  61,937 voice-derived recordings from 833 adult participants; the PhysioNet release records instead
  give per-feature row counts and no single recording total, so no aggregate recording count is asserted
  here. Participant counts differ by release (306 at v1.0, +136 at v2.0, +391 at v3.0.0, 833 at v3.0.0
  and v3.1.0) and the 833 figure applies to the current release.'
distributions:
- id: b2ai-voice:collection/features
  name: features
  description: Machine-learning-ready derivations of the raw audio waveforms. Dense time-varying features
    are distributed as Apache Parquet files; each Parquet element carries participant_id, session_id,
    task_name, n_frames and the feature tensor. Each file in this collection has a paired JSON data
    dictionary with the same file stem describing the feature and the processing used to prepare it.
  path: features
- id: b2ai-voice:collection/metadata
  name: metadata
  description: Apache Parquet file and its corresponding data dictionary describing individual recordings,
    including task instructions and prompts and information about the microphone used and its gain.
    Added in v3.1.0.
  path: metadata
- id: b2ai-voice:collection/phenotype-demographics
  name: phenotype/demographics
  description: Self-reported demographic data collected through the data collection application. Each
    TSV has a paired JSON data dictionary giving, per column, a one-sentence description, the question
    asked of the participant where applicable, and the response data type.
  path: phenotype/demographics
  format: TSV
  media_type: text/tab-separated-values
- id: b2ai-voice:collection/phenotype-confounders
  name: phenotype/confounders
  description: Responses to the confounders questionnaire, covering factors known to affect voice and
    speech such as smoking and drinking history. Each TSV has a paired JSON data dictionary.
  path: phenotype/confounders
  format: TSV
  media_type: text/tab-separated-values
- id: b2ai-voice:collection/phenotype-diagnosis
  name: phenotype/diagnosis
  description: Per-condition diagnosis tables recording the clinician-validated diagnostic information
    for each disease cohort and for controls. Each TSV has a paired JSON data dictionary. This is the
    v3.1.0 file inventory; v3.0.0 additionally carried adhd_adult, psychiatric_history and ptsd_adult
    under diagnosis, which in v3.1.0 appear under questionnaire.
  path: phenotype/diagnosis
  format: TSV
  media_type: text/tab-separated-values
- id: b2ai-voice:collection/phenotype-enrollment
  name: phenotype/enrollment
  description: Eligibility screening, enrollment form and participant tables. Each TSV has a paired
    JSON data dictionary.
  path: phenotype/enrollment
  format: TSV
  media_type: text/tab-separated-values
- id: b2ai-voice:collection/phenotype-questionnaire
  name: phenotype/questionnaire
  description: Responses to the validated questionnaires and patient-reported outcome instruments integrated
    into the data collection application. Each TSV has a paired JSON data dictionary.
  path: phenotype/questionnaire
  format: TSV
  media_type: text/tab-separated-values
- id: b2ai-voice:collection/phenotype-task
  name: phenotype/task
  description: Task-level tables describing the acoustic tasks, recordings and sessions, and responses
    to the task-embedded instruments. Each TSV has a paired JSON data dictionary.
  path: phenotype/task
  format: TSV
  media_type: text/tab-separated-values
