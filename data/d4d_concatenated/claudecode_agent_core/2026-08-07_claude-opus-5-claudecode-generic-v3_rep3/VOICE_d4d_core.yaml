id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: 'Bridge2AI-Voice is a flagship, ethically sourced and demographically diverse voice dataset
  linked to health information, generated by the Bridge2AI-Voice consortium under the NIH Common Fund
  Bridge2AI program. The dataset pairs acoustic recordings of voice, speech, breathing and cough tasks
  with detailed participant metadata: self-reported demographics, confounder questionnaires, validated
  patient-reported outcome instruments, and clinician-validated diagnoses spanning voice disorders,
  neurological and neurodegenerative disorders, mood and psychiatric disorders and respiratory disorders,
  together with control participants. Data are collected prospectively in clinic using a custom tablet
  application (the Bridge2AI-Voice App) following standardized Bridge2AI-Voice protocols. The public
  PhysioNet release is a derived, feature-only release: it distributes machine-learning-ready derivations
  of the waveforms (spectrograms, Mel spectrograms, MFCCs, pitch, articulatory and loudness/periodicity
  traces, phonetic posteriorgrams and static acoustic features) alongside the phenotypic tables, but
  not the original audio. Version 3.1.0, published 2026-05-01, contains data for 833 participants collected
  across five sites in North America. Raw audio is disseminated separately under a controlled-access
  mechanism.'
