instances:
- id: b2ai-voice:instance/participant
  name: Participant
  instance_type: person
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant. At
    each site a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up. For the psychiatric disorders cohort the assessment was determined using the participant's
    electronic health record or an active prescription, done outside of data collection by an appropriately
    licensed clinician.
  description: Each instance represents a person. Version 3.1.0 contains data for 833 participants across
    five sites in North America. Each participant contributes audio recordings and questionnaire responses;
    participants may have repeated visits, so there may be more than one session and more than one row
    per participant in the data files, and responses for the same data element may vary across visits.
    Each individual answered a common set of questions and then responded to additional questions relevant
    to their primary diagnostic category.
  source_caveats: The 833 figure is the participant count for v3.0.0 and v3.1.0. Earlier releases report
    306 participants at v1.0, an additional 136 at v2.0 and an additional 391 at v3.0.0.
anomalies:
- id: b2ai-voice:anomaly/site-and-protocol-variation
  name: Site configuration and protocol change
  anomaly_details: Different sites have different collection configurations, and the collection protocol
    changed over the course of the study.
- id: b2ai-voice:anomaly/noise-and-reporting
  name: Noise and reporting artifacts
  anomaly_details: Confounding factors present in the data include noise artifacts, variations in diagnostic
    practices, inaccurate questionnaire responses and underreporting.
- id: b2ai-voice:anomaly/recording-conditions
  name: Variable recording conditions
  anomaly_details: Data were recorded with a head-mounted headset with a microphone that could be at
    slightly different distances between recordings. Distinct iPad devices were used at each site. Clinical
    diagnosis, depending on the disorder, was performed by one clinician or based on an EHR record or
    a prescription.
- id: b2ai-voice:anomaly/missing-features
  name: Features absent for some recordings
  anomaly_details: Spectrograms, Mel spectrograms, MFC coefficients, phonetic posteriorgrams and EMA
    estimates for sensitive records and audio checks have been removed from v3.1. Additionally, some
    files, whether due to length or other issues, could not generate certain features and so are not
    included in the bundled data. This is why the per-feature row counts in the release differ from
    one another.
known_biases:
- id: b2ai-voice:bias/site-selection
  name: Recruitment from specialty clinics
  bias_type: selection_bias
  bias_description: Participants are recruited across academic institutions from high volume expert
    clinics on the basis of diagnosis and inclusion/exclusion criteria, and were screened for different
    disorders depending on the site. Groups that have less trust in the medical system or in AI, or
    that are less proximal to the collection sites, would have been less likely to be recruited.
  mitigation_strategy: The project states an intent to make the data more representative by shifting
    to remote collection and by designing the recruiting approach to control for more variables, and
    describes a Plan for Enhancing Diverse Perspectives for enrolling participants from socially and
    economically disadvantaged and underserved populations, including partnerships with community outreach
    clinics.
- id: b2ai-voice:bias/category-and-demographic-skew
  name: Skew across disorder category, site and demographics
  bias_type: representation_bias
  bias_description: The dataset has skews based on disorder category, site and other demographic factors,
    and the public data releases do not contain an equal distribution of the five disease categories.
  mitigation_strategy: Users should consider the multivariate distribution when assessing the dataset's
    utility for different questions. Further releases are stated to contain additional data.
- id: b2ai-voice:bias/device-label-confounding
  name: Device and label confounding
  bias_type: measurement_bias
  bias_description: Participants were screened for different disorders based on site, so they also had
    their data collected with different devices; distinct iPad devices were used at each site. Recording
    distance varied because the head-mounted microphone could sit at slightly different distances.
- id: b2ai-voice:bias/non-probability-sampling
  name: Non-probability sampling
  bias_type: sampling_bias
  bias_description: The sampling method is a non-probability sample drawn from a limited number of geographic
    locations, so the dataset is not representative of the larger population from which it is drawn.
known_limitations:
- id: b2ai-voice:limitation/geographic-coverage
  name: Limited geographic and site coverage
  limitation_type: coverage_limitation
  limitation_description: The data were collected at a limited number of geographic locations; five
    recording sites are included in the dataset, all in North America (USA and Canada).
  scope_impact: The dataset is a sample of a larger, ongoing collection and is not representative of
    the larger set.
  recommended_mitigation: The project intends to improve representativeness by shifting to remote collection
    and by controlling for more variables in recruitment.
- id: b2ai-voice:limitation/english-only
  name: English-language collection only
  limitation_type: coverage_limitation
  limitation_description: English was the only language used for communication with study participants,
    and inability to read or speak English was an exclusion criterion. Spanish versions of the protocol
    are under development and Spanish data collection is stated to be included in future releases.
- id: b2ai-voice:limitation/adult-only-scope
  name: Adult cohort only
  limitation_type: scope_limitation
  limitation_description: This dataset contains only adult participants; the minimum age of eligibility
    is 18 years and the maximum is 120 years. Pediatric voice and speech disorders are one of the five
    disease categories identified by the consortium, but pediatric data are released as a separate dataset
    rather than within this one.
- id: b2ai-voice:limitation/no-raw-audio-released
  name: Derived features rather than original audio
  limitation_type: resolution_limitation
  limitation_description: The published release contains derived features from the audio waveforms rather
    than the original recordings. All raw voice data was removed because it has the potential to cause
    individual re-identification or to be used for illicit or unauthorized purposes. Spectrograms and
    similar features were also excluded where the audio contained free speech, and transcripts of free
    speech audio were removed.
  recommended_mitigation: Raw audio is available separately under a controlled-access mechanism requiring
    institutional sign-off, distributed via Synapse.
- id: b2ai-voice:limitation/no-external-multimodal-data
  name: Multimodal data not released
  limitation_type: integration_limitation
  limitation_description: Other multimodal data described in the protocol, including imaging, genomic
    data for the neurological cohort, laryngoscopy imaging and other EHR data, is extracted from different
    sites independently and uploaded through the REDCap database, but the project documentation states
    that no external data is released in the v3.0.0 release.
- id: b2ai-voice:limitation/single-labeler
  name: Single labeler per instance
  limitation_type: methodological_limitation
  limitation_description: A single labeler provided the label for each instance, typically the clinician
    at the site of data collection or a clinician external to it for a prior diagnostic assessment.
    No inter-annotator agreement is therefore available, and human-level performance in the applications
    the dataset addresses is stated to vary widely.
- id: b2ai-voice:limitation/unaudited-derived-content
  name: Unaudited machine-generated content
  limitation_type: methodological_limitation
  limitation_description: Certain aspects of the data, for example transcription, were generated using
    off-the-shelf models that have not been audited for correctness. The dataset's own AI-readiness
    self-assessment scores the Data Quality criterion as not met.
- id: b2ai-voice:limitation/temporal-distribution-shift
  name: Distribution shift over time
  limitation_type: temporal_limitation
  limitation_description: Changes in diagnostic criteria or practices could be a source of distribution
    shift over the collection period.
confidential_elements:
- id: b2ai-voice:confidentiality/none
  name: Confidential data
  confidential_elements_present: false
  confidentiality_details: The project documentation answers "No" to whether the dataset contains data
    that might be considered confidential, such as data protected by legal privilege or doctor-patient
    confidentiality, or the content of individuals' non-public communications.
content_warnings:
- id: b2ai-voice:content-warning/free-speech-transcription
  name: Free speech transcription content
  content_warnings_present: true
  warnings:
  - The dataset includes the transcription of free speech tasks. While the inclusion of offensive, insulting
    or threatening material is unlikely, it cannot be completely avoided because research participants
    are responsible for their choice of language.
  source_caveats: This warning is recorded in the project documentation's healthsheet. The PhysioNet
    release records state that transcripts of free speech audio were removed from the distributed data
    and that spectrograms and similar features were excluded where the audio contained free speech,
    so the warning describes the collected material rather than the content of the current feature-only
    release.
subpopulations:
- id: b2ai-voice:subpopulation/demographics
  name: Demographic sub-populations
  subpopulation_elements_present: true
  identification: The dataset identifies demographic sub-populations by age, gender, sex, ethnicity
    and socioeconomic status. Detailed demographic data are collected through the smartphone application,
    including age, sex, gender, race and ethnicity, and language, together with other demographics that
    could affect voice and speech such as weight, socio-economic status and literacy status.
  distribution: No distribution of the sub-populations is reported in the sources for this release;
    the documentation states only that the public data releases do not contain an equal distribution
    of the five disease categories, and that the dataset has skews based on disorder category, site
    and other demographic factors.
sensitive_elements:
- id: b2ai-voice:sensitive/present
  name: Sensitive data elements
  sensitive_elements_present: true
  sensitivity_details: 'The dataset contains data that may be considered sensitive: racial or ethnic
    origins, because the dataset includes race information; sexual orientation, because the dataset
    includes sexual orientation information; and financial and health data, because the dataset includes
    socioeconomic and health information. Non-identifying elements that revealed highly sensitive information,
    such as household income, mental health status and traumatic life experiences, were removed during
    de-identification, as were all data elements encoded as sensitive in the REDCap data dictionary.'
acquisition_methods:
- id: b2ai-voice:acquisition/observed-and-self-reported
  name: Directly observed and participant-reported acquisition
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details: The data were directly observable and reported by subjects. Participants who
    consent perform speaking tasks and complete self-reported demographic and medical history questionnaires
    as well as disease-specific validated questionnaires. Clinical diagnoses were verified by clinicians
    reviewing audio and/or imaging data, looking at electronic health records, or medication prescriptions.
    Participants who consent also permit investigators to access medical information through EHR platforms
    in order to perform gold standard validation of diagnoses and symptoms.
collection_mechanisms:
- id: b2ai-voice:mechanism/app-and-devices
  name: Tablet application and recording hardware
  mechanism_details: The data were collected using an iPad app. Voice samples are collected prospectively
    in the clinic, with the assistance of a trained research assistant, using a custom software application
    (the Bridge2AI-Voice App) following the Bridge2AI-Voice protocols. Data are collected on iPads (9th
    or 10th generation) and iPad Air (5th generation) using an Avid AE-36 microphone connected to the
    iPad via an Apple dongle; a headset was used for data collection when possible. For most participants
    a single session was sufficient to collect all relevant data, but a subset required multiple sessions.
    Twenty-two acoustic tasks are recorded through the app, spanning non-voice/non-speech tasks (respiration,
    voluntary cough, breath sounds), voice/non-speech tasks (prolonged vowel, maximum phonation time,
    glides, loudness, diadochokinesis) and speech tasks (Rainbow Passage, Caterpillar Passage, CAPE-V
    sentences, free speech, picture description, story recall, animal fluency, open response questions,
    word-colour Stroop, productive vocabulary, random item generation, Cinderella story). Demographic
    surveys, confounder questionnaires and validated questionnaires are administered through the same
    application, and the remaining multimodal data is extracted from each site independently and uploaded
    through the REDCap database.
  used_software:
  - id: b2ai-voice:software/bridge2ai-voice-app
    name: Bridge2AI-Voice App
    description: Custom application hosting the Bridge2AI-Voice data acquisition protocols. The IRB
      protocol describes two client platforms, the Bridge2AI Voice iOS app, restricted to iOS-compatible
      devices, and the Bridge2AI Voice Web app, which runs in a browser on a computer, tablet or phone
      with no software downloaded or installed. Both are HIPAA-compliant, store data only during the
      collection phase, require no login, and send data over a secure HTTPS protocol to a HIPAA-compliant
      storage server operated by an NIH STRIDES partner.
  - id: b2ai-voice:software/redcap
    name: REDCap
    description: Database into which case report form data is entered and from which the questionnaire
      data was exported before conversion. The supporting data dictionary, metadata and instrument PDFs
      are published in the eipm/bridge2ai-redcap repository.
sampling_strategies:
- id: b2ai-voice:sampling/non-probability-clinic-sample
  name: Non-probability clinic-based sample
  is_sample: true
  is_random: false
  is_representative: false
  source_data: A larger, ongoing collection of voice and health data from participants recruited across
    the participating institutions in five disease cohort categories and controls; the funded project's
    anticipated enrollment is 10,000 participants by 2027.
  why_not_representative: The data is not representative because it was collected at a limited number
    of geographic locations.
  strategies: Non-probability sample. Participants are recruited across different academic institutions
    from high volume expert clinics on the basis of diagnosis and defined inclusion and exclusion criteria.
    High volume expert clinics are outpatient clinics within hospital systems or academic institutions
    that have developed expertise in a specific disease area and see more than 50 patients per month
    from the same disease category. Patients presenting at a given clinic were screened for inclusion
    and exclusion criteria prior to their visit by the project investigators, and consent was sought
    for the data collection initiative and for sharing the acquired research data. The study design
    is observational, with a cohort observation model and a cross-sectional time perspective. Participants
    without the conditions of interest are enrolled as controls.
  source_caveats: 'The IRB protocol defines high volume expert clinics differently, as clinics or programs
    within academic institutions with multidisciplinary programs targeted to the listed disease cohorts
    and a volume of over 1000 patients per year; the study metadata on the documentation site gives
    the more-than-50-patients-per-month definition. Both are reported. Target enrollment also differs
    between sources: the study metadata gives an anticipated enrollment of 10,000 by 2027 and the documentation
    states a flagship dataset of 10,000 voices, while the IRB protocol and the audiomics white paper
    give 30,000 participants and a publicly available database of 30,000 human voices.'
data_collectors:
- id: b2ai-voice:collector/research-teams
  name: Research teams and clinicians
  role: Data collection and clinical validation
  collector_details: Research teams, which may include medical, graduate or undergraduate students,
    coordinated with clinicians and doctors to identify appropriate participants. These clinicians and
    doctors were listed under the IRB as co-investigators and were added to the consortium so that their
    names are included on consortium-level publications that emerge from the research. Hospital staff
    were not involved in scheduling but assisted in the logistics of coordinating data collection. Data
    collection in clinic is performed by the research team, including the investigator and research
    coordinators or research assistants.
collection_timeframes:
- id: b2ai-voice:timeframe/collection-period
  name: Collection period
  timeframe_details: 'The project documentation states that the data was collected over a period of
    12 months. The IRB protocol describes a prospective cohort study over four years with a phased approach
    to data acquisition: phase 1 (exploratory) covering IT and cloud infrastructure, software and app
    development and data collection for up to 180 participants at main sites, completed November 2023;
    phase 2 (pilot) reaching up to 600 participants cumulatively, begun November 2023 and ongoing in
    November 2024; phase 3 (expansion) to community outreach clinics and other high volume expert clinics,
    reaching up to 3000 participants; and phase 4 (outreach) reaching 5000 participants. NIH RePORTER
    records the project period as 2022-09-01 to 2026-11-30.'
  source_caveats: 'No start or end date is asserted for the collection window because the sources give
    different and non-reconcilable scopes: a 12-month collection period in the healthsheet answer, a
    four-year prospective study period in the IRB protocol, and a 2022-09-01 to 2026-11-30 project period
    in NIH RePORTER, which is the award period rather than the collection window.'
missing_data_documentation:
- id: b2ai-voice:missing-data/optional-and-irregular
  name: Missing data patterns and causes
  missing_data_patterns: Information is missing from individual instances. Phenotype data files only
    contain rows for a participant if at least one column is not missing. Each individual answered a
    common set of questions and then responded to additional questions relevant to their primary diagnostic
    category, so many fields are absent for participants outside the relevant cohort. Per-feature row
    counts differ across the feature files because some recordings could not generate certain features.
  missing_data_causes: Some questions are optional, and there may be data collection irregularities
    that caused some information to be missing from individual instances. Some audio files, whether
    due to length or other issues, could not generate certain features. Features for sensitive records
    and audio checks were deliberately removed.
  handling_strategy: The dataset has been audited internally for missingness and consistency by the
    data release team, and a missingness table is included with the dataset. No imputation is described.
raw_data_sources:
- id: b2ai-voice:raw-source/audio-and-redcap
  name: Raw audio recordings and REDCap questionnaire exports
  source_description: The raw sources are the original audio waveforms recorded through the Bridge2AI-Voice
    application during clinic sessions, together with the questionnaire and clinical data entered into
    and exported from REDCap. These raw audio recordings are not included in the PhysioNet release,
    which contains only derived features.
  source_type: Prospectively collected clinical research recordings and survey responses
  access_details: Raw audio is saved but is not accessible publicly. Accessing raw audio requires institutional
    sign-off; requests go to the access committee at DACO@b2ai-voice.org and the data is made available
    via Synapse at https://www.synapse.org/Synapse:syn72370534/.
  raw_data_format: WAV audio, converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing
    filter for feature derivation; questionnaire data exported from REDCap.
ethical_reviews:
- id: b2ai-voice:ethical-review/usf-irb
  name: University of South Florida Institutional Review Board
  reviewing_organization: University of South Florida Institutional Review Board
  review_details: 'Data collection and sharing was approved by the University of South Florida Institutional
    Review Board. The protocol, "Bridge2AI Voice Data Acquisition", was submitted and approved by the
    USF single IRB, and subsite IRBs were approved through the single IRB process; all US-based participating
    institutions abide by the single IRB process. Two exceptions apply: genomic data is collected and
    analysed only at the University of Toronto and Mount Sinai Hospital in Canada, which submit a separate
    protocol for that work, and Canadian institutions (Mount Sinai Hospital, SickKids and the University
    of Toronto) do not follow the single IRB process and apply for a separate research ethics board
    approval to comply with Canadian regulations, with a copy of the approval submitted to the USF IRB.
    The study is not for a drug product or a medical device, and no data monitoring committee was appointed.
    The protocol has been revised thirteen times between version 1 of 2023-01-17 and version 13 of 2025-07-11,
    with changes including the addition of the pediatric cohort under single IRB, compensation for adult
    participants, electronic and remote consent, control-cohort data collection, remote enrollment and
    data collection apps, Spanish-language data collection, and additional USF and Vanderbilt recruitment
    sites.'
  source_caveats: The bundle also contains an IRB number, 004890, but that number belongs to a separate
    University of South Florida study, the Bridge2AI-Voice application feasibility study conducted at
    the USF Health Voice Center between 2023-06-05 and 2023-07-28, and is not the approval number for
    the data acquisition protocol described here. No IRB approval number is given in the bundle for
    the data acquisition protocol itself.
data_protection_impacts:
- id: b2ai-voice:dpia/not-conducted
  name: Data protection impact analysis
  impact_details: The project documentation answers "No" to whether an analysis of the potential impact
    of the dataset and its use on data subjects has been conducted.
human_subject_research:
  id: b2ai-voice:human-subjects/overview
  name: Human subjects research
  involves_human_subjects: true
  ethics_review_board: University of South Florida Institutional Review Board (single IRB)
  irb_approval:
  - Submitted and approved by the USF single IRB and subsite IRBs through the single IRB process
  - Canadian participating institutions (Mount Sinai Hospital, the Hospital for Sick Children and the
    University of Toronto) obtain separate research ethics board approval and submit a copy to the USF
    IRB
  - Genomic data collection and analysis at the University of Toronto and Mount Sinai Hospital is covered
    by a separate protocol and research ethics board approval
  special_populations:
  - Adults aged 18 years and over, with a maximum age of 120 years; healthy volunteers are eligible
  - Participants with mood and psychiatric diagnoses, for whom answering some questionnaire items can
    cause discomfort and trigger negative emotions
  - Participants from socially and economically disadvantaged and underserved populations, whose enrollment
    is planned through the Plan for Enhancing Diverse Perspectives and through community outreach clinics
  regulatory_compliance:
  - HIPAA, including a partial waiver of HIPAA authorization requested for recruitment and screening
    purposes only
  - The Common Rule
  - Certificate of Confidentiality, which must be asserted against compulsory legal demands such as
    court orders and subpoenas for identifying information or characteristics of a research participant
  - Good Clinical Practice guidelines
  description: The project is a data generation study whose primary objective is to build a multi-institutional
    database of human voices; there is no study intervention and no plan for data analysis within the
    project. Voice collection is described as a safe, non-invasive collection method with minimal risk
    to the participant, and the principal risk identified is the mistaken release of personal information.
informed_consent:
- id: b2ai-voice:informed-consent/data-acquisition-protocol
  name: Informed consent for the data acquisition protocol
  consent_obtained: true
  consent_type: Prospective informed consent, obtained on paper, electronically within the application
    or through REDCap survey forms, or by video recording within the application.
  consent_documentation: Electronic consent is housed in REDCap and is HIPAA compliant. Paper consent
    documents are uploaded and saved electronically in REDCap. All paper and electronic versions of
    consent are stored for a minimum of five years after the completion of the study, following required
    USF procedure. In some instances of remote consent the signature of the researcher is not required,
    in which case the consent form omits the final section (Statement of Person Obtaining Informed Consent)
    but is otherwise identical.
  withdrawal_mechanism: Participants may withdraw from the study at any point. Data provided before
    or during voice data collection is not included in the database if the participant withdraws at
    that stage; once voice data collection is complete, research data including voice recordings cannot
    be removed from the database.
  consent_scope: Research data that does not contain direct identifiers will be shared with external
    researchers for future research through a secure database. Data that poses a low risk of causing
    individual re-identification will be shared in registered access with the general public, and data
    that would pose a heightened risk of re-identification if shared in full open access will be shared
    through a controlled access mechanism with authorized researchers. Consent is not limited to non-commercial
    use, to a specific geographic location, to a specific type of research, to genetic research, or
    to research that does not involve the development of methods or algorithms. Within the consent process
    individuals are asked whether they agree to be contacted in the future for further voice data collection;
    contact information provided for that purpose is stored within the institutional database only and
    is not shared with other centres or uploaded to the cloud.
at_risk_populations:
  id: b2ai-voice:at-risk/overview
  name: At-risk populations
  at_risk_groups_included: true
  special_protections:
  - Pediatric participants are enrolled only through the pediatric sites and not at the University of
    South Florida; a checklist for children under 21 (HRP-416) was completed and appended to the IRB
    protocol
  - Students, employees and wards of the state are neither specifically included nor specifically excluded
  - A Plan for Enhancing Diverse Perspectives governs enrollment of participants from socially and economically
    disadvantaged and underserved populations so that the database is diverse and FAIR
  - Participants in the mood and psychiatric cohorts may experience discomfort or negative emotions
    when answering some questionnaire items, which is disclosed as a study risk
  - Collection accessibility was facilitated through the normal means of the collection sites, including
    reading questions to participants when needed, and the protocol asks about disabilities
  assent_procedures: Where children participate under the pediatric arm of the protocol, children provide
    verbal assent where appropriate and assent is documented; children who cannot reasonably be asked
    to assent because of age or developmental limitations, typically those under seven years of age,
    are not asked to do so. No pediatric data collection is performed at USF, and this dataset contains
    no pediatric participants.
  guardian_consent:
  - For pediatric participants under the protocol, parents or guardians provide consent; the research
    is minimal risk and does not require permission from both parents or legal guardians
preprocessing_strategies:
- id: b2ai-voice:preprocessing/audio-standardization-and-features
  name: Audio standardization and feature derivation
  preprocessing_details: Raw audio was preprocessed by converting to monaural and resampling to 16 kHz
    with a Butterworth anti-aliasing filter applied. From this standardized audio the release derives
    spectrograms computed with the short-time Fast Fourier Transform using a 25 ms window, a 10 ms hop
    length and a 400-point FFT, downsampled by a factor of two in the time domain; 60 Mel-frequency
    cepstral coefficients derived from those spectrograms; Mel spectrograms computed with the same parameters
    and 60 Mel bins; articulatory features from the Speech Articulatory Coding package giving kinematic
    traces of vocal tract articulators and source features plus loudness, periodicity and pitch measures
    at 50 Hz; acoustic features from OpenSMILE capturing temporal dynamics and acoustic characteristics;
    phonetic and prosodic features from Parselmouth and Praat giving fundamental frequency, formants
    and voice quality; phonetic posteriorgrams at 100 Hz from the ppgs package; and transcriptions generated
    with OpenAI's Whisper Large model. The waveform-derived features are stored in two forms, a fixed
    feature format holding static features extracted from the entire waveform, and a temporal format
    that varies per audio file with the length of the recording. Questionnaire features are collected
    and distributed in the phenotype folder format and can be used for cohort selection. The raw audio
    files and the questionnaire data exported from REDCap were converted to be compliant with the Brain
    Imaging Data Structure v1.9.0. Feature extraction for the pre-de-identification pipeline also produced
    spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs and PPGs from open-response prompts,
    all of which are removed from the feature-only dataset.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
    description: Code used to preprocess the raw audio waveforms into the Parquet files and to merge
      the source data into the phenotype files. The v3.1.0 release was generated with b2aiprep v3.0.0.
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Toolkit used for processing audio files for research tasks.
  - id: b2ai-voice:software/opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, used to extract acoustic
      features capturing temporal dynamics and acoustic characteristics.
  - id: b2ai-voice:software/praat
    name: Praat
    description: Used with Parselmouth to compute phonetic and prosodic features.
  - id: b2ai-voice:software/parselmouth
    name: Parselmouth
    description: Python interface to Praat, used to compute fundamental frequency, formants and voice
      quality measures.
  - id: b2ai-voice:software/torchaudio
    name: torchaudio
    description: Used to compute pitch contours, spectrograms, Mel spectrograms and MFCCs.
  - id: b2ai-voice:software/sparc
    name: Speech Articulatory Coding (sparc)
    description: Used to generate electromagnetic articulography estimates and loudness, periodicity
      and pitch measures at 50 Hz.
  - id: b2ai-voice:software/ppgs
    name: ppgs
    description: Used to generate phonetic posteriorgrams, a time-varying categorical distribution over
      acoustic units of speech at 100 Hz.
  - id: b2ai-voice:software/whisper-large
    name: OpenAI Whisper Large
    description: Used to generate transcriptions of the audio recordings.
cleaning_strategies:
- id: b2ai-voice:cleaning/no-cleaning-preprocessing
  name: Cleaning of the data
  cleaning_details: 'The project documentation answers "No" to whether there was any preprocessing for
    cleaning the data, and "No" to whether instances were excluded from the dataset at the time of preprocessing.
    Records were nonetheless removed from the release for de-identification reasons rather than data
    quality reasons: raw audio transcripts were reviewed and any recordings containing potentially identifying
    information or external voices were removed, and features for sensitive records and audio checks
    were removed. The IRB protocol also provides that a caregiver''s voice recorded inadvertently can
    be discarded either by re-recording manually during data collection or during data audit and postprocessing.'
labeling_strategies:
- id: b2ai-voice:labeling/clinician-gold-standard
  name: Clinician gold-standard diagnostic labeling
  data_annotation_protocol: 'Gold standard labels are available in the data, diagnosed by a clinician,
    following the Bridge2AI protocols and ICD-10 codes. Clinical validation is performed by a qualified
    physician or practitioner based on established gold standards for diagnosis, which vary by cohort:
    laryngoscopy images and stroboscopy videos for voice disorders, with CT scan and spirometry additionally
    for unilateral vocal fold paralysis; spirometry and flow volume loops with CT of the neck and chest
    for airway stenosis, and spirometry and flow volume loops for chronic cough; brain CT, brain MRI
    and whole genome sequencing for the neurological and neurodegenerative cohort, with serum p-tau
    protein biomarkers additionally for Alzheimer''s disease; and electronic health summary, clinical
    diagnosis from a psychiatrist and medication history for mood and psychiatric disorders.'
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to the site for
    a prior diagnostic assessment
  labeling_details: Diagnostic labels are the result of a clinical assessment of the participant. At
    each site a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up. For the psychiatric disorders cohort the assessment was determined using the participant's
    EHR record or an active prescription, performed outside of data collection by an appropriately licensed
    clinician. A single labeler labels each instance, and one labeler provides a label per instance.
    Human-level performance in the applications the dataset is meant to address varies widely. Future
    researchers creating new labels or defining new tasks should describe the process alongside any
    release of a model or publication, including the exact variables used for the determination.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: b2aiprep
    url: https://github.com/sensein/b2aiprep
    description: Named in the project documentation, together with SenseLab, as the software used to
      preprocess, clean and label the instances.
  - id: https://github.com/sensein/senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
raw_sources:
- id: b2ai-voice:raw-data/controlled-access-audio
  name: Raw audio under controlled access
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details: The raw data post de-identification was saved in addition to the preprocessed data,
    and is not accessible publicly. The published PhysioNet dataset contains derived features from the
    audio waveforms and no raw audio. Accessing raw audio is a more involved process requiring institutional
    sign-off; requests are directed to the access committee at DACO@b2ai-voice.org and the data is made
    available via Synapse. Users interested in accessing audio data from any Bridge2AI-Voice dataset
    can request access by e-mail, and raw audio is disseminated through controlled access only, to protect
    participants' privacy.
machine_annotation_tools:
- id: b2ai-voice:machine-annotation/whisper-transcription
  name: Automated transcription
  tools:
  - OpenAI Whisper Large
  tool_descriptions: Transcriptions of the audio recordings were generated using OpenAI's Whisper Large
    model. Transcripts of free speech audio were subsequently removed from the release.
  tool_accuracy:
  - Not audited. The project documentation states that certain aspects of the data, for example transcription,
    were generated using off-the-shelf models that have not been audited for correctness.
existing_uses:
- id: b2ai-voice:existing-use/summer-school-hackathon
  name: Bridge2AI Summer School and hackathon
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
use_repository:
- id: b2ai-voice:use-repository/none
  name: Repository of downstream uses
  repository_details: The project documentation answers "No" to whether there is a repository, other
    than Google Scholar, that links to any or all papers or systems that use the dataset.
other_tasks:
- id: b2ai-voice:other-task/research-applications
  name: Research applications
  task_details: The dataset is primarily intended for research applications, specifically the development
    of AI and machine-learning models for healthcare. It aims to support clinical research in disease
    screening, diagnosis and monitoring through voice biomarkers, and can be used for AI model pretraining,
    fine-tuning, benchmarking or validation. The consortium also positions the dataset as the foundation
    for establishing voice bioinformatic standards and for training pathways in audiomics.
future_use_impacts:
- id: b2ai-voice:future-use-impact/skews
  name: Composition skews affecting future use
  impact_details: The dataset has skews based on disorder category, site and other demographic factors.
    Users should consider the multivariate distribution when assessing the dataset's utility for different
    questions. The dataset is a sample of a larger, ongoing collection and is not representative of
    the larger set, because it was collected at a limited number of geographic locations.
discouraged_uses:
- id: b2ai-voice:discouraged-use/non-research-applications
  name: Non-research applications
  discouragement_details: The dataset should not be used for non-research or non-clinical applications
    such as hiring decisions, insurance premium adjustments, or any form of surveillance that could
    lead to discrimination or harm. These limitations are intended to prevent unethical or biased outcomes
    that could negatively impact individuals based on their health conditions or voice characteristics.
    The dataset is intended strictly for research that prioritizes patient safety, privacy and ethical
    use.
intended_uses:
- id: b2ai-voice:intended-use/clinical-ml-development
  name: Clinical machine-learning model development
  use_category: Research
  examples:
  - Development, benchmarking or validation of clinically applicable machine-learning models for diagnosing
    health conditions using voice data, including vocal pathologies and neurological, psychiatric and
    respiratory conditions
  - AI model pretraining and fine-tuning
  - Clinical research into disease screening, diagnosis and monitoring through voice biomarkers
  - Cohort selection using the questionnaire features distributed in the phenotype folder
  usage_notes: The dataset is structured to be Findable, Accessible, Interoperable and Reusable. The
    Parquet feature files can be loaded with any library that supports Parquet, for example the HuggingFace
    Datasets library, and spectrograms can be plotted in decibels by converting from the original power
    representation; the phenotype TSV files can be read with any statistical analysis tool. Training
    opportunities for using the dataset are offered through the B2AI Voice Scholars programme at https://www.b2aivoicescholars.org/.
prohibited_uses:
- id: b2ai-voice:prohibited-use/reidentification-and-harm
  name: Re-identification, harm and access restriction
  prohibition_reason: Restrictions on use are set out in the Registered Data Access Agreement and reflect
    the B2AI-Voice consortium's commitment to advancing ethical and trustworthy research practices that
    respect and protect the rights and interests of research participants. The dataset is intended solely
    for commercial and non-commercial research purposes by Authorized Researchers. Specifically, it
    must not be used to attempt to re-identify research participants or in any action that could reasonably
    lead to re-identification; and it must not be used for any purpose that could foreseeably cause
    harm or stigmatization to research participants, their families, communities or specific populations.
    Intellectual property protections, database rights or related rights may not be used in a manner
    that restricts or limits access to any part of the dataset or to any conclusions derived from it,
    so that future use of the dataset remains unrestricted in alignment with Open Science principles.
    Sale of all or part of the data on any media is not permitted. Under the Data Transfer and Use Agreement,
    recipients must not disclose, release, sell, rent, lease, loan or otherwise grant access to the
    data to any third party except authorized persons without the prior written consent of the provider,
    and must not use the data, alone or with other information, to attempt to contact the individuals
    who are its subjects without IRB approval, specific written approval from the provider, and informed
    consent from the individual where required.
distribution_formats:
- id: b2ai-voice:distribution/physionet
  name: PhysioNet
  format: Apache Parquet, TSV, JSON
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  - https://physionet.org/content/b2ai-voice/
  description: The adult feature-only dataset is distributed on PhysioNet under a permissioned access
    mechanism. The v3.1.0 access policy states that only credentialed users who sign the data use agreement
    can access the files, and no training is required; the earlier v1.1 access policy states that only
    registered users who sign the specified data use agreement can access the files. PhysioNet is maintained
    by the MIT Laboratory for Computational Physiology.
- id: b2ai-voice:distribution/synapse-raw-audio
  name: Synapse
  format: WAV audio
  access_urls:
  - https://www.synapse.org/Synapse:syn72370534/
  description: Raw audio for the Bridge2AI-Voice adult cohort is disseminated through controlled access
    via Synapse, separately from the PhysioNet feature release. Access requires institutional sign-off
    and a request to the access committee at DACO@b2ai-voice.org. The project documentation gives the
    folder structure of the b2ai-voice-audio dataset as a per-participant hierarchy under sub-<participant_id>/ses-<participant_id>/audio
    holding WAV files with paired JSON sidecars, alongside CHANGES.md, README.md, dataset_description.json
    and the phenotype and task tables.
- id: b2ai-voice:distribution/health-data-nexus
  name: Health Data Nexus
  access_urls:
  - https://healthdatanexus.ai/
  description: An earlier version of the feature-only dataset is available on Health Data Nexus, which
    provides cloud compute alongside the dataset rather than allowing data downloads. The project documentation's
    distribution answer states that the dataset will be distributed through a data publishing platform
    at healthdatanexus.ai, which provides publicly accessible metadata with a DOI for persistent resolution
    while the dataset itself requires registered access.
  source_caveats: The Health Data Nexus statement is written for the v1.0/v2.0.0 era of the project
    and is superseded for the current release by the PhysioNet distribution; it is retained here because
    the same documentation still presents it as a route to the earlier version.
distribution_dates:
- id: b2ai-voice:distribution-dates/release-history
  name: Release history
  release_dates:
  - v1.0, Health Data Nexus, published and made available at the end of November 2024
  - v1.1, PhysioNet, 2025-01-17
  - v2.0.0, PhysioNet, 2025-04-16
  - v2.0.1, PhysioNet, 2025-08-18
  - v3.0.0, PhysioNet, 2025-12-16
  - v3.1.0, PhysioNet, 2026-05-01
license_and_use_terms:
  id: b2ai-voice:license/registered-access
  name: Bridge2AI Voice Registered Access License
  license_terms: 'Files are released under the Bridge2AI Voice Registered Access License, governed by
    the Bridge2AI Voice Registered Access Agreement. The feature-only and raw audio datasets are available
    under distinct agreements appropriate for the sensitivity of their respective content. For registered
    access to the features-only data, a user registers on PhysioNet, confirms their identity under the
    Registered Access License, and signs the Bridge2AI-Voice Registered Access Agreement setting out
    the terms and conditions for data use. For controlled access to the raw audio data, a user completes
    a Data Access Request Form and a Data Use Agreement, submits the application to the Data Access
    Compliance Office for review, and, on approval, ensures that a Data Use and Transfer Agreement is
    signed by an authorized official at their institution. The v3.1.0 PhysioNet record states that only
    credentialed users who sign the data use agreement can access the files and that no training is
    required. The intellectual property terms of the registered access agreement state that the data
    may be protected by copyright and other rights; duplication as reasonably required to carry out
    the research project is permitted; sale of all or part of the data on any media is not permitted;
    nothing in the agreement transfers intellectual property rights in the data; users agree not to
    make intellectual property claims on the data and not to use intellectual property protection in
    ways that would prevent or block access to, or use of, any element of the data or conclusions drawn
    directly from it; users may obtain intellectual property rights on downstream discoveries but agree
    to implement licensing policies that will not obstruct further research; and users agree to respect
    the Fort Lauderdale Agreement. There are no fees associated with these restrictions. A memorandum
    setting out the ethical justification for controlled access to raw voice data samples is published
    alongside the documentation. The supporting code and metadata carry their own licenses: the Bridge2AI
    REDCap data dictionary and metadata under MIT, the b2aiprep preprocessing library under Apache-2.0,
    and the documentation and dashboard source under MIT.'
  data_use_permission: general_research_use
ip_restrictions:
  id: b2ai-voice:ip-restrictions/none-third-party
  name: Third-party intellectual property restrictions
  restrictions:
  - No intellectual property based restrictions have been imposed by third parties.
  - The Data Transfer and Use Agreement states that the provider gives no guarantees that the data is
    free of third-party intellectual property rights, database rights or other related rights, and that
    nothing in the agreement transfers to the recipient any intellectual property rights in or relating
    to the data.
regulatory_restrictions:
  id: b2ai-voice:regulatory/overview
  name: Regulatory restrictions and compliance
  regulatory_restrictions:
  - No export controls apply to the dataset.
  hipaa_compliant: compliant
  other_compliance: 'The dataset applies the HIPAA de-identification rules and removes direct identifiers,
    rebases or replaces dates by integers, removes or generalizes geographic information, and removes
    narrative text fields; it does not achieve k-anonymization with k greater than or equal to 2. The
    level of de-identification is stated as: identifiable information under HIPAA and the Common Rule,
    as well as data considered sensitive, have been removed from this dataset. The data is covered under
    a Certificate of Confidentiality, which must be asserted against compulsory legal demands such as
    court orders and subpoenas for identifying information or characteristics of a research participant.
    Under the Data Transfer and Use Agreement the data is characterized as Personally Identifiable Information
    as defined in OMB Memorandum M-07-16 and not covered under HIPAA, FERPA or similar laws, and recipients
    must adhere to the specific requirements of PhysioNet.org, managed by the MIT Laboratory for Computational
    Physiology. Collection applications and storage servers are HIPAA-compliant and data is transmitted
    over HTTPS to NIH STRIDES partner infrastructure.'
  confidentiality_level: restricted
  source_caveats: The Data Transfer and Use Agreement's statement that the data is Personally Identifiable
    Information not covered under HIPAA sits alongside the project documentation's statement that the
    HIPAA de-identification rules were applied to the released dataset. The two describe different objects,
    the transferred data under an institution-to-institution agreement and the published de-identified
    release, and are recorded here without being reconciled.
maintainers:
- id: b2ai-voice:maintainer/nih-bridge2ai
  name: National Institutes of Health, Bridge2AI program
  role: government_agency
  maintainer_details: The dataset is supported by the NIH via the Bridge2AI project.
- id: b2ai-voice:maintainer/mit-lcp-physionet
