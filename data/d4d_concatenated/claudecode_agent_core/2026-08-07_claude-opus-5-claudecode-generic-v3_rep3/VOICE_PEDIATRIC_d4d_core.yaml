description: Bridge2AI-Voice Pediatric Dataset v1.1.0 is a credentialed-access PhysioNet database
  containing derived audio features for 23,533 recordings collected from 300 participants
  aged 2 to 18 years, together with detailed demographic, clinical and validated questionnaire
  data. The release contains data considered low risk, including derivations such as spectrograms,
  but not the original voice recordings; raw pediatric audio is distributed separately through
  Synapse under controlled access. Participants were patients and healthy volunteers at the
  Hospital for Sick Children, enrolled if they were 2 to 18 years of age and English-proficient,
  and excluded if they were over 18 or non-verbal; non-patients were recruited through research
  postings. Data were collected in a single session per participant using the customized reproschema-ui
  software on tablets, following a standardized age-appropriate protocol covering demographic
  information, voice- and speech-related questionnaires and medical-history questionnaires.
  The dataset is organised into derived audio features (features), phenotypic information
  acquired during collection (phenotype) and per-recording metadata (metadata). The Bridge2AI-Voice
  project as a whole seeks to create an ethically sourced flagship dataset enabling artificial
  intelligence research into voice as a biomarker of health; the pediatric release addresses
  the specific gap that pediatric and adult voice and speech production differ fundamentally
  because the respiratory system and larynx mature rapidly through childhood, so adult normative
  data cannot be generalised to children, while large-scale pediatric voice datasets remain
  scarce.
notes: 'The dataset carries RRID:SCR_007345. PhysioNet asks that its own platform citation
  be included alongside the dataset citation: Pollard, T., Moody, B. E., Lehman, L., Gow,
  B., Fernandes, C., Xie, C., Johnson, A., Mark, R. G., & Heldt, T. (2026). PhysioNet as a
  global platform for biomedical research. Nature Health. https://doi.org/10.1038/s44360-026-00096-z.
  Questions about the dataset itself are directed to the corresponding author listed on the
  PhysioNet sidebar, whose contact details are visible only to logged-in users.'
source_caveats: 'The declared source bundle mixes documents scoped to this pediatric dataset
  with consortium-wide documents that largely describe the adult Bridge2AI-Voice releases.
  Pediatric-scoped evidence comes from the PhysioNet v1.1.0 landing page and from the explicitly
  pediatric passages of the project documentation at docs.b2ai-voice.org and of the Bridge2AI
  Voice Data Acquisition IRB protocol. Consortium-wide material — the docs healthsheet and
  study-metadata answers, which refer to v2.0.0 and v3.0.0 and to 833 adult participants;
  the USF-centred sections of the IRB protocol; the NIH RePORTER page for the parent award;
  and the Bridge2AI-Voice Data Transfer and Use Agreement — was used only where the pediatric
  release falls within its scope, and the adult dataset''s participant counts, recording counts,
  release dates, DOIs, de-identification statements and site list were deliberately not carried
  into this record. The project documentation gives two garbled renderings of the NIH award
  identifier, "3TF-OT2ActfOD032720Projectf01S1" and "Award #3Tf-OTOD03272001S2"; neither was
  transcribed, and the award numbers recorded here are those given verbatim in the pediatric
  release acknowledgements and in NIH RePORTER. The PhysioNet author list spells the Hospital
  for Sick Children investigator "Jennifer Siu" while the project documentation spells the
  same person "Jennifer Sui"; the PhysioNet spelling is used here. The IRB protocol''s revision
  history records that version 2 (May 3, 2023) modified the protocol to include the pediatric
  cohort under the USF single IRB, while the same protocol states that the Canadian institutions,
  including SickKids, do not follow the single-IRB process and apply for a separate research
  ethics board approval; the pediatric PhysioNet release states only that data collection
  and sharing were approved by the Research Ethics Board at the Hospital for Sick Children.
  Both statements are represented under ethical_reviews rather than reconciled. The bundle
  gives no collection start or end dates for the pediatric cohort, so no collection timeframe
  is recorded.'
purposes:
- id: purpose:pediatric_voice_ai_research
  name: Enable machine learning research on pediatric voice and speech
  response: Establishing a robust multi-institutional dataset that integrates pediatric voice
    data with demographic information would advance the understanding of voice and disease
    as well as early detection and intervention. Resources such as this project are intended
    to enable study of developmental norms, create AI-driven tools for early screening, and
    support clinical insight.
- id: purpose:voice_as_biomarker
  name: Support voice as a biomarker of health
  response: The Bridge2AI-Voice project seeks to create an ethically sourced flagship dataset
    to enable future research in artificial intelligence and support critical insights into
    the use of voice as a biomarker of health. The human voice contains complex acoustic markers
    which have been linked to important health conditions including dementia, mood disorders,
    and cancer; viewed as a biomarker, voice is simple to collect, cost-effective, and has
    broad clinical utility.
tasks:
- id: task:early_identification_communication_disorders
  name: Early identification of pediatric communication and speech disorders
  response: Understanding voice and speech development in children is essential for identifying
    communication or speech disorders early in life, and for supporting timely intervention.
    Despite the clinical importance of detecting pediatric communication disorders such as
    autism spectrum disorder and speech delays, the availability of large-scale pediatric
    datasets remains limited.
- id: task:developmental_norms
  name: Study of pediatric voice developmental norms
  response: Pediatric and adult voice and speech production are fundamentally different because
    the respiratory system and larynx undergo rapid functional maturation and development
    throughout childhood, and these developmental changes can influence acoustic features
    such as fundamental frequency. The dataset is intended to enable study of developmental
    norms across the 2 to 18 year age range.
addressing_gaps:
- id: gap:adult_norms_not_generalizable
  name: Adult normative voice data cannot be generalised to children
  response: Pediatric and adult voice/speech production are fundamentally different because
    the respiratory system and larynx undergo rapid functional maturation/development throughout
    childhood. These developmental changes can influence acoustic features such as fundamental
    frequency (F0). As a result, evidence/normative data that we have in adults cannot be
    generalized to pediatric populations.
- id: gap:scarcity_of_pediatric_datasets
  name: Scarcity of open, large-scale pediatric voice datasets
  response: The availability of large-scale pediatric databases/datasets remains limited.
    Data collection in pediatric populations introduces unique challenges such as privacy
    issues, consent processes, and the need for developmentally appropriate tasks. These factors
    have contributed to the lack of publicly/open accessible pediatric data sets that enable
    machine learning for pediatric voice analysis.
