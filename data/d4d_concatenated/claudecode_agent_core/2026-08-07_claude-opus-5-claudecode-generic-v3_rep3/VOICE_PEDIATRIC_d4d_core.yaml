instances:
- id: instance:participant
  name: Pediatric participant
  instance_type: participant
  counts: 300
  description: Participants are children and adolescents aged 2 to 18 years, comprising patients
    and healthy volunteers at the Hospital for Sick Children together with non-patients recruited
    through research postings. Each consented participant was assigned a unique study identification
    number, and pediatric participants are grouped by age.
- id: instance:recording
  name: Derived audio recording
  instance_type: audio recording represented by derived acoustic features
  counts: 23533
  description: Each recording corresponds to one acoustic task performed by one participant
    in one session, represented in the release by derived features rather than by the original
    waveform. Every element of the parquet-formatted feature files carries the participant
    identifier, the session identifier, the task name, the number of time frames for that
    feature, and the tensor data for the feature.
  missing_information:
  - id: missing:feature_coverage
    name: Incomplete feature coverage across recordings
    missing:
    - Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records
      and audio checks, removed from version 1.1
    - Features for recordings that could not be processed, whether due to length or other
      issues
    why_missing:
    - Records identified as sensitive, and audio checks, had these features removed from the
      version 1.1 release
    - Some files, whether due to length or other issues, could not generate certain features
      and so are not included in the bundled data
sampling_strategies:
- id: sampling:pediatric_eligibility
  name: Eligibility-based enrolment at a single pediatric centre
  is_sample: true
  source_data: Patients and healthy volunteers seen at the Hospital for Sick Children, together
    with non-patients recruited through research postings.
  strategies: Patients and healthy volunteers at the Hospital for Sick Children were considered
    for enrollment. Patients were eligible if they fulfilled the inclusion criteria of 2 to
    18 years of age and English proficiency. Exclusion criteria were being over 18 years of
    age and being non-verbal. Non-patients, recruited through research postings, were evaluated
    for eligibility against the same inclusion and exclusion criteria. Following confirmation
    of eligibility, parental or participant consent was obtained prior to data collection
    and data sharing. The project documentation states that pediatric participants are recruited
    strictly from the Hospital for Sick Children (SickKids) and are grouped by age.
subpopulations:
- id: subpopulation:pediatric_age_groups
  name: Pediatric age groups
  subpopulation_elements_present: true
  identification: 'Pediatric participants are grouped by age. The Bridge2AI-Voice documentation
    publishes separate pediatric protocols for four age bands: Peds 10+, Peds 6-10, Peds 4-6
    and Peds 2-4.'
  description: The release covers participants aged 2 to 18 years, and the age-banded protocols
    determine which developmentally appropriate acoustic tasks and questionnaires a participant
    completes.
- id: subpopulation:demographic_attributes
  name: Demographic attributes collected
  subpopulation_elements_present: true
  identification: Detailed demographic information was collected as part of the standardized
    age-appropriate protocol and is distributed in the phenotype component of the release.
sensitive_elements:
- id: sensitive:pediatric_clinical_data
  name: Clinical and demographic data about children
  sensitive_elements_present: true
  sensitivity_details: The release makes detailed demographic, clinical and validated questionnaire
    data available for participants aged 2 to 18, alongside acoustic features derived from
    their voices. Records identified as sensitive had their spectrogram, Mel spectrogram,
    MFC coefficient, PPG and EMA features removed in version 1.1, and audio features for free
    speech tasks were released only after manual checking for the presence of unconsented
    speakers and personally identifiable information.
confidential_elements:
- id: confidential:certificate_of_confidentiality
  name: Data covered by a Certificate of Confidentiality
  confidential_elements_present: true
  confidentiality_details: The Bridge2AI-Voice Data Transfer and Use Agreement records that
    the Data is Personally Identifiable Information as defined in OMB Memorandum M-07-16 and
    is not covered under HIPAA, FERPA or similar laws, and that it is covered under a Certificate
    of Confidentiality which must be asserted against compulsory legal demands such as court
    orders and subpoenas for identifying information or characteristics of a research participant.
  source_caveats: This provision is stated in the consortium-wide Data Transfer and Use Agreement
    governing Bridge2AI-Voice data transfers, which the bundle does not scope to a particular
    release.
anomalies:
- id: anomaly:microphone_variation
  name: Mixed recording hardware
  anomaly_details: A headset was used to record for most participants, while the remaining
    recordings utilised the built-in tablet microphone because of low tolerance of wearing
    headphones or existing complex medical conditions.
- id: anomaly:unequal_feature_counts
  name: Unequal record counts across feature files
  anomaly_details: The torchaudio spectrogram, Mel spectrogram, MFCC and pitch files and the
    phonetic posteriorgram file each contain 23,533 records, while the four sparc feature
    files - EMA, loudness, periodicity and pitch - each contain 23,532.
- id: anomaly:unprocessable_files
  name: Recordings for which certain features could not be generated
  anomaly_details: Some files, whether due to length or other issues, could not generate certain
    features and so are not included in the bundled data.
known_biases:
- id: bias:single_site_recruitment
  name: Single-centre recruitment
  bias_type: selection_bias
  bias_description: All pediatric participants were recruited at the Hospital for Sick Children,
    and the project documentation states that pediatric participants are recruited strictly
    from that institution.
  affected_subsets:
  - All 300 pediatric participants
- id: bias:english_proficiency_requirement
  name: English proficiency requirement
  bias_type: selection_bias
  bias_description: English proficiency was an inclusion criterion for the pediatric protocol,
    so children who do not speak English are absent from the cohort.
- id: bias:non_verbal_exclusion
  name: Exclusion of non-verbal individuals
  bias_type: selection_bias
  bias_description: Individuals who were non-verbal were excluded from the pediatric study,
    so the most severely affected end of the communication-disorder spectrum is not represented.
- id: bias:recording_hardware_variation
  name: Recording hardware varies with participant tolerance and medical complexity
  bias_type: measurement_bias
  bias_description: Most recordings used a headset, but the remainder used the built-in tablet
    microphone because participants had low tolerance of wearing headphones or existing complex
    medical conditions, so acoustic recording conditions covary with participant characteristics.
known_limitations:
- id: limitation:no_raw_audio
  name: No original voice recordings in this release
  limitation_type: scope_limitation
  limitation_description: The published Bridge2AI-Voice Pediatric Dataset contains derived
    features from the audio waveforms; this PhysioNet project does not contain raw audio.
  scope_impact: Analyses that require the waveform, or feature extraction methods other than
    those already applied, cannot be performed on this release alone.
  recommended_mitigation: Raw audio for the pediatric cohort is distributed via Synapse at
    https://www.synapse.org/Synapse:syn73617068 under a controlled-access process requiring
    institutional sign-off, initiated by contacting the access committee at DACO@b2ai-voice.org.
- id: limitation:geographic_scope
  name: Single geographic and institutional setting
  limitation_type: representativeness_limitation
  limitation_description: The cohort was recruited at a single pediatric hospital, the Hospital
    for Sick Children in Toronto, so the release does not span multiple geographic or health-system
    settings.
- id: limitation:feature_removal_v1_1
  name: Feature removal for sensitive records
  limitation_type: coverage_limitation
  limitation_description: Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs
    for sensitive records and audio checks have been removed from version 1.1, so feature
    coverage is not uniform across recordings.
- id: limitation:language_scope
  name: English-language protocol only
  limitation_type: coverage_limitation
  limitation_description: The pediatric inclusion criteria required English proficiency, so
    the release documents voice and speech in English only.
acquisition_methods:
- id: acquisition:pediatric_session
  name: Single-session tablet-based acquisition
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  acquisition_details: Voice and speech were recorded directly from participants during a
    single session, demographic and medical-history information was reported by participants
    or, where a participant lacked adequate comprehension or familiarity with their own medical
    history, by parents or decision-makers completing the survey on a separate tablet during
    the recording, and the released acoustic features were derived computationally from the
    recorded waveforms.
collection_mechanisms:
- id: mechanism:reproschema_ui_tablets
  name: reproschema-ui on tablets
  mechanism_details: All data was collected through customized software - reproschema-ui -
    on tablets. A headset was used to record for most participants, while the remaining recordings
    utilised the built-in tablet microphone due to low tolerance of wearing headphones or
    existing complex medical conditions. All participants completed the recording and demographic
    data collection in one session. For participants without adequate comprehension and familiarity
    with their past medical history, parents or decision-makers completed the survey during
    the recording on a separate tablet; the simultaneous completion of the recording and survey
    improved efficiency and minimised participant burden and fatigue.
- id: mechanism:age_appropriate_protocol
  name: Standardized age-appropriate collection protocol
  mechanism_details: Once consented, patients were assigned a unique study identification
    number and a standardized age-appropriate protocol for data collection was adopted. The
    protocol included the collection of demographic information, voice and speech related
    questionnaires, and questionnaires inquiring about medical history. The project documentation
    lists pediatric-specific acoustic tasks including ABCs, Ready For School, Favorite Show,
    Favorite Food, Outside of School, Months, Counting, Naming Animals, Naming Food, Identifying
    Pictures, Picture Description (Pediatrics), Long Sounds, Noisy Sounds, Caterpillar Passage
    (Pediatrics), Repeat Words, Role naming, Repeat Sentences and Silly Sounds, and pediatric
    validated questionnaires including the Children's Voice Handicap Index-10, the Pediatric
    Voice Outcomes Survey, the Pediatric Voice-Related Quality-of-Life measure and the Patient
    Health Questionnaire modified for Adolescents.
data_collectors:
- id: collector:sickkids_study_team
  name: Bridge2AI-Voice study team at the Hospital for Sick Children
  role: Recruitment, eligibility screening, consent and in-session data collection
  collector_details: Pediatric patients are enrolled only through the pediatric participating
    institutions and not at the University of South Florida. The Hospital for Sick Children
    is a participating institution of the Bridge2AI Voice Data Acquisition protocol, with
    Alistair Johnson listed as its lead investigator and lead for data integration, and Jennifer
    Siu named as a lead investigator for the project at that institution.
missing_data_documentation:
- id: missing_doc:feature_gaps
  name: Gaps in derived feature coverage
  missing_data_patterns: The torchaudio spectrogram, Mel spectrogram, MFCC and pitch files
    and the phonetic posteriorgram file each contain 23,533 records, while the four sparc
    feature files each contain 23,532, so at least one recording lacks sparc-derived features.
  missing_data_causes: Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for
    sensitive records and audio checks have been removed from version 1.1. Additionally, some
    files, whether due to length or other issues, could not generate certain features and
    so are not included in the bundled data.
  handling_strategy: Affected records are simply absent from the bundled feature files; the
    release documents the removals in its data description and release notes.
raw_data_sources:
- id: raw_source:pediatric_audio
  name: Raw pediatric voice recordings
  source_description: Original voice, speech and related acoustic recordings captured from
    pediatric participants with reproschema-ui on tablets at the Hospital for Sick Children,
    from which the released features were derived.
  source_type: Audio waveform recordings
  raw_data_format: Audio waveforms
  access_details: Raw audio is not part of this PhysioNet project. Accessing raw audio is
    a more involved process and requires institutional sign-off; requests go to the access
    committee at DACO@b2ai-voice.org, and the data are made available via Synapse at https://www.synapse.org/Synapse:syn73617068.
    The project documentation states that raw audio data is disseminated through controlled
    access only, to protect participants' privacy.
raw_sources:
- id: raw_data:synapse_pediatric_audio
  name: Bridge2AI Voice Pediatric raw audio on Synapse
  access_url: https://www.synapse.org/Synapse:syn73617068
  raw_data_details: Raw Audio Data Access for the Bridge2AI Voice Pediatric Cohort is via
    Synapse. The published PhysioNet project contains derived features from the audio waveforms
    and does not contain raw audio; interested users are asked to contact the access committee
    at DACO@b2ai-voice.org because access requires institutional sign-off.
preprocessing_strategies:
- id: preprocessing:torchaudio_features
  name: torchaudio time-varying feature extraction
  preprocessing_details: Spectrograms of dimension 201xT were generated using the short-time
    Fast Fourier Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT.
    Mel spectrograms of dimension 60xT were generated with the same window, hop and FFT size
    and 60 Mel bins. Mel-frequency cepstrum coefficients of dimension 60xT were computed using
    the same parameters as the Mel spectrograms. Detected pitch, the fundamental frequency
    over time, was computed with dimension T and minimum and maximum pitch of 80 and 500 respectively.
  used_software:
  - id: software:torchaudio
    name: torchaudio
- id: preprocessing:sparc_features
  name: Speech Articulatory Coding feature estimation
  preprocessing_details: 'Estimated electromagnetic articulography was produced using a deep
    learning model with dimensions Tx12, the twelve values corresponding to the X and Y positions
    of six articulators: tongue dorsum, tongue body, tongue tip, lower incisor, upper lip
    and lower lip. Estimated loudness was computed from the average absolute amplitude of
    the audio waveform over 20 ms windows with size T, estimated periodicity, the confidence
    of pitch presence, was derived over 20 ms windows with dimension T, and an estimated fundamental
    frequency was computed with a different algorithm over a range of 50-550 Hz with dimension
    T.'
- id: preprocessing:ppg_extraction
  name: Phonetic posteriorgram extraction
  preprocessing_details: Phonetic posteriorgram probabilities were computed across 40 phoneme
    categories, giving a dimension of 40xT with a frame rate of 100 Hz.
- id: preprocessing:static_features
  name: Static acoustic and quality feature extraction
  preprocessing_details: In addition to the parquet files, the features folder contains plain-text
    files of features derived from openSMILE, Praat, parselmouth and torchaudio. Each such
    feature is present in static_features.tsv, and metrics related to audio quality derived
    from the recordings are present in audio_quality_metrics.tsv.
  used_software:
  - id: software:opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, an open-source
      audio feature extractor.
  - id: software:praat
    name: Praat
  - id: software:parselmouth
    name: parselmouth
    description: A Python interface to Praat.
  - id: software:torchaudio
    name: torchaudio
- id: preprocessing:bids_conversion
  name: Conversion to REDCap format and the Brain Imaging Data Structure
  preprocessing_details: Pediatric data collected through ReproSchema-UI is extracted and
    transformed into REDCap format, and subsequently converted to the Brain Imaging Data Structure
    (BIDS). The project documentation states that the raw audio files and the questionnaire
    data retrieved from ReproSchema-UI or exported from REDCap were converted to be compliant
    with Brain Imaging Data Structure v1.9.0.
- id: preprocessing:b2aiprep_pipeline
  name: Open-source preprocessing pipeline
  preprocessing_details: The code used to preprocess the raw audio waveforms into the parquet
    files and to merge the source data into the phenotype files has been made open source
    in the b2aiprep library. Data were exported and converted to tab delimited values using
    this open source library developed by the team.
  used_software:
  - id: software:b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    description: Bridge2AI Data Processing Library, cited as Johnson, A., Bevers, I., Ng,
      E., Wilke, J., Brito, R., Bedrick, S., Catania, F. & Ghosh, S. (2025). Bridge2AI Data
      Processing Library (Version 3.0.0) [Computer software].
  - id: software:senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Toolkit used for processing audio files for research tasks.
- id: preprocessing:data_dictionaries
  name: Generation of accompanying data dictionaries
  preprocessing_details: 'All of the distributed data files are associated with a data dictionary
    file which has the same file stem and a JSON suffix, for example torch_spectrogram.json.
    The data dictionaries share an overall structure: a dictionary whose keys are the column
    names matching the associated data file and whose values are dictionaries with further
    detail, in which the description value provides a one-sentence summary of the respective
    column.'
cleaning_strategies:
- id: cleaning:sensitive_record_removal
  name: Removal of features for sensitive records
  cleaning_details: Spectrograms, Mel Spectrograms, MFC coefficients, PPGs and EMAs for sensitive
    records and audio checks have been removed from version 1.1.
- id: cleaning:free_speech_manual_check
  name: Manual checking of free speech recordings
  cleaning_details: Version 1.1 released audio features for all free speech tasks that were
    manually checked for the presence of unconsented speakers and personally identifiable
    information.
- id: cleaning:inadvertent_caregiver_audio
  name: Discarding inadvertently recorded caregiver speech
  cleaning_details: Under the study protocol, in the event that a caregiver's voice is recorded
    inadvertently the affected clips can be discarded either by re-recording manually during
    data collection or during data audit and postprocessing.
  source_caveats: This provision is stated in the consortium-wide Bridge2AI Voice Data Acquisition
    protocol rather than in the pediatric release documentation.
ethical_reviews:
- id: ethics_review:sickkids_reb
  name: Research Ethics Board, Hospital for Sick Children
  reviewing_organization: Research Ethics Board at the Hospital for Sick Children
  review_details: Data collection and sharing was approved by the Research Ethics Board at
    the Hospital for Sick Children.
- id: ethics_review:usf_single_irb_protocol
  name: Bridge2AI Voice Data Acquisition protocol under the USF single IRB
  reviewing_organization: University of South Florida Institutional Review Board (single IRB)
    and participating-site review boards
  review_details: The Bridge2AI Voice Data Acquisition protocol, whose principal investigator
    is Yael Bensoussan, was submitted and approved by the USF single IRB and subsite IRBs
    through the single IRB process. Its revision history records that version 2, dated 3 May
    2023, was modified to include the pediatric cohort under the single IRB, and the protocol
    states that pediatric patients are enrolled only through the pediatric sites and not at
    USF, with checklist HRP-416 for children under 21 completed and appended.
  contact_person: person:yael_bensoussan
  source_caveats: The same protocol also states that the Canadian institutions - Mount Sinai
    Hospital, SickKids and the University of Toronto - do not abide by the single IRB process
    and apply for a separate research ethics board approval to comply with Canadian regulations,
    with a copy of the approved application submitted to the USF IRB. The pediatric PhysioNet
    release states only that data collection and sharing were approved by the Research Ethics
    Board at the Hospital for Sick Children. Both statements are recorded rather than reconciled.
data_protection_impacts:
- id: data_protection:controlled_access_memorandum
  name: Ethical justification for controlled access to raw voice samples
  impact_details: The Bridge2AI-Voice documentation publishes a memorandum, "Ethical Justification
    for Controlled Access to Raw Voice Data Samples", available for download, which explains
    the reasoning behind the governance structure that separates registered access to the
    feature-only data from controlled access to the raw audio. The stated rationale is that
    raw audio data is disseminated through controlled access only in order to protect participants'
    privacy, because voice can never be fully de-identified.
human_subject_research:
  id: hsr:pediatric_voice
  name: Human subjects research with pediatric participants
  involves_human_subjects: true
  ethics_review_board: Research Ethics Board at the Hospital for Sick Children
  irb_approval:
  - Data collection and sharing was approved by the Research Ethics Board at the Hospital
    for Sick Children
  - The Bridge2AI Voice Data Acquisition protocol was submitted and approved by the USF single
    IRB and subsite IRBs through the single IRB process, and was modified in version 2 (3
    May 2023) to include the pediatric cohort
  special_populations:
  - Children and adolescents aged 2 to 18 years
  description: 'The study is a data generation project with no intervention: the protocol
    records that the project involves data collection only, that voice collection is a safe
    non-invasive method with minimal risk to the participant, and that there is no risk of
    research-related injury.'
at_risk_populations:
  id: at_risk:children
  name: Children and adolescents aged 2 to 18
  at_risk_groups_included: true
  assent_procedures: When children participate in the research, parents or guardians provide
    consent and children provide verbal assent where appropriate. Where young children cannot
    reasonably be asked to assent because of limitations in understanding due to age and development
    - which typically holds for children under seven years of age - they are not asked to
    do so. Assent is documented on a form.
  guardian_consent:
  - Parental or participant consent was obtained prior to data collection and data sharing
  - Parental permission is obtained from one or both parents; because the research is minimal
    risk it does not require permission from both parents or legal guardians
  - Not receiving consent from a parent or legal guardian for voice and clinical de-identified
    data to be uploaded to an open-sourced database is an exclusion criterion for pediatric
    participants
  special_protections:
  - Pediatric enrolment takes place only at the pediatric participating institutions and not
    at the University of South Florida
  - Checklist HRP-416 for children under 21 was completed and appended to the study protocol
  - A standardized age-appropriate protocol was adopted for data collection, with separate
    pediatric protocols published for the 2-4, 4-6, 6-10 and 10+ age bands
  - Parents or decision-makers completed the medical-history survey on a separate tablet for
    participants without adequate comprehension and familiarity with their past medical history
informed_consent:
- id: informed_consent:pediatric
  name: Parental permission with child assent
  consent_obtained: true
  consent_type: Parental or participant consent with child verbal assent where developmentally
    appropriate
  consent_documentation: The study protocol provides Consent, Assent and Parental Permission
    Documents, and requires that assent be documented on a form. Following confirmation of
    eligibility, parental or participant consent was obtained prior to data collection and
    data sharing.
  consent_scope: Consent covers the collection of voice and clinical data and the sharing
    of de-identified voice and clinical data through an open-sourced database; the protocol
    makes not consenting to that upload an exclusion criterion, and for pediatric participants
    the absence of consent from a parent or legal guardian is likewise disqualifying.
  withdrawal_mechanism: Under the study protocol, participants who withdraw during or before
    the voice data collection is completed do not have their data included in the database,
    while data from participants who withdraw after completing the voice data collection are
    kept until completion of the study.
is_deidentified:
  id: deidentification:pediatric_release
  name: De-identification of the pediatric release
  identifiable_elements_present: false
  method: Release of derived acoustic features only, with the original voice recordings withheld,
    combined with manual review of free speech recordings and removal of features for records
    identified as sensitive.
  identifiers_removed: The original voice recordings are not included; spectrograms, Mel spectrograms,
    MFC coefficients, PPGs and EMAs for sensitive records and audio checks were removed from
    version 1.1; and audio features for free speech tasks were released only after manual
    checking for the presence of unconsented speakers and personally identifiable information.
  deidentification_details: The release contains data considered low risk, including derivations
    such as spectrograms but not the original voice recordings. Raw audio remains available
    only under controlled access because voice cannot be fully de-identified.
intended_uses:
- id: intended_use:pediatric_voice_ai
  name: Research on pediatric voice and speech using machine learning
  use_category: research
  examples:
  - Study of pediatric voice and speech developmental norms across the 2 to 18 year age range
  - Development of AI-driven tools for early screening of communication and speech disorders
  - Investigation of the relationship between voice and disease in children to support early
    detection and intervention
  usage_notes: The release notes that if using Python the parquet dataset can be loaded with
    the HuggingFace datasets library, for example Dataset.from_parquet applied to torchaudio_spectrogram.parquet,
    and that a spectrogram can be plotted in decibels by converting it from its original power
    representation with librosa.power_to_db. A phenotype file can be loaded with any statistical
    analysis tool, for example by reading demographics.tsv with the pandas library using a
    tab separator and a header row.
discouraged_uses:
- id: discouraged_use:non_research_applications
  name: Non-research applications
  discouragement_details: The project documentation states that the dataset should not be
    used for non-research applications such as hiring decisions, insurance premium adjustments,
    or any form of surveillance that could lead to discrimination or harm, because such limitations
    are intended to prevent unethical or biased outcomes that could negatively impact individuals
    based on their health conditions or voice characteristics.
  source_caveats: This restriction is stated in the consortium-wide Bridge2AI-Voice documentation,
    which governs the Registered Access Agreement under which the pediatric release is distributed,
    rather than in the pediatric release documentation itself.
prohibited_uses:
- id: prohibited_use:reidentification
  name: Re-identification of research participants
  prohibition_reason: Under the Registered Data Access Agreement the dataset is not to be
    used to attempt to re-identify research participants, nor for any actions that could reasonably
    lead to re-identification.
- id: prohibited_use:harm_or_stigmatization
  name: Uses causing harm or stigmatization
  prohibition_reason: Under the Registered Data Access Agreement the dataset is not to be
    used for any purpose that could foreseeably cause harm or stigmatization to research participants,
    their families, communities, or specific populations.
- id: prohibited_use:blocking_ip_claims
  name: Intellectual property claims that restrict access
  prohibition_reason: Under the Registered Data Access Agreement, intellectual property protections,
    database rights, or related rights may not be used in a manner that restricts or limits
    access to any part of the dataset or to any conclusions derived from it, so that future
    use of the dataset remains unrestricted in alignment with the Open Science principles
    upheld by the Bridge2AI-Voice Consortium.
distribution_formats:
- id: distribution_format:parquet
  name: Parquet feature files
  format: Parquet
  description: Binary files are made available as Parquet, an open-source column-oriented
    data file format, holding the time-varying derived features.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- id: distribution_format:tsv
  name: Tab-separated feature and phenotype tables
  format: TSV
  media_type: text/tab-separated-values
  description: Plain-text tab-delimited tables holding static features, audio quality metrics
    and phenotypic information.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
- id: distribution_format:json_dictionaries
  name: JSON data dictionaries
  format: JSON
  media_type: application/json
  description: Every data file is accompanied by a JSON data dictionary sharing the same file
    stem, whose keys are the column names of the associated data file and whose values give
    further detail including a one-sentence description of each column.
  access_urls:
  - https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
distribution_dates:
- id: distribution_dates:physionet
  name: PhysioNet release dates
  release_dates:
  - '1.0.0: December 17, 2025'
  - '1.1.0: May 1, 2026'
license_and_use_terms:
  id: license:registered_access
  name: Bridge2AI Voice Registered Access License
  license_terms: 'PhysioNet records the access policy as credentialed access: only credentialed
    users who sign the data use agreement can access the files. The license for the files
    is the Bridge2AI Voice Registered Access License and the data use agreement is the Bridge2AI
    Voice Registered Access Agreement. No training is required. To obtain registered access
    a user registers on PhysioNet, confirms their identity under the Registered Access License,
    and signs the Bridge2AI-Voice Registered Access Agreement, which outlines the terms and
    conditions for data use. For the raw audio data, controlled access requires completing
    a Data Access Request Form and a Data Use Agreement, submitting an application to the
    Data Access Compliance Office for review, and on approval ensuring that a Data Use and
    Transfer Agreement is signed by an authorized official at the recipient institution. The
    consortium documentation states that the dataset is intended solely for commercial and
    non-commercial research purposes by Authorized Researchers, and that there are no fees
    associated with these restrictions.'
  data_use_permission: general_research_use
ip_restrictions:
  id: ip:registered_access_terms
  name: Intellectual property terms of the access agreements
  restrictions:
  - The Data may be protected by copyright and other rights, including other intellectual
    property rights; duplication as reasonably required to carry out the research project
    with the Data is nonetheless permitted.
  - Sale of all or part of the Data on any media is not permitted.
  - Nothing in the agreement operates to transfer to the user any intellectual property rights
    in or relating to the Data, and the user agrees not to make intellectual property claims
    on the Data.
  - Users agree not to use intellectual property protection in ways that would prevent or
    block access to, or use of, any element of the Data or conclusions drawn directly from
    the Data.
  - Users may elect to perform further research that adds intellectual and resource capital
    to the Data and to obtain intellectual property rights on those downstream discoveries,
    but agree to implement licensing policies that will not obstruct further research and
    to respect the Fort Lauderdale Agreement.
  - The Data Provider provides no guarantees that the Data is free of third-party intellectual
    property rights, database rights or other related rights.
  description: The project documentation states that no IP-based restrictions have been imposed
    by third parties.
regulatory_restrictions:
  id: regulatory:pediatric_access
  name: Access and regulatory conditions
  confidentiality_level: restricted
  regulatory_restrictions:
  - This is a restricted-access resource; to access the files a user must be a credentialed
    user and must sign the data use agreement for the project.
  - Raw audio access requires institutional sign-off and is arranged through the Data Access
    Compliance Office, with a Data Access Request Form, a Data Use Agreement, review by that
    office, and a Data Use and Transfer Agreement signed by an authorized institutional official.
  - Under the Data Transfer and Use Agreement, recipients must retain control over the Data,
    may not disclose or grant access to third parties other than Authorized Persons without
    prior written consent, and must establish administrative, technical and physical safeguards;
    collaborators at other research organizations and other research teams at the same organization
    must apply independently for access and sign their own agreement.
  - Under the Data Transfer and Use Agreement, recipients will not use the Data, either alone
    or with any other information, to make any effort to contact individuals who are the subjects
    of the Data without appropriate institutional review board approval, specific written
    approval from the Provider, and informed consent from the individual if required.
  - Recipients further agree to adhere to the specific requirements of PhysioNet.org, managed
    by the MIT Laboratory for Computational Physiology.
  other_compliance: The Bridge2AI-Voice Data Transfer and Use Agreement states that the Data
    is Personally Identifiable Information as defined in OMB Memorandum M-07-16 and is not
    covered under HIPAA, FERPA or similar laws or regulations governing personal information,
    and that it is covered under a Certificate of Confidentiality which must be asserted against
    compulsory legal demands. The project documentation states that no export controls apply
    to the dataset.
  source_caveats: The Data Transfer and Use Agreement is the consortium-wide agreement naming
    the University of South Florida Board of Trustees as Provider Institution; the bundle
    does not scope it to a particular Bridge2AI-Voice release.
maintainers:
- id: maintainer:physionet
  name: PhysioNet, MIT Laboratory for Computational Physiology
  role: academic_institution
  maintainer_details: PhysioNet, which hosts and distributes the pediatric dataset, is maintained
    by the MIT Laboratory for Computational Physiology and supported by the National Institute
    of Biomedical Imaging and Bioengineering, the National Heart Lung and Blood Institute,
    and the NIH Office of the Director under NIH grant numbers U24EB037545 and R01EB030362.
- id: maintainer:daco
  name: Bridge2AI-Voice Data Access Compliance Office
  role: other
  maintainer_details: The Data Access Compliance Office reviews applications for controlled
    access to raw audio and can be reached at DACO@b2ai-voice.org. The Data Transfer and Use
    Agreement is effective only upon review by, and subject to the approval of, that office,
    which requires a distinct application.
updates:
  id: updates:physionet_versions
  name: Version-based updates on PhysioNet
  update_details: The dataset is updated by publishing new versions on PhysioNet. Version
    1.0.0 (17 December 2025) was the first release of the Bridge2AI-Voice Pediatric dataset.
    Version 1.1.0 (1 May 2026) released no new participants but added audio features for all
    free speech tasks that had been manually checked for the presence of unconsented speakers
    and personally identifiable information, together with new metrics related to the audio
    quality of the recordings and per-recording metadata information; the same minor update
    removed spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive
    records and audio checks.
version_access:
  id: version_access:pediatric
  name: Versions of the pediatric dataset
  latest_version_doi: https://doi.org/10.13026/mf9s-5r03
  versions_available:
  - 1.0.0, published December 17, 2025
  - 1.1.0, published May 1, 2026
  version_details: PhysioNet publishes a DOI for version 1.1.0, https://doi.org/10.13026/h995-bt35,
    and a separate DOI resolving to the latest version of the project, https://doi.org/10.13026/mf9s-5r03.
    The source manifest curation note records that pediatric version 1.0.0 exists upstream
    but is superseded.
retention_limit:
  id: retention:recipient_and_institutional
  name: Retention limits on transferred and locally held data
  retention_period: Under the Data Transfer and Use Agreement, the agreement expires two years
    after the start date, upon completion of the project, upon expiration of the applicable
    ethics approval, or upon termination by the Provider Institution, whichever occurs first.
  retention_details: On expiration or termination the recipient must follow the disposition
    instructions and destroy the Data in accordance with the Provider's instructions, submitting
    written certification of destruction within thirty days, while retaining one copy only
    to the extent necessary to comply with records retention requirements under law, regulation
    or institutional policy and for research integrity and verification; the agreement's restrictions
    survive and apply to any such archival copy. Separately, the study protocol provides that
    identifiable data and the datasheets linking participant numbers to participant information
    are kept at each institution on local cloud storage for a maximum of ten years after study
    completion and are then destroyed, under the responsibility of each local principal investigator,
    and that original consent documents are stored for a minimum of five years after study
    completion.
  source_caveats: The two-year term and destruction requirement come from the consortium-wide
    Bridge2AI-Voice Data Transfer and Use Agreement, which governs transfers of the Data to
    a recipient institution; the bundle states no retention limit for the registered-access
    featurized release itself.
extension_mechanism:
  id: extension:open_source_preprocessing
  name: Contributions to the open-source preprocessing code
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: The code used to preprocess the raw audio waveforms into the parquet
    files and to merge the source data into the phenotype files is open source in the b2aiprep
    library. The open-source repositories have discussion forums and issue pages that allow
    public discussion of data preprocessing, and a pull request mechanism for contributing
    improvements to the data preprocessing code.
external_resources:
- id: external:synapse_pediatric_audio
  name: Synapse repository for Bridge2AI Voice Pediatric raw audio
  description: Raw audio data access for the Bridge2AI Voice Pediatric cohort is via Synapse.
    The published PhysioNet project contains only derived features; accessing raw audio requires
    institutional sign-off and a request to the access committee at DACO@b2ai-voice.org.
  external_resources:
  - https://www.synapse.org/Synapse:syn73617068
  restrictions:
  - Controlled access, requiring institutional sign-off
  - Requests are made to the access committee at DACO@b2ai-voice.org
- id: external:project_documentation
  name: Bridge2AI-Voice project documentation
  description: The Bridge2AI-Voice documentation site publishes the pediatric protocols for
    the 2-4, 4-6, 6-10 and 10+ age bands, the pediatric acoustic task list, the pediatric
    validated questionnaires, the pediatric dashboard, and the access routes for the featurized
    and raw-audio datasets. The project website is https://b2ai-voice.org/ and the documentation
    is at https://docs.b2ai-voice.org/.
  external_resources:
  - https://docs.b2ai-voice.org/
  - https://b2ai-voice.org/
distributions:
- id: collection:features
  name: features
  path: features
  description: Derived audio data features, distributed as parquet binary files together with
    plain-text feature tables. Each parquet file is formatted similarly, with every element
    carrying a unique participant identifier, a unique session identifier, the task performed,
    the number of time frames associated with that feature, and the tensor data for the feature.
    Every data file is accompanied by a JSON data dictionary sharing the same file stem.
- id: file:torchaudio_spectrograms_parquet
  name: torchaudio_spectrograms.parquet
  path: features/torchaudio_spectrograms.parquet
  description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT (n=23533).
- id: file:torchaudio_mel_spectrograms_parquet
  name: torchaudio_mel_spectrograms.parquet
  path: features/torchaudio_mel_spectrograms.parquet
  description: Mel spectrograms of dimension 60xT generated with a 25 ms window size, 10 ms
    hop length, a 400-point FFT and 60 Mel bins (n=23533).
- id: file:torchaudio_mfcc_parquet
  name: torchaudio_mfcc.parquet
  path: features/torchaudio_mfcc.parquet
  description: Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters
    as the Mel spectrograms (n=23533).
- id: file:torchaudio_pitch_parquet
  name: torchaudio_pitch.parquet
  path: features/torchaudio_pitch.parquet
  description: Detected pitch, the fundamental frequency over time, of dimension T with minimum
    and maximum pitch of 80 and 500 respectively (n=23533).
- id: file:sparc_ema_parquet
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
  description: 'Estimated electromagnetic articulography produced with a deep learning model,
    dimensions Tx12 corresponding to the X and Y positions of six articulators: tongue dorsum,
    tongue body, tongue tip, lower incisor, upper lip and lower lip (n=23532).'
- id: file:sparc_loudness_parquet
  name: sparc_loudness.parquet
  path: features/sparc_loudness.parquet
  description: Estimated loudness based on the average absolute amplitude of the audio waveform,
    of size T, using 20 ms windows (n=23532).
- id: file:sparc_periodicity_parquet
  name: sparc_periodicity.parquet
  path: features/sparc_periodicity.parquet
  description: Estimated periodicity, the confidence of pitch presence, derived from the audio
    using 20 ms windows, of dimension T (n=23532).
- id: file:sparc_pitch_parquet
  name: sparc_pitch.parquet
  path: features/sparc_pitch.parquet
  description: Estimated fundamental frequency of the audio signal using a different algorithm
    from torchaudio_pitch, with a range of 50-550 Hz and dimension T (n=23532).
- id: file:ppgs_parquet
  name: ppgs.parquet
  path: features/ppgs.parquet
  description: Phonetic posteriorgram probabilities across 40 phoneme categories, giving a
    dimension of 40xT with a frame rate of 100 Hz (n=23533).
- id: file:static_features_tsv
  name: static_features.tsv
  path: features/static_features.tsv
  description: Plain-text table of static features derived from openSMILE, Praat, parselmouth
    and torchaudio.
  format: TSV
  media_type: text/tab-separated-values
- id: file:audio_quality_metrics_tsv
  name: audio_quality_metrics.tsv
