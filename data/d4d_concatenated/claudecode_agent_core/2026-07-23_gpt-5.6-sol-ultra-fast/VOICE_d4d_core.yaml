name: Bridge2AI-Voice v3.0.0
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: The selected Bridge2AI-Voice adult release, version 3.0.0, is a collection of data derived
  from voice recordings with corresponding clinical information. It contains data for 833 participants
  collected across five sites in North America. The released content includes low-reidentification-risk
  audio derivations, detailed demographic and clinical information, and validated questionnaire data;
  the original voice recordings are not included in the PhysioNet release.
