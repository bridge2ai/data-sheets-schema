purposes:
- name: Enable clinical voice-biomarker research
  response: Provide a large, ethically sourced, diverse voice dataset linked to health information for
    AI research into voice as a biomarker of health.
- name: Support clinically applicable machine learning
  response: Enable development, benchmarking, and validation of machine-learning models for screening,
    diagnosis, and monitoring of health conditions.
- name: Advance audiomics standards and infrastructure
  response: Improve standardized acoustic-data acquisition, interoperability, AI-readiness, ethical governance,
    and infrastructure for audiomics.
tasks:
- name: Disease detection and classification
  response: Train, fine-tune, benchmark, or validate models using derived voice features and clinical
    labels for adult voice, neurological, mood, and respiratory conditions.
- name: Voice-biomarker screening, diagnosis, and monitoring research
  response: Investigate voice, speech, cough, and breathing-derived markers for non-invasive clinical
    screening, diagnosis, and monitoring.
- name: Derived audio feature analysis
  response: Analyze spectrogram, MFCC, Mel-spectrogram, pitch, articulatory, loudness, periodicity, phonetic-posteriorgram,
    and static acoustic features together with phenotype data.
addressing_gaps:
- name: Scale and diversity gap
  response: Existing voice-biomarker studies often used small or medium-sized datasets with limited population
    diversity and external validity.
- name: Standardization and interoperability gap
  response: Existing studies used inconsistent voice and speech collection methods, limiting comparison,
    pooling, reproducibility, and clinical translation.
- name: Clinical metadata and open research gap
  response: Many existing voice datasets lack accurate clinical and demographic metadata or are private,
    limiting robust model training and auditing.
