- id: urn:b2ai-voice:3.0.0:phenotype-tsv
  name: Phenotype TSV files
  description: Forty-five TSV files directly enumerated in the release tree cover confounders, demographics,
    diagnoses, enrollment, questionnaires, and task data. Rows are emitted only when at least one field
    is nonmissing, and repeated visits may create multiple rows per participant.
  path: phenotype/
  format: TSV
  media_type: text/tab-separated-values
- id: urn:b2ai-voice:3.0.0:phenotype-json-dictionaries
  name: Phenotype JSON data dictionaries
  description: Forty-five JSON dictionaries paired by stem with the enumerated phenotype TSV files describe
    columns, prompts, and response data types.
  path: phenotype/
  format: JSON
  media_type: application/json
