instances:
- name: Adult participants
  instance_type: person
  counts: 833
  description: The version 3.0.0 release contains data for 833 adult participants across five sites in
    North America.
  label: true
  label_description: Clinical diagnostic categories were established by local clinicians using clinical
    assessment, appropriate work-up, EHR records, or active prescriptions, depending on the cohort.
- name: Voice-derived recording records
  instance_type: derived audio feature record
  description: Project documentation reports approximately 61,937 voice-derived recordings for version
    3.0. Exact element counts differ by feature type because sensitive records, audio checks, or failed
    feature generation were excluded.
- name: Phenotype observations
  instance_type: tabular clinical and questionnaire observation
  description: Phenotype rows contain demographics, confounders, diagnoses, enrollment, questionnaire,
    and task information. Repeated visits can produce more than one row for a participant and responses
    may differ between visits.
anomalies:
- name: Feature-specific missing records
  anomaly_details:
  - Sensitive records and audio checks were removed from selected feature types, and some recordings could
    not generate features because of length or other processing issues.
- name: Collection and response irregularities
  anomaly_details:
  - Some questions were optional, collection irregularities could cause missing information, and the collection
    protocol changed during the study.
known_biases:
- name: Specialty-clinic selection
  bias_type: selection_bias
  bias_description: Participants were recruited through specialty clinics using a non-probability sample,
    so inclusion depends on clinical access and eligibility.
  mitigation_strategy: Evaluate models against the multivariate disorder, site, and demographic distribution
    and avoid treating the release as population representative.
  affected_subsets:
  - All version 3.0.0 adult participant data
- name: Site and demographic representation
  bias_type: representation_bias
  bias_description: The project documentation reports skews by disorder category, collection site, and
    demographic factors; people with less trust in the medical system or less proximity to collection
    sites may be less likely to enroll.
  mitigation_strategy: Stratify evaluations by available site, disorder, and demographic variables and
    report subgroup performance and coverage.
  affected_subsets:
  - Adult participant cohort
- name: Site and diagnostic measurement variation
  bias_type: measurement_bias
  bias_description: Sites used distinct devices or configurations, headset distance could vary, and diagnostic
    practices and questionnaire responses can vary.
  mitigation_strategy: Account for site, device, diagnostic method, noise, and confounder variables when
    designing and evaluating models.
  affected_subsets:
  - Audio-derived features
  - Clinical labels
known_limitations:
- name: Limited population representativeness
  limitation_type: representativeness_limitation
  limitation_description: The non-probability sample was collected at five North American sites and is
    not established as representative of the broader target population.
  scope_impact: Model performance may not generalize to other geographies, care settings, devices, languages,
    or demographic groups.
  recommended_mitigation: Use external validation and subgroup evaluation before clinical interpretation.
- name: Adult derived-feature release scope
  limitation_type: scope_limitation
  limitation_description: Version 3.0.0 is an adult release of derived audio features and phenotype data;
    original raw audio is excluded and pediatric data is a separate dataset.
  scope_impact: The release cannot support analyses that require original waveforms or a combined adult-pediatric
    cohort without separately approved resources.
  recommended_mitigation: Request controlled raw-audio access when necessary and treat the pediatric PhysioNet
    resource as a distinct dataset.
- name: Feature and phenotype missingness
  limitation_type: coverage_limitation
  limitation_description: Optional questions, collection irregularities, privacy exclusions, and feature-generation
    failures produce nonuniform coverage.
  scope_impact: Available participant and recording counts differ across phenotype tables and feature
    representations.
  recommended_mitigation: Inspect missingness and feature-specific counts for each analysis cohort.
- name: Collection heterogeneity
  limitation_type: methodological_limitation
  limitation_description: Devices, site configurations, diagnostic practices, and the collection protocol
    varied over the study.
  scope_impact: Site and acquisition effects may be confounded with disorder labels.
  recommended_mitigation: Include acquisition and site context in study design and sensitivity analyses.
confidential_elements:
- name: Restricted health and voice-derived data
  confidential_elements_present: true
  confidentiality_details:
  - Although direct identifiers and selected sensitive fields or derived features were removed, the release
    contains health, demographic, and voice-derived information and is distributed only to credentialed
    users who sign the data use agreement.
  - Original voice recordings have heightened re-identification risk and are available only through a
    separate controlled-access process.
