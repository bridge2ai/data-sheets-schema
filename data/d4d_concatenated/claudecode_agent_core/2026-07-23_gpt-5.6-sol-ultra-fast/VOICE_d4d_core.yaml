acquisition_methods:
- name: Prospective multimodal participant acquisition
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Voice, speech, cough, and breathing tasks were directly recorded using a custom tablet application,
    with a headset when possible.
  - Participants reported demographic, medical-history, confounder, and questionnaire information.
  - Clinical diagnoses were verified by clinicians through clinical assessment, appropriate work-up, EHR
    records, or prescriptions.
  - Released audio features were computationally derived from the raw recordings.
collection_mechanisms:
- name: Bridge2AI-Voice custom data-collection application
  mechanism_details:
  - Standardized voice, speech, cough, and breathing tasks were collected through a custom application
    on a tablet, using a headset when possible.
- name: REDCap and clinical records
  mechanism_details:
  - Questionnaire and clinical data were exported from REDCap; diagnoses could also be supported by EHR
    records, imaging, clinical work-up, or active prescriptions.
