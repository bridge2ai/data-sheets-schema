preprocessing_strategies:
- name: Audio standardization
  preprocessing_details:
  - Raw audio was converted to monaural, resampled to 16 kHz, and processed with a Butterworth anti-aliasing
    filter.
- name: Time-varying and static feature derivation
  preprocessing_details:
  - The release derives STFT spectrograms using a 25 ms window, 10 ms hop, and 400-point FFT, followed
    by twofold temporal downsampling.
  - It also derives 60 MFCCs, 60-bin Mel spectrograms, pitch, SPARC articulatory/loudness/periodicity/pitch
    features, OpenSMILE features, Parselmouth/Praat features, and 40-category phonetic posteriorgrams.
- name: Phenotype organization
  preprocessing_details:
  - b2aiprep v3.0.0 processed raw audio and reorganized REDCap-derived phenotype information into separate
    TSV files with JSON dictionaries.
cleaning_strategies:
- name: Privacy and release filtering
  cleaning_details:
  - Direct identifiers, state/province, selected sensitive fields, and selected free-speech-derived representations
    were removed.
  - Sensitive records, audio checks, and features that failed because of length or other issues were omitted
    from applicable feature bundles.
- name: Release audit procedures
  cleaning_details:
  - Project documentation describes missingness tables, distribution and outlier checks, schema checks
    for categorical responses, and audio quality-control checks.
