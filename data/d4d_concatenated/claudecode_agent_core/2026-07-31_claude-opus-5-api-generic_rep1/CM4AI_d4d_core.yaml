purposes:
  - description: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning (NIH RePORTER project 3OT2OD032742-01S2,
      "Bridge2AI: Cell Maps for AI (CM4AI) Data Generation Project").
  - description: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced
      from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in
      cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines under perturbed
      and unperturbed conditions. Note that this is the objective as stated in the May 2024 CM4AI
      preprint; the realized scope reported later is larger (an expressed genome-scale CRISPRi atlas
      of 11,739 targeted genes in iPSCs; 7,023 total proteins investigated per the CM4AI portal).
  - description: >-
      To broadly stimulate research and development in "visible" machine learning systems informed by
      multi-scale cell and tissue architecture, addressing the problem that machine learning models in
      genomics and precision medicine are often difficult-to-interpret black boxes.
  - description: >-
      To ethically leverage state-of-the-art computational and experimental tools in biomedical
      science to enable a new generation of transformative artificial intelligence research, with
      datasets and software available to the research community under minimally restrictive terms
      consistent with ethical guidelines, researcher attribution, and research integrity.
  - description: >-
      To implement and demonstrate a standards data management approach based on FAIR access and
      software principles, with deep provenance and replication packages for representation of cell
      maps and their underlying datasets.

addressing_gaps:
  - description: >-
      In genomics and precision medicine, machine learning models are often "black boxes," predicting
      phenotypes from genotypes without understanding the mechanisms by which such translation occurs.
      CM4AI addresses this deficiency by producing knowledge maps of cell architecture on which
      "visible" machine learning systems can be built directly.
  - description: >-
      Human cells consist of a complex hierarchy of components, many of which remain unexplored; much
      of cell structure still remains uncharted, motivating systematic strategies to map subcellular
      architecture across scales.
  - description: >-
      Existing cell mapping technologies have typically been applied separately; integration of
      multiple complementary data modalities is needed to incorporate biological structure robustly
      across physical scales.
  - description: >-
      A lack of ethical, FAIR, provenanced, AI-Ready biomedical datasets suitable for training and
      validating AI/ML models, and of accompanying standards, tooling, and training for the biomedical
      AI/ML workforce.

tasks:
  - description: >-
      Interpretable genotype-phenotype learning: use of cell maps to interpret how protein assemblies
      in the cell affect cell-level phenotype predictions.
  - description: >-
      Development of "visible machine learning" or "visible neural networks" (VNNs) built directly on
      knowledge maps of cell and tissue architecture rather than as black boxes.
  - description: >-
      Construction of hierarchical multi-scale cell maps by integrating protein-protein interaction
      and protein localization data through self-supervised embedding and multi-resolution community
      detection (the MuSIC pipeline).
  - description: >-
      Downstream applications in human genomics, including interpretation of genetic variants and
      mutations.
  - description: >-
      AI model training and cellular process analysis, including analysis of cell architectural
      changes and interactions in the presence of specific disease processes, treatment conditions, or
      genetic perturbations.

instances:
  - description: >-
      Immunofluorescence (ICC-IF) confocal microscopy images of MDA-MB-468 cells. Each image displays
      the spatial localization of one protein of interest together with three reference markers.
      Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody
      (yellow channel); microtubules with tubulin antibody (red channel); and the protein of interest
      with a targeted antibody (green channel). RGB immunofluorescent images were added in the June
      2025 release revision.
  - description: >-
      SEC-MS records: protein-level quantification across size-exclusion chromatography fractions,
      used to derive co-elution profiles and proteome-wide protein complex / interaction profiles.
  - description: >-
      AP-MS records: bait-prey protein interaction data acquired on endogenously tagged MDA-MB-468
      cell lines under treatment conditions.
  - description: >-
      Perturb-seq products: a processed genome-scale CRISPRi Perturbation Cell Atlas summarizing
      transcriptional and fitness phenotypes per targeted gene, and a companion archive of raw
      sequence data references pointing to SRA / NCBI BioProject. Note that the archives deposited in
      Dataverse are small (30.2 KB and 73.3 KB respectively), consistent with summary products and
      accession references rather than with the underlying single-cell read data, which is held in the
      external repositories and is listed as embargoed for the June 2026 release.

subpopulations:
  - description: >-
      MDA-MB-468 (RRID:CVCL_0419), a triple negative breast cancer cell line established from a
      metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary
      adenocarcinoma, available from ATCC. Extensively used to study triple-negative breast cancer and
      well characterized with transcriptomic, mutational profile, and whole-genome sequencing data
      available.
  - description: >-
      KOLF2.1J (RRID:CVCL_B5P3), an induced pluripotent stem cell line derived from a healthy male
      Northern European donor, available from the Human Induced Pluripotent Stem Cells Initiative
      (HipSci) resource, accessible to non-for-profit organizations via a simple MTA.
  - description: >-
      Treatment conditions for MDA-MB-468: untreated (DMSO control), paclitaxel-treated, and
      vorinostat-treated.
  - description: >-
      Cell states for KOLF2.1J: undifferentiated (parental) iPSCs and iPSC-derived neural progenitor
      cells (NPCs), neurons, and cardiomyocytes.
  - description: >-
      Coverage caveat stated by the release: data were derived from commercially available
      de-identified human cell lines and do not represent all biological variants which may be seen in
      the population at large.

distributions:
  - description: >-
      AP-MS protein-protein interaction data for treated MDA-MB-468 breast cancer cells, distributed
      as two ZIP archives. Files: cm4ai_apms_MDA-MB-468_paclitaxel.zip (113.3 KB, MD5
      8642317c321126213240af4837030a53, published 2026-06-17) and
      cm4ai_apms_MDA-MB-468_vorinostat.zip (135.8 KB, MD5 b941f28d6f19c563d1222f7aff0c57b6, published
      2026-06-17). Corresponding raw mass spectrometry data are linked externally at the MassIVE
      repository. The release description states "AP-MS data for MDA-MB-468 breast cancer cells +
      treatment"; these files are new in the June 2026 release.
  - description: >-
      Immunofluorescence subcellular imaging data for MDA-MB-468 cells, distributed as three ZIP
      archives and published 2026-07-15. Files: cm4ai_ifimages_MDA-MB-468_paclitaxel.zip (3.8 GB, MD5
      6c1a86520eec2696ec19444eb8a8b428), cm4ai_ifimages_MDA-MB-468_untreated.zip (4.6 GB, MD5
      6d066e6b9d762284c6aa5d0b44565568), and cm4ai_ifimages_MDA-MB-468_vorinostat.zip (4.2 GB, MD5
      df79632753989ef23b0a3df6604d4af1). Provenance caveat: the June 2026 file listing supplies no
      per-file descriptions. Descriptions for same-named files in the June 2025 and October 2025
      releases attribute the images to the Lundberg Lab at Stanford University, generated by ICC-IF
      staining and confocal microscopy, and report 464 proteins of interest; however the June 2026
      archives carry different MD5 checksums from those earlier files (e.g. paclitaxel 6c1a8652...
      versus 0d972b80... in October 2025), so those attributions and counts are inherited rather than
      stated for these specific artifacts.
  - description: >-
      Size-exclusion chromatography mass spectrometry (SEC-MS) data, distributed as two ZIP archives
      and published 2026-06-17. Files: cm4ai_mass-spec_KOLF2.zip (171.8 KB, MD5
      f250bf0b04f516f7462d30432441fc0e) and cm4ai_mass-spec_MDA-MB-468.zip (93.9 KB, MD5
      9aed30b6e8a91b151155316aae657ea5). Provenance caveat: the June 2026 file listing supplies no
      per-file descriptions. Descriptions for same-named files in the October 2025 release attribute
      SEC-MS generation to the Nevan Krogan laboratory at the University of California San Francisco
      and describe coverage of undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons and
      cardiomyocytes, and of MDA-MB-468 cells with and without vorinostat or paclitaxel treatment; the
      June 2026 archives carry different MD5 checksums from those files (f250bf0b... versus
      fb04933a...; 9aed30b6... versus 662d62ce...), so the attribution and scope are inherited rather
      than stated for these specific artifacts. The June 2026 release description does state that the
      release includes SEC-MS data for those cell systems. Corresponding raw mass spectrometry data
      are linked externally at MassIVE.
  - description: >-
      CRISPRi Perturb-seq data for KOLF2.1J human induced pluripotent stem cells, distributed as two
      ZIP archives and published 2026-06-17. Files: cm4ai_perturb-seq_KOLF2_cell_atlas.zip (30.2 KB,
      MD5 291a362842a176a4fcccaf2cdc1dedde) and cm4ai_perturb-seq_KOLF2_raw_sra.zip (73.3 KB, MD5
      8bb3f365f01fb8bbbd2ac6a535059305). Provenance caveat: the June 2026 file listing supplies no
      per-file descriptions. Descriptions for same-named files in the October 2025 release
      characterize the first as an expressed genome-scale CRISPRi Perturbation Cell Atlas mapping
      transcriptional and fitness phenotypes associated with 11,739 targeted genes and the second as
      raw sequence data from that atlas; the June 2026 archives carry different MD5 checksums
      (291a3628... versus 15dc5931...; 8bb3f365... versus 1cfc4e8e...), so these characterizations are
      inherited rather than stated for these specific artifacts. Perturb-seq datasets in KOLF2.1J
      iPSCs and in MDA-MB-468 cells are listed as embargoed at external repositories in the June 2026
      release, with the CRISPRi Perturbation Atlas of iPSCs linked at Figshare.
  - description: >-
      Release metadata package: cm4ai_release_metadata.zip (1.1 MB, MD5
      318deb7c5edab0d2fa55e26fcb67b440, published 2026-06-17). Earlier releases exposed equivalent
      content as separate artifacts, including release-ro-crate-metadata.json (RO-Crate with pointers
      to sub RO-Crates), release-ro-crate-datasheet.html (HTML datasheet summarizing key release
      information), and per-subdataset provenance graph HTML files.

