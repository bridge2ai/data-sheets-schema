id: https://doi.org/10.18130/V3/HIGT4C
name: Cell Maps for Artificial Intelligence (CM4AI) Data Release
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation Project of
  the U.S. National Institutes of Health Bridge2AI program. This record describes the CM4AI quarterly
  data release series deposited in the University of Virginia Dataverse, anchored on the current
  release, "Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)" (DOI
  10.18130/V3/HIGT4C, version 2.0, publication date 2026-06-17; version 2 released 2026-07-15). CM4AI
  generates multi-modal data including protein-protein interaction (PPI), spatial localization, and
  genetic perturbation data in MDA-MB-468 breast cancer cells (+/- paclitaxel or vorinostat) and iPSCs
  (+/- differentiation). The June 2026 Beta release includes Perturb-seq data for MDA-MB-468 breast
  cancer cells +/- treatment and undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for
  MDA-MB-468 breast cancer cells +/- treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived
  neuron progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer
  cells + treatment; and immunofluorescence (IF) images in MDA-MB-468 breast cancer cells +/-
  treatment. CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready
  datasets in RO-Crate format using the FAIRSCAPE framework. Computed cell maps are not included in
  this release. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham,
  Simon Fraser University, and the Hastings Center. Scope note: identifier, version, dates, file
  inventory, checksums and sizes in this record describe the June 2026 deposit specifically, whereas
  distribution_dates, version_access and errata describe the release series as a whole.
