id: https://doi.org/10.60775/fairhub.3
name: AI-READI Flagship Dataset of Type 2 Diabetes
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset collected from individuals with and without type 2 diabetes
  mellitus (T2DM), harmonized across three data collection sites (University of Alabama at
  Birmingham, University of California San Diego, and University of Washington). Version 3.0.0
  contains data from 2,280 participants collected between July 19, 2023 and May 1, 2025 and
  comprises 356,343 files totalling approximately 3.82 TB. Data modalities include survey data,
  physical measurements, clinical laboratory data (blood and urine), 12-lead electrocardiography,
  retinal photography, optical coherence tomography (OCT), optical coherence tomography
  angiography (OCTA), fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous glucose
  monitoring, wearable activity monitoring, and indoor environmental sensor measurements. The
  public release contains no protected health information (PHI); information related to sex,
  race/ethnicity, and medications used has also been removed. The scientific goal is to enable
  artificial intelligence and machine learning research into salutogenesis (the pathway from
  disease to health) in T2DM. The dataset carries an alternative title, "AI-READI dataset".
