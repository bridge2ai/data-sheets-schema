status: >-
  The FAIRhub study metadata records an overall status of "Enrolling by invitation", with an actual
  start date of 2023-07-19 and an anticipated completion date of 2027-01-01. Version 3.0.0 of the
  dataset was published on 2025-11-17. Enrollment is ongoing and further dataset versions are
  expected.
