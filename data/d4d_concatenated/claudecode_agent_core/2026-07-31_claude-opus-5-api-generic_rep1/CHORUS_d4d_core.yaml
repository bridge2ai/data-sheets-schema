id: https://chorus4ai.org/dataset
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multi-center, multi-modal, high-resolution critical care dataset generated by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH Common Fund's Bridge2AI consortium
  (award OT2OD032701). The project aims to develop a publicly available, AI-ready critical care
  dataset characterizing acute and critical care illness, predicting complications, and measuring
  treatment response, drawn from critically ill patients across a network of contributing hospitals.
  Data are collected retrospectively and made available under controlled access. The anticipated
  final dataset is described on the project website as covering 100,000 patient admissions, 9
  different data modalities, and 14 data contributing hospitals, assembled by 60+ CHoRUS consortium
  members across 20 different institutions. The website describes the currently released dataset as
  50,000 patient admissions from ICU, PICU, and NICU; 1.6 billion rows of EHR OMOP data; 7,642
  admissions with radiology data; and 23 Tb of waveform data. A separate program webinar states that,
  as of August 2025, the dataset covered 14 different hospitals with over 45K unique admissions.
  Modalities include structured electronic health record data standardized to the OMOP Common Data
  Model (demographics, medication administration, procedures, nursing flowsheets, diagnoses),
  clinical notes extracted and tokenized with the OHNLP toolkit, imaging from PACS in DICOM,
  waveform telemetry from bedside monitors and gateway/middleware in WFDB, waveform EEG from
  hospital databases in EDF+ and Persyst formats, and social determinants of health. The project
  also sequesters holdout datasets for external model validation.
keywords:
  - critical care
  - intensive care
  - acute illness
  - artificial intelligence
  - machine learning
  - AI-ready dataset
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - Bridge2AI
  - multi-center
  - multimodal
  - controlled access
page: https://chorus4ai.org/
status: >-
  Actively under development within a funded project period running 2022-09-01 to 2026-11-30, with a
  partial dataset already released under controlled access and additional modalities (imaging, EEG,
  clinical note tokens) still in extraction or de-identification. The project website carries the
  notice, quoted verbatim including its typographical error: "This repoitory is under review for
  potential modification in compliance with Administration directives."
created_by: >-
  The CHoRUS Network, a Bridge2AI data generation project spanning 20 academic centers, of which 14
  contribute as Data Acquisition centers.
conforms_to: >-
  OMOP Common Data Model (OHDSI) for structured EHR data; additional modality standards are DICOM
  for imaging, WFDB for waveform telemetry, EDF+ and Persyst for EEG, and the OHNLP open source
  schema for tokenized clinical notes.
is_tabular: false

creators:
  - description: >-
      Eric S. Rosenthal, Massachusetts General Hospital; principal investigator of NIH project
      1OT2OD032701-01 and member of the Bridge2AI CHoRUS leadership team.
  - description: >-
      Azra Bihorac, University of Florida; member of the Bridge2AI CHoRUS leadership team.
  - description: >-
      Xiaoqian Jiang, UTHealth Houston; member of the Bridge2AI CHoRUS leadership team.
  - description: >-
      Yulia Strekalova, University of Florida; member of the Bridge2AI CHoRUS leadership team.
  - description: >-
      Parisa Rashidi, University of Florida; member of the Bridge2AI CHoRUS leadership team.
  - description: >-
      Manlik Kwong, Tufts University; member of the Bridge2AI CHoRUS leadership team.
  - description: >-
      The CHoRUS consortium, comprising 60+ members across 20 different institutions, with 14
      hospitals contributing data.

funders:
  - description: >-
      United States National Institutes of Health, NIH Common Fund Bridge2AI program. Core project
      number OT2OD032701; project number 1OT2OD032701-01; application ID 10472824; awardee
      organization Massachusetts General Hospital; fiscal year 2022 award amount 5,880,300 USD;
      project period 2022-09-01 to 2026-11-30. The project website states that the content is solely
      the responsibility of the authors and does not necessarily represent the official views of
      the NIH.

purposes:
  - description: >-
      To meet an urgent need for infrastructure supporting artificial intelligence and machine
      learning in critical care by generating data for ML/AI applications aimed at characterizing
      acute and critical care illness, predicting complications, and measuring treatment response
      among patients with acute or critical illness.
  - description: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring the methods
      promote privacy, accountability, and clinical benefit.
  - description: >-
      To provision a holdout test set accessible for external model validation, in order to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - description: >-
      To create ethically sourced datasets and tools around artificial intelligence and to create
      best practices for AI in health, as one of four data generation projects in the NIH-funded
      Bridge2AI consortium.
  - description: >-
      To develop the network, tools, standards, data, and education needed to build ML/AI-derived
      models that improve the care and outcomes of patients requiring critical care, and to promote
      a new generation of AI clinicians and scientists.

addressing_gaps:
  - description: >-
      Lack of high-resolution, multi-center data sets in critical care, described in the project
      abstract as a critical first step towards actionable and trustworthy AI.
  - description: >-
      Absence of a diverse, high-resolution, ethically sourced, AI-ready data set to answer the
      grand challenge of improving recovery from acute illness.
  - description: >-
      Absence of an established legal framework for collecting critical care data at scale and of
      community-informed determinations of what data is appropriate for public sharing.
  - description: >-
      Absence of sequestered holdout datasets that permit external validation of clinical AI models.
  - description: >-
      Limited AI literacy and workforce capacity in the lay and scientific clinical care community.

tasks:
  - description: >-
      Characterizing acute and critical care illness from multi-modal hospital data.
  - description: >-
      Predicting complications and clinical deterioration among patients with acute or critical
      illness.
  - description: >-
      Measuring treatment response in acute and critical care patients.
  - description: >-
      External validation of AI/ML models using the sequestered holdout test set.
  - description: >-
      Labeling data with prediction targets via a visualization and annotation environment.

instances:
  - description: >-
      Instances are hospital patient admissions of critically ill patients, including admissions to
      ICU, PICU, and NICU. Each admission is associated with multiple linked data modalities:
      OMOP-standardized demographics, medication administration records time-stamped at each
      infusion change or dose administration, procedures documented by providers, high-frequency
      nursing flowsheet documentation, diagnoses documented by providers, tokenized clinical notes,
      DICOM imaging from PACS, WFDB waveform telemetry from bedside monitors and
      gateway/middleware, and EDF+/Persyst waveform EEG from hospital databases.
  - description: >-
      Row-level structured EHR records within the OMOP Common Data Model; the project website
      reports 1.6 billion rows of EHR OMOP data in the currently released dataset.
  - description: >-
      Imaging studies; the website reports 7,642 admissions with radiology data, while the
      September 2025 program webinar states that 1000 images were currently available with
      de-identification in process for a larger cohort.
  - description: >-
      Waveform recordings; the website reports 23 Tb of waveform data.

resources:
  - id: https://chorus4ai.org/dataset/holdout-test-set
    description: >-
      A sequestered holdout test set provisioned by the project and accessible for external model
      validation, intended to aid marketplace adoption of AI-developed models.
  - id: https://chorus4ai.org/dataset/omop-structured-ehr
    description: >-
      Structured electronic health record data standardized to the OMOP Common Data Model, covering
      demographics, medication administration, procedures, nursing flowsheets, and diagnoses. Held
      in the cloud enclave under controlled access with published OMOP schema metadata.
  - id: https://chorus4ai.org/dataset/clinical-notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit. Notes are stored locally at
      contributing sites except for tokens; access is controlled and metadata is planned, with an
      OHNLP open source schema.
  - id: https://chorus4ai.org/dataset/imaging
    description: >-
      Imaging drawn from hospital PACS systems in DICOM format under controlled access, with the
      DICOM schema as published metadata schema and metadata marked planned as of the September
      2025 webinar.
  - id: https://chorus4ai.org/dataset/waveform-telemetry
    description: >-
      Waveform telemetry from bedside monitors and gateway/middleware in WFDB format, held in the
      enclave under controlled access, with a PhysioNet schema extension as the published metadata
      schema.
  - id: https://chorus4ai.org/dataset/waveform-eeg
    description: >-
      Waveform EEG drawn from hospital databases in EDF+ and Persyst formats under controlled
      access; extraction was in process as of the September 2025 webinar and metadata is planned.

subpopulations:
  - description: >-
      Patients admitted to adult intensive care units, pediatric intensive care units (PICU), and
      neonatal intensive care units (NICU); the project website attributes the 50,000 currently
      released patient admissions to these three settings.
  - description: >-
      The project states an aim to acquire a dataset of unprecedented diversity, to use federated
      access and sampling methods to ensure a balanced and diverse cohort, and to sample so as to
      ensure comprehensive sets of patient conditions and clinical treatment strategies.
  - description: >-
      Patient-focused efforts are described as determining ethical and legal approaches to manage
      privacy and bias while accounting for Social Determinants of Health.

sensitive_elements:
  - description: >-
      The dataset is derived from hospital electronic health records of critically ill patients and
      therefore comprises health information, including demographics, diagnoses, procedures,
      medication administration, nursing flowsheets, clinical notes, imaging, telemetry waveforms,
      and EEG.
  - description: >-
      Social determinants of health and contextual factors such as geographic distance to the
      nearest hospital are included as data elements; the CHoRUS GitHub organization includes a
      UF-Geocoding repository (forked from bihorac-LAB/Exposome) for geocoding OMOP Location
      entities via DeGauss.
  - description: >-
      Free-text clinical notes, which are stored locally at contributing sites rather than in the
      shared enclave, with only tokens shared.

confidential_elements:
  - description: >-
      All listed data types (demographics, medication administration, procedures, nursing
      flowsheets, diagnoses, clinical notes, imaging, waveform telemetry, waveform EEG) are marked
      as controlled access in the September 2025 program webinar.
  - description: >-
      Clinical notes are not released in full: they are stored locally at the contributing sites,
      and only tokens extracted with the OHNLP toolkit are shared.
  - description: >-
      Community-facing ethics focus groups are being conducted to determine what data is
      appropriate for public sharing.

is_deidentified:
  description: >-
    The project states that it transforms data using approaches that limit re-identification and
    tokenizes unstructured electronic health record data. Imaging was reported in September 2025 as
    having 1000 images available with de-identification in process for a larger cohort. The CHoRUS
    GitHub organization hosts a CTP-deid repository and a privacy_scan_tool described as a privacy
    scan tool for medical records. The bundle does not state a formal de-identification standard,
    certification, or residual re-identification risk assessment.

acquisition_methods:
  - description: >-
      Retrospective data collection from the clinical systems of participating hospitals, as stated
      in the September 2025 program webinar.
  - description: >-
      Directly observed clinical data captured during routine care and extracted from source
      systems: bedside monitors and gateway/middleware for telemetry waveforms, hospital EEG
      databases, PACS for imaging, and the electronic health record for structured data and notes.
  - description: >-
      Data contributing sites create and submit a CHoRUS-specific clinical data extract following
      standard operating protocols documented in the Chorus_SOP repository, with an interactive
      workflow diagram describing the step-by-step process for extracting and contributing clinical
      data to CHoRUS.

collection_mechanisms:
  - description: >-
      Bedside physiological monitors with gateway/middleware systems, used to capture waveform
      telemetry in WFDB format.
  - description: >-
      Hospital EEG databases, used to capture waveform EEG exported in EDF+ and Persyst formats.
  - description: >-
      Hospital PACS systems, used to capture imaging in DICOM format.
  - description: >-
      Hospital electronic health record systems, providing demographics, medication administration
      (time-stamped upon each infusion change or dose administration), provider-documented
      procedures and diagnoses, high-frequency nursing flowsheet documentation, and clinical notes.
  - description: >-
      Software tooling developed by the CHoRUS Network, including chorus-extract-upload (tools to
      create and upload a CHoRUS Data Extract) and chorus-container-apps (dockerized container
      applications deployed to support CHoRUS services on Azure).

collection_timeframes:
  - description: >-
      The funded project period runs from 2022-09-01 to 2026-11-30. Data collection is
      retrospective. As of August 2025 the dataset covered 14 different hospitals with over 45K
      unique admissions. The bundle does not state the calendar range of the patient encounters
      themselves.

data_collectors:
  - description: >-
      Fourteen data acquisition centers within the CHoRUS Network contribute clinical data extracts;
      the network as a whole spans 20 academic centers with 60+ consortium members.
  - description: >-
      Data site managers at contributing sites are responsible for extracting and submitting data
      following validated standard operating protocols, and provide regular status updates on their
      progress in creating and curating a CHoRUS-specific clinical data extract.
  - description: >-
      Clinical collaborators contribute clinical expertise to semantic mapping and validation,
      following a clinical validation SOP in the chorus-mapping repository.

sampling_strategies:
  - description: >-
      The project states it will establish a legal framework for collecting data at scale, sampling
      to ensure comprehensive sets of patient conditions and clinical treatment strategies.
  - description: >-
      Federated access is intended to enable sampling methods that ensure a balanced and diverse
      cohort.

raw_sources:
  - description: >-
      Source-format clinical data held in the systems of 14 contributing hospitals prior to
      harmonization: native EHR tables, free-text notes, PACS image archives, bedside monitor and
      middleware waveform streams, and hospital EEG database exports.

raw_data_sources:
  - source_description: >-
      Structured electronic health record data from 14 contributing hospitals, subsequently
      standardized to the OMOP Common Data Model.
  - source_description: >-
      Unstructured clinical notes from hospital electronic health records, subsequently extracted
      and tokenized using the OHNLP toolkit; source notes remain stored locally at contributing
      sites.
  - source_description: >-
      Imaging retrieved from hospital PACS systems and delivered in DICOM format.
  - source_description: >-
      Waveform telemetry captured from bedside monitors via gateway/middleware and converted to
      WFDB format.
  - source_description: >-
      Waveform EEG retrieved from hospital EEG databases in EDF+ and Persyst formats.
  - source_description: >-
      Social determinants of health and contextual geographic factors, such as distance to the
      nearest hospital, associated with patient records.

preprocessing_strategies:
  - description: >-
      Standardization of acquired data to the OMOP Common Data Model, with OMOP schema extensions
      used for nursing flowsheet data.
  - description: >-
      Tokenization of unstructured electronic health record text using the OHNLP toolkit, so that
      only tokens rather than full notes leave the contributing site.
  - description: >-
      Transformation of data using approaches that limit re-identification.
  - description: >-
      Conversion of waveform data to WFDB, supported by the chorus_waveform repository of waveform
      documentation and conversion scripts and the chorus_waveform_resources repository.
  - description: >-
      Validated semantic mappings connecting clinical data in various source formats to
      international standards, pooled as tabular mappings in the chorus-mapping repository and
      subject to clinical validation.

labeling_strategies:
  - description: >-
      A visualization and annotation environment is used to label data with targets important for
      prediction, developed as part of the project's capabilities to acquire, standardize, tokenize,
      store, visualize, and label data across a multi-center network.

machine_annotation_tools:
  - description: >-
      OHNLP toolkit, used to automatically extract and tokenize clinical notes; the resulting data
      conform to the OHNLP open source schema.

ethical_reviews:
  - description: >-
      Ethics is one of three project pillars ("Ethical and Trustworthy AI"). The project performs
      community-facing ethics focus groups to determine what data is appropriate for public sharing,
      establishes a legal framework for collecting data at scale, and analyzes the existing legal
      and regulatory landscape to develop new approaches. The CHoRUS consortium evaluates community
      perspectives on clinical care AI to find ways to increase trustworthiness of provenance and
      privacy in AI. The bundle does not report a specific IRB protocol number or approving
      institutional review board for the dataset.

human_subject_research:
  description: >-
    The dataset is derived retrospectively from the hospital records of critically ill patients at
    contributing hospitals. The NIH project abstract frames acquisition from more than 100,000
    critically ill patients as the project's target; the project website lists 100,000 patient
    admissions under "Anticipated Final Dataset" and 50,000 patient admissions from ICU, PICU, and
    NICU as the currently released dataset, while the September 2025 program webinar reports over
    45K unique admissions as of August 2025. The project describes legal and ethical research to
    establish a framework for collecting these data at scale and to manage privacy and bias. The
    bundle does not state whether individual patient consent was obtained, whether a waiver of
    consent applied, or which review bodies granted approval.

at_risk_populations:
  description: >-
    The currently released dataset is described by the project website as comprising patient
    admissions from ICU, PICU, and NICU, so it includes minors and neonates among critically ill
    patients, who are themselves an at-risk population by virtue of acute illness and incapacity.
    The project describes patient-focused ethical and legal work to determine approaches for
    managing privacy and bias, community-facing ethics focus groups to determine what data is
    appropriate for public sharing, controlled access to all data types, local retention of
    clinical notes, and transformations that limit re-identification. The bundle does not describe
    any population-specific safeguards, assent procedures, or additional protections directed
    specifically at minors, neonates, or other legally protected groups.

license_and_use_terms:
  description: >-
    Access to the CHoRUS dataset is controlled. Participants in the AIM-AHEAD Bridge2AI for Clinical
    Care Training Program must complete a registration form providing name, email, and institution,
    and all participants must sign a licensing agreement included in the registration form before
    gaining access to the dataset. A ".edu" email address is required to gain access to the dataset,
    though program administrators will assist with this access if needed and the requirement is
    stated not to be a barrier to acceptance into the program. Access is granted and compute
    provisioned by email notification. The project's stated goal is a publicly available, AI-ready
    critical care dataset. The bundle does not name a specific data license identifier.

ip_restrictions:
  description: >-
    The CHoRUS GitHub organization states that its project code is licensed under the MIT License,
    with individual repositories carrying MIT or Apache-2.0 licenses. This applies to the software
    and documentation, not to the clinical dataset, which is governed by a separate licensing
    agreement and controlled access.

distribution_formats:
  - description: >-
      OMOP Common Data Model tables for demographics, medication administration, procedures, nursing
      flowsheets (OMOP schema with extensions), and diagnoses.
  - description: >-
      OHNLP open source schema for extracted and tokenized clinical notes.
  - description: >-
      DICOM for imaging from PACS.
  - description: >-
      WFDB for waveform telemetry, documented against an extended PhysioNet schema.
  - description: >-
      EDF+ and Persyst for waveform EEG.
  - description: >-
      Delivery is through a controlled-access cloud enclave; OMOP and telemetry data reside in the
      enclave, while clinical notes are stored locally at sites except for tokens. Container
      applications supporting CHoRUS services are deployed on Azure.

distribution_dates:
  - description: >-
      A partial dataset had been released and was in use for training activities and publications as
      of the September 2025 program webinar, which reported coverage as of August 2025. The project
      website describes a "Current Released Dataset" alongside an "Anticipated Final Dataset". The
      funded project period ends 2026-11-30. The bundle does not give a formal release date or
      version release schedule.

intended_uses:
  - description: >-
      Development of machine learning and artificial intelligence models to improve the care and
      outcomes of patients requiring critical care, including characterization of acute and critical
      care illness, prediction of complications, and measurement of treatment response.
  - description: >-
      External validation of AI models against the sequestered holdout test set to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - description: >-
      Hands-on AI/ML training and education, including canonical Jupyter Notebooks, workshops on the
      OHDSI tool stack and the OHDSI/OMOP common data model, and instruction in creating practical
      use cases on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
  - description: >-
      Collaborative research on the Bridge2AI Clinical Care Cloud platform, culminating in poster
      presentations, conference abstracts, and peer-reviewed manuscripts.

existing_uses:
  - description: >-
      As of the September 2025 webinar, the datasets were reported as being used for training
      activities and publications.
  - description: >-
      Use within the AIM-AHEAD Bridge2AI for Clinical Care Training Program, whose Cohort 2 ran from
      a program start date of 2025-11-17 to a program end date of 2026-07-31, with trainees applying
      AI/ML methods to big data analysis using multi-modal datasets from a broad range of cohort
      participants.

other_tasks:
  - description: >-
      Research on social determinants of health and contextual factors such as geographic distance
      to the nearest hospital.
  - description: >-
      Development and evaluation of standards, semantic mappings, and interoperability practices for
      multi-modal clinical data.
  - description: >-
      Downstream analytics on the mapped and assembled dataset, for which the CHoRUS GitHub
      organization invites interested collaborators to make contact.

future_use_impacts:
  - description: >-
      The project anticipates that the dataset will catalyze biomedical research and expertise
      necessary to promote the patient-focused deployment of AI in acute and critical care, and will
      support a new generation of diverse academic and community AI scientists.
  - description: >-
      Because the data concern critically ill patients and include social determinants of health,
      patient-focused efforts are directed at ethical and legal approaches to manage privacy and
      bias; users are expected to address concerns such as privacy in the responsible application of
      AI/ML.
  - description: >-
      The project website carries a notice that the repository is under review for potential
      modification in compliance with Administration directives, indicating that future availability
      or content may change.

known_biases:
  - description: >-
      Managing bias is an explicit project concern: patient-focused efforts are stated to determine
      the ethical and legal approaches to manage privacy and bias while accounting for Social
      Determinants of Health, and federated access with sampling methods is intended to ensure a
      balanced and diverse cohort. The bundle does not quantify residual demographic or site
      imbalance in the released data.
  - description: >-
      The dataset is drawn from 14 contributing hospitals within a network of 20 academic centers,
      so representation is limited to the case mix and practice patterns of those institutions.

known_limitations:
  - description: >-
      The dataset was incomplete at the time of the source documents. As of the September 2025
      webinar, imaging had only 1000 images available with de-identification in process for a larger
      cohort, EEG extraction was in process, and metadata for clinical notes, imaging, and EEG was
      listed as planned rather than published.
  - description: >-
      Clinical notes are not distributed in full; they remain stored locally at contributing sites
      and only tokens extracted with the OHNLP toolkit are shared.
  - description: >-
      Reported scale differs across sources within the bundle: the project website reports 50,000
      released patient admissions and an anticipated 100,000, while the September 2025 webinar
      reports over 45K unique admissions as of August 2025. The NIH project abstract refers to more
      than 100,000 critically ill patients as the acquisition target.
  - description: >-
      Access is controlled and conditioned on registration, a signed licensing agreement, and, for
      the training program, a ".edu" email address, which limits open reuse.
  - description: >-
      Data collection is retrospective, so the dataset reflects documentation practices in routine
      care rather than a protocol-driven prospective collection.

maintainers:
  - description: >-
      Massachusetts General Hospital is the awardee organization; Eric S. Rosenthal is the principal
      investigator.
  - description: >-
      Ciera McCrary, MGH, Program Manager, cmccrary@mgh.havard.edu, listed as the project website
      contact.
  - description: >-
      Data access requests are handled by dbold@emory.edu and jared.houghtaling@tuftsmedicine.org.
  - description: >-
      The chorus-ai GitHub organization (37 followers, 28 repositories, United States of America)
      maintains software, semantic mappings, standard operating protocols, and project management
      resources; a package status page lists versions, maintainers, and other metadata about CHoRUS
      packages.

updates:
  description: >-
    The dataset is growing during the funded project period, which ends 2026-11-30. The project
    website distinguishes a currently released dataset from an anticipated final dataset of 100,000
    patient admissions, 9 data modalities, and 14 contributing hospitals. Imaging de-identification
    and EEG extraction were in process as of September 2025, and metadata schemas for several
    modalities were planned. Data contributing sites provide regular status updates on their
    progress, tracked through GitHub projects for Standards and Data Acquisition; a Google Form
    submission triggers a GoogleScript that calls the GitHub API to update status and issue
    information. Characterization reports are produced by the CHoRUSReports repository and returned
    to sites following their data submissions.

extension_mechanism:
  description: >-
    Contribution is organized through the chorus-ai GitHub organization. Data site managers follow
    the interactive workflow and validated SOP documents in the Chorus_SOP repository and may raise
    problems in the Standards Discussions or Data Acquisition Discussions. Clinical collaborators
    can contribute to semantic mapping through the chorus-mapping repository and its associated
    clinical validation SOP. Software developers are supported by a web guide compiled in the
    chorus-developer repository. Issues from various repositories are aggregated into a central task
    management project where users are assigned to tasks, delivery dates tracked, and dependencies
    highlighted.

external_resources:
  - description: >-
      Project website: https://chorus4ai.org/ , with pages for Team, Project Overview, Tools, Data
      Acquisition, Standards, Community Engagement, Ethics, Dataset, and Learning Resources &
      Opportunities.
  - description: >-
      Bridge2AI project page: www.bridge2ai.org/chorus
  - description: >-
      NIH RePORTER project record: https://reporter.nih.gov/project-details/10472824
  - description: >-
      CHoRUS GitHub organization: https://github.com/chorus-ai , including chorus-container-apps,
      privacy_scan_tool, chorus_waveform, chorus_waveform_resources, Chorus_SOP, data_acq_SOP, CADA,
      CTP-deid, UF-Geocoding, CHoRUSReports, cloud_public, chorus-extract-upload, and
      chorus-apps-internal.
  - description: >-
      AIM-AHEAD Bridge2AI for Clinical Care Training Program Cohort 2 informational webinar
      (2025-09-09): https://www.aim-ahead.net/media/jnzdnid3/bridge2ai-for-clinical-care-informational-webinar-cohort-2.pdf