license_and_use_terms:
  data_use_permission:
    - disease_specific_research
  license_terms:
    - >-
      The dataset is released under a custom AI-READI licence (v2.0 for this release, recorded at
      https://doi.org/10.5281/zenodo.17555036; v1.0 of the licence, a University of Washington Data
      License Agreement, is archived at https://doi.org/10.5281/zenodo.10642459). The licence grants a
      non-exclusive, non-transferable licence to download, reproduce, and use the data and to create
      derivative works for research and commercial purposes. It forbids conveying any portion of the
      data or derivative works to third parties who are not licensees under identical terms; permits
      distribution of models, algorithms, and programs trained on the data provided they do not contain
      the data and that reasonable efforts are made to minimise memorization or reconstruction; forbids
      clinical treatment decisions and any attempt to re-identify or contact data subjects; requires
      compliance with the NIH Genomic Data Sharing Policy security best practices; requires
      acknowledgement of the source and funder in publications; provides the data on an as-is basis
      without warranty; caps licensor liability at one US dollar; and terminates automatically on breach,
      requiring deletion of all copies. Accessing the dataset additionally requires logging in through a
      verified ID system and agreeing to use the data only for type 2 diabetes related research. The full
      dataset, including sensitive variables, is accessible only by entering into a data use agreement.
      Note that the FAIRhub landing page names the licence "Health Data License" while the FAIRhub
      structured metadata names it "AI-READI custom license v2.0".
  contact_person: AI-READI project contact, contact@aireadi.org, https://aireadi.org/contact

ip_restrictions:
  restrictions:
    - Title to the data and all industrial and intellectual property rights therein remain solely and
      exclusively with the licensor (University of Washington) and its suppliers; any rights not
      expressly granted are reserved.
    - Licensees may not take any action inconsistent with the licensor's ownership of the data.
    - Licensees may not transfer, license, sublicense, sell, assign, display, share, or otherwise
      convey any portion of the data or any derivative work to a third party that is not another
      licensee bound by identical terms.
    - Models, algorithms, and programs developed, trained, or adapted using the data may be made,
      reproduced, and distributed provided they do not themselves contain the data or a modified
      version of it.
    - Licensees agree to indemnify and hold harmless the licensor and its suppliers against claims
      arising from their use of the data or from the use, distribution, or activity of a model.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - Licensees must comply with all data security and privacy standards established by the US
      National Institutes of Health under its Genomic Data Sharing (GDS) Policy, currently the NIH
      Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
    - Licensees must comply with all applicable laws, regulations, and restrictions relating to the
      distribution and use of the data and of models trained on it.
  other_compliance:
    - >-
      The public release is stripped of Protected Health Information as defined by the HIPAA Privacy
      Rule using the Safe Harbor method, and the team verified that no data identifiable under US HIPAA
      are present. Public download requires login through a verified ID system plus self-attestation
      (FAIRhub access type PublicDownloadSelfAttestationRequired); the controlled access tier requires
      institutional legal and privacy use agreements.
  governance_committee_contact: >-
    AI-READI Data Access Committee, which is developing the requirements for the controlled access
    dataset; general contact contact@aireadi.org.

maintainers:
  - role: academic_institution
    maintainer_details:
      - >-
        The AI-READI team supports and maintains the dataset. Contact information is provided in the
        README file included with the dataset and via https://aireadi.org/contact and
        contact@aireadi.org. Aaron Y. Lee is recorded as the responsible party and study principal
        investigator (ORCID 0000-0002-7452-1648).
  - role: other
    maintainer_details:
      - >-
        FAIRhub, the cloud-based data management, curation, and sharing platform developed for the
        project, hosts the dataset on Microsoft Azure and is the recorded publisher of the release.
        The Microsoft AI for Good Lab supported the cloud services needed for the project.

updates:
  frequency: Approximately annually
  update_details:
    - >-
      The dataset is released as static versions and is not updated in place. Rather than correcting or
      amending an existing release, new versions are published with additional instances as more study
      participants complete the study visit. Released versions to date are v1.0.0 (3 May 2024, 204
      participants, pilot data), v2.0.0 (8 November 2024, 1067 participants), and v3.0.0 (17 November
      2025, 2280 participants). Further versions are expected while enrollment continues. Changes
      between versions are documented in detail in the CHANGELOG file included in the dataset and
      visible at docs.aireadi.org.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024
    - 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024
    - 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025
  version_details:
    - >-
      Each version has its own DOI and its own documentation set, selectable from the version dropdown
      at docs.aireadi.org. The FAIRhub record for version 2.0.0 states that that version of the dataset
      is no longer accessible and directs users to the latest version, while its documentation remains
      online. A separate FAIRhub record (DOI 10.60775/fairhub.4) provides a smaller mini version of the
      dataset for pipeline development, described in the source material as a distinct resource rather
      than a version of this dataset.

retention_limit:
  retention_details:
    - >-
      There are no limits on the retention of the data associated with the instances; participants were
      not told that their data would be retained for a fixed period and then deleted.

