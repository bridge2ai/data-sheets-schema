        states that enrolment will continue until 30 November 2026.
  - start_date: '2022-09-01'
    end_date: '2025-08-31'
    timeframe_details:
      - >-
        Project period of NIH award OT2OD032644 as recorded in NIH RePORTER for application 10471118.

preprocessing_strategies:
  - preprocessing_details:
      - >-
        Clinical and survey data collected in REDCap were mapped to the Observational Medical Outcomes
        Partnership (OMOP) Common Data Model, with each CSV file in the clinical_data directory
        corresponding one-to-one to an OMOP CDM table.
  - preprocessing_details:
      - >-
        Retinal images were exported from the devices in raw format and converted to DICOM where
        necessary - Topcon Maestro2 and Triton images were exported as .fda and converted to DICOM, and
        Heidelberg FLIO images were exported as .sdt and converted to DICOM. Spectralis, Cirrus, EIDON,
        and Optomed images were exported directly as DICOM.
  - preprocessing_details:
      - >-
        Electrocardiograms were exported from the Philips PageWriter TC30 as .xml and converted to the
        WaveForm DataBase (WFDB) format.
  - preprocessing_details:
      - >-
        Garmin Vivosmart 5 activity data were exported in .FIT format and converted to the Open mHealth
        standard; Dexcom G6 continuous glucose data were exported as .csv and converted to Open mHealth.
  - preprocessing_details:
      - >-
        Environmental sensor data were formatted following the NASA ASCII File Format Guidelines for
        Earth Science Data.
  - preprocessing_details:
      - >-
        The dataset was organized according to the Clinical Dataset Structure (CDS) v0.1.1
        specification - one directory per datatype at the root, then modality, then device, then
        participant - with per-datatype manifest.tsv files and root-level metadata files
        (dataset_description.json, dataset_structure_description.json, study_description.json,
        participants.tsv, participants.json, healthsheet.md, README.md, CHANGELOG.md, LICENSE.txt).
  - preprocessing_details:
      - >-
        Protected Health Information was removed from the public release using the HIPAA Safe Harbor
        method, and information on sex, race/ethnicity, and medications was additionally removed. In
        version 3.0.0 the Snellen visual acuity variables were dropped so that only logMAR visual acuity
        measurements are available.
  - preprocessing_details:
      - >-
        Processing for this release used a combination of automated and custom pipelines, in contrast to
        the custom and ad hoc processing used for version 1.0.0.

cleaning_strategies:
  - cleaning_details:
      - >-
        Quality control at the time of data entry - clinical values outside expected minimum and maximum
        ranges were flagged in REDCap and appeared in reports reviewed by clinical research coordinators
        and Data Managers, who examined participant records to determine whether an error was likely.
  - cleaning_details:
      - >-
        Data were checked and edited where errors were detected for credibility (range checks), incorrect
        flow through prescribed skip patterns, missing data that could be filled directly from other
        portions of an individual's record, and the omission or duplication of records. Editing was done
        only under the guidance and approval of the site principal investigator; where there was no
        logical or appropriate way to correct a value, the site PI decided whether it should be removed.
  - cleaning_details:
      - >-
        Internal review by AI-READI team members for quality checks and to ensure that no personally
        identifiable information was accidentally included. The dataset has not undergone any formal
        external audit.

missing_data_documentation:
  - missing_data_patterns:
      - Modality-level absence, where a participant has no data for one or more of the collected
        modalities
      - Item-level absence in survey data from skipped questions and incomplete responses
      - Variable-level removal, with the Snellen visual acuity variables dropped in version 3.0.0 so
        that only logMAR measurements remain
      - Removal of sex, race/ethnicity, and medication variables from the public release
    missing_data_causes:
      - Participants elected not to participate in some study elements
      - The data collection device had no stored results, for example after battery failure
      - The device was returned too late for results to be retrieved
      - A data collision occurred at some point in the processing chain and data were lost
      - Imaging was skipped or degraded because of quality issues, participant non-cooperation, system
        malfunction, or data transfer failure
    handling_strategy: >-
      Missing values are left absent and no imputation is performed. During cleaning, missing data
      that could be filled directly from other portions of an individual's record were filled, and
      any such edits required site principal investigator approval.
  - missing_data_patterns:
      - >-
        Not all modalities are available for all participants. Some participants elected not to take
        part in some study elements; in some cases the collection device had no stored results or was
        returned too late to retrieve results (for example battery failure or data loss); in a few
        cases a data collision during processing caused data to be lost.

raw_sources:
  - raw_data_details:
      - >-
        Raw device and system exports prior to standardisation - REDCap exports, Philips ECG .xml files,
        Topcon .fda files, Heidelberg .sdt files, Garmin .FIT files, Dexcom .csv files, and native
        device DICOM. The raw data are saved and expected to be preserved by the AI-READI project at
        least for the duration of the project, but are not currently shared outside the project team
        because they have not been mapped to standardized terminologies and may accidentally include
        protected health information or personally identifiable information, for example in free text
        fields. Raw data may be included in future releases of the controlled access dataset.

raw_data_sources:
  - source_description: >-
      Electronic health records of the three participating health systems (University of Alabama at
      Birmingham, University of California San Diego, University of Washington), screened for patients
      aged 40 and older with an encounter between 2020 and 2025 and for ICD-10 codes E11.X (type 2
      diabetes) and R73.09 (pre-diabetes).
    source_type:
      - Electronic health records
    access_details: >-
      Used to construct recruitment contact pools only; not distributed as part of the dataset. Past
      health records are among the variables held under controlled access.
  - source_description: >-
      Prospective participant-reported and coordinator-entered data captured at the study visit and
      before it.
    source_type:
      - REDCap electronic data capture system
    raw_data_format:
      - REDCap export (.csv)
  - source_description: >-
      Retinal imaging device exports from Optomed Aurora IQ, iCare EIDON, Heidelberg Spectralis,
      Heidelberg FLIO, Topcon Maestro2, Topcon Triton, and Zeiss Cirrus 5000.
    source_type:
      - Ophthalmic imaging devices
    raw_data_format:
      - DICOM native, .fda (Topcon), .sdt (Heidelberg FLIO)
  - source_description: >-
      At-home monitoring device exports from the Dexcom G6 continuous glucose monitor, the Garmin
      Vivosmart 5 activity monitor, and the LeeLab Anura environmental sensor, each worn or deployed
      for ten days.
    source_type:
      - Wearable and environmental sensor devices
    raw_data_format:
      - .csv (Dexcom, environmental sensor), .FIT (Garmin)
  - source_description: >-
      Clinical laboratory results - complete blood counts from CLIA-certified laboratories local to
      each site on fresh whole blood, and all other blood and urine assays from the University of
      Washington Nutrition and Obesity Research Center on stored frozen samples.
    source_type:
      - Clinical laboratories
    raw_data_format:
      - .csv
  - source_description: >-
      Twelve-lead electrocardiogram recordings from the Philips PageWriter TC30 Cardiograph.
    source_type:
      - Cardiography device
    raw_data_format:
      - .xml

anomalies:
  - anomaly_details:
      - >-
        Modality-level incompleteness - not all modalities are available for all participants because
        some participants elected not to participate in some study elements.
  - anomaly_details:
      - >-
        Loss of at-home monitoring data in a small number of cases because the collection device had
        no stored results, the battery died, or the device was returned too late for the data to be
        retrieved.
  - anomaly_details:
      - >-
        A small number of cases where a data collision occurred at some point in the processing chain
        and data were lost.
  - anomaly_details:
      - >-
        Survey data contain skipped questions and incomplete responses, which are expected in
        self-reported instruments.
  - anomaly_details:
      - >-
        Wearable device data may be affected by improper use, technical failure such as battery
        failure, or system malfunction.
  - anomaly_details:
      - >-
        Imaging data may be affected by participant non-cooperation, noise obscuring the image,
        system malfunction, and data transfer failures.
  - anomaly_details:
      - >-
        Undilated handheld Optomed Aurora fundus images vary in quality from participant to participant
        and within the same participant, because the participant is not dilated and the camera is
        handheld.
  - anomaly_details:
      - >-
        FLIO imaging is performed last in the visit and exposes participants to uncomfortable levels of
        light for a longer period than a standard OCT, so participant compliance and therefore image
        quality may be reduced for this modality.
  - anomaly_details:
      - >-
        Heidelberg Spectralis acquisition is operator-driven rather than fully automated, so quality
        issues can lead to the modality being skipped and to missing data.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, producing volunteer bias which may limit the generalisability of
      results to those not represented in the study population.
    mitigation_strategy: >-
      Recruitment is conducted in waves from an enumerated study base of health system patients, with
      ongoing monitoring of participation characteristics and under- or oversampling of groups as
      needed.
  - bias_type: sampling_bias
    bias_description: >-
      The recruitment pool is drawn by screening electronic health records of three academic health
      systems for patients aged 40 and older with an encounter between 2020 and 2025, so recruitment
      is predominantly urban and hospital-based and may not fully capture diverse cultural and
      socioeconomic backgrounds.
    mitigation_strategy: >-
      Three geographically dispersed sites were selected to increase geographic and demographic
      diversity, and individuals from all demographic backgrounds are recruited at all three sites.
  - bias_type: representation_bias
    bias_description: >-
      The overall design targets balance across race/ethnicity, biological sex, and diabetes
      severity, but enrollment is ongoing and interim releases, including the pilot data, may not
      have achieved balanced distribution across groups. The cohort also excludes other racial and
      ethnic groups such as Pacific Islanders and Native Americans.
    affected_subsets:
      - >-
        Race/ethnicity and biological sex subpopulations across the training, validation, and test
        splits.
    mitigation_strategy: >-
      A recommended train/validation/test split is supplied in which the validation and test sets are
      balanced as far as possible for sex, race/ethnicity, and diabetes status; new recruitment
      strategies are to be implemented if balancing emerges as a challenge.
  - bias_type: selection_bias
    bias_description: >-
      Eligibility requires that participants speak, read, and understand English, which the protocol
      publication states may have created challenges in recruiting Hispanic and Asian persons.
    affected_subsets:
      - Hispanic and Asian subpopulations
    mitigation_strategy: >-
      The project noted the possibility of translating study materials into Spanish and sought
      supplemental funding for translation to enable participation of Spanish-speaking participants.
  - bias_type: representation_bias
    bias_description: >-
      Recruiting Black men into health research is documented to be more difficult than recruiting
      other populations, with factors such as medical mistrust and fear of safety stemming from
      historical events including the Tuskegee syphilis study, while this population carries a
      disproportionate burden of T2DM.
    affected_subsets:
      - Black male participants
    mitigation_strategy: >-
      Tailored printed materials and a personalised, participatory approach to recruitment were
      identified as strategies to encourage participation.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is deliberately triple-balanced by race/ethnicity, T2DM severity, and biological sex
      rather than matching the demographic distribution of the US population, so the dataset should
      not be treated as a population-representative sample.
    scope_impact: >-
      Prevalence or population-level estimates derived directly from the dataset would be biased.
    recommended_mitigation: >-
      Treat the cohort as a designed, balanced sample intended for model development rather than for
      epidemiological estimation.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Racial and ethnic coverage is restricted to Asian, Black, Hispanic, and White participants;
      other groups such as Pacific Islanders and Native Americans are not included. Participants must
      speak and read English, and eligibility is restricted to adults aged 40 and older, with an
      upper limit of 85 years in the study eligibility criteria.
    scope_impact: >-
      Models trained on the dataset may not generalise to excluded groups, to non-English speakers,
      or to younger adults.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The study is cross-sectional with a single visit per participant plus ten days of at-home
      monitoring; this release covers data collected between 19 July 2023 and 1 May 2025. A
      longitudinal follow-up of approximately 10 percent of the cohort is planned for year 4 and is
      not present in this release.
    scope_impact: >-
      Within-participant change over time cannot be studied in this release.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets, or predefined tasks are supplied; the dataset is hypothesis agnostic and
      users must define their own labels.
    recommended_mitigation: >-
      The project states it has no formal guidelines for creating new labels or defining new tasks,
      so users should document their own label definitions.
  - limitation_type: scope_limitation
    limitation_description: >-
      The associated biorepository holds a finite number of biospecimens available to share with
      scientists; procedures for reviewing and prioritising written requests are still to be
      developed. Biospecimens are not part of this data release.
  - limitation_type: integration_limitation
    limitation_description: >-
      Individual-level sex, race, ethnicity, medication information, 5-digit zip code, genetic
      sequencing data, past health records, and traffic and accident reports are withheld from the
      public release and available only under controlled access, so analyses requiring these
      variables cannot be performed on the public dataset alone.
    recommended_mitigation: >-
      Enter into a data use agreement to obtain the controlled access version of the dataset.

content_warnings:
  - content_warnings_present: false

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details:
      - >-
        The public release does not contain data considered confidential and includes no personally
        identifiable information. More sensitive data are held in a separate controlled access dataset
        available only to scientists whose institutions have completed legal and privacy use agreements
        with the AI-READI research programme.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        5-digit residential zip code. Held under controlled access and not released in the public
        v3.0.0 dataset.
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        Biological sex, race, and ethnicity of participants. Removed from the public release to prevent
        stigmatization of findings and held under controlled access.
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        Genetic sequencing data derived from genomic DNA extracted from banked buffy coats. Held under
        controlled access and not released in the public v3.0.0 dataset.
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        Medications used by participants and past health records. Removed from the public release and
        held under controlled access.
  - sensitive_elements_present: true
    sensitivity_details:
      - >-
        Motor vehicle traffic and accident reports. Held under controlled access and not released in
        the public v3.0.0 dataset.

is_deidentified:
  identifiable_elements_present: false
  identifiers_removed:
    - >-
      Protected Health Information as defined by the HIPAA Privacy Rule, plus participant sex,
      race/ethnicity, and medications used.
  method: >-
    HIPAA Privacy Rule Safe Harbor method, applied to the public release, with additional removal of
    sex, race/ethnicity, and medication information.
  deidentification_details:
    - >-
      The FAIRhub dataset description records a de-identification type of NoDeIdentification with the
      explanation that no identifiers were collected, so no active de-identification was necessary, but
      the team checked that no identifiable data per US HIPAA were present. The record flags
      deIdentDirect and deIdentHIPAA as true and deIdentDates, deIdentNonarr, and deIdentKAnon as
      false, so dates were not shifted or removed. The public set is stripped of Protected Health
      Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, and of information
      related to the sex and race/ethnicity of participants and to medications used. To prevent
      re-identification attempts the project implements a robust data dissemination system, a strict
      licence agreement, and data watermarking for both the public and controlled sets.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - STUDY00016228
  ethics_review_board:
    - >-
      University of Washington Institutional Review Board, with initial approval on 20 December 2022
      and reliance agreements from the IRBs of the University of Alabama at Birmingham and the
      University of California San Diego.
  regulatory_compliance:
    - >-
      Written informed consent from all participants; public release de-identified under the HIPAA
      Privacy Rule Safe Harbor method; licensees must comply with the data security and privacy
      standards established under the NIH Genomic Data Sharing Policy; the study is registered on
      ClinicalTrials.gov as NCT06002048; it is recorded as not an FDA-regulated drug or device study.
  special_populations:
    - >-
      No protected population is targeted. Ability to provide consent is an inclusion criterion, and
      pregnancy, gestational diabetes, and type 1 diabetes are exclusionary. Participants are adults
      aged 40 years and older, with an upper age limit of 85 years in the study eligibility module.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details:
      - >-
        The study was approved under IRB protocol STUDY00016228, with initial approval received on 20
        December 2022 and reliance agreements with the IRBs of the University of Alabama at Birmingham
        and the University of California San Diego. An annual renewal application reporting study
        status and progress is required within 90 days of expiration. The initial approval letter is
        published with the dataset documentation. The FAIRhub oversight module records the human
        subject review status as submitted and approved, with no Data Monitoring Committee and no FDA
        regulated drug or device.
  - reviewing_organization: Native BioData Consortium
    review_details:
      - >-
        The project engages in tribal consultation with the Native BioData Consortium to address
        barriers and facilitators of participation for American Indian and Alaska Native communities
        and to evaluate tools such as data usage agreements, contract negotiations, transparent access
        agreements, and mechanisms for assured return of benefit and sustainable input, control, and
        monitoring of Tribal data.
  - reviewing_organization: AI-READI Community Advisory Board
    contact_person: AI-READI project contact, contact@aireadi.org
    review_details:
      - >-
        A Community Advisory Board of 11 persons from the three sites, including diversity in race and
        ethnicity as represented in the AI-READI sample, contributes to the development of the protocol
        and reviews consent forms and research procedures, with feedback incorporated into protocol
        modifications.

informed_consent:
  - consent_obtained: true
    consent_type:
      - >-
        Written informed consent, obtained either electronically (e-consent with electronic signature
        in REDCap) before the visit or in person at the start of the visit.
    consent_documentation:
      - >-
        IRB-approved consent form for the University of Washington (STUDY00016228), published with the
        dataset documentation; the other clinical sites operated under IRB reliance and used the same
        form with minor institution-specific language. Signed electronic consent forms were emailed
        automatically to participants, who could request additional copies from study coordinators.
    consent_scope:
      - >-
        Participation in the AI-READI protocol including questionnaires, in-person measurements,
        imaging, blood and urine collection, ten days of at-home monitoring, review of medical records
        and driving/accident records; placement of de-identified data in an open-source repository; and
        banking of biospecimens for future research. The FAIRhub consent metadata records the consent
        type as ConsentSpecifiedNotElsewhereCategorised, with the note that the public version of the
        dataset may only be used for type 2 diabetes related research while a private version will
        allow more generic use.
    withdrawal_mechanism:
      - >-
        Participants may withdraw consent at any time and cease participation; data already shared or
        used up to that point remain in the dataset, as stated in the consent document.

at_risk_populations:
  special_protections:
    - >-
      Ability to provide consent is an inclusion criterion, so adults unable to consent are not
      enrolled and no legally authorized representative process is used. Pregnancy, gestational
      diabetes, and type 1 diabetes are exclusion criteria. No minors are enrolled; the minimum age is
      40 years. Transportation assistance (rideshare services) was offered to participants who
      endorsed barriers to reaching study visits.

intended_uses:
  - use_category:
      - Artificial intelligence and machine learning research on type 2 diabetes mellitus
    examples:
      - Training multimodal AI/ML models across survey, clinical, imaging, wearable, and environmental
        domains
      - Pseudotime manifold analysis to reconstruct a temporal atlas of T2DM development and reversal
      - Research into salutogenesis, the pathway from disease back to health
    usage_notes: >-
      Access to the public release requires agreeing to use the data only for type 2 diabetes related
      research, and the data are stored and shared as AI-ready so that AI/ML research can proceed
      without reformatting and preprocessing.
  - use_category:
      - Methodological blueprint for creating and sharing AI-ready clinical datasets
    examples:
      - Reuse of the Clinical Dataset Structure (CDS) specification for organizing clinical research
        datasets
      - Reuse of the FAIRhub curation, management, and sharing workflows
      - Reuse of the project's guidelines for making biomedical data types FAIR
    usage_notes: >-
      The consortium disseminates the principles and processes of designing and implementing the
      dataset through publications, a Zenodo community, and a GitHub organization.
  - use_category:
      - Commercial research and development
    usage_notes: >-
      The custom licence grants a non-exclusive, non-transferable licence to download, reproduce, and
      use the data and to create derivative works for research and commercial purposes, subject to
      security, secondary-sharing, and anti-re-identification obligations.
  - use_category:
      - Workforce training at the intersection of biomedicine and artificial intelligence
    examples:
      - A year-long AI-READI research internship programme including a two-week data
        science/programming bootcamp, didactic lectures, and mentored research
      - Intern projects developing healthsheets, mapping project data into common data models, and
        analysing equity and ethical issues

prohibited_uses:
  - prohibition_reason:
      - >-
        Making clinical treatment decisions based on the data is prohibited by the licence, because the
        data are intended solely as a research resource.
  - prohibition_reason:
      - >-
        Using the data, alone or with other information, to compromise the confidentiality of any data
        subject, to identify or contact an individual data subject or group, to extract or extrapolate
        identifying information, to establish membership in a particular group, or otherwise to cause
        harm or injury to a data subject, is prohibited by the licence in order to protect participant
        privacy.
  - prohibition_reason:
      - >-
        Transferring, licensing, sublicensing, selling, assigning, displaying, sharing, or otherwise
        conveying any portion of the data or any derivative work to a third party is prohibited unless
        that party is bound by an agreement with the licensor on identical terms.
  - prohibition_reason:
      - >-
        Disseminating models, algorithms, or programs trained on the data without first undertaking all
        reasonable efforts to minimise the likelihood that the data can be memorized, derived,
        reconstructed, or reconstituted through their use or construction is prohibited.
  - prohibition_reason:
      - >-
        Use of the public release for research unrelated to type 2 diabetes is not permitted, because
        access is conditioned on agreeing to use the data only for type 2 diabetes related research.

discouraged_uses:
  - discouragement_details:
      - >-
        Uses that assume a demographically balanced or population-representative sample are discouraged
        for interim releases, because enrollment is ongoing and periodic data releases may not have
        achieved the intended balanced distribution across race/ethnicity, sex, and diabetes severity
        groups.
  - discouragement_details:
      - >-
        Estimating population prevalence or generalising to the US population is discouraged, because
        the cohort was deliberately recruited in equal proportions across four race/ethnic groups, four
        T2DM severity categories, and both sexes rather than to match the demographic distribution of
        the US population, and because participants are volunteers recruited from three urban academic
        health systems.

future_use_impacts:
  - impact_details:
      - >-
        There is a theoretical risk of future re-identification. AI algorithms can infer individual
        patient characteristics and could facilitate individual-level identification, so the project
        implements a robust data dissemination system, a strict licence agreement, and data watermarking
        for both the public and controlled sets.
  - impact_details:
      - >-
        Because interim releases may not be balanced across demographic groups, and because sex, race,
        and ethnicity are not released publicly, models trained on the data could carry demographic
        imbalance into downstream applications without the user being able to detect it. The project
        supplies a recommended train/validation/test split whose validation and test sets are balanced
        as far as possible for sex, race/ethnicity, and diabetes status to reduce this disparity.
  - impact_details:
      - >-
        Beyond the theoretical re-identification risk, the dataset creators state that to the extent of
        their knowledge they do not currently anticipate uses of the dataset that could result in unfair
        treatment of individuals or groups or other undesirable harms.

