  compression: zip
  instances:
  - name: Immunofluorescence image data
    instance_type: immunofluorescence confocal image archive
    description: Spatial localization of proteins of interest in MDA-MB-468 breast cancer cells imaged
      by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
      University, under three conditions - untreated, paclitaxel-treated and vorinostat-treated. Nuclei
      were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow
      channel); microtubules with tubulin antibody (red channel); and antibody against protein of interest
      (green channel). Distributed as three ZIP archives.
  - name: SEC-MS protein-protein interaction data
    instance_type: size-exclusion chromatography mass spectrometry dataset
    description: Size exclusion chromatography-mass spectroscopy (SEC-MS) data for MDA-MB-468 breast cancer
      cells with and without treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neural progenitor
      cells, neurons and cardiomyocytes, generated in the Nevan Krogan laboratory at the University of
      California San Francisco. Distributed as two ZIP archives (cm4ai_mass-spec_KOLF2.zip and cm4ai_mass-spec_MDA-MB-468.zip)
      with corresponding deposits in the MassIVE repository.
  - name: AP-MS protein-protein interaction data
    instance_type: affinity purification mass spectrometry dataset
    description: Affinity purification mass spectrometry (AP-MS) data for treated MDA-MB-468 breast cancer
      cells, distributed as two ZIP archives covering paclitaxel and vorinostat treatment, with corresponding
      deposits in the MassIVE repository. AP-MS data appear for the first time in this release among the
      four releases represented in this record.
  - name: CRISPRi perturb-seq data
    instance_type: single-cell CRISPR interference perturbation sequencing dataset
    description: Perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment and for
      undifferentiated (parental) KOLF2.1J iPSCs, distributed as a KOLF2.1J perturbation cell atlas archive
      and a raw SRA sequence archive. The Dataverse record lists the perturb-seq data in KOLF2.1J iPSCs
      and in MDA-MB-468 cells as embargoed in external repositories, with a CRISPRi Perturbation Atlas
      of iPSCs available at Figshare.
  - name: Release metadata and provenance package
    instance_type: RO-Crate metadata and provenance archive
    description: Release metadata packaged as an RO-Crate archive (cm4ai_release_metadata.zip), carrying
      the FAIRSCAPE-generated metadata, JSON-Schema data dictionaries and provenance graphs that make
      the release AI-ready.
