- name: Protein interactions (portal-reported programme total)
  instance_type: protein-protein interaction record
  counts: 1374
  description: Programme-level figure reported in the "Data Insights" panel of the CM4AI home page and
    Data Releases page.
- name: Immunofluorescent images (portal-reported programme total)
  instance_type: immunofluorescence confocal image
  counts: 53788
  description: Programme-level figure reported in the "Data Insights" panel of the CM4AI home page and
    Data Releases page.
- name: Total proteins investigated (portal-reported programme total)
  instance_type: protein
  counts: 7023
  description: Programme-level figure reported in the "Data Insights" panel of the CM4AI home page and
    Data Releases page.
- name: Genes targeted (portal-reported programme total)
  instance_type: targeted gene
  counts: 11739
  description: Programme-level figure reported in the "Data Insights" panel of the CM4AI home page and
    Data Releases page. The genome-scale CRISPRi perturbation cell atlas in KOLF2.1J iPSCs maps transcriptional
    and fitness phenotypes associated with 11,739 targeted genes.
- name: MDA-MB-468 breast cancer cell line
  instance_type: human cell line
  description: MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from
    a metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma,
    available from ATCC. This cell line has been extensively used to study triple-negative breast cancer
    and is well characterized with data such as transcriptomic, mutational profile and whole-genome sequencing
    available. CM4AI profiles it untreated and treated with paclitaxel or vorinostat.
- name: KOLF2.1J induced pluripotent stem cell line
  instance_type: human cell line
  description: The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was derived from a healthy male Northern European
    donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource. It is
    available for access by non-for-profit organizations via a simple MTA. CM4AI profiles it undifferentiated
    and differentiated into neural progenitor cells, neurons and cardiomyocytes.
- name: Curated flagship dataset, iPSC lineages
  instance_type: curated multimodal dataset
  description: Curated dataset for undifferentiated (parental) iPSCs and iPSC-derived neural progenitor
    cells (NPCs), neurons, and cardiomyocytes, described on the CM4AI Data Releases page as including
    perturb-seq of more than 11,000 genes (whole-genome), SEC-MS capturing approximately 7,000 proteins,
    and IF images announced as coming soon.
- name: Curated flagship dataset, TNBC conditions
  instance_type: curated multimodal dataset
  description: Curated datasets for triple-negative breast cancer cells under untreated (DMSO control),
    vorinostat, and paclitaxel conditions, described on the CM4AI Data Releases page as including SEC-MS
    capturing approximately 7,000 proteins, IF images for 523 proteins, perturb-seq of 200 genes, and
    AP-MS interactomes announced as coming soon.
known_biases:
- name: Cell-line derivation limits population representativeness
  bias_type: representation_bias
  bias_description: Data in the releases were derived from commercially available de-identified human
    cell lines and do not represent all biological variants which may be seen in the population at large.
  mitigation_strategy: The limitation is stated explicitly in the "Potential Sources of Bias" section
    of each Dataverse release record so that users can judge generalizability.
  affected_subsets:
  - All modalities in all releases
- name: Two genetic backgrounds only
  bias_type: sampling_bias
  bias_description: The programme's measurements derive from two cell lines with documented single-donor
    origins - MDA-MB-468, established from a 51-year-old black female with metastatic mammary adenocarcinoma,
    and KOLF2.1J, derived from a healthy male Northern European donor. Findings therefore reflect these
    two genetic and disease backgrounds rather than a sampled population.
  affected_subsets:
  - MDA-MB-468 conditions
  - KOLF2.1J conditions and derived lineages
- name: Targeted protein selection
  bias_type: selection_bias
  bias_description: Proteins interrogated are selected rather than exhaustive - the project targets 100
    chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric and cardiac disorders,
    with additional proteins added subject to significant hits from the genetic perturbation and protein-protein
    interaction results.
  affected_subsets:
  - Spatial proteomics imaging
  - AP-MS interactomes
known_limitations:
- name: Interim beta releases
  limitation_type: scope_limitation
  limitation_description: Each release is an interim Beta release. These data are not yet in completed
    final form, and computed cell maps are not included in the releases represented here.
  scope_impact: The releases deliver map-input data streams rather than the finished hierarchical cell
    maps that are the programme's headline deliverable.
  recommended_mitigation: Track subsequent quarterly releases, which are stated to add predicted cell
    maps.
- name: Incomplete overlap between modalities
  limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
  scope_impact: Integrated multimodal analysis is possible only over the intersection of the interrogated
    protein sets.
- name: Pre-publication embargo on some datasets
  limitation_type: temporal_limitation
  limitation_description: Some datasets are under temporary pre-publication embargo; perturb-seq data
    in KOLF2.1J iPSCs and in MDA-MB-468 cells are listed as embargoed external resources in the October
    2025 and June 2026 releases.
  scope_impact: Not all modality data referenced by a release are immediately retrievable.
- name: Requires domain expertise
  limitation_type: methodological_limitation
  limitation_description: The current release is most suitable for bioinformatics analysis of the individual
    datasets and requires domain expertise for meaningful analysis.
- name: Repository under administrative review
  limitation_type: scope_limitation
  limitation_description: Both the CM4AI portal and the University of Virginia Dataverse collection display
    the notice that the repository or collection "is under review for potential modification in compliance
    with Administration directives."
  scope_impact: The long-term composition and availability of the released material may be subject to
    change outside the project's control.
confidential_elements:
- name: Confidentiality assessment
  confidential_elements_present: false
  confidentiality_details:
  - The release records state Human Subjects - No, De-identified Samples - Yes, and FDA Regulated - No.
  - CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue cultures) and
    are considered to be de-identified as they cannot be matched, with current knowledge, to a human subject.
  - The only access restriction recorded is a temporary pre-publication embargo on some externally deposited
    datasets; all files listed in the represented releases are marked Public.
subpopulations:
- name: Human subpopulation identification
  subpopulation_elements_present: false
  identification:
  - The data describe human cell lines rather than human participants, so no participant subpopulations
    are identified in the releases.
  distribution:
  - Documented donor characteristics of the two cell lines are - MDA-MB-468, a 51-year-old black female
    with metastatic mammary adenocarcinoma; KOLF2.1J, a healthy male Northern European donor.
sensitive_elements:
- name: Sensitive data assessment
  sensitive_elements_present: false
  sensitivity_details:
  - Release metadata record no human subjects and de-identified samples; the data are laboratory measurements
    on commercially available cell lines.
  - No personal, clinical or directly identifying information is described in any of the represented releases.
acquisition_methods:
- name: Acquisition of released instances
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Instances are directly measured in the project's laboratories - mass spectrometry readouts (AP-MS,
    SEC-MS), confocal immunofluorescence images, and single-cell sequencing readouts from CRISPRi perturbation
    screens.
  - Derived instances are computed from these measurements - embeddings, co-embeddings and hierarchical
    protein communities produced by the MuSIC pipeline.
  - No data are reported by human subjects; the release records state that no human subjects are involved.
  - The Ethics, Standards and Data Acquisition modules validate datasets and data elements and map data
    elements to public ontology vocabularies using JSON-Schema mini-data-dictionary descriptions resolvable
    from the provenance graph metadata.
collection_mechanisms:
- name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - AP-MS is performed on endogenously tagged cell lines to map protein-protein interactions of chromatin
    regulators under different conditions (cancer - no treatment, paclitaxel or vorinostat; iPSC - undifferentiated,
    neurons and cardiomyocytes).
  - As of the project article, 17 genes had been endogenously tagged in MDA-MB-468 with AP-MS data acquired
    under three conditions (untreated, paclitaxel-treated and vorinostat-treated), with 34 additional
    genes in the process of being tagged.
  - AP-MS data for treated MDA-MB-468 cells appear in the June 2026 release as two ZIP archives with corresponding
    MassIVE deposits.
- name: Size-exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS is used for proteome-wide complex and interaction mapping as an orthogonal mass-spectrometry
    approach, performed in the Nevan Krogan laboratory at the University of California San Francisco.
  - SEC-MS on MDA-MB-468 cells under three conditions (untreated, paclitaxel- and vorinostat-treated)
    identified 72 of 100 chromatin modifiers, 52 of them integral components of protein complexes, and
    detected PPI profiles of over a thousand complexes, with thousands of proteins showing differential
    elution profiles between control and treated cells.
  - SEC-MS has also been performed in KOLF2 iPSCs and derivatives, uncovering more than 700 protein complexes
    in both parental iPSCs and differentiated neurons.
- name: Immunofluorescence spatial proteomics imaging
  mechanism_details:
  - Spatial subcellular organization is mapped using the Human Protein Atlas resource of antibodies, with
    automated fixation and permeabilization protocols established on a pipetting robot for the MDA-MB-468
    and KOLF2 cell lines.
  - Images are acquired by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg
    Lab at Stanford University; nuclei are stained with DAPI (blue channel), endoplasmic reticulum with
    a calreticulin antibody (yellow channel), microtubules with a tubulin antibody (red channel), and
    the protein of interest with a specific antibody (green channel).
  - Spatial proteomics mapping of 100 chromatin regulators in MDA-MB-468 cells (plus or minus paclitaxel
    or vorinostat) was completed, with another 500 proteins pending significant hits from the genetic
    perturbation and PPI results.
- name: Single-cell CRISPR perturbation screening
  mechanism_details:
  - Single-cell CRISPR screens perturb chromatin regulators in MDA-MB-468 cells under three conditions
    (no treatment, paclitaxel or vorinostat) and in undifferentiated KOLF2 iPSCs.
  - A CRISPR lentiviral library targeting 100 chromatin factors with six guide RNAs per gene was designed,
    and MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were generated and characterized;
    screens were performed using the 10x Genomics 3'HT kit.
  - The released KOLF2.1J perturbation cell atlas is an expressed genome-scale CRISPRi atlas mapping transcriptional
    and fitness phenotypes associated with 11,739 targeted genes, validated via phenotypic, protein-interaction,
    and metabolic tracing assays.
sampling_strategies:
- name: Protein, gene and condition selection
  is_sample: true
  is_random: false
  is_representative: false
  why_not_representative:
  - Measurements come from two selected disease-relevant cell lines rather than a population sample, and
    the release records state that the data do not represent all biological variants which may be seen
    in the population at large.
  strategies:
  - Multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
    neuropsychiatric and cardiac disorders.
  - Perturbation library targeting 100 chromatin factors with six guide RNAs per gene, alongside an expressed
    genome-scale CRISPRi atlas covering 11,739 targeted genes.
  - Conditions sampled as treated versus untreated (paclitaxel, vorinostat, DMSO control) for MDA-MB-468
    and as undifferentiated versus differentiated (neural progenitor cells, neurons, cardiomyocytes) for
    KOLF2.1J.
  source_data:
  - MDA-MB-468 (RRID:CVCL_0419), available from ATCC
  - KOLF2.1J (RRID:CVCL_B5P3), available from the HipSci resource
data_collectors:
- name: Krogan laboratory, University of California San Francisco
  role: Protein-protein interaction data generation
  collector_details:
  - Generates SEC-MS datasets on undifferentiated KOLF2.1J iPSCs and derivatives and on MDA-MB-468 cells
    following vorinostat or paclitaxel treatment, and the AP-MS data released for treated MDA-MB-468 cells.
- name: Lundberg laboratory, Stanford University
  role: Spatial proteomics image data generation
  collector_details:
  - Generates the immunofluorescence confocal image datasets for MDA-MB-468 cells under untreated, paclitaxel
    and vorinostat conditions, following Human Protein Atlas antibody and imaging practice.
- name: Mali laboratory, University of California San Diego
  role: Genetic perturbation data generation
  collector_details:
  - Designs and runs the single-cell CRISPRi perturbation screens and the expressed genome-scale perturbation
    cell atlas in KOLF2.1J iPSCs and MDA-MB-468 cells.
- name: CM4AI Tools module, University of California San Diego
  role: Data integration and map production
  collector_details:
  - Produces and maintains the Multi-Scale Integrated Cell (MuSIC) pipeline, which downloads PPI and image
    data, generates and integrates embeddings, performs community detection and hierarchy creation, and
    evaluates the resulting hierarchy.
- name: CM4AI Standards module, University of Virginia
  role: AI-readiness packaging and provenance
  collector_details:
  - Operates the FAIRSCAPE client and server components that package datasets, software, metadata and
    provenance graphs as RO-Crates, assign persistent ARK identifiers and compute end-to-end provenance
    entailments.
- name: CM4AI Data Acquisition module
  role: Cell culture, perturbation and measurement
  collector_details:
  - Completed parallel maps of protein-protein interactions, protein subcellular distributions, and transcriptional
    states associated with a near-comprehensive set of chromatin regulators encoded by the human genome,
    generated in ethically sourced breast cancer cells and extended to ethically sourced human induced
    pluripotent stem cells.
collection_timeframes:
- name: Project and release timeframe
  start_date: '2022-09-01'
  timeframe_details:
  - NIH RePORTER records the CM4AI project period as 2022-09-01 to 2026-08-31.
  - The Dataverse release records state that the dataset will be regularly updated and augmented through
    the end of the project in November 2026, with updates on a quarterly basis. The stated project end
    therefore differs between sources (2026-08-31 in NIH RePORTER, November 2026 in the release maintenance
    plan), and no single end date is asserted here.
  - Each represented release records a data creation date of 2025-02-27 and a deposit date of 2025-02-27
    in its Dataverse citation metadata, with release publication dates of 2025-03-03, 2025-07-01, 2025-10-31
    and 2026-06-17.
missing_data_documentation:
- name: Known gaps in the released data
  missing_data_patterns:
  - Computed cell maps are not included in the represented releases.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq data
    interrogate sets of proteins which incompletely overlap.
  - Some externally deposited datasets, in particular perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468
    cells, are listed as embargoed.
  - The Data Releases page announces IF images for the iPSC flagship dataset and AP-MS interactomes for
    the TNBC flagship dataset as "coming soon"; AP-MS data first appear in the June 2026 release.
  missing_data_causes:
  - The releases are interim Beta releases of an ongoing quarterly programme.
  - Temporary pre-publication embargo on some datasets.
  - Modality-specific experimental design and staged data generation across project years.
  handling_strategy: Gaps are disclosed in the Completeness and Limitations sections of each release record,
    and the data are stated to be regularly updated and augmented on a quarterly basis through the end
    of the project.
raw_data_sources:
- name: MassIVE mass spectrometry deposits
  source_description: Mass spectrometry raw and processed data associated with the releases are deposited
    in the MassIVE repository and linked from the Dataverse release records - SEC-MS data for human iPSCs
    and derivatives, SEC-MS data for MDA-MB-468 cells with and without treatment, and AP-MS data for MDA-MB-468
    cells treated with paclitaxel and with vorinostat.
  source_type:
  - external repository deposit
  access_details: Linked as external data resources from the Dataverse release pages; the release records
    name the repository without giving a direct accession in the captured pages. The March 2025 release
    additionally states, for the SEC-MS data generated in the Krogan laboratory, that "the data will be
    uploaded to Pride when available".
- name: NCBI Sequence Read Archive deposit
  source_description: Raw sequence data from the expressed genome-scale CRISPRi perturbation cell atlas
    in KOLF2.1J iPSCs are deposited in the Sequence Read Archive and linked from the release records through
    an NCBI BioProject entry; a raw SRA package is also distributed within the releases as cm4ai_perturb-seq_KOLF2_raw_sra.zip.
  source_type:
  - external repository deposit
  - in-release archive
- name: Figshare CRISPRi perturbation atlas
  source_description: The June 2026 release links a CRISPRi Perturbation Atlas of iPSCs hosted at Figshare
    as an external data resource.
  source_type:
  - external repository deposit
- name: Laboratory deposition archives feeding the MuSIC pipeline
  source_description: The MuSIC pipeline downloads PPI networks for the cell line and conditions from
    the Krogan Laboratory's deposition archive and immunofluorescence images for the cell line and conditions
    from the Lundberg Laboratory's deposition archive, making them available for further processing.
  source_type:
  - laboratory deposition archive
raw_sources:
- name: In-release raw data archives
  raw_data_details:
  - Raw immunofluorescence confocal image archives for MDA-MB-468 cells under untreated, paclitaxel and
    vorinostat conditions are distributed within the releases as ZIP archives.
  - A raw sequence package for the KOLF2.1J CRISPRi perturbation cell atlas is distributed within the
    June 2026 and October 2025 releases as cm4ai_perturb-seq_KOLF2_raw_sra.zip, with the corresponding
    deposit in the NCBI Sequence Read Archive linked from the release record.
  - Raw mass spectrometry data are linked to external MassIVE deposits rather than being distributed in
    full within the Dataverse releases.
- name: Access route for raw data
  access_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  raw_data_details:
  - All files listed in the represented releases are marked Public. Dataverse states that the dataset
    is too large to download in full and directs users to select individual files below the per-download
    size limit or to use the Data Access API for programmatic access.
informed_consent:
- name: Consent basis for the released material
  consent_type:
  - Not applicable to human participants; cell line access governed by material transfer terms
  consent_documentation:
  - KOLF2.1J is available for access by non-for-profit organizations via a simple material transfer agreement;
    MDA-MB-468 is available from ATCC.
  consent_scope:
  - No participant consent process applies to the released data, which are non-clinical laboratory measurements
    on established cell lines that the project states cannot be matched, with current knowledge, to a
    human subject.
  - Both cell lines are described by the project as ethically sourced.
ethical_reviews:
- name: CM4AI ethical review and governance
  contact_person: Vardit Ravitsky
  reviewing_organization: CM4AI Ethics Module
  review_details:
  - Each Dataverse release records Ethical Review as Vardit Ravitsky (ravitskyv@thehastingscenter.org)
    and Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca), and Data Governance Committee
    as Jillian Parker (jillianparker@health.ucsd.edu).
  - The Ethics team worked closely with the Data Acquisition, Tools, and Standards Modules to develop
    a plan for ethical preparation, licensing, dissemination, and Data Access supervision of CM4AI datasets,
    balancing openness with protection of intellectual property and supervision of potential commercialization.
  - The Ethics team employs a methodology inspired by Value-Sensitive Design, is building an axiological
    repository of values, and is formulating the CM4AI Life Cycle, a framework elucidating governance
    milestones throughout data generation and AI system development.
  - The Ethics Pillar supported the Bridge2AI Ethics Working Group and the Bridge2AI Data Sharing and
    Dissemination Working Group in developing a Code of Conduct, which outlines basic requirements for
    participants in the Bridge2AI Open House to access B2AI data, including CM4AI datasets, and to attest
    and commit to it prior to accessing the data.
  - A Data Access Committee supervises ethical matters related to dataset distribution and potential dual
    licensing for commercial use.
data_protection_impacts:
- name: Data protection assessment
  impact_details:
  - The releases record Human Subjects - No, De-identified Samples - Yes and FDA Regulated - No.
  - CM4AI data are non-clinical, being derived from tissue cultures, and are considered de-identified
    because they cannot be matched, with current knowledge, to a human subject, which materially limits
    data-protection exposure.
  - Ethical conditions adopted by the project include protection of human subjects data, non-biasing analysis
    and scientific integrity, full documentation of methods and reagents, and licensing and distribution
    of data, software and models with openness consistent with protection of human subject privacy.
human_subject_research:
  name: Human subject research status
  involves_human_subjects: false
  ethics_review_board:
  - CM4AI Ethics Module; ethical review recorded for each release as Vardit Ravitsky and Jean-Christophe
    Belisle-Pipon.
  regulatory_compliance:
  - 'Dataverse release metadata - Human Subjects: No'
  - 'Dataverse release metadata - De-identified Samples: Yes'
  - 'Dataverse release metadata - FDA Regulated: No'
  description: The programme generates non-clinical laboratory data from established human cell lines.
    The release records state that no human subjects are involved and that samples are de-identified.
at_risk_populations:
  name: At-risk population involvement
  at_risk_groups_included: false
  description: No human participants are enrolled, so no at-risk or vulnerable participant populations
    are involved. Cell lines are described as ethically sourced, with KOLF2.1J available to non-profit
    organizations under a simple material transfer agreement.
preprocessing_strategies:
- name: MuSIC data integration pipeline
  preprocessing_details:
  - Downloaded PPI networks are processed using the node2vec deep learning model to reduce dimensionality,
    producing a PPI embedding that contains information about the protein's interactions.
  - IF images are processed using a Human Protein Atlas deep learning model to reduce dimensionality,
    producing an image embedding that contains information about protein localization.
  - The PPI and image embeddings are integrated to obtain a co-embedding for each protein using contrastive
    deep learning, so that the original embeddings can be reconstructed with minimal information loss
    and proteins with similar PPI and image embeddings have similar co-embeddings.
  - Community detection is performed on the all-by-all similarities of pairs of proteins in the co-embedding
    space, and the resulting hierarchy of protein communities is output as the final cell map.
  used_software:
  - id: https://github.com/idekerlab/cellmaps_pipeline
    name: Cell Mapping Toolkit (cellmaps_pipeline)
    url: https://github.com/idekerlab/cellmaps_pipeline
    description: Series of pip-installable Python packages implementing the end-to-end cell mapping pipeline,
      including cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding, cellmaps_ppi_embedding,
      cellmaps_coembedding, cellmaps_generate_hierarchy and cellmaps_hierarchyeval, with documentation
      at https://cellmaps-pipeline.readthedocs.io/. Alpha-level tools are released under a BSD-3 open
      source license in GitHub and production-ready tools in the Zenodo long-term archive.
    license: BSD-3
- name: AI-readiness packaging with FAIRSCAPE
  preprocessing_details:
  - Each MuSIC pipeline segment calls the FAIRSCAPE client package to validate inputs and create an output
    RO-Crate package for that segment, ready for dispatch to the FAIRSCAPE server for persistent identifier
    creation and provenance graph entailment computation.
  - FAIRSCAPE-CLI is passed metadata defining JSON-Schema schemas for the datasets in the computational
    unit, as well as the inputs, computations, software, models and outputs, and creates an RO-Crate package
    with the datasets, metadata and software or resolvable references to them.
  - RO-Crates sent to the FAIRSCAPE server are registered and assigned persistent, resolvable, globally
    unique identifiers using the ARK scheme, then decomposed into their individual components, which are
    also registered and assigned identifiers; the server computes end-to-end entailments on each RO-Crate's
    provenance expressed in the EVI Evidence Graph Ontology.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    url: https://fairscape.github.io
    description: Client-side Python3 application (FAIRSCAPE-CLI) and server application performing AI-readiness
      packaging, identifier assignment and provenance entailment for CM4AI datasets. Copyright is held
      by the Rector and Board of Visitors of the University of Virginia.
    license: MIT
cleaning_strategies:
- name: Quality control of perturbation screen data
  cleaning_details:
  - Single-cell CRISPR screen data from MDA-MB-468 cells and undifferentiated KOLF2.1J iPSCs were reported
    as undergoing quality control at the time of the project article.
  - The released CRISPRi perturbation cell atlas findings were validated via phenotypic, protein-interaction,
    and metabolic tracing assays.
- name: Release revision and correction
  cleaning_details:
  - The June 2025 release is a revision that adds RGB immunofluorescent images, corrects RO-Crate metadata,
    and changes naming conventions relative to the prior state of that release.
labeling_strategies:
- name: Cell map annotation
  labeling_details:
  - Cell maps are annotated in a two-pronged approach - first, maps are aligned to known protein function
    and pathway resources, including the Gene Ontology and Reactome, to determine protein assemblies with
    high overlap with known cell biology.
  - Second, assemblies in the cell maps are annotated using a large language model approach developed
    by the project to name sets of proteins and assign a name confidence score.
  data_annotation_protocol:
  - The Gene Set AI (GSAI) pipeline guides a GPT-4 model with an engineered prompt following chain-of-thought
    and one-shot strategies to produce a descriptive name, a confidence score and a detailed reasoning
    analysis for the protein members of each assembly, with a separate citation module retrieving supporting
    literature.
  - Human curation teams review and finalize assembly names, with expert annotation jamborees used in
    the associated Nature 2025 cell map study.
annotation_analyses:
- name: Assessment of automated assembly naming
  analysis_method: Large language model naming is scored by a model-reported confidence value and compared
    against alignment of assemblies to Gene Ontology, Reactome, CORUM and Human Protein Atlas reference
    components; reproducibility of generated names was assessed across replicate model runs using semantic
    similarity in the associated Nature 2025 study.
  annotation_quality_details:
  - Assembly names generated for well-documented assemblies received high model confidence, while random
    protein sets received near-zero confidence, supporting the use of the confidence score as a quality
    filter.
  - Final naming determinations are made by the human curation team rather than by the model alone.
machine_annotation_tools:
- name: Automated tools used in map construction and annotation
  tools:
  - node2vec
  - Human Protein Atlas deep learning image model (DenseNet-121)
  - Contrastive co-embedding model (MuSIC)
  - HiDeF hierarchical community detection
  - GPT-4 via the Gene Set AI (GSAI) pipeline
  - Integrative Modeling Platform (IMP)
  tool_descriptions:
  - node2vec represents each protein as a feature vector based on its protein-protein interaction neighbourhood.
  - A Human Protein Atlas deep learning model represents each protein image as a feature vector encoding
    protein localization.
  - The MuSIC co-embedding model integrates PPI and image embeddings using contrastive deep learning.
  - HiDeF identifies protein communities at multiple resolutions and represents their hierarchical relationships
    as a directed acyclic graph.
  - The GSAI pipeline guides GPT-4 to generate assembly names, confidence scores and referenced reasoning
    analyses.
  - The Integrative Modeling Platform is used for integrative structure modelling of selected communities.
existing_uses:
- name: Published uses of CM4AI data, tools and maps
  examples:
  - Schaffer LV, Hu M, Qian G, et al. Multimodal cell maps as a foundation for structural and functional
    genomics. Nature 642:222-231 (2025), a study acknowledging Bridge2AI Program funding (NIH Common Fund;
    OT2 OD032742) that integrates AP-MS and immunofluorescence data for over 5,100 proteins in U2OS cells
    into a map of 275 molecular assemblies, and that released the Cell Mapping Toolkit implementing the
    end-to-end pipeline.
  - Nourreddine S, Doctor Y, Dailamy A, et al. A perturbation cell atlas of human induced pluripotent
    stem cells. bioRxiv 2024.11.03.621734 (PMCID PMC11580897), cited as a related publication of the CM4AI
    data releases.
  - Initial datasets, tools and standards associated with all three parallel mapping platforms were made
    available at the CM4AI CodeFest in March 2024, accompanied by detailed tutorials explaining how the
    data were derived and integrated and providing production-ready software.
use_repository:
- name: CM4AI portal and release archive
  repository_url: https://cm4ai.org/data-releases/
  repository_details:
  - The CM4AI Data Releases page lists the latest release and an archive of the May 2024, March 2025,
    June 2025 and October 2025 releases, with documentation and frequently asked questions about release
    cadence and data types.
  - Data packages from CM4AI, including links to software used in preparing the data, input datasets,
    dataset schemas, and deep provenance graphs, are available on the CM4AI web portal and in the University
    of Virginia's LibraData Dataverse archive.
other_tasks:
- name: Downstream tasks enabled by the released data
  task_details:
  - Interpretation of genetic variants and mutations using hierarchical cell maps.
  - Development of visible neural networks that expose how protein assemblies affect cell-level phenotype
    predictions, including drug response and synergy prediction.
  - Bioinformatics analysis of the individual modality datasets, for which the interim releases are stated
    to be most suitable.
  - Integration of external data into an existing cell map for the ethical development of AI/ML applications,
    a skill taught in the project's internship programme.
future_use_impacts:
- name: Effects of the release cadence on future use
  impact_details:
  - Because the releases are interim and augmented quarterly, analyses should record the release DOI and
    version used; predicted cell maps are stated to be added in future releases.
  - Software packages are versioned as the project progresses, and the version used to produce each dataset
    is referenced in that dataset's metadata.
  - Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question), which constrains downstream commercial
    applications.
  - The repository notice regarding review for potential modification in compliance with Administration
    directives introduces uncertainty about the future composition of the archive.
discouraged_uses:
- name: Uses the release records discourage
  discouragement_details:
  - Use as a representation of population-level biological variation, since the data derive from commercially
    available de-identified cell lines and do not represent all biological variants seen in the population
    at large.
  - Use without domain expertise, since meaningful analysis of the interim releases requires it.
  - Reliance on the releases for finished hierarchical cell maps, which are not included in the represented
    releases.
intended_uses:
- name: Intended uses stated in the release records
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations
  use_category:
  - research
  - AI/ML model development
  usage_notes: The current release is most suitable for bioinformatics analysis of the individual datasets
    and requires domain expertise for meaningful analysis.
prohibited_uses:
- name: Clinical and patient-care use
  prohibition_reason:
  - These laboratory data are not to be used in clinical decision-making or in any context involving patient
    care without appropriate regulatory oversight and approval.
- name: Commercial use without separate licensing
  prohibition_reason:
  - Data packages are licensed under Creative Commons CC BY-NC-SA 4.0 terms, which exclude commercial
    use; commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question), supervised by a Data Access Committee.
distribution_formats:
- name: ZIP archives in the University of Virginia Dataverse
  description: Primary distribution is via LibraData, the University of Virginia's Dataverse instance
    and an NIH-approved generalist repository, as publicly accessible ZIP archives and, in earlier releases,
    RO-Crate metadata JSON files and HTML datasheets and provenance graphs. Individual dataset pages state
    that the dataset is too large to download in full and direct users to select individual files or to
    use the Data Access API for programmatic access.
  access_urls:
  - https://doi.org/10.18130/V3/B35XWX
  - https://doi.org/10.18130/V3/F3TD5R
  - https://doi.org/10.18130/V3/K7TGEM
  - https://doi.org/10.18130/V3/HIGT4C
- name: RO-Crate packages with provenance graphs
  description: CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using the FAIRSCAPE framework. Releases include release- level RO-Crate metadata
    with pointers to sub-crates, per-modality RO-Crate metadata JSON, HTML provenance graph views, and
    an HTML datasheet summarizing key release information. Persistent identifiers resolve to human- and
    machine-readable landing pages with metadata expressed in JSON-LD using Schema.org, EVI and other
    public vocabularies, with alternative RDF-XML serializations.
- name: Dataverse metadata export formats
  description: Each release record offers metadata export as OAI_ORE, DataCite, OpenAIRE, Schema.org JSON-LD,
    DDI Codebook v2, Dublin Core, DDI HTML Codebook and JSON; the October 2025 and June 2026 records additionally
    offer Croissant.
- name: External repository deposits
  description: Mass spectrometry data are deposited in MassIVE, raw perturbation sequences in the NCBI
    Sequence Read Archive via a BioProject, and a CRISPRi perturbation atlas of iPSCs at Figshare; these
    are linked as external data resources from the release records.
distribution_dates:
- name: Quarterly release publication dates
  release_dates:
  - 2025-03-03 - March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX, Dataverse version 1.4
  - 2025-07-01 - June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R, Dataverse version 2.1
  - 2025-10-31 - October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM, Dataverse version 2.1
  - 2026-06-17 - June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, Dataverse version 2.0
  - 2026-07-15T20:28:19Z - version 2 release time recorded for the June 2026 release
  description: 'CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input
    data streams. The cm4ai.org Data Releases page labels the current release the June 2026 Data Release
    but displays "Released on: June 17, 2025"; the official Dataverse metadata report a publication date
    of 2026-06-17 and a version 2 release time of 2026-07-15T20:28:19Z, and those Dataverse values are
    treated as authoritative here. Individual files within a release may be published later than the release
    publication date - for example the June 2025 image archives on 2025-10-22, several October 2025 files
    on 2025-12-22, and the June 2026 image archives on 2026-07-15.'
license_and_use_terms:
  name: CM4AI licensing and use terms
  license_terms:
  - Dataset licensed for reuse under the Creative Commons Attribution-NonCommercial- ShareAlike 4.0 International
    license (CC BY-NC-SA 4.0), https://creativecommons.org/licenses/by-nc-sa/4.0/.
  - Attribution is required to the copyright holders and the authors, and to the Cell Maps for Artificial
    Intelligence project as referenced in the datasets.
  - Any publications referencing this data or derived products should cite the related publication as
    well as directly citing the data collection used.
  - Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question); a Data Access Committee supervises
    ethical matters related to dataset distribution and potential dual licensing for commercial use.
  - The Dataverse community norms and good scientific practices expect that proper credit is given via
    citation, using the data citation shown on the dataset page.
  - All CM4AI integration and packaging software is freely available under nonrestrictive open-source
    licenses - BSD-3 for the Tools data integration pipeline and MIT for the FAIRSCAPE framework.
  data_use_permission:
  - general_research_use
  - no_commercial_use
  contact_person: Jillian Parker
ip_restrictions:
  name: Intellectual property and copyright restrictions
  restrictions:
  - Data are Copyright (c) The Regents of the University of California except where otherwise noted.
  - Spatial proteomics raw image data are copyright (c) The Board of Trustees of the Leland Stanford Junior
    University.
  - Copyright in the FAIRSCAPE software is held by the Rector and Board of Visitors of the University
    of Virginia and the software is available under the MIT license.
  - Commercial use requires separate license negotiation with the copyright holder, balancing openness
    of the data with protection of intellectual property and supervision and monitoring of potential efforts
    at commercialization.
regulatory_restrictions:
  name: Regulatory and compliance status
  regulatory_restrictions:
  - 'FDA Regulated: No'
  hipaa_compliant: not_applicable
  other_compliance:
  - 'Human Subjects: No'
  - 'De-identified Samples: Yes'
  - Participants in the Bridge2AI Open House must attest and commit to the Bridge2AI Code of Conduct prior
    to accessing B2AI data, including CM4AI datasets.
  confidentiality_level: unrestricted
  governance_committee_contact: Jillian Parker
  description: The releases carry no export-control or privacy-regulation restrictions in the captured
    records; access to all listed files in the represented releases is Public, and the only time-limited
    restriction is a pre-publication embargo on some externally deposited datasets.
maintainers:
- name: CM4AI project team
  role: academic_institution
  maintainer_details:
  - Project-related inquiries are directed to Swathi Thaker, PhD, UAB, Program Manager (snthaker@uab.edu);
    website support and updates to Zhandos Sembay, UAB (zsembay8@uab.edu).
  - Trey Ideker (University of California San Diego) is recorded as the Point of Contact on each Dataverse
    release.
  - Justin Niestroy (University of Virginia) is recorded as the depositor of the releases.
  - The Data Governance Committee contact recorded for the releases is Jillian Parker (jillianparker@health.ucsd.edu).
- name: University of Virginia Dataverse (LibraData)
  role: academic_institution
  maintainer_details:
  - LibraData, the University of Virginia's instance of Dataverse and an NIH-approved generalist repository,
    hosts and preserves the releases.
  - Long term preservation in the University of Virginia Dataverse is supported by committed institutional
    funds.
errata:
- name: June 2025 release revision
  erratum_details:
  - The June 2025 Data Release record states that the published dataset is a revision that adds RGB immunofluorescent
    images, applies corrections to RO-Crate metadata, and changes naming conventions.
  - No separate erratum document is published for the represented releases; corrections are described
    in the release description and reflected in the Dataverse version history.
updates:
  name: Quarterly update plan
  frequency: quarterly
  update_details:
  - The dataset will be regularly updated and augmented through the end of the project in November 2026,
    with updates on a quarterly basis.
  - CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data streams;
    data presented in a release will be augmented regularly through the end of the project.
  - Future releases are stated to add predicted cell maps, which are not included in the releases represented
    here.
retention_limit:
  name: Retention and preservation
  retention_period: Long-term preservation with no stated end date, supported by committed institutional
    funds
  retention_details:
  - Long term preservation in the University of Virginia Dataverse, supported by committed institutional
    funds.
  - Superseded releases retain their own DOIs and remain individually citable; the Dataverse records note
    that files are not removed from previously published versions of a dataset.
  - The Dataverse collection and the CM4AI portal both display a notice that the repository is under review
    for potential modification in compliance with Administration directives.
version_access:
  name: Release versions and access to prior releases
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
  - May 2024 Data Release (listed in the cm4ai.org archive; no DOI is given on that page)
  - March 2025 Data Release (Beta) - doi:10.18130/V3/B35XWX, Dataverse version 1.4
  - June 2025 Data Release (Beta) - doi:10.18130/V3/F3TD5R, Dataverse version 2.1
  - October 2025 Data Release (Beta) - doi:10.18130/V3/K7TGEM, Dataverse version 2.1
  - June 2026 Data Release (Beta) - doi:10.18130/V3/HIGT4C, Dataverse version 2.0, current
  version_details:
  - The CM4AI Data Releases page presents the June 2026 release as the latest release and lists May 2024,
    March 2025, June 2025 and October 2025 releases in its archive.
  - The CM4AI project article's data availability statement cites an earlier release, "Cell Maps for Artificial
    Intelligence - Data Release", https://doi.org/10.18130/V3/DXWOS5, University of Virginia Dataverse,
    V1, and describes RO-Crates from a 0.5 alpha data release; that earlier release is not among the four
    quarterly releases represented as resources in this record.
  - Dataverse dataset version numbers displayed on the release pages (1.4, 2.1, 2.1, 2.0) differ from
    the major version shown in the data citations (V1, V2, V2, V2).
  - Each release is individually resolvable through its own DOI, so superseded releases remain accessible.
extension_mechanism:
  name: Extension and contribution mechanisms
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details:
  - The Cell Mapping Toolkit is released as pip-installable Python packages with complete user documentation
    and a step-by-step guide, providing a flexible and generalizable framework for cell map construction
    that enables researchers to integrate and construct cell maps from multiple input modalities.
  - The FAIRSCAPE client and server packages are pip-installable and freely available under the MIT license,
    with tutorial and installation instructions at https://fairscape.github.io.
  - Data packages are augmented quarterly, and the project article states that the preprint describing
    the programme will be continuously updated as CM4AI progresses.
is_deidentified:
  name: De-identification status
  identifiable_elements_present: false
  method: Use of commercially available, established human cell lines rather than identifiable human subject
    material
  deidentification_details:
  - Each Dataverse release record states De-identified Samples - Yes and Human Subjects - No.
  - CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue cultures) and
    are considered to be de-identified as they cannot be matched, with current knowledge, to a human subject.
  - Data in the releases were derived from commercially available de-identified human cell lines.
