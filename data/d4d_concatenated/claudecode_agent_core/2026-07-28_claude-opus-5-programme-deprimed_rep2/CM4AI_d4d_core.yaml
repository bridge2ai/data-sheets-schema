purposes:
- name: Deliver AI-ready cell maps and quarterly input data releases
  response: Cell Maps for Artificial Intelligence (CM4AI) will deliver machine-readable hierarchical maps
    of cell architecture as AI-ready data, together with quarterly data releases of map-input data streams.
    CM4AI's objective is to deliver these maps as AI-Ready data produced from multimodal interrogation
    of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac
    disorders in disease-relevant cell lines under perturbed and unperturbed conditions.
- name: Enable interpretable genotype-phenotype learning
  response: As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project seeks
    to map the spatiotemporal architecture of human cells and use these maps toward the grand challenge
    of interpretable genotype-phenotype learning, stimulating research and development in "visible" machine
    learning systems informed by multi-scale cell and tissue architecture.
- name: Establish ethical, FAIR, AI-ready data standards
  response: The project implements a standards data management approach based on FAIR access and software
    principles, with deep provenance and replication packages for representation of cell maps and their
    underlying datasets; initiates a research program in ethical AI, especially as it relates to how maps
    will be used in genomic medicine and model interpretation; and stimulates a diverse portfolio of training
    opportunities in the emerging field of biomachine learning.
tasks:
- name: Multi-modal mapping of cellular structure and function
  response: A coordinated effort involving three complementary mapping approaches - proteomic mass spectrometry,
    cellular imaging, and genetic perturbation via CRISPR/Cas9 - creating a library of large-scale maps
    of cellular structure and function across demographic and disease contexts.
- name: Support for visible machine learning
  response: Cell maps provide a foundation for downstream applications in human genomics, including interpretation
    of genetic variants and mutations. They have been used in AI tools for "visible machine learning"
    or "visible neural networks" (VNNs) to interrogate how protein assemblies in the cell affect cell-level
    phenotype predictions.
- name: AI-ready dataset provision for functional genomics
  response: The releases are intended as AI-ready datasets to support research in functional genomics,
    AI model training, cellular process analysis, and study of cell architectural changes and interactions
    in the presence of specific disease processes, treatment conditions, or genetic perturbations.
addressing_gaps:
- name: Black-box machine learning in genomics and precision medicine
  response: In genomics and precision medicine, machine learning models are often "black boxes," predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs. This
    Bridge2AI data generation project generates a resource of matched data and tools to enable the creation
    of "visible" ML systems, which are not black boxes but are built directly on knowledge maps of cell
    and tissue architecture.
- name: Absence of ethically prepared, fully provenanced AI-ready biomedical data
  response: As defined by CM4AI, AI-Ready biomedical data are fully characterized FAIR data of known provenance,
    which can be ethically and reliably processed by AI applications; whose models and software are available
    and well-described for validation and re-use; and whose predictions may be fully explained and interpreted
    to the user as needed. CM4AI uses an expanded version of the FAIRSCAPE framework to establish a basis
    for AI-readiness, comprising FAIRness with rich metadata and persistent globally unique identifiers,
    machine-readable provenance graphs, and characterization and validation of all datasets and data elements
    mapped to public ontology vocabularies.
- name: Uncharted subcellular architecture
  response: Knowledge of how the proteins of the human genome are organized within cells is still very
    much evolving, and much of cell structure remains uncharted. Cell maps are hierarchical directed acyclic
    graphs in which each node represents an assembly of proteins in proximity at a given scale, spanning
    from large assemblies representing cell compartments to small assemblies such as protein complexes
    or subunits.
- name: Workforce gaps in biomedical AI/ML
  response: New training is needed to allow researchers to leverage the data sets produced by Bridge2AI
    and other programs. The Skills and Workforce Development module identified gaps in training of the
    functional genomic and biomedical AI/ML workforce and delivers asynchronous virtual training, hosted
    virtual events, CodeFest events and an in-person internship co-hosted at Yale University and the University
    of California San Diego.
