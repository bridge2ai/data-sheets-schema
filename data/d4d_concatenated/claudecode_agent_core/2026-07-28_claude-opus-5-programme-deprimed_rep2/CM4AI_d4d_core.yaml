id: https://cm4ai.org/
name: CM4AI Data Release Programme
title: Cell Maps for Artificial Intelligence (CM4AI) - Quarterly Data Release Programme
description: The Cell Maps for Artificial Intelligence (CM4AI) data-release programme is the ongoing quarterly
  data-publication series of CM4AI, the Functional Genomics Data Generation Project and Functional Genomics
  Grand Challenge of the U.S. National Institutes of Health Common Fund Bridge2AI program. The subject
  of this datasheet is the release series itself rather than any single release. CM4AI will deliver machine-readable
  hierarchical maps of cell architecture as AI-ready data, together with quarterly data releases of map-input
  data streams. Input data are generated by multimodal interrogation of chromatin modifiers, metabolic
  enzymes and other proteins involved in cancer, neuropsychiatric and cardiac disorders, in disease-relevant
  human cell lines under treated and untreated conditions, using mass-spectrometry-based proteomics (affinity
  purification mass spectrometry, AP-MS, and size-exclusion chromatography mass spectrometry, SEC-MS),
  spatial proteomics / immunofluorescence cell imaging, and genetic perturbation via CRISPR/Cas9 (single-cell
  CRISPRi perturb-seq). The cell lines under investigation are the triple-negative breast cancer line
  MDA-MB-468 (RRID:CVCL_0419), treated with paclitaxel or vorinostat versus untreated, and the induced
  pluripotent stem cell line KOLF2.1J (RRID:CVCL_B5P3), undifferentiated versus differentiated into neural
  progenitor cells, neurons and cardiomyocytes. Output data are packaged with provenance graphs and rich
  metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework, and are archived in
  LibraData, the University of Virginia's instance of Dataverse, an NIH-approved generalist repository.
  Four quarterly releases are represented here as resources, in date order - March 2025 (doi:10.18130/V3/B35XWX),
  June 2025 (doi:10.18130/V3/F3TD5R), October 2025 (doi:10.18130/V3/K7TGEM) and the current June 2026
  release (doi:10.18130/V3/HIGT4C). Each release carries its own DOI, Dataverse version, publication date
  and file inventory, and each is labelled a Beta release. The CM4AI portal reports programme-level totals
  of 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739
  genes targeted and 21.4 TB of data volume. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale,
  UT Austin, UA Birmingham, Simon Fraser University and the Hastings Center, as part of the NIH Bridge2AI
  program.
status: Ongoing quarterly Beta release series. Releases are stated to be regularly updated and augmented
  through the end of the project in November 2026. The University of Virginia Dataverse collection and
  the CM4AI portal both display the notice "This repository is under review for potential modification
  in compliance with Administration directives."
