  - slot: title
    snippet: "Artificial Intelligence Ready and\nEquitable Atlas for Diabetes\nInsights (AI- READI)"
  - slot: purposes[0].response
    snippet: "a data collection\nproject on type 2 diabetes mellitus (T2DM) to facilitate\nthe widespread use of artificial intelligence and machine\nlearning (AI/ML) approaches to study salutogenesis"
  - slot: description
    snippet: "target enrollment is 4000 people aged 40 and older, triple-\nbalanced by self- reported race/ethnicity"
  - slot: ethical_reviews[0]
    snippet: "approved by the Institutional Review Board\n(IRB) of the University of Washington (approval number\nSTUDY00016228),  including  reliance  agreements  with\nthe  IRBs  of  University  of  Alabama  at  Birmingham"
  - slot: informed_consent[0].consent_obtained
    snippet: "Written  informed\nconsent is provided by all participants."
  - slot: at_risk_populations.special_protections
    snippet: "Pregnancy  and  type  1\ndiabetes are exclusionary for participation."
  - slot: known_biases[0].bias_description
    snippet: "there  is  selection  bias\nknown  as  volunteer  bias  which  may  limit  the  generalis-\nability  of  the  results"
  - slot: sampling_strategies[0].strategies
    snippet: "Patients with\nT2DM and pre- diabetes are identified by screening elec-\ntronic health records for ICD- 10 diagnosis codes R73.09\nand E11.X"
  - slot: collection_timeframes[0].source_caveats
    snippet: "Enrolment began on 18 July 2023 and will continue until\n30  November  2026."
  - slot: data_collectors[0].collector_details
    snippet: "all research personnel at the three data sites who recruited,\nenrolled  and  collected  data  underwent  training  by  the\ndata  manager  at  UAB"
  - slot: ethical_reviews[1].review_details
    snippet: "A  Community  Advisory  Board  of  11  persons  from  the\nthree  sites"
  - slot: addressing_gaps[1].response
    snippet: "The\nprevalence of T2DM is higher in certain racial and ethnic\npopulations"
  - slot: collection_notifications[0].notification_details
    snippet: "Indi-\nviduals  in  each  pool  are  mailed  a  hardcopy  invitation\nletter and sent an invitation email"
