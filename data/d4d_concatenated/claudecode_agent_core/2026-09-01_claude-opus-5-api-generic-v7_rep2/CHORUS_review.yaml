notes: >-
  Three instrument/report findings outside the verdicts. (1) The reconciliation report's
  section 2.7 claims the geographic-context material survives in 'the external_resources
  repository listing, which names UF-Geocoding' — the final records' external_resources[0].description
  does not name UF-Geocoding; the removal itself was correct, but the report misstates where
  content survived (this also bears on slot-062, judged on the record as it is). (2) The
  coverage receipt attaches two snippets naming two different people (Manlik Kwong, Jared
  Houghtaling) to the single slot creators[5].principal_investigator.name — a wrong-entity
  receipt the deterministic validator cannot catch because both snippets are verbatim in
  their cited chunks (judged at slot-021). (3) The pack's records.claims is null — no
  claim-receipt sidecar existed to consult; the pack declares gaps: [] otherwise. The
  rule-13 verdict turns on the manifest declaring no rank; if a ranking convention exists
  outside data/preprocessed/source_manifest.yaml it was not discoverable from the pack's
  named inputs.
