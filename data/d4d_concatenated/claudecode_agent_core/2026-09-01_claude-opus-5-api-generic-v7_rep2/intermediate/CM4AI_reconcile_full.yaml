    The release is not yet in completed final form. Some datasets are under temporary
    pre-publication embargo; protein-protein interaction, protein localization and
    CRISPRi Perturb-seq data interrogate incompletely overlapping sets of proteins; and
    computed cell maps are not included in this release.

notes: >-
  CM4AI is organized into three pillars — Data, People, and Ethics — comprising six
  modules: Data Acquisition, Tools, and Standards (Data); Skills and Workforce
  Development, and Teaming (People); and Ethics. The project defines AI-Ready
  biomedical data as fully characterized FAIR data of known provenance, which can be
  ethically and reliably processed by AI applications; whose models and software are
  available and well-described for validation and re-use; and whose predictions may be
  fully explained and interpreted to the user as needed, against five interdependent
  criteria: FAIR, Provenanced, Characterized, Explainable, and Ethical. Persistent
  identifiers assigned by the FAIRSCAPE server use the ARK scheme, with DOIs a future
  feature as supplementary identifiers for final-state publishable work. Beyond research
  use, project data and tools have supported training and dissemination activities: they
  were made available at the CM4AI CodeFest in March 2024 with tutorials explaining how
  the data were derived and integrated, and an in-person internship hosted at Yale
  University and the University of California San Diego trains participants in the
  impact of cell maps on biomedical research applications, interaction with CM4AI data
  and standards, development of visible neural networks using cell maps, and integration
  of external data into an existing cell map.

source_caveats: >-
  The declared bundle contains five Dataverse release records in one series (May 2024,
  March 2025, June 2025, October 2025, June 2026). This record describes the June 2026
  Data Release, the highest-ranked and most recent source, which supersedes the October
  2025 release per the declared source ranking; earlier releases are recorded as related
  datasets rather than merged into this description. Figures that changed across releases
  are taken from the June 2026 record where it states them. Where it does not — notably
  the count of proteins imaged per condition (464 in the June 2025 and October 2025
  records, 563 in the March 2025 record) — the figure is attributed to its release in
  notes rather than asserted of this release. Project-level counts published on the CM4AI
  portal (1,374 protein interactions; 53,788 immunofluorescent images; 7,023 total
  proteins investigated; 11,739 genes targeted; 21.4 TB data volume) describe the project
  as a whole rather than this release and are not carried as slot values here. The Nature
  publication in the bundle (Schaffer et al., doi:10.1038/s41586-025-08878-3) describes a
  U2OS cell map produced by the same investigators and pipeline, acknowledging Bridge2AI
  funding; it is not a CM4AI data release and its U2OS-specific figures are not attributed
  to this dataset, though its methods are cited here where they describe the shared
  mapping pipeline. The repository reports file sizes only in rounded human-readable units,
  so no exact byte counts exist in the bundle; total_bytes is omitted on every file
  collection and total_size_bytes is omitted at dataset level rather than presenting
  conversions of rounded figures as exact. conforms_to and conforms_to_standard are
  asserted only on the release metadata archive, which is the RO-Crate-packaged component;
  the image, mass spectrometry and sequencing content is not stated by the bundle to
  follow a named content standard, so no dataset-level conforms_to is asserted. No
  downstream research, commercial or analytical use of this release is stated in the
  bundle, so existing_uses is omitted; the training and dissemination activities the
  bundle does describe are recorded in notes.