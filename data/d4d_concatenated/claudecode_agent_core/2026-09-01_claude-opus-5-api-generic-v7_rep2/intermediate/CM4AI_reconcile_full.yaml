raw_data_sources:
- source_description: >-
    Immunofluorescence confocal microscopy images of MDA-MB-468 cells generated in the
    Lundberg Lab at Stanford University using Human Protein Atlas antibody resources
    and automated fixation and permeabilization protocols.
  source_type: primary experimental data
  raw_data_format: Multi-channel confocal microscopy image files
- source_description: >-
    Size exclusion chromatography-mass spectrometry runs on KOLF2.1J iPSCs and
    derivatives and on MDA-MB-468 cells, generated in the Nevan Krogan laboratory at
    the University of California San Francisco.
  source_type: primary experimental data
  access_details: >-
    Deposited to the MassIVE Repository; separate MassIVE depositions for the human
    iPSC and human cancer cell SEC-MS data.
- source_description: >-
    Affinity purification-mass spectrometry runs on endogenously tagged MDA-MB-468
    cells under treatment conditions.
  source_type: primary experimental data
  access_details: >-
    Deposited to the MassIVE Repository; separate depositions for paclitaxel-treated
    and vorinostat-treated MDA-MB-468 AP-MS data.
- source_description: >-
    Single-cell CRISPRi perturbation screens (Perturb-seq) in MDA-MB-468 cells with
    and without treatment and in undifferentiated KOLF2.1J iPSCs, using the 10x
    Genomics 3'HT kit and a CRISPR lentiviral library.
  source_type: primary experimental data
  access_details: >-
    Raw sequence data deposited to the NCBI Sequence Read Archive under a BioProject
    accession. The June 2026 release records the underlying Perturb-seq depositions
    for both KOLF2.1J iPSCs and MDA-MB-468 cells as embargoed; the CRISPRi
    Perturbation Atlas of iPSCs is additionally available via Figshare.

acquisition_methods:
- acquisition_details: >-
    Protein-protein interactions mapped by affinity purification-mass spectrometry
    (AP-MS) on endogenously tagged cell lines. Seventeen genes were endogenously
    tagged in MDA-MB-468 and AP-MS data acquired under three conditions (untreated,
    paclitaxel treated, vorinostat treated), with 34 additional genes in the tagging
    process at the time of the preprint.
  was_directly_observed: true
  was_inferred_derived: false
- acquisition_details: >-
    Proteome-wide complex and interaction mapping by size-exclusion chromatography
    coupled to mass spectrometry (SEC-MS), used as an orthogonal mass
    spectrometry-based approach to AP-MS. SEC-MS on MDA-MB-468 cells under three
    conditions identified 72 of 100 chromatin modifiers, 52 of them integral
    components of protein complexes, and detected PPI profiles of over a thousand
    complexes. SEC-MS in KOLF2 iPSCs and derivatives uncovered more than 700 protein
    complexes in both parental iPSCs and differentiated neurons.
  was_directly_observed: true
- acquisition_details: >-
    Spatial subcellular organization mapped by immunofluorescence staining and
    high-resolution confocal microscopy using the Human Protein Atlas resource of
    antibodies, with automated fixation and permeabilization protocols established on
    a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
  was_directly_observed: true
- acquisition_details: >-
    Genetic perturbation mapping by single-cell CRISPR screens. A CRISPR lentiviral
    library targeting 100 chromatin factors with 6 guide RNAs per gene was designed;
    MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were generated and
    characterized; single-cell CRISPR screens were performed using the 10x Genomics
    3'HT kit.
  was_directly_observed: true

collection_mechanisms:
- mechanism_details: >-
    Mass spectrometry instrumentation for affinity purification and size exclusion
    chromatography workflows, applied to whole-cell extracts of the study cell lines.
- mechanism_details: >-
    Confocal microscopy with multi-channel immunofluorescence readout, using Human
    Protein Atlas primary antibodies against the protein of interest together with
    reference markers for nucleus (DAPI), endoplasmic reticulum (anti-calreticulin)
    and microtubules (anti-tubulin).
- mechanism_details: >-
    10x Genomics 3'HT single-cell kit for readout of CRISPRi perturbation screens,
    with a lentiviral guide RNA library and inducible dCas9 expression in the target
    cell lines.
- mechanism_details: >-
    Automated pipetting robot used for fixation and permeabilization of MDA-MB-468 and
    KOLF2 cells prior to immunofluorescence staining.

data_collectors:
- collector_details: >-
    Immunofluorescence spatial proteomics imaging was generated in the Lundberg Lab at
    Stanford University.
  role: academic_institution
- collector_details: >-
    SEC-MS protein-protein interaction data were generated in the Nevan Krogan
    laboratory at the University of California San Francisco.
  role: academic_institution
- collector_details: >-
    CRISPRi Perturb-seq genetic perturbation data were generated at the University of
    California San Diego.
  role: academic_institution

direct_collection:
- is_direct: false
  collection_details: >-
    Data were not collected from individuals. All data derive from established,
    commercially or institutionally available human cell lines: MDA-MB-468
    (RRID:CVCL_0419), available from ATCC, and KOLF2.1J (RRID:CVCL_B5P3), available
    from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource. CM4AI
    describes both lines as ethically sourced.

sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies: >-
    Targeted selection of proteins for interrogation rather than random sampling. The
    project targets 100 chromatin modifiers and 100 metabolic enzymes involved in
    cancer, neuropsychiatric, and cardiac disorders. For the KOLF2.1J Perturbation
    Cell Atlas the CRISPRi screen is expressed genome-scale, covering 11,739 targeted
    genes.
  why_not_representative: >-
    Data in this release were derived from commercially available de-identified human
    cell lines and do not represent all biological variants which may be seen in the
    population at large.
  source_data: >-
    MDA-MB-468 triple negative breast cancer cells and KOLF2.1J induced pluripotent
    stem cells and their differentiated derivatives.

collection_timeframes:
- timeframe_details: >-
    The declared bundle does not state a data collection start or end date. The
    Dataverse record gives the data creation date for this release as 2025-02-27 and
    states that the dataset will be regularly updated and augmented through the end of
    the project in November 2026. The NIH RePORTER record gives the award project
    period as 2022-09-01 to 2026-08-31, which bounds but does not define the collection
    window.
  source_caveats: >-
    The NIH RePORTER project end date (2026-08-31) and the Dataverse maintenance
    statement (end of project in November 2026) differ. Because neither figure is a
    collection date, no start_date or end_date is asserted.

preprocessing_strategies:
- preprocessing_details: >-
    Protein-protein interaction networks are processed using the node2vec deep
    learning model to reduce dimensionality, producing a PPI embedding that contains
    information about the protein's interactions.
- preprocessing_details: >-
    Immunofluorescence images are processed using a Human Protein Atlas deep learning
    model to reduce dimensionality, producing an image embedding that contains
    information about protein localization.
- preprocessing_details: >-
    The PPI and image embeddings are integrated to obtain a co-embedding for each
    protein using contrastive deep learning. The integration model learns
    co-embeddings such that the original embeddings can be reconstructed with minimal
    information loss and proteins with similar PPI and image embeddings have similar
    co-embeddings.
- preprocessing_details: >-
    Community detection is performed based on the all-by-all similarities of pairs of
    proteins in the co-embedding space; the resulting hierarchy of protein communities
    is output as the final cell map.
- preprocessing_details: >-
    Cell maps are annotated by alignment to known protein function and pathway
    resources including the Gene Ontology and Reactome, and by a large language model
    approach that names sets of proteins and assigns a name confidence score.

labeling_strategies:
- labeling_details: >-
    Cell map assemblies are annotated in a two-pronged approach: alignment to known
    protein function and pathway resources (Gene Ontology, Reactome) to determine
    assemblies with high overlap with known cell biology, and annotation using a large
    language model approach developed by the project to name sets of proteins and
    assign a name confidence score.
  data_annotation_protocol: >-
    The Gene Set AI (GSAI) pipeline uses an engineered prompt following chain-of-thought
    and one-shot strategies to query the LLM for a descriptive name, a confidence
    score, and a detailed reasoning essay for the protein members of each assembly.
  notes: >-
    In the related U2OS cell map work, in-person Annotation Jamborees were held in
    which approximately a dozen individuals worked in pairs to assign names and
    putative functional roles to assemblies on the basis of expert knowledge and
    literature curation, with LLM suggestions passed to a human curation team for
    final naming determination.

machine_annotation_tools:
- tools:
  - GPT-4
  tool_descriptions: >-
    Generative large language model used through the project's Gene Set AI (GSAI)
    pipeline to propose descriptive names, confidence scores, and referenced analysis
    essays for protein assemblies in cell maps.
- tools:
  - node2vec
  tool_descriptions: >-
    Deep learning model used to represent each protein as a feature vector based on
    its protein-protein interaction neighborhood.
- tools:
  - DenseNet-121
  tool_descriptions: >-
    Convolutional neural network pretrained for object recognition in protein
    immunofluorescence confocal images, used to represent each protein as a feature
    vector from the channels of the color image.
- tools:
  - HiDeF
  tool_descriptions: >-
    Hierarchical community Decoding Framework used for pan-resolution community
    detection, identifying protein communities at different resolutions and
    representing their hierarchical relationships as a directed acyclic graph.

intended_uses:
- use_category: AI-ready research data
  examples:
  - >-
    AI-ready datasets to support research in functional genomics.
- use_category: Model training
  examples:
  - AI model training.
- use_category: Biological analysis
  examples:
  - Cellular process analysis.
- use_category: Perturbation and disease analysis
  examples:
  - >-
    Analysis of cell architectural changes and interactions in the presence of specific
    disease processes, treatment conditions, or genetic perturbations.
- use_category: Interpretable machine learning
  examples:
  - >-
    Construction of "visible" machine learning systems and visible neural networks
    built directly on knowledge maps of cell and tissue architecture, rather than
    black-box models.
  usage_notes: >-
    Cell maps provide a foundation for downstream applications in human genomics,
    including interpretation of genetic variants and mutations.

prohibited_uses:
- prohibition_reason: >-
    These laboratory data are not to be used in clinical decision-making or in any
    context involving patient care without appropriate regulatory oversight and
    approval.

discouraged_uses:
- discouragement_details: >-
    The current release is most suitable for bioinformatics analysis of the individual
    datasets rather than integrated cell-map analysis, because computed cell maps are
    not included in this release.
- discouragement_details: >-
    Use without domain expertise is discouraged: the release requires domain expertise
    for meaningful analysis.

known_limitations:
- limitation_type: scope_limitation
  limitation_description: >-
    This is an interim release and does not contain predicted cell maps, which will be
    added in future releases.
- limitation_type: coverage_limitation
  limitation_description: >-
    Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi Perturb-seq data interrogate sets of proteins which incompletely overlap.
  scope_impact: >-
    Integrated multimodal analysis is constrained to the subset of proteins measured
    in more than one modality.
- limitation_type: methodological_limitation
  limitation_description: >-
    The release requires domain expertise for meaningful analysis; the current release
    is most suitable for bioinformatics analysis of the individual datasets.
- limitation_type: representativeness_limitation
  limitation_description: >-
    Some datasets are under temporary pre-publication embargo, so the release is not
    yet in completed final form.
  recommended_mitigation: >-
    Consult the External Data Links in the release record for the current availability
    status of embargoed depositions.

known_biases:
- bias_type: selection_bias
  bias_description: >-
    Data in this release were derived from commercially available de-identified human
    cell lines and do not represent all biological variants which may be seen in the
    population at large.
- bias_type: sampling_bias
  bias_description: >-
    Proteins interrogated were selected for their involvement in cancer,
    neuropsychiatric, and cardiac disorders — specifically 100 chromatin modifiers and
    100 metabolic enzymes — rather than sampled without regard to disease relevance.
  affected_subsets:
  - >-
    AP-MS, SEC-MS and immunofluorescence targets in the MDA-MB-468 arm.

