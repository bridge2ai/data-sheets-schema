distribution_formats:
- format: ZIP archive
  media_type: application/zip
  notes: >-
    All ten files in the June 2026 release are distributed as ZIP archives from the
    University of Virginia Dataverse (LibraData). Per-file MD5 checksums are published
    with each archive. Individual files below the repository's 1.9 GB download limit
    may be downloaded directly; the dataset as a whole is too large to download as a
    single ZIP, and the Dataverse Data Access API is offered for programmatic access.
- format: RO-Crate metadata package
  media_type: application/ld+json
  notes: >-
    CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready
    datasets in RO-Crate format using the FAIRSCAPE framework. The release metadata
    archive carries RO-Crate metadata and provenance graphs; earlier releases exposed
    RO-Crate metadata as individual ro-crate-metadata.json files and HTML provenance
    graph renderings.

