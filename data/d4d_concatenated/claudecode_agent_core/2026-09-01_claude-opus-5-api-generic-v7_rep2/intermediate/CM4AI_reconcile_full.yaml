other_tasks:
- task_details: >-
    Integrative structure modeling of protein communities. The project developed a
    bioinformatics pipeline for annotating cell map communities by available structural
    information about community members and their interactions, drawing on the Protein
    Data Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry,
    and prediction of disordered sequence segments, and ranking communities by the
    amount of available structural information as a proxy for modeling feasibility.
- task_details: >-
    Cell-type specificity analysis, distinguishing subcellular components specific to a
    given cell type from those more widely conserved, by comparing biophysical
    interaction patterns across cell types.
- task_details: >-
    Analysis of protein multi-localization, identifying single proteins and whole
    assemblies that localize to multiple subcellular compartments.

future_use_impacts:
- impact_details: >-
    Data derived from commercially available de-identified human cell lines do not
    represent all biological variants which may be seen in the population at large;
    models trained on these data may not generalize across populations.
- impact_details: >-
    The Ethics module anticipates potential applications of the data and derived AI/ML
    systems and integrates them into data governance frameworks to optimize benefits
    and mitigate potential risks, promoting their use for the collective good. Tools
    are being developed to enhance awareness and comprehension of the ethical, legal,
    and social ramifications associated with CM4AI data and the consequent AI systems.
- impact_details: >-
    Use in clinical decision-making or patient care without appropriate regulatory
    oversight and approval is an anticipated misuse the project explicitly forbids.

