purposes:
- response: >-
    To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data, produced from multimodal interrogation of chromatin modifiers, metabolic
    enzymes, and other proteins involved in cancer, neuropsychiatric, and cardiac
    disorders in disease-relevant cell lines under treated and untreated conditions.
- response: >-
    To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: >-
    To broadly stimulate research and development in "visible" machine learning
    systems informed by multi-scale cell and tissue architecture, which are not black
    boxes but are built directly on knowledge maps of cell and tissue architecture.
- response: >-
    To implement a standards data management approach based on FAIR access and
    software principles, with deep provenance and replication packages for
    representation of cell maps and their underlying datasets.
- response: >-
    To initiate a research program in ethical AI, especially as it relates to how maps
    will be used in genomic medicine and model interpretation, and to stimulate a
    diverse portfolio of training opportunities in the emerging field of biomachine
    learning.

addressing_gaps:
- response: >-
    In genomics and precision medicine, machine learning models are often "black
    boxes," predicting phenotypes from genotypes without understanding the mechanisms
    by which such translation occurs. The project addresses this deficiency by
    generating matched data and tools that enable the creation of "visible" ML
    systems.
- response: >-
    Human cells consist of a complex hierarchy of components, many of which remain
    unexplored, and much of cell structure still remains uncharted. The project
    addresses the absence of systematically mapped subcellular architecture.
- response: >-
    Cell mapping technologies have typically been applied separately; integration of
    multiple complementary data modalities provides the opportunity to incorporate
    biological structure robustly across physical scales, which single-modality
    datasets cannot support.

tasks:
- response: >-
    Interpretable genotype-phenotype learning: constructing "visible" machine learning
    systems and visible neural networks (VNNs) that interrogate how protein assemblies
    in the cell affect cell-level phenotype predictions.
- response: >-
    Construction of hierarchical cell maps as directed acyclic graphs, where each node
    represents an assembly of proteins in proximity at a given scale, spanning from
    large assemblies representing cell compartments to small assemblies of proteins in
    close proximity.
- response: >-
    Interpretation of genetic variants and mutations in human genomics using cell maps
    as a structural foundation.
- response: >-
    Protein community detection at multiple resolutions from self-supervised
    multimodal embeddings of protein interaction and imaging data.

instances:
- instance_type: Immunofluorescence confocal microscopy image of MDA-MB-468 cells
  data_substrate: B2AI_SUBSTRATE:19
  data_topic: B2AI_TOPIC:15
  label: false
  notes: >-
    Each image displays the spatial localization of one protein of interest in cells
    of the breast cancer cell line MDA-MB-468, imaged by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy. Nuclei were stained with DAPI (blue
    channel); endoplasmic reticulum with a calreticulin antibody (yellow channel);
    microtubules with tubulin antibody (red channel); and antibody against the protein
    of interest (green channel). Imaging in the June 2026 release covers three
    conditions: untreated, paclitaxel treated, and vorinostat treated. The June 2025
    release states 464 proteins of interest per condition; the March 2025 release
    stated 563 proteins of interest per condition.
- instance_type: >-
    Size exclusion chromatography-mass spectrometry protein elution profile
  data_substrate: B2AI_SUBSTRATE:59
  data_topic: B2AI_TOPIC:26
  label: false
  notes: >-
    SEC-MS data cover MDA-MB-468 breast cancer cells with and without treatment,
    undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron progenitor cells,
    neurons, and cardiomyocytes. The CM4AI data release documentation states SEC-MS
    captures approximately 7,000 proteins for both the iPSC and TNBC flagship
    datasets.
- instance_type: Affinity purification-mass spectrometry protein-protein interaction
  data_substrate: B2AI_SUBSTRATE:58
  data_topic: B2AI_TOPIC:26
  label: false
  notes: >-
    AP-MS data in the June 2026 release cover MDA-MB-468 breast cancer cells with
    treatment, distributed as separate paclitaxel and vorinostat packages.
- instance_type: >-
    Single-cell CRISPRi perturbation transcriptional profile (Perturb-seq)
  data_substrate: B2AI_SUBSTRATE:64
  data_topic: B2AI_TOPIC:34
  label: false
  notes: >-
    Perturb-seq data cover MDA-MB-468 breast cancer cells with and without treatment
    and undifferentiated (parental) KOLF2.1J iPSCs. The KOLF2.1J Perturbation Cell
    Atlas maps transcriptional and fitness phenotypes associated with 11,739 targeted
    genes.

subpopulations:
- subpopulation_elements_present: true
  identification: >-
    Cell line and treatment condition. Two cell lines are interrogated: the MDA-MB-468
    triple negative breast cancer line and the KOLF2.1J induced pluripotent stem cell
    line. MDA-MB-468 is studied untreated (DMSO control), paclitaxel treated, and
    vorinostat treated. KOLF2.1J is studied undifferentiated (parental) and as
    iPSC-derived neural progenitor cells, neurons, and cardiomyocytes.
  distribution: >-
    Distribution of instances across cell line and condition is not stated uniformly
    across modalities in the declared bundle. Immunofluorescence imaging in the June
    2026 release is distributed as three per-condition archives for MDA-MB-468 alone
    (untreated 4.6 GB, vorinostat 4.2 GB, paclitaxel 3.8 GB); AP-MS is distributed
    only for treated MDA-MB-468 (paclitaxel and vorinostat).
  notes: >-
    MDA-MB-468 (RRID:CVCL_0419) was established from a metastatic site pleural
    effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma.
    KOLF2.1J (RRID:CVCL_B5P3) was derived from a healthy male Northern European donor.

