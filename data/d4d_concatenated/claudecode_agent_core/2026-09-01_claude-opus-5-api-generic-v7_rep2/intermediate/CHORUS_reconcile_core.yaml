    from ICU, PICU, and NICU in the current released dataset; the September 2025 cohort 2
    webinar states that as of August 2025 the dataset covered 14 different hospitals with
    over 45K unique admissions. The higher-ranked project documentation figure is given here.
    The NIH RePORTER abstract describes an intended data set from more than 100,000 critically
    ill patients, matching the anticipated final dataset of 100,000 patient admissions on
    the project website.
- instance_type: Row of structured electronic health record data standardized to the OMOP
    Common Data Model, covering demographics, medication administration, provider-documented
