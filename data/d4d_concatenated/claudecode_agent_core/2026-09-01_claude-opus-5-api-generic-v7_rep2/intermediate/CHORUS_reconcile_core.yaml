title: 'Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI'
id: https://chorus4ai.org/
name: CHoRUS
description: CHoRUS is a multicenter, multimodal, high-resolution, retrospectively collected
  critical care dataset assembled by the Patient-Focused Collaborative Hospital Repository
  Uniting Standards (CHoRUS) for Equitable AI project, one of four data generation projects
  in the NIH Bridge2AI consortium. The collaboration spans 20 academic centers with more than
  60 consortium members, of which 14 contribute data as Data Acquisition centers. The released
  dataset described on the project website comprises 50,000 patient admissions from intensive
  care units (ICU, PICU, and NICU), 1.6 billion rows of OMOP-standardized electronic health
  record data, 7,642 admissions with radiology data, and 23 Tb of waveform data; the anticipated
  final dataset covers 100,000 patient admissions and 9 different data modalities from 14
  contributing hospitals. Data types include demographics, medication administration (time-stamped
  at each infusion change or dose administration), provider-documented procedures and diagnoses,
  and high-frequency nursing flowsheets standardized to the OMOP Common Data Model; clinical
  notes extracted and tokenized with the OHNLP toolkit; imaging drawn from hospital PACS in
  DICOM; waveform telemetry from bedside monitors and gateway/middleware in WFDB; and hospital
  EEG waveforms in EDF+ and Persyst formats. Every data type is under controlled access in
  a cloud enclave, with clinical notes stored locally at contributing sites except for tokens.
  The project also sequesters a holdout test set for external validation of models, and develops
  standards, tooling, ethics research, and workforce training around the resource.
source_caveats: 'Counts differ between the project documentation at chorus4ai.org and the
  September 2025 AIM-AHEAD cohort 2 informational webinar; the differences are recorded on
  the individual instance entries they affect, with the higher-ranked project documentation
  preferred where the two describe the same quantity. NIH RePORTER names Eric S. Rosenthal
  as the sole principal investigator of OT2OD032701; the five further individuals recorded
  as creators are named in the cohort 2 webinar only as members of the Bridge2AI CHoRUS Leadership
  Team, and no principal investigator role is asserted for them here. The modality table in
  the webinar PDF (data type, data standard, access control, metadata, published metadata
  schema) is heavily garbled in text extraction, so the per-modality assignment of the "Metadata:
  Yes / Planned" column could not be reliably reconstructed and is not asserted here; only
  the data standards, the uniformly controlled access, and the named published metadata schemas
  are recorded. The program manager contact address is transcribed exactly as printed on chorus4ai.org
  ("cmccrary@mgh.havard.edu"), which appears to contain a typographical error in the domain.'
