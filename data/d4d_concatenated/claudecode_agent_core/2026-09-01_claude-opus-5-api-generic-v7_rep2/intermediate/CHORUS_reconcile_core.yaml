updates:
  update_details: The dataset is growing from the current released 50,000 admissions toward
    an anticipated final dataset of 100,000 patient admissions and 9 data modalities across
    14 contributing hospitals. As of August 2025, imaging de-identification for a larger cohort
    and EEG extraction were in process, and published metadata for some data types was planned.
    The NIH project period runs to 2026-11-30.
extension_mechanism:
  extension_details: Data contributing sites follow an interactive workflow diagram and standard
    operating procedures in the Chorus_SOP repository to extract and contribute clinical data,
    and post problems in the Standards or Data Acquisition discussion spaces. Clinical collaborators
    can contribute to semantic mapping through the chorus-mapping repository and its clinical
    validation SOP. Sites submit regular status updates either through the GitHub interface
    or a Google Form, which triggers a GoogleScript that updates status and issue information
    via the GitHub API into the Standards Project or the Data Acquisition Project.
  contribution_url: https://github.com/chorus-ai
ethical_reviews:
- review_details: Community-facing ethics focus groups are performed to determine what data
    is appropriate for public sharing.
  reviewing_organization: CHoRUS consortium, Ethical and Trustworthy AI pillar
- review_details: The consortium evaluates community perspectives on clinical care AI to find
    ways to increase trustworthiness of provenance and privacy in AI, and develops new approaches
    as the existing legal and regulatory landscape is analyzed. Patient-focused efforts determine
    the ethical and legal approaches to manage privacy and bias while accounting for social
    determinants of health.
  reviewing_organization: CHoRUS consortium
human_subject_research:
  involves_human_subjects: true
  special_populations:
  - Pediatric intensive care unit (PICU) admissions
  - Neonatal intensive care unit (NICU) admissions
  regulatory_compliance:
  - The project established a legal framework for collecting data at scale and analyzes the
    existing legal and regulatory landscape for clinical care AI.
  source_caveats: The bundle does not state IRB approval for the dataset or name an ethics
    review board of record.
license_and_use_terms:
  license_terms: Participants in the AIM-AHEAD Bridge2AI for Clinical Care Training Program
    must sign a licensing agreement, included in the program registration form, before gaining
    access to the dataset; that program also requires an institutional (".edu") email address
    for dataset access. All data types are described as controlled access.
  source_caveats: The bundle states no general license for the data themselves and no access
    terms outside the training program context. The MIT License stated on the chorus-ai GitHub
    organization page applies to that project's software repositories (several individual
    repositories are marked MIT and Chorus_SOP is marked Apache-2.0).
data_governance:
  access_review_process: Every data type in the dataset is released under controlled access
    and held in a cloud enclave, except clinical notes, which remain stored locally at contributing
    sites with only tokens available centrally. For the AIM-AHEAD Bridge2AI for Clinical Care
    Training Program (cohort 2), participants fill out a registration form giving name, email,
    and institution and must sign a licensing agreement included in that form before gaining
    access to the dataset; once access is granted and compute is provisioned, an email is
    sent to the participant. That program also requires a ".edu" email address to gain access
    to the dataset, and states that program administrators will assist with access where needed.
  committee_contact:
    name: Jared Houghtaling
    id: mailto:jared.houghtaling@tuftsmedicine.org
  notes: 'The chorus-ai GitHub organization page gives two access request contacts: dbold@emory.edu
    and jared.houghtaling@tuftsmedicine.org.'
  source_caveats: The bundle names no data access committee, no committee membership, and
    no organization formally accountable for the data over time; the contacts recorded here
    are the access request addresses printed on the chorus-ai GitHub organization page, and
    the name behind the Emory address is not stated in the bundle. The registration, licensing
    agreement, and ".edu" email requirements are attested only for participants in the AIM-AHEAD
    Bridge2AI for Clinical Care Training Program and are described as such rather than as
    dataset-wide policy.
is_deidentified:
  method: Tokenization of unstructured electronic health record text and transformation of
    data using approaches that limit re-identification; de-identification of imaging.
  deidentification_details: As of August 2025, roughly 1,000 images were available with de-identification
    in process for a larger cohort. Supporting tooling in the chorus-ai organization includes
    a privacy scan tool for medical records and a CTP-deid repository. Clinical notes are
    kept at the contributing site and only tokens are released into the enclave.
