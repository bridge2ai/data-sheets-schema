purposes:
- response: To meet the need for data supporting machine learning and artificial intelligence
    applications aimed at characterizing acute and critical care illness, predicting complications,
    and measuring treatment response among patients with acute or critical illness.
- response: To develop a publicly available, AI-ready critical care dataset while ensuring
    the methods promote privacy, accountability, and clinical benefit.
- response: To provision a holdout test set, accessible for model external validation, to
    aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
- response: To create ethically sourced datasets and tools around artificial intelligence
    and to create best practices for AI in health, and to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving recovery
    from acute illness.
- response: To cultivate expertise in the lay and scientific community and to develop the
    skills and workforce for a next generation of academic and community AI scientists and
    clinicians.
tasks:
- response: Characterizing acute and critical care illness.
- response: Predicting complications and clinical deterioration among patients with acute
    or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
- response: External validation of machine learning models against a sequestered holdout test
    set.
- response: Labeling data with targets important for prediction using a visualization and
    annotation environment.
addressing_gaps:
- response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care; developing high-resolution multi-center data sets
    is a critical first step towards actionable and trustworthy AI.
- response: The project addresses the challenge of acquiring an AI-ready data set from more
    than 100,000 critically ill patients across a multi-center network, spanning data standards,
    tool development, ethics, and workforce development.
- response: Existing clinical data lack unified standards across modalities; unified standards
    are needed to harmonize multi-modal EHR, waveform, imaging, and text data.
