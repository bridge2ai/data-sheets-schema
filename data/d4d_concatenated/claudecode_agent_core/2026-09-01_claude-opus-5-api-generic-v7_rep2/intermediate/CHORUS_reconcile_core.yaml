known_limitations:
- limitation_type: coverage_limitation
  limitation_description: 'Modality coverage was incomplete at the time of the reporting:
    as of August 2025 imaging de-identification was in process for the larger cohort with
    about 1,000 images available, and EEG extraction was still in process.'
- limitation_type: integration_limitation
  limitation_description: Clinical notes are stored locally at contributing sites rather than
    in the cloud enclave; only tokens are available centrally, so full text cannot be analyzed
    alongside the other modalities in the enclave.
- limitation_type: scope_limitation
  limitation_description: The dataset is restricted to retrospectively collected admissions
    of critically ill patients (ICU, PICU, NICU) at 14 contributing hospitals, and is available
    only under controlled access.
confidential_elements:
- confidential_elements_present: true
  confidentiality_details: 'Clinical notes are not held in the cloud enclave: they are stored
    locally at contributing sites and only tokens are available centrally. All listed data
    types are released under controlled access.'
subpopulations:
- subpopulation_elements_present: true
  identification: Admissions in the released dataset are drawn from ICU, PICU, and NICU.
  source_caveats: The bundle does not give the distribution of admissions across ICU, PICU,
    and NICU, nor any demographic breakdown of the cohort.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset consists of patient-level clinical data from critically
    ill patients, including demographics, diagnoses, medication administration, procedures,
    nursing flowsheet documentation, clinical notes, radiology imaging, physiologic waveform
    telemetry, EEG, and social determinants of health together with geographic contextual
    factors.
acquisition_methods:
- acquisition_details: Retrospective extraction of clinical data recorded during routine hospital
    care at the data contributing sites, delivered to CHoRUS as site-specific clinical data
    extracts prepared according to validated standard operating procedures and uploaded using
    the chorus-extract-upload tooling.
collection_mechanisms:
- mechanism_details: Extraction from hospital electronic health record systems, covering demographics,
    medication administration recorded at each infusion change or dose administration, provider
    documentation of procedures and diagnoses, and high-frequency nursing flowsheet documentation.
- mechanism_details: Extraction of imaging studies from hospital picture archiving and communication
    systems (PACS).
- mechanism_details: Capture of waveform telemetry from bedside monitors via gateway/middleware.
- mechanism_details: Extraction of EEG waveforms from the hospital EEG database.
- mechanism_details: Extraction and tokenization of unstructured clinical notes from the electronic
    health record using the OHNLP toolkit.
collection_timeframes:
- timeframe_details: Retrospective data collection from clinical records already generated
    during hospital care. Dataset contents reported in the cohort 2 webinar are stated as
    of August 2025.
data_collectors:
- collector_details: Fourteen data contributing hospitals, drawn from a collaboration spanning
    20 academic centers, act as Data Acquisition centers and prepare and submit CHoRUS data
    extracts.
  role: Data contributing site
- collector_details: The CHoRUS Standards, Data Acquisition, and Tooling sub-teams support
    sites with standard operating procedures, semantic mappings, tooling, and status tracking
    of data delivery.
  role: Consortium sub-team
raw_data_sources:
- source_description: Structured electronic health record data held in the clinical systems
    of contributing hospitals.
  source_type: Hospital electronic health record system
- source_description: Unstructured clinical notes held in the electronic health record.
  source_type: Hospital electronic health record system
  raw_data_format: Free text
  access_details: Notes remain stored locally at contributing sites; only tokenized output
    is moved into the enclave.
- source_description: Radiology imaging studies held in hospital picture archiving and communication
    systems.
  source_type: Hospital PACS
  raw_data_format: DICOM
- source_description: Telemetry waveforms streamed from bedside monitors through gateway/middleware.
  source_type: Bedside physiologic monitoring
- source_description: EEG recordings held in the hospital EEG database.
  source_type: Hospital EEG database
  raw_data_format: EDF+ and Persyst
sampling_strategies:
- strategies:
  - Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment
    strategies across the multi-center network.
  - Federated access enabling sampling methods that ensure a balanced and diverse cohort.
preprocessing_strategies:
- preprocessing_details: Source clinical data are standardized to the OMOP Common Data Model;
    nursing flowsheet data use the OMOP schema with extensions.
- preprocessing_details: Unstructured electronic health record data are tokenized; clinical
    notes are extracted and tokenized using the OHNLP toolkit, with the notes themselves retained
    locally at the contributing site and only tokens moved into the enclave.
- preprocessing_details: Data are transformed using approaches that limit re-identification.
- preprocessing_details: Waveforms are prepared and converted for release using the waveform
    conversion scripts and documentation maintained in the chorus_waveform and chorus_waveform_resources
    repositories.
cleaning_strategies:
- cleaning_details: Characterization reports are produced from each site data submission and
    returned to the contributing site (CHoRUSReports).
- cleaning_details: 'Semantic mappings are validated: pooled tabular mappings in the chorus-mapping
    repository are reviewed by clinical collaborators following an associated clinical validation
    standard operating procedure, and the standard operating procedures in the Chorus_SOP
    repository have undergone internal validation and review.'
labeling_strategies:
- labeling_details: A visualization and annotation environment is used to label data with
    targets important for prediction.
machine_annotation_tools:
- tools:
  - OHNLP toolkit
  tool_descriptions: Clinical notes are extracted from the electronic health record and tokenized
    using the OHNLP toolkit; the tokenized output follows the OHNLP open-source schema.
existing_uses:
- examples:
  - The datasets are being used for training activities and publications.
- examples:
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, up to 30 trainees,
    November 2025 to July 2026) uses the dataset for hands-on AI/ML training on the Bridge2AI
    AI/ML for Clinical Care Collaborative Cloud, including canonical Jupyter Notebooks, the
    OHDSI tool stack, and the OHDSI/OMOP common data model.
  - Trainees develop practical use cases, present works-in-progress posters at the Bridge2AI
    and AIM-AHEAD annual meetings, and may submit conference abstracts or manuscripts.
intended_uses:
- use_category: Model development for acute and critical care
  usage_notes: Building machine learning and AI-derived models that characterize acute and
    critical care illness, predict complications, and measure treatment response, to improve
    the care and outcomes of patients requiring critical care.
- use_category: External validation of models
  examples:
  - Evaluating externally developed models against the sequestered holdout test set to aid
    marketplace adoption of AI models for acute and critical care.
- use_category: Training and workforce development
  usage_notes: Hands-on AI/ML training, use case development, and collaborative research on
    the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
- use_category: Equity and social determinants research
  usage_notes: Analyses that account for social determinants of health and contextual data
    elements such as geographic distance to the nearest hospital, supporting work on managing
    privacy and bias.
distribution_formats:
- format: OMOP Common Data Model tables covering demographics, medication administration,
    procedures, diagnoses, and nursing flowsheets
  notes: Controlled access; held in the cloud enclave. Published metadata schema is the OMOP
    schema, with extensions for high-frequency nursing flowsheet documentation.
- format: Tokenized clinical notes in the OHNLP open-source schema
  notes: Controlled access; notes are stored locally at contributing sites except for tokens.
- format: DICOM imaging from PACS
  notes: Controlled access; published metadata schema is the DICOM schema.
- format: WFDB waveform telemetry
  notes: Controlled access; published metadata schema is an extended PhysioNet schema. The
    current released dataset contains 23 Tb of waveform data.
- format: EEG waveform in EDF+ and Persyst formats
  notes: Controlled access; published metadata schemas are the open-source EDF+ and Persyst
    schemas.
