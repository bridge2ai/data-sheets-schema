title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: AI-READI dataset
description: 'A multimodal, AI-ready dataset of 2,280 adult participants with and without
  type 2 diabetes mellitus (T2DM), collected between 19 July 2023 and 1 May 2025 at three
  United States sites (University of Alabama at Birmingham, University of California San Diego,
  and University of Washington) and harmonized across those sites. AI-READI (Artificial Intelligence
  Ready and Equitable/Exploratory Atlas for Diabetes Insights) is one of the data generation
  projects of the NIH Common Fund Bridge2AI program, and this release is version 3.0.0 of
  its flagship dataset. The cohort is recruited so as to approach an equal distribution across
  self-reported race/ethnicity (Asian, Black, Hispanic, White), biological sex, and four diabetes
  categories (no diabetes; pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin
  injectable medication; insulin-controlled), with the stated goal of supporting artificial
  intelligence and machine learning research into salutogenesis, the pathway from disease
  back to health. Each participant contributes data from a single visit across more than ten
  domains: self-reported surveys (including social determinants of health), physical measurements
  and vitals, cognitive screening, monofilament testing for peripheral neuropathy, vision
  testing, 12-lead electrocardiography, blood and urine laboratory results, multi-device retinal
  imaging (color fundus photography, fundus autofluorescence, near-infrared reflectance, optical
  coherence tomography, OCT angiography, and fluorescence lifetime imaging ophthalmoscopy),
  and ten days of at-home monitoring by continuous glucose monitor, wrist-worn activity tracker,
  and a custom indoor environmental sensor. The release comprises 356,343 files totalling
  approximately 3.82 TB, organized according to the Clinical Dataset Structure specification,
  with each data type mapped to an established standard (OMOP CDM, DICOM, WFDB, Open mHealth,
  and the NASA ASCII file format guidelines for Earth science data). This public release contains
  no protected health information; information on participant sex, race/ethnicity, and medications
  is withheld and available only in a separate controlled-access set.'
notes: 'A smaller "mini" version of the dataset is available for pipeline development alongside
  the full release. The release also carries nine root-level metadata files required by the
  Clinical Dataset Structure specification — CHANGELOG.md, dataset_description.json, dataset_structure_description.json,
  healthsheet.md, LICENSE.txt, participants.json, participants.tsv, README.md and study_description.json
  — of which participants.tsv carries the recommended training/validation/testing split. Device
  manufacturers supported the study in kind: Topcon Corporation (Tokyo, Japan), Optomed (Oulu,
  Finland), iCare World (Raleigh, NC) and Carl Zeiss (Oberkochen, Germany) loaned their devices
  for research purposes at no cost, while Heidelberg Engineering (Heidelberg, Germany), Dexcom
  (San Diego, CA) and Garmin (Olathe, KS) provided research discounts on study devices; the
  Microsoft AI for Good Lab supported the cloud services needed for the project. Biospecimens
  are collected but are not part of this data release: plasma, serum, buffy coats, genomic
  DNA, PAXgene-stabilised RNA and peripheral blood mononuclear cells are banked at the University
  of Alabama at Birmingham Center for Clinical and Translational Science for future proteomics,
  metabolomics, genomics, gene expression and immunological studies, with the FAIRhub study
  record noting biospecimen retention of "Samples With DNA". Both the FAIRhub platform and
  the documentation site display the notice "This repository is under review for potential
  modification in compliance with Administration directives."'
source_caveats: 'Sources in the bundle disagree on three points, resolved here in favour of
  the higher-ranked source with the alternative recorded. First, institutional attribution:
  the FAIRhub dataset description and study record (tier 1) name Washington University in
  St. Louis as managing organization and lead sponsor, and the license (tier 2) names it as
  licensor, whereas the BMJ Open protocol publication, the Nature Metabolism comment (tier
  3) and NIH RePORTER (tier 4) centre the project on the University of Washington; the FAIRhub
  attribution is used. Second, target enrollment: the FAIRhub study record (tier 1) gives
  an anticipated enrollment of 4,000, matching the BMJ Open protocol and the Nature comment,
  while the IRB protocol application (tier 2) states 4,600 across the four groups; 4,000 is
  used. Third, collection start date: FAIRhub gives 19 July 2023 while the protocol publication
  gives 18 July 2023; the FAIRhub date is used. In addition, the project acronym is expanded
  two ways across sources, as "Artificial Intelligence Ready and Equitable Atlas for Diabetes
  Insights" in the BMJ Open protocol and Nature comment and as "Artificial Intelligence Ready
  and Exploratory Atlas for Diabetes Insights" in NIH RePORTER, the FAIRhub healthsheet and
  README, and the RO-Crate; the official study title recorded in FAIRhub is "AI Ready and
  Exploratory Atlas for Diabetes Insights". `total_size_bytes` is taken from the FAIRhub API
  `data.size` field (3815969779678) rather than summed from the per-collection `total_bytes`
  values, which cover the nine data-type subcrates but not the root metadata files.'
