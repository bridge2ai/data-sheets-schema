purposes:
- response: To create and publicly share a flagship, ethically sourced, AI-ready multimodal
    dataset on type 2 diabetes mellitus that enables future generations of artificial intelligence
    and machine learning research to provide critical insights into T2DM, including salutogenic
    pathways to return to health.
- response: To develop a foundational dataset in T2DM that is agnostic to existing classification
    criteria or biases and that can be used to reconstruct a temporal atlas of T2DM development
    and reversal towards health.
- response: To establish and disseminate standards, best practices and guidelines for the
    collection, preparation and sharing of data for AI/ML purposes, so that the project can
    serve as a blueprint for future data generation projects; this includes adherence to the
    FAIR (Findable, Accessible, Interoperable, Reusable) principles and the development of
    new standards such as the Clinical Dataset Structure.
- response: To increase access to and quality of AI/ML research by recruiting and training
    personnel, including through a year-long AI-READI research internship program.
tasks:
- response: Artificial intelligence and machine learning research into the pathogenesis and
    salutogenesis of type 2 diabetes mellitus.
- response: Pseudotime manifold analysis, an approach used to predict disease trajectories
    by collecting and learning from complex, multimodal data from participants with differing
    disease severity, from normal to insulin-dependent T2DM.
- response: Multimodal model development combining survey, clinical, imaging, waveform, wearable
    and environmental data for a single cohort.
addressing_gaps:
- response: The lack of diverse datasets that are AI ready for training AI models on type
    2 diabetes; the ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large and inclusive
    multimodal datasets.
- response: Under-representation of racialized groups in prior T2DM research. A meta-epidemiological
    review of T2DM studies published from 2000 to 2020 indicated that samples lacked racial
    and ethnic diversity; AI-READI deliberately recruits four race/ethnic groups in approximately
    equal proportions rather than mirroring the United States demographic distribution.
- response: Limited current understanding of salutogenesis in T2DM, that is, the pathway from
    disease back to health, as opposed to pathogenesis.
- response: Absence of datasets structured to permit downstream pseudotime manifold analysis
    of disease trajectories using complex multimodal data from participants spanning a range
    of disease severity.
