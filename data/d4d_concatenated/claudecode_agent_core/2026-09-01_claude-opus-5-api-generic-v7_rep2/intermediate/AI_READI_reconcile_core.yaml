instances:
- instance_type: Individual study participant
  counts: 2280
  label: false
  label_description: No explicit label or target is associated with each data instance. No
    labeling was performed, because the dataset is hypothesis agnostic and aimed at facilitating
    multiple potential downstream AI/ML applications.
  notes: Each instance consists of all of the data available for one individual participating
    in the study, spanning survey data, clinical data (laboratory values, cognitive and monofilament
    testing, physical and vision assessments), retinal imaging data, 12-lead electrocardiography,
    environmental sensor data, continuous glucose monitor data, and wearable activity monitor
    data. These encompass tabular data, imaging data, and physiological signal or waveform
    data; no unstructured text data is included. Version 1.0.0 held 204 instances and version
    2.0.0 held 1,067.
  source_caveats: 'No enumerated topic or substrate term is asserted for the instance: the
    bundle supplies no topic or substrate classification for instances, and the instance spans
    survey, clinical, imaging, waveform, wearable and environmental data forms that no single
    term covers.'
anomalies:
- anomaly_details: In survey data, skipped questions or incomplete responses are expected.
- anomaly_details: For wearable devices, improper use and technical failure such as battery
    failure or system malfunction are expected. The Garmin Vivosmart 5 battery had to be charged
    every two to three days, producing gaps in the activity record.
- anomaly_details: In imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are expected.
- anomaly_details: Not all modalities are available for all participants. Some participants
    elected not to participate in some study elements. In a few cases the data collection
    device had no stored results or was returned too late to retrieve them, for example because
    the battery died or data was lost. In a few cases a data collision may have occurred at
    some point in the process and data has been lost.
- anomaly_details: Image quality for the handheld undilated Optomed Aurora fundus camera varies
    from patient to patient and within the same patient, because obtaining a good view is
    challenging without pupil dilation and the device is handheld.
- anomaly_details: Fluorescence lifetime imaging ophthalmoscopy is performed last in the visit
    because it takes longer than a standard OCT and exposes patients to uncomfortable levels
    of light, so participants may not be at their best possible compliance. The device cannot
    tolerate more than one centimetre of movement during image acquisition, and background
    light or lens fluorescence can contaminate the signal.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers, so there is selection bias known as volunteer
    bias, which may limit the generalisability of results to those not represented in the
    study population.
- bias_type: sampling_bias
  bias_description: Recruitment pools were identified by screening the electronic health records
    of three academic health systems for diabetes and prediabetes ICD-10 codes among patients
    with a recent encounter, so the study base is patients already engaged with those health
    systems rather than a general population sample.
  mitigation_strategy: Uniform data collection protocols were implemented for all subjects
    irrespective of race/ethnicity, biological sex or diabetes severity, across all study
    sites, and the selection of study sites was intended to ensure varied representation and
    minimize the potential for sampling bias.
- bias_type: representation_bias
  bias_description: Recruitment is deliberately balanced across four self-reported race/ethnic
    categories (Asian, Black, Hispanic, White) rather than mirroring the demographic distribution
    of the United States population, and other groups such as Pacific Islanders and Native
    Americans are not included. Recruiting Black men into health research is documented as
    more difficult than recruiting other populations, and similar under-recruitment trends
    have been reported for Hispanic and Asian persons.
  mitigation_strategy: Recruitment proceeds in waves whose composition is monitored for diversity
    and inclusion and adjusted by under- and oversampling groups as needed; new recruitment
    strategies were to be implemented if sample balancing on race/ethnicity emerged as a challenge.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: Recruitment was predominantly urban and hospital-based, which may
    not fully capture all possible cultural and socioeconomic backgrounds. The study cohort
    may not provide a comprehensive representation of the population, as it does not include
    other races and ethnicities such as Pacific Islanders and Native Americans.
  scope_impact: Limits the generalization of models derived from the dataset to populations
    outside the four recruited race/ethnic categories and outside urban academic health systems.
  recommended_mitigation: Three recording sites were strategically selected for geographic
    variability across the United States and to ensure representation across various racial
    and ethnic groups, and individuals from all demographic backgrounds were recruited at
    all three sites.
- limitation_type: coverage_limitation
  limitation_description: Participants were required to speak, read and understand English.
    The protocol publication notes this requirement may have created challenges in recruiting
    Hispanic and/or Asian persons.
- limitation_type: temporal_limitation
  limitation_description: The study is cross-sectional and there is currently only one visit
    per participant, so disease trajectories cannot be observed directly within an individual.
    A longitudinal arm is planned in which approximately 10% of the cohort is invited back
    for a follow-up visit in year four of the project.
- limitation_type: scope_limitation
  limitation_description: Enrollment is ongoing and the intended balance across race/ethnicity,
    biological sex and diabetes presence and severity has not been achieved in interim releases;
    the pilot data release and periodic updates may not have achieved balanced distribution
    across groups.
- limitation_type: scope_limitation
  limitation_description: The Snellen visual acuity variables present in the previous version
    were dropped in version 3.0.0, so only logMAR visual acuity measurements are available.
- limitation_type: scope_limitation
  limitation_description: The biorepository of blood derivatives held at the University of
    Alabama at Birmingham contains a finite number of samples to share with scientists interested
    in using them in research; procedures for reviewing and prioritising written requests
    were to be developed before the biorepository is complete. Biospecimens are not part of
    this data release.
- limitation_type: methodological_limitation
  limitation_description: Multiple imaging devices were used for the same measure, and device
    make and model, including specific modalities such as macula scans or wide scans during
    OCT, were documented to ensure repeatability. Device diversity enhances generalizability
    but introduces between-device variation that users must account for.
