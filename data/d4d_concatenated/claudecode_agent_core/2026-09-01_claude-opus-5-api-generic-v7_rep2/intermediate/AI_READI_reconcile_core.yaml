    and Obesity Research Center laboratory
  source_type: Central clinical laboratory report
  raw_data_format: CSV
sampling_strategies:
- is_sample: true
  is_random: false
  strategies: Non-probability sampling. The study base is all patients aged 40 years or older
    who had a medical encounter within each health system site between 2020 and 2025. Patients
    with T2DM and pre-diabetes are identified by screening electronic health records for ICD-10
    diagnosis codes E11.X and R73.09 respectively; patients without diabetes will not have
    encounters with these codes. Participants are recruited in waves whose composition and
    size are influenced by the observed participation characteristics of race/ethnicity, gender,
    severity of T2DM and site. For each wave a contact pool is identified by screening electronic
    health records; individuals are mailed a hardcopy invitation letter and sent an invitation
    email, both personalised with links, access codes and QR codes directing them into an
    online REDCap recruitment interface. Recruitment targets equal proportions of four race/ethnic
    groups, four T2DM categories and both biological sexes.
  why_not_representative: Building balanced datasets is critical for the development of unbiased
    machine learning models, so rather than targeting the demographic distribution of the
    US population the study is triple-balanced by recruiting the four race/ethnic groups,
    four diabetes categories and both sexes in equal proportions. All study groups are recruited
    from each site, but the proportion of each group varies with the demographic prevalence
    of that group in the site's geographical area.
  source_caveats: 'No representativeness determination is asserted: no source in the bundle
    states one. The healthsheet states that the dataset contains all possible instances, meaning
    all participants enrolled by the collection cut-off, and answers "N/A" to the question
    about sampling strategy for a sample of a larger set; the FAIRhub study record separately
    records the sampling method as "Non-Probability Sample". Both statements are reconciled
    here: the release is a census of those enrolled, drawn non-probabilistically from the
    health-system study base.'
raw_sources:
- raw_data_details: Raw data are saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but are not anticipated to be shared outside
    the project team at present, because they have not been mapped to standardized terminologies
    and because they may accidentally include personal health information or personally identifiable
    information, for example in free text fields. There is a possibility that raw data may
    be included in future releases of the controlled-access dataset.
preprocessing_strategies:
- preprocessing_details: Mapping of all data to standardized terminologies wherever possible.
    Clinical data are mapped to the Observational Medical Outcomes Partnership Common Data
    Model, with each CSV file in the clinical_data directory a one-to-one mapping to an OMOP
    CDM table. Current medications are coded with RxNorm codes.
- preprocessing_details: Conversion of imaging data to the Digital Imaging and Communications
    in Medicine standard. All participant images are exported from the imaging devices in
    their raw format; Topcon Maestro2 and Triton exports in .fda format and the Heidelberg
    FLIO export in .sdt format are converted to DICOM for the dataset, while the Optomed,
    EIDON, Spectralis and Cirrus devices export DICOM directly.
- preprocessing_details: Conversion of wearable data to the Open mHealth standard. The Garmin
    Vivosmart 5 exports in .FIT format and is converted to the mHealth standard for the dataset;
    continuous glucose monitor data follow the same standard.
- preprocessing_details: Conversion of electrocardiogram data, exported from the Philips device
    as XML, to the WaveForm DataBase format, and of environmental sensor data to the NASA
    ASCII file format guidelines for Earth science data.
- preprocessing_details: 'Organization of the whole release according to the Clinical Dataset
    Structure specification v0.1.1: one directory per data type at the root, one directory
    per modality within each data type, one directory per device within each modality, and
    one directory per participant within each device, with a manifest.tsv metadata file for
    each data type.'
- preprocessing_details: Application of static data watermarking to identify the licensee
    for security purposes, for both the public and controlled sets.
- preprocessing_details: Removal of protected health information, and of sex, race/ethnicity
    and medication information, from the public release. No instances were excluded from the
    dataset at the time of preprocessing.
cleaning_strategies:
- cleaning_details: 'Quality control at the time of data entry and acquisition. Clinical data
    outside expected minimum and maximum ranges were flagged in REDCap and appeared in reports
    viewed by clinical research coordinators and data managers, who examined participant records
    and determined whether an error was likely. Data were checked, and edited if errors were
    detected, for: credibility, based on range checks determining whether all responses fall
    within a prespecified reasonable range; incorrect flow through prescribed skip patterns;
    missing data that can be directly filled from other portions of an individual''s record;
    and the omission or duplication of records. Editing was only done under the guidance and
    approval of the site principal investigator. If corrected data was available from elsewhere
    in the respondent''s answers the error was corrected; if there was no logical or appropriate
    way to correct the data, the site principal investigator reviewed the values and decided
    whether they should be removed.'
- cleaning_details: Internal review by AI-READI team members for quality checks and to ensure
    that no personally identifiable information was accidentally included. The dataset has
    not undergone any formal external audits.
- cleaning_details: An OMOP Common Data Model data quality analysis is distributed with the
    release as dqd_omop.json, supporting the OMOP CDM Data Quality Dashboard, which runs a
    set of more than 3,500 data quality checks against an OMOP CDM instance.
other_tasks:
- task_details: The dataset is deliberately hypothesis agnostic; no labels are provided and
    no specific downstream task is prescribed, so it may support analytical tasks beyond those
    originally planned by the creators. The release includes a recommended 70/15/15 training,
    validation and testing split so that arbitrary downstream tasks can be evaluated on a
    partition balanced for age, sex, race/ethnicity and diabetes status.
future_use_impacts:
- impact_details: The dataset creators state that, to the extent of their knowledge, they
    do not currently anticipate any uses of the dataset that could result in unfair treatment
    or harm. They note a theoretical risk of future re-identification, and observe that AI
    algorithms can infer individual patient characteristics and could facilitate individual-level
    identification; to prevent re-identification attempts the project implements a robust
    data dissemination system, a strict license agreement and data watermarking for both the
    public and controlled sets.
- impact_details: Because the public release omits sex and race/ethnicity, models developed
    on it cannot be audited directly for disparity across those groups by users of the public
    set. The project mitigates this by supplying a recommended training/validation/test split
    whose validation and test partitions are balanced as well as possible for sex, race/ethnicity
    and diabetes status, stated as aimed at reducing disparities in models developed using
    this dataset.
intended_uses:
- use_category: Disease-specific research
  examples:
  - Type 2 diabetes related research; access is granted on the condition that the requester
    agrees to use the data only for type 2 diabetes related research.
  usage_notes: Accessing the dataset requires logging in through a verified ID system, agreeing
    to use the data only for type 2 diabetes related research, and agreeing to the license
    terms.
- use_category: AI and machine learning model development
  examples:
  - Training, validating and testing AI/ML models on multimodal clinical, imaging, waveform,
    wearable and environmental data; the license explicitly permits making, reproducing and
    distributing models, algorithms and programs developed, trained or adapted using the data,
    provided they do not themselves contain the data.
  usage_notes: Before disseminating such models, licensees must undertake all reasonable efforts
    to minimize the likelihood that data can be memorized, derived, reconstructed or reconstituted
    through the use or construction of those models.
- use_category: Commercial and non-commercial research
  examples:
  - The license grants a non-exclusive, non-transferable license to download, reproduce and
    use the data, and to create derivative works, for research, commercial and non-commercial
    purposes.
prohibited_uses:
- prohibition_reason: Making clinical treatment decisions based on the data is prohibited;
    the license states the data is intended solely as a research resource.
- prohibition_reason: Using or attempting to use the data, alone or in concert with other
    information, to compromise the confidentiality of information about a data subject, to
    invade or compromise their privacy, to identify or contact any data subject or group of
    data subjects, to extract or extrapolate identifying information, to establish a data
    subject's membership in a particular group of persons, or otherwise to cause harm or injury
    to any data subject.
- prohibition_reason: Sharing or distributing the data with any third party model vendor or
    developer for training or development purposes, even where that vendor holds a HIPAA Business
    Associate Agreement with the licensee's institution; training here includes model weight
    modification and other adjustments to a model's logic or operation. Short-term interaction
    such as prompting or querying a third party model under a BAA is permitted for analysis.
- prohibition_reason: Transferring, licensing, sublicensing, selling, assigning, displaying,
    sharing or otherwise conveying any portion of the data or any derivative work to a third
    party that is not another licensee bound by an identical agreement with the licensor.
- prohibition_reason: Reproducing the data in papers, articles, presentations, analyses, reports
    or publications, except that small representative samples may appear in up to five images
    or figures per paper for illustrative purposes; larger amounts may not be published, posted
    or made available via supplemental files, zip archives, code packages or other means.
- prohibition_reason: Removing, obscuring, altering or masking the static watermarking that
    may be applied to the data to identify the licensee for security purposes.
- prohibition_reason: Storing the data anywhere other than servers and devices maintained
    by and located within the licensee's institution, or cloud or remote storage and backup
    services that have a HIPAA-approved Business Associate Agreement in place with that institution.
distribution_formats:
- format: DICOM medical imaging files
  media_type: application/dicom
  access_urls:
  - https://fairhub.io/datasets/3/access
- format: Comma-separated values tables
  media_type: text/csv
  access_urls:
  - https://fairhub.io/datasets/3/access
- format: JSON metadata files
  media_type: application/json
  access_urls:
  - https://fairhub.io/datasets/3/access
- format: Markdown documentation files
  media_type: text/markdown
  access_urls:
  - https://fairhub.io/datasets/3/access
  notes: The release also contains tab-separated manifest.tsv files for each data type and
    a participants.tsv file at the root. All data files are in formats accessible with free
    software commonly used for such data types, so no specific software is required.
distribution_dates:
- release_dates: Version 1.0.0 released 3 May 2024, comprising data from the pilot data collection
    phase.
- release_dates: Version 2.0.0 released 8 November 2024, comprising data collected up to the
    end of the first full year of the study.
- release_dates: Version 3.0.0 released 17 November 2025, comprising data collected between
    19 July 2023 and 1 May 2025.
  source_caveats: The BMJ Open protocol publication describes the first public release as
    made available in May 2024 and all data collected through 31 July 2024 as made available
    in November 2024; the FAIRhub records give the precise release dates used here.
maintainers:
- role: academic_institution
  maintainer_details: The AI-READI team supports and maintains the dataset. It is hosted on
    FAIRhub through Microsoft Azure. Contact information is provided in the README file included
    with the dataset and via https://aireadi.org/contact; the central contact recorded in
    the study description is Aaron Lee at contact@aireadi.org, and the documentation site
    provides a contact page at https://docs.aireadi.org/docs/3/contact.
updates:
  frequency: Approximately once a year
  update_details: The dataset is released as static versions and is not updated in place.
    New versions are released with additional instances as more study participants complete
    the study visit, approximately once a year, adding data from participants enrolled since
    the last version release. Version 1.0.0 held 204 participants, version 2.0.0 held 1,067
    and version 3.0.0 holds 2,280. Changes between versions are detailed in the CHANGELOG
    file included in the dataset and visible at the documentation site. Enrollment is ongoing
    and future versions are expected.
retention_limit:
  retention_details: There are no limits on the retention of the data associated with the
    instances; participants were not told that their data would be retained for a fixed period
    and then deleted.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024; version 2.0.0, DOI 10.60775/fairhub.2,
    released 8 November 2024; version 3.0.0, DOI 10.60775/fairhub.3, released 17 November
    2025.
  version_details: Each version has its own DOI and its own documentation, navigable from
    a version dropdown at the documentation site. Version 2.0.0 is recorded on FAIRhub and
    in its documentation as no longer accessible. The healthsheet notes that datasheets exist
    for the first and second versions at the version 1 and version 2 healthsheet pages of
    the documentation site. Version 2.0.0 comprised 165,051 files and 2.01 TB; version 3.0.0
    comprises 356,343 files and 3.82 TB.
extension_mechanism:
  extension_details: There is currently no mechanism for others to extend or augment the AI-READI
    dataset outside of those who are involved in the project.
ethical_reviews:
- reviewing_organization: University of Washington Institutional Review Board, Human Subjects
    Division
  review_details: Approved under protocol number STUDY00016228, with initial approval on 20
    December 2022 and reliance agreements with the IRBs of the University of Alabama at Birmingham
    and the University of California, San Diego. Written informed consent is provided by all
    participants. Annual renewal is required within 90 days of expiration. The IRB Reliance
    Team can be contacted at hsdrely@uw.edu.
  source_caveats: The BMJ Open protocol publication states the study "was approved by the
    Institutional Review Board (IRB) of the University of Washington"; the RO-Crate names
    the IRB organization "Washington University IRB" while giving a University of Washington
    Human Subjects Division address. The two are treated here as the same body under two renderings
    of its name.
- reviewing_organization: AI-READI ethics review
  review_details: The RO-Crate metadata records the ethical review for the release as Camille
    Nebeker, Debra Mathews, Kadija Ferryman and Nicholas Evans. Ethical, legal and social
    implications are considered at every stage of the project cycle, with guidance from bioethicists,
    and a Community Advisory Board of eleven persons drawn from the three sites, including
    diversity in race and ethnicity as represented in the AI-READI sample, contributes to
    development of the protocol.
data_protection_impacts:
- impact_details: No data protection impact analysis has been conducted for the dataset, as
    recorded in the healthsheet collection section.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - University of Washington IRB protocol STUDY00016228. Initial approval was received on
    20 December 2022, with reliance agreements with the IRBs of the University of Alabama
    at Birmingham and the University of California, San Diego. An annual renewal application
    reporting the status and progress of the study is required and due within 90 days of expiration.
    The initial approval letter is published with the version 3.0.0 documentation.
  ethics_review_board: Washington University IRB, contactable through the IRB Reliance Team
    at hsdrely@uw.edu, at the Human Subjects Division, University of Washington, 4333 Brooklyn
    Ave NE Box 359470, Seattle, WA 98195-9470, United States.
  regulatory_compliance:
  - The FAIRhub study record states the human subject review status as "Submitted, approved",
    that the study is not an FDA-regulated drug study, is not an FDA-regulated device study,
    and has no Data Monitoring Committee. The RO-Crate records fdaRegulated as false and humanSubjectResearch
    as "Yes". Licensees must comply with the data security and privacy standards established
    by the NIH under its Genomic Data Sharing Policy.
  special_populations:
  - No protected population is targeted. The cohort comprises adults aged 40 to 85 with and
    without type 2 diabetes; pregnant individuals, people with gestational diabetes and people
    with type 1 diabetes are excluded.
  source_caveats: The RO-Crate names the reviewing body "Washington University IRB" while
    giving a University of Washington Human Subjects Division postal address and a uw.edu
    contact address; the BMJ Open protocol publication states the study "was approved by the
    Institutional Review Board (IRB) of the University of Washington". The two are treated
    here as the same body under two renderings of its name.
informed_consent:
- consent_obtained: true
  consent_type: Written informed consent, obtained either as electronic consent with an electronic
    signature through REDCap before the visit, or in person at the start of the visit.
  consent_scope: Consent covers the study protocol, placement of the resulting de-identified
    data in an open-source repository, and the sending of biospecimens to the study sample
    repository for use in future research. The FAIRhub dataset description records the consent
    type as "ConsentSpecifiedNotElsewhereCategorised" with the note that the public version
    of the dataset can only be used for type 2 diabetes related research while a private version
    will allow more generic use; consent is not restricted to non-commercial use, is not geographically
    restricted, is not restricted by research type, is not genetic-only, and does not prohibit
    methods development.
  consent_documentation: The approved University of Washington consent form is published with
    the version 3.0.0 documentation as "AI-READI Consent_Form_Standard_Mod17May2023_useforpilot.pdf".
  withdrawal_mechanism: Participants may withdraw consent at any time and cease study participation;
    data already shared or used remains in the dataset, as stated in the consent document.
at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - 'Eligibility is restricted to adults aged 40 years and older, with an upper limit of 85
    years, so no minors are enrolled. Pregnancy, gestational diabetes and type 1 diabetes
    are exclusion criteria. Participants must be able to provide consent. Incidental findings
    are managed protectively: coordinators alert participants before they leave a visit to
    blood pressure or heart rate readings that warrant emergency care, and suspected retinal
    detachment, tumour or optic disc oedema triggers immediate follow-up with referral to
    the emergency department or to an ophthalmologist.'
license_and_use_terms:
  license_terms: AI-READI Data License Agreement version 2.0, published at https://doi.org/10.5281/zenodo.17555036,
    with Washington University in St. Louis as licensor. The agreement grants a non-exclusive,
    non-transferable license to download, reproduce and use the data and to create derivative
    works for research, commercial and non-commercial purposes, subject to strong requirements
    around data usage, security and secondary sharing intended to protect study participants,
    especially where data is reused for AI and ML applications. Access may be taken in an
    individual capacity or on behalf of an authorized group within an institution, in which
    case the licensee sublicenses to authorized users and is fully liable for their acts and
    omissions. The license terminates automatically on any breach, whereupon all copies must
    be deleted. Licensees must acknowledge the licensor and the source and any funder of the
    data in any papers reporting use of the data. The data is provided on an "as is" basis
    without warranty of any kind, and the licensor's aggregate liability is capped at one
    US dollar except for death or personal injury caused by the licensor's negligence where
    applicable law prohibits limitation.
  data_use_permission: disease_specific_research
  notes: The FAIRhub landing page labels the license "Health Data License" and the FAIRhub
    dataset description names it "AI-READI custom license v2.0". The documentation site is
    shared separately under CC-BY 4.0.
ip_restrictions:
  restrictions:
  - Title to the data, and all industrial and intellectual property rights therein, remain
    solely and exclusively with the licensor and its suppliers at all times, and the licensee
    must not take any action inconsistent with such ownership. Any rights not expressly granted
    in the license are reserved to the licensor and its suppliers. The RO-Crate carries the
    copyright notice "Copyright © 2026 AI-READI". Licensees must indemnify, defend and hold
    harmless the licensor and its suppliers against claims arising from the licensee's use
    of the data or any model, including claims asserting infringement of patent, copyright
    or other intellectual or industrial property rights. Publishers and conference organizers
    wishing to reproduce larger amounts of data may be referred to the licensor for a separate
    license.
regulatory_restrictions:
  regulatory_restrictions:
  - The license requires licensees to comply with all applicable laws, regulations and restrictions
    relating to the distribution and use of the data and of models built from it. The healthsheet
    answers questions about export controls and other regulatory restrictions by referring
    to the license.
  other_compliance: Licensees must comply with all data security and privacy standards established
    by the US National Institutes of Health under its Genomic Data Sharing Policy from time
    to time, the current version being the NIH Best Practices for Controlled-Access Data Subject
    to the NIH Genomic Data Sharing Policy. The FAIRhub dataset description records deIdentHIPAA
    as true and the public release is stated to contain no protected health information as
    defined by the HIPAA Privacy Rule. The study is recorded as not FDA-regulated for either
    drug or device.
  notes: The RO-Crate records a confidentialityLevel of "HL7:2N (normal)" for the release
    and each of its subcrates.
  source_caveats: 'No HIPAA compliance status term is asserted: no source in the bundle states
    a compliance determination for the dataset. What the sources do state — that the release
    contains no PHI, that FAIRhub''s deIdentHIPAA flag is true, and that results were returned
    to participants by HIPAA-compliant encrypted email — is recorded in `other_compliance`
    instead.'
data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: 'Accessing the dataset requires several steps: logging in through
    a verified ID system; agreeing to use the data only for type 2 diabetes related research;
    and agreeing to the license terms, which set restrictions and obligations for data usage.
    The FAIRhub access type is recorded as PublicDownloadSelfAttestationRequired. A separate
    controlled-access set, containing the sensitive elements withheld from the public release,
    is available only to scientists whose institutions have completed legal and privacy use
    agreements with the AI-READI research programme; the requirements for the controlled-access
    set were still being developed by the Data Access Committee at the time of the protocol
    publication.'
  notes: The RO-Crate metadata records the data governance committee as the AI-READI Consortium.
    The BMJ Open protocol publication refers, without naming it further, to a Data Access
    Committee developing the controlled-access requirements. General contact is via https://aireadi.org/contact
    and contact@aireadi.org; the documentation site provides a contact page at https://docs.aireadi.org/docs/3/contact.
  source_caveats: 'No contact person is asserted for the governance committee: no source in
    the bundle designates one. On accountable organization, the FAIRhub dataset description
    and study record (tier 1) name Washington University in St. Louis (ROR https://ror.org/01yc7t268)
    as managing organization and lead sponsor, and the license (tier 2) names it as licensor,
    whereas the BMJ Open protocol publication, the Nature Metabolism comment (tier 3) and
    NIH RePORTER (tier 4) centre the project on the University of Washington, and the RO-Crate
    names the principal investigator''s department as the Department of Ophthalmology, University
    of Washington. The FAIRhub value is preferred here as the higher-ranked source.'
is_deidentified:
  identifiable_elements_present: false
  method: The FAIRhub dataset description states that no identifiers were collected so no
    active de-identification was necessary, and that the project checked that no identifiable
    data per US HIPAA were present in the data.
  identifiers_removed: Protected Health Information; additionally sex, race/ethnicity and
    medications used, which are withheld to prevent stigmatization of findings and are available
    only in the controlled-access set.
  deidentification_details: 'The FAIRhub dataset description records deIdentType "NoDeIdentification"
    with deIdentDirect true and deIdentHIPAA true. The RO-Crate metadata records deidentified:
    true. The Nature Metabolism comment separately describes the public set as "stripped of
    Protected Health Information (PHI), as defined by the HIPAA ... Privacy Rule via the ''Safe
    Harbor'' method", as well as of information related to the sex and race/ethnicity of the
    participants to prevent stigmatization of findings.'
  source_caveats: Sources are in tension on whether a de-identification procedure was applied.
    FAIRhub (tier 1) records the de-identification type as "NoDeIdentification" and explains
    that no identifiers were collected so none was necessary, while the Nature Metabolism
    comment (tier 3) states the public set is stripped of PHI via the HIPAA Safe Harbor method.
    The tier 1 statement is given in `method`; the tier 3 statement is recorded in `deidentification_details`
    rather than merged into it. The healthsheet question on measures taken to avoid re-identification
    of individuals was left unanswered.
is_tabular: false
external_resources:
- external_resources: Dataset documentation at https://docs.aireadi.org/, with a separate
    documentation set for each dataset version; the version 3.0.0 documentation covers citation,
    preliminary information on access and training prerequisites, the mini-subset version
    and Azure Storage access, per-domain dataset documentation including the healthsheet,
    AI-readiness considerations, and additional resources.
  restrictions:
  - The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
    associated with its use.
- external_resources: AI-READI project website at https://aireadi.org/
- external_resources: GitHub organization of the AI-READI project at https://github.com/AI-READI
