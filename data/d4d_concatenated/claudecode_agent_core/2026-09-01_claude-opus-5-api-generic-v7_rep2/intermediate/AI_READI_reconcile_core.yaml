- external_resources: Clinical Dataset Structure specification v0.1.1 at https://cds-specification.readthedocs.io/en/v0.1.1/,
    the standard that governs the directory layout and metadata files of this release.
- external_resources: ClinicalTrials.gov registration NCT06002048 for the AI-READI study,
    at https://classic.clinicaltrials.gov/ct2/show/NCT06002048.
  source_caveats: The FAIRhub study description records the ClinicalTrials.gov secondary identifier
    NCT06002048; the BMJ Open protocol publication instead states "Clinicaltrials. org approval
    number STUDY00016228", which is the same string the same publication and the RO-Crate
    give as the University of Washington IRB protocol number.
