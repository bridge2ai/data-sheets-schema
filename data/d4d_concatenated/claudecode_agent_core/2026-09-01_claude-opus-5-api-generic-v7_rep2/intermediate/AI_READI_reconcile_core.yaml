sensitive_elements:
- sensitive_elements_present: false
  sensitivity_details: The public dataset does not contain data considered sensitive. Data
    held under controlled access, and therefore absent from this release, include 5-digit
    ZIP code, sex, race, ethnicity, genetic sequencing data, past health records, medications,
    and traffic and accident reports. Information related to the sex and race/ethnicity of
    participants, and medications used, has been removed from this release.
acquisition_methods:
- was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: Acquisition varied by domain. Some data were directly observable, such
    as laboratory results, vitals and retinal imaging; other data were reported by subjects,
    such as survey responses. Verification of data entry was performed where possible, for
    example by cross-referencing entered medications against medications that were physically
    brought in or photographed by each study participant.
  source_caveats: The healthsheet answer this object draws on distinguishes only directly
    observable from subject-reported acquisition and does not state whether any values were
    inferred or derived, so no value is asserted for that field. Some released values are
    in fact computed from other measurements — body mass index, waist-hip ratio and log contrast
    sensitivity — as recorded in the variables slot.
collection_mechanisms:
- mechanism_details: 'REDCap electronic data capture, used for collecting patient-reported
    questionnaire data and the following clinical data from the visit: medications assessment,
    vitals, visual acuity, contrast sensitivity, monofilament test results and complete blood
    count test results. REDCap also hosted the recruitment interface and electronic consent.
    Clinical data outside expected minimum and maximum ranges were flagged in REDCap for review.'
- mechanism_details: Philips PageWriter TC30 Cardiograph, used for a 12-lead electrocardiogram
    performed while the participant sits in a reclining chair or lies supine, with the position
    recorded relative to supine as 0, 30, 60 or 90 degrees. Exported as XML and released in
    WaveForm DataBase format.
- mechanism_details: Dexcom G6 continuous glucose monitor, a real-time integrated continuous
    glucose monitoring system that directly monitors blood glucose levels without finger sticks,
    capturing readings every five minutes from a filament sensor inserted under the skin.
    Worn for ten continuous days; participants were masked to the results during the monitoring
    period.
- mechanism_details: Garmin Vivosmart 5 wrist-worn physical activity monitor, worn for ten
    consecutive days on the participant's preferred wrist, sampling at five-second intervals
    and recording steps, heart rate, sleep duration, oxygen saturation, respiratory rate,
    stress and calorie data. Participants returned a form specifying which wrist the tracker
    was worn on and their dominant hand.
- mechanism_details: LeeLab Anura, a custom-designed indoor environmental sensor unit built
    for the AI-READI project at the Karalis Johnson Retina Center, University of Washington,
    and placed for ten days in an area of the participant's home that is frequently used.
    It records particulate matter counts, temperature, relative humidity, volatile organic
    compounds, nitrogen oxides and eleven multi-spectral light intensity measurements. The
    device does not capture video or audio, is not equipped with GPS location monitoring and
    is not synced with participant-owned devices.
- mechanism_details: 'Retinal imaging devices: Optomed Aurora IQ handheld non-mydriatic fundus
    camera; iCare EIDON widefield TrueColor confocal fundus imaging system; Heidelberg Engineering
    Spectralis HRA optical coherence tomography and OCT angiography; Heidelberg Engineering
    fluorescence lifetime imaging ophthalmoscope; Topcon Healthcare Maestro2 3D OCT-1; Topcon
    Healthcare Triton DRI OCT; and Carl Zeiss Meditec Cirrus 5000 Angioplex. All retinal images
    are collected under dilated conditions except the Optomed.'
- mechanism_details: Montreal Cognitive Assessment administered electronically on an iPad
    using the MoCA Duo application from MoCA Cognition, Quebec, Canada, which captures all
    patient responses interactively; the total score, section subscores, Memory Index Score
    and task completion times were exported as CSV.
- mechanism_details: Blood pressure and heart rate measured twice, separated by two minutes,
    with an automatic oscillometric medically approved device. Devices used across sites were
    the OMRON HEM 907XL Blood Pressure Monitor, the Medline MDS4001 Automatic Digital Blood
    Pressure Monitor, and the Welch Allyn 6000 series vital signs monitor with Welch Allyn
    FlexiPort reusable blood pressure cuff.
- mechanism_details: 'Vision testing instruments: M&S Technologies Electronic Visual Acuity
    tester at four metres for photopic and, through a 2.0 neutral density filter, mesopic
    acuity; Mars Letter Contrast Sensitivity chart from Mars Perceptrix, read monocularly
    at approximately 50 cm under photopic and mesopic conditions; Topcon KR 800 autorefractor
    and keratometer; and lensometers, namely the NIDEK LM-600P and the Topcon CL-200 and CL-300
    computerized lensometers.'
- mechanism_details: Monofilament testing for peripheral neuropathy using a standard 10 g
    monofilament applied to three locations on the plantar surface of each foot, ten times
    per location, with the participant's eyes closed and shoes and socks removed; results
    recorded on an iPad, laptop or paper questionnaire and entered into REDCap by clinical
    research staff.
- mechanism_details: Blood and urine collection during the visit for clinical laboratory assay.
    Non-fasting blood of approximately 53 mL is drawn; one EDTA vacutainer is dedicated to
    a local clinical testing laboratory for complete blood count analysis, and whole blood,
    plasma, serum and urine for central assays are batch-shipped on dry ice to the University
    of Washington Nutrition and Obesity Research Center. Results are returned in CSV format.
collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: 'Data in version 3.0.0 were collected between 19 July 2023 and 1 May
    2025, covering the pilot phase and the first two years of the study. The overall project
    timeline spans four years: one year for protocol development and training, and years two
    to four for subject recruitment and data collection. Preliminary pilot enrolment ran from
    18 July 2023 to 30 November 2023 and the formal data collection process began on 1 December
    2023. The FAIRhub study record gives an actual start date of 19 July 2023 and an anticipated
    completion date of 1 January 2027.'
  source_caveats: The FAIRhub dataset description and study record give a collection start
    of 19 July 2023; the BMJ Open protocol publication states that "Enrolment began on 18
    July 2023 and will continue until 30 November 2026". The FAIRhub value is preferred here
    as the higher-ranked source, and the protocol's dates are recorded for completeness.
data_collectors:
- role: Clinical research coordinator
  collector_details: Responsible for contacting and consenting research participants, ushering
    participants through the research visit, conducting study visits including collection
    of ophthalmologic images, providing training on study procedures such as continuous glucose
    monitoring or the fitness tracker, and ensuring the return of all study materials. All
    research personnel at the three data sites who recruited, enrolled and collected data
    underwent training by the data manager at the University of Alabama at Birmingham and
    worked from a detailed Manual of Procedures. Successful completion of a certification
    process was required for all coordinators, including mandatory institutional compliance
    training for human subject research and successful administration of all protocol elements
    to at least three volunteer practice subjects.
- role: Research assistant
  collector_details: Conducts study visits including collection of ophthalmologic images,
    provides training on study procedures such as continuous glucose monitoring and the fitness
    tracker, ensures the return of study materials, and is responsible for data upload and
    management from each clinic visit, under the direction of the study coordinator or project
    manager.
- role: Data manager
  collector_details: Data managers at each site oversee the data collection process and are
    responsible for the quality control of all data before uploading to FAIRhub; the data
    manager at the University of Alabama at Birmingham trained research personnel at all three
    sites.
- role: Retinal imaging technician
  collector_details: Operates the retinal imaging devices and is trained to detect certain
    conditions that are potentially life or vision threatening, specifically retinal detachment,
    tumour and optic disc oedema.
- role: Phlebotomist and laboratory assistant
  collector_details: The phlebotomist is responsible for blood collection from research participants
    and the laboratory assistant for processing and shipping samples.
- role: Clinical laboratory staff
  collector_details: Clinical Laboratory Improvement Amendments-certified laboratories local
    to each data collection site perform complete blood count testing on fresh whole blood
    samples; all other laboratory tests are performed by the University of Washington Nutrition
    and Obesity Research Center testing facility using stored, frozen samples.
missing_data_documentation:
- missing_data_patterns: Not all modalities are available for all participants; the number
    of files per data type varies substantially, from 2,246 continuous glucose monitoring
    participant records and 2,232 environmental sensor files to 173,721 OCT angiography files.
  missing_data_causes: Some participants elected not to participate in some study elements.
    In a few cases the data collection device had no stored results or was returned too late
    to retrieve them, for example because the battery died or data was lost. In a few cases
    a data collision may have occurred and data has been lost. Survey respondents skip questions
    or leave responses incomplete. Wearable devices fail through improper use, battery failure
    or system malfunction; the Garmin battery required charging every two to three days, creating
    gaps. Imaging sessions can be abandoned for quality reasons, for example when the Heidelberg
    Spectralis is operated manually and image quality is inadequate.
  handling_strategy: Missing values are not imputed. Missing data that can be directly filled
    from other portions of an individual's record were filled during cleaning under site principal
    investigator approval; where no logical or appropriate correction existed, the site principal
    investigator decided whether values should be removed.
