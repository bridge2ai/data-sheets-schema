notes: >-
  The three adverse evidence findings share one shape: content true of a neighboring
  scope or kind pulled into the wrong claim — a pediatric collection fact (line 5570)
  in the adult acquisition entry (slot-009), an export-controls-only denial (2206)
  widened to all regulatory restrictions (slot-015), and a Zenodo citation read as an
  archival attestation (slot-029). The purposes[2] receipt (slot-012) is honest but
  under-attributed: the value is assembled from c002+c005+c006 while only c002 is
  cited — attribution precision, not laundering; the supporting passages exist at
  lines 1273 and 1118. Instrument note: the receipt's purposes[0].source_caveats
  snippet "Sample Size\t30 000 participants" is credited to c011 but the passage sits
  at line 2954 inside c012's span (2830–3082) — an adjacent-chunk attribution of the
  kind #763 reports rather than gates; no validator defect otherwise observed.
