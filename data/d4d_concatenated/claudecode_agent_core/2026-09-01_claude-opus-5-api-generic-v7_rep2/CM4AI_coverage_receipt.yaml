- id: c010
  status: extracted
  extracted:
  - slot: description
    snippet: "Its overarching mission is to produce ethical, AI-ready datasets of cell architecture, inferred from multimodal data collected for human cell lines, to enable transformative biomedical AI research."
  - slot: purposes[0].response
    snippet: "deliver machine-readable hierarchical maps of cell architecture as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines"
  - slot: tasks[1].response
    snippet: "Cell maps are hierarchical directed acyclic graphs (DAG), where each node represents an assembly of proteins in proximity at a given scale"
  - slot: tasks[0].response
    snippet: "they have been used in AI tools for \"visible machine learning\" or \"visible neural networks\" (VNNs) to interrogate how protein assemblies in the cell affect cell-level phenotype predictions"
  - slot: tasks[2].response
    snippet: "Cell maps provide a foundation for downstream applications in human genomics, including interpretation of genetic variants and mutations."
  - slot: is_deidentified.deidentification_details
    snippet: "CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue"
  - slot: notes
    snippet: "organized into six modules (Data: Data Acquisition, Tools, and Standards; People: Skills and Workforce Development, and Teaming; and Ethics)"
  - slot: acquisition_methods[0].acquisition_details
    snippet: "affinity purification mass spectroscopy (AP-MS)"
  - slot: external_resources[3].external_resources
    snippet: "the CM4AI web portal (http://www.cm4ai.org)"
- id: c011
  status: extracted
  extracted:
  - slot: notes
    snippet: "AI-Ready biomedical data are fully characterized FAIR data of known provenance, which can be ethically and reliably processed by AI applications"
  - slot: direct_collection[0].collection_details
    snippet: "MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from a metastatic site pleural effusion of a 51-year-old black female"
  - slot: ip_restrictions.restrictions
    snippet: "It is available for access by non-for-profit organizations via a simple MTA."
  - slot: acquisition_methods[1].acquisition_details
    snippet: "we have performed SEC-MS on MDA-MB-468 cells under three conditions (untreated, paclitaxel and vorinostat treated), which enabled us to identify 72/100 chromatin modifiers, with 52 of them being integral components of protein complexes"
  - slot: acquisition_methods[2].acquisition_details
    snippet: "We established automated fixation and permeabilization protocols for the pipetting robot for MDA-MB-468 and KOLF2 cell lines"
  - slot: acquisition_methods[3].acquisition_details
    snippet: "We have designed a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene."
  - slot: collection_mechanisms[2].mechanism_details
    snippet: "were done using the 10x Genomics 3'HT kit"
  - slot: subpopulations[0].notes
    snippet: "The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male Northern European donor"
