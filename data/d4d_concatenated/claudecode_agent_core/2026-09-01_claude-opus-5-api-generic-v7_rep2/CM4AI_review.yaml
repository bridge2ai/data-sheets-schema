notes: >-
  Instrument findings, not verdicts: (1) the Phase 1 receipt was never rewritten
  after Phase 4 reshapes (#742), so the pack pairs stale receipts with
  post-reshape paths - slot-013 pairs the IMP receipt (old external_resources[6])
  with the CM4AI portal now at that index after the MassIVE split, and slot-028
  pairs the old page value's receipt with the repointed landing page; both read
  as 'unsupported' here though the underlying values are bundle-stated
  elsewhere (lines 3513-3514, 7011). (2) The receipt's chunk attributions run
  systematically one to two chunks late (funders[0].grantor receipted to c005,
  passage at 2338 in c007; c019 receipted as extracted though its span
  5141-5361 is pure boilerplate and all six passages sit in c018) - the
  validator's adjacent/elsewhere class (#763) should be counting these; if the
  provenance receipts block reports few 'snippets in another chunk' for this
  run, that is worth an issue. (3) The reconciliation report's section 2.4
  describes flattening Person objects to name strings as a v4 scalar-rule
  correction; the affected slots are Person-ranged, so the audit misapplied the
  rule (see rule-08).
