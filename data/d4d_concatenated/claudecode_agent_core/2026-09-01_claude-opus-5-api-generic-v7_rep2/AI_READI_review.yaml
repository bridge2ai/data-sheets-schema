notes: >-
  The three adverse receipted verdicts share one cause: the coverage receipt
  describes the Phase-1 record and Phase 4 moved or removed the content with no
  receipt route (#742) - slot-028's method value was swapped for the tier-1
  statement (bundle line 2890, c015) while the receipt still cites the tier-3
  Safe Harbor passage; slot-016/slot-057's collection was deleted; slot-025's
  c012 receipt now supports license_terms instead. None is a fabrication; each
  value that survives is bundle-supported somewhere. slot-009 is the one
  receipt whose passage never answered its slot even at Phase 1 (CDS being
  developed vs. this release conforming to CDS v0.1.1, which the README states
  at line 4599). Instrument observation for the validator, not a verdict: the
  receipt's c023 entry cites the FLIO subcrate @id, but that line (5661) falls
  in c022's span - an elsewhere-chunk attribution of the kind #763 reports.
  The pack listed no gaps.
