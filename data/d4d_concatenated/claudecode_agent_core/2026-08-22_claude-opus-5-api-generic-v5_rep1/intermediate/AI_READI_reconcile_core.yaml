  - path: ./
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1. Nine dataset-level metadata files required by the
      specification: CHANGELOG.md, dataset_description.json, dataset_structure_description.json,
      healthsheet.md, LICENSE.txt, participants.json, participants.tsv, README.md and
      study_description.json. participants.tsv carries the recommended train/validation/test
      assignment for each participant.
    conforms_to_standard:
      - CDS
    notes: >-
      Mixed Markdown, JSON, TSV and plain-text content, so no single format or media type applies to
      the collection.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    notes: >-
      Used for all retinal imaging directories (retinal_flio, retinal_oct, retinal_octa,
      retinal_photography), which together account for 332,089 of the 356,343 files in the release.
  - format: CSV
    media_type: text/csv
    notes: >-
      Used for the OMOP CDM clinical data tables. The manifest.tsv and participants.tsv files use
      the same delimited-text family with a tab separator.
  - format: JSON
    media_type: application/json
    notes: >-
      Used for the CDS metadata files (dataset_description.json,
      dataset_structure_description.json, study_description.json, participants.json,
      dqd_omop.json) and for Open mHealth wearable records.
  - format: MD
    media_type: text/markdown
    notes: Used for README.md, CHANGELOG.md and healthsheet.md.
  - format: WFDB
    notes: >-
      Used for the cardiac_ecg directory. The WaveForm DataBase format comprises paired signal and
      header files; no media type is given in the bundle.
  - format: Delimited ASCII following the ESDS guidelines
    notes: >-
      Used for the environment directory, following the NASA ASCII File Format Guidelines for Earth
      Science Data; no media type is given in the bundle.
  - notes: >-
      The dataset description lists the release formats as application/dicom, text/markdown,
      text/csv and application/json.

