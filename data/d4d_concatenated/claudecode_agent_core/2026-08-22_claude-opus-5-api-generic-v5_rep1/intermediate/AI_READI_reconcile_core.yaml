notes: >-
  Citation. Use of the dataset requires citing the resources specified in the AI-READI documentation
  at https://docs.aireadi.org; the recommended citation for this version is: AI-READI Consortium.
  (2025). Flagship Dataset of Type 2 Diabetes from the AI-READI Project (3.0.0) [Data set]. FAIRhub.
  https://doi.org/10.60775/fairhub.3. Notification of participants. Every individual was aware of
  the data collection, since this was active, prospective collection directly from participants
  rather than passive collection or secondary use of existing data; individuals in each recruitment
  pool were mailed a hardcopy invitation letter and sent an invitation email, both personalized with
  links, access codes and QR codes directing them into the online REDCap recruitment interface,
  where they could read an overview of the research program, download the informed consent document,
  request a call back, complete a screening survey and enroll. Participant compensation. A 200 US
  dollar stipend was paid for the study visit from the NIH grant funding, after the final data were
  received and the study devices returned, typically at least two weeks after the visit and not
  prorated; reasonable parking, public transit or rideshare costs related to the visit were covered
  up to 25 US dollars, and rideshare assistance was offered to participants reporting barriers to
  getting to study visits. Biorepository. The AI-READI study also maintains a biospecimen repository
  that is not part of this dataset. Approximately 53 mL of non-fasting blood plus a urine specimen
  are collected at the visit; whole blood, plasma, serum and urine for central assays are
  batch-shipped on dry ice to the University of Washington Nutrition and Obesity Research Center
  approximately quarterly, while plasma, serum, buffy coats, PAXgene RNA vacutainers and CPT
  mononuclear cell preparation tubes are sent to the biorepository at the University of Alabama at
  Birmingham Center for Clinical and Translational Science for a central study-wide biobank. Genomic
  DNA is extracted from stored buffy coats at UAB, and peripheral blood mononuclear cells are
  isolated and cryopreserved centrally at UAB because of the complexity of the procedure. The
  biobanked material is intended to support future genomics, proteomics, metabolomics, gene
  expression and immunological studies and the generation of induced pluripotent stem cells, and
  will be made available to scientists under procedures and policies that were still in development.
  Return of results. Several results are returned to participants rather than only deposited in the
  dataset: heart rate, blood pressure and visual acuity on an exam card before they leave the visit,
  with lay-language interpretation; a Dexcom report of average blood glucose and a Glucose
  Management Indicator by encrypted email after the ten-day monitoring period; and laboratory test
  results with normative values by HIPAA-compliant encrypted email at the time of the yearly data
  release. Coordinators alert participants to incidental findings requiring emergency care, and
  retinal imaging technicians are trained to detect retinal detachment, tumour and optic disc oedema
  and to arrange immediate referral.

source_caveats: >-
  Sources in the bundle disagree on several points; where the input manifest ranks one higher, that
  value was used and the disagreement is recorded here. (1) Lead organization. The FAIRhub dataset
  and study descriptions (tier 1) name Washington University in St. Louis (ROR 01yc7t268) as
  managing organization, lead sponsor, licensor and the affiliation of principal investigator Aaron
  Lee, while the RO-Crate (tier 1) records him as "Aaron Lee, Department of Ophthalmology,
  University of Washington" and NIH RePORTER (tier 4) lists the awardee organization as University
  of Washington. The University of Washington is also the IRB of record and one of the three data
  collection sites. Both tier-1 statements are recorded and neither is discarded. (2) Enrollment
  target. The FAIRhub study description gives an anticipated enrollment of 4,000 (tier 1), matched
  by both publications (tier 3), while the IRB protocol form (tier 2) states 4,600 in its overview
  alongside a target of 1,000 in each of four groups; 4,000 is used. (3) De-identification. The
  dataset description (tier 1) states that no identifiers were collected so no active
  de-identification was necessary, with a check that no HIPAA-identifiable data were present, while
  the Nature Metabolism comment (tier 3) describes the public set as actively stripped of PHI via
  the HIPAA Safe Harbor method; the tier-1 framing is preferred and both are recorded. (4)
  Sensitivity. The healthsheet states that the public dataset contains nothing considered sensitive,
  while the RO-Crate, of the same tier, lists EHR, wearable monitoring, ECG, environmental sensor,
  continuous glucose monitor and wearable accelerometer data as personal sensitive information; the
  ranking cannot decide between them and both are recorded. (5) Coverage of version 3.0.0. The
  healthsheet describes v3.0.0 as containing data collected "up through the end of the second year
  of the study", the README change table attributes 1,213 additional participants to year-three
  data, and the v3 documentation "About" page still states that this version contains data from the
  participants of the pilot study phase, which appears to be stale text carried over from the v2
  page. The collection period of 19 July 2023 to 1 May 2025 given in the dataset description is
  used. (6) Demographic subpopulations. The healthsheet answers "No" to whether the dataset
  identifies demographic subpopulations, because sex and race/ethnicity are held under controlled
  access, yet the README split table publishes aggregate counts by race/ethnicity, sex and diabetes
  status; both are recorded. (7) Sampling. The healthsheet states the dataset contains all possible
  instances and answers "N/A" on sampling strategy, while the study description records a
  non-probability sample and the protocol describes wave-based triple-balanced recruitment from the
  three health systems; both are recorded. (8) Enrollment start date. FAIRhub gives 19 July 2023
  (tier 1) and BMJ Open gives 18 July 2023 (tier 3); the tier-1 date is used for the collection
  period and the tier-3 date for the pilot period, which only BMJ Open describes. (9) Anticipated
  end. BMJ Open gives 30 November 2026 for the end of enrollment while the FAIRhub study description
  gives an anticipated completion date of 1 January 2027. (10) Follow-up fraction. The NIH RePORTER
  abstract, the README and the study description describe longitudinal follow-up for 10 percent of
  the cohort, while the healthsheet states that approximately 4 percent of participants are expected
  to undergo a follow-up examination in year four. (11) Project acronym expansion. "AI-READI" is
  expanded as "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights" in the BMJ
  Open and Nature Metabolism publications and as "Artificial Intelligence Ready and Exploratory
  Atlas for Diabetes Insights" in the FAIRhub healthsheet, README, study description and NIH
  RePORTER; both expansions appear in the bundle. (12) FAIRhub file and size figures. The FAIRhub v3
  page reports 3.82 TB and 356,343 files, and the API gives the exact byte count 3,815,969,779,678
  and file count 356,343; these are the attested totals. The nine per-directory entries in the
  dataset structure description account for 356,334 files, the remaining nine being the root
  metadata files; the per-directory byte figures are recorded individually on each distribution and
  no derived sum of them is asserted here. (13) Both FAIRhub pages and the documentation site carry
  a banner stating that the repository is under review for potential modification in compliance with
  Administration directives, so availability may change. (14) Format vocabulary. DICOM has no
  representation in the CoreDistribution `format` or `media_type` enumerations, so those slots are
  omitted for the four imaging distributions and the format is recorded in the conforms_to prose and
  in conforms_to_standard instead. The same applies to WFDB for cardiac_ecg and to the ESDS ASCII
  guidelines for environment, for which the bundle names no file format at all. (15) Grant
  identifiers. Only the primary Bridge2AI award OT2OD032644 has award URIs in the bundle. Grants
  P30DK035816 and UL1TR003096 and the Research to Prevent Blindness support are named without
  identifiers, so their FundingMechanism objects carry no Grant object rather than a minted one.
  (16) Creator identity. No registry identifier for the AI-READI Consortium as an organization
  appears in the bundle; the project website URL is used as the identifier for the organizational
  creator object, and this is a homepage rather than a registry entry.