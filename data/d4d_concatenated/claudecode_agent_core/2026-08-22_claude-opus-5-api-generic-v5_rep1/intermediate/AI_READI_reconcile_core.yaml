id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI) flagship
  dataset contains multimodal data collected from 2,280 participants with and without type 2
  diabetes mellitus (T2DM), harmonized across three United States data collection sites (the
  University of Alabama at Birmingham, the University of California San Diego, and the University
  of Washington). Data were collected between 19 July 2023 and 1 May 2025 for this version.
  Participants aged 40 years and older were recruited by screening electronic health records and
  were sampled so as to approach an equal distribution across four diabetes severity groups (no
  diabetes; pre-diabetes or lifestyle-controlled diabetes; diabetes controlled by oral or
  non-insulin injectable medication; insulin-controlled diabetes), across self-reported
  race/ethnicity groups (Asian, Black, Hispanic, White) and across biological sex. Each participant
  completed pre-visit questionnaires, a single on-site visit of roughly 2.5 to 4 hours, and a
  ten-day at-home monitoring period. The dataset spans survey and clinical data mapped to the OMOP
  Common Data Model, blood and urine laboratory results, physical and vision measurements,
  cognitive screening, monofilament testing for peripheral neuropathy, 12-lead electrocardiography,
  retinal photography, optical coherence tomography (OCT), OCT angiography (OCTA), fluorescence
  lifetime imaging ophthalmoscopy (FLIO), continuous glucose monitoring, wearable activity
  monitoring, and indoor environmental sensing. The release contains 356,343 files totaling
  approximately 3.82 TB, organized according to the Clinical Dataset Structure specification with
  one directory per data type, then modality, then device, then participant. The dataset is
  hypothesis-agnostic and was designed to support downstream artificial intelligence and machine
  learning research into salutogenesis, the pathway from disease back to health, in type 2
  diabetes. This public release carries no protected health information; sex, race/ethnicity and
  medication information have been removed and are held under a separate controlled-access tier.
