conforms_to: >-
  The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1 specification,
  which places one directory per data type at the root, then one directory per modality, then one
  per device, then one per participant. Within that structure the file formats follow: the WaveForm
  DataBase (WFDB) standard for cardiac_ecg; the Observational Medical Outcomes Partnership (OMOP)
  Common Data Model for clinical_data, where each CSV file maps one-to-one to an OMOP CDM table;
  the NASA ASCII File Format Guidelines for Earth Science Data for environment; Digital Imaging and
  Communications in Medicine (DICOM) for retinal_flio, retinal_oct, retinal_octa and
  retinal_photography; and Open mHealth for wearable_activity_monitor and wearable_blood_glucose.
  Dataset-level metadata files (dataset_description.json, dataset_structure_description.json,
  study_description.json) follow the AI-READI schemas at https://schema.aireadi.org. The dataset is
  additionally packaged as an RO-Crate conforming to RO-Crate 1.2-DRAFT and the FAIRscape profile
  0.1, with one sub-crate per data type.
