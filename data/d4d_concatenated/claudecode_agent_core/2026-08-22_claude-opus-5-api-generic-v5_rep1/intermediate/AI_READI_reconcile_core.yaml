purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, multimodal dataset that is ready
      for artificial intelligence and machine learning research into type 2 diabetes mellitus,
      including salutogenic pathways back to health.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria and can be used to reconstruct a temporal atlas of the development of
      type 2 diabetes and its reversal toward health.
  - response: >-
      To create a model and blueprint for developing large, scalable, AI-ready datasets, including
      guidelines for project management, data collection, data management and data sharing that
      other data generation projects can follow.
  - response: >-
      To increase access to and the quality of AI/ML research by recruiting and training personnel,
      including through a year-long AI-READI research internship program.

addressing_gaps:
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as type
      2 diabetes has been limited by a lack of well-designed, high-quality, large and inclusive
      multimodal datasets; a major barrier to AI in this area has been the lack of diverse datasets
      that are AI-ready for training models.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published between 2000 and 2020
      found that samples lacked racial and ethnic diversity. The AI-READI cohort is deliberately
      balanced across four self-reported race/ethnicity groups rather than mirroring the
      demographic distribution of the United States population, because balanced training datasets
      are critical for developing unbiased machine learning models.
  - response: >-
      The multi-domain acquisition protocol enables downstream AI/ML analyses that are not feasible
      with existing data sources such as insurance claims or electronic health record data.
  - response: >-
      Current understanding of type 2 diabetes in the context of salutogenesis, the pathway from
      disease to health, is limited; the dataset was assembled to support study of that pathway
      rather than of pathogenesis alone.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease trajectories by
      learning from complex multimodal data collected from participants spanning a range of disease
      severity from normal to insulin-dependent type 2 diabetes.
  - response: >-
      Training and evaluating artificial intelligence and machine learning models on harmonized
      multimodal type 2 diabetes data, using the recommended train/validation/test split shipped in
      participants.tsv.
  - response: >-
      Multimodal model development that combines survey, clinical, laboratory, imaging, waveform,
      wearable and environmental data for a single participant.

intended_uses:
  - use_category: Type 2 diabetes related research
    usage_notes: >-
      Access to the public v3.0.0 release requires the requester to log in through a verified ID
      system and to agree to use the data only for type 2 diabetes related research.
    examples:
      - Artificial intelligence and machine learning research into the pathogenesis and salutogenesis of type 2 diabetes mellitus
      - Reconstruction of a temporal atlas of type 2 diabetes development and reversal toward health
  - use_category: Research and commercial use under the AI-READI license
    usage_notes: >-
      The AI-READI Data License Agreement v2.0 grants a non-exclusive, non-transferable license to
      download, reproduce and use the data and to create derivative works for research, commercial
      and non-commercial purposes, subject to the sharing, storage and model-interaction
      restrictions set out in the agreement.
    examples:
      - Development, training or adaptation of models, algorithms and programs that do not themselves contain the data or a modified version of it
  - use_category: Methodological and infrastructure work
    usage_notes: >-
      A smaller mini-subset version of the dataset is made available specifically for pipeline
      development.
    examples:
      - Development and testing of data processing pipelines against a reduced copy of the release
      - Reuse of the Clinical Dataset Structure organization and the AI-READI metadata schemas as a template for other clinical research datasets

prohibited_uses:
  - prohibition_reason: >-
      Licensees must not make clinical treatment decisions based on the data, as it is intended
      solely as a research resource.
  - prohibition_reason: >-
      Licensees must not use or attempt to use the data, alone or with other information, to
      compromise the confidentiality or privacy of any data subject, to identify or contact any data
      subject or group of data subjects, to extract or extrapolate identifying information, to
      establish a data subject's membership in a particular group, or otherwise to cause harm or
      injury to any data subject.
  - prohibition_reason: >-
      Licensees must not share or distribute the data with any third-party model vendor or developer
      for training or development purposes, including model weight modification or other adjustments
      to a model's logic or operation, even where that vendor has a HIPAA Business Associate
      Agreement with the licensee's institution. Short-term interaction such as prompting or
      querying a model covered by such an agreement is permitted for analysis.
  - prohibition_reason: >-
      Licensees must not transfer, license, sublicense, sell, assign, display, share or otherwise
      convey any portion of the data or any derivative work to any third party other than another
      licensee bound by an identical agreement with the licensor.
  - prohibition_reason: >-
      Data may not be reproduced in papers, articles, presentations, analyses, reports or
      publications except that small representative samples may appear in up to five images or
      figures per paper for illustrative purposes; larger amounts may not be published or posted
      through supplemental files, zip archives, code packages or other means, notwithstanding
      journal or conference requirements.
  - prohibition_reason: >-
      Licensees must not remove, obscure, alter or mask the static watermarking that identifies the
      licensee for security purposes, and must store the data only on servers and devices maintained
      by and located within their institution or on cloud services covered by a HIPAA-approved
      Business Associate Agreement with that institution.

discouraged_uses:
  - discouragement_details: >-
      Treating an interim release as demographically balanced is discouraged. Enrollment was ongoing
      when v3.0.0 was released, and the project states that the pilot data release and the periodic
      updates may not have achieved the intended balanced distribution across race/ethnicity, sex
      and diabetes severity groups even though the final cohort is designed to be balanced.
  - discouragement_details: >-
      Generalizing findings to populations not represented in the cohort is discouraged. Recruitment
      was predominantly urban and hospital-based and may not capture all cultural and socioeconomic
      backgrounds, and the cohort does not include other races or ethnicities such as Pacific
      Islanders and Native Americans.

future_use_impacts:
  - impact_details: >-
      The project states that, to the extent of its knowledge, it does not currently anticipate uses
      of the dataset that could result in unfair treatment or harm, but that there is a theoretical
      risk of future re-identification. Because AI algorithms can infer individual patient
      characteristics and could facilitate individual-level identification, the project implements a
      robust data dissemination system, a strict license agreement and data watermarking for both
      the public and the controlled sets.
  - impact_details: >-
      Because sex and race/ethnicity were withheld from the public release to prevent stigmatization
      of findings, downstream users cannot directly audit models for disparate performance across
      those groups using the public data alone. The project mitigates this by supplying a
      recommended train/validation/test split whose validation and test sets are balanced as well as
      possible for sex, race/ethnicity and diabetes status.

acquisition_methods:
  - acquisition_details: >-
      Directly observed measurements taken during the on-site study visit or from returned at-home
      devices, including vital signs, anthropometry, visual function testing, autorefraction,
      monofilament testing, 12-lead electrocardiography, retinal imaging, blood and urine laboratory
      assays, continuous glucose monitoring, wearable activity monitoring and indoor environmental
      sensing.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
  - acquisition_details: >-
      Participant-reported data collected through pre-visit and on-site questionnaires administered
      in REDCap, covering screening and eligibility, demographics, depressive symptoms (CES-D-10),
      diabetes distress (PAID-5), diabetes self-care, diet, smoking, alcohol, vaping and marijuana
      use, general health history, social determinants of health, ophthalmic history and current
      medications. Entered medications were verified where possible by cross-referencing against
      medications physically brought in or photographed by the participant.
    was_reported_by_subjects: true
    was_validated_verified: true
  - acquisition_details: >-
      Derived measures calculated from directly observed values, including body mass index and
      waist-hip ratio from measured height, weight and circumferences, calculated low-density
      lipoprotein cholesterol, the blood urea nitrogen to creatinine ratio, calculated total
      globulin and the albumin/globulin ratio.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      REDCap electronic data capture was used for participant-reported questionnaires and for the
      following clinical data recorded during the visit: medications assessment, vital signs, visual
      acuity, contrast sensitivity, monofilament test results and complete blood count results.
      REDCap also hosted the recruitment interface, the screening survey and electronic consent.
  - mechanism_details: >-
      Screening of electronic health records at each site to build recruitment pools, using ICD-10
      diagnosis codes R73.09 for pre-diabetes and E11.X for type 2 diabetes, together with
      demographic fields; patients without diabetes were identified as having no encounters with
      those codes.
  - mechanism_details: >-
      Optomed Aurora IQ handheld non-mydriatic fundus camera (Optomed, Oulu, Finland). Macula- and
      disc-centered undilated color fundus photographs, four images per participant, exported as
      DICOM.
  - mechanism_details: >-
      iCare EIDON widefield truecolor confocal fundus system (iCare USA, Raleigh, North Carolina).
      Ultra-widefield central, nasal and temporal color fundus photographs, central infrared,
      central fundus autofluorescence and a mosaic of ultra-widefield images; twelve images per
      participant, exported as DICOM.
  - mechanism_details: >-
      Heidelberg Spectralis HRA optical coherence tomography and OCT angiography system (Heidelberg
      Engineering GmbH, Heidelberg, Germany). Optic nerve head radial circle high resolution OCT,
      posterior pole macula high-resolution 61-line OCT and 20x20 high-speed 512-line macular OCTA;
      six images per participant, exported as DICOM.
  - mechanism_details: >-
      Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan). 12x9 mm 512x128 wide
      OCT, 6x6 mm 512x128 macular OCT and 6x6 mm 360x360 macular OCTA; six images per participant,
      exported in .fda format and converted to DICOM for the dataset.
  - mechanism_details: >-
      Topcon Triton DRI OCT swept-source system (Topcon Healthcare, Itabashi-ku, Tokyo, Japan). 12x9
      mm 512x256 3D plus radial OCT, 6x6 mm 320x320 macular OCTA and 12x12 mm 512x512 macular OCTA;
      six images per participant, exported in .fda format and converted to DICOM.
  - mechanism_details: >-
      Zeiss Cirrus 5000 (Carl Zeiss Meditec AG, Jena, Germany). Disc cube 200x200 OCT, macula cube
      512x128 OCT, 6x6 mm macular OCTA and 6x6 mm disc OCTA; eight images per participant, exported
      as DICOM.
  - mechanism_details: >-
      Heidelberg fluorescence lifetime imaging ophthalmoscopy (FLIO) system (Heidelberg Engineering
      GmbH). Macula-centered acquisition recording photon arrival times in two spectral channels,
      short (498-560 nm) and long (560-720 nm); two images per participant, exported in .sdt format
      and converted to DICOM. Because the acquisition is long and exposes participants to
      uncomfortable light levels it was performed last in the visit.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Philips, Amsterdam, The Netherlands) for 12-lead
      electrocardiography, performed with the participant in a reclining chair or supine, with the
      chair position recorded as 0, 30, 60 or 90 degrees relative to supine. Exported as .xml and
      converted to WFDB for the dataset.
  - mechanism_details: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system (Dexcom, Inc., San Diego,
      California), worn for ten continuous days after the visit and recording an interstitial
      glucose measurement every five minutes. Participants were masked to the results during the
      monitoring period. Exported as .csv and converted to Open mHealth format.
  - mechanism_details: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland), worn on
      the participant's chosen wrist for ten continuous days, sampling every five seconds and
      recording steps, heart rate, respiratory rate, oxygen saturation, stress and sleep phases.
      Exported in .FIT format and converted to Open mHealth format. Participants returned a data
      sheet recording which wrist the tracker was worn on and their dominant hand.
  - mechanism_details: >-
      LeeLab Anura custom-designed indoor environmental sensor (Karalis Johnson Retina Center,
      University of Washington, Seattle, Washington), placed in a frequently used area of the
      participant's home for ten days and recording ambient temperature, relative humidity, nitrogen
      oxides (NO and NO2), volatile organic compounds, particulate matter counts (PM1.0, PM2.5, PM4,
      PM10) and eleven multi-spectral light intensity measurements. Participants recorded the
      location of the sensor on return. The device captures no video, audio or GPS location and is
      not synced with participant-owned devices.
  - mechanism_details: >-
      Vision function instruments: M&S Technologies Electronic Visual Acuity tester at four meters
      for best-corrected photopic and mesopic letter acuity (mesopic through a 2.0 neutral density
      filter); Mars letter contrast sensitivity charts (Mars Perceptrix, Chappaqua, New York) read
      monocularly at approximately 50 cm under photopic and mesopic conditions; Topcon KR 800
      autorefractor/keratometer; and NIDEK LM-600P, Topcon CL-200 and Topcon CL-300 lensometers.
  - mechanism_details: >-
      Automatic oscillometric blood pressure devices used across sites: OMRON HEM 907XL, Medline
      MDS4001 automatic digital monitor, and Welch Allyn 6000 series vital signs monitor with Welch
      Allyn FlexiPort reusable cuff. Systolic pressure, diastolic pressure and heart rate were
      measured twice, two minutes apart.
  - mechanism_details: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada), capturing the total score, section subscores,
      Memory Index Score and task completion times, exported as .csv.
  - mechanism_details: >-
      Standard 10 g monofilament applied at three locations on each foot, ten times per location,
      with shoes and socks removed and the participant's eyes closed; insensate areas were retested
      for confirmation and results were recorded directly into REDCap.
  - mechanism_details: >-
      Clinical laboratory assays. Fresh whole blood complete blood counts were performed by CLIA
      certified laboratories local to each data collection site; all other blood and urine assays
      were performed on stored frozen samples by the University of Washington Nutrition and Obesity
      Research Center testing facility, which returned results in .csv format.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Period during which the data contained in version 3.0.0 were collected, as recorded in the
      dataset description with dateType "Collected".
  - start_date: '2023-07-18'
    end_date: '2023-11-30'
    timeframe_details: >-
      Preliminary pilot enrollment period, run to secure sufficient familiarity for all
      coordinators. Data from the pilot enrollment period were included in the first released
      dataset, version 1.0.0, published in May 2024.
  - start_date: '2023-12-01'
    timeframe_details: Start of the formal data collection process, following the pilot enrollment period.
  - start_date: '2022-09-01'
    end_date: '2025-08-31'
    timeframe_details: >-
      Project period of NIH award 1OT2OD032644-01 as recorded in NIH RePORTER. The overall project
      spans four years (2022-2026), with the first year devoted to protocol development and training
      and years two to four to recruitment and data collection.
  - start_date: '2023-07-19'
    end_date: '2027-01-01'
    timeframe_details: >-
      Study status dates recorded in the FAIRhub study description: an actual start date of 19 July
      2023 and an anticipated completion date of 1 January 2027, with overall status "Enrolling by
      invitation". Approximately 4 to 10 percent of participants are expected to return for a
      follow-up visit in year four.
    source_caveats: >-
      The enrollment start date differs by one day between the tier-1 FAIRhub study description
      (19 July 2023) and the tier-3 BMJ Open protocol (18 July 2023); the tier-1 value is used for
      the collection start date above and the tier-3 value is used for the pilot period, which is
      described only in BMJ Open. The anticipated end of enrollment also differs: BMJ Open gives
      30 November 2026 and the FAIRhub study description gives an anticipated completion date of
      1 January 2027.

data_collectors:
  - role: Clinical research coordinators and research assistants
    collector_details: >-
      Recruited, consented and enrolled participants, conducted the on-site visit including
      questionnaires, physical and vision measurements, cognitive and monofilament testing and
      ophthalmic imaging, trained participants on the continuous glucose monitor, activity tracker
      and environmental sensor, and ensured return of all study devices. All research personnel who
      recruited, enrolled and collected data underwent training by the data manager at the
      University of Alabama at Birmingham and worked from a detailed Manual of Procedures.
      Certification required completion of mandatory institutional compliance training for human
      subjects research and successful administration of all protocol elements to at least three
      volunteer practice subjects.
  - role: Site data managers
    collector_details: >-
      Oversaw the data collection process at each site and were responsible for the quality control
      of all data before upload to FAIRhub, including review of REDCap range-check reports and
      approval of any edits together with the site principal investigator.
  - role: Phlebotomists and laboratory assistants
    collector_details: >-
      Collected approximately 53 mL of non-fasting blood plus a urine specimen during the visit and
      processed and shipped samples; plasma, serum and buffy coat processing followed standardized
      operating procedures at each site on the day of collection.
  - role: Central project and curation team
    collector_details: >-
      Received data from the three study sites, mapped it to standardized terminologies and formats,
      and prepared it for dissemination on the FAIRhub platform, a Microsoft Azure cloud-based data
      management, curation and sharing platform developed for the project.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      All patients aged 40 years or older who had a medical encounter within the health system of
      one of the three study sites (University of Alabama at Birmingham, University of California
      San Diego, University of Washington).
    strategies:
      - >-
        Triple balancing: participants are recruited in approximately equal proportions across four
        self-reported race/ethnicity groups (Asian, Black, Hispanic, White), four categories of type
        2 diabetes severity (no diabetes; pre-diabetes or lifestyle-controlled diabetes; diabetes
        treated with oral or non-insulin injectable medications; insulin-controlled diabetes) and
        biological sex, rather than targeting the demographic distribution of the United States
        population.
      - >-
        Wave-based recruitment: contact pools are identified by screening electronic health records
        for each wave, and the composition and size of each wave are influenced by the observed
        participation characteristics of race/ethnicity, gender, diabetes severity and site, with
        under- and oversampling of groups adjusted as recruitment progresses.
      - >-
        Site-level diversity: all study groups are recruited at every site, but the proportion of
        each group varies with the demographic prevalence of that group in the site's geographical
        area.
      - >-
        Inclusion criteria: able to provide consent; aged 40 years or older; persons with or without
        type 2 diabetes; must speak and read English. Exclusion criteria: must not be pregnant; must
        not have gestational diabetes; must not have type 1 diabetes. The FAIRhub eligibility record
        additionally gives a maximum age of 85 years and records healthyVolunteers as "No".
      - >-
        The FAIRhub study description records the sampling method as a non-probability sample and
        the design as an observational cohort study with a cross-sectional time perspective.
    why_not_representative: >-
      The cohort is deliberately balanced rather than representative, because balanced training
      datasets are critical for developing unbiased machine learning models. Recruitment is
      predominantly urban and hospital-based and may not capture the full range of cultural and
      socioeconomic backgrounds; the cohort does not include other races or ethnicities such as
      Pacific Islanders and Native Americans; and participants must speak, read and understand
      English.
    source_caveats: >-
      The healthsheet states that the dataset contains all possible instances, namely every
      participant enrolled up to the release cut-off, and answers "N/A" to the question about
      sampling strategy from a larger set. The study description and the protocol publications
      instead describe a non-probability, wave-based, balanced recruitment strategy drawn from the
      three health systems' patient populations. Both are recorded here.

instances:
  - instance_type: >-
      An individual study participant. Each instance comprises all of the data available for one
      person who took part in the study, spread across the modality and device directories under a
      folder named with that participant's study identifier.
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with a data instance. The dataset is
      hypothesis-agnostic and was assembled to facilitate multiple potential downstream AI/ML
      applications rather than a single prediction task, so no labeling was performed and no gold
      standard or proxy labels are provided.
    source_caveats: >-
      A single Instance object is recorded here at the level of the participant, which is the unit
      the healthsheet identifies. The participant-level instance spans nine data types with
      different substrates, so no single `data_substrate` term applies and the slot is omitted; the
      per-modality substrates are enumerated in the full record.

subpopulations:
  - identification: >-
      Self-reported race and ethnicity, collected in the screening questionnaire in four categories:
      Asian, Black, Hispanic and White.
    distribution: >-
      Across the 2,280 participants in v3.0.0 the README reports Hispanic 380, Asian 545, Black 519
      and White 836. Per-participant race and ethnicity are held under controlled access and are not
      part of the public release.
    subpopulation_elements_present: false
  - identification: Biological sex, collected in the screening questionnaire as male or female.
    distribution: >-
      Across the 2,280 participants the README reports 951 male and 1,329 female. Per-participant
      sex is held under controlled access and is not part of the public release.
    subpopulation_elements_present: false
  - identification: >-
      Diabetes status group, one of four: no type 1 or type 2 diabetes; pre-type 2 diabetes or type
      2 diabetes controlled by lifestyle adjustment; type 2 diabetes controlled by oral or
      injectable medications other than insulin; type 2 diabetes controlled by insulin.
    distribution: >-
      Across the 2,280 participants the README reports no diabetes 776, lifestyle 560, oral 686 and
      insulin 258.
  - identification: Age in years at the study visit; eligibility required 40 years or older.
    distribution: Mean age across the 2,280 participants is 60.8 years with a standard deviation of 11.3 years.
  - identification: Data collection site.
    distribution: >-
      Three sites contributed participants: the University of Alabama at Birmingham (Birmingham,
      Alabama), the University of California San Diego (San Diego, California) and the University of
      Washington (Seattle, Washington). Per-site participant counts for v3.0.0 are not given in the
      bundle.
    source_caveats: >-
      The healthsheet answers "No" to whether the dataset identifies demographic sub-populations,
      because sex and race/ethnicity are withheld from the public release; the README nevertheless
      publishes aggregate counts by race/ethnicity, sex and diabetes status. Both are recorded.

anomalies:
  - anomaly_details: >-
      Survey data: skipped questions and incomplete responses are expected where participants chose
      not to answer or did not complete a questionnaire.
  - anomaly_details: >-
      Wearable and at-home device data: improper use of the device, technical failure such as
      battery failure or system malfunction, devices returned too late for results to be retrieved,
      and devices with no stored results. The Garmin Vivosmart 5 had to be recharged every two to
      three days, so gaps in the activity record are expected.
  - anomaly_details: >-
      Imaging data: participant non-cooperation, noise that may obscure images, system malfunction
      and data transfer failures. Undilated Optomed Aurora handheld images vary in quality between
      participants and within a participant because of the handheld acquisition and the absence of
      dilation. Devices that are not fully automated and depend on the operator, such as the
      Heidelberg Spectralis, are subject to operator-induced quality issues that may lead to a
      modality being skipped and data being missing. FLIO is performed last in the visit and
      participants may not be at their best compliance by that point; the FLIO device cannot
      tolerate more than one centimeter of movement during acquisition.
  - anomaly_details: >-
      Data collisions: in a few cases there may have been a data collision at some point in the
      processing chain and data have been lost.
  - anomaly_details: >-
      FLIO photon data follow a Poisson distribution and the signal-to-noise ratio varies across
      aspects of the data. Unwanted signals such as background light or fluorescence from the lens
      cannot simply be subtracted because they belong to the same distribution as the useful signal.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so the sample is subject to volunteer bias, which may limit the
      generalizability of results to people who are not represented in the study population.
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition is adjusted by under- and oversampling groups
      as participation characteristics are observed, and coordinators follow up on mailings and
      respond to interested individuals with expediency.
  - bias_type: sampling_bias
    bias_description: >-
      The study base consists of patients aged 40 or older who had a medical encounter within one of
      three academic health systems between 2020 and 2025, so recruitment is predominantly urban and
      hospital-based and may not fully capture diverse cultural and socioeconomic backgrounds.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity across the United
      States and to ensure representation across racial and ethnic groups, and individuals from all
      demographic backgrounds were recruited at all three sites. Uniform data collection protocols
      were implemented for all subjects irrespective of race/ethnicity, biological sex or diabetes
      severity, across all study sites.
  - bias_type: representation_bias
    bias_description: >-
      The cohort does not include races and ethnicities beyond the four target groups, such as
      Pacific Islanders and Native Americans. Interim releases, including the pilot release and
      periodic updates, may not have achieved the intended balanced distribution across race,
      ethnicity, sex and diabetes severity even though the final target cohort is triple-balanced.
    affected_subsets:
      - >-
        The v3.0.0 release as a whole; the training split in particular is less balanced by
        race/ethnicity (Hispanic 204, Asian 369, Black 343, White 660) than the deliberately
        balanced validation and test splits (88 in each group).
    mitigation_strategy: >-
      The recommended validation and test splits are balanced as well as possible for sex,
      race/ethnicity and diabetes status; enrollment continues with adjustment of recruitment waves
      toward the balanced target.
  - bias_type: selection_bias
    bias_description: >-
      Recruiting Black men into health research is documented as more difficult than recruiting
      other populations, despite this population bearing a disproportionate share of the type 2
      diabetes burden, with medical mistrust and fear for safety stemming from historical events
      such as the Tuskegee syphilis study. Similar trends of under-recruitment alongside disease
      burden have been reported for Hispanic and Asian people. Requiring that eligible participants
      speak, read and understand English may also have created challenges in recruiting Hispanic and
      Asian participants.
    mitigation_strategy: >-
      The project committed to implementing new recruitment strategies if balancing on
      race/ethnicity emerged as a challenge, drawing on identified approaches such as tailoring
      printed materials and using a personalized, participatory approach to recruitment; a Community
      Advisory Board including diversity in race and ethnicity contributed to protocol development.
  - bias_type: measurement_bias
    bias_description: >-
      Marijuana use was not assessed for participants living in Alabama because it is an illegal
      substance there, so that variable is systematically absent for one site.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population: recruitment
      is predominantly urban and hospital-based, participants must speak, read and understand
      English, and races and ethnicities outside the four target groups, such as Pacific Islanders
      and Native Americans, are not included.
    scope_impact: >-
      Limits the generalization of models derived from the dataset to populations outside the
      recruited groups and settings.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants. Some participants elected not to take
      part in some study elements; in some cases a data collection device had no stored results or
      was returned too late for results to be retrieved; and in a few cases data were lost.
    recommended_mitigation: >-
      Consult the manifest.tsv file within each data type directory and the participants.tsv file to
      establish which modalities are present for a given participant before analysis.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The design is cross-sectional with a single visit per participant, so within-participant
      change over time cannot be studied in this release. Version 3.0.0 covers data collected
      between 19 July 2023 and 1 May 2025 and enrollment is ongoing, so the release is an interim
      snapshot of a study targeting 4,000 participants.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset contains no unstructured text data. The Snellen visual acuity variables present in
      the previous release were dropped in v3.0.0, so only logMAR visual acuity measurements are
      available. Sex, race/ethnicity and medication information are absent from the public release.
    recommended_mitigation: >-
      Apply for the controlled-access release under a data use agreement where sex, race, ethnicity,
      ZIP code, genetic sequencing data, past health records, medications and traffic and accident
      reports are required.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Information on device make and model, including the specific scan modality used, was
      documented to ensure repeatability, and multiple devices were deliberately included for the
      same measure to enhance generalizability; this means that measurements of the same construct
      are not always instrument-comparable across participants.
  - limitation_type: integration_limitation
    limitation_description: >-
      The associated biorepository at the University of Alabama at Birmingham Center for Clinical
      and Translational Science holds a finite number of biospecimens, so only a limited number can
      be shared with scientists who wish to use them in research; procedures for reviewing and
      prioritizing written requests were still to be developed at the time of the protocol
      publication. The biospecimens are not part of this dataset.

missing_data_documentation:
  - missing_data_patterns:
      - Whole modalities absent for some participants
      - Skipped questions and incomplete responses within questionnaires
      - Gaps within continuous wearable records, for example while the activity tracker was being recharged every two to three days
    missing_data_causes:
      - Participants elected not to participate in some study elements
      - The data collection device had no stored results, for example because the battery died
      - The device was returned too late for results to be retrieved
      - Data collision at some point in the processing chain, with consequent data loss
      - Technical failure of a device or system, or data transfer failure
      - Modality skipped because of quality problems during a non-automated acquisition
      - Marijuana use not assessed at the Alabama site because the substance is illegal there
    handling_strategy: >-
      Missing values were not imputed. During data entry, missing data that could be directly filled
      from other portions of an individual's record were completed under the guidance and approval
      of the site principal investigator; where there was no logical or appropriate way to correct
      the data, the site principal investigator decided whether the values should be removed.
      Remaining gaps are left as missing in the released data, and the manifest.tsv files record
      which files exist for which participants.

cleaning_strategies:
  - cleaning_details: >-
      At the point of data entry and acquisition, clinical values outside expected minimum and
      maximum ranges were flagged in REDCap and surfaced in reports viewed by clinical research
      coordinators and data managers. Using these reports as guides, data managers and coordinators
      examined participant records and determined whether an error was likely. Data were checked for
      credibility against prespecified reasonable ranges, for incorrect flow through prescribed skip
      patterns, for missing data that could be filled directly from other portions of an
      individual's record, and for the omission or duplication of records.
  - cleaning_details: >-
      Editing was carried out only under the guidance and approval of the site principal
      investigator. If corrected data were available elsewhere in the respondent's answers the error
      was corrected; if there was no logical or appropriate way to correct the data, the site
      principal investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      The data manager at each site was responsible for the quality control of all data before
      upload to FAIRhub. The clinical data directory ships a dqd_omop.json file supporting analysis
      with the OMOP CDM Data Quality Dashboard, which runs more than 3,500 data quality checks
      against an OMOP CDM instance.
  - cleaning_details: >-
      The dataset has not undergone any formal external audit. It has been reviewed internally by
      AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included.

preprocessing_strategies:
  - preprocessing_details: >-
      Once data were sent from each study site to the central project team, all data were mapped to
      standardized terminologies where possible. Clinical data were mapped to the Observational
      Medical Outcomes Partnership Common Data Model, with each CSV file in the clinical_data
      directory corresponding one-to-one to an OMOP CDM table. Current medications were coded with
      RxNorm codes.
  - preprocessing_details: >-
      Retinal images that were exported from devices in proprietary formats were converted to DICOM
      for the dataset: Topcon Maestro2 and Triton exports in .fda format and Heidelberg FLIO exports
      in .sdt format were both converted. Images from the Optomed Aurora, iCare Eidon, Heidelberg
      Spectralis and Zeiss Cirrus were exported directly as DICOM.
  - preprocessing_details: >-
      Electrocardiograms exported from the Philips PageWriter TC30 as .xml were converted to the
      WaveForm DataBase (WFDB) format. Garmin Vivosmart 5 data exported in .FIT format and Dexcom G6
      data exported as .csv were converted to the Open mHealth standard. Environmental sensor data
      follow the NASA ASCII File Format Guidelines for Earth Science Data.
  - preprocessing_details: >-
      The whole release is organized according to the Clinical Dataset Structure (CDS) v0.1.1
      specification, with directories nested by data type, modality, device and participant, and
      with manifest.tsv files at the data type level and nine dataset-level metadata files at the
      root. Processing moved from custom and ad hoc handling for the v1.0.0 pilot to a combination
      of automated and custom processing for v2.0.0 and v3.0.0.
  - preprocessing_details: >-
      Data may be statically watermarked to identify the licensee for security purposes, as
      acknowledged in the license agreement.
  - preprocessing_details: >-
      No instances were excluded from the dataset at the time of preprocessing; the healthsheet
      records that exclusions operated at the recruitment stage through the eligibility criteria
      rather than during data preparation.

raw_sources:
  - raw_data_details: >-
      Raw, pre-standardization data are saved and are expected to be preserved by the AI-READI
      project at least for the duration of the project, but are not currently shared outside the
      project team, because they have not been mapped to standardized terminologies and because raw
      data may inadvertently include personal health information or personally identifiable
      information, for example in free-text fields. There is a possibility that raw data may be
      included in future releases of the controlled-access dataset.

raw_data_sources:
  - source_description: >-
      REDCap electronic data capture database holding participant-reported questionnaires and the
      clinical data recorded during the visit (medications, vitals, visual acuity, contrast
      sensitivity, monofilament results, complete blood count results).
    source_type: Electronic data capture system
    raw_data_format: REDCap database records
    access_details: >-
      Not distributed in raw form; mapped to the OMOP Common Data Model for the clinical_data
      directory. The exact forms used for data collection in REDCap are published at
      https://docs.aireadi.org/v3/REDCap%20surveys%20and%20forms.pdf
  - source_description: >-
      Electronic health records at the three study sites, screened for ICD-10 codes R73.09
      (pre-diabetes) and E11.X (type 2 diabetes) together with demographic fields, to build
      recruitment pools among patients aged 40 or older with an encounter at the site.
    source_type: Electronic health record system
    access_details: >-
      Used for recruitment and screening only. Past health records are held under controlled access
      and are not part of the public release.
  - source_description: Retinal imaging device exports from Topcon Maestro2 and Topcon Triton.
    source_type: Imaging device export
    raw_data_format: .fda
    access_details: Converted to DICOM for the dataset; the .fda originals are not distributed.
  - source_description: Fluorescence lifetime imaging ophthalmoscopy exports from the Heidelberg FLIO system.
    source_type: Imaging device export
    raw_data_format: .sdt
    access_details: Converted to DICOM for the dataset; the .sdt originals are not distributed.
  - source_description: Twelve-lead electrocardiogram exports from the Philips PageWriter TC30 Cardiograph.
    source_type: Physiological device export
    raw_data_format: .xml
    access_details: Converted to WFDB for the cardiac_ecg directory.
  - source_description: Continuous glucose monitor exports from the Dexcom G6.
    source_type: Wearable device export
    raw_data_format: .csv
    access_details: Converted to the Open mHealth standard for the wearable_blood_glucose directory.
  - source_description: Physical activity monitor exports from the Garmin Vivosmart 5.
    source_type: Wearable device export
    raw_data_format: .FIT
    access_details: Converted to the Open mHealth standard for the wearable_activity_monitor directory.
  - source_description: Indoor environmental sensor exports from the custom-built LeeLab Anura unit.
    source_type: Environmental sensor export
    raw_data_format: .csv
    access_details: Organized under the environment directory following the ESDS ASCII file format guidelines.
  - source_description: >-
      Montreal Cognitive Assessment exports from the MoCA Duo iPad application, comprising the total
      score, section subscores, Memory Index Score and task completion times.
    source_type: Assessment application export
    raw_data_format: .csv
  - source_description: >-
      Blood and urine assay results from CLIA-certified laboratories local to each site (complete
      blood count on fresh whole blood) and from the University of Washington Nutrition and Obesity
      Research Center testing facility (all other assays, on stored frozen samples).
    source_type: Clinical laboratory
    raw_data_format: .csv

labeling_strategies:
  - labeling_details: >-
      No labeling was performed. The dataset is hypothesis-agnostic and was assembled to facilitate
      multiple potential downstream AI/ML applications, so no gold-standard or proxy labels are
      provided, no human labellers were engaged, and no labeling software is released. The project
      states it has no formal guidelines for future researchers creating new labels or defining new
      tasks. Version 3.0.0 does add a recommended train/validation/test split of the 2,280
      participants, in approximately 70/15/15 proportions (1,576 / 352 / 352), assigned in
      participants.tsv and constructed so that the validation and test sets are balanced as well as
      possible for age, sex, race/ethnicity and diabetes status; this is a split rather than a
      labeling scheme.

distributions:
  - path: cardiac_ecg/
    bytes: 302931703
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; WaveForm DataBase
      (WFDB) for the data files. 4,515 files. Twelve-lead electrocardiogram data acquired with the
      Philips PageWriter TC30, under the ecg_12lead modality and philips_tc30 device directories,
      with a manifest.tsv metadata file.
    conforms_to_standard:
      - CDS
      - WFDB
    notes: >-
      WFDB comprises paired signal and header files. The bundle names no file extension, container
      format or media type for these files, and WFDB has no representation in the `format` or
      `media_type` enumerations, so both slots are omitted.
  - path: clinical_data/
    format: CSV
    media_type: text/csv
    bytes: 176182781
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming; the Observational Medical Outcomes
      Partnership (OMOP) Common Data Model for the data files. 7 files. Clinical data collected
      through REDCap, including blood and urine laboratory values and survey data, with each CSV
      file mapping one-to-one to an OMOP CDM table, plus a dqd_omop.json metadata file supporting
      the OMOP CDM Data Quality Dashboard.
    conforms_to_standard:
      - CDS
      - OMOP_CDM
  - path: environment/
    bytes: 55625676514
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; the NASA ASCII
      File Format Guidelines for Earth Science Data for the data files. 2,232 files. Indoor
      environmental data from the LeeLab Anura sensor custom built for the AI-READI project, under
      the environmental_sensor modality and leelab_anura device directories, with a manifest.tsv
      metadata file.
    conforms_to_standard:
      - CDS
      - ESDS
    notes: >-
      The bundle states only that these files follow the ESDS ASCII file format guidelines and
      names no specific delimited or plain-text format, so the `format` and `media_type` slots are
      omitted rather than approximated.
  - path: retinal_flio/
    bytes: 1069466876718
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; DICOM for the data
      files. 7,969 files. Fluorescence lifetime imaging ophthalmoscopy for in vivo measurement of
      the lifetimes of endogenous retinal fluorophores, under the flio modality and heidelberg_flio
      device directories, with two DICOM files per eye (short 498-560 nm and long 560-720 nm
      spectral channels) and a manifest.tsv metadata file.
    conforms_to_standard:
      - CDS
      - DICOM
    notes: >-
      Media type is application/dicom, which the `format` and `media_type` enumerations do not
      offer, so both slots are omitted for the imaging distributions.
  - path: retinal_oct/
    bytes: 1317625293027
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; DICOM for the data
      files. 56,478 files. Structural optical coherence tomography under the structural_oct
      modality, with device directories for heidelberg_spectralis, topcon_maestro2, topcon_triton
      and zeiss_cirrus, and a manifest.tsv metadata file.
    conforms_to_standard:
      - CDS
      - DICOM
  - path: retinal_octa/
    bytes: 1155908809724
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; DICOM for the data
      files. 173,721 files. Optical coherence tomography angiography organized into three
      modalities: enface (2D views of the retinal layers derived from 3D volume scans), flow_cube
      (3D blood flow information) and segmentation (heightmaps with associated layer information),
      each with device directories for heidelberg_spectralis, topcon_maestro2, topcon_triton and
      zeiss_cirrus, and a manifest.tsv metadata file.
    conforms_to_standard:
      - CDS
      - DICOM
  - path: retinal_photography/
    bytes: 174381046406
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; DICOM for the data
      files. 93,921 files. Two-dimensional retinal (fundus) photography organized into three
      modalities: cfp (color fundus photographs, from icare_eidon, optomed_aurora, topcon_maestro2
      and topcon_triton), faf (fundus autofluorescence, from icare_eidon) and ir (near-infrared
      reflectance, from heidelberg_spectralis, icare_eidon, topcon_maestro2 and zeiss_cirrus), with
      a manifest.tsv metadata file.
    conforms_to_standard:
      - CDS
      - DICOM
  - path: wearable_activity_monitor/
    format: JSON
    media_type: application/json
    bytes: 38313536220
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; Open mHealth for
      the data files. 15,245 files. Garmin Vivosmart 5 wearable fitness tracker data organized into
      seven modalities: heart_rate, oxygen_saturation, physical_activity,
      physical_activity_calorie, respiratory_rate, sleep and stress, each with a garmin_vivosmart5
      device directory, with a manifest.tsv metadata file.
    conforms_to_standard:
      - CDS
      - OPEN_MHEALTH
    source_caveats: >-
      The bundle does not name a file format for this directory beyond the Open mHealth standard.
      JSON is recorded because the dataset description lists application/json among the four release
      formats and Open mHealth is a JSON schema library; the inference is noted rather than hidden.
  - path: wearable_blood_glucose/
    format: JSON
    media_type: application/json
    bytes: 4169006971
    conforms_to: >-
      Clinical Data Structure (CDS) v0.1.1 for directory naming and organization; Open mHealth for
      the data files. 2,246 files. Continuous glucose monitoring data from the Dexcom G6, under the
      continuous_glucose_monitoring modality and dexcom_g6 device directories, with a manifest.tsv
      metadata file.
    conforms_to_standard:
      - CDS
      - OPEN_MHEALTH
    source_caveats: >-
      As for the activity monitor directory, JSON is inferred from the dataset-level format list and
