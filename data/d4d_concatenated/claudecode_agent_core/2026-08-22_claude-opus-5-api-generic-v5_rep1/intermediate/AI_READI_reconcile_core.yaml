ethical_reviews:
  - reviewing_organization: >-
      University of Washington Institutional Review Board (Human Subjects Division), with reliance
      agreements from the Institutional Review Boards of the University of Alabama at Birmingham and
      the University of California, San Diego
    review_details: >-
      Approval number STUDY00016228. Initial IRB approval was received on 20 December 2022 and the
      initial approval letter is published at
      https://docs.aireadi.org/v3/Approval_STUDY00016228_Lee_initial.pdf. An annual renewal
      application reporting the status and progress of the study is required and is due within 90
      days of expiration. Human subject review status is recorded as "Submitted, approved". The
      study is not FDA-regulated for either drug or device and has no Data Monitoring Committee.
      Written informed consent is provided by all participants. The postal address recorded for the
      reviewing body is Human Subjects Division, University of Washington, 4333 Brooklyn Ave NE Box
      359470, Seattle, WA 98195-9470, United States.
    contact_person:
      name: IRB Reliance Team, University of Washington Human Subjects Division (hsdrely@uw.edu)
    source_caveats: >-
      The RO-Crate metadata names the reviewing body "Washington University IRB" while giving a
      University of Washington Human Subjects Division postal address and a uw.edu contact address;
      the healthsheet, the BMJ Open protocol and the IRB protocol form all identify the reviewing
      body as the University of Washington IRB. Both tier-1 statements point to the same Seattle
      office, and the University of Washington naming is used here.
  - review_details: >-
      Ethical, legal and social implications were considered at every stage of the project cycle,
      with guidance from bioethicists. The RO-Crate metadata names Camille Nebeker, Debra Mathews,
      Kadija Ferryman and Nicholas Evans as those responsible for ethical review of the dataset. A
      Community Advisory Board of eleven people drawn from the three sites, including diversity in
      race and ethnicity as represented in the AI-READI sample, contributed to development of the
      protocol and reviewed consent forms.
  - review_details: >-
      Through engagement with the Native Biodata Consortium the project undertook a co-learning
      exercise on challenges specific to American Indian and Alaska Native communities and on tools
      for addressing them, including data usage agreements, contract negotiations, transparent
      access agreements and forms of assured return of benefit and sustainable input, control and
      monitoring of Tribal data. The NIH RePORTER abstract records a planned tribal consultation to
      address barriers and facilitators of participation.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      STUDY00016228, University of Washington Institutional Review Board; initial approval 20
      December 2022, with annual continuing review. Reliance agreements are in place with the IRBs
      of the University of Alabama at Birmingham and the University of California, San Diego.
  ethics_review_board: >-
    University of Washington Institutional Review Board (Human Subjects Division), IRB Reliance
    Team, hsdrely@uw.edu
  regulatory_compliance:
    - >-
      The study is registered on ClinicalTrials.gov as NCT06002048. It is not FDA-regulated for drug
      (isFDARegulatedDrug: No) or device (isFDARegulatedDevice: No) and has no Data Monitoring
      Committee. The public release contains no protected health information as defined by the HIPAA
      Privacy Rule. Licensees must comply with the data security and privacy standards established
      by the NIH under its Genomic Data Sharing Policy.
  special_populations:
    - >-
      Only adults aged 40 years and older were enrolled; the study eligibility record also gives a
      maximum age of 85 years. Pregnant individuals, people with gestational diabetes and people
      with type 1 diabetes were excluded, as were individuals unable to provide consent or unable to
      read and speak English. No minors were enrolled.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically as an e-signature in REDCap before
      the visit or in person at the start of the visit.
    consent_documentation: >-
      IRB-approved consent form for the principal project site (University of Washington), published
      at
      https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf. The
      other clinical sites operated under IRB reliance and used the same form with minor
      institution-specific language reflecting individual institutional requirements; the California
      site additionally included the state-required Experimental Subject's Bill of Rights. Upon
      signing, the completed electronic consent form was emailed automatically to the participant,
      who could request a further copy from the study coordinator at any time during the study.
    consent_scope: >-
      The dataset description records the consent type as
      "ConsentSpecifiedNotElsewhereCategorised", with no non-commercial, geographic, research-type,
      genetic-only or methods restriction flags set, and notes that the public version of the
      dataset can only be used for type 2 diabetes related research while a private version allows
      more generic use. The consent form describes both the publicly available and the
      controlled-access releases and includes a table distinguishing information that will be
      publicly available from information requiring an application and approval process.
    withdrawal_mechanism: >-
      Participants could withdraw consent at any time and cease study participation; data already
      shared or used up to that point would remain in the dataset, as stated in the consent
      document.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      Eligibility criteria exclude the at-risk groups usually of concern: only adults aged 40 and
      older could enroll, so no minors are represented, and pregnancy and gestational diabetes were
      exclusion criteria. Participants had to be able to provide consent. No enrollment of prisoners
      or of adults unable to consent is described in the bundle.
  source_caveats: >-
    This statement is derived from the study's inclusion and exclusion criteria as given in the
    healthsheet, the FAIRhub study description and the IRB protocol form; those criteria are also
    recorded under sampling_strategies. The IRB protocol form's protected-population checkboxes were
    not legible in the extracted text.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor; the dataset description records the de-identification type as
    "NoDeIdentification" with the direct-identifier and HIPAA flags set, on the basis that no
    identifiers were collected in the first place.
  identifiers_removed:
    - All identifiers required to be absent under the HIPAA Safe Harbor method
    - Sex
    - Race and ethnicity
    - Medications used
    - Five-digit ZIP code (held under controlled access)
    - Genetic sequencing data (held under controlled access)
    - Past health records (held under controlled access)
    - Traffic and accident reports (held under controlled access)
  deidentification_details: >-
    The dataset description states: "No identifiers were collected so no active de-identification
    was necessary but we checked that no identifiable data per US HIPAA were present in the data."
    The de-identification flags record no shifting of dates, no non-arrangement of values and no
    k-anonymization. The Nature Metabolism comment describes the public set as stripped of Protected
    Health Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, as well as
    information related to the sex and race/ethnicity of participants, to prevent stigmatization of
    findings. The RO-Crate records the dataset as deidentified.
  notes: >-
    Related privacy measures, recorded here because the core schema has no separate slot for them.
    Participants are identified within the dataset only by a study participant identifier, which
    names each participant's folder inside every modality and device directory and links records in
    participants.tsv to the data files. The project states a theoretical risk of future
    re-identification and notes that AI algorithms can infer individual patient characteristics and
    could facilitate individual-level identification; a robust dissemination system, a strict
    license agreement, access gating through a verified ID login and self-attestation, and static
    watermarking of released data are implemented to deter re-identification attempts on both the
    public and controlled sets. The home monitoring devices were selected so as to capture no video
    or audio, carry no GPS location monitoring and remain unsynced with participant-owned devices,
    and all identifiable information held during the study was kept on encrypted servers or in
    locked cabinets with restricted access available only to authorized research personnel.
  source_caveats: >-
    The tier-1 dataset description frames this as "no active de-identification was necessary" while
    the tier-3 Nature Metabolism comment describes active Safe Harbor stripping of PHI; the tier-1
    framing is preferred and both are recorded. The healthsheet leaves the question about measures
    taken to avoid re-identification of de-identified individuals blank.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The healthsheet states that the public dataset will not contain data considered sensitive. No
      personally identifiable information is included in the release.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled-access dataset, which is distinct from this public release, contains data on
      racial and ethnic origins, sex, location at five-digit ZIP code resolution, genetic sequencing
      data, past health records, medications, and traffic and motor vehicle accident reports. The
      RO-Crate metadata for this release nonetheless lists electronic health record data, wearable
      monitoring, ECG, environmental sensor, continuous glucose monitor and wearable accelerometer
      data as categories of personal sensitive information.
    source_caveats: >-
      The healthsheet ("No, the public dataset will not contain data that is considered sensitive")
      and the RO-Crate personal-sensitive-information list are both tier-1 and cannot be reconciled
      by ranking; both are recorded.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential and that no personally identifiable information is included. The RO-Crate records
      a confidentiality level of "HL7:2N (normal)".

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet answers "No" to whether the dataset contains data that, if viewed directly,
      might be offensive, insulting, threatening, or otherwise pose a safety risk such as
      psychological safety or anxiety.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted. The healthsheet answers "No" to whether
      an analysis of the potential impact of the dataset and its use on data subjects has been
      carried out.

data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  committee_contact:
    id: ORCID:0000-0002-7452-1648
    name: Aaron Lee
  access_review_process: >-
    Access to version 3.0.0 is recorded as "PublicDownloadSelfAttestationRequired" and requires
    three steps: logging in through a verified ID system; agreeing to use the data only for type 2
    diabetes related research; and agreeing to the license terms, which set restrictions and
    obligations for data usage. The access route is https://fairhub.io/datasets/3/access. A separate
    controlled-access release, containing five-digit ZIP code, sex, race, ethnicity, genetic
    sequencing data, past health records, medications, and traffic and accident reports, requires
    entering into a data use agreement; the BMJ Open protocol states that these controlled-access
    requirements were being developed by the project's Data Access Committee and that use is limited
    to scientists whose institutions have completed legal and privacy use agreements with the
    AI-READI research program. Requests for biospecimens from the associated biorepository are
    governed by procedures and policies that were still in development.
  stewardship_roles:
    - >-
      The AI-READI team supports and maintains the dataset; Washington University in St. Louis is
      recorded as the managing organization and lead sponsor and as the licensor of the data;
      FAIRhub is the publisher and hosting platform; the site data managers were accountable for
      quality control before upload.
  source_caveats: >-
    The RO-Crate records the data governance committee as the "AI-READI Consortium", while the BMJ
    Open protocol names a "Data Access Committee" as the body developing controlled-access
    requirements. The higher-ranked RO-Crate value is used for the committee name and the Data
    Access Committee is recorded in the access review process. No membership of either body is
    recorded in the bundle, so committee_members is left unpopulated; the sixteen individuals named
    in the study description as Study Principal Investigators are recorded under creators.

license_and_use_terms:
  data_use_permission: disease_specific_research
  contact_person:
    id: ORCID:0000-0002-7452-1648
    name: Aaron Lee
  license_terms: >-
    The AI-READI Data License Agreement version 2.0 (https://doi.org/10.5281/zenodo.17555036), with
    Washington University in St. Louis as licensor, was written specifically to enable reuse of the
    AI-READI dataset for commercial or research purposes while placing strong requirements around
    data usage, security and secondary sharing to protect study participants, particularly where
    data are reused for AI and machine learning. It grants a non-exclusive, non-transferable license
    to download, reproduce and use the data and to create derivative works, for research, commercial
    and non-commercial purposes. A licensee may be an individual or may cover an authorized group
    within an institution, in which case authorized users are members of that group by contract,
    employment or student status and their rights terminate automatically when that relationship
    ends. Data may be stored only on institutional servers and devices or on cloud services covered
    by a HIPAA Business Associate Agreement with the licensee's institution. Derivative data,
    including synthetic data generated from the data, are treated as data and are subject to the
    same restrictions. Models trained or adapted on the data may be made, reproduced and distributed
    provided they do not themselves contain the data and provided the licensee takes all reasonable
    efforts to minimize the likelihood that data can be memorized, derived, reconstructed or
    reconstituted from them. Publication of data is limited to small representative samples in up to
    five images or figures per paper. Licensees must acknowledge the licensor, the source and any
    funder in papers reporting use of the data, following the citation instructions at
    docs.aireadi.org. Licensees must comply with the NIH Genomic Data Sharing Policy security best
    practices for controlled-access data. The data are provided on an "as is" basis without warranty
    of any kind; the licensor's aggregate liability is capped at one US dollar except where
    applicable law prohibits such limitation; and licensees indemnify the licensor. The agreement
    terminates automatically on any breach, whereupon the licensee must delete all copies and cease
    all use. Separately, access is conditioned on the requester agreeing to use the public data only
    for type 2 diabetes related research. The license is recorded in the dataset description under
    the rights name "AI-READI custom license v2.0" with rights URI
    https://doi.org/10.5281/zenodo.17555036.

ip_restrictions:
  restrictions:
    - >-
      Title to the data and all industrial and intellectual property rights in it remain solely and
      exclusively with the licensor, Washington University in St. Louis, and its suppliers;
      licensees must not take any action inconsistent with that ownership and any rights not
      expressly granted are reserved.
    - >-
      Licensees may not transfer, license, sublicense, sell, assign, display, share or otherwise
      convey any portion of the data or any derivative work to any third party other than another
      licensee bound by an identical agreement.
    - >-
      Publishers and conference organizers who wish to reproduce more than the permitted five images
      or figures must obtain a separate license to the data from the licensor.
    - >-
      There are no plans by the data-collecting researchers to develop commercial products or file
      patents from the dataset, but the dataset is released under a commercial-friendly license and
      products or patents may be developed from it by others in future.

regulatory_restrictions:
  hipaa_compliant: compliant
  confidentiality_level: restricted
  other_compliance: >-
    Licensees must comply with all data security and privacy standards established by the US
    National Institutes of Health under its Genomic Data Sharing (GDS) Policy, the current version
    being the NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy,
    and must comply with all applicable laws, regulations and restrictions relating to the
    distribution and use of the data and of models derived from it. Data may be statically
    watermarked to identify the licensee for security purposes and licensees must take no action to
    remove, obscure, alter or mask that watermarking.
  regulatory_restrictions:
    - >-
      The study is not FDA-regulated for drug or device. The public release contains no protected
      health information as defined by the HIPAA Privacy Rule. The healthsheet answers questions
      about export controls and other regulatory restrictions by reference to the license; no export
      control regime is named anywhere in the bundle.
  notes: >-
    The RO-Crate records a confidentiality level of "HL7:2N (normal)" for the dataset and for each
    of its sub-crates. The enumerated value "restricted" is used above because access requires a
    verified-ID login, a use attestation and acceptance of a restrictive license, rather than being
    unrestricted; the RO-Crate's own HL7 scale value is recorded here verbatim.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. It is hosted on FAIRhub, which runs on
      Microsoft Azure, with cloud services supported by the Microsoft AI for Good Lab. Contact
      information is given in the README file included with the dataset and at
      https://aireadi.org/contact and https://docs.aireadi.org/docs/3/contact; the central study
      contact recorded in the study description is Aaron Lee, contact@aireadi.org. The
      study_description.json and dataset_description.json metadata files inside the dataset carry
      additional information about the contact person and entity, the authors and the contributors.

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset is released as static versions and is not updated in place; labeling errors are not
    corrected and instances are not added or deleted within a version. New versions are released
    approximately once a year with additional data from participants enrolled since the previous
    release. Changes between the current version and the previous one are documented in detail in
    the CHANGELOG file included in the dataset and visible at docs.aireadi.org. Version 1.0.0
    contained 204 participants from the pilot phase, version 2.0.0 added 863 participants for a
    total of 1,067, and version 3.0.0 added 1,213 further participants for a total of 2,280. Version
    3.0.0 also added three imaging devices relative to version 2.0.0, which had added one relative
    to the pilot. Future versions are expected as enrollment continues toward the 4,000 participant
    target.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
    - "1.0.0, DOI 10.60775/fairhub.1, released 2024-05-03, 204 participants (pilot phase); no longer accessible"
    - "2.0.0, DOI 10.60775/fairhub.2, released 2024-11-08, 1,067 participants, 2.01 TB, 165,051 files; no longer accessible"
    - "3.0.0, DOI 10.60775/fairhub.3, released 2025-11-17, 2,280 participants, 3.82 TB, 356,343 files; current version"
  version_details: >-
    Every version keeps its own DOI and its own documentation, selectable from a dropdown at
    docs.aireadi.org. The FAIRhub pages for versions 1.0.0 and 2.0.0 state that those versions are
    no longer accessible and direct users to the latest version. A smaller mini-subset of version
    3.0.0 is made available for pipeline development, and Azure Storage access is documented in the
    v3 preliminary information section. A separate datasheet exists for version 1.0.0
    (https://docs.aireadi.org/docs/1/dataset/healthsheet) and for version 2.0.0
    (https://docs.aireadi.org/docs/2/dataset/healthsheet).

retention_limit:
  retention_period: No limit
  retention_details: >-
    There are no applicable limits on the retention of the data associated with the instances;
    participants were not told that their data would be retained for a fixed period and then
    deleted. Older versions of the dataset are superseded rather than maintained, since the dataset
    is not updated in place and each new version is issued separately.

extension_mechanism:
  contribution_url: https://github.com/AI-READI
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those involved in the project. The project does maintain a public GitHub organization at
    https://github.com/AI-READI and a Zenodo community at https://zenodo.org/communities/aireadi
    through which its tooling and guidelines are shared.

existing_uses:
  - examples:
      - >-
        None recorded. The healthsheet answers "No" to whether the dataset has been used for any
        tasks already. The FAIRhub API record for version 3.0.0 reports a citation count of zero and
        a view count of 24,636 as of the retrieval date.
    notes: >-
      Use of the dataset requires citing the resources specified at https://docs.aireadi.org; the
      recommended citation for this version is recorded in the notes slot of this record.

use_repository:
  - repository_details: >-
      No repository or registry tracks papers or systems that use the dataset beyond general
      services such as Google Scholar; the healthsheet answers "No" to whether such a repository
      exists. The FAIRhub dataset page displays usage statistics for views, citations, mentions and
      approved access requests, and shows zero recorded citations for version 3.0.0.
    repository_url: https://fairhub.io/datasets/3

other_tasks:
  - task_details: >-
      Reuse of the project's blueprint and infrastructure beyond the diabetes science. The Clinical
      Dataset Structure (CDS) specification, developed by AI-READI as a simple and intuitive way to
      organize clinical research datasets and include structured metadata, and the FAIRhub curation
      and sharing platform are both intended to be adopted by other data generation projects; the
      project anticipates making FAIRhub available to future data generation projects that wish to
      manage and share AI-ready clinical research datasets after testing it on the AI-READI dataset.

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: doi:10.60775/fairhub.2
    description: >-
      Version 2.0.0, released 8 November 2024, containing 1,067 participants, 165,051 files and 2.01
      TB. Version 3.0.0 adds year-two and year-three data, adds three imaging devices, adds a
