id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI flagship dataset contains multimodal data from 2280 participants with and
  without type 2 diabetes mellitus (T2DM), collected between 19 July 2023 and 1 May 2025 and
  harmonised across three data collection sites (University of Alabama at Birmingham,
  University of California San Diego, and University of Washington). Data domains include
  self-reported survey data, physical measurements and vitals, clinical laboratory results from
  blood and urine, 12-lead electrocardiography, cognitive screening, peripheral neuropathy
  testing, vision testing, retinal imaging (colour fundus photography, fundus autofluorescence,
  near-infrared reflectance, OCT, OCTA and fluorescence lifetime imaging ophthalmoscopy),
  continuous glucose monitoring, wearable activity monitoring and home environmental sensing.
  The public release contains no protected health information; information related to the sex
  and race/ethnicity of participants and to medications used has also been removed. The dataset
  was designed for downstream artificial intelligence and machine learning research into
  salutogenesis (the pathway from disease to health) in T2DM.
