notes: >-
  The dataset has not undergone any formal external audits; it has been reviewed internally by
  AI-READI team members for quality checks and to ensure that no personally identifiable
  information was accidentally included. Sources in the bundle disagree on several points that
  are preserved here rather than reconciled. (1) The acronym AI-READI is expanded as "Artificial
  Intelligence Ready and Equitable Atlas for Diabetes Insights" in the BMJ Open protocol and the
  Nature Metabolism comment, and as "Artificial Intelligence Ready and Exploratory Atlas for
  Diabetes Insights" in the NIH RePORTER record, the FAIRhub study description and the dataset
  README. (2) The target enrolment is given as 4000 participants in the protocol publication and
  the FAIRhub study metadata, and as 4600 in the University of Washington IRB protocol form.
  (3) The proportion of the cohort invited for longitudinal follow-up in year 4 is given as 10%
  in the NIH RePORTER abstract, the README and the IRB protocol, and as approximately 4% in the
  FAIRhub healthsheet. (4) The BMJ Open abstract labels STUDY00016228 as a "Clinicaltrials.org
  approval number", whereas the same number is the University of Washington IRB approval number
  elsewhere in that publication; the ClinicalTrials.gov registration is NCT06002048.
  Both the FAIRhub record and the documentation site display the banner "This repository is
  under review for potential modification in compliance with Administration directives."

