variables:
  - variable_name: HbA1c
    data_type: float
    unit: '%'
    measurement_technique: Whole blood assay performed by the University of Washington NORC laboratory
    notes: Reference range 4.0-6.0; included as a marker for diabetes.
  - variable_name: Glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay performed by the University of Washington NORC laboratory
    notes: Reference range 62-125; included as a marker for diabetes.
  - variable_name: Insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay performed by the University of Washington NORC laboratory
    notes: Reference range 0.0-24.9; included as a marker for diabetes.
  - variable_name: C peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay performed by the University of Washington NORC laboratory
    notes: Reference range 1.1-4.4; included as an indicator of insulin production.
  - variable_name: N-terminal pro-B-type natriuretic peptide
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma assay performed by the University of Washington NORC laboratory
    notes: Reference range varies by age; included as a severity and outcome predictor of heart failure.
  - variable_name: Troponin-T
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma assay performed by the University of Washington NORC laboratory
    notes: Reference range female <11, male <16; included as a marker of myocardial injury.
  - variable_name: C reactive protein, high sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum assay performed by the University of Washington NORC laboratory
    notes: Reference range 0.0-10.0; inflammation marker and risk factor for T2DM.
  - variable_name: Total cholesterol
    data_type: float
    unit: mg/dL
    notes: Reference range <200; cardiovascular disease risk factor.
  - variable_name: Triglycerides
    data_type: float
    unit: mg/dL
    notes: Reference range <150; cardiovascular disease risk factor.
  - variable_name: High-density lipoprotein cholesterol
    data_type: float
    unit: mg/dL
    notes: Reference range >39; cardiovascular disease risk factor.
  - variable_name: Low-density lipoprotein cholesterol
    data_type: float
    unit: mg/dL
    derivation: Calculated rather than directly measured.
    notes: Reference range <130; cardiovascular disease risk factor.
  - variable_name: Creatinine
    data_type: float
    unit: mg/dL
    notes: Reference range female 0.38-1.02, male 0.51-1.18; marker for kidney function.
  - variable_name: Blood urea nitrogen
    data_type: float
    unit: mg/dL
    notes: Reference range 8.0-21.0; marker for kidney and liver function.
  - variable_name: Urine creatinine
    data_type: float
    unit: mg/dL
    notes: No reference range provided; urinary biomarker for early diabetic nephropathy.
  - variable_name: Urine albumin
    data_type: float
    unit: mg/dL
    notes: No reference range provided; urinary biomarker for early diabetic nephropathy.
  - variable_name: White blood cell
    data_type: float
    unit: x10E3/uL
    measurement_technique: Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each site
    notes: Reference range 3.4-10.8.
  - variable_name: Haemoglobin
    data_type: float
    unit: g/dL
    measurement_technique: Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each site
    notes: Reference range 11.1-17.7.
  - variable_name: Platelets
    data_type: float
    unit: x10E3/uL
    measurement_technique: Complete blood count on fresh whole blood by a CLIA-certified laboratory local to each site
    notes: Reference range 150-450.
  - variable_name: Height
    data_type: float
    measurement_technique: Measured during the in-person study visit.
  - variable_name: Weight
    data_type: float
    measurement_technique: Measured during the in-person study visit.
  - variable_name: Waist circumference
    data_type: float
    measurement_technique: Measured during the in-person study visit.
  - variable_name: Hip circumference
    data_type: float
    measurement_technique: Measured during the in-person study visit.
  - variable_name: Waist-hip ratio
    data_type: float
    derivation: Calculated from measured waist and hip circumference.
  - variable_name: Body mass index
    data_type: float
    derivation: Calculated from measured height and weight.
  - variable_name: Systolic blood pressure
    data_type: float
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric, medically approved device (OMRON HEM 907XL, Medline MDS4001 or
      Welch Allyn 6000 series), measured twice separated by two minutes.
    quality_notes: >-
      Readings over 180 mm Hg or under 100 mm Hg with symptoms of haemodynamic instability trigger
      an emergency care recommendation.
  - variable_name: Diastolic blood pressure
    data_type: float
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric, medically approved device, measured twice separated by two minutes.
    quality_notes: >-
      Readings over 120 mm Hg or under 60 mm Hg with symptoms of haemodynamic instability trigger
      an emergency care recommendation.
  - variable_name: Heart rate
    data_type: float
    unit: beats per minute
    measurement_technique: Measured twice separated by two minutes; also derivable from the ECG.
    quality_notes: >-
      Readings over 100 bpm or under 60 bpm, if not known to be usual for the participant and with
      symptoms of haemodynamic instability, trigger an emergency care recommendation.
  - variable_name: Photopic best-corrected visual acuity
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes tested
      separately under best-corrected conditions.
    notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate better
      resolution. Snellen visual acuity variables were dropped in version 3.0.0.
  - variable_name: Mesopic best-corrected visual acuity
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester viewed through a 2.0 neutral density
      filter, which reduces the light level of the test to a mesopic level.
  - variable_name: Photopic letter contrast sensitivity
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars Letter Contrast Sensitivity chart, monocular, undilated, using the routine procedure.
    notes: >-
      Higher numbers mean better sensitivity. Log CS is recorded by multiplying the number of
      errors prior to the final correct letter by 0.04 and subtracting the result from the log CS
      value at the final correct letter.
  - variable_name: Mesopic letter contrast sensitivity
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: Mars chart viewed through a 2.0 neutral density occluder with a low luminance filter lens.
  - variable_name: Autorefraction
    data_type: float
    unit: diopters
    measurement_technique: >-
      Topcon KR 800 autorefractor using the standard protocol, for each eye, recording spherical
      and cylindrical components with cylindrical axis.
  - variable_name: Montreal Cognitive Assessment total score
    data_type: integer
    maximum_value: 30
    measurement_technique: >-
      MoCA administered electronically on an iPad using the MoCA Duo application; section
      subscores, Memory Index Score and task completion times are also captured.
    notes: >-
      Higher numbers represent better performance; a total score of 26 and above is considered
      normal and anything below 24 is a sign of cognitive impairment. Scores may be affected by a
      person's level of education, socioeconomic factors, and depression or other mental health
      conditions.
  - variable_name: Monofilament test response
    data_type: categorical
    categories:
      - 'yes'
      - 'no'
    measurement_technique: >-
      10 g monofilament applied at three locations on each foot, ten times per location, with the
      participant's eyes closed; insensate areas are retested for confirmation.
  - variable_name: 12-lead electrocardiogram
    data_type: array
    measurement_technique: >-
      Philips PageWriter TC30 Cardiograph, with the participant in a reclining chair or supine and
      the position recorded as 0, 30, 60 or 90 degrees relative to supine.
  - variable_name: Continuous glucose measurement
    data_type: float
    unit: mg/dL
    measurement_technique: Dexcom G6 continuous glucose monitor, recorded every 5 minutes over 10 days.
    notes: >-
      Participants are masked to the results during the monitoring period. Participants already
      wearing a Dexcom G6 could optionally allow download of previously collected glucose values
      for up to 90 days prior to the visit, for up to 100 days of glucose data in total.
  - variable_name: Step count
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Wearable heart rate
    data_type: float
    unit: beats per minute
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Sleep duration
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
    notes: Captures circadian and diurnal rhythm and sleep phases.
  - variable_name: Oxygen saturation
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Respiratory rate
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Stress level
    data_type: float
    measurement_technique: Garmin Vivosmart 5 physical activity monitor worn for 10 days.
  - variable_name: Ambient temperature
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for 10 days.
  - variable_name: Relative humidity
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for 10 days.
  - variable_name: Nitrogen oxides (NO and NO2)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for 10 days.
  - variable_name: Volatile organic compounds
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for 10 days.
  - variable_name: Particulate matter
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for 10 days.
    notes: Reported for PM1.0, PM2.5, PM4 and PM10 size fractions.
  - variable_name: Multi-spectral light intensity
    data_type: array
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for 10 days.
    notes: Eleven multi-spectral light intensity measurements.
  - variable_name: Age
    data_type: integer
    unit: years
    notes: >-
      Eligibility requires 40 years or older, with an upper eligibility limit of 85 years recorded
      in the FAIRhub study metadata. Mean age across the release is 60.8 years (SD 11.3).
  - variable_name: Biological sex
    data_type: categorical
    categories:
      - male
      - female
    is_sensitive: true
    notes: Self-reported at screening; withheld from the public release and available only under controlled access.
  - variable_name: Self-reported race/ethnicity
    data_type: categorical
    categories:
      - Asian
      - Black
      - Hispanic
      - White
    is_sensitive: true
    notes: Self-reported at screening and enrollment; withheld from the public release and available only under controlled access.
  - variable_name: 5-digit ZIP code
    data_type: string
    is_sensitive: true
    notes: Held under controlled access; not present in the public release.
  - variable_name: Diabetes study group
    data_type: categorical
    categories:
      - No diabetes
      - Pre-diabetes or lifestyle-controlled type 2 diabetes
      - Type 2 diabetes controlled by oral or non-insulin injectable medications
      - Insulin-controlled type 2 diabetes
    notes: Used together with age, sex and race/ethnicity to balance the recommended data splits.

distribution_formats:
  - access_urls:
      - https://fairhub.io/datasets/3
      - https://docs.aireadi.org/
    notes: >-
      The dataset is distributed through the FAIRhub platform. Declared media types are
      application/dicom, text/csv, application/json and text/markdown; TSV manifest and
      participants files and WaveForm DataBase (WFDB) ECG files are also present. All data files
      are in formats accessible with freely available software commonly used for such data types,
      so no specific software is required. Accessing the dataset requires logging in through a
      verified ID system, agreeing to use the data only for type 2 diabetes related research, and
      agreeing to the license terms. A smaller mini version of the dataset is available separately
      for pipeline development.

distribution_dates:
  - release_dates:
      - '2024-05-03'
    notes: Version 1.0.0, DOI 10.60775/fairhub.1; contains data from the pilot data collection phase (204 participants).
  - release_dates:
      - '2024-11-08'
    notes: >-
      Version 2.0.0, DOI 10.60775/fairhub.2; contains data collected up to the end of the first
      full year of the study (1067 participants, 2.01 TB, 165,051 files). FAIRhub marks this
      version as no longer accessible and directs users to the latest version.
  - release_dates:
      - '2025-11-17'
    notes: >-
      Version 3.0.0, DOI 10.60775/fairhub.3; contains data collected from 19 July 2023 to 1 May
      2025 (2280 participants, 3.82 TB, 356,343 files). The protocol publication states that the
      publicly accessible dataset from pilot data collection was made available in May 2024 and
      that all data collected through 31 July 2024 were made available in November 2024.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed and available for public use through the FAIRhub platform.
      Deidentified data are released approximately yearly in two sets: a controlled access set and
      a publicly accessible set with fewer requirements for access. The controlled access set
      contains all data available in the publicly accessible set plus more sensitive data, and is
      only available to scientists whose institutions have completed legal and privacy use
      agreements with the AI-READI research programme; requirements were being developed by a Data
      Access Committee. Licensees may not convey any portion of the data or derivative works to
      third parties other than other licensees bound by identical terms.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    The dataset is released under a custom license tailored to enable reuse of the AI-READI dataset
    for commercial or research purposes while imposing strong requirements around data usage,
    security and secondary sharing to protect study participants, especially when data is reused
    for AI and ML applications. Under the University of Washington Data License Agreement captured
    in the bundle: the licensor grants a non-exclusive, non-transferable license to download,
    reproduce and use the data and to create derivative works for research and commercial
    purposes; the licensee may not transfer, license, sublicense, sell, assign, display, share or
    otherwise convey any portion of the data or derivative works to any third party other than
    another licensee bound by identical terms; models, algorithms and programs developed, trained
    or adapted using the data but not containing the data may be made, reproduced and distributed
    provided reasonable efforts are undertaken to minimise the likelihood that data can be
    memorized, derived, reconstructed or reconstituted; clinical treatment decisions must not be
    based on the data; re-identification or contact of data subjects is prohibited; the licensee
    must acknowledge the source and any funder of the data in publications and follow the citation
    instructions at docs.aireadi.org; the licensee must comply with the NIH Genomic Data Sharing
    Policy security best practices; the agreement terminates automatically on breach, at which
    point all copies must be deleted; the data are provided "as is" without warranty of any kind;
    the licensor's aggregate liability is capped at one U.S. dollar except where applicable law
    prohibits such limitation; and the licensee indemnifies the licensor against claims arising
    from use of the data and from any model.
  notes: >-
    Sources in the bundle name different license versions. The full license text captured is the
    University of Washington Data License Agreement archived at https://doi.org/10.5281/zenodo.10642459
    (AI-READI-LICENSE-v1.0), while the version 3.0.0 dataset metadata names
    "AI-READI custom license v2.0" at https://doi.org/10.5281/zenodo.17555036; the v2.0 text is not
    present in the bundle. FAIRhub labels the license as "Health Data License". Access to the
    public dataset additionally requires agreeing to use the data only for type 2 diabetes related
    research, reflecting the scope of participant consent.

ip_restrictions:
  restrictions: >-
    Title to the data, and all industrial and intellectual property rights therein, remain solely
    and exclusively with the licensor (University of Washington) and its suppliers, and the
    licensee must not take any action inconsistent with such ownership. Any rights not expressly
    granted in the license are reserved to the licensor and its suppliers.
  notes: >-
    The healthsheet answers the question about third-party IP-based restrictions by referring to
    the dataset license. There are no plans by the researchers collecting the dataset to develop
    commercial products or file patents, but the dataset is made available with a
    commercial-friendly license and products or patents may be developed from it in the future.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions: >-
    The healthsheet answers questions about export controls and other regulatory restrictions by
    referring to the dataset license, which requires the licensee to comply with all applicable
    laws, regulations and restrictions relating to the distribution and use of the data and of any
    models derived from it.
  other_compliance: >-
    Licensees must comply with all data security and privacy standards established by the US
    National Institutes of Health under its Genomic Data Sharing (GDS) Policy, currently the NIH
    Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
  governance_committee_contact: >-
    AI-READI Data Access Committee, which was developing the requirements for the controlled
    access dataset; general contact contact@aireadi.org or https://aireadi.org/contact.
  notes: >-
    Access to the public dataset is gated by verified ID login, an attestation to use the data only
    for type 2 diabetes related research, and acceptance of the license terms; the FAIRhub access
    type is recorded as "PublicDownloadSelfAttestationRequired".

maintainers:
  - role: researcher
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. Contact information for the
      owner/curator/manager is provided in the README file included with the dataset, which directs
      users to https://aireadi.org/contact; the central study contact recorded in the FAIRhub study
      metadata is Aaron Lee (contact@aireadi.org).
  - role: other
    maintainer_details: >-
      The dataset is hosted on FAIRhub, a cloud-based data management, curation and sharing
      platform developed for this project and running on Microsoft Azure. FAIRhub is developed by
      the FAIR Data Innovations Hub at the California Medical Innovations Institute and is
      anticipated to be made available for future data generation projects.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place. New versions are
    released approximately once a year with additional data from participants enrolled since the
    previous release; future versions will include larger numbers of participants as enrollment
    continues. Older versions are not separately maintained: version 2.0.0 is marked on FAIRhub as
    no longer accessible, with users directed to the latest version.
  notes: >-
    Version 1.0.0 (May 2024) contained 204 participants from the pilot phase; version 2.0.0
    (November 2024) added 863 participants for a total of 1067; version 3.0.0 (November 2025)
    added a further 1213 for a total of 2280. Data types remained largely the same across
    versions, with one additional imaging device added in the year 2 data and three more in the
    year 3 data, and the Snellen visual acuity variables dropped in version 3.0.0. Changes between
    versions are detailed in the CHANGELOG file included in the dataset and visible at
    docs.aireadi.org.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - 1.0.0 - DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants (pilot data collection phase)
    - 2.0.0 - DOI 10.60775/fairhub.2, released 8 November 2024, 1067 participants, 2.01 TB across 165,051 files
    - 3.0.0 - DOI 10.60775/fairhub.3, released 17 November 2025, 2280 participants, 3.82 TB across 356,343 files
  version_details: >-
    Each version is a static release accessible through the FAIRhub platform with its own DOI, and
    one version of the documentation is maintained at docs.aireadi.org for each dataset version,
    selectable from a dropdown. The FAIRhub page for version 2.0.0 states that that version of the
    dataset is no longer accessible and directs users to the latest version. A previous datasheet
    (healthsheet) exists for version 1.0.0 at https://docs.aireadi.org/docs/1/dataset/healthsheet
    and for version 2.0.0 at https://docs.aireadi.org/docs/2/dataset/healthsheet.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants
    were not told that their data would be retained for a fixed period and then deleted. Raw data
    is saved and expected to be preserved by the AI-READI project at least for the duration of the
    project.

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.60775/fairhub.2
    notes: >-
      Version 2.0.0 of the same dataset, released 8 November 2024 with 1067 participants, 2.01 TB
      across 165,051 files. FAIRhub states that this version is no longer accessible.
  - relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.60775/fairhub.1
    notes: >-
      Version 1.0.0 of the same dataset, released 3 May 2024, containing data from the 204
      participants of the pilot data collection phase.
  - relationship_type: is_source_of
    target_dataset: https://doi.org/10.60775/fairhub.4
    notes: >-
      A distinct smaller "Mini Version" of the dataset containing 100 participants, provided for
      pipeline development. It is recorded as the child of this record in the FAIRhub metadata and
      is not a version of this dataset.

external_resources:
  - external_resources:
      - https://docs.aireadi.org/
    restrictions: >-
      None; the documentation is shared under the CC-BY 4.0 license, so there are no restrictions
      associated with its use.
    notes: >-
      Dataset documentation, intended to complement the dataset landing page and strongly
      recommended reading before accessing the dataset. It contains citation instructions,
      preliminary information on access, license and training prerequisites, a healthsheet
      description of the dataset, per-domain documentation, AI-readiness considerations covering
      FAIR principles and ethical practices, additional resources and a changelog. The dataset is
      otherwise self-contained. Documentation for version 3.0.0 is at https://docs.aireadi.org/docs/3/about.
  - external_resources:
      - https://aireadi.org/
      - https://aireadi.org/team
      - https://aireadi.org/contact
      - https://aireadi.org/goals/data-sharing
    notes: >-
      AI-READI project website, including team member details, contact form, and information
      regarding dataset availability and access.
  - external_resources:
      - https://zenodo.org/communities/aireadi
      - https://doi.org/10.5281/zenodo.10642459
      - https://doi.org/10.5281/zenodo.17555036
    notes: >-
      Zenodo community of the AI-READI project, including the archived license terms for reusing
      the AI-READI dataset (v1.0 and the v2.0 record named in the version 3.0.0 metadata).
  - external_resources:
      - https://github.com/AI-READI
      - https://cds-specification.readthedocs.io/en/v0.1.1/
    notes: >-
      GitHub organization of the AI-READI project and the Clinical Dataset Structure (CDS)
      specification developed by the project as a simple and intuitive way to organize clinical
      research datasets and include structured metadata.
  - external_resources:
      - https://doi.org/10.1136/bmjopen-2024-097449
      - https://doi.org/10.1038/s42255-024-01165-x
    notes: >-
      Publications describing the study design and protocol (BMJ Open 2025;15:e097449, open access
      under CC BY-NC 4.0) and the project blueprint (Nature Metabolism 2024;6:2210-2212).
  - external_resources:
      - https://classic.clinicaltrials.gov/ct2/show/NCT06002048
      - https://reporter.nih.gov/project-details/10471118
      - https://reporter.nih.gov/search/yatARMM-qUyKAhnQgsCTAQ/project-details/10885481
      - https://commonfund.nih.gov/bridge2ai
    notes: >-
      Study registration on ClinicalTrials.gov, NIH RePORTER records for award OT2OD032644, and the
      NIH Common Fund Bridge2AI program page.
  - external_resources:
      - https://shileyeye.ucsd.edu/research/ai_readi
    notes: >-
      Year-long AI-READI research internship programme providing immersive training for individuals
      interested in working at the nexus of biomedicine and AI, comprising a two-week data
      science/programming bootcamp followed by a yearlong curriculum of didactic lectures and
      mentored research. The inaugural 2023-2024 cohort consisted of 10 interns, 70% women, 30%
      Black, and 50% from under-represented backgrounds based on NIH criteria.