relationships:
  - relationship_details: >-
      Instances are patient admissions linked across modalities: for a given admission, OMOP-standardised
      structured records, clinical note tokens, imaging studies, telemetry waveforms and EEG waveforms are
      associated. Of the released admissions, 7,642 have associated radiology data.