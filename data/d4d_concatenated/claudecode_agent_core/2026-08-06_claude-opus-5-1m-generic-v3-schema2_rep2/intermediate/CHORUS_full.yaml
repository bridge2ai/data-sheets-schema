splits:
  - split_details: >-
      The project sequesters a holdout test set, provisioned and accessible for external validation of
      models, in order to aid marketplace adoption of AI-developed models for implementation in acute and
      critical care.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Modality coverage of the released dataset is incomplete: imaging currently comprises approximately
      1,000 images with de-identification in process for a larger cohort, and EEG extraction is in process.
    scope_impact: >-
      Analyses requiring imaging or EEG at scale are constrained relative to the anticipated final dataset
      of 9 modalities across 100,000 admissions.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Full clinical note text is not held centrally: OMOP and telemetry data reside in the enclave, while
      clinical notes are stored locally at contributing sites and only tokens are made available.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset is confined to retrospective acute and critical care admissions (ICU, PICU, NICU)
      contributed by 14 hospitals participating as Data Acquisition centers within a 20-institution
      academic collaboration.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Published metadata schemas are not yet available for all modalities; metadata for clinical notes,
      imaging and EEG waveforms is recorded as planned rather than delivered.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Producing a diverse and balanced cohort is treated as an explicit challenge of the project: patient-
      focused efforts determine the ethical and legal approaches to manage privacy and bias, accounting for
      Social Determinants of Health.
    mitigation_strategy: >-
      Federated access enables sampling methods to ensure a balanced and diverse cohort, and sampling is
      designed to ensure comprehensive sets of patient conditions and clinical treatment strategies.

acquisition_methods:
  - acquisition_details: >-
      Retrospective acquisition of clinical data already recorded in hospital source systems. Data
      contributing sites extract and submit CHoRUS-specific clinical data extracts following validated
      standard operating protocols, and the extracts are standardized, tokenized, stored, visualized and
      labeled within the CHoRUS multi-center network.
    notes: "The webinar characterises the CHoRUS dataset as retrospective data collection under controlled access."

direct_collection:
  - is_direct: false
    collection_details: >-
      Data are extracted retrospectively from institutional clinical systems (EHR, PACS, bedside telemetry
      gateways and hospital EEG databases) at 14 data acquisition hospitals rather than being collected
      directly from patients by the dataset creators.

collection_mechanisms:
  - mechanism_details: >-
      Structured electronic health record extraction at contributing sites, standardized to the OMOP Common
      Data Model; the chorus-extract-upload repository provides tools to create and upload a CHoRUS Data
      Extract.
  - mechanism_details: >-
      Unstructured electronic health record text extracted and tokenized using the OHNLP toolkit, with note
      text retained locally at the contributing site.
  - mechanism_details: "Imaging acquired from hospital PACS systems and delivered in DICOM format."
  - mechanism_details: >-
      Waveform telemetry captured from bedside monitors via gateway/middleware and converted to WFDB
      format; the chorus_waveform repository holds waveform documentation and conversion scripts.
  - mechanism_details: "EEG waveforms extracted from hospital EEG databases in EDF+ and Persyst formats."
  - mechanism_details: >-
      Geocoding of OMOP Location entities via DeGauss (UF-Geocoding) to derive contextual and social
      determinants of health data elements.

collection_timeframes:
  - timeframe_details: >-
      Retrospective data collection. The NIH award period runs from 2022-09-01 to 2026-11-30; dataset
      coverage is reported as of August 2025 (14 hospitals) with acquisition of additional modalities
      (imaging de-identification, EEG extraction) in process.

data_collectors:
  - role: "Data Acquisition centers"
    collector_details: >-
      14 of the 20 academic centers in the CHoRUS collaboration contribute as Data Acquisition centers.
      Data managers at contributing sites follow the interactive workflow and standard operating procedures
      published in the Chorus_SOP repository to extract, curate and submit clinical data extracts, and
      provide regular status updates through GitHub or a Google Form.
  - role: "CHoRUS sub-teams"
    collector_details: >-
      Standards, Data Acquisition and Tooling sub-teams within the CHoRUS data generation project compile
      documentation and recordings, develop capabilities across the multi-center network, and resolve
      blocking issues raised in context-specific discussion locations.

sampling_strategies:
  - strategies:
      - "Sampling to ensure comprehensive sets of patient conditions and clinical treatment strategies."
      - "Federated access enabling sampling methods to ensure a balanced and diverse cohort."
    notes: >-
      Sampling operates across the 14 data acquisition hospitals of the CHoRUS Network as part of the
      project goal of assembling a dataset of unprecedented diversity and high resolution.

raw_data_sources:
  - source_description: "Structured electronic health record data held in hospital clinical systems."
    source_type: "Hospital electronic health record"
    raw_data_format: "Site-specific source formats, transformed to the OMOP Common Data Model"
  - source_description: "Unstructured electronic health record narrative text (clinical notes)."
    source_type: "Hospital electronic health record"
    raw_data_format: "Free text, extracted and tokenized with the OHNLP toolkit"
  - source_description: "Imaging studies held in hospital picture archiving and communication systems (PACS)."
    source_type: "PACS"
    raw_data_format: DICOM
  - source_description: "Bedside monitor waveform telemetry captured through gateway/middleware."
    source_type: "Bedside physiological monitors"
    raw_data_format: "Vendor telemetry streams, converted to WFDB"
  - source_description: "Electroencephalography recordings held in hospital EEG databases."
    source_type: "Hospital EEG database"
    raw_data_format: "EDF+ and Persyst"

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of acquired data to the OMOP Common Data Model, supported by validated semantic
      mappings for connecting clinical data in various source formats to international standards.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit, with full note
      text remaining at the contributing site and only tokens transferred.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, including de-identification of
      imaging (CTP-deid) prior to release of a larger imaging cohort.
  - preprocessing_details: >-
      Conversion of waveform telemetry to WFDB and preparation of EEG in EDF+/Persyst formats using the
      chorus_waveform conversion scripts and chorus_waveform_resources.
  - preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss to derive contextual factors such as geographic
      distance to the nearest hospital.

cleaning_strategies:
  - cleaning_details: >-
      Characterization reports are produced and returned to contributing sites following their data
      submissions (CHoRUSReports repository), supporting identification and resolution of data quality
      issues.
  - cleaning_details: >-
      Standard operating procedures for curating and delivering interoperable datasets undergo an internal
      validation and review process within the Chorus_SOP repository before publication to sites.
  - cleaning_details: >-
      Semantic mappings are pooled in the chorus-mapping repository and validated by clinical collaborators
      following an associated clinical validation SOP.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is developed to label data with targets important for
      prediction; the project develops capabilities across the multi-center network to acquire,
      standardize, tokenize, store, visualize and label data.
  - labeling_details: >-
      Clinical expertise is applied to semantic mapping and validation: clinical collaborators contribute
      to pooled tabular mappings in the chorus-mapping repository under a clinical validation SOP.

machine_annotation_tools:
  - tools:
      - "OHNLP toolkit"
      - "CTP-deid"
      - "privacy_scan_tool"
      - "DeGauss (via UF-Geocoding)"
    tool_descriptions:
      - "OHNLP toolkit: extraction and tokenization of unstructured clinical notes."
      - "CTP-deid: de-identification tooling for imaging data."
      - "privacy_scan_tool: a privacy scan tool for medical records, implemented in Python."
      - "UF-Geocoding: open source code to geocode OMOP Location entities via DeGauss."

is_deidentified:
  method: >-
    Tokenization of unstructured EHR text using the OHNLP toolkit; de-identification of imaging (CTP-deid)
    with de-identification in process for a larger imaging cohort; transformation of data using approaches
    that limit re-identification; privacy scanning of medical records.
  deidentification_details: >-
    The project transforms data using approaches that limit re-identification, and performs
    community-facing ethics focus groups to determine what data is appropriate for public sharing. Clinical
    note text is retained locally at contributing sites and only tokens are moved into the enclave.
    Patient-focused efforts determine the ethical and legal approaches used to manage privacy and bias.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset consists of patient-level clinical data from critically ill patients, including
      demographics, diagnoses, procedures, medication administration, nursing flowsheets, clinical note
      tokens, imaging, telemetry and EEG waveforms, together with social determinants of health and
      contextual factors such as geographic distance to the nearest hospital.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      All modalities are held under controlled access. Full clinical note text is not released: notes are
      stored locally at contributing sites and only tokens are placed in the enclave. Imaging is released
      only after de-identification.

human_subject_research:
  involves_human_subjects: true
  notes: >-
    The dataset is generated from retrospective clinical data of critically ill patients, targeting more
    than 100,000 critically ill patients in the anticipated final dataset, including admissions from ICU,
    PICU and NICU settings.

at_risk_populations:
  at_risk_groups_included:
    - "Pediatric intensive care unit (PICU) patients"
    - "Neonatal intensive care unit (NICU) patients"
    - "Critically ill patients receiving acute and critical care"
  notes: >-
    The currently released dataset comprises patient admissions from ICU, PICU and NICU settings; the
    project's ethics pillar performs community-facing ethics focus groups to determine what data is
    appropriate for public sharing.

ethical_reviews:
  - reviewing_organization: "CHoRUS Ethics pillar (Ethical and Trustworthy AI), CHoRUS consortium"
    review_details: >-
      One of the project's three pillars is Ethics (Ethical and Trustworthy AI). The consortium performs
      community-facing ethics focus groups to determine what data is appropriate for public sharing,
      establishes a legal framework for collecting data at scale, evaluates community perspectives on
      clinical care AI to increase trustworthiness of provenance and privacy, and analyses the existing
      legal and regulatory landscape while creating new approaches.
    notes: >-
      Drawing expertise from disciplines including team science, law, ethics, health services, biomedical
      science, engineering, and scientific journal publications.

license_and_use_terms:
  license_terms: >-
    Controlled access. All users must sign a licensing agreement, included in the registration form, before
    gaining access to the dataset; registration captures name, email and institution, and access is granted
    together with provisioned compute. A ".edu" email address is required in order to gain access to the
    dataset through the AIM-AHEAD Bridge2AI for Clinical Care Training Program.
  contact_person: >-
    Request access: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org. Program manager: Ciera McCrary,
    MGH (cmccrary@mgh.havard.edu, as printed on the project website).

regulatory_restrictions:
  confidentiality_level: restricted
  notes: >-
    Every listed data modality is recorded as being under controlled access. Data are held in a cloud
    enclave, and access requires registration, a signed licensing agreement and provisioned compute.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is made available beyond the contributing institutions under controlled access.
      Participants complete a registration form (name, email, institution) and sign a licensing agreement;
      once access is granted and compute is provisioned, an email is sent. Access requests are handled at
      dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.

distribution_formats:
  - notes: >-
      OMOP Common Data Model tables for demographics, medication administration, procedures, nursing
      flowsheets and diagnoses; held in the cloud enclave under controlled access.
  - notes: >-
      OHNLP open source schema for tokenized clinical notes; note text remains at the contributing site and
      only tokens are distributed.
  - notes: "DICOM for imaging extracted from PACS, released following de-identification."
  - notes: "WFDB for waveform telemetry, documented against an extended PhysioNet schema."
  - notes: "EDF+ and Persyst for EEG waveforms, documented against the open source EDF+ and Persyst schema."
  - notes: >-
      Access is via the Bridge2AI AI/ML for Clinical Care Collaborative Cloud enclave rather than direct
      file download; dockerized container applications and configurations supporting CHoRUS services are
      deployed to Azure.

distribution_dates:
  - notes: >-
      A released dataset was available as of August 2025 (14 hospitals, over 45K unique admissions per the
      September 2025 webinar; 50,000 admissions per the project website snapshot). Metadata for clinical
      notes, imaging and EEG waveforms is planned but not yet published. The NIH project period runs to
      2026-11-30.

intended_uses:
  - use_category: "Model development"
    usage_notes: >-
      Building machine-learning and artificial-intelligence-derived models to improve the care and outcomes
      of patients requiring critical care.
  - use_category: "External model validation"
    usage_notes: >-
      Validating externally developed AI models against the sequestered holdout test set to aid marketplace
      adoption of models for acute and critical care.
  - use_category: "Training and education"
    usage_notes: >-
      Hands-on AI/ML training, mentorship and use-case development on the Bridge2AI AI/ML for Clinical Care
      Collaborative Cloud, including work with the OHDSI/OMOP common data model and canonical Jupyter
      Notebooks.
    examples:
      - "AIM-AHEAD Bridge2AI for Clinical Care Training Program, Cohort 2 (program start 2025-11-17, end 2026-07-31)."
  - use_category: "Innovative data-driven research"
    usage_notes: >-
      Big data analysis and research at the intersection of healthcare challenges and AI/ML using
      multi-modal datasets from a broad range of cohort participants, including work presented at the
      Bridge2AI and AIM-AHEAD annual meetings and submitted to health informatics conferences and
      peer-reviewed journals.

existing_uses:
  - notes: >-
      The webinar states that the CHoRUS datasets are being used for training activities and publications.
  - examples:
      - "AIM-AHEAD Bridge2AI for Clinical Care Training Program, Cohort 2, which expands access to Bridge2AI CHoRUS data through engagement, AI training and mentorship for up to 30 trainees."
    notes: >-
      Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care Network and leverage the
      data and tools to create practical use cases, with poster presentations at the Bridge2AI Conference
      (May 2026) and the AIM-AHEAD Annual Meeting (July 2026).

future_use_impacts:
  - impact_details: >-
      The project anticipates that the dataset and the sequestered holdout set will catalyze biomedical
      research and expertise necessary to promote the patient-focused deployment of AI in acute and
      critical care, and will aid marketplace adoption of AI-developed models. The project's stated
      commitment is that the methods used promote privacy, accountability and clinical benefit; data are
      transformed using approaches that limit re-identification, and community perspectives are evaluated
      to increase trustworthiness of provenance and privacy in AI.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      CHoRUS consortium, coordinated from Massachusetts General Hospital. Program manager: Ciera McCrary,
      MGH (cmccrary@mgh.havard.edu, as printed on the project website).
  - role: academic_institution
    maintainer_details: >-
      Data access and inquiry contacts for the CHoRUS GitHub organization: dbold@emory.edu and
      jared.houghtaling@tuftsmedicine.org.
  - role: academic_institution
    maintainer_details: >-
      Software package maintainers within CHoRUS; versions, maintainers and other metadata about CHoRUS
      packages are published on the project's package status page compiled in the chorus-developer
      repository.

updates:
  update_details: >-
    The dataset is being expanded from the currently released collection toward an anticipated final
    dataset of 100,000 patient admissions across 9 data modalities from 14 data contributing hospitals.
    De-identification of a larger imaging cohort and extraction of EEG waveforms are in process, and
    published metadata for clinical notes, imaging and EEG waveforms is planned. Data contributing sites
    provide regular status updates on their progress in creating and curating CHoRUS-specific extracts,
    submitted through the GitHub interface or a Google Form that triggers a GoogleScript writing to the
    GitHub API; statuses are tracked in the Standards Project and the Data Acquisition Project.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    The CHoRUS GitHub organization houses active repositories providing software and tooling, validated
    semantic mappings, standard operating protocols for contributing sites, and project management
    overviews. Clinical collaborators can contribute to semantic mapping and validation through the
    chorus-mapping repository and its clinical validation SOP; data site managers can raise issues in the
    Standards Discussions and Data Acquisition Discussions; software contributors and users are supported
    by a web guide compiled in the chorus-developer repository. Issues across repositories are aggregated
    into a central task management project.

