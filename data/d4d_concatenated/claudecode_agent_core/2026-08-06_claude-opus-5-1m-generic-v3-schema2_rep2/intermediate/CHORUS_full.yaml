purposes:
  - response: >-
      To develop a publicly available, AI-ready critical care dataset drawn from more than 100,000
      critically ill patients, generating data for ML/AI applications aimed at characterizing acute and
      critical care illness, predicting complications, and measuring treatment response.
  - response: >-
      To meet the urgent need for infrastructure supporting artificial intelligence and machine learning
      in critical care, treating high-resolution multi-center data sets as a critical first step towards
      actionable and trustworthy AI.
  - response: >-
      To develop the most diverse, high-resolution, ethically sourced, AI-ready data set to answer the
      grand challenge of improving recovery from acute illness.
  - response: >-
      To provision a holdout test set, accessible for model external validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      To ensure that the methods of dataset creation promote privacy, accountability and clinical benefit
      while promoting a new generation of AI clinicians and scientists, including through team science and
      skill and workforce development.
  - response: >-
      To create ethically sourced datasets and tools around artificial intelligence and to create best
      practices for AI in health, as one of four data generation projects in the NIH Bridge2AI consortium.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine learning
      in critical care; developing high-resolution multi-center data sets is a critical first step towards
      actionable and trustworthy AI.
  - response: >-
      No sufficiently diverse, high-resolution, ethically sourced, AI-ready critical care dataset exists to
      answer the grand challenge of improving recovery from acute illness; CHoRUS acquires and standardizes
      a dataset of unprecedented diversity and high resolution.
  - response: >-
      The legal and regulatory landscape for collecting and sharing multimodal critical care data at scale
      is underdeveloped; the project establishes a legal framework for collecting data at scale and analyses
      the existing legal and regulatory landscape.
  - response: >-
      Multi-modal EHR, waveform, imaging and text data lack unified standards; CHoRUS develops validated
      semantic mappings and standard operating protocols so that contributing sites deliver interoperable
      datasets.

tasks:
  - response: "Characterizing acute and critical care illness."
  - response: "Predicting complications and clinical deterioration among patients with acute or critical illness."
  - response: "Measuring treatment response among patients with acute or critical illness."
  - response: >-
      External validation of AI/ML models against a sequestered holdout test set to support marketplace
      adoption of models for implementation in acute and critical care.

instances:
  - instance_type: "Patient hospital admission (intensive care, pediatric intensive care, or neonatal intensive care)"
    label_description: >-
      A visualization and annotation environment labels data with targets important for prediction; data
      are labeled as part of the data generation workflow.
    notes: >-
      Currently released dataset: 50,000 patient admissions from ICU, PICU and NICU, comprising 1.6 billion
      rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data. The
      September 2025 webinar reports over 45K unique admissions across 14 hospitals as of August 2025. The
      anticipated final dataset is 100,000 patient admissions with 9 different data modalities from 14 data
      contributing hospitals; the NIH project abstract refers to acquiring an AI-ready data set from more
      than 100,000 critically ill patients. Imaging currently comprises approximately 1,000 images, with
      de-identification in process for a larger cohort; EEG extraction is in process.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Released admissions are identified by care setting: intensive care unit (ICU), pediatric intensive
      care unit (PICU) and neonatal intensive care unit (NICU). Demographics are captured as an OMOP-
      standardised modality.
    notes: >-
      Patient-focused efforts determine the ethical and legal approaches to manage privacy and bias while
      accounting for Social Determinants of Health; federated access enables sampling methods to ensure a
      balanced and diverse cohort.

variables:
  - variable_name: "Geographic distance to the nearest hospital"
    derivation: >-
      Contextual data element added so that data elements feature appropriate contextual factors; the
      UF-Geocoding repository provides open source code to geocode OMOP Location entities via DeGauss.
    notes: "Listed in the NIH project abstract as an example of a required contextual factor."

