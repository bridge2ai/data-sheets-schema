id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution, controlled-access clinical dataset developed by
  the CHoRUS Network, one of four data generation projects in the NIH-funded Bridge2AI consortium. The
  dataset is assembled from retrospective acute and critical care data contributed by 14 data acquisition
  hospitals within a collaboration spanning 20 academic centers, and comprises structured electronic
  health record data standardised to the OMOP Common Data Model, tokenized unstructured clinical notes,
  imaging, waveform telemetry, EEG waveforms, and social determinants of health. Unified standards
  harmonize the multi-modal EHR, waveform, imaging and text data, and a visualization and annotation
  environment labels data with targets important for prediction. The anticipated final dataset covers
  100,000 patient admissions across 9 data modalities; the currently released dataset covers 50,000
  patient admissions from ICU, PICU and NICU, 1.6 billion rows of EHR OMOP data, 7,642 admissions with
  radiology data, and 23 Tb of waveform data. A sequestered holdout test set is provisioned for external
  model validation.
page: https://chorus4ai.org/
status: >-
  Under active development. A controlled-access release is available; as of August 2025 it covers 14
  hospitals, and the anticipated final dataset (100,000 admissions, 9 modalities) is not yet complete.
  The project website carries the statement "This repoitory is under review for potential modification
  in compliance with Administration directives."
created_by: CHoRUS Consortium
was_derived_from: >-
  Clinical source systems at 14 CHoRUS data acquisition hospitals, including electronic health record
  systems, PACS imaging archives, bedside monitor telemetry gateways/middleware, and hospital EEG
  databases.
conforms_to: OMOP Common Data Model (OHDSI)
keywords:
  - critical care
  - acute illness
  - artificial intelligence
  - machine learning
  - electronic health record
  - OMOP common data model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - social determinants of health
  - Bridge2AI
  - clinical care AI
notes: >-
  Two figures for the size of the released dataset appear in the input sources and are not reconciled by
  them: the September 2025 AIM-AHEAD/Bridge2AI informational webinar states that, as of August 2025, the
  CHoRUS dataset covers 14 different hospitals with over 45K unique admissions, while the CHoRUS project
  website snapshot reports a "Current Released Dataset" of 50,000 patient admissions from ICU, PICU and
  NICU. Both figures are recorded here as stated by their respective sources. The webinar's modality
  table records a published metadata schema of "OMOP schema with extensions" for one of the five
  OMOP-standardised modalities; the table layout in the source does not permit unambiguous assignment of
  that entry to a specific modality, so the OMOP-standardised file collections below record "OMOP schema"
  without the extension qualifier.

