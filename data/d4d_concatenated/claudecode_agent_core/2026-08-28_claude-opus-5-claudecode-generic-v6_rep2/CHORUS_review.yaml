notes: >-
  Receipts are real: all 26 sampled receipted values sit on passages that say what the
  value says; the one weak receipt (slot-004) is a website contact line read as a dataset
  maintainer, and the record's own prose admits that reading. The adverse findings
  concentrate on identifier minting: the schema makes `id` optional on every
  DatasetProperty, yet the record mints 68 fragments, none referenced by any other value
  (rule-14), including seven for persons (rule-11), and the same repository
  (privacy_scan_tool) is minted twice under two fragments. The reconciliation report's
  claim that 'Fragments are minted only for objects the schema requires an `id` on' is not
  true of this schema. distribution_formats[5] 'Cloud enclave' is an access route filed as
  a format. Two scope_impact values and special_populations are inferences the record
  should not carry; the record labels the special_populations one honestly in
  source_caveats. No instrument defect observed: every sampled snippet is in the chunk
  cited, so nothing here should have been caught by the receipt validator. Chunk c004
  (lines 455–854) was not sampled for a nothing_relevant item and is marked extracted; I
  read only its opening for slot-006 context.
