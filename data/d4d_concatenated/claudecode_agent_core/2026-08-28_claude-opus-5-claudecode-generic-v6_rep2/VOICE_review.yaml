notes: >-
  Three receipted items are weak because the snippet cited is on topic but does
  not state the value: slot-005 (a consortium author entry receipting a person's
  name), slot-014 (a third membership list receipting a caveat about two other
  lists), slot-018 (a bare author-list name receipting a principal-investigator
  role). The principal_investigator pattern - every lead investigator recorded as
  their own PI while line 2028 names only two co-PIs - is the one semantic issue
  that recurs across rules 01, 07 and the receiptless sample (slot-037). The
  Rudzicz affiliation (Dalhousie at line 629 vs University of Toronto) is a
  same-kind conflict to the one the record caveated for Johnson, and went
  unrecorded. No pack gaps were listed. Nothing here is a defect the deterministic
  validator should have caught; snippets verified as claimed.
