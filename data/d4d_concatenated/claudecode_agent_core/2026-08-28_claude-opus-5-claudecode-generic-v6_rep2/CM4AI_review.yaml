notes: >-
  Pack lists no gaps. slot-029 is borderline: the ROR string is in the bundle (rule-10
  holds), but its identification as the University of Virginia and as the accountable
  organization is cross-page inference the record does not caveat. rule-13 and rule-01
  findings are judgement calls the record itself documents in caveats; they are adverse
  because the rules ask for the higher-ranked value and for omission over inference, not
  for a well-explained inference. No defect the receipt validator should have caught was
  found: every sampled snippet was in its cited chunk.
