acquisition_methods:
- name: MDA-MB-468 triple negative breast cancer cell line
  was_directly_observed: true
  acquisition_details: MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell
    line established from a metastatic site pleural effusion of a 51-year-old black female
    with a metastatic mammary adenocarcinoma, available from ATCC. The cell line has been
    extensively used to study triple-negative breast cancer and is well characterized with
    data such as transcriptomic, mutational profile and whole-genome sequencing available.
    CM4AI states that it was ethically sourced.
- name: KOLF2.1J induced pluripotent stem cell line
  was_directly_observed: true
  acquisition_details: The KOLF2.1J (RRID:CVCL_B5P3) iPSC line was derived from a healthy
    male Northern European donor and is available from the Human Induced Pluripotent Stem
    Cells Initiative (HipSci) resource. It is available for access by not-for-profit organizations
    via a simple material transfer agreement. CM4AI states that it was ethically sourced.
collection_mechanisms:
- name: Three complementary mapping approaches
  mechanism_details: 'CM4AI is a coordinated effort involving three complementary mapping
    approaches: proteomic mass spectrometry, cellular imaging, and genetic perturbation via
    CRISPR/Cas9. Input data streams are generated using immunofluorescence subcellular microscopy
    for spatial proteomics data; affinity purification mass spectroscopy (AP-MS) and size
    exclusion mass spectroscopy (SEC-MS) methods for protein-protein interaction data; and
    single-cell CRISPR-Cas perturbation screens by cell type.'
- name: AP-MS and SEC-MS protein interaction mapping
  mechanism_details: 'To map protein-protein interactions of 100 chromatin regulators under
    different conditions (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated,
    neurons and cardiomyocytes), AP-MS was employed on endogenously tagged cell lines and
    size-exclusion chromatography coupled to mass spectrometry for proteome-wide complex and
    interaction mapping, as two orthogonal mass spectrometry based approaches. 17 genes were
    endogenously tagged in MDA-MB-468 and AP-MS data acquired under three conditions (untreated,
    paclitaxel and vorinostat treated), with 34 additional genes in the process of being tagged.
    SEC-MS was performed on MDA-MB-468 cells under the same three conditions, identifying
    72 of the 100 chromatin modifiers, 52 of them integral components of protein complexes,
    and PPI profiles of over a thousand complexes were detected in MDA-MB-468 cells. SEC-MS
    was also performed in KOLF2 iPSCs and derivatives, uncovering more than 700 protein complexes
    in both parental iPSCs and differentiated neurons.'
- name: Spatial proteomics immunofluorescence imaging
  mechanism_details: Spatial subcellular organization was mapped using the Human Protein Atlas
    resource of antibodies. Automated fixation and permeabilization protocols were established
    for the pipetting robot for the MDA-MB-468 and KOLF2 cell lines, and spatial proteomics
    mapping of 100 chromatin regulators was completed in MDA-MB-468 cells with and without
    paclitaxel or vorinostat, with another 500 proteins pending significant hits from the
    genetic perturbation and protein interaction results. Imaging is by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy.
- name: Single-cell CRISPR perturbation screens
  mechanism_details: Single-cell CRISPR screens perturbing 100 chromatin regulators were performed
    in MDA-MB-468 cells under three conditions (no treatment, paclitaxel or vorinostat) and
    in KOLF2 iPSC in the undifferentiated state. A CRISPR lentiviral library targeting 100
    chromatin factors with 6 guide RNAs per gene was designed, and MDA-MB-468 and KOLF2 CRISPR
    lines expressing inducible dCas9 were generated and characterized. The screens were done
    using the 10x Genomics 3'HT kit.
collection_timeframes:
- name: Funded project period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details: NIH RePORTER records the project start as 2022-09-01 and the project
    end as 2026-08-31 for the CM4AI data generation project. The Dataverse release pages state
    instead that the dataset will be regularly updated and augmented through the end of the
    project in November 2026. The dates recorded here are the RePORTER values; the release
    pages' November 2026 statement is noted rather than merged.
  source_caveats: 'The two sources disagree about when the project ends: NIH RePORTER gives
    2026-08-31 and the Dataverse release pages say November 2026. The input manifest ranks
    the current Dataverse release above the RePORTER page, but the RePORTER value is the only
    one stated as a date rather than a month, and the release pages state it as a maintenance
    commitment rather than an award end; both are recorded rather than one being silently
    selected.'
