  description: The FAIRSCAPE AI-readiness framework, which performs the AI-readiness packaging
    of CM4AI data, software, metadata and provenance graphs, is described with a tutorial
    and instructions for installation at fairscape.github.io.
  restrictions:
  - Copyright 2024 to this software is held by the Rector and Board of Visitors of the University
