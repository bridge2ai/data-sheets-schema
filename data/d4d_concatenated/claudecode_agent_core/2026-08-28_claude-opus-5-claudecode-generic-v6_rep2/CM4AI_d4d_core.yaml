- name: Cell Mapping Toolkit
  external_resources:
  - https://github.com/idekerlab/cellmaps_pipeline
  - https://cellmaps-pipeline.readthedocs.io/
  description: The Cell Mapping Toolkit implements the end-to-end cell mapping pipeline as
    a series of Python packages, including steps for processing the protein imaging and biophysical
    interaction datasets, embedding the input modalities, integrating the modalities, constructing
    the hierarchical cell map, and annotating the cell map with known resources. Each package
    is pip-installable and linked to user documentation hosted at ReadTheDocs.
- name: Integrative Modeling Platform
  external_resources:
  - https://integrativemodeling.org
  description: The open source Integrative Modeling Platform (IMP) package, version 2.18,
    used to script the four-stage integrative structure modeling protocol applied to MuSIC
    communities.
- name: Multimodal cell maps publication and its deposits
  external_resources:
  - https://doi.org/10.1038/s41586-025-08878-3
  - https://ndexbio.org
  - MSV000097168
  - PXD052362
  - https://modelarchive.org
  - http://musicmaps.ai/u2os-cellmap/
  description: 'The publication ''Multimodal cell maps as a foundation for structural and
    functional genomics'' (Schaffer, Hu, Qian et al., Nature 642, 222-231, 2025) reports a
    U2OS osteosarcoma cell map built by the same multimodal approach and acknowledging the
    same Bridge2AI award. Its data are deposited separately from the CM4AI Dataverse releases:
    the U2OS cell map at ndexbio.org under uuid f693137a-d2d7-11ef-8e41-005056ae3c32, the
    AP-MS interaction data at ndexbio.org under uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa,
    AP-MS raw mass spectrometry files at MassIVE under identifier MSV000097168, SEC-MS raw
    files and search results at ProteomeXchange under identifier PXD052362, structural models
    at the ModelArchive Database under identifiers ma-idk-u2osmap and ma-m5og4, the image
    dataset within the Human Protein Atlas v23 release, and the protein assemblies at the
    EBI Protein Complex Portal under the query CLO:0009454. The companion Multiscale Integrated
    Cell visualization portal provides links to the major data and derived resources associated
    with that study.'
  notes: A Publisher Correction to the article was published on 02 October 2025 at https://doi.org/10.1038/s41586-025-09648-x,
    and a change history entry of 29 April 2025 records that an omitted passage was restored
    to the Acknowledgements section.
  restrictions:
  - The article is licensed under a Creative Commons Attribution 4.0 International License,
    which is not the license the CM4AI data releases carry.
  archival: false
