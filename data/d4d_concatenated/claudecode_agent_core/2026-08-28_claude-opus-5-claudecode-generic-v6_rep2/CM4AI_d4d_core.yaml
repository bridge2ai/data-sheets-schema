raw_data_sources:
- name: Krogan Laboratory deposition archive
  source_description: Protein-protein interaction networks for the cell line and conditions
    are downloaded from the Krogan Laboratory's deposition archive and made available for
    further processing by the MuSIC pipeline.
  source_type: laboratory deposition archive
- name: Lundberg Laboratory deposition archive
  source_description: Immunofluorescence images for the cell line and conditions are downloaded
    from the Lundberg Laboratory's deposition archive and made available for further processing
    by the MuSIC pipeline.
  source_type: laboratory deposition archive
- name: External repository deposits of the raw measurements
  source_description: 'The release pages link the raw measurements to external repositories:
    SEC-MS data in KOLF2.1J iPSCs (undifferentiated, NPC, neuron, and cardiomyocyte) and in
    MDA-MB-468 breast cancer cells with and without treatment to the MassIVE Repository; AP-MS
    data in MDA-MB-468 cells treated with paclitaxel and with vorinostat to the MassIVE Repository;
    the CRISPRi Perturbation Atlas of iPSCs to Figshare; and Sequence Read Archive data to
    an NCBI BioProject. Perturb-seq deposits for undifferentiated KOLF2.1J iPSCs and for MDA-MB-468
    cells are marked Embargoed.'
  access_details: The March 2025 release recorded of its SEC-MS crate that the data will be
    uploaded to Pride when available.
preprocessing_strategies:
- name: MuSIC data integration pipeline
  preprocessing_details: 'Input data streams are integrated via the Multi-Scale Integrated
    Cell (MuSIC) software pipeline, employing deep learning models and community detection
    algorithms. The pipeline steps are: download protein-protein interaction and image data
    from the contributing laboratories'' deposition archives; generate per-modality embeddings;
    co-embed the two modalities; perform protein community detection and hierarchy creation;
    and evaluate the resulting hierarchy. The pipeline is divided into multiple segments,
    each of which calls the FAIRSCAPE client package to validate inputs and create the output
    RO-Crate package for that segment.'
- name: Per-modality embedding generation
  preprocessing_details: Downloaded protein-protein interaction networks are processed using
    the node2vec deep learning model to reduce dimensionality, producing a PPI embedding that
    contains information about the protein's interactions. Immunofluorescence images are processed
    using a Human Protein Atlas deep learning model to reduce dimensionality, producing an
    image embedding that contains information about protein localization.
  used_software:
  - id: https://github.com/eliorc/node2vec
    name: node2vec
    description: Python implementation of the node2vec representation learning method, used
      to represent each protein as a feature vector based on its protein-protein interaction
      neighbourhood.
    url: https://github.com/eliorc/node2vec
- name: Multimodal co-embedding
  preprocessing_details: The protein-protein interaction and image embeddings are integrated
    to obtain a co-embedding for each protein using contrastive deep learning. The integration
    model learns co-embeddings such that the original embeddings can be reconstructed with
    minimal information loss and proteins with similar interaction and image embeddings have
    similar co-embeddings. Community detection is then performed on the all-by-all similarities
    of pairs of proteins in the co-embedding space, and the resulting hierarchy of protein
    communities is output as the final cell map.
- name: AI-readiness packaging with FAIRSCAPE
  preprocessing_details: Output cell maps are packaged with provenance graphs and rich metadata
    as AI-ready datasets in RO-Crate format using an extended, client-server version of the
    FAIRSCAPE framework. FAIRSCAPE-CLI is called when any computation or coherent set of computations
    in the pipeline is completed, and is passed metadata defining schemas in JSON-Schema for
    the datasets in the computational unit as well as the inputs, computations, software,
    models and outputs. The RO-Crates are sent to the FAIRSCAPE server, where they are registered
    and assigned persistent, resolvable, globally unique persistent identifiers under the
    ARK scheme, decomposed into their individual components, and end-to-end entailments computed
    on each RO-Crate's provenance as expressed in the EVI Evidence Graph Ontology. Persistent
    identifiers resolve to machine- and human-readable landing pages containing metadata expressed
    in JSON-LD using vocabularies from Schema.org, EVI, and other public ontologies.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    license: MIT
    url: https://fairscape.github.io
    description: AI-readiness framework, described with a tutorial and installation instructions
      at fairscape.github.io. Copyright 2024 is held by the Rector and Board of Visitors of
      the University of Virginia; it is available under the open source MIT License.
labeling_strategies:
- name: Cell map hierarchy annotation
  data_annotation_protocol: Cell maps are annotated in a two-pronged approach. First, cell
    maps are aligned to known protein function and pathway resources, including the Gene Ontology
    and Reactome, to determine protein assemblies in the cell map with high overlap with known
    cell biology. Second, assemblies in the cell maps are annotated using a large language
    model approach developed by the project to name sets of proteins and assign a name confidence
    score.
  source_caveats: The CM4AI pipeline description names the second step as a large language
    model approach developed by the project without naming a model or a version, so no automated
    annotation tool is asserted; the input documents name GPT-4 only in the Nature publication's
    account of the same naming method applied to a different cell map, which this record treats
    as outside its referent.
existing_uses:
- name: Uses at the time of release
  examples:
  - Initial datasets, tools and standards associated with all three parallel mapping platforms
    have been released and made publicly available at the CM4AI web portal.
  - The data were made available at the CM4AI CodeFest in March 2024, accompanied by detailed
    tutorials explaining how the data were derived and integrated, and providing production-ready
    software for producing the datasets.
intended_uses:
- name: Intended uses stated on the release pages
  use_category: research
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes,
    treatment conditions, or genetic perturbations
  usage_notes: The released datasets focus on chromatin modifiers, metabolic enzymes, and
    other proteins linked to cancer, neuropsychiatric, and cardiac disorders.
prohibited_uses:
- name: Clinical decision-making and patient care
  description: These laboratory data are not to be used in clinical decision-making or in
    any context involving patient care without appropriate regulatory oversight and approval.
  prohibition_reason: Stated as a prohibited use on each Dataverse release page.
- name: Commercial use without a separate license
  description: The data may not be used for commercial purposes under the CC BY-NC-SA 4.0
    license they are released under; commercial use requires a separate license negotiation
    with the copyright holder.
  prohibition_reason: License restriction. The license deed states that the material may not
    be used for commercial purposes, and the preprint states that commercial use requires
    a separate license negotiation with the copyright holder (UCSD, Stanford, and/or UCSF
    depending upon the specific data package in question).
- name: Redistribution under different terms
  description: Contributions that remix, transform or build upon the material must be distributed
    under the same license as the original, and no additional legal terms or technological
    measures may be applied that legally restrict others from doing anything the license permits.
  prohibition_reason: ShareAlike and No-additional-restrictions conditions of the CC BY-NC-SA
    4.0 license.
