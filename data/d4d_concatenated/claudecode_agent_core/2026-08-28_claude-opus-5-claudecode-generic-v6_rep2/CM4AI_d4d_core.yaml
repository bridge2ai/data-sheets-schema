purposes:
- name: Ethical AI-ready datasets of cell architecture
  response: To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
    data collected for human cell lines, to enable transformative biomedical AI research.
- name: Machine-readable hierarchical maps of cell architecture
  response: To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
    cell lines under perturbed and unperturbed conditions.
- name: Interpretable genotype-phenotype learning
  response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
tasks:
- name: Visible machine learning systems
  response: The data are intended to stimulate research and development in visible machine
    learning systems informed by multi-scale cell and tissue architecture, which are built
    directly on knowledge maps of cell and tissue architecture rather than operating as black
    boxes.
- name: Interpretation of genetic variants and mutations
  response: Cell maps provide a foundation for downstream applications in human genomics,
    including interpretation of genetic variants and mutations, and have been used in AI tools
    for visible machine learning or visible neural networks to interrogate how protein assemblies
    in the cell affect cell-level phenotype predictions.
addressing_gaps:
- name: Uninterpretable genotype-to-phenotype models
  response: In genomics and precision medicine, machine learning models are often black boxes,
    predicting phenotypes from genotypes without understanding the mechanisms by which such
    translation occurs. CM4AI addresses this deficiency by generating a resource of matched
    data and tools that enables the creation of visible machine learning systems.
