    area of Functional Genomics, organized into three pillars (Data, People, and Ethics) and
    six modules (Data Acquisition, Tools, Standards, Skills and Workforce Development, Teaming,
    and Ethics). The Dataverse releases give the production locations as the University of
    California San Diego, the University of California San Francisco, Stanford University,
    and the University of Virginia.
  source_caveats: The collaborating institutions are listed differently across the bundle.
    The CM4AI data releases page, which the input manifest ranks above the preprint and the
