    name: Jillian Parker
    orcid: 0000-0003-4535-3486
    email: jillianparker@health.ucsd.edu
    affiliation:
    - name: University of California, San Diego
    description: The only person the release pages name under Data Governance Committee. Committee
      membership beyond this contact is not disclosed in the input documents.
    source_caveats: The Dataverse release pages name 'Jillian Parker (jillianparker@health.ucsd.edu)'
      as the Data Governance Committee entry and separately list an author 'Parker J (University
      of California, San Diego)' with ORCID 0000-0003-4535-3486. The ORCID is attached here
      on the basis of that within-page correspondence of surname, initial and institution;
