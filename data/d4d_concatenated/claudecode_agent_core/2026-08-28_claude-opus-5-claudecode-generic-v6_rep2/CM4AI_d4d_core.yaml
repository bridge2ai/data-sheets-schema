title: Cell Maps for Artificial Intelligence (CM4AI)
id: https://cm4ai.org/
name: CM4AI
description: CM4AI is the Functional Genomics Grand Challenge in the U.S. National Institutes
  of Health Bridge2AI program. It delivers machine-readable hierarchical maps of cell architecture
  as AI-ready data, together with quarterly data releases of the map-input data streams. The
  data are produced by multimodal interrogation of chromatin modifiers, metabolic enzymes,
  and other proteins involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
  cell lines under treated and untreated conditions, using mass spectrometry based proteomics
  (AP-MS and SEC-MS), spatial proteomics and cell imaging (immunofluorescence confocal microscopy),
  and genetic perturbation using CRISPR/Cas9. The two cell systems interrogated are the MDA-MB-468
  triple negative breast cancer line, untreated and treated with paclitaxel or vorinostat,
  and the KOLF2.1J induced pluripotent stem cell line, undifferentiated and differentiated
  into neural progenitor cells, neurons, and cardiomyocytes. Output data are packaged with
  provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE
  framework, and are distributed as a numbered release series in LibraData, the University
  of Virginia's instance of Dataverse. The project web site reports 7,023 total proteins investigated,
  11,739 genes targeted, 53,788 immunofluorescent images, 1,374 protein interactions, and
  a data volume of 21.4 TB.
notes: 'Two curated flagship groupings are described by the project without being separately
  identified in the release inventory: for undifferentiated (parental) iPSCs and iPSC-derived
  neural progenitor cells, neurons and cardiomyocytes, perturb-seq of more than 11,000 genes
  (whole-genome), SEC-MS capturing approximately 7,000 proteins, and immunofluorescence images
  announced as forthcoming; for triple negative breast cancer cells under untreated (DMSO
  control), vorinostat and paclitaxel conditions, SEC-MS capturing approximately 7,000 proteins,
  immunofluorescence images for 523 proteins, perturb-seq of 200 genes, and AP-MS interactomes
  announced as forthcoming.'
source_caveats: 'The referent chosen for this record is the CM4AI dataset as the project distributes
  it: the Dataverse release series of MDA-MB-468 and KOLF2.1J multimodal data. The Nature
  publication in the input bundle, ''Multimodal cell maps as a foundation for structural and
  functional genomics'', reports a U2OS osteosarcoma cell map that acknowledges the same Bridge2AI
  award but is deposited separately in NDEx, MassIVE, ProteomeXchange and ModelArchive and
  is named in none of the CM4AI release inventories; it is therefore recorded here as a related
  publication and set of external resources rather than as part of this dataset''s composition,
  and its counts, protocols and separate funders are not carried into this record''s own composition,
  collection or funding slots.'
