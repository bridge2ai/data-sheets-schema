known_biases:
- name: Cell line derivation limits population representation
  bias_type: representation_bias
  bias_description: Data in the release were derived from commercially available de-identified
    human cell lines and do not represent all biological variants which may be seen in the
    population at large.
  affected_subsets:
  - All released data streams, which derive from the MDA-MB-468 and KOLF2.1J cell lines
known_limitations:
- name: Interim release
  limitation_type: scope_limitation
  limitation_description: 'The releases are interim: the data are not yet in completed final
    form and each is labelled a Beta release.'
  scope_impact: The current release is most suitable for bioinformatics analysis of the individual
    datasets.
- name: Computed cell maps not included
  limitation_type: coverage_limitation
  limitation_description: Computed cell maps are not included in the release, and the release
    does not contain predicted cell maps, which will be added in future releases.
- name: Incomplete overlap between data streams
  limitation_type: integration_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
- name: Domain expertise required
  limitation_type: methodological_limitation
  limitation_description: Meaningful analysis of the released data requires domain expertise.
- name: Repository under administrative review
  limitation_type: scope_limitation
  limitation_description: Both the CM4AI web site and the University of Virginia Dataverse
    collection carry the notice that the repository is under review for potential modification
    in compliance with Administration directives.
