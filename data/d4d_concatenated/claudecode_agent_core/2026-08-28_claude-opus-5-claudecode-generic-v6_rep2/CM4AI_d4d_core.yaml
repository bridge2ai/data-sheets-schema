  contact_person: Vardit Ravitsky
  source_caveats: The release pages give this contact's address at thehastingscenter.org while
    the same pages' author list records the affiliation as University of Montreal; both are
    recorded as stated.
- name: Ethical review contact, Jean-Christophe Belisle-Pipon
  review_details: 'The second of the two ethical review contacts named jointly on the Dataverse
    release pages: Jean-Christophe Belisle-Pipon (ORCID:0000-0002-8965-8153), Simon Fraser
    University, reachable at jean-christophe_belisle-pipon@sfu.ca.'
  reviewing_organization: Simon Fraser University
  contact_person: Jean-Christophe Belisle-Pipon
- name: CM4AI Ethics module
  review_details: The Ethics team worked with the Data Acquisition, Tools, and Standards Modules
    to develop a plan for ethical preparation, licensing, dissemination, and Data Access supervision
    of CM4AI datasets, balancing the openness of the data produced with protection of intellectual
    property and supervision of potential efforts at commercialization. The team employs a
    methodology inspired by Value-Sensitive Design, crafting an axiological repository of
    values to guide design standards and expectations, and is formulating the CM4AI Life Cycle,
    a framework designed to elucidate governance milestones throughout the data generation
    and AI system development processes. The Ethics Pillar also supported the Bridge2AI Data
    Sharing and Dissemination Working Group in developing a Code of Conduct.
human_subject_research:
  name: Human subjects status
  involves_human_subjects: false
  description: 'The Dataverse release pages record Human Subjects: No, De-identified Samples:
    Yes, and FDA Regulated: No. The preprint states that CM4AI data are distinctive within
    Bridge2AI in that they are non-clinical, from tissue cultures, and are considered to be
    de-identified as they cannot be matched, with current knowledge, to a human subject.'
license_and_use_terms:
  name: CC BY-NC-SA 4.0 with attribution and citation requirements
  license_terms: Data packages are licensed under Creative Commons Attribution-NonCommercial-ShareAlike
    4.0 International (CC BY-NC-SA 4.0) license terms, which include a requirement for attribution
    to the dataset authors and the copyright holding institutions, and citation of the CM4AI
    preprint. Under the license the user is free to share and adapt the material provided
    appropriate credit is given, a link to the license is provided, and changes are indicated;
    the material may not be used for commercial purposes; and contributions built upon the
    material must be distributed under the same license. The Dataverse dataset terms add that
    community norms and good scientific practices expect proper credit to be given via citation,
    using the data citation shown on the dataset page.
  data_use_permission: no_commercial_use
  description: 'All CM4AI integration and packaging software is separately stated to be freely
    available under nonrestrictive open-source licenses: the Tools data integration pipeline
    under the BSD-3 license in GitHub for alpha-level tools or in the Zenodo long-term archive
    for production-ready tools, and the FAIRSCAPE framework under the MIT license.'
  source_caveats: The license page captured in the input documents is the Creative Commons
    deed, which states of itself that it highlights only some of the key features and terms
    of the actual license, is not a license and has no legal value.
ip_restrictions:
  name: Copyright holders and commercial licensing
  restrictions:
  - Copyright 2025 to the released data is held by the Regents of the University of California
    except where otherwise noted; spatial proteomics raw image data is copyright 2025 by The
    Board of Trustees of the Leland Stanford Junior University. The preprint states the same
    division of copyright for 2024.
  - Commercial use requires a separate license negotiation with the copyright holder, which
    is UCSD, Stanford, and/or UCSF depending upon the specific data package in question.
  - The project's ethics plan balances the openness of the data produced with protection of
    the intellectual property, and supervision and monitoring of potential efforts at commercialization.
regulatory_restrictions:
  name: Regulatory status
  confidentiality_level: unrestricted
  description: The Dataverse release pages record the release as not FDA regulated, not involving
    human subjects, and comprising de-identified samples. All release files are marked Public
    with no access request required.
data_governance:
  name: CM4AI Data Access Committee and governance contacts
  committee_name: Data Access Committee
  access_review_process: A Data Access Committee supervises ethical matters related to dataset
    distribution and potential dual licensing for commercial use. The Ethics team worked with
    the Data Acquisition, Tools, and Standards Modules to develop the plan for ethical preparation,
    licensing, dissemination, and Data Access supervision of CM4AI datasets. Separately, the
    Bridge2AI Code of Conduct developed by the Bridge2AI Data Sharing and Dissemination Working
    Group outlines basic requirements for participants in the Bridge2AI Open House to access
    Bridge2AI data, including CM4AI datasets, to attest and commit to prior to accessing the
    data. The released files themselves are public and require no access request.
  stewardship_roles:
  - The Ethics team is formulating the CM4AI Life Cycle, a framework designed to elucidate
    governance milestones throughout the data generation and AI system development processes.
  - Long term preservation of the releases is provided by the University of Virginia Dataverse,
    supported by committed institutional funds.
  committee_contact: Jillian Parker
  committee_members:
