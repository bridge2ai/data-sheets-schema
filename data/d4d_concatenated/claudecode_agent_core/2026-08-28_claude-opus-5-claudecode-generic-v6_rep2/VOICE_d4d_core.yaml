title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
version: 3.1.0
id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice
description: 'Bridge2AI-Voice is a large, ethically sourced and demographically diverse voice
  dataset linked to health information, produced by the Bridge2AI-Voice consortium under the
  NIH Common Fund Bridge2AI program. It is a comprehensive collection of data derived from
  voice recordings with corresponding clinical information: version 3.1 contains data for
  833 adult participants collected across five sites in North America. Participants were selected
  on the basis of known conditions that manifest within the voice waveform, spanning voice
  disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders
  and respiratory disorders, alongside control participants. The published release contains
  data considered low risk - derivations of the audio such as spectrograms, Mel spectrograms,
  MFCCs, articulatory features and phonetic posteriorgrams - rather than the original voice
  recordings, together with detailed demographic, clinical and validated questionnaire data.
  Raw audio is retained but is disseminated only through a separate controlled-access route.
  The project seeks to create an ethically sourced flagship dataset that enables future artificial
  intelligence research and supports critical insights into the use of voice as a biomarker
  of health.'
source_caveats: The bundle documents a release programme rather than a single release, and
  the record describes the dataset as a whole with its current release (3.1.0, published 1
  May 2026) named in `version`. Where a value is specific to one release this is stated in
  the value itself. The project documentation at docs.b2ai-voice.org describes the dataset
  in places as of version 2.0.0 and in places as of version 3.0.0; the PhysioNet release pages
  are ranked higher by the input manifest (tier 1, data resource) than that documentation
  (tier 2) and were preferred for release-specific facts such as participant counts and de-identification
  steps. The bundle also contains documentation of the Bridge2AI-Voice Pediatric Dataset,
  which the input manifest declares a distinct dataset; it is represented here only through
  `related_datasets` and no pediatric fact has been merged into this record. Contact e-mail
  addresses in the project documentation are redacted in the bundle and could not be transcribed.
