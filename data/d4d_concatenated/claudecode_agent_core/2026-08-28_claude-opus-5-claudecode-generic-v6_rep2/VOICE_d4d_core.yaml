distributions:
- description: Dense derived audio features distributed as Parquet files together with plain-text
    feature tables. Each element of a Parquet file carries a participant identifier, a session
    identifier, the task performed, the number of time frames for that feature and the tensor
    data. In version 3.1.0 the files hold torchaudio spectrograms (n=29,278), Mel spectrograms
    (n=29,278), MFCCs (n=29,278) and pitch (n=32,522); sparc electromagnetic articulography
    (n=28,640), loudness (n=31,855), periodicity (n=31,872) and pitch (n=31,872); and phonetic
    posteriorgrams (n=29,289). Spectrograms, Mel spectrograms, MFC coefficients, PPGs and
    EMAs for sensitive records and audio checks have been removed from version 3.1. Every
    file has an accompanying JSON data dictionary with the same file stem.
  id: doi:10.13026/37yb-1t42#features
  name: Derived audio features
  source_caveats: The file count is the number of files the version 3.1.0 release page enumerates
    for this folder - nine Parquet binaries plus static_features.tsv and audio_quality_metrics.tsv
    - and does not count the JSON data dictionary that accompanies each of them. The release
    states no file count of its own and gives no file sizes, so no total byte size is recorded
    here or at the dataset level.
- description: Spectrograms of dimension 201xT generated using the short-time Fast Fourier
    Transform with a 25 ms window size, 10 ms hop length and a 400-point FFT; 29,278 records
    in version 3.1.0.
  id: doi:10.13026/37yb-1t42#features-torchaudio-spectrogram
  name: torchaudio_spectrogram.parquet
  path: features/torchaudio_spectrogram.parquet
- description: 'Estimated electromagnetic articulography from a deep learning model, of dimension
    Tx12, where the twelve values are the X and Y positions of six articulators: tongue dorsum,
    tongue body, tongue tip, lower incisor, upper lip and lower lip; 28,640 records in version
    3.1.0.'
  id: doi:10.13026/37yb-1t42#features-sparc-ema
  name: sparc_ema.parquet
  path: features/sparc_ema.parquet
- description: Phonetic posteriorgram probabilities across 40 phoneme categories, of dimension
    40xT at a frame rate of 100 Hz; 29,289 records in version 3.1.0.
  id: doi:10.13026/37yb-1t42#features-ppgs
  name: ppgs.parquet
  path: features/ppgs.parquet
- description: Features derived from the raw audio with one feature per audio recording, drawn
    from openSMILE, Praat, parselmouth and torchaudio, with one row per unique recording.
  id: doi:10.13026/37yb-1t42#features-static
  name: static_features.tsv
  path: features/static_features.tsv
- description: One feature per audio recording derived from the raw audio, related to quality
    control metrics; added in version 3.1.0.
  id: doi:10.13026/37yb-1t42#features-audio-quality
  name: audio_quality_metrics.tsv
  path: features/audio_quality_metrics.tsv
- description: A Parquet binary file with its corresponding data dictionary, holding specific
    information about each recording including the task instructions and prompts and information
    about the microphone used and its gain. Added in version 3.1.0.
  id: doi:10.13026/37yb-1t42#metadata
  name: Recording metadata
- description: Organized information collected from the participant or another individual
    during their encounter, distributed as tab-separated files each with a JSON data dictionary.
    The folder holds confounders, demographics, per-diagnosis files (airway stenosis, amyotrophic
    lateral sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment, control,
    COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal dystonia,
    laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous lesions, unexplained
    chronic cough and unilateral vocal fold paralysis), enrollment files (eligibility, enrollment
    form and participant), validated questionnaire files (ADHD adult, custom affect scale,
    DSM-5 adult, dyspnea index, GAD-7, Leicester cough questionnaire, PANAS, PHQ-9, productive
    vocabulary, psychiatric history, PTSD adult, VHI-10 and voice perception) and task files
    (acoustic task, Harvard sentences, random item generation, recording, session, Stroop
    and Winograd). These can be used for cohort selection.
  id: doi:10.13026/37yb-1t42#phenotype
  name: Phenotype data
purposes:
- name: Build an ethically sourced, diverse voice database linked to health data
  response: To generate a large-scale, multi-institutional, ethically sourced and diverse
    database of human voice, speech and respiratory sounds linked to multimodal health biomarkers,
    in order to fuel voice AI research.
  description: 'The consortium states this as its primary deliverable: an openly documented,
    demographically diverse voice database linked to clinical, demographic and questionnaire
    data that is AI/ML friendly.'
  source_caveats: Sources disagree on the intended size of the finished database. The project
    documentation states a flagship dataset "of 10,000 voices" and an anticipated enrolment
    of 10,000 by 2027; the IRB protocol states a sample size of 30,000 participants, with
    5,000 per disease category, and the audiomics white paper states a primary deliverable
    of "a publicly available database of 30 000 human voices". The manifest ranks the project
    documentation and the IRB protocol at the same tier (2), so the ranking cannot decide
    between 10,000 and 30,000 and both figures are recorded here rather than one being selected;
    the white paper is tier 3 and is the weakest of the three.
- name: Integrate voice as a biomarker of health into clinical care
  response: To integrate the use of voice as a biomarker of health into clinical care by building
    predictive models that assist in screening, diagnosis and treatment of a broad range of
    diseases, several of which have well-recognized unmet clinical needs.
- name: Establish standards for audiomics
  response: To establish and standardize the interdisciplinary field of audiomics, defining
    standards for acoustic data acquisition, interoperability and AI readiness, and developing
    infrastructure for audiomics data storage and sharing across research institutions.
tasks:
- name: Voice as a diagnostic and screening biomarker
  response: Detection, screening, diagnosis and monitoring of health conditions from voice,
    speech and respiratory sounds, exploiting acoustic markers that have been linked to conditions
    ranging from laryngeal cancer to dementia, mood disorders and respiratory disease.
- name: Machine-learning model development and benchmarking
  response: Training, benchmarking and validating machine-learning models for disease detection
    and classification from voice data, using the diagnostic category labels distributed with
    the dataset.
addressing_gaps:
- name: Absence of large, diverse, well-documented clinical voice data
  response: The dataset was created to address a gap in the availability of large-scale, diverse
    and well-documented voice data for clinical machine-learning applications. Earlier machine-learning
    work on voice-based diagnosis produced promising results but relied on sample sizes that
    were too small or lacked the clinical metadata needed to train robust, clinically useful
    models.
- name: Lack of standards for voice and acoustic data collection
  response: Comparing studies and pooling data has been difficult because no standards existed
    for how voice, speech and other acoustic data are measured and collected; the project
    addresses this by developing evidence-based recording protocols and new bioinformatics
    standards for voice data.
- name: No linkage between acoustic data and multimodal health data
  response: Existing work studied voice largely in isolation, with limited data outside acoustic
    measures and no linkage to established physiologic biomarkers; the dataset links acoustic
    recordings to demographics, clinical diagnoses, validated questionnaires and, for some
    cohorts, imaging and genomic data.
- name: Limited size, quality and diversity of open-source voice datasets
  response: The limited size, quality and diversity of existing open-source voice datasets,
    compounded by an absence of prospective external validation, has held back regulatory
    approval of AI algorithms for disease detection and monitoring from voice; industry datasets
    are private and cannot be audited.
