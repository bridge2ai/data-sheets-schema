  collection_timeframes[1].timeframe_details:
    receipts:
    - chunk: c002
      snippet: 'Enrolment began on 18 July 2023 and will continue until

        30  November  2026'
    - chunk: c007
      snippet: 'AI-READI is enrolling 4,000 participants at three study sites over
        4 years

        (2022–2026)'
    - chunk: c019
      snippet: The timeline for the overall project spans four years, encompassing
        one year dedicated to protocol development and training, and years 2-4 allocated
        for subject recruitment and data collection. Approximately 4% of participants
        are expected to undergo a follow-up examination in Year 4.
    - chunk: c019
      snippet: '"overallStatus": "Enrolling by invitation"'
    - chunk: c019
      snippet: "\"completionDate\": \"2027-01-01\",\n          \"completionDateType\"\
        : \"Anticipated\""
    core_path: collection_timeframes[1].timeframe_details
  collection_timeframes[3].timeframe_details:
    receipts:
    - chunk: c009
      snippet: collect a cross-sectional dataset of 4,000+ people and longitudinal
        data from 10% of the study cohort across the US
    - chunk: c027
      snippet: Some study participants who were recruited during Year 1 and 2 (we
        intend to invite 10% of the study population) will be asked to come for additional
        follow up visit in Year 4.
    core_path: collection_timeframes[3].timeframe_details
  confidential_elements[0].confidential_elements_present:
    receipts:
    - chunk: c018
      snippet: No, the dataset does not contain data that might be considered confidential.
