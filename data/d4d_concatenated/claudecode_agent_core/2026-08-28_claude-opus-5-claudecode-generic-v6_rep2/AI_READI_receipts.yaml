        Observational  Medical  Outcomes  Partnership  Common

        Data Model for clinical data and the DICOM format for

        retinal  imaging'
    - chunk: c007
      snippet: 'We are also developing new

        standards, such as the Clinical Dataset Structure (CDS), a simple and

        intuitive way to organize clinical research datasets'
    - chunk: c016
