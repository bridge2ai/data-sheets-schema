slots:
  acquisition_methods[0].acquisition_details:
    receipts:
    - chunk: c003
      snippet: 'Blood  (non- fasting)  and  urine  samples  are  collected

        from  participants  during  the  visit'
    - chunk: c019
      snippet: The acquisition of data varied based on the domain; some data were
        directly observable (such as labs, vitals, and retinal imaging), whereas other
        data were reported by subjects (e.g. survey responses).
    core_path: acquisition_methods[0].acquisition_details
  acquisition_methods[1].acquisition_details:
    receipts:
    - chunk: c005
      snippet: 'Blood  (53 mL)  is  collected  for  clinical  lab  assays  and

        biobanking  purposes'
    - chunk: c027
      snippet: We will collect approximately 50-60 ml of blood (about 3-4 spoonfuls).
        In the event that the original blood and/or urine sample quantities were insufficient
        for the planned testing, we may bring the participant(s) back for an additional
        blood draw
    core_path: acquisition_methods[1].acquisition_details
  addressing_gaps[0].response:
    receipts:
    - chunk: c009
      snippet: The ability to understand and affect the course of complex, multi-organ
        diseases such as T2DM has been limited by a lack of well-designed, high quality,
        and large multimodal datasets
    core_path: addressing_gaps[0].response
  addressing_gaps[2].response:
    receipts:
    - chunk: c002
      snippet: 'the pathway from T2DM to health, which is

        the opposite of studying how healthy people

        proceed  through  pathogenesis'
    core_path: addressing_gaps[2].response
  addressing_gaps[3].response:
    receipts:
    - chunk: c024
      snippet: Research indicates that environmental factors play a significant role
        in health outcomes, yet most of these studies have focused on outdoor conditions
        at a broad city or regional scale. They often overlook the critical aspect
        of the individual’s home environment.
    core_path: addressing_gaps[3].response
  anomalies[0].anomaly_details:
    receipts:
    - chunk: c018
      snippet: The dataset has not undergone any formal external audits. However,
        the dataset has been reviewed internally by AI-READI team members for quality
        checks and to ensure that no personally identifiable information was accidentally
        included.
    core_path: anomalies[0].anomaly_details
  anomalies[1].anomaly_details:
    receipts:
    - chunk: c018
      snippet: In cases of survey data, skipped questions or incomplete responses
        are expected. In cases of using wearables, improper use, technical failure
        such as battery failure or system malfunction are expected.
    core_path: anomalies[1].anomaly_details
  anomalies[2].anomaly_details:
    receipts:
    - chunk: c024
      snippet: There are gaps in data collection as the battery had to be charged
        every 2-3 days. The sampling frequency of the Fitness tracker is 5 seconds.
    core_path: anomalies[2].anomaly_details
  citation:
    receipts:
    - chunk: c022
      snippet: AI-READI Consortium. (2025). Flagship Dataset of Type 2 Diabetes from
        the...AI-READI Project (3.0.0) [Data set]. FAIRhub.
    core_path: citation
  cleaning_strategies[0].cleaning_details:
    receipts:
    - chunk: c004
      snippet: 'The Data Manager at each data

        site is responsible for the quality control of all data before

        uploading  to  FAIRhub'
    core_path: cleaning_strategies[0].cleaning_details
  cleaning_strategies[1].cleaning_details:
    receipts:
    - chunk: c018
      snippet: There were several quality control measures used at the time of data
        entry/acquisition. For example, clinical data outside of expected min/max
        ranges were flagged in REDCap, which was visible in reports viewed by clinical
        research coordinators (CRCs) and Data Managers.
    core_path: cleaning_strategies[1].cleaning_details
  collection_consents[0].consent_details:
    receipts:
    - chunk: c027
      snippet: Potential participants will receive an email with a unique code to
        access their e-consent, supported by UW REDCap.
    core_path: collection_consents[0].consent_details
  collection_consents[1].consent_details:
    receipts:
    - chunk: c015
      snippet: The public version of the dataset can only be used for type 2 diabetes
        related research. A private version will allow for more generic use.
    core_path: collection_consents[1].consent_details
  collection_consents[2].consent_details:
    receipts:
    - chunk: c009
      snippet: The AI-READI project will also engage in a tribal consultation to address
        barriers and facilitators of participation with the goal of collecting similar
        data within a Native American cohort
    core_path: collection_consents[2].consent_details
  collection_mechanisms[0].mechanism_details:
    receipts:
    - chunk: c002
      snippet: 'multivariable protocol containing over 10 domains, including

        vitals, retinal imaging, electrocardiogram, cognitive function,

        continuous glucose monitoring, physical activity, home air

        quality, blood and urine collection'
    core_path: collection_mechanisms[0].mechanism_details
  collection_mechanisms[10].mechanism_details:
    receipts:
    - chunk: c005
      snippet: 'Ambient temperature

        Relative humidity

        Nitrogen oxides (NO and NO2)

        Volatile organic compounds

        Particulate matter'
    - chunk: c006
      snippet: 'Shaffer J, Gim N, Wei R, et al. Portable environmental sensor


        enabling studies of exposome on ocular health'
    - chunk: c018
      snippet: Participants will be sent home with an environmental sensor (a custom-designed
        sensor unit called the LeeLab Anura), which they will use for 10 continuous
        days
    - chunk: c024
      snippet: The sensor then recorded particulate matter counts (PM 1.0, 2.5, 4,
        and 10), temperature, relative humidity, volatile organic compounds (VOCs),
        nitrogen oxides (NO and NO2), and 11 multi-spectral light intensity measurements.
    core_path: collection_mechanisms[10].mechanism_details
  collection_mechanisms[11].mechanism_details:
    receipts:
    - chunk: c018
      snippet: 'Blood pressure devices used for the study across the various data
        acquisition sites are: OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001
        Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series Vital
        signs monitor'
    core_path: collection_mechanisms[11].mechanism_details
  collection_mechanisms[13].mechanism_details:
    receipts:
    - chunk: c027
      snippet: 'Center for Epidemiological Studies – Depression (CES-D-10) survey

        CES-10 survey

        Diabetes self-care activities measurements (SDSCA)

        Diet questionnaire

        Medication Log

        General Health Survey

        Problem Areas In Diabetes questionnaire (PAID-5)'
    core_path: collection_mechanisms[13].mechanism_details
  collection_mechanisms[1].mechanism_details:
    receipts:
    - chunk: c003
      snippet: 'A  12- lead  ECG  is  performed  (Philips  Pagewriter  TC30

        Cardiograph,  Amsterdam,  The  Netherlands)'
    core_path: collection_mechanisms[1].mechanism_details
  collection_mechanisms[2].mechanism_details:
    receipts:
    - chunk: c003
      snippet: 'Montreal Cognitive

        Assessment12 (MoCA), administered electronically on an

        iPad using the MoCA Duo Application'
    core_path: collection_mechanisms[2].mechanism_details
  collection_mechanisms[3].mechanism_details:
    receipts:
    - chunk: c003
      snippet: 'Photopic letter visual acuity is measured with the

        Electronic Visual Acuity tester13 (M&S Technology, Niles,

        Illinois)'
    core_path: collection_mechanisms[3].mechanism_details
  collection_mechanisms[6].mechanism_details:
    receipts:
    - chunk: c018
      snippet: 'Lensometer devices used at data acquisition sites across the study
        include: NIDEK LM-600P Auto Lensometer, Topcon-CL-200 computerized Lensometer,
        and Topcon-CL-300 computerized Lensometer'
    core_path: collection_mechanisms[6].mechanism_details
  collection_mechanisms[7].mechanism_details:
    receipts:
    - chunk: c003
      snippet: 'The  retinal  imaging  protocol  is  designed  to  capture

        imaging  from  multiple  devices.  Both  eyes  are  imaged

        on  each  participant'
    core_path: collection_mechanisms[7].mechanism_details
  collection_mechanisms[8].mechanism_details:
    receipts:
    - chunk: c004
      snippet: 'participants  are

        sent  home  with  three  data  monitoring  devices  as  listed

        in  table  4:  (1)  home  environmental  sensor,  (2)  Garmin

        fitness  tracker  and  (3)  Dexcom  Continuous  Glucose

        Monitor  (CGM)'
    - chunk: c005
      snippet: 'Dexcom G6 Continuous

        Glucose Monitor


        Blood glucose measurements (mg/dL)

        every 5 min'
    - chunk: c007
      snippet: 'post-visit data collection for 10 days using a Dexcom G6 for continuous

        glucose monitoring, Garmin Vivosmart 5 for physical activity monitoring'
    - chunk: c023
      snippet: The Dexcom G6 Continuous Glucose Monitor (CGM) captures blood glucose
        readings every five minutes using this sensor. A single sensor is designed
        to last for a maximum of ten days
    - chunk: c027
      snippet: After we capture the 10 days of data, up to 100 days total of glucose
        data will be collected through the application for subjects who agree to the
        additional data download
    core_path: collection_mechanisms[8].mechanism_details
  collection_mechanisms[9].mechanism_details:
    receipts:
    - chunk: c005
      snippet: 'Garmin VivoSmart 5 Physical

        Activity Monitor'
    - chunk: c024
      snippet: Participants were advised to wear the wristwatch on their non-dominant
        wrist for 10 consecutive days, but they were free to choose their preferred
        wrist for wearing the device.
    core_path: collection_mechanisms[9].mechanism_details
  collection_notifications[0].notification_details:
    receipts:
    - chunk: c019
      snippet: Yes, each individual was aware of the data collection, as this was
        not passive data collection or secondary use of existing data, but rather
        active data collection directly from participants.
    core_path: collection_notifications[0].notification_details
