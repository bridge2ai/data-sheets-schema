notes: >-
  Receipt attribution is thinner than support: for slot-006, slot-007, slot-008, slot-009 and
  slot-025 the cited passage covers only part of the value while the rest is attested elsewhere in
  the bundle without a receipt on that slot (lines 4305, 4467, 486-492, 1524, 5136, 5178). Only
  slot-025 is weak enough to mark. The rule-14 finding is a schema/instruction tension rather than
  carelessness: DataSubset requires an id, so the alternative under the rule was to describe the
  public/controlled split only in prose (which sensitive_elements[0] and third_party_sharing[0]
  already do). No instrument defect found; the pack listed no gaps.
