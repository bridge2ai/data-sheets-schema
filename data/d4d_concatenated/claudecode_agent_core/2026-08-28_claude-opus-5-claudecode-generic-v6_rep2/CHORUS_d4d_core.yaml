  for Equitable AI'
id: https://chorus4ai.org/
name: CHoRUS dataset
description: The CHoRUS dataset is a multicenter, multimodal, high-resolution critical care
  dataset assembled by the CHoRUS data generation project, one of four data generation projects
  in the NIH-funded Bridge2AI consortium. Clinical data are collected retrospectively across
  14 data contributing hospitals and standardized to the OMOP Common Data Model, with modality-specific
  standards for imaging, waveform telemetry, EEG and tokenized clinical notes. The currently
  released dataset covers 50,000 patient admissions from ICU, PICU and NICU, comprising 1.6
  billion rows of EHR OMOP data, 7,642 admissions with radiology data and 23 Tb of waveform
  data. The anticipated final dataset covers 100,000 patient admissions across 9 data modalities.
  Access is controlled, and OMOP and telemetry data are held in a cloud enclave.
source_caveats: 'The declared bundle holds four sources of differing rank: the CHoRUS project
  website (documentation, tier 2), the NIH RePORTER project page and the AIM-AHEAD cohort
  2 informational webinar (tier 4), and a November 2025 capture of the CHoRUS GitHub organization
  overview (historical documentation, tier 5). Where the website and the webinar give different
  figures for the released dataset, the website is preferred and the disagreement is recorded
  on the value concerned. The website carries a banner reading "This repoitory is under review
  for potential modification in compliance with Administration directives", printed twice,
  so the tier 2 source itself signals that its content may change; the spelling is the source''s.
  Keywords are the NIH RePORTER project page''s "Preferred terms" list, restricted to terms
  that describe the data, together with two descriptors the webinar applies to the dataset.
  The title is the award and project title, which the NIH RePORTER page and the GitHub organization
  README state in the same words; the bundle gives the dataset no separate title of its own,
  and no DOI, which is why the project site is the record''s identifier.'
