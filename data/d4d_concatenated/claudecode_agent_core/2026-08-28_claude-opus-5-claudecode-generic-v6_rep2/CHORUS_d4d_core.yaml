purposes:
- id: https://chorus4ai.org/#purpose-ai-ready-critical-care-dataset
  name: A publicly available, AI-ready critical care dataset
  response: The project's overarching goal is to develop a publicly available, AI-ready critical
    care dataset, while ensuring the methods promote privacy, accountability, and clinical
    benefit, while promoting a new generation of AI clinicians and scientists.
- id: https://chorus4ai.org/#purpose-ethically-sourced-datasets-and-tools
  name: Ethically sourced datasets and tools, and best practices for AI in health
  response: The goal is to work with projects to create ethically sourced datasets and tools
    around Artificial Intelligence and to create best practices for AI in health.
- id: https://chorus4ai.org/#purpose-diverse-high-resolution-data
  name: The most diverse, high-resolution, ethically sourced, AI-ready data set
  response: The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving recovery
    from acute illness.
tasks:
- id: https://chorus4ai.org/#task-characterizing-illness
  name: Characterizing acute and critical care illness
  response: Generating data for ML/AI applications aimed at characterizing acute and critical
    care illness among patients with acute or critical illness.
- id: https://chorus4ai.org/#task-predicting-complications
  name: Predicting complications
  response: Generating data for ML/AI applications aimed at predicting complications among
    patients with acute or critical illness.
- id: https://chorus4ai.org/#task-measuring-treatment-response
  name: Measuring treatment response
  response: Generating data for ML/AI applications aimed at measuring treatment response among
    patients with acute or critical illness.
- id: https://chorus4ai.org/#task-external-validation
  name: External validation of AI-developed models
  response: Supporting external validation of models against a provisioned holdout test set,
    to aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
addressing_gaps:
- id: https://chorus4ai.org/#gap-critical-care-ai-infrastructure
  name: Infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care. Developing high-resolution multi-center
    data sets is a critical first step towards actionable and trustworthy AI.
