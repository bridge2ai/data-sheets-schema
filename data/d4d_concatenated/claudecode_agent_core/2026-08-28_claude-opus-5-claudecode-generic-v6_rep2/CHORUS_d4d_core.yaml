- id: https://chorus4ai.org/#aim-ahead-training-program
  name: AIM-AHEAD Bridge2AI for Clinical Care Training Program
  description: The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to
    Bridge2AI CHoRUS data through engagement, AI training, and mentorship. It equips trainees
    to apply AI/ML methods to big data analysis and conduct innovative research at the intersection
    of healthcare challenges and AI/ML using multi-modal datasets from a broad range of cohort
    participants. Trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care
    Collaborative Cloud and on the OHDSI/OMOP common data model.
  restrictions:
