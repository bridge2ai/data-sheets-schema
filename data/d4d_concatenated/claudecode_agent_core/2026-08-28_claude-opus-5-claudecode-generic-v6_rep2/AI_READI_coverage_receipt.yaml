  - slot: informed_consent[0].consent_documentation
    snippet: Consent will be obtained in a private room by a study team member. Patients will be given
      opportunity to ask questions prior to signing the consent.
  - slot: known_limitations[1].limitation_description
    snippet: non-English speaking participants will not be initially enrolled and all patients will need
      to be proficient enough to understand instructions of the study procedures such as using fitness
      tracking and CGM.
  - slot: participant_privacy[2].anonymization_method
    snippet: All study data and identifiable information will be kept on encrypted servers, or in locked
      cabinets/room with restricted access (at all sites)
  - slot: participant_privacy[2].reidentification_risk
    snippet: Confidentiality breach – low risk – all identifiable information will be kept on encrypted
      computers/servers or in a locked cabinet/room with restricted access at all sites. Only authorized
      research personnel will have access to identifiable information.
  - slot: collection_consents[0].consent_details
    snippet: Potential participants will receive an email with a unique code to access their e-consent,
      supported by UW REDCap.
  - slot: ethical_reviews[2].review_details
    snippet: There will also be a community advisory board that evaluates the consent forms and research
      protocols and their feedback will be considered in the modifications of the IRB as needed
