  - slot: file_collections[9].description
    snippet: "\"metadataFileName\": \"healthsheet.md\",\n          \"metadataFileDescription\": \"This\
      \ is a metadata file based on the Clinical Dataset Structure (CDS)\""
  - slot: source_caveats
    snippet: The Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights (AI-READI)
      is a dataset consisting of data collected from individuals with and without
  - slot: anomalies[0].anomaly_details
    snippet: The dataset has not undergone any formal external audits. However, the dataset has been reviewed
      internally by AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included.
  - slot: updates.update_details
    snippet: The dataset gets released as static versions. This is the third version of the dataset and
      consists of data collected up through the end of the second year of the study...There are plans
      to release new versions of the dataset approximately once a year
  - slot: version_access.version_details
    snippet: 'There was a previous datasheet created for the first version of the dataset, which consisted
      of data collected during the pilot data collection phase. It is available here: https://docs.aireadi.org/docs/1/dataset/healthsheet'
  - slot: errata[0].erratum_details
    snippet: the Snellen visual acuity variables were dropped in this version of the dataset, such that
      now only logMAR visual acuity measurements are available
  - slot: splits[0].split_details
    snippet: It does include a new recommended data split for the 2280 participants balancing training,
      validation, and testing sets for age, sex, races/ethnicities, and study group.
  - slot: purposes[0].response
    snippet: The purpose for creating the dataset was to enable future generations of artificial intelligence/machine
      learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including
      salutogenic pathways to return to health.
  - slot: tasks[0].response
    snippet: The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
      manifolds and various applications in artificial intelligence.
  - slot: creators[2].description
    snippet: This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI
      Consortium. Details about each member and their institutions are available on the project website
      at https://aireadi.org.
  - slot: funders[0].description
    snippet: The creation of the dataset was funded by the National Institutes of Health (NIH) through
      their Bridge2AI Program (https://commonfund.nih.gov/bridge2ai). The grant number is OT2ODO32644
  - slot: data_collectors[1].collector_details
    snippet: There is a wide range of experience within the project team, including senior, mid-career,
      and early career faculty members as well as clinical research coordinators, staff, and interns.
  - slot: instances[0].instance_type
    snippet: Each instance represents an individual patient.
  - slot: instances[0].counts
    snippet: There are 2280 instances in this current version of the dataset (version 3, released fall
      2025).
  - slot: version_access.version_details
    snippet: The first version of the dataset, composed of data from the pilot data collection phase,
      had 204 instances. The second version of the dataset, composed of data from the first year of the
      study, had 1067 instances.
  - slot: sampling_strategies[0].is_sample
    snippet: The dataset contains all possible instances. More specifically, the dataset contains data
      from all participants who have been enrolled during the first year of data collection for AI-READI.
  - slot: instances[0].description
    snippet: Multiple modalities of data are collected for each participant, including survey data, clinical
      data, retinal imaging data, environmental sensor data, continuous glucose monitor data, and wearable
      activity monitor data.
  - slot: missing_data_documentation[0].missing_data_causes
    snippet: Yes, not all modalities are available for all participants. Some participants elected not
      to participate in some study elements. In a few cases, the data collection device did not have any
      stored results or was returned too late to retrieve the results
  - slot: relationships[0].relationship_details
    snippet: Yes - all instances are part of the same prospective data generation project (AI-READI).
      There is currently only one visit per participant.
  - slot: anomalies[1].anomaly_details
    snippet: In cases of survey data, skipped questions or incomplete responses are expected. In cases
      of using wearables, improper use, technical failure such as battery failure or system malfunction
      are expected.
  - slot: external_resources[1].future_guarantees
    snippet: The dataset is self-contained but does rely on the dataset documentation for users requiring
      additional information about the provenance of the dataset. The documentation is available at https://docs.aireadi.org.
      The documentation is shared under the CC-BY 4.0 license
  - slot: confidential_elements[0].confidential_elements_present
    snippet: No, the dataset does not contain data that might be considered confidential. No personally
      identifiable information is included in the dataset.
  - slot: content_warnings[0].content_warnings_present
    snippet: "might be offensive, insulting, threatening, or might otherwise pose any safety risk (such\
      \ as psychological safety and anxiety)? If so, please describe why.\",\n          \"response\":\
      \ \"No.\""
  - slot: sensitive_elements[0].sensitivity_details
    snippet: No, the public dataset will not contain data that is considered sensitive. However, the controlled
      access dataset will contain data regarding racial and ethnic origins, location (5-digit zip code),
      as well as motor vehicle accident reports.
  - slot: collection_mechanisms[10].mechanism_details
    snippet: Participants will be sent home with an environmental sensor (a custom-designed sensor unit
      called the LeeLab Anura), which they will use for 10 continuous days
  - slot: collection_mechanisms[11].mechanism_details
    snippet: 'Blood pressure devices used for the study across the various data acquisition sites are:
      OMRON HEM 907XL Blood Pressure Monitor, Medline MDS4001 Automatic Digital Blood Pressure Monitor,
      and Welch Allyn 6000 series Vital signs monitor'
  - slot: collection_mechanisms[6].mechanism_details
    snippet: 'Lensometer devices used at data acquisition sites across the study include: NIDEK LM-600P
      Auto Lensometer, Topcon-CL-200 computerized Lensometer, and Topcon-CL-300 computerized Lensometer'
  - slot: known_biases[2].bias_description
    snippet: Factors influencing the generalization of derived models include the predominantly urban
      and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds.
  - slot: known_limitations[3].limitation_description
    snippet: The study cohort may not provide a comprehensive representation of the population, as it
      does not include other races/ethnicities such as Pacific Islanders and Native Americans.
  - slot: data_collectors[2].collector_details
    snippet: 'Three recording sites were strategically selected to achieve diverse recruitment: the University
      of Alabama at Birmingham (UAB), the University of California San Diego (UCSD), and the University
      of Washington (UW).'
  - slot: subpopulations[0].subpopulation_elements_present
    snippet: "Does the dataset identify any demographic sub-populations (e.g., by age, gender, sex, ethnicity)?\"\
      ,\n          \"response\": \"No\""
  - slot: cleaning_strategies[1].cleaning_details
    snippet: There were several quality control measures used at the time of data entry/acquisition. For
      example, clinical data outside of expected min/max ranges were flagged in REDCap, which was visible
      in reports viewed by clinical research coordinators (CRCs) and Data Managers.
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: all data were mapped to standardized terminologies when possible, such as the Observational
      Medical Outcomes Partnership (OMOP) Common Data Model, a common data model for observational health
      data, and the Digital Imaging and Communications in Medicine (DICOM)
  - slot: raw_sources[0].raw_data_details
    snippet: The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team right now
  - slot: sampling_strategies[2].strategies
    snippet: Inclusion Criteria:\n\n   - Able to provide consent\n   - ≥ 40 years old\n   - Persons with
      or without type 2 diabetes\n   - Must speak and read English
  - slot: labeling_strategies[0].labeling_details
    snippet: N/A - no labels are provided. No specific labeling was performed in the dataset, as the dataset
      is a hypothesis-agnostic dataset aimed at facilitating multiple potential downstream AI/ML applications.
  - slot: instances[0].label
    snippet: Is there an explicit label or target associated with each data instance?...N/A - no labels
      are provided
  - slot: is_tabular
    snippet: These encompass tabular data, imaging data, and physiological signal/waveform data. There
      is no unstructured text data included in this dataset.
- id: c019
  status: extracted
  extracted:
  - slot: splits[0].split_details
    snippet: the project team has prepared data splits into proportions (70%/15%/15%) that can be used
      for subsequent training/validation/testing where the validation and test sets are balanced as well
      as possible for sex, race/ethnicity and diabetes status
  - slot: ethical_reviews[0].review_details
    snippet: The initial IRB approval at the University of Washington was received on December 20, 2022...An
      annual renewal application to the IRB about the status and progress of the study is required and
      due within 90 days of expiration.
  - slot: acquisition_methods[0].acquisition_details
    snippet: The acquisition of data varied based on the domain; some data were directly observable (such
      as labs, vitals, and retinal imaging), whereas other data were reported by subjects (e.g. survey
      responses).
  - slot: participant_compensation[0].compensation_amount
    snippet: Study subjects received a compensation of $200 for the study visit also through the grant
      funding.
  - slot: collection_timeframes[1].timeframe_details
    snippet: The timeline for the overall project spans four years, encompassing one year dedicated to
      protocol development and training, and years 2-4 allocated for subject recruitment and data collection.
      Approximately 4% of participants are expected to undergo a follow-up examination in Year 4.
  - slot: direct_collection[0].collection_details
    snippet: The data was collected directly from participants across the three recruiting sites. Recruitment
      pools were identified by screening Electronic Health Records (EHR) for diabetes and prediabetes
      ICD-10 codes
  - slot: collection_notifications[0].notification_details
    snippet: Yes, each individual was aware of the data collection, as this was not passive data collection
      or secondary use of existing data, but rather active data collection directly from participants.
  - slot: informed_consent[0].consent_documentation
    snippet: Potential participants were given the option to read all consent documentation electronically
      (e-consent) before their visit and give their consent with an electronic signature without verbal
      communication with a clinical research coordinator.
  - slot: consent_revocations[0].revocation_details
    snippet: Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset.
  - slot: data_protection_impacts[0].impact_details
    snippet: No, a data protection impact analysis has not been conducted.
  - slot: participant_compensation[0].compensation_type
    snippet: transportation assistance (rideshare services) was offered to study participants who endorsed
      barriers to transporting themselves to study visits
  - slot: future_use_impacts[0].impact_details
    snippet: No, to the extent of our knowledge, we do not currently anticipate any uses of the dataset
      that could result in unfair treatment or harm. However, there is a theoretical risk of future re-identification.
  - slot: third_party_sharing[0].is_shared
    snippet: The dataset will be distributed and be available for public use.
  - slot: distribution_formats[0].access_urls[0]
    snippet: The dataset will be available through the FAIRhub platform (http://fairhub.io/). The dataset’
      DOI is https://doi.org/10.60775/fairhub.3
  - slot: distribution_dates[0].release_dates
    snippet: The first version of the dataset was distributed in May 2024, the second version of the dataset
      was distributed in November 2024, and the third version of the dataset was distributed in November
      2025.
  - slot: license_and_use_terms.license_terms
    snippet: These license terms were specifically tailored to enable reuse of the AI-READI dataset (and
      other clinical datasets) for commercial or research purpose while putting strong requirements around
      data usage, security, and secondary sharing to protect study participants
  - slot: maintainers[0].maintainer_details
    snippet: The AI-READI team will be supporting and maintaining the dataset. The dataset is hosted on
      FAIRhub through Microsoft Azure.
  - slot: updates.update_details
    snippet: The dataset will not be updated. Rather, new versions of the dataset will be released with
      additional instances as more study participants complete the study visit.
  - slot: retention_limit.retention_period
    snippet: There are no limits on the retention of the data associated with the instances.
  - slot: extension_mechanism.extension_details
    snippet: No, currently there is no mechanism for others to extend or augment the AI-READI dataset
      outside of those who are involved in the project.
  - slot: total_file_count
    snippet: The dataset contains 356,343 files and is around 3.82 TB in size.
  - slot: conforms_to
    snippet: This dataset is organized following the [Clinical Dataset Structure (CDS) v0.1.1](https://cds-specification.readthedocs.io/en/v0.1.1/)
