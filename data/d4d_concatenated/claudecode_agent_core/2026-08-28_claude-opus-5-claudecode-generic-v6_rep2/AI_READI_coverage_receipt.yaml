  - slot: purposes[0].response
    snippet: 'The primary goal

      of AI-READI is to collect and publicly share a multimodal, AI-ready

      dataset for studying the pathogenesis and salutogenesis'
  - slot: funders[0].description
    snippet: 'one of four Data Generation Projects (DGPs)

      funded by Bridge2AI (https://commonfund.nih.gov/bridge2ai), a

      new NIH Common Fund Program'
  - slot: collection_timeframes[1].timeframe_details
    snippet: 'AI-READI is enrolling 4,000 participants at three study sites over 4 years

      (2022–2026)'
  - slot: sampling_strategies[1].source_data
    snippet: 'The recruitment process consists of a selection of individuals

      based on the available clinical diagnosis using ICD-10 codes and demo-

      graphic data from the electronic health records of study sites'
  - slot: is_deidentified.method
    snippet: 'The public set is stripped of Protected

      Health Information (PHI), as defined by the HIPAA (Health Insurance

      Portability and Accountability Act) Privacy Rule via the “Safe Harbor”

      method'
  - slot: is_deidentified.identifiers_removed
    snippet: 'as well as information related to the sex and race/ethnicity of

      the participants to prevent stigmatization of findings'
  - slot: license_and_use_terms.description
    snippet: 'The first version

      of the public set was recently shared using a new licence developed

      as part of this project that allows reuse for any purpose but includes

      restrictions to protect participant privacy'
  - slot: participant_privacy[1].reidentification_risk
    snippet: 'To prevent reidentifi-

      cation attempts, we are implementing a robust data dissemination

      system, a strict licence agreement and data watermarking for both

      public and controlled sets'
