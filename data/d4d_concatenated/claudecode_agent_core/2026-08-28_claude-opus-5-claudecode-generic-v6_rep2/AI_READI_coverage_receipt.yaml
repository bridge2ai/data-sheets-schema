    snippet: '"name": "AI READI Wearable Activity Monitoring Subcrate"'
  - slot: collection_mechanisms[9].mechanism_details
    snippet: Participants were advised to wear the wristwatch on their non-dominant wrist for 10 consecutive
      days, but they were free to choose their preferred wrist for wearing the device.
  - slot: anomalies[2].anomaly_details
    snippet: There are gaps in data collection as the battery had to be charged every 2-3 days. The sampling
      frequency of the Fitness tracker is 5 seconds.
  - slot: external_resources[3].description
    snippet: '"name": "AI-READI Environmental Sensor Subcrate"'
  - slot: collection_mechanisms[10].mechanism_details
    snippet: The sensor then recorded particulate matter counts (PM 1.0, 2.5, 4, and 10), temperature,
      relative humidity, volatile organic compounds (VOCs), nitrogen oxides (NO and NO2), and 11 multi-spectral
      light intensity measurements.
  - slot: addressing_gaps[3].response
    snippet: Research indicates that environmental factors play a significant role in health outcomes,
      yet most of these studies have focused on outdoor conditions at a broad city or regional scale.
      They often overlook the critical aspect of the individual’s home environment.
  - slot: file_collections[2].name
    snippet: '"ro-crate-metadata": "environment/ro-crate-metadata.json"'
- id: c027
  status: extracted
  extracted:
  - slot: source_caveats
    snippet: 'APPLICATION IRB Protocol

      AI Ready and Exploratory Atlas for Diabetes Insights (AI-READI)

      University of Washington'
  - slot: instances[0].source_caveats
    snippet: The study will collect a cross-sectional dataset of 4600 people across the US from diverse
      racial/ethnic groups
  - slot: sampling_strategies[3].strategies
    snippet: based on local/regional demographics, UW will concentrate in recruiting Asian>Hispanic>Black
      participants, while the University of California at San Diego site will prioritize Hispanic>Asian>Black
      participants, and the University of Alabama at Birmingham site will prioritize Black>Hispanic>Asian
      participants.
  - slot: sampling_strategies[1].source_data
    snippet: Over the 3+ years of study recruitment, approximately 50,000 invitation letters from each
      site will be sent by both mail and email to participants identified through the electronic medical
      record search as meeting study eligibility criteria.
  - slot: participant_compensation[0].compensation_type
    snippet: There will be a $200 stipend for participation, which will be provided when we receive the
      final data from participants and return of the study devices.
  - slot: participant_compensation[0].compensation_rationale
    snippet: The timing of the payment will typically be at least 2 weeks after the study visit, taking
      into account 10 days of home-based data collection using the devices provided in the study...The
      payment will not be prorated.
  - slot: participant_compensation[0].compensation_type
    snippet: Study will cover reasonable costs for parking, public transit, or rideshare fees (e.g., Uber
      or Lyft)  related to the study visit.
  - slot: acquisition_methods[1].acquisition_details
    snippet: We will collect approximately 50-60 ml of blood (about 3-4 spoonfuls). In the event that
      the original blood and/or urine sample quantities were insufficient for the planned testing, we
      may bring the participant(s) back for an additional blood draw
  - slot: collection_mechanisms[13].mechanism_details
    snippet: 'Center for Epidemiological Studies – Depression (CES-D-10) survey

      CES-10 survey

      Diabetes self-care activities measurements (SDSCA)

      Diet questionnaire

      Medication Log

      General Health Survey

      Problem Areas In Diabetes questionnaire (PAID-5)'
  - slot: collection_mechanisms[8].mechanism_details
    snippet: After we capture the 10 days of data, up to 100 days total of glucose data will be collected
      through the application for subjects who agree to the additional data download
  - slot: raw_data_sources[2].source_description
    snippet: We will be extracting medical records to obtain data on general health, eye health, medical
      and surgical history, diabetes, medications, laboratory records, and any previous medical imaging
      such as eye imaging. We will also collect information about any car accidents they may have experienced
      and traffic tickets the participant has received in the last 3 years.
  - slot: collection_timeframes[3].timeframe_details
    snippet: Some study participants who were recruited during Year 1 and 2 (we intend to invite 10% of
      the study population) will be asked to come for additional follow up visit in Year 4.
  - slot: sensitive_elements[2].sensitivity_details
    snippet: Name, MRN, DOB, age, sex, race/ethnicity, address, phone number, driver’s license number,
      and email
  - slot: subsets[1].description
    snippet: 'There will be two databases for data distribution:

      The first will be deidentified, which will be publicly available.

      The second one has some identifiable or sensitive information: genomic data and race/ethnicity,
      and will require data user agreement between the researchers to obtain the data and approval process
      developed by the project committee.'
