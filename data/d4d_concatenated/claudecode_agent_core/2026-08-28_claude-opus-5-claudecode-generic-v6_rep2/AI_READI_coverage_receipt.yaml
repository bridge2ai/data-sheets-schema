  - slot: name
    snippet: 'This is the documentation for the AI-READI dataset called

      Flagship Dataset of Type 2 Diabetes from the AI-READI Project'
  - slot: description
    snippet: The AI-READI is a dataset consisting of data collected from individuals with and without
      Type 2 Diabetes Mellitus (T2DM) and harmonized across 3 data collection sites
  - slot: sampling_strategies[2].strategies
    snippet: recruitment sampling procedures aimed at achieving approximately equal distribution of participants
