  - slot: title
    snippet: "Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell Architecture"
  - slot: description
    snippet: "CM4AI is the Functional Genomics Data Generation Project in the U.S....National Institute of Health's (NIH) Bridge2AI program"
  - slot: purposes[0].response
    snippet: "Its overarching mission is to...produce ethical, AI-ready datasets of cell architecture, inferred from multimodal data...collected for human cell lines, to enable transformative biomedical AI research"
  - slot: purposes[1].response
    snippet: "CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture...as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers...and 100 metabolic enzymes involved in cancer, neuropsychiatric, and cardiac disorders"
  - slot: tasks[1].response
    snippet: "Cell maps provide a foundation for...downstream applications in human genomics, including interpretation of genetic variants...and mutations"
  - slot: description
    snippet: "treated (with paclitaxel and vorinostat) versus untreated MDA-MB-468...breast cancer cell lines"
  - slot: description
    snippet: "undifferentiated vs.  neurons and cardiomyocytes...generated from NIH-iPCS-1 KOLF2.1J induced pluripotent stem cells (IPSCs)"
  - slot: collection_mechanisms[0].mechanism_details
    snippet: "CM4AI input data streams are generated using immunofluorescence (IF) subcellular...microscopy for spatial proteomics data; affinity purification mass spectroscopy (AP-MS)"
  - slot: collection_mechanisms[1].mechanism_details
    snippet: "we employed AP-MS on endogenously tagged cell lines...and size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for...proteome-wide complex/interaction mapping"
  - slot: collection_mechanisms[2].mechanism_details
    snippet: "completed spatial proteomics mapping of 100 chromatin regulators in the MDA-MB-...468 cells"
  - slot: collection_mechanisms[3].mechanism_details
    snippet: "we performed single-cell CRISPR screens perturbing 100 chromatin...regulators in the MDA-MB-468 cells under 3 conditions"
  - slot: creators[3].description
    snippet: "We have designed a CRISPR...lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene"
  - slot: creators[5].description
    snippet: "The Tools Module of CM4AI is responsible for producing and maintaining a dataset...integration and map production system, the Multi-Scale Integrated Cell (MuSIC)...pipeline"
  - slot: preprocessing_strategies[0].preprocessing_details
    snippet: "Input data streams are integrated via the multi-scale integrated cell (MuSIC) software...pipeline employing deep learning models and community detection algorithms"
  - slot: conforms_to
    snippet: "datasets in RO-Crate format"
  - slot: conforms_to_standard[0]
    snippet: "output cell maps are packaged with provenance graphs and rich metadata as AI-Ready...datasets in RO-Crate format"
  - slot: is_deidentified.deidentification_details
    snippet: "CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue...cultures) and are considered to be de-identified as they cannot be matched, with current...knowledge, to a human subject"
  - slot: human_subject_research.description
    snippet: "they are non-clinical (from tissue...cultures) and are considered to be de-identified"
  - slot: acquisition_methods[0].acquisition_details
    snippet: "MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established...from a metastatic site pleural effusion of a 51-year-old black female"
  - slot: acquisition_methods[1].acquisition_details
    snippet: "The KOLF2.1J (RRID:CVCL_B5P3) iPSCs cell line was derived from a healthy male...Northern European donor"
