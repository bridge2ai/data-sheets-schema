    snippet: "corresponding author - tideker@health.ucsd.edu"
  - slot: third_party_sharing[0].description
    snippet: "Its datasets and software are available to the research community under...minimally restrictive terms consistent with ethical guidelines, researcher attribution, and...research integrity"
