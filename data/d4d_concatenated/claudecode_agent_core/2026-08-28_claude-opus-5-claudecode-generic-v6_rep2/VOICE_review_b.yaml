notes: >-
  Independent second review for test-retest reliability; no existing *_review.yaml
  was consulted. Receipt quality is high: 23/25 sampled receipts fully supported,
  with corrections traceable and composite values verifiable in-bundle even where
  the receipt cites only one of their sources (slot-011, slot-026). The two weak
  receipts share a pattern: a passage containing a name is cited for a claim
  (a caveat's content, a principal-investigator role) the passage does not state.
  Chunk-attribution imprecision at boundaries (slot-007 line 2093, slot-023 task
  list continuing into c008) matches the known adjacent-chunk pattern (#763) and
  never breaks support. The record's PI-per-creator convention (each entry's
  principal_investigator set to that entry's lead person, while the bundle names
  only Bensoussan as PI, line 1256, and Bensoussan/Elemento as co-leads) is a
  systematic reading worth a look beyond the two sampled items. The rule-12
  violation is extensive and includes respelling American source text into
  British forms, which under the rule's own quoted-material clause is doubly
  wrong for the Stroop task name and the Temerty Center name.
