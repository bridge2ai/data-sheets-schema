- id: rule-03
  verdict: followed
  evidence: "id doi:10.60775/fairhub.3, doi, version 3.0.0 and latest_version_doi all name one release; v2.0.0 and v1.0.0 appear only as related_datasets with is_new_version_of (record lines 1709-1721); v2-page figures (2.01 TB, 165,051 files, bundle lines 2703-2705) are absent from the record; study-level facts (4000 target, 2022-2026) sit on sampling/timeframe slots, not identity slots"
- id: rule-04
  verdict: followed
  evidence: "density follows the evidence: variables, existing_uses, use_repository, other_tasks, discouraged_uses, download_url and publisher are omitted with reasons in the reconciliation report; no padding structures observed"
- id: rule-05
  verdict: violated
  evidence: "funders[0].grants[1] (record lines 338-341) collapses two distinct NIH grants (P30DK035816, UL1TR003096) plus Research to Prevent Blindness - a different funder entirely - into one Grant object with no grant_number; funders[1] (lines 342-348) collapses Microsoft AI for Good Lab, Topcon, Optomed, iCare World, Carl Zeiss, Heidelberg Engineering, Dexcom and Garmin into a single Funder whose grantor reads 'Microsoft AI for Good Lab and study device manufacturers'. Elsewhere the rule is followed (17 creators, one object each)"
- id: rule-06
  verdict: violated
  evidence: "data_protection_impacts[0].impact_details = 'A data protection impact analysis has not been conducted.' (record lines 1042-1045) and extension_mechanism.extension_details = 'There is currently no mechanism for others to extend or augment...' (lines 1490-1494) populate detail fields with statements of absence; the schema descriptions ask for the analysis's methodology and the contribution mechanism respectively. The record itself omitted existing_uses/use_repository/other_tasks/discouraged_uses on exactly this ground, so the standard was applied inconsistently. The absences are source-stated (bundle lines 4482, 4595), which mitigates but does not satisfy the rule as written"
- id: rule-07
  verdict: followed
  evidence: "the login-gated access route is in distribution_formats[].access_urls and data_governance.access_review_process, not download_url (omitted); release cadence is in updates.frequency (record line 1449), not future_use_impacts, which carries only the re-identification impact (lines 1285-1290); lab test detail sits on data_collectors/raw_data_sources rather than variables"
- id: rule-08
  verdict: followed
  evidence: "creators populate name, principal_investigator, affiliations (with ROR ids) rather than prose-only descriptions; funders[0].grants[0] carries name and grant_number OT2OD032644; license_and_use_terms populates name and data_use_permission; contact emails are folded into Creator.description only because Creator declares no email slot (reconciliation report, shape audit)"
- id: rule-09
  verdict: followed
  evidence: "every ROR/ORCID/DOI in a uriorcurie slot is a CURIE (e.g. record lines 177-179, 1401, 1472); doi slot holds the bare DOI (line 36) per its string range; access_urls hold URLs per their uri range; instances[0].data_topic holds the MeSH IRI (line 355) - no MESH prefix is declared in the schema, so the IRI is the sanctioned fallback and the slot's own description names MeSH IRIs"
- id: rule-10
  verdict: followed
  evidence: "spot-checks: ROR:008s83205/0168r3w48/00f54p054/00za53h95/009avj582/0156zyn36/03r0ha626/03hamhx47 all appear at bundle lines 4659-4715 and 5002-5199; ROR:01cwqze88 at 4663/3004; all 15 ORCIDs at 4908-5213; MeSH D003924 at 4733-4736; NCT06002048 at 4612; no identifier found that the bundle does not state"
- id: rule-11
  verdict: followed
  evidence: "all 13 minted ids are fragments on the attested doi:10.60775/fairhub.3 (subsets at record lines 371/382/393, file_collections at 1515-1633); no invented prefix; no person is identified by a fragment - persons appear only via bundle-stated ORCIDs"
- id: rule-12
  verdict: followed
  evidence: "record prose uses American forms (organized line 33, standardized 1155, license 39, analyses 30); the sole British token, 'categorised' (line 934), sits inside quotation marks rendering FAIRhub's own value 'ConsentSpecifiedNotElsewhereCategorised' (bundle line 2893), whose source spelling the quotation keeps"
- id: rule-13
  verdict: followed
  evidence: "acronym (tier 1 over tier 3), enrollment 4000 (tier 1 over tier 2's 4600), blood volume 50-60 mL (tier 2 over tier 3's 53 mL), start date 2023-07-19 (tier 1), governance committee (tier 1) - each stated with the disagreement recorded in source_caveats (record lines 67-111, 364-368, 1422-1427); tier-1 ties (publisher, Lee affiliation) represented rather than decided"
- id: rule-14
  verdict: not_applicable
  evidence: "all 13 mints are forced: FileCollection.id and DataSubset.id are declared identifier+required in the schema (verified via the merged schema), so the record could not omit them given the objects; recording the nine datatype collections, the root-metadata collection and the public/controlled/mini subsets is substantive (each is source-described, e.g. bundle lines 3024-4036, 4154, 2784), not noise-as-structure; no unforced mint exists to judge"
- id: rule-15
  verdict: followed
  evidence: "principal_investigator (range Person, not inlined) carries ORCID CURIEs, not nested objects (record lines 177, 186, 210...); related_datasets[].target_dataset (range string) carries identifiers such as 10.60775/fairhub.2 and NCT06002048 (lines 1710, 1738), not objects; no object found in a scalar-ranged slot"
notes: >-
  Instrument findings, not verdicts: (1) the receipt for data_collectors[4].collector_details cites
  c028's phlebotomist line while the value's verbatim support sits in c003 lines 487-493 - support
  holds in the bundle but the citation attributes it to the wrong chunk; (2) several Creator.description
  receipts (slots 006, 009, 024) cite the chunk carrying contact details while the PI-role half of the
  value rests on c020 - same pattern, support present but split across chunks the receipt does not all
  name. Pack is pack_version 2 (no id_slots block); forced-mint status for rule-14 was taken from the
  schema directly. c010, cited for slot-007, is the superseded v2.0.0 documentation page; its
  controlled-access list includes 'medications', which the v3 healthsheet list (line 4154) omits - the
  record's subsets[1] follows the v2/v3-docs list including medications, a version nuance worth a look.
