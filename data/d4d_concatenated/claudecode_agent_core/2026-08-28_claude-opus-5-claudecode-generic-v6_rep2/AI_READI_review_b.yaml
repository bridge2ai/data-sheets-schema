  evidence: "publisher left unset with both tier-1 values in source_caveats (record lines 93-96); regulatory_restrictions.confidentiality_level unset rather than mapping HL7:2N (lines 108-111); at_risk_populations carries no boolean, only the description naming what the form does not answer (lines 1082-1089). The mini-subset sentence I suspected of inference is stated at bundle line 2784. Residue: the 'contact' qualifier on creators[3] (see slot-024) is the record's own phrasing"
- id: rule-02
