notes: >-
  Three observations outside the sampled items. (1) The reconciliation
  report's Minted identifiers review claims "Fragments are minted only for
  objects the schema requires an `id` on; nothing is labeled that the schema
  would have accepted without one" — this is contradicted by the schema,
  which declares id optional on every DatasetProperty subclass; only the
  Software entries' ids are forced. The rule-14 violation above is thus also
  a false claim in the report's own self-review. (2) instances[0].description
  states each released admission carries "multimodal data across 9 data
  modalities", but the website's "9 / Different data modalities" (lines
  1068-1069) sits under "Anticipated Final Dataset", and the webinar shows
  EEG extraction in process and imaging partial as of August 2025 (lines
  251-254) — an anticipated-final figure read as a property of released
  instances, in the exact pattern the report's own semantic review says it
  guarded against. Not a sampled item, so recorded here rather than as a
  verdict. (3) The pack's counts block says receipted_slots_total 94 and
  receiptless_slots_total 58; the pack lists no slot_reshaped items and
  gaps is empty, consistent with what I saw. Pack_version 2 predates the
  id_slots block, so the forced/unforced analysis for rule-14 was done
  directly against the schema's id declarations as the reviewer protocol
  directs.
