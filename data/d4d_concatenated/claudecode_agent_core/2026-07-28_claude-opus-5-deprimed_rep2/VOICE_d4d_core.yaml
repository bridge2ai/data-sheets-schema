- id: d4d:VOICE-creator-curator-backgrounds
  name: Curator and generator backgrounds
  description: >-
    The curators and generators of the Bridge2AI Voice dataset come from a diverse range of
    backgrounds and areas of expertise, reflecting the interdisciplinary nature of the project.
    The team includes clinicians and healthcare professionals involved in the direct collection
    of clinical data; biomedical researchers with expertise in clinical medicine, neurology
    and psychiatry; machine learning and AI specialists; data scientists and statisticians
    skilled in data curation, preprocessing and statistical analysis; social scientists and
    ethicists ensuring the dataset is ethically sourced and meets standards for privacy and
    consent; and engineers and technologists contributing to data collection, storage and
    dissemination infrastructure.
