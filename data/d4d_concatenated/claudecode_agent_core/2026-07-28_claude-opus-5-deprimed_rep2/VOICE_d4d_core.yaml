id: https://w3id.org/bridge2ai/data-sheets-schema/VOICE
name: Bridge2AI-Voice
title: Bridge2AI-Voice Dataset
description: >-
  The Bridge2AI-Voice (B2AI-Voice) dataset is a large, ethically sourced and demographically
  diverse voice dataset linked to health information, released by the NIH Bridge2AI programme's
  "Voice as a Biomarker of Health" Data Generation Project. Public releases distribute derived
  voice features (spectrograms, Mel spectrograms, MFCCs, pitch, articulatory and phonetic-posteriorgram
  features and static acoustic features) rather than the original audio waveforms, together
  with detailed participant metadata: clinical diagnoses across voice, neurological, mood/psychiatric
  and respiratory disorders, validated questionnaires and demographics. Two distinct cohorts
  are released as separate PhysioNet projects under separate ethics approvals. The adult project
  (b2ai-voice, current version 3.1.0, published 2026-05-01) contains data for 833 participants
  collected across five sites in North America. The pediatric project (b2ai-voice-pediatric,
  current version 1.1.0, published 2026-05-01) contains derived features for 23,533 recordings
  from 300 participants aged 2-18 recruited at the Hospital for Sick Children (SickKids);
  it is a separate project rather than a version of the adult dataset. Featurised data for
  both cohorts is distributed under credentialed access on PhysioNet after a data use agreement
  is signed; the underlying raw audio is distributed only through a controlled-access mechanism
  via Synapse after review by the Data Access Compliance Office.
license: Bridge2AI Voice Registered Access License
page: https://docs.b2ai-voice.org/
publisher: https://physionet.org/
language: en
conforms_to: Brain Imaging Data Structure (BIDS) v1.9.0
keywords:
- bridge2ai
- voice
- health
- biomarkers
- pediatric
distributions:
- id: d4d:VOICE-adult-3-1-0-features
  name: Adult v3.1.0 features
  path: features/
  description: >-
    Derived audio features for the adult cohort, released as Parquet column-oriented binary
    files plus plain-text tables, each accompanied by a JSON data dictionary with the same
    file stem. Each Parquet element carries participant_id, session_id, task_name, n_frames
    and the feature tensor. In v3.1.0 the released element counts are torchaudio_spectrogram.parquet
    (n=29,278, dimension 201xT), torchaudio_mel_spectrogram.parquet (n=29,278, 60xT), torchaudio_mfcc.parquet
    (n=29,278, 60xT), torchaudio_pitch.parquet (n=32,522, dimension T), sparc_ema.parquet
    (n=28,640, Tx12), sparc_loudness.parquet (n=31,855), sparc_periodicity.parquet (n=31,872),
    sparc_pitch.parquet (n=31,872) and ppgs.parquet (n=29,289, 40xT at 100 Hz). The folder
    also contains the plain-text files static_features.tsv (one row per recording, features
    from openSMILE, Praat, parselmouth and torchaudio) and audio_quality_metrics.tsv (audio
    quality-control metrics per recording). Spectrograms, Mel spectrograms, MFC coefficients,
    PPGs and EMAs for sensitive records and audio checks were removed from v3.1. The folder
    mixes Parquet binaries with tab-separated tables and JSON data dictionaries, so no single
    file format applies to the collection as a whole. Distributed from https://physionet.org/content/b2ai-voice/3.1.0/
    under the Bridge2AI Voice Registered Access License.
- id: d4d:VOICE-adult-3-1-0-phenotype
  name: Adult v3.1.0 phenotype
  path: phenotype/
  format: TSV
  media_type: text/tab-separated-values
  description: >-
    Tab-separated phenotype tables organising information collected from the participant or
    another individual during their encounter, each paired with a JSON data dictionary whose
    keys match the column names and whose values give a one-sentence description, the question
    asked, and the response data type. Subfolders are confounders, demographics, diagnosis
    (airway_stenosis, amyotrophic_lateral_sclerosis, anxiety, benign_lesions, bipolar_disorder,
    cognitive_impairment, control, copd_and_asthma, depression, glottic_insufficiency, laryngeal_cancer,
    laryngeal_dystonia, laryngitis, muscle_tension_dysphonia, parkinsons_disease, precancerous_lesions,
    unexplained_chronic_cough, unilateral_vocal_fold_paralysis), enrollment (eligibility,
    enrollment_form, participant), questionnaire (adhd_adult, custom_affect_scale, dsm5_adult,
    dyspnea_index, gad7_anxiety, leicester_cough_questionnaire, panas, phq9, productive_vocabulary,
    psychiatric_history, ptsd_adult, vhi10, voice_perception) and task (acoustic_task, harvard_sentences,
    random_item_generation, recording, session, stroop, winograd). Phenotype files contain
    a row for a participant only if at least one column is not missing, and participants with
    repeated visits may have more than one row. Distributed from https://physionet.org/content/b2ai-voice/3.1.0/
    under the Bridge2AI Voice Registered Access License.
- id: d4d:VOICE-adult-3-1-0-metadata
  name: Adult v3.1.0 recording metadata
  path: metadata/
  description: >-
    A Parquet binary file and its corresponding data dictionary carrying specific information
    about each recording, including task instructions and prompts as well as information about
    the microphone used and its gain. This folder was introduced in version 3.1.0. Distributed
    from https://physionet.org/content/b2ai-voice/3.1.0/ under the Bridge2AI Voice Registered
    Access License.
- id: d4d:VOICE-pediatric-1-1-0-features
  name: Pediatric v1.1.0 features
  path: features/
  description: >-
    Derived audio features for the pediatric cohort, released as Parquet files with the same
    element structure as the adult release (participant_id, session_id, task_name, n_frames
    and the feature tensor). Released element counts are torchaudio_spectrograms.parquet (n=23,533,
    201xT), torchaudio_mel_spectrograms.parquet (n=23,533, 60xT), torchaudio_mfcc.parquet
    (n=23,533, 60xT), torchaudio_pitch.parquet (n=23,533, dimension T), sparc_ema.parquet
    (n=23,532, Tx12), sparc_loudness.parquet (n=23,532), sparc_periodicity.parquet (n=23,532),
    sparc_pitch.parquet (n=23,532) and ppgs.parquet (n=23,533, 40xT at 100 Hz). The folder
    also contains static_features.tsv (openSMILE, Praat, parselmouth and torchaudio features)
    and audio_quality_metrics.tsv. Spectrograms, Mel spectrograms, MFC coefficients, PPGs
    and EMAs for sensitive records and audio checks were removed from v1.1. Nine Parquet feature
    files are released alongside the plain-text tables and JSON data dictionaries, so no single
    file format applies to the collection as a whole. Distributed from https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
    under the Bridge2AI Voice Registered Access License.
- id: d4d:VOICE-pediatric-1-1-0-phenotype
  name: Pediatric v1.1.0 phenotype
  path: phenotype/
  format: TSV
  media_type: text/tab-separated-values
  description: >-
    Phenotypic information acquired during pediatric data collection, including demographic
    information, voice and speech related questionnaires and questionnaires about medical
    history, distributed as tab-separated files with accompanying JSON data dictionaries.
    Distributed from https://physionet.org/content/b2ai-voice-pediatric/1.1.0/ under the Bridge2AI
    Voice Registered Access License.
- id: d4d:VOICE-pediatric-1-1-0-metadata
  name: Pediatric v1.1.0 recording metadata
  path: metadata/
  description: >-
    Per-recording metadata information for the pediatric cohort, released alongside the audio-quality
    metrics in version 1.1.0. Distributed from https://physionet.org/content/b2ai-voice-pediatric/1.1.0/
    under the Bridge2AI Voice Registered Access License.
- id: d4d:VOICE-adult-raw-audio
  name: Adult raw audio (controlled access)
  description: >-
    Raw audio waveforms for the adult cohort. These are not part of the PhysioNet project;
    accessing raw audio is a more involved process requiring institutional sign-off, and the
    data are made available via Synapse at https://www.synapse.org/Synapse:syn72370534/ after
    review by the Data Access Compliance Office (DACO@b2ai-voice.org).
- id: d4d:VOICE-pediatric-raw-audio
  name: Pediatric raw audio (controlled access)
  description: >-
    Raw audio waveforms for the pediatric cohort. These are not part of the PhysioNet pediatric
    project; accessing raw audio requires institutional sign-off, and the data are made available
    via Synapse at https://www.synapse.org/Synapse:syn73617068 after review by the Data Access
    Compliance Office (DACO@b2ai-voice.org).
purposes:
- id: d4d:VOICE-purpose-primary
  name: Primary purpose
  response: >-
    The Bridge2AI Voice dataset was created to address a gap in the availability of large-scale,
    diverse and well-documented voice data for use in clinical machine-learning applications.
    Previous studies on machine learning-based voice diagnosis produced promising results,
    but their sample sizes were too small, or they lacked the key metadata needed for training
    robust, clinically useful models. The dataset aims to bridge this gap by providing an
    ethically sourced, large and diverse dataset to develop, benchmark or validate clinically
    applicable AI/ML models. The goal is to facilitate the use of voice as a non-invasive,
    cost-effective biomarker for the screening, diagnosis and monitoring of a wide range of
    health conditions.
- id: d4d:VOICE-purpose-programme
  name: Grand challenge objective
  response: >-
    Bridge2AI-Voice is a Precision Public Health grand challenge project funded by the NIH
    Common Fund Bridge2AI Program. It seeks to create a flagship, standardised and ethically
    sourced dataset of 10,000 voices linked to health information to fuel research and discovery
    in voice biomarkers. The consortium also aims to introduce the field of acoustic biomarkers
    by developing new standards of acoustic and voice data collection and analysis; to develop
    software and cloud infrastructure for automated voice data collection through a smartphone
    application; to implement federated learning technology allowing analysis of multi-institutional
    data while minimising data sharing; to develop ethical and legal norms and new consent
    guidelines for voice data; to build bridges between medical voice research, acoustic engineering
    and the AI/ML world; and to develop curricula and a community of voice AI researchers.
tasks:
- id: d4d:VOICE-task-model-development
  name: Clinical machine-learning model development
  response: >-
    The Bridge2AI Voice dataset aims to enable the development, benchmarking or validation
    of clinically applicable machine-learning models for diagnosing a wide range of health
    conditions using voice data, including vocal pathologies, neurological, psychiatric, respiratory
    and pediatric voice disorders.
- id: d4d:VOICE-task-predefined
  name: Predefined tasks and labels
  response: >-
    The current version of the dataset comes with predefined tasks and labelling. The tasks
    are primarily designed for training machine-learning models for disease detection and
    classification using voice data. Labels include diagnostic categories such as vocal pathologies,
    neurological disorders, psychiatric conditions and respiratory disorders. There are no
    predefined recommended data splits for training, validation or testing; researchers are
    encouraged to create their own data splits based on their specific requirements.
addressing_gaps:
- id: d4d:VOICE-gap-scale-and-metadata
  name: Scale, diversity and metadata gap
  response: >-
    Existing work on machine learning-based voice diagnosis produced promising results but
    relied on small- to medium-sized datasets, often using voice as the only data type and
    lacking the key metadata needed for training robust, clinically useful models. Comparing
    studies and pooling data is challenging because of the absence of standards for how voice
    and speech data are collected. Industry datasets are often private, limiting the ability
    to audit ML models and the accuracy of training labels, and while industry has access
    to vast amounts of voice data it lacks access to accurate clinical data or demographic
    information. Bridge2AI-Voice addresses these gaps by building a large, publicly documented,
    ethically sourced and diverse voice dataset linked to multimodal health biomarkers.
- id: d4d:VOICE-gap-pediatric
  name: Pediatric evidence gap
  response: >-
    Pediatric and adult voice/speech production are fundamentally different because the respiratory
    system and larynx undergo rapid functional maturation throughout childhood, so normative
    evidence from adults cannot be generalised to pediatric populations. Despite the clinical
    importance of detecting pediatric communication disorders such as autism spectrum disorder
    and speech delays, the availability of large-scale pediatric datasets remains limited,
    because data collection in pediatric populations poses unique challenges such as privacy
    issues, consent processes and the need for developmentally appropriate tasks. The pediatric
    release is intended to enable study of developmental norms, the creation of AI-driven
    tools for early screening, and clinical insight.
