id: https://chorus4ai.org/
name: CHoRUS Dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
description: >-
  CHoRUS is a multi-center, multimodal, high-resolution critical care dataset generated by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH Common Fund Bridge2AI consortium. The
  dataset is assembled retrospectively from clinical source systems at data acquisition hospitals
  and is released under controlled access. Modalities include structured electronic health record
  data standardized to the OMOP Common Data Model (demographics, medication administration with
  time-stamped dosing at each infusion change or dose administration, procedures documented by
  providers, high-frequency nursing flowsheets, and provider-documented diagnoses), clinical notes
  extracted and tokenized with the OHNLP toolkit, radiology imaging from hospital PACS in DICOM,
  waveform telemetry from bedside monitors and gateway/middleware in WFDB, hospital EEG waveforms
  in EDF+ and Persyst formats, and social determinants of health together with contextual factors
  such as geographic distance to the nearest hospital. The project anticipates a final dataset of
  100,000 patient admissions across 9 data modalities from 14 data contributing hospitals; the
  currently released dataset is described as 50,000 patient admissions from ICU, PICU and NICU,
  1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform
  data. The project also sequesters a holdout test set for external validation of models.
status: Under active development; an initial dataset has been released under controlled access while additional admissions and modalities (EEG extraction, imaging de-identification for a larger cohort) are still being acquired.
page: https://chorus4ai.org/
created_by: CHoRUS for Equitable AI consortium (Bridge2AI data generation project)
was_derived_from: Clinical source systems (electronic health records, PACS, bedside telemetry monitors and gateway/middleware, and hospital EEG databases) at the 14 CHoRUS data acquisition hospitals
conforms_to: >-
  Structured EHR data conform to the OHDSI OMOP Common Data Model (with extensions for nursing
  flowsheets); imaging conforms to DICOM; waveform telemetry conforms to WFDB using the PhysioNet
  schema, extended; EEG waveforms use the open-source EDF+ and Persyst schemas; tokenized clinical
  notes use the OHNLP open-source schema.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - ICU
  - PICU
  - NICU
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - EEG
  - medical imaging
  - clinical notes
  - social determinants of health
  - multimodal data
  - AI-ready dataset
  - machine learning
  - Bridge2AI
source_caveats: >-
  Admission counts differ between sources: the September 2025 AIM-AHEAD informational webinar states
  that as of August 2025 the dataset covers 14 hospitals with over 45,000 unique admissions, while
  chorus4ai.org describes a "Current Released Dataset" of 50,000 patient admissions; the same page
  gives 100,000 admissions as the anticipated final dataset. Because the sources disagree, no single
  scalar admission count is asserted in this record. The reported quantities for other modalities
  are given in units that do not correspond one-to-one with the instance types they describe (1.6
  billion OMOP rows rather than a count of EHR records; 7,642 admissions with radiology data and
  approximately 1,000 available images rather than a count of imaging studies), so those figures are
  reported as stated rather than converted into instance counts. The MIT License stated in the
  chorus-ai GitHub overview applies to that organization's software repositories (some of which are
  Apache-2.0 or MIT individually), not demonstrably to the dataset, so no dataset-level license value
  is asserted here. No publisher is named for the dataset in any source, so `publisher` is left
  unpopulated rather than filled with the project website URL. The contact email published on
  chorus4ai.org reads "cmccrary@mgh.havard.edu" and appears to contain a typographical error in the
  domain. The two email addresses given in the chorus-ai GitHub overview for access requests
  (dbold@emory.edu, jared.houghtaling@tuftsmedicine.org) are presented as contacts, not as members of
  any named data access committee; no committee, decision timeframe or appeal process is described.
  Numbers, modality availability, and access procedures are reported as of the September 2025 webinar
  and the GitHub overview captured 2025-11-14; the sources give no dataset version identifier, DOI,
  or recommended citation.
notes: >-
  The chorus4ai.org site carried a banner at the time of capture reading "This repoitory is under
  review for potential modification in compliance with Administration directives."

