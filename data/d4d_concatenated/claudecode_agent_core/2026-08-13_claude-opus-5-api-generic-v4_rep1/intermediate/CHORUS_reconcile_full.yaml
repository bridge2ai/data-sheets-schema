purposes:
  - id: chorus:purpose-ai-ready-dataset
    response: >-
      Develop a publicly available, AI-ready critical care dataset for machine learning and
      artificial intelligence applications, addressing the urgent need for infrastructure to support
      AI/ML in critical care.
  - id: chorus:purpose-characterize-predict-measure
    response: >-
      Generate data for ML/AI applications aimed at characterizing acute and critical care illness,
      predicting complications, and measuring treatment response among patients with acute or
      critical illness.
  - id: chorus:purpose-holdout-validation
    response: >-
      Provision a holdout test set accessible for external validation of models, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - id: chorus:purpose-ethical-sourcing
    response: >-
      Create ethically sourced datasets and tools for AI and establish best practices for AI in
      health, ensuring the methods promote privacy, accountability, and clinical benefit.
  - id: chorus:purpose-workforce
    response: >-
      Cultivate expertise in the lay and scientific community and develop the skills and workforce
      for a next generation of diverse academic and community AI scientists and clinicians.

addressing_gaps:
  - id: chorus:gap-infrastructure
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center data sets is a critical
      first step towards actionable and trustworthy AI.
  - id: chorus:gap-diversity-resolution
    response: >-
      Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready dataset able to
      answer the grand challenge of improving recovery from acute illness.
  - id: chorus:gap-external-validation
    response: >-
      Models developed on critical care data lack sequestered holdout datasets for external
      validation prior to implementation and marketplace adoption.
  - id: chorus:gap-standards
    response: >-
      Multi-modal EHR, waveform, imaging and text data are not harmonized; unified standards and
      validated semantic mappings are needed to make cross-site clinical data interoperable.

tasks:
  - id: chorus:task-characterize-illness
    response: Characterizing acute and critical care illness.
  - id: chorus:task-predict-complications
    response: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - id: chorus:task-treatment-response
    response: Measuring treatment response among patients with acute or critical illness.
  - id: chorus:task-external-validation
    response: External validation of AI/ML models against a sequestered holdout test set.
  - id: chorus:task-labeling
    response: Labeling data with targets important for prediction using a visualization and annotation environment.

instances:
  - id: chorus:instance-admission
    instance_type: Hospital admission of a critically ill patient (ICU, PICU, or NICU)
    data_topic: B2AI_TOPIC:4
    notes: >-
      chorus4ai.org reports 50,000 released admissions from ICU, PICU and NICU; the September 2025
      webinar reports over 45,000 unique admissions across 14 hospitals as of August 2025. The
      anticipated final dataset is 100,000 patient admissions.
    source_caveats: >-
      No instance count is asserted because the two sources give different figures (over 45,000 and
      50,000) for the same released dataset and the bundle offers no basis for preferring one.
  - id: chorus:instance-omop-ehr
    instance_type: >-
      Structured electronic health record record standardized to the OMOP Common Data Model, covering
      demographics, medication administration (dosing time-stamped upon each infusion change or dose
      administration), procedures documented by providers, high-frequency nursing flowsheet
      documentation, and provider-documented diagnoses
    data_substrate: B2AI_SUBSTRATE:37
    data_topic: B2AI_TOPIC:9
    notes: The current released dataset is reported as 1.6 billion rows of EHR OMOP data.
    source_caveats: >-
      No instance count is asserted: the reported 1.6 billion is a count of OMOP table rows across
      all domains, which is not the same unit as a count of the EHR records this instance type
      describes.
  - id: chorus:instance-imaging
    instance_type: Radiology imaging study extracted from hospital PACS
    data_substrate: B2AI_SUBSTRATE:11
    data_topic: B2AI_TOPIC:15
    notes: >-
      chorus4ai.org reports 7,642 admissions with radiology data in the current released dataset. The
      September 2025 webinar states that approximately 1,000 images are currently available, with
      de-identification in process for a larger cohort.
    source_caveats: >-
      No instance count is asserted: 7,642 counts admissions that have radiology data rather than
      imaging studies, and the separately reported figure of approximately 1,000 available images is
      a snapshot of what had cleared de-identification as of August 2025.
  - id: chorus:instance-waveform-telemetry
    instance_type: Continuous waveform telemetry record from bedside monitors via gateway/middleware
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:37
    notes: The current released dataset is reported as 23 Tb of waveform data; no record count is given.
  - id: chorus:instance-eeg
    instance_type: Hospital EEG waveform recording
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:37
    notes: As of August 2025 EEG extraction was still in process; EEG is delivered in EDF+ and Persyst formats.
  - id: chorus:instance-clinical-note
    instance_type: Clinical note extracted and tokenized using the OHNLP toolkit
    data_substrate: B2AI_SUBSTRATE:43
    data_topic: B2AI_TOPIC:32
    notes: Clinical notes are stored locally at contributing sites; only tokens are held in the enclave.
  - id: chorus:instance-sdoh
    instance_type: >-
      Social determinants of health and contextual factors attached to a patient record, such as
      geographic distance to the nearest hospital
    data_topic: B2AI_TOPIC:29

subpopulations:
  - id: chorus:subpop-care-setting
    subpopulation_elements_present: true
    identification: >-
      Admissions in the current released dataset are identified by critical care setting: intensive
      care unit (ICU), pediatric intensive care unit (PICU), and neonatal intensive care unit (NICU).
    source_caveats: The sources give the settings represented but not the distribution of admissions across them.
  - id: chorus:subpop-contributing-site
    subpopulation_elements_present: true
    identification: Admissions are contributed by 14 data acquisition hospitals within a network of 20 academic centers.
    source_caveats: The sources do not report the number of admissions contributed by each site.

subsets:
  - id: chorus:subset-holdout-test-set
    name: CHoRUS holdout test set
    description: >-
      A sequestered holdout test set provisioned by the project and made accessible for external
      validation of models, intended to aid marketplace adoption of AI-developed models for
      implementation in acute and critical care.
    is_data_split: true
    notes: >-
      This subset is the partition described in the splits entry chorus:split-holdout; the two
      records refer to the same holdout arrangement.

splits:
  - id: chorus:split-holdout
    split_details: >-
      The project sequesters holdout datasets that are not used for model development and are made
      available for external model validation; the sources do not state the proportion of data held
      out or the criteria used to construct the holdout. The resulting partition is recorded as the
      subset chorus:subset-holdout-test-set.

sampling_strategies:
  - id: chorus:sampling-balanced-cohort
    is_sample: true
    strategies:
      - Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment strategies, supported by a legal framework for collecting data at scale.
      - Federated access enabling sampling methods that ensure a balanced and diverse cohort across contributing sites.
    source_caveats: The sources describe the sampling intent but do not report inclusion and exclusion criteria, or whether the assembled cohort is representative of any defined population.

acquisition_methods:
  - id: chorus:acquisition-ehr-extract
    acquisition_details: >-
      Retrospective extraction of structured EHR data at data contributing sites, curated into a
      CHoRUS-specific clinical data extract following standard operating procedures and submitted
      using CHoRUS extract and upload tooling.
    was_directly_observed: false
    was_inferred_derived: false
  - id: chorus:acquisition-imaging
    acquisition_details: Imaging acquired from hospital PACS systems at contributing sites.
  - id: chorus:acquisition-waveform
    acquisition_details: Waveform telemetry acquired from bedside monitors through hospital gateway/middleware systems.
    was_directly_observed: true
  - id: chorus:acquisition-eeg
    acquisition_details: EEG waveforms acquired from hospital EEG databases; extraction was in process as of August 2025.
  - id: chorus:acquisition-notes
    acquisition_details: Unstructured EHR text acquired at contributing sites and tokenized before transfer, with the notes themselves retained locally.

collection_mechanisms:
  - id: chorus:mechanism-source-systems
    mechanism_details: Hospital electronic health record systems, PACS archives, bedside telemetry monitors with gateway/middleware, and hospital EEG databases serve as the collection instruments.
  - id: chorus:mechanism-extract-tooling
    mechanism_details: >-
      Open-source CHoRUS tooling for creating and uploading a CHoRUS Data Extract, dockerized
      container applications deployed to support CHoRUS services on Azure, and waveform conversion
      scripts.
  - id: chorus:mechanism-sops
    mechanism_details: >-
      Standard operating procedures published on the centralized CHoRUS SOP documentation site,
      including an interactive workflow diagram giving the step-by-step process for extracting and
      contributing clinical data, with SOP documents that have undergone internal validation and
      review.
  - id: chorus:mechanism-status-tracking
    mechanism_details: >-
      Site delivery status is tracked through GitHub projects; sites submit regular status updates
      either through the GitHub interface or via a Google Form whose submissions trigger a script
      that calls the GitHub API to update status and issue information.

collection_timeframes:
  - id: chorus:timeframe-retrospective
    timeframe_details: >-
      Data collection is retrospective. As of August 2025 the dataset covered 14 hospitals with over
      45,000 unique admissions. Acquisition was continuing at that date, with EEG extraction and
      imaging de-identification for a larger cohort still in process.
    source_caveats: The sources do not state the calendar period of care from which the retrospective records are drawn; the 2022-09-01 to 2026-11-30 span reported in NIH RePORTER is the award period, not a data collection window.

data_collectors:
  - id: chorus:collector-acquisition-sites
    collector_details: >-
      Data acquisition sites: 14 data contributing hospitals, drawn from a collaboration spanning 20
      academic centers, extract and curate clinical data for CHoRUS.
  - id: chorus:collector-site-managers
    collector_details: >-
      Data site managers: data managers at contributing sites carry out extraction and submission
      following the CHoRUS SOP workflow and raise issues through the Standards and Data Acquisition
      discussion spaces.
  - id: chorus:collector-subteams
    collector_details: >-
      CHoRUS sub-teams: Standards, Data Acquisition, and Tooling sub-teams within the CHoRUS data
      generation project support acquisition and compile documentation and recordings for
      contributing sites.

direct_collection:
  - id: chorus:direct-collection-retrospective
    is_direct: false
    collection_details: >-
      Data are collected retrospectively from clinical systems at contributing hospitals rather than
      prospectively from individuals.

raw_data_sources:
  - id: chorus:raw-source-ehr
    source_description: Structured electronic health record data at contributing hospitals, covering demographics, medication administration, procedures, nursing flowsheets and diagnoses.
    source_type: Hospital electronic health record system
    raw_data_format: Site-specific source formats, mapped to the OMOP Common Data Model
    access_details: Delivered to the CHoRUS enclave under controlled access following site SOPs.
  - id: chorus:raw-source-notes
    source_description: Unstructured clinical notes documented by providers at contributing hospitals.
    source_type: Hospital electronic health record system (free text)
    raw_data_format: Free text, extracted and tokenized with the OHNLP toolkit
    access_details: Notes are stored locally at contributing sites; only tokens are held in the enclave.
  - id: chorus:raw-source-pacs
    source_description: Radiology imaging held in hospital picture archiving and communication systems (PACS).
    source_type: Hospital PACS
    raw_data_format: DICOM
  - id: chorus:raw-source-telemetry
    source_description: Bedside monitor waveform telemetry captured through hospital gateway/middleware.
    source_type: Bedside physiological monitors and telemetry middleware
    raw_data_format: Converted to WFDB using the PhysioNet schema, extended
  - id: chorus:raw-source-eeg
    source_description: EEG waveforms held in hospital EEG databases.
    source_type: Hospital EEG database
    raw_data_format: EDF+ and Persyst

preprocessing_strategies:
  - id: chorus:preprocessing-omop
    preprocessing_details: >-
      Standardization of acquired data to the OHDSI OMOP Common Data Model, including an extended
      OMOP schema for high-frequency nursing flowsheet documentation.
  - id: chorus:preprocessing-mapping
    preprocessing_details: >-
      Validated semantic mappings connect clinical data in various source formats to international
      standards; pooled tabular mappings and documentation are maintained in a dedicated mapping
      repository.
  - id: chorus:preprocessing-tokenization
    preprocessing_details: Clinical notes are extracted and tokenized using the OHNLP toolkit, following the OHNLP open-source schema.
  - id: chorus:preprocessing-privacy-transform
    preprocessing_details: >-
      Data are transformed using approaches that limit re-identification, including tokenization of
      unstructured EHR data and de-identification of imaging.
  - id: chorus:preprocessing-waveform-conversion
    preprocessing_details: Waveform conversion scripts prepare telemetry data for release in WFDB format.
  - id: chorus:preprocessing-geocoding
    preprocessing_details: >-
      OMOP Location entities are geocoded with open-source tooling (DeGauss) so that data elements
      feature appropriate contextual factors such as geographic distance to the nearest hospital.

cleaning_strategies:
  - id: chorus:cleaning-characterization-reports
    cleaning_details: >-
      Characterization reports are produced and returned to contributing sites following their data
      submissions, supporting identification and resolution of data quality issues.
  - id: chorus:cleaning-sop-validation
    cleaning_details: >-
      SOP documents governing extraction and submission undergo an internal validation and review
      process before publication to contributing sites.
  - id: chorus:cleaning-clinical-validation
    cleaning_details: >-
      Semantic mappings are reviewed by clinical collaborators under an associated clinical
      validation SOP.

labeling_strategies:
  - id: chorus:labeling-annotation-environment
    labeling_details: >-
      A visualization and annotation environment is developed to label data with targets important
      for prediction; the multi-center network develops capabilities to acquire, standardize,
      tokenize, store, visualize and label structured EHR data, tokenized unstructured EHR data,
      telemetry and EEG waveforms, imaging, and social determinants of health.
    source_caveats: The sources do not describe annotator qualifications, the number of annotations per item, or inter-annotator agreement.

missing_data_documentation:
  - id: chorus:missing-modality-availability
    missing_data_patterns:
      - Clinical notes are not present in the enclave as text; only tokens are held centrally, with the notes stored locally at contributing sites.
      - Imaging coverage is partial, with approximately 1,000 images available as of August 2025 and de-identification in process for a larger cohort.
      - EEG waveform extraction was still in process as of August 2025.
      - Published metadata is marked as planned rather than available for clinical notes, imaging, and EEG waveforms.
    handling_strategy: >-
      Modalities are released incrementally as extraction, de-identification and metadata
      publication complete; the anticipated final dataset covers 9 modalities and 100,000 admissions.

known_limitations:
  - id: chorus:limitation-coverage
    limitation_type: coverage_limitation
    limitation_description: >-
      Data are contributed by 14 hospitals within a collaboration of 20 academic centers, so coverage
      is limited to those participating institutions and their patient populations.
  - id: chorus:limitation-completeness
    limitation_type: integration_limitation
    limitation_description: >-
      Not all modalities are fully available: only about 1,000 images were available as of August
      2025, EEG extraction was in process, and clinical notes are represented centrally only as
      tokens rather than full text.
    recommended_mitigation: Check current modality availability before designing analyses that depend on imaging, EEG, or note text.
  - id: chorus:limitation-retrospective
    limitation_type: temporal_limitation
    limitation_description: >-
      Collection is retrospective, so the dataset reflects care already delivered at contributing
      hospitals rather than prospectively designed measurement.
  - id: chorus:limitation-access
    limitation_type: scope_limitation
    limitation_description: >-
      All data types are under controlled access, requiring registration, a signed licensing
      agreement, and (for the associated training program) a ".edu" email address, which limits who
      can analyse the data and where analyses can be run.

known_biases:
  - id: chorus:bias-selection
    bias_description: >-
      The project treats bias as an explicit design risk for a multi-center critical care cohort:
      patient-focused efforts are directed at determining ethical and legal approaches to manage
      privacy and bias while accounting for social determinants of health.
    mitigation_strategy: >-
      Sampling to ensure comprehensive sets of patient conditions and clinical treatment strategies;
      federated access enabling sampling methods that ensure a balanced and diverse cohort; inclusion
      of contextual factors such as geographic distance to the nearest hospital.
    source_caveats: >-
      The sources describe bias management as a project aim rather than reporting an observed or
      measured bias in the released data, and never characterize which kind of bias is at issue; no
      bias_type term is therefore assigned.

is_deidentified:
  id: chorus:deidentification
  method: >-
    Data are transformed using approaches that limit re-identification. Unstructured EHR data are
    tokenized with the OHNLP toolkit and the underlying notes remain at contributing sites; imaging
    de-identification is in process for the larger imaging cohort; the project maintains a privacy
    scan tool for medical records and a DICOM de-identification component.
  deidentification_details: >-
    De-identification is applied before data enter the shared enclave, and all released data types
    remain under controlled access.
  source_caveats: The sources do not state which de-identification standard (for example HIPAA Safe Harbor or expert determination) was applied, nor list the specific identifiers removed.

sensitive_elements:
  - id: chorus:sensitive-clinical
    sensitive_elements_present: true
    sensitivity_details: >-
      The dataset comprises patient-level clinical data from hospital records, including
      demographics, diagnoses, medication administration, procedures, nursing documentation,
      clinical notes, radiology imaging, and physiological waveforms.
  - id: chorus:sensitive-sdoh-geo
    sensitive_elements_present: true
    sensitivity_details: >-
      Social determinants of health and geographic contextual factors derived from geocoded OMOP
      Location entities, such as distance to the nearest hospital, are included.
  - id: chorus:sensitive-pediatric
    sensitive_elements_present: true
    sensitivity_details: The released dataset includes pediatric (PICU) and neonatal (NICU) admissions.

confidential_elements:
  - id: chorus:confidential-notes
    confidential_elements_present: true
    confidentiality_details: >-
      Clinical notes are not released in full text: they are stored locally at contributing sites and
      only tokens are held in the shared enclave. Community-facing ethics focus groups are used to
      determine what data is appropriate for public sharing.

human_subject_research:
  id: chorus:human-subject-research
  involves_human_subjects: true
  special_populations: >-
    Critically ill adult, pediatric (PICU) and neonatal (NICU) patients; the project targets data
    from more than 100,000 critically ill patients.
  source_caveats: The sources do not report an IRB protocol number, approval date, or reviewing board for the dataset as a whole.

at_risk_populations:
  id: chorus:at-risk-populations
  at_risk_groups_included: true
  special_protections: >-
    Data on minors are included through PICU and NICU admissions. Protections described by the
    project are de-identification and transformation approaches that limit re-identification,
    controlled access, and community-facing ethics work determining what data is appropriate for
    public sharing.
  source_caveats: The sources do not describe assent procedures, guardian consent, or protections specific to at-risk groups.

participant_privacy:
  - id: chorus:participant-privacy
    anonymization_method: >-
      Tokenization of unstructured EHR text, de-identification of imaging, and other transformations
      designed to limit re-identification before data enter the shared enclave.
    privacy_techniques:
      - Tokenization of clinical notes with local retention of the source text
      - Imaging de-identification prior to release
      - Automated privacy scanning of medical records
      - Controlled access to all data types
    reidentification_risk: >-
      The project states that data are transformed using approaches that limit re-identification and
      that patient-focused efforts determine ethical and legal approaches to manage privacy.
    data_linkage: >-
      OMOP Location entities are geocoded to attach environmental and geographic context such as
      distance to the nearest hospital.

ethical_reviews:
  - id: chorus:ethics-pillar
    reviewing_organization: CHoRUS consortium Ethics pillar (Ethical and Trustworthy AI)
    review_details: >-
      One of the three CHoRUS pillars is Ethics (Ethical and Trustworthy AI). The consortium
      evaluates community perspectives on clinical care AI to increase trustworthiness of provenance
      and privacy, performs community-facing ethics focus groups to determine what data is
      appropriate for public sharing, establishes a legal framework for collecting data at scale, and
      analyses the existing legal and regulatory landscape.
    source_caveats: No IRB or ethics committee approval identifier is reported in the sources.

data_governance:
  id: chorus:data-governance
  accountable_organization:
    id: chorus:org-mgh
    name: Massachusetts General Hospital
  access_review_process: >-
    Access to the dataset is controlled. For the AIM-AHEAD Bridge2AI for Clinical Care training
    programme, participants complete a registration form giving name, email and institution, must
    sign a licensing agreement included in that form before gaining access, and require a ".edu"
    email address to gain access to the dataset; once access is granted and compute is provisioned,
    an email is sent to the participant. Programme administrators will assist with this access if
    needed, and the requirement is stated not to be a barrier to acceptance into the programme.
    Outside that route, access requests are directed to the CHoRUS access contacts at Emory
    University (dbold@emory.edu) and Tufts Medicine (jared.houghtaling@tuftsmedicine.org).
  stewardship_roles: >-
    Programme management sits at Massachusetts General Hospital, where Ciera McCrary is listed as
    Program Manager; the contact address published on chorus4ai.org reads "cmccrary@mgh.havard.edu"
    and appears to contain a typographical error in the domain, so it may not deliver as printed.
    Access requests are handled by the contacts at Emory University (dbold@emory.edu) and Tufts
    Medicine (Jared Houghtaling, jared.houghtaling@tuftsmedicine.org). Data site managers at the 14
    contributing hospitals curate and deliver site extracts under CHoRUS SOPs, with Standards, Data
    Acquisition and Tooling sub-teams supporting them.
  source_caveats: >-
    The chorus-ai GitHub overview lists two email addresses as the route for requesting access; it
    does not describe a data access committee, name its members, or state decision timeframes or an
    appeal process, so no committee membership is recorded here. Only one of the two addresses is
    accompanied by a personal name in the sources. Massachusetts General Hospital is recorded as
    accountable on the basis of being the awardee organization in NIH RePORTER.

license_and_use_terms:
  id: chorus:license-and-use-terms
  license_terms: >-
    All released data types are under controlled access. Users must complete registration and sign a
    licensing agreement before gaining access to the dataset; access for the associated training
    programme additionally requires a ".edu" email address. The sources do not name a public data
    licence for the dataset itself.
  contact_person:
    id: mailto:jared.houghtaling@tuftsmedicine.org
    name: Jared Houghtaling

ip_restrictions:
  id: chorus:ip-restrictions
  restrictions:
    - Software in the chorus-ai GitHub organization is licensed under the MIT License, with individual repositories carrying MIT or Apache-2.0 licences.
    - Website content on chorus4ai.org is stated to be solely the responsibility of the authors and not necessarily to represent the official views of the NIH.
  source_caveats: The stated MIT licence applies to the project's software repositories; the sources do not extend it to the dataset.

regulatory_restrictions:
  id: chorus:regulatory-restrictions
  confidentiality_level: restricted
  regulatory_restrictions: >-
    All data types listed in the dataset overview are marked as controlled access. The project
    establishes a legal framework for collecting data at scale and analyses the existing legal and
    regulatory landscape as part of its ethics work, collaborating with regulatory agencies.
  source_caveats: >-
    The sources state that every data type is under "Controlled" access but use no formal
    confidentiality classification; `restricted` is recorded as the most conservative enum reading of
    that phrase. No HIPAA compliance determination, export control status, or other named regulatory
    certification is reported for the dataset.

distribution_formats:
  - id: chorus:format-omop
    format: OMOP Common Data Model tables (demographics, medication administration, procedures, nursing flowsheets, diagnoses), with published OMOP schema metadata and OMOP schema extensions for nursing flowsheets
  - id: chorus:format-ohnlp
    format: Tokenized clinical notes following the OHNLP open-source schema
  - id: chorus:format-dicom
    format: DICOM imaging from PACS, with DICOM schema metadata
  - id: chorus:format-wfdb
    format: WFDB waveform telemetry following the PhysioNet schema, extended
  - id: chorus:format-eeg
    format: EEG waveforms in EDF+ and Persyst formats, following the open-source EDF+ and Persyst schemas
    notes: Published metadata for this modality was marked as planned as of September 2025.

distribution_dates:
  - id: chorus:distribution-2025-08
    release_dates:
      - "As of August 2025 the released dataset covered 14 hospitals with over 45,000 unique admissions."
    source_caveats: The sources give a status snapshot rather than a formal release date, and no versioned release schedule is stated.

third_party_sharing:
  - id: chorus:third-party-sharing
    is_shared: true
    notes: >-
      The dataset is made available beyond the creating institutions under controlled access: it is
      used for training activities and publications, and is provided to trainees of the AIM-AHEAD
      Bridge2AI for Clinical Care Training Program, who receive access after registration, a signed
      licensing agreement and provisioning of compute. A holdout test set is made accessible for
      external model validation.

existing_uses:
  - id: chorus:use-training-program
    examples:
      - "AIM-AHEAD Bridge2AI for Clinical Care Training Program, Cohort 2: trainees receive hands-on training on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud and use the CHoRUS data and tools to create practical use cases and conduct data-driven research, with sessions on the OHDSI/OMOP common data model, the OHDSI tool stack, Jupyter Notebooks, generative AI, and ethics and policy in AI/ML."
      - "Trainee outputs include works-in-progress posters at the Bridge2AI Annual Meeting (May 2026) and the AIM-AHEAD Annual Meeting (July 2026), conference abstracts in health informatics, and manuscripts for peer-reviewed journals."
  - id: chorus:use-publications
    examples:
      - "The webinar states that CHoRUS datasets are being used for training activities and publications."

intended_uses:
  - id: chorus:intended-use-modeling
    use_category: Clinical AI/ML model development
    usage_notes: >-
      Building machine learning and AI-derived models to characterize acute and critical care
      illness, predict complications, measure treatment response, and improve the care and outcomes
      of patients requiring critical care.
  - id: chorus:intended-use-external-validation
    use_category: External model validation
    usage_notes: >-
      Using the sequestered holdout test set to externally validate AI models, aiding marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - id: chorus:intended-use-education
    use_category: Training and workforce development
    usage_notes: >-
      Hands-on training in AI/ML for clinical care within the Bridge2AI CHoRUS ecosystem, including
      canonical Jupyter Notebooks, the OHDSI/OMOP common data model, and ethics of clinical AI.
  - id: chorus:intended-use-standards
    use_category: Data standardization and semantic mapping research
    usage_notes: >-
      Supporting unified standards that harmonize multi-modal EHR, waveform, imaging and text data,
      and validated semantic mappings connecting source formats to international standards.

future_use_impacts:
  - id: chorus:future-impact-benefit
    impact_details: >-
      The project anticipates that the dataset will catalyze biomedical research and expertise
      necessary to promote patient-focused deployment of AI in acute and critical care, and that the
      holdout test set will aid marketplace adoption of AI-developed models.
  - id: chorus:future-impact-privacy-bias
    impact_details: >-
      The project states that methods must promote privacy, accountability and clinical benefit;
      re-identification risk and bias are treated as consequences to be managed through data
      transformation, ethics focus groups determining what data is appropriate for public sharing,
      and analysis of the legal and regulatory landscape.

maintainers:
  - id: chorus:maintainer-mgh
    role: academic_institution
    maintainer_details: >-
      Massachusetts General Hospital hosts the awardee organization and programme management for
      CHoRUS; Ciera McCrary is listed as Program Manager.
  - id: chorus:maintainer-consortium
    role: academic_institution
    maintainer_details: >-
      The CHoRUS consortium comprises 60+ members across 20 different institutions, 14 of which
      contribute as data acquisition centers; Standards, Data Acquisition and Tooling sub-teams
      maintain SOPs, mappings and tooling.
  - id: chorus:maintainer-access-contacts
    role: researcher
    maintainer_details: >-
      Access and inquiry contacts are the address dbold@emory.edu at Emory University and Jared
      Houghtaling (jared.houghtaling@tuftsmedicine.org) at Tufts Medicine.
  - id: chorus:maintainer-developers
    role: other
    maintainer_details: >-
      Software contributors maintain the chorus-ai GitHub organization's 28 repositories, including
      container applications, extract and upload tooling, waveform conversion, de-identification and
      privacy scanning, geocoding, characterization reporting and the SOP documentation site;
      package versions, maintainers and other metadata are published on a package status page.

updates:
  id: chorus:update-plan
  update_details: >-
    The dataset is growing towards an anticipated final size of 100,000 patient admissions across 9
    data modalities from 14 contributing hospitals, from a current released dataset of 50,000
    admissions. Imaging de-identification is in process for a larger cohort, EEG extraction is in
    process, and published metadata is planned for clinical notes, imaging and EEG. Contributing
    sites provide regular status updates on their progress in creating and curating CHoRUS data
    extracts, tracked through GitHub projects.
  source_caveats: No update frequency, versioning policy, or release schedule is stated in the sources.

extension_mechanism:
  id: chorus:extension-mechanism
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Data contributing sites extend the dataset by creating and submitting CHoRUS data extracts using
    the documented SOP workflow, raising issues in the Standards and Data Acquisition discussion
    spaces. Clinical collaborators can contribute to semantic mapping efforts through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings and an associated
    clinical validation SOP. Software contributors add tooling through the chorus-ai repositories,
    guided by a web guide for contributors and users compiled in the developer repository.

external_resources:
  - id: chorus:external-github
    external_resources:
      - "chorus-ai GitHub organization (https://github.com/chorus-ai): 28 repositories providing software and tooling for clinical data in diverse formats, validated semantic mappings, standard operating protocols for contributing sites, and project management overviews."
    archival: false
  - id: chorus:external-sop
    external_resources:
      - "Chorus_SOP: centralized SOP documentation site with an interactive workflow diagram for extracting and contributing clinical data, linking to validated SOP documents and to recordings and documentation from the Standards, Data Acquisition and Tooling sub-teams."
  - id: chorus:external-mapping
    external_resources:
      - "chorus-mapping repository: documentation, pooled tabular mappings, and a clinical validation SOP for semantic mapping."
  - id: chorus:external-tools
    external_resources:
      - "chorus-container-apps: dockerized container applications and configurations supporting CHoRUS services on Azure."
      - "chorus-extract-upload: tools to create and upload a CHoRUS Data Extract."
      - "chorus_waveform and chorus_waveform_resources: waveform documentation, conversion scripts, and resources supporting waveform preparation and release."
      - "privacy_scan_tool: a privacy scan tool for medical records."
      - "CTP-deid: de-identification component."
      - "UF-Geocoding: open source code to geocode OMOP Location entities via DeGauss."
      - "CHoRUSReports: characterization reports returned to sites following data submissions."
  - id: chorus:external-web
    external_resources:
      - "Project website: https://chorus4ai.org/ (pages include Team, Project Overview, Tools, Data Acquisition, Standards, Community Engagement, Ethics, Dataset, Learning Resources & Opportunities)."
      - "Bridge2AI project page: www.bridge2ai.org/chorus."
      - "NIH RePORTER project record: https://reporter.nih.gov/project-details/10472824."