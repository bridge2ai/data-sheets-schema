subsets:
  - id: https://b2ai-voice.org/subset/voice-disorders
    name: Voice Disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with clinician-confirmed laryngeal conditions, including laryngeal cancer,
      laryngitis, pre-cancerous lesions such as keratosis and leukoplakia, benign vocal fold
      lesions, muscle tension dysphonia, laryngeal dystonia and vocal tremor, unilateral vocal
      fold paralysis, and glottic insufficiency or presbyphonia. Gold-standard validation is by
      laryngoscopy images and stroboscopy videos, with CT and spirometry additionally used for
      vocal fold paralysis.
  - id: https://b2ai-voice.org/subset/respiratory-disorders
    name: Respiratory Disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with airway stenosis at supraglottic, glottic, posterior glottic, subglottic,
      tracheal or multi-level sites, bilateral vocal fold paralysis, unexplained chronic cough of
      more than eight weeks, and COPD or asthma. Gold-standard validation is by spirometry and
      flow-volume loops and by CT of the neck and chest.
  - id: https://b2ai-voice.org/subset/neurological-disorders
    name: Neurological and Neurodegenerative Disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants aged over 44 and under 85 with clinician-confirmed mild cognitive impairment,
      Alzheimer's disease, other dementias, amyotrophic lateral sclerosis, or Parkinson's disease
      and related parkinsonian syndromes. Gold-standard validation is by brain CT, brain MRI,
      serum p-tau biomarkers for Alzheimer's disease, and whole genome sequencing.
  - id: https://b2ai-voice.org/subset/mood-psychiatric-disorders
    name: Mood and Psychiatric Disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with clinician-confirmed anxiety disorder, bipolar disorder or depression as
      primary inclusion diagnoses, together with co-morbid alcohol or substance use disorder,
      ADHD, autism spectrum disorder, borderline personality disorder, eating disorder, insomnia
      or sleep disorder, obsessive-compulsive disorder, panic disorder, PTSD, schizophrenia,
      social anxiety disorder, or other psychiatric disorder. Validation is by electronic health
      summary, clinical diagnosis from a psychiatrist, and medication history.
  - id: https://b2ai-voice.org/subset/controls
    name: Control cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, mood or neurological
      disorder affecting voice, cough, breath or speech, recruited to serve as controls.

splits:
  - id: https://b2ai-voice.org/splits/none-predefined
    split_details: >-
      The release carries no predefined recommended training, validation or test partitions.
      Researchers are encouraged to create their own data splits according to their specific
      requirements, and should account for the fact that some participants contributed more than
      one session.

subpopulations:
  - id: https://b2ai-voice.org/subpopulation/age
    subpopulation_elements_present: true
    identification: >-
      Age is captured in the demographics questionnaire completed at enrollment. Adult
      eligibility runs from a minimum age of 18 years to a maximum of 120 years; the
      neurological cohort is further restricted to participants over 44 and under 85.
  - id: https://b2ai-voice.org/subpopulation/sex
    subpopulation_elements_present: true
    identification: >-
      Sex at birth is captured in the demographics questionnaire. Study eligibility is recorded as
      open to all sexes and the study is not gender based.
  - id: https://b2ai-voice.org/subpopulation/gender
    subpopulation_elements_present: true
    identification: Gender identity is captured separately from sex at birth in the demographics questionnaire.
  - id: https://b2ai-voice.org/subpopulation/race-ethnicity
    subpopulation_elements_present: true
    identification: >-
      Race and ethnicity are self-reported in the demographics questionnaire. Race information is
      explicitly identified as sensitive data retained in the release.
  - id: https://b2ai-voice.org/subpopulation/socioeconomic-status
    subpopulation_elements_present: true
    identification: >-
      Socio-economic status, education level, employment status and literacy status are collected
      as demographics that may affect voice and speech.
    source_caveats: >-
      Non-identifying elements revealing highly sensitive information, including household
      income, were removed during de-identification, so socio-economic representation in the
      release is coarser than what was collected.

relationships:
  - id: https://b2ai-voice.org/relationship/participant-session-recording
    relationship_details: >-
      Recordings are linked to sessions and sessions to participants through the participant_id,
      session_id and task_name keys that are carried on every feature record and on the task and
      recording phenotype tables. Most participants completed data collection in a single
      session, but a subset required more than one, so there may be more than one session and
      more than one phenotype row per participant, and responses need not agree across sessions.
  - id: https://b2ai-voice.org/relationship/between-participants
    relationship_details: >-
      No relationships between individual participants are made explicit; the documentation
      records that participant instances are unrelated to one another.

anomalies:
  - id: https://b2ai-voice.org/anomaly/site-configuration
    anomaly_details: >-
      Different collection sites used different collection configurations, including distinct
      iPad devices, and the collection protocol changed over the course of the study.
  - id: https://b2ai-voice.org/anomaly/noise-and-reporting
    anomaly_details: >-
      Confounding sources of noise include recording noise artifacts, variation in diagnostic
      practice between sites and clinicians, inaccurate questionnaire responses, and
      underreporting by participants.
  - id: https://b2ai-voice.org/anomaly/microphone-distance
    anomaly_details: >-
      Recordings were made with a head-mounted headset and microphone that could sit at slightly
      different distances from the mouth between participants and sessions.
  - id: https://b2ai-voice.org/anomaly/missing-features
    anomaly_details: >-
      Some audio files, whether because of their length or other issues, could not generate
      certain features and are therefore absent from the corresponding Parquet bundles, producing
      unequal record counts across feature types.
  - id: https://b2ai-voice.org/anomaly/unaudited-transcription
    anomaly_details: >-
      Certain aspects of the data, notably transcription, were generated using off-the-shelf
      models that have not been audited for correctness.
  - id: https://b2ai-voice.org/anomaly/broken-parquet-v300
    anomaly_details: >-
      Version 3.0.0 shipped broken Parquet files, which were fixed in version 3.1.0.

known_biases:
  - id: https://b2ai-voice.org/bias/clinic-recruitment
    bias_type: selection_bias
    bias_description: >-
      Participants were recruited at high-volume expert clinics within a small number of academic
      institutions, on the basis of an existing clinician-confirmed diagnosis, rather than from
      the general population.
    mitigation_strategy: >-
      The consortium plans to shift to remote collection and to design its recruiting approach so
      as to control for more variables, and to extend recruitment to community outreach clinics
      serving underserved populations.
  - id: https://b2ai-voice.org/bias/geographic-demographic-skew
    bias_type: representation_bias
    bias_description: >-
      The sample is not representative of a larger population because it was collected at a
      limited number of geographic locations in the United States and Canada, is restricted to
      fluent English speakers, and skews by disorder category, site and demographic factors.
    affected_subsets:
      - non-English speakers
      - populations geographically distant from the five collection sites
    mitigation_strategy: >-
      Planned expansion to remote collection, to Spanish-language protocols, and to additional
      sites and community clinics; users are advised to consider the multivariate distribution
      when assessing utility.
  - id: https://b2ai-voice.org/bias/trust-and-proximity
    bias_type: historical_bias
    bias_description: >-
      Groups that have less trust in the medical system or in artificial intelligence, or that are
      less proximal to the collection sites, would have been less likely to be recruited.
    mitigation_strategy: >-
      The consortium operates a Plan for Enhancing Diverse Perspectives and sets benchmarks of
      diversity metrics intended to minimise the risk of algorithmic bias.
  - id: https://b2ai-voice.org/bias/device-label-confounding
    bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders at different sites, and each site used
      its own iPad devices, so recording device is confounded with diagnostic label. Clinical
      diagnosis was made by a single clinician, from an EHR record, or from a prescription
      depending on the disorder, so labelling method also varies with cohort.
    affected_subsets:
      - mood and psychiatric disorders cohort
  - id: https://b2ai-voice.org/bias/single-labeler
    bias_type: annotation_bias
    bias_description: >-
      A single labeller assigned the diagnostic label for each instance, so no inter-annotator
      agreement is available and idiosyncratic clinician judgement is not averaged out.
  - id: https://b2ai-voice.org/bias/non-probability-sampling
    bias_type: sampling_bias
    bias_description: >-
      The sampling method is recorded as a non-probability sample drawn from an ongoing larger
      collection, so the released cohort is neither random nor verified as representative.

known_limitations:
  - id: https://b2ai-voice.org/limitation/language-coverage
    limitation_type: coverage_limitation
    limitation_description: >-
      All communication with participants and all released protocol content is in English;
      participants who do not read or speak English were excluded.
    scope_impact: >-
      Models trained on the release cannot be assumed to transfer to speakers of other languages
      or to non-native English speakers.
    recommended_mitigation: Spanish-language protocols and data collection are under development for future releases.
  - id: https://b2ai-voice.org/limitation/site-representativeness
    limitation_type: representativeness_limitation
    limitation_description: >-
      Data come from five recording sites in the United States and Canada and constitute a sample
      of a larger, ongoing collection that has not been verified as representative.
    scope_impact: Findings may not generalise beyond the recruited North American clinic populations.
  - id: https://b2ai-voice.org/limitation/no-raw-audio
    limitation_type: scope_limitation
    limitation_description: >-
      The release contains derived features only; raw audio waveforms are excluded, and
      spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and articulography traces
      were additionally withheld for sensitive records, free-speech tasks and audio checks.
    scope_impact: >-
      Analyses requiring the waveform, or requiring dense derivations of open-response speech,
      cannot be performed on this release.
    recommended_mitigation: >-
      Raw audio may be requested through the controlled access mechanism administered by the Data
      Access Compliance Office.
  - id: https://b2ai-voice.org/limitation/protocol-drift
    limitation_type: temporal_limitation
    limitation_description: >-
      Data were collected over a period of twelve months during which the collection protocol
      changed, and changes in diagnostic criteria or practice are identified as a possible source
      of distribution shift over time.
  - id: https://b2ai-voice.org/limitation/derived-label-provenance
    limitation_type: methodological_limitation
    limitation_description: >-
      Labels rest on a single clinician's assessment, on an EHR record, or on an active
      prescription depending on the cohort, and human-level performance on the tasks the dataset
      is meant to address is described as varying widely.
    recommended_mitigation: >-
      Any new labels derived by future users should be documented alongside the model or
      publication, including the exact variables used in the determination.
  - id: https://b2ai-voice.org/limitation/no-external-modalities
    limitation_type: integration_limitation
    limitation_description: >-
      Although the study protocol provides for imaging, genomic and respiratory function data
      extracted at each site through REDCap, no external multimodal data is released with this
      dataset.

content_warnings:
  - id: https://b2ai-voice.org/content-warning/free-speech
    content_warnings_present: true
    warnings:
      - >-
        Transcription of free speech tasks may contain material that is offensive, insulting or
        threatening; while such content is considered unlikely it cannot be completely avoided,
        because research participants are responsible for their own choice of language.
      - >-
        Phenotype tables include responses to instruments covering depression, suicidal ideation,
        trauma and post-traumatic stress, which some users may find distressing.

confidential_elements:
  - id: https://b2ai-voice.org/confidentiality/released-features
    confidential_elements_present: false
    confidentiality_details: >-
      The Healthsheet records that the released dataset does not contain data that might be
      considered confidential, such as data protected by legal privilege or by doctor-patient
      confidentiality, or the content of individuals' non-public communications.
    source_caveats: >-
      Raw audio and the fields flagged as sensitive in the REDCap data dictionary are withheld
      from this release precisely because of their heightened re-identification and sensitivity
      risk, and are disseminated only under controlled access.

sensitive_elements:
  - id: https://b2ai-voice.org/sensitive/race-ethnicity
    sensitive_elements_present: true
    sensitivity_details: The dataset includes self-reported race and ethnicity information.
  - id: https://b2ai-voice.org/sensitive/sexual-orientation
    sensitive_elements_present: true
    sensitivity_details: The dataset includes sexual orientation information.
  - id: https://b2ai-voice.org/sensitive/health-data
    sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes health data, including psychiatric and neurological diagnoses,
      psychiatric history, substance use, and responses to validated mental health instruments.
  - id: https://b2ai-voice.org/sensitive/socioeconomic
    sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes socio-economic information; the most sensitive elements, such as
      household income, household composition and cultural identity, were removed before release.
  - id: https://b2ai-voice.org/sensitive/voice-biometric
    sensitive_elements_present: true
    sensitivity_details: >-
      Voice is a biometric identifier that cannot be fully de-identified; all raw voice data was
      therefore removed from the registered-access release because of its potential to cause
      individual re-identification or to be used for illicit or unauthorised purposes.

is_deidentified:
  id: https://b2ai-voice.org/deidentification/v3
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor identifier removal combined with expert review by a team of ethicists who
    additionally removed indirect identifiers and highly sensitive non-identifying elements, and
    with withholding of all raw audio.
  identifiers_removed:
    - Names
    - Civic addresses and other geographic locators, including state and province; country of collection retained
    - Social security numbers, medical record numbers, health plan beneficiary numbers, account numbers, license numbers, device and vehicle identifiers
    - Date information at any resolution finer than years
    - Phone and fax numbers, email addresses, IP addresses, website URLs
    - Full face photographs and biometric identifiers
    - Narrative text fields and transcripts of free speech audio
    - Household composition, cultural identity, household income, mental health status and traumatic life experience fields flagged as sensitive in the REDCap data dictionary
    - All raw voice recordings, and audio recordings containing potentially identifying information or external voices
  deidentification_details: >-
    Dates were rebased or replaced by integers and geographic information was removed or
    generalised. K-anonymization with k greater than or equal to two is not achieved. In the
    feature release, spectrograms, MFCCs, Mel spectrograms, transcriptions, electromagnetic
    articulography traces and phonetic posteriorgrams derived from open-response prompts were
    removed. Raw audio transcripts were reviewed and any recordings containing potentially
    identifying information or external voices were withdrawn from the release.

at_risk_populations:
  id: https://b2ai-voice.org/at-risk/protections
  at_risk_groups_included: true
  special_protections: >-
    Enrolled cohorts include adults with cognitive impairment, dementia and Alzheimer's disease
    and adults with psychiatric diagnoses. All enrollment proceeded under IRB-approved consent
    with the explicit statement that participation is voluntary and does not affect medical care;
    participants were given as much time as needed and were asked to explain their understanding
    back to the research assistant before signing. The protocol also carries the risk that
    questions asked of the mood, depression and anxiety cohorts may cause discomfort or trigger
    negative emotions.
  guardian_consent: >-
    For the pediatric cohort, collected only at pediatric participating institutions, consent is
    provided by a parent or guardian; the research is minimal risk and permission from one parent
    or legal guardian is sufficient.
  assent_procedures: >-
    Children provide verbal assent where developmentally appropriate, and assent is documented.
    Young children who cannot reasonably be asked to assent because of limitations in
    understanding due to age and development are not asked to do so; this typically holds for
    children under seven years of age.

human_subject_research:
  id: https://b2ai-voice.org/hsr/bridge2ai-voice
  involves_human_subjects: true
  irb_approval: >-
    Submitted to and approved by the University of South Florida single IRB, with subsite IRBs
    engaged through the single IRB process. Canadian participating institutions, which do not
    operate under the United States single IRB process, obtained separate research ethics board
    approvals; the pediatric collection was approved by the Research Ethics Board at the Hospital
    for Sick Children. Genomic data collection at the University of Toronto and Mount Sinai
    Hospital proceeds under a separate protocol and REB approval.
  ethics_review_board: University of South Florida Institutional Review Board, acting as single IRB of record
  regulatory_compliance: >-
    HIPAA and the Common Rule govern identifiability; the data are covered under a Certificate of
    Confidentiality, which must be asserted against compulsory legal demands such as court orders
    and subpoenas for identifying information or characteristics of a research participant. The
    data are Personally Identifiable Information as defined in OMB Memorandum M-07-16 and are not
    subject to the Federal Privacy Act of 1974. No data monitoring committee was appointed; the
    study is not for a drug product or a medical device.
  special_populations: >-
    Children under 21, for whom the HRP-416 checklist was completed; adults with cognitive
    impairment, dementia and neurodegenerative disease; adults with mood and psychiatric
    disorders.

ethical_reviews:
  - id: https://b2ai-voice.org/ethical-review/usf-irb
    reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Reviewed and approved the Bridge2AI Voice Data Acquisition protocol as single IRB of record
      for United States participating institutions, and approved data collection and sharing for
      the released dataset. The protocol passed through thirteen documented revisions between
      January 2023 and July 2025, covering the addition of the pediatric cohort, participant
      compensation, electronic and remote consent, control cohort collection, remote enrollment
      and data collection applications, and Spanish-language data collection.
    contact_person:
      id: https://b2ai-voice.org/person/yael-bensoussan
      name: Yael Bensoussan
  - id: https://b2ai-voice.org/ethical-review/sickkids-reb
    reviewing_organization: Research Ethics Board, The Hospital for Sick Children
    review_details: Approved data collection and sharing for the pediatric cohort.
  - id: https://b2ai-voice.org/ethical-review/canadian-rebs
    reviewing_organization: >-
      Canadian participating institutions (Mount Sinai Hospital, University of Toronto, The
      Hospital for Sick Children)
    review_details: >-
      Canadian sites applied for separate research ethics board approval to comply with Canadian
      regulations rather than joining the United States single IRB; copies of approved
      applications were submitted to the University of South Florida IRB.
  - id: https://b2ai-voice.org/ethical-review/usf-irb-004890
    reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Approved the separate feasibility study of the Bridge2AI-Voice application at the USF Health
      Voice Center under IRB number 004890, in which forty-seven participants completed app tasks
      and an exit interview between 5 June and 28 July 2023. No audio data was collected at that
      stage of app development.

informed_consent:
  - id: https://b2ai-voice.org/consent/prospective-written
    consent_obtained: true
    consent_type: >-
      Prospective informed consent, obtained on paper, electronically through REDCap survey forms
      or in the application, or by video recording within the application in which the participant
      reads a statement aloud so that the acoustic data submitted can be verified as belonging to
      the consented individual.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap; all paper and
      electronic consent records are stored for a minimum of five years after study completion,
      through the Florence platform for USF study material.
    consent_scope: >-
      Research data not containing direct identifiers will be shared with external researchers for
      future research through a secure database. Data posing a low risk of re-identification is
      shared in registered access with the general public; data that would pose a heightened risk
      if shared in full open access is shared through a controlled access mechanism with
      authorised researchers. Consent is not restricted to non-commercial use, to a specific
      geographic location, to a specific type of research, to genetic research, or to research
      that excludes methods or algorithm development. Participants who consent also permit
      investigators to access medical information through EHR platforms for gold-standard
      validation of diagnoses and symptoms.
    withdrawal_mechanism: >-
      Consenting participants are informed that they may withdraw from the study at any point. For
      ongoing longitudinal collection, electronic consent is administered before each subsequent
      data collection to confirm continuing consent.
  - id: https://b2ai-voice.org/consent/pediatric-permission
    consent_obtained: true
    consent_type: Parental or guardian permission with documented verbal assent from the child where developmentally appropriate.
    consent_scope: >-
      Consent for pediatric participants covers voice and clinical de-identified data being
      uploaded to an open-sourced database; failure of a parent or guardian to consent is an
      exclusion criterion.

collection_consents:
  - id: https://b2ai-voice.org/collection-consent/participants
    consent_details: >-
      All participants have been duly informed and agreed to the collection and use of their data
      via prospective informed consent. Participants were explicitly informed about the data being
      collected, the methods used to secure those data, and the information that would be used for
      the study.
  - id: https://b2ai-voice.org/collection-consent/open-database
    consent_details: >-
      Consenting to provide a voice or speech sample for an open-sourced database is an inclusion
      criterion for both the treatment and control populations; declining that consent is an
      exclusion criterion.

collection_notifications:
  - id: https://b2ai-voice.org/notification/irb-consent-process
    notification_details: >-
      Individuals were notified about the data collection through an IRB-approved consent process.
      Where consent took place in clinic, an investigator introduced the study, a research
      assistant then explained it in detail in a private research room over roughly thirty
      minutes, and potential participants were asked to explain back what they had understood.

consent_revocations:
  - id: https://b2ai-voice.org/revocation/withdrawal
    revocation_details: >-
      Participants may withdraw from the study at any point. If a participant withdraws during or
      before the voice data collection is completed, their data is not included in the database.
      Participants are informed that research data, including voice recordings, cannot be removed
      from the database once the voice data collection process is completed; for longitudinal
      collection the minimum requirement for study completion is one data collection time point.
      Participants who withdraw may optionally complete a satisfaction survey, which collects no
      protected health information, to help the team understand their reasons.

data_protection_impacts:
  - id: https://b2ai-voice.org/dpia/ethics-field-review
    impact_details: >-
      A team of ethicists reviewed the collected data elements and identified those creating a
      significant risk of participant re-identification, including through combination with public
      data available on social media or in government registries, and those revealing highly
      sensitive information; all such fields, together with all raw voice data, were removed before
      release. The consortium separately published a memorandum setting out the ethical
      justification for restricting raw voice samples to controlled access.
    source_caveats: >-
      The Healthsheet records that no analysis of the potential impact of the dataset and its use
      on data subjects has been conducted, so these activities are documented as governance and
      de-identification measures rather than as a formal data protection impact assessment.

collection_timeframes:
  - id: https://b2ai-voice.org/timeframe/twelve-months
    timeframe_details: >-
      The data were collected over a period of twelve months. Collection is organised in four
      phases: an exploratory phase covering IT and application development and up to 180
      participants, a pilot phase to a cumulative 600 participants across main sites and
      high-volume expert clinics, an expansion phase to a cumulative 3,000 participants including
      community outreach clinics, and an outreach phase to 5,000 participants at USF.
    source_caveats: >-
      Specific collection start and end dates are not reported for the released cohort, and date
      information at any resolution finer than years was removed during de-identification. The
      funded project period runs from 2022-09-01 to 2026-11-30.

collection_mechanisms:
  - id: https://b2ai-voice.org/mechanism/b2ai-voice-app
    mechanism_details: >-
      A custom Bridge2AI-Voice application running on a study tablet, available as an iOS
      application and as a web application that runs in a browser on a computer, tablet or phone
      without software download or installation and without login. The application stores data
      only during the collection phase, removing it as soon as the page is closed, and transmits
      over a secure HTTPS protocol to a HIPAA-compliant storage server hosted by an NIH STRIDES
      partner.
  - id: https://b2ai-voice.org/mechanism/hardware
    mechanism_details: >-
      Recording hardware comprised iPads of the 9th or 10th generation and iPad Air 5th
      generation, with an Avid AE-36 microphone connected through an Apple dongle. Participants
      were instructed to wear a head-mounted headset with microphone for tasks including voice
      recording, as per the Bridge2AI-Voice suggested standards; distinct iPad devices were used at
      each site. Version 3.1.0 releases per-recording metadata including the microphone used and
      its gain.
  - id: https://b2ai-voice.org/mechanism/reproschema-ui
    mechanism_details: >-
      For the pediatric protocol, all data are collected using reproschema-ui with the
      Bridge2AI-Voice pediatric protocol; the resulting data are extracted, transformed into
      REDCap format, and then converted to the Brain Imaging Data Structure.
  - id: https://b2ai-voice.org/mechanism/redcap
    mechanism_details: >-
      Clinical, imaging and other EHR-derived data are extracted independently at each site and
      uploaded through a password-protected REDCap database as part of the case report form.
      Recruitment flyers at some sites link through a QR code to a secure REDCap screening survey.

data_collectors:
  - id: https://b2ai-voice.org/collector/research-teams
    role: research staff
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students, coordinated
      with clinicians to identify appropriate participants, conducted consent, introduced the
      application on a study tablet, and supervised task completion in a private clinic room.
  - id: https://b2ai-voice.org/collector/clinicians
    role: clinician co-investigator
    collector_details: >-
      Clinicians and doctors provided the gold-standard diagnostic assessment. They were listed
      under the IRB as co-investigators and added to the consortium so that their names appear on
      consortium-level publications arising from the research.
  - id: https://b2ai-voice.org/collector/hospital-staff
    role: hospital support staff
    collector_details: >-
      Hospital staff were not involved in scheduling but assisted in the logistics of coordinating
      data collection.

direct_collection:
  - id: https://b2ai-voice.org/direct-collection/participants
    is_direct: true
    collection_details: >-
      Voice, speech, respiratory and questionnaire data were collected directly from the
      individuals in question, in clinic with the assistance of a trained research assistant.
  - id: https://b2ai-voice.org/direct-collection/ehr-validation
    is_direct: false
    collection_details: >-
      Gold-standard diagnostic validation drew on existing records rather than direct observation:
      clinicians reviewed electronic health records, imaging and, for the psychiatric cohort,
      electronic health summaries and active medication prescriptions determined outside the data
      collection session by an appropriately licensed clinician.

acquisition_methods:
  - id: https://b2ai-voice.org/acquisition/acoustic-tasks
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details: >-
      Twenty-two acoustic tasks per adult protocol were recorded directly through the application,
      spanning non-voice non-speech tasks (respiration, voluntary cough, breath sounds),
      voice non-speech tasks (prolonged vowel, maximum phonation time, glides, loudness,
      diadochokinesis) and speech tasks (Rainbow Passage, Caterpillar Passage, CAPE-V sentences,
      free speech, picture description, story recall, animal fluency, open response questions,
      Word-Color Stroop, productive vocabulary, random item generation, Cinderella story).
      Recordings were subsequently subjected to quality control metrics including silence
      proportion, duration and comparison of produced speech against the intended passage.
  - id: https://b2ai-voice.org/acquisition/questionnaires
    was_directly_observed: false
    was_reported_by_subjects: true
    was_inferred_derived: false
    acquisition_details: >-
      Demographics, confounders such as smoking and hydration status, and validated
      patient-reported outcome instruments were self-reported by participants through the
      application; for pediatric participants without adequate comprehension or familiarity with
      their own medical history, a parent or decision-maker completed the survey on a separate
      tablet during the recording.
  - id: https://b2ai-voice.org/acquisition/diagnoses
    was_directly_observed: false
    was_reported_by_subjects: false
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details: >-
      Clinical validation was performed by a qualified physician or practitioner against
      established gold standards for each diagnosis, verified by reviewing audio or imaging data,
      electronic health records, or medication prescriptions.
  - id: https://b2ai-voice.org/acquisition/derived-features
    was_directly_observed: false
    was_inferred_derived: true
    acquisition_details: >-
      All released acoustic features were computationally derived from the standardised audio
      waveform rather than observed; the waveform itself is not part of this release.

sampling_strategies:
  - id: https://b2ai-voice.org/sampling/clinic-based
    is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. Participants were recruited from high-volume expert clinics,
      defined as outpatient clinics within hospital systems or academic institutions with
      expertise in a specific disease area seeing more than fifty patients per month from the same
      disease category, according to per-cohort inclusion and exclusion criteria. Pediatric
      participants were recruited strictly from the Hospital for Sick Children and grouped by age.
      Recruitment also proceeded through flyers, QR-code-linked REDCap screening surveys, social
      media, the FlowTrials platform, and medical record review where specific diagnoses or
      severities were under-represented.
    source_data: >-
      A larger, ongoing collection with an anticipated enrollment of 10,000 participants by 2027
      across five disease cohort categories.
    why_not_representative: >-
      The data are not representative because they were collected at a limited number of
      geographic locations, from fluent English speakers, and through clinic-based recruitment.
    representative_verification: >-
      No verification of representativeness was performed; the consortium states it hopes to
      improve representativeness by shifting to remote collection and designing recruitment to
      control for more variables.

raw_sources:
  - id: https://b2ai-voice.org/raw/audio
    raw_data_details: >-
      Raw WAV audio recordings of each acoustic task, named by participant, session and task and
      accompanied by per-recording JSON sidecars, organised under the Brain Imaging Data Structure
      v1.9.0. The raw data was saved after de-identification but is not publicly accessible.
    access_url: https://www.synapse.org/Synapse:syn72370534/
  - id: https://b2ai-voice.org/raw/redcap
    raw_data_details: >-
      Questionnaire, enrollment, confounder and clinical validation records exported from REDCap,
      or, for the pediatric protocol, retrieved from ReproSchema-UI and transformed into REDCap
      format, before conversion into the phenotype table structure.

raw_data_sources:
  - id: https://b2ai-voice.org/raw-source/audio
    source_description: >-
      Raw audio recordings of the Bridge2AI-Voice acoustic task battery captured prospectively from
      consented participants on study tablets.
    source_type: prospective clinical data collection
    raw_data_format: WAV
    access_details: >-
      Controlled access only. Requesters complete a Data Access Request Form and Data Use
      Agreement, submit the application to the Data Access Compliance Office for review, and on
      approval have a Data Use and Transfer Agreement signed by an authorised official at their
      institution. Adult raw audio is made available via Synapse at
      https://www.synapse.org/Synapse:syn72370534/ and pediatric raw audio at
      https://www.synapse.org/Synapse:syn73617068; requests are addressed to DACO@b2ai-voice.org.
  - id: https://b2ai-voice.org/raw-source/redcap
    source_description: >-
      REDCap instrument responses covering enrollment and eligibility, demographics, confounders,
      per-condition diagnosis, and validated questionnaires.
    source_type: electronic data capture instrument
    raw_data_format: REDCap export converted to tab-delimited values
    access_details: >-
      Released in de-identified form as the phenotype folder of the registered-access dataset; the
      supporting data dictionary, metadata and instrument PDFs are public at
      https://github.com/eipm/bridge2ai-redcap.
  - id: https://b2ai-voice.org/raw-source/ehr
    source_description: >-
      Electronic health record extracts used for gold-standard validation of diagnoses and
      symptoms, including imaging such as laryngoscopy and stroboscopy, chest radiographs, brain CT
      and MRI, spirometry and flow-volume loops, electronic health summaries and medication
      history.
    source_type: electronic health record extraction
    access_details: >-
      Retained at the collecting institution and not released; no external multimodal data is
      included in the public release.

preprocessing_strategies:
  - id: https://b2ai-voice.org/preprocessing/standardisation
    preprocessing_details: >-
      Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a
      Butterworth anti-aliasing filter applied.
  - id: https://b2ai-voice.org/preprocessing/torchaudio
    preprocessing_details: >-
      Torchaudio-derived time-varying features: spectrograms of dimension 201 by T computed with a
      short-time Fast Fourier Transform using a 25 ms window, 10 ms hop and 400-point FFT, then
      downsampled by a factor of two in the time domain; Mel spectrograms of dimension 60 by T with
      the same parameters and 60 Mel bins; 60 Mel-frequency cepstral coefficients derived from the
      Mel spectrograms; and a pitch contour of dimension T with minimum and maximum pitch of 80 and
      500 Hz.
  - id: https://b2ai-voice.org/preprocessing/sparc
    preprocessing_details: >-
      Speech Articulatory Coding features gathered at 50 Hz: estimated electromagnetic
      articulography of dimension T by 12, corresponding to X and Y positions of tongue dorsum,
      tongue body, tongue tip, lower incisor, upper lip and lower lip; loudness from the average
      absolute waveform amplitude over 20 ms windows; periodicity as the confidence of pitch
      presence over 20 ms windows; and fundamental frequency over the range 50 to 550 Hz.
  - id: https://b2ai-voice.org/preprocessing/ppgs
    preprocessing_details: >-
      Phonetic posteriorgrams giving a time-varying categorical distribution over 40 phoneme
      categories at a frame rate of 100 Hz, generated with the ppgs package.
  - id: https://b2ai-voice.org/preprocessing/static-features
    preprocessing_details: >-
      Static per-recording features extracted with openSMILE, including eGeMAPS descriptors, and
      with Praat through Parselmouth, providing fundamental frequency, formant and voice quality
      measures, together with speech intelligibility metrics for speech tasks. These are stored in
      a fixed feature format covering the whole waveform, in contrast to the temporal formats whose
      length varies with the recording.
  - id: https://b2ai-voice.org/preprocessing/transcription
    preprocessing_details: >-
      Transcriptions were generated using OpenAI's Whisper Large model. Transcriptions from
      open-response prompts are removed from the feature-only dataset.
  - id: https://b2ai-voice.org/preprocessing/bids-conversion
    preprocessing_details: >-
      Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap
      were converted to be compliant with the Brain Imaging Data Structure v1.9.0, producing a
      phenotype folder of paired TSV and JSON files and per-subject, per-session audio folders.

cleaning_strategies:
  - id: https://b2ai-voice.org/cleaning/transcript-review
    cleaning_details: >-
      Raw audio transcripts were reviewed and any audio recordings that contained potentially
      identifying information or external voices were removed from the release. For the pediatric
      release, all free speech tasks were manually checked for the presence of unconsented speakers
      and personally identifiable information before their features were published.
  - id: https://b2ai-voice.org/cleaning/audit-protocol
    cleaning_details: >-
      An audit protocol was applied before release: generation of missingness tables; checking of
      distributions and outliers; checking of categorical responses against the schema; and, for
      audio tasks, quality control metrics covering the amount of silence, the duration, and, for
      speech tasks, comparison of produced speech against the intended passage.
    source_caveats: >-
      The Healthsheet answers "No" to whether any pre-processing for cleaning the data was
      performed; the audit and transcript review described here are documented elsewhere in the
      same documentation and in the release notes.

labeling_strategies:
  - id: https://b2ai-voice.org/labeling/clinical-gold-standard
    labeling_details: >-
      Diagnostic labels are the result of a clinical assessment of the participant. At each site a
      local clinician provided the diagnosis based on a clinical interview and appropriate work-up.
      For the psychiatric disorders cohort the assessment was determined from the participant's
      electronic health record or from an active prescription, carried out outside the data
      collection session by an appropriately licensed clinician. Labelling was therefore performed
      by a clinician rather than by a machine-learning researcher.
    annotations_per_item: 1
    data_annotation_protocol: Bridge2AI-Voice protocols and ICD-10 codes
    data_annotation_platform: REDCap clinical validation instruments and case report forms
    annotator_demographics: >-
      Typically the clinician at the site of data collection, or a clinician external to the study
      who made a prior diagnostic assessment; no further annotator demographic characteristics are
      recorded.

machine_annotation_tools:
  - id: https://b2ai-voice.org/machine-tools/feature-extraction
    tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat
      - Parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
      - b2aiprep
      - senselab
    tool_descriptions:
      - Whisper Large generated the transcriptions of recorded speech.
      - openSMILE extracted eGeMAPS and other acoustic descriptors capturing temporal dynamics and acoustic characteristics.
      - Praat, accessed through the Parselmouth Python interface, computed phonetic and prosodic measures of fundamental frequency, formants and voice quality.
      - torchaudio produced spectrograms, Mel spectrograms, MFCCs and pitch contours.
      - The sparc package produced kinematic traces of vocal tract articulators plus loudness, periodicity and pitch.
      - The ppgs package produced high-fidelity neural phonetic posteriorgrams.
      - b2aiprep organised and preprocessed the dataset and merged source data into the phenotype files; release 3.1.0 was generated with b2aiprep v3.0.0.
      - senselab processed audio files for research tasks.
    tool_accuracy: >-
      Certain aspects of the data, notably transcription, were generated using off-the-shelf models
      that have not been audited for correctness.

missing_data_documentation:
  - id: https://b2ai-voice.org/missing-data/patterns
    missing_data_patterns: >-
      Phenotype data files contain a row for a participant only if at least one column for that
      participant is non-missing. Each individual answered a common set of questions and then
      responded to additional questions relevant to their primary diagnostic category, so
      cohort-specific instruments are systematically absent for participants outside that cohort.
      Feature files omit recordings for which the corresponding feature could not be generated.
    missing_data_causes: >-
      Some questions are optional; data collection irregularities caused information to be missing
      from individual instances; some audio files could not generate certain features because of
      their length or other issues; and sensitive records, free-speech derivations and audio checks
      were deliberately withheld.
    handling_strategy: >-
      A missingness table is included with the dataset and generation of missingness tables is the
      first step of the release audit protocol; no imputation is applied.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    quality_notes: >-
      Pseudonymous study identifier that links feature records to session, task and phenotype
      tables; direct identifiers were removed and are held only at the collecting institution.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    quality_notes: >-
      Unique identifier for the recording session. Most participants completed collection in a
      single session, but a subset required more than one, so a participant may have several
      sessions.
  - variable_name: task_name
    data_type: categorical
    examples:
      - Prolonged Vowel
      - Maximum Phonation Time
      - Glides
      - Diadochokinesis
      - Rainbow Passage
      - Caterpillar Passage
      - Cape-V Sentences
      - Voluntary Cough
      - Breath Sounds
      - Word-Color Stroop
    quality_notes: Identifies the acoustic task performed for a given recording.
  - variable_name: n_frames
    data_type: integer
    quality_notes: Number of time frames associated with the feature tensor for that recording.
  - variable_name: spectrogram
    data_type: array
    derivation: >-
      Short-time Fast Fourier Transform of the standardised 16 kHz monaural waveform, 25 ms window,
      10 ms hop, 400-point FFT, downsampled by a factor of two in the time domain; dimension 201 by T.
    measurement_technique: torchaudio
  - variable_name: mel_spectrogram
    data_type: array
    derivation: 60 Mel bins over the same 25 ms window, 10 ms hop and 400-point FFT; dimension 60 by T.
    measurement_technique: torchaudio
  - variable_name: mfcc
    data_type: array
    derivation: 60 Mel-frequency cepstral coefficients computed from the Mel spectrograms; dimension 60 by T.
    measurement_technique: torchaudio
  - variable_name: pitch
    data_type: array
    unit: Hz
    minimum_value: 80.0
    maximum_value: 500.0
    derivation: Detected fundamental frequency over time, dimension T.
    measurement_technique: torchaudio
    quality_notes: The stated minimum and maximum are the configured bounds of the detection algorithm.
  - variable_name: sparc_pitch
    data_type: array
    unit: Hz
    minimum_value: 50.0
    maximum_value: 550.0
    derivation: Estimated fundamental frequency computed by the Speech Articulatory Coding package at 50 Hz, dimension T.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: sparc_ema
    data_type: array
    derivation: >-
      Deep-learning estimate of electromagnetic articulography, dimension T by 12, giving X and Y
      positions of tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: sparc_loudness
    data_type: array
    derivation: Average absolute amplitude of the audio waveform over 20 ms windows, dimension T.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: sparc_periodicity
    data_type: array
    derivation: Confidence of pitch presence derived over 20 ms windows, dimension T.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: ppgs
    data_type: array
    derivation: Phonetic posteriorgram probabilities across 40 phoneme categories at 100 Hz, dimension 40 by T.
    measurement_technique: ppgs package

file_collections:
  - id: https://b2ai-voice.org/files/features
    name: features
    path: features/
    collection_type: processed_data
    description: >-
      Derived acoustic features. Nine Parquet files carry time-varying tensors: ppgs.parquet,
      sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet,
      torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet, torchaudio_pitch.parquet and
      torchaudio_mel_spectrogram.parquet. Two tab-delimited files carry one row per recording:
      static_features.tsv and audio_quality_metrics.tsv. Each is paired with a JSON data dictionary
      of the same file stem describing the feature and its processing.
  - id: https://b2ai-voice.org/files/phenotype
    name: phenotype
    path: phenotype/
    collection_type: processed_data
    description: >-
      Participant-level information organised into six subfolders: confounders, demographics,
      diagnosis (per-condition tables for airway stenosis, amyotrophic lateral sclerosis, anxiety,
      benign lesions, bipolar disorder, cognitive impairment, control, COPD and asthma, depression,
      glottic insufficiency, laryngeal cancer, laryngeal dystonia, laryngitis, muscle tension
      dysphonia, Parkinson's disease, precancerous lesions, unexplained chronic cough and
      unilateral vocal fold paralysis), enrollment (eligibility, enrollment form, participant),
      questionnaire (ADHD adult, custom affect scale, DSM-5 adult, Dyspnea Index, GAD-7,
      Leicester Cough Questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric history,
      PTSD adult, VHI-10, voice perception) and task (acoustic task, Harvard sentences, random item
      generation, recording, session, Stroop, Winograd). Every TSV is paired with a JSON data
      dictionary whose keys match the column names and whose values give a description, the
      question put to the participant, and the response data type.
  - id: https://b2ai-voice.org/files/metadata
    name: metadata
    path: metadata/
    collection_type: metadata
    description: >-
      A Parquet file and matching data dictionary carrying per-recording metadata, including task
      instructions and prompts and information about the microphone used and its gain. Introduced
      in version 3.1.0.

distribution_formats:
  - id: https://b2ai-voice.org/format/parquet
    format: Parquet
    media_type: application/vnd.apache.parquet
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Open-source column-oriented format used for all dense time-varying feature tensors and for
      the per-recording metadata file; loadable with any Parquet-aware library, for example the
      HuggingFace Datasets loader.
  - id: https://b2ai-voice.org/format/tsv
    format: Tab-separated values
    media_type: text/tab-separated-values
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: Used for static_features, audio_quality_metrics and every phenotype table.
  - id: https://b2ai-voice.org/format/json
    format: JSON data dictionary
    media_type: application/json
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Every data file is paired with a JSON dictionary of the same file stem giving per-column
      descriptions, the prompting question where applicable, and data types.
  - id: https://b2ai-voice.org/format/wav
    format: WAV audio, organised under BIDS v1.9.0 with per-recording JSON sidecars
    media_type: audio/wav
    download_url: https://www.synapse.org/Synapse:syn72370534/
    notes: >-
      Raw audio is not part of the PhysioNet release and is disseminated only through the
      controlled access mechanism, via Synapse after approval by the Data Access Compliance Office.

distribution_dates:
  - id: https://b2ai-voice.org/distribution-dates/releases
    release_dates:
      - "2024-11"
      - "2025-01-17"
      - "2025-04-16"
      - "2025-08-18"
      - "2025-12-16"
      - "2026-05-01"
    notes: >-
      Version 1.0 was published at the end of November 2024 on the Health Data Nexus; versions 1.1,
      2.0.0, 2.0.1, 3.0.0 and 3.1.0 were published on PhysioNet on the subsequent dates listed.

third_party_sharing:
  - id: https://b2ai-voice.org/sharing/broad-distribution
    is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it,
      through a data publishing platform providing publicly accessible metadata and a DOI for
      persistent resolution, with the data itself behind registered or credentialed access.

license_and_use_terms:
  id: https://b2ai-voice.org/license-terms/registered-access
  license_terms: >-
    Access to the feature-only dataset is governed by the Bridge2AI Voice Registered Access License
    and the Bridge2AI Voice Registered Access Agreement: users must register on PhysioNet, confirm
    their identity, be credentialed, and sign the agreement; no additional training is required.
    Access to raw audio is governed by a separate controlled access route requiring a Data Access
    Request Form, a Data Use Agreement, review by the Data Access Compliance Office, and a Data Use
    and Transfer Agreement signed by an authorised institutional official. The Data Transfer and
    Use Agreement runs for two years from its start date or until project completion, expiry of the
    applicable ethics approval, or termination, whichever occurs first, names the Authorized Persons
    permitted to use the data, and requires collaborators at other organisations and other research
    teams at the same organisation to apply independently.
  data_use_permission: general_research_use

data_governance:
  id: https://b2ai-voice.org/governance/daco
  committee_name: Data Access Compliance Office (DACO)
  access_review_process: >-
    Two tiers. For the features-only data, registered access: register on PhysioNet under the
    Registered Access License, confirm identity, and sign the Bridge2AI-Voice Registered Access
    Agreement setting out the terms and conditions for data use. For raw audio, controlled access:
    complete the Data Access Request Form and Data Use Agreement, submit the application to the
    Data Access Compliance Office for review, and, upon approval, ensure a Data Use and Transfer
    Agreement is signed by an authorised official at the applicant's institution. A published
    memorandum sets out the ethical justification for restricting raw voice samples in this way.
  accountable_organization:
    id: https://b2ai-voice.org/organization/university-of-south-florida
    name: University of South Florida Board of Trustees
  stewardship_roles: >-
    The University of South Florida Board of Trustees acts as Provider Institution under the Data
    Transfer and Use Agreement and may unilaterally amend that agreement should the federal sponsor
    require revision. The dataset is supported by NIH through the Bridge2AI program. PhysioNet,
    maintained by the MIT Laboratory for Computational Physiology, hosts the current releases; the
    Health Data Nexus, maintained by the Temerty Centre for Artificial Intelligence Research and
    Education in Medicine at the University of Toronto, hosted version 1.0 and provides cloud
    compute alongside that dataset rather than downloads. Each institution retains its own
    identified data locally in password-protected REDCap databases.
  committee_contact:
    id: https://b2ai-voice.org/person/daco-contact
    name: Bridge2AI-Voice Data Access Compliance Office (DACO@b2ai-voice.org)
  source_caveats: >-
    Members of the Data Access Compliance Office, the decision timeframe for access requests, and
    any appeal process are not described in the available documentation.

ip_restrictions:
  id: https://b2ai-voice.org/ip/registered-access
  restrictions: >-
    The data may be protected by copyright and other rights, including other intellectual property
    rights. Duplication as reasonably required to carry out the recipient's research project is
    permitted; sale of all or part of the data on any media is not. Nothing in the agreement
    transfers intellectual property rights in or relating to the data, and recipients agree not to
    make intellectual property claims on the data, nor to use intellectual property protection,
    database rights or related rights in ways that would prevent or block access to, or use of, any
    element of the data or conclusions drawn directly from it. Recipients may obtain intellectual
    property rights on downstream discoveries but agree to implement licensing policies that will
    not obstruct further research and to respect the Fort Lauderdale Agreement. No IP-based
    restrictions have been imposed by third parties, and the provider gives no guarantee that the
    data is free of third-party intellectual property or database rights. Associated code is
    released separately: the REDCap dictionary and the documentation site under MIT, and the
    b2aiprep preprocessing library under Apache-2.0.

regulatory_restrictions:
  id: https://b2ai-voice.org/regulatory/summary
  regulatory_restrictions: No export controls apply to the dataset.
  hipaa_compliant: compliant
  confidentiality_level: restricted
  other_compliance: >-
    The dataset applies the HIPAA de-identification rules and removes direct identifiers,
    rebases or replaces dates by integers, removes or generalises geographic information, and
    removes narrative text fields; K-anonymization with k of two or greater is not achieved. The
    data are Personally Identifiable Information under OMB Memorandum M-07-16, are not subject to
    the Federal Privacy Act of 1974, and are covered by a Certificate of Confidentiality that must
    be asserted against compulsory legal demands. Recipients must comply with all applicable laws,
    rules, regulations and professional standards, must hold appropriate IRB approval before use,
    must notify the provider of any unauthorised use or disclosure within five business days, and
    must store the data with administrative, physical and technical safeguards adequate to protect
    personally identifiable information. The Data Transfer and Use Agreement additionally requires
    the recipient to warrant that it does not use coercion for labor or services as defined in
    Florida Statute 787.06.
  governance_committee_contact:
    id: https://b2ai-voice.org/person/daco-contact
    name: Bridge2AI-Voice Data Access Compliance Office (DACO@b2ai-voice.org)

participant_compensation:
  - id: https://b2ai-voice.org/compensation/gift-cards
    compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      40 USD for a data collection session lasting under 90 minutes and 80 USD for a session
      lasting over 90 minutes, for no more than three sessions and a maximum total of 120 USD.
    compensation_rationale: Compensation for participants' time.
    source_caveats: >-
      Compensation is provided to the adult population only. Participants in the separate app
      feasibility study at the USF Health Voice Center received no financial incentives.

participant_privacy:
  - id: https://b2ai-voice.org/privacy/protections
    anonymization_method: >-
      Removal of all direct identifiers and of indirect identifiers creating significant
      re-identification risk, application of the HIPAA de-identification rules, removal of
      narrative text fields, and removal of all raw voice data from the registered-access release.
    privacy_techniques: >-
      Two-tier dissemination with registered access for low-risk derivations and controlled access
      for raw audio; transmission of collected data over secure HTTPS to HIPAA-compliant storage
      hosted by an NIH STRIDES partner (Amazon, Google or Microsoft, each holding pre-negotiated
      agreements with NIH); collection applications that retain data only during the collection
      phase and remove it when the page is closed; individual usernames and passwords for REDCap
      and the HIPAA-secure cloud server; identified data held only within the collecting
      institution; and planned federated learning so that models can be trained across
      institutions without the data leaving each site.
    reidentification_risk: >-
      Even after removal of all HIPAA-protected information, each person's voice is unique to them
      and to their health at that point in life, so it is always possible, if unlikely, that
      someone could recognise a participant's voice. K-anonymization with k of two or greater is
      not achieved. All raw voice data was removed from the open release because of its potential
      to cause individual re-identification or to be used for illicit or unauthorised purposes.
    data_linkage: >-
      Participant and session identifiers link acoustic feature records to phenotype tables within
      the release. Datasheets linking participant numbers to participant information are kept at
      each institution on local cloud storage for a maximum of ten years after study completion and
      are then destroyed, under the responsibility of each local principal investigator.

retention_limit:
  id: https://b2ai-voice.org/retention/policy
  retention_period: >-
    Indefinite for the published dataset; two years from the start date for recipient copies under
    the Data Transfer and Use Agreement; a maximum of ten years after study completion for
    institution-held identifiable data.
  retention_details: >-
    Once data is contributed it will be retained as long as it is useful for research purposes,
    possibly indefinitely. Recipients must destroy or return the data at the earliest opportunity
    consistent with the purpose of the project, and in any case two years after the agreement start
    date, on project completion, on expiry of the applicable ethics approval, or on termination,
    whichever occurs first, submitting written certification of destruction within thirty days;
    they may retain one copy where records retention law, institutional policy, research integrity
    or verification require it, subject to the same restrictions. De-identified study data and
    original consent forms are stored for a minimum of five years after study completion under USF
    procedure.

updates:
  id: https://b2ai-voice.org/updates/plan
  frequency: Semi-annual (twice a year)
  update_details: >-
    Further versions of the dataset are released on a semi-annual basis as new versions on the
    hosting platform, correcting labelling errors, adding new instances and deleting instances as
    required. Users are notified through news items on the platform and through standard
    communication channels. Each version has a unique DOI and a published changelog.

version_access:
  id: https://b2ai-voice.org/versions/history
  versions_available:
    - "1.0"
    - "1.1"
    - "2.0.0"
    - "2.0.1"
    - "3.0.0"
    - "3.1.0"
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  version_details: >-
    Version 1.0 was the first release, published on the Health Data Nexus with DOI
    10.57764/qb6h-em84, containing 12,523 recordings for 306 participants. Version 1.1 added
    Mel-frequency cepstral coefficients. Version 2.0 added 136 new participants, reprocessed the
    spectrograms to fix minor issues, and removed all spectrograms and MFCCs derived from
    free-speech files. Version 2.0.1 corrected the authorship list. Version 3.0.0 added 391 further
    participants, split the single phenotype file into individual files, added SPARC and phonetic
    posteriorgram features and reorganised the file layout. Version 3.1.0 added no new participants
    but released additional data for some, fixed broken Parquet files, added audio quality metrics
    and per-recording metadata, back-filled validated diagnosis information across conditions,
    rearranged some phenotype files and renamed some gold-standard variables. Older versions
    continue by default to be supported, hosted and made available, each with its own DOI, though
    the publishers reserve the right to remove access to older versions.

errata:
  - id: https://b2ai-voice.org/erratum/v310-parquet
    erratum_details: Broken Parquet files shipped in version 3.0.0 were fixed in version 3.1.0.
    erratum_url: https://physionet.org/content/b2ai-voice/3.1.0/
  - id: https://b2ai-voice.org/erratum/v200-spectrograms
    erratum_details: >-
      Spectrograms were reprocessed in version 2.0 to fix minor issues identified in the previous
      release, and all spectrograms and MFCCs derived from free-speech files were removed.
    erratum_url: https://physionet.org/content/b2ai-voice/2.0.0/
  - id: https://b2ai-voice.org/erratum/v201-authorship
    erratum_details: Version 2.0.1 issued corrections to the authorship list.
    source_caveats: >-
      The Healthsheet states that there is no erratum and that a changelog for each dataset version
      is published online with the dataset metadata; the corrections recorded here are drawn from
      the PhysioNet release notes.

extension_mechanism:
  id: https://b2ai-voice.org/extension/mechanism
  extension_details: >-
    Others may publish a derivative dataset on the hosting platform that references the original
    source; derivative datasets may be made available under the same conditions as the source data.
    For augmentations to the code used to produce the data, the open-source repositories provide
    discussion forums and issue pages for public discussion of data preprocessing, and a pull
    request mechanism for contributing improvements to the preprocessing code.
  contribution_url: https://github.com/sensein/b2aiprep

