related_datasets:
  - relationship_type: is_supplemented_by
    target_dataset: https://doi.org/10.13026/h995-bt35
    name: Bridge2AI-Voice Pediatric Dataset
    description: >-
      Companion release covering 300 participants aged 2 to 18 recruited at the Hospital for Sick
      Children, containing derived features for 23,533 recordings collected with reproschema-ui
      using the age-banded pediatric protocol. Distributed separately on PhysioNet under the same
      Registered Access Agreement, with raw audio available via Synapse at
      https://www.synapse.org/Synapse:syn73617068.
  - relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.57764/qb6h-em84
    name: "Bridge2AI-Voice version 1.0 on the Health Data Nexus"
    description: >-
      The first release, containing 12,523 recordings for 306 participants collected across five
      sites, hosted on the Health Data Nexus, which provides cloud compute alongside the dataset
      rather than allowing data downloads.
  - relationship_type: is_documented_by
    target_dataset: https://zenodo.org/doi/10.5281/zenodo.12760724
    name: Bridge2AI Voice REDCap data dictionary and metadata
    description: >-
      The versioned REDCap data dictionary, metadata and instrument PDFs defining every collected
      field, including the sensitivity flags used to determine which fields were withheld.
  - relationship_type: is_described_by
    target_dataset: https://doi.org/10.21437/Interspeech.2024-1926
    name: "Developing Multi-Disorder Voice Protocols: A team science approach involving clinical expertise, bioethics, standards, and DEI"
    description: The publication describing development of the data acquisition protocols used to collect the dataset.