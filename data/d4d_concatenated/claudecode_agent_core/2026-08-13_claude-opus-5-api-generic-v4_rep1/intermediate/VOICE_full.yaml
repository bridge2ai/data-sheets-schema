notes: >-
  The consortium publishes a self-assessment of the dataset against the "AI-readiness for
  Biomedical Data: Bridge2AI Recommendations" rubric. The reported criterion scores are:
  FAIRness 100% (findable, accessible, interoperable and reusable all met); Provenance 100%
  (transparent, traceable, interpretable, key actors identified); Characterization 80%
  (semantics, statistics, standards and potential sources of bias met, data quality not met);
  Pre-model explainability 100% (data documentation templates, fit for purpose, verifiable);
  Ethics 100% (ethically acquired, managed, disseminated, secure); Sustainability 50%
  (persistent and well-governed met, domain-appropriate and associated not met); and
  Computability 75% (standardized, computationally accessible and portable met, contextualized
  not met).
source_caveats: >-
  Participant and recording counts differ across the bundled sources and across versions. The
  project documentation site describes version 3.0 as containing approximately 61,937
  voice-derived recordings from 833 adult participants, whereas the PhysioNet version 3.0.0 and
  3.1.0 pages report per-feature record counts ranging from 28,640 to 32,522 because some
  recordings could not yield every feature and because sensitive and free-speech derivations were
  withheld. Parts of the documentation site's Study Metadata and Data Pre-Processing sections
  still refer to version 2.0.0 while the same page advertises versions 3.1.0 (adult) and 1.1.0
  (pediatric). The NIH award number appears in several inconsistent renderings across sources:
  OT2OD032720, 3OT2OD032720-01S1, 3OT2OD032720-01S3, "3TF-OT2ActfOD032720Projectf01S1" and
  "3Tf-OTOD03272001S2". Affiliations conflict between sources for at least two investigators:
  Frank Rudzicz is given as University of Toronto in the documentation and IRB protocol but as
  Dalhousie University in the feasibility publication, and Vardit Ravitsky is given as The
  Hastings Center in the documentation and white paper but as University of Montreal in the
  feasibility publication. The pediatric lead is spelled "Jennifer Sui" in the documentation site
  and "Jennifer Siu" in the PhysioNet author lists. The documentation site names five recording
  sites while listing twelve collaborating institutions. The full authorship of the release runs
  to more than one hundred names; only the documented project and module leads are represented as
  creators here, and the complete list is carried in the citation. Values in this record describe
  the adult PhysioNet release; the pediatric release is treated as a related dataset.

