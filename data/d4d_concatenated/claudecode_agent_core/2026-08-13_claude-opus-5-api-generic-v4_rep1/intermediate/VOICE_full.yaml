id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a flagship, standardized and ethically sourced dataset of human voice,
  speech, cough and breathing recordings linked to health information, generated by the
  Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program. Participants were
  recruited prospectively at high-volume expert clinics across North America on the basis of
  clinician-confirmed membership in one of five disease cohort categories for which voice
  changes have been described: voice disorders, neurological and neurodegenerative disorders,
  mood and psychiatric disorders, respiratory disorders, and pediatric voice and speech
  disorders, together with a control cohort. Each participant completed a protocolised battery
  of acoustic tasks (sustained vowels, maximum phonation time, glides, loudness, diadochokinesis,
  validated reading passages, free speech, picture description, story recall, voluntary cough and
  breathing sounds) on a tablet running the custom Bridge2AI-Voice application, together with
  demographic questions, questions about confounders such as smoking and hydration, disease
  specific clinical validation, and validated patient-reported outcome instruments including
  VHI-10, PHQ-9, GAD-7, PANAS, DSM-5 Adult, PTSD Adult, ADHD Adult, the Dyspnea Index and the
  Leicester Cough Questionnaire. This PhysioNet release, version 3.1.0, covers 833 adult
  participants collected at five sites and contains derived audio features rather than the
  original waveforms: spectrograms, Mel spectrograms, MFCCs, pitch contours, Speech Articulatory
  Coding estimates of electromagnetic articulography, loudness, periodicity and pitch, phonetic
  posteriorgrams, openSMILE and Praat/Parselmouth static features, and audio quality metrics,
  distributed as Parquet and tab-delimited files with accompanying JSON data dictionaries.
  Phenotypic tables covering enrollment, demographics, confounders, per-condition diagnosis and
  validated questionnaires are distributed alongside the features. Raw audio is withheld from
  this release and is disseminated only under a controlled access mechanism. The consortium's
  stated anticipated enrollment for the wider study is 10,000 participants by 2027.
