purposes:
  - id: https://b2ai-voice.org/purpose/build-voice-database
    response: >-
      To build a large, multi-institutional, ethically sourced and demographically diverse
      database of human voice, speech and respiratory sounds linked to multimodal health
      biomarkers, so that voice can be developed as a biomarker of health.
  - id: https://b2ai-voice.org/purpose/fuel-ai-models
    response: >-
      To fuel voice AI research and support the development of predictive models that assist in
      screening, diagnosis, monitoring and treatment of a broad range of diseases across five
      target cohorts.
  - id: https://b2ai-voice.org/purpose/establish-standards
    response: >-
      To introduce and standardise the field of audiomics by developing new bioinformatic and
      acoustic standards for voice data collection, storage, interoperability and analysis.
  - id: https://b2ai-voice.org/purpose/develop-tools
    response: >-
      To develop software and cloud infrastructure, including a smartphone and tablet
      application and federated learning capability, that permits non-invasive, user-friendly,
      high-quality voice data collection while preserving patient privacy.
  - id: https://b2ai-voice.org/purpose/ethical-norms
    response: >-
      To develop ethical and legal norms and new guidelines for consenting to voice data
      collection, sharing and utilisation, safeguarding participant data while supporting
      data-sharing efforts.

addressing_gaps:
  - id: https://b2ai-voice.org/gap/small-datasets
    response: >-
      Existing studies of machine-learning voice diagnosis produced promising results but used
      small or medium sample sizes; in laryngeal cancer screening and diagnosis most studies
      reported training sets of fewer than 300 patients and only two used more than one data
      modality, limiting generalisation.
  - id: https://b2ai-voice.org/gap/missing-standards
    response: >-
      Comparing studies and pooling data has been difficult because there are no established
      standards for how voice and other acoustics are measured and collected, which precludes
      meta-analysis and cross-study validation.
  - id: https://b2ai-voice.org/gap/private-industry-data
    response: >-
      Industry holds vast amounts of voice data but lacks accurate clinical and demographic
      annotation, and its datasets are private, which prevents external auditing of training
      data and of fair representation of diverse populations.
  - id: https://b2ai-voice.org/gap/missing-metadata-linkage
    response: >-
      Prior voice datasets lacked the key clinical metadata needed to train robust, clinically
      useful models, and were not linked to gold-standard clinician-confirmed diagnoses or to
      other health data modalities.
  - id: https://b2ai-voice.org/gap/pediatric-scarcity
    response: >-
      Pediatric voice and speech data are sparse, partly because of ethical concerns and
      acquisition challenges, so normative developmental data and machine-learning resources for
      children are largely unavailable.

tasks:
  - id: https://b2ai-voice.org/task/disease-classification
    response: >-
      Training machine-learning models for disease detection and classification from voice, with
      labels drawn from diagnostic categories covering vocal pathologies, neurological disorders,
      psychiatric conditions and respiratory disorders.
  - id: https://b2ai-voice.org/task/model-development-benchmarking
    response: >-
      Development, benchmarking and validation of clinically applicable machine-learning models
      that use voice as a non-invasive, cost-effective biomarker.
  - id: https://b2ai-voice.org/task/screening-monitoring
    response: >-
      Research into screening, diagnosis and longitudinal monitoring of health conditions using
      voice, speech, cough and breathing biomarkers.

other_tasks:
  - id: https://b2ai-voice.org/other-task/pretraining
    task_details: >-
      The dataset can be used for AI model pretraining and fine-tuning as well as for the
      benchmarking or validation of externally developed models.
  - id: https://b2ai-voice.org/other-task/acoustic-standards-research
    task_details: >-
      Because the release carries per-recording acoustic quality metrics, per-recording metadata
      including microphone and gain, and features from multiple extraction toolkits, it can
      support methodological research into acoustic recording standards and feature comparison
      rather than disease classification alone.

intended_uses:
  - id: https://b2ai-voice.org/intended-use/clinical-ml-research
    use_category: research
    usage_notes: >-
      Intended to enable the development, benchmarking or validation of clinically applicable
      machine-learning models for diagnosing a wide range of health conditions using voice data,
      including vocal pathologies and neurological, psychiatric, respiratory and pediatric voice
      disorders.
    examples:
      - Training a classifier to distinguish laryngeal cancer from benign laryngeal lesions using derived acoustic features
      - Validating an externally trained voice biomarker model on an independent, clinician-labelled cohort
  - id: https://b2ai-voice.org/intended-use/model-pretraining
    use_category: research
    usage_notes: >-
      Intended for AI model pretraining and fine-tuning, for which the featurised release
      provides spectrograms, Mel spectrograms, MFCCs, articulatory traces and phonetic
      posteriorgrams already aligned to participant, session and task identifiers.
  - id: https://b2ai-voice.org/intended-use/authorized-research-only
    use_category: research
    usage_notes: >-
      Under the Registered Access Agreement the dataset is intended solely for commercial and
      non-commercial research purposes carried out by Authorized Researchers who have been
      credentialed and have signed the agreement.

discouraged_uses:
  - id: https://b2ai-voice.org/discouraged/non-research-decisions
    discouragement_details: >-
      Use for non-research and non-clinical applications such as hiring decisions or insurance
      premium adjustment is discouraged, because such use risks unethical or biased outcomes that
      would negatively affect individuals on the basis of their health conditions or voice
      characteristics.
  - id: https://b2ai-voice.org/discouraged/surveillance
    discouragement_details: >-
      Use in any form of surveillance that could lead to discrimination or harm is discouraged.
  - id: https://b2ai-voice.org/discouraged/ignoring-skew
    discouragement_details: >-
      Use that ignores the dataset's skews by disorder category, collection site and demographic
      factors is discouraged; users should consider the multivariate distribution when assessing
      the dataset's utility for a given question, and should be aware that a future user could
      otherwise produce results that lead to stereotyping or quality-of-service failures for
      particular groups.

prohibited_uses:
  - id: https://b2ai-voice.org/prohibited/reidentification
    prohibition_reason: >-
      Attempting to re-identify research participants, or taking any action that could reasonably
      lead to re-identification, is prohibited under the Registered Access Agreement.
  - id: https://b2ai-voice.org/prohibited/harm-stigmatization
    prohibition_reason: >-
      Any purpose that could foreseeably cause harm or stigmatization to research participants,
      their families, communities or specific populations is prohibited.
  - id: https://b2ai-voice.org/prohibited/ip-blocking
    prohibition_reason: >-
      Intellectual property protections, database rights or related rights may not be used in a
      manner that restricts or limits access to any part of the dataset or to any conclusions
      drawn directly from it, so that future use remains unrestricted in alignment with the Open
      Science principles upheld by the consortium.
  - id: https://b2ai-voice.org/prohibited/sale
    prohibition_reason: >-
      Sale of all or part of the data on any media is not permitted, and recipients may not
      disclose, release, sell, rent, lease, loan or otherwise grant access to the data to any
      party other than Authorized Persons named in the Data Transfer and Use Agreement.
  - id: https://b2ai-voice.org/prohibited/contacting-subjects
    prohibition_reason: >-
      Recipients may not use the data, alone or with other information, to make any effort to
      contact the individuals who are the subjects of the data without institutional review board
      approval, specific written approval from the provider, and informed consent from the
      individual where required.

existing_uses:
  - id: https://b2ai-voice.org/existing-use/summer-school
    examples:
      - >-
        A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer
        School and hackathon.

future_use_impacts:
  - id: https://b2ai-voice.org/future-impact/composition-skew
    impact_details: >-
      The dataset has skews based on disorder category, collection site and other demographic
      factors. A future user who does not account for the multivariate distribution risks
      producing models whose utility differs sharply across subgroups, with downstream potential
      for unfair treatment, stereotyping or quality-of-service failures.
  - id: https://b2ai-voice.org/future-impact/no-subject-impact-analysis
    impact_details: >-
      Voice is inherently identifiable and voice AI raises documented risks of re-identification,
      voice hacking and contested data ownership; the consortium therefore restricts raw audio to
      controlled access and publishes a memorandum setting out the ethical justification for that
      governance structure.
    source_caveats: >-
      The Healthsheet records that no analysis of the potential impact of the dataset and its use
      on data subjects has been conducted.

