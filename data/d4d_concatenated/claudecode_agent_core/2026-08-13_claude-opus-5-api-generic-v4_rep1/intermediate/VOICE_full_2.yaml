third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it, through a
      data publishing platform providing publicly accessible metadata and a DOI for persistent
      resolution, with the data itself behind registered or controlled access.

license_and_use_terms:
  license_terms: >-
    Two tiers apply. Registered access to the feature-only data requires registration on PhysioNet,
    identity confirmation under the Registered Access License, and signature of the Bridge2AI-Voice
    Registered Access Agreement; from version 3.0.0 the PhysioNet access policy requires credentialed
    users who sign the data use agreement, with no additional training required. Controlled access to
    raw audio requires a Data Access Request Form, a Data Use Agreement, review by the Data Access
    Compliance Office, and a Data Transfer and Use Agreement signed by an authorised institutional
    official. The Data Transfer and Use Agreement runs for two years from its start date or until
    project completion or expiry of ethics approval, whichever comes first, and permits duplication as
    reasonably required to carry out the stated research project. There are no fees associated with
    these restrictions.
  data_use_permission: general_research_use
  notes: >-
    Recipients must retain control over the data, may share it only with Authorized Persons listed in
    the agreement, and must bind those persons to equivalent confidentiality and security standards;
    collaborators at other organisations and other research teams at the same organisation must apply
    independently and sign their own agreement.

data_governance:
  committee_name: Bridge2AI-Voice Data Access Compliance Office (DACO)
  access_review_process: >-
    Requests for raw audio are addressed to the Data Access Compliance Office at DACO@b2ai-voice.org.
    Applicants complete a Data Access Request Form and a Data Use Agreement and submit the application
    to the Data Access Compliance Office for review; on approval, a Data Transfer and Use Agreement is
    signed by an authorised official at the recipient institution and the data is released via Synapse.
    Registered access to the feature-only release is granted through PhysioNet credentialing and
    signature of the Bridge2AI-Voice Registered Access Agreement.
  accountable_organization:
    id: b2ai-voice:org-usf-bot
    name: University of South Florida Board of Trustees, acting as Provider Institution under the Data Transfer and Use Agreement
  stewardship_roles:
    - Provider Institution supplies the data, may amend the agreement unilaterally if the federal sponsor requires revision, and may terminate with thirty days written notice
    - Data Access Compliance Office reviews and approves controlled-access applications
    - Recipient Scientist retains control over the data and restricts use to Authorized Persons named in the agreement
    - Recipient institutional official signs the Data Transfer and Use Agreement on behalf of the institution
    - PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts and distributes the registered-access release
    - Bridge2AI-Voice consortium curates the data and responds to dataset questions
  notes: >-
    Recipients must notify the Provider of any unauthorised use or disclosure within five business days
    of discovery and cooperate in investigation and mitigation, and must certify destruction of the
    data in writing within thirty days of termination or expiration.

ip_restrictions:
  restrictions:
    - The data may be protected by copyright and other rights, including other intellectual property rights
    - Duplication as reasonably required to carry out the recipient's research project is permitted
    - Sale of all or part of the data on any media is not permitted
    - Nothing in the agreement transfers to the recipient any intellectual property rights in or relating to the data
    - Recipients agree not to make intellectual property claims on the data
    - Recipients agree not to use intellectual property protection, database rights or related rights in ways that would prevent or block access to, or use of, any element of the data or conclusions drawn directly from it
    - Recipients may obtain intellectual property rights on downstream discoveries provided they implement licensing policies that will not obstruct further research
    - Recipients agree to respect the Fort Lauderdale Agreement
    - No third parties have imposed intellectual property based restrictions on the data associated with the instances
  notes: >-
    The Data Provider gives no guarantee that the data is free of third-party intellectual property
    rights, database rights or related rights.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions: >-
    No export controls or other regulatory restrictions apply to the dataset or to individual instances.
  other_compliance: >-
    The data is covered by a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas for identifying information or characteristics of
    a research participant. Recipients must adhere to the specific requirements of PhysioNet, managed
    by the MIT Laboratory for Computational Physiology. Recipients must not use the data to contact
    individuals who are its subjects without IRB approval, specific written approval from the Provider
    and informed consent where required.
  source_caveats: >-
    The Data Transfer and Use Agreement states that the data is Personally Identifiable Information as
    defined in OMB Memorandum M-07-16 and "not covered under HIPAA, FERPA, or similar laws", while the
    healthsheet states that the HIPAA de-identification rules were applied to the released dataset; the
    two statements describe the controlled-access transfer and the de-identified release respectively.

retention_limit:
  retention_period: >-
    Indefinite for the archived dataset; two years from the start date for recipient copies under the
    Data Transfer and Use Agreement.
  retention_details: >-
    Once data is contributed it will be retained as long as it is useful for research purposes,
    possibly indefinitely. Recipients must destroy or return the data two years after the start date of
    their agreement, upon completion of their project, upon termination, or upon expiration of the
    applicable ethics approval, whichever occurs first, and must submit written certification of
    destruction within thirty days; one archival copy may be retained where required by law, regulation
    or institutional policy or for research integrity and verification. Under the collection protocol,
    identifiable data and datasheets linking participant numbers to participant information are kept at
    each institution on local cloud storage for a maximum of ten years after study completion and then
    destroyed, and de-identified study data and original consent forms are stored for a minimum of five
    years after study completion.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The Bridge2AI-Voice consortium curates the dataset; the curator may be contacted through the
      project's published contact address, and dataset questions are directed to the corresponding
      author listed on the PhysioNet project page.
  - role: academic_institution
    maintainer_details: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts versions 1.1
      through 3.1.0 and provides continued access to credentialed researchers; PhysioNet is supported
      by NIBIB, NHLBI and the NIH Office of the Director under grants U24EB037545 and R01EB030362.
  - role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, a data publishing platform maintained by the Temerty Centre for Artificial
      Intelligence Research and Education in Medicine (T-CAIREM) at the University of Toronto, hosted
      the earlier feature-only release and provides cloud compute alongside the dataset rather than
      allowing downloads; the platform team may be contacted through the address published with that
      release.
  - role: government_agency
    maintainer_details: >-
      The dataset is supported by the NIH via the Bridge2AI project, under the NIH Common Fund
      Bridge2AI program.

updates:
  frequency: >-
    Semi-annual, described as twice a year; observed PhysioNet releases fall in January, April, August
    and December 2025 and May 2026.
  update_details: >-
    Further versions are released as new versions of the dataset with additional participants,
    additional derived features and corrections. A changelog for each dataset version is published
    online with the dataset metadata. Users are notified through news items on the hosting platform and
    through standard communication channels. Version 3.0.0 added 391 participants, separated the single
    phenotype file into individual per-instrument files, and added Speech Articulatory Coding features
    and phonetic posteriorgrams; version 3.1.0 added no new participants but released additional data
    for some participants, fixed broken Parquet files, added audio quality metrics and per-recording
    metadata, and back-filled validated diagnosis information with some gold standard variables renamed.

version_access:
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
    - "1.1, published 2025-01-17, DOI 10.13026/249v-w155 (files no longer available)"
    - "2.0.0, published 2025-04-16"
    - "2.0.1, published 2025-08-18"
    - "3.0.0, published 2025-12-16, DOI 10.13026/k81f-qr68"
    - "3.1.0, published 2026-05-01, DOI 10.13026/8xbn-nq66"
    - "1.0, published November 2024 on the Health Data Nexus, DOI 10.57764/qb6h-em84"
