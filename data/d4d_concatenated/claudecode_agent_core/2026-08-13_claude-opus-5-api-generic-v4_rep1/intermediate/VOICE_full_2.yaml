existing_uses:
  - examples:
      - Bridge2AI Summer School
      - Bridge2AI hackathon
    notes: >-
      A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer School
      and hackathon.

intended_uses:
  - use_category: Machine learning research
    examples:
      - Development, benchmarking and validation of clinically applicable machine-learning models for diagnosing health conditions from voice
      - Pretraining and fine-tuning of models on derived acoustic and articulatory representations
    usage_notes: >-
      No recommended train, validation or test splits are supplied; researchers must construct their
      own and should account for skew by disorder category, site and demographics.
  - use_category: Clinical research
    examples:
      - Screening, diagnosis and monitoring of vocal pathologies, neurological and neurodegenerative disorders, psychiatric conditions and respiratory disorders using voice biomarkers
      - Study of the relationship between acoustic features and validated patient-reported outcome measures
    usage_notes: >-
      Use is restricted to commercial and non-commercial research purposes by Authorized Researchers
      under the registered access agreement.
  - use_category: Cohort selection and secondary analysis
    examples:
      - Selecting cohorts from the phenotype tables for downstream acoustic analyses
    usage_notes: >-
      The questionnaire features are distributed in the phenotype folder format and can be used for
      cohort selection.

other_tasks:
  - task_details: >-
      The variety of released representations — eGeMAPS summaries, Praat and Parselmouth measures,
      speech intelligibility metrics, articulatory kinematics and phonetic posteriorgrams — supports
      speech science and acoustic methods research beyond disease classification, including work on
      recording standards and quality control using the audio quality metrics released in version 3.1.0.

discouraged_uses:
  - discouragement_details: >-
      The dataset should not be used for non-research or non-clinical applications such as hiring
      decisions, insurance premium adjustments, or any form of surveillance that could lead to
      discrimination or harm. These limitations are intended to prevent unethical or biased outcomes
      that could negatively impact individuals based on their health conditions or voice characteristics.

prohibited_uses:
  - prohibition_reason: >-
      Attempting to re-identify research participants, or taking any actions that could reasonably lead
      to re-identification, is prohibited under the Registered Data Access Agreement.
  - prohibition_reason: >-
      Any purpose that could foreseeably cause harm or stigmatisation to research participants, their
      families, communities or specific populations is prohibited.
  - prohibition_reason: >-
      Intellectual property protections, database rights or related rights may not be used in a manner
      that restricts or limits access to any part of the dataset or to any conclusions derived from it,
      so that future use of the dataset remains unrestricted in alignment with Open Science principles.
  - prohibition_reason: >-
      Sale of all or part of the data on any media is not permitted under the Data Transfer and Use
      Agreement.
  - prohibition_reason: >-
      Disclosure, release, rental, lease, loan or grant of access to any third party other than
      Authorized Persons is prohibited without prior written consent of the Provider; collaborators at
      other organisations must apply independently.
  - prohibition_reason: >-
      Recipients may not use the data, alone or with other information, to contact individuals who are
      its subjects without appropriate IRB approval, specific written approval from the Provider and
      informed consent from the individual where required.

future_use_impacts:
  - impact_details: >-
      The dataset has skews based on disorder category, site and other demographic factors; users
      should consider the multivariate distribution when assessing utility for different questions, and
      should be aware that unfair treatment of individuals or groups, stereotyping or quality-of-service
      failures could follow from ignoring them.
  - impact_details: >-
      Because collection configurations differed by site and the protocol changed over the course of the
      study, models fitted across the full dataset may absorb site and protocol effects; changes in
      diagnostic criteria or practices are identified as a source of distribution shift over time.
  - impact_details: >-
      Voice is inherently identifying, so any future release or derivation that reconstructs or exposes
      waveform-level information carries re-identification risk; this is the stated reason raw audio is
      disseminated only under controlled access.

use_repository: []

source_caveats: >-
  Evidence commentary on the values above.
  (1) Referent: the bundle documents two published collections from the same project. This record
  describes the adult flagship dataset published on PhysioNet as b2ai-voice, at version 3.1.0; the
  Bridge2AI-Voice Pediatric Dataset is recorded under related_datasets rather than merged in, and
  pediatric-specific facts (ReproSchema-UI collection, SickKids recruitment, guardian consent and
  assent, 300 participants, 23,533 recordings) are attributed as such where they appear.
  (2) Counts: the project documentation states version 3.0 contains approximately 61,937 voice-derived
  recordings from 833 adult participants, while the PhysioNet release notes give per-feature record
  counts no larger than 32,522; the two figures cannot be reconciled from the bundle and both are
  recorded where relevant.
  (3) Hosting: the documentation page describes distribution through the Health Data Nexus with a DOI
  and cloud compute, and describes "the current v.2.0.0 dataset" and a v2.0.0 citation, whereas the
  PhysioNet pages carry versions 1.1 to 3.1.0; the documentation appears to describe an earlier release
  state and both hosts are recorded.
  (4) Access tier: version 1.1 was published under Restricted Access with a Registered Access License,
  while versions 3.0.0 and 3.1.0 are published under Credentialed Access requiring signature of the data
  use agreement; the terms recorded reflect the current release with the earlier wording preserved.
  (5) Sites: the PhysioNet releases state five North American collection sites, the documentation lists
  twelve collaborating institutions, and the IRB protocol lists nine participating institutions with
  named lead investigators; five is used for the collection sites and the wider lists are attributed to
  their sources.
  (6) Award identifiers appear in at least seven forms across the bundle, two of which are evidently
  corrupted; all are recorded under funders.
  (7) The Hospital for Sick Children lead is named "Jennifer Sui" in the documentation and
  "Jennifer Siu" in the PhysioNet author lists.
  (8) The Data Transfer and Use Agreement describes the data as PII "not covered under HIPAA" while the
  healthsheet reports HIPAA de-identification rules were applied; the tension is noted at
  regulatory_restrictions.
  (9) The healthsheet reports no cleaning pre-processing while the documentation describes an audit
  protocol with outlier, schema and audio quality checks; both are recorded at cleaning_strategies.
  (10) The 47-participant feasibility study of the data-collection application (USF, 5 June to 28 July
  2023, IRB 004890, no financial incentives, no audio collected) is a separate study; its participant
  characteristics, task metrics and compensation terms are not properties of this dataset and are not
  reported as such.
  (11) Several dataset-level answers in the healthsheet are dated to earlier releases (for example the
  833-instance figure appears alongside v3.0 material and the eligibility text refers to v2.0.0), so
  values drawn from it are aligned to version 3.1.0 only where the PhysioNet release notes confirm them.

notes: >-
  An AI-readiness self-assessment against the Bridge2AI recommendations accompanies the documentation,
  scoring FAIRness 100 percent (findable, accessible, interoperable and reusable all met); Provenance
  100 percent (transparent, traceable, interpretable, key actors identified); Characterization 80
  percent (semantics, statistics, standards and potential sources of bias met, data quality not met);
  Pre-model explainability 100 percent (data documentation templates, fit for purpose, verifiable);
  Ethics 100 percent (ethically acquired, managed, disseminated, secure); Sustainability 50 percent
  (persistent and well-governed met, domain-appropriate and associated not met); and Computability 75
  percent (standardized, computationally accessible and portable met, contextualized not met).
  The documentation also carries a notice that the repository is under review for potential
  modification in compliance with Administration directives.