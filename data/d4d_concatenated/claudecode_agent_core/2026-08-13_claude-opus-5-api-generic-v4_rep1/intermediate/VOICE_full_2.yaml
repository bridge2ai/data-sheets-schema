id: https://doi.org/10.13026/37yb-1t42
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a multi-institutional collection of voice, speech, breathing and cough
  recordings linked to demographic, clinical and validated questionnaire data, generated by the
  Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program to support the study of
  voice as a biomarker of health. Participants were recruited at high-volume expert clinics and
  community outreach clinics across North America against per-condition inclusion and exclusion
  criteria covering five disease cohort categories — voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, respiratory disorders, and pediatric
  voice and speech disorders — together with controls; the adult release covers four of the five
  categories plus controls. Each session captured acoustic tasks recorded through the Bridge2AI-Voice
  iPad application, a detailed demographic and confounder survey, and cohort-specific validated
  instruments, with diagnoses confirmed against gold-standard evidence such as laryngoscopy and
  stroboscopy imaging, brain CT and MRI, spirometry and flow-volume loops, or the electronic health
  record. Version 3.1.0 contains data for 833 adult participants collected at five North American
  sites. The public release contains derivations of the audio rather than the audio itself:
  short-time Fourier spectrograms, Mel spectrograms, Mel-frequency cepstral coefficients, pitch
  traces, articulatory (electromagnetic articulography) estimates, loudness and periodicity,
  phonetic posteriorgrams, and static openSMILE, Praat/Parselmouth and torchaudio feature summaries,
  distributed as Apache Parquet alongside tab-delimited phenotype tables and JSON data dictionaries.
  Raw audio is withheld from the release and held under controlled access. The study design is
  observational, cohort-based and cross-sectional, with an anticipated enrollment of 10,000
  participants by 2027 and eligibility spanning ages 18 to 120 for the adult protocol, including
  healthy volunteers.
