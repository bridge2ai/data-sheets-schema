errata:
  - erratum_details: >-
      No erratum is maintained. A changelog for each dataset version is published online with the
      dataset metadata.
  - erratum_details: >-
      Corrections issued across releases: version 2.0 reprocessed spectrograms to fix minor issues
      identified in the previous release and removed all spectrograms and MFCCs derived from
      free-speech files; version 2.0.1 corrected the authorship list; version 3.1.0 fixed broken
      Parquet files from the previous release and updated validated diagnosis information across
      conditions with back-filled information.

extension_mechanism:
