purposes:
  - response: >-
      To generate a large-scale, multi-institutional, ethically sourced and demographically diverse
      voice, speech and cough database linked to multimodal health biomarkers, in order to fuel voice
      AI research and enable predictive models that assist in screening, diagnosis and treatment of a
      broad range of diseases.
  - response: >-
      To fill the gap left by prior machine-learning voice studies whose sample sizes were too small
      or which lacked the key metadata needed to train robust, clinically useful models, by providing
      a dataset suitable for developing, benchmarking or validating clinically applicable AI/ML models.
  - response: >-
      To establish the field of audiomics by developing new standards of acoustic and voice data
      collection, interoperability and analysis for voice AI research, including bioinformatics
      standards for voice data.
  - response: >-
      To facilitate the use of voice as a non-invasive, cost-effective biomarker for the screening,
      diagnosis and monitoring of a wide range of health conditions, including in low-resource settings.
  - response: >-
      To demonstrate an ethically sourced data generation model with benchmarks of diversity metrics,
      minimised risk of algorithmic bias, and defined ethical and legal norms safeguarding participant
      data while supporting data sharing.

tasks:
  - response: >-
      Detection and classification of health conditions from voice, speech, breathing and cough
      recordings, with diagnostic labels spanning vocal pathologies, neurological and
      neurodegenerative disorders, psychiatric and mood conditions, and respiratory disorders.
  - response: >-
      Pretraining, fine-tuning, benchmarking and external validation of machine-learning and deep
      learning models on acoustic and derived articulatory representations.
  - response: >-
      Multimodal analysis linking acoustic features with demographic data, confounder surveys and
      validated patient-reported outcome instruments.
  - response: >-
      Development of remote monitoring and screening approaches, including longitudinal monitoring of
      progressive and degenerative conditions.

addressing_gaps:
  - response: >-
      Existing academic studies of voice biomarkers remain largely at proof-of-concept level with
      small- to medium-sized datasets, often using voice as the only data type; in laryngeal cancer
      screening and diagnosis most studies reported training datasets of fewer than 300 patients and
      only two used more than one data modality.
  - response: >-
      Comparing studies and pooling data is challenging because there are no standards for how voice
      and speech data are collected and measured, precluding meta-analysis.
  - response: >-
      Industry datasets are private, which limits the ability to audit machine-learning models and the
      accuracy of training data labels; industry has access to vast amounts of voice data but lacks
      accurate clinical and demographic information to annotate it.
  - response: >-
      The limited size, quality and diversity of existing open-source datasets likely explains the
      absence of validated, US Food and Drug Administration approved AI algorithms for disease
      detection and monitoring from voice.
  - response: >-
      Pediatric voice and speech literature is sparser, partly because of ethical concerns and
      challenges in data acquisition for this cohort.

instances:
  - instance_type: human research participant
    counts: 833
    data_topic: B2AI_TOPIC:4
    data_substrate: B2AI_SUBSTRATE:41
    label: true
    label_description: >-
      Each participant carries a gold-standard clinical diagnostic label recorded in per-condition
      diagnosis tables. Labels were assigned by a qualified clinician at the site of data collection
      based on a clinical interview and appropriate work-up; for the psychiatric cohort the label was
      determined outside data collection from the participant's electronic health record or an active
      prescription written by an appropriately licensed clinician.
    notes: >-
      Participants answered a common set of questions and then additional questions relevant to their
      primary diagnostic category. A subset of participants required more than one session, so more
      than one row per participant may appear in the phenotype tables and the responses need not be
      identical across sessions.
  - instance_type: voice, speech, breathing or cough recording, released as derived acoustic features
    counts: 32522
    data_topic: B2AI_TOPIC:36
    data_substrate: B2AI_SUBSTRATE:30
    source_caveats: >-
      Record counts differ by feature in version 3.1.0 because some recordings could not produce every
      feature: torchaudio pitch n=32522, sparc periodicity and pitch n=31872, sparc loudness n=31855,
      spectrograms, Mel spectrograms and MFCCs n=29278, phonetic posteriorgrams n=29289, sparc
      electromagnetic articulography n=28640. The count given here is the largest per-feature count.
      The project documentation separately describes version 3.0 as containing approximately 61,937
      voice-derived recordings from 833 adult participants.

relationships:
  - relationship_details: >-
      The healthsheet states that individual instances are unrelated to one another. Within the data,
      recordings are linked to their participant and encounter through participant_id and session_id
      keys, and a participant may contribute multiple sessions and multiple recordings.

splits:
  - split_details: >-
      No recommended train, validation or test splits are provided. Researchers are encouraged to
      create their own data splits based on their specific requirements, and are advised to consider
      the multivariate distribution of disorder category, site and demographic factors when doing so.

subsets:
  - id: b2ai-voice:subset-voice-disorders
    name: Voice disorders cohort
    description: >-
      Participants with laryngeal and vocal fold pathology, covering laryngeal cancer, laryngitis,
      precancerous lesions (keratosis and leukoplakia), benign lesions of the vocal cord (nodules,
      polyps, cysts, Reinke's edema, ulcers, recurrent respiratory papilloma, fibrous mass, rheumatoid
      nodules), muscle tension dysphonia, laryngeal dystonia and vocal tremor, unilateral vocal fold
      paralysis, and glottic insufficiency or presbyphonia. Diagnoses are validated with laryngoscopy
      images and stroboscopy videos, with CT and spirometry for selected conditions.
    is_data_split: false
    is_subpopulation: true
  - id: b2ai-voice:subset-respiratory
    name: Respiratory disorders cohort
    description: >-
      Participants with airway stenosis (bilateral vocal fold paralysis, supraglottic, glottic,
      posterior glottic, subglottic, tracheal or multi-level upper airway stenosis), unexplained
      chronic cough of more than eight weeks, and COPD or asthma. Validation uses spirometry and flow
      volume loops and CT of the neck and chest.
    is_data_split: false
    is_subpopulation: true
  - id: b2ai-voice:subset-neurological
    name: Neurological and neurodegenerative disorders cohort
    description: >-
      Participants aged over 44 and under 85 with mild cognitive impairment, Alzheimer's disease,
      other dementias (frontotemporal, Lewy body, vascular, mixed, alcohol induced), amyotrophic
      lateral sclerosis, or Parkinson's disease and atypical parkinsonism. Validation uses brain CT
      and MRI, serum p-tau biomarkers for Alzheimer's disease, and whole genome sequencing.
    is_data_split: false
    is_subpopulation: true
  - id: b2ai-voice:subset-mood-psychiatric
    name: Mood and psychiatric disorders cohort
    description: >-
      Participants with a clinical diagnosis of depression or major depressive disorder, bipolar
      disorder, or anxiety disorder, together with co-morbid conditions including alcohol or substance
      use disorder, ADHD, autism spectrum disorder, borderline personality disorder, eating disorder,
      insomnia or sleep disorder, obsessive-compulsive disorder, panic disorder, PTSD, schizophrenia
      and social anxiety disorder. Validation uses the electronic health summary, a psychiatrist's
      clinical diagnosis and medication history.
    is_data_split: false
    is_subpopulation: true
  - id: b2ai-voice:subset-controls
    name: Control cohort
    description: >-
      Participants not diagnosed or treated for a voice, respiratory, mood or neurological disorder
      affecting voice, cough, breath or speech, recorded in the control diagnosis table.
    is_data_split: false
    is_subpopulation: true

subpopulations:
  - identification: >-
      Self-reported age, gender, sex, race and ethnicity, and socioeconomic status are collected in
      the demographics instrument, alongside language, education, employment and disability items.
    distribution: >-
      Not quantified in the release documentation. The dataset is described as skewed by disorder
      category, site and other demographic factors, and users are advised to consider the multivariate
      distribution when assessing utility for a given question.
    subpopulation_elements_present: true
  - identification: >-
      Disease cohort membership is identifiable through the per-condition diagnosis tables in the
      phenotype folder, one table per validated condition plus a control table.
    distribution: >-
      The public releases do not contain an equal distribution of the disease categories; the adult
      release covers four of the five planned categories plus controls, and further releases are
      expected to add data.
    subpopulation_elements_present: true

anomalies:
  - anomaly_details: >-
      Different sites used different collection configurations, and the collection protocol changed
      over the course of the study.
  - anomaly_details: >-
      Confounding factors present in the data include noise artifacts, variations in diagnostic
      practices between sites and over time, inaccurate questionnaire responses, and underreporting.
  - anomaly_details: >-
      Transcriptions and certain other derived elements were generated using off-the-shelf models
      that have not been audited for correctness.
  - anomaly_details: >-
      Some recordings could not generate certain features, whether because of length or other issues,
      and are therefore absent from the corresponding bundled feature files, producing unequal record
      counts across feature types.
  - anomaly_details: >-
      Version 2.0 reprocessed spectrograms to fix minor issues identified in the previous release, and
      version 3.1.0 fixed broken Parquet files carried over from version 3.0.0.
  - anomaly_details: >-
      Recordings were made with a head-mounted headset and microphone that could sit at slightly
      different distances from the speaker, introducing variation in level and signal quality.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants were recruited at a limited number of geographic locations, principally
      high-volume expert clinics within academic institutions. Groups that have less trust in the
      medical system or in AI, or who are less proximal to the collection sites, would have been less
      likely to be recruited.
    mitigation_strategy: >-
      The consortium intends to make the sample more representative by shifting to remote collection
      and designing the recruitment approach to control for more variables, and by expanding to
      community outreach clinics serving underserved populations.
  - bias_type: representation_bias
    bias_description: >-
      Data collection was restricted to fluent English speakers; participants unable to read or speak
      English were excluded. The released adult versions contain English only.
    mitigation_strategy: >-
      Spanish protocols and data collection are under development and are planned for future releases.
  - bias_type: sampling_bias
    bias_description: >-
      Sampling used a non-probability method. Participants were screened for different disorders
      depending on site, so recording site and recording device are confounded with diagnostic label.
    affected_subsets: >-
      All disease cohorts; each cohort was recruited predominantly at the sites hosting the
      corresponding specialty clinic.
  - bias_type: measurement_bias
    bias_description: >-
      Distinct iPad devices were used at each site, microphone distance varied with the head-mounted
      headset, and the clinical diagnosis was performed by one clinician or derived from an electronic
      health record entry or prescription depending on the disorder.
  - bias_type: annotation_bias
    bias_description: >-
      A single labeler provided the diagnostic label for each instance, typically the clinician at the
      site of data collection or an external clinician who made a prior diagnostic assessment. No
      inter-annotator agreement was computed and human-level performance on the target tasks is
      reported to vary widely.
  - bias_type: historical_bias
    bias_description: >-
      Changes in diagnostic criteria or clinical practice over the collection period could produce
      distribution shift within the dataset.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample of a larger, ongoing collection and is not representative, because it
      was collected at a limited number of geographic locations across the USA and Canada.
    recommended_mitigation: >-
      Assess the multivariate distribution of site, disorder category and demographics before
      generalising results.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Only fluent English speakers were enrolled for the released versions, and the public releases do
      not contain an equal distribution of the five planned disease categories.
    scope_impact: >-
      Models trained on the release may not transfer to other languages or to under-represented cohorts.
  - limitation_type: scope_limitation
    limitation_description: >-
      The public release contains derived features rather than raw audio. Spectrograms, Mel
      spectrograms, MFCCs, phonetic posteriorgrams and articulatory estimates are additionally
      withheld for free-speech and open-response prompts, for sensitive records, and for audio checks.
    recommended_mitigation: >-
      Apply for controlled access to the raw audio through the Data Access Compliance Office where the
      research question requires waveform-level data.
  - limitation_type: integration_limitation
    limitation_description: >-
      The multimodal data described in the collection protocol — laryngoscopy imaging, chest and brain
      imaging, genomic data and other EHR-derived elements — is extracted at each site independently
      and was not released with version 3.0.0.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Diagnostic labels rest on a single clinician's assessment, an EHR record or an active
      prescription, and machine-generated elements such as transcription have not been audited for
      correctness. There is no control arm and no objective benchmark for successful task completion.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Collection spanned approximately twelve months during which the protocol changed, so early and
      late records are not strictly comparable.
  - limitation_type: resolution_limitation
    limitation_description: >-
      Spectrograms were downsampled by a factor of two in the time domain after derivation, and all
      audio was resampled to 16 kHz monaural before feature extraction.

content_warnings:
  - content_warnings_present: true
    warnings: >-
      Free speech tasks may contain language chosen by the participant that could be offensive or
      distressing; while the inclusion of such content is unlikely it cannot be completely avoided,
      because participants are responsible for their own choice of language. The protocol also elicits
      responses about mental health status, traumatic life experiences and other distressing topics
      through validated instruments such as the PHQ-9, GAD-7, DSM-5 Adult and PTSD Adult surveys.
    source_caveats: >-
      Transcripts of free speech audio and features derived from open-response prompts were removed
      from the released versions, so the residual exposure applies mainly to the controlled-access raw
      audio rather than to the registered-access feature release.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      Race and ethnic origin are recorded in the demographics instrument.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Sexual orientation is recorded in the demographics instrument.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Socioeconomic information is collected; elements revealing highly sensitive information such as
      household income and household composition were removed before release.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Health data including clinical diagnoses, past medical history, medication, mental health status
      and traumatic life experiences is collected; the most sensitive of these elements were removed
      before release.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Raw voice recordings are biometric data with the potential to cause individual re-identification
      or to be used for illicit or unauthorised purposes; they were removed from the release and are
      disseminated only through controlled access.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data protected by legal privilege or
      doctor-patient confidentiality, nor the content of individuals' non-public communications.
    source_caveats: >-
      The Data Transfer and Use Agreement marks the data as covered by a Certificate of
      Confidentiality that must be asserted against compulsory legal demands such as court orders and
      subpoenas, and sets a confidentiality level of restricted for recipients; that agreement governs
      the controlled-access raw data rather than the de-identified registered-access release.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor de-identification applied to the phenotype data, combined with removal of
    indirect identifiers judged to create significant re-identification risk, removal of
    non-identifying but highly sensitive elements selected by a team of ethicists, and withholding of
    all raw audio from the release.
  identifiers_removed:
    - Names
    - Civic addresses and geographic locators
    - Social security numbers
    - Date information at a resolution finer than years
    - Phone and fax numbers
    - Email addresses
    - IP addresses
    - Medical record numbers
    - Health plan beneficiary numbers
    - Device identifiers
    - License numbers
    - Account numbers
    - Vehicle identifiers
    - Website URLs
    - Full face photographs
    - Biometric identifiers including raw voice recordings
    - State and province (country of data collection retained)
    - Narrative text fields and transcripts of free speech audio
    - Select demographic identifiers and information about household composition or cultural identity
    - Highly sensitive elements such as household income, mental health status and traumatic life experiences
    - All fields encoded as sensitive in the REDCap data dictionary
  deidentification_details: >-
    Dates were rebased or replaced by integers. Raw audio transcripts were reviewed and any recordings
    containing potentially identifying information or external voices were removed from the release.
    Spectrograms, MFCCs, Mel spectrograms, transcriptions, electromagnetic articulography estimates
    and phonetic posteriorgrams from open-response prompts were removed from the feature-only dataset.
    K-anonymisation with k greater than or equal to 2 was not achieved.

at_risk_populations:
  at_risk_groups_included: true
  special_protections: >-
    Adult cohorts include participants with mild cognitive impairment, Alzheimer's disease and other
    dementias, and psychiatric diagnoses. The protocol requires that consent be obtained in English
    with a full explanation and an opportunity for the participant to restate their understanding to
    the research assistant, and states that participation is voluntary and does not affect medical
    care. The IRB checklist for children under 21 was completed and appended to the protocol.
  guardian_consent: >-
    For the pediatric cohort, parents or guardians provide consent; parental permission may be
    obtained from one or both parents because the research is minimal risk.
  assent_procedures: >-
    Children provide verbal assent where appropriate, and assent is documented. Where young children
    cannot reasonably be asked to assent because of limitations in understanding due to age and
    development, typically under seven years of age, they are not asked to do so.
  source_caveats: >-
    Guardian consent and assent provisions apply to the pediatric cohort, which was collected only at
    pediatric participating sites and is published as a separate dataset; no pediatric data collection
    took place at the University of South Florida.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: >-
    University of South Florida Institutional Review Board acting as single IRB, with subsite IRBs
    engaged through the single IRB process. Canadian institutions (Mount Sinai Hospital, the Hospital
    for Sick Children and the University of Toronto) do not participate in the single IRB process and
    obtained separate research ethics board approvals; pediatric collection was approved by the
    Research Ethics Board at the Hospital for Sick Children.
  irb_approval: >-
    The Bridge2AI Voice Data Acquisition protocol was submitted to and approved by the USF Single IRB
    and subsite IRBs; PhysioNet records that data collection and sharing was approved by the
    University of South Florida Institutional Review Board. The clinical study was reviewed and
    approved by at least one human subjects protection review board; no data monitoring committee was
    appointed, and the study is not for a drug product or a medical device.
  regulatory_compliance: >-
    HIPAA de-identification rules applied; a partial HIPAA waiver was granted for chart review during
    recruitment and screening; the data is covered by a Certificate of Confidentiality; data are held
    on HIPAA-compliant infrastructure through NIH STRIDES partners.
  special_populations:
    - Adults with mild cognitive impairment, dementia and other neurodegenerative conditions
    - Adults with psychiatric and mood disorders
    - Children aged 2 to 18 in the pediatric cohort

ethical_reviews:
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Single IRB of record for the multi-site Bridge2AI Voice Data Acquisition protocol; approved the
      protocol, the tiered consent processes including paper, electronic and video-recorded consent,
      and a partial HIPAA waiver permitting review of electronic health records for recruitment and
      screening. Thirteen protocol versions were recorded between January 2023 and July 2025.
    contact_person:
      id: b2ai-voice:person-bensoussan-yael
      name: Yael Bensoussan
  - reviewing_organization: Research Ethics Board, The Hospital for Sick Children
    review_details: >-
      Approved collection and sharing of the pediatric cohort, which was recruited strictly at the
      Hospital for Sick Children.
  - reviewing_organization: Research ethics boards of Mount Sinai Hospital and the University of Toronto
    review_details: >-
      Canadian participating institutions applied separately under Canadian regulations rather than
      through the USF single IRB. Genomic data collection and analysis is covered by a separate
      protocol at these sites, with copies of the approvals submitted to the USF IRB.
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      IRB number 004890 approved the separate feasibility study of the Bridge2AI-Voice application
      conducted at the USF Health Voice Center; all participants in that study provided written
      informed consent.
    source_caveats: >-
      This approval covers the app feasibility study rather than the dataset described here; no audio
      data was collected at that stage of app development.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Prospective written informed consent, obtainable on paper, electronically through the
      application or a REDCap survey, or by video recording in which the participant reads a statement
      aloud so that identity can be verified and participants distinguished from bots.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap; all paper and
      electronic versions are stored for a minimum of five years after study completion, with
      de-identified study data and original consent forms retained through the Florence platform.
    consent_scope: >-
      Consent covers collection and use of the data, sharing of de-identified research data with
      external researchers through a secure database, registered access release of data posing low
      re-identification risk and controlled access release of higher-risk data, investigator access to
      medical information through EHR platforms for gold-standard validation of diagnoses and
      symptoms, and optionally future contact for longitudinal collection. For longitudinal
      participants an electronic consent is administered before each subsequent collection.
    withdrawal_mechanism: >-
      Participants may withdraw at any time. If a participant withdraws during or before completion of
      voice data collection their data is not included in the database; once the voice data collection
      process is completed the data cannot be removed. Participants who withdraw may optionally
      complete a satisfaction survey collecting no protected health information.

collection_consents:
  - consent_details: >-
      All participants were duly informed and agreed to the collection and use of their data via
      prospective informed consent. Participants were explicitly informed about the data being
      collected, the methods used to secure it, and how the information would be used.

consent_revocations:
  - revocation_details: >-
      Consenting participants are informed that they may withdraw from the study at any point.
      Withdrawal before or during voice data collection excludes the data from the database;
      participants are informed that research data including voice recordings cannot be removed once
      the collection process is complete. For longitudinal cohorts, participants may leave at any
      point during the study period and the minimum requirement for study completion is one data
      collection time point.

collection_notifications:
  - notification_details: >-
      Participants were notified through an IRB-approved consent process conducted by trained research
      assistants, typically taking about thirty minutes with time for questions, in which potential
      participants were asked to explain what they had understood in order to confirm comprehension.
      Where consent was obtained remotely, participants could contact researchers with questions before
      signing.

data_protection_impacts:
  - impact_details: >-
      A team of ethicists identified the direct identifiers, indirect identifiers and non-identifying
      but highly sensitive elements to be removed, judging indirect identifiers against the risk of
      re-identification through combination with public data on social media, in government registries
      or elsewhere. A memorandum, "Ethical Justification for Controlled Access to Raw Voice Data
      Samples", documents the reasoning behind the tiered governance structure that keeps raw voice
      under controlled access.
    source_caveats: >-
      The healthsheet answers "No" to whether an analysis of the potential impact of the dataset and
      its use on data subjects has been conducted, so no formal data protection impact assessment is
      claimed even though the ethics review described above was performed.

participant_privacy:
  - anonymization_method: >-
      HIPAA Safe Harbor removal of direct identifiers, removal of indirect identifiers creating
      significant re-identification risk, removal of highly sensitive non-identifying elements, and
      exclusion of all raw audio from the released dataset.
    privacy_techniques:
      - Tiered dissemination with registered access for low-risk derived features and controlled access for raw audio
      - Participant and institution numbering, with identifiable data retained locally at the collecting institution
      - Transmission over secure HTTPS to HIPAA-compliant storage held with NIH STRIDES partners
      - Federated learning intended to allow multi-institutional model training without data leaving each institution
      - Contractual prohibition on re-identification attempts and on contacting data subjects
    reidentification_risk: >-
      Voice is unique to the individual and cannot be fully de-identified, so recognition by a listener
      remains conceivable; raw audio is therefore withheld from open release. K-anonymisation with k
      greater than or equal to 2 was not achieved for the released tables.
    data_linkage: >-
      Each institution keeps its identified data within the institution in password-protected REDCap
      databases; only de-identified participant data and derived features are shared through the joint
      infrastructure, linked by participant and session identifiers.

participant_compensation:
  - compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      40 USD for a data collection session taking less than 90 minutes and 80 USD for a session taking
      over 90 minutes, for no more than three sessions and a maximum compensation of 120 USD.
    compensation_rationale: Compensation for participant time; provided to the adult population only.
    source_caveats: >-
      Participants in the separate app feasibility study did not receive financial incentives, and the
      compensation schedule was revised across IRB protocol versions before reaching the amounts above.

acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Voice, speech, breathing and cough recordings were captured directly during a supervised
      session using the Bridge2AI-Voice application, with a trained research assistant present.
  - was_reported_by_subjects: true
    acquisition_details: >-
      Demographic data, confounder and social habit surveys, past medical history and validated
      patient-reported outcome instruments were completed by participants themselves through the
      application.
  - was_validated_verified: true
    acquisition_details: >-
      Clinical diagnoses were verified by clinicians reviewing audio and imaging data, consulting
      electronic health records, or checking medication prescriptions, following per-condition gold
      standard validation methods.
  - was_inferred_derived: true
    acquisition_details: >-
      The released feature sets were derived computationally from the standardised audio using
      openSMILE, Praat and Parselmouth, torchaudio, Speech Articulatory Coding, the ppgs package and
      OpenAI Whisper Large.

collection_mechanisms:
  - mechanism_details: >-
      The Bridge2AI-Voice iOS application running on study iPads (9th or 10th generation) and iPad Air
      (5th generation), with an Avid AE-36 microphone connected through an Apple dongle, used for
      in-clinic acoustic task recording and questionnaire administration.
  - mechanism_details: >-
      The Bridge2AI-Voice Web application, runnable in a browser on a computer, tablet or phone with no
      software download or login, used for remote data collection; data are held only during the
      collection session and transmitted over secure HTTPS to HIPAA-compliant storage.
  - mechanism_details: >-
      REDCap, used for the case report form, clinical validation instruments, enrollment and consent
      records, and as the source from which phenotype tables were exported and converted.
  - mechanism_details: >-
      ReproSchema-UI, used with the Bridge2AI-Voice pediatric protocol; pediatric data are extracted,
      transformed into REDCap format and then converted to the Brain Imaging Data Structure.
  - mechanism_details: >-
      The Bridge2AI Enrollment Web application, used for remote screening and enrollment, with entries
      deleted once participants are enrolled or within 90 days of submission, whichever comes first.

data_collectors:
  - role: research staff
    collector_details: >-
      Research teams including medical, graduate and undergraduate students, who screened charts,
      coordinated with clinicians to identify appropriate participants, conducted the consent process,
      introduced the application and supervised the recording session.
  - role: clinician
    collector_details: >-
      Clinicians and physicians at each site, listed as co-investigators under the IRB and added to
      the consortium so that their names appear on consortium-level publications, who provided the
      gold-standard diagnoses.
  - role: hospital staff
    collector_details: >-
      Hospital staff, who were not involved in scheduling but assisted with the logistics of
      coordinating data collection.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from the individuals in question rather than obtained via third
      parties, in private clinic rooms at participating institutions and, for later phases, remotely
      through the web and iOS applications.

collection_timeframes:
  - timeframe_details: >-
      The healthsheet reports that the data were collected over a period of twelve months; specific
      collection start and end dates for the released versions are not given. The parent award period
      recorded in NIH RePORTER runs from 2022-09-01 to 2026-11-30, and the IRB protocol describes a
      four-year phased collection programme with exploratory, pilot, expansion and outreach phases.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies:
      - Non-probability sampling
      - >-
        Purposive recruitment at high-volume expert clinics, defined as outpatient clinics within
        hospital systems or academic institutions with expertise in a specific disease area seeing
        more than fifty patients per month from the same disease category
      - Recruitment at community outreach clinics serving underserved and under-represented populations
      - Screening of charts against per-cohort inclusion and exclusion criteria before the clinic day
      - Recruitment through flyers with QR codes, waiting-room approaches, social media, the project websites and the FlowTrials platform
      - Targeted identification by medical record review where specific diagnoses or severities are under-represented
    source_data: >-
      Patients presenting at specialty clinics at participating North American institutions, together
      with volunteers without the conditions of interest recruited as controls.
    why_not_representative: >-
      The sample was collected at a limited number of geographic locations and is a sample of a larger,
      ongoing collection.
    representative_verification: >-
      No verification of representativeness was performed; the documentation states the sample is not
      representative.
    notes: >-
      Eligibility for the adult protocol spans ages 18 to 120, all sexes, and includes healthy
      volunteers; participants must be able to read and speak English, and are excluded if they have
      had a surgical intervention significantly altering the symptoms of the disease studied.

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was converted to monaural and resampled to 16 kHz with a Butterworth anti-aliasing
      filter applied, producing the standardised audio from which all features were derived.
  - preprocessing_details: >-
      Spectrograms were computed with the short-time Fast Fourier Transform using a 25 ms window, a
      10 ms hop length and a 400-point FFT, then downsampled by a factor of two in the time domain,
      giving arrays of dimension 201 by T.
  - preprocessing_details: >-
      Mel spectrograms (60 Mel bins) and 60 Mel-frequency cepstral coefficients were computed with the
      same window, hop and FFT parameters.
  - preprocessing_details: >-
      Articulatory features were generated with the Speech Articulatory Coding (sparc) package at
      50 Hz, comprising kinematic traces of six vocal tract articulators as X and Y positions
      (electromagnetic articulography estimates), plus loudness from 20 ms windows, periodicity and
      fundamental frequency over a 50 to 550 Hz range.
  - preprocessing_details: >-
      Static acoustic and prosodic features were extracted with openSMILE (eGeMAPS), and with Praat
      and Parselmouth for fundamental frequency, formants and voice quality; torchaudio was used for
      pitch contours with minimum and maximum pitch of 80 and 500 Hz, and speech intelligibility
      metrics were computed for speech tasks.
  - preprocessing_details: >-
      Phonetic posteriorgrams giving a time-varying categorical distribution over 40 phoneme categories
      at 100 Hz were generated with the ppgs package.
  - preprocessing_details: >-
      Transcriptions were generated using OpenAI's Whisper Large model; free-speech transcripts were
      subsequently removed from the release.
  - preprocessing_details: >-
      Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from REDCap were
      converted to be compliant with the Brain Imaging Data Structure v1.9.0, and phenotype tables were
      merged into tab-delimited files with JSON data dictionaries using the b2aiprep library
      (version 3.0.0 for this release).
  - preprocessing_details: >-
      Waveform-derived features are stored in two forms: a fixed feature format holding static features
      extracted from the entire waveform, and a temporal format whose length varies with the recording.

cleaning_strategies:
  - cleaning_details: >-
      An audit protocol is run over each release: missingness tables are generated, distributions and
      outliers are checked, categorical responses are checked against the schema, and quality control
      metrics are run for audio tasks, including the amount of silence, the duration, and for speech
      tasks a comparison of the produced speech against the intended passage.
    source_caveats: >-
      The healthsheet separately answers "No" to whether there was any pre-processing for cleaning the
      data, so the audit described here appears to be treated as quality control rather than cleaning.
  - cleaning_details: >-
      Raw audio transcripts were reviewed and any recordings containing potentially identifying
      information or external voices were removed from the release; features for sensitive records and
      for audio checks were also excluded.
  - cleaning_details: >-
      Acoustic engineers and AI data scientists were assigned to analyse the exploratory-phase samples
      for acoustic quality and machine-learning readiness, with 10 percent of subsequent data selected
      at random each month for quality control.

labeling_strategies:
  - labeling_details: >-
      Gold-standard clinical diagnostic labels are attached at the participant level, resulting from a
      clinical assessment rather than post hoc annotation of the recordings.
    annotations_per_item: 1
    annotator_demographics: >-
      Typically the clinician at the site of data collection, or a clinician external to the study who
      made a prior diagnostic assessment; no further demographic characterisation of labelers is provided.
    data_annotation_platform: >-
      REDCap clinical validation instruments, completed by a qualified physician or practitioner, with
      supporting review of the electronic health record.
    data_annotation_protocol: >-
      Labels follow the Bridge2AI protocols and ICD-10 codes, with per-condition gold standard
      validation methods: laryngoscopy images and stroboscopy videos for voice disorders, with CT and
      spirometry for selected conditions; spirometry and flow volume loops and neck or chest CT for
      respiratory conditions; brain CT, brain MRI, serum p-tau biomarkers and whole genome sequencing
      for neurological and neurodegenerative conditions; and electronic health summary, psychiatrist
      diagnosis and medication history for psychiatric conditions.
    inter_annotator_agreement: >-
      Not computed; a single labeler provided the label per instance.
    notes: >-
      Researchers deriving new labels are asked to describe the process, including the exact variables
      used for the determination, alongside any release of a model or publication.

machine_annotation_tools:
  - tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat
      - Parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs (phonetic posteriorgrams)
      - b2aiprep
      - senselab
    tool_descriptions:
      - Whisper Large generated transcriptions of the recordings
      - openSMILE extracted eGeMAPS acoustic features per audio file
      - Praat and Parselmouth produced phonetic and prosodic measures including fundamental frequency, formants and voice quality
      - torchaudio produced pitch contours, spectrograms, Mel spectrograms and MFCCs
      - Speech Articulatory Coding produced electromagnetic articulography estimates plus loudness, periodicity and pitch
      - The ppgs package produced high-fidelity neural phonetic posteriorgrams over 40 phoneme categories
      - b2aiprep organised and preprocessed the dataset and merged source data into the phenotype files
      - senselab processed audio files for research tasks
    tool_accuracy: >-
      Not assessed; certain aspects of the data, for example transcription, were generated using
      off-the-shelf models that have not been audited for correctness.

annotation_analyses:
  - analysis_method: >-
      No formal annotation analysis was performed; labels were treated as gold standard clinical
      diagnoses rather than as annotations requiring adjudication.
    annotation_quality_details: >-
      One labeler provided a label per instance, so no inter-annotator agreement statistic exists.
      Human-level performance on the applications the dataset is intended to address is reported to
      vary widely.

missing_data_documentation:
  - missing_data_causes:
      - Some questionnaire items are optional
      - Data collection irregularities during a session
      - Participants answered a common set of items plus items specific to their primary diagnostic category
      - Some recordings could not produce certain features because of length or other issues
      - Features for sensitive records and for audio checks were deliberately excluded
      - Spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and articulatory estimates were removed for free-speech and open-response prompts
    missing_data_patterns:
      - Phenotype tables contain a row for a participant only if at least one column is non-missing
      - Per-condition diagnosis tables contain rows only for participants in the corresponding cohort
      - Per-feature record counts differ across the Parquet files within a release
      - Participants with multiple sessions may give different responses for the same element across sessions
    handling_strategy: >-
      A missingness table is included with the dataset and the audit protocol regenerates missingness
      tables for each release; no imputation is performed.

raw_data_sources:
  - source_description: >-
      Raw audio recordings of voice, speech, breathing and cough tasks captured with the Bridge2AI-Voice
      application during supervised sessions.
    source_type: Primary prospective collection from human participants
    raw_data_format: >-
      WAV audio files, standardised to monaural 16 kHz before feature extraction, organised in a Brain
      Imaging Data Structure v1.9.0 layout with paired JSON sidecars.
    access_details: >-
      Retained but not publicly accessible. Raw audio is disseminated only through controlled access:
      applicants complete a Data Access Request Form and a Data Use Agreement, submit the application to
      the Data Access Compliance Office for review, and on approval have a Data Transfer and Use
      Agreement signed by an authorised official at their institution. Requests are made by email to
      the Data Access Compliance Office, and the adult raw audio is made available via Synapse at
      https://www.synapse.org/Synapse:syn72370534/.
  - source_description: >-
      Questionnaire, demographic, confounder, enrollment and clinical validation responses captured in
      REDCap, together with pediatric responses captured in ReproSchema-UI.
    source_type: Participant self-report and clinician-completed case report forms
    raw_data_format: >-
      REDCap exports converted to tab-delimited phenotype tables with JSON data dictionaries.
    access_details: >-
      Available under registered access on PhysioNet after credentialing and signature of the
      Bridge2AI Voice Registered Access Agreement.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    description: Unique pseudonymous identifier for the participant, present in every feature and phenotype table.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    description: Unique identifier for the recording session; a participant may have more than one session.
  - variable_name: task_name
    data_type: categorical
    description: The acoustic task performed for the recording.
    examples: >-
      Prolonged Vowel; Maximum Phonation Time; Glides; Loudness; Diadochokinesis; Respiration; Voluntary
      Cough; Rainbow Passage; Caterpillar Passage; Cape-V Sentences; Free Speech; Picture Description;
      Story Recall; Animal Fluency; Word-Color Stroop; Productive Vocabulary; Random Item Generation;
      Cinderella Story; Audio Check
  - variable_name: n_frames
    data_type: integer
    description: Number of time frames associated with the feature stored in the row.
  - variable_name: spectrogram
    data_type: array
    description: Short-time Fourier transform magnitude spectrogram of dimension 201 by T, stored in torchaudio_spectrogram.parquet.
    derivation: >-
      25 ms window, 10 ms hop length, 400-point FFT, then downsampled by a factor of two in the time
      domain; plotted in decibels by conversion from the power representation.
    measurement_technique: torchaudio
    quality_notes: Excluded for free-speech and open-response prompts, for sensitive records and for audio checks.
  - variable_name: mel_spectrogram
    data_type: array
    description: Mel spectrogram of dimension 60 by T, stored in torchaudio_mel_spectrogram.parquet.
    derivation: 25 ms window, 10 ms hop length, 400-point FFT and 60 Mel bins.
    measurement_technique: torchaudio
  - variable_name: mfcc
    data_type: array
    description: Sixty Mel-frequency cepstral coefficients of dimension 60 by T, stored in torchaudio_mfcc.parquet.
    derivation: Computed from the Mel spectrogram using the same window, hop and FFT parameters.
    measurement_technique: torchaudio
  - variable_name: pitch
    data_type: array
    unit: Hz
    minimum_value: 80.0
    maximum_value: 500.0
    description: Detected fundamental frequency over time, of dimension T, stored in torchaudio_pitch.parquet.
    measurement_technique: torchaudio
  - variable_name: sparc_pitch
    data_type: array
    unit: Hz
    minimum_value: 50.0
    maximum_value: 550.0
    description: >-
      Estimated fundamental frequency of dimension T derived with the Speech Articulatory Coding
      package using an algorithm distinct from the torchaudio pitch estimator.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: sparc_ema
    data_type: array
    description: >-
      Estimated electromagnetic articulography of dimension T by 12, giving X and Y positions of six
      articulators: tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip.
    derivation: Deep learning model applied to the standardised audio at 50 Hz.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: sparc_loudness
    data_type: array
    description: Estimated loudness of dimension T based on the average absolute amplitude of the waveform.
    derivation: Computed using 20 ms windows.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: sparc_periodicity
    data_type: array
    description: Estimated periodicity, the confidence of pitch presence, of dimension T.
    derivation: Computed using 20 ms windows.
    measurement_technique: Speech Articulatory Coding (sparc)
  - variable_name: ppgs
    data_type: array
    description: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories, of dimension 40 by T at a
      frame rate of 100 Hz.
    measurement_technique: ppgs package (high-fidelity neural phonetic posteriorgrams)

file_collections:
  - id: b2ai-voice:files-features
    name: features
    path: features
    collection_type: processed_data
    description: >-
      Derived audio features. Nine Parquet files hold the dense time-varying representations:
      torchaudio_spectrogram.parquet (n=29278), torchaudio_mel_spectrogram.parquet (n=29278),
      torchaudio_mfcc.parquet (n=29278), torchaudio_pitch.parquet (n=32522), sparc_ema.parquet
      (n=28640), sparc_loudness.parquet (n=31855), sparc_periodicity.parquet (n=31872),
      sparc_pitch.parquet (n=31872) and ppgs.parquet (n=29289). Two plain-text files hold per-recording
      summaries: static_features.tsv, with one row per unique recording covering openSMILE, Praat,
      Parselmouth and torchaudio features, and audio_quality_metrics.tsv, added in version 3.1.0. Each
      data file is paired with a JSON data dictionary sharing the same file stem.
  - id: b2ai-voice:files-phenotype
    name: phenotype
    path: phenotype
    collection_type: processed_data
    description: >-
      Participant-level information organised into six subfolders, each file a tab-delimited table
      paired with a JSON data dictionary whose keys match the column names and whose values give a
      description, the question asked and the data type. The subfolders are confounders; demographics;
      diagnosis, with seventeen per-condition tables in version 3.1.0 spanning airway stenosis,
      amyotrophic lateral sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment,
      control, COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal
      dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous lesions,
      unexplained chronic cough and unilateral vocal fold paralysis; enrollment, with eligibility,
      enrollment form and participant tables; questionnaire, with the ADHD adult, custom affect scale,
      DSM-5 adult, dyspnea index, GAD-7, Leicester cough questionnaire, PANAS, PHQ-9, productive
      vocabulary, psychiatric history, PTSD adult, VHI-10 and voice perception instruments; and task,
      with acoustic task, Harvard sentences, random item generation, recording, session, Stroop and
      Winograd tables.
    notes: >-
      In version 3.1.0 the ADHD adult, PTSD adult and psychiatric history tables sit under
      questionnaire, whereas in version 3.0.0 they sat under diagnosis; the voice perception and voice
      problem severity task tables were also rearranged between those versions.
  - id: b2ai-voice:files-metadata
    name: metadata
    path: metadata
    collection_type: metadata
    description: >-
      Introduced in version 3.1.0. A Parquet file and its data dictionary holding per-recording
      metadata, including task instructions and prompts and information about the microphone used and
      its gain.

distribution_formats:
  - format: Apache Parquet, an open-source column-oriented data file format
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Loadable with any Parquet-capable library; the documentation demonstrates loading with the
      HuggingFace Datasets library and plotting spectrograms in decibels via librosa.
  - format: Tab-separated values with paired JSON data dictionaries
    media_type: text/tab-separated-values
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: Readable with any statistical analysis tool, for example pandas.read_csv with a tab separator.
  - format: WAV audio in a Brain Imaging Data Structure v1.9.0 layout with paired JSON sidecars
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    notes: >-
      Raw audio is not part of the PhysioNet release; it is distributed only through controlled access
      via Synapse after institutional sign-off.

