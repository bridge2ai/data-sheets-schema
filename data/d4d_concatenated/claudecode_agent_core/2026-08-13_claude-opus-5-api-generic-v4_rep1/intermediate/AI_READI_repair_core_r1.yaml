acquisition_methods:
  - acquisition_details: >-
      Directly observed measurements made by trained study staff during the in-person visit,
      including height, weight, waist and hip circumference, blood pressure and heart rate,
      12-lead electrocardiogram, monofilament testing, cognitive screening, visual acuity and
      contrast sensitivity, autorefraction, and retinal imaging on multiple devices.
    was_directly_observed: true
  - acquisition_details: >-
      Participant-reported data collected through self-administered questionnaires completed
      online in REDCap before the visit or on paper, covering eligibility screening, demographics,
      depression (CES-D-10), diabetes distress (PAID-5), diabetes self-care, diet, ophthalmic
      history, smoking, alcohol, vaping and marijuana use, general health history, social
      determinants of health, and current medications. Entered medications were cross-referenced
      with medications physically brought in or photographed by the participant where possible.
    was_reported_by_subjects: true
    was_validated_verified: true
  - acquisition_details: >-
      Device-recorded data captured continuously during a 10-day at-home monitoring period after
      the visit: interstitial glucose every five minutes from a Dexcom G6 continuous glucose
      monitor, physical activity, heart rate, respiratory rate, oxygen saturation, stress and
      sleep from a Garmin Vivosmart 5 worn on the wrist, and indoor environmental parameters from
      a custom-built LeeLab Anura sensor placed in a frequently used area of the home. Participants
      recorded which wrist the tracker was worn on, their dominant hand, and where the
      environmental sensor was placed.
    was_directly_observed: true
  - acquisition_details: >-
      Laboratory analytes derived from non-fasting whole blood, plasma, serum and urine specimens
      collected during the visit. Complete blood counts were run on fresh whole blood by
      CLIA-certified laboratories local to each site; all other assays were performed on stored,
      frozen samples by the University of Washington Nutrition and Obesity Research Center.
    was_directly_observed: true
    was_validated_verified: true
  - acquisition_details: >-
      Data drawn from the electronic health records of the three health systems. EHR screening on
      ICD-10 codes and demographics was used to identify recruitment pools; past health records,
      medications and traffic and accident reports are held in the controlled-access version of
      the dataset rather than the public release.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      REDCap electronic data capture, used both for the online recruitment and e-consent interface
      and for collecting participant-reported questionnaire data and the following clinical data
      from the visit: medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament test results and complete blood count results. Clinical values falling outside
      expected minimum/maximum ranges were flagged automatically in REDCap reports.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Philips, Amsterdam, the Netherlands) for the 12-lead
      electrocardiogram, performed with the participant in a reclining chair or supine, with the
      position recorded as 0, 30, 60 or 90 degrees relative to supine. Data are exported as .xml
      and released in WFDB format.
  - mechanism_details: >-
      Optomed Aurora IQ handheld non-mydriatic fundus camera (Optomed, Oulu, Finland), 50 degree
      field of view, 5 Mpix sensor; four macula- and disc-centred undilated colour fundus photos
      per participant, taken in a dark room with the participant reclined. Images are exported in
      DICOM.
    notes: >-
      Because images are undilated and the camera is handheld, image quality varies between
      participants and within the same participant.
  - mechanism_details: >-
      iCare EIDON widefield TrueColor confocal fundus imaging system (iCare USA, Raleigh, North
      Carolina), operated in fully automated mode in a dark room; twelve images per participant
      comprising ultra-wide field central, nasal and temporal colour fundus photographs,
      ultra-wide field central infrared, ultra-wide field central fundus autofluorescence, and a
      smart horizontal mosaic of ultra-wide field images. DICOM output.
  - mechanism_details: >-
      Heidelberg Spectralis HRA optical coherence tomography and OCT angiography system
      (Heidelberg Engineering GmbH, Heidelberg, Germany) with confocal scanning laser
      ophthalmoscope technology; six images per participant from Optic Nerve Head Radial Circle
      High Resolution OCT, Posterior Pole Macula HR 61 lines OCT, and Macula 20x20 HS 512 lines
      OCTA. DICOM output.
  - mechanism_details: >-
      Topcon Maestro2 3D OCT-1 robotic OCT and colour fundus camera (Topcon Healthcare,
      Itabashi-ku, Tokyo, Japan); six images per participant from 3D Wide (H) 12x9 512x128 OCT, 3D
      Macula 6x6 512x128 OCT and Macula 6x6 360x360 OCTA at a 50 kHz scan rate. Exported in .fda
      file format and converted to DICOM for the dataset.
  - mechanism_details: >-
      Topcon Triton DRI swept-source OCT (Topcon Healthcare, Itabashi-ku, Tokyo, Japan) with a
      1,050 nm light source and non-mydriatic colour fundus camera; six images per participant from
      3D(H)+Rad 12x9 512x256 OCT, Macula 6x6 320x320 OCTA and Macula 12x12 512x512 OCTA. Exported
      in .fda file format and converted to DICOM for the dataset.
  - mechanism_details: >-
      Carl Zeiss Meditec Cirrus 5000 Angioplex (Carl Zeiss Meditec AG, Jena, Germany); eight images
      per participant from Disc Cube 200x200 OCT, Macula Cube 512x128 OCT, Macula 6x6 OCTA and Disc
      6x6 OCTA, with 8x8 mm single scans and 14x14 mm automated OCTA montage available for
      peripheral assessment. DICOM output.
  - mechanism_details: >-
      Heidelberg Engineering Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) system; two
      macula-centred images per participant recorded in short (498-560 nm) and long (560-720 nm)
      spectral channels, exported in .sdt file format and converted to DICOM for the dataset.
      Photon arrival times and counts are recorded per pixel after each laser pulse.
    notes: >-
      FLIO is performed as the last modality of the visit because it takes longer than a standard
      Spectralis OCT and exposes participants to uncomfortable levels of light, so participant
      compliance may be lower; the device cannot tolerate more than one centimetre of movement
      during acquisition.
  - mechanism_details: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system (Dexcom, Inc., San Diego,
      California). A glucose sensor filament inserted under the skin of the abdomen with an
      external transmitter records blood glucose in mg/dL every five minutes for ten days;
      participants are masked to the results during the monitoring period. Data are exported as
      .csv and released in Open mHealth format.
  - mechanism_details: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland), worn
      continuously for ten days, with a five-second sampling frequency, recording steps, heart
      rate, sleep duration and phases, oxygen saturation, respiratory rate, stress level and
      calorie expenditure. Exported in .FIT file format and converted to the Open mHealth standard
      for the dataset.
    notes: >-
      Participants were advised to wear the device on the non-dominant wrist but were free to
      choose; gaps in collection occur because the battery must be charged every two to three days.
  - mechanism_details: >-
      LeeLab Anura, a custom-designed indoor environmental sensor built for the project at the
      Karalis Johnson Retina Center, University of Washington, placed in a frequently used area of
      the participant's home for ten days. It records ambient temperature, relative humidity,
      nitrogen oxides (NO and NO2), volatile organic compounds, particulate matter counts (PM1.0,
      PM2.5, PM4 and PM10) and eleven multi-spectral light intensity measurements, output as .csv.
    notes: >-
      The environmental sensor and the fitness tracker were specifically chosen with participant
      privacy as a primary concern: they do not capture video or audio, are not equipped with GPS
      location monitoring, and are not synced with participant-owned devices. Component datasheets
      are identified in the dataset structure metadata (ams-OSRAM AS7431, DS3231 precision RTC,
      Sensirion SEN5x and Sensirion NOx Index).
  - mechanism_details: >-
      M&S Technologies Electronic Visual Acuity tester (Niles, Illinois) for photopic and mesopic
      best-corrected letter visual acuity, administered at four metres on a 12x20 inch
      touch-screen monitor, with mesopic conditions produced by viewing through a 2.0 neutral
      density filter or ND occluder.
  - mechanism_details: >-
      Mars Letter Contrast Sensitivity chart (Mars Perceptrix, Chappaqua, New York), administered
      monocularly under photopic conditions with a general occluder and mesopic conditions with a
      neutral density occluder, in the order photopic OD, photopic OS, mesopic OD, mesopic OS;
      chart background luminance 60-120 cd/m2 (optimal 85), illuminance 189-377 lux (optimal 267),
      viewing distance 40-59 cm (design 50 cm), with near correction and undilated pupils.
  - mechanism_details: >-
      Topcon KR-800 auto keratometer/refractor (Topcon Healthcare) for autorefraction of each eye,
      giving spherical and cylindrical components in diopters with cylindrical axis. Lensometry
      used NIDEK LM-600P, Topcon CL-200 and Topcon CL-300 devices across sites.
  - mechanism_details: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada), producing a total score out of 30 together
      with section subscores, Memory Index Score and task completion times, exported as .csv.
  - mechanism_details: >-
      Standard 10 g monofilament applied to three locations on the plantar surface of each foot,
      ten times per location, with the participant's eyes closed and responding yes or no; insensate
      areas are retested for confirmation and results are recorded on an iPad, laptop or paper
      questionnaire and entered into REDCap.
  - mechanism_details: >-
      Automatic oscillometric blood pressure devices, used across sites: OMRON HEM 907XL, Medline
      MDS4001 Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series vital signs
      monitor with FlexiPort reusable cuff. Systolic and diastolic blood pressure and heart rate
      were measured twice, separated by two minutes.
  - mechanism_details: >-
      Venous blood collection (approximately 53 mL, non-fasting) into EDTA, serum separator, CPT
      mononuclear cell preparation and PAXgene RNA vacutainers, plus a urine collection kit, with
      local processing of plasma, serum and buffy coats on the day of collection under standardised
      operating procedures. Complete blood counts were run at CLIA-certified local laboratories;
      other assays were batch-shipped on dry ice, approximately quarterly, to the University of
      Washington Nutrition and Obesity Research Center.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Period of data collection covered by version 3.0.0 of the dataset, as recorded in the
      FAIRhub dataset description ("2023-07-19/2025-05-01", dateType Collected) and repeated in the
      README and healthsheet.
  - start_date: '2023-07-18'
    end_date: '2023-11-30'
    timeframe_details: >-
      Preliminary pilot enrolment period, run to secure sufficient familiarity with the protocol
      for all coordinators; the formal data collection process began on 1 December 2023. Data from
      the pilot period formed version 1.0.0 of the dataset, released in May 2024.
  - timeframe_details: >-
      Planned overall enrolment window for the study, extending beyond the collection period
      covered by this release: enrolment began on 18 July 2023 and, according to the BMJ Open
      protocol, will continue until 30 November 2026, with participants recruited in waves whose
      composition and size are influenced by the observed participation characteristics of
      race/ethnicity, gender, T2DM severity and site. The FAIRhub study description gives an
      anticipated study completion date of 1 January 2027 and an overall status of "Enrolling by
      invitation". No end date is asserted in the structured fields here because these are planned
      future dates for the study rather than collection boundaries of this release.

data_collectors:
  - role: Clinical research coordinators and research assistants at the three data collection sites
    collector_details: >-
      Recruited, consented and enrolled participants, conducted the study visit including
      ophthalmic imaging, trained participants on the take-home devices, and ensured return of all
      study materials. All research personnel who recruited, enrolled and collected data underwent
      training by the data manager at the University of Alabama at Birmingham and worked from a
      detailed Manual of Procedures. A certification process was required of all coordinators,
      including mandatory institutional compliance training for human subject research and the
      successful administration of all protocol elements to at least three volunteer practice
      subjects to the standards set out in the Manual of Procedures.
  - role: Site data managers
    collector_details: >-
      Oversaw the data collection process at each site, reviewed REDCap range-check reports with
      the coordinators, and were responsible for the quality control of all data before uploading
      to FAIRhub.
  - role: Retinal imaging technicians
    collector_details: >-
      Acquired the retinal imaging protocol on both eyes of each participant under dilated
      conditions (except the Optomed Aurora) and were trained to detect potentially life- or
      vision-threatening conditions (retinal detachment, tumour and optic disc oedema) for
      immediate referral.
  - role: Phlebotomists and laboratory assistants
    collector_details: >-
      Collected blood and urine specimens and processed and shipped samples; local processing of
      plasma, serum and buffy coats was performed at each data site on the day of collection.
  - role: Central project team, software and cloud engineers, and data scientists
    collector_details: >-
      Ingested data into the REDCap database, ran the curation pipelines, mapped data to
      standardised terminologies, and designed, implemented, tested and deployed the FAIRhub
      platform and its cloud infrastructure.
    notes: >-
      Effort of the team was supported by NIH award OT2OD032644 based on percentage of effort
      contributed, with salaries aligned to the funding guidelines at each site.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      The study base is all patients aged 40 years or older who had a medical encounter within
      each health system site (University of Alabama at Birmingham, University of California San
      Diego, University of Washington). Patients with T2DM and pre-diabetes were identified by
      screening electronic health records for ICD-10 diagnosis codes; patients without diabetes
      have no encounters with these codes.
    strategies: >-
      Non-probability sampling, triple-balanced by design: participants are recruited in
      approximately equal proportions across four self-reported race/ethnicity groups (Asian,
      Black, Hispanic, white), four categories of T2DM presence and severity (no diabetes;
      pre-diabetes or lifestyle-controlled diabetes; diabetes treated with oral or non-insulin
      injectable medications; insulin-controlled diabetes), and biological sex, rather than
      targeting the demographic distribution of the US population, because balanced datasets are
      critical for developing unbiased machine learning models.

      Recruitment proceeds in waves to allow efficient sampling of the study base; the
      composition and size of each wave are influenced by the observed participation
      characteristics of race/ethnicity, gender, T2DM severity and site, and the composition of
      enrolled participants is monitored and adjusted by under- and oversampling groups as needed.

      All study groups are recruited at every site to capture diversity, but the proportion of
      each group varies with the demographic prevalence of that group in the site's geographical
      area; sites were chosen for geographic spread and for representation of specific racial and
      ethnic groups.

      For each wave, a contact pool is identified by EHR screening at each site; individuals are
      mailed a hardcopy invitation letter and sent an invitation email, both personalised with
      links, access codes and QR codes directing them to an online REDCap recruitment interface
      where they can read a study overview, download the informed consent document, request a
      call back, complete a screening survey and enroll by signing the electronic consent.
    representative_verification:
      - >-
        No verification of representativeness was performed. The healthsheet states that the
        dataset contains all possible instances, that is, all participants enrolled during the
        covered collection period, and answers "N/A" to the question about sampling strategy for a
        sample of a larger set.
    why_not_representative: >-
      The cohort is intentionally balanced rather than population-representative. Participants are
      volunteers, so volunteer bias limits generalisability to those not represented in the study
      population. Recruitment is predominantly urban and hospital-based and may not fully capture
      diverse cultural and socioeconomic backgrounds; the cohort does not include other races and
      ethnicities such as Pacific Islanders and Native Americans; and participants must speak, read
      and understand English. Because enrolment is ongoing, the pilot release and periodic updates
      may not have achieved balanced distribution across groups.

instances:
  - instance_type: >-
      Individual human participant. Each instance comprises all data available for one person
      enrolled in the AI-READI study, spanning survey, clinical, retinal imaging, ECG,
      environmental sensor, continuous glucose monitoring and wearable activity monitor
      modalities, in tabular, imaging and physiological signal/waveform form. No unstructured text
      data are included.
    counts: 2280
    label: false
    label_description: >-
      No explicit label or target is associated with each data instance and no labelling of any
      kind was performed: the dataset is deliberately hypothesis agnostic and is intended to
      facilitate multiple potential downstream AI/ML applications. There is consequently no gold
      standard label, no proxy label, no human annotation, no inter-annotator agreement and no
      published guideline for future researchers creating new labels or defining new tasks.
    notes: >-
      No `data_substrate` or `data_topic` term is asserted at this level because the instance is a
      person rather than a topic-homogeneous or substrate-homogeneous artefact; per-directory
      substrate and topic terms are given on the sibling instance entries below, which correspond to
      the nine data-type directories of the release.
  - instance_type: 12-lead electrocardiogram recording, held in the cardiac_ecg directory
    counts: 4515
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:10
    notes: >-
      Electrocardiogram data collected by a 12 lead protocol (the current standard), Holter monitor,
      or smartwatch; in this release, 12-lead ECG acquired on the Philips PageWriter TC30. Organised
      as modality ecg_12lead, device philips_tc30, with a manifest.tsv metadata file. The count is
      the number of files in the directory, not a number of participants.
  - instance_type: >-
      OMOP CDM clinical observation and measurement record, held in the clinical_data directory
      and covering blood and urine laboratory values, physical and vision assessments,
      monofilament testing, cognitive testing and survey responses
    counts: 7
    data_substrate: B2AI_SUBSTRATE:6
    data_topic: B2AI_TOPIC:4
    notes: >-
      Clinical data collected through REDCap. Each CSV file in this directory is a one-to-one
      mapping to the OMOP CDM tables. A dqd_omop.json file supports data quality analysis with the
      OMOP CDM Data Quality Dashboard, which runs more than 3,500 data quality checks against an
      OMOP CDM instance. The count is the number of files in the directory.
  - instance_type: >-
      Ten-day indoor environmental sensor time series per participant, held in the environment
      directory
    counts: 2232
    data_substrate: B2AI_SUBSTRATE:69
    data_topic: B2AI_TOPIC:11
    notes: >-
      Data collected through the environmental sensor device custom built for the AI-READI project.
      Organised as modality environmental_sensor, device leelab_anura, with a manifest.tsv metadata
      file and pointers to the component datasheets (ams-OSRAM AS7431, DS3231 precision RTC,
      Sensirion SEN5x, Sensirion NOx Index). The count is the number of files in the directory.
  - instance_type: >-
      Macula-centred fluorescence lifetime imaging ophthalmoscopy acquisition per eye and spectral
      channel, held in the retinal_flio directory
    counts: 7969
    data_substrate: B2AI_SUBSTRATE:66
    data_topic: B2AI_TOPIC:24
    notes: >-
      Organised as modality flio, device heidelberg_flio, with a manifest.tsv metadata file. Each eye
      yields two .dcm files, one for the short (498-560 nm) and one for the long (560-720 nm)
      wavelength channel; each pixel contains a photon arrival curve following a Poisson
      distribution. The count is the number of files in the directory.
  - instance_type: >-
      Structural optical coherence tomography volume or scan, held in the retinal_oct directory
    counts: 56478
    data_substrate: B2AI_SUBSTRATE:67
    data_topic: B2AI_TOPIC:24
    notes: >-
      Organised as modality structural_oct with device subdirectories heidelberg_spectralis,
      topcon_maestro2, topcon_triton and zeiss_cirrus, plus a manifest.tsv metadata file. The count
      is the number of files in the directory.
  - instance_type: >-
      Optical coherence tomography angiography en face image, flow cube or segmentation heightmap,
      held in the retinal_octa directory
    counts: 173721
    data_substrate: B2AI_SUBSTRATE:68
    data_topic: B2AI_TOPIC:24
    notes: >-
      Organised into three modalities: enface (2D C-scan views of the retinal layers), flow_cube (3D
      blood flow information) and segmentation (heightmaps with associated layer information), each
      with device subdirectories heidelberg_spectralis, topcon_maestro2, topcon_triton and
      zeiss_cirrus, plus a manifest.tsv metadata file. The count is the number of files in the
      directory.
  - instance_type: >-
      Retinal photograph (colour fundus, autofluorescence or near-infrared reflectance), held in
      the retinal_photography directory
    counts: 93921
    data_substrate: B2AI_SUBSTRATE:65
    data_topic: B2AI_TOPIC:24
    notes: >-
      Organised into three modalities: cfp (colour fundus photography, devices icare_eidon,
      optomed_aurora, topcon_maestro2, topcon_triton), faf (fundus autofluorescence, device
      icare_eidon) and ir (near-infrared reflectance, devices heidelberg_spectralis, icare_eidon,
      topcon_maestro2, zeiss_cirrus), plus a manifest.tsv metadata file. The count is the number of
      files in the directory.
  - instance_type: >-
      Ten-day wearable activity and physiology time series per participant and modality (heart
      rate, oxygen saturation, physical activity, calorie expenditure, respiratory rate, sleep and
      stress), held in the wearable_activity_monitor directory
    counts: 15245
    data_substrate: B2AI_SUBSTRATE:73
    data_topic: B2AI_TOPIC:39
    notes: >-
      Each of the seven modality directories contains the device subdirectory garmin_vivosmart5;
      a manifest.tsv metadata file is provided for the data type. The count is the number of files
      in the directory.
  - instance_type: >-
      Ten-day continuous glucose monitoring time series per participant, held in the
      wearable_blood_glucose directory
    counts: 2246
    data_substrate: B2AI_SUBSTRATE:78
    data_topic: B2AI_TOPIC:38
    notes: >-
      Organised as modality continuous_glucose_monitoring, device dexcom_g6, plus a manifest.tsv
      metadata file. Readings are captured every five minutes over a ten-day wear period. The count
      is the number of files in the directory.

