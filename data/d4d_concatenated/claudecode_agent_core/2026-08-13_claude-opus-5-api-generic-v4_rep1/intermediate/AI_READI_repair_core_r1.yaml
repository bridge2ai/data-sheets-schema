id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Release 3.0.0 of the flagship dataset of the Artificial Intelligence Ready and Equitable
  (also given as Exploratory) Atlas for Diabetes Insights (AI-READI) project, one of four Data
  Generation Projects of the NIH Common Fund Bridge2AI program. It is a multimodal,
  cross-sectional dataset of 2,280 adults aged 40 and older with and without type 2 diabetes
  mellitus (T2DM), harmonised across three United States data collection sites (University of
  Alabama at Birmingham, University of California San Diego, and University of Washington) and
  collected between 19 July 2023 and 1 May 2025. Recruitment sampling aimed at an approximately
  equal distribution of participants across four diabetes severity groups (no diabetes;
  pre-diabetes or lifestyle-controlled diabetes; diabetes controlled by oral or non-insulin
  injectable medication; insulin-controlled diabetes), self-reported race/ethnicity (Asian,
  Black, Hispanic, white) and biological sex. Each participant completed a single visit of
  approximately 2.5-4 hours comprising pre-visit self-report questionnaires (including
  depression, diabetes distress, diabetes self-care, diet, smoking and substance use, general
  health, social determinants of health, ophthalmic and medication surveys), on-site physical
  measurements and vitals, a 12-lead electrocardiogram, monofilament testing for peripheral
  neuropathy, Montreal Cognitive Assessment, photopic and mesopic visual acuity and contrast
  sensitivity, autorefraction, retinal imaging on multiple devices (colour fundus photography,
  fundus autofluorescence, near-infrared reflectance, optical coherence tomography, optical
  coherence tomography angiography and fluorescence lifetime imaging ophthalmoscopy), and
  non-fasting blood and urine collection for clinical laboratory testing and biobanking. A
  10-day post-visit at-home monitoring period used a Dexcom G6 continuous glucose monitor, a
  Garmin Vivosmart 5 activity tracker and a custom-built LeeLab Anura indoor environmental
  sensor. The release comprises 356,343 files totalling approximately 3.82 TB, organised
  according to the Clinical Dataset Structure specification into nine data-type directories with
  per-modality and per-device subdirectories and one folder per participant. The dataset is
  described by the project as "AI-ready": data are mapped to community standards (OMOP Common
  Data Model, DICOM, WFDB, Open mHealth, NASA ESDS ASCII guidelines) so that they can be used for
  AI/ML research without further reformatting. The public release contains no protected health
  information and omits sex, race/ethnicity and medication information; a controlled-access
  version, requiring a data use agreement, additionally holds 5-digit zip code, sex, race,
  ethnicity, genetic sequencing data, past health records, medications, and traffic and accident
  reports. No labels or targets are provided; the dataset is deliberately hypothesis agnostic.
  A recommended train/validation/test split of the 2,280 participants in 70/15/15 proportions
  (1,576 train, 352 validation, 352 test) is supplied in participants.tsv, with the validation and
  test sets balanced as well as possible for sex, race/ethnicity and diabetes status; mean age is
  61.1 +/- 11.3 years in the training set, 60.3 +/- 10.8 in validation, 60.5 +/- 11.4 in test and
  60.8 +/- 11.3 overall.
