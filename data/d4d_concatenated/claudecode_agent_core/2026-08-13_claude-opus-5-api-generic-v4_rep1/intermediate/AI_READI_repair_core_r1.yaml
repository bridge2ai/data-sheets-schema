purposes:
  - response: >-
      To collect and publicly share a multimodal, AI-ready dataset for studying the pathogenesis
      and salutogenesis (the pathway from disease to health) of type 2 diabetes mellitus, so that
      AI and machine learning approaches can be applied to a complex, multifactorial and
      multisystemic disease.
  - response: >-
      To create a flagship ethically-sourced dataset that is well-defined, trustworthy and
      publicly available, enabling future generations of AI/ML research to provide critical
      insights into T2DM, including salutogenic pathways to return to health.
  - response: >-
      To develop a foundational dataset in T2DM that is agnostic to existing classification
      criteria or biases and can be used to reconstruct a temporal atlas of T2DM development and
      reversal towards health. Data collection was specifically designed to permit downstream
      pseudo-time manifold analysis, an approach used to predict disease trajectories by learning
      from complex multimodal data from participants of differing disease severity.
  - response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data for AI/ML purposes, including guidance from bioethicists and adherence to
      the Findable, Accessible, Interoperable and Reusable (FAIR) principles, so that AI-READI can
      serve as a model and blueprint for future efforts to develop other medical/health datasets
      targeted for AI/ML.
  - response: >-
      To create a model for developing large scalable datasets and to increase access to and
      quality of AI/ML research by recruiting and training personnel, stated as specific aims 2
      and 3 of the funded NIH project.

addressing_gaps:
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large and inclusive
      multimodal datasets that capture molecular, physiological, pathological and clinical
      information at various stages of illness.
  - response: >-
      A major barrier to AI in healthcare research has been the lack of diverse datasets that are
      AI ready for training AI models; the AI-READI dataset is intended to fill this gap by
      providing data that are off-the-shelf ready for AI-based analysis without reformatting and
      preprocessing.
  - response: >-
      Existing large datasets for AI/ML training are demographically limited. A meta-epidemiological
      review of T2DM studies published from 2000 to 2020 indicated that samples lacked racial and
      ethnic diversity, while the prevalence and deleterious consequences of T2DM are higher in
      certain racial and ethnic populations. The cohort is therefore designed to be balanced in
      race/ethnicity, T2DM severity and biological sex rather than to mirror the demographic
      distribution of the US population.
  - response: >-
      The acquisition protocol spans multiple domains (survey, physical measurements, clinical,
      imaging, wearable device data) in order to enable downstream AI/ML analyses that may not be
      feasible with existing data sources such as claims or electronic health records data.

tasks:
  - response: >-
      Downstream pseudo-time manifold analysis: predicting disease trajectories by collecting and
      learning from complex, multimodal data from participants with differing disease severity,
      from normal to insulin-dependent T2DM, in order to reconstruct a temporal atlas of T2DM
      development and reversal towards health.
  - response: >-
      Development of multimodal AI/ML models of type 2 diabetes mellitus and its complications,
      including definition of disease trajectories and underlying genetic links in different
      racial and ethnic cohorts.
  - response: >-
      Research into salutogenesis in T2DM, that is, the pathway from disease back to health, which
      is stated as the central scientific goal the dataset is meant to support.

