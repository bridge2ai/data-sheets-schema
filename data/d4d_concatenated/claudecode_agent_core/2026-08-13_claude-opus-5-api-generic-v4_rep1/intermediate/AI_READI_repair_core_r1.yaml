subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Self-reported race and ethnicity, collected in the screening questionnaire. This variable is
      held under controlled access and is not released in the public version of the dataset;
      counts are nevertheless published in the split table of the dataset README.
    distribution: >-
      Of 2,280 participants: Hispanic 380, Asian 545, Black 519, white 836. The study-wide target
      is approximately 1,000 participants from each of these four groups.
  - subpopulation_elements_present: true
    identification: >-
      Biological sex, collected in the screening questionnaire; gender identification is collected
      separately in the demographic questionnaire. Sex is held under controlled access and is not
      released in the public version of the dataset.
    distribution: >-
      Of 2,280 participants: 951 male, 1,329 female. The design target is an equal balance of
      biological males and females.
  - subpopulation_elements_present: true
    identification: >-
      Diabetes presence and severity group, assigned from the screening questionnaire on diabetes
      health status and treatment (lifestyle, medications).
    distribution: >-
      Of 2,280 participants: 776 with no diabetes, 560 pre-diabetes or lifestyle controlled, 686
      oral or non-insulin injectable medication controlled, 258 insulin controlled. These four
      groups correspond to the four study arms defined in the protocol, each with a study-wide
      target of approximately 1,000 participants.
  - subpopulation_elements_present: true
    identification: >-
      Age, derived from date of birth collected in the demographic questionnaire. Eligibility
      requires an age of 40 years or older.
    distribution: >-
      Mean age of the 2,280 participants is 60.8 +/- 11.3 years.
    source_caveats: >-
      The healthsheet section on demographic information answers "No" to the question of whether
      the dataset identifies any demographic sub-populations, which is inconsistent with the
      race/ethnicity, sex, diabetes status and age distributions published in the README split
      table for the same release.

anomalies:
  - anomaly_details: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements. In a few cases the data collection device had no stored
      results or was returned too late to retrieve the results, for example because the battery
      died or data were lost. In a few cases there may have been a data collision at some point in
      the process and data have been lost.
  - anomaly_details: >-
      In survey data, skipped questions and incomplete responses are expected.
  - anomaly_details: >-
      In wearable device data, improper use and technical failure such as battery failure or
      system malfunction are expected. The Garmin Vivosmart 5 battery had to be charged every two
      to three days, producing gaps in collection.
  - anomaly_details: >-
      In imaging data, participant uncooperation, noise that may obscure the images, technical
      failure such as system malfunction, and data transfer failures are expected.
  - anomaly_details: >-
      Optomed Aurora fundus images are acquired undilated with a handheld camera, so image quality
      varies from participant to participant and within the same participant. Heidelberg Spectralis
      imaging is operator-dependent and not fully automated, so quality issues may lead to the
      modality being skipped and data missing. FLIO is performed last in the visit after prolonged
      light exposure, so participants may not be at their best possible compliance.
  - anomaly_details: >-
      The Snellen visual acuity variables present in the previous version of the dataset were
      dropped in version 3.0.0, so only logMAR visual acuity measurements are available.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, therefore there is selection bias known as volunteer bias, which
      may limit the generalisability of results to those not represented in the study population.
      Recruitment is further restricted to patients who had a medical encounter within one of the
      three health systems and were identified through electronic health record screening.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of the composition of enrolled participants and
      adjustment by under- and oversampling groups as needed; personalised invitation letters and
      emails, telephone follow-up, and offers of transportation assistance to reduce participation
      barriers.
  - bias_type: sampling_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across race/ethnicity,
      biological sex, and diabetes presence and severity, the pilot study and the interim releases
      are not balanced across these parameters, and periodic updates to data releases may not have
      achieved balanced distribution across groups because enrolment is ongoing.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites, and the study
      sites were selected to ensure equitable representation and minimise the potential for
      sampling bias. A recommended data split balanced as far as possible for sex, race/ethnicity
      and diabetes status is supplied with the release.
    affected_subsets:
      - >-
        All released versions to date, including this one; the design target of approximately 1,000
        participants per race/ethnicity group and per diabetes severity group is not yet met.
  - bias_type: representation_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based, which may not fully capture diverse
      cultural and socioeconomic backgrounds. The study cohort does not provide a comprehensive
      representation of the population as it does not include other races and ethnicities such as
      Pacific Islanders and Native Americans. Requiring that eligible participants speak, read and
      understand English may have created challenges in recruiting Hispanic and Asian persons.
    mitigation_strategy: >-
      Three geographically dispersed recording sites were strategically selected to achieve diverse
      recruitment, and individuals from all demographic backgrounds were recruited at all three
      sites. Through engagement with the Native Biodata Consortium the project pursues a
      co-learning opportunity for understanding challenges specific to American Indian and Alaska
      Native communities, and the funded project includes a tribal consultation aimed at collecting
      similar data within a Native American cohort.
  - bias_type: selection_bias
    bias_description: >-
      It is a well-documented observation in health research that recruiting Black men into studies
      is more difficult than recruiting other populations, and factors such as medical mistrust and
      fear of safety stemming from historical events such as the Tuskegee syphilis study contribute
      to this; the same trends of under-recruitment have been reported for Hispanic and Asian
      persons, while these populations carry a disproportionate burden of T2DM.
    mitigation_strategy: >-
      Tailored printed materials and a personalised, participatory approach to recruitment;
      commitment to implement new recruitment strategies if sample balancing on race/ethnicity
      emerges as a challenge; a Community Advisory Board of 11 persons from the three sites,
      including diversity in race and ethnicity as represented in the AI-READI sample, contributes
      to development of the protocol.
  - bias_type: measurement_bias
    bias_description: >-
      Multiple different imaging devices are used for overlapping measures, and device- and
      operator-dependent differences in acquisition (for example fully automated versus
      operator-driven imaging, dilated versus undilated photography) affect the resulting data.
    mitigation_strategy: >-
      Information on device make and model, including specific modalities such as macula scans or
      wide scans during OCT, was documented to ensure repeatability, and multiple devices for one
      measure were deliberately included to enhance generalisability and represent the diverse
      range of equipment used in clinical settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population: it is
      urban and hospital-based, English-speaking, aged 40 and over, and excludes several
      racial/ethnic groups.
    scope_impact: >-
      Limits generalisation of models derived from the dataset to populations not represented in
      the cohort.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The public release excludes protected health information and additionally omits sex,
      race/ethnicity and medication information; 5-digit zip code, genetic sequencing data, past
      health records and traffic and accident reports are held only under controlled access.
    recommended_mitigation: >-
      Investigators requiring these variables must enter into a data use agreement for the
      controlled-access version of the dataset.
    scope_impact: >-
      Fairness analyses stratified by sex or race/ethnicity cannot be performed on the public
      release; the project supplies a recommended split balanced on these attributes instead.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The dataset is cross-sectional with only one visit per participant in this release, so
      disease trajectories must be inferred across participants of differing severity rather than
      observed within participants. Longitudinal follow-up of approximately 10 percent of the
      cohort is planned for year 4 of the project but is not included here.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets, gold standards or predefined tasks are provided, and there are no formal
      guidelines for researchers creating new labels or defining new tasks; human-level performance
      benchmarks for the applications the dataset is meant to address are not available.
  - limitation_type: scope_limitation
    limitation_description: >-
      A limitation of the associated biorepository is that there is a finite number of samples to
      share with scientists interested in using them in research; procedures for reviewing and
      prioritising written requests were still to be developed at the time of the protocol
      publication, and biospecimens are not part of this data release.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet states that the dataset contains no data that, if viewed directly, might be
      offensive, insulting, threatening, or otherwise pose any safety risk such as psychological
      safety or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential and that no personally identifiable information is included. The RO-Crate
      records a confidentiality level of "HL7:2N (normal)".

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public version of the dataset does not contain data considered sensitive: it contains no
      protected health information, and information related to the sex and race/ethnicity of the
      participants and the medications used has been removed.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled-access version of the dataset contains sensitive elements: 5-digit zip code,
      sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic
      and motor vehicle accident reports. Access to these requires a data use agreement and is
      restricted to scientists whose institutions have completed legal and privacy use agreements
      with the AI-READI research programme.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Removal of Protected Health Information as defined by the HIPAA Privacy Rule using the Safe
    Harbor method, plus removal of sex, race/ethnicity and medication information from the public
    set.
  identifiers_removed: >-
    All Protected Health Information as defined by the HIPAA Privacy Rule (Safe Harbor), together
    with information related to the sex and race/ethnicity of the participants and the medications
    used. Directories and files are keyed by study participant ID number rather than by any direct
    identifier.
  deidentification_details: >-
    The public set is stripped of Protected Health Information as defined by the HIPAA Privacy Rule
    via the Safe Harbor method, as well as information related to the sex and race/ethnicity of the
    participants, to prevent stigmatisation of findings. The FAIRhub dataset description records a
    de-identification level of "NoDeIdentification" with direct identifiers and HIPAA flags set,
    explained as: no identifiers were collected so no active de-identification was necessary, but the
    team checked that no identifiable data per US HIPAA were present in the data. Free-text fields in
    the raw data may accidentally contain personal health or personally identifiable information,
    which is one reason raw data are not shared.
  source_caveats: >-
    The two accounts of de-identification differ in kind: the Nature Metabolism comment describes
    active stripping of PHI by Safe Harbor, while the FAIRhub structured metadata asserts that no
    identifiers were collected and no active de-identification was necessary. The healthsheet
    questions that ask directly about de-identification measures (composition question 13 and
    preprocessing question 1) are left blank.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the time of data entry and acquisition: clinical data outside expected
      minimum/maximum ranges were flagged in REDCap and appeared in reports viewed by clinical
      research coordinators and data managers. Using these reports as guides, data managers and
      coordinators examined participant records and determined whether an error was likely. Data
      were checked for credibility based on range checks, incorrect flow through prescribed skip
      patterns, missing data that could be directly filled from other portions of an individual's
      record, and the omission or duplication of records.
  - cleaning_details: >-
      Editing was done only under the guidance and approval of the site principal investigator. If
      corrected data were available elsewhere in the respondent's answers, the error was corrected;
      if there was no logical or appropriate way to correct the data, the site principal
      investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      The data manager at each data site was responsible for the quality control of all data before
      uploading to FAIRhub. The dataset has not undergone any formal external audit, but has been
      reviewed internally by AI-READI team members for quality checks and to ensure that no
      personally identifiable information was accidentally included.

preprocessing_strategies:
  - preprocessing_details: >-
      Mapping of all data to applicable standardised terminologies and data standards where
      possible: the Observational Medical Outcomes Partnership Common Data Model for clinical data,
      with each CSV file mapping one-to-one to an OMOP CDM table; DICOM for retinal imaging; WFDB
      for electrocardiography; Open mHealth for continuous glucose monitoring and wearable activity
      data; and the NASA ESDS ASCII file format guidelines for environmental sensor data.
  - preprocessing_details: >-
      Conversion of proprietary device exports into standard formats before upload: Topcon Maestro2
      and Triton images exported as .fda and converted to DICOM, Heidelberg FLIO images exported as
      .sdt and converted to DICOM, Garmin Vivosmart 5 data exported as .FIT and converted to the
      Open mHealth standard, and ECG exported as .xml.
  - preprocessing_details: >-
      Organisation of the release according to the Clinical Dataset Structure v0.1.1: one directory
      per datatype at the root, one folder per modality within each datatype, one folder per device
      within each modality, and one folder per participant within each device folder, named with
      the participant's study ID; a manifest.tsv metadata file is provided in each datatype
      directory and CDS metadata files are provided at the root.
  - preprocessing_details: >-
      Removal from the public release of protected health information and of sex, race/ethnicity
      and medication information, and preparation of a recommended train/validation/test split
      recorded in participants.tsv.
  - preprocessing_details: >-
      Static watermarking of the data to identify the licensee for security purposes, applied to
      both public and controlled sets as part of the project's re-identification prevention
      measures; licensees agree to take no action to remove, obscure, alter or mask the watermark.
  - preprocessing_details: >-
      Processing approach has changed across releases: version 1.0.0 (pilot) used custom, ad hoc
      processing, while the year 2 and year 3 data included in versions 2.0.0 and 3.0.0 were
      processed with a combination of automated pipelines and custom steps.

raw_sources:
  - raw_data_details: >-
      Device-native and platform-native raw exports produced at the data collection sites before
      standardisation: ECG in .xml, MoCA Duo application output (total score, section subscores,
      Memory Index Score and task completion times) in .csv, retinal imaging in device-native
      formats including .fda and .sdt as well as DICOM, Garmin activity data in .FIT, Dexcom CGM
      data in .csv, environmental sensor data in .csv, and blood and urine testing results from the
      NORC laboratory in .csv. REDCap held questionnaire and clinical entry data.
  - raw_data_details: >-
      The raw data are saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but are not anticipated to be shared outside the project team,
      because they have not been mapped to standardised terminologies and may accidentally include
      personal health information or personally identifiable information, for example in free text
      fields. There is a possibility that raw data may be included in future releases of the
      controlled-access dataset.

raw_data_sources:
  - source_description: >-
      REDCap electronic data capture database holding participant-reported questionnaire responses
      and clinical data entered during the visit (medications assessment, vitals, visual acuity,
      contrast sensitivity, monofilament results, complete blood count results).
    source_type: Study electronic data capture system
    raw_data_format: REDCap records exported to delimited text
    access_details: >-
      Not released as raw data; released after mapping to the OMOP Common Data Model in the
      clinical_data directory. The exact forms used for data collection in REDCap are published in
      the dataset documentation.
  - source_description: >-
      Retinal imaging devices at the three sites: Optomed Aurora IQ, iCare EIDON, Heidelberg
      Spectralis HRA OCT/OCTA, Heidelberg FLIO, Topcon Maestro2 3D OCT-1, Topcon Triton DRI OCT and
      Zeiss Cirrus 5000 Angioplex.
    source_type: Clinical imaging devices
    raw_data_format: DICOM natively, or .fda (Topcon) and .sdt (FLIO) converted to DICOM
    access_details: >-
      Released in DICOM in the retinal_photography, retinal_oct, retinal_octa and retinal_flio
      directories.
  - source_description: >-
      At-home monitoring devices issued to each participant for ten days: Dexcom G6 continuous
      glucose monitor, Garmin Vivosmart 5 activity tracker and the custom LeeLab Anura environmental
      sensor.
    source_type: Wearable and home sensor devices
    raw_data_format: .csv (Dexcom, environmental sensor) and .FIT (Garmin)
    access_details: >-
      Released after conversion in the wearable_blood_glucose, wearable_activity_monitor and
      environment directories.
  - source_description: >-
      Clinical laboratory results from CLIA-certified laboratories local to each data collection
      site (complete blood count on fresh whole blood) and from the University of Washington
      Nutrition and Obesity Research Center testing facility (all other blood and urine assays,
      performed on stored frozen samples).
    source_type: Clinical laboratories
    raw_data_format: .csv
    access_details: Released within the OMOP-formatted clinical_data directory.
  - source_description: >-
      Electronic health records of the three health systems, used to screen for eligible patients
      by ICD-10 diagnosis code and demographics, and as the source of past health records and
      medication history.
    source_type: Health system electronic health records
    access_details: >-
      Not part of the public release; past health records and medications are held under controlled
      access.
  - source_description: >-
      State driving and motor vehicle accident records for the three years preceding the visit,
      obtained under the IRB protocol.
    source_type: Government licensing authority records
    access_details: Held under controlled access; not part of the public release.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; a participant may have complete data
      for some data types and none for others.

      Incomplete or skipped items within survey instruments.

      Gaps within the ten-day wearable monitoring series, including gaps caused by charging the
      Garmin device every two to three days.
    missing_data_causes: >-
      Participants elected not to participate in some study elements.

      The data collection device had no stored results, or was returned too late to retrieve the
      results, for example because the battery died or the data were lost.

      A data collision at some point in the process resulted in loss of data.

      Improper use of wearables, technical failure or system malfunction.

      Imaging modalities skipped because of participant uncooperation, operator-dependent quality
      problems, system malfunction or data transfer failure.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either as an electronic signature in REDCap before the
      visit or in person at the start of the visit. Informed consent was required before
      participation in any part of the protocol, including questionnaires, and was provided by all
      participants; those without internet access could call research staff for alternative methods
      of enrolment. Individuals identified through electronic health record screening were notified
      by a personalised hardcopy invitation letter and an invitation email directing them via links,
      access codes and QR codes to the online REDCap recruitment interface, where they could read a
      study overview and frequently asked questions, download the informed consent document, request
      a call back from study staff, complete a screening survey and enroll. Letters were produced and
      mailed through Adapt Inc., an SSAE16 SOC security-certified and HIPAA-compliant printing and
      fulfilment service. This was active data collection directly from participants rather than
      passive collection or secondary use, so each individual was aware of the data collection.
    consent_documentation: >-
      The University of Washington approved consent form under IRB protocol STUDY00016228
      (AI-READI Consent Form Standard, modified 17 May 2023) is published in the version 3
      dataset documentation; the same form, with minor institution-specific language, was used at
      the relying sites, the University of California San Diego version additionally including the
      State of California Bill of Rights.
    consent_scope: >-
      Participation in the single study visit and the ten-day at-home monitoring period; placement
      of de-identified data in an open-source repository; biobanking of blood derivatives for
      future proteomics, metabolomics, genomics, gene expression and immunological studies and the
      generation of induced pluripotent stem cells. The FAIRhub dataset description records the
      consent type as "ConsentSpecifiedNotElsewhereCategorised" with the explanation that the public
      version of the dataset can only be used for type 2 diabetes related research while a private
      version will allow for more generic use, and with no non-commercial, geographic,
      research-type, genetic-only or methods-development restrictions flagged.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation;
      any data that had been shared or used up to that point would stay in the dataset, and this
      limitation is clearly communicated in the consent document. No mechanism is described for
      retracting data already released in a published version of the dataset.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted. The healthsheet states this explicitly
      in response to the question of whether an analysis of the potential impact of the dataset and
      its use on data subjects has been carried out.

ethical_reviews:
  - reviewing_organization: >-
      University of Washington Institutional Review Board (Human Subjects Division), with reliance
      agreements with the Institutional Review Boards of the University of Alabama at Birmingham
      and the University of California San Diego.
    review_details: >-
      The study was approved under IRB protocol number STUDY00016228. Initial approval at the
      University of Washington was received on 20 December 2022 and the initial approval letter is
      published with the dataset documentation. An annual renewal application to the IRB about the
      status and progress of the study is required and is due within 90 days of expiration. The
      FAIRhub study description records the human subject review status as "Submitted, approved",
      no FDA-regulated drug or device, and no Data Monitoring Committee. The IRB Reliance Team
      contact given in the RO-Crate is hsdrely@uw.edu, Human Subjects Division, University of
      Washington, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, US.
  - reviewing_organization: AI-READI ethics, legal and social implications team
    review_details: >-
      The RO-Crate metadata names Camille Nebeker, Debra Mathews, Kadija Ferryman and Nicholas
      Evans under ethical review. Ethical, legal and social implications are considered at every
      stage of the project cycle, the project sought guidance from bioethicists in establishing
      standards for collection, preparation and sharing of the data, and interns have been involved
      in developing healthsheets to describe the data and in analysing equity and ethical issues.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      A Community Advisory Board of 11 persons drawn from the three sites, including diversity in
      race and ethnicity as represented in the AI-READI sample, contributes to the development of
      the protocol. The IRB protocol records that the Board evaluates the consent forms and research
      protocols and that its feedback is considered in modifications, and that the Board's feedback
      led the team to conclude that enrolling non-English-speaking participants would require
      translation of all study materials, not only the consent form.
  - reviewing_organization: Native Biodata Consortium
    review_details: >-
      Through engagement with the Native Biodata Consortium the project pursues a co-learning
      opportunity for understanding challenges specific to American Indian and Alaska Native
      communities and evaluating tools for addressing them, such as data usage agreements, contract
      negotiations, transparent access agreements and forms of assured return of benefit and
      sustainable input, control and monitoring of Tribal data. The funded project also includes a
      tribal consultation to address barriers and facilitators of participation.
    source_caveats: >-
      The RO-Crate names the reviewing IRB "Washington University IRB" while giving a University of
      Washington IRB Reliance Team contact and a University of Washington Human Subjects Division
      postal address.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      University of Washington IRB protocol STUDY00016228; initial approval 20 December 2022; annual
      renewal required within 90 days of expiration. The BMJ Open protocol publication cites the same
      number as a ClinicalTrials approval number, and the study is separately registered as
      NCT06002048 on ClinicalTrials.gov.
  ethics_review_board: >-
    Institutional Review Board of the University of Washington, with reliance agreements with the
    IRBs of the University of Alabama at Birmingham and the University of California San Diego.
  regulatory_compliance: >-
    The study is not FDA-regulated for either drug or device, and has no Data Monitoring Committee.
    The public release is HIPAA de-identified. Licensees must comply with the data security and
    privacy standards established by the US National Institutes of Health under its Genomic Data
    Sharing Policy. Data collection took place entirely in the USA.
  special_populations:
    - >-
      No protected or vulnerable population is targeted. Eligibility requires the ability to
      provide consent and an age of 40 years or older, so minors are not enrolled; pregnancy and
      gestational diabetes are exclusion criteria; type 1 diabetes is an exclusion criterion.
      Prisoners are not a target population.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      Eligibility criteria exclude the categories that would trigger additional protections:
      participants must be able to provide consent and be 40 years of age or older, and must not be
      pregnant or have gestational diabetes.
    - >-
      Devices sent home with participants were specifically chosen with participant privacy as a
      primary concern: the environmental sensor and the fitness tracker do not capture video or
      audio, are not equipped with GPS location monitoring, and are not synced with
      participant-owned devices.

intended_uses:
  - use_category: AI and machine learning research on type 2 diabetes mellitus
    usage_notes: >-
      The dataset is intended for AI/ML research providing insights into T2DM and its salutogenic
      pathways, including downstream pseudo-time manifold analysis of disease trajectories and
      multimodal model development. Access to the public version requires agreeing to use the data
      only for type 2 diabetes related research.
  - use_category: Methodological blueprint for AI-ready dataset creation
    usage_notes: >-
      The dataset, its documentation, the Clinical Dataset Structure specification and the FAIRhub
      platform are intended to serve as a model for future data generation projects that wish to
      manage and share AI-ready clinical research datasets, with guidelines published through the
      project's Zenodo community, GitHub organisation and website.
  - use_category: Training and workforce development
    usage_notes: >-
      The project hosts a year-long research internship programme, run through the University of
      California San Diego Shiley Eye Institute, comprising a two-week data science and programming
      bootcamp followed by a year of didactic lectures and mentored research. Interns are involved in
      developing healthsheets describing the AI-READI data, mapping project data into common data
      models, and analysing equity and ethical issues; the inaugural 2023-2024 cohort of 10 interns
      was 70 percent women, 30 percent Black and 50 percent from backgrounds under-represented by
      NIH criteria.

other_tasks:
  - task_details: >-
      Because the dataset is hypothesis agnostic and was assembled from assessments across many
      health domains without predefined tasks or labels, it may support analyses beyond the
      salutogenesis research it was designed for. The FAIRhub consent metadata notes that while the
      public version can only be used for type 2 diabetes related research, a private version will
      allow for more generic use.

discouraged_uses:
  - discouragement_details: >-
      Analyses that assume the released cohort is balanced across race/ethnicity, biological sex and
      diabetes severity are discouraged: enrolment is ongoing and the pilot release and periodic
      updates to data releases may not have achieved balanced distribution across groups.
  - discouragement_details: >-
      Use of the dataset as a representation of the general population is discouraged, since the
      cohort is urban and hospital-based, English-speaking, aged 40 and over, and does not include
      groups such as Pacific Islanders and Native Americans.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited by section 4.A of the
      licence, as the data are intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or with other information, to compromise or infringe
      the confidentiality of information about a data subject, to invade or compromise the privacy of
      any data subject, to attempt to identify or contact any data subject or group of data subjects,
      to extract or extrapolate identifying information, to establish a data subject's membership in
      a particular group of persons, or otherwise to cause harm or injury to any data subject, is
      prohibited by section 4.B of the licence.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for training or
      development purposes, where training includes model weight modification and other adjustments
      to a model's logic or operation, is prohibited by section 3.C of the licence even if the vendor
      is party to a Business Associate Agreement with the licensee's institution. Short-term
      interaction such as prompting or querying a third-party model under a BAA is permitted.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or otherwise
      conveying any portion of the data or any derivative work to any third party other than another
      licensee bound by an identical agreement is prohibited by section 3.A of the licence. Derivative
      data, including synthetic data generated from the data, is treated as data for this purpose.
  - prohibition_reason: >-
      Reproducing data in papers, articles, presentations, analyses, reports or publications beyond
      small representative samples in up to five images or figures per paper for illustrative
      purposes is prohibited by section 3.F of the licence, and larger amounts of data may not be
      published, posted or made available via supplemental files, zip archives, code packages or
      other means, notwithstanding journal or conference requirements.
  - prohibition_reason: >-
      Storing the data anywhere other than on servers and devices maintained by and located within
      the licensee's institution, or on cloud or remote storage and backup services covered by a
      HIPAA-approved Business Associate Agreement with that institution, is prohibited by section
      3.B of the licence.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking applied to the data for
      security purposes is prohibited by section 6 of the licence.
  - prohibition_reason: >-
      Use of the public version of the dataset for research unrelated to type 2 diabetes is outside
      the scope of the access attestation, which requires agreeing to use the data only for type 2
      diabetes related research.

future_use_impacts:
  - impact_details: >-
      To the extent of the creators' knowledge, no uses of the dataset are currently anticipated that
      could result in unfair treatment of individuals or groups or other undesirable harms; however,
      there is a theoretical risk of future re-identification.
  - impact_details: >-
      AI algorithms can infer individual patient characteristics and could facilitate individual-level
      identification. To prevent re-identification attempts the project implements a robust data
      dissemination system, a strict licence agreement and data watermarking for both the public and
      the controlled sets.
  - impact_details: >-
      Information related to the sex and race/ethnicity of participants was removed from the public
      set to prevent stigmatisation of findings; users of the public set therefore cannot condition
      analyses on these attributes and are directed instead to the supplied recommended split, which
      was constructed to reduce disparities in models developed using the dataset.
  - impact_details: >-
      American Indian and Alaska Native people are unique and highly identifiable groups that could
      benefit from precision health AI studies; the project is evaluating tools such as data usage
      agreements, contract negotiations, transparent access agreements and forms of assured return of
      benefit and sustainable Tribal input, control and monitoring for any future collection with
      these communities.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    notes: >-
      Used for all retinal imaging directories (retinal_photography, retinal_oct, retinal_octa,
      retinal_flio).
  - format: Comma-separated values
    media_type: text/csv
    notes: >-
      Used for the OMOP CDM clinical data tables and for converted wearable and environmental sensor
      records; tab-separated manifest.tsv and participants.tsv files are also present.
  - format: JSON
    media_type: application/json
    notes: >-
      Used for the CDS metadata files (dataset_description.json, dataset_structure_description.json,
      study_description.json, participants.json) and for the OMOP data quality dashboard output
      (dqd_omop.json).
  - format: Markdown
    media_type: text/markdown
    notes: Used for README.md, CHANGELOG.md and healthsheet.md at the dataset root.

distributions:
  - path: cardiac_ecg
    bytes: 302931703
    conforms_to: >-
      Clinical Dataset Structure (CDS) v0.1.1 for organisation; WaveForm DataBase (WFDB) for the
      data files.
    conforms_to_standard:
      - CDS
      - WFDB
    notes: >-
      Electrocardiogram data collected by a 12 lead protocol (the current standard), Holter monitor,
      or smartwatch; in this release, 12-lead ECG acquired on the Philips PageWriter TC30. Organised
      as modality ecg_12lead, device philips_tc30, with a manifest.tsv metadata file. 4,515 files.
  - path: clinical_data
    bytes: 176182781
    format: CSV
    media_type: text/csv
    conforms_to: >-
      Clinical Dataset Structure (CDS) v0.1.1 for naming; Observational Medical Outcomes Partnership
      (OMOP) Common Data Model for the data files.
    conforms_to_standard:
      - CDS
      - OMOP_CDM
    notes: >-
      Clinical data collected through REDCap, including blood and urine lab values and survey data.
      Each CSV file in this directory is a one-to-one mapping to the OMOP CDM tables. A dqd_omop.json
      file supports data quality analysis with the OMOP CDM Data Quality Dashboard, which runs more
      than 3,500 data quality checks against an OMOP CDM instance. 7 files.
  - path: environment
    bytes: 55625676514
    conforms_to: >-
      Clinical Dataset Structure (CDS) v0.1.1 for organisation; NASA ASCII File Format Guidelines for
      Earth Science Data for the data files.
    conforms_to_standard:
      - CDS
      - ESDS
    notes: >-
      Data collected through the environmental sensor device custom built for the AI-READI project.
      Organised as modality environmental_sensor, device leelab_anura, with a manifest.tsv metadata
      file and pointers to the component datasheets (ams-OSRAM AS7431, DS3231 precision RTC,
      Sensirion SEN5x, Sensirion NOx Index). 2,232 files.
  - path: retinal_flio
    bytes: 1069466876718
    conforms_to: Clinical Dataset Structure (CDS) v0.1.1 for organisation; DICOM for the data files.
    conforms_to_standard:
      - CDS
      - DICOM
    notes: >-
      Data collected through fluorescence lifetime imaging ophthalmoscopy (FLIO), an imaging modality
      for in vivo measurement of lifetimes of endogenous retinal fluorophores. Organised as modality
      flio, device heidelberg_flio, with a manifest.tsv metadata file. Each eye yields two .dcm files,
      one for the short (498-560 nm) and one for the long (560-720 nm) wavelength channel; each pixel
      contains a photon arrival curve following a Poisson distribution. 7,969 files, media type
      application/dicom.
  - path: retinal_oct
    bytes: 1317625293027
    conforms_to: Clinical Dataset Structure (CDS) v0.1.1 for organisation; DICOM for the data files.
    conforms_to_standard:
      - CDS
      - DICOM
    notes: >-
      Data collected using optical coherence tomography (OCT), an imaging method using lasers that is
      used for mapping subsurface structure. Organised as modality structural_oct with device
      subdirectories heidelberg_spectralis, topcon_maestro2, topcon_triton and zeiss_cirrus, plus a
      manifest.tsv metadata file. 56,478 files, media type application/dicom.
  - path: retinal_octa
    bytes: 1155908809724
    conforms_to: Clinical Dataset Structure (CDS) v0.1.1 for organisation; DICOM for the data files.
    conforms_to_standard:
      - CDS
      - DICOM
    notes: >-
      Data collected using optical coherence tomography angiography (OCTA), a non-invasive imaging
      technique that generates volumetric angiography images. Organised into three modalities: enface
      (2D C-scan views of the retinal layers), flow_cube (3D blood flow information) and segmentation
      (heightmaps with associated layer information), each with device subdirectories
      heidelberg_spectralis, topcon_maestro2, topcon_triton and zeiss_cirrus, plus a manifest.tsv
      metadata file. 173,721 files, media type application/dicom.
  - path: retinal_photography
    bytes: 174381046406
    conforms_to: Clinical Dataset Structure (CDS) v0.1.1 for organisation; DICOM for the data files.
    conforms_to_standard:
      - CDS
      - DICOM
    notes: >-
      Two-dimensional retinal photography, also referred to as fundus photography. Organised into
      three modalities: cfp (colour fundus photography, devices icare_eidon, optomed_aurora,
      topcon_maestro2, topcon_triton), faf (fundus autofluorescence, device icare_eidon) and ir
      (near-infrared reflectance, devices heidelberg_spectralis, icare_eidon, topcon_maestro2,
      zeiss_cirrus), plus a manifest.tsv metadata file. 93,921 files, media type application/dicom.
  - path: wearable_activity_monitor
    bytes: 38313536220
    conforms_to: >-
      Clinical Dataset Structure (CDS) v0.1.1 for organisation; Open mHealth for the data files.
    conforms_to_standard:
      - CDS
      - OPEN_MHEALTH
    notes: >-
      Data collected through a wearable fitness tracker, organised into seven modalities (heart_rate,
      oxygen_saturation, physical_activity, physical_activity_calorie, respiratory_rate, sleep,
      stress), each with the device subdirectory garmin_vivosmart5, plus a manifest.tsv metadata
      file. 15,245 files.
  - path: wearable_blood_glucose
    bytes: 4169006971
    conforms_to: >-
      Clinical Dataset Structure (CDS) v0.1.1 for organisation; Open mHealth for the data files.
    conforms_to_standard:
      - CDS
      - OPEN_MHEALTH
    notes: >-
      Data collected through a continuous glucose monitoring device, organised as modality
      continuous_glucose_monitoring, device dexcom_g6, plus a manifest.tsv metadata file. Readings
      are captured every five minutes over a ten-day wear period. 2,246 files.
  - path: /
    conforms_to: Clinical Dataset Structure (CDS) v0.1.1
    conforms_to_standard:
      - CDS
    notes: >-
      Dataset-level metadata files required by the Clinical Dataset Structure specification:
      CHANGELOG.md, dataset_description.json, dataset_structure_description.json, healthsheet.md,
      LICENSE.txt, participants.json, participants.tsv, README.md and study_description.json. The
      participants.tsv file carries the recommended train/validation/test split. 9 files, mixed
      Markdown, JSON, TSV and plain text.
    source_caveats: >-
      No byte count is given for the root metadata files anywhere in the bundle, so `bytes` is
      omitted here although it is populated for every sibling distribution; the nine per-directory
      sizes reported by the FAIRhub API therefore do not sum exactly to the dataset total of
      3,815,969,779,678 bytes across 356,343 files.

distribution_dates:
  - release_dates:
      - Version 1.0.0 released 3 May 2024 (DOI 10.60775/fairhub.1), covering the pilot data collection phase.
      - Version 2.0.0 released 8 November 2024 (DOI 10.60775/fairhub.2), covering data collected through 31 July 2024.
      - Version 3.0.0 released 17 November 2025 (DOI 10.60775/fairhub.3), covering data collected 19 July 2023 to 1 May 2025.
    notes: >-
      New versions are planned approximately once a year; the BMJ Open protocol describes
      de-identified data as released approximately yearly in two datasets, a controlled-access set
      and a publicly accessible set with fewer requirements for access.

data_governance:
  committee_name: AI-READI Data Access Committee
  committee_contact: https://orcid.org/0000-0002-7452-1648
  accountable_organization:
    id: https://ror.org/01yc7t268
  access_review_process: >-
    Accessing the dataset requires logging in through a verified ID system, agreeing to use the data
    only for type 2 diabetes related research, and agreeing to the licence terms, which set
    restrictions and obligations for data usage; the FAIRhub access type is recorded as
    "PublicDownloadSelfAttestationRequired" and the access page is https://fairhub.io/datasets/3/access.
    The full dataset, containing the more sensitive variables, is accessible only by entering into a
    data use agreement and is available only to scientists whose institutions have completed legal and
    privacy use agreements with the AI-READI research programme. The BMJ Open protocol records that the
    requirements for the controlled-access datasets were being developed by the Data Access Committee.
    Biobanked specimens will eventually be available to scientists according to procedures and policies
    that were still in development, and the protocol notes that procedures for reviewing and
    prioritising written requests will be developed before the biorepository is complete.
  stewardship_roles:
    - The AI-READI team supports and maintains the dataset; it is hosted on FAIRhub through Microsoft Azure.
    - >-
      The data manager at each data collection site is responsible for the quality control of all data
      before uploading it to FAIRhub.
    - >-
      The RO-Crate names the AI-READI Consortium as the data governance committee and Washington
      University in St. Louis as the managing organisation and licensor; the central contact is
      contact@aireadi.org and enquiries are directed to https://aireadi.org/contact.
  notes: >-
    The dataset is described as governed by a broader project framework that treats making data
    AI-ready as having two components, technical (the FAIR principles, standards and the Clinical
    Dataset Structure) and ethical (consideration of ethical, legal and social implications at every
    stage of the project cycle, including documentation approaches such as datasheets and healthsheets).

license_and_use_terms:
  data_use_permission: disease_specific_research
  contact_person: https://orcid.org/0000-0002-7452-1648
  license_terms: >-
    The AI-READI Data License Agreement version 2.0 (Washington University in St. Louis as Licensor,
    https://doi.org/10.5281/zenodo.17555036) is a custom licence tailored to enable reuse of the
    dataset for commercial or research purposes while imposing strong requirements around data usage,
    security and secondary sharing to protect study participants, especially when data are reused for
    AI and ML applications. It grants a non-exclusive, non-transferable licence to download, reproduce
    and use the data and to create derivative works of it for research, commercial and non-commercial
    purposes. A licensee may enter the agreement as an individual or on behalf of an officially
    recognised Authorized Group within an institution, in which case Authorized Users are members of
    that group by contract, employment or student status, their rights terminate automatically when
    that relationship ends, and the licensee is fully liable for their acts and omissions. Key
    obligations: sharing only with other licensees bound by identical terms; storage only on
    institution-maintained systems or BAA-covered cloud services; no sharing with third-party model
    vendors for training, though BAA-covered models may be used for short-term querying; models
    trained on the data may be distributed provided they do not contain the data and reasonable
    efforts are made to prevent memorisation or reconstruction; derivative and synthetic data are
    treated as data; publication of data limited to small representative samples in up to five images
    or figures per paper; acknowledgement of the licensor, source and funder in any papers, citing as
    directed at docs.aireadi.org; compliance with NIH Genomic Data Sharing Policy security best
    practices; no interference with watermarking. Termination is automatic on any breach, requiring
    deletion of all copies. Title and all intellectual property rights remain with the licensor. The
    data are provided "as is" with no warranty, the licensor's aggregate liability is capped at one US
    dollar except where law prohibits limitation for death or personal injury caused by negligence, and
    the licensee indemnifies the licensor against claims arising from its use of the data or from any
    model. The agreement is governed in English, may be amended only in writing signed by both parties
    subject to the licensor's right to update its security policies, and binds successors and permitted
    assigns.
  notes: >-
    An earlier statement of licence terms for reusing the AI-READI dataset was published as Contreras,
    J. et al., "License terms for reusing the AI-READI dataset", Zenodo,
    https://doi.org/10.5281/zenodo.10642459 (2024). The dataset documentation is shared separately
    under CC-BY 4.0. Use of the dataset requires citation of the resources specified at
    https://docs.aireadi.org; the recommended citation is: AI-READI Consortium. (2025). Flagship
    Dataset of Type 2 Diabetes from the AI-READI Project (3.0.0) [Data set]. FAIRhub.
    https://doi.org/10.60775/fairhub.3
  source_caveats: >-
    The FAIRhub landing page labels the licence simply "Health Data License" while the structured
    metadata names it "AI-READI custom license v2.0" and points to the Zenodo record. The single
    `data_use_permission` value recorded here reflects the access attestation, which limits the public
    set to type 2 diabetes related research; the licence text itself grants use for research,
    commercial and non-commercial purposes, and the FAIRhub consent metadata sets consentNoncommercial
    and consentResearchType to false, so no one enumerated permission captures both instruments.

ip_restrictions:
  restrictions:
    - >-
      Title to the data and all industrial and intellectual property rights in it remain at all times
      solely and exclusively with the licensor and its suppliers, and any rights not expressly granted
      are reserved.
    - >-
      Licensee models, meaning models, algorithms and programs developed, trained or adapted using the
      data but which do not themselves contain the data or a modified version of it, may be made,
      reproduced and distributed, provided the licensee first undertakes all reasonable efforts to
      minimise the likelihood that data can be memorised, derived, reconstructed or reconstituted
      through the use or construction of such models.
    - >-
      Derivative data, meaning data that has been modified, excerpted, encrypted, condensed, encoded,
      translated or otherwise altered such that it contains data or data may be derived from it,
      including synthetic data created using the data, is considered data and is subject to all
      restrictions in the licence.
    - >-
      Publishers and conference organisers wishing to reproduce more than the permitted five images or
      figures must obtain a separate licence from the licensor.
    - >-
      The healthsheet states that no third parties have imposed intellectual-property-based or other
      restrictions on the data beyond the licence.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      Licensees must comply with all data security and privacy standards established by the US National
      Institutes of Health under its Genomic Data Sharing Policy, currently the NIH Security Best
      Practices for Controlled-Access Data Subject to the NIH GDS Policy.
    - >-
      Licensees must comply with all applicable laws, regulations and restrictions relating to the
      distribution and use of the data and of models trained on it.
  other_compliance: >-
    The healthsheet answers the questions about export controls and other regulatory restrictions by
    reference to the licence; no export-control regime such as ITAR or EAR is named, and no
    jurisdiction-specific regulation beyond HIPAA and the NIH GDS Policy is identified. The study is
    not FDA-regulated for drug or device. Data collection took place only in the USA.
  source_caveats: >-
    The confidentiality level recorded in the RO-Crate is "HL7:2N (normal)", which does not map
    directly onto the enumerated values here; "restricted" is an inference rather than a value stated
    in the bundle, used because access requires verified login, self-attestation and acceptance of
    licence terms, and because a more sensitive tier exists behind a data use agreement.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. Contact information is provided in the
      README file included with the dataset and at https://aireadi.org/contact and
      https://docs.aireadi.org/docs/3/contact; the central contact recorded in the study metadata is
      Aaron Lee, MD (contact@aireadi.org). The study_description.json and dataset_description.json
      metadata files included with the dataset carry additional information about the contact person
      or entity, authors and contributors.
  - role: other
    maintainer_details: >-
      The dataset is hosted on the FAIRhub platform, a cloud-based data management, curation and
      sharing platform developed for this project and running on Microsoft Azure. FAIRhub is intended
      to be made available to future Bridge2AI Data Generation Projects wishing to manage and share
      AI-ready clinical research datasets.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and existing versions are not updated to correct
    labelling errors, add instances or delete instances. Instead, new versions are released with
    additional instances as more study participants complete the study visit, approximately once a
    year, with changes documented in the CHANGELOG file included in the dataset and mirrored at
    docs.aireadi.org. Version 3.0.0 is the third release and is expected to be followed by further
    versions with larger numbers of participants as enrolment continues.

version_access:
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
    - >-
      Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants from the pilot data
      collection phase, more than 15 data types, custom/ad hoc processing; no longer accessible.
    - >-
      Version 2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants (204 pilot
      plus 863 from year 2), 2.01 TB and 165,051 files, one additional imaging device; no longer
      accessible.
    - >-
      Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants (adding
      1,213 from year 3), 3.82 TB and 356,343 files, three additional imaging devices; current version.
  version_details: >-
    Each version has its own DOI and its own documentation set at docs.aireadi.org, navigable through a
    version dropdown; documentation for versions 1, 2 and 3 remains published even though the data for
    versions 1.0.0 and 2.0.0 are no longer accessible on FAIRhub. Datasheets exist for the earlier
    versions at https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet. Data fields are largely stable across versions,
    the main change in version 3.0.0 being the removal of the Snellen visual acuity variables and the
    addition of a recommended train/validation/test split. A smaller "mini" version of version 3.0.0 is
    offered for pipeline development.

retention_limit:
  retention_period: No limit
  retention_details: >-
    There are no applicable limits on the retention of the data associated with the instances;
    participants were not told that their data would be retained for a fixed period and then deleted.
    Older versions of the dataset are not maintained as accessible downloads, since the project releases
    new static versions rather than updating existing ones.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend, augment, build on or contribute to the
    AI-READI dataset outside of those who are involved in the project. The project does publish its
    guidelines, code and specifications for reuse through its GitHub organisation, Zenodo community and
    the Clinical Dataset Structure specification, and anticipates making the FAIRhub platform available
    to other data generation projects.
  contribution_url: https://github.com/AI-READI

