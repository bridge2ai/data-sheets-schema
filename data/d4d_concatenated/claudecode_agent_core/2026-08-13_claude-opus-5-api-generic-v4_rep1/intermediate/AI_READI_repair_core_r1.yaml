conforms_to: >-
  The dataset is organised according to the Clinical Dataset Structure (CDS) v0.1.1
  (https://cds-specification.readthedocs.io/en/v0.1.1/), a specification developed by the project
  itself for structuring and describing clinical research datasets; CDS governs the
  datatype/modality/device/participant directory hierarchy and the root metadata files
  (CHANGELOG.md, dataset_description.json, dataset_structure_description.json, healthsheet.md,
  LICENSE.txt, participants.json, participants.tsv, README.md, study_description.json) and the
  per-directory manifest.tsv files. Within that structure, the cardiac_ecg files follow the
  WaveForm DataBase (WFDB) standard; clinical_data files follow the Observational Medical Outcomes
  Partnership (OMOP) Common Data Model, with each CSV mapping one-to-one to an OMOP CDM table;
  environment files follow the NASA ASCII File Format Guidelines for Earth Science Data (ESDS);
  retinal_flio, retinal_oct, retinal_octa and retinal_photography files follow Digital Imaging and
  Communications in Medicine (DICOM); and wearable_activity_monitor and wearable_blood_glucose
  files follow Open mHealth. The release is additionally packaged as an RO-Crate conforming to
  https://w3id.org/ro/crate/1.2-DRAFT and to the FAIRscape profile
  https://w3id.org/fairscape/profile/0.1, with one sub-crate per data type.
