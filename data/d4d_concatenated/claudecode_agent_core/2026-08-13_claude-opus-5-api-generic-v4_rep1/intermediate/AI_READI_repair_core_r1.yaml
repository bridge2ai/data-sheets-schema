notes: >-
  The following facts about the study and the release have no fitting structured slot in this class.
  Participants received a compensation of USD 200 for the study visit, paid through the NIH grant
  funding after the final data were received and the study devices returned, typically at least two
  weeks after the visit and not prorated, together with coverage of reasonable parking, public transit
  or rideshare costs; transportation assistance was offered to participants reporting barriers to
  reaching study visits, and the same compensation is to be given to participants invited back for the
  planned year-4 follow-up visit. Equipment was provided on favourable terms: Topcon Corporation,
  Optomed, iCare World and Carl Zeiss loaned imaging devices for research purposes at no cost, and
  Heidelberg Engineering, Dexcom and Garmin provided research discounts on study devices. All instances
  are part of the same prospective cross-sectional data generation project with one visit per
  participant, and files from different modalities are related through the directory structure, each
  device directory containing one folder per participant named with the participant's study ID, with
  per-datatype manifest.tsv files and the root participants.tsv linking participant IDs to files and to
  the recommended split. Data were collected directly from participants at the three recruiting sites
  through active prospective collection, while recruitment pools were identified indirectly by
  screening the electronic health records of the three health systems. Privacy protections beyond
  de-identification include a tiered dissemination system, static watermarking identifying the
  licensee, restriction of permitted storage locations to institution-maintained systems or BAA-covered
  cloud services, and access gated behind verified-ID login and self-attestation; no linkage to
  external identifiable datasets is provided in the public release. The project treats team science as
  an object of study in its own right, implementing strategies to understand the interaction patterns
  of its multi-team systems and disseminating those findings alongside the data.

source_caveats: >-
  This record describes version 3.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI
  Project, the release documented by the FAIRhub API record, the RO-Crate and the v3 documentation; the
  BMJ Open protocol and NIH RePORTER entry in the bundle describe the wider study that generates it, and
  facts drawn from them describe the study rather than this release. The bundle contains several
  disagreements. (1) Institutional attribution: the FAIRhub study metadata, the licence and the RO-Crate
  name Washington University in St. Louis (ROR 01yc7t268) as lead sponsor, licensor, managing
  organisation and affiliation of principal investigators Aaron Lee and Cecilia Lee, while NIH RePORTER
  records the awardee organisation as University of Washington, the BMJ Open protocol places Cecilia Lee
  and Julia Owen at the University of Washington, the Nature Metabolism author list places Aaron Lee,
  Cecilia Lee and Julia Owen at the University of Washington, and the RO-Crate itself describes the PI as
  "Aaron Lee, Department of Ophthalmology, University of Washington". The RO-Crate names the reviewing
  IRB "Washington University IRB" while giving a University of Washington contact address. (2) Project
  name: the acronym is expanded as "Artificial Intelligence Ready and Equitable Atlas for Diabetes
  Insights" in the BMJ Open and Nature Metabolism titles and as "Artificial Intelligence Ready and
  Exploratory Atlas for Diabetes Insights" in NIH RePORTER, the healthsheet, the README and the FAIRhub
  study title. (3) Target enrolment: BMJ Open, the Nature comment and the FAIRhub study description give
  4,000 participants; NIH RePORTER says "4,000+"; the IRB protocol form states 4,600 in one place and
  approximately 1,000 in each of four groups in another. (4) ICD-10 screening codes: the BMJ Open
  protocol states that "Patients with T2DM and pre-diabetes are identified by screening electronic health
  records for ICD-10 diagnosis codes R73.09 and E11.X, respectively", which appears to transpose the two
  codes. (5) EHR screening window: BMJ Open gives encounters between 2020 and 2025 while the healthsheet
  says encounters "within the past 2 years". (6) Collection start: FAIRhub records 2023-07-19 while BMJ
  Open states enrolment began 18 July 2023. (7) Age limits: BMJ Open and the healthsheet give inclusion as
  40 years or older with no upper bound, while the FAIRhub study description sets a maximum age of 85
  years and lists adults older than 85 as an exclusion, as does the IRB protocol. (8) Diabetes prevalence
  context: BMJ Open cites 10.5% of the world's adult population, the Nature comment >6% of the world's
  population. (9) De-identification, as recorded under is_deidentified. (10) The v3 documentation "About"
  page states that "This documentation is associated with v3.0 of the dataset, which contains data from
  the participants of the pilot study phase", which contradicts the README and healthsheet description of
  v3.0.0 as covering 2,280 participants through year 3; the sentence appears to be carried over unchanged
  from the v2 page. (11) The healthsheet versioning section describes v3.0.0 as covering data "up through
  the end of the second year of the study", while the CHANGELOG summary table presents v3.0.0 as the main
  study release adding 1,213 year-3 participants. (12) The healthsheet demographic section answers "No" to
  whether the dataset identifies demographic sub-populations, while the README publishes race/ethnicity and
  sex counts for the same release. (13) The FAIRhub landing page labels the licence "Health Data License"
  while the structured metadata names "AI-READI custom license v2.0". (14) The RO-Crate carries a
  copyright notice of 2026 and a "fairscapeVersion" of 1.2.1 for a dataset published 17 November 2025, and
  the retinal_octa sub-crate path is given with a Windows-style backslash separator. (15) Both fairhub.io
  and docs.aireadi.org display a banner stating that the repository is under review for potential
  modification in compliance with Administration directives, so linked resources may change. Counts,
  sizes, dates and directory structure in this record are taken from the FAIRhub API record for dataset 3
  and the README, which agree with each other. Two values in this record are inferences rather than
  statements in the bundle and are flagged at their slots:
  `regulatory_restrictions.confidentiality_level` and `license_and_use_terms.data_use_permission`.