id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI dataset is a multimodal, AI-ready dataset collected from individuals with and without
  type 2 diabetes mellitus (T2DM) and harmonized across three United States data collection sites
  (University of Alabama at Birmingham, University of California San Diego, and University of
  Washington). Version 3.0.0 contains data from 2,280 participants collected between 19 July 2023 and
  1 May 2025, comprising 356,343 files and approximately 3.82 TB. Modalities include survey and
  clinical data mapped to the OMOP Common Data Model, 12-lead electrocardiography, retinal
  photography, optical coherence tomography (OCT), OCT angiography (OCTA), fluorescence lifetime
  imaging ophthalmoscopy (FLIO), continuous glucose monitoring, wearable activity monitoring, and
  home environmental sensing. The dataset is organized following the Clinical Dataset Structure (CDS)
  v0.1.1 specification, with one directory per datatype, then modality, then device, then participant.
  No labels or annotations are provided: the dataset is deliberately hypothesis-agnostic and is
  intended to support downstream AI/ML analyses, including pseudo-time manifold analysis of the
  pathway from disease back to health (salutogenesis). The public release contains no protected health
  information; sex, race/ethnicity and medication information are withheld from the public version and
  released only under controlled access. Recruitment sampling procedures aimed at an approximately
  equal distribution of participants across diabetes severity, sex and race/ethnicity, but enrollment
  is ongoing and the released versions may not yet have achieved balanced distribution across groups.
