notes: >-
  The FAIRhub dataset pages and the AI-READI documentation site both carry the notice: "This
  repository is under review for potential modification in compliance with Administration directives."
  The FAIRhub platform is described on the version 2.0.0 page as currently in beta. Results are
  returned to participants: heart rate, blood pressure and visual acuity results on an exam card
  before leaving the visit; a Dexcom report of average glucose and Glucose Management Indicator by
  encrypted email after the 10-day monitoring period; and laboratory results with normative values by
  HIPAA-compliant encrypted email at the time of the yearly data release. Coordinators also alert
  participants to incidental findings requiring emergency or ophthalmic referral. A biorepository of
  plasma, serum, buffy coats, genomic DNA, PAXgene-stabilized RNA and peripheral blood mononuclear
  cells is maintained at the University of Alabama at Birmingham Center for Clinical and Translational
  Science; those biospecimens are not part of this dataset.

source_caveats: >-
  Conflicts and gaps across the bundle, in addition to those noted on individual slots. (1) Target
  enrollment: the tier-1 FAIRhub study metadata and the tier-3 BMJ Open protocol give an anticipated
  enrollment of 4,000, the tier-4 NIH RePORTER abstract says "4,000+ people", and the tier-2 IRB
  application text says 4,600; the tier-1 figure of 4,000 is used in prose here. (2) Coverage of
  version 3.0.0: the healthsheet describes it as containing data "up through the end of the second
  year of the study, i.e. between July 19, 2023 and May 1st, 2025", while the README changelog table
  attributes 1,213 additional participants to "year 3 data"; the date range is consistent across both
  and is what this record reports. (3) The healthsheet questions on de-identification measures, on
  preprocessing for de-identification, and on errata were returned blank in the released datasheet, so
  no values are recorded for them here. (4) The AI-READI project name is expanded as "Artificial
  Intelligence Ready and Equitable Atlas for Diabetes Insights" in the BMJ Open protocol and as
  "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights" in the FAIRhub
  healthsheet, README and NIH RePORTER record. (5) Version 1.0.0 is described in the tier-2 v2.0.0
  documentation page as containing pilot-phase data, and the same wording persists on the v3.0.0 page
  ("this documentation is associated with v3.0 of the dataset, which contains data from the
  participants of the pilot study phase"), which conflicts with the healthsheet and README accounts of
  v3.0.0 as covering two further years of enrollment; the healthsheet and README are followed here.