license_and_use_terms:
  license_terms: >-
    The dataset is released under a custom license, the AI-READI Data License Agreement v2.0
    (https://doi.org/10.5281/zenodo.17555036), issued by Washington University in St. Louis as
    Licensor. It grants a non-exclusive, non-transferable license to download, reproduce and use the
    data and to create derivative works for research, commercial and non-commercial purposes, subject
    to restrictions on sharing, storage, interaction with third-party models, publication of data, and
    security. The license terms were tailored to enable reuse of clinical datasets while imposing
    strong requirements around data usage, security and secondary sharing to protect study
    participants, especially where data is reused for AI and machine learning applications.
  data_use_permission: disease_specific_research
  notes: >-
    Access to the public version is conditioned on self-attestation that the data will be used only
    for type 2 diabetes related research; the FAIRhub consent metadata records that a private version
    will allow for more generic use.

ip_restrictions:
