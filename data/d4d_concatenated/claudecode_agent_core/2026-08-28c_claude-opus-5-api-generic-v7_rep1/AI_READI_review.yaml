notes: >-
  Pack lists no gaps. Chunk c023's agent_reason names FLIO/OCT/OCTA/photography but the span also opens the CGM subcrate (lines 6044-6116); nothing there is missing from the record, so the verdict stands.
  Entry-level receipts (slot-006, slot-024, slot-015) attest one field of an object; the counts and ids in those file_collections entries have no leaf receipt in the claim sidecar - a pattern worth a validator check (entry receipt whose snippet matches only the description leaf).
  slot-026's c027 receipt (line 7301, encrypted servers) is verbatim but bears on nothing in privacy_techniques; counted under supported because the other three receipts carry the value.
  slot-008: the BMJ sentence's 'respectively' pairs T2DM with R73.09 and pre-diabetes with E11.X; the record's glosses correct that from outside knowledge. Not counted as misread because the slot's question (source description) is answered.
  slot-042/slot-037: enum and vocabulary terms graded exempt_by_nature; if the reviewer protocol prefers such terms under not_in_bundle, two verdicts move.
