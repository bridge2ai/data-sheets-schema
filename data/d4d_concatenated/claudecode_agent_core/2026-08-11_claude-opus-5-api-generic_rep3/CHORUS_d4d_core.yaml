purposes:
  - response: >-
      To meet the need for infrastructure supporting artificial intelligence and machine learning in
      critical care by generating data for ML/AI applications aimed at characterizing acute and
      critical care illness, predicting complications, and measuring treatment response among patients
      with acute or critical illness.
  - response: >-
      To develop a publicly available, AI-ready critical care dataset while ensuring that the methods
      used promote privacy, accountability and clinical benefit.
  - response: >-
      To provision a holdout test set accessible for external validation of models, aiding marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      To develop the network, tools, standards, data and education needed to build ML/AI-derived models
      that improve the care and outcomes of patients requiring critical care, and to cultivate a new
      generation of AI clinicians and scientists.

addressing_gaps:
  - response: >-
      Developing high-resolution multi-center datasets is described as a critical first step towards
      actionable and trustworthy AI; the project addresses an urgent need for infrastructure to support
      AI/ML in critical care.
  - response: >-
      CHoRUS aims to acquire and standardize a dataset of unprecedented diversity and high resolution
      across multi-modal EHR, waveform, imaging and text data.
  - response: >-
      The absence of sequestered holdout data for external validation of clinical AI models is to be
      addressed by sequestering holdout datasets.
  - response: >-
      A legal framework for collecting data at scale, and community input on what data is appropriate
      for public sharing, are treated as gaps to be addressed through legal research and
      community-facing ethics focus groups.

tasks:
  - response: "Characterizing acute and critical care illness."
  - response: "Predicting complications among patients with acute or critical illness."
  - response: "Measuring treatment response in acute and critical care."
  - response: "External validation of AI/ML models against a sequestered holdout test set (planned)."

intended_uses:
  - use_category: "Biomedical and clinical AI/ML research on acute and critical care"
    examples:
      - "Development of machine learning and AI models to improve the care and outcomes of patients requiring critical care"
      - "Prediction of complications in critically ill patients"
      - "Measurement of treatment response"
      - "External validation of models using the holdout test set the project plans to provision"
    usage_notes: >-
      Access is controlled. In the AIM-AHEAD Bridge2AI for Clinical Care training pathway, participants
      complete a registration form giving name, email and institution, sign a licensing agreement, and
      are notified by email once access is granted and compute is provisioned; a ".edu" email address
      is required in that pathway, with program administrators assisting where needed.

existing_uses:
  - examples:
      - "Training activities and publications, as stated in the AIM-AHEAD cohort 2 webinar"
      - "The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, program period November 17 2025 to July 31 2026), in which up to 30 trainees use CHoRUS data on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud to create practical use cases"
      - "AI/ML for Clinical Care canonical Jupyter Notebooks used in that training program"
    source_caveats: >-
      The webinar states that datasets "are being used for training activities and publications" but
      names no specific publication; no bibliography or use registry is provided. Other curriculum
      elements (OHDSI tool stack and OMOP common data model workshops) are taught within the same
      program but are not stated to be built on this dataset.

other_tasks:
  - task_details: >-
      The NIH abstract states that data elements will feature appropriate contextual factors such as
      geographic distance to the nearest hospital, and lists social determinants of health among the
      data to be acquired, supporting analyses beyond bedside prediction.

future_use_impacts:
  - impact_details: >-
      The project anticipates that a sequestered holdout test set accessible for external validation
      will aid marketplace adoption of AI-developed models for implementation in acute and critical
      care, and that the dataset will catalyze the biomedical research and expertise necessary to
      promote the patient-focused deployment of AI. Patient-focused legal and ethical work is intended
      to determine approaches to manage privacy and bias while accounting for social determinants of
      health.

