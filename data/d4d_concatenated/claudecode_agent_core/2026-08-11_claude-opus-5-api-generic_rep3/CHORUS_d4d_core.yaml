id: https://chorus4ai.org/dataset
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset produced by one of four
  data generation projects in the NIH Common Fund Bridge2AI consortium. The CHoRUS Network spans 20
  academic centers, of which 14 will contribute as Data Acquisition centers, and comprises 60+
  consortium members across 20 different institutions. Its stated goal is to develop the most diverse,
  high-resolution, ethically sourced, AI-ready dataset to address the grand challenge of improving
  recovery from acute illness, covering patients with acute or critical illness. Data collection is
  retrospective and all listed data modalities are under controlled access. The dataset is multimodal:
  structured electronic health record data (demographics, medication administration with dosing
  time-stamped at each infusion change or dose administration, provider-documented procedures and
  diagnoses, and high-frequency nursing flowsheets) standardized to the OHDSI/OMOP Common Data Model;
  clinical notes extracted and tokenized with the OHNLP toolkit; imaging drawn from hospital PACS in
  DICOM; waveform telemetry from bedside monitors and gateway/middleware in WFDB; and hospital-database
  EEG waveforms in EDF+ and Persyst formats. The AIM-AHEAD cohort 2 webinar states that OMOP and
  telemetry data reside in the cloud enclave, whereas clinical notes are stored locally at contributing
  sites with only tokens held centrally. Social determinants of health, and contextual factors such as
  geographic distance to the nearest hospital, are also named as targets of the data acquisition
  effort. As reported on the project website, the currently released dataset comprises 50,000 patient
  admissions from ICU, PICU and NICU, 1.6 billion rows of EHR OMOP data, 7,642 admissions with
  radiology data and 23 Tb of waveform data; the anticipated final dataset is 100,000 patient
  admissions across 9 data modalities from 14 contributing hospitals. A holdout test set is to be
  sequestered and made accessible for external validation of models; its size, construction rule and
  access route are not specified in the available sources. The project is organized around three
  pillars — Data (standards, tool development and optimization, data acquisition), Ethics (ethical and
  trustworthy AI) and People (team science, skill and workforce development) — and develops
  open-source tooling, validated semantic mappings and standard operating procedures in the chorus-ai
  GitHub organization.
conforms_to: "OHDSI/OMOP Common Data Model, with modality-specific standards recorded per component in resources[].conforms_to (OHNLP, DICOM, WFDB, EDF+ and Persyst)"
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: CoreDataset
created_by: "CHoRUS Network / Bridge2AI CHoRUS data generation project"
status: active
page: https://chorus4ai.org/
license: "Repositories in the chorus-ai GitHub organization carry open-source licenses (the project README states the MIT License; individual repositories show MIT or Apache-2.0). Access to the dataset itself is not covered by these licenses and is governed by a separately signed licensing agreement."
was_derived_from: "Hospital electronic health record systems, PACS imaging archives, bedside telemetry monitors with gateway/middleware, and hospital EEG databases at data-contributing sites within the CHoRUS Network"
