    source_type: "Hospital electronic health record system"
    raw_data_format: "Site-native EHR extracts, transformed to the OMOP Common Data Model"
  - source_description: "Unstructured clinical notes from hospital EHR systems"
    source_type: "Hospital electronic health record system"
    raw_data_format: "Free text, extracted and tokenized with the OHNLP toolkit; source notes remain stored locally at sites"
  - source_description: "Hospital picture archiving and communication systems (PACS)"
    source_type: "Hospital PACS"
    raw_data_format: DICOM
  - source_description: "Bedside monitors, accessed via gateway/middleware"
    source_type: "Bedside monitors and gateway/middleware"
    raw_data_format: "Waveform telemetry, in WFDB"
  - source_description: "Hospital EEG database"
    source_type: "Hospital EEG database"
    raw_data_format: "EDF+ and Persyst"

raw_sources:
  - raw_data_details: >-
      Source clinical notes are retained locally at contributing sites; only tokenized representations
      are held centrally.

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of structured EHR data to the OMOP Common Data Model, supported by validated
      semantic mappings with documentation and pooled tabular mappings in the chorus-mapping repository
      and an associated clinical validation SOP.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured clinical notes using the OHNLP toolkit.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, and de-identification of
      imaging, which was in process for a larger cohort as of September 2025.
  - preprocessing_details: >-
      Conversion and preparation of waveform data, supported by waveform documentation and conversion
      scripts (chorus_waveform) and resources supporting the preparation and release of waveforms
      (chorus_waveform_resources).
  - preprocessing_details: >-
      Geocoding of OMOP Location entities via DeGauss, using open source code in the UF-Geocoding
      repository.
    source_caveats: >-
      The sources do not state what variables are derived from this geocoding; the NIH abstract's
      mention of geographic distance to the nearest hospital is not connected to DeGauss in any source.

cleaning_strategies:
  - cleaning_details: >-
      Data-contributing sites follow standard operating procedures that have undergone an internal
      validation and review process. Characterization reports are produced and returned to sites
      following their data submissions (CHoRUSReports repository), and site status tracking is used to
      identify and resolve blocking issues in extract creation and curation.
    source_caveats: >-
      The sources describe SOP guidance, characterization reporting and status tracking; they do not
      describe outlier removal, deduplication or error correction procedures.

labeling_strategies:
  - labeling_details: >-
      The GitHub README states that a visualization and annotation environment will label data with
      targets important for prediction, and the NIH abstract lists visualizing and labeling data among
      the capabilities to be developed across the multi-center network. Both statements are future
      tense.
    source_caveats: >-
      Annotator qualifications, annotation protocol, number of annotations per item and inter-annotator
      agreement are not reported in any source, and no source states that labeling has been performed.

machine_annotation_tools:
  - tools:
      - "OHNLP toolkit"
    tool_descriptions: >-
      Used to extract and tokenize unstructured clinical notes; an OHNLP open source schema is cited
      for the resulting data

missing_data_documentation:
  - missing_data_patterns: >-
      Modality coverage is uneven across the release: clinical notes are stored locally at sites with
      only tokens available centrally; imaging was limited to 1000 available images as of September
      2025 with de-identification in process for a larger cohort; and EEG extraction was in process at
      that time.
    handling_strategy: >-
      Remaining modalities are being extracted, de-identified and released incrementally toward the
      anticipated final dataset of 100,000 admissions across 9 modalities.
    source_caveats: >-
      Item-level missingness within OMOP tables, waveform gaps and note availability rates are not
      quantified in any source. The per-modality metadata availability column of the webinar table
      could not be read reliably and is not reported here.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Modality coverage is incomplete in the current release: imaging de-identification and EEG
      extraction were still in process as of September 2025, and full clinical note text is not
      centrally available — only OHNLP tokens.
    scope_impact: "Analyses requiring full-text notes, large imaging cohorts or EEG cannot yet be performed at full scale."
    recommended_mitigation: "Check current modality availability with the project before planning multimodal analyses."
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers admissions to intensive care settings (ICU, PICU, NICU) at hospitals within the
      CHoRUS Network; it is not a general-population or general-hospital dataset.
    scope_impact: "Findings may not transfer to non-critical-care populations or to care settings outside the contributing hospitals."
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Contributing sites are 14 hospitals within a collaboration spanning 20 academic centers. No
      representativeness assessment, demographic distribution or site-level distribution is published in
      the available sources, despite explicit project goals of diversity and balance.
    recommended_mitigation: "Treat cohort composition as unverified; examine site and demographic distributions before generalizing."
  - limitation_type: temporal_limitation
    limitation_description: >-
      Collection is retrospective and the release is a snapshot; the calendar period covered by the
      encounters is not stated, and the reported scale differs between the August 2025 webinar snapshot
      and the project website.
  - limitation_type: integration_limitation
    limitation_description: >-
      Data are distributed across heterogeneous standards (OMOP, OHNLP, DICOM, WFDB, EDF+/Persyst), and
      clinical notes are stored locally at sites rather than in the enclave that holds OMOP and
      telemetry data.
    source_caveats: >-
      No source describes how, or whether, the modalities are linked to one another.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Instances arise from patients admitted to critical care units at 14 hospitals contributing within
      a collaboration of 20 academic centers, rather than from a defined general population.
    mitigation_strategy: >-
      The GitHub README states that federated access will enable sampling methods to ensure a balanced
      and diverse cohort and that patient-focused efforts will determine the ethical and legal
      approaches to manage privacy and bias while accounting for Social Determinants of Health; the NIH
      abstract states that sampling will ensure comprehensive sets of patient conditions and clinical
      treatment strategies.
    source_caveats: >-
      No quantitative bias assessment, fairness audit or subgroup performance analysis is reported in
      any source. This entry records the structural source of bias implied by the stated site
      composition, not a measured effect or an established mechanism.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset derives from clinical records of critically ill patients and includes demographics,
      diagnoses, procedures, medication administration, nursing flowsheets, tokenized clinical note
      content, radiology images, physiologic and EEG waveforms, and social determinants of health, with
      contextual factors such as geographic distance to the nearest hospital named in the NIH abstract.
      All modalities listed in the webinar table are marked controlled access.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Clinical notes are stored locally at contributing sites and are not placed in the shared enclave;
      only tokens derived with the OHNLP toolkit are held centrally. All listed data modalities are
      under controlled access. The NIH abstract further states that the project will perform
      community-facing ethics focus groups to determine what data is appropriate for public sharing.

is_deidentified:
  identifiable_elements_present: true
  method: >-
    Tokenization of unstructured EHR text with the OHNLP toolkit; de-identification of imaging (in
    process as of September 2025); transformation of data using approaches that limit
    re-identification.
  deidentification_details: >-
    The NIH abstract states that data will be transformed using approaches that limit re-identification
    and that unstructured EHR data is tokenized. Clinical notes are extracted and tokenized with the
    OHNLP toolkit and their source text remains at contributing sites. For imaging, the September 2025
    webinar reports 1000 images currently available with de-identification in process for a larger
    cohort. The chorus-ai GitHub organization maintains a privacy scan tool for medical records
    (privacy_scan_tool) and a CTP-deid repository. Protection is additionally provided by controlled
    access within a cloud enclave with provisioned compute rather than open download, and by
    community-facing ethics focus groups intended to determine what data is appropriate for public
    sharing.
  source_caveats: >-
    No de-identification standard (for example HIPAA Safe Harbor or Expert Determination) is named, the
    specific identifiers removed are not enumerated, the mechanism by which tokenization protects note
    content is not described, and no residual re-identification risk assessment is reported. Imaging
    de-identification is described as in process rather than complete. No source describes whether or
    how records are linked across modalities.

ethical_reviews:
  - review_details: >-
      The project describes an Ethics pillar covering ethical and trustworthy AI. The NIH abstract
      states that the project will establish a legal framework for collecting data at scale and will
      perform community-facing ethics focus groups to determine what data is appropriate for public
      sharing. The project website states that the CHoRUS consortium evaluates community perspectives on
      clinical care AI to find ways to increase trustworthiness of provenance and privacy in AI, and
      that new approaches are being created as the existing legal and regulatory landscape is analyzed.
      Ethics of clinical AI is also taught within the associated AIM-AHEAD training program.
    source_caveats: >-
      This entry records ethics-related research and engagement activity described by the project. No
      institutional review board, ethics committee, protocol number, approval date, or formal data
      protection impact assessment is identified in any of the available sources, and no source states
      that an ethics review of this dataset has been conducted.

human_subject_research:
  notes: >-
    The dataset consists of retrospective clinical data from critically ill patients, including
    pediatric and neonatal intensive care admissions. The NIH abstract refers to acquiring an AI-ready
    data set from more than 100,000 critically ill patients; the project website gives an anticipated
    final figure of 100,000 patient admissions.
  source_caveats: >-
    No source characterizes CHoRUS as human subjects research or states a human-subjects determination,
    and no IRB approval, ethics review board, consent waiver, or regulatory compliance framework for the
    dataset is identified. The involves_human_subjects flag is therefore left unset rather than inferred.

at_risk_populations:
  at_risk_groups_included: true
  notes: >-
    At-risk groups included: pediatric patients (PICU admissions); neonates (NICU admissions).
  source_caveats: >-
    Special protections, guardian consent procedures and assent procedures for these groups are not
    described in any of the available sources. No source addresses the consent capacity of adult
    critical care patients, so no claim is made about it.

license_and_use_terms:
  license_terms: >-
    Access to the CHoRUS dataset is controlled. The access procedure documented in the sources is
    specific to the AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2): participants fill
    out a registration form with name, email and institution; all participants must sign a licensing
    agreement included in the registration form before gaining access to the dataset; once access is
    granted and compute is provisioned, an email is sent. In that program a ".edu" email address is
    required to gain access to the dataset, though this is stated not to be a barrier to acceptance and
    program administrators will assist with access if needed. Separately, the chorus-ai GitHub project
    code is open source under the MIT License, with individual repositories showing MIT or Apache-2.0.
  contact_person: "Jared Houghtaling (jared.houghtaling@tuftsmedicine.org)"
  notes: >-
    The GitHub README directs access requests to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
    Data are shared beyond the contributing institutions under controlled access, including with
    trainees of the AIM-AHEAD Bridge2AI for Clinical Care Training Program working on the Bridge2AI
    AI/ML for Clinical Care Collaborative Cloud. The NIH abstract additionally describes a planned
    holdout test set that will be accessible for model external validation, and states that the project
    will involve extensive collaboration between centers and with the NIH Bridge2AI program, the NIH
    Bridge2AI Bridge Center, external biomedical and clinical organizations, industry, and regulatory
    agencies.
  source_caveats: >-
    The full text of the dataset licensing agreement is not included in any source. The registration and
    ".edu" requirements are documented for the AIM-AHEAD training cohort only; general-purpose access
    terms outside that program are not stated beyond the two request-access addresses. Holdout-set
    access for external validation is described in the future tense and is not reported as currently
    operating.

ip_restrictions:
  restrictions:
    - >-
      Software produced by the project is open source (MIT License stated for the chorus-ai project,
      with Apache-2.0 on at least one repository); the dataset itself is not openly licensed and
      requires a signed licensing agreement and controlled-access provisioning.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions:
    - >-
      All listed data modalities — demographics, medication administration, procedures, nursing
      flowsheets, diagnoses, clinical notes, imaging, waveform telemetry and EEG — are marked as
      controlled access. Clinical notes are stored locally at contributing sites except for tokens.
  source_caveats: >-
    No explicit HIPAA, GDPR or export-control determination for this dataset is stated in the available
    sources; HIPAA and GDPR appear only as topics of a training-program workshop on IRB, data compliance
    and quality assurance, not as declarations about this dataset.

distribution_formats:
  - format: "OMOP Common Data Model tables"
    notes: >-
      Demographics, medication administration, procedures, nursing flowsheets and diagnoses; held in the
      cloud enclave under controlled access.
  - format: "OHNLP tokenized text"
    notes: >-
      Clinical notes extracted and tokenized with the OHNLP toolkit; source notes remain stored locally
      at contributing sites. OHNLP open source schema cited.
  - format: DICOM
    notes: "Imaging from hospital PACS; DICOM schema cited."
  - format: WFDB
    notes: "Waveform telemetry from bedside monitors and gateway/middleware; described as PhysioNet schema extended."
  - format: "EDF+ and Persyst"
    notes: "EEG waveforms from hospital databases; open source EDF+ and Persyst schemas cited."

maintainers:
  - maintainer_details: >-
      CHoRUS Network consortium. The project website lists Ciera McCrary, MGH, Program Manager, with
      contact address cmccrary@mgh.havard.edu. The GitHub README directs access requests and inquiries
      to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org, and lists the project website
      www.bridge2ai.org/chorus. The chorus-ai GitHub organization publishes package versions,
      maintainers and other package metadata on a package status page.
    role: academic_institution
    source_caveats: >-
      The program manager address is transcribed verbatim from the project website as
      cmccrary@mgh.havard.edu; the domain appears to contain a typographic error and should be verified
      before use. No source states which institution coordinates the consortium; Massachusetts General
      Hospital is named as the NIH awardee organization and as the program manager's institution.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    The chorus-ai GitHub organization (37 followers, 28 repositories, 3 projects) houses active
    repositories providing software and tooling to interact with and extract insight from clinical data
    in diverse formats, validated semantic mappings connecting clinical data in various source formats
    to international standards, standard operating protocols instructing data contributing sites about
    best practices for curating and delivering interoperable datasets, and project management overviews
    tracking data delivery statuses and task dependencies. Data site managers start from the Chorus_SOP
    interactive workflow diagram; issues can be posted in the Standards Discussions or Data Acquisition
    Discussions. Clinical collaborators can contribute to semantic mapping through the chorus-mapping
    repository and its clinical validation SOP. Sites submit status updates via the GitHub interface or
    a Google Form connected to the GitHub API by a GoogleScript, feeding the Standards Project or Data
    Acquisition Project boards. Software contributors are supported by a web guide compiled in the
    chorus-developer repository and a package status page. Named repositories include
    chorus-container-apps (dockerized container applications supporting CHoRUS services on Azure),
    Chorus_SOP, chorus_waveform and chorus_waveform_resources, chorus-extract-upload, CHoRUSReports,
    privacy_scan_tool, CTP-deid, UF-Geocoding, CADA, data_acq_SOP, cloud_public and
    chorus-apps-internal.

updates:
  update_details: >-
    The dataset is described as expanding from the current release toward an anticipated final dataset
    of 100,000 patient admissions across 9 data modalities from 14 contributing hospitals. Imaging
    de-identification for a larger cohort and EEG extraction were in process as of September 2025.
  source_caveats: >-
    No release cadence, versioning policy or scheduled update dates are stated. The GitHub organization
    page captured on 2025-11-14 shows relative repository update times (for example "Updated 11 hours
    ago", "Updated yesterday"); this is an observation about the page capture, not a statement about
    dataset updates.

external_resources:
  - external_resources:
      - https://chorus4ai.org/
      - https://github.com/chorus-ai
      - www.bridge2ai.org/chorus
      - https://reporter.nih.gov/project-details/10472824
      - https://www.aim-ahead.net/media/jnzdnid3/bridge2ai-for-clinical-care-informational-webinar-cohort-2.pdf
    notes: >-
      chorus4ai.org is the project website carrying the dataset snapshot, project components and contact
      details; github.com/chorus-ai is the CHoRUS for Equitable AI GitHub organization;
      www.bridge2ai.org/chorus is listed as the project website in the GitHub README;
      reporter.nih.gov/project-details/10472824 is the NIH RePORTER record for OT2OD032701; the
      aim-ahead.net PDF is the AIM-AHEAD Bridge2AI for Clinical Care Training Program Cohort 2
      informational webinar of 2025-09-09.
    restrictions:
      - >-
        The project website (chorus4ai.org) carries a notice that the repository is under review for
        potential modification in compliance with Administration directives.
    source_caveats: >-
      No archival guarantees or persistent identifiers are stated for any of these resources.