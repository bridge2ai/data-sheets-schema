acquisition_methods:
  - acquisition_details: >-
      Retrospective collection of data generated in the course of clinical care at data-contributing
      sites. The NIH abstract states that the project will develop capabilities across a multi-center
      network to acquire, standardize, tokenize, store, visualize and label data such as structured
      electronic health record data, tokenized unstructured electronic health record data, telemetry
      and EEG waveforms, imaging, and social determinants of health, and will acquire data, standardize
      it to the OMOP Common Data Model, and transform it using approaches that limit re-identification.
      Sites are directed to standard operating procedures for creating and submitting a CHoRUS Data
      Extract.
    source_caveats: >-
      The abstract describes these capabilities as project objectives rather than as a documented
      per-extract pipeline, and does not state which modalities are drawn from which of the 14
      contributing hospitals.

collection_mechanisms:
  - mechanism_details: >-
      Site-side extraction and upload tooling (the chorus-extract-upload repository provides tools to
      create and upload a CHoRUS Data Extract); the OHNLP toolkit for extracting and tokenizing clinical
      notes; and dockerized container applications with associated configurations deployed to support
      CHoRUS services on Azure. Imaging is stated to come from PACS, telemetry from bedside monitors via
      gateway/middleware, and EEG from a hospital database.
    source_caveats: >-
      For imaging, telemetry and EEG the sources identify the originating system but describe no export
      mechanism or tooling.

data_collectors:
  - collector_details: >-
      Data site managers at the Data Acquisition centers, drawn from the 20 academic centers of the
      CHoRUS Network of which 14 will contribute data. The Chorus_SOP page is the starting reference
      for these managers and provides an interactive workflow diagram describing the step-by-step
      process for extracting and contributing clinical data, with links to SOP documents that have
      undergone an internal validation and review process. Clinical collaborators contribute to
      semantic mapping and validation under an associated clinical validation SOP. Sites provide
      regular status updates through the GitHub interface or a Google Form, which are routed into the
      Standards Project or the Data Acquisition Project boards.

collection_timeframes:
  - timeframe_details: >-
      Retrospective collection; the calendar interval of the clinical encounters included is not stated
      in any source. Dataset scale is reported as of August 2025 (14 different hospitals, over 45K
      unique admissions). The funded project period runs 2022-09-01 to 2026-11-30.

sampling_strategies:
  - strategies: >-
      Planned: sampling to ensure comprehensive sets of patient conditions and clinical treatment
      strategies (NIH abstract, stated as a project objective). Planned: federated access to enable
      sampling methods that ensure a balanced and diverse cohort (GitHub README, stated in future
      tense).
    source_caveats: >-
      Both strategies are stated as intentions rather than as implemented procedures. Inclusion and
      exclusion criteria, per-site quotas and the definition of a balanced cohort are not specified,
      and no verification of representativeness is reported.

raw_data_sources:
