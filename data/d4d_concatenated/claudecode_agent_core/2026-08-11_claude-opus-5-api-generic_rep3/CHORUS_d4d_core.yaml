notes: >-
  The project website carries the following notice, transcribed verbatim including its apparent
  typographic error: "This repoitory is under review for potential modification in compliance with
  Administration directives." No single tabular/non-tabular classification is asserted for this
  dataset: its largest declared component is 1.6 billion rows of OMOP tables, while imaging, telemetry
  and EEG components are not tabular.

source_caveats: >-
  Values are drawn from four sources that describe the dataset at different moments and disagree on
  scale. The AIM-AHEAD cohort 2 webinar (September 2025) states that as of August 2025 the dataset
  covers 14 different hospitals with "over 45K unique admissions"; the project website reports a
  current released dataset of 50,000 patient admissions. Both figures are retained where relevant
  rather than reconciled. The NIH abstract refers to "more than 100,000 critically ill patients" while
  the website gives an anticipated final figure of 100,000 patient admissions; patients and admissions
  are different units and are not equated here. The webinar's modality table was extracted from a PDF
  with column ordering scrambled; the mapping of modality to data standard and the statement that all
  modalities are controlled access are legible, but the per-modality assignment of the
  "Metadata: Yes/Planned" column cannot be reconstructed reliably and is therefore not asserted. Many
  capability statements in the NIH abstract and GitHub README are future tense ("will provision",
  "will label", "will enable"); these are recorded as planned rather than as implemented. The NIH
  RePORTER abstract contains transcription artifacts ("CPatient-Focused", "label data for ;", "AI
  literacy nd utilization"). The NIH award amount is given as 5880300 with no currency stated. No DOI,
  formal citation, dataset version identifier, release date or publication list is present in any
  source.

