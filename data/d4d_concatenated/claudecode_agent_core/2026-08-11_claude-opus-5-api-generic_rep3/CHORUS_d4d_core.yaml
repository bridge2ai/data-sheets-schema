      unit (PICU) and neonatal intensive care unit (NICU). Demographic attributes are captured in the
      OMOP demographics tables.
    distribution: >-
      The current released dataset is described as 50,000 patient admissions from ICU, PICU and NICU;
      the breakdown across those units, and across demographic groups, is not reported in the available
