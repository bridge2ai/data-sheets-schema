future_use_impacts:
  - impact_details: "The project anticipates that the dataset and its holdout validation set will aid marketplace adoption of AI-developed models for implementation in acute and critical care, and will catalyze biomedical research and expertise promoting patient-focused deployment of AI. It also anticipates that privacy and bias must be actively managed, motivating the legal and ethical research components, re-identification-limiting transformations, and sampling for a balanced and diverse cohort."

known_biases:
  - bias_type: selection_bias
    bias_description: "Data are contributed by 14 data acquisition centers within a 20-institution academic network, so the cohort reflects the patient populations and practice patterns of those hospitals."
    mitigation_strategy: "Sampling to ensure comprehensive sets of patient conditions and clinical treatment strategies, federated access enabling sampling methods for a balanced and diverse cohort, and inclusion of contextual factors such as social determinants of health and geographic distance to the nearest hospital."
  - bias_type: representation_bias
    bias_description: "Management of bias is stated as an explicit patient-focused objective of the project, alongside privacy, indicating that representativeness across patient groups is a recognized concern for this dataset."
    mitigation_strategy: "Patient-focused ethical and legal work to manage privacy and bias while accounting for social determinants of health."

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: "Modality coverage is uneven in the released data: imaging is limited to roughly 1000 images with de-identification in process for a larger cohort, EEG extraction is still in process, and only 7,642 of the released admissions carry radiology data."
    scope_impact: "Analyses requiring imaging or EEG alongside structured data are restricted to a small fraction of admissions in the current release."
  - limitation_type: scope_limitation
    limitation_description: "Full-text clinical notes are not distributed; they remain stored locally at contributing sites and only tokens are available in the enclave."
    scope_impact: "Natural language processing that requires raw note text cannot be performed on the released data."
  - limitation_type: representativeness_limitation
    limitation_description: "The dataset is confined to critically ill patients admitted to ICU, PICU, and NICU settings at 14 contributing hospitals in the United States."
  - limitation_type: temporal_limitation
    limitation_description: "The released dataset is a partial, in-progress snapshot: roughly 50,000 admissions against an anticipated final dataset of 100,000 patient admissions and 9 modalities."

