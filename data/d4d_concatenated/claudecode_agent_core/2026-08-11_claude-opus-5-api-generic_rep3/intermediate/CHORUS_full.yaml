raw_data_sources:
  - source_description: "Structured electronic health record data (demographics, medication administration, procedures, nursing flowsheets, diagnoses) from 14 data acquisition hospitals."
    access_details: "Extracted and curated by contributing sites following validated CHoRUS standard operating procedures, then submitted as a CHoRUS Data Extract."
  - source_description: "Unstructured electronic health record text (clinical notes) from contributing hospitals."
    access_details: "Extracted and tokenized locally with the OHNLP toolkit; source notes remain stored locally, with tokens delivered to the enclave."
  - source_description: "Imaging studies retrieved from hospital PACS."
    access_details: "De-identification in process for cohorts beyond the initial approximately 1000 images."
  - source_description: "Bedside monitor waveform telemetry acquired via monitoring gateways and middleware."
  - source_description: "EEG waveforms from hospital EEG databases."

acquisition_methods:
  - acquisition_details: "Retrospective extraction of data generated during routine clinical care at 14 contributing hospitals, rather than prospective collection for research. Sites create a CHoRUS-specific clinical data extract, standardize it, and upload it to the project cloud enclave, following step-by-step SOPs published in the Chorus_SOP repository and reviewed internally by the Standards, Data Acquisition, and Tooling sub-teams."

direct_collection:
  - is_direct: false
    collection_details: "Data are obtained from hospital clinical systems and archives at data acquisition centers rather than collected directly from patients by the dataset creators."

collection_mechanisms:
  - mechanism_details: "Site-side extraction and upload tooling (chorus-extract-upload), dockerized container applications deployed to support CHoRUS services on Azure, waveform conversion scripts (chorus_waveform), OMOP location geocoding via DeGauss (UF-Geocoding), and validated semantic mappings pooled in the chorus-mapping repository. Site progress is tracked through GitHub issues and a Google Form that triggers a GoogleScript calling the GitHub API to update the Standards and Data Acquisition project boards."

data_collectors:
  - collector_details: "Fourteen data acquisition centers within the 20-institution CHoRUS Network extract, standardize, and submit data; site data managers follow the interactive workflow and SOP documents maintained in the Chorus_SOP repository."
    role: academic_institution

collection_timeframes:
  - timeframe_details: "Retrospective data collection. Data acquisition proceeds over the NIH project period, 2022-09-01 through 2026-11-30. Status reported as of August 2025: 14 hospitals and over 45,000 unique admissions."
    source_caveats: "The calendar period covered by the retrospective clinical records themselves is not stated in the available sources; the dates given are the award period and the reporting snapshot."

sampling_strategies:
  - is_sample: true
    notes: "The project states that it will establish a legal framework for collecting data at scale, sampling to ensure comprehensive sets of patient conditions and clinical treatment strategies, and that federated access will enable sampling methods to ensure a balanced and diverse cohort. Specific inclusion and exclusion criteria are not described in the available sources."

preprocessing_strategies:
  - preprocessing_details: "Acquisition, standardization, tokenization, storage, visualization, and labeling of multi-modal data; standardization of structured data to the OMOP Common Data Model with validated semantic mappings; tokenization of unstructured EHR text using the OHNLP toolkit; conversion of waveforms to WFDB and EDF+/Persyst representations; geocoding of OMOP Location entities via DeGauss; and transformation using approaches that limit re-identification."

cleaning_strategies:
  - cleaning_details: "Characterization reports are produced and returned to contributing sites following their data submissions (CHoRUSReports repository), and semantic mappings undergo clinical validation under an associated mapping validation SOP."

labeling_strategies:
  - labeling_details: "A visualization and annotation environment is being developed to label data with targets important for prediction; clinical expertise is solicited for semantic mapping and validation through the chorus-mapping repository and its clinical validation SOP."

machine_annotation_tools:
  - tools:
      - OHNLP toolkit
      - DeGauss (UF-Geocoding)
      - CTP-deid
      - privacy_scan_tool
    tool_descriptions:
      - "OHNLP toolkit: extraction and tokenization of unstructured clinical notes."
      - "DeGauss, used in the UF-Geocoding repository: open source geocoding of OMOP Location entities."
      - "CTP-deid: de-identification repository within the chorus-ai GitHub organization."
      - "privacy_scan_tool: privacy scanning tool for medical records, written in Python."

is_deidentified:
  method: "Tokenization of unstructured EHR text with the OHNLP toolkit; transformation of data using approaches that limit re-identification; de-identification of imaging in process for cohorts beyond the initial release; privacy scanning of medical records."
  deidentification_details: "Clinical notes are not released as free text: they are stored locally at contributing sites, with tokens made available. Imaging de-identification was in process as of August 2025 for the larger cohort beyond approximately 1000 available images. All modalities are under controlled access."

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: "The dataset comprises hospital records of critically ill patients, including demographics, diagnoses, procedures, medication administration, nursing flowsheets, clinical notes, imaging, telemetry and EEG waveforms, social determinants of health, and contextual factors such as geographic distance to the nearest hospital."

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: "All nine modalities are designated controlled access. Clinical notes are not transferred in full to the enclave; they remain stored locally at contributing sites, with only tokens shared. Community-facing ethics focus groups are used to determine what data is appropriate for public sharing."

ethical_reviews:
  - review_details: "The project includes a dedicated Ethics pillar (Ethical and Trustworthy AI). It performs community-facing ethics focus groups to determine what data is appropriate for public sharing, evaluates community perspectives on clinical care AI to increase trustworthiness of provenance and privacy, analyzes the existing legal and regulatory landscape, and establishes a legal framework for collecting data at scale."
    source_caveats: "No IRB or ethics committee approval numbers, reviewing bodies, or determination letters are reported in the available sources."

human_subject_research:
  involves_human_subjects: true
  source_caveats: "The sources establish that the dataset consists of patient records from critically ill individuals, but do not state IRB approval status, the reviewing ethics board, consent or waiver arrangements, or specific regulatory compliance determinations for the dataset itself."

data_protection_impacts:
  - impact_details: "Patient-focused efforts are described as determining the ethical and legal approaches to manage privacy and bias while accounting for social determinants of health; community-facing ethics focus groups inform which data are appropriate for public sharing; and a privacy scan tool for medical records is maintained in the project's software organization."

regulatory_restrictions:
  confidentiality_level: restricted
  notes: "Every data modality in the dataset summary table is marked as controlled access. Access is mediated by a cloud enclave, a registration form, a signed licensing agreement, and (for the training program) a '.edu' email address."

license_and_use_terms:
  license_terms: "Access is controlled. Users register with name, email, and institution and must sign a licensing agreement included in the registration form before gaining access to the dataset; access is granted and compute provisioned by the project, and users are notified by email. In the AIM-AHEAD Bridge2AI for Clinical Care Training Program context, a '.edu' email address is required for dataset access, with program administrators assisting where needed."
  contact_person: "dbold@emory.edu; jared.houghtaling@tuftsmedicine.org (access requests)"
  source_caveats: "No formal data use license identifier (for example a Creative Commons or DUA name) is given for the dataset itself in the available sources. The MIT license reported in the chorus-ai GitHub organization applies to the project's software repositories, not to the clinical data."

