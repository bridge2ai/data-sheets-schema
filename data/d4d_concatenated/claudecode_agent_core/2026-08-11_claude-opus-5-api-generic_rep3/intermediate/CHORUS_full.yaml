id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is the multi-modal, high-resolution critical care dataset produced by the Patient-Focused
  Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI data generation
  project, one of four data generation projects in the NIH Common Fund Bridge2AI consortium
  (award OT2OD032701). The CHoRUS Network spans 20 academic centers, 14 of which contribute as
  Data Acquisition centers, and comprises more than 60 consortium members. Its stated goal is to
  develop the most diverse, high-resolution, ethically sourced, AI-ready dataset to address the
  grand challenge of improving recovery from acute illness, supporting machine learning and
  artificial intelligence work that characterizes acute and critical care illness, predicts
  complications, and measures treatment response. The project is organized around three pillars:
  Data (standards, tool development and optimization, data acquisition), Ethics (ethical and
  trustworthy AI), and People (team science, skill and workforce development).
  The dataset is assembled retrospectively from routine clinical systems at contributing hospitals
  and is made available under controlled access through a cloud enclave. Nine data modalities are
  in scope: demographics, medication administration (time-stamped at each infusion change or dose
  administration), procedures, nursing flowsheets (high-frequency documentation), diagnoses,
  clinical notes (extracted and tokenized with the OHNLP toolkit), imaging from PACS, waveform
  telemetry from bedside monitors and gateway/middleware, and waveform EEG from hospital databases.
  Structured records are standardized to the OHDSI/OMOP Common Data Model; imaging follows DICOM,
  telemetry follows WFDB (PhysioNet schema, extended), and EEG follows EDF+ and Persyst formats.
  Data elements are intended to carry contextual factors such as social determinants of health and
  geographic distance to the nearest hospital.
  As of August 2025 the released dataset covered 14 hospitals and over 45,000 unique admissions;
  the project website reports a current released dataset of 50,000 patient admissions from ICU,
  PICU, and NICU settings, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data,
  and 23 Tb of waveform data. The anticipated final dataset is 100,000 patient admissions across
  9 modalities from 14 contributing hospitals. OMOP and telemetry data reside in the enclave;
  clinical notes are stored locally except for tokens, roughly 1000 images are currently available
  with de-identification in process for a larger cohort, and EEG extraction is in process. A
  holdout test set is to be provisioned for external validation of models to aid marketplace
  adoption of AI models in acute and critical care. The dataset is already in use for training
  activities and publications, including the AIM-AHEAD Bridge2AI for Clinical Care Training Program.
conforms_to: "OHDSI/OMOP Common Data Model (structured EHR); OHNLP schema (tokenized clinical notes); DICOM (imaging); WFDB / PhysioNet schema, extended (waveform telemetry); EDF+ and Persyst (waveform EEG)"
