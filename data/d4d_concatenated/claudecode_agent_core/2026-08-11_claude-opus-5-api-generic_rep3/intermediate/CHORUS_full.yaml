notes: >-
  The CHoRUS project website carried the banner "This repoitory is under review for potential
  modification in compliance with Administration directives" at the time of capture. The chorus-ai
  GitHub organization states that its software project is licensed under the MIT License, with
  individual repositories also carrying MIT and Apache-2.0 licenses; these apply to code rather
  than to the clinical dataset. The project website adds that its content is solely the
  responsibility of the authors and does not necessarily represent the official views of the NIH.

source_caveats: >-
  Counts differ across sources and dates: the September 2025 webinar states "as of August 2025,
  covers 14 different hospitals with over 45K unique admissions", while the project website
  snapshot of the current released dataset states 50,000 patient admissions from ICU, PICU, and
  NICU; both are recorded here as reported. The website's anticipated final dataset is 100,000
  patient admissions, whereas the 2022 NIH abstract describes acquiring an AI-ready dataset from
  "more than 100,000 critically ill patients". The webinar's dataset summary table was extracted
  from PDF with its columns interleaved, so the pairing of each data type with its access control
  and metadata-availability value ("Yes", "Planned") is partly reconstructed from order; the data
  type to data standard pairings are unambiguous, but per-modality metadata status should be
  treated as uncertain. The NIH RePORTER abstract contains transcription artifacts (for example
  "CPatient-Focused", "label data for ;", "literacy nd utilization"). The project website lists a
  program manager contact address "cmccrary@mgh.havard.edu" as spelled in the source. No dataset
  DOI, version identifier, formal data license name, or IRB record appears in any of the four
  source documents.