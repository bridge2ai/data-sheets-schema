purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset
      on type 2 diabetes mellitus that enables future generations of artificial intelligence
      and machine learning research, including research into salutogenic pathways from
      disease back to health.
  - response: >-
      To develop a foundational dataset in T2DM that is agnostic to existing classification
      criteria or biases and that can be used to reconstruct a temporal atlas of T2DM
      development and reversal towards health.
  - response: >-
      To establish and disseminate standards, best practices and guidelines for the
      collection, preparation and sharing of data intended for AI/ML, as a blueprint for
      future data generation projects, following the FAIR (Findable, Accessible,
      Interoperable, Reusable) principles.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training
      personnel, including a year-long research internship programme at the intersection of
      biomedicine and AI.

addressing_gaps:
  - response: >-
      A major barrier to AI in T2DM research has been the lack of well-designed, high
      quality, large and inclusive multimodal datasets that are AI-ready for training
      models. AI-READI is designed to fill this gap with a hypothesis-agnostic,
      multi-domain protocol.
  - response: >-
      Existing large T2DM datasets lack racial and ethnic diversity. A meta-epidemiological
      review of T2DM studies published between 2000 and 2020 found that samples lacked
      racial and ethnic diversity. AI-READI balances recruitment across Asian, Black,
      Hispanic and White participants rather than targeting the demographic distribution of
      the US population, because balanced training data are critical for the development of
      unbiased machine learning models.
  - response: >-
      Existing secondary data sources such as insurance claims and electronic health records
      do not support the multimodal, harmonised, cross-domain analyses that AI-READI's
      purpose-designed acquisition protocol enables.
  - response: >-
      Multimodal data spanning the full range of T2DM severity, from no diabetes to
      insulin-dependent disease, are required for downstream pseudotime manifold analysis of
      disease trajectories; such data collections did not previously exist.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis to predict disease trajectories by learning
      from complex multimodal data across participants with differing disease severity
      (normal through insulin-dependent T2DM).
  - response: >-
      Study of salutogenesis in type 2 diabetes, that is, the pathway from disease back to
      health, as the complement to studying pathogenesis.
  - response: >-
      General artificial intelligence and machine learning model development on harmonised
      multimodal clinical, imaging, waveform, wearable and environmental data.

intended_uses:
  - use_category: disease-specific biomedical research
    usage_notes: >-
      Access to the public dataset requires agreement to use the data only for type 2
      diabetes related research, in addition to login through a verified ID system and
      acceptance of the licence terms.
    examples:
      - Multimodal AI/ML model development for T2DM
      - Pseudotime manifold analysis of T2DM disease trajectories
      - Retinal imaging analysis across multiple imaging devices and modalities
      - Analysis of continuous glucose monitoring, physical activity and indoor environmental
        exposure data in relation to diabetes status
  - use_category: methods and pipeline development
    usage_notes: >-
      A smaller "mini" version of the dataset is made available specifically for pipeline
      development, and Azure Storage access is documented in the v3.0.0 preliminary
      information section of the dataset documentation.
  - use_category: commercial research and development
    usage_notes: >-
      The licence grants a non-exclusive, non-transferable licence to download, reproduce and
      use the data and to create derivative works for research and commercial purposes,
      subject to the sharing, security and re-identification restrictions it imposes.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited by the licence; the
      data are intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or in concert with other information, to
      compromise or infringe the confidentiality or privacy of any data subject, to identify
      or contact any individual data subject or group of data subjects, to extract or
      extrapolate identifying information, to establish a data subject's membership in a
      particular group, or otherwise to cause harm or injury to any data subject, is
      prohibited.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or
      otherwise conveying any portion of the data or any derivative work to a third party is
      prohibited, except to another licensee bound by an identical agreement with the
      licensor and for the purpose of collaborating on projects involving the data.
  - prohibition_reason: >-
      Disseminating models, algorithms or programs trained or adapted using the data without
      first undertaking all reasonable efforts to minimise the likelihood that data can be
      memorised, derived, reconstructed or reconstituted through their use or construction is
      prohibited.
  - prohibition_reason: >-
      Use of the public dataset for purposes other than type 2 diabetes related research is
      not permitted under the access self-attestation; a private (controlled) version allows
      more generic use.

discouraged_uses:
  - discouragement_details: >-
      The dataset creators state that the AI-READI licence imposes restrictions on usage of
      the data and refer users to the licence file rather than enumerating a separate list of
      discouraged tasks. Beyond the licence restrictions, the healthsheet response to whether
      there are tasks for which the dataset should not be used defers entirely to those
      licence terms.
  - discouragement_details: >-
      Because enrollment is ongoing and periodic releases may not have achieved balanced
      distribution across race/ethnicity, sex and diabetes severity groups, uses that assume
      the released version is demographically balanced are not supported by the data as
      released.

future_use_impacts:
  - impact_details: >-
      The dataset creators state that, to the extent of their knowledge, they do not currently
      anticipate uses of the dataset that could result in unfair treatment or harm; however
      there is a theoretical risk of future re-identification.
  - impact_details: >-
      AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification. To prevent re-identification attempts, the project
      implements a robust data dissemination system, a strict licence agreement and data
      watermarking for both the public and controlled sets.
  - impact_details: >-
      The project team anticipates that the flagship dataset will lead to novel discoveries
      into T2DM pathogenesis and salutogenesis while benefiting a broader population given the
      diversity of study participants, and that the accompanying blueprint may remove a major
      bottleneck to the widespread use of AI in healthcare by making off-the-shelf AI-ready
      data available.

other_tasks:
  - task_details: >-
      Biorepository-enabled follow-on work is anticipated but is not part of this released
      dataset: banked plasma, serum, buffy coats, genomic DNA, PAXgene-stabilised RNA and
      peripheral blood mononuclear cells support future proteomics, metabolomics, genomics,
      gene expression and immunological studies including generation of induced pluripotent
      stem cells.
  - task_details: >-
      The dataset documentation and metadata artefacts (Clinical Dataset Structure, healthsheet,
      dataset_description.json, dataset_structure_description.json) are themselves intended as
      a reusable blueprint for other data generation projects preparing AI-ready clinical
      datasets.

