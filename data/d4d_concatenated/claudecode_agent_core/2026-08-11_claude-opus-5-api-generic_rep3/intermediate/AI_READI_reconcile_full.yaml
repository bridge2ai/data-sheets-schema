source_caveats: >-
  The input bundle contains two expansions of the AI-READI acronym: "Artificial Intelligence
  Ready and Equitable Atlas for Diabetes Insights" (BMJ Open protocol paper and Nature
  Metabolism comment) and "Artificial Intelligence Ready and Exploratory Atlas for Diabetes
  Insights" (NIH RePORTER record, FAIRhub healthsheet and README). Both are reproduced here
  without resolution. The FAIRhub structured metadata names "Washington University in
  St. Louis" (ROR 01yc7t268) as managing organization, lead sponsor and affiliation for the
  principal investigators, whereas all narrative sources, the IRB record and the NIH
  RePORTER entry identify the University of Washington, Seattle (ROR 00cvxb145) as the
  awardee institution and IRB of record; this appears to be an error in the FAIRhub record
  and both readings are preserved in the affiliation fields below. Target enrolment is given
  as 4,000 in most sources and as 4,600 in the IRB protocol document. The bundle supplies no
  distinct dataset creation date; the only date associated with release is the FAIRhub
  dateType "Available" value of 2025-11-17, recorded here as the issue date only. This record
  describes version 3.0.0 of the released dataset, not the wider AI-READI study or its
  biorepository, which are described only where they bear on the released data.

