id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset generated by the Artificial Intelligence
  Ready and Equitable (also rendered "Exploratory") Atlas for Diabetes Insights (AI-READI)
  project, one of four Data Generation Projects funded by the NIH Common Fund Bridge2AI
  program. The dataset contains data from 2,280 participants aged 40 and older, with and
  without type 2 diabetes mellitus (T2DM), collected between 19 July 2023 and 1 May 2025
  and harmonised across three US data collection sites (University of Alabama at Birmingham,
  University of California San Diego, and University of Washington). Participants are
  recruited to be approximately balanced ("triple-balanced") across self-reported
  race/ethnicity (Asian, Black, Hispanic, White), T2DM status and severity (no diabetes;
  pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin injectable
  medication; insulin-controlled), and biological sex. Each participant completes a single
  in-person visit of roughly 2.5-4 hours plus pre-visit questionnaires and a 10-day at-home
  monitoring period. Modalities include survey and social-determinants-of-health data,
  physical measurements and vitals, blood and urine laboratory results, 12-lead
  electrocardiography, cognitive screening (MoCA), monofilament peripheral neuropathy
  testing, visual acuity and contrast sensitivity under photopic and mesopic conditions,
  autorefraction, multi-device retinal imaging (colour fundus photography, fundus
  autofluorescence, infrared reflectance, OCT, OCTA and fluorescence lifetime imaging
  ophthalmoscopy), continuous glucose monitoring, wearable physical-activity monitoring,
  and indoor environmental sensing. The dataset is organised according to the Clinical
  Dataset Structure (CDS) v0.1.1 into nine datatype directories and comprises 356,343 files
  totalling approximately 3.82 TB. The public release contains no protected health
  information; sex, race/ethnicity and medication data are withheld from the public version
  and are available only through controlled access. The stated scientific goal is to enable
  artificial intelligence and machine learning research into salutogenesis in T2DM, that is,
  the pathway from disease back to health, using downstream approaches such as pseudotime
  manifold analysis. The dataset is hypothesis-agnostic: no labels or targets are supplied.
