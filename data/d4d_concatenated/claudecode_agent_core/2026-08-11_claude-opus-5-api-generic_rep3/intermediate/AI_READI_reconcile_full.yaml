acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details: >-
      Acquisition varied by domain. Directly observable data include laboratory results,
      vitals and physical measurements, electrocardiography, monofilament testing, cognitive
      screening, visual function testing, retinal imaging, and device readouts from continuous
      glucose monitoring, the wearable activity monitor and the home environmental sensor.
      Subject-reported data include the pre-visit and on-site questionnaires. Verification of
      data entry was performed where possible, for example by cross-referencing entered
      medications against medications physically brought in or photographed by the participant.

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for collecting patient-reported questionnaire data and the following
      clinical data from the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results and complete blood count results. The exact forms
      used for data collection in REDCap are published with the documentation.
  - mechanism_details: >-
      Retinal imaging devices: Optomed Aurora IQ handheld non-mydriatic fundus camera
      (Optomed, Oulu, Finland), 4 images per participant, DICOM; iCare EIDON widefield
      TrueColor confocal fundus system (iCare USA, Raleigh, North Carolina), 12 images per
      participant, DICOM, capturing ultra-widefield central/nasal/temporal colour fundus
      photographs, central infrared, central fundus autofluorescence and a mosaic;
      Heidelberg Spectralis HRA OCT and OCTA (Heidelberg Engineering, Heidelberg, Germany),
      6 images per participant, DICOM, with optic nerve head radial circle high resolution
      OCT, posterior pole macula 61-line OCT and 20x20 512-line macular OCTA; Topcon Maestro2
      3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan), 6 images, exported as .fda and
      converted to DICOM; Topcon Triton DRI OCT, 6 images, exported as .fda and converted to
      DICOM; Zeiss Cirrus 5000 (Carl Zeiss Meditec AG, Jena, Germany), 8 images, DICOM; and
      Heidelberg fluorescence lifetime imaging ophthalmoscopy (FLIO), 2 macula-centred images,
      exported as .sdt and converted to DICOM. All retinal images are collected under dilated
      conditions except the Optomed.
  - mechanism_details: >-
      At-home monitoring devices issued at the end of the visit and used continuously for
      10 days: Dexcom G6 continuous glucose monitor (Dexcom, Inc., San Diego, California)
      recording blood glucose every 5 minutes in mg/dL; Garmin Vivosmart 5 physical activity
      monitor (Garmin Ltd, Schaffhausen, Switzerland) recording steps, heart rate, sleep
      duration, respiratory rate, stress and oxygen saturation, exported as .FIT and converted
      to the Open mHealth standard; and a custom-designed environmental sensor (the LeeLab
      Anura, Karalis Johnson Retina Center, University of Washington, Seattle) recording
      ambient temperature, relative humidity, nitrogen oxides, volatile organic compounds,
      particulate matter (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral light intensity
      measurements. Participants are masked to Dexcom results during the monitoring period.
      The environmental sensor and fitness tracker were chosen with participant privacy as a
      primary concern: they capture no video or audio, have no GPS location monitoring and are
      not synced with participant-owned devices.
  - mechanism_details: >-
      Other on-site instruments: Philips PageWriter TC30 Cardiograph for 12-lead ECG, exported
      as .xml, with participant recline position (0, 30, 60 or 90 degrees) recorded; 10 g
      monofilament testing at three locations on each foot, ten times per location; Montreal
      Cognitive Assessment administered on an iPad using the MoCA Duo application (MoCA
      Cognition, Quebec, Canada), exported as .csv with total score, section subscores, Memory
      Index Score and task completion times; M&S Technologies Electronic Visual Acuity tester
      at 4 metres for photopic and, through a 2.0 neutral density filter, mesopic acuity; Mars
      letter contrast sensitivity charts (Mars Perceptrix, Chappaqua, New York) under photopic
      and mesopic conditions; Topcon KR 800 autorefractor/keratometer; automatic oscillometric
      blood pressure devices (OMRON HEM 907XL, Medline MDS4001, Welch Allyn 6000 series); and
      lensometers (NIDEK LM-600P, Topcon CL-200, Topcon CL-300).
  - mechanism_details: >-
      Data are uploaded at regular intervals to FAIRhub, an AI-READI-specific Microsoft Azure
      cloud-based data management, curation and sharing platform developed for the project.
      The data manager at each site is responsible for quality control of all data before
      upload.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      The collection period recorded in the FAIRhub dataset metadata for version 3.0.0 is
      2023-07-19 to 2025-05-01, spanning the pilot phase and the first two study years.
      The BMJ Open protocol states that enrolment began on 18 July 2023 and will continue
      until 30 November 2026, that preliminary pilot enrolment occurred between 18 July 2023
      and 30 November 2023, and that formal data collection began on 1 December 2023. The
      overall study timeline spans four years: one year for protocol development and training
      and years 2-4 for recruitment and data collection, with approximately 4 to 10 per cent
      of participants expected to return for a follow-up examination in year 4. The FAIRhub
      study record gives an actual study start date of 2023-07-19 and an anticipated
      completion date of 2027-01-01.
    source_caveats: >-
      Enrolment start is given as 18 July 2023 in the BMJ Open protocol and as 19 July 2023 in
      the FAIRhub metadata and README.

data_collectors:
  - role: clinical research coordinators and research assistants
    collector_details: >-
      Trained clinical research coordinators and research assistants at the three data
      collection sites recruited, consented and enrolled participants, conducted study visits
      including ophthalmic imaging, trained participants on the at-home devices, and ensured
      return of study materials. All research personnel underwent training by the data manager
      at UAB and worked from a detailed Manual of Procedures. A certification process was
      required for all coordinators, including mandatory institutional compliance training for
      human subject research, and each coordinator had to successfully administer all protocol
      elements to at least three volunteer practice subjects before enrolling participants.
  - role: data managers
    collector_details: >-
      Data managers at each site oversee the training and certification process and are
      responsible for the quality control of all data before uploading to FAIRhub.
  - role: laboratory and biospecimen personnel
    collector_details: >-
      Phlebotomists collected blood; laboratory assistants processed and shipped samples.
      CLIA-certified laboratories local to each site performed complete blood counts on fresh
      whole blood; all other laboratory tests were performed by the University of Washington
      Nutrition and Obesity Research Center testing facility on stored frozen samples.
  - role: project and technical staff
    collector_details: >-
      Project managers, database managers, research and data scientists, software engineers
      and cloud engineers were responsible for ingesting data into REDCap, extracting and
      processing it, developing curation pipelines and managing the cloud infrastructure.
    notes: >-
      Staff effort was supported by NIH award OT2OD032644 based on percentage of effort
      contributed, with salaries aligned to the funding guidelines at each site.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from participants at the three recruiting sites; this was
      active data collection rather than passive collection or secondary use of existing data.
      Recruitment pools were identified indirectly by screening electronic health records at
      each site for ICD-10 diagnosis codes for diabetes (E11.X) and pre-diabetes (R73.09)
      among patients aged 40 and older who had a medical encounter within the health system.
      Past health records, medications, and traffic and accident reports were also obtained
      from third-party sources and are held under controlled access.

sampling_strategies:
  - is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. The study base is all patients aged 40 or older with a medical
      encounter at UAB, UCSD or UW between 2020 and 2025. Participants are recruited in waves;
      for each wave a contact pool is identified by screening electronic health records, and
      individuals are mailed a personalised hardcopy invitation letter and sent an invitation
      email directing them to an online REDCap recruitment interface via links, access codes
      and QR codes. The composition and size of each wave are influenced by the observed
      participation characteristics of race/ethnicity, gender, T2DM severity and site, and are
      adjusted by under- and oversampling groups as recruitment progresses. Recruitment targets
      equal proportions across four race/ethnic groups, four T2DM categories and both
      biological sexes ("triple-balanced"), rather than the demographic distribution of the US
      population. All study groups are recruited at each site, but the proportion of each group
      varies with the demographic prevalence of that group in the site's geographical area.
    why_not_representative: >-
      Participants are volunteers, introducing volunteer selection bias that may limit
      generalisability to those not represented in the study population. Recruitment is
      predominantly urban and hospital-based and may not fully capture diverse cultural and
      socioeconomic backgrounds. The cohort does not include other races and ethnicities such
      as Pacific Islanders and Native Americans. Deliberate balancing across race/ethnicity,
      sex and diabetes severity means the sample is intentionally not representative of the
      US population.
    source_data: >-
      Electronic health records of the three participating health systems, screened for age
      and ICD-10 codes R73.09 (pre-diabetes) and E11.X (type 2 diabetes); patients without
      diabetes have no encounters with these codes.
    representative_verification: >-
      The healthsheet states that the dataset contains all possible instances, that is, data
      from all participants enrolled during the covered collection period, and answers "N/A"
      to the question about sampling strategy for a sample from a larger set.
    source_caveats: >-
      The bundle does not settle whether the released dataset should be characterised as a
      sample. The healthsheet asserts that the dataset "contains all possible instances" and
      that no sampling strategy applies, while the FAIRhub study metadata records the sampling
      method as "Non-Probability Sample" and the protocol describes deliberate stratified
      wave-based sampling of the study base. Both statements are recorded, and no
      sample/not-sample determination is asserted here.

instances:
  - instance_type: individual study participant
    counts: 2280
    data_substrate: >-
      Tabular survey and clinical data, imaging data (DICOM), physiological signal and waveform
      data (WFDB), and time-series device data (Open mHealth JSON and ASCII text). No
      unstructured free-text data are included in the released dataset.
    data_topic: >-
      Type 2 diabetes mellitus and associated multisystem health domains, including
      cardiovascular, renal, hepatic, metabolic, ophthalmic, neurological, cognitive,
      behavioural, psychosocial and environmental measures.
    label: none
    label_description: >-
      No explicit label or target is associated with each data instance. The dataset is
      hypothesis-agnostic and no labelling was performed, in order to facilitate multiple
      potential downstream AI/ML applications.
    missing_information: >-
      Not all modalities are available for all participants. Some participants elected not to
      participate in some study elements; in a few cases the data collection device had no
      stored results or was returned too late to retrieve the results, for example because the
      battery died or data were lost; and in a few cases a data collision at some point in the
      process resulted in lost data.

relationships:
  - relationship_details: >-
      All instances are part of the same prospective data generation project (AI-READI). There
      is currently only one visit per participant, so instances are not linked longitudinally.
      Approximately 10 per cent of the study cohort is planned to be invited for a follow-up
      visit in year 4 of the project, which would create within-participant longitudinal
      relationships in a future release.

subpopulations:
  - subpopulation_elements_present: false
    identification: >-
      The healthsheet states that the dataset does not identify any demographic
      sub-populations. Sex, race and ethnicity are removed from the public release and held
      under controlled access, in part to prevent stigmatisation of findings. Age is not
      released as an individual variable in the public set beyond the aggregate split summary.
    distribution: >-
      Aggregate demographic counts for the 2,280 participants are nevertheless published in the
      recommended-split summary table: by race/ethnicity, Hispanic 380, Asian 545, Black 519,
      White 836; by sex, male 951, female 1,329; by diabetes status, no diabetes 776,
      pre-diabetes/lifestyle-controlled 560, oral or non-insulin injectable medication
      controlled 686, insulin controlled 258; mean age 60.8 years (standard deviation 11.3).
    source_caveats: >-
      There is a direct tension between the healthsheet answer "No" to whether the dataset
      identifies demographic sub-populations and the presence of a published aggregate
      demographic breakdown in the README split table. The reconciliation is that individual
      demographic labels are withheld from the public release while aggregate counts are
      published; both are recorded.
    notes: >-
      Because sex, race and ethnicity are not released with the public dataset, the project
      team states that the recommended splits are themselves intended as a method to reduce
      disparity of error rates between demographic subgroups when demographic labels are
      unavailable to the model developer.

splits:
  - split_details: >-
      Recommended train/validation/test splits of 70/15/15 are supplied in the participants.tsv
      file included with the dataset. The validation and test sets are balanced as far as
      possible for sex, race/ethnicity and diabetes status (no diabetes; pre-diabetes or
      lifestyle-controlled; oral or non-insulin injectable medication controlled; insulin
      controlled), because these variables are not released with the public version and cannot
      be balanced by users. Counts are: Train n=1,576 (Hispanic 204, Asian 369, Black 343,
      White 660; male 599, female 977; no diabetes 600, lifestyle 384, oral 487, insulin 105;
      mean age 61.1 +/- 11.3 years). Validation n=352 (Hispanic 88, Asian 88, Black 88, White
      88; male 176, female 176; no diabetes 88, lifestyle 88, oral 109, insulin 67; mean age
      60.3 +/- 10.8 years). Test n=352 (Hispanic 88, Asian 88, Black 88, White 88; male 176,
      female 176; no diabetes 88, lifestyle 88, oral 90, insulin 86; mean age 60.5 +/- 11.4
      years). Total n=2,280, mean age 60.8 +/- 11.3 years. This recommended split is new in
      version 3.0.0 of the dataset; the datasheet for this version introduces no new tasks or
      labelling.

anomalies:
  - anomaly_details: >-
      Missing modalities for some participants, arising from participants electing not to take
      part in some study elements, devices with no stored results, devices returned too late to
      retrieve results (for example battery failure or data loss), and occasional data
      collisions in the processing pipeline resulting in lost data.
  - anomaly_details: >-
      In survey data, skipped questions and incomplete responses are expected.
  - anomaly_details: >-
      In wearable data, improper use and technical failure such as battery failure or system
      malfunction are expected.
  - anomaly_details: >-
      In imaging data, patient uncooperation, noise that may obscure images, system malfunction
      and data transfer failures are expected. Image quality varies notably for the handheld,
      undilated Optomed Aurora acquisitions, both between participants and within the same
      participant, because obtaining a good view without dilation using a handheld device is
      challenging. For operator-dependent devices such as the Heidelberg Spectralis, quality
      issues may lead to skipping the modality and consequent missing data. FLIO is performed
      last in the visit because it takes longer and exposes participants to uncomfortable light
      levels, so participants may not be at their best possible compliance for that modality.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers responding to mailed and emailed invitations, producing
      volunteer bias that may limit generalisability to persons not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of diversity and inclusion, and under- or
      oversampling of groups as needed; personalised, participatory recruitment approaches
      informed by published strategies for engaging under-recruited populations.
  - bias_type: representation_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based and may not fully capture diverse
      cultural and socioeconomic backgrounds. The cohort covers only four self-reported
      race/ethnicity groups (Asian, Black, Hispanic, White) and does not include other groups
      such as Pacific Islanders and Native Americans. The requirement that participants speak,
      read and understand English may have created challenges in recruiting Hispanic and Asian
      persons.
    affected_subsets:
      - Pacific Islander participants (absent)
      - American Indian and Alaska Native participants (absent)
      - Non-English-speaking participants (excluded)
    mitigation_strategy: >-
      Three geographically diverse recording sites were selected to broaden representation, with
      individuals from all demographic backgrounds recruited at all three sites. The project
      engages with the Native Biodata Consortium as a co-learning opportunity for understanding
      challenges specific to American Indian and Alaska Native communities and evaluating tools
      such as data usage agreements, contract negotiations, transparent access agreements and
      assured return of benefit, with a view to ethically collecting similar data in a Native
      American cohort.
  - bias_type: sampling_bias
    bias_description: >-
      Enrollment is ongoing, so the pilot data release and periodic updates to data releases may
      not have achieved the intended balanced distribution across race/ethnicity, sex and
      diabetes severity groups. The pilot study in particular is not balanced across these
      parameters.
    mitigation_strategy: >-
      Ongoing monitoring of participation characteristics and adjustment of recruitment wave
      composition; publication of the achieved demographic counts alongside the recommended
      balanced validation and test splits.
  - bias_type: measurement_bias
    bias_description: >-
      Operator-dependent and device-dependent variation in acquisition quality, particularly for
      handheld undilated fundus photography and for modalities where the operator positions the
      device manually rather than relying on automated positioning.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites; automated
      acquisition modes were used where available to minimise operator-induced error; device
      make, model and specific scan protocol were documented to ensure repeatability; and
      multiple devices were deliberately included for the same measure to enhance
      generalisability and represent the range of equipment used in clinical settings.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Participants must be able to speak and read English; non-English-speaking individuals are
      excluded. Participants must be aged 40 or older. The FAIRhub eligibility record and the
      IRB exclusion criteria additionally set an upper bound of 85 years. Pregnancy, gestational
      diabetes and type 1 diabetes are exclusionary.
    scope_impact: >-
      Findings and models derived from the dataset cannot be assumed to transfer to younger
      adults, to pregnant individuals, to persons with type 1 diabetes, or to
      non-English-speaking populations.
    source_caveats: >-
      The upper age bound of 85 years appears in the FAIRhub eligibilityModule and in the IRB
      protocol exclusion criteria; the healthsheet eligibility answers state only "≥ 40 years
      old" with no upper bound.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The dataset is cross-sectional: there is currently only one visit per participant, with a
      single 10-day at-home monitoring window. Longitudinal follow-up of approximately 10 per
      cent of the cohort is planned for year 4 but is not present in this release.
    recommended_mitigation: >-
      Disease-trajectory questions are intended to be addressed through pseudotime manifold
      analysis across participants of differing severity rather than through within-participant
      longitudinal data.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The public release omits sex, race, ethnicity, medications, 5-digit zip code, genetic
      sequencing data, past health records and traffic and accident reports, all of which are
      held under controlled access. Fairness auditing by demographic subgroup is therefore not
      possible with the public release alone.
    recommended_mitigation: >-
      Use the supplied recommended splits, which are balanced for sex, race/ethnicity and
      diabetes status by the project team, or apply for controlled access.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset provides no labels, targets or predefined tasks, and no gold-standard or
      proxy labels were computed; the dataset is deliberately hypothesis-agnostic.
    recommended_mitigation: >-
      Users defining new labels or tasks must do so themselves; the project states that it has
      no formal guidelines in place for creating new labels or defining new tasks.
  - limitation_type: methodological_limitation
    limitation_description: >-
      A limitation of the associated biorepository is that there are a finite number of samples
      to share with scientists interested in using them in research; procedures for reviewing
      and prioritising written requests were still to be developed at the time of the protocol
      publication.
  - limitation_type: integration_limitation
    limitation_description: >-
      Between version 2.0.0 and version 3.0.0 the Snellen visual acuity variables were dropped,
      so that only logMAR visual acuity measurements are available; analyses spanning dataset
      versions must account for this change in available fields.

missing_data_documentation:
  - missing_data_patterns: >-
      Modality-level missingness at the participant level: not all modalities are available for
      all participants. Item-level missingness within surveys from skipped questions and
      incomplete responses.
    missing_data_causes: >-
      Participant election not to take part in specific study elements; absence of stored
      results on a data collection device; devices returned too late for results to be
      retrieved (battery failure, data loss); occasional data collisions during processing;
      improper device use; technical failure or system malfunction; patient uncooperation or
      excessive noise during imaging; data transfer failures.
    handling_strategy: >-
      No imputation is reported. Missing data that could be directly filled from other portions
      of an individual's record were completed during data cleaning under site principal
      investigator approval; where there was no logical or appropriate way to correct the data,
      the site principal investigator reviewed the values and decided whether they should be
      removed.

labeling_strategies:
  - labeling_details: >-
      No labelling was performed. There is no explicit label or target associated with each data
      instance, no gold-standard or proxy labels, and no human labellers were engaged, because
      the dataset is hypothesis-agnostic and intended to facilitate multiple potential
      downstream AI/ML applications. No labelling software is provided, and the project states
      it has no formal guidelines recommending how future researchers should create new labels
      or define new tasks.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the point of data entry and acquisition: clinical data outside expected
      minimum and maximum ranges were flagged in REDCap and surfaced in reports reviewed by
      clinical research coordinators and data managers, who then examined participant records to
      determine whether an error was likely. Data were checked and edited where errors were
      detected for credibility (range checks), incorrect flow through prescribed skip patterns,
      missing data that could be directly filled from other portions of the individual's record,
      and omission or duplication of records. Editing was performed only under the guidance and
      approval of the site principal investigator; where no logical or appropriate correction
      existed, the site principal investigator decided whether values should be removed.
  - cleaning_details: >-
      Central checks prior to dissemination: the dataset was reviewed internally by AI-READI team
      members for quality checks and to ensure that no personally identifiable information was
      accidentally included. The dataset has not undergone any formal external audit.
  - cleaning_details: >-
      An OMOP CDM Data Quality Dashboard artefact (dqd_omop.json) is distributed with the
      clinical_data directory, supporting a set of more than 3,500 automated data quality checks
      against the OMOP CDM instance.

preprocessing_strategies:
  - preprocessing_details: >-
      All data are mapped to applicable standard formats prior to dissemination: the
      Observational Medical Outcomes Partnership (OMOP) Common Data Model for clinical data,
      with each CSV file in the clinical_data directory a one-to-one mapping to an OMOP CDM
      table; DICOM for retinal imaging; WaveForm DataBase (WFDB) for electrocardiography; Open
      mHealth for wearable activity and continuous glucose monitoring data; and NASA ESDS ASCII
      file format guidelines for environmental sensor data. Standardised terminologies are used
      where possible, including RxNorm codes for current medications.
  - preprocessing_details: >-
      Device-specific format conversion: Topcon Maestro2 and Triton images are exported in .fda
      format and converted to DICOM for the dataset; Heidelberg FLIO data are exported in .sdt
      format and converted to DICOM; Garmin activity data are exported in .FIT format and
      converted to the Open mHealth standard. ECG is exported as .xml and MoCA output as .csv
      from the acquisition devices to local storage before transformation.
  - preprocessing_details: >-
      The whole dataset is organised according to the Clinical Dataset Structure (CDS) v0.1.1:
      one directory per datatype at the root, one folder per modality within each datatype, one
      folder per device within each modality, and one folder per participant within each device
      folder, named after the participant's study ID. Each datatype directory carries a
      manifest.tsv metadata file.
  - preprocessing_details: >-
      Processing maturity changed across releases: version 1.0.0 (pilot) processing was custom
      and ad hoc, while years 2 and 3 data were processed with a combination of automated
      pipelines and custom steps.
  - preprocessing_details: >-
      Records were not excluded at the time of preprocessing; the constraints on which
      individuals appear in the dataset arise from the study eligibility criteria rather than
      from post hoc exclusion.

raw_sources:
  - raw_data_details: >-
      Raw data are retained by the AI-READI project and are expected to be preserved at least
      for the duration of the project, but are not currently shared outside the project team,
      because they have not been mapped to standardised terminologies and because they may
      accidentally include protected health information or personally identifiable information,
      for example in free-text fields. There is a possibility that raw data may be included in
      future releases of the controlled access dataset. Participant images are exported from
      imaging devices in their raw format, with some requiring conversion to DICOM prior to
      upload.

variables:
  - variable_name: HbA1c
    data_type: float
    unit: '%'
    measurement_technique: Whole blood assay
    notes: >-
      Reference range 4.0-6.0 per cent as provided by the testing laboratory. Included as a
      marker for diabetes. Analysed by the University of Washington Nutrition and Obesity
      Research Center.
  - variable_name: Glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay
    notes: Reference range 62-125 mg/dL. Included as a marker for diabetes.
  - variable_name: Insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay
    notes: Reference range 0.0-24.9 ng/mL. Included as a marker for diabetes.
  - variable_name: C peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay
    notes: Reference range 1.1-4.4 ng/mL. Included as an indicator of insulin production.
  - variable_name: N-terminal pro-B-type natriuretic peptide (NT-proBNP)
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma assay
    notes: >-
      Reference range varies by age. Included as a severity and outcome predictor of heart
      failure.
  - variable_name: Troponin-T
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma assay
    notes: Reference range female under 11, male under 16. Included as a marker of myocardial injury.
  - variable_name: C reactive protein, high sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum assay
    notes: >-
      Reference range 0.0-10.0 mg/L. Included as an inflammation marker and risk factor for
      T2DM.
  - variable_name: Total cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: Reference range under 200 mg/dL. Cardiovascular disease risk factor.
  - variable_name: Triglycerides
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: Reference range under 150 mg/dL. Cardiovascular disease risk factor.
  - variable_name: High-density lipoprotein cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel
    notes: Reference range above 39 mg/dL. Cardiovascular disease risk factor.
  - variable_name: Low-density lipoprotein cholesterol (calculated)
    data_type: float
    unit: mg/dL
    derivation: Calculated from the serum lipid panel rather than measured directly.
    notes: Reference range under 130 mg/dL. Cardiovascular disease risk factor.
  - variable_name: Creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay
    notes: >-
      Reference range female 0.38-1.02, male 0.51-1.18 mg/dL. Included as a marker for kidney
      function.
  - variable_name: Urine albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine assay
    notes: >-
      No reference range provided by the testing laboratory. Included as a urinary biomarker
      for early diabetic nephropathy.
  - variable_name: Urine creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Urine assay
    notes: >-
      No reference range provided by the testing laboratory. Included as a urinary biomarker
      for early diabetic nephropathy.
  - variable_name: Continuous glucose measurement
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Dexcom G6 continuous glucose monitor worn for 10 days, recording a measurement every
      5 minutes; participants are masked to the readings during the monitoring period.
    notes: >-
      Participants already wearing a Dexcom G6 may optionally share up to 90 days of
      previously collected glucose values through Dexcom Clarity in addition to the 10-day
      study window, for up to 100 days total.
  - variable_name: MoCA total score
    data_type: integer
    minimum_value: 0
    maximum_value: 30
    measurement_technique: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application; section subscores, Memory Index Score and task completion times are also
      recorded.
    notes: >-
      Higher numbers represent better performance; the maximum score is 30. Educational
      attainment, socioeconomic factors and depression or other mental health conditions may
      affect the score.
  - variable_name: Best-corrected visual acuity (logMAR)
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes tested
      separately, under best-corrected conditions; mesopic acuity measured through a 2.0
      neutral density filter.
    notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate
      better resolution. Snellen visual acuity variables present in earlier dataset versions
      were dropped in version 3.0.0.
  - variable_name: Letter contrast sensitivity (log CS)
    data_type: float
    measurement_technique: >-
      Mars letter contrast sensitivity chart read monocularly under photopic conditions and,
      through a neutral density occluder, under mesopic conditions; testing terminated after
      two consecutive errors or at the end of the chart.
    notes: >-
      Expressed as log sensitivity, with higher numbers meaning better sensitivity. Log CS is
      computed by multiplying the number of errors prior to the final correct letter by 0.04
      and subtracting the result from the log CS value at the final correct letter.
  - variable_name: Monofilament touch perception
    data_type: categorical
    categories:
      - felt
      - not felt
    measurement_technique: >-
      10 g monofilament applied at three locations on each foot, ten times per location, with
      shoes and socks removed and the participant's eyes closed, responding yes or no.
    notes: Insensate areas are retested for confirmation. Used to assess peripheral neuropathy.
  - variable_name: Systolic blood pressure
    data_type: integer
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric medically approved device, measured twice separated by 2 minutes.
    notes: >-
      Readings over 180 mm Hg, or under 100 mm Hg with any symptoms of haemodynamic
      instability, trigger an incidental-finding referral to emergency care.
  - variable_name: Diastolic blood pressure
    data_type: integer
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric medically approved device, measured twice separated by 2 minutes.
    notes: >-
      Readings over 120 mm Hg, or under 60 mm Hg with any symptoms of haemodynamic instability,
      trigger an incidental-finding referral to emergency care.

