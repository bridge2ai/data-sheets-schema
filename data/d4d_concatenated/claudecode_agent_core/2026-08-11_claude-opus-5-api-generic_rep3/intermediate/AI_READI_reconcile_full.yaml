is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification was necessary because no identifiers were collected for the
    released dataset; the project verified that no data identifiable under US HIPAA were
    present. The public set is stripped of Protected Health Information as defined by the
    HIPAA Privacy Rule via the Safe Harbor method.
  identifiers_removed: >-
    Protected Health Information per HIPAA Safe Harbor, plus information related to the sex and
    race/ethnicity of participants and medications used, which are removed from the public set
    to prevent stigmatisation of findings and held under controlled access.
  deidentification_details: >-
    The FAIRhub dataset description records deIdentType "NoDeIdentification" with deIdentDirect
    true, deIdentHIPAA true, deIdentDates false, deIdentNonarr false and deIdentKAnon false.
    Data held under controlled access include 5-digit zip code, sex, race, ethnicity, genetic
    sequencing data, past health records, medications, and traffic and accident reports.
  source_caveats: >-
    The healthsheet questions asking whether measures were taken to avoid re-identification and
    whether any pre-processing for de-identification was performed are left with empty
    responses in the released healthsheet; the de-identification position stated here is drawn
    from the structured FAIRhub dataset description, the README and the Nature Metabolism
    comment.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The public dataset does not contain data considered sensitive. The controlled access
      dataset contains racial and ethnic origin, sex, location at 5-digit zip code granularity,
      genetic sequencing data, past health records, medications, and motor vehicle traffic and
      accident reports. Genomic data are additionally covered by the licence requirement to
      comply with NIH Genomic Data Sharing Policy security and privacy standards.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The dataset creators state that the dataset does not contain data that might be
      considered confidential and that no personally identifiable information is included.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The dataset creators state that the dataset contains no data that, if viewed directly,
      might be offensive, insulting, threatening, or pose a safety risk such as psychological
      safety or anxiety.

human_subject_research:
  involves_human_subjects: true
  irb_approval: >-
    University of Washington IRB approval number STUDY00016228; initial approval received
    20 December 2022, with an annual renewal application required within 90 days of expiration.
    Reliance agreements are in place with the IRBs of the University of Alabama at Birmingham
    and the University of California San Diego.
  ethics_review_board: University of Washington Institutional Review Board
  regulatory_compliance: >-
    Written informed consent provided by all participants. HIPAA Privacy Rule Safe Harbor
    de-identification applied to the public release. Registered on ClinicalTrials.gov as
    NCT06002048. FAIRhub oversight metadata record: not FDA-regulated for drug or device,
    human subject review status "Submitted, approved", no Data Monitoring Committee.
  special_populations: >-
    Adults aged 40 and older; the FAIRhub eligibility record sets a maximum age of 85 years.
    Pregnant individuals, individuals with gestational diabetes and individuals with type 1
    diabetes are excluded. A Community Advisory Board of 11 persons from the three sites,
    including diversity in race and ethnicity as represented in the AI-READI sample,
    contributes to protocol development.
  source_caveats: >-
    The BMJ Open protocol refers to STUDY00016228 as a "Clinicaltrials.org approval number",
    while the FAIRhub study metadata records STUDY00016228 as the UW IRB number and NCT06002048
    as the separate ClinicalTrials.gov identifier. The 85-year upper age bound appears in the
    FAIRhub eligibility record and the IRB exclusion criteria but not in the healthsheet
    eligibility answers.

at_risk_populations:
  at_risk_groups_included: >-
    None targeted. The study enrols competent consenting adults aged 40 and older; minors are
    outside the eligibility window, and pregnancy, gestational diabetes and type 1 diabetes are
    exclusion criteria. Ability to provide consent is an inclusion criterion.
  special_protections: >-
    Transportation assistance (rideshare services) was offered to participants who reported
    barriers to travelling to study visits, and the study covers reasonable parking, public
    transit or rideshare costs related to the study visit. A Community Advisory Board reviews
    consent forms and research protocols and its feedback is incorporated.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      Approval number STUDY00016228, initially approved 20 December 2022, covering the AI-READI
      protocol across all three sites through reliance agreements with the IRBs of the
      University of Alabama at Birmingham and the University of California San Diego. The
      initial approval letter is published with the dataset documentation. Annual renewal
      reporting on study status and progress is required. Written informed consent is obtained
      from all participants.
    contact_person: AI-READI study team, contact@aireadi.org
  - reviewing_organization: AI-READI Ethics module and bioethicists within the consortium
    review_details: >-
      Ethical, legal and social implications are considered at every stage of the project cycle.
      The study design process enacted ethical and equitable data collection and management
      practices as well as data sharing with adherence to the FAIR principles, including
      guidance from bioethicists. The project reviewed existing documentation approaches such as
      datasheets and healthsheets to identify the most suitable one for biomedical data, and
      publishes a healthsheet with each dataset version.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically (e-consent via REDCap with
      electronic signature) before the visit or in person at the start of the visit for
      participants who did not select the electronic option.
    consent_scope: >-
      Consent covers participation in the full protocol including questionnaires, on-site
      procedures, biospecimen collection, at-home device monitoring, access to medical and
      driving records, banking of biospecimens for future research, and placement of the data
      in an open-source repository. Informed consent was required before participation in any
      part of the protocol, including questionnaires.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington, is
      published with the dataset documentation. The other clinical sites operated under IRB
      reliance and used the same consent form with minor institution-specific language
      incorporated according to individual institutional requirements. Upon signing, the signed
      e-consent form is automatically emailed to the participant, who may request additional
      copies from the study coordinator for the duration of the study.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would stay in the dataset;
      this is clearly communicated in the consent document.

collection_consents:
  - consent_details: >-
      Potential participants were given the option to read all consent documentation
      electronically before their visit and to give consent with an electronic signature without
      verbal communication with a clinical research coordinator. Participants may access the
      e-consent documentation in REDCap and decide at that point that they do not wish to
      participate or would like additional information; they may request a call back from study
      staff or a video conference. Only the screening questionnaire is available before consent
      is given. Those without internet access may call research staff for alternative methods of
      enrolment.

collection_notifications:
  - notification_details: >-
      Each individual was aware of the data collection, as this was active data collection
      directly from participants rather than passive collection or secondary use of existing
      data. Individuals in each recruitment pool were mailed a personalised hardcopy invitation
      letter and sent an invitation email directing them to the online REDCap recruitment
      interface, where they could read an overview of the research programme, expectations for
      participation and answers to frequently asked questions.

consent_revocations:
  - revocation_details: >-
      Participants may withdraw consent at any time and cease study participation. Data already
      shared or used at the point of withdrawal remain in the dataset. This limitation is stated
      in the consent document.

participant_compensation:
  - compensation_provided: true
    compensation_amount: USD 200
    compensation_type: Monetary stipend, plus reimbursement of reasonable travel costs
    compensation_rationale: >-
      A USD 200 stipend is provided for the study visit, funded through the NIH grant. Payment is
      made once the final data are received and the study devices are returned, typically at
      least two weeks after the study visit to allow for the 10-day home monitoring period and
      return shipping; payment is not prorated. The study additionally covers reasonable costs
      for parking, public transit or rideshare fees related to the study visit. The same type and
      amount of compensation applies to participants invited back in year 4.
    notes: >-
      Costs for transport exceeding USD 25 may not be reimbursed, according to the IRB protocol's
      statement on economic burden.

participant_privacy:
  - anonymization_method: >-
      HIPAA Safe Harbor removal of Protected Health Information from the public set, plus removal
      of sex, race/ethnicity and medication information; verification that no identifiable data
      per US HIPAA are present.
    privacy_techniques: >-
      A robust data dissemination system, verified-ID login, a strict licence agreement with
      explicit anti-re-identification obligations, and data watermarking for both the public and
      controlled sets. Study procedures were conducted in private rooms. Identifiable information
      is kept on encrypted servers or in locked cabinets or rooms with restricted access, with
      access limited to authorised research personnel. The environmental sensor and fitness
      tracker were chosen because they capture no video or audio, have no GPS location monitoring
      and are not synced with participant-owned devices.
    reidentification_risk: >-
      Characterised by the project as a theoretical risk of future re-identification. AI
      algorithms can infer individual patient characteristics and could facilitate
      individual-level identification, which is the stated motivation for the dissemination
      controls, licence and watermarking.
    data_linkage: >-
      Recruitment pools were linked to electronic health records for screening, and controlled
      access data include past health records and traffic and accident records obtained from
      third parties; the released public data contain no direct or indirect identifiers.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted, according to the healthsheet
      response to the question about analysis of the potential impact of the dataset and its use
      on data subjects.

license_and_use_terms:
  license_terms: >-
    A custom licence specifically tailored to enable reuse of the AI-READI dataset for commercial
    or research purposes while imposing strong requirements around data usage, security and
    secondary sharing to protect study participants, especially when data are reused for AI and
    ML applications. Version 3.0.0 is governed by "AI-READI custom license v2.0"
    (https://doi.org/10.5281/zenodo.17555036). The earlier version 1.0 of the licence, issued as
    a University of Washington Data License Agreement, grants a non-exclusive, non-transferable
    licence to download, reproduce and use the data and create derivative works for research and
    commercial purposes; prohibits transfer or sharing with any third party other than another
    licensee bound by identical terms; permits distribution of models, algorithms and programs
    trained on the data provided they do not themselves contain the data and provided reasonable
    efforts are made to minimise memorisation or reconstruction of the data; prohibits clinical
    treatment decisions and any re-identification attempt; requires acknowledgement of the source
    and any funder in publications; requires compliance with NIH Genomic Data Sharing Policy
    security best practices; terminates automatically on breach, requiring deletion of all
    copies; retains title and all intellectual property rights with the Licensor and its
    suppliers; disclaims all warranties; caps aggregate liability at one US dollar except where
    prohibited by law; and requires the licensee to indemnify the Licensor.
  data_use_permission: disease_specific_research
  contact_person: >-
    See the README file included with the dataset, and https://aireadi.org/contact; central
    contact Aaron Lee, contact@aireadi.org.
  notes: >-
    Access requires logging in through a verified ID system, agreeing to use the data only for
    type 2 diabetes related research, and agreeing to the licence terms. The FAIRhub dataset
    landing page labels the licence simply as "Health Data License". The consent metadata records
    consentType "ConsentSpecifiedNotElsewhereCategorised" with the note that the public version
    can only be used for type 2 diabetes related research while a private version will allow more
    generic use.
  source_caveats: >-
    Two licence artefacts appear in the input bundle: the University of Washington Data License
    Agreement v1.0 (Zenodo record 10642459), whose full text is included, and "AI-READI custom
    license v2.0" (https://doi.org/10.5281/zenodo.17555036), which is the licence cited for
    version 3.0.0 but whose text is not included in the bundle. The clause-level terms summarised
    above are those of v1.0 and may not all carry over unchanged into v2.0.

ip_restrictions:
  restrictions: >-
    Under the University of Washington Data License Agreement v1.0, title to the data and all
    industrial and intellectual property rights therein remain solely and exclusively with the
    Licensor and its suppliers; the licensee must take no action inconsistent with such ownership,
    and any rights not expressly granted are reserved. The healthsheet answers the question about
    third-party IP-based restrictions by referring to the licence. There are no plans by the data
    collectors to develop commercial products or file patents, but the dataset is made available
    with a commercial-friendly licence and products or patents may be developed from it in future.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions: >-
    The healthsheet answers the question about export controls and other regulatory restrictions
    by referring to the licence (https://doi.org/10.5281/zenodo.17555036). No export control
    regime is identified in the input bundle.
  other_compliance: >-
    The licence requires compliance with all data security and privacy standards established by
    the US National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH
    Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy. Licensees
    must also comply with all applicable laws, regulations and restrictions relating to the
    distribution and use of the data and of any models derived from it. The public release applies
    HIPAA Safe Harbor. Data were collected in the USA.
  governance_committee_contact: >-
    Access requirements for the controlled access dataset are developed by the AI-READI Data Access
    Committee; general contact at https://aireadi.org/contact.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed and available for public use through the FAIRhub platform, with
      access gated by verified-ID login, a use-scope self-attestation and licence acceptance.
      Onward sharing by licensees is restricted: a licensee may give access only to another
      licensee bound by an identical agreement with the Licensor, for the purpose of collaborating
      on projects involving the data.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for all retinal imaging directories (retinal_flio, retinal_oct, retinal_octa,
      retinal_photography).
  - format: CSV
    media_type: text/csv
    notes: >-
      Used for OMOP CDM clinical data tables and for tabular device exports. All data files are in
      formats accessible with freely available software; no specific software is required.
  - format: JSON
    media_type: application/json
    notes: >-
      Used for Open mHealth wearable activity and continuous glucose monitoring data and for
      CDS metadata files (dataset_description.json, dataset_structure_description.json,
      study_description.json, participants.json, dqd_omop.json).
  - format: Markdown
    media_type: text/markdown
    notes: >-
      Used for CDS documentation files distributed with the dataset (README.md, CHANGELOG.md,
      healthsheet.md).
  - format: TSV
    notes: >-
      Used for the per-datatype manifest.tsv metadata files and for participants.tsv, which carries
      the recommended train/validation/test split assignment.
  - format: WFDB
    notes: >-
      WaveForm DataBase file set standard used for the 12-lead electrocardiography data.
  - format: ASCII text
    notes: >-
      Environmental sensor data follow the NASA ESDS ASCII File Format Guidelines for Earth Science
      Data.

distribution_dates:
  - release_dates:
      - '2024-05-03'
      - '2024-11-08'
      - '2025-11-17'
    notes: >-
      Version 1.0.0 (pilot data, 204 participants) released 3 May 2024; version 2.0.0 (1,067
      participants) released 8 November 2024; version 3.0.0 (2,280 participants) released
      17 November 2025. New versions are planned approximately annually as enrolment continues.
    source_caveats: >-
      The BMJ Open protocol states that the publicly accessible pilot dataset was made available in
      May 2024 and that all data collected through 31 July 2024 were made available in November
      2024, and at one point anticipates the second release in November 2024; the FAIRhub
      healthsheet instead describes version 3.0.0 as covering collection through 1 May 2025.

version_access:
  versions_available: >-
    Version 1.0.0 (DOI 10.60775/fairhub.1, 3 May 2024, pilot phase, 204 participants); version
    2.0.0 (DOI 10.60775/fairhub.2, 8 November 2024, 1,067 participants, 2.01 TB, 165,051 files);
    version 3.0.0 (DOI 10.60775/fairhub.3, 17 November 2025, 2,280 participants, 3.82 TB, 356,343
    files). Version 2.0.0 is marked on FAIRhub as no longer accessible, with users directed to the
    latest version. Documentation is versioned in parallel at docs.aireadi.org with a version
    selector for v1.0.0, v2.0.0 and v3.0.0.
  latest_version_doi: 10.60775/fairhub.3
  version_details: >-
    Each version is a static release rather than an in-place update; the dataset will not be
    updated, and new versions are released with additional instances as more participants complete
    the study visit. Changes between versions are documented in the CHANGELOG file included with
    the dataset and visible at docs.aireadi.org. Cumulative participant counts by contributing
    tranche: v1.0.0 pilot 204; year 2 data 863; year 3 data 1,213; v3.0.0 total 2,280. Version
    3.0.0 adds three imaging devices relative to earlier releases (version 2.0.0 had added one),
    drops the Snellen visual acuity variables in favour of logMAR only, and introduces the
    recommended 70/15/15 data split. A smaller "mini" version of the dataset is available for
    pipeline development, and Azure Storage access is described in the version 3.0.0 preliminary
    information documentation.
  source_caveats: >-
    The healthsheet states that a datasheet exists for each of versions 1 and 2 at
    docs.aireadi.org/docs/1/dataset/healthsheet and docs.aireadi.org/docs/2/dataset/healthsheet;
    those documents are not part of this input bundle.

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset gets released as static versions and will not be updated in place. New versions are
    released approximately once a year with additional data from participants enrolled since the
    previous release. Enrolment is ongoing and future versions are expected with larger numbers of
    participants. Older versions are not maintained as accessible releases: version 2.0.0 is marked
    on FAIRhub as no longer accessible, with users directed to the latest version, although the
    versioned documentation for superseded releases remains published.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub through
      Microsoft Azure. Contact information is provided in the README file included with the dataset
      and at https://aireadi.org/contact; the central contact of record is Aaron Lee
      (contact@aireadi.org). Additional contact person, author and contributor information is
      recorded in the study_description.json and dataset_description.json metadata files included
      with the dataset.
    notes: >-
      The FAIRhub landing pages and the documentation site both carry the notice "This repository is
      under review for potential modification in compliance with Administration directives."

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. Participants
    were not told that their data would be retained for a fixed period and then deleted.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.
  contribution_url: https://github.com/AI-READI

external_resources:
  - external_resources:
      - https://docs.aireadi.org/
      - https://aireadi.org/
      - https://zenodo.org/communities/aireadi
      - https://github.com/AI-READI
      - https://fairhub.io/
      - https://cds-specification.readthedocs.io/en/v0.1.1/
      - https://doi.org/10.1136/bmjopen-2024-097449
      - https://doi.org/10.1038/s42255-024-01165-x
      - https://doi.org/10.5281/zenodo.17555036
      - https://classic.clinicaltrials.gov/ct2/show/NCT06002048
      - https://reporter.nih.gov/project-details/10471118
      - https://aireadi.org/goals/data-sharing
      - https://shileyeye.ucsd.edu/research/ai_readi
    archival: >-
      The dataset itself is self-contained; it relies on the documentation at docs.aireadi.org only
      for users requiring additional information about provenance. Licence terms are archived on
      Zenodo with DOIs, and dataset versions are archived on FAIRhub with DOIs.
    future_guarantees: >-
      The documentation is expected to remain available alongside each dataset version; one version
      of the documentation is maintained per dataset version.
    restrictions: >-
      The documentation is shared under the CC-BY 4.0 licence, so there are no restrictions
      associated with its use.
    notes: >-
      The BMJ Open protocol paper is distributed under CC BY-NC 4.0 and permits non-commercial reuse
      with attribution.

related_datasets:
  - relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.60775/fairhub.2
    description: >-
      Version 2.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI Project, released
      8 November 2024 with 1,067 participants, 165,051 files and 2.01 TB. Marked on FAIRhub as no
      longer accessible.
  - relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.60775/fairhub.1
    description: >-
      Version 1.0.0 of the Flagship Dataset of Type 2 Diabetes from the AI-READI Project, released
      3 May 2024, comprising data from the pilot data collection phase with 204 participants.
  - relationship_type: is_documented_by
    target_dataset: https://docs.aireadi.org/
    description: >-
      Versioned documentation for the AI-READI dataset, including the citation section, preliminary
      information on access and training prerequisites, per-domain dataset documentation, the
      healthsheet, controlled variables, AI-readiness considerations and additional resources.
  - relationship_type: is_described_by
    target_dataset: https://doi.org/10.1136/bmjopen-2024-097449
    description: >-
      Owsley C, Matthies DS, McGwin G, et al. Cross-sectional design and protocol for Artificial
      Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI). BMJ Open
      2025;15:e097449.
  - relationship_type: is_described_by
    target_dataset: https://doi.org/10.1038/s42255-024-01165-x
    description: >-
      AI-READI Consortium. AI-READI: rethinking AI data collection, preparation and sharing in
      diabetes research and beyond. Nature Metabolism 2024;6:2210-2212.