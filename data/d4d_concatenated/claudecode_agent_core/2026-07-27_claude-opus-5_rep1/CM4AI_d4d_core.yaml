ethical_reviews:
- id: CM4AI_ethical_review_ravitsky
  name: CM4AI ethical review contact, Vardit Ravitsky
  description: Named under Ethical Review in the Data Governance & Ethics section of the June 2025, October
    2025 and June 2026 CM4AI Dataverse release records as Vardit Ravitsky (ravitskyv@thehastingscenter.org),
    ORCID 0000-0002-7080-8801, of The Hastings Center. The Dataverse author list and the CM4AI preprint
    both record Vardit Ravitsky's affiliation as University of Montreal, while the ethical review contact
    email is at The Hastings Center, which the CM4AI data releases page also names as a collaborating
    institution.
  contact_person: https://orcid.org/0000-0002-7080-8801
  reviewing_organization: CM4AI_org_hastings
  review_details:
  - The CM4AI Ethics Module worked closely with the Data Acquisition, Tools and Standards Modules to develop
    a plan for ethical preparation, licensing, dissemination and Data Access supervision of CM4AI datasets.
  - The Ethics team employs a methodology inspired by Value-Sensitive Design, creating an axiological
    repository of values to guide the articulation of design standards and expectations, and formulating
    the CM4AI Life Cycle framework that elucidates governance milestones throughout data generation and
    AI system development.
- id: CM4AI_ethical_review_belisle_pipon
  name: CM4AI ethical review contact, Jean-Christophe Belisle-Pipon
  description: Named under Ethical Review in the Data Governance & Ethics section of the June 2025, October
    2025 and June 2026 CM4AI Dataverse release records as Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca),
    ORCID 0000-0002-8965-8153, of Simon Fraser University.
  contact_person: https://orcid.org/0000-0002-8965-8153
  reviewing_organization: CM4AI_org_sfu
  review_details:
  - The Ethics Pillar established guidelines addressing socio-ethical challenges and conducted preliminary
    work to develop a first version of the Value Repository supporting those guidelines.
  - The Ethics team conducts mixed empirical research combining qualitative and quantitative methods to
    capture community insights, and is developing tools to enhance awareness of the ethical, legal and
    social ramifications associated with CM4AI data and the AI systems derived from it.
data_protection_impacts:
- id: CM4AI_data_protection_impact
  name: Data protection posture
  impact_details:
  - CM4AI data are non-clinical, derived from tissue cultures, and are considered to be de-identified
    as they cannot be matched, with current knowledge, to a human subject, so the project reports no participant
    re-identification exposure.
  - The Dataverse release records state Human Subjects - No, De-identified Samples - Yes and FDA Regulated
    - No.
  - Ethical conditions adopted by the project include ethical treatment of subjects including protection
    of human subjects data, and licensing and distribution of data, software and models with openness
    to the scientific community for reuse consistent with protection of human subjects privacy and adherence
    to responsible research conduct.
human_subject_research:
  id: CM4AI_human_subject_research
  name: Human subjects determination
  description: The CM4AI data releases record that the distributed data do not constitute human subjects
    research.
  involves_human_subjects: false
  ethics_review_board:
  - CM4AI Ethics Module, with review contacts Vardit Ravitsky (The Hastings Center) and Jean-Christophe
    Belisle-Pipon (Simon Fraser University).
  - CM4AI Data Governance Committee, contact Jillian Parker (University of California San Diego).
  - A Data Access Committee supervises ethical matters related to dataset distribution and potential dual
    licensing for commercial use.
  regulatory_compliance:
  - 'Dataverse Data Governance & Ethics section: Human Subjects - No; De-identified Samples - Yes; FDA
    Regulated - No.'
  - No IRB approval identifier is reported in the captured sources; the project states its data are non-clinical
    and derived from tissue cultures.
informed_consent:
- id: CM4AI_informed_consent
  name: Consent basis for the distributed material
  description: No consent process for human research participants applies to the distributed data, which
    derive from established human cell lines rather than from enrolled participants.
  consent_scope:
  - The distributed data derive from the commercially available MDA-MB-468 breast cancer cell line and
    the KOLF2.1J induced pluripotent stem cell line, both of which the project states have been ethically
    sourced.
  - MDA-MB-468 (RRID CVCL_0419) is available from ATCC; KOLF2.1J (RRID CVCL_B5P3) is available from the
    Human Induced Pluripotent Stem Cells Initiative resource and is available for access by non-for-profit
    organizations via a simple MTA.
  consent_documentation:
  - No participant consent documentation is reported; the Dataverse release records state Human Subjects
    - No and De-identified Samples - Yes.
at_risk_populations:
  id: CM4AI_at_risk_populations
  name: At-risk population assessment
  description: The distributed data do not involve enrolled human participants, so no at-risk participant
    groups are included.
  at_risk_groups_included: false
  special_protections:
  - The project states that CM4AI data are non-clinical, from tissue cultures, and are considered to be
    de-identified as they cannot be matched, with current knowledge, to a human subject.
  - The only donor characteristics reported are those of the parental cell lines - a 51-year-old black
    female with metastatic mammary adenocarcinoma for MDA-MB-468, and a healthy male Northern European
    donor for KOLF2.1J - which are documented public attributes of established cell lines rather than
    data collected from research participants.
is_deidentified:
  id: CM4AI_deidentification
  name: De-identification status
  description: The CM4AI Dataverse release records state De-identified Samples - Yes.
  identifiable_elements_present: false
  method: Data are generated from established, commercially available or repository-supplied human cell
    lines rather than from identifiable human participants.
  deidentification_details:
  - CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue cultures) and
    are considered to be de-identified as they cannot be matched, with current knowledge, to a human subject.
  - Data in this release was derived from commercially available de-identified human cell lines.
