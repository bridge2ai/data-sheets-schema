instances:
- id: CM4AI_instance_perturb_seq_kolf2
  name: CRISPRi perturb-seq single-cell transcriptomes in KOLF2.1J iPSCs
  description: An expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J
    human induced pluripotent stem cells (hiPSCs) mapping transcriptional and fitness phenotypes associated
    with 11,739 targeted genes. The associated raw sequence data are distributed as a separate archive.
    The count recorded here is the number of targeted genes reported by the release file descriptions
    and by the CM4AI web portal, not a count of sequenced cells, which the captured sources do not report.
  instance_type: single-cell CRISPRi perturbation transcriptome profile
  counts: 11739
  label: false
- id: CM4AI_instance_perturb_seq_mda
  name: CRISPRi perturb-seq profiles in MDA-MB-468 breast cancer cells
  description: Perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment, included
    in the October 2025 and June 2026 releases. The CM4AI preprint reports single-cell CRISPR screens
    perturbing 100 chromatin regulators in MDA-MB-468 cells under three conditions (no treatment, paclitaxel
    or vorinostat) using a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs
    per gene and the 10x Genomics 3'HT kit. The captured sources report the number of perturbed genes
    but not a count of profiled cells or of released instances, so no instance count is asserted.
  instance_type: single-cell CRISPRi perturbation transcriptome profile
  label: false
- id: CM4AI_instance_sec_ms
  name: SEC-MS protein elution profiles
  description: Size exclusion chromatography-mass spectrometry (SEC-MS) protein complex and interaction
    data for undifferentiated KOLF2.1J iPSCs, iPSC-derived neural progenitor cells, neurons and cardiomyocytes,
    and for MDA-MB-468 breast cancer cells with and without paclitaxel or vorinostat treatment, generated
    in the Nevan Krogan laboratory at the University of California San Francisco. The CM4AI web portal
    reports curated SEC-MS datasets capturing approximately 7,000 proteins for both the iPSC-derived and
    the TNBC arms. The portal's separate Data Insights figures of 1,374 protein interactions and 7,023
    total proteins investigated are project-wide totals across all modalities, not SEC-MS instance counts,
    so no instance count is asserted here.
  instance_type: protein size-exclusion elution profile
  label: false
- id: CM4AI_instance_ap_ms
  name: AP-MS interactome data in MDA-MB-468 cells
  description: Affinity purification mass spectrometry interactome data for MDA-MB-468 breast cancer cells
    with treatment, first distributed in the June 2026 release as separate paclitaxel and vorinostat archives.
    The CM4AI preprint reports endogenous tagging of 17 genes in MDA-MB-468 with AP-MS acquired under
    three conditions (untreated, paclitaxel and vorinostat treated), with 34 additional genes then being
    tagged.
  instance_type: affinity purification mass spectrometry interaction record
  label: false
- id: CM4AI_instance_if_images
  name: Immunofluorescence confocal images of MDA-MB-468 cells
  description: Immunofluorescence-based staining (ICC-IF) confocal microscopy images showing the spatial
    localization of proteins of interest in MDA-MB-468 breast cancer cells, untreated or treated with
    paclitaxel or vorinostat, acquired in the Lundberg Lab at Stanford University. Nuclei were stained
    with DAPI (blue channel); endoplasmic reticulum with a calreticulin antibody (yellow channel); microtubules
    with tubulin antibody (red channel); and antibody against protein of interest (green channel). The
    March 2025 release covers 563 proteins of interest; the June 2025, October 2025 and June 2026 releases
    cover 464 proteins of interest. The CM4AI web portal reports 53,788 immunofluorescent images across
    the project.
  instance_type: four-channel immunofluorescence confocal image
  counts: 53788
  label: false
- id: CM4AI_instance_ro_crate_metadata
  name: RO-Crate metadata and provenance graph records
  description: Each release ships RO-Crate metadata documents, release-level RO-Crate manifests with pointers
    to sub-crates, HTML provenance graph renderings and an HTML release datasheet. FAIRSCAPE registers
    each crate and its component datasets, models and software, assigns ARK persistent identifiers, and
    computes end-to-end provenance entailments expressed in the EVI Evidence Graph Ontology, serialized
    as JSON-LD and RDF-XML.
  instance_type: RO-Crate metadata document
  label: false
sampling_strategies:
- id: CM4AI_sampling_target_selection
  name: Target and cell-system selection
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Human chromatin modifiers and metabolic enzymes implicated in cancer, neuropsychiatric and cardiac
    disorders
  - MDA-MB-468 triple-negative breast cancer cell line (RRID CVCL_0419), available from ATCC
  - KOLF2.1J induced pluripotent stem cell line (RRID CVCL_B5P3), available from the Human Induced Pluripotent
    Stem Cells Initiative (HipSci)
  strategies:
  - Multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
    neuropsychiatric and cardiac disorders
  - Spatial proteomics mapping of 100 chromatin regulators in MDA-MB-468 cells with and without paclitaxel
    or vorinostat, with a further 500 proteins pending significant hits from genetic perturbation and
    PPI results
  - Expressed genome-scale CRISPRi perturbation covering 11,739 targeted genes in undifferentiated KOLF2.1J
    iPSCs
  - Single-cell CRISPR screens of 100 chromatin regulators with and without drug in MDA-MB-468 cells,
    using a lentiviral library with 6 guide RNAs per gene
  - Immunofluorescence coverage of 563 proteins of interest in the March 2025 release and 464 proteins
    of interest in the June 2025, October 2025 and June 2026 releases
  why_not_representative:
  - Data in this release was derived from commercially available de-identified human cell lines and does
    not represent all biological variants which may be seen in the population at large.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq data
    interrogate sets of proteins which incompletely overlap.
acquisition_methods:
- id: CM4AI_acquisition_laboratory_measurement
  name: Direct laboratory measurement with derived analytical products
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Protein-protein interactions were directly measured by affinity purification mass spectrometry on
    endogenously tagged cell lines and by size-exclusion chromatography coupled to mass spectrometry for
    proteome-wide complex and interaction mapping, as two orthogonal mass spectrometry based approaches.
  - Protein subcellular localization was directly observed by immunofluorescence staining and high-resolution
    confocal microscopy using Human Protein Atlas antibodies, with automated fixation and permeabilization
    protocols established on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
  - Genetic perturbation phenotypes were directly measured by single-cell CRISPRi screens read out by
    single-cell RNA sequencing.
  - Derived products, including embeddings, co-embeddings and hierarchical cell maps, are computed from
    the measured modalities by the Multi-Scale Integrated Cell (MuSIC) pipeline; the CM4AI releases state
    that computed cell maps are not included in the current release.
  - Quality control is applied at acquisition; the CM4AI preprint reports that single-cell CRISPR screen
    data were undergoing QC at the time of writing, and the CM4AI perturbation atlas findings were validated
    via phenotypic, protein-interaction and metabolic tracing assays.
collection_mechanisms:
- id: CM4AI_mechanism_ap_ms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - AP-MS was performed on endogenously tagged cell lines to map protein-protein interactions of chromatin
    regulators under cancer conditions (no treatment, paclitaxel or vorinostat) and iPSC conditions (undifferentiated,
    neurons and cardiomyocytes).
  - The CM4AI preprint reports endogenous tagging of 17 genes in MDA-MB-468 and AP-MS acquisition under
    three conditions, with 34 additional genes in the process of being tagged.
- id: CM4AI_mechanism_sec_ms
  name: Size exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS was performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel and vorinostat
    treated), identifying 72 of 100 chromatin modifiers, 52 of them integral components of protein complexes,
    and detecting PPI profiles of over a thousand complexes with thousands of proteins exhibiting differential
    elution profiles between control and treated cells.
  - SEC-MS was also performed in KOLF2 iPSCs and derivatives, uncovering more than 700 protein complexes
    in both parental iPSCs and differentiated neurons.
- id: CM4AI_mechanism_if_imaging
  name: Immunofluorescence confocal imaging (ICC-IF)
  mechanism_details:
  - Spatial subcellular organization was mapped using the Human Protein Atlas resource of antibodies,
    with automated fixation and permeabilization protocols implemented on a pipetting robot for MDA-MB-468
    and KOLF2 cell lines.
  - Each image is four-channel - DAPI for nuclei (blue), calreticulin antibody for endoplasmic reticulum
    (yellow), tubulin antibody for microtubules (red), and antibody against the protein of interest (green).
  - The June 2025 release added RGB immunofluorescent images to the previously distributed image data.
- id: CM4AI_mechanism_crispr_perturbseq
  name: Single-cell CRISPRi perturbation sequencing (perturb-seq)
  mechanism_details:
  - MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9 were generated and characterized.
  - A CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene was designed
    for the cancer arm; single-cell CRISPR screens were run in MDA-MB-468 cells with and without drug
    and in undifferentiated KOLF2.1J iPSCs using the 10x Genomics 3'HT kit.
  - An expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J hiPSCs maps
    transcriptional and fitness phenotypes for 11,739 targeted genes.
data_collectors:
- id: CM4AI_collector_lundberg_lab
  name: Lundberg Lab, Stanford University
  role: Spatial proteomics and immunofluorescence image acquisition
  collector_details:
  - Immunofluorescence images of MDA-MB-468 cells, untreated and treated with paclitaxel or vorinostat,
    were imaged by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg
    Lab at Stanford University.
  - IF images for the cell line and conditions are downloaded from the Lundberg Laboratory's deposition
    archive for further processing by the MuSIC pipeline.
- id: CM4AI_collector_krogan_lab
  name: Nevan Krogan laboratory, University of California San Francisco
  role: Mass spectrometry proteomics (SEC-MS and AP-MS)
  collector_details:
  - SEC-MS datasets on undifferentiated KOLF2.1J hiPSCs and on MDA-MB-468 cells following vorinostat or
    paclitaxel treatment were generated in the Nevan Krogan laboratory at the University of California
    San Francisco.
  - PPI networks for the cell line and conditions are downloaded from the Krogan Laboratory's deposition
    archive for further processing by the MuSIC pipeline.
- id: CM4AI_collector_mali_lab
  name: Mali laboratory and collaborators, University of California San Diego
  role: CRISPRi perturbation screening and perturbation cell atlas
  collector_details:
  - The CRISPRi Perturbation Cell Atlas of human induced pluripotent stem cells distributed in the CM4AI
    releases is reported by Nourreddine S, Doctor Y, Dailamy A and colleagues with Mali P as senior author.
- id: CM4AI_collector_uva_standards
  name: CM4AI Standards Module, University of Virginia
  role: AI-readiness packaging, persistent identifier assignment and repository deposit
  collector_details:
  - The Standards Module is responsible for AI-Readiness packaging of data, software, metadata and provenance
    graphs, performed by the FAIRSCAPE framework.
  - Justin Niestroy of the University of Virginia is recorded as Depositor for the CM4AI Dataverse releases.
collection_timeframes:
- id: CM4AI_timeframe_award_period
  name: Funded project period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details:
  - NIH RePORTER records project start 2022-09-01 and project end 2026-08-31 for core project OT2OD032742.
  - The release metadata states that the dataset will be regularly updated and augmented through the end
    of the project in November 2026, which does not match the NIH RePORTER project end date of 2026-08-31.
- id: CM4AI_timeframe_dataverse_creation
  name: Dataverse-recorded data creation and deposit
  start_date: '2025-02-27'
  end_date: '2026-07-15'
  timeframe_details:
  - Every captured CM4AI Dataverse release record, including the June 2026 release, reports Data Creation
    Date 2025-02-27 and Deposit Date 2025-02-27; these values appear to be carried forward unchanged across
    releases.
  - Individual files carry their own publication dates, ranging from 2025-03-03 in the March 2025 release
    to 2026-07-15 for the immunofluorescence archives of the June 2026 release.
  - The source manifest records that version 2 of the June 2026 release was released at 2026-07-15T20:28:19Z.
missing_data_documentation:
- id: CM4AI_missing_data
  name: Known gaps in the current release
  missing_data_patterns:
  - Computed cell maps are not included in the current release.
  - Some datasets are under temporary pre-publication embargo; the June 2026 release lists perturb-seq
    data in KOLF2.1J iPSCs and perturb-seq data in MDA-MB-468 cells as Embargoed external data links.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq data
    interrogate sets of proteins which incompletely overlap.
  - The CM4AI web portal flagship dataset summary marks IF images for the iPSC arm and AP-MS interactomes
    for the TNBC arm as "coming soon"; AP-MS archives for MDA-MB-468 with treatment first appear in the
    June 2026 release, and no iPSC IF image archive appears in any captured release.
  - The captured June 2025 release page lists 21 files but displays only the first 10, so the file inventory
    recorded for that historical release is incomplete.
  missing_data_causes:
  - Interim, quarterly beta release schedule with staged publication of modalities.
  - Temporary pre-publication embargoes on datasets whose primary publications are pending.
  handling_strategy: Gaps are declared explicitly in the Completeness and External Data Links sections
    of each release record, and the release metadata states that the dataset will be regularly updated
    and augmented on a quarterly basis through the end of the project.
anomalies:
- id: CM4AI_anomaly_stale_release_metadata
  name: Stale or inconsistent release metadata fields
  anomaly_details:
  - 'The CM4AI data releases page displays "June 2026 Data Release (Beta), doi.org/10.18130/V3/HIGT4C,
    Released on: June 17, 2025", while the Dataverse citation metadata for the same DOI reports Publication
    Date 2026-06-17 and a 2026 citation year. The Dataverse metadata is the authoritative record and the
    web page year appears to be an error.'
  - The June 2026 release description block ends with the parenthetical date "(2025-06-30)", the same
    trailing date carried by the June 2025 and October 2025 release descriptions, indicating that the
    descriptive text was carried forward without updating its timestamp.
  - Data Creation Date 2025-02-27 and Deposit Date 2025-02-27 are recorded identically on the March 2025,
    June 2025, October 2025 and June 2026 releases, although files in later releases were published as
    late as 2026-07-15.
  - Displayed Dataverse version numbers and citation version labels disagree - the March 2025 release
    displays Version 1.4 with citation V1, the June 2025 release displays Version 2.1 with citation V2
    and an informational notice that the DRAFT version was not found, and the October 2025 release displays
    Version 2.1 with citation V2. The June 2026 release displays Version 2.0 with citation V2.
  - The June 2025 release has Publication Date 2025-07-01 and image archives published 2025-10-22, so
    the release name, the publication date and the file publication dates do not coincide.
- id: CM4AI_anomaly_file_content_changes
  name: Same-named archives differ between releases
  anomaly_details:
  - The immunofluorescence archives cm4ai_ifimages_MDA-MB-468_paclitaxel.zip, cm4ai_ifimages_MDA-MB-468_untreated.zip
    and cm4ai_ifimages_MDA-MB-468_vorinostat.zip carry identical MD5 checksums in the June 2025 and October
    2025 releases but different MD5 checksums in the June 2026 release, so the image archives were replaced
    for the current release even though the file names and displayed sizes are unchanged.
  - The archives cm4ai_mass-spec_KOLF2.zip (23.8 MB in October 2025 versus 171.8 KB in June 2026), cm4ai_mass-spec_MDA-MB-468.zip
    (23.0 MB versus 93.9 KB), cm4ai_perturb-seq_KOLF2_cell_atlas.zip (24.6 KB versus 30.2 KB), cm4ai_perturb-seq_KOLF2_raw_sra.zip
    (79.6 KB versus 73.3 KB) and cm4ai_release_metadata.zip (203.5 KB versus 1.1 MB) all change size and
    checksum between the October 2025 and June 2026 releases.
  - The untreated immunofluorescence archive is described in the June 2025 and October 2025 releases as
    "the spatial localization of 464 proteins of interest in cells of the breast cancer cell line MDA-MB-468
    treated as imaged by immunofluorescence-based staining", omitting the treatment condition that the
    file name and the release description identify as untreated.
- id: CM4AI_anomaly_incomplete_modality_overlap
  name: Incomplete overlap between modalities
  anomaly_details:
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq data
    interrogate sets of proteins which incompletely overlap, so joint multimodal analyses cover only the
    intersection of the assayed protein sets.
known_biases:
- id: CM4AI_bias_cell_line_representation
  name: Cell-line derivation limits population representativeness
  bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified human cell
    lines and does not represent all biological variants which may be seen in the population at large.
    MDA-MB-468 derives from a single 51-year-old black female donor with metastatic mammary adenocarcinoma
    and KOLF2.1J derives from a single healthy male Northern European donor, so genetic background variation
    across human populations is not sampled.
  mitigation_strategy: The release metadata declares this limitation explicitly under Potential Sources
    of Bias, and the project design extends coverage across cell types, differentiation states and treatment
    conditions rather than across donors.
  affected_subsets:
  - All measurement modalities in all captured releases
- id: CM4AI_bias_target_selection
  name: Targeted rather than unbiased protein selection
  bias_type: selection_bias
  bias_description: The interrogated proteins were chosen as 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric and cardiac disorders, with imaging coverage extended
    to their interactors and key signaling molecules. Coverage is therefore concentrated on chromatin
    and metabolic biology rather than being a uniform sample of the proteome.
  mitigation_strategy: Proteome-wide SEC-MS and expressed genome-scale CRISPRi perturbation broaden coverage
    beyond the targeted panels within the assays that permit it.
  affected_subsets:
  - AP-MS interactome data
  - Immunofluorescence image data
known_limitations:
- id: CM4AI_limitation_interim_release
  name: Interim beta release
  limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps, which will
    be added in future releases, and some datasets are under temporary pre-publication embargo.
  scope_impact: Users receive the multimodal input data streams but not the integrated hierarchical cell
    maps that are the project's headline product.
  recommended_mitigation: The current release is most suitable for bioinformatics analysis of the individual
    datasets; users needing computed cell maps should await a later quarterly release.
- id: CM4AI_limitation_domain_expertise
  name: Requires domain expertise
  limitation_type: methodological_limitation
  limitation_description: The release metadata states that the data require domain expertise for meaningful
    analysis.
  scope_impact: Naive reuse of the mass spectrometry, imaging and single-cell perturbation archives risks
    misinterpretation.
  recommended_mitigation: Use the RO-Crate metadata, JSON-Schema data dictionaries, HTML release datasheet
    and provenance graphs shipped with each release, and the tutorials and training materials provided
    through the CM4AI web portal and CodeFest events.
- id: CM4AI_limitation_modality_overlap
  name: Incomplete overlap between assayed protein sets
  limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging) and
    CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap.
  scope_impact: Only proteins measured in more than one modality can support multimodal integration; the
    effective sample size for integrative analysis is smaller than any single modality.
  recommended_mitigation: Intersect protein identifiers across modalities before integrative analysis
    and report per-modality coverage.
- id: CM4AI_limitation_repository_review
  name: Repository under administrative review
  limitation_type: temporal_limitation
  limitation_description: The CM4AI web portal, the Dataverse collection and each release page carry the
    notice "This repository is under review for potential modification in compliance with Administration
    directives."
  scope_impact: The availability, contents or presentation of the released data may change for reasons
    outside the project's scientific plan.
  recommended_mitigation: Cite the specific release DOI and Dataverse version used, and retain local copies
    of the RO-Crate metadata alongside any downloaded archives.
confidential_elements:
- id: CM4AI_confidentiality
  name: Confidentiality status of released content
  confidentiality_details:
  - All files listed on the captured March 2025, June 2025, October 2025 and June 2026 release pages have
    File Access - Public.
  - Some datasets are under temporary pre-publication embargo; in the June 2026 release the perturb-seq
    external data links for KOLF2.1J iPSCs and for MDA-MB-468 cells are marked Embargoed.
  - The releases record Human Subjects - No, De-identified Samples - Yes and FDA Regulated - No, so no
    participant-confidential content is distributed.
content_warnings:
- id: CM4AI_content_warning_clinical_use
  name: Not suitable for clinical decision-making
  warnings:
  - These laboratory data are not to be used in clinical decision-making or in any context involving patient
    care without appropriate regulatory oversight and approval.
subpopulations:
- id: CM4AI_subpopulations
  name: Biological strata rather than human subpopulations
  subpopulation_elements_present: false
  identification:
  - The dataset is stratified by cell system and condition rather than by human subpopulation - MDA-MB-468
    breast cancer cells untreated, paclitaxel-treated and vorinostat-treated; and KOLF2.1J iPSCs undifferentiated
    or differentiated into neural progenitor cells, neurons and cardiomyocytes.
  distribution:
  - Data in this release was derived from commercially available de-identified human cell lines and does
    not represent all biological variants which may be seen in the population at large.
  - The only donor characteristics reported in the sources are those of the parental cell lines - MDA-MB-468
    from a 51-year-old black female with metastatic mammary adenocarcinoma, and KOLF2.1J from a healthy
    male Northern European donor.
sensitive_elements:
- id: CM4AI_sensitive_elements
  name: Sensitivity assessment
  sensitive_elements_present: false
  sensitivity_details:
  - CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue cultures) and
    are considered to be de-identified as they cannot be matched, with current knowledge, to a human subject.
  - The Dataverse release records state Human Subjects - No, De-identified Samples - Yes and FDA Regulated
    - No.
