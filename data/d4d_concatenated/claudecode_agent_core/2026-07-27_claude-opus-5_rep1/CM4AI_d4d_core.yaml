  - 'Historical: Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta), DOI 10.18130/V3/B35XWX,
    displayed Version 1.4, citation V1, Publication Date 2025-03-03, 6 files, 302 downloads at capture.'
  - 'Historical: May 2024 Data Release, listed in the archive on the CM4AI data releases page; the 2024
    CM4AI preprint cites DOI 10.18130/V3/DXWOS5 for ''Cell Maps for Artificial Intelligence - Data Release'',
    University of Virginia Dataverse, V1.'
  version_details:
  - The archive list on the CM4AI data releases page names the May 2024, March 2025, June 2025 and October
    2025 releases, with the June 2026 release presented as the latest release.
  - Because each release is a distinct DOI, citing 'the CM4AI dataset' without a release DOI and Dataverse
    version is ambiguous; archives with identical names differ in checksum and size between releases.
extension_mechanism:
  id: CM4AI_extension_mechanism
  name: Extension and contribution mechanisms
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  description: No mechanism for third parties to contribute content into a CM4AI release is documented
    in the captured sources. The project instead provides open-source tooling so that others can construct
    new cell maps from their own data, and provides repository and project contact routes for correspondence.
  extension_details:
  - The Cell Mapping Toolkit implements the end-to-end pipeline as a series of Python packages and provides
    a flexible and generalizable framework for cell map construction, enabling researchers to integrate
    and construct cell maps via multiple input modalities.
  - The toolkit is designed to facilitate continued map improvement, incorporation of new datasets, and
    construction of new cell maps across subtypes and disease states.
  - FAIRSCAPE client-side and server-side packages are PIP-installable and freely available under the
    MIT open-source license, allowing third parties to package their own AI-ready RO-Crates.
  - Dataverse provides a Contact Owner route on each release page and a Contact University of Virginia
    Dataverse Support form; project-related inquiries go to the CM4AI Program Manager.
external_resources:
- id: CM4AI_external_resources
  name: External resources referenced by the CM4AI releases
  archival: true
  external_resources:
  - MassIVE Repository - mass spectrometry data for SEC-MS in KOLF2.1J iPSCs (undifferentiated, NPC, neuron,
    cardiomyocyte)
  - MassIVE Repository - mass spectrometry data for SEC-MS in MDA-MB-468 breast cancer cells with and
    without treatment
  - MassIVE Repository - AP-MS data in MDA-MB-468 breast cancer cells treated with paclitaxel
  - MassIVE Repository - AP-MS data in MDA-MB-468 breast cancer cells treated with vorinostat
  - NCBI BioProject - Sequence Read Archive (SRA) data linked from the June 2025 release
  - Figshare - CRISPRi Perturbation Atlas of iPSCs, linked from the June 2026 release
  - CM4AI web portal, https://cm4ai.org/, and its Data Releases page, https://cm4ai.org/data-releases/
  - Cell Mapping Toolkit, https://github.com/idekerlab/cellmaps_pipeline, with documentation at https://cellmaps-pipeline.readthedocs.io/
  - FAIRSCAPE framework, https://fairscape.github.io
  - Integrative Modeling Platform, https://integrativemodeling.org
  - Network Data Exchange (NDEx), used to share cell maps produced by the project
  - Creative Commons CC BY-NC-SA 4.0 license deed, https://creativecommons.org/licenses/by-nc-sa/4.0/
  - NIH RePORTER project record, https://reporter.nih.gov/project-details/11211616
  future_guarantees:
  - Long term preservation of the Dataverse deposit in the University of Virginia Dataverse, supported
    by committed institutional funds.
  - The captured sources give no preservation guarantee for the external MassIVE, SRA, Figshare, NDEx,
    GitHub or portal resources.
  restrictions:
  - Perturb-seq external links for KOLF2.1J iPSCs and for MDA-MB-468 cells were marked Embargoed in the
    October 2025 and June 2026 releases.
  - The CM4AI web portal and the Dataverse collection carry the notice that the repository is under review
    for potential modification in compliance with Administration directives.
