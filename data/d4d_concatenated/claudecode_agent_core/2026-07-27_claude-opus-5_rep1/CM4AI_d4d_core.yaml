id: CM4AI
name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge2AI program. Its mission is to produce ethical,
  AI-ready datasets of human cell architecture, inferred from multimodal interrogation of disease-relevant
  human cell lines under perturbed and unperturbed conditions, in order to enable interpretable genotype-phenotype
  ("visible") machine learning. CM4AI generates protein-protein interaction data by affinity purification
  mass spectrometry (AP-MS) and size exclusion chromatography mass spectrometry (SEC-MS), spatial proteomics
  by immunofluorescence (IF) confocal imaging, and single-cell CRISPRi genetic perturbation (perturb-seq)
  data. The cell systems interrogated are the triple-negative breast cancer line MDA-MB-468 (untreated,
  paclitaxel-treated and vorinostat-treated) and the induced pluripotent stem cell line KOLF2.1J together
  with iPSC-derived neural progenitor cells, neurons and cardiomyocytes. Data are packaged with provenance
  graphs and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework, and
  are published as quarterly releases in LibraData, the University of Virginia Dataverse, under a CC BY-NC-SA
  4.0 license. This datasheet describes the CM4AI data resource as of its current release, the June 2026
  Data Release (Beta), DOI 10.18130/V3/HIGT4C, Dataverse version 2.0, publication date 2026-06-17; the
  March 2025, June 2025 and October 2025 releases are documented separately as historical releases under
  `resources`. CM4AI is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham,
  Simon Fraser University and the Hastings Center, as listed on the CM4AI data releases page; the March
  2025 release description gives the same list without UT Austin. The CM4AI web portal Data Insights panel
  reports 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated,
  11,739 genes targeted and a data volume of 21.4 TB across the project. The Dataverse Subject recorded
  for every release is "Medicine, Health and Life Sciences".
