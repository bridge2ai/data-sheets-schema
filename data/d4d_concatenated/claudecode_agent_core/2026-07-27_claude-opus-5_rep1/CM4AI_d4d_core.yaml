preprocessing_strategies:
- id: CM4AI_preprocessing_music_pipeline
  name: Multi-Scale Integrated Cell (MuSIC) data integration pipeline
  description: The CM4AI Tools Module produces and maintains the MuSIC pipeline, which produces integrated
    cell maps from multiple multi-modal input data streams. The pipeline is divided into segments, each
    of which calls the FAIRSCAPE client package to validate inputs and create the output RO-Crate package
    for that segment. The captured releases state that computed cell maps are not included in the release,
    so this pipeline documents how the released input data streams are consumed rather than describing
    a product distributed in the current release.
  preprocessing_details:
  - 'Download PPI and image data: PPI networks for the cell line and conditions are downloaded from the
    Krogan Laboratory''s deposition archive; IF images for the cell line and conditions are downloaded
    from the Lundberg Laboratory''s deposition archive.'
  - 'Generate embeddings: downloaded PPI networks are processed using the node2vec deep learning model
    to produce a PPI embedding; IF images are processed using a Human Protein Atlas deep learning model
    to produce an image embedding.'
  - 'Co-embedding: the PPI and image embeddings are integrated to obtain a co-embedding for each protein
    using contrastive deep learning, learning co-embeddings such that the original embeddings can be reconstructed
    with minimal information loss.'
  - 'Protein community detection and hierarchy creation: community detection is performed on all-by-all
    similarities of protein pairs in the co-embedding space, and the resulting hierarchy of protein communities
    is output as the final cell map.'
  - 'Hierarchy evaluation: cell maps are aligned to known protein function and pathway resources including
    the Gene Ontology and Reactome, and are annotated using a large language model approach that names
    sets of proteins and assigns a name confidence score.'
  - 'Integrative structure modeling: MuSIC communities are annotated by available structural information
    from the Protein Data Bank, the AlphaFold Protein Structure Database, crosslinking mass spectrometry
    and disorder prediction, then ranked and modeled using the Python Modeling Interface and the Integrative
    Modeling Platform.'
  - The Cell Mapping Toolkit implements the end-to-end pipeline as a series of pip-installable Python
    packages - cellmaps_imagedownloader, cellmaps_ppidownloader, cellmaps_image_embedding, cellmaps_ppi_embedding,
    cellmaps_coembedding, cellmaps_generate_hierarchy and cellmaps_hierarchyeval - with documentation
    hosted at ReadTheDocs.
  used_software:
  - id: CM4AI_software_cellmaps_pipeline
    name: Cell Mapping Toolkit (cellmaps_pipeline)
    description: Open-source software for cell map construction released as a series of Python PyPI packages,
      implementing the end-to-end MuSIC pipeline with full user documentation.
    url: https://github.com/idekerlab/cellmaps_pipeline
    license: Software comprising the Tools data integration pipeline is available under BSD-3 open source
      license in GitHub for alpha level tools, or in the Zenodo long-term archive for production-ready
      tools.
  - id: CM4AI_software_imp
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    description: Open-source package for modeling macromolecular complexes, scripted through the Python
      Modeling Interface, used for integrative structure modeling of MuSIC communities.
    url: https://integrativemodeling.org
- id: CM4AI_preprocessing_fairscape_packaging
  name: FAIRSCAPE AI-readiness packaging
  description: The Standards Module packages data, software, metadata and provenance graphs for AI-readiness
    using an expanded, client-server version of the FAIRSCAPE framework.
  preprocessing_details:
  - FAIRSCAPE-CLI is called when any computation or coherent set of computations in the pipeline is completed
    and is passed metadata defining JSON-Schema schemas for the datasets in the computational unit, as
    well as the inputs, computations, software, models and outputs.
  - FAIRSCAPE-CLI creates an RO-Crate package with the datasets, metadata and software, or resolvable
    references to these components, and unique stubs for identifier creation on each component.
  - RO-Crates are sent to the FAIRSCAPE server where they are registered and assigned persistent, resolvable,
    globally unique identifiers using the ARK scheme, then decomposed into their individual components
    which are also registered and assigned identifiers.
  - The server computes end-to-end entailments on each RO-Crate's provenance as expressed in the EVI Evidence
    Graph Ontology and links them together where possible, with graphical, JSON-LD and RDF-XML views provided
    on human-readable landing pages.
  - Data elements are characterized and validated and mapped to public ontology vocabularies where appropriate,
    using JSON-Schema mini-data-dictionary descriptions resolvable from the provenance graph metadata.
  used_software:
  - id: CM4AI_software_fairscape
    name: FAIRSCAPE AI-readiness framework
    description: Client-side Python3 application (FAIRSCAPE-CLI) and server application that package research
      artifacts as RO-Crates, assign ARK persistent identifiers and compute EVI provenance entailments.
      Described with a tutorial and installation instructions at https://fairscape.github.io. Copyright
      is held by the Rector and Board of Visitors of the University of Virginia.
    url: https://fairscape.github.io
    license: MIT License
cleaning_strategies:
- id: CM4AI_cleaning_qc
  name: Quality control and validation of measurement streams
  cleaning_details:
  - Single-cell CRISPR screen data from MDA-MB-468 cells and undifferentiated KOLF2.1J iPSCs were subjected
    to quality control before release; the CM4AI preprint records that the resulting data were being QCed
    at the time of writing.
  - The CRISPRi Perturbation Cell Atlas findings were validated via phenotypic, protein-interaction and
    metabolic tracing assays.
  - The FAIRSCAPE client validates the inputs of each pipeline segment against JSON-Schema definitions
    before the output RO-Crate package is created.
  - The June 2025 release applied corrections to RO-Crate metadata and changes to naming conventions,
    and added RGB immunofluorescent images.
labeling_strategies:
- id: CM4AI_labeling_map_annotation
  name: Cell map assembly annotation
  description: Annotation applies to the hierarchical cell maps produced by the MuSIC pipeline. The captured
    releases state that computed cell maps are not included in the current release, so this describes
    the project's annotation method rather than labels distributed with the released input data streams.
  data_annotation_protocol:
  - Cell maps are annotated in a two-pronged approach - first, maps are aligned to known protein function
    and pathway resources including the Gene Ontology and Reactome to identify protein assemblies with
    high overlap with known cell biology; second, assemblies are annotated using a large language model
    approach that names sets of proteins and assigns a name confidence score.
  labeling_details:
  - In the related U2OS multimodal cell map study by CM4AI investigators, annotation was performed at
    in-person Annotation Jamborees in which approximately a dozen individuals worked in pairs to assign
    names and putative functional roles to assemblies on the basis of expert knowledge and literature
    curation, informed by GPT-4 suggestions, with final naming determinations made by the human curation
    team.
  - That study is scoped to U2OS osteosarcoma cells and is not the cell system distributed in the CM4AI
    Dataverse releases.
annotation_analyses:
- id: CM4AI_annotation_analysis_llm_naming
  name: Reproducibility of large language model assembly naming
  description: Reported for the related U2OS multimodal cell map study by CM4AI investigators, not for
    the data distributed in the CM4AI Dataverse releases.
  analysis_method: The Gene Set AI pipeline was run for five additional replicate GPT-4 runs and the semantic
    similarity between assembly names generated in each replicate and the original run was computed with
    the SapBERT model from HuggingFace (cambridgeltl/SapBERT-from-PubMedBERT-fulltext) using the transformers
    package v.4.29.2. Assemblies not named by the original run were excluded.
  annotation_quality_details:
  - GPT-4 assigned names to previously known assemblies with very high confidence (median 0.92 for both
    high overlap and substantial variation categories) and to previously undocumented assemblies with
    moderately high confidence (median 0.85), contrasting with a median confidence of 0.0 for randomly
    drawn protein sets.
  - For 104 of 144 not previously documented assemblies the literature was sufficiently coherent for GPT-4
    to propose a confident assembly name (confidence at or above 0.85), each of which was passed to the
    human curation team for final naming determination.
machine_annotation_tools:
- id: CM4AI_machine_annotation_tools
  name: Large language model annotation of protein assemblies
  description: Reported for the CM4AI cell map annotation method and demonstrated in the related U2OS
    multimodal cell map study; the captured releases state that computed cell maps are not included.
  tools:
  - Gene Set AI (GSAI) pipeline driving GPT-4 (v.gpt-4-1106-preview)
  - GPT-4 based citation module
  tool_descriptions:
  - The GSAI pipeline uses an engineered prompt following chain-of-thought and one-shot strategies to
    query GPT-4 for a descriptive name, a confidence score and a detailed reasoning analysis of the protein
    members of each assembly.
  - The citation module extracts gene symbols and functional keywords from each paragraph of the generated
    analysis, constructs and executes PubMed queries, prioritizes returned publications by relevance and
    number of matching genes, and asks a separate GPT-4 instance to judge whether the top three publications
    support the factual statements in the paragraph.
  tool_accuracy:
  - Self-assessed naming confidence medians of 0.92 for known assemblies, 0.85 for previously undocumented
    assemblies and 0.0 for random protein sets, in the related U2OS study.
existing_uses:
- id: CM4AI_existing_uses
  name: Documented uses of CM4AI data and methods
  examples:
  - The CRISPRi Perturbation Cell Atlas distributed in the releases underpins Nourreddine S, Doctor Y,
    Dailamy A et al., "A perturbation cell atlas of human induced pluripotent stem cells", bioRxiv 2024.11.03.621734,
    PMCID PMC11580897, listed as a Related Publication on the CM4AI releases.
  - Cell maps produced by the CM4AI method have been used in AI tools for "visible machine learning" or
    "visible neural networks" to interrogate how protein assemblies in the cell affect cell-level phenotype
    predictions.
  - The CM4AI data and tools were distributed at the project's inaugural CodeFest in March 2024, accompanied
    by detailed tutorials explaining how the data were derived and integrated and providing production-ready
    software for producing the datasets.
  - The same multimodal integration methodology was applied by CM4AI investigators to U2OS osteosarcoma
    cells in Schaffer, Hu, Qian et al., "Multimodal cell maps as a foundation for structural and functional
    genomics", Nature 642, 222-231 (2025), which used the resulting map for 3D structural modelling, protein
    function assignment, cell type specificity and multi-localization analysis, and interpretation of
    paediatric tumour mutations. That study's data are deposited separately and are not part of the CM4AI
    Dataverse releases.
other_tasks:
- id: CM4AI_other_tasks
  name: Additional analyses the data can support
  task_details:
  - Development and evaluation of visible neural networks and other interpretable machine learning models
    built on knowledge maps of cell architecture.
  - Interpretation of genetic variants and mutations through protein assemblies, as a downstream application
    of hierarchical cell maps.
  - Differential analysis of protein complex composition and elution behaviour between drug-treated and
    untreated cancer cells.
  - Comparison of subcellular organization across differentiation states of induced pluripotent stem cells.
  - Benchmarking of provenance-aware, RO-Crate packaged AI-ready data against FAIR and AI-readiness criteria.
intended_uses:
- id: CM4AI_intended_uses
  name: Intended uses declared in the release metadata
  usage_notes: The release metadata states that this dataset is intended for AI-ready datasets to support
    research in functional genomics; AI model training; cellular process analysis; and cell architectural
    changes and interactions in presence of specific disease processes, treatment conditions, or genetic
    perturbations.
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations
  use_category:
  - research use
  - AI/ML model development
discouraged_uses:
- id: CM4AI_discouraged_uses
  name: Uses the release metadata discourages
  discouragement_details:
  - The current release is most suitable for bioinformatics analysis of the individual datasets rather
    than for integrated cell map analysis, because computed cell maps are not included.
  - Analyses requiring predicted cell maps should not be attempted on this release; those will be added
    in future releases.
  - Use without relevant domain expertise is discouraged, as the release metadata states that meaningful
    analysis requires domain expertise.
  - Treating the data as representative of human population variation is discouraged, since the data derive
    from commercially available de-identified human cell lines.
prohibited_uses:
- id: CM4AI_prohibited_clinical_use
  name: Clinical decision-making and patient care
  prohibition_reason:
  - These laboratory data are not to be used in clinical decision-making or in any context involving patient
    care without appropriate regulatory oversight and approval.
- id: CM4AI_prohibited_commercial_use
  name: Commercial use without a separate license
  prohibition_reason:
  - The data are licensed under CC BY-NC-SA 4.0, whose NonCommercial term states that you may not use
    the material for commercial purposes, a commercial use being one primarily intended for commercial
    advantage or monetary compensation.
  - Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question).
- id: CM4AI_prohibited_relicensing
  name: Redistribution under incompatible terms or with added restrictions
  prohibition_reason:
  - The ShareAlike term requires that remixed, transformed or built-upon material be distributed under
    the same license as the original, or a license listed as compatible by Creative Commons.
  - The No additional restrictions term states that you may not apply legal terms or technological measures
    that legally restrict others from doing anything the license permits.
future_use_impacts:
- id: CM4AI_future_use_impacts
  name: Factors that may affect future use
  impact_details:
  - The dataset is an interim beta release that will be regularly updated and augmented on a quarterly
    basis through the end of the project, so analyses pinned to a given release DOI and version may diverge
    from later releases.
  - Same-named archives have been replaced between releases with different checksums and sizes, so reproducibility
    depends on recording the specific release DOI, Dataverse version and file checksums used.
  - Datasets currently under temporary pre-publication embargo are expected to become available, changing
    the effective coverage of the resource.
  - Predicted cell maps, the project's headline product, will be added in future releases.
  - The CM4AI web portal and the Dataverse collection carry a notice that the repository is under review
    for potential modification in compliance with Administration directives, which may affect future availability.
use_repository:
- id: CM4AI_use_repository
  name: CM4AI web portal
  repository_url: https://cm4ai.org/
  repository_details:
  - Initial datasets, tools and standards associated with all three parallel mapping platforms are released
    and publicly available at the CM4AI web portal, which is built on the U-BRITE platform and lists project
    publications, tools, product documentation and learning materials.
  - Data packages from CM4AI, including links to software used in preparing the data, input datasets,
    dataset schemas and deep provenance graphs, are available on the CM4AI web portal.
distribution_formats:
- id: CM4AI_distribution_format_dataverse
  name: ZIP archives and metadata documents via the University of Virginia Dataverse
  description: The current release distributes ten public ZIP archives. Earlier releases also distributed
    JSON RO-Crate metadata documents, an HTML release datasheet and HTML provenance graph renderings as
    individually downloadable files. The Dataverse interface reports that the dataset is too large to
    download as a whole and that files above the 953.7 MB download limit must be retrieved individually,
    via the Data Access API, or with a download manager using the package download URL.
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  - https://doi.org/10.18130/V3/HIGT4C
  - https://dataverse.lib.virginia.edu/api/access/datafile/
- id: CM4AI_distribution_format_rocrate
  name: RO-Crate AI-ready packaging
  description: CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using the FAIRSCAPE framework. RO-Crate persistent identifiers use the ARK scheme
    and resolve to human- and machine-readable landing pages containing metadata expressed in JSON-LD
    using vocabularies from Schema.org, EVI and other public ontologies, with alternate JSON-LD and RDF-XML
    serializations.
- id: CM4AI_distribution_format_external
  name: External repository deposits
  description: Mass spectrometry data are deposited in the MassIVE repository, raw sequence data are linked
    through NCBI BioProject and the Sequence Read Archive, and the CRISPRi Perturbation Atlas of iPSCs
    is linked on Figshare. Some perturb-seq deposits were marked Embargoed at the time of capture.
