purposes:
- id: CM4AI_purpose_ai_ready_cell_maps
  name: Deliver AI-ready maps of human cell architecture
  response: CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture as
    AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric and cardiac disorders in disease-relevant cell lines
    under perturbed and unperturbed conditions, utilizing state-of-the-art mass spectrometry based proteomics,
    spatial proteomics / cell imaging, and genetic perturbations using CRISPR.
- id: CM4AI_purpose_interpretable_genotype_phenotype
  name: Enable interpretable genotype-phenotype learning
  response: As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project seeks
    to map the spatiotemporal architecture of human cells and use these maps toward the grand challenge
    of interpretable genotype-phenotype learning. In genomics and precision medicine, machine learning
    models are often "black boxes," predicting phenotypes from genotypes without understanding the mechanisms
    by which such translation occurs.
- id: CM4AI_purpose_ethical_ai_readiness
  name: Advance ethical, FAIR, AI-ready data standards
  response: CM4AI defines AI-Ready biomedical data as fully characterized FAIR data of known provenance
    which can be ethically and reliably processed by AI applications; whose models and software are available
    and well-described for validation and re-use; and whose predictions may be fully explained and interpreted.
    The project implements a standards data management approach based on FAIR access and software principles,
    with deep provenance and replication packages for representation of cell maps and their underlying
    datasets, and initiates a research program in ethical AI.
- id: CM4AI_purpose_workforce
  name: Stimulate training in biomedical AI/ML
  response: In addition to data and tools, the project stimulates a diverse portfolio of training opportunities
    in the emerging field of biomachine learning, through a Skills and Workforce Development module that
    delivers asynchronous virtual training, hosted virtual events such as CodeFest, and an in-person internship
    co-hosted at Yale University and the University of California San Diego.
tasks:
- id: CM4AI_task_multimodal_mapping
  name: Multimodal mapping of cellular structure and function
  response: A coordinated effort involving three complementary mapping approaches - proteomic mass spectrometry,
    cellular imaging, and genetic perturbation via CRISPR/Cas9 - creating a library of large-scale maps
    of cellular structure/function across demographic and disease contexts.
- id: CM4AI_task_ai_model_training
  name: AI model training
  response: The release metadata states that the dataset is intended for AI-ready datasets to support
    research in functional genomics and for AI model training.
- id: CM4AI_task_cellular_process_analysis
  name: Cellular process analysis
  response: The release metadata states the dataset is intended for cellular process analysis and for
    the study of cell architectural changes and interactions in the presence of specific disease processes,
    treatment conditions, or genetic perturbations.
addressing_gaps:
- id: CM4AI_gap_black_box_models
  name: Opacity of genotype-phenotype machine learning models
  response: Machine learning models show great promise in analyzing the human genome to make predictions,
    but the inner workings of these models are typically difficult-to-interpret "black boxes." This Bridge2AI
    data generation project generates a resource of matched data and tools to enable the creation of "visible"
    ML systems, which are not black boxes but are built directly on knowledge maps of cell and tissue
    architecture.
- id: CM4AI_gap_uncharted_cell_architecture
  name: Incomplete knowledge of subcellular organization
  response: Human cells are organized across a spatial hierarchy of components ranging from small protein
    complexes at the nanometre scale to large condensates, compartments and organelles at the micrometre
    scale, and much of cell structure still remains uncharted. Individual mapping technologies have typically
    been applied separately; integration of complementary data modalities is required to resolve subcellular
    components robustly across physical scales.
- id: CM4AI_gap_ai_ready_functional_genomics
  name: Absence of ethically prepared, fully provenanced functional genomics data
  response: 'AI-readiness places significant requirements on datasets used to train and to be analyzed
    by AI/ML models: FAIRness, machine-readable provenance graphs, complete schemas and datasheets, explainability,
    and ethical acquisition, validation, documentation, licensing and distribution. CM4AI addresses this
    gap by packaging every release with FAIRSCAPE-generated persistent identifiers, provenance graphs
    and JSON-Schema data dictionaries.'
