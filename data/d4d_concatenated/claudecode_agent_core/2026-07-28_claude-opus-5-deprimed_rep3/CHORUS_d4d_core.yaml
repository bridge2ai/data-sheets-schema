ethical_reviews:
- name: CHoRUS Ethics pillar
  description: Ethics is one of the three pillars of the CHoRUS data generation project, covering
    ethical and trustworthy AI.
  review_details:
  - The CHoRUS consortium evaluates community perspectives on clinical care AI to find ways
    to increase trustworthiness of provenance and privacy in AI.
  - New approaches are being created as the existing legal and regulatory landscape is analyzed.
  - Patient-focused efforts determine the ethical and legal approaches to manage privacy and
    bias, while accounting for social determinants of health.
- name: Community-facing ethics focus groups
  description: The project performs community-facing ethics focus groups to determine what
    data is appropriate for public sharing.
  review_details:
  - Focus group findings inform decisions about which data elements are appropriate for public
    sharing.
data_protection_impacts:
- name: Privacy and re-identification risk management
  description: Measures taken to limit re-identification risk and to determine what data may
    be shared.
  impact_details:
  - Data are transformed using approaches that limit re-identification, and unstructured electronic
    health record data are tokenized.
  - Community-facing ethics focus groups determine what data is appropriate for public sharing.
  - The project analyses the existing legal and regulatory landscape and establishes a legal
    framework for collecting data at scale.
  - Dedicated tooling supports privacy assessment and de-identification, including a privacy
    scan tool for medical records and a de-identification repository named CTP-deid.
  used_software:
  - id: https://chorus4ai.org/d4d/software/privacy-scan-tool
    name: privacy_scan_tool
    description: A privacy scan tool for medical records, in the chorus-ai GitHub organization;
      primary language Python.
  - id: https://chorus4ai.org/d4d/software/ctp-deid
    name: CTP-deid
    description: Repository named CTP-deid in the chorus-ai GitHub organization; the source
      listing gives the repository name without a description.
human_subject_research:
  name: Human subjects status
  description: The dataset is derived from the hospital clinical records of patients with
    acute or critical illness. The project states that it addresses the challenges of acquiring
    an AI-ready data set from more than 100,000 critically ill patients; the current released
    dataset comprises 50,000 patient admissions from ICU, PICU and NICU.
  involves_human_subjects: true
  special_populations:
  - Critically ill patients
  - Pediatric intensive care unit patients
  - Neonatal intensive care unit patients
at_risk_populations:
  name: At-risk population protections
  description: The released dataset includes admissions from pediatric and neonatal intensive
    care units, and the dataset as a whole describes patients with acute or critical illness.
  at_risk_groups_included: true
  special_protections:
  - Controlled access to all nine data modalities, with a signed licensing agreement and a
    ".edu" email address required before access is granted.
  - Data transformation using approaches that limit re-identification, including tokenization
    of unstructured electronic health record data.
  - Clinical notes retained locally at contributing sites, with only tokens transferred to
    the enclave.
  - Community-facing ethics focus groups determining what data is appropriate for public sharing.
preprocessing_strategies:
- name: Standardization to the OMOP Common Data Model
  description: Acquired data are standardized to the OMOP Common Data Model, supported by
    validated semantic mappings for connecting clinical data in various source formats to
    international standards.
  preprocessing_details:
  - Acquire data, standardize data to the OMOP Common Data Model, and transform data using
    approaches that limit re-identification.
  - Unified standards harmonize multi-modal EHR, waveform, imaging and text data.
  - The chorus-mapping repository holds documentation and pooled tabular mappings with an
    associated clinical validation SOP.
- name: Clinical note extraction and tokenization
  description: Clinical notes are extracted and tokenized using the OHNLP toolkit, producing
    an OHNLP-conformant representation while the underlying notes remain at the contributing
    site.
  preprocessing_details:
  - Clinical notes are extracted and tokenized using the OHNLP toolkit.
  - Published metadata follows an OHNLP open source schema.
  used_software:
  - id: https://chorus4ai.org/d4d/software/ohnlp-toolkit
    name: OHNLP toolkit
    description: Toolkit used to extract and tokenize clinical notes; the associated published
      metadata schema is described as an OHNLP open source schema.
- name: Waveform conversion and packaging
  description: Waveform telemetry from bedside monitors is converted for release as WFDB,
    with published metadata following an extended PhysioNet schema; EEG is delivered in EDF+
    and Persyst formats.
  preprocessing_details:
  - Waveform documentation and conversion scripts are maintained in the CHoRUS GitHub organization.
  - Resources supporting the preparation and release of waveforms are maintained alongside
    the conversion scripts.
  used_software:
  - id: https://chorus4ai.org/d4d/software/chorus-waveform
    name: chorus_waveform
    description: CHoRUS waveform documentation and various waveform conversion scripts, in
      the chorus-ai GitHub organization; primary language Jupyter Notebook.
    license: MIT
  - id: https://chorus4ai.org/d4d/software/chorus-waveform-resources
    name: chorus_waveform_resources
    description: Resources which support the preparation and release of waveforms, in the
      chorus-ai GitHub organization.
- name: Geocoding of location entities
  description: OMOP Location entities are geocoded so that data elements can feature contextual
    factors such as geographic distance to the nearest hospital and social determinants of
    health.
  preprocessing_details:
  - Open source code geocodes OMOP Location entities via DeGauss.
  used_software:
  - id: https://chorus4ai.org/d4d/software/uf-geocoding
    name: UF-Geocoding
    description: Open source code to geocode OMOP Location entities via DeGauss, in the chorus-ai
      GitHub organization, forked from bihorac-LAB/Exposome; primary language Python.
    license: MIT
cleaning_strategies:
- name: Site characterization reporting
  description: Characterization reports are produced and returned to sites following their
    data submissions, supporting detection and correction of data quality issues at source.
  cleaning_details:
  - A dedicated repository produces characterization reports to return to sites following
    their data submissions.
  - Sites provide regular status updates on progress in creating and curating a CHoRUS-specific
    clinical data extract, and status tracking is used to identify and resolve blocking issues.
  used_software:
  - id: https://chorus4ai.org/d4d/software/chorus-reports
    name: CHoRUSReports
    description: Repository in the chorus-ai GitHub organization dedicated to producing characterization
      reports to return to sites following their data submissions; primary language R.
- name: Validated mappings and SOP review
  description: Semantic mappings and standard operating procedures undergo validation and
    review before use.
  cleaning_details:
  - Validated semantic mappings connect clinical data in various source formats to international
    standards.
  - SOP documents undergo an internal validation and review process within the Chorus_SOP
    repository.
  - A clinical validation SOP governs contributions to mapping efforts, with clinical expertise
    treated as invaluable to semantic mapping and validation.
labeling_strategies:
- name: Visualization and annotation environment
  description: A visualization and annotation environment labels data with targets important
    for prediction.
  data_annotation_protocol:
  - Clinical expertise supports semantic mapping and validation, governed by a clinical validation
    SOP associated with the pooled tabular mappings in the chorus-mapping repository.
  labeling_details:
  - Project capabilities span acquiring, standardizing, tokenizing, storing, visualizing and
    labeling data such as structured electronic health record data, tokenized unstructured
    electronic health record data, telemetry and EEG waveforms, imaging, and social determinants
    of health.
raw_sources:
- name: Source clinical systems retained by contributing hospitals
  description: The raw clinical records underlying the dataset remain in the systems of the
    data-contributing hospitals and are not distributed with the released dataset.
  raw_data_details:
  - Clinical notes are stored locally at contributing sites; only tokens reach the enclave.
  - Imaging originates in hospital PACS, telemetry in bedside monitors and gateway/middleware,
    and EEG in hospital databases.
  - The sources do not describe a mechanism for external users to obtain the untransformed
    source records.
machine_annotation_tools:
- name: Automated extraction and enrichment tooling
  description: Automated tools applied during dataset creation to derive structured content
    from source records.
  tools:
  - OHNLP toolkit
  - DeGauss geocoder, applied through the UF-Geocoding code
  tool_descriptions:
  - The OHNLP toolkit extracts and tokenizes clinical notes, with an OHNLP open source schema
    as the published metadata schema.
  - DeGauss is used by open source code to geocode OMOP Location entities, supporting contextual
    factors such as geographic distance to the nearest hospital.
existing_uses:
- name: Training activities and publications
  description: The datasets are being used for training activities and publications.
  examples:
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI
    CHoRUS data through engagement, AI training and mentorship, equipping trainees to apply
    AI/ML methods to big data analysis using multi-modal datasets from a broad range of cohort
    participants.
  - Cohort 2 of that program runs from a start date of 2025-11-17 to a program end date of
    2026-07-31, selecting up to 30 trainees who conduct collaborative research on the Bridge2AI
    Clinical Care Cloud platform and present works-in-progress posters at the Bridge2AI Annual
    Meeting (May 2026) and the AIM-AHEAD Annual Meeting (July 2026).
  - Program learning sessions using the data and platform include Machine Learning Basics,
    Introduction to Python and Version Control, Ethics of AI in Clinical Practice, Working
    with EHR Data for Research, and Data Schemas in Clinical Cloud.
other_tasks:
- name: Use-case development within Bridge2AI Data Topics
  task_details:
  - Trainees develop and present use cases suitable to apply in Bridge2AI Data Topics, and
    conduct innovative research at the intersection of healthcare challenges and AI/ML using
    multi-modal datasets.
- name: Geospatial and exposome analysis
  task_details:
  - Geocoding of OMOP Location entities supports analyses using contextual factors such as
    geographic distance to the nearest hospital and social determinants of health.
- name: Generative AI applications in clinical care
  task_details:
  - Program didactics cover generative AI and specific use cases applied on the Bridge2AI
    AI/ML for Clinical Care Collaborative Cloud.
future_use_impacts:
- name: Marketplace adoption of validated clinical AI models
  impact_details:
  - The holdout test set is accessible for model external validation to aid marketplace adoption
    of AI-developed models for implementation in acute and critical care.
- name: Promotion of privacy, accountability and clinical benefit
  impact_details:
  - The project's overarching goal includes ensuring that the methods promote privacy, accountability
    and clinical benefit while promoting a new generation of AI clinicians and scientists.
- name: Broader AI literacy and workforce capacity
  impact_details:
  - The project cultivates expertise in the lay and scientific community to improve AI literacy
    and utilization through multimodal educational approaches, and develops the skills and
    workforce for a next generation of diverse academic and community AI scientists.
- name: Generalization risk beyond contributing centers
  impact_details:
  - Because contributions come from 14 Data Acquisition centers within a 20-academic-center
    United States collaboration, models developed on this dataset should be externally validated
    before deployment in other settings; the project provisions a holdout test set for exactly
    this purpose.
discouraged_uses:
- name: Treating the current release as a complete multimodal resource
  description: Derived from the modality completeness statements in the sources rather than
    from an explicit prohibition by the project.
  discouragement_details:
  - Analyses that assume imaging or EEG are available for every admission are not supported
    by the current release, in which approximately 1,000 images were available with de-identification
    in process for a larger cohort, EEG extraction was in process, and 7,642 of 50,000 admissions
    carried radiology data.
  - Analyses requiring full clinical note text are not supported inside the enclave, because
    notes are stored locally at contributing sites and only tokens are transferred.
intended_uses:
- name: Clinical AI model development for acute and critical care
  description: Building machine-learning and artificial-intelligence-derived models to improve
    the care and outcomes of patients requiring critical care.
  examples:
  - Characterizing acute and critical care illness.
  - Predicting complications.
  - Measuring treatment response among patients with acute or critical illness.
  use_category:
  - biomedical research
  - clinical artificial intelligence development
  usage_notes: Access is controlled; a signed licensing agreement and a ".edu" email address
    are required before access is granted and compute is provisioned.
- name: External validation of AI models
  description: Use of the provisioned holdout test set for model external validation.
  examples:
  - External validation of AI-developed models to aid marketplace adoption for implementation
    in acute and critical care.
  use_category:
  - model validation
- name: Training, education and workforce development
  description: Use of the dataset in structured AI/ML training programs for clinical care.
  examples:
  - Hands-on training on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud, including
    workshops on Jupyter Notebooks, the OHDSI tool stack and the OHDSI/OMOP common data model.
  - Creating practical use cases during Bridge2AI topics.
  use_category:
  - education
  - workforce development
  usage_notes: Program administrators will assist with dataset access if needed; the licensing
    agreement and ".edu" email requirements are stated not to be a barrier to acceptance into
    the training program.
distribution_formats:
- name: OMOP Common Data Model tables
  description: Structured electronic health record domains (demographics, medication administration,
    procedures, nursing flowsheets and diagnoses) are delivered in the OMOP Common Data Model
    under controlled access, with published metadata following the OMOP schema. One structured
    EHR domain is published using OMOP schema extensions.
- name: OHNLP tokenized clinical notes
  description: Clinical notes extracted and tokenized using the OHNLP toolkit, under controlled
    access, with an OHNLP open source schema as the published metadata schema and metadata
    publication planned.
- name: DICOM imaging
  description: Imaging from hospital PACS delivered as DICOM under controlled access, with
    a DICOM schema as the published metadata schema and metadata publication planned.
- name: WFDB waveform telemetry
  description: Waveform telemetry from bedside monitors and gateway/middleware delivered as
    WFDB under controlled access, with an extended PhysioNet schema as the published metadata
    schema.
- name: EDF+ and Persyst waveform EEG
  description: Waveform EEG from hospital databases delivered in EDF+ and Persyst formats
    under controlled access, with an open source EDF+ and Persyst schema as the published
    metadata schema and metadata publication planned.
distribution_dates:
- name: Reported release and access milestones
  description: Dates reported in the source documents that bear on availability of the dataset.
  release_dates:
  - August 2025 - reported coverage of 14 different hospitals with over 45,000 unique admissions,
    as stated in the September 2025 informational webinar.
  - 2025-11-17 - start date of AIM-AHEAD Bridge2AI for Clinical Care Training Program Cohort
    2, the point from which selected trainees receive provisioned access to CHoRUS data.
  - The project website describes a current released dataset without stating its release date.
license_and_use_terms:
  name: CHoRUS dataset access and use terms
  description: Access to the CHoRUS dataset is controlled across all nine data modalities
    and is governed by a licensing agreement that each user must sign. The full text of the
    licensing agreement is not contained in the source documents.
  license_terms:
  - All nine data modalities carry controlled access control.
  - Participants fill out a registration form with name, email and institution; once access
    is granted and compute is provisioned, an email is sent.
  - All participants must sign a licensing agreement included in the registration form before
    gaining access to the dataset. This requirement is stated not to be a barrier to acceptance
    into the training program, and program administrators will assist with access if needed.
  - In order to gain access to the dataset, a ".edu" email address is required. This requirement
    is likewise stated not to be a barrier to acceptance into the program.
  - The contact for the project website is Ciera McCrary, Program Manager, Massachusetts General
    Hospital, cmccrary@mgh.havard.edu (address reproduced as published). Access requests are
    directed in the CHoRUS GitHub organization to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  - 'Software repositories in the CHoRUS GitHub organization are separately licensed: the
    project states it is licensed under the MIT License, with individual repositories including
    chorus_waveform, chorus-extract-upload and UF-Geocoding marked MIT and Chorus_SOP marked
    Apache-2.0. These software licenses govern the project code, not access to the dataset.'
  data_use_permission:
  - health_medical_biomedical_research
  contact_person: https://chorus4ai.org/d4d/person/ciera-mccrary
ip_restrictions:
  name: Intellectual property and attribution terms
  description: Intellectual property terms stated in the source documents.
  restrictions:
  - The CHoRUS project code is licensed under the MIT License; the Chorus_SOP documentation
    repository is marked Apache-2.0.
  - Dataset access, as distinct from code reuse, is governed by the signed licensing agreement
    required at registration.
  - The project website states that its content is solely the responsibility of the authors
    and does not necessarily represent the official views of the NIH.
regulatory_restrictions:
  name: Access control and regulatory posture
  description: Regulatory and access-control conditions stated in the source documents.
  confidentiality_level: restricted
  regulatory_restrictions:
  - Access control is "Controlled" for every one of the nine data modalities.
  - A signed licensing agreement is required before access to the dataset is granted.
  - A ".edu" email address is required to gain access to the dataset.
  - The project establishes a legal framework for collecting data at scale and analyses the
    existing legal and regulatory landscape as part of its ethics work.
  - The project website carries the notice "This repoitory is under review for potential modification
    in compliance with Administration directives."
maintainers:
- name: CHoRUS Consortium
  description: The CHoRUS consortium, comprising more than 60 members across 20 different
    institutions, funded by the NIH under award number OT2OD032701, with Massachusetts General
    Hospital as the awardee organization.
  role: academic_institution
  maintainer_details:
  - The CHoRUS GitHub organization houses 28 active repositories providing software and tooling,
    validated semantic mappings, standard operating protocols, and project management overviews.
  - Package versions, maintainers and other metadata about CHoRUS packages are tracked on
    a package status page, with documentation compiled in the chorus-developer repository.
- name: Ciera McCrary, Program Manager
  description: Program Manager at Massachusetts General Hospital, listed as the contact for
    the CHoRUS project website.
  role: academic_institution
  maintainer_details:
  - 'Contact address listed on the project website: cmccrary@mgh.havard.edu'
- name: Data access request contacts
  description: Contacts named in the CHoRUS GitHub organization overview for requesting access
    and for general inquiries or feedback.
  role: academic_institution
  maintainer_details:
  - 'Request access: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org'
  - 'Project website: www.bridge2ai.org/chorus'
updates:
  name: Dataset growth and completion plan
  description: The dataset is being expanded from its current release toward an anticipated
    final dataset during the NIH award period, which runs to 2026-11-30.
  update_details:
  - The anticipated final dataset comprises 100,000 patient admissions, 9 different data modalities
    and 14 data contributing hospitals, against a current released dataset of 50,000 patient
    admissions.
  - Imaging de-identification is in process for a larger cohort beyond the images already
    available.
  - Waveform EEG extraction is in process.
  - Published metadata schemas are planned for clinical notes, imaging and waveform EEG.
  - Data-contributing sites provide regular status updates on their progress creating and
    curating a CHoRUS-specific clinical data extract; site statuses are tracked in the Standards
    Project or the Data Acquisition Project.
version_access:
  name: Dataset release scope
  description: The project website distinguishes the dataset available today from the anticipated
    end state. The sources do not describe numbered dataset versions or an archive of superseded
    releases.
  versions_available:
  - Current Released Dataset - 50,000 patient admissions from ICU, PICU and NICU; 1.6 billion
    rows of EHR OMOP data; 7,642 admissions with radiology data; 23 Tb of waveform data.
  - Anticipated Final Dataset - 100,000 patient admissions; 9 different data modalities; 14
    data contributing hospitals; 60+ CHoRUS consortium members across 20 different institutions.
  version_details:
  - 'A September 2025 informational webinar reported an intermediate status: as of August
    2025, 14 different hospitals with over 45,000 unique admissions.'
extension_mechanism:
  name: Contribution and issue-reporting routes
  description: Routes by which sites, clinical collaborators and software developers contribute
    to the dataset and its tooling.
  contribution_url: https://github.com/chorus-ai
  extension_details:
  - Data site managers start from the Chorus_SOP page, which provides an interactive workflow
    diagram with dynamic links to SOP documents for extracting and contributing clinical data
    to CHoRUS.
  - Issues in the creation or submission of a data extract can be posted in context-specific
    discussion locations, namely Standards Discussions and Data Acquisition Discussions.
  - Clinical collaborators contribute to semantic mapping through the chorus-mapping repository,
    which holds documentation and pooled tabular mappings with an associated clinical validation
    SOP.
  - Software contributors and users are served by a web guide compiling documentation in the
    chorus-developer repository, together with a package status page.
  - Sites submit status updates either through the GitHub interface directly or by submitting
    a Google Form, whose submissions trigger a GoogleScript that calls the GitHub API to update
    status and issue information.
is_deidentified:
  name: De-identification status
  description: The dataset originates in identifiable hospital clinical records and is transformed
    to limit re-identification before controlled release.
  identifiable_elements_present: true
  method: Transformation of data using approaches that limit re-identification, including
    tokenization of unstructured electronic health record data, extraction and tokenization
    of clinical notes with the OHNLP toolkit, and de-identification of imaging.
  deidentification_details:
  - Imaging de-identification was in process for a larger cohort at the time of the September
    2025 informational webinar, with approximately 1,000 images then available.
  - Clinical notes are stored locally at contributing sites; only tokens are held alongside
    OMOP and telemetry data in the enclave.
  - Supporting tooling in the CHoRUS GitHub organization includes a privacy scan tool for
    medical records and a CTP-based de-identification repository.
external_resources:
- name: CHoRUS project website
  description: Public-facing project website describing the project overview, team, tools,
    data acquisition, standards, community engagement, ethics, dataset and learning resources.
  external_resources:
  - https://chorus4ai.org/
- name: CHoRUS GitHub organization
  description: The chorus-ai GitHub organization, with 28 repositories providing software
    and tooling to interact with and extract insight from clinical data in diverse formats,
    validated semantic mappings, standard operating protocols instructing data contributing
    sites, and project management overviews. Top languages are JavaScript, Python, Jupyter
    Notebook, CSS and MDX.
  external_resources:
  - https://github.com/chorus-ai
- name: NIH RePORTER project record
  description: NIH RePORTER record for application ID 10472824, project number 1OT2OD032701-01.
  external_resources:
  - https://reporter.nih.gov/project-details/10472824
- name: Bridge2AI CHoRUS page
  description: Project website listed in the CHoRUS GitHub organization contact section.
  external_resources:
  - www.bridge2ai.org/chorus
- name: AIM-AHEAD Bridge2AI for Clinical Care informational webinar, Cohort 2
  description: Informational webinar delivered 2025-09-09 describing the CHoRUS dataset, its
    modalities and access process, and the associated training program.
  external_resources:
  - https://www.aim-ahead.net/media/jnzdnid3/bridge2ai-for-clinical-care-informational-webinar-cohort-2.pdf
resources:
- id: https://chorus4ai.org/d4d/resource/demographics
  name: Demographics
  description: Patient demographic data standardized to the OMOP Common Data Model. Access
