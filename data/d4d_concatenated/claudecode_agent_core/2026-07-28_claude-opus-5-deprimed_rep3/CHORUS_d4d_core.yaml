  status: controlled access; metadata available
  conforms_to: OMOP Common Data Model
  is_tabular: true
- id: https://chorus4ai.org/d4d/resource/diagnoses
  name: Diagnoses
  description: Diagnoses documented by providers, standardized to the OMOP Common Data Model.
