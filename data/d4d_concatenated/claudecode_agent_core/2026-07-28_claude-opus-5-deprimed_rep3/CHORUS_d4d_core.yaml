purposes:
- name: Develop a publicly available AI-ready critical care dataset
  description: The project's overarching goal is to develop a publicly available, AI-ready
    critical care dataset, while ensuring the methods promote privacy, accountability, and
    clinical benefit, and while promoting a new generation of AI clinicians and scientists.
  response: The CHoRUS data generation project was created to meet the need for infrastructure
    supporting artificial intelligence and machine learning in critical care, by generating
    high-resolution multi-center data from more than 100,000 critically ill patients.
- name: Enable AI/ML applications in acute and critical care
  description: Generate data for ML/AI applications aimed at characterizing acute and critical
    care illness, predicting complications, and measuring treatment response among patients
    with acute or critical illness.
  response: CHoRUS will develop the necessary network, tools, standards, data, and education
    to build machine-learning and artificial-intelligence-derived models to improve the care
    and outcomes of patients requiring critical care.
- name: Provision a holdout test set for external model validation
  description: The dataset provisions a holdout test set, accessible for model external validation,
    to aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
  response: Sequestering holdout datasets for external validation is one of the project's
    named deliverables.
- name: Create ethically sourced datasets and best practices for AI in health
  description: As one data generation project of four in the NIH-funded Bridge2AI consortium,
    CHoRUS works with other projects to create ethically sourced datasets and tools around
    artificial intelligence and to create best practices for AI in health.
  response: Patient-focused efforts determine the ethical and legal approaches to manage privacy
    and bias, while accounting for social determinants of health.
- name: Answer the grand challenge of improving recovery from acute illness
  description: The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving recovery
    from acute illness.
  response: Expanding artificial intelligence and machine learning to improve recovery from
    acute illness is the dataset's stated framing on the project website.
- name: Build AI workforce and community AI literacy
  description: Cultivate expertise in the lay and scientific community to improve AI literacy
    and utilization through multimodal educational approaches, and train engineers, data scientists,
    and clinicians in AI in clinical care data engineering infrastructure.
  response: A comprehensive set of approaches will develop the skills and workforce for a
    next generation of diverse academic and community AI scientists.
tasks:
- name: Characterizing acute and critical care illness
  description: Use of the dataset to characterize acute and critical care illness among patients
    with acute or critical illness.
- name: Predicting complications and clinical deterioration
  description: Use of the dataset to predict complications in patients with acute or critical
    illness.
- name: Measuring treatment response
  description: Use of the dataset to measure treatment response among patients with acute
    or critical illness.
- name: External validation of AI models
  description: Use of the sequestered holdout test set for external validation of models,
    to aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
- name: Labeling data with prediction targets
  description: A visualization and annotation environment labels data with targets important
    for prediction.
- name: Hands-on AI/ML training and use-case development
  description: The datasets are being used for training activities and publications, including
    the AIM-AHEAD Bridge2AI for Clinical Care Training Program, in which trainees apply AI/ML
    methods to big data analysis and develop practical use cases on the Bridge2AI AI/ML for
    Clinical Care Collaborative Cloud.
addressing_gaps:
- name: Lack of infrastructure for AI/ML in critical care
  description: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care; developing high-resolution multi-center data sets
    is a critical first step towards actionable and trustworthy AI.
- name: Absence of a diverse, high-resolution, ethically sourced AI-ready critical care dataset
  description: CHoRUS aims to acquire and standardize a dataset of unprecedented diversity
    and high resolution, addressing the absence of such a resource for acute and critical
    care.
- name: No legal framework for collecting clinical data at scale
  description: The project establishes a legal framework for collecting data at scale, sampling
    to ensure comprehensive sets of patient conditions and clinical treatment strategies.
- name: Unclear community expectations for public sharing of clinical data
  description: The project performs community-facing ethics focus groups to determine what
    data is appropriate for public sharing.
- name: Missing contextual and social determinant factors in clinical datasets
  description: The project ensures that data elements feature appropriate contextual factors
    such as geographic distance to the nearest hospital, and accounts for social determinants
    of health.
- name: Lack of unified standards across multimodal clinical data
  description: Unified standards harmonize multi-modal EHR, waveform, imaging, and text data,
    supported by validated semantic mappings connecting clinical data in various source formats
    to international standards.
