id: https://chorus4ai.org/
name: CHoRUS for Equitable AI Dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable
  AI
description: 'CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards)
  for Equitable AI is a multi-center, multimodal, high-resolution critical care dataset produced
  by one of the four data generation projects of the NIH Common Fund Bridge2AI program. Its
  stated goal is to develop the most diverse, high-resolution, ethically sourced, AI-ready
  data set to answer the grand challenge of improving recovery from acute illness, and to
  make a publicly available AI-ready critical care dataset while ensuring that the methods
  promote privacy, accountability and clinical benefit. The collaboration spans 20 academic
  centers, of which 14 contribute as Data Acquisition centers, and more than 60 CHoRUS consortium
  members across 20 different institutions.

  Data are collected retrospectively from hospital clinical systems and harmonized across
  nine modalities. Structured electronic health record domains (demographics, medication administration,
  procedures, nursing flowsheets and diagnoses) are standardized to the OMOP Common Data Model;
  unstructured clinical notes are extracted and tokenized with the OHNLP toolkit; imaging
  is drawn from hospital PACS and delivered as DICOM; bedside-monitor telemetry is delivered
  as WFDB waveforms; and hospital EEG is delivered in EDF+ and Persyst formats. All nine modalities
  are under controlled access. OMOP and telemetry data reside in a cloud enclave; clinical
  notes are stored locally at contributing sites with only tokens transferred; imaging de-identification
  is in process for a larger cohort; and EEG extraction is in process.

  The project website reports a current released dataset of 50,000 patient admissions from
  ICU, PICU and NICU, comprising 1.6 billion rows of OMOP electronic health record data, 7,642
  admissions with radiology data, and 23 Tb of waveform data. A September 2025 informational
  webinar reported that, as of August 2025, the dataset covered 14 different hospitals with
  over 45,000 unique admissions and that approximately 1,000 images were available. The anticipated
  final dataset is 100,000 patient admissions across 9 different data modalities from 14 data-contributing
  hospitals. A holdout test set is provisioned and accessible for external model validation
  to aid marketplace adoption of AI-developed models in acute and critical care. Published
  metadata schemas are available for the structured EHR domains and waveform telemetry and
  are planned for clinical notes, imaging and EEG; the structured EHR metadata schema is the
  OMOP schema, with one structured EHR domain published using OMOP schema extensions.'
page: https://chorus4ai.org/
publisher: https://chorus4ai.org/
language: en
status: Active data generation project with a current released dataset available under controlled
  access and an anticipated final dataset still being assembled; the NIH award period runs
  from 2022-09-01 to 2026-11-30. The project website carries the notice "This repoitory is
  under review for potential modification in compliance with Administration directives."
conforms_to: OMOP Common Data Model for structured electronic health record domains; OHNLP
