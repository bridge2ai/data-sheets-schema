sensitive_elements:
- name: Protected clinical and identifying information
  sensitive_elements_present: true
  sensitivity_details:
  - Structured electronic health record data including demographics, diagnoses, procedures,
    medication administration and nursing flowsheets
  - Unstructured clinical notes documented by providers
  - Radiology imaging exported from hospital PACS
  - Bedside-monitor waveform telemetry and hospital EEG recordings
  - Geographic location, geocoded from OMOP Location entities
  - Social determinants of health
acquisition_methods:
- name: Retrospective extraction from hospital clinical systems
  description: Data are acquired retrospectively from the clinical systems of data-contributing
    hospitals, then standardized, tokenized, stored, visualized and labeled through capabilities
    developed across the multi-center network.
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Retrospective data collection from structured electronic health record systems, hospital
    PACS, bedside monitors with gateway/middleware, and hospital EEG databases.
  - Derived representations are produced by extracting and tokenizing clinical notes with
    the OHNLP toolkit and by geocoding OMOP Location entities.
  - Validation is supported by validated semantic mappings connecting clinical data in various
    source formats to international standards, a clinical validation SOP for mapping contributions,
    and characterization reports returned to sites following their data submissions.
collection_mechanisms:
- name: Multi-center acquisition and standardization pipeline
  description: Capabilities developed across a multi-center network to acquire, standardize,
    tokenize, store, visualize and label clinical data.
  mechanism_details:
  - Extraction of structured electronic health record data and standardization to the OMOP
    Common Data Model.
  - Extraction and tokenization of clinical notes using the OHNLP toolkit.
  - Export of imaging from hospital PACS in DICOM.
  - Acquisition of waveform telemetry from bedside monitors via gateway/middleware, delivered
    as WFDB.
  - Acquisition of waveform EEG from hospital databases in EDF+ and Persyst formats.
  - Site-facing tooling and documentation, including the chorus-extract-upload repository
    for creating and uploading a CHoRUS Data Extract and the Chorus_SOP documentation site
    with an interactive workflow diagram describing the step-by-step process for extracting
    and contributing clinical data.
  - Status tracking of data-contributing sites through GitHub issues and a Google Form whose
    submissions trigger a GoogleScript that calls the GitHub API to update status and issue
    information.
  used_software:
  - id: https://chorus4ai.org/d4d/software/chorus-extract-upload
    name: chorus-extract-upload
    description: Repository in the chorus-ai GitHub organization with tools to create and
      upload a CHoRUS Data Extract; primary language Python.
    license: MIT
  - id: https://chorus4ai.org/d4d/software/chorus-sop
    name: Chorus_SOP
    description: CHoRUS centralized SOP documentation site in the chorus-ai GitHub organization,
      hosting an interactive workflow diagram and SOP documents that have undergone internal
      validation and review; primary language MDX.
    license: Apache-2.0
  - id: https://chorus4ai.org/d4d/software/data-acq-sop
    name: data_acq_SOP
    description: Online documentation SOP for the Data Acquisition Module in the chorus-ai
      GitHub organization; primary language JavaScript.
  - id: https://chorus4ai.org/d4d/software/chorus-container-apps
    name: chorus-container-apps
    description: Set of dockerized container applications and associated configurations to
      be deployed to support CHoRUS services on Azure, in the chorus-ai GitHub organization;
      primary language JavaScript.
sampling_strategies:
- name: Multi-center sampling for condition and treatment coverage
  description: Sampling is designed to ensure comprehensive sets of patient conditions and
    clinical treatment strategies across the contributing network.
  is_sample: true
  source_data:
  - Clinical systems of 14 data-contributing hospitals within a collaboration spanning 20
    academic centers
  strategies:
  - Establish a legal framework for collecting data at scale, sampling to ensure comprehensive
    sets of patient conditions and clinical treatment strategies.
  - Federated access enables sampling methods to ensure a balanced and diverse cohort.
  - Ensure that data elements feature appropriate contextual factors such as geographic distance
    to the nearest hospital.
