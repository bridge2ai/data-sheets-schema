known_biases:
- name: Contributing-site selection
  bias_type: selection_bias
  bias_description: The dataset is assembled from 14 data-contributing hospitals drawn from
    a collaboration of 20 academic centers, so the represented patients, care practices and
    documentation conventions reflect those participating academic institutions rather than
    a broader hospital population.
  mitigation_strategy: The project samples to ensure comprehensive sets of patient conditions
    and clinical treatment strategies; federated access enables sampling methods to ensure
    a balanced and diverse cohort; data elements feature contextual factors such as geographic
    distance to the nearest hospital, and social determinants of health are accounted for.
    Patient-focused efforts determine the ethical and legal approaches to manage privacy and
    bias.
  affected_subsets:
  - All modalities contributed by the 14 Data Acquisition centers
known_limitations:
- name: Imaging coverage is partial
  limitation_type: coverage_limitation
  limitation_description: As of the September 2025 informational webinar, approximately 1,000
    images were available, with de-identification in process for a larger cohort. The project
    website reports 7,642 admissions with radiology data against a current released dataset
    of 50,000 admissions.
  scope_impact: Imaging is present for only a minority of admissions in the current release.
  recommended_mitigation: Confirm imaging availability for the intended cohort before designing
    analyses that require imaging on all admissions.
- name: EEG waveform extraction incomplete
  limitation_type: coverage_limitation
  limitation_description: Waveform EEG extraction from hospital databases was in process at
    the time of the September 2025 informational webinar.
  scope_impact: EEG data may be absent or incomplete for admissions in the current release.
- name: Clinical notes are not centrally held
  limitation_type: coverage_limitation
  limitation_description: Clinical notes are stored locally at contributing sites; only tokens
    produced by the OHNLP toolkit are held in the enclave alongside OMOP and telemetry data.
  scope_impact: Analyses requiring the full text of clinical notes cannot be run in the enclave
    on the note text itself.
- name: Metadata schema publication incomplete
  limitation_type: integration_limitation
  limitation_description: Published metadata is available for the structured EHR domains and
    waveform telemetry, but is only planned for clinical notes, imaging and waveform EEG.
  scope_impact: Machine-readable metadata for three of the nine modalities was not yet published
    at the time of the source reporting.
- name: Restricted to acute and critical care
  limitation_type: scope_limitation
  limitation_description: The dataset covers patients with acute or critical illness, with
    released admissions drawn from ICU, PICU and NICU settings.
  scope_impact: Findings may not transfer to general ward, ambulatory or non-acute populations.
- name: Retrospective collection
  limitation_type: temporal_limitation
  limitation_description: Data collection is retrospective, drawn from clinical care already
    documented in hospital systems.
  scope_impact: Variables are limited to what was recorded during routine care; no research-specific
    prospective measurements were added.
- name: Current release is smaller than the anticipated final dataset
  limitation_type: coverage_limitation
  limitation_description: The current released dataset comprises 50,000 patient admissions,
    against an anticipated final dataset of 100,000 patient admissions across 9 data modalities
    from 14 data-contributing hospitals.
  scope_impact: Statistical power and subgroup coverage in the current release are lower than
    the project's stated end state.
- name: Represented population reflects participating academic centers
  limitation_type: representativeness_limitation
  limitation_description: Data are contributed by 14 Data Acquisition centers within a 20-academic-center
    United States collaboration.
  scope_impact: Generalization beyond the participating academic centers should be verified.
  recommended_mitigation: Use the sequestered holdout test set for external validation, and
    account for contextual factors such as geographic distance to the nearest hospital and
    social determinants of health.
confidential_elements:
- name: Controlled-access clinical data
  confidential_elements_present: true
  confidentiality_details:
  - All nine data modalities are under controlled access.
  - Access requires a registration form recording name, email and institution, a signed licensing
    agreement, and a ".edu" email address; access is granted and compute provisioned before
    an access notification email is sent.
  - OMOP and telemetry data reside in a cloud enclave; clinical notes are stored locally at
    contributing sites and only tokens are transferred.
