    OMOP schema.
  status: controlled access; metadata available
  conforms_to: OMOP Common Data Model
  is_tabular: true
- id: https://chorus4ai.org/d4d/resource/medication-administration
  name: Medication administration
  description: Medication administration records, with dosing time-stamped upon each infusion
    change or dose administration, standardized to the OMOP Common Data Model. Access control
    is Controlled; metadata is available and the published metadata schema is the OMOP schema.
  status: controlled access; metadata available
  conforms_to: OMOP Common Data Model
  is_tabular: true
- id: https://chorus4ai.org/d4d/resource/procedures
  name: Procedures
  description: Procedures documented by providers, standardized to the OMOP Common Data Model.
    Access control is Controlled; metadata is available and the published metadata schema
    is the OMOP schema.
  status: controlled access; metadata available
  conforms_to: OMOP Common Data Model
  is_tabular: true
- id: https://chorus4ai.org/d4d/resource/nursing-flowsheets
  name: Nursing flowsheets
  description: High-frequency nursing flowsheet documentation, standardized to the OMOP Common
    Data Model. Access control is Controlled; metadata is available and the published metadata
