instances:
- id: instance_participant
  name: Study participant
  instance_type: human research participant
  counts: 2280
  label: false
  label_description: >-
    No explicit label or target is associated with each data instance; the dataset is hypothesis-agnostic
    and no labeling was performed.
  description: >-
    Each instance represents an individual participant in the AI-READI study, and consists of all
    data available for that individual. This version of the dataset has data from 2280 participants.
    The first version of the dataset, composed of data from the pilot data collection phase, had 204
    instances; the second version, composed of data through the first full year of the study, had
    1067 instances. Multiple modalities are collected for each participant, including survey data,
    clinical data, retinal imaging data, environmental sensor data, continuous glucose monitor data
    and wearable activity monitor data, encompassing tabular data, imaging data, and physiological
    signal/waveform data. There is no unstructured text data in the dataset. In the dataset directory
    structure, each device directory contains one folder per participant, named after the participant's
    study ID number. There is currently only one visit per participant. The recruitment and sampling
    strategy that produced these instances is recorded under the dataset-level sampling_strategies
    slot.
anomalies:
- id: anomaly_survey_and_device_errors
  name: Survey non-response, device failure, and imaging noise
  description: Errors, sources of noise, and redundancies reported by the dataset creators.
  anomaly_details:
  - In survey data, skipped questions or incomplete responses are expected.
  - >-
    In wearable data, improper use and technical failure such as battery failure or system malfunction
    are expected.
  - >-
    In imaging data, patient uncooperation, noise that may obscure the images, technical failure such
    as system malfunction, and data transfer failures are expected.
  - >-
    In a few cases the data collection device did not have any stored results or was returned too
    late to retrieve the results (for example, battery died or data was lost); in a few cases there
    may have been a data collision at some point in the process and data has been lost.
  - >-
    Image quality varies by modality and operator involvement. For the handheld, undilated Optomed
    Aurora fundus camera, image quality varies from patient to patient and within the same patient.
    For the Heidelberg Spectralis, which is operator-driven and not fully automated, quality issues
    may arise that lead to skipping the modality and missing data. FLIO is performed last in the visit
    and exposes participants to uncomfortable light levels, so participant compliance may not be at
    its best.
known_biases:
- id: bias_volunteer_selection
  name: Volunteer (self-selection) bias
  bias_type: selection_bias
  bias_description: >-
    Participants are volunteers, therefore there is selection bias known as volunteer bias, which
    may limit the generalisability of results to those who are not represented in the study population.
  mitigation_strategy: >-
    Recruitment is conducted in waves from electronic health record screening pools at all three sites,
    with the composition of participants monitored for diversity and inclusion and adjusted by under-
    and oversampling groups as needed.
- id: bias_incomplete_demographic_balance_in_releases
  name: Incomplete demographic balance in interim releases
  bias_type: representation_bias
  bias_description: >-
    While the AI-READI cross-sectional database ultimately aims to achieve balance across race/ethnicity,
    biological sex, and diabetes presence and severity, the pilot study is not balanced across these
    parameters, and because enrollment is ongoing, the pilot data release and periodic updates to
    data releases may not have achieved balanced distribution across groups.
  mitigation_strategy: >-
    Because sex, race and ethnicity data are not released with the public version of the dataset,
    the project team prepared recommended data splits in which the validation and test sets are balanced
    as well as possible for sex, race/ethnicity and diabetes status, in order to reduce disparities
    in models developed using the dataset.
  affected_subsets:
  - Version 1.0.0 (pilot data collection phase)
  - Interim releases prior to completion of enrollment
- id: bias_recruitment_setting_and_coverage
  name: Urban, hospital-based recruitment and omitted population groups
  bias_type: sampling_bias
  bias_description: >-
    Factors influencing the generalization of derived models include the predominantly urban and hospital-based
    recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds. The study
    cohort may not provide a comprehensive representation of the population, as it does not include
    other races/ethnicities such as Pacific Islanders and Native Americans. Requiring that eligible
    participants speak, read and understand English may also have created challenges in recruiting
    Hispanic and/or Asian persons.
  mitigation_strategy: >-
    Three recording sites were strategically selected for geographic diversity across the United States
    and to ensure diverse representation across racial and ethnic groups, with individuals from all
    demographic backgrounds recruited at all three sites and site-specific recruitment priorities
    set by local demographics. The project engaged with the Native Biodata Consortium as a co-learning
    opportunity for understanding challenges specific to American Indian and Alaska Native communities.
    An NIH supplement was submitted to fund translation of study materials to enable participation
    of Spanish-speaking participants.
  affected_subsets:
  - Pacific Islander populations
  - Native American and Alaska Native populations
  - Non-English-speaking populations
- id: bias_device_and_site_heterogeneity
  name: Multi-device and multi-site measurement heterogeneity
  bias_type: measurement_bias
  bias_description: >-
    The number and diversity of devices included in the dataset, data recording specificities such
    as scan protocol, and the number and diversity of recording sites are factors that might limit
    the generalization of derived models. Multiple different device models were used for the same
    measure across sites (for example three different lensometer models and three different blood
    pressure monitor models).
  mitigation_strategy: >-
    Information on device make and model, including specific modalities such as macula scans or wide
    scans during OCT, was documented to ensure repeatability, and multiple devices were deliberately
    included for one measure to enhance generalizability and represent the diverse range of equipment
    used in clinical settings. Uniform data collection protocols were implemented for all subjects
    irrespective of race/ethnicity, biological sex or diabetes severity, across all study sites.
known_limitations:
- id: limitation_representativeness
  name: Cohort representativeness
  limitation_type: representativeness_limitation
  limitation_description: >-
    The cohort is drawn from patients aged 40 and older who had a medical encounter within one of
    three academic health systems, is predominantly urban and hospital-based, requires English proficiency,
    and excludes pregnancy, gestational diabetes and type 1 diabetes. Populations such as Pacific
    Islanders and Native Americans are not represented.
  scope_impact: >-
    Models trained on the dataset may not generalize to rural, non-English-speaking, younger, or unrepresented
    populations, or to type 1 or gestational diabetes.
  recommended_mitigation: >-
    Use the recommended data splits, which are balanced as far as possible for sex, race/ethnicity
    and diabetes status, and interpret findings within the stated eligibility criteria and recruitment
    setting.
- id: limitation_modality_coverage
  name: Incomplete modality coverage across participants
  limitation_type: coverage_limitation
  limitation_description: >-
    Not all modalities are available for all participants. Some participants elected not to participate
    in some study elements, and in some cases device or transfer failures prevented data retrieval.
  scope_impact: >-
    Analyses requiring complete multimodal records will have fewer usable participants than the headline
    count of 2280.
  recommended_mitigation: >-
    Consult the per-datatype manifest.tsv files and the participants.tsv file to determine which modalities
    are present for each participant.
- id: limitation_cross_sectional_scope
  name: Cross-sectional design with limited longitudinal follow-up
  limitation_type: scope_limitation
  limitation_description: >-
    AI-READI is a cross-sectional study, and there is currently only one visit per participant. Longitudinal
    data are planned for only a small subgroup: the NIH RePORTER abstract and the study README describe
    longitudinal data from 10 percent of the cohort, and the healthsheet states that approximately
    4 percent of participants are expected to undergo a follow-up examination in Year 4.
  scope_impact: >-
    Disease-trajectory questions must be approached through cross-sectional methods such as pseudotime
    manifold analysis rather than through direct within-participant longitudinal observation.
- id: limitation_temporal_coverage
  name: Temporal coverage of this release
  limitation_type: temporal_limitation
  limitation_description: >-
    Version 3.0.0 covers data collected between July 19, 2023 and May 1, 2025, and does not contain
    data from participants enrolled after that window. Enrollment is ongoing, with recruitment planned
    to continue until November 30, 2026 and anticipated study completion on January 1, 2027.
  scope_impact: >-
    The dataset is an interim snapshot of a target 4000-participant cohort and does not yet reflect
    the final planned sample size or balance.
  recommended_mitigation: >-
    Check FAIRhub for later versions; new versions are planned approximately once a year with additional
    data from participants enrolled since the previous release.
- id: limitation_variable_changes_and_biorepository
  name: Variable changes between versions and finite biospecimen supply
  limitation_type: methodological_limitation
  limitation_description: >-
    The data fields and types are largely the same as the previous version of the dataset, but the
    Snellen visual acuity variables were dropped in this version, so only logMAR visual acuity measurements
    are available. Separately, a limitation of the AI-READI biorepository is that there are a finite
    number of samples to share with scientists interested in using them in research.
  scope_impact: >-
    Analyses that depend on Snellen visual acuity cannot be reproduced against v3.0.0, and biospecimen-based
    ancillary studies will be constrained by sample availability.
  recommended_mitigation: >-
    Consult the CHANGELOG.md file included with the dataset for the full list of changes between versions.
    Procedures for reviewing and prioritising written requests for biospecimens were to be developed
    before the biorepository is complete.
confidential_elements:
- id: confidentiality_none_present
  name: Confidential data
  confidential_elements_present: false
  confidentiality_details:
  - >-
    The dataset creators state that the dataset does not contain data that might be considered confidential,
    and that no personally identifiable information is included in the dataset.
content_warnings:
- id: content_warning_none_present
  name: Offensive or distressing content
  content_warnings_present: false
  warnings:
  - >-
    The dataset creators answered "No" to whether the dataset contains data that, if viewed directly,
    might be offensive, insulting, threatening, or otherwise pose a safety risk.
subpopulations:
- id: subpopulation_demographics_withheld
  name: Demographic sub-populations
  subpopulation_elements_present: false
  identification:
  - >-
    The dataset creators answered "No" to whether the dataset identifies demographic sub-populations.
    Sex, race and ethnicity are not released with the public version of the dataset; those variables
    are held under controlled access. No regulation prevented demographic data collection in the study.
  - >-
    The study itself recruits into four diabetes-status groups (no diabetes; pre-diabetes or lifestyle-controlled;
    oral or non-insulin injectable medication controlled; insulin dependent) and targets four self-reported
    race/ethnicity groups (Asian, Black, Hispanic, White), but these group labels are not attached
    to instances in the public release.
  distribution:
  - >-
    Aggregate distributions across the recommended splits are published in the dataset README. Across
    all 2280 participants: by self-reported race/ethnicity, Hispanic 380, Asian 545, Black 519, White
    836; by sex, male 951, female 1329; by diabetes status, no diabetes 776, pre-diabetes or lifestyle-controlled
    560, oral or non-insulin injectable medication controlled 686, insulin controlled 258. Mean age
    across the cohort is 60.8 +/- 11.3 years.
  - >-
    Because these demographic labels are not distributed with the public data, the project team supplies
    a recommended 70/15/15 split in participants.tsv in which the validation and test sets are balanced
    as far as possible for these attributes, as a method of reducing disparity in error rates between
    demographic subgroups when demographic labels are unavailable.
sensitive_elements:
- id: sensitive_elements_removed_from_public_release
  name: Sensitive data elements
  sensitive_elements_present: false
  sensitivity_details:
  - >-
    The dataset creators state that the public dataset does not contain data that is considered sensitive.
    The v3.0.0 release contains no protected health information (PHI), and information related to
    participant sex and race/ethnicity as well as medications used has been removed.
  - >-
    The separate controlled-access dataset does contain sensitive elements: 5-digit ZIP code, sex,
    race, ethnicity, genetic sequencing data, past health records, medications, and traffic and accident
    reports. Access to that tier requires a data use agreement.
acquisition_methods:
- id: acquisition_mixed_observed_and_reported
  name: Directly observed and participant-reported acquisition
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: false
  was_validated_verified: true
  acquisition_details:
  - >-
    The acquisition of data varied by domain. Some data were directly observable, such as laboratory
    results, vitals and retinal imaging, while other data were reported by subjects, such as survey
    responses.
  - >-
    Verification of data entry was performed when possible, for example cross-referencing entered
    medications with medications that were physically brought in or photographed by each study participant.
  - >-
    Data were collected directly from participants across the three recruiting sites. Recruitment
    pools were identified by screening electronic health records for diabetes and prediabetes ICD-10
    codes (E11.X and R73.09) among patients who had an encounter with the sites' health systems.
  - >-
    Medical records were additionally accessed to obtain data on general health, eye health, medical
    and surgical history, diabetes, medications, laboratory records, and previous medical imaging,
    and driving and accident records were obtained from the Department of Licensing. These elements
    are held under controlled access rather than released publicly.
collection_mechanisms:
- id: collection_mechanism_redcap
  name: REDCap electronic data capture
  mechanism_details:
  - >-
    REDCap is used for collecting patient-reported data from questionnaires and the following clinical
    data from the visit: medications assessment, vitals, visual acuity, contrast sensitivity, monofilament
    test results and complete blood count results.
  - >-
    Questionnaires administered through REDCap include a screening questionnaire (eligibility, diabetes
    health status, diabetes treatments, race and ethnicity, biological sex), demographic information,
    the Center for Epidemiological Studies Depression Scale (CES-D-10), the Problem Areas in Diabetes
    scale (PAID-5), a diabetes self-care score, a dietary assessment, an ophthalmic survey, smoking/alcohol/vaping/marijuana
    history (marijuana use not assessed for participants living in Alabama), a general health survey,
    Social Determinants of Health surveys drawn from the PhenX Toolkit, and a current medications
    list with RxNorm codes.
  - >-
    Questionnaires may be filled out electronically or on paper before or after the in-person visit
    to reduce visit time. Monofilament results are recorded on an iPad, laptop or paper questionnaire
    and entered directly into REDCap by clinical research staff.
- id: collection_mechanism_retinal_imaging
  name: Retinal imaging devices
  mechanism_details:
  - >-
    Both eyes are imaged for each participant using multiple devices with different but partially
    overlapping modalities, chosen to provide widespread coverage of the retina with the goal of detecting
    pixel-level differences in pathology. All retinal images are collected under dilated conditions
    except for the Optomed Aurora.
  - >-
    Optomed Aurora IQ (Oulu, Finland): macula- and disc-centred colour fundus photographs, undilated,
    4 images per participant, exported as DICOM.
  - >-
    iCare EIDON widefield truecolor confocal fundus system (Raleigh, North Carolina): ultra-wide field
    central, nasal and temporal colour fundus photographs, ultra-wide field central infrared, ultra-wide
    field central fundus autofluorescence, and a mosaic of ultra-wide field images; 12 images per
    participant, exported as DICOM.
  - >-
    Heidelberg Engineering Spectralis HRA OCT/OCTA (Heidelberg, Germany): optic nerve head-radial
    circle-high resolution OCT, posterior pole macula-HR-61 lines OCT, and macula 20x20-HS-512 lines
    OCTA; 6 images per participant, exported as DICOM.
  - >-
    Topcon Maestro2 3D OCT-1 (Tokyo, Japan): 3D Wide (H) 12x9-512x128 OCT, 3D Macula 6x6-512x128 OCT
    and Macula 6x6-360x360 OCTA; 6 images per participant, exported in .fda file format and converted
    to DICOM for the dataset.
  - >-
    Topcon Triton DRI OCT (Tokyo, Japan): 3D(H)+Rad 12x9-512x256 OCT, Macula 6x6-320x320 OCTA and
    Macula 12x12-512x512 OCTA; 6 images per participant, exported in .fda file format and converted
    to DICOM for the dataset.
  - >-
    Carl Zeiss Meditec Cirrus 5000 (Jena, Germany): Disc Cube 200x200 OCT, Macula Cube 512x128 OCT,
    Macula 6x6 OCTA and Disc 6x6 OCTA; 8 images per participant, exported as DICOM.
  - >-
    Heidelberg Engineering fluorescence lifetime imaging ophthalmoscopy (FLIO): macula-centred imaging,
    2 images per participant, exported in .sdt file format and converted to DICOM for the dataset.
- id: collection_mechanism_at_home_monitoring
  name: At-home monitoring devices
  mechanism_details:
  - >-
    At the end of the in-person visit, participants are sent home with three data monitoring devices
    to be used continuously for 10 days: a custom-designed home environmental sensor, a Garmin Vivosmart
    5 fitness tracker and a Dexcom G6 continuous glucose monitor. Participants return the devices
    to study staff by overnight mail or in person after 10 days, with mailing materials and fees provided
    by the site.
  - >-
    Dexcom G6 continuous glucose monitor (San Diego, California): blood glucose measurements in mg/dL
    every 5 minutes, exported as .csv. Participants are masked to the CGM results during the monitoring
    period. Participants already wearing a Dexcom G6 may either place an additional study sensor or
    share their existing device data through Dexcom Clarity, in which case up to 90 days of prior
    glucose values may optionally be downloaded, for up to 100 days of glucose data in total.
  - >-
    Garmin Vivosmart 5 physical activity monitor (Schaffhausen, Switzerland): number of steps, heart
    rate, sleep duration (circadian and diurnal rhythm) and oxygen saturation, exported in .FIT file
    format and converted to the Open mHealth standard for the dataset.
  - >-
    Custom environmental sensor, the LeeLab Anura, designed at the Karalis Johnson Retina Center,
    University of Washington: ambient temperature, relative humidity, nitrogen oxides (NO and NO2),
    volatile organic compounds, particulate matter (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral
    light intensity measurements, exported as .csv.
  - >-
    The environmental sensor and Garmin fitness tracker were specifically chosen with participant
    privacy as a primary concern: they do not capture video or audio, are not equipped with GPS location
    monitoring, and are not synced with participant-owned devices. Participants return the monitoring
    devices with a data sheet indicating which wrist the fitness tracker was worn on, their dominant
    hand, and where the environmental sensor was placed in the home.
- id: collection_mechanism_clinical_and_functional_testing
  name: On-site clinical, functional and cognitive testing
  mechanism_details:
  - >-
    Height, weight and waist and hip circumference are measured, followed by calculation of waist-hip
    ratio and body mass index. Systolic and diastolic blood pressure and heart rate are measured twice,
    separated by 2 minutes, with an automatic oscillometric medically approved device; monitors used
    across sites include the OMRON HEM 907XL, the Medline MDS4001 and the Welch Allyn 6000 series
    with FlexiPort reusable cuff.
  - >-
    A 12-lead ECG is performed with the Philips PageWriter TC30 Cardiograph while the participant
    sits in a reclining chair or lies supine; the position is recorded (0, 30, 60 or 90 degrees relative
    to supine). ECG data are exported in .xml format.
  - >-
    Peripheral neuropathy is assessed with the monofilament test, applying a 10 g filament at three
    locations on each foot, ten times per location, with shoes and socks removed and the participant's
    eyes closed.
  - >-
    General cognitive screening uses the Montreal Cognitive Assessment (MoCA) administered electronically
    on an iPad with the MoCA Duo application (MoCA Cognition, Quebec, Canada). Total score, section
    subscores, Memory Index Score and task completion times are exported as .csv. The maximum score
    is 30, with higher numbers representing better performance.
  - >-
    Visual acuity and contrast sensitivity are assessed under both photopic (daylight) and mesopic
    (dim light) conditions, with right and left eyes tested separately. Photopic letter visual acuity
    is measured with the M&S Technologies Electronic Visual Acuity tester at 4 metres; mesopic acuity
    is measured through a 2.0 neutral density filter. Acuity is measured under best-corrected conditions
    and expressed as logMAR. Photopic letter contrast sensitivity is measured with the Mars chart
    (Mars Perceptrix) and mesopic contrast sensitivity through the 2.0 neutral density filter, expressed
    as log contrast sensitivity.
  - >-
    Autorefraction data for each eye (spherical and cylindrical components in dioptres with cylindrical
    axis) are obtained with the Topcon KR 800 autorefractor. Lensometers used across sites include
    the NIDEK LM-600P, Topcon CL-200 and Topcon CL-300.
- id: collection_mechanism_biospecimen_and_laboratory
  name: Biospecimen collection and clinical laboratory testing
  mechanism_details:
  - >-
    Non-fasting blood (approximately 50-60 mL; the protocol publication states 53 mL) and a urine
    specimen are collected during the study encounter. One EDTA vacutainer is dedicated to a local
    Clinical Laboratory Improvement Amendments-certified laboratory for complete blood count analysis
    on fresh whole blood.
  - >-
    All other laboratory tests are performed by the University of Washington Nutrition and Obesity
    Research Center (NORC) testing facility on stored, frozen samples. Serum, plasma, whole blood
    and urine analysed by NORC are first stored locally at UAB and UCSD at -70 C, then batch-shipped
    to UW on dry ice approximately once per quarter. NORC results are provided in .csv format.
  - >-
    EDTA plasma tests: N-terminal pro-B-type natriuretic peptide, troponin-T, C-peptide and insulin.
    Whole blood tests: HbA1c, white blood cell count, red blood cell count, haemoglobin, haematocrit,
    MCV, MCH, MCHC, RDW and platelets. Serum tests: high-sensitivity C-reactive protein, total cholesterol,
    triglycerides, HDL cholesterol, calculated LDL cholesterol, glucose, blood urea nitrogen, creatinine,
    BUN/creatinine ratio, sodium, potassium, chloride, total carbon dioxide, calcium, total protein,
    albumin, calculated total globulin, A/G ratio, total bilirubin, alkaline phosphatase, aspartate
    aminotransferase and alanine aminotransferase. Urine tests: creatinine and albumin.
  - >-
    Blood derivatives are sent to the biorepository at the University of Alabama at Birmingham Center
    for Clinical and Translational Science and will be available to researchers for future ancillary
    studies. Banked specimen types are buffy coats (for genomic DNA extraction), genomic DNA, plasma
    and serum (for future proteomics and metabolomics), PAXgene vacutainers (for future RNA isolation)
    and peripheral blood mononuclear cells (for future immunological studies and generation of induced
    pluripotent stem cells). Local processing for plasma, serum and buffy coats uses standardised
    operating procedures on the day of collection; CPT tubes and PAXgene tubes from UW and UCSD are
    shipped overnight to UAB for centralised processing. Biobanked samples are not part of this data
    release.
collection_timeframes:
- id: collection_timeframe_v3_release
  name: Data collection window covered by version 3.0.0
  start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details:
  - >-
    For this version of the dataset, the timeframe for data collection was July 19, 2023 to May 1,
    2025. The FAIRhub dataset description records this as the "Collected" date range 2023-07-19/2025-05-01.
  - >-
    Preliminary pilot enrolment occurred between 18 July 2023 and 30 November 2023; the formal data
    collection process began on 1 December 2023. Preliminary data from the pilot enrollment period
    were included in the first released dataset (May 2024).
  - >-
    The timeline for the overall project spans four years, with one year dedicated to protocol development
    and training and years 2 to 4 allocated for subject recruitment and data collection. Enrolment
    is planned to continue until 30 November 2026, and the FAIRhub study record gives an anticipated
    completion date of 2027-01-01. The study start date is recorded as 2023-07-19 (actual); the protocol
    publication states enrolment began on 18 July 2023.
  - >-
    The collection timeframe matches the creation timeframe of the data associated with the instances:
    data were generated prospectively at the time of the study encounter and the subsequent 10-day
    at-home monitoring period, with the exception of optionally downloaded Dexcom Clarity glucose
    data covering up to 90 days prior to the visit and of abstracted medical-record and driving-record
    history, which are held under controlled access.
data_collectors:
- id: data_collector_study_team
  name: AI-READI study team at the three data collection sites
  role: >-
    Clinical research coordinators, research assistants, phlebotomists, laboratory assistants, imaging
    staff, data managers, database managers, software and cloud engineers, project managers, research
    and data scientists, domain experts, and site principal investigators.
  collector_details:
  - >-
    Details about the AI-READI team members involved in the data collection process are published
    at https://aireadi.org/team.
  - >-
    Clinical research coordinators contact and consent participants, usher participants through the
    research visit, conduct study visits including collection of ophthalmologic images, train participants
    on continuous glucose monitoring and fitness tracker use, and ensure the return of all study materials.
    Research assistants perform the same visit tasks under the direction of the coordinator or project
    manager and are responsible for data upload and management from each clinic visit. Phlebotomists
    collect blood; laboratory assistants process and ship samples. Database managers ingest data into
    REDCap and extract it for processing; research and data scientists process data for release; software
    engineers build the curation pipelines; cloud engineers manage the cloud infrastructure. Data
    managers at each site oversee the process and are responsible for quality control of all data
    before uploading to FAIRhub.
  - >-
    All research personnel at the three data sites who recruited, enrolled and collected data underwent
    training by the data manager at UAB and worked from a detailed Manual of Procedures. Successful
    completion of a certification process is required for all coordinators, which involves mandatory
    institutional compliance training for human subject research; prior to enrolling and testing participants,
    all coordinators must successfully administer all protocol elements to at least three volunteer
    practice subjects, meeting the standards outlined in the Manual of Procedures. A preliminary pilot
    enrolment period ran from 18 July 2023 to 30 November 2023 to secure sufficient familiarity for
    all coordinators.
  - >-
    Team effort was supported by National Institutes of Health award OT2OD032644 based on the percentage
    of effort contributed, with salaries aligned to the funding guidelines at each site.
  - >-
    A Community Advisory Board of 11 persons from the three sites, including diversity in race and
    ethnicity as represented in the AI-READI sample, contributes to the development of the protocol
    and evaluates consent forms and research protocols.
missing_data_documentation:
- id: missing_data_documentation_modalities
  name: Missing modality and item-level data
  missing_data_patterns:
  - Not all modalities are available for all participants.
  - Skipped questions and incomplete responses occur in survey data.
  - >-
    Imaging modalities may be absent where a modality was skipped for quality reasons, particularly
    for the operator-driven Heidelberg Spectralis.
  missing_data_causes:
  - Some participants elected not to participate in some study elements.
  - >-
    In a few cases the data collection device did not have any stored results or was returned too
    late to retrieve the results, for example because the battery died or data was lost.
  - >-
    In a few cases there may have been a data collision at some point in the process and data has
    been lost.
  - >-
    Improper device use, technical failure such as battery failure or system malfunction, and data
    transfer failures.
  handling_strategy: >-
    Missing values were not imputed. During data entry, missing data that could be directly filled
    from other portions of an individual's record were completed under the guidance and approval of
    the site principal investigator; where there was no logical or appropriate way to correct the
    data, the site principal investigator reviewed the values and decided whether they should be removed.
    Modality coverage per participant can be determined from the per-datatype manifest.tsv files distributed
    with the dataset.
raw_data_sources:
- id: raw_data_source_redcap
  name: REDCap study database
  source_description: >-
    Participant-reported questionnaire responses and coordinator-entered clinical data (medications
    assessment, vitals, visual acuity, contrast sensitivity, monofilament results, complete blood
    count results) captured in the University of Washington REDCap installation.
  source_type:
  - electronic data capture system
  - participant-reported survey
  access_details: >-
    Not publicly accessible. Data are exported, quality-controlled by the site data manager, and mapped
    to the OMOP Common Data Model before upload to FAIRhub.
  raw_data_format:
  - REDCap database export
- id: raw_data_source_imaging_devices
  name: Retinal imaging device exports
  source_description: >-
    Native exports from the retinal imaging devices used in the protocol (Optomed Aurora, iCare EIDON,
    Heidelberg Spectralis, Heidelberg FLIO, Topcon Maestro2, Topcon Triton, Zeiss Cirrus).
  source_type:
  - medical imaging device
  access_details: >-
    Not publicly distributed in native form. All participant images are exported from imaging devices
    in their raw format, and images not already in DICOM are converted to the DICOM standard prior
    to upload to the AI-READI data storage platform.
  raw_data_format:
  - DICOM
  - .fda (Topcon)
  - .sdt (Heidelberg FLIO)
- id: raw_data_source_wearables_and_sensors
  name: At-home monitoring device exports
  source_description: >-
    Native exports from the Dexcom G6 continuous glucose monitor, the Garmin Vivosmart 5 activity
    monitor, and the custom LeeLab Anura home environmental sensor.
  source_type:
  - wearable device
  - environmental sensor
  access_details: >-
    Not publicly distributed in native form. Garmin .FIT exports are converted to the Open mHealth
    standard, and CGM and environmental sensor .csv exports are standardised before upload.
  raw_data_format:
  - .csv
  - .FIT
- id: raw_data_source_laboratory
  name: Clinical laboratory results
  source_description: >-
    Results of blood and urine assays performed by CLIA-certified laboratories local to each site
    (complete blood count) and by the University of Washington Nutrition and Obesity Research Center
    (all other assays).
  source_type:
  - clinical laboratory information system
  access_details: >-
    Provided to the study in .csv format by the testing laboratories and mapped to the OMOP Common
    Data Model for release.
  raw_data_format:
  - .csv
- id: raw_data_source_electronic_health_records
  name: Electronic health records and external administrative records
  source_description: >-
    Electronic health record data used for pre-screening (age, diabetes status and other eligibility
    criteria) and for abstraction of general health, eye health, medical and surgical history, diabetes,
    medications, laboratory records and previous medical imaging, together with driving and accident
    records obtained from the Department of Licensing.
  source_type:
  - electronic health record
  - administrative record
  access_details: >-
    Not released in the public dataset. Past health records, medications and traffic and accident
    reports are held in the controlled-access tier and require a data use agreement.
sampling_strategies:
- id: sampling_strategy_triple_balanced_recruitment
  name: Triple-balanced non-probability recruitment from health system encounters
  description: >-
    The recruitment and sampling strategy used to assemble the AI-READI cohort from which this dataset
    is drawn.
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - >-
    The study base is all patients aged 40 years or older who had a medical encounter within each
    health system site (University of Alabama at Birmingham, University of California San Diego, University
    of Washington) between 2020 and 2025 according to the protocol publication; the healthsheet describes
    the same screening as covering patients with an encounter within the sites' health systems in
    the past 2 years.
  - >-
    Patients with T2DM and pre-diabetes are identified by screening electronic health records for
    ICD-10 diagnosis codes E11.X and R73.09 respectively; patients without diabetes will not have
    encounters with these ICD codes.
  strategies:
  - The FAIRhub study record characterises the sampling method as a non-probability sample.
  - >-
    Note on a source disagreement over the target sample size: the protocol publication, the Nature
    Metabolism comment, the NIH RePORTER abstract, the dataset README and the FAIRhub study record
    (enrollment 4000, anticipated) all give a target of 4000 participants, and the IRB protocol's
    own subject-group table gives 1000 participants in each of four diabetes-status groups, also totalling
    4000. The narrative text of the same IRB protocol, the earliest document in the source bundle,
    twice states a target of 4600. This datasheet records 4000 on the weight and recency of the other
    sources.
  - >-
    Rather than targeting the demographic distribution of the US population, the study is triple-balanced
    by recruiting in approximately equal proportions across four race/ethnicity groups (Asian, Black,
    White, Hispanic), four categories of T2DM (no diabetes; pre-diabetes or lifestyle-controlled;
    treated with oral or non-insulin injectable medications; insulin-controlled) and biological males
    and females, with a target of approximately 1000 participants in each of the four diabetes groups
    and 1000 from each of the four racial and ethnic groups. Subjects are age- and sex-matched within
    and between groups.
  - >-
    Participants are recruited in waves. For each wave a contact pool is identified by screening electronic
    health records at each site; UAB coordinates selection of a stratified sample from the combined
    UW, UCSD and UAB list to achieve balancing of race/ethnicity, sex and diabetes severity, on a
    recursive basis until recruitment goals are met. Individuals are mailed a hardcopy invitation
    letter and sent an invitation email, both personalised with links, access codes and QR codes directing
    them into an online REDCap recruitment interface. Approximately 50,000 invitation letters from
    each site were anticipated over 3 or more years of recruitment.
  - >-
    All study groups are recruited from each site to capture diversity, but the proportion of each
    group varies with the demographic prevalence of each group in the site's geographical area: UW
    concentrates on Asian, then Hispanic, then Black participants; UCSD prioritises Hispanic, then
    Asian, then Black participants; UAB prioritises Black, then Hispanic, then Asian participants.
    All sites recruit White participants. Race and ethnicity information is self-reported at screening
    and enrollment.
  - >-
    Relative to the enrolled cohort, this release is not a subsample: the dataset creators state that
    the dataset contains all possible instances, specifically data from all participants enrolled
    during the covered data collection period.
  why_not_representative:
  - >-
    The cohort is deliberately balanced rather than demographically representative of the US population,
    because building balanced datasets is described as critical for the development of unbiased machine
    learning models.
  - >-
    Recruitment is predominantly urban and hospital-based and excludes populations such as Pacific
    Islanders and Native Americans, and eligibility requires English proficiency and excludes pregnancy,
    gestational diabetes and type 1 diabetes.
  representative_verification:
  - >-
    As recruitment progresses, the composition of participants is monitored in terms of diversity
    and inclusion and adjusted by under- and oversampling groups as needed, according to health record
    data on race/ethnicity, gender, T2DM severity and site.
raw_sources:
- id: raw_data_retention_not_shared
  name: Retention and availability of raw data
  raw_data_details:
  - >-
    The raw data is saved and expected to be preserved by the AI-READI project at least for the duration
    of the project, but is not anticipated to be shared outside the project team at present, because
    it has not been mapped to standardized terminologies and because the raw data may accidentally
    include personal health information or personally identifiable information, for example in free
    text fields.
  - >-
    There is a possibility that raw data may be included in future releases of the controlled-access
    dataset.
  - >-
    Imaging data are the partial exception: all participant images are exported from the imaging devices
    in their raw format, and those already in DICOM are released in that form, while Topcon .fda and
    Heidelberg .sdt exports are converted to DICOM for the dataset.
preprocessing_strategies:
- id: preprocessing_standardization_and_deidentification
  name: Standardization, format conversion and de-identification
  preprocessing_details:
  - >-
    Once data were sent from each study site to the central project team, additional processing steps
    were conducted in preparation for dissemination. All data were mapped to standardized terminologies
    where possible, such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model
    for clinical data and the Digital Imaging and Communications in Medicine (DICOM) standard for
    retinal imaging.
  - >-
    Device-native formats were transformed to standard model formats before upload: Topcon .fda and
    Heidelberg FLIO .sdt image exports were converted to DICOM, and Garmin .FIT files were converted
    to the Open mHealth standard. Electrocardiography data follow the WaveForm DataBase (WFDB) standard,
    environmental sensor data follow the NASA ASCII File Format Guidelines for Earth Science Data,
    and continuous glucose monitoring data follow Open mHealth.
  - >-
    The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1 specification,
    with one directory per datatype at the root level, one folder per modality within each datatype,
    one folder per device within each modality, and one folder per participant within each device
    folder, named after the participant's study ID number. Each datatype directory carries a manifest.tsv
    metadata file.
  - >-
    For dissemination, the released data are de-identified: no protected health information is present,
    and information related to participant sex and race/ethnicity as well as medications used has
    been removed.
  - >-
    Data are uploaded at regular intervals to the AI-READI-specific data management platform FAIRhub,
    a Microsoft Azure cloud-based platform developed for the project, and are stored and shared as
    "AI-ready", which is intended to enable immediate AI/ML research without reformatting and preprocessing.
  - >-
    No instances were excluded from the dataset at the time of preprocessing. Exclusions apply only
    at the level of study eligibility.
cleaning_strategies:
- id: cleaning_quality_control_at_entry
  name: Quality control and data editing at entry
  cleaning_details:
  - >-
    Several quality control measures were used at the time of data entry and acquisition. For example,
    clinical data outside expected minimum/maximum ranges were flagged in REDCap, which was visible
    in reports viewed by clinical research coordinators and data managers.
  - >-
    Using the REDCap reports as guides, data managers and clinical research coordinators examined
    participant records and determined whether an error was likely. Data were checked for, and edited
    where errors were detected, on four criteria: credibility, based on range checks to determine
    whether all responses fall within a prespecified reasonable range; incorrect flow through prescribed
    skip patterns; missing data that can be directly filled from other portions of an individual's
    record; and the omission or duplication of records.
  - >-
    Editing was done only under the guidance and approval of the site principal investigator. If corrected
    data were available from elsewhere in the respondent's answers, the error was corrected; if there
    was no logical or appropriate way to correct the data, the site principal investigator reviewed
    the values and decided whether they should be removed from the data.
  - >-
    The data manager at each data site is responsible for the quality control of all data before uploading
    to FAIRhub. A dqd_omop.json metadata file distributed with the clinical_data directory supports
    OMOP CDM data quality analysis using the OMOP CDM Data Quality Dashboard, which runs more than
    3500 data quality checks against an OMOP CDM instance.
labeling_strategies:
- id: labeling_none_performed
  name: No labeling performed
  description: The dataset is hypothesis-agnostic and does not carry annotator-assigned labels.
  labeling_details:
  - No explicit label or target is associated with each data instance; no labels are provided.
  - >-
    No specific labeling was performed in the dataset, as the dataset is a hypothesis-agnostic dataset
    aimed at facilitating multiple potential downstream AI/ML applications.
  - >-
    Because no labeling was performed, there is no labeling software to share, no annotator cohort,
    no inter-annotator agreement and no human-level performance benchmark. The dataset creators state
    that they do not have formal guidelines in place for future researchers creating new labels or
    defining new tasks.
existing_uses:
- id: existing_use_none_reported
  name: Existing uses of the dataset
  description: >-
    The dataset creators answered "No" when asked whether the dataset has been used for any tasks
    already, as of the v3.0.0 release. The FAIRhub record for v3.0.0 reports 24,636 views and a citation
    count of zero.
use_repository:
- id: use_repository_none
  name: Repository of dataset uses
  description: >-
    The dataset creators state that there is no repository that links to any or all papers or systems
    that use the dataset, other than general indexes such as Google Scholar.
  repository_details:
  - >-
    Use of the dataset requires citation of the resources specified in the AI-READI documentation
    at https://docs.aireadi.org, which provides the mechanism by which uses can be traced.
other_tasks:
- id: other_tasks_downstream_ai_ml
  name: Other tasks the dataset could support
  task_details:
  - >-
    The dataset is hypothesis-agnostic and aimed at facilitating multiple potential downstream AI/ML
    applications rather than a single predefined task.
  - >-
    Named downstream directions include pseudotime manifold analysis to predict disease trajectories,
    reconstruction of a temporal atlas of T2DM development and reversal towards health, and investigation
    of underlying genetic links across different racial and ethnic cohorts (the latter using the controlled-access
    tier).
  - >-
    The project also positions the dataset and its accompanying blueprint as a resource for methodological
    work on making biomedical data AI-ready, including standards development and the evaluation of
    dataset documentation approaches such as datasheets and healthsheets.
future_use_impacts:
- id: future_use_impact_composition_and_reidentification
  name: Composition and collection factors affecting future uses
  impact_details:
  - >-
    The dataset creators state that, to the extent of their knowledge, they do not currently anticipate
    any uses of the dataset that could result in unfair treatment or harm, but that there is a theoretical
    risk of future re-identification.
  - >-
    Because sex, race and ethnicity are withheld from the public release, users cannot directly audit
    model performance across those groups using the public data alone; the project's mitigation is
    the recommended split, which balances the validation and test sets across those attributes.
  - >-
    Because enrollment is ongoing and this release is an interim snapshot, distributions across race/ethnicity,
    sex and diabetes severity in v3.0.0 do not yet reflect the study's target balance, and models
    trained on this version should not be assumed to have been trained on a balanced cohort.
  - >-
    Multi-device and multi-site acquisition means that device make and model may act as a confounder;
    device and protocol information is documented for each modality to support repeatability and should
    be accounted for in analysis.
discouraged_uses:
- id: discouraged_uses_license_restrictions
  name: Uses discouraged or restricted by the licence
  discouragement_details:
  - >-
    The AI-READI dataset licence imposes restrictions on use of the data; the restrictions are described
    in the licence files available at https://doi.org/10.5281/zenodo.17555036.
  - >-
    Under the licence terms, the licensee shall not make clinical treatment decisions based on the
    data, as it is intended solely as a research resource.
  - >-
    Under the licence terms, the licensee shall not use or attempt to use the data, alone or in concert
    with other information, to compromise or otherwise infringe the confidentiality of information
    on an individual data subject or their right to privacy, to identify or contact any individual
    data subject or group of data subjects, to extract or extrapolate identifying information about
    a data subject, to establish a data subject's membership in a particular group of persons, or
    otherwise to cause harm or injury to any data subject.
  - >-
    Access to the public version of the dataset is conditioned on agreeing to use the data only for
    type 2 diabetes related research; more generic use requires the private (controlled-access) version.
intended_uses:
- id: intended_use_ai_ml_t2dm_research
  name: Intended uses
  use_category:
  - Artificial intelligence and machine learning research
  - Type 2 diabetes mellitus research
  - Methodological research on AI-ready dataset creation
  examples:
  - >-
    Development of AI/ML models to define disease trajectories in type 2 diabetes and to study salutogenesis,
    the pathway from disease back to health.
  - >-
    Downstream pseudotime manifold analysis across participants with differing disease severity, from
    normal to insulin-dependent T2DM.
  - >-
    Multimodal model development combining retinal imaging, physiological signals, wearable and environmental
    data with clinical and survey variables.
  - >-
    Use of the dataset and its accompanying blueprint as a model for future efforts to develop other
    medical and health datasets targeted for AI/ML.
  usage_notes: >-
    The dataset is intended solely as a research resource. Use of the dataset requires citation of
    the resources specified in the AI-READI documentation, and those who download and use AI-READI
    data are encouraged to publish their results in the scientific literature. Licensees agree to
    acknowledge the source and any funder of the data in any publications reporting use of the data.
prohibited_uses:
- id: prohibited_uses_license_clauses
  name: Uses prohibited by the data licence
  description: >-
    Uses that the AI-READI data licence explicitly does not permit. The licence text captured in the
    source bundle is version 1.0 (University of Washington as Licensor, deposited at https://doi.org/10.5281/zenodo.10642459);
    the v3.0.0 release cites AI-READI custom licence v2.0 at https://doi.org/10.5281/zenodo.17555036.
  prohibition_reason:
  - >-
    Clause 2 (Data sharing; models): the licensee shall not transfer, license, sublicense, sell, assign,
    display, share or otherwise convey any portion of the data or any derivative work to any third
    party other than another licensee bound by an identical agreement with the licensor.
  - >-
    Clause 3 (Additional use restrictions): the licensee shall not make clinical treatment decisions
    based on the data.
  - >-
    Clause 3 (Additional use restrictions): the licensee shall not use or attempt to use the data
    to compromise or infringe the confidentiality or privacy of any data subject, to identify or contact
    any data subject or group of data subjects, to extract or extrapolate identifying information,
    to establish a data subject's membership in a particular group, or otherwise to cause harm or
    injury to any data subject.
  - >-
    Clause 5 (Termination): the agreement terminates automatically upon any breach, after which the
    licensee must delete all copies of the data in its possession and control and cease all use of
    the data.
distribution_formats:
- id: distribution_format_fairhub_portal
  name: FAIRhub data portal
  description: >-
    The dataset is available through the FAIRhub platform, an Azure-based data management, curation
    and sharing platform developed for the AI-READI project. Accessing the dataset requires logging
    in through a verified ID system, agreeing to use the data only for type 2 diabetes related research,
    and agreeing to the licence terms. The v3.0.0 documentation also describes Azure Storage access
    as an access route.
  access_urls:
  - https://fairhub.io/datasets/3
  - https://fairhub.io/
  - https://doi.org/10.60775/fairhub.3
- id: distribution_format_file_formats
  name: Distributed file formats
  description: >-
    The FAIRhub dataset description lists the distributed media types as application/dicom, text/markdown,
    text/csv and application/json. In practice the release also contains TSV manifest and participants
    files and WFDB-format waveform records. The dataset creators state that all data files are in
    formats accessible with free software commonly used for such data types, so no specific software
    is required.
distribution_dates:
- id: distribution_dates_versions
  name: Release dates
  release_dates:
  - '2024-05-03: version 1.0.0 (DOI 10.60775/fairhub.1), the pilot data release'
  - '2024-11-08: version 2.0.0 (DOI 10.60775/fairhub.2), covering data through 31 July 2024'
  - '2025-11-17: version 3.0.0 (DOI 10.60775/fairhub.3), covering data through 1 May 2025'
maintainers:
- id: maintainer_ai_readi_team
  name: AI-READI team
  role: academic_institution
  description: The party responsible for supporting, hosting and maintaining the dataset.
  maintainer_details:
  - >-
    The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub through
    Microsoft Azure. FAIRhub is described as being in beta.
  - >-
    Contact information is provided in the README file included with the dataset; the project directs
    questions, suggestions and feedback to https://aireadi.org/contact, and the FAIRhub study record
    lists contact@aireadi.org as the central contact address (Aaron Lee, MD). The study_description.json
    and dataset_description.json metadata files included with the dataset carry additional information
    about the contact person or entity, authors and contributors.
  - >-
    Note on an unresolved discrepancy in the sources: the FAIRhub v3.0.0 structured metadata names
    "Washington University in St. Louis" (ROR https://ror.org/01yc7t268) as the dataset's managing
    organization, as the study's lead sponsor, and as the affiliation of the responsible-party principal
    investigator and central contact. The NIH RePORTER record for award OT2OD032644, the AI-READI
    data licence (in which the "University of Washington" is the Licensor), the IRB approval, and
    both project publications instead place the lead at the University of Washington (ROR https://ror.org/00cvxb145),
    which the same FAIRhub record also lists as a Seattle study location. This datasheet records the
    University of Washington as the lead institution on the weight of those sources.
updates:
  id: update_plan_aireadi
  name: Update and versioning plan
  description: How the dataset is updated over time.
  frequency: >-
    Approximately once a year. Released versions are not updated in place; new static versions are
    issued instead.
  update_details:
  - >-
    The dataset will not be updated. Rather, new versions of the dataset will be released with additional
    instances as more study participants complete the study visit.
  - >-
    The dataset is released as static versions. Version 3.0.0 is the third version and consists of
    data collected up through the end of the second year of the study, between July 19, 2023 and May
    1, 2025. There are plans to release new versions approximately once a year with additional data
    from participants enrolled since the last version release.
  - >-
    Enrollment is ongoing, and future versions of the dataset will be released with larger numbers
    of subjects as enrollment increases.
  - >-
    Changes between the current version of the dataset and the previous one are documented in the
    CHANGELOG.md file included in the dataset and visible at docs.aireadi.org. Summary of major changes
    across versions: v1.0.0 pilot, 204 participants, 15 or more data types, custom or ad hoc processing,
    released 2024-05-03; year 2 data added 863 participants and one additional imaging device, included
    in v2.0.0; year 3 data added 1213 participants and three additional imaging devices, included
    in v3.0.0; v3.0.0 main study totals 2280 participants with 15 or more data types and automated
    plus custom processing, released 2025-11-17.
retention_limit:
  id: retention_limit_aireadi
  name: Data retention limits
  description: Limits on how long participant data is retained.
  retention_period: No limit
  retention_details:
  - >-
    The dataset creators state that there are no limits on the retention of the data associated with
    the instances.
  - >-
    The raw data is expected to be preserved by the AI-READI project at least for the duration of
    the project.
version_access:
  id: version_access_aireadi
  name: Version availability
  description: Availability of current and prior versions of the dataset.
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
  - Version 3.0.0, DOI 10.60775/fairhub.3, made available 2025-11-17 (current)
  - Version 2.0.0, DOI 10.60775/fairhub.2, made available 2024-11-08
  - Version 1.0.0, DOI 10.60775/fairhub.1, made available 2024-05-03
  version_details:
  - >-
    In answer to whether older versions continue to be supported, the dataset creators state that
    the question is not applicable because the dataset is not updated in place; instead new versions
    are released with additional instances.
  - >-
    In practice, the FAIRhub landing page for version 2.0.0 states "This version of the dataset is
    no longer accessible. Please refer to the latest version." Version-specific documentation is preserved
    for each dataset version at docs.aireadi.org, with a version selector covering v1.0.0, v2.0.0
    and v3.0.0; the v2.0.0 documentation page carries a banner stating that v2.0.0 is no longer accessible.
  - >-
    Version 2.0.0 comprised 2.01 TB across 165,051 files. Version 3.0.0 comprises 3.82 TB across 356,343
    files.
  - >-
    Previous datasheets exist for earlier versions: a healthsheet for version 1.0.0 at https://docs.aireadi.org/docs/1/dataset/healthsheet
    and one for version 2.0.0 at https://docs.aireadi.org/docs/2/dataset/healthsheet.
  - >-
    A separate smaller version of the dataset (recorded in the FAIRhub API as child record 4) is available
    for pipeline development; it is a distinct FAIRhub record rather than a version of this dataset.
extension_mechanism:
  id: extension_mechanism_aireadi
  name: Mechanism for external contributions
  description: Whether third parties can extend, augment or contribute to the dataset.
  extension_details:
  - >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.
  - >-
    Biobanked biospecimens held at the University of Alabama at Birmingham will eventually be available
    to scientists according to procedures and policies that were in development at the time of the
    source documents; the project stated that procedures for reviewing and prioritising written requests
    would be developed before the biorepository is complete.
ethical_reviews:
- id: ethical_review_uw_irb
  name: University of Washington Institutional Review Board review
  description: >-
    Institutional Review Board review and approval for the AI-READI study under which the dataset
    was collected.
  contact_person: https://orcid.org/0000-0002-7452-1648
  reviewing_organization: https://ror.org/00cvxb145
  review_details:
  - >-
    AI-READI was approved by the Institutional Review Board of the University of Washington under
    approval number STUDY00016228, including reliance agreements with the IRBs of the University of
    Alabama at Birmingham and the University of California, San Diego.
  - >-
    The initial IRB approval at the University of Washington was received on December 20, 2022. The
    initial approval letter is published with the dataset documentation. An annual renewal application
    to the IRB about the status and progress of the study is required and is due within 90 days of
    expiration.
  - >-
    The FAIRhub study record reports human subject review status "Submitted, approved", no FDA regulated
    drug or device, and no data monitoring committee. The study is registered on ClinicalTrials.gov
    as NCT06002048.
  - >-
    The UCSD site operates under additional local requirements: the State of California requires inclusion
    of the Bill of Rights in the informed consent form, and UCSD's Health Data Oversight Committee
    oversees data sharing with other institutions.
  - >-
    The risk assessment in the IRB protocol classifies the study at risk Level 3 and rates the individual
    risks as low: confidentiality breach, dilating eye drops, eye imaging, COVID-19 exposure, emotional
    stress, fatigue, blood draw, continuous glucose monitor wear and fitness tracker wear. There is
    no known risk associated with the home environmental sensor.
data_protection_impacts:
- id: data_protection_impact_not_conducted
  name: Data protection impact analysis
  impact_details:
  - The dataset creators state that a data protection impact analysis has not been conducted.
human_subject_research:
  id: human_subject_research_aireadi
  name: Human subjects research status
  description: >-
    The dataset derives entirely from prospective human subjects research conducted under an approved
    IRB protocol.
  involves_human_subjects: true
  irb_approval:
  - >-
    University of Washington IRB approval number STUDY00016228; initial approval received December
    20, 2022, with annual renewal required within 90 days of expiration.
  - >-
    Reliance agreements with the IRBs of the University of Alabama at Birmingham and the University
    of California, San Diego.
  ethics_review_board:
  - University of Washington Institutional Review Board (Human Subjects Division)
  special_populations:
  - >-
    No protected population is purposefully included. Eligibility requires adults aged 40 years or
    older who are able to provide consent and able to read and speak English; participants older than
    85 years, pregnant participants, participants with gestational diabetes and participants with
    type 1 diabetes are excluded. No minors are enrolled.
  - >-
    The project engaged with the Native Biodata Consortium and planned a tribal consultation to address
    barriers and facilitators of participation, with the goal of collecting similar data within a
    Native American cohort in an ethical and respectful manner, including evaluation of data usage
    agreements, contract negotiations, transparent access agreements and forms of assured return of
    benefit and sustainable input, control and monitoring of Tribal data. That cohort is not part
    of this dataset.
  regulatory_compliance:
  - >-
    The public dataset is stripped of Protected Health Information as defined by the HIPAA Privacy
    Rule via the Safe Harbor method, as well as information related to participant sex and race/ethnicity
    to prevent stigmatization of findings.
  - >-
    Licensees must comply with all data security and privacy standards established by the US National
    Institutes of Health under its Genomic Data Sharing (GDS) Policy, per clause 4 of the AI-READI
    data license.
  - >-
    Study registered on ClinicalTrials.gov as NCT06002048; the protocol publication additionally cites
    approval number STUDY00016228.
informed_consent:
- id: informed_consent_aireadi
  name: Informed consent procedures
  consent_obtained: true
  consent_type:
  - Written informed consent
  - Electronic consent (e-consent) administered through REDCap
  - In-person consent obtained in a private room by a study team member
  consent_documentation:
  - >-
    The approved consent form for the principal project site, the University of Washington, is published
    with the v3.0.0 dataset documentation. The other clinical sites had IRB reliance and used the
    same consent form with minor institution-specific language.
  - >-
    Signed electronic consent forms are automatically emailed to subjects, who may request additional
    copies from the study coordinator at any time during the study.
  - >-
    The FAIRhub dataset description records the consent type as "ConsentSpecifiedNotElsewhereCategorised",
    with no non-commercial restriction, no geographic restriction, no research-type restriction, no
    genetic-only restriction and no methods-development restriction recorded at that level.
  withdrawal_mechanism:
  - >-
    Participants were permitted to withdraw consent at any time and cease study participation; any
    data already shared or used up to that point remains in the dataset. This is clearly communicated
    in the consent document.
  consent_scope:
  - >-
    Consent covers the study procedures, banking of biospecimens at the University of Alabama at Birmingham
    for future research, and placement of data in an open-source repository for secondary use, including
    future research studies and future AI/ML algorithm development.
  - >-
    The FAIRhub consent details state that the public version of the dataset can only be used for
    type 2 diabetes related research, while a private version will allow for more generic use.
  - >-
    Two distribution databases were described in the IRB protocol: a de-identified database that is
    publicly available, and a second containing identifiable or sensitive information (genomic data
    and race/ethnicity) requiring a data use agreement and an approval process developed by the project
    committee.
at_risk_populations:
  id: at_risk_populations_aireadi
  name: At-risk population protections
  description: Protections relevant to potentially vulnerable participants in the AI-READI study.
  at_risk_groups_included: false
  special_protections:
  - >-
    A Community Advisory Board of 11 persons from the three sites, including diversity in race and
    ethnicity as represented in the AI-READI sample, contributes to protocol development and evaluates
    consent forms and research protocols, with feedback incorporated into IRB modifications as needed.
  - >-
    Transportation assistance, including rideshare services, was offered to study participants who
    endorsed barriers to transporting themselves to study visits, and the study covers reasonable
    parking, public transit or rideshare costs related to the study visit.
  - >-
    The home environmental sensor and the fitness tracker were selected with participant privacy as
    a primary concern: they capture no video or audio, have no GPS location monitoring, and are not
    synced with participant-owned devices.
  - >-
    For subjects who have difficulty viewing the consent document, a study team member reads the consent
    form to them; for a functionally illiterate person, a study team member signs and notes the reason
    for the missing subject signature in the presence of an impartial witness.
  - >-
    Where recruitment occurs by referral, consenting is performed by a research staff member who has
    no pre-existing relationship with the potential participant.
  - >-
    Native Spanish speaking research staff at UCSD can provide interpretation and instructions, and
    Spanish translation of the consent form was planned if Hispanic recruitment goals were not met.
    At the time of the protocol, non-English-speaking participants were not initially enrolled because
    full translation of all study materials was not yet possible.
  assent_procedures:
  - >-
    Not applicable. The study enrolls only adults aged 40 years and older and does not include minors.
  guardian_consent:
  - >-
    Not applicable. No minors or legally authorized representatives are involved; all participants
    must be able to provide consent themselves.
license_and_use_terms:
  id: license_and_use_terms_aireadi
  name: AI-READI custom data licence
  description: >-
    The dataset is distributed under a custom licence developed by the project, specifically tailored
    to enable reuse of the AI-READI dataset (and other clinical datasets) for commercial or research
    purposes while imposing strong requirements around data usage, security and secondary sharing
    to protect study participants, especially when data is reused for AI and ML applications.
  data_use_permission:
  - disease_specific_research
  license_terms:
  - >-
    The v3.0.0 FAIRhub record names the licence "AI-READI custom license v2.0" with rights URI https://doi.org/10.5281/zenodo.17555036,
    and the FAIRhub landing page labels it "Health Data License".
  - >-
    Access type is recorded as "PublicDownloadSelfAttestationRequired". Accessing the dataset requires
    logging in through a verified ID system, agreeing to use the data only for type 2 diabetes related
    research, and agreeing to the licence terms.
  - >-
    The licence text included in the source bundle is AI-READI Data License Agreement v1.0, with the
    University of Washington as Licensor, deposited at https://doi.org/10.5281/zenodo.10642459 and
    applying to earlier releases. Its principal terms are summarised in the following items.
  - >-
    Clause 1 (Licence grant): a non-exclusive and non-transferable licence to download, reproduce
    and use the data and to create derivative works thereof, for research and commercial purposes.
    All full and partial copies made by the licensee are subject to the agreement.
  - >-
    Clause 2 (Data sharing; models): no transfer, licence, sublicence, sale, assignment, display,
    sharing or other conveyance of the data or derivative works to third parties other than other
    licensees bound by identical terms, in which case access may be given for collaboration on projects
    involving the data. Licensees may make, reproduce and distribute models, algorithms and programs
    developed, trained or adapted using the data but which do not themselves contain the data or a
    modified version of it, provided that before dissemination they undertake all reasonable efforts
    to minimise the likelihood that data can be memorized, derived, reconstructed or reconstituted
    through the use or construction of such models.
  - >-
    Clause 3 (Additional use restrictions): no clinical treatment decisions based on the data; no
    attempts at re-identification or contact of data subjects; licensees agree to acknowledge the
    source and any funder of the data in any publications reporting use of the data, with the current
    citation available at docs.aireadi.org.
  - >-
    Clause 4 (Security): compliance with all data security and privacy standards established by the
    US National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH Security
    Best Practices for Controlled-Access Data Subject to the NIH GDS Policy.
  - >-
    Clause 5 (Termination): automatic termination upon any breach, with deletion of all copies and
    cessation of all use.
  - >-
    Clause 6 (Proprietary rights): title to the data and all industrial and intellectual property
    rights therein remain solely and exclusively with the Licensor and its suppliers; rights not expressly
    granted are reserved.
  - >-
    Clauses 7 to 10: the data is provided on an "as is" basis without warranty of any kind; liability
    is limited, with the Licensor's entire liability capped in the aggregate at one US dollar except
    for death or personal injury caused by Licensor negligence where applicable law prohibits limitation;
    the licensee indemnifies the Licensor and its suppliers; and the licensee agrees to comply with
    all applicable laws, regulations and restrictions relating to the distribution and use of the
    data and models.
ip_restrictions:
  id: ip_restrictions_aireadi
  name: Third-party intellectual property restrictions
  description: >-
    Restrictions imposed on the data by third parties or by the intellectual property terms of the
    licence.
  restrictions:
  - >-
    The dataset creators answer the question of third-party IP restrictions by referring to the licence
    at https://doi.org/10.5281/zenodo.17555036.
  - >-
    Under clause 6 of the AI-READI data licence, title to the data and all industrial and intellectual
    property rights therein remain solely and exclusively with the Licensor (the University of Washington)
    and its suppliers, and the licensee shall not take any action inconsistent with such ownership.
    Any rights not expressly granted are reserved to the Licensor and its suppliers.
  - >-
    The IRB protocol states that there are no plans for the researchers involved in collecting the
    dataset to develop commercial products or file for patents, but that the dataset will be publicly
    available with a commercial-friendly licence and products or patents may be developed from it
    by others in future.
  - >-
    Several device manufacturers loaned devices to the study at no cost or provided research discounts
    (Topcon, Optomed, iCare World, Carl Zeiss, Heidelberg Engineering, Dexcom, Garmin), but no IP
    restriction arising from those arrangements is described in the sources.
regulatory_restrictions:
  id: regulatory_restrictions_aireadi
  name: Export control and regulatory restrictions
  description: Regulatory and compliance conditions attaching to the dataset.
  regulatory_restrictions:
  - >-
    The dataset creators answer the question of export controls and other regulatory restrictions
    by referring to the licence at https://doi.org/10.5281/zenodo.17555036. No specific export control
    regime is named in the sources.
  - >-
    Licensees must comply with all applicable laws, regulations and restrictions relating to the distribution
    and use of the data and of models derived from it.
  hipaa_compliant: compliant
  other_compliance:
  - >-
    HIPAA Privacy Rule: the publicly accessible set is stripped of Protected Health Information via
    the Safe Harbor method. The FAIRhub de-identification record states that no identifiers were collected,
    so no active de-identification was necessary, but that the team checked that no identifiable data
    per US HIPAA were present in the data.
  - >-
    NIH Genomic Data Sharing Policy: licensees must comply with the NIH Security Best Practices for
    Controlled-Access Data Subject to the NIH GDS Policy.
  - >-
    Human subjects research oversight: University of Washington IRB STUDY00016228 with reliance agreements
    at UAB and UCSD; ClinicalTrials.gov registration NCT06002048. The FAIRhub study record reports
    the study is not FDA-regulated for drugs or devices and has no data monitoring committee.
  confidentiality_level: restricted
is_deidentified:
  id: deidentification_aireadi
  name: De-identification status
  description: Whether individuals can be identified in the dataset, directly or indirectly.
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor. The publicly accessible set is stripped of Protected Health Information as
    defined by the HIPAA Privacy Rule via the Safe Harbor method, together with additional removal
    of sex and race/ethnicity information to prevent stigmatization of findings.
  identifiers_removed:
  - Protected Health Information as defined by the HIPAA Privacy Rule (Safe Harbor method)
  - Participant sex
  - Participant race and ethnicity
  - Medications used
  deidentification_details:
  - >-
    The FAIRhub de-identification record for v3.0.0 states: "No identifiers were collected so no active
    de-identification was necessary but we checked that no identifiable data per US HIPAA were present
    in the data." The record sets the de-identification type to "NoDeIdentification" with direct identifiers
    and HIPAA identifiers flagged as addressed and date shifting, non-arrayed identifier suppression
    and k-anonymity not applied.
  - >-
    The healthsheet question about measures taken to avoid re-identification after de-identification
    was left unanswered by the dataset creators, as was the question about pre-processing for de-identification.
  - >-
    The dataset has not undergone any formal external audits. It has been reviewed internally by AI-READI
    team members for quality checks and to ensure that no personally identifiable information was
    accidentally included.
  - >-
    Sensitive and potentially identifying elements are held in a separate controlled-access tier:
    5-digit ZIP code, sex, race, ethnicity, genetic sequencing data, past health records, medications,
    and traffic and accident reports.
external_resources:
- id: external_resource_documentation
  name: AI-READI dataset documentation and project resources
  description: >-
    The dataset is described by its creators as self-contained, but users requiring additional information
    about dataset provenance are directed to the AI-READI dataset documentation site. The documentation
    is shared under the CC-BY 4.0 license, so no restrictions apply to its use.
  external_resources:
  - >-
    AI-READI dataset documentation: https://docs.aireadi.org (version-specific documentation at https://docs.aireadi.org/docs/3/about)
  - 'AI-READI project website: https://aireadi.org'
  - 'AI-READI Zenodo community: https://zenodo.org/communities/aireadi'
  - 'AI-READI GitHub organization: https://github.com/AI-READI'
  - 'Clinical Dataset Structure (CDS) specification: https://cds-specification.readthedocs.io'
  future_guarantees:
  - >-
    No explicit persistence guarantee is stated for the external documentation. The FAIRhub landing
    pages for both the v2.0.0 and v3.0.0 records carry the notice "This repository is under review
    for potential modification in compliance with Administration directives."
  archival: false
  restrictions:
  - >-
    None for the documentation, which is shared under CC-BY 4.0. Access to the dataset itself is governed
    by the AI-READI custom license.
