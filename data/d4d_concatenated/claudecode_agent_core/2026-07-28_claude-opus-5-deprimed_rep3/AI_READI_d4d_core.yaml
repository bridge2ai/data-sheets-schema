id: https://doi.org/10.60775/fairhub.3
name: AI-READI Flagship Dataset of Type 2 Diabetes (v3.0.0)
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship dataset generated by the Artificial Intelligence Ready and Equitable
  (also rendered "Exploratory") Atlas for Diabetes Insights (AI-READI) project, one of four data generation
  projects funded by the NIH Common Fund Bridge2AI program. The dataset contains multimodal data from
  2280 participants with and without type 2 diabetes mellitus (T2DM), collected between July 19, 2023
  and May 1, 2025 at three US sites (University of Alabama at Birmingham, University of California
  San Diego, and University of Washington) and harmonized across sites. Modalities include survey
  and clinical data collected through REDCap and mapped to the OMOP Common Data Model, 12-lead electrocardiography,
  retinal photography, optical coherence tomography (OCT), OCT angiography (OCTA), fluorescence lifetime
  imaging ophthalmoscopy (FLIO), continuous glucose monitoring, wearable activity monitoring, and
  custom-built home environmental sensor data. The release comprises 356,343 files totalling approximately
  3.82 TB, organized following the Clinical Dataset Structure (CDS) v0.1.1 specification. The released
  data contain no protected health information; information on participant sex, race/ethnicity, and
  medications used has also been removed and is held in a controlled-access tier. The dataset was
  designed to be "AI-ready" and hypothesis-agnostic, with recruitment sampling aimed at approximately
  equal distribution of participants across diabetes severity, in order to support artificial intelligence
  and machine learning research into salutogenesis, the pathway from T2DM back toward health.
