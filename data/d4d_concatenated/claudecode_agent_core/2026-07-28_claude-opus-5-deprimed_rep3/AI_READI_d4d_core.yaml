purposes:
- id: purpose_ai_ready_t2dm_dataset
  name: Enable AI/ML research into type 2 diabetes salutogenesis
  description: The stated purpose for which the dataset was created.
  response: >-
    The purpose for creating the dataset was to enable future generations of artificial intelligence
    and machine learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus
    (T2DM), including salutogenic pathways to return to health. T2DM is a growing public health threat,
    affecting a high proportion of the world's adult population, yet the current understanding of
    T2DM, especially in the context of salutogenesis, is limited. Given the complexity of T2DM, AI-based
    approaches may improve understanding, but a key issue is the lack of data ready for training AI
    models. The AI-READI dataset is intended to fill that gap. AI-READI is one of four Bridge2AI data
    generation projects funded by the NIH Common Fund that aim to generate flagship biomedical and
    behavioural data sets that are ethically sourced, trustworthy, well-defined and publicly available.
- id: purpose_blueprint_for_ai_ready_datasets
  name: Establish a blueprint for creating AI-ready clinical datasets
  description: A second stated purpose of the project that produced the dataset.
  response: >-
    An additional aim of the AI-READI project is to establish and share standards, best practices
    and guidelines for the collection, preparation and sharing of data for AI/ML, including guidance
    from bioethicists, so that future data generation projects can follow them. Following FAIR (Findable,
    Accessible, Interoperable, Reusable) principles, AI-READI is presented by its creators as a model
    for future efforts to develop other medical and health data sets targeted for AI/ML. The project
    developed the Clinical Dataset Structure (CDS) specification and the FAIRhub data management,
    curation and sharing platform as part of this effort.
tasks:
- id: task_pseudotime_manifold_analysis
  name: Downstream pseudotime manifold analysis
  description: The specific analytic task the data collection design was tailored to support.
  response: >-
    Data collection was specifically designed to permit downstream pseudotime manifold analysis, an
    approach used to predict disease trajectories by collecting and learning from complex, multimodal
    data from participants with differing disease severity (normal to insulin-dependent T2DM). The
    approach relies on dimensionality reduction, is agnostic to existing classification criteria or
    biases, and is intended to be used to reconstruct a temporal atlas of T2DM development and reversal
    towards health.
- id: task_hypothesis_agnostic_ai_ml
  name: General-purpose AI/ML model development
  description: The broader class of tasks the dataset is meant to address.
  response: >-
    The multimodal dataset is being gathered to facilitate downstream pseudotime manifolds and various
    applications in artificial intelligence. The dataset is deliberately hypothesis-agnostic: the
    protocol was designed by a multidisciplinary team to be agnostic to hypotheses, assembling assessments
    from many health domains likely impacted by T2DM rather than targeting a single predefined prediction
    task. No predefined labels or tasks are supplied with the data.
addressing_gaps:
- id: addressing_gap_ai_ready_diverse_data
  name: Absence of large, diverse, balanced, AI-ready multimodal T2DM data
  description: The gap the dataset was created to fill.
  response: >-
    The ability to understand and affect the course of complex, multi-organ diseases such as T2DM
    has been limited by a lack of well-designed, high quality, large and inclusive multimodal datasets.
    A major barrier to AI in this area has been the lack of diverse datasets that are AI ready for
    training AI models. A meta-epidemiological review of T2DM studies published from 2000 to 2020
    indicated that samples lacked racial and ethnic diversity. AI-READI addresses this by recruiting
    a cohort triple-balanced by self-reported race/ethnicity, T2DM presence and severity, and biological
    sex, across three geographically distinct US sites, and by sharing the data in standardized, "AI-ready"
    form that enables AI/ML research without further reformatting and preprocessing.
