  description:
    receipts:
    - chunk: c007
      snippet: is a large, ethically sourced, and demographically diverse voice dataset
        linked to health information, released by the NIH’s Bridge2AI initiative
    - chunk: c009
      snippet: In which countries was the data collected?...USA and Canada
    - chunk: c018
      snippet: Bridge2AI-Voice v3.1 contains data for 833 participants across five
        sites in North America.
    - chunk: c018
      snippet: The release contains data considered low risk, including derivations
        such as spectrograms but not the original voice recordings. Detailed demographic,
        clinical, and validated questionnaire data are also made available.
    - chunk: c019
      snippet: Adds files related to audio quality metrics and releases per audio
        metadata. Updated validated diagnosis information across conditions with back-filled
        information.
    core_path: description
