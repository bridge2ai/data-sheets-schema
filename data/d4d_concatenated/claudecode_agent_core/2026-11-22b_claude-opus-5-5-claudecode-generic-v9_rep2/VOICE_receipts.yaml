bundle_md5: 9193c3cbe60b62a2fc0f704a2c4d23a3
slots:
  acquisition_methods[0]:
    receipts:
    - chunk: c009
      snippet: The data was directly observable and reported by subjects. Clinical
        diagnoses were verified by clinicians reviewing audio and/or imaging data,
        looking at electronic health records, or medication prescriptions.
    core_path: acquisition_methods[0]
  addressing_gaps[0]:
    receipts:
    - chunk: c002
      snippet: comparing studies and pooling data is challenging due to a lack of
        existing standards in how voice and other acoustics are measured and collected
    core_path: addressing_gaps[0]
  addressing_gaps[1]:
    receipts:
    - chunk: c005
      snippet: compounded by the limited size, quality, and diversity of existing
        open-source datasets
    core_path: addressing_gaps[1]
  addressing_gaps[2]:
    receipts:
    - chunk: c008
      snippet: was created to address a gap in the availability of large-scale, diverse,
        and well-documented voice data for use in clinical machine-learning applications
    core_path: addressing_gaps[2]
  anomalies[0]:
    receipts:
    - chunk: c008
      snippet: different sites have different collection configurations. The collection
        protocol changed over the course of the study.
    core_path: anomalies[0]
  anomalies[1]:
    receipts:
    - chunk: c019
      snippet: Spectrograms, Mel Spectrograms, MFC coefficients, PPGs, and EMAs for
        sensitive records and audio checks have been removed from v3.1. Additionally,
        some files, whether due to length or other issues, could not generate certain
        features and so are not included in the bundled data.
    core_path: anomalies[1]
  citation:
    receipts:
    - chunk: c018
      snippet: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked
        to health information (version 3.1.0).'
    core_path: citation
  cleaning_strategies[0]:
    receipts:
    - chunk: c009
      snippet: Generate missingness tables
    core_path: cleaning_strategies[0]
  cleaning_strategies[0].cleaning_details:
    receipts:
    - chunk: c009
      snippet: Check distributions and outliers
    - chunk: c009
      snippet: For categorical responses, check against schema
    - chunk: c009
      snippet: For audio tasks, run quality control metrics
    core_path: cleaning_strategies[0].cleaning_details
  collection_mechanisms[0]:
    receipts:
    - chunk: c007
      snippet: Voice samples are collected prospectively using a custom software application
        (the Bridge2AI-Voice App) with the Bridge2AI-Voice protocols.
    core_path: collection_mechanisms[0]
  collection_mechanisms[0].description:
    receipts:
    - chunk: c011
      snippet: "Study Design\tProspective Cohort Study"
    core_path: collection_mechanisms[0].description
  collection_mechanisms[0].mechanism_details:
    receipts:
    - chunk: c007
      snippet: A total of 22 acoustic tasks are recorded through the app
    - chunk: c018
      snippet: This protocol involved the collection of demographic information, health
        questionnaires, targeted questionnaires inquiring about known confounders
        for voice, disease specific information, and voice recording tasks such as
        sustained phonation of a vowel sound.
    core_path: collection_mechanisms[0].mechanism_details
  collection_mechanisms[0].notes:
    receipts:
    - chunk: c007
      snippet: Future data collection will also occur remotely; however, remote data
        collection did not occur for the initial dataset release.
    core_path: collection_mechanisms[0].notes
  collection_mechanisms[1]:
    receipts:
    - chunk: c008
      snippet: Data is collected on iPads (9th or 10th generation), iPad Air (5th
        generation) using an Avid AE-36 microphone and an Apple dongle to connect
        it to the iPad.
    core_path: collection_mechanisms[1]
  collection_mechanisms[1].mechanism_details:
    receipts:
    - chunk: c018
      snippet: Data collection was conducted using a custom application on a tablet
        with a headset used for data collection when possible.
    core_path: collection_mechanisms[1].mechanism_details
  collection_notifications[0]:
    receipts:
    - chunk: c009
      snippet: Yes, participants went through an IRB-approved consent process.
    core_path: collection_notifications[0]
  consent_revocations[0]:
    receipts:
    - chunk: c009
      snippet: Consenting participants are informed that they may withdraw from the
        study at any point. If a participant chooses to withdraw during or before
        the voice data collection, their data will not be included in the database.
    core_path: consent_revocations[0]
  consent_revocations[0].revocation_details:
    receipts:
    - chunk: c009
      snippet: Participants are informed that research data (including voice recordings)
        cannot be removed from the database once the voice data collection process
        is completed.
    core_path: consent_revocations[0].revocation_details
  content_warnings[0]:
    receipts:
    - chunk: c008
      snippet: This dataset includes the transcription of free speech tasks. While
        the inclusion of information of that type is unlikely, it cannot be completely
        avoided
    core_path: content_warnings[0]
