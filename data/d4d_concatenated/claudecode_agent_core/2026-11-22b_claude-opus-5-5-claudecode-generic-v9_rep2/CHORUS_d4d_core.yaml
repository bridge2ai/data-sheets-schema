id: https://chorus4ai.org/
name: CHoRUS
description: The CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards)
  dataset is a multicenter, multimodal, high-resolution clinical care dataset produced by
  the CHoRUS project, which the project website describes as one data generation project of
  four in the NIH-funded Bridge2AI consortium, "creating a patient-focused collaborative hospital
  repository uniting standards for clinical care AI" under the heading "Expanding Artificial
  Intelligence and Machine Learning to Improve Recovery from Acute Illness". The project website
  reports the current released dataset as 50,000 patient admissions from ICU, PICU, and NICU,
  1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform
  data; it lists the anticipated final dataset as 100,000 patient admissions, 9 different
  data modalities, and 14 data contributing hospitals, with 60+ CHoRUS consortium members
  across 20 different institutions. The data-type table of the AIM-AHEAD Bridge2AI for Clinical
  Care webinar (September 2025) lists demographics, medication administration (dosing time-stamped
  upon each infusion change or dose administration), procedures and diagnoses (documentation
  by providers), nursing flowsheets (high-frequency documentation), clinical notes, imaging,
  waveform telemetry, and waveform EEG; the same webinar states that imaging de-identification
  was in process for a larger cohort and that EEG extraction was in process. The NIH grant
  abstract states the project's plan to develop capabilities to acquire, standardize, tokenize,
  store, visualize, and label data such as structured electronic health record data, tokenized
  unstructured electronic health record data, telemetry and EEG waveforms, imaging, and social
  determinants of health, to ensure that data elements feature appropriate contextual factors
  such as geographic distance to the nearest hospital, and to develop the necessary network,
  tools, standards, data, and education to build machine-learning (ML) and artificial intelligence
  (AI)-derived models.
notes: 'Website contact: Ciera McCrary, MGH, Program Manager (cmccrary@mgh.havard.edu, as
  written on the project website).'
source_caveats: The project website carries the banner "This repoitory is under review for
  potential modification in compliance with Administration directives." The CHoRUS GitHub
  organization overview (historical documentation, captured 2025-11-14) states "This project
  is licensed under the MIT License"; its subject is the GitHub project, and no source states
  a license for the dataset, so no dataset license is recorded. The webinar's "currently 1000
  images available" and the website's "7,642 admissions with radiology data" count different
  units (images and admissions) and are not compared. The webinar's data-type table was extracted
  from slides; its metadata and published-metadata-schema columns could not be assigned to
  rows reliably and are not recorded. The contact email domain "mgh.havard.edu" is reproduced
  as the website states it. The grant abstract (NIH RePORTER) describes plans at award time
  (fiscal year 2022); those plans are recorded as plans.
