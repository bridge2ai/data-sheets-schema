purposes:
- name: Publicly available, AI-ready critical care dataset
  description: 'Stated in the NIH grant abstract as a goal: "The project’s overarching goal
    is to develop a publicly available, AI-ready critical care dataset, while ensuring the
    methods promote privacy, accountability, and clinical benefit, while promoting a new generation
    of AI clinicians and scientists."'
- name: Diverse, high-resolution, ethically sourced AI-ready data set
  description: 'Stated in the CHoRUS GitHub organization overview (captured 2025-11-14) as
    the goal of the CHoRUS Network: to develop the most diverse, high-resolution, ethically
    sourced, AI-ready data set to answer the grand challenge of improving recovery from acute
    illness.'
tasks:
- name: Characterizing acute and critical care illness
  description: The grant abstract names ML/AI applications aimed at characterizing acute and
    critical care illness as a need the data generation project will meet.
- name: Predicting complications
  description: The grant abstract names ML/AI applications aimed at predicting complications
    as a need the data generation project will meet.
- name: Measuring treatment response
  description: The grant abstract names ML/AI applications aimed at measuring treatment response
    among patients with acute or critical illness as a need the data generation project will
    meet.
addressing_gaps:
- name: Infrastructure for AI/ML in critical care
  description: The grant abstract states that there is an urgent need for infrastructure to
    support artificial intelligence and machine learning (AI/ML) in critical care, and that
    developing high-resolution multi-center data sets is a critical first step towards actionable
    and trustworthy AI.
