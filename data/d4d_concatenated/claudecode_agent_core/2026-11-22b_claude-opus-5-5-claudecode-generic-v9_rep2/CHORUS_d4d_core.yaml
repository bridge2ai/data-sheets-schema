instances:
- name: Patient admissions
  instance_type: patient admission
  counts: 50000
  description: The project website reports the current released dataset as 50,000 patient
    admissions from ICU, PICU, and NICU, and an anticipated final dataset of 100,000 patient
    admissions. The AIM-AHEAD webinar states that, as of August 2025, the dataset covers 14
    different hospitals with over 45K unique admissions. The grant abstract states the plan
    of acquiring an AI-ready data set from more than 100,000 critically ill patients.
  source_caveats: 'The count of 50,000 is the project website''s figure for the current released
    dataset; the webinar''s "over 45K unique admissions as of August 2025" is compatible with
    it (a lower bound at an earlier stated date), so no conflict is recorded. The 100,000
    figures are targets: the website counts patient admissions and the grant abstract counts
    critically ill patients, different units that are not compared.'
collection_mechanisms:
- name: Retrospective multicenter collection
  description: The AIM-AHEAD webinar describes the CHoRUS dataset as a retrospective data
    collection. The project website states that the CHoRUS project is the collection of multi-modal
    data across 14 different hospitals. The CHoRUS GitHub organization overview (captured
    2025-11-14) states that the collaboration spans 20 academic centers, of which 14 will
    contribute as Data Acquisition centers.
- name: Site data extraction and contribution under standard operating protocols
  description: The CHoRUS GitHub organization overview (captured 2025-11-14) states that the
    organization houses standard operating protocols (SOPs) to instruct data contributing
    sites about best practices for curating and delivering interoperable datasets, with an
    interactive workflow diagram describing the step-by-step process for extracting and contributing
    clinical data to CHoRUS. Its repository list includes a repository with tools to create
    and upload a CHoRUS Data Extract and a repository dedicated to producing characterization
    reports to return to sites following their data submissions.
raw_data_sources:
- name: PACS
  source_description: Imaging is drawn from PACS (AIM-AHEAD webinar data-type table).
- name: Bedside monitors and gateway/middleware
  source_description: Waveform telemetry is drawn from bedside monitors and gateway/middleware
    (AIM-AHEAD webinar data-type table).
- name: Hospital EEG database
  source_description: Waveform EEG is drawn from a hospital database (AIM-AHEAD webinar data-type
    table).
sampling_strategies:
- name: Planned sampling for comprehensive and balanced cohorts
  strategies: 'Planned, not described as performed: the grant abstract states that the project
    will establish a legal framework for collecting data at scale, sampling to ensure comprehensive
    sets of patient conditions and clinical treatment strategies; the CHoRUS GitHub organization
    overview (captured 2025-11-14) states that federated access will enable sampling methods
    to ensure a balanced and diverse cohort.'
preprocessing_strategies:
- name: Standardization to OMOP
  preprocessing_details: The grant abstract states the plan to standardize data to the OMOP
    Common Data Model, and the AIM-AHEAD webinar lists OMOP as the data standard for the structured
    EHR data types. The project website states that the data utilizes ongoing and new standardization
    practices, and the CHoRUS GitHub organization overview (captured 2025-11-14) states that
    unified standards will harmonize multi-modal EHR, waveform, imaging, and text data.
- name: Clinical note extraction and tokenization
  preprocessing_details: Clinical notes are extracted and tokenized using the OHNLP toolkit
    (AIM-AHEAD webinar).
- name: Semantic mapping to international standards
  preprocessing_details: The CHoRUS GitHub organization overview (captured 2025-11-14) states
    that its repositories provide validated semantic mappings for connecting clinical data
    in various source formats to international standards, and that a chorus-mapping repository
    was established with documentation and pooled tabular mappings along with an associated
    clinical validation SOP for contributing to mapping efforts.
labeling_strategies:
- name: Planned labeling environment
  labeling_details: 'Planned, not described as performed: the CHoRUS GitHub organization overview
    (captured 2025-11-14) states that a visualization and annotation environment will label
    data with targets important for prediction.'
existing_uses:
- name: Training activities and publications
  description: The AIM-AHEAD webinar (September 2025) states that the datasets are being used
    for training activities and publications.
- name: AIM-AHEAD Bridge2AI for Clinical Care Training Program
  description: The AIM-AHEAD webinar states that the AIM-AHEAD Bridge2AI for Clinical Care
    Training Program expands access to Bridge2AI CHoRUS data through engagement, AI training,
    and mentorship; the project website points to opportunities to gain hands-on training
    using the CHoRUS dataset.
distribution_formats:
- name: Cloud enclave
  description: The AIM-AHEAD webinar states that OMOP and telemetry data are in the enclave,
    except clinical notes, which are stored locally except tokens. The project website states
    that the team creates tools to support the cloud enclave.
updates:
  update_details: The project website distinguishes the current released dataset (50,000 patient
    admissions) from an anticipated final dataset (100,000 patient admissions). The AIM-AHEAD
    webinar states that, as of its date, imaging de-identification was in process for a larger
    cohort and EEG extraction was in process.
license_and_use_terms:
  license_terms: The AIM-AHEAD webinar states that all participants (of the AIM-AHEAD Bridge2AI
    for Clinical Care Training Program) must sign a licensing agreement included in the registration
    form before gaining access to the dataset.
data_governance:
  access_review_process: Controlled access (AIM-AHEAD webinar). For the AIM-AHEAD training
    program, participants fill out a registration form with name, email, and institution,
    and an email is sent once access is granted and compute is provisioned; the webinar's
    eligibility section also states that program participants need a ".edu" email address
    to gain access to the dataset. The CHoRUS GitHub organization overview (captured 2025-11-14)
    lists access requests to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  description: The grant abstract states the plan to perform community-facing ethics focus
    groups to determine what data is appropriate for public sharing. The project website states
    that the CHoRUS consortium evaluates community perspectives on clinical care AI to find
    ways to increase trustworthiness of provenance and privacy in AI.
