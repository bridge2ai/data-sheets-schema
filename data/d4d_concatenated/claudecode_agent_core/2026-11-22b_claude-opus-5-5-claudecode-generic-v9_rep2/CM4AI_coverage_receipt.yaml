- id: c001
  status: nothing_relevant
  reason: "Concatenation preamble and table of contents listing the ten source files; it states no fact about the dataset."
- id: c002
  status: nothing_relevant
  reason: "Front matter and opening of the Nature article on a U2OS cell map. Its subject is that study's U2OS data, which the article deposits elsewhere (NDEx, MassIVE, ProteomeXchange, HPA); no passage states that the study used or produced the CM4AI dataset releases, so nothing here supports a value in the referent's slots. (Re-dispositioned before Phase 2: first written as an existing_uses receipt, withdrawn once the whole article had been read and no link to the referent was found.)"
- id: c003
  status: nothing_relevant
  reason: "Results of the Nature U2OS cell-map study (annotation, SEC-MS validation, structural modelling, protein function, cell-type specificity, tumour mutations, the study's portal and toolkit); its subject is that study's U2OS map, not the CM4AI dataset releases, so it supplies no value for the referent's own slots."
- id: c004
  status: nothing_relevant
  reason: "Methods of the Nature U2OS study (AP-MS, HPA immunofluorescence and SEC-MS collection in U2OS cells, embedding model, community detection, annotation); these describe how that study's U2OS map was made, not how the CM4AI dataset releases were collected or processed."
- id: c005
  status: nothing_relevant
  reason: "Remaining Nature U2OS methods, the study's own data and code availability (NDEx, MassIVE, ProteomeXchange, HPA, ModelArchive deposits of the U2OS study data), change history and the start of the reference list; none of it describes the CM4AI dataset releases."
- id: c006
  status: nothing_relevant
  reason: "Reference list of the Nature article (cited works only); no statement about the CM4AI dataset."
- id: c007
  status: nothing_relevant
  reason: "End of the Nature reference list, the article's acknowledgements (funding of that U2OS study) and its author affiliations; these are facts about the article and its study, not about the CM4AI dataset releases, whose funding and creators the release records state themselves."
- id: c008
  status: nothing_relevant
  reason: "Author list, contributions, competing interests, extended-data legends and citation block of the Nature U2OS article. The article is not named by any CM4AI release page or the project site as a publication about the CM4AI dataset, so its citation is not carried as a related resource of the referent. (Re-dispositioned before Phase 2 from a provisional external_resources receipt.)"
