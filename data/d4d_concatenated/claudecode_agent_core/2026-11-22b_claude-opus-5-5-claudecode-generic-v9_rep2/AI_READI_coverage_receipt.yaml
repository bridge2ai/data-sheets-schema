  - slot: description
    snippet: "recruitment sampling procedures aimed at achieving approximately equal distribution of participants across sex, race, and diabetes severity"
  - slot: cleaning_strategies[2]
    snippet: "the dataset has been reviewed internally by AI-READI team members for quality checks and to ensure that no personally identifiable information was accidentally included"
  - slot: updates.update_details
    snippet: "The dataset gets released as static versions. This is the third version of the dataset and consists of data collected up through the end of the second year of the study"
  - slot: updates.frequency
    snippet: "There are plans to release new versions of the dataset approximately once a year with additional data from participants who have been enrolled since the last dataset version release."
  - slot: version_access.version_details
    snippet: "the first version of the dataset contains data from 204 participants, the second version contains additional data from 863 participants for a total of 1067 participants, and this version contains a total of 2280 participants"
  - slot: version_access.version_details
    snippet: "the Snellen visual acuity variables were dropped in this version of the dataset, such that now only logMAR visual acuity measurements are available"
  - slot: related_datasets[0].notes
    snippet: "There was also a previous datasheet created for the second version of the dataset, which consisted of data collected up to the end of the first full year of the study."
  - slot: related_datasets[1].notes
    snippet: "There was a previous datasheet created for the first version of the dataset, which consisted of data collected during the pilot data collection phase."
  - slot: related_datasets[1]
    snippet: "This is the third version of the dataset and consists of data collected up through the end of the second year of the study"
  - slot: file_collections[9].description
    snippet: "\"metadataFileName\": \"CHANGELOG.md\", \"metadataFileDescription\": \"This is a metadata file based on the Clinical Dataset Structure (CDS)\""
  - slot: splits[0]
    snippet: "It does include a new recommended data split for the 2280 participants balancing training, validation, and testing sets for age, sex, races/ethnicities, and study group."
  - slot: purposes[2]
    snippet: "The purpose for creating the dataset was to enable future generations of artificial intelligence/machine learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM)"
  - slot: addressing_gaps[0]
    snippet: "a key issue is the lack of data ready for training AI models. The AI-READI dataset is intended to fill this gap."
  - slot: tasks[0]
    snippet: "being gathered to facilitate downstream pseudotime manifolds and various applications in artificial intelligence"
  - slot: creators[1]
    snippet: "This dataset was created by members of the AI-READI project, hereby referred to as the AI-READI Consortium."
  - slot: funders[0]
    snippet: "The creation of the dataset was funded by the National Institutes of Health (NIH) through their Bridge2AI Program"
  - slot: instances[0]
    snippet: "Each instance represents an individual patient."
  - slot: instances[0].counts
    snippet: "There are 2280 instances in this current version of the dataset (version 3, released fall 2025)."
  - slot: sampling_strategies[3]
    snippet: "The dataset contains all possible instances. More specifically, the dataset contains data from all participants who have been enrolled during the first year of data collection for AI-READI."
  - slot: description
    snippet: "These encompass tabular data, imaging data, and physiological signal/waveform data. There is no unstructured text data included in this dataset."
  - slot: missing_data_documentation[0]
    snippet: "Yes, not all modalities are available for all participants. Some participants elected not to participate in some study elements."
  - slot: missing_data_documentation[0].missing_data_causes
    snippet: "the data collection device did not have any stored results or was returned too late to retrieve the results (e.g. battery died, data was lost)"
  - slot: relationships[0]
    snippet: "all instances are part of the same prospective data generation project (AI-READI). There is currently only one visit per participant."
  - slot: anomalies[0]
    snippet: "In cases of survey data, skipped questions or incomplete responses are expected."
  - slot: anomalies[1]
    snippet: "In cases of using wearables, improper use, technical failure such as battery failure or system malfunction are expected."
  - slot: anomalies[2]
    snippet: "In cases of imaging data, patient uncooperation, noise that may obscure the images and technical failure such as system malfunction, and data transfer failures are expected."
  - slot: external_resources[0]
    snippet: "The documentation is shared under the CC-BY 4.0 license, so there are no restrictions associated with its use."
  - slot: sensitive_elements[0]
    snippet: "the controlled access dataset will contain data regarding racial and ethnic origins, location (5-digit zip code), as well as motor vehicle accident reports"
  - slot: data_collectors[1]
    snippet: "the University of Alabama at Birmingham (UAB)"
  - slot: data_collectors[2]
    snippet: "the University of California San Diego (UCSD)"
  - slot: data_collectors[3]
    snippet: "and the University of Washington (UW)"
  - slot: known_limitations[2]
    snippet: "Factors influencing the generalization of derived models include the predominantly urban and hospital-based recruitment, which may not fully capture diverse cultural and socioeconomic backgrounds."
  - slot: known_limitations[3]
    snippet: "as it does not include other races/ethnicities such as Pacific Islanders and Native Americans"
  - slot: cleaning_strategies[1]
    snippet: "clinical data outside of expected min/max ranges were flagged in REDCap, which was visible in reports viewed by clinical research coordinators (CRCs) and Data Managers"
  - slot: preprocessing_strategies[0]
    snippet: "the Digital Imaging and Communications in Medicine (DICOM), a commonly used standard for medical imaging data"
  - slot: preprocessing_strategies[1]
    snippet: "all data were mapped to standardized terminologies when possible, such as the Observational Medical Outcomes Partnership (OMOP) Common Data Model"
  - slot: raw_sources[0]
    snippet: "The raw data is saved and expected to be preserved by the AI-READI project at least for the duration of the project but is not anticipated to be shared outside the project team right now"
  - slot: sampling_strategies[1]
    snippet: "Must not have gestational diabetes"
  - slot: collection_mechanisms[9]
    snippet: "a custom-designed sensor unit called the LeeLab Anura"
  - slot: collection_mechanisms[11]
    snippet: "The Dexcom G6 is a real-time, integrated continuous glucose monitoring system (iCGM)"
  - slot: collection_mechanisms[10]
    snippet: "The Garmin Vivosmart 5 Fitness Activity tracker will be used to measure data related to physical activity."
  - slot: collection_mechanisms[19]
    snippet: "OMRON HEM 907XL Blood Pressure Monitor"
  - slot: collection_mechanisms[20]
    snippet: "Medline MDS4001 Automatic Digital Blood Pressure Monitor"
  - slot: collection_mechanisms[21]
    snippet: "Welch Allyn 6000 series Vital signs monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff"
  - slot: collection_mechanisms[5]
    snippet: "M&S Technologies EVA device to test visual acuity."
  - slot: collection_mechanisms[6]
    snippet: "The MARS Letter Contrast Sensitivity test (Perceptrix) was conducted monocularly"
  - slot: collection_mechanisms[7]
    snippet: "KR 800 Auto Keratometer/Refractor."
  - slot: collection_mechanisms[22]
    snippet: "NIDEK LM-600P Auto Lensometer"
  - slot: collection_mechanisms[23]
    snippet: "Topcon-CL-200 computerized Lensometer"
  - slot: collection_mechanisms[24]
    snippet: "Topcon-CL-300 computerized Lensometer"
  - slot: collection_mechanisms[18]
    snippet: "The Optomed Aurora IQ is a handheld fundus camera that can take non-mydriatic images of the ocular fundus."
  - slot: collection_mechanisms[12]
    snippet: "The iCare EIDON is a widefield TrueColor confocal fundus imaging system"
  - slot: collection_mechanisms[13]
    snippet: "The Heidelberg Spectralis HRA+OCT is an ophthalmic imaging system"
  - slot: collection_mechanisms[15]
    snippet: "The DRI OCT Triton is a device from Topcon Healthcare"
  - slot: collection_mechanisms[14]
    snippet: "The Maestro2 is a robotic OCT and color fundus camera system from Topcon Healthcare."
  - slot: collection_mechanisms[17]
    snippet: "Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) is an advanced imaging technique used in ophthalmology."
  - slot: collection_mechanisms[16]
    snippet: "The Zeiss Cirrus 5000 Angioplex is a high-definition optical coherence tomography (OCT) system"
  - slot: collection_mechanisms[3]
    snippet: "It is done using a standard 10g monofilament applying pressure to different points on the plantar surface of the feet."
  - slot: collection_mechanisms[4]
    snippet: "AI READI research staff perform this test on an iPad using a pre-installed software (MoCA Duo app downloaded from the app store)"
  - slot: anomalies[3]
    snippet: "the quality of the images vary from patient to patient and within the same patient"
  - slot: anomalies[4]
    snippet: "As the machine is operated by the imaging team and is not fully automated, quality issues may arise, which may lead to skipping this modality and missing data."
  - slot: anomalies[5]
    snippet: "it is kept to be performed as the last modality of an AI READI visit. Because of this patients may not be at their best possible compliance."
