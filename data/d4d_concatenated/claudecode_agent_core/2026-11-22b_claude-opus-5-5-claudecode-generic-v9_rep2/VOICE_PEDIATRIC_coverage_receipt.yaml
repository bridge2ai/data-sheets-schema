  - slot: file_collections[0].resources[0]
    snippet: "torchaudio_spectrograms.parquet (n=23533) contains spectrograms of dimension 201xT generated using the short-time Fast Fourier Transform (FFT) with a 25ms window size, 10ms hop length, and a 400-point FFT."
  - slot: file_collections[0].resources[1]
    snippet: "torchaudio_mel_spectrograms.parquet (n=23533) contains Mel spectrograms of dimension 60xT generated with a 25ms window size, 10ms hop length, a 400-point FFT and 60 Mel bins."
  - slot: file_collections[0].resources[2]
    snippet: "torchaudio_mfcc.parquet (n=23533) contains Mel-frequency cepstrum coefficients of dimension 60xT using the same parameters as the mel spectrograms."
  - slot: file_collections[0].resources[3]
    snippet: "torchaudio_pitch.parquet (n=23533) contains the detected pitch (fundamental frequency) over time and is of dimension T with a min and max pitch of 80 and 500 respectively."
  - slot: file_collections[0].resources[4]
    snippet: "sparc_ema.parquet (n=23532) contains the estimated electromagnetic articulography (EMA) using a deep learning model with dimensions Tx12"
  - slot: file_collections[0].resources[5]
    snippet: "sparc_loudness.parquet (n=23532) contains the estimated loudness based on the average absolute amplitude of the audio waveform of size T, using 20ms windows."
  - slot: file_collections[0].resources[6]
    snippet: "sparc_periodicity.parquet (n=23532) contains the estimated periodicity (confidence of pitch presence) derived from the audio using 20ms windows of dimension T."
  - slot: file_collections[0].resources[7]
    snippet: "sparc_pitch.parquet (n=23532) contains the estimated fundamental frequency (F0) of the audio signal using a different algorithm than before with a range of 50-550Hz and dimension T."
  - slot: file_collections[0].resources[8]
    snippet: "ppgs.parquet (n=23533) contains the phonetic posteriorgram probabilities across 40 phoneme categories giving a dimension of 40xT with a frame rate of 100Hz."
  - slot: file_collections[0].resources[9]
    snippet: "Each feature is present in the static_features.tsv file."
  - slot: file_collections[0].resources[10]
    snippet: "There is also metrics related to audio quality derived from the recordings present in the audio_quality_metrics.tsv file."
  - slot: missing_data_documentation[0].missing_data_patterns
    snippet: "Spectrograms, Mel Spectrograms, MFC coefficients, PPGs, and EMAs for sensitive records and audio checks have been removed from v1.1."
  - slot: missing_data_documentation[0].missing_data_causes
    snippet: "some files, whether due to length or other issues, could not generate certain features and so are not included in the bundled data."
  - slot: preprocessing_strategies[2].preprocessing_details
    snippet: "features derived from the open-source Speech and Music Interpretation by Large-space Extraction (openSMILE [5]), Praat [6], parselmouth [7], and torchaudio [8, 9] are provided."
