title: Bridge2AI-Voice Pediatric Dataset
version: 1.1.0
id: doi:10.13026/h995-bt35
name: Bridge2AI-Voice Pediatric Dataset v1.1.0
description: Bridge2AI-Voice Pediatric Dataset v1.1.0, published on PhysioNet on May 1, 2026,
  contains derived audio features for 23,533 recordings collected from 300 participants aged
  2-18 at the Hospital for Sick Children. The release contains data considered low risk, including
  derivations such as spectrograms, but not the original voice recordings; detailed demographic,
  clinical and validated questionnaire data are also made available. The dataset is organized
  into derived audio features (under features), phenotypic information acquired during data
  collection (under phenotype) and metadata for the recordings (under metadata). Raw audio
  is not part of the PhysioNet project and is handled through a separate, controlled access
  route.
source_caveats: (1) The PhysioNet page notes that the Bridge2AI-Voice Adult Dataset is also
  available on PhysioNet (https://physionet.org/content/b2ai-voice/); no passage in the bundle
  states what the relation between the two datasets is (for example a part, version or supplement
  relation), so no related_datasets entry is recorded. Large parts of the project documentation
  in the bundle (the healthsheet answers for the v2.0.0 dataset with 833 adult participants,
  the v3.0.0 de-identification methods, adult devices, compensation and timeframe) describe
  the adult Bridge2AI-Voice dataset and were not used for this record's own slots. (2) The
  project documentation states that the pediatric dataset v1.0 contained data from 300 participants;
  the v1.1 release notes state that no new participants were released in that minor update,
  which is consistent with the 300 participants stated for v1.1.0. (3) The PhysioNet corresponding-author
  contact is not in the bundle (the page states that you must be logged in to view the contact
  information). (4) The project documentation lists a lead investigator "Jennifer Sui, MD
  (Hospital for Sick Children)", while the PhysioNet author list contains "Jennifer Siu";
  the sources do not establish that these name the same person, so no affiliation is attached
  to the creator entry. (5) Several statements in this record come from the umbrella Bridge2AI
  Voice Data Acquisition protocol (University of South Florida) rather than from the pediatric
  release itself; they are attributed to the protocol and kept in the protocol's own tense.
