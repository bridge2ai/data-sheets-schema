funders:
- name: NIH
  grantor: NIH
  description: The PhysioNet release states that this project was funded by NIH project number
    3OT2OD032720-01S1. The project documentation describes Bridge2AI-Voice as a Precision
    Public Health grand challenge project funded by the NIH Common Fund Bridge2AI Program.
  grants:
  - grant_number: 3OT2OD032720-01S1
    name: 'Bridge2AI: Voice as a Biomarker of Health - Building an ethically sourced, bioaccoustic
      database to understand disease like never before'
  source_caveats: The bundle's NIH RePORTER page describes project number 3OT2OD032720-01S3
    (core project number OT2OD032720), a different award number from the 3OT2OD032720-01S1
    the PhysioNet release names as this project's funding. The record carries the award the
    PhysioNet release names and does not treat 3OT2OD032720-01S3 as funding of this release.
instances:
- name: Recordings
  instance_type: recording (derived audio features)
  counts: 23533
  description: Derived audio features for 23,533 recordings; the recordings themselves are
    not distributed in this release.
- name: Participants
  instance_type: participant
  counts: 300
  description: Participants aged 2-18 from whom the recordings were collected.
subpopulations:
- name: Age groups
  identification: The project documentation states that pediatric participants are recruited
    strictly from the Hospital for Sick Children (SickKids) and are grouped by age.
  description: The project documentation lists pediatric protocols for the age groups Peds
    10+, Peds 6-10, Peds 4-6 and Peds 2-4.
sensitive_elements:
- name: Release risk level
  sensitivity_details: The release contains data considered low risk, including derivations
    such as spectrograms but not the original voice recordings.
collection_mechanisms:
- name: reproschema-ui on tablets
  mechanism_details: All data was collected through customized software, reproschema-ui, on
    tablets, with the Bridge2AI-Voice pediatric protocol. A headset was used to record most
    participants, while the remaining recordings used the built-in tablet microphone due to
    low tolerance of wearing headphones or existing complex medical conditions.
  description: The standardized age-appropriate protocol included the collection of demographic
    information, voice and speech related questionnaires, and questionnaires inquiring about
    medical history. The project documentation's acoustic task table lists pediatric tasks
    including Ready For School (recalling a typical day preparing for school), Long Sounds
    (sustained /ee/ and /ah/ sounds), Caterpillar Passage (Pediatrics) and Silly Sounds.
  used_software:
  - id: doi:10.13026/h995-bt35#software-reproschema-ui
    name: reproschema-ui
data_collectors:
- name: Hospital for Sick Children
  description: Patients and healthy volunteers at the Hospital for Sick Children were considered
    for enrollment in the study.
  collector_details: Hospital for Sick Children, Toronto, Ontario, Canada (HSC). The data
    acquisition protocol lists Alistair Johnson, DPhil, as the HSC investigator and, in its
    table of lead investigators per site, as HSC lead for data integration.
missing_data_documentation:
- name: Removed and ungenerated features
  missing_data_patterns: Spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for
    sensitive records and audio checks have been removed from v1.1.
  missing_data_causes: Some files, whether due to length or other issues, could not generate
    certain features and so are not included in the bundled data.
sampling_strategies:
- name: Eligibility and recruitment
  strategies: Patients were eligible if they were 2 to 18 years of age and had English proficiency;
    exclusion criteria included participants over 18 years of age and individuals who were
    non-verbal. Non-patients, recruited through research postings, were evaluated for eligibility
    against the same inclusion and exclusion criteria. The project documentation states that
    pediatric participants are recruited strictly from the Hospital for Sick Children (SickKids)
    and are grouped by age.
raw_sources:
- name: Raw audio recordings
  access_url: https://www.synapse.org/Synapse:syn73617068
  raw_data_details: This PhysioNet project does not contain raw audio. A PhysioNet announcement
    dated March 9, 2026 states that raw audio data access for the Bridge2AI Voice pediatric
    cohort is via Synapse and that data will be made available via Synapse (syn73617068).
    Accessing raw audio is a more involved process and requires institutional sign-off; interested
    users are asked to reach out to the access committee. The project documentation states
    that raw audio data is disseminated through controlled access only to protect participants'
    privacy, and announces the v1.1.0 pediatric dataset as available with voice upon request.
preprocessing_strategies:
- name: Export and format conversion
  preprocessing_details: Data were exported and converted to tab delimited values using an
    open source library developed by the team. The project documentation states that pediatric
    data collected through ReproSchema-UI is extracted and transformed into REDCap format,
    and subsequently converted to the Brain Imaging Data Structure (BIDS).
- name: Waveform feature extraction and phenotype merging
  preprocessing_details: The code used to preprocess the raw audio waveforms into the parquet
    files and to merge the source data into the phenotype files has been made open source
    in the b2aiprep library.
  used_software:
  - id: https://github.com/sensein/b2aiprep
    name: Bridge2AI Data Processing Library (b2aiprep)
    version: 3.0.0
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
- name: Feature extraction with openSMILE, Praat, parselmouth and torchaudio
  preprocessing_details: Features were derived from the open-source Speech and Music Interpretation
    by Large-space Extraction (openSMILE), Praat, parselmouth and torchaudio, and each feature
    is present in static_features.tsv.
  used_software:
  - id: doi:10.13026/h995-bt35#software-opensmile
    name: openSMILE
  - id: doi:10.13026/h995-bt35#software-praat
    name: Praat
  - id: doi:10.13026/h995-bt35#software-parselmouth
    name: parselmouth
  - id: doi:10.13026/h995-bt35#software-torchaudio
    name: torchaudio
cleaning_strategies:
- name: Manual check of free speech tasks
  cleaning_details: The v1.1 release notes state that audio features were released for all
    free speech tasks that were manually checked for presence of unconsented speakers and
    PII.
- name: Inadvertent caregiver voice
  cleaning_details: The data acquisition protocol states that, where a caregiver's voice is
    recorded inadvertently, these clips can be discarded by re-recording manually during data
    collection or during data audit and postprocessing.
intended_uses:
- name: Study of developmental norms
  description: The release states that resources such as this project are intended to enable
    study of developmental norms.
- name: AI-driven tools for early screening
  description: The release states that resources such as this project are intended to create
    AI-driven tools for early screening.
- name: Clinical insight
  description: The release states that resources such as this project are intended to support
    clinical insight.
distribution_dates:
- name: PhysioNet versions
  release_dates:
  - '1.0.0: 2025-12-17'
  - '1.1.0: 2026-05-01'
retention_limit:
  retention_details: The data acquisition protocol states that identifiable data and datasheets
    linking participant numbers to participant information will be kept in each institution
    on local cloud storage for a maximum of 10 years after study completion.
version_access:
  latest_version_doi: doi:10.13026/mf9s-5r03
  versions_available:
  - 1.0.0
  - 1.1.0
  version_details: v1.0 was the first release of the Bridge2AI-Voice Pediatric dataset. v1.1
    is a minor update with no new participants that releases audio features for all free speech
    tasks that were manually checked for presence of unconsented speakers and PII, together
    with new metrics related to the audio quality of the recordings and per recording metadata
    information.
ethical_reviews:
- name: Hospital for Sick Children Research Ethics Board
  reviewing_organization: Research Ethics Board at the Hospital for Sick Children
  review_details: Data collection and sharing was approved by the Research Ethics Board at
    the Hospital for Sick Children. The umbrella Bridge2AI Voice Data Acquisition protocol
    states that Canadian institutions (MSH, SickKids and UofT) do not follow the single IRB
    process and apply for a separate research ethics board approval.
human_subject_research:
  involves_human_subjects: true
  ethics_review_board: Research Ethics Board at the Hospital for Sick Children
  special_populations:
  - children aged 2 to 18 years
informed_consent:
- name: Consent before collection and sharing
  consent_obtained: true
  consent_type: parental or participant consent
  consent_scope: data collection and data sharing
at_risk_populations:
  description: The participants are children aged 2 to 18 years. The special protections,
    the assent procedures and the second and third guardian-consent entries are from the umbrella
    Bridge2AI Voice Data Acquisition protocol; the first guardian-consent entry is from the
    PhysioNet release.
  special_protections:
  - Pediatric patients will be enrolled only through the pediatric sites and not at USF; data
    collection for pediatric cohorts will only be performed at the pediatric participating
    institutions.
  - Checklist HRP-416 for children under 21 has been completed and is appended to the protocol.
  assent_procedures: When children participate, parents or guardians will provide consent,
    and children will provide verbal assent where appropriate. Where young children cannot
    reasonably be asked to assent (due to limitations in understanding due to age and development)
    they will not be asked to do so, which typically holds for children under seven years
    of age.
  guardian_consent:
  - Parental or participant consent was obtained prior to data collection and data sharing.
  - The protocol excludes pediatric participants who do not receive consent from a parent
    or guardian to voice and clinical de-identified data being uploaded to an open-sourced
    database.
  - Parental permission will be obtained from one or both parents; the protocol describes
    the research as minimal risk and not requiring permission from both parents or legal guardians.
license_and_use_terms:
  license_terms: 'Access policy: only credentialed users who sign the data use agreement can
    access the files. License for files: Bridge2AI Voice Registered Access License. Data use
    agreement: Bridge2AI Voice Registered Access Agreement. Required training: no training
    required. This is a restricted-access resource; to access the files a user must be a credentialed
    user and sign the data use agreement for the project. The project documentation states
    that the adult and pediatric datasets are available through separate PhysioNet links under
    registered access, and that credentialed users must be approved and sign the data use
    agreement.'
data_governance:
  committee_name: Data Access Compliance Office
  access_review_process: 'The project documentation states that the feature-only and raw audio
    datasets are available under distinct agreements appropriate for the sensitivity of their
    respective content, and describes these routes. Registered access (features-only data):
    register on PhysioNet and confirm identity, and sign the Bridge2AI-Voice Registered Access
    Agreement. Controlled access (raw audio data): complete the Data Access Request Form (DARF)
    and the Data Use Agreement, submit the application to the Data Access Compliance Office
    for review and, upon approval, ensure a Data Use and Transfer Agreement (DTUA) is signed
    by an authorized official at the requesting institution; the DTUA template states that
    it is effective only upon review and approval of the Data Access Compliance Office (DACO).
    The PhysioNet release asks users interested in raw audio access to reach out to the access
    committee at DACO@b2ai-voice.org.'
