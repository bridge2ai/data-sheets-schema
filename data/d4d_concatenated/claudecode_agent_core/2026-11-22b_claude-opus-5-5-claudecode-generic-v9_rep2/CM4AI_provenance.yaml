    inside the observed interval, and no measurement event before that result falls
    outside it, its messages take the finalized total_tokens and output_tokens, with
    the estimate the subtraction pooled over them (usage_from_terminal_result counts
    such invocations; terminal_results_excluded_by_cut those with a result the cut
    set aside while their messages rest on snapshots, #1931/#1937/#1945/#1962); every
    other message counts once at its largest snapshot (a response spans several transcript
    lines) with a per-message estimate; evidence two transcripts share is refused,
    not reconciled (#1972). duration_ms sums each invocation''s own span, so a resumed
    run excludes the gap. bundle_lines_read is the union of the run''s successful
    file-reading windows over the declared bundle (#700): lines the run never opened,
    or opened only in a read that errored, may have been reached by search, but nothing
    attests that. Of the transcript''s reasoning measure (#1000/#1011) the observation
    carries assistant_turns, output_tokens, thinking_blocks, thinking_text_chars,
    visible_text_chars, tool_input_chars, reasoning_tokens_estimate; comparable in
    kind with the API path''s reasoning log, never to be averaged with it. reasoning_tokens_estimate
    is output tokens minus a 4-chars-per-token estimate of the text and tool-call
    payloads: a subtraction, an upper bound, not a measurement. thinking_tokens is
    the runtime''s own count: the session total from the terminal result of each invocation
    thinking_from_terminal_results counts, plus whatever per-turn counts the other
    invocations carry, which may be none; thinking no invocation reported stays unmeasured,
    and no turn coverage is claimed (#1978/#1982/#1994/#1997). usage_from_terminal_result
    counts the sessions in which a transcript''s own terminal result finalizes the
    total_tokens and output_tokens of the messages that transcript recorded, with
    the estimate for those messages the subtraction pooled over them; a message no
    result covers keeps per-message accounting (#1931/#1957/#1962).'
