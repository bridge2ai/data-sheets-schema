    No" declaration on every release record.'
preprocessing_strategies:
- id: cm4ai.preprocessing.music_pipeline
  name: MuSIC data integration and map production pipeline
  preprocessing_details:
  - '"The Tools Module of CM4AI is responsible for producing and maintaining a dataset integration and
    map production system, the Multi-Scale Integrated Cell (MuSIC) pipeline, which produces integrated
    cell maps from the multiple, multi-modal input data streams."'
  - Segment (a) Download PPI and Image Data - PPI networks are downloaded from the Krogan Laboratory's
    deposition archive and IF images from the Lundberg Laboratory's deposition archive.
  - Segment (b) Generate embeddings - "Downloaded PPI networks are processed using the node2vec deep learning
    model to reduce dimensionality, producing a PPI embedding"; "IF images are processed using a Human
    Protein Atlas deep learning model to reduce dimensionality, producing an image embedding that contains
    information about protein localization."
  - Segment (c) Co-Embedding - "The PPI and image embeddings are integrated to obtain a co-embedding for
    each protein using contrastive deep learning. This integration model learns co-embeddings such that
    the original embeddings can be reconstructed with minimal information loss and proteins with similar
    PPI and image embeddings have similar co-embeddings."
  - Segment (d) Protein Community Detection and Hierarchy Creation - "Community detection is performed
    based on the all-by-all similarities of pairs of proteins in the co-embedding space. The resulting
    hierarchy of protein communities is output as the final cell map."
  - Segment (e) Hierarchy evaluation - maps are aligned to Gene Ontology and Reactome to identify assemblies
    overlapping known cell biology, and annotated with an LLM approach that names protein sets and assigns
    a name confidence score.
  - Segment (f) Integrative structure modeling - MuSIC communities are annotated by available structural
    information (PDB, AlphaFold Protein Structure Database, crosslinking mass spectrometry, disorder prediction)
    and ranked by the amount of structural information as a proxy for modeling feasibility; top-ranked
    communities are modelled with the Integrative Modeling Platform.
  used_software:
  - id: https://ndex2.readthedocs.io/en/latest/
    name: ndex2 Python library
    description: Library named alongside Cytoscape and HiView as a means of accessing cell maps shared
      via the Network Data Exchange (NDEx).
  - id: http://integrativemodeling.org
    name: Integrative Modeling Platform (IMP)
    version: '2.18'
    url: http://integrativemodeling.org
    description: '"The modeling protocol was scripted using the Python Modeling Interface package, a library
      for modeling macromolecular complexes based on our open-source Integrative Modeling Platform (IMP)
      package version 2.18 (https://integrativemodeling.org)."'
- id: cm4ai.preprocessing.fairscape_packaging
  name: FAIRSCAPE AI-readiness packaging
  preprocessing_details:
  - '"The Standards Module of CM4AI is responsible for AI-Readiness packaging of data, software, metadata
    and provenance graphs. This task is performed by the FAIRSCAPE framework."'
  - '"The client-side package, FAIRSCAPE-CLI, is called when any computation or coherent set of computations
    in the pipeline is completed, and it is passed metadata which defines schemas in JSON-Schema for the
    datasets in the computational unit, as well as the inputs, computations, software, and outputs. FAIRSCAPE-CLI
    creates an RO-Crate package with the datasets, metadata, and software - or resolvable references to
    these components - and unique stubs for identifier creation on each of these components."'
  - '"The RO-Crates are then sent to the FAIRSCAPE server where they are registered and assigned persistent,
    resolvable, globally unique persistent identifiers (PIDs)... The PID system currently in use is the
    ARK scheme - with DOIs a future feature as supplementary PIDs for final-state publishable work."'
  - '"Lastly, the server computes end-to-end entailments on each RO-Crate''s provenance as expressed in
    the EVI Evidence Graph Ontology and links them together where possible."'
  - AI-readiness features at the time of the project preprint comprise "(a) establishing FAIRness including
    rich metadata and persistent, globally unique identifiers; (b) computing a machine-readable provenance
    graph, resolvable as metadata for all results, including inputs, computations, software, and outputs;
    and (c) characterizing and validating all datasets and data elements, and mapping data elements to
    public ontology vocabularies, where appropriate, using JSON-Schema mini-data-dictionary descriptions
    resolvable from the provenance graph metadata."
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    license: MIT
    url: https://fairscape.github.io
    description: '"The FAIRSCAPE AI-readiness framework is described with a tutorial and instructions
      for installation at https://fairscape.github.io. Copyright (c) 2024 to this software is held by
      the Rector and Board of Visitors of the University of Virginia. It is available under open source
      MIT License." Both the client-side and server-side packages are PIP-installable and freely available.'
cleaning_strategies:
- id: cm4ai.cleaning.quality_control
  name: Quality control of generated data
  cleaning_details:
  - The project preprint reports, for the Year-1 single-cell CRISPR screens, that "The resulting data
    are currently being QCed."
  - Antibody and image quality control for spatial proteomics follows Human Protein Atlas standard procedures;
    the CM4AI-authored Nature 2025 study states that newly generated images "were more recently generated
    and validated according to the Human Protein Atlas (HPA) standard procedures for image and antibody
    quality control". That study's cleaning and QC description applies to its U2OS cell map rather than
    to the MDA-MB-468 and KOLF2.1J data in the quarterly releases.
  - 'The June 2025 release revision applied corrections rather than statistical cleaning: it "includes
    adding RGB immunofluorescent images, corrections to ro-crate metadata, and changes to naming conventions".'
labeling_strategies:
- id: cm4ai.labeling.assembly_annotation
  name: Annotation of protein assemblies in cell maps
  data_annotation_protocol:
  - '"Cell maps are annotated in a two pronged approach. First, cell maps are aligned to known protein
    function and pathway resources, including the Gene Ontology (GO) and Reactome, to determine protein
    assemblies in the cell map with high overlap with known cell biology. Second, assemblies in the cell
    maps are annotated using a large language model (LLM) approach that we developed to name sets of proteins
    and assign a name confidence score."'
  labeling_details:
  - 'Scope note: this describes the programme''s map-annotation method. The quarterly releases distribute
    map-input data streams and state that computed cell maps are not included, so no assembly labels are
    distributed in the releases captured here.'
  - In the CM4AI-authored Nature 2025 study of a U2OS cell map, annotation was carried out through "a
    series of in-person Annotation Jamborees, during which approximately a dozen individuals worked in
    pairs to assign names and putative functional roles to assemblies on the basis of expert knowledge
    and literature curation", informed by GPT-4 suggestions with a self-assessed confidence score, followed
    by "final naming determination" by the human curation team.
annotation_analyses:
- id: cm4ai.annotation_analysis.llm_confidence
  name: LLM name-confidence assessment
  analysis_method: Assemblies named by a large language model are accompanied by a self-assessed name
    confidence score, and correspondence with known components is quantified by Jaccard index against
    CORUM, Gene Ontology and Human Protein Atlas annotations.
  annotation_quality_details:
  - In the CM4AI-authored Nature 2025 U2OS study, the LLM "assigned names to known assemblies with very
    high confidence (median of 0.92 for both high overlap and substantial variation)" and "to the previously
    undocumented assemblies with moderately high confidence (median, 0.85), contrasting starkly with its
    confidence for sets of proteins drawn randomly without any correspondence to biological structure
    (median, 0.0)". Names with confidence >= 0.85 were passed to the human curation team.
  - 'Scope note: these figures characterise that study''s U2OS cell map, not the contents of the quarterly
    CM4AI data releases.'
machine_annotation_tools:
- id: cm4ai.machine_tools.pipeline_models
  name: Machine learning models and tools used in map production and annotation
  tools:
  - node2vec deep learning model
  - Human Protein Atlas deep learning image model
  - Contrastive deep learning co-embedding model
  - Multiscale community detection
  - GPT-4 large language model
  - AlphaFold-Multimer
  - Integrative Modeling Platform (IMP)
  tool_descriptions:
  - node2vec reduces the dimensionality of downloaded PPI networks to produce a PPI embedding containing
    information about a protein's interactions.
  - A Human Protein Atlas deep learning model reduces the dimensionality of IF images to produce an image
    embedding containing information about protein localization.
  - Contrastive deep learning integrates the PPI and image embeddings into a per-protein co-embedding
    that preserves both modalities.
  - Community detection over all-by-all co-embedding similarities produces the hierarchy of protein communities
    output as the cell map.
  - GPT-4 is used through "an engineered prompt and pipeline... to guide the LLM to generate descriptive
    names for gene sets indicative of their biological roles, along with a fully referenced analysis essay
    providing its rationale... and a self-assessment of confidence in the suggested name."
  - AlphaFold-Multimer was used in the CM4AI-authored Nature 2025 U2OS study "to predict structural models
    for every pair of proteins arising in the same focal protein assembly"; that application is downstream
    of the release data rather than part of release production.
  - IMP version 2.18 supports integrative structure modeling of top-ranked MuSIC communities.
existing_uses:
- id: cm4ai.existing_use.nature_2025_cell_map
  name: Multimodal cell maps as a foundation for structural and functional genomics
  examples:
  - Leah V. Schaffer, Mengzhou Hu, Gege Qian and colleagues, "Multimodal cell maps as a foundation for
    structural and functional genomics", Nature volume 642, pages 222-231 (2025), published 09 April 2025,
    open access, with a Publisher Correction published 02 October 2025. The study constructs "a global
    map of human subcellular architecture through joint measurement of biophysical interactions and immunofluorescence
    images for over 5,100 proteins in U2OS osteosarcoma cells", resolving "275 molecular assemblies spanning
    the range of 10^-8 to 10^-5 m", validated by whole-cell size-exclusion chromatography and annotated
    using large language models.
  - 'Reported applications: structures for 111 heterodimeric complexes and an expanded Rag-Ragulator assembly;
    unexpected functions for 975 proteins, including roles for C18orf21 in RNA processing and DPP9 in
    interferon signalling; assemblies with multiple localizations or cell type specificity; and decoding
    of paediatric cancer genomes, "identifying 21 recurrently mutated assemblies and implicating 102 validated
    new cancer proteins". "The associated Cell Visualization Portal and Mapping Toolkit provide a reference
    platform for structural and functional cell biology."'
  - 'Scope note: this study is authored by CM4AI investigators and demonstrates the programme''s mapping
    methodology, but its measurements are in U2OS osteosarcoma cells and are not the contents of the CM4AI
    quarterly data releases, which use MDA-MB-468 and KOLF2.1J cells.'
- id: cm4ai.existing_use.perturbation_cell_atlas
  name: A perturbation cell atlas of human induced pluripotent stem cells
  examples:
  - Nourreddine S, Doctor Y, Dailamy A, et al., "A PERTURBATION CELL ATLAS OF HUMAN INDUCED PLURIPOTENT
    STEM CELLS", bioRxiv 2024 Nov 4; 2024.11.03.621734, PMCID PMC11580897, doi https://doi.org/10.1101/2024.11.03.621734.
    Listed as a Related Publication on the CM4AI release records alongside the CM4AI project preprint.
- id: cm4ai.existing_use.codefest_training
  name: CM4AI CodeFest training use
  examples:
  - '"Initial Datasets, Tools and Standards associated with all three parallel mapping platforms have
    been released and are publicly available at our CM4AI web portal. These data were also made available
    at our CodeFest in March 2024, accompanied by detailed tutorials explaining how the data were derived
    and integrated, and providing production ready software for producing the datasets."'
  - '"For our inaugural virtual CodeFest event, we provided training to a total of 38 registrants where
    40% of the attendees identified as female and 30% came from underrepresented communities."'
use_repository:
- id: cm4ai.use_repository.cm4ai_portal
  name: CM4AI web portal
  repository_url: https://cm4ai.org/
  repository_details:
  - 'The CM4AI web portal carries Data Releases, Tools, Product Documentation, Publications and Learning
    sections: "Check out our recent publications to learn more about how CM4AI is addressing the Bridge2AI''s
    Functional Genomics grand challenge."'
  - '"Teaming supports open dissemination of CM4AI-generated data, maps, and tools via the CM4AI web portal
    (http://www.cm4ai.org), using the U-BRITE platform, to support open and trustworthy data management
    and sharing."'
other_tasks:
- id: cm4ai.other_task.perturbation_response
  name: Analysis of cell architecture under disease, treatment and perturbation
  task_details:
  - 'Listed under Intended Use on the release records: "Cell architectural changes and interactions in
    presence of specific disease processes, treatment conditions, or genetic perturbations".'
- id: cm4ai.other_task.variant_interpretation
  name: Interpretation of genetic variants and mutations
  task_details:
  - '"Cell maps provide a foundation for downstream applications in human genomics, including interpretation
    of genetic variants and mutations."'
future_use_impacts:
- id: cm4ai.future_impact.interim_content
  name: Future releases will change the contents
  impact_details:
  - '"Data presented here will be augmented regularly through the end of the project", with quarterly
    updates, and future releases "will" add predicted cell maps. Users should expect file inventories,
    names and checksums to change between releases; the June 2026 archives share file names with the October
    2025 archives but have different MD5 checksums.'
  - '"Software packages will be versioned as the project progresses, and the version used to produce each
    dataset will be referenced in the dataset''s metadata."'
- id: cm4ai.future_impact.repository_review_notice
  name: Repository under administrative review
  impact_details:
  - Both the CM4AI website and the University of Virginia Dataverse collection display the notice "This
    repository is under review for potential modification in compliance with Administration directives",
    which is a stated risk to the future form or availability of the collection.
discouraged_uses:
- id: cm4ai.discouraged.integrated_map_claims
  name: Treating the releases as finished integrated cell maps
  discouragement_details:
  - '"This is an interim release" that "Does not contain predicted cell maps, which will be added in future
    releases"; "The current release is most suitable for bioinformatics analysis of the individual datasets."'
  - '"Requires domain expertise for meaningful analysis."'
intended_uses:
- id: cm4ai.intended_use.release_statement
  name: Intended uses stated on the release records
  examples:
  - AI-ready datasets to support research in functional genomics
  - AI model training
  - Cellular process analysis
  - Cell architectural changes and interactions in presence of specific disease processes, treatment conditions,
    or genetic perturbations
  use_category:
  - functional genomics research
  - artificial intelligence and machine learning research
  usage_notes: The data are laboratory data intended for research use. They are released "to the research
    community under minimally restrictive terms consistent with ethical guidelines, researcher attribution,
    and research integrity", under CC BY-NC-SA 4.0, and are most suitable in their current form for bioinformatics
    analysis of the individual data streams.
prohibited_uses:
- id: cm4ai.prohibited.clinical_use
  name: Clinical decision-making and patient care
  prohibition_reason:
  - 'Stated under Prohibited Uses on the release records: "These laboratory data are not to be used in
    clinical decision-making or in any context involving patient care without appropriate regulatory oversight
    and approval."'
- id: cm4ai.prohibited.unlicensed_commercial_use
  name: Commercial use without a separate licence
  prohibition_reason:
  - The CC BY-NC-SA 4.0 licence states "NonCommercial - You may not use the material for commercial purposes",
    where "A commercial use is one primarily intended for commercial advantage or monetary compensation."
  - '"Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question). A Data Access Committee will supervise
    ethical matters related to dataset distribution and potential dual licensing for commercial use."'
distribution_formats:
- id: cm4ai.distribution_format.dataverse_releases
  name: Quarterly Dataverse release packages
  access_urls:
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
  - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
  - https://cm4ai.org/data-releases/
  description: 'Releases are distributed from LibraData, the University of Virginia''s Dataverse instance,
    within the "Cell Maps for Artificial Intelligence" collection (University of Virginia Dataverse >
    LibraData: UVa''s Scholarly Research > School of Medicine > Cell Maps for Artificial Intelligence).
    Predominant file formats are ZIP archives of measurement data, JSON RO-Crate metadata, and HTML datasheet
    and provenance-graph documents. Dataverse offers metadata export in OAI_ORE, DataCite, OpenAIRE, Schema.org
    JSON-LD, DDI Codebook v2, Dublin Core, DDI HTML Codebook, JSON and (for the October 2025 and June
    2026 releases) Croissant. Bulk download is constrained: "The dataset is too large to download. Please
    select the files you need from the files table", with a 953.7 MB ZIP download limit and a Data Access
    API at https://dataverse.lib.virginia.edu/api/access/datafile/ for programmatic access. All files
    in all captured releases are Public and require no authentication; the download guestbook collects
    account information.'
distribution_dates:
- id: cm4ai.distribution_dates.release_series
  name: Quarterly release dates
  release_dates:
  - '2025-03-03: March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX'
  - '2025-07-01: June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R'
  - '2025-10-31: October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM'
  - '2026-06-17: June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C; version 2 released 2026-07-15T20:28:19Z.
    The CM4AI data-releases page displays "Released on: June 17, 2025" for this release, which conflicts
    with the Dataverse publication date of 2026-06-17.'
  - A "May 2024 Data Release" is named in the Archive list on the CM4AI data-releases page; no DOI or
    publication date is given for it there.
  description: '"CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input
    data streams."'
license_and_use_terms:
  id: cm4ai.license.cc_by_nc_sa_4
  name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
  description: 'Every CM4AI release records "License/Data Use Agreement: CC BY-NC-SA 4.0", with the Dataverse
    terms note that "Our Community Norms as well as good scientific practices expect that proper credit
    is given via citation. Please use the data citation shown on the dataset page."'
  license_terms:
  - Canonical licence URL https://creativecommons.org/licenses/by-nc-sa/4.0/; the deed captured in the
    source bundle is https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en.
  - '"You are free to: Share - copy and redistribute the material in any medium or format; Adapt - remix,
    transform, and build upon the material. The licensor cannot revoke these freedoms as long as you follow
    the license terms."'
  - '"Attribution - You must give appropriate credit, provide a link to the license, and indicate if changes
    were made. You may do so in any reasonable manner, but not in any way that suggests the licensor endorses
    you or your use."'
  - '"NonCommercial - You may not use the material for commercial purposes."'
  - '"ShareAlike - If you remix, transform, or build upon the material, you must distribute your contributions
    under the same license as the original."'
  - '"No additional restrictions - You may not apply legal terms or technological measures that legally
    restrict others from doing anything the license permits."'
  - '"Dataset licensed for reuse under Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    license... Attribution is required to the copyright holders and the authors. Any publications referencing
    this data or derived products should cite the Related Publication below, as well as directly citing
    this data collection."'
  - '"Its datasets and software are available to the research community under minimally restrictive terms
    consistent with ethical guidelines, researcher attribution, and research integrity."'
  - 'Software is licensed separately: the MuSIC/Tools data integration pipeline is "available under BSD-3
    open source license in GitHub (for alpha level tools) or in the Zenodo long-term archive (for production-ready
    tools)", and FAIRSCAPE is "available under open source MIT License".'
  data_use_permission:
  - no_commercial_use
  contact_person: cm4ai.person.ideker_trey
ip_restrictions:
