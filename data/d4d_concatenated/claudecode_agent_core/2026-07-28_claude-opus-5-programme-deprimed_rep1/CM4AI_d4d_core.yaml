errata:
- id: cm4ai.erratum.june_2025_revision
  name: June 2025 release revision (version 2.1)
  erratum_details:
  - '"This dataset is a revision of the June 2025 Data Release of Cell Maps for Artificial Intelligence...
    This revision includes adding RGB immunofluorescent images, corrections to ro-crate metadata, and
    changes to naming conventions."'
  - 'Naming conventions changed between releases: the March 2025 IF archives are named cm4ai-v0.6-beta-if-images-{condition}.zip,
    while the June 2025 and later archives are named cm4ai_ifimages_MDA-MB-468_{condition}.zip.'
- id: cm4ai.erratum.nature_publisher_correction
  name: Publisher Correction to the CM4AI-authored Nature 2025 study
  erratum_details:
  - '"A Publisher Correction to this article was published on 02 October 2025" for Schaffer et al., "Multimodal
    cell maps as a foundation for structural and functional genomics", Nature volume 642, pages 222-231
    (2025). This correction concerns the publication, not the CM4AI data releases.'
updates:
  id: cm4ai.updates.quarterly
  name: Quarterly update plan
  frequency: quarterly
  update_details:
  - '"Dataset will be regularly updated and augmented through the end of the project in November 2026",
    with "Updates on a quarterly basis".'
  - '"CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data streams."'
  - '"Data presented here will be augmented regularly through the end of the project."'
  - Each quarterly release is deposited as its own Dataverse dataset with its own DOI rather than as a
    new version of a single dataset record; earlier releases remain individually citable and are listed
    under "Archive" on the CM4AI data-releases page.
retention_limit:
  id: cm4ai.retention.long_term_preservation
  name: Retention and preservation
  retention_period: Long term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds. No end date for retention is stated.
  retention_details:
  - '"Long term preservation in the University of Virginia Dataverse, supported by committed institutional
    funds."'
  - '"LibraData is the University of Virginia''s instance of Dataverse, an NIH-approved generalist repository."'
  - 'Caveat on the same pages: "This collection is under review for potential modification in compliance
    with Administration directives."'
version_access:
  id: cm4ai.version_access.release_series
  name: Access to current and prior releases
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
  - June 2026 Data Release (Beta), doi:10.18130/V3/HIGT4C, Dataverse version 2.0, published 2026-06-17,
    version 2 released 2026-07-15T20:28:19Z, 10 files - current.
  - October 2025 Data Release (Beta), doi:10.18130/V3/K7TGEM, Dataverse version 2.1, published 2025-10-31,
    8 files - superseded.
  - June 2025 Data Release (Beta), doi:10.18130/V3/F3TD5R, Dataverse version 2.1, published 2025-07-01,
    21 files - superseded.
  - March 2025 Data Release (Beta), doi:10.18130/V3/B35XWX, Dataverse version 1.4, published 2025-03-03,
    6 files - superseded.
  - '"May 2024 Data Release" - named in the Archive list on the CM4AI data-releases page, with no DOI,
    version or date given there.'
  - '"Cell Maps for Artificial Intelligence - Data Release", https://doi.org/10.18130/V3/DXWOS5, University
    of Virginia Dataverse, V1 - cited as the then-current release in the Data and Software Availability
    Statement of the CM4AI project preprint (posted 24 May 2024). The corpus does not state whether this
    DOI is the "May 2024 Data Release" of the archive list.'
  version_details:
  - All prior releases remain published and individually citable by DOI; the CM4AI data-releases page
    lists the March 2025, June 2025 and October 2025 releases, together with a May 2024 release, under
    "Archive", and presents the June 2026 release as "Our latest data release".
  - 'Dataverse version labels and citation version strings disagree on several releases: version 1.4 versus
    V1 (B35XWX), 2.1 versus V2 (F3TD5R and K7TGEM); the June 2026 release shows 2.0 and V2.'
  - 'Release archives may share file names across releases while differing in content: the June 2026 IF
    image, mass-spec and perturb-seq archives carry the same names as the October 2025 archives but different
    MD5 checksums and, for several files, different displayed sizes.'
  - The project preprint refers to a "0.5 alpha data release", and the March 2025 IF archives are named
    with a "v0.6-beta" prefix, indicating an earlier alpha/beta versioning scheme that predates the dated
    quarterly release names.
