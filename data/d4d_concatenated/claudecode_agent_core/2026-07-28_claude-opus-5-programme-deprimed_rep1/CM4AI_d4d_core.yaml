regulatory_restrictions:
  id: cm4ai.regulatory.status
  name: Regulatory and compliance status
  regulatory_restrictions:
  - 'Release records state "FDA Regulated: No".'
  - '"These laboratory data are not to be used in clinical decision-making or in any context involving
    patient care without appropriate regulatory oversight and approval."'
  other_compliance:
  - 'Release records state "Human Subjects: No" and "De-identified Samples: Yes".'
  - Bridge2AI participants accessing B2AI data, including CM4AI datasets, at the Bridge2AI Open House
    must attest and commit to the Bridge2AI Code of Conduct prior to accessing the data.
  - The project implements "a standards data management approach based on FAIR access and software principles,
    with deep provenance and replication packages".
  confidentiality_level: unrestricted
  governance_committee_contact: cm4ai.person.parker_jillian
is_deidentified:
  id: cm4ai.deidentification.cell_lines
  name: De-identification status
  identifiable_elements_present: false
  method: Data are generated from commercially available, de-identified established human cell lines rather
    than from identifiable human subjects.
  deidentification_details:
  - 'Release records state "De-identified Samples: Yes".'
  - '"CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue cultures)
    and are considered to be de-identified as they cannot be matched, with current knowledge, to a human
    subject."'
  - 'Donor-level attributes that remain associated with the cell lines are those published for the lines
    themselves: MDA-MB-468 from a 51-year-old Black female with metastatic mammary adenocarcinoma, and
    KOLF2.1J from a healthy male Northern European donor.'
