    and confocal microscopy in the Lundberg Lab at Stanford University".
  - In the MuSIC pipeline, "IF images for the cell line and conditions are downloaded from the Lundberg
    Laboratory's deposition archive".
- id: cm4ai.collector.production_locations
  name: CM4AI production locations
  role: Institutions recorded as production locations on the release records
  collector_details:
