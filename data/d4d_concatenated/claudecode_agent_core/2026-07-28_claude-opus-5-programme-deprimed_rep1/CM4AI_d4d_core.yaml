instances:
- id: cm4ai.instance.protein_interactions
  name: Protein interactions
  instance_type: protein-protein interaction
  counts: 1374
  label: false
  description: Programme-level count reported in the "Data Insights" panel of cm4ai.org and of the CM4AI
    data-releases page ("Protein Interactions 1,374"). Protein-protein interaction data are generated
    by two orthogonal mass spectrometry approaches, affinity purification mass spectrometry (AP-MS) on
    endogenously tagged cell lines and size-exclusion chromatography coupled to mass spectrometry (SEC-MS)
    for proteome-wide complex and interaction mapping.
- id: cm4ai.instance.if_images
  name: Immunofluorescent images
  instance_type: immunofluorescence confocal microscopy image
  counts: 53788
  label: false
  description: Programme-level count reported in the "Data Insights" panel of cm4ai.org and of the CM4AI
    data-releases page ("Immunofluorescent Images 53,788"). Images are acquired by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford University, with nuclei
    stained with DAPI (blue channel), endoplasmic reticulum with a calreticulin antibody (yellow channel),
    microtubules with tubulin antibody (red channel), and an antibody against the protein of interest
    (green channel). The March 2025 release archives covered 563 proteins of interest in MDA-MB-468; the
    June 2025 and October 2025 archives covered 464 proteins of interest.
- id: cm4ai.instance.proteins_investigated
  name: Total proteins investigated
  instance_type: protein interrogated across CM4AI mapping modalities
  counts: 7023
  label: false
  description: Programme-level count reported in the "Data Insights" panel of cm4ai.org and of the CM4AI
    data-releases page ("Total Proteins Investigated 7,023"). The flagship-dataset summaries on the data-releases
    page describe "SEC-MS capturing ~7,000 proteins" for both the iPSC-derived curated datasets and the
    TNBC curated datasets.
- id: cm4ai.instance.genes_targeted
  name: Genes targeted by CRISPRi perturbation
  instance_type: gene targeted by CRISPR interference in a Perturb-seq screen
  counts: 11739
  label: false
  description: Programme-level count reported in the "Data Insights" panel of cm4ai.org and of the CM4AI
    data-releases page ("genes targeted 11,739"). The Perturbation Cell Atlas archives in the March 2025
    and October 2025 releases are described as "an expressed genome-scale CRISPRi Perturbation Cell Atlas
    in KOLF2.1J human induced pluripotent stem cells (hiPSCs) mapping transcriptional and fitness phenotypes
    associated with 11,739 targeted genes". The flagship-dataset summary describes "Perturb-seq of >11,000
    genes (whole-genome)" for the iPSC-derived curated datasets and "Perturb-seq of 200 genes" for the
    TNBC curated datasets.
  missing_information:
  - id: cm4ai.missing.perturbseq_embargo
    name: Embargoed perturb-seq external deposits
    missing:
    - External-repository copies of the perturb-seq data in KOLF2.1J iPSCs (undifferentiated) and in MDA-MB-468
      breast cancer cells (+/- treatment) are marked "Embargoed" in the external data links of the October
      2025 and June 2026 releases.
    why_missing:
    - The release records state under Completeness that "Some datasets are under temporary pre-publication
      embargo".
- id: cm4ai.instance.apms_interactomes
  name: AP-MS interactomes in treated MDA-MB-468 cells
  instance_type: affinity purification mass spectrometry interactome
  label: false
  description: The June 2026 release is the first release in the corpus whose contents statement includes
    "AP-MS data for MDA-MB-468 breast cancer cells + treatment", distributed as cm4ai_apms_MDA-MB-468_paclitaxel.zip
    and cm4ai_apms_MDA-MB-468_vorinostat.zip. No instance count is given for the released AP-MS data.
    The CM4AI project preprint reported, as Year-1 status, that "We have endogenously tagged 17 genes
    in MDA-MB-468 and acquired AP-MS data under three conditions (untreated, paclitaxel and vorinostat
    treated)" with 34 additional genes then in progress; that figure describes the preprint's status snapshot
    and is not asserted here as the composition of the June 2026 release.
- id: cm4ai.instance.secms_complexes
  name: SEC-MS protein complex elution profiles
  instance_type: size-exclusion chromatography mass spectrometry elution profile
  label: false
  description: SEC-MS is applied to MDA-MB-468 cells under three conditions (untreated, paclitaxel and
    vorinostat treated) and to KOLF2.1J iPSCs and derived neural progenitor cells, neurons and cardiomyocytes.
    The CM4AI project preprint reported that SEC-MS "enabled us to identify 72/100 chromatin modifiers,
    with 52 of them being integral components of protein complexes", that "We detected PPI profiles of
    over a thousand complexes in MDA-MB468 cells, with thousands of proteins exhibiting differential elution
    profiles between control and paclitaxel or vorinostat treated cells", and that SEC-MS in KOLF2 iPSCs
    and derivatives uncovered "more than 700 protein complexes in both parental iPSCs and differentiated
    neurons". These are preprint-stage figures, not per-release counts.
anomalies:
- id: cm4ai.anomaly.incomplete_modality_overlap
  name: Incomplete overlap between modality protein sets
  anomaly_details:
  - 'Stated under Completeness on the release records: "Protein-protein interaction (SEC-MS), protein
    localization (IF imaging), and CRISPRi perturbSeq data interrogate sets of proteins which incompletely
    overlap."'
  - 'Consequence: analyses requiring all three modalities for the same protein are restricted to the intersection
    of the modality-specific protein sets.'
- id: cm4ai.anomaly.embargoed_components
  name: Temporary pre-publication embargo on some components
  anomaly_details:
  - 'Stated under Completeness on the release records: "These data are not yet in completed final form:
    Some datasets are under temporary pre-publication embargo."'
  - The October 2025 and June 2026 release records mark the external perturb-seq deposits for KOLF2.1J
    iPSCs and for MDA-MB-468 cells as "Embargoed".
- id: cm4ai.anomaly.no_computed_cell_maps
  name: Computed cell maps not included
  anomaly_details:
  - 'Stated under Completeness on the release records: "Computed cell maps not included in this release."
    The releases distribute map-input data streams rather than the integrated hierarchical maps that are
    the programme''s stated deliverable.'
known_biases:
- id: cm4ai.bias.cell_line_derived
  name: Data derived from a small number of established human cell lines
  bias_type: selection_bias
  bias_description: 'Stated under Potential Sources of Bias on the release records: "Data in this release
    was derived from commercially available de-identified human cell lines." The programme uses the triple-negative
    breast cancer line MDA-MB-468 (RRID:CVCL_0419), established from a metastatic pleural effusion of
    a 51-year-old Black female with metastatic mammary adenocarcinoma, and the iPSC line KOLF2.1J (RRID:CVCL_B5P3),
    derived from a healthy male Northern European donor.'
  affected_subsets:
  - All CM4AI mapping modalities in every release to date.
- id: cm4ai.bias.limited_biological_variation
  name: Limited representation of population-level biological variation
  bias_type: representation_bias
  bias_description: 'Stated under Potential Sources of Bias on the release records: the data "Does not
    represent all biological variants which may be seen in the population at large."'
  affected_subsets:
  - All CM4AI mapping modalities in every release to date.
known_limitations:
- id: cm4ai.limitation.interim_release
  name: Interim release status
  limitation_type: scope_limitation
  limitation_description: 'Stated under Limitations on the release records: "This is an interim release."
    Every release to date is labelled "(Beta)", and the programme states that data "will be augmented
    regularly through the end of the project".'
  scope_impact: Contents, file names and checksums change between quarterly releases; analyses should
    record the specific release DOI and version used.
  recommended_mitigation: Cite the specific release DOI and version, and check the CM4AI data-releases
    page for a newer quarterly release.
- id: cm4ai.limitation.no_predicted_cell_maps
  name: Predicted cell maps not yet included
  limitation_type: coverage_limitation
  limitation_description: 'Stated under Limitations on the release records: the release "Does not contain
    predicted cell maps, which will be added in future releases."'
  scope_impact: The integrated hierarchical cell maps that are the programme's headline deliverable are
    not obtainable from the released files alone.
- id: cm4ai.limitation.individual_dataset_analysis
  name: Best suited to analysis of the individual datasets
  limitation_type: methodological_limitation
  limitation_description: 'Stated under Limitations on the release records: "The current release is most
    suitable for bioinformatics analysis of the individual datasets" and "Requires domain expertise for
    meaningful analysis."'
  recommended_mitigation: Involve domain expertise in proteomics, spatial imaging and single-cell genomics
    when interpreting the released data streams.
confidential_elements:
- id: cm4ai.confidentiality.release_files
  name: Confidentiality of released files
  confidential_elements_present: false
  confidentiality_details:
  - Every file in every captured CM4AI release is listed with File Access "Public"; the Dataverse access
    facets report Public counts equal to the total file counts (6 of 6, 21 of 21, 8 of 8, 10 of 10).
  - 'The data are non-clinical, derived from tissue cultures, and "considered to be de-identified as they
    cannot be matched, with current knowledge, to a human subject". Release records state "Human Subjects:
    No" and "De-identified Samples: Yes".'
  - 'Access limits reported on the release pages are size-related rather than confidentiality-related:
    "The dataset is too large to download. Please select the files you need from the files table", with
    a 953.7 MB ZIP download limit and a Data Access API for programmatic access.'
subpopulations:
- id: cm4ai.subpopulation.cell_line_donors
  name: Cell-line donor characteristics
  subpopulation_elements_present: true
  identification:
  - MDA-MB-468 (RRID:CVCL_0419) "is a triple negative breast cancer cell line established from a metastatic
    site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma, available
    from ATCC."
  - KOLF2.1J (RRID:CVCL_B5P3) iPSCs "was derived from a healthy male Northern European donor, available
    from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource."
  distribution:
  - The programme's data derive from these two donor-derived cell lines only; no population-level sampling
    frame is defined, and the release records state the data do not represent all biological variants
    seen in the population at large.
sensitive_elements:
- id: cm4ai.sensitive.none_identified
  name: Sensitive elements
  sensitive_elements_present: false
  sensitivity_details:
  - 'Release records state "Human Subjects: No", "De-identified Samples: Yes", "FDA Regulated: No".'
  - '"CM4AI data are distinctive within Bridge2AI in that they are non-clinical (from tissue cultures)
    and are considered to be de-identified as they cannot be matched, with current knowledge, to a human
    subject."'
acquisition_methods:
- id: cm4ai.acquisition.laboratory_measurement
  name: Laboratory measurement on cultured human cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Input data streams are directly measured in the project''s own laboratories: AP-MS and SEC-MS proteomics
    in the Nevan Krogan laboratory at UCSF, immunofluorescence subcellular imaging in the Lundberg Lab
    at Stanford University, and single-cell CRISPR perturbation screens on MDA-MB-468 and KOLF2.1J lines.'
  - 'There are no human subjects and therefore no subject-reported data; release records state "Human
    Subjects: No".'
  - 'Derived content: hierarchical cell maps are inferred from the measured streams by self-supervised
    embedding and multi-resolution community detection in the MuSIC pipeline; the released quarterly packages
    currently distribute the map-input streams and state that "Computed cell maps not included in this
    release".'
  - 'Verification: the CRISPR Perturbation Cell Atlas released in March 2025 states "We validated these
    findings via phenotypic, protein-interaction, and metabolic tracing assays." The project preprint
    reports that the Year-1 CRISPR screen data "are currently being QCed". The CM4AI-authored Nature 2025
    study systematically validated map assemblies with an orthogonal whole-cell SEC-MS experiment, in
    U2OS cells rather than in the cell lines used for the quarterly releases.'
collection_mechanisms:
- id: cm4ai.mechanism.apms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - '"To map protein-protein interactions (PPIs) of 100 chromatin regulators under different conditions
    (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated, neurons and cardiomyocytes),
    we employed AP-MS on endogenously tagged cell lines."'
  - AP-MS archives for MDA-MB-468 cells treated with paclitaxel and with vorinostat first appear in the
    June 2026 release.
- id: cm4ai.mechanism.secms
  name: Size-exclusion chromatography coupled to mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS is used "for proteome-wide complex/interaction mapping" as the second of "two orthogonal mass
    spectrometry-based approaches", performed in the Nevan Krogan laboratory at the University of California
    San Francisco.
  - SEC-MS has been performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel and vorinostat
    treated) and on KOLF2.1J iPSCs and iPSC-derived neural progenitor cells, neurons and cardiomyocytes.
- id: cm4ai.mechanism.if_imaging
  name: Immunofluorescence subcellular imaging
  mechanism_details:
  - Spatial proteomics data are generated by "immunofluorescence (IF) subcellular microscopy", using the
    Human Protein Atlas resource of antibodies.
  - '"We established automated fixation and permeabilization protocols for the pipetting robot for MDA-MB-468
    and KOLF2 cell lines, and completed spatial proteomics mapping of 100 chromatin regulators in the
    MDA-MB-468 cells (+/- paclitaxel or vorinostat), with another 500 proteins pending significant hits
    from the genetic perturbations and PPI results."'
  - Imaging is by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab
    at Stanford University, with reference stains for nuclei (DAPI, blue), endoplasmic reticulum (calreticulin
    antibody, yellow) and microtubules (tubulin antibody, red), plus the target protein in green.
- id: cm4ai.mechanism.crispr_perturbation
  name: Single-cell CRISPR/Cas9 genetic perturbation screens
  mechanism_details:
  - '"We performed single-cell CRISPR screens perturbing 100 chromatin regulators in the MDA-MB-468 cells
    under 3 conditions (no treatment, paclitaxel or vorinostat) and KOLF2 iPSC in the undifferentiated
    state."'
  - '"We have designed a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per
    gene. We generated and characterized MDA-MB-468 and KOLF2 CRISPR lines expressing inducible dCas9."'
  - '"Single-cell CRISPR screens of 100 chromatin regulators (+/- drug) in MDA-MB-468 cells and in undifferentiated
    KOLF2.1J iPSCs were done using the 10x Genomics 3''HT kit."'
  - The released Perturbation Cell Atlas is genome-scale, mapping transcriptional and fitness phenotypes
    associated with 11,739 targeted genes in KOLF2.1J hiPSCs.
sampling_strategies:
- id: cm4ai.sampling.targeted_panels_and_cell_lines
  name: Targeted protein panels in two disease-relevant cell systems
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - MDA-MB-468 triple-negative breast cancer cell line (RRID:CVCL_0419), available from ATCC, +/- paclitaxel
    or vorinostat.
  - KOLF2.1J induced pluripotent stem cell line (RRID:CVCL_B5P3), available from the HipSci resource,
    undifferentiated and differentiated to neural progenitor cells, neurons and cardiomyocytes.
  strategies:
  - '"CM4AI cell maps are produced from multimodal interrogation of chromatin modifiers, metabolic enzymes,
    and other proteins involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
    cell lines under treated and untreated conditions."'
  - The stated target panel is "100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
    neuropsychiatric, and cardiac disorders", with spatial proteomics extending to a further 500 proteins
    pending hits from the perturbation and PPI results.
  - The CRISPRi Perturbation Cell Atlas is genome-scale rather than panel based, covering 11,739 targeted
    genes.
  - '"We are generating deep multi-modal data for a shared list of proteins across all cell types and
    treatment conditions to achieve an unparallelled level of biological insight."'
  why_not_representative:
  - '"Data in this release was derived from commercially available de-identified human cell lines" and
    "Does not represent all biological variants which may be seen in the population at large."'
data_collectors:
- id: cm4ai.collector.krogan_lab
  name: Nevan Krogan laboratory, University of California San Francisco
  role: Mass spectrometry proteomics (SEC-MS, AP-MS) data generation
  collector_details:
  - SEC-MS datasets for undifferentiated KOLF2.1J hiPSCs and for vorinostat- or paclitaxel-treated MDA-MB-468
    breast cancer cells are described in the release file metadata as generated "in the Nevan Krogan laboratory
    at the University of California San Francisco".
  - In the MuSIC pipeline, "PPI networks for the cell line and conditions are downloaded from the Krogan
    Laboratory's deposition archive".
- id: cm4ai.collector.lundberg_lab
  name: Lundberg Lab, Stanford University
  role: Immunofluorescence spatial proteomics imaging
  collector_details:
