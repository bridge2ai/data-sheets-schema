id: https://cm4ai.org/data-releases/
name: CM4AI Data Release Programme
title: Cell Maps for Artificial Intelligence (CM4AI) Data Release Programme
description: The Cell Maps for Artificial Intelligence (CM4AI) data-release programme is the ongoing,
  quarterly release series of the Functional Genomics Data Generation Project in the U.S. National Institutes
  of Health Bridge2AI program. CM4AI "will deliver machine-readable hierarchical maps of cell architecture
  as AI-ready data, together with quarterly data releases of map-input data streams." Its maps "are produced
  from multimodal interrogation of chromatin modifiers, metabolic enzymes, and other proteins involved
  in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines under treated and
  untreated conditions, utilizing state-of-the-art mass spectrometry-based proteomics, spatial proteomics
  / cell imaging, and genetic perturbations via CRISPR/Cas9." The cell lines under investigation are treated
  (paclitaxel, vorinostat) versus untreated MDA-MB-468 triple-negative breast cancer cells, and undifferentiated
  KOLF2.1J induced pluripotent stem cells versus iPSC-derived neural progenitor cells, neurons and cardiomyocytes.
  Input data streams are AP-MS and SEC-MS protein-protein interaction data, immunofluorescence subcellular
  imaging for spatial proteomics, and single-cell CRISPR/Cas perturbation screens; they are integrated
  by the Multi-Scale Integrated Cell (MuSIC) pipeline and packaged with provenance graphs and rich metadata
  as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework. Individual quarterly releases
  are deposited in LibraData, the University of Virginia's Dataverse instance, each with its own DOI,
  version and file inventory; the releases are enumerated under `resources`. CM4AI is a collaboration
  of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University, and the Hastings
  Center. The project portal reports cumulative programme-level data insights of 1,374 protein interactions,
  53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted, and a data
  volume of 21.4 TB; the portal states these as display figures without units resolved to bytes, so they
  are recorded here as stated rather than converted. Every release records the Dataverse Subject "Medicine,
  Health and Life Sciences". Releases are labelled Beta and are augmented quarterly through the end of
  the project.
page: https://cm4ai.org/data-releases/
publisher: https://dataverse.lib.virginia.edu/
license: https://creativecommons.org/licenses/by-nc-sa/4.0/
status: Ongoing quarterly Beta release programme. The June 2026 Data Release (doi:10.18130/V3/HIGT4C)
  is the current release; the March 2025, June 2025 and October 2025 releases are listed under "Archive"
  on the CM4AI data-releases page and are superseded. The Dataverse collection and the CM4AI repository
  both display the notice "This repository is under review for potential modification in compliance with
  Administration directives."
conforms_to: CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
  in RO-Crate format using the FAIRSCAPE framework. FAIRSCAPE assigns persistent, resolvable, globally
  unique identifiers using the ARK scheme and computes end-to-end provenance entailments expressed in
  the EVI Evidence Graph Ontology, with metadata expressed in JSON-LD using vocabularies from Schema.org,
  EVI and other public ontologies, and JSON-Schema mini-data-dictionary descriptions for datasets and
  data elements.
