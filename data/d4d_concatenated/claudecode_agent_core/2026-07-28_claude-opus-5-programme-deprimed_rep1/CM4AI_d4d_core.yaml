    Location "University of California San Diego; University of California San Francisco; Stanford University;
    University of Virginia"; the March 2025 record lists "University of California San Francisco" twice
    in the same field.
  - The Depositor recorded on every release is "Niestroy, Justin" (University of Virginia).
collection_timeframes:
- id: cm4ai.timeframe.project_period
  name: CM4AI project and release period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details:
  - NIH RePORTER records the project period for OT2OD032742 as Project start 2022-09-01 and Project end
    2026-08-31.
  - 'Source conflict on the project end: the Dataverse release records state under Maintenance Plan that
    the "Dataset will be regularly updated and augmented through the end of the project in November 2026",
    which is later than the NIH RePORTER project end date of 2026-08-31. Both are recorded; neither is
    preferred, because the two sources describe different things (the funded project period versus the
    maintenance commitment).'
  - Dataverse citation metadata for all four releases records Data Creation Date 2025-02-27 and Deposit
    Date 2025-02-27; these values are repeated unchanged on later release records and therefore do not
    date the contents of those later releases.
  - 'Release publication dates: 2025-03-03 (March 2025), 2025-07-01 (June 2025), 2025-10-31 (October 2025),
    2026-06-17 (June 2026, with version 2 released 2026-07-15T20:28:19Z).'
  - '"CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data streams."'
missing_data_documentation:
- id: cm4ai.missing_data.release_completeness
  name: Known gaps in the released data
  missing_data_patterns:
  - Computed cell maps are not included in any release to date.
  - Some datasets are under temporary pre-publication embargo; the external perturb-seq deposits are marked
    "Embargoed" on the October 2025 and June 2026 release records.
  - The CM4AI data-releases page lists, for the iPSC-derived curated datasets, "IF images (coming soon!)"
    and, for the TNBC curated datasets, "AP-MS interactomes (coming soon!)"; the June 2026 release does
    include AP-MS archives for treated MDA-MB-468 cells, so the website text is older than that release.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturbSeq data
    interrogate sets of proteins which incompletely overlap.
  - The June 2026 Dataverse file listing carries no per-file descriptions, unlike the March, June and
    October 2025 listings.
  missing_data_causes:
  - Temporary pre-publication embargo on some datasets.
  - 'The programme is mid-course: "These data are not yet in completed final form" and data "will be augmented
    regularly through the end of the project".'
  handling_strategy: 'Quarterly augmentation: "Dataset will be regularly updated and augmented through
    the end of the project in November 2026", with "Updates on a quarterly basis".'
