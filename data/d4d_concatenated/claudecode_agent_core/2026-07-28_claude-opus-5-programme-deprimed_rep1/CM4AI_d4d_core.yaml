purposes:
- id: cm4ai.purpose.ai_ready_cell_maps
  name: Deliver AI-ready machine-readable maps of cell architecture
  response: '"Cell Maps for Artificial Intelligence (CM4AI) will deliver machine-readable hierarchical
    maps of cell architecture as AI-ready data, together with quarterly data releases of map-input data
    streams." CM4AI''s objective is "to deliver machine-readable hierarchical maps of cell architecture
    as AI-Ready data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant cell lines
    under perturbed and unperturbed conditions."'
- id: cm4ai.purpose.interpretable_genotype_phenotype
  name: Support interpretable genotype-phenotype learning
  response: '"The CM4AI data generation project seeks to map the spatiotemporal architecture of human
    cells and use these maps toward the grand challenge of interpretable genotype-phenotype learning."
    Machine learning models in genomics and precision medicine "are often ''black boxes,'' predicting
    phenotypes from genotypes without understanding the mechanisms by which such translation occurs";
    the project generates "a resource of matched data and tools to enable the creation of ''visible''
    ML systems, which are not black boxes but are built directly on knowledge maps of cell and tissue
    architecture."'
- id: cm4ai.purpose.ethical_ai_ready_data
  name: Produce ethical, FAIR, AI-ready biomedical data
  response: CM4AI's "overarching mission is to produce ethical, AI-ready datasets of cell architecture,
    inferred from multimodal data collected for human cell lines, to enable transformative biomedical
    AI research." The project defines AI-Ready biomedical data as "fully characterized FAIR data of known
    provenance, which can be ethically and reliably processed by AI applications; whose models and software
    are available and well-described for validation and re-use; and whose predictions may be fully explained
    and interpreted to the user as needed", with criteria FAIR, Provenanced, Characterized, Explainable
    and Ethical.
- id: cm4ai.purpose.standards_and_workforce
  name: Establish FAIR standards, ethics and workforce development
  response: Beyond data and tools, the project "will implement a standards data management approach based
    on FAIR access and software principles, with deep provenance and replication packages for representation
    of cell maps and their underlying datasets; initiate a research program in ethical AI, especially
    as it relates to how maps will be used in genomic medicine and model interpretation; and stimulate
    a diverse portfolio of training opportunities in the emerging field of biomachine learning."
tasks:
- id: cm4ai.task.multimodal_integration
  name: Integrate multimodal data streams into hierarchical cell maps
  response: Input data streams "are integrated via the multi-scale integrated cell (MuSIC) software pipeline
    employing deep learning models and community detection algorithms". Cell maps are "hierarchical directed
    acyclic graphs (DAG), where each node represents an assembly of proteins in proximity at a given scale,
    spanning from large assemblies representing cell compartments (e.g. nucleus, mitochondria) to small
    assemblies of proteins in close proximity (e.g. protein complexes or subunits)."
- id: cm4ai.task.ai_model_training
  name: AI model training on AI-ready datasets
  response: The release records state the data are intended for "AI-ready datasets to support research
    in functional genomics" and "AI model training".
- id: cm4ai.task.cellular_process_analysis
  name: Cellular process analysis
  response: The release records state the data are intended for "Cellular process analysis" and for study
    of "Cell architectural changes and interactions in presence of specific disease processes, treatment
    conditions, or genetic perturbations".
- id: cm4ai.task.visible_neural_networks
  name: Visible machine learning and variant interpretation
  response: '"Cell maps provide a foundation for downstream applications in human genomics, including
    interpretation of genetic variants and mutations. As an example, they have been used in AI tools for
    ''visible machine learning'' or ''visible neural networks'' (VNNs) to interrogate how protein assemblies
    in the cell affect cell-level phenotype predictions."'
addressing_gaps:
- id: cm4ai.gap.black_box_models
  name: Uninterpretable "black box" genotype-phenotype models
  response: '"Machine learning (ML) models show great promise in analyzing the human genome to make predictions,
    but the inner workings of these models are typically difficult-to-interpret ''black boxes.'' To address
    this challenge, this Bridge2AI data generation project will generate a resource of matched data and
    tools to enable the creation of ''visible'' ML systems, which are not black boxes but are built directly
    on knowledge maps of cell and tissue architecture."'
- id: cm4ai.gap.uncharted_cell_architecture
  name: Much of subcellular architecture remains uncharted
  response: '"Human cells consist of a complex hierarchy of components, many of which remain unexplored...
    As much of cell structure still remains uncharted, there has been long-standing interest in strategies
    to map this architecture systematically." (Stated in the CM4AI-authored Nature 2025 study of a U2OS
    cell map, which motivates the mapping approach used by the programme.)'
- id: cm4ai.gap.single_modality_maps
  name: Complementary mapping modalities have typically been applied separately
  response: '"Although these cell mapping technologies have typically been applied separately, integration
    of multiple complementary data modalities provides the opportunity to incorporate biological structure
    robustly across physical scales." The programme therefore generates matched AP-MS/SEC-MS interaction
    data, immunofluorescence imaging and CRISPR perturbation data on the same cell systems.'
