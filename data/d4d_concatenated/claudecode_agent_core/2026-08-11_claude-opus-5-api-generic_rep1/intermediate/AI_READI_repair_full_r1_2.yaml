id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship dataset generated by the Artificial Intelligence Ready and
  Equitable/Exploratory Atlas for Diabetes Insights (AI-READI) project, one of four Data Generation
  Projects funded under the NIH Common Fund Bridge2AI program. The dataset contains multimodal data
  collected from 2,280 participants aged 40 and older, with and without type 2 diabetes mellitus
  (T2DM), harmonised across three US data collection sites: the University of Alabama at Birmingham,
  the University of California San Diego, and the University of Washington. Data were collected
  between 19 July 2023 and 1 May 2025 under a cross-sectional, hypothesis-agnostic protocol
  administered in a single visit of roughly 2.5 to 4 hours, followed by a 10-day at-home monitoring
  period.

  Modalities include self-report questionnaires (depression screening, diabetes distress and
  self-care, diet, smoking, alcohol/vaping/marijuana use, general health, social determinants of
  health, ophthalmic history, current medications), physical measurements and vitals, a 12-lead
  electrocardiogram, monofilament testing for peripheral neuropathy, Montreal Cognitive Assessment,
  photopic and mesopic visual acuity and contrast sensitivity, autorefraction, retinal photography
  (colour fundus, fundus autofluorescence, near-infrared reflectance), optical coherence tomography,
  optical coherence tomography angiography, fluorescence lifetime imaging ophthalmoscopy, clinical
  laboratory results from non-fasting blood and urine samples, continuous glucose monitoring,
  wearable activity monitoring, and indoor environmental sensing.

  The dataset is distributed through the FAIRhub platform as 356,343 files totalling approximately
  3.82 TB, organised according to the Clinical Dataset Structure (CDS) v0.1.1 specification with one
  top-level directory per data type, then modality, then device, then participant. The publicly
  distributed version carries no protected health information under the HIPAA Safe Harbor method;
  sex, race/ethnicity and medication information have also been withheld from it. A separate
  controlled-access release is described in the project documentation as containing 5-digit ZIP
  code, sex, race, ethnicity, genetic sequencing data, past health records, medications, and traffic
  and accident reports.

  The project's stated scientific aim is to enable AI/ML research into salutogenesis in T2DM, that
  is, the pathway from disease back to health, using a cohort deliberately balanced across
  race/ethnicity, biological sex and diabetes severity rather than mirroring the demographic
  distribution of the US population.
