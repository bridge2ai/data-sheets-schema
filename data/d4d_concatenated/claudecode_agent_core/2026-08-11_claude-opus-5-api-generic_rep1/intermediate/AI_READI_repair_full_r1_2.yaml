source_caveats: >-
  The bundle contains several unreconciled discrepancies about the project's institutional home and
  scale, and this record does not resolve them: where a slot could carry only one value, the value
  chosen is recorded here together with the competing evidence. The FAIRhub structured metadata
  names "Washington University in St. Louis" (ROR 01yc7t268) as both managing organization and lead
  sponsor, and gives that affiliation for the principal investigator Aaron Lee and for Cecilia Lee;
  every other source in the bundle (NIH RePORTER project 10471118, the BMJ Open protocol, the Nature
  Metabolism comment, the UW IRB application, and the location list within the same FAIRhub record)
  places Aaron Lee, Cecilia Lee and the coordinating IRB at the University of Washington (ROR
  00cvxb145). The creator entries below carry both affiliations rather than selecting one. Target
  enrolment is given as 4,000 in the BMJ Open protocol, the Nature Metabolism comment, the NIH
  RePORTER abstract and the FAIRhub study description, but as 4,600 in the UW IRB application form.
  The project acronym is expanded as "Artificial Intelligence Ready and Equitable Atlas for Diabetes
  Insights" in the BMJ Open and Nature Metabolism publications and as "Artificial Intelligence Ready
  and Exploratory Atlas for Diabetes Insights" in the NIH RePORTER record, the FAIRhub study
  description and the README. The sum of the per-directory file counts reported in the FAIRhub
  structure description is 356,334, nine fewer than the stated dataset total of 356,343; the
  difference is consistent with the nine root-level metadata files listed separately, but the
  sources do not state this. The bundle supplies no identifiers for individual splits or data-type
  directories; the fragment identifiers used on the subsets and file_collections entries below are
  constructed for this record and are not transcribed from any source. Creator affiliations and
  funder grant numbers are recorded in the notes of the relevant entries, because the structured
  slots for them require identifiers that the sources do not supply.

