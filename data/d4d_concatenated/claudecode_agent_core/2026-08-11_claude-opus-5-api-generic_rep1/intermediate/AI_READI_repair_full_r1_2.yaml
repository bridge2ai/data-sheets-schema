variables:
  - variable_name: HbA1c
    data_type: float
    unit: percent
    measurement_technique: Whole blood test performed by the University of Washington Nutrition and Obesity Research Center on stored frozen samples
    notes: "Reference range provided by the testing laboratory: 4.0-6.0 percent. Included as a marker for diabetes."
  - variable_name: Glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test performed by the UW NORC laboratory
    notes: "Reference range 62-125 mg/dL. Included as a marker for diabetes. Blood was collected non-fasting."
  - variable_name: Insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test performed by the UW NORC laboratory
    notes: "Reference range 0.0-24.9 ng/mL. Included as a marker for diabetes."
  - variable_name: C peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma test performed by the UW NORC laboratory
    notes: "Reference range 1.1-4.4 ng/mL. Included as an indicator of insulin production."
  - variable_name: N-terminal pro-B-type natriuretic peptide (NT-proBNP)
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma test performed by the UW NORC laboratory
    notes: "Reference range varies by age. Included as a severity and outcome predictor of heart failure."
  - variable_name: Troponin-T
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma test performed by the UW NORC laboratory
    notes: "Reference range female <11, male <16. Included as a marker of myocardial injury."
  - variable_name: C reactive protein, high sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum test performed by the UW NORC laboratory
    notes: "Reference range 0.0-10.0 mg/L. Included as an inflammation marker and risk factor for T2DM."
  - variable_name: Creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum test performed by the UW NORC laboratory
    notes: "Reference range female 0.38-1.02, male 0.51-1.18 mg/dL. Included as a marker for kidney function."
  - variable_name: Urine albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test performed by the UW NORC laboratory
    notes: "No reference range given by the testing laboratory. Included as a urinary biomarker for early diabetic nephropathy."
  - variable_name: Urine creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Urine test performed by the UW NORC laboratory
    notes: "No reference range given by the testing laboratory. Included as a urinary biomarker for early diabetic nephropathy."
  - variable_name: Complete blood count panel (white blood cell, red blood cell, haemoglobin, haematocrit, MCV, MCH, MCHC, RDW, platelets)
    data_type: float
    measurement_technique: >-
      Performed on fresh whole blood by a CLIA-certified clinical laboratory local to each data
      collection site, on the day of collection
    notes: >-
      Units and laboratory reference ranges respectively: white blood cell x10E3/uL 3.4-10.8; red
      blood cell x10E6/uL 3.77-5.80; haemoglobin g/dL 11.1-17.7; haematocrit percent 34.0-51.0; MCV
      fL 79-97; MCH pg 26.6-33.0; MCHC g/dL 31.5-35.7; RDW percent 11.6-15.4; platelets x10E3/uL
      150-450. Recorded in REDCap rather than exported from a device.
  - variable_name: Blood glucose (continuous glucose monitoring)
    data_type: float
    unit: mg/dL
    measurement_technique: Dexcom G6 continuous glucose monitor, sampled every 5 minutes over a 10-day at-home period
    notes: >-
      Participants already wearing a Dexcom G6 could either place an additional study sensor at
      least 3 inches from their own or share data from their existing device via Dexcom Clarity; the
      IRB protocol describes an option to release up to 90 days of prior glucose values in addition
      to the 10-day study window, for a maximum of about 100 days.
  - variable_name: Montreal Cognitive Assessment (MoCA) total score
    data_type: integer
    measurement_technique: MoCA Duo application administered electronically on an iPad by trained research staff
    minimum_value: 0
    maximum_value: 30
    notes: >-
      Maximum possible score 30, higher scores indicating better performance; scores of 26 and above
      are described as normal and below 24 as a sign of cognitive impairment. Section subscores,
      Memory Index Score and task completion times were also exported (.csv).
  - variable_name: Best-corrected photopic visual acuity (logMAR)
    data_type: float
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres, right and left eyes tested
      separately under best-corrected conditions
    notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate better
      resolution. The healthsheet records that Snellen visual acuity variables present in version
      2.0.0 were dropped in version 3.0.0, leaving only logMAR measurements.
  - variable_name: Mesopic visual acuity (logMAR)
    data_type: float
    measurement_technique: >-
      As for photopic acuity but with the participant viewing the display through a 2.0 neutral
      density filter to reduce the test to a mesopic light level
  - variable_name: Letter contrast sensitivity (log CS), photopic and mesopic
    data_type: float
    measurement_technique: >-
      Mars Letter Contrast Sensitivity chart (Mars Perceptrix) read monocularly at a designed
      viewing distance of 50 cm (range 40-59 cm), undilated, with chart background luminance 60-120
      cd/m2 (optimum 85) and illuminance 189-377 lux (optimum 267); mesopic testing used a neutral
      density occluder
    derivation: >-
      Log CS was recorded by multiplying the number of errors before the final correct letter by
      0.04 and subtracting that from the log CS value at the final correct letter.
    notes: >-
      Expressed as log sensitivity, higher numbers meaning better sensitivity. Testing terminated
      after two consecutive errors or at the end of the chart. Standard order: photopic OD, photopic
      OS, mesopic OD, mesopic OS.
  - variable_name: Autorefraction (spherical and cylindrical components, cylindrical axis)
    data_type: float
    unit: diopter
    measurement_technique: Topcon KR 800 auto keratometer/refractor, standard protocol, both eyes
  - variable_name: Monofilament peripheral neuropathy test result
    data_type: categorical
    measurement_technique: >-
      10 g monofilament applied to three locations on the plantar surface of each foot, ten times
      per location, with the participant's eyes closed and shoes and socks removed
    categories:
      - sensate
      - insensate
    notes: >-
      Participants respond yes or no to feeling the filament; insensate areas are retested for
      confirmation and the sequence repeated randomly at each testing site on each foot until
      results are obtained. Results recorded directly into REDCap.
  - variable_name: Systolic blood pressure
    data_type: float
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric medically approved device, measured twice separated by 2 minutes.
      Devices in use across sites were the OMRON HEM 907XL, the Medline MDS4001 and the Welch Allyn
      6000 series vital signs monitor with FlexiPort reusable cuff.
    notes: >-
      Coordinators refer participants for emergency care for readings over 180 mm Hg or under 100 mm
      Hg accompanied by symptoms of haemodynamic instability.
  - variable_name: Diastolic blood pressure
    data_type: float
    unit: mm Hg
    measurement_technique: As for systolic blood pressure
    notes: >-
      Emergency referral thresholds are greater than 120 mm Hg or less than 60 mm Hg with symptoms
      of haemodynamic instability.
  - variable_name: Heart rate
    data_type: float
    unit: beats per minute
    measurement_technique: >-
      Read from the automatic blood pressure device and from the 12-lead ECG; also captured
      continuously by the Garmin Vivosmart 5 during the 10-day at-home period
    notes: >-
      Emergency referral thresholds are greater than 100 bpm or less than 60 bpm if not known to be
      usual for the participant and accompanied by symptoms of haemodynamic instability.
  - variable_name: Body mass index and waist-hip ratio
    data_type: float
    measurement_technique: >-
      Calculated from measured height, weight, and waist and hip circumference taken at the in-person
      visit
    derivation: >-
      Waist-hip ratio and body mass index are calculated from the directly measured height, weight,
      waist circumference and hip circumference.
  - variable_name: Number of steps
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 physical activity monitor over the 10-day at-home period
  - variable_name: Oxygen saturation (SpO2)
    data_type: float
    unit: percent
    measurement_technique: Garmin Vivosmart 5 over the 10-day at-home period
  - variable_name: Sleep duration and sleep phases
    data_type: float
    measurement_technique: Garmin Vivosmart 5 over the 10-day at-home period
    notes: Described in the protocol as capturing circadian and diurnal rhythm.
  - variable_name: Ambient temperature
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor placed in the participant's home for 10 days
  - variable_name: Relative humidity
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor
  - variable_name: Nitrogen oxides (NO and NO2)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor, Sensirion SEN5x sensing element with NOx Index
  - variable_name: Particulate matter (PM1.0, PM2.5, PM4, PM10)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor
  - variable_name: Volatile organic compounds
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor
  - variable_name: Multi-spectral light intensity (11 channels)
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor, ams-OSRAM AS7431 spectral sensor
  - variable_name: Race and ethnicity (self-reported)
    data_type: categorical
    is_sensitive: true
    categories:
      - Asian
      - Black
      - Hispanic
      - White
    notes: >-
      Collected at screening. Withheld from the public release to prevent stigmatization of
      findings; available only in the controlled-access dataset.
  - variable_name: Biological sex
    data_type: categorical
    is_sensitive: true
    categories:
      - male
      - female
    notes: Collected at screening. Withheld from the public release; available only under controlled access.
  - variable_name: Five-digit ZIP code
    data_type: string
    is_sensitive: true
    is_identifier: true
    notes: Held under controlled access only.
  - variable_name: Current medications with RxNorm codes
    data_type: categorical
    is_sensitive: true
    measurement_technique: >-
      Self-report questionnaire covering all prescription and over-the-counter medications currently
      used, including pills, injections, creams, salves, sprays, eye drops and dermal patches;
      entries were cross-referenced against medications physically brought in or photographed by the
      participant
    notes: >-
      Coded to RxNorm. The README states medication information has been removed from the version
      3.0.0 public release; the documentation lists medications among the controlled-access
      variables.
  - variable_name: Traffic and accident reports (driving record)
    data_type: categorical
    is_sensitive: true
    measurement_technique: >-
      Obtained from the state Department of Licensing covering the three years preceding the study
      visit, per the IRB protocol
    notes: Held under controlled access only.
  - variable_name: Genetic sequencing data
    data_type: string
    is_sensitive: true
    notes: >-
      Listed among the controlled-access variables in the dataset documentation. The biorepository
      retains genomic DNA extracted from buffy coats for future studies such as whole genome
      sequencing; the bundle does not state that sequencing has been completed for the released
      cohort.

acquisition_methods:
  - acquisition_details: >-
      Acquisition varied by domain. Directly observable data include laboratory values, vitals,
      retinal imaging, electrocardiography, monofilament testing, vision testing and device
      telemetry. Subject-reported data include the pre-visit questionnaires covering demographics,
      depression, diabetes distress and self-care, diet, smoking, alcohol, vaping and marijuana use,
      general health, social determinants of health, and vision and eye care access.
    was_directly_observed: true
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
    notes: >-
      Verification of data entry was performed where possible, for example by cross-referencing
      entered medications against medications physically brought in or photographed by each
      participant.

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used to collect patient-reported questionnaire data and the following clinical data
      from the visit: medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament test results and complete blood count results.
  - mechanism_details: >-
      Retinal imaging devices: Optomed Aurora IQ handheld non-mydriatic fundus camera (50 degree
      field of view, 5 Mpix sensor; 4 images per participant, DICOM); iCare EIDON widefield
      TrueColor confocal fundus system (up to 200 degrees; 12 images per participant, DICOM);
      Heidelberg Spectralis HRA OCT/OCTA with confocal scanning laser ophthalmoscope (6 images,
      DICOM); Topcon Maestro2 3D OCT-1 (6 images, .fda converted to DICOM); Topcon Triton DRI OCT
      swept-source, 1,050 nm light source (6 images, .fda converted to DICOM); Carl Zeiss Meditec
      Cirrus 5000 Angioplex (8 images, DICOM); Heidelberg FLIO (2 images, .sdt converted to DICOM).
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph for the 12-lead ECG, performed with the participant seated
      in a reclining chair or supine, with the chair position recorded relative to supine as 0, 30,
      60 or 90 degrees. Exported as .xml.
  - mechanism_details: >-
      At-home monitoring devices issued at the end of the in-person visit and used continuously for
      10 days: Dexcom G6 continuous glucose monitor; Garmin Vivosmart 5 fitness tracker; and a
      custom LeeLab Anura environmental sensor. Participants returned the devices by prepaid
      overnight mail or in person, together with a data sheet recording which wrist the tracker was
      worn on, the participant's dominant hand, and where in the home the environmental sensor was
      placed.
    notes: >-
      The environmental sensor and Garmin tracker were selected with participant privacy as a
      primary concern: they capture no video or audio, have no GPS location monitoring, and are not
      synced with participant-owned devices.
  - mechanism_details: >-
      Other in-visit instruments: MoCA Duo application on iPad; M&S Technologies Electronic Visual
      Acuity tester; Mars Letter Contrast Sensitivity chart; Topcon KR 800 autorefractor; NIDEK
      LM-600P, Topcon CL-200 and Topcon CL-300 lensometers; OMRON HEM 907XL, Medline MDS4001 and
      Welch Allyn 6000 series blood pressure monitors; 10 g monofilament.

data_collectors:
  - collector_details: >-
      Clinical research coordinators at the three data collection sites contacted and consented
      participants, ushered them through the visit, collected ophthalmic images, trained
      participants on the continuous glucose monitor and fitness tracker, and ensured return of
      study materials. All research personnel who recruited, enrolled and collected data underwent
      training by the data manager at UAB and worked from a detailed Manual of Procedures. A
      certification process was required of all coordinators, including mandatory institutional
      compliance training for human subject research, and each coordinator had to administer all
      protocol elements successfully to at least three volunteer practice subjects before enrolling
      participants.
  - collector_details: >-
      Data managers at each site oversaw the training and certification process and were responsible
      for quality control of all data before upload to FAIRhub.
  - collector_details: >-
      Phlebotomists collected blood; laboratory assistants processed and shipped samples. Software
      and cloud engineers, research and data scientists, and database managers handled ingestion,
      curation and release.
    notes: >-
      Study team effort was supported by NIH award OT2OD032644 in proportion to percentage of effort
      contributed, with salaries aligned to the funding guidelines at each site.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from participants at the three recruiting sites. Recruitment
      pools were identified indirectly by screening electronic health records for diabetes and
      prediabetes ICD-10 codes among patients who had had an encounter with the sites' health
      systems, but the study data themselves were generated prospectively from the participants
      rather than obtained from third parties.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Version 3.0.0 covers data collected from 19 July 2023 through 1 May 2025, spanning the pilot
      phase and the first two full years of the study. Preliminary pilot enrolment ran from 18 July
      2023 to 30 November 2023 to build coordinator familiarity; formal data collection began on 1
      December 2023. The overall project timeline spans four years, one year for protocol
      development and training and years two to four for recruitment and data collection.
      Enrolment began on 18 July 2023 and, per the study protocol publication, will continue until
      30 November 2026; the FAIRhub study description gives an anticipated completion date of 1
      January 2027 and an overall status of "Enrolling by invitation".
    source_caveats: >-
      The BMJ Open protocol gives the enrolment start as 18 July 2023, while the FAIRhub structured
      metadata and healthsheet give 19 July 2023 as the start of the collection period for the
      released data.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      The study base is all patients aged 40 years and older who had a medical encounter within one
      of the three health systems (UAB, UCSD, UW) between 2020 and 2025. Patients with T2DM and
      pre-diabetes were identified by screening electronic health records for ICD-10 codes E11.X and
      R73.09 respectively; patients without diabetes were those without encounters carrying those
      codes.
    why_not_representative: >-
      The cohort is deliberately not representative of the US population. Rather than targeting the
      national demographic distribution, the study recruits in equal proportions across four
      race/ethnic groups, four T2DM categories and both biological sexes, because balanced training
      sets are held to be critical for developing unbiased machine learning models. Participation is
      voluntary, introducing volunteer bias. Recruitment is predominantly urban and hospital-based
      and may not capture diverse cultural and socioeconomic backgrounds. Other racial and ethnic
      groups, including Pacific Islanders and Native Americans, are not represented. The FAIRhub
      study description records the sampling method as "Non-Probability Sample".
    representative_verification:
      - >-
        Recruitment proceeds in waves whose composition and size are influenced by the observed
        participation characteristics of race/ethnicity, gender, T2DM severity and site. Composition
        is monitored for diversity and inclusion as recruitment progresses and adjusted by under-
        and oversampling groups as needed.
    source_caveats: >-
      Healthsheet composition question 4 states that the dataset contains all possible instances,
      that is, all participants enrolled during the collection window, and preprocessing question 5
      answers "N/A" to the sampling strategy question. These answers describe the released dataset
      relative to the enrolled cohort, whereas the study design describes a non-probability,
      quota-balanced sample drawn from the health system study base.
  - strategies: >-
      For each recruitment wave a contact pool was identified by screening electronic health records
      at each site. Individuals were mailed a hardcopy invitation letter and sent an invitation
      email, both personalised with links, access codes and QR codes directing them to an online
      REDCap recruitment interface where they could read a study overview and FAQ, download the
      informed consent document, request a call back, complete a screening survey and enroll by
      signing the electronic consent. Those without internet access could call research staff for
      alternative enrolment.
    notes: >-
      Sites recruited all study groups but weighted them to local demographics: UW prioritised Asian
      then Hispanic then Black participants, UCSD Hispanic then Asian then Black, and UAB Black then
      Hispanic then Asian; all three sites recruited white participants.

raw_sources:
  - raw_data_details: >-
      Raw data, post de-identification, are saved and expected to be preserved by the AI-READI
      project at least for the duration of the project, but are not currently shared outside the
      project team, because they have not been mapped to standardized terminologies and because raw
      data may accidentally include personal health information or personally identifiable
      information, for example in free-text fields. There is a possibility that raw data may be
      included in future releases of the controlled-access dataset.

raw_data_sources:
  - source_description: >-
      Device-native exports from the imaging and monitoring instruments before conversion to
      standard formats.
    source_type: Instrument export
    raw_data_format: >-
      ECG .xml; MoCA Duo .csv; Topcon Maestro2 and Triton .fda; Heidelberg FLIO .sdt; Garmin
      Vivosmart 5 .FIT; Dexcom G6 .csv; environmental sensor .csv; Optomed, iCare EIDON, Heidelberg
      Spectralis and Zeiss Cirrus native DICOM.
    access_details: >-
      Exported to local storage at each data collection site, then transformed to standard model
      formats before upload to FAIRhub. Not released.
  - source_description: >-
      REDCap database holding participant-reported questionnaire responses and coordinator-entered
      clinical measurements.
    source_type: Electronic data capture system
    raw_data_format: REDCap records; blood and urine testing results returned by the UW NORC laboratory in .csv
    access_details: Internal to the study; released only after mapping to the OMOP Common Data Model.
  - source_description: >-
      Electronic health records at UAB, UCSD and UW, screened for ICD-10 diagnosis codes and
      demographic data to build recruitment contact pools, and reviewed for past health records,
      medications and prior imaging as part of the controlled-access data.
    source_type: Electronic health record
    access_details: >-
      Accessed under IRB approval for pre-screening and data abstraction; not released in the public
      dataset.
  - source_description: >-
      State Department of Licensing driving and accident records covering the three years preceding
      the study visit.
    source_type: Government administrative record
    access_details: Held under controlled access only.

preprocessing_strategies:
  - preprocessing_details: >-
      All data were mapped to applicable data standard formats: the Observational Medical Outcomes
      Partnership Common Data Model for clinical data, DICOM for retinal imaging, WFDB for the
      12-lead ECG, Open mHealth for continuous glucose monitoring and wearable activity data, and
      the NASA ESDS ASCII file format guidelines for environmental sensor data. Clinical data were
      mapped to standardized terminologies where possible.
  - preprocessing_details: >-
      Images that were not exported natively in DICOM were converted: Topcon Maestro2 and Triton
      .fda files and Heidelberg FLIO .sdt files were converted to DICOM for the dataset. Garmin .FIT
      files were converted to the Open mHealth standard.
  - preprocessing_details: >-
      Data were uploaded at regular intervals to FAIRhub, a Microsoft Azure cloud-based data
      management, curation and sharing platform developed for the project, and are stored and shared
      as AI-ready so that AI/ML research can proceed without further reformatting or preprocessing.
      Processing for version 1.0.0 was custom and ad hoc; from year two onward it has been a mixture
      of automated and custom pipelines.
  - preprocessing_details: >-
      Protected health information as defined by the HIPAA Privacy Rule was removed from the public
      set via the Safe Harbor method, together with information on participant sex, race/ethnicity
      and medications.
  - preprocessing_details: >-
      No instances were excluded at the time of preprocessing. Exclusions occurred only at
      recruitment, through the study eligibility criteria.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the point of data entry: clinical values outside expected minimum and
      maximum ranges were flagged in REDCap and surfaced in reports viewed by clinical research
      coordinators and data managers. Using those reports as guides, data managers and coordinators
      examined participant records and judged whether an error was likely. Data were checked for
      credibility against prespecified reasonable ranges, incorrect flow through prescribed skip
      patterns, missing data that could be filled directly from other portions of an individual's
      record, and the omission or duplication of records.
  - cleaning_details: >-
      Editing was performed only under the guidance and approval of the site principal investigator.
      Where corrected data were available elsewhere in the respondent's answers the error was
      corrected; where there was no logical or appropriate way to correct the data, the site
      principal investigator reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      The dataset was reviewed internally by AI-READI team members for quality checks and to ensure
      no personally identifiable information was accidentally included. The dataset has not undergone
      any formal external audit.
  - cleaning_details: >-
      A dqd_omop.json file is shipped with the clinical_data directory to support running the OHDSI
      OMOP CDM Data Quality Dashboard, which executes more than 3,500 data quality checks against an
      OMOP CDM instance. FAIRhub also exposes a Dataset Quality Dashboard for the release.

labeling_strategies:
  - labeling_details: >-
      No labelling or annotation was performed. The healthsheet records "N/A - no labels are
      provided" for the presence of labels, the labelling strategy, human labellers, human-level
      performance and labelling software, because the dataset is hypothesis-agnostic and aimed at
      facilitating multiple potential downstream AI/ML applications. The project has no formal
      guidelines for researchers who wish to create new labels or define new tasks.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; coverage is uneven across the nine data
      type directories. Survey data may contain skipped questions and incomplete responses.
    missing_data_causes: >-
      Participants electing not to take part in particular study elements; data collection devices
      returning no stored results or being returned too late to retrieve results, for example
      through battery failure or data loss; occasional data collisions in the processing pipeline;
      improper use or technical failure of wearables; patient uncooperation, image noise and system
      malfunction or data transfer failure in imaging; and skipped survey questions.
    handling_strategy: >-
      Missing data are left missing. Some categories of missing questionnaire data were filled at
      the cleaning stage where the value could be derived directly from another portion of the same
      individual's record, under site principal investigator approval. No imputation is described.
    notes: >-
      Certain instrument-level omissions are systematic rather than random: the FLIO scan was
      performed last in each visit because it takes longer and exposes participants to uncomfortable
      light levels, so participant compliance may be lowest for that modality; and quality issues on
      the operator-driven Heidelberg Spectralis could lead to skipping that modality altogether.

anomalies:
  - anomaly_details: >-
      Losses due to device failure: continuous glucose monitors, fitness trackers and environmental
      sensors returned with no stored results, dead batteries, or returned too late for data
      retrieval.
  - anomaly_details: >-
      Imaging noise and quality variation. Optomed Aurora images are handheld and undilated, so
      quality varies from participant to participant and within the same participant. The Heidelberg
      Spectralis is operator-driven and not fully automated, so quality issues may arise. FLIO is
      performed last in the visit under uncomfortable light exposure, so participants may not be at
      their best compliance. Patient uncooperation, obscuring noise, system malfunction and data
      transfer failures are all expected in imaging data.
  - anomaly_details: >-
      Data collisions at some point in the processing pipeline have caused loss of data for a small
      number of participants.
  - anomaly_details: >-
      Survey non-response: skipped questions and incomplete responses are expected in the
      questionnaire data.
  - anomaly_details: >-
      Marijuana use was not assessed for participants living in Alabama, because it is an illegal
      substance in that state, producing a site-dependent structural gap in the substance use
      questionnaire.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, producing volunteer bias which may limit the generalisability of
      results to people not represented in the study population.
    affected_subsets:
      - All participants
    mitigation_strategy: >-
      Recruitment in waves with monitoring of the observed participation characteristics, and
      under- and oversampling of groups as needed to maintain balance.
  - bias_type: representation_bias
    bias_description: >-
      The cohort covers four race/ethnic groups only (Asian, Black, Hispanic, white) and does not
      include other groups such as Pacific Islanders and Native Americans. Recruitment is
      predominantly urban and hospital-based and may not fully capture diverse cultural and
      socioeconomic backgrounds. The requirement that participants speak, read and understand
      English may have created challenges in recruiting Hispanic and Asian persons.
    affected_subsets:
      - Groups outside the four target race/ethnicity categories
      - non-English speakers
    mitigation_strategy: >-
      Three geographically distinct recording sites were chosen for diverse recruitment, with
      individuals from all demographic backgrounds recruited at all three. The project engaged the
      Native Biodata Consortium as a co-learning opportunity on challenges specific to American
      Indian and Alaska Native communities, and the NIH RePORTER abstract describes a planned tribal
      consultation. The IRB application notes an NIH supplement submitted to fund translation of
      study materials into Spanish.
  - bias_type: sampling_bias
    bias_description: >-
      The cohort is deliberately balanced across race/ethnicity, biological sex and T2DM severity
      rather than reflecting population prevalence, so marginal distributions in the dataset do not
      estimate population parameters. Enrolment is ongoing and the pilot and interim releases,
      including this one, may not have achieved the intended balanced distribution across groups.
    affected_subsets:
      - All strata; observed counts in v3.0.0 are unequal (for example 836 white versus 380 Hispanic participants)
    mitigation_strategy: >-
      Adaptive wave-based recruitment; a recommended train/validation/test split in which the
      validation and test sets are balanced by construction across race/ethnicity and sex.
  - bias_type: measurement_bias
    bias_description: >-
      Several instruments carry documented measurement caveats. MoCA scores may be affected by a
      person's level of education, socioeconomic factors, and the presence of depression or other
      mental health conditions, and require training to administer and score. Operator-dependent
      imaging devices introduce operator-induced variation that fully automated devices do not.
    mitigation_strategy: >-
      Coordinator certification against a Manual of Procedures with supervised practice on at least
      three volunteers; MoCA administered electronically through the MoCA Duo application to
      standardise capture; preference for automated device positioning where available.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is urban, hospital-based, English-speaking, aged 40 and older, and drawn from three
      US metropolitan areas, and excludes pregnant people, people with gestational diabetes and
      people with type 1 diabetes. It does not provide a comprehensive representation of the
      population.
    scope_impact: >-
      Models trained on this dataset may not generalise to younger adults, non-English speakers,
      rural populations, or racial and ethnic groups outside the four recruited categories.
    recommended_mitigation: >-
      Use the supplied balanced validation and test splits; validate externally before deploying to
      populations outside the recruited strata.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Version 3.0.0 covers a single cross-sectional visit per participant, collected between July
      2023 and May 2025. Longitudinal follow-up of approximately 4 to 10 percent of the cohort is
      planned for year 4 but is not present in this release.
    scope_impact: >-
      Disease trajectory questions must be addressed through cross-sectional pseudotime methods
      rather than observed within-person change.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The public release omits sex, race, ethnicity, five-digit ZIP code, medications, genetic
      sequencing data, past health records, and traffic and accident reports, all of which are held
      under controlled access.
    scope_impact: >-
      Fairness auditing, pharmacoepidemiology and geospatial analyses are not possible with the
      public release alone.
    recommended_mitigation: >-
      Apply for the controlled-access release through a data use agreement with the AI-READI
      programme.
  - limitation_type: scope_limitation
    limitation_description: >-
      The biorepository that accompanies the study holds a finite number of biospecimens available
      to share with scientists. Procedures for reviewing and prioritising written requests were still
      to be developed at the time the study protocol was published.
    scope_impact: >-
      Limits the volume of downstream assay work that can be supported on material associated with
      this cohort. The biospecimens themselves are not part of the released dataset.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels, targets or gold standards are supplied, and the project has no guidelines for
      researchers creating new labels or defining new tasks. There is also no human-level performance
      benchmark for any application the dataset is meant to address.
    scope_impact: >-
      Supervised learning applications require the user to define and validate their own labels,
      with no shared reference against which results can be compared across studies.
  - limitation_type: integration_limitation
    limitation_description: >-
      Multiple manufacturers' devices were used for the same measurement class, particularly in
      retinal imaging, where six imaging platforms with partially overlapping modalities were
      deployed. Device make, model and scan protocol were documented to support repeatability.
    scope_impact: >-
      Cross-device harmonisation is required before pooling imaging data; conversely, the multi-device
      design was chosen deliberately to enhance generalisability and reflect the diversity of
      equipment in clinical settings.

is_deidentified:
  method: >-
    HIPAA Safe Harbor screening. The public set is stripped of protected health information as
    defined by the HIPAA Privacy Rule via the Safe Harbor method, and in addition of information
    related to participant sex and race/ethnicity, to prevent stigmatization of findings, and of
    medication information. Dates were not shifted and neither nonarrative-text redaction nor
    k-anonymity was applied.
  deidentification_details: >-
    The FAIRhub structured metadata records the de-identification type as "NoDeIdentification" with
    deIdentDirect and deIdentHIPAA set true and deIdentDates, deIdentNonarr and deIdentKAnon set
    false, and explains that no identifiers were collected so no active de-identification was
    necessary, but that the team checked that no data identifiable under US HIPAA were present. The
    healthsheet's two direct questions about de-identification measures and de-identification
    preprocessing are left blank in the source. To counter re-identification attempts, the project
    states it is implementing a robust data dissemination system, a strict licence agreement, and
    data watermarking for both the public and controlled sets.
  source_caveats: >-
    The de-identification type field reads "NoDeIdentification" while the accompanying free-text
    details and the healthsheet describe HIPAA Safe Harbor screening plus removal of demographic and
    medication fields. Because the bundle is ambiguous on whether identifiers were present and
    removed or never collected, no boolean is asserted for identifiable_elements_present.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public release is stated not to contain sensitive data. The healthsheet answers that the
      public dataset will not contain data considered sensitive, and that no personally identifiable
      information is included.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled-access release contains five-digit ZIP code, sex, race, ethnicity, genetic
      sequencing data, past health records, medications, and traffic and accident reports. Racial and
      ethnic origin, geographic location and motor vehicle accident reports are named explicitly in
      the healthsheet as the sensitive elements held under controlled access.
    notes: >-
      This entry describes the controlled-access tier of the release, not the publicly downloadable
      set described in the preceding entry.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential, such as data protected by legal privilege or doctor-patient confidentiality or
      the content of individuals' non-public communications, and that no personally identifiable
      information is included in the dataset.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      Approved by the Institutional Review Board of the University of Washington, approval number
      STUDY00016228, with initial approval received on 20 December 2022 and an annual renewal
      application due within 90 days of expiration. Reliance agreements are in place with the IRBs
      of the University of Alabama at Birmingham and the University of California San Diego.
  ethics_review_board: University of Washington Human Subjects Division / Institutional Review Board
  regulatory_compliance: >-
    Registered on ClinicalTrials.gov as NCT06002048. The FAIRhub oversight module records the study
    as not FDA-regulated for either drug or device, with human subject review status "Submitted,
    approved" and no Data Monitoring Committee. Licensees must comply with NIH Genomic Data Sharing
    Policy security best practices. The study is an observational cohort study with a
    cross-sectional time perspective.
  special_populations: >-
    No protected or vulnerable populations are purposefully included. Participants are adults aged
    40 years and older; no minors are enrolled. Pregnancy, gestational diabetes and type 1 diabetes
    are exclusionary, and the FAIRhub eligibility module excludes adults older than 85 years, so
    pregnant people and children are excluded rather than protected within the cohort.
  source_caveats: >-
    The BMJ Open abstract labels STUDY00016228 a "Clinicaltrials.org approval number", whereas the
    body of the same paper and the IRB documentation identify it as the University of Washington IRB
    approval number, with NCT06002048 as the separate ClinicalTrials.gov registration.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      Approval number STUDY00016228, initial approval 20 December 2022; the initial approval letter
      is published with the dataset documentation. Reliance agreements cover the UAB and UCSD IRBs.
      Written informed consent is provided by all participants. Annual renewal reporting on study
      status and progress is required.
    contact_person: Human Subjects Division, University of Washington (hsdinfo@uw.edu)
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      A Community Advisory Board of 11 persons drawn from the three sites, including diversity in
      race and ethnicity as represented in the AI-READI sample, contributes to development of the
      protocol. The IRB application records that the board evaluates consent forms and research
      protocols and that its feedback is considered in protocol modifications; it was board feedback
      that led the team to conclude that enrolling non-English speakers would require translating
      all study materials, not only the consent form.
  - reviewing_organization: AI-READI project bioethicists and the ethical, legal and social implications team
    review_details: >-
      The project states that ethical, legal and social implications are considered at every stage
      of the project cycle, and that the establishment of standards and best practices for
      collection, preparation and sharing includes guidance from bioethicists. The team reviewed
      existing documentation approaches including datasheets and healthsheets to identify the most
      suitable for biomedical data.
  - reviewing_organization: UCSD Health Data Oversight Committee
    review_details: >-
      Oversees data sharing with other institutions; approval for sharing research data with
      another non-profit academic institution is described as a straightforward expedited process
      contingent on IRB approval.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically before the visit or in person at the
      start of the visit. The FAIRhub dataset consent metadata classes the consent as
      "ConsentSpecifiedNotElsewhereCategorised".
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington, is
      published with the dataset documentation. The other clinical sites operated under IRB reliance
      and used the same form with minor institution-specific language, including the California Bill
      of Rights required by the State of California for the UCSD site. Electronic consent was
      administered through REDCap; upon signing, the signed form was automatically emailed to the
      participant, who could request additional copies from the study coordinator at any time during
      the study.
    consent_scope: >-
      Informed consent was required before participation in any part of the protocol, including the
      questionnaires. The consent covers open-source release of the resulting data and the sending
      of biospecimens to the study sample repository for use in future research. The public version
      of the dataset may be used only for type 2 diabetes related research; a private version allows
      more generic use.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      Any data that had been shared or used up to that point would remain in the dataset. This
      limitation is stated in the consent document.
    notes: >-
      Potential participants could read all consent documentation electronically before their visit
      and sign with an electronic signature without any verbal communication with a coordinator, or
      could decline or request more information at that point. Participants who did not consent
      electronically were consented in person at the start of the visit, followed by completion of
      all questionnaires.

collection_consents:
  - consent_details: >-
      Consent was requested through the REDCap e-consent interface reached from a personalised link,
      access code or QR code in the mailed invitation letter or invitation email, or in person at
      the start of the visit. Study questionnaires other than the screening survey were not made
      available until consent had been given. Participants were encouraged to call, email or set up
      a video meeting with study staff before deciding, and study staff would read the consent form
      aloud for participants who had difficulty viewing it.

collection_notifications:
  - notification_details: >-
      Each individual was aware of the data collection, since this was active prospective collection
      directly from participants rather than passive collection or secondary use of existing data.
      Notification took the form of a personalised hardcopy invitation letter and invitation email
      stating how the recipient's contact information was obtained, followed by an online overview of
      the research programme, expectations for participation and frequently asked questions in the
      REDCap recruitment interface, with the option of a call back from study staff. Over the
      recruitment period approximately 50,000 invitation letters per site were planned to be sent by
      both mail and email.

consent_revocations:
  - revocation_details: >-
      Participants may withdraw consent at any time and cease study participation. Data already
      shared or used at the point of withdrawal remain in the dataset; this is stated explicitly in
      the consent document. The bundle does not describe a mechanism for withdrawing data from a
      published dataset version after release.

participant_privacy:
  - anonymization_method: >-
      HIPAA Safe Harbor removal of protected health information from the public set, plus removal of
      sex, race/ethnicity and medication information. Participant directories in the released
      dataset are named by study participant ID number.
    privacy_techniques: >-
      Tiered release with a public set and a controlled-access set; login through a verified ID
      system; self-attestation to disease-specific use; a strict custom licence with
      re-identification prohibitions and secondary-sharing restrictions; and data watermarking for
      both the public and controlled sets. Devices sent home with participants were selected so as
      not to capture video or audio, not to carry GPS location monitoring, and not to sync with
      participant-owned devices.
    reidentification_risk: >-
      Described as theoretical rather than anticipated. The healthsheet states that no uses resulting
      in unfair treatment or harm are currently anticipated but acknowledges a theoretical risk of
      future re-identification. The project notes that AI algorithms can infer individual patient
      characteristics and could facilitate individual-level identification.
    data_linkage: >-
      Data across modalities are linked within the dataset by participant ID. Linkage back to
      identity would require the site-held key, which is not released.

participant_compensation:
  - compensation_provided: true
    compensation_amount: USD 200 per study visit
    compensation_type: Monetary stipend, plus travel support
    compensation_rationale: >-
      Paid through the NIH grant funding for completion of the study visit. Payment was made after
      receipt of the final data and return of the study devices, typically at least two weeks after
      the visit, allowing for the 10-day home monitoring period and return shipping; payment was not
      prorated. The study covered reasonable costs for parking, public transit or rideshare fees
      related to the study visit, and transportation assistance through rideshare services was
      offered to participants who reported barriers to travelling to study visits. The same type and
      amount of compensation applies to participants invited back in year 4.
    notes: >-
      The IRB application states that subjects may incur transport costs that will not be reimbursed
      if transportation fees exceed USD 25.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted. The healthsheet answers "No" to whether
      an analysis of the potential impact of the dataset and its use on data subjects has been
      carried out.

license: AI-READI custom license v2.0
license_and_use_terms:
  license_terms: >-
    Version 3.0.0 is released under the AI-READI custom licence v2.0
    (https://doi.org/10.5281/zenodo.17555036), described as tailored to enable reuse of the AI-READI
    dataset and other clinical datasets for commercial or research purposes while imposing strong
    requirements around data usage, security and secondary sharing to protect study participants,
    particularly where data are reused for AI and ML applications. The text of v2.0 is not
    reproduced in the available sources. The only licence text available is version 1.0, a
    University of Washington Data License Agreement published at
    https://doi.org/10.5281/zenodo.10642459 and cited by the Nature Metabolism comment and the
    version 2.0.0 FAIRhub record; its clauses are summarised in the notes below and may not
    correspond to v2.0 in every particular. FAIRhub labels the applicable licence a "Health Data
    License".
  data_use_permission: disease_specific_research
  contact_person: >-
    Aaron Lee, MD, central contact, contact@aireadi.org; project contact form at
    https://aireadi.org/contact
  notes: >-
    Clauses of the superseded version 1.0 licence text, provided for reference: a non-exclusive,
    non-transferable licence to download, reproduce and use the data and create derivative works for
    research and commercial purposes; a prohibition on conveying any portion of the data or
    derivative works to third parties other than other licensees under identical terms; permission
    to distribute models, algorithms and programs trained on the data provided they do not contain
    the data and reasonable efforts have been made to minimise memorization or reconstruction; a
    prohibition on clinical treatment decisions and on any re-identification or contact of data
    subjects; a requirement to acknowledge the source and funder in publications; a requirement to
    comply with NIH Genomic Data Sharing Policy security best practices; automatic termination on
    breach requiring deletion of all copies; reservation of title and all intellectual property to
    the Licensor; disclaimer of all warranties; a cap on aggregate liability of one US dollar except
    for death or personal injury caused by Licensor negligence where law prohibits limitation; and
    an indemnity from the licensee to the Licensor against claims arising from the licensee's use of
    the data or activity of a model.
  source_caveats: >-
    The chosen data_use_permission value describes the public tier only, where access requires
    self-attestation that the data will be used solely for type 2 diabetes related research. The
    same licence permits commercial use, and the controlled-access tier under a data use agreement
    is described as allowing more generic use; no single enum value represents both tiers.

ip_restrictions:
  restrictions:
    - >-
      Title to the data, and all industrial and intellectual property rights in it, remain solely
      and exclusively with the Licensor (University of Washington) and its suppliers; the licensee
      must take no action inconsistent with that ownership, and all rights not expressly granted are
      reserved. The healthsheet records that no third parties have imposed additional IP-based
      restrictions beyond the licence itself. The dataset documentation is separately shared under
      CC-BY 4.0. There are no plans by the data-collecting researchers to develop commercial
      products or file patents, but the dataset is made available with a commercial-friendly licence
      and downstream products or patents may arise.

regulatory_restrictions:
  regulatory_restrictions:
    - >-
      The healthsheet answers the export control and regulatory restriction question by referring to
      the licence. Licensees must comply with all data security and privacy standards established by
      the NIH under its Genomic Data Sharing Policy, currently the NIH Security Best Practices for
      Controlled-Access Data Subject to the NIH GDS Policy, and with all applicable laws,
      regulations and restrictions relating to distribution and use of the data and of models built
      from it.
  other_compliance: >-
    Access requires login through a verified ID system, self-attestation that the data will be used
    only for type 2 diabetes related research, and agreement to the licence terms. The full dataset,
    including the controlled-access elements, is available only by entering into a data use
    agreement; institutions must complete legal and privacy use agreements with the AI-READI research
    programme. Requirements for controlled-access datasets were being developed by a Data Access
    Committee at the time the study protocol was published. Protected health information was removed
    from the public set under the HIPAA Privacy Rule Safe Harbor method, and the project states that
    it verified no HIPAA-identifiable data were present.
  governance_committee_contact: contact@aireadi.org
  source_caveats: >-
    No source in the bundle assigns a confidentiality level to the dataset or makes a formal HIPAA
    compliance determination of it, so confidentiality_level and hipaa_compliant are left unset
    rather than inferred from the tiered access arrangement and the Safe Harbor screening.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed and available for public use through FAIRhub. Under the licence,
      onward conveyance of the data or derivative works by a licensee to a third party is permitted
      only where that third party is itself a licensee bound by an identical agreement with the
      Licensor, in which case access may be given to that other licensee and its employees, agents
      and contractors for the purpose of collaborating on projects involving the data.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the retinal_photography, retinal_oct, retinal_octa and retinal_flio directories.
  - format: CSV
    media_type: text/csv
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the clinical_data directory (one file per OMOP CDM table), the environment directory,
      and the Open mHealth wearable and continuous glucose monitoring payloads.
  - format: JSON
    media_type: application/json
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the root-level CDS metadata files (dataset_description.json,
      dataset_structure_description.json, participants.json, study_description.json) and the
      clinical_data quality file dqd_omop.json.
  - format: Markdown
    media_type: text/markdown
    access_urls:
      - https://fairhub.io/datasets/3
    notes: Used for the root-level README.md, CHANGELOG.md and healthsheet.md files.
  - format: TSV
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the per-directory manifest.tsv files and the root-level participants.tsv, which
      carries the recommended split assignment. Not listed among the four media types in the FAIRhub
      format field, but present throughout the structure description.
  - format: WFDB signal files
    access_urls:
      - https://fairhub.io/datasets/3
    notes: >-
      Used for the cardiac_ecg directory. Not listed among the four media types in the FAIRhub
      format field, but named as the governing standard for that directory.

distribution_dates:
  - release_dates:
      - '2024-05-03'
      - '2024-11-08'
      - '2025-11-17'
    notes: >-
      The three dates correspond respectively to version 1.0.0 (DOI 10.60775/fairhub.1, pilot data
      collection phase, 204 participants), version 2.0.0 (DOI 10.60775/fairhub.2, 1,067
      participants, subsequently marked no longer accessible) and version 3.0.0 (DOI
      10.60775/fairhub.3, 2,280 participants, the subject of this record). The BMJ Open protocol
      states that the publicly accessible dataset from pilot data collection was made available in
      May 2024, that a subsequent version including all data collected through 31 July 2024 was
      planned for November 2024, and that de-identified data are released approximately yearly in
      two sets, a controlled-access set and a publicly accessible set with fewer requirements for
      access.

