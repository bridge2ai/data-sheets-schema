maintainers:
  - maintainer_details: >-
      The AI-READI team supports and maintains the dataset. It is hosted on FAIRhub, running on
      Microsoft Azure. The healthsheet directs contact enquiries to the README file included with
      the dataset; the README in turn refers users to https://aireadi.org/contact and to the
      study_description.json and dataset_description.json metadata files for contact person, authors
      and contributors. The FAIRhub central contact of record is Aaron Lee, MD, at
      contact@aireadi.org.
    role: academic_institution

updates:
  frequency: Approximately annually
  update_details: >-
    Released versions are static and are not updated in place. New versions are released
    approximately once a year with additional data from participants enrolled since the previous
    release. Enrolment is ongoing and further versions are expected. Changes between versions are
    detailed in the CHANGELOG file included with the dataset and visible at docs.aireadi.org. The
    documented change history records 204 participants in v1.0.0 (pilot, custom and ad hoc
    processing), 863 additional participants in the year-two data folded into v2.0.0, 1,213
    additional participants in the year-three data folded into v3.0.0, and automated plus custom
    processing from year two onwards; three additional imaging devices were added in the year-three
    data. Version 3.0.0 also introduced a recommended train/validation/test split and dropped the
    Snellen visual acuity variables in favour of logMAR only.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - Version 1.0.0 (DOI 10.60775/fairhub.1, 3 May 2024)
    - Version 2.0.0 (DOI 10.60775/fairhub.2, 8 November 2024, marked no longer accessible)
    - Version 3.0.0 (DOI 10.60775/fairhub.3, 17 November 2025, current)
  version_details: >-
    All three released versions carry their own DOI and remain listed on FAIRhub. Version 2.0.0 is
    marked on FAIRhub as no longer accessible, with users referred to the latest version, and the v2
    documentation carries the same notice. Documentation for each version remains published at
    docs.aireadi.org and is selectable from a version dropdown. A healthsheet exists for each
    version: https://docs.aireadi.org/docs/1/dataset/healthsheet and
    https://docs.aireadi.org/docs/2/dataset/healthsheet.
  source_caveats: >-
    The maintenance section of the healthsheet answers "N/A" to whether older versions will continue
    to be supported, on the grounds that versions are not updated but superseded; the FAIRhub
    interface nevertheless marks v2.0.0 as inaccessible while continuing to list its DOI.

retention_limit:
  retention_period: Indefinite
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants
    were not told that their data would be retained for a fixed period and then deleted. Raw data
    are saved and expected to be preserved by the project at least for the duration of the project.
    Biobanked derivatives are stored at UAB at either minus 80 degrees Celsius or, for peripheral
    blood mononuclear cells, cryogenic temperatures, in small aliquots to facilitate future approved
    research tests.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those involved in the project. The project does, however, publish its blueprint, guidelines and
    tooling openly through its Zenodo community and GitHub organization, and anticipates making the
    FAIRhub platform available to future Data Generation Projects wishing to manage and share
    AI-ready clinical research datasets after testing it on the AI-READI dataset.
  contribution_url: https://github.com/AI-READI

notes: >-
  Two aspects of the AI-READI programme are documented in the source material but describe resources
  and activities outside the released dataset, and are recorded here rather than in slots describing
  the dataset itself.

  First, a biorepository at the UAB Center for Clinical and Translational Science holds plasma,
  serum, buffy coats, genomic DNA, PAXgene stabilised RNA and peripheral blood mononuclear cells
  collected from participants at all three sites. Approximately 53 mL of blood plus a urine specimen
  is drawn per participant, with local processing on the day of collection to standardised operating
  procedures, quarterly batch shipment of assay samples on dry ice to the UW Nutrition and Obesity
  Research Center, and overnight shipment of CPT and PAXgene tubes from UW and UCSD to UAB. Because
  PBMC isolation and cryopreservation are centralised at UAB, samples from UW and UCSD participants
  carry an additional time variable before processing relative to UAB-collected samples; local
  pre-centrifugation of CPT tubes and the 72-hour stability window of PAXgene tubes are the stated
  mitigations. These specimens are intended for future proteomics, metabolomics, genomics, gene
  expression and immunological studies including generation of induced pluripotent stem cells, and
  will be made available to scientists under procedures and policies described as still in
  development. No biospecimen-derived assay data form part of version 3.0.0.

  Second, the project returns selected results to participants: heart rate, blood pressure and visual
  acuity results on an exam card with lay-language interpretation before the participant leaves the
  visit; a Dexcom report of average blood glucose and Glucose Management Indicator by encrypted
  email after the 10-day monitoring period; and laboratory test results with normative values by
  HIPAA-compliant encrypted email at the time of the yearly data release. Coordinators refer
  participants for emergency care for extreme blood pressure or heart rate readings with symptoms of
  haemodynamic instability, and retinal imaging technicians are trained to detect retinal
  detachment, tumour and optic disc oedema and to trigger immediate ophthalmology or emergency
  department referral.

  Privacy protections applied to the release, beyond the de-identification recorded above: tiered
  release with a public set and a controlled-access set; login through a verified ID system;
  self-attestation to disease-specific use; a strict custom licence with re-identification
  prohibitions and secondary-sharing restrictions; and data watermarking for both the public and
  controlled sets. Devices sent home with participants were selected so as not to capture video or
  audio, not to carry GPS location monitoring, and not to sync with participant-owned devices. Data
  across modalities are linked within the dataset by participant ID; linkage back to identity would
  require the site-held key, which is not released. Re-identification risk is described as
  theoretical rather than anticipated.

  Participant compensation was USD 200 per study visit, paid through the NIH grant funding after
  receipt of the final data and return of the study devices, typically at least two weeks after the
  visit to allow for the 10-day home monitoring period and return shipping; payment was not
  prorated. The study covered reasonable costs for parking, public transit or rideshare fees related
  to the study visit, and transportation assistance through rideshare services was offered to
  participants who reported barriers to travelling to study visits. The IRB application notes that
  subjects may incur transport costs that will not be reimbursed if those fees exceed USD 25. The
  same type and amount of compensation applies to participants invited back in year 4.

  The full-record counterpart to this datasheet carries a `variables` block enumerating 39 measured
  variables with units, measurement techniques, laboratory reference ranges and sensitivity flags,
  drawn from the BMJ Open clinical laboratory and imaging device tables and the healthsheet device
  section. The core schema provides no slot for variable-level metadata, so that content is not
  represented here.