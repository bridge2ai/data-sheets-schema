conforms_to: >-
  OHDSI OMOP Common Data Model (structured EHR, with extensions for high-frequency nursing
  flowsheets); OHNLP open-source schema (tokenized clinical notes); DICOM (imaging); WFDB with
  an extended PhysioNet schema (waveform telemetry); EDF+ and Persyst (EEG).
