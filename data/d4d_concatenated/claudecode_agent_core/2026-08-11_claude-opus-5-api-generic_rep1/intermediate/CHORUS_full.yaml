raw_data_sources:
  - source_description: Electronic health record systems at 14 contributing hospitals.
    source_type: Hospital clinical information system
    raw_data_format: Site-native structured EHR extracts, subsequently mapped to OMOP
    access_details: Not publicly accessible; extracted by site data managers under CHoRUS SOPs.
  - source_description: Unstructured clinical documentation (notes) in hospital EHRs.
    source_type: Hospital clinical information system
    raw_data_format: Free text
    access_details: >-
      Retained locally at the contributing site; only OHNLP-tokenized representations are moved to
      the central enclave.
  - source_description: Picture archiving and communication systems (PACS).
    source_type: Hospital imaging archive
    raw_data_format: DICOM
    access_details: Controlled access; de-identification in process for the larger imaging cohort.
  - source_description: Bedside physiologic monitors, accessed through gateway/middleware.
    source_type: Bedside monitoring infrastructure
    raw_data_format: Waveform telemetry converted to WFDB
    access_details: Controlled access within the cloud enclave.
  - source_description: Hospital EEG databases.
    source_type: Hospital neurodiagnostic system
    raw_data_format: EDF+ and Persyst
    access_details: Controlled access; extraction in process as of August 2025.

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of structured EHR data to the OHDSI/OMOP Common Data Model, using validated
      semantic mappings that connect clinical data in various source formats to international
      standards; nursing flowsheet data uses OMOP schema extensions.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured EHR text, so that tokens rather than note text
      are transferred to the central enclave.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, including
      de-identification of imaging prior to release of the larger imaging cohort.
  - preprocessing_details: >-
      Conversion of physiologic waveforms into standard representations (WFDB for telemetry, EDF+
      and Persyst for EEG) using project waveform conversion scripts.
  - preprocessing_details: >-
      Geocoding of OMOP Location entities to attach contextual factors such as geographic distance
      to the nearest hospital and social determinants of health.

cleaning_strategies:
  - cleaning_details: >-
      Standard operating procedures for data extraction and submission undergo an internal
      validation and review process before publication in the Chorus_SOP repository.
  - cleaning_details: >-
      Characterization reports are produced for each site following data submission and returned to
      that site, supporting detection and resolution of data quality issues.
  - cleaning_details: >-
      Semantic mappings are pooled in tabular form and reviewed by clinical collaborators under a
      clinical validation SOP.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is being developed to label data with targets
      important for prediction.
    source_caveats: >-
      No annotation protocol, annotator qualifications or demographics, annotations-per-item count,
      or inter-annotator agreement measure is reported in the bundle.

machine_annotation_tools:
  - tools:
      - OHNLP toolkit
      - privacy_scan_tool
      - CTP-deid
      - DeGauss (via the UF-Geocoding repository)
      - chorus_waveform conversion scripts
    tool_descriptions:
      - Extraction and tokenization of unstructured clinical notes.
      - A privacy scan tool for medical records.
      - A de-identification component within the CHoRUS GitHub organization.
      - Open source code to geocode OMOP Location entities.
      - Waveform documentation and conversion scripts for telemetry and EEG data.
    source_caveats: >-
      Accuracy figures for these tools are not reported. The tools are automated processing,
      de-identification, and harmonization utilities rather than label-generating annotators; they
      are recorded here because the bundle names them as the automated components of dataset
      creation.

missing_data_documentation:
  - missing_data_patterns:
      - Imaging available for only a fraction of admissions while de-identification proceeds for a larger cohort.
      - EEG waveform data not yet extracted for the released cohort.
      - Clinical note text absent from the enclave, represented only by tokens.
      - Published metadata listed as planned rather than available for some modalities.
    missing_data_causes:
      - Staged, site-by-site data acquisition across 14 contributing hospitals.
      - Pending de-identification of imaging and pending extraction of EEG.
      - A deliberate policy of retaining note text at the contributing site.
    handling_strategy: >-
      Modalities are added to the enclave as extraction, de-identification, and metadata
      publication complete; contributing sites report progress through GitHub issues or a Google
      Form that updates the Standards and Data Acquisition project boards.

splits:
  - split_details: >-
      A holdout test set is sequestered from the released data and made accessible for external
      validation of models, intended to aid marketplace adoption of AI-derived models for
      implementation in acute and critical care.
    source_caveats: >-
      The bundle describes the holdout set as a project deliverable but does not state its size,
      sampling frame, current availability, or the procedure for requesting evaluation against it.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Modality coverage is incomplete: as of August 2025 roughly 1,000 images were available with
      de-identification in process, and EEG extraction had not been completed.
    scope_impact: >-
      Analyses requiring imaging or EEG can be performed on only a small subset of admissions.
    recommended_mitigation: >-
      Check current modality availability with the project before designing imaging- or
      EEG-dependent studies.
  - limitation_type: integration_limitation
    limitation_description: >-
      Clinical note text is not centralized; only OHNLP-derived tokens are available in the
      enclave, while the underlying notes remain at contributing sites.
    scope_impact: >-
      Methods requiring raw narrative text cannot be run against the centrally released data.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers admissions requiring acute and critical care (ICU, PICU, NICU) at 14
      hospitals within a network of 20 United States academic centers.
    scope_impact: >-
      Findings may not extend to non-critical care settings, to non-academic hospitals, or outside
      the United States.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data collection is retrospective, and the calendar period covered by the records is not
      documented.
    scope_impact: >-
      Users cannot determine from the available documentation whether practice-pattern changes over
      time are represented or how current the records are.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Achieving a balanced and diverse cohort is treated by the project as an open problem rather
      than an accomplished fact: patient-focused efforts are described as determining the ethical
      and legal approaches to manage privacy and bias while accounting for social determinants of
      health.
    mitigation_strategy: >-
      Federated access enabling sampling methods to ensure a balanced and diverse cohort; sampling
      designed to cover comprehensive sets of patient conditions and clinical treatment strategies;
      inclusion of social determinants of health and contextual factors such as geographic distance
      to the nearest hospital.
    source_caveats: >-
      No bias audit, fairness evaluation, or measured demographic imbalance is reported in the
      bundle; the bias entry records the project's stated concern and mitigation plan, not a
      quantified finding.
  - bias_type: selection_bias
    bias_description: >-
      Data acquisition is restricted to 14 hospitals selected from a consortium of 20 academic
      centers, and to patients whose care generated critical care records.
    source_caveats: >-
      The bundle states the composition of the acquisition network but does not characterize the
      resulting selection effects.

is_deidentified:
  method: >-
    Tokenization of unstructured EHR text with the OHNLP toolkit; de-identification of DICOM
    imaging (in process for the larger imaging cohort); privacy scanning of medical records; and
    transformation of data using approaches that limit re-identification.
  deidentification_details: >-
    De-identification is coupled with containment: clinical note text is never centralized, and
    all nine modalities are released only through a controlled-access enclave, so protection rests
    on transformation and access control together.
  source_caveats: >-
    The bundle does not enumerate which identifiers are removed, does not name the de-identification
    standard applied, and does not report a residual re-identification risk assessment.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset is composed of protected health information from critically ill patients:
      demographics, diagnoses, procedures, time-stamped medication administration, high-frequency
      nursing flowsheets, clinical notes, radiologic imaging, bedside telemetry and EEG waveforms,
      together with social determinants of health and geographic contextual factors such as
      distance to the nearest hospital. Pediatric and neonatal intensive care admissions are
      included.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Clinical note text is treated as non-releasable and remains stored locally at each
      contributing site, with only tokenized representations made available centrally. All nine
      data modalities are designated controlled access. Community-facing ethics focus groups are
      used to determine what data is appropriate for public sharing.

human_subject_research:
  involves_human_subjects: true
  special_populations:
    - Critically ill adult patients
    - Pediatric intensive care (PICU) admissions
    - Neonatal intensive care (NICU) admissions
  source_caveats: >-
    IRB approval, the identity of any ethics review board, and formal regulatory compliance
    determinations for the dataset are not stated in the bundle. HIPAA and GDPR appear only as
    topics of a training-program workshop on IRB and data compliance, not as documented
    attestations about this dataset.

ethical_reviews:
  - review_details: >-
      Ethics is one of the project's three pillars ("Ethical and Trustworthy AI"). The consortium
      performs community-facing ethics focus groups to determine what data is appropriate for
      public sharing, establishes a legal framework for collecting data at scale, analyzes the
      existing legal and regulatory landscape, and evaluates community perspectives on clinical
      care AI to increase trustworthiness of provenance and privacy. Patient-focused efforts
      determine the ethical and legal approaches used to manage privacy and bias while accounting
      for social determinants of health.
    contact_person: Ciera McCrary, Program Manager, Massachusetts General Hospital (cmccrary@mgh.havard.edu)
    source_caveats: >-
      No institutional review board approval, protocol number, or named reviewing committee is
      identified anywhere in the bundle; the contact given is the project program manager, and the
      email address is reproduced with the domain typo present in the source.

regulatory_restrictions:
  confidentiality_level: restricted
  source_caveats: >-
    The restricted designation is inferred from the uniform "Controlled" access-control marking on
    all nine data modalities and the requirement for a signed licensing agreement; no HIPAA,
    export-control, or other formal compliance status is asserted in the bundle.

license_and_use_terms:
  license_terms: >-
    Access is controlled. Prospective users complete a registration form supplying name, email, and
    institution, and must sign a licensing agreement included in the registration form before
    gaining access to the dataset. In the AIM-AHEAD Bridge2AI for Clinical Care training context, a
    ".edu" email address is required to gain access to the dataset; program administrators assist
    with access where needed, and neither requirement is a barrier to acceptance into the training
    program. Access is granted together with provisioned compute, and users are notified by email.
  contact_person: >-
    Access requests: dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  source_caveats: >-
    The MIT License stated on the chorus-ai GitHub organization applies to that software project
    (with Apache-2.0 on the Chorus_SOP repository); the bundle does not state that any open license
    applies to the clinical data itself, and the terms of the dataset licensing agreement are not
    reproduced.

distribution_formats:
  - format: >-
      OMOP Common Data Model relational tables, OHNLP tokenized note representations, DICOM
      imaging, WFDB telemetry waveforms, and EDF+/Persyst EEG.
    notes: >-
      Distribution is by controlled access within a cloud enclave (the Bridge2AI AI/ML for Clinical
      Care Collaborative Cloud, supported by dockerized container applications deployed on Azure)
      rather than by file download. OMOP and telemetry data reside in the enclave; clinical note
      text does not.

third_party_sharing:
  is_shared: true
  notes: >-
    The dataset is made available to users outside the contributing institutions under controlled
    access: registered and licensed researchers work with the data inside the cloud enclave, the
    AIM-AHEAD Bridge2AI for Clinical Care training program expands access to CHoRUS data for its
    trainees, and a sequestered holdout test set is offered for external validation of models
    developed elsewhere. The project's overarching goal is a publicly available AI-ready dataset.

intended_uses:
  - use_category: Biomedical AI/ML research in acute and critical care
    examples:
      - Building machine learning and AI-derived models to improve the care and outcomes of patients requiring critical care.
      - Characterizing critical illness, predicting complications and deterioration, and measuring treatment response.
      - External validation of models against the sequestered holdout test set.
      - Hands-on AI/ML training, including canonical Jupyter Notebooks and OHDSI/OMOP tool-stack workshops delivered on the Collaborative Cloud.
      - Development of practical clinical use cases by trainees and collaborating investigators.
    usage_notes: >-
      Downstream analytics on the mapped and assembled dataset are explicitly welcomed; interested
      collaborators are directed to contact the project.

existing_uses:
  - examples:
      - Training activities and publications within the CHoRUS project, reported as ongoing as of August 2025.
      - >-
        The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, program period
        2025-11-17 to 2026-07-31, up to 30 trainees), which expands access to CHoRUS data through
        engagement, AI training, and mentorship and has trainees apply AI/ML methods to multi-modal
        CHoRUS data on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.
      - >-
        Curriculum sessions built on the data, including machine learning basics, working with EHR
        data for research, data schemas in the clinical cloud, and ethics of AI in clinical
        practice, hosted by MGH/MGB, University of Florida, UTHealth, and Tufts.

future_use_impacts:
  - impact_details: >-
      The project anticipates that the dataset and its sequestered holdout will catalyze biomedical
      research and support patient-focused deployment of AI in acute and critical care, including
      marketplace adoption of externally validated models.
  - impact_details: >-
      The project treats privacy and bias as live risks for future use: legal and ethical research,
      community focus groups on what is appropriate to share, and transformations limiting
      re-identification are positioned as prerequisites for trustworthy downstream application.
  - impact_details: >-
      Trainees are prepared to address concerns such as privacy in the responsible application of
      AI/ML, indicating an expectation that users of the data will encounter such concerns
      directly.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The CHoRUS consortium, coordinated from Massachusetts General Hospital; Ciera McCrary serves
      as Program Manager (cmccrary@mgh.havard.edu, as printed in the source).
  - role: academic_institution
    maintainer_details: >-
      The chorus-ai GitHub organization (28 repositories, 37 followers) maintains software,
      validated semantic mappings, standard operating procedures, and project management boards;
      package versions and maintainers are tracked on a package status page compiled in the
      chorus-developer repository. Access and general inquiries are directed to dbold@emory.edu and
      jared.houghtaling@tuftsmedicine.org.

updates:
  update_details: >-
    The dataset is growing toward an anticipated final size of 100,000 patient admissions across 9
    modalities from 14 contributing hospitals. Imaging de-identification for a larger cohort and
    EEG extraction were in process as of August 2025, and published metadata is marked as planned
    for some modalities. Contributing sites supply regular status updates on their extraction and
    curation progress, submitted through the GitHub interface or a Google Form whose submissions
    trigger a script that calls the GitHub API to update the Standards Project and Data Acquisition
    Project boards.
  source_caveats: >-
    No release cadence, versioning policy, or version numbering for the dataset is stated in the
    bundle.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Contribution routes are organized by user group. Data site managers follow the Chorus_SOP
    workflow diagram and post extraction or submission problems to the Standards or Data
    Acquisition discussion spaces. Clinical collaborators contribute to semantic mapping and
    validation through the chorus-mapping repository and its clinical validation SOP. Software
    developers contribute through the documented CHoRUS packages and the chorus-developer web
    guide. Community users are directed to the public-facing webpage.

external_resources:
  - external_resources:
      - https://chorus4ai.org/
      - https://github.com/chorus-ai
      - https://www.bridge2ai.org/chorus
      - https://reporter.nih.gov/project-details/10472824
    restrictions: >-
      The project webpage and GitHub organization are openly readable; the dataset itself is not,
      and requires registration, a signed licensing agreement, and enclave access.
    source_caveats: >-
      No archival guarantee or long-term hosting commitment for these resources is stated. The
      chorus4ai.org site carried a banner indicating that the repository was under review for
      potential modification.

notes: >-
  The chorus4ai.org site displayed a site-wide banner at the time of capture reading "This
  repoitory is under review for potential modification in compliance with Administration
  directives." (spelling as in the source). This concerns the continued availability or content of
  the project's public web presence rather than any property of the data itself, and no
  explanation, scope, or date for the review is given.

source_caveats: >-
  The record draws on four sources of differing dates and purposes: an NIH RePORTER project page
  for award 1OT2OD032701-01 (fiscal year 2022), a September 2025 AIM-AHEAD training-program webinar
  deck, the chorus4ai.org project site, and a 2025-11-14 capture of the chorus-ai GitHub
  organization overview. Cohort size is reported inconsistently: the webinar states "over 45K
  unique admissions" as of August 2025, while chorus4ai.org reports 50,000 released patient
  admissions; both sit against an anticipated 100,000 admissions and an NIH abstract figure of
  "more than 100,000 critically ill patients". Imaging volume likewise differs between "1000 images
  available" (webinar, August 2025) and "7,642 admissions with Radiology Data" (site snapshot). The
  webinar's data-type table was extracted from PDF with its columns interleaved, so the mapping of
  the "Metadata" values (Yes / Planned) and of some "Published metadata schema" entries to
  individual modalities could not be reconstructed reliably; only the data-standard and
  controlled-access values, which appear inline with their row labels, have been transcribed here.
  The waveform volume is printed as "23 Tb", leaving terabyte versus terabit ambiguous, so no byte
  count has been recorded. The program manager's email address is reproduced verbatim including its
  apparent domain typo. Financial, eligibility, stipend, and travel provisions described in the
  bundle apply to training-program trainees and have deliberately not been recorded as research
  participant compensation. Consent, notification, consent revocation, data protection impact
  assessment, retention limits, errata, version history, intellectual property terms, dataset DOI,
  recommended citation, and variable-level metadata are absent from the bundle and have been left
  unpopulated.