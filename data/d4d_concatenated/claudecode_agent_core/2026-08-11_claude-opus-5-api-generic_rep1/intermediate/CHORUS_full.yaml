id: https://chorus4ai.org/
name: CHoRUS
title: >-
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset generated by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH Common Fund Bridge2AI consortium
  (award OT2OD032701, application 10472824, project period 2022-09-01 to 2026-11-30, principal
  investigator Eric S. Rosenthal, Massachusetts General Hospital). The dataset is assembled
  retrospectively from patients requiring acute and critical care and is intended to be a
  diverse, high-resolution, ethically sourced, AI-ready resource addressing the grand challenge
  of improving recovery from acute illness.

  The consortium spans 20 academic centers, of which 14 contribute as data acquisition sites,
  with more than 60 members organized into Standards, Data Acquisition, and Tooling sub-teams.
  Nine data modalities are collected: demographics, medication administration (time-stamped at
  each infusion change or dose administration), procedures, nursing flowsheets (high-frequency
  documentation), diagnoses, clinical notes (extracted and tokenized with the OHNLP toolkit),
  imaging from PACS (DICOM), bedside waveform telemetry from monitors and gateway/middleware
  (WFDB), and hospital EEG (EDF+ and Persyst). Structured elements are harmonized to the OHDSI
  OMOP Common Data Model, in places with schema extensions. Every modality is listed as
  controlled access.

  The project's public snapshot describes a currently released dataset of 50,000 patient
  admissions from ICU, PICU, and NICU settings, comprising 1.6 billion rows of EHR OMOP data,
  7,642 admissions with radiology data, and 23 Tb of waveform data, against an anticipated final
  dataset of 100,000 patient admissions across 9 modalities and 14 contributing hospitals. A
  status report presented in September 2025 described coverage, as of August 2025, of 14
  hospitals and more than 45,000 unique admissions, with OMOP and telemetry resident in the
  cloud enclave, clinical notes held locally except for tokens, roughly 1,000 images available
  while de-identification proceeded for a larger cohort, and EEG extraction still in process.

  The project is organized around three pillars: Data (standards, tool development and
  optimization, data acquisition), Ethics (ethical and trustworthy AI, including
  community-facing focus groups and analysis of the legal and regulatory landscape), and People
  (team science, skill and workforce development). Access is mediated by registration, a signed
  licensing agreement, and a controlled cloud enclave; the dataset is used for training
  activities and publications, including the AIM-AHEAD Bridge2AI for Clinical Care Training
  Program.
page: https://chorus4ai.org/
status: >-
  Active data generation project (award period 2022-09-01 to 2026-11-30); partial dataset
  released under controlled access, with additional modalities and admissions still being
  acquired as of the August 2025 status snapshot.
