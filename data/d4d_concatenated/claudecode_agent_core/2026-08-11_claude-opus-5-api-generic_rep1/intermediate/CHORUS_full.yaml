purposes:
  - response: >-
      To develop a publicly available, AI-ready critical care dataset supporting machine learning
      and artificial intelligence applications aimed at characterizing acute and critical care
      illness, predicting complications, and measuring treatment response.
  - response: >-
      To meet the need for infrastructure supporting AI/ML in critical care by acquiring,
      standardizing, tokenizing, storing, visualizing, and labeling multimodal data across a
      multi-center network.
  - response: >-
      To ensure that the methods used promote privacy, accountability, and clinical benefit,
      while cultivating a new generation of AI clinicians and scientists.
  - response: >-
      To provision a sequestered holdout test set accessible for external model validation, to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      To create ethically sourced datasets and tools around artificial intelligence and to
      establish best practices for AI in health, in collaboration with the other Bridge2AI data
      generation projects.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      Labeling data with targets important for prediction, using a visualization and annotation
      environment developed by the project.
  - response: >-
      External validation of AI/ML models against a sequestered holdout test set.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center data sets is a critical
      first step towards actionable and trustworthy AI.
  - response: >-
      The absence of a diverse, high-resolution, ethically sourced, AI-ready data set with which
      to answer the grand challenge of improving recovery from acute illness.
  - response: >-
      The lack of unified standards harmonizing multi-modal EHR, waveform, imaging, and text data
      across institutions.
  - response: >-
      The lack of appropriate contextual factors in clinical data elements, such as geographic
      distance to the nearest hospital and social determinants of health.
  - response: >-
      The absence of sequestered holdout data against which externally developed models can be
      validated prior to clinical marketplace adoption.

instances:
  - instance_type: >-
      Patient hospital admission requiring acute or critical care (ICU, PICU, and NICU
      encounters), with associated multimodal clinical records.
    counts: 50000
    missing_information: >-
      Modality coverage is uneven and still being completed: as of August 2025 imaging was limited
      to approximately 1,000 available images with de-identification in process for a larger
      cohort, EEG extraction was in process, and clinical note text was retained locally at
      contributing sites with only tokens transferred to the enclave.
    label_description: >-
      Labels are being generated with a visualization and annotation environment targeting
      outcomes important for prediction; the specific label set is not enumerated in the bundle.
    source_caveats: >-
      The count of 50,000 released patient admissions comes from chorus4ai.org; the September 2025
      webinar states that as of August 2025 the dataset covered 14 hospitals with "over 45K unique
      admissions". The anticipated final dataset is stated as 100,000 patient admissions, while
      the NIH abstract describes acquiring an AI-ready data set from "more than 100,000 critically
      ill patients".

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Care setting is identifiable: the released cohort comprises admissions from adult intensive
      care units, pediatric intensive care units (PICU), and neonatal intensive care units (NICU).
      Demographics are collected as a distinct OMOP-standardized modality, and social determinants
      of health together with contextual factors such as geographic distance to the nearest
      hospital are project deliverables.
    source_caveats: >-
      No numeric breakdown by care setting, age group, or demographic category is reported in the
      bundle; the project states an intent to use federated sampling to ensure a balanced and
      diverse cohort, but no realized distribution is given.

sampling_strategies:
  - is_sample: true
    strategies:
      - Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment strategies.
      - Federated access enabling sampling methods to ensure a balanced and diverse cohort.
      - Recruitment of 14 data acquisition hospitals from a network of 20 academic centers.
    source_caveats: >-
      Whether the released cohort is random or representative of any defined target population is
      not stated, and no representativeness verification is reported.

acquisition_methods:
  - was_directly_observed: true
    acquisition_details: >-
      Retrospective extraction of clinical data already recorded during care from hospital source
      systems: electronic health records, PACS imaging archives, bedside monitors with
      gateway/middleware for telemetry waveforms, and hospital EEG databases.
  - was_inferred_derived: true
    acquisition_details: >-
      Derived representations include tokenized forms of unstructured clinical notes produced with
      the OHNLP toolkit, and geocoded contextual attributes derived from OMOP Location entities.
  - was_validated_verified: true
    acquisition_details: >-
      Semantic mappings are pooled and clinically validated through the chorus-mapping repository
      and an associated clinical validation SOP; characterization reports are produced and
      returned to sites following their data submissions.

collection_mechanisms:
  - mechanism_details: >-
      Site-level extraction following validated standard operating procedures published on the
      Chorus_SOP documentation site, which provides an interactive workflow diagram linking
      step-by-step extraction and contribution instructions.
  - mechanism_details: >-
      The chorus-extract-upload tooling, used by contributing sites to create and upload a CHoRUS
      data extract.
  - mechanism_details: >-
      The OHNLP toolkit for extraction and tokenization of unstructured clinical notes.
  - mechanism_details: >-
      Bedside monitors with gateway/middleware for waveform telemetry capture, PACS for imaging,
      and hospital EEG databases for EEG waveforms.
  - mechanism_details: >-
      Dockerized container applications (chorus-container-apps) deployed on Azure to support
      CHoRUS services, together with internally built web applications and a cloud enclave.

data_collectors:
  - collector_details: >-
      Fourteen data acquisition hospitals, drawn from a collaboration spanning 20 academic
      centers, extract and contribute clinical data; site data managers follow the Chorus_SOP
      workflow and post issues to Standards and Data Acquisition discussion spaces.
  - collector_details: >-
      More than 60 CHoRUS consortium members across 20 institutions, organized into Standards,
      Data Acquisition, and Tooling sub-teams, with project managers tracking task and site status
      through GitHub projects and a Google Form to GitHub API status pipeline.

direct_collection:
  - collection_details: >-
      Data are obtained retrospectively from hospital source systems rather than through new
      instruments administered to participants; the project establishes a legal framework for
      collecting data at scale across contributing institutions.
    source_caveats: >-
      The bundle does not state whether any element was collected directly from patients or
      whether third-party intermediaries were involved beyond the contributing hospitals.

collection_timeframes:
  - timeframe_details: >-
      The CHoRUS award runs from 2022-09-01 to 2026-11-30. Data collection is retrospective. A
      status snapshot presented in September 2025 reported coverage as of August 2025 of 14
      hospitals and more than 45,000 unique admissions.
    source_caveats: >-
      The calendar period spanned by the retrospective clinical records themselves is not stated
      anywhere in the bundle; the dates above describe the funded project period and a reporting
      snapshot, not the encounter dates of the data.

