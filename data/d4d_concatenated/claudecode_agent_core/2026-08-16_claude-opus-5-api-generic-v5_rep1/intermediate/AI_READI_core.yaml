acquisition_methods:
  - acquisition_details: >-
      On-site measurements taken directly by trained study personnel, including vitals, height,
      weight, waist and hip circumference, 12-lead electrocardiogram, monofilament testing, vision
      testing, autorefraction, cognitive screening and retinal imaging from seven devices.
    was_directly_observed: true
  - acquisition_details: >-
      Laboratory results from non-fasting blood and urine specimens collected during the visit.
      Complete blood counts were run on fresh whole blood by CLIA-certified laboratories local to
      each site; all other assays were performed by the University of Washington Nutrition and
      Obesity Research Center on stored frozen samples.
    was_directly_observed: true
  - acquisition_details: >-
      Participant-reported questionnaire responses covering eligibility screening, demographics,
      depressive symptoms (CES-D-10), diabetes-related distress (PAID-5), diabetes self-care,
      dietary habits, ophthalmic history, smoking, alcohol, vaping and marijuana use, general
      health history, social determinants of health (PhenX surveys) and current medications with
      RxNorm codes.
    was_reported_by_subjects: true
    was_validated_verified: true
    notes: >-
      Verification of data entry was performed where possible, for example by cross-referencing
      entered medications against medications physically brought in or photographed by the
      participant.
  - acquisition_details: >-
      Device-captured at-home monitoring over ten continuous days using a Dexcom G6 continuous
      glucose monitor, a Garmin Vivosmart 5 activity tracker and the LeeLab Anura home
      environmental sensor, returned to study staff by overnight mail or in person.
    was_directly_observed: true
  - acquisition_details: >-
      Derived measures computed from collected data, including waist-hip ratio and body mass index
      calculated from measured anthropometrics and low-density lipoprotein cholesterol calculated
      from the lipid panel.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for the online recruitment interface, electronic consent, participant
      questionnaires, and entry of clinical data from the visit including the medications
      assessment, vitals, visual acuity, contrast sensitivity, monofilament test results and
      complete blood count results.
  - mechanism_details: >-
      Retinal imaging devices: Optomed Aurora IQ handheld undilated fundus camera; iCare EIDON
      widefield TrueColor confocal fundus system; Heidelberg Spectralis HRA OCT and OCTA;
      Heidelberg fluorescence lifetime imaging ophthalmoscope; Topcon Maestro2 3D OCT-1; Topcon
      Triton DRI swept-source OCT; and Zeiss Cirrus 5000 Angioplex. All retinal images were
      collected under dilated conditions except those from the Optomed.
  - mechanism_details: >-
      Cardiac and neurological assessment instruments: Philips PageWriter TC30 Cardiograph for the
      12-lead electrocardiogram, a 10 g monofilament for peripheral neuropathy testing, and the
      MoCA Duo application on an iPad for the Montreal Cognitive Assessment.
  - mechanism_details: >-
      Vision testing instruments: M&S Technologies Electronic Visual Acuity tester with neutral
      density filters for mesopic testing, the Mars Letter Contrast Sensitivity chart, the Topcon
      KR 800 autorefractor, and NIDEK LM-600P or Topcon CL-200/CL-300 lensometers.
  - mechanism_details: >-
      Vital signs devices used across sites: OMRON HEM 907XL, Medline MDS4001 Automatic Digital
      Blood Pressure Monitor, and Welch Allyn 6000 series vital signs monitor with FlexiPort
      reusable cuff.
  - mechanism_details: >-
      At-home monitoring devices: Dexcom G6 continuous glucose monitor, Garmin Vivosmart 5 physical
      activity monitor, and the LeeLab Anura environmental sensor custom designed at the Karalis
      Johnson Retina Center, University of Washington. The environmental sensor and fitness tracker
      were chosen with participant privacy as a primary concern: they capture no video or audio,
      have no GPS location monitoring, and are not synced with participant-owned devices.
  - mechanism_details: >-
      FAIRhub, a Microsoft Azure cloud-based data management, curation and sharing platform
      developed for the project, receives uploads from each data collection site at regular
      intervals and hosts the released dataset.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Version 3.0.0 covers data collected between 19 July 2023 and 1 May 2025. A preliminary pilot
      enrollment period ran from 18 July 2023 to 30 November 2023 to establish coordinator
      familiarity, and formal data collection began on 1 December 2023. The overall project spans
      four years, with one year of protocol development and training followed by three years of
      recruitment and data collection; enrollment is scheduled to continue until 30 November 2026
      and study completion is anticipated for 1 January 2027.

data_collectors:
  - collector_details: >-
      Clinical research coordinators at the three data collection sites recruited, enrolled and
      collected data. All coordinators underwent training by the data manager at the University of
      Alabama at Birmingham, worked from a detailed Manual of Procedures, completed mandatory
      institutional compliance training for human subject research, and were required to
      successfully administer all protocol elements to at least three volunteer practice subjects
      before enrolling participants.
    role: Recruitment, enrollment and protocol administration
  - collector_details: >-
      Data managers at each site oversaw the certification process for coordinators and were
      responsible for quality control of all data before uploading to FAIRhub.
    role: Site data management and quality control
  - collector_details: >-
      Retinal imaging technicians acquired the ophthalmic imaging and were trained to detect
      conditions that are potentially life or vision threatening, including retinal detachment,
      tumor and optic disc edema.
    role: Ophthalmic image acquisition
  - collector_details: >-
      Laboratory personnel at CLIA-certified laboratories local to each site performed complete
      blood counts on fresh whole blood, and the University of Washington Nutrition and Obesity
      Research Center performed all other blood and urine assays on stored frozen samples.
    role: Laboratory analysis
  - collector_details: >-
      Effort was supported by NIH award OT2OD032644 based on the percentage of effort contributed,
      with salaries aligned to the funding guidelines at each site. Study subjects received a
      compensation of 200 US dollars for the study visit, issued after the study devices were
      returned and the final data received, typically at least two weeks after the visit and not
      prorated; the study also covered reasonable parking, public transit or rideshare costs.
    role: Compensation arrangement for the collection team and participants

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. The study base is all patients aged 40 years or older who had a
      medical encounter within each health system site between 2020 and 2025. Contact pools were
      identified for each recruitment wave by screening electronic health records, and individuals
      were mailed a personalized hardcopy invitation letter and sent an invitation email directing
      them into an online REDCap recruitment interface. Participants are recruited in waves whose
      composition and size are influenced by observed participation characteristics of race and
      ethnicity, gender, T2DM severity and site; as recruitment progresses the composition is
      monitored and adjusted by under- and oversampling groups as needed. All study groups are
      recruited at every site, but the proportion of each group varies with the demographic
      prevalence of that group in the site's geographic area.
    source_data: >-
      Electronic health records of the University of Alabama at Birmingham, the University of
      California San Diego and the University of Washington health systems, screened using ICD-10
      diagnosis codes R73.09 and E11.X.
    why_not_representative: >-
      The cohort is deliberately triple-balanced by self-reported race and ethnicity, T2DM presence
      and severity, and biological sex, recruiting these populations in approximately equal
      proportions rather than targeting the demographic distribution of the US population, because
      balanced datasets are considered critical for the development of unbiased machine learning
      models. Participants are volunteers, introducing volunteer bias, and enrollment is limited to
      people who speak, read and understand English.
    representative_verification:
      - >-
        No verification of representativeness against a larger population was performed. The
        healthsheet states that the dataset contains all participants enrolled within the covered
        collection period rather than a sample drawn from them.
    source_caveats: >-
      The BMJ Open protocol states that patients with T2DM and pre-diabetes were identified using
      ICD-10 codes "R73.09 and E11.X, respectively", which appears to transpose the two codes
      relative to their standard meanings.

preprocessing_strategies:
  - preprocessing_details: >-
      Clinical data collected in REDCap were mapped to the Observational Medical Outcomes
      Partnership Common Data Model, with each released CSV file corresponding one-to-one to an
      OMOP CDM table.
  - preprocessing_details: >-
      Imaging exported from devices in proprietary formats was converted to DICOM: Topcon Maestro2
      and Triton data were exported as .fda and converted, and Heidelberg FLIO data were exported
      as .sdt and converted. Optomed, iCare EIDON, Heidelberg Spectralis and Zeiss Cirrus data were
      exported directly in DICOM.
  - preprocessing_details: >-
      Garmin activity data exported in .FIT format were converted to the Open mHealth standard, and
      Dexcom continuous glucose monitoring data exported as CSV were likewise mapped to Open
      mHealth. Electrocardiogram data exported as .xml were converted to the WFDB format.
  - preprocessing_details: >-
      The whole release was organized according to the Clinical Dataset Structure (CDS) v0.1.1:
      one directory per data type at the root, then one folder per modality, then one folder per
      device, then one folder per participant named with the participant's study ID, with a
      manifest.tsv in each data type directory.
  - preprocessing_details: >-
      Protected health information was removed from the public release under the HIPAA Privacy Rule
      Safe Harbor method, and information related to sex, race and ethnicity and medications used
      was additionally removed to prevent stigmatization of findings.
  - preprocessing_details: >-
      Data may be statically watermarked to identify the licensee for security purposes, and
      licensees are prohibited from removing, obscuring, altering or masking the watermark.

cleaning_strategies:
  - cleaning_details: >-
      Quality control was applied at the time of data entry and acquisition. Clinical data falling
      outside expected minimum and maximum ranges were flagged in REDCap and surfaced in reports
      viewed by clinical research coordinators and data managers, who examined participant records
      to determine whether an error was likely. Data were checked for credibility against
      prespecified reasonable ranges, incorrect flow through prescribed skip patterns, missing data
      that could be filled directly from other portions of an individual's record, and the omission
      or duplication of records.
  - cleaning_details: >-
      Editing was performed only under the guidance and approval of the site principal
      investigator. Where corrected data were available elsewhere in the respondent's answers the
      error was corrected; where there was no logical or appropriate way to correct the data the
      site principal investigator reviewed the values and decided whether they should be removed.
      Data managers at each site were responsible for quality control of all data before uploading
      to FAIRhub.

labeling_strategies:
  - labeling_details: >-
      No labeling or annotation was performed. The dataset is hypothesis-agnostic and aimed at
      facilitating multiple potential downstream AI/ML applications, so no explicit label or target
      is associated with each data instance and no gold-standard or proxy labels are supplied. The
      creators state that they have no formal guidelines in place for researchers who create new
      labels or define new tasks from the data.

raw_sources:
  - raw_data_details: >-
      Raw, device-native data prior to standardization are retained by the AI-READI project and are
      expected to be preserved at least for the duration of the project, but are not currently
      shared outside the project team because they have not been mapped to standardized
      terminologies and may inadvertently contain personal health information or personally
      identifiable information in free-text fields. Raw data may be included in future releases of
      the controlled access dataset.

raw_data_sources:
  - source_description: >-
      Electronic health records of the University of Alabama at Birmingham, the University of
      California San Diego and the University of Washington health systems, used to identify and
      screen potential participants by ICD-10 diagnosis code, age and demographic data.
    source_type: Institutional electronic health records
    access_details: >-
      Screening was performed by site staff under the study IRB approval; these records are not
      redistributed as part of the dataset.
  - source_description: >-
      Device-native exports produced at the study sites before conversion to the released
      standards: electrocardiogram .xml from the Philips PageWriter TC30, MoCA Duo application .csv
      containing total score, section subscores, Memory Index Score and task completion times,
      Topcon .fda imaging files, Heidelberg .sdt FLIO files, Garmin .FIT activity files, Dexcom
      .csv glucose files and environmental sensor .csv files.
    source_type: Instrument and device exports
    raw_data_format: .xml, .csv, .fda, .sdt, .FIT
    access_details: Retained by the project; not distributed in this release.
  - source_description: >-
      Laboratory results returned in CSV format by the University of Washington Nutrition and
      Obesity Research Center testing facility and complete blood count results from CLIA-certified
      laboratories local to each site.
    source_type: Clinical laboratory reports
    raw_data_format: .csv
  - source_description: >-
      REDCap database holding participant-reported questionnaire responses and clinical data
      entered at the visit.
    source_type: Electronic data capture system

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants. Survey data contain skipped questions
      and incomplete responses. Wearable activity monitor coverage has gaps because the Garmin
      battery had to be charged every two to three days during the ten-day wear period.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In a few cases the data
      collection device had no stored results or was returned too late to retrieve the results, for
      example because the battery died or data were lost. In a few cases a data collision occurred
      at some point in the process and data were lost. Imaging modalities were occasionally skipped
      when quality was inadequate, for instance where the operator-dependent Heidelberg Spectralis
      acquisition could not be completed satisfactorily.
    handling_strategy: >-
      During cleaning, missing values that could be filled directly from other portions of an
      individual's record were filled under site principal investigator approval; otherwise values
      were left missing or removed after review. No imputation was applied and no instances were
      excluded at the time of preprocessing.

anomalies:
  - anomaly_details: >-
      Survey data contain skipped questions and incomplete responses, which are expected in
      self-reported instruments.
  - anomaly_details: >-
      Wearable device data can be affected by improper use and by technical failures such as
      battery failure or system malfunction.
  - anomaly_details: >-
      Imaging data can be affected by participant uncooperation, noise that obscures the images,
      system malfunction and data transfer failures.
  - anomaly_details: >-
      Optomed Aurora images are acquired undilated with a handheld camera, so image quality varies
      from participant to participant and within the same participant.
  - anomaly_details: >-
      FLIO acquisition is highly sensitive: the device cannot tolerate more than one centimeter of
      movement during image acquisition, unwanted signals such as background light or lens
      fluorescence are part of the same Poisson distribution as the useful signal and cannot simply
      be subtracted, and because the modality is performed last in the visit and exposes
      participants to uncomfortable light levels, participant compliance may be lower than for
      earlier modalities.
  - anomaly_details: >-
      Data collisions at some point in the processing chain have caused loss of data in a small
      number of cases.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so volunteer bias is present and may limit the generalizability
      of results to people not represented in the study population.
    mitigation_strategy: >-
      Recruitment proceeds in monitored waves whose composition is adjusted by under- and
      oversampling groups as needed, and the invitation pool is drawn systematically from health
      system records rather than by open advertisement.
  - bias_type: selection_bias
    bias_description: >-
      Eligibility requires that participants speak, read and understand English, which may have
      created challenges in recruiting Hispanic and Asian persons. Pregnancy, gestational diabetes
      and type 1 diabetes are exclusionary, and enrollment is limited to adults aged 40 to 85.
    mitigation_strategy: >-
      The protocol notes that if sample balancing on race and ethnicity emerges as a challenge, new
      recruitment strategies will be implemented; the team also considered translating study
      materials so that Spanish-speaking participants could be enrolled.
  - bias_type: representation_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based and may not fully capture the range of
      cultural and socioeconomic backgrounds. The cohort does not include other races and
      ethnicities such as Pacific Islanders and Native Americans, so it may not provide a
      comprehensive representation of the population.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic variability across the
      United States and to broaden representation across racial and ethnic groups, and individuals
      from all demographic backgrounds were recruited at all three sites. The project also engaged
      with the Native Biodata Consortium as a co-learning opportunity on challenges specific to
      American Indian and Alaska Native communities.
  - bias_type: sampling_bias
    bias_description: >-
      Interim releases are not balanced across race and ethnicity, biological sex and diabetes
      severity, because enrollment is ongoing and the balanced distribution is a target for the
      completed study rather than a property of each release.
    mitigation_strategy: >-
      Uniform data collection protocols were implemented for all subjects irrespective of race,
      ethnicity, biological sex or diabetes severity across all study sites, and the recommended
      validation and test splits were constructed to be balanced as far as possible for sex, race
      and ethnicity, and diabetes status.
    affected_subsets:
      - >-
        The training split is materially unbalanced relative to the validation and test splits: it
        contains 204 Hispanic against 660 White participants and 105 insulin-controlled against 600
        participants with no diabetes.
  - bias_type: measurement_bias
    bias_description: >-
      Multiple device makes and models are used for the same measure, and several modalities depend
      on operator technique, so systematic differences between devices and operators may be present
      in the data.
    mitigation_strategy: >-
      Device make and model and the specific scan modality were documented for every acquisition to
      ensure repeatability, and multiple devices per measure were included deliberately to enhance
      generalizability and represent the range of equipment used in clinical settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study cohort may not provide a comprehensive representation of the population: it is
      urban and hospital-based, excludes people who do not read and speak English, and does not
      include Pacific Islanders or Native Americans.
    scope_impact: >-
      Models derived from the dataset may not generalize to populations and settings the cohort
      does not cover.
    recommended_mitigation: >-
      Report the cohort composition alongside any derived model and validate externally before
      applying results to unrepresented populations.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities are available for all participants, because some participants declined
      individual study elements and some device data were lost or unretrievable.
    scope_impact: Analyses requiring complete multimodal coverage will operate on a reduced cohort.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The design is cross-sectional with a single visit per participant in this release. Only
      approximately 4 to 10 percent of participants are expected to undergo a follow-up examination
      in year 4 of the project.
    scope_impact: >-
      Disease trajectories must be inferred across participants of differing severity rather than
      observed within individuals.
  - limitation_type: scope_limitation
    limitation_description: >-
      The biorepository contains a finite number of samples to share with scientists interested in
      using them in research. Procedures for reviewing and prioritizing written requests were still
      to be developed at the time of the protocol publication.
    scope_impact: Ancillary biospecimen studies will be capacity-limited.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Sex, race and ethnicity, and medication information are removed from the public release and
      held under controlled access, and the healthsheet records that the dataset does not identify
      demographic sub-populations.
    scope_impact: >-
      Fairness auditing and demographic subgroup analysis are not possible using the public set
      alone.
    recommended_mitigation: >-
      Use the recommended data splits, which were constructed to be balanced for these attributes,
      or obtain the controlled access set under a data use agreement.
  - limitation_type: integration_limitation
    limitation_description: >-
      Snellen visual acuity variables were dropped in version 3.0.0, so only logMAR visual acuity
      measurements are available in this release.
    scope_impact: >-
      Analyses that depend on Snellen notation cannot be reproduced across versions without
      conversion.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The dataset does not contain data that might be considered confidential, such as data
      protected by legal privilege or by doctor-patient confidentiality. No personally identifiable
      information is included. The RO-Crate metadata records the release at confidentiality level
      HL7:2N (normal).

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public dataset does not contain data considered sensitive. It carries no protected health
      information as defined by the HIPAA Privacy Rule, and information about the sex and race or
      ethnicity of participants, as well as medications used, has been removed.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled access dataset contains data that reveal racial and ethnic origins, location
      at the level of 5-digit zip code, biological sex, genetic sequencing data, past health
      records, medications, and traffic and accident reports.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet records that the dataset does not contain data that, if viewed directly,
      might be offensive, insulting, threatening or otherwise pose a safety risk such as
      psychological safety or anxiety.

is_deidentified:
  identifiable_elements_present: false
  method: HIPAA Safe Harbor
  identifiers_removed: >-
    All eighteen HIPAA identifier categories were checked for and are absent from the released
    data; the public set additionally omits sex, race and ethnicity, and medications used, and
    withholds 5-digit zip code, genetic sequencing data, past health records and traffic and
    accident reports under controlled access.
  deidentification_details: >-
    No identifiers were collected, so no active de-identification was necessary, but the team
    checked that no data identifiable under US HIPAA were present. The public set is stripped of
    protected health information as defined by the HIPAA Privacy Rule via the Safe Harbor method,
    and information related to the sex and race or ethnicity of participants was also removed to
    prevent stigmatization of findings. Participant folders are named with study participant ID
    numbers. The dataset has been reviewed internally by AI-READI team members for quality checks
    and to ensure that no personally identifiable information was accidentally included; it has not
    undergone any formal external audit. A theoretical risk of future re-identification remains,
    which the project addresses through a robust data dissemination system, a strict license
    agreement and static data watermarking of both the public and controlled sets.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      Approved by the Institutional Review Board of the University of Washington under approval
      number STUDY00016228, with reliance agreements with the IRBs of the University of Alabama at
      Birmingham and the University of California, San Diego. Initial approval was received on 20
      December 2022, and an annual renewal application about the status and progress of the study
      is required within 90 days of expiration.
  ethics_review_board: >-
    University of Washington Human Subjects Division, IRB Reliance Team (hsdrely@uw.edu), Human
    Subjects Division, 4333 Brooklyn Ave NE Box 359470, Seattle, WA 98195-9470, United States.
  regulatory_compliance:
    - >-
      The study is registered on ClinicalTrials.gov as NCT06002048. It is not FDA-regulated for
      either drug or device, has no Data Monitoring Committee, and reports human subject review
      status as submitted and approved. Licensees must comply with the NIH Genomic Data Sharing
      Policy security best practices for controlled-access data.
  special_populations:
    - >-
      Enrollment is restricted to adults aged 40 to 85 who are able to provide consent, so no
      minors are enrolled. Pregnancy, gestational diabetes and type 1 diabetes are exclusion
      criteria.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      Initial approval of protocol STUDY00016228 was granted on 20 December 2022, with the approval
      letter published alongside the dataset documentation. Reliance agreements cover the
      University of Alabama at Birmingham and the University of California, San Diego, which used
      the same consent form with minor institution-specific language. Annual renewal is required
      within 90 days of expiration.
  - reviewing_organization: AI-READI ethics team
    review_details: >-
      The RO-Crate metadata for the release names Camille Nebeker, Debra Mathews, Kadija Ferryman
      and Nicholas Evans as responsible for ethical review. Ethical, legal and social implications
      are considered at every stage of the project cycle, and the project sought guidance from
      bioethicists in establishing standards for the collection, preparation and sharing of the
      data.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      A Community Advisory Board of 11 persons drawn from the three sites, including diversity in
      race and ethnicity as represented in the AI-READI sample, contributes to the development of
      the protocol and evaluates the consent forms and research protocols, with feedback considered
      in protocol modifications.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      The eligibility criteria exclude minors, people who are pregnant, people with gestational
      diabetes and people with type 1 diabetes, and require that participants be able to provide
      consent, so no guardian consent or assent procedures apply. Transportation assistance through
      rideshare services was offered to participants who reported barriers to reaching study
      visits.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent from each participant, provided either electronically through
      REDCap before the visit or in person at the start of the visit.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington, is
      published alongside the dataset documentation. The other clinical sites operated under IRB
      reliance and used the same consent form with minor institution-specific language incorporated
      according to individual institutional requirements. Signed electronic consent forms were
      automatically emailed to participants, who could request additional copies from the study
      coordinator for the duration of the study.
    consent_scope: >-
      Consent covers the single study visit, the ten-day at-home device monitoring period,
      collection and banking of blood and urine biospecimens for future research, access to health
      records and driving and accident records, and placement of de-identified data in an
      open-source repository. Informed consent was required before participation in any part of the
      protocol, including the questionnaires; each individual was aware of the data collection
      because this was active collection directly from participants rather than secondary use of
      existing data.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      Any data that had been shared or used up to that point would remain in the dataset. This
      limitation is clearly communicated in the consent document.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted for the dataset.

data_governance:
  committee_name: AI-READI Data Access Committee
  accountable_organization:
    id: https://ror.org/01yc7t268
    name: Washington University in St. Louis
  committee_contact:
    id: https://orcid.org/0000-0002-7452-1648
    name: Aaron Lee
  access_review_process: >-
    Accessing the dataset requires logging in through a verified ID system, agreeing to use the
    data only for type 2 diabetes related research, and agreeing to the license terms, which set
    restrictions and obligations for data usage. FAIRhub records the access type as
    PublicDownloadSelfAttestationRequired, and the access request workflow is reached from the
    dataset landing page at https://fairhub.io/datasets/3/access. The full dataset, including the
    controlled elements, is accessible only by entering into a data use agreement; the requirements
    for controlled access datasets were being developed by the Data Access Committee at the time of
    the protocol publication. Institutions of scientists requesting the controlled set must have
    completed legal and privacy use agreements with the AI-READI research program.
  stewardship_roles:
    - >-
      The AI-READI Consortium supports and maintains the dataset, and FAIRhub hosts it through
      Microsoft Azure. The RO-Crate metadata names the AI-READI Consortium as the data governance
      committee. The data manager at each collection site is responsible for the quality control of
      all data before uploading to FAIRhub. The general contact route is
      https://aireadi.org/contact and the central study contact email is contact@aireadi.org.
  appeal_process: >-
    No appeal process for access decisions is described in the available documentation.

license_and_use_terms:
  license_terms: >-
    The dataset is released under the AI-READI custom license version 2.0, archived at
    https://doi.org/10.5281/zenodo.17555036, with Washington University in St. Louis as licensor.
    The license was specifically tailored to enable reuse of the AI-READI dataset for commercial or
    research purposes while imposing strong requirements around data usage, security and secondary
    sharing to protect study participants, especially when data is reused for AI and machine
    learning applications. It grants a non-exclusive, non-transferable license to download,
    reproduce and use the data and to create derivative works for research, commercial and
    non-commercial purposes. A licensee may be an individual or, where declared in the data request
    workflow, an authorized group within an institution, whose authorized users inherit the
    licensee's rights for as long as they remain members of that group. Derivative data, including
    synthetic data generated from the data, is treated as data subject to all the same
    restrictions. Licensee models developed or trained using the data may be distributed provided
    they do not themselves contain the data and provided the licensee first undertakes all
    reasonable efforts to minimize the likelihood that data can be memorized, derived,
    reconstructed or reconstituted through their use or construction. Licensees must acknowledge
    the licensor, source and funder in any papers reporting use of the data. The license terminates
    automatically upon any breach, whereupon the licensee must delete all copies and cease all use.
    The data is provided on an "as is" basis without warranty of any kind, the licensor's aggregate
    liability is capped at one US dollar with limited exceptions, and the licensee indemnifies the
    licensor and its suppliers. The dataset documentation itself is shared under CC-BY 4.0.
  data_use_permission: disease_specific_research
  contact_person:
    id: https://orcid.org/0000-0002-7452-1648
    name: Aaron Lee

ip_restrictions:
  restrictions:
    - >-
      Title to the data, and all industrial and intellectual property rights in it, remain solely
      and exclusively with the licensor, Washington University in St. Louis, and its suppliers; the
      licensee must not take any action inconsistent with that ownership, and any rights not
      expressly granted are reserved. Licensees may refer publishers and conference organizers to
      the licensor if they wish to obtain a separate license to the data for publication purposes.
      The healthsheet records that no third parties have imposed IP-based or other restrictions on
      the data beyond those in the license.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
    - >-
      Licensees must comply with all data security and privacy standards established by the US
      National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH
      Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy. Data may be
      statically watermarked to identify the licensee for security purposes and the watermark must
      not be removed, obscured, altered or masked. Data may be stored only on servers and devices
      maintained by and located within the licensee's institution, or on cloud or remote storage
      and backup services covered by a HIPAA-approved Business Associate Agreement with that
      institution. Licensees must comply with all applicable laws, regulations and restrictions
      relating to the distribution and use of the data and of models built from it.
  other_compliance: >-
    The public set is de-identified under the HIPAA Privacy Rule Safe Harbor method. The study is
    not FDA-regulated for drug or device. The healthsheet refers questions about export controls
    and other regulatory restrictions to the license.

distribution_formats:
  - format: DICOM
    media_type: application/dicom
  - format: CSV
    media_type: text/csv
  - format: JSON
    media_type: application/json
  - format: Markdown
    media_type: text/markdown

distribution_dates:
  - release_dates: >-
      Version 1.0.0 was released on 3 May 2024, version 2.0.0 on 8 November 2024, and version 3.0.0
      on 17 November 2025. The FAIRhub dataset_description metadata records 17 November 2025 as the
      date version 3.0.0 was made available.

external_resources:
  - external_resources: >-
      AI-READI dataset documentation at https://docs.aireadi.org, with a separate documentation set
      for each dataset version, covering citation, preliminary information on access and training
      prerequisites, per-domain dataset documentation including the healthsheet, controlled
      variables, AI-readiness considerations and additional resources.
    archival: false
    restrictions:
      - >-
        The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
        associated with its use.
    future_guarantees: >-
      One version of the documentation is maintained for each version of the dataset, navigable
      from a version dropdown.
  - external_resources: >-
      AI-READI project website at https://aireadi.org, including the team roster and contact page.
    archival: false
  - external_resources: >-
      Zenodo community of the AI-READI project at https://zenodo.org/communities/aireadi, which
      hosts the license terms at https://doi.org/10.5281/zenodo.17555036.
    archival: true
  - external_resources: >-
      GitHub organization of the AI-READI project at https://github.com/AI-READI, hosting project
      code and guidelines.
    archival: false
  - external_resources: >-
      AI-READI Consortium. AI-READI: rethinking AI data collection, preparation and sharing in
      diabetes research and beyond. Nature Metabolism 2024;6:2210-2212.
      https://doi.org/10.1038/s42255-024-01165-x
    archival: true
  - external_resources: >-
      Owsley C, Matthies DS, McGwin G, et al. Cross-sectional design and protocol for Artificial
      Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI). BMJ Open
      2025;15:e097449. https://doi.org/10.1136/bmjopen-2024-097449
    archival: true
  - external_resources: >-
      Clinical Dataset Structure (CDS) specification v0.1.1 at
      https://cds-specification.readthedocs.io/en/v0.1.1/, developed by the project as a simple way
      to organize clinical research datasets with structured metadata.
    archival: false
  - external_resources: >-
      NIH RePORTER record for the supporting award OT2OD032644 at
      https://reporter.nih.gov/project-details/10471118
    archival: false

