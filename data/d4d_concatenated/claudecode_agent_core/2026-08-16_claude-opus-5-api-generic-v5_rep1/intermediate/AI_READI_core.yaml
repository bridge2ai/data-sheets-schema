id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the AI-READI flagship dataset comprises multimodal health data from 2,280
  adults aged 40 and older, with and without type 2 diabetes mellitus (T2DM), collected between
  19 July 2023 and 1 May 2025 and harmonized across three United States sites: the University of
  Alabama at Birmingham, the University of California San Diego, and the University of
  Washington. AI-READI (Artificial Intelligence Ready and Equitable/Exploratory Atlas for
  Diabetes Insights) is one of four Data Generation Projects funded by the NIH Common Fund
  Bridge2AI program. The cohort is deliberately triple-balanced across self-reported race and
  ethnicity (Asian, Black, Hispanic, White), T2DM severity (no diabetes; pre-diabetes or
  lifestyle-controlled; controlled by oral or non-insulin injectable medication;
  insulin-controlled) and biological sex, rather than matched to the demographic distribution of
  the US population, so that unbiased machine learning models can be developed. Each participant
  completes pre-visit questionnaires, a single on-site visit lasting roughly 2.5 to 4 hours, and
  a 10-day at-home monitoring period. Data domains include survey and social-determinants-of-
  health instruments, vitals and physical measurements, blood and urine laboratory results, a
  12-lead electrocardiogram, cognitive screening, monofilament testing for peripheral neuropathy,
  vision testing, retinal imaging from seven devices (color fundus photography, fundus
  autofluorescence, infrared reflectance, OCT, OCTA and fluorescence lifetime imaging
  ophthalmoscopy), continuous glucose monitoring, wearable activity monitoring, and home
  environmental sensing. The release contains 356,343 files totaling approximately 3.82 TB,
  organized according to the Clinical Dataset Structure (CDS) v0.1.1 with each data type stored
  in a discipline-specific standard. The publicly downloadable set contains no protected health
  information and omits sex, race/ethnicity and medication information; those fields, together
  with 5-digit zip code, genetic sequencing data, past health records and traffic and accident
  reports, are held under controlled access. The scientific goal is to support artificial
  intelligence and machine learning research into salutogenesis, the pathway from disease back
  to health, in type 2 diabetes.
