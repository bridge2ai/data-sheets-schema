purposes:
  - response: >-
      To enable future generations of artificial intelligence and machine learning research to
      provide critical insights into type 2 diabetes mellitus, including salutogenic pathways to
      return to health.
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset that
      is balanced for self-reported race and ethnicity, biological sex and diabetes disease stage.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria or biases and that can be used to reconstruct a temporal atlas of
      disease development and reversal toward health.
  - response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data for AI and machine learning purposes, so that the project can serve as a
      blueprint for future data generation projects.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including through a year-long research internship program.

addressing_gaps:
  - response: >-
      A major barrier to applying artificial intelligence in type 2 diabetes research has been the
      lack of diverse datasets that are AI ready for training AI models. The AI-READI dataset is
      intended to fill this gap.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as type
      2 diabetes has been limited by the absence of well-designed, high quality, large and
      inclusive multimodal datasets.
  - response: >-
      Existing large datasets for AI/ML training lack racial and ethnic diversity. A
      meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020 found that
      samples lacked racial and ethnic diversity, and the deleterious consequences of the disease
      are exacerbated in populations that bear a higher burden of it.
  - response: >-
      The multi-domain acquisition protocol enables downstream AI/ML analyses that may not be
      feasible with existing data sources such as claims or electronic health records data.

tasks:
  - response: >-
      Downstream pseudo-time manifold analysis, an approach used to predict disease trajectories by
      learning from complex multimodal data collected from participants with differing disease
      severity, from normal to insulin-dependent type 2 diabetes.
  - response: >-
      Development of multimodal artificial intelligence and machine learning models of type 2
      diabetes pathogenesis and salutogenesis.

other_tasks:
  - task_details: >-
      The protocol is hypothesis agnostic and spans more than ten variable domains, so the dataset
      may support analyses beyond diabetes itself, including ophthalmic imaging, cardiac
      electrophysiology, cognitive function, peripheral neuropathy, physical activity, sleep and
      indoor environmental exposure research. Access to the public set is nonetheless conditioned
      on an attestation that the data will be used only for type 2 diabetes related research.

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes mellitus
    usage_notes: >-
      Accessing the dataset requires logging in through a verified ID system and agreeing to use the
      data only for type 2 diabetes related research, in addition to accepting the license terms.
  - use_category: Methodological blueprint for creating and sharing AI-ready clinical datasets
    usage_notes: >-
      The project publishes its guidelines for project management, data collection, data management
      and data sharing, and developed the Clinical Dataset Structure (CDS) specification and the
      FAIRhub curation and sharing platform, which the team anticipates making available for future
      Data Generation Projects.
  - use_category: Workforce development and training at the intersection of biomedicine and AI
    usage_notes: >-
      AI-READI hosts a year-long research internship program that includes a two-week data
      science/programming bootcamp followed by a yearlong curriculum of didactic lectures and
      mentored research.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited by the license, because
      the data is intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or with other information, to compromise the
      confidentiality or privacy of a data subject, to identify or contact a data subject, to
      extract or extrapolate identifying information, to establish a data subject's membership in a
      particular group, or otherwise to cause harm or injury to a data subject is prohibited.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for training
      or development purposes, meaning model weight modification or other adjustments to a model's
      logic or operation, is prohibited even where that vendor is party to a Business Associate
      Agreement with the licensee's institution.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or otherwise
      conveying any portion of the data or any derivative work to a third party that is not another
      licensee bound by identical terms is prohibited.
  - prohibition_reason: >-
      Reproducing more than small representative samples of the data in publications is prohibited;
      up to five images or figures per paper are permitted for illustrative purposes only, and
      larger amounts may not be published through supplemental files, zip archives, code packages
      or other means.
  - prohibition_reason: >-
      Storing the data anywhere other than servers and devices maintained by and located within the
      licensee's institution, or cloud and remote storage services covered by a HIPAA-approved
      Business Associate Agreement with that institution, is prohibited.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking that may be applied to
      identify the licensee is prohibited.

discouraged_uses:
  - discouragement_details: >-
      Drawing conclusions about demographic balance from an interim release is discouraged. Because
      enrollment is ongoing, the pilot data release and periodic updates may not have achieved the
      balanced distribution across race, ethnicity, sex and diabetes severity that the completed
      study targets.
  - discouragement_details: >-
      Generalizing models derived from this cohort to populations it does not represent is
      discouraged. Recruitment was predominantly urban and hospital-based and may not capture the
      full range of cultural and socioeconomic backgrounds; the cohort does not include other
      races and ethnicities such as Pacific Islanders and Native Americans; and participants were
      required to speak and read English.

future_use_impacts:
  - impact_details: >-
      To the extent of the creators' knowledge, no uses of the dataset are anticipated that could
      result in unfair treatment of individuals or groups or other undesirable harms. A theoretical
      risk of future re-identification remains.
  - impact_details: >-
      AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification. To prevent re-identification attempts the project implements
      a robust data dissemination system, a strict license agreement, and data watermarking for
      both the public and controlled sets.
  - impact_details: >-
      Data used in developing AI systems is often a major source of downstream ethical issues, so
      ethical, legal and social implications are considered at every stage of the project cycle and
      the provenance and intended use of the data are documented for AI developers.

