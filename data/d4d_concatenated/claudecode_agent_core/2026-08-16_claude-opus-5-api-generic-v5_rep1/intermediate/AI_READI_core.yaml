maintainers:
  - maintainer_details: >-
      The AI-READI team supports and maintains the dataset. Contact information is provided in the
      README file included with the dataset, through https://aireadi.org/contact, and at
      contact@aireadi.org; the study_description.json and dataset_description.json metadata files
      included in the dataset carry additional information about the contact person and entity,
      authors and contributors.
    role: academic_institution
  - maintainer_details: >-
      FAIRhub hosts the dataset on Microsoft Azure cloud infrastructure. The Microsoft AI for Good
      Lab supported the cloud services needed for the project.
    role: other

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset is not updated in place. New static versions are released with additional instances
    as more study participants complete the study visit, approximately once a year, and each
    version receives its own DOI and its own documentation set. Changes between the current version
    and the previous one are documented in detail in the CHANGELOG file included in the dataset and
    visible at docs.aireadi.org. Version 3.0.0 added 1,213 participants of year 3 data on top of
    the 204 pilot and 863 year 2 participants, added three imaging devices relative to version
    1.0.0, moved processing from custom and ad hoc to an automated plus custom pipeline, and
    introduced a recommended train/validation/test split.

version_access:
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  versions_available:
    - >-
      Version 1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants. Version 2.0.0,
      DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants, 165,051 files,
      approximately 2.01 TB. Version 3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025,
      2,280 participants, 356,343 files, approximately 3.82 TB.
  version_details: >-
    All versions are listed on the FAIRhub dataset landing page, and each has a matching
    documentation set selectable from a version dropdown at docs.aireadi.org. Version 2.0.0 is
    marked as no longer accessible on FAIRhub. Datasheets exist for the first version at
    https://docs.aireadi.org/docs/1/dataset/healthsheet and for the second at
    https://docs.aireadi.org/docs/2/dataset/healthsheet.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. Participants
    were not told that their data would be retained for a fixed period and then deleted. Raw data
    are expected to be preserved by the AI-READI project at least for the duration of the project.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for people outside the project to extend, augment or contribute
    to the AI-READI dataset; extension is limited to those involved in the project.

notes: >-
  Citation: AI-READI Consortium. (2025). Flagship Dataset of Type 2 Diabetes from the AI-READI
  Project (3.0.0) [Data set]. FAIRhub. https://doi.org/10.60775/fairhub.3. The release contains
  356,343 files totaling 3,815,969,779,678 bytes, and a smaller mini-subset of version 3.0.0 is
  available through FAIRhub for pipeline development. Device manufacturers provided in-kind support
  to the project: Topcon Corporation, Optomed, iCare World and Carl Zeiss loaned imaging devices for
  research purposes at no cost, and Heidelberg Engineering, Dexcom and Garmin provided research
  discounts on study devices. Results are returned to participants: heart rate, blood pressure and
  visual acuity results are given on an exam card before the participant leaves the visit, a Dexcom
  report of average blood glucose levels and a Glucose Management Indicator follows the ten-day
  monitoring period by encrypted email, and laboratory test results with normative values are sent
  by HIPAA-compliant encrypted email at the time of the yearly data release. Incidental findings
  that are potentially life or vision threatening trigger immediate referral. A biorepository at the
  University of Alabama at Birmingham Center for Clinical and Translational Science banks plasma,
  serum, buffy coats, genomic DNA, PAXgene-stabilized RNA and peripheral blood mononuclear cells for
  future ancillary studies; these biospecimens are not part of this data release.

source_caveats: >-
  Institutional attribution differs across sources. The FAIRhub dataset and study metadata and the
  license name Washington University in St. Louis (ROR 01yc7t268) as managing organization, lead
  sponsor and licensor, and give it as the affiliation of the study principal investigators Aaron
  Lee and Cecilia Lee; the BMJ Open protocol, the NIH RePORTER record for OT2OD032644 and the
  Nature Metabolism author affiliations identify the University of Washington as the awardee
  organization and IRB of record; the RO-Crate metadata names the reviewing body "Washington
  University IRB" but supplies a University of Washington Human Subjects Division address in
  Seattle. This record reports both without resolving the discrepancy. Target enrollment is stated
  as 4,000 in the BMJ Open protocol, the Nature Metabolism comment, the NIH RePORTER abstract and
  the FAIRhub study description, but as 4,600 in the IRB protocol application. The collection start
  date is recorded as 19 July 2023 in the FAIRhub metadata and as 18 July 2023 in the BMJ Open
  protocol. The upper age limit appears only in the FAIRhub eligibility module (maximum age 85
  years, with adults older than 85 excluded); the BMJ Open protocol describes the population simply
  as aged 40 and older. The version 3.0.0 healthsheet states the release covers data collected "up
  through the end of the second year of the study" while the README changelog table labels the
  2,280 participants as the v3.0.0 main study comprising pilot, year 2 and year 3 data. Both the v2
  and v3 documentation "About" pages state that the associated dataset contains data from the
  participants of the pilot study phase, which conflicts with the participant counts and collection
  windows given in the corresponding healthsheets. The name expansion of the acronym also varies:
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights" in the BMJ Open protocol
  and Nature Metabolism comment, and "Artificial Intelligence Ready and Exploratory Atlas for
  Diabetes Insights" in the NIH RePORTER abstract, the FAIRhub README and the healthsheet. The BMJ
  Open protocol reports the study group balance as including "pre-diabetes/lifestyle-controlled
  diabetes" while the IRB protocol application describes the same group as
  "pre-diabetes/diet-controlled". The dataset-level de-identification metadata records deIdentType
  as "NoDeIdentification" with deIdentHIPAA true, which the accompanying detail explains as meaning
  that no identifiers were collected rather than that no HIPAA protection applies.