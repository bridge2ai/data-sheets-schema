raw_sources:
  - raw_data_details: "The raw data are saved and expected to be preserved by the AI-READI project at least for the duration of the project, but are not currently shared outside the project team, because they have not been mapped to standardised terminologies and because raw data may accidentally include personal health information or personally identifiable information, for example in free-text fields. There is a possibility that raw data may be included in future releases of the controlled-access dataset."

cleaning_strategies:
  - cleaning_details: "Clinical data outside expected minimum and maximum ranges were flagged in REDCap and appeared in reports viewed by clinical research coordinators and data managers, who examined participant records to determine whether an error was likely. Data were checked for credibility using range checks to determine whether all responses fall within a prespecified reasonable range."
  - cleaning_details: "Records were checked for incorrect flow through prescribed skip patterns."
  - cleaning_details: "Records were checked for missing data that could be directly filled from other portions of an individual record, and for the omission or duplication of records."
  - cleaning_details: "Editing was only done under the guidance and approval of the site principal investigator. If corrected data were available elsewhere in the respondent answers the error was corrected; if there was no logical or appropriate way to correct the data, the site principal investigator reviewed the values and decided whether they should be removed."
  - cleaning_details: "Internal review by AI-READI team members was performed for quality checks and to ensure that no personally identifiable information was accidentally included. The dataset has not undergone any formal external audit."

preprocessing_strategies:
  - preprocessing_details: "Clinical data collected through REDCap were mapped to the Observational Medical Outcomes Partnership Common Data Model, with each CSV file in the clinical_data directory a one-to-one mapping to an OMOP CDM table. A dqd_omop.json file supports data quality analysis with the OMOP CDM Data Quality Dashboard, which runs more than 3,500 data quality checks."
  - preprocessing_details: "Retinal imaging exported in proprietary formats was converted to the DICOM standard prior to upload; Topcon .fda and Heidelberg .sdt files were converted for the dataset."
  - preprocessing_details: "Wearable activity monitor data exported in .FIT format and continuous glucose monitor data were converted to the Open mHealth standard."
  - preprocessing_details: "Electrocardiogram data were placed in the WaveForm DataBase (WFDB) format and environmental sensor data in the NASA ASCII file format for Earth science data."
  - preprocessing_details: "The whole dataset is organised following the Clinical Dataset Structure specification v0.1.1: one directory per data type at the root, one directory per modality within each data type, one per device within each modality, and one per participant within each device, accompanied by manifest.tsv, participants.tsv, dataset_description.json, dataset_structure_description.json, study_description.json, healthsheet.md, README.md, CHANGELOG.md and LICENSE.txt metadata files."
  - preprocessing_details: "Protected health information was removed from the public release, together with information related to sex, race and ethnicity and medications used. Processing evolved across versions, from custom and ad hoc handling for version 1.0.0 to a mix of automated and custom processing for versions 2.0.0 and 3.0.0."

