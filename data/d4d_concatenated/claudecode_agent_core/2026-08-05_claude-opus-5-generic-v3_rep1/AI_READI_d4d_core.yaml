anomalies:
  - anomaly_details: "In survey data, skipped questions or incomplete responses are expected."
  - anomaly_details: "In wearable data, improper use, technical failure such as battery failure, and system malfunction are expected."
  - anomaly_details: "In imaging data, participant non-cooperation, noise that may obscure the images, technical failure such as system malfunction, and data transfer failures are expected."
  - anomaly_details: "Optomed Aurora images are acquired undilated with a handheld camera in a dark room, so it is challenging to obtain a good view and image quality varies from participant to participant and within the same participant."
  - anomaly_details: "Fluorescence lifetime imaging ophthalmoscopy takes longer than a standard Spectralis OCT and exposes participants to uncomfortable levels of light, so it is performed as the last modality of a visit and participants may not be at their best possible compliance."
  - anomaly_details: "For the Heidelberg Spectralis, the machine is operated by the imaging team and is not fully automated, so quality issues may arise which may lead to skipping this modality and missing data."

known_biases:
  - bias_type: selection_bias
    bias_description: "Participants are volunteers, so there is selection bias known as volunteer bias, which may limit the generalisability of results among those who are not represented in the study population. Recruitment is drawn from patients who had an encounter with one of three academic health systems and requires that participants speak, read and understand English."
    affected_subsets:
      - "Non-English speakers, who are excluded"
      - "Hispanic and Asian participants, whose recruitment the protocol notes may be affected by the English requirement"
      - "People without internet access, who must call research staff for alternative methods of enrolment"
    mitigation_strategy: "Individuals without internet access may call research staff for alternative enrolment methods; transportation assistance through rideshare services was offered to participants who reported barriers to reaching study visits; a supplement was submitted to fund translation of study materials into Spanish."
  - bias_type: representation_bias
    bias_description: "Although the cross-sectional design ultimately aims for balance across race and ethnicity, biological sex and diabetes presence and severity, interim releases are not balanced across these parameters because enrollment is ongoing. Recruitment is predominantly urban and hospital-based, which may not fully capture diverse cultural and socioeconomic backgrounds, and the cohort does not include other races and ethnicities such as Pacific Islanders and Native Americans."
    affected_subsets:
      - "Pacific Islander and Native American populations, not represented"
      - "Rural and non-hospital-attending populations"
      - "Racial, sex and severity strata under-enrolled at the time of each interim release"
    mitigation_strategy: "Three sites were strategically selected for geographic diversity, with all demographic groups recruited at all three sites; recruitment composition is monitored and adjusted by under- and oversampling groups as needed; recommended train, validation and test splits balance the validation and test sets for sex, race and ethnicity and diabetes status; the project engages with the Native Biodata Consortium and planned a tribal consultation regarding data from a Native American cohort."
  - bias_type: sampling_bias
    bias_description: "The study base is identified by screening electronic health records for ICD-10 diagnosis codes, and participants are recruited in non-probability waves from that base, so people who do not have recent encounters with these health systems or whose conditions are not coded cannot be sampled. It is a well-documented observation in health research that recruiting Black men into studies is more difficult than recruiting other populations, and similar under-recruitment trends have been reported for Hispanic and Asian persons, while these populations bear a disproportionate burden of type 2 diabetes."
    affected_subsets:
      - "Black men"
      - "Hispanic persons"
      - "Asian persons"
    mitigation_strategy: "The study monitors recruitment composition and states that if sample balancing on race and ethnicity emerges as a challenge, new recruitment strategies will be implemented; identified strategies include tailoring printed materials and using a personalised, participatory approach to recruitment. Invitation letters and emails are personalised, and a Community Advisory Board of eleven persons from the three sites, with diversity in race and ethnicity as represented in the sample, contributes to protocol development."
  - bias_type: measurement_bias
    bias_description: "Measurement quality is documented as non-uniform across devices and operators. The bundle records that the Optomed handheld undilated camera and the Heidelberg Spectralis require substantial operator involvement and can produce operator-induced noise, whereas the Topcon Triton and Maestro2 position automatically with minimal operator intervention, and that multiple different device models are used for the same measure across sites, for example three blood pressure monitors and three lensometers. The bundle does not itself label this as bias; the healthsheet states that uniform data collection protocols were applied to all subjects regardless of race, sex or diabetes severity, and that multiple devices were included deliberately."
    affected_subsets:
      - "Retinal imaging modalities that are not fully automated"
      - "Measures acquired with different device models across the three sites"
    mitigation_strategy: "Uniform data collection protocols were implemented for all subjects irrespective of race and ethnicity, biological sex or diabetes severity across all study sites; device make, model and scan protocol were documented to ensure repeatability; multiple devices were deliberately included for one measure to enhance generalisability and represent the range of equipment used in clinical settings."

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: "The cohort is intentionally balanced rather than demographically representative of the United States population, is drawn from three urban academic health systems, and omits groups such as Pacific Islanders and Native Americans."
    scope_impact: "Models derived from the dataset may not generalise to populations, settings or racial and ethnic groups outside those recruited."
    recommended_mitigation: "Treat the balanced design as a training-set property rather than a population estimate; do not use the group proportions as prevalence estimates."
  - limitation_type: temporal_limitation
    limitation_description: "The dataset is cross-sectional with a single study visit per participant, plus a 10-day at-home monitoring window; only about 4 to 10 percent of participants are anticipated to return for a follow-up visit in year 4 of the project. Version 3.0.0 covers only 19 July 2023 to 1 May 2025."
    scope_impact: "Longitudinal disease trajectories cannot be observed directly within this release; the design instead supports pseudotime analysis across participants with differing severity."
  - limitation_type: coverage_limitation
    limitation_description: "The public release withholds sex, race and ethnicity, medications, 5-digit zip code, genetic sequencing data, past health records and traffic and accident reports, which are held under controlled access requiring a data use agreement. Not all modalities are present for all participants, and the Snellen visual acuity variables were dropped in version 3.0.0."
    scope_impact: "Fairness auditing by demographic subgroup, medication-adjusted analyses and geospatial analyses are not possible using the public tier alone."
    recommended_mitigation: "Apply for the controlled-access tier through the data use agreement process; use the published aggregate split counts for coarse subgroup context."
  - limitation_type: scope_limitation
    limitation_description: "The dataset is intended solely as a research resource and the license forbids making clinical treatment decisions based on it. A related limitation of the biorepository is that there are a finite number of samples to share with scientists interested in using them in research; procedures for reviewing and prioritising written requests were still to be developed at the time of the protocol publication."
    scope_impact: "Clinical deployment and unlimited biospecimen-based follow-up work are out of scope."
  - limitation_type: methodological_limitation
    limitation_description: "Participation requires the ability to speak, read and understand English; pregnancy, gestational diabetes and type 1 diabetes are exclusions; accessibility measurements were not specifically assessed when the study was designed and implemented. No labels or target variables are provided, since the dataset is hypothesis agnostic, and no formal guidelines exist for researchers creating new labels or defining new tasks."
    scope_impact: "Supervised task definition is left entirely to the data user, and language and eligibility criteria constrain who is represented."
    recommended_mitigation: "The project offered transportation assistance through rideshare services to participants reporting barriers to reaching study visits, and submitted a funding supplement for translation of study materials into Spanish."

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: "The version 3.0.0 healthsheet states that the dataset does not contain data that might be considered confidential and that no personally identifiable information is included. That answer is not scoped in the source; note that the same healthsheet describes a controlled-access tier, gated behind institutional legal and privacy use agreements, that additionally contains 5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records, medications and traffic and accident reports."

sensitive_elements:
  - sensitivity_details: "The version 3.0.0 healthsheet states that the public dataset does not contain data considered sensitive, but that the controlled-access dataset contains data regarding racial and ethnic origins, location in the form of 5-digit zip code, and motor vehicle accident reports; elsewhere the same source lists sex, ethnicity, genetic sequencing data, past health records and medications as controlled-access items. The public release additionally excludes information related to sex and race and ethnicity to prevent stigmatisation of findings. Because this record's referent is the version 3.0.0 release as a whole, which comprises both tiers, no single presence flag is asserted."

is_deidentified:
  method: "Removal of Protected Health Information as defined by the HIPAA Privacy Rule using the Safe Harbor method, together with removal of participant sex, race and ethnicity and medication information from the public release."
  deidentification_details: "The sources in the bundle characterise the de-identification status differently and are not reconciled here. The version 3.0.0 dataset_description metadata record a de-identification type of NoDeIdentification with the explanation that no identifiers were collected so no active de-identification was necessary, but that the project checked that no identifiable data per US HIPAA were present in the data; the same record sets deIdentDirect and deIdentHIPAA to true and deIdentDates, deIdentNonarr and deIdentKAnon to false. The Nature Metabolism comment describing the project states that the public set is stripped of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe Harbor method, as well as information related to the sex and race or ethnicity of participants to prevent stigmatisation of findings. The composition section of the healthsheet leaves the question about re-identification safeguards for de-identified data unanswered. Participant directories are keyed to study identifiers. Raw data are retained internally but not shared, partly because free-text fields may accidentally contain personal health or personally identifiable information."

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes mellitus
    examples:
      - "Training AI and machine learning models on multimodal data spanning survey, clinical, laboratory, imaging, waveform, wearable and environmental domains"
      - "Multimodal model development to improve understanding of a complex multifactorial disease"
      - "Development of models for defining disease trajectories and underlying links across diabetes severity groups"
    usage_notes: "All data are stored and shared using FAIRhub as AI-ready, which is intended to enable immediate AI and machine learning research without reformatting and preprocessing. Access requires login through a verified ID system, agreement to use the data only for type 2 diabetes related research, and acceptance of the custom license terms."
  - use_category: Salutogenesis research
    examples:
      - "Study of the pathway from type 2 diabetes back to health, the opposite of studying how healthy people proceed through pathogenesis to type 2 diabetes"
      - "Pseudotime manifold analysis to reconstruct a temporal atlas of type 2 diabetes development and reversal towards health"
    usage_notes: "The protocol was deliberately designed to be agnostic to hypotheses and to existing classification criteria, assembling assessments from many health domains likely to be impacted by type 2 diabetes."
  - use_category: Data engineering and pipeline development
    examples:
      - "Building and testing ingestion and analysis pipelines against a multi-terabyte, multi-standard clinical dataset organised under the Clinical Dataset Structure specification"
    usage_notes: "A separate smaller mini version of the dataset containing 100 participants, DOI 10.60775/fairhub.4, is available specifically for pipeline development."

prohibited_uses:
  - prohibition_reason: "Licensees shall not make clinical treatment decisions based on the data, as it is intended solely as a research resource."
  - prohibition_reason: "Licensees shall not use or attempt to use the data, alone or in concert with other information, to compromise or otherwise infringe the confidentiality of information on an individual who is the source of any data, or their right to privacy; to identify or contact any individual data subject or group of data subjects; to extract or extrapolate any identifying information about a data subject; to establish a data subject's membership in a particular group of persons; or otherwise to cause harm or injury to any data subject."
  - prohibition_reason: "Licensees shall not transfer, license, sublicense, sell, assign, display, share or otherwise convey any portion of the data or any derivative work to any third party other than another licensee bound by an agreement with the Licensor on identical terms."
  - prohibition_reason: "Models, algorithms and programs trained on the data may be distributed only if they do not themselves contain the data or a modified version of it, and only after the licensee has undertaken all reasonable efforts to minimise the likelihood that data can be memorised, derived, reconstructed or reconstituted through the use or construction of such models."
  - prohibition_reason: "The public version of the dataset may be used only for type 2 diabetes related research; users must agree to this restriction as a condition of access."

future_use_impacts:
  - impact_details: "There is a theoretical risk of future re-identification. AI algorithms can infer individual patient characteristics and could facilitate individual-level identification, so the project implements a robust data dissemination system, a strict licence agreement and data watermarking for both the public and controlled sets."
  - impact_details: "Because enrollment is ongoing, the pilot data release and periodic updates to data releases may not have achieved balanced distribution across race and ethnicity, sex and diabetes severity groups; models trained on an interim release may inherit that imbalance."
  - impact_details: "Predominantly urban and hospital-based recruitment, the absence of groups such as Pacific Islanders and Native Americans, and the English-language requirement limit the generalisation of potentially derived models."
  - impact_details: "The dataset creators state that, to the extent of their knowledge, they do not currently anticipate any uses of the dataset that could result in unfair treatment or harm."

distribution_dates:
  - release_dates:
      - "2024-05-03"
      - "2024-11-08"
      - "2025-11-17"

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: "Version 3.0.0 is recorded in the FAIRhub structured metadata as released under the AI-READI custom license v2.0, https://doi.org/10.5281/zenodo.17555036, described there and in the README as a license specifically tailored to enable reuse of the AI-READI dataset and other clinical datasets for commercial or research purposes while imposing strong requirements around data usage, security and secondary sharing to protect study participants, especially where data are reused for artificial intelligence and machine learning applications. The text of v2.0 is not present in the source bundle, so its clauses are known only from that one-sentence characterisation; the FAIRhub dataset page for the same record instead displays the license as 'Health Data License'. The license text that is present in the bundle is the earlier v1.0 University of Washington Data License Agreement, https://doi.org/10.5281/zenodo.10642459, and the following clause summary applies to v1.0 only: it grants a non-exclusive and non-transferable license to download, reproduce and use the data and to create derivative works for research and commercial purposes; restricts onward conveyance to other licensees bound by identical terms; permits distribution of models that do not contain the data subject to anti-memorisation efforts; forbids clinical treatment decisions and any re-identification attempt; requires acknowledgement of the source and any funder in publications; requires compliance with NIH Genomic Data Sharing Policy security standards; provides the data on an as-is basis with no warranty; caps aggregate Licensor liability at one US dollar; requires indemnification of the Licensor; and terminates automatically upon breach, after which all copies must be deleted. Access to version 3.0.0 additionally requires login through a verified ID system and agreement to use the data only for type 2 diabetes related research. The permission structure is tiered and cannot be fully captured by the single data_use_permission value recorded here: the public tier is restricted to type 2 diabetes related research, while the license itself contemplates research and commercial purposes and the dataset consent metadata state that a private version will allow more generic use."
  contact_person: contact@aireadi.org

ip_restrictions:
  restrictions:
    - "Title to the data and all industrial and intellectual property rights in it remain solely and exclusively with the Licensor, the University of Washington, and its suppliers; any rights not expressly granted in the license are reserved to the Licensor and its suppliers."
    - "The licensee shall not take any action inconsistent with the Licensor's ownership of the data."
    - "The licensee is permitted to make, reproduce and distribute models, algorithms and programs developed, trained or adapted using the data, provided these do not themselves contain the data or any modified version of the data."
    - "All full and partial copies of the data made by the licensee are subject to the terms of the license agreement."

regulatory_restrictions:
  regulatory_restrictions:
    - "Licensees must comply with all data security and privacy standards established by the US National Institutes of Health under its Genomic Data Sharing Policy, currently the NIH Security Best Practices for Controlled-Access Data Subject to the NIH Genomic Data Sharing Policy."
    - "Licensees must comply with all applicable laws, regulations and restrictions relating to the distribution and use of the data and of models derived from it."
    - "Access is gated: the dataset metadata record an access type of PublicDownloadSelfAttestationRequired, requiring login through a verified ID system, self-attestation that the data will be used only for type 2 diabetes related research, and acceptance of the license; the full dataset is available only under a data use agreement."
  other_compliance: "Protected health information as defined by the HIPAA Privacy Rule is removed from the public release via the Safe Harbor method, and the project states that it checked that no identifiable data per US HIPAA were present; the sources do not, however, record a formal HIPAA compliance determination for the dataset. Study oversight metadata record the study as not FDA-regulated for either drug or device and with no data monitoring committee. Individual results returned to participants are sent by HIPAA-compliant encrypted email."
  governance_committee_contact: https://aireadi.org/contact

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: "AI-READI was approved by the Institutional Review Board of the University of Washington under approval number STUDY00016228, with initial approval received on 20 December 2022 and reliance agreements with the Institutional Review Boards of the University of Alabama at Birmingham and the University of California, San Diego. An annual renewal application to the IRB reporting the status and progress of the study is required and due within 90 days of expiration. The initial approval letter is distributed with the dataset documentation. The study is registered on ClinicalTrials.gov as NCT06002048, and written informed consent is provided by all participants."
    contact_person: Aaron Y. Lee, study principal investigator, contact@aireadi.org
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: "A Community Advisory Board of eleven persons from the three sites, including diversity in race and ethnicity as represented in the AI-READI sample, contributes to the development of the protocol and, per the IRB protocol, evaluates the consent forms and research protocols with its feedback considered in protocol modifications. This is patient and public involvement rather than institutional ethical review: patients and members of the public were involved in the design, conduct, reporting and dissemination plans of the research. The project also draws on guidance from bioethicists and considers ethical, legal and social implications at every stage of the project cycle."

human_subject_research:
  involves_human_subjects: true
  irb_approval: "University of Washington IRB approval number STUDY00016228, initial approval 20 December 2022, with annual continuing review; ClinicalTrials.gov registration NCT06002048."
  ethics_review_board: "University of Washington Institutional Review Board, with reliance agreements from the Institutional Review Boards of the University of Alabama at Birmingham and the University of California, San Diego."
  regulatory_compliance: "Study oversight metadata record the study as not FDA-regulated for drugs or devices, with human subject review status submitted and approved and no data monitoring committee. All research personnel who recruited, enrolled and collected data completed mandatory institutional compliance training for human subject research and a certification process, including administering all protocol elements to at least three volunteer practice subjects before enrolling participants."
  special_populations: "No protected population is targeted. Participants are adults; pregnancy, gestational diabetes and type 1 diabetes are exclusion criteria. The sources differ on the upper age bound: the BMJ Open protocol and the healthsheet state inclusion as aged 40 and older with no upper limit, while the FAIRhub study eligibility metadata record a maximum age of 85 years and the IRB protocol lists adults older than 85 years of age as an exclusion. The study eligibility metadata also record that healthy volunteers are not sought outside the defined no-diabetes group."

informed_consent:
  - consent_obtained: true
    consent_type: "Written informed consent, obtained either remotely as electronic consent with an electronic signature through REDCap, by computer, tablet or smart phone, or in person at the start of the visit for participants who did not select the electronic option."
    consent_scope: "Consent covers the entire protocol including questionnaires, on-site physical, ophthalmic, cardiac, neuropathy and cognitive assessments, blood and urine collection for clinical assays and for biobanking of derivatives for future genomic, proteomic, metabolomic, immunological and gene expression studies, 10 days of at-home continuous glucose, activity and environmental monitoring, abstraction of medical and driving and accident records, and placement of de-identified data in an open-access repository. The dataset consent metadata classify the consent as ConsentSpecifiedNotElsewhereCategorised, noting that the public version can only be used for type 2 diabetes related research while a private version allows more generic use."
    consent_documentation: "The approved consent form for the principal project site, the University of Washington, is distributed with the dataset documentation at https://docs.aireadi.org/v3/AI-READI%20Consent_Form_Standard_Mod17May2023_useforpilot.pdf. The other clinical sites had IRB reliance and used the same consent form with minor institution-specific language incorporated according to individual institutional requirements. Signed electronic consents are automatically emailed to the participant, and additional copies can be requested from the study coordinator for the duration of the study."
    withdrawal_mechanism: "Participants are permitted to withdraw consent at any time and cease study participation. Any data that had been shared or used up to that point would stay in the dataset, and this is clearly communicated in the consent document."

maintainers:
  - maintainer_details: "The AI-READI team supports and maintains the dataset. It is hosted on FAIRhub, https://fairhub.io, a Microsoft Azure cloud-based data management, curation and sharing platform developed for this project, with cloud services supported by the Microsoft AI for Good Lab. Contact information is provided in the README file included with the dataset and through https://aireadi.org/contact, with a central study contact email of contact@aireadi.org."
    role: academic_institution

updates:
  frequency: Approximately annual
  update_details: "The dataset is released as static versions and is not updated in place; new versions are released with additional instances as more study participants complete the study visit. Version 1.0.0, the pilot with 204 participants, was released on 3 May 2024; version 2.0.0, adding 863 participants for a total of 1,067, on 8 November 2024; version 3.0.0, adding 1,213 participants for a total of 2,280, on 17 November 2025. Further versions are expected while enrollment continues towards the target of 4,000 participants. Changes between versions are documented in detail in the CHANGELOG file included with the dataset and visible at docs.aireadi.org."

version_access:
  versions_available:
    - "1.0.0, DOI 10.60775/fairhub.1, released 3 May 2024, pilot phase, 204 participants, 15 or more data types, custom and ad hoc processing"
    - "2.0.0, DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants, 2.01 TB across 165,051 files, one additional imaging device, automated plus custom processing"
    - "3.0.0, DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants, 3.82 TB across 356,343 files, three additional imaging devices, automated plus custom processing"
  latest_version_doi: 10.60775/fairhub.3
  version_details: "One version of the documentation is associated with each dataset version and can be selected from the version dropdown at docs.aireadi.org. The FAIRhub record for version 2.0.0 states that that version of the dataset is no longer accessible and directs users to the latest version, and the version 2.0.0 documentation carries the same notice; the healthsheet answer about supporting older versions is recorded as not applicable on the grounds that the dataset is re-versioned rather than updated. Data fields are largely the same between versions 2.0.0 and 3.0.0, except that the Snellen visual acuity variables were dropped so that only logMAR visual acuity measurements remain. A separate mini version containing 100 participants, DOI 10.60775/fairhub.4, is published as a child record for pipeline development; the sources describe it as a distinct mini version rather than a version of this dataset and do not state the nature of the relationship."

retention_limit:
  retention_details: "There are no limits on the retention of the data associated with the instances; participants were not told that their data would be retained only for a fixed period and then deleted. Raw data are saved and expected to be preserved by the AI-READI project at least for the duration of the project, though they are not currently shared outside the project team."

external_resources:
