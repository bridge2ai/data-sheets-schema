purposes:
  - response: "To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset that enables future generations of artificial intelligence and machine learning research to provide critical insights into type 2 diabetes mellitus, including salutogenic pathways back to health."
  - response: "To collect data specifically designed to permit downstream pseudotime manifold analysis, an approach used to predict disease trajectories by learning from complex multimodal data from participants spanning the full range of disease severity from no diabetes to insulin-dependent type 2 diabetes."
  - response: "To develop a foundational dataset in type 2 diabetes that is hypothesis agnostic and agnostic to existing classification criteria or biases, from which a temporal atlas of disease development and reversal towards health can be reconstructed."
  - response: "To establish and demonstrate standards, best practices and guidelines for the collection, preparation and sharing of AI-ready biomedical datasets that future data generation projects can follow, with adherence to the Findable, Accessible, Interoperable, Reusable principles."
  - response: "To increase access to and quality of AI and machine learning research by recruiting and training personnel, including a year-long research internship programme at the intersection of biomedicine and AI."

tasks:
  - response: "Training and evaluation of artificial intelligence and machine learning models on multimodal type 2 diabetes data without the reformatting and preprocessing normally required, since the data are stored and shared as AI-ready."
  - response: "Pseudotime manifold analysis to reconstruct disease trajectories across diabetes severity stages using dimensionality reduction."
  - response: "Multimodal model development that combines survey, clinical, laboratory, retinal imaging, electrocardiographic, wearable and environmental sensor data for a single participant."

addressing_gaps:
  - response: "A major barrier to AI in health research has been the lack of diverse datasets that are AI ready for training AI models; the ability to understand and affect the course of complex multi-organ diseases such as type 2 diabetes has been limited by a lack of well-designed, high quality, large and inclusive multimodal datasets."
  - response: "A meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020 indicated that samples lacked racial and ethnic diversity; AI-READI is designed as a demographic improvement over many previous epidemiological studies and clinical trials on type 2 diabetes."
  - response: "The multi-domain acquisition protocol was designed to enable downstream AI and machine learning analyses that may not be feasible with existing data sources such as claims or electronic health records data."
  - response: "Current understanding of type 2 diabetes, especially in the context of salutogenesis, is limited, and the dataset is intended to support study of the pathway from disease to health rather than only pathogenesis."

instances:
  - instance_type: "An individual human research participant; each instance consists of all of the data available for one individual participating in the AI-READI study."
    counts: 2280
    data_substrate: "Tabular survey and clinical records, DICOM ophthalmic imaging, physiological waveform data, and time-series readings from wearable and environmental sensors. There is no unstructured free-text data in the dataset."
    data_topic: "Type 2 diabetes mellitus and its multisystem consequences, including retinal and ophthalmic health, cardiac and metabolic laboratory markers, kidney and liver function, peripheral neuropathy, cognition, physical activity and sleep, continuous glucose, indoor environmental exposure, and social determinants of health."
    missing_information: "Not all modalities are available for all participants. Some participants elected not to participate in some study elements; in a few cases the data collection device held no stored results or was returned too late to retrieve results, for example because a battery died or data were lost; and in a few cases a data collision during processing led to lost data. Per-directory file counts published for version 3.0.0 are consistent with this: 2,246 files in the continuous glucose monitoring directory and 2,232 in the environmental sensor directory against 2,280 enrolled participants, so coverage is not complete for every modality."

subpopulations:
  - identification: "The healthsheet for version 3.0.0 states that the dataset does not identify demographic sub-populations at the level of individual instances. Individual-level sex, race and ethnicity labels are withheld from the public release and held under controlled access, so subgroup membership cannot be resolved per participant in the public tier. Aggregate subgroup counts are nevertheless published for the release as a whole and for each recommended split."
    distribution: "Aggregate counts for the whole 2,280-participant release are published in the dataset README. Race and ethnicity: Hispanic 380, Asian 545, Black 519, White 836. Sex: male 951, female 1329. Diabetes status: no diabetes 776, pre-diabetes or lifestyle-controlled 560, oral or non-insulin injectable medication controlled 686, insulin controlled 258. Mean age 60.8 years with a standard deviation of 11.3 years. The overall enrollment goal is a balanced distribution between racial groups, sexes and diabetes severity groups, and because enrollment is ongoing the periodic data releases may not have achieved balanced distribution across groups."

