    future_guarantees: "The dataset is self-contained but relies on the dataset documentation for users requiring additional information about its provenance; one documentation version is maintained for each dataset version, and the documentation, project website, Zenodo community and GitHub organisation are maintained by the AI-READI project."
    restrictions:
