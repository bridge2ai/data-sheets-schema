acquisition_methods:
  - was_directly_observed: true
    acquisition_details: "Directly observable data include vitals, anthropometry, 12-lead electrocardiography, monofilament testing, cognitive screening, visual function testing, autorefraction, retinal imaging, blood and urine laboratory assays, and the 10-day at-home continuous glucose, wearable activity and home environmental sensor readings. All research personnel who recruited, enrolled and collected data underwent training by the data manager at the University of Alabama at Birmingham against a detailed Manual of Procedures, and had to administer all protocol elements to at least three volunteer practice subjects before enrolling participants."
  - was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: "Subject-reported data include the screening questionnaire, demographics, the CES-D-10 depression screen, the PAID-5 diabetes distress measure, the diabetes self-care score, dietary assessment, ophthalmic survey, smoking, alcohol, vaping and marijuana history, general health history, PhenX social determinants of health surveys, and the current medications list coded with RxNorm. Verification of data entry was performed where possible, for example by cross-referencing entered medications against medications that were physically brought in or photographed by the participant. The healthsheet states that acquisition varied by domain and does not characterise any part of the dataset as inferred or derived."

collection_mechanisms:
  - mechanism_details: "REDCap was used for the recruitment interface, electronic consent, patient-reported questionnaire data, and the following clinical data from the visit: medications assessment, vitals, visual acuity, contrast sensitivity, monofilament test results and complete blood count results."
  - mechanism_details: "Retinal imaging was performed with seven devices: the Optomed Aurora IQ handheld undilated fundus camera, the iCare Eidon widefield truecolor confocal fundus system, the Heidelberg Spectralis HRA OCT and OCTA, the Heidelberg FLIO fluorescence lifetime imaging ophthalmoscope, the Topcon Maestro2 3D OCT-1, the Topcon Triton DRI OCT, and the Zeiss Cirrus 5000. Both eyes are imaged on every participant and all retinal images are collected under dilated conditions except for the Optomed. Devices export in native formats, with Topcon .fda and Heidelberg .sdt files converted to DICOM for the dataset."
  - mechanism_details: "A 12-lead electrocardiogram is performed with the Philips PageWriter TC30 cardiograph and exported as .xml to local storage before conversion for the dataset."
  - mechanism_details: "The Dexcom G6 continuous glucose monitor is applied at the visit and worn for 10 days; participants are masked to the readings and return the device by overnight mail or in person."
  - mechanism_details: "The Garmin Vivosmart 5 physical activity monitor records steps, heart rate, sleep duration, oxygen saturation, respiration rate, activity type and stress level over the same 10-day period; data are exported in .FIT format and converted to the Open mHealth standard for the dataset."
  - mechanism_details: "A custom-designed home environmental sensor built at the Karalis Johnson Retina Center, University of Washington, known as the LeeLab Anura, records ambient temperature, relative humidity, nitrogen oxides, volatile organic compounds, particulate matter at PM1.0, PM2.5, PM4 and PM10, and eleven multi-spectral light intensity measurements. The environmental sensor and the fitness tracker were specifically chosen with participant privacy as a primary concern: they capture no video or audio, have no GPS location monitoring, and are not synced with participant-owned devices."
  - mechanism_details: "Clinical laboratory assays: Clinical Laboratory Improvement Amendments-certified laboratories local to each site perform complete blood count testing on fresh whole blood; all other assays are performed by the University of Washington Nutrition and Obesity Research Center on stored frozen samples, with results supplied in .csv format. Blood derivatives are sent to the biorepository at the University of Alabama at Birmingham Center for Clinical and Translational Science."
  - mechanism_details: "Bedside instruments include automatic oscillometric blood pressure devices (OMRON HEM 907XL, Medline MDS4001, Welch Allyn 6000 series), the M and S Technologies Electronic Visual Acuity tester, the Mars letter contrast sensitivity chart, the Topcon KR 800 autorefractor, NIDEK and Topcon lensometers, a 10 g monofilament for peripheral neuropathy testing, and an iPad running the MoCA Duo application for cognitive screening."
  - mechanism_details: "Recruitment pools were identified by screening electronic health records at each site for ICD-10 diagnosis codes R73.09 for pre-diabetes and E11.X for type 2 diabetes among patients aged 40 and older with a medical encounter within the site health system; patients without these codes formed the no-diabetes pool."

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: "Collection window for version 3.0.0 of the dataset, as recorded in the dataset description metadata and the README: 19 July 2023 to 1 May 2025, covering the first two years of the study."
  - start_date: '2023-07-18'
    end_date: '2023-11-30'
    timeframe_details: "Preliminary pilot enrolment period recorded in the BMJ Open protocol publication, run in order to secure sufficient familiarity for all coordinators. The protocol gives enrolment as beginning 18 July 2023, one day earlier than the collection start date recorded in the dataset metadata. Preliminary data from the pilot enrollment period were included in the first released dataset version."
  - start_date: '2023-12-01'
    end_date: '2026-11-30'
    timeframe_details: "Formal data collection began 1 December 2023 and, per the BMJ Open protocol, enrolment was planned to continue until 30 November 2026. The overall project spans four years, one year for protocol development and training and years two to four for recruitment and data collection, with an anticipated study completion date of 1 January 2027 in the FAIRhub study metadata."

data_collectors:
  - collector_details: "Clinical research coordinators and study coordinators at the three sites contacted and consented participants, ushered them through the visit, conducted study visits including collection of ophthalmic images, trained participants on continuous glucose monitoring and the fitness tracker, and ensured return of study materials. All coordinators had to complete mandatory institutional compliance training for human subject research and a certification process, and administer all protocol elements to at least three volunteer practice subjects before enrolling participants."
    role: researcher
  - collector_details: "Retinal imaging technicians acquired the ophthalmic imaging and were trained to detect potentially life- or vision-threatening conditions, specifically retinal detachment, tumour and optic disc oedema, and to trigger immediate follow-up when suspected."
    role: researcher
  - collector_details: "Phlebotomists collected blood from participants and laboratory assistants processed and shipped samples; local processing of plasma, serum and buffy coats used standardised operating procedures at each site."
    role: researcher
  - collector_details: "Data managers at each site oversaw the collection process and were responsible for quality control of all data before uploading to FAIRhub; a central project team performed further processing and standard mapping before dissemination."
    role: researcher
  - collector_details: "Compensation: the effort of AI-READI team members involved in data collection was supported by National Institutes of Health award OT2OD032644 based on percentage of effort contributed, with salaries aligned to the funding guidelines at each site."
    role: academic_institution

sampling_strategies:
  - is_random: false
    is_representative: false
    strategies:
      - "Triple balancing: participants are recruited in approximately equal proportions across four race and ethnic groups (Asian, Black, Hispanic, White), four categories of type 2 diabetes severity (no diabetes; pre-diabetes or lifestyle-controlled; controlled by oral or non-insulin injectable medications; insulin-controlled), and biological males and females."
      - "Recruitment in waves, with the composition and size of each wave influenced by the observed participation characteristics of race and ethnicity, gender, severity and site according to health records, and adjusted by under- and oversampling groups as needed."
      - "Geographic stratification across three sites chosen for diverse recruitment, with each site prioritising the groups most prevalent in its area while recruiting all groups."
      - "Sources in the bundle characterise the relationship between the release and the larger population differently and are not reconciled here. The version 3.0.0 healthsheet states that the dataset contains all possible instances, meaning all participants enrolled to date, and answers the sampling-strategy question 'N/A'. The FAIRhub study metadata records the study sampling method as a Non-Probability Sample drawn from a study base of all patients aged 40 and older with a medical encounter at one of the three health systems."
    why_not_representative: "Rather than targeting the demographic distribution of the United States population, the study deliberately recruits equal proportions of the four race and ethnic groups, because building balanced datasets is critical for the development of unbiased machine learning models. Participants are volunteers, so volunteer bias may limit generalisability. Recruitment is predominantly urban and hospital-based and may not fully capture diverse cultural and socioeconomic backgrounds, and the cohort does not include other races and ethnicities such as Pacific Islanders and Native Americans. The requirement that participants speak, read and understand English may also have created challenges in recruiting Hispanic and Asian persons."
    source_data: "The study base is all patients aged 40 years or older who had a medical encounter within each health system site (University of Alabama at Birmingham, University of California San Diego, University of Washington) between 2020 and 2025."

