name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: "The AI-READI dataset is a multimodal, cross-sectional clinical research dataset collected from individuals with and without type 2 diabetes mellitus (T2DM) and harmonised across three United States data collection sites: the University of Alabama at Birmingham, the University of California San Diego, and the University of Washington. Version 3.0.0 contains data from 2,280 participants collected between 19 July 2023 and 1 May 2025, comprising 356,343 files totalling approximately 3.82 TB. Modalities include survey and clinical data mapped to the OMOP Common Data Model, blood and urine laboratory results, 12-lead electrocardiography in WaveForm DataBase format, retinal photography, optical coherence tomography, optical coherence tomography angiography and fluorescence lifetime imaging ophthalmoscopy in DICOM, continuous glucose monitoring, wearable activity monitoring, and custom-built home environmental sensor data, the last two in Open mHealth and NASA ASCII formats respectively. Recruitment sampling procedures aimed at an approximately equal distribution of participants across diabetes severity, as stated in the version 3.0.0 dataset documentation; the version 3.0.0 healthsheet states the same aim across sex, race and diabetes severity. The design is intended to support downstream AI and machine learning research into salutogenesis, the pathway from disease to health, in T2DM. The publicly released version contains no protected health information; sex, race and ethnicity, medications, 5-digit zip code, genetic sequencing data, past health records and traffic and accident reports are held under controlled access."
