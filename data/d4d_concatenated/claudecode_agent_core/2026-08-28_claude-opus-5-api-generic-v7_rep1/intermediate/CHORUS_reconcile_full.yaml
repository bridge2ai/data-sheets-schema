purposes:
- response: >-
    To generate data for ML/AI applications aimed at characterizing acute and critical care illness,
    predicting complications, and measuring treatment response among patients with acute or critical
    illness.
- response: >-
    To develop a publicly available, AI-ready critical care dataset while ensuring the methods
    promote privacy, accountability, and clinical benefit.
- response: >-
    To provision a holdout test set, accessible for model external validation, to aid marketplace
    adoption of AI-developed models for implementation in acute and critical care.
- response: >-
    To create ethically sourced datasets and tools around artificial intelligence and to create best
    practices for AI in health, as one of four Bridge2AI data generation projects.
- response: >-
    To cultivate expertise in the lay and scientific community and improve AI literacy and
    utilization through multimodal educational approaches, promoting a new generation of AI
    clinicians and scientists.

tasks:
- response: Characterizing acute and critical care illness.
- response: Predicting complications and deterioration among patients with acute or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
- response: >-
    External validation of AI/ML models against a sequestered holdout test set.

addressing_gaps:
- response: >-
    There is an urgent need for infrastructure to support artificial intelligence and machine
    learning in critical care; developing high-resolution multi-center data sets is a critical first
    step towards actionable and trustworthy AI.
- response: >-
    Existing resources lack a diverse, high-resolution, ethically sourced, AI-ready data set able to
    answer the grand challenge of improving recovery from acute illness.
- response: >-
    Externally validated evidence for AI models in acute and critical care is lacking; the project
    sequesters holdout datasets to enable external validation.
- response: >-
    Multi-modal EHR, waveform, imaging, and text data are not harmonized across centers; unified
    standards are needed to make them interoperable.

