  role: other

extension_mechanism:
  extension_details: >-
    Data contributing sites submit extracts following the workflow and standard operating protocols in
    the Chorus_SOP repository and provide regular status updates either through the GitHub interface or
    via a submission form that updates issue and status information through the GitHub API. Clinical
    collaborators may contribute to semantic mapping and validation through the chorus-mapping
    repository and its clinical validation standard operating protocol. Problems with extract creation
    or submission are raised in the Standards or Data Acquisition discussion spaces, and software
    contributors work through the documented CHoRUS package repositories.
  contribution_url: https://github.com/chorus-ai

updates:
  update_details: >-
    Acquisition is ongoing toward an anticipated final dataset of 100,000 patient admissions, 9 data
    modalities, and 14 data contributing hospitals. As of August 2025, de-identification of a larger
    imaging cohort and extraction of EEG were in process, and published metadata was marked as planned
    for some modalities. Characterization reports are returned to sites following each data submission.

external_resources:
- external_resources: >-
    CHoRUS GitHub organization (https://github.com/chorus-ai), housing 28 repositories of software and
    tooling for interacting with clinical data, validated semantic mappings, standard operating
    protocols for contributing sites, and project management overviews; repositories include
    chorus-container-apps, Chorus_SOP, chorus_waveform, chorus_waveform_resources,
    chorus-extract-upload, privacy_scan_tool, CTP-deid, UF-Geocoding, CHoRUSReports, CADA,
    data_acq_SOP, cloud_public, and chorus-apps-internal.
  notes: The GitHub project states that it is licensed under the MIT License.
- external_resources: >-
    CHoRUS project website (https://chorus4ai.org/), with pages covering the team, project overview,
    tools, data acquisition, standards, community engagement, ethics, the dataset, and learning
    resources and opportunities.
- external_resources: Bridge2AI CHoRUS page (www.bridge2ai.org/chorus).
- external_resources: >-
    chorus-mapping repository, with documentation, pooled tabular mappings, and an associated clinical
    validation standard operating protocol for contributing to mapping efforts.

notes: >-
  The CHoRUS project website carried a site-wide banner reading "This repoitory is under review for
  potential modification in compliance with Administration directives" (spelling as published). The
  website also states that its content is solely the responsibility of the authors and does not
  necessarily represent the official views of the NIH.

source_caveats: >-
  The size of the released dataset differs between sources: project_documentation (tier 2) reports a
  current released dataset of 50,000 patient admissions from ICU, PICU, and NICU, while the
  cohort_2_webinar (tier 4) states that as of August 2025 the dataset covered 14 different hospitals
  with over 45K unique admissions. The higher-ranked project_documentation figure is used in this
  record. The two sources agree on 14 contributing hospitals. The NIH RePORTER abstract describes a
  target of more than 100,000 critically ill patients, matching the anticipated final dataset of
  100,000 patient admissions on the project website; these are project targets rather than released
  content. The per-modality table in the cohort_2_webinar source is interleaved in the extracted text,
  so data standards and access controls are legible but the assignment of metadata status to
  individual modalities is uncertain. The GitHub organization overview is a tier 5 historical
  documentation snapshot dated 2025-11-14 and is used here for software, workflow, and contact facts.
  No DOI, no total file count, and no dataset-wide size are stated by any source, and no single
  tabular/non-tabular characterization applies across OMOP tables, DICOM imaging, waveforms and
  tokenized text, so those slots are left unpopulated. The English-language requirement stated in the
  sources applies to training-program applicants rather than to the dataset content, so no content
  language is recorded. The dataset identifier is minted as a fragment on the attested project website
  URL because no persistent dataset identifier is published.