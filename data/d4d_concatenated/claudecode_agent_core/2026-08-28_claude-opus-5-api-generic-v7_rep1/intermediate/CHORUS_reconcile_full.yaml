id: https://chorus4ai.org/#chorus-dataset
name: CHoRUS
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset assembled by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH Common Fund's Bridge2AI program.
  Retrospectively collected clinical data from intensive care admissions at 14 data-contributing
  hospitals, within a network of 20 academic centers and more than 60 consortium members, are
  harmonized to community standards and made available under controlled access in a cloud enclave:
  structured electronic health record data (demographics, diagnoses, procedures, medication
  administration with dosing time-stamped at each infusion change or dose administration, and
  high-frequency nursing flowsheets) standardized to the OMOP Common Data Model; radiology imaging
  from PACS in DICOM; bedside monitor and gateway/middleware telemetry in WFDB; hospital EEG in
  EDF+ and Persyst formats; and clinical notes extracted and tokenized with the OHNLP toolkit,
  with the notes themselves retained locally at the contributing sites and only tokens released.
  The current released dataset comprises 50,000 patient admissions from ICU, PICU, and NICU care,
  1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform
  data; the anticipated final dataset covers 100,000 patient admissions across 9 data modalities.
  The project also sequesters a holdout test set for external validation of models. Alongside data
  acquisition, the project pursues an ethics pillar (community-facing focus groups on what data is
  appropriate for public sharing, and analysis of the legal and regulatory landscape) and a people
  pillar (team science, skill and workforce development).
page: https://chorus4ai.org/
keywords:
- critical care
