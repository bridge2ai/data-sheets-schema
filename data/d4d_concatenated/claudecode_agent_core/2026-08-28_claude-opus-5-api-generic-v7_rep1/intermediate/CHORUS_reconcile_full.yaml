  administration, procedures, nursing flowsheets, diagnoses); DICOM for imaging; WFDB (PhysioNet
  schema, extended) for waveform telemetry; EDF+ and Persyst for EEG waveforms; OHNLP open source
  schema for extracted and tokenized clinical notes.
