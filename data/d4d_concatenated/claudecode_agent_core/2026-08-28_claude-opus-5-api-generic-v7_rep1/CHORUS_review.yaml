notes: >-
  Adverse pattern: goals and plans in the bundle read as facts or gaps — the record turns
  'will harmonize' (line 1210), 'will label' (line 1212), 'Program Start Date November 17, 2025'
  (line 999) and the leadership roster (lines 171–190) into a current limitation, a current
  labeling environment, a use that began, and five principal investigators. Instrument
  findings for the validator rather than the verdicts: (1) six snippets receipted to
  `description` (the leadership names, lines 173–190) verify verbatim against the chunk but
  attest text that reconciliation removed from the description (report §3.1), so a verified
  snippet can point at a value that no longer exists — the #742 gap seen from the other side;
  (2) the receipt path `creators[0].principal_investigator.name` no longer resolves in the
  reconciled record (the pack flags it as reshaped), and the five sibling creators added at
  reconciliation have no receipt route at all; (3) the validator counted 74 receipted slots
  against 186, and the 112 without a receipt include phase-1 values, so `slots.without_receipt`
  cannot be read as 'rewritten by later phases' alone. The bundle's per-modality table
  (lines 260–375) is column-interleaved; the record's assignments (DICOM to imaging, WFDB and
  PhysioNet to telemetry, EDF+/Persyst to EEG) are the only orderings consistent with the row
  order, and the record caveats the 'Yes/Planned' metadata cells appropriately. Pack lists no gaps.
