  evidence: "report section 6 corrected four scalar-for-list mismatches (tools, release_dates, examples, external_resources); creators[*].principal_investigator is a scalar name per the slot's description (#360); no object sits in a string-ranged slot and both records validated"
notes: >-
  Independent second review; no existing *_review.yaml consulted. Two instrument
  observations, not verdicts: (1) the receipt's six description snippets citing the
  leadership roster (c003) are stale after reconciliation removed the roster from
  description — the known no-receipt-route path for reconcile edits; (2) the
  funders[0] caveat attributes the prose-over-structure choice to a schema digest
  that does not declare Grant fields, but the pack's schema does declare
  Grant.grant_number — if the API condition's digest genuinely truncates Grant,
  that is a condition-prompt gap worth an issue rather than a record defect.
