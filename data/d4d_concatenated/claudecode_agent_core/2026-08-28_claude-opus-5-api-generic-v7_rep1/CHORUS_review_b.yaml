  evidence: "the only minted identifier is the record's own id, which the schema forces (Dataset.id is identifier: true); no part-level fragment was minted, and unpointed parts — the holdout split, modality subsets — are described in prose (splits[0].split_details), which is the rule's remedy"
- id: rule-15
  verdict: violated
  evidence: "the receipt exists in correct form (bundle_md5 9b2ef4b65d67957f79362266cab0bc7a matches, chunks c001-c008 in order, closed statuses), but the rule's completeness clause — every bundle-supplied value appears in some chunk's receipt — fails: tasks[1]-[3] (line 45), raw_data_sources[3].source_description (lines 350-352), and intended_uses[1].examples (lines 45-46) are bundle-supplied yet receiptless; 16 of the 25 sampled receiptless slots resolved to bundle_supports, and 112 of 186 countable slots carry no receipt"
- id: rule-16
