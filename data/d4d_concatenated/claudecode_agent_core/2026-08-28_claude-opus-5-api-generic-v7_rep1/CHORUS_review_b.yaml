  evidence: "funders[0].notes holds award number OT2OD032701, amount, and project period in prose while the schema declares Grant with grant_number (schema line ~13006; Grant.id description even says 'The grant_number alone is a valid grant reference') and FundingMechanism declares grants — the record's own caveat concedes the choice, blaming a schema digest that the pack's schema files contradict; likewise Maintainer declares name, yet all four maintainer names/emails live only in maintainer_details prose"
