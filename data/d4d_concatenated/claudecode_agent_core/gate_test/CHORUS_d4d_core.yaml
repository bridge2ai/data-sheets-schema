id: bridge2ai:CHoRUS
name: CHoRUS
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset assembled by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  network, one of four data generation projects in the NIH Common Fund Bridge2AI consortium. The
  CHoRUS Network spans 20 academic centers, of which 14 contribute as data acquisition centers,
  and includes more than 60 consortium members. Data are collected retrospectively from hospital
  source systems and standardized to the OMOP Common Data Model, with imaging in DICOM, bedside
  telemetry waveforms in WFDB, EEG in EDF+ and Persyst formats, and unstructured clinical notes
  extracted and tokenized with the OHNLP toolkit. Nine data modalities are covered: demographics,
  medication administration, procedures, nursing flowsheets, diagnoses, clinical notes, imaging,
  waveform telemetry and waveform EEG. The anticipated final dataset covers 100,000 patient
  admissions; the released dataset described on the project website comprises 50,000 admissions
  from ICU, PICU and NICU settings, 1.6 billion rows of EHR OMOP data, 7,642 admissions with
  radiology data and 23 Tb of waveform data. All nine data types are under controlled access;
  OMOP data and telemetry are held in a cloud enclave, while clinical notes remain stored locally
  at contributing sites with only tokens placed in the enclave. The NIH award abstract states
  that the project will also provision a holdout test set for external validation of models. The
  dataset accounts for social determinants of health and contextual factors such as geographic
  distance to the nearest hospital.
status: In development, with a controlled-access release available
page: https://chorus4ai.org/
created_by: CHoRUS Consortium
was_derived_from: >-
  Clinical source systems at the 14 CHoRUS data acquisition hospitals, comprising electronic
  health record systems, picture archiving and communication systems (PACS), bedside monitor
  telemetry gateways/middleware, and hospital EEG databases.
conforms_to: >-
  OMOP Common Data Model for demographics, medication administration, procedures, nursing
  flowsheets and diagnoses; DICOM for imaging from PACS; WFDB for waveform telemetry; EDF+ and
  Persyst for waveform EEG; the OHNLP toolkit output format for extracted and tokenized clinical
  notes.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: CoreDataset
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - social determinants of health
  - AI-ready dataset
  - Bridge2AI

