purposes:
  - id: bridge2ai:CHoRUS#purpose-ai-ready-critical-care-data
    response: >-
      Generate data for ML/AI applications aimed at characterizing acute and critical care
      illness, predicting complications, and measuring treatment response among patients with
      acute or critical illness.
  - id: bridge2ai:CHoRUS#purpose-public-ai-ready-dataset
    response: >-
      Develop a publicly available, AI-ready critical care dataset while ensuring the methods
      promote privacy, accountability and clinical benefit.
  - id: bridge2ai:CHoRUS#purpose-holdout-validation
    response: >-
      Provision a holdout test set, accessible for model external validation, to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - id: bridge2ai:CHoRUS#purpose-ethical-sourcing
    response: >-
      Create ethically sourced datasets and tools around artificial intelligence and establish
      best practices for AI in health, including community-facing ethics focus groups to
      determine what data is appropriate for public sharing.
  - id: bridge2ai:CHoRUS#purpose-workforce
    response: >-
      Cultivate a new generation of AI clinicians and scientists by training engineers, data
      scientists and clinicians and by improving AI literacy in the lay and scientific community.

tasks:
  - id: bridge2ai:CHoRUS#task-characterize-illness
    response: Characterize acute and critical care illness.
  - id: bridge2ai:CHoRUS#task-predict-complications
    response: Predict complications and clinical deterioration among acutely and critically ill patients.
  - id: bridge2ai:CHoRUS#task-treatment-response
    response: Measure treatment response among patients with acute or critical illness.
  - id: bridge2ai:CHoRUS#task-external-validation
    response: >-
      External validation of machine learning models against a sequestered holdout test set.
  - id: bridge2ai:CHoRUS#task-labeling
    response: >-
      Label data with targets important for prediction using a visualization and annotation
      environment.

addressing_gaps:
  - id: bridge2ai:CHoRUS#gap-critical-care-infrastructure
    response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center datasets is a critical
      first step towards actionable and trustworthy AI.
  - id: bridge2ai:CHoRUS#gap-diverse-ethical-dataset
    response: >-
      No sufficiently diverse, high-resolution, ethically sourced, AI-ready dataset exists to
      answer the grand challenge of improving recovery from acute illness while accounting for
      privacy, bias and social determinants of health.
  - id: bridge2ai:CHoRUS#gap-external-validation-sets
    response: >-
      Sequestered holdout datasets for external validation are lacking, limiting marketplace
      adoption of AI models in acute and critical care.
  - id: bridge2ai:CHoRUS#gap-standards-harmonization
    response: >-
      Multi-modal EHR, waveform, imaging and text data require unified standards before they can
      be harmonized and used across centers.

