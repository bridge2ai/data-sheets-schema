      Multi-Disorder Voice Protocols: A team science approach involving clinical expertise, bioethics,
      standards, and DEI." Proc. Interspeech 2024, 1445-1449.
      doi:10.21437/Interspeech.2024-1926. Available at
      https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html. This is the
      citation required when using the dataset's protocols.
  - description: >-
      Application feasibility publication: Moothedan, E., Boyer, M., Watts, S., et al. "The
      Bridge2AI-voice application: initial feasibility study of voice data acquisition through mobile
      health." Front Digit Health. 2025 Apr 15;7:1514971. doi:10.3389/fdgth.2025.1514971. PMCID
      PMC12037532, PMID 40302934.
  - description: >-
      Field-defining opinion piece: Bensoussan, Y., Elemento, O., Rameau, A. "Voice as an AI Biomarker
      of Health - Introducing Audiomics." JAMA Otolaryngol Head Neck Surg. 2024;150(4):283-284.
      doi:10.1001/jamaoto.2023.4807.
  - description: >-
      Recording protocol recommendations: Awan, S.N., Bahr, R., Watts, S., Boyer, M., Budinsky, R.,
      Bridge2AI-Voice Consortium, et al. "Evidence-based recommendations for tablet recordings from
      the Bridge2AI-voice acoustic experiments." J Voice. 2024. doi:10.1016/j.jvoice.2024.08.029.
  - description: >-
      NIH RePORTER project record for the funding award, application ID 11376382, at
