id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  A comprehensive collection of data derived from voice recordings with corresponding clinical
  information, created by the Bridge2AI-Voice consortium to enable research into voice as a
  biomarker of health. Version 3.1.0 contains data for 833 adult participants recruited across
  five sites in North America (USA and Canada). Participants were selected on the basis of known
  conditions that manifest within the voice waveform, including voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, and respiratory disorders, together
  with control participants. The PhysioNet release contains data considered low risk: derived audio
  features such as spectrograms, Mel spectrograms, MFCCs, articulatory features, phonetic
  posteriorgrams and static acoustic features, rather than the original voice recordings. Detailed
  demographic, clinical, and validated questionnaire data are also made available. Raw audio is
  distributed separately under controlled access.
