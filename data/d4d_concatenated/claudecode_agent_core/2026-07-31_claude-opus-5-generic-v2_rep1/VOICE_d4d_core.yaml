      https://reporter.nih.gov/search/4XtcXzBGEkWQlwG5v8odBA/project-details/10858564.
  - description: >-
      Earlier v1.0 release hosted on the Health Data Nexus at https://healthdatanexus.ai/ with DOI
      10.57764/qb6h-em84, which provides cloud compute alongside the dataset rather than allowing
      data downloads.
  - description: >-
      Training opportunities for using the dataset at https://www.b2aivoicescholars.org/.
  - description: >-
      "AI-readiness for Biomedical Data: Bridge2AI Recommendations", the criterion framework against
      which the dataset's AI-readiness scorecard was assessed. The project reports FAIRness 100
      percent, Provenance 100 percent, Characterization 80 percent, Pre-model explainability 100
      percent, Ethics 100 percent, Sustainability 50 percent and Computability 75 percent.