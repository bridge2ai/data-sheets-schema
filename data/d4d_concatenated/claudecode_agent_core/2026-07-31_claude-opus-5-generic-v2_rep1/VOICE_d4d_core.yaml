purposes:
  - description: >-
      To generate a large-scale, multi-institutional, ethically sourced and demographically diverse
      voice, speech and respiratory sound dataset linked to multimodal health biomarkers, in order
      to fuel voice AI research. Sources in the bundle differ on the target size: the project
      documentation and study metadata describe a flagship dataset of 10,000 voices with an
      anticipated enrolment count of 10,000 by 2027, whereas the audiomics white paper describes a
      primary deliverable of a publicly available database of 30,000 human voices and the IRB
      protocol states a sample size of 30,000 participants.
  - description: >-
      To enable the development, benchmarking, or validation of clinically applicable
      machine-learning models for diagnosing a wide range of health conditions using voice data,
      including vocal pathologies, neurological, psychiatric, respiratory, and pediatric voice
      disorders.
  - description: >-
      To promote the integration of voice as a biomarker of health in clinical care by building
      predictive models to assist in screening, diagnosis, and treatment of a broad range of
      diseases, including several with unmet clinical needs.
  - description: >-
      To introduce and support the field of acoustic biomarkers ("audiomics") by developing new
      standards of acoustic and voice data collection, interoperability, and analysis for voice AI
      research, including new bioinformatics standards for voice data.
  - description: >-
      To create benchmarks of diversity metrics, minimise the risk of algorithmic bias, and define
      ethical and legal norms that safeguard patients' data while supporting data-sharing efforts.

addressing_gaps:
  - description: >-
      Previous studies of machine-learning-based voice diagnosis produced promising results but
      their sample sizes were too small. Current literature has only been studied on small- to
      medium-sized datasets, typically with training sets of fewer than 300 patients for laryngeal
      cancer applications.
  - description: >-
      Existing voice datasets lacked the key metadata needed for training robust, clinically useful
      models, with limited data outside of acoustic measures and no linkage to multi-modal health
      data.
  - description: >-
      Comparing studies and pooling data is challenging due to a lack of existing standards in how
      voice and other acoustics are measured and collected, precluding meta-analysis.
  - description: >-
      Within industry, voice datasets are often private, limiting the ability to audit machine
      learning models and the accuracy of training data labels, and preventing external auditing of
      datasets used for training to ensure fair representation of diverse populations. Industry has
      access to vast amounts of voice data from users but lacks access to accurate clinical data or
      demographic information.
  - description: >-
      There is a lack of prospective study and validation of AI algorithms in audiomics on external
      datasets, which, compounded by the limited size, quality, and diversity of existing
      open-source datasets, explains the absence of validated and FDA-approved AI algorithms for
      disease detection and monitoring in this space.
  - description: >-
      Researchers need access to publicly available voice databases without reliance on the private
      sector, with data collection linked to established physiologic biomarkers and diverse
      populations.

tasks:
  - description: >-
      Training machine-learning models for disease detection and classification using voice data,
      with labels covering diagnostic categories such as vocal pathologies, neurological disorders,
      psychiatric conditions, and respiratory disorders.
  - description: >-
      Pretraining, fine-tuning, benchmarking, or validation of AI/ML models for healthcare using
      voice and speech data linked to clinical metadata.
  - description: >-
      Cohort selection using the questionnaire features distributed in the phenotype folder.

