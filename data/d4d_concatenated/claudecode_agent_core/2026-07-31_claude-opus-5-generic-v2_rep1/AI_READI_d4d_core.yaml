purposes:
  - description: >-
      To collect and publicly share a flagship, ethically sourced, AI-ready multimodal dataset
      on type 2 diabetes mellitus that enables future generations of artificial
      intelligence/machine learning research to provide critical insights into T2DM, including
      salutogenic pathways to return to health.
  - description: >-
      To support downstream pseudotime manifold analysis, an approach used to predict disease
      trajectories by learning from complex multimodal data collected from participants with
      differing disease severity (normal through insulin-dependent T2DM), with the long-term
      objective of reconstructing a temporal atlas of T2DM development and reversal towards
      health.
  - description: >-
      To establish and share standards, best practices, and guidelines (a "blueprint") for the
      collection, preparation, and sharing of AI-ready biomedical data, so that future NIH
      Bridge2AI Data Generation Projects and other efforts can follow them.
  - description: >-
      To build a foundational T2DM dataset that is hypothesis-agnostic and agnostic to existing
      disease classification criteria, assembled from assessments across many health domains
      likely impacted by T2DM.
  - description: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including a year-long research internship programme at the intersection of biomedicine
      and AI.

addressing_gaps:
  - description: >-
      A lack of well-designed, high-quality, large, inclusive multimodal datasets that are
      AI ready for training AI models has limited the ability to understand and affect the
      course of complex, multi-organ diseases such as type 2 diabetes mellitus.
  - description: >-
      Existing large datasets used for AI/ML training lack diversity. A meta-epidemiological
      review of T2DM studies published from 2000 to 2020 indicated that samples lacked racial
      and ethnic diversity, even though certain racial and ethnic populations bear a higher
      burden of T2DM and its consequences.
  - description: >-
      Current understanding of T2DM in the context of salutogenesis (the pathway from disease
      back to health, as opposed to pathogenesis) is limited.
  - description: >-
      Existing data sources such as insurance claims data or electronic health records data do
      not support the downstream AI/ML analyses that a purpose-designed, multi-domain
      acquisition protocol makes feasible.

tasks:
  - description: >-
      Pseudotime manifold analysis to predict T2DM disease trajectories and to reconstruct a
      temporal atlas of T2DM development and reversal towards health, using dimensionality
      reduction over complex multimodal data from participants with differing disease severity.
  - description: >-
      Development of multimodal artificial intelligence and machine learning models for type 2
      diabetes mellitus research, including study of salutogenesis and underlying links across
      racial/ethnic cohorts. The dataset is deliberately hypothesis-agnostic and is not
      distributed with predefined labels or targets.

other_tasks:
  - description: >-
      The controlled-access (private) version of the dataset allows for more generic use beyond
      type 2 diabetes related research, in contrast to the public version whose use is
      restricted to T2DM related research.
  - description: >-
      Banked biospecimens support additional future analyses not covered by the released
      dataset, including whole genome sequencing and other genomic applications from extracted
      DNA, proteomics and metabolomics from plasma and serum, gene expression studies from
      PAXgene-stabilised RNA, and immunological studies and generation of induced pluripotent
      stem cells from peripheral blood mononuclear cells.

