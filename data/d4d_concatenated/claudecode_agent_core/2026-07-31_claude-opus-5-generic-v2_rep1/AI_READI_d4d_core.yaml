id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal dataset collected from individuals with and without type 2 diabetes mellitus
  (T2DM) and harmonized across three data collection sites (University of Alabama at
  Birmingham, University of California San Diego, and University of Washington). Version 3.0.0
  contains data from 2280 participants collected between 19 July 2023 and 1 May 2025 across
  multiple modalities: survey data, clinical data (blood and urine laboratory results, vitals,
  physical measurements, monofilament and cognitive testing), 12-lead electrocardiography,
  retinal photography, optical coherence tomography (OCT), OCT angiography (OCTA),
  fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous glucose monitoring, wearable
  activity monitoring, and indoor environmental sensing. The composition was designed for
  downstream AI/machine learning research, with recruitment sampling aimed at approximately
  equal distribution of participants across sex, race/ethnicity, and diabetes severity. The
  scientific goal is to better understand salutogenesis (the pathway from disease to health)
  in T2DM. The released public data contain no protected health information; information
  related to participant sex, race/ethnicity, and medications used has been removed and is
  held under controlled access.
