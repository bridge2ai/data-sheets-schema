    name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project - Mini Version
    description: >-
      A smaller "Mini Version" of the dataset published as a distinct FAIRhub record (DOI
      10.60775/fairhub.4), containing data from 100 participants and intended for pipeline
      development. The FAIRhub API for version 3.0.0 records it as the child record (data.child =
