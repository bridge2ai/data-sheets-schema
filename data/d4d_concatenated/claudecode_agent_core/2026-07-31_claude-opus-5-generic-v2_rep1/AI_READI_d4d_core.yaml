instances:
  - description: >-
      Each instance represents an individual study participant. Version 3.0.0 contains 2280
      instances; version 1.0.0 (pilot phase) contained 204 instances and version 2.0.0
      contained 1067 instances. Each instance consists of all data available for that
      individual across the collected modalities: tabular survey and clinical data, imaging
      data, and physiological signal/waveform data. There is no unstructured free-text data in
      the released dataset, and no explicit label or target is associated with any instance.
      All instances belong to the same prospective data generation project (AI-READI), and
      there is currently only one study visit per participant.

subpopulations:
  - description: >-
      Self-reported race/ethnicity across the 2280 participants in version 3.0.0: White 836,
      Asian 545, Black 519, Hispanic 380. The study design targets equal proportions of four
      race/ethnic groups (Asian, Black, Hispanic, White) rather than the demographic
      distribution of the US population; because enrollment is ongoing, released versions may
      not yet have achieved balanced distribution. Race and ethnicity variables are held under
      controlled access and are removed from the public release.
  - description: >-
      Sex across the 2280 participants in version 3.0.0: female 1329, male 951. The study
      design targets balance between biological males and females. Sex variables are held under
      controlled access and are removed from the public release.
  - description: >-
      Diabetes status across the 2280 participants in version 3.0.0: no diabetes 776;
      pre-diabetes or type 2 diabetes controlled by lifestyle adjustments 560; type 2 diabetes
      controlled by oral or non-insulin injectable medications 686; insulin-controlled type 2
      diabetes 258. The study design targets equal proportions across these four severity
      groups, with an overall enrollment goal of approximately 1000 participants per group.
  - description: >-
      Age across the 2280 participants in version 3.0.0: mean 60.8 +/- 11.3 years. Eligibility
      is restricted to adults aged 40 years and older, with an upper eligibility bound of 85
      years.

distributions:
  - description: >-
      cardiac_ecg: electrocardiogram data collected using the 12-lead protocol on the Philips
      PageWriter TC30 Cardiograph. Files follow the WaveForm DataBase (WFDB) standard; the
      directory is organized per Clinical Dataset Structure (CDS) v0.1.1 and includes a
      manifest.tsv metadata file. 4,515 files, 302,931,703 bytes.
  - description: >-
      clinical_data: clinical data collected through REDCap, including blood and urine
      laboratory values and survey data. Each CSV file is a one-to-one mapping to an OMOP Common
      Data Model table. Includes a dqd_omop.json file supporting analysis with the OMOP CDM Data
      Quality Dashboard. 7 files, 176,182,781 bytes.
  - description: >-
      environment: indoor environmental sensor data collected with the LeeLab Anura, an
      environmental sensor device custom built for the AI-READI project. Files follow the NASA
      ASCII File Format Guidelines for Earth Science Data. 2,232 files, 55,625,676,514 bytes.
  - description: >-
      retinal_flio: fluorescence lifetime imaging ophthalmoscopy (FLIO) data from the Heidelberg
      FLIO device, for in vivo measurement of lifetimes of endogenous retinal fluorophores.
      Files follow the DICOM standard. 7,969 files, 1,069,466,876,718 bytes.
  - description: >-
      retinal_oct: structural optical coherence tomography data from four devices (Heidelberg
      Spectralis, Topcon Maestro2, Topcon Triton, Zeiss Cirrus). Files follow the DICOM
      standard. 56,478 files, 1,317,625,293,027 bytes.
  - description: >-
      retinal_octa: optical coherence tomography angiography data organized into en face, flow
      cube, and segmentation modalities, from Heidelberg Spectralis, Topcon Maestro2, Topcon
      Triton, and Zeiss Cirrus devices. Files follow the DICOM standard. 173,721 files,
      1,155,908,809,724 bytes.
  - description: >-
      retinal_photography: two-dimensional retinal (fundus) photography organized into colour
      fundus photography (iCare Eidon, Optomed Aurora, Topcon Maestro2, Topcon Triton), fundus
      autofluorescence (iCare Eidon), and near-infrared reflectance (Heidelberg Spectralis,
      iCare Eidon, Topcon Maestro2, Zeiss Cirrus) modalities. Files follow the DICOM standard.
      93,921 files, 174,381,046,406 bytes.
  - description: >-
      wearable_activity_monitor: wearable fitness tracker data from the Garmin Vivosmart 5,
      organized into heart rate, oxygen saturation, physical activity, physical activity
      calorie, respiratory rate, sleep, and stress modalities. Files follow the Open mHealth
      standard. 15,245 files, 38,313,536,220 bytes.
  - description: >-
      wearable_blood_glucose: continuous glucose monitoring data from the Dexcom G6, recording
      blood glucose measurements every 5 minutes over the 10-day at-home monitoring period.
      Files follow the Open mHealth standard. 2,246 files, 4,169,006,971 bytes.
  - description: >-
      Whole dataset as published on FAIRhub for version 3.0.0: 356,343 files totalling
      3,815,969,779,678 bytes (3.82 TB), accompanied by root-level metadata files (CHANGELOG.md,
      dataset_description.json, dataset_structure_description.json, healthsheet.md, LICENSE.txt,
      participants.json, participants.tsv, README.md, study_description.json).

