id: https://chorus4ai.org/dataset
name: CHoRUS Dataset
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  The CHoRUS dataset is a multicenter, multimodal, high-resolution, controlled-access critical
  care dataset assembled by the Patient-Focused Collaborative Hospital Repository Uniting
  Standards (CHoRUS) for Equitable AI project, one of four data generation projects in the NIH
  Common Fund Bridge2AI program (award OT2OD032701). Data are collected retrospectively from
  ICU, PICU and NICU admissions at 14 data-acquisition hospitals within a 20-institution academic
  network and harmonized to community standards, principally the OMOP Common Data Model. The
  dataset spans nine data modalities: demographics, medication administration, procedures,
  nursing flowsheets, diagnoses, clinical notes extracted and tokenized with the OHNLP toolkit,
  imaging from PACS in DICOM, bedside waveform telemetry in WFDB, and EEG in EDF+ and Persyst
  formats. The CHoRUS project website reports a current released dataset of 50,000 patient
  admissions from ICU, PICU and NICU, 1.6 billion rows of EHR OMOP data, 7,642 admissions with
  radiology data and 23 Tb of waveform data, against an anticipated final dataset of 100,000
  patient admissions across 9 modalities from 14 contributing hospitals. The September 2025
  AIM-AHEAD informational webinar states that, as of August 2025, the dataset covered 14
  different hospitals with over 45,000 unique admissions. All data types are under controlled
  access, delivered through a cloud enclave, and the project also sequesters a holdout test set
  for external validation of AI models.
page: https://chorus4ai.org/
status: >-
  Active data generation project running 2022-09-01 through 2026-11-30, with a partial dataset
  released under controlled access and additional modalities (imaging at scale, EEG) still in
  extraction or de-identification. The CHoRUS project website carries the notice that the
  repository is under review for potential modification in compliance with Administration
  directives.
conforms_to: >-
  OMOP Common Data Model (OHDSI), with modality-specific standards: OHNLP schema for tokenized
  clinical notes, DICOM for imaging, WFDB with an extended PhysioNet schema for waveform
  telemetry, and EDF+ / Persyst for EEG.
conforms_to_schema: OMOP Common Data Model (OHDSI)
created_by: CHoRUS Consortium (60+ members across 20 institutions), led by Massachusetts General Hospital
was_derived_from: >-
  Retrospective clinical records held in the electronic health record systems, PACS imaging
  archives, bedside telemetry monitors and gateway/middleware, and hospital EEG databases of the
  14 CHoRUS data-acquisition hospitals.
