instances:
- id: d4d:VOICE-instance-participant
  name: Participant
  instance_type: person
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant.
    At each site a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up. For the psychiatric disorders cohort the assessment was determined from the participant's
    electronic health record or an active prescription, done outside of data collection by an
    appropriately licensed clinician. Labelling followed the Bridge2AI protocols and ICD-10 codes,
    with a single labeller per instance.
  description: Each instance represents a person. Release v3.1.0 contains data for 833 adult participants
    across five sites in North America, unchanged from v3.0.0, which added 391 participants over
    v2.0. Each participant may have more than one session, so phenotype files may contain more
    than one row per participant and responses for the same data element may vary across visits.
    Participants were drawn from five predetermined disease cohort categories - voice disorders,
    respiratory disorders, neurological and neurodegenerative disorders, mood and psychiatric
    disorders, and pediatric voice and speech disorders - together with participants without those
    conditions who serve as controls. The public releases do not contain an equal distribution
    of these categories.
  sampling_strategies:
  - id: d4d:VOICE-instance-sampling
    name: Clinic-based non-probability sampling
    is_sample: true
    is_random: false
    is_representative: false
    source_data: Patients presenting at specialty clinics and institutions who were screened against
      inclusion and exclusion criteria prior to their visit by the project investigators, plus
      participants without the conditions of interest recruited as controls.
    why_not_representative: The data is not representative because it was collected at a limited
      number of geographic locations. The project states it hopes to make the data more representative
      by shifting to remote collection and by designing the recruiting approach so that it controls
      for more variables.
    strategies: Non-Probability Sample
  missing_information:
  - id: d4d:VOICE-instance-missing
    name: Optional and irregularly captured items
    missing:
    - Responses to optional questionnaire items
    - Items outside a participant's primary diagnostic category
    - Rows for participants for whom every column of a phenotype file is missing
    why_missing:
    - Some questions are optional
    - Each individual answered a common set of questions and then responded to additional questions
      relevant to their primary diagnostic category
    - There may be data collection irregularities that caused information to be missing
    - Phenotype data files only contain rows for a participant if at least one column is not missing
- id: d4d:VOICE-instance-recording
  name: Audio recording and derived feature record
  instance_type: audio recording
  description: Each participant contributes recordings of acoustic tasks, and every derived-feature
    record is keyed by participant identifier, session identifier and task name. In v3.1.0 the
    per-feature record counts are 29,278 for torchaudio spectrograms, Mel spectrograms and MFCCs,
    32,522 for torchaudio pitch, 28,640 for sparc electromagnetic-articulography traces, 31,855
    for sparc loudness, 31,872 for sparc periodicity and sparc pitch, and 29,289 for phonetic
    posteriorgrams. A total of 22 acoustic tasks are recorded through the adult application.
  source_caveats: The project documentation states that version 3.0 contains approximately 61,937
    voice-derived recordings from 833 adult participants. The PhysioNet v3.1.0 record gives no
    single recording count and instead reports per-feature record counts, which differ from one
    another because some recordings could not generate certain features and because sensitive
    records and audio checks were removed for several feature types. The two figures are not directly
    comparable and neither was used to derive the other.
anomalies:
- id: d4d:VOICE-anomaly-site-and-protocol-variation
  name: Site configuration and protocol change
  anomaly_details: Yes, different sites have different collection configurations. The collection
    protocol changed over the course of the study.
  description: Further sources of noise recorded in the project documentation are noise artifacts,
    variations in diagnostic practices, inaccurate questionnaire responses and underreporting.
    Some files, whether due to length or other issues, could not generate certain features and
    are therefore absent from the bundled feature data.
- id: d4d:VOICE-anomaly-unaudited-machine-outputs
  name: Unaudited machine-generated fields
  anomaly_details: Certain aspects of the data, for example transcription, were generated using
    off-the-shelf models that have not been audited for correctness.
known_biases:
- id: d4d:VOICE-bias-selection
  name: Recruitment through high-volume expert clinics
  bias_type: selection_bias
  bias_description: Participants are recruited across academic institutions from high-volume expert
    clinics on the basis of diagnosis and inclusion/exclusion criteria, and data is collected
    in the clinic with the assistance of a trained research assistant. Groups that have less trust
    in the medical system or in AI, or that are less proximal to the collection sites, would have
    been less likely to be recruited.
  mitigation_strategy: The protocol provides for partnership with Community Outreach Clinics serving
    underserved and under-represented populations, and a Plan for Enhancing Diverse Perspectives;
    the project states it hopes to improve representativeness by shifting to remote collection.
- id: d4d:VOICE-bias-representation
  name: Limited geographic, linguistic and cohort coverage
  bias_type: representation_bias
  bias_description: The dataset is a sample of a larger ongoing collection and is not representative
    because it was collected at a limited number of geographic locations. Data collection is in
    English only for the released versions, with Spanish protocols under development. The public
    releases do not contain an equal distribution of the five disease cohort categories, and the
    dataset has skews based on disorder category, site and other demographic factors.
  affected_subsets:
  - Non-English speakers
  - Disease cohorts under-represented in the current release
  - Populations distant from the five recording sites
- id: d4d:VOICE-bias-measurement
  name: Device and site confounding
  bias_type: measurement_bias
  bias_description: Distinct iPad devices were used at each site. Recordings were made with a
    head-mounted headset with a microphone that could be at slightly different distances. Participants
    were screened for different disorders based on site, so they also had their data collected
    with different devices, which confounds device with diagnostic label. The clinical diagnosis,
    depending on the disorder, was performed by one clinician or based on an electronic health
    record or prescription.
known_limitations:
- id: d4d:VOICE-limitation-representativeness
  name: Not representative of a wider population
  limitation_type: representativeness_limitation
  limitation_description: The release is a sample of a larger, ongoing collection and is explicitly
    stated not to be representative, having been collected at a limited number of geographic locations.
  scope_impact: Users should consider the multivariate distribution when assessing utility for
    different questions.
  recommended_mitigation: Assess the joint distribution of disorder category, site and demographic
    factors before drawing population-level conclusions.
- id: d4d:VOICE-limitation-no-raw-audio
  name: Public release omits the original audio waveforms
  limitation_type: coverage_limitation
  limitation_description: The published PhysioNet dataset contains derived features from the audio
    waveforms and does not contain the raw audio. Spectrograms, Mel spectrograms, MFC coefficients,
    phonetic posteriorgrams and electromagnetic-articulography traces for sensitive records and
    audio checks have been removed from v3.1, and spectrograms and similar features were excluded
    where the audio contained free speech.
  scope_impact: Analyses that require the waveform, or that depend on dense features of free-speech
    tasks, cannot be performed on the PhysioNet release alone.
  recommended_mitigation: Request raw audio through the controlled-access route via the Data Access
    Compliance Office at DACO@b2ai-voice.org, with distribution through Synapse.
- id: d4d:VOICE-limitation-no-external-modalities
  name: Multimodal data outside the acoustic and phenotype domains not released
  limitation_type: scope_limitation
  limitation_description: The rest of the multimodal data, including imaging, genomic data for
    the neurological cohort, laryngoscopy imaging and other electronic-health-record data, is
    extracted from different sites independently and uploaded through the REDCap database, but
    the project documentation states that no external data was released in the v3.0.0 release.
- id: d4d:VOICE-limitation-single-labeller
  name: Single-labeller diagnostic assignment
  limitation_type: methodological_limitation
  limitation_description: A single labeller provides the diagnostic label for each instance, typically
    the clinician at the site of data collection or a clinician external to it for a prior diagnostic
    assessment. No inter-annotator agreement is available, and human-level performance on the
    applications the dataset addresses is stated to vary widely.
- id: d4d:VOICE-limitation-collection-instrument
  name: Documented usability constraints of the collection application
  limitation_type: methodological_limitation
  limitation_description: A feasibility study of the Bridge2AI-Voice application, conducted at
    a single site (USF Health Voice Center) with 47 participants between 5 June and 28 July 2023,
    found an overall task completion rate of 68%, successful recording of acoustic tasks in 41%
    of cases, and requests for research-staff assistance in 41.2% of tasks, with the Glides task
    requiring assistance every time. Challenges related mainly to interface design and to the
    understandability of instructions.
  scope_impact: The feasibility study evaluated the collection instrument at an earlier stage
    of development and did not collect audio data; it is evidence about the application, not about
    the contents of this dataset.
  source_caveats: 'Scope boundary: the 47 participants of the feasibility study are not part of
    this dataset''s 833 participants, and no source in the bundle states any overlap.'
confidential_elements:
- id: d4d:VOICE-confidentiality
  name: Confidential content
  confidential_elements_present: false
  confidentiality_details: The project documentation answers 'No' to whether the dataset contains
    data that might be considered confidential, such as data protected by legal privilege or by
    doctor-patient confidentiality, or the content of individuals' non-public communications.
  description: Separately, the Data Transfer and Use Agreement records that the Data is covered
    under a Certificate of Confidentiality, which must be asserted against compulsory legal demands
    such as court orders and subpoenas for identifying information or characteristics of a research
    participant.
content_warnings:
- id: d4d:VOICE-content-warning-free-speech
  name: Free-speech content
  content_warnings_present: true
  warnings:
  - This dataset includes the transcription of free speech tasks. While the inclusion of information
    of that type is unlikely, it cannot be completely avoided, as research participants are responsible
    for their choice of language.
  source_caveats: This project-documentation answer conflicts with the current release description.
    The PhysioNet v1.1 record states that transcripts of free speech audio were removed, and the
    documentation's own v3.0.0 de-identification section states that all spectrograms, MFCCs,
    Mel spectrograms, transcriptions, EMAs and PPGs from open-response prompts are removed from
    the feature-only dataset. Both statements are recorded rather than merged.
subpopulations:
- id: d4d:VOICE-subpopulations
  name: Demographic sub-populations
  subpopulation_elements_present: true
  identification: Age, Gender, Sex, Ethnicity, Socioeconomic status
  distribution: The dataset has skews based on disorder category, site and other demographic factors;
    users should consider the multivariate distribution when assessing utility for different questions.
    No distributional breakdown of the demographic sub-populations is given in the bundle.
  description: Detailed demographic data collected through the application includes age, sex,
    gender, race and ethnicity, and language, together with confounders such as smoking and drinking
    history, weight, socio-economic status and literacy status.
sensitive_elements:
- id: d4d:VOICE-sensitive-elements
  name: Sensitive data categories
  sensitive_elements_present: true
  sensitivity_details: The project documentation states that the dataset includes race information,
    sexual orientation information, and socioeconomic and health information.
  description: 'Voice itself is treated as sensitive: the project documentation states that all
    raw voice data was removed because it has the potential to cause individual re-identification
    or to be used for illicit or unauthorized purposes.'
  source_caveats: The v3.0.0 de-identification section of the same document states that all sensitive
    fields were removed from the dataset at that stage, corresponding to the data elements encoded
    as sensitive in the REDCap data dictionary, and that non-identifying elements revealing highly
    sensitive information such as household income, mental health status and traumatic life experiences
    were also removed. The healthsheet answer above and the v3.0.0 statement describe different
    states of the release and are not reconciled in the sources.
acquisition_methods:
- id: d4d:VOICE-acquisition
  name: Direct observation and self-report with clinical verification
  was_directly_observed: true
  was_reported_by_subjects: true
  was_validated_verified: true
  acquisition_details: The data was directly observable and reported by subjects. Clinical diagnoses
    were verified by clinicians reviewing audio and/or imaging data, looking at electronic health
    records, or medication prescriptions. Clinical validation is performed by a qualified physician
    or practitioner based on established gold standards for diagnosis, which vary by cohort and
    include laryngoscopy images and stroboscopy videos for voice disorders, spirometry and flow-volume
    loops and CT of neck or chest for respiratory disorders, brain CT, brain MRI and whole-genome
    sequencing for neurological and neurodegenerative disorders, and electronic health summary,
    psychiatrist diagnosis and medication history for mood and psychiatric disorders.
collection_mechanisms:
- id: d4d:VOICE-collection-mechanism-app
  name: Bridge2AI-Voice application on tablet hardware
  mechanism_details: The data were collected using an iPad app. Data collection was conducted
    using a custom application on a tablet with a headset used for data collection when possible.
    Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an
    Avid AE-36 microphone and an Apple dongle to connect it to the iPad.
  description: The IRB protocol records two client platforms for adult collection, the Bridge2AI
    Voice iOS app and the Bridge2AI Voice Web app; the iOS app is restricted to iOS-compatible
    devices while the web app runs on a computer, tablet or phone. No software is downloaded or
    installed for the web app, it stores data only during the collection phase, the data are removed
    as soon as the page is closed, and there is no login. Both apps are HIPAA-compliant and send
    data over a secure HTTPS protocol to a HIPAA-compliant storage server operated by an NIH STRIDES
    partner. A separate Bridge2AI Enrollment Web app is used for remote recruitment and enrollment.
    The application also includes models to ensure acoustic data quality, including volume standardization
    and noise cancellation. Full data acquisition protocols are published in the REDCap instrument
    Shared Library and at https://github.com/eipm/bridge2ai-redcap.
  used_software:
  - id: d4d:VOICE-software-redcap-dictionary
    name: eipm/bridge2ai-redcap
    description: Bridge2AI REDCap data dictionary, metadata and instrument PDFs, cited as Bensoussan
      et al. (2024), eipm/bridge2ai-redcap, Zenodo. The PhysioNet v3.0.0 and v3.1.0 releases cite
      Bridge2AI Voice REDCap v3.23.0 (https://zenodo.org/records/14989503) and the v1.1 release
      cites v3.20.0 (https://doi.org/10.5281/zenodo.14148755).
    license: MIT
    url: https://github.com/eipm/bridge2ai-redcap
sampling_strategies:
- id: d4d:VOICE-sampling-strategy
  name: Non-probability clinic-based sampling of a larger ongoing collection
  is_sample: true
  is_random: false
  is_representative: false
  source_data: A larger, ongoing collection. The IRB protocol describes a phased four-year acquisition
    targeting up to 5,000 participants per disease category and control group, and the project
    documentation records an anticipated enrollment of 10,000 by 2027.
  why_not_representative: It is a sample of a larger, ongoing collection. The data is not representative
    because it was collected at a limited number of geographic locations.
  strategies: Non-Probability Sample
  source_caveats: 'The bundle states three different overall targets that were not reconciled
    by the sources: the project documentation''s flagship target of 10,000 voices and ''Enrollment
    Count (Anticipated by 2027): 10,000''; the audiomics white paper''s ''publicly available database
    of 30 000 human voices''; and the IRB protocol''s sample size of 30,000 participants, of which
    5,000 are to be enrolled through USF clinics and the remainder through other participating
    institutions and existing cohorts.'
data_collectors:
- id: d4d:VOICE-data-collectors
  name: Site research teams and clinicians
  role: Data collection and clinical validation
  collector_details: Research teams, which may include medical, graduate or undergraduate students,
    coordinated with clinicians and doctors to identify appropriate participants. These clinicians
    and doctors were listed under the IRB as co-investigators and were added to the consortium
    so that their names are included on consortium-level publications that emerge from the research.
    Hospital staff were not involved in scheduling but assisted in the logistics of coordinating
    data collection. Data is collected in the clinic with the assistance of a trained research
    assistant.
  description: The IRB protocol adds that the team hired two acoustic engineers and three AI data
    scientists to analyse all samples from the year-one exploratory data collection phase for
    acoustic quality and machine-learning readiness, and that in each subsequent year 10% of the
    data is selected at random every month for quality control and machine-learning readiness.
collection_timeframes:
- id: d4d:VOICE-collection-timeframe
  name: Collection period
  timeframe_details: The data was collected over a period of 12 months.
  description: 'The IRB protocol describes a phased acquisition across a four-year study period:
    Phase 1 (exploratory, up to 180 participants at main sites) completed November 2023; Phase
    2 (pilot, cumulatively up to 600 participants) begun November 2023 and ongoing in November
    2024; Phase 3 (expansion to community outreach clinics and further high-volume expert clinics,
    cumulatively up to 3,000 participants); and Phase 4 (outreach, cumulatively 5,000 participants).
    NIH RePORTER records the project period as 1 September 2022 to 30 November 2026.'
  source_caveats: The twelve-month figure comes from the project documentation healthsheet and
    cannot be reconciled from the bundle with the four-year phased schedule in the IRB protocol
    or with the release dates of versions 1.1 through 3.1.0; no start or end date for the collection
    of the released data is stated in any source.
missing_data_documentation:
- id: d4d:VOICE-missing-data-documentation
  name: Missingness documentation
  missing_data_patterns: Some questions are optional, and each individual answered a common set
    of questions and then responded to additional questions relevant to their primary diagnostic
    category. Phenotype data files only contain rows for a participant if at least one column
    is not missing.
  missing_data_causes: Optional items, cohort-specific branching of the protocol, and data collection
    irregularities. Some audio files, whether due to length or other issues, could not generate
    certain features and so are not included in the bundled feature data.
  handling_strategy: The dataset has been audited internally for missingness and consistency by
    the data release team, and a missingness table is included with the dataset.
raw_data_sources:
- id: d4d:VOICE-raw-data-source
  name: Raw audio waveforms and source questionnaire records
  source_description: Raw audio waveforms recorded by the Bridge2AI-Voice application, together
    with questionnaire and clinical records captured in REDCap, are the primary sources from which
    the released features and phenotype tables are derived.
  source_type: Primary prospective collection
  access_details: The raw data was saved after de-identification and is not accessible publicly.
    Raw audio is disseminated through controlled access only, to protect participants' privacy,
    and requires institutional sign-off; requests go to the access committee at DACO@b2ai-voice.org.
  raw_data_format: WAV audio files organised as sub-<participant_id>/ses-<participant_id>/audio
    with a paired JSON sidecar per recording, alongside REDCap exports of the questionnaire data.
ethical_reviews:
- id: d4d:VOICE-ethical-review
  name: University of South Florida Institutional Review Board
  reviewing_organization: University of South Florida Institutional Review Board
  review_details: Data collection and sharing was approved by the University of South Florida
    Institutional Review Board. The study was submitted and approved by the USF Single IRB and
    subsite IRBs through the Single IRB process. The study is not for a drug product and not for
    a medical device, and no data monitoring committee was appointed.
  description: The IRB protocol 'Bridge2AI Voice Data Acquisition' is at version 13 (11 July 2025),
    having begun as version 1 on 17 January 2023; the recorded revisions add the pediatric cohort
    under the single IRB (V2), compensation for participating adults (V3), electronic consent
    and social-media recruitment (V4), control-cohort collection and new disease categories (V5),
    remote and e-consent options with a changed compensation amount (V7, V8), clarification of
    the two remote platforms (V10), Spanish-language data collection and further USF sites (V11),
    and further recruitment provisions (V12, V13). Canadian institutions (Mount Sinai Hospital,
    SickKids and the University of Toronto) do not fall under the single IRB process and apply
    for separate Research Ethics Board approval; genomic data is collected and analysed only at
    the University of Toronto and Mount Sinai Hospital under a separate protocol and REB approval.
data_protection_impacts:
- id: d4d:VOICE-data-protection-impact
  name: Impact analysis on data subjects
  impact_details: No. The project documentation answers 'No' to whether an analysis of the potential
    impact of the dataset and its use on data subjects has been conducted.
human_subject_research:
  id: d4d:VOICE-human-subject-research
  name: Human subject research status
  involves_human_subjects: true
  ethics_review_board: University of South Florida Institutional Review Board
  irb_approval:
  - University of South Florida Single IRB, with subsite IRBs joining through the Single IRB process;
    approval covers data collection and sharing
  - Separate Research Ethics Board approvals at the Canadian participating institutions (Mount
    Sinai Hospital, Hospital for Sick Children, University of Toronto)
  - A further separate ethics approval at the University of Toronto and Mount Sinai Hospital covering
    genomic data collection and analysis
  special_populations:
  - Participants with cognitive impairment, dementia, Alzheimer's disease and other neurodegenerative
    conditions are enrolled in the neurological cohort
  - Participants with mood and psychiatric disorders are enrolled and may experience discomfort
    in answering cohort-specific questions
  regulatory_compliance:
  - HIPAA
  - Certificate of Confidentiality
  - Good Clinical Practice guidelines
  - NIH STRIDES partner agreements for HIPAA-protected cloud storage (Amazon, Google, Microsoft)
  description: The study is an observational, prospective cohort study with no research intervention.
    There are no direct significant risks from the research; the most important risk lies in the
    protection of data privacy, and a further risk is discomfort or negative emotion triggered
    by questions asked of participants in cohorts such as mood disorders, depression and anxiety.
    A partial HIPAA waiver was requested for recruitment purposes, limited to reviewing electronic-health-record
    information against the study's inclusion criteria before clinic appointments.
informed_consent:
- id: d4d:VOICE-informed-consent
  name: Informed consent
  consent_obtained: true
  consent_type: Prospective informed consent, obtained on paper, electronically within the application,
    through REDCap survey forms, or by video recording within the application; assent with parental
    permission where children participate at the pediatric sites.
  consent_documentation: Paper consent documents are uploaded and saved electronically in REDCap;
    electronic consent is housed in REDCap and is HIPAA compliant. All paper and electronic versions
    of consent are stored for a minimum of five years after the completion of the study, following
    required USF procedure.
  withdrawal_mechanism: Participants may withdraw at any point. Withdrawal during or before voice
    data collection excludes the data from the database; data cannot be removed once the voice
    data collection process is completed.
  consent_scope: Consent covers collection of acoustic, demographic and clinical data, investigator
    access to medical information through electronic-health-record platforms for gold standard
    validation of diagnoses and symptoms, and sharing of de-identified data with external researchers
    through registered and controlled access mechanisms. Consent does not restrict the data to
    non-commercial use, to a geographic location, to a specific research type, to genetic research,
    or to research that does not develop methods or algorithms.
  description: Approximately 30 minutes is spent explaining the study and the consent in detail
    with time for questions, and potential participants are asked to explain what they have understood
    to the research assistant to confirm their understanding. Participants are informed that participation
    is voluntary and does not affect their medical care. Within the consent process individuals
    are asked whether they agree to be contacted in the future for further voice data collection;
    contact information provided for that purpose is stored within the institutional database
    only and is not shared or uploaded to the cloud.
at_risk_populations:
  id: d4d:VOICE-at-risk-populations
  name: At-risk populations in the released adult dataset
  at_risk_groups_included: false
  description: Eligibility for this dataset is a minimum age of 18 years and a maximum age of
    120 years, and the project documentation's study-population statement, written for v2.0.0,
    records that the dataset contains only adult populations and that a pediatric cohort would
    be introduced later with the eligibility criteria and study metadata updated at that time.
    The IRB protocol's vulnerable-populations provisions concern pediatric patients, who are enrolled
    only through the pediatric sites and not at USF, and whose data is released as a separate
    pediatric dataset. The protocol states that the study will not specifically include or exclude
    students, employees or wards of the state, and that there is a specific plan to enrol participants
    from socially and economically disadvantaged and underserved populations through the Plan
    for Enhancing Diverse Perspectives.
  source_caveats: The bundle does not classify adult participants with cognitive impairment, dementia
    or psychiatric conditions as an at-risk population requiring special protections, so no such
    classification is asserted here; the flag records only the documented absence of pediatric
    participants from this dataset.
preprocessing_strategies:
- id: d4d:VOICE-preprocessing-audio-standardisation
  name: Audio standardisation and feature derivation
  preprocessing_details: Raw audio was preprocessed by converting to monaural and resampling to
    16 kHz with a Butterworth anti-aliasing filter applied. From this standardized audio the release
    derives torchaudio spectrograms (25 ms window, 10 ms hop, 400-point FFT, further downsampled
    by a factor of two in the time domain), 60 Mel-frequency cepstral coefficients, Mel spectrograms
    (same parameters with 60 Mel bins), articulatory features from the Speech Articulatory Coding
    package giving kinematic traces of vocal tract articulators and source features plus loudness,
    periodicity and pitch gathered at 50 Hz, acoustic features from openSMILE, phonetic and prosodic
    features from Parselmouth and Praat giving fundamental frequency, formants and voice quality,
    phonetic posteriorgrams at 100 Hz from the ppgs package, and transcriptions generated using
    OpenAI's Whisper Large model.
  description: 'Waveform-derived features are stored in two formats: a fixed feature format holding
    static features extracted from the entire waveform, and a temporal format that varies for
    each audio file depending on the length of the recording. Questionnaire features are collected
    and distributed in the phenotype folder format and can be used for cohort selection. The project
    documentation states that pre-processing for de-identification consisted of extracting features
    from the raw audio to limit re-identification, with only the extracted features released.'
  used_software:
  - id: d4d:VOICE-software-b2aiprep
    name: b2aiprep
    version: 3.0.0
    description: The code used to process the raw audio into the released features and to merge
      the source data into the phenotype files. The v3.1.0 release was generated with b2aiprep
      v3.0.0. The project documentation describes it as the library for organizing and preprocessing
      the dataset.
    license: Apache-2.0
    url: https://github.com/sensein/b2aiprep
  - id: d4d:VOICE-software-senselab
    name: SenseLab
    description: Processing audio files for research tasks.
    url: https://github.com/sensein/senselab
- id: d4d:VOICE-preprocessing-bids
  name: Conversion to Brain Imaging Data Structure
  preprocessing_details: The raw audio files and the questionnaire data retrieved from ReproSchema-UI
    or exported from REDCap were converted to be compliant with the Brain Imaging Data Structure
    v1.9.0. The resulting audio dataset is organised with CHANGES.md, README.md and dataset_description.json
    at the root, a phenotype directory containing confounders, demographics, diagnosis, enrollment,
    questionnaire and task subfolders, and per-participant sub-<participant_id>/ses-<participant_id>/audio
    directories holding paired WAV and JSON files named by task.
  source_caveats: This statement appears in the project documentation's data pre-processing section
    and describes the audio dataset layout; the PhysioNet feature-only release is organised into
    features, metadata and phenotype folders and its documentation does not restate BIDS conformance.
- id: d4d:VOICE-preprocessing-audit-protocol
  name: Audit and quality-control protocol
  preprocessing_details: The stated audit protocol is to generate missingness tables; check distributions
    and outliers; check categorical responses against schema; run quality control metrics for
    audio tasks; for waveforms check the amount of silence and the duration; and for speech check
    the produced speech relative to the intended passage.
  description: Release v3.1.0 adds a features/audio_quality_metrics.tsv file holding one quality-control
    feature per audio recording. The dataset has been audited internally for missingness and consistency
    by the data release team.
cleaning_strategies:
- id: d4d:VOICE-cleaning-strategy
  name: Data cleaning
  cleaning_details: No. The project documentation answers 'No' to whether there was any pre-processing
    for cleaning the data, for either the preliminary or the current version of the dataset, and
    answers 'No' to whether instances were excluded at the time of preprocessing.
  description: 'Content removal did take place for privacy reasons rather than for data quality:
    raw audio transcripts were reviewed and any audio recordings that contained potentially identifying
    information or external voices were removed from the release, and sensitive fields identified
    in the REDCap data dictionary were removed.'
labeling_strategies:
- id: d4d:VOICE-labeling-strategy
  name: Clinician-assigned gold standard diagnostic labels
  data_annotation_protocol: Per Bridge2AI Protocols and ICD-10 codes.
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to it for
    a prior diagnostic assessment
  labeling_details: The labelling strategy is a gold standard label available in the data, diagnosed
    by a clinician. Diagnostic labels are the result of a clinical assessment of the participant;
    at each site a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up. For the psychiatric disorders cohort the assessment was determined using the participant's
    electronic health record or an active prescription, outside of data collection, by an appropriately
    licensed clinician. A single labeller is considered per instance and one labeller provides
    a label per instance. Human-level performance in the applications the dataset is supposed
    to address varies widely.
  description: The guidance for future work states that the process for any new labels should
    be described alongside any release of a model or publication, and that this process should
    include the exact variables used for the determination.
raw_sources:
- id: d4d:VOICE-raw-source-synapse
  name: Raw audio via Synapse
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details: The raw data was saved in addition to the preprocessed data and is not accessible
    publicly. The published Bridge2AI-Voice adult dataset contains derived features from the audio
    waveforms and the PhysioNet project does not contain raw audio. Accessing raw audio is a more
    involved process and requires institutional sign-off; the access committee is reached at DACO@b2ai-voice.org
    and the data is made available via Synapse.
machine_annotation_tools:
- id: d4d:VOICE-machine-annotation-tools
  name: Automated feature extraction and transcription tools
  tools:
  - OpenAI Whisper Large
  - openSMILE
  - Praat
  - Parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - ppgs
  tool_descriptions: Transcriptions were generated using OpenAI's Whisper Large model. Acoustic
    features were extracted using openSMILE, capturing temporal dynamics and acoustic characteristics.
    Phonetic and prosodic features were computed using Parselmouth and Praat, providing measures
    of fundamental frequency, formants and voice quality. torchaudio produced spectrograms, Mel
    spectrograms, MFCCs and pitch contours. The Speech Articulatory Coding package produced kinematic
    traces of vocal tract articulators and source features plus loudness, periodicity and pitch.
    The ppgs package produced phonetic posteriorgrams over 40 phoneme categories.
  tool_accuracy:
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf
    models that have not been audited for correctness.
existing_uses:
- id: d4d:VOICE-existing-use
  name: Prior uses
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer
    School and hackathon.
  description: Training opportunities for using the dataset are offered through the B2AI Voice
    Scholars programme at https://www.b2aivoicescholars.org/.
use_repository:
- id: d4d:VOICE-use-repository
  name: Repository of works using the dataset
  repository_details: No. The project documentation answers 'No' to whether there is a repository,
    besides Google Scholar, that links to any or all papers or systems that use the dataset.
future_use_impacts:
- id: d4d:VOICE-future-use-impact
  name: Composition effects on future use
  impact_details: Yes, this dataset has skews based on disorder category, site and other demographic
    factors. Users should consider the multivariate distribution when assessing utility for different
    questions.
discouraged_uses:
- id: d4d:VOICE-discouraged-use
  name: Non-research and decisional applications
  discouragement_details: The dataset should not be used for non-clinical or non-research applications
    such as hiring decisions, insurance premium adjustments, or any form of surveillance that
    could lead to discrimination or harm. These discouraged uses are intended to prevent unethical
    or biased outcomes that could negatively impact individuals based on their health conditions
    or voice characteristics. The dataset is intended strictly for research that prioritises patient
    safety, privacy and ethical use.
intended_uses:
- id: d4d:VOICE-intended-use
  name: Clinical AI and machine-learning research
  use_category: Research
  examples:
  - Development of AI and machine-learning models for healthcare
  - Clinical research in disease screening, diagnosis and monitoring through voice biomarkers
  - AI model pretraining, fine-tuning, benchmarking or validation
  usage_notes: The dataset is intended solely for commercial and non-commercial research purposes
    by Authorized Researchers, as set out in the Registered Data Access Agreement. Parquet feature
    files can be loaded with any parquet-capable library, for example Dataset.from_parquet from
    the HuggingFace Datasets library; spectrograms can be plotted in decibels after conversion
    from their power representation with librosa.power_to_db; phenotype tables can be read with
    any statistical analysis tool, for example pandas.read_csv with a tab separator and a header
    row.
prohibited_uses:
- id: d4d:VOICE-prohibited-use-reidentification
  name: Re-identification of research participants
  prohibition_reason: The dataset is not to be used to attempt to re-identify research participants,
    nor for any actions that could reasonably lead to re-identification. These restrictions reflect
    the B2AI-Voice Consortium's commitment to advancing ethical and trustworthy research practices
    that respect and protect the rights and interests of research participants.
- id: d4d:VOICE-prohibited-use-harm
  name: Uses that could harm or stigmatise participants
  prohibition_reason: The dataset is not to be used for any purpose that could foreseeably cause
    harm or stigmatisation to research participants, their families, communities, or specific
    populations.
- id: d4d:VOICE-prohibited-use-ip-blocking
  name: Intellectual property protections that restrict access
  prohibition_reason: Intellectual property protections, database rights, or related rights may
    not be used in a manner that restricts or limits access to any part of the dataset or to any
    conclusions derived from it. This restriction ensures that future use of the dataset remains
    unrestricted, in alignment with the Open Science principles upheld by the B2AI-Voice Consortium.
distribution_formats:
- id: d4d:VOICE-distribution-format-parquet
  name: Parquet feature files
  download_url: https://physionet.org/content/b2ai-voice/3.1.0/
  description: Dense binary feature files are made available as Parquet, an open-source column-oriented
    data file format. In the features folder of v3.1.0 these are ppgs.parquet, sparc_ema.parquet,
    sparc_loudness.parquet, sparc_periodicity.parquet, sparc_pitch.parquet, torchaudio_spectrogram.parquet,
    torchaudio_mfcc.parquet, torchaudio_pitch.parquet and torchaudio_mel_spectrogram.parquet.
    Each element carries participant_id, session_id, task_name, n_frames and the tensor data for
    the feature. The metadata folder holds a further Parquet file with per-recording metadata.
  access_urls:
  - https://physionet.org/content/b2ai-voice/3.1.0/
  source_caveats: The schema's format and media-type enumerations do not define a Parquet value,
    so those slots are left unset rather than filled with an approximation.
- id: d4d:VOICE-distribution-format-tsv
  name: Tab-separated feature and phenotype tables
  format: TSV
  media_type: text/tab-separated-values
  description: Plain-text tab-delimited tables. In the features folder these are static_features.tsv,
    holding features derived from the raw audio with one row per unique recording, and audio_quality_metrics.tsv,
    holding quality-control metrics per audio recording. The phenotype folder holds tab-delimited
    tables organised into confounders, demographics, diagnosis, enrollment, questionnaire and
    task subfolders.
- id: d4d:VOICE-distribution-format-json
  name: JSON data dictionaries
  format: JSON
  media_type: application/json
  description: Every data file is accompanied by a data dictionary file with the same file stem
    and a .json suffix. For phenotype data the dictionary keys match the column names of the associated
    table, and each value gives a one-sentence description of the column, the question asked of
    the participant where applicable, and the data type of the response. For feature files the
    dictionary describes the feature and the processing used to prepare it.
distribution_dates:
- id: d4d:VOICE-distribution-dates
  name: PhysioNet release dates
  release_dates:
  - '1.1: 17 January 2025'
  - '2.0.0: 16 April 2025'
  - '2.0.1: 18 August 2025'
  - '3.0.0: 16 December 2025'
  - '3.1.0: 1 May 2026'
  description: The project documentation additionally records that an earlier release was published
    and made available at the end of November 2024 on the Health Data Nexus platform.
license_and_use_terms:
  id: d4d:VOICE-license-and-use-terms
  name: Bridge2AI Voice Registered Access License and Agreement
  license_terms: Files are released under the Bridge2AI Voice Registered Access License, and access
    requires signature of the Bridge2AI Voice Registered Access Agreement. Users must agree to
    the terms laid out in the registered access agreement. The intellectual property terms state
    that the data may be protected by copyright and other rights; duplication as reasonably required
    to carry out the research project is permitted; sale of all or part of the data on any media
    is not permitted; nothing in the agreement transfers intellectual property rights in or relating
    to the data; users agree not to make intellectual property claims on the data, and not to
    use intellectual property protection in ways that would prevent or block access to or use
    of any element of the data or conclusions drawn directly from it; users may obtain intellectual
    property rights on downstream discoveries but agree to implement licensing policies that will
    not obstruct further research, and to respect the Fort Lauderdale Agreement. There are no
    fees associated with these restrictions.
  data_use_permission: general_research_use
  description: Access to raw audio is governed separately by the Data Transfer and Use Agreement,
    under which the provider institution is the University of South Florida Board of Trustees.
    That agreement runs to two years after the start date, until completion of the project, until
    expiration of the applicable ethics approval, or until termination by the provider, whichever
    occurs first; it takes effect only upon review and approval by the Data Access Compliance
    Office through a distinct application; and on expiry the recipient must destroy the data in
    accordance with the provider's instructions and certify the destruction in writing within
    thirty days, retaining at most one archival copy as required by law, institutional policy,
    or research integrity and verification. Recipients are encouraged to make results publicly
    available in open-access journals or pre-print servers, must recognise the provider as the
    source of the data in public disclosures, and must adhere to the specific requirements of
    PhysioNet.org.
  source_caveats: The bundle names the access tier inconsistently. PhysioNet labels the v3.0.0
    and v3.1.0 releases 'Credentialed Access' with the policy 'Only credentialed users who sign
    the DUA can access the files' and no required training, while the superseded v1.1 record is
    labelled 'Restricted Access' with the policy 'Only registered users who sign the specified
    data use agreement can access the files'. The project documentation describes the featurized
    adult and pediatric datasets as available 'under registered access' and in the next sentence
    states that credentialed users must be approved and sign a DUA. The licence and agreement
    names carry the word 'Registered' in all of these. The current PhysioNet tier for v3.1.0 is
    recorded here as credentialed; the differing wording is not reconciled by the sources.
ip_restrictions:
  id: d4d:VOICE-ip-restrictions
  name: Intellectual property restrictions
  restrictions:
  - Sale of all or part of the data on any media is not permitted
  - Nothing in the agreement operates to transfer any intellectual property rights in or relating
    to the data to the recipient
  - Users agree not to make intellectual property claims on the data
  - Users agree not to use intellectual property protection, database rights or related rights
    in a way that could prevent or limit access to, or use of, any element of the data or research
    conclusions derived from it
  - Duplication is permitted only as reasonably required to carry out the recipient's research
    project
  description: No intellectual-property-based restrictions have been imposed by third parties.
    The data provider gives no guarantee that the data is free of third-party intellectual property
    rights, database rights and other related rights.
regulatory_restrictions:
  id: d4d:VOICE-regulatory-restrictions
  name: Regulatory and access restrictions
  regulatory_restrictions:
  - Access to the feature dataset requires PhysioNet credentialing and signature of the data use
    agreement
  - Access to raw audio requires a Data Access Request Form, a Data Use Agreement, review by the
    Data Access Compliance Office, and a Data Use and Transfer Agreement signed by an authorized
    official at the recipient institution
  - The data is covered under a Certificate of Confidentiality, which must be asserted against
    compulsory legal demands such as court orders and subpoenas for identifying information or
    characteristics of a research participant
  - Recipients must adhere to the specific requirements of PhysioNet.org, managed by the MIT Laboratory
    for Computational Physiology
  hipaa_compliant: compliant
  confidentiality_level: restricted
  other_compliance: The dataset applies the HIPAA de-identification rules and removes direct identifiers;
    HIPAA Safe Harbor identifiers were removed in preparing the release. The Data Transfer and
    Use Agreement classifies the data as Personally Identifiable Information as defined in OMB
    Memorandum M-07-16, and not covered under HIPAA, FERPA or similar laws requiring additional
    special terms.
  description: No export controls apply to the dataset. The provider may unilaterally amend the
    Data Transfer and Use Agreement should the federal sponsor require revision, in which case
    an objecting recipient's agreement terminates immediately and all data must be returned or
    destroyed.
  source_caveats: The Data Transfer and Use Agreement's statement that the data is 'not covered
    under HIPAA' concerns the legal classification of the transferred material under that agreement
    and stands alongside the project documentation's statement that HIPAA de-identification rules
    were applied to the released dataset; both are recorded rather than merged.
maintainers:
- id: d4d:VOICE-maintainer-daco
  name: Bridge2AI-Voice Data Access Compliance Office
  role: academic_institution
  maintainer_details: The access committee for the Bridge2AI-Voice datasets, reached at DACO@b2ai-voice.org.
    Applications for controlled access to raw audio are submitted to the Data Access Compliance
    Office for review, and the Data Transfer and Use Agreement is effective only upon that office's
    approval through a distinct application.
- id: d4d:VOICE-maintainer-mit-lcp
  name: MIT Laboratory for Computational Physiology
  role: academic_institution
  maintainer_details: PhysioNet, which hosts the released dataset, is maintained by the MIT Laboratory
    for Computational Physiology and supported by the National Institute of Biomedical Imaging
    and Bioengineering, the National Heart Lung and Blood Institute, and the NIH Office of the
    Director under NIH grant numbers U24EB037545 and R01EB030362.
- id: d4d:VOICE-maintainer-nih
  name: National Institutes of Health, Bridge2AI program
  role: government_agency
  maintainer_details: The dataset is supported by the NIH via the Bridge2AI project. Bridge2AI-Voice
    is supported by NIH grant OT2OD032720 through the NIH Bridge2AI Common Fund program.
- id: d4d:VOICE-maintainer-health-data-nexus
  name: Health Data Nexus, Temerty Centre for Artificial Intelligence Research and Education in
    Medicine, University of Toronto
  role: academic_institution
  maintainer_details: The project documentation states that the dataset is hosted by the Health
    Data Nexus, a data publishing platform maintained by the Temerty Center for Artificial Intelligence
    Research and Education in Medicine (T-CAIREM) based at the University of Toronto, which maintains
    the technical infrastructure hosting the dataset and provides continued access to interested
    researchers.
  source_caveats: This statement belongs to the healthsheet section that describes the earlier
    Health Data Nexus release; the current release is hosted on PhysioNet. The documentation elsewhere
    describes the Health Data Nexus copy as an earlier version of the feature-only dataset, which
    provides cloud compute alongside the dataset rather than allowing downloads.
errata:
- id: d4d:VOICE-erratum
  name: Errata and changelog
  erratum_details: There is no erratum. A changelog for each dataset version is published online
    with the dataset metadata.
  description: Version 2.0.1 consisted of corrections in the authorship list.
updates:
  id: d4d:VOICE-updates
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details: Yes, further versions of the dataset will be released on a semi-annual basis.
    These updates will be distributed as new versions of the dataset. Users will be notified through
    news items on the platform as well as through standard communication channels. The dataset
    is released as static versions rather than being dynamically updated.
  description: 'The realised release history is consistent with roughly semi-annual major updates:
    v1.1 in January 2025, v2.0.0 in April 2025, v2.0.1 in August 2025, v3.0.0 in December 2025
    and v3.1.0 in May 2026. Further releases are stated to contain additional data, and the project
    documentation notes that Spanish protocols and data collection will be included in future
    releases.'
  source_caveats: The stated distribution channel for these updates in the project documentation
    is the Health Data Nexus platform, which describes the earlier release; the observed releases
    were published on PhysioNet.
retention_limit:
  id: d4d:VOICE-retention-limit
  name: Retention limits
  retention_period: Indefinite for contributed research data; a maximum of ten years after study
    completion for identifiable data held locally; a minimum of five years after study completion
    for consent documents.
  retention_details: Once data is contributed, the data will be retained as long as it is useful
    for research purposes, possibly indefinitely. Identifiable data and datasheets linking participant
    numbers to participant information are kept in each institution on local cloud storage for
    a maximum of ten years after study completion and are then destroyed, which is the responsibility
    of each local principal investigator. The USF IRB requires de-identified study data and original
    consent forms to be stored for a minimum of five years after the completion of the study,
    and original paper consent documents cannot be destroyed until five years after study completion.
version_access:
  id: d4d:VOICE-version-access
  name: Version access
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  versions_available:
  - '1.1'
  - 2.0.0
  - 2.0.1
  - 3.0.0
  - 3.1.0
  version_details: 'Each version of the dataset has a unique DOI: 10.13026/249v-w155 for v1.1,
    10.13026/k81f-qr68 for v3.0.0 and 10.13026/8xbn-nq66 for v3.1.0, with 10.13026/37yb-1t42 resolving
    to the latest version. By default, older versions of the dataset continue to be supported,
    hosted and made available to researchers, though the dataset publishers reserve the right
    to remove access to older versions. The files for v1.1 are no longer available on PhysioNet.
    An earlier version of the feature-only dataset, cited as version 1.0 with DOI 10.57764/qb6h-em84,
    is available on Health Data Nexus, which provides cloud compute alongside the dataset rather
    than allowing data downloads. The release notes record that v1.1 added Mel-frequency cepstral
    coefficients; v2.0 provided data for an additional 136 participants, reprocessed spectrograms,
    and removed all spectrograms and MFCCs from free-speech files; v2.0.1 corrected the authorship
    list; v3.0.0 was a major update with new data for an additional 391 participants, split the
    single phenotype file into individual files, added sparc and ppgs features and reorganised
    the files; and v3.1.0 was a minor update with no new participants but additional data for
    certain participants, repaired parquet files, new audio-quality and per-audio metadata files,
    back-filled validated diagnosis information, rearranged phenotype files and some renamed gold-standard
    variables.'
extension_mechanism:
  id: d4d:VOICE-extension-mechanism
  name: Extension and contribution mechanism
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: For dataset extensions and augmentations, it is possible for others to publish
    a derivative dataset on the Health Data Nexus which references the original source; these
    derivative datasets may be made available under the same conditions as the source data. For
    augmentations to the code used to produce the data, the open-source repositories have discussion
    forums and issue pages which allow for public discussion of data preprocessing, and the repository
    has a pull-request mechanism for contributing improvements to the data preprocessing code.
is_deidentified:
  id: d4d:VOICE-deidentification
  name: De-identification
  identifiable_elements_present: false
  method: Identifiable information, under HIPAA and the Common Rule, as well as data considered
    sensitive, have been removed from this dataset. HIPAA Safe Harbor identifiers were removed,
    dates are rebased or replaced by integers, and geographic information is removed or generalized,
    with state and province removed while country of data collection is retained. The dataset
    does not achieve k-anonymization with k of at least 2.
  identifiers_removed: All direct identifiers were removed, including name, civic address and
    social security numbers. Indirect identifiers were removed where they created a significant
    risk of participant re-identification through combination with other public data, including
    select geographic or demographic identifiers and some information about household composition
    or cultural identity. Non-identifying elements revealing highly sensitive information, such
    as household income, mental health status and traumatic life experiences, were also removed.
    Narrative text fields are removed. All raw voice data was removed.
  deidentification_details: For v3.0.0 onwards, raw audio transcripts were reviewed and any audio
    recordings containing potentially identifying information or external voices were removed
    from the release; all fields encoded as sensitive in the REDCap data dictionary were removed;
    and all spectrograms, MFCCs, Mel spectrograms, transcriptions, electromagnetic articulography
    traces and phonetic posteriorgrams from open-response prompts were removed from the feature-only
    dataset. In v3.1 spectrograms, Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive
    records and audio checks are removed. The project documentation notes that the pre-processing
    for de-identification consisted of extracting features from the raw audio to limit re-identification
    and releasing only the extracted features.
external_resources:
- id: d4d:VOICE-external-resources
  name: External resources and supporting materials
  external_resources:
  - eipm/bridge2ai-redcap - Bridge2AI REDCap data dictionary and metadata, MIT licensed (https://github.com/eipm/bridge2ai-redcap)
  - b2aiprep - the code used to preprocess raw audio waveforms into the parquet files and to merge
    the source data into the phenotype files, Apache-2.0 licensed (https://github.com/sensein/b2aiprep)
  - senselab - processing of audio files for research tasks (https://github.com/sensein/senselab)
  - eipm/bridge2ai-docs - source code for the documentation and dashboard at https://docs.b2ai-voice.org/,
    MIT licensed
  - B2Ai-Voice FHIR profiles for voice as a biomarker
  future_guarantees: Not stated. The project documentation answers 'NA' to whether there are guarantees
    that external resources will exist and remain constant over time, and 'NA' to whether there
    are official archival versions of the complete dataset including the external resources as
    they existed at the time the dataset was created.
  restrictions:
  - No restrictions, licenses or fees on external resources are stated; the project documentation
    answers that the dataset itself is self-contained
  description: The project documentation answers that the dataset is self-contained and does not
    rely on external resources, while separately listing the supporting code and metadata repositories
    recorded above.
distributions:
- id: d4d:VOICE-fc-features
  name: features
  path: features/
  description: 'Derived audio features for release v3.1.0. Dense binary files in Parquet format:
    ppgs.parquet (n=29,289), sparc_ema.parquet (n=28,640), sparc_loudness.parquet (n=31,855),
    sparc_periodicity.parquet (n=31,872), sparc_pitch.parquet (n=31,872), torchaudio_spectrogram.parquet
    (n=29,278), torchaudio_mfcc.parquet (n=29,278), torchaudio_pitch.parquet (n=32,522) and torchaudio_mel_spectrogram.parquet
    (n=29,278). Plain-text files: static_features.tsv, holding features derived from the raw audio
    with one row per unique recording, and audio_quality_metrics.tsv, holding quality-control
    metrics per audio recording. Every file has a paired JSON data dictionary with the same file
    stem.'
- id: d4d:VOICE-fc-metadata
  name: metadata
  path: metadata/
  description: A Parquet file and its corresponding data dictionary holding specific information
    about each recording, including task instructions and prompts as well as information about
    the microphone used and its gain. This folder is new in v3.1.0.
- id: d4d:VOICE-fc-phenotype
  name: phenotype
  path: phenotype/
  description: Organised information collected from the participant or another individual during
    their encounter, as tab-delimited tables with paired JSON data dictionaries, in the subfolders
    confounders, demographics, diagnosis, enrollment, questionnaire and task. In v3.1.0 the diagnosis
    subfolder holds airway_stenosis, amyotrophic_lateral_sclerosis, anxiety, benign_lesions, bipolar_disorder,
    cognitive_impairment, control, copd_and_asthma, depression, glottic_insufficiency, laryngeal_cancer,
    laryngeal_dystonia, laryngitis, muscle_tension_dysphonia, parkinsons_disease, precancerous_lesions,
    unexplained_chronic_cough and unilateral_vocal_fold_paralysis; the enrollment subfolder holds
    eligibility, enrollment_form and participant; the questionnaire subfolder holds adhd_adult,
    custom_affect_scale, dsm5_adult, dyspnea_index, gad7_anxiety, leicester_cough_questionnaire,
    panas, phq9, productive_vocabulary, psychiatric_history, ptsd_adult, vhi10 and voice_perception;
    and the task subfolder holds acoustic_task, harvard_sentences, random_item_generation, recording,
    session, stroop and winograd. Phenotype data files contain a row for a participant only if
    at least one column is not missing, and may contain more than one row per participant where
    visits were repeated.
