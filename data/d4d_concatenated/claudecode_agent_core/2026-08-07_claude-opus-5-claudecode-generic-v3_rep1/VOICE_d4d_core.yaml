id: https://doi.org/10.13026/8xbn-nq66
name: b2ai-voice
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
description: Bridge2AI-Voice is a flagship, ethically sourced voice, speech and respiratory-sound
  dataset linked to multimodal health information, generated by the Bridge2AI-Voice consortium
  under the NIH Common Fund Bridge2AI program. The published adult release distributes features
  derived from voice recordings rather than the original audio waveforms, together with detailed
  demographic, clinical and validated-questionnaire data. Release v3.1.0 (published 1 May 2026
  on PhysioNet) contains data for 833 adult participants collected across five sites in North
  America. Participants were selected on the basis of known conditions that manifest in the voice
  waveform - voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders and respiratory disorders - alongside participants without those conditions who serve
  as controls. Derived features include torchaudio spectrograms, Mel spectrograms, MFCCs and pitch;
  Speech Articulatory Coding (sparc) electromagnetic-articulography, loudness, periodicity and
  pitch traces; phonetic posteriorgrams; and static acoustic and phonetic features from openSMILE,
  Praat and Parselmouth. Phenotype data cover demographics, acoustic confounders, disease-specific
  diagnosis forms, enrollment information, validated questionnaires and per-task records. Raw
  audio is not distributed through PhysioNet; it is released separately under controlled access
  via Synapse after institutional sign-off.
