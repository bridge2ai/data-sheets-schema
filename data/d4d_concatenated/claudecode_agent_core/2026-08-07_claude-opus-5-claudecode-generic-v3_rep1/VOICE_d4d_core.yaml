source_caveats: The declared bundle describes an ongoing release programme rather than a single
  frozen artifact, and its documents were captured at different times. This record takes the adult
  PhysioNet project b2ai-voice as its referent and its current release v3.1.0 as the current state,
  following the source manifest's instruction to prefer the 3.1.0 capture over the 3.0.0 capture
  where the two disagree. Several documents therefore describe superseded states and are labelled
  as such where used. The project documentation site (docs.b2ai-voice.org) mixes current text
  with healthsheet answers written for v2.0.0 and for the earlier Health Data Nexus release, so
  its statements about distribution platform, hosting, enrollment target and sensitive-field content
  conflict with the current PhysioNet record; both readings are recorded in the relevant slots
  rather than merged. The Bridge2AI-Voice Pediatric Dataset is a separate PhysioNet project with
  its own DOI, cohort, protocol and ethics approval; it is recorded here only as a related dataset.
  The feasibility publication (PMC12037532) reports a 47-participant single-site study of the
  data-collection application at USF Health Voice Center and is not a description of this dataset's
  contents; it is cited only as evidence about the collection instrument. Several contact e-mail
  addresses in the documentation capture were redacted by the preprocessing pipeline and are unavailable;
  the award-number strings in the documentation footer and healthsheet ('3Tf-OTOD03272001S2',
  '3TF-OT2ActfOD032720Projectf01S1') are corrupted and were not transcribed.
purposes:
- id: d4d:VOICE-purpose-flagship-voice-dataset
  name: Flagship ethically sourced voice dataset for voice AI research
  description: Bridge2AI-Voice was created to generate a large-scale, ethically sourced, demographically
    diverse voice, speech and cough dataset linked to multimodal health metadata, so that voice
    can be developed as a biomarker of health for use in clinical care. The consortium's stated
    aim is to fuel voice AI research and to build predictive models that assist in the screening,
    diagnosis and treatment of a broad range of diseases.
  response: The Bridge2AI Voice dataset was created to address a gap in the availability of large-scale,
    diverse, and well-documented voice data for use in clinical machine-learning applications.
    Previous studies on machine learning-based voice diagnosis produced promising results, but
    their sample sizes were too small, or they lacked the key metadata needed for training robust,
    clinically useful models. The dataset aims to bridge this gap by providing an ethically sourced,
    large, and diverse dataset to develop, benchmark, or validate clinically applicable AI/ML
    models. The goal is to facilitate the use of voice as a non-invasive, cost-effective biomarker
    for the screening, diagnosis, and monitoring of a wide range of health conditions.
- id: d4d:VOICE-purpose-audiomics-standards
  name: Establishing standards for audiomics
  description: 'Beyond the dataset itself, the project pursues six stated aims for the emerging
    field of audiomics: ensuring quality and accuracy of acoustic and associated clinical data
    through clinical validation and evidence-based recording protocols; interoperability through
    new bioinformatics standards for voice data; benchmarks of diversity metrics and minimisation
    of algorithmic bias; ethical and legal norms that safeguard participants'' data while supporting
    data sharing; infrastructure for audiomics data storage and sharing within and across research
    institutions; and training pathways for scientists, engineers, bioethicists and clinicians.'
  response: To introduce the field of acoustic biomarkers by developing new standards of acoustic
    and voice data collection and analysis for voice AI research.
tasks:
- id: d4d:VOICE-task-disease-classification
  name: Voice-based disease detection and classification
  description: The release comes with predefined tasks and labelling. The tasks are primarily
    designed for training machine-learning models for disease detection and classification using
    voice data, with labels comprising diagnostic categories such as vocal pathologies, neurological
    disorders, psychiatric conditions and respiratory disorders.
  response: Yes, the current version of the dataset comes with predefined tasks and labeling.
    The tasks are primarily designed for training machine-learning models for disease detection
    and classification using voice data. Labels include diagnostic categories such as vocal pathologies,
    neurological disorders, psychiatric conditions, and respiratory disorders.
- id: d4d:VOICE-task-model-development-benchmarking
  name: Model development, benchmarking and validation
  description: The dataset is stated to enable the development, benchmarking or validation of
    clinically applicable machine-learning models for diagnosing a wide range of health conditions
    using voice data, and can be used for AI model pretraining, fine-tuning, benchmarking or validation.
addressing_gaps:
- id: d4d:VOICE-gap-small-nonstandard-voice-datasets
  name: Small, non-standardised and non-public voice datasets
  description: Existing voice AI research was limited to small- to medium-sized datasets, often
    using voice as the only data type and lacking the clinical metadata needed for annotation
    and validation. Comparing studies and pooling data is difficult because standards for how
    voice and speech data are collected do not exist, and industry datasets are typically private,
    which prevents auditing of models and of the accuracy of training labels. In machine-learning
    applications for laryngeal cancer screening and diagnosis, most studies reported training
    datasets of fewer than 300 patients and only two used more than one data modality.
  response: Current literature on this topic has only been studied on small- to medium-sized data
    sets with limited data outside of acoustic measures not linked to multi-modal health data.
- id: d4d:VOICE-gap-ethics-governance
  name: Absence of a governance framework for voice data
  description: The consortium identifies unique ethical and legal challenges in audiomics linked
    to HIPAA, potential re-identification of patients by their voice, voice hacking and data ownership,
    and states that these call for a new governance framework covering diversity, data handling
    and privacy safeguards.
