source_caveats: 'The declared bundle provides no persistent identifier for the dataset itself (no DOI,
  accession, or repository record), so the required `id` slot carries the CHoRUS project website URL as
  the only public identifier the sources supply. Admission counts differ across the bundle and are recorded
  with their stated scopes rather than reconciled: the NIH RePORTER abstract states an intent to acquire
  data from more than 100,000 critically ill patients, the chorus4ai.org site distinguishes an "Anticipated
  Final Dataset" of 100,000 patient admissions from a "Current Released Dataset" of 50,000 patient admissions,
  and the September 2025 AIM-AHEAD webinar states that as of August 2025 the dataset covered 14 different
  hospitals with over 45,000 unique admissions. The webinar PDF''s data-type table survives text extraction
  with its columns interleaved; data type, data standard, access control and published metadata schema
  can be matched to rows by content, but the per-row "Metadata" column (values Yes / Planned) cannot be
  reliably assigned to rows and is therefore not recorded. The `keywords` values are the NIH RePORTER
  "Preferred terms" index list for award OT2OD032701, which describes the funded project rather than the
  released dataset. The MIT license statement in the bundle applies to the CHoRUS GitHub project and its
  software, not to the dataset; the bundle states no license for the data itself. The program manager
  email address is transcribed verbatim from chorus4ai.org, including its apparent misspelling of the
  institutional domain.'
purposes:
- id: purpose_ai_ready_critical_care_dataset
  name: Develop a publicly available, AI-ready critical care dataset
  response: The project's overarching goal is to develop a publicly available, AI-ready critical care
    dataset, while ensuring the methods promote privacy, accountability, and clinical benefit, while promoting
    a new generation of AI clinicians and scientists. There is an urgent need for infrastructure to support
    artificial intelligence and machine learning (AI/ML) in critical care, and developing high-resolution
    multi-center data sets is a critical first step towards actionable and trustworthy AI.
- id: purpose_holdout_external_validation
  name: Provision a holdout test set for external model validation
  response: The dataset will also provision a holdout test set, accessible for model external validation
    to aid marketplace adoption of AI-developed models for implementation in acute and critical care.
- id: purpose_workforce_and_education
  name: Support AI/ML workforce development and education in clinical care
  response: The dataset supports a comprehensive set of approaches to develop the skills and workforce
    for a next generation of diverse academic and community AI scientists, and to cultivate expertise
    in the lay and scientific community to improve AI literacy and utilization through multimodal educational
    approaches. The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI
    CHoRUS data through engagement, AI training, and mentorship.
tasks:
- id: task_characterize_acute_critical_illness
  name: Characterize acute and critical care illness
  response: The CHoRUS data generation project generates data for ML/AI applications aimed at characterizing
    acute and critical care illness, predicting complications, and measuring treatment response among
    patients with acute or critical illness.
- id: task_label_prediction_targets
  name: Label data with targets important for prediction
  response: A visualization and annotation environment will label data with targets important for prediction.
- id: task_external_model_validation
  name: External validation of AI/ML models
  response: Sequestered holdout datasets are provisioned for external validation of models, to aid marketplace
    adoption of AI-developed models for implementation in acute and critical care.
addressing_gaps:
- id: gap_ai_ml_infrastructure_for_critical_care
  name: Missing infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence and machine
    learning (AI/ML) in critical care. Developing high-resolution multi-center data sets is a critical
    first step towards actionable and trustworthy AI.
- id: gap_diverse_high_resolution_ethically_sourced_data
  name: Absence of a diverse, high-resolution, ethically sourced, AI-ready critical care dataset
  response: The goal of the CHoRUS Network is to develop the most diverse, high-resolution, ethically
    sourced, AI-ready data set to answer the grand challenge of improving recovery from acute illness.
- id: gap_legal_and_ethical_framework_for_scale
  name: Lack of a legal and ethical framework for collecting clinical data at scale
  response: The project will establish a legal framework for collecting data at scale, sampling to ensure
    comprehensive sets of patient conditions and clinical treatment strategies, and will perform community-facing
    ethics focus groups to determine what data is appropriate for public sharing. Patient-focused efforts
    will determine the ethical and legal approaches to manage privacy and bias, while accounting for Social
    Determinants of Health.
