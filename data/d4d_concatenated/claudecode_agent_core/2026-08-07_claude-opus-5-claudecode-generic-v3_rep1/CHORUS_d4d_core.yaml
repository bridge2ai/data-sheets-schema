ethical_reviews:
- id: ethics_community_focus_groups
  name: Community-facing ethics focus groups
  review_details: The project will perform community-facing ethics focus groups to determine what data
    is appropriate for public sharing. Ethics is one of the project's three pillars (Ethical and Trustworthy
    AI). The CHoRUS consortium evaluates community perspectives on clinical care AI to find ways to increase
    trustworthiness of provenance and privacy in AI, and new approaches are being created as the existing
    legal and regulatory landscape is analyzed.
  source_caveats: The declared bundle names no institutional review board, protocol number, or reviewing
    organization for the dataset, so `reviewing_organization` and `contact_person` are not recorded.
data_protection_impacts:
- id: dpia_community_determination_of_shareable_data
  name: Community determination of data appropriate for public sharing
  impact_details: Community-facing ethics focus groups are conducted to determine what data is appropriate
    for public sharing, and patient-focused efforts determine the ethical and legal approaches to manage
    privacy and bias while accounting for Social Determinants of Health. The consortium analyses the existing
    legal and regulatory landscape and develops new approaches to increase trustworthiness of provenance
    and privacy in AI.
  source_caveats: The declared bundle does not report a formal data protection impact assessment for the
    dataset or any of its findings; the entry records the ethics activities the bundle describes rather
    than a completed assessment.
human_subject_research:
  id: human_subject_research_chorus
  name: Human subjects research status
  involves_human_subjects: true
  special_populations:
  - Critically ill adult intensive care unit (ICU) patients
  - Pediatric intensive care unit (PICU) patients
  - Neonatal intensive care unit (NICU) patients
  description: The dataset is assembled from the clinical records of patients requiring critical care,
    described as an AI-ready data set from more than 100,000 critically ill patients in the project's
    stated target, with the Current Released Dataset drawn from ICU, PICU, and NICU admissions.
  source_caveats: The declared bundle states no IRB approval, protocol identifier, ethics review board,
    or regulatory compliance determination for the dataset, so those slots are not recorded.
at_risk_populations:
  id: at_risk_populations_critical_care
  name: At-risk populations and protections
  at_risk_groups_included: true
  special_protections:
  - Controlled access to every data type in the dataset
  - Tokenization of unstructured electronic health record content using the OHNLP toolkit
  - Local storage of clinical notes at contributing sites, with only tokens held in the enclave
  - De-identification of imaging, reported as in process for the larger cohort in September 2025
  - Data transformation using approaches that limit re-identification
  description: The dataset covers critically ill patients including pediatric (PICU) and neonatal (NICU)
    intensive care admissions.
  source_caveats: The declared bundle does not describe assent procedures or guardian consent arrangements,
    so those slots are not recorded.
preprocessing_strategies:
- id: preprocessing_omop_standardization
  name: Standardization to the OMOP Common Data Model
  preprocessing_details: Acquired data are standardized to the OMOP Common Data Model. Unified standards
    harmonize multi-modal EHR, waveform, imaging, and text data, and validated semantic mappings connect
    clinical data in various source formats to international standards. Demographics, medication administration,
    procedures, nursing flowsheets, and diagnoses are represented in OMOP, with nursing flowsheets published
    against an OMOP schema with extensions.
  used_software:
  - id: software_chorus_mapping
    name: chorus-mapping
    description: Repository with documentation and pooled tabular mappings, and an associated clinical
      validation SOP, for contributing to CHoRUS semantic mapping efforts.
- id: preprocessing_note_tokenization
  name: Clinical note extraction and tokenization
  preprocessing_details: Clinical notes are extracted and tokenized using the OHNLP toolkit, and the project
    describes tokenizing unstructured electronic health record data as one of the capabilities it develops
    across the multi-center network.
  used_software:
  - id: software_ohnlp_toolkit
    name: OHNLP toolkit
    description: Natural language processing toolkit used to extract and tokenize clinical notes; published
      metadata for this modality follows the OHNLP open source schema.
- id: preprocessing_waveform_conversion
  name: Waveform conversion and release preparation
  preprocessing_details: Waveform data are converted for release, with telemetry represented in WFDB against
    an extended PhysioNet schema and EEG represented in EDF+ and Persyst.
  used_software:
  - id: software_chorus_waveform
    name: chorus_waveform
    license: MIT
    description: CHoRUS waveform documentation and various waveform conversion scripts (Jupyter Notebook).
  - id: software_chorus_waveform_resources
    name: chorus_waveform_resources
    description: Resources which support the preparation and release of waveforms.
- id: preprocessing_deidentification
  name: De-identification and privacy scanning
  preprocessing_details: The project transforms data using approaches that limit re-identification and
    maintains dedicated de-identification and privacy scanning tooling within its repository space.
  used_software:
  - id: software_privacy_scan_tool
    name: privacy_scan_tool
    description: A privacy scan tool for medical records (Python).
  - id: software_ctp_deid
    name: CTP-deid
    description: A repository in the chorus-ai GitHub organization; the organization overview lists it
      without a description.
- id: preprocessing_geocoding
  name: Geocoding of location entities
  preprocessing_details: The project states that data elements feature appropriate contextual factors
    such as geographic distance to the nearest hospital, and maintains open source code to geocode OMOP
    Location entities.
  used_software:
  - id: software_uf_geocoding
    name: UF-Geocoding
    license: MIT
    description: Open source code to geocode OMOP Location entities via DeGauss (Python), forked from
      bihorac-LAB/Exposome.
  - id: software_degauss
    name: DeGauss
    description: Geocoding tool used by UF-Geocoding to geocode OMOP Location entities.
cleaning_strategies:
- id: cleaning_site_characterization_feedback
  name: Site characterization reports following data submission
  cleaning_details: Characterization reports are produced and returned to sites following their data submissions,
    and standard operating protocols instruct data contributing sites about best practices for curating
    and delivering interoperable datasets.
  source_caveats: The declared bundle does not describe specific record-level cleaning rules, exclusion
    criteria, or missing-value handling; the entry records the quality-feedback mechanism the bundle describes.
  used_software:
  - id: software_chorus_reports
    name: CHoRUSReports
    description: Repository dedicated to producing characterization reports to return to sites following
      their data submissions (R).
labeling_strategies:
- id: labeling_visualization_and_annotation_environment
  name: Visualization and annotation environment
  data_annotation_platform: CHoRUS visualization and annotation environment
  labeling_details: A visualization and annotation environment will label data with targets important
    for prediction. The project describes developing capabilities across a multi-center network to acquire,
    standardize, tokenize, store, visualize, and label data.
  source_caveats: The declared bundle does not report an annotation protocol, the number of annotations
    per item, inter-annotator agreement, or annotator demographics, so those slots are not recorded.
raw_sources:
- id: raw_data_clinical_notes_local
  name: Clinical note text retained locally at contributing sites
  raw_data_details: 'OMOP and telemetry data are held in the cloud enclave, with the exception of clinical
    notes: note text is stored locally at contributing sites and only tokens are held in the enclave.'
  source_caveats: The declared bundle gives no access point for the locally retained note text, so `access_url`
    is not recorded.
machine_annotation_tools:
- id: machine_annotation_ohnlp
  name: Automated clinical text processing
  tools:
  - OHNLP toolkit
  tool_descriptions: Clinical notes are extracted and tokenized using the OHNLP toolkit; published metadata
    for this modality follows the OHNLP open source schema.
  source_caveats: The declared bundle reports no accuracy figures for this tooling, so `tool_accuracy`
    is not recorded.
existing_uses:
- id: existing_use_training_and_publications
  name: Training activities and publications
  examples:
  - Training activities
  - Publications
  description: The September 2025 AIM-AHEAD webinar states that the datasets are being used for training
    activities and publications. The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access
    to Bridge2AI CHoRUS data through engagement, AI training, and mentorship, and trainees use the data
    on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud to develop practical use cases, poster
    presentations, conference abstracts, and manuscripts.
other_tasks:
- id: other_task_marketplace_adoption
  name: Supporting marketplace adoption of clinical AI models
  task_details: The holdout test set is accessible for model external validation to aid marketplace adoption
    of AI-developed models for implementation in acute and critical care.
- id: other_task_trainee_use_cases
  name: Trainee-developed use cases in clinical AI
  task_details: Trainees in the AIM-AHEAD Bridge2AI for Clinical Care Training Program develop and present
    use cases suitable to apply in Bridge2AI Data Topics, and participate in collaborative research on
    the Bridge2AI Clinical Care Cloud platform.
intended_uses:
- id: intended_use_critical_care_ai
  name: AI/ML research in acute and critical care
  examples:
  - Characterizing acute and critical care illness
  - Predicting complications among patients with acute or critical illness
  - Measuring treatment response among patients with acute or critical illness
  - External validation of AI/ML models against the sequestered holdout test set
  - Hands-on AI/ML training and education in clinical care
  usage_notes: The dataset is intended to support machine-learning and artificial-intelligence-derived
    models to improve the care and outcomes of patients requiring critical care, and to catalyze biomedical
    research and expertise promoting the patient-focused deployment of AI in acute and critical care.
future_use_impacts:
- id: future_use_privacy_and_bias
  name: Privacy and bias considerations shaping future use
  impact_details: 'The project''s stated design concerns bear on downstream use: methods are intended
    to promote privacy, accountability, and clinical benefit; patient-focused efforts determine the ethical
    and legal approaches to manage privacy and bias while accounting for Social Determinants of Health;
    and community-facing ethics focus groups determine what data is appropriate for public sharing. The
    CHoRUS consortium evaluates community perspectives on clinical care AI to find ways to increase trustworthiness
    of provenance and privacy in AI.'
distribution_formats:
- id: distribution_format_omop
  name: OMOP Common Data Model
  format: OMOP
  description: Demographics, medication administration, procedures, nursing flowsheets, and diagnoses
    are standardized to the OMOP Common Data Model and released under controlled access. The published
    metadata schema is the OMOP schema, with extensions for nursing flowsheets.
- id: distribution_format_ohnlp
  name: OHNLP
  format: OHNLP
  description: Clinical notes, extracted and tokenized using the OHNLP toolkit, are released under controlled
    access. The published metadata schema is the OHNLP open source schema.
- id: distribution_format_dicom
  name: DICOM
  format: DICOM
  description: Imaging from PACS is released under controlled access in DICOM. The published metadata
    schema is the DICOM schema.
- id: distribution_format_wfdb
  name: WFDB
  format: WFDB
  description: Waveform telemetry from bedside monitors and gateway/middleware is released under controlled
    access in WFDB. The published metadata schema is an extended PhysioNet schema.
- id: distribution_format_edf_persyst
  name: EDF+ and Persyst
  format: EDF+ and Persyst
  description: Waveform EEG from hospital databases is released under controlled access in EDF+ and Persyst.
    The published metadata schema is the open source EDF+ and Persyst schema.
license_and_use_terms:
  id: license_and_use_terms_chorus
  name: Controlled access under a signed licensing agreement
  license_terms: Access to every data type in the dataset is controlled. Participants in the AIM-AHEAD
    Bridge2AI for Clinical Care Training Program complete a registration form giving name, email, and
    institution, and all participants must sign a licensing agreement included in the registration form
    before gaining access to the dataset; once access is granted and compute is provisioned, an email
    is sent. A ".edu" email address is required in order to gain access to the dataset. Neither requirement
    is a barrier to acceptance into the program, and program administrators will assist with access if
    needed. Access requests are directed on the CHoRUS GitHub organization overview to dbold@emory.edu
    or jared.houghtaling@tuftsmedicine.org.
  source_caveats: The registration, licensing-agreement, and ".edu" email requirements are stated in the
    context of the AIM-AHEAD Bridge2AI for Clinical Care Training Program; the declared bundle does not
    state whether identical terms govern access obtained outside that program. No data license identifier
    is given for the dataset. The MIT license named in the bundle governs the CHoRUS GitHub project and
    its software rather than the data.
regulatory_restrictions:
  id: regulatory_restrictions_chorus
  name: Regulatory and confidentiality status
  confidentiality_level: restricted
  regulatory_restrictions:
  - 'chorus4ai.org carries a site-wide notice, verbatim: "This repoitory is under review for potential
    modification in compliance with Administration directives."'
  description: Every data type in the dataset is recorded with an access control status of "Controlled".
  source_caveats: The site notice is transcribed verbatim, including its spelling of "repoitory"; the
    declared bundle does not make clear whether "repository" refers to the CHoRUS data repository or to
    the project website, nor what modification is contemplated. No HIPAA or other formal compliance determination
    for the dataset is stated in the bundle, so `hipaa_compliant` and `other_compliance` are not recorded.
maintainers:
- id: maintainer_chorus_consortium
  name: CHoRUS for Equitable AI
  role: academic_institution
  maintainer_details: The CHoRUS consortium maintains the project website at chorus4ai.org and a GitHub
    organization (chorus-ai) hosting 28 repositories of software and tooling, validated semantic mappings,
    standard operating protocols, and project management overviews. The organization is listed as based
    in the United States of America. A package status page reports versions, maintainers, and other metadata
    about CHoRUS packages. The GitHub overview also gives www.bridge2ai.org/chorus as a project website.
- id: maintainer_program_manager
  name: Ciera McCrary
  maintainer_details: Program Manager, MGH; listed as the contact on chorus4ai.org with the email address
    cmccrary@mgh.havard.edu.
  source_caveats: The email domain is transcribed verbatim from chorus4ai.org and appears to misspell
    "harvard"; the bundle offers no corrected form.
- id: maintainer_access_contact_emory
  name: Data access request contact at Emory
  maintainer_details: Listed on the CHoRUS GitHub organization overview under "Request access" with the
    email address dbold@emory.edu; the overview gives no name for this contact.
- id: maintainer_access_contact_tufts
  name: Jared Houghtaling
  maintainer_details: Listed on the CHoRUS GitHub organization overview under "Request access" with the
    email address jared.houghtaling@tuftsmedicine.org. Named separately in the September 2025 AIM-AHEAD
    webinar as the Tufts lecturer for the session "Working with EHR Data for Research".
updates:
  id: update_plan_chorus
  name: Ongoing dataset growth and modality completion
  update_details: The dataset is being expanded toward an Anticipated Final Dataset of 100,000 patient
    admissions, 9 different data modalities, and 14 data contributing hospitals, from a Current Released
    Dataset of 50,000 patient admissions. As of September 2025, imaging de-identification was in process
    for a larger cohort, EEG extraction was in process, and published metadata was planned but not yet
    available for several modalities. Data contributing sites provide regular status updates on their
    progress in creating and curating a CHoRUS-specific clinical data extract, submitted either through
    the GitHub interface or a Google Form, with a GoogleScript triggered on each submission calling the
    GitHub API to update status and issue information.
  source_caveats: The declared bundle states no update frequency for the dataset, so `frequency` is not
    recorded.
version_access:
  id: version_access_chorus
  name: Released and anticipated dataset versions
  versions_available:
  - Current Released Dataset
  - Anticipated Final Dataset
  version_details: chorus4ai.org distinguishes a Current Released Dataset (50,000 patient admissions from
    ICU, PICU, and NICU; 1.6 billion rows of EHR OMOP data; 7,642 admissions with radiology data; 23 Tb
    of waveform data) from an Anticipated Final Dataset (100,000 patient admissions; 9 different data
    modalities; 14 data contributing hospitals).
  source_caveats: The declared bundle assigns no version number or DOI to either release and does not
    state whether earlier releases remain available, so `latest_version_doi` is not recorded and the two
    entries in `versions_available` are the source's own headings rather than version identifiers.
extension_mechanism:
  id: extension_mechanism_chorus
  name: Contributing to CHoRUS through the GitHub organization
  contribution_url: https://github.com/chorus-ai
  extension_details: The CHoRUS GitHub organization houses active repositories providing software and
    tooling to interact with and extract insight from clinical data in diverse formats, validated semantic
    mappings for connecting clinical data in various source formats to international standards, standard
    operating protocols instructing data contributing sites about best practices for curating and delivering
    interoperable datasets, and project management overviews tracking data delivery statuses and task
    dependencies. Clinical collaborators may contribute to mapping efforts through the chorus-mapping
    repository and its clinical validation SOP; data site managers may raise issues in the Standards Discussions
    or Data Acquisition Discussions; software contributors and users are directed to the web guide compiled
    in the chorus-developer repository. Community users are invited to browse these resources and the
    public-facing project webpage.
is_deidentified:
  id: deidentification_chorus
  name: De-identification status
  method: Unstructured electronic health record content is tokenized, with clinical notes extracted and
    tokenized using the OHNLP toolkit and note text retained locally at contributing sites so that only
    tokens reach the cloud enclave. Data are transformed using approaches that limit re-identification.
    Imaging de-identification was reported as in process for the larger cohort in September 2025, with
    1,000 images available at that time.
  source_caveats: The declared bundle does not enumerate which identifiers are removed, name a de-identification
    standard, or state whether individuals remain identifiable in the released data, so `identifiers_removed`
    and `identifiable_elements_present` are not recorded.
external_resources:
- id: external_resources_chorus
  name: External systems and standards the dataset depends on
  external_resources:
  - Hospital electronic health record systems at the 14 data contributing hospitals
  - Picture archiving and communication systems (PACS) at contributing hospitals
  - Bedside monitors and gateway/middleware supplying waveform telemetry
  - Hospital EEG databases
  - Local site storage retaining clinical note text outside the cloud enclave
  - Azure, hosting the dockerized container applications supporting CHoRUS services
  - Bridge2AI AI/ML for Clinical Care Collaborative Cloud, the analysis environment for trainees
  - OMOP Common Data Model and the OHDSI tool stack
  - PhysioNet WFDB schema, extended for CHoRUS waveform telemetry
  - DICOM
  - EDF+ and Persyst schemas for EEG
  - OHNLP open source schema for tokenized clinical notes
  restrictions:
  - Controlled access applies to every data type in the dataset
  - Clinical note text is not held in the enclave and is available only locally at contributing sites
  source_caveats: The declared bundle does not state whether archival copies of these external resources
    exist or what guarantees apply to their continued availability, so `archival` and `future_guarantees`
    are not recorded.
  used_software:
  - id: software_ohdsi_tool_stack
    name: OHDSI tool stack
    description: Tool stack for working with the OHDSI/OMOP common data model; trainees receive workshops
      on its use and helpdesk support for it.
  - id: software_persyst
    name: Persyst
    description: EEG software whose format, alongside EDF+, is used for CHoRUS waveform EEG.
