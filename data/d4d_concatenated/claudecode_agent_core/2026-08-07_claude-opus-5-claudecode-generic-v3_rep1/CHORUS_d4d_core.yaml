instances:
- id: instance_patient_admission
  name: Patient admission
  instance_type: Hospital admission of a critically ill patient
  counts: 50000
  description: chorus4ai.org reports a Current Released Dataset of 50,000 patient admissions from ICU,
    PICU, and NICU, and an Anticipated Final Dataset of 100,000 patient admissions across 14 data contributing
    hospitals and 9 different data modalities. The September 2025 AIM-AHEAD webinar states that as of
    August 2025 the dataset covered 14 different hospitals with over 45,000 unique admissions. The NIH
    RePORTER abstract describes acquiring an AI-ready data set from more than 100,000 critically ill patients.
  source_caveats: The `counts` value is the "Current Released Dataset" figure published by chorus4ai.org
    for the dataset itself. The 45,000+ figure is an earlier August 2025 snapshot and the 100,000 figures
    are anticipated or planned totals; chorus4ai.org gives no capture date, so the two released-dataset
    figures cannot be ordered by recency with certainty.
- id: instance_ehr_omop_row
  name: EHR OMOP data row
  instance_type: Row of electronic health record data standardized to the OMOP Common Data Model
  counts: 1600000000
  description: chorus4ai.org reports 1.6 billion rows of EHR OMOP data in the Current Released Dataset.
- id: instance_radiology_imaging
  name: Radiology imaging
  instance_type: Radiology imaging study extracted from hospital PACS
  description: chorus4ai.org reports 7,642 admissions with Radiology Data in the Current Released Dataset.
    The September 2025 AIM-AHEAD webinar states that, for imaging, currently 1,000 images are available
    with de-identification in process for a larger cohort.
  source_caveats: No `counts` value is recorded because the two imaging figures in the bundle measure
    different things (admissions with radiology data versus available images) and neither is a count of
    imaging instances in the released dataset.
- id: instance_waveform_recording
  name: Waveform recording
  instance_type: Physiological waveform recording (bedside telemetry and EEG)
  description: chorus4ai.org reports 23 Tb of waveform data in the Current Released Dataset. Waveform
    telemetry is acquired from bedside monitors and gateway/middleware and represented in WFDB; waveform
    EEG is acquired from hospital databases and represented in EDF+ and Persyst. The September 2025 AIM-AHEAD
    webinar states that EEG extraction was in process at that point.
- id: instance_clinical_note
  name: Clinical note
  instance_type: Tokenized clinical note
  description: Clinical notes are extracted and tokenized using the OHNLP toolkit. The September 2025
    AIM-AHEAD webinar states that clinical notes are stored locally, with only tokens held in the cloud
    enclave.
known_limitations:
- id: limitation_imaging_coverage
  name: Imaging coverage limited pending de-identification
  limitation_type: coverage_limitation
  limitation_description: 'As reported in September 2025, imaging coverage was limited: currently 1,000
    images available, with de-identification in process for a larger cohort.'
  scope_impact: Imaging-based analyses are constrained relative to the 7,642 admissions with radiology
    data reported for the Current Released Dataset.
- id: limitation_eeg_extraction_in_process
  name: EEG waveform extraction incomplete
  limitation_type: coverage_limitation
  limitation_description: As reported in September 2025, EEG extraction was in process at that point.
- id: limitation_clinical_notes_local_storage
  name: Clinical notes held locally, only tokens in the enclave
  limitation_type: integration_limitation
  limitation_description: OMOP and telemetry data are held in the cloud enclave, with the exception of
    clinical notes, which are stored locally at contributing sites; only tokens are held in the enclave.
  scope_impact: Analyses requiring full clinical note text cannot be performed on the enclave copy of
    the dataset.
- id: limitation_release_incomplete_against_target
  name: Released dataset smaller than the anticipated final dataset
  limitation_type: scope_limitation
  limitation_description: chorus4ai.org reports a Current Released Dataset of 50,000 patient admissions
    against an Anticipated Final Dataset of 100,000 patient admissions, 9 data modalities, and 14 data
    contributing hospitals.
- id: limitation_metadata_schema_planned
  name: Published metadata not yet available for all modalities
  limitation_type: coverage_limitation
  limitation_description: The September 2025 AIM-AHEAD webinar's data-type table records the metadata
    status for several modalities as "Planned" rather than available.
  source_caveats: The extracted table interleaves columns, so which specific modalities carry the "Planned"
    status cannot be reliably determined; only the presence of planned-but-not-yet -available metadata
    is recorded here.
- id: limitation_site_scope
  name: Data acquisition limited to 14 of 20 collaborating centers
  limitation_type: coverage_limitation
  limitation_description: The collaboration spans 20 academic centers, of which 14 will contribute as
    Data Acquisition centers, so the dataset reflects the case mix and practice patterns of those 14 contributing
    hospitals.
confidential_elements:
- id: confidentiality_patient_clinical_data
  name: Patient clinical data under controlled access
  confidential_elements_present: true
  confidentiality_details: Every data type listed for the dataset (demographics, medication administration,
    procedures, nursing flowsheets, diagnoses, clinical notes, imaging, waveform telemetry, and waveform
    EEG) is recorded with an access control status of "Controlled". The dataset is derived from hospital
    electronic health records, PACS imaging archives, bedside monitors, and hospital EEG databases; the
    project transforms data using approaches that limit re-identification, tokenizes unstructured EHR
    content, and stores clinical notes locally with only tokens held in the enclave.
subpopulations:
- id: subpopulation_icu_picu_nicu
  name: Intensive care unit populations
  subpopulation_elements_present: true
  identification: Patient admissions are identified by care setting as ICU, PICU, and NICU admissions.
    Demographics are captured as an OMOP-standardized data type, and the project states that data elements
    feature appropriate contextual factors such as geographic distance to the nearest hospital, alongside
    social determinants of health.
  description: chorus4ai.org describes the Current Released Dataset as 50,000 patient admissions from
    ICU, PICU, and NICU.
  source_caveats: The declared bundle does not report the distribution of admissions across these care
    settings or across demographic groups.
sensitive_elements:
- id: sensitive_elements_clinical_and_sdoh
  name: Sensitive clinical, demographic, and social determinants data
  sensitive_elements_present: true
  sensitivity_details: The dataset includes demographics, diagnoses, procedures, medication administration,
    nursing flowsheets, clinical notes, radiology imaging, and physiological waveforms, all derived from
    the clinical care of critically ill patients. The project states that data elements feature appropriate
    contextual factors such as geographic distance to the nearest hospital, and that social determinants
    of health are among the data types acquired and are accounted for in managing privacy and bias.
acquisition_methods:
- id: acquisition_retrospective_extraction
  name: Retrospective extraction from hospital source systems
  was_directly_observed: true
  was_validated_verified: true
  acquisition_details: Data are acquired by retrospective data collection from hospital source systems
    rather than by prospective study procedures. Procedures and diagnoses are documentation by providers,
    nursing flowsheets are high-frequency documentation, medication administration dosing is time-stamped
    upon each infusion change or dose administration, imaging is drawn from PACS, waveform telemetry is
    drawn from bedside monitors and gateway/middleware, and waveform EEG is drawn from hospital databases.
    The project develops capabilities across a multi-center network to acquire, standardize, tokenize,
    store, visualize, and label data. Validated semantic mappings connect clinical data in various source
    formats to international standards, and a clinical validation SOP governs contributions to the mapping
    effort.
collection_mechanisms:
- id: mechanism_site_extract_and_upload
  name: Site data extraction, curation, and upload under CHoRUS SOPs
  mechanism_details: Data contributing sites extract and submit a CHoRUS-specific clinical data extract
    following standard operating protocols that instruct sites about best practices for curating and delivering
    interoperable datasets. The Chorus_SOP page provides an interactive workflow diagram describing the
    step-by-step process for extracting and contributing clinical data to CHoRUS, with dynamic links to
    SOP documents that have undergone an internal validation and review process. Sites report progress
    through GitHub or a Google Form, and characterization reports are returned to sites following their
    data submissions. CHoRUS services supporting these workflows are deployed as dockerized container
    applications on Azure.
  used_software:
  - id: software_chorus_extract_upload
    name: chorus-extract-upload
    license: MIT
    description: Repository with tools to create and upload a CHoRUS Data Extract (Python).
  - id: software_chorus_sop
    name: Chorus_SOP
    license: Apache-2.0
    description: CHoRUS centralized SOP documentation site (MDX).
  - id: software_data_acq_sop
    name: data_acq_SOP
    description: An online documentation SOP for Data Acquisition Module (JavaScript).
  - id: software_chorus_container_apps
    name: chorus-container-apps
    description: Set of dockerized container applications and associated configurations to be deployed
      to support CHoRUS services on Azure (JavaScript).
  - id: software_chorus_reports
    name: CHoRUSReports
    description: Repository dedicated to producing characterization reports to return to sites following
      their data submissions (R).
- id: mechanism_federated_access
  name: Federated access across the acquisition network
  mechanism_details: Federated access will enable sampling methods to ensure a balanced and diverse cohort
    across the CHoRUS network.
sampling_strategies:
- id: sampling_balanced_diverse_cohort
  name: Sampling for a balanced and diverse cohort
  is_sample: true
  source_data: Electronic health records, PACS imaging archives, bedside monitors and gateway/middleware,
    and hospital EEG databases at the 14 hospitals contributing as Data Acquisition centers within a 20-center
    academic collaboration.
  strategies: The project establishes a legal framework for collecting data at scale, sampling to ensure
    comprehensive sets of patient conditions and clinical treatment strategies. Federated access will
    enable sampling methods to ensure a balanced and diverse cohort. The stated aim is the most diverse,
    high-resolution, ethically sourced, AI-ready data set for improving recovery from acute illness.
  source_caveats: The declared bundle states the sampling intent and its target properties but does not
    report a sampling frame, a selection probability, or an assessment of how representative the assembled
    cohort is of the critically ill population, so `is_random` and `is_representative` are not recorded.
data_collectors:
- id: collector_data_site_managers
  name: Data site managers at contributing sites
  role: Data extraction and submission
  collector_details: Data managers at data contributing sites follow the Chorus_SOP workflow to extract
    and contribute clinical data to CHoRUS, and post issues encountered during extract creation or submission
    to the Standards or Data Acquisition discussion locations. Sites provide regular status updates on
    their progress in creating and curating a CHoRUS-specific clinical data extract.
- id: collector_clinical_collaborators
  name: Clinical collaborators
  role: Semantic mapping and clinical validation
  collector_details: Clinical expertise is described as invaluable to semantic mapping and validation
    within CHoRUS. A chorus-mapping repository holds documentation and pooled tabular mappings along with
    an associated clinical validation SOP for contributing to mapping efforts.
- id: collector_software_developers
  name: Software contributors
  role: Tool development
  collector_details: Software contributors within CHoRUS have a broad range of expertise and have produced
    open-source tooling for transforming and interacting with clinical data. A web guide for contributors
    and users of the CHoRUS software packages compiles documentation in the chorus-developer repository,
    and a package status page reports versions, maintainers, and other metadata about CHoRUS packages.
collection_timeframes:
- id: timeframe_retrospective_collection
  name: Retrospective collection timeframe
  timeframe_details: Data collection is retrospective. The September 2025 AIM-AHEAD webinar reports that,
    as of August 2025, the dataset covered 14 different hospitals with over 45,000 unique admissions.
  source_caveats: 'No start or end date is recorded: the declared bundle does not state the calendar range
    of the clinical encounters represented in the dataset. The NIH award period (2022-09-01 to 2026-11-30)
    is the funding period for the data generation project and is recorded with the grant; it is not evidence
    of the timeframe over which the underlying clinical data were created.'
