id: https://chorus4ai.org/
name: CHoRUS Dataset
title: Bridge2AI for Clinical Care Dataset (CHoRUS Dataset)
description: The CHoRUS dataset is a multicenter, multimodal, high-resolution critical care dataset assembled
  by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  data generation project, one of four data generation projects in the NIH Common Fund's Bridge2AI consortium.
  The dataset is assembled by retrospective collection from hospital source systems and is released under
  controlled access. Its stated goal is a publicly available, AI-ready critical care dataset supporting
  characterization of acute and critical care illness, prediction of complications, and measurement of
  treatment response among patients with acute or critical illness, together with a sequestered holdout
  test set for external validation of models. The CHoRUS Network describes its aim as the most diverse,
  high-resolution, ethically sourced, AI-ready data set to answer the grand challenge of improving recovery
  from acute illness. The collaboration spans 20 academic centers, of which 14 contribute as data acquisition
  centers, with 60+ consortium members. Unified standards harmonize multi-modal EHR, waveform, imaging,
  and text data; structured clinical data is standardized to the OMOP Common Data Model. The sources refer
  to the dataset both as the "CHoRUS Dataset" and as the "Bridge2AI for Clinical Care Dataset".
page: https://chorus4ai.org/
