id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship dataset produced by the AI-READI project (the acronym is
  expanded inconsistently across the declared bundle: "Artificial Intelligence Ready and
  Equitable Atlas for Diabetes Insights" in the BMJ Open protocol and the Nature Metabolism
  comment, and "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights" in
  NIH RePORTER, the FAIRhub README, healthsheet, and study description). AI-READI is one of
  four Data Generation Projects funded by the NIH Common Fund Bridge2AI program. The dataset
  contains multimodal data from 2,280 participants with and without type 2 diabetes mellitus
  (T2DM), collected between 19 July 2023 and 01 May 2025 and harmonised across three data
  collection sites (University of Alabama at Birmingham, University of California San Diego,
  and University of Washington). Modalities include survey/clinical data mapped to the OMOP
  Common Data Model, blood and urine laboratory results, 12-lead electrocardiography, retinal
  photography, optical coherence tomography (OCT), OCT angiography (OCTA), fluorescence
  lifetime imaging ophthalmoscopy (FLIO), continuous glucose monitoring, wearable activity
  monitoring, and indoor environmental sensor measurements. The composition was designed with
  downstream AI/ML studies in mind, using recruitment sampling procedures aimed at an
  approximately equal distribution of participants across sex, race/ethnicity, and diabetes
  severity, with the scientific goal of better understanding salutogenesis (the pathway from
  disease to health) in T2DM. The public release contains no protected health information;
  information on sex, race/ethnicity, and medications used has been removed and is held under
  controlled access. The release comprises 356,343 files totalling approximately 3.82 TB.
