purposes:
  - name: Create a flagship ethically sourced voice dataset linked to health information
    description: >-
      Bridge2AI-Voice is a Precision Public Health grand challenge project whose stated purpose is
      to create a flagship, standardized, and ethically sourced dataset of voices linked to health
      information to fuel research and discovery in voice biomarkers. Target enrollment is reported
      inconsistently across the input bundle: the project documentation and study metadata
      healthsheet state a goal of 10,000 voices (anticipated enrollment by 2027), while the 2024
      JAMA Otolaryngology-Head & Neck Surgery viewpoint states a primary deliverable of a publicly
      available database of 30,000 human voices. The IRB protocol is itself internally inconsistent
      on scale: one passage states a target of 30,000 participants overall with up to 5,000 enrolled
      at the University of South Florida, while another states that complete multi-modal data
      acquisition will be performed for up to 5,000 participants per category.
  - name: Enable development, benchmarking, and validation of clinical voice AI models
    description: >-
      The dataset aims to enable the development, benchmarking, or validation of clinically
      applicable machine-learning models for diagnosing a wide range of health conditions using
      voice data, including vocal pathologies and neurological, psychiatric, respiratory, and
      pediatric voice disorders.
  - name: Integrate voice as a biomarker of health into clinical care
    description: >-
      The consortium aims to promote integration of voice as a biomarker of health in clinical care
      by generating a large multi-institutional, ethically sourced, and diverse voice database
      linked to multimodal health biomarkers, and by building predictive models to assist in
      screening, diagnosis, and treatment of a broad range of diseases.
  - name: Establish standards and infrastructure for audiomics
    description: >-
      Stated aims include introducing the field of acoustic biomarkers by developing new standards
      of acoustic and voice data collection and analysis; creating bioinformatics standards for
      voice data interoperability; developing software and cloud infrastructure for automated voice
      data collection; implementing federated learning to allow analysis of multi-institutional data
      while minimizing data sharing; developing ethical guidance and consent norms for voice data;
      and formulating training pathways and curricula for scientists, engineers, bioethicists, and
      clinicians in audiomics.

addressing_gaps:
  - name: Absence of large, diverse, well-documented voice datasets for clinical machine learning
    description: >-
      Previous studies on machine learning-based voice diagnosis produced promising results, but
      their sample sizes were too small or they lacked the key metadata needed for training robust,
      clinically useful models. In laryngeal cancer screening and diagnosis, most reported training
      datasets contained fewer than 300 patients and only two studies used more than one data
      modality.
  - name: Lack of standards for voice and acoustic data collection
    description: >-
      Comparing studies and pooling data is challenging due to the lack of existing standards in how
      voice and other acoustics are measured and collected, precluding meta-analysis and limiting
      external validity. The project addresses this by developing evidence-based recording
      protocols, clinical validation procedures, and new bioinformatics standards.
  - name: Private industry datasets that cannot be audited or clinically annotated
    description: >-
      Industry holds vast amounts of voice data from users but lacks accurate clinical or
      demographic information. This deficiency limits the ability to annotate data for AI training,
      to compare algorithmic outputs with criterion standard medical assessment, and to externally
      audit training datasets for fair representation of diverse populations.
  - name: Absence of multimodal linkage between voice and other health biomarkers
    description: >-
      Existing work has largely used voice as the only data type. The project links acoustic data to
      demographics, clinical validation, validated questionnaires, and, in the broader protocol,
      imaging, genomics, and respiratory function tests, so that audiomics can be integrated into
      multi-omics efforts.
  - name: Underrepresentation and ethical risk in voice AI
    description: >-
      The project addresses benchmarks of diversity metrics, minimization of algorithmic bias risk,
      and the ethical, legal, and social challenges surrounding voice AI, including risks of voice
      re-identification, voice AI hacking, voice data sharing and privacy, and the influence of
      gender and racial diversity on these technologies.

tasks:
  - name: Disease detection and classification from voice
    description: >-
      The dataset comes with predefined tasks primarily designed for training machine-learning
      models for disease detection and classification using voice data. Labels include diagnostic
      categories such as vocal pathologies, neurological disorders, psychiatric conditions, and
      respiratory disorders.
  - name: Screening, diagnosis, and monitoring using voice biomarkers
    description: >-
      Supporting the use of voice as a non-invasive, cost-effective biomarker for screening,
      diagnosis, and monitoring of a wide range of health conditions, including named use cases such
      as voice screening for detection and monitoring of laryngeal cancer in at-risk populations and
      remote voice monitoring in spasmodic dysphonia to assess botulinum toxin response.
  - name: Model pretraining, fine-tuning, benchmarking, and external validation
    description: >-
      The dataset can be used for AI model pretraining, fine-tuning, benchmarking, or validation,
      addressing the documented lack of prospective study and validation of AI algorithms in
      audiomics on external datasets.

other_tasks:
  - name: Cohort selection and phenotypic analysis
    description: >-
      The questionnaire features are collected and distributed in the phenotype folder format and
      can be used for cohort selection.
  - name: No predefined data splits
    description: >-
      The current version of the dataset does not provide recommended data splits for training,
      validation, or testing. Researchers are encouraged to create their own data splits based on
      their specific requirements. Users are advised that the dataset has skews based on disorder
      category, site, and other demographic factors, and should consider the multivariate
      distribution when constructing splits.

acquisition_methods:
  - name: Direct observation and self-report during a supervised session
    description: >-
      Data associated with each instance was directly observable and reported by subjects.
      Participants performed acoustic tasks that were recorded, and completed self-reported
      demographic, confounder, medical history, and validated questionnaire instruments. The
      healthsheet states that data was collected from the individuals in question directly, rather
      than obtained via third parties.
  - name: Clinician verification against gold standards
    description: >-
      Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data, looking at
      electronic health records, or reviewing medication prescriptions. Gold standard validation
      methods are cohort-specific and include laryngoscopy images and stroboscopy videos for voice
      disorders; spirometry and flow-volume loops and CT of neck or chest for airway stenosis and
      chronic cough; CT brain, MRI brain, serum p-tau biomarkers, and whole genome sequencing for
      neurological and neurodegenerative disorders; and electronic health summary, psychiatrist
      diagnosis, and medication history for mood and psychiatric disorders. Consenting participants
      permit investigators to access medical information through EHR platforms for this validation.
  - name: Derivation of released features from raw audio
    description: >-
      The publicly released data elements are not the acquired signals themselves but derivations
      computed from the acquired raw audio waveforms using open-source toolkits.

collection_mechanisms:
  - name: Bridge2AI-Voice iPad application
    description: >-
      A custom smartphone/tablet application developed by the consortium hosts the data acquisition
      protocols and collects standardized recordings of acoustic tasks, validated patient
      questionnaires, and validated patient-reported outcomes. The healthsheet states the data were
      collected using an iPad app.
  - name: Tablet hardware and microphone configuration
    description: >-
      Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an
      Avid AE-36 microphone connected through an Apple dongle. Participants were instructed to wear
      a head-mounted headset with microphone for voice recording tasks, as per the Bridge2AI-Voice
      suggested standards; recording distance could vary slightly. Distinct iPad devices were used
      at each site.
  - name: Bridge2AI Voice Web app and iOS app for remote collection
    description: >-
      Per the IRB protocol, remote collection occurs through two platforms, the Bridge2AI Voice Web
      app and the Bridge2AI Voice iOS app. The iOS app is restricted to iOS-compatible devices while
      the Web app runs on a computer, tablet, or phone. No software is downloaded or installed, no
      login is required, the apps are HIPAA-compliant and store data only during the collection
      phase, and data are transmitted over a secure HTTPS protocol to HIPAA-compliant storage hosted
      by an NIH STRIDES partner.
  - name: ReproSchema-UI
    description: >-
      For the pediatric protocol, all data is collected using reproschema-ui with the Bridge2AI-Voice
      pediatric protocol; pediatric data is then extracted, transformed into REDCap format, and
      converted to BIDS.
  - name: REDCap
    description: >-
      Questionnaire, enrollment, eligibility, diagnosis, and clinical validation instruments are
      defined in and exported from REDCap. Full data acquisition protocols are stated to be
      available in the REDCap Instrument Shared Library and are downloadable from the
      eipm/bridge2ai-redcap GitHub repository. Consent, when captured electronically, is housed in
      REDCap and is HIPAA compliant.

collection_timeframes:
  - name: Adult dataset collection window
    description: >-
      The healthsheet states that the data was collected over a period of 12 months. The underlying
      NIH project period runs from 2022-09-01 to 2026-11-30, and the IRB protocol describes a
      prospective cohort study conducted over four years in phased waves (exploratory, pilot,
      expansion, outreach), with phase 1 preliminary collection completed in November 2023 and phase
      2 pilot collection begun in November 2023 and ongoing in November 2024. Successive dataset
      versions reported additional participants: v1.0 is described as containing 306 participants,
      v2.0 as providing data for an additional 136 new participants, and v3.0.0 as adding data for
      an additional 391 participants, reaching 833.
  - name: Mobile application feasibility study window
    description: >-
      A separate pilot feasibility study of the Bridge2AI-Voice application, which contributed no
      audio data to this dataset, was conducted at the University of South Florida Health Voice
      Center between June 5, 2023 and July 28, 2023.

data_collectors:
  - name: Site research teams
    description: >-
      Research teams, which may include medical, graduate, or undergraduate students, coordinated
      with clinicians and doctors to identify appropriate participants and administered the
      collection session. Data is collected in the clinic with the assistance of a trained research
      assistant.
  - name: Clinicians and physicians
    description: >-
      Clinicians and doctors were listed under the IRB as co-investigators and were added to the
      consortium so that their names are included on consortium-level publications emerging from the
      research. They performed or supplied the gold standard clinical validation of diagnoses.
  - name: Hospital staff
    description: >-
      Hospital staff were not involved in scheduling but assisted in the logistics of coordinating
      data collection.

sampling_strategies:
  - name: Non-probability cohort sampling from high-volume expert clinics
    description: >-
      The study metadata records the sampling method as a non-probability sample with an
      observational cohort, cross-sectional design. Participants are recruited across different
      academic institutions from high-volume expert clinics based on diagnosis and
      inclusion/exclusion criteria. High-volume expert clinics are defined as outpatient clinics
      within hospital systems or academic institutions with expertise in a specific disease area
      that see more than 50 patients per month from the same disease category; the IRB protocol
      defines them as multidisciplinary programs with a volume of over 1,000 patients per year.
      Community outreach clinics serving underserved and underrepresented populations are also used
      to broaden recruitment.
  - name: Cohort inclusion and exclusion criteria
    description: >-
      Eligibility for the adult dataset requires age 18 years or older (maximum 120 years), ability
      to read and speak English, and consent to provide a voice sample for an open-sourced database.
      Exclusion criteria include not speaking English, having had a surgical intervention
      significantly altering the symptoms of the disease studied, and declining consent. Healthy
      volunteers are accepted as controls. Detailed diagnosis-specific criteria are defined per
      condition, for example requiring biopsy-proven active laryngeal cancer T1-T4, or bothersome
      cough longer than 8 weeks for unexplained chronic cough with an extensive exclusion list.
      Neurological cohorts require age over 44 and under 85.
  - name: Sample of a larger ongoing collection
    description: >-
      The healthsheet states the dataset is a sample of a larger, ongoing collection and that the
      data is not representative because it was collected at a limited number of geographic
      locations. The curators state a plan to make it more representative by shifting to remote
      collection and designing the recruiting approach in a way that controls for more variables.

instances:
  - name: Participant
    description: >-
      Each instance represents a person. The healthsheet for the release states that there are
      currently around 833 instances and that the dataset represents 833 patients/subjects. Each
      participant contributes one or more recording sessions; for most participants a single session
      was sufficient, but a subset required multiple sessions, so there may be more than one session
      per participant.
  - name: Recording
    description: >-
      Derived feature rows are indexed at the level of a single audio recording, keyed by
      participant_id, session_id, and task_name. In version 3.1.0 the per-feature record counts are
      29,278 spectrograms, 29,278 Mel spectrograms, 29,278 MFCC records, 32,522 torchaudio pitch
      records, 28,640 SPARC EMA records, 31,855 SPARC loudness records, 31,872 SPARC periodicity
      records, 31,872 SPARC pitch records, and 29,289 phonetic posteriorgram records. Counts differ
      across feature types because some files could not generate certain features and because
      features derived from free-speech recordings and audio checks were withheld. Note a
      cross-source discrepancy: the project documentation describes version 3.0 as containing
      approximately 61,937 voice-derived recordings from 833 adult participants, whereas the
      PhysioNet release pages for versions 3.0.0 and 3.1.0 report the per-feature record counts
      given above.
  - name: Data modality per instance
    description: >-
      Each participant instance consists of audio recordings and questionnaire responses. The
      released representation consists of derived acoustic features rather than raw audio, together
      with tabular questionnaire and clinical data.
  - name: Relationships between instances
    description: >-
      Relationships between individual instances are not made explicit; the healthsheet states that
      instances are unrelated, with no clinical trial arm structure or linkage between distinct
      participants. Within a participant, records are linked hierarchically by participant_id,
      session_id, and task_name. A participant may have more than one session, and there is no
      requirement that a participant provide the same response for each visit, so participant-level
      information for the same data element may vary across rows of a phenotype file.

subpopulations:
  - name: Disease cohort category
    description: >-
      Participants are grouped into five disease cohort categories: voice disorders (laryngeal
      cancer, laryngitis, precancerous lesions, benign vocal fold lesions, muscle tension dysphonia,
      laryngeal dystonia, unilateral vocal fold paralysis, glottic insufficiency/presbyphonia);
      respiratory disorders (airway stenosis, unexplained chronic cough, COPD and asthma);
      neurological and neurodegenerative disorders (mild cognitive impairment, Alzheimer's disease
      and other dementias, amyotrophic lateral sclerosis, Parkinson's disease and atypical
      parkinsonism); mood and psychiatric disorders (anxiety, bipolar disorder, depression as
      primary inclusion diagnoses, with recorded comorbidities including ADHD, PTSD, schizophrenia,
      OCD, eating disorders, and substance use disorder); and controls. The public data releases do
      not contain an equal distribution of these categories, and the initial release contained data
      from four of the five categories.
  - name: Age
    description: >-
      Age is collected and identified as a demographic sub-population dimension. Adult eligibility
      is 18 to 120 years; neurological cohorts are restricted to ages 44 to 85. The companion
      pediatric dataset covers ages 2 to 18 and is released separately.
  - name: Sex and gender
    description: >-
      Sex and gender are collected as separate demographic sub-population dimensions. The study
      metadata records eligibility sex as "All" and gender-based eligibility as "No".
  - name: Race and ethnicity
    description: >-
      Race and ethnicity are collected and identified as demographic sub-population dimensions. The
      dataset includes race information, which the curators classify as sensitive.
  - name: Socioeconomic status
    description: >-
      Socioeconomic status is identified as a demographic sub-population dimension and the dataset
      includes socioeconomic information, classified as sensitive. Non-identifying but highly
      sensitive elements such as household income were removed from the release.
  - name: Language
    description: >-
      Only fluent English speakers are included in the released versions. Spanish protocols and data
      collection are under development and stated to be included in future releases.

anomalies:
  - name: Heterogeneous collection configurations across sites
    description: >-
      Different sites have different collection configurations, and distinct iPad devices were used
      at each site. Because participants were screened for different disorders based on site,
      diagnostic label and recording device are confounded.
  - name: Protocol drift over the study
    description: >-
      The collection protocol changed over the course of the study. The application underwent
      continuous alpha and beta testing, and tasks may have been altered, added, or removed based on
      patient feedback, auditing, and validation experiments.
  - name: Recording noise and variable microphone distance
    description: >-
      Noise artifacts are identified as a confounding factor. The data were recorded with a
      head-mounted headset with a microphone that could be at slightly different distances; some
      recordings in the pediatric protocol used the built-in tablet microphone instead of a headset.
  - name: Variability in diagnostic practice
    description: >-
      Variations in diagnostic practices are identified as a confounding factor, and changes in
      diagnostic criteria or practices over time could be a source of distribution shift. Depending
      on the disorder, clinical diagnosis was performed by one clinician or based on an EHR record
      or prescription.
  - name: Self-report inaccuracy and underreporting
    description: >-
      Inaccurate questionnaire responses and underreporting are identified as confounding factors in
      the data.
  - name: Unaudited machine-generated transcription
    description: >-
      Certain aspects of the data, for example transcription, were generated using off-the-shelf
      models that have not been audited for correctness.
  - name: Missing derived features for some recordings
    description: >-
      Some files, whether due to length or other issues, could not generate certain features and so
      are not included in the bundled data, producing unequal record counts across feature types.
  - name: Broken parquet files in the prior release
    description: >-
      Version 3.1.0 release notes state that broken parquet files from the previous release (3.0.0)
      were fixed.
  - name: Data quality criterion not met in AI-readiness self-assessment
    description: >-
      In the project's AI-readiness rating against the Bridge2AI recommendations, the
      Characterization criterion 2.e (Data Quality) is scored 0 (criterion not met), giving that
      category 80 percent. Sustainability criteria 5.b (Domain-appropriate) and 5.d (Associated) and
      Computability criterion 6.d (Contextualized) are also scored 0.

missing_data_documentation:
  - name: Missingness audit and table
    description: >-
      The dataset has been audited internally for missingness and consistency by the data release
      team, and a missingness table is included with the dataset. Generating missingness tables is
      the first step of the documented audit protocol.
  - name: Sources of missing data
    description: >-
      Information is missing from individual instances because some questions are optional and
      because there may be data collection irregularities. Each individual answered a common set of
      questions and then responded to additional questions relevant to their primary diagnostic
      category, so cohort-specific instruments are systematically absent for participants outside
      that cohort.
  - name: Row-inclusion rule in phenotype files
    description: >-
      Phenotype data files only contain rows for a participant if at least one column is not missing.
  - name: Deliberate withholding of features
    description: >-
      Spectrograms, Mel spectrograms, MFC coefficients, phonetic posteriorgrams, and EMA features
      for sensitive records and audio checks were removed from version 3.1, and features derived
      from free-speech recordings were excluded, so absence of a derived feature for a given
      recording may reflect a governance decision rather than a processing failure.

known_biases:
  - name: Recruitment and trust bias
    description: >-
      Groups that have less trust in the medical system or in AI, or that are less proximal to the
      collection sites, would have been less likely to be recruited.
  - name: Site-device-label confounding
    description: >-
      Participants were screened for different disorders based on site, so they also had their data
      collected with different devices. Diagnostic label, recording site, and recording hardware are
      therefore entangled.
  - name: Geographic and institutional non-representativeness
    description: >-
      The dataset is not representative because it was collected at a limited number of geographic
      locations: five recording sites, with countries of collection recorded as the United States
      and Canada.
  - name: Language and literacy bias
    description: >-
      Only participants who read and speak English were eligible, excluding non-English speakers.
      The related feasibility work notes that because the application was developed by clinicians
      and scientists, the language used in surveys, questionnaires, and audio task instructions
      could reflect a higher reading level than that of the general population.
  - name: Skew across disorder category, site, and demographics
    description: >-
      The curators state that the dataset has skews based on disorder category, site, and other
      demographic factors, and that users should consider the multivariate distribution when
      assessing utility for different questions.
  - name: Distribution shift over time
    description: >-
      Changes in diagnostic criteria or practices over the collection period could be a source of
      distribution shift.

known_limitations:
  - name: Raw audio not included in the public release
    description: >-
      The release contains only data considered low risk, including derivations such as spectrograms
      but not the original voice recordings. All raw voice data was removed from the
      registered/credentialed release because it has the potential to cause individual
      re-identification or to be used for illicit or unauthorized purposes.
  - name: Free-speech-derived dense features withheld
    description: >-
      Spectrograms and similar dense features were excluded if the audio contained free speech;
      static and other features that do not encode the sensitive information were retained. In
      earlier versions, transcripts of free-speech audio were also removed.
  - name: Partial cohort coverage in early releases
    description: >-
      The public data releases do not contain an equal distribution of the five disease categories,
      and the initial release contained data collected from four of the five categories. The adult
      dataset contains only adult populations; pediatric data is distributed separately.
  - name: English-only content
    description: >-
      The released versions contain only fluent English speakers; Spanish protocols were under
      development at the time of documentation.
  - name: Single-labeler diagnostic labels
    description: >-
      One labeler provides a label per instance, typically the clinician at the site of data
      collection or a clinician external to the study for a prior diagnostic assessment. There is no
      redundant labeling and therefore no inter-annotator agreement measure.
  - name: No remote or at-home collection in the initial release
    description: >-
      Future data collection will also occur remotely; however, remote data collection did not occur
      for the initial dataset release, so the data reflect supervised in-clinic conditions rather
      than the intended at-home deployment setting.
  - name: External multimodal data not released
    description: >-
      Imaging, genomic, laryngoscopy imaging, and other EHR data are extracted independently at
      sites and uploaded through REDCap, but no external data is released in the v3.0.0 release.
  - name: Feasibility evidence limited to a single site
    description: >-
      The companion feasibility study of the collection application was conducted at a single site
      with 47 participants and no control arm, and the determination of whether a task was
      successfully completed or recorded was subjective, made at the decision of the research
      assistant. The homogeneity of that sample greatly limits generalizability of its findings
      about the collection instrument.

content_warnings:
  - name: Free speech content is participant-determined
    description: >-
      The dataset includes transcription of free speech tasks. While the inclusion of offensive,
      insulting, threatening, or otherwise safety-relevant content is unlikely, it cannot be
      completely avoided, as research participants are responsible for their choice of language. In
      current releases, raw audio transcripts were reviewed and audio recordings containing
      potentially identifying information or external voices were removed from the release.
  - name: Mental health and trauma-related instrument content
    description: >-
      The protocol administers instruments covering depression, anxiety, PTSD, ADHD, and DSM-5
      screening. The IRB protocol notes that answering some of these questions can lead to possible
      discomfort and could trigger negative emotions for participants. Non-identifying but highly
      sensitive data elements such as mental health status and traumatic life experiences were
      removed from the released dataset.

sensitive_elements:
  - name: Race and ethnic origin
    description: The dataset includes race information, identified by the curators as sensitive.
  - name: Sexual orientation
    description: >-
      The dataset includes sexual orientation information, identified by the curators as sensitive.
  - name: Socioeconomic and health data
    description: >-
      The dataset includes socioeconomic and health information, identified by the curators as
      sensitive. Health information includes clinical diagnoses across voice, respiratory,
      neurological, and psychiatric conditions.
  - name: Voice as a biometric
    description: >-
      Voice is inherently identifying. The IRB protocol states that even when removing all HIPAA
      protected information, each person's voice is unique to them and their health at that time in
      their life, and it is always possible, even if unlikely, that someone could recognize a
      participant's voice; voice can never be fully de-identified. Raw audio is consequently
      withheld from the registered/credentialed release.
  - name: Fields encoded as sensitive in the REDCap dictionary
    description: >-
      All sensitive fields were removed from the dataset, corresponding to data elements encoded as
      sensitive under the "Identifier?" column in the Bridge2AI-Voice REDCap data dictionary.
      Removed categories include select geographic and demographic identifiers, information about
      household composition or cultural identity, household income, mental health status, and
      traumatic life experiences.

confidential_elements:
  - name: Raw voice recordings withheld under controlled access
    description: >-
      The curators answer "No" to the healthsheet question of whether the dataset contains data
      protected by legal privilege, doctor-patient confidentiality, or non-public communications.
      However, the raw audio waveforms are treated as restricted content: they are disseminated
      through controlled access only, to protect participants' privacy, and are not part of the
      registered or credentialed PhysioNet release. Access requires a Data Access Request Form, a
      Data Use Agreement, review by the Data Access Compliance Office, and a Data Transfer and Use
      Agreement executed by an authorized institutional official. A published memorandum, "Ethical
      Justification for Controlled Access to Raw Voice Data Samples," documents the reasoning behind
      this governance structure.
  - name: Site-held identifiable data
    description: >-
      Under the IRB protocol, each institution keeps identifiable data within its own institution.
      Identifiable protected health information is kept in institutional REDCap databases with
      password-protected access restricted to investigators at the collecting institution and is
      never part of the shared or released dataset.

is_deidentified:
  name: De-identification of the Bridge2AI-Voice release
  description: >-
    Level of de-identification: identifiable information under HIPAA and the Common Rule, as well as
    data considered sensitive, have been removed from this dataset. The dataset removes direct
    identifiers (yes), applies the HIPAA de-identification rules (yes), rebases and/or replaces dates
    by integers (yes), removes or generalizes geographic information (yes), and removes narrative
    text fields (yes). The dataset does not achieve K-anonymization with k>=2 (no). Specific steps:
    all direct identifiers were removed, including name, civic address, and social security numbers.
    Indirect identifiers were removed where these created a significant risk of re-identification,
    for example through combination with other public data available on social media, in government
    registries, or elsewhere; these include select geographic or demographic identifiers and some
    information about household composition or cultural identity. Non-identifying elements of data
    that revealed highly sensitive information, such as household income, mental health status, and
    traumatic life experiences, were also removed. HIPAA Safe Harbor identifiers were removed. State
    and province were removed while country of data collection was retained. Raw audio transcripts
    were reviewed, and any audio recordings that contained potentially identifying information or
    external voices were removed from the release. All raw voice data was removed from the released
    dataset. Spectrograms and similar dense features were excluded where the audio contained free
    speech. Residual risk: the IRB protocol acknowledges that a person's voice can never be fully
    de-identified and that recognition by a listener remains possible in principle.

ethical_reviews:
  - name: University of South Florida single IRB
    description: >-
      The clinical study has been reviewed and approved by at least one human subjects protection
      review board. It was submitted to and approved by the USF Single IRB, with subsite IRBs
      approved through the single IRB process. Data collection and sharing for the released dataset
      was approved by the University of South Florida Institutional Review Board. The study is not
      for a drug product and not for a medical device, and no data monitoring committee was
      appointed.
  - name: Canadian research ethics boards
    description: >-
      Canadian institutions (Mount Sinai Hospital, the Hospital for Sick Children, and the University
      of Toronto) do not participate in the US single IRB process and applied for separate research
      ethics board approvals to comply with Canadian regulations; copies of approved protocols are
      submitted to the USF IRB. Genomic data collection is covered by a separate protocol and REB at
      the University of Toronto and Mount Sinai Hospital.
  - name: Hospital for Sick Children REB (pediatric)
    description: >-
      Pediatric data collection and sharing was approved by the Research Ethics Board at the Hospital
      for Sick Children.
  - name: Feasibility study IRB
    description: >-
      The companion application feasibility study was approved by the Institutional Review Board of
      the University of South Florida under IRB number 004890, and was conducted in accordance with
      local legislation and institutional requirements.

informed_consent:
  - name: Prospective informed consent
    description: >-
      All participants have been duly informed and agreed to the collection and use of their data via
      prospective informed consent through an IRB-approved consent process. All participants provided
      written informed consent for all study procedures. Participants are informed that research data
      that does not contain direct identifiers will be shared with external researchers for future
      research through a secure database; that data posing a low risk of individual re-identification
      will be shared in registered access with the general public; and that data that would pose a
      heightened risk of re-identification if shared in full open access will be shared through a
      controlled access mechanism with authorized researchers. Consenting participants also permit
      investigators to access medical information through EHR platforms for gold standard validation
      of diagnoses.
  - name: Notification of participants at enrollment
    description: >-
      The individuals in question were notified about the data collection: participants went through
      an IRB-approved consent process. In the feasibility study, participants were explicitly
      informed about the data being collected, the methods used to secure these data, and the
      information that would be used for the study, and were told the application was created by the
      Bridge2AI-Voice consortium along with its purpose. Potential participants are informed that
      participation is voluntary and does not impact their medical care in any way; approximately 30
      minutes is allotted to explain the study and consent in detail, and potential participants are
      asked to explain what they have understood to confirm comprehension.
  - name: Consent modalities and documentation
    description: >-
      Consent may be given by signing a physical paper copy, by indicating electronic consent within
      the application or through REDCap surveys, or through video recording within the application in
      which the participant reads a statement aloud; the audio recording from the consent is used to
      verify that the acoustic data submitted belongs to the consented individual and to help
      distinguish participants from bots. Electronic consent contains the same text as paper consent
      and is housed in HIPAA-compliant REDCap. Paper consent documents are uploaded and saved
      electronically in REDCap. All paper and electronic versions of consent are stored for a minimum
      of five years after completion of the study, following required USF procedure.
  - name: Re-consent and ongoing consent
    description: >-
      Where a delay occurs between consent and data collection, participants are notified of any
      changes to the study and re-consented before data collection. For longitudinal cohorts, an
      electronic consent is administered before each subsequent data collection session.
  - name: Withdrawal provisions and revocation limits
    description: >-
      Consenting participants are informed that they may withdraw from the study at any point. If a
      participant chooses to withdraw during or before the voice data collection, their data will not
      be included in the database. Participants are informed that research data, including voice
      recordings, cannot be removed from the database once the voice data collection process is
      completed. For longitudinal collection, data already completed will be used; the minimal
      requirement for study completion is one data collection time point. Participants who withdraw
      may optionally complete a satisfaction survey, in which no PHI is collected.
  - name: Absence of use restrictions in the consent
    description: >-
      The consent type does not restrict use to non-commercial purposes, to a specific geographic
      location, to a specific type of research, to genetic research, or to research that does not
      involve the development of methods or algorithms; all five corresponding healthsheet questions
      are answered "No".

data_protection_impacts:
  - name: No formal impact analysis on data subjects
    description: >-
      The healthsheet states that an analysis of the potential impact of the dataset and its use on
      data subjects has not been conducted.
  - name: Ethics-led governance of raw voice data
    description: >-
      In place of a formal impact assessment, the consortium published a memorandum titled "Ethical
      Justification for Controlled Access to Raw Voice Data Samples" explaining the reasoning behind
      the governance structure, and a team of ethicists identified the sensitive fields that were
      removed from the released dataset. The consortium's stated ethics aims include defining ethical
      and legal norms safeguarding patients' data while supporting data-sharing efforts, creating
      benchmarks of diversity metrics, and minimizing risk of algorithmic bias.

at_risk_populations:
  name: Protections for at-risk populations
  description: >-
    The adult dataset is restricted to participants aged 18 years or older (maximum 120 years), so
    minors are excluded from this release. Pediatric participants are enrolled only at pediatric
    participating institutions and not at the coordinating University of South Florida site; a
    completed checklist for research involving children under 21 (HRP-416) is appended to the IRB
    protocol. Where children participate, parents or guardians provide consent and children provide
    verbal assent where appropriate; parental permission is obtained from one or both parents, as the
    research is minimal risk. Where young children cannot reasonably be asked to assent due to
    limitations in understanding related to age and development, typically children under seven years
    of age, they are not asked to do so; assent, when obtained, is documented. Pediatric participants
    were recruited at the Hospital for Sick Children, and in the pediatric protocol, for participants
    without adequate comprehension or familiarity with their own medical history, a parent or
    decision-maker completed the survey during the recording on a separate tablet. The IRB protocol
    states that students, employees, and wards of the state are neither specifically included nor
    excluded, and that a Plan for Enhancing Diverse Perspectives is used to enroll participants from
    socially and economically disadvantaged and underserved populations. Cognitively impaired adults
    are enrolled in the neurological cohort under the general consent process, with a checklist for
    adults unable to consent contemplated in the protocol's consent options.

human_subject_research:
  name: Human subjects research determination and oversight
  description: >-
    The dataset arises from human subjects research. The study is an observational, cohort,
    cross-sectional prospective study titled "Bridge2AI-Voice," organization study ID OT2OD032720,
    with anticipated enrollment of 10,000 by 2027. It was submitted to and approved by the University
    of South Florida single IRB, with subsite IRBs approved through the single IRB process and
    separate research ethics board approvals at Canadian sites. The studies involving humans were
    conducted in accordance with local legislation and institutional requirements, and participants
    provided written informed consent. Biospecimens are recorded as respiratory, voice, and speech
    samples. The Data Transfer and Use Agreement records that the data is covered under a Certificate
    of Confidentiality, which must be asserted against compulsory legal demands such as court orders
    and subpoenas for identifying information or characteristics of a research participant, and
    characterizes the transferred data as personally identifiable information as defined in OMB
    Memorandum M-07-16. The study is not for a drug product or medical device, and no data monitoring
    committee was appointed. Participants were compensated through electronic gift cards: 40 USD for
    a session under 90 minutes and 80 USD for a session over 90 minutes, for no more than three
    sessions and a maximum of 120 USD; compensation is provided to the adult population only, and
    participants in the companion feasibility study received no financial incentive.

preprocessing_strategies:
  - name: Audio standardization
    description: >-
      Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a
      Butterworth anti-aliasing filter applied. All derived features are computed from this
      standardized audio.
  - name: Conversion to BIDS
    description: >-
      The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from
      REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0. Pediatric
      data collected through ReproSchema-UI is extracted, transformed into REDCap format, and
      subsequently converted to BIDS.
  - name: Spectral feature extraction
    description: >-
      Spectrograms were computed using the short-time Fast Fourier Transform with a 25 ms window
      size, 10 ms hop length, and a 400-point FFT, and were further downsampled by a factor of two in
      the time domain after derivation. Mel spectrograms use the same parameters with 60 Mel bins,
      and 60 Mel-frequency cepstral coefficients are derived from these. In version 1.1 the
      spectrograms had been computed with a 512-point FFT; the parameters were changed in later
      versions.
  - name: Time-varying and articulatory feature extraction
    description: >-
      Torchaudio pitch contours are extracted with minimum and maximum pitch of 80 and 500 Hz. Speech
      Articulatory Coding (sparc) is used to generate kinematic traces of vocal tract articulators
      and source features at 50 Hz, comprising 12-dimensional electromagnetic articulography
      estimates (X/Y positions of tongue dorsum, tongue body, tongue tip, lower incisor, upper lip,
      and lower lip), loudness computed from the average absolute amplitude over 20 ms windows,
      periodicity over 20 ms windows, and fundamental frequency over a 50-550 Hz range. Phonetic
      posteriorgrams give probabilities across 40 phoneme categories at 100 Hz.
  - name: Static acoustic and phonetic feature extraction
    description: >-
      Acoustic features were extracted using openSMILE (including eGeMAPS features per audio file),
      and phonetic and prosodic features were computed using Parselmouth and Praat, providing
      measures of fundamental frequency, formants, and voice quality. Speech intelligibility metrics
      were computed for speech tasks. These per-recording values are distributed in a fixed static
      feature table alongside the time-varying formats.
  - name: Transcription
    description: Transcriptions were generated using OpenAI's Whisper Large model.
  - name: Software pipeline
    description: >-
      All processing is performed using the b2aiprep toolkit for organizing and preprocessing the
      dataset and the SenseLab toolkit for processing audio files for research tasks. The version 3.x
      releases were generated with b2aiprep v3.0.0.

cleaning_strategies:
  - name: No data cleaning applied
    description: >-
      The healthsheet states that there was no pre-processing for cleaning the data, for either the
      preliminary or the current version, and that no instances were excluded from the dataset at the
      time of preprocessing.
  - name: Quality control and audit protocol
    description: >-
      A documented audit protocol is applied instead of cleaning: generate missingness tables; check
      distributions and outliers; for categorical responses, check against the schema; for audio
      tasks, run quality control metrics; for waveforms, check the amount of silence and the
      duration; and for speech, check produced speech relative to the intended passage. Version 3.1.0
      additionally publishes an audio_quality_metrics table with one row per recording.
  - name: Governance-driven removal
    description: >-
      Records were removed rather than corrected where they raised privacy risk: audio recordings
      containing potentially identifying information or external voices were removed from the
      release, sensitive fields flagged in the REDCap dictionary were dropped, and dense features
      from open-response prompts and audio checks were withheld.

labeling_strategies:
  - name: Gold standard clinical diagnosis as label
    description: >-
      There is an explicit label associated with each data instance. Diagnostic labels are the result
      of a clinical assessment of the participant. At each site, a local clinician provided the
      diagnosis based on a clinical interview and appropriate work-up. For the psychiatric disorders
      cohort, this assessment was determined by using the participant's EHR record or an active
      prescription, which was done outside of data collection by an appropriately licensed clinician.
      The labeling strategy is described as a gold standard label available in the data, diagnosed by
      a clinician.
  - name: Labeler characteristics and guidance
    description: >-
      A single labeler is used per instance, typically the clinician at the site of data collection
      or a clinician external to the study for a prior diagnostic assessment. Labelers followed the
      Bridge2AI protocols and ICD-10 codes. Cohort-specific gold standard validation methods
      (laryngoscopy, stroboscopy, spirometry, CT, MRI, serum biomarkers, whole genome sequencing, EHR
      summary, psychiatrist diagnosis, medication history) are specified per diagnosis.
  - name: Guidance for downstream label creation
    description: >-
      The curators recommend that the process for any new labels should be described alongside any
      release of a model or publication, and that this process should include the exact variables
      used for the determination.
  - name: Automated derived annotations
    description: >-
      Transcriptions are machine-generated rather than human-labeled and are produced with an
      off-the-shelf model that has not been audited for correctness.

annotation_analyses:
  - name: No inter-annotator agreement available
    description: >-
      Because a single labeler provides one label per instance, no inter-annotator agreement
      statistics are computed or distributed. The curators state that human-level performance in the
      applications the dataset is supposed to address varies widely.
  - name: Audio-level quality assessment
    description: >-
      In place of annotation agreement analysis, quality control metrics are run over audio tasks as
      part of the audit protocol, including amount of silence, duration, and comparison of produced
      speech relative to the intended passage. Version 3.1.0 publishes per-recording audio quality
      metrics.

machine_annotation_tools:
  - name: OpenAI Whisper Large
    description: Used to generate transcriptions of the recorded audio.
  - name: openSMILE
    description: >-
      Speech and Music Interpretation by Large-space Extraction, used to extract acoustic features
      including eGeMAPS features per audio file, capturing temporal dynamics and acoustic
      characteristics.
  - name: Praat and Parselmouth
    description: >-
      Used to compute phonetic and prosodic features, providing measures of fundamental frequency,
      formants, and voice quality.
  - name: torchaudio
    description: Used to compute pitch contours, spectrograms, Mel spectrograms, and MFCCs.
  - name: Speech Articulatory Coding (sparc)
    description: >-
      Used to generate electromagnetic articulography estimates of vocal tract articulators plus
      loudness, periodicity, and pitch measures.
  - name: ppgs
    description: >-
      Used to generate high-fidelity neural phonetic posteriorgrams, a time-varying categorical
      distribution over acoustic units of speech.
  - name: b2aiprep
    description: >-
      Open-source library developed by the team for organizing and preprocessing the dataset,
      converting raw audio waveforms into the released parquet files and merging source data into the
      phenotype files. Available at https://github.com/sensein/b2aiprep.
  - name: SenseLab
    description: >-
      Open-source toolkit used for processing audio files for research tasks. Available at
      https://github.com/sensein/senselab.

raw_data_sources:
  - source_description: >-
      Raw audio waveforms of 22 acoustic tasks (voice, speech, breathing, and cough) recorded
      prospectively from consented participants using the Bridge2AI-Voice application on a tablet
      with a head-mounted headset microphone. The raw audio is retained but is not accessible
      publicly; it is disseminated only through controlled access after review by the Data Access
      Compliance Office, and is made available to approved users via Synapse
      (https://www.synapse.org/Synapse:syn72370534 for the adult cohort). Requests are directed to
      DACO@b2ai-voice.org.
  - source_description: >-
      REDCap-hosted questionnaire, enrollment, eligibility, demographic, confounder, diagnosis, and
      clinical validation instruments completed by participants and clinicians during the collection
      session. The supporting REDCap data dictionary, metadata, and instrument PDFs are published at
      https://github.com/eipm/bridge2ai-redcap and archived on Zenodo.
  - source_description: >-
      ReproSchema-UI questionnaire and recording data for the pediatric protocol, subsequently
      extracted, transformed into REDCap format, and converted to BIDS.
  - source_description: >-
      Other multimodal clinical data extracted independently at each site and uploaded through the
      REDCap database, including imaging, laryngoscopy imaging, and other EHR data, and genomic data
      for the neurological cohort collected under a separate Canadian protocol. No external data of
      this kind is released in the v3.0.0 release.

raw_sources:
  - name: BIDS-organized folder structure
    description: >-
      The project documentation presents the folder structure for the dataset, named b2ai-voice-audio,
      organized under a BIDS v1.9.0 layout, with CHANGES.md, README.md, dataset_description.json, a
      phenotype directory containing confounders, demographics, diagnosis, enrollment, questionnaire,
      and task tables as paired .tsv and .json files, and per-participant directories of the form
      sub-<participant_id>/ses-<participant_id>/audio containing
      sub<participant_id>_ses<participant_id>_task-<task_name>.wav files with accompanying JSON
      sidecars. The documentation does not state explicitly whether this layout describes the
      controlled-access audio package specifically.
  - name: Retained raw data behind the release
    description: >-
      The healthsheet confirms that the raw data, post de-identification, was saved in addition to
      the preprocessed data, and that it is saved but not accessible publicly.

distributions:
  - name: Derived audio features
    description: >-
      Dense binary files in Apache Parquet format plus plain-text tables, held in the features
      subfolder. Parquet files are ppgs.parquet, sparc_ema.parquet, sparc_loudness.parquet,
      sparc_periodicity.parquet, sparc_pitch.parquet, torchaudio_spectrogram.parquet,
      torchaudio_mfcc.parquet, torchaudio_pitch.parquet, and torchaudio_mel_spectrogram.parquet.
      Plain-text tables are static_features.tsv, with one row per audio recording of features derived
      from openSMILE, Praat, Parselmouth, and torchaudio, and audio_quality_metrics.tsv, with quality
      control metrics per recording. Every file is accompanied by a JSON data dictionary sharing the
      same file stem that describes the feature and the processing used to prepare it.
  - name: Phenotype tables
    description: >-
      Tab-delimited tables with paired JSON data dictionaries in the phenotype subfolder, organized
      into subdirectories: confounders; demographics; diagnosis (airway_stenosis,
      amyotrophic_lateral_sclerosis, anxiety, benign_lesions, bipolar_disorder, cognitive_impairment,
      control, copd_and_asthma, depression, glottic_insufficiency, laryngeal_cancer,
      laryngeal_dystonia, laryngitis, muscle_tension_dysphonia, parkinsons_disease,
      precancerous_lesions, unexplained_chronic_cough, unilateral_vocal_fold_paralysis); enrollment
      (eligibility, enrollment_form, participant); questionnaire (adhd_adult, custom_affect_scale,
      dsm5_adult, dyspnea_index, gad7_anxiety, leicester_cough_questionnaire, panas, phq9,
      productive_vocabulary, psychiatric_history, ptsd_adult, vhi10, voice_perception); and task
      (acoustic_task, harvard_sentences, random_item_generation, recording, session, stroop,
      winograd). Data dictionary keys match the column names in the associated data file and provide
      a one-sentence description, the question asked of the participant where applicable, and the
      data type of the response.
  - name: Per-recording metadata
    description: >-
      Introduced in version 3.1.0 in the metadata subfolder. A binary Parquet file with a
      corresponding data dictionary, containing specific information about each recording including
      task instructions and prompts as well as information about the microphone used and its gain.
  - name: Raw audio, controlled access (adult cohort)
    download_url: https://www.synapse.org/Synapse:syn72370534
    description: >-
      The original raw audio waveforms for the adult cohort, distributed only to approved
      controlled-access users through Synapse. Not part of the PhysioNet registered or credentialed
      release. Access requires institutional sign-off and is coordinated through DACO@b2ai-voice.org.

distribution_formats:
  - name: Apache Parquet
    description: >-
      Open-source column-oriented data file format used for the dense time-varying derived features
      (torchaudio_spectrogram, torchaudio_mel_spectrogram, torchaudio_mfcc, torchaudio_pitch,
      sparc_ema, sparc_loudness, sparc_periodicity, sparc_pitch, ppgs) and, from version 3.1.0, for
      per-recording metadata.
  - name: Tab-separated values (TSV)
    description: >-
      Used for phenotype tables (confounders, demographics, diagnosis, enrollment, questionnaire, and
      task subdirectories), for static per-recording features (static_features.tsv), and for audio
      quality metrics (audio_quality_metrics.tsv).
  - name: JSON data dictionaries
    description: >-
      Every TSV and Parquet data file is accompanied by a JSON sidecar with the same file stem
      describing columns, the question asked of the participant where applicable, and data types.
  - name: WAV audio in a BIDS layout
    description: >-
      Raw audio is stored as per-task WAV files with JSON sidecars under a BIDS v1.9.0 directory
      structure, available only through controlled access.
  - name: Access mechanism
    description: >-
      The feature-only dataset is distributed through the PhysioNet data publishing platform under
      registered access (version 1.1) and credentialed access (versions 3.0.0 and 3.1.0), with a
      persistent DOI. Version 1.0 was distributed through the Health Data Nexus platform, which
      provides cloud compute alongside the dataset rather than allowing data downloads. Raw audio is
      distributed through Synapse under controlled access.

distribution_dates:
  - name: Version 1.0
    description: >-
      Published and made available at the end of November 2024 on the Health Data Nexus platform (DOI
      10.57764/qb6h-em84), per the healthsheet. The PhysioNet v1.1 release page, describing v1.0 as
      the initial release, states that it provided 12,523 recordings for 306 participants.
  - name: Version 1.1
    description: >-
      Published 2025-01-17 on PhysioNet (DOI 10.13026/249v-w155). Added Mel-frequency cepstral
      coefficients.
  - name: Version 2.0.0
    description: >-
      Published 2025-04-16. Provided data for an additional 136 new participants; spectrograms were
      reprocessed and all spectrograms and MFCCs from free-speech-related files were removed.
  - name: Version 2.0.1
    description: Published 2025-08-18. Corrections in the authorship list.
  - name: Version 3.0.0
    description: >-
      Published 2025-12-16 (DOI 10.13026/k81f-qr68). Major update adding data for an additional 391
      participants, reaching 833; the single phenotype file was separated into individual files;
      SPARC and phonetic posteriorgram features were added; files were reorganized.
  - name: Version 3.1.0
    description: >-
      Published 2026-05-01 (DOI 10.13026/8xbn-nq66). Minor update with no new participants.
  - name: Pediatric dataset releases
    description: >-
      The companion Bridge2AI-Voice Pediatric Dataset was published as a separate PhysioNet project,
      version 1.0.0 on 2025-12-17 and version 1.1.0 on 2026-05-01 (DOI 10.13026/h995-bt35).

license_and_use_terms:
  name: Bridge2AI Voice Registered Access License and Agreement
  description: >-
    The feature-only dataset is released under the Bridge2AI Voice Registered Access License, with
    use governed by the Bridge2AI Voice Registered Access Agreement. Note a terminology inconsistency
    within the source: PhysioNet labels the file license for version 3.1.0 as the "Bridge2AI Voice
    Registered Access License" while the access policy for that same version states that only
    credentialed users who sign the DUA can access the files; no additional training is required.
    Earlier registered access required registration on PhysioNet, identity confirmation, and
    signature of the Registered Access Agreement. Raw audio requires controlled access: a Data Access
    Request Form, a Data Use Agreement, review by the Data Access Compliance Office, and a Data Use
    and Transfer Agreement signed by an authorized institutional official. The dataset is intended
    solely for commercial and non-commercial research purposes by Authorized Researchers. Duplication
    as reasonably required to carry out the research project is permitted; sale of all or part of the
    data on any media is not permitted. Users agree not to make intellectual property claims on the
    data and not to use intellectual property protection in ways that would prevent or block access
    to, or use of, any element of the data or conclusions drawn directly from it; users obtaining
    rights on downstream discoveries agree to implement licensing policies that will not obstruct
    further research and to respect the Fort Lauderdale Agreement. There are no fees associated with
    these restrictions. Use requires citation of the specified resources. Under the transfer
    agreement, data is provided "AS IS" with no representations or warranties of any kind, express or
    implied, including no warranties of merchantability, fitness for a particular purpose, or
    non-infringement; recipients assume all liability for damages arising from their use, storage,
    disclosure, or disposal of the data, and no indemnification is provided by either party.
    Collaborators at other research organizations, and other research teams at the same organization,
    must apply independently for access and sign their own agreement. The healthsheet states that the
    dataset will be distributed broadly to individuals outside of the entity who created it; during
    the study, data sharing and data use agreements are put in place between participating
    institutions, and federated learning is used so that models can be trained across institutions
    without data leaving each institution.

ip_restrictions:
  name: Intellectual property restrictions
  description: >-
    The data may be protected by copyright and other rights, including other intellectual property
    rights. Nothing in the agreement operates to transfer to the recipient any intellectual property
    rights in or relating to the data. The provider gives no guarantee that the data is free of
    third-party intellectual property rights, database rights, or other related rights. Recipients
    agree not to make intellectual property claims on the data and not to use intellectual property
    protection, database rights, or related rights in a way that could prevent or limit access to, or
    use of, any element of the data or research conclusions derived from it; this restriction is
    stated to ensure that future use of the dataset remains unrestricted, in alignment with the Open
    Science principles upheld by the consortium. Recipients may elect to perform further research
    adding intellectual and resource capital and obtain intellectual property rights on downstream
    discoveries, provided they implement licensing policies that will not obstruct further research.
    The healthsheet states that no IP-based restrictions have been imposed by third parties. Neither
    party may use the other's name, trademarks, or logos in publicity, advertising, or news releases
    without prior written approval.

regulatory_restrictions:
  name: Regulatory and export control status
  description: >-
    No export controls apply to the dataset. Applicable regulatory frameworks include HIPAA, whose
    de-identification rules are applied and whose Safe Harbor identifiers were removed; the Common
    Rule, under which identifiable information was removed; and a Certificate of Confidentiality
    covering the data, which must be asserted against compulsory legal demands such as court orders
    and subpoenas for identifying information or characteristics of a research participant. The
    transfer agreement notes that where a recipient believes it is required by law or legal process to
    use or disclose the data, it will promptly notify the provider to the extent allowed by law prior
    to such use or disclosure and will disclose the least possible amount of data necessary.
    Recipients must comply with all applicable laws, rules, regulations, and professional standards
    and must have completed any required IRB review or approval prior to use, and must report
    unauthorized use or disclosure no later than five business days after discovery. Canadian
    collection sites operate under separate research ethics board approvals to comply with Canadian
    regulations. The transfer agreement further requires the recipient's authorized representative to
    warrant that the recipient does not use coercion for labor or services as defined in Florida
    Statutes 787.06, and permits the provider to unilaterally amend the agreement should the federal
    sponsor require revision.

intended_uses:
  - name: Clinical machine-learning research on voice biomarkers
    description: >-
      The dataset is primarily intended for research applications, specifically the development of AI
      and machine-learning models for healthcare, supporting clinical research in disease screening,
      diagnosis, and monitoring through voice biomarkers.
  - name: Model pretraining, fine-tuning, benchmarking, and validation
    description: >-
      The dataset can be used for AI model pretraining, fine-tuning, benchmarking, or validation of
      clinically applicable models across vocal pathologies and neurological, psychiatric,
      respiratory, and pediatric voice disorders.
  - name: Cohort selection and phenotypic analysis
    description: >-
      The questionnaire features are collected and distributed in the phenotype folder format and can
      be used for cohort selection.
  - name: Commercial and non-commercial research by authorized researchers
    description: >-
      The Registered Access Agreement permits both commercial and non-commercial research purposes by
      Authorized Researchers, subject to the prohibitions on re-identification, harm, and
      access-blocking IP claims.

discouraged_uses:
  - name: Non-research and non-clinical applications
    description: >-
      The dataset should not be used for non-research or non-clinical applications such as hiring
      decisions, insurance premium adjustments, or any form of surveillance that could lead to
      discrimination or harm. These limitations are intended to prevent unethical or biased outcomes
      that could negatively impact individuals based on their health conditions or voice
      characteristics.
  - name: Use without accounting for dataset skew
    description: >-
      Because the dataset has skews based on disorder category, site, and other demographic factors,
      uses that do not consider the multivariate distribution when assessing utility for a given
      question are discouraged, as they risk unfair treatment of individuals or groups through
      stereotyping or quality-of-service issues.

prohibited_uses:
  - name: Re-identification of research participants
    description: >-
      The dataset is not to be used to attempt to re-identify research participants, nor for any
      actions that could reasonably lead to re-identification.
  - name: Uses foreseeably causing harm or stigmatization
    description: >-
      The dataset is not to be used for any purpose that could foreseeably cause harm or
      stigmatization to research participants, their families, communities, or specific populations.
  - name: Blocking access through intellectual property claims
    description: >-
      Intellectual property protections, database rights, or related rights may not be used in a
      manner that restricts or limits access to any part of the dataset or to any conclusions derived
      from it.
  - name: Sale or unauthorized redistribution
    description: >-
      Sale of all or part of the data on any media is not permitted, and recipients may not disclose,
      release, sell, rent, lease, loan, or otherwise grant access to the data to any third party
      outside the defined set of authorized persons without prior written consent of the provider.
  - name: Contacting research participants
    description: >-
      Recipients will not use the data, either alone or in concert with any other information, to make
      any effort to contact individuals who are the subjects of the data without appropriate IRB
      approval, specific written approval from the provider, and informed consent from the individual
      where required.

existing_uses:
  - name: Bridge2AI Summer School and hackathon
    description: >-
      A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer
      School and hackathon.
  - name: Training programme for dataset users
    description: >-
      Training opportunities for using the dataset are offered through the Bridge2AI Voice Scholars
      programme at https://www.b2aivoicescholars.org/.

future_use_impacts:
  - name: Risk of unfair treatment from dataset composition
    description: >-
      The curators warn that the composition and collection of the dataset may impact future uses.
      The dataset has skews based on disorder category, site, and other demographic factors, and
      users should consider the multivariate distribution when assessing utility for different
      questions in order to avoid unfair treatment of individuals or groups, including stereotyping
      and quality-of-service issues, and other undesirable harms such as financial harms or legal
      risks.
  - name: Anticipated clinical and public health benefit
    description: >-
      The project anticipates that integration of voice-based assessments into digital health tools
      has the potential to advance early disease detection, continuous disease monitoring, and
      personalized treatment strategies, and could improve accessibility for underserved or
      marginalized populations by offering low-cost screening for conditions that otherwise require
      specialist referral with long waits and high monetary costs.
  - name: Governance risk from raw audio release
    description: >-
      The consortium's memorandum on controlled access reflects the judgment that releasing raw voice
      samples in full open access would pose a heightened risk of re-identification and of illicit or
      unauthorized use, motivating the two-tier access model for future distribution.

errata:
  - name: Authorship list corrections in version 2.0.1
    description: >-
      Version 2.0.1, published 2025-08-18, consisted of corrections in the authorship list.
  - name: Spectrogram reprocessing in version 2.0
    description: >-
      Spectrograms were reprocessed to fix minor issues identified in the version 1.1 release, and all
      spectrograms and Mel-frequency cepstral coefficients from free-speech-related files were
      removed.
  - name: Parquet repair and diagnosis back-fill in version 3.1.0
    description: >-
      Version 3.1.0 fixed broken parquet files from the previous release, updated validated diagnosis
      information across conditions with back-filled information, rearranged some phenotype files
      (the adhd_adult, ptsd_adult, and psychiatric_history tables moved from the diagnosis directory
      to the questionnaire directory), and renamed certain gold standard variable names.
  - name: No formal erratum document
    description: >-
      The healthsheet states there is no erratum; instead, a changelog for each dataset version is
      published online with the dataset metadata, and the BIDS-organized audio release includes a
      CHANGES.md file.

updates:
  name: Versioned update plan
  description: >-
    The dataset is released as static versions rather than being dynamically updated. Further versions
    of the dataset will be released on a semi-annual (twice a year) basis; updates are distributed as
    new versions on the hosting platform, and users are notified through news items on the platform as
    well as through standard communication channels. Updates may correct labeling errors, add new
    instances, or delete instances. Planned expansions documented in the input bundle include growth
    toward the target enrollment (stated as 10,000 anticipated by 2027 in the study metadata and as
    30,000 in the IRB protocol and the 2024 viewpoint), inclusion of remote and at-home collection,
    addition of a Spanish-language protocol, and addition of a pediatric cohort, which has since been
    released as a separate PhysioNet project. Inclusion and exclusion criteria and study metadata are
    to be updated as the study population changes.

version_access:
  name: Version history and access to older versions
  description: >-
    Each version of the dataset has a unique DOI, and a concept DOI resolves to the latest version
    (10.13026/37yb-1t42 for the adult dataset). By default, older versions of the dataset continue to
    be supported, hosted, and made available to researchers, although the dataset publishers reserve
    the right to remove access to older versions. On PhysioNet the adult dataset lists versions 1.1
    (2025-01-17), 2.0.0 (2025-04-16), 2.0.1 (2025-08-18), 3.0.0 (2025-12-16), and 3.1.0 (2026-05-01);
    the files for version 1.1 are no longer available and users are directed to the latest version.
    Version 1.0 remains associated with the Health Data Nexus platform under DOI 10.57764/qb6h-em84.

retention_limit:
  name: Retention limits
  description: >-
    For contributed participant data, once data is contributed it will be retained as long as it is
    useful for research purposes, possibly indefinitely; participants were not told that their data
    would be deleted after a fixed period. Institutionally held identifiable data and the datasheets
    linking participant numbers to participant information are kept at each institution on local cloud
    storage for a maximum of 10 years after study completion and are then destroyed, under the
    responsibility of each local principal investigator. De-identified study data and original consent
    forms are retained for a minimum of five years after completion of the study, per USF
    requirements. For controlled-access recipients, the Data Transfer and Use Agreement terminates two
    years after the start date, upon completion of the project, upon expiration of the applicable
    ethics approval, or upon termination by the provider, whichever occurs first; data must then be
    destroyed in accordance with the provider's instructions, with written certification of
    destruction submitted within 30 days, except for one copy that may be retained as necessary to
    comply with records retention requirements under law, regulation, or institutional policy and for
    research integrity and verification, with the agreement's restrictions surviving for any such
    archival copy.

extension_mechanism:
  name: Mechanisms for extension and contribution
  description: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the hosting
    platform which references the original source; such derivative datasets may be made available
    under the same conditions as the source data. For augmentations to the code used to produce the
    data, the open-source repositories have discussion forums and issue pages that allow public
    discussion of data preprocessing, and a pull request mechanism for contributing improvements to
    the data preprocessing code. Researchers wishing to access raw audio to build on the dataset may
    apply through the Data Access Compliance Office. The consortium also invites collaboration through
    its Join Us and community channels.

external_resources:
  - name: Project documentation
    description: >-
      Bridge2AI-Voice documentation site covering protocols, dataset overview, collection methods,
      data governance, study metadata, healthsheet, data pre-processing, and AI-readiness assessment.
      https://docs.b2ai-voice.org/ . The site footer carries the notice "This repository is under
      review for potential modification in compliance with Administration directives."
  - name: Project website
    description: Bridge2AI-Voice project site. https://b2ai-voice.org/
  - name: Bridge2AI-Voice REDCap repository
    description: >-
      REDCap data dictionary, metadata, and instrument PDFs, released under the MIT license, at
      https://github.com/eipm/bridge2ai-redcap and archived on Zenodo at
      https://zenodo.org/doi/10.5281/zenodo.12760724. Cited releases include v3.20.0 and v3.23.0. The
      dictionary defines the data acquisition instruments, variable names, and the "Identifier?"
      sensitivity encoding used to drive removal of sensitive fields from the release.
  - name: b2aiprep library
    description: >-
      Open-source preprocessing library used to convert raw audio waveforms into the released parquet
      files and to merge source data into the phenotype files, licensed Apache-2.0.
      https://github.com/sensein/b2aiprep
  - name: SenseLab
    description: >-
      Open-source toolkit for processing audio files for research tasks.
      https://github.com/sensein/senselab
  - name: Documentation source repository
    description: >-
      Source code for the documentation site and dashboards, licensed MIT, at
      https://github.com/eipm/bridge2ai-docs, archived on Zenodo at
      https://zenodo.org/doi/10.5281/zenodo.13834653.
  - name: Bridge2AI-Voice FHIR profiles
    description: FHIR profiles for voice as a biomarker, published by the consortium.
  - name: Protocol development publication
    description: >-
      Bensoussan, Y., et al. "Developing Multi-Disorder Voice Protocols: A team science approach
      involving clinical expertise, bioethics, standards, and DEI." Proc. Interspeech 2024, 1445-1449.
      doi:10.21437/Interspeech.2024-1926.
      https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html
  - name: Mobile application feasibility publication
    description: >-
      Moothedan, E., Boyer, M., Watts, S., Abdel-Aty, Y., Ghosh, S., Rameau, A., Sigaras, A.,
      Elemento, O., Bridge2AI-Voice Consortium, Bensoussan, Y. "The Bridge2AI-voice application:
      initial feasibility study of voice data acquisition through mobile health." Front Digit Health.
      2025 Apr 15;7:1514971. doi:10.3389/fdgth.2025.1514971. PMCID PMC12037532, PMID 40302934. Open
      access under CC BY.
  - name: Audiomics viewpoint
    description: >-
      Bensoussan, Y., Elemento, O., Rameau, A. "Voice as an AI Biomarker of Health-Introducing
      Audiomics." JAMA Otolaryngol Head Neck Surg. 2024;150(4):283-284. doi:10.1001/jamaoto.2023.4807
  - name: Tablet recording recommendations
    description: >-
      Awan, S.N., Bahr, R., Watts, S., Boyer, M., Budinsky, R., Bridge2AI-Voice Consortium, et al.
      "Evidence-based recommendations for tablet recordings from the Bridge2AI-voice acoustic
      experiments." J Voice. 2024. doi:10.1016/j.jvoice.2024.08.029
  - name: NIH RePORTER project record
    description: >-
      NIH RePORTER entry for the funding project, application ID 11376382, project number
      3OT2OD032720-01S3, core project number OT2OD032720.
      https://reporter.nih.gov/project-details/11376382
  - name: Bridge2AI-Voice Pediatric Dataset
    description: >-
      Companion dataset released as a separate PhysioNet project, containing derived audio features
      for 23,533 recordings from 300 participants aged 2 to 18, collected at the Hospital for Sick
      Children under a separate pediatric protocol and research ethics board approval. Version 1.1.0
      published 2026-05-01, DOI 10.13026/h995-bt35. https://physionet.org/content/b2ai-voice-pediatric/
  - name: Health Data Nexus release of version 1.0
    description: >-
      Earlier feature-only release hosted on the Health Data Nexus, which provides cloud compute
      alongside the dataset rather than allowing data downloads. DOI 10.57764/qb6h-em84.
      https://healthdatanexus.ai/
  - name: Training resources for dataset users
    description: Bridge2AI Voice Scholars training programme. https://www.b2aivoicescholars.org/
  - name: AI-readiness recommendations
    description: >-
      "AI-readiness for Biomedical Data: Bridge2AI Recommendations," the criterion framework against
      which the project self-assesses FAIRness, provenance, characterization, pre-model
      explainability, ethics, sustainability, and computability.