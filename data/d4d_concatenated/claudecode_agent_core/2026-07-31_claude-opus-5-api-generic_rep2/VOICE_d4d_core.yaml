id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a large, ethically sourced, and demographically diverse voice dataset linked
  to health information, generated by the NIH Common Fund Bridge2AI program under the project
  "Voice as a Biomarker of Health." The dataset pairs standardized acoustic recordings (voice,
  speech, breathing, and cough tasks) with detailed participant metadata including clinical
  diagnoses, self-reported demographics, known acoustic confounders, and validated
  patient-reported outcome questionnaires. Participants were recruited into five predetermined
  disease cohort categories for which voice change has been associated with disease: voice
  disorders, neurological and neurodegenerative disorders, mood and psychiatric disorders,
  respiratory disorders, and pediatric voice and speech disorders. This record describes the adult
  dataset as released on PhysioNet; version 3.1.0 (published 2026-05-01) contains data for 833
  participants collected across five sites in North America. The healthsheet records the countries
  of data collection as the USA and Canada. The public release contains only data considered low
  risk, namely derived acoustic representations (spectrograms, Mel spectrograms, MFCCs, pitch,
  articulatory features, phonetic posteriorgrams, and static acoustic feature tables) together with
  phenotype tables and per-recording metadata; the original raw audio waveforms are withheld from
  this release and are available only through a separate controlled-access mechanism. A companion
  pediatric dataset (300 participants aged 2-18) is distributed as a separate PhysioNet project.
