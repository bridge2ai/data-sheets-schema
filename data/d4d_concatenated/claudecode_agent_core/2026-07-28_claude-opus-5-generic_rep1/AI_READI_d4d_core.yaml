- id: aireadi:distribution_cardiac_ecg
  name: cardiac_ecg
  description: Electrocardiogram data collected by a 12-lead protocol (the current standard),
    Holter monitor, or smartwatch. In this dataset the 12-lead protocol was used with the
    Philips PageWriter TC30 device.
- id: aireadi:distribution_clinical_data
  name: clinical_data
  description: Clinical data collected through REDCap. Each CSV file in this directory is
    a one-to-one mapping to the OMOP Common Data Model tables.
  media_type: text/csv
- id: aireadi:distribution_environment
  name: environment
  description: Data collected through an environmental sensor device custom built for the
    AI-READI project (the LeeLab Anura), placed in participants' homes for ten days.
  media_type: text/csv
- id: aireadi:distribution_retinal_flio
  name: retinal_flio
  description: Data collected through fluorescence lifetime imaging ophthalmoscopy (FLIO),
    an imaging modality for in vivo measurement of lifetimes of endogenous retinal fluorophores,
    acquired on Heidelberg Engineering equipment.
- id: aireadi:distribution_retinal_oct
  name: retinal_oct
  description: Data collected using optical coherence tomography (OCT), an imaging method
    using lasers for mapping subsurface structure. Devices represented include Heidelberg
    Spectralis, Topcon Maestro2, Topcon Triton and Zeiss Cirrus; subdirectories separate structural
    OCT from segmentation output.
- id: aireadi:distribution_retinal_octa
  name: retinal_octa
  description: Data collected using optical coherence tomography angiography (OCTA), a non-invasive
    technique generating volumetric angiography images. Subdirectories separate en face images,
    flow cubes, structural OCT and segmentation output.
- id: aireadi:distribution_retinal_photography
  name: retinal_photography
  description: Retinal photography (fundus photography) 2D images, including colour fundus
    photography, infrared and fundus autofluorescence, acquired on Optomed Aurora, iCare Eidon,
    Topcon Maestro2, Topcon Triton and Zeiss Cirrus devices.
- id: aireadi:distribution_wearable_activity_monitor
  name: wearable_activity_monitor
  description: Data collected through a wearable fitness tracker (Garmin Vivosmart 5), organised
    into heart rate, oxygen saturation, physical activity, physical activity calorie, respiratory
    rate, sleep and stress subdirectories.
- id: aireadi:distribution_wearable_blood_glucose
  name: wearable_blood_glucose
  description: Data collected through a continuous glucose monitoring device (Dexcom G6).
- id: aireadi:distribution_metadata_files
  name: Dataset-level metadata and documentation files
  description: Metadata and documentation files distributed with the dataset, including README.md,
    LICENSE.txt, CHANGELOG.md, healthsheet.md, dataset_description.json, study_description.json,
    dataset_structure_description.json, participants.tsv, participants.json, manifest.tsv
    and dqd_omop.json. The participants.tsv file carries the recommended train/validation/test
    split assignment.
