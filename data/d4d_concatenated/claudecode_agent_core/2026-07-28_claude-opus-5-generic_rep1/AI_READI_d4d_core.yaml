purposes:
- id: aireadi:purpose_ai_ready_t2dm_dataset
  name: Enable AI/ML research into type 2 diabetes salutogenesis
  response: The dataset was created to enable future generations of artificial intelligence
    and machine learning research to provide critical insights into type 2 diabetes mellitus,
    including salutogenic pathways back to health. Type 2 diabetes is a growing public health
    threat, yet current understanding of T2DM in the context of salutogenesis is limited;
    given the complexity of the disease, AI-based approaches may improve understanding, but
    a key obstacle is the lack of data ready for training AI models. The AI-READI dataset
    is intended to fill that gap.
- id: aireadi:purpose_balanced_multimodal_atlas
  name: Build a balanced, hypothesis-agnostic multimodal atlas
  response: A further purpose is to develop a foundational dataset in type 2 diabetes that
    is agnostic to existing classification criteria or biases and can be used to reconstruct
    a temporal atlas of T2DM development and reversal towards health. The protocol was designed
    to be hypothesis-agnostic, and the cohort was designed to be balanced across race/ethnicity,
    biological sex, and T2DM presence and severity so that unbiased machine learning models
    can be developed.
- id: aireadi:purpose_blueprint_and_workforce
  name: Establish a reusable blueprint and train an AI workforce
  response: AI-READI also places emphasis on establishing standards, best practices and guidelines
    for the collection, preparation and sharing of data for AI/ML, so that the project can
    serve as a model for future efforts to develop other medical and health datasets targeted
    for AI/ML, and on increasing access to and quality of AI/ML research by recruiting and
    training personnel through a year-long research internship programme.
tasks:
- id: aireadi:task_pseudotime_manifold
  name: Downstream pseudotime manifold analysis
  response: Data collection was specifically designed to permit downstream pseudotime manifold
    analysis, an approach used to predict disease trajectories by collecting and learning
    from complex multimodal data from participants with differing disease severity, ranging
    from normal to insulin-dependent T2DM. The approach relies on dimensionality reduction,
    is agnostic to existing classification criteria or biases, and can be used to reconstruct
    a temporal atlas of pathogenesis and healing.
- id: aireadi:task_multimodal_ai_ml
  name: Multimodal AI/ML model development
  response: The multimodal dataset is being gathered to facilitate downstream pseudotime manifolds
    and various applications in artificial intelligence, including algorithms aimed at defining
    disease trajectories and underlying genetic links in different racial and ethnic cohorts.
- id: aireadi:task_no_predefined_labels
  name: No predefined labelling task
  response: No specific labelling task was performed, as the dataset is a hypothesis-agnostic
    dataset aimed at facilitating multiple potential downstream AI/ML applications. The current
    version does come with recommended training, validation and testing splits.
addressing_gaps:
- id: aireadi:gap_lack_of_ai_ready_multimodal_data
  name: Lack of AI-ready, well-designed multimodal T2DM datasets
  response: The ability to understand and affect the course of complex, multi-organ diseases
    such as T2DM has been limited by a lack of well-designed, high quality, large and inclusive
    multimodal datasets. A major barrier to AI-based approaches has been the lack of diverse
    datasets that are AI ready for training AI models, which the AI-READI project is designed
    to address.
- id: aireadi:gap_demographic_underrepresentation
  name: Under-representation of groups bearing higher disease burden
  response: Past research studies under-represented groups that bear a higher burden of type
    2 diabetes. A meta-epidemiological review of T2DM studies published from 2000 to 2020
    indicated that samples lacked racial and ethnic diversity. AI-READI addresses this by
    recruiting four race/ethnicity groups in approximately equal proportions rather than targeting
    the demographic distribution of the US population, and by recruiting from three geographically
    distinct sites.
- id: aireadi:gap_ethical_sourcing_and_fair
  name: Absence of ethically sourced, FAIR-compliant AI training data
  response: AI-READI addresses challenges that have compromised AI implementation in clinical
    research by including ethical and equitable data collection and management and adherence
    to the Findable, Accessible, Interoperable, Reusable (FAIR) principles, and by developing
    documentation approaches, dissemination controls, a strict licence agreement and data
    watermarking to reduce downstream ethical risk.
