    as the AI-READI Consortium, and is registered on FAIRhub with an organizational creator
    name of "AI-READI Consortium". The consortium is a multidisciplinary group of investigators
    including clinicians, data scientists, vision scientists, computer scientists, organisational
    scientists and ethicists, spanning senior, mid-career and early-career faculty as well
    as clinical research coordinators, staff and interns, and collectively covering clinical
    research, data collection, data management, data standards, bioinformatics, team science
    and ethics. Six cross-disciplinary project modules involving teams located across eight
    institutions worked together to develop the dataset. Named collaborators listed for the
