instances:
- id: aireadi:instance_participant
  name: Participant record
  description: Each instance represents an individual patient. Each instance consists of all
    of the data available for an individual participating in the study.
  instance_type: individual study participant
  counts: 2280
  label: false
  label_description: No explicit label or target is associated with each data instance; no
    labels are provided.
  missing_information:
  - id: aireadi:missing_info_modality_coverage
    missing:
    - Data for one or more modalities for some participants
    - Device-derived data where the device returned no stored results
    why_missing:
    - Some participants elected not to participate in some study elements.
    - In a few cases the data collection device did not have any stored results or was returned
      too late to retrieve the results, for example because the battery died or data was lost.
    - In a few cases there may have been a data collision at some point in the process and
      data has been lost.
  sampling_strategies:
  - id: aireadi:sampling_released_dataset_completeness
    name: Completeness of the released dataset relative to enrolment
    is_sample: false
    source_data:
    - All participants enrolled during the data collection period covered by the release.
    strategies:
    - The healthsheet states that the dataset contains all possible instances, specifically
      data from all participants who have been enrolled during the covered data collection
      period, so no further sampling was applied when constructing the release from enrolled
      participants.
anomalies:
- id: aireadi:anomaly_survey_and_device
  name: Expected errors, noise and failures by modality
  anomaly_details:
  - In survey data, skipped questions or incomplete responses are expected.
  - In wearable data, improper use and technical failure such as battery failure or system
    malfunction are expected.
  - In imaging data, patient uncooperation, noise that may obscure the images, technical failure
    such as system malfunction, and data transfer failures are expected.
- id: aireadi:anomaly_operator_dependent_imaging
  name: Operator- and compliance-dependent imaging quality
  anomaly_details:
  - Undilated handheld fundus photography with the Optomed Aurora is challenging because the
    pupil is not dilated and the camera is handheld, so image quality varies from patient
    to patient and within the same patient.
  - The Heidelberg Spectralis is operated by the imaging team and is not fully automated,
    so quality issues may arise which may lead to skipping this modality and missing data.
  - FLIO takes longer than a usual Spectralis OCT and exposes patients to uncomfortable levels
    of light, so it is performed as the last modality of a visit; because of this, patients
    may not be at their best possible compliance.
- id: aireadi:anomaly_no_external_audit
  name: No formal external audit
  anomaly_details:
  - The dataset has not undergone any formal external audits. It has been reviewed internally
    by AI-READI team members for quality checks and to ensure that no personally identifiable
    information was accidentally included.
known_biases:
- id: aireadi:bias_volunteer_selection
  name: Volunteer bias
  bias_type: selection_bias
  bias_description: Participants are volunteers; therefore there is selection bias known as
    volunteer bias, which may limit the generalisability of results among those who are not
    represented in the study population.
- id: aireadi:bias_incomplete_balance_during_enrollment
  name: Incomplete demographic balance during ongoing enrolment
  bias_type: representation_bias
  bias_description: While the cross-sectional database ultimately aims to achieve balance
    across race/ethnicity, biological sex, and diabetes presence and severity, the pilot study
    is not balanced across these parameters. As enrolment is ongoing, the pilot data release
    and periodic updates to data releases may not have achieved balanced distribution across
    groups.
  mitigation_strategy: Recruitment proceeds in waves whose composition and size are influenced
    by the observed participation characteristics of race/ethnicity, gender, T2DM severity
    and site; composition is monitored and adjusted by under- and oversampling groups as needed.
    If sample balancing on race/ethnicity emerges as a challenge, new recruitment strategies
    will be implemented.
  affected_subsets:
  - race/ethnicity groups
  - biological sex
  - diabetes severity groups
- id: aireadi:bias_recruitment_of_underrepresented_groups
  name: Documented difficulty recruiting under-represented groups
  bias_type: sampling_bias
  bias_description: It is well documented that recruiting Black men into health research is
    more difficult than recruiting other populations, yet this population represents a disproportionate
    percentage of T2DM burden. Factors such as medical mistrust and fear of safety stem from
    historical events such as the Tuskegee syphilis study. Similar trends for under-recruitment
    and for disease burden have been reported for Hispanic and Asian persons.
  mitigation_strategy: Researchers have identified strategies to encourage interest among
    Black men to participate in research, such as tailoring printed materials and using a
    personalised, participatory approach to recruitment.
  affected_subsets:
  - Black men
  - Hispanic participants
  - Asian participants
- id: aireadi:bias_english_language_requirement
  name: English-language eligibility requirement
  bias_type: selection_bias
  bias_description: Participants are required to speak, read and understand English, which
    may have created challenges in recruiting Hispanic and/or Asian persons. The study team
    concluded that truly enrolling non-English-speaking participants would require translating
    all study materials, which was not possible at the time, so non-English-speaking participants
    were not initially enrolled.
  mitigation_strategy: An NIH supplement was to be submitted to fund translation of all study
    materials to enable recruitment and participation of Spanish-speaking participants. If
    recruitment goals for Hispanic participants are not met, the consent form will be translated
    into Spanish by UCSD translation services, and native Spanish-speaking research staff
    at UCSD will provide interpretation and instructions.
  affected_subsets:
  - non-English-speaking individuals
  - Hispanic participants
- id: aireadi:bias_urban_hospital_based_recruitment
  name: Urban, hospital-based recruitment and excluded populations
  bias_type: representation_bias
  bias_description: Factors influencing the generalization of derived models include the predominantly
    urban and hospital-based recruitment, which may not fully capture diverse cultural and
    socioeconomic backgrounds. The study cohort may not provide a comprehensive representation
    of the population, as it does not include other races/ethnicities such as Pacific Islanders
    and Native Americans.
  mitigation_strategy: Three recording sites were strategically selected for geographic diversity
    across the United States and to ensure diverse representation across racial and ethnic
    groups, and individuals from all demographic backgrounds were recruited at all three sites.
  affected_subsets:
  - Pacific Islander populations
  - Native American populations
  - rural populations
- id: aireadi:bias_measurement_device_heterogeneity
  name: Device and site heterogeneity as a generalization factor
  bias_type: measurement_bias
  bias_description: The number and diversity of devices, data recording specificities, and
    the number and diversity of recording sites are identified as factors that might limit
    the generalization of derived models.
  mitigation_strategy: Information on device make and model, including specific modalities
    such as macula scans or wide scans during OCT, was documented to ensure repeatability,
    and the study included multiple devices for one measure to enhance generalizability and
    represent the diverse range of equipment used in clinical settings. Uniform data collection
    protocols were implemented for all subjects irrespective of race/ethnicity, biological
    sex or diabetes severity, across all study sites.
known_limitations:
- id: aireadi:limitation_biorepository_finite
  name: Finite biorepository samples
  limitation_type: scope_limitation
  limitation_description: A limitation of the biorepository is that there are a finite number
    of samples to share with scientists interested in using them in research.
  recommended_mitigation: Procedures for reviewing and prioritising written requests will
    be developed before the biorepository is complete.
- id: aireadi:limitation_cross_sectional_single_visit
  name: Cross-sectional design with a single visit per participant
  limitation_type: temporal_limitation
  limitation_description: AI-READI is a cross-sectional study and there is currently only
    one visit per participant. Approximately 10% of the study population (about 4% of participants
    according to one statement in the source documents) are expected to be invited for a follow-up
    examination in year 4 of the project.
  scope_impact: Longitudinal analyses are limited to the small subgroup invited to return
    for follow-up.
- id: aireadi:limitation_enrollment_ongoing
  name: Release covers a subset of target enrolment
  limitation_type: coverage_limitation
  limitation_description: Enrolment is ongoing. This release contains 2280 participants against
    a target enrolment stated as 4000 in the study design and dataset metadata and as 4600
    in the IRB protocol application. Future versions will include larger numbers of participants
    as enrolment increases.
  scope_impact: The intended triple balancing across race/ethnicity, biological sex and T2DM
    severity is not fully realised in this release.
- id: aireadi:limitation_variable_dropped
  name: Snellen visual acuity variables dropped
  limitation_type: integration_limitation
  limitation_description: The data fields and types are largely the same as the prior version
    of the dataset, but the Snellen visual acuity variables were dropped in this version,
    so only logMAR visual acuity measurements are available.
  scope_impact: Analyses depending on Snellen visual acuity cannot be reproduced across versions.
- id: aireadi:limitation_no_unstructured_text
  name: No unstructured text data
  limitation_type: scope_limitation
  limitation_description: There is no unstructured text data included in this dataset.
- id: aireadi:limitation_raw_data_not_shared
  name: Raw data not distributed
  limitation_type: scope_limitation
  limitation_description: The raw data is saved and expected to be preserved by the AI-READI
    project at least for the duration of the project, but is not anticipated to be shared
    outside the project team, because it has not been mapped to standardized terminologies
    and because it may accidentally include personal health information or personally identifiable
    information, for example in free-text fields.
  recommended_mitigation: There is a possibility that raw data may be included in future releases
    of the controlled access dataset.
