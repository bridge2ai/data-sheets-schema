name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: The flagship dataset of the Artificial Intelligence Ready and Equitable (also
  rendered "Exploratory") Atlas for Diabetes Insights (AI-READI) project, published on the
  FAIRhub data portal. It consists of multimodal data collected from individuals with and
  without type 2 diabetes mellitus (T2DM), harmonized across three data collection sites (University
  of Alabama at Birmingham, University of California San Diego, and University of Washington).
  The dataset is designed for downstream artificial intelligence and machine learning research
  into salutogenesis, the pathway from disease back to health, in T2DM. Recruitment sampling
  aimed at an approximately equal distribution of participants across diabetes severity, and
  the acquisition protocol spans multiple domains (survey data, physical measurements, clinical
  data, imaging data, wearable device data, environmental sensing) to enable analyses not
  feasible with claims or electronic health record data. This record describes version 3.0.0
  (DOI 10.60775/fairhub.3), made available on FAIRhub on 2025-11-17, containing data from
  2280 participants collected between 2023-07-19 and 2025-05-01, comprising 356,343 files
  totalling approximately 3.82 TB. The dataset also has an alternative title, "AI-READI dataset".
  Two earlier versions exist (1.0.0 and 2.0.0); FAIRhub marks version 2.0.0 as no longer accessible.
  Each release is distributed as a publicly accessible set stripped of protected health information
  and, per project documentation, a controlled-access set containing more sensitive elements.
