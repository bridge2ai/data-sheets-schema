id: https://chorus4ai.org/
name: CHoRUS
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable
  AI
description: The CHoRUS dataset is a multi-center, multi-modal, high-resolution critical care
  dataset assembled by the Patient-Focused Collaborative Hospital Repository Uniting Standards
  (CHoRUS) for Equitable AI data generation project, one of four data generation projects
  in the NIH Common Fund's Bridge2AI consortium. The dataset is built to support artificial
  intelligence and machine learning applications aimed at characterizing acute and critical
  care illness, predicting complications, and measuring treatment response among patients
  with acute or critical illness. Data are collected retrospectively from contributing hospitals
  and are released under controlled access. Structured electronic health record data are standardized
  to the OMOP Common Data Model; other modalities use modality-specific standards (OHNLP for
  extracted and tokenized clinical notes, DICOM for imaging from PACS, WFDB for waveform telemetry
  from bedside monitors and gateway/middleware, and EDF+ and Persyst for EEG waveforms from
  hospital databases). The project website describes an anticipated final dataset of 100,000
  patient admissions, 9 data modalities and 14 data contributing hospitals, and a current
  released dataset of 50,000 patient admissions from ICU, PICU and NICU containing 1.6 billion
  rows of EHR OMOP data, 7,642 admissions with radiology data and 23 Tb of waveform data.
  A September 2025 informational webinar states that, as of August 2025, the dataset covered
  14 different hospitals with over 45,000 unique admissions. The project also plans a holdout
  test set accessible for external validation of models.
page: https://chorus4ai.org/
status: 'Active NIH-funded data generation project with a project period of 2022-09-01 to
  2026-11-30. A current released dataset is available under controlled access, and the project
  describes a larger anticipated final dataset that is still being assembled (imaging de-identification
  and EEG extraction were reported as in process as of the September 2025 informational webinar).
  The project website carries the notice: "This repoitory is under review for potential modification
  in compliance with Administration directives."'
conforms_to: 'OMOP Common Data Model for structured electronic health record data, with modality-specific
  standards for other data types: OHNLP for extracted and tokenized clinical notes, DICOM
  for imaging, WFDB for waveform telemetry, and EDF+ and Persyst for EEG waveforms.'
