sampling_strategies:
- id: chorus_sampling_strategy
  name: Sampling for a balanced and diverse cohort
  is_sample: true
  strategies:
  - The project establishes a legal framework for collecting data at scale, sampling to ensure
    comprehensive sets of patient conditions and clinical treatment strategies.
  - Federated access enables sampling methods to ensure a balanced and diverse cohort.
  source_data:
  - Clinical records of patients with acute or critical illness at 14 data acquisition hospitals
    within a 20-institution consortium.
  description: The dataset samples critically ill patients across a multi-center network.
    The source bundle states the aim of a balanced and diverse cohort but does not report
    a verification of representativeness or a randomization procedure.
raw_sources:
- id: chorus_raw_data_availability
  name: Availability of raw source data
  raw_data_details:
  - Clinical notes are stored locally at contributing sites except for tokens, so the raw
    note text is not centralized in the enclave.
  - OMOP and telemetry data are held in the enclave.
  - The source bundle does not describe a mechanism for external users to obtain the unstandardized
    raw source data.
preprocessing_strategies:
- id: chorus_preprocessing_omop_standardization
  name: Standardization to the OMOP Common Data Model
  preprocessing_details:
  - Data are acquired and standardized to the OMOP Common Data Model.
  - Unified standards harmonize multi-modal EHR, waveform, imaging, and text data.
  - Validated semantic mappings connect clinical data in various source formats to international
    standards.
- id: chorus_preprocessing_tokenization_and_deid
  name: Tokenization and re-identification-limiting transformation
  preprocessing_details:
  - Unstructured electronic health record data are tokenized.
  - Clinical notes are extracted and tokenized using the OHNLP toolkit.
  - Data are transformed using approaches that limit re-identification.
  - Imaging de-identification was in process for a larger cohort as of the September 2025
    webinar.
- id: chorus_preprocessing_waveform_conversion
  name: Waveform conversion
  preprocessing_details:
  - Waveform documentation and various waveform conversion scripts are maintained by the project.
  - Waveform telemetry is represented in WFDB with a PhysioNet schema extended metadata schema;
    EEG uses EDF+ and Persyst.
- id: chorus_preprocessing_geocoding
  name: Geospatial contextualization
  preprocessing_details:
  - Data elements are given appropriate contextual factors such as geographic distance to
    the nearest hospital.
  - Open source code geocodes OMOP Location entities via DeGauss.
cleaning_strategies:
- id: chorus_cleaning_site_characterization
  name: Site characterization reports
  cleaning_details:
  - Characterization reports are produced and returned to sites following their data submissions.
  - Status tracking identifies and resolves blocking issues at data contributing sites.
- id: chorus_cleaning_mapping_validation
  name: Clinical validation of semantic mappings
  cleaning_details:
  - Semantic mappings undergo validation; a clinical validation SOP supports contributions
    to mapping efforts.
  - SOP documents undergo an internal validation and review process within the Chorus_SOP
    repository.
labeling_strategies:
- id: chorus_labeling_annotation_environment
  name: Visualization and annotation environment
  labeling_details:
  - A visualization and annotation environment will label data with targets important for
    prediction.
  - The multi-center network develops capabilities to acquire, standardize, tokenize, store,
    visualize, and label data.
  description: The source bundle does not report annotation platforms, annotator demographics,
    annotations per item, or inter-annotator agreement for the CHoRUS dataset.
machine_annotation_tools:
- id: chorus_machine_annotation_tools
  name: Automated extraction and processing tools
  tools:
  - OHNLP toolkit
  - privacy_scan_tool
  - UF-Geocoding (DeGauss)
  tool_descriptions:
  - OHNLP toolkit is used to extract and tokenize clinical notes; the published metadata schema
    for this modality is the OHNLP open source schema.
  - privacy_scan_tool is described in the CHoRUS GitHub organization as "A Privacy Scan tools
    for medical records" (Python).
  - UF-Geocoding is open source code to geocode OMOP Location entities via DeGauss (Python,
    MIT, forked from bihorac-LAB/Exposome).
existing_uses:
- id: chorus_existing_uses
  name: Current uses of the CHoRUS dataset
  examples:
  - Datasets are being used for training activities and publications.
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program expands access to Bridge2AI
    CHoRUS data through engagement, AI training, and mentorship, and equips trainees to apply
    AI/ML methods to big data analysis using multi-modal datasets from a broad range of cohort
    participants.
  - Cohort 2 of the training program ran with a program start date of November 17, 2025 and
    a program end date of July 31, 2026, with up to 30 trainees selected.
other_tasks:
- id: chorus_other_tasks_education
  name: Educational and workforce-development use
  task_details:
  - Trainees use the data and tools to create practical use cases on the Bridge2AI AI/ML for
    Clinical Care Collaborative Cloud, including work with the OHDSI/OMOP common data model
    and the OHDSI tool stack.
  - The project cultivates expertise in the lay and scientific community to improve AI literacy
    and utilization through multimodal educational approaches.
future_use_impacts:
- id: chorus_future_use_impacts
  name: Anticipated impact of future use
  impact_details:
  - The holdout test set is intended to aid marketplace adoption of AI-developed models for
    implementation in acute and critical care.
  - The data generation project is intended to catalyze the biomedical research and expertise
    necessary to promote the patient-focused deployment of AI in acute and critical care.
  - The project aims to develop the necessary network, tools, standards, data, and education
    to build ML- and AI-derived models that improve care and outcomes for patients requiring
    critical care.
intended_uses:
- id: chorus_intended_uses
  name: Intended uses of the CHoRUS dataset
  examples:
  - Building machine-learning and artificial-intelligence-derived models to improve the care
    and outcomes of patients requiring critical care
  - Characterizing acute and critical care illness, predicting complications, and measuring
    treatment response
  - External validation of AI models using the provisioned holdout test set
  - Hands-on AI/ML training and use-case development on the Bridge2AI AI/ML for Clinical Care
    Collaborative Cloud
  use_category:
  - Clinical AI/ML model development
  - Clinical AI/ML model validation
  - Workforce training and education
  usage_notes: Access is controlled. Participants complete a registration form with name,
    email, and institution and must sign a licensing agreement included in the registration
    form before gaining access to the dataset; access to the dataset requires a ".edu" email
    address, and program administrators assist with access where needed. Once access is granted
    and compute is provisioned, an email is sent.
distribution_formats:
- id: chorus_distribution_format
  name: Controlled-access distribution through the project cloud enclave
  description: 'Data are distributed under controlled access. OMOP and telemetry data are
    held in the enclave; clinical notes remain stored locally at contributing sites except
    for tokens. Trainees work with the data on the Bridge2AI AI/ML for Clinical Care Collaborative
    Cloud, with compute provisioned after access is granted. Formats follow the modality standards:
    OMOP for structured EHR, OHNLP for tokenized clinical notes, DICOM for imaging, WFDB for
    waveform telemetry, and EDF+ and Persyst for EEG. The source bundle gives no public download
    URL.'
distribution_dates:
- id: chorus_distribution_dates
  name: Reported release status
  release_dates:
  - As of August 2025 the dataset covered 14 different hospitals with over 45,000 unique admissions
    (AIM-AHEAD/Bridge2AI Cohort 2 informational webinar, September 9, 2025).
  - The project website describes a "Current Released Dataset" of 50,000 patient admissions
    alongside an "Anticipated Final Dataset" of 100,000 patient admissions; no calendar release
    date is given.
maintainers:
- id: chorus_maintainer_program_management
  name: Ciera McCrary
  role: academic_institution
  maintainer_details:
  - Program Manager, Massachusetts General Hospital.
  - Listed as the contact on the CHoRUS project website with the email address cmccrary@mgh.havard.edu
    as printed in the source.
- id: chorus_maintainer_consortium
  name: CHoRUS Consortium
  role: academic_institution
  maintainer_details:
  - 60+ CHoRUS consortium members across 20 different institutions, of which 14 contribute
    as Data Acquisition centers.
  - The chorus-ai GitHub organization houses active repositories providing software and tooling,
    validated semantic mappings, standard operating protocols, and project management overviews;
    28 repositories were listed at capture.
  - Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
updates:
  id: chorus_update_plan
  name: Ongoing dataset expansion
  update_details:
  - The dataset is being expanded from the current released dataset of 50,000 patient admissions
    toward an anticipated final dataset of 100,000 patient admissions across 9 data modalities
    and 14 data contributing hospitals.
  - Imaging de-identification for a larger cohort and EEG waveform extraction were reported
    as in process as of the September 2025 informational webinar.
  - Data contributing sites provide regular status updates on their progress in creating and
    curating a CHoRUS-specific clinical data extract, submitted through the GitHub interface
    or a Google Form that triggers a GoogleScript calling the GitHub API to update status
    and issue information.
  description: The source bundle does not state a fixed update frequency or a versioned release
    schedule.
version_access:
  id: chorus_version_access
  name: Access to dataset versions
  versions_available:
  - Current Released Dataset - 50,000 patient admissions from ICU, PICU, and NICU; 1.6 billion
    rows of EHR OMOP data; 7,642 admissions with radiology data; 23 Tb of waveform data.
  - Anticipated Final Dataset - 100,000 patient admissions; 9 different data modalities; 14
    data contributing hospitals.
  version_details:
  - The project website distinguishes a current released dataset from an anticipated final
    dataset; no version identifiers or DOIs for these are given in the source bundle.
  - The AIM-AHEAD/Bridge2AI Cohort 2 informational webinar reports coverage of 14 hospitals
    and over 45,000 unique admissions as of August 2025, which differs from the 50,000 admissions
    reported on the project website; both figures are recorded as stated by their sources.
  - Access to any version requires registration, a signed licensing agreement, and a ".edu"
    email address.
extension_mechanism:
  id: chorus_extension_mechanism
  name: Contribution and extension mechanisms
  extension_details:
  - Data contributing sites extend the dataset by creating and submitting CHoRUS data extracts
    following the validated SOP workflow, with tooling provided to create and upload an extract.
  - Clinical collaborators can contribute to mapping efforts through the chorus-mapping repository,
    which holds documentation and pooled tabular mappings along with an associated clinical
    validation SOP.
  - Issues encountered in creating or submitting a data extract are posted to context-specific
    Standards Discussions or Data Acquisition Discussions.
  - Software contributors use the chorus-developer web guide, which compiles documentation
    for contributors and users of the CHoRUS software packages, and a package status page
    listing versions, maintainers, and other metadata.
  - Sites submit status updates via the GitHub interface or a Google Form; a GoogleScript
    triggered on each submission calls the GitHub API to update status and issue information,
    feeding the Standards Project or the Data Acquisition Project.
ethical_reviews:
- id: chorus_ethical_review_community_focus_groups
  name: Community-facing ethics focus groups
  review_details:
  - The project performs community-facing ethics focus groups to determine what data is appropriate
    for public sharing.
  - The CHoRUS consortium evaluates community perspectives on clinical care AI to find ways
    to increase trustworthiness of provenance and privacy in AI.
- id: chorus_ethical_review_legal_framework
  name: Legal and regulatory framework development
  review_details:
  - The project establishes a legal framework for collecting data at scale, sampling to ensure
    comprehensive sets of patient conditions and clinical treatment strategies.
  - New approaches are being created as the existing legal and regulatory landscape is analyzed.
  - Patient-focused efforts determine the ethical and legal approaches to manage privacy and
    bias, while accounting for social determinants of health.
- id: chorus_ethical_review_ethics_pillar
  name: Ethical and Trustworthy AI pillar
  review_details:
  - One of the three pillars of the CHoRUS data generation project is Ethics (Ethical and
    Trustworthy AI); the other two are Data (Standards, Tool Development and Optimization,
    and Data Acquisition) and People (Team Science and Skill and Workforce Development).
data_protection_impacts:
- id: chorus_data_protection_impact
  name: Data protection and public-sharing assessment
  impact_details:
  - Community-facing ethics focus groups are performed to determine what data is appropriate
    for public sharing.
  - The project analyses the existing legal and regulatory landscape and creates new approaches
    for provenance and privacy in clinical care AI.
  - Data are transformed using approaches that limit re-identification before release.
human_subject_research:
  id: chorus_human_subject_research
  name: Human subject research status
  involves_human_subjects: true
  special_populations:
  - Critically ill and acutely ill patients
  - Patients admitted to pediatric intensive care units (PICU)
  - Patients admitted to neonatal intensive care units (NICU)
  regulatory_compliance:
  - The project establishes a legal framework for collecting data at scale.
  - The CHoRUS consortium analyses the existing legal and regulatory landscape as part of
    its ethics work.
  description: The dataset is derived from clinical records of critically ill patients at
    contributing hospitals. The source bundle does not state an IRB approval number or a named
    ethics review board for the dataset itself.
at_risk_populations:
  id: chorus_at_risk_populations
  name: At-risk populations in the CHoRUS dataset
  at_risk_groups_included: true
  special_protections:
  - Controlled access to all data types
  - Transformation of data using approaches that limit re-identification
  - Tokenization of unstructured EHR content and local retention of clinical notes
  - De-identification of imaging, reported as in process for a larger cohort
  description: The current released dataset comprises admissions from ICU, PICU, and NICU,
    so it includes critically ill adults, children, and neonates. Assent procedures and guardian
    consent arrangements are not described in the source bundle.
license_and_use_terms:
  id: chorus_license_and_use_terms
  name: CHoRUS access and use terms
  license_terms:
  - All participants must sign a licensing agreement included in the registration form before
    gaining access to the dataset.
  - Access to the dataset requires a ".edu" email address; this requirement is stated not
    to be a barrier to acceptance into the training program, and program administrators will
    assist with access if needed.
  - Registration requires a form with name, email, and institution; once access is granted
    and compute is provisioned, an email is sent.
  - Access requests are directed to dbold@emory.edu or jared.houghtaling@tuftsmedicine.org.
  - The chorus-ai GitHub organization README states that the project is licensed under the
    MIT License; this statement is made about the CHoRUS software project on GitHub. Individual
    repositories carry their own licenses, including MIT (chorus_waveform, chorus-extract-upload,
    UF-Geocoding) and Apache-2.0 (Chorus_SOP). The source bundle does not state a license
    identifier for the dataset itself.
  contact_person: person_jared_houghtaling
  description: The dataset is under controlled access for every listed data type. The source
    bundle describes an access process (registration, licensing agreement, ".edu" email, provisioned
    compute) rather than an open data license.
regulatory_restrictions:
  id: chorus_regulatory_restrictions
  name: Regulatory and confidentiality posture
  confidentiality_level: restricted
  other_compliance:
  - The project establishes a legal framework for collecting data at scale.
  - New approaches are being created as the existing legal and regulatory landscape is analyzed
    by the CHoRUS ethics effort.
  - Community-facing ethics focus groups determine what data is appropriate for public sharing.
  description: All listed data types are marked Controlled for access control. The source
    bundle does not state a HIPAA compliance determination, an export-control status, or a
    named data governance committee for the dataset.
is_deidentified:
  id: chorus_deidentification
  name: De-identification of the CHoRUS dataset
  method: Data are transformed using approaches that limit re-identification. Unstructured
    electronic health record data are tokenized, and clinical notes are extracted and tokenized
    using the OHNLP toolkit with only tokens leaving the contributing site. Imaging de-identification
    was reported as in process for a larger cohort as of the September 2025 informational
    webinar.
  deidentification_details:
  - 'NIH RePORTER abstract: transform data using approaches that limit re-identification.'
  - 'Informational webinar: imaging - currently 1000 images available with de-id in process
    for larger cohort.'
  - 'Informational webinar: clinical notes stored locally except tokens.'
  - The CHoRUS GitHub organization lists a privacy_scan_tool ("A Privacy Scan tools for medical
    records") and a CTP-deid repository.
