instances:
- id: chorus_instance_patient_admission
  name: Patient admission
  instance_type: Hospital admission of a patient receiving acute or critical care
  counts: 50000
  description: The project website reports a current released dataset of 50,000 patient admissions
    from ICU, PICU, and NICU, and an anticipated final dataset of 100,000 patient admissions.
    The NIH RePORTER abstract states that the project addresses the challenges of acquiring
    an AI-ready data set from more than 100,000 critically ill patients. The AIM-AHEAD/Bridge2AI
    Cohort 2 informational webinar of September 9, 2025 states that, as of August 2025, the
    dataset covered 14 different hospitals with over 45,000 unique admissions. These admission
    counts come from different sources and reporting dates and are reported here as stated
    rather than reconciled into a single figure.
- id: chorus_instance_ehr_omop_row
  name: Structured EHR record row in OMOP format
  instance_type: Row of structured electronic health record data in the OMOP Common Data Model
  counts: 1600000000
  description: The project website reports 1.6 billion rows of EHR OMOP data in the current
    released dataset. Structured EHR content includes demographics, medication administration
    (dosing time-stamped upon each infusion change or dose administration), procedures (documentation
    by providers), nursing flowsheets (high-frequency documentation), and diagnoses (documentation
    by providers).
- id: chorus_instance_radiology_imaging
  name: Radiology imaging study
  instance_type: Imaging study extracted from hospital PACS and represented in DICOM
  description: The project website reports 7,642 admissions with radiology data in the current
    released dataset. The September 2025 informational webinar states that 1,000 images are
    currently available, with de-identification in process for a larger cohort.
- id: chorus_instance_waveform_telemetry
  name: Waveform telemetry recording
  instance_type: Physiological waveform recording from bedside monitors and gateway/middleware,
    represented in WFDB
  description: The project website reports 23 Tb of waveform data in the current released
    dataset. The informational webinar states that OMOP and telemetry are held in the enclave.
- id: chorus_instance_clinical_note
  name: Clinical note
  instance_type: Unstructured clinical note extracted and tokenized using the OHNLP toolkit
  description: Clinical notes are extracted and tokenized using the OHNLP toolkit. The informational
    webinar states that clinical notes are stored locally except for tokens, rather than being
    held in the central enclave.
- id: chorus_instance_eeg_waveform
  name: EEG waveform recording
  instance_type: Electroencephalography waveform recording from hospital EEG databases, represented
    in EDF+ and Persyst formats
  description: The informational webinar states that EEG extraction was in process as of the
    September 2025 presentation.
known_biases:
- id: chorus_bias_management
  name: Bias and representativeness management
  bias_description: Managing bias is an explicit aim of the project rather than a resolved
    property of the dataset. Patient-focused efforts determine the ethical and legal approaches
    to manage privacy and bias while accounting for social determinants of health. The source
    bundle does not report a measured bias assessment for the released dataset.
  mitigation_strategy: Federated access enables sampling methods to ensure a balanced and
    diverse cohort; sampling is designed to ensure comprehensive sets of patient conditions
    and clinical treatment strategies; data elements feature appropriate contextual factors
    such as geographic distance to the nearest hospital; social determinants of health are
    included among the acquired data.
known_limitations:
- id: chorus_limitation_modality_coverage
  name: Incomplete modality coverage in the released dataset
  limitation_type: coverage_limitation
  limitation_description: Not all declared modalities are fully available. As of the September
    2025 informational webinar, 1,000 images were available with de-identification in process
    for a larger cohort, EEG extraction was in process, and clinical notes remained stored
    locally except for tokens.
  scope_impact: Analyses requiring imaging, EEG, or full clinical note text are limited relative
    to analyses using OMOP-standardized structured EHR data and waveform telemetry.
- id: chorus_limitation_released_vs_anticipated
  name: Released dataset smaller than the anticipated final dataset
  limitation_type: coverage_limitation
  limitation_description: The project website reports a current released dataset of 50,000
    patient admissions against an anticipated final dataset of 100,000 patient admissions,
    9 data modalities, and 14 data contributing hospitals. Imaging is present for 7,642 of
    the released admissions.
  scope_impact: Statistics computed on the current release do not describe the final dataset
    the project anticipates delivering.
- id: chorus_limitation_clinical_scope
  name: Scope restricted to acute and critical care admissions
  limitation_type: scope_limitation
  limitation_description: The dataset covers admissions of patients with acute or critical
    illness from ICU, PICU, and NICU settings at data acquisition hospitals within a 20-institution
    United States consortium.
  scope_impact: Findings may not transfer to non-critical-care settings or to health systems
    outside the contributing network.
- id: chorus_limitation_metadata_publication
  name: Metadata publication incomplete for several modalities
  limitation_type: methodological_limitation
  limitation_description: Metadata availability is marked as Planned for clinical notes, imaging,
    and EEG waveforms, while demographics, medication administration, procedures, nursing
    flowsheets, diagnoses, and waveform telemetry are reported as having metadata available.
  scope_impact: Users of the modalities whose metadata is still planned have less documentation
    available to interpret those data.
- id: chorus_limitation_representativeness_unverified
  name: Representativeness stated as a goal rather than a verified property
  limitation_type: representativeness_limitation
  limitation_description: The project states aims of a balanced and diverse cohort and of
    comprehensive coverage of patient conditions and treatment strategies, but the source
    bundle reports no verification that the released dataset is representative of any defined
    target population.
  recommended_mitigation: Users should characterize the cohort themselves before generalizing
    results beyond the contributing hospitals.
confidential_elements:
- id: chorus_confidential_elements
  name: Confidentiality of dataset content
  confidential_elements_present: true
  confidentiality_details:
  - All listed data types are marked as having Controlled access control.
  - Clinical notes are stored locally at contributing sites except for tokens, rather than
    being centralized in the enclave.
  - Data are transformed using approaches that limit re-identification.
  - Community-facing ethics focus groups are performed to determine what data is appropriate
    for public sharing.
subpopulations:
- id: chorus_subpopulations
  name: Subpopulations represented in the dataset
  subpopulation_elements_present: true
  identification:
  - Admissions from intensive care units (ICU)
  - Admissions from pediatric intensive care units (PICU)
  - Admissions from neonatal intensive care units (NICU)
  - Demographic attributes are captured as an OMOP-standardized data type
  distribution:
  - The project website reports a current released dataset of 50,000 patient admissions from
    ICU, PICU, and NICU; per-unit counts are not stated in the source bundle.
  description: The project aims for a balanced and diverse cohort, with federated access enabling
    sampling methods to ensure that balance, and with social determinants of health taken
    into account.
sensitive_elements:
- id: chorus_sensitive_elements
  name: Sensitive elements in the dataset
  sensitive_elements_present: true
  sensitivity_details:
  - Clinical data from critically ill patients, including diagnoses, medication administration,
    procedures, and nursing flowsheet documentation
  - Unstructured clinical notes, extracted and tokenized using the OHNLP toolkit
  - Imaging extracted from hospital PACS
  - Waveform telemetry from bedside monitors and EEG waveforms from hospital databases
  - Social determinants of health
  - Contextual factors such as geographic distance to the nearest hospital
acquisition_methods:
- id: chorus_acquisition_retrospective_clinical
  name: Retrospective acquisition from hospital clinical systems
  acquisition_details:
  - The CHoRUS dataset is described as retrospective data collection.
  - Data are acquired across a multi-center network with capabilities to acquire, standardize,
    tokenize, store, visualize, and label data such as structured electronic health record
    data, tokenized unstructured electronic health record data, telemetry and EEG waveforms,
    imaging, and social determinants of health.
  - Imaging is drawn from hospital PACS, waveform telemetry from bedside monitors and gateway/middleware,
    and EEG from the hospital database.
collection_mechanisms:
- id: chorus_collection_mechanism_site_extracts
  name: Site data extracts under standard operating protocols
  mechanism_details:
  - Data contributing sites create and submit a CHoRUS data extract following standard operating
    protocols (SOPs) that instruct sites about best practices for curating and delivering
    interoperable datasets.
  - The Chorus_SOP page provides an interactive workflow diagram describing the step-by-step
    process for extracting and contributing clinical data to CHoRUS, with links to SOP documents
    validated within the Chorus_SOP repository.
  - Tooling is provided to create and upload a CHoRUS data extract.
  - Issues in the creation or submission of a data extract are raised in context-specific
    discussion locations for Standards and Data Acquisition.
- id: chorus_collection_mechanism_enclave
  name: Cloud enclave ingestion and federated access
  mechanism_details:
  - OMOP and telemetry data are held in an enclave; clinical notes remain local except for
    tokens.
  - Dockerized container applications and associated configurations are deployed to support
    CHoRUS services on Azure.
  - Federated access enables sampling methods to ensure a balanced and diverse cohort.
- id: chorus_collection_mechanism_semantic_mapping
  name: Validated semantic mapping of source data
  mechanism_details:
  - The project provides validated semantic mappings for connecting clinical data in various
    source formats to international standards.
  - A chorus-mapping repository holds documentation and pooled tabular mappings, with an associated
    clinical validation SOP for contributing to mapping efforts.
  - Clinical expertise is described as invaluable to semantic mapping and validation within
    CHoRUS.
collection_timeframes:
- id: chorus_collection_timeframe_project_period
  name: Project period and reporting snapshots
  timeframe_details:
  - NIH RePORTER records a project start of 2022-09-01 and a project end of 2026-11-30 for
    project number 1OT2OD032701-01 (fiscal year 2022).
  - Data collection is retrospective.
  - The AIM-AHEAD/Bridge2AI Cohort 2 informational webinar of September 9, 2025 reports dataset
    coverage as of August 2025.
  - The clinical time period covered by the retrospective patient records is not stated in
    the source bundle.
data_collectors:
- id: chorus_collector_data_acquisition_centers
  name: CHoRUS data acquisition centers
  role: Data contributing sites
  collector_details:
  - The collaboration spans 20 academic centers, of which 14 contribute as Data Acquisition
    centers.
  - The project website reports 14 data contributing hospitals and 60+ CHoRUS consortium members
    across 20 different institutions.
  - As of August 2025 the dataset covered 14 different hospitals.
- id: chorus_collector_data_site_managers
  name: Data site managers
  role: Site-level data extraction and submission
  collector_details:
  - Data managers at data contributing sites follow the Chorus_SOP workflow to extract and
    contribute clinical data to CHoRUS.
  - Sites provide regular status updates on their progress in creating and curating a CHoRUS-specific
    clinical data extract, either through the GitHub interface or by submitting a Google Form.
missing_data_documentation:
- id: chorus_missing_data
  name: Known gaps in the released dataset
  missing_data_patterns:
  - Imaging is available for 7,642 admissions within a current released dataset of 50,000
    patient admissions.
  - As of the September 2025 webinar, 1,000 images were available, with de-identification
    in process for a larger cohort.
  - EEG waveform extraction was in process as of the September 2025 webinar.
  - Clinical notes are stored locally at contributing sites; only tokens are centralized.
  - Metadata for clinical notes, imaging, and EEG waveforms is marked as Planned rather than
    available.
  missing_data_causes:
  - 'Staged assembly of the dataset: de-identification, extraction, and metadata publication
    for several modalities were still in progress at the time of the source documents.'
  handling_strategy: The project reports the current released dataset separately from the
    anticipated final dataset and states which modalities are still being processed.
