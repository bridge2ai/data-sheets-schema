distributions:
- id: chorus_collection_demographics
  name: Demographics
  description: Demographic data. Data standard OMOP; access control Controlled; metadata available;
    published metadata schema OMOP schema.
- id: chorus_collection_medication_administration
  name: Medication administration
  description: Medication administration data, with dosing time-stamped upon each infusion
    change or dose administration. Data standard OMOP; access control Controlled; published
    metadata schema OMOP schema.
- id: chorus_collection_procedures
  name: Procedures
  description: Procedure documentation by providers. Data standard OMOP; access control Controlled;
    published metadata schema OMOP schema.
- id: chorus_collection_nursing_flowsheets
  name: Nursing flowsheets
  description: High-frequency nursing flowsheet documentation. Data standard OMOP; access
    control Controlled; published metadata schema OMOP schema, reported with extensions.
- id: chorus_collection_diagnoses
  name: Diagnoses
  description: Diagnosis documentation by providers. Data standard OMOP; access control Controlled;
    published metadata schema OMOP schema.
- id: chorus_collection_clinical_notes
  name: Clinical notes
  description: Clinical notes extracted and tokenized using the OHNLP toolkit. Data standard
    OHNLP; access control Controlled; metadata Planned; published metadata schema OHNLP open
    source schema. Notes are stored locally at contributing sites except for tokens.
- id: chorus_collection_imaging
  name: Imaging
  description: Imaging extracted from PACS. Data standard DICOM; access control Controlled;
    metadata Planned; published metadata schema DICOM schema. As of the September 2025 webinar,
    1,000 images were available with de-identification in process for a larger cohort.
- id: chorus_collection_waveform_telemetry
  name: Waveform telemetry
  description: Waveform telemetry from bedside monitors and gateway/middleware. Data standard
    WFDB; access control Controlled; metadata available; published metadata schema PhysioNet
    schema extended.
- id: chorus_collection_waveform_eeg
  name: Waveform EEG
  description: EEG waveforms from the hospital database. Data standard EDF+ and Persyst; access
    control Controlled; metadata Planned; published metadata schema open source EDF+ and Persyst
    schema. Extraction was reported as in process as of the September 2025 webinar.
purposes:
- id: chorus_purpose_ai_ready_critical_care_dataset
  name: Develop a publicly available, AI-ready critical care dataset
  response: The project's overarching goal is to develop a publicly available, AI-ready critical
    care dataset, while ensuring the methods promote privacy, accountability, and clinical
    benefit, and while promoting a new generation of AI clinicians and scientists.
- id: chorus_purpose_generate_data_for_ml_ai
  name: Generate data for ML/AI applications in acute and critical illness
  response: As part of the NIH Common Fund's Bridge2AI program, the CHoRUS data generation
    project meets the need of generating data for ML/AI applications aimed at characterizing
    acute and critical care illness, predicting complications, and measuring treatment response
    among patients with acute or critical illness.
- id: chorus_purpose_diverse_high_resolution_ethical_dataset
  name: Build a diverse, high-resolution, ethically sourced dataset
  response: The goal of the CHoRUS Network is to develop the most diverse, high-resolution,
    ethically sourced, AI-ready data set to answer the grand challenge of improving recovery
    from acute illness.
- id: chorus_purpose_holdout_test_set
  name: Provision a holdout test set for external validation
  response: The dataset will also provision a holdout test set, accessible for model external
    validation to aid marketplace adoption of AI-developed models for implementation in acute
    and critical care.
- id: chorus_purpose_infrastructure_and_standards
  name: Develop network, tools, standards, data and education for clinical care AI
  response: CHoRUS will develop the necessary network, tools, standards, data, and education
    to build machine-learning and artificial-intelligence-derived models to improve the care
    and outcomes of patients requiring critical care, including unified standards that harmonize
    multi-modal EHR, waveform, imaging, and text data.
tasks:
- id: chorus_task_characterize_illness
  name: Characterize acute and critical care illness
  response: Generating data for ML/AI applications aimed at characterizing acute and critical
    care illness.
- id: chorus_task_predict_complications
  name: Predict complications
  response: Generating data for ML/AI applications aimed at predicting complications among
    patients with acute or critical illness.
- id: chorus_task_measure_treatment_response
  name: Measure treatment response
  response: Generating data for ML/AI applications aimed at measuring treatment response among
    patients with acute or critical illness.
- id: chorus_task_external_model_validation
  name: External validation of AI models
  response: A holdout test set is to be provisioned and made accessible for external validation
    of models, to aid marketplace adoption of AI-developed models for implementation in acute
    and critical care.
- id: chorus_task_label_prediction_targets
  name: Label data with prediction targets
  response: A visualization and annotation environment will label data with targets important
    for prediction.
addressing_gaps:
- id: chorus_gap_ai_infrastructure_critical_care
  name: Lack of infrastructure for AI/ML in critical care
  response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning (AI/ML) in critical care. Developing high-resolution multi-center
    data sets is a critical first step towards actionable and trustworthy AI.
- id: chorus_gap_external_validation
  name: Absence of holdout data for external model validation
  response: The dataset provisions a holdout test set accessible for model external validation,
    addressing the need to validate AI-developed models before marketplace adoption and implementation
    in acute and critical care.
- id: chorus_gap_legal_and_ethical_framework
  name: Absence of a legal and ethical framework for large-scale clinical data sharing
  response: The project establishes a legal framework for collecting data at scale, performs
    community-facing ethics focus groups to determine what data is appropriate for public
    sharing, and analyses the existing legal and regulatory landscape.
- id: chorus_gap_multimodal_standardization
  name: Lack of harmonized standards across clinical data modalities
  response: Unified standards are needed to harmonize multi-modal EHR, waveform, imaging,
    and text data; CHoRUS develops validated semantic mappings and standard operating protocols
    so that contributing sites deliver interoperable datasets.
- id: chorus_gap_ai_workforce
  name: Shortage of AI-literate clinicians and scientists
  response: A comprehensive set of approaches develops the skills and workforce for a next
    generation of diverse academic and community AI scientists, and cultivates expertise in
    the lay and scientific community to improve AI literacy and utilization through multimodal
    educational approaches.
