id: https://doi.org/10.60775/fairhub.3
name: AI-READI
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: 'The AI-READI dataset (Artificial Intelligence Ready and Equitable/Exploratory Atlas for
  Diabetes Insights) is a multimodal, "AI-ready" research dataset collected from adults with and without
  type 2 diabetes mellitus (T2DM) and harmonised across three United States data collection sites: the
  University of Alabama at Birmingham, the University of California San Diego, and the University of Washington.
  AI-READI is one of four Data Generation Projects funded by the NIH Common Fund Bridge2AI program. Its
  stated goal is to enable artificial intelligence and machine learning research into salutogenesis in
  T2DM, that is the pathway from disease back to health, using a cohort deliberately balanced across self-reported
  race/ethnicity, biological sex, and diabetes severity rather than matched to United States population
  demographics. Each participant completes pre-visit questionnaires, a single in-person visit of roughly
  2.5 to 4 hours, and a 10-day at-home monitoring period. Collected domains include surveys and social
  determinants of health, physical measurements and vitals, 12-lead electrocardiography, cognitive screening,
  peripheral neuropathy testing, visual function testing, multi-device retinal imaging (colour fundus
  photography, OCT, OCTA and fluorescence lifetime imaging ophthalmoscopy), blood and urine laboratory
  assays, biospecimen banking, continuous glucose monitoring, wearable physical activity monitoring, and
  home environmental sensing. This record describes version 3.0.0 of the released dataset (DOI 10.60775/fairhub.3),
  published on FAIRhub on 17 November 2025, containing data from 2,280 participants collected between
  19 July 2023 and 1 May 2025 across 356,343 files and approximately 3.82 TB. The released public dataset
  contains no protected health information; information on participant sex, race/ethnicity and medications
  used has also been removed. Earlier releases (v1.0.0, 204 participants, 3 May 2024; v2.0.0, 1,067 participants,
  8 November 2024) remain identified but v2.0.0 is marked on FAIRhub as no longer accessible.'
