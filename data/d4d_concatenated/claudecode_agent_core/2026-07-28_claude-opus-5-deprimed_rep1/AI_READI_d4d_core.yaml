purposes:
- id: d4d:AI_READI_purposes_1
  name: Enable AI/ML research into type 2 diabetes and salutogenesis
  response: The purpose for creating the dataset was to enable future generations of artificial intelligence/machine
    learning (AI/ML) research to provide critical insights into type 2 diabetes mellitus (T2DM), including
    salutogenic pathways to return to health. T2DM is a growing public health threat. Yet, the current
    understanding of T2DM, especially in the context of salutogenesis, is limited. Given the complexity
    of T2DM, AI-based approaches may help with improving our understanding but a key issue is the lack
    of data ready for training AI models. The AI-READI dataset is intended to fill this gap.
  description: The long-term objective is a foundational T2DM dataset that is agnostic to existing classification
    criteria or biases and can be used to reconstruct a temporal atlas of T2DM development and reversal
    towards health.
- id: d4d:AI_READI_purposes_2
  name: Provide a blueprint and standards for future AI-ready data generation projects
  response: An additional aim of the AI-READI project is to share its blueprint for collecting and sharing
    AI-ready datasets so that future Data Generation Projects can follow it, including guidelines for
    project management as well as data collection, management and sharing.
  description: AI-READI places special emphasis on establishing standards, best practices and guidelines
    for the collection, preparation and sharing of data for AI/ML, including guidance from bioethicists
    and adherence to the FAIR (Findable, Accessible, Interoperable, Reusable) principles. The project
    develops new standards such as the Clinical Dataset Structure (CDS) and works with maintainers of
    existing standards to extend them where necessary.
- id: d4d:AI_READI_purposes_3
  name: Train a diverse AI and biomedical research workforce
  response: AI-READI hosts a year-long research internship programme to provide immersive training for
    individuals interested in working at the nexus of biomedicine and AI, comprising a two-week data science
    and programming bootcamp followed by a yearlong curriculum of didactic lectures and mentored research.
  description: The inaugural cohort in academic year 2023-2024 consisted of 10 interns, of whom 70% were
    women, 30% were Black, and 50% overall were from under-represented backgrounds based on NIH criteria.
    Interns contributed to developing healthsheets describing the AI-READI data, mapping project data
    into common data models, and analysing equity and ethical issues.
tasks:
- id: d4d:AI_READI_tasks_1
  name: Pseudotime manifold analysis of disease trajectories
  response: Data collection was specifically designed to permit downstream pseudotime manifold analysis,
    an approach used to predict disease trajectories by collecting and learning from complex, multimodal
    data from participants with differing disease severity (normal to insulin-dependent T2DM).
  description: The approach relies on dimensionality reduction, is agnostic to existing classification
    criteria or biases, and is intended to reconstruct a temporal atlas of pathogenesis and healing.
- id: d4d:AI_READI_tasks_2
  name: General multimodal AI/ML model development
  response: The multi-modal dataset being collected is being gathered to facilitate downstream pseudotime
    manifolds and various applications in artificial intelligence.
  description: The dataset is hypothesis agnostic; the protocol was designed by a multidisciplinary team
    to be agnostic to hypotheses, assembling assessments from many health domains likely to be impacted
    by T2DM rather than targeting a single predefined prediction task.
addressing_gaps:
- id: d4d:AI_READI_addressing_gaps_1
  name: Absence of large, well-designed, AI-ready multimodal T2DM datasets
  response: The ability to understand and affect the course of complex, multi-organ diseases such as T2DM
    has been limited by a lack of well-designed, high quality, large, and inclusive multimodal datasets.
    A major barrier to AI in this area has been the lack of diverse datasets that are AI ready for training
    AI models, which the AI-READI project is designed to address.
  description: The targeted sample size of 4,000 persons is described as the largest publicly accessible
    dataset currently available containing many multidomain variables relevant to T2DM.
- id: d4d:AI_READI_addressing_gaps_2
  name: Lack of racial and ethnic diversity in prior T2DM research
  response: A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that samples
    lacked racial and ethnic diversity, making AI-READI an important step forward in addressing these
    demographic inequities in research.
  description: The cohort is deliberately balanced across four self-reported race/ethnicity groups (Asian,
    Black, Hispanic, White), four T2DM severity categories, and biological sex, in order to support the
    development of unbiased machine learning models.
- id: d4d:AI_READI_addressing_gaps_3
  name: Data that are not immediately usable for AI without reformatting
  response: All data are stored and shared using FAIRhub as "AI-ready", which enables immediate AI/ML
    research without reformatting and preprocessing.
  description: Data are mapped to applicable standard formats (OMOP Common Data Model for clinical data,
    DICOM for retinal imaging, WFDB for ECG, Open mHealth for wearables) and organised following the Clinical
    Dataset Structure specification.
