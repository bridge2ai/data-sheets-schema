description: >-
  The Bridge2AI-Voice adult flagship dataset is an ethically sourced, demographically
  diverse collection of voice, speech, breathing and cough data linked to health
  information, generated by the Bridge2AI-Voice consortium under the NIH Common Fund
  Bridge2AI program. Version 3.1.0 contains data for 833 adult participants recruited
  across five sites in North America (United States and Canada). Participants were
  enrolled from disease cohorts in which voice change has been associated with disease —
  voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders, and respiratory disorders — together with control participants; a fifth
  cohort, pediatric voice and speech disorders, is released as a separate dataset.
  The public release contains data considered low risk: features derived from the
  recordings rather than the original waveforms. These include spectrograms, mel
  spectrograms, mel-frequency cepstral coefficients, pitch contours, articulatory
  kinematics and source features from Speech Articulatory Coding, phonetic
  posteriorgrams, and per-recording static acoustic features from openSMILE, Praat via
  parselmouth, and torchaudio, together with audio quality metrics and per-recording
  metadata. Accompanying phenotype tables cover enrollment, demographics, acoustic
  confounders, cohort-specific clinical diagnosis forms validated against gold standards,
  validated questionnaires (including VHI-10, PHQ-9, GAD-7, PANAS, a custom affect scale,
  DSM-5 Adult, PTSD Adult, ADHD Adult, the Dyspnea Index and the Leicester Cough
  Questionnaire), and acoustic task records. Data were collected in clinic by trained
  research staff using a custom iPad application, with a head-mounted microphone where
  tolerated, and exported from REDCap. Raw audio is withheld from this release and
  disseminated only under a controlled access mechanism. The project is co-led by Yael
  Bensoussan (University of South Florida) and Olivier Elemento (Weill Cornell Medicine),
  with lead investigators at ten further North American institutions and more than fifty
  additional investigators, clinicians, scholars and trainees contributing; the consortium
  anticipates an eventual enrollment of 10,000 participants by 2027.

notes: >-
  The consortium publishes a self-assessment of the dataset against the AI-readiness
  criteria in "AI-readiness for Biomedical Data: Bridge2AI Recommendations", scoring
  FAIRness 100%, Provenance 100%, Characterization 80% (data quality criterion not met),
  Pre-model explainability 100%, Ethics 100%, Sustainability 50% (domain-appropriate and
  associated criteria not met), and Computability 75% (contextualized criterion not met).

source_caveats: >-
  Record counts differ between sources. The project documentation states that version 3.0
  contains approximately 61,937 voice-derived recordings from 833 adult participants,
  while the PhysioNet release notes give per-feature record counts for version 3.1.0
  (29,278 spectrograms, mel spectrograms and MFCCs; 32,522 pitch series; 23,533 recordings
  in the pediatric dataset). The PhysioNet figures are preferred as the higher-ranked
  source and because they are stated per feature type rather than as an aggregate.
  Hosting platform also differs: the project documentation describes distribution through
  the Health Data Nexus platform maintained by T-CAIREM at the University of Toronto, with
  a DOI issued there, whereas PhysioNet versions 1.1 through 3.1.0 are hosted by the MIT
  Laboratory for Computational Physiology; PhysioNet is preferred as the higher-ranked and
  current source, and the Health Data Nexus release is recorded as a prior version.
  Award identifiers are rendered inconsistently: NIH RePORTER gives project number
  3OT2OD032720-01S3 against core project OT2OD032720; the PhysioNet acknowledgement gives
  3OT2OD032720-01S1; the documentation site footer gives "3Tf-OTOD03272001S2" and elsewhere
  "3TF-OT2ActfOD032720Projectf01S1". All refer to core project OT2OD032720.
  One investigator's surname is given as "Siu" in the PhysioNet author lists and as "Sui"
  in the project documentation; the PhysioNet spelling is preferred.
  The study metadata section of the project documentation describes version 2.0.0 of the
  dataset (including its statement that the dataset contains only adult populations and
  the "current v.2.0.0" study population note), so some of its figures predate the
  version described here.

purposes:
  - response: >-
      To generate a large-scale, multi-institutional, ethically sourced and demographically
      diverse database of human voice, speech, cough and respiratory sounds linked to
      multimodal health biomarkers, in order to fuel voice AI research.
  - response: >-
      To support the integration of voice as a biomarker of health into clinical care by
      enabling predictive models that assist in the screening, diagnosis, monitoring and
      treatment of a broad range of diseases.
  - response: >-
      To enable the development, benchmarking and validation of clinically applicable
      machine-learning models for diagnosing health conditions from voice, including vocal
      pathologies and neurological, psychiatric, respiratory and pediatric voice disorders.
  - response: >-
      To introduce and support the field of audiomics by establishing bioinformatics
      standards for acoustic and voice data collection and analysis, and by building
      infrastructure for audiomic data storage and sharing within and across research
      institutions.

addressing_gaps:
  - response: >-
      Existing work on machine-learning voice diagnosis has been conducted on small- to
      medium-sized datasets; a review of machine-learning applications in laryngeal cancer
      screening and diagnosis found that most studies reported training datasets of fewer
      than 300 patients. Sample sizes have been too small, or the datasets lacked the key
      metadata needed to train robust, clinically useful models.
  - response: >-
      Comparing studies and pooling data is challenging because of a lack of existing
      standards in how voice and other acoustic data are measured and collected. This
      dataset is collected under standardized, evidence-based recording protocols.
  - response: >-
      Most prior datasets contain acoustic measures alone and are not linked to multimodal
      health data; only two studies in one review used more than one data modality to train
      their models. This dataset links acoustic data to demographics, clinical diagnosis,
      confounders and validated questionnaires.
  - response: >-
      Industry holds vast amounts of voice data but lacks accurate clinical or demographic
      annotation, and industry datasets are typically private, which prevents auditing of
      models and of the accuracy of training labels and prevents verification of fair
      representation of diverse populations.
  - response: >-
      Pediatric voice and speech data are especially scarce because of ethical concerns and
      challenges in data acquisition for that cohort, and normative adult evidence cannot be
      generalized to children whose respiratory system and larynx are still maturing.

tasks:
  - response: >-
      Disease detection and classification from voice, speech and respiratory sounds, using
      diagnostic labels spanning vocal pathologies, neurological and neurodegenerative
      disorders, psychiatric conditions and respiratory disorders.
  - response: >-
      Development, benchmarking and validation of clinically applicable machine-learning
      models, including pretraining and fine-tuning of models on derived acoustic features.
  - response: >-
      Cohort selection and phenotype-linked analysis, supported by the questionnaire and
      diagnosis tables distributed in the phenotype folder.

instances:
  - instance_type: Adult human research participant
    counts: 833
    data_topic: B2AI_TOPIC:36
    data_substrate: B2AI_SUBSTRATE:41
    label: true
    label_description: >-
      Each participant carries diagnostic labels resulting from a clinical assessment. At
      each site a local clinician provided the diagnosis based on a clinical interview and
      appropriate work-up; for the psychiatric disorders cohort the assessment was
      determined from the participant's electronic health record or an active prescription,
      outside of data collection, by an appropriately licensed clinician.
    notes: >-
      Participants may have more than one session, so phenotype and task tables can contain
      more than one row per participant, and responses to the same data element need not
      agree across sessions.
  - instance_type: Audio recording of a single acoustic task, represented by derived features
    data_topic: B2AI_TOPIC:36
    data_substrate: B2AI_SUBSTRATE:30
    label: true
    label_description: >-
      Each recording is identified by participant, session and task name, and inherits the
      participant's diagnostic labels.
    notes: >-
      The number of recordings differs by feature type in version 3.1.0 because some files
      could not generate certain features and because dense features derived from free
      speech and audio checks were withheld: 29,278 spectrogram, mel spectrogram and MFCC
      records; 32,522 torchaudio pitch records; 31,855 loudness records; 31,872 periodicity
      and sparc pitch records; 28,640 articulatory (EMA) records; 29,289 phonetic
      posteriorgram records.

subsets:
  - id: doi:10.13026/8xbn-nq66#voice-disorders-cohort
    name: Voice disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants recruited on the basis of a laryngeal or voice diagnosis: laryngeal
      cancer, laryngitis, pre-cancerous lesions, benign lesions of the vocal cord, muscle
      tension dysphonia, spasmodic dysphonia and laryngeal dystonia or tremor, unilateral
      vocal fold paralysis, and glottic insufficiency or presbyphonia. Gold-standard
      validation for this cohort is by laryngoscopy images and stroboscopy videos, with CT
      and spirometry additionally used for unilateral vocal fold paralysis.
  - id: doi:10.13026/8xbn-nq66#respiratory-cohort
    name: Respiratory disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with airway stenosis (including bilateral vocal fold paralysis and
      supraglottic, glottic, posterior glottic, subglottic, tracheal and multi-level upper
      airway stenosis), unexplained chronic cough of more than eight weeks' duration, and
      COPD or asthma. Gold-standard validation is by spirometry and flow volume loops and by
      CT of the neck and chest.
  - id: doi:10.13026/8xbn-nq66#neurological-cohort
    name: Neurological and neurodegenerative disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants aged over 44 and under 85 with a clinical diagnosis of mild cognitive
      impairment, Alzheimer's disease, other dementias, amyotrophic lateral sclerosis, or
      Parkinson's disease and related parkinsonian syndromes. Gold-standard validation is by
      brain CT, brain MRI, whole genome sequencing and, for Alzheimer's disease, serum
      phosphorylated tau markers.
  - id: doi:10.13026/8xbn-nq66#mood-psychiatric-cohort
    name: Mood and psychiatric disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with an existing clinical diagnosis of depression or major depressive
      disorder, anxiety disorder, or bipolar disorder, and participants with comorbid
      conditions including alcohol or substance use disorder, ADHD, autism spectrum
      disorder, borderline personality disorder, eating disorder, insomnia or sleep
      disorder, obsessive-compulsive disorder, panic disorder, PTSD, schizophrenia and
      social anxiety disorder. Validation is by electronic health summary, clinical
      diagnosis from a psychiatrist, or medication history.
  - id: doi:10.13026/8xbn-nq66#controls
    name: Control participants
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants not diagnosed with or treated for a voice, respiratory, pediatric, mood
      or neurological disorder affecting voice, cough, breath or speech, recruited to serve
      as controls in the database.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Age is collected in the demographics instrument; adult eligibility runs from 18 to 120
      years, and the neurological cohort is restricted to participants over 44 and under 85.
  - subpopulation_elements_present: true
    identification: >-
      Sex and gender are collected as separate elements in the demographics instrument;
      eligibility is open to all sexes and enrollment is not gender based.
  - subpopulation_elements_present: true
    identification: >-
      Race and ethnicity are collected in the demographics instrument and are flagged as
      sensitive data elements.
  - subpopulation_elements_present: true
    identification: >-
      Socioeconomic status is collected because it may affect voice and speech; related
      elements such as household income were judged highly sensitive and were removed
      before release.

splits:
  - split_details: >-
      The dataset does not define recommended training, validation or test partitions.
      Researchers are encouraged to create their own data splits based on their specific
      requirements, and are advised to consider the multivariate distribution across
      disorder category, site and demographic factors when doing so.

relationships:
  - relationship_details: >-
      Recordings are linked to the participant and the session in which they were collected
      through the participant_id and session_id fields carried by every feature record and
      by the task tables, so a participant with repeated visits has multiple sessions and
      multiple recordings.
  - relationship_details: >-
      No relationships are asserted between individual participants; the project
      documentation states that instances are unrelated to one another.

anomalies:
  - anomaly_details: >-
      Different sites used different collection configurations, and the collection protocol
      changed over the course of the study.
  - anomaly_details: >-
      Transcriptions and certain other derived features were generated using off-the-shelf
      models that have not been audited for correctness.
  - anomaly_details: >-
      Some recordings could not generate certain features, whether because of their length
      or for other reasons, and are therefore absent from the corresponding feature files.
  - anomaly_details: >-
      Version 3.0.0 shipped broken Parquet files, which were fixed in version 3.1.0.
  - anomaly_details: >-
      Confounding factors present in the data include noise artifacts, variation in
      diagnostic practices between sites and over time, inaccurate questionnaire responses,
      and underreporting.
  - anomaly_details: >-
      Recordings were made with a head-mounted headset and microphone that could sit at
      slightly different distances from the speaker, introducing variation in the recorded
      signal.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a non-probability sample collected at a limited number of geographic
      locations and is not representative of a larger population.
    recommended_mitigation: >-
      The consortium intends to improve representativeness by shifting to remote collection
      and by designing recruitment to control for more variables.
    scope_impact: >-
      Models trained on this data may not generalize to populations or settings unlike the
      five contributing sites.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Data collection and participant communication were conducted in English only;
      participants who did not read or speak English were excluded. Spanish versions of the
      protocol are under development but are not represented in this release.
    scope_impact: >-
      The dataset does not support work on languages other than English.
  - limitation_type: scope_limitation
    limitation_description: >-
      The public release contains features derived from the audio rather than the raw
      waveforms; spectrograms, mel spectrograms, MFCCs, phonetic posteriorgrams and
      articulatory features derived from free speech tasks and audio checks are withheld
      entirely.
    recommended_mitigation: >-
      Researchers requiring raw audio or the withheld dense features may apply for
      controlled access through the Data Access Compliance Office.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The public data releases do not contain an equal distribution of the five disease
      categories, and the dataset is skewed by disorder category, site and demographic
      factors.
    recommended_mitigation: >-
      Users should assess the multivariate distribution before judging fitness for a given
      question.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Each diagnostic label was assigned by a single labeler, so no inter-annotator
      agreement can be computed, and human-level performance in the applications the dataset
      addresses varies widely.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The study design is cross-sectional, and changes in diagnostic criteria or clinical
      practice over the collection period are a potential source of distribution shift.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Imaging, genomic and other external multimodal data described in the collection
      protocol are extracted at contributing sites but are not included in this release.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants were recruited from high-volume expert clinics and academic specialty
      clinics. Groups that have less trust in the medical system or in AI, or that are less
      proximal to the collection sites, would have been less likely to be recruited.
    mitigation_strategy: >-
      Planned expansion to community outreach clinics serving underserved populations, a
      Plan for Enhancing Diverse Perspectives, and a move toward remote collection.
  - bias_type: sampling_bias
    bias_description: >-
      The sampling method is a non-probability sample drawn from patients presenting at
      participating clinics, not a random or representative sample of any wider population.
  - bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders depending on site, so cohort
      membership is confounded with both recording site and recording device; distinct iPad
      devices were used at each site.
    affected_subsets:
    - >-
      All disease cohorts, since each was recruited predominantly at particular sites.
  - bias_type: representation_bias
    bias_description: >-
      Coverage is limited to five North American sites and to fluent English speakers, so
      linguistic, geographic and demographic diversity is constrained.

content_warnings:
  - content_warnings_present: true
    warnings:
      - >-
        Free speech tasks may contain material that a user finds offensive or distressing;
        participants are responsible for their own choice of language, so such content
        cannot be completely excluded even though its presence is considered unlikely.
      - >-
        Questionnaire content covers mental health, traumatic experience and psychiatric
        symptoms, including PTSD, DSM-5 Adult, PHQ-9 and GAD-7 instruments.
    notes: >-
      In version 3.0.0 and later, transcriptions and dense features derived from
      open-response and free speech prompts were removed from the feature-only release, and
      raw audio transcripts were reviewed so that recordings containing potentially
      identifying information or external voices were withheld.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes race and ethnicity information describing racial or ethnic
      origins.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes sexual orientation information.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes socioeconomic and health data, including clinical diagnoses and
      responses to mental health instruments.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Voice itself is a biometric identifier; all raw voice data was removed from the
      registered-access release because it has the potential to cause individual
      re-identification or to be used for illicit or unauthorized purposes. Fields encoded
      as sensitive in the REDCap data dictionary were removed from the release.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The project documentation states that the released dataset does not contain data
      protected by legal privilege, by doctor-patient confidentiality, or the content of
      non-public communications; material posing such risk was removed before release and
      is held under controlled access.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor identifier removal, supplemented by removal of indirect identifiers
    and of non-identifying elements judged highly sensitive, and by withholding of all raw
    audio.
  deidentification_details: >-
    Direct identifiers including name, civic address and social security numbers were
    removed. Indirect identifiers were removed where their combination with public data on
    social media, in government registries or elsewhere created a significant
    re-identification risk; these include select geographic and demographic identifiers and
    some information about household composition or cultural identity. State and province
    were removed while the country of data collection was retained, and dates are not
    released at a resolution finer than years. Non-identifying elements revealing highly
    sensitive information, such as household income, mental health status and traumatic life
    experiences, were also removed. Narrative text fields were removed, and transcripts of
    free speech audio are withheld. Raw audio transcripts were reviewed and recordings
    containing potentially identifying information or external voices were removed from the
    release. The dataset does not achieve k-anonymization at k greater than or equal to two.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: >-
    University of South Florida Institutional Review Board, acting as single IRB for United
    States sites, with subsite IRBs relying on it through the single IRB process. Canadian
    institutions (Mount Sinai Hospital, the Hospital for Sick Children and the University of
    Toronto) obtained separate Research Ethics Board approval in accordance with Canadian
    regulations.
  irb_approval:
  - >-
    Data collection and sharing for the Bridge2AI Voice Data Acquisition protocol were
    approved by the University of South Florida Institutional Review Board; the protocol was
    submitted and approved by the USF single IRB and by subsite IRBs through the single IRB
    process. A partial HIPAA waiver was granted for screening of incoming clinic patients
    prior to consent.
  regulatory_compliance:
  - >-
    HIPAA de-identification rules were applied; the data are covered by a Certificate of
    Confidentiality, which must be asserted against compulsory legal demands such as court
    orders and subpoenas for identifying information. No data monitoring committee was
    appointed, the study is not for a drug product, and it is not for a medical device.
  special_populations:
  - >-
    Pediatric participants are enrolled only at pediatric sites, with parental permission
    from one or both parents and, where age and development allow, documented verbal assent;
    those data are released as a separate pediatric dataset.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Adult eligibility is restricted to participants aged 18 and over. The protocol states
    that pediatric patients are enrolled only through pediatric sites and not at the
    coordinating institution, with a children's vulnerable-population checklist completed
    for that arm.
  source_caveats: >-
    The IRB protocol's vulnerable populations section addresses only children. It does not
    classify the enrolled adult cohorts with mild cognitive impairment, dementia or
    psychiatric diagnoses as at-risk populations, and no special safeguards for those groups
    are described in the sources.

ethical_reviews:
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Reviewed and approved the Bridge2AI Voice Data Acquisition protocol under a single IRB
      process covering United States participating institutions. The studies involving humans
      were conducted in accordance with local legislation and institutional requirements, and
      participants provided written informed consent.
  - reviewing_organization: >-
      Research Ethics Boards of Mount Sinai Hospital, the Hospital for Sick Children and the
      University of Toronto
    review_details: >-
      Canadian institutions do not participate in the United States single IRB process and
      applied separately to their own Research Ethics Boards; genomic data collection and
      analysis, conducted only at the University of Toronto and Mount Sinai Hospital, was
      covered by a separate protocol and approval. The pediatric dataset was approved by the
      Research Ethics Board at the Hospital for Sick Children.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Prospective informed consent, obtained on paper, electronically through REDCap survey
      forms or within the application, or by video recording within the application; for
      longitudinal at-home collection, electronic consent is administered before each
      subsequent data collection to confirm ongoing consent.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap; electronic
      consent is housed in REDCap and is HIPAA compliant. All paper and electronic versions
      are stored for a minimum of five years after study completion. Video consent, in which
      the participant reads a statement aloud, is used to verify that submitted acoustic data
      belongs to the consented individual and to distinguish participants from bots.
    consent_scope: >-
      Consent covers the study procedures, the collection and use of voice and linked
      clinical data, and the sharing of de-identified data with external researchers through
      a secure database, in registered access for low-risk data and through a controlled
      access mechanism for data that would pose a heightened re-identification risk.
    withdrawal_mechanism: >-
      Participants may withdraw at any point. Withdrawal during or before voice data
      collection means the data are not included in the database; once the voice data
      collection process is completed, research data including voice recordings cannot be
      removed from the database. Withdrawing participants may optionally complete a
      satisfaction survey about their reasons for withdrawal.

collection_consents:
  - consent_details: >-
      All participants were duly informed and agreed to the collection and use of their data
      via prospective informed consent. Consent was sought from patients found eligible for
      enrollment before any data collection, covering both the collection initiative and the
      sharing of the acquired research data. Participants were explicitly informed about the
      data being collected, the methods used to secure it, and the uses to which it would be
      put.

collection_notifications:
  - notification_details: >-
      Individuals were notified of the collection through an IRB-approved consent process
      conducted by research staff, in most cases in a clinic setting and in some cases
      remotely through REDCap survey forms or within the application. Approximately thirty
      minutes are allotted to explain the study and consent in detail, and potential
      participants are asked to explain back what they understood to confirm comprehension.
      Recruitment materials include clinic flyers with QR codes, social media posts, the
      project websites and an online trial-listing platform.

consent_revocations:
  - revocation_details: >-
      Consenting participants are informed that they may withdraw from the study at any
      point. If a participant chooses to withdraw during or before the voice data collection,
      their data will not be included in the database. Participants are informed that
      research data, including voice recordings, cannot be removed from the database once the
      voice data collection process is completed.

data_protection_impacts:
  - impact_details: >-
      A team of ethicists reviewed the data elements and identified the fields to be withheld
      on re-identification and sensitivity grounds, and the consortium published a memorandum
      setting out the ethical justification for restricting raw voice samples to controlled
      access. The resulting governance structure separates a registered-access
      features-only release from a controlled-access raw audio release reviewed by the Data
      Access Compliance Office.
    source_caveats: >-
      Asked directly whether an analysis of the potential impact of the dataset and its use
      on data subjects had been conducted, the project documentation answers "No"; the review
      recorded here is the risk assessment described elsewhere in the same documentation
      rather than a formal data protection impact assessment.

participant_privacy:
  - anonymization_method: >-
      Removal of HIPAA Safe Harbor identifiers, removal of indirect identifiers whose
      combination with public data would create significant re-identification risk, removal
      of highly sensitive non-identifying elements, and extraction of features from the raw
      audio so that only derived representations are released.
    privacy_techniques:
      - Withholding of all raw audio waveforms from the registered-access release
      - Removal of transcripts of free speech audio and of dense features derived from free speech prompts
      - Review of raw audio transcripts to exclude recordings containing identifying information or external voices
      - Date shifting so that no date is released at a resolution finer than years
      - Removal of state and province while retaining country of collection
      - Storage of identifiable data only within the collecting institution's HIPAA-protected REDCap databases
      - Use of federated learning so that models can be trained across institutions without data leaving them
    reidentification_risk: >-
      Voice is unique to the individual and cannot be fully de-identified, so a listener could
      in principle recognize a participant. The dataset does not achieve k-anonymization at k
      greater than or equal to two. Users are contractually prohibited from attempting
      re-identification.
    data_linkage: >-
      Each institution retains its own identifiable data and the sheets linking participant
      numbers to participant information in password-protected institutional REDCap
      databases; released records carry only study-specific participant and session
      identifiers. Participants also consented to investigator access to their medical
      information through EHR platforms for gold-standard validation of diagnoses.

collection_timeframes:
  - timeframe_details: >-
      The project documentation states that the data were collected over a period of twelve
      months. Collection is organized in four phases — exploratory, pilot, expansion and
      outreach — with the exploratory phase completed in November 2023 and the pilot phase
      begun that month and ongoing in November 2024.
    source_caveats: >-
      No explicit calendar start and end dates are given for the released dataset. The
      supporting NIH award runs from 2022-09-01 to 2026-11-30, and the separate app
      feasibility study ran from 2023-06-05 to 2023-07-28; neither delimits this collection.

data_collectors:
  - role: Research staff
    collector_details: >-
      Research teams, which may include medical, graduate or undergraduate students,
      coordinated with clinicians to identify appropriate participants, obtained consent,
      introduced the application to participants on a study iPad, and supervised the
      recording session.
  - role: Clinicians
    collector_details: >-
      Clinicians and physicians at each site identified eligible patients and provided the
      gold-standard diagnostic assessment. They were listed under the IRB as co-investigators
      and were added to the consortium so that their names appear on consortium-level
      publications arising from the research; they were not otherwise separately compensated.
  - role: Hospital staff
    collector_details: >-
      Hospital staff were not involved in scheduling but assisted in the logistics of
      coordinating data collection.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from the individuals in question rather than obtained via
      third parties, in clinic and with the assistance of a trained research assistant.
      Clinical validation drew additionally on the participant's own electronic health record
      with their consent.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Acoustic data were directly observed by recording the participant performing structured
      tasks. Demographics, confounders and questionnaire responses were reported by the
      subjects themselves. Clinical diagnoses were verified by clinicians reviewing audio or
      imaging data, consulting electronic health records, or examining medication
      prescriptions, against the gold standards defined for each cohort.
  - was_inferred_derived: true
    acquisition_details: >-
      The released feature records are derived from the raw waveforms by signal processing and
      by pretrained models, rather than being observed or reported directly.

collection_mechanisms:
  - mechanism_details: >-
      A custom smartphone and tablet application, the Bridge2AI-Voice app, hosts the data
      acquisition protocols and collects demographic information, validated questionnaires and
      patient-reported outcomes, and the acoustic tasks. Twenty-two acoustic tasks are
      recorded through the app. The app is linked to electronic health records and sends data
      over a secure HTTPS protocol to a HIPAA-compliant storage server operated by an NIH
      STRIDES partner.
  - mechanism_details: >-
      Recording hardware consists of iPads (9th or 10th generation) and iPad Air (5th
      generation) with an Avid AE-36 microphone connected through an Apple dongle;
      participants wear a head-mounted headset with microphone where they tolerate it, as
      specified by the Bridge2AI-Voice suggested standards.
  - mechanism_details: >-
      REDCap holds the case report forms, eligibility and enrollment records, clinical
      validation and multimodal data, and is the source from which the phenotype tables were
      exported and converted.
  - mechanism_details: >-
      Bridge2AI Voice Web and iOS applications support remote enrollment and remote data
      collection on a participant's own computer, tablet or phone, with no software
      downloaded or installed and no login required; data are removed from the client as soon
      as the page is closed.
    source_caveats: >-
      Remote collection is provided for in the protocol, but the project documentation states
      that remote data collection did not occur for the initial dataset release.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      Patients and healthy volunteers presenting at high-volume expert clinics and specialty
      clinics within participating academic institutions in the United States and Canada.
    strategies:
      - Non-probability sampling
      - Purposive recruitment by diagnosis against per-cohort inclusion and exclusion criteria
      - Screening of clinic patient lists in the electronic health record ahead of the clinic day, under a partial HIPAA waiver
      - Recruitment of controls from participants without any of the studied conditions
      - Targeted medical record review to identify participants where specific diagnoses or severities are under-represented
    why_not_representative: >-
      The data are not representative because they were collected at a limited number of
      geographic locations.
    representative_verification:
    - >-
      No verification of representativeness against a wider population was performed.

raw_data_sources:
  - source_description: >-
      Raw audio waveforms of voice, speech, breathing and cough tasks captured with the
      Bridge2AI-Voice application on a study iPad.
    source_type: Primary prospective collection from human participants
    raw_data_format: >-
      WAV audio files organized according to the Brain Imaging Data Structure v1.9.0, with
      accompanying JSON sidecars.
    access_details: >-
      Retained by the consortium but not publicly accessible. Raw audio is disseminated only
      under controlled access, requiring a Data Access Request Form, a Data Use Agreement,
      review by the Data Access Compliance Office and an institutionally signed Data Use and
      Transfer Agreement; approved users receive the data through Synapse at
      https://www.synapse.org/Synapse:syn72370534/.
  - source_description: >-
      Questionnaire, demographic, confounder, eligibility, enrollment and clinical diagnosis
      responses recorded during the session.
    source_type: Structured electronic data capture
    raw_data_format: >-
      REDCap instrument records, exported and converted to tab-delimited tables with JSON
      data dictionaries.
    access_details: >-
      Released in de-identified form in the phenotype folder of the registered-access
      dataset; the supporting REDCap data dictionary, metadata and instrument PDFs are openly
      available at https://github.com/eipm/bridge2ai-redcap.

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was converted to monaural and resampled to 16 kHz with a Butterworth
      anti-aliasing filter applied, producing the standardized audio from which all features
      were derived.
  - preprocessing_details: >-
      Spectrograms were computed with the short-time Fast Fourier Transform using a 25 ms
      window, a 10 ms hop length and a 400-point FFT, giving 201 frequency bins, and were
      further downsampled by a factor of two in the time domain after derivation.
  - preprocessing_details: >-
      Sixty mel-frequency cepstral coefficients and sixty-bin mel spectrograms were computed
      with the same window, hop and FFT parameters as the spectrograms.
  - preprocessing_details: >-
      Pitch was tracked with torchaudio over a range of 80 to 500 Hz.
  - preprocessing_details: >-
      Articulatory features were generated with the Speech Articulatory Coding (sparc)
      package at 50 Hz: kinematic traces giving X and Y positions of six articulators
      (tongue dorsum, tongue body, tongue tip, lower incisor, upper lip, lower lip), together
      with loudness from the average absolute amplitude over 20 ms windows, periodicity, and
      fundamental frequency over 50 to 550 Hz.
  - preprocessing_details: >-
      Phonetic posteriorgrams giving a time-varying categorical distribution over forty
      phoneme categories were generated at 100 Hz with the ppgs package.
  - preprocessing_details: >-
      Per-recording static acoustic features were extracted with openSMILE, capturing temporal
      dynamics and acoustic characteristics, and phonetic and prosodic measures of fundamental
      frequency, formants and voice quality were computed with Praat through parselmouth.
  - preprocessing_details: >-
      Transcriptions were generated using OpenAI's Whisper Large model; transcriptions from
      open-response prompts are withheld from the release.
  - preprocessing_details: >-
      Raw audio files and questionnaire data retrieved from ReproSchema-UI or exported from
      REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0, and
      then merged into the phenotype tables. All processing was performed with the b2aiprep
      and senselab toolkits; version 3.1.0 was generated with b2aiprep v3.0.0.
  - preprocessing_details: >-
      Waveform-derived features are stored in two formats: a fixed feature format holding
      static features extracted from the entire waveform, and a temporal format whose length
      varies with the duration of each recording.

cleaning_strategies:
  - cleaning_details: >-
      No pre-processing was performed for the purpose of cleaning the data; the project
      documentation answers "No" to that question, and no instances were excluded at the time
      of preprocessing.
  - cleaning_details: >-
      A defined audit protocol is applied instead: generating missingness tables, checking
      distributions and outliers, checking categorical responses against the schema, and
      running quality-control metrics on audio tasks, including the amount of silence and the
      duration of each waveform and, for speech tasks, comparison of the produced speech
      against the intended passage. Version 3.1.0 releases the resulting audio quality metrics
      alongside the features.

labeling_strategies:
  - annotations_per_item: 1
    labeling_details: >-
      Each participant carries a gold-standard diagnostic label available in the data. At each
      site a local clinician provided the diagnosis based on a clinical interview and
      appropriate work-up. For the psychiatric disorders cohort the assessment was determined
      from the participant's electronic health record or an active prescription, outside of
      data collection, by an appropriately licensed clinician.
    annotator_demographics:
    - >-
      Typically the clinician at the site of data collection, or a clinician external to it
      who had made the prior diagnostic assessment. No further demographic characterization of
      labelers is provided.
    data_annotation_protocol: >-
      Labeling followed the Bridge2AI protocols and ICD-10 codes, with cohort-specific
      gold-standard validation methods: laryngoscopy images and stroboscopy videos for voice
      disorders; spirometry, flow volume loops and CT for airway stenosis and chronic cough;
      brain CT, brain MRI, whole genome sequencing and serum phosphorylated tau markers for
      the neurological cohort; and electronic health summary, psychiatrist diagnosis or
      medication history for the psychiatric cohort.
    data_annotation_platform: >-
      Clinical validation and diagnosis instruments were captured in REDCap, from which the
      diagnosis tables were exported.
    inter_annotator_agreement: >-
      Not computed; a single labeler provided the label for each instance.
    notes: >-
      The consortium recommends that any new labels or task definitions produced by users be
      described alongside the release of a model or publication, including the exact variables
      used for the determination.

machine_annotation_tools:
  - tools:
      - OpenAI Whisper Large
      - openSMILE
      - Praat, accessed through parselmouth
      - torchaudio
      - Speech Articulatory Coding (sparc)
      - ppgs
      - b2aiprep
      - senselab
    tool_descriptions:
      - Whisper Large generated transcriptions of the recordings
      - openSMILE extracted acoustic features capturing temporal dynamics and acoustic characteristics
      - Praat and parselmouth computed phonetic and prosodic features including fundamental frequency, formants and voice quality
      - torchaudio produced spectrograms, mel spectrograms, MFCCs and pitch contours
      - sparc produced electromagnetic articulography estimates together with loudness, periodicity and pitch
      - ppgs produced phonetic posteriorgrams over forty phoneme categories
      - b2aiprep organized and preprocessed the dataset and merged the source data into the phenotype files
      - senselab processed audio files for research tasks
    tool_accuracy:
    - >-
      Not established. Certain aspects of the data, such as transcription, were generated
      using off-the-shelf models that have not been audited for correctness.

missing_data_documentation:
  - missing_data_causes: >-
      Some questions are optional; data collection irregularities caused information to be
      missing from individual instances; and each participant answered a common set of
      questions plus additional questions relevant only to their primary diagnostic category.
      Some recordings could not generate particular features because of their length or other
      issues.
    missing_data_patterns: >-
      Phenotype data files contain a row for a participant only if at least one column is
      non-missing, so absence of a row indicates that no element of that instrument was
      completed. Feature files omit recordings for which the corresponding feature could not
      be produced, and omit all dense features derived from free speech tasks and audio checks.
    handling_strategy: >-
      The dataset has been audited internally for missingness and consistency by the data
      release team, and a missingness table is included with the dataset. No imputation was
      performed.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    derivation: >-
      Study-specific identifier assigned at enrollment; not derived from and not linkable to
      direct identifiers within the released data.
    quality_notes: >-
      Present in every feature record and in the phenotype and task tables; a participant may
      appear in more than one row where they attended more than one session.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    quality_notes: >-
      Unique identifier for a recording session. Most participants completed all collection in
      a single session, but a subset required multiple sessions.
  - variable_name: task_name
    data_type: categorical
    quality_notes: >-
      Names the acoustic task performed, drawn from the protocol's twenty-two acoustic tasks,
      which include respiration, voluntary cough, prolonged vowel, maximum phonation time,
      glides, loudness, diadochokinesis, the Rainbow, Caterpillar and Cape-V passages, free
      speech, picture description, story recall, animal fluency, the word-colour Stroop,
      productive vocabulary, random item generation and the Cinderella story.
  - variable_name: n_frames
    data_type: integer
    quality_notes: >-
      Number of time frames in the associated temporal feature; varies with the duration of the
      recording and with the frame rate of the feature.
  - variable_name: spectrogram
    data_type: array
    unit: power
    quality_notes: >-
      201 by T power spectrogram; plotting in decibels requires conversion from the power
      representation.
  - variable_name: mel_spectrogram
    data_type: array
    quality_notes: 60 by T mel spectrogram computed with 60 mel bins.
  - variable_name: mfcc
    data_type: array
    quality_notes: 60 by T mel-frequency cepstral coefficients derived from the mel spectrograms.
  - variable_name: ema
    data_type: array
    quality_notes: >-
      T by 12 array of estimated electromagnetic articulography traces, giving X and Y positions
      of the tongue dorsum, tongue body, tongue tip, lower incisor, upper lip and lower lip.

file_collections:
  - id: doi:10.13026/8xbn-nq66#features
    name: Derived audio features
    collection_type: processed_data
    path: features/
    description: >-
      Dense per-recording features distributed as Apache Parquet files — ppgs.parquet,
      sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet,
      sparc_pitch.parquet, torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet,
      torchaudio_pitch.parquet and torchaudio_mel_spectrogram.parquet — together with the
      plain-text static_features.tsv and audio_quality_metrics.tsv. Every data file has a
      matching JSON data dictionary sharing its file stem, describing the feature and the
      processing applied. Each Parquet record carries participant_id, session_id, task_name,
      n_frames and the feature tensor.
  - id: doi:10.13026/8xbn-nq66#phenotype
    name: Phenotype tables
    collection_type: processed_data
    path: phenotype/
    description: >-
      Tab-delimited tables with matching JSON data dictionaries, organized into confounders,
      demographics, diagnosis, enrollment, questionnaire and task subfolders. The diagnosis
      subfolder holds one table per condition, including airway stenosis, amyotrophic lateral
      sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment, control,
      COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal
      dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous
      lesions, unexplained chronic cough and unilateral vocal fold paralysis. The questionnaire
      subfolder holds ADHD Adult, custom affect scale, DSM-5 Adult, Dyspnea Index, GAD-7,
      Leicester Cough Questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric history,
      PTSD Adult, VHI-10 and voice perception. The task subfolder holds acoustic task, Harvard
      sentences, random item generation, recording, session, Stroop and Winograd records.
      Dictionary entries give a one-sentence description, the question put to the participant
      where there was one, and the data type of the response.
  - id: doi:10.13026/8xbn-nq66#metadata
    name: Recording metadata
    collection_type: metadata
    path: metadata/
    description: >-
      A Parquet file and its data dictionary holding per-recording metadata, including task
      instructions and prompts and information about the microphone used and its gain. New in
      version 3.1.0.

distribution_formats:
  - format: Apache Parquet, column-oriented binary
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Loadable with any Parquet-capable library; the release notes demonstrate loading with the
      HuggingFace Datasets library and plotting spectrograms after conversion from power to
      decibels with librosa.
  - format: Tab-separated values with JSON data dictionaries
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Used for the phenotype tables, static features and audio quality metrics; readable with
      any statistical analysis tool.
  - format: WAV audio organized according to the Brain Imaging Data Structure v1.9.0
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    notes: >-
      Raw audio is not part of the PhysioNet release. It is disseminated through Synapse to
      applicants approved by the Data Access Compliance Office, whose institution has signed a
      Data Use and Transfer Agreement.

distribution_dates:
  - release_dates:
      - "Version 1.0, end of November 2024, on the Health Data Nexus platform"
      - "Version 1.1, 2025-01-17, on PhysioNet"
      - "Version 2.0.0, 2025-04-16"
      - "Version 2.0.1, 2025-08-18"
      - "Version 3.0.0, 2025-12-16"
      - "Version 3.1.0, 2026-05-01"

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it,
      through a data publishing platform that exposes public metadata and a DOI while the data
      themselves require registered or credentialed access. Collaborators at other research
      organizations, and other research teams at the same organization, must apply
      independently for access and sign their own Data Transfer and Use Agreement before
      receiving raw audio.

license_and_use_terms:
  data_use_permission: general_research_use
  license_terms: >-
    Files are released under the Bridge2AI Voice Registered Access License. Access requires
    registration on PhysioNet, confirmation of identity, credentialed-user status and signature
    of the Bridge2AI Voice Registered Access Agreement; no additional training is required. The
    dataset is intended solely for commercial and non-commercial research purposes by
    authorized researchers. Duplication as reasonably required to carry out the research project
    is permitted; sale of all or part of the data on any media is not. Raw audio requires a
    separate controlled-access application. Use of the dataset requires citation of the
    protocol development publication and of the dataset itself.

data_governance:
  committee_name: Data Access Compliance Office (DACO)
  accountable_organization:
    name: University of South Florida Board of Trustees
  access_review_process: >-
    Two routes are defined. For registered access to the features-only data, a user registers on
    PhysioNet, confirms their identity and signs the Bridge2AI-Voice Registered Access
    Agreement. For controlled access to raw audio, the applicant completes a Data Access Request
    Form and a Data Use Agreement and submits the application to the Data Access Compliance
    Office for review; on approval, a Data Use and Transfer Agreement must be signed by an
    authorized official at the applicant's institution before data are released. The transfer
    agreement names an approved list of recipient personnel, and any change to that list
    requires an amendment.
  stewardship_roles:
  - >-
    The Data Access Compliance Office reviews controlled-access applications and can be reached
    at DACO@b2ai-voice.org. The consortium curates the data and publishes a memorandum setting
    out the ethical justification for controlled access to raw voice samples. The hosting
    platform team maintains the technical infrastructure and provides continued access. Under
    the transfer agreement the recipient must retain control over the data, restrict use to
    named authorized persons, establish administrative, physical and technical safeguards,
    report any unauthorized use or disclosure within five business days, and destroy or return
    the data at the end of the agreement with written certification of destruction within thirty
    days.

ip_restrictions:
  restrictions:
    - The data may be protected by copyright and other rights, including other intellectual property rights
    - Duplication as reasonably required to carry out the research project with the data is permitted
    - Sale of all or part of the data on any media is not permitted
    - Nothing in the agreement transfers to the user any intellectual property rights in or relating to the data
    - Users agree not to make intellectual property claims on the data
    - Users agree not to use intellectual property protection, database rights or related rights in ways that would prevent or block access to, or use of, any element of the data or conclusions drawn directly from it
    - Users who perform further research adding intellectual and resource capital may obtain intellectual property rights on downstream discoveries, but agree to implement licensing policies that will not obstruct further research and to respect the Fort Lauderdale Agreement
    - No intellectual property based restrictions have been imposed by third parties on the data associated with the instances
    - The data provider gives no guarantee that the data are free of third-party intellectual property rights, database rights or other related rights

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    No export controls or other export-related regulatory restrictions apply to the dataset or to
    individual instances.
  other_compliance: >-
    The data are covered by a Certificate of Confidentiality, which must be asserted against
    compulsory legal demands such as court orders and subpoenas for identifying information or
    characteristics of a research participant. The data are personally identifiable information
    as defined in OMB Memorandum M-07-16. HIPAA de-identification rules were applied to the
    released data, and the collecting infrastructure is HIPAA compliant, with storage on servers
    operated by NIH STRIDES partners under pre-negotiated agreements. Canadian sites operate
    under separate Research Ethics Board oversight.

intended_uses:
  - use_category: Clinical machine-learning research
    examples:
      - Development, benchmarking and validation of clinically applicable machine-learning models for diagnosing health conditions from voice
      - Work on vocal pathologies, neurological and neurodegenerative disorders, psychiatric conditions, respiratory disorders and pediatric voice disorders
    usage_notes: >-
      The dataset is structured to be findable, accessible, interoperable and reusable, and is
      intended for research that prioritizes patient safety, privacy and ethical use.
  - use_category: AI model pretraining and fine-tuning
    examples:
      - Pretraining or fine-tuning of models on the derived acoustic feature representations
    usage_notes: >-
      Users should construct their own data splits, since none are recommended, and should
      account for skews by disorder category, site and demographics.
  - use_category: Voice as a non-invasive biomarker
    examples:
      - Screening, diagnosis and monitoring of health conditions using voice as a low-cost, non-invasive biomarker
    usage_notes: >-
      Voice-based assessment is presented as a route to early disease detection, continuous
      monitoring and personalized treatment strategies rather than as a validated clinical tool.

existing_uses:
  - examples:
      - A restricted version of the dataset containing raw audio was used in the Bridge2AI Summer School and hackathon
      - Training opportunities for using the dataset are offered through the Bridge2AI Voice Scholars programme at https://www.b2aivoicescholars.org/
    notes: >-
      The project documentation states that no repository tracking papers or systems that use
      the dataset is maintained beyond ordinary citation indices.

discouraged_uses:
  - discouragement_details: >-
      Use in hiring decisions is discouraged, as a non-research application that could produce
      unethical or biased outcomes negatively affecting individuals on the basis of their health
      conditions or voice characteristics.
  - discouragement_details: >-
      Use in insurance premium adjustment is discouraged, for the same reason.
  - discouragement_details: >-
      Use in any form of surveillance that could lead to discrimination or harm is discouraged.

prohibited_uses:
  - prohibition_reason: >-
      Attempting to re-identify research participants, or taking any action that could reasonably
      lead to re-identification, is prohibited by the Registered Access Agreement.
  - prohibition_reason: >-
      Any purpose that could foreseeably cause harm or stigmatization to research participants,
      their families, communities or specific populations is prohibited.
  - prohibition_reason: >-
      Using intellectual property protections, database rights or related rights in a manner that
      restricts or limits access to any part of the dataset, or to conclusions derived from it,
      is prohibited, so that future use of the dataset remains unrestricted in alignment with the
      Open Science principles upheld by the consortium.
  - prohibition_reason: >-
      Sale of all or part of the data on any media is prohibited under the Data Transfer and Use
      Agreement, as is disclosure to any party other than the authorized persons named in that
      agreement.
  - prohibition_reason: >-
      Contacting the individuals who are the subjects of the data, either using the data alone or
      in concert with other information, is prohibited without institutional review board
      approval, specific written approval from the provider, and informed consent from the
      individual where required.

future_use_impacts:
  - impact_details: >-
      The dataset carries skews based on disorder category, site and other demographic factors.
      A future user should consider the multivariate distribution when assessing utility for a
      given question, because models trained without regard to it risk unfair treatment of
      individuals or groups, stereotyping or quality-of-service disparities.
  - impact_details: >-
      Because voice is a biometric that cannot be fully de-identified, downstream release of
      models or derivatives trained on raw audio carries residual re-identification risk, which
      is the reason raw audio is restricted to controlled access.
  - impact_details: >-
      Because collection protocols and device configurations changed over the study and differ
      by site, models built on this release may encode site and device artifacts alongside
      clinical signal.

external_resources:
  - external_resources:
      - "Bridge2AI-Voice REDCap data dictionary, metadata and instrument PDFs: https://github.com/eipm/bridge2ai-redcap, archived at https://zenodo.org/doi/10.5281/zenodo.12760724 and https://zenodo.org/records/14989503"
      - "b2aiprep, the library used to organize and preprocess the dataset: https://github.com/sensein/b2aiprep"
      - "senselab, the library used to process audio files for research tasks: https://github.com/sensein/senselab"
      - "Bridge2AI-Voice documentation and dashboards: https://docs.b2ai-voice.org/, source at https://github.com/eipm/bridge2ai-docs, archived at https://zenodo.org/doi/10.5281/zenodo.13834653"
      - "FHIR profiles for voice as a biomarker"
      - "Protocol development publication: Bensoussan et al., Developing Multi-Disorder Voice Protocols, Proc. Interspeech 2024, 1445-1449, doi 10.21437/Interspeech.2024-1926"
    restrictions:
      - The REDCap dictionary and the documentation source are released under the MIT license
      - The b2aiprep preprocessing library is released under Apache-2.0
    notes: >-
      The released dataset itself is self-contained; these resources document how it was produced
      and how it should be interpreted rather than supplying data the release depends on.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The Bridge2AI-Voice consortium curates the dataset. Questions, suggestions and feedback are
      directed to the consortium, and access questions to the Data Access Compliance Office at
      DACO@b2ai-voice.org.
  - role: academic_institution
    maintainer_details: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts versions 1.1
      through 3.1.0 and provides continued access to credentialed researchers. PhysioNet is
      supported by NIH grants U24EB037545 and R01EB030362.
    source_caveats: >-
      The project documentation describes the Health Data Nexus, a platform maintained by the
      Temerty Centre for Artificial Intelligence Research and Education in Medicine at the
      University of Toronto, as the host that maintains the infrastructure and provides continued
      access. That describes the version 1.0 release; PhysioNet is the current host.
  - role: government_agency
    maintainer_details: >-
      The dataset is supported by the National Institutes of Health through the Bridge2AI Common
      Fund program.

updates:
  frequency: Semi-annual
  update_details: >-
    Further versions of the dataset are released on a semi-annual basis as new versions with new
    DOIs, and users are notified through news items on the hosting platform and through standard
    communication channels. Updates have added participants (391 new participants in version
    3.0.0, 136 in version 2.0.0), added feature families (MFCCs in 1.1; sparc articulatory
    features and phonetic posteriorgrams in 3.0.0; audio quality metrics and per-recording
    metadata in 3.1.0), reorganized the phenotype files, and corrected errors. The consortium
    anticipates future releases containing additional disease categories, pediatric data, Spanish
    protocols, and external multimodal data not present in current releases.

version_access:
  latest_version_doi: doi:10.13026/37yb-1t42
  versions_available:
    - "1.0 (Health Data Nexus, November 2024)"
    - "1.1 (2025-01-17)"
    - "2.0.0 (2025-04-16)"
    - "2.0.1 (2025-08-18)"
    - "3.0.0 (2025-12-16)"
    - "3.1.0 (2026-05-01, current)"
  version_details: >-
    Each version of the dataset has its own DOI in addition to a DOI that always resolves to the
    latest version. Version 3.0.0 is superseded by 3.1.0.
  source_caveats: >-
    The project documentation states that older versions will by default continue to be supported,
    hosted and made available, while reserving the right to remove access to them. The PhysioNet
    page for version 1.1 states that its files are no longer available and directs users to the
    latest version, so at least one older version is no longer downloadable.

errata:
  - erratum_details: >-
      Version 3.1.0 fixed broken Parquet files carried in the version 3.0.0 release, updated
      validated diagnosis information across conditions with back-filled information, rearranged
      some phenotypic files, and renamed certain gold-standard variable names.
    erratum_url: https://physionet.org/content/b2ai-voice/3.1.0/
  - erratum_details: >-
      Version 2.0.1 corrected the authorship list of the release.
  - erratum_details: >-
      Version 2.0.0 reprocessed the spectrograms to fix minor issues identified in the previous
      release, and removed all spectrograms and mel-frequency cepstral coefficients derived from
      free-speech-related files.
    notes: >-
      No standing erratum document is published; a changelog for each dataset version is published
      online with the dataset metadata.

retention_limit:
  retention_period: >-
    Indefinite for the hosted dataset; two years from the start date for data transferred to a
    recipient institution, or until project completion or expiry of the applicable ethics
    approval, whichever occurs first.
  retention_details: >-
    Once contributed, data will be retained as long as they are useful for research purposes,
    possibly indefinitely. Under the Data Transfer and Use Agreement, recipients must destroy the
    data in accordance with the provider's instructions at the end of the agreement and submit
    written certification of destruction within thirty days, retaining at most one archival copy
    where records-retention law, institutional policy or research-integrity verification requires
    it. Separately, identifiable data and the sheets linking participant numbers to participant
    information are kept by each collecting institution in local cloud storage for a maximum of
    ten years after study completion and are then destroyed, and study records and original
    consent documents are retained for a minimum of five years after study completion.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    Others may publish a derivative dataset on the hosting platform that references the original
    source; such derivative datasets may be made available under the same conditions as the source
    data. For the code used to produce the data, the open-source repositories provide discussion
    forums and issue pages for public discussion of data preprocessing, and pull requests for
    contributing improvements to the preprocessing code.

related_datasets:
  - relationship_type: is_supplemented_by
    target_dataset: doi:10.13026/mf9s-5r03
    name: Bridge2AI-Voice Pediatric Dataset
    description: >-
      A companion release from the same consortium covering the fifth disease cohort. Version
      1.1.0 contains derived audio features for 23,533 recordings from 300 participants aged 2 to
      18, recruited at the Hospital for Sick Children and grouped by age, with data collected
      through reproschema-ui under age-appropriate protocols and approved by that institution's
      Research Ethics Board.
  - relationship_type: is_new_version_of
    target_dataset: doi:10.57764/qb6h-em84
    name: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information, version 1.0"
    description: >-
      The first release of the dataset, published on the Health Data Nexus platform, which
      provides cloud compute alongside the dataset rather than allowing data downloads. It
      contained 12,523 recordings for 306 participants collected across five North American sites.

funders:
  - grantor: National Institutes of Health Common Fund, Bridge2AI Program
    notes: >-
      Core project OT2OD032720, "Bridge2AI: Voice as a Biomarker of Health - Building an ethically
      sourced, bioaccoustic database to understand disease like never before", with Yael Emilie
      Bensoussan as principal investigator at the University of South Florida. The award runs from
      2022-09-01 to 2026-11-30, with a fiscal year 2025 award amount of 4,660,942. The National
      Institutes of Health had no role in the preparation, review or approval of the associated
      manuscripts or in the decision to submit them for publication.
    source_caveats: >-
      The award is cited variously as 3OT2OD032720-01S3 (NIH RePORTER), 3OT2OD032720-01S1
      (PhysioNet acknowledgement and NIH project number in the release), 1OT2OD032720-01
      (feasibility publication funding statement), OT2 OD032720 (white paper), and in two garbled
      renderings on the documentation site footer. All identify the same core project.

