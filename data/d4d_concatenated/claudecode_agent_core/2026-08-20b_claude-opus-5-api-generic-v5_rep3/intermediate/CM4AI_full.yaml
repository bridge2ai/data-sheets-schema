third_party_sharing:
  - is_shared: true
    notes: >-
      Component raw data are deposited in third-party public repositories - MassIVE for mass
      spectrometry files, NCBI for sequence data, and Figshare for the iPSC CRISPRi perturbation atlas
      - and the packaged release is distributed publicly through the University of Virginia Dataverse.
      Distribution of some components is deferred by temporary pre-publication embargo.

license_and_use_terms:
  data_use_permission: no_commercial_use
  license_terms: >-
    Released under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International license
    (CC BY-NC-SA 4.0). Users may share and adapt the material provided they give appropriate credit,
    link to the license and indicate changes; may not use the material for commercial purposes; and
    must distribute contributions built on the material under the same license. Attribution is
    required to the copyright holders and to the authors, and publications referencing the data or
    derived products should cite both the related publication and the data collection itself.
    Commercial use falls outside the license and requires a separate license negotiation with the
    copyright holder, which is the University of California San Diego, Stanford University and/or the
    University of California San Francisco depending on the specific data package. Software released
    by the project is licensed separately and less restrictively: the FAIRSCAPE AI-readiness framework
    under the MIT license and the Tools data integration pipeline under the BSD-3 license.
  contact_person:
    id: ORCID:0000-0002-1708-8454
    name: Trey Ideker

ip_restrictions:
  restrictions:
  - >-
    Copyright in the released data is held by the Regents of the University of California except where
    otherwise noted; raw spatial proteomics image data are copyright the Board of Trustees of the
    Leland Stanford Junior University. Rights to grant commercial licenses rest with the University of
    California San Diego, Stanford University and/or the University of California San Francisco
    according to which institution generated the specific data package, and a Data Access Committee
    supervises ethical matters related to dataset distribution and to potential dual licensing for
    commercial use.
  source_caveats: >-
    The copyright statement is transcribed from the March 2025 Dataverse record and the 2024 bioRxiv
    preprint; the June 2026 record does not restate it, so no calendar year is asserted here.

data_governance:
  committee_name: CM4AI Data Governance Committee
  committee_contact:
    name: Jillian Parker
    id: ORCID:0000-0003-4535-3486
  accountable_organization:
    name: University of California San Diego
  access_review_process: >-
    Files published in the Dataverse release are publicly downloadable without an access request,
    under the terms of the CC BY-NC-SA 4.0 license; the repository's guestbook and access-request
    machinery are not engaged for these files. Component datasets under temporary pre-publication
    embargo are withheld until the embargo lifts. Commercial use lies outside the public license and
    is handled by separate negotiation with the copyright holder, supervised by the Data Access
    Committee.
  stewardship_roles:
  - >-
    Data governance for the release is directed by the CM4AI Data Governance Committee, whose named
    contact is Jillian Parker at the University of California San Diego (jillianparker@health.ucsd.edu).
    Ethical review is provided by Vardit Ravitsky (ravitskyv@thehastingscenter.org) and
    Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca). Program management and
    project-related inquiries are handled by Swathi Thaker at the University of Alabama at Birmingham
    (snthaker@uab.edu), with website support from Zhandos Sembay (zsembay8@uab.edu). Trey Ideker at
    the University of California San Diego is the designated point of contact for the deposited
    record. Archival stewardship rests with the University of Virginia Dataverse.
  source_caveats: >-
    The June 2026 record names the data governance and ethical review contacts but does not enumerate
    committee membership, decision timeframes or an appeal process. The accountable organization is
    recorded as the University of California San Diego on the evidence that it is the NIH award
    recipient organization for the project and the institutional home of both the principal
    investigator and the governance contact; the sources do not use the phrase "accountable
    organization" themselves.

regulatory_restrictions:
  confidentiality_level: unrestricted
  hipaa_compliant: not_applicable
  regulatory_restrictions:
  - >-
    The release records that the work does not involve human subjects, that samples are de-identified,
    and that the data are not FDA regulated. No export control or similar restriction is stated. The
    stated regulatory boundary is on use rather than on access: the data are not to be used in
    clinical decision-making or in any context involving patient care without appropriate regulatory
    oversight and approval.
  other_compliance: >-
    Participants accessing Bridge2AI data, including CM4AI datasets, through the Bridge2AI Open House
    attest and commit to a Code of Conduct developed by the Bridge2AI Data Sharing and Dissemination
    Working Group with support from the Bridge2AI Ethics Working Group.

human_subject_research:
  involves_human_subjects: false
  ethics_review_board: >-
    No institutional review board approval is recorded, consistent with the release's statement that
    the work does not involve human subjects. Ethical oversight is provided instead by the CM4AI
    Ethics module; the named ethical review contacts for the release are Vardit Ravitsky and
    Jean-Christophe Belisle-Pipon.
  regulatory_compliance:
  - >-
    The release records that the data are not FDA regulated and that samples are de-identified.
  notes: >-
    The 2024 project preprint states that CM4AI data are distinctive within Bridge2AI in being
    non-clinical, derived from tissue cultures, and are considered de-identified in that they cannot,
    with current knowledge, be matched to a human subject.

ethical_reviews:
  - reviewing_organization: The Hastings Center
    contact_person:
      id: ORCID:0000-0002-7080-8801
      name: Vardit Ravitsky
    review_details: >-
      Named ethical review contact for the CM4AI data releases (ravitskyv@thehastingscenter.org).
    source_caveats: >-
      The organization is inferred from the contact email domain given in the June 2026 record and
      from the listing of the Hastings Center among CM4AI collaborators on cm4ai.org; the same record
      gives this person's author affiliation as University of Montreal.
  - reviewing_organization: Simon Fraser University
    contact_person:
      id: ORCID:0000-0002-8965-8153
      name: Jean-Christophe Belisle-Pipon
    review_details: >-
      Named ethical review contact for the CM4AI data releases
      (jean-christophe_belisle-pipon@sfu.ca).
  - reviewing_organization: Cell Maps for Artificial Intelligence Ethics module
    review_details: >-
      The project's Ethics module works with the Data Acquisition, Tools and Standards modules on
      ethical preparation, licensing, dissemination and data access supervision, balancing openness of
      the data against protection of intellectual property and monitoring of potential
      commercialization. It applies a Value-Sensitive Design-inspired methodology, is building an
      axiological repository of relevant moral values, and is formulating a CM4AI Life Cycle framework
      that sets governance milestones across data generation and AI system development.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The June 2026 release records that samples are de-identified and that the work does not involve
    human subjects. Data are generated from two established human cell lines rather than from
    identifiable primary human material: MDA-MB-468, obtained from ATCC, and KOLF2.1J, distributed
    through the HipSci resource. The 2024 project preprint states that the data are considered
    de-identified in that they cannot, with current knowledge, be matched to a human subject.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The released files contain molecular measurements - images, mass spectra derivatives and
      single-cell transcriptional profiles - from established cell lines, with no personal identifiers
      and no protected health information. Donor characteristics of the two source lines are described
      in the published literature about those lines rather than recorded as data elements in the
      release.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      No confidential content is withheld from the released files, which are publicly downloadable.
      Some component datasets are temporarily withheld under pre-publication embargo, which is a
      timing restriction pending publication rather than a confidentiality classification; the release
      records the overall confidentiality level as unrestricted.

