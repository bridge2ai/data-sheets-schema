relationships:
  - relationship_details: >-
      Instances across the three modalities are linked by protein and gene identity: immunofluorescence
      images, mass-spectrometry-derived interaction and elution profiles, and CRISPRi perturbation
      profiles are keyed to the same protein or gene so that the modalities can be fused per protein.
      A further relationship holds within the interaction data, where proteins are connected as
      bait-prey pairs or as co-eluting pairs, forming the network that community detection partitions
      into nested assemblies. The release states that the protein sets interrogated by the three
      modalities overlap only incompletely.

missing_data_documentation:
  - missing_data_patterns: >-
      Computed cell maps, the integrated product of the project, are absent from the release. The
      protein sets interrogated by SEC-MS, immunofluorescence imaging and CRISPRi perturb-seq overlap
      only incompletely. AP-MS data are present only for treated MDA-MB-468 cells. Immunofluorescence
      images are present only for MDA-MB-468 cells; images for iPSCs and their derivatives are
      announced as forthcoming.
    missing_data_causes: >-
      The release is an interim beta issued while data generation is still under way, and some
      component datasets remain under temporary pre-publication embargo, specifically the perturb-seq
      deposits for KOLF2.1J iPSCs and for MDA-MB-468 cells.
    handling_strategy: >-
      Missing components are scheduled for addition in subsequent quarterly releases through the end
      of the project in November 2026; users are directed to the release series rather than to any
      single deposit for complete coverage.

preprocessing_strategies:
  - preprocessing_details: >-
      Immunofluorescence acquisitions are released as four-channel images with a fixed channel
      assignment (protein of interest green, nuclei blue, endoplasmic reticulum yellow, microtubules
      red). RGB composite immunofluorescence images were added to the release series in the June 2025
      revision.
  - preprocessing_details: >-
      Antibody selection and image quality control follow Human Protein Atlas standard procedures for
      antibody validation and image scoring.
  - preprocessing_details: >-
      Each computational unit of the release pipeline is packaged by the FAIRSCAPE client, which
      validates inputs, attaches JSON-Schema data dictionaries with data elements mapped to public
      ontology vocabularies where appropriate, and emits an RO-Crate containing datasets, metadata and
      software or resolvable references to them. The FAIRSCAPE server then registers each crate and
      its individual components, assigns persistent, resolvable, globally unique identifiers using the
      ARK scheme, and computes end-to-end provenance entailments expressed in the EVI Evidence Graph
      Ontology and serialized in JSON-LD and RDF/XML.

anomalies:
  - anomaly_details: >-
      Archive sizes for the mass spectrometry packages differ substantially between the October 2025
      and June 2026 releases despite similar names and stated contents: cm4ai_mass-spec_KOLF2.zip is
      23.8 MB in October 2025 and 171.8 KB in June 2026, and cm4ai_mass-spec_MDA-MB-468.zip is 23.0 MB
      in October 2025 and 93.9 KB in June 2026. The sources do not explain the difference.

errata:
  - erratum_details: >-
      The June 2025 deposit (DOI 10.18130/V3/F3TD5R) is described in its own record as a revision of
      the June 2025 Data Release that adds RGB immunofluorescence images, corrects RO-Crate metadata
      and changes file naming conventions.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in the release were derived from commercially available, de-identified human cell lines and
      do not represent all biological variants that may be seen in the population at large. Two donor
      backgrounds are involved: MDA-MB-468, from a 51-year-old Black female with metastatic mammary
      adenocarcinoma, and KOLF2.1J, from a healthy male Northern European donor.
    mitigation_strategy: >-
      The release states this limitation explicitly and positions the data as one of a growing library
      of maps intended to span demographic and disease contexts.
  - bias_type: selection_bias
    bias_description: >-
      The proteins and genes interrogated across modalities were chosen as targeted panels of
      chromatin modifiers and metabolic enzymes implicated in cancer, neuropsychiatric and cardiac
      disorders, together with their interactors and selected signaling molecules, rather than sampled
      without preference across the proteome. Findings are therefore concentrated in the pathways
      those panels cover.
    mitigation_strategy: >-
      The CRISPRi perturbation screen in KOLF2.1J iPSCs is expressed genome-scale, covering 11,739
      targeted genes, which broadens coverage beyond the targeted panels for that modality.
  - bias_type: measurement_bias
    bias_description: >-
      Each modality has characteristic detection limits. Affinity purification-mass spectrometry
      depends on successful endogenous tagging and on bait recovery; immunofluorescence depends on
      antibody availability and quality for the target protein; and size-exclusion chromatography-mass
      spectrometry recovers only proteins abundant enough to be quantified in fractions. Proteins that
      one platform cannot see are absent from that modality rather than absent from the cell.
    mitigation_strategy: >-
      Two orthogonal mass spectrometry approaches (AP-MS and SEC-MS) are applied to the same cellular
      contexts, and the project design fuses complementary modalities so that each finding rests on
      more than one line of evidence.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      This is an interim release. It does not contain the predicted or computed cell maps, which are
      the project's eventual product and which will be added in future releases.
    scope_impact: >-
      Users seeking the integrated hierarchical cell maps will not find them here; only the input data
      streams from which such maps are built are provided.
    recommended_mitigation: >-
      Follow the quarterly release series, which continues through November 2026.
  - limitation_type: integration_limitation
    limitation_description: >-
      Protein-protein interaction data (SEC-MS), protein localization data (immunofluorescence
      imaging) and CRISPRi perturb-seq data interrogate sets of proteins that overlap only
      incompletely.
    scope_impact: >-
      The set of proteins for which all three modalities are available is smaller than the set covered
      by any one modality, constraining fully multimodal analyses.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Some component datasets remain under temporary pre-publication embargo and are therefore not
      accessible from the release, notably the perturb-seq deposits for KOLF2.1J iPSCs and for
      MDA-MB-468 cells.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the individual datasets, and
      meaningful analysis requires domain expertise.
    recommended_mitigation: >-
      The CM4AI project provides tutorials, documentation and hands-on training, including a CodeFest
      event and an in-person internship, to support users approaching the data.

intended_uses:
  - use_category: AI-ready datasets to support research in functional genomics
    usage_notes: >-
      Data are packaged with provenance graphs, schemas and persistent identifiers so that they can be
      consumed directly by machine learning workflows.
  - use_category: AI model training
    examples:
    - >-
      Training of "visible" machine learning systems, including visible neural networks, whose
      internal structure is informed by multi-scale cell and tissue architecture rather than being an
      opaque predictor.
  - use_category: Cellular process analysis
  - use_category: >-
      Analysis of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations
    examples:
    - >-
      Comparison of protein complexes and subcellular localization in MDA-MB-468 breast cancer cells
      untreated versus treated with paclitaxel or vorinostat, and in KOLF2.1J iPSCs versus
      iPSC-derived neural progenitor cells, neurons and cardiomyocytes.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context involving
      patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license under which the data are
      released; it requires a separate license negotiation with the copyright holder, which is the
      University of California San Diego, Stanford University and/or the University of California San
      Francisco depending on the specific data package.

existing_uses:
  - examples: >-
      The genome-scale CRISPRi perturbation cell atlas of KOLF2.1J induced pluripotent stem cells
      included in the release is analysed in Nourreddine S et al., "A perturbation cell atlas of human
      induced pluripotent stem cells", bioRxiv 2024.11.03.621734, which maps transcriptional and
      fitness phenotypes for 11,739 targeted genes and validates findings by phenotypic,
      protein-interaction and metabolic tracing assays.
  - examples: >-
      CM4AI datasets, tools and standards were distributed and used for hands-on training at a virtual
      CodeFest in March 2024, attended by 38 registrants, with tutorials explaining how the data were
      derived and integrated and providing production-ready software for reproducing the datasets.

future_use_impacts:
  - impact_details: >-
      The CM4AI Ethics module anticipates potential applications of the data and of the AI systems
      derived from them, integrating that anticipation into data governance frameworks in order to
      optimize benefits, mitigate potential risks and promote use for the collective good. The work
      uses a Value-Sensitive Design-inspired methodology, an axiological repository of relevant moral
      values, and a CM4AI Life Cycle framework that sets governance milestones across data generation
      and AI system development.
  - impact_details: >-
      Because the release is intended for AI model training but consists of laboratory cell-line data
      that have not been validated for clinical application, models trained on it could be applied in
      settings the data do not support. The release therefore states the boundary explicitly and
      excludes clinical decision-making and patient care absent appropriate regulatory oversight and
      approval.

distribution_formats:
  - format: ZIP archive
    media_type: application/zip
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
      - https://cm4ai.org/data-releases/
    notes: >-
      Files are downloaded individually from the Dataverse file table or programmatically through the
      Dataverse Data Access API; the whole dataset exceeds the repository's ZIP download limit, so
      bulk download of the complete release in one archive is not offered.
  - format: >-
      RO-Crate, comprising JSON-LD metadata, JSON-Schema data dictionaries and EVI provenance graphs,
      with human-readable HTML datasheet and provenance-graph renderings
    media_type: application/ld+json
    notes: >-
      Provenance-graph HTML renderings distributed in earlier releases require download to display
      correctly and do not render in the Dataverse in-browser preview.

distribution_dates:
  - release_dates: >-
      2026-06-17 - June 2026 Data Release (Beta), version 2.0, DOI 10.18130/V3/HIGT4C. Three
      immunofluorescence image archives within this version carry a file-level publication date of
