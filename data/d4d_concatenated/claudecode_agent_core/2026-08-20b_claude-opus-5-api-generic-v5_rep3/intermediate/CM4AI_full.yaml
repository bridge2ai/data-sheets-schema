purposes:
  - response: >-
      To produce ethical, AI-ready datasets of human cell architecture, inferred from multimodal data
      collected in human cell lines, in order to enable transformative biomedical artificial
      intelligence research.
  - response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the grand
      challenge of interpretable genotype-phenotype learning.
  - response: >-
      To create a library of large-scale maps of cellular structure and function across demographic
      and disease contexts, so that machine learning systems can be built directly on knowledge maps
      of cell and tissue architecture rather than as opaque predictors.
  - response: >-
      To demonstrate a standards-based data management approach with FAIR access, deep provenance and
      replication packages for the representation of cell maps and their underlying datasets, and to
      stimulate training in the emerging field of biomedical machine learning.

addressing_gaps:
  - response: >-
      In genomics and precision medicine, machine learning models are often black boxes that predict
      phenotypes from genotypes without exposing the mechanisms by which the translation occurs. The
      dataset supplies the cell-architecture knowledge needed to build "visible" machine learning
      systems whose internal structure can be interpreted.
  - response: >-
      Much of human subcellular architecture remains uncharted. Cell mapping technologies have
      typically been applied separately; matched, proteome-scale datasets across complementary
      modalities in the same cellular context have been scarce.
  - response: >-
      Existing biomedical datasets frequently lack machine-readable provenance, complete
      characterization and explicit ethical documentation. The release addresses this by packaging
      data with provenance graphs, schemas and rich metadata as AI-ready RO-Crates.

tasks:
  - response: >-
      Construction of hierarchical, multiscale maps of subcellular protein assemblies by integrating
      protein-protein interaction data with immunofluorescence imaging data using self-supervised
      co-embedding followed by multi-resolution community detection.
  - response: >-
      Training and evaluation of visible neural networks and other interpretable
      genotype-to-phenotype models informed by multi-scale cell and tissue architecture.
  - response: >-
      Characterization of how cell architecture, protein complexes and protein localization change
      under drug treatment (paclitaxel, vorinostat), under differentiation (iPSC to neural progenitor
      cell, neuron, cardiomyocyte), and under CRISPRi genetic perturbation.
  - response: >-
      Assignment of putative function to proteins and protein assemblies by alignment of detected
      communities to Gene Ontology and Reactome, supplemented by large language model naming with an
      associated confidence score.

acquisition_methods:
  - acquisition_details: >-
      Protein-protein interactions were mapped by affinity purification-mass spectrometry (AP-MS) on
      endogenously tagged cell lines, targeting chromatin regulators under the treatment conditions of
      interest.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) was used for proteome-wide
      complex and interaction mapping, serving as an orthogonal mass spectrometry approach to AP-MS.
      In MDA-MB-468 cells it detected 72 of 100 chromatin modifiers of interest, 52 of them as
      integral components of protein complexes, and resolved profiles for over a thousand complexes;
      in KOLF2.1J iPSCs and derivatives it uncovered more than 700 protein complexes in both parental
      iPSCs and differentiated neurons.
    was_directly_observed: true
    was_validated_verified: true
  - acquisition_details: >-
      Spatial subcellular organization was mapped by immunofluorescence-based staining (ICC-IF) using
      Human Protein Atlas antibodies followed by confocal microscopy. Automated fixation and
      permeabilization protocols were established on a pipetting robot for the MDA-MB-468 and KOLF2
      cell lines. Each acquisition records the protein of interest in the green channel with
      reference markers for nuclei (DAPI, blue), endoplasmic reticulum (calreticulin antibody,
      yellow) and microtubules (tubulin antibody, red).
    was_directly_observed: true
  - acquisition_details: >-
      Genetic perturbation data were acquired by single-cell CRISPRi screens using a lentiviral guide
      library and cell lines expressing inducible dCas9, read out by single-cell RNA sequencing.
      Screens covered targeted chromatin-regulator panels in MDA-MB-468 cells with and without drug
      treatment, and an expressed genome-scale library of 11,739 targeted genes in undifferentiated
      KOLF2.1J iPSCs.
    was_directly_observed: true

collection_mechanisms:
  - mechanism_details: >-
      Mass spectrometry instrumentation for affinity purification-mass spectrometry of endogenously
      tagged bait proteins and their associated complexes.
  - mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry, separating native cellular extracts
      into size fractions whose protein content is quantified by mass spectrometry to yield elution
      profiles.
  - mechanism_details: >-
      Confocal microscopy of immunofluorescently stained cells in multiwell plates, with automated
      robotic fixation and permeabilization, using Human Protein Atlas antibodies against the protein
      of interest together with reference stains for nucleus, endoplasmic reticulum and microtubules.
  - mechanism_details: >-
      A CRISPR lentiviral library targeting chromatin factors with six guide RNAs per gene, delivered
      into MDA-MB-468 and KOLF2 lines engineered to express inducible dCas9; single-cell readout was
      performed with the 10x Genomics 3' HT kit.

data_collectors:
  - role: protein-protein interaction data generation
    collector_details: >-
      The Nevan Krogan laboratory at the University of California San Francisco generated the AP-MS
      and SEC-MS protein-protein interaction data.
  - role: spatial proteomics data generation
    collector_details: >-
      The Emma Lundberg laboratory at Stanford University generated the immunofluorescence subcellular
      imaging data, following Human Protein Atlas procedures.
  - role: genetic perturbation data generation
    collector_details: >-
      The Prashant Mali laboratory at the University of California San Diego generated the single-cell
      CRISPRi perturbation screens, including the genome-scale iPSC perturbation cell atlas.
  - role: data integration, tooling and map production
    collector_details: >-
      The Trey Ideker laboratory at the University of California San Diego develops and operates the
      Multi-Scale Integrated Cell (MuSIC) pipeline that consumes the released input data streams.
  - role: AI-readiness packaging and metadata
    collector_details: >-
      The University of Virginia team develops the FAIRSCAPE framework used to package released data
      with schemas, persistent identifiers and provenance graphs, and deposits the releases in the
      University of Virginia Dataverse.

collection_timeframes:
  - timeframe_details: >-
      The June 2026 Dataverse record gives a data creation date of 2025-02-27 and a deposit date of
      2025-02-27. Data generation began in the first project year (chromatin-regulator panels in
      MDA-MB-468 cells and KOLF2.1J iPSCs) and continues, with quarterly releases, through the end of
      the project in November 2026. The funded project period recorded by NIH RePORTER runs from
      2022-09-01 to 2026-08-31.

direct_collection:
  - is_direct: false
    collection_details: >-
      No data were collected from individuals. All data were generated in the laboratory from two
      established, commercially or institutionally distributed human cell lines: MDA-MB-468, obtained
      from ATCC, and KOLF2.1J, distributed through the Human Induced Pluripotent Stem Cells
      Initiative (HipSci). Both were selected as ethically sourced lines.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Two sampling axes are used. Along the molecular axis, targeted panels were chosen: 100 chromatin
      modifiers and 100 metabolic enzymes implicated in cancer, neuropsychiatric and cardiac
      disorders, with additional proteins added on the basis of significant hits from the perturbation
      and interaction screens; the iPSC CRISPRi screen is expressed genome-scale, covering 11,739
      targeted genes. Along the cellular axis, two disease-relevant backgrounds were sampled under
      contrasting conditions: MDA-MB-468 untreated versus treated with paclitaxel or vorinostat, and
      KOLF2.1J iPSCs undifferentiated versus differentiated to neural progenitor cells, neurons and
      cardiomyocytes.
    why_not_representative: >-
      The data derive from commercially available, de-identified human cell lines and do not represent
      the full range of biological variation present in the population at large. The molecular panels
      were selected for disease relevance rather than sampled at random from the proteome.

raw_data_sources:
  - source_description: >-
      MDA-MB-468, a triple-negative breast cancer cell line (RRID:CVCL_0419) established from a
      metastatic pleural effusion of a 51-year-old Black female with metastatic mammary
      adenocarcinoma. The line is extensively used in triple-negative breast cancer research and is
      well characterized, with transcriptomic, mutational-profile and whole-genome sequencing data
      available.
    source_type: established human cancer cell line
    access_details: Available from the American Type Culture Collection (ATCC).
  - source_description: >-
      KOLF2.1J, an induced pluripotent stem cell line (RRID:CVCL_B5P3) derived from a healthy male
      Northern European donor, available from the Human Induced Pluripotent Stem Cells Initiative
      (HipSci) resource.
    source_type: established human induced pluripotent stem cell line
    access_details: >-
      Available for access by not-for-profit organizations via a simple material transfer agreement.

raw_sources:
  - raw_data_details: >-
      Raw AP-MS mass spectrometry files for MDA-MB-468 cells treated with paclitaxel, deposited in the
      MassIVE repository and linked from the June 2026 Dataverse record.
  - raw_data_details: >-
      Raw AP-MS mass spectrometry files for MDA-MB-468 cells treated with vorinostat, deposited in the
      MassIVE repository and linked from the June 2026 Dataverse record.
  - raw_data_details: >-
      Raw SEC-MS mass spectrometry files for KOLF2.1J iPSCs, undifferentiated and differentiated to
      neural progenitor cells, neurons and cardiomyocytes, deposited in the MassIVE repository and
      linked from the June 2026 Dataverse record.
  - raw_data_details: >-
      Raw SEC-MS mass spectrometry files for MDA-MB-468 breast cancer cells with and without
      treatment, deposited in the MassIVE repository and linked from the June 2026 Dataverse record.
  - raw_data_details: >-
      Raw perturb-seq sequence data for undifferentiated KOLF2.1J iPSCs. The June 2026 Dataverse
      record marks this external deposit as embargoed; the June 2025 record linked an NCBI BioProject
      in the Sequence Read Archive for the same data.
  - raw_data_details: >-
      Raw perturb-seq sequence data for MDA-MB-468 breast cancer cells with and without treatment. The
      June 2026 Dataverse record marks this external deposit as embargoed.

