      was published on 2 October 2025 (doi 10.1038/s41586-025-09648-x).
    archival: true
    source_caveats: >-
      This publication concerns U2OS cells, a different cell line from those used in the CM4AI
      releases, and is included as related methodology rather than as documentation of this dataset.
  - external_resources: >-
      Cell Mapping Toolkit, https://github.com/idekerlab/cellmaps_pipeline, a series of pip-installable
      Python packages implementing the end-to-end cell map construction pipeline, with documentation
      at https://cellmaps-pipeline.readthedocs.io/.
    archival: false
    restrictions:
    - >-
      Released under the BSD-3 open source license for alpha-level tools, with production-ready tools
      archived in Zenodo.
  - external_resources: >-
      FAIRSCAPE AI-readiness framework, https://fairscape.github.io, providing the client and server
      packages that validate inputs, build RO-Crates, mint ARK persistent identifiers and compute EVI
      provenance graphs.
    archival: false
    restrictions:
    - Released under the MIT open source license.
  - external_resources: >-
      Integrative Modeling Platform (IMP), http://integrativemodeling.org, the open source package used
      by the project for integrative structure modeling of protein communities.
    archival: false
  - external_resources: >-
      Network Data Exchange (NDEx), https://ndexbio.org, through which cell maps are shared and can be
      visualized in a browser or accessed with Cytoscape, HiView and the Python ndex2 library.
    archival: false
  - external_resources: >-
      MassIVE repository deposits of the raw mass spectrometry files underlying the AP-MS results for
      paclitaxel-treated and vorinostat-treated MDA-MB-468 cells and the SEC-MS results for KOLF2.1J
      iPSCs and derivatives and for MDA-MB-468 cells, linked from the June 2026 Dataverse record.
    archival: true
  - external_resources: >-
      Figshare deposit of the CRISPRi Perturbation Atlas of induced pluripotent stem cells, linked from
      the June 2026 Dataverse record.
    archival: true
  - external_resources: >-
      Perturb-seq deposits for KOLF2.1J iPSCs and for MDA-MB-468 cells with and without treatment.
    archival: true
    restrictions:
    - >-
      Marked as embargoed in the June 2026 Dataverse record, under temporary pre-publication embargo.
    future_guarantees: >-
      Expected to become available as the embargo lifts, within the quarterly release series running
      to November 2026.

updates:
  frequency: quarterly
  update_details: >-
    The dataset will be regularly updated and augmented through the end of the project in November
    2026, with updates on a quarterly basis. Each quarterly release is deposited as a separate
    Dataverse dataset with its own DOI, and successive releases add modalities, cell types and
    conditions; immunofluorescence images for induced pluripotent stem cells and their derivatives are
    announced as forthcoming, and the computed cell maps are to be added in future releases.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
  - >-
    May 2024 Data Release (doi 10.18130/V3/DXWOS5); March 2025 Data Release Beta (doi
    10.18130/V3/B35XWX, version 1.4 at last observation); June 2025 Data Release Beta (doi
    10.18130/V3/F3TD5R, version 2.1); October 2025 Data Release Beta (doi 10.18130/V3/K7TGEM, version
    2.1); June 2026 Data Release Beta (doi 10.18130/V3/HIGT4C, version 2.0).
  version_details: >-
    Quarterly releases are published as distinct Dataverse datasets, each with its own DOI and its own
    internal version history, rather than as successive versions of a single deposit; earlier releases
    remain listed and citable in the CM4AI collection archive. Within a deposit, Dataverse retains
    prior published versions, and the citation records the version number (for example V2 for the June
    2026 release). Software packages are versioned independently, and the version used to produce each
    dataset is referenced in that dataset's metadata.

retention_limit:
  retention_details: >-
    Long-term preservation is in the University of Virginia Dataverse (LibraData), an NIH-approved
    generalist repository, supported by committed institutional funds. No deletion schedule is stated.
    The University of Virginia Dataverse collection holding the CM4AI releases currently carries a
    notice that it is under review for potential modification in compliance with Administration
    directives.

