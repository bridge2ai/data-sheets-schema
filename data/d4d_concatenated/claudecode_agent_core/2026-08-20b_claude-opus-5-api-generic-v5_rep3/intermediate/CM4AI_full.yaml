source_caveats: >-
  Source disagreements and transcription notes. (1) Release date: the CM4AI data-releases page states
  the June 2026 release was "Released on: June 17, 2025", while the University of Virginia Dataverse
  record gives a publication date of 2026-06-17; the Dataverse record is the higher-ranked source and
  its value is used. (2) Number of proteins imaged by immunofluorescence in MDA-MB-468 cells: the
  October 2025 Dataverse file descriptions state 464 proteins, the CM4AI data-releases page states
  523, and the March 2025 Dataverse release states 563; the June 2026 record gives no figure. The
  October 2025 value (464) is used, as it is the highest-ranked source that states a number for the
  current file set. (3) The project-level counts quoted in the description (1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 proteins, 11,739 genes, 21.4 TB) are
  cumulative CM4AI project figures reported on cm4ai.org, not counts for the June 2026 release alone.
  (4) last_updated_on is transcribed from the file-level publication date of 2026-07-15 recorded for
  the three immunofluorescence image archives within version 2.0, which is later than the version
  publication date of 2026-06-17. (5) Andrej Sali's affiliation is given as University of California
  San Diego in the Dataverse author list but as University of California San Francisco in the 2024
  bioRxiv preprint. (6) Vardit Ravitsky is listed with a University of Montreal affiliation in the
  Dataverse author list, but the ethical review contact email given in the same record is at The
  Hastings Center, which cm4ai.org lists among the collaborating institutions. (7) Nine named authors
  in the release citation (Axelsson U, Chinn B, Fall J, Johannesson A, Khaliq H, Muralidharan M, Pan
  E, Polacco B, Zhang Y) have no persistent identifier in any source, so they are represented only in
  the citation string and not as structured creator entries. (8) External deposit of perturb-seq
  data: the June 2025 Dataverse record links a Sequence Read Archive BioProject, whereas the June
  2026 record marks both KOLF2.1J and MDA-MB-468 perturb-seq deposits as embargoed; the June 2026
  statement is used. (9) The copyright statement is transcribed from the March 2025 Dataverse record
  and the 2024 bioRxiv preprint, which give calendar years of 2025 and 2024 respectively; the June
  2026 record does not restate it, so no year is asserted here. (10) The 2025 Nature article included
  in the source bundle reports a multimodal cell map of U2OS osteosarcoma cells, a different cell
  line from the MDA-MB-468 and KOLF2.1J backgrounds used in the CM4AI releases. It acknowledges
  Bridge2AI funding and describes the mapping methodology, and is treated here as related
  methodological work rather than as a component of this dataset. (11) The ROR identifier used for
  the publisher was transcribed from the June 2026 author affiliation entries, where it stands for
  the University of Virginia, whose Dataverse instance publishes and preserves the release.

