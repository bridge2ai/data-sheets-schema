description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation Project of
  the U.S. National Institutes of Health Bridge2AI program. Its objective is to deliver
  machine-readable, hierarchical maps of human cell architecture as AI-ready data, produced by
  multimodal interrogation of chromatin modifiers, metabolic enzymes and other proteins implicated in
  cancer, neuropsychiatric and cardiac disorders, in disease-relevant human cell lines under treated
  and untreated conditions. Three complementary mapping approaches are combined: mass
  spectrometry-based proteomics for protein-protein interactions, spatial proteomics by
  immunofluorescence cell imaging for protein localization, and genetic perturbation by CRISPR/Cas9
  read out as single-cell transcriptional profiles.


  This record describes the June 2026 Data Release (Beta), version 2.0, deposited in the University
  of Virginia Dataverse under DOI 10.18130/V3/HIGT4C. The release comprises ten ZIP archives:
  affinity purification-mass spectrometry (AP-MS) results for MDA-MB-468 breast cancer cells treated
  with paclitaxel and with vorinostat; immunofluorescence confocal image sets for MDA-MB-468 cells
  untreated and treated with paclitaxel or vorinostat; size-exclusion chromatography-mass
  spectrometry (SEC-MS) results for MDA-MB-468 cells with and without treatment and for KOLF2.1J
  induced pluripotent stem cells together with iPSC-derived neural progenitor cells, neurons and
  cardiomyocytes; a genome-scale CRISPRi perturb-seq cell atlas and a raw-sequence package for
  KOLF2.1J iPSCs; and a release metadata package.


  Two cell backgrounds are used. MDA-MB-468 is a triple-negative breast cancer line established from
  a pleural effusion metastasis and obtained from ATCC; it is profiled untreated and after treatment
  with paclitaxel or vorinostat. KOLF2.1J is an induced pluripotent stem cell line derived from a
  healthy donor and distributed through the Human Induced Pluripotent Stem Cells Initiative (HipSci);
  it is profiled undifferentiated and after differentiation to neural progenitor cells, neurons and
  cardiomyocytes.


  Across the project as a whole, the CM4AI project site reports 1,374 protein interactions, 53,788
  immunofluorescent images, 7,023 proteins investigated, 11,739 genes targeted and 21.4 TB of data.
  Releases are issued quarterly and are packaged with provenance graphs and rich metadata as AI-ready
  RO-Crates using the FAIRSCAPE framework. Downstream of release, the Multi-Scale Integrated Cell
  (MuSIC) pipeline embeds interaction and image data separately, fuses them into a co-embedding by
  self-supervised contrastive learning, and applies multi-resolution community detection to build the
  hierarchical cell map; the integrated cell maps that are the project's eventual product are not
  included in this release.


  CM4AI is a collaboration of the University of California San Diego, the University of California
  San Francisco, Stanford University, the University of Virginia, Yale University, the University of
  Texas at Austin, the University of Alabama at Birmingham, Simon Fraser University and the Hastings
  Center.

