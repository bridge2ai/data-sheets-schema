description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation Project of
  the U.S. National Institutes of Health Bridge2AI program. Its objective is to deliver
  machine-readable, hierarchical maps of human cell architecture as AI-ready data, produced by
  multimodal interrogation of chromatin modifiers, metabolic enzymes and other proteins implicated in
  cancer, neuropsychiatric and cardiac disorders, in disease-relevant human cell lines under treated
  and untreated conditions. Three complementary mapping approaches are combined: mass
  spectrometry-based proteomics for protein-protein interactions, spatial proteomics by
  immunofluorescence cell imaging for protein localization, and genetic perturbation by CRISPR/Cas9
  read out as single-cell transcriptional profiles.


  This record describes the June 2026 Data Release (Beta), version 2.0, deposited in the University
  of Virginia Dataverse under DOI 10.18130/V3/HIGT4C. The release is an interim beta and comprises
  ten ZIP archives: affinity purification-mass spectrometry (AP-MS) results for MDA-MB-468 breast
  cancer cells treated with paclitaxel and with vorinostat; immunofluorescence confocal image sets
  for MDA-MB-468 cells untreated and treated with paclitaxel or vorinostat; size-exclusion
  chromatography-mass spectrometry (SEC-MS) results for MDA-MB-468 cells with and without treatment
  and for KOLF2.1J induced pluripotent stem cells together with iPSC-derived neural progenitor cells,
  neurons and cardiomyocytes; a genome-scale CRISPRi perturb-seq cell atlas and a raw-sequence
  package for KOLF2.1J iPSCs; and a release metadata package.


  Two cell backgrounds are used. MDA-MB-468 is a triple-negative breast cancer line established from
  a pleural effusion metastasis and obtained from ATCC; it is profiled untreated and after treatment
  with paclitaxel or vorinostat. KOLF2.1J is an induced pluripotent stem cell line derived from a
  healthy donor and distributed through the Human Induced Pluripotent Stem Cells Initiative (HipSci);
  it is profiled undifferentiated and after differentiation to neural progenitor cells, neurons and
  cardiomyocytes.


  Across the project as a whole, the CM4AI project site reports 1,374 protein interactions, 53,788
  immunofluorescent images, 7,023 proteins investigated, 11,739 genes targeted and 21.4 TB of data.
  Releases are issued quarterly and are packaged with provenance graphs and rich metadata as AI-ready
  RO-Crates using the FAIRSCAPE framework. Downstream of release, the Multi-Scale Integrated Cell
  (MuSIC) pipeline embeds interaction and image data separately, fuses them into a co-embedding by
  self-supervised contrastive learning, and applies multi-resolution community detection to build the
  hierarchical cell map; the integrated cell maps that are the project's eventual product are not
  included in this release.


  CM4AI is a collaboration of the University of California San Diego, the University of California
  San Francisco, Stanford University, the University of Virginia, Yale University, the University of
  Texas at Austin, the University of Alabama at Birmingham, Simon Fraser University and the Hastings
  Center.

notes: >-
  The University of Virginia Dataverse collection that holds the CM4AI releases carries the notice
  "This collection is under review for potential modification in compliance with Administration
  directives"; the same notice appears on the CM4AI project website.


  The Dataverse record annotates most of its keywords with ontology term identifiers, which the
  string-ranged keyword slot cannot carry. Those mappings are: AI and artificial intelligence to NCI
  Thesaurus NCIT_C16309; affinity purification to BioAssay Ontology BAO_0002603; AP-MS to Software
  Ontology SWO_1100012; breast cancer to LOINC LA14283-8; cardiomyocyte to Cell Ontology CL_0000746;
  CRISPR/Cas9 to BioAssay Ontology BAO_0010249; induced pluripotent stem cell and iPSC to
  Experimental Factor Ontology EFO_0004905; machine learning to Ontology of Biomedical Investigations
  OBI_0002587; mass spectroscopy to MeSH D013058; neural progenitor cell and NPC to Cell Ontology
  CL_0011020; neuron to Cell Ontology CL_0000540; paclitaxel to ChEBI CHEBI_45863; perturb-seq and
  perturbation sequencing to Experimental Factor Ontology EFO_0008860; protein-protein interaction to
  NCI Thesaurus NCIT_C18469; protein localization to Gene Ontology GO_0008104; single-cell RNA
  sequencing and scRNAseq to Experimental Factor Ontology EFO_0008913; and vorinostat to ChEBI
  CHEBI_45716.

source_caveats: >-
  Source disagreements and transcription notes. (1) Release date: the CM4AI data-releases page states
  the June 2026 release was "Released on: June 17, 2025", while the University of Virginia Dataverse
  record gives a publication date of 2026-06-17; the Dataverse record is the higher-ranked source and
  its value is used. (2) Number of proteins imaged by immunofluorescence in MDA-MB-468 cells: the
  October 2025 Dataverse file descriptions state 464 proteins, the CM4AI data-releases page states
  523, and the March 2025 Dataverse release states 563; the June 2026 record gives no figure. The
  October 2025 value (464) is used, as it is the highest-ranked source that states a number for the
  current file set. (3) The project-level counts quoted in the description (1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 proteins, 11,739 genes, 21.4 TB) are
  cumulative CM4AI project figures reported on cm4ai.org, not counts for the June 2026 release alone;
  they are not apportioned by modality, cell line or release in any source, and are therefore not
  attached to individual instance types in this record. (4) last_updated_on is transcribed from the
  file-level publication date of 2026-07-15 recorded for the three immunofluorescence image archives
  within version 2.0, which is later than the version publication date of 2026-06-17; no
  dataset-level modification date is stated. (5) Andrej Sali's affiliation is given as University of
  California San Diego in the Dataverse author list but as University of California San Francisco in
  the 2024 bioRxiv preprint. (6) Vardit Ravitsky is listed with a University of Montreal affiliation
  in the Dataverse author list, but the ethical review contact email given in the same record is at a
  Hastings Center domain, and cm4ai.org lists the Hastings Center among the collaborating
  institutions; the record does not state which body conducted ethical review, so no reviewing
  organization is asserted. (7) External deposit of perturb-seq data: the June 2025 Dataverse record
  links a Sequence Read Archive BioProject, whereas the June 2026 record marks both KOLF2.1J and
  MDA-MB-468 perturb-seq deposits as embargoed; the June 2026 statement is used. (8) The copyright
  statement is transcribed from the March 2025 Dataverse record and the 2024 bioRxiv preprint, which
  give calendar years of 2025 and 2024 respectively; the June 2026 record does not restate it, so no
  year is asserted here. (9) The 2025 Nature article included in the source bundle reports a
  multimodal cell map of U2OS osteosarcoma cells, a different cell line from the MDA-MB-468 and
  KOLF2.1J backgrounds used in the CM4AI releases. It acknowledges Bridge2AI funding and describes
  the mapping methodology, and is treated here as related methodological work rather than as a
  component of this dataset. (10) No source states a ROR identifier for the publishing institution in
  that role; a ror.org string appears in the June 2026 record only within author affiliation fields.
  The publisher is therefore recorded by name rather than by identifier. (11) Distribution sizes are
  transcribed as the human-readable values printed by the repository (for example "3.8 GB"); exact
  byte counts are not stated by any source, so total_size_bytes is not asserted. (12) The Dataverse
  "Data Creation Date" and "Deposit Date" fields both give 2025-02-27, which describes the deposit
  workflow rather than the period over which the underlying data were generated; created_on is
  therefore not asserted, and the generation period is recorded in collection_timeframes instead.
  (13) The four earlier releases are separate Dataverse deposits with distinct DOIs rather than
  successive versions of a single deposit, so their relationship to this release is recorded as
  continuation of a quarterly series rather than as versioning.

