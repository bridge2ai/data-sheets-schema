collection_timeframes:
  - start_date: '2022-09-01'
    end_date: '2026-08-31'
    timeframe_details: >-
      The funded project period recorded by NIH RePORTER runs from 2022-09-01 to 2026-08-31. Data
      generation began in the first project year, with chromatin-regulator panels profiled in
      MDA-MB-468 cells and KOLF2.1J iPSCs, and continues on a quarterly release cadence; the June
      2026 Dataverse record states that the dataset will be updated through the end of the project in
      November 2026. The June 2026 record gives a Data Creation Date and a Deposit Date of
      2025-02-27, which describe the deposit workflow rather than the span of data generation.

direct_collection:
  - is_direct: false
    collection_details: >-
      No data were collected from individuals. All data were generated in the laboratory from two
      established, commercially or institutionally distributed human cell lines: MDA-MB-468, obtained
      from ATCC, and KOLF2.1J, distributed through the Human Induced Pluripotent Stem Cells
      Initiative (HipSci). Both were selected as ethically sourced lines.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Molecular sampling axis. Targeted panels were chosen rather than sampled at random from the
      proteome: 100 chromatin modifiers and 100 metabolic enzymes implicated in cancer,
      neuropsychiatric and cardiac disorders, with additional proteins added on the basis of
      significant hits from the perturbation and interaction screens. The CRISPRi screen in KOLF2.1J
      iPSCs departs from this and is expressed genome-scale, covering 11,739 targeted genes.
    why_not_representative: >-
      The molecular panels were selected for disease relevance rather than sampled without preference
      across the proteome, so coverage is concentrated in the pathways those panels touch.
    source_data: >-
      Human ORFeome-derived and Human Protein Atlas antibody-addressable protein sets, restricted to
      chromatin modifiers, metabolic enzymes and their interactors.
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Cellular sampling axis. Two disease-relevant backgrounds were sampled under contrasting
      conditions: MDA-MB-468 breast cancer cells untreated versus treated with paclitaxel or
      vorinostat, and KOLF2.1J induced pluripotent stem cells undifferentiated versus differentiated
      to neural progenitor cells, neurons and cardiomyocytes.
    why_not_representative: >-
      The data derive from two commercially available, de-identified human cell lines and do not
      represent the full range of biological variation present in the population at large.
    source_data: >-
      Two established human cell lines: MDA-MB-468, obtained from the American Type Culture
      Collection, and KOLF2.1J, distributed through the Human Induced Pluripotent Stem Cells
      Initiative (HipSci). No data were collected from individuals.

raw_data_sources:
  - source_description: >-
      MDA-MB-468 (RRID:CVCL_0419), a triple-negative breast cancer cell line established from a
      metastatic pleural effusion of a 51-year-old Black female with metastatic mammary
      adenocarcinoma. The line is extensively used in triple-negative breast cancer research and is
      well characterized, with transcriptomic, mutational-profile and whole-genome sequencing data
      available.
    source_type: established human cancer cell line
    access_details: >-
      Available from the American Type Culture Collection (ATCC). Cell line identifier
      RRID:CVCL_0419.
  - source_description: >-
      KOLF2.1J (RRID:CVCL_B5P3), an induced pluripotent stem cell line derived from a healthy male
      Northern European donor, available from the Human Induced Pluripotent Stem Cells Initiative
      (HipSci) resource.
    source_type: established human induced pluripotent stem cell line
    access_details: >-
      Available for access by not-for-profit organizations via a simple material transfer agreement.
      Cell line identifier RRID:CVCL_B5P3.

raw_sources:
  - raw_data_details: >-
      Raw AP-MS mass spectrometry files for MDA-MB-468 cells treated with paclitaxel, deposited in the
      MassIVE repository and linked from the June 2026 Dataverse record.
    access_url: https://massive.ucsd.edu/
    source_caveats: >-
      The June 2026 record links the deposit as "MassIVE Repository" without printing the accession;
      the repository home page is given here as the access route.
  - raw_data_details: >-
      Raw AP-MS mass spectrometry files for MDA-MB-468 cells treated with vorinostat, deposited in the
      MassIVE repository and linked from the June 2026 Dataverse record.
    access_url: https://massive.ucsd.edu/
    source_caveats: >-
      The June 2026 record links the deposit as "MassIVE Repository" without printing the accession.
  - raw_data_details: >-
      Raw SEC-MS mass spectrometry files for KOLF2.1J iPSCs, undifferentiated and differentiated to
      neural progenitor cells, neurons and cardiomyocytes, deposited in the MassIVE repository and
      linked from the June 2026 Dataverse record.
    access_url: https://massive.ucsd.edu/
    source_caveats: >-
      The June 2026 record links the deposit as "MassIVE Repository" without printing the accession.
  - raw_data_details: >-
      Raw SEC-MS mass spectrometry files for MDA-MB-468 breast cancer cells with and without
      treatment, deposited in the MassIVE repository and linked from the June 2026 Dataverse record.
    access_url: https://massive.ucsd.edu/
    source_caveats: >-
      The June 2026 record links the deposit as "MassIVE Repository" without printing the accession.
  - raw_data_details: >-
      Raw perturb-seq sequence data for undifferentiated KOLF2.1J iPSCs. The June 2026 Dataverse
      record marks this external deposit as embargoed; the June 2025 record linked an NCBI BioProject
      in the Sequence Read Archive for the same data.
  - raw_data_details: >-
      Raw perturb-seq sequence data for MDA-MB-468 breast cancer cells with and without treatment. The
      June 2026 Dataverse record marks this external deposit as embargoed.
  - raw_data_details: >-
      CRISPRi Perturbation Atlas of induced pluripotent stem cells, deposited on Figshare and linked
      from the June 2026 Dataverse record.
    access_url: https://figshare.com/

instances:
  - instance_type: >-
      Four-channel immunofluorescence confocal microscopy image of MDA-MB-468 cells, showing one
      protein of interest (green) together with reference markers for nucleus (DAPI, blue),
      endoplasmic reticulum (calreticulin, yellow) and microtubules (tubulin, red).
    data_substrate: B2AI_SUBSTRATE:56
    data_topic: B2AI_TOPIC:19
    sampling_strategies:
      - is_sample: true
        is_random: false
        is_representative: false
        strategies: >-
          Proteins imaged are those addressable by validated Human Protein Atlas antibodies within
          the targeted chromatin-modifier and metabolic-enzyme panels; the highest-scoring antibody
          per protein is selected.
    source_caveats: >-
      No instance count is asserted. The project-wide figure of 53,788 immunofluorescent images
      reported on cm4ai.org spans all cell lines and all releases and is not apportioned to this
      instance type. The October 2025 Dataverse file descriptions state that 464 proteins of interest
      are imaged per treatment condition, which bounds the protein coverage but not the image count.
  - instance_type: >-
      Protein-protein interaction between a tagged bait protein and an associated prey protein,
      detected by affinity purification-mass spectrometry.
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:21
    source_caveats: >-
      No instance count is asserted. The project-wide figure of 1,374 protein interactions reported on
      cm4ai.org is not apportioned between AP-MS and SEC-MS, between cell lines, or across releases.
  - instance_type: >-
      Protein elution profile across size-exclusion chromatography fractions, quantified by mass
      spectrometry, from which co-eluting complexes are inferred.
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:28
  - instance_type: >-
      Single-cell transcriptional profile of a CRISPRi-perturbed cell, linked to the guide RNA
      identifying the targeted gene, together with the derived transcriptional and fitness phenotype
      for that gene.
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
    sampling_strategies:
      - is_sample: false
        is_random: false
        strategies: >-
          The KOLF2.1J screen is expressed genome-scale, covering 11,739 targeted genes with six guide
          RNAs per gene; the MDA-MB-468 screens cover a targeted panel of chromatin regulators under
          untreated, paclitaxel-treated and vorinostat-treated conditions.

relationships:
  - relationship_details: >-
      Cross-modality keying. Instances from the three modalities are linked by protein and gene
      identity: immunofluorescence images, mass-spectrometry-derived interaction and elution
      profiles, and CRISPRi perturbation profiles are keyed to the same protein or gene so that the
      modalities can be fused per protein by the downstream integration pipeline. The release states
      that the protein sets interrogated by the three modalities overlap only incompletely, so this
      keying does not resolve for every protein.
  - relationship_details: >-
      Within-interaction-data edges. Proteins are connected as bait-prey pairs in the AP-MS data and
      as co-eluting pairs in the SEC-MS data. These edges form the protein-protein proximity network
      that multi-resolution community detection partitions into the nested assemblies of the
      hierarchical cell map.

missing_data_documentation:
  - missing_data_patterns: >-
      Computed cell maps, the integrated product of the project, are absent from the release. The
      protein sets interrogated by SEC-MS, immunofluorescence imaging and CRISPRi perturb-seq overlap
      only incompletely. AP-MS data are present only for treated MDA-MB-468 cells. Immunofluorescence
      images are present only for MDA-MB-468 cells; images for iPSCs and their derivatives are
      announced as forthcoming.
    missing_data_causes: >-
      The release is an interim beta issued while data generation is still under way, and some
      component datasets remain under temporary pre-publication embargo, specifically the perturb-seq
      deposits for KOLF2.1J iPSCs and for MDA-MB-468 cells.
    handling_strategy: >-
      Missing components are scheduled for addition in subsequent quarterly releases through the end
      of the project in November 2026; users are directed to the release series rather than to any
      single deposit for complete coverage.

preprocessing_strategies:
  - preprocessing_details: >-
      Immunofluorescence acquisitions are released as four-channel images with a fixed channel
      assignment (protein of interest green, nuclei blue, endoplasmic reticulum yellow, microtubules
      red). RGB composite immunofluorescence images were added to the release series in the June 2025
      revision.
  - preprocessing_details: >-
      Antibody selection and image quality control follow Human Protein Atlas standard procedures for
      antibody validation and image scoring.
  - preprocessing_details: >-
      Each computational unit of the release pipeline is packaged by the FAIRSCAPE client, which
      validates inputs, attaches JSON-Schema data dictionaries with data elements mapped to public
      ontology vocabularies where appropriate, and emits an RO-Crate containing datasets, metadata and
      software or resolvable references to them. The FAIRSCAPE server then registers each crate and
      its individual components, assigns persistent, resolvable, globally unique identifiers using the
      ARK scheme, and computes end-to-end provenance entailments expressed in the EVI Evidence Graph
      Ontology and serialized in JSON-LD and RDF/XML.

anomalies:
  - anomaly_details: >-
      Archive sizes for the mass spectrometry packages differ substantially between the October 2025
      and June 2026 releases despite similar names and stated contents: cm4ai_mass-spec_KOLF2.zip is
      23.8 MB in October 2025 and 171.8 KB in June 2026, and cm4ai_mass-spec_MDA-MB-468.zip is 23.0 MB
      in October 2025 and 93.9 KB in June 2026. The sources do not explain the difference.

errata:
  - erratum_details: >-
      The June 2025 deposit (DOI 10.18130/V3/F3TD5R) is described in its own record as a revision of
      the June 2025 Data Release that adds RGB immunofluorescence images, corrects RO-Crate metadata
      and changes file naming conventions.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in the release were derived from commercially available, de-identified human cell lines and
      do not represent all biological variants that may be seen in the population at large. Two donor
      backgrounds are involved: MDA-MB-468, from a 51-year-old Black female with metastatic mammary
      adenocarcinoma, and KOLF2.1J, from a healthy male Northern European donor.
    mitigation_strategy: >-
      The release states this limitation explicitly and positions the data as one of a growing library
      of maps intended to span demographic and disease contexts.
  - bias_type: selection_bias
    bias_description: >-
      The proteins and genes interrogated across modalities were chosen as targeted panels of
      chromatin modifiers and metabolic enzymes implicated in cancer, neuropsychiatric and cardiac
      disorders, together with their interactors and selected signaling molecules, rather than sampled
      without preference across the proteome. Findings are therefore concentrated in the pathways
      those panels cover.
    mitigation_strategy: >-
      The CRISPRi perturbation screen in KOLF2.1J iPSCs is expressed genome-scale, covering 11,739
      targeted genes, which broadens coverage beyond the targeted panels for that modality.
  - bias_type: measurement_bias
    bias_description: >-
      Each modality has characteristic detection limits. Affinity purification-mass spectrometry
      depends on successful endogenous tagging and on bait recovery; immunofluorescence depends on
      antibody availability and quality for the target protein; and size-exclusion chromatography-mass
      spectrometry recovers only proteins abundant enough to be quantified in fractions. Proteins that
      one platform cannot see are absent from that modality rather than absent from the cell.
    mitigation_strategy: >-
      Two orthogonal mass spectrometry approaches (AP-MS and SEC-MS) are applied to the same cellular
      contexts, and the project design fuses complementary modalities so that each finding rests on
      more than one line of evidence.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      This is an interim release. It does not contain the predicted or computed cell maps, which are
      the project's eventual product and which will be added in future releases.
    scope_impact: >-
      Users seeking the integrated hierarchical cell maps will not find them here; only the input data
      streams from which such maps are built are provided.
    recommended_mitigation: >-
      Follow the quarterly release series, which continues through November 2026.
  - limitation_type: integration_limitation
    limitation_description: >-
      Protein-protein interaction data (SEC-MS), protein localization data (immunofluorescence
      imaging) and CRISPRi perturb-seq data interrogate sets of proteins that overlap only
      incompletely.
    scope_impact: >-
      The set of proteins for which all three modalities are available is smaller than the set covered
      by any one modality, constraining fully multimodal analyses.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Some component datasets remain under temporary pre-publication embargo and are therefore not
      accessible from the release, notably the perturb-seq deposits for KOLF2.1J iPSCs and for
      MDA-MB-468 cells.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The current release is most suitable for bioinformatics analysis of the individual datasets, and
      meaningful analysis requires domain expertise.
    recommended_mitigation: >-
      The CM4AI project provides tutorials, documentation and hands-on training, including a CodeFest
      event and an in-person internship, to support users approaching the data.

intended_uses:
  - use_category: AI-ready datasets to support research in functional genomics
    usage_notes: >-
      Data are packaged with provenance graphs, schemas and persistent identifiers so that they can be
      consumed directly by machine learning workflows.
  - use_category: AI model training
    examples:
    - >-
      Training of "visible" machine learning systems, including visible neural networks, whose
      internal structure is informed by multi-scale cell and tissue architecture rather than being an
      opaque predictor.
  - use_category: Cellular process analysis
  - use_category: >-
      Analysis of cell architectural changes and interactions in the presence of specific disease
      processes, treatment conditions, or genetic perturbations
    examples:
    - >-
      Comparison of protein complexes and subcellular localization in MDA-MB-468 breast cancer cells
      untreated versus treated with paclitaxel or vorinostat, and in KOLF2.1J iPSCs versus
      iPSC-derived neural progenitor cells, neurons and cardiomyocytes.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context involving
      patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license under which the data are
      released; it requires a separate license negotiation with the copyright holder, which is the
      University of California San Diego, Stanford University and/or the University of California San
      Francisco depending on the specific data package.

existing_uses:
  - examples: >-
      The genome-scale CRISPRi perturbation cell atlas of KOLF2.1J induced pluripotent stem cells
      included in the release is analyzed in Nourreddine S et al., "A perturbation cell atlas of human
      induced pluripotent stem cells", bioRxiv 2024.11.03.621734, which maps transcriptional and
      fitness phenotypes for 11,739 targeted genes and validates findings by phenotypic,
      protein-interaction and metabolic tracing assays.
  - examples: >-
      CM4AI datasets, tools and standards were distributed and used for hands-on training at a virtual
      CodeFest in March 2024, attended by 38 registrants, with tutorials explaining how the data were
      derived and integrated and providing production-ready software for reproducing the datasets.

future_use_impacts:
  - impact_details: >-
      The CM4AI Ethics module anticipates potential applications of the data and of the AI systems
      derived from them, integrating that anticipation into data governance frameworks in order to
      optimize benefits, mitigate potential risks and promote use for the collective good. The work
      uses a Value-Sensitive Design-inspired methodology, an axiological repository of relevant moral
      values, and a CM4AI Life Cycle framework that sets governance milestones across data generation
      and AI system development.
  - impact_details: >-
      Because the release is intended for AI model training but consists of laboratory cell-line data
      that have not been validated for clinical application, models trained on it could be applied in
      settings the data do not support. The release therefore states the boundary explicitly and
      excludes clinical decision-making and patient care absent appropriate regulatory oversight and
      approval.

distribution_formats:
  - format: ZIP archive
    media_type: application/zip
    access_urls:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
      - https://cm4ai.org/data-releases/
    notes: >-
      All ten release components are distributed as ZIP archives. Files are downloaded individually
      from the Dataverse file table or programmatically through the Dataverse Data Access API; the
      whole dataset exceeds the repository's 1.9 GB ZIP download limit, so bulk download of the
      complete release in one archive is not offered.
  - format: >-
      RO-Crate, comprising JSON-LD metadata, JSON-Schema data dictionaries and EVI provenance graphs,
      with human-readable HTML datasheet and provenance-graph renderings
    media_type: application/ld+json
    notes: >-
      Distributed within the release metadata archive. Provenance-graph HTML renderings distributed in
      earlier releases require download to display correctly and do not render in the Dataverse
      in-browser preview.

distribution_dates:
  - release_dates: >-
      2026-06-17 - June 2026 Data Release (Beta), version 2.0, DOI 10.18130/V3/HIGT4C. Three
      immunofluorescence image archives within this version carry a file-level publication date of
      2026-07-15.
  - release_dates: 2025-10-31 - October 2025 Data Release (Beta), DOI 10.18130/V3/K7TGEM
  - release_dates: 2025-07-01 - June 2025 Data Release (Beta), DOI 10.18130/V3/F3TD5R
  - release_dates: 2025-03-03 - March 2025 Data Release (Beta), DOI 10.18130/V3/B35XWX
  - release_dates: >-
      May 2024 Data Release, DOI 10.18130/V3/DXWOS5; the archive listing on cm4ai.org gives the month
      but no day.

third_party_sharing:
  - is_shared: true
    notes: >-
      Component raw data are deposited in third-party public repositories - MassIVE for mass
      spectrometry files, NCBI for sequence data, and Figshare for the iPSC CRISPRi perturbation atlas
      - and the packaged release is distributed publicly through the University of Virginia Dataverse.
      Distribution of some components is deferred by temporary pre-publication embargo.

license_and_use_terms:
  data_use_permission: no_commercial_use
  license_terms: >-
    Released under the Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International license
    (CC BY-NC-SA 4.0). Users may share and adapt the material provided they give appropriate credit,
    link to the license and indicate changes; may not use the material for commercial purposes; and
    must distribute contributions built on the material under the same license. Attribution is
    required to the copyright holders and to the authors, and publications referencing the data or
    derived products should cite both the related publication and the data collection itself.
    Commercial use falls outside the license and requires a separate license negotiation with the
    copyright holder, which is the University of California San Diego, Stanford University and/or the
    University of California San Francisco depending on the specific data package. Software released
    by the project is licensed separately and less restrictively: the FAIRSCAPE AI-readiness framework
    under the MIT license and the Tools data integration pipeline under the BSD-3 license.
  contact_person:
    id: ORCID:0000-0002-1708-8454
    name: Trey Ideker

ip_restrictions:
  restrictions:
  - >-
    Copyright in the released data is held by the Regents of the University of California except where
    otherwise noted; raw spatial proteomics image data are copyright the Board of Trustees of the
    Leland Stanford Junior University. Rights to grant commercial licenses rest with the University of
    California San Diego, Stanford University and/or the University of California San Francisco
    according to which institution generated the specific data package, and a Data Access Committee
    supervises ethical matters related to dataset distribution and to potential dual licensing for
    commercial use.
  source_caveats: >-
    The copyright statement is transcribed from the March 2025 Dataverse record and the 2024 bioRxiv
    preprint; the June 2026 record does not restate it, so no calendar year is asserted here.

data_governance:
  committee_name: CM4AI Data Governance Committee
  committee_contact:
    id: ORCID:0000-0003-4535-3486
    name: Jillian Parker
  access_review_process: >-
    Files published in the Dataverse release are publicly downloadable without an access request,
    under the terms of the CC BY-NC-SA 4.0 license; the repository's guestbook and access-request
    machinery are not engaged for these files. Component datasets under temporary pre-publication
    embargo are withheld until the embargo lifts. Commercial use lies outside the public license and
    is handled by separate negotiation with the copyright holder, supervised by the Data Access
    Committee.
  stewardship_roles:
  - >-
    Data governance for the release is directed by the CM4AI Data Governance Committee, whose named
    contact is Jillian Parker at the University of California San Diego
    (jillianparker@health.ucsd.edu). Ethical review is provided by Vardit Ravitsky
    (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon
    (jean-christophe_belisle-pipon@sfu.ca). Program management and project-related inquiries are
    handled by Swathi Thaker at the University of Alabama at Birmingham (snthaker@uab.edu), with
    website support from Zhandos Sembay (zsembay8@uab.edu). Trey Ideker at the University of
    California San Diego is the designated point of contact for the deposited record. Archival
    stewardship rests with the University of Virginia Dataverse.
  source_caveats: >-
    The June 2026 record names the data governance and ethical review contacts but does not enumerate
    committee membership, decision timeframes or an appeal process, and does not name an accountable
    organization; none is asserted here.

regulatory_restrictions:
  confidentiality_level: unrestricted
  hipaa_compliant: not_applicable
  regulatory_restrictions:
  - >-
    The release records that the work does not involve human subjects, that samples are de-identified,
    and that the data are not FDA regulated. No export control or similar restriction is stated. The
    stated regulatory boundary is on use rather than on access: the data are not to be used in
    clinical decision-making or in any context involving patient care without appropriate regulatory
    oversight and approval.
  other_compliance: >-
    Participants accessing Bridge2AI data, including CM4AI datasets, through the Bridge2AI Open House
    attest and commit to a Code of Conduct developed by the Bridge2AI Data Sharing and Dissemination
    Working Group with support from the Bridge2AI Ethics Working Group.

human_subject_research:
  involves_human_subjects: false
  ethics_review_board: >-
    No institutional review board approval is recorded, consistent with the release's statement that
    the work does not involve human subjects. Ethical oversight is provided instead by the CM4AI
    Ethics module; the named ethical review contacts for the release are Vardit Ravitsky and
    Jean-Christophe Belisle-Pipon.
  regulatory_compliance:
  - >-
    The release records that the data are not FDA regulated and that samples are de-identified.
  notes: >-
    The 2024 project preprint states that CM4AI data are distinctive within Bridge2AI in being
    non-clinical, derived from tissue cultures, and are considered de-identified in that they cannot,
    with current knowledge, be matched to a human subject.

ethical_reviews:
  - contact_person:
      id: ORCID:0000-0002-7080-8801
      name: Vardit Ravitsky
    review_details: >-
      Named ethical review contact for the CM4AI data releases (ravitskyv@thehastingscenter.org). The
      June 2026 Dataverse record names this person for ethical review but does not state a reviewing
      organization; the author list gives an affiliation of University of Montreal and the contact
      email is at a Hastings Center domain.
  - contact_person:
      id: ORCID:0000-0002-8965-8153
      name: Jean-Christophe Belisle-Pipon
    review_details: >-
      Named ethical review contact for the CM4AI data releases
      (jean-christophe_belisle-pipon@sfu.ca). The June 2026 Dataverse record names this person for
      ethical review but does not state a reviewing organization; the author list gives an affiliation
      of Simon Fraser University.
  - review_details: >-
      The CM4AI project's Ethics module works with the Data Acquisition, Tools and Standards modules
      on ethical preparation, licensing, dissemination and data access supervision, balancing openness
      of the data against protection of intellectual property and monitoring of potential
      commercialization. It applies a Value-Sensitive Design-inspired methodology, is building an
      axiological repository of relevant moral values, and is formulating a CM4AI Life Cycle framework
      that sets governance milestones across data generation and AI system development.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    The June 2026 release records that samples are de-identified and that the work does not involve
    human subjects. Data are generated from two established human cell lines rather than from
    identifiable primary human material: MDA-MB-468, obtained from ATCC, and KOLF2.1J, distributed
    through the HipSci resource. The 2024 project preprint states that the data are considered
    de-identified in that they cannot, with current knowledge, be matched to a human subject.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The released files contain molecular measurements - images, mass spectra derivatives and
      single-cell transcriptional profiles - from established cell lines, with no personal identifiers
      and no protected health information. Donor characteristics of the two source lines are described
      in the published literature about those lines rather than recorded as data elements in the
      release.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      No confidential content is withheld from the released files, which are publicly downloadable.
      Some component datasets are temporarily withheld under pre-publication embargo, which is a
      timing restriction pending publication rather than a confidentiality classification; the release
      records the overall confidentiality level as unrestricted.

