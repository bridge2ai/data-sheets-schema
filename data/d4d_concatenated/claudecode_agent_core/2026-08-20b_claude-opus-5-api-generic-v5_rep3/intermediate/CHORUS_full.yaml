subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Admissions in the current released dataset are drawn from adult intensive care, pediatric
      intensive care (PICU) and neonatal intensive care (NICU) settings across 14
      data-contributing hospitals.

subsets:
  - id: https://chorus4ai.org/#dataset-holdout-test-set
    name: CHoRUS holdout test set
    description: >-
      A sequestered holdout portion of the dataset, provisioned for external validation of
      AI-developed models to aid marketplace adoption and implementation in acute and critical
      care.
    is_data_split: true

splits:
  - split_details: >-
      The project sequesters holdout datasets separate from the data used for model development;
      the holdout test set is made accessible for external model validation rather than for
      training.

sampling_strategies:
  - is_sample: true
    strategies: >-
      A legal framework is established for collecting data at scale, sampling to ensure
      comprehensive sets of patient conditions and clinical treatment strategies. Federated access
      enables sampling methods intended to ensure a balanced and diverse cohort across the 14
      data-acquisition hospitals.

acquisition_methods:
  - acquisition_details: >-
      Retrospective extraction of clinical data from hospital source systems at 14
      data-acquisition hospitals — structured EHR data, imaging from PACS, telemetry from bedside
      monitors via gateway/middleware, and EEG from hospital EEG databases — followed by
      standardization to the OMOP Common Data Model and delivery as a CHoRUS data extract.
    was_directly_observed: true
    was_validated_verified: true
    notes: >-
      Validation is supported by pooled semantic mappings with an associated clinical validation
      SOP, and by characterization reports returned to sites following their data submissions.
  - acquisition_details: >-
      Derived data products are generated from the source records: unstructured clinical notes are
      extracted and tokenized with the OHNLP toolkit, OMOP Location entities are geocoded via
      DeGauss to supply contextual factors such as distance to the nearest hospital, and data are
      transformed using approaches that limit re-identification.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      chorus-extract-upload, a Python toolset for creating and uploading a CHoRUS Data Extract at
      contributing sites.
  - mechanism_details: >-
      The OHNLP toolkit, used to extract and tokenize unstructured clinical notes.
  - mechanism_details: >-
      Hospital PACS archives, from which radiology imaging is exported in DICOM.
  - mechanism_details: >-
      Bedside patient monitors together with gateway/middleware systems, from which telemetry
      waveforms are captured.
  - mechanism_details: >-
      Hospital EEG databases, from which EEG waveforms are extracted in EDF+ and Persyst formats.
  - mechanism_details: >-
      Standard operating procedures published in the Chorus_SOP documentation site, which provide
      an interactive step-by-step workflow instructing data contributing sites on extracting and
      contributing clinical data to CHoRUS.
  - mechanism_details: >-
      Dockerized container applications (chorus-container-apps) deployed on Azure to support
      CHoRUS services, including the cloud enclave in which OMOP tables and telemetry are held.

collection_timeframes:
  - timeframe_details: >-
      Data collection is retrospective. Acquisition is ongoing across the funded project period of
      2022-09-01 to 2026-11-30; as of August 2025 the dataset covered 14 hospitals, and as of
      September 2025 imaging de-identification and EEG extraction remained in process.
    source_caveats: >-
      The sources give the award period and status milestones but do not state the calendar range
      of the clinical encounters included in the dataset.

data_collectors:
  - collector_details: >-
      Fourteen data-acquisition hospitals, drawn from the 20 academic centers spanned by the
      CHoRUS collaboration, extract, curate and submit CHoRUS data extracts from their own
      clinical systems.
    role: academic_institution
  - collector_details: >-
      Data site managers at each contributing site follow the validated Chorus_SOP workflow, post
      issues to the Standards and Data Acquisition discussion areas, and provide regular status
      updates on their progress in creating and curating a CHoRUS-specific clinical data extract.
    role: academic_institution

direct_collection:
  - is_direct: false
    collection_details: >-
      Data are obtained retrospectively from hospital clinical systems (EHR, PACS, bedside
      monitors, EEG databases) at the data-contributing sites rather than collected directly from
      the patients whose care generated them.

raw_data_sources:
  - source_description: >-
      Structured electronic health record data from hospital EHR systems at the 14
      data-acquisition hospitals, covering demographics, diagnoses, procedures, medication
      administration and nursing flowsheets.
    source_type: hospital electronic health record system
    raw_data_format: site-native EHR extracts, standardized to the OMOP Common Data Model
    access_details: Controlled access; standardized data are held in the CHoRUS cloud enclave.
  - source_description: >-
      Unstructured clinical notes from hospital EHR systems.
    source_type: hospital electronic health record system
    raw_data_format: free-text clinical notes, extracted and tokenized to the OHNLP schema
    access_details: >-
      Notes remain stored locally at contributing sites; only tokens are available in the enclave,
      under controlled access.
  - source_description: Radiology imaging studies held in hospital PACS archives.
    source_type: picture archiving and communication system (PACS)
    raw_data_format: DICOM
    access_details: >-
      Controlled access; approximately 1,000 de-identified images were available as of September
      2025 with de-identification in process for a larger cohort.
  - source_description: >-
      Continuous telemetry waveforms recorded by bedside patient monitors and captured through
      gateway/middleware systems.
    source_type: bedside physiological monitoring system
    raw_data_format: converted to WFDB using an extended PhysioNet schema
    access_details: Controlled access; telemetry is held in the CHoRUS cloud enclave.
  - source_description: Electroencephalography recordings held in hospital EEG databases.
    source_type: hospital EEG database
    raw_data_format: EDF+ and Persyst
    access_details: Controlled access; extraction was in process as of September 2025.
  - source_description: >-
      Contextual and social determinants of health elements, including geographic factors such as
      distance to the nearest hospital, associated with OMOP Location entities.
    source_type: derived geospatial and contextual data
    raw_data_format: OMOP Location entities geocoded via DeGauss

preprocessing_strategies:
  - preprocessing_details: >-
      Standardization of site-native clinical data to the OMOP Common Data Model, using validated
      semantic mappings maintained as pooled tabular mappings in the chorus-mapping repository
      together with an associated clinical validation SOP.
  - preprocessing_details: >-
      Extraction and tokenization of unstructured electronic health record text using the OHNLP
      toolkit, producing tokenized notes conforming to the OHNLP open-source schema.
  - preprocessing_details: >-
      Conversion of telemetry waveforms to WFDB using waveform conversion scripts maintained in
      the chorus_waveform repository, following an extended PhysioNet schema.
  - preprocessing_details: >-
      Transformation of data using approaches that limit re-identification, including
      de-identification of imaging prior to release and tokenization of clinical text.
  - preprocessing_details: >-
      Geocoding of OMOP Location entities through DeGauss (UF-Geocoding) so that data elements
      feature appropriate contextual factors such as geographic distance to the nearest hospital.

cleaning_strategies:
  - cleaning_details: >-
      Characterization reports are produced and returned to contributing sites following each data
      submission (CHoRUSReports), allowing sites to review and correct their extracts. Sites also
      report blocking issues through the Standards and Data Acquisition discussion areas and
      status trackers so that problems in extract creation and submission can be resolved.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is developed to label data with targets important
      for prediction; the project's data pillar builds capabilities across the multi-center
      network to acquire, standardize, tokenize, store, visualize and label data.

machine_annotation_tools:
  - tools: OHNLP toolkit
    tool_descriptions: >-
      Open-source natural language processing toolkit used to extract and tokenize unstructured
      clinical notes, producing output conforming to the OHNLP open-source schema.

missing_data_documentation:
  - missing_data_patterns: >-
      Coverage differs by modality: of the released admissions, 7,642 have radiology data;
      approximately 1,000 de-identified images were available as of September 2025; EEG data were
      not yet available; and full clinical note text is absent from the enclave, with only tokens
      present.
    missing_data_causes: >-
      Imaging de-identification for the larger cohort and EEG extraction were still in process,
      and clinical notes are retained locally at contributing sites for privacy reasons.
    handling_strategy: >-
      Published metadata schemas exist or are planned for each data type, so that availability per
      modality is documented; acquisition continues toward the anticipated final dataset of
      100,000 admissions across 9 modalities.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Imaging coverage is partial: approximately 1,000 de-identified images were available as of
      September 2025, with de-identification in process for a larger cohort, and 7,642 of the
      released admissions have radiology data.
    recommended_mitigation: >-
      Check current imaging availability before designing analyses that depend on image volume.
  - limitation_type: coverage_limitation
    limitation_description: >-
      EEG waveform data were still being extracted as of September 2025 and were not yet available
      in the enclave.
  - limitation_type: integration_limitation
    limitation_description: >-
      Clinical notes are not moved into the cloud enclave; they remain stored locally at
      contributing sites, and only tokenized representations produced with the OHNLP toolkit are
      available to users.
    scope_impact: >-
      Analyses requiring full narrative text cannot be performed within the enclave.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset covers admissions to adult, pediatric and neonatal intensive care units at 14
      data-contributing hospitals within a 20-center academic consortium, so it characterizes
      acute and critical illness rather than the general patient population.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data collection is retrospective, so the dataset reflects care as documented in past
      hospital records rather than prospectively collected observations.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Admissions are drawn from the 14 hospitals that serve as data-acquisition centers within a
      20-center academic consortium, so the cohort reflects the patient populations and practice
      patterns of those centers.
    mitigation_strategy: >-
      Federated access enables sampling methods intended to ensure a balanced and diverse cohort,
      and sampling is designed to ensure comprehensive sets of patient conditions and clinical
      treatment strategies; patient-focused ethical and legal work addresses the management of
      bias alongside privacy, accounting for social determinants of health.

intended_uses:
  - use_category: Machine learning and artificial intelligence research in acute and critical care
    examples:
    - >-
      Characterizing acute and critical care illness, predicting complications and deterioration,
      and measuring treatment response.
    usage_notes: >-
      Analysis is performed within the Bridge2AI AI/ML for Clinical Care Collaborative Cloud
      enclave, using the OHDSI/OMOP tool stack and R or Python.
  - use_category: External validation of AI/ML models
    examples:
    - >-
      Evaluating models developed elsewhere against the sequestered CHoRUS holdout test set to
      support marketplace adoption and implementation in acute and critical care.
  - use_category: Workforce training and AI literacy
    examples:
    - >-
      Hands-on training with canonical Jupyter notebooks, OHDSI/OMOP common data model workshops,
      structured EHR datasets, clinical deep learning and ethics of clinical AI.

existing_uses:
  - examples: >-
      As of the September 2025 CHoRUS dataset briefing, the datasets are being used for training
      activities and for publications.
  - examples: >-
      The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, running November 2025
      to July 2026, up to 30 trainees) uses the CHoRUS data for trainee coursework, development of
      practical use cases, collaborative research on the Bridge2AI Clinical Care Cloud platform,
      poster presentations at the Bridge2AI and AIM-AHEAD annual meetings, conference abstracts
      and peer-reviewed manuscripts.

future_use_impacts:
  - impact_details: >-
      The dataset is expected to catalyze the biomedical research and expertise necessary to
      promote patient-focused deployment of AI in acute and critical care, including external
      validation of models to aid marketplace adoption and improve care and outcomes of patients
      requiring critical care.
  - impact_details: >-
      Privacy, bias, provenance and trustworthiness are anticipated concerns of future use; the
      consortium evaluates community perspectives on clinical care AI, conducts community-facing
      ethics focus groups to determine what data is appropriate for public sharing, analyzes the
      existing legal and regulatory landscape, and applies transformations that limit
      re-identification.

license_and_use_terms:
  license_terms: >-
    Access to the dataset is controlled. All users must sign a licensing agreement, included in
    the registration form, before gaining access to the dataset. Registration requires name, email
    and institution, and a ".edu" email address is required to gain access; program administrators
    will assist with access where needed. Once access is granted and compute is provisioned, the
    user is notified by email.

data_governance:
  accountable_organization:
    name: Massachusetts General Hospital
  committee_contact:
    id: mailto:jared.houghtaling@tuftsmedicine.org
    name: Jared Houghtaling
  access_review_process: >-
    The dataset is under controlled access. Access requests are directed to the CHoRUS team at
    dbold@emory.edu or jared.houghtaling@tuftsmedicine.org. For participants in the AIM-AHEAD
    Bridge2AI for Clinical Care Training Program, access is arranged through a registration form
    capturing name, email and institution and incorporating a licensing agreement that must be
    signed; a ".edu" email address is required, and an email is sent once access is granted and
    compute has been provisioned.

ip_restrictions:
  restrictions:
  - >-
    The CHoRUS project's software is licensed under the MIT License as stated in the chorus-ai
    GitHub organization README, with individual repositories carrying their own terms (for example
    the Chorus_SOP documentation repository is Apache-2.0). Access to the data themselves is
    governed by a signed licensing agreement rather than an open license.

regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions:
  - >-
    Access to all CHoRUS data types is controlled. The project establishes a legal framework for
    collecting data at scale and analyzes the existing legal and regulatory landscape for clinical
    care AI, working with regulatory agencies alongside academic and industry partners.

human_subject_research:
  involves_human_subjects: true
  special_populations:
  - >-
    The released cohort includes admissions from pediatric (PICU) and neonatal (NICU) intensive
    care units, so minors are represented among the patients whose records are included.

at_risk_populations:
  at_risk_groups_included: true
  special_protections:
  - >-
    Data are transformed using approaches that limit re-identification, clinical notes are
    tokenized and retained locally at contributing sites, imaging is de-identified before release,
    and all data types are held under controlled access requiring a signed licensing agreement.
  source_caveats: >-
    The sources establish that pediatric and neonatal admissions are included but do not describe
    consent, assent or guardian permission procedures for these populations.

is_deidentified:
  method: >-
    Tokenization of unstructured EHR text with the OHNLP toolkit, de-identification of imaging
    prior to release, and transformation approaches that limit re-identification.
  deidentification_details: >-
    Data are standardized, tokenized and transformed using approaches that limit
    re-identification. Clinical notes are stored locally at contributing sites, with only tokens
    shared into the enclave. Imaging de-identification was complete for roughly 1,000 images and
    in process for a larger cohort as of September 2025. The project maintains supporting tooling
    including a CTP-deid repository and a privacy scan tool for medical records.

participant_privacy:
  - anonymization_method: >-
      Tokenization of unstructured clinical text and de-identification of imaging, combined with
      data transformations designed to limit re-identification.
    reidentification_risk: >-
      The project explicitly transforms data using approaches that limit re-identification and
      pursues legal and ethical research to manage privacy; residual risk is managed through
      controlled access to all data types.
    data_linkage: >-
      Clinical notes remain at contributing sites and only tokens are linked into the enclave
      alongside OMOP, imaging and waveform data for a given admission.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset consists of patient-level critical care clinical records: demographics,
      diagnoses, procedures, medication administration, high-frequency nursing flowsheets, tokenized
      clinical notes, radiology imaging, telemetry and EEG waveforms, together with social
      determinants of health and geographic contextual factors such as distance to the nearest
      hospital.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Every data type in the CHoRUS inventory — demographics, medication administration,
      procedures, nursing flowsheets, diagnoses, clinical notes, imaging, telemetry waveforms and
      EEG waveforms — is listed with controlled access control. Full clinical note text is not
      released at all: notes are stored locally at contributing sites and only tokens are shared.

ethical_reviews:
  - review_details: >-
      Ethics is one of the project's three pillars ("Ethical and Trustworthy AI"). The consortium
      performs community-facing ethics focus groups to determine what data is appropriate for
      public sharing, evaluates community perspectives on clinical care AI to increase the
      trustworthiness of provenance and privacy, and analyzes the existing legal and regulatory
      landscape while developing new approaches. Patient-focused efforts determine the ethical and
      legal approaches used to manage privacy and bias while accounting for social determinants of
      health.
    source_caveats: >-
      The sources describe the project's ethics program but do not state IRB approval numbers or
      the identity of a reviewing ethics committee for the dataset.

distribution_formats:
  - format: >-
      OMOP Common Data Model tables (with extensions for high-frequency nursing flowsheets) for
      demographics, diagnoses, procedures, medication administration and nursing flowsheets
  - format: OHNLP open-source schema output for extracted and tokenized clinical notes
  - format: DICOM for radiology imaging exported from PACS
  - format: WFDB, following an extended PhysioNet schema, for bedside telemetry waveforms
  - format: EDF+ and Persyst for hospital EEG waveforms

distribution_dates:
  - release_dates: >-
      A current released dataset was available as of August–September 2025, covering 14
      contributing hospitals; access for AIM-AHEAD Bridge2AI for Clinical Care Cohort 2 trainees
      began with the program start on 2025-11-17.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is made available beyond the creating consortium under controlled access:
      external researchers and training-program participants work with the data inside the
      Bridge2AI AI/ML for Clinical Care Collaborative Cloud after registering, signing a licensing
      agreement and being provisioned compute.

maintainers:
  - maintainer_details: >-
      Ciera McCrary, Program Manager, Massachusetts General Hospital; contact
      cmccrary@mgh.havard.edu as published on chorus4ai.org.
    role: academic_institution
  - maintainer_details: >-
      Data access requests are handled by the CHoRUS team at dbold@emory.edu (Emory University)
      and jared.houghtaling@tuftsmedicine.org (Tufts Medicine).
    role: academic_institution
  - maintainer_details: >-
      The chorus-ai GitHub organization hosts 28 repositories of software, semantic mappings,
      standard operating procedures and project management overviews; versions, maintainers and
      other metadata for CHoRUS packages are listed on the project's package status page.
    role: academic_institution

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Clinical collaborators can contribute to semantic mapping and validation through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings and a clinical
    validation SOP. Software developers contribute through the repositories described in the
    chorus-developer web guide. Data-contributing sites raise issues in the Standards Discussions
    and Data Acquisition Discussions areas and submit regular status updates either through the
    GitHub interface or through a Google Form whose submissions update GitHub issues via the
    GitHub API. Downstream analytics collaborators are invited to reach out via the project
    contact addresses.

updates:
  update_details: >-
    Data acquisition is ongoing toward an anticipated final dataset of 100,000 patient admissions
    across 9 data modalities from 14 contributing hospitals; imaging de-identification for the
    larger cohort and EEG extraction were in process as of September 2025, and published metadata
    schemas are planned for clinical notes, imaging and EEG. Contributing sites provide regular
    status updates on their extract creation and curation progress, which are tracked in the
    Standards Project and Data Acquisition Project boards, and task tracking across teams is
    consolidated in a central GitHub project.

external_resources:
  - external_resources: >-
      CHoRUS project website at https://chorus4ai.org/, providing project overview, tools, data
      acquisition, standards, community engagement, ethics, dataset snapshot and learning
      resources pages.
  - external_resources: >-
      chorus-ai GitHub organization at https://github.com/chorus-ai, with 28 repositories
      including chorus-container-apps, Chorus_SOP, chorus_waveform, chorus_waveform_resources,
      chorus-extract-upload, CHoRUSReports, chorus-apps-internal, cloud_public, CTP-deid,
      UF-Geocoding, privacy_scan_tool, CADA and data_acq_SOP.
