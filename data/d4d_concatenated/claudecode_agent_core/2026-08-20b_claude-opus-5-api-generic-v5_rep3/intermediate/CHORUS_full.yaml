purposes:
  - response: >-
      Generate data for ML/AI applications aimed at characterizing acute and critical care
      illness, predicting complications, and measuring treatment response among patients with
      acute or critical illness.
  - response: >-
      Develop a publicly available, AI-ready critical care dataset while ensuring that the methods
      promote privacy, accountability and clinical benefit.
  - response: >-
      Provision a holdout test set, accessible for external validation of models, to aid
      marketplace adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      Develop the most diverse, high-resolution, ethically sourced, AI-ready data set to answer
      the grand challenge of improving recovery from acute illness.
  - response: >-
      Cultivate expertise in the lay and scientific community to improve AI literacy and
      utilization, and promote a new generation of AI clinicians and scientists.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine
      learning in critical care; developing high-resolution multi-center data sets is a critical
      first step towards actionable and trustworthy AI.
  - response: >-
      Existing resources lack a diverse, high-resolution, ethically sourced and AI-ready critical
      care data set with harmonized multi-modal EHR, waveform, imaging and text data.
  - response: >-
      Existing legal and regulatory approaches for collecting and sharing critical care data at
      scale are incomplete; the project establishes a legal framework for collection at scale and
      analyzes the existing legal and regulatory landscape.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of AI/ML models against a sequestered holdout test set to support
      marketplace adoption and clinical implementation.

