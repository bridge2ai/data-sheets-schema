id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI)
  flagship dataset consists of multimodal data collected from individuals with and without
  type 2 diabetes mellitus (T2DM) and harmonized across three data collection sites
  (University of Alabama at Birmingham, University of California San Diego, and University
  of Washington). Version 3.0.0 contains data from 2280 participants collected between
  19 July 2023 and 1 May 2025. The composition of the dataset was designed with future
  AI/machine learning studies in mind, including recruitment sampling procedures aimed at
  approximately equal distribution of participants across diabetes severity, and a data
  acquisition protocol spanning multiple domains — survey data, physical measurements,
  clinical laboratory data, retinal imaging, electrocardiography, wearable device data and
  home environmental sensing — to enable downstream analyses that would not be feasible
  with claims or electronic health record data alone. The scientific goal is to better
  understand salutogenesis, the pathway from disease to health, in T2DM. The released data
  contain no protected health information; information related to the sex and
  race/ethnicity of participants and to medications used has also been removed from this
  public version. A controlled-access version holds the more sensitive variables. The
  dataset contains 356,343 files and is approximately 3.82 TB in size.
