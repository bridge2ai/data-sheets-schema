third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed and available for public use through the FAIRhub platform at
      https://fairhub.io/, subject to verified-ID login, self-attestation that the data will
      be used only for type 2 diabetes related research, and acceptance of the license terms.

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes
    examples:
      - >-
        Downstream pseudotime manifold analysis to reconstruct a temporal atlas of T2DM
        development and reversal towards health
      - Multimodal model development for understanding salutogenesis in T2DM
    usage_notes: >-
      The public version of the dataset may be used only for type 2 diabetes related research;
      a controlled version allows more generic use. The data are described as "AI-ready",
      enabling AI/ML research without reformatting and preprocessing.
  - use_category: Methodological blueprint for AI-ready dataset creation
    examples:
      - >-
        Reuse of the project's guidelines for project management and for data collection,
        management and sharing by future data generation projects
      - >-
        Reuse of the Clinical Dataset Structure (CDS) specification for organizing clinical
        research datasets with structured metadata
  - use_category: Training and workforce development
    usage_notes: >-
      The project hosts a year-long research internship program in which interns develop
      healthsheets describing the data, map project data into common data models, and analyze
      equity and ethical issues.

prohibited_uses:
  - prohibition_reason: >-
      Licensees shall not make clinical treatment decisions based on the data, as it is
      intended solely as a research resource.
  - prohibition_reason: >-
      Licensees shall not use or attempt to use the data, alone or in concert with other
      information, to compromise or otherwise infringe the confidentiality of information
      about a data subject; to invade or compromise the privacy of any data subject; to
      attempt to identify or contact any data subject or group of data subjects; to extract or
      extrapolate identifying information; to establish a data subject's membership in a
      particular group of persons; or otherwise to cause harm or injury to any data subject.
  - prohibition_reason: >-
      Licensees shall not share or distribute data with any third party model vendor or
      developer for training or development purposes — including model weight modification and
      other adjustments to a model's logic or operation — even if that vendor is party to a
      Business Associate Agreement with the Licensee's institution. Short-term interaction
      such as prompting or querying a third party model under a BAA, for analysis rather than
      training, is permitted.
  - prohibition_reason: >-
      Licensees shall not transfer, license, sublicense, sell, assign, display, share or
      otherwise convey any portion of the data or any derivative work to any third party other
      than another licensee bound by an identical agreement.
  - prohibition_reason: >-
      Licensees shall not store the data anywhere other than on servers and devices maintained
      by and located within their institution, or on cloud or remote storage and backup
      services covered by a HIPAA-approved Business Associate Agreement with that institution.
  - prohibition_reason: >-
      Licensees shall not publish more than five images or figures containing small
      representative samples of the data per paper, and shall not make larger amounts of data
      available via supplemental files, zip archives, code packages or other means.
  - prohibition_reason: >-
      Licensees shall take no action to remove, obscure, alter or mask the static watermarking
      that may be applied to identify them for security purposes.

discouraged_uses:
  - discouragement_details: >-
      Treating the cohort as demographically representative of the US population is
      discouraged: the sample is deliberately balanced rather than population-matched,
      recruitment is predominantly urban and hospital-based, and races and ethnicities such as
      Pacific Islanders and Native Americans are not represented.
  - discouragement_details: >-
      Using the pilot and interim releases as if they were balanced across race/ethnicity,
      biological sex and diabetes severity is discouraged, since enrollment is ongoing and
      periodic updates may not yet have achieved balanced distribution across groups.

future_use_impacts:
  - impact_details: >-
      Data used in developing AI systems are often a major source of downstream ethical issues.
      AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification, so a theoretical risk of future re-identification
      remains. To prevent re-identification attempts, the project implements a robust data
      dissemination system, a strict license agreement and data watermarking for both the
      public and controlled sets.
  - impact_details: >-
      The blueprint has the potential to remove one of the major bottlenecks to the widespread
      use of AI in healthcare: the availability of data that is off-the-shelf ready for
      AI-based analysis. The flagship dataset is expected to lead to novel discoveries into
      T2DM pathogenesis and salutogenesis while benefiting a broader population.
  - impact_details: >-
      American Indian and Alaska Native communities are unique and highly identifiable groups
      that could benefit from precision health AI studies; engagement with the Native Biodata
      Consortium is evaluating tools such as data usage agreements, contract negotiations,
      transparent access agreements and assured return of benefit for tribal data.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. It is hosted on FAIRhub through
      Microsoft Azure. Contact information is provided in the README file included with the
      dataset, and questions, suggestions and feedback are directed to
      https://aireadi.org/contact and https://docs.aireadi.org/docs/3/contact. The
      study_description.json and dataset_description.json metadata files included in the
      dataset carry additional information about the contact person or entity, authors and
      contributors. The central study contact is Aaron Lee (contact@aireadi.org).

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset is released as static versions and is not updated in place. New versions are
    released with additional instances as more study participants complete the study visit;
    there are plans to release new versions approximately once a year with additional data
    from participants enrolled since the last release. Changes between versions are recorded
    in the CHANGELOG file included in the dataset and visible at docs.aireadi.org. Version
    3.0.0 added 1213 participants over version 2.0.0 and three additional imaging devices,
    and dropped the Snellen visual acuity variables so that only logMAR visual acuity
    measurements remain.

