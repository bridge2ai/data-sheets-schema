  release itself as not being a mini version. Both the FAIRhub dataset pages and the
  documentation site carry the statement "This repository is under review for potential
  modification in compliance with Administration directives."

source_caveats: >-
  Referent: this record describes version 3.0.0 of the Flagship Dataset of Type 2 Diabetes
  from the AI-READI Project, the version described by all three tier-1 sources.
  Publisher: the FAIRhub API records the publisher as "FAIRhub" while the RO-Crate records the
  publisher as "AI-READI Consortium"; both are tier-1 sources, so the ranking cannot decide
  between them. The FAIRhub platform URL is used for the publisher slot because it is the
  distributing platform named on the dataset landing page, and the AI-READI Consortium is
  recorded as the creator, which the two sources agree on.
  Participant count: 2280 for version 3.0.0 is consistent across the FAIRhub API, README,
  healthsheet and RO-Crate.
  Collection period: the FAIRhub API dateType "Collected" gives 2023-07-19/2025-05-01, matching
  the README and healthsheet. The RO-Crate and healthsheet describe this as data "up through
  the end of the second year of the study", which sits oddly with the study start date of
  19 July 2023; the dates themselves are used here rather than the year-count description.
  Enrollment target: the FAIRhub study description and both publications give an anticipated
  enrollment of 4000; the NIH RePORTER abstract says "4,000+"; the IRB protocol says 4600. The
  higher-ranked FAIRhub and IRB sources conflict, and 4000 is used because it is the value in
  the tier-1 FAIRhub study_description enrollmentInfo and is repeated in both publications.
  Age eligibility: the BMJ Open protocol describes eligibility as "aged 40 and older" with no
  upper bound, while the FAIRhub study description and the IRB protocol both record a maximum
  age of 85 years and list "adults older than 85 years of age" as an exclusion. The
  higher-ranked sources are followed.
  Study end: the FAIRhub study description gives an anticipated completion date of 2027-01-01;
  the BMJ Open protocol says enrollment continues until 30 November 2026; NIH RePORTER records
  the project period for application 10471118 as 2022-09-01 to 2025-08-31.
  Project name expansion: the acronym AI-READI is expanded as "Artificial Intelligence Ready
  and Equitable Atlas for Diabetes Insights" in the Nature Metabolism comment and BMJ Open
  protocol, and as "Artificial Intelligence Ready and Exploratory Atlas for Diabetes Insights"
  in the FAIRhub study description, healthsheet, README and NIH RePORTER record. The
  higher-ranked "Exploratory" form appears in the dataset's own metadata; the official study
  title recorded on FAIRhub is "AI Ready and Exploratory Atlas for Diabetes Insights".
  License versioning: the license file is titled AI-READI Data License Agreement Version 2.0
  and is archived at https://doi.org/10.5281/zenodo.17555036; an earlier license for reuse of
  the AI-READI dataset is cited in the Nature Metabolism comment as
  https://doi.org/10.5281/zenodo.10642459. The version 2.0 agreement is the one referenced by
  the version 3.0.0 dataset metadata.
  Blood volume collected: the BMJ Open protocol states 53 mL is collected; the IRB protocol
  states approximately 50-60 mL. Both are tier-3/tier-2 sources describing the biospecimen
  protocol rather than the released dataset, and biospecimens are not part of this dataset.
  Labels: no labeling, annotation or imputation was performed, so labeling_strategies,
  annotation_analyses, machine_annotation_tools and imputation_protocols are omitted rather
  than populated with statements of absence. Likewise, the healthsheet records no prior uses,
  no use-tracking repository, no erratum, no data protection impact assessment and no external
  contribution mechanism, so those slots are omitted.