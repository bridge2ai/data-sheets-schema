conforms_to: >-
  Clinical Dataset Structure (CDS) v0.1.1 governs the overall directory organization
  (one directory per datatype, then modality, then device, then participant). Within each
  datatype directory the data files follow a domain standard: WaveForm DataBase (WFDB) for
  12-lead electrocardiography; the Observational Medical Outcomes Partnership (OMOP)
  Common Data Model for clinical data; Digital Imaging and Communications in Medicine
  (DICOM) for retinal FLIO, OCT, OCTA and photography; Open mHealth for wearable activity
  monitoring and continuous glucose monitoring; and the NASA ASCII File Format Guidelines
  for Earth Science Data for environmental sensor data. The release is additionally
  packaged with RO-Crate metadata conforming to the RO-Crate 1.2-DRAFT profile, with one
  subcrate per datatype.
