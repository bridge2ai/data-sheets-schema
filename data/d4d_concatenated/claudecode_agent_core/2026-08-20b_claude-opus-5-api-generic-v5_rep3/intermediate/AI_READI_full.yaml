splits:
  - split_details: >-
      The dataset ships with a recommended train/validation/test split in proportions of
      70%/15%/15% (1576 / 352 / 352 participants), recorded in the participants.tsv file.
      Because sex, race and ethnicity are not released with the public version, the
      project team constructed the splits so that the validation and test sets are
      balanced as far as possible for sex, race/ethnicity and diabetes status (no
      diabetes, prediabetes/lifestyle controlled, oral medication controlled, insulin
      controlled). The stated rationale is to reduce disparities in models developed using
      this dataset when demographic labels are unavailable to the model developer.

