purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal
      dataset that enables artificial intelligence and machine learning research into
      type 2 diabetes mellitus, including salutogenic pathways back to health.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria and can be used to reconstruct a temporal atlas of T2DM
      development and reversal towards health.
  - response: >-
      To establish and share a blueprint — standards, best practices and guidelines for
      collection, preparation and sharing of data — that future data generation projects
      can follow when producing AI-ready biomedical datasets.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training
      personnel at the intersection of biomedicine and artificial intelligence.

addressing_gaps:
  - response: >-
      The lack of diverse datasets that are AI ready for training AI models. Given the
      complexity of T2DM, AI-based approaches may improve understanding, but a key issue
      is the absence of data prepared for model training; the AI-READI dataset is intended
      to fill this gap.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases
      such as T2DM has been limited by a lack of well-designed, high quality, large and
      inclusive multimodal datasets.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published between 2000 and
      2020 found that samples lacked racial and ethnic diversity. The cohort is
      deliberately balanced across four self-reported race/ethnicity groups to address
      this under-representation.
  - response: >-
      Existing data sources such as insurance claims or electronic health records do not
      support the downstream AI/ML analyses this multi-domain acquisition protocol is
      designed to enable.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis: an approach used to predict disease
      trajectories by collecting and learning from complex, multimodal data from
      participants with differing disease severity, from normal to insulin-dependent T2DM.
  - response: >-
      Development of multimodal AI/ML models of type 2 diabetes severity and
      salutogenesis using balanced training data.

instances:
  - instance_type: Individual human research participant
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with each data instance. The dataset is
      hypothesis-agnostic and was not labeled for any particular downstream task.
    notes: >-
      Each instance consists of all data available for one participant across the
      modalities collected: survey data, clinical data, retinal imaging, environmental
      sensor data, continuous glucose monitor data and wearable activity monitor data.
      Version 1.0.0 contained 204 participants and version 2.0.0 contained 1067.

relationships:
  - relationship_details: >-
      All instances are part of the same prospective data generation project (AI-READI).
      There is currently only one study visit per participant, so instances are not
      linked longitudinally in this version. Approximately 10% of the study cohort is
      planned to return for a follow-up visit in year 4 of the project.

