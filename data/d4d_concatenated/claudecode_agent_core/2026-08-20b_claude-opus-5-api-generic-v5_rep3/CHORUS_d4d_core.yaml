id: https://chorus4ai.org/#dataset
name: CHoRUS Dataset
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multicenter, multimodal, high-resolution critical care dataset generated by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
  project, one of four data generation projects in the NIH Common Fund's Bridge2AI consortium
  (award OT2OD032701). The dataset is assembled retrospectively from the clinical systems of
  14 data-acquisition hospitals within a collaboration spanning 20 academic centers and more than
  60 consortium members, and is offered under controlled access. It brings together structured
  electronic health record data standardized to the OMOP Common Data Model (demographics,
  diagnoses, procedures, medication administration time-stamped at each infusion change or dose,
  and high-frequency nursing flowsheets), clinical notes extracted and tokenized with the OHNLP
  toolkit, radiology imaging exported from PACS in DICOM, bedside telemetry waveforms in WFDB
  (an extended PhysioNet schema), hospital EEG waveforms in EDF+ and Persyst formats, and social
  determinants of health together with geographic contextual factors such as distance to the
  nearest hospital. The current released dataset comprises 50,000 patient admissions from adult
  ICU, PICU and NICU settings, approximately 1.6 billion rows of EHR OMOP data, 7,642 admissions
  with radiology data, and 23 TB of waveform data; the anticipated final dataset is described as
  covering 100,000 patient admissions and 9 data modalities from 14 contributing hospitals. OMOP
  tables and telemetry reside in a cloud enclave, while clinical notes remain stored locally at
  contributing sites with only tokens shared. The project's stated goal is a publicly available,
  AI-ready critical care dataset that supports characterizing acute and critical illness,
  predicting complications and measuring treatment response, with a sequestered holdout test set
  for external model validation, while promoting privacy, accountability and clinical benefit.
status: Partially released under controlled access; data acquisition ongoing.
page: https://chorus4ai.org/
created_by: CHoRUS Consortium
was_derived_from: >-
  Retrospective clinical data extracted from the electronic health record systems, PACS imaging
  archives, bedside telemetry monitors and gateway/middleware, and hospital EEG databases of the
  14 CHoRUS data-acquisition hospitals.
is_tabular: false
conforms_to: >-
  OMOP Common Data Model (with extensions for high-frequency nursing flowsheets) for structured
  EHR data; the OHNLP open-source schema for extracted and tokenized clinical notes; DICOM for
  imaging; WFDB using an extended PhysioNet schema for telemetry waveforms; and the open-source
  EDF+ and Persyst schemas for EEG waveforms.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: CoreDataset
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - electronic health records
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - AI-ready dataset
  - Bridge2AI
  - multimodal data
source_caveats: >-
  The project documentation site (chorus4ai.org, tier 2) states that the current released dataset
  covers 50,000 patient admissions, while the Cohort 2 informational webinar (tier 4) states that
  as of August 2025 the dataset covered 14 hospitals with over 45,000 unique admissions; the
  higher-ranked project documentation figure is used here. The two sources agree on 14
  data-contributing hospitals. The NIH RePORTER abstract describes acquiring an AI-ready data set
  from "more than 100,000 critically ill patients", whereas the project website gives an
  anticipated final dataset of 100,000 patient admissions; the units differ (patients versus
  admissions) and the sources are not reconciled. The MIT License statement comes from the
  chorus-ai GitHub organization README and applies to the project's software repositories rather
  than to the controlled-access data, so no dataset-level license slot is asserted. NIH RePORTER
  names Eric S. Rosenthal as the sole principal investigator of award 1OT2OD032701-01; the Cohort
  2 webinar additionally names five people as members of the Bridge2AI CHoRUS Leadership Team,
  and this record does not treat that leadership role as a principal investigator designation.
  No registry identifier is attested in the bundle for any person, organization or grant named
  here, so no such identifiers are asserted.
notes: >-
  The chorus4ai.org site carried a banner at the time of capture reading "This repoitory is under
  review for potential modification in compliance with Administration directives" (the
  misspelling of "repository" is as published). The OTHER value in conforms_to_standard stands
  for three standards the enumeration does not list separately: the OHNLP open-source schema for
  tokenized clinical notes, and the EDF+ and Persyst schemas for EEG waveforms.

