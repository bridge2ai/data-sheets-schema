  - maintainer_details: >-
      Jared Houghtaling, Tufts Medicine; handles CHoRUS data access requests at
      jared.houghtaling@tuftsmedicine.org, and leads training sessions on working with EHR data
      for research.
    role: academic_institution

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Clinical collaborators can contribute to semantic mapping and validation through the
    chorus-mapping repository, which holds documentation, pooled tabular mappings and a clinical
    validation SOP. Software developers contribute through the repositories described in the
    chorus-developer web guide. Data-contributing sites raise issues in the Standards Discussions
    and Data Acquisition Discussions areas and submit regular status updates either through the
    GitHub interface or through a Google Form whose submissions update GitHub issues via the
    GitHub API. Downstream analytics collaborators are invited to reach out via the project
    contact addresses.

updates:
  update_details: >-
    Data acquisition is ongoing toward an anticipated final dataset of 100,000 patient admissions
    across 9 data modalities from 14 contributing hospitals; imaging de-identification for the
    larger cohort and EEG extraction were in process as of September 2025, and published metadata
    schemas are planned for clinical notes, imaging and EEG. Contributing sites provide regular
    status updates on their extract creation and curation progress, which are tracked in the
    Standards Project and Data Acquisition Project boards, and task tracking across teams is
    consolidated in a central GitHub project.

