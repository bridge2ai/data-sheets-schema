    role: academic_institution
    source_caveats: >-
      The email address is transcribed exactly as published on chorus4ai.org; the domain
      "mgh.havard.edu" appears to contain a typographical error in the source.
  - maintainer_details: >-
      Emory University contact handling CHoRUS data access requests at dbold@emory.edu.
    role: academic_institution
    source_caveats: >-
      The GitHub organization overview gives only the address dbold@emory.edu as a request-access
