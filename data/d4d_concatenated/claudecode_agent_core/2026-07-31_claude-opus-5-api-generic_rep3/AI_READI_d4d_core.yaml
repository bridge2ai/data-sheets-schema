purposes:
  - description: >-
      To create and publicly share a flagship, ethically-sourced, AI-ready multimodal dataset on
      type 2 diabetes mellitus that enables future generations of artificial intelligence and
      machine learning research, including into salutogenic pathways that return participants to
      health.
  - description: >-
      To collect data specifically designed to permit downstream pseudotime manifold analysis, an
      approach used to predict disease trajectories by learning from complex multimodal data from
      participants with differing disease severity (normal through insulin-dependent T2DM), with
      the long-term objective of reconstructing a temporal atlas of T2DM development and reversal
      toward health.
  - description: >-
      To establish standards, best practices, and guidelines (a "blueprint") for the collection,
      preparation, and sharing of data for AI/ML purposes, including FAIR principles, ethical and
      equitable data collection and management, new standards such as the Clinical Dataset
      Structure (CDS), and the FAIRhub cloud-based curation and sharing platform, so that future
      NIH Bridge2AI Data Generation Projects can follow them.
  - description: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including a year-long AI-READI research internship programme aimed at broadening
      participation in the AI workforce.

addressing_gaps:
  - description: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high-quality, large, and inclusive
      multimodal datasets. A major barrier to AI in this area has been the lack of diverse
      datasets that are AI-ready for training AI models; the AI-READI dataset is intended to fill
      this gap.
  - description: >-
      Existing data sources such as insurance claims data or electronic health records do not
      support the multi-domain downstream AI/ML analyses the project targets; a purpose-designed
      acquisition protocol across survey, physical measurement, clinical, imaging, and wearable
      device domains was therefore designed.
  - description: >-
      Prior T2DM research lacks racial and ethnic diversity. A meta-epidemiological review of
      T2DM studies published from 2000 to 2020 indicated that samples lacked racial and ethnic
      diversity, while certain racial and ethnic populations bear a disproportionate burden of
      T2DM. AI-READI deliberately recruits balanced numbers across four self-reported
      race/ethnicity groups rather than mirroring the US demographic distribution.
  - description: >-
      Current understanding of T2DM in the context of salutogenesis (the pathway from disease to
      health) is limited; most prior work studies pathogenesis rather than the reverse pathway.

tasks:
  - description: >-
      Development of artificial intelligence and machine learning models for type 2 diabetes
      mellitus, including models of disease trajectory and of salutogenesis. The dataset is
      explicitly hypothesis-agnostic and is not tied to a single predictive task; the healthsheet
      states that no labels or predefined tasks are provided.
  - description: >-
      Pseudotime manifold analysis to predict disease trajectories from complex multimodal data
      collected across participants with differing disease severity, an approach adapted from
      developmental biology and relying on dimensionality reduction.
  - description: >-
      Multimodal model development spanning imaging, physiological signal/waveform, wearable, and
      tabular clinical data for a single cohort of participants.

