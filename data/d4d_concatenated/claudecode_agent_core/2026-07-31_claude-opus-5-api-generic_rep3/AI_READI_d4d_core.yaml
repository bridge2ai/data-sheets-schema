  in the declared source bundle; the bundle contains the text of the earlier v1.0 license
  (University of Washington Data License Agreement, https://doi.org/10.5281/zenodo.10642459).
status: >-
  Published and current. Version 3.0.0 is the current release on FAIRhub; the v2.0.0 record and
  documentation state that that version "is no longer accessible". Study enrollment is ongoing
  ("Enrolling by invitation"), with anticipated study completion 2027-01-01. Both the FAIRhub
