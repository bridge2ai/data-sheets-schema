id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  The AI-READI (Artificial Intelligence Ready and Equitable/Exploratory Atlas for Diabetes
  Insights) flagship dataset consists of multimodal data collected from individuals with and
  without type 2 diabetes mellitus (T2DM), harmonized across three US data collection sites
  (University of Alabama at Birmingham, University of California San Diego, University of
  Washington). Version 3.0.0 contains data from 2280 participants collected between 2023-07-19
  and 2025-05-01, comprising 356,343 files totalling approximately 3.82 TB. Modalities include
  survey/clinical data mapped to the OMOP Common Data Model, blood and urine laboratory results,
  12-lead electrocardiography, retinal photography, optical coherence tomography (OCT), OCT
  angiography (OCTA), fluorescence lifetime imaging ophthalmoscopy (FLIO), continuous glucose
  monitoring, wearable activity monitoring, and custom-built indoor environmental sensor data.
  The dataset was designed to be "AI-ready" and hypothesis-agnostic, to support machine learning
  research into the pathogenesis and salutogenesis (the pathway from disease back to health) of
  T2DM. The public release contains no protected health information; sex, race/ethnicity, and
  medication information have been removed and are held under controlled access. Note that the
  declared source bundle also contains evidence for the superseded v2.0.0 release (2.01 TB,
  165,051 files, 1067 participants), which FAIRhub marks as no longer accessible; this record
  describes v3.0.0 except where explicitly stated.
