      version DOI 10.13026/h995-bt35, latest-version DOI 10.13026/mf9s-5r03.
      https://physionet.org/content/b2ai-voice-pediatric/
  - description: >-
      Predecessor release: version 1.0 of the feature-only dataset published on the Health Data
