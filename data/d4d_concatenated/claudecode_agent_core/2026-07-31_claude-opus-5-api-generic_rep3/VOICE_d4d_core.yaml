id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  The Bridge2AI-Voice dataset is a large, ethically sourced, and demographically diverse voice
  dataset linked to health information, generated under the NIH Common Fund Bridge2AI program.
  This record describes the adult flagship dataset published on PhysioNet; its current version
  (3.1.0, released 2026-05-01) contains data for 833 adult participants collected across five
  sites in North America. Participants were selected on the basis of known conditions that
  manifest within the voice waveform, spanning voice disorders, neurological and
  neurodegenerative disorders, mood and psychiatric disorders, and respiratory disorders,
  together with control participants. The public release contains only data considered low
  risk - derived acoustic representations such as spectrograms, Mel spectrograms, MFCCs,
  articulatory and phonetic features, and static acoustic feature tables - rather than the
  original voice recordings, alongside detailed demographic, clinical, and validated
  questionnaire data. Raw audio is disseminated separately under controlled access. A companion
  Bridge2AI-Voice Pediatric Dataset covering 300 participants aged 2-18 is published as a
  distinct PhysioNet project.
version: 3.1.0
doi: 10.13026/8xbn-nq66
page: https://physionet.org/content/b2ai-voice/3.1.0/
status: published
language: en
