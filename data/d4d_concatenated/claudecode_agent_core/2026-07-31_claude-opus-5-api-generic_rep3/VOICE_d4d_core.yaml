conforms_to_schema: >-
  Bridge2AI-Voice REDCap data dictionary and metadata (https://github.com/eipm/bridge2ai-redcap)
was_derived_from: >-
  Raw voice, speech, breath, and cough recordings together with REDCap and ReproSchema-UI
  questionnaire responses collected prospectively under the Bridge2AI-Voice data acquisition
  protocol. The publicly released feature data are derivations computed from those raw audio
  waveforms; the raw waveforms themselves are withheld from the registered-access release.

