      https://zenodo.org/doi/10.5281/zenodo.12760724 with version 3.23.0 at
      https://zenodo.org/records/14989503. MIT licensed.
  - description: >-
      b2aiprep library - the code used to preprocess the raw audio waveforms into the Parquet files
      and to merge the source data into the phenotype files:
      https://github.com/sensein/b2aiprep. Apache-2.0 licensed. Releases 3.0.0 and 3.1.0 were
      generated with b2aiprep v3.0.0.
  - description: >-
