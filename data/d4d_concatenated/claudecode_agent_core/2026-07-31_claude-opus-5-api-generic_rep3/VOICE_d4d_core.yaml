      https://docs.b2ai-voice.org/
  - description: >-
      Bridge2AI-Voice project website: https://b2ai-voice.org/ and the program page
      https://bridge2ai.org/voice/
  - description: >-
      Protocol development publication, cited as the required acknowledgement for use of the
      dataset: Bensoussan, Yael, et al. "Developing Multi-Disorder Voice Protocols: A team science
      approach involving clinical expertise, bioethics, standards, and DEI." Proc. Interspeech
      2024, 1445-1449. doi:10.21437/Interspeech.2024-1926.
      https://www.isca-archive.org/interspeech_2024/bensoussan24_interspeech.html
  - description: >-
