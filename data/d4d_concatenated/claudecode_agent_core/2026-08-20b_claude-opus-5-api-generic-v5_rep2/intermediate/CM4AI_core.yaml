    access_details: Linked from the release record as a deposit in the MassIVE repository.
  - source_description: >-
      Raw single-cell sequence data underlying the CRISPR interference perturbation screens in
      KOLF2.1J induced pluripotent stem cells and in MDA-MB-468 breast cancer cells.
    source_type: sequence read archive
    raw_data_format: single-cell RNA sequencing reads
    access_details: >-
      Both perturb-seq raw sequence deposits are listed as embargoed in the June 2026 release.
      Earlier releases identified the deposit location as an NCBI BioProject in the Sequence
      Read Archive.
  - source_description: The CRISPR interference perturbation atlas of human induced pluripotent stem cells.
    source_type: general-purpose data repository
    access_details: Linked from the June 2026 release record as a Figshare deposit.

preprocessing_strategies:
  - preprocessing_details: >-
      Immunofluorescence images are distributed together with RGB renderings in addition to the
      acquired channel images; RGB immunofluorescent images were added in a revision of the
      June 2025 release, together with corrections to RO-Crate metadata and changes to file
      naming conventions.

data_governance:
  committee_name: CM4AI Data Governance Committee
  committee_contact:
    id: ORCID:0000-0003-4535-3486
    name: Jillian Parker
  accountable_organization:
    name: University of California San Diego
  access_review_process: >-
    All files in the release are public and no access request is required. Governance questions
    are directed to Jillian Parker (jillianparker@health.ucsd.edu) as the named data governance
    contact. Commercial use falls outside the public license and requires separate license
    negotiation with the copyright holder, which is the University of California San Diego,
    Stanford University and/or the University of California San Francisco depending on the
    specific data package. The project states that a Data Access Committee supervises ethical
    matters related to dataset distribution and potential dual licensing for commercial use.
  stewardship_roles:
    - >-
      The CM4AI Standards module is responsible for AI-readiness packaging of data, software,
      metadata and provenance graphs using the FAIRSCAPE framework. The CM4AI Ethics module,
      working with the Data Acquisition, Tools and Standards modules, developed the plan for
      ethical preparation, licensing, dissemination and data access supervision. Long-term
      preservation is provided by the University of Virginia Dataverse with committed
      institutional funds. Participants in the Bridge2AI Open House must attest and commit to a
      Code of Conduct before accessing Bridge2AI data, including CM4AI datasets.

license_and_use_terms:
