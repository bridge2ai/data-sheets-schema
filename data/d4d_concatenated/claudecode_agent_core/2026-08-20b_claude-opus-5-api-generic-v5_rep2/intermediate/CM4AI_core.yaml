purposes:
  - response: >-
      To deliver machine-readable hierarchical maps of human cell architecture as AI-ready
      data, produced from multimodal interrogation of chromatin modifiers, metabolic enzymes
      and other proteins involved in cancer, neuropsychiatric and cardiac disorders in
      disease-relevant cell lines under treated and untreated conditions.
  - response: >-
      To map the spatiotemporal architecture of human cells and apply these maps to the grand
      challenge of interpretable genotype-phenotype learning.
  - response: >-
      To supply the matched data and tools needed to build "visible" machine learning systems
      that are constructed directly on knowledge maps of cell and tissue architecture rather
      than being difficult-to-interpret black boxes.
  - response: >-
      To produce ethical, FAIR, AI-ready datasets with deep provenance, as the Functional
      Genomics Data Generation Project of the NIH Bridge2AI program, in order to enable
      transformative biomedical artificial intelligence research.

tasks:
  - response: >-
      Construction of hierarchical cell maps, represented as directed acyclic graphs in which
      each node is an assembly of proteins in proximity at a given scale, by integrating
      protein-protein interaction and immunofluorescence imaging data through self-supervised
      embedding and multi-resolution community detection.
  - response: >-
      Training and interpretation of visible machine learning models and visible neural
      networks that relate protein assemblies to cell-level phenotype predictions.
  - response: >-
      Interpretation of genetic variants and mutations in human genomics using cell maps as a
      structural and functional reference.
  - response: >-
      Integrative structure modeling of protein assemblies identified as communities in the
      cell maps, using experimental structural data together with structure prediction.

addressing_gaps:
  - response: >-
      In genomics and precision medicine, machine learning models are often black boxes that
      predict phenotypes from genotypes without revealing the mechanisms by which such
      translation occurs; CM4AI supplies maps of cellular structure and function on which
      interpretable models can be built.
  - response: >-
      Complementary cell mapping technologies have typically been applied separately;
      the project generates matched, multimodal measurements over a shared list of proteins
      across cell types and treatment conditions so that the modalities can be fused.
  - response: >-
      The biomedical research community lacks ethical, FAIR, AI-ready functional genomics
      datasets accompanied by machine-readable provenance graphs, validated schemas and
      documented licensing suitable for training and validating AI/ML models.

acquisition_methods:
  - acquisition_details: >-
      Protein-protein interactions were measured directly by affinity purification-mass
      spectrometry on endogenously tagged cell lines. Tagged genes were introduced into
      MDA-MB-468 cells and interaction data were acquired under untreated, paclitaxel-treated
      and vorinostat-treated conditions.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
    was_validated_verified: true
    notes: >-
      The project describes AP-MS and SEC-MS as two orthogonal mass spectrometry based
      approaches applied to the same protein-protein interaction mapping problem.
  - acquisition_details: >-
      Proteome-wide protein complex and interaction profiles were measured directly by
      size-exclusion chromatography coupled to mass spectrometry, generating elution profiles
      across chromatographic fractions for MDA-MB-468 cells under three conditions and for
      KOLF2.1J induced pluripotent stem cells and their neural progenitor, neuronal and
      cardiomyocyte derivatives.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Subcellular protein localization was observed directly by immunocytochemistry
      immunofluorescence staining and confocal microscopy of fixed and permeabilized
      MDA-MB-468 cells.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Transcriptional and fitness phenotypes were observed directly by single-cell CRISPR
      interference perturbation screens, in which cells expressing inducible dCas9 receive
      lentivirally delivered guide RNAs and are then profiled by single-cell RNA sequencing.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false

collection_mechanisms:
  - mechanism_details: >-
      Affinity purification-mass spectrometry performed on endogenously tagged cell lines to
      recover bait proteins and their associated complexes for identification by tandem mass
      spectrometry.
  - mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry, in which cellular extracts
      are separated into chromatographic fractions and the proteins in each fraction are
      identified and quantified, yielding proteome-wide elution profiles.
  - mechanism_details: >-
      Immunofluorescence-based staining and confocal microscopy using the Human Protein Atlas
      resource of antibodies. Each image carries four channels: nuclei stained with DAPI (blue
      channel), endoplasmic reticulum with a calreticulin antibody (yellow channel),
      microtubules with a tubulin antibody (red channel), and the protein of interest with its
      specific antibody (green channel). Automated fixation and permeabilization protocols
      were established on a pipetting robot for the MDA-MB-468 and KOLF2 cell lines.
  - mechanism_details: >-
      Single-cell CRISPR interference screens using a lentiviral guide RNA library delivered to
      cell lines engineered to express inducible dCas9, with single-cell libraries prepared
      using the 10x Genomics 3'HT kit. An initial library targeted 100 chromatin factors with
      six guide RNAs per gene.

collection_timeframes:
  - timeframe_details: >-
      Data generation began under the NIH award that started 2022-09-01 and continues on a
      quarterly release cadence. Quarterly data releases were issued in May 2024, March 2025,
      June 2025, October 2025 and June 2026, and the release states that the dataset will be
      regularly updated and augmented through the end of the project in November 2026.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Targeted panels of chromatin modifiers, metabolic enzymes and other proteins implicated
      in cancer, neuropsychiatric and cardiac disorders were selected for multimodal
      interrogation, with an initial focus on 100 chromatin regulators and 100 metabolic
      enzymes; the CRISPR interference perturbation atlas in KOLF2.1J induced pluripotent stem
      cells was expanded to expressed genome scale, targeting 11,739 genes. Deep multi-modal
      data are generated for a shared list of proteins across all cell types and treatment
      conditions.
    why_not_representative: >-
      Data derive from two commercially available de-identified human cell lines and do not
      represent the biological variation seen in the population at large. In addition, the
      protein-protein interaction, protein localization and CRISPR interference perturbation
      assays interrogate sets of proteins that incompletely overlap.

instances:
  - instance_type: >-
      Four-channel confocal immunofluorescence image of MDA-MB-468 cells stained for a single
      protein of interest together with nuclear, endoplasmic reticulum and microtubule
      reference markers
    data_substrate: B2AI_SUBSTRATE:19
    data_topic: B2AI_TOPIC:19
    counts: 53788
    source_caveats: >-
      The count of 53,788 immunofluorescent images is the project-wide total reported on the
      CM4AI portal and is not scoped to this release. The June 2026 release contains images
      covering 464 proteins of interest in each of three MDA-MB-468 conditions.
  - instance_type: >-
      Protein elution profile across size-exclusion chromatography fractions, quantified by
      mass spectrometry
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:26
    notes: >-
      The CM4AI portal reports that SEC-MS captures approximately 7,000 proteins in each of the
      flagship MDA-MB-468 and iPSC datasets. In earlier project reporting, SEC-MS in MDA-MB-468
      cells detected profiles for over a thousand complexes and identified 72 of 100 chromatin
      modifiers of interest, 52 of them as integral components of protein complexes, while
      SEC-MS in KOLF2 iPSCs and derivatives uncovered more than 700 protein complexes.
  - instance_type: >-
      Affinity purification-mass spectrometry record linking a tagged bait protein to its
      recovered interacting partners
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:26
  - instance_type: >-
      Single-cell transcriptional profile from a CRISPR interference perturbation screen,
      linked to the delivered guide RNA and the targeted gene
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
    notes: >-
      The CRISPR interference perturbation cell atlas in KOLF2.1J induced pluripotent stem
      cells maps transcriptional and fitness phenotypes for 11,739 targeted genes at expressed
      genome scale; the CM4AI portal reports perturb-seq of 200 genes for the MDA-MB-468
      flagship dataset.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Records are grouped by cell line and experimental condition. The MDA-MB-468 triple-negative
      breast cancer groups are untreated (DMSO control), paclitaxel-treated and
      vorinostat-treated. The KOLF2.1J induced pluripotent stem cell groups are undifferentiated
      (parental) cells and cells differentiated into neural progenitor cells, neurons or
      cardiomyocytes.
    distribution: >-
      Immunofluorescence imaging in this release covers the three MDA-MB-468 conditions.
      SEC-MS covers the three MDA-MB-468 conditions and the four KOLF2.1J states. AP-MS covers
      paclitaxel-treated and vorinostat-treated MDA-MB-468 cells. Perturb-seq covers MDA-MB-468
      cells with and without treatment and undifferentiated KOLF2.1J iPSCs.

