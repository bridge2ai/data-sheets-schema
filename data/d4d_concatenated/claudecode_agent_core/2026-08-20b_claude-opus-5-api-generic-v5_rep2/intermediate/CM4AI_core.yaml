version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
    - >-
      CM4AI issues quarterly data releases, each with its own DOI in the University of Virginia
      Dataverse: May 2024; March 2025 (doi:10.18130/V3/B35XWX); June 2025
      (doi:10.18130/V3/F3TD5R); October 2025 (doi:10.18130/V3/K7TGEM); and June 2026
      (doi:10.18130/V3/HIGT4C). Earlier releases remain listed in the archive section of the
      CM4AI data releases page.
  version_details: >-
    This record describes version 2.0 of the June 2026 Data Release (Beta). Each Dataverse
    deposit retains its own version history, browsable through the Versions tab of the deposit,
    and minor and major version increments are recorded there. The June 2025 deposit was
    revised to version 2 to add RGB immunofluorescent images, correct RO-Crate metadata and
    change file naming conventions.

updates:
  frequency: quarterly
  update_details: >-
    The dataset will be regularly updated and augmented through the end of the project in
    November 2026, with updates on a quarterly basis and long-term preservation in the
    University of Virginia Dataverse supported by committed institutional funds. Computed cell
    maps are planned for future releases, and the CM4AI data releases page lists
    immunofluorescence images for the iPSC flagship dataset as forthcoming.

retention_limit:
  retention_details: >-
    Long-term preservation is provided by the University of Virginia Dataverse, an NIH-approved
    generalist repository, supported by committed institutional funds. No deletion schedule is
    stated. The hosting Dataverse collection displays a notice that it is under review for
    potential modification in compliance with Administration directives.

extension_mechanism:
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details: >-
    The project releases the Cell Mapping Toolkit as a series of pip-installable open-source
    Python packages implementing the end-to-end cell mapping pipeline, with complete user
    documentation and a step-by-step guide, providing a flexible and generalizable framework so
    that researchers can integrate additional input modalities and construct new cell maps
    across cell subtypes and disease states. The FAIRSCAPE client and server packages are
    likewise pip-installable and openly licensed, allowing others to produce AI-ready RO-Crate
    packages with provenance graphs in the same form as this release.
  source_caveats: >-
    The bundle describes mechanisms for extending the project's software and building new maps;
    it does not describe a mechanism for contributing data back into this Dataverse deposit.

errata:
  - erratum_details: >-
      The June 2025 Data Release (doi:10.18130/V3/F3TD5R) was reissued as version 2 with a
      revision note stating that the revision added RGB immunofluorescent images, corrected
      RO-Crate metadata and changed naming conventions.

notes: >-
  Recommended citation for this release: Clark T; Parker J; Al Manir S; Axelsson U; Ballllosero
  Navarro F; Chinn B; Churas CP; Dailamy A; Doctor Y; Fall J; Forget A; Gao J; Hansen JN; Hu M;
  Johannesson A; Khaliq H; Lee YH; Lenkiewicz J; Levinson MA; Marquez C; Metallo C;
  Muralidharan M; Nourreddine S; Niestroy J; Obernier K; Pan E; Polacco B; Pratt D; Qian G;
  Schaffer L; Sigaeva A; Thaker S; Zhang Y; Belisle-Pipon JC; Brandt C; Chen JY; Ding Y;
  Fodeh S; Krogan N; Lundberg E; Mali P; Payne-Foster P; Ratcliffe S; Ravitsky V; Sali A;
  Schulz W; Ideker T, 2026, "Cell Maps for Artificial Intelligence - June 2026 Data Release
  (Beta)", https://doi.org/10.18130/V3/HIGT4C, University of Virginia Dataverse, V2. The
  release is distributed publicly by the University of Virginia Dataverse, an NIH-approved
  generalist repository; associated raw data are shared through third parties (MassIVE for raw
  mass spectrometry, the NCBI Sequence Read Archive and BioProject for raw perturbation
  sequencing, and Figshare for the iPSC perturbation atlas), cell maps through the Network Data
  Exchange, and project materials through the CM4AI web portal built on the U-BRITE platform,
  with data curation coordinated with the NIH Common Fund Data Ecosystem. Instances are linked
  across modalities by the protein or gene they interrogate, so that images, mass spectrometry
  profiles and CRISPR interference perturbations can be joined for the same protein within a
  given cell line and treatment condition; in the derived cell maps, which are not part of this
  release, nodes are protein assemblies and edges denote containment of a smaller assembly
  within a larger one. The release comprises ten public ZIP files.

source_caveats: >-
  This record takes the Cell Maps for Artificial Intelligence June 2026 Data Release (Beta),
  doi:10.18130/V3/HIGT4C, as its referent, with project-level context drawn from the CM4AI
  portal, the project preprint and the NIH RePORTER record. Several sources in the bundle
  disagree. (1) Release date: the CM4AI data releases page states that the June 2026 release
  was "Released on: June 17, 2025", while the University of Virginia Dataverse record for the
  same DOI gives a publication date of 2026-06-17 with file publication dates in June and July
  2026; the higher-ranked Dataverse value is used. (2) Project end: the Dataverse maintenance
  plan states the project ends in November 2026, while NIH RePORTER gives a project end date of
  2026-08-31; the higher-ranked Dataverse value is used and the RePORTER date is recorded only
  as the award period. (3) Immunofluorescence protein coverage: the June 2026 Dataverse file
  descriptions state 464 proteins of interest per MDA-MB-468 condition, while the CM4AI data
  releases page states 523 proteins for the TNBC flagship imaging dataset and the March 2025
  release described 563 proteins; the June 2026 Dataverse value is used. (4) AP-MS
  availability: the CM4AI data releases page lists AP-MS interactomes for TNBC cells as "coming
  soon", while the June 2026 Dataverse release contains AP-MS files for paclitaxel- and
  vorinostat-treated MDA-MB-468 cells; the Dataverse value is used. (5) Affiliation of Andrej
  Sali is given as University of California San Diego by the Dataverse record and as University
  of California San Francisco by the preprint and the Nature publication; the Dataverse value
  is recorded with the discrepancy noted on that creator. (6) The list of collaborating
  institutions varies between sources: the CM4AI data releases page names UCSD, UCSF, Stanford,
  UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University and the Hastings Center, while
  the March 2025 release omits UT Austin and the project preprint additionally lists the
  University of Alabama and the University of Montreal. (7) Counts reported on the CM4AI portal
  (1,374 protein interactions; 53,788 immunofluorescent images; 7,023 total proteins
  investigated; 11,739 genes targeted; 21.4 TB data volume) are project-wide totals rather than
  release-scoped figures, and the unit intended by "protein interactions" is not defined by the
  source. (8) The Nature publication in the bundle reports a U2OS osteosarcoma cell map produced
  by overlapping investigators and acknowledging Bridge2AI support; it has been treated as a
  related methodological publication rather than as part of this dataset, because its data,
  cell line and deposits are distinct from the CM4AI releases. (9) File sizes are reproduced in
  distribution notes as the rounded values shown on the Dataverse record; exact byte counts are
  not given, so the byte-valued slot is left unpopulated.