      by the Rector and Board of Visitors of the University of Virginia.

regulatory_restrictions:
  confidentiality_level: unrestricted
  regulatory_restrictions:
    - >-
      The release records that the dataset does not involve human subjects, that samples are
      de-identified, and that the data are not FDA regulated. All deposited files are public.
  governance_committee_contact:
    id: ORCID:0000-0003-4535-3486
    name: Jillian Parker

is_deidentified:
  identifiable_elements_present: false
  method: >-
    Use of established, commercially available immortalized human cell lines obtained from
    third-party repositories, with no linkage maintained to donor identity.
  deidentification_details: >-
    The project states that its data are distinctive within Bridge2AI in being non-clinical,
    derived from tissue cultures, and considered de-identified because they cannot be matched,
    with current knowledge, to a human subject. The June 2026 release records "Human Subjects:
    No" and "De-identified Samples: Yes".

human_subject_research:
  involves_human_subjects: false
  regulatory_compliance:
    - >-
      The release states that the dataset does not involve human subjects and is not FDA
      regulated, and that samples are de-identified. No data were collected directly from human
      individuals: all measurements were made on established, commercially available human cell
      lines obtained from third parties, namely the MDA-MB-468 triple-negative breast cancer
      line (RRID CVCL_0419), established from a metastatic pleural effusion of a 51-year-old
      Black female with metastatic mammary adenocarcinoma and available from the American Type
      Culture Collection, and the KOLF2.1J induced pluripotent stem cell line (RRID CVCL_B5P3),
      derived from a healthy male Northern European donor and available from the Human Induced
      Pluripotent Stem Cells Initiative (HipSci) resource to not-for-profit organizations under
      a simple material transfer agreement. The project states that both lines were ethically
      sourced.

ethical_reviews:
  - reviewing_organization: Cell Maps for Artificial Intelligence Ethics Module
    contact_person:
      id: ORCID:0000-0002-7080-8801
      name: Vardit Ravitsky
    review_details: >-
      Ethical review for the data release is provided through the CM4AI Ethics module. Vardit
      Ravitsky (ravitskyv@thehastingscenter.org) is named as an ethical review contact on the
      release record. The Ethics module employs a methodology inspired by Value-Sensitive
      Design, has developed an axiological repository of values to guide design standards and
      expectations, and is formulating the CM4AI Life Cycle framework to define governance
      milestones across data generation and AI system development.
  - reviewing_organization: Cell Maps for Artificial Intelligence Ethics Module
    contact_person:
      id: ORCID:0000-0002-8965-8153
      name: Jean-Christophe Belisle-Pipon
    review_details: >-
      Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca) is named as an
      ethical review contact on the release record. The Ethics module also supported the
      Bridge2AI Ethics Working Group in developing the Code of Conduct that participants must
      attest to before accessing Bridge2AI data, and states that the cell lines used were
      ethically sourced.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The release records no human subjects and de-identified samples, and all deposited files
      are publicly accessible without an access request. The measurements are molecular and
      imaging assays on established human cell lines and contain no personal identifiers or
      protected health information.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      No confidential or access-restricted content is present in the deposited files; all ten
      files in the June 2026 release are marked public. Two associated external raw-data
      deposits, the perturbation sequencing data for KOLF2.1J induced pluripotent stem cells
      and for MDA-MB-468 breast cancer cells, are listed as embargoed under a temporary
      pre-publication embargo rather than as confidential.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from two commercially available de-identified human
      cell lines: MDA-MB-468, established from a metastatic pleural effusion of a 51-year-old
      Black female with metastatic mammary adenocarcinoma, and KOLF2.1J, derived from a healthy
      male Northern European donor. The release states that the data do not represent all
      biological variants which may be seen in the population at large.
    mitigation_strategy: >-
      The release documents the cell line provenance so that users can judge generalizability;
      the project extends coverage across additional cell types and differentiation states in
      successive quarterly releases.
    affected_subsets:
      - All modalities in the release.
  - bias_type: selection_bias
    bias_description: >-
      Proteins and genes were selected as targeted panels of chromatin modifiers, metabolic
      enzymes and other proteins implicated in cancer, neuropsychiatric and cardiac disorders
      rather than sampled at random from the proteome, and the sets of proteins interrogated by
      the SEC-MS, immunofluorescence imaging and CRISPR interference perturbation assays
      incompletely overlap.
    mitigation_strategy: >-
      The project generates deep multi-modal data for a shared list of proteins across cell
      types and treatment conditions in order to increase the overlap between modalities, and
      expanded the CRISPR interference screen in KOLF2.1J iPSCs to expressed genome scale.

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      This is an interim beta release. It does not contain the predicted or computed cell maps,
      which the project states will be added in future releases.
    scope_impact: >-
      Users cannot obtain the integrated hierarchical cell maps from this release and must work
      with the individual modality datasets.
    recommended_mitigation: >-
      Use the release for bioinformatics analysis of the individual datasets, and consult later
      quarterly releases for the computed cell maps.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The protein-protein interaction (SEC-MS), protein localization (immunofluorescence
      imaging) and CRISPR interference perturbation sequencing data interrogate sets of proteins
      which incompletely overlap.
    scope_impact: >-
      Cross-modality analyses are restricted to the intersection of the protein sets covered by
      each assay.
  - limitation_type: integration_limitation
    limitation_description: >-
      The release states that it is most suitable for bioinformatics analysis of the individual
      datasets and that meaningful analysis requires domain expertise.
  - limitation_description: >-
      The release is not complete: some datasets are under temporary pre-publication embargo.
      In the June 2026 release the perturbation sequencing data for KOLF2.1J induced pluripotent
      stem cells and for MDA-MB-468 breast cancer cells are both listed as embargoed.

missing_data_documentation:
  - missing_data_patterns: >-
      Immunofluorescence images are present only for MDA-MB-468 cells in untreated,
      paclitaxel-treated and vorinostat-treated conditions; imaging for KOLF2.1J induced
      pluripotent stem cells and their derivatives is not included. AP-MS data are present only
      for treated MDA-MB-468 cells. Perturbation sequencing raw data are embargoed. Computed
      cell maps are absent from the release.
    missing_data_causes: >-
      Data generation is ongoing across the project period, and certain deposits are held under
      a temporary pre-publication embargo.
    handling_strategy: >-
      Missing components are scheduled for inclusion in subsequent quarterly releases through
      the end of the project, with the dataset regularly updated and augmented.

intended_uses:
  - use_category: Functional genomics research
    usage_notes: >-
      The release is intended to provide AI-ready datasets that support research in functional
      genomics.
  - use_category: AI model training
    usage_notes: >-
      The release is intended to be used for training artificial intelligence models,
      particularly interpretable or "visible" models built on maps of cell and tissue
      architecture.
  - use_category: Cellular process analysis
    usage_notes: >-
      The release is intended to support analysis of cellular processes using matched
      multimodal measurements.
  - use_category: >-
      Analysis of cell architectural changes and interactions under disease, treatment or
      genetic perturbation
    examples:
      - >-
        Comparison of protein complex composition and subcellular localization in MDA-MB-468
        cells with and without paclitaxel or vorinostat treatment, and across KOLF2.1J induced
        pluripotent stem cells and their neural progenitor, neuronal and cardiomyocyte
        derivatives.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license under which the data are
      released; commercial use requires a separate license negotiation with the copyright
      holder.

existing_uses:
  - examples: >-
      Size-exclusion chromatography-mass spectrometry in MDA-MB-468 cells has been used to
      detect protein-protein interaction profiles of over a thousand complexes and to identify
      thousands of proteins exhibiting differential elution profiles between control cells and
      paclitaxel- or vorinostat-treated cells, and to identify 72 of 100 chromatin modifiers of
      interest, 52 of them as integral components of protein complexes.
  - examples: >-
      Size-exclusion chromatography-mass spectrometry in KOLF2 induced pluripotent stem cells
      and derivatives has been used to uncover more than 700 protein complexes in both parental
      iPSCs and differentiated neurons.
  - examples: >-
      The expressed genome-scale CRISPR interference perturbation data in KOLF2.1J induced
      pluripotent stem cells underpin a perturbation cell atlas reported in Nourreddine S,
      Doctor Y, Dailamy A, et al., A perturbation cell atlas of human induced pluripotent stem
      cells, bioRxiv 2024.11.03.621734, which validated findings through phenotypic,
      protein-interaction and metabolic tracing assays.
  - examples: >-
      The first data release, together with detailed tutorials on how the data were derived and
      integrated and production-ready software, was used for hands-on training at the CM4AI
      CodeFest held in March 2024, attended by 38 registrants including participants external
      to the project.

future_use_impacts:
  - impact_details: >-
      Because the data derive from two commercially available de-identified human cell lines and
      do not represent the biological variation seen in the population at large, models trained
      on this release may not generalize to other genetic backgrounds, cell types or disease
      contexts, and predictions from such models should be interpreted with that constraint in
      view.
  - impact_details: >-
      The release is an interim beta whose composition changes quarterly and which does not yet
      contain the computed cell maps; conclusions drawn from it may need revision as further
      modalities, additional cell types and the integrated maps are added through the end of the
      project.
  - impact_details: >-
      The project anticipates that the maps derived from these data will be used in genomic
      medicine and in the interpretation of machine learning models, and has established an
      ethics research program, guidelines and a governance life cycle intended to anticipate
      such downstream applications, optimize benefits and mitigate risks.

use_repository:
  - repository_url: https://cm4ai.org/
    repository_details: >-
      The CM4AI project portal maintains a publications page recording outputs from the project
      and its data, together with product documentation, tool listings and training materials.

external_resources:
  - external_resources: >-
      CM4AI project portal at https://cm4ai.org, providing project documentation, data release
      listings, tools, publications and training materials. The portal reports project-wide
      totals of 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total
      proteins investigated, 11,739 genes targeted and 21.4 TB of data volume.
    archival: false
  - external_resources: >-
      Project description publication: Clark T, Mohan J, Schaffer L, Obernier K, Al Manir S,
      Churas CP, et al. Cell Maps for Artificial Intelligence: AI-Ready Maps of Human Cell
      Architecture from Disease-Relevant Cell Lines. bioRxiv, May 2024, doi
      10.1101/2024.05.21.589311. Named as the Related Publication for the release and required
      for attribution.
  - external_resources: >-
      Nourreddine S, Doctor Y, Dailamy A, Forget A, Lee YH, Chinn B, et al. A perturbation cell
      atlas of human induced pluripotent stem cells. bioRxiv 2024.11.03.621734, PMCID
      PMC11580897, doi 10.1101/2024.11.03.621734. Named as a Related Publication for the
      release.
  - external_resources: >-
      Cell Mapping Toolkit, the open-source Python implementation of the Multi-Scale Integrated
      Cell (MuSIC) data integration pipeline, at https://github.com/idekerlab/cellmaps_pipeline
      with user documentation at https://cellmaps-pipeline.readthedocs.io/.
    restrictions:
      - >-
        Alpha-level tools are released in GitHub and production-ready tools in the Zenodo
        long-term archive, under the BSD-3 open-source license.
  - external_resources: >-
      FAIRSCAPE AI-readiness framework used to package the release as RO-Crate objects with
      persistent ARK identifiers, machine-readable provenance graphs and JSON-Schema data
      dictionaries, documented with a tutorial and installation instructions at
      https://fairscape.github.io.
    restrictions:
      - >-
        Available under the MIT open-source license; copyright held by the Rector and Board of
        Visitors of the University of Virginia.
  - external_resources: >-
      Integrative Modeling Platform (IMP), the open-source package used by the project for
      integrative structure modeling of protein assemblies, at http://integrativemodeling.org.
  - external_resources: >-
      Network Data Exchange (NDEx) at https://ndexbio.org, through which cell maps produced by
      the project are shared and from which they can be visualized in a web browser or accessed
      via Cytoscape, HiView and the Python ndex2 library.
  - external_resources: >-
      Schaffer LV, Hu M, Qian G, et al. Multimodal cell maps as a foundation for structural and
      functional genomics. Nature 642:222-231 (2025), doi 10.1038/s41586-025-08878-3.
    notes: >-
      This open-access publication, by investigators who also lead CM4AI and acknowledging
      Bridge2AI Program support under OT2 OD032742, reports a multimodal cell map of U2OS
      osteosarcoma cells built by fusing AP-MS interactions and immunofluorescence images for
      more than 5,100 proteins. Its underlying data are distinct from the MDA-MB-468 and
      KOLF2.1J data released here and are deposited separately at NDEx, MassIVE and
      ProteomeXchange.

