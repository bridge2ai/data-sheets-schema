  data_use_permission: no_commercial_use
  contact_person:
    id: ORCID:0000-0002-1708-8454
    name: Trey Ideker

ip_restrictions:
  restrictions:
    - >-
      Copyright in the datasets is held by the Regents of the University of California except
      where otherwise indicated; raw immunofluorescence image data for spatial proteomics is
      copyright the Board of Trustees of the Leland Stanford Junior University. Commercial use
