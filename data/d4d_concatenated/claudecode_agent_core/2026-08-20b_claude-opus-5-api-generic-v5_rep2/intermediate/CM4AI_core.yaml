name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Bridge to Artificial Intelligence
  (Bridge2AI) Common Fund program. Its objective is to deliver machine-readable hierarchical
  maps of human cell architecture as AI-ready data, produced by multimodal interrogation of
  chromatin modifiers, metabolic enzymes and other proteins implicated in cancer,
  neuropsychiatric and cardiac disorders in disease-relevant cell lines under treated and
  untreated conditions. This record describes the June 2026 Data Release (Beta), version 2.0,
  deposited in the University of Virginia Dataverse. The release contains single-cell CRISPR
  interference perturbation sequencing (perturb-seq) data for MDA-MB-468 breast cancer cells
  with and without treatment and for undifferentiated KOLF2.1J induced pluripotent stem cells;
  size-exclusion chromatography-mass spectrometry (SEC-MS) protein complex data for MDA-MB-468
  cells with and without treatment and for undifferentiated KOLF2.1J iPSCs and iPSC-derived
  neural progenitor cells, neurons and cardiomyocytes; affinity purification-mass spectrometry
  (AP-MS) interaction data for treated MDA-MB-468 cells; and confocal immunofluorescence images
  of subcellular protein localization in MDA-MB-468 cells with and without treatment. Output
  data are packaged with provenance graphs and rich metadata as AI-ready RO-Crate objects
  generated with the FAIRSCAPE framework. Computed cell maps are not included in this beta
  release. The project is organized into three pillars - Data, People and Ethics - across six
  modules (Data Acquisition; Tools; Standards; Teaming; Skills and Workforce Development; and
  Ethics), and the CM4AI data releases page describes it as a collaboration of the University
  of California San Diego, the University of California San Francisco, Stanford University,
  the University of Virginia, Yale University, the University of Texas at Austin, the
  University of Alabama at Birmingham, Simon Fraser University and the Hastings Center.
