id: doi:10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  Version 3.0.0 of the flagship multimodal dataset generated by the Artificial Intelligence
  Ready and Equitable (also rendered Exploratory) Atlas for Diabetes Insights (AI-READI)
  project, one of four Data Generation Projects funded by the NIH Common Fund Bridge2AI
  program. The release contains data from 2,280 participants with and without type 2
  diabetes mellitus (T2DM), collected between 19 July 2023 and 1 May 2025 and harmonized
  across three data collection sites (University of Alabama at Birmingham, University of
  California San Diego, and University of Washington). Participants were adults aged 40 and
  older recruited into four diabetes-severity groups (no diabetes; pre-diabetes or
  lifestyle-controlled; controlled by oral or non-insulin injectable medication;
  insulin-dependent), with recruitment sampling aimed at approximately equal distribution
  across diabetes severity, self-reported race/ethnicity, and sex. Each participant
  completed pre-visit questionnaires, a single on-site visit of roughly 2.5 to 4 hours, and
  a 10-day at-home monitoring period. Data domains include survey and social determinants
  of health responses, physical measurements and vitals, clinical laboratory results from
  blood and urine, cognitive screening, monofilament testing for peripheral neuropathy,
  vision testing, 12-lead electrocardiography, retinal photography, optical coherence
  tomography (OCT), OCT angiography (OCTA), fluorescence lifetime imaging ophthalmoscopy
  (FLIO), continuous glucose monitoring, wearable activity monitoring, and indoor
  environmental sensing. The release comprises 356,343 files totaling approximately 3.82 TB,
  organized according to the Clinical Dataset Structure (CDS) v0.1.1 with per-domain
  file-format standards (DICOM, OMOP CDM, WFDB, Open mHealth, and NASA ASCII/ESDS
  guidelines). The public release contains no protected health information; information on
  participant sex, race/ethnicity, and medications used has been removed and is held under
  controlled access. The dataset is hypothesis agnostic, was designed to support downstream
  pseudotime manifold analysis of disease trajectories and salutogenesis (the pathway from
  disease back to health), and carries no labels or targets.
