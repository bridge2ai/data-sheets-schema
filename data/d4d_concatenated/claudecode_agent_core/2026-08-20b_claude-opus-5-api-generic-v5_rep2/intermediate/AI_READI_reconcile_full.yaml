raw_data_sources:
  - source_description: >-
      Twelve-lead electrocardiogram recordings as exported from the Philips PageWriter TC30
      cardiograph at the point of care.
    source_type: Device export
    raw_data_format: XML (.xml)
    access_details: >-
      Exported to local storage at the data collection site and later converted to WFDB for
      release. The raw exports are retained by the project but are not distributed.
  - source_description: >-
      Montreal Cognitive Assessment results captured by the MoCA Duo application on an iPad,
      comprising total score, section subscores, Memory Index Score and task completion times.
    source_type: Application export
    raw_data_format: CSV (.csv)
    access_details: >-
      Exported to local storage at the data collection site; mapped to OMOP CDM for release.
  - source_description: >-
      Retinal imaging exports from the Topcon Maestro2 and Topcon Triton devices in the
      manufacturer's proprietary format.
    source_type: Imaging device export
    raw_data_format: Topcon .fda
    access_details: >-
      Converted to DICOM prior to upload to FAIRhub; the proprietary files are retained by the
      project but are not distributed.
  - source_description: >-
      Fluorescence lifetime imaging ophthalmoscopy exports from the Heidelberg FLIO device in
      the manufacturer's proprietary format.
    source_type: Imaging device export
    raw_data_format: .sdt
    access_details: >-
      Converted to DICOM prior to upload to FAIRhub.
  - source_description: >-
      Retinal imaging exports from the Optomed Aurora, iCare EIDON, Heidelberg Spectralis and
      Zeiss Cirrus 5000 devices, which produce DICOM natively.
    source_type: Imaging device export
    raw_data_format: DICOM
    access_details: >-
      Uploaded to FAIRhub after quality control by the site data manager.
  - source_description: >-
      Physical activity, heart rate, sleep, oxygen saturation, respiratory rate, stress and
      calorie data recorded by the Garmin Vivosmart 5 over the 10-day at-home period at a
      five-second sampling interval.
    source_type: Wearable device export
    raw_data_format: Garmin .FIT
    access_details: >-
      Converted to the Open mHealth standard for the dataset; raw .FIT files are not
      distributed.
  - source_description: >-
      Blood glucose measurements recorded every five minutes by the Dexcom G6 continuous
      glucose monitor over the 10-day at-home period.
    source_type: Wearable device export
    raw_data_format: CSV (.csv)
    access_details: >-
      Downloaded from the transmitter or via Dexcom Clarity by study staff within the 30-day
      transmitter storage window, then converted to Open mHealth format for release.
  - source_description: >-
      Ambient temperature, relative humidity, nitrogen oxides, volatile organic compounds,
      particulate matter and multi-spectral light intensity recorded by the LeeLab Anura
      environmental sensor over the 10-day at-home period.
    source_type: Sensor export
    raw_data_format: CSV (.csv)
    access_details: >-
      Downloaded by study staff on device return and released following the NASA ASCII File
      Format Guidelines for Earth Science Data.
  - source_description: >-
      REDCap database records covering participant-reported questionnaires and the clinical
      data entered during the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results and complete blood count results.
    source_type: Electronic data capture system
    raw_data_format: REDCap database export
    access_details: >-
      Held by the study team; mapped to the OMOP Common Data Model for release. Raw records
      are not shared because they have not been mapped to standardized terminologies and
      because free text fields may accidentally contain personal health information.
  - source_description: >-
      Central clinical laboratory results for serum, plasma, whole blood and urine assays
      performed by the University of Washington Nutrition and Obesity Research Center, and
      complete blood counts performed by CLIA-certified laboratories local to each site.
    source_type: Laboratory information system export
    raw_data_format: CSV (.csv)
    access_details: >-
      Provided to the study team in CSV and mapped to the OMOP Common Data Model for release.
  - source_description: >-
      Electronic health records at the three health systems, screened for ICD-10 diagnosis
      codes R73.09 and E11.X and for demographic data to build recruitment pools of patients
      aged 40 and over with an encounter between 2020 and 2025.
    source_type: Electronic health record
    access_details: >-
      Used for recruitment and screening under the IRB-approved protocol. Past health records
      are held under controlled access and are not part of the public release.

preprocessing_strategies:
  - preprocessing_details: >-
      All data were mapped to applicable standardized terminologies and data models where
      possible: the Observational Medical Outcomes Partnership Common Data Model for clinical
      data and the DICOM standard for retinal imaging. Current medications were coded with
      RxNorm codes at the point of collection.
  - preprocessing_details: >-
      Proprietary imaging exports were transformed into standard formats before upload:
      Topcon .fda files from the Maestro2 and Triton devices and Heidelberg .sdt files from
      the FLIO device were converted to DICOM for the dataset.
  - preprocessing_details: >-
      Garmin Vivosmart 5 .FIT exports were converted to the Open mHealth standard, and Dexcom
      G6 CSV exports were likewise released in Open mHealth format.
  - preprocessing_details: >-
      The released dataset is organized following the Clinical Dataset Structure (CDS)
      v0.1.1: one directory per data type at the root, one modality directory within each data
      type, one device directory within each modality, and one directory per participant named
      by the participant's study ID number. Each data type directory carries a manifest.tsv
      metadata file and the root carries the CDS metadata files.
  - preprocessing_details: >-
      Protected Health Information was removed from the public release, along with information
      related to participant sex and race/ethnicity, to prevent stigmatization of findings, and
      information about medications used.
  - preprocessing_details: >-
      Processing moved from custom and ad hoc handling in version 1.0.0 to a mix of automated
      and custom pipelines for the year 2 and year 3 data included in versions 2.0.0 and
      3.0.0.
  - preprocessing_details: >-
      Data are uploaded at regular intervals from each site to FAIRhub, a Microsoft
      Azure cloud-based data management, curation and sharing platform developed for this
      project, where they are stored and shared as AI-ready so as to enable immediate AI/ML
      research without reformatting and preprocessing.

cleaning_strategies:
  - cleaning_details: >-
      Clinical data outside expected minimum and maximum ranges were flagged in REDCap at the
      time of data entry or acquisition, and the flags were visible in reports viewed by
      clinical research coordinators and data managers, who used them to examine participant
      records and determine whether an error was likely.
  - cleaning_details: >-
      Data were checked for four classes of problem and edited where errors were detected:
      credibility, based on range checks determining whether all responses fall within a
      prespecified reasonable range; incorrect flow through prescribed skip patterns; missing
      data that can be directly filled from other portions of an individual's record; and the
      omission or duplication of records.
  - cleaning_details: >-
      Editing was performed only under the guidance and approval of the site principal
      investigator. Where corrected data were available elsewhere in the respondent's answers,
      the error was corrected; where there was no logical or appropriate way to correct the
      data, the site principal investigator reviewed the values and decided whether they
      should be removed.
  - cleaning_details: >-
      The data manager at each site was responsible for quality control of all data before
      upload to FAIRhub. No instances were excluded from the dataset at the time of
      preprocessing.
  - cleaning_details: >-
      The dataset has not undergone any formal external audit, but was reviewed internally by
      AI-READI team members for quality checks and to ensure that no personally identifiable
      information was accidentally included. A dqd_omop.json file supports running the OMOP
      CDM Data Quality Dashboard, a tool that executes more than 3,500 data quality checks
      against an OMOP CDM instance.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; coverage varies by modality and
      by participant.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In a few cases the
      data collection device had no stored results or was returned too late to retrieve the
      results, for example because the battery died or data were lost. In a few cases a data
      collision occurred at some point in the process and data were lost.
    handling_strategy: >-
      Missing modality data are simply absent from the affected participant's directories; no
      imputation is described. During data entry, missing values that could be directly filled
      from other portions of an individual's record were identified by the quality control
      checks and completed where a logical basis existed, with site principal investigator
      approval.
  - missing_data_patterns: >-
      Skipped questions and incomplete responses in survey data.
    missing_data_causes: >-
      Expected participant behavior in self-administered questionnaires; incorrect flow
      through prescribed skip patterns was also checked for during cleaning.
    handling_strategy: >-
      Skip pattern errors were flagged and corrected where possible under site principal
      investigator approval; genuinely skipped items remain missing.
  - missing_data_patterns: >-
      Gaps within the ten-day wearable and sensor recording windows, and image sets that are
      absent or degraded.
    missing_data_causes: >-
      For wearables, improper use, technical failure such as battery failure or system
      malfunction, and, for the Garmin Vivosmart 5 specifically, the need to charge the
      battery every two to three days. For imaging, patient non-cooperation, noise that may
      obscure the images, system malfunction, and data transfer failures.
    handling_strategy: >-
      Affected records are absent or noisy rather than corrected; the anomalies are documented
      in the dataset documentation and healthsheet so that users can account for them.

anomalies:
  - anomaly_details: >-
      Not all modalities are available for all participants, because some participants elected
      not to participate in some study elements, because a device had no stored results or was
      returned too late, because a battery died or data were lost, or because of a data
      collision at some point in the process.
  - anomaly_details: >-
      In survey data, skipped questions and incomplete responses are expected.
  - anomaly_details: >-
      In wearable data, improper use and technical failures such as battery failure or system
      malfunction are expected.
  - anomaly_details: >-
      In imaging data, patient non-cooperation, noise that may obscure the images, technical
      failures such as system malfunction, and data transfer failures are expected.
  - anomaly_details: >-
      Optomed Aurora fundus images are acquired undilated with a handheld camera in a dark
      room while the participant reclines; because obtaining a good view is challenging
      without dilation and the camera is handheld, image quality varies from participant to
      participant and within the same participant.
  - anomaly_details: >-
      FLIO acquisition is highly sensitive: the device cannot tolerate more than one
      centimeter of movement during image acquisition, unwanted signals such as background
      light or lens fluorescence cannot simply be subtracted because they share the same
      Poisson distribution as the useful data, and because FLIO takes longer than a standard
      OCT and exposes participants to uncomfortable light levels it is performed last in the
      visit, when participant compliance may be at its lowest.
  - anomaly_details: >-
      Heidelberg Spectralis acquisition is operator-dependent and not fully automated, so
      quality issues may arise that lead to skipping the modality and consequent missing data.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers, so there is selection bias known as volunteer bias, which
      may limit the generalizability of results to those not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of the composition of enrolled participants and
      adjustment by under- and oversampling groups as needed.
  - bias_type: sampling_bias
    bias_description: >-
      Recruitment is drawn from the patient populations of three academic health systems and
      is predominantly urban and hospital-based, which may not fully capture all possible
      cultural and socioeconomic backgrounds.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic variability across the
      United States and to ensure representation across various racial and ethnic groups, and
      individuals from all demographic backgrounds were recruited at all three sites. Uniform
      data collection protocols were implemented for all subjects irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites.
  - bias_type: representation_bias
    bias_description: >-
      While the study aims for balance across race/ethnicity, biological sex and diabetes
      severity, interim releases including this one may not have achieved that balance because
      enrollment is ongoing. The cohort does not include other racial and ethnic groups such
      as Pacific Islanders and Native Americans. Recruiting Black men into health research is
      documented to be more difficult than recruiting other populations, with medical mistrust
      and fear for safety stemming from historical events such as the Tuskegee syphilis study,
      even though this population bears a disproportionate share of the T2DM burden; similar
      trends of under-recruitment alongside high disease burden have been reported for
      Hispanic and Asian persons. Requiring participants to speak, read and understand English
      may have created further challenges in recruiting Hispanic and Asian persons.
    affected_subsets:
    - >-
      Black, Hispanic and Asian participants; Pacific Islander and Native American populations
      are absent entirely.
    mitigation_strategy: >-
      Triple-balanced recruitment targets with wave-by-wave monitoring; site-specific
      prioritization of racial and ethnic groups reflecting local demographics; a Community
      Advisory Board including diversity in race and ethnicity; a stated commitment to
      implement new recruitment strategies if balancing emerges as a challenge; and a
      recommended data split constructed so that validation and test sets are balanced as far
      as possible for sex, race/ethnicity and diabetes status.
  - bias_type: measurement_bias
    bias_description: >-
      Multiple imaging devices and multiple operators contribute to a single measure, and
      some devices are operator-dependent, introducing operator-induced variability. The
      handheld undilated Optomed camera and the manually operated Spectralis are specifically
      noted as sources of variable image quality, while the automated Topcon and EIDON
      acquisitions minimize operator involvement.
    mitigation_strategy: >-
      Information on device make and model, including specific modalities such as macula scans
      or wide scans during OCT, was documented to ensure repeatability, and multiple devices
      were deliberately included for one measure to enhance generalizability and represent the
      broad range of equipment used in clinical settings. All personnel were trained under a
      common Manual of Procedures and had to demonstrate competence on at least three practice
      subjects before enrolling participants.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Although the cross-sectional design ultimately aims to achieve balance across
      race/ethnicity, biological sex and diabetes presence and severity, interim releases are
      not balanced across these parameters because enrollment is ongoing.
    scope_impact: >-
      Analyses assuming demographic or severity balance in this release may be misled.
    recommended_mitigation: >-
      Use the recommended validation and test splits, which are balanced as far as possible,
      or await later releases as enrollment completes.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The study cohort does not include other races and ethnicities such as Pacific Islanders
      and Native Americans, and recruitment is predominantly urban and hospital-based.
    scope_impact: >-
      Models derived from the dataset may not generalize to populations not represented in it.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility required the ability to provide consent, age 40 or older (with an upper
      limit of 85 recorded in the FAIRhub eligibility criteria), and the ability to speak and
      read English; pregnancy, gestational diabetes and type 1 diabetes were exclusion
      criteria.
    scope_impact: >-
      Findings do not extend to younger adults, to people with type 1 or gestational diabetes,
      to pregnant people, or to people who do not read English.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The study is cross-sectional and there is currently only one visit per participant.
      Longitudinal follow-up is planned for approximately 4 to 10 percent of the cohort in year
      4 of the project and is not part of this release.
    scope_impact: >-
      Within-person change over time cannot be studied from this release; the intended
      pseudotime analyses substitute cross-sectional severity variation for longitudinal
      observation.
  - limitation_type: methodological_limitation
    limitation_description: >-
      No labels or targets are provided and no labeling was performed, and the project has no
      formal guidelines recommending how future researchers should create new labels or define
      new tasks.
    scope_impact: >-
      Supervised learning applications require users to define and derive their own outcome
      definitions.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Sex, race, ethnicity, medications, 5-digit ZIP code, genetic sequencing data, past
      health records, and traffic and accident reports are withheld from the public release
      and available only under a data use agreement.
    scope_impact: >-
      Subgroup, fairness and pharmacological analyses cannot be conducted on the public
      release alone.
    recommended_mitigation: >-
      Request the controlled access version through the data use agreement process.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The Snellen visual acuity variables present in earlier versions were dropped in version
      3.0.0, so only logMAR visual acuity measurements are available.
    scope_impact: >-
      Analyses relying on Snellen notation must convert from logMAR or use an earlier version,
      which is no longer accessible on FAIRhub.
  - limitation_type: methodological_limitation
    limitation_description: >-
      A limitation of the biorepository is that there are a finite number of samples to share
      with scientists interested in using them in research; procedures for reviewing and
      prioritizing written requests will be developed before the biorepository is complete.
    scope_impact: >-
      Ancillary specimen-based studies will be constrained by sample availability. The
      specimens are not part of this data release.

labeling_strategies:
  - labeling_details: >-
      No labeling or annotation was performed on the dataset and no explicit label or target
      is associated with any data instance, because the dataset is hypothesis agnostic and is
      aimed at facilitating multiple potential downstream AI/ML applications. No gold-standard
      or proxy labels were computed, no human labellers were engaged, no rater agreement
      applies, and no software was used to label instances. The project does not provide
      formal guidelines for future researchers creating new labels or defining new tasks.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    derivation: >-
      Study-assigned participant number; names the participant directory within each data
      type, modality and device folder and is the key of the participants.tsv file.
  - variable_name: recommended_split
    data_type: categorical
    categories:
      - Train
      - Val
      - Test
    derivation: >-
      Assigned by the project team so that validation and test sets are balanced as far as
      possible for sex, race/ethnicity and diabetes status; distributed in participants.tsv.
    quality_notes: New in version 3.0.0; proportions are 70/15/15.
  - variable_name: diabetes_status_group
    data_type: categorical
    categories:
      - No DM (no type 1 or type 2 diabetes)
      - Lifestyle (pre-type 2 diabetes, or type 2 diabetes controlled by lifestyle adjustments)
      - Oral (type 2 diabetes controlled by oral or injectable medications other than insulin)
      - Insulin (type 2 diabetes controlled by insulin)
    measurement_technique: >-
      Self-reported diabetes health status and treatments captured in the screening
      questionnaire; recruitment pools identified from ICD-10 codes R73.09 and E11.X in the
      electronic health record.
  - variable_name: age
    data_type: integer
    unit: years
    minimum_value: 40.0
    maximum_value: 85.0
    quality_notes: >-
      Eligibility required age 40 or older; the FAIRhub eligibility criteria record a maximum
      age of 85 years. Mean age across the release is 60.8 years with a standard deviation of
      11.3.
  - variable_name: sex
    data_type: categorical
    categories:
      - male
      - female
    is_sensitive: true
    measurement_technique: Self-reported biological sex captured in the screening questionnaire.
    quality_notes: >-
      Withheld from the public release to prevent stigmatization of findings; available under
      controlled access. Aggregate counts are published in the README split table.
  - variable_name: race_ethnicity
    data_type: categorical
    categories:
      - Asian
      - Black
      - Hispanic
      - White
    is_sensitive: true
    measurement_technique: Self-reported race and ethnicity captured in the screening questionnaire.
    quality_notes: >-
      Withheld from the public release; available under controlled access. Aggregate counts
      are published in the README split table.
  - variable_name: zip_code_5_digit
    data_type: string
    is_sensitive: true
    is_identifier: false
    quality_notes: Held under controlled access; not included in the public release.
  - variable_name: hba1c
    data_type: float
    unit: "%"
    measurement_technique: >-
      Whole blood assay performed by the University of Washington Nutrition and Obesity
      Research Center on samples batch-shipped frozen on dry ice.
    quality_notes: >-
      Reference range supplied by the testing laboratory is 4.0 to 6.0 percent. Included as a
      marker for diabetes.
  - variable_name: glucose
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay performed by the UW Nutrition and Obesity Research Center.
    quality_notes: Laboratory reference range 62 to 125 mg/dL.
  - variable_name: continuous_glucose
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Dexcom G6 continuous glucose monitor sensor reading recorded every five minutes over a
      ten-day at-home wear period; participants were masked to the readings during monitoring.
    quality_notes: >-
      No missing-value code is documented in the input sources. Gaps in the series arise where
      the sensor failed, was removed early, or where the transmitter's 30-day storage window
      elapsed before download.
  - variable_name: c_peptide
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay, UW Nutrition and Obesity Research Center.
    quality_notes: Laboratory reference range 1.1 to 4.4 ng/mL; indicator of insulin production.
  - variable_name: insulin
    data_type: float
    unit: ng/mL
    measurement_technique: EDTA plasma assay, UW Nutrition and Obesity Research Center.
    quality_notes: Laboratory reference range 0.0 to 24.9 ng/mL; marker for diabetes.
  - variable_name: nt_probnp
    data_type: float
    unit: pg/mL
    measurement_technique: EDTA plasma assay, UW Nutrition and Obesity Research Center.
    quality_notes: >-
      N-terminal pro-B-type natriuretic peptide; reference range varies by age. Included as a
      severity and outcome predictor of heart failure.
  - variable_name: troponin_t
    data_type: float
    unit: ng/L
    measurement_technique: EDTA plasma assay, UW Nutrition and Obesity Research Center.
    quality_notes: >-
      Laboratory reference range female under 11, male under 16; marker of myocardial injury.
  - variable_name: c_reactive_protein_high_sensitivity
    data_type: float
    unit: mg/L
    measurement_technique: Serum assay, UW Nutrition and Obesity Research Center.
    quality_notes: >-
      Laboratory reference range 0.0 to 10.0 mg/L; inflammation marker and risk factor for
      T2DM.
  - variable_name: total_cholesterol
    data_type: float
    unit: mg/dL
    measurement_technique: Serum lipid panel, UW Nutrition and Obesity Research Center.
    quality_notes: Laboratory reference value under 200 mg/dL.
  - variable_name: ldl_cholesterol
    data_type: float
    unit: mg/dL
    derivation: Calculated rather than directly measured.
    quality_notes: Laboratory reference value under 130 mg/dL.
  - variable_name: creatinine
    data_type: float
    unit: mg/dL
    measurement_technique: Serum assay, UW Nutrition and Obesity Research Center.
    quality_notes: >-
      Laboratory reference range female 0.38 to 1.02, male 0.51 to 1.18; marker of kidney
      function.
  - variable_name: urine_albumin
    data_type: float
    unit: mg/dL
    measurement_technique: Urine assay, UW Nutrition and Obesity Research Center.
    quality_notes: >-
      No reference range supplied by the testing laboratory; urinary biomarker for early
      diabetic nephropathy.
  - variable_name: systolic_blood_pressure
    data_type: float
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric medically approved device (OMRON HEM 907XL, Medline MDS4001, or
      Welch Allyn 6000 series depending on site), measured twice separated by two minutes.
    quality_notes: >-
      Readings over 180 mm Hg or under 100 mm Hg with symptoms of hemodynamic instability
      triggered an emergency care recommendation during the visit.
  - variable_name: heart_rate
    data_type: float
    unit: beats per minute
    measurement_technique: >-
      Measured twice with the automatic blood pressure device during the visit, and recorded
      continuously by the Garmin Vivosmart 5 during the at-home period.
  - variable_name: body_mass_index
    data_type: float
    derivation: Calculated from measured height and weight.
  - variable_name: waist_hip_ratio
    data_type: float
    derivation: Calculated from measured waist and hip circumference.
  - variable_name: moca_total_score
    data_type: integer
    maximum_value: 30.0
    measurement_technique: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application; section subscores, Memory Index Score and task completion times are also
      captured.
    quality_notes: >-
      Total possible score is 30 and higher numbers represent better performance. Scoring
      requires training, and a person's education level, socioeconomic factors, and depression
      or other mental health conditions may affect the result.
  - variable_name: visual_acuity_logmar
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at four meters under best-corrected
      conditions, right and left eyes tested separately, under photopic conditions and under
      mesopic conditions using a 2.0 neutral density filter.
    quality_notes: >-
      Expressed as the logarithm of the minimum angle of resolution; lower numbers indicate
      better resolution. The Snellen visual acuity variables available in earlier versions were
      dropped in version 3.0.0.
  - variable_name: letter_contrast_sensitivity
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars Letter Contrast Sensitivity chart read monocularly under photopic and mesopic
      conditions, in the standardized order photopic right eye, photopic left eye, mesopic
      right eye, mesopic left eye.
    derivation: >-
      Log contrast sensitivity is recorded by multiplying the number of errors prior to the
      final correct letter by 0.04 and subtracting the result from the log CS value at the
      final correct letter.
    quality_notes: Higher numbers mean better sensitivity.
  - variable_name: autorefraction_sphere_cylinder_axis
    data_type: float
    unit: diopter
    measurement_technique: >-
      Topcon KR 800 autorefractor standard protocol, obtaining spherical and cylindrical
      components with cylindrical axis for each eye.
  - variable_name: monofilament_response
    data_type: categorical
    categories:
      - "yes (filament felt)"
      - "no (insensate)"
    measurement_technique: >-
      Standard 10 g monofilament applied with the participant's eyes closed to three locations
      on the plantar surface of each foot, ten times per location, with insensate areas
      retested for confirmation.
  - variable_name: steps
    data_type: integer
    measurement_technique: Garmin Vivosmart 5 worn on the wrist for ten consecutive days.
  - variable_name: oxygen_saturation
    data_type: float
    unit: "%"
    measurement_technique: Garmin Vivosmart 5 worn on the wrist for ten consecutive days.
  - variable_name: sleep_duration
    data_type: float
    measurement_technique: >-
      Garmin Vivosmart 5, capturing circadian and diurnal rhythm and sleep phases over the
      ten-day at-home period.
  - variable_name: ambient_temperature
    data_type: float
    measurement_technique: >-
      LeeLab Anura custom environmental sensor placed in a frequently used area of the
      participant's home for ten days.
  - variable_name: relative_humidity
    data_type: float
    unit: "%"
    measurement_technique: LeeLab Anura custom environmental sensor.
  - variable_name: particulate_matter
    data_type: float
    measurement_technique: >-
      LeeLab Anura custom environmental sensor, recording counts for PM1.0, PM2.5, PM4 and
      PM10.
  - variable_name: nitrogen_oxides
    data_type: float
    measurement_technique: >-
      LeeLab Anura custom environmental sensor, recording NO and NO2; the sensor documentation
      describes a NOx Index rather than an absolute concentration.
  - variable_name: volatile_organic_compounds
    data_type: float
    measurement_technique: LeeLab Anura custom environmental sensor.
  - variable_name: multispectral_light_intensity
    data_type: float
    measurement_technique: >-
      LeeLab Anura custom environmental sensor, recording eleven multi-spectral light intensity
      channels.

