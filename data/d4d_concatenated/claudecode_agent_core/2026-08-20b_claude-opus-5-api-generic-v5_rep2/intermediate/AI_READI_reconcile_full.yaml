notes: >-
  FAIRhub records a child dataset (identifier 4) for this release, offered on the dataset page
  as "a smaller version available for pipeline development"; the v3.0.0 documentation covers
  the mini-subset alongside Azure Storage access. The dataset page and documentation site both
  display the notice "This repository is under review for potential modification in compliance
  with Administration directives". As of the captured API record the release had 24,636 views
  and zero recorded citations. The healthsheet states that there is currently no mechanism for
  parties outside the project to extend or augment the dataset, and that no repository tracks
  papers or systems that use it beyond general indexes such as Google Scholar; both slots are
  therefore left unpopulated rather than used to record an absence.

source_caveats: >-
  This record describes version 3.0.0 of the Flagship Dataset of Type 2 Diabetes from the
  AI-READI Project, the current release; version 2.0.0 material in the bundle is treated as
  superseded. Several disagreements across the input sources are worth flagging. (1) The
  expansion of the AI-READI acronym differs: the BMJ Open protocol and the Nature Metabolism
  comment use "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights", while
  NIH RePORTER, the FAIRhub study description, the healthsheet and the RO-Crate use "Artificial
  Intelligence Ready and Exploratory Atlas for Diabetes Insights". (2) Institutional attribution
  for the study leadership conflicts: FAIRhub metadata and the license name Washington
  University in St. Louis (ROR 01yc7t268) as lead sponsor, managing organization, licensor and
  affiliation of Aaron Lee and Cecilia Lee, while the RO-Crate names the University of
  Washington Department of Ophthalmology for the principal investigator, NIH RePORTER lists the
  awardee organization as University of Washington, and the IRB and consent materials are those
  of the University of Washington; the sources are of equal rank and both readings are
  reported. (3) Enrollment start is given as 18 July 2023 by the BMJ Open protocol and 19 July
  2023 by the FAIRhub study and dataset metadata; the higher-ranked FAIRhub value is used for
  the release collection window, and the BMJ value for the BMJ-sourced recruitment window. (4)
  Target enrollment is given as 4,000 by the BMJ Open protocol, the Nature Metabolism comment,
  the FAIRhub study description and the RO-Crate, as "4,000+" plus longitudinal data from 10
  percent of the cohort by NIH RePORTER, and as 4,600 by the IRB protocol application; the
  4,000 figure is used. (5) The dataset documentation pages for both v2.0.0 and v3.0.0 state
  that the version "contains data from the participants of the pilot study phase", which
  conflicts with the README, abstract and healthsheet for v3.0.0 (2,280 participants collected
  through 1 May 2025) and appears to be a carry-over in the documentation template. (6) The
  healthsheet demographic section answers "No" to whether the dataset identifies demographic
  sub-populations, while the README split table reports race/ethnicity and sex counts; the two
  are reconcilable if the answer refers to variables released in the public data rather than to
  aggregate documentation. (7) Healthsheet composition question 13 and preprocessing question 1,
  both concerning de-identification, and maintenance question 3 concerning errata, are left
  blank in the source. (8) The RO-Crate lists six categories under personal sensitive
  information while the healthsheet states the public dataset contains no sensitive data; both
  are recorded in sensitive_elements. (9) The RO-Crate gives the collection window in its
  release-plan text as "up through the end of the second year of the study" while also giving
  the dates 19 July 2023 to 1 May 2025 and the README describes the same release as adding
  year 3 data; the dates are used rather than the study-year label. (10) The eligibility upper
  age limit of 85 years appears in the FAIRhub study description and the IRB protocol but not
  in the BMJ Open protocol, which states only age 40 and older. (11) The RO-Crate was retrieved
  as a standalone metadata package rather than from the FAIRhub distribution, and
  ro-crate-metadata.json is not among the nine CDS metadata files the dataset structure
  description lists at the dataset root; RO_CRATE is nonetheless recorded under
  conforms_to_standard because the crate declares conformance to RO-Crate 1.2-DRAFT and locates
  ro-crate-metadata.json at the dataset root and within each data type directory. (12)
  Identifiers minted for parts of this dataset, namely the file collections and the recommended
  splits, are fragments on the FAIRhub landing page URL rather than on the dataset DOI, because
  a DOI does not admit a resolvable fragment.