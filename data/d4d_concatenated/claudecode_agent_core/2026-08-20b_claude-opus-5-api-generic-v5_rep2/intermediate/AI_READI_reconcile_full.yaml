purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal
      dataset on type 2 diabetes mellitus that can be used immediately for artificial
      intelligence and machine learning research without further reformatting or
      preprocessing.
  - response: >-
      To enable AI/ML research into salutogenesis in type 2 diabetes, that is, the pathway
      from disease back to health, alongside pathogenesis, by assembling a cohort spanning
      the full range of diabetes severity from no diabetes to insulin-dependent T2DM.
  - response: >-
      To establish and disseminate standards, best practices and guidelines for the
      collection, preparation and sharing of data for AI/ML purposes, including ethical and
      equitable data collection and management and adherence to the FAIR (Findable,
      Accessible, Interoperable, Reusable) principles, so that the approach can serve as a
      model for future biomedical data generation projects.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria and can be used to reconstruct a temporal atlas of T2DM
      development and reversal toward health.

addressing_gaps:
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such
      as type 2 diabetes has been limited by the lack of well-designed, high-quality, large
      and inclusive multimodal datasets; a major barrier to AI in this area has been the
      absence of diverse datasets that are AI ready for training models.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published from 2000 to 2020
      found that samples lacked racial and ethnic diversity. The AI-READI cohort is designed
      to be approximately balanced across Asian, Black, Hispanic and White participants
      rather than reflecting the demographic distribution of the US population, addressing
      that gap and supporting the development of less biased machine learning models.
  - response: >-
      Existing data sources such as insurance claims or electronic health records do not
      support the downstream AI/ML analyses the project targets; a purpose-built acquisition
      protocol spanning survey, physical, clinical, imaging, and wearable device domains was
      designed to make those analyses feasible.
  - response: >-
      Study populations in previous epidemiological studies and clinical trials on T2DM were
      not balanced across diabetes severity, which limits the modeling of disease
      trajectories; the cohort is balanced across four severity groups to facilitate
      pseudotime manifold analysis of those trajectories.

tasks:
  - response: >-
      Pseudotime manifold analysis to predict disease trajectories, learning from complex
      multimodal data collected from participants with differing disease severity in order
      to reconstruct a temporal atlas of T2DM development and reversal toward health.
  - response: >-
      Development of multimodal artificial intelligence and machine learning models of type
      2 diabetes across imaging, waveform, tabular, and wearable sensor modalities.
  - response: >-
      Research into salutogenesis in type 2 diabetes, that is, the identification of
      pathways by which individuals move from disease toward health resilience.

intended_uses:
  - use_category: Type 2 diabetes related research
    usage_notes: >-
      Access to the public dataset is conditional on the requester agreeing to use the data
      only for type 2 diabetes related research. A private (controlled access) version is
      intended to allow more generic use.
    examples:
    - >-
      Studies of salutogenic pathways in T2DM; analyses of the relationship between
      continuous glucose monitoring, activity, environmental exposure and clinical measures.
  - use_category: Artificial intelligence and machine learning model development
    usage_notes: >-
      The dataset is stored and shared as AI-ready, which the project defines as enabling
      immediate AI/ML research without reformatting and preprocessing. A recommended
      70/15/15 train/validation/test split balanced for age, sex, race/ethnicity and study
      group is distributed in participants.tsv.
    examples:
    - >-
      Training and evaluating multimodal models spanning retinal imaging, ECG waveforms,
      clinical tabular data and wearable sensor streams.
  - use_category: Analysis pipeline development
    usage_notes: >-
      A smaller mini version of the dataset is made available on FAIRhub for pipeline
      development, and the v3.0.0 documentation covers the mini-subset and Azure Storage
      access under its Preliminary Information section.
  - use_category: Commercial and non-commercial research use
    usage_notes: >-
      The license grants a non-exclusive, non-transferable license to download, reproduce
      and use the data, and to create derivative works, for research, commercial and
      non-commercial purposes, subject to the sharing, storage, model-interaction and
      publication restrictions set out in the agreement.

other_tasks:
  - task_details: >-
      The dataset was assembled to be hypothesis agnostic, with a protocol composed of
      assessments from many health domains likely to be affected by T2DM rather than
      designed around a specific hypothesis, so it is expected to support downstream
      analyses that the creators did not plan.
  - task_details: >-
      A study-wide biorepository of plasma, serum, buffy coats, genomic DNA, PAXgene
      RNA tubes and peripheral blood mononuclear cells is being assembled at the University
      of Alabama at Birmingham Center for Clinical and Translational Science to support
      future ancillary studies including whole genome sequencing, proteomics, metabolomics,
      RNA isolation, immunological studies and generation of induced pluripotent stem cells.
      These specimens are not part of this data release; procedures for reviewing and
      prioritizing written requests are still in development and the number of samples is
      finite.

discouraged_uses:
  - discouragement_details: >-
      Analyses that depend on demographic balance should not treat interim releases as
      balanced. Enrollment is ongoing and the periodic data releases, including this one,
      may not have achieved the intended balanced distribution across race/ethnicity,
      biological sex and diabetes severity groups.
  - discouragement_details: >-
      Fairness or subgroup analyses stratified by sex, race or ethnicity cannot be performed
      on the public release, because those variables are withheld and available only under
      controlled access. The project instead supplies a recommended data split constructed
      to reduce disparities in models developed from the public data.
  - discouragement_details: >-
      Generalization beyond the sampled setting should be treated cautiously. Recruitment
      was predominantly urban and hospital-based at three academic health systems, may not
      capture the full range of cultural and socioeconomic backgrounds, requires English
      literacy, and does not include other racial and ethnic groups such as Pacific
      Islanders and Native Americans.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is prohibited under section 4.A
      of the license, because the data is intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or with other information, to compromise
      the confidentiality or privacy of any data subject, to identify or contact a data
      subject or group of data subjects, to extract or extrapolate identifying information,
      to establish a data subject's membership in a particular group, or otherwise to cause
      harm or injury to a data subject, is prohibited under section 4.B of the license.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or
      otherwise conveying any portion of the data or any derivative work to a third party is
      prohibited under section 3.A, except to another licensee bound by an identical
      agreement and only for collaboration on projects involving the data.
  - prohibition_reason: >-
      Sharing or distributing the data with any third party model vendor or developer for
      training or development purposes, including model weight modification or other
      adjustments to a model's logic or operation, is prohibited under section 3.C even
      where that vendor is party to a HIPAA business associate agreement; only short-term
      interaction such as prompting or querying by a model under a BAA is permitted.
  - prohibition_reason: >-
      Reproducing the data in papers, articles, presentations, analyses, reports or
      publications is prohibited under section 3.F beyond small representative samples in up
      to five images or figures per paper for illustrative purposes; larger amounts may not
      be published or posted via supplemental files, zip archives, code packages or other
      means, notwithstanding journal or conference requirements.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking that may be applied
      to identify the licensee is prohibited under section 6 of the license.
  - prohibition_reason: >-
      Storing the data anywhere other than servers and devices maintained by and located
      within the licensee's institution or employer, or cloud and remote storage and backup
      services covered by a HIPAA-approved business associate agreement with that
      institution, is prohibited under section 3.B.

future_use_impacts:
  - impact_details: >-
      There is a theoretical risk of future re-identification. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level
      identification, so the project implements a robust data dissemination system, a strict
      license agreement, and data watermarking for both the public and controlled sets.
      Licensees developing models from the data are required to undertake all reasonable
      efforts to minimize the likelihood that the data can be memorized, derived,
      reconstructed or reconstituted through the use or construction of those models.
  - impact_details: >-
      Because enrollment is ongoing and interim releases may not be balanced across
      demographic and severity groups, models trained on an interim release could carry
      forward representation imbalances present in that release.

acquisition_methods:
  - acquisition_details: >-
      On-site clinical measurements, laboratory assays on blood and urine, 12-lead ECG,
      cognitive and monofilament testing, vision testing and retinal imaging were performed
      by trained study personnel during a single in-person visit and recorded directly.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    was_validated_verified: true
  - acquisition_details: >-
      Questionnaire and survey responses, including demographics, depression screening,
      diabetes distress and self-care, diet, smoking, alcohol, vaping and marijuana use,
      general health history, social determinants of health, ophthalmic history and current
      medications, were reported by the participants themselves, mostly online through
      REDCap before the visit. Verification of data entry was performed where possible, for
      example by cross-referencing entered medications against medications physically
      brought in or photographed by the participant.
    was_directly_observed: false
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
  - acquisition_details: >-
      At-home data were acquired automatically by three devices worn or placed by the
      participant over a 10-day period: a Dexcom G6 continuous glucose monitor recording
      every five minutes, a Garmin Vivosmart 5 activity tracker sampling every five seconds,
      and a custom LeeLab Anura environmental sensor. Participants returned the devices to
      study staff with a data sheet recording which wrist the tracker was worn on, their
      dominant hand, and where the environmental sensor was placed.
    was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
  - acquisition_details: >-
      Some released values are derived rather than measured: body mass index and waist-hip
      ratio are calculated from measured anthropometrics, low-density lipoprotein cholesterol
      is a calculated laboratory value, and blood urea nitrogen/creatinine ratio, total
      globulin and the A/G ratio are calculated from other assay results.
    was_inferred_derived: true
    was_directly_observed: false

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for the online recruitment interface, electronic consent, all
      participant questionnaires, and for capture of the following clinical data from the
      visit: medications assessment, vitals, visual acuity, contrast sensitivity,
      monofilament test results and complete blood count results. The exact forms used are
      published with the dataset documentation.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Philips, Amsterdam, The Netherlands) used for the
      12-lead electrocardiogram, performed with the participant sitting in a reclining chair
      or supine, with the chair position recorded as 0, 30, 60 or 90 degrees relative to
      supine. Data were exported in XML.
  - mechanism_details: >-
      Optomed Aurora IQ handheld non-mydriatic fundus camera (Optomed, Oulu, Finland), 50
      degree field of view, 5 Mpix sensor, used undilated in a dark room; four color fundus
      images per participant, macula and disc centered. Output in DICOM.
  - mechanism_details: >-
      iCare EIDON widefield TrueColor confocal fundus imaging system (iCare USA, Raleigh,
      North Carolina), operated in fully automated mode in a dark room; ultra-wide field
      central, nasal and temporal color fundus photographs, central infrared, central
      fundus autofluorescence, and a mosaic of ultra-wide field images, 12 images per
      participant. Output in DICOM.
  - mechanism_details: >-
      Heidelberg Spectralis HRA optical coherence tomography and OCT angiography system
      (Heidelberg Engineering GmbH, Heidelberg, Germany); optic nerve head radial circle high
      resolution OCT, posterior pole macula HR 61-line OCT, and 20 x 20 HS 512-line macular
      OCTA, six images per participant. Output in DICOM.
  - mechanism_details: >-
      Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (FLIO) system (Heidelberg
      Engineering GmbH), macula-centered, two images per participant, recording photon arrival
      timing at short (498-560 nm) and long (560-720 nm) wavelength channels in separate
      files per eye. Exported in .sdt format and converted to DICOM for the dataset.
  - mechanism_details: >-
      Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan); 3D wide
      12 x 9 mm 512 x 128 OCT, 3D macula 6 x 6 mm 512 x 128 OCT, and 6 x 6 mm 360 x 360
      macular OCTA at a 50 kHz scan rate, six images per participant. Exported in .fda format
      and converted to DICOM for the dataset.
  - mechanism_details: >-
      Topcon Triton swept-source DRI OCT (Topcon Healthcare, Itabashi-ku, Tokyo, Japan),
      1,050 nm light source with non-mydriatic color fundus camera; 3D horizontal plus
      radial 12 x 9 mm 512 x 256 OCT, 6 x 6 mm 320 x 320 macular OCTA and 12 x 12 mm
      512 x 512 macular OCTA, six images per participant. Exported in .fda format and
      converted to DICOM for the dataset.
  - mechanism_details: >-
      Zeiss Cirrus 5000 Angioplex (Carl Zeiss Meditec AG, Jena, Germany); disc cube
      200 x 200 OCT, macula cube 512 x 128 OCT, 6 x 6 mm macular OCTA and 6 x 6 mm disc OCTA,
      eight images per participant. Output in DICOM.
  - mechanism_details: >-
      Dexcom G6 continuous glucose monitoring system (Dexcom, Inc., San Diego, California), a
      real-time integrated CGM whose sensor filament is inserted under the skin of the
      abdomen and which records blood glucose in mg/dL every five minutes for up to ten days;
      participants were masked to the readings during the monitoring period. Raw output in
      CSV, released in Open mHealth format.
  - mechanism_details: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland),
      worn on the non-dominant wrist for ten consecutive days at a five-second sampling
      interval, recording steps, heart rate, sleep duration and phases, oxygen saturation,
      respiratory rate, stress and calorie expenditure. Exported in .FIT format and converted
      to the Open mHealth standard for the dataset.
  - mechanism_details: >-
      LeeLab Anura custom-designed indoor environmental sensor (Karalis Johnson Retina Center,
      University of Washington, Seattle, Washington), placed by the participant in a
      frequently used area of the home for ten days, recording ambient temperature, relative
      humidity, nitrogen oxides (NO and NO2), volatile organic compounds, particulate matter
      (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral light intensity measurements. Output
      in CSV.
  - mechanism_details: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application (MoCA Cognition, Quebec, Canada), capturing responses interactively;
      exported as CSV with total score, section subscores, Memory Index Score and task
      completion times.
  - mechanism_details: >-
      M&S Technologies Electronic Visual Acuity tester (M&S Technology, Niles, Illinois), a
      touch-screen monitor of 12 x 20 inches viewed at four meters, used for best-corrected
      photopic and mesopic letter visual acuity with each eye tested separately; mesopic
      testing used a 2.0 neutral density filter or ND occluder.
  - mechanism_details: >-
      Mars Letter Contrast Sensitivity chart (Mars Perceptrix, Chappaqua, New York) read
      monocularly at a designed viewing distance of 50 cm (range 40 to 59 cm) with near
      correction, under photopic conditions and under mesopic conditions using a neutral
      density occluder; chart background luminance 60 to 120 cd/m2, optimally 85 cd/m2, and
      illuminance 189 to 377 lux, optimally 267 lux. Testing terminated after two consecutive
      errors or the end of the chart.
  - mechanism_details: >-
      Topcon KR 800 auto keratometer/refractor (Topcon Healthcare) used for autorefraction of
      each eye, yielding spherical and cylindrical components in diopters with cylindrical
      axis. Lensometry used the NIDEK LM-600P auto lensometer or the Topcon CL-200 or CL-300
      computerized lensometer depending on the site.
  - mechanism_details: >-
      Standard 10 g monofilament applied to three locations on the plantar surface of each
      foot, ten times per location, with the participant's eyes closed and shoes and socks
      removed, responding yes or no; insensate areas were retested for confirmation and
      results were entered into REDCap by clinical research staff.
  - mechanism_details: >-
      Automatic oscillometric medically approved blood pressure devices used across the
      sites: OMRON HEM 907XL, Medline MDS4001 automatic digital blood pressure monitor, and
      Welch Allyn 6000 series vital signs monitor with Welch Allyn FlexiPort reusable cuff.
      Systolic and diastolic blood pressure and heart rate were measured twice, separated by
      two minutes.
  - mechanism_details: >-
      Venous blood (53 mL, non-fasting) and a urine specimen collected during the visit into
      EDTA vacutainers, serum separator vacutainers, CPT mononuclear cell preparation tubes,
      PAXgene RNA vacutainers and a urine collection kit. Complete blood counts were run on
      fresh whole blood by Clinical Laboratory Improvement Amendments-certified laboratories
      local to each site; all other assays were performed by the University of Washington
      Nutrition and Obesity Research Center on stored frozen samples batch-shipped on dry ice
      approximately once per quarter, with results provided in CSV.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Period during which the data contained in version 3.0.0 of the dataset were collected,
      as recorded in the DataCite "Collected" date and in the dataset README and abstract.
    source_caveats: >-
      The BMJ Open protocol publication states that enrollment began on 18 July 2023, one day
      earlier than the 19 July 2023 start date given in the FAIRhub dataset and study
      metadata. The FAIRhub value is preferred here because it is the higher-ranked source
      and is the date attached to this specific release.
  - start_date: '2023-07-18'
    end_date: '2023-11-30'
    timeframe_details: >-
      Preliminary pilot enrollment period, conducted in order to secure sufficient familiarity
      for all coordinators. Formal data collection began on 1 December 2023. Data from the
      pilot enrollment period were included in the first released version of the dataset.
  - start_date: '2023-07-18'
    end_date: '2026-11-30'
    timeframe_details: >-
      Planned overall recruitment window for the study as stated in the BMJ Open protocol,
      which reports that enrollment began on 18 July 2023 and will continue until 30 November
      2026. The FAIRhub study description separately records an anticipated study completion
      date of 1 January 2027. The project timeline spans four years, with one year for
      protocol development and training and years two to four for recruitment and data
      collection.
    source_caveats: >-
      Both dates in this window are taken from the BMJ Open protocol so that the range
      reflects a single source; the FAIRhub metadata gives a start date one day later
      (19 July 2023) and an anticipated completion date of 1 January 2027 rather than a
      recruitment end date.

data_collectors:
  - collector_details: >-
      Clinical research coordinators and research assistants at the University of Alabama at
      Birmingham study site recruited, consented and enrolled participants, conducted study
      visits including ophthalmic imaging, trained participants on the at-home devices, and
      entered data. All research personnel at the three sites underwent training by the data
      manager at UAB using a detailed Manual of Procedures, completed mandatory institutional
      compliance training for human subject research, and were required to administer all
      protocol elements successfully to at least three volunteer practice subjects before
      enrolling participants. Their effort was supported by NIH award OT2OD032644 in
      proportion to percentage of effort, at salaries aligned with the funding guidelines at
      each site.
    role: academic_institution
  - collector_details: >-
      Clinical research coordinators and research assistants at the University of California,
      San Diego study site, trained and certified under the same Manual of Procedures and
      compensated on the same basis.
    role: academic_institution
  - collector_details: >-
      Clinical research coordinators and research assistants at the University of Washington
      study site, trained and certified under the same Manual of Procedures and compensated
      on the same basis.
    role: academic_institution
  - collector_details: >-
      Data managers at each of the three sites oversaw the training and certification
      process and were responsible for quality control of all data before upload to FAIRhub.
    role: researcher
  - collector_details: >-
      The University of Washington Nutrition and Obesity Research Center testing facility
      performed the central clinical laboratory assays on stored frozen serum, plasma, whole
      blood and urine samples.
    role: academic_institution
  - collector_details: >-
      Clinical Laboratory Improvement Amendments-certified laboratories local to each data
      collection site performed complete blood count testing on fresh whole blood samples on
      the day of collection.
    role: other

direct_collection:
  - is_direct: true
    collection_details: >-
      The data were collected directly from participants across the three recruiting sites
      through active, prospective data collection, not passive collection or secondary use of
      existing data.
  - is_direct: false
    collection_details: >-
      Recruitment pools were identified indirectly by screening the electronic health records
      of each site's health system for ICD-10 diagnosis codes (R73.09 for pre-diabetes and
      E11.X for type 2 diabetes) and demographic data among patients aged 40 and over with an
      encounter within the health system. Motor vehicle driving and accident records obtained
      from the state licensing authority, and past health records, are likewise sourced
      indirectly; these are held under controlled access and are not part of the public
      release.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    source_data: >-
      All patients aged 40 years or older who had a medical encounter within one of the three
      health systems (University of Alabama at Birmingham, University of California San
      Diego, University of Washington) between 2020 and 2025. The FAIRhub study description
      records the sampling method as "Non-Probability Sample".
    strategies: >-
      Triple-balanced recruitment: rather than targeting the demographic distribution of the
      US population, the study recruits in approximately equal proportions across four
      self-reported race/ethnicity groups (Asian, Black, Hispanic, White), four categories of
      T2DM severity (no diabetes; pre-diabetes or lifestyle-controlled diabetes; diabetes
      treated with oral or non-insulin injectable medications; insulin-controlled diabetes),
      and biological sex. Participants are recruited in waves, with the composition and size
      of each wave influenced by the observed participation characteristics of
      race/ethnicity, gender, T2DM severity and site; composition is monitored during
      recruitment and adjusted by under- and oversampling groups as needed. All study groups
      are recruited at each site, but the proportion of each group varies with the
      demographic prevalence of that group in the site's geographical area.
    why_not_representative: >-
      Balance across groups, not representativeness of the general population, was the design
      goal, because balanced training datasets are held to be critical for developing
      unbiased machine learning models. Participants are volunteers, so selection bias known
      as volunteer bias may limit generalizability. Recruitment is predominantly urban and
      hospital-based, requires English literacy, and excludes other racial and ethnic groups
      such as Pacific Islanders and Native Americans.
    source_caveats: >-
      The healthsheet answers "the dataset contains all possible instances", meaning all
      participants enrolled during the collection window are included in the release, and
      answers "N/A" to the question about sampling strategy in the preprocessing section. The
      sampling described here is the recruitment sampling from the health-system study base,
      described in the protocol publication and the healthsheet general information section.

collection_consents:
  - consent_details: >-
      Written informed consent was required from all participants before any part of the
      protocol, including questionnaires. For most participants consent was performed
      remotely by computer, tablet or smart phone through a link in the hardcopy invitation
      letter or the invitation email that directed them into REDCap, where they could read
      all consent documentation electronically and sign with an electronic signature without
      verbal communication with a coordinator; potential participants could also decide at
      that point not to participate or to request further information or a call back. Those
      who did not select electronic consent were consented in person at the start of the
      visit, followed by completion of all questionnaires. The approved consent form for the
      principal site, the University of Washington, is published with the documentation; the
      other clinical sites relied on that IRB approval and used the same form with minor
      institution-specific language.

collection_notifications:
  - notification_details: >-
      Each individual was aware of the data collection, since this was active data collection
      directly from participants rather than passive collection or secondary use of existing
      data. Individuals in each recruitment pool were mailed a hardcopy invitation letter and
      sent an invitation email, both personalized with links, access codes and QR codes
      directing them to an online REDCap recruitment interface where they could read an
      overview of the research program, expectations for participation, and answers to
      frequently asked questions, download the informed consent document, request a call back
      from study staff, complete a screening survey, and enroll. Those without internet
      access could call research staff for alternative methods of enrollment.

consent_revocations:
  - revocation_details: >-
      Participants were permitted to withdraw consent at any time and cease study
      participation. Any data that had been shared or used up to that point would remain in
      the dataset. This is clearly communicated in the consent document.

ethical_reviews:
  - review_details: >-
      The study was approved by the Institutional Review Board of the University of
      Washington under approval number STUDY00016228, with reliance agreements covering the
      IRBs of the University of Alabama at Birmingham and the University of California, San
      Diego. Initial IRB approval was received on 20 December 2022 and the initial approval
      letter is published with the dataset documentation. An annual renewal application
      reporting the status and progress of the study is required and is due within 90 days of
      expiration. The FAIRhub study description records the human subject review status as
      "Submitted, approved", the study as not FDA-regulated for either drug or device, and no
      data monitoring committee.
    reviewing_organization: University of Washington Institutional Review Board
    source_caveats: >-
      The RO-Crate metadata names the reviewing body "Washington University IRB" while giving
      the University of Washington Human Subjects Division address in Seattle and the
      hsdrely@uw.edu reliance contact; the IRB protocol and the healthsheet both identify the
      reviewing body as the University of Washington IRB. The University of Washington
      reading is used here because the address and contact in the same RO-Crate record
      correspond to it.
  - review_details: >-
      Ethical, legal and social implications were considered at every stage of the project
      cycle, with guidance from bioethicists. The RO-Crate metadata names Camille Nebeker,
      Debra Mathews, Kadija Ferryman and Nicholas Evans as responsible for ethical review, and
      the project reviewed existing documentation approaches such as datasheets and
      healthsheets to identify the most suitable one for biomedical data. A Community
      Advisory Board of eleven persons from the three sites, including diversity in race and
      ethnicity as represented in the AI-READI sample, contributes to the development of the
      protocol and reviewed the consent forms and research protocols.
    reviewing_organization: AI-READI Consortium ethics team and Community Advisory Board

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    University of Washington IRB protocol STUDY00016228, initially approved 20 December 2022,
    with reliance agreements covering the IRBs of the University of Alabama at Birmingham and
    the University of California, San Diego; annual continuing review required.
  ethics_review_board: University of Washington Institutional Review Board
  regulatory_compliance:
  - >-
    The study is registered on ClinicalTrials.gov as NCT06002048. It is not FDA-regulated for
    drug or device. The public release is de-identified with respect to the HIPAA Privacy
    Rule. Licensees must comply with the data security and privacy standards established by
    the NIH under its Genomic Data Sharing Policy. Data collection took place in the United
    States only.
  special_populations:
  - >-
    No protected populations were purposefully included. Eligibility was restricted to adults
    aged 40 and older, so no minors were enrolled; pregnancy, gestational diabetes and type 1
    diabetes were exclusion criteria. The IRB application records that prisoners were not a
    target population and that no fetuses, neonates or pregnant women were to be included.
    Participation required the ability to speak and read English.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      ConsentSpecifiedNotElsewhereCategorised, as recorded in the FAIRhub DataCite metadata;
      consent is not restricted to non-commercial use, is not geographically restricted, is
      not limited to a research type or to genetic studies, and does not exclude methods
      development.
    consent_scope: >-
      The public version of the dataset can only be used for type 2 diabetes related
      research; a private (controlled access) version will allow for more generic use.
    consent_documentation: >-
      An IRB-approved written consent form, offered as an electronic consent in REDCap with
      electronic signature or as an in-person paper consent at the start of the visit. The
      University of Washington form is published with the v3.0.0 documentation; the other
      sites used the same form with minor institution-specific language.
    withdrawal_mechanism: >-
      Participants could withdraw consent at any time and cease participation; data already
      shared or used up to that point remain in the dataset, as stated in the consent
      document.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - >-
    Eligibility was limited to adults aged 40 and older, so no minors were enrolled;
    pregnancy and gestational diabetes were exclusion criteria and the screening
    questionnaire established eligibility on these grounds. The IRB application records that
    no fetuses in utero, neonates, pregnant women or prisoners were purposefully included and
    that prisoners were not a target population. Devices sent home with participants were
    chosen with participant privacy as a primary concern: the environmental sensor and the
    Garmin fitness tracker do not capture video or audio, are not equipped with GPS location
    monitoring, and are not synced with participant-owned devices.

participant_compensation:
  - compensation_provided: true
    compensation_amount: "200 USD"
    compensation_type: >-
      Cash stipend for the study visit, funded through the NIH grant, plus reimbursement of
      reasonable parking, public transit or rideshare costs related to the study visit and,
      where participants reported barriers to travel, provision of rideshare transportation
      assistance.
    compensation_rationale: >-
      Compensation for completion of the study visit and the at-home monitoring period. The
      IRB application records that the stipend is provided once the final data are received
      and the study devices returned, typically at least two weeks after the study visit, and
      that it is not prorated. The same type and amount of compensation applies to
      participants invited back for the year 4 follow-up visit.
    source_caveats: >-
      The IRB application notes that the amount may change in later years depending on study
      funding and that the IRB would be notified of any change; the healthsheet for this
      release states a compensation of 200 USD for the study visit.

participant_privacy:
  - anonymization_method: >-
      No direct identifiers were collected into the released data. The public set is stripped
      of Protected Health Information as defined by the HIPAA Privacy Rule via the Safe
      Harbor method, and information related to the sex and race/ethnicity of participants,
      and to medications used, was also removed to prevent stigmatization of findings.
      Participant directories and the participants.tsv file are keyed by a study-assigned
      participant ID number.
    privacy_techniques: >-
      A robust data dissemination system requiring verified identity login, a strict license
      agreement, and static data watermarking identifying the licensee, applied to both the
      public and controlled sets. Licensees are contractually barred from attempting
      re-identification, from contacting data subjects, and from establishing a data
      subject's membership in a particular group, and must minimize the likelihood that data
      can be memorized, derived, reconstructed or reconstituted from models they build.
    reidentification_risk: >-
      A theoretical risk of future re-identification remains. AI algorithms can infer
      individual patient characteristics and could facilitate individual-level
      identification.
    data_linkage: >-
      Data from all modalities for a given individual are linked through the participant ID
      that names the participant's directory within each data type and modality folder and
      keys the participants.tsv file. More sensitive variables, including 5-digit ZIP code,
      sex, race, ethnicity, genetic sequencing data, past health records, medications, and
      traffic and accident reports, are held under controlled access and can be linked to the
      public data by the same participant ID under a data use agreement.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    No active de-identification was necessary because no identifiers were collected; the
    project verified that no data identifiable per US HIPAA were present. The FAIRhub
    DataCite record uses the de-identification type "NoDeIdentification", sets the
    deIdentDirect and deIdentHIPAA flags to true, and sets the deIdentDates, deIdentNonarr
    and deIdentKAnon flags to false.
  identifiers_removed: >-
    Protected Health Information as defined by the HIPAA Privacy Rule; additionally sex,
    race/ethnicity, and medications used were removed from the public release. 5-digit ZIP
    code, genetic sequencing data, past health records, and traffic and accident reports are
    withheld from the public release and held under controlled access.
  deidentification_details: >-
    The dataset was reviewed internally by AI-READI team members for quality checks and to
    ensure that no personally identifiable information was accidentally included. Raw data
    are not shared in part because free text fields in the raw records may accidentally
    contain personal health information or personally identifiable information.
  source_caveats: >-
    The FAIRhub DataCite metadata records the de-identification type as "NoDeIdentification"
    on the grounds that no identifiers were collected, whereas the Nature Metabolism comment
    states that the public set is stripped of Protected Health Information via the HIPAA Safe
    Harbor method and that sex and race/ethnicity information is also removed. The FAIRhub
    statement is preferred as the higher-ranked source; the two are reconcilable if
    "NoDeIdentification" is read as "no de-identification transformation was required". The
    same FAIRhub record sets the deIdentDirect flag to true, which on a plain reading asserts
    that direct identifiers were present and treated; no source reconciles that flag with the
    accompanying statement that no identifiers were collected, and the flag is reported here
    as stated rather than interpreted. Question 13 of the composition section and question 1
    of the preprocessing section of the healthsheet, both of which ask about de-identification
    measures, are left blank.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The healthsheet states that the public dataset does not contain data that is considered
      sensitive. Data revealing racial or ethnic origins, location (5-digit ZIP code), genetic
      sequencing data, past health records, medications, and motor vehicle accident reports
      are held in the controlled access dataset rather than in this public release.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The RO-Crate metadata for this release categorizes the following as personal sensitive
      information present in the dataset: EHR, wearable monitoring, ECG, environmental
      sensor, continuous glucose monitor, and wearable accelerometer data.
    source_caveats: >-
      This entry and the preceding one reflect a disagreement between two sources of equal
      rank: the healthsheet embedded in the FAIRhub API record states that the public dataset
      contains no sensitive data, while the RO-Crate metadata lists six categories under
      rai:personalSensitiveInformation. Both are reported rather than reconciled.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The dataset does not contain data that might be considered confidential, such as data
      protected by legal privilege or doctor-patient confidentiality or the content of
      non-public communications. No personally identifiable information is included in the
      dataset. The RO-Crate records the confidentiality level as HL7:2N (normal).

content_warnings:
  - content_warnings_present: false
    warnings:
    - >-
      The healthsheet records that the dataset contains no data that, if viewed directly,
      might be offensive, insulting, threatening, or otherwise pose a safety risk such as
      psychological safety or anxiety.

instances:
  - instance_type: >-
      An individual human study participant. Each instance consists of all data available for
      one participant across the collected modalities, organized as one directory per
      participant beneath each data type, modality and device folder. This is the unit the
      healthsheet identifies as the dataset's instance.
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with any instance and no labeling was
      performed; the dataset is hypothesis agnostic and is intended to facilitate multiple
      potential downstream AI/ML applications. The project has no formal guidelines
      recommending how future researchers should create new labels or define new tasks.
    notes: >-
      There is currently only one visit per participant. Version 1.0.0 contained 204
      participants, version 2.0.0 contained 1,067, and this version contains 2,280. The
      entries that follow describe the constituent record types within a participant's data,
      each of which carries a single data substrate; file counts for each are recorded on the
      corresponding file collection rather than here.
  - instance_type: >-
      A clinical record for one participant within the clinical_data directory, held as a row
      in one of the Observational Medical Outcomes Partnership Common Data Model tables and
      covering laboratory values, physical measurements and vitals, cognitive screening,
      monofilament testing and vision testing.
    data_substrate: B2AI_SUBSTRATE:6
    data_topic: B2AI_TOPIC:4
  - instance_type: >-
      A participant response to one of the study questionnaires, also held within the
      clinical_data directory: the screening, demographic, CES-D-10, PAID-5, diabetes
      self-care, dietary, ophthalmic, substance use, general health and social determinants of
      health instruments.
    data_substrate: B2AI_SUBSTRATE:80
    data_topic: B2AI_TOPIC:31
  - instance_type: >-
      A single 12-lead electrocardiogram recording for one participant, held in the
      cardiac_ecg directory in WaveForm DataBase format.
    data_substrate: B2AI_SUBSTRATE:49
    data_topic: B2AI_TOPIC:10
  - instance_type: >-
      A retinal photograph of one eye of one participant, held in the retinal_photography
      directory as a color fundus photograph, a fundus autofluorescence image or a
      near-infrared reflectance image.
    data_substrate: B2AI_SUBSTRATE:65
    data_topic: B2AI_TOPIC:24
  - instance_type: >-
      A structural optical coherence tomography acquisition of one eye of one participant,
      held in the retinal_oct directory.
    data_substrate: B2AI_SUBSTRATE:67
    data_topic: B2AI_TOPIC:24
  - instance_type: >-
      An optical coherence tomography angiography acquisition of one eye of one participant,
      held in the retinal_octa directory as en face, flow cube or segmentation data.
    data_substrate: B2AI_SUBSTRATE:68
    data_topic: B2AI_TOPIC:24
  - instance_type: >-
      A fluorescence lifetime imaging ophthalmoscopy acquisition of one eye of one
      participant, held in the retinal_flio directory with separate short-wavelength and
      long-wavelength channel files.
    data_substrate: B2AI_SUBSTRATE:66
    data_topic: B2AI_TOPIC:24
  - instance_type: >-
      A continuous glucose monitoring series for one participant, recorded every five minutes
      over the ten-day at-home period and held in the wearable_blood_glucose directory in
      Open mHealth format.
    data_substrate: B2AI_SUBSTRATE:78
    data_topic: B2AI_TOPIC:38
  - instance_type: >-
      A wearable activity monitoring series for one participant over the ten-day at-home
      period, held in the wearable_activity_monitor directory in Open mHealth format.
    data_substrate: B2AI_SUBSTRATE:73
    data_topic: B2AI_TOPIC:39
    notes: >-
      The same directory also carries heart rate, oxygen saturation, respiratory rate, sleep,
      stress and calorie expenditure series for each participant, each as its own modality
      subdirectory.
  - instance_type: >-
      An indoor environmental sensor series for one participant's home over the ten-day
      at-home period, held in the environment directory and covering temperature, relative
      humidity, nitrogen oxides, volatile organic compounds, particulate matter and
      multi-spectral light intensity.
    data_substrate: B2AI_SUBSTRATE:69
    data_topic: B2AI_TOPIC:11

relationships:
  - relationship_details: >-
      All instances are part of the same prospective data generation project, AI-READI, and
      there is currently only one visit per participant. Data belonging to one participant are
      linked across data types, modalities and devices by the participant ID that names the
      participant's directory and keys the participants.tsv file. No relationships between
      individual participants, such as family or household links, are recorded.

subpopulations:
  - subpopulation_elements_present: false
    identification: >-
      Self-reported race and ethnicity, collected in the screening questionnaire in four
      categories (Asian, Black, Hispanic, White), are not released as variables in the public
      dataset and are held under controlled access.
    distribution: >-
      The aggregate distribution across the 2,280 participants reported in the dataset README
      split table is 380 Hispanic, 545 Asian, 519 Black and 836 White. Within the recommended
      splits these are: training 204 Hispanic, 369 Asian, 343 Black, 660 White; validation 88
      of each group; test 88 of each group.
  - subpopulation_elements_present: false
    identification: >-
      Biological sex, collected in the screening questionnaire as male or female, is not
      released as a variable in the public dataset and is held under controlled access.
      Gender identification is collected separately in the demographic questionnaire.
    distribution: >-
      The aggregate distribution reported in the dataset README split table is 951 male and
      1,329 female; training 599 male and 977 female, validation 176 and 176, test 176 and
      176.
  - subpopulation_elements_present: true
    identification: >-
      Diabetes status group, one of four categories: no diabetes; pre-diabetes or type 2
      diabetes controlled by lifestyle adjustments; type 2 diabetes controlled by oral or
      injectable medications other than insulin; type 2 diabetes controlled by insulin.
    distribution: >-
      The aggregate distribution reported in the dataset README split table is 776 no
      diabetes, 560 lifestyle, 686 oral and 258 insulin; training 600, 384, 487 and 105;
      validation 88, 88, 109 and 67; test 88, 88, 90 and 86. The intended study-wide target is
      approximately 1,000 participants in each of the four groups.
  - subpopulation_elements_present: true
    identification: >-
      Age, restricted at recruitment to adults aged 40 years and older, with an upper limit of
      85 years recorded in the FAIRhub eligibility criteria and the IRB exclusion criteria.
    distribution: >-
      Mean age across the 2,280 participants is 60.8 years with a standard deviation of 11.3;
      training 61.1 +/- 11.3, validation 60.3 +/- 10.8, test 60.5 +/- 11.4.
    source_caveats: >-
      The BMJ Open protocol describes the target enrollment as people aged 40 and older
      without stating an upper age limit, while the FAIRhub study description records a
      maximum age of 85 years and the IRB application lists adults older than 85 as an
      exclusion criterion.

splits:
  - split_details: >-
      The release includes a recommended split into training, validation and test sets in
      70/15/15 proportions (1,576 / 352 / 352 participants), distributed in the
      participants.tsv file. Because sex, race and ethnicity are not released with the public
      version, the project team constructed the splits so that the validation and test sets
      are balanced as far as possible for sex, race/ethnicity and diabetes status (no
      diabetes, pre-diabetes or lifestyle controlled, oral medication controlled, and insulin
      controlled), with the stated aim of reducing disparities in models developed using the
      dataset. Mean ages are comparable across the three partitions (61.1, 60.3 and 60.5
      years). This recommended split is new in version 3.0.0.

subsets:
  - id: https://fairhub.io/datasets/3#train
    name: Recommended training split
    description: >-
      1,576 participants (70 percent) assigned to the training partition in participants.tsv.
      Composition: 204 Hispanic, 369 Asian, 343 Black, 660 White; 599 male, 977 female; 600
      no diabetes, 384 lifestyle controlled, 487 oral medication controlled, 105 insulin
      controlled; mean age 61.1 years, standard deviation 11.3.
    is_data_split: true
    is_subpopulation: false
  - id: https://fairhub.io/datasets/3#validation
    name: Recommended validation split
    description: >-
      352 participants (15 percent) assigned to the validation partition in participants.tsv,
      balanced as far as possible across demographic and diabetes status groups. Composition:
      88 in each of the four race/ethnicity groups; 176 male, 176 female; 88 no diabetes, 88
      lifestyle controlled, 109 oral medication controlled, 67 insulin controlled; mean age
      60.3 years, standard deviation 10.8.
    is_data_split: true
    is_subpopulation: false
  - id: https://fairhub.io/datasets/3#test
    name: Recommended test split
    description: >-
      352 participants (15 percent) assigned to the test partition in participants.tsv,
      balanced as far as possible across demographic and diabetes status groups. Composition:
      88 in each of the four race/ethnicity groups; 176 male, 176 female; 88 no diabetes, 88
      lifestyle controlled, 90 oral medication controlled, 86 insulin controlled; mean age
      60.5 years, standard deviation 11.4.
    is_data_split: true
    is_subpopulation: false

