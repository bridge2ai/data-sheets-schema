third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed publicly through the FAIRhub platform to any requester who
      logs in through a verified ID system, agrees to use the data only for type 2 diabetes
      related research, and accepts the license terms. Onward conveyance by a licensee is
      restricted: no portion of the data or any derivative work may be transferred, licensed,
      sublicensed, sold, assigned, displayed or shared with any third party other than another
      licensee bound by an identical agreement, and then only for collaboration on projects
      involving the data. The full dataset, including the controlled elements, is accessible
      only by entering into a data use agreement.

license_and_use_terms:
  license_terms: >-
    The AI-READI Data License Agreement version 2.0, issued by Washington University in St.
    Louis as licensor and archived at https://doi.org/10.5281/zenodo.17555036, grants a
    non-exclusive, non-transferable license to download, reproduce and use the data and to
    create derivative works for research, commercial and non-commercial purposes. The licensee
    may be an individual or, where declared in the data request workflow, an authorized group
    within an institution, in which case authorized users are legal members of that group and
    their rights terminate automatically when their relationship with the group or institution
    ends. Data must be stored only on servers and devices maintained by and located within the
    licensee's institution, or on cloud or remote storage covered by a HIPAA-approved business
    associate agreement. Derivative data, including synthetic data generated from the data, is
    itself treated as data subject to all restrictions. Models trained on the data may be
    distributed provided they do not themselves contain the data or a modified version of it
    and provided the licensee has undertaken all reasonable efforts to minimize the likelihood
    that data can be memorized, derived, reconstructed or reconstituted through their use.
    Reproduction of data in publications is limited to small representative samples in up to
    five images or figures per paper. Licensees must acknowledge the licensor, the source and
    any funder in any paper reporting use of the data, must comply with NIH Genomic Data
    Sharing Policy security best practices, and must not remove or obscure the watermarking.
    The data is provided on an "as is" basis without warranty; the licensor's aggregate
    liability is capped at one US dollar, and the licensee indemnifies the licensor. The
    agreement terminates automatically on any breach, whereupon the licensee must delete all
    copies. The license was specifically tailored to enable reuse of the AI-READI dataset and
    other clinical datasets while placing strong requirements around data usage, security and
    secondary sharing to protect study participants, especially where data are reused for AI
    and ML applications.
  data_use_permission: disease_specific_research
  notes: >-
    The FAIRhub dataset page labels the license "Health Data License" and the DataCite record
    names it "AI-READI custom license v2.0". An earlier version of the license terms is
    archived at https://doi.org/10.5281/zenodo.10642459 and is cited in the Nature Metabolism
    comment. No source names an individual as the licensing contact; the license names
    Washington University in St. Louis as licensor and directs users to docs.aireadi.org, and
    the study central contact given in the FAIRhub study description is contact@aireadi.org.
  source_caveats: >-
    The single enumerated permission value cannot represent both of the constraints the
    sources state. Access to the public release is conditional on the requester attesting that
    the data will be used only for type 2 diabetes related research, which is a
    disease-specific restriction and is the value recorded; the same license, however, grants
    use "for research, commercial and non-commercial purposes", and the DataCite consent
    record sets consentNoncommercial, consentGeogRestrict, consentResearchType,
    consentGeneticOnly and consentNoMethods all to false. Both readings are attested and are
    not reconciled by any source.

ip_restrictions:
  restrictions:
  - >-
    Title to the data and all industrial and intellectual property rights in it remain solely
    and exclusively with the licensor, Washington University in St. Louis, and its suppliers;
    the licensee must take no action inconsistent with that ownership, and any rights not
    expressly granted in the license are reserved to the licensor and its suppliers. The
    healthsheet answers the question of third-party IP-based restrictions by referring to the
    same license. Licensees may refer publishers and conference organizers to the licensor if
    they wish to obtain a separate license to reproduce larger amounts of data.

regulatory_restrictions:
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    Licensees must comply with all data security and privacy standards established by the US
    National Institutes of Health under its Genomic Data Sharing Policy as amended from time
    to time, currently the NIH Security Best Practices for Controlled-Access Data Subject to
    the NIH GDS Policy, and must comply with all applicable laws, regulations and restrictions
    relating to the distribution and use of the data and of models built from it. The
    healthsheet answers the question about export controls and other regulatory restrictions
    by referring to the license.
  other_compliance: >-
    The public release is de-identified with respect to the HIPAA Privacy Rule, with the
    project recording that no identifiable data per US HIPAA are present. The study is
    registered as NCT06002048 and is recorded in the FAIRhub study description as not FDA
    regulated for either drug or device, with no data monitoring committee. The RO-Crate
    records fdaRegulated as false and deidentified as true.
  notes: >-
    The only confidentiality classification stated in the input sources is the RO-Crate
    metadata value "HL7:2N (normal)". No enumerated confidentiality level is recorded here
    because that value does not map onto the available terms without interpretation: access is
    conditional on verified identity, an attestation of research purpose and acceptance of the
    license, which is not unrestricted, while the source classification itself reads as normal
    rather than restricted. The sources name no individual as a governance committee contact,
    so that field is left unpopulated.

data_governance:
  committee_name: Data Access Committee
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: >-
    Accessing the dataset requires logging in through a verified ID system, agreeing to use
    the data only for type 2 diabetes related research, and agreeing to the license terms,
    which set restrictions and obligations for data usage. The DataCite access type is
    recorded as PublicDownloadSelfAttestationRequired. The full dataset, which adds the more
    sensitive elements withheld from the public set, is accessible only by entering into a
    data use agreement, available for use by scientists whose institutions have completed
    legal and privacy use agreements with the AI-READI research program. Version 3.0.0
    documentation additionally describes Azure Storage access and a mini-subset for pipeline
    development.
  stewardship_roles:
  - >-
    The AI-READI team supports and maintains the dataset, which is hosted on FAIRhub through
    Microsoft Azure. The data manager at each of the three collection sites is responsible for
    quality control of all data before upload to FAIRhub. Washington University in St. Louis
    is the lead sponsor of the study and the managing organization of the dataset record, and
    is the licensor of the data. The RO-Crate names the AI-READI Consortium as the data
    governance committee.
  source_caveats: >-
    The BMJ Open protocol refers to "the Data Access Committee" as developing the requirements
    for the controlled access dataset at the time of writing, and that is the only name the
    sources give the body; the RO-Crate instead names the AI-READI Consortium as the data
    governance committee. The input sources do not name the committee's members, give its
    contact details, state an access decision timeframe, or describe an appeal process, so
    those fields are left unpopulated.

maintainers:
  - maintainer_details: >-
      The AI-READI team supports and maintains the dataset. The dataset owner, curator and
      manager can be contacted using the details in the README file included with the dataset
      and via https://aireadi.org/contact; the central contact recorded in the study
      description is contact@aireadi.org.
    role: academic_institution
  - maintainer_details: >-
      FAIRhub, the cloud-based data management, curation and sharing platform developed for
      this project and operated on Microsoft Azure, hosts the dataset and its versions.
    role: other

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset is released as static versions and is not updated in place; instead, new
    versions are released with additional instances as more study participants complete the
    study visit. There are plans to release new versions approximately once a year with
    additional data from participants enrolled since the last release. Version 1.0.0
    contained 204 participants from the pilot phase, version 2.0.0 added the first full year
    of data to reach 1,067, and version 3.0.0 adds the year 3 data to reach 2,280. Changes
    between versions are documented in the CHANGELOG file included in the dataset and visible
    at docs.aireadi.org. Because the dataset is not updated, older versions are not
    maintained as living resources; documentation for each version remains available.

version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - "1.0.0"
  - "2.0.0"
  - "3.0.0"
  version_details: >-
    Three versions have been issued: 1.0.0 (DOI 10.60775/fairhub.1, released 3 May 2024, 204
    participants), 2.0.0 (DOI 10.60775/fairhub.2, released 8 November 2024, 1,067
    participants, 165,051 files, 2.01 TB) and 3.0.0 (DOI 10.60775/fairhub.3, released 17
    November 2025, 2,280 participants, 356,343 files, 3.82 TB). Versions 1.0.0 and 2.0.0 are
    recorded on FAIRhub as no longer accessible, with users directed to the latest version.
    One version of the documentation is maintained for each version of the dataset at
    docs.aireadi.org, navigable from a version dropdown, and healthsheets for versions 1 and 2
    remain published at docs.aireadi.org/docs/1/dataset/healthsheet and
    docs.aireadi.org/docs/2/dataset/healthsheet.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances;
    participants were not told that their data would be retained only for a fixed period and
    then deleted. Raw data are expected to be preserved by the AI-READI project at least for
    the duration of the project. Under the license, a licensee whose agreement terminates must
    delete all copies of the data in its possession and control and cease all use.

