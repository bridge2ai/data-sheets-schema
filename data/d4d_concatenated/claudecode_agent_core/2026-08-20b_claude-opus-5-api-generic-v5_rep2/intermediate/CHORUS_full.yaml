purposes:
  - response: >-
      To develop a publicly available, AI-ready critical care dataset supporting machine learning applications
      that characterize acute and critical care illness, predict complications, and measure treatment response
      among patients with acute or critical illness.
  - response: >-
      To provision a holdout test set accessible for external validation of models, in order to aid marketplace
      adoption of AI-developed models for implementation in acute and critical care.
  - response: >-
      To create ethically sourced datasets and tools around artificial intelligence and to establish best
      practices for AI in health, as one of four data generation projects within the NIH-funded Bridge2AI
      consortium.
  - response: >-
      To develop the network, tools, standards, data, and education needed to build machine learning and
      artificial intelligence models that improve the care and outcomes of patients requiring critical care,
      while ensuring that methods promote privacy, accountability, and clinical benefit.

addressing_gaps:
  - response: >-
      There is an urgent need for infrastructure to support artificial intelligence and machine learning in
      critical care; developing high-resolution multi-center data sets is a critical first step toward
      actionable and trustworthy AI.
  - response: >-
      Existing resources do not offer a comparably diverse, high-resolution, ethically sourced, AI-ready data
      set; CHoRUS aims to assemble one to answer the grand challenge of improving recovery from acute illness.
  - response: >-
      Multi-modal EHR, waveform, imaging, and text data lack unified standards; CHoRUS develops unified
      standards and validated semantic mappings to harmonize them across contributing hospitals.

tasks:
  - response: Characterizing acute and critical care illness.
  - response: Predicting complications and clinical deterioration among patients with acute or critical illness.
  - response: Measuring treatment response among patients with acute or critical illness.
  - response: >-
      External validation of AI-developed models against a sequestered holdout test set prior to implementation
      in acute and critical care.
  - response: >-
      Labeling data with targets important for prediction, using a visualization and annotation environment
      developed by the project.

