file_collections:
  - id: https://chorus4ai.org/#structured-ehr-omop
    name: Structured electronic health record data in OMOP Common Data Model format
    description: >-
      Demographics, medication administration (dosing time-stamped upon each infusion change or dose
      administration), procedures documented by providers, high-frequency nursing flowsheet documentation, and
      provider-documented diagnoses. The currently released dataset contains 1.6 billion rows of EHR OMOP data.
      Access is controlled and metadata are published; nursing flowsheets use the OMOP schema with extensions.
    collection_type: processed_data
    conforms_to: OMOP Common Data Model
    conforms_to_standard:
      - OMOP_CDM
  - id: https://chorus4ai.org/#clinical-notes
    name: Tokenized clinical notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit. Notes are stored locally at contributing
      sites; only tokens are held in the shared enclave. Access is controlled and a metadata schema was planned
      as of August 2025.
    collection_type: processed_data
    conforms_to: OHNLP open source schema
    conforms_to_standard:
      - OTHER
  - id: https://chorus4ai.org/#imaging
    name: Imaging data
    description: >-
      Imaging extracted from hospital picture archiving and communication systems (PACS). The project
      documentation reports 7,642 admissions with radiology data in the current released dataset; the cohort 2
      webinar states that approximately 1,000 images were available as of August 2025 with de-identification in
      process for a larger cohort. Access is controlled and a metadata schema was planned as of August 2025.
    conforms_to: DICOM schema
    conforms_to_standard:
      - DICOM
  - id: https://chorus4ai.org/#waveform-telemetry
    name: Waveform telemetry
    description: >-
      Physiological waveform telemetry captured from bedside monitors via gateway and middleware systems and
      held in the cloud enclave. The current released dataset includes 23 Tb of waveform data. Access is
      controlled and metadata follow an extended PhysioNet schema.
    conforms_to: WFDB, with metadata following an extended PhysioNet schema
    conforms_to_standard:
      - WFDB
  - id: https://chorus4ai.org/#waveform-eeg
    name: EEG waveforms
    description: >-
      Electroencephalography waveforms drawn from hospital EEG databases. Extraction was still in process as of
      August 2025. Access is controlled and metadata follow the open source EDF+ and Persyst schemas.
    conforms_to: EDF+ and Persyst
    conforms_to_standard:
      - OTHER

acquisition_methods:
  - acquisition_details: >-
      Retrospective extraction of existing clinical records from hospital systems at 14 data acquisition
      centers, following standard operating procedures maintained in the Chorus_SOP repository and using the
      chorus-extract-upload tooling to create and upload a CHoRUS data extract.
  - acquisition_details: >-
      Derived data products created from source records, including tokenization of unstructured electronic
      health record text with the OHNLP toolkit, transformation of data using approaches that limit
      re-identification, and geocoding of OMOP Location entities to supply contextual factors such as
      geographic distance to the nearest hospital.
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      Hospital electronic health record systems, from which demographics, medication administration,
      procedures, nursing flowsheets, and diagnoses are extracted and standardized to the OMOP Common Data
      Model.
  - mechanism_details: >-
      The OHNLP toolkit, used to extract and tokenize unstructured clinical notes.
  - mechanism_details: >-
      Hospital picture archiving and communication systems (PACS), from which DICOM imaging is drawn.
  - mechanism_details: >-
      Bedside physiological monitors together with gateway and middleware systems, from which waveform
      telemetry is captured.
  - mechanism_details: >-
      Hospital EEG databases, from which EEG waveforms are extracted in EDF+ and Persyst formats.

data_collectors:
  - collector_details: >-
      Fourteen data acquisition centers within the 20-center CHoRUS Network extract and contribute clinical
      data extracts from their hospitals.
    role: data contributing site
  - collector_details: >-
      Data site managers at contributing sites follow the step-by-step CHoRUS workflow for extracting and
      contributing clinical data and provide regular status updates on their progress.
    role: data site manager
  - collector_details: >-
      Standards, Data Acquisition, and Tooling sub-teams within the CHoRUS data generation project support
      extraction, mapping, and submission and maintain the associated documentation and recordings.
    role: project sub-team

direct_collection:
  - is_direct: false
    collection_details: >-
      Data are obtained retrospectively from hospital clinical information systems, imaging archives, bedside
      monitoring infrastructure, and EEG databases at contributing centers rather than collected directly from
      patients.

collection_timeframes:
  - timeframe_details: >-
      Data collection is retrospective. Acquisition and curation were ongoing as of August 2025, when the
      assembled dataset covered 14 contributing hospitals, and continue toward the anticipated final dataset.

sampling_strategies:
  - is_sample: true
    strategies:
      - >-
        Sampling designed to ensure comprehensive sets of patient conditions and clinical treatment strategies
        across the multi-center network.
      - >-
        Federated access enabling sampling methods that ensure a balanced and diverse cohort.

raw_data_sources:
  - source_description: >-
      Electronic health record systems at the 14 CHoRUS data acquisition hospitals, holding demographics,
      medication administration records, procedures, nursing flowsheets, diagnoses, and clinical notes.
    source_type: hospital electronic health record system
    access_details: >-
      Source records remain within the contributing hospitals; only curated extracts are contributed to CHoRUS.
  - source_description: >-
      Hospital picture archiving and communication systems (PACS) holding clinical imaging studies.
    source_type: hospital imaging archive
    raw_data_format: DICOM
  - source_description: >-
      Bedside physiological monitors and their gateway/middleware systems, producing continuous waveform
      telemetry.
    source_type: bedside monitoring infrastructure
  - source_description: >-
      Hospital EEG databases holding clinical electroencephalography recordings.
    source_type: hospital EEG database
    raw_data_format: EDF+ and Persyst

preprocessing_strategies:
  - preprocessing_details: >-
      Structured electronic health record data are standardized to the OMOP Common Data Model, with schema
      extensions used for high-frequency nursing flowsheet documentation.
  - preprocessing_details: >-
      Unstructured clinical notes are extracted and tokenized using the OHNLP toolkit; notes remain stored
      locally at contributing sites while tokens are made available in the enclave.
  - preprocessing_details: >-
      Data are transformed using approaches that limit re-identification, including de-identification of
      imaging, which was in process as of August 2025.
  - preprocessing_details: >-
      OMOP Location entities are geocoded using open source tooling (DeGauss) so that data elements carry
      appropriate contextual factors such as geographic distance to the nearest hospital and social
      determinants of health.
  - preprocessing_details: >-
      Waveform data are converted to WFDB using CHoRUS waveform conversion scripts, with metadata following an
      extended PhysioNet schema.

cleaning_strategies:
  - cleaning_details: >-
      Characterization reports are produced from each site data submission and returned to the submitting site
      for review and correction.
  - cleaning_details: >-
      Semantic mappings from source formats to international standards are pooled and undergo internal
      validation and clinical review under a clinical validation standard operating procedure before use.

labeling_strategies:
  - labeling_details: >-
      A visualization and annotation environment is used to label data with targets important for prediction.

is_deidentified:
  method: >-
    Tokenization of unstructured electronic health record text using the OHNLP toolkit; de-identification of
    imaging; transformation of data using approaches that limit re-identification.
  deidentification_details: >-
    Clinical notes are not placed in the shared enclave except as tokens and are otherwise stored locally at
    contributing sites. Imaging de-identification was in process for a larger cohort as of August 2025, at
    which point approximately 1,000 images were available. The project maintains dedicated tooling for privacy
    scanning of medical records and for de-identification.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset comprises patient-level clinical data from intensive care admissions, including demographics,
      diagnoses, medications, procedures, nursing flowsheet documentation, clinical notes, imaging, EEG and
      physiological waveforms, together with social determinants of health and geographic contextual factors
      such as distance to the nearest hospital.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      All nine data types are held under controlled access. Clinical notes are excluded from the shared enclave
      and remain stored locally at contributing sites, with only tokens shared.

human_subject_research:
  involves_human_subjects: true
  special_populations:
  - >-
    Released admissions include pediatric intensive care unit (PICU) and neonatal intensive care unit (NICU)
    admissions alongside adult ICU admissions.
  notes: >-
    The dataset consists of retrospective patient-level clinical records drawn from hospital admissions of
    critically ill patients.

ethical_reviews:
  - review_details: >-
      Ethics is one of the three pillars of the CHoRUS data generation project (Ethical and Trustworthy AI).
      The consortium conducts community-facing ethics focus groups to determine what data is appropriate for
      public sharing, evaluates community perspectives on clinical care AI to increase trustworthiness of
      provenance and privacy, establishes a legal framework for collecting data at scale, and analyzes the
      existing legal and regulatory landscape.
    reviewing_organization: CHoRUS consortium ethics pillar
    source_caveats: >-
      The bundle describes the project's ethics program but does not state institutional review board approval
      details for the dataset.

data_governance:
  accountable_organization:
    name: Massachusetts General Hospital
  access_review_process: >-
    Prospective users complete a registration form giving name, email, and institution, and must sign a
    licensing agreement included in the registration form before gaining access. An institutional (.edu) email
    address is required to gain access to the dataset. Once access is granted and compute is provisioned, the
    requester is notified by email. Access requests may also be directed to the CHoRUS team by email.
  committee_contact:
    id: mailto:cmccrary@mgh.havard.edu
    name: Ciera McCrary
  stewardship_roles:
  - >-
    Program management is based at Massachusetts General Hospital; Standards, Data Acquisition, and Tooling
    sub-teams within the CHoRUS data generation project steward the respective data streams; data site managers
    at each of the 14 contributing hospitals are responsible for curating and delivering interoperable site
    extracts.
  source_caveats: >-
    The program manager email is transcribed as published on the project website, which reads
    "cmccrary@mgh.havard.edu".

license_and_use_terms:
  license_terms: >-
    Access is controlled. All users must sign a licensing agreement before gaining access to the dataset, and
    an institutional (.edu) email address is required. The CHoRUS software repositories on GitHub are licensed
    under the MIT License, with some individual repositories under Apache-2.0; the bundle does not state that
    these software licenses apply to the data.
  contact_person:
    id: mailto:jared.houghtaling@tuftsmedicine.org
    name: Jared Houghtaling

regulatory_restrictions:
  confidentiality_level: restricted

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is made available beyond the contributing institutions to approved external users under
      controlled access, including trainees in the AIM-AHEAD Bridge2AI for Clinical Care Training Program, who
      work with the data on the Bridge2AI AI/ML for Clinical Care Collaborative Cloud.

intended_uses:
  - use_category: Clinical AI/ML model development
    examples:
      - Characterizing acute and critical care illness from multimodal intensive care data.
      - Predicting complications and clinical deterioration.
      - Measuring treatment response among patients with acute or critical illness.
  - use_category: External model validation
    examples:
      - >-
        Validating externally developed AI models against the sequestered holdout test set to aid marketplace
        adoption of models for implementation in acute and critical care.
  - use_category: Education and workforce development
    examples:
      - >-
        Hands-on AI/ML training for trainees, clinicians, engineers, and data scientists within the Bridge2AI
        CHoRUS ecosystem, including canonical Jupyter notebooks and OHDSI/OMOP tool stack workshops.
      - Development and presentation of trainee use cases, posters, abstracts, and manuscripts.

existing_uses:
  - examples:
      - Datasets are being used for training activities and publications.
  - examples:
      - >-
        The AIM-AHEAD Bridge2AI for Clinical Care Training Program, cohort 2 (November 2025 to July 2026),
        gives up to 30 selected trainees access to CHoRUS data for collaborative research and use case
        development on the Bridge2AI Clinical Care Cloud platform.

future_use_impacts:
  - impact_details: >-
      The project's stated aim is that the methods used to assemble and share the dataset promote privacy,
      accountability, and clinical benefit. Patient-focused legal and ethical work determines approaches to
      managing privacy and bias while accounting for social determinants of health, and community-facing ethics
      focus groups determine what data is appropriate for public sharing.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Not all modalities were fully available at the time of the source documents: as of August 2025 imaging
      was limited to approximately 1,000 available images with de-identification in process for a larger
      cohort, and EEG extraction was still in process.
  - limitation_type: integration_limitation
    limitation_description: >-
      Clinical notes are stored locally at contributing sites rather than in the shared cloud enclave; only
      tokenized representations of the notes are available to enclave users.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The released dataset represents an interim state of accrual: 50,000 patient admissions against an
      anticipated final dataset of 100,000 patient admissions, and published metadata for imaging, tokenized
      clinical notes, and EEG were planned rather than available as of August 2025.

maintainers:
  - maintainer_details: >-
      Massachusetts General Hospital hosts the CHoRUS program management office, with Ciera McCrary serving as
      Program Manager and as the contact point listed on the project website.
    role: academic_institution
  - maintainer_details: >-
      The chorus-ai GitHub organization maintains 28 repositories containing software and tooling, validated
      semantic mappings, standard operating procedures, and project management overviews; package versions,
      maintainers, and other package metadata are published on the CHoRUS package status page.
    role: academic_institution

updates:
  frequency: ongoing, with regular status updates from data contributing sites
  update_details: >-
    Data contributing sites provide regular status updates on their progress in creating and curating a
    CHoRUS-specific clinical data extract, submitted either through the GitHub interface or through a Google
    Form whose submissions trigger automated updates to status and issue information; these statuses are
    tracked in the Standards and Data Acquisition projects. Accrual continues toward an anticipated final
    dataset of 100,000 patient admissions across nine modalities from 14 contributing hospitals, with imaging
    de-identification and EEG extraction in progress.

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Data managers at contributing sites follow an interactive workflow diagram and the validated standard
    operating procedures in the Chorus_SOP repository to extract and contribute clinical data, and can raise
    problems in the context-specific Standards and Data Acquisition discussion spaces. Clinical collaborators
    can contribute to semantic mapping efforts through the chorus-mapping repository, which holds documentation,
    pooled tabular mappings, and an associated clinical validation standard operating procedure. Software
    contributors use the guide compiled in the chorus-developer repository.