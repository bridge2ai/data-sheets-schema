id: https://chorus4ai.org/#chorus-dataset
name: CHoRUS Dataset
title: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI
description: >-
  The CHoRUS dataset is a multicenter, multimodal, high-resolution critical care dataset assembled by the
  Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI project, one of
  four data generation projects in the NIH Common Fund's Bridge2AI consortium. Data are collected
  retrospectively from hospital clinical systems and made available under controlled access. The CHoRUS Network
  spans 20 academic centers, of which 14 contribute as data acquisition centers. Nine data modalities are
  represented: demographics, medication administration (time-stamped at each infusion change or dose
  administration), procedures documented by providers, high-frequency nursing flowsheets, provider-documented
  diagnoses, clinical notes extracted and tokenized with the OHNLP toolkit, imaging drawn from hospital PACS,
  waveform telemetry from bedside monitors and gateway/middleware, and EEG waveforms from hospital databases.
  Structured electronic health record data are standardized to the OMOP Common Data Model, imaging follows
  DICOM, telemetry follows WFDB with an extended PhysioNet metadata schema, and EEG is delivered as EDF+ and
  Persyst. The currently released dataset comprises 50,000 patient admissions from adult, pediatric, and
  neonatal intensive care units, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data, and
  23 Tb of waveform data; the anticipated final dataset covers 100,000 patient admissions across nine
  modalities from 14 contributing hospitals. The project also sequesters a holdout test set for external
  validation of models. Data are accessed through the Bridge2AI AI/ML for Clinical Care Collaborative Cloud
  enclave after registration and signature of a licensing agreement.
status: partially released; retrospective data acquisition and curation ongoing
created_by: CHoRUS Consortium
is_tabular: false
page: https://chorus4ai.org/
conforms_to: >-
  OMOP Common Data Model for structured electronic health record data (demographics, medication administration,
  procedures, nursing flowsheets, diagnoses, with schema extensions for nursing flowsheets); OHNLP open source
  schema for extracted and tokenized clinical notes; DICOM for imaging; WFDB with an extended PhysioNet
  metadata schema for waveform telemetry; EDF+ and Persyst for EEG waveforms.
conforms_to_standard:
  - OMOP_CDM
  - DICOM
  - WFDB
  - OTHER
conforms_to_schema: https://w3id.org/bridge2ai/data-sheets-schema
conforms_to_class: Dataset
keywords:
  - critical care
  - intensive care unit
  - acute illness
  - electronic health records
  - OMOP Common Data Model
  - physiological waveforms
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - artificial intelligence
  - machine learning
  - Bridge2AI
  - multicenter dataset
  - controlled access
notes: >-
  The CHoRUS project website displays a banner stating that the repository is under review for potential
  modification in compliance with Administration directives.
source_caveats: >-
  The project documentation at chorus4ai.org (tier 2) reports a current released dataset of 50,000 patient
  admissions, while the cohort 2 informational webinar (tier 4) states that, as of August 2025, the dataset
  covered 14 hospitals with over 45,000 unique admissions; the higher-ranked project documentation figure is
  used in this record and both are reported here. The two sources also describe imaging availability
  differently: the project documentation reports 7,642 admissions with radiology data, while the webinar states
  that approximately 1,000 images were available with de-identification in process for a larger cohort. The
  contact email transcribed from the project website reads "cmccrary@mgh.havard.edu" and appears to contain a
  typographical error in the source; it is reproduced as published.

