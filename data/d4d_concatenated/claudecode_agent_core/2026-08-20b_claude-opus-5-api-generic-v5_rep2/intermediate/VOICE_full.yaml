funders:
  - grantor: National Institutes of Health Common Fund
    notes: >-
      Funded through the NIH Common Fund Bridge2AI program under core project OT2OD032720,
      "Bridge2AI: Voice as a Biomarker of Health - Building an ethically sourced, bioacoustic
      database to understand disease like never before". The dataset releases cite NIH project
      number 3OT2OD032720-01S1. NIH RePORTER records application 11376382 under project number
      3OT2OD032720-01S3, with the University of South Florida as the organization, Yael Bensoussan
      as principal investigator, an award amount of 4,660,942 US dollars for fiscal year 2025, a
      project start of 1 September 2022 and a project end of 30 November 2026. The feasibility
      study of the collection application was supported under NIH grant 1OT2OD032720-01. The NIH
      had no role in the preparation, review or approval of the associated manuscripts or in the
      decision to submit them for publication.
    source_caveats: >-
      The project documentation footer and healthsheet render the award number in corrupted forms
      ("3Tf-OTOD03272001S2" and "3TF-OT2ActfOD032720Projectf01S1"); the PhysioNet value
      3OT2OD032720-01S1 is followed here.

notes: >-
  Study metadata registered for the collection: official title "Bridge2AI-Voice"; study type
  observational; design observation model cohort; design time perspective cross-sectional;
  anticipated enrollment of 10,000 by 2027; organization study ID OT2OD032720 under a U.S.
  National Institutes of Health grant or contract award number. Eligibility is open to all sexes,
  is not gender based, admits healthy volunteers, and spans 18 to 120 years for the adult cohort.
  Biospecimens are described as respiratory, voice and speech samples. Listed collaborating
  organizations are the University of South Florida, Weill Cornell Medicine, Oregon Health &
  Science University, Massachusetts Institute of Technology, University of Toronto, Mount Sinai
  Hospital, Hospital for Sick Children, Simon Fraser University, The Hastings Center, Washington
  University in St. Louis, University of Florida and Vanderbilt University Medical Center.
  The consortium's self-assessment against the Bridge2AI AI-readiness recommendations scores the
  dataset at 100 percent for FAIRness, provenance, pre-model explainability and ethics; 80 percent
  for characterization, with the data quality criterion unmet; 75 percent for computability, with
  the contextualized criterion unmet; and 50 percent for sustainability, with the
  domain-appropriate and associated criteria unmet.
  The full acoustic protocol comprises 22 tasks for adults spanning non-voice non-speech
  (respiration, cough, breath sounds, voluntary cough), voice non-speech (prolonged vowel, maximum
  phonation time, glides, loudness, diadochokinesis) and speech (Rainbow Passage, Caterpillar
  Passage, CAPE-V sentences, free speech, picture description, story recall, animal fluency, open
  response questions, Word-Color Stroop, productive vocabulary, random item generation, Cinderella
  story), with a separate age-banded pediatric task set.
  The documentation notes that this repository is under review for potential modification in
  compliance with administration directives.