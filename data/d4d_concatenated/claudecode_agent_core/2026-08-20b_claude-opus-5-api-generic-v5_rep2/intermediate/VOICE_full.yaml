    restrictions:
    - MIT license.
    archival: true
    future_guarantees: Archived on Zenodo at https://zenodo.org/doi/10.5281/zenodo.13834653.
  - external_resources: >-
      FHIR profiles for voice as a biomarker, published by the consortium as supporting material.
  - external_resources: >-
      Protocol description publication: Bensoussan, Y., Ghosh, S., Rameau, A., et al. "Developing
      Multi-Disorder Voice Protocols: A team science approach involving clinical expertise,
      bioethics, standards, and DEI." Proc. Interspeech 2024, 1445-1449.
