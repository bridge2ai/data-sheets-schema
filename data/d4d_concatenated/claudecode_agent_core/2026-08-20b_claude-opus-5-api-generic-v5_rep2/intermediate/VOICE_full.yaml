      https://github.com/eipm/bridge2ai-redcap - the Bridge2AI REDCap data dictionary, metadata
      and instrument PDFs used to define the data acquisition protocols.
    restrictions:
    - MIT license.
    archival: true
    future_guarantees: >-
      Archived on Zenodo with a versioned DOI; the release cited by the dataset documentation is
      Bridge2AI Voice REDCap v3.23.0 at https://zenodo.org/records/14989503, with the concept DOI
      at https://zenodo.org/doi/10.5281/zenodo.12760724.
  - external_resources: >-
      https://github.com/sensein/b2aiprep - the b2aiprep library, used to organize and preprocess
      the dataset, to convert raw audio waveforms into the Parquet feature files, and to merge the
      source data into the phenotype files. Version 3.0.0 generated the 3.1.0 release.
    restrictions:
    - Apache-2.0 license.
  - external_resources: >-
      https://github.com/sensein/senselab - SenseLab, used to process audio files for research
