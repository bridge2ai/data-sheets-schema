source_caveats: >-
  Version 3.1.0 on PhysioNet is the highest-ranked and most recent description of the dataset
  in the declared bundle and is followed throughout; the bundle marks the version 3.0.0 record
  as superseded by it. Several points of disagreement across sources are worth recording.
  (1) Hosting: the project documentation states that the dataset is hosted by the Health Data
  Nexus platform maintained by T-CAIREM at the University of Toronto, with a DOI issued there;
  the current releases (v1.1 onward) are published and hosted on PhysioNet, and only the v1.0
  release carries a Health Data Nexus DOI (10.57764/qb6h-em84). The PhysioNet account is
  followed. (2) Award number: PhysioNet gives NIH project number 3OT2OD032720-01S1; the
  project documentation footer gives "3Tf-OTOD03272001S2" and the healthsheet gives
  "3TF-OT2ActfOD032720Projectf01S1", both of which appear corrupted; NIH RePORTER gives
  application 11376382 under project number 3OT2OD032720-01S3 with core project OT2OD032720.
  The PhysioNet value is followed. (3) Scale: the project documentation states that version
  3.0 contains approximately 61,937 voice-derived recordings from 833 adult participants;
  PhysioNet 3.0.0 and 3.1.0 give per-feature record counts (for example 32,522 torchaudio
  pitch traces and 29,278 spectrograms in 3.1.0) rather than a single recording total, so no
  total recording count is asserted here for 3.1.0. The participant count of 833 is consistent
  between 3.0.0 and 3.1.0 and the documentation. (4) Participant compensation: the feasibility
  publication states that its participants received no financial incentives; the IRB protocol
  and healthsheet describe gift-card compensation for dataset collection. These describe
  different studies and are not in conflict. (5) The healthsheet answers describe version
  2.0.0 in places (for example the statement that the dataset contains only adult populations
  and that the only language option is English), and predate the pediatric release.

purposes:
  - response: >-
      To generate a large-scale, multi-institutional, ethically sourced and demographically
      diverse voice, speech and respiratory-sound dataset linked to multimodal health
      biomarkers, in order to fuel voice AI research.
  - response: >-
      To enable the development, benchmarking and validation of clinically applicable machine
      learning models that use voice as a non-invasive, low-cost biomarker for the screening,
      diagnosis and monitoring of vocal, neurological, psychiatric, respiratory and pediatric
      voice and speech conditions.
  - response: >-
      To introduce and establish the field of audiomics by developing new standards of
      acoustic and voice data collection, interoperability and analysis for voice AI research.
  - response: >-
      To develop software and cloud infrastructure permitting non-invasive, user-friendly,
      high-quality voice data collection through a smartphone or tablet application, with
      integrated acoustic amplification and acoustic quality standardization.
  - response: >-
      To develop ethical and legal norms, including new guidelines for consenting to voice
      data collection, sharing and utilization, that safeguard participants while supporting
      data-sharing efforts.
  - response: >-
      To create benchmarks of diversity metrics and minimize the risk of algorithmic bias in
      voice AI, and to build a community and training pathways for voice AI researchers,
      including those from underserved communities.

addressing_gaps:
  - response: >-
      Prior studies of machine-learning-based voice diagnosis produced promising results but
      relied on small- to medium-sized datasets, in some cases fewer than 300 patients, and
      generally used voice as the only data type without the key clinical metadata needed to
      train robust, clinically useful models.
  - response: >-
      Comparing studies and pooling data has been difficult because there are no accepted
      standards for how voice and speech data are collected and measured; this dataset is
      accompanied by standardized, published acquisition protocols and bioinformatics
      standards intended to make pooling possible.
  - response: >-
      Industry holds vast quantities of voice data but lacks accurate clinical or demographic
      annotation, and its datasets are private, which prevents external auditing of models and
      of the fair representation of diverse populations in training data.
  - response: >-
      There is a shortage of publicly available voice datasets that are audited for
      representativeness, so this dataset was designed as an openly documented, ethically
      sourced resource that researchers can access without reliance on the private sector.
  - response: >-
      Pediatric voice and speech data are especially sparse because of ethical concerns and
      acquisition difficulties, and adult normative evidence does not generalize to children
      whose larynx and respiratory system are still maturing; a companion pediatric dataset
      addresses this gap.

tasks:
  - response: >-
      Detection and classification of health conditions from voice, speech, cough and
      breathing recordings, with diagnostic categories spanning vocal pathologies,
      neurological and neurodegenerative disorders, psychiatric and mood conditions, and
      respiratory disorders.
  - response: >-
      Screening, diagnosis and longitudinal monitoring of disease using acoustic biomarkers,
      including remote and low-resource settings where only a recording device is available.
  - response: >-
      Pretraining, fine-tuning, benchmarking and external validation of AI and machine
      learning models on multimodal voice and clinical data.

instances:
  - instance_type: >-
      Adult study participant, described by demographics, acoustic confounders, diagnosis
      records, validated questionnaire responses and enrollment metadata
    counts: 833
    data_substrate: B2AI_SUBSTRATE:41
    data_topic: B2AI_TOPIC:25
    label: true
    label_description: >-
      Each participant carries one or more clinician-assigned diagnostic labels drawn from the
      five disease cohort categories, or a control designation. Labels were assigned at the
      collection site by a qualified physician or practitioner following the Bridge2AI-Voice
      protocols and ICD-10 codes, and validated against cohort-specific gold standards such as
      laryngoscopy and stroboscopy images, CT and MRI, whole genome sequencing, spirometry and
      flow-volume loops, or electronic health record and medication history for the
      psychiatric cohort.
    notes: >-
      A participant may have more than one recording session, so phenotype tables can contain
      more than one row per participant, and responses to the same data element are not
      required to be identical across sessions.
  - instance_type: >-
      Derived feature set for a single acoustic task recording, keyed by participant
      identifier, session identifier and task name
    data_substrate: B2AI_SUBSTRATE:30
    data_topic: B2AI_TOPIC:36
    label: false
    notes: >-
      Per-feature record counts in version 3.1.0 are 29,278 for spectrograms, Mel spectrograms
      and MFCCs; 32,522 for torchaudio pitch; 28,640 for SPARC electromagnetic articulography;
      31,855 for SPARC loudness; 31,872 for SPARC periodicity and SPARC pitch; and 29,289 for
      phonetic posteriorgrams. Counts differ because features for sensitive records and audio
      checks were withheld, and because some recordings could not yield certain features.
  - instance_type: >-
      Original monaural voice, speech, cough or breathing recording of a single acoustic task
    data_substrate: B2AI_SUBSTRATE:48
    data_topic: B2AI_TOPIC:36
    label: false
    notes: >-
      Raw audio is not part of the registered-access release. It is disseminated only through
      a controlled-access mechanism via Synapse following review by the Data Access Compliance
      Office.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Age is self-reported in the demographics instrument at enrollment. Eligibility for the
      adult dataset spans 18 to 120 years; the neurological cohort additionally restricts
      enrollment to participants aged 44 to 85.
  - subpopulation_elements_present: true
    identification: Gender is self-reported in the demographics instrument.
  - subpopulation_elements_present: true
    identification: Sex is self-reported in the demographics instrument; eligibility is open to all sexes.
  - subpopulation_elements_present: true
    identification: >-
      Race and ethnicity are self-reported in the demographics instrument. Race information is
      retained in the release and is flagged as sensitive.
  - subpopulation_elements_present: true
    identification: >-
      Socioeconomic status is captured through demographic questions on employment, education
      and related factors selected because they may affect voice and speech. Household income
      and other highly sensitive socioeconomic elements were removed from the release.

subsets:
  - id: doi:10.13026/8xbn-nq66#voice-disorders-cohort
    name: Voice disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with laryngeal and vocal fold conditions: laryngeal cancer (T1-T4,
      biopsy-proven), laryngitis (acute, chronic, bacterial, fungal or autoimmune, with
      evidence on laryngoscopy and dysphonia), pre-cancerous lesions (keratosis, leukoplakia),
      benign vocal fold lesions (nodules, polyps, cysts, Reinke's edema, ulcers, recurrent
      respiratory papilloma, fibrous mass), muscle tension dysphonia, spasmodic dysphonia and
      laryngeal dystonia including vocal tremor, unilateral vocal fold paralysis, and glottic
      insufficiency or presbyphonia. Diagnoses are validated against laryngoscopy images and
      stroboscopy videos, with CT and spirometry additionally used for vocal fold paralysis.
      Participants recently operated on, or with no evidence of pathology on scope, are
      excluded.
  - id: doi:10.13026/8xbn-nq66#respiratory-disorders-cohort
    name: Respiratory disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with airway stenosis (bilateral vocal fold paralysis, supraglottic, glottic,
      posterior glottic, subglottic, tracheal or multi-level upper airway stenosis, excluding
      nasopharyngeal stenosis) and unexplained chronic cough (bothersome cough of more than
      eight weeks with an extensive list of alternative causes excluded), together with COPD
      and asthma. Diagnoses are validated using spirometry and flow-volume loops and CT of the
      neck and chest. This cohort adds dedicated breath-sound and voluntary-cough acoustic
      tasks.
  - id: doi:10.13026/8xbn-nq66#neurological-disorders-cohort
    name: Neurological and neurodegenerative disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants aged 44 to 85 with a clinical diagnosis of mild cognitive impairment,
      Alzheimer's disease, other dementias (frontotemporal, Lewy body, vascular, mixed or
      alcohol-induced), amyotrophic lateral sclerosis, or Parkinson's disease and atypical
      parkinsonism. Validation draws on brain CT and MRI, whole genome sequencing, and serum
      p-tau for Alzheimer's disease. Participants who have had surgery significantly altering
      the symptoms of the disease under study are excluded. This cohort adds the Word-Color
      Stroop, productive vocabulary, random item generation and Cinderella story tasks.
  - id: doi:10.13026/8xbn-nq66#mood-psychiatric-disorders-cohort
    name: Mood and psychiatric disorders cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants with an existing clinical diagnosis of depression or major depressive
      disorder, anxiety disorder, or bipolar I or II disorder, or who are currently
      experiencing a corresponding episode, together with comorbid conditions including
      alcohol or substance use disorder, ADHD, autism spectrum disorder, borderline
      personality disorder, eating disorder, insomnia and sleep disorder, obsessive-compulsive
      disorder, panic disorder, post-traumatic stress disorder, schizophrenia and social
      anxiety disorder. Diagnoses are validated using the electronic health summary, a
      psychiatrist's clinical diagnosis, or medication history, determined outside the data
      collection session by an appropriately licensed clinician. This cohort adds animal
      fluency and open-response question tasks.
  - id: doi:10.13026/8xbn-nq66#control-cohort
    name: Control cohort
    is_subpopulation: true
    is_data_split: false
    description: >-
      Participants who have not been diagnosed with or treated for a voice, respiratory,
      pediatric, mood or neurological disorder affecting voice, cough, breath or speech, and
      who serve as controls in the dataset. Controls complete the common demographic,
      confounder and questionnaire battery together with the Part A acoustic tasks.

splits:
  - split_details: >-
      No recommended training, validation or test partitions are supplied with the dataset.
      Researchers are expected to construct their own splits according to the requirements of
      their study, and to account for the skew in the dataset across disorder category, site
      and demographic factors when doing so.

relationships:
  - relationship_details: >-
      Instances are otherwise unrelated: participants are not linked to one another, and no
      graph, network or paired structure is asserted between them. The one within-dataset
      relationship is between a participant and their sessions and recordings; a participant
      may have more than one session, and all feature records are keyed by participant
      identifier, session identifier and task name so that recordings can be grouped back to
      the participant and session that produced them.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: true
    was_validated_verified: true
    acquisition_details: >-
      Participant data were both directly observed and self-reported. Acoustic tasks were
      performed by the participant and recorded directly; demographics, confounders and
      validated questionnaires were self-reported. Clinical diagnoses were verified by
      clinicians reviewing audio or imaging data, examining electronic health records, or
      checking active medication prescriptions.
  - was_inferred_derived: true
    acquisition_details: >-
      All acoustic content in the registered-access release is derived rather than observed
      directly: spectrograms, Mel spectrograms, MFCCs, pitch contours, articulatory traces,
      phonetic posteriorgrams, static acoustic features and transcriptions are computed from
      the standardized audio by automated toolkits.

collection_mechanisms:
  - mechanism_details: >-
      The Bridge2AI-Voice application, a custom iOS tablet application hosting the data
      acquisition protocols, was used to present acoustic tasks, demographic and confounder
      surveys, and validated patient-reported outcomes to adult participants in clinic.
  - mechanism_details: >-
      reproschema-ui was used to deliver the Bridge2AI-Voice pediatric protocol; pediatric
      responses are subsequently extracted and transformed into REDCap format.
  - mechanism_details: >-
      The Bridge2AI Voice Web app and the Bridge2AI Voice iOS app were used for remote data
      collection. No software is downloaded or installed and no login is required; data are
      held only during the collection session and transmitted over HTTPS to a HIPAA-compliant
      storage server.
  - mechanism_details: >-
      REDCap was used as the clinical data capture and export platform. The supporting REDCap
      data dictionary, metadata and instrument PDFs are published openly, and exports were
      converted to the release format by the open-source b2aiprep library.
  - mechanism_details: >-
      Recording hardware consisted of iPad 9th or 10th generation and iPad Air 5th generation
      tablets with an Avid AE-36 head-mounted microphone connected via an Apple dongle.
      Participants were instructed to wear the headset for tasks involving voice recording, as
      required by the Bridge2AI-Voice suggested standards; for a subset of pediatric
      participants the built-in tablet microphone was used where a headset could not be
      tolerated.

data_collectors:
  - role: researcher
    collector_details: >-
      Site research teams, which may include medical, graduate and undergraduate students,
      coordinated recruitment and administered the collection sessions in a private clinic
      room, screening participants against inclusion and exclusion criteria before the visit.
  - role: academic_institution
    collector_details: >-
      Clinicians and physicians at each site identified appropriate participants and supplied
      the gold-standard diagnoses. They were listed under the IRB as co-investigators and
      added to the consortium so that their names appear on consortium-level publications
      arising from the research; they were not otherwise compensated for this role.
  - role: third_party
    collector_details: >-
      Hospital staff were not involved in scheduling but assisted with the logistics of
      coordinating data collection.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from the individuals concerned rather than obtained through
      third parties, with the exception of clinical validation information extracted from
      electronic health records under participant authorization.

collection_timeframes:
  - timeframe_details: >-
      Data for the release were collected over a period of twelve months. Collection is
      ongoing under a four-year prospective cohort protocol, and further versions add
      participants recruited after the period covered by earlier releases.
    source_caveats: >-
      The healthsheet states a twelve-month collection period but does not give calendar start
      and end dates for it, so no dates are asserted. The NIH RePORTER record gives project
      start 2022-09-01 and project end 2026-11-30, which bound the funded project rather than
      the collection window for this release.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Non-probability sampling. Participants were recruited across academic institutions from
      high-volume expert clinics, defined as clinics or programs with multidisciplinary
      expertise in a specific disease area seeing more than fifty patients per month from that
      disease category. Charts of patients presenting at these clinics were screened against
      cohort-specific inclusion and exclusion criteria before the clinic day, and all patients
      meeting the criteria were offered participation. Recruitment also used flyers, QR-code
      links to a REDCap screening survey, social media, and the FlowTrials platform. Where
      specific diagnoses or severities were under-represented, participants were identified by
      medical record review on diagnostic codes.
    why_not_representative: >-
      The sample is not representative because it was collected at a limited number of
      geographic locations, all in the United States and Canada, and only from English
      speakers. Recruitment through specialty clinics concentrates severity and diagnostic mix
      in ways that do not reflect the general population.
    representative_verification:
    - >-
      Representativeness was not verified. The stated intention is to make future collection
      more representative by shifting to remote collection and designing the recruiting
      approach to control for more variables.

raw_data_sources:
  - source_description: >-
      Original monaural voice, speech, cough and breathing recordings of the standardized
      acoustic tasks, captured prospectively from consented participants in clinic using the
      Bridge2AI-Voice application or reproschema-ui.
    source_type: Prospectively collected primary research data
    raw_data_format: WAV audio
    access_details: >-
      Retained but not publicly accessible. Raw audio is disseminated only under controlled
      access, requiring a Data Access Request Form, a Data Use Agreement, review by the Data
      Access Compliance Office, and a Data Use and Transfer Agreement signed by an authorized
      institutional official. Approved requesters obtain the data via Synapse at
      https://www.synapse.org/Synapse:syn72370534/ for the adult cohort. Requests are made to
      DACO@b2ai-voice.org.
  - source_description: >-
      Questionnaire, demographic, confounder, eligibility, enrollment and diagnosis responses
      captured through the data collection applications and held in REDCap, together with
      pediatric responses captured in reproschema-ui and transformed into REDCap format.
    source_type: Prospectively collected primary research data
    raw_data_format: REDCap export and ReproSchema responses
    access_details: >-
      Exported and converted to the released tab-delimited phenotype tables using the
      open-source b2aiprep library. The supporting REDCap data dictionary, metadata and
      instrument PDFs are openly published at https://github.com/eipm/bridge2ai-redcap.
  - source_description: >-
      Multimodal clinical data extracted from site electronic health records for gold-standard
      diagnostic validation, including laryngoscopy and stroboscopy imaging, brain CT and MRI,
      chest imaging, spirometry and flow-volume loops, and medication history.
    source_type: Existing clinical records reviewed under participant authorization
    access_details: >-
      Extracted at each site independently and uploaded to the REDCap database. No externally
      sourced multimodal data of this kind is included in the version 3.0.0 or later public
      releases.

preprocessing_strategies:
  - preprocessing_details: >-
      Raw audio was standardized by conversion to monaural and resampling to 16 kHz with a
      Butterworth anti-aliasing filter applied, before any feature extraction.
  - preprocessing_details: >-
      Raw audio files and questionnaire data retrieved from reproschema-ui or exported from
      REDCap were converted to be compliant with the Brain Imaging Data Structure v1.9.0,
      organized under phenotype directories for confounders, demographics, diagnosis,
      enrollment, questionnaire and task tables, with per-subject and per-session audio
      directories.
  - preprocessing_details: >-
      Pediatric data collected through reproschema-ui are extracted and transformed into
      REDCap format and subsequently converted to the Brain Imaging Data Structure.
  - preprocessing_details: >-
      Dense derived features were computed from the standardized audio and stored in two
      formats: a fixed feature format holding static features extracted from the whole
      waveform, and a temporal format whose length varies with the duration of each recording.
      Spectrograms were additionally downsampled by a factor of two in the time domain after
      derivation.
  - preprocessing_details: >-
      All processing was performed with the open-source b2aiprep library, which organizes and
      preprocesses the dataset, and SenseLab, which processes audio files for research tasks.
      The version 3.1.0 release was generated with b2aiprep v3.0.0.

cleaning_strategies:
  - cleaning_details: >-
      No data cleaning was applied. The healthsheet records that no preprocessing was carried
      out for the purpose of cleaning the data, and that no instances were excluded at the
      time of preprocessing.
  - cleaning_details: >-
      A separate audit protocol is applied in place of cleaning: missingness tables are
      generated; distributions and outliers are checked; categorical responses are checked
      against the schema; and audio tasks are subjected to quality control metrics, including
      checks on the amount of silence and the duration of each waveform and, for speech tasks,
      comparison of produced speech against the intended passage. Version 3.1.0 additionally
      releases the resulting per-recording audio quality metrics.

labeling_strategies:
  - annotations_per_item: 1
    labeling_details: >-
      Diagnostic labels are gold-standard labels arising from clinical assessment rather than
      from post hoc annotation. At each site a local clinician provided the diagnosis on the
      basis of a clinical interview and appropriate work-up. For the psychiatric disorders
      cohort the assessment was determined from the participant's electronic health record or
      an active prescription, established outside the data collection session by an
      appropriately licensed clinician.
    annotator_demographics:
    - >-
      Labels were supplied by the clinician at the site of data collection, or by a clinician
      external to the study who had made the prior diagnostic assessment. No further
      demographic characterization of labelers is provided.
    data_annotation_protocol: >-
      The Bridge2AI-Voice protocols and ICD-10 codes. Any new labels created by downstream
      users are expected to be described alongside the release of a model or a publication,
      including the exact variables used for the determination.
    data_annotation_platform: REDCap
    inter_annotator_agreement: >-
      Not applicable: a single labeler provides the label for each instance.

annotation_analyses:
  - annotation_quality_details: >-
      Only one labeler provided a label per instance, so no inter-annotator agreement was
      computed and no disagreement analysis is available. Human-level performance on the
      applications the dataset is intended to address is described as varying widely.
    disagreement_patterns:
    - >-
      Variation in diagnostic practice across sites is identified as a confounder that may
      manifest as systematic differences in labels between sites rather than as measurable
      disagreement between labelers on the same instance.

machine_annotation_tools:
  - tools: >-
      OpenAI Whisper Large for transcription; openSMILE for eGeMAPS and other acoustic feature
      extraction; Praat and Parselmouth for phonetic and prosodic features including
      fundamental frequency, formants and voice quality; torchaudio for pitch contours,
      spectrograms, Mel spectrograms and MFCCs; Speech Articulatory Coding (sparc) for
      electromagnetic articulography estimates together with loudness, periodicity and pitch;
      the ppgs package for phonetic posteriorgrams; and the b2aiprep and SenseLab libraries for
      orchestration and audio processing.
    tool_descriptions: >-
      Spectrograms use a 25 ms window, 10 ms hop and 400-point FFT; Mel spectrograms and MFCCs
      use the same parameters with 60 Mel bins and 60 coefficients respectively; SPARC features
      are gathered at 50 Hz using 20 ms windows; phonetic posteriorgrams are produced at 100 Hz
      over 40 phoneme categories.
    tool_accuracy:
    - >-
      Certain aspects of the data, including transcription, were generated using off-the-shelf
      models that have not been audited for correctness.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    derivation: >-
      Pseudonymous study identifier assigned at enrollment; keys every phenotype table and
      every feature record.
  - variable_name: session_id
    data_type: identifier
    is_identifier: true
    derivation: >-
      Identifier for a single recording session. A participant may have more than one session.
  - variable_name: task_name
    data_type: categorical
    derivation: >-
      Name of the acoustic task performed, drawn from the protocol's set of non-voice,
      voice-non-speech and speech tasks.
  - variable_name: n_frames
    data_type: integer
    derivation: Number of time frames in the associated temporal feature for a given recording.
  - variable_name: spectrogram
    data_type: array
    measurement_technique: torchaudio short-time Fast Fourier Transform
    derivation: >-
      Dimension 201 by T; 25 ms window, 10 ms hop, 400-point FFT, downsampled by a factor of
      two in the time domain after derivation. Stored in torchaudio_spectrogram.parquet.
    quality_notes: >-
      Withheld for free-speech recordings, for records identified as sensitive, and for audio
      checks.
  - variable_name: mel_spectrogram
    data_type: array
    measurement_technique: torchaudio Mel filterbank
    derivation: >-
      Dimension 60 by T; 25 ms window, 10 ms hop, 400-point FFT, 60 Mel bins. Stored in
      torchaudio_mel_spectrogram.parquet.
  - variable_name: mfcc
    data_type: array
    measurement_technique: torchaudio Mel-frequency cepstral analysis
    derivation: >-
      60 Mel-frequency cepstral coefficients, dimension 60 by T, computed with the same
      parameters as the Mel spectrograms. Stored in torchaudio_mfcc.parquet.
  - variable_name: pitch
    data_type: array
    unit: Hz
    minimum_value: 80.0
    maximum_value: 500.0
    measurement_technique: torchaudio pitch detection
    derivation: >-
      Detected fundamental frequency over time, of dimension T. Stored in
      torchaudio_pitch.parquet.
  - variable_name: sparc_pitch
    data_type: array
    unit: Hz
    minimum_value: 50.0
    maximum_value: 550.0
    measurement_technique: Speech Articulatory Coding (sparc)
    derivation: >-
      Estimated fundamental frequency of the audio signal computed by a different algorithm
      from the torchaudio pitch trace, of dimension T at 50 Hz. Stored in sparc_pitch.parquet.
  - variable_name: sparc_ema
    data_type: array
    measurement_technique: Speech Articulatory Coding (sparc) deep learning model
    derivation: >-
      Estimated electromagnetic articulography of dimension T by 12, where the twelve channels
      are the X and Y positions of six articulators: tongue dorsum, tongue body, tongue tip,
      lower incisor, upper lip and lower lip. Stored in sparc_ema.parquet.
  - variable_name: sparc_loudness
    data_type: array
    measurement_technique: Speech Articulatory Coding (sparc)
    derivation: >-
      Estimated loudness based on the average absolute amplitude of the audio waveform, of
      dimension T using 20 ms windows. Stored in sparc_loudness.parquet.
  - variable_name: sparc_periodicity
    data_type: array
    measurement_technique: Speech Articulatory Coding (sparc)
    derivation: >-
      Estimated periodicity, that is the confidence of pitch presence, derived using 20 ms
      windows, of dimension T. Stored in sparc_periodicity.parquet.
  - variable_name: ppgs
    data_type: array
    measurement_technique: Phonetic posteriorgram model (ppgs package)
    derivation: >-
      Phonetic posteriorgram probabilities across 40 phoneme categories, giving dimension 40 by
      T at a frame rate of 100 Hz. Stored in ppgs.parquet.
  - variable_name: static_features
    data_type: object
    measurement_technique: openSMILE, Praat, Parselmouth and torchaudio
    derivation: >-
      One row per unique recording holding features extracted from the whole waveform,
      including openSMILE eGeMAPS features, Praat and Parselmouth measures of fundamental
      frequency, formants and voice quality, and speech intelligibility metrics for speech
      tasks. Distributed as static_features.tsv with an accompanying JSON data dictionary.
  - variable_name: audio_quality_metrics
    data_type: object
    derivation: >-
      One row per audio recording holding quality control metrics derived from the raw audio,
      introduced in version 3.1.0 and distributed as audio_quality_metrics.tsv.
  - variable_name: race
    data_type: categorical
    is_sensitive: true
    derivation: Self-reported in the demographics instrument.
  - variable_name: sexual_orientation
    data_type: categorical
    is_sensitive: true
    derivation: Self-reported in the demographics instrument.

missing_data_documentation:
  - missing_data_patterns: >-
      Every participant answered a common set of questions and then responded to additional
      questions relevant to their primary diagnostic category, so cohort-specific instruments
      are systematically missing for participants outside that cohort. Phenotype tables contain
      a row for a participant only where at least one column is non-missing. Feature files omit
      recordings for which the feature could not be generated, so per-feature record counts
      differ across files.
    missing_data_causes: >-
      Some questions are optional; data collection irregularities left information missing from
      individual instances; the collection protocol changed over the course of the study and
      differs between sites; and features for free-speech recordings, for records identified as
      sensitive, and for audio checks were deliberately withheld from the release.
    handling_strategy: >-
      A missingness table is generated as part of the audit protocol and included with the
      dataset. No imputation is applied.

anomalies:
  - anomaly_details: >-
      Different sites used different collection configurations, including distinct iPad devices
      at each site, and the collection protocol changed over the course of the study.
  - anomaly_details: >-
      Recordings were made with a head-mounted headset and microphone that could sit at
      slightly different distances between participants and sessions, introducing variation in
      recording level and channel characteristics.
  - anomaly_details: >-
      Noise artifacts are present in the recordings, and questionnaire responses may be
      inaccurate or subject to underreporting.
  - anomaly_details: >-
      Transcriptions and certain other derived elements were produced using off-the-shelf
      models that have not been audited for correctness.
  - anomaly_details: >-
      Some recordings, whether because of their length or for other reasons, could not yield
      certain features and are therefore absent from the corresponding feature file.
  - anomaly_details: >-
      Parquet files distributed in version 3.0.0 were broken and were fixed in version 3.1.0;
      spectrograms distributed before version 2.0 contained minor issues and were reprocessed.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants were recruited from high-volume expert clinics on the basis of a known
      diagnosis, so the sample reflects patients who reach specialty care rather than the
      population in which a voice-based screening tool would be deployed. Controls were
      recruited separately and are not matched to cases.
    mitigation_strategy: >-
      Planned expansion to community outreach clinics and to remote collection, and a plan for
      enhancing diverse perspectives intended to broaden recruitment.
  - bias_type: sampling_bias
    bias_description: >-
      Non-probability sampling at five recording sites in the United States and Canada, with
      participation restricted to those who read and speak English.
    affected_subsets:
    - All cohorts.
  - bias_type: representation_bias
    bias_description: >-
      The dataset is skewed by disorder category, site and other demographic factors, and the
      public releases do not contain an equal distribution across the five disease categories.
      Groups with less trust in the medical system or in AI, or who live farther from the
      collection sites, were less likely to be recruited.
    mitigation_strategy: >-
      Users are directed to consider the multivariate distribution when assessing the dataset's
      utility for a given question.
  - bias_type: measurement_bias
    bias_description: >-
      Participants were screened for different disorders depending on the site, so cohort
      membership is confounded with the recording device and configuration used. Distinct iPad
      devices were used at each site, and microphone distance varied with headset fit.
  - bias_type: annotation_bias
    bias_description: >-
      Diagnostic labels depend on the practice of the individual clinician and cohort: some
      diagnoses were made by a clinician at the point of collection, others were taken from an
      electronic health record or an active prescription. Variation in diagnostic criteria and
      practice across sites and over time is an identified source of distribution shift.

known_limitations:
  - limitation_type: coverage_limitation
    limitation_description: >-
      Data collection was conducted only with fluent English speakers; Spanish protocols were
      under development at the time of the documented releases and are not represented.
    scope_impact: >-
      Models trained on this dataset cannot be assumed to transfer to speakers of other
      languages or to non-fluent English speakers.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The dataset is a sample of an ongoing collection drawn from five recording sites in the
      United States and Canada using non-probability sampling, and is not representative of any
      wider population.
    recommended_mitigation: >-
      Assess the multivariate distribution of site, disorder category and demographics before
      drawing population-level conclusions.
  - limitation_type: scope_limitation
    limitation_description: >-
      The registered-access release contains derived features rather than the original audio.
      Spectrograms, Mel spectrograms, MFCCs, phonetic posteriorgrams and articulatory estimates
      are withheld for free-speech recordings, for records identified as sensitive, and for
      audio checks; transcriptions of free speech are removed entirely.
    recommended_mitigation: >-
      Researchers requiring the waveform or free-speech content must apply for controlled
      access through the Data Access Compliance Office.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The collection protocol changed over the course of the study, and changes in diagnostic
      criteria or practice over the collection period are identified as a source of
      distribution shift.
  - limitation_type: resolution_limitation
    limitation_description: >-
      Dates are rebased or replaced by integers, geographic information is generalized with
      state and province removed and only country of collection retained, and narrative text
      fields are removed, which limits temporal, geographic and free-text analyses.
  - limitation_type: methodological_limitation
    limitation_description: >-
      K-anonymization at k of two or greater is not achieved, and the dataset was audited
      internally rather than by an independent party.
  - limitation_type: integration_limitation
    limitation_description: >-
      The multimodal data described in the acquisition protocol, including laryngoscopy
      imaging, brain imaging, spirometry and genomic data, are held at the collecting sites and
      are not included in the public release.

sensitive_elements:
  - sensitive_elements_present: true
    sensitivity_details: >-
      The dataset includes race and ethnic origin information, sexual orientation information,
      and socioeconomic and health data. Elements encoded as sensitive in the REDCap data
      dictionary were removed from the release, and highly sensitive non-identifying elements
      such as household income, mental health status and traumatic life experiences were also
      removed. Voice itself is treated as a sensitive biometric with potential for
      re-identification, which is why raw audio is withheld from registered access.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet records that the released dataset does not contain data protected by
      legal privilege or doctor-patient confidentiality, nor the content of non-public
      communications. Identifiable clinical source data remain behind institutional firewalls
      and are not released.

content_warnings:
  - content_warnings_present: true
    warnings:
    - >-
      The dataset includes free speech tasks. Although the inclusion of offensive, insulting or
      distressing material is considered unlikely, it cannot be entirely avoided because
      participants choose their own words. Transcriptions of free speech were removed from the
      release for this and for re-identification reasons. Diagnostic and questionnaire content
      spans depression, anxiety, post-traumatic stress and other psychiatric conditions.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Safe Harbor identifier removal combined with expert review by a team of ethicists for
    indirect identifiers and highly sensitive non-identifying elements, and withholding of all
    raw audio.
  identifiers_removed: >-
    Names, civic addresses and social security numbers; HIPAA Safe Harbor identifiers including
    geographic locators, date information at a resolution finer than years, telephone and fax
    numbers, email addresses, IP addresses, medical record numbers, health plan beneficiary
    numbers, device identifiers, license numbers, account numbers, vehicle identifiers, website
    URLs, full-face photographs, biometric identifiers and other unique identifiers; state and
    province, with country of collection retained; narrative text fields; and select indirect
    geographic and demographic identifiers together with information about household
    composition and cultural identity.
  deidentification_details: >-
    Direct identifiers were removed because they would reveal the identity of the participant.
    Indirect identifiers were removed where they created a significant risk of re-identification
    through combination with public data on social media, in government registries or elsewhere.
    Non-identifying elements revealing highly sensitive information, such as household income,
    mental health status and traumatic life experiences, were also removed. Dates were rebased
    or replaced by integers. Raw audio transcripts were reviewed and any recordings containing
    potentially identifying information or external voices were removed from the release. All
    raw voice data were removed because of their potential to cause re-identification or to be
    used for illicit or unauthorized purposes. K-anonymization at k of two or greater is not
    achieved.
  source_caveats: >-
    The de-identification level is stated as removing information identifiable under HIPAA and
    the Common Rule together with data considered sensitive. Voice remains inherently
    identifying, which is the stated reason for withholding the waveforms rather than a claim
    that the residual data carry no re-identification risk.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - >-
    Submitted to and approved by the University of South Florida single IRB, with subsite IRB
    approvals obtained through the single IRB process. Data collection and sharing for the
    adult dataset was approved by the University of South Florida Institutional Review Board;
    the pediatric dataset was approved by the Research Ethics Board at the Hospital for Sick
    Children. Canadian participating institutions do not follow the single IRB process and
    obtained separate research ethics board approvals.
  ethics_review_board: >-
    University of South Florida Institutional Review Board (single IRB of record); Hospital for
    Sick Children Research Ethics Board; separate Canadian research ethics board approvals at
    Mount Sinai Hospital and the University of Toronto for the genomic sub-study.
  regulatory_compliance:
  - >-
    HIPAA de-identification rules applied; data collection applications and storage servers are
    HIPAA-compliant and transmit over HTTPS to NIH STRIDES partner infrastructure; the data are
    covered by a Certificate of Confidentiality, which must be asserted against compulsory legal
    demands such as court orders and subpoenas; the data are Personally Identifiable Information
    as defined in OMB Memorandum M-07-16 and are not subject to the Federal Privacy Act of 1974.
  special_populations:
  - >-
    Children aged 2 to 18 are enrolled in the pediatric cohort, exclusively at pediatric
    participating institutions and not at the University of South Florida site.
  notes: >-
    No data monitoring committee was appointed for the study. The study is not for a drug
    product and is not for a medical device.

at_risk_populations:
  at_risk_groups_included: true
  guardian_consent:
  - >-
    Parents or guardians provide consent for children. Parental permission is obtained from one
    or both parents; because the research is minimal risk it does not require permission from
    both parents or legal guardians.
  assent_procedures: >-
    Children provide verbal assent where appropriate, and assent is documented. Where young
    children cannot reasonably be asked to assent because of limitations in understanding due to
    age and development, typically under seven years of age, they are not asked to do so.
  special_protections:
  - >-
    Pediatric data collection is performed only at pediatric participating institutions and not
    at the coordinating University of South Florida site. Pediatric participants are recruited
    strictly from the Hospital for Sick Children and grouped by age, with age-appropriate
    protocol variants for the 2-4, 4-6, 6-10 and 10-plus bands. A checklist for research
    involving children was completed and appended to the protocol.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Prospective informed consent obtained before data collection, provided on paper,
      electronically within the application or through a REDCap survey, or by video recording
      within the application.
    consent_documentation: >-
      Paper consent documents are uploaded and saved electronically in REDCap. Electronic
      consent is housed in REDCap and is HIPAA compliant. Video consent requires the participant
      to read a statement aloud on camera, which also serves to verify that the acoustic data
      submitted belong to the consented individual and to distinguish participants from
      automated agents. All paper and electronic versions of consent are stored for a minimum of
      five years after completion of the study. For longitudinal at-home collection, electronic
      consent is administered within the application before each subsequent collection to
      confirm ongoing consent.
    consent_scope: >-
      Participants are informed that research data not containing their direct identifiers will
      be shared with external researchers for future research through a secure database; that
      data posing a low risk of re-identification will be shared in registered access with the
      general public; and that data posing a heightened risk if shared in full open access will
      be shared through a controlled access mechanism with authorized researchers. Consent does
      not restrict use to non-commercial purposes, to a specific geographic location, to a
      specific type of research, to genetic research, or to research that does not involve
      methods or algorithm development.
    withdrawal_mechanism: >-
      Participants are informed that they may withdraw from the study at any point. Where a
      participant chooses to withdraw during or before the voice data collection, their data are
      not included in the database; once the voice data collection process is completed,
      research data including voice recordings cannot be removed from the database. Participants
      who withdraw or decline may optionally complete a satisfaction survey to explain their
      reasons; no protected health information is collected in that survey.

collection_consents:
  - consent_details: >-
      All participants were duly informed and agreed to the collection and use of their data via
      prospective informed consent. Participants who consent also permit investigators to access
      medical information through electronic health record platforms in order to perform
      gold-standard validation of diagnoses and symptoms.

collection_notifications:
  - notification_details: >-
      Participants were notified about the data collection through an IRB-approved consent
      process conducted before collection. They were explicitly informed about the data being
      collected, the methods used to secure those data, and the information that would be used
      for the study, and were told that participation is voluntary and does not affect their
      medical care. Approximately thirty minutes was allowed for explanation and questions, and
      potential participants were asked to explain their understanding back to the research
      assistant.

consent_revocations:
  - revocation_details: >-
      Consenting participants may withdraw at any point during the study. Withdrawal during or
      before the completion of voice data collection excludes the participant's data from the
      database. After the voice data collection process is completed, research data including
      voice recordings cannot be removed from the database. For longitudinal collection,
      participants may withdraw at any point and the minimum requirement for study completion is
      a single data collection time point.

participant_privacy:
  - anonymization_method: >-
      Removal of direct identifiers, HIPAA Safe Harbor identifiers, indirect identifiers posing
      significant re-identification risk, non-identifying but highly sensitive elements, and all
      raw voice data from the registered-access release.
    privacy_techniques: >-
      Date rebasing and replacement by integers; removal or generalization of geographic
      information with state and province removed and country retained; removal of narrative
      text fields; review of raw audio transcripts and removal of recordings containing
      potentially identifying information or external voices; two-tier access with registered
      access for low-risk derivations and controlled access for raw audio; and federated
      learning infrastructure allowing model training across institutions without data leaving
      the institution.
    reidentification_risk: >-
      Voice is unique to the individual and cannot be fully de-identified, so a residual risk of
      recognition remains even after removal of all HIPAA-protected information. This risk is
      the stated reason for restricting raw audio to controlled access. K-anonymization at k of
      two or greater is not achieved. Recipients undertake not to use the data, alone or with
      other information, to contact or re-identify participants.
    data_linkage: >-
      Each institution retains its identifiable data locally in a password-protected REDCap
      database, with participant and institution numbers used to link institutional records to
      the shared de-identified dataset. Identifiable data and the linking datasheets are kept on
      local cloud storage for a maximum of ten years after study completion and then destroyed
      under the responsibility of the local principal investigator.

participant_compensation:
  - compensation_provided: true
    compensation_type: Electronic gift cards
    compensation_amount: >-
      40 US dollars for a data collection session lasting under 90 minutes and 80 US dollars for
      a session lasting over 90 minutes, for no more than three sessions and a maximum total
      compensation of 120 US dollars.
    compensation_rationale: >-
      Compensation for the participant's time. Compensation is provided to the adult population
      only.
    source_caveats: >-
      The feasibility study of the collection application reports that its participants received
      no financial incentives; that is a separate study from the dataset collection described
      here. The IRB revision history records that compensation was introduced in August 2023 and
      that amounts changed in July and September 2024, so earlier participants may have received
      different amounts.

ethical_reviews:
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Reviewed and approved the Bridge2AI Voice Data Acquisition protocol as the single IRB of
      record. Participating United States institutions joined through the single IRB process.
      Data collection and sharing for the adult dataset was approved by this board. A partial
      HIPAA waiver was granted for recruitment and screening purposes only, permitting review of
      electronic health record information for incoming clinic patients ahead of their
      appointments, limited to the study's inclusion criteria.
  - reviewing_organization: Hospital for Sick Children Research Ethics Board
    review_details: >-
      Approved data collection and sharing for the pediatric dataset. Canadian institutions do
      not follow the United States single IRB process and obtained separate research ethics
      board approvals; copies of those approvals were submitted to the University of South
      Florida IRB.
  - reviewing_organization: >-
      Mount Sinai Hospital and University of Toronto research ethics boards
    review_details: >-
      Genomic data collection and analysis is performed only at the University of Toronto and
      Mount Sinai Hospital under a separate protocol and research ethics board approval, with a
      copy of the approval submitted to the University of South Florida IRB.
  - reviewing_organization: University of South Florida Institutional Review Board
    review_details: >-
      Approved the separate feasibility study of the Bridge2AI-Voice application conducted at
      the USF Health Voice Center between 5 June and 28 July 2023 under IRB number 004890. All
      participants in that study provided written informed consent; no audio data were collected
      at that stage of application development.

data_protection_impacts:
  - impact_details: >-
      No analysis of the potential impact of the dataset and its use on data subjects has been
      conducted.
  - impact_details: >-
      A published memorandum sets out the ethical justification for restricting raw voice
      samples to controlled access, explaining the reasoning behind the governance structure. It
      is distributed as a PDF alongside the dataset documentation.

data_governance:
  committee_name: Bridge2AI-Voice Data Access Compliance Office (DACO)
  accountable_organization:
    name: University of South Florida Board of Trustees
  access_review_process: >-
    Two tiers apply. For registered access to the features-only data, a requester registers on
    PhysioNet, confirms their identity, becomes a credentialed user, and signs the Bridge2AI
    Voice Registered Access Agreement. For controlled access to raw audio, a requester completes
    a Data Access Request Form and a Data Use Agreement and submits the application to the Data
    Access Compliance Office for review; on approval, a Data Use and Transfer Agreement must be
    signed by an authorized official at the requester's institution. Requests are directed to
    DACO@b2ai-voice.org. Collaborators at other research organizations, and other research teams
    at the same organization, must apply independently and sign their own Data Transfer and Use
    Agreement before accessing the data. Approved personnel are enumerated in an attachment to
    the agreement, and any change to that list requires an amendment.
  stewardship_roles:
  - >-
    The Data Access Compliance Office reviews and approves controlled-access applications. The
    provider institution retains authority to amend the agreement unilaterally should the
    federal sponsor require revision, in which case a recipient objecting to the amendment must
    immediately return or destroy all data. Recipients must retain control over the data, must
    not disclose or grant access to any third party other than approved authorized persons, must
    establish administrative, physical and technical safeguards, and must notify the provider of
    any unauthorized use or disclosure within five business days of discovery.

license_and_use_terms:
  license_terms: >-
    Bridge2AI Voice Registered Access License, with access governed by the Bridge2AI Voice
    Registered Access Agreement for the features-only release and by a Data Access Request Form,
    Data Use Agreement and Data Use and Transfer Agreement for raw audio. The features-only
    release is available to credentialed PhysioNet users who sign the data use agreement; no
    training is required. The data are provided as is, with no representations or warranties of
    any kind. Duplication is permitted as reasonably required to carry out the approved research
    project; sale of all or part of the data on any media is not permitted. Recipients assume
    liability for damages arising from their use, storage, disclosure or disposal of the data,
    and no indemnification is provided by either party.
  data_use_permission: general_research_use
  notes: >-
    Consent does not restrict the data to non-commercial use, to a specific geographic location,
    to a specific type of research, to genetic research, or to research excluding methods and
    algorithm development. The dataset is nonetheless intended solely for commercial and
    non-commercial research purposes by authorized researchers.

ip_restrictions:
  restrictions:
  - >-
    The data may be protected by copyright and other rights, including other intellectual
    property rights, and no guarantee is given that the data are free of third-party
    intellectual property rights, database rights or related rights. Nothing in the agreement
    transfers any intellectual property rights in or relating to the data to the recipient.
    Recipients agree not to make intellectual property claims on the data and not to use
    intellectual property protection, database rights or related rights in a way that could
    prevent or limit access to, or use of, any element of the data or any research conclusion
    derived from it. This restriction is imposed so that future use of the dataset remains
    unrestricted, in alignment with the Open Science principles upheld by the consortium.
    Recipients may elect to perform further research adding intellectual and resource capital
    and may obtain intellectual property rights on such downstream discoveries, but agree to
    implement licensing policies that will not obstruct further research and to respect the Fort
    Lauderdale Agreement. No intellectual property based restrictions have been imposed by third
    parties, and no fees are associated with these restrictions.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - >-
    No export controls or other regulatory restrictions apply to the dataset or to individual
    instances.
  other_compliance: >-
    The data are covered by a Certificate of Confidentiality, which must be asserted against
    compulsory legal demands such as court orders and subpoenas for identifying information or
    characteristics of a research participant. The data are Personally Identifiable Information
    as defined in OMB Memorandum M-07-16 and are not subject to the Federal Privacy Act of 1974.
    The Data Transfer and Use Agreement additionally requires the recipient's authorized
    representative to warrant that the recipient does not use coercion for labor or services as
    defined in Florida Statute section 787.06, and requires adherence to the requirements of
    PhysioNet as managed by the MIT Laboratory for Computational Physiology.

intended_uses:
  - use_category: Research
    usage_notes: >-
      The dataset is primarily intended for research applications, specifically the development
      of AI and machine learning models for healthcare, and supports clinical research in
      disease screening, diagnosis and monitoring through voice biomarkers.
  - use_category: Model development
    usage_notes: >-
      Pretraining, fine-tuning, benchmarking and validation of AI and machine learning models
      using voice data.
    examples:
    - >-
      Development of clinically applicable models for diagnosing vocal pathologies and
      neurological, psychiatric, respiratory and pediatric voice disorders.
  - use_category: Cohort selection
    usage_notes: >-
      The questionnaire and phenotype tables in the phenotype folder are distributed in a form
      intended to support cohort selection prior to acoustic analysis.
  - use_category: Training and education
    usage_notes: >-
      Training opportunities for using the dataset are provided through the Bridge2AI Voice
      Scholars program at https://www.b2aivoicescholars.org/.

discouraged_uses:
  - discouragement_details: >-
      Non-research and non-clinical applications are discouraged, specifically hiring decisions,
      insurance premium adjustments, and any form of surveillance that could lead to
      discrimination or harm. These limitations are intended to prevent unethical or biased
      outcomes that could negatively affect individuals on the basis of their health conditions
      or voice characteristics.
  - discouragement_details: >-
      Use without regard to the dataset's skews across disorder category, site and demographic
      factors is discouraged, because it risks stereotyping, quality-of-service failures and
      other undesirable harms for under-represented groups.

prohibited_uses:
  - prohibition_reason: >-
      Attempting to re-identify research participants, or taking any action that could
      reasonably lead to re-identification, is prohibited under the registered access agreement.
      Recipients may not use the data, alone or in concert with any other information, to contact
      individuals who are the subjects of the data without appropriate institutional review board
      approval, specific written approval from the provider, and informed consent from the
      individual where required.
  - prohibition_reason: >-
      Any purpose that could foreseeably cause harm or stigmatization to research participants,
      their families, communities or specific populations is prohibited.
  - prohibition_reason: >-
      Using intellectual property protections, database rights or related rights in a manner
      that restricts or limits access to any part of the dataset, or to any conclusions derived
      from it, is prohibited so that future use of the dataset remains unrestricted.
  - prohibition_reason: >-
      Sale of all or part of the data on any media is not permitted, and disclosure, release,
      rental, loan or grant of access to any party other than approved authorized persons is
      prohibited without prior written consent.

existing_uses:
  - examples: >-
      A restricted version of the dataset containing raw audio has been used in the Bridge2AI
      Summer School and hackathon.

future_use_impacts:
  - impact_details: >-
      The dataset has skews based on disorder category, site and other demographic factors.
      Users should consider the multivariate distribution when assessing its utility for
      different questions, since failure to do so risks unfair treatment of individuals or
      groups through stereotyping or quality-of-service disparities, and could produce financial
      or legal harms.
  - impact_details: >-
      No analysis of the potential impact of the dataset and its use on data subjects has been
      conducted, so downstream effects on participants remain uncharacterized.
  - impact_details: >-
      The ability of voice to identify a speaker means that downstream models and derived
      products carry re-identification, voice-hacking and data-ownership risks that the
      consortium identifies as requiring a new governance framework rather than existing
      instruments alone.

file_collections:
  - id: doi:10.13026/8xbn-nq66#features
    name: Derived audio features
    collection_type: processed_data
    path: features/
    description: >-
      Dense derived representations of the standardized audio, distributed as Apache Parquet
      files: ppgs.parquet, sparc_ema.parquet, sparc_loudness.parquet, sparc_periodicity.parquet,
      sparc_pitch.parquet, torchaudio_spectrogram.parquet, torchaudio_mfcc.parquet,
      torchaudio_pitch.parquet and torchaudio_mel_spectrogram.parquet. Each record carries
      participant_id, session_id, task_name, n_frames and the tensor for that feature. The folder
      also holds two plain-text files, static_features.tsv with one row per audio recording and
      audio_quality_metrics.tsv with quality control metrics per recording. Every file has a
      companion JSON data dictionary sharing its file stem, describing the feature and the
      processing applied.
  - id: doi:10.13026/8xbn-nq66#phenotype
    name: Phenotype tables
    collection_type: processed_data
    path: phenotype/
    description: >-
      Tab-delimited tables of information collected from the participant or another individual
      during the encounter, organized into confounders, demographics, diagnosis, enrollment,
      questionnaire and task subfolders. Diagnosis tables cover airway stenosis, amyotrophic
      lateral sclerosis, anxiety, benign lesions, bipolar disorder, cognitive impairment,
      control, COPD and asthma, depression, glottic insufficiency, laryngeal cancer, laryngeal
      dystonia, laryngitis, muscle tension dysphonia, Parkinson's disease, precancerous lesions,
      unexplained chronic cough and unilateral vocal fold paralysis. Questionnaire tables cover
      the ADHD adult instrument, custom affect scale, DSM-5 adult, dyspnea index, GAD-7,
      Leicester Cough Questionnaire, PANAS, PHQ-9, productive vocabulary, psychiatric history,
      PTSD adult, VHI-10 and voice perception. Task tables cover acoustic task, Harvard
      sentences, random item generation, recording, session, Stroop and Winograd. Each table has
      a companion JSON data dictionary whose keys match the column names and whose values give a
      description, the question asked of the participant, and the data type.
  - id: doi:10.13026/8xbn-nq66#metadata
    name: Recording metadata
    collection_type: metadata
    path: metadata/
    description: >-
      A Parquet file and its data dictionary holding per-recording metadata introduced in
      version 3.1.0, including task instructions and prompts and information about the
      microphone used and its gain.

distribution_formats:
  - format: Apache Parquet
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Column-oriented binary format used for all dense derived features and for the per-recording
      metadata. Loadable with any Parquet-capable library; the documentation demonstrates loading
      through the HuggingFace Datasets library.
  - format: Tab-separated values with JSON data dictionaries
    access_urls:
      - https://physionet.org/content/b2ai-voice/3.1.0/
    notes: >-
      Used for the phenotype tables, the static acoustic feature table and the audio quality
      metrics table. Each data file is paired with a JSON dictionary sharing its file stem.
  - format: WAV audio
    access_urls:
      - https://www.synapse.org/Synapse:syn72370534/
    notes: >-
      Raw monaural audio, disseminated only under controlled access following review by the Data
      Access Compliance Office and execution of a Data Use and Transfer Agreement. Not part of
      the PhysioNet registered-access release.

distribution_dates:
  - release_dates: "2024-11"
    notes: >-
      Version 1.0, the first release, published on the Health Data Nexus platform at the end of
      November 2024 under DOI 10.57764/qb6h-em84. That platform provides cloud compute alongside
      the dataset rather than allowing data downloads.
  - release_dates: "2025-01-17"
    notes: Version 1.1 published on PhysioNet, adding Mel-frequency cepstral coefficients.
  - release_dates: "2025-04-16"
    notes: >-
      Version 2.0.0 published on PhysioNet, adding 136 new participants, reprocessing
      spectrograms to fix issues identified in the previous release, and removing all
      spectrograms and MFCCs derived from free-speech recordings.
  - release_dates: "2025-08-18"
    notes: Version 2.0.1 published on PhysioNet, correcting the authorship list.
  - release_dates: "2025-12-16"
    notes: >-
      Version 3.0.0 published on PhysioNet, adding 391 new participants to reach 833, separating
      the single phenotype file into individual files, adding SPARC and phonetic posteriorgram
      features, and reorganizing the file layout.
  - release_dates: "2026-05-01"
    notes: >-
      Version 3.1.0 published on PhysioNet. No new participants, but additional data released for
      certain participants, broken Parquet files from the previous release repaired, audio quality
      metrics and per-recording metadata added, validated diagnosis information updated and
      back-filled across conditions, some phenotype files rearranged and certain gold-standard
      variable names renamed.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed broadly to individuals outside the entity that created it,
      through a data publishing platform providing publicly accessible metadata and a DOI for
      persistent resolution, with the data themselves behind registered or controlled access.
      Recipients may not redistribute; collaborators at other organizations and other teams at
      the same organization must apply independently.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      PhysioNet, maintained by the MIT Laboratory for Computational Physiology, hosts the
      registered-access releases from version 1.1 onward and provides the technical
      infrastructure and continued access. PhysioNet is supported by NIH grants U24EB037545 and
      R01EB030362.
  - role: researcher
    maintainer_details: >-
      The Bridge2AI-Voice consortium curates the dataset and operates the Data Access Compliance
      Office, reachable at DACO@b2ai-voice.org, which handles controlled-access requests and
      questions about the data.
  - role: academic_institution
    maintainer_details: >-
      The Health Data Nexus, a data publishing platform maintained by the Temerty Centre for
      Artificial Intelligence Research and Education in Medicine at the University of Toronto,
      hosted the version 1.0 release and provides continued access to it.
  - role: government_agency
    maintainer_details: >-
      The dataset is supported by the NIH via the Bridge2AI Common Fund program.

updates:
  frequency: Semi-annual
  update_details: >-
    Further versions of the dataset are released roughly twice a year, distributed as new
    versions on the hosting platform. Users are notified through news items on the platform and
    through standard communication channels. Each version has a unique DOI and a published
    changelog. Updates add new participants, correct errors and extend the set of derived
    features. Planned expansions include remote data collection, Spanish-language protocols, and
    a target enrollment of 10,000 participants.

version_access:
  versions_available:
  - >-
    1.0 (Health Data Nexus, November 2024), 1.1 (17 January 2025), 2.0.0 (16 April 2025), 2.0.1
    (18 August 2025), 3.0.0 (16 December 2025) and 3.1.0 (1 May 2026) on PhysioNet.
  latest_version_doi: doi:10.13026/37yb-1t42
  version_details: >-
    Each version of the dataset has a unique DOI, and a concept DOI resolves to the latest
    version. By default older versions continue to be supported, hosted and made available to
    researchers, although the dataset publishers reserve the right to remove access to older
    versions; the files for version 1.1 are no longer available and users are directed to the
    latest version. A changelog for each dataset version is published online with the dataset
    metadata.

errata:
  - erratum_details: >-
      Version 2.0 reprocessed the spectrograms to fix minor issues identified in the previous
      release, and removed all spectrograms and Mel-frequency cepstral coefficients derived from
      free-speech recordings.
  - erratum_details: Version 2.0.1 corrected errors in the authorship list.
  - erratum_details: >-
      Version 3.1.0 fixed Parquet files that were broken in the version 3.0.0 release, and
      updated and back-filled validated diagnosis information across conditions.
  - erratum_details: >-
      No standalone erratum document is published. Corrections are communicated through the
      per-version changelog distributed with the dataset metadata.

retention_limit:
  retention_period: >-
    Indefinite for the archived dataset; two years from the start date for recipients under the
    Data Transfer and Use Agreement; a maximum of ten years after study completion for
    identifiable source data held at the collecting institutions.
  retention_details: >-
    Once data are contributed they are retained for as long as they are useful for research
    purposes, possibly indefinitely. Under the Data Transfer and Use Agreement, a recipient's
    access ends two years after the start date, on completion of the project, on expiration of
    the applicable ethics approval, or on termination by the provider, whichever occurs first,
    after which the data must be destroyed in accordance with the provider's instructions and a
    written certification of destruction submitted within thirty days; a recipient may retain one
    copy only to the extent necessary to comply with records retention requirements under law,
    regulation or institutional policy and for research integrity and verification, with the
    agreement's restrictions surviving for that copy. Identifiable data and the datasheets
    linking participant numbers to participant information are kept at each institution on local
    cloud storage for a maximum of ten years after study completion and then destroyed, under the
    responsibility of the local principal investigator. Study documentation and original consent
    forms are retained for a minimum of five years after study completion.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the
    hosting platform referencing the original source; derivative datasets may be made available
    under the same conditions as the source data. For augmentations to the code used to produce
    the data, the open-source repositories provide discussion forums and issue pages for public
    discussion of data preprocessing, and a pull request mechanism for contributing improvements
    to the preprocessing code.

