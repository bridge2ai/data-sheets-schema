id: doi:10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is an ethically sourced, demographically diverse voice dataset linked to
  health information, generated by the Bridge2AI-Voice consortium under the NIH Common Fund
  Bridge2AI program. Adult participants were recruited at high-volume expert clinics across
  five sites in North America on the basis of conditions understood to manifest in the voice
  waveform: voice disorders, neurological and neurodegenerative disorders, mood and psychiatric
  disorders, and respiratory disorders, together with control participants. Each participant
  completed a standardized battery of acoustic tasks (sustained phonation, glides, loudness,
  diadochokinesis, validated reading passages, free speech, breathing and cough recordings)
  delivered through a custom tablet application, alongside self-reported demographic data,
  questionnaires about known acoustic confounders, disease-specific validated patient-reported
  outcomes, and clinician-assigned diagnoses validated against gold standards such as
  laryngoscopy, stroboscopy, imaging, spirometry, and electronic health record review.
  Version 3.1.0 covers 833 adult participants. The public release contains derived
  representations of the audio rather than the original waveforms: spectrograms, Mel
  spectrograms, Mel-frequency cepstral coefficients, pitch contours, articulatory (SPARC)
  features, phonetic posteriorgrams, and static acoustic feature sets from openSMILE, Praat
  and Parselmouth, distributed as Apache Parquet and tab-delimited files with accompanying
  JSON data dictionaries. Raw audio is disseminated only under a separate controlled-access
  mechanism. A companion pediatric dataset covering participants aged 2 to 18 is released
  separately.
