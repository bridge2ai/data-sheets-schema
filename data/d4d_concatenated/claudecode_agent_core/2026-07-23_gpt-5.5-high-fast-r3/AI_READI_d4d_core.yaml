anomalies:
- id: https://fairhub.io/datasets/2#anomaly-pilot-balance
  name: Pilot release balance caveat
  anomaly_details:
  - Dataset documentation notes that, because enrollment is ongoing, the pilot release and periodic releases
    may not have achieved balanced distribution across groups.
- id: https://fairhub.io/datasets/2#anomaly-device-conversion
  name: Device format conversion
  anomaly_details:
  - Some retinal imaging and device outputs are exported in proprietary or raw formats and converted to
    DICOM or mHealth standards prior to FAIRhub upload.
known_biases:
- id: https://fairhub.io/datasets/2#bias-volunteer
  name: Volunteer bias
  bias_type: selection_bias
  bias_description: The protocol notes that participants are volunteers, creating volunteer bias that
    may limit generalizability among people not represented in the study population.
  mitigation_strategy: Recruitment is monitored and adjusted by under- and oversampling groups as needed.
- id: https://fairhub.io/datasets/2#bias-language
  name: English language eligibility
  bias_type: representation_bias
  bias_description: Participants are initially required to speak, read, and understand English; this may
    challenge recruitment of Hispanic and/or Asian participants.
  mitigation_strategy: The IRB protocol describes potential Spanish consent translation and native Spanish-speaking
    research staff if recruitment goals for Hispanic participants are not met.
- id: https://fairhub.io/datasets/2#bias-recruitment-black-men
  name: Under-recruitment risk
  bias_type: sampling_bias
  bias_description: The protocol notes that recruiting Black men into studies is more difficult than recruiting
    other populations while this population bears a disproportionate T2DM burden.
  mitigation_strategy: Implement new recruitment strategies if race/ethnicity balancing becomes a challenge.
known_limitations:
- id: https://fairhub.io/datasets/2#limitation-biorepository
  name: Finite biospecimen availability
  limitation_type: scope_limitation
  limitation_description: The protocol identifies a finite number of biorepository samples to share with
    scientists.
  scope_impact: Ancillary biospecimen studies may require review and prioritization.
  recommended_mitigation: Develop procedures for reviewing and prioritizing written requests before the
    biorepository is complete.
- id: https://fairhub.io/datasets/2#limitation-ongoing
  name: Ongoing enrollment and release timing
  limitation_type: temporal_limitation
  limitation_description: Enrollment and annual releases are ongoing; early releases may not reflect the
    final balanced design.
  scope_impact: Users should interpret pilot and interim releases with enrollment status in mind.
  recommended_mitigation: Consult versioned documentation and release dates.
- id: https://fairhub.io/datasets/2#limitation-generalizability
  name: Cross-sectional volunteer cohort
  limitation_type: representativeness_limitation
  limitation_description: The main study is cross-sectional and volunteer-based at three U.S. health-system
    sites.
  scope_impact: Generalizability may be limited for groups outside the recruitment frame or people who
    do not participate.
  recommended_mitigation: Use source-provided cohort variables and limitations when designing analyses.
- id: https://fairhub.io/datasets/2#limitation-biorepository-processing
  name: PBMC processing time variable
  limitation_type: methodological_limitation
  limitation_description: Centralized processing of CPT tubes at UAB introduces an additional time variable
    for PBMC isolation and cryopreservation from UW and UCSD participants.
  scope_impact: PBMC-derived downstream measures may need to account for processing logistics.
  recommended_mitigation: Use standardized handling documentation and processing metadata.
confidential_elements:
- id: https://fairhub.io/datasets/2#confidential-phi
  name: Protected health information
  confidential_elements_present: true
  confidentiality_details:
  - PHI is used for screening, recruitment, and study data collection through EHR review and direct collection
    from subjects.
  - The public dataset is deidentified and stripped of PHI by the Safe Harbor method.
- id: https://fairhub.io/datasets/2#confidential-identifiers
  name: Direct and indirect identifiers
  confidential_elements_present: true
  confidentiality_details:
  - Source IRB materials list name, MRN, DOB, age, sex, race/ethnicity, address, phone number, driver
    license number, email, subject codes, and contact information as collected or stored for study purposes.
content_warnings:
- id: https://fairhub.io/datasets/2#warning-health
  name: Health and sensitive clinical content
  content_warnings_present: true
  warnings:
  - The dataset concerns diabetes, clinical laboratory results, eye health, cognitive testing, mental
    health survey items, substance use questions, social determinants of health, EHR data, driving/accident
    records, and genomic data in controlled access.
subpopulations:
- id: https://fairhub.io/datasets/2#subpop-race-ethnicity
  name: Race and ethnicity balancing groups
  subpopulation_elements_present: true
  identification:
  - Asian, Black, White, and Hispanic groups are targeted in approximately equal proportions.
  distribution:
  - The design is triple-balanced across race/ethnicity, T2DM severity, and biological sex, though site-specific
    prevalence affects recruitment.
- id: https://fairhub.io/datasets/2#subpop-diabetes-severity
  name: T2DM severity groups
  subpopulation_elements_present: true
  identification:
  - No diabetes, pre-diabetes/lifestyle-controlled diabetes, diabetes treated with oral medications or
    non-insulin injections, and insulin-controlled diabetes.
  distribution:
  - The study population is designed to be balanced across these four diabetes severity categories.
- id: https://fairhub.io/datasets/2#subpop-sex
  name: Biological sex groups
  subpopulation_elements_present: true
  identification:
  - Male and female biological sex categories are used in the protocol balancing scheme.
  distribution:
  - Biological sex is part of the triple-balanced recruitment design.
sensitive_elements:
- id: https://fairhub.io/datasets/2#sensitive-controlled
  name: Controlled-access variables
  sensitive_elements_present: true
  sensitivity_details:
  - Controlled-access data include 5-digit ZIP code, sex, race, ethnicity, genetic sequencing data, past
    health records, medications, and traffic and accident reports.
- id: https://fairhub.io/datasets/2#sensitive-genomic
  name: Genomic data and biospecimens
  sensitive_elements_present: true
  sensitivity_details:
  - The IRB source states the research will generate genomic data and includes stored biospecimens for
    future studies.
acquisition_methods:
- id: https://fairhub.io/datasets/2#acq-direct-derived
  name: Direct, reported, EHR-derived, and device-derived acquisition
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - Data are obtained from subjects, devices, specimens, medical records, and Department of Licensing
    driving/accident records.
  - T2DM and pre-diabetes are identified by screening EHRs for ICD-10 codes R73.09 and E11.X.
collection_mechanisms:
- id: https://fairhub.io/datasets/2#collection-protocol
  name: Single-visit and at-home protocol
  mechanism_details:
  - Participants complete questionnaires, a 3-4 hour on-site visit, and 10 days of at-home CGM, fitness
    tracker, and environmental sensor monitoring.
  - The BMJ protocol describes a single visit lasting 2.5 to 4 hours, with questionnaires completed online
    or in person.
- id: https://fairhub.io/datasets/2#collection-recruitment
  name: Recruitment through EHR-based waves
  mechanism_details:
  - Recruitment pools are identified from EHR searches at UAB, UCSD, and UW and invited by mail, email,
    REDCap links, access codes, QR codes, and follow-up calls.
- id: https://fairhub.io/datasets/2#collection-upload
  name: FAIRhub upload and quality control
  mechanism_details:
  - Data managers at each site are responsible for quality control before uploading to FAIRhub at regular
    intervals.
collection_timeframes:
- id: https://fairhub.io/datasets/2#time-project
  name: NIH award project period
  start_date: '2022-09-01'
  end_date: '2025-08-31'
  timeframe_details:
  - NIH RePORTER lists project start 2022-09-01 and project end 2025-08-31.
- id: https://fairhub.io/datasets/2#time-enrollment
  name: Participant enrollment period
  start_date: '2023-07-18'
  end_date: '2026-11-30'
  timeframe_details:
  - Enrollment began 18 July 2023 and is planned to continue until 30 November 2026.
- id: https://fairhub.io/datasets/2#time-formal-collection
  name: Formal data collection start
  start_date: '2023-12-01'
  timeframe_details:
  - Preliminary pilot enrollment occurred from 18 July 2023 to 30 November 2023; formal data collection
    began on 1 December 2023.
- id: https://fairhub.io/datasets/2#time-releases
  name: Dataset release dates
  timeframe_details:
  - Version 1.0.0 was released May 3, 2024; version 2.0.0 on November 8, 2024; version 3.0.0 on November
    17, 2025.
data_collectors:
- id: https://fairhub.io/datasets/2#collector-site-staff
  name: Site research staff
  role: clinical research coordinators and study staff
  collector_details:
  - Research coordinators contact and consent participants, conduct visits, collect ophthalmologic images,
    train participants on CGM and fitness trackers, and ensure return of study materials.
- id: https://fairhub.io/datasets/2#collector-data-manager
  name: Data managers
  role: data manager
  collector_details:
  - Data managers oversee quality control at each site before upload to FAIRhub.
  - Database managers ingest data into REDCap and extract for processing.
- id: https://fairhub.io/datasets/2#collector-lab
  name: Phlebotomists and lab assistants
  role: biospecimen collection and processing
  collector_details:
  - Phlebotomists collect blood from participants; lab assistants process and ship samples.
- id: https://fairhub.io/datasets/2#collector-engineering
  name: Software and cloud engineers
  role: data curation infrastructure
  collector_details:
  - Software engineers design, implement, and test data curation pipelines; cloud engineers configure
    and manage cloud infrastructure and services.
missing_data_documentation:
- id: https://fairhub.io/datasets/2#missing-release-balance
  name: Interim release completeness
  missing_data_patterns:
  - Pilot and periodic releases may not yet achieve balanced distribution across groups because enrollment
    is ongoing.
  missing_data_causes:
  - Ongoing recruitment and release cadence.
  handling_strategy: Consult versioned documentation and interpret each release in context of enrollment
    status.
- id: https://fairhub.io/datasets/2#missing-followup-budget
  name: Year 4 follow-up collection
  missing_data_patterns:
  - For the planned 10% Year 4 follow-up, no new variables will be added, but not all variables may be
    collected due to budget constraints.
  missing_data_causes:
  - Budget constraints for follow-up visit data collection.
  handling_strategy: Use release documentation to determine which follow-up variables are present.
