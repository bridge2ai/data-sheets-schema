name: ai-readi-flagship-type-2-diabetes-dataset
description: AI-READI is a Bridge2AI data generation project and dataset for type 2 diabetes mellitus.
  The dataset consists of data collected from individuals with and without T2DM and harmonized across
  three data collection sites. It is designed for future AI and machine learning studies of pathogenesis
  and salutogenesis in T2DM, with a cross-sectional target enrollment of 4,000 people aged 40 and older,
  balanced by race/ethnicity, T2DM severity, and biological sex.
