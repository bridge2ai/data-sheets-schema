purposes:
- id: https://fairhub.io/datasets/2#purpose-ai-ml
  name: AI/ML-ready T2DM dataset
  response: Collect and publicly share a multimodal, AI-ready dataset for studying pathogenesis and salutogenesis
    of type 2 diabetes mellitus.
- id: https://fairhub.io/datasets/2#purpose-salutogenesis
  name: T2DM salutogenesis
  response: Support research on pathways from disease to health and health resilience in T2DM.
- id: https://fairhub.io/datasets/2#purpose-standards
  name: Reusable data-generation blueprint
  response: Establish standards, best practices, and guidelines for collection, preparation, documentation,
    and sharing of AI-ready biomedical datasets.
- id: https://fairhub.io/datasets/2#purpose-workforce
  name: AI workforce development
  response: Increase access to and quality of AI/ML research by recruiting and training personnel at the
    intersection of biomedicine and AI.
tasks:
- id: https://fairhub.io/datasets/2#task-trajectory
  name: Disease trajectory modeling
  response: Enable downstream pseudotime manifold analysis and other AI/ML approaches to infer T2DM trajectories
    from participants with differing disease severity.
- id: https://fairhub.io/datasets/2#task-multimodal
  name: Multimodal model development
  response: Support AI model development across survey, clinical, retinal imaging, ECG, CGM, physical
    activity, environmental, biospecimen, laboratory, cognitive, and EHR-derived domains.
- id: https://fairhub.io/datasets/2#task-fairification
  name: FAIR data preparation
  response: Demonstrate methods for making diverse clinical research data findable, accessible, interoperable,
    reusable, and AI-ready.
addressing_gaps:
- id: https://fairhub.io/datasets/2#gap-diverse-ai-ready
  name: Lack of diverse AI-ready T2DM data
  response: 'The sources identify a major barrier: lack of large, diverse, well-characterized, AI-ready
    datasets for T2DM and complex multi-organ disease research.'
- id: https://fairhub.io/datasets/2#gap-underrepresentation
  name: Under-representation in diabetes research
  response: The cohort is intentionally balanced by race/ethnicity, sex, and diabetes severity to address
    limitations of previous epidemiological studies and clinical trials on T2DM.
- id: https://fairhub.io/datasets/2#gap-documentation
  name: Reusable clinical data documentation
  response: The project develops and evaluates documentation approaches such as datasheets and healthsheets
    so AI developers can understand provenance, intended use, and maintenance.
