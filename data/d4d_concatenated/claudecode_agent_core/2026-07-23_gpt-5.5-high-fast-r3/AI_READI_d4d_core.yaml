sampling_strategies:
- id: https://fairhub.io/datasets/2#sampling-balanced
  name: Triple-balanced stratified sampling
  is_sample: true
  is_random: false
  source_data:
  - Electronic health records from UAB, UCSD, and UW health systems from 2020 to 2025.
  is_representative: false
  why_not_representative:
  - The protocol intentionally does not target the demographic distribution of the U.S. population; it
    targets balance across selected race/ethnicity, T2DM severity, and biological sex groups.
  strategies:
  - Recruit in waves using stratified samples based on race/ethnicity, sex, diabetes severity, and site.
  - Monitor recruitment diversity and adjust by under- and oversampling as needed.
raw_sources:
- id: https://fairhub.io/datasets/2#raw-data-fairhub
  name: Raw and transformed data before FAIRhub release
  access_url: https://fairhub.io/datasets/2
  raw_data_details:
  - Images are exported from devices in raw format and some require conversion to DICOM before upload.
  - ECG is exported as XML; MoCA scores and laboratory results are provided in CSV; wearable and environmental
    sensor data are exported or transformed before release.
preprocessing_strategies:
- id: https://fairhub.io/datasets/2#preprocess-ai-ready
  name: AI-ready harmonization
  preprocessing_details:
  - All data are stored and shared through FAIRhub as AI-ready, enabling immediate AI/ML research without
    reformatting and preprocessing.
  - The dataset is harmonized across three data collection sites and mapped to applicable standard formats.
- id: https://fairhub.io/datasets/2#preprocess-standards
  name: Standards mapping
  preprocessing_details:
  - Clinical data are mapped to OMOP Common Data Model where applicable; retinal imaging uses DICOM; some
    proprietary device data are transformed to standard model formats before FAIRhub upload.
