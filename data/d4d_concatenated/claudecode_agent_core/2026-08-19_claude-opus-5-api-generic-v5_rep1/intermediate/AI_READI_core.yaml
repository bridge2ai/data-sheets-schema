future_use_impacts:
  - impact_details: >-
      To the extent of the creators' knowledge, no uses of the dataset are currently anticipated
      that could result in unfair treatment or harm. However, there is a theoretical risk of
      future re-identification: AI algorithms can infer individual patient characteristics and
      could facilitate individual-level identification.
  - impact_details: >-
      To prevent re-identification attempts, the project implements a robust data dissemination
      system, a strict license agreement, and data watermarking for both the public and
      controlled sets.
  - impact_details: >-
      The public set is stripped of Protected Health Information as defined by the HIPAA Privacy
      Rule via the Safe Harbor method, as well as information related to the sex and
      race/ethnicity of participants, to prevent stigmatization of findings.

instances:
  - instance_type: Individual patient/participant
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is associated with each data instance. No specific labeling was
      performed, as the dataset is hypothesis-agnostic and aimed at facilitating multiple
      potential downstream AI/ML applications.
    notes: >-
      Each instance consists of all of the data available for an individual participating in the
      study, spanning survey data, clinical data, retinal imaging data, environmental sensor data,
      continuous glucose monitor data, and wearable activity monitor data — encompassing tabular
      data, imaging data, and physiological signal/waveform data. There is no unstructured text
      data in this dataset. There is currently only one visit per participant, and all instances
      are part of the same prospective data generation project. Not all modalities are available
      for all participants: some participants elected not to participate in some study elements;
      in a few cases the data collection device had no stored results or was returned too late to
      retrieve the results (for example the battery died or data was lost); and in a few cases a
      data collision may have occurred at some point in the process and data has been lost.

subpopulations:
  - subpopulation_elements_present: true
    identification: >-
      Self-reported race/ethnicity (Hispanic, Asian, Black, White), sex (male, female), and
      diabetes status group (no diabetes; pre-diabetes/lifestyle controlled; oral or non-insulin
      injectable medication controlled; insulin controlled). Sex, race and ethnicity are not
      released with the public version of the dataset and are held under controlled access;
      subpopulation counts are published in aggregate in the dataset README split table.
    distribution: >-
      Across all 2280 participants: race/ethnicity — Hispanic 380, Asian 545, Black 519, White
      836. Sex — male 951, female 1329. Diabetes status — no diabetes 776, lifestyle 560, oral
      686, insulin 258. Mean age 60.8 years (SD 11.3).
    notes: >-
      The healthsheet question on whether the dataset identifies demographic sub-populations is
      answered "No" for the public release, because sex, race and ethnicity are withheld; the
      aggregate distribution above is drawn from the README recommended-split table.

