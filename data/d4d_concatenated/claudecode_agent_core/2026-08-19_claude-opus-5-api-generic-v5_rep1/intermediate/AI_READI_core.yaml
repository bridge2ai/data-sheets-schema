id: https://doi.org/10.60775/fairhub.3
name: AI-READI_Flagship_Dataset_Type2_Diabetes_v3
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, AI-ready dataset collected from individuals with and without Type 2 Diabetes
  Mellitus (T2DM) and harmonized across three data collection sites (University of Alabama at
  Birmingham, University of California San Diego, and University of Washington). Version 3.0.0
  contains data from 2280 participants collected between July 19, 2023 and May 1, 2025. The
  composition of the dataset was designed with future AI/Machine Learning studies in mind,
  including recruitment sampling procedures aimed at achieving approximately equal distribution
  of participants across diabetes severity, and a data acquisition protocol spanning multiple
  domains — survey data, physical measurements, clinical data, imaging data, and wearable device
  data — to enable downstream AI/ML analyses that may not be feasible with existing data sources
  such as claims or electronic health records data. The overarching goal is to better understand
  salutogenesis (the pathway from disease to health) in T2DM. The public dataset includes survey
  data, blood and urine lab results, fitness activity levels, clinical measurements (for example
  monofilament and cognitive function testing), retinal images, ECG, blood sugar levels, and
  environmental variables such as home air quality. Data held under controlled access include
  5-digit zip code, sex, race, ethnicity, genetic sequencing data, past health records,
  medications, and traffic and accident reports. The public version contains no protected health
  information (PHI); information related to sex, race/ethnicity, and medications used has been
  removed.
