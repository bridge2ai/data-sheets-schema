purposes:
  - response: >-
      To enable future generations of artificial intelligence/machine learning research to provide
      critical insights into type 2 diabetes mellitus, including salutogenic pathways to return to
      health.
  - response: >-
      To create a flagship, ethically sourced, publicly available multimodal dataset that is
      AI-ready, so that AI/ML research can proceed without additional reformatting and
      preprocessing.
  - response: >-
      To develop a foundational dataset in T2DM, agnostic to existing classification criteria or
      biases, which can be used to reconstruct a temporal atlas of T2DM development and reversal
      towards health (salutogenesis).
  - response: >-
      To establish and share a blueprint — standards, best practices and guidelines — for the
      collection, preparation and sharing of AI-ready biomedical datasets that future data
      generation projects can follow.
  - response: >-
      To design the data collection specifically to permit downstream pseudotime manifold
      analysis, an approach used to predict disease trajectories by learning from complex,
      multimodal data from participants with differing disease severity, from normal to
      insulin-dependent T2DM.

addressing_gaps:
  - response: >-
      A major barrier to AI in healthcare research has been the lack of diverse datasets that are
      AI ready for training AI models. The AI-READI dataset is intended to fill this gap.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as
      T2DM has been limited by a lack of well-designed, high quality, large, and inclusive
      multimodal datasets.
  - response: >-
      A meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that
      samples lacked racial and ethnic diversity. AI-READI addresses these demographic inequities
      by intentionally recruiting balanced numbers across four self-reported race/ethnicity
      groups.
  - response: >-
      Existing data sources such as claims or electronic health records data do not support the
      downstream AI/ML analyses that the multi-domain acquisition protocol enables.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis to predict disease trajectories from complex,
      multimodal data across differing disease severity.
  - response: >-
      Development of AI/ML models for understanding salutogenesis (the pathway from disease to
      health) in type 2 diabetes mellitus.
  - response: >-
      Multimodal model development to improve understanding of the complex, multifactorial nature
      of T2DM.
  - response: >-
      Reconstruction of a temporal atlas of T2DM development and reversal towards health.

intended_uses:
  - use_category: AI/ML research on type 2 diabetes
    usage_notes: >-
      The public version of the dataset can only be used for type 2 diabetes related research;
      accessing the dataset requires agreeing to use the data only for T2DM-related research. A
      private (controlled access) version will allow for more generic use.
  - use_category: Commercial and non-commercial research
    usage_notes: >-
      The license grants a non-exclusive, non-transferable license to download, reproduce and use
      the Data, and to create derivative works, for research, commercial and non-commercial
      purposes, subject to the sharing, storage and usage limitations in the agreement.
  - use_category: Development and distribution of Licensee Models
    usage_notes: >-
      Licensees may make, reproduce and distribute models, algorithms and programs developed,
      trained or adapted using the Data, provided those models do not themselves contain the Data
      or any modified version of it, and provided reasonable efforts are undertaken to minimize
      the likelihood that Data can be memorized, derived, reconstructed or reconstituted from
      them.
  - use_category: Blueprint and methodological reference for future data-generating projects
    usage_notes: >-
      The project publishes guidelines for project management, data collection, management and
      sharing so that future NIH Bridge2AI Data Generation Projects can follow them.

other_tasks:
  - task_details: >-
      The dataset is hypothesis agnostic and multimodal with over 10 variable domains, so it may
      support analyses beyond the salutogenesis focus — for example across cardiac, ophthalmic,
      cognitive, physical activity, environmental exposure and metabolic domains.
  - task_details: >-
      Biobanked specimens at UAB CCTS are intended to support future ancillary studies, including
      whole genome sequencing, genomic applications, proteomics and metabolomics, RNA isolation
      and gene expression, and immunological studies including generation of induced pluripotent
      stem cells.

discouraged_uses:
  - discouragement_details: >-
      The AI-READI dataset license imposes restrictions on the usage of the data; discouraged and
      restricted uses are described in the license file available at
      https://doi.org/10.5281/zenodo.17555036.
  - discouragement_details: >-
      Clinical treatment decisions must not be based on the Data, as it is intended solely as a
      research resource.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the Data is prohibited; the Data is intended
      solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the Data, alone or with other information, to compromise or
      infringe the confidentiality of information about a Data Subject, to invade or compromise
      their privacy, to attempt to identify or contact any Data Subject or group of Data Subjects,
      to extract or extrapolate identifying information, to establish a Data Subject's membership
      in a particular group, or otherwise to cause harm or injury to any Data Subject.
  - prohibition_reason: >-
      Sharing or distributing Data with any third party model vendor or developer for training or
      development purposes — including model weight modification and other adjustments to a
      model's logic or operation — is prohibited, even where that vendor is party to a HIPAA
      Business Associate Agreement with the licensee's institution.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or otherwise
      conveying any portion of the Data or any derivative work to any third party is prohibited,
      other than to another licensee bound by an identical agreement with the Licensor and only
      for the purpose of collaborating on projects involving the Data.
  - prohibition_reason: >-
      Reproducing Data in papers, articles, presentations, analyses, reports or publications
      beyond small representative samples in up to five images or figures per paper is
      prohibited; larger amounts must not be published, posted or made available via supplemental
      files, zip archives, code packages or other means.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking applied to the Data for
      security purposes is prohibited.
  - prohibition_reason: >-
      Storing the Data anywhere other than servers and devices maintained by and located within
      the licensee's institution, or on cloud/remote storage and backup services that have a
      HIPAA-approved Business Associate Agreement in place with that institution, is prohibited.

