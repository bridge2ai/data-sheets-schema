maintainers:
  - maintainer_details: >-
      The AI-READI team supports and maintains the dataset. The dataset is hosted on FAIRhub
      through Microsoft Azure. Contact information is provided in the README file included with
      the dataset and at https://aireadi.org/contact and https://docs.aireadi.org/docs/3/contact.
      The study_description.json and dataset_description.json metadata files included in the
      dataset provide additional information about the contact person/entity, authors, and
      contributors.
    role: academic_institution
  - maintainer_details: >-
      FAIRhub is the publisher and hosting platform, developed by the FAIR Data Innovations Hub at
      the California Medical Innovations Institute as part of this project. The platform is a
      cloud-based data management, curation and sharing platform intended to be made available for
      future Data Generation Projects after testing with the AI-READI dataset.
    role: other

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset is released as static versions and is not updated in place. New versions of the
    dataset will be released approximately once a year with additional data from participants who
    have been enrolled since the last version release. Enrollment is ongoing, so future versions
    will include larger numbers of participants. Changes between versions are documented in detail
    in the CHANGELOG file included in the dataset and visible at docs.aireadi.org. Version 3.0.0
    added 1213 participants over version 2.0.0 and three additional imaging devices; processing
    moved from custom/ad hoc in v1.0.0 to automated plus custom.

version_access:
  versions_available:
    - >-
      Version 3.0.0 (DOI 10.60775/fairhub.3, 17 November 2025, 2280 participants, 356,343 files,
      3.82 TB); version 2.0.0 (DOI 10.60775/fairhub.2, 8 November 2024, 1067 participants, 165,051
      files, 2.01 TB); version 1.0.0 (DOI 10.60775/fairhub.1, 3 May 2024, 204 participants). Each
      version is accessible through FAIRhub and has its own DOI. There is one version of the
      documentation associated with each version of the dataset, navigable from a dropdown at
      docs.aireadi.org.
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  version_details: >-
    Versions 1.0.0 and 2.0.0 are marked on FAIRhub as no longer accessible, with users referred to
    the latest version. Documentation for superseded versions remains published: version 1
    healthsheet at https://docs.aireadi.org/docs/1/dataset/healthsheet, version 2 healthsheet at
    https://docs.aireadi.org/docs/2/dataset/healthsheet. The FAIRhub landing pages for versions 2
    and 3 both state that the repository is under review for potential modification in compliance
    with Administration directives.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances. Participants
    were not told that their data would be retained for a fixed period of time and then deleted.
    Raw data are saved and expected to be preserved by the AI-READI project at least for the
    duration of the project.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside
    of those who are involved in the project. Feedback, questions and suggestions related to the
    dataset can be submitted at https://aireadi.org/contact.
  contribution_url: https://aireadi.org/contact

errata:
  - erratum_details: >-
      No erratum exists. Changes between versions of the dataset are documented in the CHANGELOG
      file included in the dataset and visible at docs.aireadi.org, where the changelog for
      version 3.0.0 records that the Snellen visual acuity variables were dropped so that only
      logMAR visual acuity measurements are available.