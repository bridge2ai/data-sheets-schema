    releases and required for attribution.'
- id: d4d:CM4AI/existing-use/codefest
  name: CM4AI CodeFest training use
  examples:
  - Initial datasets, tools, and standards from all three mapping platforms were made available at the
    CM4AI CodeFest in March 2024, accompanied by detailed tutorials explaining how the data were derived
    and integrated and providing production-ready software for producing the datasets. The inaugural virtual
    CodeFest provided training to 38 registrants.
- id: d4d:CM4AI/existing-use/visible-neural-networks
  name: Visible machine learning on cell maps
  examples:
  - The CM4AI preprint states that cell maps have been used in AI tools for "visible machine learning"
    or "visible neural networks" (VNNs) to interrogate how protein assemblies in the cell affect cell-level
    phenotype predictions, and that cell maps provide a foundation for downstream applications in human
    genomics including interpretation of genetic variants and mutations.
use_repository:
- id: d4d:CM4AI/use-repository/cm4ai-portal
  name: CM4AI publications and products portal
  repository_url: https://cm4ai.org/
  repository_details:
  - The CM4AI web portal hosts sections for Products, Data Releases, Tools, Product Documentation, Publications,
    and Learning, and invites visitors to "Check out our recent publications to learn more about how CM4AI
    is addressing the Bridge2AI's Functional Genomics grand challenge". No systematic registry of third-party
    papers using the data is described in the captured pages.
other_tasks:
- id: d4d:CM4AI/other-task/downstream
  name: Additional tasks supported by the data
  task_details:
  - Interpretation of genetic variants and mutations in human genomics using cell maps as a structural
    prior.
  - Development of visible neural networks that expose how protein assemblies affect cell-level phenotype
    predictions.
  - Investigation of cell architectural changes and interactions in the presence of specific disease processes,
    treatment conditions, or genetic perturbations, including differential analysis between untreated,
    paclitaxel-treated, and vorinostat-treated MDA-MB-468 cells and between undifferentiated and differentiated
    KOLF2.1J derivatives.
  - Selection of protein assemblies as targets for integrative three-dimensional structure modelling,
    a feasibility direction described in the CM4AI preprint using the Integrative Modeling Platform.
  - Training and educational use in biomedical AI/ML workforce development, including CodeFest events
    and the internship co-hosted at Yale University and the University of California San Diego.
future_use_impacts:
- id: d4d:CM4AI/future-use-impact/interim-status
  name: Impacts of the interim, evolving release status on future use
  impact_details:
  - Releases are quarterly snapshots that are augmented through the end of the project in November 2026;
    content, file names, packaging, and checksums change between releases, so analyses should pin a specific
    release DOI and Dataverse version.
  - Computed cell maps, the project's headline deliverable, will be added in future releases; analyses
    built only on the current input data streams may need revision when the maps are published.
  - Both cm4ai.org and the CM4AI Dataverse collection carry a notice that the repository or collection
    is under review for potential modification in compliance with Administration directives, so continued
    availability in the present form is not guaranteed by the captured documentation.
  - Because the released data derive from two cell lines, models trained on them may not transfer to other
    cell types, genetic backgrounds, or clinical populations.
