purposes:
- id: d4d:CM4AI/purpose/interpretable-genotype-phenotype-learning
  name: Interpretable genotype-phenotype learning
  response: As part of the NIH Common Fund's Bridge2AI program, the CM4AI data generation project seeks
    to map the spatiotemporal architecture of human cells and use these maps toward the grand challenge
    of interpretable genotype-phenotype learning. In genomics and precision medicine, machine learning
    models are often "black boxes," predicting phenotypes from genotypes without understanding the mechanisms
    by which such translation occurs. The project generates a resource of matched data and tools to enable
    the creation of "visible" machine learning systems, which are not black boxes but are built directly
    on knowledge maps of cell and tissue architecture.
- id: d4d:CM4AI/purpose/ethical-ai-ready-data
  name: Production of ethical, FAIR, AI-ready biomedical data
  response: CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture,
    inferred from multimodal data collected for human cell lines, to enable transformative biomedical
    AI research. CM4AI defines AI-ready biomedical data as fully characterized FAIR data of known provenance,
    which can be ethically and reliably processed by AI applications; whose models and software are available
    and well-described for validation and re-use; and whose predictions may be fully explained and interpreted
    to the user as needed. The declared AI-readiness criteria are FAIR, Provenanced, Characterized, Explainable,
    and Ethical, and are described as interdependent.
- id: d4d:CM4AI/purpose/reference-cell-architecture
  name: Reference maps of human cell architecture
  response: CM4AI aims to deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data, together with quarterly data releases of map-input data streams. Cell maps are hierarchical
    directed acyclic graphs in which each node represents an assembly of proteins in proximity at a given
    scale, spanning from large assemblies representing cell compartments (for example nucleus, mitochondria)
    to small assemblies of proteins in close proximity (for example protein complexes or subunits).
tasks:
- id: d4d:CM4AI/task/protein-interaction-mapping
  name: Protein-protein interaction mapping
  response: 'Map protein-protein interactions of chromatin regulators under different conditions using
    two orthogonal mass-spectrometry approaches: AP-MS on endogenously tagged cell lines, and size-exclusion
    chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping.'
- id: d4d:CM4AI/task/spatial-proteomics-mapping
  name: Spatial proteomics mapping
  response: Map the spatial subcellular organization of chromatin modifiers, their interactors, and key
    signaling molecules using the Human Protein Atlas resource of antibodies with immunofluorescence staining
    and high-resolution confocal microscopy.
- id: d4d:CM4AI/task/genetic-perturbation-mapping
  name: Genetic perturbation mapping
  response: Perform single-cell CRISPR screens perturbing chromatin regulators in MDA-MB-468 cells under
    three conditions (no treatment, paclitaxel, or vorinostat) and in KOLF2.1J iPSCs, and an expressed
    genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J iPSCs mapping transcriptional
    and fitness phenotypes associated with 11,739 targeted genes.
- id: d4d:CM4AI/task/multimodal-integration
  name: Multimodal data integration into cell maps
  response: Integrate the input data streams via the Multi-Scale Integrated Cell (MuSIC) software pipeline,
    which employs deep learning models and community detection algorithms, to produce hierarchies of protein
    assemblies. Computed cell maps are not included in the current release and are stated to be added
    in future releases.
- id: d4d:CM4AI/task/ai-readiness-packaging
  name: AI-readiness packaging and provenance
  response: Package data, software, metadata, and provenance graphs into RO-Crates using the FAIRSCAPE
    framework, register them on a FAIRSCAPE server that assigns persistent, resolvable, globally unique
    identifiers (currently the ARK scheme, with DOIs a future feature), and compute end-to-end provenance
    entailments expressed in the EVI Evidence Graph Ontology.
addressing_gaps:
- id: d4d:CM4AI/gap/black-box-models
  name: Uninterpretable genotype-phenotype models
  response: Machine learning models show great promise in analyzing the human genome to make predictions,
    but the inner workings of these models are typically difficult-to-interpret "black boxes." CM4AI addresses
    this by generating matched data and tools that enable "visible" machine learning systems built directly
    on knowledge maps of cell and tissue architecture.
- id: d4d:CM4AI/gap/uncharted-cell-architecture
  name: Incomplete knowledge of subcellular organization
  response: Human cells are organized across a spatial hierarchy of components, much of which remains
    uncharted. Cell mapping technologies have typically been applied separately; integrating multiple
    complementary data modalities provides the opportunity to incorporate biological structure robustly
    across physical scales.
- id: d4d:CM4AI/gap/ai-ready-data-standards
  name: Lack of ethical, provenanced, AI-ready biomedical datasets
  response: Significant requirements are placed on datasets used to train and analyse AI/ML models, but
    few biomedical datasets meet them. CM4AI establishes FAIR AI-readiness metadata and validation toolkits,
    machine-readable provenance graphs resolvable as metadata for all results, and JSON-Schema mini-data-dictionary
    descriptions with mapping of data elements to public ontology vocabularies.
- id: d4d:CM4AI/gap/workforce
  name: Gaps in the biomedical AI/ML workforce
  response: The Skills and Workforce Development module identified gaps in training of the functional
    genomics and biomedical AI/ML workforce and works to recruit and train a diverse group of participants
    in the scientific approach, data standards, and tools of CM4AI, including asynchronous virtual training,
    hosted virtual events, a CodeFest, and an in-person internship co-hosted at Yale University and the
    University of California San Diego.
