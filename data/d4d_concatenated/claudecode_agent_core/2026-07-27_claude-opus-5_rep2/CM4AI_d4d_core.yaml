data_protection_impacts:
- id: d4d:CM4AI/data-protection/assessment
  name: Data protection assessment
  impact_details:
  - 'The Dataverse Data Governance & Ethics block records Human Subjects: No, De-identified Samples: Yes,
    and FDA Regulated: No for the June 2025, October 2025, and June 2026 releases.'
  - The CM4AI preprint states that CM4AI data are non-clinical (from tissue cultures) and are considered
