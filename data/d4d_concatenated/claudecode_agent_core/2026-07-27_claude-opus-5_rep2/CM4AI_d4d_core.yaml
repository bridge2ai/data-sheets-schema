regulatory_restrictions:
  id: d4d:CM4AI/regulatory/status
  name: Regulatory and compliance status
  hipaa_compliant: not_applicable
  confidentiality_level: unrestricted
  regulatory_restrictions:
  - 'The Dataverse Data Governance & Ethics block records FDA Regulated: No.'
  - Both cm4ai.org and the CM4AI Dataverse collection display a notice that the repository or collection
    is under review for potential modification in compliance with Administration directives.
  - All files in the captured release file tables carry Public file access; no access request, embargo,
    or retention period applies to the deposited files, although some externally linked datasets are marked
    "Embargoed".
  other_compliance:
  - 'HIPAA is recorded here as not applicable because the Dataverse governance block records Human Subjects:
    No and De-identified Samples: Yes, and the CM4AI preprint describes the data as non-clinical and de-identified.
    The captured documents make no HIPAA assertion of their own.'
  - FAIRness is stated to be an NIH requirement, and CM4AI states that its datasets and the software used
    to prepare them comply with the FAIR Principles for data and for software.
  - Data are deposited in LibraData, the University of Virginia's instance of Dataverse, described as
    an NIH-approved generalist repository.
  - Access to Bridge2AI data, including CM4AI datasets, through the Bridge2AI Open House requires prior
    attestation to the Bridge2AI Code of Conduct.
  - The Data Governance Committee contact named in the Data Governance & Ethics block of the June 2025,
    October 2025, and June 2026 Dataverse releases is Jillian Parker (jillianparker@health.ucsd.edu),
    listed in the release author metadata as Parker J, University of California, San Diego, ORCID https://orcid.org/0000-0003-4535-3486.
  governance_committee_contact: https://orcid.org/0000-0003-4535-3486
is_deidentified:
  id: d4d:CM4AI/deidentification/cell-lines
  name: De-identification status
  identifiable_elements_present: false
  method: Use of commercially available, already de-identified human cell lines rather than collection
    of identifiable human-subject data.
  deidentification_details:
  - 'The Dataverse Data Governance & Ethics block records De-identified Samples: Yes and Human Subjects:
    No.'
  - The CM4AI preprint states that CM4AI data are distinctive within Bridge2AI in that they are non-clinical
    (from tissue cultures) and are considered to be de-identified as they cannot be matched, with current
    knowledge, to a human subject.
  - The Dataverse bias statement records that data in the release were derived from commercially available
    de-identified human cell lines.
