updates:
  id: d4d:CM4AI/updates/quarterly
  name: CM4AI update plan
  frequency: quarterly
  update_details:
  - The Dataverse maintenance plan states that the dataset will be regularly updated and augmented through
    the end of the project in November 2026, with updates on a quarterly basis.
  - The cm4ai.org Data Releases FAQ states that CM4AI releases data quarterly, ensuring continuous updates
    to the cell maps and input data streams.
  - The March 2025 release description states that data presented there will be augmented regularly through
    the end of the project.
  - Predicted cell maps are stated to be added in future releases.
  - NIH RePORTER records a project end date of 2026-08-31, which does not match the November 2026 project
    end stated in the Dataverse maintenance plan.
retention_limit:
