human_subject_research:
  id: d4d:CM4AI/human-subject-research/none
  name: Human subject research status
  involves_human_subjects: false
  ethics_review_board:
  - No institutional review board is named. Ethical review contacts recorded in the Dataverse Data Governance
    & Ethics block are Vardit Ravitsky (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon
    (jean-christophe_belisle-pipon@sfu.ca).
