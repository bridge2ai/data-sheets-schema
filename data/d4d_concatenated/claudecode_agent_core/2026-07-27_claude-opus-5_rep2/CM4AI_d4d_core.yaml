sampling_strategies:
- id: d4d:CM4AI/sampling/targeted-panels
  name: Targeted protein panels and genome-scale perturbation screening
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Cultured MDA-MB-468 triple-negative breast cancer cells (RRID:CVCL_0419), untreated or treated with
    paclitaxel or vorinostat
  - Cultured KOLF2.1J induced pluripotent stem cells (RRID:CVCL_B5P3), undifferentiated or differentiated
    into neural progenitor cells, neurons, and cardiomyocytes
  strategies:
  - CM4AI's stated design targets 100 chromatin modifiers and 100 metabolic enzymes involved in cancer,
    neuropsychiatric, and cardiac disorders.
  - Spatial proteomics mapping was completed for 100 chromatin regulators in MDA-MB-468 cells with and
    without paclitaxel or vorinostat, with another 500 proteins pending significant hits from the genetic
    perturbation and PPI results.
  - The CRISPR lentiviral library targets 100 chromatin factors with 6 guide RNAs per gene; the separate
    expressed genome-scale CRISPRi Perturbation Cell Atlas covers 11,739 targeted genes.
  - SEC-MS is applied proteome-wide rather than to a selected panel.
  why_not_representative:
  - The Dataverse bias statement records that the data were derived from commercially available de-identified
    human cell lines and do not represent all biological variants which may be seen in the population
    at large.
  - Protein selection is deliberately targeted at disease-relevant chromatin modifiers and metabolic enzymes
    rather than sampled at random from the proteome.
raw_sources:
- id: d4d:CM4AI/raw/dataverse-landing
  name: CM4AI June 2026 Data Release in the University of Virginia Dataverse
  access_url: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  raw_data_details:
  - The authoritative access point for the current release, from which all 10 public ZIP archives and
    the release metadata can be downloaded. The page states that "The dataset is too large to download.
    Please select the files you need from the files table."
  - Raw instrument data are deposited externally in MassIVE (mass spectrometry) and in the NCBI Sequence
    Read Archive via BioProject (single-cell sequencing), and a CRISPRi Perturbation Atlas of iPSCs is
    linked to Figshare.
preprocessing_strategies:
- id: d4d:CM4AI/preprocessing/music-pipeline
  name: MuSIC data integration pipeline
  preprocessing_details:
  - 'The Multi-Scale Integrated Cell (MuSIC) pipeline proceeds in segments: (a) download PPI networks
    from the Krogan Laboratory''s deposition archive and IF images from the Lundberg Laboratory''s deposition
    archive; (b) generate embeddings, processing PPI networks with the node2vec deep learning model and
    IF images with a Human Protein Atlas deep learning model, each reducing dimensionality; (c) co-embed
    the PPI and image embeddings using contrastive deep learning so that original embeddings can be reconstructed
    with minimal information loss and proteins with similar PPI and image embeddings have similar co-embeddings;
    (d) perform protein community detection over all-by-all similarities in the co-embedding space and
    output the resulting hierarchy of protein communities as the cell map; and (e) evaluate the hierarchy
    by aligning cell maps to known protein function and pathway resources including the Gene Ontology
    and Reactome, and by annotating assemblies with a large language model approach that names sets of
    proteins and assigns a name confidence score.'
  - Each pipeline segment calls the FAIRSCAPE client package to validate inputs and create the output
    RO-Crate package for that segment, which is then dispatched to the FAIRSCAPE server for persistent
    identifier creation and provenance graph entailment computation.
  - Computed cell maps produced by this pipeline are not included in the releases described by this datasheet.
- id: d4d:CM4AI/preprocessing/fairscape-packaging
  name: FAIRSCAPE AI-readiness packaging
  preprocessing_details:
  - AI-readiness features comprise establishing FAIRness including rich metadata and persistent globally
    unique identifiers; computing a machine-readable provenance graph resolvable as metadata for all results,
    including inputs, computations, software, and outputs; and characterizing and validating all datasets
    and data elements, mapping data elements to public ontology vocabularies where appropriate using JSON-Schema
    mini-data-dictionary descriptions resolvable from the provenance graph metadata.
  - The persistent identifier system currently in use is the ARK scheme, with DOIs a planned future feature
    as supplementary identifiers for final-state publishable work. Identifiers resolve to human- and machine-readable
    landing pages with JSON-LD and RDF-XML serializations using vocabularies from Schema.org, EVI, and
    other public ontologies.
- id: d4d:CM4AI/preprocessing/release-revision
  name: June 2025 release revision
  preprocessing_details:
  - The June 2025 release page states that the deposited dataset is a revision of the June 2025 Data Release,
    and that the revision includes adding RGB immunofluorescent images, corrections to RO-Crate metadata,
    and changes to naming conventions. File naming changed accordingly between releases, from cm4ai-v0.6-beta-if-images-{condition}.zip
    in March 2025 to cm4ai_ifimages_MDA-MB-468_{condition}.zip subsequently.
cleaning_strategies:
- id: d4d:CM4AI/cleaning/metadata-corrections
  name: Metadata correction and naming standardisation
  cleaning_details:
  - The June 2025 release incorporates corrections to RO-Crate metadata and changes to naming conventions
    relative to the earlier deposit, and adds RGB immunofluorescent images.
  - Per-dataset data dictionaries and validation procedures are supplied as JSON-Schema descriptions resolvable
    from the provenance graph metadata; the Standards Module established FAIR AI-readiness metadata and
    validation toolkits used to package and release the cell-line perturbation and measurement data.
  - The captured release pages do not document instrument-level quality control thresholds for the deposited
    AP-MS, SEC-MS, IF, or perturb-seq data.
labeling_strategies:
- id: d4d:CM4AI/labeling/assembly-annotation
  name: Protein assembly annotation in the CM4AI cell mapping pipeline
  data_annotation_protocol:
  - 'Cell maps are annotated in a two-pronged approach: first, maps are aligned to known protein function
    and pathway resources including the Gene Ontology and Reactome to determine assemblies with high overlap
    with known cell biology; second, assemblies are annotated using a large language model approach that
    names sets of proteins and assigns a name confidence score.'
  - This annotation applies to computed cell maps, which are not included in the releases described by
    this datasheet.
  labeling_details:
  - The deposited input data streams (AP-MS, SEC-MS, IF images, perturb-seq) are not manually labelled;
    their structured content is the measurement itself plus experimental metadata such as cell line, treatment
    condition, target gene, and antibody target.
machine_annotation_tools:
- id: d4d:CM4AI/machine-annotation/pipeline-models
  name: Machine learning models and tools used in CM4AI data processing and annotation
  tools:
  - node2vec
  - Human Protein Atlas deep learning image model
  - Contrastive multimodal co-embedding model (MuSIC)
  - Community detection over the co-embedding space
  - Large language model assembly naming with confidence scoring
  - FAIRSCAPE-CLI and FAIRSCAPE server
  tool_descriptions:
  - node2vec is applied to downloaded PPI networks to reduce dimensionality, producing a PPI embedding
    that contains information about a protein's interactions.
  - A Human Protein Atlas deep learning model processes IF images to reduce dimensionality, producing
    an image embedding that contains information about protein localization.
  - A contrastive deep learning model integrates the PPI and image embeddings into a per-protein co-embedding
    such that the original embeddings can be reconstructed with minimal information loss and proteins
    with similar inputs have similar co-embeddings.
  - Community detection over all-by-all protein similarities in the co-embedding space produces the hierarchy
    of protein communities output as the cell map.
  - A large language model approach developed by the project names sets of proteins and assigns a name
    confidence score during hierarchy evaluation.
  - FAIRSCAPE-CLI is a Python3 client-side application that creates RO-Crate packages with datasets, metadata,
    and software or resolvable references to them, plus identifier stubs; the Python3 server application
    completes packaging, registration, persistent identifier assignment, and provenance entailment computation.
    Both packages are PIP-installable and freely available under the MIT open-source license.
  tool_accuracy:
  - The captured source documents do not report accuracy metrics for these tools as applied to the deposited
    CM4AI release data.
