  external_resources:
  - Figshare (linked from the CM4AI June 2026 Dataverse release page)
- id: d4d:CM4AI/external/cm4ai-portal
  name: CM4AI web portal
  description: 'The open-access CM4AI web portal (http://www.cm4ai.org), built on the U-BRITE platform,
    disseminates CM4AI data, maps, tools, publications, and training material. The portal reports project-level
    data insights: 1,374 protein interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated,
    11,739 genes targeted, and 21.4 TB data volume. The site carries the notice "This repository is under
    review for potential modification in compliance with Administration directives."'
  external_resources:
  - https://cm4ai.org/
  - https://cm4ai.org/data-releases/
- id: d4d:CM4AI/external/cellmaps-toolkit
  name: Cell Mapping Toolkit (cellmaps_pipeline)
  description: Open-source software for cell map construction has been released as a series of Python
    PyPI packages at https://github.com/idekerlab/cellmaps_pipeline, implementing the end-to-end cell
    mapping pipeline with full user documentation. The CM4AI preprint states that software comprising
    the Tools data integration pipeline is available under a BSD-3 open source license in GitHub for alpha-level
    tools, or in the Zenodo long-term archive for production-ready tools.
  external_resources:
  - https://github.com/idekerlab/cellmaps_pipeline
  restrictions:
  - Distributed under an open-source license (BSD-3 for the Tools data integration pipeline).
- id: d4d:CM4AI/external/fairscape
  name: FAIRSCAPE AI-readiness framework
  description: FAIRSCAPE is described with a tutorial and installation instructions at https://fairscape.github.io.
    Copyright to this software is held by the Rector and Board of Visitors of the University of Virginia
    and it is available under the open source MIT License. Both the client-side (FAIRSCAPE-CLI) and server-side
    packages are PIP-installable.
  external_resources:
  - https://fairscape.github.io
  restrictions:
  - MIT open source license.
- id: d4d:CM4AI/external/musicmaps-u2os
  name: Multiscale Integrated Cell visualization portal and U2OS cell map (associated publication resources)
  description: 'The Bridge2AI-funded Nature 2025 publication "Multimodal cell maps as a foundation for
    structural and functional genomics" (Nature 642:222-231, published 09 April 2025) reports a U2OS osteosarcoma
    cell map and its companion Multiscale Integrated Cell visualization portal at http://musicmaps.ai/u2os-cellmap/.
    Its data are deposited separately from the CM4AI Dataverse releases: the U2OS cell map at https://ndexbio.org
    under uuid f693137a-d2d7-11ef-8e41-005056ae3c32; assemblies at the EBI Protein Complex Portal with
    query CLO:0009454; AP-MS interaction data at NDEx under uuid 95bc75d5-d1d1-11ee-8a40-005056ae23aa;
    AP-MS raw MS files at MassIVE under MSV000097168; the image dataset within the Human Protein Atlas
    v23 release; SEC-MS raw MS files and search results at ProteomeXchange under PXD052362; and structural
    models at the ModelArchive Database with identifiers ma-idk-u2osmap and ma-m5og4. This study interrogates
    U2OS cells and is a distinct cell-line context from the MDA-MB-468 and KOLF2.1J data in the CM4AI
    Dataverse releases; these resources are recorded here as associated project outputs, not as contents
    of the releases described by this datasheet.'
  external_resources:
  - http://musicmaps.ai/u2os-cellmap/
  - https://ndexbio.org
  - https://www.ebi.ac.uk/complexportal
  - https://modelarchive.org
  archival: true
- id: d4d:CM4AI/external/ndex
  name: Network Data Exchange (NDEx)
  description: The CM4AI preprint states that cell maps are shared via the Network Data Exchange (NDEx)
    and can be visualized in a web browser or accessed via tools such as Cytoscape, HiView, and the Python
    ndex2 library.
