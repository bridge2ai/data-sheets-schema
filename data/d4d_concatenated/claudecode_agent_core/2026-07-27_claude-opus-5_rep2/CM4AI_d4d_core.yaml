  prohibition_reason:
  - 'Dataverse Prohibited Uses: "These laboratory data are not to be used in clinical decision-making
    or in any context involving patient care without appropriate regulatory oversight and approval."'
- id: d4d:CM4AI/prohibited-use/commercial-without-license
  name: Commercial use without a separate license
  prohibition_reason:
  - The data are licensed under Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International,
    whose NonCommercial term states that the material may not be used for commercial purposes, where a
    commercial use is one primarily intended for commercial advantage or monetary compensation.
  - The CM4AI preprint states that commercial use requires a separate license negotiation with the copyright
    holder (UCSD, Stanford, and/or UCSF depending upon the specific data package in question), and that
    a Data Access Committee supervises ethical matters related to dataset distribution and potential dual
    licensing for commercial use.
- id: d4d:CM4AI/prohibited-use/restrictive-redistribution
  name: Redistribution under additional legal or technological restrictions
  prohibition_reason:
  - 'The CC BY-NC-SA 4.0 deed states that adaptations must be distributed under the same license (ShareAlike)
    and that no additional restrictions may be applied: "You may not apply legal terms or technological
    measures that legally restrict others from doing anything the license permits."'
