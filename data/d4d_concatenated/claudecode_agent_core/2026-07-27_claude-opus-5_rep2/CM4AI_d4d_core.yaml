name: CM4AI
title: Cell Maps for Artificial Intelligence (CM4AI) Data Releases
description: 'Cell Maps for Artificial Intelligence (CM4AI) is the Functional Genomics Data Generation
  Project of the U.S. National Institutes of Health Common Fund Bridge to Artificial Intelligence (Bridge2AI)
  program. CM4AI''s stated objective is to deliver machine-readable hierarchical maps of cell architecture
  as AI-ready data, produced from multimodal interrogation of chromatin modifiers, metabolic enzymes,
  and other proteins involved in cancer, neuropsychiatric, and cardiac disorders, in disease-relevant
  cell lines under treated and untreated conditions. Input data streams are generated by mass-spectrometry-based
  proteomics (affinity purification mass spectrometry, AP-MS; and size-exclusion chromatography mass spectrometry,
  SEC-MS), spatial proteomics / immunofluorescence (IF) confocal cell imaging, and single-cell CRISPR/Cas9
  (CRISPRi) genetic perturbation screens (perturb-seq). The cell systems under investigation are the triple-negative
  breast cancer line MDA-MB-468 (untreated, paclitaxel-treated, and vorinostat-treated) and the induced
  pluripotent stem cell line KOLF2.1J (undifferentiated and differentiated into neural progenitor cells,
  neurons, and cardiomyocytes). Outputs are packaged with provenance graphs and rich metadata as AI-ready
  datasets in RO-Crate format using an extended client-server version of the FAIRSCAPE framework, which
  mints persistent ARK identifiers and computes end-to-end provenance entailments expressed in the EVI
  Evidence Graph Ontology.

  This record describes the CM4AI quarterly data release series deposited in LibraData, the University
  of Virginia''s instance of Dataverse (an NIH-approved generalist repository). The current release is
  the June 2026 Data Release (Beta), DOI 10.18130/V3/HIGT4C, Dataverse version 2.0, publication date 2026-06-17,
  comprising 10 public ZIP archives: AP-MS data for paclitaxel- and vorinostat-treated MDA-MB-468 cells,
  IF image sets for untreated, paclitaxel-treated, and vorinostat-treated MDA-MB-468 cells, SEC-MS data
  for KOLF2.1J and MDA-MB-468, genome-scale CRISPRi perturb-seq data for KOLF2.1J (processed cell atlas
  and raw SRA package), and a release metadata archive. Three earlier Dataverse releases are documented
  separately in this record as historical releases and are not merged into the current release: the March
  2025 Data Release (Beta, DOI 10.18130/V3/B35XWX, 6 files), the June 2025 Data Release (Beta, DOI 10.18130/V3/F3TD5R,
  21 files) and the October 2025 Data Release (Beta, DOI 10.18130/V3/K7TGEM, 8 files). A May 2024 Data
  Release is listed in the cm4ai.org archive and the CM4AI preprint cites DOI 10.18130/V3/DXWOS5 for a
  CM4AI data release in the University of Virginia Dataverse.

  All releases to date are labelled Beta and are explicitly interim: the Dataverse completeness statement
  records that some datasets are under temporary pre-publication embargo, that the SEC-MS, IF imaging,
  and CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap, and that computed
  cell maps are not included. CM4AI reports no human subjects, de-identified samples, and no FDA regulation;
  the data are described in the CM4AI preprint as non-clinical (from tissue cultures) and as considered
  de-identified because they cannot be matched, with current knowledge, to a human subject. Data are licensed
  for reuse under Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International.'
