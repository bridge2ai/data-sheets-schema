    citation using the data citation shown on the dataset page. The licensing contact is Trey Ideker (ORCID
    https://orcid.org/0000-0002-1708-8454, tideker@health.ucsd.edu), recorded as Point of Contact on the
    CM4AI Dataverse releases (Ideker Trey, University of California San Diego) and reachable through the
    Dataverse email button; he is also the corresponding author of the CM4AI preprint.'
  license_terms:
  - Dataset licensed for reuse under Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    license (https://creativecommons.org/licenses/by-nc-sa/4.0/).
  - 'Attribution: users must give appropriate credit, provide a link to the license, and indicate if changes
    were made, in any reasonable manner but not in any way that suggests the licensor endorses the user
    or the use. Appropriate credit means providing the name of the creator and attribution parties, a
    copyright notice, a license notice, a disclaimer notice, and a link to the material.'
  - 'NonCommercial: the material may not be used for commercial purposes, where a commercial use is one
    primarily intended for commercial advantage or monetary compensation.'
  - 'ShareAlike: if the material is remixed, transformed, or built upon, contributions must be distributed
    under the same license as the original, or a license listed as compatible at https://creativecommons.org/compatiblelicenses.'
  - 'No additional restrictions: users may not apply legal terms or technological measures that legally
    restrict others from doing anything the license permits.'
  - 'CM4AI-specific attribution requirement: attribution is required to the copyright holders and the
    authors, and any publications referencing this data or derived products should cite the Related Publication
    as well as directly citing the data collection.'
  - Commercial use requires a separate license negotiation with the copyright holder (UCSD, Stanford,
    and/or UCSF depending upon the specific data package in question); a Data Access Committee supervises
    ethical matters related to dataset distribution and potential dual licensing for commercial use.
  - Bridge2AI Open House participants must attest and commit to the Bridge2AI Code of Conduct prior to
    accessing B2AI data, including CM4AI datasets.
  - 'All CM4AI integration and packaging software is freely available under non-restrictive open-source
    licenses: BSD-3 for the Tools data integration pipeline and MIT for FAIRSCAPE.'
  data_use_permission:
  - general_research_use
  - no_commercial_use
  contact_person: https://orcid.org/0000-0002-1708-8454
