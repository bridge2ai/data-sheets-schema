external_resources:
- id: d4d:CM4AI/external/massive
  name: MassIVE mass spectrometry repository
  description: Raw and processed mass spectrometry data associated with the CM4AI releases are linked
    from the Dataverse "External Data Links" section. The June 2026 release links SEC-MS data in KOLF2.1J
    iPSCs (undifferentiated, NPC, neuron, and cardiomyocyte), SEC-MS data in MDA-MB-468 breast cancer
    cells (+/- treatment), AP-MS data in MDA-MB-468 cells treated with paclitaxel, and AP-MS data in MDA-MB-468
    cells treated with vorinostat, each to the MassIVE Repository. The October 2025 release links the
    two SEC-MS collections to MassIVE. Specific MassIVE accession numbers for these CM4AI depositions
    are not given in the captured pages.
  external_resources:
  - MassIVE Repository (linked from the CM4AI Dataverse release pages)
  archival: true
- id: d4d:CM4AI/external/ncbi-bioproject-sra
  name: NCBI BioProject / Sequence Read Archive
  description: The June 2025 release links "Sequence Read Archive (SRA) Data" to NCBI BioProject. The
    perturb-seq raw sequence package distributed in the October 2025 and June 2026 releases is named cm4ai_perturb-seq_KOLF2_raw_sra.zip.
    A specific BioProject accession is not given in the captured pages.
  external_resources:
  - NCBI BioProject (linked from the CM4AI June 2025 Dataverse release page)
  archival: true
- id: d4d:CM4AI/external/figshare
