  name: CM4AI June 2025 Data Release (Beta)
  title: Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta)
  description: Historical CM4AI data release. The captured page states that this dataset is a revision
    of the June 2025 Data Release; the revision includes adding RGB immunofluorescent images, corrections
    to RO-Crate metadata, and changes to naming conventions. The Beta release includes perturb-seq data
    in undifferentiated KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs, iPSC-derived NPCs,
    neurons, cardiomyocytes, and treated and untreated MDA-MB-468 breast cancer cells; and IF images in
    MDA-MB-468 breast cancer cells in the presence and absence of chemotherapy (vorinostat and paclitaxel).
    It comprises 21 public files (12 text, 5 data, 3 archive, 1 metadata by Dataverse file-type facet),
    including a release RO-Crate datasheet in HTML, a release RO-Crate metadata JSON with pointers to
    sub-crates, per-modality provenance graph HTML files, and the three MDA-MB-468 IF image ZIP archives
    covering 464 proteins per condition. Dataverse reports 256 downloads for this release as captured.
