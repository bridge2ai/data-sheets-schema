    models, and software, and linked into end-to-end provenance entailments expressed in the EVI Evidence
    Graph Ontology. The June 2025 release distributed a release RO-Crate datasheet in HTML, a release
    RO-Crate metadata JSON with pointers to sub RO-Crates, and per-modality provenance graph HTML files;
    the October 2025 and June 2026 releases distribute a single cm4ai_release_metadata.zip archive.
  label: false
anomalies:
- id: d4d:CM4AI/anomaly/incomplete-modality-overlap
  name: Incomplete protein overlap across modalities
  anomaly_details:
  - The Dataverse completeness statement for the June 2025, October 2025, and June 2026 releases records
    that protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturb-seq
    data interrogate sets of proteins which incompletely overlap.
- id: d4d:CM4AI/anomaly/protein-count-divergence
  name: Divergent per-condition protein counts across releases and portal
  anomaly_details:
  - IF image archive descriptions state 563 proteins of interest per condition in the March 2025 release
    and 464 proteins per condition in the June 2025 and October 2025 releases, while cm4ai.org lists IF
    images for 523 proteins among the TNBC flagship datasets. The June 2026 IF archives carry MD5 checksums
    that differ from the June 2025 and October 2025 archives of the same names, and no per-file protein
    count is stated for them.
- id: d4d:CM4AI/anomaly/file-size-changes
  name: Large size changes for identically named archives across releases
  anomaly_details:
  - cm4ai_mass-spec_KOLF2.zip is 23.8 MB in the October 2025 release and 171.8 KB in the June 2026 release;
    cm4ai_mass-spec_MDA-MB-468.zip is 23.0 MB in the October 2025 release and 93.9 KB in the June 2026
    release. The captured pages do not explain the change in packaged content.
known_biases:
- id: d4d:CM4AI/bias/cell-line-derived
  name: Cell-line-derived data do not represent population variation
  bias_type: representation_bias
  bias_description: The Dataverse "Potential Sources of Bias" statement records that data in the release
    was derived from commercially available de-identified human cell lines and does not represent all
    biological variants which may be seen in the population at large.
  mitigation_strategy: No mitigation strategy is stated in the captured pages; the source documents recommend
    that users be aware of this limitation. The bias applies to all data streams in the March 2025, June
    2025, October 2025, and June 2026 releases.
- id: d4d:CM4AI/bias/two-donor-origin
  name: Two source cell lines with single-donor origins
  bias_type: selection_bias
  bias_description: All CM4AI cell systems derive from two cell lines. MDA-MB-468 (RRID:CVCL_0419) is
    a triple negative breast cancer cell line established from a metastatic site pleural effusion of a
    51-year-old black female with a metastatic mammary adenocarcinoma, available from ATCC. KOLF2.1J (RRID:CVCL_B5P3)
    is an iPSC line derived from a healthy male Northern European donor, available from the Human Induced
    Pluripotent Stem Cells Initiative (HipSci) resource. Genotype, sex, ancestry, and disease context
    are therefore fixed by the choice of these two lines.
  affected_subsets:
  - AP-MS protein-protein interaction data
  - SEC-MS protein-protein interaction data
  - Immunofluorescence spatial proteomics image data
  - CRISPRi perturb-seq genetic perturbation data
- id: d4d:CM4AI/bias/target-gene-selection
  name: Targeted selection of chromatin modifiers and metabolic enzymes
  bias_type: sampling_bias
  bias_description: CM4AI's stated objective targets 100 chromatin modifiers and 100 metabolic enzymes
    involved in cancer, neuropsychiatric, and cardiac disorders, rather than an unbiased proteome-wide
    sample. Spatial proteomics mapping was completed for 100 chromatin regulators in MDA-MB-468 cells
    with a further 500 proteins pending significant hits from the genetic perturbation and PPI results.
  mitigation_strategy: SEC-MS is applied proteome-wide, and the CRISPRi Perturbation Cell Atlas in KOLF2.1J
    is expressed genome-scale, covering 11,739 targeted genes.
known_limitations:
- id: d4d:CM4AI/limitation/interim-release
  name: Interim Beta release
  limitation_type: scope_limitation
  limitation_description: The Dataverse limitations statement records that this is an interim release
    and does not contain predicted cell maps, which will be added in future releases.
  scope_impact: The released data are input data streams rather than the integrated hierarchical cell
    maps that are the project's stated primary deliverable.
  recommended_mitigation: The release states that the current release is most suitable for bioinformatics
    analysis of the individual datasets.
- id: d4d:CM4AI/limitation/domain-expertise
  name: Requires domain expertise
  limitation_type: methodological_limitation
  limitation_description: The Dataverse limitations statement records that the release requires domain
    expertise for meaningful analysis.
- id: d4d:CM4AI/limitation/modality-coverage
  name: Incomplete overlap of proteins across modalities
  limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging), and
    CRISPRi perturb-seq data interrogate sets of proteins which incompletely overlap, limiting the set
    of proteins for which all modalities are jointly available.
- id: d4d:CM4AI/limitation/embargo
  name: Temporary pre-publication embargo on some datasets
  limitation_type: scope_limitation
  limitation_description: The Dataverse completeness statement records that some datasets are under temporary
    pre-publication embargo. In the October 2025 and June 2026 releases the external links for perturb-seq
    data in KOLF2.1J iPSCs and in MDA-MB-468 breast cancer cells are labelled "Embargoed".
- id: d4d:CM4AI/limitation/quarterly-snapshots
  name: Quarterly snapshots superseded by later releases
  limitation_type: temporal_limitation
  limitation_description: CM4AI releases data quarterly and states that the dataset will be regularly
    updated and augmented through the end of the project in November 2026. Each release is a snapshot;
    the March 2025, June 2025, and October 2025 releases are historical relative to the current June 2026
    release, and identically named archives differ in size and checksum between releases.
  recommended_mitigation: Cite the specific release DOI and Dataverse version used, and check https://cm4ai.org/data-releases/
    for the current release.
- id: d4d:CM4AI/limitation/administrative-review
  name: Collection under administrative review
  limitation_type: scope_limitation
  limitation_description: Both cm4ai.org and the CM4AI Dataverse collection display the notice "This repository
    is under review for potential modification in compliance with Administration directives" / "This collection
    is under review for potential modification in compliance with Administration directives", indicating
    that availability or content may change.
confidential_elements:
- id: d4d:CM4AI/confidentiality/none
  name: Confidentiality assessment
  confidential_elements_present: false
  confidentiality_details:
  - 'The Dataverse Data Governance & Ethics block records Human Subjects: No and De-identified Samples:
    Yes for the June 2025, October 2025, and June 2026 releases.'
  - The CM4AI preprint states that CM4AI data are distinctive within Bridge2AI in that they are non-clinical
    (from tissue cultures) and are considered to be de-identified as they cannot be matched, with current
    knowledge, to a human subject.
  - All files listed in the captured release file tables have Public file access.
content_warnings:
- id: d4d:CM4AI/content-warning/none
  name: Content warning assessment
  content_warnings_present: false
  warnings:
  - No content warnings are stated in the captured source documents. The released material consists of
    proteomics measurements, microscopy images of cultured cell lines, single-cell sequencing data, and
    metadata.
subpopulations:
- id: d4d:CM4AI/subpopulation/none
  name: Subpopulation assessment
  subpopulation_elements_present: false
  identification:
  - 'The released data do not identify human subpopulations. Donor characteristics are documented only
    at the level of the two source cell lines: MDA-MB-468 was established from a 51-year-old black female
    with a metastatic mammary adenocarcinoma, and KOLF2.1J was derived from a healthy male Northern European
    donor.'
  distribution:
  - No subpopulation distribution is reported, because all data derive from the two cell lines named above
    rather than from a sampled human population.
sensitive_elements:
- id: d4d:CM4AI/sensitive/none
  name: Sensitive element assessment
  sensitive_elements_present: false
  sensitivity_details:
  - 'The Dataverse Data Governance & Ethics block records Human Subjects: No, De-identified Samples: Yes,
    and FDA Regulated: No.'
  - The CM4AI preprint states that the data cannot be matched, with current knowledge, to a human subject.
acquisition_methods:
- id: d4d:CM4AI/acquisition/instrument-measurement
  name: Direct instrument measurement on cultured cell lines
  was_directly_observed: true
  was_reported_by_subjects: false
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - 'Primary observations are instrument measurements on cultured human cell lines: tandem mass spectrometry
    after affinity purification (AP-MS), size exclusion chromatography followed by mass spectrometry (SEC-MS),
    confocal microscopy of immunofluorescence-stained cells, and single-cell RNA sequencing of CRISPRi-perturbed
    cells.'
  - Derived content includes protein embeddings, co-embeddings, and protein community hierarchies produced
    by the MuSIC pipeline, and transcriptional and fitness phenotype summaries in the CRISPRi Perturbation
    Cell Atlas.
  - The Dataverse file description for the CRISPR Perturbation Cell Atlas states that the findings were
    validated via phenotypic, protein-interaction, and metabolic tracing assays. The CM4AI project also
    uses two orthogonal mass spectrometry approaches (AP-MS and SEC-MS) for protein-protein interaction
    mapping.
  - 'No data are self-reported by human subjects; the Dataverse governance block records Human Subjects:
    No.'
collection_mechanisms:
- id: d4d:CM4AI/mechanism/apms
  name: Affinity purification mass spectrometry (AP-MS)
  mechanism_details:
  - 'AP-MS is performed on endogenously tagged cell lines to map protein-protein interactions of chromatin
    regulators under different conditions (cancer: no treatment, paclitaxel or vorinostat; iPSC: undifferentiated,
    neurons and cardiomyocytes). The CM4AI preprint reports 17 genes endogenously tagged in MDA-MB-468
    with AP-MS data acquired under three conditions, and 34 additional genes being tagged.'
- id: d4d:CM4AI/mechanism/secms
  name: Size exclusion chromatography mass spectrometry (SEC-MS)
  mechanism_details:
  - SEC-MS is used for proteome-wide complex and interaction mapping as an orthogonal approach to AP-MS.
    It has been performed on MDA-MB-468 cells under three conditions (untreated, paclitaxel and vorinostat
    treated) and on KOLF2 iPSCs and their derivatives. SEC-MS datasets in the CM4AI releases were generated
    in the Nevan Krogan laboratory at the University of California San Francisco.
- id: d4d:CM4AI/mechanism/if-imaging
  name: Immunofluorescence confocal imaging (spatial proteomics)
  mechanism_details:
  - 'Spatial subcellular organization is mapped using the Human Protein Atlas resource of antibodies with
    immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
    University. Automated fixation and permeabilization protocols were established for a pipetting robot
    for the MDA-MB-468 and KOLF2 cell lines. Each image carries four channels: DAPI for nuclei, calreticulin
    antibody for endoplasmic reticulum, tubulin antibody for microtubules, and an antibody against the
    protein of interest.'
- id: d4d:CM4AI/mechanism/perturbseq
  name: Single-cell CRISPRi perturbation sequencing (perturb-seq)
  mechanism_details:
  - Single-cell CRISPR screens were performed perturbing 100 chromatin regulators in MDA-MB-468 cells
    under three conditions (no treatment, paclitaxel or vorinostat) and in undifferentiated KOLF2.1J iPSCs,
    using a CRISPR lentiviral library targeting 100 chromatin factors with 6 guide RNAs per gene, in MDA-MB-468
    and KOLF2 lines engineered to express inducible dCas9, read out with the 10x Genomics 3'HT kit. Separately,
    an expressed genome-scale CRISPRi Perturbation Cell Atlas covers 11,739 targeted genes in undifferentiated
    KOLF2.1J hiPSCs.
- id: d4d:CM4AI/mechanism/packaging
  name: RO-Crate packaging and persistent identifier assignment
  mechanism_details:
  - FAIRSCAPE-CLI is invoked when a computation or coherent set of computations in the pipeline completes,
    receiving metadata that defines JSON-Schema schemas for the datasets in the computational unit as
    well as the inputs, computations, software, models, and outputs. It creates an RO-Crate package and
    identifier stubs; the RO-Crates are sent to the FAIRSCAPE server for registration, ARK persistent
    identifier assignment, and provenance entailment computation.
collection_timeframes:
- id: d4d:CM4AI/timeframe/award-period
  name: CM4AI award and data generation period
  start_date: '2022-09-01'
  end_date: '2026-08-31'
  timeframe_details:
  - NIH RePORTER records project start 2022-09-01 and project end 2026-08-31 for the CM4AI Data Generation
    Project (application ID 11211616, fiscal year 2025).
  - Dataverse citation metadata records Data Creation Date 2025-02-27 and Deposit Date 2025-02-27 for
    all four captured releases.
  - The Dataverse maintenance plan states that the dataset will be regularly updated and augmented through
    the end of the project in November 2026, with updates on a quarterly basis. This end date does not
    match the 2026-08-31 project end date recorded in NIH RePORTER.
  - 'Release publication dates: March 2025 release published 2025-03-03; June 2025 release published 2025-07-01;
    October 2025 release published 2025-10-31; June 2026 release published 2026-06-17 with its immunofluorescence
    image archives published 2026-07-15.'
data_collectors:
- id: d4d:CM4AI/collector/lundberg-lab
  name: Lundberg Lab, Stanford University
  role: Immunofluorescence spatial proteomics image generation
  collector_details:
  - The Dataverse file descriptions for the IF image archives in the March 2025, June 2025, and October
    2025 releases state that the images were acquired by immunofluorescence-based staining (ICC-IF) and
    confocal microscopy in the Lundberg Lab at Stanford University, as part of the Cell Maps for Artificial
    Intelligence project. Emma Lundberg (ORCID 0000-0001-7034-0850) is listed among the release authors
    with affiliation Stanford University.
- id: d4d:CM4AI/collector/krogan-lab
  name: Nevan Krogan laboratory, University of California San Francisco
  role: SEC-MS protein-protein interaction data generation
  collector_details:
  - The Dataverse file descriptions for the SEC-MS archives state that the data were generated by size
    exclusion chromatography-mass spectroscopy on undifferentiated KOLF2.1J hiPSCs, and following treatment
    with vorinostat or paclitaxel on MDA-MB468 human breast cancer cells, in the Nevan Krogan laboratory
    at the University of California San Francisco. Nevan Krogan (ORCID 0000-0003-4902-337X) is listed
    among the release authors with affiliation University of California San Francisco.
- id: d4d:CM4AI/collector/data-acquisition-module
  name: CM4AI Data Acquisition Module
  role: Generation of protein-protein interaction, spatial proteomics, and genetic perturbation data
  collector_details:
  - The CM4AI Data Acquisition Module completed parallel maps of protein-protein interactions, protein
    subcellular distributions, and transcriptional states associated with a near-comprehensive set of
    chromatin regulators encoded by the human genome, generated in ethically sourced breast cancer cells
    and extended to ethically sourced human induced pluripotent stem cells.
- id: d4d:CM4AI/collector/standards-module
  name: CM4AI Standards Module
  role: AI-readiness packaging of data, software, metadata, and provenance graphs
  collector_details:
  - The Standards Module is responsible for AI-Readiness packaging of data, software, metadata and provenance
    graphs, performed by the FAIRSCAPE framework, and established FAIR AI-Readiness metadata and validation
    toolkits used to package and release the cell-line perturbation and measurement data.
- id: d4d:CM4AI/collector/tools-module
  name: CM4AI Tools Module
  role: Data integration pipeline and cell map production
  collector_details:
  - The Tools Module produces and maintains the Multi-Scale Integrated Cell (MuSIC) dataset integration
    and map production system, which produces integrated cell maps from the multiple multi-modal input
    data streams and calls the FAIRSCAPE client package to validate inputs and create output RO-Crate
    packages.
- id: d4d:CM4AI/collector/depositor
  name: Justin Niestroy
  role: Depositor of record for the CM4AI Dataverse releases
  collector_details:
  - Dataverse citation metadata for the March 2025, June 2025, October 2025, and June 2026 releases records
    the Depositor as "Niestroy, Justin" with Deposit Date 2025-02-27. Justin Niestroy (ORCID 0000-0002-1103-3882)
    is affiliated with the University of Virginia.
missing_data_documentation:
- id: d4d:CM4AI/missing-data/release-gaps
  name: Documented gaps in the current releases
  missing_data_patterns:
  - Computed cell maps are not included in the release.
  - Some datasets are under temporary pre-publication embargo, including the external perturb-seq links
    for KOLF2.1J iPSCs and for MDA-MB-468 cells in the October 2025 and June 2026 releases.
  - Protein-protein interaction (SEC-MS), protein localization (IF imaging), and CRISPRi perturb-seq data
    interrogate sets of proteins which incompletely overlap.
  - IF images for the iPSC flagship datasets are marked "coming soon" on cm4ai.org, as are AP-MS interactomes
    for the TNBC flagship datasets.
  - The March 2025 release notes for the SEC-MS RO-Crate state that "The data will be uploaded to Pride
    when available."
  missing_data_causes:
  - Staged quarterly release schedule with data augmented regularly through the end of the project.
  - Temporary pre-publication embargo on some datasets.
  - Differing experimental coverage across modalities.
  handling_strategy: The Dataverse release pages document the gaps explicitly in a "Completeness" statement
    and state that the dataset will be regularly updated and augmented through the end of the project
    in November 2026, with quarterly updates. Embargoed resources are labelled "Embargoed" in the External
    Data Links section rather than omitted silently.
