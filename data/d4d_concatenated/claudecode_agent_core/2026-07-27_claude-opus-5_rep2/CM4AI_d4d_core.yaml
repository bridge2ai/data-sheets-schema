- id: d4d:CM4AI/existing-use/project-preprint
  name: CM4AI project description preprint
  examples:
  - 'Clark T, Mohan J, Schaffer L, Obernier K, et al. Cell Maps for Artificial Intelligence: AI-Ready
    Maps of Human Cell Architecture from Disease-Relevant Cell Lines. bioRxiv 2024.05.21.589311, posted
