  retention_period: Long-term preservation with no stated end date
  retention_details:
  - The Dataverse maintenance plan states long term preservation in the University of Virginia Dataverse,
    supported by committed institutional funds.
  - Dataverse notes that files are not removed from previously published versions of a dataset when deleted
    from a later version, so published release versions remain retrievable.
  - The captured release pages record no embargo or retention period on the deposited files themselves.
version_access:
  id: d4d:CM4AI/version-access/releases
  name: Version and release access
  latest_version_doi: https://doi.org/10.18130/V3/HIGT4C
  versions_available:
  - June 2026 Data Release (Beta), doi 10.18130/V3/HIGT4C, Dataverse version 2.0 (citation V2), published
    2026-06-17 - current release
  - October 2025 Data Release (Beta), doi 10.18130/V3/K7TGEM, Dataverse version 2.1 (citation V2), published
    2025-10-31 - historical
  - June 2025 Data Release (Beta), doi 10.18130/V3/F3TD5R, Dataverse version 2.1 (citation V2), published
    2025-07-01 - historical
  - March 2025 Data Release (Beta), doi 10.18130/V3/B35XWX, Dataverse version 1.4 (citation V1), published
    2025-03-03 - historical
  - May 2024 Data Release - listed in the cm4ai.org archive; the CM4AI preprint cites doi 10.18130/V3/DXWOS5,
    University of Virginia Dataverse, V1
  version_details:
  - Each quarterly release is a distinct Dataverse deposit with its own DOI rather than a new version
    of a single deposit, and each release also carries an internal Dataverse version number.
  - Earlier releases remain published and citable; the manifest for this source bundle records that the
    October 2025 release, which the input spreadsheet still selects, has been superseded upstream by the
    June 2026 HIGT4C release.
  - 'The cm4ai.org Data Releases page names the current release "June 2026 Data Release (Beta)" and gives
    its DOI as doi.org/10.18130/V3/HIGT4C, but displays "Released on: June 17, 2025". The Dataverse record
    for the same DOI gives Publication Date 2026-06-17 and a 2026 citation year. The Dataverse metadata
    is treated as authoritative here and the cm4ai.org date is recorded as a website error.'
  - The source manifest records that Dataverse reports version 2 of the June 2026 release as having been
    released at 2026-07-15T20:28:19Z, consistent with the three immunofluorescence image archives being
    published on 2026-07-15.
  - The cm4ai.org archive lists five releases (May 2024, March 2025, June 2025, October 2025, and the
    current June 2026 release).
extension_mechanism:
  id: d4d:CM4AI/extension/toolkit-and-contact
  name: Extension and contribution mechanisms
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details:
  - The Cell Mapping Toolkit implements the end-to-end cell mapping pipeline as a series of open-source
    Python PyPI packages with full user documentation at https://github.com/idekerlab/cellmaps_pipeline,
    providing a flexible and generalizable framework enabling researchers to integrate and construct cell
    maps from multiple input modalities. It is described as developed to facilitate continued map improvement,
    incorporation of new datasets, and construction of new cell maps across subtypes and disease states.
  - The FAIRSCAPE client and server packages are PIP-installable and freely available under the MIT license,
    with tutorial and installation instructions at https://fairscape.github.io, allowing others to produce
    equivalent AI-ready RO-Crate packages.
  - The Dataverse deposit provides a "Contact Owner" mechanism for reaching the dataset point of contact;
    cm4ai.org lists Swathi Thaker (snthaker@uab.edu) for project-related inquiries and Zhandos Sembay
    (zsembay8@uab.edu) for website support and updates.
  - The Teaming Module fosters community involvement through mailing lists, shared online collaborating
    folders, shared documents, and remote messaging and collaboration software within CM4AI, across the
    Bridge2AI program, and in the broader scientific community, and collaborates with the NIH Common Fund
    Data Ecosystem for data curation.
