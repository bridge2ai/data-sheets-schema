- id: https://doi.org/10.18130/V3/HIGT4C
  name: CM4AI June 2026 Data Release (Beta)
  title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
  description: Current CM4AI data release. This dataset is the June 2026 Data Release of Cell Maps for
    Artificial Intelligence (CM4AI; CM4AI.org), the Functional Genomics Grand Challenge in the NIH Bridge2AI
    program. CM4AI is generating multi-modal data including protein-protein interaction (PPI), spatial
    localization, and genetic perturbation data in MDA-MB-468 breast cancer cells (+/- paclitaxel or vorinostat)
    and iPSCs (+/- differentiation). This Beta release includes perturb-seq data for MDA-MB-468 breast
    cancer cells +/- treatment and undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468
    breast cancer cells +/- treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron progenitor
    cells (NPCs), neurons, and cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer cells + treatment;
    and IF images in MDA-MB-468 breast cancer cells +/- treatment. AP-MS data are new relative to the
    October 2025 release. The release comprises 10 public ZIP archives; two AP-MS, two SEC-MS, two perturb-seq,
    and one release-metadata archive were published 2026-06-17, and the three IF image archives were published
    2026-07-15.
