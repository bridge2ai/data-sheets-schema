- id: d4d:VOICE-pediatric
  name: Bridge2AI-Voice Pediatric Dataset
  title: Bridge2AI-Voice Pediatric Dataset
  description: The Bridge2AI-Voice Pediatric Dataset, distributed as the separate PhysioNet project b2ai-voice-pediatric.
    The current release, v1.1.0 published 2026-05-01, contains derived audio features for 23,533 recordings
    collected from 300 participants aged 2 to 18. Patients and healthy volunteers at the Hospital for
    Sick Children were considered for enrollment; eligibility required 2 to 18 years of age and English
    proficiency, and exclusion criteria included being over 18 years of age and being non-verbal. Non-patients
    were recruited through research postings. All data was collected through reproschema-ui on tablets
    with the Bridge2AI-Voice pediatric protocol, and all participants completed the recording and demographic
    data collection in one session. The release contains data considered low risk, including derivations
    such as spectrograms but not the original voice recordings.
