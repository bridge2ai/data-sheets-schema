license_and_use_terms:
  id: d4d:VOICE-license-and-use-terms
  name: License and use terms
  license_terms:
  - 'License for files on PhysioNet, for both the adult and pediatric projects: Bridge2AI Voice Registered
    Access License.'
  - 'Data use agreement for both projects: Bridge2AI Voice Registered Access Agreement. No training is
    required for the adult v3.0.0 and v3.1.0 releases or the pediatric v1.1.0 release.'
  - 'Registered access (features-only data): register on PhysioNet and confirm your identity under the
    Registered Access License, then sign the Bridge2AI-Voice Registered Access Agreement, which outlines
    the terms and conditions for data use.'
  - 'Controlled access (raw audio data): complete the Data Access Request Form (DARF); complete the Data
    Use Agreement (DUA); submit the application to the Data Access Compliance Office for review; upon
    approval, ensure a Data Use and Transfer Agreement (DTUA) is signed by an authorized official at your
    institution.'
  - 'Access policy stated on the adult v1.1 PhysioNet page: only registered users who sign the specified
    data use agreement can access the files. Access policy stated on the adult v3.0.0 and v3.1.0 pages
    and on the pediatric v1.1.0 page: only credentialed users who sign the DUA can access the files.'
  - 'Intellectual property terms reproduced from the registered access agreement: the data may be protected
    by copyright and other rights; duplication as reasonably required to carry out the research project
    is permitted; sale of all or part of the data on any media is not permitted; nothing in the agreement
    transfers intellectual property rights in or relating to the data; users agree not to make intellectual
    property claims on the data; users agree not to use intellectual property protection in ways that
    would prevent or block access to, or use of, any element of the data or conclusions drawn directly
    from it; users may obtain intellectual property rights on downstream discoveries but agree to implement
    licensing policies that will not obstruct further research and to respect the Fort Lauderdale Agreement.
    There are no fees associated with these restrictions.'
  - The Data Transfer and Use Agreement term ends two years after the start date, upon completion of the
    project, upon expiration of the applicable ethics approval, or on termination by the provider institution,
    whichever occurs first; upon expiration or early termination the recipient follows the provider's
    disposition instructions and may retain one copy of the data only as necessary for records retention,
    research integrity and verification.
  - Data delivered under the Data Transfer and Use Agreement is provided "as is" with no representations
    or warranties, express or implied.
  - Recipients agree to adhere to the specific requirements of PhysioNet.org, managed by the MIT Laboratory
    for Computational Physiology.
  - The Bridge2AI-Voice documentation repository and the REDCap data dictionary are released under the
    MIT license; the b2aiprep library is released under Apache-2.0.
  data_use_permission:
  - general_research_use
  contact_person: d4d:person-daco
ip_restrictions:
  id: d4d:VOICE-ip-restrictions
  name: Intellectual property restrictions
  restrictions:
  - 'Healthsheet answer on third-party IP restrictions: "No IP-based restrictions have been imposed by
    third parties."'
  - Users understand and acknowledge that the data may be protected by copyright and other rights, including
    other intellectual property rights.
  - Users agree not to make intellectual property claims on the data and not to use intellectual property
    protection in ways that would prevent or block access to, or use of, any element of the data or conclusions
    drawn directly from it.
  - The data provider provides no guarantees that the data is free of third-party intellectual property
    rights, database rights, and other related rights.
regulatory_restrictions:
  id: d4d:VOICE-regulatory-restrictions
  name: Regulatory restrictions and compliance
  regulatory_restrictions:
  - 'Healthsheet answer on export controls: "No export controls apply to the dataset."'
  - Access to the features-only data requires PhysioNet registration or credentialing and a signed data
    use agreement; access to raw audio additionally requires institutional sign off and Data Access Compliance
    Office approval.
  hipaa_compliant: compliant
  other_compliance:
  - HIPAA de-identification rules are applied to the released dataset and direct identifiers are removed.
  - The Bridge2AI Voice Web app and iOS app are HIPAA-compliant and send data over a secure https protocol
    to a HIPAA-compliant storage server operated by an NIH STRIDES partner.
  - The data are covered under a Certificate of Confidentiality, which must be asserted against compulsory
    legal demands such as court orders and subpoenas.
  - Recipients must comply with all applicable laws, rules, and regulations, as well as all professional
    standards applicable to the research.
  confidentiality_level: restricted
  governance_committee_contact: d4d:person-daco
is_deidentified:
  id: d4d:VOICE-deidentification
  name: De-identification status
  identifiable_elements_present: false
  method: HIPAA Safe Harbor de-identification with removal of direct and high-risk indirect identifiers,
    removal of all raw audio, and removal of fields flagged as sensitive in the REDCap data dictionary.
  identifiers_removed:
  - Names
  - Civic addresses
  - Social security numbers
  - Geographic locators, including state and province (country of data collection was retained)
  - Date information at resolution finer than years
  - Phone and fax numbers, email addresses, IP addresses
  - Medical record numbers, health plan beneficiary numbers, account numbers, license numbers, device
    identifiers, vehicle identifiers, website URLs
  - Full face photos and biometric identifiers, and any unique identifiers
  - Select geographic or demographic identifiers, and information about household composition or cultural
    identity, where these created a significant re-identification risk
  - Household income, mental health status, traumatic life experiences and similarly highly sensitive
    non-identifying elements
  - All raw voice data
  - Narrative text fields and transcripts of free speech audio
  deidentification_details:
  - 'Level of de-identification recorded in the study metadata: identifiable information (under HIPAA
    and the Common Rule), as well as data considered sensitive, have been removed from this dataset.'
  - 'Study metadata answers: the dataset removes direct identifiers (yes); applies the HIPAA de-identification
    rules (yes); rebases and/or replaces dates by integers (yes); removes or generalizes geographic information
    (yes); removes narrative text fields (yes); achieves K-anonymization with k>=2 (no).'
  - All raw voice data was removed, as this data has the potential to cause individual re-identification
    or to be used for illicit or unauthorized purposes.
maintainers:
- id: d4d:VOICE-maintainer-physionet
  name: MIT Laboratory for Computational Physiology (PhysioNet)
  role: academic_institution
  maintainer_details:
  - PhysioNet is maintained by the MIT Laboratory for Computational Physiology and is supported by the
    National Institute of Biomedical Imaging and Bioengineering (NIBIB), the National Heart Lung and Blood
    Institute (NHLBI), and the NIH Office of the Director under NIH grant numbers U24EB037545 and R01EB030362.
