purposes:
- id: d4d:VOICE-purpose-flagship-voice-dataset
  name: Create a flagship ethically sourced voice dataset linked to health information
  description: Primary purpose stated by the project for creating the dataset.
  response: 'Bridge2AI-Voice seeks to create a flagship, standardized, and ethically sourced dataset of
    voices linked to health information to fuel research and discovery in voice biomarkers. The Bridge2AI
    Voice dataset was created to address a gap in the availability of large-scale, diverse, and well-documented
    voice data for use in clinical machine-learning applications. Previous studies on machine learning-based
    voice diagnosis produced promising results, but their sample sizes were too small, or they lacked
    the key metadata needed for training robust, clinically useful models. The goal is to facilitate the
    use of voice as a non-invasive, cost-effective biomarker for the screening, diagnosis, and monitoring
    of a wide range of health conditions. Stated size targets differ by source and date: the current project
    documentation describes a flagship dataset of 10,000 voices and records an anticipated enrollment
    count by 2027 of 10,000, whereas the 2024 audiomics white paper describes a primary deliverable of
    a publicly available database of 30,000 human voices, and the IRB protocol gives a sample size of
    30,000 participants with complete data acquisition for up to 5,000 participants per disease category
    and controls.'
- id: d4d:VOICE-purpose-integrate-voice-into-clinical-care
  name: Integrate voice as a biomarker of health into clinical care
  description: Programmatic objective stated in the NIH RePORTER project description and the IRB protocol.
  response: The group aims to integrate the use of voice as a biomarker of health in clinical care by
    generating a substantial multi-institutional, ethically sourced, and diverse voice database linked
    to multimodal health biomarkers to fuel voice AI research and build predictive models to assist in
    screening, diagnosis, and treatment of a broad range of diseases. Data collection is made possible
    by software through a smartphone application linked to electronic health records (EHR) and other health
    biomarkers such as radiomics and genomics, and supported by federated learning technology to protect
    data privacy.
- id: d4d:VOICE-purpose-pediatric-developmental-norms
  name: Enable study of pediatric voice and speech development
  description: Purpose stated specifically for the pediatric dataset.
  response: Pediatric and adult voice/speech production are fundamentally different because the respiratory
    system and larynx undergo rapid functional maturation throughout childhood, so normative data from
    adults cannot be generalized to pediatric populations. Establishing a robust multi-institutional dataset
    that integrates pediatric voice data with demographic information is intended to enable study of developmental
    norms, create AI-driven tools for early screening, and support clinical insight into pediatric communication
    disorders such as autism spectrum disorder and speech delays.
- id: d4d:VOICE-purpose-audiomics-standards
  name: Define standards for audiomics
  description: Purpose stated in the audiomics white paper and in the project's Standards module.
  response: The project seeks to define and create standards for "audiomics", the interdisciplinary field
    of audio analysis applied to biomedicine to identify unique audio biomarkers of health and disease.
    The stated tripartite agenda is that standards for audiomics data acquisition, interoperability, and
    AI readiness must be defined; that diverse teams including clinicians, engineers, bioethicists, and
    social scientists must collaborate; and that the unique ethical and legal challenges in audiomics
    call for a new governance framework covering diversity, data handling, and privacy safeguards.
tasks:
- id: d4d:VOICE-task-disease-detection-classification
  name: Disease detection and classification from voice
  description: Predefined machine-learning tasks that accompany the release.
  response: The current version of the dataset comes with predefined tasks and labeling. The tasks are
    primarily designed for training machine-learning models for disease detection and classification using
    voice data. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions, and respiratory disorders. There are no predefined recommended data splits
    for training, validation, or testing; researchers are encouraged to create their own data splits based
    on their specific requirements.
- id: d4d:VOICE-task-benchmark-validate-models
  name: Develop, benchmark, or validate clinically applicable ML models
  description: Task framing given in the dataset's general information section.
  response: The Bridge2AI Voice dataset aims to enable the development, benchmarking, or validation of
    clinically applicable machine-learning models for diagnosing a wide range of health conditions using
    voice data, including vocal pathologies, neurological, psychiatric, respiratory, and pediatric voice
    disorders. The dataset can be used for AI model pretraining, fine-tuning, benchmarking, or validation.
addressing_gaps:
- id: d4d:VOICE-gap-small-nonstandard-datasets
  name: Lack of large, standardized, multimodal voice datasets
  description: The methodological gap the project was designed to close.
  response: Current literature on voice biomarkers has only been studied on small- to medium-sized data
    sets with limited data outside of acoustic measures not linked to multi-modal health data. Comparing
    studies and pooling data is challenging due to a lack of existing standards in how voice and other
    acoustics are measured and collected. When machine-learning applications for screening and diagnosis
    of laryngeal cancer were reviewed, most studies reported training datasets of fewer than 300 patients,
    and only two studies used more than one data modality to train their models, limiting generalization.
- id: d4d:VOICE-gap-private-industry-datasets
  name: Private industry datasets cannot be audited
  description: Gap in openly auditable voice data described in the audiomics white paper.
  response: Within industry, datasets are often private, limiting the ability to audit machine learning
    models and the accuracy of training data labels. Although industry has access to vast amounts of voice
    data from users, it lacks access to accurate clinical data or demographic information. This deficiency
    limits the ability to annotate data for AI training, to compare algorithmic outputs with criterion
    standard medical assessment, and prevents external auditing of datasets used for training to ensure
    fair representation of diverse populations.
- id: d4d:VOICE-gap-pediatric-data-scarcity
  name: Scarcity of open pediatric voice and speech datasets
  description: Gap addressed specifically by the pediatric dataset.
  response: Despite the clinical importance of detecting pediatric communication disorders such as autism
    spectrum disorder and speech delays, the availability of large-scale pediatric databases remains limited.
    Data collection in pediatric populations poses unique challenges such as privacy issues, consent processes,
    and the need for developmentally appropriate tasks. These factors have contributed to the lack of
    publicly available pediatric datasets that enable machine learning for pediatric voice analysis.
