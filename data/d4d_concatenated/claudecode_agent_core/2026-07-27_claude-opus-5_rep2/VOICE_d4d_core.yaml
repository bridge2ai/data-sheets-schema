instances:
- id: d4d:VOICE-instance-adult-participant
  name: Adult participant (b2ai-voice)
  description: Instances of the adult Bridge2AI-Voice dataset.
  instance_type: person
  counts: 833
  label: true
  label_description: Diagnostic labels are the result of a clinical assessment of the participant. At
    each site, a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up. For the psychiatric disorders cohort, this assessment was determined by using the participant's
    EHR record or an active prescription, done outside of data collection by an appropriately licensed
    clinician. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
    psychiatric conditions, and respiratory disorders, plus controls.
  missing_information:
  - id: d4d:VOICE-missing-adult-optional-questions
    name: Optional and diagnosis-specific questionnaire items
    missing:
    - Responses to optional questionnaire items
    - Responses to questions not relevant to a participant's primary diagnostic category
    - Rows for participants for whom every column of a phenotype file is missing
    why_missing:
    - Some questions are optional.
    - There may be data collection irregularities that caused some information to be missing from individual
      instances.
    - Each individual answered a common set of questions and then responded to additional questions relevant
      to their primary diagnostic category.
    - Phenotype data files only contain rows for a participant if at least one column is not missing.
- id: d4d:VOICE-instance-pediatric-participant
  name: Pediatric participant (b2ai-voice-pediatric)
  description: Instances of the separate Bridge2AI-Voice Pediatric Dataset. This is a distinct PhysioNet
    project and a distinct cohort from the adult dataset; the counts must not be combined with the adult
    count.
  instance_type: person
  counts: 300
  label: true
  label_description: Pediatric participants are grouped by age. The pediatric protocol collected demographic
    information, voice and speech related questionnaires, and questionnaires inquiring about medical history.
- id: d4d:VOICE-instance-pediatric-recording
  name: Pediatric derived audio recording
  description: Derived audio recordings released in the Bridge2AI-Voice Pediatric Dataset v1.1.0.
  instance_type: derived audio recording
  counts: 23533
subpopulations:
- id: d4d:VOICE-subpopulations
  name: Demographic and disease-cohort subpopulations
  subpopulation_elements_present: true
  identification:
  - Age
  - Gender
  - Sex
  - Ethnicity
  - Socioeconomic status
  - Race
  - Primary language
  - Self-reported disability status
  distribution:
  - 'Data acquisition is focused on five disease cohort categories: Voice Disorders; Neurological and
    Neurodegenerative Disorders; Mood and Psychiatric Disorders; Respiratory disorders; and Pediatric
    Voice and Speech Disorders. Participants without the identified conditions are also enrolled as controls.'
  - The public data releases do not contain an equal distribution of these categories of diseases; further
    releases will contain additional data.
  - The adult dataset has skews based on disorder category, site, and other demographic factors. Users
    should consider the multivariate distribution when assessing utility for different questions.
  - Pediatric participants are recruited strictly from the Hospital for Sick Children (SickKids) and are
    grouped by age; the pediatric release covers ages 2 to 18.
sensitive_elements:
- id: d4d:VOICE-sensitive-elements
  name: Sensitive data elements
  sensitive_elements_present: true
  sensitivity_details:
  - 'Racial or ethnic origins: the dataset includes race information.'
  - 'Sexual orientations: the dataset includes sexual orientation information.'
  - 'Financial or health data: the dataset includes socioeconomic and health information.'
  - All sensitive fields were removed from the dataset at the v3.0.0 de-identification stage; these correspond
    to data elements encoded as sensitive (column name "Identifier?") in the REDCap data dictionary.
  - Non-identifying elements of data that revealed highly sensitive information, such as household income,
    mental health status, and traumatic life experiences, were removed.
confidential_elements:
- id: d4d:VOICE-confidentiality
  name: Confidential data elements
  confidential_elements_present: false
  confidentiality_details:
  - 'Healthsheet answer on whether the dataset contains data that might be considered confidential (for
    example protected by legal privilege or doctor-patient confidentiality): "No".'
  - The Data Transfer and Use Agreement records that the data are covered under a Certificate of Confidentiality,
    which must be asserted against compulsory legal demands such as court orders and subpoenas for identifying
    information or characteristics of a research participant.
  - The Data Transfer and Use Agreement records that the Data are Personally Identifiable Information
    as defined in OMB Memorandum M-07-16 and are not covered under HIPAA, FERPA, or similar laws requiring
    additional special terms.
content_warnings:
- id: d4d:VOICE-content-warnings
  name: Potentially offensive content in free speech transcription
  content_warnings_present: true
  warnings:
  - This dataset includes the transcription of free speech tasks. While the inclusion of offensive, insulting
    or threatening information is unlikely, it cannot be completely avoided, as research participants
    are responsible for their choice of language.
  - In the adult v3.0.0 and v3.1.0 releases, spectrograms and similar features were excluded if the audio
    contained free speech, and transcriptions, EMAs and PPGs from open-response prompts were removed from
    the feature-only dataset.
  - For the pediatric v1.1 release, audio features for all free speech tasks were manually checked for
    the presence of unconsented speakers and personally identifiable information before release.
anomalies:
- id: d4d:VOICE-anomalies
  name: Errors, noise and redundancy
  anomaly_details:
  - Different sites have different collection configurations.
  - The collection protocol changed over the course of the study.
  - 'Confounding factors that may be present in the data: noise artifacts, variations in diagnostic practices,
    inaccurate questionnaire responses, and underreporting.'
  - The data were recorded with a head-mounted headset with a microphone that could be at slightly different
    distances. The clinical diagnosis, depending on the disorder, was performed by one clinician or based
    on an EHR record or prescription.
  - Distinct iPad devices were used at each site.
  - Participants were screened for different disorders based on site, so they also had their data collected
    with different devices.
  - Changes in diagnostic criteria or practices could be a source of distribution shift over time.
  - In the adult v3.1.0 release, some files, whether due to length or other issues, could not generate
    certain features and so are not included in the bundled data; the same statement is made for the pediatric
    v1.1 release.
  - The v3.1.0 release notes record that broken parquet files from the previous release were fixed.
  - In the pediatric cohort, a headset was used to record for most participants, while the remaining recordings
    used the built-in tablet microphone due to low tolerance of wearing headphones or existing complex
    medical conditions.
known_biases:
- id: d4d:VOICE-bias-selection
  name: Clinic-based recruitment and trust-related non-participation
  bias_type: selection_bias
  bias_description: Participants are recruited across different academic institutions from "high volume
    expert clinics" based on diagnosis and inclusion/exclusion criteria, and pediatric participants are
    recruited strictly from the Hospital for Sick Children. Groups that have less trust in the medical
    system or in AI, or who are less proximal to the collection sites, would have been less likely to
    be recruited.
  mitigation_strategy: The IRB protocol describes a Plan for Enhancing Diverse Perspectives and planned
    partnerships with Community Outreach Clinics serving underserved and under-represented populations,
    plus recruitment through flyers, social media, and the FlowTrials platform.
  affected_subsets:
  - All disease cohorts
- id: d4d:VOICE-bias-representation
  name: Limited geographic and linguistic representation
  bias_type: representation_bias
  bias_description: The data are not representative because they were collected at a limited number of
    geographic locations. There are five recording sites in the adult dataset, all in the USA and Canada,
    and the released protocol is English-only. The dataset skews by disorder category, site, and other
    demographic factors.
  mitigation_strategy: The project states that it hopes to make the data more representative by shifting
    to remote collection and designing the recruiting approach in a way that controls for more variables,
    and that Spanish versions of the protocol are under development for future releases.
  affected_subsets:
  - All disease cohorts
- id: d4d:VOICE-bias-measurement
  name: Site-dependent devices and diagnostic practice
  bias_type: measurement_bias
  bias_description: Distinct iPad devices were used at each site and participants were screened for different
    disorders based on site, so device and disorder are confounded. Headset microphone distance varied.
    Clinical diagnosis, depending on the disorder, was performed by one clinician or based on an EHR record
    or prescription, and variations in diagnostic practice are listed as a confounder.
  affected_subsets:
  - All disease cohorts
- id: d4d:VOICE-bias-sampling
  name: Non-probability sampling
  bias_type: sampling_bias
  bias_description: The study metadata records the sampling method as a non-probability sample, and the
    dataset is described as a sample of a larger, ongoing collection rather than a complete enumeration.
known_limitations:
- id: d4d:VOICE-limitation-representativeness
  name: Not representative of a larger population
  limitation_type: representativeness_limitation
  limitation_description: The dataset is a sample of a larger, ongoing collection. The data are not representative
    because they were collected at a limited number of geographic locations, and the public releases do
    not contain an equal distribution of the five disease categories.
  scope_impact: Limits generalization of models trained on the dataset to broader or differently distributed
    populations.
  recommended_mitigation: Users should consider the multivariate distribution when assessing utility for
    different questions.
- id: d4d:VOICE-limitation-language-coverage
  name: English-only protocol
  limitation_type: coverage_limitation
  limitation_description: English language was used for communication with study participants, and the
    exclusion criteria include not reading or speaking English. The healthsheet states that the only language
    option for v2.0.0 was English and that Spanish versions of the protocol are under development. The
    IRB protocol was updated in February 2025 to include data collection from Spanish language speakers,
    and the project documentation states that Spanish protocols and data collection will be included in
    future releases.
  scope_impact: The released cohorts contain fluent English speakers only.
- id: d4d:VOICE-limitation-no-raw-audio
  name: Raw audio excluded from the public releases
  limitation_type: scope_limitation
  limitation_description: Both the adult and the pediatric PhysioNet releases contain derived features
    from the audio waveforms and do not contain raw audio. The dataset has been de-identified through
    removal of all audio data and certain sensitive fields identified by a team of ethicists. Spectrograms,
    Mel spectrograms, MFC coefficients, PPGs and EMAs for sensitive records and audio checks have been
    removed, and spectrogram-like features were excluded where the audio contained free speech.
  scope_impact: Analyses that require the original waveform cannot be performed on the PhysioNet releases
    alone.
  recommended_mitigation: Raw audio is available through a separate controlled-access process; requests
    go to the Bridge2AI-Voice Data Access Compliance Office at DACO@b2ai-voice.org, and approved raw audio
    is distributed via Synapse.
- id: d4d:VOICE-limitation-no-external-multimodal-data
  name: External multimodal data not released
  limitation_type: scope_limitation
  limitation_description: The rest of the multimodal data, including imaging, genomic data for the neuro
    cohort, laryngoscopy imaging, and other EHR data, is extracted from different sites independently
    and uploaded through the REDCap database, but the project documentation states that no external data
    is released in the v3.0.0 release.
  scope_impact: The released dataset covers acoustic features and phenotype data, not the linked imaging
    or genomic modalities described in the protocol.
- id: d4d:VOICE-limitation-single-labeler
  name: Single labeler per instance and unaudited automated derivations
  limitation_type: methodological_limitation
  limitation_description: A single labeler provided a label per instance, typically the clinician at the
    site of data collection or a clinician external to it for a prior diagnostic assessment, so no inter-annotator
    agreement is available. Certain aspects of the data, for example transcription, were generated using
    off-the-shelf models that have not been audited for correctness. Human-level performance in the applications
    the dataset is meant to address is stated to vary widely.
  scope_impact: Label quality cannot be quantified through annotator agreement, and derived transcriptions
    carry unquantified error.
- id: d4d:VOICE-limitation-k-anonymization
  name: K-anonymization not achieved
  limitation_type: methodological_limitation
  limitation_description: The de-identification metadata records that the dataset does not achieve K-anonymization
    (k>=2), although direct identifiers are removed, HIPAA de-identification rules are applied, dates
    are rebased or replaced by integers, geographic information is removed or generalized, and narrative
    text fields are removed.
  scope_impact: Residual re-identification risk is managed through access control rather than through
    formal anonymity guarantees.
  recommended_mitigation: Access is restricted to credentialed users who sign the data use agreement,
    and raw voice data is disseminated only under controlled access.
- id: d4d:VOICE-limitation-protocol-drift
  name: Protocol and site configuration changed during collection
  limitation_type: temporal_limitation
  limitation_description: The collection protocol changed over the course of the study and different sites
    have different collection configurations. Changes in diagnostic criteria or practices could be a source
    of distribution shift over time.
  scope_impact: Comparisons across sites or collection periods may be confounded by protocol and configuration
    differences.
acquisition_methods:
- id: d4d:VOICE-acquisition
  name: How instance data were acquired
  was_directly_observed: true
  was_reported_by_subjects: true
  was_inferred_derived: true
  was_validated_verified: true
  acquisition_details:
  - The data were directly observable and reported by subjects.
  - Clinical diagnoses were verified by clinicians reviewing audio and/or imaging data, looking at electronic
    health records, or medication prescriptions.
  - Clinical validation is performed by a qualified physician or practitioner based on established gold
    standards for diagnosis.
  - Released feature data are derived from the raw audio rather than observed directly.
  - Participants who consent also permit investigators to access medical information through EHR platforms
    in order to perform gold standard validation of diagnoses and symptoms.
collection_mechanisms:
- id: d4d:VOICE-collection-mechanism-adult-app
  name: Bridge2AI-Voice application on tablet
  mechanism_details:
  - Voice samples are collected prospectively using a custom software application (the Bridge2AI-Voice
    App) with the Bridge2AI-Voice protocols.
  - The data were collected using an iPad app; data collection was conducted using a custom application
    on a tablet with a headset used for data collection when possible.
  - Data is collected on iPads (9th or 10th generation) and iPad Air (5th generation) using an Avid AE-36
    microphone and an Apple dongle to connect it to the iPad.
  - HVEC and remote data collection occur through two platforms, the Bridge2AI Voice Web app and the Bridge2AI
    Voice iOS app. The iOS app is restricted to iOS-compatible devices, while the Web app can run on a
    computer, tablet, or phone device. No software is downloaded or installed. Both apps are HIPAA-compliant
    and only store data during the collection phase; the data are removed as soon as the page is closed
    and there is no login required. Data are sent over a secure https protocol to a HIPAA-compliant storage
    server.
  - A total of 22 acoustic tasks are recorded through the app for adults.
  - Detailed demographic data and surveys about confounding factors such as smoking and drinking history
    are collected through the smartphone application, along with validated questionnaires for each disease
    category.
- id: d4d:VOICE-collection-mechanism-pediatric-reproschema
  name: reproschema-ui for the pediatric cohort
  mechanism_details:
  - For pediatrics, all data is collected using reproschema-ui with the Bridge2AI-Voice pediatric protocol.
  - All pediatric data was collected through customized software, reproschema-ui, on tablets. A headset
    was used to record for most participants, while the remaining recordings used the built-in tablet
    microphone.
  - For pediatric participants without adequate comprehension and familiarity with their past medical
    history, parents or decision-makers completed the survey during the recording on a separate tablet.
- id: d4d:VOICE-collection-mechanism-redcap
  name: REDCap database and data dictionary
  mechanism_details:
  - Full data acquisition protocols are available in the REDCap instrument Shared Library and for download
    at https://github.com/eipm/bridge2ai-redcap.
  - Study data are entered into a REDCap database as part of the Case Report Form; identifiable PHI is
    kept on REDCap databases with password protected access only for investigators at the institution
    where the data is collected.
  - Multimodal data extracted from sites, including imaging, genomic data for the neuro cohort, laryngoscopy
    imaging and other EHR data, is uploaded through the REDCap database.
  - Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap format, and
    subsequently converted to the Brain Imaging Data Structure (BIDS).
sampling_strategies:
- id: d4d:VOICE-sampling-strategy
  name: Cohort-based non-probability sampling
  is_sample: true
  is_random: false
  is_representative: false
  source_data:
  - Patients presenting at specialty clinics and institutions in the USA and Canada.
  - Pediatric patients and healthy volunteers at the Hospital for Sick Children, including non-patients
    recruited through research postings.
  why_not_representative:
  - It is a sample of a larger, ongoing collection. The data is not representative because it was collected
    at a limited number of geographic locations.
  strategies:
  - 'Sampling method recorded in the study metadata: non-probability sample.'
  - Patients were selected based on membership to five predetermined groups (respiratory disorders, voice
    disorders, neurological disorders, mood disorders, pediatric).
  - Participants are recruited from high volume expert clinics, defined in the project documentation as
    outpatient clinics within hospital systems or academic institutions that have developed expertise
    in a specific disease area and see more than 50 patients per month from the same disease category,
    and in the IRB protocol as clinics with multidisciplinary programs targeted to the listed disease
    cohorts and a volume of over 1000 patients per year.
  - Patients presenting at the given clinic were screened for inclusion and exclusion criteria prior to
    their visit by the project investigators.
  - Pediatric eligibility required 2 to 18 years of age and English proficiency; exclusion criteria included
    being over 18 years of age and being non-verbal.
  - The project hopes to make the sample more representative by shifting to remote collection and designing
    the recruiting approach in a way that controls for more variables.
data_collectors:
- id: d4d:VOICE-data-collectors
  name: Research teams and clinicians at participating sites
  role: Data acquisition and clinical validation
  collector_details:
  - Data is collected in the clinic with the assistance of a trained research assistant.
  - Research teams, which may include medical, graduate, or undergraduate students, coordinated with clinicians
    and doctors to identify appropriate participants.
  - These clinicians and doctors were listed under IRB as co-investigators and were added to the consortium
    so that their names are included on consortium-level publications that emerge from the research.
  - Hospital staff were not involved in scheduling but assisted in the logistics of coordinating data
    collection.
  - Clinical validation is performed by a qualified physician or practitioner based on established gold
    standards for diagnosis.
  - The team hired 2 acoustic engineers and 3 AI data scientists to analyse all samples from the year
    1 exploratory data collection phase to ensure acoustic quality and machine-learning readiness.
collection_timeframes:
- id: d4d:VOICE-collection-timeframe
  name: Data collection timeframe
  timeframe_details:
  - 'Healthsheet answer on the timeframe over which the data was collected: "The data was collected over
    a period of 12 months."'
  - The IRB protocol describes a prospective cohort study over 4 years involving 11 different academic
    sites across the US, with a phased approach; phase 1 (exploratory) data collection for up to 180 participants
    completed November 2023, phase 2 (pilot) began November 2023 and was ongoing in November 2024, followed
    by phase 3 (expansion) and phase 4 (outreach).
  - The NIH RePORTER record gives a project start of 2022-09-01 and a project end of 2026-11-30 for core
    project OT2OD032720.
  - Study duration for individual participants is up to 4 years, with longitudinal collection at intervals
    of 1-6 months for certain progressive or degenerative disease cohorts.
missing_data_documentation:
- id: d4d:VOICE-missing-data
  name: Missing data patterns and handling
  missing_data_patterns:
  - Some questionnaire items are optional and are therefore missing for some participants.
  - Each individual answered a common set of questions and then responded to additional questions relevant
    to their primary diagnostic category, so items outside a participant's category are absent.
  - Phenotype data files only contain rows for a participant if at least one column is not missing.
  - Some audio files, whether due to length or other issues, could not generate certain features and so
    are not included in the bundled data.
  missing_data_causes:
  - Optional questions.
  - Data collection irregularities.
  - Diagnosis-specific branching of the questionnaire protocol.
  - Removal of sensitive records, audio checks and free-speech-derived features during de-identification.
  - Feature extraction failures for particular recordings.
  handling_strategy: The dataset has been audited internally for missingness and consistency by the data
    release team, and a missingness table is included with the dataset. The documented audit protocol
    includes generating missingness tables, checking distributions and outliers, checking categorical
    responses against the schema, and running quality control metrics for audio tasks.
raw_data_sources:
- id: d4d:VOICE-raw-source-audio
  name: Raw voice, speech, cough and breathing recordings
  source_description: Raw audio recorded from participants performing the Bridge2AI-Voice acoustic tasks
    on a tablet, together with questionnaire responses retrieved from ReproSchema-UI or exported from
    REDCap.
  source_type:
  - Prospectively recorded audio
  - Questionnaire responses
  access_details: The raw data, post de-identification, is saved and is not accessible publicly. Raw audio
    is disseminated through controlled access only, to protect participants' privacy. Users interested
    in accessing the audio data from any Bridge2AI-Voice dataset can request access by emailing the Data
    Access Compliance Office at DACO@b2ai-voice.org; accessing raw audio requires institutional sign off.
    Approved raw audio is made available via Synapse.
  raw_data_format:
  - WAV audio files organized in a Brain Imaging Data Structure v1.9.0 layout as sub-<participant_id>/ses-<participant_id>/audio/sub<participant_id>_ses<participant_id>_task-<task_name>.wav
    with a matching .json sidecar
  - REDCap and ReproSchema-UI questionnaire exports
- id: d4d:VOICE-raw-source-ehr
  name: Electronic health record and multimodal clinical data
  source_description: Existing clinical data reviewed and collected from participants' charts at the collection
    sites for gold standard validation of diagnoses.
  source_type:
  - Electronic health record extraction
  - Retrospective imaging
  access_details: Imaging is collected from patient charts only; no additional imaging is performed in
    the study. The rest of the multimodal data, including imaging, genomic data for the neuro cohort,
    laryngoscopy imaging and other EHR data, is extracted from different sites independently and uploaded
    through the REDCap database. No external data is released in the v3.0.0 release.
  raw_data_format:
  - Laryngoscopy images and stroboscopy videos
  - Chest X-rays, brain CT and brain MRI
  - Spirometry and flow volume loops
  - Whole genome sequencing (collected only at the University of Toronto and Mount Sinai Hospital under
    a separate research ethics board approval)
raw_sources:
- id: d4d:VOICE-rawdata-synapse-adult
  name: Adult raw audio on Synapse
  access_url: https://www.synapse.org/Synapse:syn72370534/
  raw_data_details:
  - Raw audio data access for the Bridge2AI Voice adult cohort is via Synapse; the PhysioNet project does
    not contain raw audio.
  - Accessing raw audio is a more involved process and requires institutional sign off; requests go to
    the access committee at DACO@b2ai-voice.org.
- id: d4d:VOICE-rawdata-synapse-pediatric
  name: Pediatric raw audio on Synapse
  access_url: https://www.synapse.org/Synapse:syn73617068
  raw_data_details:
  - Raw audio data access for the Bridge2AI Voice pediatric cohort is via Synapse; the pediatric PhysioNet
    project does not contain raw audio.
  - Accessing raw audio is a more involved process and requires institutional sign off; requests go to
    the access committee at DACO@b2ai-voice.org.
ethical_reviews:
- id: d4d:VOICE-ethical-review-usf
  name: University of South Florida Single IRB
  review_details:
  - Data collection and sharing was approved by the University of South Florida Institutional Review Board.
  - 'Study metadata oversight answer: submitted and approved by the USF Single IRB and subsite IRBs through
    the Single IRB process.'
  - All US-based institutions abide by the Single IRB process; once the protocol is approved at USF, each
    participating institution submits review based on the Single IRB at USF.
  - The IRB protocol "Bridge2AI Voice Data Acquisition" is version V1 dated January 17, 2023, with a documented
    revision history through V13 dated July 11, 2025. V2 (May 3, 2023) was modified to include the pediatric
    cohort under the single IRB.
  - A partial HIPAA waiver was requested for recruitment purposes to allow the study team to review EHR
    information for incoming clinic patients ahead of their appointments.
  - 'Study metadata oversight answers: the clinical study is not for a drug product, is not for a medical
    device, and no data monitoring committee was appointed.'
  contact_person: d4d:person-bensoussan-yael
  reviewing_organization: d4d:org-usf-irb
- id: d4d:VOICE-ethical-review-sickkids
  name: Hospital for Sick Children Research Ethics Board
  review_details:
  - Data collection and sharing for the pediatric dataset was approved by the Research Ethics Board at
    the Hospital for Sick Children.
  - Canadian institutions (Mount Sinai Hospital, SickKids and the University of Toronto) do not abide
    by the Single IRB process and apply for a separate research ethics board application to comply with
    Canadian regulations; a copy of the approved application is submitted to the USF IRB.
  reviewing_organization: d4d:org-sickkids-reb
- id: d4d:VOICE-ethical-review-genomic
  name: Separate Canadian REB for genomic data collection
  review_details:
  - Genomic data is collected and analyzed only at the University of Toronto and Mount Sinai Hospital
    in Canada; that team has a separate protocol for genomic data collection and analysis, and once approved
    a copy of the protocol and research ethics board approval is submitted to the USF IRB.
  - No biological specimens are collected at USF for this portion of the study.
  reviewing_organization: d4d:org-uoft
data_protection_impacts:
- id: d4d:VOICE-data-protection-impact
  name: Impact analysis on data subjects
  impact_details:
  - 'Healthsheet answer on whether an analysis of the potential impact of the dataset and its use on data
    subjects has been conducted: "No".'
  - A memorandum titled "Ethical Justification for Controlled Access to Raw Voice Data Samples" is published
    with the project documentation and explains the reasoning behind the governance structure.
  - The consortium is addressing the growing ethical, legal, and social challenges surrounding voice AI,
    including risks of voice re-identification, vulnerabilities such as voice AI hacking, concerns around
    voice data sharing and privacy, and the influence of gender and racial diversity on the development
    and application of these technologies.
human_subject_research:
  id: d4d:VOICE-human-subject-research
  name: Human subject research status
  involves_human_subjects: true
  irb_approval:
  - University of South Florida Institutional Review Board approval for the Bridge2AI Voice Data Acquisition
    protocol, through the Single IRB process with subsite IRBs.
  - Research Ethics Board approval at the Hospital for Sick Children for the pediatric dataset.
  - Separate Canadian research ethics board approval at the University of Toronto and Mount Sinai Hospital
    for genomic data collection.
  - University of South Florida Institutional Review Board number 004890 for the separate Bridge2AI-Voice
    application feasibility study conducted at the USF Health Voice Center between June 5, 2023 and July
    28, 2023.
  ethics_review_board:
  - University of South Florida Institutional Review Board (single IRB of record for US sites)
  - Hospital for Sick Children Research Ethics Board
  special_populations:
  - Children aged 2 to 18 in the pediatric cohort, enrolled only through pediatric sites and not at USF.
  - Participants with cognitive impairment, dementia and other neurodegenerative conditions.
  - Participants with mood and psychiatric disorders, for whom some questions can lead to possible discomfort
    and could trigger negative emotions.
  - The IRB protocol states that students, employees, and wards of the state are neither specifically
    included nor excluded.
  regulatory_compliance:
  - HIPAA; identifiable PHI is kept on password-protected REDCap databases, apps are HIPAA-compliant,
    and data is hosted on HIPAA-protected cloud servers through NIH STRIDES partners (Amazon, Google,
    Microsoft).
  - Certificate of Confidentiality, recorded in the Data Transfer and Use Agreement as covering the data.
  - USF and NIH record retention regulations; de-identified study data and original consent forms must
    be stored for a minimum of 5 years after study completion.
  - Good Clinical Practice guidelines.
informed_consent:
- id: d4d:VOICE-informed-consent
  name: Informed consent process
  consent_obtained: true
  consent_type:
  - Written informed consent on paper
  - Electronic consent within the app or through REDCap surveys
  - Video-recorded consent within the app
  - Parental permission with child assent for pediatric participants
  consent_documentation:
  - Paper consent documents are uploaded and saved electronically in REDCap; all paper and electronic
    versions of consent are stored for a minimum of 5 years after the completion of the study, following
    required USF procedure.
  - All study related material at USF is stored through the Florence platform in accordance with USF and
    NIH regulations.
  - About 30 minutes is spent explaining the study and consent in detail with time for questions or comments,
    and potential participants are asked to explain what they have understood to the research assistant
    to confirm their understanding.
  withdrawal_mechanism:
  - Participants may withdraw from the study at any point; if withdrawal occurs during or before voice
    data collection, their data will not be included in the database.
  - Once the voice data collection process is completed, research data including voice recordings cannot
    be removed from the database.
  consent_scope:
  - Consent covers collection of acoustic, demographic and clinical data and sharing of de-identified
    data through an open-source database.
  - Consent covers investigator access to medical information through EHR platforms in order to perform
    gold standard validation of diagnoses and symptoms.
  - Within the consent process, individuals are asked if they agree to be contacted in the future for
    further voice data collection; contact information provided under that option is stored within the
    institutional database only and is not shared with other centers or uploaded to the cloud.
at_risk_populations:
  id: d4d:VOICE-at-risk-populations
  name: At-risk and vulnerable populations
  at_risk_groups_included: true
  special_protections:
  - Pediatric patients are enrolled only through the pediatric sites and not at USF; checklist HRP-416
    for children under 21 was completed and appended to the IRB protocol.
  - Compensation is provided to the adult population only.
  - Raw voice data is disseminated through controlled access only, to protect participants' privacy, because
    voice can never be fully de-identified.
  assent_procedures:
  - Children provide verbal assent where appropriate, and assent is documented.
  - Where young children cannot reasonably be asked to assent due to limitations in understanding from
    age and development, typically children under seven years of age, they are not asked to do so.
  guardian_consent:
  - Parents or guardians provide consent for children; parental permission is obtained from one or both
    parents, and because the research is minimal risk it does not require permission from both parents
    or legal guardians.
  - For the pediatric dataset, parental or participant consent was obtained prior to data collection and
    data sharing.
  - Exclusion criteria include, for pediatric participants, not receiving consent from a parent or guardian
    for de-identified voice and clinical data to be uploaded to an open-sourced database.
preprocessing_strategies:
- id: d4d:VOICE-preprocessing-audio-standardization
  name: Audio standardization and feature derivation
  preprocessing_details:
  - Raw audio was preprocessed by converting to monaural and resampling to 16 kHz with a Butterworth anti-aliasing
    filter applied.
  - 'Spectrograms: time-frequency representations computed using the short-time Fast Fourier Transform
    with a 25 ms window size, 10 ms hop length, and a 400-point FFT for the v3.0.0 and v3.1.0 releases;
    spectrograms were further downsampled by a factor of two in the time domain after derivation. The
    v1.1 release used a 512-point FFT.'
  - 'Mel-frequency cepstral coefficients: 60 MFCCs were extracted using the above spectrograms.'
  - 'Mel spectrogram: computed with the same parameters (25 ms window size, 10 ms hop length, 400-point
    FFT, and 60 Mel bins).'
  - 'Articulatory features: the Speech Articulatory Coding (sparc) package generates kinematic traces
    of vocal tract articulators and source features as well as measures of loudness, periodicity, and
    pitch, all gathered at 50 Hz.'
  - Acoustic features were extracted using OpenSMILE, capturing temporal dynamics and acoustic characteristics.
  - Phonetic and prosodic features were computed using Parselmouth and Praat, providing measures of fundamental
    frequency, formants, and voice quality.
  - 'Phonetic posteriorgrams: time-varying categorical distributions over acoustic units of speech at
    100 Hz were generated via the ppgs package.'
  - Transcriptions were generated using OpenAI's Whisper Large model.
  - The waveform-derived features are stored in two formats, a fixed feature format that includes static
    features extracted from the entire waveform, and a temporal format that varies for each audio file
    depending on the length of the recording.
  - The adult v3.1.0 release was generated with b2aiprep v3.0.0.
  used_software:
  - id: d4d:software-b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    description: The code used to preprocess the raw audio waveforms into the parquet files and to merge
      the source data into the phenotype files. Licensed Apache-2.0 according to the supporting materials
      listing.
    license: Apache-2.0
  - id: d4d:software-senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Processing audio files for research tasks.
  - id: d4d:software-opensmile
    name: openSMILE
    description: Speech and Music Interpretation by Large-space Extraction, used to extract acoustic features
      capturing temporal dynamics and acoustic characteristics.
  - id: d4d:software-praat
    name: Praat
    description: Used with Parselmouth to compute phonetic and prosodic features.
  - id: d4d:software-parselmouth
    name: Parselmouth
    description: Python interface to Praat used for phonetic and prosodic features.
  - id: d4d:software-torchaudio
    name: torchaudio
    description: Used to derive pitch contours, spectrograms, Mel spectrograms and MFCCs.
  - id: d4d:software-sparc
    name: Speech Articulatory Coding (sparc)
    description: Used to generate electromagnetic articulography estimates plus loudness, periodicity
      and pitch measures at 50 Hz.
  - id: d4d:software-ppgs
    name: ppgs
    description: Used to generate phonetic posteriorgrams across 40 phoneme categories at 100 Hz.
- id: d4d:VOICE-preprocessing-bids
  name: Conversion to Brain Imaging Data Structure
  preprocessing_details:
  - The raw audio files and the questionnaire data retrieved from ReproSchema-UI or exported from REDCap
    were converted to be compliant with the Brain Imaging Data Structure v1.9.0.
  - Pediatric data collected through ReproSchema-UI is extracted and transformed into REDCap format, and
    subsequently converted to the Brain Imaging Data Structure.
  - Data were exported and converted from REDCap using an open source library developed by the team.
- id: d4d:VOICE-preprocessing-deidentification
  name: De-identification preprocessing
  preprocessing_details:
  - 'Healthsheet answer on whether there was pre-processing for de-identification of patients: "Yes, the
    data were extracted from the raw audio to limit re-identification and only the extracted features
    are being released with the dataset."'
  - Raw audio transcripts were reviewed, and any audio recordings that contained potentially identifying
    information and external voices were removed from the release.
  - All sensitive fields were removed from the dataset at the v3.0.0 stage; these correspond to data elements
    encoded as sensitive (column name "Identifier?") in the REDCap data dictionary.
  - All spectrograms, MFCCs, Mel spectrograms, transcriptions, EMAs and PPGs from open-response prompts
    were removed from the feature-only dataset.
  - For the pediatric v1.1 release, audio features for all free speech tasks were manually checked for
    the presence of unconsented speakers and personally identifiable information.
  - 'Healthsheet answer on whether instances were excluded at the time of preprocessing: "No".'
  - 'Healthsheet answer on whether the raw data post de-identification was saved in addition to the preprocessed
    data: "Yes, it is saved and is not accessible publicly."'
cleaning_strategies:
- id: d4d:VOICE-cleaning
  name: Data cleaning and quality control
  cleaning_details:
  - 'Healthsheet answer on whether there was pre-processing for cleaning the data: "No".'
  - 'The documented audit protocol is: generate missingness tables; check distributions and outliers;
    for categorical responses, check against schema; for audio tasks, run quality control metrics; for
    waveforms, check amount of silence and duration; for speech, check produced speech relative to the
    intended passage.'
  - The dataset has been audited internally for missingness and consistency by the data release team,
    and a missingness table is included with the dataset.
  - The smartphone application for voice data collection includes models to ensure acoustic data quality
    including volume standardization and noise cancellation.
  - Quality control of the data is performed throughout the four years of the project; in years 2 to 4,
    10 percent of the data is selected at random every month for quality control and machine-learning
    readiness.
  - The v3.1.0 release adds an audio_quality_metrics.tsv file containing one quality control feature per
    audio recording.
  used_software:
  - id: d4d:software-b2aiprep
    name: b2aiprep
    version: 3.0.0
    url: https://github.com/sensein/b2aiprep
    license: Apache-2.0
    description: Organizing and preprocessing the dataset.
  - id: d4d:software-senselab
    name: SenseLab
    url: https://github.com/sensein/senselab
    description: Processing audio files for research tasks.
labeling_strategies:
- id: d4d:VOICE-labeling
  name: Clinical gold-standard labeling
  data_annotation_platform:
  - REDCap clinical validation instruments
  - Electronic health record review
  data_annotation_protocol:
  - Gold standard label available in the data, diagnosed by a clinician.
  - Guidelines followed are the Bridge2AI protocols and ICD-10 codes.
  - Clinical validation is performed by a qualified physician or practitioner based on established gold
    standards for diagnosis; documented gold standard validation methods include laryngoscopy images and
    stroboscopy videos for voice disorders, spirometry and flow volume loops and CT for respiratory disorders,
    brain CT, brain MRI, serum p-tau biomarkers and whole genome sequencing for neurological disorders,
    and electronic health summary, psychiatrist diagnosis and medication history for mood and psychiatric
    disorders.
  annotations_per_item: 1
  annotator_demographics:
  - Typically the clinician at the site of data collection, or a clinician external to it for a prior
    diagnostic assessment.
  labeling_details:
  - Diagnostic labels are the result of a clinical assessment of the participant.
  - At each site, a local clinician provided the diagnosis based on a clinical interview and appropriate
    work-up.
  - For the psychiatric disorders cohort, the assessment was determined by using the participant's EHR
    record or an active prescription, which was done outside of data collection by an appropriately licensed
    clinician.
  - A single labeler per data item was considered, and one labeler provides a label per instance.
  - The v3.1.0 release updated validated diagnosis information across conditions with back-filled information,
    and renamed certain gold standard variable names.
  - 'Guidance for future labels: the process for any new labels should be described alongside any release
    of a model or publication, and this process should include the exact variables used for the determination.'
annotation_analyses:
- id: d4d:VOICE-annotation-analysis
  name: Annotation agreement and quality
  analysis_method: Single-labeler gold-standard clinical assessment; no inter-annotator agreement analysis
    is reported because one labeler provides a label per instance.
  annotation_quality_details:
  - How many labelers provide a label per instance is documented as 1, so agreement between labelers is
    not measured.
  - Human-level performance in the applications the dataset is supposed to address is stated to vary widely.
  - The dataset has been audited internally for missingness and consistency by the data release team.
machine_annotation_tools:
- id: d4d:VOICE-machine-annotation
  name: Automated derivation and transcription tools
  tools:
  - OpenAI Whisper Large
  - b2aiprep
  - SenseLab
  - openSMILE
  - Praat and Parselmouth
  - torchaudio
  - Speech Articulatory Coding (sparc)
  - ppgs
  tool_descriptions:
  - Transcriptions were generated using OpenAI's Whisper Large model.
  - b2aiprep organizes and preprocesses the dataset and merges source data into the phenotype files; SenseLab
    processes audio files for research tasks.
  - openSMILE, Praat, Parselmouth and torchaudio produce the static and time-varying acoustic feature
    sets.
  - sparc produces electromagnetic articulography estimates, loudness, periodicity and pitch; ppgs produces
    phonetic posteriorgrams.
  tool_accuracy:
  - Certain aspects of the data, for example transcription, were generated using off-the-shelf models
    that have not been audited for correctness.
  used_software:
  - id: d4d:software-whisper-large
    name: OpenAI Whisper Large
    description: Used to generate transcriptions from the standardized audio.
existing_uses:
- id: d4d:VOICE-existing-uses
  name: Existing uses of the dataset
  examples:
  - A restricted version of the dataset containing raw audio has been used in the Bridge2AI Summer School
    and hackathon.
  - Training opportunities for using the dataset are offered at https://www.b2aivoicescholars.org/.
use_repository:
- id: d4d:VOICE-use-repository
  name: Repository of works using the dataset
  repository_details:
  - 'Healthsheet answer on whether there is a repository that links to any or all papers or systems that
    use the dataset, besides Google Scholar: "No".'
  - 'Use of the dataset requires citation: Bensoussan, Yael, et al. "Developing Multi-Disorder Voice Protocols:
    A team science approach involving clinical expertise, bioethics, standards, and DEI." Proc. Interspeech
    2024.'
other_tasks:
- id: d4d:VOICE-other-tasks
  name: Other tasks the dataset could support
  task_details:
  - The dataset is structured to be Findable, Accessible, Interoperable, and Reusable (FAIR) and can be
    used for AI model pretraining, fine-tuning, benchmarking, or validation.
  - The questionnaire features distributed in the phenotype folder can be used for cohort selection.
  - The pediatric release is intended to enable study of developmental norms, creation of AI-driven tools
    for early screening, and clinical insight into pediatric communication disorders.
future_use_impacts:
- id: d4d:VOICE-future-use-impacts
  name: Composition and collection effects on future uses
  impact_details:
  - This dataset has skews based on disorder category, site, and other demographic factors. Users should
    consider the multivariate distribution when assessing utility for different questions.
  - Different sites have different collection configurations and the collection protocol changed over
    the course of the study.
  - Groups that have less trust in the medical system or in AI, or who are less proximal to the collection
    sites, would have been less likely to be recruited.
  - Participants were screened for different disorders based on site, so disorder and recording device
    are confounded.
  - The released feature set omits raw audio and, for free speech prompts, omits spectrogram-like features
    and transcriptions.
intended_uses:
- id: d4d:VOICE-intended-uses
  name: Intended research uses
  examples:
  - Developing, benchmarking, or validating clinically applicable machine-learning models for diagnosing
    health conditions using voice data, including vocal pathologies and neurological, psychiatric, respiratory,
    and pediatric voice disorders.
  - Supporting clinical research in disease screening, diagnosis, and monitoring through voice biomarkers.
  - AI model pretraining, fine-tuning, benchmarking, or validation.
  - Studying pediatric developmental norms for voice and speech.
  use_category:
  - Research
  usage_notes: The Bridge2AI Voice dataset is primarily intended for research applications, specifically
    in the development of AI and machine-learning models for healthcare. The dataset is intended solely
    for commercial and non-commercial research purposes by Authorized Researchers, as detailed in the
    Registered Access Agreement. Parquet feature files can be loaded with any library that supports parquet,
    for example the HuggingFace Datasets library, and spectrograms can be plotted in decibels after conversion
    from their power representation; phenotype TSV files can be loaded with any statistical analysis tool
    such as pandas.
discouraged_uses:
- id: d4d:VOICE-discouraged-uses
  name: Discouraged applications
  discouragement_details:
  - The dataset should not be used for non-clinical or non-research applications such as hiring decisions,
    insurance premium adjustments, or any form of surveillance that could lead to discrimination or harm.
  - These discouraged uses are intended to prevent unethical or biased outcomes that could negatively
    impact individuals based on their health conditions or voice characteristics.
  - The dataset is intended strictly for research that prioritizes patient safety, privacy, and ethical
    use.
prohibited_uses:
- id: d4d:VOICE-prohibited-uses
  name: Prohibited uses under the registered access agreement
  prohibition_reason:
  - The dataset is not to be used to attempt to re-identify research participants, nor for any actions
    that could reasonably lead to re-identification.
  - The dataset is not to be used for any purpose that could foreseeably cause harm or stigmatization
    to research participants, their families, communities, or specific populations.
  - Intellectual property protections, database rights, or related rights may not be used in a manner
    that restricts or limits access to any part of the dataset or to any conclusions derived from it,
    so that future use of the dataset remains unrestricted in alignment with the Open Science principles
    upheld by the B2AI-Voice Consortium.
  - Sale of all or part of the data on any media is not permitted.
  - Under the Data Transfer and Use Agreement, the recipient shall not disclose, release, sell, rent,
    lease, loan, or otherwise grant access to the data to any third party except authorized persons without
    the prior written consent of the provider; collaborators at other research organizations and other
    research teams at the same organization must apply independently for access and sign a Data Transfer
    and Use Agreement.
