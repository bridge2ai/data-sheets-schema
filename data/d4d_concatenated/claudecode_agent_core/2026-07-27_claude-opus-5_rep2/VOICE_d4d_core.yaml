id: d4d:VOICE
name: Bridge2AI-Voice
title: 'Bridge2AI-Voice: an ethically sourced, diverse voice dataset linked to health information (adult
  and pediatric releases)'
description: 'Bridge2AI-Voice is a Precision Public Health grand challenge data generation project funded
  by the NIH Common Fund Bridge2AI program. It produces standardized, ethically sourced voice, speech,
  cough and breathing recordings linked to multimodal health metadata, in order to support research on
  voice as a biomarker of health. Data are collected prospectively with a custom application at clinical
  sites across North America, together with detailed demographics, confounder surveys, validated patient-reported
  outcomes and questionnaires, and clinician-validated diagnoses.


  The project distributes TWO DISTINCT PhysioNet datasets, which are separate projects and separate participant
  cohorts rather than versions of one another:


  (1) the adult dataset "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
  information" (PhysioNet project b2ai-voice), whose current release is v3.1.0 (published 2026-05-01)
  containing data for 833 adult participants across five sites in North America; and


  (2) the "Bridge2AI-Voice Pediatric Dataset" (PhysioNet project b2ai-voice-pediatric), whose current
  release is v1.1.0 (published 2026-05-01) containing derived audio features for 23,533 recordings from
  300 participants aged 2 to 18, recruited at the Hospital for Sick Children (SickKids) under a separate
  pediatric protocol collected with reproschema-ui.


  Both PhysioNet releases contain derived audio features (spectrograms, Mel spectrograms, MFCCs, pitch,
  articulatory and phonetic features) plus phenotypic data, and deliberately exclude the original voice
  recordings. Raw audio for either cohort is distributed only under a separate controlled-access process,
  through Synapse, after review by the Bridge2AI-Voice Data Access Compliance Office.'
