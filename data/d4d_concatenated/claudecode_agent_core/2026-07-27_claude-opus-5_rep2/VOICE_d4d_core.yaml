    continued access to interested researchers.
  - The current adult and pediatric releases are distributed on PhysioNet; the project documentation describes
    HealthDataNexus as holding an earlier version of the feature-only dataset.
errata:
- id: d4d:VOICE-errata
  name: Errata and changelog
  erratum_details:
  - 'Healthsheet answer on whether there is an erratum: "There is no erratum. A changelog for each dataset
    version is published online with the dataset metadata."'
  - The adult v2.0.1 release notes record corrections in the authorship list.
  - The adult v3.1.0 release notes record that broken parquet files from the previous release were fixed,
    that validated diagnosis information was updated across conditions with back-filled information, and
    that certain gold standard variable names were renamed.
updates:
  id: d4d:VOICE-updates
  name: Update plan
  frequency: Semi-annual (twice a year)
  update_details:
  - Further versions of the dataset will be released on a semi-annual (twice a year) basis.
  - Users will be notified through news items on the platform as well as through standard communication
    channels.
  - 'Healthsheet answer on whether the dataset is released as static versions or is dynamically updated:
    "Static".'
  - The public data releases do not contain an equal distribution of the disease categories; further releases
    will contain additional data.
  - Spanish protocols and data collection will be included in future releases.
retention_limit:
  id: d4d:VOICE-retention-limits
  name: Retention limits
  retention_period: Indefinite for the shared research data; a maximum of 10 years after study completion
    for institution-held identifiable data.
  retention_details:
  - 'Healthsheet answer on retention limits: "Once data is contributed, the data will be retained as long
    as it is useful for research purposes, possibly indefinitely."'
  - Identifiable data and datasheets linking participant numbers to participant information are kept in
    each institution on local cloud storage for a maximum of 10 years after study completion and are then
    destroyed; this is the responsibility of each local principal investigator.
  - The USF IRB requires de-identified study data and original consent forms to be stored for a minimum
    of 5 years after the completion of the study; original paper consent documents cannot be destroyed
    until 5 years after study completion, even if uploaded into Florence.
  - All entries to the REDCap recruitment screening system are deleted once patients are enrolled, or
    within 90 days of their submission, whichever comes first.
  - Under the Data Transfer and Use Agreement, data shall be destroyed in accordance with the provider's
    instructions two years after the start date, upon completion of the project, upon termination, or
    upon expiration of the applicable ethics approval, whichever occurs first, and the recipient shall
    submit written certification of destruction within thirty days.
