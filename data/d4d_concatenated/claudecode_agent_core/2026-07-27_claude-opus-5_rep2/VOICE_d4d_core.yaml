extension_mechanism:
  id: d4d:VOICE-extension-mechanism
  name: Mechanism for extending or contributing to the dataset
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details:
  - For dataset extensions and augmentations, it is possible for others to publish a derivative dataset
    on the Health Data Nexus which references the original source; these derivative datasets may be made
    available under the same conditions as the source data.
  - For augmentations to the code used to produce the data, the open-source repositories have discussion
    forums and issue pages which allow for public discussion of data preprocessing, and the repository
    has a pull request mechanism for contributing improvements to the data preprocessing code.
  - Recipients are encouraged to make publicly available the results of their projects, in open-access
    journals or pre-print servers where possible.
