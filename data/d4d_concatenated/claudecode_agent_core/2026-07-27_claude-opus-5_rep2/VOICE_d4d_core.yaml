resources:
- id: d4d:VOICE-adult
  name: Bridge2AI-Voice adult dataset
  title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information'
  description: The adult Bridge2AI-Voice dataset, distributed as PhysioNet project b2ai-voice. The current
    release, v3.1.0 published 2026-05-01, contains data for 833 participants across five sites in North
    America. Participants were selected based on known conditions which manifest within the voice waveform
    including voice disorders, neurological disorders, mood disorders, and respiratory disorders, plus
    controls. The release contains data considered low risk, including derivations such as spectrograms
    but not the original voice recordings; detailed demographic, clinical, and validated questionnaire
    data are also made available. The project documentation states that v3.0 contains approximately 61,937
    voice-derived recordings from 833 adult participants. Version 3.1.0 is a minor update over 3.0.0 with
    no new participants but additional data for certain participants, repaired parquet files, new audio
    quality metrics and per-audio metadata, back-filled validated diagnosis information, and some phenotype
    file rearrangement and gold standard variable renaming.
  version: 3.1.0
  doi: 10.13026/8xbn-nq66
  download_url: https://physionet.org/content/b2ai-voice/3.1.0/
  issued: '2026-05-01T00:00:00Z'
  license: Bridge2AI Voice Registered Access License
  language: en
  page: https://physionet.org/content/b2ai-voice/
  publisher: https://physionet.org
  status: Current release of the adult PhysioNet project
  keywords:
  - health
  - biomarkers
  - bridge2ai
  - voice
  instances:
  - id: d4d:VOICE-instance-adult-participant
    name: Adult participant (b2ai-voice)
    description: Instances of the adult Bridge2AI-Voice dataset.
    instance_type: person
    counts: 833
    label: true
    label_description: Diagnostic labels are the result of a clinical assessment of the participant. At
      each site, a local clinician provided the diagnosis based on a clinical interview and appropriate
      work-up. For the psychiatric disorders cohort, this assessment was determined by using the participant's
      EHR record or an active prescription, done outside of data collection by an appropriately licensed
      clinician. Labels include diagnostic categories such as vocal pathologies, neurological disorders,
      psychiatric conditions, and respiratory disorders, plus controls.
  distribution_formats:
  - id: d4d:VOICE-adult-distribution-format
    name: PhysioNet credentialed-access distribution
    description: Apache Parquet binary feature files, TSV feature and phenotype tables, and JSON data
      dictionaries.
    access_urls:
    - https://physionet.org/content/b2ai-voice/3.1.0/
  version_access:
    id: d4d:VOICE-adult-version-access
    name: Adult version availability
    latest_version_doi: https://doi.org/10.13026/37yb-1t42
    versions_available:
    - 1.1 (Jan. 17, 2025), DOI 10.13026/249v-w155
    - 2.0.0 (April 16, 2025)
    - 2.0.1 (Aug. 18, 2025)
    - 3.0.0 (Dec. 16, 2025), DOI 10.13026/k81f-qr68
    - 3.1.0 (May 1, 2026), DOI 10.13026/8xbn-nq66
    version_details:
    - 'v3.1.0: minor update with no new participants, but some additional data released for certain participants;
      fixed broken parquet files from the previous release; adds files related to audio quality metrics
      and releases per-audio metadata; updated validated diagnosis information across conditions with
      back-filled information; some phenotypic files rearranged and certain gold standard variable names
      renamed.'
    - 'v3.0.0: a major update with new data for an additional 391 participants; the single phenotype data
      file was separated into individual files; additional features were provided from the sparc package
      as well as phonetic posteriorgrams from the ppgs package; the files were reorganized.'
    - 'v2.0.1: corrections in the authorship list.'
    - 'v2.0: provides data for an additional 136 new participants; spectrograms were reprocessed to fix
      minor issues identified in the previous release; all spectrograms and MFCCs from free speech related
      files were removed.'
    - 'v1.1: added Mel-frequency cepstral coefficients (MFCCs). As of v1.1, only data from the adult cohort
      was available. The files for v1.1 are no longer available on PhysioNet.'
    - 'v1.0: the first release of the Bridge2AI voice as a biomarker of health dataset, published on Health
      Data Nexus with DOI 10.57764/qb6h-em84. The v1.1 PhysioNet page states that v1.0, the initial release,
      provides 12,523 recordings for 306 participants collected across five sites in North America.'
  license_and_use_terms:
    id: d4d:VOICE-adult-license-and-use-terms
    name: Adult access terms
    license_terms:
    - 'Access policy for v3.0.0 and v3.1.0: only credentialed users who sign the DUA can access the files.
      No training required.'
