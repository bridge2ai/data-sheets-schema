known_biases:
- id: https://cm4ai.org/#bias-cell-line-representation
  name: Cell line derived data do not represent population variation
  bias_type: representation_bias
  bias_description: The release records state that data in the release were derived from commercially available
    de-identified human cell lines and do not represent all biological variants which may be seen in the population
    at large.
  affected_subsets:
  - MDA-MB-468 triple negative breast cancer cell line data
  - KOLF2.1J induced pluripotent stem cell line data
known_limitations:
- id: https://cm4ai.org/#limitation-interim-release
  name: Interim release
  limitation_type: temporal_limitation
  limitation_description: Every release documented here is an interim, Beta release; the release records state
    that these data are not yet in completed final form.
  scope_impact: 'Content and structure are expected to change: the release records state that the dataset will
    be regularly updated and augmented through the end of the project in November 2026.'
- id: https://cm4ai.org/#limitation-no-computed-cell-maps
  name: Computed cell maps not included
  limitation_type: coverage_limitation
  limitation_description: The releases do not contain predicted or computed cell maps, which the release records
    state will be added in future releases.
  scope_impact: The releases distribute the map-input data streams rather than the hierarchical cell maps that
    are CM4AI's headline deliverable.
- id: https://cm4ai.org/#limitation-incomplete-modality-overlap
  name: Incomplete overlap between modalities
  limitation_type: integration_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi
    perturb-seq data interrogate sets of proteins which incompletely overlap.
  scope_impact: The release records state that the current release is most suitable for bioinformatics analysis
    of the individual datasets rather than for joint multimodal analysis.
- id: https://cm4ai.org/#limitation-domain-expertise
  name: Domain expertise required
  limitation_description: The release records state that meaningful analysis of these data requires domain expertise.
- id: https://cm4ai.org/#limitation-embargo
  name: Some component datasets are embargoed
  limitation_type: coverage_limitation
  limitation_description: The release records state that some datasets are under temporary pre-publication embargo.
    In the October 2025 and June 2026 records the external data links for perturb-seq data in undifferentiated
    KOLF2.1J iPSCs and in MDA-MB-468 breast cancer cells are both marked "Embargoed".
confidential_elements:
- id: https://cm4ai.org/#confidentiality
  name: Confidential elements
  confidential_elements_present: false
  confidentiality_details: 'The release records state Human Subjects: No and De-identified Samples: Yes. The CM4AI
    project preprint states that CM4AI data are distinctive within Bridge2AI in that they are non-clinical, coming
    from tissue cultures, and are considered to be de-identified as they cannot be matched, with current knowledge,
    to a human subject.'
subpopulations:
- id: https://cm4ai.org/#subpopulations-cell-lines
  name: Cell lines, donors and conditions
  subpopulation_elements_present: true
  identification: 'The released data derive from two human cell lines whose donor characteristics the CM4AI project
    preprint states. MDA-MB-468 (RRID:CVCL_0419) is a triple negative breast cancer cell line established from
    a metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary adenocarcinoma,
    available from ATCC. KOLF2.1J (RRID:CVCL_B5P3) is an iPSC line derived from a healthy male Northern European
    donor, available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource. Within each line
    the data are further divided by condition: MDA-MB-468 untreated, paclitaxel-treated and vorinostat-treated;
    KOLF2.1J undifferentiated and differentiated into neural progenitor cells, neurons and cardiomyocytes.'
sensitive_elements:
- id: https://cm4ai.org/#sensitive-elements
  name: Sensitive elements
  sensitive_elements_present: false
  sensitivity_details: 'The Data Governance and Ethics block of the June 2025, October 2025 and June 2026 release
    records states Human Subjects: No, De-identified Samples: Yes, and FDA Regulated: No.'
acquisition_methods:
- id: https://cm4ai.org/#acquisition-apms
  name: Affinity purification mass spectrometry
  was_directly_observed: true
  acquisition_details: Protein-protein interactions of chromatin regulators are mapped by AP-MS on endogenously
    tagged cell lines under the cancer conditions no treatment, paclitaxel and vorinostat, and the iPSC conditions
    undifferentiated, neurons and cardiomyocytes. As reported in the May 2024 CM4AI project preprint, 17 genes
    had been endogenously tagged in MDA-MB-468 and AP-MS data acquired under three conditions (untreated, paclitaxel-treated
    and vorinostat-treated), with 34 additional genes in the process of being tagged at that time.
- id: https://cm4ai.org/#acquisition-secms
  name: Size exclusion chromatography mass spectrometry
  was_directly_observed: true
  acquisition_details: SEC-MS is used for proteome-wide complex and interaction mapping as an orthogonal mass
    spectrometry approach to AP-MS, and is performed in the Nevan Krogan laboratory at the University of California
    San Francisco. As reported in the May 2024 CM4AI project preprint, SEC-MS on MDA-MB-468 cells under three
    conditions identified 72 of 100 chromatin modifiers, 52 of them integral components of protein complexes,
    and detected interaction profiles of over a thousand complexes with thousands of proteins exhibiting differential
    elution profiles between control and paclitaxel- or vorinostat-treated cells. SEC-MS in KOLF2.1J iPSCs and
    derivatives uncovered more than 700 protein complexes in both parental iPSCs and differentiated neurons.
- id: https://cm4ai.org/#acquisition-if-imaging
  name: Immunofluorescence spatial proteomics imaging
  was_directly_observed: true
  acquisition_details: Spatial subcellular organization is mapped by immunofluorescence-based staining (ICC-IF)
    and confocal microscopy in the Lundberg Lab at Stanford University, using the Human Protein Atlas resource
    of antibodies. Nuclei are stained with DAPI, endoplasmic reticulum with a calreticulin antibody, microtubules
    with a tubulin antibody, and the protein of interest with a dedicated antibody, giving four channels per image.
    As reported in the May 2024 CM4AI project preprint, spatial proteomics mapping of 100 chromatin regulators
    in MDA-MB-468 cells with and without paclitaxel or vorinostat was complete at that time, with another 500
    proteins pending significant hits from the genetic perturbation and protein interaction results.
- id: https://cm4ai.org/#acquisition-crispr-perturbation
  name: CRISPR/Cas9 genetic perturbation screens
  was_directly_observed: true
  was_validated_verified: true
  acquisition_details: Single-cell CRISPR screens are performed using a CRISPR lentiviral library with six guide
    RNAs per gene, in MDA-MB-468 and KOLF2 lines engineered to express inducible dCas9, read out with the 10x
    Genomics 3'HT kit. The expressed genome-scale CRISPRi Perturbation Cell Atlas in undifferentiated KOLF2.1J
    hiPSCs maps transcriptional and fitness phenotypes associated with 11,739 targeted genes; the release record
    for that dataset states that the findings were validated via phenotypic, protein-interaction and metabolic
    tracing assays.
collection_mechanisms:
- id: https://cm4ai.org/#mechanism-deposition-archives
  name: Laboratory deposition archives feeding the MuSIC pipeline
  mechanism_details: Protein-protein interaction networks for each cell line and condition are downloaded from
    the Krogan Laboratory's deposition archive, and immunofluorescence images for each cell line and condition
    are downloaded from the Lundberg Laboratory's deposition archive, and made available for further processing
    by the Multi-Scale Integrated Cell (MuSIC) pipeline.
- id: https://cm4ai.org/#mechanism-automated-staining
  name: Automated fixation and permeabilization protocols
  mechanism_details: Automated fixation and permeabilization protocols were established for a pipetting robot
    for the MDA-MB-468 and KOLF2 cell lines, and antibodies were drawn from the Human Protein Atlas resource,
    so that spatial proteomics mapping could be run at scale across proteins and treatment conditions.
sampling_strategies:
- id: https://cm4ai.org/#sampling-targeted-protein-panel
  name: Targeted protein and gene panels
  is_sample: true
  is_random: false
  is_representative: false
  source_data: The human proteome and the expressed human genome, restricted to two disease-relevant human cell
    lines.
  strategies: 'Targeted selection rather than random sampling: 100 chromatin modifiers and 100 metabolic enzymes
    involved in cancer, neuropsychiatric and cardiac disorders were selected for multimodal interrogation, with
    a shared list of proteins measured across all cell types and treatment conditions; the CRISPRi perturbation
    atlas in undifferentiated KOLF2.1J iPSCs is genome-scale, covering 11,739 targeted genes.'
  why_not_representative: The release records state that data in the release were derived from commercially available
    de-identified human cell lines and do not represent all biological variants which may be seen in the population
    at large.
data_collectors:
- id: https://cm4ai.org/#collector-lundberg-lab
  name: Lundberg Lab, Stanford University
  role: immunofluorescence spatial proteomics imaging
  collector_details: The immunofluorescence image datasets in every release are described as imaged by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford University.
- id: https://cm4ai.org/#collector-krogan-lab
  name: Nevan Krogan laboratory, University of California San Francisco
  role: size exclusion chromatography mass spectrometry
  collector_details: The SEC-MS datasets in the March 2025 and October 2025 releases are described as generated
    by size exclusion chromatography-mass spectroscopy in the Nevan Krogan laboratory at the University of California
    San Francisco, on undifferentiated KOLF2.1J hiPSCs and on MDA-MB-468 cells following treatment with vorinostat
    or paclitaxel.
- id: https://cm4ai.org/#collector-production-sites
  name: CM4AI production sites
  role: data generation
  collector_details: The citation metadata of every CM4AI Dataverse release record gives the production location
    as University of California San Diego; University of California San Francisco; Stanford University; University
    of Virginia. The March 2025 record lists University of California San Francisco twice.
collection_timeframes:
- id: https://cm4ai.org/#timeframe-quarterly-generation
  name: Quarterly generation through the end of the project
  timeframe_details: CM4AI releases data quarterly, ensuring continuous updates to the cell maps and input data
    streams. The release records state that data presented in a release will be augmented regularly through the
    end of the project, which the maintenance plan places in November 2026. The four releases documented here
    were published on 2025-03-03, 2025-07-01, 2025-10-31 and 2026-06-17, with some file-level additions made later
    than the release publication date.
  source_caveats: No source in the bundle states the start or end date of laboratory data collection itself, so
    no start or end date is asserted. All four Dataverse records report the same repository Data Creation Date
    of 2025-02-27, which is a deposit field rather than a measurement date.
missing_data_documentation:
- id: https://cm4ai.org/#missing-modality-overlap
  name: Incomplete protein overlap across modalities
  missing_data_patterns: Protein-protein interaction (SEC-MS), protein localization (IF imaging) and CRISPRi perturb-seq
    data interrogate sets of proteins which incompletely overlap, so a protein measured in one modality is not
    necessarily measured in the others.
  missing_data_causes: 'The modalities are acquired by separate assays with separate target selection: the imaging
    panel is antibody-limited and staged, whereas the KOLF2.1J CRISPRi atlas is genome-scale.'
- id: https://cm4ai.org/#missing-embargoed-datasets
  name: Embargoed component datasets
  missing_data_causes: The release records state that some datasets are under temporary pre-publication embargo;
    in the October 2025 and June 2026 records the external links for perturb-seq data in undifferentiated KOLF2.1J
    iPSCs and in MDA-MB-468 breast cancer cells are marked "Embargoed" rather than resolving to a repository.
  handling_strategy: The embargoed data are named in the external data links section of the release record so
    that their existence and eventual location are documented, rather than being omitted from the release metadata.
raw_data_sources:
- id: https://cm4ai.org/#raw-source-krogan-archive
  name: Krogan Laboratory deposition archive
  source_description: Protein-protein interaction networks for each cell line and condition, generated by mass
    spectrometry in the Nevan Krogan laboratory at the University of California San Francisco.
  source_type: laboratory deposition archive
  access_details: Downloaded by the MuSIC pipeline's PPI download segment and made available for further processing.
- id: https://cm4ai.org/#raw-source-lundberg-archive
  name: Lundberg Laboratory deposition archive
  source_description: Immunofluorescence images for each cell line and condition, generated by confocal microscopy
    in the Lundberg Lab at Stanford University.
  source_type: laboratory deposition archive
  access_details: Downloaded by the MuSIC pipeline's image download segment and made available for further processing.
