human_subject_research:
  id: https://cm4ai.org/#human-subject-research
  name: Human subject research status
  involves_human_subjects: false
  description: 'The Data Governance and Ethics block of the June 2025, October 2025 and June 2026 release records
    states Human Subjects: No, De-identified Samples: Yes, and FDA Regulated: No. The CM4AI project preprint states
