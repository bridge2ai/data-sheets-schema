    for KOLF2.1J iPSCs (undifferentiated, NPC, neuron and cardiomyocyte) and SEC-MS data for MDA-MB-468 cells
    with and without treatment to the same repository. The June 2026 record adds AP-MS data for MDA-MB-468 cells
