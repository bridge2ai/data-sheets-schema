resources:
- id: doi:10.18130/V3/B35XWX
  name: March 2025 Data Release
  title: Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta)
  version: '1.4'
  doi: 10.18130/V3/B35XWX
  status: Beta
  license: CC BY-NC-SA 4.0
  page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/B35XWX
  publisher: https://dataverse.lib.virginia.edu/
  created_by: Niestroy, Justin
  description: The March 2025 Data Release of CM4AI. This Beta release includes perturb-seq data in undifferentiated
    KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs and iPSC-derived NPCs, neurons and cardiomyocytes;
    and IF images in MDA-MB-468 breast cancer cells in the presence and absence of chemotherapy with vorinostat
    and paclitaxel. The record reports 302 downloads and is listed under Archive on the CM4AI data releases page.
    Of the six deposited files, three are RO-Crate metadata JSON documents standing in for the CRISPR perturbation
    atlas, its raw sequences and the SEC-MS dataset, and three are ZIP archives of immunofluorescence images covering
    563 proteins per condition.
  source_caveats: This record is the only one of the four whose description states the collaborating institutions,
    and it omits UT Austin, which the CM4AI data releases page includes. The RO-Crate metadata record for the
    SEC-MS dataset states that the data will be uploaded to PRIDE when available, whereas the later release records
    point SEC-MS data to the MassIVE Repository. The page header gives Version 1.4 while the data citation on
    the same page gives V1.
  distribution_dates:
  - id: doi:10.18130/V3/B35XWX#release-dates
    name: Publication dates
    release_dates:
    - '2025-03-03'
    description: Citation metadata publication date 2025-03-03; all six files published Mar 3, 2025. The description
      text carries the trailing dates 2025-03-04 and 2025-03-07.
- id: doi:10.18130/V3/F3TD5R
  name: June 2025 Data Release
  title: Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta)
  version: '2.1'
  doi: 10.18130/V3/F3TD5R
  status: Beta
  license: CC BY-NC-SA 4.0
  page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/F3TD5R
  publisher: https://dataverse.lib.virginia.edu/
  created_by: Niestroy, Justin
  description: A revision of the June 2025 Data Release of CM4AI, adding RGB immunofluorescent images, correcting
    RO-Crate metadata and changing naming conventions. This Beta release includes perturb-seq data in undifferentiated
    KOLF2.1J iPSCs; SEC-MS data in undifferentiated KOLF2.1J iPSCs, iPSC-derived NPCs, neurons, cardiomyocytes,
    and treated and untreated MDA-MB468 breast cancer cells; and IF images in MDA-MB-468 breast cancer cells in
    the presence and absence of chemotherapy with vorinostat and paclitaxel. This is the first of the four releases
    to carry the structured Data Governance and Ethics, Completeness, Maintenance Plan, Intended Use, Limitations,
    Prohibited Uses and Potential Sources of Bias blocks, and the first to carry a release-level RO-Crate and
    an HTML release datasheet. The record reports 256 downloads and is listed under Archive on the CM4AI data
    releases page.
  source_caveats: The captured page lists files 1 to 10 of 21 and reports file-type counts of Text (12), Data
    (5), Archive (3) and Metadata (1), all with public access; the remaining 11 files are not visible in the sources
    for this record, so the file collections below enumerate 10 of 21 files. The page header gives Version 2.1
    while the data citation gives V2, and the page carries the note that the DRAFT version was not found. The
    description of cm4ai_ifimages_MDA-MB-468_untreated.zip reads "MDA-MB-468 treated as imaged by immunofluorescence-based
    staining", which appears to be a defect in the source text; the untreated condition is taken from the file
    name and from the parallel descriptions of the paclitaxel and vorinostat archives.
  distribution_dates:
  - id: doi:10.18130/V3/F3TD5R#release-dates
    name: Publication dates
    release_dates:
    - '2025-07-01'
    - '2025-10-22'
    description: Citation metadata publication date 2025-07-01, which is when the metadata, datasheet and provenance
      documents were published; the three immunofluorescence image archives were published later, on Oct 22, 2025.
      The description text carries the trailing date 2025-06-30.
- id: doi:10.18130/V3/K7TGEM
  name: October 2025 Data Release
  title: Cell Maps for Artificial Intelligence - October 2025 Data Release (Beta)
  version: '2.1'
  doi: 10.18130/V3/K7TGEM
  status: Beta
  license: CC BY-NC-SA 4.0
  page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/K7TGEM
  publisher: https://dataverse.lib.virginia.edu/
  created_by: Niestroy, Justin
  description: The October 2025 Data Release of CM4AI. This Beta release includes perturb-seq data for MDA-MB-468
    breast cancer cells with and without treatment and undifferentiated parental KOLF2.1J iPSCs; SEC-MS data for
    MDA-MB-468 breast cancer cells with and without treatment, undifferentiated KOLF2.1J iPSCs and iPSC-derived
    neuron progenitor cells, neurons and cardiomyocytes; and IF images in MDA-MB-468 breast cancer cells with
    and without treatment. All eight files are ZIP archives with public access. The record reports 405 downloads
    and is listed under Archive on the CM4AI data releases page. The three immunofluorescence archives carry the
    same MD5 checksums as their counterparts in the June 2025 release.
  source_caveats: The page header gives Version 2.1 while the data citation gives V2. Two of the eight files,
    the raw SRA archive and the release metadata archive, were published on Dec 22, 2025, after the October 2025
    publication date of the release itself. This release is the one the input sheet originally selected; the CM4AI
    data releases page presents the June 2026 release as the latest and lists this one under Archive.
  distribution_dates:
  - id: doi:10.18130/V3/K7TGEM#release-dates
    name: Publication dates
    release_dates:
    - '2025-10-31'
    - '2025-12-22'
    description: Citation metadata publication date 2025-10-31, when six of the eight files were published; the
      raw SRA archive and the release metadata archive were published on Dec 22, 2025. The description text carries
      the trailing date 2025-06-30, which is inherited from the June 2025 release description.
- id: doi:10.18130/V3/HIGT4C
  name: June 2026 Data Release
  title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
  version: '2.0'
  doi: 10.18130/V3/HIGT4C
  status: Beta
  license: CC BY-NC-SA 4.0
  page: https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
  publisher: https://dataverse.lib.virginia.edu/
  created_by: Niestroy, Justin
  description: The June 2026 Data Release of CM4AI and the release the CM4AI data releases page presents as the
    latest one. This Beta release includes perturb-seq data for MDA-MB-468 breast cancer cells with and without
    treatment and undifferentiated parental KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer cells with
    and without treatment, undifferentiated KOLF2.1J iPSCs and iPSC-derived neuron progenitor cells, neurons and
    cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer cells under treatment, which is new in this release;
    and IF images in MDA-MB-468 breast cancer cells with and without treatment. All ten files are ZIP archives
    with public access. The record reports 181 downloads. This release is the first to link a CRISPRi Perturbation
    Atlas of iPSCs to Figshare among its external data links.
  source_caveats: The captured page gives no per-file descriptions for this release, unlike the three earlier
    releases, so the file entries below carry name, path, checksum and format only. The three immunofluorescence
    archives share their file names and stated sizes with the June 2025 and October 2025 releases but carry different
    MD5 checksums, so they are distinct files. The CM4AI data releases page states that this release was released
    on June 17, 2025, whereas the Dataverse record gives a publication date of 2026-06-17; the Dataverse value
    is preferred as the higher-ranked source. The page header gives Version 2.0 while the data citation gives
    V2.
  distribution_dates:
  - id: doi:10.18130/V3/HIGT4C#release-dates
    name: Publication dates
    release_dates:
    - '2026-06-17'
    - '2026-07-15'
    description: Citation metadata publication date 2026-06-17, when seven of the ten files were published; the
      three immunofluorescence image archives were published on Jul 15, 2026. The description text carries the
      trailing date 2025-06-30, which is inherited from the June 2025 release description.
