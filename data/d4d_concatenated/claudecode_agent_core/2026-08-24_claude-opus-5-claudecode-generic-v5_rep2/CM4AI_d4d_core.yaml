instances:
- id: https://cm4ai.org/#instance-if-images
  name: Immunofluorescence confocal images
  instance_type: immunofluorescence confocal microscopy image
  counts: 53788
  data_topic: http://purl.obolibrary.org/obo/GO_0008104
  description: 'Images showing the spatial localization of proteins of interest in MDA-MB-468 breast cancer cells,
    imaged by immunofluorescence-based staining (ICC-IF) and confocal microscopy in the Lundberg Lab at Stanford
    University. Each image carries four channels: nuclei stained with DAPI (blue), endoplasmic reticulum with
    a calreticulin antibody (yellow), microtubules with a tubulin antibody (red), and an antibody against the
    protein of interest (green). The count of 53,788 immunofluorescent images is the figure the CM4AI web portal
    and data releases page report for the project as a whole.'
