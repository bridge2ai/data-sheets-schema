source_caveats: 'Sources in the declared bundle disagree in several places; each is resolved by the manifest ranking
  (source_priority, lowest tier strongest) and recorded here. (1) Release date of the current release: the CM4AI
  data releases page (tier 2, documentation) states the June 2026 Data Release was "Released on: June 17, 2025",
  while the Dataverse record for doi:10.18130/V3/HIGT4C (tier 1, data resource) gives a publication date of 2026-06-17
  with files published Jun 17, 2026. The tier 1 value, 2026-06-17, is recorded. (2) Immunofluorescence protein
  coverage: the data releases page (tier 2) states "IF images for 523 proteins" for the TNBC datasets; the October
  2025 and June 2026 Dataverse records (tier 1) state 464 proteins; the March 2025 record (tier 5, historical
  data release) states 563 proteins. The tier 1 figure of 464 is recorded for the current image archives, and
  563 is retained only as the March 2025 release''s own value. (3) Collaborating institutions: the data releases
  page (tier 2) lists UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University and the
  Hastings Center; the March 2025 Dataverse description (tier 5) omits UT Austin. The tier 2 list is recorded,
  and it is corroborated by the CM4AI preprint''s affiliation list, which includes the University of Texas at
  Austin. (4) End of project: the Dataverse maintenance plan (tier 1) states the dataset will be updated through
  the end of the project in November 2026; the NIH RePORTER project page (tier 4) gives a project end of 2026-08-31.
  The tier 1 statement is recorded in the update plan, and the tier 4 award period is recorded with the grant
  it belongs to. (5) Governance body: the Dataverse release records (tier 1) label the field "Data Governance
  Committee"; the CM4AI preprint (tier 3) states that "A Data Access Committee will supervise ethical matters
  related to dataset distribution and potential dual licensing for commercial use". The tier 1 name is recorded
  in committee_name and the preprint''s statement is recorded in the access review process. (6) Affiliation of
  Sali A: the Dataverse author lists (tier 1) give University of California San Diego; the CM4AI preprint (tier
  3) and the Nature publication (tier 3) place Andrej Sali at the University of California San Francisco. The
  tier 1 affiliation is recorded. (7) Perturb-seq gene counts: the Dataverse records (tier 1) state 11,739 targeted
  genes for the KOLF2.1J CRISPRi Perturbation Cell Atlas; the data releases page (tier 2) states "Perturb-seq
  of >11,000 genes (whole-genome)" for the iPSC datasets and "Perturb-seq of 200 genes" for the TNBC datasets;
  the preprint (tier 3) reports single-cell CRISPR screens of 100 chromatin regulators in MDA-MB-468 cells as
  of May 2024. Only the tier 1 figure is asserted as a count; the MDA-MB-468 perturbation scale is not stated
  by any tier 1 source, so no count is asserted for it. Two identifications were made within single source documents
  and are stated here rather than left implicit. The Dataverse release records name "Jillian Parker (jillianparker@health.ucsd.edu)"
  as the data governance contact and, in the same records'' author list, "Parker J (University of California,
  San Diego) - ORCID: https://orcid.org/0000-0003-4535-3486"; that ORCID is used for the governance contact. The
  same records name "Vardit Ravitsky (ravitskyv@thehastingscenter.org)" and "Jean-Christophe Belisle-Pipon (jean-christophe_belisle-pipon@sfu.ca)"
  as ethical review contacts and list "Ravitsky V (University of Montreal) - ORCID: https://orcid.org/0000-0002-7080-8801"
  and "Belisle-Pipon JC (Simon Fraser University) - ORCID: https://orcid.org/0000-0002-8965-8153"; those ORCIDs
  are used for the review contacts. Affiliation strings are normalized to one form per organization where a source
  renders one organization several ways: "University of California, San Diego" and "University of California San
  Diego"; "KTH Royal Institute of Technology," and "KTH - Royal Institute of Technology"; "The University of Alabama
  at Birmingham" and "University of Alabama at Birmingham". University of Alabama and University of Alabama at
  Birmingham are kept distinct, because the sources distinguish them. Release version numbers are recorded as
  the release page states them (1.4, 2.1, 2.1, 2.0); the data citation on the same pages renders the same versions
  as V1, V2, V2 and V2. All four Dataverse release records report the same Data Creation Date and Deposit Date,
  2025-02-27, including the June 2026 release published 2026-06-17; those repository fields are therefore not
  used as collection dates. The bundle contains one further publication, Schaffer et al., "Multimodal cell maps
  as a foundation for structural and functional genomics", Nature 642:222-231 (2025), doi 10.1038/s41586-025-08878-3.
  It reports a distinct dataset: a multimodal cell map of U2OS osteosarcoma cells, deposited in NDEx, MassIVE,
  ProteomeXchange, the Human Protein Atlas and the ModelArchive rather than in the CM4AI Dataverse collection.
  Its cell lines, counts, funders and repositories were therefore not merged into this record. The referent of
  this record is CM4AI as an ongoing quarterly release programme, with the four DOI-identified Dataverse deposits
  enumerated as resources rather than as separate datasets. Two size fields are left unasserted as a result: no
  source states a file count or a byte total for the programme as a whole, and the reported data volume of 21.4
  TB is given to three significant figures with no stated unit base, so converting it to an integer byte count
  would assert precision the sources do not carry. File counts are asserted per release, where the release records
  state them.'
purposes:
- id: https://cm4ai.org/#purpose-map-cell-architecture
  name: Map the spatiotemporal architecture of human cells
  response: 'CM4AI seeks to map the spatiotemporal architecture of human cells and use these maps toward the grand
    challenge of interpretable genotype-phenotype learning, through a coordinated effort involving three complementary
    mapping approaches: proteomic mass spectrometry, cellular imaging, and genetic perturbation via CRISPR/Cas9.'
- id: https://cm4ai.org/#purpose-ai-ready-cell-maps
  name: Deliver AI-ready hierarchical maps of cell architecture
  response: CM4AI's objective is to deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data produced from multimodal interrogation of 100 chromatin modifiers and 100 metabolic enzymes involved
    in cancer, neuropsychiatric and cardiac disorders in disease-relevant cell lines under perturbed and unperturbed
    conditions, together with quarterly data releases of the map-input data streams.
- id: https://cm4ai.org/#purpose-visible-machine-learning
  name: Enable visible machine learning systems
  response: The released data are intended to stimulate research and development in "visible" machine learning
    systems informed by multi-scale cell and tissue architecture, which are not black boxes but are built directly
    on knowledge maps of cell and tissue architecture.
- id: https://cm4ai.org/#purpose-ethical-ai-ready-data
  name: Produce ethical, FAIR, AI-ready biomedical data
  response: CM4AI's overarching mission is to produce ethical, AI-ready datasets of cell architecture, inferred
    from multimodal data collected for human cell lines, to enable transformative biomedical AI research. CM4AI
    defines AI-ready biomedical data as fully characterized FAIR data of known provenance that can be ethically
    and reliably processed by AI applications, whose models and software are available and well-described for
    validation and reuse, and whose predictions may be fully explained and interpreted to the user as needed.
tasks:
- id: https://cm4ai.org/#task-hierarchical-cell-map-construction
  name: Construction of hierarchical cell maps
  response: Cell maps are hierarchical directed acyclic graphs in which each node represents an assembly of proteins
    in proximity at a given scale, from large assemblies representing cell compartments such as the nucleus and
    mitochondria down to small assemblies such as protein complexes or subunits. They are produced by integrating
    protein localization and protein interaction data using self-supervised embedding approaches from deep learning,
    followed by algorithmic community detection at multiple resolutions.
- id: https://cm4ai.org/#task-genotype-phenotype-learning
  name: Interpretable genotype-phenotype learning
  response: Cell maps provide a foundation for downstream applications in human genomics, including interpretation
    of genetic variants and mutations, and have been used in AI tools for "visible machine learning" or "visible
    neural networks" to interrogate how protein assemblies in the cell affect cell-level phenotype predictions.
addressing_gaps:
- id: https://cm4ai.org/#gap-black-box-models
  name: Uninterpretable genotype-to-phenotype models
  response: In genomics and precision medicine, machine learning models are often "black boxes", predicting phenotypes
    from genotypes without understanding the mechanisms by which such translation occurs. To address this deficiency,
    CM4AI generates a resource of matched data and tools to enable the creation of "visible" machine learning
    systems built directly on knowledge maps of cell and tissue architecture.
- id: https://cm4ai.org/#gap-unexplored-cell-architecture
  name: Unmapped cellular structure and function
  response: CM4AI creates a library of large-scale maps of cellular structure and function across demographic
    and disease contexts, covering chromatin modifiers, metabolic enzymes and other proteins involved in cancer,
    neuropsychiatric and cardiac disorders, which had not previously been mapped jointly across interaction, localization
    and perturbation modalities in the same disease-relevant cell lines.
- id: https://cm4ai.org/#gap-ai-readiness-standards
  name: Absent AI-readiness and provenance standards for biomedical data
  response: CM4AI implements a standards data management approach based on FAIR access and software principles,
    with deep provenance and replication packages for representation of cell maps and their underlying datasets,
    addressing the absence of fully characterized, provenanced and explainable data packages for biomedical AI.
