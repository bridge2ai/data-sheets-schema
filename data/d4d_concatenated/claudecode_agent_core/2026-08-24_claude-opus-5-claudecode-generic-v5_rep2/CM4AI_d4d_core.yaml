id: https://cm4ai.org/
name: CM4AI
title: Cell Maps for Artificial Intelligence
description: 'CM4AI is the Functional Genomics Data Generation Project of the NIH Bridge2AI program. It delivers
  machine-readable hierarchical maps of cell architecture as AI-ready data, together with quarterly data releases
  of the map-input data streams. The released data are produced by multimodal interrogation of chromatin modifiers,
  metabolic enzymes and other proteins involved in cancer, neuropsychiatric and cardiac disorders, in disease-relevant
  human cell lines under treated and untreated conditions. Two cell lines are used: MDA-MB-468 triple negative
  breast cancer cells, untreated or treated with paclitaxel or vorinostat, and KOLF2.1J induced pluripotent stem
  cells, undifferentiated or differentiated into neural progenitor cells, neurons and cardiomyocytes. Three measurement
  modalities contribute: mass spectrometry based proteomics, comprising affinity purification mass spectrometry
  (AP-MS) and size exclusion chromatography mass spectrometry (SEC-MS); spatial proteomics by immunofluorescence
  confocal imaging; and genetic perturbation by CRISPR/Cas9 single-cell screens. Output data are packaged with
  provenance graphs and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework, and
  are deposited in LibraData, the University of Virginia Dataverse. CM4AI reports a total data volume of 21.4
  TB. Four DOI-identified releases are documented in the sources for this record and are enumerated as resources:
  March 2025, June 2025, October 2025 and the current June 2026 release. CM4AI is a collaboration of UCSD, UCSF,
  Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University, and the Hastings Center.'
