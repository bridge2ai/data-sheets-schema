updates:
  id: https://cm4ai.org/#update-plan
  name: Quarterly update plan
  frequency: quarterly
  update_details: The maintenance plan in the release records states that the dataset will be regularly updated
    and augmented through the end of the project in November 2026, with updates on a quarterly basis, and with
    long term preservation in the University of Virginia Dataverse supported by committed institutional funds.
    The data releases page states that CM4AI releases data quarterly, ensuring continuous updates to the cell
    maps and input data streams, and the March 2025 release description states that data presented there will
    be augmented regularly through the end of the project. Future releases are stated to add predicted cell maps,
    which the current releases do not contain.
retention_limit:
  id: https://cm4ai.org/#retention
  name: Retention and preservation
  retention_details: The maintenance plan in the release records commits to long term preservation in the University
    of Virginia Dataverse, supported by committed institutional funds. Earlier releases remain published under
    their own DOIs rather than being replaced.
  source_caveats: No source in the bundle states a retention period after which data would be removed, so no retention
    period is asserted.
version_access:
  id: https://cm4ai.org/#version-access
  name: Version access
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
  - Cell Maps for Artificial Intelligence - March 2025 Data Release (Beta), version 1.4, doi:10.18130/V3/B35XWX,
    published 2025-03-03
  - Cell Maps for Artificial Intelligence - June 2025 Data Release (Beta), version 2.1, doi:10.18130/V3/F3TD5R,
    published 2025-07-01
  - Cell Maps for Artificial Intelligence - October 2025 Data Release (Beta), version 2.1, doi:10.18130/V3/K7TGEM,
    published 2025-10-31
  - Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta), version 2.0, doi:10.18130/V3/HIGT4C,
    published 2026-06-17
  - Cell Maps for Artificial Intelligence - Data Release, V1, doi:10.18130/V3/DXWOS5, cited as the then-current
    release in the May 2024 CM4AI project preprint
  - May 2024 Data Release, named in the archive list on the CM4AI data releases page without a DOI
  version_details: The CM4AI data releases page presents the June 2026 release as the latest data release and
    lists May 2024, March 2025, June 2025 and October 2025 releases under Archive. Each release is a separate
    DOI-identified Dataverse deposit and earlier releases remain published, so obsolete versions stay citable.
    Within a deposit, Dataverse offers minor and major version increments and states that files are not removed
    from previously published versions.
  source_caveats: No source in the bundle states how long older releases will be hosted or how dataset consumers
    are notified when a version becomes obsolete.
is_deidentified:
  id: https://cm4ai.org/#deidentification
  name: De-identification status
  identifiable_elements_present: false
  deidentification_details: 'The Data Governance and Ethics block of the June 2025, October 2025 and June 2026
    release records states De-identified Samples: Yes and Human Subjects: No. The CM4AI project preprint states
    that CM4AI data are non-clinical, coming from tissue cultures, and are considered to be de-identified as they
    cannot be matched, with current knowledge, to a human subject. The release records state that the data were
    derived from commercially available de-identified human cell lines.'
  source_caveats: No source in the bundle names a de-identification method or a list of identifiers removed, so
    neither is asserted.
