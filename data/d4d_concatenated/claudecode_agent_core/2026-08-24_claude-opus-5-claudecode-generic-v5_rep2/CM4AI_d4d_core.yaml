    for paclitaxel- and vorinostat-treated MDA-MB-468 cells, to the MassIVE Repository.
  source_caveats: The captured release pages give the link text but no MassIVE accession identifier.
- id: https://cm4ai.org/#raw-image-archives
  name: Raw spatial proteomics image archives
  raw_data_details: Raw immunofluorescence image data is distributed directly in each release as per-condition
