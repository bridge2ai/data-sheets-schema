    sourced.'
preprocessing_strategies:
- id: https://cm4ai.org/#preprocessing-fairscape-packaging
  name: RO-Crate packaging and provenance graph computation with FAIRSCAPE
  preprocessing_details: CM4AI output data are packaged with provenance graphs and rich metadata as AI-ready datasets
    in RO-Crate format using an extended, client-server version of the FAIRSCAPE framework. The client-side package,
    FAIRSCAPE-CLI, is called when a computation or coherent set of computations in the pipeline completes and
    is passed metadata defining JSON-Schema descriptions for the datasets in the computational unit, together
    with the inputs, computations, software, models and outputs; it creates an RO-Crate package holding the datasets,
    metadata and software, or resolvable references to them, and unique stubs for identifier creation. The RO-Crates
    are sent to the FAIRSCAPE server, where they are registered and assigned persistent, resolvable, globally
    unique identifiers using the ARK scheme, then decomposed into their individual components, which are also
    registered and assigned identifiers. Finally the server computes end-to-end entailments on each RO-Crate's
    provenance as expressed in the EVI Evidence Graph Ontology and links them together where possible. Identifiers
    resolve to machine- and human-readable landing pages expressed in JSON-LD using vocabularies from Schema.org,
    EVI and other public ontologies, with alternate serializations in JSON-LD and RDF-XML.
  used_software:
  - id: https://fairscape.github.io
    name: FAIRSCAPE
    url: https://fairscape.github.io
    license: MIT
    description: AI-readiness framework consisting of a client-side Python 3 application, FAIRSCAPE-CLI, and a
      Python 3 server application that completes the packaging. Both packages are pip-installable and freely available
      under the MIT open source license, with a tutorial and installation instructions at https://fairscape.github.io.
      Copyright is held by the Rector and Board of Visitors of the University of Virginia.
- id: https://cm4ai.org/#preprocessing-june-2025-revision
  name: June 2025 release revision
  preprocessing_details: The June 2025 release record describes itself as a revision of the June 2025 Data Release
    whose changes comprise adding RGB immunofluorescent images, corrections to RO-Crate metadata, and changes
    to naming conventions. The revised image archive file names follow the pattern cm4ai_ifimages_MDA-MB-468_{condition}.zip,
    replacing the March 2025 pattern cm4ai-v0.6-beta-if-images-{condition}.zip.
cleaning_strategies:
- id: https://cm4ai.org/#cleaning-crispr-qc
  name: Quality control of single-cell CRISPR screen data
  cleaning_details: As reported in the May 2024 CM4AI project preprint, single-cell CRISPR screens of 100 chromatin
    regulators with and without drug in MDA-MB-468 cells and in undifferentiated KOLF2.1J iPSCs had been completed
    using the 10x Genomics 3'HT kit and the resulting data were undergoing quality control at that time.
  source_caveats: No source in the bundle states the quality control criteria applied to the data as released;
    the statement above is scoped to the May 2024 preprint.
raw_sources:
- id: https://cm4ai.org/#raw-sequence-archives
  name: Raw CRISPRi sequence data distributed with the release
  raw_data_details: Raw sequence data from the expressed genome-scale CRISPRi Perturbation Cell Atlas in KOLF2.1J
