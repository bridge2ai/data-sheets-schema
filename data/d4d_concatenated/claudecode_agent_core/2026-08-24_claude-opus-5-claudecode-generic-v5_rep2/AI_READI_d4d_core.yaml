id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: Release 3.0.0 of the AI-READI dataset, a multimodal cross-sectional dataset collected from
  2280 participants with and without type 2 diabetes mellitus (T2DM) between 19 July 2023 and 1 May 2025
  and harmonized across three data collection sites (the University of Alabama at Birmingham, the University
  of California San Diego, and the University of Washington). AI-READI is one of the data generation projects
  of the National Institutes of Health Common Fund Bridge2AI program. Its stated goal is to enable artificial
  intelligence and machine learning research into the pathogenesis and salutogenesis of T2DM — salutogenesis
  being the pathway from disease back to health. Recruitment sampling aimed at an approximately equal
  distribution of participants across self-reported race and ethnicity, biological sex, and four diabetes
  severity groups, and the acquisition protocol spans survey data, physical measurements, clinical laboratory
  data, retinal imaging, electrocardiography, continuous glucose monitoring, wearable activity monitoring
  and home environmental sensing. The release comprises 356,343 files totaling approximately 3.82 TB,
  organized under the Clinical Dataset Structure (CDS) v0.1.1 into one directory per data type, then modality,
  then device, then participant. The released data contain no protected health information; information
  on the sex and race or ethnicity of participants and on medications used has been removed from the public
  release and is held under controlled access.
