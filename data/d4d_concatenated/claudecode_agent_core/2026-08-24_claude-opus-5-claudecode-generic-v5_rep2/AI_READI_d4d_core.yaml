source_caveats: 'Evidence notes for this record as a whole. (1) The acronym AI-READI is expanded differently
  across the bundle: the FAIRhub study metadata and the NIH RePORTER page give "Exploratory" ("AI Ready
  and Exploratory Atlas for Diabetes Insights"), while the BMJ Open protocol gives "Equitable" ("Artificial
  Intelligence Ready and Equitable Atlas for Diabetes Insights"). The FAIRhub structured metadata is the
  higher-ranked source in the input manifest (tier 1, versus tier 3 for the publication), so its expansion
  is preferred here. (2) Two sources disagree on the institution associated with the study lead. The FAIRhub
  study metadata names Washington University in St. Louis as lead sponsor, managing organization and the
  affiliation of the responsible-party investigator Aaron Lee; the RO-Crate names the principal investigator
  as "Aaron Lee, Department of Ophthalmology, University of Washington"; the license agreement names Washington
  University in St. Louis as Licensor; the NIH RePORTER page gives the awardee organization as University
  of Washington. The FAIRhub metadata and the RO-Crate are both tier 1, so the ranking cannot decide between
  them and both statements are reported rather than one being selected. (3) The dataset structure metadata
  reports per-directory sizes summing to 3,815,969,360,064 bytes across 356,334 files, while the same
  source declares totals of 3,815,969,779,678 bytes and 356,343 files; the declared totals are recorded
  in total_size_bytes and total_file_count and the per-directory figures in file_collections, and the
  bundle does not explain the difference. (4) The bundle refers to a smaller version of the dataset available
  for pipeline development (the FAIRhub v3 record states "A smaller version is available for pipeline
  development", the FAIRhub API reports a child record numbered 4, and the v3 documentation lists a "mini-subset
  version"), but supplies no identifier for it, so it is not recorded as a related dataset. (5) The dataset
  was retrieved from the input bundle only; no live source was consulted.'
