  format: CSV
  conforms_to: Observational Medical Outcomes Partnership (OMOP) Common Data Model (CDM)
  conforms_to_standard:
  - OMOP_CDM
  - CDS
  description: Clinical data collected through REDCap, including blood and urine laboratory values and
    survey data, together with Montreal Cognitive Assessment results, monofilament testing, and physical
    and vision assessments. Each CSV file in the directory is a one-to-one mapping to an OMOP Common Data
    Model table. The directory carries a dqd_omop.json metadata file supporting OMOP CDM data quality
    analysis with the OMOP CDM Data Quality Dashboard. This directory holds 7 files.
- id: ark:59853/rocrate-b2ai-ai-readi-environmental-sensor
  name: environment
  path: environment
  bytes: 55625676514
  media_type: text/csv
  format: CSV
  conforms_to: ASCII File Format Guidelines for Earth Science Data
  conforms_to_standard:
  - ESDS
  - CDS
  description: Data collected through a custom-designed home environmental sensor unit, the LeeLab Anura,
    placed in each participant's home for 10 days. The sensor recorded particulate matter counts (PM1.0,
    PM2.5, PM4 and PM10), temperature, relative humidity, volatile organic compounds, nitrogen oxides
    (NO and NO2), and 11 multi-spectral light intensity measurements. Files follow the NASA ASCII File
    Format Guidelines for Earth Science Data. This directory holds 2,232 files.
- id: ark:59853/rocrate-b2ai-ai-readi-flio
  name: retinal_flio
  path: retinal_flio
  bytes: 1069466876718
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: Fluorescence lifetime imaging ophthalmoscopy (FLIO) data, an imaging modality for in vivo
    measurement of the lifetimes of endogenous retinal fluorophores. Each scan records images at two wavelength
    bands, short (498-560 nm) and long (560-720 nm), supplied as two separate DICOM files per eye; the
    two bands penetrate the retinal tissue differently and are commonly analyzed separately per participant.
    Acquisition is performed by an operator in a dark room and, because it takes longer than a standard
    OCT and exposes participants to uncomfortable light levels, is scheduled as the last modality of the
    visit. This directory holds 7,969 files.
- id: ark:59853/rocrate-b2ai-ai-readi-retinal-oct
  name: retinal_oct
  path: retinal_oct
  bytes: 1317625293027
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: 'Structural optical coherence tomography (OCT) data, a non-invasive technique rendering
    an in vivo cross-sectional view of the retina accurate to within at least 10-15 microns. Acquired
    on four devices, each in its own subdirectory: the Heidelberg Spectralis, the Topcon Maestro2, the
    Topcon Triton, and the Zeiss Cirrus. This directory holds 56,478 files.'
- id: ark:59853/rocrate-b2ai-ai-readi-retinal-octa
  name: retinal_octa
  path: retinal_octa
  bytes: 1155908809724
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: Optical coherence tomography angiography (OCTA) data, a non-invasive imaging technique
    that visualizes retinal and inner choroidal circulation without dye injection by mapping red blood
    cell movement across sequential OCT scans. Organized into three modality subdirectories — en face
    images derived from 3D volume scans, flow cube data giving blood flow in a 3D view, and segmentation
    heightmaps with their associated layer information — each further divided by device (Heidelberg Spectralis,
    Topcon Maestro2, Topcon Triton, Zeiss Cirrus). This directory holds 173,721 files.
- id: ark:59853/rocrate-b2ai-ai-readi-retinal-photography
  name: retinal_photography
  path: retinal_photography
  bytes: 174381046406
  conforms_to: Digital Imaging and Communications in Medicine (DICOM)
  conforms_to_standard:
  - DICOM
  - CDS
  description: Retinal photography, two-dimensional images of the posterior segment of the eye, also called
    fundus photography. Images document the optic nerve, macula, retinal vasculature, and central and
    peripheral retina, and were acquired both undilated (Optomed Aurora IQ handheld camera) and dilated
    (iCare EIDON widefield TrueColor confocal system). This directory holds 93,921 files.
- id: ark:59853/rocrate-b2ai-ai-readi-wearable-activity-monitor
  name: wearable_activity_monitor
  path: wearable_activity_monitor
  bytes: 38313536220
  conforms_to: Open mHealth
  conforms_to_standard:
  - OPEN_MHEALTH
  - CDS
  description: Data collected through a wearable fitness tracker, the Garmin Vivosmart 5. Participants
    were advised to wear the device on the non-dominant wrist for 10 consecutive days, concurrently with
    the continuous glucose monitor and the home environmental sensor, and returned it with a form recording
    which wrist was used and which hand was dominant. The device recorded physical activity and sleep
    continuously at a 5-second sampling frequency; gaps occur because the battery required charging every
    2-3 days. This directory holds 15,245 files.
- id: ark:59853/rocrate-b2ai-ai-readi-wearable-blood-glucose
  name: wearable_blood_glucose
  path: wearable_blood_glucose
  bytes: 4169006971
  conforms_to: Open mHealth
  conforms_to_standard:
  - OPEN_MHEALTH
  - CDS
  description: Data collected through a continuous glucose monitoring device, the Dexcom G6, which records
    blood glucose readings every five minutes from a sensor filament inserted under the skin and worn
    for the 10-day at-home monitoring period. Participants were masked to the results during the monitoring
    period. This directory holds 2,246 files.
purposes:
- name: Enable AI and machine learning research into type 2 diabetes salutogenesis
  response: To enable future generations of artificial intelligence and machine learning research to provide
    critical insights into type 2 diabetes mellitus, including salutogenic pathways back to health. T2DM
    is a growing public health threat, yet current understanding of it — especially in the context of
    salutogenesis — is limited; AI-based approaches may improve that understanding, but a key obstacle
    is the lack of data ready for training AI models, which this dataset is intended to supply.
- name: Serve as a model for future AI-ready dataset creation
  response: To establish standards, best practices and guidelines for the collection, preparation and
    sharing of data for AI and machine learning purposes, so that the approach can be reused by other
    efforts building health datasets targeted at AI and machine learning. The project frames this as a
    blueprint for future data generation projects, covering project management as well as data collection,
    management and sharing.
tasks:
- name: Pseudotime manifold analysis of disease trajectories
  response: Data collection was specifically designed to permit downstream pseudotime manifold analysis,
    an approach used to predict disease trajectories by learning from complex multimodal data gathered
    from participants at differing disease severity, from normal to insulin-dependent T2DM. The stated
    long-term objective is a foundational dataset in T2DM, agnostic to existing classification criteria
    or biases, from which a temporal atlas of T2DM development and reversal toward health can be reconstructed.
- name: Multimodal AI and machine learning model development
  response: To support the development of multimodal AI and machine learning models on data balanced for
    T2DM severity from a diverse group of participants, in order to better understand a complex multifactorial
    disease. The dataset is described as hypothesis agnostic, so no single prediction task is prescribed.
addressing_gaps:
- name: Absence of AI-ready multimodal datasets for diabetes research
  response: The ability to understand and affect the course of complex, multi-organ diseases such as T2DM
    has been limited by a lack of well-designed, high-quality, large and inclusive multimodal datasets.
    A major barrier to applying AI to the problem has been the absence of diverse datasets that are AI
    ready for training AI models, and the dataset is intended to fill that gap.
- name: Under-representation of racial and ethnic groups in past T2DM research
  response: Certain populations experience a greater burden of type 2 diabetes, which exacerbates health
    disparities, and past research studies have under-represented the groups bearing that higher burden.
    A meta-epidemiological review of T2DM studies published between 2000 and 2020 found that samples lacked
    racial and ethnic diversity. The cohort is therefore recruited to be approximately balanced across
    four self-reported race and ethnicity groups rather than to match the demographic distribution of
    the United States population.
