  instance_type: individual participant
  data_topic: https://meshb.nlm.nih.gov/record/ui?ui=D003924
  counts: 2280
  label: false
  description: 'Each instance represents an individual patient, and consists of all the data available
    for that individual: survey data, clinical data, retinal imaging data, environmental sensor data,
    continuous glucose monitor data, and wearable activity monitor data. These encompass tabular data,
    imaging data, and physiological signal or waveform data. No unstructured text data is included. There
    is currently only one visit per participant.'
  missing_information:
