source_caveats: >-
  Referent: this record describes the June 2026 Dataverse release (DOI 10.18130/V3/HIGT4C),
  not the CM4AI project as a whole. Project-level statements from cm4ai.org and from the
  CM4AI descriptor preprint are used only where they document how this release was produced,
  governed or licensed; project-wide portal statistics (1,374 protein interactions; 53,788
  immunofluorescent images; 7,023 proteins investigated; 11,739 genes targeted; 21.4 TB) are
  cumulative across all releases and are therefore recorded in notes rather than as
  properties of this release.
  The declared bundle also contains the Nature 2025 study "Multimodal cell maps as a
  foundation for structural and functional genomics" (Schaffer et al.,
  doi 10.1038/s41586-025-08878-3). That study maps U2OS osteosarcoma cells and is a separate
  dataset with separate deposits (NDEx, MassIVE, ProteomeXchange, ModelArchive); its
  U2OS-specific protocols, counts and accessions have deliberately not been attributed to
  CM4AI here. Where preprocessing steps are described (node2vec PPI embedding, HPA image
  embedding, contrastive co-embedding, multi-resolution community detection), the wording
  follows the CM4AI descriptor preprint's Tools section, which describes all four steps
  independently of the U2OS study.
  Four successive Dataverse releases appear in the bundle (March 2025, June 2025, October
  2025, June 2026); earlier releases are recorded under version_access and related_datasets.
  The March 2025 release reports 563 imaged proteins per condition whereas the June 2025 and
  later releases report 464; the later value is used here because it is the value stated for
  the archives in this release.
  File sizes are reproduced as displayed by the repository (rounded to one decimal place),
  so exact byte counts are omitted rather than inferred, and total_size_bytes is therefore
  not populated. External accessions for the MassIVE mass spectrometry deposits, the NCBI
  SRA BioProject and the Figshare CRISPRi atlas are referenced by link text only in the
  source and are therefore not transcribed.
  Dates: issued and last_updated_on are the repository's file publication dates
  (2026-06-17 for seven archives, 2026-07-15 for the three immunofluorescence archives); the
  bundle gives no dataset-level modification date. The Dataverse "Data Creation Date" and
  "Deposit Date" are both 2025-02-27 and cannot be distinguished, so created_on is omitted.
  Identifiers for organizations and grants are minted locally under the cm4ai: prefix where
  the sources supply none; the only organizational identifier stated in the sources is ROR
  https://ror.org/0153tk833 for the University of Virginia, and grant numbers are given as
  plain strings.
  Human-subject slots (collection_consents, collection_notifications, consent_revocations,
  informed_consent, participant_privacy, participant_compensation, at_risk_populations) are
  omitted deliberately: the release states Human Subjects: No, and although the bundle notes
  that MDA-MB-468 derives from a 51-year-old black female patient and KOLF2.1J from a healthy
  male Northern European donor, it says nothing about the consent, notification or privacy
  arrangements under which those primary materials were obtained. hipaa_compliant is likewise
  omitted rather than inferred, since HIPAA is not discussed anywhere in the sources.
  raw_data_sources is used in preference to raw_sources because the sources describe
  originating materials and external repository deposits rather than pre-preprocessing
  copies of the released files.

