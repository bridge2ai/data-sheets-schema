updates:
  frequency: quarterly
  update_details: >-
    The dataset will be regularly updated and augmented through the end of the project in
    November 2026, with updates on a quarterly basis. Future releases are to add computed cell
    maps, immunofluorescence images for the iPSC lines, and further AP-MS interactomes. The
    project also plans to add DOIs as supplementary persistent identifiers for final-state
    publishable work alongside the ARK identifiers currently minted.

retention_limit:
  retention_details: >-
    Long-term preservation in the University of Virginia Dataverse, supported by committed
    institutional funds. Files are not removed from previously published versions of the
    dataset when new versions are released.

version_access:
  latest_version_doi: doi:10.18130/V3/HIGT4C
  versions_available:
    - "May 2024 Data Release - doi:10.18130/V3/DXWOS5"
    - "March 2025 Data Release (Beta) - doi:10.18130/V3/B35XWX (version 1.4)"
    - "June 2025 Data Release (Beta) - doi:10.18130/V3/F3TD5R (version 2.1)"
    - "October 2025 Data Release (Beta) - doi:10.18130/V3/K7TGEM (version 2.1)"
    - "June 2026 Data Release (Beta) - doi:10.18130/V3/HIGT4C (version 2.0)"
  version_details: >-
    Each quarterly release is deposited as a separately citable Dataverse dataset with its own
    DOI and internal minor and major versions; earlier releases remain publicly accessible and
    are listed in the Archive section of the CM4AI data releases page. Within a release,
    Dataverse retains published file versions.

extension_mechanism:
  contribution_url: https://github.com/idekerlab/cellmaps_pipeline
  extension_details: >-
    The Cell Mapping Toolkit implements the end-to-end pipeline as a series of pip-installable
    Python packages with full user documentation and a step-by-step guide, providing a flexible
    and generalizable framework for cell map construction that allows researchers to integrate
    and construct cell maps from multiple input modalities, incorporate new datasets, and build
    maps across additional cell subtypes and disease states.

notes: >-
  Project-wide context for this release. CM4AI defines AI-Ready biomedical data as fully
  characterized FAIR data of known provenance that can be ethically and reliably processed by
  AI applications, whose models and software are available and well described for validation
  and reuse, and whose predictions may be fully explained and interpreted. Its five stated
  criteria are FAIR, Provenanced, Characterized (with complete schemas, validation procedures
  and datasheets for all datasets in the provenance graph and model cards for all models),
  Explainable, and Ethical; the criteria are described as interdependent, with ethical
  validation depending on explainability and explainability on provenance.
  The CM4AI portal reports cumulative figures across all releases to date: 1,374 protein
  interactions, 53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739
  genes targeted and 21.4 TB of data volume. These are project-level totals and are not
  properties of this release alone.
  The Dataverse collection carries the notice: "This collection is under review for potential
  modification in compliance with Administration directives."