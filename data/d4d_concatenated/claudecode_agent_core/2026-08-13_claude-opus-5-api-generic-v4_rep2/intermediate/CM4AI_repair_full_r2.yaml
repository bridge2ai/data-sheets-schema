purposes:
  - response: >-
      To deliver machine-readable hierarchical maps of cell architecture as AI-ready data,
      produced from multimodal interrogation of chromatin modifiers, metabolic enzymes and
      other proteins involved in cancer, neuropsychiatric and cardiac disorders in
      disease-relevant cell lines under treated and untreated conditions.
  - response: >-
      To map the spatiotemporal architecture of human cells and use these maps toward the
      grand challenge of interpretable genotype-phenotype learning, so that machine learning
      models in genomics and precision medicine need not remain black boxes.
  - response: >-
      To produce ethical, FAIR, AI-ready datasets and accompanying software that broadly
      stimulate research and development in "visible" machine learning systems informed by
      multi-scale cell and tissue architecture, and to make them available to the research
      community under minimally restrictive terms consistent with ethical guidelines,
      researcher attribution and research integrity.

addressing_gaps:
  - response: >-
      In genomics and precision medicine, machine learning models are often black boxes that
      predict phenotypes from genotypes without revealing the mechanisms by which such
      translation occurs. CM4AI supplies the knowledge maps of cell and tissue architecture
      on which visible, mechanistically interpretable models can be built.
  - response: >-
      Human cells are organized across a spatial hierarchy of components, much of which
      remains uncharted. Complementary mapping technologies have typically been applied
      separately; CM4AI generates matched proteome-wide datasets in the same cellular
      contexts so that multiple modalities can be integrated.
  - response: >-
      Datasets used to train and analyse with AI/ML models are frequently not FAIR, not
      provenanced, not statistically characterized and not ethically documented. CM4AI
      defines and implements an AI-readiness framework covering FAIRness, provenance,
      characterization, explainability and ethics, and releases data packaged accordingly.

tasks:
  - response: >-
      Construction of hierarchical cell maps by self-supervised integration of protein
      localization and protein interaction data followed by multi-resolution community
      detection.
  - response: >-
      Development and training of visible machine learning systems and visible neural
      networks that interrogate how protein assemblies in the cell affect cell-level
      phenotype predictions.
  - response: >-
      Interpretation of genetic variants and mutations against a structured model of
      subcellular organization.
  - response: >-
      Analysis of cell architectural changes and interactions in the presence of specific
      disease processes, drug treatment conditions or genetic perturbations.

acquisition_methods:
  - acquisition_details: >-
      Protein-protein interactions were measured directly by affinity purification mass
      spectrometry (AP-MS) on endogenously tagged cell lines and by size-exclusion
      chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide complex and
      interaction mapping, used as two orthogonal mass spectrometry based approaches.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
    was_validated_verified: true
  - acquisition_details: >-
      Subcellular protein localization was observed directly by immunofluorescence-based
      staining (ICC-IF) with Human Protein Atlas antibodies followed by confocal microscopy.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Transcriptional and fitness phenotypes were observed directly by single-cell CRISPR
      interference perturbation screens (perturb-seq) in cells expressing inducible dCas9.
    was_directly_observed: true
    was_inferred_derived: false
    was_reported_by_subjects: false
  - acquisition_details: >-
      Hierarchical cell maps are not directly observed but derived computationally, by
      embedding each input modality, fusing the embeddings into a joint co-embedding and
      detecting protein communities at multiple resolutions. Such maps are not part of this
      Beta release.
    was_directly_observed: false
    was_inferred_derived: true

collection_mechanisms:
  - mechanism_details: >-
      Affinity purification mass spectrometry on endogenously tagged MDA-MB-468 cells.
      Seventeen genes were endogenously tagged and AP-MS data acquired under three
      conditions (untreated, paclitaxel-treated, vorinostat-treated), with thirty-four
      additional genes in the process of being tagged at the time of the descriptor preprint.
  - mechanism_details: >-
      Size-exclusion chromatography coupled to mass spectrometry (SEC-MS) for proteome-wide
      complex and interaction mapping, performed on MDA-MB-468 cells under untreated,
      paclitaxel and vorinostat conditions and on KOLF2.1J iPSCs and their differentiated
      derivatives.
  - mechanism_details: >-
      Immunofluorescence staining and high-resolution confocal microscopy using the Human
      Protein Atlas resource of antibodies. Automated fixation and permeabilization
      protocols were established for a pipetting robot for the MDA-MB-468 and KOLF2 cell
      lines. Each image carries four channels: nuclei stained with DAPI (blue), endoplasmic
      reticulum with a calreticulin antibody (yellow), microtubules with a tubulin antibody
      (red), and an antibody against the protein of interest (green).
  - mechanism_details: >-
      Single-cell CRISPR interference screens. A CRISPR lentiviral library targeting the
      genes of interest with six guide RNAs per gene was designed, MDA-MB-468 and KOLF2
      CRISPR lines expressing inducible dCas9 were generated and characterized, and screens
      were run using the 10x Genomics 3'HT kit.

collection_timeframes:
  - timeframe_details: >-
      The sources give no start or end date for data collection itself. The NIH project
      period for OT2OD032742 runs from 2022-09-01 to 2026-08-31, with quarterly data
      releases throughout; the Dataverse record for this release gives a Data Creation Date
      and a Deposit Date of 2025-02-27, and files were published between 2026-06-17 and
      2026-07-15.
    source_caveats: >-
      start_date and end_date are left unpopulated because the dates available in the bundle
      describe the funding award and the repository deposit, not the interval over which
      these data were acquired.

data_collectors:
  - collector_details: >-
      Nevan Krogan laboratory, University of California San Francisco: AP-MS and SEC-MS
      protein-protein interaction data generation.
    role: academic_institution
  - collector_details: >-
      Lundberg Lab, Stanford University (with KTH Royal Institute of Technology
      collaborators): immunofluorescence spatial proteomics imaging.
    role: academic_institution
  - collector_details: >-
      University of California San Diego: single-cell CRISPR interference perturbation
      screens and cell line engineering, and overall project coordination.
    role: academic_institution
  - collector_details: >-
      University of Virginia: AI-readiness packaging, provenance graph computation and
      archival deposit of the release.
    role: academic_institution

direct_collection:
  - is_direct: false
    collection_details: >-
      No data were collected directly from individuals. All data derive from established
      human cell lines obtained from third parties: MDA-MB-468 (RRID:CVCL_0419) from the
      American Type Culture Collection, and KOLF2.1J (RRID:CVCL_B5P3) from the Human Induced
      Pluripotent Stem Cells Initiative (HipSci) resource, available to not-for-profit
      organizations under a simple material transfer agreement.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: |-
      Targeted selection of approximately 100 chromatin modifiers and 100 metabolic enzymes implicated in cancer, neuropsychiatric and cardiac disorders, together with their interactors and key signaling molecules.
      Expressed genome-scale CRISPR interference screening in KOLF2.1J iPSCs covering 11,739 targeted genes with six guide RNAs per gene.
      Immunofluorescence mapping of 464 proteins of interest per treatment condition in MDA-MB-468 cells, selected from the Human Protein Atlas antibody resource, with further proteins pending significant hits from the genetic perturbation and protein-protein interaction results.
      Selection of two ethically sourced, well-characterized and disease-relevant cell lines with paired perturbed and unperturbed conditions.
    why_not_representative: >-
      Data in this release were derived from commercially available de-identified human cell
      lines and do not represent all biological variants which may be seen in the population
      at large. Protein sets interrogated by the SEC-MS, immunofluorescence imaging and
      CRISPRi perturb-seq modalities overlap incompletely.

instances:
  - instance_type: >-
      Four-channel immunofluorescence confocal microscopy image of MDA-MB-468 cells stained
      for a single protein of interest against nuclear, endoplasmic reticulum and
      microtubule reference markers
    data_substrate: B2AI_SUBSTRATE:56
    data_topic: B2AI_TOPIC:19
    notes: >-
      Covering 464 proteins of interest in each of three conditions (untreated, paclitaxel,
      vorinostat). The June 2025 revision added RGB composite images alongside the
      per-channel data.
    source_caveats: >-
      data_topic B2AI_TOPIC:19 (Microscale Imaging) is the closest available term for
      subcellular confocal microscopy; the sources describe the modality as spatial
      proteomics / cell imaging, which the vocabulary does not offer as a single term.
  - instance_type: >-
      Protein elution profile across size-exclusion chromatography fractions, quantified by
      mass spectrometry
    data_substrate: B2AI_SUBSTRATE:59
    data_topic: B2AI_TOPIC:28
    notes: >-
      SEC-MS in MDA-MB-468 cells identified 72 of the 100 chromatin modifiers of interest,
      52 of them integral components of protein complexes, and detected interaction profiles
      of over a thousand complexes; more than 700 protein complexes were uncovered in both
      parental KOLF2 iPSCs and differentiated neurons.
  - instance_type: >-
      Bait-prey protein-protein interaction record from affinity purification of an
      endogenously tagged protein, identified by tandem mass spectrometry
    data_substrate: B2AI_SUBSTRATE:58
    data_topic: B2AI_TOPIC:21
    notes: >-
      Released for paclitaxel-treated and vorinostat-treated MDA-MB-468 cells in the June
      2026 release; the descriptor preprint reports seventeen genes endogenously tagged.
    source_caveats: >-
      data_substrate B2AI_SUBSTRATE:58 (Mass Spectrometry Data) is the genus term; the
      vocabulary offers no AP-MS-specific substrate. data_topic B2AI_TOPIC:21 (Networks And
      Pathways) is the nearest term for protein-protein interaction data, which the
      vocabulary does not list directly.
  - instance_type: >-
      Single-cell transcriptional profile associated with CRISPR interference knockdown of a
      targeted gene
    data_substrate: B2AI_SUBSTRATE:64
    data_topic: B2AI_TOPIC:34
    notes: >-
      The KOLF2.1J perturbation cell atlas maps transcriptional and fitness phenotypes
      associated with 11,739 targeted genes; MDA-MB-468 perturb-seq covers 200 genes under
      untreated, paclitaxel and vorinostat conditions.

relationships:
  - relationship_details: >-
      Instances across the three modalities are linked by the identity of the targeted or
      measured protein or gene, which is what permits their later fusion into a single cell
      map. The release states explicitly that the protein sets interrogated by SEC-MS
      protein-protein interaction, immunofluorescence protein localization and CRISPRi
      perturb-seq data overlap incompletely, so the linkage is partial.

subpopulations:
  - subpopulation_elements_present: false
    identification: >-
      No human demographic subpopulations are represented. The biological groupings in the
      dataset are cell line, differentiation state and treatment condition.
    distribution: >-
      MDA-MB-468 triple-negative breast cancer cells under three conditions (untreated,
      paclitaxel, vorinostat); KOLF2.1J induced pluripotent stem cells in four states
      (undifferentiated parental, neural progenitor cell, neuron, cardiomyocyte). The
      MDA-MB-468 line was established from a pleural effusion metastatic site of a
      51-year-old black female with metastatic mammary adenocarcinoma; the KOLF2.1J line was
      derived from a healthy male Northern European donor.

variables:
  - variable_name: cell_line
    data_type: categorical
    categories:
      - MDA-MB-468
      - KOLF2.1J
    quality_notes: >-
      MDA-MB-468 is RRID:CVCL_0419, available from ATCC; KOLF2.1J is RRID:CVCL_B5P3,
      available from the HipSci resource.
  - variable_name: treatment_condition
    data_type: categorical
    categories:
      - untreated (DMSO control)
      - paclitaxel
      - vorinostat
    quality_notes: Applies to the MDA-MB-468 breast cancer arm of the release.
  - variable_name: cell_type
    data_type: categorical
    categories:
      - undifferentiated (parental) iPSC
      - neural progenitor cell
      - neuron
      - cardiomyocyte
    quality_notes: >-
      Applies to the KOLF2.1J arm. SEC-MS covers all four states; perturb-seq in this
      release covers the undifferentiated state only.
  - variable_name: protein_of_interest_channel
    data_type: array
    measurement_technique: >-
      Immunofluorescence staining with a Human Protein Atlas antibody against the protein of
      interest, imaged by confocal microscopy; green channel.
  - variable_name: nucleus_reference_channel
    data_type: array
    measurement_technique: DAPI counterstain of nuclei; blue channel.
  - variable_name: endoplasmic_reticulum_reference_channel
    data_type: array
    measurement_technique: Calreticulin antibody staining of endoplasmic reticulum; yellow channel.
  - variable_name: microtubule_reference_channel
    data_type: array
    measurement_technique: Tubulin antibody staining of microtubules; red channel.
  - variable_name: targeted_gene
    data_type: identifier
    measurement_technique: >-
      CRISPR interference with a lentiviral guide RNA library using six guide RNAs per gene,
      read out by single-cell RNA sequencing on the 10x Genomics 3'HT platform.
    quality_notes: >-
      11,739 genes targeted in the expressed genome-scale KOLF2.1J screen; 200 genes in the
      MDA-MB-468 screens.

raw_data_sources:
  - source_description: >-
      Raw mass spectrometry files for the SEC-MS protein-protein interaction data in KOLF2.1J
      iPSCs and their NPC, neuron and cardiomyocyte derivatives.
    source_type: external repository deposit
    access_details: >-
      Linked from the release record as a MassIVE Repository deposit; the specific accession
      is not stated in the source.
    raw_data_format: mass spectrometry raw files
  - source_description: >-
      Raw mass spectrometry files for the SEC-MS data in MDA-MB-468 breast cancer cells with
      and without paclitaxel or vorinostat treatment.
    source_type: external repository deposit
    access_details: >-
      Linked from the release record as a MassIVE Repository deposit; the specific accession
      is not stated in the source.
    raw_data_format: mass spectrometry raw files
  - source_description: >-
      Raw mass spectrometry files for the AP-MS data in MDA-MB-468 cells treated with
      paclitaxel and, separately, with vorinostat.
    source_type: external repository deposit
    access_details: >-
      Two separate MassIVE Repository deposits are linked from the June 2026 release record;
      accessions are not stated in the source.
    raw_data_format: mass spectrometry raw files
  - source_description: >-
      Raw sequence data from the expressed genome-scale CRISPRi perturbation cell atlas in
      KOLF2.1J iPSCs.
    source_type: external repository deposit
    access_details: >-
      Deposited to the NCBI Sequence Read Archive under a BioProject linked from the release
      record; the archive file cm4ai_perturb-seq_KOLF2_raw_sra.zip in this release carries the
      accompanying RO-Crate metadata. Perturb-seq data for KOLF2.1J and for MDA-MB-468 are
      marked Embargoed in the June 2026 release record.
    raw_data_format: single-cell RNA sequencing reads
  - source_description: >-
      MDA-MB-468 triple-negative breast cancer cell line, established from a metastatic site
      pleural effusion of a 51-year-old black female with metastatic mammary adenocarcinoma.
    source_type: biological source material
    access_details: >-
      Available from the American Type Culture Collection (RRID:CVCL_0419). Extensively
      characterized, with transcriptomic, mutational profile and whole-genome sequencing data
      available.
  - source_description: >-
      KOLF2.1J induced pluripotent stem cell line, derived from a healthy male Northern
      European donor.
    source_type: biological source material
    access_details: >-
      Available from the Human Induced Pluripotent Stem Cells Initiative (HipSci) resource
      (RRID:CVCL_B5P3); accessible to not-for-profit organizations via a simple material
      transfer agreement.

preprocessing_strategies:
  - preprocessing_details: >-
      Protein-protein interaction networks are represented with the node2vec deep learning
      model to reduce dimensionality, producing a PPI embedding that captures each protein's
      interaction neighbourhood.
  - preprocessing_details: >-
      Immunofluorescence images are processed with a Human Protein Atlas deep learning model
      to reduce dimensionality, producing an image embedding that captures protein
      localization.
  - preprocessing_details: >-
      PPI and image embeddings are integrated by contrastive deep learning into a per-protein
      co-embedding, learned so that the original embeddings can be reconstructed with minimal
      information loss and so that proteins with similar inputs receive similar co-embeddings.
  - preprocessing_details: >-
      Community detection over all-by-all protein similarities in the co-embedding space
      yields a hierarchy of protein communities, output as the final cell map. This step is
      part of the MuSIC pipeline; computed cell maps are not included in this release.
  - preprocessing_details: >-
      The June 2025 revision added RGB composite immunofluorescence images alongside the
      per-channel data and applied revised file naming conventions.

cleaning_strategies:
  - cleaning_details: >-
      Antibody quality control follows Human Protein Atlas standard procedures for image and
      antibody validation.
  - cleaning_details: >-
      Single-cell CRISPR screen outputs undergo quality control before release; the
      descriptor preprint records screens as being QCed at the time of writing.
  - cleaning_details: >-
      Datasets and their schemas are validated by the FAIRSCAPE client package before an
      RO-Crate is assembled and dispatched for identifier minting and provenance entailment.

labeling_strategies:
  - labeling_details: >-
      Cell map assemblies are annotated in a two-pronged approach. First, maps are aligned to
      known protein function and pathway resources, including the Gene Ontology and Reactome,
      to identify assemblies with high overlap with known cell biology. Second, assemblies are
      named using a large language model approach that assigns a descriptive name to a set of
      proteins together with a name confidence score.
    data_annotation_protocol: >-
      Alignment to Gene Ontology and Reactome followed by LLM-assisted naming with confidence
      scoring, implemented in the cellmaps_hierarchyeval component of the Cell Mapping Toolkit.

missing_data_documentation:
  - missing_data_patterns: >-
      Computed cell maps are absent from this release. Immunofluorescence images for the iPSC
      lines are announced as forthcoming. AP-MS interactomes for the triple-negative breast
      cancer arm were announced as forthcoming in the portal flagship dataset description and
      appear for treated cells only in the June 2026 release. Perturb-seq data for KOLF2.1J
      iPSCs and for MDA-MB-468 cells are marked Embargoed.
    missing_data_causes: >-
      Interim status of the release; temporary pre-publication embargo on some datasets;
      staged data generation across a four-year project with quarterly releases.
    handling_strategy: >-
      Missing components are declared explicitly in the release record under Completeness and
      are scheduled to be supplied through quarterly updates until the project ends in
      November 2026.

anomalies:
  - anomaly_details: >-
      The HTML provenance graph files distributed with the June 2025 release require download
      to view properly and will not display in the Dataverse preview.
  - anomaly_details: >-
      Protein-protein interaction (SEC-MS), protein localization (immunofluorescence imaging)
      and CRISPRi perturb-seq data interrogate sets of proteins which overlap incompletely, so
      joint analyses across all three modalities cover fewer proteins than any single modality.

errata:
  - erratum_details: >-
      The June 2025 release was revised to version 2: RGB immunofluorescent images were added,
      corrections were made to RO-Crate metadata, and file naming conventions were changed.
    erratum_url: https://doi.org/10.18130/V3/F3TD5R

known_limitations:
  - limitation_type: scope_limitation
    limitation_description: >-
      This is an interim release. It does not contain predicted cell maps, which will be added
      in future releases.
    recommended_mitigation: >-
      Track subsequent quarterly releases through to the end of the project in November 2026.
  - limitation_type: integration_limitation
    limitation_description: >-
      SEC-MS protein-protein interaction, immunofluorescence protein localization and CRISPRi
      perturb-seq data interrogate sets of proteins which incompletely overlap.
    scope_impact: >-
      The current release is most suitable for bioinformatics analysis of the individual
      datasets rather than for fully integrated multimodal analysis.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Meaningful analysis requires domain expertise in proteomics, spatial imaging and
      functional genomics.
  - limitation_type: coverage_limitation
    limitation_description: >-
      Some datasets are under temporary pre-publication embargo and are not accessible at the
      time of release, including the perturb-seq data for KOLF2.1J iPSCs and for MDA-MB-468
      breast cancer cells.
  - limitation_type: representativeness_limitation
    limitation_description: >-
      Data are drawn from two human cell lines under a limited set of treatment and
      differentiation conditions and do not represent all biological variants which may be
      seen in the population at large.

known_biases:
  - bias_type: representation_bias
    bias_description: >-
      Data in this release were derived from commercially available de-identified human cell
      lines and do not represent all biological variants which may be seen in the population
      at large.
    mitigation_strategy: >-
      The limitation is declared explicitly in the release record so that users can scope
      claims accordingly; the project spans two cell lines of differing origin and multiple
      differentiation states to broaden coverage.
  - bias_type: selection_bias
    bias_description: >-
      Proteins and genes were not sampled at random. Targets were chosen as chromatin
      modifiers, metabolic enzymes and their interactors implicated in cancer,
      neuropsychiatric and cardiac disorders, and imaging coverage was prioritized by
      significant hits from the genetic perturbation and interaction results.
    affected_subsets:
      - >-
        All modalities; most acutely the AP-MS and immunofluorescence arms, which are
        target-directed rather than genome-scale.
    source_caveats: >-
      The release record's own "Potential Sources of Bias" section names only the cell-line
      representativeness point recorded above. This second entry is derived from the target
      selection procedures described in the CM4AI descriptor preprint's Data Acquisition
      section, which the sources do not themselves label as a bias.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The release record states Human Subjects: No, De-identified Samples: Yes, and FDA
      Regulated: No. CM4AI data are non-clinical, being derived from tissue cultures, and are
      considered de-identified as they cannot be matched, with current knowledge, to a human
      subject.

confidential_elements:
  - confidential_elements_present: true
    confidentiality_details: >-
      Some datasets are under temporary pre-publication embargo and are therefore withheld
      from open distribution at the time of release; in the June 2026 record the perturb-seq
      data in KOLF2.1J iPSCs and in MDA-MB-468 breast cancer cells are both marked Embargoed.

is_deidentified:
  identifiable_elements_present: false
  deidentification_details: >-
    CM4AI data are distinctive within Bridge2AI in that they are non-clinical, being derived
    from tissue cultures, and are considered to be de-identified as they cannot be matched,
    with current knowledge, to a human subject. The Dataverse release record states
    De-identified Samples: Yes and Human Subjects: No. The underlying cell lines are
    commercially or institutionally distributed lines described by the project as ethically
    sourced.

human_subject_research:
  involves_human_subjects: false
  regulatory_compliance:
    - >-
      The release record states Human Subjects: No, De-identified Samples: Yes, and FDA
      Regulated: No.
  notes: >-
    The MDA-MB-468 and KOLF2.1J lines are described by the project as ethically sourced; the
    KOLF2.1J line is available to not-for-profit organizations via a simple material transfer
    agreement. The sources describe no consent, notification or assent procedures for the
    original human donors of these lines.

ethical_reviews:
  - contact_person: Vardit Ravitsky
    reviewing_organization: CM4AI Ethics Module, The Hastings Center
    review_details: >-
      Named as an ethical review contact for the release. The CM4AI Ethics module developed
      the plan for ethical preparation, licensing, dissemination and data access supervision
      of CM4AI datasets, balancing openness with protection of intellectual property and
      supervision of potential commercialization, and employs a methodology inspired by
      Value-Sensitive Design to create normative standards for responsible dataset and AI
      design.
  - contact_person: Jean-Christophe Belisle-Pipon
    reviewing_organization: CM4AI Ethics Module, Simon Fraser University
    review_details: >-
      Named as an ethical review contact for the release. Contributions include a first
      version of the Value Repository underpinning the CM4AI ethical guidelines, and support
      for the Bridge2AI Code of Conduct that participants must attest to before accessing
      Bridge2AI data, including CM4AI datasets.

data_governance:
  committee_name: CM4AI Data Governance Committee
  committee_contact: Jillian Parker
  accountable_organization:
    id: cm4ai:org/ucsd
    name: University of California San Diego
  access_review_process: >-
    A Data Access Committee supervises ethical matters related to dataset distribution and
    potential dual licensing for commercial use. Commercial use requires a separate license
    negotiation with the copyright holder, which is UCSD, Stanford and/or UCSF depending on
    the specific data package in question.
  stewardship_roles:
    - Data governance committee contact at UCSD
    - ethical review contacts at The Hastings Center and Simon Fraser University
    - >-
      long-term archival stewardship by the University of Virginia Library through the UVA
      Dataverse
  notes: >-
    Contact addresses as given in the release record: data governance, Jillian Parker
    (jillianparker@health.ucsd.edu); ethical review, Vardit Ravitsky
    (ravitskyv@thehastingscenter.org) and Jean-Christophe Belisle-Pipon
    (jean-christophe_belisle-pipon@sfu.ca).

