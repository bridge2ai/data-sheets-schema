name: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
title: Cell Maps for Artificial Intelligence - June 2026 Data Release (Beta)
description: >-
  The June 2026 Data Release (Beta) of Cell Maps for Artificial Intelligence (CM4AI), the
  Functional Genomics Grand Challenge in the U.S. National Institutes of Health Bridge2AI
  program, deposited in the University of Virginia Dataverse (LibraData) under DOI
  10.18130/V3/HIGT4C.
  The release provides multi-modal data generated in two cell lines described by the project
  as ethically sourced: the triple-negative breast cancer line MDA-MB-468, with and without
  treatment by paclitaxel and vorinostat, and the induced pluripotent stem cell line
  KOLF2.1J, both undifferentiated (parental) and differentiated into neural progenitor
  cells, neurons and cardiomyocytes. It contains: single-cell CRISPR interference
  perturbation sequencing (perturb-seq) data for MDA-MB-468 cells with and without treatment
  and for undifferentiated KOLF2.1J iPSCs; size-exclusion chromatography mass spectrometry
  (SEC-MS) protein-protein interaction data for MDA-MB-468 cells with and without treatment
  and for undifferentiated KOLF2.1J iPSCs and their NPC, neuron and cardiomyocyte
  derivatives; affinity purification mass spectrometry (AP-MS) data for treated MDA-MB-468
  cells; and immunofluorescence (ICC-IF) confocal microscopy images of 464 proteins of
  interest in MDA-MB-468 cells under untreated, paclitaxel and vorinostat conditions.
  Files are distributed as ten ZIP archives, one of which is a release metadata package.
  Outputs are packaged with machine-readable provenance graphs and rich metadata as
  AI-ready RO-Crate datasets produced with the FAIRSCAPE framework, and large raw data
  are mirrored in external repositories (MassIVE for mass spectrometry, NCBI SRA for
  sequencing, Figshare for the iPSC CRISPRi perturbation atlas).
  Cell maps themselves - hierarchical directed acyclic graphs in which each node is an
  assembly of proteins in proximity at a given scale, from whole compartments such as the
  nucleus and mitochondria down to individual protein complexes - are computed from these
  input streams by the Multi-Scale Integrated Cell (MuSIC) pipeline, but are not included
  in this Beta release.
  The release is one instalment of a quarterly series produced by a collaboration of UCSD,
  UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham, Simon Fraser University and the
  Hastings Center, organized into six modules across three pillars: Data (Data Acquisition,
  Tools, Standards), People (Skills and Workforce Development, Teaming) and Ethics.
