  data_use_permission: no_commercial_use
  license_terms: >-
    Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0).
    Users are free to share (copy and redistribute in any medium or format) and adapt (remix,
    transform and build upon the material) provided they give appropriate credit, provide a
