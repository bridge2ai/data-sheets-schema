distribution_formats:
  - format: ZIP archive
    media_type: application/zip
    access_urls:
      - https://doi.org/10.18130/V3/HIGT4C
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    download_url: https://dataverse.lib.virginia.edu/api/access/datafile/
    checksum: >-
      An MD5 checksum is published for each of the ten archives and is recorded on the
      corresponding file collection.
    notes: >-
      The dataset as a whole exceeds the repository's bulk download limit of 1.9 GB, so files
      must be selected individually from the file table or retrieved programmatically through
      the Dataverse Data Access API, appending the numeric file identifier to the download URL.
  - format: RO-Crate (JSON-LD metadata with EVI provenance graphs)
    media_type: application/ld+json
    notes: >-
      Output data are packaged with provenance graphs and rich metadata as AI-ready datasets in
      RO-Crate format using an extended client-server version of the FAIRSCAPE framework.
      Persistent identifiers resolve to machine- and human-readable landing pages presenting
      the evidence graph in graphical, JSON-LD and RDF-XML views.

distribution_dates:
  - release_dates:
      - "2026-06-17"
      - "2026-07-15"
    notes: >-
      Seven archives (both AP-MS packages, both SEC-MS packages, both perturb-seq packages and
      the release metadata package) were published on 2026-06-17; the three immunofluorescence
      image archives were published on 2026-07-15. Preceding CM4AI releases are recorded under
      version_access.

third_party_sharing:
  - is_shared: true
    notes: >-
      Data are openly disseminated through the University of Virginia Dataverse (LibraData) and
      the CM4AI web portal built on the U-BRITE platform, with raw mass spectrometry deposited
      to MassIVE, raw sequencing to the NCBI Sequence Read Archive, and the iPSC CRISPRi
      perturbation atlas to Figshare. The project collaborates with the NIH Common Fund Data
      Ecosystem for data curation and integration into the broader scientific community.

external_resources:
  - external_resources:
      - https://cm4ai.org/
    archival: false
    notes: >-
      CM4AI project web portal, hosted on the U-BRITE platform, providing documentation, data
      release listings, tools, publications and training material. The portal carries a notice
      that the repository is under review for potential modification in compliance with
      Administration directives.
  - external_resources:
      - https://dataverse.lib.virginia.edu/dataset.xhtml?persistentId=doi:10.18130/V3/HIGT4C
    archival: true
    future_guarantees: >-
      Long-term preservation in the University of Virginia Dataverse, supported by committed
      institutional funds.
    notes: LibraData, the University of Virginia's Dataverse instance and NIH-approved generalist repository.
  - external_resources:
      - MassIVE Repository
    archival: true
    restrictions:
      - >-
        Specific accessions for the CM4AI SEC-MS and AP-MS deposits are linked from the release
        record but not written out in the source text.
    notes: >-
      Holds raw mass spectrometry data for SEC-MS in human iPSCs and in human cancer cells, and
      for AP-MS in paclitaxel- and vorinostat-treated MDA-MB-468 cells.
  - external_resources:
      - NCBI BioProject / Sequence Read Archive
    archival: true
    restrictions:
      - >-
        Perturb-seq data in KOLF2.1J iPSCs and in MDA-MB-468 cells are marked Embargoed in the
        June 2026 release record.
    notes: Holds raw single-cell sequencing reads from the CRISPRi perturbation screens.
  - external_resources:
      - Figshare
    archival: true
    notes: Hosts the CRISPRi Perturbation Atlas of iPSCs, linked from the June 2026 release record.
  - external_resources:
      - https://github.com/idekerlab/cellmaps_pipeline
    archival: false
    notes: >-
      Cell Mapping Toolkit, a series of pip-installable Python packages implementing the
      end-to-end MuSIC pipeline (cellmaps_imagedownloader, cellmaps_ppidownloader,
      cellmaps_image_embedding, cellmaps_ppi_embedding, cellmaps_coembedding,
      cellmaps_generate_hierarchy, cellmaps_hierarchyeval), with user documentation hosted at
      https://cellmaps-pipeline.readthedocs.io/. Alpha-level tools are released on GitHub under
      BSD-3 license and production-ready tools archived in Zenodo.
  - external_resources:
      - https://fairscape.github.io
    archival: false
    notes: >-
      FAIRSCAPE AI-readiness framework, comprising a client-side Python package
      (FAIRSCAPE-CLI) and a server application that mint ARK persistent identifiers, assemble
      RO-Crates and compute end-to-end provenance entailments in the EVI Evidence Graph
      Ontology. Copyright the Rector and Board of Visitors of the University of Virginia,
      available under the MIT license.
  - external_resources:
      - http://integrativemodeling.org
    archival: false
    notes: >-
      Open-source Integrative Modeling Platform (IMP) package used, with the Python Modeling
      Interface, for integrative structure modeling of MuSIC communities.
  - external_resources:
      - https://creativecommons.org/licenses/by-nc-sa/4.0/
    archival: false
    notes: Canonical URL of the CC BY-NC-SA 4.0 license under which the release is distributed.

