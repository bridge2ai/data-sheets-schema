    - >-
      The release record states FDA Regulated: No.
    - >-
      The release record states Human Subjects: No and De-identified Samples: Yes.
  source_caveats: >-
    hipaa_compliant is deliberately left unpopulated: HIPAA is not discussed anywhere in the
    sources, and no compliance determination is stated by the project.

intended_uses:
  - use_category: AI-ready data resource for functional genomics
    usage_notes: >-
      The release is intended to serve as AI-ready datasets supporting research in functional
      genomics, packaged with provenance graphs and rich metadata in RO-Crate format.
  - use_category: AI model training
    usage_notes: >-
      Intended as training material for AI/ML models, including visible machine learning
      systems built on knowledge maps of cell and tissue architecture.
  - use_category: Cellular process analysis
    usage_notes: >-
      Intended to support analysis of cellular processes through protein interaction,
      localization and perturbation phenotype data measured in matched cellular contexts.
  - use_category: Disease, treatment and perturbation response analysis
    usage_notes: >-
      Intended to support study of cell architectural changes and interactions in the presence
      of specific disease processes, treatment conditions or genetic perturbations, using the
      paired treated and untreated and differentiated and undifferentiated arms.

other_tasks:
  - task_details: >-
      Cell maps derived from these data can be used in AI tools for visible machine learning
      or visible neural networks, to interrogate how protein assemblies in the cell affect
      cell-level phenotype predictions.
  - task_details: >-
      Cell maps provide a foundation for downstream applications in human genomics, including
      interpretation of genetic variants and mutations.
  - task_details: >-
      Integrative structure modeling of protein communities: communities can be ranked by the
      amount of available structural information from the Protein Data Bank, the AlphaFold
      Protein Structure Database, crosslinking mass spectrometry and disorder prediction, and
      top-ranked communities modeled with the Integrative Modeling Platform.

existing_uses:
  - examples:
      - >-
        The preprint "A perturbation cell atlas of human induced pluripotent stem cells"
        (Nourreddine et al., bioRxiv 2024.11.03.621734) is listed as a Related Publication of
        this release and describes the expressed genome-scale CRISPRi perturbation cell atlas
        in KOLF2.1J iPSCs, with findings validated via phenotypic, protein-interaction and
        metabolic tracing assays.
      - >-
        Earlier CM4AI data and tools were made available at the March 2024 CodeFest with
        detailed tutorials explaining how the data were derived and integrated, and with
        production-ready software for producing the datasets; 38 registrants attended.
    source_caveats: >-
      The sources list the Nourreddine preprint under "Related Publication / References" but
      do not state that the specific files in this release were the ones analysed in it.

discouraged_uses:
  - discouragement_details: >-
      Integrated multimodal cell-map analysis is not well supported by this release: computed
      cell maps are absent and the protein sets covered by the three modalities overlap
      incompletely. The release record states that the current release is most suitable for
      bioinformatics analysis of the individual datasets.
  - discouragement_details: >-
      Use without domain expertise is discouraged; meaningful analysis requires familiarity
      with the underlying proteomic, imaging and functional genomics assays.

prohibited_uses:
  - prohibition_reason: >-
      These laboratory data are not to be used in clinical decision-making or in any context
      involving patient care without appropriate regulatory oversight and approval.
  - prohibition_reason: >-
      Commercial use is not permitted under the CC BY-NC-SA 4.0 license and requires a
      separate license negotiation with the copyright holder.

future_use_impacts:
  - impact_details: >-
      Because this is an interim Beta release lacking computed cell maps and containing
      modalities whose protein coverage overlaps incompletely, downstream models trained on it
      may under-represent the integrated cell architecture the project ultimately aims to
      deliver; users should expect subsequent releases to change coverage.
  - impact_details: >-
      The Ethics module anticipates potential applications of the data and derived AI/ML
      systems and integrates them into data governance frameworks to optimize benefits and
      mitigate potential risks, promoting use for the collective good, and is developing tools
      to enhance awareness of the ethical, legal and social ramifications of CM4AI data and
      the AI systems built on it.

