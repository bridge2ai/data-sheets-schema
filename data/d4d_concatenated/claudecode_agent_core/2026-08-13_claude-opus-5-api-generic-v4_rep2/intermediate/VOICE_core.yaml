id: https://doi.org/10.13026/8xbn-nq66
name: Bridge2AI-Voice
title: "Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information"
description: >-
  Bridge2AI-Voice is a multi-institutional, ethically sourced voice dataset that links acoustic
  recordings of voice, speech, breathing and cough to detailed health information. It was generated
  by the Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program with the goal of
  establishing voice as a biomarker of health and of fuelling voice AI research with data that is
  large, diverse and clinically validated. Adults presenting at specialty clinics were recruited
  into predefined cohorts - voice disorders, neurological and neurodegenerative disorders, mood and
  psychiatric disorders, respiratory disorders, and controls - and completed a standardised protocol
  of acoustic tasks, demographic and confounder surveys, disease-specific validated questionnaires,
  and clinician-confirmed diagnoses. Version 3.1.0 covers 833 adult participants collected at five
  North American sites in the United States and Canada. The public release contains only material
  judged low risk: derived acoustic representations (spectrograms, Mel spectrograms, MFCCs, pitch,
  articulatory and phonetic-posteriorgram features, and static openSMILE, Praat and Parselmouth
  features) together with phenotype tables, audio quality metrics and per-recording metadata. The
  original audio waveforms are not part of this release and are distributed separately under
  controlled access. The consortium's stated enrolment target is 10,000 voices by 2027, and a
  companion pediatric dataset covering 300 participants aged 2 to 18 is released as a separate
  resource.
