      A separate single-site study of 47 participants at the USF Health Voice Center between
      5 June and 28 July 2023, conducted under USF IRB number 004890, which assessed task
      completion and usability of the collection application. No audio data was collected at that
      stage of app development, and the study does not contribute participants to this dataset.
  - id: https://b2ai-voice.org/datasheet/VOICE/external/audiomics-viewpoint
    external_resources:
      - >-
        Bensoussan, Y., Elemento, O., Rameau, A. "Voice as an AI Biomarker of Health - Introducing
        Audiomics", JAMA Otolaryngol Head Neck Surg 2024;150(4):283-284,
        doi 10.1001/jamaoto.2023.4807
    archival: true
  - id: https://b2ai-voice.org/datasheet/VOICE/external/acoustic-recommendations
    external_resources:
      - >-
        Awan, S. N. et al. "Evidence-based recommendations for tablet recordings from the
        Bridge2AI-voice acoustic experiments", J Voice 2024, doi 10.1016/j.jvoice.2024.08.029
    archival: true
  - id: https://b2ai-voice.org/datasheet/VOICE/external/self-containment
    external_resources:
      - >-
        The healthsheet records that the dataset is self-contained and does not rely on external
        resources, so no guarantees of persistence, archival versions or third-party restrictions
        apply to its content.
    archival: true
    future_guarantees: >-
      Each version of the dataset has a unique DOI and older versions continue by default to be
      supported, hosted and made available; the dataset publishers reserve the right to remove
      access to older versions.

related_datasets:
  - id: https://b2ai-voice.org/datasheet/VOICE/relationship/pediatric
    relationship_type: is_supplemented_by
    target_dataset: https://doi.org/10.13026/mf9s-5r03
    description: >-
      The Bridge2AI-Voice Pediatric Dataset, collected at the Hospital for Sick Children from 300
      participants aged 2 to 18 using reproschema-ui with the Bridge2AI-Voice pediatric protocol,
      and released separately on PhysioNet under the same access terms. Version 1.1.0 provides
      derived features for 23,533 recordings.
  - id: https://b2ai-voice.org/datasheet/VOICE/relationship/v3-0-0
    relationship_type: is_new_version_of
    target_dataset: https://doi.org/10.13026/k81f-qr68
    description: >-
      Version 3.0.0 of the same dataset, published 2025-12-16, which introduced the reorganised
      phenotype directory, the sparc articulatory features and the phonetic posteriorgrams, and
      added 391 participants to reach 833.

errata:
  - id: https://b2ai-voice.org/datasheet/VOICE/erratum/none
    erratum_details: >-
      There is no erratum. A changelog for each dataset version is published online with the dataset
      metadata. Version 2.0.1 was issued solely to correct the authorship list, and version 3.1.0
      fixed broken parquet files carried in version 3.0.0.

updates:
  frequency: Semi-annual
  update_details: >-
    Further versions of the dataset are released twice a year as new versions on the publishing
    platform. Users are notified through news items on the platform and through standard
    communication channels. Updates may correct labelling errors, add new instances or delete
    instances; each version carries a unique DOI, and a changelog for each version is published
    online with the dataset metadata.

version_access:
  versions_available:
    - "1.0 (Health Data Nexus)"
    - "1.1"
    - "2.0.0"
    - "2.0.1"
    - "3.0.0"
    - "3.1.0"
  latest_version_doi: https://doi.org/10.13026/37yb-1t42
  version_details: >-
    By default older versions of the dataset continue to be supported, hosted and made available to
    researchers, and each version has a unique DOI; the dataset publishers reserve the right to
    remove access to older versions. Version 1.1 added Mel-frequency cepstral coefficients; version
    2.0 added 136 participants, reprocessed spectrograms and removed spectrograms and MFCCs derived
    from free-speech files; version 2.0.1 corrected the authorship list; version 3.0.0 added 391
    participants, separated the single phenotype file into individual files, and added sparc and ppg
    features; version 3.1.0 added no new participants but fixed broken parquet files, added audio
    quality metrics and per-recording metadata, back-filled validated diagnosis information, and
    renamed some gold-standard variables. The files for version 1.1 are no longer available.

retention_limit:
  retention_period: >-
    Indefinite for the hosted dataset; two years from the start date for data transferred to
    approved recipients under the Data Transfer and Use Agreement.
  retention_details: >-
    Once data is contributed it will be retained as long as it is useful for research purposes,
    possibly indefinitely. Recipients of transferred data must destroy or return it two years after
    the start date of their agreement, upon completion of their project, upon expiry of the
    applicable ethics approval, or upon termination, whichever occurs first, and must submit written
    certification of destruction within thirty days; a single copy may be retained where necessary
    to comply with records retention requirements or for research integrity and verification, and
    the restrictions of the agreement continue to apply to that archival copy. Separately, the IRB
    protocol provides that identifiable data and the datasheets linking participant numbers to
    participant information are kept locally at each institution for a maximum of ten years after
    study completion and are then destroyed by the local principal investigator, and that
    de-identified study data and original consent forms are stored for a minimum of five years after
    study completion.

extension_mechanism:
  contribution_url: https://github.com/sensein/b2aiprep
  extension_details: >-
    For dataset extensions and augmentations, others may publish a derivative dataset on the hosting
    platform that references the original source; these derivative datasets may be made available
    under the same conditions as the source data. For augmentations to the code used to produce the
    data, the open-source repositories have discussion forums and issue pages that allow public
    discussion of data preprocessing, and a pull request mechanism for contributing improvements to
    the preprocessing code.