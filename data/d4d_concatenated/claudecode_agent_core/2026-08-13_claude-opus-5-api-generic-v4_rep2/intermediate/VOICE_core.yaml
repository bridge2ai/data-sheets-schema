notes: >-
  The project documentation publishes an AI-readiness self-assessment against the Bridge2AI
  recommendations for AI-readiness of biomedical data, scoring FAIRness 100%, Provenance 100%,
  Characterization 80% (the data quality criterion is recorded as not met), Pre-model
  explainability 100%, Ethics 100%, Sustainability 50% (the domain-appropriate and associated
  criteria are recorded as not met) and Computability 75% (the contextualized criterion is recorded
  as not met). The project documentation site also carries the statement that the repository is
  under review for potential modification in compliance with Administration directives. The
  recommended citation is: Bensoussan, Y., Sigaras, A., Rameau, A., Elemento, O., Powell, M.,
  Dorr, D., Payne, P., Ravitsky, V., Belisle-Pipon, J., Bahr, R., Watts, S., Bolser, D., Siu, J.,
  Lerner-Ellis, J., Rudzicz, F., Boyer, M., Abdel-Aty, Y., Ahmed Syed, T., Anibal, J., ... Ghosh, S.
  (2026). Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health information
  (version 3.1.0). PhysioNet. RRID:SCR_007345. https://doi.org/10.13026/8xbn-nq66
source_caveats: >-
  The bundle documents several releases of this dataset (PhysioNet versions 1.1, 2.0.0, 2.0.1,
  3.0.0 and 3.1.0, preceded by a version 1.0 published on Health Data Nexus) as well as a
  separately released pediatric dataset. This record describes the adult flagship dataset at
  version 3.1.0 and treats the pediatric dataset as a related dataset rather than a subset. Several
  narrative sections of the project documentation (the healthsheet, study metadata and
  de-identification methods) are written against version 2.0.0 or 3.0.0 and were not restated for
  3.1.0. Recording counts differ between sources: the documentation site reports approximately
  61,937 voice-derived recordings for version 3.0, whereas the PhysioNet release notes give
  per-feature record counts of roughly 23,500 to 32,500 for version 3.1.0. The documentation
  reports 833 adult participants for version 3.0 and the 3.1.0 release notes state that no new
  participants were added.

