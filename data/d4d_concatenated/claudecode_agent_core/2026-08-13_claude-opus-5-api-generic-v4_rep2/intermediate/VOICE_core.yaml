        Bridge2AI-voice application: initial feasibility study of voice data acquisition through
        mobile health", Front Digit Health 2025;7:1514971, doi 10.3389/fdgth.2025.1514971,
        https://pmc.ncbi.nlm.nih.gov/articles/PMC12037532/
    archival: true
