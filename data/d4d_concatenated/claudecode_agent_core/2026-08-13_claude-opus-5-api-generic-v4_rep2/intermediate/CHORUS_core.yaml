updates:
  update_details: 'The released dataset is being expanded toward an anticipated final
    dataset of 100,000 patient admissions across 9 data modalities from 14 contributing
    hospitals. As of August 2025, imaging de-identification was in process for a cohort
    larger than the roughly 1,000 images then available, EEG extraction was in process,
    and metadata for clinical notes, imaging and EEG was planned. Data contributing
    sites provide regular status updates on their progress in creating and curating
    CHoRUS data extracts, submitted through the GitHub interface or a Google Form
    and propagated to the Standards and Data Acquisition project boards via the GitHub
    API.'

extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: 'Data contributing sites follow the Chorus_SOP workflow to create
    and submit data extracts using the chorus-extract-upload tooling, and raise problems
    in the Standards Discussions or Data Acquisition Discussions areas. Clinical collaborators
    contribute semantic mappings through the chorus-mapping repository and its clinical
    validation SOP. Software contributors add tooling to the chorus-ai repositories,
    documented for users and contributors through the chorus-developer web guide and
    package status page. Sites submit status updates either directly through GitHub
    or through a Google Form that triggers a script updating GitHub issues and project
    status.'

existing_uses:
- examples:
  - 'The datasets are being used for training activities and publications, as stated
    in the September 2025 Cohort 2 informational webinar.'
- examples:
  - 'The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2, 17 November
    2025 to 31 July 2026) gives up to 30 trainees access to CHoRUS data for hands-on
    AI/ML work, use-case development, works-in-progress posters at the Bridge2AI and
    AIM-AHEAD 2026 annual meetings, conference abstracts and peer-reviewed manuscripts.'

intended_uses:
- use_category: Machine learning and AI model development for acute and critical care
  examples:
  - Building ML/AI-derived models to improve the care and outcomes of patients requiring
    critical care.
  usage_notes: 'Analysis takes place within the Bridge2AI AI/ML for Clinical Care
    Collaborative Cloud enclave, using the OHDSI tool stack, the OMOP common data
    model and R or Python.'
- use_category: External validation of clinical AI models
  examples:
  - 'Using the sequestered holdout test set to externally validate models, aiding
    marketplace adoption of AI-developed models for implementation in acute and critical
    care.'
- use_category: Education and workforce development in clinical AI
  examples:
  - Hands-on training through canonical Jupyter Notebooks, workshops on the OHDSI/OMOP
    common data model and the OHDSI tool stack, and didactics on generative AI and
    specific use cases.
  usage_notes: 'Trainees in the AIM-AHEAD Bridge2AI for Clinical Care programme use
    the data to create practical use cases and conduct collaborative research on the
    Bridge2AI Clinical Care Cloud platform.'

other_tasks:
- task_details: 'Research on contextual and social determinants of health, supported
    by data elements such as geographic distance to the nearest hospital and geocoded
    OMOP Location entities.'
- task_details: 'Methods work on multi-modal harmonization and semantic mapping, since
    the dataset pairs unified standards across EHR, waveform, imaging and text data
    with validated mappings and published SOPs.'

future_use_impacts:
- impact_details: 'The creators intend the dataset to catalyze the biomedical research
    and expertise necessary to promote patient-focused deployment of AI in acute and
    critical care, while ensuring the methods promote privacy, accountability and
    clinical benefit.'
- impact_details: 'The scope of what is shareable may change over time: community-facing
    ethics focus groups determine which data are appropriate for public sharing, and
    the project website states that the repository is under review for potential modification
    in compliance with Administration directives.'
- impact_details: 'Because full clinical notes are withheld and transformations are
    applied to limit re-identification, downstream users should not expect the shared
    data to support analyses requiring raw narrative text or direct identifiers.'

source_caveats: 'Admission counts differ between sources and are recorded as each
  states them: the September 2025 AIM-AHEAD Cohort 2 informational webinar reports
  that, as of August 2025, the dataset covered 14 different hospitals with over 45,000
  unique admissions, while chorus4ai.org reports a current released dataset of 50,000
  patient admissions from ICU, PICU and NICU. The NIH RePORTER abstract describes
  acquisition from more than 100,000 critically ill patients, consistent with the
  website''s anticipated final figure of 100,000 patient admissions. The MIT License
  identified in the sources covers the chorus-ai GitHub organization''s software rather
  than the dataset, whose access is governed by a signed licensing agreement; no data
  licence is published in these sources. The webinar deck contains four further slides
  headed "CHoRUS Dataset" and one headed "Bridge2AI for Clinical Care Dataset" whose
  figures were images and did not survive text extraction, so some dataset detail
  in that source is unavailable here. The programme-manager email published on chorus4ai.org
  is transcribed verbatim and appears to contain a typographical error. The chorus4ai.org
  capture carries a banner stating that the repository is under review for potential
  modification in compliance with Administration directives, so published figures
  may not reflect the current state of the resource. The full record''s splits, direct_collection,
  participant_privacy and third_party_sharing content has no CoreDataset counterpart:
  the holdout test set is retained under purposes, tasks and intended_uses; retrospective
  source-system collection under acquisition_methods and raw_data_sources; privacy
  techniques under is_deidentified; and controlled onward sharing under data_governance.'