purposes:
- response: 'Develop a publicly available, AI-ready critical care dataset for machine
    learning and artificial intelligence applications, generated from more than 100,000
    critically ill patients, while ensuring the methods promote privacy, accountability
    and clinical benefit.'
- response: 'Provision a holdout test set, accessible for external validation of models,
    to aid marketplace adoption of AI-developed models for implementation in acute
    and critical care.'
- response: 'Develop the network, tools, standards and education needed to build ML/AI-derived
    models that improve the care and outcomes of patients requiring critical care,
    including capabilities across a multi-center network to acquire, standardize,
    tokenize, store, visualize and label data.'
- response: 'Determine, through community-facing ethics focus groups and analysis
    of the legal and regulatory landscape, ethical and legal approaches to managing
    privacy and bias, and what data are appropriate for public sharing.'
- response: 'Cultivate expertise in the lay and scientific community to improve AI
    literacy and utilization through multimodal educational approaches, training a
    next generation of diverse academic and community AI scientists, engineers, data
    scientists and clinicians.'

addressing_gaps:
- response: 'There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care; developing high-resolution multi-center
    data sets is a critical first step towards actionable and trustworthy AI.'
- response: 'Existing data lack the diversity and resolution needed for critical care
    AI; CHoRUS aims to acquire and standardize a dataset of unprecedented diversity
    and high resolution, harmonizing multi-modal EHR, waveform, imaging and text data
    under unified standards.'
- response: 'No established legal framework existed for collecting critical care data
    at this scale; the project establishes such a framework and analyses the existing
    legal and regulatory landscape.'
- response: 'Externally sequestered data for validating clinical AI models were unavailable;
    the project sequesters holdout datasets for external validation.'

tasks:
- response: Characterizing acute and critical care illness.
- response: Predicting complications and clinical deterioration among patients with
    acute or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
- response: 'External validation of AI/ML models developed elsewhere, using the sequestered
    holdout dataset.'
- response: 'Labelling data with targets important for prediction, using a visualization
    and annotation environment.'

