id: https://chorus4ai.org/
name: CHoRUS Dataset
title: 'Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS)
  for Equitable AI'
description: 'CHoRUS (Patient-Focused Collaborative Hospital Repository Uniting Standards)
  for Equitable AI is a multicenter, multimodal, high-resolution, controlled-access
  critical care dataset assembled by the CHoRUS Network as one of four data generation
  projects in the NIH Common Fund Bridge2AI program (award OT2OD032701). Data are
  collected retrospectively from hospital source systems at 14 data acquisition centers
  within a collaboration spanning 20 academic centers and more than 60 consortium
  members. Structured electronic health record data (demographics, medication administration,
  procedures, nursing flowsheets, diagnoses) are standardized to the OMOP Common Data
  Model; unstructured clinical notes are extracted and tokenized with the OHNLP toolkit
  and are otherwise retained locally at the contributing sites; imaging is drawn from
  PACS and delivered as DICOM; bedside monitor telemetry is delivered as WFDB waveforms;
  and hospital EEG is delivered as EDF+ and Persyst. The project website reports a
  currently released dataset of 50,000 patient admissions from ICU, PICU and NICU
  settings containing 1.6 billion rows of OMOP EHR data, 7,642 admissions with radiology
  data and 23 TB of waveform data, against an anticipated final dataset of 100,000
  patient admissions and 9 data modalities from 14 contributing hospitals. Data are
  held under controlled access in a cloud enclave, and the project additionally provisions
  a sequestered holdout test set for external validation of models.'
status: 'Partially released and under active expansion. The chorus4ai.org homepage
  carries the banner "This repoitory is under review for potential modification in
  compliance with Administration directives."'
