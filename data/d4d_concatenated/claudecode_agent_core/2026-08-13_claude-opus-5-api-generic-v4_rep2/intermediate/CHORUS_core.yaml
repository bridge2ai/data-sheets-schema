preprocessing_strategies:
- preprocessing_details: 'Standardization of structured clinical data to the OMOP
    Common Data Model, using the OHDSI tool stack and validated semantic mappings;
    nursing flowsheet data use the OMOP schema with extensions.'
- preprocessing_details: Tokenization of unstructured electronic health record text
    using the OHNLP toolkit so that tokens rather than full notes are shared.
- preprocessing_details: 'Transformation of data using approaches that limit re-identification,
    including de-identification of imaging (a CTP-deid repository is maintained in
    the chorus-ai organization), which was in process for the larger imaging cohort
    as of August 2025.'
- preprocessing_details: 'Conversion of bedside telemetry to WFDB and of EEG to EDF+
    and Persyst formats using the chorus_waveform conversion scripts.'
- preprocessing_details: 'Geocoding of OMOP Location entities via DeGauss (UF-Geocoding
    repository), supporting contextual data elements such as geographic distance to
    the nearest hospital and social determinants of health.'

cleaning_strategies:
- cleaning_details: 'Contributing sites follow standard operating procedures that
    have undergone internal validation and review within the Chorus_SOP repository
    when extracting, curating and delivering interoperable data extracts.'
- cleaning_details: 'Characterization reports are produced and returned to sites following
    their data submissions (CHoRUSReports repository), and site status tracking is
    used to identify and resolve blocking issues in data curation.'
- cleaning_details: 'Semantic mappings are pooled and clinically validated through
    the chorus-mapping repository and its clinical validation standard operating procedure,
    with clinical expertise applied to mapping and validation.'

labeling_strategies:
- labeling_details: 'A visualization and annotation environment labels data with targets
    important for prediction; the project develops capabilities across the multi-center
    network to acquire, standardize, tokenize, store, visualize and label data.'
  data_annotation_platform: CHoRUS visualization and annotation environment
  source_caveats: The sources do not describe annotator qualifications, the number
    of annotations per item, or inter-annotator agreement.

missing_data_documentation:
- missing_data_patterns:
  - 'Modality coverage is uneven across admissions: of the 50,000 released admissions,
    7,642 have radiology data.'
  - 'As of August 2025 approximately 1,000 images were available, with de-identification
    in process for a larger cohort.'
  - As of August 2025 EEG extraction was in process and not yet available.
  - 'Metadata availability differs by modality: metadata for clinical notes, imaging
    and EEG waveform data was listed as planned rather than available, while demographics,
    medications, procedures, nursing flowsheets, diagnoses and waveform telemetry
    had metadata available.'
  missing_data_causes:
  - Staged release of modalities as extraction, de-identification and standardization
    work proceeds at contributing sites.
  - 'Full clinical notes are withheld from the shared enclave and stored locally at
    the contributing site, so only tokens are present in the dataset.'

known_limitations:
- limitation_type: coverage_limitation
  limitation_description: 'The released dataset covers 50,000 patient admissions against
    an anticipated final dataset of 100,000, and not all of the 9 planned modalities
    are fully released.'
  scope_impact: Analyses spanning all planned modalities or the full anticipated cohort
    cannot yet be performed.
- limitation_type: coverage_limitation
  limitation_description: 'Free-text clinical notes are not distributed; only tokens
    extracted with the OHNLP toolkit are available in the enclave, with the underlying
    notes stored locally at each contributing site.'
  scope_impact: Methods requiring raw clinical narrative text cannot be applied to
    the shared dataset.
- limitation_type: temporal_limitation
  limitation_description: Data collection is retrospective, so the dataset does not
    support prospective or real-time evaluation of models at the bedside.
- limitation_type: representativeness_limitation
  limitation_description: 'Data are contributed by 14 hospitals drawn from a collaboration
    of 20 academic centers, so the cohort reflects the patient populations of those
    academic critical care settings.'
  recommended_mitigation: 'The project applies federated sampling methods intended
    to ensure a balanced and diverse cohort and accounts for social determinants of
    health and contextual factors such as geographic distance to the nearest hospital.'

known_biases:
- bias_type: representation_bias
  bias_description: 'The project explicitly identifies management of bias as a design
    problem: patient-focused efforts determine ethical and legal approaches to manage
    privacy and bias, and sampling is designed to ensure a balanced and diverse cohort
    across patient conditions and clinical treatment strategies.'
  mitigation_strategy: 'Federated access with sampling methods aimed at a balanced
    and diverse cohort; inclusion of social determinants of health and contextual
    data elements such as geographic distance to the nearest hospital.'
  source_caveats: The sources describe intended bias mitigation rather than any measured
    bias in the assembled dataset.

is_deidentified:
  method: 'Tokenization of unstructured electronic health record text with the OHNLP
    toolkit; de-identification of imaging (CTP-deid) prior to release; transformation
    of data using approaches that limit re-identification; a privacy scan tool for
    medical records is maintained in the chorus-ai organization.'
  identifiers_removed:
  - 'Full clinical note text is not released; only OHNLP-derived tokens are shared,
    with the notes retained locally at the contributing site.'
  - Imaging de-identification was in process for the larger imaging cohort as of August
    2025.
  deidentification_details: 'De-identification is applied alongside controlled access:
    all modalities are listed as controlled access, and community-facing ethics focus
    groups determine what data are appropriate for public sharing.'
  source_caveats: The sources do not name a de-identification standard (such as HIPAA
    Safe Harbor or Expert Determination) or quantify residual re-identification risk.

