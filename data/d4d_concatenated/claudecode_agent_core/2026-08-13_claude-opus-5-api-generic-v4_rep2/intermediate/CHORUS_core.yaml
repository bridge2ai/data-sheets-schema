collection_mechanisms:
- mechanism_details: 'chorus-extract-upload — a Python repository with tools to create
    and upload a CHoRUS Data Extract, used by data contributing sites.'
- mechanism_details: 'Validated semantic mappings pooled in the chorus-mapping repository,
    with an associated clinical validation standard operating procedure, used to connect
    clinical data in various source formats to international standards.'
- mechanism_details: 'chorus_waveform — waveform documentation and conversion scripts
    supporting preparation and release of waveform data, together with the chorus_waveform_resources
    repository.'
- mechanism_details: OHNLP toolkit — used to extract and tokenize clinical notes for
    release under the OHNLP open-source schema.
- mechanism_details: 'chorus-container-apps — dockerized container applications and
    associated configurations deployed on Azure to support CHoRUS services, including
    internally built web applications (chorus-apps-internal).'
- mechanism_details: 'Chorus_SOP — a centralized standard operating procedure documentation
    site providing an interactive workflow diagram for extracting and contributing
    clinical data to CHoRUS, with dynamic links to individually validated SOP documents.'

