      manifest.tsv metadata file.
    conforms_to: WaveForm DataBase (WFDB) and Clinical Dataset Structure (CDS) v0.1.1
    conforms_to_standard:
      - WFDB
      - CDS
  - id: ark:59853/rocrate-b2ai-ai-readi-omop
    name: clinical_data
    path: clinical_data
    collection_type: processed_data
    file_count: 7
    total_bytes: 176182781
    description: >-
      Clinical data collected through REDCap, including blood and urine laboratory values, MoCA
      cognitive testing, monofilament testing, physical and vision assessments, and survey
      questionnaire results. Each CSV file is a one-to-one mapping to an OMOP CDM table. Includes
      dqd_omop.json supporting analysis with the OHDSI Data Quality Dashboard.
    conforms_to: >-
      Observational Medical Outcomes Partnership (OMOP) Common Data Model and Clinical Dataset
      Structure (CDS) v0.1.1
    conforms_to_standard:
      - OMOP_CDM
      - CDS
    notes: The data in this collection are tabular.
  - id: ark:59853/rocrate-b2ai-ai-readi-environmental-sensor
    name: environment
    path: environment
    collection_type: processed_data
    file_count: 2232
    total_bytes: 55625676514
    description: >-
      Indoor environmental sensor data from the custom-built LeeLab Anura device, organized as
      environment/environmental_sensor/leelab_anura/<participant>. Component datasheets referenced
      in the directory description cover the ams-OSRAM AS7431 spectral sensor, the Analog
      Devices/Maxim DS3231 precision real-time clock, and the Sensirion SEN5x environmental node
      including its NOx Index.
    conforms_to: >-
      NASA ASCII File Format Guidelines for Earth Science Data and Clinical Dataset Structure (CDS)
