id: https://doi.org/10.60775/fairhub.3
name: AI-READI dataset
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  A multimodal, cross-sectional dataset collected from 2,280 adults with and without type 2
  diabetes mellitus (T2DM), harmonized across three United States data collection sites
  (University of Alabama at Birmingham, University of California San Diego, and University of
  Washington) between 19 July 2023 and 1 May 2025. The dataset was produced by the AI-READI
  project, one of four Data Generation Projects funded under the NIH Common Fund Bridge2AI
  program, and is designed to be "AI-ready" so that machine learning research can proceed
  without further reformatting or preprocessing. Recruitment sampling aimed at an approximately
  equal distribution of participants across diabetes severity (no diabetes; pre-diabetes or
  lifestyle-controlled; controlled by oral or non-insulin injectable medication; insulin
  dependent), self-reported race and ethnicity (Asian, Black, Hispanic, White), and biological
  sex. Data domains include self-reported surveys (demographics, depression screening, diabetes
  distress and self-care, diet, substance use, general health, social determinants of health,
  ophthalmic history, current medications), on-site clinical measurements (vitals,
  anthropometrics, 12-lead electrocardiogram, monofilament testing for peripheral neuropathy,
  Montreal Cognitive Assessment, autorefraction, photopic and mesopic visual acuity and letter
  contrast sensitivity), blood and urine laboratory testing, multi-device retinal imaging
  (colour fundus photography, fundus autofluorescence, near-infrared reflectance, optical
  coherence tomography, optical coherence tomography angiography, and fluorescence lifetime
  imaging ophthalmoscopy), and ten days of at-home monitoring using a continuous glucose
  monitor, a wrist-worn activity tracker, and a custom-built indoor environmental sensor.
  Version 3.0.0 comprises 356,343 files totalling approximately 3.82 TB. This release is the
  public version: it contains no protected health information, and information on participant
  sex, race and ethnicity, and medications used has been removed. A controlled-access version,
  obtained under a data use agreement, additionally contains 5-digit ZIP code, sex, race,
  ethnicity, genetic sequencing data, past health records, medications, and traffic and
  accident reports. The stated scientific goal is to enable study of salutogenesis in T2DM,
  that is, the pathway from disease back to health, including downstream pseudotime manifold
  analysis of disease trajectories.
