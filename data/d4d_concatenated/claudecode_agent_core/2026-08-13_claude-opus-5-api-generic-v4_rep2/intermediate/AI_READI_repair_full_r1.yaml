      An individual human research participant; each instance consists of all of the data
      available for one person enrolled in the AI-READI study.
    counts: 2280
    data_topic: B2AI_TOPIC:43
    label: false
    label_description: >-
      No explicit label or target is attached to instances. The dataset is deliberately
      hypothesis-agnostic and is intended to support multiple downstream AI/ML applications, so
      no gold-standard or proxy labelling was performed.
    notes: >-
      There is currently one study visit per participant. Approximately 10% of the cohort is
      planned to be invited back for a follow-up visit in year 4 of the project; the BMJ Open
      protocol states approximately 4% of participants are expected to undergo a follow-up
      examination.
    source_caveats: >-
      data_substrate is left unpopulated because the slot is single-valued and no single term in
