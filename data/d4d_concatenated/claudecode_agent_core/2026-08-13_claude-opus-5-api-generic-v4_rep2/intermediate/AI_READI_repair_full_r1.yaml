conforms_to: >-
  The dataset is organized following the Clinical Dataset Structure (CDS) v0.1.1
  (https://cds-specification.readthedocs.io/en/v0.1.1/), a specification developed within the
  AI-READI project: the root level holds one directory per datatype, then one directory per
  modality, then one per device, then one per participant. Within datatype directories, file
  formats follow domain standards: electrocardiogram data follow the WaveForm DataBase (WFDB)
  standard; clinical data follow the Observational Medical Outcomes Partnership (OMOP) Common
  Data Model, with each CSV file mapping one-to-one to an OMOP CDM table; retinal photography,
  OCT, OCTA and FLIO data follow Digital Imaging and Communications in Medicine (DICOM);
  wearable activity monitor and continuous glucose monitoring data follow Open mHealth; and
  environmental sensor data follow the NASA Earth Science Data Systems ASCII File Format
  Guidelines for Earth Science Data. A packaging-level description of the release is also
  distributed as an RO-Crate conforming to the RO-Crate 1.2-DRAFT profile and the FAIRSCAPE
  profile 0.1.
