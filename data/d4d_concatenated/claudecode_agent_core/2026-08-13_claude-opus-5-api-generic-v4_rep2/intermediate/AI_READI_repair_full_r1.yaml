distribution_formats:
  - format: DICOM
    media_type: application/dicom
    notes: >-
      Used for all retinal imaging datatypes: retinal_photography, retinal_oct, retinal_octa and
      retinal_flio.
  - format: CSV
    media_type: text/csv
    notes: >-
      Used for the OMOP CDM clinical data tables and for tabular sensor and device outputs.
  - format: JSON
    media_type: application/json
    notes: >-
      Used for CDS metadata files including dataset_description.json,
      dataset_structure_description.json, study_description.json, participants.json and
      dqd_omop.json, and for Open mHealth formatted wearable and continuous glucose data.
  - format: Markdown
    media_type: text/markdown
    notes: >-
      Used for README.md, CHANGELOG.md and healthsheet.md.
  - format: FAIRhub gated download
    access_urls:
      - https://fairhub.io/datasets/3
      - https://fairhub.io/datasets/3/access
    notes: >-
      Access requires login through a verified identity system, agreement to use the data only for
      type 2 diabetes related research, and agreement to the licence terms. Version 3 documentation
      additionally describes a mini-subset for pipeline development and Azure Storage access. All
      files are in formats accessible with freely available software, so no specific software is
      required.

distribution_dates:
  - release_dates:
      - '2024-05-03: version 1.0.0 (DOI 10.60775/fairhub.1), 204 participants from the pilot data collection phase'
      - '2024-11-08: version 2.0.0 (DOI 10.60775/fairhub.2), 1,067 participants, adding data through 31 July 2024'
      - '2025-11-17: version 3.0.0 (DOI 10.60775/fairhub.3), 2,280 participants, adding data through 1 May 2025'
    notes: >-
      Releases are static and are planned approximately annually. The BMJ Open protocol describes
      the May 2024 pilot release and a November 2024 release; FAIRhub records the corresponding
      version DOIs and dates.

third_party_sharing:
  - is_shared: true
    notes: >-
      The dataset is distributed publicly through the FAIRhub platform to users outside the
      creating institutions. Onward sharing by a licensee is tightly restricted: a licensee may not
      transfer, license, sublicense, sell, assign, display, share or otherwise convey any portion
      of the data or any derivative work to any third party other than another licensee bound by
      an identical agreement, and then only for the purpose of collaborating on projects involving
      the data. Data may be stored only on servers and devices maintained within the licensee's
      institution, or on cloud or remote storage and backup services covered by a HIPAA-approved
      Business Associate Agreement with that institution. Data may not be shared with any
      third-party model vendor or developer for training or development purposes, even under a
      BAA, although a third-party model under a BAA may be used to analyse the data through
      short-term interaction such as prompting or querying. Data may not be reproduced in papers
      except as small representative samples in up to five images or figures per paper, and larger
      amounts may not be published through supplemental files, zip archives or code packages.
      Biospecimens held in the UAB Center for Clinical and Translational Science biorepository will
      eventually be made available to scientists according to procedures and policies that were
      still in development at the time of protocol publication.

license_and_use_terms:
  license_terms: >-
    AI-READI Data License Agreement version 2.0, published at https://doi.org/10.5281/zenodo.17555036,
    with Washington University in St. Louis named as Licensor. The licence is a custom instrument
    written specifically to enable reuse of the AI-READI dataset for commercial and non-commercial
    research purposes while imposing strong requirements around data usage, security and secondary
    sharing to protect study participants, particularly when data are reused for AI and ML
    applications. It grants a non-exclusive, non-transferable licence to download, reproduce and use
    the data and to create derivative works. A licensee may be an individual or an authorized group
    within an institution, in which case authorized users are individuals who are legal members of
    that group by contract, employment or student status, and their rights terminate automatically
    when that relationship ends; the licensee is fully liable for all acts and omissions of
    authorized users. Derivative data, including synthetic data generated from the data, are
    themselves treated as data subject to all restrictions. Licensee models — models, algorithms and
    programs developed, trained or adapted using the data but not themselves containing the data or
    a modified version of it — may be made, reproduced and distributed, provided the licensee first
    undertakes all reasonable efforts to minimise the likelihood that data can be memorized, derived,
    reconstructed or reconstituted through their use or construction. Licensees must acknowledge the
    Licensor, the source and any funder in papers reporting use of the data, and must comply with NIH
    Genomic Data Sharing Policy security standards. Title and all industrial and intellectual property
    rights remain with the Licensor and its suppliers. The data are provided "as is" without warranty,
    aggregate liability is capped at one U.S. dollar, and the licensee indemnifies the Licensor. The
    agreement terminates automatically on any breach, whereupon all copies must be deleted and all use
    ceased. Earlier licence terms for the dataset were published separately as Contreras, J. et al.,
    "License terms for reusing the AI-READI dataset", Zenodo, https://doi.org/10.5281/zenodo.10642459
    (2024). Dataset documentation at docs.aireadi.org is shared under CC-BY 4.0.
  data_use_permission: disease_specific_research
  contact_person: Aaron Y. Lee (https://orcid.org/0000-0002-7452-1648)
  notes: >-
    FAIRhub records the access type as "PublicDownloadSelfAttestationRequired". Accessing the dataset
    requires logging in through a verified identity system, agreeing to use the data only for type 2
    diabetes related research, and agreeing to the licence terms. The controlled-access version
    requires the user's institution to complete legal and privacy use agreements with the AI-READI
    research programme.
  source_caveats: >-
    The value disease_specific_research is selected from the access condition that users attest to
    using the public data only for type 2 diabetes related research. The sources are in tension on
    this point: FAIRhub's datasetConsent block records consentResearchType as false and
    consentNoncommercial as false, and the licence itself grants use "for research, commercial and
    non-commercial purposes" without a disease restriction, while the FAIRhub accessDetails, README
    and healthsheet all state the type 2 diabetes research restriction and note that a private
    version will allow more generic use.

ip_restrictions:
  restrictions:
    - >-
      Title to the data and all industrial and intellectual property rights therein remain solely
      and exclusively with the Licensor, Washington University in St. Louis, and its suppliers; the
      licensee must not take any action inconsistent with that ownership, and any rights not
      expressly granted are reserved. The licence is non-exclusive and non-transferable. Publishers
      and conference organisers wishing to reproduce more than the permitted five illustrative
      images or figures per paper must obtain a separate licence from the Licensor. The healthsheet
      states that no third parties have imposed additional IP-based restrictions beyond those in
      the licence.
  notes: >-
    The AI-READI project acknowledges Topcon Corporation, Optomed, iCare World and Carl Zeiss for
    loaning imaging devices for research purposes at no cost, and Heidelberg Engineering, Dexcom and
    Garmin for research discounts on study devices; the sources do not indicate that these
    arrangements carry data rights.

regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions: >-
    The public release is de-identified under the HIPAA Privacy Rule Safe Harbor method. Licensees
    must comply with all data security and privacy standards established by the U.S. National
    Institutes of Health under its Genomic Data Sharing (GDS) Policy as amended from time to time,
    currently the NIH Security Best Practices for Controlled-Access Data Subject to the NIH GDS
    Policy. Licensees must comply with all applicable laws, regulations and restrictions relating to
    the distribution and use of the data and of models derived from it. Data may be statically
    watermarked to identify the licensee, and licensees must take no action to remove, obscure,
    alter or mask that watermarking. The healthsheet refers users to the licence for questions about
    export controls and other regulatory restrictions and does not identify any specific export
    control regime as applicable. The study is not FDA-regulated for drugs or devices.
  governance_committee_contact: AI-READI central contact (mailto:contact@aireadi.org)
  source_caveats: >-
    The enum value "restricted" is an interpretation rather than a transcription: the only explicit
    confidentiality classification in the sources is the RO-Crate's "HL7:2N (normal)", which the
    sources do not map onto this schema's three-term scale. "restricted" is chosen because access to
    the public release is gated by verified-identity login, purpose self-attestation and licence
    acceptance, and because a separate controlled-access tier exists.

data_governance:
  committee_name: Data Access Committee
  accountable_organization:
    id: https://ror.org/01yc7t268
    name: Washington University in St. Louis
  committee_contact: AI-READI central contact (mailto:contact@aireadi.org)
  access_review_process: >-
    Two tiers of access are operated. The public version requires login through a verified identity
    system, self-attestation that the data will be used only for type 2 diabetes related research,
    and acceptance of the AI-READI Data License Agreement v2.0 through the FAIRhub data request
    workflow; the information the requester supplies in that workflow forms an integral part of the
    agreement, and the workflow distinguishes between an individual licensee and an authorized group
    within an institution. The controlled-access version, which additionally contains 5-digit ZIP
    code, sex, race, ethnicity, genetic sequencing data, past health records, medications and
    traffic and accident reports, is available only to scientists whose institutions have completed
    legal and privacy use agreements with the AI-READI research programme. The BMJ Open protocol
    states that the requirements for controlled access data sets were being developed by the Data
    Access Committee at the time of writing.
  stewardship_roles: >-
    The AI-READI team supports and maintains the dataset; the RO-Crate names the AI-READI Consortium
    as the data governance committee. Site data managers hold responsibility for quality control
    before upload; the central project team holds responsibility for curation, standardization and
    release. Washington University in St. Louis is the licensor, lead sponsor and managing
    organization; the University of Washington IRB is the reviewing board of record.
  notes: >-
    Release of data or specimens to individuals or entities other than federal databases is required
    by UW and UW Medicine policy to be covered by a formal agreement — a Data Use Agreement or
    Repository Gatekeeping form for data, a Material Transfer Agreement for specimens. UCSD operates
    a Health Data Oversight Committee that oversees data sharing with other institutions.
  source_caveats: >-
    The committee name is given as "the Data Access Committee" in the BMJ Open protocol, which is the
    only source naming a body responsible for access decisions; the RO-Crate separately records the
    dataGovernanceCommittee as "AI-READI Consortium". No source gives a formal, fuller title, and no
    source lists committee membership. Separately, FAIRhub structured metadata names Washington
    University in St. Louis (ROR 01yc7t268) as lead sponsor and managing organization and gives it as
    the affiliation of the PI and central contact, while the NIH award organization is the University
    of Washington, the IRB protocol and consent materials are University of Washington documents, and
    the publications place the PIs at the University of Washington, UCSD and UAB. The RO-Crate names
    "Washington University IRB" but gives a University of Washington Human Subjects Division postal
    address. Both organizational attributions are recorded here rather than reconciled.

maintainers:
  - role: academic_institution
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. The healthsheet directs contact enquiries
      to the README file included with the dataset; the README and RO-Crate direct enquiries to
      https://aireadi.org/contact and https://docs.aireadi.org/docs/3/contact, and the central study
      contact address is contact@aireadi.org. The study_description.json and dataset_description.json
      metadata files included in the dataset carry additional contact, author and contributor
      information.
  - role: other
    maintainer_details: >-
      The dataset is hosted on FAIRhub, a Microsoft Azure cloud-based data management, curation and
      sharing platform developed for this project. The Microsoft AI for Good Lab is acknowledged for
      supporting the cloud services needed for the project. FAIRhub is described as being in beta and
      is intended to be made available for future Data Generation Projects wishing to manage and
      share AI-ready clinical research datasets.

updates:
  frequency: Approximately annually
  update_details: >-
    The dataset is not updated in place. Instead, new static versions are released with additional
    instances as more study participants complete the study visit; each version receives its own DOI
    and its own documentation set. Enrolment is ongoing, so future versions are expected to contain
    larger numbers of participants. Changes between versions are recorded in detail in the CHANGELOG
    file included in the dataset and visible at docs.aireadi.org; the summary changelog for v3.0.0
    records the progression from the v1.0.0 pilot (204 participants, 15+ data types, custom and ad
    hoc processing) through year 2 data (863 participants, one additional imaging device) and year 3
    data (1,213 participants, three additional imaging devices) to the v3.0.0 main study release
    (2,280 participants, 15+ data types, automated and custom processing). Version 3.0.0 also dropped
    the Snellen visual acuity variables and added a recommended train/validation/test split. The
    sources do not describe a mailing list or other notification channel for new releases.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants were
    not told that their data would be retained for a fixed period and then deleted. Raw data are
    saved and are expected to be preserved by the AI-READI project at least for the duration of the
    project. Older released versions are not updated; the sources state that new versions are
    released rather than describing a deletion schedule for prior versions.
  notes: >-
    Version 1.0.0 and version 2.0.0 are marked on FAIRhub as no longer accessible, and the v2.0.0
    documentation carries a banner stating that the version of the dataset it documents is no longer
    accessible, while the documentation for both older versions remains published.

version_access:
  latest_version_doi: https://doi.org/10.60775/fairhub.3
  version_details: >-
    Three versions have been released, each with its own DOI and its own documentation set navigable
    from a version dropdown at docs.aireadi.org: version 1.0.0 (10.60775/fairhub.1, 3 May 2024, 204
    participants from the pilot data collection phase), version 2.0.0 (10.60775/fairhub.2, 8 November
    2024, 1,067 participants, 2.01 TB, 165,051 files) and version 3.0.0 (10.60775/fairhub.3, 17
    November 2025, 2,280 participants, 3.82 TB, 356,343 files). Datasheets in healthsheet form were
    produced for version 1 (docs.aireadi.org/docs/1/dataset/healthsheet) and version 2
    (docs.aireadi.org/docs/2/dataset/healthsheet) as well as for this version. Versions 1.0.0 and
    2.0.0 are no longer accessible for download.

