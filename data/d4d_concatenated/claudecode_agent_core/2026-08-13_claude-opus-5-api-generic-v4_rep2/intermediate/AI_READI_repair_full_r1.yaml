      Fluorescence lifetime imaging ophthalmoscopy data for in vivo measurement of lifetimes of
      endogenous retinal fluorophores, from the Heidelberg FLIO device, organized as
      retinal_flio/flio/heidelberg_flio/<participant>. Two DICOM files are provided per eye, one for
      the short wavelength channel (498–560 nm) and one for the long wavelength channel (560–720
      nm); each pixel holds a photon arrival-time curve following a Poisson distribution.
    conforms_to: >-
      Digital Imaging and Communications in Medicine (DICOM) and Clinical Dataset Structure (CDS)
