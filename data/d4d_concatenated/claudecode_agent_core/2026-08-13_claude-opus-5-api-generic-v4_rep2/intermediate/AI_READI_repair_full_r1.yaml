purposes:
  - response: >-
      To create and publicly share a flagship, ethically sourced, AI-ready multimodal dataset
      that enables future generations of artificial intelligence and machine learning research
      to provide critical insights into type 2 diabetes mellitus, including salutogenic pathways
      that return people to health.
  - response: >-
      To develop a foundational dataset in type 2 diabetes that is agnostic to existing
      classification criteria and hypotheses, from which a temporal atlas of T2DM development
      and reversal towards health can be reconstructed.
  - response: >-
      To establish and demonstrate standards, best practices and guidelines for the collection,
      preparation and sharing of biomedical data intended for AI/ML, so that the approach can
      serve as a blueprint for future data generation projects.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including through a year-long research internship programme.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis, an approach used to predict disease trajectories
      by learning from complex multimodal data collected from participants across a range of
      disease severity from normal to insulin-dependent type 2 diabetes.
  - response: >-
      Development of multimodal AI/ML models of type 2 diabetes pathogenesis and salutogenesis
      across imaging, waveform, wearable, laboratory and survey modalities.
  - response: >-
      Training and evaluation of models on a cohort deliberately balanced across diabetes
      severity, self-reported race and ethnicity, and biological sex, in order to reduce bias
      relative to models trained on less balanced sources.

addressing_gaps:
  - response: >-
      A lack of well-designed, high quality, large and inclusive multimodal datasets has limited
      the ability to understand and affect the course of complex, multi-organ diseases such as
      type 2 diabetes; existing large datasets for AI/ML training are not AI-ready.
  - response: >-
      A meta-epidemiological review of type 2 diabetes studies published between 2000 and 2020
      found that samples lacked racial and ethnic diversity; the AI-READI cohort is deliberately
      balanced across four racial and ethnic groups to address these demographic inequities.
  - response: >-
      Existing data sources such as insurance claims or electronic health records do not support
      the downstream AI/ML analyses of interest, motivating a purpose-built multi-domain
      acquisition protocol spanning survey, physical measurement, clinical, imaging and wearable
      device data.
  - response: >-
      Current understanding of type 2 diabetes in the specific context of salutogenesis — the
      pathway from disease back to health, rather than from health to disease — is limited.

instances:
