splits:
  - split_details: >-
      Version 3.0.0 ships a recommended participant-level split in proportions of 70% training,
      15% validation and 15% testing (1,576 / 352 / 352 of 2,280 participants), recorded in the
      participants.tsv metadata file. Because sex, race and ethnicity are not released with the
      public version of the dataset, the project team constructed the split so that the
      validation and test sets are balanced as well as possible for sex, race/ethnicity and
      diabetes status (no diabetes; pre-diabetes or lifestyle controlled; oral or non-insulin
      injectable medication controlled; insulin controlled). The stated rationale is to reduce
      disparities in models developed using the dataset when demographic labels are unavailable
      to the model developer. Mean age is closely matched across the three partitions (61.1,
      60.3 and 60.5 years). The recommended split is new in version 3.0.0; earlier versions did
      not carry one.

subpopulations:
  - identification: >-
      Diabetes study group, assigned at enrolment from screening and electronic health record
      information into one of four arms: no diabetes (healthy); pre-diabetes or type 2 diabetes
      controlled by lifestyle adjustment; type 2 diabetes controlled by oral or non-insulin
      injectable medication; insulin-dependent type 2 diabetes.
    distribution: >-
      Across the 2,280 participants in version 3.0.0: no diabetes 776; lifestyle controlled 560;
      oral or non-insulin injectable medication controlled 686; insulin controlled 258. The
      overall study target is approximately 1,000 participants in each of the four arms.
    subpopulation_elements_present: true
  - identification: >-
      Self-reported race and ethnicity, collected in the screening questionnaire in four
      categories (Asian, Black, Hispanic, White).
    distribution: >-
      Across the 2,280 participants: Hispanic 380; Asian 545; Black 519; White 836. The overall
      study target is approximately 1,000 participants in each group.
    subpopulation_elements_present: true
    source_caveats: >-
      Race and ethnicity are removed from the public version of the dataset and are held under
      controlled access; the counts above are reported in the README split summary rather than
      being present as variables in the public release. The healthsheet "Demographic information"
      section answers "No" to whether the dataset identifies demographic sub-populations, which
      is consistent with the public release but not with the README summary table.
  - identification: Biological sex, self-reported in the screening questionnaire.
    distribution: 'Across the 2,280 participants: male 951; female 1,329.'
    subpopulation_elements_present: true
    source_caveats: >-
      Sex is removed from the public version of the dataset and held under controlled access,
      for the stated purpose of preventing stigmatization of findings.
  - identification: >-
      Data collection site, one of three United States academic health systems: University of
      Alabama at Birmingham (Birmingham, Alabama), University of California San Diego (La Jolla,
      California), and University of Washington (Seattle, Washington).
    distribution: >-
      Per-site participant counts are not reported in the available sources. All study groups
      are recruited at each site, but the proportion of each group varies with the demographic
      prevalence of that group in the site's geographical area.
    subpopulation_elements_present: true

relationships:
  - relationship_details: >-
      All instances belong to the same prospective cross-sectional data generation project
      (AI-READI), and this relationship is made explicit by the shared study design and
      participant identifier scheme. There is currently one study visit per participant, so
      instances are not linked longitudinally within this release. Within a participant, files
      across the nine datatype directories are related by the participant identifier used to
      name the participant-level folders, and are enumerated in per-datatype manifest.tsv files
      and the root participants.tsv file.

anomalies:
  - anomaly_details: >-
      Survey data contain skipped questions and incomplete responses; these are expected and are
      not corrected after the fact.
  - anomaly_details: >-
      Wearable device data are affected by improper use and technical failure, including battery
      failure and system malfunction. The Garmin Vivosmart 5 battery required charging every two
      to three days, producing gaps in the activity monitoring record. In some cases the device
      returned no stored results, or was returned too late for results to be retrieved.
  - anomaly_details: >-
      Imaging data are affected by participant non-cooperation, noise that may obscure images,
      system malfunction and data transfer failures. Handheld undilated Optomed Aurora fundus
      images vary in quality from participant to participant and within the same participant.
      FLIO acquisition is highly sensitive to movement (the device cannot tolerate more than
      about one centimetre of movement) and, because it is performed last in the visit and
      exposes participants to uncomfortable light levels, participant compliance may be lower
      for this modality.
  - anomaly_details: >-
      In a few cases a data collision occurred at some point in the processing pipeline and data
      were lost.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers responding to mailed and emailed invitations, giving rise to
      volunteer bias, which may limit the generalisability of results to those who are not
      represented in the study population.
    mitigation_strategy: >-
      Recruitment proceeds in waves whose composition and size are adjusted in response to the
      observed participation characteristics of race/ethnicity, gender, T2DM severity and site,
      with under- and over-sampling of groups as needed.
  - bias_type: selection_bias
    bias_description: >-
      Eligibility requires that participants speak, read and understand English, which the
      protocol authors note may have created challenges in recruiting Hispanic and/or Asian
      persons.
    mitigation_strategy: >-
      The IRB protocol notes an NIH supplement was being sought to fund translation of study
      materials into Spanish so that Spanish-speaking participants could be enrolled; at the
      time of the protocol, participants still had to be fluent in English.
  - bias_type: selection_bias
    bias_description: >-
      The recruitment pool is drawn by screening electronic health records at three academic
      health systems for patients aged 40 and over with an encounter between 2020 and 2025,
      identified by ICD-10 diagnosis codes R73.09 and E11.X. People without a recent encounter
      with these health systems cannot be sampled.
  - bias_type: representation_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based, which may not fully capture diverse
      cultural and socioeconomic backgrounds. The cohort does not include other races and
      ethnicities such as Pacific Islanders and Native Americans, so it does not provide a
      comprehensive representation of the population.
    mitigation_strategy: >-
      Three geographically dispersed recording sites were selected to increase geographic and
      demographic variability, and individuals from all demographic backgrounds are recruited at
      all three sites. The project also engaged with the Native Biodata Consortium as a
      co-learning opportunity for understanding challenges specific to American Indian and
      Alaska Native communities, and planned a tribal consultation.
  - bias_type: sampling_bias
    bias_description: >-
      Because enrolment is ongoing, the pilot release and periodic updates to data releases may
      not have achieved the intended balanced distribution across race/ethnicity, sex and
      diabetes severity groups. The v3.0.0 group counts remain uneven (for example 258
      insulin-controlled participants versus 776 with no diabetes, and 380 Hispanic versus 836
      White participants).
    mitigation_strategy: >-
      Uniform data collection protocols were applied to all subjects irrespective of
      race/ethnicity, biological sex or diabetes severity across all study sites, and the
      recommended validation and test splits are balanced across these strata even though the
      training split is not.
    affected_subsets:
      - >-
        The imbalance affects the full release and the recommended training split; the
        recommended validation and test splits are balanced by construction.
  - bias_type: measurement_bias
    bias_description: >-
      Several assessments depend on operator skill and are not fully automated (for example
      Heidelberg Spectralis acquisition and handheld Optomed Aurora photography), while others
      are fully automated (for example Topcon Maestro2 and Triton). Differences in
      operator-induced error across devices and sites may therefore be systematic rather than
      random.
    mitigation_strategy: >-
      All research personnel who recruited, enrolled and collected data underwent training by
      the data manager at UAB using a detailed Manual of Procedures, and coordinators had to
      complete a certification process including administering all protocol elements to at least
      three volunteer practice subjects to the standards in the Manual of Procedures. Device make,
      model and scan modality were documented to ensure repeatability, and multiple devices were
      deliberately included for a single measure to represent the range of equipment used in
      clinical settings.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The cohort is deliberately balanced by design rather than being drawn to match the
      demographic distribution of the United States population, so marginal distributions in the
      dataset do not reflect population prevalence.
    scope_impact: >-
      Prevalence estimates and calibration derived directly from the dataset will not transfer to
      the general population without reweighting.
    recommended_mitigation: >-
      Treat the balanced design as intentional and reweight where population-level inference is
      required.
  - limitation_type: scope_limitation
    limitation_description: >-
      The dataset is cross-sectional, with a single study visit per participant in this release,
      so within-person change over time cannot be observed. Longitudinal data are planned for
      approximately 10% of the cohort in year 4 of the project.
    scope_impact: >-
      Disease trajectory questions must be approached through cross-sectional pseudotime methods
      rather than direct longitudinal follow-up.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The public version of the dataset omits sex, race and ethnicity, medications, 5-digit ZIP
      code, genetic sequencing data, past health records, and traffic and accident reports; these
      are available only under controlled access via a data use agreement.
    scope_impact: >-
      Fairness auditing, subgroup analysis and pharmacological covariate adjustment are not
      possible using the public release alone.
    recommended_mitigation: >-
      Apply for the controlled-access version where demographic or medication covariates are
      required; otherwise use the supplied recommended split, which was constructed to be
      balanced on the withheld strata.
  - limitation_type: temporal_limitation
    limitation_description: >-
      Data in this release were collected between 19 July 2023 and 1 May 2025. Enrolment is
      ongoing and further versions will be released with additional participants.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The associated biorepository holds a finite number of biospecimens available to share with
      scientists, and procedures for reviewing and prioritising written requests were still to be
      developed at the time of protocol publication. Biospecimens are not part of this data
      release.
  - limitation_type: integration_limitation
    limitation_description: >-
      Not all modalities are available for all participants: some participants elected not to
      participate in some study elements, some devices returned no stored results or were
      returned too late, and some data were lost. Modality coverage is therefore uneven across
      the cohort.
  - limitation_type: methodological_limitation
    limitation_description: >-
      The dataset has not undergone any formal external audit. It has been reviewed internally
      by AI-READI team members for quality checks and to confirm that no personally identifiable
      information was accidentally included.
  - limitation_type: resolution_limitation
    limitation_description: >-
      Snellen visual acuity variables were dropped in version 3.0.0; only logMAR visual acuity
      measurements are available in this release.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet states that the dataset does not contain data that, if viewed directly,
      might be offensive, insulting, threatening, or otherwise pose a safety risk such as
      psychological safety or anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The healthsheet states that the dataset does not contain data that might be considered
      confidential, and that no personally identifiable information is included. The RO-Crate
      records the confidentiality level as "HL7:2N (normal)". Access is nonetheless gated: the
      public release requires login through a verified identity system, self-attestation that
      the data will be used only for type 2 diabetes related research, and agreement to the
      custom licence.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      Public release. The public dataset does not contain data considered sensitive: protected
      health information as defined by the HIPAA Privacy Rule has been stripped by the Safe
      Harbor method, and information related to participant sex, race/ethnicity and medications
      used has additionally been removed to prevent stigmatization of findings.
  - sensitive_elements_present: true
    sensitivity_details: >-
      Controlled-access release. The controlled-access version contains 5-digit ZIP code, sex,
      race, ethnicity, genetic sequencing data, past health records, medications, and traffic and
      motor vehicle accident reports. It is available only to scientists whose institutions have
      completed legal and privacy use agreements with the AI-READI research programme.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    HIPAA Privacy Rule "Safe Harbor" method, applied to the public release; no active
    de-identification of direct identifiers was necessary because no identifiers were collected
    into the dataset in the first place, and the release was checked to confirm that no
    identifiable data per US HIPAA were present.
  identifiers_removed: >-
    Protected Health Information as defined by the HIPAA Privacy Rule; Sex; Race; Ethnicity;
    Medications used; 5-digit ZIP code; Genetic sequencing data; Past health records; Traffic and
    motor vehicle accident reports.
  deidentification_details: >-
    Sex and race/ethnicity were removed from the public set in addition to HIPAA identifiers,
    with the stated purpose of preventing stigmatization of findings; the elements listed as
    removed are retained in the controlled-access version rather than destroyed. To deter
    re-identification attempts the project implements a data dissemination system, a strict
    licence agreement, and data watermarking for both the public and controlled sets; the licence
    states the data may be statically watermarked to identify the licensee for security purposes
    and prohibits removing or obscuring the watermark. Raw data are not shared, in part because
    they have not been mapped to standardized terminologies and in part because raw data may
    accidentally include personal health information or personally identifiable information in
    free text fields.
  source_caveats: >-
    FAIRhub structured metadata sets datasetDeIdentLevel.deIdentType to "NoDeIdentification"
    while simultaneously setting deIdentDirect and deIdentHIPAA to true and explaining that no
    identifiers were collected; the RO-Crate independently records "deidentified": true. The
    healthsheet questions on de-identification measures (composition Q13 and preprocessing Q1)
    are left with empty responses.

acquisition_methods:
  - was_directly_observed: true
    was_reported_by_subjects: false
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details: >-
      Directly observed data acquired during the on-site visit or from at-home devices:
      anthropometrics and vitals, 12-lead electrocardiogram, monofilament testing, Montreal
      Cognitive Assessment, autorefraction, visual acuity and contrast sensitivity under photopic
      and mesopic conditions, retinal imaging on six devices, blood and urine laboratory assays,
      and ten days of continuous glucose, wrist-worn activity and indoor environmental sensor
      readings.
  - was_directly_observed: false
    was_reported_by_subjects: true
    was_inferred_derived: false
    was_validated_verified: true
    acquisition_details: >-
      Subject-reported data acquired through self-completed questionnaires in REDCap, covering
      eligibility screening, demographics, CES-D-10 depression screening, PAID-5 diabetes
      distress, diabetes self-care, diet, ophthalmic history, smoking, alcohol, vaping and
      marijuana use, general health history, social determinants of health, and current
      medications with RxNorm codes. Verification of data entry was performed where possible; for
      example, entered medications were cross-referenced against medications that participants
      physically brought in or photographed.

collection_mechanisms:
  - mechanism_details: >-
      REDCap was used for recruitment interfacing, electronic consent, all participant-reported
      questionnaires, and entry of the following clinical data from the visit: medications
      assessment, vitals, visual acuity, contrast sensitivity, monofilament test results and
      complete blood count results. Clinical data outside expected minimum and maximum ranges
      were flagged in REDCap for review.
  - mechanism_details: >-
      Vitals and anthropometrics. Systolic and diastolic blood pressure and heart rate were
      measured twice, two minutes apart, with an automatic oscillometric medically approved
      device; devices used across sites were the OMRON HEM 907XL, the Medline MDS4001 Automatic
      Digital Blood Pressure Monitor, and the Welch Allyn 6000 series vital signs monitor with
      Welch Allyn FlexiPort reusable cuff. Height, weight and waist and hip circumference were
      measured, with waist-hip ratio and body mass index calculated.
  - mechanism_details: >-
      Electrocardiography. A 12-lead ECG was recorded on a Philips PageWriter TC30 Cardiograph
      (Amsterdam, The Netherlands) with the participant seated in a reclining chair or supine;
      the chair position (0, 30, 60 or 90 degrees relative to supine) was recorded. Data were
      exported in .xml and converted to the WFDB standard for release.
  - mechanism_details: >-
      Peripheral neuropathy assessment by monofilament testing, using a standard 10 g
      monofilament applied to three locations on the plantar surface of each foot, ten times per
      location, with shoes and socks removed and the participant's eyes closed. Insensate areas
      were retested for confirmation. Results were recorded on an iPad, laptop or paper
      questionnaire and entered into REDCap.
  - mechanism_details: >-
      Cognitive screening with the Montreal Cognitive Assessment (MoCA), administered
      electronically on an iPad using the MoCA Duo application (MoCA Cognition, Quebec, Canada).
      Total score, section subscores, Memory Index Score and task completion times were exported
      as .csv. Maximum score is 30.
  - mechanism_details: >-
      Visual function testing. Photopic letter visual acuity was measured with the M&S
      Technologies Electronic Visual Acuity tester (Niles, Illinois) at 4 metres on a
      touch-screen monitor, under best-corrected conditions, expressed as logMAR. Mesopic acuity
      used a 2.0 neutral density filter. Letter contrast sensitivity was measured with the Mars
      chart (Mars Perceptrix, Chappaqua, New York) monocularly under photopic and mesopic
      conditions, with background luminance 60–120 cd/m2 (optimum 85), illuminance 189–377 lux
      (optimum 267), viewing distance 40–59 cm (design 50 cm), and testing terminated after two
      consecutive errors or the end of the chart. Autorefraction used a Topcon KR 800
      autorefractor; lensometry used NIDEK LM-600P, Topcon CL-200 or Topcon CL-300 devices.
  - mechanism_details: >-
      Retinal imaging on six devices, both eyes per participant, under dilated conditions except
      for the Optomed: Optomed Aurora IQ handheld fundus camera (Oulu, Finland; undilated macula-
      and disc-centred colour fundus photographs, 4 images per participant); iCare EIDON
      widefield truecolor confocal fundus system (Raleigh, North Carolina; ultra-wide field
      central, nasal and temporal CFP, central IR, central FAF and a mosaic, 12 images);
      Heidelberg Spectralis HRA OCT and OCTA (Heidelberg, Germany; optic nerve head radial circle
      high resolution OCT, posterior pole macula HR 61 lines OCT, macula 20x20 HS 512 lines OCTA,
      6 images); Topcon Maestro2 3D OCT-1 (Tokyo, Japan; 3D wide 12x9, 3D macula 6x6, macula 6x6
      OCTA, 6 images); Topcon Triton DRI OCT (3D(H)+Rad 12x9, macula 6x6 OCTA, macula 12x12 OCTA,
      6 images); Zeiss Cirrus 5000 (Jena, Germany; disc cube 200x200, macula cube 512x128, macula
      6x6 OCTA, disc 6x6 OCTA, 8 images); and Heidelberg FLIO for macula-centred fluorescence
      lifetime imaging ophthalmoscopy (2 images, short 498–560 nm and long 560–720 nm wavelength
      channels).
  - mechanism_details: >-
      Continuous glucose monitoring with the Dexcom G6 real-time integrated continuous glucose
      monitoring system (Dexcom, Inc., San Diego, California), worn for ten days, recording blood
      glucose in mg/dL every five minutes. Participants were masked to the results during the
      monitoring period. Data were exported as .csv and converted to Open mHealth for release.
  - mechanism_details: >-
      Physical activity monitoring with the Garmin Vivosmart 5 fitness tracker (Garmin Ltd,
      Schaffhausen, Switzerland), worn for ten days on the participant's chosen wrist at a
      sampling interval of five seconds, recording steps, heart rate, respiratory rate, oxygen
      saturation, calories, stress and sleep phases. Data were exported in .FIT format and
      converted to Open mHealth for release. Participants returned a data sheet indicating which
      wrist the tracker was worn on and their dominant hand.
  - mechanism_details: >-
      Indoor environmental monitoring with a custom-designed sensor unit ("LeeLab Anura")
      developed at the Karalis Johnson Retina Center, University of Washington, placed in a
      frequently used area of the participant's home for ten days, recording ambient temperature,
      relative humidity, nitrogen oxides (NO and NO2), volatile organic compounds, particulate
      matter (PM1.0, PM2.5, PM4, PM10) and eleven multi-spectral light intensity measurements.
      Participants noted the placement location on return. Data were exported as .csv.
  - mechanism_details: >-
      Blood and urine specimen collection and assay. Approximately 53 mL of non-fasting blood
      plus a urine specimen were collected during the visit. One EDTA vacutainer went to a local
      CLIA-certified laboratory for complete blood count on fresh whole blood. Whole blood,
      plasma, serum and urine for central assays were stored locally at −70 °C and batch-shipped
      on dry ice approximately quarterly to the University of Washington Nutrition and Obesity
      Research Center, which performed HbA1c, NT-proBNP, troponin-T, C-peptide, insulin, hsCRP,
      lipid panel, comprehensive metabolic panel and urine creatinine and albumin. Results were
      provided in .csv.

collection_timeframes:
  - start_date: '2023-07-19'
    end_date: '2025-05-01'
    timeframe_details: >-
      Collection window for version 3.0.0 of the dataset. Within the overall study, preliminary
      pilot enrolment ran from 18 July 2023 to 30 November 2023 to establish coordinator
      familiarity, and formal data collection began on 1 December 2023; pilot data were included
      in the first released dataset version. Enrolment was scheduled to continue until 30
      November 2026. The overall project timeline spans four years, with one year for protocol
      development and training and years two to four for recruitment and data collection.
    source_caveats: >-
      The BMJ Open protocol gives 18 July 2023 as the enrolment start date, while FAIRhub
      dataset and study metadata give 19 July 2023 as the collection and study start date.

data_collectors:
  - role: Clinical research coordinator
    collector_details: >-
      Coordinators at the three sites recruited, consented and enrolled participants, conducted
      the on-site visit including ophthalmic imaging, trained participants on the continuous
      glucose monitor, activity tracker and environmental sensor, and ensured return of study
      materials. All coordinators completed mandatory institutional compliance training for human
      subject research, a certification process, and administration of all protocol elements to at
      least three volunteer practice subjects to the standards of the Manual of Procedures.
  - role: Site data manager
    collector_details: >-
      Data managers at each site oversaw the training and certification process, reviewed REDCap
      range-check reports with coordinators, and were responsible for quality control of all data
      before uploading to FAIRhub. The data manager at UAB delivered training to research
      personnel across the three sites.
  - role: Site principal investigator
    collector_details: >-
      Site PIs approved all data edits, reviewed flagged values and decided whether values should
      be removed from the data when no logical or appropriate correction was available.
  - role: Phlebotomist and laboratory assistant
    collector_details: >-
      Responsible for blood collection from participants and for processing and shipping
      specimens, with local processing of plasma, serum and buffy coats performed under
      standardised operating procedures on the day of collection.
  - role: Central and local clinical laboratories
    collector_details: >-
      CLIA-certified laboratories local to each site performed complete blood counts on fresh
      whole blood. The University of Washington Nutrition and Obesity Research Center performed
      all other blood and urine assays on stored frozen samples.
  - role: Central project data team
    collector_details: >-
      Research and data scientists, software engineers and cloud engineers at the central project
      team ingested site data, mapped it to standardized terminologies, built and ran the curation
      pipelines, and managed the FAIRhub cloud infrastructure.

direct_collection:
  - is_direct: true
    collection_details: >-
      Data were collected directly from participants at the three recruiting sites; this was
      active prospective collection rather than passive collection or secondary use of existing
      data. Recruitment pools were identified indirectly, by screening electronic health records
      at each site for diabetes and pre-diabetes ICD-10 codes among patients with a health system
      encounter, and motor vehicle driving and accident records were obtained from the state
      Department of Licensing rather than from participants.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Recruitment proceeds in waves. For each wave a contact pool is identified by screening
      electronic health records at each site for patients aged 40 and over with an encounter
      between 2020 and 2025, using ICD-10 codes R73.09 for pre-diabetes and E11.X for type 2
      diabetes; patients without diabetes are those with no encounters carrying these codes.
      Individuals in each pool are mailed a personalised hardcopy invitation letter and sent an
      invitation email, both directing them via links, access codes and QR codes into an online
      REDCap recruitment interface where they can read a study overview, download the consent
      document, request a call back, complete a screening survey and enroll by electronic consent.
      UW and UCSD supply candidate lists to UAB, which combines them with its own and selects a
      stratified sample so that steady enrolment is maintained and staff are not overwhelmed;
      OHSU generates participant-specific REDCap survey links, and a HIPAA-compliant printing and
      fulfilment vendor mails the letters. The composition and size of each wave are influenced by
      the observed participation characteristics of race/ethnicity, gender, T2DM severity and
      site, and are adjusted by under- and over-sampling groups as needed. The registered sampling
      method is a non-probability sample.
    why_not_representative: >-
      The cohort is deliberately not designed to match the demographic distribution of the United
      States population. Instead the study recruits four race/ethnic groups, four T2DM severity
      categories and both biological sexes in approximately equal proportions, because balanced
      training data are considered critical for developing unbiased machine learning models.
    source_data: >-
      The study base is all patients aged 40 years or older who had a medical encounter within
      each health system site (UAB, UCSD, UW) between 2020 and 2025.
    source_caveats: >-
      The healthsheet states that the dataset "contains all possible instances", meaning all
      participants enrolled during the covered period, and answers "N/A" to the question about
      sampling strategy from a larger set; the recruitment-level stratified sampling described in
      the BMJ Open protocol and IRB protocol is nonetheless a sampling strategy applied to the
      study base.

collection_consents:
  - consent_details: >-
      Written informed consent was required from every participant before any part of the
      protocol, including questionnaires. Most participants consented remotely by computer,
      tablet or smartphone through a link in the hardcopy invitation letter or invitation email
      that directed them into REDCap, where they could read all consent documentation, decide not
      to participate, request additional information, or give consent with an electronic
      signature without speaking to a coordinator. Participants who did not select electronic
      consent were consented in person at the start of the visit, followed by completion of all
      questionnaires. The approved consent form for the principal site, the University of
      Washington, is published with the documentation; the other clinical sites operated under IRB
      reliance and used the same form with minor institution-specific language.

collection_notifications:
  - notification_details: >-
      Every individual was aware of the data collection, because this was active data collection
      directly from participants rather than passive collection or secondary use of existing data.
      Notification was provided through the personalised mailed invitation letter and invitation
      email, and through the REDCap recruitment interface, which presented an overview of the
      research programme, expectations for participation and answers to frequently asked
      questions before any consent decision. Those without internet access could call research
      staff for alternative methods of enrolment.

consent_revocations:
  - revocation_details: >-
      Participants were permitted to withdraw consent at any time and cease study participation.
      However, any data that had been shared or used up to that point would remain in the dataset.
      This limitation is stated explicitly in the consent document.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      AI-READI was approved by the University of Washington IRB under approval number
      STUDY00016228, with initial approval granted on 20 December 2022, and with reliance
      agreements covering the IRBs of the University of Alabama at Birmingham and the University
      of California, San Diego. An annual renewal application reporting study status and progress
      is required and is due within 90 days of expiration. The initial approval letter is
      published with the dataset documentation. FAIRhub study metadata records the human subject
      review status as "Submitted, approved", records that the study is not FDA-regulated for
      either drug or device, and records that there is no Data Monitoring Committee.
    contact_person: University of Washington IRB Reliance Team (mailto:hsdrely@uw.edu)
  - reviewing_organization: AI-READI Consortium ethics and ELSI activity
    review_details: >-
      Ethical, legal and social implications were considered at every stage of the project cycle,
      with guidance from bioethicists embedded in the project. The RO-Crate names Camille Nebeker,
      Debra Mathews, Kadija Ferryman and Nicholas Evans as those responsible for ethical review.
      The project reviewed existing documentation approaches, including datasheets and
      healthsheets, to identify the most suitable one for biomedical data, and engaged with the
      Native Biodata Consortium to understand challenges specific to American Indian and Alaska
      Native communities and to evaluate tools such as data usage agreements, contract
      negotiations, transparent access agreements and mechanisms for assured return of benefit and
      sustainable Tribal input, control and monitoring of Tribal data. A Community Advisory Board
      of 11 persons drawn from the three sites, including diversity in race and ethnicity as
      represented in the AI-READI sample, contributed to development of the protocol and reviewed
      consent forms.

human_subject_research:
  involves_human_subjects: true
  irb_approval:
    - >-
      University of Washington IRB protocol STUDY00016228, initially approved 20 December 2022,
      with reliance agreements from the IRBs of the University of Alabama at Birmingham and the
      University of California, San Diego. Registered on ClinicalTrials.gov as NCT06002048.
  ethics_review_board: >-
    University of Washington Institutional Review Board (single IRB of record; the RO-Crate refers
    to it as "Washington University IRB" but gives the University of Washington Human Subjects
    Division address at 4333 Brooklyn Ave NE, Box 359470, Seattle, WA 98195-9470).
  regulatory_compliance: >-
    The study is not FDA-regulated for drugs or devices. The public release complies with the
    HIPAA Privacy Rule via the Safe Harbor de-identification method. Licensees must comply with
    the data security and privacy standards established by NIH under its Genomic Data Sharing
    Policy, specifically the NIH Security Best Practices for Controlled-Access Data Subject to the
    NIH GDS Policy.
  special_populations: >-
    None targeted. Enrolment is limited to adults aged 40 and over (registered maximum age 85) who
    are able to provide their own consent; pregnancy, gestational diabetes and type 1 diabetes are
    exclusion criteria.

at_risk_populations:
  at_risk_groups_included: false
  special_protections:
    - >-
      Participation is restricted to adults aged 40 to 85 who are able to provide consent, so
      minors are not enrolled and no surrogate consent pathway is used. Pregnant individuals and
      those with gestational diabetes are excluded. The environmental sensor and the Garmin
      fitness tracker were specifically chosen with participant privacy as a primary concern: they
      do not capture video or audio, are not equipped with GPS location monitoring, and are not
      synced with participant-owned devices. Transportation assistance through rideshare services
      was offered to participants who reported barriers to reaching study visits.
  source_caveats: >-
    The value false is derived from the stated eligibility criteria — minimum age 40 with capacity
    to consent, and exclusion of pregnancy and gestational diabetes — rather than from an explicit
    statement in the sources that no at-risk population is included. The IRB protocol form in the
    bundle leaves the protected-population checkboxes (section 2.5) and the prisoner questions
    (sections 2.3 and 2.4) unfilled, so it neither confirms nor contradicts this reading.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either as electronic consent with an electronic signature
      through REDCap before the visit, or in person on paper at the start of the visit for
      participants who did not choose the electronic route.
    consent_scope: >-
      Consent covers participation in the study protocol, collection and public sharing of
      de-identified data, and biobanking of blood derivatives for future research. FAIRhub records
      the consent type as "ConsentSpecifiedNotElsewhereCategorised", with the public version of the
      dataset usable only for type 2 diabetes related research and a private version permitting
      more generic use; consent is not restricted to non-commercial use, is not geographically
      restricted, is not restricted by research type, is not genetic-only, and does not carry a
      no-methods-development restriction.
    consent_documentation: >-
      The approved University of Washington consent form is published with the dataset
      documentation (AI-READI Consent Form, Standard, Mod 17 May 2023). The other clinical sites
      used the same form under IRB reliance with minor institution-specific language. Signed
      electronic consent forms are emailed automatically to participants, who may request further
      copies from the study coordinator at any point during the study.
    withdrawal_mechanism: >-
      Participants may withdraw consent at any time and cease participation; data already shared or
      used remain in the dataset, as stated in the consent document.

participant_compensation:
  - compensation_provided: true
    compensation_amount: USD 200 per study visit
    compensation_type: >-
      Cash stipend, paid after the final data are received and the study devices are returned,
      typically at least two weeks after the study visit, and not pro-rated. In addition the study
      covered reasonable parking, public transit or rideshare costs associated with the study
      visit, and offered rideshare transportation assistance to participants reporting barriers to
      attending.
    compensation_rationale: >-
      Compensation was funded through the NIH award OT2OD032644. The same type and amount of
      compensation applies to participants invited back for the year 4 follow-up visit. The IRB
      protocol notes the amount may change in later years depending on study funding, with the IRB
      to be notified of any change.
    notes: >-
      Study team effort was supported by NIH award OT2OD032644 in proportion to percentage effort
      contributed, with salaries aligned to the funding guidelines at each site.

participant_privacy:
  - anonymization_method: >-
      HIPAA Safe Harbor removal of protected health information from the public release,
      supplemented by removal of sex, race/ethnicity and medications; participant folders are named
      using study participant identifier numbers rather than direct identifiers.
    privacy_techniques: >-
      Tiered release with a public set and a controlled-access set; login through a verified
      identity system; self-attestation of research purpose; a strict custom licence agreement;
      static watermarking of released data to identify the licensee, which licensees are
      contractually prohibited from removing, obscuring, altering or masking; contractual
      prohibition on attempting to identify, contact or extrapolate identifying information about
      any data subject or to establish a data subject's membership in a particular group;
      requirement that data be stored only on institutional servers or on cloud services covered by
      a HIPAA Business Associate Agreement; and a requirement that licensees minimise the
      likelihood that data can be memorized, derived, reconstructed or reconstituted through models
      trained on the data before disseminating those models.
    reidentification_risk: >-
      The healthsheet states that no uses resulting in unfair treatment or harm are currently
      anticipated, but acknowledges a theoretical risk of future re-identification. The project
      notes that AI algorithms can infer individual patient characteristics and could facilitate
      individual-level identification, which motivated the dissemination system, licence and
      watermarking.
    data_linkage: >-
      Data are linked across the nine datatype directories by participant identifier within the
      release. Linkage to external identifiers is not provided; raw data that may contain free-text
      personal information are retained by the project but not shared.

preprocessing_strategies:
  - preprocessing_details: >-
      All clinical data captured in REDCap were mapped to the Observational Medical Outcomes
      Partnership (OMOP) Common Data Model, with each CSV file in the clinical_data directory
      mapping one-to-one to an OMOP CDM table. Data were mapped to standardized terminologies where
      possible, including RxNorm codes for current medications.
  - preprocessing_details: >-
      Retinal images were exported from imaging devices in their native raw formats and converted
      to DICOM where necessary. Topcon Maestro2 and Triton images were exported in .fda format and
      converted to DICOM; Heidelberg FLIO images were exported in .sdt format and converted to
      DICOM; Optomed Aurora, iCare EIDON, Heidelberg Spectralis and Zeiss Cirrus data were already
      in DICOM.
  - preprocessing_details: >-
      Electrocardiogram data were exported from the Philips PageWriter TC30 in .xml and converted
      to the WaveForm DataBase (WFDB) format for release.
  - preprocessing_details: >-
      Garmin Vivosmart 5 activity data were exported in .FIT format and converted to the Open
      mHealth standard; Dexcom G6 continuous glucose data were exported as .csv and also released
      in the Open mHealth standard.
  - preprocessing_details: >-
      Environmental sensor data were released as ASCII files following the NASA Earth Science Data
      Systems ASCII File Format Guidelines for Earth Science Data.
  - preprocessing_details: >-
      The whole release was organized according to the Clinical Dataset Structure (CDS) v0.1.1
      directory convention, and accompanied by CDS metadata files at the root
      (dataset_description.json, dataset_structure_description.json, study_description.json,
      participants.tsv, participants.json, healthsheet.md, README.md, CHANGELOG.md, LICENSE.txt)
      and per-datatype manifest.tsv files. Processing for v3.0.0 is described in the changelog as
      automated plus custom, in contrast to the custom/ad hoc processing used for the v1.0.0 pilot.
  - preprocessing_details: >-
      No instances were excluded at the time of preprocessing; exclusions occurred only at
      recruitment through the study eligibility criteria.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the point of data entry and acquisition. Clinical data falling outside
      expected minimum and maximum ranges were flagged automatically in REDCap and surfaced in
      reports viewed by clinical research coordinators and data managers. Using those reports,
      data managers and coordinators examined participant records and judged whether an error was
      likely. Records were checked for credibility against prespecified reasonable ranges, for
      incorrect flow through prescribed skip patterns, for missing data that could be filled
      directly from other portions of an individual's record, and for omission or duplication of
      records.
  - cleaning_details: >-
      Editing governance. Editing was performed only under the guidance and approval of the site
      principal investigator. Where corrected data were available elsewhere in the respondent's
      answers, the error was corrected; where there was no logical or appropriate way to correct
      the data, the site PI reviewed the values and decided whether they should be removed.
  - cleaning_details: >-
      Central quality control. The data manager at each site was responsible for quality control of
      all data before uploading to FAIRhub. An OMOP CDM data quality analysis was run using the
      OHDSI Data Quality Dashboard, which executes more than 3,500 data quality checks against an
      OMOP CDM instance; results are shipped with the release as dqd_omop.json in the clinical_data
      directory.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants; coverage is uneven across the nine
      datatype directories. Within surveys, individual questions may be skipped or responses left
      incomplete. Within wearable records, gaps occur where the device was charging or not worn.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. In some cases the data
      collection device had no stored results or was returned too late for results to be retrieved,
      for example because the battery died or data were lost. The Garmin Vivosmart 5 battery
      required charging every two to three days, producing systematic gaps. In a few cases a data
      collision occurred somewhere in the processing pipeline and data were lost. Some imaging
      modalities were skipped when acquisition quality was inadequate, particularly for
      operator-dependent devices.
    handling_strategy: >-
      Missing values are left as missing; no imputation is described. During data entry, missing
      data that could be filled directly from other portions of an individual's record were filled
      under site PI approval. Marijuana use was not assessed for participants living in Alabama
      because it is an illegal substance there, producing a site-structured missingness pattern in
      that variable.

raw_sources:
  - raw_data_details: >-
      Device-native and instrument-native files before conversion: ECG in .xml from the Philips
      PageWriter TC30; MoCA Duo application output in .csv (total score, section subscores, Memory
      Index Score, task completion times); Topcon Maestro2 and Triton retinal images in .fda;
      Heidelberg FLIO images in .sdt; Garmin Vivosmart 5 activity data in .FIT; Dexcom G6 glucose
      data in .csv; environmental sensor data in .csv; NORC laboratory results in .csv; and REDCap
      exports of questionnaire and clinical form data. Raw data are saved and are expected to be
      preserved by the AI-READI project for at least the duration of the project, but are not
      currently shared outside the project team, both because they have not been mapped to
      standardized terminologies and because they may accidentally include personal health
      information or personally identifiable information in free-text fields. There is a
      possibility that raw data may be included in future releases of the controlled-access
      dataset.

raw_data_sources:
  - source_description: >-
      Electronic health records at the three participating health systems (University of Alabama at
      Birmingham, University of California San Diego, University of Washington), screened for
      patients aged 40 and over with an encounter between 2020 and 2025 and for ICD-10 codes R73.09
      (pre-diabetes) and E11.X (type 2 diabetes), used to construct recruitment contact pools and,
      under controlled access, to provide past health records.
    source_type: Electronic health record system
    access_details: >-
      Accessed by site study teams under IRB protocol STUDY00016228; not redistributed. Past health
      records appear only in the controlled-access version of the dataset.
  - source_description: >-
      REDCap study database holding participant-reported questionnaire responses and
      coordinator-entered clinical form data from the visit (medications assessment, vitals, visual
      acuity, contrast sensitivity, monofilament results, complete blood count results).
    source_type: Electronic data capture system
    raw_data_format: REDCap exports
    access_details: >-
      Released after mapping to the OMOP Common Data Model as CSV files in the clinical_data
      directory; the exact REDCap survey and form instruments are published as a PDF with the v3
      documentation.
  - source_description: >-
      Ophthalmic imaging devices at the three sites: Optomed Aurora IQ, iCare EIDON, Heidelberg
      Spectralis HRA OCT/OCTA, Heidelberg FLIO, Topcon Maestro2 3D OCT-1, Topcon Triton DRI OCT and
      Zeiss Cirrus 5000.
    source_type: Clinical imaging device
    raw_data_format: DICOM natively, or .fda and .sdt converted to DICOM
  - source_description: >-
      At-home monitoring devices issued to participants for ten days: Dexcom G6 continuous glucose
      monitor, Garmin Vivosmart 5 activity tracker, and the custom LeeLab Anura environmental
      sensor.
    source_type: Wearable and environmental sensor devices
    raw_data_format: .csv for the Dexcom G6 and the environmental sensor, .FIT for the Garmin
  - source_description: >-
      Clinical laboratories: CLIA-certified laboratories local to each data collection site for
      complete blood count on fresh whole blood, and the University of Washington Nutrition and
      Obesity Research Center for all other blood and urine assays performed on stored frozen
      samples.
    source_type: Clinical laboratory
    raw_data_format: .csv
  - source_description: >-
      State Department of Licensing driving and motor vehicle accident records for the three years
      preceding the visit.
    source_type: Government administrative record
    access_details: >-
      Available only in the controlled-access version of the dataset; not present in the public
      release.

variables:
  - variable_name: participant_id
    data_type: identifier
    is_identifier: true
    is_sensitive: false
    notes: >-
      Study participant identifier used to name participant-level folders within every device
      directory and to key the root participants.tsv and per-datatype manifest.tsv files. It is a
      study-internal pseudonym rather than a direct personal identifier.
  - variable_name: recommended_split
    data_type: categorical
    categories:
      - train
      - val
      - test
    notes: >-
      Recommended train/validation/test assignment released in participants.tsv for v3.0.0, in
      proportions 70/15/15 (1,576 / 352 / 352 participants).
  - variable_name: diabetes_study_group
    data_type: categorical
    categories:
      - No DM
      - Lifestyle
      - Oral
      - Insulin
    notes: >-
      Study arm. "No DM" denotes participants without type 1 or type 2 diabetes; "Lifestyle"
      denotes pre-type 2 diabetes and type 2 diabetes controlled by lifestyle adjustment; "Oral"
      denotes type 2 diabetes controlled by oral or non-insulin injectable medication; "Insulin"
      denotes type 2 diabetes controlled by insulin. Counts in v3.0.0: 776 / 560 / 686 / 258.
    derivation: >-
      Assigned from the screening questionnaire covering diabetes health status and diabetes
      treatments, in combination with electronic health record ICD-10 screening.
  - variable_name: age
    data_type: integer
    unit: years
    minimum_value: 40.0
    maximum_value: 85.0
    notes: >-
      Eligibility restricts enrolment to adults aged 40 and over; the registered maximum age is 85
      years. Mean age across the 2,280 participants is 60.8 years (SD 11.3).
  - variable_name: sex
    data_type: categorical
    categories:
      - Male
      - Female
    is_sensitive: true
    notes: >-
      Biological sex, self-reported in the screening questionnaire. Removed from the public release
      and available only under controlled access. Counts in v3.0.0: 951 male, 1,329 female.
  - variable_name: race_ethnicity
    data_type: categorical
    categories:
      - Asian
      - Black
      - Hispanic
      - White
    is_sensitive: true
    notes: >-
      Self-reported race and ethnicity. Removed from the public release and available only under
      controlled access. Counts in v3.0.0: Asian 545, Black 519, Hispanic 380, White 836.
  - variable_name: hba1c
    data_type: float
    unit: '%'
    measurement_technique: >-
      Whole blood assay performed by the University of Washington Nutrition and Obesity Research
      Center on stored frozen samples.
    quality_notes: >-
      Reference range supplied by the testing laboratory is 4.0 to 6.0 percent. Included as a
      marker for diabetes.
  - variable_name: continuous_glucose
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Dexcom G6 real-time integrated continuous glucose monitoring system, sampling every five
      minutes over a ten-day wear period; participants were masked to the readings during the
      monitoring period.
  - variable_name: moca_total_score
    data_type: integer
    minimum_value: 0.0
    maximum_value: 30.0
    measurement_technique: >-
      Montreal Cognitive Assessment administered electronically on an iPad using the MoCA Duo
      application.
    notes: >-
      Higher scores indicate better performance. A score of 26 and above is described as normal;
      below 24 is described as a sign of cognitive impairment. Section subscores, the Memory Index
      Score and task completion times are also captured.
  - variable_name: visual_acuity_logmar
    data_type: float
    unit: logMAR
    measurement_technique: >-
      M&S Technologies Electronic Visual Acuity tester at 4 metres under best-corrected conditions,
      measured separately for each eye under photopic conditions and under mesopic conditions
      through a 2.0 neutral density filter.
    notes: >-
      Lower numbers indicate better resolution. Snellen visual acuity variables present in earlier
      releases were dropped in v3.0.0, leaving only logMAR measurements.
  - variable_name: letter_contrast_sensitivity
    data_type: float
    unit: log contrast sensitivity
    measurement_technique: >-
      Mars letter contrast sensitivity chart read monocularly under photopic conditions with a
      general occluder and under mesopic conditions with a neutral density occluder, in the
      standardised order photopic OD, photopic OS, mesopic OD, mesopic OS.
    notes: >-
      Higher numbers indicate better sensitivity. Scoring multiplies the number of errors before
      the final correct letter by 0.04 and subtracts the result from the log CS value at the final
      correct letter; testing terminates after two consecutive errors or the end of the chart.
  - variable_name: systolic_blood_pressure
    data_type: integer
    unit: mm Hg
    measurement_technique: >-
      Automatic oscillometric medically approved device, measured twice with a two-minute interval.
    quality_notes: >-
      Readings above 180 mm Hg, or below 100 mm Hg with any symptoms of haemodynamic instability,
      triggered an emergency care recommendation during the visit.
  - variable_name: heart_rate
    data_type: integer
    unit: beats per minute
    measurement_technique: >-
      Measured twice at the visit alongside blood pressure, and separately recorded continuously by
      the Garmin Vivosmart 5 during the ten-day home monitoring period.
    quality_notes: >-
      Visit readings above 100 bpm or below 60 bpm, if not known to be usual for the participant
      and accompanied by symptoms of haemodynamic instability, triggered an emergency care
      recommendation.
  - variable_name: monofilament_response
    data_type: boolean
    measurement_technique: >-
      Standard 10 g monofilament applied to three locations on the plantar surface of each foot,
      ten times per location, with the participant's eyes closed; insensate areas retested for
      confirmation.
  - variable_name: urine_albumin
    data_type: float
    unit: mg/dL
    measurement_technique: >-
      Urine assay performed by the University of Washington Nutrition and Obesity Research Center.
    quality_notes: >-
      No reference range supplied by the testing laboratory. Included as a urinary biomarker for
      early diabetic nephropathy.
  - variable_name: particulate_matter_pm2_5
    data_type: float
    measurement_technique: >-
      Custom LeeLab Anura indoor environmental sensor, placed in a frequently used area of the
      participant's home for ten days. The sensor also records PM1.0, PM4 and PM10, ambient
      temperature, relative humidity, nitrogen oxides, volatile organic compounds and eleven
      multi-spectral light intensity measurements.

file_collections:
