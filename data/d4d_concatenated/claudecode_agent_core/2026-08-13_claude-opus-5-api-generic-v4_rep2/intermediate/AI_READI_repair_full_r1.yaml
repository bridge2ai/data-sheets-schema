intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes
    usage_notes: >-
      The dataset is stored and shared as "AI-ready", meaning it is intended to enable immediate
      AI/ML research without reformatting or preprocessing.
    examples:
      - Multimodal model development across imaging, waveform, wearable, laboratory and survey data
      - Study of salutogenesis, the pathway from type 2 diabetes back to health
      - Pseudotime manifold analysis to reconstruct a temporal atlas of T2DM development and reversal
  - use_category: Methodological and infrastructural exemplar
    usage_notes: >-
      The project intends the dataset and its accompanying blueprint to serve as a model for future
      efforts to develop other medical and health datasets targeted for AI/ML, including the FAIR
      guidelines, the Clinical Dataset Structure specification and the FAIRhub platform.
    examples:
      - Reference implementation of FAIR principles for a multimodal clinical dataset
      - Testbed for the Clinical Dataset Structure (CDS) specification
  - use_category: Workforce training
    usage_notes: >-
      AI-READI hosts a year-long research internship programme providing immersive training for
      individuals interested in working at the intersection of biomedicine and AI, including a
      two-week data science and programming bootcamp followed by a year of didactic lectures and
      mentored research. Interns have been involved in developing healthsheets describing the
      AI-READI data, mapping project data into common data models, and analysing equity and ethical
      issues.

prohibited_uses:
  - prohibition_reason: >-
      Making clinical treatment decisions based on the data is not permitted, because the dataset is
      intended solely as a research resource.
  - prohibition_reason: >-
      Using or attempting to use the data, alone or in concert with other information, to compromise
      or infringe the confidentiality of information about a data subject, to invade or compromise
      the privacy of any data subject, to attempt to identify or contact any data subject or group of
      data subjects, to extract or extrapolate any identifying information about a data subject, to
      establish a data subject's membership in a particular group of persons, or otherwise to cause
      harm or injury to any data subject, is prohibited by the licence.
  - prohibition_reason: >-
      Sharing or distributing the data with any third-party model vendor or developer for training or
      development purposes is prohibited, even if that vendor is party to a Business Associate
      Agreement with the licensee's institution, where training includes model weight modification
      and other adjustments to a model's logic or operation. Short-term interaction with a third-party
      model under a BAA, such as prompting or querying for analysis, is permitted.
  - prohibition_reason: >-
      Transferring, licensing, sublicensing, selling, assigning, displaying, sharing or otherwise
      conveying any portion of the data or any derivative work to any party that is not itself bound
      by an identical licence agreement is prohibited, in order to keep all recipients under the same
      participant-protection obligations.
  - prohibition_reason: >-
      Reproducing the data in papers, articles, presentations, analyses, reports or publications
      beyond small representative samples in up to five images or figures per paper is prohibited;
      larger amounts may not be published, posted or otherwise made available via supplemental files,
      zip archives, code packages or other means, notwithstanding journal or conference requirements.
  - prohibition_reason: >-
      Removing, obscuring, altering or masking the static watermarking that may be applied to
      identify the licensee is prohibited, because the watermarking is a security control protecting
      study participants.
  - prohibition_reason: >-
      Disseminating models developed, trained or adapted using the data without first undertaking all
      reasonable efforts to minimise the likelihood that the data can be memorized, derived,
      reconstructed or reconstituted through the use or construction of those models is prohibited.

other_tasks:
  - task_details: >-
      The dataset was assembled to be hypothesis-agnostic, with assessments drawn from many health
      domains likely to be affected by type 2 diabetes, so it can support analyses beyond diabetes
      trajectory modelling — for example work on vision and retinal structure, cardiac
      electrophysiology, cognition, peripheral neuropathy, physical activity, sleep and indoor
      environmental exposure. Public-set use is nonetheless gated by a self-attestation that the data
      will be used only for type 2 diabetes related research; FAIRhub records that a private version
      will allow for more generic use.
  - task_details: >-
      The environmental sensor component was developed to enable studies of the exposome on ocular
      health, an application area distinct from the primary diabetes focus.

future_use_impacts:
  - impact_details: >-
      Because enrolment is ongoing, the pilot release and periodic updates to data releases may not
      have achieved balanced distribution across race/ethnicity, sex and diabetes severity groups.
      Future users training models on a single release should not assume the balance targeted by the
      study design has been reached in that release.
  - impact_details: >-
      There is a theoretical risk of future re-identification. AI algorithms can infer individual
      patient characteristics and could facilitate individual-level identification, which is why the
      project implements a robust data dissemination system, a strict licence agreement and data
      watermarking for both the public and controlled sets.
  - impact_details: >-
      Because sex, race, ethnicity and medications are withheld from the public release, users of
      that release cannot audit their models for subgroup performance disparities directly. The
      supplied recommended split is balanced on those withheld strata as a partial mitigation, and
      the project describes this split as a method for reducing disparity of error rate between
      demographic subgroups when demographic labels are unavailable.
  - impact_details: >-
      The project provides no formal guidelines for future researchers creating new labels or
      defining new tasks on the dataset, so labelling conventions introduced downstream will not be
      harmonised across users.

notes: >-
  A smaller "mini" version of the dataset is offered for pipeline development; the FAIRhub API
  records it as a child dataset (id 4) of version 3.0.0, and the version 3 documentation covers it in
  the Preliminary Information section alongside Azure Storage access. Its size, file count and
  composition are not stated in the available sources. Separately, the FAIRhub study description
  lists sixteen individuals with the role "Study Principal Investigator" for the underlying study, a
  role for which the schema provides no slot: Aaron Lee and Cecilia Lee (University of Washington);
  Sally L. Baxter, Samantha Hurst and Linda M. Zangwill (University of California, San Diego);
  Christopher G. Chute and T. Y. Alvin Liu (Johns Hopkins University); Amir Bahmani, Michael Snyder
  and Sara J. Singer (Stanford University); Gerald McGwin and Cynthia Owsley (University of Alabama
  at Birmingham); Shannon McWeeney (Oregon Health & Science University); Bhavesh Patel (California
  Medical Innovations Institute); Jorge Contreras (University of Utah); and Nicholas Evans
  (University of Massachusetts Lowell). The Nature Metabolism comment additionally names Hiroshi
  Ishikawa, Jeffrey C. Edberg, Kadija Ferryman and Camille Nebeker among the project's principal
  investigators. These are study officials rather than declared creators of the dataset, whose sole
  declared creator is the AI-READI Consortium.

source_caveats: >-
  Several disagreements and gaps across the source bundle are recorded rather than resolved.
  (1) Acronym expansion: the BMJ Open protocol and the Nature Metabolism comment expand AI-READI as
  "Artificial Intelligence Ready and Equitable Atlas for Diabetes Insights", while NIH RePORTER, the
  FAIRhub study description, the healthsheet and the README expand it as "Artificial Intelligence
  Ready and Exploratory Atlas for Diabetes Insights"; the FAIRhub official study title is "AI Ready
  and Exploratory Atlas for Diabetes Insights". (2) Enrolment target: 4,000 participants in the BMJ
  Open protocol, the Nature Metabolism comment, the FAIRhub enrollmentInfo and the README, but 4,600
  in the IRB protocol form. (3) Institutional attribution: FAIRhub records Washington University in
  St. Louis as lead sponsor, managing organization, licensor and PI affiliation, while the NIH award
  organization, IRB, consent documents and publication affiliations point to the University of
  Washington; the RO-Crate names "Washington University IRB" at a University of Washington address.
  (4) Collection start date: 18 July 2023 in the BMJ Open protocol versus 19 July 2023 in FAIRhub
  metadata. (5) De-identification level: FAIRhub sets deIdentType to "NoDeIdentification" while
  setting deIdentDirect and deIdentHIPAA to true and explaining that no identifiers were collected;
  the RO-Crate records deidentified as true; healthsheet questions on de-identification measures
  (composition Q13, preprocessing Q1) and on errata (maintenance Q3) are left blank. (6) Prevalence
  figure: T2DM affects 10.5% of the world's adult population per the BMJ Open protocol, versus more
  than 6% of the world's population per the Nature Metabolism comment. (7) Demographic
  subpopulations: the healthsheet answers "No" to whether the dataset identifies demographic
  sub-populations, consistent with the public release, while the README split table reports counts by
  race/ethnicity and sex. (8) Version scope: the version 3 documentation "About" page states that the
  documentation is associated with v3.0 of the dataset "which contains data from the participants of
  the pilot study phase", text that appears carried over verbatim from the v2 page and is
  inconsistent with the 2,280-participant main-study description elsewhere; similarly the healthsheet
  versioning section describes v3 as covering "the second year of the study" while the changelog
  table labels v3 the main study including year 3 data. (9) Project period: NIH RePORTER records the
  award project period as 2022-09-01 to 2025-08-31, while the FAIRhub study status module gives an
  anticipated completion date of 2027-01-01 and the BMJ Open protocol states enrolment continues to
  30 November 2026. (10) Diabetes group naming: earlier sources describe the second arm as
  "pre-diabetes/diet controlled" (IRB protocol) and later sources as "pre-diabetes/lifestyle
  controlled". (11) Grant identification: one core project number, OT2OD032644, is cited through two
  different NIH RePORTER application records (10471118 and 10885481); these are recorded as a single
  grant with the divergence noted at the funders slot. (12) The IRB protocol form in the bundle is a
  partly unfilled template whose answers reflect an earlier stage of the study (for example a 4,600
  target and an unspecified Spanish translation supplement), and should be read as historical rather
  than as a description of the released dataset.