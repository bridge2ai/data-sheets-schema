data_collectors:
  - role: researcher
    collector_details: >-
      Clinical research coordinators at the three data collection sites (University of Alabama at
      Birmingham, University of California San Diego, University of Washington) recruited, consented
      and enrolled participants and collected the on-site data.
    notes: >-
      All research personnel who recruited, enrolled and collected data underwent training by the
      data manager at UAB and worked from a detailed Manual of Procedures. A certification process is
      required for all coordinators, including mandatory institutional compliance training for human
      subject research; prior to enrolling participants, coordinators must successfully administer
      all protocol elements to at least three volunteer practice subjects.
  - role: researcher
    collector_details: >-
      Data managers at each site oversaw the data collection process and were responsible for the
      quality control of all data before uploading to FAIRhub.
  - role: researcher
    collector_details: >-
      Retinal imaging technicians collected the imaging data and were trained to detect certain
      potentially life- or vision-threatening conditions (retinal detachment, tumour, optic disc
      oedema).
  - role: researcher
    collector_details: >-
      Phlebotomists and laboratory assistants responsible for blood collection from research
      participants and for processing and shipping samples.
  - role: academic_institution
    collector_details: >-
      Clinical Laboratory Improvement Amendments-certified laboratories local to each data collection
      site performed complete blood count testing on fresh whole blood; the University of Washington
      Nutrition and Obesity Research Center (NORC) performed all other blood and urine assays on
      stored, frozen samples.
  - role: academic_institution
    collector_details: >-
      Oregon Health & Science University uploaded the combined UW, UCSD and UAB recruitment dataset
      into REDCap for the purpose of creating patient-specific REDCap survey links and distributing
      REDCap email invitations.
    notes: >-
      Team effort was supported by NIH award OT2OD032644 based on the percentage of effort
      contributed, with salaries aligned to the funding guidelines at each site.

sampling_strategies:
  - is_sample: true
    is_random: false
    is_representative: false
    strategies: >-
      Triple-balanced recruitment: participants are recruited in equal proportions across four
      self-reported race/ethnic groups (Asian, Black, Hispanic, White), four categories of T2DM (no
      diabetes; pre-diabetes/lifestyle-controlled; controlled with oral medications or non-insulin
      injectables; insulin-controlled) and biological sex (male, female). Recruitment in waves, with
      the composition and size of each wave influenced by the observed participation characteristics
      of race/ethnicity, gender, severity of T2DM and site; composition is monitored and adjusted by
      under- and oversampling groups as needed. Contact pools identified for each wave by screening
      electronic health records at each site; individuals are mailed a hardcopy invitation letter and
      sent an invitation email personalised with links, access codes and QR codes directing them to
      an online REDCap recruitment interface. Three geographically distinct data collection sites
      chosen to increase geographic and demographic representation, with each site prioritising the
      racial/ethnic groups most prevalent in its area while recruiting all groups.
    source_data: >-
      Patients aged 40 years or older with a medical encounter within the UAB, UCSD or UW health
      systems, identified by screening electronic health records for ICD-10 diagnosis codes R73.09
      (pre-diabetes) and E11.X (T2DM), and patients without such encounters for the non-diabetic
      group.
    why_not_representative: >-
      Building balanced datasets is critical for the development of unbiased machine learning models,
      so rather than targeting the demographic distribution of the US population the study is
      triple-balanced by recruiting the four race/ethnic groups, four T2DM categories and both sexes
      in equal proportions. The FAIRhub study description records the sampling method as
      "Non-Probability Sample".
    notes: >-
      The healthsheet states that the dataset contains all possible instances - that is, data from
      all participants enrolled during the covered collection period - and answers "N/A" to the
      question about the sampling strategy used to draw a sample from a larger set.

raw_data_sources:
  - source_description: >-
      Retinal imaging exported from Topcon Maestro2 and Topcon Triton devices in the manufacturer's
      proprietary format prior to conversion.
    raw_data_format: .fda
    access_details: >-
      Retained by the AI-READI project; not shared outside the project team at present. There is a
      possibility that raw data may be included in future releases of the controlled access dataset.
    source_type: imaging device export
  - source_description: >-
      Fluorescence lifetime imaging ophthalmoscopy data exported from the Heidelberg FLIO device in
      the manufacturer's proprietary format prior to conversion.
    raw_data_format: .sdt
    access_details: Retained by the AI-READI project; not currently shared outside the project team.
    source_type: imaging device export
  - source_description: 12-lead electrocardiogram exported from the Philips PageWriter TC30 Cardiograph.
    raw_data_format: .xml
    access_details: Exported to local storage at each site, then uploaded to FAIRhub after conversion.
    source_type: clinical device export
  - source_description: >-
      Montreal Cognitive Assessment output from the MoCA Duo application, including total score,
      section subscores, Memory Index Score and task completion times.
    raw_data_format: .csv
    source_type: application export
  - source_description: Physical activity data exported from the Garmin Vivosmart 5 fitness tracker.
    raw_data_format: .FIT
    access_details: Converted to the Open mHealth standard for the dataset.
    source_type: wearable device export
  - source_description: Continuous glucose monitoring data exported from the Dexcom G6.
    raw_data_format: .csv
    access_details: Converted to the Open mHealth standard for the dataset.
    source_type: wearable device export
  - source_description: Indoor environmental measurements exported from the LeeLab Anura sensor.
    raw_data_format: .csv
    source_type: environmental sensor export
  - source_description: >-
      Blood and urine testing results provided by the University of Washington Nutrition and Obesity
      Research Center laboratory.
    raw_data_format: .csv
    source_type: laboratory report
  - source_description: >-
      Patient-reported questionnaire responses and coordinator-entered clinical measurements captured
      in REDCap.
    access_details: >-
      Mapped to the OMOP Common Data Model before release; the underlying REDCap export is retained by
      the project.
    source_type: electronic data capture system

raw_sources:
  - raw_data_details: >-
      The raw data is saved and expected to be preserved by the AI-READI project at least for the
      duration of the project but is not anticipated to be shared outside the project team at
      present, because it has not been mapped to standardized terminologies and because the raw data
      may accidentally include personal health information or personally identifiable information
      (for example in free text fields). There is a possibility that raw data may be included in
      future releases of the controlled access dataset.
    notes: >-
      All participant images are exported from imaging devices in their raw format; some images
      required conversion to a DICOM standard format prior to upload to the AI-READI data storage
      site.

preprocessing_strategies:
  - preprocessing_details: >-
      All clinical data collected through REDCap were mapped to the Observational Medical Outcomes
      Partnership (OMOP) Common Data Model, with each CSV file in the clinical_data directory a
      one-to-one mapping to an OMOP CDM table.
  - preprocessing_details: >-
      Retinal imaging data (photography, OCT, OCTA and FLIO) were converted where necessary from
      device-native formats (.fda, .sdt) into the DICOM standard.
  - preprocessing_details: >-
      Electrocardiogram data were converted from the Philips .xml export into the WaveForm DataBase
      (WFDB) format.
  - preprocessing_details: >-
      Wearable fitness tracker data were converted from the Garmin .FIT file format into the Open
      mHealth standard; continuous glucose monitoring data were likewise released in the Open mHealth
      standard.
  - preprocessing_details: >-
      Environmental sensor data were formatted following the NASA ASCII File Format Guidelines for
      Earth Science Data.
  - preprocessing_details: >-
      The whole dataset was organized following the Clinical Dataset Structure (CDS) v0.1.1: one
      directory per datatype at the root level, then one directory per modality, then one per device,
      then one per participant, with manifest.tsv metadata files and root-level CDS metadata files.
  - preprocessing_details: >-
      Protected Health Information as defined by the HIPAA Privacy Rule was stripped from the public
      set using the Safe Harbor method, and information related to the sex and race/ethnicity of the
      participants as well as medications used was removed, to prevent stigmatization of findings and
      to protect participant privacy.
  - preprocessing_details: >-
      In version 3.0.0 the Snellen visual acuity variables were dropped, so that only logMAR visual
      acuity measurements are available.
    notes: >-
      Processing across releases evolved from custom/ad hoc handling for the v1.0.0 pilot to a mix of
      automated and custom processing for the year 2 and year 3 data.

cleaning_strategies:
  - cleaning_details: >-
      Quality control at the time of data entry/acquisition: clinical data outside of expected
      min/max ranges were flagged in REDCap and appeared in reports viewed by clinical research
      coordinators and Data Managers. Using these reports as guides, Data Managers and CRCs examined
      participant records and determined if an error was likely. Data were checked and edited for
      credibility based on range checks, incorrect flow through prescribed skip patterns, missing
      data that could be directly filled from other portions of an individual's record, and the
      omission and/or duplication of records.
    notes: >-
      Editing was only done under the guidance and approval of the site PI. If corrected data was
      available elsewhere in the respondent's answers, the error was corrected; if there was no
      logical or appropriate way to correct the data, the site PI reviewed the values and decided
      whether they should be removed.
  - cleaning_details: >-
      The Data Manager at each data site is responsible for the quality control of all data before
      uploading to FAIRhub.
  - cleaning_details: >-
      The dataset was reviewed internally by AI-READI team members for quality checks and to ensure
      that no personally identifiable information was accidentally included.
  - cleaning_details: >-
      No instances were excluded from the dataset at the time of preprocessing; exclusions occurred
      only at the level of study eligibility criteria.

missing_data_documentation:
  - missing_data_patterns: >-
      Not all modalities are available for all participants. Skipped questions or incomplete
      responses in survey data.
    missing_data_causes: >-
      Some participants elected not to participate in some study elements. The data collection device
      did not have any stored results or was returned too late to retrieve the results (for example
      the battery died or data was lost). A data collision at some point in the process resulted in
      lost data. Improper use of wearables, technical failure such as battery failure or system
      malfunction. For imaging, patient uncooperation, noise obscuring the images, system malfunction
      and data transfer failures.
    handling_strategy: >-
      Missing modalities are left absent rather than imputed; instances with partial data are
      retained in the dataset.

anomalies:
  - anomaly_details: >-
      In survey data, skipped questions or incomplete responses are expected.
  - anomaly_details: >-
      In wearable data, improper use and technical failure such as battery failure or system
      malfunction are expected, and can result in absent or truncated records.
  - anomaly_details: >-
      In imaging data, patient uncooperation, noise that may obscure the images, technical failure
      such as system malfunction, and data transfer failures are expected.
  - anomaly_details: >-
      Image quality varies for undilated handheld Optomed Aurora fundus photography from participant
      to participant and within the same participant, because obtaining a good view is challenging
      without dilation and because of the handheld nature of the imaging modality.
  - anomaly_details: >-
      Heidelberg Spectralis imaging is operated by the imaging team and is not fully automated, so
      quality issues may arise which may lead to skipping this modality and missing data.
  - anomaly_details: >-
      FLIO is performed as the last modality of a visit because it takes longer than a usual
      Spectralis OCT and exposes patients to uncomfortable levels of light; because of this,
      participants may not be at their best possible compliance.

known_biases:
  - bias_type: selection_bias
    bias_description: >-
      Participants are volunteers; therefore there is selection bias known as volunteer bias, which
      may limit the generalisability of the results among those who are not represented in the study
      population.
    mitigation_strategy: >-
      Recruitment in waves with monitoring of diversity and inclusion and adjustment by under- and
      oversampling groups as needed.
  - bias_type: sampling_bias
    bias_description: >-
      Recruitment is predominantly urban and hospital-based, drawn from the electronic health records
      of three academic health systems, which may not fully capture diverse cultural and
      socioeconomic backgrounds. The FAIRhub study description records the sampling method as a
      non-probability sample.
    mitigation_strategy: >-
      Three recording sites were strategically selected for geographic diversity across the United
      States and to ensure diverse representation across racial and ethnic groups; individuals from
      all demographic backgrounds were recruited at all three sites, and uniform data collection
      protocols were implemented for all subjects irrespective of race/ethnicity, biological sex or
      diabetes severity.
  - bias_type: representation_bias
    bias_description: >-
      The study cohort does not include other races/ethnicities such as Pacific Islanders and Native
      Americans. It is well documented that recruiting Black men into health research is more
      difficult than recruiting other populations, yet this population bears a disproportionate
      percentage of T2DM burden; similar trends for under-recruitment and disease burden have been
      reported for Hispanic and Asian persons. Requiring that eligible participants speak, read and
      understand English may create challenges in recruiting Hispanic and/or Asian persons.
    affected_subsets:
      - Black participants
      - Hispanic participants
      - Asian participants
      - Pacific Islander and Native American populations (not included)
    mitigation_strategy: >-
      Triple-balanced recruitment targets equal proportions across four race/ethnic groups; if sample
      balancing on race/ethnicity emerges as a challenge, new recruitment strategies will be
      implemented to overcome the imbalance. Strategies identified in the literature include
      tailoring printed materials and using a personalised, participatory approach to recruitment.
      Through engagement with the Native Biodata Consortium the project pursues a co-learning
      opportunity for understanding challenges specific to American Indian and Alaska Native
      communities.
  - bias_type: representation_bias
    bias_description: >-
      While the cross-sectional database ultimately aims to achieve balance across race/ethnicity,
      biological sex, and diabetes presence and severity, releases made while enrolment is ongoing
      may not have achieved balanced distribution across groups.
    mitigation_strategy: >-
      Continued enrolment with monitoring and adjustment of wave composition; provision of
      recommended training/validation/testing splits whose validation and test sets are balanced as
      well as possible for sex, race/ethnicity and diabetes status.

known_limitations:
  - limitation_type: representativeness_limitation
    limitation_description: >-
      The study population is designed to be balanced rather than demographically representative of
      the US population, and interim releases may not yet have achieved the intended balance across
      race/ethnicity, sex and diabetes severity.
    scope_impact: >-
      Prevalence estimates and population-level inferences drawn from the dataset will not correspond
      to the general US population.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The cohort does not include races/ethnicities other than Asian, Black, Hispanic and White; in
      particular Pacific Islanders and Native Americans are not represented. Recruitment is
      predominantly urban and hospital-based.
  - limitation_type: scope_limitation
    limitation_description: >-
      Eligibility is restricted to adults aged 40 years and older (and, per the FAIRhub study
      description, no older than 85) who are able to provide consent and who must speak and read
      English; pregnancy, gestational diabetes and type 1 diabetes are exclusionary.
    recommended_mitigation: >-
      Users should not generalise findings to younger adults, to non-English speakers, to pregnant
      individuals, or to people with type 1 or gestational diabetes.
  - limitation_type: temporal_limitation
    limitation_description: >-
      The dataset is cross-sectional with currently only one study visit per participant; longitudinal
      follow-up is planned for approximately 10% of the cohort in Year 4 of the project, with
      approximately 4% of participants expected to undergo a follow-up examination.
  - limitation_type: coverage_limitation
    limitation_description: >-
      The public release omits sex, race/ethnicity, medications, 5-digit zip code, genetic sequencing
      data, past health records and traffic and accident reports, all of which are held under
      controlled access.
    recommended_mitigation: >-
      Researchers requiring these variables must obtain the controlled-access dataset through a data
      use agreement.
  - limitation_type: methodological_limitation
    limitation_description: >-
      Some measurement instruments carry known interpretive caveats; for example, professionals
      require training to score the MoCA, and a person's level of education, socioeconomic factors,
      and depression or other mental health issues may affect MoCA scores.
  - limitation_type: scope_limitation
    limitation_description: >-
      A limitation of the associated biorepository is that there are a finite number of samples to
      share with scientists interested in using them in research.
    recommended_mitigation: >-
      Procedures for reviewing and prioritising written requests will be developed before the
      biorepository is complete.

content_warnings:
  - content_warnings_present: false
    notes: >-
      The healthsheet states that the dataset does not contain data that, if viewed directly, might
      be offensive, insulting, threatening, or otherwise pose any safety risk such as psychological
      safety and anxiety.

confidential_elements:
  - confidential_elements_present: false
    confidentiality_details: >-
      The dataset does not contain data that might be considered confidential. No personally
      identifiable information is included in the dataset.

sensitive_elements:
  - sensitive_elements_present: false
    sensitivity_details: >-
      The public dataset does not contain data that is considered sensitive: it includes survey data,
      blood and urine lab results, fitness activity levels, clinical measurements (for example
      monofilament and cognitive function testing), retinal images, ECG, blood sugar levels, and
      environmental variables such as home air quality.
  - sensitive_elements_present: true
    sensitivity_details: >-
      The controlled access dataset contains data regarding racial and ethnic origins, location
      (5-digit zip code), sex, genetic sequencing data, past health records, medications, and traffic
      and motor vehicle accident reports.
    notes: >-
      The controlled access dataset is only available for use by scientists whose institutions have
      completed legal and privacy use agreements with the AI-READI research programme; requirements
      are being developed by the Data Access Committee.

is_deidentified:
  identifiable_elements_present: false
  method: >-
    NoDeIdentification (as recorded in the FAIRhub dataset_description deIdentType). No identifiers
    were collected so no active de-identification was necessary; the project verified that no
    identifiable data per US HIPAA were present, and Protected Health Information as defined by the
    HIPAA Privacy Rule was stripped from the public set via the Safe Harbor method.
  identifiers_removed: >-
    All HIPAA-defined Protected Health Information; Sex; Race and ethnicity; Medications used
  deidentification_details: >-
    The FAIRhub dataset_description records deIdentType "NoDeIdentification" with deIdentDirect true
    and deIdentHIPAA true, and explains: "No identifiers were collected so no active
    de-identification was necessary but we checked that no identifiable data per US HIPAA were
    present in the data." Dates were not shifted, non-arrayed variables were not modified, and
    k-anonymity was not applied.
  notes: >-
    Information related to sex and race/ethnicity was removed from the public set to prevent
    stigmatization of findings. To prevent reidentification attempts, the project is implementing a
    robust data dissemination system, a strict licence agreement and data watermarking for both
    public and controlled sets. A theoretical risk of future re-identification remains.

human_subject_research:
  involves_human_subjects: true
  ethics_review_board: >-
    Institutional Review Board of the University of Washington, with reliance agreements with the
    IRBs of the University of Alabama at Birmingham and the University of California, San Diego.
  irb_approval:
    - STUDY00016228
  regulatory_compliance: >-
    HIPAA Privacy Rule (public set de-identified via Safe Harbor); NIH Genomic Data Sharing Policy
    security best practices imposed on licensees; the FAIRhub study description records
    isFDARegulatedDrug "No", isFDARegulatedDevice "No", humanSubjectReviewStatus "Submitted,
    approved" and oversightHasDMC "No". Registered on ClinicalTrials.gov as NCT06002048.
  special_populations:
    - >-
      Pregnant individuals and individuals with gestational diabetes are excluded from participation.
    - >-
      Individuals with type 1 diabetes are excluded from participation.
    - >-
      Only adults aged 40 years and older who are able to provide consent are eligible; the FAIRhub
      study description sets a maximum age of 85 years.
  notes: >-
    Written informed consent is provided by all participants. A Community Advisory Board of 11
    persons from the three sites, including diversity in race and ethnicity as represented in the
    AI-READI sample, contributes to the development of the protocol and evaluates the consent forms
    and research protocols.

at_risk_populations:
  at_risk_groups_included: false
  special_protections: >-
    Transportation assistance (rideshare services) was offered to study participants who endorsed
    barriers to transporting themselves to study visits, and the study covers reasonable costs for
    parking, public transit or rideshare fees related to the study visit.
  notes: >-
    None. The study enrols only adults aged 40 and older who are able to provide consent, so the IRB
    protocol sections on children, parental permission and assent were answered as not applicable.
    Pregnant individuals and those with gestational diabetes are excluded. Prisoners are not a target
    population and no prisoner-specific provisions are described.

ethical_reviews:
  - reviewing_organization: University of Washington Institutional Review Board
    review_details: >-
      AI-READI was approved by the IRB of the University of Washington under approval number
      STUDY00016228, including reliance agreements with the IRBs of the University of Alabama at
      Birmingham and the University of California, San Diego. Initial approval was received on 20
      December 2022. An annual renewal application about the status and progress of the study is
      required within 90 days of expiration.
    notes: >-
      The initial approval letter is published with the dataset documentation as
      Approval_STUDY00016228_Lee_initial.pdf.
  - reviewing_organization: University of California San Diego Health Data Oversight Committee
    review_details: >-
      UCSD has a Health Data Oversight Committee that oversees data sharing with other institutions;
      approval is contingent upon IRB approval and was to be sought immediately after IRB approval
      was obtained. The State of California additionally requires inclusion of the Experimental
      Subject's Bill of Rights in the UCSD consent form.
  - reviewing_organization: AI-READI Community Advisory Board
    review_details: >-
      A Community Advisory Board of 11 persons from the three sites, including diversity in race and
      ethnicity as represented in the AI-READI sample, contributes to the development of the protocol
      and evaluates the consent forms and research protocols, with feedback considered in
      modifications.
  - reviewing_organization: AI-READI ethics and bioethics team
    review_details: >-
      Ethical, legal and social implications are considered at every stage of the project cycle, with
      guidance from bioethicists. The project reviewed existing documentation approaches such as
      datasheets and healthsheets to identify the most suitable one for biomedical data, and engages
      with the Native Biodata Consortium on data usage agreements, contract negotiations, transparent
      access agreements, and assured return of benefit and sustainable input, control and monitoring
      of Tribal data.

informed_consent:
  - consent_obtained: true
    consent_type: >-
      Written informed consent, obtained either electronically (e-consent with electronic signature
      in REDCap) or in person at the start of the visit.
    consent_documentation: >-
      The approved consent form for the principal project site, the University of Washington, is
      published with the documentation as AI-READI Consent_Form_Standard_Mod17May2023_useforpilot.pdf.
      The other clinical sites had IRB reliance and used the same consent form, with minor
      institution-specific language incorporated depending on individual institutional requirements.
      Upon signing, the signed consent form is automatically emailed to the subject, and additional
      copies can be requested from the study coordinator for the duration of the study.
    consent_scope: >-
      Informed consent to participate was required before participation in any part of the protocol,
      including questionnaires. The consent covers collection of the multimodal study data, placement
      of data in an open-source repository, and collection and storage of blood and urine
      biospecimens in the study repository for use in future research.
    withdrawal_mechanism: >-
      Participants were permitted to withdraw consent at any time and cease study participation;
      however, any data that had been shared or used up to that point would stay in the dataset. This
      is clearly communicated in the consent document.
    notes: >-
      Consent was requested through the study's REDCap interface: potential participants received a
      unique code by email, letter or telephone contact giving access to the e-consent documentation,
      which they could read, navigate forward and backward through, and return to later; no
      study-specific questionnaires other than the screening questionnaire were available until
      consent had been given. They could also request a call back or video conference to ask
      questions, or wait to sign at the in-person visit; those lacking internet access could call
      research staff for alternative methods. Each individual was notified of and aware of the data
      collection, as this was active data collection directly from participants rather than passive
      collection or secondary use of existing data: individuals in each recruitment pool were mailed
      a hardcopy invitation letter and sent an invitation email, both personalised to direct them
      into the REDCap recruitment interface where they could read an overview of the research
      programme, expectations for participation and Frequently Asked Questions, download the informed
      consent document, and request a call back from study staff. Approximately 50,000 invitation
      letters per site were planned; letters were produced and mailed by Adapt Inc., an SSAE16 SOC
      Security-certified and HIPAA-compliant printing and fulfillment service. Comprehension is
      supported by asking subjects to confirm their understanding of study activities and
      requirements. Non-English speakers were not initially enrolled because translation of all study
      materials was not yet possible.

data_protection_impacts:
  - impact_details: >-
      No data protection impact analysis has been conducted for the dataset, as recorded in the
      healthsheet.

intended_uses:
  - use_category: Artificial intelligence and machine learning research on type 2 diabetes
    examples:
      - Downstream pseudotime manifold analysis to predict T2DM disease trajectories
      - Multimodal model development for understanding T2DM
      - Research into salutogenesis, the pathway from T2DM back to health
    usage_notes: >-
      Accessing the public dataset requires agreeing to use the data only for type 2 diabetes related
      research.
  - use_category: Methodological and infrastructure exemplar
    examples:
      - >-
        A model or blueprint for future data generation projects seeking to collect, prepare and
        share AI-ready clinical research datasets following FAIR principles
      - >-
        Testing and refinement of the Clinical Dataset Structure (CDS) specification and of the
        FAIRhub curation and sharing platform
    usage_notes: >-
      The AI-READI Consortium disseminates the principles and processes of designing and implementing
      the dataset through publications, the Zenodo community and the GitHub organization.
  - use_category: Training and workforce development
    examples:
      - >-
        Use within the AI-READI year-long research internship programme, in which interns develop
        healthsheets describing the data, map project data into common data models, and analyse
        equity and ethical issues
    usage_notes: >-
      The inaugural 2023-2024 cohort consisted of 10 interns, of whom 70% were women, 30% were Black
      and 50% were from under-represented backgrounds based on NIH criteria.

other_tasks:
  - task_details: >-
      A private/controlled version of the dataset will allow for more generic use beyond type 2
      diabetes related research, as recorded in the FAIRhub consent metadata.
  - task_details: >-
      Biobanked specimens held at the UAB Center for Clinical and Translational Science support tasks
      beyond the released data, including DNA extraction and future whole genome sequencing and
      genomic applications, future proteomics and metabolomics studies from plasma and serum, future
      RNA isolations from PAXgene tubes, and future immunological studies and generation of induced
      pluripotent stem cells from peripheral blood mononuclear cells.
    notes: >-
      Biobanked samples will eventually be available to scientists according to procedures and
      policies that are in development; a limitation is the finite number of samples available.
  - task_details: >-
      The project anticipates that the flagship dataset will lead to novel discoveries into T2DM
      pathogenesis and salutogenesis while benefiting a broader population, given the diversity of
      the study participants.

prohibited_uses:
  - notes: >-
      Licensees shall not make clinical treatment decisions based on the Data.
    prohibition_reason: The Data is intended solely as a research resource.
  - notes: >-
      Licensees shall not use or attempt to use the Data, alone or in concert with other information,
      to compromise or otherwise infringe the confidentiality of information on an individual person
      who is the source of any Data, to identify or contact any individual Data Subject or group of
      Data Subjects, to extract or extrapolate any identifying information about a Data Subject, to
      establish a particular Data Subject's membership in a particular group of persons, or otherwise
      to cause harm or injury to any Data Subject.
    prohibition_reason: >-
      To protect Data Subjects' right to privacy and to prevent harm or injury to study participants.
  - notes: >-
      Licensees shall not transfer, license, sublicense, sell, assign, display, share or otherwise
      convey any portion of the Data or any derivative work to any third party other than another
      licensee bound by an agreement with the Licensor on identical terms.
    prohibition_reason: >-
      To keep all recipients bound by the same data usage, security and secondary sharing
      obligations.
  - notes: >-
      Licensees shall not disseminate models, algorithms or programs developed, trained or adapted
      using the Data without first undertaking all reasonable efforts to minimise the likelihood that
      Data can be memorized, derived, reconstructed or reconstituted through the use or construction
      of such Models.
    prohibition_reason: >-
      To prevent reconstruction of participant-level data from released AI/ML models.
  - notes: >-
      Access to the public dataset is conditioned on agreeing to use the data only for type 2
      diabetes related research; other uses are outside the granted permission.
    prohibition_reason: >-
      Access terms recorded in the FAIRhub access details and consent metadata restrict the public
      version to T2DM-related research.

future_use_impacts:
  - impact_details: >-
      There is a theoretical risk of future re-identification of participants from the released data.
    notes: >-
      AI algorithms can infer individual patient characteristics and could facilitate individual-level
      identification; to prevent reidentification attempts the project implements a robust data
      dissemination system, a strict licence agreement and data watermarking for both public and
      controlled sets.
  - impact_details: >-
      The dataset is expected to lead to novel discoveries into T2DM pathogenesis and salutogenesis
      while benefiting a broader population, given the diversity of the study participants, and to
      remove one of the major bottlenecks to the widespread use of AI in healthcare: the availability
      of data that is off-the-shelf ready for AI-based analysis.
  - impact_details: >-
      Because sex, race and ethnicity are withheld from the public release, future users cannot
      directly audit models for demographic disparities using the public data; the project instead
      supplies a demographically balanced recommended split intended to reduce disparities in models
      developed from the dataset.

license_and_use_terms:
  data_use_permission: disease_specific_research
  license_terms: >-
    The dataset is released under a custom license (AI-READI custom license v2.0, DOI
    10.5281/zenodo.17555036) specifically tailored to enable reuse of the AI-READI dataset for
    commercial or research purposes while imposing strong requirements around data usage, security
    and secondary sharing to protect study participants, especially when data is reused for AI and ML
    applications. Under version 1.0 of the license text, the University of Washington as Licensor
    grants a non-exclusive, non-transferable license to download, reproduce and use the Data and to
    create derivative works, for research and commercial purposes; sharing is limited to other
    licensees bound by identical terms; models trained on the Data may be distributed provided
    reasonable efforts are made to minimise memorization or reconstruction of the Data; licensees
    must comply with NIH Genomic Data Sharing Policy security and privacy standards; the license
    terminates automatically on breach, whereupon all copies must be deleted; title and all
    intellectual property rights remain with the Licensor; the Data is provided "as is" without
    warranty, with liability capped in the aggregate at one U.S. dollar; and the licensee indemnifies
    the Licensor. Licensees agree to acknowledge the source and any funder of the Data in any
    publications reporting use of the Data. Accessing the dataset additionally requires logging in
    through a verified ID system and agreeing to use the data only for type 2 diabetes related
    research; the FAIRhub access type is recorded as PublicDownloadSelfAttestationRequired. The
    documentation at docs.aireadi.org is shared under CC-BY 4.0.
  contact_person: Aaron Lee
  notes: >-
    FAIRhub labels the license "Health Data License". Use of the dataset requires citation of the
    resources specified at https://docs.aireadi.org. The contact person recorded above is the central
    study contact, reachable at contact@aireadi.org.

ip_restrictions:
  restrictions:
    - >-
      Title to the Data, and all industrial and intellectual property rights therein, remain solely
      and exclusively with the Licensor (University of Washington) and its suppliers; the licensee
      shall not take any action inconsistent with such ownership, and any rights not expressly
      granted are reserved to the Licensor and its suppliers.
    - >-
      In response to the healthsheet question about third-party IP-based restrictions, the project
      states only that the license at https://doi.org/10.5281/zenodo.17555036 governs; no additional
      third-party IP restrictions are described.

regulatory_restrictions:
  hipaa_compliant: compliant
  other_compliance: >-
    Licensees must comply with all data security and privacy standards established by the U.S.
    National Institutes of Health under its Genomic Data Sharing (GDS) Policy, currently the "NIH
    Security Best Practices for Controlled-Access Data Subject to the NIH Genomic Data Sharing
    Policy", and with all applicable laws, regulations and restrictions relating to the distribution
    and use of the Data and Models.
  notes: >-
    The healthsheet question on export controls and other regulatory restrictions is answered only by
    reference to the license at https://doi.org/10.5281/zenodo.17555036; no export control or
    equivalent regime is named in the evidence. The public dataset is de-identified per the HIPAA Safe
    Harbor method and the FAIRhub dataset_description records deIdentHIPAA true. Requirements for the
    controlled access dataset are being developed by the AI-READI Data Access Committee; controlled
    access requires that a requesting scientist's institution complete legal and privacy use
    agreements with the AI-READI research programme.

distributions:
  - path: cardiac_ecg
    notes: >-
      Electrocardiogram data collected by a 12 lead protocol, Holter monitor, or smartwatch; modality
      directory ecg_12lead, device directory philips_tc30. 4,515 files, 302,931,703 bytes. Files
      follow the WaveForm DataBase (WFDB) standard; the directory is organized per Clinical Dataset
      Structure (CDS) v0.1.1 and includes a manifest.tsv metadata file.
  - path: clinical_data
    format: CSV
    media_type: text/csv
    notes: >-
      Clinical data collected through REDCap, including blood/urine lab values and survey data; each
      CSV file is a one-to-one mapping to an OMOP Common Data Model table. 7 files, 176,182,781
      bytes. Includes dqd_omop.json supporting analysis with the OMOP CDM Data Quality Dashboard.
  - path: environment
    notes: >-
      Data collected through the custom-built LeeLab Anura environmental sensor (modality
      environmental_sensor, device leelab_anura). 2,232 files, 55,625,676,514 bytes. Files follow the
      NASA ASCII File Format Guidelines for Earth Science Data.
  - path: retinal_flio
    notes: >-
      Fluorescence lifetime imaging ophthalmoscopy data (device heidelberg_flio). 7,969 files,
      1,069,466,876,718 bytes. Files follow the DICOM standard.
  - path: retinal_oct
    notes: >-
      Optical coherence tomography data; modality structural_oct with device directories
      heidelberg_spectralis, topcon_maestro2, topcon_triton and zeiss_cirrus. 56,478 files,
      1,317,625,293,027 bytes. Files follow the DICOM standard.
  - path: retinal_octa
    notes: >-
      Optical coherence tomography angiography data; modalities enface, flow_cube and segmentation,
      each with device directories heidelberg_spectralis, topcon_maestro2, topcon_triton and
      zeiss_cirrus. 173,721 files, 1,155,908,809,724 bytes. Files follow the DICOM standard.
  - path: retinal_photography
    notes: >-
      Retinal (fundus) photography 2D images; modalities cfp (devices icare_eidon, optomed_aurora,
      topcon_maestro2, topcon_triton), faf (device icare_eidon) and ir (devices
      heidelberg_spectralis, icare_eidon, topcon_maestro2, zeiss_cirrus). 93,921 files,
      174,381,046,406 bytes. Files follow the DICOM standard.
  - path: wearable_activity_monitor
    format: JSON
    media_type: application/json
    notes: >-
      Data from the Garmin Vivosmart 5 wearable fitness tracker, with modality directories
      heart_rate, oxygen_saturation, physical_activity, physical_activity_calorie, respiratory_rate,
      sleep and stress. 15,245 files, 38,313,536,220 bytes. Files follow the Open mHealth standard.
  - path: wearable_blood_glucose
    format: JSON
    media_type: application/json
    notes: >-
      Data from the Dexcom G6 continuous glucose monitoring device (modality
      continuous_glucose_monitoring, device dexcom_g6). 2,246 files, 4,169,006,971 bytes. Files
      follow the Open mHealth standard.
  - notes: >-
      Root-level metadata files required by the Clinical Dataset Structure (CDS) v0.1.1:
      CHANGELOG.md, dataset_description.json, dataset_structure_description.json, healthsheet.md,
      LICENSE.txt, participants.json, participants.tsv, README.md and study_description.json. The
      participants.tsv file carries the recommended train/validation/test split assignment for each
      participant.

distribution_formats:
  - notes: >-
      DICOM (application/dicom) - retinal photography, OCT, OCTA and FLIO imaging data.
    access_urls:
      - https://fairhub.io/datasets/3
  - notes: >-
      CSV (text/csv) - clinical data mapped one-to-one to OMOP CDM tables, environmental sensor data,
      and other tabular exports.
    access_urls:
      - https://fairhub.io/datasets/3
  - notes: >-
      JSON (application/json) - Open mHealth formatted wearable activity monitor and continuous
      glucose monitoring data, and CDS metadata files including dataset_description.json,
      dataset_structure_description.json, study_description.json and participants.json.
    access_urls:
      - https://fairhub.io/datasets/3
  - notes: >-
      Markdown (text/markdown) - README.md, CHANGELOG.md and healthsheet.md distributed with the
      dataset.
    access_urls:
      - https://fairhub.io/datasets/3
  - notes: >-
      WaveForm DataBase (WFDB) format - 12-lead electrocardiogram signal data in the cardiac_ecg
      directory.
    access_urls:
      - https://fairhub.io/datasets/3
  - notes: >-
      TSV - manifest.tsv files within each datatype directory and the root-level participants.tsv
      containing the recommended data splits.
    access_urls:
      - https://fairhub.io/datasets/3
  - notes: >-
      Access route: the dataset is distributed through the FAIRhub platform. Accessing it requires
      logging in through a verified ID system, agreeing to use the data only for type 2 diabetes
      related research, and agreeing to the license terms. Azure Storage access is described in the
      v3.0.0 documentation. All data files are in formats accessible with free software commonly used
      for such data types, so no specific software is required.
    access_urls:
      - https://fairhub.io/datasets/3
      - https://docs.aireadi.org/docs/3/about

distribution_dates:
  - release_dates:
      - '2024-05-03'
    notes: >-
      Version 1.0.0 released on FAIRhub, DOI 10.60775/fairhub.1; contained data from the pilot data
      collection phase covering 204 participants. The BMJ Open protocol describes this as the
      publicly accessible dataset made available in May 2024.
  - release_dates:
      - '2024-11-08'
    notes: >-
      Version 2.0.0 released on FAIRhub, DOI 10.60775/fairhub.2; 1067 participants, 2.01 TB across
      165,051 files; comprised all data collected through 31 July 2024. This version is marked on
      FAIRhub as no longer accessible.
  - release_dates:
      - '2025-11-17'
    notes: >-
      Version 3.0.0 released on FAIRhub, DOI 10.60775/fairhub.3; 2280 participants, 3.82 TB across
      356,343 files; data collected 2023-07-19 to 2025-05-01.

maintainers:
  - role: researcher
    maintainer_details: >-
      The AI-READI team supports and maintains the dataset. Questions, suggestions and feedback are
      directed to https://aireadi.org/contact; the central study contact is Aaron Lee
      (contact@aireadi.org). Contact information is also provided in the README file included with
      the dataset and in the study_description.json and dataset_description.json metadata files.
  - role: other
    maintainer_details: >-
      The dataset is hosted on FAIRhub, a cloud-based data management, curation and sharing platform
      developed for this project and running on Microsoft Azure. Microsoft's AI for Good Lab
      supported the cloud services needed for the project.

updates:
  frequency: Approximately once a year
  update_details: >-
    The dataset gets released as static versions rather than being dynamically updated. Existing
    versions will not be modified to correct labeling errors, add instances or delete instances;
    instead, new versions are released with additional instances as more study participants complete
    the study visit. Version 1.0.0 (204 participants) was released on 2024-05-03, version 2.0.0
    (1067 participants) on 2024-11-08, and version 3.0.0 (2280 participants) on 2025-11-17. Changes
    between versions are detailed in the CHANGELOG file included in the dataset and visible at
    docs.aireadi.org.
  notes: >-
    Enrollment is ongoing and future versions will include larger numbers of participants. Between
    v2.0.0 and v3.0.0 the data types remained broadly the same (15+ data types) with three additional
    imaging devices added over the year 3 data, processing moved to a mix of automated and custom
    pipelines, the Snellen visual acuity variables were dropped, and a recommended
    train/validation/test split was added.

retention_limit:
  retention_details: >-
    There are no limits on the retention of the data associated with the instances; participants were
    not told that their data would be retained only for a fixed period and then deleted.
  notes: >-
    Under the license, a licensee whose agreement terminates for breach must delete all copies of the
    Data in its possession and control and cease all use of the Data.

version_access:
  latest_version_doi: 10.60775/fairhub.3
  versions_available:
    - Version 1.0.0, DOI 10.60775/fairhub.1, released 2024-05-03
    - Version 2.0.0, DOI 10.60775/fairhub.2, released 2024-11-08
    - Version 3.0.0, DOI 10.60775/fairhub.3, released 2025-11-17
  version_details: >-
    Each version has its own DOI and its own documentation set at docs.aireadi.org, navigable from a
    version dropdown (Dataset v1.0.0, v2.0.0 and v3.0.0). Older versions are not updated; the
    healthsheet answers "N/A" to the question of continued support for older versions, on the
    grounds that new versions are released rather than existing ones updated. The FAIRhub record for
    version 2.0.0 states "This version of the dataset is no longer accessible. Please refer to the
    latest version," and the v2.0.0 documentation page carries the same notice.
  notes: >-
    A separate smaller "Mini Version" of the dataset (100 participants, DOI 10.60775/fairhub.4) is
    available for pipeline development; it is a distinct record rather than a version of this
    dataset.

extension_mechanism:
  extension_details: >-
    There is currently no mechanism for others to extend or augment the AI-READI dataset outside of
    those who are involved in the project.
  notes: >-
    The project does maintain public GitHub and Zenodo presences (https://github.com/AI-READI and
    https://zenodo.org/communities/aireadi) through which its guidelines, tooling and standards are
    shared; these are not dataset-contribution channels.

external_resources:
  - external_resources:
      - https://docs.aireadi.org
    notes: >-
      Dataset documentation, intended to complement the FAIRhub landing page and recommended reading
      before accessing the dataset. It contains the citation instructions, preliminary information on
      access and training prerequisites, the Healthsheet, per-domain documentation of clinical
      context, variables and processing, an AI-readiness section on FAIR principles and ethical
      practices, controlled variables, a changelog and additional resources. The dataset is
      self-contained but relies on this documentation for users requiring additional information
      about its provenance.
    restrictions:
      - >-
        The documentation is shared under the CC-BY 4.0 license, so there are no restrictions
        associated with its use.
  - external_resources:
      - https://aireadi.org
      - https://aireadi.org/team
      - https://aireadi.org/goals/data-sharing
      - https://aireadi.org/contact
    notes: >-
      AI-READI project website, carrying team membership and expertise, data sharing and availability
      information, and the project contact form.
  - external_resources:
      - https://github.com/AI-READI
      - https://zenodo.org/communities/aireadi
    notes: >-
      GitHub organization and Zenodo community of the AI-READI project, holding the project's
      guidelines for project management and for data collection, management and sharing.
  - external_resources:
      - https://cds-specification.readthedocs.io/en/v0.1.1/
    notes: >-
      Clinical Dataset Structure (CDS) v0.1.1 specification, a new standard developed by the project
      as a simple and intuitive way to organize clinical research datasets and include structured
      metadata; the dataset's directory layout and root metadata files follow it.
  - external_resources:
      - https://fairhub.io/
    notes: >-
      FAIRhub, the AI-READI-specific Microsoft Azure cloud-based data management, curation and
      sharing platform developed for this project, which hosts the dataset and its versions. The
      project anticipates making the platform available for future data generation projects.
  - external_resources:
      - https://commonfund.nih.gov/bridge2ai
      - https://bridge2ai.org
    notes: >-
      NIH Common Fund Bridge2AI program, of which AI-READI is one of four Data Generation Projects.
  - external_resources:
      - https://shileyeye.ucsd.edu/research/ai_readi
    notes: >-
      AI-READI year-long research internship programme, comprising a two-week data
      science/programming bootcamp followed by a yearlong curriculum of didactic lectures and
      mentored research.
  - external_resources:
      - https://doi.org/10.60775/fairhub.2
      - https://doi.org/10.60775/fairhub.1
    notes: >-
      Earlier versions of this same dataset on FAIRhub: v2.0.0 released 2024-11-08 with 1067
      participants, 2.01 TB across 165,051 files, marked no longer accessible; and v1.0.0 released
      2024-05-03 with 204 participants from the pilot data collection phase.
  - external_resources:
      - https://doi.org/10.60775/fairhub.4
    notes: >-
      A separate FAIRhub record holding a smaller "Mini Version" of the dataset (100 participants)
      provided for pipeline development. The FAIRhub API records it as the child of this dataset
      record.
  - external_resources:
      - https://doi.org/10.1136/bmjopen-2024-097449
    notes: >-
      Owsley C, Matthies DS, McGwin G, et al. Cross-sectional design and protocol for Artificial
      Intelligence Ready and Equitable Atlas for Diabetes Insights (AI-READI). BMJ Open
      2025;15:e097449. Open access under CC BY-NC 4.0. Describes the study design, protocol,
      instruments and data management underlying the dataset.
  - external_resources:
      - https://doi.org/10.1038/s42255-024-01165-x
    notes: >-
      AI-READI Consortium. AI-READI: rethinking AI data collection, preparation and sharing in
      diabetes research and beyond. Nature Metabolism 2024;6:2210-2212. Introduces the dataset, the
      blueprint for AI-ready data generation, and the workforce training programme.
  - external_resources:
      - https://doi.org/10.5281/zenodo.10642459
      - https://doi.org/10.5281/zenodo.17555036
    notes: >-
      Contreras J, et al. License terms for reusing the AI-READI dataset. Zenodo, 2024 - version 1.0
      of the custom data license, whose full text is included in the source bundle. The dataset is
      currently released under version 2.0 at https://doi.org/10.5281/zenodo.17555036.