notes: >-
  Dataset scale: 356,343 files totalling 3,815,969,779,678 bytes (3.82 TB), as recorded in the
  FAIRhub API, the FAIRhub v3 landing page and the README. Recommended data splits distributed in
  participants.tsv partition the 2280 participants 70%/15%/15% into 1576 train, 352 validation and
  352 test, with validation and test sets balanced as far as possible for sex, race/ethnicity and
  diabetes status; per-stratum counts are - train 204 Hispanic, 369 Asian, 343 Black, 660 White, 599
  male, 977 female, 600 no diabetes, 384 lifestyle-controlled, 487 oral-medication controlled, 105
  insulin controlled, mean age 61.1 +/- 11.3 years; validation 88 Hispanic, 88 Asian, 88 Black, 88
  White, 176 male, 176 female, 88 no diabetes, 88 lifestyle-controlled, 109 oral-medication
  controlled, 67 insulin controlled, mean age 60.3 +/- 10.8 years; test 88 Hispanic, 88 Asian, 88
  Black, 88 White, 176 male, 176 female, 88 no diabetes, 88 lifestyle-controlled, 90 oral-medication
  controlled, 86 insulin controlled, mean age 60.5 +/- 11.4 years. Participants were compensated 200
  USD for the study visit, paid after return of the study devices and typically at least 2 weeks
  after the visit, not prorated, funded through NIH award OT2OD032644; the study also covered
  reasonable parking, public transit or rideshare costs, though transport costs above 25 USD were
  not reimbursed. Privacy protections applied include HIPAA Safe Harbor removal of PHI, removal of
  sex, race/ethnicity and medications from the public release, a controlled-access tier gated by
  legal and privacy use agreements, a strict licence agreement, data watermarking for both public
  and controlled sets, selection of at-home monitoring devices that capture no video, audio or GPS
  location and do not sync with participant-owned devices, and storage of identifiable information
  on encrypted servers or in locked restricted-access rooms at all sites under Level 3 data
  protections; a theoretical risk of future re-identification is acknowledged. All instances are
  part of the same prospective data generation project, with currently one visit per participant;
  approximately 10% of the cohort is planned to be invited back for a Year 4 follow-up visit, with
  approximately 4% expected to undergo a follow-up examination. Further documented facts that fit no
  dedicated slot. (1) No labels or annotations were assigned to instances; the healthsheet states the
  dataset is hypothesis-agnostic and that no labeling was performed, so no labeling software,
  annotator demographics, or inter-annotator agreement exist. (2) At the time of the v3.0.0
  healthsheet the dataset had not yet been used for any tasks, and no repository links papers or
  systems that use the dataset. (3) The dataset has not undergone any formal external audit; it has
  been reviewed internally by AI-READI team members for quality checks and to ensure that no
  personally identifiable information was accidentally included. (4) Source disagreement on
  affiliation - the FAIRhub structured metadata records the lead sponsor, managing organization, and
  the affiliation of Aaron Lee and Cecilia Lee as "Washington University in St. Louis" (ROR
  01yc7t268), whereas the BMJ Open protocol, the Nature Metabolism comment, the NIH RePORTER record,
  and the IRB protocol all place these investigators and the coordinating IRB at the University of
  Washington, Seattle. (5) Source disagreement on target enrollment - the BMJ Open protocol, Nature
  Metabolism comment, NIH RePORTER abstract, and FAIRhub study description state a target of 4,000
  participants, while the University of Washington IRB protocol form states 4,600. (6) Source
  disagreement on prevalence framing - the BMJ Open protocol reports T2DM prevalence of 10.5% of the
  world's adult population; the Nature Metabolism comment states T2DM affects more than 6% of the
  world's population. (7) The superseded v2.0.0 record on FAIRhub reports 2.01 TB across 165,051
  files (DOI 10.60775/fairhub.2, released 2024-11-08) and is marked "no longer accessible". (8) NIH
  RePORTER lists project 1OT2OD032644-01 with an award amount of 5,026,499 USD for fiscal year 2022,
  project period 2022-09-01 to 2025-08-31, principal investigator LEE, AARON, organization
  UNIVERSITY OF WASHINGTON. (9) The study is registered on ClinicalTrials.gov as NCT06002048; the
  BMJ Open protocol cites approval number STUDY00016228. (10) The FAIRhub structured metadata records
  the publisher name as "FAIRhub" and a distinct managing organization with ROR
  https://ror.org/01yc7t268; the publisher slot carries the platform URI.

