purposes:
  - response: >-
      To create a flagship, ethically-sourced dataset that enables future generations of artificial
      intelligence/machine learning research to provide critical insights into type 2 diabetes
      mellitus (T2DM), including salutogenic pathways to return to health.
  - response: >-
      To collect and publicly share a multimodal, AI-ready dataset for studying the pathogenesis and
      salutogenesis (the pathway from disease to health) of T2DM.
  - response: >-
      To develop a foundational dataset in T2DM, agnostic to existing classification criteria or
      biases, that can be used to reconstruct a temporal atlas of T2DM development and reversal
      towards health.
  - response: >-
      To establish standards, best practices and guidelines for the collection, preparation and
      sharing of data for the purposes of AI/ML, including guidance from bioethicists, that can serve
      as a blueprint for future data generation projects.
  - response: >-
      To increase access to and quality of AI/ML research by recruiting and training personnel,
      including a year-long research internship programme at the intersection of biomedicine and AI.

addressing_gaps:
  - response: >-
      A major barrier to AI in healthcare research has been the lack of diverse datasets that are AI
      ready for training AI models; the AI-READI dataset is intended to fill this gap.
  - response: >-
      The ability to understand and affect the course of complex, multi-organ diseases such as T2DM
      has been limited by a lack of well-designed, high quality, large, and inclusive multimodal
      datasets.
  - response: >-
      Existing data sources such as claims or electronic health records data do not support the
      downstream AI/ML analyses enabled by a purpose-built multi-domain acquisition protocol.
  - response: >-
      Past research studies under-represent groups that bear a higher burden of disease; a
      meta-epidemiological review of T2DM studies published from 2000 to 2020 indicated that samples
      lacked racial and ethnic diversity. The balanced AI-READI cohort is an intended step forward in
      addressing these demographic inequities.
  - response: >-
      Concerns regarding bias and inequity in AI have been partially attributed to the lack of
      diversity in the AI workforce, in particular the under-representation of women and racial and
      ethnic minority groups.

tasks:
  - response: >-
      Downstream pseudotime manifold analysis - an approach used to predict disease trajectories by
      collecting and learning from complex, multimodal data from participants with differing disease
      severity (normal to insulin-dependent T2DM).
  - response: >-
      AI/ML research into T2DM salutogenesis, the pathway from disease back to health.
  - response: >-
      Multimodal AI model development for understanding the complex, multifactorial nature of T2DM.
  - response: >-
      Training, validation and testing of AI/ML models using the recommended 70%/15%/15% participant
      split supplied in participants.tsv.

instances:
  - instance_type: Individual patient/participant
    counts: 2280
    data_substrate: >-
      Tabular survey and clinical data; Medical imaging data; Physiological signal/waveform data;
      Wearable and environmental sensor time series
    data_topic: >-
      Type 2 diabetes mellitus; Retinal and ophthalmic health; Cardiac electrophysiology; Glucose
      regulation; Physical activity and sleep; Indoor environmental exposure; Social determinants of
      health
    missing_information:
      - Not all modalities are available for all participants.
      - Some participants elected not to participate in some study elements.
      - >-
        In a few cases the data collection device did not have any stored results or was returned
        too late to retrieve the results (e.g. battery died, data was lost).
      - >-
        In a few cases there may have been a data collision at some point in the process and data
        has been lost.
    notes: >-
      Each instance represents an individual patient and consists of all of the data available for
      that individual. There is no unstructured text data in the dataset. Version 1.0.0 contained 204
      instances and version 2.0.0 contained 1067 instances.

subpopulations:
  - subpopulation_elements_present: false
    identification: >-
      The healthsheet states that the dataset does not identify any demographic sub-populations. Sex,
      race and ethnicity are held under controlled access and are not released with the public
      dataset; medication information is likewise removed from the public set.
    distribution: >-
      The README nevertheless reports the composition of the recommended split across the 2280
      participants: race/ethnicity totals of 380 Hispanic, 545 Asian, 519 Black, 836 White; sex
      totals of 951 male and 1329 female; diabetes status totals of 776 no diabetes, 560
      lifestyle-controlled, 686 oral-medication controlled, 258 insulin controlled; mean age 60.8
      +/- 11.3 years.
    notes: >-
      Because demographic labels are unavailable in the public release, the project instead supplies
      a training/validation/testing split designed to reduce disparities in models developed using
      the dataset.

acquisition_methods:
  - acquisition_details: >-
      Directly observable data: laboratory values from blood and urine, vitals, physical
      measurements, visual function testing, monofilament testing, cognitive screening, 12-lead ECG,
      retinal imaging, and readings from at-home continuous glucose, activity and environmental
      monitoring devices.
    was_directly_observed: true
  - acquisition_details: >-
      Subject-reported data: responses to pre-visit and on-site questionnaires covering demographics,
      depressive symptoms (CES-D-10), diabetes distress (PAID-5), diabetes self-care, diet, smoking,
      alcohol, vaping and marijuana use, general health history, social determinants of health,
      ophthalmic history, and current medications.
    was_reported_by_subjects: true
    was_validated_verified: true
    notes: >-
      Verification of data entry was performed when possible, for example cross-referencing entered
      medications with medications that were physically brought in or photographed by each study
      participant.
  - acquisition_details: >-
      Data abstracted from other sources: electronic health records at the three health systems used
      for eligibility screening and for medical, surgical, ophthalmic, laboratory and imaging
      history; and motor vehicle driving and accident records obtained from the Department of
      Licensing. These variables are held under controlled access and are not part of the public
      release.
    was_directly_observed: false

collection_mechanisms:
  - mechanism_details: >-
      REDCap is used for collecting patient-reported data from questionnaires and the following
      clinical data from the visit: medications assessment, vitals, visual acuity, contrast
      sensitivity, monofilament test results and complete blood count test results. REDCap also hosts
      the recruitment interface, screening survey and electronic consent.
  - mechanism_details: >-
      Philips PageWriter TC30 Cardiograph (Philips, Amsterdam, The Netherlands) for the 12-lead ECG;
      data exported in .xml to local storage.
  - mechanism_details: >-
      Dexcom G6 Continuous Glucose Monitor (Dexcom, Inc., San Diego, California) applied to the
      abdomen and worn for 10 days; blood glucose measurements in mg/dL every 5 minutes, exported as
      .csv.
  - mechanism_details: >-
      Garmin Vivosmart 5 physical activity monitor (Garmin Ltd, Schaffhausen, Switzerland) worn for
      10 days; exported in .FIT file format and converted to the mHealth standard for the dataset.
      Variables include steps, heart rate, sleep duration, oxygen saturation, respiration rate,
      activity type, calories and stress level.
  - mechanism_details: >-
      Custom-designed LeeLab Anura environmental sensor built at the Karalis Johnson Retina Center,
      University of Washington (Seattle, Washington), placed in the home for 10 days; exported as
      .csv. Variables include ambient temperature, relative humidity, nitrogen oxides, volatile
      organic compounds, particulate matter (PM1.0, PM2.5, PM4, PM10) and 11 multi-spectral light
      intensity measurements.
    notes: >-
      The environmental sensor and the Garmin fitness tracker were specifically chosen with
      participant privacy as a primary concern: these devices do not capture video or audio, are not
      equipped with GPS location monitoring, and are not synced with participant-owned devices.
  - mechanism_details: >-
      Optomed Aurora IQ handheld fundus camera (Optomed, Oulu, Finland) for undilated macula- and
      disc-centred colour fundus photography; 4 images per participant, DICOM.
  - mechanism_details: >-
      iCare EIDON widefield truecolor confocal fundus system (iCare USA, Inc, Raleigh, North
      Carolina) for ultra-wide field central, nasal and temporal CFP, central IR, central FAF and a
      mosaic of ultra-wide field images; 12 images per participant, DICOM.
  - mechanism_details: >-
      Heidelberg Spectralis HRA OCT and OCTA (Heidelberg Engineering GmbH, Heidelberg, Germany) for
      Optic Nerve Head-Radial Circle-High Resolution OCT, Posterior Pole Macula-HR-61 lines OCT and
      Macula 20x20-HS-512 lines OCTA; 6 images per participant, DICOM.
  - mechanism_details: >-
      Heidelberg Fluorescence Lifetime Imaging Ophthalmoscopy (Heidelberg Engineering GmbH) for
      macula-centred FLIO; 2 images per participant, exported in .sdt file format and converted to
      DICOM for the dataset.
  - mechanism_details: >-
      Topcon Maestro2 3D OCT-1 (Topcon Healthcare, Itabashi-ku, Tokyo, Japan) for 3D Wide (H)
      12x9-512x128 OCT, 3D Macula 6x6-512x128 OCT and Macula 6x6-360x360 OCTA; 6 images per
      participant, exported in .fda file format and converted to DICOM for the dataset.
  - mechanism_details: >-
      Topcon Triton DRI OCT (Topcon Healthcare, Itabashi-ku, Tokyo, Japan) for 3D(H)+Rad 12x9-512x256
      OCT, Macula 6x6-320x320 OCTA and Macula 12x12-512x512 OCTA; 6 images per participant, exported
      in .fda file format and converted to DICOM for the dataset.
  - mechanism_details: >-
      Zeiss Cirrus 5000 Angioplex (Carl Zeiss Meditec AG, Jena, Germany) for Disc Cube 200x200 OCT,
      Macula Cube 512x128 OCT, Macula 6x6 OCTA and Disc 6x6 OCTA; 8 images per participant, DICOM.
  - mechanism_details: >-
      M&S Technologies Electronic Visual Acuity tester (Niles, Illinois) for photopic and mesopic
      best-corrected letter visual acuity at 4 metres on a 12x20 inch touch-screen monitor; a 2.0
      neutral density filter or ND-occluder is used for mesopic conditions.
  - mechanism_details: >-
      Mars Letter Contrast Sensitivity chart (Mars Perceptrix, Chappaqua, New York) read monocularly
      at approximately 50 cm (range 40-59 cm), background luminance 60-120 cd/m2 (optimal 85),
      illuminance 189-377 lux (optimal 267), under photopic and mesopic conditions, undilated.
  - mechanism_details: >-
      Topcon KR 800 auto keratometer/refractor (Topcon Healthcare, Oakland, New Jersey) for
      autorefraction of each eye. Lensometers used across sites were the NIDEK LM-600P, Topcon CL-200
      and Topcon CL-300.
  - mechanism_details: >-
      Automatic oscillometric medically approved blood pressure devices: OMRON HEM 907XL, Medline
      MDS4001 Automatic Digital Blood Pressure Monitor, and Welch Allyn 6000 series Vital signs
      monitor with Welch Allyn FlexiPort Reusable Blood Pressure Cuff.
  - mechanism_details: >-
      MoCA Duo Application (MoCA Cognition, Quebec, Canada) administered on an iPad for the Montreal
      Cognitive Assessment; captures participant responses interactively and exports as .csv, with
      total score, section subscores, Memory Index Score and task completion times.
  - mechanism_details: >-
      Standard 10 g monofilament applied to three locations on the plantar surface of each foot, 10
      times per location, for peripheral neuropathy assessment.
  - mechanism_details: >-
      Blood (53 mL, non-fasting) and urine specimen collection during the study encounter using EDTA
      vacutainers, serum separator vacutainers, CPT mononuclear cell preparation tubes, PAXgene RNA
      vacutainers and a urine collection kit; complete blood count analysis at a local CLIA-certified
      lab and all other assays at the University of Washington Nutrition and Obesity Research Center
      (NORC), with results provided in .csv.

