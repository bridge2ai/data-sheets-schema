notes: >-
  Additional documented facts that fit no dedicated slot. (1) No labels or annotations were assigned
  to instances; the healthsheet states the dataset is hypothesis-agnostic and that no labeling was
  performed, so no labeling software, annotator demographics, or inter-annotator agreement exist.
  (2) At the time of the v3.0.0 healthsheet the dataset had not yet been used for any tasks, and no
  repository links papers or systems that use the dataset. (3) The dataset has not undergone any
  formal external audit; it has been reviewed internally by AI-READI team members for quality checks
  and to ensure that no personally identifiable information was accidentally included. (4) Source
  disagreement on affiliation - the FAIRhub structured metadata records the lead sponsor, managing
  organization (ROR https://ror.org/01yc7t268), and the affiliation of Aaron Lee and Cecilia Lee as
  "Washington University in St. Louis", whereas the BMJ Open protocol, the Nature Metabolism comment,
  the NIH RePORTER record, and the IRB protocol all place these investigators and the coordinating
  IRB at the University of Washington, Seattle. The managing organization and its ROR identifier are
  recorded here because no dedicated slot captures them. (5) Source disagreement on target enrollment
  - the BMJ Open protocol, Nature Metabolism comment, NIH RePORTER abstract, and FAIRhub study
  description state a target of 4,000 participants, while the University of Washington IRB protocol
  form states 4,600. (6) Source disagreement on prevalence framing - the BMJ Open protocol reports
  T2DM prevalence of 10.5% of the world's adult population; the Nature Metabolism comment states T2DM
  affects more than 6% of the world's population. (7) The superseded v2.0.0 record on FAIRhub reports
  2.01 TB across 165,051 files (DOI 10.60775/fairhub.2, released 2024-11-08) and is marked "no longer
  accessible". (8) NIH RePORTER lists project 1OT2OD032644-01 with an award amount of 5,026,499 USD
  for fiscal year 2022, project period 2022-09-01 to 2025-08-31, principal investigator LEE, AARON,
  organization UNIVERSITY OF WASHINGTON. (9) The study is registered on ClinicalTrials.gov as
  NCT06002048; the BMJ Open protocol cites approval number STUDY00016228. (10) The FAIRhub structured
  metadata records the publisher name as "FAIRhub"; the publisher slot carries the platform URI.

