splits:
  - split_details: >-
      The current version of the dataset comes with recommended data splits. Because sex, race and
      ethnicity data are not released with the public version of the dataset, the project team
      prepared data splits into proportions of 70%/15%/15% (1576 train / 352 validation / 352 test)
      for subsequent training/validation/testing, where the validation and test sets are balanced as
      well as possible for sex, race/ethnicity and diabetes status (no diabetes,
      prediabetes/lifestyle controlled, oral medication controlled, and insulin controlled).
    notes: >-
      The suggested split is included in the participants.tsv file distributed with the dataset. The
      split is new in version 3.0.0; the rationale is to reduce disparities in models developed using
      this dataset when demographic labels are unavailable to users.

