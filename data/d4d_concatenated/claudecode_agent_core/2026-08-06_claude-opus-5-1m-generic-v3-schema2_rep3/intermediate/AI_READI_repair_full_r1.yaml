id: https://doi.org/10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: >-
  This dataset contains data from 2280 participants that was collected between July 19, 2023 and
  May 01, 2025. Data from multiple modalities are included. The data in this dataset contain no
  protected health information (PHI). Information related to the sex and race/ethnicity of the
  participants as well as medication used has also been removed. The AI-READI dataset consists of
  data collected from individuals with and without Type 2 Diabetes Mellitus (T2DM) and harmonized
  across 3 data collection sites; its composition was designed with future studies using AI/Machine
  Learning in mind, including recruitment sampling procedures aimed at achieving approximately equal
  distribution of participants across diabetes severity and a data acquisition protocol across
  multiple domains (survey data, physical measurements, clinical data, imaging data, wearable device
  data).
