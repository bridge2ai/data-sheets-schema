other_tasks:
  - task_details: >-
      Trainees develop and present novel use cases suitable for application within Bridge2AI data
      topics, including generative AI use cases, and prepare posters, conference abstracts and
      manuscripts based on work with the dataset.
  - task_details: >-
      Serving as a substrate for methodological work on data standards, semantic mapping and
      multi-modal harmonization across EHR, waveform, imaging and text data.

future_use_impacts:
  - impact_details: >-
      Data are transformed using approaches that limit re-identification and community-facing ethics
      focus groups determine what data are appropriate for public sharing, so that future use promotes
      privacy, accountability and clinical benefit.
  - impact_details: >-
      Patient-focused ethical and legal approaches to managing privacy and bias, accounting for social
      determinants of health, are intended to reduce the risk that downstream models built on the
      dataset propagate inequity.
  - impact_details: >-
      By sequestering holdout data for external validation, the project intends to influence
      marketplace adoption and implementation of AI models in acute and critical care.

