resources:
  - id: https://chorus4ai.org/dataset/demographics
    name: Demographics
    description: Patient demographic data from contributing hospitals.
    conforms_to: OMOP Common Data Model
    notes: Controlled access; metadata published against the OMOP schema.
  - id: https://chorus4ai.org/dataset/medication-administration
    name: Medication administration
    description: >-
      Medication administration records, with dosing time-stamped upon each infusion change or dose
      administration.
    conforms_to: OMOP Common Data Model
    notes: Controlled access; metadata published against the OMOP schema.
  - id: https://chorus4ai.org/dataset/procedures
    name: Procedures
    description: Procedure records documented by providers.
    conforms_to: OMOP Common Data Model
    notes: Controlled access; metadata published against the OMOP schema.
  - id: https://chorus4ai.org/dataset/nursing-flowsheets
    name: Nursing flowsheets
    description: High-frequency nursing flowsheet documentation.
    conforms_to: OMOP Common Data Model with extensions
    notes: Controlled access; metadata published against the OMOP schema with extensions.
  - id: https://chorus4ai.org/dataset/diagnoses
    name: Diagnoses
    description: Diagnosis records documented by providers.
    conforms_to: OMOP Common Data Model
    notes: Controlled access; metadata published against the OMOP schema.
  - id: https://chorus4ai.org/dataset/clinical-notes
    name: Clinical notes
    description: >-
      Clinical notes extracted and tokenized using the OHNLP toolkit; note text is stored locally at
      contributing sites and only tokens are shared.
    conforms_to: OHNLP open-source schema
    notes: Controlled access; published metadata schema planned.
  - id: https://chorus4ai.org/dataset/imaging
    name: Imaging
    description: Medical imaging studies drawn from hospital PACS archives.
    conforms_to: DICOM
    notes: >-
      Controlled access; published metadata schema planned. 1,000 images currently available, with
      de-identification in process for a larger cohort; 7,642 admissions carry radiology data in the
      released dataset.
  - id: https://chorus4ai.org/dataset/waveform-telemetry
    name: Waveform telemetry
    description: >-
      Physiological waveform telemetry captured from bedside monitors via gateway/middleware systems.
    conforms_to: WFDB (PhysioNet schema, extended)
    notes: >-
      Controlled access; metadata available. The released dataset includes 23 Tb of waveform data;
      telemetry is held in the CHoRUS cloud enclave.
  - id: https://chorus4ai.org/dataset/waveform-eeg
    name: Waveform EEG
    description: EEG waveforms extracted from hospital EEG databases.
    conforms_to: EDF+ and Persyst open-source schemas
    notes: Controlled access; published metadata schema planned; extraction in process.