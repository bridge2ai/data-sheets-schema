id: https://chorus4ai.org/
name: CHoRUS
title: "Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  CHoRUS is a multi-center, multimodal, high-resolution, controlled-access critical care dataset
  produced by the Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for
  Equitable AI project, one of four data generation projects in the NIH-funded Bridge2AI consortium.
  The dataset is assembled retrospectively from 14 data-contributing hospitals within a collaboration
  spanning 20 academic centers, and harmonizes structured electronic health record data, tokenized
  unstructured clinical notes, medical imaging, waveform telemetry, EEG waveforms, and social
  determinants of health under unified standards, with structured data standardized to the OMOP
  Common Data Model. The stated goal is the most diverse, high-resolution, ethically sourced,
  AI-ready dataset for the grand challenge of improving recovery from acute illness, supporting
  models that characterize acute and critical care illness, predict complications, and measure
  treatment response. The currently released dataset comprises 50,000 patient admissions from ICU,
  PICU and NICU settings, 1.6 billion rows of EHR OMOP data, 7,642 admissions with radiology data,
  and 23 Tb of waveform data; the anticipated final dataset comprises 100,000 patient admissions
  across 9 data modalities. A sequestered holdout test set is provisioned for external validation
  of models.
page: https://chorus4ai.org/
status: >-
  Partially released and actively growing. A controlled-access released dataset exists as of August
  2025; imaging de-identification and EEG extraction are still in process, and the anticipated final
  dataset is larger than the current release. The supporting NIH award period runs from 2022-09-01
  to 2026-11-30.
created_by: >-
  CHoRUS consortium (Bridge2AI data generation project), awardee organization Massachusetts General
  Hospital
was_derived_from: >-
  Clinical source systems at 14 contributing hospitals: electronic health record systems, PACS
  imaging archives, bedside monitor and gateway/middleware telemetry systems, and hospital EEG
  databases.
conforms_to: OMOP Common Data Model (OHDSI)
keywords:
  - critical care
  - acute illness
  - intensive care unit
  - artificial intelligence
  - machine learning
  - AI-ready dataset
  - electronic health record
  - OMOP Common Data Model
  - waveform telemetry
  - electroencephalography
  - medical imaging
  - clinical notes
  - social determinants of health
  - data standards
  - equitable AI
  - Bridge2AI
  - multimodal data
  - treatment response
notes: >-
  The CHoRUS project is organized around three pillars: Data (standards, tool development and
  optimization, and data acquisition), Ethics (ethical and trustworthy AI), and People (team science,
  skill and workforce development). The consortium comprises more than 60 members across 20 different
  institutions, 14 of which act as data acquisition centers. As of the 2025-11-14 capture of the
  CHoRUS project website, a banner reads "This repoitory is under review for potential modification
  in compliance with Administration directives." The sources report different admission counts for
  the same period: the September 2025 Bridge2AI for Clinical Care webinar states that as of August
  2025 the dataset covers 14 different hospitals with over 45,000 unique admissions, while the
  project website dataset snapshot lists 50,000 patient admissions in the current released dataset.
  The NIH RePORTER abstract refers to acquiring an AI-ready dataset from more than 100,000 critically
  ill patients, consistent with the website's anticipated final dataset of 100,000 patient admissions.
  The dataset also provisions a sequestered holdout test set, split off from the assembled cohort and
  accessible for external validation of models, to aid marketplace adoption of AI-developed models
  for implementation in acute and critical care. It is shared with third parties outside the
  data-generating consortium under controlled access: up to 30 selected trainees in cohort 2 of the
  AIM-AHEAD Bridge2AI for Clinical Care Training Program receive dataset access after registration
  and signing a licensing agreement, and the holdout set is made available for external validation.
  Data are not collected directly from patients; they are obtained retrospectively from hospital
  clinical systems at contributing institutions.

