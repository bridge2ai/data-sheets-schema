extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: >-
    Contributions are coordinated through the CHoRUS GitHub organization. Data site managers begin at
    the Chorus_SOP page, which provides an interactive workflow diagram with dynamic links to validated
    SOP documents for extracting and contributing clinical data, and post submission issues to the
    Standards or Data Acquisition discussion boards. Clinical collaborators contribute semantic
    mappings through the chorus-mapping repository, which holds documentation and pooled tabular
    mappings together with a clinical validation SOP. Software developers use the chorus-developer web
    guide for contributing to and using CHoRUS software packages. Project managers aggregate issues
    across repositories into a central task management GitHub project, and contributing sites submit
    status updates either through the GitHub interface or via a Google Form whose submissions trigger
    a GoogleScript that updates GitHub issues and statuses through the API.

updates:
  update_details: >-
    Data-contributing sites provide regular status updates on their progress in creating and curating
    CHoRUS-specific clinical data extracts, with statuses tracked in the Standards Project and the
    Data Acquisition Project on GitHub. The dataset is growing from its current release toward an
    anticipated final dataset of 100,000 patient admissions across 9 modalities from 14 hospitals;
    imaging de-identification for a larger cohort and EEG extraction are in process, and published
    metadata schemas are planned for clinical notes, imaging and EEG.

