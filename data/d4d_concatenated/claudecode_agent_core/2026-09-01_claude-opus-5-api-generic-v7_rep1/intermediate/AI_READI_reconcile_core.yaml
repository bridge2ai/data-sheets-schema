purposes:
- response: To create and publicly share a flagship, ethically sourced, multimodal dataset
    optimized for artificial intelligence and machine learning research into type 2 diabetes
    mellitus, including salutogenic pathways back to health.
- response: To develop a foundational dataset in type 2 diabetes that is agnostic to existing
    classification criteria or biases and that can be used to reconstruct a temporal atlas
    of T2DM development and reversal towards health.
- response: To create a model and blueprint for developing large, scalable, AI-ready clinical
    datasets, including guidelines for project management, data collection, management and
    sharing that future Data Generation Projects can follow.
- response: To increase access to and quality of AI/ML research by recruiting and training
    personnel, including a year-long research internship programme at the intersection of
    biomedicine and AI.
tasks:
- response: 'Downstream pseudotime manifold analysis: an approach used to predict disease
    trajectories by learning from complex, multimodal data collected from participants with
    differing disease severity, from normal through to insulin-dependent T2DM.'
- response: Development of artificial intelligence and machine learning models on balanced
    multimodal type 2 diabetes data, including multimodal model development.
addressing_gaps:
- response: The ability to understand and affect the course of complex, multi-organ diseases
    such as type 2 diabetes has been limited by a lack of well-designed, high quality, large
    and inclusive multimodal datasets. A major barrier to AI in this area has been the lack
    of diverse datasets that are AI ready for training models; the AI-READI dataset is intended
    to fill that gap.
- response: A meta-epidemiological review of type 2 diabetes studies published from 2000 to
    2020 found that samples lacked racial and ethnic diversity. AI-READI recruits four race/ethnic
    groups in approximately equal proportions rather than targeting the demographic distribution
    of the US population, as an intentional step towards addressing that gap.
- response: Existing data sources such as claims data or electronic health records do not
    support the downstream AI/ML analyses the project targets; the acquisition protocol was
    designed across multiple domains (survey, physical measurement, clinical, imaging, wearable
    device) to enable analyses that are not feasible with those sources.
