maintainers:
- role: academic_institution
  maintainer_details: The AI-READI team supports and maintains the dataset. Contact for questions,
    suggestions or feedback is through https://aireadi.org/contact, and the README file included
    with the dataset carries contact information; the FAIRhub study record gives contact@aireadi.org
    as the central contact address, naming Aaron Lee as central contact.
- role: other
  maintainer_details: The dataset is hosted on FAIRhub, a cloud-based data management, curation
    and sharing platform developed for this project on Microsoft Azure; the Microsoft AI for
    Good Lab is acknowledged for supporting the cloud services needed for the project.
updates:
  frequency: approximately annually
  update_details: The dataset is not updated in place. New static versions are released with
    additional instances as more study participants complete the study visit, approximately
    once a year, with additional data from participants enrolled since the last version release.
    Changes between versions are described in the CHANGELOG file included in the dataset and
    visible at docs.aireadi.org. Further versions are expected, since enrolment is ongoing.
retention_limit:
  retention_details: There are no limits on the retention of the data associated with the
    instances; participants were not told that their data would be retained only for a fixed
    period and then deleted.
version_access:
  latest_version_doi: doi:10.60775/fairhub.3
  versions_available:
  - 1.0.0 — DOI 10.60775/fairhub.1, released 3 May 2024, 204 participants (pilot phase)
  - 2.0.0 — DOI 10.60775/fairhub.2, released 8 November 2024, 1,067 participants; no longer
    accessible
  - 3.0.0 — DOI 10.60775/fairhub.3, released 17 November 2025, 2,280 participants
  version_details: 'Each version of the dataset has a matching version of the documentation
    at docs.aireadi.org, navigable from a dropdown, and a matching healthsheet: the version
    1.0.0 healthsheet is at https://docs.aireadi.org/docs/1/dataset/healthsheet and the version
    2.0.0 healthsheet at https://docs.aireadi.org/docs/2/dataset/healthsheet. The maintenance
    section of the healthsheet records that older versions will not continue to be supported,
    since new versions are released rather than the dataset being updated; the FAIRhub landing
    page for version 2.0.0 states that that version is no longer accessible. A smaller mini
    version of version 3.0.0 is available for pipeline development.'
ethical_reviews:
- reviewing_organization: University of Washington Institutional Review Board, Human Subjects
    Division
  review_details: The study was approved under IRB protocol STUDY00016228. The initial approval
    at the University of Washington was received on 20 December 2022, and the initial approval
    letter is published with the version 3.0.0 documentation. Reliance agreements are in place
    with the IRBs of the University of Alabama at Birmingham and the University of California,
    San Diego. An annual renewal application to the IRB reporting the status and progress
    of the study is required and is due within 90 days of expiration.
  source_caveats: The RO-Crate metadata names the reviewing body "Washington University IRB"
    while giving a University of Washington Human Subjects Division postal address in Seattle
    and the contact hsdrely@uw.edu; the BMJ Open protocol and NIH RePORTER both identify the
    reviewing body as the University of Washington IRB.
- review_details: The RO-Crate metadata records ethical review of the dataset by Camille Nebeker,
    Debra Mathews, Kadija Ferryman and Nicholas Evans. Ethical, legal and social implications
    are stated to be considered at every stage of the project cycle, with guidance from bioethicists,
    and the project reviewed existing documentation approaches such as datasheets and healthsheets
    to identify the most suitable one for biomedical data.
- review_details: A Community Advisory Board of eleven people drawn from the three sites,
    including diversity in race and ethnicity as represented in the AI-READI sample, contributes
    to the development of the protocol and evaluates the consent forms and research protocols,
    with its feedback considered in protocol and IRB modifications.
human_subject_research:
  involves_human_subjects: true
  irb_approval:
  - IRB protocol STUDY00016228, initially approved by the University of Washington IRB on
    20 December 2022; the FAIRhub study record gives the human subject review status as "Submitted,
    approved".
  ethics_review_board: University of Washington Human Subjects Division IRB Reliance Team
    (hsdrely@uw.edu), with reliance agreements covering the University of Alabama at Birmingham
    and the University of California, San Diego.
  regulatory_compliance:
  - The study is recorded as not FDA-regulated for either drug or device and as having no
    Data Monitoring Committee. The public release is de-identified under the HIPAA Privacy
    Rule Safe Harbor method. Licensees must comply with the data security and privacy standards
    established by the NIH under its Genomic Data Sharing Policy. The study is registered
    on ClinicalTrials.gov as NCT06002048.
  special_populations:
  - No protected population is targeted. Eligibility is restricted to adults aged 40 years
    and older, with a maximum age of 85 years recorded in the study eligibility module.
informed_consent:
- consent_obtained: true
  consent_type: Written informed consent, obtained for most participants remotely as electronic
    consent through REDCap by computer, tablet or smart phone, and otherwise in person at
    the start of the visit.
  consent_scope: Consent covers the full study protocol, placement of the resulting data in
    an open-source repository, and the sending of biospecimens to the study sample repository
    for use in future research. The dataset record classifies the consent as "ConsentSpecifiedNotElsewhereCategorised"
    and notes that the public version of the dataset may only be used for type 2 diabetes
    related research while a private version allows more generic use.
  consent_documentation: The University of Washington consent form used for the study is distributed
    with the version 3.0.0 documentation as a PDF.
  withdrawal_mechanism: Participants were permitted to withdraw consent at any time and cease
    study participation; any data that had been shared or used up to that point would remain
    in the dataset, and this is clearly communicated in the consent document.
  notes: The consent form was reviewed by a community advisory board, and a table was added
    at the beginning of the form clarifying which information would be publicly available
    and which would require an application and approval process.
at_risk_populations:
  at_risk_groups_included: false
  special_protections:
  - 'Minors are not enrolled: the study enrols only adults aged 40 and older. Pregnancy and
    gestational diabetes are exclusion criteria, so pregnant people are not enrolled. Prisoners
    are not a target population. Transportation assistance through rideshare services was
    offered to participants who reported barriers to reaching study visits.'
license_and_use_terms:
  license_terms: The AI-READI custom data license version 2.0, published at https://doi.org/10.5281/zenodo.17555036
    and naming Washington University in St. Louis as Licensor. The license grants a non-exclusive,
    non-transferable license to download, reproduce and use the data and to create derivative
    works for research, commercial and non-commercial purposes, subject to strong requirements
    around data usage, security and secondary sharing intended to protect study participants,
    especially where data are reused for AI and ML applications. Storage is restricted to
    servers and devices maintained by and located within the licensee's institution, or to
    cloud or remote storage and backup services that have a HIPAA-approved Business Associate
    Agreement in place with that institution. Derivative data, including synthetic data created
    from the data, are treated as data subject to all the same restrictions. Licensees must
    acknowledge the licensor and the source and any funder of the data in any papers reporting
    use of the data, and must comply with the NIH Genomic Data Sharing Policy security best
    practices. The agreement terminates automatically upon any breach, after which the licensee
    must delete all copies and cease all use. The data are provided on an "as is" basis without
    warranty of any kind, and the licensor's aggregate liability is capped at one US dollar
    except where applicable law prohibits such limitation.
  data_use_permission: disease_specific_research
  notes: The license distinguishes between a licensee entering the agreement in an individual
    capacity, in which case no other person is authorized to access or use the data, and a
    licensee entering on behalf of an officially recognized internal group, lab or business
    unit, in which case legal members of that Authorized Group may be sublicensed and the
    licensee is fully liable for their acts and omissions. An individual's status as an Authorized
    User terminates automatically upon severance of their relationship with the group or institution.
ip_restrictions:
  restrictions:
  - Title to the data, and all industrial and intellectual property rights in it, remain solely
    and exclusively with the licensor and its suppliers at all times; any rights not expressly
    granted are reserved, and licensees must take no action inconsistent with that ownership.
    Licensees agree to indemnify, defend and hold harmless the licensor and its suppliers
    against claims arising from the licensee's use of the data or from any use, distribution
    or activity of a model, including claims of infringement of patent, copyright or other
    intellectual or industrial property rights. Publishers and conference organizers wishing
    to reproduce larger amounts of data must obtain a separate license from the licensor.
  notes: The dataset documentation at docs.aireadi.org is shared under the CC-BY 4.0 license,
    so there are no restrictions associated with its use.
regulatory_restrictions:
  confidentiality_level: restricted
  hipaa_compliant: compliant
  regulatory_restrictions:
  - The healthsheet answers the question of export controls and other regulatory restrictions
    by referring to the license at https://doi.org/10.5281/zenodo.17555036. Licensees must
    comply with all data security and privacy standards established by the US National Institutes
    of Health under its Genomic Data Sharing Policy, the current version of which is the NIH
    Security Best Practices for Controlled-Access Data Subject to the NIH GDS Policy, and
    with all applicable laws, regulations and restrictions relating to the distribution and
    use of the data and models.
  other_compliance: The FAIRhub study record states the study is not an FDA-regulated drug
    study and not an FDA-regulated device study, and the RO-Crate metadata records fdaRegulated
    as false.
  source_caveats: 'The confidentiality_level value "restricted" is this record''s mapping
    of what the sources state onto the schema enum: the RO-Crate gives confidentialityLevel
    as "HL7:2N (normal)" and the FAIRhub dataset description gives accessType as "PublicDownloadSelfAttestationRequired",
    meaning the data are publicly downloadable but only after identity verification, a use
    attestation and acceptance of restrictive license terms. Neither source states an enum-equivalent
    term directly.'
data_governance:
  committee_name: AI-READI Consortium
  accountable_organization:
    id: ROR:01yc7t268
    name: Washington University in St. Louis
  access_review_process: 'Accessing the dataset requires several steps: logging in through
    a verified ID system; agreeing to use the data only for type 2 diabetes related research;
    and agreeing to the license terms, which set restrictions and obligations for data usage.
    The access route for version 3.0.0 is the FAIRhub access page at https://fairhub.io/datasets/3/access.
    Deidentified data are released approximately yearly in two sets, a controlled access set
    and a publicly accessible set with fewer requirements for access. The controlled access
    set contains all data available in the public set plus more sensitive data, and is available
    only to scientists whose institutions have completed legal and privacy use agreements
    with the AI-READI research programme. The requirements for the controlled access sets
    were still being developed by the Data Access Committee at the time of the protocol publication.'
  stewardship_roles:
  - The Data Manager at each data site is responsible for the quality control of all data
    before uploading to FAIRhub. The site principal investigator reviews and approves any
    editing of data values and decides whether uncorrectable values should be removed. Biobanked
    biospecimens held at the UAB Center for Clinical and Translational Science will be made
    available to scientists according to procedures and policies that were in development
    at the time of the protocol publication.
  source_caveats: The RO-Crate metadata (tier 1) records the dataGovernanceCommittee as "AI-READI
    Consortium" and that value is used here; the BMJ Open protocol publication (tier 3) refers
    instead to a "Data Access Committee" that was developing the requirements for controlled
    access datasets, without giving it a fuller name. On the accountable organization, the
    FAIRhub dataset description names Washington University in St. Louis as the managing organization
    and the FAIRhub study description names it as the lead sponsor, with ROR 01yc7t268; NIH
    RePORTER records the awardee organization as the University of Washington and the BMJ
    Open protocol places the IRB and the principal investigator at the University of Washington.
    The tier 1 FAIRhub value is recorded here.
is_deidentified:
  identifiable_elements_present: false
  method: The dataset description records the de-identification type as "NoDeIdentification"
    with the explanation that no identifiers were collected, so no active de-identification
    was necessary, but that the team checked that no identifiable data per US HIPAA were present
    in the data. Direct identifier removal and HIPAA compliance are both flagged true; date
    shifting, non-arrangement and k-anonymity were not applied.
  identifiers_removed: Protected Health Information as defined by the HIPAA Privacy Rule;
    information related to the sex and race/ethnicity of participants; medications used. Five-digit
    zip code, sex, race, ethnicity, genetic sequencing data, past health records, medications,
    and traffic and accident reports are held under controlled access rather than in the public
    release.
  deidentification_details: The RO-Crate metadata records the release as deidentified and
    assigns a confidentiality level of "HL7:2N (normal)". The healthsheet notes that the dataset
    has not undergone any formal external audit but has been reviewed internally by AI-READI
    team members for quality checks and to ensure that no personally identifiable information
    was accidentally included. The healthsheet leaves blank its question about measures taken
    to avoid re-identification of individuals following de-identification.
