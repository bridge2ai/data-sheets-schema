instances:
- instance_type: individual study participant
  counts: 2280
  data_topic: B2AI_TOPIC:43
  label: false
  label_description: No explicit label or target is associated with each data instance. No
    labeling was performed, because the dataset is hypothesis agnostic and aimed at facilitating
    multiple potential downstream AI/ML applications.
  notes: Each instance consists of all of the data available for one individual participating
    in the study, spanning survey data, clinical data, retinal imaging data, environmental
    sensor data, continuous glucose monitor data and wearable activity monitor data. These
    encompass tabular data, imaging data and physiological signal/waveform data; there is
    no unstructured text data in the dataset.
anomalies:
- anomaly_details: In survey data, skipped questions and incomplete responses are expected.
- anomaly_details: In wearable data, improper use and technical failure such as battery failure
    or system malfunction are expected. The Garmin Vivosmart 5 had to be charged every two
    to three days, so there are gaps in the activity monitoring record.
- anomaly_details: In imaging data, patient uncooperation, noise that may obscure the images,
    technical failure such as system malfunction, and data transfer failures are expected.
- anomaly_details: Optomed Aurora fundus photographs are taken undilated with a handheld camera,
    so image quality varies from patient to patient and within the same patient.
- anomaly_details: Fluorescence lifetime imaging ophthalmoscopy takes longer than a standard
    Spectralis OCT and exposes patients to uncomfortable levels of light, so it is performed
    last in the visit and patients may not be at their best possible compliance. The device
    cannot handle more than one centimetre of movement during image acquisition, and unwanted
    signals such as background light or lens fluorescence cannot simply be subtracted because
    they are part of the same photon distribution as the useful data.
- anomaly_details: Heidelberg Spectralis imaging is operated manually rather than automatically,
    so quality issues may arise that lead to skipping the modality and missing data.
known_biases:
- bias_type: selection_bias
  bias_description: Participants are volunteers, so volunteer bias applies, which may limit
    the generalisability of results to those not represented in the study population.
  mitigation_strategy: Recruitment is conducted in waves from health-system-wide electronic
    health record screening rather than from clinic referrals alone, and composition is monitored
    and adjusted as recruitment progresses.
- bias_type: sampling_bias
  bias_description: While the AI-READI cross-sectional database ultimately aims to achieve
    balance across race/ethnicity, biological sex, and diabetes presence and severity, the
    pilot and interim releases are not balanced across these parameters, and periodic data
    releases may not have achieved balanced distribution across groups while enrolment is
    ongoing.
  mitigation_strategy: Uniform data collection protocols were implemented for all subjects
    irrespective of race/ethnicity, biological sex or diabetes severity across all study sites,
    and three study sites were selected to ensure varied representation and minimize the potential
    for sampling bias. The recommended data splits balance the validation and test sets as
    far as possible for sex, race/ethnicity and diabetes status.
  affected_subsets:
  - Race/ethnicity, biological sex and diabetes severity strata within the full 2,280-participant
    release.
- bias_type: representation_bias
  bias_description: The study cohort may not provide a comprehensive representation of the
    population, as it does not include other races and ethnicities such as Pacific Islanders
    and Native Americans. Recruitment is predominantly urban and hospital-based, which may
    not fully capture all possible cultural and socioeconomic backgrounds. The requirement
    that participants speak, read and understand English may also have created challenges
    in recruiting Hispanic and Asian participants.
  mitigation_strategy: Three geographically distributed sites were selected and individuals
    from all demographic backgrounds were recruited at all three; the project engaged the
    Native Biodata Consortium as a co-learning opportunity for understanding challenges specific
    to American Indian and Alaska Native communities. The BMJ Open protocol notes that if
    sample balancing on race/ethnicity emerges as a challenge, new recruitment strategies
    will be implemented.
known_limitations:
- limitation_type: representativeness_limitation
  limitation_description: The cohort is not designed to be representative of the US population;
    it is intentionally balanced across four race/ethnic groups, four diabetes severity groups
    and two sexes.
  scope_impact: Prevalence estimates and population-level inferences drawn from the dataset
    will not correspond to the general population.
- limitation_type: temporal_limitation
  limitation_description: The design is cross-sectional with a single study visit per participant
    in this release; longitudinal data are planned only for a small subgroup returning in
    year four of the project.
  recommended_mitigation: Disease-trajectory questions are approached through pseudotime manifold
    analysis across participants of differing severity rather than through repeated measures
    on the same individual.
- limitation_type: coverage_limitation
  limitation_description: Not all modalities are available for all participants, because some
    participants declined individual study elements and some device data were lost or unretrievable.
- limitation_type: scope_limitation
  limitation_description: The public release omits sex, race and ethnicity, medications, five-digit
    zip code, genetic sequencing data, past health records and traffic and accident reports;
    these are available only in the controlled-access version under a data use agreement.
  scope_impact: Fairness analyses stratified by sex or race/ethnicity cannot be performed
    on the public release alone, although the recommended splits were constructed to be balanced
    on those variables.
- limitation_type: methodological_limitation
  limitation_description: Version 3.0.0 drops the Snellen visual acuity variables present
    in the prior version, so only logMAR visual acuity measurements are available.
- limitation_type: integration_limitation
  limitation_description: The biorepository holds a finite number of biospecimens available
    to share with scientists, and procedures for reviewing and prioritising written requests
    were still to be developed at the time of the protocol publication.
