title: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
version: 3.0.0
id: doi:10.60775/fairhub.3
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
description: 'The Flagship Dataset of Type 2 Diabetes from the AI-READI Project, version 3.0.0,
  is a multimodal cross-sectional dataset covering 2,280 participants with and without type
  2 diabetes mellitus (T2DM), collected between 19 July 2023 and 1 May 2025 and harmonized
  across three United States data collection sites: the University of Alabama at Birmingham,
  the University of California San Diego, and the University of Washington. AI-READI is one
  of four Data Generation Projects funded by the NIH Common Fund Bridge2AI program, and the
  dataset was built to be "AI ready" so that machine learning research on the pathogenesis
  and salutogenesis of T2DM — the pathway from disease back to health — can proceed without
  further reformatting or preprocessing. Recruitment sampling aimed at an approximately equal
  distribution of participants across diabetes severity (no diabetes; prediabetes or lifestyle-controlled;
  controlled by oral or non-insulin injectable medication; insulin-controlled), self-reported
  race and ethnicity, and biological sex. Each participant completed pre-visit questionnaires,
  a single on-site visit, and a ten-day at-home monitoring period. The released data types
  are OMOP Common Data Model clinical tables derived from REDCap (laboratory results, survey
  responses, physical and vision assessments, cognitive and monofilament testing), 12-lead
  electrocardiography in WFDB format, retinal photography, optical coherence tomography, optical
  coherence tomography angiography and fluorescence lifetime imaging ophthalmoscopy in DICOM,
  continuous glucose monitoring and wearable activity monitoring in Open mHealth format, and
  indoor environmental sensor readings following NASA ASCII file format guidelines for Earth
  science data. The release contains 356,343 files totaling approximately 3.82 TB and carries
  no protected health information; information on the sex and race/ethnicity of participants
  and on medications used has been removed and is held in a controlled-access version of the
  dataset. That controlled-access version, which is not the artifact this record describes,
  additionally holds five-digit zip code, genetic sequencing data, past health records, medications,
  and traffic and accident reports, and is available only to scientists whose institutions
  have completed legal and privacy use agreements with the AI-READI research programme.'
notes: The FAIRhub landing pages for the dataset and the documentation site both carry the
  notice "This repository is under review for potential modification in compliance with Administration
  directives." The FAIRhub platform itself is described on the version 2.0.0 landing page
  as currently in beta. The version 3.0.0 record reports 24,636 views and zero recorded citations
  at the time of capture. The healthsheet for version 3.0.0 records that no data protection
  impact analysis of the potential impact of the dataset and its use on data subjects has
  been conducted, that no repository tracking papers or systems that use the dataset exists,
  that the dataset had not been used for any tasks at the time of publication, that there
  is no erratum, and that there is currently no mechanism for others outside the project to
  extend or augment the dataset.
source_caveats: 'Sources in the bundle disagree on several points. (1) The expansion of the
  AI-READI acronym: the BMJ Open protocol publication gives "Artificial Intelligence Ready
  and Equitable Atlas for Diabetes Insights", while the FAIRhub study description, the FAIRhub
  README and NIH RePORTER all give "Artificial Intelligence Ready and Exploratory Atlas for
  Diabetes Insights"; the record does not expand the acronym in its own prose, so the conflict
  is recorded rather than resolved. (2) The institution accountable for the dataset: FAIRhub
  names Washington University in St. Louis as managing organization and lead sponsor and the
  license names it as Licensor, while the RO-Crate places the principal investigator in the
  Department of Ophthalmology at the University of Washington and gives a University of Washington
  address for the IRB, and NIH RePORTER lists the University of Washington as the awardee
  organization; FAIRhub and the RO-Crate share tier 1, so the ranking does not settle this.
  (3) Target enrolment: the FAIRhub study record and the BMJ Open protocol give 4,000 participants,
  NIH RePORTER gives "4,000+", and the IRB protocol answers give 4,600; the tier 1 value of
  4,000 is recorded. (4) Enrolment start date: BMJ Open gives 18 July 2023 while FAIRhub gives
  19 July 2023; the FAIRhub value is used. (5) The size of the longitudinal follow-up arm:
  the FAIRhub healthsheet gives approximately 4% of participants while the FAIRhub README,
  the RO-Crate and NIH RePORTER give 10% of the study cohort; both figures are recorded rather
  than merged. (6) The healthsheet describes version 3.0.0 as containing "data from the participants
  of the pilot study phase" in one place and as covering data through the end of the second
  year of the study in another; the collection window of 19 July 2023 to 1 May 2025 and the
  count of 2,280 participants are consistent across the FAIRhub API, the README and the RO-Crate
  and are recorded here.'
