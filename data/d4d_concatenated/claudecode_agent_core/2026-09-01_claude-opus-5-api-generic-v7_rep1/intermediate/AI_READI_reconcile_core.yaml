acquisition_methods:
- acquisition_details: Directly observable measurements, including laboratory results from
    blood and urine, vital signs, electrocardiography, visual function testing, monofilament
    testing and retinal imaging, were obtained during the on-site study visit.
  was_directly_observed: true
- acquisition_details: Participant-reported data were obtained through pre-visit and on-site
    questionnaires covering demographics, depressive symptoms, diabetes distress and self-care,
    diet, smoking, alcohol, vaping and marijuana use, general health, social determinants
    of health, vision difficulties and eye care access, and current medications.
  was_reported_by_subjects: true
- acquisition_details: Verification of data entry was performed where possible, for example
    by cross-referencing entered medications against medications physically brought in or
    photographed by each study participant.
  was_validated_verified: true
- acquisition_details: At-home sensor data were captured automatically over a ten-day post-visit
    period by a continuous glucose monitor, a wrist-worn activity monitor and a custom indoor
    environmental sensor.
  was_directly_observed: true
collection_mechanisms:
- mechanism_details: 'REDCap was used for collecting patient-reported questionnaire data and
    the following clinical data from the visit: medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament test results and complete blood count results. REDCap
    was also the interface for recruitment, screening and electronic consent.'
- mechanism_details: A 12-lead electrocardiogram was recorded with a Philips PageWriter TC30
    Cardiograph while the participant sat in a reclining chair or lay supine, with the chair
    position (0, 30, 60 or 90 degrees relative to supine) recorded.
- mechanism_details: 'Retinal imaging used six devices: the Optomed Aurora IQ handheld non-mydriatic
    fundus camera; the iCare EIDON widefield TrueColor confocal fundus system; the Heidelberg
    Spectralis HRA OCT/OCTA; the Topcon Maestro2 3D OCT-1; the Topcon Triton DRI OCT; and
    the Carl Zeiss Meditec Cirrus 5000 Angioplex. Both eyes were imaged on each participant,
    under dilation except for the Optomed. Fluorescence lifetime imaging ophthalmoscopy was
    performed on a Heidelberg FLIO device, macula-centred.'
- mechanism_details: Continuous glucose monitoring used the Dexcom G6, a real-time integrated
    continuous glucose monitoring system that records a blood glucose measurement every five
    minutes and was worn for ten days; participants were masked to the results during the
    monitoring period.
- mechanism_details: Physical activity monitoring used the Garmin Vivosmart 5 worn on the
    wrist for ten consecutive days, with a sampling frequency of five seconds; participants
    returned the device with a form recording which wrist it was worn on and their dominant
    hand.
- mechanism_details: Indoor environmental measurement used the LeeLab Anura, a sensor unit
    custom designed at the Karalis Johnson Retina Center, University of Washington, placed
    for ten days in a frequently used area of the participant's home, with the placement location
    recorded on return.
- mechanism_details: Cognitive screening used the Montreal Cognitive Assessment administered
    electronically on an iPad using the MoCA Duo application, exporting total score, section
    subscores, Memory Index Score and task completion times.
- mechanism_details: Visual function testing used an M&S Technologies Electronic Visual Acuity
    tester at four metres, the Mars letter contrast sensitivity chart, a 2.0 neutral density
    filter for mesopic conditions, and a Topcon KR 800 autorefractor; lensometers used across
    sites were the NIDEK LM-600P and the Topcon CL-200 and CL-300.
- mechanism_details: Blood pressure was measured with automatic oscillometric devices; the
    devices used across sites were the OMRON HEM 907XL, the Medline MDS4001 and the Welch
    Allyn 6000 series vital signs monitor with a Welch Allyn FlexiPort reusable cuff.
collection_timeframes:
- start_date: '2023-07-19'
  end_date: '2025-05-01'
  timeframe_details: Version 3.0.0 contains data from participants seen between 19 July 2023
    and 1 May 2025, spanning the pilot phase and the first two years of the main study.
  source_caveats: The BMJ Open protocol publication states that enrolment began on 18 July
    2023 and that preliminary pilot enrolment ran from 18 July 2023 to 30 November 2023, with
    formal data collection beginning 1 December 2023. FAIRhub, the higher-ranked source, gives
    19 July 2023 as the start of the collection period, and that value is recorded here.
- timeframe_details: The overall project timeline spans four years, with one year for protocol
    development and training and years two to four for subject recruitment and data collection.
    Recruitment was reported in the BMJ Open protocol as continuing until 30 November 2026;
    the FAIRhub study record gives an anticipated study completion date of 1 January 2027.
    The healthsheet states that approximately 4% of participants are expected to undergo a
    follow-up examination in year four.
  source_caveats: Sources give two different figures for the size of the longitudinal arm.
    The FAIRhub healthsheet states that approximately 4% of participants are expected to undergo
    a follow-up examination in Year 4, while the FAIRhub README, the RO-Crate description
    and NIH RePORTER all state that longitudinal data will be collected from 10% of the study
    cohort. The FAIRhub healthsheet and README are the same tier 1 source, so the ranking
    does not settle the disagreement; both figures are recorded rather than merged.
data_collectors:
- role: clinical research coordinator
  collector_details: Clinical research coordinators at the three data collection sites recruited,
    consented and enrolled participants, ushered them through the research visit, conducted
    study visits including collection of ophthalmic images, trained participants on continuous
    glucose monitoring and the fitness tracker, and ensured the return of study devices.
- role: research assistant
  collector_details: Research assistants conducted study visits including collection of ophthalmic
    images, provided training on the at-home devices, and were responsible for data upload
    and management from each clinic visit under the direction of the study coordinator or
    project manager.
- role: data manager
  collector_details: A Data Manager at each data site was responsible for quality control
    of all data before uploading to FAIRhub; data managers at UAB trained all research personnel
    at the three data sites and oversaw the certification process for coordinators.
- role: phlebotomist and laboratory assistant
  collector_details: Phlebotomists collected blood from research participants and laboratory
    assistants processed and shipped samples.
  notes: All research personnel who recruited, enrolled and collected data underwent training
    by the data manager at UAB, followed a detailed Manual of Procedures, completed mandatory
    institutional compliance training for human subject research, and were required to administer
    all protocol elements to at least three volunteer practice subjects before enrolling participants.
missing_data_documentation:
- missing_data_patterns:
  - Not all modalities are available for all participants.
  missing_data_causes:
  - Some participants elected not to participate in some study elements.
  - In a few cases the data collection device did not have any stored results or was returned
    too late to retrieve the results, for example because the battery died or the data were
    lost.
  - In a few cases there may have been a data collision at some point in the process and data
    have been lost.
  handling_strategy: During data entry quality control, missing data that could be directly
    filled from other portions of an individual's record were filled, under the guidance and
    approval of the site principal investigator. No imputation of missing values is reported
    for the released dataset.
raw_data_sources:
- source_description: Participant-reported questionnaire responses and clinician-entered clinical
    data captured in REDCap, including the medications assessment, vitals, visual acuity,
    contrast sensitivity, monofilament test results and complete blood count results.
  source_type: electronic data capture system
  raw_data_format: REDCap export
  access_details: Not released in raw form; mapped one-to-one onto OMOP Common Data Model
    tables and distributed as CSV in the clinical_data directory.
- source_description: Twelve-lead electrocardiograms recorded on the Philips PageWriter TC30
    Cardiograph.
  source_type: clinical device export
  raw_data_format: .xml
  access_details: Converted to WFDB and distributed in the cardiac_ecg directory.
- source_description: Montreal Cognitive Assessment results captured by the MoCA Duo application,
    comprising total score, section subscores, Memory Index Score and task completion times.
  source_type: tablet application export
  raw_data_format: .csv
- source_description: Retinal imaging device exports from the Optomed Aurora IQ, iCare Eidon,
    Heidelberg Spectralis, Topcon Maestro2, Topcon Triton, Zeiss Cirrus 5000 and Heidelberg
    FLIO.
  source_type: imaging device export
  raw_data_format: Native DICOM for Optomed, Eidon, Spectralis and Cirrus; .fda for Topcon
    Maestro2 and Triton; .sdt for Heidelberg FLIO.
  access_details: Converted to DICOM where necessary before upload to FAIRhub and distributed
    in the retinal_photography, retinal_oct, retinal_octa and retinal_flio directories.
- source_description: Continuous glucose measurements recorded every five minutes by the Dexcom
    G6 over a ten-day wear period.
  source_type: wearable device export
  raw_data_format: .csv
- source_description: Physical activity, heart rate, sleep and oxygen saturation records from
    the Garmin Vivosmart 5 worn for ten consecutive days at a five-second sampling frequency.
  source_type: wearable device export
  raw_data_format: .FIT
- source_description: Indoor environmental readings from the custom LeeLab Anura sensor placed
    in the participant's home for ten days.
  source_type: custom sensor export
  raw_data_format: .csv
- source_description: Blood and urine laboratory results produced by the University of Washington
    Nutrition and Obesity Research Center testing facility from stored frozen samples, and
    complete blood count results from CLIA-certified laboratories local to each data collection
    site.
  source_type: clinical laboratory report
  raw_data_format: .csv
- source_description: Electronic health records at the three health systems, screened for
    ICD-10 diagnosis codes E11.X and R73.09 among patients aged 40 or older with an encounter
    between 2020 and 2025, used to construct the recruitment pools.
  source_type: electronic health record
  access_details: Used only for recruitment pool identification and eligibility screening;
    past health records are held under controlled access rather than in the public release.
sampling_strategies:
- is_sample: true
  is_random: false
  is_representative: false
  strategies:
  - The FAIRhub study description records the sampling method as "Non-Probability Sample".
  - The study base is all patients aged 40 years or older who had a medical encounter within
    each health system site between 2020 and 2025; patients with T2DM and prediabetes were
    identified by screening electronic health records for ICD-10 diagnosis codes E11.X and
    R73.09 respectively.
  - Participants were recruited in waves, with the composition and size of each wave influenced
    by the observed participation characteristics of race/ethnicity, gender, severity of T2DM
    and site; composition was monitored and adjusted by under- and oversampling groups as
    needed.
  - All study groups were recruited from each site, but the proportion of each group varies
    with the demographic prevalence of that group in the site's geographical area.
  why_not_representative: The cohort is intentionally triple-balanced by race/ethnicity, T2DM
    presence and severity, and biological sex rather than matched to the demographic distribution
    of the US population, because balanced training data are considered critical for developing
    unbiased machine learning models. Participants are volunteers, so volunteer selection
    bias applies, and recruitment is predominantly urban and hospital-based.
  source_caveats: 'The healthsheet for version 3.0.0 states that the dataset "contains all
    possible instances", meaning all participants enrolled during the covered period, and
    answers "N/A" to the question about sampling strategy at preprocessing time. The study
    description in the same FAIRhub record gives the sampling method as a non-probability
    sample. Both statements come from the same tier 1 source and are represented together
    here: the released dataset is not a sample of the enrolled participants, but the enrolled
    participants are a non-probability sample of the study base.'
raw_sources:
- raw_data_details: The raw data are saved and expected to be preserved by the AI-READI project
    at least for the duration of the project, but are not anticipated to be shared outside
    the project team at present, because they have not been mapped to standardized terminologies
    and because the raw data may accidentally include personal health information or personally
    identifiable information, for example in free text fields. There is a possibility that
    raw data may be included in future releases of the controlled access dataset.
preprocessing_strategies:
- preprocessing_details: Once data were sent from each study site to the central project team,
    all data were mapped to standardized terminologies where possible, in particular the Observational
    Medical Outcomes Partnership Common Data Model for observational health data and DICOM
    for medical imaging data.
- preprocessing_details: 'Retinal images were exported from the imaging devices in their raw
    format and some required conversion to DICOM before upload: Topcon Maestro2 and Triton
    data were exported in .fda format and converted to DICOM, and Heidelberg FLIO data were
    exported in .sdt format and converted to DICOM. Optomed, iCare Eidon, Heidelberg Spectralis
    and Zeiss Cirrus data were exported directly in DICOM.'
- preprocessing_details: Garmin fitness tracker data were exported in .FIT format and converted
    to the Open mHealth standard for the dataset; Dexcom continuous glucose monitor data were
    exported as .csv and likewise mapped to Open mHealth; ECG data exported as .xml were mapped
    to the WFDB format.
- preprocessing_details: Processing moved from custom and ad hoc handling for version 1.0.0
    to a combination of automated and custom processing for the year two and year three data
    included in versions 2.0.0 and 3.0.0.
cleaning_strategies:
- cleaning_details: 'Quality control measures were applied at the time of data entry and acquisition.
    Clinical data outside expected minimum and maximum ranges were flagged in REDCap and appeared
    in reports viewed by clinical research coordinators and data managers, who examined participant
    records and determined whether an error was likely. Data were checked, and edited if errors
    were detected, for: credibility, based on range checks determining whether all responses
    fall within a prespecified reasonable range; incorrect flow through prescribed skip patterns;
    missing data that can be directly filled from other portions of an individual''s record;
    and the omission or duplication of records.'
- cleaning_details: Editing was only done under the guidance and approval of the site principal
    investigator. If corrected data were available elsewhere in the respondent's answers,
    the error was corrected; if there was no logical or appropriate way to correct the data,
    the site principal investigator reviewed the values and decided whether they should be
    removed.
- cleaning_details: No instances were excluded from the dataset at the time of preprocessing;
    exclusions operate only through the study eligibility criteria.
other_tasks:
- task_details: The dataset is deliberately hypothesis agnostic; no specific labeling was
    performed, because the dataset is aimed at facilitating multiple potential downstream
    AI/ML applications rather than one predefined task. The healthsheet records no formal
    guidelines for researchers who wish to define new tasks or create new labels.
discouraged_uses:
- discouragement_details: 'Treating the cohort as a comprehensive representation of the population
    is discouraged: recruitment is predominantly urban and hospital-based and the cohort does
    not include other races and ethnicities such as Pacific Islanders and Native Americans.'
- discouragement_details: Interim releases should not be relied on for balanced demographic
    distribution. Enrolment is ongoing, and the pilot data release and periodic updates to
    data releases may not have achieved balanced distribution across groups.
intended_uses:
- use_category: Artificial intelligence and machine learning research on type 2 diabetes
  usage_notes: The public version of the dataset may only be used for type 2 diabetes related
    research; accessing it requires agreeing to that restriction as well as to the license
    terms.
  examples:
  - Multimodal AI/ML model development on balanced type 2 diabetes data.
  - Pseudotime manifold analysis to reconstruct a temporal atlas of T2DM development and reversal
    towards health.
  - Research into salutogenesis, the pathway from disease back to health.
- use_category: Methodological reuse of the data generation blueprint
  usage_notes: The project shares its blueprint for collecting and sharing AI-ready datasets,
    including guidelines for project management, data collection, management and sharing,
    so that future Data Generation Projects can follow them.
  examples:
  - Reuse of the Clinical Dataset Structure (CDS) specification for organizing clinical research
    datasets with structured metadata.
  - Reuse of the FAIRhub platform for managing and sharing AI-ready clinical research datasets,
    which the project anticipates making available to future Data Generation Projects after
    testing it on the AI-READI dataset.
- use_category: Model development and distribution
  usage_notes: Licensees may make, reproduce and distribute models, algorithms and programs
    developed, trained or adapted using the data, provided those artefacts do not themselves
    contain the data or any modified version of it, and provided that before dissemination
    the licensee undertakes all reasonable efforts to minimise the likelihood that data can
    be memorized, derived, reconstructed or reconstituted through the use or construction
    of such models.
prohibited_uses:
- prohibition_reason: Making clinical treatment decisions based on the data is prohibited
    under the license, which states that the data are intended solely as a research resource.
- prohibition_reason: Using or attempting to use the data, alone or in concert with other
    information, to compromise or infringe the confidentiality of information about a data
    subject, to invade or compromise a data subject's privacy, to identify or contact a data
    subject or group of data subjects, to extract or extrapolate identifying information,
    to establish a data subject's membership in a particular group of persons, or otherwise
    to cause harm or injury to any data subject, is prohibited.
- prohibition_reason: Sharing or distributing the data with any third party model vendor or
    developer for training or development purposes is prohibited, even where that vendor is
    party to a business associate agreement with the licensee's institution, because training
    includes model weight modification and other adjustments to a model's logic or operation.
    A third party model may be used to analyze the data where the vendor is party to a business
    associate agreement and the interaction is short-term, such as prompting or querying.
- prohibition_reason: Reproducing the data in papers, articles, presentations, analyses, reports
    or publications is prohibited except for small representative samples in up to five images
    or figures per paper for illustrative purposes; larger amounts must not be published,
    posted or made available via supplemental files, zip archives, code packages or other
    means, regardless of journal or conference requirements.
- prohibition_reason: Transferring, licensing, sublicensing, selling, assigning, displaying,
    sharing or otherwise conveying any portion of the data or any derivative work to a third
    party is prohibited unless that party is another licensee bound by an agreement with the
    licensor on identical terms and the sharing is for collaboration on projects involving
    the data.
- prohibition_reason: Removing, obscuring, altering or masking the static watermarking that
    may be applied to identify the licensee for security purposes is prohibited.
distribution_formats:
- format: DICOM
  media_type: application/dicom
  notes: 'Used for all retinal imaging directories: retinal_photography, retinal_oct, retinal_octa
    and retinal_flio.'
- format: CSV
  media_type: text/csv
  notes: Used for the OMOP CDM clinical data tables, the environmental sensor data and the
    manifest.tsv and participants.tsv tabular metadata files.
- format: JSON
  media_type: application/json
  notes: Used for the Open mHealth wearable data and for the CDS metadata files dataset_description.json,
    dataset_structure_description.json, participants.json, study_description.json and dqd_omop.json.
- format: Markdown
  media_type: text/markdown
  notes: Used for the README.md, CHANGELOG.md and healthsheet.md metadata files.
distribution_dates:
- release_dates:
