conforms_to: >-
  Structured EHR data conform to the OMOP Common Data Model (with extensions for nursing flowsheets);
  imaging conforms to DICOM; waveform telemetry conforms to WFDB (a PhysioNet schema, extended); EEG
  conforms to EDF+ and Persyst; tokenized clinical notes conform to the OHNLP open source schema.
