id: https://chorus4ai.org/
name: CHoRUS Dataset
title: "Bridge2AI: Patient-Focused Collaborative Hospital Repository Uniting Standards (CHoRUS) for Equitable AI"
description: >-
  The CHoRUS dataset is a multicenter, multimodal, high-resolution, controlled-access dataset of
  acute and critical care hospital admissions, assembled retrospectively by the CHoRUS Network, one
  of four data generation projects in the NIH Common Fund's Bridge2AI program. Data are contributed
  by 14 data acquisition hospitals within a collaboration spanning 20 academic centers and more than
  60 consortium members. Structured electronic health record data are standardized to the OMOP
  Common Data Model; unstructured EHR text is extracted and tokenized with the OHNLP toolkit;
  imaging is drawn from hospital PACS in DICOM; telemetry waveforms from bedside monitors and
  gateway/middleware are released in WFDB; and EEG waveforms from hospital EEG databases are
  released in EDF+ and Persyst formats. Social determinants of health and contextual factors such as
  geographic distance to the nearest hospital are also acquired. The project website reports a
  current released dataset of 50,000 patient admissions from ICU, PICU, and NICU settings, 1.6
  billion rows of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data,
  against an anticipated final dataset of 100,000 patient admissions covering 9 data modalities from
  14 contributing hospitals. The nine documented data types are demographics, medication
  administration, procedures, nursing flowsheets, diagnoses, clinical notes, imaging, waveform
  telemetry, and EEG waveform; every one of them is under controlled access. OMOP and telemetry data
  sit in a cloud enclave, clinical notes remain stored locally at contributing sites with only tokens
  centralized, and as of August 2025 imaging de-identification for a larger cohort and EEG extraction
  were still in process. The project also sequesters a holdout test set for external validation of
  models.
status: Partially released under controlled access, with an anticipated final dataset still in preparation
page: https://chorus4ai.org/
