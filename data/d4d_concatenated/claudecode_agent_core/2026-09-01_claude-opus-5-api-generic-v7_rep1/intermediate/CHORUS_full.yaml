notes: >-
  The project website carries a site-wide banner reading "This repoitory is under review for
  potential modification in compliance with Administration directives."
source_caveats: >-
  The two sources that quantify the dataset disagree. The tier-2 project documentation
  (chorus4ai.org) states a current released dataset of 50,000 patient admissions and 7,642
  admissions with radiology data; the tier-4 cohort_2_webinar states that "As of August 2025, covers
  14 different hospitals with over 45K unique admissions" and that 1000 images are currently
  available. The tier-2 values are stated here, with the webinar's August 2025 snapshot reported
  where it describes modality readiness. The two imaging figures are also expressed in different
  units (images versus admissions with radiology data) and may not be directly comparable. The
  bundle gives no release date, DOI, version identifier, or recommended citation for the dataset.

