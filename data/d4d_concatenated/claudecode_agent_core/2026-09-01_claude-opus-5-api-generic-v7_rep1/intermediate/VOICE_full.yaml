id: doi:10.13026/37yb-1t42
name: Bridge2AI-Voice Adult Dataset
title: 'Bridge2AI-Voice: An ethically-sourced, diverse voice dataset linked to health
  information'
description: >-
  The Bridge2AI-Voice adult dataset is a large, ethically sourced and demographically
  diverse collection of voice, speech, breathing and cough data linked to health information,
  generated by the Bridge2AI-Voice consortium under the NIH Common Fund Bridge2AI program.
  Participants were recruited at high-volume expert clinics at academic institutions in
  the United States and Canada on the basis of membership in five disease cohort
  categories - voice disorders, neurological and neurodegenerative disorders, mood and
  psychiatric disorders, respiratory disorders, and pediatric voice and speech disorders -
  together with controls. Each participant completed a standardized protocol of acoustic
  tasks recorded on a tablet application, self-reported demographic and medical history
  questionnaires, disease-specific validated questionnaires, and clinician-performed gold
  standard diagnostic validation. Version 3.1.0 contains data for 833 participants across
  five North American sites. The public release contains data considered low risk:
  derivations of the audio such as spectrograms, Mel spectrograms, Mel-frequency cepstral
  coefficients, pitch contours, articulatory features, phonetic posteriorgrams and static
  acoustic features, distributed as Apache Parquet files, alongside phenotype tables and
  per-recording metadata distributed as tab-separated values with accompanying JSON data
  dictionaries. The original voice recordings are not part of the public release and are
  disseminated only through controlled access. The consortium's stated flagship target is
  a dataset of 10,000 voices linked to health information.
