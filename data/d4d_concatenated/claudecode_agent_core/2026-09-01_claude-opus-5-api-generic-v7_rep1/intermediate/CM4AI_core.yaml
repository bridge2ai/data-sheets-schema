name: CM4AI_June_2026_Data_Release
description: The June 2026 Data Release of Cell Maps for Artificial Intelligence (CM4AI),
  the Functional Genomics Grand Challenge in the NIH Bridge2AI program. CM4AI generates multi-modal
  data including protein-protein interaction (PPI), spatial localization, and genetic perturbation
  data in MDA-MB-468 breast cancer cells (with and without paclitaxel or vorinostat treatment)
  and induced pluripotent stem cells (with and without differentiation). This Beta release
  includes Perturb-seq data for MDA-MB-468 breast cancer cells with and without treatment
  and for undifferentiated (parental) KOLF2.1J iPSCs; SEC-MS data for MDA-MB-468 breast cancer
  cells with and without treatment, undifferentiated KOLF2.1J iPSCs, and iPSC-derived neuron
  progenitor cells (NPCs), neurons, and cardiomyocytes; AP-MS data for MDA-MB-468 breast cancer
  cells with treatment; and immunofluorescence images in MDA-MB-468 breast cancer cells with
  and without treatment. The overarching objective of CM4AI is to deliver machine-readable
  hierarchical maps of cell architecture as AI-ready data, produced from multimodal interrogation
  of chromatin modifiers, metabolic enzymes, and other proteins involved in cancer, neuropsychiatric,
  and cardiac disorders in disease-relevant cell lines under treated and untreated conditions,
  using state-of-the-art mass spectrometry-based proteomics, spatial proteomics and cell imaging,
  and genetic perturbations via CRISPR/Cas9. Output data are packaged with provenance graphs
  and rich metadata as AI-ready datasets in RO-Crate format using the FAIRSCAPE framework.
notes: 'CM4AI is organized into three pillars (Data, People, and Ethics) across six modules:
  Data Acquisition, Tools, and Standards; Skills and Workforce Development, and Teaming; and
  Ethics. It is a collaboration of UCSD, UCSF, Stanford, UVA, Yale, UT Austin, UA Birmingham,
  Simon Fraser University, and the Hastings Center.'
source_caveats: The declared bundle documents a sequence of quarterly CM4AI data releases
  under distinct DOIs. This record describes the June 2026 Data Release (doi:10.18130/V3/HIGT4C),
  the highest-ranked release source in the manifest, which supersedes the October 2025 release;
  earlier releases are recorded as related datasets rather than merged into this description.
  Two lower-ranked release pages (June 2025, tier 5) describe overlapping but not identical
  content, notably reporting 563 imaged proteins in the March 2025 release versus 464 in the
  June 2025 and later releases; the June 2026 figure of 464 is stated here. The CM4AI project
  web portal (tier 2) reports aggregate project-level counts of 1,374 protein interactions,
  53,788 immunofluorescent images, 7,023 total proteins investigated, 11,739 genes targeted,
  and 21.4 TB of data volume; these describe the project as a whole rather than this release
  specifically and are not recorded as slot values for this dataset. The bundle also contains
  a Nature publication describing a U2OS cell map produced by the same research groups using
  the same MuSIC methodology; that is a distinct dataset from the CM4AI releases and its cell-line-specific
  findings are not attributed to this record, though its methods descriptions of the shared
  MuSIC pipeline stages inform the preprocessing and annotation slots where the CM4AI preprint
  describes the same steps. File sizes in file_collections are converted from the human-readable
  sizes displayed by Dataverse and are therefore approximate to the displayed precision; the
  three immunofluorescence archives are displayed only in GB and no byte value is recorded
  for them.
