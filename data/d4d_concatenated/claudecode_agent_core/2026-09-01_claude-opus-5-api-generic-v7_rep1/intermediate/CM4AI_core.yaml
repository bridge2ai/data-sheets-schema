  strategies: 'Targeted selection of two disease-relevant cell lines under perturbed and unperturbed
    conditions: MDA-MB-468 triple negative breast cancer cells with and without paclitaxel
    or vorinostat treatment, and KOLF2.1J induced pluripotent stem cells with and without
    differentiation into neural progenitor cells, neurons, and cardiomyocytes.'
  source_data: MDA-MB-468 is a triple negative breast cancer cell line established from a
    metastatic site pleural effusion of a 51-year-old black female with a metastatic mammary
    adenocarcinoma. KOLF2.1J iPSCs were derived from a healthy male Northern European donor.
- is_sample: true
  strategies: Protein-level selection targeting 100 chromatin modifiers and 100 metabolic
    enzymes involved in cancer, neuropsychiatric, and cardiac disorders, with an expressed
    genome-scale CRISPRi screen covering 11,739 targeted genes in KOLF2.1J iPSCs.
raw_sources:
- raw_data_details: Mass spectrometry data for human iPSCs deposited in the MassIVE repository.
- raw_data_details: Mass spectrometry data for human cancer cells deposited in the MassIVE
    repository.
- raw_data_details: Raw sequence data from the expressed genome-scale CRISPRi Perturbation
    Cell Atlas in KOLF2.1J human induced pluripotent stem cells, deposited in the Sequence
    Read Archive under an NCBI BioProject.
- raw_data_details: CRISPRi Perturbation Atlas of iPSCs deposited in Figshare.
preprocessing_strategies:
- preprocessing_details: Downloaded protein-protein interaction networks are processed using
    the node2vec deep learning model to reduce dimensionality, producing a PPI embedding that
    contains information about the protein's interactions.
- preprocessing_details: Immunofluorescence images are processed using a Human Protein Atlas
    deep learning model to reduce dimensionality, producing an image embedding that contains
    information about protein localization.
- preprocessing_details: The PPI and image embeddings are integrated to obtain a co-embedding
    for each protein using contrastive deep learning. This integration model learns co-embeddings
    such that the original embeddings can be reconstructed with minimal information loss and
    proteins with similar PPI and image embeddings have similar co-embeddings.
- preprocessing_details: Community detection is performed based on the all-by-all similarities
    of pairs of proteins in the co-embedding space. The resulting hierarchy of protein communities
    is output as the final cell map.
labeling_strategies:
- labeling_details: Cell maps are annotated in a two-pronged approach. First, cell maps are
    aligned to known protein function and pathway resources, including the Gene Ontology (GO)
    and Reactome, to determine protein assemblies in the cell map with high overlap with known
    cell biology. Second, assemblies in the cell maps are annotated using a large language
    model approach developed to name sets of proteins and assign a name confidence score.
  data_annotation_platform: Gene Set AI (GSAI) pipeline guiding the GPT-4 model.
machine_annotation_tools:
- tools: node2vec
  tool_descriptions: Deep learning model used to represent each protein as a feature vector
    based on its protein-protein interaction neighborhood.
- tools: DenseNet-121
  tool_descriptions: Convolutional neural network pre-trained for object recognition in protein
    immunofluorescence confocal images, used to represent each protein as a feature vector
    from the four channels of the color image.
- tools: GPT-4
  tool_descriptions: Generative large language model used, via the Gene Set AI (GSAI) pipeline
    and an engineered prompt, to generate descriptive names for protein assemblies along with
    a confidence score and a referenced analysis essay.
- tools: HiDeF
  tool_descriptions: Hierarchical community Decoding Framework used for pan-resolution community
    detection, identifying protein communities at different resolutions and representing their
    hierarchical relationships as a directed acyclic graph.
existing_uses:
- examples: CM4AI data and tools were used for hands-on training at a virtual CodeFest held
    in March 2024, attended by 38 registrants from within the project and externally, accompanied
    by detailed tutorials explaining how the data were derived and integrated and providing
    production-ready software for producing the datasets.
- examples: Cell maps have been used in AI tools for visible machine learning or visible neural
    networks to interrogate how protein assemblies in the cell affect cell-level phenotype
    predictions.
other_tasks:
- task_details: Integrative structure modeling of protein communities, ranked by the amount
    of available structural information drawn from the Protein Data Bank, AlphaFold Protein
    Structure Database, crosslinking mass spectrometry, and prediction of disordered sequence
    segments.
- task_details: Training and workforce development in biomedical AI/ML, including asynchronous
    virtual training, hosted virtual events, and an in-person internship co-hosted at Yale
    University and the University of California San Diego covering the impact of cell maps
    on biomedical research applications, interaction with CM4AI data and standards, development
    of a visible neural network using cell maps, and integration of external data into an
    existing cell map.
future_use_impacts:
- impact_details: Anticipating potential applications of the data and derived AI/ML systems,
    integrating them into data governance frameworks to optimize benefits and mitigate potential
    risks, and promoting their use for the collective good, is a stated ethical requirement
    of the project.
- impact_details: The Ethics team is developing a suite of tools aimed at enhancing awareness
    and comprehension of the ethical, legal, and social ramifications associated with CM4AI
    data and the consequent AI systems, to bolster ethical decision-making.
discouraged_uses:
- discouragement_details: 'Use without domain expertise is discouraged: meaningful analysis
    of these data requires domain expertise.'
- discouragement_details: Use as a complete cell-map resource is discouraged at this stage;
    this is an interim release that does not contain predicted cell maps, which will be added
    in future releases.
intended_uses:
- use_category: AI-ready research data
  usage_notes: AI-ready datasets to support research in functional genomics.
- use_category: AI model training
  usage_notes: Training of artificial intelligence and machine learning models.
- use_category: Cellular process analysis
  usage_notes: Analysis of cellular processes from multimodal proteomic, imaging, and perturbation
    data.
- use_category: Perturbation and disease-context analysis
  usage_notes: Study of cell architectural changes and interactions in the presence of specific
    disease processes, treatment conditions, or genetic perturbations.
- use_category: Bioinformatics analysis of component datasets
  usage_notes: The current release is most suitable for bioinformatics analysis of the individual
    datasets, as computed cell maps are not included.
prohibited_uses:
