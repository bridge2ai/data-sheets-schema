known_biases:
- bias_type: representation_bias
  bias_description: Data in this release was derived from commercially available de-identified
    human cell lines and does not represent all biological variants which may be seen in the
    population at large.
  affected_subsets:
  - All data in the release, spanning MDA-MB-468 breast cancer cells and KOLF2.1J iPSCs and
    their derivatives.
known_limitations:
- limitation_type: scope_limitation
  limitation_description: This is an interim release. It does not contain predicted cell maps,
    which will be added in future releases.
  scope_impact: The current release is most suitable for bioinformatics analysis of the individual
    datasets rather than for analysis of integrated cell maps.
- limitation_type: coverage_limitation
  limitation_description: Protein-protein interaction (SEC-MS), protein localization (IF imaging),
    and CRISPRi Perturb-seq data interrogate sets of proteins which incompletely overlap.
- limitation_type: integration_limitation
  limitation_description: Some datasets are under temporary pre-publication embargo, so the
    release is not yet in completed final form.
  recommended_mitigation: Embargoed Perturb-seq data for KOLF2.1J iPSCs and for MDA-MB-468
    breast cancer cells are expected to become available; the dataset is updated quarterly
    through the end of the project.
- limitation_type: methodological_limitation
  limitation_description: Requires domain expertise for meaningful analysis.
