purposes:
- response: To deliver machine-readable hierarchical maps of cell architecture as AI-ready
    data, produced from multimodal interrogation of chromatin modifiers, metabolic enzymes,
    and other proteins involved in cancer, neuropsychiatric, and cardiac disorders in disease-relevant
    cell lines under treated and untreated conditions.
- response: To map the spatiotemporal architecture of human cells and use these maps toward
    the grand challenge of interpretable genotype-phenotype learning.
- response: To produce ethical, AI-ready datasets of cell architecture, inferred from multimodal
    data collected for human cell lines, to enable transformative biomedical AI research.
- response: To stimulate research and development in "visible" machine learning systems informed
    by multi-scale cell and tissue architecture, which are not black boxes but are built directly
    on knowledge maps of cell and tissue architecture.
tasks:
- response: Construction of hierarchical cell maps as directed acyclic graphs, where each
    node represents an assembly of proteins in proximity at a given scale, spanning from large
    assemblies representing cell compartments to small assemblies of proteins in close proximity.
- response: Interpretable genotype-phenotype learning, including interpretation of genetic
    variants and mutations.
- response: Development of visible machine learning models, also called visible neural networks,
    to interrogate how protein assemblies in the cell affect cell-level phenotype predictions.
- response: Integrative structure modeling of protein communities resolved in the cell maps,
    using the Integrative Modeling Platform.
addressing_gaps:
- response: In genomics and precision medicine, machine learning models are often "black boxes,"
    predicting phenotypes from genotypes without understanding the mechanisms by which such
    translation occurs. This project addresses that deficiency by generating matched data
    and tools that enable creation of visible machine learning systems built on knowledge
    maps of cell and tissue architecture.
- response: Much of cell structure still remains uncharted. Cell mapping technologies have
    typically been applied separately; integrating multiple complementary data modalities
    provides the opportunity to incorporate biological structure robustly across physical
    scales.
- response: To recruit and prepare a biomedical workforce adept at both the data and life
    sciences, new training that allows researchers to leverage the data sets produced by Bridge2AI
    and other programs is needed.
