acquisition_methods:
- acquisition_details: Protein-protein interactions were determined by size exclusion chromatography
    coupled to mass spectrometry (SEC-MS) for proteome-wide complex and interaction mapping.
  was_directly_observed: true
- acquisition_details: Protein-protein interactions were determined by affinity purification
    mass spectrometry (AP-MS) on endogenously tagged cell lines.
  was_directly_observed: true
- acquisition_details: Spatial subcellular protein localization was determined by immunofluorescence-based
    staining (ICC-IF) and confocal microscopy using the Human Protein Atlas resource of antibodies.
    Nuclei were stained with DAPI (blue channel); endoplasmic reticulum with a calreticulin
    antibody (yellow channel); microtubules with tubulin antibody (red channel); and antibody
    against protein of interest (green channel).
  was_directly_observed: true
- acquisition_details: Transcriptional and fitness phenotypes were measured by single-cell
    CRISPRi perturbation screens (Perturb-seq) using the 10x Genomics 3'HT kit.
  was_directly_observed: true
collection_mechanisms:
- mechanism_details: Size exclusion chromatography coupled to mass spectrometry (SEC-MS),
    performed in the Nevan Krogan laboratory at the University of California San Francisco.
- mechanism_details: Affinity purification mass spectrometry (AP-MS) on endogenously tagged
    cell lines.
- mechanism_details: Immunofluorescence-based staining (ICC-IF) and confocal microscopy in
    the Lundberg Lab at Stanford University, using automated fixation and permeabilization
    protocols on a pipetting robot for MDA-MB-468 and KOLF2 cell lines.
- mechanism_details: Single-cell CRISPR screens using a CRISPR lentiviral library targeting
    chromatin factors with 6 guide RNAs per gene, in cell lines expressing inducible dCas9,
    read out with the 10x Genomics 3'HT kit.
