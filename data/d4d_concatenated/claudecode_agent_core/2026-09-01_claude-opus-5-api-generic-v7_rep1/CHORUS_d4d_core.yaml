known_biases:
- bias_type: representation_bias
  bias_description: 'The project treats cohort balance and diversity as an open risk to be
    managed: patient-focused efforts determine the ethical and legal approaches to manage
    privacy and bias while accounting for social determinants of health, and the stated goal
    is the most diverse AI-ready data set for improving recovery from acute illness.'
  mitigation_strategy: Federated access will enable sampling methods to ensure a balanced
    and diverse cohort, and sampling at scale is designed to capture comprehensive sets of
    patient conditions and clinical treatment strategies.
known_limitations:
- limitation_type: coverage_limitation
  limitation_description: Modality availability is uneven and still developing. As of August
    2025 the cohort 2 webinar reported that 1000 images were available with de-identification
    in process for a larger imaging cohort, that EEG extraction was still in process, and
    that published metadata was only planned rather than available for clinical notes, imaging,
    and EEG. The project website separately reports 7,642 admissions with radiology data in
    the current released dataset.
  recommended_mitigation: Confirm current modality availability with the CHoRUS data access
    contacts before planning analyses that depend on imaging, EEG, or note tokens.
- limitation_type: scope_limitation
  limitation_description: 'The released dataset is a partial build: 50,000 patient admissions
    against an anticipated final dataset of 100,000 patient admissions.'
- limitation_type: integration_limitation
  limitation_description: Clinical notes are not centralized with the rest of the data; they
    are stored locally at contributing sites and only tokens produced by the OHNLP toolkit
    are available in the enclave, which constrains analyses requiring raw narrative text.
- limitation_type: representativeness_limitation
  limitation_description: Data are contributed by 14 hospitals drawn from the 20 academic
    centers in the collaboration, so the cohort reflects the case mix and practice patterns
    of those participating academic centers.
confidential_elements:
- confidential_elements_present: true
  confidentiality_details: All nine data modalities carry controlled access. Clinical notes
    cannot be released centrally and are stored locally at contributing sites, with only tokens
    made available in the enclave; community-facing ethics focus groups are used to determine
    what data is appropriate for public sharing.
subpopulations:
- subpopulation_elements_present: true
  identification: Admissions in the current release are drawn from adult intensive care (ICU),
    pediatric intensive care (PICU), and neonatal intensive care (NICU) settings.
- subpopulation_elements_present: true
  identification: Demographics are captured as one of the nine data modalities and standardized
    to the OMOP Common Data Model; social determinants of health and contextual factors such
    as geographic distance to the nearest hospital are acquired alongside them.
sensitive_elements:
- sensitive_elements_present: true
  sensitivity_details: The dataset comprises hospital clinical records of critically ill patients,
    including demographics, diagnoses, medication administration, procedures, nursing flowsheets,
    clinical note tokens, radiology images, telemetry and EEG waveforms, social determinants
    of health, and contextual geographic factors such as distance to the nearest hospital.
acquisition_methods:
- was_directly_observed: true
  acquisition_details: Retrospective extraction of structured electronic health record data
    (demographics, medication administration with dosing time-stamped upon each infusion change
    or dose administration, procedures documented by providers, high-frequency nursing flowsheet
    documentation, and provider-documented diagnoses) from contributing hospital systems,
    standardized to the OMOP Common Data Model.
- was_directly_observed: true
  acquisition_details: Waveform telemetry captured from bedside monitors through hospital
    gateway/middleware and delivered in WFDB format.
- was_directly_observed: true
  acquisition_details: Imaging studies retrieved from hospital PACS in DICOM format.
- was_directly_observed: true
  acquisition_details: EEG waveforms extracted from hospital EEG databases in EDF+ and Persyst
    formats; extraction was still in process as of August 2025.
- was_directly_observed: true
  acquisition_details: Clinical notes documented by providers are extracted from hospital
    systems and tokenized using the OHNLP toolkit; the notes themselves are stored locally
    at contributing sites and only tokens are centralized.
collection_mechanisms:
- mechanism_details: Bedside physiologic monitors together with hospital gateway/middleware
    supply waveform telemetry.
- mechanism_details: Hospital picture archiving and communication systems (PACS) supply imaging.
- mechanism_details: Hospital EEG databases supply EEG waveform recordings.
- mechanism_details: The OHNLP toolkit is used to extract and tokenize unstructured clinical
    notes.
- mechanism_details: The chorus-extract-upload Python tool in the chorus-ai GitHub organization
    provides tools to create and upload a CHoRUS Data Extract at contributing sites.
collection_timeframes:
- timeframe_details: Data collection is described as retrospective and is carried out over
    the NIH award period, which runs from 2022-09-01 to 2026-11-30. As of August 2025 the
    assembled dataset covered 14 different hospitals.
  source_caveats: The dates given are the NIH project period for award OT2OD032701, not the
    clinical period the admissions are drawn from. Because extraction is retrospective, the
    admissions almost certainly predate the award, and the bundle does not state the temporal
    coverage of the clinical data.
data_collectors:
- collector_details: Fourteen of the twenty academic centers in the CHoRUS collaboration contribute
    as Data Acquisition centers, extracting and delivering clinical data extracts to the project.
- collector_details: Data site managers at contributing sites follow an interactive workflow
    and step-by-step standard operating procedures published in the Chorus_SOP repository,
    which have undergone an internal validation and review process, and report progress through
    GitHub or a Google Form that updates the Standards Project and Data Acquisition Project
    boards.
raw_data_sources:
- source_description: Structured electronic health record data from contributing hospital
    systems, covering demographics, medication administration, procedures, nursing flowsheets,
    and diagnoses
  source_type: Hospital electronic health record system
  raw_data_format: Site-specific source formats subsequently mapped to the OMOP Common Data
    Model
- source_description: Unstructured clinical notes documented in hospital electronic health
    record systems
  source_type: Hospital electronic health record system
  raw_data_format: Free text, extracted and tokenized with the OHNLP toolkit
  access_details: Notes are stored locally at the contributing site; only tokens are made
    available centrally.
- source_description: Imaging studies held in hospital picture archiving and communication
    systems
  source_type: Hospital PACS
  raw_data_format: DICOM
- source_description: Waveform telemetry from bedside monitors captured through gateway/middleware
  source_type: Bedside physiologic monitoring infrastructure
  raw_data_format: WFDB
- source_description: EEG recordings held in hospital EEG databases
  source_type: Hospital EEG database
  raw_data_format: EDF+ and Persyst
- source_description: Social determinants of health and contextual factors such as geographic
    distance to the nearest hospital
  source_type: Contextual and geospatial data linked to OMOP Location entities
sampling_strategies:
- is_sample: true
  strategies: Sampling at scale across data contributing centers to ensure comprehensive sets
    of patient conditions and clinical treatment strategies
- strategies: Federated access will enable sampling methods to ensure a balanced and diverse
    cohort
preprocessing_strategies:
- preprocessing_details: Source clinical data are standardized to the OMOP Common Data Model,
    with schema extensions used for high-frequency nursing flowsheet documentation.
- preprocessing_details: Unstructured electronic health record text is extracted and tokenized
    using the OHNLP toolkit and represented in the OHNLP open source schema.
- preprocessing_details: Data are transformed using approaches that limit re-identification
    before release.
- preprocessing_details: Waveforms are prepared and converted using the waveform conversion
    scripts and documentation in the chorus_waveform and chorus_waveform_resources repositories,
    with telemetry released in WFDB (described as a PhysioNet schema extended) and EEG in
    EDF+ and Persyst.
- preprocessing_details: OMOP Location entities are geocoded via DeGauss using the open source
    UF-Geocoding code, a fork of bihorac-LAB/Exposome maintained in the chorus-ai GitHub organization.
cleaning_strategies:
- cleaning_details: Characterization reports are produced and returned to sites following
    their data submissions, using the CHoRUSReports repository, so that contributing sites
    can identify and resolve issues in their extracts.
- cleaning_details: Semantic mappings from source formats to international standards are validated;
    clinical collaborators contribute to pooled tabular mappings in the chorus-mapping repository
    under an associated clinical validation standard operating procedure.
labeling_strategies:
- labeling_details: A visualization and annotation environment is developed to label data
    with targets important for prediction, as part of the project's capability to acquire,
    standardize, tokenize, store, visualize, and label data across the multi-center network.
existing_uses:
- examples:
  - Datasets are being used for training activities and publications
- examples:
  - The AIM-AHEAD Bridge2AI for Clinical Care Training Program (Cohort 2) expands access to
    Bridge2AI CHoRUS data so that up to 30 trainees can apply AI/ML methods to big data analysis
    and conduct research on the Bridge2AI Clinical Care Cloud platform
future_use_impacts:
- impact_details: The project sequesters holdout datasets for external validation in order
    to aid marketplace adoption of AI-developed models for implementation in acute and critical
    care, and to catalyze the biomedical research and expertise necessary to promote the patient-focused
    deployment of AI.
intended_uses:
- use_category: Machine learning and artificial intelligence model development for acute and
    critical care
  usage_notes: The dataset is intended to support building ML- and AI-derived models to improve
    the care and outcomes of patients requiring critical care.
  examples:
  - Prediction of complications and deterioration in critically ill patients
  - Measurement of treatment response in acute and critical illness
- use_category: External validation of AI models
  usage_notes: A holdout test set is provisioned specifically for external validation of models
    developed elsewhere.
- use_category: Training and workforce development in clinical AI
  usage_notes: The dataset is used within the Bridge2AI AI/ML for Clinical Care Collaborative
    Cloud for hands-on AI/ML coursework, canonical Jupyter Notebooks, and OHDSI/OMOP instruction,
    including trainee development of use cases and works-in-progress posters, conference abstracts,
    and manuscripts.
