updates:
  update_details: The released dataset is being expanded toward an anticipated final dataset
    of 100,000 patient admissions covering 9 data modalities from 14 contributing hospitals.
    As of August 2025, de-identification of a larger imaging cohort and extraction of EEG
    waveforms were in process, and published metadata schemas were planned but not yet available
    for clinical notes, imaging, and EEG.
extension_mechanism:
  contribution_url: https://github.com/chorus-ai
  extension_details: Clinical collaborators can contribute to semantic mapping efforts through
    the chorus-mapping repository, which holds documentation and pooled tabular mappings together
    with a clinical validation standard operating procedure. Issues encountered in creating
    or submitting a data extract can be posted in the Standards Discussions or Data Acquisition
    Discussions areas of the chorus-ai GitHub organization, and data contributing sites submit
    status updates either through the GitHub interface or through a Google Form that triggers
    a GoogleScript calling the GitHub API to update status and issue information.
ethical_reviews:
- reviewing_organization: CHoRUS consortium
  review_details: The project performs community-facing ethics focus groups to determine what
    data is appropriate for public sharing, and evaluates community perspectives on clinical
    care AI to find ways to increase trustworthiness of provenance and privacy in AI. Ethics
    is one of the project's three pillars, described in the NIH abstract as "Ethics (Ethical
    and Trustworthy AI)".
  source_caveats: This describes ethics activity carried out by the consortium. The bundle
    names no IRB, ethics committee, or approval identifier, and does not state that any body
    performed a formal ethical review of the dataset.
- reviewing_organization: CHoRUS consortium
  review_details: Patient-focused efforts determine the ethical and legal approaches used
    to manage privacy and bias while accounting for social determinants of health; new approaches
    are created as the existing legal and regulatory landscape is analyzed.
  source_caveats: Recorded from the project website and GitHub organization README; no reviewing
    body is named in either source.
human_subject_research:
  involves_human_subjects: true
  special_populations:
  - The cohort consists of acutely and critically ill hospital patients, and the released
    admissions include pediatric intensive care (PICU) and neonatal intensive care (NICU)
    patients.
  source_caveats: The NIH abstract describes the project as addressing the challenges of acquiring
    an AI-ready data set from more than 100,000 critically ill patients, which is the anticipated
    scale rather than a count of data already collected. The bundle names no IRB, ethics review
    board, or approval number.
license_and_use_terms:
  license_terms: Every data modality is released under controlled access rather than an open
    license. Users must sign a licensing agreement before gaining access to the dataset, and
    access through the AIM-AHEAD training program additionally requires a ".edu" email address.
  notes: The MIT License stated for the chorus-ai GitHub organization, and the Apache-2.0
    license shown on some individual repositories such as Chorus_SOP, govern the CHoRUS software
    repositories and not the dataset itself.
regulatory_restrictions:
  confidentiality_level: restricted
  regulatory_restrictions:
  - Access to all data modalities is controlled and conditional on a signed licensing agreement
  - The project establishes a legal framework for collecting data at scale and analyzes the
    existing legal and regulatory landscape to manage privacy and bias
data_governance:
  accountable_organization:
    name: Massachusetts General Hospital
  committee_contact: Jared Houghtaling
  access_review_process: 'All nine data modalities are under controlled access, and two distinct
    access routes are documented. General route: requests for access are directed to dbold@emory.edu
    or jared.houghtaling@tuftsmedicine.org. Training-program route: participants in the AIM-AHEAD
    Bridge2AI for Clinical Care Training Program complete a registration form with name, email,
    and institution and must sign a licensing agreement included in the registration form
    before gaining access to the dataset; once access is granted and compute is provisioned,
    an email is sent. A ".edu" email address is required in order to gain access to the dataset
    through that route, though program administrators will assist with this access if needed
    and the requirement is not a barrier to acceptance into the program.'
  stewardship_roles:
  - Program Manager Ciera McCrary at Massachusetts General Hospital is the contact listed
    on the project website
  - Data access requests are handled by the CHoRUS contacts reachable at dbold@emory.edu and
    jared.houghtaling@tuftsmedicine.org
  - Data contributing sites are responsible for creating and curating their CHoRUS-specific
    clinical data extract and for providing regular status updates on that progress
  source_caveats: The bundle names no access committee, no committee membership, no decision
    timeframe, and no appeal process. Jared Houghtaling is recorded as the contact because
    the chorus-ai GitHub organization lists him as one of two addresses for requesting access;
    the bundle does not state that he chairs or sits on any access body.
is_deidentified:
  method: Tokenization of unstructured electronic health record text using the OHNLP toolkit,
    retention of clinical notes at the local site with only tokens released, de-identification
    of imaging (in process for the larger cohort as of August 2025), and transformation of
    data using approaches that limit re-identification.
  deidentification_details: The project acquires, standardizes and tokenizes source clinical
    data and transforms it using approaches that limit re-identification before release into
    the controlled-access enclave. As of August 2025, 1000 images were available with de-identification
    in process for a larger imaging cohort.
  source_caveats: The bundle documents de-identification activity but does not state whether
    identifiable elements remain present in the released dataset, so that determination is
    left unrecorded.
