purposes:
- response: Meet the need of generating data for ML/AI applications aimed at characterizing
    acute and critical care illness, predicting complications, and measuring treatment response
    among patients with acute or critical illness.
- response: Develop a publicly available, AI-ready critical care dataset while ensuring the
    methods promote privacy, accountability, and clinical benefit, and while promoting a new
    generation of AI clinicians and scientists.
- response: Develop the most diverse, high-resolution, ethically sourced, AI-ready data set
    to answer the grand challenge of improving recovery from acute illness.
- response: Create ethically sourced datasets and tools around artificial intelligence and
    create best practices for AI in health, as one of four data generation projects in the
    NIH Bridge2AI consortium.
tasks:
- response: Characterizing acute and critical care illness.
- response: Predicting complications and clinical deterioration among patients with acute
    or critical illness.
- response: Measuring treatment response among patients with acute or critical illness.
- response: External validation of AI/ML models against a sequestered holdout test set, to
    aid marketplace adoption of AI-developed models for implementation in acute and critical
    care.
- response: Labeling data with targets important for prediction using a visualization and
    annotation environment.
addressing_gaps:
- response: There is an urgent need for infrastructure to support artificial intelligence
    and machine learning in critical care; developing high-resolution multi-center data sets
    is a critical first step towards actionable and trustworthy AI.
- response: Existing critical care data lack the diversity and resolution needed for AI; the
    project acquires and standardizes a dataset of unprecedented diversity and high resolution
    across a multi-center network.
- response: Multi-modal EHR, waveform, imaging, and text data are not harmonized; unified
    standards and validated semantic mappings are developed to make them interoperable.
