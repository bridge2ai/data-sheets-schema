id: https://chorus4ai.org/#dataset
name: CHoRUS Dataset
description: The CHoRUS dataset is a multicenter, multimodal, high-resolution, controlled-access
  dataset of acute and critical care hospital admissions, assembled retrospectively by the
  CHoRUS Network, one of four data generation projects in the NIH Common Fund's Bridge2AI
  program. Data are contributed by 14 data acquisition hospitals among the 20 academic centers
  in the collaboration, whose membership is given as more than 60 consortium members. Structured
  electronic health record data are standardized to the OMOP Common Data Model; unstructured
  EHR text is extracted and tokenized with the OHNLP toolkit; imaging is drawn from hospital
  PACS in DICOM; telemetry waveforms from bedside monitors and gateway/middleware are released
  in WFDB; and EEG waveforms from hospital EEG databases are released in EDF+ and Persyst
  formats. Social determinants of health and contextual factors such as geographic distance
  to the nearest hospital are also acquired. The project website reports a current released
  dataset of 50,000 patient admissions from ICU, PICU, and NICU settings, 1.6 billion rows
  of EHR OMOP data, 7,642 admissions with radiology data, and 23 Tb of waveform data, against
  an anticipated final dataset of 100,000 patient admissions covering 9 data modalities from
  14 contributing hospitals. The nine documented data types are demographics, medication administration,
  procedures, nursing flowsheets, diagnoses, clinical notes, imaging, waveform telemetry,
  and EEG waveform; every one of them is under controlled access. OMOP and telemetry data
  sit in a cloud enclave, clinical notes remain stored locally at contributing sites with
  only tokens centralized, and as of August 2025 imaging de-identification for a larger cohort
  and EEG extraction were still in process. The project also sequesters a holdout test set
  for external validation of models.
notes: The project website carries a site-wide banner reading "This repoitory is under review
  for potential modification in compliance with Administration directives." The misspelling
  of "repository" is reproduced as published. The same website carries the funding statement
  "This project is funded by the NIH under award number OT2OD032701. The content on this website
  is solely the responsibility of the authors and does not necessarily represent the official
  views of the NIH."
source_caveats: 'The two sources that quantify the dataset disagree. The tier-2 project documentation
  (chorus4ai.org) states a current released dataset of 50,000 patient admissions and 7,642
  admissions with radiology data; the tier-4 cohort_2_webinar states that "As of August 2025,
  covers 14 different hospitals with over 45K unique admissions" and that 1000 images are
  currently available. The tier-2 values are stated in this record, with the webinar''s August
  2025 snapshot reported where it describes modality readiness; the conflict is also recorded
  on the individual values it affects. The two imaging figures are expressed in different
  units (images versus admissions with radiology data) and may not be directly comparable.
  A single OTHER term in conforms_to_standard stands for three distinct standards the registered
  enum does not cover: EDF+, Persyst, and the OHNLP open source schema. The WFDB entry likewise
  covers a schema the source describes as extended rather than plain WFDB. The bundle gives
  no release date, DOI, version identifier, or recommended citation for the dataset, and does
  not state the language of the dataset content.'
